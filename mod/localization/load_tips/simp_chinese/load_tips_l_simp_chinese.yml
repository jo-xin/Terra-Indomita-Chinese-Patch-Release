l_simp_chinese:
 LOADING_TIP_0:0 "犯法必为夺权，非此则应守之。——盖乌斯·尤利乌斯·恺撒"
 LOADING_TIP_1:0 "助我之友，犯我之敌，我皆报之。——卢基乌斯·科尔内利乌斯·苏拉"
 LOADING_TIP_2:0 "国家越腐败，法律就越多。——浦布利乌斯·科耳涅利乌斯·塔西佗"
 LOADING_TIP_3:0 "共同的危险是最牢固的纽带；它使人们在相互厌恶和猜疑的情况下仍能保持团结。——提图斯·李维"
 LOADING_TIP_4:0 "人们不在乎自己活得多高贵，只在乎自己能活多久，虽然人人都能活得高贵，但没有人能长生不死。——卢基乌斯·安奈乌斯·塞涅卡"
 LOADING_TIP_5:0 "此外，我认为迦太基必须被毁灭！——马库斯·波耳基乌斯·加图"
 LOADING_TIP_6:0 "的确，如果一个人从一开始就不相信别人，那就不可能被背叛。——马丁努斯·安瓦耳迪乌斯（群星前总监）"
 LOADING_TIP_7:0 "法是善也。然，法言有几何耶？曰：少漏、众善、慈愍、布施、真谛及三业清净。——阿育王法敕，石柱法敕第二章"
 LOADING_TIP_8:0 "你抱怨我写长诗，维洛克斯；可你什么也不写，你的诗自然更短。——马库斯·瓦勒里乌斯·马提亚尔"
 LOADING_TIP_9:0 "骰子已经掷出。——盖尤斯·尤利乌斯·凯撒渡过卢比孔河时所说，自此入侵意大利。"
 LOADING_TIP_10:0 "至于我，当你想开怀一笑时，总会发现我状态正佳……肥硕光润，真是伊壁鸠鲁猪群中的一头猪。——昆图斯·贺拉斯·弗拉库斯"
 LOADING_TIP_11:0 "人被言语鼓动飞。——阿里斯托芬"
 LOADING_TIP_12:0 "每位统治者当铭记三件事。第一，他统治的是人；第二，他根据法律统治；第三，他的统治并非永恒。——阿伽同"
 LOADING_TIP_13:0 "大书即大恶。——卡利马科斯"
 LOADING_TIP_14:0 "友达，则缓；友难，则疾。——斯巴达的契罗"
 LOADING_TIP_15:0 "勇气与谨慎并用方为良品，若无谨慎，止增害耳。——伊索克拉底"
 LOADING_TIP_16:0 "若不是我爱你胜过自己的眼睛，最可爱的卡尔乌斯，我会因你这份礼物而像憎恨瓦提尼乌斯一样憎恨你：我做了什么、说了什么，你竟用这么多诗人恶毒地毁掉我？——盖乌斯·瓦勒里乌斯·卡图卢斯"
 LOADING_TIP_17:0 "发于首之疾最恶，人如此，国亦如此。——小普林尼"
 LOADING_TIP_18:0 "遭遇海难者，面对静海亦会战栗。——浦布利乌斯·俄维狄乌斯·纳索"
 LOADING_TIP_19:0 "况且，不光荣之事也不可能安全。若我们必须倒下，就让我们迎向危险。——拉科与伊刻卢斯，加尔巴皇帝的顾问"
 LOADING_TIP_20:0 "在傻子面前卖弄学问之人，亦是饱学之人眼中的傻子。——马库斯·法比乌斯·昆提利安"
 LOADING_TIP_21:0 "他意识到我们的城邦需要一位指挥官，希腊也需要一个城邦去肩负起领导重任，因此他为祖国奉献自己，为希腊奉献这座城邦，为了自由的事业。——许佩雷得斯"
 LOADING_TIP_22:0 "“我没有时间，”德米特里说。“那就别当国王，”老妇人喊道。——普鲁塔克"
 LOADING_TIP_23:0 "若至天下跪服之日，我等又将何为？——齐纳斯"
 LOADING_TIP_24:0 "我们留下了多么美好的战场呀，我的朋友，就留给罗马人和迦太基人去玩吧！——皮洛士"
 LOADING_TIP_25:0 "“那么，”他们说，“为何不趁我们的血还未干，立刻率我们攻向敌人？”马略平静地回答：“我们必须先把营地筑牢。”——普鲁塔克"
 LOADING_TIP_26:0 "滚蛋吧，先生们，这些长篇大论也不必多说；我受罗马所派来到雅典不是要学习历史，而是要镇压叛乱。——卢基乌斯·科尔内利乌斯·苏拉"
 LOADING_TIP_27:0 "哀求者必先开口，胜利者只需沉默。——卢基乌斯·科尔内利乌斯·苏拉"
 LOADING_TIP_28:0 "盾牌很精美，年轻人；但罗马人更应将希望放在右手而不是左手上。——西庇阿·埃米利安努斯"
 LOADING_TIP_29:0 "只要西庇阿尚在，罗马就不会亡；罗马若亡，西庇阿也无法独存。——西庇阿·埃米利安努斯"
 LOADING_TIP_30:0 "罗马民族绝不甘于失败。当前的绝境无论带来怎样的耻辱，都将灼烧他们的灵魂，其怨怼无绝，令他们不知疲倦，直到你为此偿还数倍于此的代价。——赫伦尼乌斯"
 LOADING_TIP_31:0 "坏小子们，你们怎敢冒犯随菲利普与亚历山大征服世界的父辈？——安提革涅斯"
 LOADING_TIP_32:0 "我建议你们要么征服自己，要么就与征服者站在一起。——福基翁"
 LOADING_TIP_33:0 "即使一事无成，至少我能让一名敌人的剑变钝。——斯巴达俗语"
 LOADING_TIP_34:0 "现在是傲慢横暴得势，也是灾难和仇恨的时候。孩子们！现今你们对法律应热诚服膺，应为我们祖先的盟约舍生致命。——玛塔提雅"
 LOADING_TIP_35:0 "尽管尚有许多王国分隔在我与他们的帝国之间，但因为得知我富有且不愿为奴，罗马人就挑起了与我的战争。——米特里达梯"
 LOADING_TIP_36:0 "你可知道罗马人转向东方只是因为其西进的步伐被大洋所阻？你可知道他们生存之初一无所有，他们的家园、妻子、土地甚至帝国都是偷抢所得的？他们是无父无母、也没有祖国的野狗，生来就是整个世界的灾难。——米特里达梯"
 LOADING_TIP_37:0 "那个迦太基人拖带着的军队甚至不由非洲本地人组成，他从大地最遥远的角落招来士兵，他们来自大洋的各个海峡和海格力斯之柱。——盖乌斯·特壬提乌斯·瓦罗"
 LOADING_TIP_38:0 "在那里，马略凝视着迦太基，迦太基也看着马略，相互都能给予对方安慰。——马库斯·维勒乌斯·帕忒耳库卢斯"
 LOADING_TIP_39:0 "只要有可能，谁能忍住不去染指利比亚的迦太基呢；当年阿伽托克勒斯正是为了这座城，暗中离开叙拉古，带着几条船横渡海洋，差点就能拿下这座城，却失之交臂。——皮洛士"
 LOADING_TIP_40:0 "生于何，死亦归焉。——米利都的阿那克西曼德罗斯"
 LOADING_TIP_41:0 "当神明要反对你，即使最强壮的人也无法幸免。——索福克勒斯"
 LOADING_TIP_42:0 "我不想作一篇冗长的演说来评论一些你们都很熟悉的问题，所以我不谈我们用以取得我们势力的一些军事行动，也不谈我们的父辈英勇地抵抗我们希腊内部和外部敌人的战役。——伯里克利"
 LOADING_TIP_43:0 "整个一年之中，有各种定期的赛会和祭祀；在我们的家庭中，我们有华丽而风雅的设备，每天怡娱心目，使我们忘记了我们的忧虑。——伯里克利"
 LOADING_TIP_44:0 "希腊人，我将你们带领至此，是为了让你们见识一下带头的那个米底人有多么愚蠢；他的一生已经积累了巨量财富，却不远万里至此还想夺走我们的财产。可鄙！——保萨尼亚斯"
 LOADING_TIP_45:0 "哪怕只有一千人反对你，这一千人也会战斗到底。——德玛拉图斯"
 LOADING_TIP_46:0 "我们所作的没有什么特殊，没有什么违反人情的地方；只是一个帝国被献给我们的时候，我们就接受，以后就不肯放弃了。——修昔底德"
 LOADING_TIP_47:0 "所有没有付诸行动的演讲都是苍白无力的，特别是那些关于我们共同体的演讲；因此，我们越被人认为想在那些演讲中拔高自己，我们的说辞就越让所有人怀疑。——德摩斯梯尼"
 LOADING_TIP_48:0 "扬帆远航，勿惧生死。——“伟人”格奈乌斯·庞培"
 LOADING_TIP_49:0 "给我一个支点，我就能够撬动地球。——阿基米德"
 LOADING_TIP_50:0 "我要求你们，不要弄乱那团沙子！——阿基米德的遗言，彼时他正在沙子上画圆圈"
 LOADING_TIP_51:0 "虔诚的皮洛士是摩洛西亚诸王的后裔，把精美的盾牌奉献给埃托尼斯的圣地，\\\\n这是他从英勇的高卢人赢得的战利品，安提戈诺斯和他的党羽逃到大海之滨，\\\\n埃阿喀得斯家族无敌的名声举世称誉，千秋万世永远受到密涅瓦女神的保佑。\\\\n——阿乌斯战役后皮洛士献于密涅瓦神庙"
 LOADING_TIP_52:0 "……这类事情都是无稽之谈，毫无根据可言，仅供市井小民茶余酒后消遣之用。大家应该记得只要刀剑在手，必须服膺下面这句话：名王口吐狂言，敌人命丧黄泉！——皮洛士，于梦中预兆遭质疑后"
 LOADING_TIP_53:0 "他们破坏、屠杀、谋权篡位，称这就是帝国。将其夷为荒地后，称这就是和平。——喀里多尼亚酋长卡加库斯评价罗马人"
 LOADING_TIP_54:0 "一时逃兵，亦能重拾勇气战斗。——米南德"
 LOADING_TIP_55:0 "时常提醒自己，你也不过只是肉体凡身。——米南德"
 LOADING_TIP_56:0 "即便身处苦境，也能从中作乐。——米南德"
 LOADING_TIP_57:0 "众神偏爱之人皆英年早逝。——米南德"
 LOADING_TIP_58:0 "小心驶得万年船。朋友教不会你这个原则，可敌人会立即对其加以利用。城市也是从其敌人处学会了修造高墙和战船，而并非从其朋友处。——阿里斯托芬"
 LOADING_TIP_59:0 "当神明引一个人的心走向毁灭时，恶有时也会在他眼中显得为善。——索福克勒斯"
 LOADING_TIP_60:0 "怀揣人生无常之念，方能在得意时不过分欢愉，在失意时不过分消沉。——伊索克拉底"
 LOADING_TIP_61:0 "阿瑞斯憎恨那些踌躇不决之人。——欧里庇得斯"
 LOADING_TIP_62:0 "少时若不学习，便蹉跎了岁月，亦失去了未来。——欧里庇得斯"
 LOADING_TIP_63:0 "伟大的功绩无法一蹴而就，这是自然法则，最美好的事情往往都是举步维艰。——马库斯·法比乌斯·昆提利安"
 LOADING_TIP_64:0 "斯巴达人准允希俄斯岛人脏乱不堪。——斯巴达宣言，由普鲁塔克记载"
 LOADING_TIP_65:0 "不自助者，天亦难助。——索福克勒斯"
 LOADING_TIP_66:0 "恐惧？恐惧何用之有？机会主宰着人生，未来一片未知。享受生活，日复一日，方为王道。——索福克勒斯"
 LOADING_TIP_67:0 "世间奇观万千，而人为之最。——索福克勒斯"
 LOADING_TIP_68:0 "不降临人世无疑是最优之选。可若已瞧见世间的第一缕晨曦，即刻以最快速度从来处钻回便是次优之选。——索福克勒斯"
 LOADING_TIP_69:0 "身为百兽之王的狮子，在押置于牢笼时也会面朝外方，即便牢笼是由黄金制成。我身为这偌大宫殿的帝皇，却也是面朝外方。——国王弥兰达（巴克特里亚的米南德一世）"
 LOADING_TIP_70:0 "我本是人类，人类于我并不陌生。——浦布利乌斯·特壬提乌斯·阿福尔"
 LOADING_TIP_71:0 "对于这样的统治者，我只能嗤之以鼻：他们知晓国治久安之道，却出于某种原因怯于将其付诸执行。而同样，我也不需要那些将私交之情凌驾于公共福祉上的统治者。——索福克勒斯"
 LOADING_TIP_72:0 "只要将军无论宣讲什么，都能证明自己最善于身体力行，部下便很少会轻视他。——色诺芬"
 LOADING_TIP_73:0 "凯撒·屋大维前来拷上这只嗜血怪物。她，想要更加高贵地死去。她不会像女人一样畏惧利剑光芒，或是领着快船畏缩在岸边。她会杀出重围，面无表情地直视倒塌的宫殿，她英勇逼人，敢只身对抗凶恶巨蟒，用其身躯渴饮这黑色毒液。——昆图斯·贺拉斯·弗拉库斯评论克娄巴特拉"
 LOADING_TIP_74:0 "如我们所言，时间正在残酷流逝。把握当下，对明日少抱些期盼。——昆图斯·贺拉斯·弗拉库斯"
 LOADING_TIP_75:0 "被征服的希腊反而俘获了野蛮的征服者，并把技艺带入质朴的拉丁姆。——昆图斯·贺拉斯·弗拉库斯"
 LOADING_TIP_76:0 "啊！是将军们！人可真多，但似乎没有多大用处！——阿里斯托芬"
 LOADING_TIP_77:0 "-当我起身前往市场时，当局正采取措施，想用最快的方式杀掉我们。\\\\n-这真是让你摆脱所有烦恼的最好方式！——阿里斯托芬"
 LOADING_TIP_78:0 "快，快拿一壶酒来，酒香浸透头皮时，也许我能想出个绝妙的主意。——阿里斯托芬"
 LOADING_TIP_79:0 "我们必须翻找每一块石头，以防下面藏着什么演说家，冷不丁地刺你一下。——阿里斯托芬"
 LOADING_TIP_80:0 "鱼放三天发臭，客住三天讨嫌。——提图斯·马克修斯·普劳图斯"
 LOADING_TIP_81:0 "从他人的经验中获取智慧之人，是快乐之人。——提图斯·马克修斯·普劳图斯"
 LOADING_TIP_82:0 "奥腓狄乌斯在此——庞贝街头涂鸦"
 LOADING_TIP_83:0 "噢墙壁啊，我很惊讶，你居然能撑起这么多无趣的涂鸦而不坍塌为废墟——庞贝街头涂鸦"
 LOADING_TIP_84:0 "要是能用你骗人的伎俩糊弄糊弄你该多好，旅馆老板。你卖的是水，自己喝的却是醇正美酒——庞贝街头涂鸦"
 LOADING_TIP_85:0 "我接下来要说的话是你能想到的唯一真话：我是个骗子。——来自萨摩萨塔的卢基安"
 LOADING_TIP_86:0 "虽说你一直捧书苦读，可你却对所读内容一无所知。要我说，你就像那扇着耳朵听着琴声的蠢驴。——来自萨摩萨塔的卢基安"
 LOADING_TIP_87:0 "可是水啊，劣质的葡萄酒啊，都滚一边去吧，滚得越远越好，去祸害那些清醒的人。这里的巴克斯可是相当醇正。——盖乌斯·瓦勒里乌斯·卡图卢斯"
 LOADING_TIP_88:0 "凯撒是每位妻子的丈夫，也是每位丈夫的妻子！——马库斯·图利乌斯·西塞罗"
 LOADING_TIP_89:0 "你为何对所有事情闷闷不乐？\\\\n你没有流汗吐痰，也没有流鼻涕。——盖乌斯·瓦勒里乌斯·卡图卢斯"
 LOADING_TIP_90:0 "天所爱者皮耶达西王如此说道：行善是困难的。首先行善的人，做的是难行之事。——阿育王第五法敕"
 LOADING_TIP_91:0 "也不应举行节庆，因为天所爱者皮耶达西王在这类节庆中看见许多可责之处。——阿育王第一法敕"
 LOADING_TIP_92:0 "凡没有适合人类或动物使用的药草之处，我都已命人引入并种植。凡没有药根或药果之处，我都已命人引入并种植。我还沿道路凿井植树，以利人畜。——阿育王第二法敕"
 LOADING_TIP_93:0 "敬重母亲与父亲是善，慷慨对待朋友、熟人、亲族、婆罗门与沙门是善，不杀害生灵是善，节制花费与节制储蓄也是善。——阿育王第三法敕"
 LOADING_TIP_94:0 "天车、吉象、火体及其他神圣显现已有许多百年未曾出现。但如今，因为天所爱者皮耶达西王提倡克制杀害与伤害生灵，提倡善待亲族、婆罗门与沙门，并尊敬母亲、父亲和长者，这类显现已经增多。——阿育王第四法敕"
 LOADING_TIP_95:0 "天所爱者皮耶达西王如此说道：过去，国家事务并非时时处理，报告也不会随时送达国王。但如今我已下令，无论我在进食、后宫、寝室、战车、轿舆、园苑或任何地方，都要安排报告者奉命向我报告人民事务，使我无论身在何处都能处理这些事务。——阿育王第六法敕"
 LOADING_TIP_96:0 "天所爱者皮耶达西王希望一切宗教都能居于各处，因为它们都渴望自制与心灵纯净。但人们有各种欲望和各种激情，他们可能践行全部应行之事，也可能只践行其中一部分。然而一个人即使接受厚礼，却缺乏自制、心灵纯净、感恩与坚定虔敬，这样的人便是卑劣的。——阿育王第七法敕"
 LOADING_TIP_97:0 "天所爱者皮耶达西王所作的一切努力，都只是为了人民在来世的福祉，并使他们少有恶行。没有功德便是恶。无论卑微者还是尊贵者，若非付出巨大努力并放弃其他利益，都难以做到这一点。事实上，对尊贵者而言，这或许更加困难。——阿育王第十法敕"
 LOADING_TIP_98:0 "凡因过度虔敬而赞美自己的宗教，并怀着“我要荣耀自己的宗教”的想法谴责他人者，其实反而更严重地伤害了自己的宗教。因此，彼此聆听与尊重才是善。——阿育王第十二法敕"
 LOADING_TIP_99:0 "天所爱者皮耶达西王在加冕八年后征服了羯陵伽。十五万人被迁徙，十万人被杀，另有更多人死于其他原因。羯陵伽被征服后，天所爱者开始强烈倾向于法，热爱法，并热爱关于法的教导。如今，天所爱者对征服羯陵伽深感懊悔。——阿育王第十三法敕"
 LOADING_TIP_100:0 "不为人生盛衰所触动的心，远离忧愁、清净而安稳的心，这便是最高的祝福。——乔达摩·佛陀，《吉祥经》"
 LOADING_TIP_101:0 "若行旅中找不到胜过自己或与自己相当的人，就应决意独行；愚者之间没有友谊。——《法句经》第五品"
 LOADING_TIP_102:0 "当此世常在燃烧，为何欢笑，为何喜悦？身披黑暗，你们难道不寻找光明吗？——《法句经》第十一品"
 LOADING_TIP_103:0 "年少时未修梵行，也未积聚财富的人，便如无鱼池中的老鹤般衰萎。——《法句经》第十一品"
 LOADING_TIP_104:0 "能调伏此心实为奇妙；此心难以调伏，迅疾不定，攫取一切所欲。被驯服的心带来安乐。——《法句经》第三品"
 LOADING_TIP_105:0 "如洪水卷走沉睡的村落，死亡也会带走心神散乱、只采撷欲乐之花的人。——《法句经》第四品"
 LOADING_TIP_106:0 "世间盲目；此处只有少数人具备洞见。只有少数人像脱网之鸟一样前往安乐境界。——《法句经》第十三品"
 LOADING_TIP_107:0 "治水者调御水流，造箭者矫直箭杆，木匠塑造木材，善人则调御自身。——《法句经》第十品"
 LOADING_TIP_108:0 "放下过去，放下未来，放下现在，渡向存在的彼岸。心完全解脱之后，你将不再经历生死。——《法句经》第二十四品"
 LOADING_TIP_109:0 "有些人没有意识到我们终有一日都会死去。那些意识到这一点的人，便会平息他们的争执。——《法句经》第一品"
 LOADING_TIP_110:0 "在所有这些人中，比利其人最为勇敢，因为他们离我行省的文明与教化最远，商人也最少前往他们那里，输入那些会使人心柔弱的东西。——盖乌斯·尤利乌斯·凯撒"
 LOADING_TIP_111:0 "阿里奥维斯图斯答复这次使节说，若他自己需要凯撒什么东西，他会去见凯撒；若凯撒想要他什么东西，也应当到他这里来。此外，他既不敢在没有军队的情况下进入凯撒占有的高卢地区，也无法不付出巨大费用和麻烦便把军队集中到一处；更何况在他看来，凯撒或罗马人民究竟凭什么来管他在战争中征服的高卢，实在奇怪。——《高卢战记》"
 LOADING_TIP_112:0 "阿里奥维斯图斯在营地和沼泽中躲了许多个月，一直不给交战机会；等他们已经对战斗绝望并四散开来时，他突然袭击他们，并且更多凭借计谋与狡诈而非勇武取得胜利。——《高卢战记》"
 LOADING_TIP_113:0 "这番演说发表后，众人的心意以惊人的方式转变，激起了追击战争的最高热情与渴望；第十军团首先通过军团保民官向他致谢，感谢他表达了如此高度的赞许，并向他保证他们已经完全准备好继续作战。——《高卢战记》"
 LOADING_TIP_114:0 "罗马人民的友谊应当成为他的荣耀与保障，而不是损害；他也是怀着这种期望寻求这份友谊的。但如果罗马人民要让贡赋中止，又诱使那些归降者离开他，他就会像当初热心寻求罗马友谊一样，毫不犹豫地放弃它。——《高卢战记》"
 LOADING_TIP_115:0 "“那可真是一笔财富，”艾利尔说，“我们从未听说也从未知道；可你所有的不过是女人的财富，邻近土地的敌人惯常从你那里劫走他们夺取的战利品与掠物。”——《库阿林格夺牛记》"
 LOADING_TIP_116:0 "“我以我所敬奉的诸神起誓，”达雷说道，“他们绝不会用卑劣手段夺走他们无法用正当方式取得的东西！”——《库阿林格夺牛记》"
 LOADING_TIP_117:0 "并告诉他，只要他能对敌军施展英勇事迹，不论抵挡多久都是他的荣耀；但与其在任何一名勇士面前逃跑，不如藏身起来。——《库阿林格夺牛记》"
 LOADING_TIP_118:0 "由于与库丘林约定的单挑盟约和条件已被破坏，库丘林那天拿起投石索，开始从南方的德尔加小投矛向大军射击。尽管那天爱尔兰人众多，无论是人、马还是犬，没有一个敢转脸向南面对库丘林。——《库阿林格夺牛记》"
 LOADING_TIP_119:0 "那头公牛的牧人不许他们带走库阿林格的棕牛，于是他们驱赶公牛，用矛杆敲打盾牌，直到把它逼入一处狭窄缺口；牛群把牧人的身体踩入地下三十英尺，将他的身体踏成碎片与残块。他名叫福尔格门。这便是库阿林格夺牛中福尔格门之死。——《库阿林格夺牛记》"
 LOADING_TIP_120:0 "依我看，这就是年轻人在学校里长成蠢材的原因：他们既看不到也听不到任何与日常生活处境相关的东西，只听见海盗在海岸潜伏、手中拿着镣铐，暴君颁布敕令强迫儿子砍下父亲的头，瘟疫时神谕命令牺牲三名或更多处女以止息灾祸；甜如蜜、圆润漂亮的句子，词语和事实都仿佛撒上了罂粟和芝麻。——《萨蒂利孔》"
 LOADING_TIP_121:0 "我快饿死时还能怎么办，蠢货？难道停下来听一串比碎玻璃叮当声好不了多少的空话，或听梦书里荒唐的解释？以伟大的赫拉克勒斯之名起誓，你比我还卑贱；为了混一顿饭，你竟屈尊去奉承一个诗人！——《萨蒂利孔》"
 LOADING_TIP_122:0 "“你看，恩科尔庇乌斯，”他说，“你难道沉溺享乐到从不想到我们的钱已经花光，剩下那些小玩意也毫无价值吗？夏天城里一无是处；乡下运气会好些。我们去拜访朋友吧。”——《萨蒂利孔》"
 LOADING_TIP_123:0 "任何奴隶未经主人许可出门远行，都应受一百鞭。——《萨蒂利孔》"
 LOADING_TIP_124:0 "我们正在读酒标时，特里马尔基奥拍着手喊道：“哎呀！想想看，酒竟比可怜的人类还长寿！好了，干杯吧！酒中有生命。这可是正宗的奥皮米安酒，我向你们保证。昨天我拿出的酒都没有这么好，而昨天与我同席的可是比你们高贵得多的人。”——《萨蒂利孔》"
 LOADING_TIP_125:0 "我一向急切地想探究稀奇神异之事；而此刻我知道自己正身处帖撒利腹地，那里是魔法之乡，其强力咒术举世称颂。又想到我亲爱的朋友阿里斯托墨涅斯的故事正发生在这座城中，我便被欲望与急躁攫住，出发去仔细查看一切。——《金驴记》"
 LOADING_TIP_126:0 "若我作为广场异域言语中的粗陋表演者有所冒犯，我预先请求你的宽恕。事实上，需要时变换嗓音本身便会像马戏骑手的技艺一样奏效。我们即将踏上一则希腊故事。读者，请留意，并从中获得乐趣。——《金驴记》"
 LOADING_TIP_127:0 "但我的好奇心被唤起了；我一听见“魔法”这个词，不但没有对庞菲勒心生戒备，反而自愿而主动地渴望投身其中做学徒，无论代价如何，哪怕一头跃入最深的坑底。——《金驴记》"
 LOADING_TIP_128:0 "黎明刚举起玫瑰色的手臂，开始驱赶饰有紫色鞍具的马匹穿越天空，我便从无忧的睡眠中醒来，黑夜把我交给了白昼。想起昨晚的暴行，痛苦涌满心头；我蜷坐床上，双足交叠，双手紧扣，手指抱住膝头，泪流不止，脑中已经浮现出市场、审判、判决以及刽子手本人。——《金驴记》"
 LOADING_TIP_129:0 "至于罪行本身，既然必须严厉公布，连罪犯本人也不否认其所为。但还有一项缺失的信息，即他这桩大胆重罪的同谋姓名，因为他几乎不可能独自杀死三名强壮男子。因此真相现在将通过拷问取得。——《金驴记》"
 LOADING_TIP_130:0 "关心竞技和身体保养的人，不只考虑状态与训练，也会在适当时候考虑休息；事实上，他们把休息视为训练的主要部分。同样，我认为读书甚多、研习严肃作品的学生，也可以让心智适当放松，使其为今后的劳作恢复更好状态。——《真实故事》"
 LOADING_TIP_131:0 "从前，我从赫拉克勒斯之柱出发，乘顺风驶向西方大洋，开始一场航行。此行的动机与目的，在于我的求知活动和冒险欲望，也在于我想弄清大洋的尽头是什么，以及住在彼岸的人是谁。——《真实故事》"
 LOADING_TIP_132:0 "我们离海穿过树林前行约三斯塔狄亚后，看见一块青铜碑，上面刻着希腊字母，字迹模糊残缺，写着：“赫拉克勒斯与狄俄尼索斯曾至此处。”我们行礼后继续前进，没走多远便遇见一条酒河，几乎与希俄斯酒一模一样。河流宽阔而充盈，有些地方甚至可以航行。看见狄俄尼索斯到访的证据后，我们不能不更加相信碑文。——《真实故事》"
 LOADING_TIP_133:0 "大约正午时，岛屿已经看不见了，突然刮起一阵旋风，将船旋转着卷起，抬到空中约三百斯塔狄亚高，并且再也不让它落回海面；船悬在高处时，一阵风吹击船帆，鼓起帆布推着它向前。我们在空中航行了七日七夜，第八天看见空中有一片大国土，形似岛屿，明亮圆整，闪耀着强光。——《真实故事》"
 LOADING_TIP_134:0 "他打量我们，并从我们的衣着作出判断后说道：“那么你们是希腊人，对吗，异乡人？”我们承认后，他又说：“那么你们是怎样穿过这么多空气来到这里的？”我们把一切告诉了他，他便开始讲述自己的事：他说自己也是人类，名叫恩底弥翁，曾在睡梦中从我们的国土被掳走，来到这里后成为此地之王。他说他的国家就是照耀我们的月亮。——《真实故事》"
 LOADING_TIP_135:0 "滑翔兵确实是步兵，但他们不用翅膀便能在空中飞行。至于飞行方式，他们把长袍从腰带中拉起，让宽松衣褶像船帆一样鼓满风，便如小船般被带着前进。多数时候他们在战斗中充当轻步兵。据说卡帕多西亚上空的星辰还会派来七万名雀谷兵和五千名鹤龙骑。——《真实故事》"
 LOADING_TIP_136:0 "至于我们，那天被带往太阳，双手被一段蛛网绑在背后。敌人决定不围攻城市，而是在返回途中于空中筑起一道墙，使太阳光不再照到月亮。那墙由云筑成，有两重，于是真正的月食发生了，月亮完全被连绵黑夜笼罩。——《真实故事》"
 LOADING_TIP_137:0 "在那个国家，秃头无毛的人被认为美丽，他们十分厌恶长发者。彗星上的情况则不同，那里的人认为长发者美丽；月亮上的访客曾向我们谈起此事。还有一点，他们的胡须长到膝盖稍上方，而且没有脚趾甲，人人只有一个脚趾。每个人臀部上方都长着一片长长的卷心菜叶，像尾巴一样，总是青绿，即使仰面摔倒也不会折断。——《真实故事》"
 LOADING_TIP_138:0 "米蒂利尼是莱斯博斯岛上一座美丽的大城。一道水流平缓、来自海上的海峡将它与大陆隔开。许多木桥和洁白闪亮的石桥装点着道路。你会觉得眼前所见不是一座城市，而是一座岛。——朗戈斯，《达夫尼斯与克洛伊》"
 LOADING_TIP_139:0 "拉蒙起初想拿走信物，留下婴儿，但羞愧随即涌上心头。“难道我对一个婴儿的仁慈还不如一只山羊吗？”他等到夜幕降临，借着夜色把一切带回家给妻子米尔塔勒：信物、孩子，还有那只山羊。米尔塔勒困惑地问：“山羊也会生孩子吗？”——朗戈斯，《达夫尼斯与克洛伊》"
 LOADING_TIP_140:0 "德律阿斯和拉蒙为所见之事不安。难道这些孩子最后要成为牧羊人与牧山羊人吗？明明襁褓预示着更好的结局与命运。难道正因为那份命运，他们才用精美食物抚养孩子，教他们识字，并教给他们许多乡野生活中的美好事物吗？——朗戈斯，《达夫尼斯与克洛伊》"
 LOADING_TIP_141:0 "春天已经将尽，夏天正要开始。万物都处在最灿烂的时刻。树上果实累累，平原铺满挺立的庄稼，蝉声悦耳回荡。果实散发甜香，畜群欢快鸣叫。你会以为连缓缓流动的河水也在歌唱，风吹过松林发出笛声，苹果渴望坠向大地，而爱美的太阳正脱去每个人的衣裳。——朗戈斯，《达夫尼斯与克洛伊》"
 LOADING_TIP_142:0 "他们决定尊敬自己的恩人。他们与多尔孔的亲属一起埋葬这个可怜的人，在他身上堆起许多泥土，栽下许多培育的植物，并悬挂他们劳作的初熟果实作为祭品。他们倾倒牛奶祭奠，压榨葡萄串，又在他身上折断许多牧笛。人们听见母牛哀伤的低鸣，也看见一些母牛惊乱奔跑。在羊群与牛群之间看来，这些举动便是母牛对牧人之死的哀悼。——朗戈斯，《达夫尼斯与克洛伊》"
 LOADING_TIP_143:0 "我将从你开始，福玻斯啊，述说古代众人的著名事迹：他们奉珀利阿斯王之命，驾着座椅坚固的阿尔戈号，穿过本都海口与蓝色撞岩之间，疾驰去寻求金羊毛。——《阿尔戈英雄纪》"
 LOADING_TIP_144:0 "母亲啊，我求你不要过多积聚苦涩悲伤；你无法用眼泪把我从灾厄中赎回，只会在悲伤上再添悲伤。诸神分给凡人的苦难不可预见；即使心怀悲痛，也要坚强承受属于你的份额；从雅典娜的承诺和诸神的回答中汲取勇气吧……——《阿尔戈英雄纪》"
 LOADING_TIP_145:0 "虚妄的可怜人啊，你正提前为自己谋划毁灭。难道清酒使你胸中鲁莽之心膨胀，终至自取灭亡，并驱使你侮辱诸神吗？世上还有别的安慰之言，可以让人鼓励同伴；可你说出口的却全然轻率。——《阿尔戈英雄纪》"
 LOADING_TIP_146:0 "来吧，用你的预言术告诉我：诸神是否也会让你父亲为阿洛伊代之子许下的那种命运降临到我身上？你也好好想想，若你被抓到作出如空风般虚妄的预言，又该如何从我手中活着逃脱。——《阿尔戈英雄纪》"
 LOADING_TIP_147:0 "埃宋之子啊，若我因愚昧犯错，请不要向我发怒；悲痛迫使我说出了傲慢而不可容忍的话。但让我把过错交给风吧，让我们的心像从前一样连在一起。——《阿尔戈英雄纪》"
 LOADING_TIP_148:0 "听着，海上的漂泊者们，听听你们该知道的事。凡来到贝布律刻斯人的异乡人，若不举手与我交战，按规矩不得离去。因此从你们队伍中选出最勇敢的战士，让他立刻到这里与我拳斗。若你们不理会，并把我的命令踩在脚下，严酷的必然性必将降临到你们身上，使你们悔恨。——《阿尔戈英雄纪》"
 LOADING_TIP_149:0 "但那位英雄始终未受创伤，他凭技巧挫败敌人的冲击，又迅速观察对方凶狠的拳法，看清哪里力量不可战胜，哪里较为薄弱，于是不断站稳并以拳还拳。正如造船匠用锤击打船木，使其贴合锋利夹具，层层固定，敲击声接连回响；双方的面颊与下颌也这样撞响，牙齿发出巨大碎响。他们不停出拳，直到艰难喘息压倒二人。随后他们稍稍分开，疲惫地喘着气，擦去额头上大量汗水。接着又一同冲上前去，像两头公牛为争夺牧场中的小母牛而狂怒相斗。——《阿尔戈英雄纪》"
 LOADING_TIP_150:0 "当太阳从远方土地升起，照亮带露的山丘并唤醒牧人时，他们便从月桂树干上解开缆绳，把所需带走的全部战利品装上船；随后乘着顺风，驶过旋涡翻卷的博斯普鲁斯。——《阿尔戈英雄纪》"
 LOADING_TIP_151:0 "不幸的人啊，我想凡人中没有谁比你更悲惨。为何这么多哀伤的重担落在你身上？你是否因预言技艺，以有害的愚妄冒犯了诸神？他们因此才对你大发愤怒吗？——《阿尔戈英雄纪》"
 LOADING_TIP_152:0 "那一族人并不关心用牛耕田，也不栽种甜如蜜的果树；他们也不在带露的草地上放牧羊群。相反，他们劈开坚硬而含铁的土地，用工钱换取每日食粮；清晨从不会在没有劳作的情况下为他们升起，他们在寒冷、烟尘弥漫的火焰与浓烟中承受沉重劳动。——《阿尔戈英雄纪》"
 LOADING_TIP_153:0 "命途不济的人啊，你为何如此被绝望击中？我们知道你们如何踏上寻找金羊毛之路；我们知道你们每一项劳苦，也知道你们在陆海漂泊中完成的一切伟业。我们是孤独者，是这片土地的女神，以人声说话，是女英雄，是利比亚的守护者与女儿。起来吧，不要这样沉溺于悲苦，唤醒你的同伴。——《阿尔戈英雄纪》"
 LOADING_TIP_154:0 "是什么使谷田欢笑；在何种星辰之下，墨刻那斯啊，适宜翻土或使榆树与葡萄藤结亲；如何照料公牛；畜牧需要何种辛劳；勤俭的蜜蜂又须经受怎样的耐心考验，这些便是我的主题。——维吉尔《农事诗》"
 LOADING_TIP_155:0 "还要留意林中胡桃何时以繁花披身，并垂下芬芳枝条。若果实繁盛，谷物也会同样丰收，酷热中将有一场盛大的扬谷；但若浓荫因繁叶而丰厚，你的打谷场便只会徒然敲打满是糠秕的秆茎。——维吉尔《农事诗》"
 LOADING_TIP_156:0 "首先，自然生成树木的法则多种多样；有些树凭自身力量自发萌生，无需人手驱使，广布于平原和河曲，如柔韧的柳条、弯曲的金雀花、白杨，以及成群灰绿闪烁的柳树；也有些树由偶然落下的种子长成，如高大的栗树、枝林中最强壮的朱庇特圣栎，以及古希腊人视为神谕之树的橡树。——维吉尔《农事诗》"
 LOADING_TIP_157:0 "但若你更喜爱凶猛骑队与战争阵列，或喜爱在阿尔甫斯河流过的比萨驾车奔驰，在朱庇特林中催动飞驰战车，那么你的马首先要学会面对战士武装的狂怒，忍受号角、车轮长久轰鸣，以及马厩中叮当作响的缰具；随后它会越来越爱主人抚慰的声音，或拍在颈上的响亮手掌。——维吉尔《农事诗》"
 LOADING_TIP_158:0 "不，世上所有人类、野兽、海中族类、畜群和彩羽飞鸟，都奔向那狂烈火焰：爱支配着他们所有。——维吉尔《农事诗》"
 LOADING_TIP_159:0 "承受你的伟大吧，因为时日已近，亲爱的诸神之子，朱庇特的伟大后裔！看啊，世界圆环的威力、大地、辽阔海洋与深邃苍穹都在震动；看啊，一切都为将临之时而沉醉！——维吉尔《牧歌》"
 LOADING_TIP_160:0 "轻捷的鹿会先在空中觅食，海洋会先把鱼赤裸地遗弃在岸上，日耳曼人与帕提亚人会先交换自然疆界，一方饮阿拉尔河，另一方饮底格里斯河；然后他的面容与记忆才会从我心中消逝。——维吉尔《牧歌》"
 LOADING_TIP_161:0 "凡希望超越其他动物的人，都应尽最大力量奋斗，不要像田野中的牲畜那样默默度过一生；自然把那些牲畜塑造成匍匐于地、臣服于欲望的存在。——萨卢斯特"
 LOADING_TIP_162:0 "然而，人类长期以来一直在争论，军事努力究竟是更依靠体力还是智力。——萨卢斯特"
 LOADING_TIP_163:0 "无论在和平还是战争中，都有可能获得声誉；许多行动者和记录他人行为的人都获得了赞美。——萨卢斯特"
 LOADING_TIP_164:0 "然而，我自己，当我年轻时，最初和大多数人一样，被引导从事政治事务；但在那追求中，许多情况对我不利；因为，与谦逊、节制和正直相反，无耻、腐败和贪婪盛行。——萨卢斯特"
 LOADING_TIP_165:0 "据我所知，罗马城的创建者和最早的居民是特洛伊人，他们在埃涅阿斯的带领下，作为流亡者在各地漂泊，没有固定的住所。——萨卢斯特"
 LOADING_TIP_166:0 "但在他们之间，最大的竞争是为了荣耀；每个人都争先恐后地想成为第一个伤害敌人、爬上城墙并在执行这样的壮举时引起注意的人。——萨卢斯特"
 LOADING_TIP_167:0 "对于要塞城市，首先要遵循以下一般原则。首先是选择一个非常健康的地点。这样一个地点将是高处，既不多雾也不多霜，气候既不热也不冷，而是温和的；此外，周围没有沼泽。——维特鲁威"
 LOADING_TIP_168:0 "没有人会愚蠢到宁要战争而不要和平；因为和平时，是儿子埋葬父亲；战争时，却是父亲埋葬儿子。——克洛伊索斯，希罗多德《历史》"
 LOADING_TIP_169:0 "因此，希腊人使用的建筑方法不容小觑。他们不使用外部抛光的软碎石结构，但每当他们放弃尺寸石时，他们就铺设熔岩或某种坚硬的石头，并且像用砖建造一样，通过在铺设石块时交替方向来绑定垂直接缝。这样，他们达到了可以永存的完美。——维特鲁威"
 LOADING_TIP_170:0 "既然如此强大的国王们并不鄙视用砖建造的墙壁，尽管凭借他们的收入和战利品，他们可能经常不仅能建造砖石甚至大理石的墙壁，我认为不应拒绝用砖建造的建筑物，只要它们被正确地“覆盖”。但我将解释为什么这种结构不应在罗马市内使用，包括原因和依据。——维特鲁威"
 LOADING_TIP_171:0 "希腊人以正方形的形式布置他们的广场，周围有非常宽敞的双层柱廊，用石头或大理石装饰柱子，并在上层建造走道。但在意大利的城市里，不能采用同样的方法，因为我们的祖先传下来的习惯是要在广场上举行角斗表演。——维特鲁威"
 LOADING_TIP_172:0 "然后，罗德岛人因迪奥格奈图斯的巧妙摆脱战争而公开感谢他，并授予他所有的荣誉和奖项。迪奥格奈图斯把那个攻城车带进城市，放在公共场所，并在上面刻了一段铭文：“迪奥格奈图斯从敌人的战利品中献给人民这份礼物。”因此，在防御工程中，不仅仅是机器，更重要的是要准备明智的计划。——维特鲁威"
 LOADING_TIP_173:0 "为了防止摩擦：当你开始旅行时，把一小段本蒂克苦艾放在肛门下。——马库斯·卡托"
 LOADING_TIP_174:0 "确实，通过贸易赚钱有时更有利可图，如果不是那么危险的话；同样，放贷也是如此，如果它同样光荣的话。我们的祖先持这种观点，并将其体现在法律中，法律规定，小偷应被罚款两倍，而高利贷者则四倍；从这一点可以判断，他们认为高利贷者比小偷更不受欢迎。——马库斯·卡托"
 LOADING_TIP_175:0 "做一个好邻居，不要让你的人民犯罪。如果你在邻里受欢迎，出售你的产品更容易，出租你的工作更容易，找到额外的工人也更容易。——马库斯·卡托"
 LOADING_TIP_176:0 "监督员的职责如下：——他必须表现出良好的管理能力。节日必须遵守。他必须不伸手拿别人的东西，勤奋保管自己的财物。他必须解决奴隶之间的争端；如果有人犯罪，他必须根据错误的严重程度适当处罚他。——马库斯·卡托"
 LOADING_TIP_177:0 "在罗马购买长袍、长袍、毯子、衬衫和鞋子；在卡莱斯和明图尔奈购买帽子、铁制工具、镰刀、铁锹、锄头、斧头、马具、饰品和小链子；在韦纳弗鲁姆购买铁锹；在苏萨和卢卡尼亚购买马车和雪橇；在阿尔巴和罗马购买罐子和锅；在韦纳弗鲁姆购买瓦片。——马库斯·卡托"
 LOADING_TIP_178:0 "在节日期间，牛可以被套上犁用于这些目的：运送柴火、豆茎和储存的谷物。骡子、马或驴子除了家庭节日外没有假期。——马库斯·卡托"
 LOADING_TIP_179:0 "关于卷心菜的药用价值：卷心菜在所有蔬菜中是最好的。它可以煮熟或生吃；如果你生吃它，蘸醋。它促进消化，非常好的泻药，尿液对一切都有益。——马库斯·卡托"
 LOADING_TIP_180:0 "每年当葡萄开始变色时，给牛服药，保持它们健康。当你看到蛇皮时，捡起来收好，这样当你需要时就不必寻找。用酒浸泡这张皮、斯佩尔特、小麦、盐和百里香，给所有的牛喝。确保牛在夏天总是有干净的水喝；这对它们的健康很重要。——马库斯·卡托"
 LOADING_TIP_181:0 "现在，我成为了死亡，世界的毁灭者。——毗湿奴，《薄伽梵歌》"
 LOADING_TIP_182:0 "人民的安危，应当成为最高的法律。——马库斯·图利乌斯·西塞罗《论法律》"
 LOADING_TIP_183:0 "不知道自己要驶向哪个港口的人，任何风都不会是顺风。——卢基乌斯·安奈乌斯·塞涅卡"
 LOADING_TIP_184:0 "人尤其应当在得意之时提防命运。——波利比乌斯《历史》"
 LOADING_TIP_185:0 "最好的报复，就是不要变得和伤害你的人一样。——马可·奥勒留《沉思录》"
 LOADING_TIP_186:0 "我来，我见，我征服。——盖乌斯·尤利乌斯·凯撒"
 LOADING_TIP_187:0 "过客啊，请告诉斯巴达人：我们长眠于此，遵从他们的命令。——温泉关斯巴达阵亡者墓志"
 LOADING_TIP_188:0 "请稍微让开一点，别挡住我的阳光。——第欧根尼，对亚历山大"
 LOADING_TIP_189:0 "如果我不是亚历山大，我愿做第欧根尼。——亚历山大大帝"
 LOADING_TIP_190:0 "天下有道，则礼乐征伐自天子出；天下无道，则礼乐征伐自诸侯出。——孔子《论语·季氏》"
 LOADING_TIP_191:0 "为政以德，譬如北辰，居其所而众星共之。——孔子《论语·为政》"
 LOADING_TIP_192:0 "道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。——孔子《论语·为政》"
 LOADING_TIP_193:0 "自古皆有死，民无信不立。——孔子《论语·颜渊》"
 LOADING_TIP_194:0 "名不正，则言不顺；言不顺，则事不成。——孔子《论语·子路》"
 LOADING_TIP_195:0 "治大国若烹小鲜。——老子《道德经》"
 LOADING_TIP_196:0 "民不畏死，奈何以死惧之？——老子《道德经》"
 LOADING_TIP_197:0 "兵者不祥之器，非君子之器，不得已而用之，恬淡为上。——老子《道德经》"
 LOADING_TIP_198:0 "仓廪实，则知礼节；衣食足，则知荣辱。——《管子·牧民》"
 LOADING_TIP_199:0 "一年之计，莫如树谷；十年之计，莫如树木；终身之计，莫如树人。——《管子·权修》"
 LOADING_TIP_200:0 "多行不义，必自毙，子姑待之。——郑庄公，《左传·隐公元年》"
 LOADING_TIP_201:0 "国之大事，在祀与戎。——《左传·成公十三年》"
 LOADING_TIP_202:0 "防民之口，甚于防川。川壅而溃，伤人必多，民亦如之。——召公，《国语·周语上》"
 LOADING_TIP_203:0 "前事之不忘，后事之师。——《战国策·赵策》"
 LOADING_TIP_204:0 "流水不腐，户枢不蠹，动也。——《吕氏春秋》"
 LOADING_TIP_205:0 "国无常强，无常弱。奉法者强则国强，奉法者弱则国弱。——韩非《韩非子·有度》"
 LOADING_TIP_206:0 "法不阿贵，绳不挠曲。——韩非《韩非子·有度》"
 LOADING_TIP_207:0 "事在四方，要在中央。圣人执要，四方来效。——韩非《韩非子·扬权》"
 LOADING_TIP_208:0 "宰相必起于州部，猛将必发于卒伍。——韩非《韩非子·显学》"
 LOADING_TIP_209:0 "世异则事异，事异则备变。——韩非《韩非子·五蠹》"
 LOADING_TIP_210:0 "燕雀安知鸿鹄之志哉！——陈胜，《史记·陈涉世家》"
 LOADING_TIP_211:0 "且壮士不死即已，死即举大名耳，王侯将相宁有种乎！——陈胜，《史记·陈涉世家》"
 LOADING_TIP_212:0 "嗟乎，大丈夫当如此也！——刘邦，见秦始皇出巡时"
 LOADING_TIP_213:0 "彼可取而代也！——项羽，见秦始皇出巡时"
 LOADING_TIP_214:0 "狡兔死，良狗烹；高鸟尽，良弓藏；敌国破，谋臣亡。天下已定，我固当烹！——韩信"
 LOADING_TIP_215:0 "居马上得之，宁可以马上治之乎？——陆贾，对汉高祖刘邦"
 LOADING_TIP_216:0 "仁义不施，而攻守之势异也。——贾谊《过秦论》"
 LOADING_TIP_217:0 "诸不在六艺之科、孔子之术者，皆绝其道，勿使并进。——董仲舒《天人三策》"
 LOADING_TIP_218:0 "究天人之际，通古今之变，成一家之言。——司马迁《报任安书》"
 LOADING_TIP_219:0 "百闻不如一见。兵难隃度，臣愿驰至金城，图上方略。——赵充国"
 LOADING_TIP_220:0 "宜悬头槁街蛮夷邸间，以示万里，明犯强汉者，虽远必诛。——陈汤"
 LOADING_TIP_221:0 "将军前在南阳建此大策，常以为落落难合；有志者事竟成也！——汉光武帝刘秀，对耿弇"
 LOADING_TIP_222:0 "不入虎穴，不得虎子！——班超"
 LOADING_TIP_223:0 "男儿要当死于边野，以马革裹尸还葬耳，何能卧床上在儿女子手中邪！——马援"
 LOADING_TIP_224:0 "事莫明于有效，论莫定于有证。——王充《论衡·薄葬》"
 LOADING_TIP_225:0 "水至清则无鱼，人至察则无徒。——《汉书·东方朔传》"
 LOADING_TIP_226:0 "君子不患位之不尊，而患德之不崇；不耻禄之不夥，而耻智之不博。——张衡《应间》"
 LOADING_TIP_227:0 "大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方！——刘邦《大风歌》"
 LOADING_TIP_228:0 "力拔山兮气盖世，时不利兮骓不逝。——项羽《垓下歌》"
 LOADING_TIP_229:0 "秦失其鹿，天下共逐之，于是高材疾足者先得焉。——蒯通，《史记·淮阴侯列传》"
 LOADING_TIP_230:0 "匈奴未灭，无以家为也。——霍去病"
 LOADING_TIP_231:0 "运筹策帷幄之中，决胜于千里之外，吾不如子房。——刘邦，论张良"
 LOADING_TIP_232:0 "天下熙熙，皆为利来；天下攘攘，皆为利往。——司马迁《史记·货殖列传》"
 LOADING_TIP_233:0 "民为贵，社稷次之，君为轻。——孟子"
 LOADING_TIP_234:0 "君者，舟也；庶人者，水也；水则载舟，水则覆舟。——《荀子·王制》"
 LOADING_TIP_235:0 "楚虽三户，亡秦必楚。——楚南公，《史记·项羽本纪》"
 LOADING_TIP_236:0 "与父老约，法三章耳：杀人者死，伤人及盗抵罪。余悉除去秦法。——刘邦"
 LOADING_TIP_237:0 "天行健，君子以自强不息。——《周易》"
 LOADING_TIP_238:0 "大丈夫处世，当扫除天下，安事一室乎？——陈蕃"
 LOADING_TIP_239:0 "富贵不归故乡，如衣绣夜行，谁知之者！——项羽"
 LOADING_TIP_240:0 "井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也；曲士不可以语于道者，束于教也。——庄子"
 LOADING_TIP_241:0 "王徒好其言，不能用其实。——孙子"
 LOADING_TIP_242:0 "学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。 ——荀子"
 LOADING_TIP_243:0 "且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。——庄子"
 LOADING_TIP_244:0 "疑行无名，疑事无功。且夫有高人之行者，固见非于世；有独知之虑者，必见敖于民。愚者暗于成事，知者见于未萌。民不可与虑始而可与乐成。论至德者不和于俗，成大功者不谋于众。是以圣人茍可以强国，不法其故；茍可以利民，不循其礼。——卫鞅"
 LOADING_TIP_245:0 "君子居必择乡，游必就士，所以防邪僻而近中正也。——荀子"
 LOADING_TIP_246:0 "君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。是以君子远庖厨也。——孟子"
 LOADING_TIP_247:0 "君子博学而日参省乎己，则知明而行无过矣。——荀子"
 LOADING_TIP_248:0 "兼相爱，交相利；别相恶，交相贼。——墨翟"
 LOADING_TIP_249:0 "言有招祸也，行有招辱也，君子慎其所立乎。——荀子"
 LOADING_TIP_250:0 "狐疑犹豫，后必有悔。——鲁仲连"
 LOADING_TIP_251:0 "五亩之宅，树之以桑，五十者可以衣帛矣；鸡豚狗彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，八口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。——孟子"
 LOADING_TIP_252:0 "吾生也有涯，而知也无涯。以有涯随无涯，殆已!——庄子"
 LOADING_TIP_253:0 "吾欲与若复牵黄犬俱出上蔡东门逐狡兔，岂可得乎！——李斯"
 LOADING_TIP_254:0 "孔丘之齐见景公，景公说，欲封之以尼谿，以告晏子。晏子曰：不可夫儒浩居而自顺者也，不可以教下；好乐而淫人，不可使亲治；立命而怠事，不可使守职；宗丧循哀，不可使慈民；机服勉容，不可使导众。——墨翟"
 LOADING_TIP_255:0 "江河之水非一源，千镒之裘非一狐——墨翟"
 LOADING_TIP_256:0 "国之所兴者，农战也。圣人之为国也，入令民以属农，出令民以计战。入使民尽力，则草不荒；出使民致死，则胜敌。胜敌而草不荒，富强之功，可坐而致也。——卫鞅"
 LOADING_TIP_257:0 "今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯；求国之无危，不可得也。——李斯"
 LOADING_TIP_258:0 "三代之得天下也以仁，其失天下也以不仁。国之所以废兴存亡者亦然。天子不仁，不保四海；诸侯不仁，不保社稷；卿大夫不仁，不保宗庙；士庶人不仁，不保四体。今恶死亡而乐不仁，是犹恶醉而强酒。——孟子"
 LOADING_TIP_259:0 "士为知己者用，女为说己者容。——司马迁"
 LOADING_TIP_260:0 "至杀不辜人也，拖其衣裘，取戈剑者，其不义又甚入人栏厩取人马牛。此何故也？以其亏人愈多。苟亏人愈多，其不仁兹甚矣，罪益厚。当此，天下之君子皆知而非之，谓之不义。今至大为攻国，则弗知非，从而誉之，谓之义。此可谓知义与不义之别乎？——墨翟"
 LOADING_TIP_261:0 "事所以不成者，乃欲以生劫之，必得约契以报太子也。 ——荆轲"
 LOADING_TIP_262:0 "尺有所短；寸有所长。物有所不足；智有所不明。 ——屈原"
 LOADING_TIP_263:0 "儒者曰：“君子必服古言然后仁。”应之曰：“所谓古之言服者，皆尝新矣，而古人言之，服之，则非君子也。然则必服非君子之服，言非君子之言，而后仁乎？”——墨翟"
 LOADING_TIP_264:0 "新沐者必弹冠，新浴者必振衣。——屈原"
 LOADING_TIP_265:0 "秦之与魏，譬若人之有腹心疾，非魏并秦，秦即并魏。何者？魏居领厄之西，都安邑，与秦界河而独擅山东之利。利则西侵秦，病则东收地。今以君之贤圣，国赖以盛。而魏往年大破于齐，诸侯畔之，可因此时伐魏。魏不支秦，必东徙。东徙，秦据河山之固，东乡以制诸侯，此帝王之业也。——卫鞅"
 LOADING_TIP_266:0 "臣既已受命为将，将在军，君命有所不受。——孙子"
 LOADING_TIP_267:0 "臣所闻古之道，凡用兵攻战之本，在乎一民。弓矢不调，则羿不能以中；六马不和，则造父不能以致远；士民不亲附，则汤、武不能以必胜也。故善附民者，是乃善用兵者也。故兵要在乎附民而已。——荀子"
 LOADING_TIP_268:0 "人固有一死，死或重于泰山，或轻于鸿毛。 ——司马迁"
 LOADING_TIP_269:0 "人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。——孟子"
 LOADING_TIP_270:0 "人人皆可以为尧舜——孟子"
 LOADING_TIP_271:0 "仁者无敌。——孟子"
 LOADING_TIP_272:0 "生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。——孟子"
 LOADING_TIP_273:0 "生于忧患，而死于安乐也。——孟子"
 LOADING_TIP_274:0 "其曲弥高，其和弥寡。 ——宋玉"
 LOADING_TIP_275:0 "泰山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。 ——李斯"
 LOADING_TIP_276:0 "天下共苦战斗不休，以有侯王。赖宗庙，天下初定，又复立国，是树兵也，而求其宁息，岂不难哉！——嬴政"
 LOADING_TIP_277:0 "天下兼相爱则治，相恶则乱。——墨翟"
 LOADING_TIP_278:0 "天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。 ——孟子"
 LOADING_TIP_279:0 "天时不如地利，地利不如人和——孟子"
 LOADING_TIP_280:0 "登东山而小鲁，登太山而小天下。——孟子"
 LOADING_TIP_281:0 "得道多助，失道寡助。寡助之至，亲戚畔之。多助之至，天下顺之。——孟子"
 LOADING_TIP_282:0 "彼一时，此一时也。——孟子"
 LOADING_TIP_283:0 "彼王不能用君之言任臣，又安能用君之言杀臣乎？——卫鞅"
 LOADING_TIP_284:0 "不以规矩，不能成方圆。——孟子"
 LOADING_TIP_285:0 "不登高山，不知天之高也；不临深溪，不知地之厚也。——荀子"
 LOADING_TIP_286:0 "夫将者，国之辅也；辅周则国必强，辅隙则国必弱。——孙子"
 LOADING_TIP_287:0 "夫民不可与虑始，而可与乐成。论至德者不和于俗，成大功者不谋于众。是以圣人苟可以强国，不法其故。——卫鞅"
 LOADING_TIP_288:0 "夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也。惧有伏焉。吾视其辙乱，望其旗靡，故逐之。——曹刿"
 LOADING_TIP_289:0 "兵既整齐，王可试下观之，唯王所欲用之，虽赴水火犹可也。——孙子"
 LOADING_TIP_290:0 "兵者，国之大事，死生之地，存亡之道，不可不察也。故经之以五事：一曰道，二曰天，三曰地，四曰将，五曰法。道者，令民与上同意，可与之死，可与之生，而不畏危也。天者，阴阳、寒暑、时制也。地者，高下、远近、险易、广狭、死生也。将者，智、信、仁、勇、严也。法者，曲制、官道、主用也。凡此五者，将莫不闻，知之者胜，不知者不胜。[1]:3——孙子"
 LOADING_TIP_291:0 "法不仁，不可以为法。——墨翟"
 LOADING_TIP_292:0 "凡赏者，文也；刑者，武也。文武者，法之约也。——卫鞅"
 LOADING_TIP_293:0 "民众而奸邪生，故立法制为度量以禁之。是故有君臣之义，五官之分，法制之禁。——卫鞅"
 LOADING_TIP_294:0 "明主慎法制，言不中法者不听也。——卫鞅"
 LOADING_TIP_295:0 "礼、法以时而定，制、令各顺其宜。——卫鞅"
 LOADING_TIP_296:0 "路曼曼其修远兮，吾将上下而求索。——屈原"
 LOADING_TIP_297:0 "老吾老，以及人之老；幼吾幼，以及人之幼。——孟子"
 LOADING_TIP_298:0 "无言而不仇，无德而不报，投我以桃，报之以李。——墨翟"
 LOADING_TIP_299:0 "曰：“独乐乐，与人乐乐，孰乐？”曰：“不若与人。”——孟子"
 LOADING_TIP_300:0 "盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐乃赋《离骚》；左丘失明厥有《国语》；孙子膑脚兵法修列；不韦迁蜀世传《吕览》；韩非囚秦，《说难》《孤愤》。《诗》三百篇，大抵贤圣发愤之所为作也。——司马迁"
 LOADING_TIP_301:0 "兴天下之利，除天下之害——墨翟"
 LOADING_TIP_302:0 "圣人不法古，不修今，法古则后于时，修今则塞于势。周不法商，夏不法虞，三代异势，而皆可以王。故兴王有道，而持之异理。——卫鞅"
 LOADING_TIP_303:0 "约束不明，申令不熟，将之罪也；既已明而不如法者，吏士之罪也。——孙子"
 LOADING_TIP_304:0 "规小节者不能成荣名，恶小耻者不能立大功。 ——鲁仲连"
 LOADING_TIP_305:0 "贾，梁监门子，盗于梁，臣于赵而逐。取世监门子梁大盗赵逐臣与同社稷之计，非所以励群臣也。 ——韩非"
 LOADING_TIP_306:0 "锲而舍之，朽木不折；锲而不舍，金石可镂。 ——荀子"
 LOADING_TIP_307:0 "长太息以掩涕兮，哀民生之多艰。——屈原"
 LOADING_TIP_308:0 "韩子引绳墨，切事情，明是非，其极惨礉少恩，皆原于《道德》之意，而老子深远矣。 ——司马迁"
 LOADING_TIP_309:0 "风萧萧兮易水寒，壮士一去兮不复还！——荆轲"
 LOADING_TIP_310:0 "鸟飞反故乡兮，狐死必首丘。——屈原"
 LOADING_TIP_311:0 "齐景公问晏子曰：“孔子为人何如？”晏子不对，公又复问，不对。景公曰：“以孔丘语寡人者众矣，俱以贤人也。今寡人问之，而子不对，何也？”晏子对曰：婴不肖，不足以知贤人。虽然，婴闻所谓贤人者，入人之国必务合其君臣之亲，而弭其上下之怨。孔丘之荆，知白公之谋，而奉之以石乞，君身几灭，而白公僇。——墨翟"

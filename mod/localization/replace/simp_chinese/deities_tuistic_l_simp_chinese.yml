 deity_nerthus:0 "$omen_nerthus$"
 deity_tamfana:0 "$omen_tamfana$"
 deity_tuisto:0 "$omen_tuisto$"
 deity_vagdavercustis:0 "$omen_vagdavercustis$"
 omen_alcis:0 "阿尔希兹"
 omen_alcis_desc:0 "尽管有多种面貌，事实上阿尔齐斯是二位一体的双生子神祇的名字。为他们的年少与兄弟之爱所敬仰，他们有时被绘成战马或战车，拉着太阳跨过天际。"
 omen_baduhenna:0 "巴德瓦赫诺"
 omen_baduhenna_desc:0 "更广为人知的名字是巴杜赫娜。巴杜瓦赫诺常在我们出战之时作为神系中的主妇之一被呼求祷告。我们的军民向她寻求指引，希望她能在他们为部落而战时引导他们的双手。"
 omen_hludana:0 "赫鲁达娜"
 omen_hludana_desc:0 "赫卢达娜是森林的女保护神，同时也是农业之神。赫卢达娜常被与信仰、忠诚相关联，她的形象饱含同情。在困顿时，我们的人民向她寻求保护。"
 omen_nehalennia:0 "尼哈勒尼亚"
 omen_nehalennia_desc:0 "尼哈勒尼亚是商业、园艺和贸易的女保护神。她的形象常是一位坐着的神祇，边上有条狗，在她的领域下商品繁盛。贩夫与商人在异邦或与异域文化的人们做生意时，常会向她祈求，同样生产商品货物的人们需要她帮助时也会这么做。"
 omen_nerthus:0 "内尔苏兹"
 omen_nerthus_desc:0 "那瑟斯是我们主要的生育女神，也是大日耳曼诸部落最受欢迎的生育神祇之一，她在我国为人熟知和敬仰。据传那瑟斯对人间的事物有特别的兴趣，常常在她的信徒与人民之间穿行。"
 omen_tamfana:0 "丹诺"
 omen_tamfana_desc:0 "塔姆法娜在一些最神圣的日耳曼圣所被敬拜，她是那些神木林的重要神祇。而且她还是丰收女神中的一位，当人们外出劳作时我们常会给她留下奉献。"
 omen_tuisto:0 "图伊斯托"
 omen_tuisto_desc:0 "罗马人称其为图伊斯托，而特维斯托是我们万神殿的至高神，也是我们部族与人民的祖先。他生于大地，有数位儿子成为后来日耳曼部族的统治者。我们的人民在万事上向他寻求指引与援助，并在仪式中虔敬地礼赞他。"
 omen_vagdavercustis:0 "瓦格达维尔库斯蒂兹"
 omen_vagdavercustis_desc:0 "对于我们的一些人民来说，瓦格达维库斯提斯是战争、军事智慧、及美德的主要神祇。她的许多事迹鼓舞这我们的军民的行动，而且有人声称只要向她奉献祈祷，她就会在战斗中引导他们的双手。"

 EGYINTRO:0 "#T 托勒密王国#!\n难度：#Y 容易#!\n\n托勒迈奥斯的拉吉德王朝牢牢掌控着极其肥沃的尼罗河三角洲。托勒密海军最近在安提柯长子德米特里奥斯手中遭遇毁灭性海战败绩，如今几乎已不复存在。尽管如此，尼罗河三角洲高度集中的经济仍为军事重组提供了极佳的收入基础。然而也必须谨慎，因为埃及人口中的大多数人与其希腊统治者在文化和宗教上都并不相同。"
 SELINTRO:0 "#T 塞琉古王国#!\n难度：#Y 困难#!\n\n在游戏开局时，由塞琉古·尼卡托尔领导的塞琉古王朝控制着最大的继业者国家。虽然这个辽阔帝国能够召集庞大的军队，但东邻孔雀王朝，西接强大的安提柯王国，可能让它在两个完全不同的方向同时陷入冲突。统治阶层主要由希腊贵族构成，这往往会与塞琉古领土内的各个文化群体产生矛盾。更复杂的是，一些附属国依赖塞琉古的支持，而其中有些附属国的目标彼此截然相反……"

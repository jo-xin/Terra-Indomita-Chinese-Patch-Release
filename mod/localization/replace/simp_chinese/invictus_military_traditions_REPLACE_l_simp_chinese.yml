l_simp_chinese:
 celtic_latin_enable_desc:0 "当罗马人请求赎回他们的城市的时候，布壬努斯要求罗马人支付1000磅的黄金，高卢人提供了砝码去测量黄金，但罗马人声称这些砝码被高卢人的把戏操纵了，布壬努斯把剑掷在砝码上，说道，战败者有祸了！"
 celtic_north_african_enable_desc:0 "马需要牧场，就像骑手需要马一样"
 greek_levantine_enable_desc:0 "萨拉米斯海战是公元前480年忒米斯托克利领导下的希腊城邦联盟战胜薛西斯国王领导下的波斯帝国庞大舰队的海战。"
 greek_persian_enable_desc:0 "高加米拉战役(公元前331年)是马其顿的亚历山大大帝和波斯王大流士三世之间的最后一次正面交锋，也是波斯帝国灭亡的开始。"
 latin_celtic_enable_desc:0 "高卢人在台伯河和阿利亚河击败罗马人之后，他们朝着罗马进军，公元前390年夏天，入侵者焚烧并洗劫了这座城市，罗马人继续在国会山（Capitol Hill，得名于罗马的卡庇多利欧山）战斗直至粮食耗尽，从那时起，罗马就对高卢人既恐惧又厌恶."
 latin_greek_enable_desc:0 "战神广场最初属于罗马最后一位伊特鲁里亚国王塔奎尼乌斯·苏普厄巴斯。在他被废黜后，这块土地被奉献给了战神玛尔斯。每年春天，罗马人都会聚集在这里，然后前往罗马周围的敌对部落作战，人们会在宗教节日也会聚集在一起。"
 levantine_greek_enable_desc:0 "亚历山大对推罗岛城的防御感到非常不愉快，以至于当岛城落入他的手中时，他摧毁了其中的一半。"
 levantine_north_africa_enable_desc:0 "作为骄傲和权力的象征，巴巴里狮在早期埃及艺术和文学以及整个罗马时期都经常出现过。"
 mauryan_persia_enable_desc:0 "波斯和印度之间的干旱大地上非常适合学习马术。"
 north_african_latin_enable_desc:0 "狄多逃离了她的家乡推罗，建立了迦太基。后来她被她的特洛伊情人埃涅阿斯抛弃，在结束自己的生命之前，她诅咒了未来的罗马人。"
 north_african_levantine_enable_desc:0 "腓尼基人的航海技术如此娴熟，以至于整个地中海似乎都是他们的领地。"
 persian_levantine_enable_desc:0 "大流士大帝是第一位建立舰队的阿契美尼德国王。在那时，希腊和埃及都没有真正的常备海军。波斯将成为第一个部署正规海军的帝国。"
 persian_mauryan_enable_desc:0 "印度潮湿的丛林提供了我们从未见过的复杂的战斗环境。"

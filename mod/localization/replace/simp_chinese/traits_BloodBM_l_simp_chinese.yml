l_simp_chinese:
 aeacidae:0 "埃阿科斯的血脉"
 aeacidae_desc:0 "埃阿科斯是希腊最伟大的英雄阿喀琉斯的祖父，萨罗尼科斯湾的埃吉那岛之王。阿喀琉斯的儿子涅俄普托勒摩斯从特洛伊战争归来后，成为了摩罗西亚的伊庇鲁斯人之王，他的后代从那时起就统治着这里，统一了伊庇鲁斯，培育出奥林匹娅斯，通过她才有了她的儿子亚历山大大帝的遗产。\n\n#G 该特质可通过母系或父系传承。#!"
 alcimachid:0 "吕西马科斯的血脉"
 alcimachid_desc:0 "吕西马科斯曾是亚历山大的亲密友人，也是传说中的近身护卫之一。他是一位残酷而狡黠的将军，对继业者之间紧张外交局势的把握无人能及。\n\n#G 该特质可以通过母系或父系传承。#!"
 antigonids:0 "安提柯的血脉"
 antigonids_desc:0 "独眼安提柯曾是亚历山大的忠诚总督，在亚历山大死后不久击败佩尔狄卡斯并崛起掌权。他是继业者中第一个自称为王的人，得到忠诚家族支持，并在较小、能力较弱的希腊国家中建立了良好声望。\n\n#G 该特质可以通过母系或父系传承。#!"
 antipatrid:0 "安提帕特的血脉"
 antipatrid_desc:0 "作为亚历山大的好友，在亚历山大的远征期间安提帕特负责驻守马其顿。他对亚历山大的极尽忠诚，以及在位期间对希腊小邦咄咄逼人的态度被他的儿子卡山德扭转，卡山德对亚历山大的轻蔑之情路人皆知。而他的遗志则是建立和恢复诸多名城。\n\n#G 该特质可通过母系或父系传承。#!"
 argeads:0 "阿吉德的血脉"
 argeads_desc:0 "阿那克萨图斯曾说“大千世界无穷尽也”，亚历山大听到不禁潸然泪下；他的好友问他是否有意外降临，亚历山大这样答道：“世界无穷无尽，我们却连一小块也未征服，这难道不值得悲痛么？”\n\n#G 该特质可以被[CHARACTER.GetPraenomen]的后代继承。#!"
 lagids:0 "托勒密血脉"
 lagids_desc:0 "由于从小就随侍亚历山大左右，拉吉德家族的托勒密一世，成为了亚历山大麾下的七名近身护卫官之首。巴比伦分封协议之后，他在埃及定居，其治下人口文化错综复杂，但他仍旧以公正之道将自己的领土治理的井井有条。他的长命王朝在赞助艺术、哲学、科学等领域的影响深远。\n\n#G 该特质可通过母系或父系传承。#!"
 seleucids:0 "塞琉古的血脉"
 seleucids_desc:0 "与其他继业者不同，塞琉古在亚历山大征服期间只是一个地位平平的人。在一连串胜利与击败之后，塞琉古最终在“救主”托勒密一世的帮助下确立了自己的领地，并发动了一场重夺亚历山大帝国东部领土的战役。由于强权环绕，塞琉古不可避免的成为了一位无情而狡诈的领袖。\n\n#G 该特质可通过母系或父系传承。#!"

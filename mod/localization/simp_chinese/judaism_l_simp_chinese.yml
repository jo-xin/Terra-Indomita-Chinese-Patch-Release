l_simp_chinese:
 destroy_jerusalem_temple:0 "摧毁耶路撒冷圣殿"
 destroy_jerusalem_temple_desc:0 "很久以前，我们南边犹太人的祖先违背上帝的意愿，选择将会幕搬到他们的土地上。乌西把会幕藏在基利心圣山的一个山洞里，在那里，会幕奇迹般地消失，阻止了他们的计划。他们毫不气馁，在耶路撒冷的锡安山上建造了一座异端的神殿来取代它。现在我们已经控制了这座城市，是时候拆除这个假祭坛了，这样基利心山就会再次被承认为唯一的神选之地。"
 destroy_jerusalem_temple_tooltip:0 "所有我们在 [GetProvince('(int32)687').GetArea.GetName]，[GetProvince('(int32)712').GetArea.GetName]，[GetProvince('(int32)659').GetArea.GetName] 和 [GetProvince('(int32)673').GetArea.GetName] 控制的 #Y $judaism$ #! 土地将获得 #Y [GetModifier('temple_destroyed_israel').GetName]#!:\n[GetModifier('temple_destroyed_israel').GetDesc]\n#E 我们终有一日会建造一座属于我们自己的 #T 圣殿 #!。#!"
 embellish_mount_gerizim_sanctuary:0 "扩建基利心山圣殿"
 embellish_mount_gerizim_sanctuary_desc:0 "现在，锡安山异端圣殿被毁后的骚乱已经平息，是时候把基利心山上不起眼的圣所扩展成一座荣耀的殿堂，上帝指定的唯一敬拜场所。"
 embellish_mount_gerizim_sanctuary_tooltip:0 "将开始修建基利心山圣殿。"
 fraud_in_the_temple:0 "宗教欺诈"
 gerizim_sanctuary.10.a:0 "它将成为所有以色列人的精神支柱。"
 gerizim_sanctuary.10.desc:0 "我们已经派人从四面八方来帮助建造基利心山圣殿。作为上帝指定的唯一敬拜地点，我们希望这能吸引来自世界各地的以色列子民。\n\n在短短几周内，圣殿建造的进程将正常开始。随着修筑逐步进展，我们预计会出现一些复杂情况，但希望我们能尽快看到圣殿完工。"
 gerizim_sanctuary.10.t:0 "基利心山圣殿"
 gerizim_sanctuary.11.a:0 "然而，我们当初的期望不仅如此……"
 gerizim_sanctuary.11.a.tt:0 "耶路撒冷圣殿被毁的临时修正已被移除。"
 gerizim_sanctuary.11.desc:0 "基利心山圣殿终于完工了，它证明了我们的统治、权力和上帝的荣耀。这坛要世世代代作唯一献祭耶和华的坛。\n\n尽管圣殿没有完全达到我们最初设计的期望，它绝对仍是一座令人印象深刻的建筑。再也没有任何一个人会怀疑我们的城市和国家的重要地位，因为我们已经建立了一座举世无双的纪念碑。 "
 gerizim_sanctuary.11.t:0 "基利心山圣殿"
 gerizim_sanctuary.12.a:0 "这是对我们工匠最高的认可。"
 gerizim_sanctuary.12.a.tt:0 "耶路撒冷圣殿被毁的临时修正已被移除。"
 gerizim_sanctuary.12.desc:0 "基利心山圣殿终于完工了，它证明了我们的统治、权力和上帝的荣耀。这坛要世世代代作唯一献祭耶和华的坛。\n\n尽管有许多人批判我们浮夸而不切实际的计划，圣殿仍然以某种程度上达到了我们的期望。再也没有任何一个人会怀疑我们的城市和国家的重要地位，因为我们已经建立了一座举世无双的纪念碑。 "
 gerizim_sanctuary.12.t:0 "基利心山圣殿"
 gerizim_sanctuary.13.a:0 "理所当然。"
 gerizim_sanctuary.13.a.tt:0 "耶路撒冷圣殿被毁的临时修正已被移除。"
 gerizim_sanctuary.13.desc:0 "基利心山圣殿终于完工了，它证明了我们的统治、权力和上帝的荣耀。这坛要世世代代作唯一献祭耶和华的坛。\n\n这座宏伟的纪念碑完全超越了我们的计划和期望，刺入天空并达到了上方的领域。从未有如此一座圣殿出自凡人之手，有的人说我们在这一努力过程中一定是得到了神的指引。\n\n基利心山圣殿会永远存留在我国的记忆中。"
 gerizim_sanctuary.13.t:0 "基利心山圣殿"
 gerizim_sanctuary.2.a:0 "我们将全力帮助整个示剑。"
 gerizim_sanctuary.2.a.tt:0 "基利心山圣殿的建设按计划继续进行。"
 gerizim_sanctuary.2.b:0 "现在我们将优先帮助工人。"
 gerizim_sanctuary.2.c:0 "我们无力提供任何帮助。"
 gerizim_sanctuary.2.c.tt:0 "基利心山圣殿的建设由于饥荒受阻。"
 gerizim_sanctuary.2.desc:0 "一次旱灾袭击了示剑，因此基利心山圣殿的建设受到了阻碍。我们只有从其他地方花一大笔钱调运粮食，否则建设将会受阻。[SCOPE.sCharacter('random_advisor').GetName]指出我们可以集中帮助圣殿的建筑工人以节省资源。"
 gerizim_sanctuary.2.t:0 "干旱难关"
 gerizim_sanctuary.3.a:0 "我们会买一些替代品。"
 gerizim_sanctuary.3.b:0 "我们的其他领土里有一些我们能用的材料。"
 gerizim_sanctuary.3.c:0 "我们将不得不稍微缩减圣殿的装饰。"
 gerizim_sanctuary.3.c.tt:0 "基利心山圣殿的建设由于低质量的材料受阻。"
 gerizim_sanctuary.3.desc:0 "在圣殿的施工过程中发生了大面积坍塌并造成了我们工人的大量恐慌。似乎我们收到的一些材料已经不堪使用，也不能安全保持在最佳状态。\n\n我们的工头要求购买替代品所需的资金，然而[SCOPE.sCharacter('random_advisor').GetName]指出我们可以使用临近城市我们所拥有的材料。"
 gerizim_sanctuary.3.t:0 "材料难关"
 gerizim_sanctuary.4.a:0 "新的工人会被找到。"
 gerizim_sanctuary.4.b:0 "我们的士兵会填补空缺。"
 gerizim_sanctuary.4.c:0 "工程只需要多花一点时间。"
 gerizim_sanctuary.4.c.tt:0 "基利心山圣殿的建设由于缺少工人受阻。"
 gerizim_sanctuary.4.desc:0 "随着基利心山圣殿建设工作的进行，我们看到大量的工人随着时间流失了。有的人辞去了他们的工作，有的人死去，还有的人只是单纯地消失了。如果没有足量的劳动力进行圣殿的建设，其进度将会延后，并且我们可能得不到想要的成果。"
 gerizim_sanctuary.4.t:0 "工人流失"
 gerizim_sanctuary.5.a:0 "它将会被修复以便继续施工。"
 gerizim_sanctuary.5.b:0 "我们没有需要的资金。"
 gerizim_sanctuary.5.b.tt:0 "基利心山圣殿的建设由于地震造成的损坏受阻。"
 gerizim_sanctuary.5.desc:0 "一场小型的地震影响了基利心山圣殿和所有在圣殿里工作的人，这对在过去几个月内已经完成的工作造成了一些轻微的伤害和损坏。\n\n如果想要工作要不受阻碍地继续进行，就投入需要大量的资金来清理这个区域和替换一些损坏的事物。"
 gerizim_sanctuary.5.t:0 "地震难关"
 gerizim_sanctuary.6.a:0 "更大更好！"
 gerizim_sanctuary.6.a.tt:0 "基利心山圣殿的建设进度赶超了我们最初的计划。"
 gerizim_sanctuary.6.b:0 "让我们把材料卖掉，暂时把钱存起来。"
 gerizim_sanctuary.6.desc:0 "随着我们在基利心山圣殿建设工程中不断取得进展，我们似乎额外收到了一批比预期质量更高的材料。我们可以将这些额外的材料投入建造，使得圣殿比我们一开始设计的要好。我们也可以把它卖掉并维持原来的计划，并且利用得到的额外资金预防不测。"
 gerizim_sanctuary.6.t:0 "优质材料"
 gerizim_sanctuary.7.a:0 "用金子和一些其他金属制作。"
 gerizim_sanctuary.7.a.tt:0 "这将对基利心山圣殿的质量产生负面影响。"
 gerizim_sanctuary.7.a.zeal:0 "这可能是假的。不是纯金。"
 gerizim_sanctuary.7.b:0 "用纯金制造这些器物。"
 gerizim_sanctuary.7.b.tt:0 "基利心山圣殿的建设按计划继续进行。"
 gerizim_sanctuary.7.b.zeal:0 "这些显然是假的。我们要用纯金来制作。"
 gerizim_sanctuary.7.c:0 "秘密铸造，然后冒充失落的会幕。"
 gerizim_sanctuary.7.c.tt:0 "我们将宣称找到了摩西的会幕。\n\n我们的秘密将来可能会被揭开。\n基利心山圣殿的建设进度赶超了我们最初的计划。"
 gerizim_sanctuary.7.c.zeal:0 "这让我想到了一个主意……"
 gerizim_sanctuary.7.d:0 "我们必须付出任何代价！"
 gerizim_sanctuary.7.d.tt:0 "我们将从牧羊人那里买下这些无价的工艺品。\n基利心山圣殿的建设进度赶超了我们最初的计划。"
 gerizim_sanctuary.7.desc:0 "当犹太人试图把会幕搬到耶路撒冷时，大祭司乌西将其和里面的财宝藏在基利心圣山的一个洞里，在那里它们奇迹般地消失了。\n\n新的圣所需要供祭司洗手和洗脚的洗濯盆，他们穿的珠宝衣服，还有一个七根枝干的纯金烛台。"
 gerizim_sanctuary.7.desc.zeal:0 "当犹太人试图把会幕搬到耶路撒冷时，大祭司乌西将其和里面的财宝藏在基利心圣山的一个洞里，在那里它们奇迹般地消失了。\n\n新的圣所需要供祭司洗手和洗脚的洗濯盆，他们穿的珠宝衣服，还有一个七根枝干的纯金烛台。\n\n现在，当地一名牧羊人声称在山上一个洞穴中发现了这些器物。"
 gerizim_sanctuary.7.t:0 "七枝灯台"
 gerizim_sanctuary.8.a:0 "我们怎么这么容易就上当了呢？"
 gerizim_sanctuary.8.b:0 "哎呀...."
 gerizim_sanctuary.8.c:0 "谴责这些亵渎神明的谎言！"
 gerizim_sanctuary.8.d:0 "花钱加倍宣传我们声称的故事。"
 gerizim_sanctuary.8.desc:0 "我们听说，有一个人在我们各城的街市上放言。他说他制作了那个我们声称是会幕里最原始的烛台，还说他参与了一个阴谋，要向民众隐瞒真相。但从那时起，他就一直被梦所折磨，这迫使他忏悔。"
 gerizim_sanctuary.8.e:0 "让他闭嘴！"
 gerizim_sanctuary.8.t:0 "假的七枝灯台"
 gerizim_sanctuary_decent:0 "体面的圣殿"
 gerizim_sanctuary_great:0 "伟大的圣殿"
 recently_destroyed_jerusalem_temple:0 "不久前被摧毁的耶路撒冷圣殿"
 samaritan_judaean_schism:0 "分裂派"
 second_temple_destroyed_tooltip:0 "#T $wonder_second_temple_ezra$#! 将会被摧毁！"
 second_temple_samaria_tooltip:0 "所有我们在 [GetProvince('(int32)680').GetArea.GetName] 控制的 #Y $judaism$#!土地将获得 #Y [GetModifier('temple_destroyed_samaria').GetName]#!:\n[GetModifier('temple_destroyed_samaria').GetDesc]"
 tabernacle_recovered:0 "会幕被寻得"
 temple_destroyed_country_permanent:0 "撒玛利亚派的辩白"
 temple_destroyed_israel:0 "第二圣殿被毁"
 temple_destroyed_jerusalem:0 "圣殿被毁"
 temple_destroyed_samaria:0 "撒玛利亚派的辩白"
 treasure_samaritan_menorah:0 "撒玛利亚的七枝灯台"
 treasure_samaritan_menorah_desc:0 "烛台是用纯金制成的七枝撒玛利亚灯台，在基利心山圣殿使用。"
 wonder_gerizim_sanctuary:0 "基利心山圣殿"
 wonder_gerizim_sanctuary_desc:0 "在摧毁了耶路撒冷的第二圣殿之后，撒玛利亚人在圣山基利心建造了一座宏伟的圣殿，他们声称这是上帝指定的崇拜他的合适场所。"

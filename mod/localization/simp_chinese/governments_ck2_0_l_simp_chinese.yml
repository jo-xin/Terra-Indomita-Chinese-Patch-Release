l_simp_chinese:
 punic_republic:0 "布匿共和国"
 punic_republic_desc:0 "布匿政府是一种寡头政治的形式，由两位索菲特和一个由国家最富有的成员组成的元老院共同统治。这种贵族制度不是基于土地所有权，而是基于纯粹的财富。"
 rhodian_dictatorship:0 "罗德斯的独裁统治"
 rhodian_dictatorship_consort:0 "$title_consort$"
 rhodian_dictatorship_desc:0 "独裁是一种极权主义政府的形式，它将政治权力置于一个人的手中。罗德岛的人民把他们的统治权交到了一个人的手中。"
 rhodian_dictatorship_ruler:0 "僭主"
 rhodian_dictatorship_ruler_female:0 "僭主"
 spartan_event.2.a:0 "且来取土！"
 spartan_event.2.desc:0 "巴比伦，18年前，国王亚历山大突然去世，年仅32岁，使他刚刚征服的帝国支离破碎。自他的父亲菲利普国王之后，马其顿人崛起，成为所有希腊人的霸主，除了我们斯巴达人。马其顿人从未忘记这种蔑视，亚历山大“大帝”在外交上羞辱了我们，后来又在军事上羞辱了我们，在梅加洛波利斯之战中。我们仍然是独立的，但诸神用他们扭曲的幽默感嘲弄了我们。\n\n美塞尼和黑劳士的损失向希腊世界表明，我们自己的房子不在状态，因此我们的斯巴达遗产正在慢慢失去可信性。大多数希腊人都会记得我们在波斯战役中的缺席，以及我们对马其顿人的失败战役。然而，由于继业者专注于他们之间的内部战争，我们有一个小小的机会窗口来改革、适应和恢复旧秩序。\n\n赫拉克勒斯之子，通过哈迪斯我们将崛起！"
 spartan_event.2.t:0 "恐怖的亚历山大"
 spartan_event.3.a:0 "今晚，他在冥府用餐。"
 spartan_event.3.desc:0 "今天早上有一个不幸的消息，[ROOT.GetCountry.GetRulerTitle][SCOPE.sChar('old_spartan_king').GetPraenomen]家族的[SCOPE.sChar('old_spartan_king').GetFamilyDisplayName]已经渡过冥河。[ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName]家族收到了这个消息，并与[SCOPE.sChar('old_spartan_king').GetFamilyDisplayName]家族一起做最后的告别。这一天，斯巴达城在哀悼中沉寂下来，第二天将标志着一个新的开始，一个新的[ROOT.GetCountry.GetRuler.GetFamilyDisplayName][ROOT.GetCountry.GetRulerTitle]，与[ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName]家一起，斯巴达将继续其赫拉克利的遗产。"
 spartan_event.3.t:0 "国王已逝"
 spartan_event.4.a:0 "平等中的第一!"
 spartan_event.4.desc:0 "就像诸神之一来访一样罕见，人们对两个王室中谁是主导者的看法已经改变。虽然他们是平等的，共享希拉克里的血统，但从传统上看，[SCOPE.sChar('old_ruler').GetFamilyDisplayName]家族被视为两个家族中稍显突出的。这是家族的遗产、著名人物和古代英雄的结果。然而，这已经改变了，人们对哪个家族更突出的看法已经被颠覆了，这是一个缓慢但长期预期的变化，因为[ROOT.GetCountry.GetRuler.GetFamilyDisplayName]家族最近培养了许多伟大的领袖和英雄，有效地使其他家族黯然失色。"
 spartan_event.4.t:0 "皇家日蚀"
 spartan_event.5.a:0 "万物终将消逝……为逝者祈祷。"
 spartan_event.5.desc:0 "今天早上有一个不幸的消息，[ROOT.GetCountry.GetCoRulerTitle][SCOPE.sChar('old_co_ruler').GetPraenomen]家族的[SCOPE.sChar('old_co_ruler').GetFamilyDisplayName]已经摆脱了尘世的重担。[ROOT.GetCountry.GetRuler.GetFamilyDisplayName]家收到了消息，并与[SCOPE.sChar('old_co_ruler').GetFamilyDisplayName]家族一同进行了最后的悼念。\n\n在这一天，[ROOT.GetCountry.GetCapital.GetName]城仍然保持安静，哀悼他们已故的[ROOT.GetCountry.GetCoRulerTitle]，但随着太阳的升起，新的一天，新的[ROOT.GetCountry.GetCoRuler.GetFamilyDisplayName]将与[ROOT.GetCountry.GetRuler.GetFamilyDisplayName]家族一起带领[ROOT.GetCountry.GetName]前进，并承继其质朴的遗产。"
 spartan_event.5.t:0 "共治者已死"
 spartan_imperial_cult:0 "斯巴达帝国教派"
 spartan_imperial_cult_desc:0 "在一些文化中，皇帝或皇后拥有如此大的权力，以至于他们和他们的祖先被认为是神圣的使者，甚至是神灵本身。"
 spartan_imperium:0 "斯巴达帝国"
 spartan_imperium_desc:0 "皇帝对国家拥有绝对权力，通常对较小的国王和贵族拥有主权。"
 spartan_monarchy:0 "斯巴达双头政治"
 spartan_monarchy_desc:0 "两个国王比一个好。-拉科尼亚谚语"

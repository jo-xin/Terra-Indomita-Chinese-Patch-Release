 bactria_start:0 "#t 巴克特里亚#!\n难度：#y 困难#!\n\n尽管巴克特里亚仍然处于塞琉古帝国的阴影之下，但塞琉古帝国已被西方的众多冲突所困扰，使得它的总督领无法抵御斯基泰的侵袭。巴克特里亚很富裕，城市化程度高，土地肥沃，如果她能获得自由，将成为一个伟大的国家。"

l_simp_chinese:
 rel_flavor_persia.1.a:0 "伟大的阿胡拉·马兹达！"
 rel_flavor_persia.1.ai:0 "仅 AI 选择"
 rel_flavor_persia.1.b:0 "光辉的密特拉！"
 rel_flavor_persia.1.c:0 "我们坚持我们的旧神！"
 rel_flavor_persia.1.d:0 "雷霆之神宙斯！"
 rel_flavor_persia.1.desc:0 "#E 波斯#!的崇拜众多、多彩且极具吸引力。我们很容易将我们非常易变的宗教传统与#E 波斯#!的崇拜融合。有一种被称为#E 祆教徒#!的信仰，他们崇拜天空之主#E 阿胡拉·马兹达#!，并将先知#E 查拉图斯特拉#!视为重要人物。或者崇拜光明之神#E 密特拉#!的#E 米底祭司#!。当然，我们也可以尝试将我们自己的#E 七曜信仰#!强加于#E 波斯#!的居民。或者，我们可以借鉴#E 塞琉古王朝#!和#E 马其顿#!的#E 宙斯#!、#E 阿佛洛狄忒#!和#E 哈迪斯#!等崇拜。此外，还有#E 美索不达米亚#!的土地及其诸神，如#E 伊什塔尔#!、#E 厄瑞什基伽勒#!、#E 洪班#!。\n\n选择权在我们手中。让我们决定哪种崇拜将成为#E 波斯#!的未来。"
 rel_flavor_persia.1.e:0 "伊什塔尔的威力！"
 rel_flavor_persia.1.f:0 "瓦克什的力量！"
 rel_flavor_persia.1.g:0 "佛陀之道！"
 rel_flavor_persia.1.t:0 "波斯的崇拜"

l_simp_chinese:
 adonia:0 "阿多尼斯节"
 carthage_mission_trade_metropolis_west_modifier:0 "西方的大都会"
 cr_carthage_disaster_events.2.a:0 "野性汹涌，雅姆就是大海"
 cr_carthage_disaster_events.2.b:0 "神明帮助那些帮助自己的人"
 cr_carthage_disaster_events.2.desc_capital:0 "在过去的几天里，强风和巨浪一直在袭击[THIS.GetProvince.GetName]的海岸，这清楚地表明，神是不可捉摸的，我们凡人只是祂们宏伟生活中的一个不起眼的东西。对我们来说，只有解读启示，了解祂们的希望。\n\n最近的这场风暴不能被误解；这清楚地表达了雅姆的不满……因为他在深海深处的宝座上，祂试图通过风和浪来移动[THIS.GetProvince.GetName]港口周围的沙子，来隔离我们的商人，掐住我们的命脉。"
 cr_carthage_disaster_events.2.desc_generic:0 "在过去的几天里，强风和巨浪一直在冲击着[THIS.GetProvince.GetName]的海岸，这清楚地表明，诸神是不安分的，而我们这些凡人只是他们宏伟生活中的数字。对我们来说，除了解释迹象以了解他们的愿望外，别无他法。\n\n而最近的这场风暴不能被误解；它清楚地表达了亚姆的不满......因为他从他的深渊宝座上，在海洋深处，他试图通过发送风和海浪来改变[THIS.GetProvince.GetName]的港口周围的沙子，使[THIS.GetProvince.GetName]的商人，他们的生命线沉沦。"
 cr_carthage_disaster_events.2.t:0 "诸神的骚动"
 cr_carthage_disaster_events.3.a:0 "野性汹涌，雅姆就是大海"
 cr_carthage_disaster_events.3.a_tt:0 "或许这是巴力变相的祝福?"
 cr_carthage_disaster_events.3.desc_capital:0 "从带来生命的雨水，到夺走生命的风暴；我们所有的生活都受制于众神的意志。对于凡人来说，只能解释神明，并取悦他们的意愿。最近袭击我们海岸的风暴就证明了这一点。因为神明已经派风和浪来转移沙子，使[scope:sP('cr_gods_wrath_province')]的港口陷落，切断了他们商人的生命线......"
 cr_carthage_disaster_events.3.desc_generic:0 "从带来生命的雨水，到夺走生命的风暴；我们所有的生命都受制于诸神的意志。对于凡人来说，只有解释神灵，并取悦他们的意愿。最近袭击[THIS.GetProvince.GetName]海岸的风暴就证明了这一点......因为神明已经派风和浪来转移沙子，使[scope:sP('cr_gods_wrath_province')]的港口陷落，切断了他们商人的生命线......"
 cr_carthage_disaster_events.4.a:0 "巴力的神圣祝福!"
 cr_carthage_disaster_events.4.b:0 "巴力给了我们一个急需的机会，我们必须要抓住!"
 cr_carthage_disaster_events.4.desc_capital:0 "在过去的几天里，强风暴雨一直在肆虐[THIS.GetProvince.GetName]，这清楚地表明了神的力量以及祂们赐福和施刑的威能。对于我们这些凡人来说，除了理解祂们的预兆和获悉祂们的心愿，没有别的方法。\n\n而最近的这场大雨除了说是巴尔的祝福外并不能被解释为任何东西！因为从祂在天上的宝座上，可以看到他对我们的恩赐。从祂在神国的御座上降下雨和风，使河水暴涨，冲洗一直困扰着我们的商人并阻碍我们生命线的沙石!"
 cr_carthage_disaster_events.4.desc_generic:0 "在过去的几天里，强风和大雨一直冲击着[THIS.GetProvince.GetName]，这清楚地表明了神的力量和他们赐予祝福和施加惩罚的能力。对于我们这些凡人来说，除了解释他们的迹象和了解他们的愿望之外，别无他法。\n\n而最近的这场大雨不能被解释为任何东西，只能说是巴的祝福！因为从他在天上的宝座上，可以看到他对我们的恩赐。因为他从他在天上的宝座上派来了雨和风，使河流膨胀，并冲走了沉淀在[THIS.GetProvince.GetName]商人身上的沙子，阻碍了他们的生命线!"
 cr_carthage_disaster_events.5.a:0 "巴力的确定无疑的祝福"
 cr_carthage_disaster_events.5.a_tt:0 "也可能是亚姆不高兴的表现...？"
 cr_carthage_disaster_events.5.desc_capital:0 "从带来生命的雨水，到夺走生命的风暴；我们所有的生命都受制于诸神的意志。对于凡人来说，只能解释神灵，并取悦他们的意愿。最近袭击我们海岸的风暴就证明了这一点。因为神明已经派风和浪来溶解固定[scope:sP('cr_gods_wrath_province')]港口的沙子，减轻了他们的挣扎......"
 cr_carthage_disaster_events.5.desc_generic:0 "从带来生命的雨水，到夺走生命的风暴；我们所有的生命都受制于诸神的意志。对于凡人来说，只有解释神灵，并取悦他们的意愿。最近袭击[THIS.GetProvince.GetName]海岸的风暴就证明了这一点......因为神明已经派人用风和浪溶解了沉浸在[scope:sP('cr_gods_wrath_province')]港的沙子，减轻了他们的挣扎......"
 cr_carthage_flavour.1.a:0 "戏剧是所有的乐趣和喜悦。"
 cr_carthage_flavour.1.b:0 "这毫无道理"
 cr_carthage_flavour.1.b.desc:0 "重点是对迦太基人的荒诞和刻板的表现。"
 cr_carthage_flavour.1.desc:0 "“我敬拜掌管这座城市的男神和女神，以便我带着好兆头来到这里，完成我为之而来的事业；诸神啊，请帮助我，让我找到我的女儿们和我表弟的儿子。那些从我身边被偷走的人，还有他的儿子从我表弟那里被偷走的人。”\n在纯粹的布匿语中，《波鲁努斯》开始了，这是普劳图斯的最新喜剧。 《波鲁努斯》讲述了一个年轻人爱上了一个被绑架并卖淫的迦太基女孩的故事，并通过一系列喜剧不幸，在他的帮助下摆脱了皮条客的束缚，并与父亲团聚。 \n\n"
 cr_carthage_flavour.1.desc.disliked:0 "该剧以其出色的人物选择引起了不少人的注意；因为它以迦太基人--而不是希腊人--为主角，甚至没有把他们描绘成恶棍或替罪羊！该剧以其出色的人物选择引起了不少人的注意。"
 cr_carthage_flavour.1.desc.liked:0 "一出偶然的戏剧，"
 cr_carthage_flavour.1.desc.optimates:0 "戏剧是了不起的，这一部更了不起：戏剧已经对先人有了不健康的迷恋，好的戏剧至少有一个共同的体面，即不关注希腊人的角色，普劳图斯决定改用"
 cr_carthage_flavour.1.t:0 "小腓尼基人"
 cr_religious_festival_adonia.a:0 "让我们希望他能尽快回来!"
 cr_religious_festival_adonia.desc:0 "今天，[capital_scope.GetName]的妇女们在屋顶上种花、烧香，庆祝并哀悼阿多尼斯和阿斯塔特之间失去的爱情!"
 cr_religious_festival_marzeah.a:0 "这就是梅尔卡特大人的重生!"
 cr_religious_festival_marzeah.desc:0 "烤鹌鹑、芋头叶和香的味道充斥着[capital_scope.GetName]的街道，妇女们彻夜狂欢，米奇梅利姆与阿施塔特完成了神圣的婚姻，在明天，梅尔卡特的塑像将被烧毁，并被送到海浪上漂流，这样他就可以从火和烟中升起！"
 cr_religious_festival_mayumas.a:0 "愿它保持土地的干燥!"
 cr_religious_festival_mayumas.desc:0 "一只金鸽子被带到了海上，而来自世界各地的朝圣者则带着水从大洪水退去的鸿沟中倾泻而下，因为现在是玛雅玛斯的时间；阿塔格特的伟大节日。"
 cr_religious_flavour_events.1.desc:0 "几个世纪以前，[provincial_deity.GetName]教给腓尼基人造船和航海的艺术，以便他们可以找到神话中的流浪的安布罗西尔岩石。\n在岩石上，他们发现了一棵橄榄树、一条蛇和一只鹰，它们都被火吞噬了，但--奇怪的是--没有被火吞噬。为了纪念把他们带到那个神奇的地方的神，他们把那只燃烧的鹰献给了梅尔卡特。这一行为打破了咒语，安布罗西尔岩停止了他们的流浪，并为[shrine_location.GetName]提供了基础。\n\n从那一天起，在那个祭祀的地方，矗立着[SCOPE.sP('shrine_location').Custom('temple_string')]#! 的#金色[provincial_deity.GetName]。它是如此神圣，以至于没有外国人被允许进入它的辖区，它是如此著名，以至于亚历山大本人都来朝拜。\n\n今天，我们英勇的军队洗劫了[SCOPE.sP('shrine_location').Custom('temple_string')]，并清空了它的宝库中几个世纪以来积累的神圣文物。"
 cr_religious_flavour_events.1.desc_phoenician:0 "几个世纪前，#英勇的主#! [provincial_deity.GetName]教给我们的人民造船和航海的艺术，以便我们可以找到神话中漂泊的安布罗西尔岩石。\n在岩石上，我们发现了一棵橄榄树、一条蛇和一只鹰，它们都被圣火吞噬了，但奇怪的是没有被火烧死。为了向梅尔卡特致敬，用燃烧着的鹰作为祭品，打破了魔咒，使安布罗西尔岩停止了游荡。\n\n从那一天起，在那个祭祀的地方，就矗立着[SCOPE.sP('shrine_location').Custom('temple_string')]#! 的#金色[provincial_deity.GetName]。它是如此的神圣，以至于没有外国人被允许进入它的辖区，它是如此的著名，以至于亚历山大本人都来朝拜。\n\n现在有消息传来，我们主的家园被卑鄙的[sacker.GetAdjective]势力洗劫一空。"
 cr_religious_flavour_events.2.a:0 "我们等待着他的回归!"
 cr_religious_flavour_events.2.desc:0 "当消息传出#bold 主#![provincial_deity.GetName]位于[GetProvince('(int32)743').GetName]的神庙被[SCOPE.sCountry('sacker').GetAdjective]人摧毁时，整个[GetProvince('(int32)1344').GetName]都响起了哀叹。但这些哀叹与其说是为梅尔卡特大人本人而发，不如说是为神庙失去的宏伟而发。因为他是一位流浪之神，过着循环往复的生命：每年他都会死去，每年又会从灰烬与烟雾中重生。\n\n只有当烤鹌鹑、芋叶和焚香的气味将主从沉眠中唤醒后，#bold 复起仪式#!才会发生。因此，在#bold 马尔泽亚节#!之前的三天里，人们会举行奢华的丧葬宴会、哀乐和#bold 立神仪式#!，传播他的神圣种子，所有这一切都是为了确保梅尔卡特大人会从沉睡中醒来。\n\n这本已是[GetProvince('(int32)1344').GetName]宗教年中最重要的时刻，而人们对今年马尔泽亚节的期待比以往更高，因为他们相信梅尔卡特大人将在这里重生，并将这座城市作为他的新家！"
 cr_religious_flavour_events.2.t:0 "梅尔卡特的埃格西斯"
 cr_religious_flavour_events.3.a:0 "流浪的神有了一个新家"
 cr_religious_flavour_events.3.a_tt:0 "梅尔卡特的一个新圣地已经在[p:1344.GetProvince.GetName]创建。"
 cr_religious_flavour_events.3.desc:0 "当伟大的[ROOT.GetCountry.GetCapital.GetName]神庙毁于卑鄙的[GetProvince('(int32)743').GetName]之手的消息传来时，整个[SCOPE.sCountry('sacker').GetAdjective]听到了许多悲叹。然而，这些悲叹与其说是为#bold Lord#! [provincial_deity.GetName]，不如说是为失去的宏伟神庙本身，因为他是一个流浪的神，他的存在是循环的：每年他都会死去，每年他都会在#bold Marzeah节期间重生#!。\n\n今年的Marzeah节被寄予了更大的期望，因为它不仅标志着主本身的重生，而且--随着[GetProvince('(int32)743').GetName]神庙的毁坏--他也有望将一个新的神庙作为他的家!"
 cr_religious_flavour_events.3.t:0 "西方的梅尔卡特"
 cr_sicily_flavour_events.10.a:0 "献给[GetCountry('CAR').GetAdjective]人的一份美妙礼物"
 cr_sicily_flavour_events.10.a_tt:0 "这座雕像将被送往[GetCountry('CAR').GetName]。[GetCountry('CAR').GetAdjective]人如何回应将取决于他们现任统治者的家庭。"
 cr_sicily_flavour_events.10.b:0 "一座为我们带来和平的美妙的纪念碑!"
 cr_sicily_flavour_events.10.desc:0 "我们的西西里是一个有故事的地方，有许多遗迹提醒人们在我们给它带来和平之前这个岛的状态。在岛的西部，靠近[GetProvince('(int32)94').GetName]的地方有一个这样的警示：#bold 莫塔亚#!。它曾经是该地区最富有的布匿港口，现在是一片荒凉的废墟；现在是[GetCountry('CAR').GetName]和[GetCountry('SYR').GetName]之间众多战争中的一个牺牲者。\n\n然而，偶尔人们仍能发现莫塔亚曾经的伟大。一个住在废墟附近的渔民声称挖出了一座宏伟的雕像，描绘的是马戈尼德的哈米尔卡，[GetCountry('CAR').GetAdjective]国王中的最后一个，也是那个带着30万人征服西西里岛却只发现了灭亡的人。"
 cr_sicily_flavour_events.10.t:0 "马戈尼德人哈米尔卡的回归"
 cr_sicily_flavour_events.11.a:0 "[GetCountry('ROM').GetAdjective]的外交是最好的..."
 cr_sicily_flavour_events.11.a_tt:0 "雕像被送回[GetCountry('ROM').GetName]。"
 cr_sicily_flavour_events.11.b:0 "既往不咎"
 cr_sicily_flavour_events.11.b_tt:0 "我们接受这份[GetCountry('ROM').GetAdjective]礼物"
 cr_sicily_flavour_events.11.desc_democratic:0 "马戈尼德人哈米尔卡曾带着30万人前往西西里岛，但令他永远感到羞愧的是他们中没有一个人回来；这位背叛者甚至自焚而不愿面对后果，从他的骨灰和烟雾中诞生了另一个专制政府：Miat-104人议会。而现在，那些罗马人，出于他们的“善意”，决定把他们在西西里岛上发现的那个背叛者的雕像还给我们，这是他们从我们那里偷来的领土。。。"
 cr_sicily_flavour_events.11.desc_generic:0 "曾经，在几代人之前，我们光荣的城市被一串的马戈尼德国王所统治，他们在寻求荣耀的过程中，给我们的人民带来了一场又一场灾难。最后一次马戈尼德人的灾难，也是最终结束他们对权力的束缚的一次灾难，是阿梅尔卡特和他对西西里岛命运多舛的远征：他率领30万人去征服该岛，结果却被[GetCountry('SYR').GetAdjective]僭主革隆和一小撮人击溃，令他永远蒙羞。\n叛徒没有面对马戈尼德人给我们带来的又一场灾难的后果，而是在他为纪念希腊海神波塞冬而竖起的火堆上自焚了。\n\n今天，一艘船从[GetCountry('ROM').GetName]运来了一座曾经在西西里岛竖立的雕像，以颂扬阿麦卡特和他的王权--这是[GetCountry('ROM').GetAdjective]人的礼物。"
 cr_sicily_flavour_events.11.desc_magid:0 "[scope:sChar('magid_suffette').GetName]的祖先哈梅尔卡特以荣耀为目标，组建了我们的人民所见过的最大的队伍，把西西里岛的希腊人的房子整理好。三十万人渡海而来，在希梅拉与希腊人相遇。格隆知道自己不敌对手，面临灭顶之灾，于是采用了希腊人在面对我们的力量时一贯的做法：诡计和背叛。他让他的军队冒充我们的塞利努特盟友，这些盟友是来向波塞冬献祭的，只是为了在献祭时创造机会杀死哈梅尔卡特，为进攻埋下混乱的种子。\n\n然而哈默卡特却被指责为对希腊人的亵渎......他的敌人利用这场灾难，通过建立Miat--104人会议，摧毁了马戈尼德对权力的控制。\n\n现在，罗马人优雅地提出归还他们在[GetProvince('(int32)94').GetName]的废墟中发现的哈梅尔卡特的宏伟雕像。"
 cr_sicily_flavour_events.11.t:0 "马戈尼德人阿梅尔卡特的回归"
 cr_sicily_flavour_events.12.a:0 "有些人..."
 cr_sicily_flavour_events.12.desc:0 "看来[GetCountry('CAR').GetAdjective]们对被送来一尊颂扬他们最糟糕的国王之一的雕像并不太高兴，因为他们已经把雕像还给了我们。"
 cr_sicily_flavour_events.13.a:0 "正如他们应该做的那样"
 cr_sicily_flavour_events.13.desc:0 "[GetCountry('CAR').GetAdjective]们已经让我们知道，他们非常感谢我们送去的雕像。"
 cr_sicily_flavour_events.2.a:0 "英雄需要回到家乡!"
 cr_sicily_flavour_events.2.b:0 "我们对旧的饰品没有兴趣"
 cr_sicily_flavour_events.2.c:0 "他怎么会是这样一位历史专家？"
 cr_sicily_flavour_events.2.d:0 "他希望我们付给他......吗!"
 cr_sicily_flavour_events.2.d_tt:0 "该选项可用是由于你的统治者的#Y 可疑的性格#!。"
 cr_sicily_flavour_events.2.desc:0 "穆蒂亚曾经是西西里岛的布匿明珠：繁华的贸易中心，也是我们在岛上的主要竞争对手。也就是说，直到长老狄奥尼修斯终结了这座城镇。如今，这里只不过是一片荒凉的废墟，只有少数渔民居住着。\n\n然而，在极少数情况下，废墟会显露出昔日辉煌的一丝光芒：一位渔夫来到法庭，声称他发现了一座格隆的雕像，这位传奇僭主曾在希梅拉镇压迦太基人，将西西里岛从他们的统治下拯救出来！他愿意向我们展示它的位置，以换取一小笔钱......\n\n他将雕像本身描述为一件宏伟的艺术作品，将盖隆描绘成卡拉索斯舞者——阿波罗的入会者。渔夫被塑造成一个女性化、没有胡须的年轻人，他认为迦太基人可能从阿克拉加斯拿走了这座雕像，并将其展示在穆蒂亚，以嘲笑这位伟大的英雄。"
 cr_sicily_flavour_events.2.t:0 "格伦的回归"
 cr_sicily_flavour_events.2b_tt_a:0 "该选项可用是由于你的统治者的#Y 学术知识#!。"
 cr_sicily_flavour_events.2b_tt_b:0 "该选项可用是由于你的统治者的#Y 怀疑性格#!。"
 cr_sicily_flavour_events.2b_tt_c:0 "该选项可用是由于你的统治者的#Y 高超的技巧#!。"

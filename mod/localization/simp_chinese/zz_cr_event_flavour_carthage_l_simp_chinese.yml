 startup_events.2.b:0 "上天嫉妒我们的欢乐，变得苍白……"
 startup_events.2.desc:0 "五百年前，睿智的女王伊利沙特逃离了兄长普马亚顿与[GetProvince('(int32)743').GetName]宫廷的阴谋。她踏上跨越地中海、历时数年的漂泊旅程，最终抵达此地，建立了她的新城。即便如此，自我们卑微的开端以来，邻人便一直试图支配我们；既有约束我们、迫使我们纳贡的努米底亚诸王，也有企图支配我们贸易的腓尼基姐妹城。\n\n然而我们坚持了下来，也克服了一切：我们已经确立自身为地中海贸易的重要枢纽。我们的港口满溢着来自已知世界各处的货物；卡西忒里得斯的锡、赫拉克勒斯之柱彼端的盐与铁、伊比利亚的铜与银、沙漠彼端的象牙与黄金，当然还有我们自己制造的玻璃与染料。\n\n我们确实是蒙福的民族。\n\n然而祝福也带来嫉妒。那些得不到诸神眷顾的人心生嫉妒。因此，我们必须保持警惕，保护我们光荣的城市免受劣等民族侵害。因为在海的彼岸，希腊人中最可悲的[GetCharacter('(int32)56').GetPraenomen]仍统治着叙拉古。而在更北方，未开化的意大利土地上，那些自称埃涅阿斯继承者的人也开始蠢动……"
 startup_events.2.t:0 "狄多的继承者"

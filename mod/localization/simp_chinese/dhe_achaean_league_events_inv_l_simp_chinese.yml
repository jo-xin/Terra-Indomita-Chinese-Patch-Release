l_simp_chinese:
 desc_dhe_acl_1_cmod:0 "推翻马其顿霸主并驱逐其驻军，对希腊人来说是一个强有力的集结口号。"
 dhe_achaean_league.1.a:0 "派出信使！通知新成员打开他们的金库。"
 dhe_achaean_league.1.at:0 "#Y 亚该亚#! 和邻近的 #Y 阿卡迪亚#! 的每个国家都将被邀请加入我们的联盟；他们可以提供金币以充实我们的战争基金。"
 dhe_achaean_league.1.b:0 "派出信使！通知新成员派遣战士补充我们的队伍。"
 dhe_achaean_league.1.bt:0 "#Y 亚该亚#! 和邻近的 #Y 阿卡迪亚#! 的每个国家都将被邀请加入我们的联盟；他们可以提供人力以捍卫我们的利益。"
 dhe_achaean_league.1.desc:0 "风味文本。"
 dhe_achaean_league.1.t:0 "对亚该亚联盟的邀请"
 dhe_achaean_league.2.a:0 "腓力和亚历山大的遗产压在我们头上已经太久了。让希腊人联合起来反抗继业者！"
 dhe_achaean_league.2.at:0 "我们将作为次要成员加入亚该亚同盟。这将使我们成为 [SCOPE.sC('achaean_leader_country').GetName] 的 #Y 藩属#!。"
 dhe_achaean_league.2.b:0 "同盟永远不会代表我们的利益。我们将保持独立。"
 dhe_achaean_league.2.bt:0 "不会发生重大变化。"
 dhe_achaean_league.2.c:0 "同盟是愚蠢的使命！只有在托勒密这样慷慨保护者的庇护下，我们才有望在马其顿压迫下幸存！"
 dhe_achaean_league.2.ct:0 "我们向南方的埃及人寻求保护。这将使我们成为[SCOPE.sC('c:EGY').GetName]的#Y 朝贡国#!。"
 dhe_achaean_league.2.desc:0 "风味文本。"
 dhe_achaean_league.2.t:0 "邀请参加亚该亚同盟"
 dhe_achaean_league.3.a:0 "这笔赏金将确保我们在困苦时期能充分支付士兵和雇佣兵的报酬。"
 dhe_achaean_league.3.at:0 "我们或许已获得若干仰赖我们领导的附属国。"
 dhe_achaean_league.3.b:0 "这些人将帮助我们更好地保卫城市驻军，抵御马其顿人。"
 dhe_achaean_league.3.bt:0 "我们或许已获得若干仰赖我们领导的附属国。"
 dhe_achaean_league.3.desc:0 "风味文本。"
 dhe_achaean_league.3.t:0 "亚该亚同盟事务"
 dhe_achaean_league.4.a:0 "他的干劲和人脉无疑将造福全体希腊人。"
 dhe_achaean_league.4.at:0 "一位天才人物将加入我们的宫廷。"
 dhe_achaean_league.4.desc:0 "风味文本。"
 dhe_achaean_league.4.t:0 "西库昂的阿拉托斯"
 dhe_acl_1_cmod:0 "抵抗继业者"

 wei_unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 yan_unificate_china:0 "一统天下"
 yan_unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 yuminxiuxi:0 "让百姓休养生息"
 yuminxiuxi_desc:0 "长期战乱之后，天下已是满目疮痍。如今我们再次统一世界，是时候减轻税负与兵役，使天下百姓休养生息。"
 zha_unificate_china:0 "一统天下"
 zha_unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 zhuzibaijia_daojia:0 "道家"
 zhuzibaijia_daojia_desc:0 "道家为诸子百家之一。春秋战国之际，老子汇集古圣先贤之思，建构出以“道”为核心的学说体系，主张道法自然、无为而治，以柔守刚，使万物各遂其性。道家思想影响政治、经济、治术与兵略，强调顺应自然与尊重差异，使人得以自为其主，成为华夏文化中最重要的思想传统之一。"
 zhuzibaijia_fajia:0 "法家"
 zhuzibaijia_fajia_desc:0 "法家是春秋战国时期以法治为核心的思想流派。其学说反对世卿世禄的旧秩序，主张不泥古法、不拘旧礼，凡能强国利民者皆可施行。法家在政治实践中奖励耕战、重农抑商、以法术势强化君主权力。在礼崩乐坏、列国竞强的战国时代，这种务实而严厉的治国之道极具效力。"
 zhuzibaijia_mojia:0 "墨家"
 zhuzibaijia_mojia_desc:0 "墨家是先秦时期的重要学派之一，组织严密，首领称为“钜子”。墨者出仕各国时需践行墨子之道，并服从钜子的号令。墨子早年受儒学影响，后来弃儒创墨，提出兼爱、非攻、尚贤、尚同、天志、明鬼、非命、非乐、节葬、节用等主张。墨家虽多与儒家相辩，却同样深受先秦礼义传统影响。"
 zhuzibaijia_rujia:0 "儒家"
 zhuzibaijia_rujia_desc:0 "儒家以孔子之学为宗，以“仁”为核心，重视亲亲、礼法与社会秩序。孟子继承并发展孔子学说，倡导仁政，使儒家思想进一步成形。孔子所创立的儒家学说总结、继承并重塑了夏、商、周以来的礼乐传统，形成一套完整的思想体系，深刻影响了华夏政治与社会生活。"

l_simp_chinese:
 abolish_bachaoxiuxian:0 "上朝理政"
 abolish_bachaoxiuxian_desc:0 "放任国政无人照管乃是国家衰亡之兆，你决定上朝理政。"
 abolish_chennihougong:0 "不再沉溺酒色"
 abolish_chennihougong_desc:0 "不再沉溺酒色"
 abolish_shangyang_low:0 "废除商鞅之法"
 abolish_shangyang_low_desc:0 "商鞅之法过于严苛，百姓早已怨声载道。如今世界已经平定，人民需要休养生息，是时候废除商鞅之法了！"
 aos_bachaoxiuxian:0 "停止上朝并修习长生之术"
 aos_bachaoxiuxian_desc:0 "停止上朝并修习长生之术"
 aos_chenihougong:0 "沉溺酒色"
 aos_chenihougong_desc:0 "沉溺酒色"
 aos_create_empire:0 "帝国的野心"
 aos_create_empire_desc:0 "[COUNTRY.GetRuler.GetName]沐浴在征服的荣耀中，已令所有其他小王国黯然失色；[COUNTRY.GetAdjective]帝国的统治者需要一个新的头衔。"
 aos_deify_emperor:0 "神圣认可"
 aos_deify_emperor_desc:0 "很少有人否认[COUNTRY.GetRuler.GetName]受到了神明赐福。因此，这样神圣的传承只能属于一位神圣存在。"
 aos_jianlixiyuduhu:0 "设立西域都护"
 aos_jubanguoyan:0 "举办国宴"
 aos_jubanguoyan_desc:0 "大宴宾客！"
 burn_books_buried_Confucian_scholar:0 "焚书坑儒"
 burn_books_buried_Confucian_scholar_desc:0 "长期以来，天下儒士一直攻击并贬损我国政策方针。有时他们对政策法规心怀不满，有时更以犯上之言诽谤陛下。他们算什么，旧日残余吗？竟敢随意议论陛下与我国政策？如今旧王朝已经灭亡，是时候让这些旧时代遗物随旧时代一同埋入地下了！"
 capital_at_wangcheng:0 "迁都成周"
 ce_chaoyi:0 "朝会"
 ce_chaoyi_desc:0 "你召集群臣入朝议事。"
 che_tonggui_shu_tongwen:0 "车同轨，书同文"
 che_tonggui_shu_tongwen_desc:0 "经历漫长的分裂与战乱之后，我们终于重新统一了中国。然而，各地语言、文字与生活习惯早已产生诸多差异，文书传达、税赋征收以及中央与地方之间的往来都因此倍感不便。既然天下已由我们重新归一，也该重新确立统一的文字与生活规范了。"
 chu_eliminate_maladministration:0 "革除弊政"
 chu_eliminate_maladministration_desc:0 "随着先王逝去，是时候推翻他的恶政了。"
 chu_move_capital_to_shouchun:0 "迁都寿春"
 chu_move_capital_to_shouchun_desc:0 "荆地的郢都已不再属于我们，但淮南仍有一处适合作为首都的地方——寿春。"
 chu_unificate_china:0 "一统天下"
 chu_unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 enter_zhuzibaijia_baipu:0 "接纳诸子百家学说"
 enter_zhuzibaijia_baiyue:0 "接纳诸子百家学说"
 enter_zhuzibaijia_chinese:0 "接纳诸子百家学说"
 enter_zhuzibaijia_rongdi:0 "接纳诸子百家学说"
 enter_zhuzibaijia_yi:0 "接纳诸子百家学说"
 han_declare_war_to_chu:0 "对楚宣战"
 han_declare_war_to_chu_desc:0 "准备已经就绪，现在可以对楚国宣战了。"
 han_prepare_declare_war_to_chu:0 "准备合纵伐楚"
 han_prepare_declare_war_to_chu_desc:0 "不久前，齐、魏、韩三国约定合力伐楚。如今楚王昏聩，正是整军备战的良机。我们将在来年发动进攻。"
 han_unificate_china:0 "一统天下"
 han_unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 heirloom_seal_of_the_realm:0 "制作传世玉玺"
 heirloom_seal_of_the_realm_desc:0 "如今我们已经统一诸国，一些廷臣建议制作一件象征天子地位的信物，使其世代相传，以体现上天眷顾与正统。制作它的材料自然应当是珍贵的和氏璧。"
 integrate_north_youzhou:0 "整合幽州北部"
 integrate_north_youzhou_desc:0 "幽州北部的基础设施已经相当完备，与我国其他领土不再有什么差别。此前关于该地区制度存废的讨论可以告一段落了。"
 nomadic_empire_decision:0 "游牧帝国"
 nomadic_empire_decision_desc:0 "虽然绝大多数迁徙部落以狩猎采集为生，但如今一种新的生产方式正在草原上逐渐兴起。若这些诞生于草原的游牧部落团结起来，他们将能够成为一股强大的力量。"
 other_six_countries_do_not_exist:0 "战国七雄中只有你仍然存在（附庸国或叛乱势力改用七雄国号不会影响此条件判断。消灭开局时的七雄，直到只剩你一国即可）。"

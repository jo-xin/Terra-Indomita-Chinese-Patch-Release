 reenabling_shangyang_low:0 "恢复商鞅之法"
 reenabling_shangyang_low_desc:0 "商鞅之法为我国带来无数益处，是时候恢复其施行了。"
 reestablish_bii:0 "将国号改为鄪"
 reestablish_bii_desc:0 "如今我们已经夺取鄪国故都，可以宣告继承鄪国！"
 reestablish_chu:0 "改国号为楚"
 reestablish_chu_desc:0 "如今我们已经夺取楚国故都，可以宣告继承楚之王统！"
 reestablish_han:0 "改国号为韩"
 reestablish_han_desc:0 "如今我们已经夺取韩国故都，可以宣告继承韩之王统！"
 reestablish_jin:0 "将国号改为晋"
 reestablish_jin_desc:0 "如今我们已经夺取晋国故都，可以宣告继承晋国王位！"
 reestablish_luu:0 "将国号改为鲁"
 reestablish_luu_desc:0 "如今我们已经夺取鲁国故都曲阜，可以宣告继承鲁国王位！"
 reestablish_ni:0 "将国号改为倪"
 reestablish_ni_desc:0 "如今我们已经夺取倪国故都，可以宣告继承倪国王位！"
 reestablish_qin:0 "改国号为秦"
 reestablish_qin_desc:0 "如今我们已经夺取秦国故都咸阳，可以宣告继承秦之国祚！"
 reestablish_song:0 "将国号改为宋"
 reestablish_song_desc:0 "如今我们已经夺取宋国故都，可以宣告继承宋国王位！"
 reestablish_teng:0 "将国号改为滕"
 reestablish_teng_desc:0 "如今我们已经夺取滕国故都，可以宣告继承滕国王位！"
 reestablish_wei:0 "改国号为魏"
 reestablish_wei_desc:0 "如今我们已经夺取魏国故都，可以宣告继承魏之王统！"
 reestablish_wii:0 "将国号改为卫"
 reestablish_wii_desc:0 "如今我们已经夺取卫国故都，可以宣告继承卫之王统！"
 reestablish_yan:0 "改国号为燕"
 reestablish_yan_desc:0 "如今我们已经夺取燕国故都，可以宣告继承燕之王统！"
 reestablish_zhao:0 "改国号为赵"
 reestablish_zhao_desc:0 "如今我们已经夺取赵国故都，可以宣告继承赵之王统！"
 reestablish_zhou:0 "宣称周室大义"
 reestablish_zhou_desc:0 "周王早已失去应有权威，诸侯也僭取了称王之权。到如今，周王室已经彻底覆灭。然而周王之名仍具有相当号召力，我们或许可以宣称自己是周的合法继承者，以取得大义名分。当然，此时真正的统治者自然是我们的宗族。"
 reestablish_zhs:0 "将国号改为中山"
 reestablish_zhs_desc:0 "如今我们已经夺取中山故都灵寿，可以宣告继承中山王位！"
 reestablish_zou:0 "将国号改为邹"
 reestablish_zou_desc:0 "如今我们已经夺取邹国故都，可以宣告继承邹国王位！"
 restitution_rujia_jinjian:0 "恢复儒家地位"
 restitution_rujia_jinjian_desc:0 "我们曾错误地以焚书坑儒的暴行对待儒者，犯下深重罪过。儒者心怀善意，为国为民效力；他们出现在我们的朝廷中，将使国家得到更好的治理。是时候颁布诏令，恢复儒者在我国的地位了。"
 reunify_jin:0 "三晋再次归一"
 reunify_jin_desc:0 "数十年前，晋国最后的领土被韩、赵、魏三家瓜分。如今我们已重新掌控旧晋之地，也许是时候宣示我们的正统了。"
 unificate_china:0 "一统天下"
 unificate_china_desc:0 "随着原诸侯国的领土尽归我手，是时候宣告我们才是天命所归，并向天下万民昭示新时代的黎明。"
 wac_policy_discussion:0 "会议"
 wac_policy_discussion_desc:0 "你召集国内大臣开会。"
 wei_declare_war_to_chu:0 "对楚宣战"
 wei_declare_war_to_chu_desc:0 "准备已经就绪，现在可以对楚国宣战了。"
 wei_prepare_declare_war_to_chu:0 "准备合纵伐楚"
 wei_prepare_declare_war_to_chu_desc:0 "不久前，齐、魏、韩三国约定合力伐楚。如今楚王昏聩，正是整军备战的良机。我们将在来年发动进攻。"

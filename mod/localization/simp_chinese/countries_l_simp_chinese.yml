 form_achaean_league:0 "重建亚该亚同盟"
 form_achaean_league_claims_tooltip:0 "我们将获得#Y 亚该亚#!和#Y 阿卡迪亚#!诸省份的宣称。"
 form_achaean_league_desc:0 "需要风味文本"
 form_corsica:0 "成立科西嘉"
 form_corsica_desc:0 "一个距离意大利罗马/伊特鲁里亚丰富海岸如此之近的岛屿，科西嘉一直是一个野性的土地，被一条崎岖的山脉分割，这座山脉庇护了危险和坚韧的部落人。如果这片土地在本土统治下统一起来，它可以成为科西嘉人的堡垒。"
 form_greater_arachosia:0 "成立大阿剌科西亚"
 form_greater_arachosia_desc:0 "曾经是阿契美尼德帝国中最广阔和危险的总督辖区之一，阿剌科西亚的更大领域推动了已知和奇异的极限，将波斯和地中海世界与印度野生和丛林地区联系在一起。"
 form_greater_maeotia:0 "成立大迈俄提亚"
 form_greater_maeotia_desc:0 "迈俄提亚湖，这片位于黑海北部的巨大海域，一直是连接从大西洋到大西洋彼岸赫拉克勒斯之柱的水域通道的奇特角落。长期受希腊人和草原人民压迫的迈俄提亚部落必须掌握他们的海岸遗产，以便在这个混乱的世界中自我确立。"
 form_hellespontine_district:0 "成立赫勒斯滂管区"
 form_hellespontine_district_desc:0 "赫勒斯滂管区最初是由于雅典对博斯普鲁斯海峡和黑海海峡的贸易和暴力垄断而创建的，代表了世界上最富有的贸易枢纽之一，控制着税收和货物流通。重新建立这种经济垄断将使我们对世界的政治和未来有巨大的控制力。"
 form_ionian_league:0 "成立泛伊奥尼亚联盟"
 form_ionian_league_claims_tooltip:0 "我们将获得所有#Y 亚细亚#! 沿海省份地区的宣称！"
 form_ionian_league_desc:0 "当波斯人向我们进攻时，骄傲的伊奥尼亚人和爱琴海人联合起来抵抗他们。面对新的危险，重新建立兄弟情谊的时候又到了。在亚细亚海岸建立一个新的独立城邦联盟将使我们更好地击退野蛮人和希腊的国王!"
 form_lesser_scythia:0 "成立小斯基泰"
 form_lesser_scythia_desc:0 "此地亦称“小斯基泰”，是斯基泰人在古典时期鼎盛之际，由阿忒亚斯王统治的最南端疆域之一。这里既有繁华的贸易港口，亦有荒蛮的腹地，乃是草原霸主们伟大却同样微不足道的边陲之地。"
 form_punjab:0 "成立旁遮普"
 form_punjab_desc:0 "这个地区的人们称之为“般阐那陀”，意为“五河之地”。因此，我们将其命名为“旁遮普”。上印度河谷的富饶土地是世界上最富有和最肥沃的土壤之一，为无数入侵者和本土大帝国提供了完美的基础。"

l_simp_chinese:
 mandate_events.1.a:0 "这肯定会让官员们满意！"
 mandate_events.1.b:0 "可惜我们没有多余的钱。"
 mandate_events.1.desc:0 "为黄河的季节性洪水做准备是中国北方任何国家最古老且最重要的职责之一。我们的官员已经确定了一个近年来受灾尤为严重的地区。只要我们能阻止洪水威胁当地民众的生计，这片地区就会繁荣起来。"
 mandate_events.1.t:0 "黄河堤防"
 mandate_events.10.a:0 "我们自然应当修复它。"
 mandate_events.10.b:0 "我们没有时间理会这种胡闹。"
 mandate_events.10.desc:0 "我们省份中的一座周朝佛塔在多年疏于维护后已破败不堪。一位地方官员现在请求拨款修复这座佛塔。"
 mandate_events.10.t:0 "修缮佛塔"
 mandate_events.2.a:0 "我们必须接受这份献礼！"
 mandate_events.2.b:0 "我们不能拿声誉冒险。"
 mandate_events.2.desc:0 "我们最受尊敬的一位朝臣向我们呈上了一份昂贵礼物——一座宏伟且精心建造的乡间庄园。虽然与皇室国库相比不值一提，但这份礼物颇为豪华，任何观察者都清楚，送礼者必定期望得到某种回报……"
 mandate_events.2.t:0 "一份礼物"
 mandate_events.3.a:0 "处决他！"
 mandate_events.3.b:0 "最好对此保持沉默。"
 mandate_events.3.desc:0 "一段时日以来，皇室国库中的钱财一直神秘失踪，您已经开始将怀疑指向一名担任国库簿记员的宫廷官员。"
 mandate_events.3.t:0 "手脚麻利的司库"
 mandate_events.4.a:0 "我相信人民最懂得如何治理自己。"
 mandate_events.4.b:0 "我们不能让这件事从我们手中溜走！"
 mandate_events.4.desc:0 "看来[target_province.GetName]的地方官员自行采取行动刺激地方商业。他们发布的一系列法规虽然与官方政策大相径庭，却成功引发了当地贸易繁荣，许多当地家庭进入了利润丰厚的行业，同时也吸引了海外商人。然而，我们的顾问们正恳请我们制止他们并撤销这些地方规定，因为它们是对善政和中央权力的冒犯。"
 mandate_events.4.t:0 "贸易法规"
 mandate_events.5.a:0 "他显然是得到了好的建议。"
 mandate_events.5.b:0 "他不听取任何人的建议！"
 mandate_events.5.desc:0 "通过采用不断尾随皇帝并利用一切机会建立信任的策略，宫廷各派系已成功排挤了几位此前颇具影响力的朝臣，并在日常宫廷裁决中日益获得影响力。"
 mandate_events.5.t:0 "[ROOT.GetCountry.GetRuler.GetName]的孤立"
 mandate_events.6.a:0 "这些改革自然是必要的。"
 mandate_events.6.b:0 "没必要去骚扰农民。"
 mandate_events.6.desc:0 "官员们已着手一项计划，通过改进和更新地方人口普查来扩大[target_province.GetName]的征召规模。这项改革承诺将为帝国军队带来额外的人力，并改善该省份未来的征兵工作。然而，其他行政官员则认为，不去打扰当地人反而更有可能长期提升该省份的价值。"
 mandate_events.6.t:0 "[target_province.GetName]的征召"
 mandate_events.7.a:0 "他树立了一个极好的榜样！"
 mandate_events.7.b:0 "罢免该官员。"
 mandate_events.7.desc:0 "一位高级官员因经常鞭打他特别厌恶的一名侍从而为自己赢得了残酷的名声。尽管他完全有权惩罚下属，但这已引发了一场丑闻，人们普遍认为他的处置方式若能稍加节制会更好。"
 mandate_events.7.t:0 "侍从遭鞭打"
 mandate_events.8.a:0 "深挖不辍，贪得无厌！"
 mandate_events.8.b:0 "不要打草惊蛇。"
 mandate_events.8.desc:0 "一名年轻官员在我们其中一个省份发现了一座金矿。开采这处丰富的新矿脉似乎是理所当然的选择，但有人警告不要冒险，理由是担心货币供应可能过度扩张。"
 mandate_events.8.t:0 "金矿被发现"
 mandate_events.9.a:0 "谴责地方官员。"
 mandate_events.9.b:0 "重新努力进口金银。"
 mandate_events.9.desc:0 "据发现，大量青铜金银已通过各条贸易驳船流出了国境。宫廷官僚们正在热烈讨论此事是如何发生的。地方和中央官员互相指责。当天唯一达成的共识是，必须制止财富外流。"
 mandate_events.9.t:0 "金银流出国外"
 mandate_trade_regulations_mod:0 "地方贸易法规"
 mandate_trade_regulations_neg_mod:0 "贸易办事处关闭"

l_simp_chinese:
 desc_local_noble_research_boost:0 "该地区的贵族们利用过剩的莎草纸记录他们的科学调查结果。"
 desc_local_unrest_generic_unrest:0 "由于当地的事件，这个地区正在遭受普遍的动荡，人们感到不高兴。"
 desc_local_unrest_heavy_unrest:0 "由于当地的事件，这个地区正在遭受严重的动荡，人们相当不高兴。"
 desc_silk_quarter_merchant_modifier:0 "由于我们城市对丝绸的需求，我们已经扩大了当地的基础设施，以满足当地人的愿望。"
 inv_pop_events.1.a:0 "你现在真的要拿这种事来烦我吗？"
 inv_pop_events.1.b:0 "派遣卫兵去当地维持秩序"
 inv_pop_events.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，有许多自由民居住在[pop_province.GetName]，虽然这在征兵时是件好事，但有时也会出现我们必须处理的问题。\n\n当地人因为一些体育比赛的结果发生了骚乱，除非我们介入，否则有可能会失控。\n\n其中一个名叫[SCOPE.sChar('free_man').GetName]的当地人从[pop_province.GetName]千里迢迢来到[ROOT.GetCountry.GetCapital.GetName]面前，告诉我们这个可怕的消息。"
 inv_pop_events.1.t:0 "自由民之间的紧张关系"
 inv_pop_events.10.a:0 "他们将一无所获"
 inv_pop_events.10.b:0 "解除一些当地人的军事义务"
 inv_pop_events.10.desc:0 "[ROOT.GetCountry.GetRuler.GetName]收到了一封来自[pop_province.GetName]居民的请愿书，抱怨我们在他们地区的强力干预。\n\n他们用有些不恰当的语气要求给予当地更多的自由，希望一切恢复到我们到达该地区之前的样子。"
 inv_pop_events.10.t:0 "公民要求更多自由"
 inv_pop_events.2.a:0 "威胁所有人，让他们停止冲突行动"
 inv_pop_events.2.b:0 "我不在乎......让最强大的人拿走他们想要的东西"
 inv_pop_events.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们的部落成员之间发生了一些流血冲突，除非我们尽力缓和紧张局势，否则这些冲突有可能演变成更严重的事件。部落之间的小规模冲突是[ROOT.GetCountry.GetAdjective]生活中不可避免的一部分，我们鼓励这种冲突，但这种冲突正变得越来越血腥，如果我们不加以制止，可能会引发地区冲突。\n\n一位名叫[SCOPE.sChar('free_man').GetName]的当地勇士来到我们的首都，向我们通报了事态发展。"
 inv_pop_events.2.t:0 "部落间的紧张关系"
 inv_pop_events.3.a:0 "恐怕目前没有时间来处理这个问题。"
 inv_pop_events.3.b:0 "派遣我们的士兵去恢复[pop_province.GetName]的秩序"
 inv_pop_events.3.desc:0 "[pop_province.GetName]的阶级矛盾越来越严重--似乎该地区的公民和自由人无法和睦相处，并在公共场合发生冲突。\n\n政治活动、宗教节日、体育比赛——一切都成为暴乱的催化剂，双方都有很多人丧生。很显然，我们不能再忽视这个问题了。"
 inv_pop_events.3.t:0 "公民与自由民发生冲突"
 inv_pop_events.4.a:0 "我们将为丝绸进口建立一个新的奢侈品区"
 inv_pop_events.4.b:0 "谁能预测贸易路线会给我们带来什么？反正我不能"
 inv_pop_events.4.desc:0 "众所周知，[pop_province.GetName]是一个穷奢极欲的地方，那里的人们要求我们开始向他们的市场提供丝绸等高级纺织品。\n\n他们不在乎这种丝绸材料有多稀有，也不在乎它有多昂贵、多难得——最重要的是能满足他们的贪欲。"
 inv_pop_events.4.t:0 "贵族要求丝绸"
 inv_pop_events.5.a:0 "我们负担不起——多么荒谬的要求！"
 inv_pop_events.5.b:0 "人民的安全是无价的——做必要的事"
 inv_pop_events.5.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，[pop_province.GetName]周围流传着一个故事。我们听说，当地的一位贵族被一些不知名的许诺引诱到十字路口，然后被人用砖头砸死。\n无论我们怎么做，这位贵族已经死了，但我们或许可以向十字路口派出守卫，以确保此类事情不再发生？"
 inv_pop_events.5.t:0 "贵族被残忍杀害"
 inv_pop_events.6.a:0 "他们送了多少钱？这是个不错的数额..."
 inv_pop_events.6.b:0 "派遣士兵查封土地并进行拍卖"
 inv_pop_events.6.desc:0 "来自[pop_province.GetName]的噩耗——有一伙贪婪的贵族杀害了一位拒绝将财产出售给他们的当地地主。\n\n如此明目张胆的罪行理应受到惩罚，但贵族们却先发制人，向[ROOT.GetCountry.GetCapital.GetName]送上贿赂，希望我们不要理会他们的黑手，以免引起不可避免的反弹。"
 inv_pop_events.6.t:0 "黑心贵族杀死地产所有者"
 inv_pop_events.7.a:0 "我们目前无法承担这个费用"
 inv_pop_events.7.b:0 "当然可以！我们很乐意为此付出代价"
 inv_pop_events.7.desc.1:0 "[pop_province.GetName]的贵族是最有教养、最高雅的社会成员，许多历史学家和哲学家都来自这些精英家族。由于该地区的纸莎草纸过剩，如果我们愿意的话，可以花钱让贵族们加强公民研究——他们会很乐意做这项工作，但需要资金支持。"
 inv_pop_events.7.desc.2:0 "[pop_province.GetName]的贵族是最有教养、最高雅的社会成员，许多历史学家和哲学家都来自这些精英家族。由于该地区的纸莎草纸过剩，如果我们愿意的话，可以花钱让贵族们加强军事研究——他们会很乐意做这项工作，但需要资金支持。"
 inv_pop_events.7.desc.3:0 "[pop_province.GetName]的贵族是最有教养、最高雅的社会成员，许多历史学家和哲学家都来自这些精英家族。由于该地区的纸莎草纸过剩，如果我们愿意的话，可以花钱让贵族们加强演说研究——他们会很乐意做这项工作，但需要资金支持。"
 inv_pop_events.7.desc.4:0 "[pop_province.GetName]的贵族是最有教养、最高雅的社会成员，许多历史学家和哲学家都来自这些精英家族。由于该地区的纸莎草纸过剩，如果我们愿意的话，可以花钱让贵族们加强宗教研究——他们会很乐意做这项工作，但需要资金支持。"
 inv_pop_events.7.t:0 "贵族们为研究做出贡献"
 inv_pop_events.8.a:0 "我们能做些什么？答案是无能为力"
 inv_pop_events.8.b:0 "派遣我们的士兵去恢复[pop_province.GetName]的秩序"
 inv_pop_events.8.desc:0 "我们从[pop_province.GetName]收到了一份令人不安的报告。那里广阔的庄园似乎因残酷和苦难而闻名，奴隶们如果没有满足几乎无法完成的每日定额，就会被活活累死或折磨致死。\n\n这些可怕的故事牵动着[ROOT.GetCountry.GetCapital.GetName]人民的心弦，他们要求官方有所作为。"
 inv_pop_events.8.t:0 "被不公正地杀害的奴隶"
 inv_pop_events.9.a:0 "让他们说吧，我不在乎..."
 inv_pop_events.9.b:0 "派遣我们的特工在整个地区恐吓他们，使其保持沉默"
 inv_pop_events.9.desc:0 "我们收到一些关于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的粗俗谣言，这些谣言显然源自[pop_province.GetName]——当地一些贵族似乎已将对[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]想出巧妙的新侮辱词作为一种消遣。"
 inv_pop_events.9.t:0 "爱诽谤的贵族"
 local_noble_research_boost:0 "贵族研究员"
 local_unrest_generic_unrest:0 "普遍动荡"
 local_unrest_heavy_unrest:0 "严重动荡"
 silk_quarter_merchant_modifier:0 "扩大的基础设施"

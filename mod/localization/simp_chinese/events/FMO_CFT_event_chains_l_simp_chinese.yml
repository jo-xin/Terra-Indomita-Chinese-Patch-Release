l_simp_chinese:
 bronze_age_sword:0 "史前青铜剑"
 bronze_age_sword_desc:0 "已无人记得这柄精美青铜剑的持有者，无人能讲述它的故事，但它的古老却一目了然。"
 caring_partner:0 "体贴的伴侣"
 good_minter_mod:0 "优秀铸币官"
 learning_to_mint:0 "学习铸币"
 lifestyle_event_chains.1.a:0 "我来负责。"
 lifestyle_event_chains.1.b:0 "铸币师们知道自己在做什么。"
 lifestyle_event_chains.1.desc:0 "厌倦了统治的职责，[ROOT.GetCountry.GetRuler.GetName]最近一直在考虑要开展#E 一门新爱好#!。#E 铸币#!这门技艺吸引了[ROOT.GetCountry.GetRuler.GetHerHis]的注意，一些顾问建议，[ROOT.GetCountry.GetRuler.GetHerHis]亲自#E 直接参与#!铸币厂事务，可能会为[ROOT.GetCountry.GetName]的长期稳定与繁荣带来#E 显著的好处#!。当[ROOT.GetCountry.GetRuler.GetName]探索这份新发现的兴趣时，[ROOT.GetCountry.GetRuler.GetHerHis]想到要召见一位#E 铸币大师#!来教授[ROOT.GetCountry.GetRuler.GetHerHis]这门手艺。[ROOT.GetCountry.GetRuler.GetName]现在必须决定，是亲自#E 掌管#!铸币厂，还是维持#E 现状#!。"
 lifestyle_event_chains.1.t:0 "一门新爱好"
 lifestyle_event_chains.10.a:0 "这些银币将成为信仰的光辉象征。"
 lifestyle_event_chains.10.desc:0 "选择将[ROOT.GetCountry.GetName]人民视为神圣的图案刻在新铸的银币上，而不是[ROOT.GetCountry.GetRuler.GetHerHis]自己的面孔，这是一个令人尊敬的选择。自那以后，[ROOT.GetCountry.GetCapital.GetName]的铸币厂一直在努力将[ROOT.GetCountry.GetRuler.GetName]的愿景变为现实。在这段时间里，[ROOT.GetCountry.GetRuler.GetName]在铸币厂中度过了许多时光，与[master_minter.GetName]并肩工作，精心调整设计并确保一些硬币的质量。虽然这个过程可能没有将[ROOT.GetCountry.GetRuler.GetName]变成一位铸币大师，但[master_minter.GetName]承认[ROOT.GetCountry.GetRuler.GetHerHim]是一位技艺娴熟的工匠。他们一起完善了神圣的设计，确保这些硬币不仅仅是价值象征，也是崇敬之物。虽然[ROOT.GetCountry.GetRuler.GetName]可能不会因为[ROOT.GetCountry.GetRuler.GetHerHis]自己的面孔出现在硬币上而感到自我膨胀，但[ROOT.GetCountry.GetName]因[ROOT.GetCountry.GetRuler.GetName]致力于维护国家价值观而尊崇[ROOT.GetCountry.GetRuler.GetName]。"
 lifestyle_event_chains.10.t:0 "神圣铸币厂"
 lifestyle_event_chains.11.a:0 "有点爱好总会有回报。"
 lifestyle_event_chains.11.desc:0 "自从[ROOT.GetCountry.GetRuler.GetName]决定用黄金铸币以来，[ROOT.GetCountry.GetCapital.GetName]的铸币厂一直在热情地打造这些精美的金币，每一枚都镌刻着[ROOT.GetCountry.GetRuler.GetName]的面容。[ROOT.GetCountry.GetRuler.GetName]在铸币厂中度过了无数时光，与[master_minter.GetName]并肩工作，精心调整设计并确保每枚硬币的质量。这是一段充满挑战的旅程，但[master_minter.GetName]承认[ROOT.GetCountry.GetRuler.GetName]是铸币艺术中真正的同行。\n\n为了纪念和平与繁荣新时代的开启，[ROOT.GetCountry.GetCapital.GetName]宣布每个户主如果到访[ROOT.GetCountry.GetCapital.GetName]的铸币厂，将有权领取一枚免费硬币。民众蜂拥到[ROOT.GetCountry.GetCapital.GetName]，渴望获得这些象征他们统治者恩典与宏伟的黄金信物。用黄金铸币的决定将[ROOT.GetCountry.GetRuler.GetName]的声望提升到了前所未有的高度。[ROOT.GetCountry.GetName]的人民热切地欢迎新硬币进入流通，赞叹每位硬币上镌刻的统治者形象。这些光彩夺目的硬币，蕴含着[ROOT.GetCountry.GetRuler.GetName]本人的形象，已经迅速超越了单纯货币的范畴，成为对其统治者仁慈的珍贵纪念。"
 lifestyle_event_chains.11.t:0 "黄金使者"
 lifestyle_event_chains.12.a:0 "[ROOT.GetCountry.GetName]将在金色的象征中找到辉煌。"
 lifestyle_event_chains.12.desc:0 "当[ROOT.GetCountry.GetRuler.GetName]选择用黄金铸币时，[ROOT.GetCountry.GetCapital.GetName]的铸币厂变成了辉煌的工坊，铸造的硬币镌刻着受崇敬的国家象征，而非[ROOT.GetCountry.GetRuler.GetHerHis]自己的形象。[ROOT.GetCountry.GetRuler.GetName]在铸币厂中度过了无数时光，与[master_minter.GetName]并肩工作，精心调整设计并确保每枚硬币的质量。这是一段充满挑战的旅程，但[master_minter.GetName]承认[ROOT.GetCountry.GetRuler.GetName]是铸币艺术中真正的同行。这一决定向人民展示了[ROOT.GetCountry.GetRuler.GetName]对国家及其原则的奉献。[ROOT.GetCountry.GetName]的人民被这一姿态深深打动，愿意忽视[ROOT.GetCountry.GetRuler.GetName]此前的一些权力滥用。[ROOT.GetCountry.GetName]的铸币厂将在未来多年继续生产这些精工打造的金币，留下对[ROOT.GetCountry.GetRuler.GetName]在冶金和铸币方面卓越技艺的长久纪念。"
 lifestyle_event_chains.12.t:0 "国家徽章"
 lifestyle_event_chains.13.a:0 "星辰蕴藏着值得每一枚钱币的秘密。"
 lifestyle_event_chains.13.b:0 "我的时间和金钱最好花在别处。"
 lifestyle_event_chains.13.desc:0 "[ROOT.GetCountry.GetRuler.GetName]充满好奇，将[ROOT.GetCountry.GetRuler.GetHerHis]的目光投向了天空。夜空对[ROOT.GetCountry.GetRuler.GetHerHis]来说一直是奇迹般的，现在[ROOT.GetCountry.GetRuler.GetSheHe]决心深入探索星辰本身的奥秘。然而，如此宏大的事业并非没有代价，因为研究宇宙需要投入相当可观的资源。[ROOT.GetCountry.GetRuler.GetName]现在必须决定，这项天文探索是否值得进行。"
 lifestyle_event_chains.13.t:0 "天问"
 lifestyle_event_chains.14.a:0 "星辰掌握着实相的奥秘。"
 lifestyle_event_chains.14.b:0 "我将寻找神圣的征兆。"
 lifestyle_event_chains.14.desc:0 "随着对星辰的新专注，[ROOT.GetCountry.GetRuler.GetName]对夜空的深入研究加深了[ROOT.GetCountry.GetRuler.GetHerHis]对宇宙的理解，而[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]面前看到了两条不同的道路。一条路是科学地追求理解天体的运动，寻求对物质世界及其运行规律更深入的认识。另一条路则更加精神化，[ROOT.GetCountry.GetRuler.GetName]在星辰中寻找神圣和征兆，在[ROOT.GetCountry.GetRuler.GetHerHis]的观察中寻求指引和更高的目的。[ROOT.GetCountry.GetRuler.GetName]现在必须决定，将[ROOT.GetCountry.GetRuler.GetHerHis]的精力专注于天文学探索的哪个方面。"
 lifestyle_event_chains.14.t:0 "天象解读"
 lifestyle_event_chains.15.a:0 "[charisma_thinker.GetName]的#E 日心说#!似乎很有趣。"
 lifestyle_event_chains.15.b:0 "[finesse_thinker.GetName]的#E 地心说#!要合理得多。"
 lifestyle_event_chains.15.desc:0 "[ROOT.GetCountry.GetRuler.GetName]的宇宙探索将[ROOT.GetCountry.GetRuler.GetHerHis]带入了宏大宇宙理论的领域。两种截然不同的假说吸引了[ROOT.GetCountry.GetRuler.GetHerHis]的注意，每一种都提供了关于天体排列方式的独特视角。由[charisma_thinker.GetName]倡导的#E 第一种理论#!，提出了一个#Y 日心模型#!，它激进地挑战了我们的世界位于宇宙中心的传统观念。根据[charisma_thinker.GetName]的说法，所有的星辰，包括#E 太阳#!，都是静止的，而地球则沿着圆形轨道追随太阳运动。[charisma_thinker.GetName]声称我们的世界并非独一无二，而只是无数世界中的一个。[charisma_thinker.GetName]的日心模型无疑可以解释为什么我们的一天持续那么长的时间。[charisma_thinker.GetSheHe]解释说，当地球绕太阳运行时，它经历了一个白昼和一个夜晚的流逝，形成了一个24小时的循环。这个模型引入了一个浩瀚而动态的宇宙的可能性，地球的自转极大地影响着我们的日常生活。由[finesse_thinker.GetName]支持的#E 第二种理论#!，是#Y 地心模型#!。[finesse_thinker.GetSheHe]声称我们的世界是宇宙不可移动的中心，而天体，包括太阳和星辰，以复杂的模式围绕它运行。[finesse_thinker.GetName]的地心模型提供了一张复杂的本轮-均轮网来解释观测到的天体运动，每个天体在天空中遵循预定的路径运行。这两种体系各有其优点，但[ROOT.GetCountry.GetRuler.GetName]必须决定哪一个将为[ROOT.GetCountry.GetRuler.GetHerHis]的研究提供基础框架。"
 lifestyle_event_chains.15.t:0 "对立假说"
 lifestyle_event_chains.16.a:0 "费用不是问题。"
 lifestyle_event_chains.16.b:0 "国库无法承受这样的负担。"
 lifestyle_event_chains.16.desc:0 "随着[ROOT.GetCountry.GetRuler.GetName]深入探索宇宙的奥秘，[ROOT.GetCountry.GetRuler.GetHerHis]现有的仪器已不足以胜任[ROOT.GetCountry.GetRuler.GetHerHis]雄心勃勃的天文研究。[ROOT.GetCountry.GetRuler.GetName]发现，[ROOT.GetCountry.GetRuler.GetHerHis]对知识的追求不仅仅需要理智的好奇心，还需要具有非凡精度和复杂性的新工具和设备。[zeal_thinker.GetName]建议，在[ROOT.GetCountry.GetRuler.GetHerHis]的支持下，[zeal_thinker.GetSheHe]可以开发出为[ROOT.GetCountry.GetRuler.GetHerHis]特定研究需求量身定制的必要设备，但警告这将是一项昂贵且耗时的事业。"
 lifestyle_event_chains.16.t:0 "新装备"
 lifestyle_event_chains.17.a:0 "还有更多值得探索。"
 lifestyle_event_chains.17.b:0 "是时候重新专注于治国了。"
 lifestyle_event_chains.17.desc:0 "由[zeal_thinker.GetName]为[ROOT.GetCountry.GetRuler.GetName]的天文研究开发的新设备，使[ROOT.GetCountry.GetRuler.GetName]能够更加深入地探索宇宙的奥秘，揭示了夜空的秘密。[ROOT.GetCountry.GetRuler.GetName]已经学到了许多关于天体模式、星辰和行星运动的知识，成为一名受人尊敬的业余天文学家。然而，[ROOT.GetCountry.GetRuler.GetName]不禁注意到，这份热情已经变得比[ROOT.GetCountry.GetRuler.GetHerHis]最初的好奇心更加令人沉迷。[ROOT.GetCountry.GetRuler.GetName]现在花费越来越多的时间——也许太多了——研究天空。[ROOT.GetCountry.GetRuler.GetName]现在必须决定，这份新发现的迷恋是否值得[ROOT.GetCountry.GetRuler.GetSheHe]投入的时间，还是[ROOT.GetCountry.GetRuler.GetSheHe]应该将[ROOT.GetCountry.GetRuler.GetHerHis]的精力转向别处。"
 lifestyle_event_chains.17.t:0 "星辰与王座之间"
 lifestyle_event_chains.18.a:0 "召集文士。"
 lifestyle_event_chains.18.desc:0 "经过数月的潜心研究天空，[ROOT.GetCountry.GetRuler.GetName]坚定不移的奉献终于结出了硕果。[ROOT.GetCountry.GetRuler.GetName]将[ROOT.GetCountry.GetHerHis]全身心投入到天文观测中，细致地追踪星辰和行星的运动。经历了无数不眠之夜凝视天空、钻研天文数据，[ROOT.GetCountry.GetRuler.GetName]开始辨别出支配天体运行的深层规律。[ROOT.GetCountry.GetRuler.GetName]相信其已经发现了支配天体运动的永恒奥秘。这些发现使[ROOT.GetCountry.GetRuler.GetName]得以提出[ROOT.GetCountry.GetRuler.GetSheHE]所谓的#E “行星运动定律”：#!\n\n#E 椭圆轨道定律：#!每颗行星都沿一条椭圆轨道穿行天穹，而太阳位于其一处焦点。\n#E 等面积定律：#!行星沿椭圆轨道运行时，其与太阳的连线会在相等时间内扫过相等面积。\n#E 调和周期定律：#!行星公转周期的平方，与其椭圆轨道半长轴的立方成正比。\n\n意识到这些发现的重要性，[ROOT.GetCountry.GetRuler.GetName]决心在下个月将[ROOT.GetCountry.getRuler.GetHerHis]的发现编纂成一部关于天体力学的综合论著。这些知识及其惊人的潜在应用，或将重塑我国人民理解宇宙与天体运动的方式。"
 lifestyle_event_chains.18.t:0 "行星运动定律"
 lifestyle_event_chains.19.a:0 "出版这篇论述。"
 lifestyle_event_chains.19.b:0 "命文士们宣誓保密。"
 lifestyle_event_chains.19.c:0 "全部烧掉…………"
 lifestyle_event_chains.19.desc:0 "随着关于天体力学的综合论著编纂完成并准备就绪，[ROOT.GetCountry.GetRuler.GetName]现在必须决定[ROOT.GetCountry.GetRuler.GetHerHis]这些突破性知识的命运。[ROOT.GetCountry.GetRuler.GetName]可以选择与世界分享这份新发现的知识，让它广泛传播，可能开启一个天文理解的新时代，但也可能轻易导致大规模动荡。然而，也许更明智的做法是，将这些知识局限在帮助编纂它的一群可信文士之中，确保它始终是一个严加保守的秘密。即便如此，也无法消除这项研究最终浮出水面的风险。为了确保它永远不会出现，[ROOT.GetCountry.GetRuler.GetName]可以选择销毁研究资料和[ROOT.GetCountry.GetRuler.GetHerHis]的设备，认为大众还没有为这种革命性的知识做好准备。"
 lifestyle_event_chains.19.t:0 "[ROOT.GetCountry.GetRuler.GetName]的论述"
 lifestyle_event_chains.2.a:0 "太好了，我们开始吧。"
 lifestyle_event_chains.2.desc:0 "决定#E 亲自监督铸币厂#!并学习一些关于#E 冶金术#!和#E 铸币#!的知识后，[ROOT.GetCountry.GetRuler.GetName]在过去一个月里一直在欢欣期盼，等待着#E 著名的铸币师[master_minter.GetName]#!抵达[ROOT.GetCountry.GetCapital.GetName]。[master_minter.HerHis]在冶金和铸币方面的#E 无与伦比的专长#!，使[master_minter.GetHerHim]成为[ROOT.GetCountry.GetRuler.GetName]#E 师从#!的理想人选。起初，[master_minter.GetName]不愿意长时间离开他的铸币厂。然而，当[ROOT.GetCountry.GetRuler.GetName]提供了一笔#E 丰厚的报酬#!——贵金属和食宿——以换取[master_minter.GetHerHis]的专长时，[master_minter.GetName]很快就改变了[master_minter.GetHerHis]的态度。[master_minter.GetName]声称，有了#E 实践和耐心#!，[ROOT.GetCountry.GetRuler.GetName]总有一天会凭[ROOT.GetCountry.GetRuler.GetHerHis]自己的本事成为一位#E 铸币大师#!。"
 lifestyle_event_chains.2.t:0 "铸币大师"
 lifestyle_event_chains.20.a:0 "胡扯，这是为了[ROOT.GetCountry.GetName]的利益。"
 lifestyle_event_chains.20.desc:0 "如今，[ROOT.GetCountry.GetRuler.GetName]不再花费[ROOT.GetCountry.GetRuler.GetHerHis]夜晚钻研国事，而是将[ROOT.GetCountry.GetRuler.GetHerHis]夜晚用于漫步[ROOT.GetCountry.GetCapital.GetName]的街头，凝视夜空，寻找天意。[ROOT.GetCountry.GetRuler.GetName]惊叹于宇宙，在纸上勾勒[ROOT.GetCountry.GetRuler.GetHerHis]所见的景象，试图解读星象中隐藏的含义。这是一种精神意义上的追求，但这并未逃过人们的注意。[ROOT.GetCountry.GetRuler.GetName]的一些顾问对[ROOT.GetCountry.GetRuler.GetHerHis]近来的古怪行为愈加警惕。他们想知道[ROOT.GetCountry.GetRuler.GetName]是否应该将[ROOT.GetCountry.GetRuler.GetHerHis]的时间和精力奉献于国事——而这在他们看来是[ROOT.GetCountry.GetRulerTitle]的首要职责。"
 lifestyle_event_chains.20.t:0 "为宇宙所困"
 lifestyle_event_chains.21.a:0 "费用不是问题。"
 lifestyle_event_chains.21.b:0 "国库无法承受这样的负担。"
 lifestyle_event_chains.21.desc:0 "随着[ROOT.GetCountry.GetRuler.GetName]深入探索宇宙的奥秘，[ROOT.GetCountry.GetRuler.GetHerHis]现有的仪器已不足以胜任[ROOT.GetCountry.GetRuler.GetHerHis]雄心勃勃的研究。[ROOT.GetCountry.GetRuler.GetName]发现，[ROOT.GetCountry.GetRuler.GetHerHis]对知识的追求不仅仅需要精神上的开放，还需要具有非凡精度和复杂性的新工具和设备。[zeal_thinker.GetName]建议，在[ROOT.GetCountry.GetRuler.GetHerHis]的支持下，[zeal_thinker.GetSheHe]可以开发出为[ROOT.GetCountry.GetRuler.GetHerHis]特定研究需求量身定制的必要设备，但警告这将是一项昂贵且耗时的事业。"
 lifestyle_event_chains.21.t:0 "新装备"
 lifestyle_event_chains.22.a:0 "我们即刻出发。"
 lifestyle_event_chains.22.b:0 "何必呢？"
 lifestyle_event_chains.22.desc:0 "由[zeal_thinker.GetName]为[ROOT.GetCountry.GetRuler.GetName]的天文研究开发的新设备，使[ROOT.GetCountry.GetRuler.GetName]能够更加深入地探索隐藏在夜空中的神圣奥秘。[ROOT.GetCountry.GetRuler.GetName]越来越多地投入大量时间研究天空，促使[zeal_thinker.GetName]建议[ROOT.GetCountry.GetRuler.GetName]的工作可能受益于换个环境。[zeal_thinker.GetSheHe]认为，前往一个更适合观星的地点，可以为[ROOT.GetCountry.GetRuler.GetName]提供新的洞见和更好的机会，在天界中找到神圣的启示。[ROOT.GetCountry.GetRuler.GetName]思索着夜空——以其复杂的天体排列——如何可能提供神圣意志的一瞥。这无疑是一个诱人的前景，但需要[ROOT.GetCountry.GetRuler.GetName]离开[ROOT.GetCountry.GetCapital.GetName]一段时间。"
 lifestyle_event_chains.22.t:0 "星辰之旅"
 lifestyle_event_chains.23.a:0 "是的，星辰掌握着钥匙，但锁在哪里呢？"
 lifestyle_event_chains.23.b:0 "这种言论会导致疯狂。"
 lifestyle_event_chains.23.desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]时常离开[ROOT.GetCountry.GetCapital.GetName]繁华的都市景观，但[ROOT.GetCountry.GetRuler.GetSheHe]忘记了这些都市中心璀璨的光芒是如何遮蔽了夜空中星辰的壮丽。当夕阳西沉至地平线之下，一幅令人惊叹的天体奇观画卷开始展现。那些此前[ROOT.GetCountry.GetRuler.GetName]只能在神秘的星图上看到的星座，闪耀着天堂般的光辉。在无言惊叹中，[ROOT.GetCountry.GetRuler.GetName]在空中勾勒出一位传奇英雄的轮廓，感受到与[ROOT.GetCountry.GetRuler.GetHerHis]祖先之间一种难以言喻的共鸣——那些祖先曾凝视过天空中这些完全相同的星辰图案。星辰的光辉在[ROOT.GetCountry.GetRuler.GetName]心中赋予了它们一种重量，触发了一瞬间的天启清晰感。[ROOT.GetCountry.GetRuler.GetName]感到一种无声的信息在星辰间回响。仿佛宇宙本身渴望传达某种深邃的真理。在[ROOT.GetCountry.GetRuler.GetName]眼中，夜空成了一部神圣的经文，一个等待破译的宇宙神话。在这场天启之中，[ROOT.GetCountry.GetRuler.GetName]不禁思忖：星辰是否掌握着通向更深层理解神圣及其与人类关系之钥匙。"
 lifestyle_event_chains.23.t:0 "天界启示"
 lifestyle_event_chains.24.a:0 "我就快成功了。"
 lifestyle_event_chains.24.b:0 "有些事情是人类不该知晓的。"
 lifestyle_event_chains.24.desc:0 "[ROOT.GetCountry.GetRuler.GetName]伫立在十字路口。天界奥秘在召唤，承诺着对存在与神性本质的更深刻洞见。然而，这些追求并非没有风险。许多过于深入宇宙奥秘的人最终陷入了疯狂。当[ROOT.GetCountry.GetRuler.GetName]思索着种种可能性时，[ROOT.GetCountry.GetRuler.GetHerHis]的顾问们表达了他们的担忧。一些人担心这种对天界知识的执着追求可能会使[ROOT.GetCountry.GetRuler.GetName]忽视对[ROOT.GetCountry.GetName]及其人民的职责。与神明交流的诱惑对[ROOT.GetCountry.GetRuler.GetName]来说如此诱人，如同黑暗中的低语，承诺着能够重新定义存在本质的启示。然而，[ROOT.GetCountry.GetRuler.GetName]依然清醒地意识到追求这些奥秘所潜藏的危险。这条路似乎没有归途；一旦踏上，可能再也无法从晦暗与疯狂的边缘回头。"
 lifestyle_event_chains.24.t:0 "危险的追求"
 lifestyle_event_chains.25.a:0 "是的，我确实觉得自己更明智了。"
 lifestyle_event_chains.25.desc:0 "在[ROOT.GetCountry.GetRuler.GetName]决定继续[ROOT.GetCountry.GetRuler.GetHerHis]探索天界知识之后，那些与[ROOT.GetCountry.GetRuler.GetHerHim]接触的人注意到[ROOT.GetCountry.GetRuler.GetName]的举止发生了令人费解的变化，仿佛[ROOT.GetCountry.GetRuler.GetName]窥见了超越人类理解的东西。[ROOT.GetCountry.GetRuler.GetName]行走在[ROOT.GetCountry.GetCapital.GetName]的街道上，带着一种超凡脱俗的气息，而那些有幸——也许是不幸——遇见[ROOT.GetCountry.GetRuler.GetName]的人，则从[ROOT.GetCountry.GetRuler.GetName]那里得到了暗含深刻真理的隐晦忠告。\n[ROOT.GetCountry.GetRuler.GetName]的卫兵们谈论着[ROOT.GetCountry.GetRuler.GetName]的怪异行为，有人低声说[ROOT.GetCountry.GetRuler.GetName]已被[ROOT.GetCountry.GetRuler.GetName]试图揭示的天界奥秘所触动。在那些格外黑暗的夜晚，当月亮掩藏面容，群星闪耀着无与伦比的光芒时，[ROOT.GetCountry.GetRuler.GetName]会出现在户外，凝视着宇宙深渊，向群星低语。"
 lifestyle_event_chains.25.t:0 "超凡感知"
 lifestyle_event_chains.26.a:0 "世界必须知晓。"
 lifestyle_event_chains.26.b:0 "那好吧，我会保守你的秘密。"
 lifestyle_event_chains.26.desc:0 "在与群星乃至或许某个更伟大的存在交流之后，[ROOT.GetCountry.GetRuler.GetName]积累了超越常人理解的洞见与启示，[ROOT.GetCountry.GetRuler.GetSheHe]感到一股难以抑制的冲动，要将这新获得的知识与世界分享。[ROOT.GetCountry.GetRuler.GetName]希望通过将[ROOT.GetCountry.GetRuler.GetHerHis]的启示编纂成一部简称为「[ROOT.GetCountry.GetRuler.GetName]沉思录」的法典来实现这一愿望。这是一个崇高的志向，可能使[ROOT.GetCountry.GetRuler.GetName]成为博学与智慧的灯塔，引领无数人走向宇宙真理。然而，在[ROOT.GetCountry.GetRuler.GetName]宇宙启示的热忱之中，群星传来一丝微弱的低语，那是[ROOT.GetCountry.GetRuler.GetName]与之交流的存在所留下的微弱回响。群星本身似乎渴望保守秘密，守护它们那神秘的洞见不被世人的窥探之眼所触及。在[ROOT.GetCountry.GetRuler.GetName]的心灵深处，[ROOT.GetCountry.GetRuler.GetName]回忆起它们那难以捉摸的意愿和宇宙的隐晦信息。在错误的手中，这些知识可能被曲解、滥用，甚至被武器化而引发混乱。选择隐瞒这份天界智慧，遵从群星的神秘意愿，必将引发人们对[ROOT.GetCountry.GetRuler.GetName]真实动机的猜测，并加深围绕[ROOT.GetCountry.GetRuler.GetHerHim]的神秘感。如果[ROOT.GetCountry.GetRuler.GetName]选择启迪之路，[ROOT.GetCountry.GetName]的人民将尊崇[ROOT.GetCountry.GetRuler.GetName]为神秘主义者、智者与真理的引路人。或者，听从群星的召唤，保护它们低语的秘密……"
 lifestyle_event_chains.26.t:0 "[ROOT.GetCountry.GetRuler.GetName]的两难困境"
 lifestyle_event_chains.27.a:0 "[ROOT.GetCountry.GetRuler.GetSpouse.GetName]必须拥有这条项链！"
 lifestyle_event_chains.27.b:0 "我宁愿不浪费这笔金子。"
 lifestyle_event_chains.27.desc:0 "当[ROOT.GetCountry.GetRuler.GetName]漫步在[ROOT.GetCountry.GetCapital.GetName]熙熙攘攘的市场中时，一位商人迎上前来，呈上一条由奇异金属打造、镶嵌精美珠宝的奢华项链。其工艺无与伦比，在[ROOT.GetCountry.GetCapital.GetName]从未见过如此佳作。商人恭敬地鞠躬，将项链呈给[ROOT.GetCountry.GetRuler.GetPraenomen]并解释道：「尊敬的[ROOT.GetCountry.GetRulerTitle]，我倾注了全部心血来打造这件杰作。它由上等材料制成，镶嵌着来自遥远国度的珍贵宝石。如此尊贵的作品自然应当属于您这样地位的统治者之手，或许是赠予您的配偶？」\n\n[ROOT.GetCountry.GetRuler.GetSpouse.GetName]最近有些烦躁，或许这可以成为[ROOT.GetCountry.GetRuler.GetPraenomen]表达爱意的象征。"
 lifestyle_event_chains.27.t:0 "精美的项链"
 lifestyle_event_chains.28.a:0 "下令彻底调查！"
 lifestyle_event_chains.28.b:0 "我们有更紧迫的事务要处理。"
 lifestyle_event_chains.28.desc:0 "自从[ROOT.GetCountry.GetRuler.GetPraenomen]为[ROOT.GetCountry.GetRuler.GetSpouse.GetName]购得那条奢华项链以来，已过去约一个月。[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]珍爱这份礼物，几乎从不离身。然而，在[ROOT.GetCountry.GetRuler.GetPraenomen]和[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]参加完一场盛大宴会归来后，不可思议的事情发生了——项链被一名蒙面盗贼从[ROOT.GetCountry.GetRuler.GetSpouse.GetName]的颈上夺走，在曾经闪耀着爱情象征之处留下了一片空白。[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]悲痛欲绝、怒不可遏，对窃贼发出血誓复仇，并要求立即展开调查缉拿罪犯。"
 lifestyle_event_chains.28.t:0 "项链失窃"
 lifestyle_event_chains.29.a:0 "很好。"
 lifestyle_event_chains.29.desc:0 "尽管付出了不懈努力，对失窃项链的调查仍未取得任何重大进展。然而，宫廷卫兵们依然保持警惕，坚定不移地致力于解开这个谜团。领导调查的[guard_of_ruler.GetName]来到[ROOT.GetCountry.GetRuler.GetPraenomen]面前，呈上一份严肃的报告：「尊敬的[ROOT.GetCountry.GetRulerTitle]，我们已搜遍每个角落，走访了无数证人，检查了所有可用的线索。然而，窃贼的身份仍然难以捉摸。尽管如此，我们并不绝望。我们的决心毫不动摇，我们仍然希望取得突破。市民和卫兵都投入到这场寻求正义的行动中，我们誓将继续努力，直至将罪犯绳之以法。」"
 lifestyle_event_chains.29.t:0 "毫无线索"
 lifestyle_event_chains.3.a:0 "进步就是进步。"
 lifestyle_event_chains.3.desc:0 "#E 数月#!以来，自从[ROOT.GetCountry.GetRuler.GetName]欢迎[master_minter.GetName]来到[ROOT.GetCountry.GetCapital.GetName]学习#E 铸币技艺#!，[ROOT.GetCountry.GetRuler.GetName]一直在[master_minter.GetHerHis]指导下#E 勤奋#!学习和实践。今天，[ROOT.GetCountry.GetRuler.GetName]双手颤抖、眉头紧锁，艰辛地完全依靠自己打造出了[ROOT.GetCountry.GetRuler.GetHerHis]的#E 第一枚钱币#!。\n\n#E 结果如何？#!一枚相当#E 粗糙且不匀称的作品#!，远不及[master_minter.GetName]轻松创造出的完美之作。然而，[ROOT.GetCountry.GetRuler.GetName]对这一进展感到无比#E 欣喜#!，并热切期待有朝一日[ROOT.GetCountry.GetRuler.GetHerHis]的钱币能达到[master_minter.GetName]的精湛水准。成为铸币大师的旅程仍在继续，一次一枚粗糙的钱币。"
 lifestyle_event_chains.3.t:0 "首次独立尝试"
 lifestyle_event_chains.30.a:0 "逮捕[servant.GetName]。"
 lifestyle_event_chains.30.b:0 "逮捕[cooks_wife.GetName]。"
 lifestyle_event_chains.30.desc:0 "宫殿中骚动骤起，盗窃指控的回声在走廊中回荡。一名奴隶惊恐地睁大双眼，走到[guard_of_ruler.GetName]面前，声称目睹了另一名自称[servant.GetName]的奴隶从[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]的钱包中偷钱。颇为烦人的是，[guard_of_ruler.GetName]刚刚抓获了[ROOT.GetCountry.GetRuler.GetPraenomen]的私人厨师的妻子[cooks_wife.GetName]从厨房偷取食物。[guard_of_ruler.GetName]推断这两名仆人中的一人必定偷走了[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]的项链。\n\n卫兵迅速调查此事，两人均激烈否认有任何不当行为。"
 lifestyle_event_chains.30.t:0 "当场抓获"
 lifestyle_event_chains.31.a:0 "逮捕[servant.GetName]。"
 lifestyle_event_chains.31.b:0 "逮捕[cooks_wife.GetName]。"
 lifestyle_event_chains.31.desc:0 "宫殿中骚动骤起，盗窃指控的回声在走廊中回荡。一名奴隶惊恐地睁大双眼，走到[guard_of_ruler.GetName]面前，声称目睹了另一名自称[servant.GetName]的奴隶从[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]的钱包中偷钱。颇为烦人的是，[guard_of_ruler.GetName]刚刚抓获了[ROOT.GetCountry.GetRuler.GetPraenomen]的私人厨师的妻子[cooks_wife.GetName]从厨房偷取食物。[guard_of_ruler.GetName]推断这两名仆人中的一人必定偷走了[ROOT.GetCountry.GetRuler.spouse.GetPraenomen]的项链。\n\n卫兵迅速调查此事，两人均激烈否认有任何不当行为。"
 lifestyle_event_chains.31.t:0 "当场抓获"
 lifestyle_event_chains.32.a:0 "[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]会很高兴的。"
 lifestyle_event_chains.32.desc:0 "在宫殿酒窖昏暗的禁闭中忍受了一个多月的监禁后，被指控抢劫[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]的奴隶终于打破了沉默。这个可怜虫显得疲惫而绝望，承认偷走了那条令宫殿陷入动荡的项链。细节如洪水般倾泻而出，他透露了[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]失窃项链的藏匿地点。「是我拿了它，尊敬的[ROOT.GetCountry.GetRulerTitle]，」他承认道，「我把它藏在我住处地板下的一个小隔间里。求您免去我更多的惩罚，让我把它取来给您。」"
 lifestyle_event_chains.32.t:0 "酒窖中的坦白"
 lifestyle_event_chains.33.a:0 "啊，那可真是不幸。"
 lifestyle_event_chains.33.desc:0 "在宫殿酒窖昏暗的禁闭中忍受了一个多月的监禁后，被指控抢劫[ROOT.GetCountry.GetRuler.GetSpouse.GetPraenomen]的[ROOT.GetCountry.GetRuler.GetPraenomen]私人厨师的妻子仍激烈否认有任何不当行为。当初导致她入狱的调查现在看来存在缺陷。在重新审查证据后，[guard_of_ruler.GetName]得出了一个令人不安的结论：抓错了人。"
 lifestyle_event_chains.33.t:0 "错误囚禁"
 lifestyle_event_chains.34.a:0 "啊，那可真是不幸。"

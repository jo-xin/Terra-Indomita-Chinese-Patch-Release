l_simp_chinese:
 decreased_defense_in_this_province:0 "被削弱的防御"
 desc_decreased_defense_in_this_province:0 "由于影响这个地区的一场灾难，该省的安全状况有所下降。"
 desc_fort_guy_assisting_local_fort:0 "有一个天才的工程师住在这个省，他的任务是管理区域防御系统。"
 desc_grateful_populace_modifier:0 "由于我们努力帮助当地人，他们非常感激。"
 desc_increased_defense_in_this_province:0 "由于所做的投资，该省由于加强了防御，正在享受更多的安全。"
 desc_local_economic_boom_modifier:0 "由于对该地区进行了明智的投资，该地区正在经历一段经济增长时期。"
 desc_local_economic_bust_modifier:0 "由于一些我们无法控制的情况，这个地区的经济产出已经暂时减少。"
 desc_local_research_boost_generic_mod:0 "国家在这里进行了干预，以确保学院里的热烈辩论能够不受阻碍地继续下去。"
 desc_locally_expanded_port_infrastructure_modifier:0 "经过当地造船专家的努力，这一地区的港口已经扩大。"
 desc_rat_infestation_in_port:0 "这个地区正在遭受一场毁灭性的鼠灾，当地的食品储备被毁于一旦。"
 fort_guy_assisting_local_fort:0 "本地工程师"
 grateful_populace_modifier:0 "百姓感恩"
 increased_defense_in_this_province:0 "加强防卫"
 inv_building_events.1.a:0 "他们必须在没有我们协助的情况下慢慢解决这个问题"
 inv_building_events.1.b:0 "现在就花钱来支付维修费用"
 inv_building_events.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了来自[building_province.GetName]的报告--该省的要塞被一场小地震震坏了，一大片城墙已经崩塌。\n\n由于我方驻军忙于修补破损而手忙脚乱，无法正常完成工作，该省开始躁动不安。"
 inv_building_events.1.t:0 "摇摇欲坠的要塞"
 inv_building_events.10.a:0 "多么优秀的想法——放手去干吧！"
 inv_building_events.10.b:0 "恐怕我们现在需要这些税金。"
 inv_building_events.10.desc:0 "[building_province.GetName]的造船大师已向[ROOT.GetCountry.GetCapital.GetName]送去消息，请求允许使用地方税收盈余扩建港区。\n\n虽然这将是一项昂贵工程，但所有人都能看到将利润再投资的好处。"
 inv_building_events.10.t:0 "[building_province.GetName]的造船专家"
 inv_building_events.11.a:0 "给[burning_port_province.GetName]拨款以帮助重建"
 inv_building_events.11.b:0 "[pyromaniac_administrator.GetName]必须亲自赔偿！"
 inv_building_events.11.desc:0 "[burning_port_province.GetName]的总督，一个名叫[pyromaniac_administrator.GetName]的纵火狂，需要对肆虐港区的大火负个人责任。\n\n尽管[pyromaniac_administrator.GetFirstName]本人被警告停止玩火，但他似乎没有理会警告。"
 inv_building_events.11.t:0 "[burning_port_province.GetName]港口船帆起火"
 inv_building_events.12.a:0 "惩罚那些士兵！"
 inv_building_events.12.b:0 "我们不应该干涉军队的事务..."
 inv_building_events.12.desc:0 "我们收到报告说，[building_province.GetName]的军营受到了攻击，但不是被外国军队攻击的。对我们来说，不幸的是，我们的一些驻军士兵正在喝酒，他们和一些营友打了起来。在有人能阻止这场争吵之前，一场大火已经爆发，并损坏了城市的一部分。"
 inv_building_events.12.t:0 "[building_province.GetName]的醉酒暴动"
 inv_building_events.13.a:0 "我们应该感谢他的努力"
 inv_building_events.13.b:0 "谢谢你告诉我...我将继续关注[governor_dude.GetFirstName]。"
 inv_building_events.13.desc:0 "来自[building_province.GetName]的消息——总督[governor_dude.GetName]一直在亲自训练[governor_dude.GetHerHis]指挥的部队——这是[ROOT.GetCountry.GetRuler.GetName]从未要求的。"
 inv_building_events.13.t:0 "[governor_dude.GetName]正在训练部队"
 inv_building_events.14.a:0 "让他们打吧——战士们会享受这种场面"
 inv_building_events.14.b:0 "以抗命的罪名将这名士兵处死"
 inv_building_events.14.desc:0 "我们从[building_province.GetName]的军营得到消息，据说一位名叫[badass_soldier.GetName]的传奇战士公开向不受欢迎的[bitch_ass_governor.GetName]发起决斗挑战。\n\n尽管士兵们对看到自己人与上层阶级决斗感到兴奋，但[bitch_ass_governor.GetName]已经写信给我们，要求我们尽最大可能制止这种情况。"
 inv_building_events.14.t:0 "备受尊敬的士兵挑战[building_province.GetGovernorship.GetName]总督"
 inv_building_events.15.a:0 "很抱歉，我们无法承担这些费用。"
 inv_building_events.15.b:0 "这绝对值得我们投资——打开国库"
 inv_building_events.15.desc:0 "据说，[building_province.GetName]的军营正在进行一些军事创新，人力过剩使得总督可以拨出一些队伍进行专门的军事训练。\n\n到目前为止，训练效果非常显著，我们被请求拨出一些钱资助这项举措。"
 inv_building_events.15.t:0 "创新操练"
 inv_building_events.16.a:0 "我们应该将资金重新投资于[building_province.GetName]。"
 inv_building_events.16.b:0 "对我来说，这听起来像是对工作完成情况的奖励！"
 inv_building_events.16.desc:0 "我们所学到的最先进的建筑类型之一是#E 铸造厂#!，根据所有的报告，[building_province.GetName]正在享受繁荣的时代，由于那里的工业增加。应该如何使用它呢？也许我们可以扩大[building_province.GetName]的铸造厂。"
 inv_building_events.16.t:0 "[building_province.GetName]的铸造厂正在迅速发展"
 inv_building_events.17.a:0 "一个难得的机会，我们应该好好把握"
 inv_building_events.17.b:0 "要是我们有钱就好了！"
 inv_building_events.17.desc.1:0 "在[building_province.GetName]，有一个铸造厂，专门制造整个[SCOPE.GetRootScope.GetCountry.GetName]中可以找到的最好的长矛和剑。事实上，对#E '[ROOT.GetCountry.GetAdjective]钢'#!的需求如此之大，以至于我们的生产速度不够快。然而，这可以改变；有人建议[ROOT.GetCountry.GetRuler.GetName]用国库投资[building_province.GetName]，这样我们就可以增加这种宝贵合金的产量。"
 inv_building_events.17.desc.2:0 "[building_province.GetName]附近有一家铸造厂，以生产优质盔甲而闻名，在整个[SCOPE.GetRootScope.GetCountry.GetName]都很难找到比它更好的盔甲。就连[ROOT.GetCountry.GetRuler.GetName]本人也对这种盔甲青睐有加，经过[ROOT.GetCountry.GetRuler.GetHerHis]附近时不辞辛苦地去拜访铸造厂，看看当地生产了什么。\n\n当然，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]也有兴趣在该地区投资。"
 inv_building_events.17.t:0 "[building_province.GetName]生产[SCOPE.GetRootScope.GetCountry.GetName]最精良的武器与盔甲"
 inv_building_events.18.a:0 "这对我来说毫无意义"
 inv_building_events.18.b:0 "派出一些士兵并支付追捕费用"
 inv_building_events.18.desc:0 "在[building_province.GetName]附近拥有一家铸造厂的富有外省人[murdered_master.GetName]今早被发现死亡，而且是被奴隶杀害的。\n\n有人要求[ROOT.GetCountry.GetName]进行调查，但涉及的费用令人不快。"
 inv_building_events.18.t:0 "[building_province.GetName]的奴隶杀死铸造厂主"
 inv_building_events.2.a:0 "这非常令人烦恼，但我们可以做什么呢？"
 inv_building_events.2.b:0 "我们将进行维修，并留意是否有问题。"
 inv_building_events.2.desc:0 "我们的一个邻国买通了破坏者，对我们的一个堡垒发动了秘密袭击，但幸运的是，我们能够在造成太多损失之前将破坏者赶走。\n\n遗憾的是，我们并不确定是哪个敌人造成的，但这目前并不重要--因为我们有足够的修复资金。"
 inv_building_events.2.t:0 "破坏要塞"
 inv_building_events.26.a:0 "我们将立即派遣工人"
 inv_building_events.26.b:0 "他们就不能自己处理问题吗？"
 inv_building_events.26.desc:0 "我们的建筑师给我们发来紧急报告，称[building_province.GetName]的引水渠出现渗漏，且面积与日俱增。人们担心，如果不立即采取措施，引水渠将会坍塌。\n\n当然，这意味着[ROOT.GetCountry.GetName]授权从国库中调拨紧急资金。"
 inv_building_events.26.t:0 "[building_province.GetName]引水渠发生渗漏"
 inv_building_events.27.a:0 "哈，那你就错了——不，我们不管"
 inv_building_events.27.b:0 "这是一次昂贵的维修，但我们必须这样做"
 inv_building_events.27.desc:0 "不安分的[building_province.GetName]的引水渠遭到破坏，[ROOT.GetCountry.GetRuler.GetName]，现在该地区的淡水供应受到威胁。\n\n没有人知道是谁干的，但我们仍然要对这个问题负责。"
 inv_building_events.27.t:0 "[building_province.GetName]引水渠遭到破坏！"
 inv_building_events.28.a:0 "多么令人愉快的消息"
 inv_building_events.28.desc:0 "到[building_province.GetArea.GetName]地区旅游的游客通常都会不辞辛苦地前往[building_province.GetName]，这无疑是因为这座城市享有财富和文化之地的美誉，人们慷慨大方。我们还拥有良好的市政基础设施，令人印象深刻的引水渠系统就是其最珍贵的财产之一。\n\n引水渠为[building_province.GetName]带来的不仅仅是生计，还不断地为城市蓄水池注入新鲜洁净的水。"
 inv_building_events.28.t:0 "[building_province.GetName]引水渠带来繁荣"
 inv_building_events.29.a:0 "我们必须做点什么，以免众神恼怒——送钱！"
 inv_building_events.29.b:0 "最好不要插手此事"
 inv_building_events.29.desc:0 "噩耗传来，[ROOT.GetCountry.GetRuler.GetName]——[SCOPE.sCharacter('dead_priest').GetOffice.GetName]在参观[building_province.GetName]的神庙时遭到谋杀，但没有人主动提供任何信息，我们也不知道到底发生了什么。\n\n当地人对这一亵渎神明的行为非常愤怒，希望将凶手绳之以法。"
 inv_building_events.29.t:0 "[building_province.GetName]谋杀案"
 inv_building_events.3.a:0 "让[fort_guy.GetName]呆在他的省内"
 inv_building_events.3.b:0 "支付[fort_guy.GetFirstName]，让他到[ROOT.GetCountry.GetCapital.GetName]来。"
 inv_building_events.3.desc:0 "[ROOT.GetCountry.GetRuler.GetName]听说了当地的一个天才建筑师的故事，他叫[fort_guy.GetName]，通过改善位于他家乡的防御工事而声名鹊起。\n\n如果我们能腾出钱来，那么我们就可以雇用这个年轻人到首都来，与我们自己的工程师分享他的专业知识。"
 inv_building_events.3.t:0 "本地要塞大师"
 inv_building_events.30.a:0 "当然，我们会资助庆典"
 inv_building_events.30.b:0 "告诉地方官员，他们今年必须推迟节日。"
 inv_building_events.30.desc:0 "[building_province.GetName]是时候举办宗教庆典了，但地方市政当局告诉我们，他们今年无力资助该节日，希望[ROOT.GetCountry.GetName]提供帮助。\n\n请不要上当受骗；这是一笔不小的开支，但会带来很多好处..."
 inv_building_events.30.t:0 "[building_province.GetName]神庙的本地节日"
 inv_building_events.31.a:0 "祭祀牺牲，向大家保证一切安好"
 inv_building_events.31.b:0 "告诉他们，如果不给我打钱，诸神就会惩罚他们！"
 inv_building_events.31.desc:0 "我们收到报告称，闪电击中了[building_province.GetName]的[ROOT.GetCountry.Custom('get_harvest_goddess')]神庙，当地人都吓坏了，认为这是一个预兆。我们该怎么告诉他们呢？"
 inv_building_events.31.t:0 "闪电击中[building_province.GetName]神庙！"
 inv_building_events.32.a:0 "我们的人民多么无私啊！ 这让我很高兴"
 inv_building_events.32.desc:0 "最近，[prov_to_help.GetName]一直在为缺粮而苦恼。邻省[state_to_help.GetName]有大量的存粮，出于好心，他们愿意分享一些粮食。"
 inv_building_events.32.t:0 "粮仓满溢，附近各省份可以使用更多粮食！"
 inv_building_events.33.a:0 "我们应该向当地人免费发放面包"
 inv_building_events.33.b:0 "将发霉的粮食卖掉，利润收入囊中"
 inv_building_events.33.desc:0 "我们[building_state.GetName]的农田管理员告诉我们，霉菌已经在庄稼地里蔓延，严重威胁到[building_state.GetArea.GetName]的粮食安全。越来越多的消息称，许多生活在这座城市的居民尤其是儿童，正在挨饿。"
 inv_building_events.33.t:0 "让粮食在[building_state.GetName]粮仓里发霉！"
 inv_building_events.34.a:0 "派遣士兵恢复秩序"
 inv_building_events.34.b:0 "等事情平息了再告诉我"
 inv_building_events.34.desc_1:0 "我们收到报告称，一群饥肠辘辘的暴徒闯入了[building_province.GetName]的粮仓。\n\n当地总督[corrupt_governor.GetName]是个臭名昭著的腐败分子，勉强保住了[corrupt_governor.GetHerHis]的姓名。"
 inv_building_events.34.desc_2:0 "我们收到报告称，一群饥肠辘辘的暴徒闯入了[building_province.GetName]的粮仓。\n\n当地总督[corrupt_governor.GetName]是个臭名昭著的腐败分子，[corrupt_governor.GetName]无路可逃并被撕成了碎片——多么可怕。"
 inv_building_events.34.t:0 "暴徒占领[building_province.GetName]粮仓"
 inv_building_events.4.a:0 "呃，把火扑灭，让生活恢复正常"
 inv_building_events.4.b:0 "谴责[pyromaniac_administrator.GetFirstName]并要求赔款"
 inv_building_events.4.desc:0 "来自[burning_fort_province.GetName]的可怕消息--似乎不负责任的[pyromaniac_administrator.GetName]让一场大火蔓延到整个地区，破坏了[ROOT.GetCountry.GetName]所依赖的一些关键军事基础设施。\n\n我们应该怎么做？我们不应该让这种危险行径逃脱惩罚。"
 inv_building_events.4.t:0 "要塞的火灾"
 inv_building_events.41.a:0 "我希望这些争论不休的人们能够和睦相处..."
 inv_building_events.41.b:0 "派几个支持者去惩治罪犯"
 inv_building_events.41.desc:0 "在[building_province.GetName]，流传着一个贵族在剧院外被自由民杀害的故事。可想而知，该地区的阶级矛盾达到了前所未有的高度。"
 inv_building_events.41.t:0 "贵族在[building_province.GetName]的剧院被自由民谋杀"
 inv_building_events.42.a:0 "人们还说戏剧很无聊......"
 inv_building_events.42.b:0 "禁止今后的一切演出"
 inv_building_events.42.desc:0 "在戏剧艺术方面，[building_province.GetName]已成为[building_province.GetArea.GetRegion.GetName]首屈一指的城市，这一点已众所周知。\n\n公共场所上演的戏剧质量可以与任何地方的戏剧相媲美，许多人认为[ROOT.GetCountry.GetName]拥有全世界最伟大的剧作家。"
 inv_building_events.42.desc.2:0 "[neighbor.GetRuler.GetName]的统治者[neighbor.GetName]向[ROOT.GetCountry.GetCapital.GetName]发出威胁信息，要求我们停止在[building_province.GetName]举办戏剧表演。\n\n很显然，我们的作品以其质量而闻名，以至于来自其他国家的贵族，包括[neighbor.GetName]，搬到我们的领土上。"
 inv_building_events.42.t:0 "[building_province.GetName]的剧院吸引贵族"
 inv_building_events.43.a:0 "这是我在很长一段时间内听到最疯狂的事情。"
 inv_building_events.43.b:0 "什么？立即派士兵去[building_province.GetName]！"
 inv_building_events.43.t:0 "[building_province.GetName]的剧场恐怖事件"
 inv_building_events.43_comedy:0 "我们听说[building_province.GetName]剧院发生了一起震惊整个[ROOT.GetCountry.GetName]的事件。\n\n这部备受期待的喜剧名为《[ROOT.GetCountry.GetAdjective]的蠢货们》让观众们非常愤怒，甚至一怒之下杀害了舞台上的演员。\n\n“笑话”变得越来越糟，当人群开始向舞台上扔臭鸡蛋时，其中一名演员又扔了回去…然后一切就乱了套。"
 inv_building_events.43_drama:0 "我们听说[building_province.GetName]剧院发生了一起震惊整个[ROOT.GetCountry.GetName]的事件。\n\n这出万众瞩目的戏剧名为《[ROOT.GetCountry.GetAdjective]木兰花》，实际却糟糕透顶，观众一怒之下竟杀害了舞台上的演员。\n\n当演出进行到第五个小时，人们正偷偷试图离开剧场，一名武装警卫强行堵住了入口，并威胁要从头开始演出——人们开始失去理智。"
 inv_building_events.43_satyr:0 "我们听说了一个发生在[building_province.GetName]剧院的事件，这一事件震惊了[ROOT.GetCountry.GetName]。\n\n备受期待的滑稽剧《淫荡的[ROOT.GetCountry.GetAdjective]少女》令观众如此愤怒，以至于人群在愤怒中杀死了台上的演员。\n\n接下来的情况类似于一场暴动——我们很幸运没有更多人丧生。"
 inv_building_events.43_tragedy:0 "我们听说[building_province.GetName]剧院发生了一起震惊整个[ROOT.GetCountry.GetName]的事件。\n\n万众瞩目的悲剧《被抛弃的英白拉多》让观众愤怒不已，甚至开始怒不可遏地攻击舞台。\n\n在第二幕中，舞台工作人员宣布中场休息15分钟后继续演出，却再也没有回来，观众们开始暴怒。\n\n即使当地卫兵驱散了暴徒，“让英白拉多回来！”的尖叫声还是彻夜不绝于耳。"
 inv_building_events.44.a:0 "我们将派遣士兵进行干预，以维持和平。"
 inv_building_events.44.b:0 "派遣外交官到当地进行谈判，以达成解决方案"
 inv_building_events.44.desc:0 "我们听说了一个丑陋的故事——[assimilating_culture.GetName]似乎放火焚烧了[building_province.GetName]图书馆的部分藏书。\n\n在这场大火中，[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]人神圣的书籍被烧毁，现在整个地区人心惶惶，暴力正在酝酿。"
 inv_building_events.44.t:0 "[assimilating_culture.GetName]人破坏[building_province.GetName]图书馆的神圣书籍[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]。"
 inv_building_events.45.a:0 "我们真幸运！我们正需要现金"
 inv_building_events.45.b:0 "投资[building_province.GetName]，将这些想法应用于市场"
 inv_building_events.45.t:0 "在巨人的肩膀上"
 inv_building_events.45_medicine:0 "据报道，聚集在[building_province.GetName]的伟大思想家们取得了突破性进展。\n\n这些智者的领袖[great_thinker.GetName]据说是一位医学天才，并且愿意与[ROOT.GetCountry.GetName]分享成果。"
 inv_building_events.45_philosophy:0 "据报道，聚集在[building_province.GetName]的伟大思想家们取得了突破性进展。\n\n这些智者的领袖[great_thinker.GetName]据说是一位哲学天才，并且愿意与[ROOT.GetCountry.GetName]分享成果。"
 inv_building_events.45_science:0 "据报道，聚集在[building_province.GetName]的伟大思想家们取得了突破性进展。\n\n这些智者的领袖[great_thinker.GetName]据说是一位科学天才，并且愿意与[ROOT.GetCountry.GetName]分享成果。"
 inv_building_events.46.a:0 "我们喜欢精彩、热烈的辩论——暂时无视他们"
 inv_building_events.46.b:0 "监禁所有反叛同情者"
 inv_building_events.46.desc:0 "我们一直容忍着学术界放任自流的氛围，但据报道，[building_province.GetName]的一些哲学团体正在呼吁暴力推翻上层阶级，鼓吹建立一个所有阶级享有同等权利的乌托邦。\n\n我们是任由这些思想肆意传播，还是应该介入？"
 inv_building_events.46.t:0 "危险的讨论"
 inv_building_events.47.a:0 "知识无价，让我们投资吧"
 inv_building_events.47.b:0 "让辩论自然进行，不加干涉"
 inv_building_events.47.desc:0 "据称，[building_province.GetName]的学院因高质量的学术辩论而闻名，我们的文化精英与全国最优秀、最聪明的[ROOT.GetCountry.GetAdjective]学者在此共聚一堂。\n\n虽然我们目前免费享受[building_province.GetName]的博学氛围和热烈讨论，但有人提议由国家正式补贴这些哲学家和圣贤——他们要求获得一笔捐赠基金，以资助他们未来十年的活动。"
 inv_building_events.47.t:0 "[building_province.GetName]学术界出现的新思想观点"
 inv_building_events.48.a:0 "可怕的消息，但我们现在无能为力"
 inv_building_events.48.b:0 "派遣士兵守卫[building_province.GetName]的市场。"
 inv_building_events.48.desc:0 "[building_governor.GetName]，一位被广泛认为深受爱戴之人遭到冷血谋杀，扭曲的尸体躺在[building_province.GetName]的集市上。\n\n没有人知道为什么会发生这种惨案，但现在整个城市都笼罩在恐惧之中，商业也受到了影响。"
 inv_building_events.48.t:0 "市场谋杀案"
 inv_building_events.49.a:0 "好消息，黄金总是多多益善。"
 inv_building_events.49.b:0 "告诉当地人我们很感激，但他们可以保留他们的钱"
 inv_building_events.49.desc:0 "好消息，[building_province.GetName]的集市正在蓬勃发展，超过了[building_province.GetArea.GetName]地区的所有其他集市，为当地政府带来了丰厚的收益。\n\n为了表示感谢，他们给我们送来了一份礼物。"
 inv_building_events.49.t:0 "[building_province.GetName]的市场"
 inv_building_events.5.a:0 "送去我们的致谢--这是多么贴心的举动啊"
 inv_building_events.5.b:0 "把钱再投资到本省"
 inv_building_events.5.desc:0 "由于在[building_province.GetName]的土方工程已经建成，我们收到报告说当地人欣喜若狂。他们感谢[ROOT.GetCountry.GetRuler.GetName]对他们的保护，并想用一份礼物来向[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]致敬。"
 inv_building_events.5.t:0 "坚不可摧的防御"
 inv_building_events.50.a:0 "我们不会干涉"
 inv_building_events.50.b:0 "多少钱？"
 inv_building_events.50.desc:0 "臭名昭著的[politician_on_trial.GetName]终于让[politician_on_trial.GetHerHim]抓到了把柄，[building_province.GetName]正在进行的审判让整个地区人心惶惶。\n\n为了保住自己的地位，[politician_on_trial.GetName]向[ROOT.GetCountry.GetRuler.GetName]发送了一条秘密信息，承诺如果国家代表 [politician_on_trial.GetHerHis]进行干预，将提供巨额赔金。"
 inv_building_events.50.t:0 "被控贪污"
 inv_building_events.51.a:0 "派遣士兵维持[building_province.GetName]治安。"
 inv_building_events.51.b:0 "我要求分一杯羹，否则[building_governor.GetName]就要上绞架"
 inv_building_events.51.desc:0 "[building_governor.GetName]是[building_province.GetName]的总督，据说他非常腐败，任何东西都可以花钱买到；操纵审判、谋杀对手、伪造土地所有权以及天知道还有什么。\n\n人们期望[ROOT.GetCountry.GetRuler.GetName]能够对这种司法不公采取一些措施。"
 inv_building_events.51.t:0 "腐败不堪"
 inv_building_events.52.a:0 "士兵们在接下来的一年里只能靠面包皮度日"
 inv_building_events.52.b:0 "我们什么都不会做......军队是不可侵犯的"
 inv_building_events.52.desc:0 "我们听说，[building_province.GetName]的一次军事训练演变成一场动乱，士兵们口出狂言，冲突造成数十人死亡。\n\n将军们想要惩罚这些叛变者，但建议[ROOT.GetCountry.GetName]小心行事。"
 inv_building_events.52.t:0 "训练灾难"
 inv_building_events.53.a:0 "让他们开始训练"
 inv_building_events.53.b:0 "让一些人去工作——我们的农场需要帮助"
 inv_building_events.53.desc:0 "我们的军事顾问很高兴地告诉我们，由于史无前例的征兵工作，[building_province.GetName]的可用人力激增。\n\n多余的人力应如何利用？"
 inv_building_events.53.t:0 "[building_province.GetName]征兵人数大幅增加"
 inv_building_events.54.a:0 "我们将帮助重建，并让它变得更好"
 inv_building_events.54.b:0 "这恐怕是生命自然循环的一部分"
 inv_building_events.54.desc:0 "最近，[building_province.GetName]发生了一连串火灾，烧毁了部分军营并杀死了许多士兵。\n\n当地人正在哀悼，并询问我们能否在他们需要帮助时提供一些帮助。"
 inv_building_events.54.t:0 "[building_province.GetName]的训练营地发生火灾"
 inv_building_events.55.a:0 "要求市民保持沉默，不然要他们好看！"
 inv_building_events.55.b:0 "暴徒们说的好像有道理……"
 inv_building_events.55.desc:0 "众所周知，[building_province.GetName]是一个懒惰而无能的领导者，市民的愤怒引发了[building_governor.GetName]的骚乱。\n\n我们的特工报告称，[building_governor.GetName]上周在[building_province.GetName]广场上遭到袭击，大家都承认这是一件可怕的事情。"
 inv_building_events.55.t:0 "[building_province.GetName]论坛的公民对[building_governor.GetName]感到不满"
 inv_building_events.56.a:0 "只要是抽象的哲学讨论，就可以容忍。"
 inv_building_events.56.b:0 "禁止在公共广场进行学术辩论和展示"
 inv_building_events.56.desc:0 "据说，[building_province.GetArea.GetName]附近涌现的哲学流派开始宣扬奇怪的思想，有些人甚至声称他们在鼓吹推翻国家。\n\n这些学派从何而来？众所周知，[building_province.GetName]论坛是思想活动的温床。"
 inv_building_events.56.t:0 "[building_province.GetName]论坛上出现的新思维方式"
 inv_building_events.57.a:0 "希望明年的运气会更好"
 inv_building_events.57.b:0 "派遣士兵，确保人们缴纳费用"
 inv_building_events.57.desc:0 "我们的收税员报告称，他们难以完成[building_province.GetName]的配额，这要归咎于[building_province.GetArea.GetName]最近一直在倒霉。人民当然要求宽大处理。"
 inv_building_events.57.t:0 "[building_province.GetName]税务局报告的数字远低于预期..."
 inv_building_events.58.a:0 "这是一场灾难，但我们无能为力"
 inv_building_events.58.b:0 "派遣士兵到[building_province.GetName]恢复秩序"
 inv_building_events.58.desc:0 "我们听说[building_province.GetName]的一些奴隶挣脱了束缚，并开始疯狂地杀人，杀死了一个当地的贵族。现在每个人都在恐慌，担心一场全面的奴隶起义正在形成。"
 inv_building_events.58.t:0 "[building_province.GetName]的奴隶杀害贵族"
 inv_building_events.6.a:0 "这无疑是一场代价高昂的灾难，但我们必须加紧干预"
 inv_building_events.6.b:0 "我们现在可以无视这个问题"
 inv_building_events.6.desc:0 "我们很遗憾地告诉您，[building_province.GetName]的城墙已经全部坍塌。虽然我们有希望挽救剩下的城墙，但这将是一次漫长而艰难的工程。\n\n如果我们有多余的钱币，我们也可以资助修复工作。"
 inv_building_events.6.t:0 "壁垒坍塌"
 inv_building_events.7.a:0 "将盈余收归国库"
 inv_building_events.7.b:0 "将这笔钱分发给当地人"
 inv_building_events.7.desc:0 "你会很高兴地知道，[building_province.GetName]附近的平静水域几乎保证了从其港口出发的许多商人的繁荣航行。贸易在该地区蓬勃发展，我们当地的征税人报告了创纪录的收获--我们今天受到了祝福，但必须决定如何处理这些收入。"
 inv_building_events.7.t:0 "海上的有利条件"
 inv_building_events.8.a:0 "你想让我做点什么？无事发生"
 inv_building_events.8.b:0 "威胁[port_manager.GetFirstName]并派士兵去码头"
 inv_building_events.8.desc:0 "[port_manager.GetName]拥有[building_province.GetName]的所有权，负责管理其繁忙的港口区，这是[ROOT.GetCountry.GetAdjective]的重要经济命脉。\n\n然而，我们不断收到有关港口管理腐败的投诉；[port_manager.GetFirstName]似乎不断接受贿赂，允许海盗在该水域停靠......我们应该做些什么。"
 inv_building_events.8.t:0 "港口管理问题"
 inv_building_events.9.a:0 "让当地人自行管理，我们不需要插手"
 inv_building_events.9.b:0 "给他们送去黄金和士兵清除老鼠"
 inv_building_events.9.desc:0 "无论是什么原因，[building_province.GetName]的害虫问题正在失控。港口区硕鼠横行，它们可以在一个晚上吃光整个粮仓，给这个地区带来了无尽痛苦。\n\n如果我们不采取行动，人们很快就会开始挨饿。"
 inv_building_events.9.t:0 "[building_province.GetName]港口鼠患"
 local_economic_boom_modifier:0 "经济腾飞"
 local_economic_bust_modifier:0 "经济萧条"
 local_research_boost_generic_mod:0 "本地研究工作"
 locally_expanded_port_infrastructure_modifier:0 "扩大港口区"
 rat_infestation_in_port:0 "鼠患"

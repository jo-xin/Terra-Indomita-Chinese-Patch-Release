l_simp_chinese:
 desc_mencius_grave:0 "许多旅人来到此地，参拜孟子之墓，以缅怀这位伟大的哲学家。"
 desc_xu_xing_commune:0 "许行——著名孟子门生、农业改革信奉者——的学说，由本省的一个公社所传授。"
 dhe_zou_ti.1.a:0 "您是否愿意将这份无价之文献出售给 [ROOT.GetCountry.GetName]？"
 dhe_zou_ti.1.b:0 "国库无法承受如此轻浮的消遣。"
 dhe_zou_ti.1.desc:0 "一天早晨，[ROOT.GetCountry.GetRuler.GetName] 正在 [ROOT.GetCountry.GetCapital.GetName] 的王宫中散步，[ROOT.GetCountry.GetRuler.GetSheHe] 决定去拜访 [GetCharacter('(int32)618').GetName]，这位老哲人正在自己的房间内安静地工作。令 [ROOT.GetCountry.GetRuler.GetFirstName] 大为惊讶的是，那位老圣人正在擦拭脸颊上的泪水，并用一块小布轻拭着鼻子。\n\n[ROOT.GetCountry.GetRuler.GetFirstName] 轻轻敲了敲门，然后走上前去，用柔和的声音说道：'请告诉我，亲爱的孟子，在这美好的日子里，是什么让您如此烦恼？现在悲伤还为时过早。'\n\n[GetCharacter('(int32)618').GetFirstName] 站起身来，整理了一下长袍，然后深深鞠了一躬。'请原谅一个老人的多愁善感，我的 [ROOT.GetCountry.GetRulerTitle]，但我流下的是喜悦的泪水，因为就在此刻，我完成了多年来一直在撰写的一部长篇著作。'\n\n[GetCharacter('(int32)618').GetName] 指向身后的卷轴，一丝微笑浮现在他布满皱纹的脸上。'我毕生的心血，终于完成了。'"
 dhe_zou_ti.1.t:0 "《孟子》集成"
 dhe_zou_ti.2.a:0 "若有机会，我会亲自前去致敬"
 dhe_zou_ti.2.desc:0 "今天带给你一个悲伤的消息，哦 [ROOT.GetCountry.GetRuler.GetName]。伟大的圣哲 [GetCharacter('(int32)618').GetName] 已离世而去，一股悲伤的气氛席卷了 [ROOT.GetCountry.GetCapital.GetName]，因为首都的人民爱戴这位老哲学家，几乎无法相信他已不在我们中间。\n\n[ROOT.GetCountry.GetRuler.GetFirstName] 感到 [ROOT.GetCountry.GetRuler.GetHerHis] 胸口沉重，喉咙哽咽，但 [ROOT.GetCountry.GetRuler.GetHerHis] 克服了这一阵悲痛。用充满感情的声音，[ROOT.GetCountry.GetRulerTitle] 喊道：'那么，我们将为他修建一座陵墓，一座配得上他的尊严和伟大灵魂的陵墓。召集 [ROOT.GetCountry.GetName] 境内最优秀的石匠，委托他们打造一座巨大的石碑，由海龟背负，上面将铭刻无与伦比的 [GetCharacter('(int32)618').GetName] 的事迹与功业。'"
 dhe_zou_ti.2.t:0 "孟子墓"
 dhe_zou_ti.3.a:0 "我会容忍此事，希望能从中有所收获"
 dhe_zou_ti.3.desc:0 "众所周知，[ROOT.GetCountry.GetName] 的统治者力图成为这片土地的忠实管家，但令人羞愧的是，[ROOT.GetCountry.GetRuler.GetName] 尚未听闻由 [GetCharacter('(int32)654').GetName] 所传授的大道，这位圣哲深信人性本善，坚信稳固的农业政策能为王国带来安定。\n\n因为，正如 [GetCharacter('(int32)654').GetFirstName] 所教导的，一位明智的统治者与他的子民一同耕作以谋生计，并且边执政边自己做饭——一位好的统治者以身作则，不畏惧让自己的双手沾染 [ROOT.GetCountry.GetCapital.GetName] 肥沃的黑土。\n\n但随着滕国的经济增长，粮仓和石砌金库被建造起来以容纳日益富裕的土地上产出的黄金和白银，诱惑比比皆是，一个不合格的 [ROOT.GetCountry.GetRulerTitle] 会通过对人民施加苦难来养肥自己……的确，[ROOT.GetCountry.GetRuler.GetFirstName] 并非在任何时候都清白正直，[ROOT.GetCountry.GetRuler.GetHerHim] 在各种场合也为自己谋取了利益。\n\n作为对这种状况的回应，一个分享 [GetCharacter('(int32)654').GetFirstName] 学说的公社在首都附近成立了，许多 [ROOT.GetCountry.GetAdjective] 人民，包括 [ROOT.GetCountry.GetRuler.GetFirstName]，据说都曾出席这位圣哲的讲学。"
 dhe_zou_ti.3.t:0 "许行公社"
 mencius_grave:0 "孟子墓"
 mencius_treasure:0 "《孟子》集成"
 mencius_treasure_desc:0 "这些卷轴包含了伟大的孟子亲笔所写的思考、格言和教诲。"
 xu_xing_commune:0 "许行公社"

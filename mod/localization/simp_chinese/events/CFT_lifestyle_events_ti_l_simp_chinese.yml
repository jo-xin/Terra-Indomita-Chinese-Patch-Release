l_simp_chinese:
 lifestyle_events.1.a:0 "愿睿智指引我们的扩张。"
 lifestyle_events.1.desc:0 "近期，[ROOT.GetCountry.GetName]国力大增，疆域拓展至新的土地，而随着这种增长，冲突的阴影也令人不安地笼罩而来。我们的最高顾问们请求[ROOT.GetCountry.GetRuler.GetName]安抚民众的恐惧。外国使节、受人尊敬的哲学家、英勇的将领，甚至一些零散的平民都聚集在[ROOT.GetCountry.GetCapital.GetName]的中心，全都热切等待着我的演讲。当我迈步上前时，我敏锐地意识到我们新兴帝国的巨大意义以及它赋予我的责任。在经受了时间考验的建筑奇迹的背景下，[ROOT.GetCountry.GetRuler.GetName]展开了一场无与伦比的演说，公开承认我们疆域扩张这一不可否认的现实，而不仅仅是空谈陈词滥调；相反，[ROOT.GetCountry.GetRuler.GetName]谈论团结，强调团结我们多元民众的共同理想，并着重指出我们增长所带来的无限机遇。[ROOT.GetCountry.GetRuler.GetName]的演讲无疑牢牢吸引了在场所有人的注意力；怀疑让位于理解，担忧转化为乐观。在他们的言辞中，人民找到了安心，贵族获得了新的信心，将领们开始领悟外交在保卫我们来之不易的领土方面的重要性。"
 lifestyle_events.1.t:0 "[ROOT.GetCountry.GetName]的历史性演说"
 lifestyle_events.10.a:0 "让我们不要质疑命运之手。"
 lifestyle_events.10.desc:0 "[ROOT.GetCountry.GetRuler.GetName]抓住了一个机会来#E 扩充自己的领地#!。一位负债累累、面临重重挑战的商人，寻求出售他在[holding_province.GetName]的财产。认识到这片土地隐藏的潜力和战略价值，代表[ROOT.GetCountry.GetRuler.GetName]的代理人谈判达成了一笔交易，以低得离谱的价格购得了这块新地皮……当地人中流传着传闻，那位前地主在出售土地后，神秘地消失得无影无踪，留下了一连串问题和如阴影般挥之不去的谣言。"
 lifestyle_events.10.t:0 "购置新地"
 lifestyle_events.11.a:0 "有没有可能学会这种力量？"
 lifestyle_events.11.desc:0 "你听说过#E 镀金者弥达斯王#!的故事吗？这不是穷人会告诉你的故事。这是一个#Y 弗里吉亚#!神话。#E 弥达斯王#!……是一位如此贪婪、如此痴迷于聚敛财富的君主，他渴望拥有比任何人都多的黄金。他对这种贵金属如此着迷，以至于在选择回报款待#E 西勒诺斯#!的奖赏时，他请求获得将所触之物变为闪耀珍宝的能力。崇拜#Y #E 狄俄尼索斯#!#!是一条通往许多能力的道路……其中一些被认为是不自然的。他的愿望得到了满足，起初，他陶醉于这种新获得的能力，试图将自己所有的财产化为纯金。最终，他当然做到了。不幸的是，当他拥抱自己的女儿#E 金盏花#!时，她也变成了黄金。然后，在恐惧中，他向#Y #E 狄俄尼索斯#!#!祈祷，寻求逆转这一过程的方法。这很讽刺。他可以使自己不变成黄金，却无法保护他人。"
 lifestyle_events.11.t:0 "镀金者弥达斯的悲剧"
 lifestyle_events.12.a:0 "当然是在乡村庄园建一座奢华的#E 别墅#!。"
 lifestyle_events.12.b:0 "一座宏伟的#E 公共建筑#!无疑会安抚平民。"
 lifestyle_events.12.c:0 "一座令人印象深刻的#E 引水渠#!必定会让我们赢得民众的好感。"
 lifestyle_events.12.d:0 "建立一个#E 商业中心#!将刺激经济增长。"
 lifestyle_events.12.desc:0 "[ROOT.GetCountry.GetRuler.GetName]决心在[ROOT.GetCountry.GetName]的土地上留下永恒的印记，投入部分个人资金在[building_province.GetName]建设基础设施，造福[ROOT.GetCountry.GetName]的子孙后代。哪项建设项目最需要我们资助？"
 lifestyle_events.12.t:0 "宏伟壮丽的建筑"
 lifestyle_events.13.a:0 "[ROOT.GetCountry.GetRuler.GetName]渴望有朝一日前往对[ROOT.GetCountry.GetRuler.GetReligion.GetName]最神圣的地方之一进行#E 朝圣#!。"
 lifestyle_events.13.desc:0 "过去几晚，[ROOT.GetCountry.GetRuler.GetName]一直被充满神秘符号和不祥预言的噩梦所困扰。为了寻求答案，[ROOT.GetCountry.GetRuler.GetName]求助于[ROOT.GetCountry.GetRuler.GetHerHim]的心腹顾问，质问这些不安幻象背后的含义。议会意见分歧，一些人将这些梦境归因于#E 诸神的任性#!，而另一些人则提出了更世俗的解释。然而，[ROOT.GetCountry.GetRuler.GetName]越来越确信这些梦境是#E 神谕#!，是对#E 虔诚#!和#E 奉献#!的召唤。[ROOT.GetCountry.GetRuler.GetSheHe]将自己奉献给诸神及其意志。"
 lifestyle_events.13.t:0 "[ROOT.GetCountry.GetRuler.GetName]的虔诚"
 lifestyle_events.14.a:0 "[finesse_thinker.GetName]传来消息，工作的第一部分已经完成。"
 lifestyle_events.14.desc:0 "认识到进步与改进的潜力，[ROOT.GetCountry.GetRuler.GetName]召集了我们疆域内#E 最睿智的头脑和最精湛的工匠#!，聚集在[ROOT.GetCountry.GetCapital.GetName]。在那里，在神圣的学术殿堂中，他们将展开一场竞赛，推动各自研究领域的边界。[ROOT.GetCountry.GetRuler.GetName]希望他们能够一起踏上一段#E 启蒙#!与#E 发明#!的旅程，开创一个发现的新时代。\n\n[ROOT.GetCountry.GetRuler.GetName]每日勤勉地检查他们的进展，渴望见证他们集体才华的成果。[ROOT.GetCountry.GetRuler.GetSheHe]特别关注了#E [finesse_thinker.GetName]#!的工作，此人年轻时师从一位伟大的哲学家，那位哲学家不幸在围城战中被一名乱兵杀害。[finesse_thinker.GetName]成年后的大部分时间都致力于完成其老师残缺不全的未竟手稿。"
 lifestyle_events.14.t:0 "别碰我的圆！"
 lifestyle_events.15.a:0 "愿神佑护我们所有人。"
 lifestyle_events.15.desc:0 "在[ROOT.GetCountry.GetName]，人们越来越相信[ROOT.GetCountry.GetRuler.GetName]不仅是凡人的统治者，更是诸神眷顾的子嗣。征兆与预兆似乎伴随着他们的每一步，尽管统治艰辛、挑战重重，[ROOT.GetCountry.GetRuler.GetName]依然健壮矍铄，显然蒙受神恩，拥有超凡的健康与活力。"
 lifestyle_events.15.t:0 "神佑之国[ROOT.GetCountry.GetName]"
 lifestyle_events.16.a:0 " #E 许多人#!将拥抱信仰。"
 lifestyle_events.16.b:0 " #E 少数人#!将寻得光明。"
 lifestyle_events.16.desc:0 "在对[ROOT.GetCountry.GetReligion.GetName]表达深切虔诚和支持的举动中，[ROOT.GetCountry.GetRuler.GetName]支持了#E 祭司团#!中专注于#E 传教#!的一派，派遣他们前往[conversion_province.GetName]，以便将信仰之光传播给不信者。"
 lifestyle_events.16.t:0 "传教事业"
 lifestyle_events.2.a:0 "也许[ROOT.GetCountry.GetRuler.GetName]也没那么糟。"
 lifestyle_events.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName]站在伟大的边缘，但民众中却有不安的窃窃私语。一些民众对权力的行使和暴政的阴影怀有担忧。作为回应，[ROOT.GetCountry.GetRuler.GetName]选择不以统治者的身份，而是以一位理解他们恐惧的魅力人物的身份向人民致辞。在[ROOT.GetCountry.GetCapital.GetName]中心的一座简朴讲台上，在祖先的注视之下，[ROOT.GetCountry.GetRuler.GetName]以一位引人入胜的演说家的姿态站立。[ROOT.GetCountry.GetRuler.GetHerHis]的#E 魅力#!弥漫在空气中，迷住了聚集的人群。凭借磁石般的魅力，[ROOT.GetCountry.GetRuler.GetName]不是从王座上发言，而是作为一位分享他们希望与忧虑的同胞公民。[ROOT.GetCountry.GetRuler.GetName]承认他们时代的不可否认的现实，因为[ROOT.GetCountry.GetRuler.GetSheHe]并未躲避其挑战。[ROOT.GetCountry.GetRuler.GetSheHe]感受到了与民众同样的担忧，担心回到旧日的方式，担心#E 暴君#!以不受制约的权力行事。但须知此时此刻，[ROOT.GetCountry.GetRuler.GetSheHe]承诺维护[ROOT.GetCountry.GetName]珍视的理想，渴望公正地遵守法治。在[ROOT.GetCountry.GetRuler.GetName]非凡#E 魅力#!的感召下，疑虑与恐惧烟消云散。人们离开集会时，对领袖应对时代挑战的能力重拾信心，同时也坚定了[ROOT.GetCountry.GetName]珍视的价值观。"
 lifestyle_events.2.t:0 "[ROOT.GetCountry.GetRuler.GetName]的演说天赋"
 lifestyle_events.3.a:0 "这些事务听起来比平时有趣多了。"
 lifestyle_events.3.desc:0 "最近，[ROOT.GetCountry.GetRuler.GetName]经历了一场深刻的转变。曾经以将对[ROOT.GetCountry.GetName]人民的义务置于满足[ROOT.GetCountry.GetConsort.GetName]的欲望之上而闻名，[ROOT.GetCountry.GetRuler.GetName]如今被一个单一的欲望所吞噬——确保其血脉的未来。在巩固继承权的迫切需求驱使下，[ROOT.GetCountry.GetRuler.GetName]发现[ROOT.GetCountry.GetRuler.GetHerHim]被对为人父母的无情追求所驱动，愿意不惜一切代价确保其遗产得以延续。在[ROOT.GetCountry.GetRuler.GetName]位于[ROOT.GetCountry.GetCapital.GetName]的府邸大厅里，侍从们如今打趣说，[ROOT.GetCountry.GetRuler.GetName]最近的失眠之夜并非在处理国事，而是忙于另一种「正事」。"
 lifestyle_events.3.t:0 "[ROOT.GetCountry.GetName]的继承人之求"
 lifestyle_events.4.a:0 "[charisma_thinker.GetName]可以帮助解决#E 孤僻#!的问题。"
 lifestyle_events.4.b:0 "[finesse_thinker.GetName]可以帮助我们避免过于#E 直言不讳#!。"
 lifestyle_events.4.c:0 "当然[zeal_thinker.GetName]可以治愈我们的#E 羞怯#!。"
 lifestyle_events.4.desc:0 "[ROOT.GetCountry.GetRuler.GetName]的一些不太理想的性格特征一直妨碍着他们与民众的联系，甚至在[ROOT.GetCountry.GetRuler.GetHerHim]自己与最信任的心腹之间也造成了误解和沟通障碍。认识到与人民接触的重要性，[ROOT.GetCountry.GetRuler.GetName]决定向一位信得过的顾问寻求指导，以摆脱一些不良的说话习惯，找到作为有魅力演说家的声音。随着[ROOT.GetCountry.GetRuler.GetName]致力于提升自我，自我完善之路就此开始。但问题仍然存在，[ROOT.GetCountry.GetName]的哪位顾问应该是[ROOT.GetCountry.GetRuler.GetName]寻求指导的对象？"
 lifestyle_events.4.t:0 "新发现的演讲才能"
 lifestyle_events.5.a:0 "[ROOT.GetCountry.GetRuler.GetName]已从#E 虚弱#!转变为#E 强大#!。"
 lifestyle_events.5.desc:0 "在听闻古代英雄力克万难的故事后，一股对武艺卓越的热情攫住了[ROOT.GetCountry.GetRuler.GetName]，渴望抛弃自己的#E 孱弱#!。认识到战斗力在塑造[ROOT.GetCountry.GetName]命运中的关键作用，[ROOT.GetCountry.GetRuler.GetName]在[martial_thinker.GetName]的指导下开始了强化训练。每天清晨，[ROOT.GetCountry.GetRuler.GetName]都会出现在训练场上，身披铠甲、手持武器，意志坚定不移。"
 lifestyle_events.5.t:0 "[ROOT.GetCountry.GetName]的强健体魄"
 lifestyle_events.6.a:0 "尽你的职责，其余交给诸神。"
 lifestyle_events.6.desc:0 "当[ROOT.GetCountry.GetRuler.GetName]视察训练场时，[ROOT.GetCountry.GetRuler.GetSheHe]不禁注意到那些渴望加入[ROOT.GetCountry.GetName]军队的年轻人身上的潜力。很明显，有一个机会可以激励这些新兵，向他们灌输深厚的责任感和荣誉感。通过一场激动人心的演讲和自己战斗技艺的展示，[ROOT.GetCountry.GetRuler.GetName]鼓舞了这些年轻的希望者们，鼓励他们将生命奉献给保卫祖国的繁荣昌盛。这一号召不仅作为一项义务，更是作为一个值得为之牺牲的崇高事业而产生了共鸣，确保[ROOT.GetCountry.GetName]军队的行列很快将充满忠诚而技艺精湛的士兵。"
 lifestyle_events.6.t:0 "[ROOT.GetCountry.GetName]的激励统率"
 lifestyle_events.7.a:0 "一代代战术家和指挥官将从#E [ROOT.GetCountry.GetRuler.GetName]的《战略论》#!中获得灵感。"
 lifestyle_events.7.desc:0 "在[ROOT.GetCountry.GetRuler.GetName]昏暗的寝宫中，一项非凡的事业正在展开。手持铁笔，[ROOT.GetCountry.GetRuler.GetName]着手一项艰巨的任务——将一部全面的战争手册铭刻在耐用的卷轴上，这样的著作在[ROOT.GetCountry.GetName]前所未见。数小时变成数日，数日变成数周，[ROOT.GetCountry.GetRuler.GetName]勤勉地编纂自己的军事智慧、战术和战略。[ROOT.GetCountry.GetName]经历的无数战役和征战的份量被镌刻在这些卷轴上，每一个符号和线条都代表着确保[ROOT.GetCountry.GetName]未来的决心。"
 lifestyle_events.7.t:0 "[ROOT.GetCountry.GetName]的《战略论》"
 lifestyle_events.8.a:0 "[ROOT.GetCountry.GetRuler.GetName]的强硬统治将带来更好的时代。"
 lifestyle_events.8.desc:0 "领导的重担已经造成了影响，硬化了[ROOT.GetCountry.GetRuler.GetName]的心，将他们引向#E 残忍#!之路。曾经以仁慈和公正著称的[ROOT.GetCountry.GetRuler.GetName]，如今以铁腕统治，对那些胆敢违抗其权威的人毫不留情。民众沮丧地看着他们的[ROOT.GetCountry.GetRuler.GetRulerTitle]的同情心日渐消退，取而代之的是不惜一切代价维持秩序的无情决心。"
 lifestyle_events.8.t:0 "艰难时世造就硬汉"
 lifestyle_events.9.a:0 "他们最好以我们为榜样。"
 lifestyle_events.9.desc:0 "多年来，[ROOT.GetCountry.GetRuler.GetName]展现出敏锐的#E 财务头脑#!，在各种看似无望的风险事业中进行了精明的个人投资。其中一项由[finesse_thinker.GetName]运营、曾受到一些人怀疑的事业，如今已发展成利润丰厚的企业。[ROOT.GetCountry.GetRuler.GetName]的信任和明智决策必将为他们带来可观的收益。许多曾质疑[ROOT.GetCountry.GetRuler.GetName]财务头脑的朝臣和顾问，如今都以钦佩的目光注视着他们非凡的成功。"
 lifestyle_events.9.t:0 "积累个人财富"

 hemp:0 "麻"
 hempDESC:0 "麻从无法追忆的远古时期以来就受到驯化种植，由于具有纤维的性质，麻在服装和绳索的发展中起到了重要作用。"
 hindu:0 "印度教"
 honey:0 "蜂蜜"
 honeyDESC:0 "虽然家庭养蜂并不普遍，但作为一种食品和防腐剂，蜂蜜是非常受欢迎的。"
 horde_conquest_war_goal:0 "部落征服"
 horses:0 "马匹"
 horsesDESC:0 "在农业和战争中，马匹的使用很普遍。作为载重的牲口，他们很适合拉战车，也很适合载着骑手。"
 hurrian_pantheon:0 "胡里安信仰"
 illyrian_pantheon:0 "伊利里亚多神教"
 incense:0 "香"
 incenseDESC:0 "“香”一词涵盖了一系列罕见的异域物质，而它们主要用于宗教用途。"
 indo_iranian_religion:0 "七神崇拜"
 iron:0 "铁"
 ironDESC:0 "铁加工的存在定义了许多文明。作为一种前所未有的材料，它用于打造工具和武器，但其力量却远远超过它的前辈青铜。"
 italic_pantheon:0 "意大利信仰"
 ivory:0 "象牙"
 ivoryDESC:0 "取自大象的獠牙，象牙是一种奢侈品贸易货物，深受珠宝商和其他制作高价值物品的工匠青睐。"
 jade:0 "玉石"
 jadeDESC:0 "玉来自遥远的东方，那儿的商人们用奇怪的语言提到关于它神秘力量的传言。玉石是一种坚硬的绿色矿物，带有淡淡的色彩，因其美丽和稀有而备受追捧。"
 jainism:0 "耆那教"
 judaism:0 "犹太教"
 lapis:0 "青金石"
 lapisDESC:0 "青金石只在少数几个地方发现，如巴克特里亚山区的矿山，是一种珍贵的宝石，因其深邃的蓝色而备受青睐。它的稀缺性使其更具吸引力。"
 leather:0 "皮革"
 leatherDESC:0 "鞣制过的兽皮在家庭和军事生活中有很多用途。早期的盾牌通常是皮制的，其能减轻任何攻击造成的伤害。"
 loyalty_regent_ruler:0 "是统治者"
 loyalty_sparta_co_ruler:0 "斯巴达双头政治"
 marble:0 "大理石"
 marbleDESC:0 "由于拥有柔软光亮的色调，大理石被认为是人像雕塑和圣像的最好材料。"

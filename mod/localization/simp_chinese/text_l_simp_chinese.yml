 any_war_attacker_trigger:0 "任何战争进攻方"
 any_war_defender_trigger:0 "任何战争防御方"
 arabian_pantheon:0 "阿拉伯多神教"
 armenian_religion:0 "哈尔迪多神教"
 base_metals:0 "基本金属"
 base_metalsDESC:0 "铜、锡和铅虽然不适合军事用途，但长期以来一直用于冶炼合金及装饰品。尽管到处都在使用这些金属，但由于地理上的相对匮乏，致使它们在世界各地的价格居高不下。"
 berber_religion:0 "巨石崇拜"
 boar_vessel:0 "野猪容器"
 boar_vessel.1.a:0 "我们应该留着，这是显然是神的礼物。"
 boar_vessel.1.b:0 "去农场上用吧，我们不需要这个"
 boar_vessel.1.desc:0 "在农场工作时，一名奴隶意外地发现了一个很久以前的宝藏。看起来像是某种壶，我们该怎么办？"
 boar_vessel.1.t:0 "发现一件古董"
 boar_vessel_desc:0 "一个野猪形状的陶罐。它散发出一种不祥的预兆……"
 bon_religion:0 "苯教"
 buddhism:0 "佛教"
 burmese_religion:0 "纳特信仰"
 camel:0 "骆驼"
 camelDESC:0 "骆驼适合在恶劣干旱的气候下生存，被广泛用作驮畜和军用牲口。"
 carthaginian_pantheon:0 "迦南多神教"
 cattle:0 "家畜"
 cattleDESC:0 "家畜包含了众多被驯化的动物，提供大量如牛奶、奶酪、肉类和羊毛之类的商品，而这些商品都是经济的重要组成部分。"
 caucasian_religion:0 "阿尔马济多神教"
 cedar:0 "雪松木"
 cedarDESC:0 "雪松木是一种有着芳香气味的木材，因其耐久性和强度而受到重视，可用于建造最好的船只。"
 change_pantheon:0 "改变神系组成"
 cinnabar:0 "朱砂"
 cinnabarDESC:0 "朱砂是一种特殊的红色矿物，可用于制造珠宝和其他奢侈品。它火红的颜色和稀有的分布使它非常有价值。"
 citrus:0 "柑橘"
 citrusDESC:0 "酸橙、柠檬、橙子、枸橼、柑橘；酸爽多汁，柑橘类水果因其充满活力的风味和酸度而备受追捧。"
 civil_war_buff_ai:0 "激励的征召兵"
 cloth:0 "布料"
 clothDESC:0 "布料可产自大量植物或动物产品，并且据发现，其在世界各地的市场上都有不同的质量。"
 cloves:0 "丁香"
 clovesDESC:0 "芬芳的丁香树的花蕾被干燥研磨成香料，可用作药材和调味品。"
 cowrie_shells:0 "贝币"
 cowrie_shellsDESC:0 "贝币长期以来在东方被用作货币，在中国和印度都被用来促进贸易，有时部落也会将其用作仪式物品。"
 dates:0 "椰枣"
 datesDESC:0 "椰枣主要种植在温暖的气候中，椰枣制品在许多文明中的日常饮食中被作为主食。"
 death_by_pirates:0 "被海盗杀害"
 death_child_sacrifice:0 "这个孩子被牺牲以安抚神灵"
 death_decapitated:0 "这个人的头完全被砍掉"
 death_pulled_limb_by_limb:0 "被用手脚吊起并一肢一肢地拉开，在一个真正可怕的展示中……"
 death_ritual_sacrifice:0 "这个人被牺牲了"
 death_ritual_sallekhana:0 "依照耆那教的自愿禁食传统绝食而亡，如今在所有耆那教僧侣中被崇敬"
 death_tribal_duel:0 "在与对手的决斗中死亡"
 desc_agama:0 "阿迦摩信仰在日后形成为南印度的印度教。在印度雅利安入侵者定居北方之前，它是印度的本土宗教。"
 desc_ajivika:0 "正命派是印度的游行沙门教派，在佛教和耆那教兴起之前曾一度非常流行。正命派的追随者们坚信命定论，即相信生命是预定的和注定的。"
 desc_anahitic_religion:0 "亚美尼亚的阿娜希特万神殿位于希腊、琐罗亚斯德、库柏勒乃至迦南与阿拉伯诸神体系的交汇处。以阿娜希特为万神殿之首，数位源自古代亚美尼亚的神祇也与她一同立于这座宗教熔炉之中。"
 desc_anatolian_religion:0 "弗里吉亚的库柏勒崇拜与史前的母神崇拜有关。在数千年的演变中，库柏勒崇拜经常与神话人物和英雄们产生关联，并且通过崇敬圣像来实践他们的宗教信仰。"
 desc_animism:0 "伊比利亚多神教本质上是一种混合多神教，其宗教活动包括崇敬动物灵魂，以及祖先崇拜。伊比利亚人敬奉各种希腊和腓尼基的神，以及诸如贝塔屯或阿塔克纳等地方神。"
 desc_arabian_pantheon:0 "阿拉伯的宗教是多神论，一种各类神明、灵体和魔鬼崇拜的混合体，奉行于当地和区域周边的聚居区。在这段时间里的某些地方那儿，造物主阿拉可能作为神系的首领而受人敬奉。"
 desc_armenian_religion:0 "哈尔迪神系代表了一种宗教，成长自许多世纪以前的乌拉尔图文化。其主要是多神论信仰，主神被称作哈尔迪，同时也作为战神受崇拜。"
 desc_berber_religion:0 "这种古老的文化和宗教是传统埃及信仰、星辰崇拜和敬奉先祖的大熔炉。许多巨石，即为了纪念众神而筑起的石头建筑，仍然存在并点缀着非洲景观。"
 desc_bon_religion:0 "苯教代表了最初在青藏高原实践的一组民间宗教。祖先崇拜与万物有灵观念常常出现，同时也带有萌芽中的多神信仰。"
 desc_buddhism:0 "作为一个相对年轻的宗教，佛教源起自北印度，追随乔达摩·悉达多（或简称佛陀）的生命轨迹。佛陀是一位游历印度、谈论中道的苦行导师。"
 desc_burmese_religion:0 "对被称为纳特的精神的崇拜在许多南亚民族中很普遍，包括现在的缅甸土著。纳特信仰后来成为一种适当的多神教信仰，但现在是一种最容易被认为是万物有灵的信仰，多神教的雏形正在形成。"
 desc_carthaginian_pantheon:0 "秉持多神论的迦南宗教崇敬各路神灵以及祂们的不同形象。巴力是这复杂的次神神阶制中的主神，祂们受人崇拜的圣坛通常位于深山中或山顶上。"
 desc_caucasian_religion:0 "高加索—伊柏里亚区域的神系由阿尔马济神统治，并且可能与附近的安那托利亚各宗教有关。"
 desc_druidism:0 "德鲁伊活跃于凯尔特人中，作为一个独特的社会阶级而存在。他们通常扮演政务官与立法者的角色，同时他们也决定了当地的宗教习俗和信仰。"
 desc_eastern_animism:0 "作为种种受波斯影响较弱的印欧语系地方信仰和民间宗教的代表，仪式祭祀包含祖先崇拜、万物有灵论和还愿祭。"
 desc_egyptian_pantheon:0 "埃及本土宗教的历史可以追溯到几千年前。其表现为一种多神信仰，即对拉、阿图姆、塞赫美特等神的敬奉，也体现出对自然界不同基本侧面的深深敬意。"
 desc_germanic_religion:0 "古代的日耳曼神，也即蒂乌斯、提尔或图伊斯托，受到当代斯堪的纳维亚的早期迁徙部落的敬奉。许多说法表明，日耳曼人信奉一种万物有灵论的宗教，崇敬大地和天空，以及所有生物的生命力。"
 desc_hindu:0 "印度教从吠陀时期发展而来，由奥义书的创立所引导，并且在古典时代早期的印度广受尊崇。"
 desc_hurrian_pantheon:0 "胡里安信仰是一种围绕强大的特什布神展开的信仰，讲述了他在库马尔比循环中的无休止斗争。这是一个古老的信仰，尽管在这个时代已经逐渐消失，但依然有些许信徒信奉。胡里安信仰曾深刻影响赫梯人、胡里安人以及腓尼基人。或许，特什布的故事还尚未完全结束。"
 desc_illyrian_pantheon:0 "伊利里亚人信奉着独特的伊利里亚神系，融合了意大利神系与希腊神系的影响。他们没有单一的主神，而是崇拜着众多地方神祇。其中也存在两个重要的宗教崇拜：派奥尼亚伊利里亚人的太阳崇拜，以及南伊利里亚人的蛇神崇拜。"
 desc_indo_iranian_religion:0 "这一泛神论信仰起源于斯基泰之地，其敬奉七个主神，而他们等同于希腊神系中的神。斯基泰人的早期多神论民间宗教的某些特点仍类似于凯尔特人，比如用马祭祀以及战车墓葬。"
 desc_italic_pantheon:0 "在接纳希腊诸神之前，意大利人崇拜各种各样的神灵。从前印欧信仰的伊特鲁里亚和雷蒂亚人，到伊利里亚‑意大利的维涅托人，再到南意大利的萨宾人、拉丁人、翁布里人等，意大利众神在其追随者中是多样而广泛的。"
 desc_jainism:0 "耆那教是一个历史悠久的印度宗教，可以追溯到早期的宗教祖师。耆那们坚信禁欲主义和非暴力，并与其它印度传统保持友好的关系。"
 desc_judaism:0 "不同于当时的各种信仰，犹太教是一神论宗教。追随着众先知与老师的步伐，犹太圣书《托拉》记载了上主和以色列子孙之间所立之约的细节。"
 desc_matrist_religion:0 "人们对波罗的海的部落以及他们的宗教知之甚少。尽管如此，仍有记载讲述了这个在波罗的海沿岸敬奉一位母神的教派。"
 desc_mesopotamian_religion:0 "迦勒底神系的历史可以追溯到几千年前。迦勒底宗教的信徒建造雄伟的神庙以纪念他们所选择的神，敬奉如安努、恩基和南那等等神灵。"
 desc_mithra_religion:0 "米底人的宗教信仰主要崇拜神祇密特拉，而不是阿胡拉·马兹达。它继承自前琐罗亚斯德教的古波斯信仰。在阿契美尼德帝国的兴起过程中，经历了高潮与低谷，这种信仰很多时候倾向于马兹达教派的琐罗亚斯德教，但直到今天，它仍然在米底人民中传承不衰。"
 desc_nilotic_pantheon:0 "尼罗河民族有一个独特的神灵体系，随着他们在撒哈拉和尼罗河流域的迁徙，对周围民族产生了影响。从原始的哈索尔母牛女神，到至高神尼罗河，这个众神体系充满了具有影响力和独特的神祇。"
 desc_nuragic_pantheon:0 "努拉吉信仰可以追溯到科西嘉和撒丁岛的青铜时代。充满了动物和井的崇拜，努拉吉信仰的核心是一种父神信仰，被称为萨尔多、锡德·阿迪尔等名字。"
 desc_province_improvement_warm_period:0 "在过去的几年里，诸神似乎赐福与我们温暖和更好的收成。"
 desc_puntic_religion:0 "瓦格，全能的造物主、我们所有人的父亲。数千年来，生活在非洲之角的人民一直忠实地崇敬他，他们坚定地献身于至高无上的上帝，确保了他平和而和谐的祝福。作为一种古老的一神论宗教，瓦格教拥有复杂的等级制度和一系列信仰，瓦格超越了一切，统领着指派给他人民的无数天使，给他的追随者带来好运，用他的力量和荣耀保护他们免受敌人的伤害。"
 desc_roman_pantheon:0 "意大利人的信仰强烈受到希腊人的影响，尤其是在神话上，但也有相当程度不同于希腊，其信仰是以朱庇特为核心的大量神明。"
 desc_shamanism:0 "扎尔莫克西斯最初究竟是先知还是神，这点无人知晓。达契亚人和盖塔人将扎尔莫克西斯奉为神明，认为很多奇迹行为都是出自他手。"
 desc_vaksh_religion:0 "结合了瓦赫什（奥克苏斯）流域人民的信仰、草原上的七神崇拜以及波斯的琐罗亚斯德教，瓦赫什信仰形成了其独特的身份，成为了一个文化与宗教的熔炉，在尊崇本地神祇的同时，也崇拜其他民族熟悉的神祇。"
 desc_zoroaster:0 "先知琐罗亚斯德教导关于造物主阿胡拉马兹达以及其宿敌阿里曼的信仰。其从早期的印度—伊朗多神教演变而来，尤为崇敬“永恒法则”，或称妲厄娜，拥护善良和公正之举。"
 desert_hills:0 "沙漠丘陵"
 desert_hills_desc:0 "在这片无情的土地上，沙漠中连绵起伏的山丘向四面八方绵延不绝。"
 druidism:0 "德鲁伊教"
 dye:0 "染料"
 dyeDESC:0 "昂贵的染料，如骨螺紫和胭脂虫粉，是从栖息地极狭小的稀有无脊椎动物中获取的。这些颜色在许多文化的统治精英中尤为受欢迎，且其价格注定居高不下。"
 earthware:0 "陶器"
 earthwareDESC:0 "自发现火以来，陶器的生产一直是人类文明的决定性活动。陶器包括一些实用的餐具，如碗和壶，以及雕像、瓮和其他装饰物品。"
 eastern_animism:0 "仪式祭祀信仰"
 ebony:0 "乌木"
 ebonyDESC:0 "乌木是最上等的木材之一，可被抛光至镜面般的光泽，因此因其装饰特性而备受珍视，常被大师级工匠所用。"
 egyptian_pantheon:0 "埃及多神教"
 elephants:0 "大象"
 elephantsDESC:0 "和许多载重牲口一样，大象被驯化后用于农业、宗教和军事用途。许多文明认为大象是神圣或可敬的生物。"
 exotic_beasts:0 "珍奇异兽"
 exotic_beastsDESC:0 "由于对惊险刺激的表演和娱乐的持续需求，珍奇异兽的贸易十分兴旺。捕获狮子、老虎和熊运往文明世界的竞技场和宫廷往往耗费巨资。"
 fish:0 "鱼"
 fishDESC:0 "世界上所有沿海文明的饮食和经济中，鱼占据了其很大一部分。"
 flood_plain:0 "洪泛平原"
 flood_plain_combat_bonus:0 "河漫滩战斗加成"
 flood_plain_desc:0 "繁荣的洪泛区位于许多河流的边缘，为周围的社区提供生命。"
 fruits:0 "水果"
 fruitsDESC:0 "各式各样的新鲜核果和浆果，从散发着馥郁芬芳的、精心照料的树林中采摘而来，令人垂涎欲滴。"
 fur:0 "毛皮"
 furDESC:0 "从远古时代起，人类就一直在使用毛皮来抵御刺骨的寒冷。从缝制的兔皮到大熊皮，一件好皮毛的用途数不胜数。"

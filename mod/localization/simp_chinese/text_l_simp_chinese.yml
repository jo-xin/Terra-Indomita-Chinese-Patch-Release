 myrrh:0 "没药"
 myrrhDESC:0 "没药是一种芳香的干燥树脂，产于阿拉伯和东非，被用来制造皇室使用的香水和药膏。"
 nilotic_pantheon:0 "尼亚利克信仰"
 no_land_tt:0 "[THIS.GetCountry.GetName|Y]不拥有任何领土（当前：[THIS.GetCountry.GetOwnedProvinceCount|Y]）"
 nuragic_pantheon:0 "努拉吉信仰"
 nutmeg:0 "肉豆蔻"
 nutmegDESC:0 "肉豆蔻树的研磨种子以其辛辣香气闻名，常用于调味菜肴无论甜咸皆可，还能作为治疗各种疾病的药物。"
 oasis:0 "绿洲"
 oasis_desc:0 "一个沙漠绿洲。被无尽沙漠包围的生命乐园。"
 olive:0 "橄榄"
 oliveDESC:0 "培育了几千年的橄榄产品，是地中海经济的重要组成部分。许多文明认为橄榄是多产和力量的象征。"
 opium:0 "鸦片"
 opiumDESC:0 "罂粟可被加工成一种极易上瘾的药物，它能抹去记忆，并用其浓郁的麻醉烟雾带来难以形容的愉悦。"
 papyrus:0 "莎草纸"
 papyrusDESC:0 "大多数文明世界都使用刻写版、蚀刻画和石刻来存录文字。然而，产自埃及地区的独特莎草纸为此提供了更便利的使用途径。"
 party_leader_extorted:0 "政党领袖被勒索"
 pearls:0 "珍珠"
 pearlsDESC:0 "当沙粒之类的刺激物进入软体动物的壳内，最终便会孕育出一颗美丽的珍珠。"
 porcelain:0 "瓷器"
 porcelainDESC:0 "一种在极高温度的窑中烧制的特种陶瓷，瓷器常施以釉彩，饰以风格化的图案——与制造的较简朴陶器形成鲜明对比。"
 precious_metals:0 "贵金属"
 precious_metalsDESC:0 "自从硬币开始铸造以来，黄金和白银一直被认为是相对价值的衡量标准。黄金作为一种商品的历史与其在宗教和神话意象中的使用密切相关。"
 province_improvement_warm_period:0 "暖期"
 puntic_religion:0 "瓦格教"
 rice:0 "稻米"
 riceDESC:0 "稻米常生长在精心耕作的梯田中，是一种淀粉质谷物，是许多东方美食的基础。"
 roman_pantheon:0 "意大利多神教"
 salt:0 "盐"
 saltDESC:0 "作为一种食品添加剂兼保鲜剂，盐的需求量如此之大，以至于它经常作为一种平行货币。"
 septuaginta_translation:0 "七十士译本"
 septuaginta_translation_desc:0 "由聚集起来的学者们专门为编纂此文本而翻译。"
 shamanism:0 "扎尔莫克西斯信仰"
 silk:0 "丝绸"
 silkDESC:0 "丝绸的制作技术起源自遥远的东方，笼罩在一片神秘之中。这种异域的面料非常罕见，足以引起人们的极大兴趣，导致更为高昂的价格。"
 silphium:0 "罗盘草"
 silphiumDESC:0 "罗盘草是一种奇妙的植物，有着广泛的用途；无论是医生为治疗各种疾病所开出的特殊粉末，还是为挑剔的美食家喷洒和品尝的食物调味料，抑或是孕妇仅仅为了其避孕特性而摄入，罗盘草天然稀缺，但许多人都渴望得到它。"
 spices:0 "香料"
 spicesDESC:0 "作为香料贸易组成部分的许多药草主要用于食品添加剂，其价格依据原产地而定。"
 steppe_horses:0 "草原马"
 steppe_horsesDESC:0 "草原上的马虽然比西方的马更小但更结实，更适合在草原的干旱地带生活。"
 steppes:0 "草原"
 steppes_desc:0 "一片无尽的草海，远远地延伸到地平线之外。"
 stone:0 "石料"
 stoneDESC:0 "尽管木材通常足以作为临时或廉价建筑的建筑材料，但只有石头才能造就优质市政建筑或持久防御堡垒中所需要的那种持久。"
 sugar:0 "糖"
 sugarDESC:0 "从甘蔗草中提炼出来的一种甜物质，大约在公元前500年传入印度。"
 tea:0 "茶叶"
 teaDESC:0 "这种芳香灌木的叶子通常被晒干后与沸水混合，制成一种提神饮品，既能驱散睡意，又能带来幸福安康之感。"
 techspread.2.a:0 "这只能是一件好事!"
 techspread.2.desc:0 "通过我们与#Y [SCOPE.sC('techtarget').GetName]#!的贸易联系，新思想已经传播到我们的人民中。"
 techspread.2.t:0 "思想传播"
 test.6.a:0 "[ROOT.GetCountry.GetPrimaryCulture.GetName]"
 tortoise_shell:0 "龟甲"
 tortoise_shellDESC:0 "龟甲因其独特的色泽而备受青睐，呈棕色和琥珀色，常被用来制作珠宝和其他珍贵物品，如乐器。"
 vaksh_religion:0 "瓦赫什信仰"
 vegetables:0 "蔬菜"
 vegetablesDESC:0 "坚果、种子、干豆和蔬菜是由世界各地的采集者和自给自足的农民收集的。"
 war_goal_horde_conquest:0 "部落征服"
 war_goal_horde_conquest_desc:0 "草原部落在战争中残酷地攻击他们的对手。任何被部落占领的省份都会立即陷入部落的控制之下。"
 war_goal_maurya_decline_wargoal:0 "孔雀王朝崩塌"
 war_goal_maurya_decline_wargoal_desc:0 "印度历史上最大的孔雀王朝正处于崩溃的边缘。现在宣战来瓜分这个曾经伟大的帝国将被证明是有利的。"
 war_goal_maurya_revival_wargoal:0 "孔雀王朝复兴"
 war_goal_maurya_revival_wargoal_desc:0 "曾经濒临崩溃的孔雀王朝正在再次崛起。向所有不守规矩的叛乱者宣战，让他们服从我们的统治。"
 wild_game:0 "野味"
 wild_gameDESC:0 "从人类早期历史开始，狩猎采集者已将野生动物视为主要的食物来源。好的肉通常很难买到，而且还会带来一场格外有利可图的交易。"
 wine:0 "酒"
 wineDESC:0 "葡萄酒产自葡萄、葡萄干和许多其他水果，在娱乐、宗教和文化活动方面有着无尽用途。葡萄酒贸易是地中海经济的重要组成部分。"
 woad:0 "靛青"
 woadDESC:0 "靛青以及其他各种简单染料都可以从某些野花的花瓣中提炼出来。许多文化都有传统的人体彩绘，以及用这些颜色创作的绘画肖像。"
 wonder_ay_khanum:0 "乌浒河的亚历山大里亚"
 wood:0 "木材"
 woodDESC:0 "优质木材广泛用于建筑和运输，并且在无森林地区的价格居高不下。"
 wootz_steel:0 "乌兹钢"
 wootz_steelDESC:0 "南印度的铁匠在数百年前创造了这种注碳钢合金，因其强度和耐久性而迅速备受珍视。一把乌兹钢制成的剑往往价值等重的黄金。"
 wrong_religion_loyalty:0 "错误的宗教"
 zoroaster:0 "琐罗亚斯德教"

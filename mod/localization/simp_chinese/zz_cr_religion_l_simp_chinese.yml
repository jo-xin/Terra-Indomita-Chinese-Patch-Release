l_simp_chinese:
 cr_treasure_ambrosial_rock_gadir:0 "琥珀色的岩石"
 cr_treasure_ambrosial_rock_gadir_desc:0 "很久以前，据说有一对浮动的岛屿在地中海的海面上徘徊。\n\n在其中一个岛上有一个非常奇怪的景象：一棵燃烧的橄榄树，没有被火焰吞噬。\n\n仔细一看，还发现了一个奇怪的景象：一只鹰栖息在燃烧的树顶上，一条蛇缠绕在树干上。显然，这两种动物都没有被火烧伤，它们也没有任何伤害对方的意愿。\n\n提利安人得到了梅尔卡特神的指示，在这些漂浮的岛屿上航行，梅尔卡特神教他们造船的艺术。经过漫长而危险的海上追逐，这些勇敢的水手们成功地追上了他们的猎物，登上了有燃烧的橄榄树的浮岛。然后，按照梅尔卡特神谕的命令，他们抓住了树顶上的老鹰，并将其献祭。\n\n这只鹰的牺牲结束了岛屿的漂泊，使它们落入海中，至今仍在那里。这标志着推罗城的建立。"
 cr_treasure_charioteer_of_motya:0 "摩提亚的战车手"
 cr_treasure_charioteer_of_motya_desc:0 "从莫提亚的废墟中发现的一个精致的雕像。它的来历尚不清楚；它可能描绘了一个富有的战车手、马戈尼德王朝的国王哈米尔卡一世，甚至是僭主格隆。"
 cr_treasure_golden_olive_tree_gadir:0 "琥珀色的橄榄树"
 cr_treasure_golden_olive_tree_gadir_desc:0 "很久以前，据说，#bold 梅尔卡特#!神教会了腓尼基人造船和航海的艺术。然后，他为他们设定了一个任务，即寻找在地中海上游荡的神话中的#bold 安布罗西尔岩石#!并向他进行宗教祭祀。\n\n在追上这些神奇的岩石后，勇敢的水手们看到了一个超凡脱俗的景象：一棵橄榄树被火焰吞噬，但却没有被它吞噬。仔细一看，发现了一个更奇怪的景象：一只鹰和一条蛇住在树上，既没有被火焰伤害，也没有相互伤害。\n\n这些动物的牺牲将把岩石绑在原地，使#bold 推罗城#!得以在其上建立。\n\n从那时起，一棵金色的橄榄树就装饰着梅尔卡特的每一座寺庙。"
 get_baalat:0 "巴阿拉特"
 get_kothar:0 "迦达"
 get_marqod:0 "玛廓"
 get_shapash:0 "沙帕什"
 get_yam:0 "亚姆"
 omen_cult_of_incubation:0 "梦境崇拜"
 omen_cult_of_incubation_desc:0 "我们的英雄和在我们之前生活的祖先并没有离开这个世界，而是在永恒的睡眠中休眠。\n\n当睡着的时候，似乎没有时间流逝。在这种情况下，时间一起流动，现在和过去在我们的梦中相遇。在这种情况下，我们可以与祖先沟通，寻求他们的指导，以处理我们目前的噩梦、创伤和疾病。"
 omen_cult_of_the_taulas:0 "陶拉斯的崇拜"
 omen_cult_of_the_taulas_desc:0 "陶拉斯是吉美尼斯群岛的宗教崇拜中心。它们的确切目的仍不为人知，尽管它们与半人马座一致，因此与医疗崇拜有关。它们也与月亮有关，表明它们可能是一种占星术日历。"
 omen_cult_of_the_wells:0 "井的崇拜"
 omen_cult_of_the_wells_desc:0 "水在我们的宗教中扮演着重要的角色。在我们的土地上建造了许多伟大的圣水井。"
 omen_mars_balearics:0 "祝福玛尔斯的巴利阿里人"
 omen_mars_balearics_desc:0 "玛尔斯-巴利阿里克斯是巴利阿里群岛的战神，被描绘成一个戴着头盔、手持长矛的裸体战士。"
 treasure_cr_skin_of_the_gorillae:0 "大猩猩的皮"
 treasure_cr_skin_of_the_gorillae_desc:0 "在汉诺沿着利比亚海岸的传奇航行中，他遇到了一个居住着多毛野人的岛屿，当地人称之为大猩猩。\n\n由于难以捕捉，更难以控制，他不得不采取杀死他们并盗取他们的皮。这些皮肤现在构成了他航行的一个骄傲的证明。"

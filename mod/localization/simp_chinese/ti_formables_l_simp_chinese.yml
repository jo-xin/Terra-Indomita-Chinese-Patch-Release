l_simp_chinese:
 HUNNIC_EMPIRE:0 "匈帝国"
 HUNNIC_EMPIRE_ADJECTIVE:0 "匈"
 MIA_ADJ:0 "苗"
 MIA_NAME:0 "三苗"
 NAN:0 "南越"
 NANYUE_ADJECTIVE:0 "南苑"
 NANYUE_NAME:0 "南越"
 NICKNAME_HUN:0 "匈人"
 RHAETIAN_ADJECTIVE:0 "雷蒂亚的"
 RHAETIA_NAME:0 "雷蒂亚"
 any_rhaetian_country_tt:0 "@trigger_no! 所有 #Y 雷蒂亚#! 国家均为我们的附庸，或者我们是唯一的 #Y 雷蒂亚#! 国家。"
 desc_restoration_of_miao:0 "所有苗族人再次统一。"
 form_hunnic_empire:0 "西方之灾"
 form_hunnic_empire_desc:0 "被击败且被驱逐，我们的民族被迫向西迁徙穿越草原寻找新的开始，一路击退挡路的敌人，步步逼近已知世界的边缘。然而，在穿越构成草原的无穷草海之后，我们遇到了一个陌生的世界，充满了肥沃的农田和文明，等待着被掠夺和征服，而守卫这些的不过是些弱小部落和行将崩溃的帝国。我们最精锐的战士策马奔腾，如贪婪的瘟疫般蜂拥穿过这些毫无防备的城市，粉碎任何可能遭遇到的软弱抵抗。从敌人的废墟之上，我们将锻造出一个支配西方世界的新帝国。"
 form_lu:0 "成立鲁"
 form_lu_desc:0 "作为最后的三桓，我们有权利夺取鲁国大位。正如鲁国的统治者在对待其他两个三桓支系时毫不留情一样，我们也不应放过那些腐败堕落的统治者。"
 form_miao:0 "成立三苗"
 form_miao_desc:0 "据说所有苗族人都源自传说中的九黎部落，但他们在战斗中被大禹击败，从而被不断扩张的越人驱散。其余人则被中原地区的华夏人所征服。\n\n现在是时候扭转这一局面，再度统一所有苗族人了。"
 form_nanyue:0 "成立南越"
 form_nanyue_desc:0 "有许多南方的越人部落聚居在海岸边，然而由于他们的财富日益增长，他们不断被中原帝国觊觎，后者只将他们视为附庸。是时候将他们团结起来，领导他们对抗这些外来者了。"
 form_rhaetia:0 "统一雷蒂亚"
 form_rhaetia_desc:0 "雷蒂亚人是与我们共享许多特质的阿尔卑斯族群。拥有一位强有力的领袖来团结他们抵御外敌对我们继续生存至关重要。"
 formable_hunnic_empire_capital:0 "我们的首都必须位于欧洲（乌拉尔山脉以西）。"
 formable_hunnic_empire_modifier:0 "西方之灾"
 formable_not_hunnic_empire_exists:0 "匈人帝国必须不存在！"
 formable_not_rhaetia_exists:0 "#Y 雷蒂亚#! 必须不存在。"
 restoration_of_miao:0 "三苗复国"
 switch_characters_to_hunnic_culture:0 "我国所有主流文化的人物将采用匈奴文化"
 switch_to_hunnic_culture:0 "我国所有主流文化的人口将采用匈奴文化"
 ti_nation_formation_events.1.a:0 "让我们完全恢复晋国。"
 ti_nation_formation_events.1.b:0 "我们可以自立。"
 ti_nation_formation_events.1.desc:0 "数代之前，晋国的土地被韩、赵、魏三家瓜分；这是我国历史上划时代的时刻，有些人认为这本不该发生。但如今，过去的过失已得到弥补，晋国已由我们亲手重新拼合；唯一剩下要做的就是宣布这一周文化支柱的辉煌重生。"
 ti_nation_formation_events.1.t:0 "统一晋国"
 ti_nation_formation_events.2.a:0 "让我们宣称鲁国的传承。"
 ti_nation_formation_events.2.b:0 "我们自身已足够强大。"
 ti_nation_formation_events.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName]终于成功推翻了最后一个 #E 鲁#! 国，为[ROOT.GetCountry.GetRuler.GetHerHis]王国带来了荣耀与威望。\n\n不仅是敌人被废黜，在我们自己的疆域内，将领和总督们也已将他们的支持投向[ROOT.GetCountry.GetRuler.GetFirstName]。效忠誓言已被宣誓，[GetCountry('BII').GetName)]境内及海外的所有人都确信，[ROOT.GetCountry.GetRuler.GetFirstName]是[GetCountry('LUU').GetName)]的合法继承人。"
 ti_nation_formation_events.2.t:0 "推翻鲁国主支"
 unite_zhou:0 "统一周室"
 unite_zhou_desc:0 "经过与同样弱小残存的周朝割据领地长期争战之后，它们所有的领土都已被我们征服。因此，是时候宣告我们作为周朝新宗主的地位了。"

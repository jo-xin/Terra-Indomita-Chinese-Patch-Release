l_simp_chinese:
 l6_christian.1.a:0 "醉鬼的胡言乱语！"
 l6_christian.1.desc:0 "据说，一小群加利利人一直在耶路撒冷周边制造麻烦。有些人声称，这些农村渔民不知何故能够说帕提亚人、米底人、埃兰人、美索不达米亚人、犹大人、卡帕多西亚人、本都人、弗里吉亚人、潘菲利亚人、埃及人、利比亚人、罗马人、克里特人和阿拉伯人的语言。无论如何，他们的话一定引起了共鸣，显然他们已经有了3000的人数。"
 l6_christian.1.t:0 "3000人皈依"
 l6_christian.2.a:0 "这改变不了什么"
 l6_christian.2.desc:0 "据说，一位以其热心信念和宣扬受难违逆的犹太教新教派而闻名的犹太男子为该教派获得了一种热情的信念。从我们收集到的信息来看，这名男子和他的同伴声称看到了某种异象，这名男子甚至进一步说，他与他所受难的人交谈。"
 l6_christian.2.t:0 "前往大马士革之路"
 l6_christian.3.a:0 "而且它将一直如此"
 l6_christian.3.desc:0 "我们的一些臣民已经开始谈论一位死而复生的上帝。这当然说服了一些人，但现在该流言只是局部流传。"
 l6_christian.3.t:0 "崛起上帝的信徒"
 l6_christian.4.a:0 "古怪"
 l6_christian.4.desc:0 "在我们的土地上，一些犹太人已经开始认为他们预言中的弥赛亚已经来到这片大地，他是唯一的救赎之路。"
 l6_christian.4.t:0 "犹太人皈依者"
 l6_christian.5.a:0 "他们非常大胆"
 l6_christian.5.desc:0 "被他们称之为基督的信徒在谈及自己的信仰时变得更加坦率。虽然这导致他们中的许多人被避开，但我们更多的臣民似乎在听信他们所说的话。"
 l6_christian.5.t:0 "在我们的土地上传播福音"
 l6_convert_to_christian:0 "皈依基督教"
 l6_convert_to_christian_desc:0 "占位决议。人工智能不会采纳，除非其首都已经皈依基督教。"

l_simp_chinese:
 OLS:0 "阿利斯乌波"
 OLS_ADJ:0 "阿利西安"
 OLZ:0 "卡西特罗斯"
 OLZ_ADJ:0 "卡西特里安"
 alis_ubbo_carthage_opinion_tt:0 "[GetCountry('CAR').GetName] 对 [GetCountry('OLS').GetName] 的看法应超过 #G 60#!。"
 alis_ubbo_carthage_relations_opinion:0 "贸易关系"
 alis_ubbo_carthage_relations_tt:0 "发送 [GetCountry('CAR').GetName] #G 60#! 以改善投资。"
 alis_ubbo_diplomatic_range_modifier:0 "鼓励的贸易政策"
 alis_ubbo_events.1.a:0 "我们必须保护 [GetCountry('OLS').GetPrimaryCulture.GetName] 的利益。拒绝他们。"
 alis_ubbo_events.1.b:0 "胡说，让他们留下吧。"
 alis_ubbo_events.1.desc:0 "来自 [GetProvince('(int32)1420').GetArea.GetName] 的一个小部落由于与其他部落的持续敌对行为，请求在 [GetCountry('OLS').GetName] 寻求庇护。如果我们允许他们在 [GetCountry('OLS').GetCapital.GetName] 定居，将会导致我们 [GetCountry('OLS').GetPrimaryCulture] 人口的不满。"
 alis_ubbo_events.1.t:0 "部落寻求庇护"
 alis_ubbo_events.2.a:0 "忽视抱怨"
 alis_ubbo_events.2.b:0 "确保体面的工作条件"
 alis_ubbo_events.2.desc:0 "[GetProvince('(int32)1317').GetName] 拥有一个繁荣的矿业部门，随着时间的推移吸引了越来越多的矿工。然而，这种快速增长使许多人只拥有不怎么理想的工作条件。"
 alis_ubbo_events.2.t:0 "开采条件"
 alis_ubbo_events.3.a:0 "可笑！他们怎么敢？！"
 alis_ubbo_events.3.b:0 "贵族们喜欢贿赂，不是吗？"
 alis_ubbo_events.3.desc:0 "富有的商人对任何国家来说都是一个巨大的恩惠，但他们昂贵的习惯和强烈的观点让他们很难取悦。有传言说有权势的金属商人开始质疑我们统治的合法性。"
 alis_ubbo_events.3.t:0 "正统争议"
 alis_ubbo_events.4.a:0 "我们不会被贿赂。尤其不是被 [SCOPE.sChar('alis_ubbo_briber').GetPraenomen]！"
 alis_ubbo_events.4.b:0 "没人需要知道……"
 alis_ubbo_events.4.desc:0 "[SCOPE.sChar('alis_ubbo_briber').GetPraenomen]，[GetCountry('OLS').GetName]中的一位有影响力的商人，为了稍微减少他在阿利兹·奥庞新港的货物进口税，提出了一小笔捐赠给[ROOT.GetCountry.GetRuler.GetName]。"
 alis_ubbo_events.4.t:0 "奥利西波进口税"
 alis_ubbo_events.5.a:0 "这可能是个坏主意，但我们会让犯人留下。"
 alis_ubbo_events.5.b:0 "逮捕他。与 [GetCountry('SFI').GetName] 保持良好关系更有利。"
 alis_ubbo_events.5.desc:0 "[GetCountry('SFI').GetRulerTitle] [GetCountry('SFI').GetRuler.GetPraenomen] 的 [GetCountry('SFI').GetName] 已经通知我们的官员，一名臭名昭著的 [GetCountry('SFI').GetAdjective] 犯罪分子已经逃到 [GetCountry('OLS').GetName]。这名犯罪分子正在接受严重犯罪行为的调查。犯罪分子提出了一笔可观的贿赂以留在 [GetCountry('OLS').GetName]，但如果我们允许他留下，将来与 [GetCountry('SFI').GetName] 的贸易和任务将会受阻。"
 alis_ubbo_events.5.t:0 "犯罪的决定"
 alis_ubbo_events.6.a:0 "好吧。给他们钱。"
 alis_ubbo_events.6.b:0 "我们有重要的事需要花钱。"
 alis_ubbo_events.6.desc:0 "[GetCountry('SFI').GetRulerTitle] [GetCountry('SFI').GetRuler.GetPraenomen] 的 [GetCountry('SFI').GetName] 已派使者到我们的首都 [GetCountry('OLS').GetCapital.GetName] 请求财政援助。他们将使用这笔钱来缓解正在肆虐 [GetCountry('SFI').GetName] 的严重饥荒。如果不提供帮助，可能会损害关系并阻碍未来与 [GetCountry('SFI').GetName] 的任务。"
 alis_ubbo_events.6.t:0 "经济援助"
 alis_ubbo_food_help_modifier:0 "瑟腓亚食物援助"
 alis_ubbo_gadir_opinion_tt:0 "[GetCountry('GAD').GetName] 对 [GetCountry('OLS').GetName] 的看法应超过 #G 40#!。"
 alis_ubbo_gadir_relations_opinion:0 "贸易关系"
 alis_ubbo_gadir_relations_tt:0 "发送 [GetCountry('GAD').GetName] #G 40#! 以改善投资。"
 alis_ubbo_helped_feed_opinion:0 "提供救济"
 alis_ubbo_improved_relations_opinion:0 "良好关系"
 alis_ubbo_intro.1.a:0 "释放城市"
 alis_ubbo_intro.1.b:0 "切换到阿利兹·奥庞"
 alis_ubbo_intro.1.desc:0 "贸易城市阿利兹·奥庞(Alis Ubbo)在腓尼基语中意为“宜人的港湾”，坐落在塔霍河河口的一个大盆地上。这使得它成为腓尼基人沿着西海岸进行贸易航行的船只卸货和补给的理想地点，其中一些甚至远至传说中的锡岛。该定居点已成为一个重要的商业贸易中心，在这里，贵重金属、咸鱼和盐与该地区的内陆部落进行交易。"
 alis_ubbo_intro.1.t:0 "阿利兹·奥庞"
 alis_ubbo_intro_01_release_as_subject_tt:0 "释放#Y 阿利兹·奥庞#!作为#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的#Y 藩属#!"
 alis_ubbo_missions_events.1.a:0 "这会让人民高兴的"
 alis_ubbo_missions_events.1.at:0 "$mission_task_completed_tt_1$加利西亚宝藏$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.1.desc:0 "一尊大型青铜加利西亚战士雕像已被运回 [ROOT.GetCountry.GetCapital.GetName] 作为我们扩张进入 [GetProvince('(int32)1136').GetArea.GetRegion.GetName] 并控制其贵重金属贸易的庆祝。"
 alis_ubbo_missions_events.1.t:0 "青铜加利西亚战士"
 alis_ubbo_missions_events.2.a:0 "是时候通知征兵了"
 alis_ubbo_missions_events.2.at:0 "$mission_task_completed_tt_1$伊比利亚的金属矿山$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.2.desc:0 "我们现在在[GetProvince('(int32)1319').GetArea.GetRegion.GetName]拥有丰富的金属资源的宣称。对[GetProvince('(int32)1319').GetArea.GetRegion.GetName]的征服将极大地扩大我们在该地区的影响力。"
 alis_ubbo_missions_events.2.t:0 "对金属矿山的宣称"
 alis_ubbo_missions_events.3.a:0 "真是个奇迹之城！"
 alis_ubbo_missions_events.3.at:0 "$mission_task_completed_tt_1$大西洋的首都$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.3.desc:0 "由于我们努力扩展我们的贸易网络，腓尼基商人正蜂拥而至 [GetCountry('OLS').GetName]。新的商船和军舰的稳定流动使 [ROOT.GetCountry.GetCapital.GetName] 成为大西洋上一个繁忙的枢纽。从日出到日落之后，港口充满活力，市民、商人、水手和码头上其他不那么正经的居民在进行他们的贸易。"
 alis_ubbo_missions_events.3.t:0 "大西洋的首都"
 alis_ubbo_missions_events.4.a:0 "一个便利的位置"
 alis_ubbo_missions_events.4.at:0 "$mission_task_completed_tt_1$殖民野心$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.4.desc:0 "我们新的殖民地 [GetCountry('OLZ').GetName] 已正式创建。来自 [GetCountry('OLS').GetName] 的商人和商贩已向北迁移，寻找他们的财富。殖民地为我们提供了进一步扩张海外的立足点。"
 alis_ubbo_missions_events.4.t:0 "殖民野心"
 alis_ubbo_missions_events.5.a:0 "一项值得的投资！"
 alis_ubbo_missions_events.5.at:0 "$mission_task_completed_tt_1$迦太基的机会$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.5.desc:0 "看来我们为提高在 [GetCountry('CAR').GetName] 的地位而留出的资金，偶尔还用来贿赂经过的迦太基商人，终于开始见效了。一大群腓尼基商人已经在 [ROOT.GetCountry.GetCapital.GetName] 定居下来，为该地区带来了财富和新的思想。"
 alis_ubbo_missions_events.5.t:0 "迦太基的机会"
 alis_ubbo_missions_events.6.a:0 "世界渴望之城!"
 alis_ubbo_missions_events.6.at:0 "$mission_task_completed_tt_1$繁荣的大西洋港口$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.6.desc:0 "我们因通过海格力斯之柱的贸易路线而变得富有。我们的首都 [ROOT.GetCountry.GetCapital.GetName] 享有许多好处，并且见证了新居民和商人的涌入。"
 alis_ubbo_missions_events.6.t:0 "商人的涌入"
 alis_ubbo_missions_events.7.a:0 "终于为 [ROOT.GetCountry.GetCapital.GetName] 建立了一个港口！"
 alis_ubbo_missions_events.7.at:0 "$mission_task_completed_tt_1$奥利西波港$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.7.desc:0 "这个新港口的造船厂和泊位是一个奇迹，并确立了[GetCountry('OLS').GetName]成为一个重要的海上强国。我们终于可以进入地中海的大市场了。"
 alis_ubbo_missions_events.7.t:0 "奥利西波港"
 alis_ubbo_missions_events.8.a:0 "理所应当。"
 alis_ubbo_missions_events.8.at:0 "$mission_task_completed_tt_1$锡岛$mission_task_completed_tt_2$"
 alis_ubbo_missions_events.8.desc:0 "我们沿西大西洋的前进势不可挡。随着我们最近征服的锡岛，我们对大西洋金属贸易的控制无与伦比。"
 alis_ubbo_missions_events.8.t:0 "锡岛"
 alis_ubbo_missions_iberia:0 "宜人的港湾"
 alis_ubbo_missions_iberia_BUTTON_TOOLTIP:0 "控制沿西大西洋海岸的贵重金属贸易。"
 alis_ubbo_missions_iberia_CRITERIA_DESCRIPTION:0 "当我们继续控制西大西洋沿岸的贵重金属贸易时，这一使命就被认为完成了。"
 alis_ubbo_missions_iberia_DESCRIPTION:0 "自古以来，腓尼基人和布匿人就擅长跨海旅行、贸易和定居。数百年前，他们在 [GetCountry('OLS').GetName] 的首府 [GetCountry('OLS').GetCapital.GetName] 创建了一个小型贸易前哨，希望与当地部落进行稀有金属贸易。尽管咸鱼、盐和金属出口为[GetCountry('OLS').GetName]提供了稳定的经济，但伊比利亚的富饶土地仍正在等待一个强大的贸易帝国来控制他们许多有价值的金属矿。"
 alis_ubbo_missions_iberia_province_investments_0:0 "奥利西波港"
 alis_ubbo_missions_iberia_province_investments_0.tt:0 "[GetCountry('OLS').GetCapital.GetName] 的港口得到了升级。"
 alis_ubbo_missions_iberia_province_investments_0_DESC:0 "随着人们对利润丰厚的金属贸易的新关注，在 [GetCountry('OLS').GetCapital.GetName] 建立一个更大的港口的需求变得越来越迫切。"
 alis_ubbo_missions_iberia_province_investments_1:0 "大西洋的首都"
 alis_ubbo_missions_iberia_province_investments_1_DESC:0 "如果我们要控制该地区的贸易，[GetCountry('OLS').GetCapital.GetName]需要成为一个配得上我们野心的城市。"
 alis_ubbo_missions_iberia_province_investments_2:0 "腓尼基同盟"
 alis_ubbo_missions_iberia_province_investments_2_DESC:0 "派遣使节会见我们在伊比利亚南部最亲近的腓尼基邻居的代表。"
 alis_ubbo_missions_iberia_province_investments_3:0 "迦太基的事务"
 alis_ubbo_missions_iberia_province_investments_3_DESC:0 "向潜在的朋友和贸易伙伴赠送礼物被认为是良好的政治家风度。我们应该改善与 [GetCountry('CAR').GetName] 的关系。"
 alis_ubbo_missions_iberia_province_investments_4:0 "伽狄耳投资"
 alis_ubbo_missions_iberia_province_investments_4_DESC:0 "我们将投资与我们的腓尼基邻居 [GetCountry('GAD').GetName] 的贸易机会。"
 alis_ubbo_missions_iberia_province_investments_5:0 "迦太基的机会"
 alis_ubbo_missions_iberia_province_investments_5_DESC:0 "向 [GetCountry('CAR').GetName] 的人们展示 [GetCountry('OLS').GetName] 正在蓬勃发展，投资机会不断涌现。"
 alis_ubbo_missions_iberia_province_investments_6:0 "繁荣的大西洋港口"
 alis_ubbo_missions_iberia_province_investments_6_DESC:0 "新的商船和军舰的稳定流动使 [GetCountry('OLS').GetCapital.GetName] 的港口成为一个繁忙的中心。"
 alis_ubbo_missions_tin_trade_0:0 "伊比利亚的金属矿山"
 alis_ubbo_missions_tin_trade_0_DESC:0 "伊比利亚半岛富含金、银和其他金属。我们应首先着手扩展到 [GetProvince('(int32)1319').GetArea.GetRegion.GetName] 的丰富金属资源中。"
 alis_ubbo_missions_tin_trade_1:0 "俄庇达尼亚金属"
 alis_ubbo_missions_tin_trade_1_DESC:0 "在 [GetProvince('(int32)1317').GetArea.GetName] 确保金属过剩将有助于建立我们的贸易帝国。"
 alis_ubbo_missions_tin_trade_2:0 "黄金野心"
 alis_ubbo_missions_tin_trade_2_DESC:0 "控制 [GetProvince('(int32)1301').GetArea.GetName] 的丰富矿藏将为我们的战争提供所需的财富，并建立必要的基础设施以确保我们在这些新征服的土地上的统治。"
 alis_ubbo_missions_tin_trade_3:0 "北部矿山"
 alis_ubbo_missions_tin_trade_3_DESC:0 "控制 [GetProvince('(int32)1136').GetArea.GetName] 的金属矿产是主导大伊比利亚金属贸易的下一步。我们将派遣代表到 [GetProvince('(int32)1136').GetArea.GetName] 开始伪造宣称。"
 alis_ubbo_missions_tin_trade_4:0 "加利西亚的财富"
 alis_ubbo_missions_tin_trade_4_DESC:0 "来自 [GetProvince('(int32)1136').GetArea.GetRegion.GetName] 的商人经常带回超乎想象的财富，无论是白银、黄金还是其他有价值的矿物。我们应该获得这些矿山的所有权。"
 alis_ubbo_missions_tin_trade_4b:0 "一个意料之外的提案"
 alis_ubbo_missions_tin_trade_4b_DESC:0 "[GetProvince('(int32)2152').GetOwner.Custom('get_base_government_type')] 的 [GetProvince('(int32)2152').GetOwner.GetName] 已经向我们提供了 [GetProvince('(int32)2152').GetName] 的沿海定居点，只需支付一小笔费用。我们的顾问建议我们在那里创建一个新的腓尼基殖民地。"
 alis_ubbo_missions_tin_trade_4b_tt:0 "[GetProvince('(int32)2152').GetOwner.GetName] 将以一小笔费用将 [GetProvince('(int32)2152').GetName] 出售给 [GetCountry('OLS').GetName]。"
 alis_ubbo_missions_tin_trade_4c:0 "加利西亚的宝藏"
 alis_ubbo_missions_tin_trade_4c_DESC:0 "来自 [GetProvince('(int32)1136').GetArea.GetRegion.GetName] 的宝藏将给我们的人民带来幸福，并可能进一步提高 [GetCountry('OLS').GetRuler.GetPraenomen] 的人气。"
 alis_ubbo_missions_tin_trade_4c_tt:0 "发现宝藏。"
 alis_ubbo_missions_tin_trade_5:0 "卡西特罗斯殖民地"
 alis_ubbo_missions_tin_trade_5_DESC:0 "[GetProvince('(int32)2152').GetName] 是建立一个殖民地的绝佳位置。"
 alis_ubbo_missions_tin_trade_5_tt:0 "[GetProvince('(int32)2152').GetName] 成为 [GetCountry('OLS').GetName] 的殖民地。"
 alis_ubbo_missions_tin_trade_6:0 "锡岛"
 alis_ubbo_missions_tin_trade_6_DESC:0 "腓尼基人几百年前就发现了 [GetProvince('(int32)2002').GetArea.GetRegion.GetName] 的锡矿床。通过在该岛上获得立足点，我们将能够控制金属贸易。"
 alis_ubbo_missions_tin_trade_6_tt:0 "从 [GetProvince('(int32)2002').GetArea.GetRegion.GetName] 的一个省份出口2个或更多的 #Y 基础金属#! @base_metals!。"
 alis_ubbo_missions_tribes_1:0 "塔霍河对岸"
 alis_ubbo_missions_tribes_1_DESC:0 "我们与 [GetCountry('SFI').GetPrimaryCulture.GetName] [GetCountry('SFI').Custom('get_base_government_type')] 的 [GetCountry('SFI').GetName] 有着长期而有价值的贸易关系。我们应该在他们的首都 [GetCountry('SFI').GetCapital.GetName] 建立一个大使馆。"
 alis_ubbo_missions_tribes_1_tt:0 "未来与 [GetCountry('SFI').GetName] 的任务将被 #Y 阻止#!"
 alis_ubbo_missions_tribes_2:0 "代表到来"
 alis_ubbo_missions_tribes_2_DESC:0 "[GetCountry('SFI').GetName]的[GetCountry('SFI').GetRulerTitle][GetCountry('SFI').GetRuler.GetPraenomen]代表已抵达我们的新大使馆，声称正在发生严重的饥荒蹂躏他们的国家，我们应该运来食物来帮助缓解 [GetCountry('SFI').GetName] 的饥饿。"
 alis_ubbo_missions_tribes_2_tt:0 "我们的首都 [GetCountry('OLS').GetCapital.GetName] 至少有 #Y 80#! 食物。"
 alis_ubbo_missions_tribes_3:0 "伊比利亚冲突"
 alis_ubbo_missions_tribes_3_DESC:0 "与伊比利亚部落持续的冲突后，[GetCountry('SFI').GetRulerTitle] [GetCountry('SFI').GetRuler.GetPraenomen] 的 [GetCountry('SFI').GetName] 已经提议成为我们的部落附庸。这将使 [GetCountry('OLS').GetName] 获得 [GetCountry('SFI').GetName] 的每月人力收入的一部分，而他们将获得我们的保护。"
 alis_ubbo_money_aid_opinion:0 "提供援助"
 alis_ubbo_port_built_modifier:0 "热情的商人"
 alis_ubbo_port_complete_modifier:0 "繁荣的贸易港"
 alis_ubbo_resource_modifier:0 "贸易之都"
 alis_ubbo_sefia_angry_modifier:0 "瑟腓亚减少贸易 "
 alis_ubbo_sefia_criminal_opinion:0 "已逮捕罪犯"
 alis_ubbo_sefia_start_opinion:0 "贸易关系"
 alis_ubbo_temp_modifier:0 "经济制裁"
 alis_ubbo_trade_complete_modifier:0 "西大西洋贸易帝国"
 alis_ubbo_tribe_asylum_modifier:0 "允许部落定居"
 alis_ubbo_tribe_trade_opinion:0 "贸易关系"
 allis_ubbo_heritage:0 "避风港的传承"
 allis_ubbo_heritage_desc:0 "被誉为腓尼基商人希望访问的友好城市的'安全避风港'，一个会保护他们的船只免受在半岛内部徘徊的威胁性凯尔特和伊比利亚部落的港口城市阿利兹·奥庞，坐拥大西洋的壮丽景色。"
 carthage_switch_allis_ubbo:0 "关于阿利斯乌波"
 carthage_switch_allis_ubbo_desc:0 "我们将抛弃故土中那些颓废的城市，扬帆前往伊比利亚远方的阿利斯乌波港。那是大西洋上的安全避风港，在伊比利亚和凯尔特部落的舒适陪伴下，我们可以在那里开启一条#G 新任务#!。\n\n将#Y 阿利斯乌波#!释放为#G 藩属#!，或#T 切换国家#!游玩#Y 阿利斯乌波#!。"
 treasure_bronze_gallaecian_warrior:0 "青铜加利西亚战士"
 treasure_bronze_gallaecian_warrior_desc:0 "一尊大型青铜加利西亚战士雕像"

 desc_cr_aelymas_numidian_trade:0 "由于我们与努米底亚部落的关系，这个港口正在蓬勃发展。"
 desc_cr_altars_of_the_philaeni:0 "长期以来，昔兰尼的希腊人和迦太基人之间一直在为控制叙尔提斯的贸易而争论不休。为了解决这一争端，双方决定在某一天从各自的城市派出使者，他们相遇的地方应被视为两个民族的共同边界。因此，从迦太基派出了两兄弟，他们被称为菲莱，他们匆匆忙忙地完成了他们的旅程。来自昔兰尼的人走得更谨慎。\n\n现在，当昔兰尼人意识到他们有些迟了，并担心他们回来后会受到惩罚，他们指责迦太基人提前离家，并拒绝遵守协议。当迦太基人宣称其他条件，只要这些条件是公平的，希腊人让他们选择，要么在他们声称是他们国家边界的地方被活埋，要么在同样的条件下允许希腊人按他们的意愿前进。菲莱兄弟受了这些条件，为他们的国家献出了生命；他们被活埋了。迦太基人在该地为菲莱兄弟设立了祭坛，并在国内为他们设立了其他荣誉。"
 desc_cr_bog_iron:0 "当含铁的地下水从地下涌出，在水中氧化或被细菌浓缩时，就会形成沼泽铁。\n\n本省有丰富的沼泽铁资源。"
 desc_cr_carthage_elephant_pens:0 "迦太基的城墙底部厚达10米，提供了充足的空间，甚至可以容纳最大的生物：大象。建成后，城墙上的象栏足以容纳和训练200多头大象用于城市的防御。"
 desc_cr_carthage_elephant_pens_national:0 "迦太基的城墙底部厚达10米，提供了充足的空间来容纳最大的生物：大象。建成后，城墙上的象栏足以容纳和训练200多头大象，用于城市的防御。"
 desc_cr_carthage_megara:0 "迦太基的正北方是枝繁叶茂的麦加拉郊区。在横跨地峡的巨大城墙的保护下，这个郊区是城市精英们最喜欢的住所，也是城市新鲜产品的重要来源。"
 desc_cr_carthage_mideni_stand_alone:0 "这是你的葬礼。"
 desc_cr_carthage_the_diplomatic_initiative:0 "我们正在进行外交行动以加强我们的地位。"
 desc_cr_carthage_vaga_citadel:0 "瓦加是迦太基人为确保对巴格拉达斯河谷的控制而建立的一座柏柏尔古城。"
 desc_cr_carthage_walls_of_carthage:0 "在连接迦太基和大陆的地峡上建有三道防御工事，从沟渠和栅栏到10米厚、15米高的墙。由于这是进入该城的唯一途径，这些城墙是任何可能征服迦太基的人必须克服的主要障碍。"
 desc_cr_carthage_walls_of_carthage_national:0 "我只是在游戏初期来帮助你的。"
 desc_cr_carthage_walls_of_syracuse:0 "叙拉古的城墙据说是坚不可摧的，最早是由僭主狄奥尼修斯建造的，后来由阿加索克勒斯进行了改进。这些城墙沿着埃皮波莱高原的天然高地而建，不仅给守军带来了城墙本身的高地优势，还带来了城墙所处的陡峭的岩石悬崖。"
 desc_cr_carthage_war_drills:0 "军队已经进入了警戒状态。"
 desc_cr_carthage_war_elephants_for_carthage:0 "这个省有丰富的非洲大象，可以进行战争训练。"
 desc_cr_charax:0 "哈拉克斯是一个秘密的地方，是商人和走私者喜欢的聚会场所，他们打算打破昔兰尼加对罗盘草的垄断，罗盘草是一种有效的、非常有价值的药草。"
 desc_cr_choma:0 "沿着这个城市的海滨修建了一个码头，大大增加了可以在这里交易的船只数量。"

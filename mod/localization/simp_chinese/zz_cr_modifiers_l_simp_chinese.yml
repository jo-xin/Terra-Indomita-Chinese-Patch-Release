 desc_cr_numidia_medracen:0 "梅德拉肯是传说中的国王Madghis的坟墓，根据传说，他是北非许多柏柏尔部落的祖先。\n\n该纪念碑由一个巨大的圆锥形结构组成，直径近60米，顶部有一个20米高的鼓。建筑物上有丰富的埃及模子和多立克柱装饰，显示出埃及、布匿和希腊的影响的融合。西边是一个候见厅，可能是用于殡葬的，而东边是一个长方形的前庭，通往一个假门。真正的入口被锥体第三级台阶上的一个石制门闩所隐藏。它通向一个小的墓室，用丰富的雪松门和木制品装饰，骨灰和随葬品就存放在那里。"
 desc_cr_rich_vein_of_silver:0 "这个地方有一个丰富的银矿脉。"
 desc_cr_secured_homeland:0 "我们已经采取了必要的措施来根除动乱，确保我们的家园。"
 desc_cr_silphium_trade:0 "我们的商人已经成功地打入了罗盘草贸易，为城市带来了巨大的财富。"

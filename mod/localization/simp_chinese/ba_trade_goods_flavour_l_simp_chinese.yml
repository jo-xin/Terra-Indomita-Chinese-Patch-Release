 trade_goods_flavour.46.desc_3:0 "胜利了！我的[ROOT.GetCountry.GetRulerTitle]!从追踪动物到结束它的生命，众神一直站在我们这边。这次狩猎没有发生意外，只有几个参与者受了轻伤。这是伟大而令人振奋的一天!"
 trade_goods_flavour.46.t:0 "猎野猪"
 trade_goods_flavour.47.a:0 "追踪这个动物！"
 trade_goods_flavour.47.b:0 "它太危险了。"
 trade_goods_flavour.47.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的几天内，有人看到一只熊，适合进行盛大的狩猎。猎杀这样一只宏伟的动物，肯定是皇室壮观和力量的有力展示。\n只有最强壮和最精明的猎人才能猎杀这样的动物而不受伤--[ROOT.GetCountry.GetRuler.GetName]是其中之一吗？"
 trade_goods_flavour.47.t:0 "猎熊"
 trade_goods_flavour.48.a:0 "这都是[ROOT.GetCountry.GetAdjective]生活的一部分...。"
 trade_goods_flavour.48.b:0 "这是个正确的决定。"
 trade_goods_flavour.48.desc_1:0 "灾难！[ROOT.GetCountry.GetRuler.GetName] 勇敢地与这只动物搏斗，但当动物被追踪到时，很明显它的强大超出了我们所有猎人的能力，几乎没有人能活着逃脱。我们的 [ROOT.GetCountry.GetRulerTitle] 将会被以最高的荣誉安葬。"
 trade_goods_flavour.48.desc_2:0 "追踪猎物很容易，但一旦找到，它并不像许多人想象的那样容易猎杀，反而给猎人们造成了许多伤害。幸运的是，没有人死亡，[ROOT.GetCountry.GetRuler.GetName] 可以宣称战胜了这头野兽，但这些伤痕是否值得这场狩猎呢？"
 trade_goods_flavour.48.desc_3:0 "胜利了！我的[ROOT.GetCountry.GetRulerTitle]!从追踪动物到结束它的生命，众神一直站在我们这边。这次狩猎没有发生意外，只有几个参与者受了轻伤。这是伟大而令人振奋的一天!"
 trade_goods_flavour.48.t:0 "猎熊"
 trade_goods_flavour.49.a:0 "追踪这个动物！"
 trade_goods_flavour.49.b:0 "它太危险了。"
 trade_goods_flavour.49.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的几天内看到了一头狮子，适合进行盛大的狩猎。这肯定会是一个强大的皇家宏伟和力量的展示，把这样一个动物之王的宏伟的动物标本拿下。\n只有最强壮和最精明的猎人才能在遇到这种动物时幸存下来--[ROOT.GetCountry.GetRuler.GetName]是其中之一吗？"
 trade_goods_flavour.49.t:0 "狩猎狮子"
 trade_goods_flavour.5.a:0 "有趣..."
 trade_goods_flavour.5.b:0 "真是浪费时间和金钱......。"
 trade_goods_flavour.5.desc:0 "在严酷的[ROOT.GetCountry.GetAdjective]太阳下辛勤工作了几个星期后，我们的工人宣布他们发现了一个宏伟的野兽的整个骨架--也许是一位逝去神灵的骨头？我们中最睿智的人也对这一发现感到困惑，并羞涩地承认他们不知道我们所看到的是什么。\n\n虽然不像发现贵重金属那样令人兴奋，但这仍是一个有趣的时刻。"
 trade_goods_flavour.5.t:0 "大骨头的挖掘结果"
 trade_goods_flavour.50.a:0 "这都是[ROOT.GetCountry.GetAdjective]生活的一部分...。"
 trade_goods_flavour.50.b:0 "这是个正确的决定。"
 trade_goods_flavour.50.desc_1:0 "灾难！[ROOT.GetCountry.GetRuler.GetName] 勇敢地与这只动物搏斗，但当动物被追踪到时，很明显它的强大超出了我们所有猎人的能力，几乎没有人能活着逃脱。我们的 [ROOT.GetCountry.GetRulerTitle] 将会被以最高的荣誉安葬。"
 trade_goods_flavour.50.desc_2:0 "追踪猎物很容易，但一旦找到，它并不像许多人想象的那样容易猎杀，反而给猎人们造成了许多伤害。幸运的是，没有人死亡，[ROOT.GetCountry.GetRuler.GetName] 可以宣称战胜了这头野兽，但这些伤痕是否值得这场狩猎呢？"
 trade_goods_flavour.50.desc_3:0 "胜利了！我的[ROOT.GetCountry.GetRulerTitle]!从追踪动物到结束它的生命，众神一直站在我们这边。这次狩猎没有发生意外，只有几个参与者受了轻伤。这是伟大而令人振奋的一天!"
 trade_goods_flavour.50.t:0 "狩猎狮子"
 trade_goods_flavour.51.a:0 "战马。"
 trade_goods_flavour.51.b:0 "农场总是需要帮助。"
 trade_goods_flavour.51.c:0 "让养马人加入我们的宫廷。"
 trade_goods_flavour.51.desc:0 "一个养马人找到了我们的宫廷，想向我们出售他的一些最好的品种。他为我们的战车提供一些马匹--正如主人所说，它们 \"对恐惧免疫\"。另外，他还有一些结实的马匹，可以帮助农民在田间劳作。\n看到他的马匹有多么漂亮和有用，他在我们的工作中会很有用...。"
 trade_goods_flavour.51.t:0 "马匹育种"
 trade_goods_flavour.52.a:0 "我们必须不惜一切代价保护这片圣林!"
 trade_goods_flavour.52.b:0 "我们的人民需要房屋..."
 trade_goods_flavour.52.desc:0 "我们遇到了一个小难题，[ROOT.GetCountry.GetRuler.GetName] 面临着一个艰难的决定。\n\n在距离 [ROOT.GetCountry.GetCapital.GetName] 不远的地方有一片树林，这是一个动物们的圣地，尽管每个人都知道众神经常造访这片森林与生物们交流，但仍有一些人希望在这个区域建造他们的房屋。\n\n我们是否应该允许我们的公民在那里建房？如果这样做，这片神圣的树林将不得不被砍伐。"
 trade_goods_flavour.52.t:0 "关于神圣森林的重要问题"
 trade_goods_flavour.53.a:0 "我们至少要抓到几个!到外面去吧!"
 trade_goods_flavour.53.b:0 "该死！失去的已经失去了……我们无能为力。"
 trade_goods_flavour.53.desc:0 "来自[SCOPE.sP('horse_farm_scope').GetName]的可怕消息--似乎有一个马夫在睡着之前忘了关上大门，当这个白痴醒来的时候，农场里的每一匹马都逃了出来--毫无疑问，此时的动物已经跑到了坏境中。损失惨重!"
 trade_goods_flavour.53.t:0 "马匹逃脱"
 trade_goods_flavour.54.a:0 "我们必须除掉这个麻烦。"
 trade_goods_flavour.54.b:0 "它也需要吃东西。"
 trade_goods_flavour.54.desc:0 "来自[GetProvince('(int32)440').GetName]的消息!可怕的#E 尼米亚狮#!，这种体型巨大、食欲凶猛的野兽再次被发现，它攻击牛群，甚至杀死了一个不幸的牧羊人的孩子。当地人被吓得魂飞魄散，并乞求当局的援助[ROOT.GetCountry.GetAdjective]。我们应该怎么做？"
 trade_goods_flavour.54.t:0 "目击到尼米亚狮"
 trade_goods_flavour.55.a:0 "多么好的一次狩猎啊!"
 trade_goods_flavour.55.desc:0 "[ROOT.GetCountry.GetRuler.GetName] 成功找到了并杀死了 #E 尼米亚狮子#!——难以置信！那只猛兽正在攻击山羊时，[ROOT.GetCountry.GetRuler.GetName] 向其后腿深深射入了几箭。当动物试图逃跑时，一箭正中其心脏，结束了它的恐怖统治。\n\n当地人欣喜若狂，简直不敢相信——他们整晚都在唱歌，毫不停歇地赞美 [ROOT.GetCountry.GetRuler.GetName]。酒流如河，整个村庄都在欢庆，这村庄位于 [GetProvince('(int32)440').GetName] 附近。"
 trade_goods_flavour.55.t:0 "发现尼米亚狮"
 trade_goods_flavour.56.a:0 "真是太可惜了。我们会在其他时间得到它。"
 trade_goods_flavour.56.desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]拼命地追踪#E 尼米亚狮#!，甚至设法找到了这个生物的巢穴，但狮子本身仍然难以捉摸，从未露面。\n\n所有人都感到失望，但已经无法再花更多时间去追捕这头狮子了。"
 trade_goods_flavour.56.t:0 "尼米亚狮子避开了我们"
 trade_goods_flavour.57.a:0 "我们将结束厄律曼托斯的威胁"
 trade_goods_flavour.57.b:0 "我们不应该破坏这样一个神圣的生物"
 trade_goods_flavour.57.desc:0 "我们听到令人不安的报告，在[GetProvince('(int32)7894').GetName]附近出现了一头巨大的野猪，它袭击了当地人的畜群，并用它的獠牙刺穿马匹。尽管当地人尽了最大努力，但仍无法杀死这个怪物，并向[ROOT.GetCountry.GetCapital.GetName]寻求帮助。"
 trade_goods_flavour.57.t:0 "目击到厄律曼托斯野猪"
 trade_goods_flavour.58.a:0 "我是有史以来最伟大的猎手！"
 trade_goods_flavour.58.desc:0 "一个流传千古的故事！[ROOT.GetCountry.GetRuler.GetName]成功追踪并猎杀了可怕的 #E 厄律曼托斯野猪#!，其轻松程度令[GetProvince('(int32)7894').GetName]的当地人自愧不如。\n\n一抵达野猪出没之地附近，[ROOT.GetCountry.GetRuler.GetFirstName]便设法将这只野兽从森林中引出，迅速用箭将其射杀。\n\n厄律曼托斯附近正在搭建一个巨大的柴堆，以便将野猪烤制，[ROOT.GetCountry.GetRuler.GetFirstName]已同意留下享受庆典。"
 trade_goods_flavour.58.t:0 "发现厄律曼托斯的野猪"
 trade_goods_flavour.59.a:0 "告诉大家，我们会在其他时间得到它。"
 trade_goods_flavour.59.desc:0 "诅咒！#E 厄律曼托斯野猪#!继续在[GetProvince('(int32)7894').GetName]肆虐，但它太敏捷，无法让我们的人围住。我们的马天生害怕这只巨兽，拒绝靠近到足以致命的距离。尽管厄律曼托斯的每个人都感到失望至极，但在取得胜利之前，狩猎不得不取消。"
 trade_goods_flavour.59.t:0 "厄律曼托斯野猪避开了我们"
 trade_goods_flavour.6.a:0 "现在就造船！"
 trade_goods_flavour.6.b:0 "确保未来的木材供应。"
 trade_goods_flavour.6.desc:0 "我们的侦察员报告说，#E 腓尼基人#! 已经将他们的贸易船停靠海岸上---看来他们一直在寻找雪松大量生长在#E 塞浦路斯#!附近，这让他们蜂拥而至。\n\n我们当然可以派出一些商人，看看腓尼基人是否愿意与我们交易。我们可以拿着这些木材立即造船，或者囤积起来以备不时之需......选择权在[ROOT.GetCountry.GetRuler.GetName]。"
 trade_goods_flavour.6.t:0 "塞浦路斯的雪松"
 trade_goods_flavour.60.a:0 "希望我们能看到更多这样的情况。"
 trade_goods_flavour.60.desc:0 "我们认为你会很高兴听到这个消息，哦， [ROOT.GetCountry.GetRuler.GetName]；虽然每个人都知道[ROOT.GetCountry.GetAdjective]人喜欢喝啤酒和吃肉，但最近，但我们的公民一直在努力多吃水果和蔬菜。不仅农产品美味可口、营养丰富，而且我们手头有大量的水果，让我们的人民消费无法在市场上出售的水果完全合理。"
 trade_goods_flavour.60.t:0 "健康的人口"
 trade_goods_flavour.61.a:0 "希望我们能看到更多这样的情况。"
 trade_goods_flavour.61.desc:0 "我们认为你会很高兴听到这个消息，哦， [ROOT.GetCountry.GetRuler.GetName]；虽然每个人都知道[ROOT.GetCountry.GetAdjective]人喜欢喝啤酒和吃肉，但最近，但我们的公民一直在努力多吃水果和蔬菜。不仅农产品美味可口、营养丰富，而且我们手头有大量的水果，让我们的人民消费无法在市场上出售的水果完全合理。"
 trade_goods_flavour.61.t:0 "健康的人口"
 trade_goods_flavour.62.a:0 "船只，以统治海洋。"
 trade_goods_flavour.62.b:0 "我们必须建设!"
 trade_goods_flavour.62.c:0 "这些工具虽然..."
 trade_goods_flavour.62.d:0 "我们应该把它换走。"
 trade_goods_flavour.62.desc:0 "在一个意想不到的情况下，我们的焦油坑比我们以前估计的更深更大，我们的开采能力也因此增加。至少现在，在容易到达的地方，我们可以增加产量，但问题是，是出售沥青还是留作自用，也许是用于船舶或工具？"
 trade_goods_flavour.62.t:0 "沥青盈余"
 trade_goods_flavour.63.a:0 "我们必须揭开它们。"
 trade_goods_flavour.63.b:0 "我们必须揭开它们。"
 trade_goods_flavour.63.c:0 "我们必须揭开它们。"
 trade_goods_flavour.63.d:0 "我们必须揭开它们。"
 trade_goods_flavour.63.desc:0 "在从一个矿床中提取沥青时，发现了一些大的骨头，显然是一个巨大的生物的遗骸--也许是神性的。我们应该继续发掘这些骨头还是让它留在最后的安息之地？"
 trade_goods_flavour.63.e:0 "让它安息吧。"
 trade_goods_flavour.63.t:0 "发现大骨头"
 trade_goods_flavour.64.a:0 "我们必须从国外获得供应。"
 trade_goods_flavour.64.b:0 "眼前有更重要的事情。"
 trade_goods_flavour.64.desc:0 "灾难来了，我的[ROOT.GetCountry.GetRulerTitle]!由于储存不当，石榴的收成已经被糟蹋了，只有少数果实还可以食用。贵族和祭司们已经开始表达他们的不满，他们渴望吃到高贵的水果，并要求我们从国外进口更多的水果。我们应该向他们的要求屈服，并支付高昂的费用吗？"
 trade_goods_flavour.64.t:0 "石榴收成被毁"
 trade_goods_flavour.65.a:0 "我们将把它全部吃掉。"
 trade_goods_flavour.65.b:0 "我们应该卖掉它们。"
 trade_goods_flavour.65.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，来自我们田地的令人难以置信的消息：石榴的收获大大超过了预期。有了这些盈余，如果我们不自己使用这些果实，我们肯定会有丰厚的利润。"
 trade_goods_flavour.65.t:0 "石榴收成过剩"
 trade_goods_flavour.66.a:0 "我们将把它全部吃掉。"
 trade_goods_flavour.66.b:0 "我们应该卖掉它们。"
 trade_goods_flavour.66.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，来自我们田地的令人难以置信的消息：洋葱的收获大大超过了预期。有了这些盈余，如果我们不自己使用这些果实，我们肯定会有一笔不菲的利润。至少，今年没有人会挨饿。"
 trade_goods_flavour.66.t:0 "洋葱收成过剩"
 trade_goods_flavour.67.a:0 "我们必须从国外获得供应。"
 trade_goods_flavour.67.b:0 "眼前有更重要的事情。"
 trade_goods_flavour.67.desc:0 "灾难来了，我的[ROOT.GetCountry.GetRulerTitle]!洋葱的收成大大低于预期，农民们开始抱怨和抗议了。如果我们没有找到解决办法，我们可能得不到人民的支持，叛乱会增加。"
 trade_goods_flavour.67.t:0 "洋葱歉收"
 trade_goods_flavour.68.a:0 "我们至少要抓住几个。"
 trade_goods_flavour.68.b:0 "失去了就是失去了"
 trade_goods_flavour.68.desc:0 "[SCOPE.sP('cattle_farm_scope').GetName] 传来了噩耗——看来有个牧场工人睡前忘了关门，等这蠢货醒来时，牧场里的马全都跑光了——毫无疑问，这些牲口此时肯定已经逃到了荒野。全损失掉了！"
 trade_goods_flavour.68.t:0 "牛群逃脱"
 trade_goods_flavour.69.a:0 "确实是一种神圣的颜色。"
 trade_goods_flavour.69.desc:0 "看哪，神圣的颜色，哦，[ROOT.GetCountry.GetRuler.GetName]。这种深紫色诞生于[GetProvince('(int32)3982').GetName]这座城市，因此以其名命名。\n制作一块染色布料的过程极其复杂且耗时，其成本远远超过其他任何染料或颜料。毫无疑问，出售这种昂贵的染料将使我们富得难以置信，而拥有一件此色的衣物则是无尽财富的象征。"
 trade_goods_flavour.69.t:0 "骨螺紫：非凡之色“# Tyrian 紫色被发明”"
 trade_goods_flavour.7.a:0 "现在就造船！"
 trade_goods_flavour.7.b:0 "确保未来的木材供应。"
 trade_goods_flavour.7.desc:0 "商人们从大绿洲的各个地方来到我们的岛屿，希望他们能带走一些生长在我们海岸的雪松木材--但我们很难责怪他们。雪松是一种宏伟的软木，耐腐蚀，因此有很好的军事用途，特别是在建造船只方面。意识到这种商品是多么珍贵，我们应该决定如何处理它。"
 trade_goods_flavour.7.t:0 "塞浦路斯的雪松"
 trade_goods_flavour.70.a:0 "一个令人惊叹的颜色。它应该是我的。"
 trade_goods_flavour.70.desc:0 "来自[GetProvince('(int32)3982').GetName]的消息传来，一种全新的颜色现身于世。这是一种前所未有的深邃紫色，昂贵得令人咋舌，甚至连诸神见到它的价格也会落泪。只有[GetProvince('(int32)3982').GetOwner.GetAdjective]人掌握着制造这种染料的秘密，而从他们手中——如果有必要，甚至从他们的坟墓中——夺取这个秘密，将是千倍值得的。总有一天，这座拥有神赐之色的城市将归我们所有。"
 trade_goods_flavour.70.t:0 "骨螺紫：全新之色“# Ping 在外交范围内触发——成为“丰厚贸易的征服邀请”"
 trade_goods_flavour.71.a:0 "这是一个多么值得庆祝的日子。"
 trade_goods_flavour.71.desc:0 "紫色染料的新巨匠已在[GetProvince('(int32)3982').GetName]崛起。制造的秘密如今牢牢掌握在[GetProvince('(int32)3982').GetOwner.GetAdjective]人手中，曾经的商人们注定会被遗忘。我们必将成为染料行业的主宰，持续数个世纪！"
 trade_goods_flavour.71.t:0 "泰尔紫：新的巨匠"
 trade_goods_flavour.72.a:0 "总有一天，它将是我们的。"
 trade_goods_flavour.72.desc:0 "紫色染料的新巨匠已在[GetProvince('(int32)3982').GetName]崛起。制造的秘密如今牢牢掌握在[GetProvince('(int32)3982').GetOwner.GetAdjective]人手中，曾经的商人们注定会被遗忘。\n既然这座城市已经换过一次主人，为何不再来一次？"
 trade_goods_flavour.72.t:0 "泰尔紫：新的巨匠"
 trade_goods_flavour.73.a:0 "我想，这真是对染料和生命的一种浪费"
 trade_goods_flavour.73.desc:0 "来自[SCOPE.sP('dye_shipwreck').GetName]的可怕消息--在一场风暴卷过该地区后，我们运输染料的船只全部沉没，随之而来的是我们本季盈利的希望。"
 trade_goods_flavour.73.t:0 "染料运输船沉没"
 trade_goods_flavour.74.a:0 "一个良好的发展。"
 trade_goods_flavour.74.desc:0 "今天我们不会用太多的细节来打扰你，[ROOT.GetCountry.GetRuler.GetName]，但只需说，我们的染料贸易做得特别好。商人们从各地赶来参观我们的市场，因为我们的产品显然比任何方向一千英里内的任何产品都要好。"
 trade_goods_flavour.74.t:0 "染料贸易热潮"
 trade_goods_flavour.75.a:0 "真是太可惜了。不过它看起来还是不错。"
 trade_goods_flavour.75.b:0 "我们将对他进行补偿。"
 trade_goods_flavour.75.desc:0 "有一个住在[ROOT.GetCountry.GetCapital.GetName]的贵族，一直在为他要求染色的衣服订单大吵大闹。尽管他对自己想要的颜色非常明确，但染色工人却因为没有把一些亚麻布外衣染成深紫色而'毁了'。\n\n这位贵族拒绝让这件事不了了之，他坚持认为，由于国家资助了染色生产活动，[ROOT.GetCountry.GetName]的居民应对此负责，并应支付新的长袍费用。"
 trade_goods_flavour.75.t:0 "染料事故"
 trade_goods_flavour.76.a:0 "我们将试一试。"
 trade_goods_flavour.76.b:0 "它太贵了。"
 trade_goods_flavour.76.desc:0 "最近，有人在[ROOT.GetCountry.GetCapital.GetName]中建议我们尝试在当地种植一些香料，而不是总是花钱让它们进口。你怎么看，[ROOT.GetCountry.GetRuler.GetName]？这可能要花费一点前期费用，但如果这能成功，我们就会受益！"
 trade_goods_flavour.76.t:0 "香料出口"
 trade_goods_flavour.77.a:0 "它成功了!我是个天才!"
 trade_goods_flavour.77.b:0 "这值得一试"
 trade_goods_flavour.77.desc_1:0 "巨大的消息!我们在一个省种植的香料不仅在生长，而且第一批收获了，当地人说我们的品种比我们花钱进口的品种更香、更刺激。\n\n不久，[ROOT.GetCountry.GetCapital.GetName]的市场上就会有很多好的[ROOT.GetCountry.GetAdjective]香料出售。"
 trade_goods_flavour.77.desc_2:0 "好吧，我们在自己国家种植香料的努力失败得很厉害，但至少我们可以用我们尝试过的知识来安慰自己。"
 trade_goods_flavour.77.t:0 "香料出口：增长"
 trade_goods_flavour.78.a:0 "我们将做到这一点。"
 trade_goods_flavour.78.b:0 "它太贵了。"
 trade_goods_flavour.78.desc:0 "有人建议我们在本地种植一些没药树，以减少进口这种珍贵香品的费用。我们已经想到了地点，如果[ROOT.GetCountry.GetRuler.GetName]发话，工人们已经准备好破土动工。"
 trade_goods_flavour.78.t:0 "没药树"
 trade_goods_flavour.79.a:0 "我们将做到这一点。"
 trade_goods_flavour.79.b:0 "它太贵了。"
 trade_goods_flavour.79.desc:0 "有人向[ROOT.GetCountry.GetRuler.GetName]建议，[ROOT.GetCountry.GetName]可以通过销售大家都喜爱并用于宗教用途的熏香来赚取更多的钱。我们所在地区有一些植物能产出香甜的树脂，当这些花朵被干燥并制成香薰时，气味十分宜人。我们是否应该开展大规模种植熏香植物的计划，以期望通过销售来获利？"
 trade_goods_flavour.79.t:0 "香料丛"
 trade_goods_flavour.8.a:0 "为核心部队装备。"
 trade_goods_flavour.8.b:0 "为散兵配备装备。"
 trade_goods_flavour.8.c:0 "让战车变得更加致命。"
 trade_goods_flavour.8.d:0 "遗憾的是，我们负担不起你的服务。"
 trade_goods_flavour.8.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]有一个铁匠，声称在设计武器方面取得了突破。这位工匠声称已经用不同类型的合金进行了实验，他认为他已经创造了一种更强大的青铜，一种可以切开敌人的盔甲而不会卷刃的青铜---这种吹嘘让[ROOT.GetCountry.GetRuler.GetName]感到难以置信，但又惹人好奇。\n\n我们可以要求为我们的军队制造一些这种武器，但价格会很昂贵。"
 trade_goods_flavour.8.t:0 "实验性青铜兵器"
 trade_goods_flavour.80.a:0 "我们让自然来引导方向。"
 trade_goods_flavour.80.b:0 "我们必须从我们的邻居那里采购一些。"
 trade_goods_flavour.80.desc:0 "我们的人民已经习惯的味道如今变得越来越稀少，这让[ROOT.GetCountry.GetRuler.GetName]非常懊恼，他的呼吸通常都带有遥远王国的香料的香味。\n\n随着豆蔻荚和黑胡椒在市场上逐渐消失，大家纷纷呼吁[ROOT.GetCountry.GetName]采取行动，不惜一切代价补充这些供应。"
 trade_goods_flavour.80.t:0 "香料日益稀少"
 trade_goods_flavour.81.a:0 "我们不能改变任何东西。"
 trade_goods_flavour.81.b:0 "我们必须从我们的邻居那里采购一些。"
 trade_goods_flavour.81.desc:0 "我们手上有一个缓慢移动的危机，如果我们不小心，可能会变成一场灾难。我们听说盐的供应异常地少，如果没有这种重要的资源，给我们的食物调味将是我们最担心的事情--我们将无法腌制任何肉类！\"！"
 trade_goods_flavour.81.t:0 "食盐短缺"
 trade_goods_flavour.82.a:0 "我想我知道一个人可以为我们弄到一些。"
 trade_goods_flavour.82.b:0 "只要说不..."
 trade_goods_flavour.82.desc:0 "我们听说过亚述人在他们的神庙仪式中使用一种被称为 \"qunabu(大麻) \"的神秘物质的传闻--据说那些参加燃烧这种大麻所产生的潮湿云雾的人与神灵交流，通常会笑个不停，然后他们会被一种凶猛的胃口抓住，只有通过寻找蜂蜜蛋糕等甜食才能满足。\n\n我们可以在自己的宗教仪式上使用大麻，但在做任何事情之前，我们必须得到[ROOT.GetCountry.GetRuler.GetName]的批准。"
 trade_goods_flavour.82.t:0 "亚述人大麻"
 trade_goods_flavour.83.a:0 "我们必须挖掘这一新的财富。"
 trade_goods_flavour.83.b:0 "这根本不值得。"
 trade_goods_flavour.83.desc:0 "我们的工人报告了一个令人高兴的发现--一个新的有价值的矿物财富缝隙，等待着从[SCOPE.sP('mining_target').GetName]的地下取出。初步报告的细节有点少，但似乎这可能是[ROOT.GetCountry.GetAdjective]历史上发现的最大矿脉--确实是一个令人印象深刻的数量。"
 trade_goods_flavour.83.t:0 "新的矿脉"
 trade_goods_flavour.84.a:0 "耕种!"
 trade_goods_flavour.84.b:0 "马匹是有价值的。"
 trade_goods_flavour.84.c:0 "木材总是被需要的。"
 trade_goods_flavour.84.d:0 "我看到他们的未来有大量的编织工作。"
 trade_goods_flavour.84.desc:0 "我们听说[SCOPE.sP('mining_target').GetName]已经被剥夺了宝贵的矿产财富，但我们仍有大量的奴隶和劳工仍在这个地区。有人建议我们不要分散他们或送他们回家，而是在该地区找一些有价值的事情做；[ROOT.GetCountry.GetRuler.GetName]表示赞同。"
 trade_goods_flavour.84.e:0 "染料可以赚钱。"
 trade_goods_flavour.84.f:0 "我们不得不满足于一些石头……"
 trade_goods_flavour.84.t:0 "矿脉枯竭"
 trade_goods_flavour.9.a:0 "让她纵情享受。"
 trade_goods_flavour.9.b:0 "把它献给一个神灵。"
 trade_goods_flavour.9.c:0 "再卖掉它。"
 trade_goods_flavour.9.desc:0 "有一天，[ROOT.GetCountry.GetRuler.GetName]正在和[ROOT.GetCountry.GetConsort.GetName]共进早餐时，注意到[ROOT.GetCountry.GetConsort.GetFirstName]的脖子上戴着一条精美的青铜项链。这条项链真是件大师之作，镶嵌着珍珠、红宝石和条状的青金石，在早晨的阳光下闪耀如火。\n\n“这真是件漂亮的首饰，[ROOT.GetCountry.GetConsort.GetFirstName]，但我从未见过……这是从哪里来的？”\n\n[ROOT.GetCountry.GetConsort.GetFirstName]的脸立刻红了起来，她开始结巴起来。“哦，这个小东西？我…我自己做的…只是一个小玩意。”\n\n“小玩意？项链上的宝石就足够养活整个城市一年。它花了多少钱？！”\n\n[ROOT.GetCountry.GetConsort.GetFirstName]拒绝回答，转过头去。“请让我留着它……我再也不会背着你买东西了。”"
 trade_goods_flavour.9.t:0 "请求宽恕比请求许可更好"
 tyrian_purple_dye:0 "骨螺紫"
 tyrian_purple_dye_desc:0 "举世闻名的骨螺紫就是在[GetProvince('(int32)3982').GetName]这里起源的。"
 tyrian_purple_ownership_loss_prevention_tt:0 "如果我们#R 失去#!对[GetProvince('(int32)3982').GetName]的控制，我们将#R 失去#!以下修正。"
 tyrian_purple_ownership_tt:0 "如果我们#G 获得#!对[GetProvince('(int32)3982').GetName]的所有权，我们将因掌控染料的产地而获得以下修正。"
 tyrian_purple_trade:0 "骨螺紫染料贸易"
 tyrian_purple_trade_desc:0 "这个国家控制着非常珍贵的骨螺紫染料的贸易。"
 war_horse_breed:0 "战马"
 war_horse_breed_desc:0 "一位大师训练了新一代的马匹，它们是战争的理想选择。"
 wine_culture:0 "葡萄酒文化"
 wine_culture_desc:0 "当地人更喜欢喝一些葡萄酒，而不是去打仗。"
 wood_surplus_navy_cmod:0 "丰富的木材储量"
 wood_surplus_navy_cmod_desc:0 "你有足够的木材来维持舰队很长一段时间。"

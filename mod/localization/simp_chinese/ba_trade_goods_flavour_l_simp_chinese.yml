l_simp_chinese:
 bear_hunt_reward:0 "熊爪"
 bear_hunt_reward_desc:0 "这是由某位贵族或其他人猎杀的一头熊的爪子。"
 beer_brewery:0 "酿酒厂"
 beer_brewery_desc:0 "这座城市有座啤酒厂。这会带来什么结果呢？"
 beer_culture:0 "啤酒文化"
 beer_culture_cities_only_tt:0 "我能将把重点放在城市，可惜的是，农舍将不再那么容易获得啤酒了..."
 beer_culture_desc:0 "当地人更喜欢喝一些冰啤酒，而不是去打仗。"
 beer_culture_expand_production_tt:0 "我们将通过建筑尽可能多的啤酒厂来扩大我们的啤酒生产。"
 beer_culture_limited_tt:0 "我们将阻止#Y 啤酒文化#!自[SCOPE.sP('beer_city_scope').GetName]的传播，这种干预将使任何进一步的事件都不太可能发生。"
 beer_culture_local_tt:0 "每个领土都有#Y 啤酒文化#!。"
 beer_culture_national:0 "国家啤酒文化"
 beer_culture_national_desc:0 "在这个国家，啤酒已经成为国民饮料。"
 beer_culture_national_tt:0 "#Y 啤酒文化#!修正转变为#Y 国家修正#!，并从所有领土上移除。"
 beer_culture_spread_tt:0 "每个地区都接受了我们的#Y 啤酒文化#!，如今这已经成为了国家文化。"
 beer_culture_spreading_tt:0 "#Y 啤酒文化#!将从[SCOPE.sP('beer_city_scope').GetName]慢慢传播到我们整个国家"
 bitumen_temp_build:0 "沥青建筑"
 bitumen_temp_build_desc:0 "在许多建筑中，沥青被用作粘合剂。"
 bitumen_temp_ship:0 "沥青制船业"
 bitumen_temp_ship_desc:0 "沥青将船板牢固粘合，使其防水且更难被穿透。"
 bitumen_temp_tools:0 "沥青工具"
 bitumen_temp_tools_desc:0 "制作工具经常使用沥青作为粘合剂，尽管它们对工人的健康有一些影响。"
 bitumen_trade_boom:0 "沥青贸易热潮"
 bitumen_trade_boom_desc:0 "古代时沥青在地图上的各地进行交易。"
 boar_hunt_reward:0 "野猪皮"
 boar_hunt_reward_desc:0 "一头野猪的皮，在成功狩猎后被剥下。"
 bred_cedars_future:0 "塞浦路斯的雪松"
 bred_cedars_future_desc:0 "这些雪松是为造船而培育的。与它们在黎巴嫩更著名的亲戚类似，它们也可以为船只提供精美的木材。"
 bronze_helmet_treasure:0 "青铜头盔"
 bronze_helmet_treasure_desc:0 "一顶完全由青铜制成的头盔，这是一件革命性的物品。"
 bronze_jewelry:0 "青铜首饰"
 bronze_jewelry_desc:0 "献给女神的青铜制成的珠宝。"
 cannabis_accepted:0 "大麻的使用"
 cannabis_accepted_desc:0 "在这个国家，大麻树脂被用来举行宗教仪式。"
 cannabis_refused:0 "大麻的使用停止了"
 cannabis_refused_desc:0 "在这个国家，大麻是不受欢迎的。"
 cattle_capture_again_tt:0 "一部分牛群被再次捕获。"
 cattle_escaped:0 "牛群逃离"
 cattle_escaped_desc:0 "牛群逃离了当地的农场，大大降低了生产力。"
 cattle_escaped_tt:0 "在没有牛群的情况下，在[SCOPE.sP('cattle_farm_scope').GetName]培养新的牧羊人将需要数年时间。修正持续时间将会再#R 延长#!#Y 10#!年。"
 cedar_planks:0 "雪松木板"
 cedar_planks_desc:0 "用雪松制成的木板，这种木材非常适合造船。"
 cedar_used_now:0 "塞浦路斯的雪松"
 cedar_used_now_desc:0 "塞浦路斯的雪松现在被用于与黎巴嫩的雪松类似的用途。建造更坚固的船的知识在传播。"
 cedar_used_up:0 "开发雪松林"
 cedar_used_up_desc:0 "为了短期利益，雪松林被过度开发，超出了它的再生能力。"
 censer_bearer_char_mod:0 "皇家持香人"
 censer_treasure:0 "珠光宝气的香炉"
 censer_treasure_desc:0 "一个为焚香和没药而制作的香炉。"
 cypriot_dwarf_elephant_bones:0 "塞浦路斯的大骨头"
 cypriot_dwarf_elephant_bones_desc:0 "在塞浦路斯发现的这些大骨头，对于见过大象的人来说可能很熟悉。但其他所有人都认为它们是一位逝去神灵的骨头......\n塞浦路斯的矮象在几千年前就已经灭绝了，但它们的骨头至今仍让我们着迷。"
 desc_salt_rare_in_realm:0 "由于始料不及的短缺，重要的贸易品盐在我国变得极为罕见。"
 dye_accident_pmod:0 "染料事故"
 dye_accident_pmod_desc:0 "这里的一起染色事故成为一些不光彩的头条新闻。"
 dye_shipwreck_pmod:0 "染料运输船在港口沉没"
 dye_trade_well:0 "染料贸易热潮"
 dye_trade_well_desc:0 "染料贸易做得非常好。"
 elephant_hunt_reward:0 "大象牙"
 elephant_hunt_reward_desc:0 "猎杀大象的战利品。"
 erymanthian_boar_hunted:0 "捕猎厄律曼托斯的野猪"
 erymanthian_boar_tusk:0 "厄律曼托斯野猪獠牙"
 erymanthian_boar_tusk_desc:0 "这头野猪恐吓了厄律曼托斯城，直到它被赫拉克勒斯杀死。"
 exploited_cedar:0 "被开发的雪松林"
 exploited_cedar_desc:0 "这片雪松林被开发的程度已经超过了它的再生能力。也许有一天它的森林会重新生长......"
 extra_tin_mil:0 "更多锡"
 extra_tin_mil_desc:0 "锡的数量比平时多。"
 farm_horse_breed:0 "养殖马匹"
 farm_horse_breed_desc:0 "一位大师训练了新一代的马匹，它们是耕作的理想选择。"
 grove_desecrated:0 "被亵渎的树林"
 grove_desecrated_desc:0 "仅仅为了经济利益，一片神圣的小树林被拆毁了。"
 grove_preserved:0 "保育林"
 grove_preserved_desc:0 "尽管未能实现经济和社会目标，一片神圣的树林仍被保留并继续生长。"
 healthy_pops_pmod:0 "健康的人口"
 healthy_pops_pmod_desc:0 "当地居民饮食健康，有助于他们的繁殖。"
 horses_capture_again_tt:0 "一部分马匹被再次捕获。"
 horses_escaped:0 "马匹逃离"
 horses_escaped_desc:0 "马匹逃离了当地的农场，大大降低了生产力。"
 horses_escaped_tt:0 "在没有马匹的情况下，在[SCOPE.sP('horse_farm_scope').GetName]培养新的育马者将需要数年时间。"
 hunt_help_tt:0 "高#Y 军略#!@military_icon!将是有利的。\n军事#R 越低#!，#R 受伤#!甚至是#R 死亡#!的风险越高。"
 ivory_carving:0 "宏伟的象牙雕刻"
 ivory_carving_desc:0 "一根由大师雕刻的大象牙，描绘了世界的创世过程。"
 ivory_throne:0 "象牙宝座"
 ivory_throne_cmod:0 "象牙宝座"
 ivory_throne_cmod_desc:0 "一个象牙制成的王座，令朋友和敌人都印象深刻。统治权威将不容置疑。"
 ivory_throne_desc:0 "一个用象牙和稀有木材雕刻而成的宝座。它肯定会给人留下深刻印象。"
 ivory_throne_small_cmod:0 "小象牙宝座"
 ivory_throne_small_cmod_desc:0 "一个用象牙制成的小宝座，非常适合继承人开始学习..."
 lion_hunt_reward:0 "狮皮"
 lion_hunt_reward_desc:0 "这是由某位贵族或其他人猎杀的一头狮子的皮。"
 magnificent_carving:0 "宏伟的雕刻"
 magnificent_carving_desc:0 "大师雕刻的象牙，给外国政要留下了深刻印象。"
 master_breeder_joins_court_tt:0 "一位育种大师将加入我们的宫廷。"
 merchant_spices_rare:0 "香料是稀有的"
 merchant_spices_rare_desc:0 "香料稀缺，价格因此上涨，这使得上层社会的人们感到不满。"
 metal_tools:0 "创新的金属工具"
 metal_tools_desc:0 "在黑曜石和金属工具都可以使用的一段时间后，我们决定偏爱新式工具。"
 nemean_lion_hunt_tt:0 "在找到这种难以捉摸的动物很罕见的情况下，我们的统治者可能会#R 死亡#!。"
 nemean_lion_hunted:0 "发现尼米亚狮的踪迹"
 nemean_lion_hunted_desc:0 "这里目击到了尼米亚狮子，它袭击了牛群和旅客。"
 nemean_lion_pelt:0 "尼米亚狮的皮毛"
 nemean_lion_pelt_desc:0 "这种金色的狮子皮毛不受凡人武器的影响；他是被赫拉克勒斯杀死的。"
 obsidian_abandoned:0 "优先考虑金属工具"
 obsidian_abandoned_desc:0 "我们必须探索这种新材料的用途。"
 obsidian_arrow_tips:0 "黑曜石箭尖"
 obsidian_arrow_tips_desc:0 "用黑曜石制成的箭头会给我们的敌人带来恐惧。"
 obsidian_blades:0 "黑曜石刀刃"
 obsidian_blades_desc:0 "用黑曜石制成的刀刃。它们锋利无比，轻易就能割破皮肤并出血。"
 obsidian_kept_main:0 "优先考虑黑曜石工具"
 obsidian_kept_main_desc:0 "我们坚持使用我们所知道的东西..."
 obsidian_mirrors:0 "黑曜石镜面"
 obsidian_mirrors_desc:0 "只要你负担得起，黑曜石制成的镜子能让不止一个妻子高兴。"
 obsidian_statue:0 "黑曜石雕像"
 obsidian_statue_desc:0 "用黑曜石雕刻而成的雕像，代表一个神灵。"
 obsidian_tools:0 "传统黑曜石工具"
 obsidian_tools_desc:0 "在黑曜石和金属工具都可以使用的一段时间后，我们决定偏爱传统工具。"
 onions_lack:0 "洋葱歉收"
 onions_lack_desc:0 "这个国家的洋葱数量不足，无法使所有人得到适量的食物。"
 onions_surplus:0 "洋葱盈余"
 onions_surplus_desc:0 "洋葱绰绰有余；现在没有平民在挨饿。"
 pomegranates_spoiled:0 "石榴收成被毁"
 pomegranates_spoiled_desc:0 "石榴的收获被糟蹋了，让贵族们很不高兴。"
 pomegranates_surplus:0 "石榴盈余"
 pomegranates_surplus_desc:0 "有很多石榴；贵族们可以尽情地大快朵颐。"
 quality_shipyard:0 "大造船厂"
 quality_shipyard_desc:0 "一个大造船厂，致力于制造最好的船只。"
 quantity_shipyard:0 "大造船厂"
 quantity_shipyard_desc:0 "一个大造船厂，致力于制造尽可能多的船只。"
 salt_rare_in_realm:0 "我国盐短缺"
 silphium_dessert:0 "加罗盘草的甜点"
 silphium_dessert_desc:0 "吃了一个加罗盘草的甜点。"
 silphium_farm_pmod:0 "罗盘草农场"
 silphium_farm_pmod_desc:0 "这里有一个专门为罗盘草设立的农场。"
 silphium_healing_tt:0 "罗盘草的使用增强了身体对疾病的抵抗力。"
 silphium_roast:0 "用罗盘草烤"
 silphium_roast_desc:0 "吃了加罗盘草的烤肉。"
 silphium_snack:0 "加罗盘草的小吃"
 silphium_snack_desc:0 "吃了一个加罗盘草的小吃。"
 silphium_sold:0 "罗盘草贸易增加"
 silphium_sold_desc:0 "罗盘草的销售量超过了它在这个国家的使用量..."
 silphium_soup:0 "加罗盘草的汤"
 silphium_soup_desc:0 "喝了一碗加罗盘草的汤。"
 silphium_used:0 "增加罗盘草的使用量"
 silphium_used_desc:0 "罗盘草的使用量比它在这个国家的销售量要大..."
 small_ivory_throne_tt:0 "我们的国王已经拥有了王位。"
 stag_hunt_reward:0 "雄鹿鹿角"
 stag_hunt_reward_desc:0 "雄鹿的鹿角，这是多年前狩猎时的战利品。"
 successful_hunt:0 "成功的狩猎"
 successful_hunt_desc:0 "你成功地进行了一次狩猎。"
 tar_pit_bones_1:0 "巨人的骨头"
 tar_pit_bones_1_desc:0 "这块巨大的骨头不可能是今天活着的凡人世界的任何生物的。它必须是一个巨人的。"
 tar_pit_bones_2:0 "提亚马特之牙"
 tar_pit_bones_2_desc:0 "在一个焦油坑中发现的，这一定是提亚马特的牙齿，在她与吉尔伽美什的战斗中丢失的。"
 tar_pit_bones_3:0 "死神的骨骸"
 tar_pit_bones_3_desc:0 "在一个柏油坑中发现的这块巨骨，一定是一个早已死去的神灵的腿，被对手杀死。"
 tar_pit_bones_4:0 "亚姆的牙齿"
 tar_pit_bones_4_desc:0 "一颗巨大的牙齿，在一个柏油坑中发现。许多人认为，这是他在与巴力战斗时失去的亚姆的牙齿。"
 tar_pit_rest_in_pieces:0 "远离死者"
 tar_pit_rest_in_pieces_desc:0 "我们不打扰死者最后的安息之地。"
 tin_smith_char:0 "实验性青铜兵器"
 tin_smith_char_desc:0 "一位铁匠大师为我们的部队制造了一些实验性武器。"
 tin_smith_inf:0 "实验性青铜兵器"
 tin_smith_inf_desc:0 "一位铁匠大师为我们的部队制造了一些实验性武器。"
 tin_smith_joins_court_tt:0 "一位锻造大师将加入我们的宫廷。"
 tin_smith_skirm:0 "实验性青铜兵器"
 tin_smith_skirm_desc:0 "一位铁匠大师为我们的部队制造了一些实验性武器。"
 trade_goods_flavour.1.a:0 "卖掉它。"
 trade_goods_flavour.1.b:0 "我们将好好利用它。"
 trade_goods_flavour.1.desc:0 "我们有一些令人愉快的消息要报告给您，[ROOT.GetCountry.GetRuler.GetName] - 这些日子真是少见的好消息。显然，我们手上有相当多的锡——我们应该卖掉它来赚取利润，还是用它来制作合金呢？"
 trade_goods_flavour.1.t:0 "额外的一批锡"
 trade_goods_flavour.10.a:0 "让我们自己来使用它。"
 trade_goods_flavour.10.b:0 "我们将让它保持原样。"
 trade_goods_flavour.10.c:0 "多卖点!"
 trade_goods_flavour.10.desc:0 "真的，#E 罗盘草#!这种植物确实是一种神奇的东西--它可以用来刺激食欲，为菜肴添加调味料，还可以增加人的性欲和耐力，同时防止意外的孩子。如果这还不够，罗盘草还可以用于药物治疗……我们认为没有什么事情是这种神奇的植物做不到的。\n\n我们有很多这种东西，但现在我们需要想办法用它来做什么。"
 trade_goods_flavour.10.t:0 "神奇的罗盘草"
 trade_goods_flavour.11.a:0 "烤肉听起来不错。"
 trade_goods_flavour.11.b:0 "汤听起来很美味。"
 trade_goods_flavour.11.c:0 "我想吃点甜食..."
 trade_goods_flavour.11.d:0 "只是一些小事，事后我需要去寺庙。"
 trade_goods_flavour.11.desc:0 "今天是一个庆祝我们最近成功的日子。我们的厨师师傅做了一些奇妙的菜，都比其他的菜闻起来更香。就在上菜之前，他走近我们，问我们哪道菜应该用罕见的、宝贵的罗盘草来补充。它应该是主菜还是应该做一道甜点？或者是祈祷后的点心？"
 trade_goods_flavour.11.t:0 "罗盘草是一种伟大的香料"
 trade_goods_flavour.12.a:0 "多么有用的植物。"
 trade_goods_flavour.12.desc:0 "增加食用#E 罗盘草#! 使这对皇室夫妇对疾病的抵抗力更强。最近降临在他们身上的小病症已经消失了。诚然，罗盘草是一种神奇的植物。"
 trade_goods_flavour.12.t:0 "罗盘草是药物"
 trade_goods_flavour.13.a:0 "扩大农场。"
 trade_goods_flavour.13.b:0 "我们应该传播这个植物。"
 trade_goods_flavour.13.c:0 "我们不应该过度开发这个地区。"
 trade_goods_flavour.13.desc:0 "在[silphium_farm.GetName]，一些农民已经开始系统地开发#E 罗盘草#!。到目前为止，他们已经非常成功，这种奇妙的植物在大多数地区都能成功生长；只有在离海洋太近或离沙漠太近的地区它才不会生长。\n这种成功引出了一个问题：我们是否应该扩大经营范围，或者尝试在这个农场的基础上建立更多的农场？"
 trade_goods_flavour.13.t:0 "罗盘草的种植"
 trade_goods_flavour.14.a:0 "灾难！"
 trade_goods_flavour.14.desc:0 "由于在[silphium_farm.GetName]地区过度采集#E 罗盘草#!植物，它在该地区已经变得稀少。农作业已无法继续，这影响了大量的生计。\n我们只能希望未来某些野生植物能再次在这里生长……"
 trade_goods_flavour.14.t:0 "罗盘草的过度开垦"
 trade_goods_flavour.15.a:0 "一个不错的转折。"
 trade_goods_flavour.15.desc:0 "大量的#E 雪松#! 树使好的船只更加普遍，现在构成了我们舰队的很大一部分。他们的木材比其他木材更适合于造船，因为它对腐烂有天然的防御能力，而且容易加工。"
 trade_goods_flavour.15.t:0 "雪松木板"
 trade_goods_flavour.16.a:0 "灾难！"
 trade_goods_flavour.16.desc:0 "#E 雪松#! 树的短缺使好船变得更不常见，现在只占我们舰队的一小部分。他们优越的木材现在缺少用于修理和新船。希望我们能尽快找到新的来源。"
 trade_goods_flavour.16.t:0 "雪松船"
 trade_goods_flavour.17.a:0 "我们现在需要木材。"
 trade_goods_flavour.17.b:0 "保留一些用于重新生长。"
 trade_goods_flavour.17.c:0 "我们不应该增加我们的用量。"
 trade_goods_flavour.17.desc:0 "雪松树的木材对许多工作都很有用，但其中最主要的是制造船只，其木板是理想的材料。最近，在如何使用和开发这些树木的问题上，法庭上出现了分歧。一些人建议增加砍伐树木的数量，以尽快建立一支更大的船队，希望能在与对手的竞争中取得优势。另一些人支持这一总体想法，但更加谨慎，优先考虑海军的长期可持续性。还有一些贵族支持以更和平的方式对待我们的邻国；他们似乎担心如果我们建立一支庞大的舰队，我们的对手会做出反应--或者他们只是更愿意在贸易中占据主导地位。"
 trade_goods_flavour.17.t:0 "对雪松的开发"
 trade_goods_flavour.18.a:0 "这是个好消息。"
 trade_goods_flavour.18.desc:0 "人们看到一些雪松在[cedar_regrown.GetName]又发芽了。几年前所有的树木都被砍伐后，没有人想到会在该地区再次看到蓬勃的树木。当然，上天一定会眷顾我们。"
 trade_goods_flavour.18.t:0 "雪松重新生长"
 trade_goods_flavour.19.a:0 "尽可能多地制造船只。"
 trade_goods_flavour.19.b:0 "一艘更好的船是值得投入时间。"
 trade_goods_flavour.19.desc:0 "多年来，我们一直在建造船舶。我们最大的造船厂之一是[main_shipyard_prov.GetName]，在那里建造了无数的船只。最近，船坞和港口已经扩大，以满足我们的商人和海军对船只不断增长的需求。一位来自[main_shipyard_prov.GetName]的特使向我们询问，是否应该用新扩建的大船厂来制造尽可能多的船只，或者在制造每艘船时是否应该注意细节，使它们成为在海上对抗海盗和敌人的更好船只。"
 trade_goods_flavour.19.t:0 "大船厂"
 trade_goods_flavour.2.a:0 "我们将好好利用它。"
 trade_goods_flavour.2.desc:0 "我们的商人告诉我们，有额外的锡供应出售--我们很高兴听到这个消息。我们一定会尽可能多地收购。"
 trade_goods_flavour.2.t:0 "额外的一批锡"
 trade_goods_flavour.20.a:0 "[ROOT.GetCountry.GetName]将统治海浪。"
 trade_goods_flavour.20.desc:0 "我们伟大的海军正随着我们王国丰富的木材而逐年扩大。专业知识和可用资源的增加使得船只的建造和维修比以前更容易、更快、更便宜。只要我们能够维持这种木材的使用，我们肯定会成为海上一支不可忽视的力量。"
 trade_goods_flavour.20.t:0 "丰富的木材"
 trade_goods_flavour.21.a:0 "我们必须纠正这一不足。"
 trade_goods_flavour.21.desc:0 "随着最近森林和林地在人类和自然界中的损失，我们过去保持海军无懈可击状态的严格方式已经不可能了，资源匮乏。如果我们获得新的林地，我们也许可以恢复全国范围内的计划。"
 trade_goods_flavour.21.t:0 "缺少木材"
 trade_goods_flavour.22.a:0 "我们希望我们不会为此而后悔。"
 trade_goods_flavour.22.desc:0 "[wood_city_scope.GetName]居民的稳定增长导致树木成为该地区的罕见景象，被用于建筑和出口。虽然这里和那里仍有一些树木，但这个地区已无法靠出口木材来维持生计。至少，已经为当地居民找到了新的途径。"
 trade_goods_flavour.22.t:0 "森林被砍伐殆尽"
 trade_goods_flavour.23.a:0 "我们将向宁卡西致敬。"
 trade_goods_flavour.23.b:0 "我们将向神明致敬。"
 trade_goods_flavour.23.c:0 "我们将支持它。"
 trade_goods_flavour.23.d:0 "随着时间的推移，它将逐渐消失。"
 trade_goods_flavour.23.desc:0 "由谷物发酵的金色饮料在[beer_city_scope.GetName]广泛流行，每个居民至少都尝过一次。傍晚时分，工人们坐在酒馆里，面前摆着一杯清凉的饮料，讨论时事和他们的生活，这已经成为一种常态。啤酒已经成为这里的一种生活方式。"
 trade_goods_flavour.23.t:0 "啤酒文化"
 trade_goods_flavour.24.a:0 "以宁卡西的名义，我们将这样做。"
 trade_goods_flavour.24.b:0 "以诸神的名义。"
 trade_goods_flavour.24.c:0 "一个酿酒厂将是有用的。"
 trade_goods_flavour.24.d:0 "这是在浪费钱。"
 trade_goods_flavour.24.desc:0 "随着啤酒变得越来越普遍，对它的需求也大大增加，许多品尝过这种神圣饮料的人再也放不下它了；有些人甚至可以说是上瘾者，尽管他们是少数。一个来自[beer_city_scope.GetName]的富有的酒馆老板找到我们，希望我们能共同资助他开啤酒厂的尝试，希望能增加他的收入。虽然不是很便宜，但让我们的人口保持快乐可以证明是有用的。"
 trade_goods_flavour.24.t:0 "一个啤酒酿造厂？"
 trade_goods_flavour.25.a:0 "让它传播吧!"
 trade_goods_flavour.25.b:0 "我不能允许我们成为一个酒鬼的王国！"
 trade_goods_flavour.25.desc:0 "来自[beer_city_scope.GetName]的当地啤酒文化已经开始传播到邻近地区，每个人都喜欢这种饮料，在辛苦工作一天后，在酒馆里喝着冰冷的玻璃啤酒享受轻松的夜晚。应该说，许多人已经失去了战斗的兴致，更喜欢回忆--或者交媾。\n可悲的是，一种新的现象也变得越来越普遍；天堂饮料的最大消费者变得醉醺醺的，不再能完全控制自己的行为。我们真的希望这种行为在我们的整个领域内蔓延吗？"
 trade_goods_flavour.25.t:0 "国家啤酒文化？"
 trade_goods_flavour.26.a:0 "所有的人都应遵循皇家标准!"
 trade_goods_flavour.26.b:0 "让所有城市都有自己的啤酒文化。"
 trade_goods_flavour.26.desc:0 "自啤酒成为文化中心的一部分以来，一个新问题出现了：这种神圣饮品的庆祝方式应由皇室和神职人员来规范，还是应让城市和乡镇有机地发展自己的啤酒生活方式？这个问题的答案将影响我们国家的未来发展——尽管影响可能不大，因为这种饮品让所有人都感到快乐！"
 trade_goods_flavour.26.t:0 "啤酒文化：全国统一还是地方特色"
 trade_goods_flavour.28.a:0 "建立啤酒厂。我们需要更多的啤酒!"
 trade_goods_flavour.28.b:0 "重点关注城市。"
 trade_goods_flavour.28.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，一个悲剧降临到了我们的国家：没有足够的啤酒给每个人！我们的文化不能像我们通常那样庆祝！我们的文化不能像我们通常那样被庆祝。解决这种短缺的唯一方法是建立更多的啤酒厂，并将大部分剩余的农作物用于制造啤酒，这将是极其昂贵的。\n然而，我们的一些顾问建议只集中供应人口稠密的城市中心，而放弃广大的农村地区。"
 trade_goods_flavour.28.t:0 "啤酒文化：危机"
 trade_goods_flavour.29.a:0 "我们将支持它。"
 trade_goods_flavour.29.b:0 "随着时间的推移，它将逐渐消失。"
 trade_goods_flavour.29.desc:0 "由葡萄发酵而成的神圣饮料在[wine_city_scope.GetName]广泛流行，每个居民至少都尝过一次。傍晚时分，工人们坐在酒馆里，面前摆着一杯清凉的饮料，讨论当前的事件和他们的生活，这已经成为一种常态。葡萄酒已经成为这里的一种生活方式。"
 trade_goods_flavour.29.t:0 "葡萄酒文化"
 trade_goods_flavour.3.a:0 "购买头盔。"
 trade_goods_flavour.3.b:0 "邀请他到我们的宫廷。"
 trade_goods_flavour.3.c:0 "向大师请教。"
 trade_goods_flavour.3.d:0 "用武力夺取头盔。"
 trade_goods_flavour.3.desc:0 "我们听说有一位铁匠大师，一位年事已高的金属加工大师，在这个地区旅行，有消息说他要在[ROOT.GetCountry.GetCapital.GetName]停留几天。这样的机会一定要好好把握!我们可以看看这位工匠有什么可卖的，或者他是否有什么建议愿意传授给我们自己的工匠。或者，他是否愿意和我们一起住在这里？除非我们问，否则我们不会知道任何事情。"
 trade_goods_flavour.3.t:0 "工匠大师"
 trade_goods_flavour.30.a:0 "令人惊叹。"
 trade_goods_flavour.30.desc:0 "自从#E 没药#! 和#E 香#! 在我们的寺庙和仪式中普遍使用后，有人发现了一种散布这种天堂气息的新方法。通过使用一种叫做“香炉”的装置，比用盘子更容易、更快速地散发香气。"
 trade_goods_flavour.30.t:0 "宗教创新：审查者"
 trade_goods_flavour.31.a:0 "大祭司是唯一合法的选择。"
 trade_goods_flavour.31.b:0 "王室成员最合适。"
 trade_goods_flavour.31.desc:0 "随着香炉的兴起，大祭司[SCOPE.sChar('censer_bearer_scope').GetName]声称，[SCOPE.sChar('censer_bearer_scope').GetSheHe]是唯一应该被允许在皇家仪式和国家活动中使用香炉的人。一些[ROOT.GetCountry.GetRuler.GetName]的家庭成员感到愤慨，特别是[SCOPE.sChar('family_censer_bearer_scope').GetName]声称，作为王室的亲属，他们也有权利携带香炉。\n无论如何，无论我们选择谁作为我们的荣誉持香人，都只会有一位。"
 trade_goods_flavour.31.t:0 "荣誉持香人"
 trade_goods_flavour.32.a:0 "就这样做。"
 trade_goods_flavour.32.b:0 "卖掉多余的东西。"
 trade_goods_flavour.32.desc:0 "在我们的一些领地里，一些年轻的香树已经发芽。我们的一位顾问建议在[incense_spread_scope.GetName]种植一些年轻的树木，声称增加的产量将极大地有利于我们的贸易。或者，我们也可以简单地卖掉多余的树苗——也许其他人会发现它们有用。"
 trade_goods_flavour.32.t:0 "蔓延的香树"
 trade_goods_flavour.33.a:0 "就这样做。"
 trade_goods_flavour.33.b:0 "卖掉多余的东西。"
 trade_goods_flavour.33.desc:0 "在我们的一些土地上，一些年轻的没药草丛已经发芽了。我们的一位顾问建议在[myrrh_spread_scope.GetName]种植一些年轻的树丛，声称产量的增加将大大有利于我们的贸易。另外，我们也可以简单地卖掉多余的幼苗--别人可能会发现它们很有用。"
 trade_goods_flavour.33.t:0 "播种没药灌木"
 trade_goods_flavour.34.a:0 "黑曜石在过去从未让我们失望。"
 trade_goods_flavour.34.b:0 "铜和青铜是未来。"
 trade_goods_flavour.34.desc:0 "几千年来，我们的祖先一直使用各种石头制成的工具，#E 黑曜石#! 就是其中之一。这种坚硬的材料对他们很有用，对我们也很有用。然而，近年来，我们遇到了一种其他民族使用的新型材料：金属。最常见的是他们所谓的#E 铜#!，然而它是软的，如果足够薄，可以用手弯曲。尽管如此，铜也有优点，它很少断裂，用它制作的工具也比较锋利。\n虽然我们目前没有任何工匠能够将这种材料塑造成工具，但如果有必要，我们可以向我们的邻居们学习。从更远的国外，我们听说了另一种金属，甚至更不可思议，各种民族都在赞美它：#E 青铜#!!\n\n我们现在要做一个选择：是坚持我们祖先的传统，保存他们的智慧和生活方式，还是拥抱这种前途未卜的新材料的崛起？"
 trade_goods_flavour.34.t:0 "工具的选择：喜爱的材料"
 trade_goods_flavour.35.a:0 "我们的战士需要锋利的刀片。"
 trade_goods_flavour.35.b:0 "为女士们提供镜子是我们所求。"
 trade_goods_flavour.35.desc:0 "我们的黑曜石开采目前进行得非常顺利。事实上，我们有能力在大多数人的日常生活中看不到的物品上花钱。\n有两个工匠找到了我们，提出要创造一个有用的东西。第一个工匠提议制作一些具有出色切割能力的利刃，这样我们的战士就可以很好地武装起来。另一个人提议制作一些镜子，让女士们高兴。"
 trade_goods_flavour.35.t:0 "黑曜石盈余"
 trade_goods_flavour.36.a:0 "有点偏贵，但正是我们需要的。"
 trade_goods_flavour.36.b:0 "事实上，太贵了!"
 trade_goods_flavour.36.desc:0 "今天，一位弗莱彻大师来到宫廷，提出了一个有趣的提议。他制作了一些箭，箭尖是最优质的黑曜石，锋利到你的手指一碰就会流血--他是这么说的。这种品质的箭，价格不菲，所以购买时必须好好考虑。"
 trade_goods_flavour.36.t:0 "黑曜石箭矢"
 trade_goods_flavour.37.a:0 "我确实想要这样的物品。"
 trade_goods_flavour.37.b:0 "遗憾的是，我们无法承担这个费用。"
 trade_goods_flavour.37.desc:0 "最近，一位雕刻家出现在这个地区，创作了许多精美的艺术作品。一些作品是用最黑的黑曜石制成的，一些则是用最白的石灰石制成的，但它们都有一个共同点：它们的主人都非常满意，并为这位流浪艺术家的服务支付了高昂的费用。\n今天，他来到了我们的宫廷，想知道我们是否有兴趣订购一座雕像……"
 trade_goods_flavour.37.t:0 "黑曜石雕像"
 trade_goods_flavour.38.a:0 "我们将继续使用我们的传统工具。"
 trade_goods_flavour.38.b:0 "我们已经看到了新材料的力量。"
 trade_goods_flavour.38.c:0 "我们将回到我们的传统工具。"
 trade_goods_flavour.38.d:0 "我们已经很好地选择了新的金属。"
 trade_goods_flavour.38.desc:0 "几十年前，我们就开始了比较我们祖先用石头制作的工具和用新材料，特别是铜制作的工具的旅程。在经历了这两种类型之后，我们现在可以自信地迈向未来，决定选择一种材料而不是另一种。我们需要牢记，我们在过去承诺过一条道路，离开它不会使[ROOT.GetCountry.GetRuler.GetName]流行。\n虽说肯定所有的工具都会继续存在于我们的社会中，但我们需要标准，而且只能有一个。"
 trade_goods_flavour.38.t:0 "工具的选择"
 trade_goods_flavour.39.a:0 "出售物品。"
 trade_goods_flavour.39.b:0 "在皇宫里展示它。"
 trade_goods_flavour.39.c:0 "把它送给寺庙。"
 trade_goods_flavour.39.desc:0 "一位精通工艺的象牙雕刻家，找到我们并赠送给王室一尊用最纯净的象牙雕刻的宏伟雕像。他雕刻的许多细节显示了他对自己的艺术和神灵的关心和热爱。这是一件令人印象深刻的作品，但我们必须决定如何处理它；在王室中展示它肯定会给游客留下深刻印象，但我们也可以把它送给寺庙，因为它是一个神的代表。\n\n如果我们不得不这样做，我们也可以把它卖掉，尽管雕刻者肯定不会欣赏这种行为......"
 trade_goods_flavour.39.t:0 "宏伟的雕刻"
 trade_goods_flavour.4.a:0 "也许还有更多？告诉人们继续挖掘。"
 trade_goods_flavour.4.b:0 "卖掉这些骨头!我们将从中获得一些东西。"
 trade_goods_flavour.4.c:0 "谈论这个问题都是浪费时间。"
 trade_goods_flavour.4.desc:0 "我们有一个奇怪的故事要与你分享，[ROOT.GetCountry.GetRuler.GetName]，这个故事在[ROOT.GetCountry.GetCapital.GetName]里流传，让任何停下来听的人都觉得心痒痒。\n\n一些工人在山上挖掘铜和其他金属，这时发现了巨大的骨头，比我们见过的任何骨头都要大。虽然这些人很害怕，但他们继续挖掘，并设法找到了一个巨大的头骨--这些骨头是属于什么可怕的野兽？这个国家很久以前就有怪物或龙吗？\n\n尽管这个故事很有趣，但我们也许应该在某些时候介入。"
 trade_goods_flavour.4.t:0 "发现大骨头"
 trade_goods_flavour.40.a:0 "没有人会质疑我的权威。"
 trade_goods_flavour.40.b:0 "大祭司肯定会对此表示感谢。"
 trade_goods_flavour.40.c:0 "一个较小的也无妨..."
 trade_goods_flavour.40.d:0 "遗憾的是，我们目前无法承担这个费用。"
 trade_goods_flavour.40.desc:0 "一位雕刻大师找到我们，提出为我们制作一个宏伟的宝座，每一寸都是我们的统治和王国的雕刻。与其把宝座留给自己，我们还可以把它献给我们的继承人或大祭司......\n然而，这位工匠要求的价格相当昂贵，所以我们在接受他的提议之前应该三思而行。"
 trade_goods_flavour.40.t:0 "象牙王座"
 trade_goods_flavour.41.a:0 "追踪这个动物！"
 trade_goods_flavour.41.b:0 "它太危险了。"
 trade_goods_flavour.41.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的几天内，有人看到一头公象，适合进行盛大的狩猎。猎杀这样一只宏伟的动物，肯定是皇室壮观和力量的有力展示。\n只有最强壮和最精明的猎人才能猎杀这样的动物而不受伤--[ROOT.GetCountry.GetRuler.GetName]是其中之一吗？"
 trade_goods_flavour.41.t:0 "狩猎大象"
 trade_goods_flavour.42.a:0 "这都是[ROOT.GetCountry.GetAdjective]生活的一部分...。"
 trade_goods_flavour.42.b:0 "这是个正确的决定。"
 trade_goods_flavour.42.desc_1:0 "灾难！[ROOT.GetCountry.GetRuler.GetName] 勇敢地与这只动物搏斗，但当动物被追踪到时，很明显它的强大超出了我们所有猎人的能力，几乎没有人能活着逃脱。我们的 [ROOT.GetCountry.GetRulerTitle] 将会被以最高的荣誉安葬。"
 trade_goods_flavour.42.desc_2:0 "追踪猎物很容易，但一旦找到，它并不像许多人想象的那样容易猎杀，反而给猎人们造成了许多伤害。幸运的是，没有人死亡，[ROOT.GetCountry.GetRuler.GetName] 可以宣称战胜了这头野兽，但这些伤痕是否值得这场狩猎呢？"
 trade_goods_flavour.42.desc_3:0 "胜利了！我的[ROOT.GetCountry.GetRulerTitle]!从追踪动物到结束它的生命，众神一直站在我们这边。这次狩猎没有发生意外，只有几个参与者受了轻伤。这是伟大而令人振奋的一天!"
 trade_goods_flavour.42.t:0 "狩猎大象"
 trade_goods_flavour.43.a:0 "追踪这个动物！"
 trade_goods_flavour.43.b:0 "它太危险了。"
 trade_goods_flavour.43.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的几天内看到了一只雄鹿，适合进行盛大的狩猎。这肯定是皇室宏伟和力量的强大展示，将这样一个宏伟的动物打倒。\n只有最强壮和最精明的猎人才能猎杀这样的动物而不受伤--[ROOT.GetCountry.GetRuler.GetName]是其中之一吗？"
 trade_goods_flavour.43.t:0 "雄鹿狩猎"
 trade_goods_flavour.44.a:0 "这都是[ROOT.GetCountry.GetAdjective]生活的一部分...。"
 trade_goods_flavour.44.b:0 "这是个正确的决定。"
 trade_goods_flavour.44.desc_1:0 "灾难！[ROOT.GetCountry.GetRuler.GetName] 勇敢地与这只动物搏斗，但当动物被追踪到时，很明显它的强大超出了我们所有猎人的能力，几乎没有人能活着逃脱。我们的 [ROOT.GetCountry.GetRulerTitle] 将会被以最高的荣誉安葬。"
 trade_goods_flavour.44.desc_2:0 "追踪猎物很容易，但一旦找到，它并不像许多人想象的那样容易猎杀，反而给猎人们造成了许多伤害。幸运的是，没有人死亡，[ROOT.GetCountry.GetRuler.GetName] 可以宣称战胜了这头野兽，但这些伤痕是否值得这场狩猎呢？"
 trade_goods_flavour.44.desc_3:0 "胜利了！我的[ROOT.GetCountry.GetRulerTitle]!从追踪动物到结束它的生命，众神一直站在我们这边。这次狩猎没有发生意外，只有几个参与者受了轻伤。这是伟大而令人振奋的一天!"
 trade_goods_flavour.44.t:0 "雄鹿狩猎"
 trade_goods_flavour.45.a:0 "追踪这个动物！"
 trade_goods_flavour.45.b:0 "它太危险了。"
 trade_goods_flavour.45.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的几天内看到了一头野猪，适合进行盛大的狩猎。猎杀这样一只宏伟的动物，肯定是皇室壮观和力量的有力展示。\n只有最强壮和最精明的猎人才能猎杀这样的动物而不受伤--[ROOT.GetCountry.GetRuler.GetName]是其中之一吗？"
 trade_goods_flavour.45.t:0 "猎野猪"
 trade_goods_flavour.46.a:0 "这都是[ROOT.GetCountry.GetAdjective]生活的一部分...。"
 trade_goods_flavour.46.b:0 "这是个正确的决定。"

l_simp_chinese:
 BOHEMIAN_REPUBLIC_FINAL_NAME:0 "玻伊海弥亚共和国"
 FAMILY_ARIOVISTID:0 "阿利奥维斯特德"
 NICKNAME_ARIOVISTUS:0 "“阿里俄维斯图斯”"
 ariovistid:0 "阿里俄维斯图斯的血脉"
 ariovistid_desc:0 "阿里俄维斯图斯是一个授予伟大军事领袖的高卢荣誉称号。它曾被授予一位苏维汇战士，他参加并赢得了许多战斗，有时甚至与高卢人并肩作战。在这些战役中，他学会了高卢语言，并与数个高卢民族结成联盟。\n\n虽然他的本名已经淡去，但他的功绩至今仍被铭记。\n\n#G 此特质可以通过母系或父系传承。#!"
 flavor_gaul.1.a:0 "我生病了，希望能寻求穆洛的治疗。"
 flavor_gaul.1.b:0 "我的未来晦暗不明，需要她们的神谕为我点燃前进的火炬。"
 flavor_gaul.1.c:0 "我乞求图塔蒂斯祝我在海上好运。"
 flavor_gaul.1.d:0 "我必须在接下来的战斗中赢得斯默特里奥斯的青睐。"
 flavor_gaul.1.desc:0 "你已经走了很远的路，一个老妪却不让你继续前进了。“两腿中间有把的不能过河。”她咯咯地笑道:“无论国王，首领还是农人，只有女性才能访问这座神圣的岛屿。”\n\n你透过雾蒙蒙的水面向外望去，只看到海浪之外那座神圣岛屿的模糊轮廓。加利塞尼的九位女祭司住在那个岛上，人们相信这些老太婆可以把自己变成野兽，并且可以操纵风。你来这里是因为你需要他们的帮助。\n\n“那你就走吧，老婆子”，你朝老妇人吼道。“我和加利塞尼有生意要做，但我将向众神致敬，不再前进。”老妪咧开嘴大笑，嘴里没有一颗牙齿，并期待地伸出她张开的手掌。她朦胧的眼睛疯狂地来回转动，就是不看你一眼。\n\n你不情愿地把一袋叮当作响的硬币放在她手里。“我的首领，你要这些神圣的女祭司干什么?”她嘲弄地问道，眼睛突然一眨不眨地盯着你。"
 flavor_gaul.1.descf:0 "你凝视着海峡对岸，神秘的加利塞尼统治着那里。一位弯着腰、和蔼可亲的老妇人站在你身边，无力地指着地平线上一个黑色的轮廓。‘夫人，那是您必须去的地方，去寻找神的仆人，’她虚弱地说道。\n\n远处的小岛笼罩在薄雾中，只有女性被允许进入。’我要去那儿，我带了钱‘你对老妇人说，她听到后就笑起来。’那我们现在就走吧，‘她微笑着，不自然地跑开了。\n\n你跟着她走，很快就发现那个她正在向几个渔民打手势，让他们下船。船头有一盏大灯笼和一组桨，但女人向你保证她会独自带你去岛上。’我们不需要男人，而且他们可能不会离开，‘当渔民们不情愿地离开时，她喃喃自语。\n\n你发现自己在小船上，虚弱的女人看起来不再那么虚弱了。她使劲地划，划到一半时，她问道:“夫人，您找女祭司有什么目的?”她的眼睛正盯着你，这双眼睛仿佛是一个年轻女人而非老妇的。"
 flavor_gaul.1.e:0 "我改变主意了，老太婆，把我的钱还给我！"
 flavor_gaul.1.t:0 "加利塞尼"
 flavor_gaul.10.a:0 "这就是我的样子，嗯？我从未见过比这更漂亮的金币。"
 flavor_gaul.10.desc:0 "一天早晨，你正用一些昨夜剩下的冷肉充饥，一名顾问走了进来，几乎拖着一个沉重的粗麻袋。你手里拿着一根兔骨，示意询问他们带来了什么；令你惊讶的是，一把金币被呈到你面前。“啊，对，我现在想起来了。”你边吃边说道。是的，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们收到了你下令铸造的第一批硬币。它们将成为我们土地上使用的新标准。\n\n你从杯中长饮一口，拿起一枚硬币举到光下，金币如火般闪烁，而正面那张威严可怖的面容立刻吸引了你的目光。"
 flavor_gaul.10.t:0 "玻伊海弥亚的标准"
 flavor_gaul.11.a:0 "终于有了一个合适的祭祀场所，一个配得上强大的玻伊海弥亚人的地方。"
 flavor_gaul.11.desc:0 "你年纪已足够大，还记得柏弥亚只是一个小定居点时的模样，那不过是首都腹地一个不值一提的地方。但在你的领导下，事情已经改变。不仅一座真正的城市取代了曾点缀林地的破旧棚屋与临时茅棚，更伟大的成就也已经完成：一座大神庙，一座在如此北方从未见过的神庙，已建于柏弥亚新城中心。"
 flavor_gaul.11.t:0 "柏弥亚的大神庙"
 flavor_gaul.12.a:0 "我们的征途还没有结束，只是刚刚开始。"
 flavor_gaul.12.desc:0 "我们收到消息，我们曾经的敌人——可鄙的#E 卡瓦迪人#!和#E 马尔科曼人#!，已经被我们的士兵彻底摧毁，他们像狗一样四散逃入曾经的家园的树林和森林中。他们已经彻底覆灭，再也无法质疑我们的霸权；这是一次非凡的成就，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。"
 flavor_gaul.12.t:0 "粉碎日耳曼人"
 flavor_gaul.13.a:0 "我们再也不用担心达契亚人了。"
 flavor_gaul.13.desc:0 "我们曾经有充分理由畏惧凶悍的达契亚人，甚至本部落中有人敢说我们在各方面都不如东方对手，尤其是在军事上。你虽然对这些批评怒不可遏，将其视为对你领导权的隐晦攻击，但你再次战胜敌人，堵住了那些质疑你权威之人的闲言碎语。最终，达契亚镰刀终究敌不过玻伊人长矛！"
 flavor_gaul.13.t:0 "达契亚的毁灭"
 flavor_gaul.14.a:0 "我们会提供资金支持。"
 flavor_gaul.14.b:0 "我们虽然囊中羞涩，但有足够的人力。"
 flavor_gaul.14.c:0 "转念一想，我改变主意了——叫他们停下来吧。"
 flavor_gaul.14.desc:0 "我们已经派了一些我们之中最优秀的人去北方，目的是为了寻找适合我们扩张的领土，他们提供了一份很有前景的初步报告。我们的探险者向前推进，穿过大片的土地，在山脚下停了下来，回来后告诉我们有关原始森林的故事，那儿的草地非常适合畜牧业，甚至还有大量的粘土——这让我们可以开始生产陶器。当然，这种殖民的努力会付出相关的成本，但你已经提前做好了准备，不是吗？"
 flavor_gaul.14.t:0 "玻伊海弥亚的迁徙"
 flavor_gaul.15.a:0 "成本可以忽略不计——我命令你就这么办吧。"
 flavor_gaul.15.b:0 "我们的部族会有些分散，但暂时的挫折是值得的。"
 flavor_gaul.15.c:0 "欲速则不达——我们已经满足于目前已经拥有的东西了。"
 flavor_gaul.15.desc:0 "我的首领，在您如此明智地带领我们来到新的殖民省份后，我们的人民过的日渐繁荣兴旺，肥沃的土地和原始森林激励着我们更多的人离开故乡，到遥远的地方定居。山与山之间还有一些区域我们还没有涉足，但我们应该加倍努力，立即将它们拿下——你可能会问为什么，因为那里有很好的狩猎场地，有很多野生动物可以割取皮毛，在这些地区还能找到大量的石头和木头。"
 flavor_gaul.15.t:0 "山间之地"
 flavor_gaul.16.a:0 "我们有意志力和人力——就按你说的那样办吧。"
 flavor_gaul.16.b:0 "立即派遣移民，无论付出多少代价。"
 flavor_gaul.16.c:0 "在适当的时候吧……现在并不是一个好时机。"
 flavor_gaul.16.desc:0 "现在我们已经在北方的土地上定居了，这让我想起一句古老的格言：‘你拥有的越多，问题似乎就越多。’我们相信我们有能力保卫我们的家园，抵御任何可能挑战我们的人。然而与我们的其他领土相比，我们的东侧赤裸裸地暴露出来。毫无疑问，我们南方的部落，一旦风闻我们的发展，就可能会试图靠近我们，希望阻止我们进一步扩张。话虽如此，我们应该考虑向东推进——当地的一些河流将成为一个很好的天然边界。您怎么看?"
 flavor_gaul.16.t:0 "玻伊海弥亚盆地"
 flavor_gaul.17.a:0 "这打动了我——祝福你早日成功。"
 flavor_gaul.17.desc:0 "哦，我的首领，我们需要您的许可来实行一项新计划。似乎我们有一些人口拥挤的问题，但谢天谢地，这是很容易解决的问题。简单来说，我们的人民鼓噪要新的土地以居住；我们的人口日渐增加，目前所消耗的牧草亦不足以维持我们未来牧群的增长。然而，我们周围迷人的土地，有肥沃的良田和丰富的自然资源，只要您一声令下，我们就会派出探险者。如果他们找到了符合我们需求的土地，您将会率先知道。"
 flavor_gaul.17.t:0 "玻伊海弥亚盆地"
 flavor_gaul.18.a:0 "这太棒了，划，都可以划。"
 flavor_gaul.18.b:0 "你为什么要拿这个来烦我?我做得还不够多吗?"
 flavor_gaul.18.desc:0 "我的首领，当我告诉您这个消息时，您一定会和我们一样兴奋。的确，我们已经分散在你们现在所占领的土地上，但我们发现了更多值得占领的土地。就在苏德忒山脉以北，那儿的省份盛产野生动物，哥特尼亚的采石场也在等待开发。老实说，我们的人民已经在那里了……您只需要让它正式划入我们的版图。"
 flavor_gaul.18.t:0 "越过群山"
 flavor_gaul.19.a:0 "我们即将迎来盛世！"
 flavor_gaul.19.desc:0 "终于，我们彻底胜利的时刻到来了！感谢 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，是他指引着我们前进的每一步，我们取得了许多成就，包括领土的扩张和贸易收入的增长。在我们的历史上，#E 波西#!从没有像现在这样成功，也从没有像现在这样站得这么高；愿诸神继续保佑我们的努力成果！"
 flavor_gaul.19.t:0 "玻伊海弥亚联邦"
 flavor_gaul.199.a:0 "我承诺会负责任地行使我的君主权力"
 flavor_gaul.199.b:0 "[ROOT.GetCountry.GetName]的所有权力都属于人民"
 flavor_gaul.199.desc:0 "今天清晨，在[ROOT.GetCountry.GetCapital.GetName]举行了一场简单而不起眼的仪式。尽管太阳刚刚升起，但仍有数百人出席了这一重要场合。[ROOT.GetCountry.GetRuler.GetName]召集了所有的#E 部落长老#!来到首都，因为[ROOT.GetCountry.GetRulerTitle]不希望引起对[ROOT.GetCountry.GetRuler.GetHerHim]的任何不必要关注。此次会议的原因很简单：现在我们已经发展成一个强大的国家，人民渴望一种新的治理形式。\n\n由于[ROOT.GetCountry.GetRuler.GetFirstName]在我们国家的卓越地位，这一选择最终由[ROOT.GetCountry.GetRuler.GetHerHim]决定。"
 flavor_gaul.199.t:0 "玻伊海弥亚的崛起"
 flavor_gaul.2.a:0 "我已经很久没有感觉身体这么舒服了。"
 flavor_gaul.2.af:0 "我感觉好得出奇。"
 flavor_gaul.2.b:0 "那个女人去哪儿了？"
 flavor_gaul.2.bf:0 "我是怎么到这儿来的？"
 flavor_gaul.2.c:0 "好痒，那个老太婆呢？"
 flavor_gaul.2.cf:0 "那罐子里装的是什么？"
 flavor_gaul.2.da:0 "第二天你独自一人醒来。你不记得昨晚发生了什么，但你的帐篷里充满了一种特殊的香味。"
 flavor_gaul.2.daf:0 "第二天，你在小溪潺潺的流水声中醒来，手里拿着一个开裂的罐子。你站起来，感到有点头晕，但不知怎的，你的精神振作起来了。"
 flavor_gaul.2.db:0 "当你早上醒来的时候，你感觉跟昨晚喝了很多的酒似的。女祭司不见了。"
 flavor_gaul.2.dbf:0 "当你醒来时，对前一天只有模糊的记忆。老妇人坐在小溪边，洗着脚，转过身来，用一个没有牙齿的微笑向你问好。"
 flavor_gaul.2.dc:0 "你醒来时感到浑身发痒，却不记得昨晚发生了什么。你到底怎么了？"
 flavor_gaul.2.dcf:0 "第二天，一声响亮的叫声吵醒了你，你发现自己在海滩上，周围都是海鸥。你立刻感到胃部一阵刺痛，不得不再次躺下。"
 flavor_gaul.2.desc:0 "几天过去了，你不耐烦地在岸边扎营，但这天晚上，月亮低垂，雾在海滩上翻腾，黑暗的水面上出现了一道光。你看到一盏橙色的灯笼固定在一艘小船的船头，船靠在沙滩上，老妪带着一个年轻的女子急匆匆地向你走来。\n\n女仆穿着一件精致的亚麻斗篷，胸前别着一枚华丽的胸针。‘这位女祭司已经问过了神明。’老妪不逊地说，然后溜达到树林里去了，留下女子和你单独在一起。你面前的年轻女子是惊人的美丽，让你感到一种不该有的冲动。\n\n她走近你，轻声说:‘我的首领，你在寻求穆洛的建议吗?’你凝视着她乌黑的眼睛，空气中弥漫着多种草药的香味。她的呼吸越来越重，金属胸针压在你的胸口。‘穆洛的赠礼最好私下送，’她低声说着，把手放在你的手上。\n\n"
 flavor_gaul.2.descf:0 "第二天，你在岛中心的一个小树林里。月亮在树林里投下了黑影，树林的中心放着一块巨大的雕刻过的石头。九个身披斗篷、身材修长的身影围绕着它，每个人都在对一个无形的存在低语，每声低语似乎都承载着十个人的力量。\n\n这些声音叠加在一起，是一种刺耳的噪音，而不是在场的九位神仆的柔和声音。有位神仆发现了你的存在，向你走过来。‘这位夫人得了一种病，女祭司，需要穆洛的祝福，’老妇人虚弱地说道，旅途中突然表现出来的力气已经消失了。\n\n‘我明白了，’女祭司犹豫地说。‘跟我来。’你转身向老妇人告别，但她已经消失了，你决定追上女祭司。过了一会儿，你们俩来到一条小溪边，女祭司停了下来。\n\n‘穆洛是一位仁慈的神，但世上没有什么是免费给予的。’她细若蚊声地说着，从斗篷里拿出一个小罐子递给你。她只说了一句‘喝’，然后远离你走了五大步。\n\n你喝下里面的液体，很快世界就开始剧烈地旋转起来。‘睡’，你听到女祭司安静的声音，世界已经变黑了，颠倒了，你只能看到的上面的月亮，可望而不可即。\n\n"
 flavor_gaul.2.t:0 "加利塞尼的治愈之力"
 flavor_gaul.20.a:0 "让我们用绳子牢牢拴住坎塔布里亚人。"
 flavor_gaul.20.a.tt:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.20.b:0 "我们的核心领土将在我们的统治下发展和繁荣。"
 flavor_gaul.20.b.tt:0 "我们将保有我们的土地并加速同化当地被征服的人。"
 flavor_gaul.20.desc:0 "今天早上我们收到消息，我们新近征服的坎塔布里亚省的第一批货物到达了 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，这在市场上引起了巨大的骚动，每个人都争先恐后地购买他们能买到的东西。尽管这一地区出产的珍贵宝石只卖给最富有的人，但坎塔布里亚的优质皮革是无论贫富，每个人都想要的。毫无疑问，这是由于它独特的精美样式。\n\n当你于街上的喧嚣中陷入沉思时，你被提醒还有其他涉及坎塔布里亚的问题需要你的关注。该省的未来会是怎样的？"
 flavor_gaul.20.t:0 "坎塔布里亚的海岸"
 flavor_gaul.21.a:0 "不是所有的省份都有资格被认为是我们的家园。"
 flavor_gaul.21.a.tt:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.21.b:0 "卢西塔尼亚人最终会接受我们的生活方式。"
 flavor_gaul.21.b.tt:0 "我们将保有我们的土地并加速同化当地被征服的人。"
 flavor_gaul.21.desc:0 "在这个特别忙碌的日子里，与当地土地所有者及其随从商谈的会议举行了大半个上午， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]被一个顾问提醒卢西塔尼亚省远离 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]腹地。在稍微延后这件事之后，毫无疑问，由于我们繁忙的日程安排，我们现在必须就如何管理这块领土做出决定。"
 flavor_gaul.21.t:0 "卢西塔尼亚的未来"
 flavor_gaul.22.a:0 "完全占有这些土地很诱人，但这关系到我们的声誉。"
 flavor_gaul.22.a.tt:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.22.b:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.22.b.tt:0 "我们将保有我们的土地并加速同化当地被征服的人。"
 flavor_gaul.22.desc:0 "我们战无不胜的军队已经征服了许多地方，给那些愚蠢到要反抗的城市带去灰烬和痛苦。我们不仅统治了周边那些争吵不休的部落，而且还与更强大的势力对抗并坚持自己的立场，以证明我们与他国是平等的，我们并不是什么野蛮人。现在，在这短暂的胜利时刻，当我们欢呼军事上的成功时，是时候决定新征服土地的命运了。"
 flavor_gaul.22.t:0 "直到卡尔培的海格力斯之柱"
 flavor_gaul.23.a:0 "拥有另一个附属国更符合我们的利益。"
 flavor_gaul.23.a.tt:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.23.b:0 "这片土地将归我们所有。"
 flavor_gaul.23.b.tt:0 "我们将保有我们的土地并加速同化当地被征服的人。"
 flavor_gaul.23.desc:0 "当长老们今天聚集在一起开会时，议程上最紧迫的事务之一当然是弗里西问题，特别是我们现在所考虑的——如何处理我们已经完全控制的这个地区。"
 flavor_gaul.23.t:0 "有关弗里西亚的决议"
 flavor_gaul.24.a:0 "当地土著将为我们役使，但仍能保留某些特权。"
 flavor_gaul.24.a.tt:0 "我们将把有问题的省份作为附属国释放。"
 flavor_gaul.24.b:0 "俄耳卡得斯将永远是我们祖国的一部分。"
 flavor_gaul.24.b.tt:0 "我们将保有我们的土地并加速同化当地被征服的人。"
 flavor_gaul.24.desc:0 "当我们反思我们籍籍无名的起源，并将其与我们目前的现状进行比较时，我们会为诸神赋予我们的巨大责任而感到谦卑；谁能预见到我们的领土会变得如此广阔？甚至水手之间流传的神话中遥远的土地也被纳入我们的统治。我们现在必须做出选择：我们是吞并这些遥远的岛屿，还是建立另一个附庸国？"
 flavor_gaul.24.t:0 "遥远的俄耳卡得斯"
 flavor_gaul.25.a:0 "我们的财富将我们带到如此崇高的高度，这将始终是我们的首要任务。"
 flavor_gaul.25.b:0 "向世界宣告，属于我们的时代开始了！"
 flavor_gaul.25.desc:0 "几周前， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 命令他的顾问们聚集在 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 举行重要会议。当会议日期到来时， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 庄严地站在与会者面前，自信地演说，他回顾了我们最近的历史和我们的人民所获得的难以想象的成功。演讲以‘世界必须承认我们是大西洋主宰者的这一天到来了’结束，全场爆发出热烈的欢呼声。\n\n举手示意安静后， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 说出了自己内心的疑惑：我们是否应该变革我们的治理体系，以适应我们客观环境的变化。"
 flavor_gaul.25.t:0 "大西洋主宰者"
 flavor_gaul.26.a:0 "为参战的士兵们庆祝！这是他们的功劳。"
 flavor_gaul.26.desc:0 "我们狠狠羞辱了意大利的强权之一，可恨的战争贩子罗马人，我们把这些僭主赶出了他们自己的首都——这对他们来说无疑是一种苦涩的讽刺，因为他们曾经无情地对其他国家所干的现在反而落到了自己头上。关于罗马之围的故事已经在你的军队中传开了，我们士兵的骁勇善战在口口相传几乎达到了神话中英雄的高度。甚至于现在在我们势力范围之外遥远的宫廷里，那些紧张不安的国王们都在召集顾问，气喘吁吁地询问我们的陆军和舰队的实力如何，我们是否能威胁到他们。\n\n这很好——让他们都害怕我们吧。"
 flavor_gaul.26.t:0 "对罗马的重大胜利"
 flavor_gaul.27.a:0 "我想知道这些探险者会发现什么……"
 flavor_gaul.27.desc:0 "虽然我们在外交上的纠葛无疑对国家有利，但伴随任何新事物而来的还有其他一些难以察觉的变化；过去是这样，将来也会是这样。\n\n说白了，我们的人民越来越沉湎于物质上的富足，他们从东方的国王那里进口奢侈品，并花费大量的钱财来支付这些商品。日复一日，我们的港口挤满了商人，从世界尽头的沙漠中兜售丝绸和香料，仍难以满足我们的人民。但这些外国人到底是谁，是谁给我们带来了像‘糖’这样奇怪的东西?没有人听说过这样的事情。 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 希望能更好地了解这些遥远的地区，并在此过程中建立更多的贸易联系。他决定派一队探险者去东方，让他们记下他们所看到的一切。"
 flavor_gaul.27.t:0 "对奢侈品的兴趣"
 flavor_gaul.28.a:0 "为你们的任务成功而干杯！"
 flavor_gaul.28.desc:0 "几个星期前，我们接到命令，从征召的士兵中挑选一批勇敢的探险者，他们将前往东部执行某种侦察任务，他们终于回来了！这些人立即被命令前来觐见，并宣布他们在讲述见闻后将有机会休息， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 从宫殿里冲下来迎接他们，急切地想听听他们都学到了什么。\n\n疲惫不堪的士兵们被允许斜躺下来，侍者斟上葡萄酒，旅途中的故事从他们口中娓娓道来。我们的人沿着地中海向东航行直至终点，他们沿着海岸徘徊，并在沿途的每一个主要城市停留。据说，他们还参观了 [GetProvince('(int32)7691').GetArea.GetRegion.GetName] 这片古老的土地。我们的人谈到他们受到的款待，并说道在这些遥远的土地上有许多奇观可供欣赏，然而几个世纪以来，残酷的战争折磨着这个地区；那儿的国王们为了自己的野心争端不休，永无和平。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 询问他们是否带回了什么东西，当听到我们船只的货舱里有一个名副其实的宝库时，他微笑起来；我们不仅获得了精美的该地区的地图，而且我们的冒险家很有远见，买了尽可能多的卷轴和文本——哲学书卷、医学书卷、历史和系谱。我们的人民很尊重智慧的结晶，因此我们可以从外族人的著作中学到很多东西。"
 flavor_gaul.28.t:0 "多元文化的影响"
 flavor_gaul.29.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，既然我们已经打败了敌人，我们必须作出决定。如你所见，我们的习惯是在新征服的领土上建造一座城市，因为我们发现，当涉及到地方行政事务时，这样做是最好的。我们现在从哪里开始建设呢？我听说有好几个地点可供我们选择，都是我们未来计划的优良选择。"
 flavor_gaul.29.t:0 "乐土"
 flavor_gaul.3.a:0 "你已向众神致敬，他们会照亮你的道路。"
 flavor_gaul.3.b:0 "预期会有意外，未来难以知晓。"
 flavor_gaul.3.c:0 "害怕吧，神明看到了你前路的厄运。"
 flavor_gaul.3.desc:0 "几天过去了，你在岸边扎营，焦急地等待着老妪的归来。这天晚上，月亮低垂，雾在海滩上翻腾，一道光出现在黑暗的水面上。\n\n很快，你看到那是一只小船，船头上挂着一盏橙色的灯笼。一靠岸，老妪就带着一个年轻的女子急匆匆地向你走来。女子穿着一件精致的亚麻斗篷，胸前别着一枚华丽的胸针。\n\n‘是您叫这位女祭司过来的，我的首领。’老妪装作敬畏的样子说道。随后老妪在海滩上召集其他人挥舞火炬，而女祭司接近你，她严肃地说:‘你是在寻求神灵的接见。’你想要说什么，但她用她那白皙的手指放在你的嘴唇上示意你安静。\n\n‘神都知道。’她说，然后强迫你跪下来，火把在黑暗中围绕着你舞动。女祭司开始用一种痛苦的语气吟诵，有时她吟诵的很清楚，但接下来就变成了难以理解的方言，围绕在你们两人周围的男人女人在低语和跳舞，黑暗中一团团火焰在旋转。女祭司抽搐着，然后扭动并转过身体，似乎有种超凡脱俗的力量在她身上，她的圣咏打破了四周恐惧和敬畏的尖叫声。\n\n突然，四周的火焰无声地熄灭，女子倒在你面前，浑身是汗。她颤抖着慢慢向你爬过来，说道"
 flavor_gaul.3.descf:0 "第二天，你在岛中心的一个小树林里。月亮在树林里投下了黑影，树林的中心放着一块巨大的雕刻过的石头。九个身披斗篷、身材修长的身影围绕着它，每个人都在对一个无形的存在低语，每声低语似乎都承载着十个人的力量。\n\n这些声音叠加在一起，是一种刺耳的噪音，而不是在场的九位神仆的柔和声音。有位神仆发现了你的存在，向你走过来。‘这位夫人乞求神的指引’，佝偻的老妇人说道，试图行屈膝礼，她又变回了那个虚弱的老样子。\n\n‘我想知道神为我准备了什么’你试图阐明，但女祭司已经抓住你的手，走向石头那边。当你走近时，其他八个人隐匿在黑暗的树林里，而带你过来的女子让你跪在石头前。\n\n她拿起一个木碗，朝向月亮将其举起，开始吟唱。圣咏的响度不断变化，而你一直跪着，直到女祭司突然停止吟唱，碗里的东西倒在你身上。你闻到了铁的气味，女子跪在你面前，双手抱着你的耳朵，轻声说道"
 flavor_gaul.3.t:0 "加利塞尼的神谕"
 flavor_gaul.30.desc:0 "南方的山脉和丘陵对我们的部队来说并不是阻碍，我们已经习惯了穿越困难的地形；如果我们的敌人认为他们可以躲在森林和山麓，那他们就大错特错了。既然我们已经征服了这个地区，我们必须选择一个地方建造城市；我们曾为这些土地而战，现在再也不会离开它们了。"
 flavor_gaul.30.t:0 "向南扩张"
 flavor_gaul.31.desc:0 "我们已经征服了革努阿的海岸线，将我们的势力扩展到革努阿湾，这儿是 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 的骄傲。曾经，我们的人民背靠山崖勉强生存，但现在，我们的势力像河流一样流向大海。今晚，在 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 中有很多地方可以庆祝。但我们必须先决定将如何处置我们的新土地。"
 flavor_gaul.31.t:0 "获得革努阿"
 flavor_gaul.32.desc:0 "马匹、橄榄、鱼和盐；这片维涅托人曾经居住过的土地确实受到了众神的祝福，充满了我们渴求的资源。难怪他们的抵抗如此激烈，因为谁会愿意放弃这种上天赐予的财富呢？谢天谢地，他们没能阻止我们扩张……现在，一个新的问题出现了。我们应该选择一个地方来建设，以巩固我们在这个地区的力量。"
 flavor_gaul.32.t:0 "维涅托的胜利"
 flavor_gaul.33.desc:0 "多年来，我们对伊特鲁里亚人的印象是；他们坚固的城市充满了我们从未见过的财富，长期以来一直吸引着我们的士兵，希望有朝一日爬上高耸的城墙，把它们占为己有。没有人会拒绝我们的战士想要的东西。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]一声令下，率领我们的士兵进入伊特鲁里亚的腹地。他们完成了所有要求完成的事情，现在我们整个国家都在庆祝。我们现在有了一份愉快的苦差事——决定这一地区未来的命运。"
 flavor_gaul.33.t:0 "伊特鲁里亚的终结"
 flavor_gaul.34.desc:0 "今天对我们的人民来说是个伟大的日子，因为我们已经扩张到科西嘉岛并将其据为己有。我们的祖先会为我们感到多么自豪！他们骄傲的后代，乘风破浪，征服遥远的岛屿，是无可争议的陆地和海洋的主人……他们肯定会祝福我们的努力。来吧，让我们来决定如何管理科西嘉；您觉得呢， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]？"
 flavor_gaul.34.t:0 "科西嘉的未来"
 flavor_gaul.35.a:0 "罗慕路斯建立的城市。"
 flavor_gaul.35.b:0 "卡普阿很适合我们。"
 flavor_gaul.35.c:0 "涅亚波利斯古城可能需要一些新居民。"
 flavor_gaul.35.d:0 "奥斯蒂亚就挺好。"
 flavor_gaul.35.desc:0 "战争已经结束了，我们胜利的消息飞速传播，远远超出了[GetProvince('(int32)4').GetArea.GetRegion.GetName]的海岸。很多人不相信我们已经打败了罗马人，声称这样一个强大的共和国绝不会沦陷于“野蛮人”之手。\n\n对所有持怀疑态度的人，我们发出邀请；来到台伯河畔的七丘之城，看看是谁控制着城门。现在罗马共和国已经湮灭为灰烬，我们必须做出决定以管理这片土地。"
 flavor_gaul.35.e:0 "布卡？呃，我喜欢那个名字。"
 flavor_gaul.35.t:0 "罗马成灰"
 flavor_gaul.36.desc:0 "我们已经征服了整个[GetProvince('(int32)4').GetArea.GetRegion.GetName]。尽管我们曾遇到过许多奇怪的民族，但现在我们已经到达了半岛的尽头。我们把目光投向那些古老的城市，它们早在我们第一次越过阿尔卑斯山脉之前就已经建立起来了。\n\n尽管他们有着所谓的优越感，但我们还是屠杀了城市里的居民，摧毁了他们反抗的力量，而代之以我们自己的控制。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]一直以来都鄙视大希腊的那些畏首畏尾的城邦，他也知道那些希腊人认为我们不过是野蛮人——因此这对他们来说是多么痛苦的一天。既然我们控制了这个地区，就让我们来决定它的未来吧。"
 flavor_gaul.36.t:0 "大希腊屈服"
 flavor_gaul.37.a:0 "我们为在兹取得的成就感到自豪。"
 flavor_gaul.37.desc:0 "尽管耗费了大量资源，但我们终于收到消息，我们在[GetProvince('(int32)3571').GetName]的工作完成了——我们的城市已经建成了一段时间，有相当多的人住在那里，希望还会有更多的人来。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]长期以来一直强调这个地区的重要性，他预言我们这座城市将统治其他所有的城市。时间会证明这个预言是否成真。"
 flavor_gaul.37.t:0 "墨迪俄拉农崛起"
 flavor_gaul.38.a:0 "尽管我们更强大，但我们可以向意大利人学习一两件事。"
 flavor_gaul.38.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]提起来通杯啜饮，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]品尝了一些当季出产的葡萄酒。‘你说这些葡萄生长在法勒努斯山附近？我想我以前听说过这种酒。'\n\n是的，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]。法勒努斯山离这里不远……您觉得它合您的口味吗？’侍者是一个二十岁的舞女，后退时端庄地低下眼睛。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]大笑起来，一口气喝光了[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]来通杯里的酒液。‘我发现自己偏爱雷蒂亚葡萄酒，这是我有幸品尝过的最好的葡萄酒，这里的文化也有些东西越来越吸引我。'\n\n‘就像那饮料……’服务员低声对自己说道，当[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]又喝光了另一杯时。"
 flavor_gaul.38.t:0 "意大利文化"
 flavor_gaul.39.a:0 "贵族将正式地领导我们走向荣耀之路。"
 flavor_gaul.39.desc:0 "“[ROOT.GetCountry.GetRuler.GetFirstName]，我们当前的治理形式是站不住脚的；曾经为我们的祖先服务的东西并不适用于他们的孙辈，因为我们已不仅仅是群山的主人。然而，我们没有轻易的解决办法。’\n\n开会的地方空气闷热，令人窒息；但聚集在里面的贵族们已经习惯了这种不愉快的现实。当[ROOT.GetCountry.GetRuler.GetName]挥手示意辩论已经结束时，房间里涌起一股轻松的氛围。\n\n’也许是时候做出改变了。‘抬起[ROOT.GetCountry.GetRuler.GetHerHis]的脚，[ROOT.GetCountry.GetRuler.GetFirstName]平静地说:‘我们可以模仿周围人的方式……”"
 flavor_gaul.39.t:0 "一个贵族制的共和国"
 flavor_gaul.4.a:0 "我讨厌那个老太婆。"
 flavor_gaul.4.b:0 "诸神之风将眷顾我！"
 flavor_gaul.4.c:0 "她在干什么？！"
 flavor_gaul.4.da:0 "你在沐浴着阳光的海滩上醒来，剧烈地咳嗽着，胸口灼痛。在你面前赫然耸现一个老妪，显然是她把你从深渊中救了出来。她咧开没有牙齿的嘴对你笑了起来。"
 flavor_gaul.4.db:0 "女祭司唤醒了你，微微一笑，阳光使她的金发熠熠生辉。'Morideus Toutatis'，她轻柔地说着，一边掸去你胸前的沙子。"
 flavor_gaul.4.dc:0 "突然间，你被内心最深的恐惧所动摇，不顾女祭司的抗议，把她拖回陆地。刚安全回到海滩上，她眼神空洞地看着你。"
 flavor_gaul.4.desc:0 "几天过去了，你在岸边扎营，焦急地等待着老妪的归来。这天晚上，月亮低垂，雾在海滩上翻腾，一道光出现在黑暗的水面上。\n\n很快，你看到那是一只小船，船头上挂着一盏橙色的灯笼。一靠岸，老妪就带着一个年轻的女子急匆匆地向你走来。女子穿着一件精致的亚麻斗篷，胸前别着一枚华丽的胸针。\n\n尽管老妇人歇斯底里地大笑起来，但她还是勉强开口说道：‘大海很美好，但我一个老妇人又知道什么呢！’她咯咯地笑着，留下了你和那个年轻女子。‘你需要图塔蒂斯的指引?’她问道，然后不待回应便转身离开你，朝着大海走去。\n\n她向你伸出手，你犹豫不决地抓住了她。随后她把你拖到冰冷的水中，你能听到的只有她颤抖的歌声，盖过了包围你的激流的咆哮。你紧紧地握着女祭司的手，担心巨浪会把她卷进海里去。\n\n寒冷的海浪已然淹没了她金色的发丝，但她仍继续前进，你跟在后面。在你失去意识前最后看到的只有冰冷海洋的幽暗海水，最后听到的只有海底深沉的咆哮。\n\n"
 flavor_gaul.4.descf:0 "第二天，你在岛中心的一个小树林里。月亮在树林里投下了黑影，树林的中心放着一块巨大的雕刻过的石头。九个身披斗篷、身材修长的身影围绕着它，每个人都在对一个无形的存在低语，每声低语似乎都承载着十个人的力量。\n\n这些声音叠加在一起，是一种刺耳的噪音，而不是在场的九位神仆的柔和声音。有位神仆发现了你的存在，向你走过来。\n\n‘这位夫人寻求建议....’老妇人还没说完就被女祭司打断了。‘图塔蒂斯，是的，我们知道。’老妇人笑起来，离开小树林时给了你一个奇怪的眼神。\n\n女祭司催促你跟着她走进树林，你默默地走着。当你走到海岸时，月亮低垂着，太阳还没有升起。‘图塔蒂斯需要考验，’她严肃地说，然后抓住你的手。\n\n带你走进寒冷而幽暗的海浪的同时，她开始吟唱神圣的赞歌。你担心你们俩会被汹涌的浪潮卷走，一去不归，但女祭司仍放声高唱。\n\n当波浪几乎吞没你时，你紧紧抓住她的手，在你失去意识前最后看到的只有冰冷海洋的幽暗海水，最后听到的只有海底深沉的咆哮。\n\n"
 flavor_gaul.40.a:0 "我们将保护那些相信我们的人。"
 flavor_gaul.40.desc:0 "我们不仅完成了群山中的建筑计划，而且用我们强大国家的全部力量加固了我们从前的防御工事，我们还加强了与我们国防力量的来源——人民的关系。国内所有主要家族都相信[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]对我们国家的付出，没有人质疑[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]未来的规划。一切都安然无恙，没有人试图动摇我们的统治。"
 flavor_gaul.40.t:0 "当今之世，安全第一"
 flavor_gaul.41.a:0 "我们看到墨迪俄拉农时热泪盈眶，这里是我们民众的家园。"
 flavor_gaul.41.desc:0 "当我们第一次看到[GetProvince('(int32)3571').GetName]时，它不过是一座防御工事，一片美丽的平原中间的一座摇摇欲坠的塔楼。多年来，我们的统治者为这座城市付出了很多，在[GetProvince('(int32)4').GetArea.GetRegion.GetName]没有哪个城市能与她的优雅和魅力相媲美。人们无论从哪里出发——罗马、克罗同、涅亚波利斯还是无数其他城市，他们所说的都是真的；条条大路通向[GetProvince('(int32)3571').GetName]，不是因为要看到这座梦想之城，他们没有其他理由离开家乡。"
 flavor_gaul.41.t:0 "条条大路通墨迪俄拉农"
 flavor_gaul.42.a:0 "我们需要一切帮助……钱财不过身外之物。"
 flavor_gaul.42.desc:0 "虽然要求的价格很高，有些人可能会说这很离谱，但渴望获得生活中最好的东西的人往往需要付出溢价，有关盖萨蒂的这件事与其他任何事情没有什么不同。\n\n因此，[ROOT.GetCountry.GetRuler.GetName]同意支付400枚金币，从盖萨蒂，这些来自山区、配备标枪、好勇斗狠的高卢雇佣兵那里雇佣一名顾问。虽然价格昂贵，但我们对这位新客人抱有很高的期望，相信他传授给我们部队的经验是物有所值的。"
 flavor_gaul.42.t:0 "来自盖萨蒂的客人"
 flavor_gaul.43.a:0 "这是我们目前能负担得起的所有东西。"
 flavor_gaul.43.b:0 "我们可以给予更多。"
 flavor_gaul.43.desc:0 "如您所见，[ROOT.GetCountry.GetRuler.GetName]，您召唤移民垦殖的命令并非无偿，将移民送到远方广袤土地上的花费是昂贵的。我们要为我们的使者购买马匹与适当的装备……因此我们必须处理大量的相关成本。"
 flavor_gaul.43.t:0 "相应的花费"
 flavor_gaul.44.a:0 "告诉我们的人民去远行吧，去他们想去的地方定居。"
 flavor_gaul.44.desc:0 "几周前，[ROOT.GetCountry.GetRuler.GetName]决定号召移民来人烟稀少的地区定居，他在全国各地传话说，那些有勇气在新的地方开始新生活的人将得到国家的支持。我们的人民雄心勃勃，热情高涨，不惧任何挑战，很快殖民所需的自由人就已足额——我们无比幸运，能得到这样的祝福。这些定居者聚集在[GetProvince('(int32)3617').GetArea.GetName]的山麓附近，等待他们将被送往何处的消息。"
 flavor_gaul.44.t:0 "勒蓬蒂定居者"
 flavor_gaul.45.a:0 "这是我今天听到的最好的事情。"
 flavor_gaul.45.desc:0 "王家图书馆有一个激动人心的消息要报告给您，[ROOT.GetCountry.GetRuler.GetName]。我们意识到我们的需求远远超过了当地的供应，于是我们开始进口莎草纸，希望用这种来自埃及的奇物来充当我们自己的书写材料。源源不断的莎草纸使我们的抄写员能够复刻我们所拥有的各种文本，我们所拥有的知识因此呈指数级增长——这几乎马上就能看到结果，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 flavor_gaul.45.t:0 "勒蓬蒂莎草纸"
 flavor_gaul.5.a:0 "斯默特里奥斯将会助我一臂之力。"
 flavor_gaul.5.b:0 "我并没有觉得自己更强壮。"
 flavor_gaul.5.c:0 "这看起来一点都不好。"
 flavor_gaul.5.da:0 "你忍受住了剧痛，女祭司把你扶起来。她用沙哑的声音说道:‘斯默特里奥斯为你的勇气感到高兴’，随后向你展示那把在月光下闪闪发光的血红的锋刃。"
 flavor_gaul.5.db:0 "你于几个小时后醒转来，东方将白。女祭司站在你旁边，面无表情地俯视着你。你刚想坐起来，她就走开了。"
 flavor_gaul.5.dc:0 "第二天你醒来，手上沾满了血，疼得厉害。这使你感到很虚弱。"
 flavor_gaul.5.desc:0 "几天过去了，你在岸边扎营，焦急地等待着老妪的归来。这天晚上，月亮低垂，雾在海滩上翻腾，一道光出现在黑暗的水面上。\n\n很快，你看到那是一只小船，船头上挂着一盏橙色的灯笼。一靠岸，老妪就带着一个年轻的女子急匆匆地向你走来。女子穿着一件精致的亚麻斗篷，胸前别着一枚华丽的胸针。‘这就是那个想要长枪不倒的男人’，老妇人指着你的下体愉快地说道，满是皱纹的脸上浮现出难看的笑容。\n\n你战战兢兢地面向慢慢向你走来的女祭司。‘斯默特里奥斯需要献祭，’她喃喃道。‘你知道他需要什么。’你心知肚明，于是拔出你的佩剑，向她伸出剑柄。她抓住它，把冰冷的铁刃放在你的手上，开始一边吟唱一边耍弄着剑锋。\n\n吟唱最初是柔和的，但随着她划开你的手掌，鲜血浸湿了下面的沙子，歌声变得越来越强烈。你感到有些虚弱，当女祭司开始尖叫时，你跪在地上，黑暗笼罩着你。\n\n"
 flavor_gaul.5.descf:0 "第二天，你在岛中心的一个小树林里。月亮在树林里投下了黑影，树林的中心放着一块巨大的雕刻过的石头。九个身披斗篷、身材修长的身影围绕着它，每个人都在对一个无形的存在低语，每声低语似乎都承载着十个人的力量。\n\n这些声音叠加在一起，是一种刺耳的噪音，而不是在场的九位神仆的柔和声音。有位神仆发现了你的存在，向你走过来。‘祭司，这位夫人乞求斯默特里奥斯的神助’，老妇人说道。\n\n‘他需要祭品，’女子回答道，然后盯着老妇人。‘你先离开我们吧，’她说道，老妇人匆匆离开了。你和女祭司一起来到树林里的石头那里，其他八个人现在已经离开了。\n\n女祭司从腰带上解开一把匕首，将刀刃一端面向你的手掌，同时凝视着你的眼睛。她开始吟唱，匕首一点一点地划进你的肉里，鲜血滴落在草地上。\n\n女祭司的吟唱随着匕首的刺入愈发高亢，在吟唱达到高潮时，她似乎在得意地尖叫，而你因为手上的疼痛变得难以忍受。你的眼睛变黑，跪倒在地，阴影笼罩着你。\n\n"
 flavor_gaul.54.a:0 "怀疑我能力的任何人都是傻瓜.....嗝"
 flavor_gaul.54.desc:0 "终于! 我们的将军们报告说，期待已久的突破已经到来；经过毁灭性的战争，我们终于将[GetProvince('(int32)2418').GetArea.GetName]、[GetProvince('(int32)2499').GetArea.GetName]和[GetProvince('(int32)2489').GetArea.GetName]地区纳入我们的统治范围内。\n\n今晚在[ROOT.GetCountry.GetCapital.GetName]有很多喧闹的庆祝活动，因为聚集在一起的酋长们正在竞争，看谁能将[ROOT.GetCountry.GetRuler.GetName]灌醉。"
 flavor_gaul.54.t:0 "向西扩张"
 flavor_gaul.6.a:0 "派出我们最好的外交官，告诉这些部落我们要与这些他们慷慨相待。"
 flavor_gaul.6.desc:0 "既然我们对现有的领地已经感到稳固，因此应当决定与邻近部落建立友好关系，以保障玻伊海弥亚的未来繁荣。北方有一支部落——汪达尔人，他们或许会成为可靠的盟友。也许我们可以派遣使节，探询他们是否有意组建联盟？毕竟人多力量大。"
 flavor_gaul.6.t:0 "卢吉亚联盟——一个友好的提议"
 flavor_gaul.7.a:0 "加入同盟。"
 flavor_gaul.7.b:0 "捍卫我们的主权！"
 flavor_gaul.7.desc:0 "来自波依埃米亚的使者向我们提出了一个提案。波依埃米亚的统治者， [GetCountry('BOA').GetRuler.GetName]，提议我们在他的保护下建立一个联盟，因为人多力量大。\n\n这个提议看上去很离谱，但我们可能别无选择。汪达尔部落之间永无止境的争斗造成的冲突与不稳定性，使得汪达尔人民生凋敝，因此对抗波依埃米亚我们似乎毫无胜算。"
 flavor_gaul.7.t:0 "卢吉亚联盟——一个建议性的提案"
 flavor_gaul.8.a:0 "很好……"
 flavor_gaul.8.at:0 "[THIS.GetCountry.MakeScope.GetVariable('bohemian_league_counter_var').GetValue|0Y]汪达尔部落已被接受，被合并为我们国民的一部分@[lugian_league_head_scope.GetFlag]![lugian_league_head_scope.GetName]。"
 flavor_gaul.8.desc:0 "不久前，我们向汪达尔各部落派遣了使者。他们的任务是说服尽可能多的当地势力加入我们主导下的联盟，以确保他们在动荡时期的安全。今天，我们所有的使者终于回来了。\n\n"
 flavor_gaul.8.desc_1:0 "相当多的部落都接受了我们的提议！\n\n[GetCountry('BOA').GetRuler.GetPraenomen]因汪达尔人对[GetCountry('BOA').GetRuler.GetHerHim]的信任而感到谦卑和荣幸。我们的统治者宣布卢吉亚联盟的诞生，其主要义务是在[GetCountry('BOA').GetName]的仁慈和庇护下保卫穿行于琥珀之路的商人。"
 flavor_gaul.8.desc_2:0 "不幸的是，他们带来了坏消息；没有部落接受我们的提议。\n\n现在没办法跟他们讲道理了。"
 flavor_gaul.8.t:0 "卢吉亚联盟——回应"
 flavor_gaul.8.tt:0 "任务已经完成。"
 flavor_gaul.8.tt1:0 "没有汪达尔部落接受我们的提议。"
 flavor_gaul.9.a:0 "我不会忘记你对我的信任。"
 flavor_gaul.9.desc:0 "自我们族群有历史以来，我们就一直在流离；虽然可能会暂时扎根，但在适当的时候，波西人总是会移居到新的土地上——自古以来皆是如此。这种松散的生活状态虽然仍广泛存在，但变革的时刻正在到来，一些人正在抵制 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 提出的定居化尝试，但他们很快就会默从。各部联合为一邦潜在的好处是多方面的——我们迟早都会看到这一点。"
 flavor_gaul.9.t:0 "玻伊联邦"
 flavor_gaul_13_tooltip:0 "所有达契亚土地将获得以下效果："
 flavor_germanics.1.a:0 "花钱吧。"
 flavor_germanics.1.b:0 "把军队作为劳动力。"
 flavor_germanics.1.c:0 "他们得靠自己了"
 flavor_germanics.1.desc:0 "连日来的降雨和雷暴使我们在[germanics_1_target.GetName]的人民担心末日来临。然而，这些并不预示着末日的到来，而是一场大洪水，吞噬了房屋、动物和人类--所有这些都注定无法再见到光明。\n\n结束后，幸存者们赞美神灵，但现在面临着重建曾经的巨大挑战。这片土地每天仍会被淹没两次，形成成千上万个完全被水包围的小岛，但水正在慢慢退去……\n\n我们的人民希望我们能拨出一些资金，尝试帮助那些需要帮助的人，以使情况得到最好的解决。"
 flavor_germanics.1.t:0 "大洪水"
 flavor_germanics.1.tt:0 "#Y [THIS.GetProvince.GetName]#!中至多#Y 20%#! 的人口在洪水中丧生。"
 flavor_germanics.10.a:0 "召来祭司。"
 flavor_germanics.10.b:0 "还有更好的婚配在等待。"
 flavor_germanics.10.desc:0 "我们请求与一位诺里卡公主进行政治联姻的恳求得到了回应。他们向我们介绍了[SCOPE.sChar('noric_princess').GetName]，一位出身高贵、公正而美丽的少女。"
 flavor_germanics.10.t:0 "诺里卡的婚姻"
 flavor_germanics.11.a:0 "发出邀请函。"
 flavor_germanics.11.desc:0 "汪达尔人众所周知分裂为数个不同部落。他们不愿放弃自己的部落忠诚。若汪达尔人想要兴盛，我们必须在凯尔特铁匠之神卢古斯的庇护下，将他们统一为一个联盟，因为凯尔特诸神显然优于我们的旧信仰。\n\n如果我们能组织起分散的盟友和较小的独立派系，我们的霸权将无可争议。"
 flavor_germanics.11.t:0 "卢吉亚联盟"
 flavor_germanics.12.a:0 "加入联盟。"
 flavor_germanics.12.b:0 "捍卫我们的主权!"
 flavor_germanics.12.desc:0 "来自[SCOPE.sC('mission_country_lugia').GetName]的大使们向我们提出了一个提议。汪达尔人的部落在单打独斗时很弱小，而中欧已经成为凯尔特人的战场太久了。他们声称，如果汪达尔人要茁壮成长，我们必须在凯尔特人的铁匠之神卢古斯的主持下联合成一个联盟，因为凯尔特人的诸神显然比我们的旧信仰更优越。\n\n这个提议很离谱，但我们可能别无选择，因为在一个强大的领袖保护下的强大联盟可能是我们唯一的生存机会。"
 flavor_germanics.12.t:0 "卢吉亚联盟"
 flavor_germanics.13.a:0 "尼哈勒尼亚值得赞美!"
 flavor_germanics.13.desc:0 "尼哈勒尼亚，我们感谢你一年来赐予的沃土，生育和丰收。许多孩子出生时被赐予健康的身体和精神。庄稼长得很好，为此我们感谢你的祭司，他在许多年前把你的神威带到我们这里。我们感谢你保护活着的人不受恶灵的侵害，也感谢你保护死去的人直到他们到达来世。这条通往冥界的危险之路由你守护。你的船载着他们，把新生儿带到母亲的子宫里。尼哈勒尼亚，我们感谢你倾听我们的请求，感谢你实现我们的愿望。"
 flavor_germanics.13.t:0 "尼哈勒尼亚之船"
 flavor_germanics.14.a:0 "世界将燃烧！"
 flavor_germanics.14.desc:0 "在征服赫尔维蒂土地期间，我们的人民袭掠了每一个赫尔维蒂村庄。即使无数世纪以后，这片土地也将被称为赫尔维蒂荒漠！"
 flavor_germanics.14.t:0 "赫尔维蒂荒漠"
 flavor_germanics.15.a:0 "世界将燃烧！"
 flavor_germanics.15.desc:0 "埃杜伊人的奥皮杜姆已成废墟，埃杜伊人四散奔逃，我们的战士洗劫了他们能找到的一切。在这场动荡中，埃杜伊人派出一名德鲁伊求援，但他的使命失败了，因为没有人愿意帮助傲慢的埃杜伊人对抗我们的力量。"
 flavor_germanics.15.t:0 "埃杜伊之陨"
 flavor_germanics.16.a:0 "世界将燃烧！"
 flavor_germanics.16.desc:0 "终于，乌庇人的奥皮杜姆陷落了。战斗相当激烈，因为我们的战士必须仰攻并突破三道环形壁垒。随后，我们的苏维汇战士掠夺了他们能找到的一切。\n\n乌庇人将再也无法援助莱努斯河以西的高卢人。"
 flavor_germanics.16.t:0 "乌庇夷之陨"
 flavor_germanics.17.a:0 "[ROOT.GetCountry.GetRuler.GetName]万岁！"
 flavor_germanics.17.desc:0 "只剩六步。然后[ROOT.GetCountry.GetRuler.GetName]就会抵达其雄心计划的终点：坐上王座，成为受膏的日耳曼人之王，正如罗马人早在今日之前便如此称呼他。\n\n[ROOT.GetCountry.GetRuler.GetName]本想冲过最后六步。但出于对这一刻威严的敬意，他正一步一步庄重前行。\n\n当他站在朴素王座前时，他短暂坚持背对观众。随后他转身，再次停顿，以胜利而严厉的目光审视王国内最重要的人物。\n\n直到他在欢呼声中坐下。一股令人迷醉的感觉流过他的身体……全能、无误与骄傲。如今他就是[ROOT.GetCountry.GetRuler.GetName]，此名第一人，日耳曼人之王。"
 flavor_germanics.17.t:0 "日耳曼人之王"
 flavor_germanics.2.a:0 "建立这样一个定居点。"
 flavor_germanics.2.b:0 "还有其他更重要的事情。"
 flavor_germanics.2.desc:0 "最近的人口增长导致了对宜居土地的更高需求。我们的一些人提议效仿几个世纪前弗里西亚人建造的堤坝定居点。阿姆西瓦里亚的海岸似乎是个堆砌泥土建造堤坝的好地方，可以在这些堤坝上建造房屋以抵御洪水。不过，我们需要派遣一些人力去协助他们。"
 flavor_germanics.2.t:0 "特普定居点"
 flavor_germanics.4.a:0 "漂亮的狗儿，你比任何人都更了解我。"
 flavor_germanics.4.desc:0 "在[SCOPE.sChar('rip_dead_dog').GetName]死亡之后，人们都试图安慰我，但我从未觉得他们真正理解我。现在我倾向于避开他们以及他们的闲言碎语。只有一个灵魂，我并不讨厌它的陪伴：一只参加过[SCOPE.sChar('rip_dead_dog').GetName]解脱仪式的棕色狗，并在此之后显示出了与我的挚爱类似的行为。也许祭司的建议是正确的，我们的挚爱在一个适当的仪式后真的重生在狗的身上。"
 flavor_germanics.4.t:0 "挚爱之死"
 flavor_germanics.5.a:0 "我将悄悄地埋葬他。"
 flavor_germanics.5.desc:0 "你忠实的、可信赖的狗终于咽下了最后一口气。自从你第一次从它的行为中认出你已故的亲人后，它已经为你服务了很长时间，但现在是时候埋葬你的老朋友了。"
 flavor_germanics.5.t:0 "你的狗之死"
 flavor_germanics.6.a:0 "曼努斯，请赐予我们力量!"
 flavor_germanics.6.b:0 "反对这个仪式。"
 flavor_germanics.6.desc:0 "又是时候了，向马努斯献祭的仪式将在今晚举行。我们像往常一样被捆绑，是要向我们伟大的神表明我们的顺服。幸运的是，这次没有人摔倒——这是个好兆头。去年，萨满的儿子摔倒后，不得不把自己滚到地板上。因此去年暴风雨多，收成不好。这肯定是那个笨手笨脚的年轻人造成的。\n\n今年的祭品矗立在圣地的中央，被绑在他身后的老橡树上。因为阳光让我几乎盲目，所以几乎无法辨认他的五官，马纳斯把他藏在我的视线之外。萨满已经接近受害者，把刀锋压在他的胸口，使第一滴血滴在他身下的橡树树苗上。他的精血将使森林和大地重获新生。为了保护我们的社群，提高我们的收成，他被供奉给了马努斯。现在，利刃刺穿了他的心脏，尽管他的最后一口气诅咒着我们，却点燃了生命的火焰。\n\n这时，鸟儿们已然开始歌唱和欢乐，填补了牺牲者死亡时留下的沉默。"
 flavor_germanics.6.t:0 "马努斯的圣地献祭"
 flavor_germanics.7.a:0 "内尔苏兹，保佑我们！"
 flavor_germanics.7.b:0 "阻止祭司!"
 flavor_germanics.7.desc:0 "是时候让我们的祭司再次坐上那瑟斯的马车了，战争已经结束了。刀剑将被犁所取代，肥沃的土地将被谷物所播种。当那瑟斯访问我们的家时，会有更多的孩子，妇女的生育能力比以前更强。他们都因她在陆地上的航行而感到幸福，直到她厌倦为止。她的第一个仆人将跟随他的女主人到她在海里的领地。在那儿，祭司会在奴隶们洗完马车并用鲜花和黄金装饰之后再次把马车包装起来。此后，奴隶们会被海洋吞噬，成为那瑟斯最后的祭品，直到她再次醒来，以她的存在祝福大地。"
 flavor_germanics.7.t:0 "那瑟斯的马车驶入深渊"
 flavor_germanics.8.a:0 "让阿里俄维斯图斯成为我们的新领袖"
 flavor_germanics.8.b:0 "他不过是个贱民!"
 flavor_germanics.8.desc:0 "在我们的队伍中，最近出现了一名被高卢人称为阿里俄维斯图斯的人。这是授予伟大军事领袖的高卢荣誉称号。他是一名真正的苏维汇战士，参加并赢得过许多战斗，有时甚至与高卢人并肩作战。\n\n在这些战役中，他学会了高卢语言。这项技能再加上他与万吉奥内人、内梅特人和特里玻基人之间的联系，或许能帮助我们与这些部落结盟。\n\n在我们的人民之中，越来越多人呼吁由他领导，因为[ROOT.GetCountry.GetRuler.GetName]的成就与阿里俄维斯图斯的功绩相比显得黯然失色。"
 flavor_germanics.8.t:0 "阿里俄维斯图斯"
 flavor_germanics.9.a:0 "他们将成为强大的'盟友'。"
 flavor_germanics.9.desc:0 "阿里俄维斯图斯与居住在我们南方的高卢人接触，为我们争取到了与他们的“联盟”，因为他们显然是以朝贡国的形式从属于我们苏维汇人的。"
 flavor_germanics.9.t:0 "阿里俄维斯图斯的盟友"
 startup_events.10.a:0 "我们，弗利西人，是自由的人！"
 startup_events.10.desc:0 "大约三百年前，我们的祖先从大海中夺回了我们现在所居住的土地。他们一层层堆积泥土，直到创造了所谓的“堤土（terps）”。\n\n我们的人民从事畜牧业和跨海贸易，这也促使越来越多的移民来到这里，并与我们一起建立自己的财富。\n\n未来如何很难预测，但或许我们可以瞄准神秘的#E 阿尔比恩#!岛屿……"
 startup_events.10.t:0 "弗里西人"
 startup_events.11.a:0 "让伊尔明引导我们！"
 startup_events.11.desc:0 "#E 苏比人#!，也被称为#E 伊尔米诺尼人#!，源自#E 阿尔比斯河#!（即现代的易北河）周围的青铜时代本地居民。铁器时代的到来伴随着社会的转型；从此，每个人在死后都平等，因为所有人都会在自己死后被火化，并被埋葬在本地制造的瓮中。\n\n然而，军事能力逐渐变得越来越重要，最终使苏比人一跃成为日耳曼文化的典范。其他部落的年轻人会模仿苏比人的发型，称之为#E ‘苏比结’#!。\n\n他们的邻居时常畏惧他们的袭击。但也许，一位受欢迎的领袖将打破这一平等死后的传统……"
 startup_events.11.t:0 "苏比人"
 startup_events.12.a:0 "让阿尔希兹引导我们！"
 startup_events.12.desc:0 "首先，使用面瓮的现象始于现代波美拉尼亚，并向南传播到后来成为波兰大陆的地区。这些面瓮有帽子形状的盖子，面容据说依据死者与刻画图案塑成。\n\n随着时间推移，波罗的海沿岸北方人民与大陆人民之间的分歧愈发加深，双方未来也将走向不同方向。\n\n例如，上个世纪出现了苏维汇移民涌入的现象，他们在我们人民之间独立聚居，并保留了自己的传统与战士习俗。我们的文化与他们之间会产生何种互动，取决于我们自己。"
 startup_events.12.t:0 "汪达尔人"
 startup_events.13.a:0 "让高特尔引导我们！"
 startup_events.13.desc:0 "来自北欧青铜时代原乡斯堪的纳维亚半岛的文化、信仰与人民，来到了现代所谓波美拉尼亚的土地，并与当地基础人群融合。这些便是生活在该地区的日耳曼人的根源，也可能是后世所记录神话与传说的源头。\n\n后来，使用面瓮的现象始于这一地区，并向南传播至如今的波兰大陆。这些面瓮有帽子形状的盖子，面容据说依据死者与刻画图案塑成。\n\n随着时间推移，南方汪达尔人与波罗的海沿岸人民之间的分歧不断加深，双方也将走向不同方向。"
 startup_events.13.t:0 "南波罗的海岸的日耳曼人"
 startup_events.14.a:0 "北海在等着我们。"
 startup_events.14.desc:0 "作为从不列颠到斯堪的纳维亚的活跃贸易路线的一部分，北海日耳曼人很容易从这两个地方获得商品，并作为中间人从中获益，他们能讲凯尔特语和日耳曼语。\n\n他们的家园位于北海的东海岸，以沙滩、河口和瓦登海为特点。他们驾驶坚固的船只在波涛汹涌的海上航行，并可能很快将目光转向新的土地。"
 startup_events.14.t:0 "北海日耳曼人"
 startup_events.15.a:0 "让伊斯提奥引导我们！"
 startup_events.15.desc:0 "在凯尔特人与日耳曼苏维汇之间、莱努斯河（莱茵河）与维苏尔吉斯河（威悉河）之间的交汇处，生活着伊斯特沃内人。他们在不同程度上受到所有邻人的影响，文化与信仰因而成为一种混合体，并因部落而异，因为一个部落更倾向于这一边，另一个部落则更倾向于另一边。\n\n然而，修筑山丘堡垒以获得强大防御，至今仍是所有伊斯特沃内人共同的传统；这项传统所需的社会协调与劳力不可低估。\n\n这些部落将走向何方，谁也说不准。他们会联合起来，还是发现自己已被外来强权吸收？只有时间能给出答案。"
 startup_events.15.t:0 "伊斯托瓦尼"

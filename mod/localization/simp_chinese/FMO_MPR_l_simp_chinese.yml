l_simp_chinese:
 POP_INTERACTIONS_TITLE_TT:0 "特殊人口"
 POP_INTERACTIONS_TT:0 "#T 特殊人口#!\n\n特殊人口被派往各领土执行特定任务，以推动国家议程。\n\n全国在任何时候最多允许每种特殊人口各有 #Y 5#! 个。\n\n#Y 25#! 年后，特殊人口将消亡，并可在新领土中替换。"
 PRIESTS:0 "祭司人口"
 PRIESTS_DESC:0 "祭司会帮助人口改宗。"
 SEND_ARCHITECT_TO_PROVINCE_TT:0 "#T 派遣建筑师#!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( ProvinceWindow.GetProvince.MakeScope ).AddScope('player', Player.MakeScope ).End )]\n\n#TF 派遣一名建筑师帮助发展此领土的基础设施。\n\n#Y 25#! 年后特殊人口将消亡，并可在新领土中替换。"
 SEND_ARTIST_TO_PROVINCE_TT:0 "#T 派遣艺术家#!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( ProvinceWindow.GetProvince.MakeScope ).AddScope('player', Player.MakeScope ).End )]\n\n#TF 派遣一名艺术家帮助在此领土传播我们的伟大文化。\n\n#Y 25#! 年后特殊人口将消亡，并可在新领土中替换。"
 SEND_MERCHANT_TO_PROVINCE_TT:0 "#T 派遣商人#!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( ProvinceWindow.GetProvince.MakeScope ).AddScope('player', Player.MakeScope ).End )]\n\n#TF 派遣一名商人为该领土带来繁荣。商人增加省份的基础资源，并有可能产生多种增加财富的积极效果。\n\n#Y 25#! 年后特殊人口将消亡，并可在新领土中替换。"
 SEND_PRIEST_TO_PROVINCE_TT:0 "#T 派遣祭司#!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( ProvinceWindow.GetProvince.MakeScope ).AddScope('player', Player.MakeScope ).End )]\n\n#TF 派遣一名祭司帮助转化当地人口。\n\n#Y 25#! 年后特殊人口将消亡，并可在新领土中替换。"

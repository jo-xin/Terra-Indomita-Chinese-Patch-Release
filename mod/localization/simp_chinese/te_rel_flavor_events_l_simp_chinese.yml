l_simp_chinese:
 destroy_xian_church:0 "#R 士兵袭击并烧毁教堂，逮捕并处决了许多基督徒。其他许多人逃跑了。#!"
 destroy_xians:0 "#R 你命令士兵找到并屠杀这个有传染力的社区。#!"
 leave_xians_alone:0 "#G 你决定不迫害这些人。#!"
 spare_xian_church:0 "#Y 你让你的士兵退下，让基督教徒免除国教义务。#!"
 te_rel_flavor.1.a:0 "暂时不要管他们。"
 te_rel_flavor.1.b:0 "把他们都宰了。"
 te_rel_flavor.1.desc_1:0 "有消息告诉你，一些被称为“道路”的犹太教派的社区已经在[early_xian_community_target.GetName]筑巢。你听到了关于秘密的“爱的盛宴”和神圣的牺牲的故事，以及吃希伯来人的肉和喝其血的仪式，这些人称之为“基督”，即上帝之子。最糟糕的是，他们拒绝崇拜任何其他神，包括你自己的神。你不知道该如何看待这一切。你们国家的牧师们很不高兴，要求你们根除这个正在人民中传播并获得皈依的渗透性新邪教。还有一些人同情基督信徒，他们的人数正在增加。"
 te_rel_flavor.1.desc_2:0 "有消息告诉你，我们宗教的新教派“道路”的一些团体已经在[early_xian_community_target.GetName]筑巢。你听到了关于秘密的'爱的盛宴'和神圣的牺牲的故事，有吃一个拿撒勒人的肉和喝他的血的仪式，这些人说他是摩西阿，是上帝的儿子！这似乎是对至高无上的上帝的亵渎！这似乎是对至高者的亵渎。你不知道该如何看待这一切。你们国家的祭司们很不高兴，要求你们根除这个正在人民中间传播并获得皈依的渗透性新邪教。还有一些人同情他们声称找到了真正的摩西阿，而且他们的人数正在增加。"
 te_rel_flavor.1.t:0 "圣餐仪式之路"
 te_rel_flavor.2.a:0 "我已经改变了对这些奇特的人的主意。让他们继续吧。"
 te_rel_flavor.2.b:0 "追捕他们，将他们全部处死，并摧毁他们的所有物！"
 te_rel_flavor.2.desc_1:0 "在追捕被称为基督徒的奇怪犹太教派的社区后，你了解到这些邪教分子的大型集会，即“ekklesia”或“教会”，已经在[early_xian_church_target.GetName]扎根了！你的目标是什么？[pagan_or_jewish_official_priest.GetName]敦促你在他们变得过于强大之前消灭他们。关于人祭的传言充斥着你的耳朵，但你在他们中间没有发现任何仪式性杀戮的证据。他们拒绝向神明致敬的行为令人不安。然而，有些人报告说他们是无害的，而且他们正在帮助城市里的穷人。然而，他们正在宣扬只有一个神，那个被钉在十字架上、从死里复活的“基督”，并将来审判任何不崇拜他的人。该怎么做呢？"
 te_rel_flavor.2.desc_2:0 "在追捕被外邦人称为“基督徒”的我们真正宗教的奇怪后起之秀的群体后，你了解到这些邪教分子的大型集会，即外邦人口中的“ekklesia”或“教会”，已经在[early_xian_church_target.GetName]扎根了！你的目标是要在他们变得过于强大之前摧毁他们！[pagan_or_jewish_official_priest.GetName]敦促你在他们变得过于强大之前消灭他们。关于人祭的传言充斥着你的耳朵，但你没有发现任何关于这种可憎行为的证据。他们平等对待外邦人，拒绝要求服从摩西律法，令人不安。然而，有些人报告说他们是正义的，他们正在帮助城里的穷人。然而，他们却在宣扬 El Elyon 有一个儿子，那个被钉在十字架上的拿撒勒人，说他从死里复活，并要来审判任何不敬拜他的人。该怎么做呢？"
 te_rel_flavor.2.t:0 "一个基督教会"

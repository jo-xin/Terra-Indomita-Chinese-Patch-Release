 form_west_galatia_desc:0 "虽然我们远离我们民族的祖国，但这仍然是一片好土地。让我们在这里建立一个新的国家，并向这些当地人传授凯尔特人的能力。"
 galatia:0 "加拉太"
 galatia_final_tt:0 "成立加拉太的决议"
 galatia_settled:0 "一个新的家园"
 galatia_settled_BUTTON_TOOLTIP:0 "我们必须在亚细亚建立一个新的凯尔特人国家"
 galatia_settled_CRITERIA_DESCRIPTION:0 "活动专注于一种劫掠，雇佣军借贷和部落联合的生活方式。"
 galatia_settled_DESCRIPTION:0 "我们会带着凯尔特的传统来到我们的新家园并且向我们的新邻居表明我们的担忧。"
 galatian_invasion.1.a:0 "当心"
 galatian_invasion.1.desc:0 "几代前迁入潘诺尼亚的凯尔特人，如今再次开始迁徙。他们即将闯入马其顿诸王的领地，而这些城市正值虚弱，任人宰割，因为继业者与子嗣们正忙于争夺[GetCharacter('(int32)39').GetPraenomen]帝国的残余……\n这些战士部落最初来自高卢，后来定居于潘诺尼亚与伊利里亚。如今土地已无法养活所有人，他们开始在平原与丘陵中四处游荡，寻找新的家园。他们正在向南推进，沿途劫掠城市。我们应当为冲突做好补给准备，因为他们的路径离我们不远，也许会与希腊人发生冲突。既然这支部落大军已经逼近我们的家园，我们也可能被卷入这场战争。"
 galatian_invasion.1.t:0 "迁徙"
 galatian_invasion.10.a:0 "我们必须为城市解围!"
 galatian_invasion.10.desc:0 "吾王，佩拉正遭到迁徙而来的高卢大军围攻。过去这些大军从不在希腊土地上停留太久，只是洗劫目标后便离去。然而如今，他们被定居新土地的需求所驱使，因为潘诺尼亚和伊利里亚已经太小，无法支撑先前迁徙者的后裔。我们必须假定佩拉会被洗劫，但他们绝不会在那里定居，因为高卢人知道我们会把他们驱逐出去。即便如此，我们也不能让腓力与亚历山大的宫殿落入蛮族之手！若看到自己的遗产在他们逝去不久后便遭玷污，他们会如何评判我们？"
 galatian_invasion.10.t:0 "被围困的珀拉"

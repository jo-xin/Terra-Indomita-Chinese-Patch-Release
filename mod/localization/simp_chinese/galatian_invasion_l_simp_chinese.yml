 galatian_invasion.12.a:0 "召集人手!"
 galatian_invasion.12.desc:0 "成群的高卢蛮族正在围攻佩拉。若此城陷落，东面与南面的道路便会敞开。这些部落将侵入希腊、色雷斯和小亚细亚，而他们必定会抓住这个机会。\n这些部落源自雷蒂亚、南高卢与山南高卢，数代以前定居于潘诺尼亚和伊利里亚。如今他们再次踏上迁徙之路，寻找可以定居的新土地。潘诺尼亚和伊利里亚土地肥沃，使他们的人口不断增长。然而这些土地仍然太小，迫使他们继续向南向东推进。我们相距太远，无法施以援手，但仍应为最坏的情况做好准备。"
 galatian_invasion.12.t:0 "被围困的珀拉"
 galatian_invasion.2.a:0 "让我们一同前进。"
 galatian_invasion.2.b:0 "我们不是我们兄弟的监护人。"
 galatian_invasion.2.desc:0 "在我们为即将到来的迁徙做准备时，也应考虑是否让沃尔开同族加入我们。南方的其他部落正在希腊寻找财富。我们的目光投向更遥远的地方，但若特克托萨吉亚、特罗克梅里亚与托利斯托博吉亚能够联合起来，我们将更加强大。"
 galatian_invasion.2.t:0 "我们的沃尔开兄弟们"
 galatian_invasion.20.a:0 "阿波罗与我们同在!"
 galatian_invasion.20.desc:0 "在与北方敌人交战之后，这些部落已经向南进军。他们一路洗劫劫掠，在帖撒利留下血腥轨迹。如今他们站在我们供奉阿波罗的圣所之前，眼中满是贪婪，幻想着从我们挚爱的德尔斐城掠走一切财富。阿瑞斯憎恶弱者，所以我们必须强大。雅典娜指引智者，有她赐福，我们的机谋将欺骗敌人。凭借阿波罗的精准，我们的弓箭会射中仇敌的心脏。诸神都站在我们一边，我们怎会失败？我们绝不会让这些蛮族玷污我们的圣所与城市！我们将坚守到最后，因为诸神不会怜悯背叛者！"
 galatian_invasion.20.t:0 "加拉太人袭击了德尔斐"
 galatian_invasion.21.a:0 "堕落前的骄傲"
 galatian_invasion.21.desc:0 "部落在厄马提亚与马其顿人交战后南下。途中劫掠帖撒利，如今抵达[GetProvince('(int32)424').GetName]，对其展开围攻。他们企图掠夺财宝、奴役居民、亵渎奉献给我们神明的神庙。我们绝不能令众神蒙羞与被背叛。我们必须协助希腊兄弟守卫阿波罗神庙。他们自负自大，未曾将希腊城市视为威胁。诸神将护佑我们！"
 galatian_invasion.21.t:0 "受困的德尔斐"
 galatian_invasion.22.a:0 "亵渎神明……"
 galatian_invasion.22.desc:0 "德尔斐受到威胁。蛮族大军在北方与马其顿人交战后向德尔斐进军，并洗劫南下途中的城市。如今阿波罗圣所遭到斯科迪斯基人围困。曾使德尔斐富庶的皮媞亚，如今也使这里成为目标，因为异教徒想把她献祭给他们的神明。她身下的财富吸引了他们，搅乱了蛮族的头脑，贪欲吞没了他们的心智。若德尔斐陷落，那将是阿波罗降下的严酷征兆。"
 galatian_invasion.22.t:0 "德尔斐遭围"
 galatian_invasion.3.a:0 "亚细亚的沿海地区充满了战利品！"
 galatian_invasion.3.b:0 "弗里吉亚的平原十分肥沃。"
 galatian_invasion.3.c:0 "卡帕多西亚的山脉能为我们提供庇护。"
 galatian_invasion.3.desc:0 "在得到沃尔卡同胞的尊重后，我们现在对我们的入侵目标有了决定权，我们是应该寻找眼前的利益还是寻找我们可以称之为家园的土地。"
 galatian_invasion.3.t:0 "财富所在"
 galatian_invasion.30.a:0 "阿瑞斯憎恶犹豫之人。"
 galatian_invasion.30.desc:0 "这些部落称这片土地为提利斯。肥沃的土壤与战略位置再一次吸引了入侵者。如今轮到我们守住祖先创造的一切。\n色雷斯的男人们，我们遭到了攻击。蛮族企图毁灭我们的国家，把这片土地据为己有。我们绝不能在守卫城市时动摇，因为我们的妻儿正躲在城墙之后。高卢人以战后的残暴行径闻名，他们会强暴妇女，折磨男子。我们绝不投降！以诸神之名，我们有责任不让蛮族玷污我们的家园！\n节选自一场在墨森布里亚的动员演说，据估计发生在利西马科斯死后不久。"
 galatian_invasion.30.t:0 "墨森布里亚岌岌可危"
 galatian_invasion.32.a:0 "黑暗时刻降临了。"
 galatian_invasion.32.desc:0 "色雷斯殖民地岌岌可危。一支蛮族军队已经越过我们的防线，正在围攻墨森布里亚。刻勒革里人希望结束迁徙，在提利斯定居。\n墨森布里亚是抵御革提亚人的堡垒。若城市陷落，更多掠夺者便能从北方进入色雷斯，刻勒革里人将打破这道防护屏障。若我们不尽快找到解决办法，希腊城市可能会暴露在危险之中。未来将会怎样？"
 galatian_invasion.32.t:0 "墨森布里亚岌岌可危"
 galatian_invasion.4.a:0 "拿起武器！"
 galatian_invasion.4.desc:0 "经过长途跋涉穿越赫勒斯滂，我们来到了亚细亚的土地，准备突袭这些充满战利品的豪华沿海城市！我们的沃尔开兄弟信任我们，一旦我们展示了我们的武功，就会召集我们征服的保卫者进行和谈。"
 galatian_invasion.4.t:0 "抢劫和掠夺"
 galatian_invasion.40.a:0 "我们不会让出一寸土地!"
 galatian_invasion.40.desc:0 "加拉太人已经潜入安纳托利亚，袭击、掠夺并洗劫了一些较小的城镇。如今他们来到我们的戈尔迪乌姆城，想在我们祖先的土地上定居。我们不能容忍他们留在这里，必须把这些蛮族赶出弗里吉亚。\n安纳托利亚的希腊人团结起来，因为除了土地以外，你们已经没有什么可以失去了。高卢人侵入你们的农场，杀害你们的儿子，掳走你们的女儿。弗里吉亚的希腊人，加入保卫戈尔迪乌姆的行列吧。胜利必将属于我们，因为这些部落是异教徒，而诸神站在我们这一边！我们寸土不让。我们将保卫家园，把野蛮残暴的加拉太人赶回老家！\n \n - 节选自戈尔迪乌姆的一场动员演说，演说者不详，约在亚历山大逝世五十年后。"
 galatian_invasion.40.t:0 "安纳托利亚的高卢人"
 galatian_invasion.42.a:0 "就这样吧"
 galatian_invasion.42.desc:0 "一些曾围攻[GetProvince('(int32)379').GetName|E]的部落已经越过了博斯普鲁斯海峡和达达尼尔海峡。他们袭击了小亚细亚，洗劫了一些小城市，但基本上未被注意。继业者与后继者们忙于内斗，小城邦又不得不为他们供给。因此，这些部落几乎没有遇到真正的抵抗。高卢人最初离开潘诺尼亚和伊利里亚，是为了寻找新的家园。现在，他们找到了想要定居的地区。在[GetProvince('(int32)189').GetName]周边，土地肥沃，地势多丘陵。加拉太人习惯这种地形，也懂得如何在其中作战。然而，他们不会被端着银盘接纳进[GetProvince('(int32)189').GetName]，因为这里将被顽强地保卫。"
 galatian_invasion.42.t:0 "安纳托利亚的高卢人"
 galatian_invasion.43.a:0 "他们将拥有他们的土地……暂时的"
 galatian_invasion.43.b:0 "这片土地是我的!"
 galatian_invasion.43.desc:0 "加拉太人派来了使者，他们寻求和平。他们带来了一项确实颇具诱惑力的提议：只要获得弗里吉亚的一些土地，他们便愿意成为附庸国。高卢战士将为我们的事业而战，服从我们的命令。若我们拒绝他们的提议，他们就会战至最后一人，因为他们的妻儿也随这次迁徙同行。战争将会十分血腥，我们也将被迫投入原本需要用于其他战线的兵力。他们提出这个方案，是因为蛮族知道我们正被其他战线分散精力；他们相信这会对双方都有利。\n我们不应忘记，即便现在割让土地，日后仍能重新征服……"
 galatian_invasion.43.t:0 "安置野蛮人"
 galatian_invasion.44.a:0 "让我们的剑变成犁头。"
 galatian_invasion.44.b:0 "我们的人民将继续存在。"
 galatian_invasion.44.desc:0 "在赢得了定居这些肥沃平原的权利后，我们的人民离开了他们在潘诺尼亚的家园，在安纳托利亚这里定居。弗里吉亚人以前称这个地区为他们的家，但现在我们周围的希腊人以我们的人民的名字称这片土地为加拉太。"
 galatian_invasion.44.t:0 "一个新的家园"
 galatian_invasion.5.a:0 "拿起武器！"
 galatian_invasion.5.desc:0 "经过长途跋涉穿越博斯普鲁斯海峡，我们已经抵达弗里吉亚的土地，准备解决和打击任何反对我们居住于此的人。我们的沃尔开兄弟信任我们，一旦我们展示了我们的武功，就会召集我们征服的保卫者进行和谈。"
 galatian_invasion.5.t:0 "剑与犁"
 galatian_invasion.53.a:0 "他们将拥有他们的土地……暂时的"
 galatian_invasion.53.b:0 "这片土地是我的!"
 galatian_invasion.53.desc:0 "加拉太人派来了使者，他们寻求和平。他们带来了一项确实颇具诱惑力的提议：只要获得弗里吉亚的一些土地，他们便愿意成为附庸国。高卢战士将为我们的事业而战，服从我们的命令。若我们拒绝他们的提议，他们就会战至最后一人，因为他们的妻儿也随这次迁徙同行。战争将会十分血腥，我们也将被迫投入原本需要用于其他战线的兵力。他们提出这个方案，是因为蛮族知道我们正被其他战线分散精力；他们相信这会对双方都有利。\n我们不应忘记，即便现在割让土地，日后仍能重新征服……"
 galatian_invasion.53.t:0 "安置野蛮人"
 galatian_invasion.6.a:0 "拿起武器！"
 galatian_invasion.6.desc:0 "经过长途跋涉穿越赫勒斯滂，我们来到了卡帕多西亚的土地上，这些山脉将在我们的突击队之间为我们提供掩护。"
 galatian_invasion.6.t:0 "山地家园"
 galatian_invasion.63.a:0 "他们将拥有他们的土地……暂时的"
 galatian_invasion.63.b:0 "这片土地是我的!"
 galatian_invasion.63.desc:0 "加拉太人派来了使者，他们寻求和平。他们带来了一项确实颇具诱惑力的提议：只要获得弗里吉亚的一些土地，他们便愿意成为附庸国。高卢战士将为我们的事业而战，服从我们的命令。若我们拒绝他们的提议，他们就会战至最后一人，因为他们的妻儿也随这次迁徙同行。战争将会十分血腥，我们也将被迫投入原本需要用于其他战线的兵力。他们提出这个方案，是因为蛮族知道我们正被其他战线分散精力；他们相信这会对双方都有利。\n我们不应忘记，即便现在割让土地，日后仍能重新征服……"
 galatian_invasion.63.t:0 "安置野蛮人"
 galatian_invasion.70.a:0 "一个新民族的新土地。"
 galatian_invasion.70.b:0 "我们永远不会放弃我们的祖先的习俗!"
 galatian_invasion.70.desc:0 "我们的人民远离古老的凯尔特人的土地，开始采取有别于旧方式的新做法。我们是应该拥抱这种新的风气还是保持旧的传统？"
 galatian_invasion.70.t:0 "拥抱新的土地"
 galatian_invasion.71.a:0 "一个新的民族出现了"
 galatian_invasion.71.desc:0 "自从第一个高卢人入侵马其顿以来，已经过去很多年了。许多人与加拉太人作战，有些战役他们赢了，有些战役他们输了，但没有人能够打败他们。Trocmeri、Tectosagii和Tolistobogii已经征服并定居在一个可以称之为家园的地方，现在他们的剑已经出鞘，将它们换成了犁铧，结束了他们的迁徙。\n 现在，各部落已经在他们称之为加拉太的地方联合起来。在未来的岁月里，他们肯定会被称为一个凶猛的民族，准备在必要时战斗，但习惯于和平。在安纳托利亚的中心地带，他们的人民生活和死亡。\n贸易和旅行的时间已经到来，因为一个新的民族提供了新的、令人兴奋的东西来发现。有一个关于高卢人从遥远的故乡带来的一种新剑的传言......"
 galatian_invasion.71.t:0 "加拉西亚"
 galatian_invasion.72.a:0 "最后的和平"
 galatian_invasion.72.desc:0 "凯尔特人已经在弗里吉亚定居，他们的旅程走到了终点。他们曾与希腊人和马其顿人作战，也曾对抗希腊化与安纳托利亚势力。他们用自己流下的鲜血灌溉了征服而来的肥沃土地。他们已经证明了自己，他们的神明也眷顾了这场旅途。他们把新的家园称为加拉太。\n\n加拉太人仍是蛮族，我们应当尝试教化他们。击败一个民族并非只有战争一种方法；只要有金币和笑脸，他们必定会融入我们。若他们成为新的希腊人，便再无可惧。他们带来了一种新的剑，并已证明自己精通这种武器。也许我们能说服高卢人卖给我们一些。新的民族会带来新的好处……"
 galatian_invasion.72.t:0 "凯尔特人的弗里吉亚"
 galatian_invasion.75.a:0 "一个新的时代已经来临。"
 galatian_invasion.75.desc:0 "我们的弟兄们已经接受了我们领导一个联盟的权利。他们已经打破了与以前的宗主的臣服协议，并宣誓向我们效忠。"
 galatian_invasion.75.t:0 "联合沃尔卡"

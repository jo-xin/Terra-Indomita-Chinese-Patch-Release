 fall_of_attalus_land_tt:0 "珀加蒙的拥有者是一个附庸，或者在亚细亚或弗里吉亚没有占据任何地区。"
 fall_of_mithridates:0 "米特里达梯的陨落"
 fall_of_mithridates_land_tt:0 "本都是一个在弗里吉亚或比提尼亚没有地区的国家。"
 for_brennus:0 "为了布壬努斯"
 for_brennus_tt:0 "亵渎一个在亚细亚的圣地。"
 form_central_galatia:0 "组建加拉太"
 form_central_galatia_desc:0 "虽然我们远离我们民族的祖国，但这仍然是一片好土地。让我们在这里建立一个新的国家，并向这些当地人传授凯尔特人的能力。"
 form_east_galatia:0 "组建加拉太"
 form_east_galatia_desc:0 "虽然我们远离我们民族的祖国，但这仍然是一片好土地。让我们在这里建立一个新的国家，并向这些当地人传授凯尔特人的能力。"

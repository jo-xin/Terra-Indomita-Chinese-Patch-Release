 galatian_invasion.11.a:0 "我们将响应国王的号召!"
 galatian_invasion.11.b:0 "这是他应得的命运!"
 galatian_invasion.11.desc:0 "丁达里人正在围攻[GetProvince('(int32)379').GetName|E]，他们需要新的土地来定居。马其顿国王已发出号召，请求援助以将这支部落从希腊土地上驱逐。我们应该协助他，否则城市一旦陷落，东方的道路将彻底开放，危及我们的城市。这些部落将向色雷斯和特洛亚地区进军，掠夺小亚细亚境内虚弱的城市。我们必须立即阻止高卢人！"

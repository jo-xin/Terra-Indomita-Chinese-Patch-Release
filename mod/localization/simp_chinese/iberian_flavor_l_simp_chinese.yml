 desc_mines_of_tharsis:0 "塔尔西斯矿山是该地区最丰富的金属矿床，自远古时代起便被开采。"
 desc_pre_indo_european_religion:0 "作为一种原始印欧人的信仰，玛丽特异教涉及各种信仰的组合，包括对恶魔、灵魂和神灵的崇敬。其中最重要的神祇当属玛丽女神，她被尊奉为至高无上的女神。"
 form_aquitania_claims_tooltip:0 "阿基坦尼亚将获得对#Y 阿基坦#!地区的宣称。"
 form_greater_aquitania:0 "成立大阿基坦尼亚"
 form_greater_aquitania_claims_tooltip:0 "大阿基坦尼亚将获得对#Y 加利西亚#!、#Y 塔拉科嫩西斯#!和#Y 阿耳摩里卡#!地区的宣称。"
 form_greater_aquitania_desc:0 "我们的方式古老，自不朽的时代以来，我们保留并尊重了祖先的习俗；然而，如果管理不当，我们可能像之前的许多人一样消失在历史的年鉴中。如果我们能够保留阿基坦尼亚文化的余烬，它们可以被燃起成强大的火焰，用来创造非凡的东西。"
 form_tartessia:0 "改革塔特西亚"
 form_tartessia_claims_tooltip:0 "塔特西亚将获得对#Y $baetica_region$#!地区的所有权。"
 form_tartessia_desc:0 "神话般的塔耳忒索斯王国早已不复存在，但他们的传承仍存。阿尔甘托尼奥斯的力量存在于我们身上，将图耳得塔尼亚统一在同一面旗帜下是我们的责任。"
 formable_greater_aquitania:0 "大阿基坦尼亚"
 greater_aquitania_not_exists:0 "#Y 大阿基坦尼亚#!必须不存在。 "
 iberian_starting_country_events.asa.a:0 "是时候创造历史了。"
 iberian_starting_country_events.asa.desc:0 "在卡尔塔雷岛之外、[GetProvince('(int32)7665').GetName]河口处，坐落着[GetProvince('(int32)1342').GetName]，一座因与布匿人与图尔得塔尼亚同胞进行金属和商品贸易而富裕的城市。靠近[GetProvince('(int32)7665').GetName]的天然河口，并位于一条终止于[GetProvince('(int32)1344').GetName]前方的水道旁，[GetProvince('(int32)1342').GetName]成长为最大的图尔得塔尼亚城市之一，拥有生机勃勃的繁荣市场。\n\n[GetCountry('ASA').GetAdjective]人不仅是商人。为了扩大影响力，[GetCountry('LSC').GetName]已被征服，如今生活在[GetCountry('ASA').GetAdjective]统治之下。但[GetCountry('ASA').GetName]并非图尔得塔尼亚唯一的强国，[GetCountry('CRM').GetName]正在扩张边界，并觊觎[GetCountry('ASA').GetAdjective]的财富。[GetCountry('GAD').GetName]就在附近，而他们的新定居点[GetProvince('(int32)1348').GetName]也受到[GetCountry('CRM').GetAdjective]在该地区扩张的威胁。\n\n如果[GetCountry('ASA').GetName]想继续保持地区中心地位，就必须为不可避免的战争做好准备。"
 iberian_starting_country_events.asa.t:0 "哈斯提亚"
 iberian_starting_country_events.crm.a:0 "是时候创造历史了。"
 iberian_starting_country_events.crm.desc:0 "图尔得塔尼亚内陆、[GetProvince('(int32)7772').GetName]河附近，是[GetProvince('(int32)1374').GetName]城所在之处。这座城市曾过着宁静生活，依靠贸易为生并专精冶金，但#E 塔耳忒索斯#!衰落后摧残图尔得塔尼亚的政治不稳定改变了[GetCountry('CRM').GetAdjective]人。\n\n[GetCountry('CRM').GetName]在金属使用上的精通，使其军队相较邻国拥有优势。[GetCountry('CRM').GetAdjective]军队在对抗该地区另一座图尔得塔尼亚大城[GetProvince('(int32)1371').GetName]的许多战争中取胜，希望有朝一日这些胜利会以征服告终。若诸神愿意奖赏我们，[GetProvince('(int32)1369').GetName]和[GetProvince('(int32)1372').GetName]诸城也将遭受同样命运。\n\n近期扩张引起了其他图尔得塔尼亚人的注意。他们将[GetCountry('CRM').GetName]视为威胁。[GetCountry('ASA').GetName]也寻求成为该地区霸主，并将试图阻止[GetCountry('CRM').GetAdjective]继续扩张。这造成了极为紧张的局势，唯有时间才能解决。"
 iberian_starting_country_events.crm.t:0 "卡尔莫亚"
 iberian_starting_country_events.gad.a:0 "是时候创造历史了。"
 iberian_starting_country_events.gad.desc:0 "很久以前，在赫拉克勒斯之柱之外，来自[GetProvince('(int32)743').GetName]的定居者在厄律西亚岛上建立了一座城市。他们称之为[GetCountry('GAD').GetName]，“要寨”。作为西地中海最古老的腓尼基殖民地之一，该市的财富来源于其通往大西洋锡矿和图耳得塔尼亚矿藏的商路。\n\n[GetCountry('GAD').GetName]因另一个原因而广为人知；[GetProvince('(int32)1344').GetName]的鱼酱油作为地中海世界最好的调味品受到广泛认可，从伊比利亚到安纳托利亚以及其他地区都有食用。\n\n两个世纪前[GetProvince('(int32)3515').GetName]战役的结束，以及希腊对西地中海的影响力下降，最初都是好消息。[GetCountry('GAD').GetName]将自己从一个采掘殖民地改造为赫拉克勒斯之柱以外的主要贸易中心。[GetCountry('GAD').GetName]领导着一个联盟，该联盟由其他布匿殖民地整合而成，受到[GetCountry('GAD').GetAdjective]的影响，发展和控制了从卡西忒里得斯（锡岛）到阿拉姆比斯的大西洋贸易。\n\n但是，[GetCountry('CAR').GetName]的崛起对[GetCountry('GAD').GetAdjective]的地位产生了威胁。狄多的继承人想要得到[GetCountry('GAD').GetName]的地位，然而，[GetCountry('GAD').GetAdjective]的地位取决于梅尔卡特神本身及其神谕的庇护。[GetCountry('GAD').GetName]必须做好准备，才能承受[GetCountry('CAR').GetAdjective]的扩张。"
 iberian_starting_country_events.gad.t:0 "加迪尔"
 iberian_starting_country_events.onu.a:0 "是时候创造历史了。"
 iberian_starting_country_events.onu.desc:0 "沿海城市[GetProvince('(int32)1339').GetName]自远古时代起便有人居住。它位于卢克西亚河口的一处半岛上，既拥有易守位置，也控制着从[GetProvince('(int32)1415').GetName]富矿开采出的金属贸易。\n\n尽管[GetProvince('(int32)1415').GetName]昔日富饶的矿山自塔耳忒索斯时代以来因过度开采开始枯竭，良好管理仍可使[GetCountry('ONU').GetName]避免经济灾难，甚至可能让矿山重新焕发生机。\n\n自最早越过赫拉克勒斯之柱的航行以来，腓尼基定居者便一波波抵达此地，而随着[GetCountry('CAR').GetAdjective]向伊比利亚扩张，布匿移民有所增加。两百年前，在#E 塔耳忒索斯#!崩溃期间，凯尔特部落从中央高原迁往名为[GetCountry('BDL').GetName]和[GetProvince('(int32)1337').GetArea.GetName]的土地。如今，除布匿人外，凯尔特定居者也正迁往[GetCountry('ONU').GetName]。\n\n[GetCountry('ONU').GetName]并不位于[GetProvince('(int32)7771').GetName]河周边，因此没有卷入[GetCountry('ASA').GetName]与[GetCountry('CRM').GetName]之间的斗争，但这并不意味着斗争结果不会影响他们。"
 iberian_starting_country_events.onu.t:0 "奥努巴亚"
 iberian_starting_country_events.sgs.a:0 "是时候创造历史了。"
 iberian_starting_country_events.sgs.desc:0 "[GetProvince('(int32)1029').GetName]坐落在伊比利亚东海岸上，罗马人称其为萨贡图姆。最初是马赛利亚船队的简易港口，该定居点后来发展，与来自伊比利亚腹地的货物和他们自己的货物进行贸易。与希腊殖民地[GetCountry('MAS').GetName]、[GetCountry('HMK').GetName]和[GetCountry('EPO').GetName]的良好关系创造了流畅的文化和经济交流。\n\n[GetProvince('(int32)1029').GetName]分为两个核心。首先是城市本身，四周是坚固的城墙，保护着该州的主要政府建筑。外面是港口，名为“萨贡图姆港”，大多数希腊商人都住在这里。[GetProvince('(int32)1029').GetName]的港口迎接来自不同地方的船只停靠，其城墙保护其居民免受外部威胁。[GetCountry('SGS').GetName]有幸成为第一个发行硬币的伊比利亚城市。\n\n时间会告诉你[GetCountry('SGS').GetName]是否会在强大的敌人面前继续成长或灭亡……"
 iberian_starting_country_events.sgs.t:0 "阿尔塞卡"
 iberian_starting_country_events.tut.a:0 "是时候创造历史了。"
 iberian_starting_country_events.tut.desc:0 "图尔得塔尼亚人的土地过去有许多名称；其中最常用的是#E 塔耳忒索斯#!。这个国家混杂着神话与现实，传说讲述着由“白银之人”阿尔甘托尼俄斯本人统治的王国所拥有的财富与繁荣。\n\n自远古以来，腓尼基人和希腊人便试图殖民该地区，以取得图尔得塔尼亚丰富矿藏。传说称，塔耳忒索斯在两百年前[GetProvince('(int32)3515').GetName]之战结束后衰落，那场战役发生于[GetCountry('ETR').GetAdjective]人与[GetCountry('CAR').GetAdjective]人组成的联盟和[GetProvince('(int32)3515').GetName]的福凯亚希腊人之间，但真相远比这复杂。\n\n腓尼基影响长期存在于该地区，并造成了迦南诸神与本地神同样常受崇拜的局面，尤其是女神阿什塔特和神梅尔卡特。上层阶级更进一步，将布匿习俗接纳为自己的习俗。这种局面形成了一个丰富熔炉，创造出独特文化。\n\n当[GetCountry('CAR').GetAdjective]人来到图尔得塔尼亚门前寻找其财富时，动荡正在激励整个地区。图尔得塔尼亚人能否存续，唯有时间能证明。"
 iberian_starting_country_events.tut.t:0 "塔耳忒索斯的继承人"
 inherit_tartessia_provinces_tooltip:0 "任何组建塔尔提斯所需的#Y 主体#! 省份都将被吞并。"
 mines_of_tharsis:0 "塔尔西斯矿场"
 omen_aatxe:0 "阿特克"
 omen_aatxe_desc:0 "我们敬拜暗影中的变形灵——阿特克。愿罪犯畏惧他的怒火，因为阿特克守护着我们的人民。"
 omen_aiko:0 "艾科"
 omen_aiko_desc:0 "艾科是马里之子，也是巴斯克人的英雄。他的传说称，他建立了巴斯克文化与宗教，并完成了许多英雄壮举。这样一位被认为与巴斯克人自身起源相关的人物，可能早在前罗马时代甚至更早便已受到崇拜。"
 omen_amalur:0 "阿玛拉"
 omen_amalur_desc:0 "我们将崇拜阿玛卢尔，地土女神，埃基和伊拉吉女神的母亲——玛丽的另一面。她的祝福将使我们的人民欢欣鼓舞。"
 omen_aqueloo:0 "阿奎卢斯"
 omen_aqueloo_desc:0 "：阿克埃卢是对希腊神阿刻洛俄斯的伊比利亚诠释，是河流与丰饶之神。阿克埃卢拥有麝牛的身躯和一张蓄有胡须的人脸，头顶上则长有一对醒目的公牛耳朵。\n\n如同他的希腊对应神祇一样，阿克埃卢被尊为赐予田野繁荣的神明，确保土壤肥沃与生命延续。人们认为，一尊描绘阿刻洛俄斯或阿克埃卢的雕像于公元前6世纪中叶由石灰岩雕刻而成，于20世纪初在巴斯塔塔尼人墓丘附近出土，被命名为巴拉索特野兽像。"
 omen_ares_lusitani:0 "阿瑞斯-卢西塔尼"
 omen_ares_lusitani_desc:0 "阿瑞斯-卢西塔尼是卢西塔尼亚人的马神和骑士之神。正如他的名字所示，阿瑞斯-卢西塔尼是一位源自希腊的神，由于与地中海的希腊商人进行文化交流，他在当地的万神殿中找到了自己的位置。"
 omen_arganthonios:0 "阿甘托尼奥斯"
 omen_arganthonios_desc:0 "阿尔甘托尼奥斯是塔耳忒索斯的神话国王，他因其财富和慷慨而被希腊人所熟知。当他知道米底人主宰了小亚细亚时，他赠与福西亚人财物，让他们重建福西亚的城墙。"
 omen_basajaun:0 "巴萨哈恩"
 omen_basajaun_desc:0 "我们将向巴萨豪恩们献上崇拜，他们是森林之主。愿他们的智慧启迪我们的思想者，并庇护我们的牧人。"
 omen_borvo:0 "波尔墨"
 omen_borvo_desc:0 "波尔墨是矿物和治疗之神，与泉水有关。他在伊比利亚半岛之外受到崇拜，在高卢和日耳曼南部有宗教中心。\n\n波尔墨通常被等同于希腊神话中的阿波罗神。"
 omen_eate:0 "埃赫特"
 omen_eate_desc:0 "我们将崇拜风暴之神埃阿特，其胡须由火与冰构成。有了他的支持，没有敌人能够征服我们。"
 omen_ilargi:0 "伊拉吉"
 omen_ilargi_desc:0 "我们将向月亮女神和阿马鲁的女儿伊拉吉献上我们的崇拜。愿她每天去见她的母亲的旅程能够成功。"
 omen_inguma:0 "因古玛"
 omen_inguma_desc:0 "因古玛是梦与噩梦之神。虽然有时心怀恶意，但这位神祇对巴斯克宗教产生了持久影响，并且很可能早在前罗马时代便已受到崇拜。"
 omen_laminak:0 "拉米娜克"
 omen_laminak_desc:0 "拉米纳克是女性的精神，或者说是仙女，代表着性和生育能力。据说她们帮助妇女完成分娩、生育和保持健康。拉米纳克并不总是被描绘成善良的精灵，在一个神话中，她们抓住了玛丽女神。"
 omen_lobegi:0 "罗贝吉"
 omen_lobegi_desc:0 "罗贝吉（Lobegi）的名字来自一个铭文，上面写着“Lacobegius”，这似乎是一个巴斯克神的罗马化版本。由于“Laco”这个词根显然来自拉丁语“lacus”（湖），因此，最初的词根可能更接近于巴斯克语中的“lo”，也可能是别的什么。不管怎么说，他名字的第二部分，Begi，意思是眼睛。因此，他的名字被翻译为“湖的眼睛”。这可能表明，罗贝吉是与水有关的智慧神。"
 omen_lurraberri:0 "卢拉贝里"
 omen_lurraberri_desc:0 "卢拉贝里这个名字的意思是“新的土壤”，而且它经常被冠以“安德雷希（Anderexi）”的外号，意思是“开花”。这可能表明卢拉贝里可能是一个生育之神，甚至可能是一个树神或花神。这也可能意味着他是一个重生之神。卢拉贝里被列在一个碑文上，该碑文将他的名字写成伊卢里贝里克苏斯·安德雷希（Ilurriberrixus Anderexi），是卢拉贝里（Lurraberri）的罗马化名字。"
 omen_nabia:0 "娜比亚"
 omen_nabia_desc:0 "纳比亚是伊比利亚的水和生育女神，在半岛的北部文化中具有特殊的意义，在河流和湖泊附近的圣地也是如此。\n\n纳比亚与希腊神话中的阿耳忒弥斯女神有联系。"
 omen_neto:0 "内图"
 omen_neto_desc:0 "内托是战争之神，也是少数几个泛半岛的神之一，受到伊比利亚人和凯尔特-伊比利亚人的崇拜。他被视为地狱的太阳神，是混乱世界的主宰。\n\n内托与罗马的玛尔斯或希腊的阿瑞斯有关。"
 omen_orko:0 "鄂科"
 omen_orko_desc:0 "奥尔科是一位雷神。他的名字被用于巴斯克语中的星期四，即Orkoguna，将他与图纳兹/托尔和朱庇特/宙斯等神联系起来。在罗马人影响之前，该神可能是一个小神，但以他的名字命名一天的意义表明他对巴斯克人可能非常重要。"
 omen_sorginak:0 "索尔吉纳克"
 omen_sorginak_desc:0 "索尔吉纳克不是一个神，或根本不是神。相反，他们是神秘的生物和人，在后来的时间段里，他们经常被说成是女巫。他们施展魔法，可以造成各种恩惠或诅咒。一些索尔吉纳克也被说成是拉米纳克，也就是生育仙女。"
 omen_sugaar:0 "苏加尔"
 omen_sugaar_desc:0 "我们将向玛丽的丈夫、风暴和雷电之神苏加尔献上我们的崇拜。愿他的蛇形身影让我们的敌人感到恐惧，并激励我们的战士。"
 omen_trebaruna:0 "特雷巴鲁纳"
 omen_trebaruna_desc:0 "特雷巴鲁纳是一位卢西塔尼亚女神，其职能归属并不确定。她的崇拜广泛分布于加莱西亚与卢西塔尼亚。"
 omen_urtzi:0 "乌尔茨"
 omen_urtzi_desc:0 "乌尔茨的存在十分有趣。许多人认为乌尔茨必然是天空之神，因为众多地名、人名及词汇似乎都含有乌尔茨的词根，且外部文献也指出玛丽特宗教中存在这样的天空神祇。然而部分学者认为乌尔茨实则仅是「天空」的表述。两种假说皆有可能成立，但这桩谜案背后的真相或许永远无从知晓。"
 omen_vaelicus:0 "维利库斯"
 omen_vaelicus_desc:0 "维利库斯是韦托尼亚的来世和自然之神。他通常与卢西塔尼亚人和卡莱西亚人崇拜的恩多乌厄利库斯神有关。"
 pre_indo_european_religion:0 "玛丽特信仰"
 tartessia_not_exists:0 "#Y 塔特西亚#! 必须不存在。"
 tartessian_culture:0 "塔耳忒西亚"
 treasure_callaecian_ornated_axe:0 "雕刻的斧头"
 treasure_callaecian_ornated_axe_desc:0 "这把起源于卡拉奇的祭祀斧头，上面装饰着火炬，长期以来一直被用来进行祭祀。"
 treasure_celtiberian_plaques:0 "四块牌子"
 treasure_celtiberian_plaques_desc:0 "四块牌子是用凯尔特伊比利亚语写的，由青铜制成，包含了凯尔特伊比利亚人的法律文献。"
 treasure_edetanian_censer:0 "女神头的香炉"
 treasure_edetanian_censer_desc:0 "这个源自厄得塔尼亚的昂贵香炉代表了迦南女神塔尼特的头像，也可能是希腊女神德墨忒尔的头像。"
 treasure_ilercavonian_vessel:0 "银器"
 treasure_ilercavonian_vessel_desc:0 "一套伊勒卡沃尼亚制造的银色和金色的容器、杯子和项链。"
 treasure_lusitanian_fibula:0 "金质腓骨"
 treasure_lusitanian_fibula_desc:0 "一个希腊金匠应凯尔特人王子的要求制作的金腓骨。它装饰着一个手持凯尔特人盾牌和头盔的裸体战士与狮子搏斗的场景。"
 treasure_mausoleum_of_the_lions_iberic:0 "狮子的陵墓"
 treasure_mausoleum_of_the_lions_iberic_desc:0 "这个陵墓深受新赫梯艺术的影响，由四只放置在四角的石狮子保护。丰富的浮雕表现了自然和神话场景，如赫拉克勒斯的十二项任务和一场畸形的盛宴。"
 treasure_olcadian_necklace:0 "奥尔卡迪亚项链"
 treasure_olcadian_necklace_desc:0 "这条项链是一位奥尔卡迪亚女祭司使用的，由粘土制成，上面装饰着鸭子和天鹅。"
 treasure_stone_verracos:0 "石雕维拉科斯"
 treasure_stone_verracos_desc:0 "由花岗岩制成的变型巨石纪念碑，代表牛、熊、猪等四足动物，用途不明。"
 treasure_tarshish_stelae:0 "他施石碑"
 treasure_tarshish_stelae_desc:0 "这块古老的石碑记述了米尔卡顿在塔尔西什之地战胜撒丁人的胜利，并感谢众神使他们安全归家。"
 treasure_tartessian_ceremonial_bit:0 "祭祀用比特"
 treasure_tartessian_ceremonial_bit_desc:0 "这是消失已久的塔特西亚文化的遗迹。这个仪式用的是迦南女神阿斯塔特和凯米特女神哈托尔的发型，旁边还有两只鸟和百合花。"
 treasure_turdetanian_bull:0 "图尔德塔尼亚公牛"
 treasure_turdetanian_bull_desc:0 "一尊由图尔德塔尼亚人雕刻的公牛石灰岩雕像，旨在保护死者的灵魂在前往来世的途中平安。"
 treasure_warrior_statue_iberic:0 "伊比利亚战士雕像"
 treasure_warrior_statue_iberic_desc:0 "这座由方解石制成的雕像表现了一位准备战斗的伊比利亚贵族战士，他身穿全套盔甲，戴着凯特拉和法尔卡塔。它有金属和其他可移动的装饰品。"

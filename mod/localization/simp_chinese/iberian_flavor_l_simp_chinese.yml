 arganthonios_heritage:0 "阿甘托尼奥斯的传承"
 arganthonios_heritage_desc:0 "阿甘托尼奥斯是塔尔特索斯最后一位已知的国王，在阿拉利亚战役后，迦太基-伊特鲁里亚海军击败了福西亚的希腊人，王国也崩溃在腓尼基的铁蹄之下。现在，他们的继业者已经恢复了他们失去的显赫地位和丰富的遗产，成为一个新的、更强大的国家，抵御时光的侵蚀。"
 celtiberian_plaques_treasure:0 "委托制作铜牌"
 celtiberian_plaques_treasure_desc:0 "随着国家的集中化，我们需要建立一个明确的法律典籍，而不是依靠口头传播，这可能会导致误解和不公平。"

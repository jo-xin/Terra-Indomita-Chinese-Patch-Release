 desc_harvest_day1boost_modifier:0 "经过一个成功的夏天，我们的农民、渔民、牧民和猎人正在计算他们的战利品!"
 desc_harvest_summer_animal_modifier:0 "夏天已经到来。我们的牲畜将有丰富的草场可供生长，这将反过来给我们带来更多的肉。"
 desc_harvest_summer_city_desert_modifier:0 "夏天已经到来。城市在剧烈的高温下深受其害，虽然来自外国的贸易确实有帮助，但在夏天的阳光下没有希望。"
 desc_harvest_summer_city_farmland_modifier:0 "夏天到了。我们的城市在夏季温暖的阳光下蓬勃发展。虽然我们的一些农田被城市吞噬了，但我们剩下的可耕地为我们的人民提供了食物，外国商人发现我们的省份是理想的旅行和易货贸易。"
 desc_harvest_summer_city_forest_modifier:0 "夏天已经到来。随着树木变绿和开花，森林变得生机勃勃，而我们的城市也因与外来者的贸易增加而受益，尽管森林本身使这种贸易更加困难。"
 desc_harvest_summer_city_hills_modifier:0 "夏天已经到来。城市确实受益于食物和贸易的增加，但丘陵地形导致收益明显下降，比我们在较平坦的地形上的收益要少。"
 desc_harvest_summer_city_jungle_modifier:0 "夏天到了。虽然外面的世界从温暖的天气中受益，但上述好处并不容易到达这个深入热带丛林的城市。"
 desc_harvest_summer_city_marsh_modifier:0 "夏天到了。城市周围的沼泽地虽然为我们提供了食物，但也使商人难以进行食物和货物的交易。"
 desc_harvest_summer_city_mountain_modifier:0 "夏天到了。虽然外面的世界确实从温暖的天气中受益，但我们的城市却没有经历这样的繁荣。商人们纷纷前来交易他们的食物，但前往城市的艰辛旅程让他们感到困难。"
 desc_harvest_summer_city_plains_modifier:0 "夏天到了。我们的城市热闹非凡，来自整个地区的商人都来交换食物和货物。"
 desc_harvest_summer_fish_modifier:0 "夏天已经到来。我们的渔民报告说，活动比平时多，我们的供应将很充足。"
 desc_harvest_summer_floodplain_modifier:0 "夏天已经到来。这个地区丰富的土壤和河水泛滥，使农作物的收成数量远远超过世界各地的通常情况。"
 desc_harvest_summer_foodgood_modifier:0 "夏天到了。农作物，特别是本省的农作物，将为我们提供大量的食物。"
 desc_harvest_summer_modifier:0 "夏天到了。庄稼丰收，正是收获的季节。"
 desc_harvest_summer_wildanimal_modifier:0 "夏天已经到来。我们的猎人报告说，在本省发现的猎物活动增加，这在每年的这个时候是正常的。"
 desc_harvest_winter_animal_mild_modifier:0 "冬天已经到来。牲畜将因饲料减少而受苦，因此它们身上的肉会减少。然而，我们仍然可以靠这些动物生存。"
 desc_harvest_winter_animal_modifier:0 "冬天已经到来。牲畜将因饲料减少而受苦，因此它们身上的肉会减少。然而，我们仍然可以靠这些动物生存。"

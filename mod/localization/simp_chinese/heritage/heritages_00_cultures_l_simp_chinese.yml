l_simp_chinese:
 achaean_heritage:0 "亚该亚的传承"
 achaean_heritage_desc:0 "亚该亚人倾向于远离近年来的大型政治游戏，维持他们的小同盟，但如果主权受到威胁，他们也做好了保护自己的准备。"
 aegean_heritage:0 "爱琴海的传承"
 aegean_heritage_desc:0 "爱琴海上分散的群岛孕育出造船匠与水手，正是他们曾让波斯入侵者屈膝，并且至今仍保持着强大的海洋传统。"
 arcadian_heritage:0 "阿卡狄亚的传承"
 arcadian_heritage_desc:0 "伯罗奔尼撒半岛的内陆是偏远的乡村，是希腊都市化的精英们幻想的世外桃源，主要靠农业和偏远生存。"
 aremorican_heritage:0 "阿雷摩里卡的传承"
 aremorican_heritage_desc:0 "这些著名的水手发明了由橡木制成的船只，这些船只的大横梁由铁钉和皮帆固定，使它们能够抵御大西洋的恶劣气候，并开通了通往不列颠的贸易路线。他们在远离大海的地方感到不舒服，因此把家建在沿海的高地上，当潮水到来时，它们变成了孤立的岛屿。"
 assyrian_heritage:0 "亚述的传承"
 assyrian_heritage_desc:0 "古代亚述帝国在上美索不达米亚和叙利亚地区存在了近2000年。古代亚述人是工程大师，他们制造了一些复杂的攻城机器。此外，他们是第一批拥有职业军队的国家。"
 asturian_heritage:0 "阿斯图里亚的传承"
 asturian_heritage_desc:0 "阿斯图里亚的地形已经被证明是抵御外部危险的一道几乎无法逾越的屏障，但同时也孤立了阿斯图里亚人。"
 baltic_heritage:0 "波罗的海的传承"
 baltic_heritage_desc:0 "几个世纪以来，埋葬古坟散布在波罗的海人居住的土地上，这表明波罗的海人稳定地定居在这里从铁器时代开始一直持续到罗马帝国晚期。因此，在这些年的过程中，波罗的海人熟练地采捞了极受欢迎的琥珀。"
 belgic_heritage:0 "比利其的传承"
 belgic_heritage_desc:0 "他们融合了日耳曼与高卢的血统，加之比利其人\"战至最后一人\"的严明纪律，似乎锻造出了久经沙场的战士。而共同的信仰，则将这两个迥异的族群紧密凝聚在一起。"
 bithynian_heritage:0 "比堤尼亚的传承"
 bithynian_heritage_desc:0 "在希腊人建立的最古老的殖民地中，比堤尼亚之所以能幸存是因为服从于蛮族国王与皇帝的命令，并转而专注于发展自己的城市。"
 bosporan_heritage:0 "博斯普鲁斯的传承"
 bosporan_heritage_desc:0 "西北部黑海地区的希腊殖民者主要来自麦加拉和米勒托斯，这些希望远离大陆纷争的人建立了繁荣的贸易中心。"
 cantabrian_heritage:0 "坎塔布里亚的传承"
 cantabrian_heritage_desc:0 "坎塔布里亚山脉与世隔绝的土地是不同民族的家园。尽管山区是自然的防护区，但民众与周围环境的联系较少。"
 carnian_heritage:0 "卡耳尼亚的传承"
 carnian_heritage_desc:0 "卡耳尼亚人生活在东阿尔卑斯山边缘。一旦被困在相对稀疏的阿尔卑斯家园，他们就会经常在东波瓦利较为肥沃的平原上过冬，最终他们迁移到这些平原最东边的低地，并于公元前二世纪初在那里建立了阿奎莱亚定居点。然而，他们的成功并没有持续多久，因为在该世纪末，他们在战斗中被罗马人击败，阿奎莱亚成为一座罗马殖民地，他们的人民也被拉丁化了。——时至今日，他们的身份似乎依然有些可疑，这很可能是由于与他们的维涅托和伊利里亚邻居文化混合所致。"
 carpetani_heritage:0 "卡耳佩塔尼亚的传承"
 carpetani_heritage_desc:0 "卡耳佩塔尼亚人是一个在半岛中心有着不起眼传承的部落，经常被邻居忽视。看似软弱的事实上是他们的力量：当其他人之间无休止地争吵时，卡耳佩塔尼亚人更喜欢在和平中蓬勃发展，并建立强大的联盟，在战争不可避免地到来时可能会发动袭击。"
 celtician_heritage:0 "凯尔特基亚的传承"
 celtician_heritage_desc:0 "凯尔特基亚人是半岛上为数不多的被希腊人认为文明的部落之一，尽管不如邻近的图耳得塔尼亚人文明。许多其他部落在从凯尔特基亚人的领地迁徙后建立了自己的遗产。"
 cretan_heritage:0 "克里特的传承"
 cretan_heritage_desc:0 "克里特岛的偏远城市仍然固执地沉浸在自己的复仇和支配战争，完全无视希腊世界的巨大政治动荡。"
 dacian_heritage:0 "达契亚的传承"
 dacian_heritage_desc:0 "达契亚人与东部的革提亚人关系密切，最终将他们的人民团结在一个国王之下。他们以其可怕的战士和坚固的山地防御工事而闻名，他们将创立一个连罗马人都害怕的遗产。"
 euboean_heritage:0 "优卑亚传承"
 euboean_heritage_desc:0 "优卑亚岛既不富裕，人口也不多，但一直出产优秀的水手，并利用这座岛的战略位置和崎岖地形来维持自己的独立。"
 gallaecian_heritage:0 "卡拉厄基亚的传承"
 gallaecian_heritage_desc:0 "加利西亚的农村和山区使卡拉厄基亚人可以从自然和附近土地的突袭中劫掠地生活。"
 getian_heritage:0 "盖塔的传承"
 getian_heritage_desc:0 "盖塔人与西部的达契亚人关系密切，他们作为凶猛但光荣的战士而受到尊重。当吕西马科斯被他们俘虏时，他们的国王德洛弥开特斯释放了他，让他相信革提亚人会成为比敌人更好的盟友。"
 gothonic_heritage:0 "哥特的传承"
 gothonic_heritage_desc:0 "尽管他们无法理解地中海世界对琥珀的贪婪欲望，但波罗的海南部海岸的居民无论如何都会利用这种渴望。然而，如此获得的财富导致了由国王般的将军组成的政治分赃制的出现。"
 graeco_pontic_heritage:0 "本都希腊的传承"
 graeco_pontic_heritage_desc:0 "数个世纪以来，黑海南部的希腊殖民者一直与安纳托利亚土著生活在一起，与这些蛮族国王进行贸易和谈判。"
 helvetian_heritage:0 "赫尔维蒂传承"
 helvetian_heritage_desc:0 "瑞士最新的制度化的金矿使赫尔维蒂酋长变得富有，但由于酋长们争夺王权导致猖獗的腐败。赫尔维蒂人也是非常虔诚的，他们在各种水域中炽诚热烈地献出自己的财富。"
 hibernian_heritage:0 "希伯尼亚的传承"
 hibernian_heritage_desc:0 "一个文化被战争、海洋传统和对他们的偏见所定义的民族。"
 illyrian_heritage:0 "伊利里亚的传承"
 illyrian_heritage_desc:0 "伊利里亚的各个部落以其航海传统而闻名，尽管一些嫉妒的邻居可能认为他们只是海盗。"
 ingvaeonic_heritage:0 "北海日耳曼的传承"
 ingvaeonic_heritage_desc:0 "英格维之子们生活在沼泽搬的北海海岸，从事贸易，甚至远至阿尔比恩岛，但也从事海盗活动......"
 istvaeonic_heritage:0 "威悉-莱茵日耳曼的传承"
 istvaeonic_heritage_desc:0 "生活在更先进的凯尔特南部和北部其他日耳曼人交界处的人们崇拜他们传说中的祖先 Istio。适应南方的想法弥补了他们人口数量少的缺点。"
 italiote_heritage:0 "意大利希腊的传承"
 italiote_heritage_desc:0 "曾经富裕而强大的意大利俄忒斯城市在自己的懒惰下停滞不前，宁愿依靠当地的雇佣军和国外的援助来进行战争，而他们则讨论着哲学。"
 lepontic_heritage:0 "勒蓬蒂的传承"
 lepontic_heritage_desc:0 "凯尔特人通常不以书写而闻名，但公元前6世纪开始用伊特鲁里亚字母书写铭文的勒蓬蒂人则不是这样。这种做法一直持续到他们被罗马人征服，因为即使他们使用有技巧的盖萨蒂人，一支来自阿尔卑斯山的凯尔特雇佣军，也无法阻止罗马人的战争机器。"
 lugian_heritage:0 "卢吉亚的传承"
 lugian_heritage_desc:0 "琥珀路线穿过汪达尔人广阔的农村地区，但由于外国威胁或内部冲突，经常被切断。因此，在多次争吵之后，卢吉亚联盟在卢古斯神灵的庇护下成立，以保护这一宝贵的收入来源。"
 lusitanian_heritage:0 "卢西塔尼亚的传承"
 lusitanian_heritage_desc:0 "卢西塔尼亚人自古以来就被其他大国雇佣为雇佣军，比如迦太基人，因为他们以凶猛的战士和轻步兵的能力而闻名。"
 nilotic_heritage:0 "尼罗河的传承"
 nilotic_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 norican_heritage:0 "诺里基的传承"
 norican_heritage_desc:0 "诺里库姆铁矿，诺里库姆铁器，因其独特的质量在中欧大部分地区受到赞扬和追捧，因此难怪它为诺里基人提供了强大的战略军事物资和巨大的财富。然而，这些财富却以奢侈挥霍的方式腐蚀着他们的社会。"
 punic_heritage:0 "布匿的传承"
 punic_heritage_desc:0 "布匿城市由腓尼基商人在遥远的过去建立，散布在地中海。从大城市迦太基到利比亚的小城市，所有人都可能渴望有一天将他们的祖先家园从继业者手中解放出来，重新获得对海洋的统治权。"
 rhaetian_heritage:0 "雷蒂亚的传承"
 rhaetian_heritage_desc:0 "雷蒂亚人与世隔绝地生活在白雪皑皑的阿尔卑斯山上，远离他们的伊特鲁里亚亲戚。面对初冬和夏末，雷蒂人已经完善了木匠工艺来快速建造高质量的房屋。"
 sarmatian_heritage:0 "萨耳马提亚的传承"
 sarmatian_heritage_desc:0 "当他们在西方的斯基泰人表亲开始定居时，萨尔马提亚人将继续他们共有的游牧传统。他们很少与外人打交道，依靠自己的智慧和狡猾，成为多个帝国令人恐惧和尊敬的敌人。"
 scandian_heritage:0 "斯堪的纳维亚的传承"
 scandian_heritage_desc:0 "斯堪的纳维亚人已经适应了严酷的冬季气候，有时会从坚定的信仰中汲取力量，在众神居住的地方生活。"
 siceliote_heritage:0 "西刻利俄忒的传承"
 siceliote_heritage_desc:0 "西西里的希腊城市一直在与民粹主义的崛起作斗争，这在希腊世界是独一无二的，这是其人民追求的舒适生活哲学和文化的体现。"
 sporic_heritage:0 "斯波利克的传承"
 sporic_heritage_desc:0 "这些人广泛分散地生活在这片土地上，因此希腊人称他们为斯波伊人。后来，他们和其他人一起成为了斯克拉文人。"
 suebic_heritage:0 "苏维汇的传承"
 suebic_heritage_desc:0 "由于恐惧他们在战斗中的狂暴和无情的掠夺，伊尔明之子们已经成为许多年轻日耳曼战士的榜样，导致越来越多的人模仿他们独特的发型，即苏比安结。文明被视为他们所有敌人变得软弱的原因，也许这是理所当然的。"
 thracian_heritage:0 "色雷斯的传承"
 thracian_heritage_desc:0 "希罗多德将色雷斯人描述为世界上除了印度人之外最强大的人，如果他们能团结起来。然而，对于任何一个首领来说，这似乎都是不可能实现的......"
 treverian_heritage:0 "特雷维里亚的传承"
 treverian_heritage_desc:0 "特雷维里亚人是高卢最熟练的骑手之一，由贵族精英统治，他们通过高昂的马车葬礼来显示自己的身份。"
 turdetanian_heritage:0 "图耳得塔尼亚的传承"
 turdetanian_heritage_desc:0 "许多世纪以前，塔尔忒索斯曾是伊比利亚最重要的商业与政治中心之一。这份遗产延续至今，而其继承者便是图尔得塔尼亚人。作为布匿与本土习俗混合而成的文化，图尔得塔尼亚人是伊比利亚最文明的部落之一。"
 vaccaeian_heritage:0 "瓦恺亚的传承"
 vaccaeian_heritage_desc:0 "瓦恺亚人是农业专家。他们牢固的人人平等传统见证了他们通过集体主义农业制度开发西部高原的肥沃地区。"
 vettonian_heritage:0 "维托尼亚的传承"
 vettonian_heritage_desc:0 "维托尼亚人是一个与卢西塔尼亚人有亲缘关系的宗教民族。他们被称为神庙外表和动物形态花岗岩纪念碑的建造者。"
 vindelician_heritage:0 "温德利西亚的传承"
 vindelician_heritage_desc:0 "温德利西亚人居住在阿尔卑斯山前地带，是日耳曼人和其他凯尔特人袭击的受害者。因此，他们开始在周围无论成本如何建造更大的城市，修建最高的城墙，并利用地形优势。"

l_simp_chinese:
 Abannaean_heritage:0 "阿班奈传承"
 Abannaean_heritage_desc:0 "连接东部努米底亚和盖图利亚部落繁忙的世界，以及利比亚西北部的绿洲地区和最后一座山脉后的沙漠走廊，阿班纳恩人处于独特的位置，可以利用附近大国的弱点，同时保持在他们的领土内的安全，很少有人愿意跟随他们进入这些领土。"
 Acholan_heritage:0 "阿科尔传承"
 Acholan_heritage_desc:0 "阿科拉/阿科拉是迦太基人从梅利特建立的殖民地，位于小锡尔提斯海湾北岸，保留了米利坦本地文化的一些独特方面，如土葬，而不是典型的布匿火葬传统。附近的塞尔琴纳岛是该海湾海军活动的一个重要瞭望哨，岛上有当地人和腓尼基人的小型定居点。也许这些人利用了塞尔琴纳群岛周围的章鱼狩猎场。"
 Adoulian_heritage:0 "山岛传承"
 Adoulian_heritage_desc:0 "值得注意的是，阿杜利斯是根据法律建立的，它是红海的一个市场港口，位于著名的“山岛”对面，船只在此停泊以确保安全。随着公元前5世纪德姆特王国的消失，这座港口城镇可能在古典时期获得了独立，曾经是一个简单的商场，后来成为一个更受欢迎的贸易城市，地理位置优越。这里出口大量象牙和奴隶，据说来自内陆地区的穴居人和埃塞俄比亚人最常光顾这里。"
 Alut_heritage:0 "阿卢特传承"
 Alut_heritage_desc:0 "阿卢特拥有从青尼罗河和白尼罗河的交汇处开始的尼罗河贸易网络的优势，泛滥平原给景观带来了丰富的色彩，以及东部丰富的矿物和金属矿床，可出口到北方贵族，例如如托勒密埃及的马其顿人或库施人。阿卢特人可能早在公元前4世纪就占领了该地区，与衰落的库施王国经常发生冲突，因为所有利益相关方都渴望这片土地。"
 Androgynous_heritage:0 "雌雄同体传承"
 Androgynous_heritage_desc:0 "马克利斯人是一个独特的民族，很大程度上只存在于神话和传闻中，他们原属马卡伊人的一个分支，并在漫长岁月中脱离了原来的部落。 据说，他们甚至在孩提时代就开始尝试基本的战争，用棍棒和石头与邻居互相搏斗；还有人说，他们保持着男人和女人的两半，身上有男人和女人的乳房，一边一个。"
 Autolalian_heritage:0 "奥托洛勒斯传承"
 Autolalian_heritage_desc:0 "斯特拉波描述他们为“最强大的利比亚民族”，而老普林尼则畏惧他们的凶猛秉性。若能相信伊阿尔巴斯，激进的求婚者，曾为他们的为王，那么迦太基的伟大女王狄多也曾畏惧这个部落。作为一个盖图利亚部落，奥托洛勒斯人更以其贪婪的行为闻名——他们以可怕的野兽为食。"
 Avalitian_heritage:0 "小而好传承"
 Avalitian_heritage_desc:0 "阿瓦利特斯是距离红海对岸的阿拉伯海岸最近的港口城镇，其货物贸易量虽小，但质量很高。尤其是没药，这种有用的树脂可以给饭菜调味，也可以涂在木匠大师精心制作的产品上。那些想要前往阿瓦利特斯的人必须乘坐木筏或船只，而那些发现自己在阿瓦特利斯并希望离开的人也必须这样做。当涉及到与附近的阿拉伯城镇穆扎的频繁贸易时尤其如此。"
 Axumite_heritage:0 "阿克苏姆传承"
 Axumite_heritage_desc:0 "阿克苏姆可能诞生于衰落的德姆特王国的废墟之上，作为本土埃塞俄比亚人和贸易引起的萨巴人和南阿拉伯影响的集中混合体而发展壮大，这些影响也带来了他们的闪族神。这种文化的混合导致了崇拜不同或混合神的纪念性建筑，并导致了独特的阿克苏姆闪米特语言。阿克苏姆也是贸易和资源分配的主要中心。在内陆栖息地中获取的大部分象牙最终都会到达阿克苏姆，然后流向阿杜利斯等附近的港口。"
 Blemmian_heritage:0 "布伦米传承"
 Blemmian_heritage_desc:0 "据文献记载，布伦米人至少在公元前7世纪的努比亚国王安拉马尼时期就已存在，但其历史可能更为悠久——他们长期居住于尼罗河以东的沙漠地带及红海沿岸地区。受埃及与麦罗埃文化的双重影响，布勒米人曾同时既崇拜着菲莱岛的伊西斯等知名神祇，以及卡拉布萨的曼杜里斯等南方神灵。尽管外界常将布伦米人视为游牧掠夺者，他们实则掌控着富饶的金矿与矿产丰饶之地，并建造了众多防御严密、繁荣昌盛的城池，其中或许曾居住过一位或两位国王。"
 Borasan_heritage:0 "梅加巴传承"
 Borasan_heritage_desc:0 "梅加巴部落以黑尼罗河水系为中心生存繁衍，这条支流从主尼罗河分流而出，蜿蜒盘旋着深入群山。他们凭借繁荣的异域贸易维持生计，既与库施和埃及相连，进而通往北方的地中海世界，又与红海入口处的阿克苏姆—阿拉伯交汇处相通。\n尽管外族视其为未开化的蛮族，却乐于从部落民手中进口大量的丛林象与珍贵金属。有人坚信他们定居于阿波罗之城，那里终年阳光普照；亦有人声称目睹过该部落成员以象肉为食。此地文明程度之谜，实属耐人寻味。"
 Canarian_heritage:0 "加那利传承"
 Canarian_heritage_desc:0 "这些人被称为加那利人，因为他们与狗分享食物，并将猎物的内脏，野兽，放在公用的盘子上。他们的家在阿特拉斯山周围的茂密森林中，这里居住着各种野兽，包括最大的象和最小的蛇。这片森林被黑色沙漠包围，地面下涌出的黑色沙子点缀其中。"
 Capariensian_heritage:0 "卡帕里恩传承"
 Capariensian_heritage_desc:0 "局限于战术位置的山丘，以防伏击或入侵，卡帕里恩人必须是一个谨慎而过分小心的民族，他们的背靠着最后可见的岩石，前方是无尽的沙漠。生活中没有什么值得期待，除非到达下一个绿洲，可以暂时忘却尘土和沙子的味道。"
 Cetianian_heritage:0 "塞提安尼亚的传承"
 Cetianian_heritage_desc:0 "塞提安尼亚人居住在穆卢恰（今穆卢西亚）河上游，并控制着该河，穆卢恰源自希腊语，意为“沼泽锦葵”。塞蒂亚尼人背靠安全的阿特拉斯山脉，并在该地区发现了许多珍贵的奇异物品，因此他们可以将各种各样的物品运往下游，与河边的布胡特（Bouhout）和沿岸的鲁萨迪尔（Rusaddir）的腓尼基人/布匿人定居点进行贸易。"
 Daphnitaean_heritage:0 "达弗尼塔传承"
 Daphnitaean_heritage_desc:0 "远离山脚和海岸，达弗尼塔被无边的沙漠包围。也许他们会看到一只孤独的骆驼经过，一位来自过去的迷失的加拉曼廷战士，骑着一辆旧战车，或在炎热的沙雾中出现任何折磨的幻象。生活在沙丘之间的人们，从一个水源地到另一个水源地旅行。"
 Dodekaschoinos_heritage:0 "宗教缓和的传承"
 Dodekaschoinos_heritage_desc:0 "托勒密王朝和库施王朝之间建立的边境国家，作为希腊埃及和努比亚（麦罗埃）领域之间的文化和政治缓冲，十二城（多得卡斯科诺斯）旨在帮助整合和规范上层与埃及和努比亚人民的关系，这些人民不喜欢外国干涉的存在。在该地区建造的古代神庙，尤其是菲莱的神庙，供奉伊西斯，是驻军总督活动的主要焦点，在征服该地区后，托勒密王朝的几位成员开始将十二座城市的所有收入捐献给埃及和努比亚诸神的神庙，例如曼杜利斯的神庙。当人民安定下来后，他们的社会需求通过安抚他们的神灵而得到满足，这个缓冲国使得尼罗河沿岸与努比亚世界能够进行持续的长距离贸易，许多奇异的商品和战象通过十二城进入托勒密埃及，用以协助对抗其他继业者的战争。"
 Elaian_heritage:0 "珍珠传承"
 Elaian_heritage_desc:0 "这些点缀红海的沙质小岬乍看似乎并不重要，但事实上，居住于此的人们掌控着大量财富，并因这些财富而闻名整个海域。这些岛屿出产的货物由所谓“食鱼者”出售，其名由来显而易见；货物包括成百上千的珍珠、优质龟甲以及其他海产商品。正是这些产品使阿拉莱尤群岛闻名，而它们靠近利比亚海岸贸易港阿杜利斯的位置也使其受益良多。"
 Emporia_heritage:0 "祭司和食莲者的传承"
 Emporia_heritage_desc:0 "“恩波里亚”这一名称可能源自希腊语“emporion”，意为贸易站。虽然古代文献对恩波里亚的具体范围记载不清，但它似乎曾包含多个繁荣的腓尼基与布匿人的贸易据点和商业城市。该地区土地肥沃，由小锡尔提斯海湾及其支流，以及附近的特里托尼斯湖提供水源。古地名塔卡佩斯可能源自当地柏柏尔语，据称源于该地早于腓尼基人到来前的起源，此地以温泉著称，滋养了众多农夫与耕作者。然而，恩波里亚还有更神秘的一面。据说在格吉斯城附近的离岸岛屿梅尼克斯，正是奥德修斯著名航行中登陆之地，而此岛曾仅由堇达尼亚人居住，他们食用一种使人丧失一切志向、只沉迷于花朵本身的莲花。更为奇特的是，岛上的小型犹太社区流传着一则传说：当尼布甲尼撒二世摧毁所罗门圣殿时，许多祭司家族逃离圣城，抵达梅尼克斯海岸，并将圣殿的大门与数块地基石一同带到了岛上。然而，关于这座岛屿，以及整个利比亚地区，历来存在众多传说与说法。"
 Gerrha_heritage:0 "富饶者传承"
 Gerrha_heritage_desc:0 "这些人据说是阿拉伯人中最富有的族群，他们延续了古时迪尔蒙文明的繁荣生活，这种繁荣可以追溯到青铜时代，促进了从印度和东波斯经波斯湾到美索不达米亚，甚至更远地区的贸易。这些人是如此富有，以至于据描述称，革耳剌城拥有“金银制成的华丽工具，如家族黄金”，“门、墙、屋顶充满了色彩、金银和圣石”。很显然，这些人几乎无所缺憾，尽享富足。无论是谁，那些同样占据这片土地的人，亦会过上同样富裕无忧的日子。"
 Gwanaran_heritage:0 "瓜纳拉传承"
 Gwanaran_heritage_desc:0 "瓜纳拉被黑尼罗河的源头从尼罗河主河向东延伸的山脉和森林所环绕，，是地中海文明中被认为是穴居人、洞穴人、埃塞俄比亚人或吃小牛的人的家园，因为他们经常被视为是奇怪的，野蛮的，隐藏在大利比亚已知最南端的森林和异国景观中。然而，正是这些土地和人民创造了这个地区的许多财富，并最终落入了马其顿贵族的手中。这一事实不容否认。"
 Hadrametan_heritage:0 "哈德拉墨同传承"
 Hadrametan_heritage_desc:0 "哈德拉墨同由推罗定居者于公元前九世纪晚期建立，其原名很可能是“南方”或“南方之地”的意思，它更像是腓尼基人占领下的一个民用中心，而不是像北非沿岸的许多贸易港口那样的商业中心。与此同时，腓尼基殖民时期的主要城市中心都有布局合理的建筑规划，并设有社会宗教用途的托普特。公元前310年，在第七次西西里战争即将结束时，叙拉古的阿伽托克勒斯曾短暂占领哈德拉墨同，但由于西西里人经过长期的消耗战，无法有效地将战线保持在非洲，双方即在此达成了和平协议，西西里人撤回岛上。"
 Heritage_of_the_Great_Invading_Asparagus:0 "大入侵与芦笋传承"
 Heritage_of_the_Great_Invading_Asparagus_desc:0 "盖图利亚人往往是难以辨认的民族，跨越广阔的土地，有许多只能称为“盖图利亚”的分支部落。然而，主要的盖图利亚部落，与努米底亚部落在生物和文化上都有混合，因几件事而闻名。包括无差别地入侵周围的所有人，向地中海强国交易危险的野生动物，如盖图利亚狮子，用于娱乐，并种植比两人还高，粗如塞浦路斯芦苇的芦笋。因此，这些人成为其邻居的巨大威胁，也是常年惊叹的来源。"
 Heritage_of_the_Leather_Legged_Women:0 "皮革腿女人传承"
 Heritage_of_the_Leather_Legged_Women_desc:0 "堇达尼部落生活在靠近海边的地方，曾在食莲人（Lotophagi）来到该岛并食用使人心智迷醉、让人留恋于莲树荫下的莲果之前，居住在米尼克斯岛。希罗多德记载，堇达尼部落的女人们会在每次与新男人共度一夜后增加一个皮革脚环，以此展示她们受到了多少男人的爱戴。因此，所有人都知道哪个女人被最多男人爱过。"
 Heritage_of_the_Ostrich_Shield:0 "鸵鸟盾传承"
 Heritage_of_the_Ostrich_Shield_desc:0 "希罗多德报告说，这些人“让头顶上的发绺长长，其他地方则用夹子夹紧，使他们的头发像徽章一样”（《历史》第4卷）。很可能是因为他们以鸵鸟盾牌而闻名，他们在木质底座上铺上鸵鸟皮，就像他们的鸵鸟一样独特。这些人居住在著名的“圣母山”下，山上有茂密的森林，比利比亚所有的荒原都要翠绿。"
 Ibasim_heritage:0 "被遗弃者的传承"
 Ibasim_heritage_desc:0 "伊比萨（或埃维萨岛）和福门特拉岛，腓尼基的伊博希姆岛和罗马的弗鲁门特里亚岛，被希腊人称为自己的岛链。皮提乌萨岛（Pityusae）又称“松树之乡”，公元前八世纪，腓尼基移民和商人从伊比利亚海岸的其他殖民地回迁到这里时，这里还是一个人迹罕至的地方。这些岛屿与东面的巴利阿里群岛（马略卡岛和梅诺卡岛）不同，在青铜时代崩溃之后，直到腓尼基人占领之前，这些岛屿上的人口一直在消失，甚至可能存在大规模的迁移。腓尼基人首先在伊比沙岛南部的一个小海湾建立了一个前哨站，然后在伊博希姆（该岛的同名城市）建立了他们的主要港口，使得皮提乌萨成为地中海北部航线上来往伊比利亚海岸船只的重要港口。"
 Iolan_heritage:0 "伊俄尔传承"
 Iolan_heritage_desc:0 "伊俄尔或称“桑迪岛”，始建于公元前六世纪或五世纪，是一个小岛港口，后来成为该地区最重要的布匿中心之一，并铸造了努米底亚最早的硬币。到公元三世纪时，该港口的防御工事已相当完备，其钱币上的图案描绘了该港口销往国外的鱼类。"
 Kerkouanan_heritage:0 "刻耳库阿涅传承"
 Kerkouanan_heritage_desc:0 "刻耳库阿涅始建于公元前6世纪上半叶，凭借其规模可观的渔业生产中心、商业枢纽及盐矿资源，该城以生产染料和鱼酱（garum）著称。作为繁荣的大型贸易中心，其规整的城市网格规划进一步提升了商业效能。该城主墓地的随葬品中，可见来自远至埃及等异域的供奉物品。"
 Kuassan_heritage:0 "库斯的传承"
 Kuassan_heritage_desc:0 "至少早在公元前七世纪，腓尼基人就已定居于库斯。库斯（Kuass）之名可能来自利比亚语“Akwass”，因其丰富的盐池和生产工厂而闻名。该殖民地是加迪尔主要生产厂家的次要生产地，生产出一套著名的红片餐具，其形式为双耳瓶等常见物品。"
 Leptis_Minor_heritage:0 "小勒普提斯传承"
 Leptis_Minor_heritage_desc:0 "不要将由推罗商人建立的小勒普提斯与更南边的大勒普提斯混淆。在最初的腓尼基语中，其名字可能意味着“建设”或“海军基地”，以闪语三辅音词根缩写法刻为LPQ，有时也写作LPQY。尽管像北非大部分地区一样，小勒普提斯后来处于迦太基的社会政治统治之下，但它仍保持着富裕，在后期甚至以每天缴纳1阿提卡塔兰特（约60磅纯银）的贡品而闻名。"
 Lihyan_heritage:0 "商旅领主传承"
 Lihyan_heritage_desc:0 "利雅是一个古老的王国，幅员辽阔，横跨阿拉伯福地地区，其本身既是一个实体，也是一个大型贸易和商队贸易路线的主要中转站。利雅国王是政治和宗教事务的中心，他们在位时有各种仪式和季节性节日。它最初是戴丹（Dedan）不断发展的地方，后来逐渐成为一个中央集权的国家，在岩石上凿出的城市中进行统治，并与北方繁荣的纳巴泰人邻居交战。"
 Lixan_heritage:0 "利克苏斯的传承"
 Lixan_heritage_desc:0 "公元前八世纪的某个时候，腓尼基人在利克苏斯定居下来，这里是一个多元文化的中心，居住着大量莫雷塔尼亚本地人，他们与腓尼基殖民者和商人共同生活在紧密的邻里结构中。到了希腊化时期，这座城市主要依靠出口鱼类来支撑其经济。"
 Lixitan_heritage:0 "利克斯传承"
 Lixitan_heritage_desc:0 "唯一被航海家汉诺视为有用并带上船的友好和乐于助人的土著，利克斯塔人是众多部落中的独特存在，比起他们凶残的奥托洛勒斯邻居更为友好。或许这些人之所以如此友好，是因为他们生活在隐藏在山脉之间的肥沃河谷中。"
 Maka_heritage:0 "马甘领主传承"
 Maka_heritage_desc:0 "早在公元前2600年的苏美尔时代，就有关于马甘（阿卡德语中名为Makkan）领主的记载。这些著名的领主及其领地和建造精良的船只为该地区带来了贸易，促进了来自印度和巴克特里亚地区的货物进入美索不达米亚。马甘大陆还为当地人民及其贸易提供了大量的没药和乳香，这些自古以来就是令人向往的奢侈品。这些人很可能在居鲁士大帝或大流士一世统治时期归属波斯帝国，或至少与波斯帝国合作。他们仍然是重要的贸易伙伴，并控制着阿拉伯和波斯交汇处波斯湾的货物流。"
 Massaesylian_heritage:0 "马赛叙利亚传承"
 Massaesylian_heritage_desc:0 "马赛叙利亚人在西部与毛里人接壤，控制着西部的努米底亚部落联盟，为了应对地中海强国如迦太基的压力，文化和政治控制权得以巩固，他们还与试图统一所有努米底亚部落的马叙利亚人竞争。尽管如此，他们在战场上表现凶猛，以著名的努米底亚骑兵闻名。"
 Massylian_heritage:0 "马叙利亚传承"
 Massylian_heritage_desc:0 "最初可能是少数家族，马叙利亚人在成为迦太基保护国的过程中，获得了许多努米底亚部落的政治和文化控制权，由强国的认可和部落的细化与整合支撑。像所有努米底亚部落一样，马叙利亚人以他们迅捷而强大的努米底亚马和骑兵部队的战术闻名，他们曾为迦太基和其他强国服务，也曾与马赛叙利亚人交战。考虑到迦太基曾向努米底亚国王进贡，他们的被征服是讽刺且侮辱性的。"
 Mauretanian_heritage:0 "毛里塔尼亚传承"
 Mauretanian_heritage_desc:0 "毛里人建立的毛里塔尼亚王国，后来泛指赫拉克勒斯之柱以西的沿海地区（即今毛里塔尼亚·廷吉塔纳），也包括其邻近区域（毛里塔尼亚·凯撒里亚）。这个王国是由多个山地部落在几个统治家族的领导下联合而成的联盟。毛里人对于活跃在利比亚和欧洲的殖民势力而言既是福也是祸，他们既与外来者进行内陆出产的丰富物产贸易，又时常袭击这些势力的定居点，甚至越海袭击伊比利亚半岛的贝提卡地区。"
 Moyan_heritage:0 "叙尔博提传承"
 Moyan_heritage_desc:0 "杰贝尔-莫亚是所有莫扬文化范围所包围的地方，它位于一个相当古老且人迹罕至的大平原上，周围环绕着紧凑的山脉。凭借青尼罗河形成的巨大洪泛区以及由白尼罗河和青尼罗河补充的独特淡水源，杰贝尔莫亚和整个莫亚几千年来一直能够支持牧民社区，很久以前就有大量属于牧羊人的墓地。赛尔布提部落成员经常光顾这些肥沃的平原，喂养他们自己的牲畜和在乱葬坑中发现的牛群。也许他们对牛和牛奶的依赖是这些人平均身高八腕尺的原因。"
 Mundus_heritage:0 "莫克罗图的传承"
 Mundus_heritage_desc:0 "在马克罗比安王国崩溃后，莫克罗图是众多独立城邦之一。它的规模比周边的集市城镇更大，与西边的马劳城相当。港口虽能很好地庇护船只，却未必能保障水手的安全，因为当地环境一向被认为是‘容易引发争端’的。尽管莫克罗图从各地进口大量商品，但它最著名的还是出口一种名为莫克罗图的香料，其品质优于另一著名港口摩叙隆所出口的香料，而后者以优质肉桂闻名。"
 Musulamian_heritage:0 "穆苏拉弥传承"
 Musulamian_heritage_desc:0 "作为较小盖图利亚部落的联盟，穆苏拉弥人居住在迦太基海岸线以西和以南的沙漠地区。保留了盖图利亚人的许多习俗，但在政治上有自己的划分，穆苏拉弥人与邻近的马叙利亚努米底亚部落保持紧密的边界和联系，构成该地区的混合民族成分，以共享的语言基础维系社会。"
 Nasamonian_heritage:0 "纳萨摩尼亚的传承"
 Nasamonian_heritage_desc:0 "一个游牧的努米底亚部落沿着东部沙漠迁徙，停留在富饶的奥吉拉和锡瓦绿洲，那里是该地区唯一有生命存在的地方，位于郁郁葱葱的昔兰尼加以南（在那里他们采摘椰枣，并将碾碎的蝗虫残骸撒在牛奶上）。纳萨摩尼亚人是一个凶猛的部落，曾经生活在地中海沿岸，但被许多希腊殖民者赶出该地区，其中包括那些在昔兰尼建立城市的锡拉人。据称在战争中击败了蛇术士普西利，纳萨摩尼亚人从未真正臣服于任何人，将成为该区域未来征服者的巨大障碍。"
 Nectiberian_heritage:0 "内克蒂比利亚传承"
 Nectiberian_heritage_desc:0 "定居在阿特拉斯山脉脚下的内克蒂比利亚人被困在两块巨石之间，西边是臭名昭著的奥托洛勒斯，北边是喜欢突袭的毛里人。他们唯一的逃生途径，如果发生入侵或激进迁徙，将是穿越山脉。他们幸运地拥有皮隆平原，所以食物不是他们的许多问题之一。"
 Opone_heritage:0 "角之冠传承"
 Opone_heritage_desc:0 "奥彭位于非洲之角的顶端，是此处最著名的城市之一，拥有连接印度与红海、埃及及其他地区贸易的港口。奥彭是一个在马克罗比安王国崩溃后建立独立统治的城邦，一直是极其丰富的文化联系历史的一部分。它的坟墓里埋藏着古代迈锡尼人的遗物以及来自东西方各地的物品。至于它自己的出产，众所周知，它生产的肉桂数量是索马里沿海城市中最多的，并且以其市场上最优质的龟甲制品而闻名。"
 Perorsian_heritage:0 "佩罗西亚传承"
 Perorsian_heritage_desc:0 "生活在达拉斯河北部，那里河水流入山脉，佩罗西亚人靠近与野生犬共享食物的狂野卡纳里人。他们居住在阿特拉斯山脉脚下，靠近黑色沙漠地平线和充满危险野兽的奇异森林。"
 Pheasant_heritage:0 "雉鸡传承"
 Pheasant_heritage_desc:0 "腓扎努部落以沙漠明珠加达梅斯绿洲为中心，建立了自己的文明。他们生活在迦太基势力范围与更广阔的沙漠之间，地处南方与东方交汇之地。这个地区后来被称为费赞，腓扎努人赋予了它这个名字。在古代，没有任何一个强国能够真正征服这片土地。"
 Qedar_heritage:0 "基达尔传承"
 Qedar_heritage_desc:0 "作为北阿拉伯部落中最有组织的部落，基达尔在公元前6世纪曾达到其扩张和影响力的顶峰，但后来由于许多因素（包括利雅和纳巴泰等沿海国家的发展和中央集权）而衰落。他们主要是牧民，通过沿商队贸易路线和沙漠绿洲之间的动物产品贸易致富。有证据表明，这些阿拉伯族群与中央集权的阿拉姆国家之间存在着跨文化的动机，这一点从与居住在北方边境附近的基达尔人有关的阿拉姆地名中可以看出，或者是在定居王国外围活动的融合或同化部落的一部分。"
 Rusaddiran_heritage:0 "鲁萨迪尔的传承"
 Rusaddiran_heritage_desc:0 "鲁萨迪尔，“强大的海角”，是任何前往伊比利亚半岛的腓尼基人或布匿人水手的重要站点。这座城市拥有一个天然的、防御严密的港口，因为它的名字就来源于形成海角的岩石。它是连接赫拉克勒斯之柱的殖民地系统的最东端，也在伊比利亚‑加迪尔的影响范围之内。"
 Snake_Bite_heritage:0 "蛇毒试人传承"
 Snake_Bite_heritage_desc:0 "据说，这些古老的民族用蛇毒来测试他们孩子的力量和价值，他们也用蛇毒来测试他们的妻子，以便生下这些强壮的孩子。他们的起源不详，是非常...非常古老的民族，是被灼热的大风或游牧民族纳萨蒙人的力量丢弃在干旱的沙漠上的。在外人看来，他们仍然是有名的耍蛇人，拥有最奇特的治疗和下毒手段。"
 Socosian_heritage:0 "索科西亚传承"
 Socosian_heritage_desc:0 "索科西亚位于摩里塔尼亚山区，靠近伊比利亚海，既可通往地中海沿岸的许多腓尼基和布匿贸易站和殖民地，也可享受山区的安全。传说利比亚神安提站在山顶上挑战过路人，甚至与赫拉克勒斯战斗。或许他们继承了他的巨大力量。"
 Thamuda_heritage:0 "第一阿拉伯王国传承"
 Thamuda_heritage_desc:0 "早在公元前8世纪晚期就有当代文献证实，塔木达是阿拉伯的第一个王国，尽管它更像是一个部落联盟。萨尔贡二世声称征服了这些人和其他民族，并将他们输出到撒玛利亚，但萨尔贡一生中做过很多事情，不可能都是一个人的功绩。他们的贵族阶级由地方领袖而非受命国王统治，不可能非常稳定。"
 Thamusidan_heritage:0 "塔穆斯达的传承"
 Thamusidan_heritage_desc:0 "塔穆斯达（Thamusida）在当地语言中可能是“沼泽地”的意思，它最初是毛雷塔尼亚柏柏尔人的定居点，公元前六世纪，腓尼基定居者和商人至少部分占领了这里。该镇位于苏布巴河畔，是沿河与内陆定居点巴纳萨贸易网络的一部分，也是向北连接赫拉克勒斯之柱廷吉斯的广阔贸易路线的一部分。"
 Thapsan_heritage:0 "塔普萨传承"
 Thapsan_heritage_desc:0 "它的名字中带有利比亚本地的前缀 “tha-”，但结尾却是典型的腓尼基/布匿语，因此该定居点可能是一个本地遗址，后来被腓尼基人接管，就像非洲许多地方的许多城镇一样。塔普苏斯位于一个易守难攻的岬角上，附近有丰富的盐滩可供开采，是一个商业中心，也是前往伊比利亚和大西洋沿岸的商船的中转站。"
 Tripolitanian_heritage:0 "的黎波里塔尼亚传承"
 Tripolitanian_heritage_desc:0 "的黎波里塔尼亚是一个以萨布拉塔、莱普蒂斯马格纳和奥亚特（希腊的奥伊亚）三个城市而闻名的地区。这些城市建于远古时期，很可能是在地理位置优越的利比亚本土村庄的基础上建立的，位于迦太基人控制北非东部的边缘，考虑到以下因素，一个民族对该地区的任何控制都是脆弱的：尼罗河沿岸和昔兰尼加的强大文化，还有许多游牧部落，包括令人畏惧的加拉曼特人，他们同样擅长劫掠和贸易。当来自昔兰尼加的希腊统治者控制了最初的腓尼基殖民地奥亚特并将其称为希腊的奥伊亚，然后迦太基人重新夺回它并将其纳入他们的控制范围时，这种脆弱的控制就得到了证明。"
 Tritonian_heritage:0 "特里同传承"
 Tritonian_heritage_desc:0 "特里同人定居在特里同湖岸边，传说雅典娜·特里同涅亚在此由特里同下的仙女照顾。居住在这一奇妙而繁荣的沙漠中的吉赞特人也许起源于这里，并成为希腊雅典娜的原型。传说湖边有许多蜜蜂，吉赞特人利用它们，提取大量蜂蜜。他们还会将自己涂成红色，食用可以在山丘间找到的无数猴子的肉。或许这些男人和女人甚至骑着生活在那里的大象，常常出现在大湖的岸边，其支流河或众多宽敞的水源地旁。"
 Utica_heritage:0 "首批殖民者的传承"
 Utica_heritage_desc:0 "乌提卡建于公元前九世纪末，是腓尼基人在西地中海的第一个殖民地，位于巴格拉达斯河河口，地理经济位置优越，从腓尼基人势力范围的所有地方进口商品，包括黎凡特-腓尼基、努拉基、希腊、鞑靼、维拉诺万（早期伊特鲁里亚人）和利比亚的商品，当巴格拉达河改变了它的自然流向，原来的河道被淤塞，乌提卡被锁定在内陆位置时，大量的贸易也通过与之相连的港口城市拉什·埃什蒙（“埃什蒙角”）进行。直到公元前540年左右，乌提卡一直保持着完全的自治，当时它作为迦太基的强大盟友参与了政治安排，但在经济上仍与新的布匿首都竞争。"
 Yehan_heritage:0 "木结构建筑者的传承"
 Yehan_heritage_desc:0 "古老的索马里-萨巴的德姆特或达莫特王国于公元前5世纪开始衰落，产生了阿克苏姆，其首都耶哈至少有一座宏伟的宫殿和一座供奉萨巴月神阿尔玛卡的神庙。这座宫殿即使不是东非最早的木结构建筑，也是其中之一，证明了居住在那里的人们的精湛工艺。这些纪念性建筑所在的城市坐落在肥沃的山谷中，受到山脉的保护。"
 aad_heritage:0 "真正失落部落传承"
 aad_heritage_desc:0 "阿德人定居在阿拉伯半岛荒无人烟的空旷地带的悬崖与峡谷之中，是一个外人极少得见、甚至被邻近民族几乎遗忘的族群。据说，在极少数危险的时刻，他们狂热的崇拜会引发席卷其居住地的猛烈风暴，这些风暴远比阿拉伯内外所见的任何风暴都更为骇人。这些风暴既是祝福，也是诅咒。它们带来甘霖，缓解人民的干渴，但在沙漠之中，风暴也可能吞噬残存的一切，甚至将阿德人自身、以及著名的乌巴尔集市的记忆一同抹去——那里曾源源不断地售出成千上万袋的乳香。"
 abria_heritage:0 "蜜酒世家传承"
 abria_heritage_desc:0 "阿布罗伊（Abroi）最著名的就是他们的麦芽酒，这种酒是由最甜美的蜂蜜酿造而成，常与糕点或甜点搭配享用。阿布罗伊位于马特和德林山谷，可能也曾被称为阿尔博伊（Arboi），是臭名昭著的塔乌兰提（Taulantii）的北方邻居，或者他们可能是塔乌兰提更大的部族中的一个北方分支。"
 adabulia_heritage:0 "阿达布里传承"
 adabulia_heritage_desc:0 "这些人居住在荒凉但有些富裕的辛凯特镇及其周边地区，该地是从海岸到遥远内陆的更大贸易路线上的一个节点。黑河和尼罗河主要河流。阿拉伯部落成员在这里做一些生意，可能会导致他们的文化的注入或征服的开始。也许沙漠和悬崖的内部可以保护阿达布里人免受外来的对抗。"
 adagaiman_heritage:0 "阿达伽曼的传承"
 adagaiman_heritage_desc:0 "阿达伽曼是泰米尔人的家园，但却位于朱罗、掣罗和般帝耶等泰米尔大国之间。 也许阿达伽曼的居民是从中央集权王国移民而来，是这些社会的弃儿，他们融合在一起，在茂密的南部丛林中的山顶上建立了一个同质的缓冲国。 他们的北面是德干高原的南端，远离理想的海岸，只能依靠纵横交错的水道。 也许他们会从高处下来，寻求征服更绿的牧场。"
 aeduian_heritage:0 "埃杜伊传承"
 aeduian_heritage_desc:0 "高卢的埃杜亚人是罗马最早的盟友之一，尽管他们最终会有几次反叛。他们也是克劳狄乌斯统治期间第一批获得参议员权利的部落人。"
 aeolian_heritage:0 "埃奥利亚传承"
 aeolian_heritage_desc:0 "埃奥利亚曾坐拥伟大的特洛伊城，其希腊诸城在赫勒斯滂沿岸有深厚的商业传统，并以拥有众多哲学家居民和本地哲学家而自豪。"
 aetolian_heritage:0 "埃托利亚传承"
 aetolian_heritage_desc:0 "桀骜独立的埃托利亚人仅凭坚韧便挺过了北方邻邦的进逼，如今已准备成为希腊北部的主要强权之一。"
 agathyrsia_heritage:0 "疏远表亲传承"
 agathyrsia_heritage_desc:0 "阿伽堤耳人是一个混合民族，在不同时期表现出斯基泰人、色雷斯人、凯尔特人和威尼斯人的特征。 他们居住在西部大草原边缘的喀尔巴阡山畔，但这些人仍然是神子阿伽堤耳索斯的后裔，他们的血统可以追溯到斯基泰人。 他们每个人都会娶很多妻子，是一群奢华而贪婪的人，在很多场合都会与好友的妻子上床。 他们曾与本都草原上的斯基泰人亲近得多，但在杀死斯基泰国王阿里阿皮特斯后，他们就疏远了自己，过着与世隔绝的生活。"
 aggadir_heritage:0 "探险边缘的传承"
 aggadir_heritage_desc:0 "阿加迪尔（又名加迪尔）与北非的许多早期腓尼基贸易港口一样，建于古风时期，对某些人来说，它似乎位于已知世界的边缘。阿加迪尔港毗邻航海家汉诺记录的利克西塔部落，负责接收和送去神秘的非洲海岸商人，等待当地人在海滩上摆放货物，并以便宜的价格进行交易。他们将带着利润向北航行，经过阿拉姆比斯，进入富裕的加迪尔圈，穿过梅尔卡特双柱，然后分散到更大的地中海。最令人困惑和最未知的东西可能会出现在这个港口殖民地。一切都是陌生的——一切都很有趣。它充满了探险家的梦想。"
 aigion_heritage:0 "运动员的传承"
 aigion_heritage_desc:0 "在成为城市之前，这里曾有着新石器时代的悠久定居历史。随着荷马时代与史诗传唱的来临，这座城池逐渐崛起。自公元前800年起，埃伊戈恩便作为亚该亚的堡垒屹立不倒，亦是最早的亚该亚联盟成员之一。此地涌现出诸多英雄般的运动员，如赢得第100届奥林匹克运动会的长者色诺芬、第125届奥林匹克短跑冠军拉达斯、三度在奥运短跑项目夺冠的雅典诺多洛斯，以及在泛克拉辛与摔跤项目中制胜的斯特拉通。城市与其杰出的运动员一样，善于把握对手的弱点。在公元前373年，一场地震与海啸摧毁了邻近的赫利克后，埃伊戈恩吞并了这片无人防守的土地。公元前330年，马其顿的国王掌控了此地。"
 akarnania_heritage:0 "繁荣复仇的传承"
 akarnania_heritage_desc:0 "阿尔戈斯英雄后裔阿尔克迈翁之子阿卡尔南，在为父报仇后，听从河神阿刻罗俄斯的建议，来到此地并建立了阿卡尔那尼亚。随他而来的定居者来自伊庇鲁斯地区。荷马未明确提及此地，仅称其为伊萨卡对岸、奥德修斯的故乡，并将其视为伊庇鲁斯的一部分。公元前7世纪，科林斯人来到此地及其周边，建立殖民地并迫使本地居民内迁。于是，阿卡尔那尼亚人联合起来，在阿刻罗俄斯河畔建立了名为斯特拉托斯的首都，该城在地区战争中频频出战，同时也在经济上颇为繁荣。"
 akragantine_heritage:0 "阿克拉加斯传承"
 akragantine_heritage_desc:0 "阿克拉加斯是西西里奥特人中第二强大的城市，与叙拉古争夺全岛控制权，但也深受本城僭主与煽动家的祸害。它的神庙或许是整个希腊世界中数量最多的。"
 alizonia_heritage:0 "阿里佐内斯传承"
 alizonia_heritage_desc:0 "阿里佐内斯人位于沿海的卡利皮科人和上游的阿罗特勒斯人之间，前者是希腊人，后者是斯基泰人，他们是伟大的农民，喜欢播种和收割谷物。 他们由斯基泰人统治，自己也通过血缘和同化接受了斯基泰人的习俗，但作为一个相当平静和奴性的民族，他们在一望无际的平原上快乐地生活着。"
 alupa_heritage:0 "统治巨蛇的传承"
 alupa_heritage_desc:0 "阿卢盘人在他们的语言中是统治者，他们的名字可能是阿卢卡的音译，可能源自神话中大蛇舍沙的同名绰号。 同样，这个词也可能是指半人半蛇的纳加人。 该王国的野心涵盖了大片海岸地区，历史上曾统治过大部分地区。 也许这些野心可以实现......"
 ambracia_heritage:0 "民主忠诚的传承"
 ambracia_heritage_desc:0 "安布拉基亚始建于公元前650至625年间，由科林斯僭主库普塞洛斯之子戈尔古斯建立。这座殖民城邦最初以资源生产和出口为核心，向伊庇鲁斯贵族输送农作物、渔获及造船木材。戈尔古斯家族的暴政统治终于其子佩里安德时期，他被推翻后城邦建立了民主政体。作为科林斯的忠实属邦，安布拉基亚不仅强化了与富庶的伊庇鲁斯的联系，更在北方充当了叛乱殖民地科基拉岛的调停者和制衡力量。公元前338年虽遭腓力二世征服，但即便在继业者占领期间，安布拉基亚人仍保持着诸多传统政策与价值观。"
 amisos_heritage:0 "阿弥索斯传承"
 amisos_heritage_desc:0 "这个小镇由伊奥尼亚米利都人于公元前760年至750年建立，以两件事而闻名：考古发掘中发现的早期野山羊风格陶器，根据希腊历史学家赫卡泰乌斯的说法，该地区是以前著名的埃涅特的所在地——帕弗拉格尼亚埃涅托伊的家乡，其国王普莱梅尼斯在传说中的战争中是特洛伊人的盟友。"
 amphissa_heritage:0 "奥佐利亚洛克里斯人的传承"
 amphissa_heritage_desc:0 "安菲萨是奥佐利亚洛克里斯人最重要的城市，其名称源自一位名叫“安菲萨”的洛克里斯女子——也就是传说中风神埃俄罗斯的孙女、乱伦者马卡琉斯的女儿“伊萨”。据说太阳神阿波罗曾化身为牧羊人追求她，而慧眼识真的阿拉克涅则将他们的恋情织入她的织物之中。自迈锡尼时代起，安菲萨便已繁荣发展，延续至今，修建了众多宏伟的墓葬与神庙，以纪念他们的传奇祖先以及诸神，如阿斯克勒庇俄斯，甚至可能还有冥界的卡比里神，他们也被尊称为“安阿克斯之子”。安菲萨逐渐成为商业与文化的中心，与邻近的科林斯以及洛克里斯的较小城镇建立了密切联系，并发展出独特的身份，拥有自己的历法，甚至作为殖民势力，派遣移民远航至南意大利。作为地区要塞，安菲萨在波斯入侵希腊期间为军队提供了安全保障，并在科林斯战争与第三次神圣战争中展现出强大的战斗力。尽管马其顿国王腓力二世最终摧毁了安菲萨及其城防建筑，这座城市仍成功重建其荣光，并在与邻近的埃托利亚人等势力的局部冲突中再度崛起。"
 amyrgia_heritage:0 "豪麻饮者传承"
 amyrgia_heritage_desc:0 "居鲁士大帝在扩张波斯帝国疆域的征程中，征服了这些由阿摩尔吉斯国王领导的塞种人，他们因此被称为阿摩吉亚人；然而真正认居鲁士为其族裔主宰的则是斯帕雷特拉王后，她组建了一支军队想从波斯国王手中夺回被俘的丈夫，却发现她和她的人民视为野蛮入侵者的这些人善待了他。 这位王后和她的军队很快成为居鲁士不断壮大的军队的一部分，帮助居鲁士打败了吕底亚的克罗埃索斯。"
 ancona_heritage:0 "泰尔勒肘的传承"
 ancona_heritage_desc:0 "早在公元前6世纪，皮森特人就已统治了安科纳地区，直到公元前387年，叙拉古的殖民者来到此地，在原有的皮森特人定居点之上建立了一座更大的城市。\n该城得名于希腊语中的‘肘’，因港口被形似弯肘的岬角所庇护。这座城市对希腊人极具价值，他们在此设立了染料工厂，生产昂贵的推罗紫，这种染料在市场上贵如黄金。\n染料贸易，以及其他诸多商品的交易——既销往希腊城市，也售予资源丰富的伊利里亚与意大利部落——使安科纳迅速崛起，建立起了独立的经济体系，甚至开始铸造自己的钱币。钱币正面描绘了一只握着棕榈枝的弯曲手臂，背面则刻有阿佛洛狄忒的头像。"
 andhra_heritage:0 "恶名昭彰的雇佣兵的传承"
 andhra_heritage_desc:0 "安得拉人在《摩呵婆罗多》中被称为南方王国，在其他王国的军队中充当勇士或雇佣兵。 在萨哈德瓦（Sahadeva）王国的强大攻势下，安得拉人与其盟友一同战败。 胜利者认为，他们和许多他们的盟友一样，都是作恶多端、凶残无比的民族。"
 andros_heritage:0 "安德罗斯传承"
 andros_heritage_desc:0 "安德罗斯是基克拉迪群岛和希腊大陆之间的一个重要海军连接点，其历史可以追溯到青铜时代的帕莱俄波利斯城遗址。这座古代都城展示了整个希腊最早的防御工事之一。远古/古典时代·安德罗斯城取代了这个古老的定居点，成为了一个富裕而广阔的地方，强大到足以指责雅典的政治，并向卡尔基狄克地区派遣自己的殖民者。"
 anhou_heritage:0 "安侯传承"
 anhou_heritage_desc:0 "夹在贝加尔湖畔那近乎神话般的丁零人与真实而危险的匈奴人之间，安侯部落始终处于岌岌可危的境地。除了政治上的戏剧性变局，其族人也可被视为栖息于另一边界之上——欧亚人群与东亚最远端的族群在此交汇，日后将凝聚成此后数世纪令人敬畏且铭记史册的王国与邦联，即蒙古诸群。正因这些原因，安侯国自身的存续本就是一个疑问，倘若任何外力施压，该部落必然分崩离析，即便不致彻底瓦解。"
 antigonid_heritage:0 "安提柯传承"
 antigonid_heritage_desc:0 "很少有将军能像“独眼”安提柯及其儿子“围城者”得墨特里俄斯这样平步青云。他们的传承包括强大的围城技术，以及作为地中海希腊诸自由城邦捍卫者的地位。"
 aorsi_heritage:0 "阿俄耳西亚传承"
 aorsi_heritage_desc:0 "据东西方文献记载，他们是一个强大的扩张主义部落，在跨越本都‑里海草原的多次西迁中占有重要地位。考古表明，他们的文化起源于中亚，在公元前2世纪至公元2世纪期间，作为多个部落迁徙的一部分向西迁徙。"
 apasiciai_heritage:0 "水塞种传承"
 apasiciai_heritage_desc:0 "生活在锡尔河和咸海东岸的阿帕西亚恺人是一个依赖河流和河水恩赐的部落，他们沿着河岸放牧，驱赶马匹穿过水床芦苇。 这些人的生活比他们那些与干旱草原相伴的堂兄弟部落要轻松，他们从自然优势中获益，不断发展壮大，繁衍生息。"
 apocopa_heritage:0 "阿波科普传承"
 apocopa_heritage_desc:0 "在海岸航行者抵达被称为‘小崖与大崖’或‘小滩与大滩’的区域之前，阿波科普安是最后一处贸易港口，标志着进入被称为阿扎尼亚地区的起点。它曾是象牙与非洲森林象相关商品的中转站。除此之外，黄金、白银与异域皮毛等商品也在此流通。然而，象牙贸易的利润与猎捕大象的欲望，使得此地成为通往阿拉伯与地中海市场的重要贸易节点。"
 apollonia_heritage:0 "排外客者的传承"
 apollonia_heritage_desc:0 "阿波罗尼亚是伊利里亚最大的希腊殖民地，人口众多，起源于科林斯及可能的科基拉人，定居约公元前600年。据说希腊人是受本地伊利里亚人邀请来此，建立了当时基本荒废的繁荣贸易站。最初名为吉拉凯亚，可能源于当地僭主吉拉克斯。科林斯影响衰退后，城镇以对阿波罗的崇敬重新命名为阿波罗尼亚，和其他以“阿波罗尼亚”命名的古典城镇一样。科林斯人在控制期间主要侧重资源开采以支持本城及其增长的人口，但阿波罗尼亚很快在寡头政体下获得独立，由希腊殖民精英统治以伊利里亚人为主的居民。该城邦实行类似斯巴达人般的排外政策，同时与附近陶兰提部落保持良好关系。"
 apollonia_pontica_heritage:0 "光辉阿波罗的传承"
 apollonia_pontica_heritage_desc:0 "这座城市在公元前七世纪建立时最初名为安塞亚，定居于此的福西亚人与米利都人很快因一座重要的阿波罗神庙而有时称其为本都阿波罗尼亚或大阿波罗尼亚。事实上，城中有两座献给医神阿波罗的神庙，一座属晚期古风时代，另一座属早期古典时代。公元前五世纪，城市树立了一尊十三米高的阿波罗巨像，作为对光明、医治与歌唱之神的可见奉献。它是色雷斯沿岸最强大的城市之一，与奥德律西亚人订有允许自由贸易的条约。凭借开放贸易，它成为邻近殖民城墨森布里亚的强大竞争者与对手。这座城市成功保持了独立，未被亚历山大、腓力和吕西马科斯征服，是本都尤克辛努斯西岸唯一做到这一点的希腊城市。"
 apulia_heritage:0 "拉皮吉亚的传承"
 apulia_heritage_desc:0 "普利亚地区在亚皮吉亚人从伊利里亚迁入前早有外来殖民。青铜时代迈锡尼希腊人在传说中的特洛伊战争及东地中海青铜时代崩溃前访问、贸易并殖民此地。梅萨皮人大多定居于意大利东南端，普利亚地区则为达乌尼人和剖肯提人的家乡。达乌尼人被称为“狼族”，将巴尔干狼崇拜带入意大利；剖刻提人被希腊人称为拥有阿卡迪亚起源。这两族在各自城镇坚守，随沿海希腊城邦贸易加深而希腊化，将希腊元素融入本土宗教，生活中喜欢穿戴华丽，注重外表奢华。"
 arachosia_heritage:0 "锈蚀银盾传承"
 arachosia_heritage_desc:0 "追溯至阿契美尼德时期，从波斯波利斯的埃兰人碑文中可以看到，阿剌科西亚是阿剌科人，或帕克提人的故乡，除了为大流士一世的苏萨宫殿提供了大量象牙之外，阿剌科西亚在很大程度上默默无闻。当亚历山大征服前波斯东部行省时，他任命其将领西比尔提乌斯掌管阿剌科西亚和革德罗西亚。当继业者战争爆发时，这位将军仍坚守岗位。安提柯从欧迈尼斯手中夺得著名的“银盾军”之后，他将其中的许多人送到西比尔提乌斯那里，命令他通过危险的任务将他们全部杀死——他们太难以控制了，不能留活口。"
 arados_heritage:0 "阿拉多斯传承"
 arados_heritage_desc:0 "腓尼基北部霸主阿拉多斯，腓尼基语称“阿尔瓦德”，是叙利亚行省海岸外一座设防贸易岛。自古埃及法老时代起，它便因贸易重要性和海军实力而闻名。阿拉多斯约建立于公元前第二千纪早期，也被证实是黎凡特最早的共和国之一。"
 arakan_heritage:0 "印度化阿尔吉尔的传承"
 arakan_heritage_desc:0 "阿尔吉尔位于孟加拉湾的边缘，受到阿尔吉尔山脉的保护，作为沿海贸易的受益者，这片地区也是外来影响的契约方。这个地区是东南亚最早采纳达摩教的地方之一，从铭文来看，可能有着大规模的吠陀社群，采纳了来自恒河三角洲的传统和风俗。虽然地中海民族称其为阿尔吉尔，但印度次大陆的人可能有着更具印度化的名称，因为阿尔吉尔曾是一个印度化的王国，并且作为佛教僧侣从摩揭陀帝国传入的通道之一。除了宗教交流外，阿尔吉尔还是印度及更远西方货物传递到中国等东南亚市场的重要通道。"
 arambys_heritage:0 "紫色要塞的传承"
 arambys_heritage_desc:0 "虽然航海家汉诺据说是公元前5世纪第一个将布匿人带到这些海岸的人，但显然该地区自史前时代就有人居住。这座被称为莫加多尔的岛屿为大陆海岸提供了强大的保护，使其免受猛烈的海风侵袭，为和平和安全的港口创造了条件——这就是为什么它最适合作为腓尼基人的贸易港口，他们的商品和储存设备后来被发现在这里。作为抵御危险的公海和狂风的堡垒，本地人民称该岛为“小堡垒”。然而，这个地方不仅安全，而且资源丰富。人们在那里发现了许多骨螺壳和紫贝壳，从中可以提取骨螺紫，用于出口皇家染料。"
 argive_heritage:0 "阿耳戈斯传承"
 argive_heritage_desc:0 "作为伯罗奔尼撒半岛一个传统的反斯巴达势力以及区域强权，阿尔戈斯自伯罗奔尼撒战争以来一直时运不济。然而，随着斯巴达强权被摧毁，阿耳戈斯在继业者诸王中找到了新的盟友，他们的人民也谋算着恢复其作为军事强国的传承。"
 arkades_heritage:0 "翻腾之地的传承"
 arkades_heritage_desc:0 "阿尔卡德斯（有时也称为阿尔卡迪亚——不要与伯罗奔尼撒的阿尔卡迪亚混淆）这片土地似乎经历了严酷而动荡的历史。据说，当城市被毁、土地耕作停止时，这里的一切泉水和湖泊一度干涸并遭到破坏。土地变得坚硬，不再因雨水而松软。因此，正是农夫和人民的辛勤劳作让这片土地恢复了繁荣。当他们重建城市后，耕作者回归土地，泉水、湖泊和水域再次充盈了这片地区。\n另一个奇异之事是，与所有姐妹城的信仰相反，阿尔卡德斯的人们不相信宙斯是在伊达山诞生的，他们坚信一定是另有神圣的山洞。"
 armenian_heritage:0 "亚美尼亚传承"
 armenian_heritage_desc:0 "亚美尼亚王国成立于数百年前，几代人一直保持着自己的传统，即便在阿契美尼德王朝和亚历山大大帝的统治下，王国依然保持着自己的王权和战争传统。"
 armistia_heritage:0 "阿米斯塔伊传承"
 armistia_heritage_desc:0 "阿尔米斯塔（Armistae）是组成大伊利里亚部族德雷梅斯特（Deramestae）的一部分，他们可以在伊匹达乌鲁姆（Epidaurum）这座城市的远离内陆的山区通道中找到踪迹。由于他们控制着将伊利里亚海岸与内陆平原隔开的山脉通道，他们掌控了穿越寒冷狭窄通道的多数贸易。"
 aromata_heritage:0 "香料港传承"
 aromata_heritage_desc:0 "阿罗马塔坐落在所谓“香料岬”上，其名与现代“芳香物”一词相关，是从利比亚与阿拉伯之门通往伟大厄律特里亚海的一连串贸易港中最后几个港口之一。港口本身出产大量树脂和芳香草本，但真正赋予它最珍贵货物的，是海对岸印度诸城的进口品。它广泛出口的乳香以及桂皮深受喜爱；桂皮是一种肉桂，来自印度人以东更远的东方。"
 aroteria_heritage:0 "草原农夫传承"
 aroteria_heritage_desc:0 "阿罗泰勒斯人是斯基泰人，或至少是为斯基泰人统治的民族。他们在纵横交错的河流和支流旁肥沃的土地上种植许多谷物，但他们不仅仅是消费者。他们将这些粮食卖给南方的黑海居民，由此再远销至更广阔的海洋，因此该地区与尼罗河三角洲等地并称“粮仓”。\n公元前7世纪末的迁徙浪潮中，当地原住民在游牧首领及其庞大畜群与部落的强力压迫下被迫屈服，此后该族群很可能沦为斯基泰统治下的臣民在血统与习俗上均被斯基泰人同化。"
 arseken_heritage:0 "双城传承"
 arseken_heritage_desc:0 "厄得塔尼亚人涌向黎凡特海岸的马萨利亚港口萨戈因提乌姆出售货物，并成群迁往俯瞰贸易站的一系列山丘。在那里，他们建立了一座名为阿尔塞的城市。阿尔塞此后一直以这种形态存在，一座伊比利亚城市如肿瘤般附着在较小的马萨利亚港镇之上，直到第二次布匿战争前夕，萨戈因提乌姆逐渐吸收了厄得塔尼亚城市。公元前219年，萨戈因提乌姆在八个月围城后落入汉尼拔军队之手。尽管它并不在《埃布罗条约》划定给迦太基的势力范围内，罗马人仍以此为战争借口，于是第二次布匿战争爆发。公元前212年，罗马人夺回这座已成废墟的城市并迅速吞并之。他们将其重建为萨贡图姆，此后数百年间这座城市在罗马统治下享有巨大繁荣。"
 arvernia_heritage:0 "阿维尔尼传承"
 arvernia_heritage_desc:0 "阿维尔尼是南高卢较具外交影响力的部落之一，同时拥有深厚的金属加工手工业传统。"
 arykandia_heritage:0 "阿律坎狄亚的传承"
 arykandia_heritage_desc:0 "阿律坎狄亚，作为最古老的吕基亚城市之一。虽然它避免加入任何联盟，但它拥有国际化的人口结构和一定程度的宽容，许多神庙都供奉着希腊、琐罗亚斯德教和本土安纳托利亚信仰中的各种神灵。"
 ashmaka_heritage:0 "阿湿波的传承"
 ashmaka_heritage_desc:0 "它是最南端的十六雄国之一，但在公元前五世纪到公元前四世纪期间却遭到了南达王朝的征服。虽然他们的地理位置使他们远离印度北部平原的混乱和孔雀王朝带来的混乱，但他们与远在北方的羯陵伽王朝保持着交流和贸易往来。阿什玛卡平原纵贯全境，因此粮食产量较高，地形也更适合居住。"
 aspisia_heritage:0 "好马的传承"
 aspisia_heritage_desc:0 "阿斯皮西人训练他们的马群在咸海和锡尔河以北更加崎岖但仍然肥沃的土地上漫游，这里见证了许多草原部落及其马主的大迁徙。 在所有的萨迦人中，他们是思想比较开放的，有时会向从东部山区抓来的奴隶和商人学习。"
 astakos_heritage:0 "阿斯塔科斯传承"
 astakos_heritage_desc:0 "公元前8世纪建立的麦加拉殖民地，据说也是由波塞冬和仙女奥尔比亚之子、传奇人物阿斯塔科斯建立的，这座城市最大的遗产在公元前301年被比堤尼亚国王芝普特斯一世摧毁，并在其位置上建立了一座新城：尼科米底亚，戴克里先统治下未来的东罗马首都，以芝普特斯之子尼克美狄斯一世命名。"
 atavia_heritage:0 "森林居民的传承"
 atavia_heritage_desc:0 "在摩诃婆罗多（Mahabharata）时代，阿塔维人曾打败过强大的萨迪瓦（Sahdeva）。 他们的家园是一片大森林，他们的名字就来源于这片大森林，这里是他们能够保持安全和与世隔绝的地方，同时也是他们与周围大国（如北方的孔雀王朝）争斗的地方。"
 athagousia_heritage:0 "阿塔高西亚传承"
 athagousia_heritage_desc:0 "阿塔加乌西人居住在沙漠山丘旁，这些山丘构成了遥远北方更干燥、更不适宜居住地区的屏障，阿塔加乌西人发现自己处于一个文明的小山丘上，远离从海岸到内陆的一般贸易和通道。主要的定居点位于阿科尔达特，这里自青铜时代起就有人居住，坐落在最后一片适合放牧的土地上。也许，这些人可能会发现他们在当地的局限性......有限。"
 athenian_heritage:0 "雅典传承"
 athenian_heritage_desc:0 "尽管雅典影响力的全盛期可能已经过去，它依然是希腊世界最有威望的城市之一，同时也是柏拉图建立的学院所在地。虽然有时会在卑鄙的外国僭主——比如法勒戎的得墨特里俄斯——的统治下变得衰弱，这座城市依然保持着民主制的传统。"
 atropatenian_heritage:0 "阿特罗帕忒斯传承"
 atropatenian_heritage_desc:0 "作为少数几个能够在亚历山大大帝东征，及其之后的继业者战争中独善其身的波斯领主，阿特罗帕忒涅在各种意义上，都是逝往阿契美尼德帝国的最后守护者。"
 attasia_heritage:0 "尖帽塞种人传承"
 attasia_heritage_desc:0 "无论是外国人称呼还是他们自己指定，提格拉克豪达部落都以“提格拉克豪达”（tigra-khauda）或“尖帽子”而闻名。在从东到西的许多草原部落中，高帽子都是高贵的象征，但波斯人给我们留下了这个名字，以区别于伊朗东部的其他游牧民族。早在公元前8世纪，这些人作为一个单独的部落或部落联盟的首领，就统治了这一地区，并给波斯和西方的统治者造成了混乱。他们在征服时，命令臣民建造与斯堪的纳维亚长屋相媲美的大型泥砖宴会厅或寝室。"
 auteinia_heritage:0 "奥滕尼的传承"
 auteinia_heritage_desc:0 "虽然他们生活在希伯尼亚的西部，但奥滕尼人也在东部留下了足迹，许多移民偏爱靠近不列颠的海岸。这里是希伯尼亚最大的一些湖泊的发源地，为当地提供了淡水、灌溉和食物。加上这些丰富的水源，地区气候温和宜人，极少出现高温，便于人类定居。"
 azania_heritage:0 "歌唱鱼的传承"
 azania_heritage_desc:0 "阿卡迪亚的阿扎尼亚是一处奇异之地，自古以来便是一片充满怪奇的土地，由同名的阿赞统治。阿赞是全阿卡迪亚国王阿尔卡斯与宁芙埃拉托之子。据说他的儿子克雷托尔离家建立自己的家园与城市，并依照传统迅速以自己命名。克雷托尔背靠阿罗阿尼亚山，前有阿罗阿尼乌斯河与拉冬河，拥有一处格外美丽而奇特的自然地点。它以克雷托尔泉闻名，这是阿扎尼亚的奇观之一，据说凡饮其水者都会失去对酒的喜好。此泉被描述为从山坡本身涌出的泉水，据称曾用于仪式净化，例如普罗透斯诸女的净化仪式。除魔法泉水外，此地还栖居着访客所谓的“歌唱鱼”，它们住在阿罗阿尼乌斯河中，声音如鸫鸟。周围有如此奇异的景观，克雷托尔人与整个阿扎尼亚人推崇自由和个人自主高于一切，也就不足为奇了。"
 bactrian_heritage:0 "希腊-巴克特里亚传承"
 bactrian_heritage_desc:0 "东方和希腊化文化的交汇，一个强大的国家，位于印度的门户，巴克特里亚是一个战略地区，肥沃且高度城市化，通过建设城市、融合希腊-印度文化和传播佛教，在巴克特里亚和印度留下了印记。"
 balearic_heritage:0 "塔莱奥提传承"
 balearic_heritage_desc:0 "具姆奈西亚群岛坐落在地中海西部蔚蓝的水域中，因岛上居民喜欢穿轻便的衣服而得名。群岛拥有得天独厚的天然良港，他们利用有利的地理位置，不仅出口久负盛名的小麦和著名雇佣兵的服务，而且在罗马统治时期，还因其优质的葡萄酒和美味的蜗牛而闻名于世。"
 bambyce_heritage:0 "亚兰祭司王传承"
 bambyce_heritage_desc:0 "以守护神而闻名的神庙所在地：阿塔伽提斯，班彼刻的历史可以追溯到公元前9世纪被亚述帝国吞并。硬币表明，在阿契美尼德王朝统治接近尾声时，它由亚兰祭司王统治，并在亚历山大帝国崩溃后过渡到塞琉古君主们统治。这座城市在马其顿王朝/塞琉古王朝统治的掌控下繁荣发展，成为底格里斯河上安条克和塞琉古之间的“停靠地”，最终成为罗马叙利亚最富有的城市。"
 bangli_heritage:0 "槃揭梨的传承"
 bangli_heritage_desc:0 "尽管像克劳迪乌斯·托勒密这样的罗马地理研究者主要关注恒河‑雅鲁藏布江三角洲当地人建造的名为“Sounagoura”的贸易商场，但居住在该地区的邦利人远不止是兜售丝绸和糖等稀有商品的商人。他们的轻步兵是丛林中作战的大师，他们以猛烈进攻设防城市而闻名——也许是为了获取内部的补给，因为有传言称，尽管他们拥有丰富的自然资源，但在三摩呾吒，粮食短缺一直是一个问题。"
 beikthano_heritage:0 "潘赫瓦传承"
 beikthano_heritage_desc:0 "传说中贝克塔诺最初由王后潘赫瓦统治，她是堂光王国和斯里兰卡神话中岛屿上的食人族与仙女的后代。后来的事态发展揭示了皇家血统的严重后果——室利差呾罗国王杜塔巴昂前来攻占并掠夺了贝克塔诺。他俘虏了公主潘赫瓦，并将她带到自己的王国，娶她为妻。贝克塔诺这个名字似乎与吠陀神毗湿奴相联系，表明其与印度教及与印度西部的吠陀王国之间有着深厚的联系。"
 beinnaka_heritage:0 "黄金力量的传承"
 beinnaka_heritage_desc:0 "位于卡尤斯克地区，比纳卡城在其文化风格和建筑上与沿着可通行路线的其他蒲育文化定居点有着许多相似之处。然而，这个定居点的选址丰富的矿产资源和金属矿产，使得富人家的房屋内遍布着象、龟、狮子等形象的宝石。比纳卡遗址上发现了早期蒲育文的铭文，这些铭文出现在陶器和珠宝上，金银饰品随处可见。传言说，只有比纳卡的力量足以推翻长期占据北方的堂光王国的统治，因此它在所有蒲育城邦和其人民中拥有特殊的敬意。"
 berberia_heritage:0 "柏培拉传承"
 berberia_heritage_desc:0 "邦特兰“乳香海岸”以南的肥沃高原由数条干谷和天然湖泊塑成，为许多部落及其村庄提供了家园。柏培里亚是地中海人对居住在众多贸易港内陆地区各族群的概称，这些人常为乳香生产提供大量体力劳动，也负责包装和运输前往港口或更深内陆的货物；在内陆，强大的酋长拥有庞大的财富储藏。"
 bhoja_heritage:0 "雅度的传承"
 bhoja_heritage_desc:0 "Bhojas是Satvatas部族的一个南方部落，来自古代的Yadavas。在《摩诃婆罗多》中，他们被称为 \"摩勒迦人\"（mlecchas），是言语难懂的野蛮人，与雅利安人对立，无法实现终极涅槃。 波迦王子一脉曾统治过吠陀时代的维达婆王国，后来该王国分裂为自己和邻近的波迦卡塔王国，并互相竞争。"
 bithynia_heritage:0 "齐波厄忒斯传承"
 bithynia_heritage_desc:0 "早在亚历山大到来之前，比提尼亚人就摆脱了波斯的统治，他们决心保持独立，建立一个可与继业者抗衡的永恒王朝，意欲拿下整个小亚细亚的北海岸。"
 boeotian_heritage:0 "玻奥提亚传承"
 boeotian_heritage_desc:0 "玻奥提亚联盟曾在忒拜领导下一度成为希腊最强大的国家，但在马其顿干涉该地区之后已经退居次要地位。"
 boi_heritage:0 "战士牧人的传承"
 boi_heritage_desc:0 "与曾洗劫罗马的塞农人相似，玻伊人部族跨越阿尔卑斯山迁入山南高卢——该部族的一支在此定居（另一支仍留居今波希米亚地区的中欧故地）。与其他南迁的凯尔特部族一样，他们并未驱逐波河流域的伊特鲁里亚居民，而是与之共存，并将古城费尔西纳（其历史可追溯至公元前三千年）改建为自己的新都玻诺尼亚。从词源看，\"波西人\"既可解作\"牧人\"，亦能意为\"战士\"——同时代文献记载，其财富既来自成群牲畜，亦源于满藏金帛。或许这两种释义皆有其理，因其生计兼重征战与游牧。波西贵族尤重情谊，不以蛮力或财富论尊卑，而以扈从多寡量权位。"
 boihaemia_heritage:0 "玻伊海弥亚传承"
 boihaemia_heritage_desc:0 "北部波伊人不断扩张领土与影响力，在鼎盛时期以波希米亚、上西里西亚和斯洛伐克西部为核心，并将潘诺尼亚纳入势力范围。然而，他们自己的这个帝国相当脆弱，最终被布雷比斯塔麾下的达契亚人与日耳曼人终结。此外，他们铸造了独特的贸易金币，并作为琥珀之路上的中间商，与斯洛文尼亚的斯科尔迪斯基人和波罗的海人民贸易。"
 borysthenia_heritage:0 "玻律斯忒尼亚的传承"
 borysthenia_heritage_desc:0 "居住在玻律斯忒涅斯河沿岸的人们依靠富饶的河水和遍布北部地区的丰富树木过着美好的生活。 很久以前，即公元七世纪，第一批斯基泰人来到这片土地，入侵并围攻了当地最大的堡垒。 沿河居民被征服后，在斯基泰贵族的看管下继续从事日常活动，保留了许多传统习俗和价值观，并接受草原领主的行政指导。"
 brigantes_heritage:0 "希伯尼亚至高者的传承"
 brigantes_heritage_desc:0 "无论他们是完全独立的族群，还是来自不列颠中部布里甘蒂亚部落联盟中的一支分支，希伯尼亚的布里甘蒂亚人都可能因传承而与大陆保持联系。爱尔兰女神布丽姬是布里甘蒂亚的对应神祇，这表明这两个部落之间不仅共享了命名传统，也共享了对“至高者”与胜利的崇拜。尚无定论，但一些人认为这个部落是乌·巴尔奇或乌·布里格特家族的祖先，再次维持了与布丽姬和布里甘蒂亚之间的词源联系。"
 brigantia_heritage:0 "强大高地人部落的传承"
 brigantia_heritage_desc:0 "布里甘蒂人是不列颠最大的部族，其族名可能源于“崇高”或“强大”之意。该族群名称与凯尔特女神布里甘蒂亚存在相似性，后者可与命运女神堤喀、智慧女神密涅瓦或胜利女神维多利亚相媲美，皆意为“崇高者”。她或许象征着通过战胜所有对手来获取权力与成功的理念。\n这种对统治权的追求，或许促成了他们作为部落联盟的庞大规模——历经数代战争与多位成功君主的整合，布里甘蒂各部作为辅助军队为联盟统治者征战。其政治中心伊苏里翁·布里甘提翁毗邻伊瑟尔河，坐拥广袤农田养活民众。这条河流不仅促进贸易往来，更构成天然屏障。该部落可能曾由一位强悍的女王统治——北方的喀里多尼亚人宣称，罗马人险些败于这位统治部落的女性之手。"
 bruttia_heritage:0 "叛逆鹿族的传承"
 bruttia_heritage_desc:0 "布鲁特提人，亦称布雷提奥伊，意为“鹿族”，曾居住于整个卡拉布里亚地区，直至希腊人到来。尽管被驱逐至内陆山地，他们依然坚守该地的高山与丘陵。他们曾隶属卢卡尼亚人，在意大利南部各族中社会地位较低，但于公元前356年获得独立，其名与叛乱者和逃亡者紧密关联。"
 budinia_heritage:0 "伪装驯鹿传承"
 budinia_heritage_desc:0 "布迪尼人是一个隐秘的部落，人数众多，但因居住在众多森林中而不为人知。 他们的领地位于伟大的木城和格隆要塞的北面和周围，那里居住着希腊人和斯基泰人。 有人说布迪尼人自己说的是斯基泰语，也有人说那些蓝眼睛的树上居民说的是森林居民的语言。 他们身披许多毛皮，流浪的旅行者声称曾看到牛一样大小的驯鹿在树丛间穿梭，由于毛皮的颜色会随季节变化，所以很难看到它们。"
 byblos_heritage:0 "彼布罗斯传承"
 byblos_heritage_desc:0 "作为已知世界最为古老的城市之一，远早于其他国家出现人烟之前，彼布罗斯就一直是诸多腓尼基海洋王国的故乡，并且源自此地的许多殖民者建立了西地中海的各个伟大布匿城镇。"
 byzantine_heritage:0 "拜占庭传承"
 byzantine_heritage_desc:0 "拜占庭很幸运地建立在地中海东部最重要海峡的要冲地带，通过博斯普鲁斯海峡的贸易通道变得富裕。"
 calactea_heritage:0 "美丽海岸的传承"
 calactea_heritage_desc:0 "杜凯提乌斯，曾经的西西里西库利帝国领袖，于公元前466年经神谕指示，在被叙拉古流放至科林斯期间归来后建立了卡莱阿克特城，意为“美丽海岸”。其更为人所知的名字是卡拉克塔。此地美丽肥沃，适合徒步、骑马或乘车穿行。最初许多希腊殖民者因其美景和肥沃而来到此地，随后又迁往沿海其他城镇。许多人在这片壮丽海滩及平静海域附近捕鱼，享受奢华与利润。"
 calchedon_heritage:0 "盲人之城传承"
 calchedon_heritage_desc:0 "麦加拉殖民地建立于公元前685年，它的建立者一定受到了众神的诅咒，如此盲目，以至不曾在博斯普鲁斯海峡（拜占庭的建立地）更优越的另一边建立他们的殖民地。无论希腊人（雅典人）和波斯人迈加比佐斯都这么说。然而，这座城市依然从贸易中繁荣，建立了许多神殿。真是瞎猫碰着死耗子。"
 caledonia_heritage:0 "坚硬之足的传承"
 caledonia_heritage_desc:0 "卡尔多尼亚联盟，可能与皮克特人联盟相同，与邻近的部落相似，他们主要建造山丘要塞，耕种那些存在于高山之间的少量耕地。\n或许是由于他们家园地形的艰难，‘坚硬之足’的名字因此而得。除此之外，他们还被描述为红发与大体型，这些特征常与日耳曼部落相关联。虽然他们是朴素的农民与山地居民，但他们极力保护家园与土地，当地中海的大国试图挑战他们时，他们并未屈服，最终不得不修建两道伟大的城墙来限制他们的力量。"
 cantiacia_heritage:0 "桤木林传承"
 cantiacia_heritage_desc:0 "坎提部落坐落于不列颠南部海岸，毗邻南方众多高卢部落，因此受益于繁荣的贸易往来、人口迁徙和思想交流。正因如此，他们在诸多习俗与器物上与大陆高卢人颇为相似，甚至被视为不列颠诸部落中最先进精妙的族群。其都城杜罗维努姆·坎蒂亚科鲁姆——此名或许源于“椴树林畔坎提人的坚固堡垒”之意——筑有三重深壕沟及攻防工事，防御体系极为严密。"
 cappadocian_heritage:0 "卡帕多西亚传承"
 cappadocian_heritage_desc:0 "亚历山大征服后，卡帕多西亚多次易手。这块领土最初由波斯总督统治，后来交给了欧迈尼斯，马其顿人又再次占领了这块领土，尽管没有人能说这会保持多久。"
 carmoan_heritage:0 "卡尔莫传承"
 carmoan_heritage_desc:0 "卡尔莫已经崛起为图耳得塔尼亚最强大的国家之一。当卡尔莫军队出现在阿斯蒂吉和乌尔索等重要城市城墙外时，这些城市便宣布臣服。但这种成功使其余图耳得塔尼亚国家将卡尔莫视为自身独立的潜在威胁。"
 carnonacia_heritage:0 "卡耳诺纳恺的传承"
 carnonacia_heritage_desc:0 "作为卡尔多尼亚及更广泛布里顿地区的第二北部部落，卡耳诺纳恺人生活在西北海岸及周围岛屿的部分地区。那里的低地提供了更好的生活条件，而海岸则提供了丰富的渔业资源。\n分散的定居点和较低的人口密度促使他们频繁使用船只在岛屿之间进行交流与贸易。"
 carpia_heritage:0 "卡尔皮传承"
 carpia_heritage_desc:0 "卡尔皮人是一个与大山紧密相连的民族，他们的名字或来自大山，或取名为喀尔巴阡山脉。 卡尔皮人本身是另一个杂交部落，很难区分他们共同的达契亚人、盖蒂克人和萨尔马托-西徐亚人。 众所周知，他们是好战的民族，有着侵略和持续战争的悠久历史，他们的邻居也因此而惧怕他们。 躲避他们攻击的唯一办法就是加入他们。"
 carthaginian_heritage:0 "迦太基传承"
 carthaginian_heritage_desc:0 "推罗的腓尼基殖民者长途跋涉来到此地建立了“新城”，如今迦太基是布匿世界——或西腓尼基世界无可争议的领导者。她的传承包括强大的海军和贸易势力，由魅力非凡的将军们领导走向无上的辉煌。"
 carthago_heritage:0 "迦太基传承"
 carthago_heritage_desc:0 "迦太基的卡尔塔哈达什特城曾是迦太基人的光辉首都。这座城市在地中海地区拥有巨大的贸易力量。"
 carvetia_heritage:0 "鹿人部落的传承"
 carvetia_heritage_desc:0 "名字可能意为‘鹿族’的卡耳维提部落生活在布里甘蒂部落以北。作为他们野性和角状特征的象征，卡耳维提人崇拜神祇贝拉特卡德罗斯，其他人将他与战神玛尔斯联系起来，因为这位角神象征着好战和纪律。正因如此，他们才能在庞大的布里甘蒂亚联邦的面前保持独立。\n他们的权力中心位于克利夫顿堤，日后的“卢顾瓦利翁”，意为“卢古斯之力”，卢古斯是主要的凯尔特神祇之一，象征着力量和控制。"
 cassanders_heritage:0 "卡山德传承"
 cassanders_heritage_desc:0 "在阿吉德家族的耕耘下，马其顿成为了泛希腊地区首屈一指的军事强国，并将希腊大陆统合在一面旗帜之下。即使亚历山大殒落之后，在崛起的安提帕特家族治下，马其顿对希腊各城邦依然有着无可置喙的统治权，马其顿的贵族们亦是其军事机器的中坚力量。"
 caucasia_albania_heritage:0 "阿尔巴尼亚传承"
 caucasia_albania_heritage_desc:0 "高加索部落，包括卡斯庇亚人，在很大程度上与世界其他地区不和，被他们多山的国土孤立。高加索地区的阿尔巴尼亚王国没有经过证实的建立日期，但根据历史资料，它被认为是在马其顿帝国/阿契美尼德帝国的伊朗地区与生活在草原之外的游牧民族之间的边界地区。阿尔巴尼亚王国内的卡斯庇亚人部落和其他部落被认为是阿契美尼德王朝总督领的一部分，并参与了波斯帝国的政治，直到它在希腊化时代成为一个独立的政体。"
 caucia_heritage:0 "考基人的传承"
 caucia_heritage_desc:0 "考基人居住在现代都柏林地区，那里后来成为北欧维京人劫掠与殖民之地。考基人或许与日耳曼族群有着比地理巧合更深的联系。他们的名字与低地国家及德国西北部的日耳曼部落“考奇人”相似，连古代作者都注意到了这一点并提出疑问。\n这一巧合，再加上邻近的马纳皮人与大陆同名部落的相似性，使一些人相信在海峡与海域之间存在更大规模的族群迁移与联系。也许不列颠群岛确实是所有逃离罗马统治的部族的避难所，无论他们来自西班牙、高卢还是日耳曼地区。"
 cavia_heritage:0 "卡维的传承"
 cavia_heritage_desc:0 "卡维亚人生活在由喀斯特泉水供给的古老斯库塔里湖周围，是伊利里亚人中资源充足的部族。他们大部分定居于首都埃皮卡里亚（又称杜尔尼乌姆），与居住于海岸线并在该地区掌握相当权力的陶兰提族北部部落接近。陶兰提王和军阀多次对卡维亚人及其相近规模的邻居发动袭击和远征，但卡维亚人坚守立场，保护了他们的湖泊定居点。"
 celesitania_heritage:0 "伊利恩人传承"
 celesitania_heritage_desc:0 "这些早期建造努拉盖塔的民族中，来自凯尔斯塔尼亚的撒尔丹人及其中的众多部落是曾经占据富饶的伊奥利安平原的后裔。在与迦太基人的数十年战争和有毒迷雾吞噬平原之后，他们被迫撤入山区——一个外敌从未能将他们驱逐出去的地方。外部资料称他们有多种名字——一些人称他们为伊奥利安人，伊奥劳斯的后裔，赫拉克勒斯的侄子，另一些人则称他们为伊利恩人，来自特洛伊古名伊利昂。即使是德尔斐的阿波罗神谕也曾预言伊奥利安人的命运，将永远保持自由——这一承诺至今未变。"
 cenomannia_heritage:0 "友好部族的传承"
 cenomannia_heritage_desc:0 "切诺曼尼部落，一支居住在帕杜斯河北部沿岸的西萨尔平高卢人，于公元前400年左右，在埃利托维乌斯的领导下，从阿尔卑斯山脉迁入此地。据说，他们中的一部分人还向西迁移，定居在马赛利亚一带以及沃尔凯人的领地上。与周围的部落不同，切诺曼尼部落对南方的希腊人较为友好，对跨越帕杜斯河参战持更加谨慎的态度。"
 charklik_heritage:0 "若羌遗产"
 charklik_heritage_desc:0 "对于沿塔里木盆地南线自西向东的旅人而言，若羌标志着旅程中较安全路段的终点，前方就是大片被称为罗布泊的盐沼。商人、信使或任何人可以走这条路，或尝试向南穿越柴达木沙漠的备用路线。绕过这些盐沼还有一种更奇特的替代方式，即向北进入广袤的塔克拉玛干，抵达今库尔勒，然后沿塔里木盆地北线向东行进。城镇南侧高耸的阿尔金山脉是体型较小而健壮的马种的故乡，如普氏野马，它们或许是完成这趟伟大旅程的可靠坐骑。"
 cheran_heritage:0 "掣罗传承"
 cheran_heritage_desc:0 "作为泰米尔三大强国之一，掣罗人因其面向西方的海岸而从海上贸易中受益匪浅，他们将大量外来货物（尤其是黑胡椒）通过厄律特莱海运送到波斯港口，并沿厄律特莱海向北运送到埃及，最终到达地中海。他们与西方蓬勃发展的贸易激发了人们对海岸线上更多港口通商的渴望，邻国人口也很有吸引力。这种控制将使西海岸的制海权与东部的掣罗人的制海权相同。"
 chersonesan_heritage:0 "刻耳索涅苏斯传承"
 chersonesan_heritage_desc:0 "刻耳索涅苏斯是希腊的殖民地，但它周围四面八方的土地都是陶利卡人，居住着那些像斯基泰人一样的男人和女人，他们对从卡洛斯利门出海的希腊商人进行海盗活动。 这些人足智多谋，而且无情。"
 chersos_heritage:0 "荒凉悬崖的传承"
 chersos_heritage_desc:0 "自旧石器时代以来，切尔索斯岛（现代的克雷斯岛）可能以原始印欧语根源的“悬崖”命名，这也许与它陡峭的海岸线有关。然而，希腊语中的‘切尔索斯’意指干旱/荒凉的土地，这也可能描述了该岛的环境和它在定居方面的相对不利。该岛只能通过现代的弗拉纳湖获得灌溉并供应饮用水，因此，岛上最大的港口朝向邻近的大陆和海岸线，在那里可以获得新鲜的水源和更好的运气。一位希腊商人来到此地，只为在这片荒凉的岩石上享受安全，并与可能敌对的伊利里亚人进行贸易。"
 cholan_heritage:0 "朱罗传承"
 cholan_heritage_desc:0 "朱罗人保持着对海岸线的强力控制，在印度南部起到一个强大的制海权作用。除了众多的港口外，朱罗人还可以使用例如卡威利河等河流支流开垦的丰富农田。朱罗人是令人惊异的寺庙的主要建设者，并留下了大量文学作品，加强了他们在泰米尔群体中的遗产。朱罗人作为大海统治者的野心使印度南部海岸的所有港口以及东南部与大陆相连的岛屿成为焦点。"
 chrysaoric_heritage:0 "卡里亚传承"
 chrysaoric_heritage_desc:0 "卡里亚海岸已有希腊移民定居数世纪之久，由此形成的希腊与卡里亚文化混合社群，往往以联邦形式自治。"
 cimbrian_heritage:0 "辛布里传承"
 cimbrian_heritage_desc:0 "公元前2世纪末，辛布里人的凶猛战士对罗马共和国构成了严重威胁。他们从遥远的斯堪的亚入侵高卢和日耳曼，在两场艰难的战斗后才被马略击败。"
 cimmerian_heritage:0 "辛梅里亚的传承"
 cimmerian_heritage_desc:0 "辛梅里亚人曾是伊朗高原、黎凡特和安纳托利亚的首批灾难，他们曾是世界上最广泛和最令人畏惧的草原民族，直到后来被斯基泰人取代。辛梅里亚人有着被游牧民族保密的伊朗起源，他们曾在敌人心中播下恐惧，并且是最优秀的雇佣兵和战领主。他们强大到能够打破弗里吉亚王国，直到图格达米之死后，他们的征服势头才逐渐消退，最终成为一个谦卑的民族。虽然他们未能永远掌握权力，但他们动摇了整个亚洲的政治局势，为新纪元的到来奠定了基础。"
 ciusan_heritage:0 "西乌斯遗产"
 ciusan_heritage_desc:0 "西乌斯城战略位置优越，扼守普罗庞提斯海，自建城以来便是一座重要城市，后来在东方米特里达梯王朝的统治下臣服于波斯统治。"
 cnidusian_heritage:0 "克尼多斯传承"
 cnidusian_heritage_desc:0 "克尼多斯拥有悠久的历史，他们建立了遥远的殖民地，并通过巧妙的外交手段从内陆的野蛮人手中保持了独立。"
 colchis_heritage:0 "埃厄忒斯传承"
 colchis_heritage_desc:0 "这片土地最初被称为国王埃厄忒斯的王国，女巫美狄亚的故乡，金羊毛的安息之地，以及伊阿宋和他的阿尔戈英雄们在前往科尔基斯海岸的航行中所看到的财富和无数财富的家园。但事实并非如此，因为科尔基斯是一个快速发展的高加索文化，在青铜时代晚期掌握了金属铸造，并在公元前13世纪发展成为一个被承认的王国。然而，亚述人和波斯人的入侵与干预导致了王国的衰落，边境的后退，甚至是政府结构的完全崩溃，到继业者时期，科尔基斯已经完全摆脱了外国的统治，再次由本土王朝维持统治。"
 commagenian_heritage:0 "孔马革涅传承"
 commagenian_heritage_desc:0 "孔马革涅地区，虽然其前希腊化时代的历史是模糊的，但在历史上似乎有一个漫长而连续的踪迹，可以追溯到公元前15世纪的叙洛-赫梯王国，被称为“Kummaha”，与后来的古代城市“Kummuh”几乎相同，被认为与希腊化的萨摩萨塔是同一地点/城市，阿提卡诗人卢基安据说来自那里。在成为塞琉古王朝的一个省之前，该地区可能是亚美尼亚王国的一个总督领，拥有多元文化的人口，是希腊和伊朗文化交流的熔炉，在内姆鲁特山的王家圣地最为明显。"
 coracensia_heritage:0 "干港传承"
 coracensia_heritage_desc:0 "在巴拉里安人中，科拉肯西亚人和他们附近的部落被认为具有无与伦比的航海技能，可以与任何同行竞争——甚至是提尔西亚的伊利恩人。传说在古代，当腓尼基人尚未离开他们的故土时，这些巴拉里安人曾占据撒丁岛西部的岛屿，且据说将其命名为巴利阿里群岛。此外，他们在那里修建了数百座努拉盖，以安抚父神。迦太基人称这座岛为“马戈”岛，而在原住民口中，它实际上名“努拉”，与我们现在所说的“努尔”，以及居住在此的努伦塞斯部落相联系。"
 coriondia_heritage:0 "希伯尼亚军团的传承"
 coriondia_heritage_desc:0 "科里翁迪可能是“军队”或“武装起来的人”的意思，即使在名字上也给人一种不祥的感觉。他们的地理位置靠近现代的威尔士海岸，能够方便地派出商船和移民。有人认为，也许是因为他们有能力进行远播，使该部落在前基督教到基督教时代在东南沿海存活了下来。或者，也许是他们征服的影响使他们继续留在岛上。"
 coritania_heritage:0 "科里塔尼部落的传承"
 coritania_heritage_desc:0 "科里塔尼人是生活在英伦东部的一个和平的农业部落，他们过着较为封闭的生活，统治他们的是多个小国王，形成松散的联邦，或许存在一个至高无上的国王，但他只在自己领域内有权威。他们的首都拉特·科里塔诺鲁姆坐落在两条溪流交汇的地方，中央有一个湿地岛屿，这为部落提供了一些防御功能，也可能是一个交通枢纽，是农业商品和少数奢侈品的交易地。"
 cornavia_heritage:0 "角头皮克特人的传承"
 cornavia_heritage_desc:0 "科尔诺维人是卡尔多尼亚最北部的部落，生活在岛屿的北缘。望着北方海洋，他们的视野几乎到达了神灵仅曾造访的地方——或许寒冷的赫柏瑞亚就在彼方。\n最远的地方可能是图雷，这也许是一个遥远的岛屿——奥尔卡迪群岛，现代的设得兰群岛、法罗群岛，甚至是冰岛或斯堪的纳维亚。凯斯内斯的科尔诺维人可能得名于与南方科尔诺维人相似的角头——他们是世界尽头的角头民族。"
 cornivia_heritage:0 "角部人部落的传承"
 cornivia_heritage_desc:0 "科耳诺维部落像他们的布立吞邻居一样建造了许多山丘堡垒，他们以制造大量陶瓷容器储存盐而闻名——这对于食品保存至关重要。尽管他们是一个侵略性和凶猛的群体，但科耳诺维部落在贸易或财富方面并不特别富裕，拥有的奢侈品和财富比同期的邻国要少。\n他们的财富在于从本地采石场提取的建筑材料和石材的数量。该地区发现了大量的石灰石，包括后来罗马堡垒德瓦·维克特里克斯的主要定居点下方。他们的据点乌罗科尼翁，即日后罗马人的维罗科尼翁，意为‘狼人之城’，或许源自当地的传说，或是因为他们战斗时如同一群狼般凶猛。"
 critensia_heritage:0 "克里特斯的传承"
 critensia_heritage_desc:0 "克里特斯是达贝利以南的一个大部落，位于库施土地以南的森林地区，直接控制着麦罗埃。沿着青尼罗河的乘船可以更快地到达这个部落，而不是穿越荒野。他们的邻居，居住在白尼罗河和青尼罗河之间富饶土地上的叙耳波提部落居民，本来是动物产品的重要贸易伙伴。"
 crobyzia_heritage:0 "无甲者的传承"
 crobyzia_heritage_desc:0 "克罗比佐伊是色雷斯族群，居住在伟大的伊斯特罗斯河旁，与狡猾的盖塔族相对。他们是色雷斯势力圈内的北部部族，以自己的创造性方式应对危险的邻居。其西侧为凶猛的特里巴利部族，南侧为俄德律西亚人，后者被所有色雷斯人视为文化中的霸主。有趣的是，克罗比佐伊被说成不穿铠甲，顶多戴一顶毡帽或其他款式的帽子。"
 crotine_heritage:0 "克罗同传承"
 crotine_heritage_desc:0 "克罗同是一座成功的亚该亚殖民地，是数学家和智者毕达哥拉斯和他著名学派的家，后来，革命者害怕其不虔诚的影响和政治影响力，因而进行打压，这位哲人被迫离开了这座城市。"
 curse_of_maat_heritage:0 "玛阿特的诅咒"
 curse_of_maat_heritage_desc:0 "玛阿特诅咒了我们！混沌和邪恶正在蔓延。"
 cyrenaican_heritage:0 "昔兰尼加传承"
 cyrenaican_heritage_desc:0 "希腊殖民地昔兰尼是由从忒拉岛逃荒而来的定居者建立的。他们成功融合了当地的居民，并建立了著名的彭塔波利斯，即五城，现在已成了整片区域的代名词。作为一个贸易和学术中心，只要昔兰尼加能在强国环绕之下保持独立，就能拥有特殊的地位。"
 dabelia_heritage:0 "达贝利传承"
 dabelia_heritage_desc:0 "达贝利部落的土地从北到南有将近20天的行军路程。他们与库施人之间仅隔着一小群门诺内斯人，并且是在从麦罗埃向南前往靠近青尼罗河河湾的树木繁茂地区的贸易路线上的第一个主要群体。 "
 damnonia_heritage:0 "深渊之民传承"
 damnonia_heritage_desc:0 "丹诺尼伊人栖居于不列颠尼亚西北边陲，地处中部布里顿人的疆域与后来令人闻风丧胆的皮克特人之间的交界地带。他们隐居在喀里多尼亚山脉深处的幽谷之中，因而被称为“深谷之民”。虽然尚无定论，但这个称号或许也源于他们开采深山矿脉的传统——那些巍峨群山中蕴藏着丰富的矿藏。这支民族既坐拥群山环抱，又濒临爱尔兰海海岸，既能自主开采关键资源，又可通过船运向海外贩售，因而得以摆脱单纯的征服与掠夺生存模式。他们是文明与制度的缔造者——后来他们与希伯尼亚的斯科特人联合，建立了斯特拉思克莱德王国，由此孕育出苏格兰民族与“苏格兰”这片土地的雏形。"
 daorsia_heritage:0 "巨岩伊利里亚传承"
 daorsia_heritage_desc:0 "达奥尔西（Daorsi）部族是德尔马泰（Delmatae）部族的对手，他们是沿海的贸易者和掠夺者，经常处于更强大部族的威胁之下。达奥尔西的首都达奥尔松（Daorson）促进了部族的希腊化，因为这里是许多希腊商人的避风港。像希腊城市一样，这座城市本身就是一座堡垒，周围环绕着巨石墙，并且有一个高耸的卫城，里面有许多官员和大型公共场所。这个遗址自青铜时代以来一直是海岸文化的长期驻地。"
 darayley_heritage:0 "达雷莱的传承"
 darayley_heritage_desc:0 "达雷莱位于蓬特为数不多的肥沃高原之上，交通便利，既可通往附近马劳港的市场，也可进口商品，满足腹地部落及其生产人口的需求。通过该地区进口的外来商品包括沿利比亚东部贸易体系从南部港口进口的鸵鸟蛋壳。从石碑铭文中可以看出，萨巴文化曾传播至此。"
 dardanian_heritage:0 "达耳达尼亚传承"
 dardanian_heritage_desc:0 "达耳达尼亚王国回顾了其引以为傲的军事传统，曾多次向战败的摩罗西亚人和马其顿人勒索贡品。"
 darinia_heritage:0 "达瑞人的传承"
 darinia_heritage_desc:0 "达耳尼人的名字可能意为“骚动”或“愤怒”之人。他们的祖先可以追溯到传说中的达伊尔——在地中海势力了解这座岛屿之前，统治并英勇奋战于古老希伯尼亚的王者与英雄。由于他们的侵略性和对愤怒的重视，达耳尼人可能被认为是某位“红色战神”的后裔，这位神祇象征着战争与激烈的情感。这些人可能正是后来乘船渡海前往不列颠、建立达尔里阿达王国并最终建立苏格兰的斯科提部族。"
 deccan_heritage:0 "德干传承"
 deccan_heritage_desc:0 "德干高原位于吠陀文化和德拉威文化的交汇点，迅速成为文化交流的温床。尽管如此，其内陆地位，被北方帝国和东西高止山脉与海洋隔绝，使该地区无法充分利用南印度利润丰厚的泰米尔贸易。"
 deceanglia_heritage:0 "德西昂吉部落的传承"
 deceanglia_heritage_desc:0 "德西昂吉部落位于卡诺维乌姆的所在地，位于曾被称为辛威河的最低可通行点，部落的领土虽然不大，位于现代威尔士东北部，但拥有丰富的克鲁迪安山脉矿藏。许多矿区出产大量的铅和银矿，这些矿产可以供部落使用，也可以远销其他地区，成为珠宝和工具的原料。"
 delmatia_heritage:0 "阿尔马图斯的袭击者传承"
 delmatia_heritage_desc:0 "德尔马提亚部落人民大多以牧羊为生，除了武器外，他们比邻近的部落更为原始。在这一方面，他们远远领先于同胞部落。作为主要的牧民，他们崇拜森林之神西尔瓦努斯（称之为维达苏斯），并将其与本土女神塔纳结为配偶。除此之外，他们的重点是战争崇拜以及战争神阿尔马图斯和他的亲族。小规模的凯尔特影响出现在他们的德尔米纽姆城市，该城市的历史可以追溯到青铜时代。"
 delphic_heritage:0 "德尔斐传承"
 delphic_heritage_desc:0 "作为希腊世界的中心和阿波罗最著名的先知皮提亚的家乡，德尔斐在希腊历史的变迁中扮演着重要的角色——她那富裕的神庙宝库是许多不虔诚的劫掠者的首要目标。"
 demetia_heritage:0 "金色德费德的传承"
 demetia_heritage_desc:0 "塞卢雷斯以西是德梅塔部落，他们可能是现代威尔士德费德地区的古代人民，这片土地见证了威尔士与南方的杜姆农尼亚以及爱尔兰人民之间的贸易和社会联系。这里的土地相较于周围更少山脉，适宜放牧和养殖绵羊等温顺的动物。除了丰富的牧场，附近的山脉也蕴藏着丰富的金矿，特别是在科尔菲河的山谷，这里将建有奥高法金矿。"
 derbicia_heritage:0 "居鲁士之祸的传承"
 derbicia_heritage_desc:0 "一些传说至今仍在讲述居鲁士大帝的最后一击是如何来自一个得耳比部落民之手，居鲁士的塞种盟友“豪麻饮者”又是如何击退该部落的。得耳比人是大益部落的邻居，随着时间的推移，他们牢牢扎根在了南方的家园，靠近古代阿契美尼德国土的边界。他们最崇拜的是母神阿皮。"
 deuria_heritage:0 "德乌里传承"
 deuria_heritage_desc:0 "居住在柳树成荫的河畔，德乌里人（Deuri，亦称Derrioi或Derbanoi）掌控着穿越伊利里亚山脉最开阔、最易通行的要道之一。他们的领地林木葱郁、土壤肥沃，水域中满是飞鱼和伊斯特罗斯鲑。这些丰饶物产与沿海部落经其通道运往内陆市场的丰厚贸易，共同滋养着这个部族。群山环绕使得扩张并非易事，但外敌入侵同样难以得逞——天险铸就了攻守兼备的生存之道。"
 dingling_heritage:0 "蹄足之人的遗产"
 dingling_heritage_desc:0 "这些人距离定居世界如此遥远，以至于他们的身份成了神话般的传说。公元前4世纪的著作《山海经》将他们描述为一种膝盖以下长着马一般蹄子和毛茸茸小腿的民族——一个属于群山本身的民族。丁零是生活于欧亚大陆东部泰加林起始地带的骁勇好战的劫掠者和贸易猎人群体，他们可以分成三个主要的神话群体，每个群体都具有突出的动物特征。"
 ditionia_heritage:0 "迪提奥尼部落的传承"
 ditionia_heritage_desc:0 "作为潘诺尼亚地区的伊利里亚部落之一，迪提奥尼部落生活在被保护的山谷和他们首都斯普洛努姆内部的坚固城堡中，即使在最恶劣的天气条件下，强大的军队也难以攻陷这个地方。因此，迪提奥尼人是一个勇猛且自我保护意识强烈的部落，他们害怕入侵者，但为入侵的可能性做好了充分准备。任何敢于袭击他们家园的人，神明都会施以怜悯。"
 dobunnia_heritage:0 "胜利的臣服者传承"
 dobunnia_heritage_desc:0 "他们曾被称为玻杜尼人（Bodunni），这或许源于他们在战场上的英勇表现或文明成就。如同其南部的近邻部落，多布尼人在与地中海强权建立密切联系前便已铸造自有钱币——这些钱币常饰有枝状徽章，可能是某种重要农作物的象征。然而不同于好战的邻族，多布尼人似乎更热衷社交往来，甘愿臣服于显赫强权，并积极接纳外来文化——他们认为这些文化能为自身社会增添精致气息。尽管政治权力中心可能坐落于后来被称为科里尼乌姆·多布诺鲁姆的丘陵堡垒，但民众却在附近的奥皮达（城镇）中蓬勃发展，这些城镇成为贸易与移民的枢纽。"
 dobunnian_heritage:0 "多布尼亚传承"
 dobunnian_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 dochia_heritage:0 "多基亚传承"
 dochia_heritage_desc:0 "多基人居住在山脚下的森林里，从蓬特向东走，很快就到了沿海腹地。黑尼罗河流经他们的土地，不仅为他们提供了鱼类，也为土壤提供了肥力。因此，他们在自己的土地上防御严密，即使是来自远在北方的库施人等大帝国的入侵者也会望而却步。"
 dongqiemi_heritage:0 "东且弥的遗产"
 dongqiemi_heritage_desc:0 "东且弥位于裕勒都斯河谷的大山谷中，沿着一条被认为是北路新道的贸易旅行路线，又名东切弥，是且弥国中不属于且弥人正统领地的那一半，位于对墟谷中较小的肥沃地带。这些人不仅充当着对抗游牧范围广阔的大月氏和车师部落的边境屏障，有时在车师扩张时期还沦为其附庸。同样的命运也时常降临在西且弥头上。在与远在东方、贸易往来的汉朝诸邦保持关系时，东且弥和西且弥两国都曾派遣使者携带礼物，因为这两个民族非常古老，早已深植于这片土地，顺应着邻国不断变化的局势。"
 dumnonian_heritage:0 "杜姆诺尼亚传承"
 dumnonian_heritage_desc:0 "冬诺尼伊人是不列颠尼亚南部的一个部落，在康沃尔半岛的尽头保持着防御姿态。他们占据了前罗马时代不列颠尼亚为数不多的主要城镇之一，并通过利润丰厚的锡贸易赚取财富。"
 durotrigia_heritage:0 "堡垒居民传承"
 durotrigia_heritage_desc:0 "杜罗特里加人，“堡垒居民”，栖居于不列颠尼亚南部海岸遍布丘堡的土地上。作为少数在地中海势力介入前便自铸货币的部落，他们在铸币方面的完美主义——其钱币常被发现于外域并被重新铸造——构成了杜罗特里加部落联盟的独特政策。无论遭遇何等困境，他们都坚持将死者葬于壕沟中，并以某种形式举行最后的祭祀宴饮。其位于杜耳诺瓦里亚地区的都堡（以少女堡为例）自公元前4000年起便有人居住，后被扩建为部落统治者的坚固城堡。其主要防御工事建于公元前600年左右，又于公元前450年左右扩建，占地面积达原址的三倍。这座堡垒不仅为贵族和部落成员提供最严密的保护，更成为商业与交通的枢纽中心。"
 dyme_heritage:0 "运动诅咒的传承"
 dyme_heritage_desc:0 "迪墨位于亚该亚西北海岸，距离拉里索斯河30斯塔迪亚，该河将其与埃利斯领土分隔开；距名为阿拉索斯的海岬及其海角则有60斯塔迪亚。迪墨这座城市与海洋及其水源息息相关。也许正是这些水路使被放逐的安纳托利亚考康部族得以入境，许多希腊人称他们为离开故土后定居于此。此城曾为至少一场伯罗奔尼撒战争重要海战中的船员和幸存者提供庇护。尽管如此，迪墨最为人知的却是古代运动员欧博塔斯，他赢得了公元前756年第六届奥林匹克运动会的短跑比赛。因未被尊荣，其诅咒降临于所有亚该亚人及其运动员，直到亚该亚人为他立像，并由佩莱奈的索斯特拉图斯赢得少年组赛跑，诅咒才得以解除。"
 eblania_heritage:0 "厄布拉尼的传承"
 eblania_heritage_desc:0 "厄布拉尼人居住在现代都柏林以北地区，其名字可能来源于‘黑池’之意，可能是指一个潮汐池或一片沼泽地，那里流传着许多令人恐惧和神秘的传说。\n这个部落在布文达河与奥博卡河附近建有一座名为厄布拉纳的定居点。甚至‘厄布拉尼’这个名字可能也以‘埃德曼’的形式保留到了现代地名中。这个地点与不列颠的势力有着密切的贸易往来，罗马人后来也向此地运送货物，以换取自然资源。"
 elatea_heritage:0 "俄伊塔之门的传承"
 elatea_heritage_desc:0 "首先，埃拉泰亚是一座卓越的军事要塞。它位于凯菲索斯河畔的肥沃盆地，该河也是当地神祇的居所，更重要的是，这里是从俄伊塔山通往希腊南部的重要隘口，地理位置极具防御优势。埃拉泰亚人自称是阿卡迪亚人的后裔，是伯罗奔尼撒的阿尔卡斯之子埃拉托斯的子孙。市集上至今尚存一块刻有埃拉托斯名字与肖像的石碑，表达对其的敬意。然而，这块石碑在薛西斯军队入侵期间的火烧福基斯土地的浩劫中几乎被毁，直到马其顿的腓力二世控制该地区后，防御工事才得以重建。正是这次复兴，引起了希腊南部地区的警惕——这座城市既是城墙，也是入侵之门。"
 elean_heritage:0 "厄勒亚传承"
 elean_heritage_desc:0 "厄勒亚是波斯入侵时逃离伊奥尼亚的福西亚难民的主要聚居地。他们的名气主要来源于其航海经验和城市中诞生的哲学家，其中就包括芝诺，其悖论依然困扰着当地的居民。"
 eleian_heritage:0 "厄利斯传承"
 eleian_heritage_desc:0 "爱利斯人是奥林波斯神庙的守护者，也是四年一度的奥林匹克运动会的慷慨举办者，他们占据着希腊文化的十字路口，充当争端的解决者和胜利的裁判者。"
 eleutherna_heritage:0 "埃勒夫塞尔纳传承"
 eleutherna_heritage_desc:0 "多里安人在公元前9世纪在此地殖民，或者至少是在米诺斯人、迈锡尼人和青铜时代的大崩溃之后很久才开始掌权。这是一个建立城镇的好地方，因为当地陡峭的山脊提供了大量的自然防御。作为基多尼亚和克诺索斯之间的天然十字路口，厄琉忒耳那受益于贸易商队和通过这些富裕港口进入克里特岛的奢侈品。该城在岸边有自己的斯塔夫罗梅诺斯和帕诺耳摩斯港口，以满足自己的进口需求。"
 epidauran_heritage:0 "爱皮道鲁斯传承"
 epidauran_heritage_desc:0 "作为阿斯克勒庇俄斯信仰的中心，埃皮达鲁斯吸引了来自整个希腊世界的医生和自然哲学家，推动了医学的研究，并在寻求治疗的朝圣者的赞助下蓬勃发展。"
 epidaurum_heritage:0 "扎普塔尔传承"
 epidaurum_heritage_desc:0 "公元前6世纪左右，埃皮达鲁斯是最早突破伊利里亚边界的古希腊殖民地之一，并与当地被视为“野蛮人”的人们建立了正式的交流。不要与著名的埃庇丹努斯混淆，后者是另一个位于伊利里亚的古希腊城市，一些人认为它是引发伯罗奔尼撒战争的原因之一。埃皮达鲁斯则更多是一个文明接触与贸易的地方，生活在这里的伊利里亚人称之为扎普塔尔。"
 epirote_heritage:0 "伊庇鲁斯传承"
 epirote_heritage_desc:0 "长久以来，伊庇鲁斯的绿色土地都分成不同的国家，但随着时间推移而统一于摩罗西亚人的武力之下，而摩罗西亚人经常与相邻的马其顿的阿吉德王朝结盟。"
 eretrian_heritage:0 "爱利特里亚传承"
 eretrian_heritage_desc:0 "爱利特里亚，又称“桨手之城”，是卡尔基斯之后最强大的优卑亚城市，二者曾争夺肥沃的勒兰丁平原的控制权，爱利特里亚曾在继业者的冲突中贡献船只，而这些冲突让优卑亚痛苦不堪。 "
 etruscan_heritage:0 "伊特鲁里亚传承"
 etruscan_heritage_desc:0 "作为意大利半岛最古老的民族之一，伊特鲁里亚人拥有悠久而自豪的国家建设与城市建设遗产。"
 ferghani_heritage:0 "泰苑传承"
 ferghani_heritage_desc:0 "费尔干纳遗产以肥沃的费尔干纳谷地和后来被称为绝域亚历山大的城市为中心。泰苑或大宛这个社群，字面意为“大伊奥尼亚人”，是中亚最遥远的希腊文化飞地。阿契美尼德波斯帝国曾把来自最西部行省的希腊流亡者，主要是伊奥尼亚人，迁往东北边境，以防进一步叛乱，尤其是在著名的伊奥尼亚起义之后。那些希腊人被送往药杀水下游的居鲁波利斯，此城以阿契美尼德王朝奠基者命名；亚历山大征服全波斯后，很可能将其改名为他最遥远的城市。此地后来成为区域内希腊文化堡垒，尤其在亚历山大又安置更多希腊人之后。当地人依靠肥沃土地为生，饲养著名的“天马”，并融入更大的希腊-巴克特里亚社会，直到东方入侵者前来叩门。"
 frentania_heritage:0 "弗伦塔尼的传承"
 frentania_heritage_desc:0 "佛壬塔尼是一个从亚平宁山脉延伸至亚得里亚海的意大利部族，与好战的萨莫奈部族接壤。古人中有些甚至认为他们是萨莫奈人的一个分支——但两者在对罗马的立场上有所区别。大约公元前319年，弗伦塔尼被罗马单独征服，区别于萨莫奈人。他们居住在一片由众多河流穿过的肥沃丘陵地带，这些河流发源于萨姆奈山脉。该地铸造的硬币上刻有奥斯坎语“佛壬特雷”，可能指代当地居民或佛壬图姆的首府，后者是该松散中央政府的统治中心。"
 fugandulu_heritage:0 "蒲犁门的传承"
 fugandulu_heritage_desc:0 "在中国人眼中，夫甘都卢是掸族人的边邑，被称为“西南夷”。其领土横亘于一条贯穿东南亚腹地的巨大未开发贸易走廊之上，成为穿越马六甲海峡的漫长海路外的替代航线。这条通道显然令诸多大型帝国都束手无策。夫甘都卢国在梵文文献中或被称为“室利差呾罗”，意为“骠地门户”。其都城室利差呾罗乃吴哥时代前最宏伟的都市之一，城名“福地/荣光之野”昭示着此地赋予居民的丰饶与荣光。零散传说称其承袭自北方的太公王国，有两位太公后裔在此开疆拓土，建立自己的统治。"
 gadiran_heritage:0 "伽迪耳传承"
 gadiran_heritage_desc:0 "加迪尔于公元前8世纪中后期由提亚商人和殖民者建立，当时是一座重要的港口城市，在梅尔卡特神及其神谕的庇护下，加迪尔成为赫拉克勒斯之柱以外最大的贸易枢纽。从附近的悬崖峭壁和山脉中开采出的大量白银和贵重金属使加迪尔的实力不断增强，加迪尔领导着一个强大的前布匿殖民地联盟，发展并控制着从北部的卡西忒里得斯（锡岛）到南部的阿拉姆比斯的大西洋贸易。"
 gandhara_heritage:0 "犍陀罗的传承"
 gandhara_heritage_desc:0 "犍陀罗是印度 16 个古老王国之一，在《摩诃婆罗多》和《罗摩衍那》史诗中被列为西方王国之一。 在这些史诗中，犍陀罗因其创始人、德鲁伊之子犍陀罗王子和沙库尼王子而闻名，沙库尼王子本人也是传说中库鲁克舍特拉战争的起因，犍陀罗是印度和西方世界之间的一个重要边境点。 当大流士一世国王穿过开伯尔山口征服犍陀罗王国时，印度在军事上与这些强国有了不期而遇。 从那时起，犍陀罗就成了更大集团的附庸国，从波斯总督领变成了亚历山大征服后的马其顿希腊总督领，然后又变成了塞琉古王朝的总督领，最后又回到印度的控制之下，成为庞大的孔雀帝国的一部分。 然而，在外国统治下，白沙瓦和奢叉尸罗城随着更有效率的政府的引入而繁荣起来，并成为财富、技术和信仰改革的中心。"
 gangania_heritage:0 "西欧河流的传承"
 gangania_heritage_desc:0 "传说中，西欧部落曾居住在现代威尔士西部以及希伯尼亚——两地的联系尚不明确。西欧人生活在西欧河流域，这条河既是佩特尼岛上最长的河流，也以女神西欧娜命名——她象征着‘拥有智慧’。这条河流是七条河流之一，据说它通向凯尔特的其他世界智慧之泉，泉中环绕着九棵榛树。据说神灵利尔的孙女西欧娜在此地溺水身亡，从而将她的名字赋予了这条河流。"
 garamantes_heritage:0 "加拉曼特传承"
 garamantes_heritage_desc:0 "加拉曼特人是古代撒哈拉的主要力量。事实证明，他们适应沙漠的军队对其他部落来说是致命的，并阻止了罗马人将费赞变成一个省。加拉曼特人也是多产的农民和贸易商，从撒哈拉山脉开采珍贵的宝石，并促进了从乍得和马里到地中海的长途贸易。加拉曼人对撒哈拉到现代马里和毛雷塔尼亚的征服确保了他们被所有人所恐惧。"
 gedrosia_heritage:0 "消逝军团的传承"
 gedrosia_heritage_desc:0 "亚历山大在回国途中，就是这片土地夺走了他三分之一的军队。革德罗西亚几乎是一块荒芜的岩石，到处都是高山和沙漠，与它下面的厄律特莱海形成了鲜明的对比，尼阿克斯在亚历山大的命运之旅中与他一同航行在厄律特莱海。虽然这是一片死寂的土地，但仍有少数灵魂生活在那里，他们就是食鱼人——人们称他们为食鱼族。他们一定是被诅咒的民族，要在这样一个严酷无情的地方生活。"
 gela_heritage:0 "僭主战争的传承"
 gela_heritage_desc:0 "革拉由克里特和罗德岛殖民者于公元前7世纪初联合创建，因附近同名河流而得名。著名剧作家埃斯库罗斯于公元前456年在此去世。建城后，该城迅速发展繁荣，据传公元前6世纪该城的殖民者建立了强大的阿克拉加斯城。在僭主希波克拉底斯和革隆统治下，革拉与邻近城市多次开战，一度征服包括强大的叙拉古。其首次重大失败与毁灭来自迦太基人，此后其与西西里其他希腊城邦关系增进。"
 gelonia_heritage:0 "三堡传承"
 gelonia_heritage_desc:0 "据说，革隆人或革隆尼人是希腊人革隆努斯的孩子们，而革隆努斯本人则是赫拉克勒斯的儿子，斯基泰人的兄弟。同样有传说称革隆城，一座全木质结构的城市，有时也被称为海隆，是希腊人的家园，他们放弃了在沿海商站的生活。在革隆，市民们讲一种介于希腊语和斯基泰语之间的语言，因为他们受到了周围布迪尼部族的影响，这些部族生活在北部的森林中，也生活在城市周围的领土上。 在城墙和三座坚固的城堡内，可以看到许多工坊和摊位，工匠和金匠们在这里工作，为贵族和贸易制造伟大的奇迹和艺术品。这座城市位于大草原的边缘，是北方森林和寒冷沙漠的起点，是世界上最后一个文明之地。"
 genuatia_heritage:0 "利古里亚商港传承"
 genuatia_heritage_desc:0 "与其他许多利古里亚部落不同，革努阿人善于与伊特鲁里亚人、意大利人及希腊商人进行贸易，无论是来自意大利海岸的商人，还是来自高卢马赛的希腊商人。\n革努阿早在公元前五或四千年就已有人居住，作为“利古里亚人的贸易站”，其自公元前5世纪左右开始被认定为重要的贸易中心。毛皮、木材与蜂蜜自此港口运往海外，而葡萄酒、陶器与奢侈品则从外地输入，伴随异国商人一同到来。\n随着革努阿（伊特鲁里亚人称之为‘凯努阿’，意为‘新城’）实力的增长，它开始与革努阿人原有的港口‘维纳斯港’竞争，而后者早已与南、西部的希腊人建立了良好关系。"
 getia_heritage:0 "纷杂传承"
 getia_heritage_desc:0 "他们是一个神秘的民族，与色雷斯和达契亚部落都有血缘关系，其与这两个部落相邻，生活在伊斯特洛斯大河（多瑙河）两岸，该河注入黑海，其源头却在部落世界的腹地深处。\n他们发现自己被更强大的民族所控制，如王族斯基泰人和俄德律西亚王国。然而，他们保留了自己独特的混合身份，并与他们发现自己附近的希腊殖民地合作无间。公元前313年，他们与卡拉提斯和奥德索斯等城市结盟，共同对抗吕西马科斯的北方军事扩张。\n他们以骑兵队闻名，在为外国军队服务时表现出色。"
 gordyene_heritage:0 "卡杜乔伊传承"
 gordyene_heritage_desc:0 "最早在古代乌拉尔图王国和亚述王国中被称为卡尔杜部落的卡杜乔伊，到继业者时期成为该地区的一个谜。据说，这些类似高加索的人群仍然部分崇拜古老的胡里安神祇。卡杜乔伊有时向帝国效忠并纳贡，但在其他时候，他们对这些帝国构成了难以驾驭的威胁。被视为凶猛、好战的山地人，传说中军队一旦进入他们的家园就会完全消失。尽管邻国描绘他们为原始人，但卡杜乔伊在建造复杂城市、城堡以及战争器械（如攻城器械）方面颇有成就。他们的作坊由能够制造最迷人商品的大师工匠们经营。"
 gortyna_heritage:0 "欧罗巴传承"
 gortyna_heritage_desc:0 "曾名拉里萨或克雷姆尼亚，戈尔蒂纳在克里特岛上的历史和重要性仅次于克诺索斯。斯巴达的墨涅拉俄斯从特洛伊归来时，其船只在戈尔蒂纳海岸撞上锋利暗礁，被残酷摧毁，船员中多数侥幸幸免。同样，宙斯变身为公牛，从腓尼基带走欧罗巴，在一棵悬铃木树荫下与她幽会。她由此生下米诺斯、拉达曼忒斯和萨耳佩冬，他们均成为米诺斯的国王，在战场上及死后都扮演重要角色——拉达曼忒斯管理亡灵之门。欧罗巴的名字自此被用来指代希腊及其相连的广大土地，故可谓整个欧洲大陆的地理和文化起源于克里特岛与戈尔蒂纳。因其几乎可与伟大的克诺索斯相匹敌，为避免相互削弱，戈尔蒂纳与米诺斯故乡达成协议，二者共同统治整个克里特。"
 gumo_heritage:0 "姑墨的传承"
 gumo_heritage_desc:0 "“胜兵四千五百人”——在如此偏远之地实属罕见，而姑墨又以盛产铜、 铁矿及雄黄——西运利兵，东销利药之物——而闻名。姑墨王国横亘于塔里木盆地山麓诸国与外缘沙漠游牧民族的交界地带，其间既有紧邻内陆沙漠的山地王国，也有如阿米尔吉部落及其邻族等盘踞于高地环形盆地外的游牧群体。王国首都南城位于现代阿克苏（即古姑墨城）以南。其选址毗邻阿克苏河、于阗河与喀什河交汇处，相较于穿越沙漠的路线，此地交通条件远为便捷，众多商贾自然云集于此。"
 guyan_heritage:0 "古延遗产"
 guyan_heritage_desc:0 "古延促进了东西方的大交汇，作为一种原始蒙古文化，属于贯穿欧亚大陆东部北区的更广阔的斯基泰-西伯利亚连续体的一部分。在身体特征上，古延人来自两个世界，东部人具有特定的亚洲/蒙古人种特征，而其他人则起源于图瓦地区的东部高加索人种。他们的墓葬位于能看见太阳的高海拔处，以几何形状排列在墓地中（无论是个体还是家族墓葬）。"
 gymnetia_heritage:0 "裸人传承"
 gymnetia_heritage_desc:0 "具姆涅提人生活在黑尼罗河的末端，靠近塔纳湖的北部边界，他们在大河和更大的内陆湖畔嬉戏，过着富足自由的生活。在外人看来，他们的与众不同之处首先在于他们的裸体，无论是在游戏、战斗还是日常事务中都是如此。也许正是这种持续的自由给了他们这样的快乐和平和的天性。"
 hadramut_heritage:0 "哈德拉姆特传承"
 hadramut_heritage_desc:0 "哈德拉姆特是一个古老的阿拉伯王国，频繁更换宗教，使其更加灵活。"
 halikarnassan_heritage:0 "哈利卡纳苏斯传承"
 halikarnassan_heritage_desc:0 "哈利卡纳苏斯以著名的摩索拉斯陵墓为家园，在亚历山大大帝到来前一直由赫卡托姆尼德家族统治。随后它被撤退的波斯人焚毁，并失去了先前的重要性。"
 halin_heritage:0 "一切有部怖畏传承"
 halin_heritage_desc:0 "位于伊洛瓦底河流域的干旱地区，哈林的农作物受益于主河及其众多支流灌溉了肥沃的田地。然而，哈林的藏缅语族人民并不仅仅是农民，尽管他们崇奉苯教的原则，但许多年轻人愿意学习上座部佛教。他们将商人和业余商人派往室利差呾罗，那里有更大的市场，但他们自己本土的土地也有丰盈的收获。该遗址长期以来一直受到神祇灾难预言的威胁，风暴和奇怪的现象被视为不幸的后果，而非自然秩序的进展。"
 hastan_heritage:0 "哈斯塔传承"
 hastan_heritage_desc:0 "哈斯塔城地理位置极佳。它位于利古斯提努斯湖口，靠近布匿城市加迪尔，已经成长为图耳得塔尼亚最大的城市之一。它与加迪尔的关系带来了对腓尼基文化的大量接受与同化。"
 helot_heritage:0 "黑劳士传承"
 helot_heritage_desc:0 "当斯巴达人被忒拜的伊巴密浓达击败后，他建立了美塞尼城并将其交给希洛人。我们一直是拉科尼亚和美塞尼亚两地的主要人口群体，但数百年来都在斯巴达治下为奴。作为一个自由国家，我们终于能够从自己的辛劳中受益。作为一个自由国家，我们也必须永远记住，自己曾在斯巴达治下为奴，并强硬地警惕那些想再次奴役我们的人。"
 henioch_heritage:0 "赫尼俄喀亚传承"
 henioch_heritage_desc:0 "这个部落和国家的人民至少可以追溯到公元前8世纪之久，对他们的提及来自于在乌拉尔图王国发现的石碑。关于他们的记录很少，然后他们“已经准备好杀死和吃掉人了”——亚里士多德。"
 heraclea_pontican_heritage:0 "赫拉克利亚传承"
 heraclea_pontican_heritage_desc:0 "本都的赫拉克利亚人是麦加拉人的后裔，沿着比堤尼亚海岸定居，并以曾从附近经过以进入哈迪斯之领域的赫拉克勒斯自名。尽管曾经只是一个殖民地，赫拉克利亚沿着黑海建立起许多城市，在波斯帝国崩溃后成为一个重要势力。"
 heraia_heritage:0 "桃金娘的传承"
 heraia_heritage_desc:0 "赫拉伊亚由阿卡迪亚国王吕卡翁之子赫拉里乌斯所建，古称索洛戈尔格斯。早期居民因生活于阿尔菲乌斯河谷，靠近埃利斯圣林，曾与埃利斯人缔结条约，旨在带来和平并相互防御，约定期为百年。此约订于第50届奥林匹克运动会时期，约公元前580年，彼时埃利斯人地区占据优势。拉科尼亚人称该城由斯巴达王克莱翁布罗托斯一世创立，聚合至少八个邻村组成政体。因与好战斯巴达人关系紧密，赫拉伊亚人遭阿卡迪亚同胞及姊妹城怀疑，370年其土地多次被毁。为避免屡遭侵扰，赫拉伊亚人曾多次加入亚该亚联盟及埃托利亚联盟以求安全与互助，如同昔日与埃利斯的安排。该地肥沃，盛产珍贵物资，尤以大片桃金娘种植园闻名，开花时节田野一片绚丽。"
 herakleia_heritage:0 "赫拉克利亚·卢卡尼亚的传承"
 herakleia_heritage_desc:0 "赫拉克利亚位于阿基里斯河和西里斯河之间，是大希腊地区后期建成的希腊殖民地之一。该城建立于伊奥尼亚殖民地西里斯的旧址上，由于其争议的地理位置，经常成为邻近城邦和希腊故土宣称古西里斯的纷争中心。由图里人从锡巴里斯地区的图里殖民者建立，起初是各国妥协产物。后来该城迁移24斯特迪亚至更适合位置，旧西里斯成为其附属港口及集市。依托图里人的财富和塔林敦的支持，赫拉克利亚迅速繁荣，成为意大利南部富裕的希腊城市，培养著名画家如泽乌克西斯，成为文化发源地。"
 herakleia_minoa_heritage:0 "双重神话的传承"
 herakleia_minoa_heritage_desc:0 "这座城市的每个名字都对应着其创建的不同传说。据传，赫拉克勒斯在此击败了当地的西西里英雄埃律克斯，为赫拉克勒斯家族赢得了在岛西部定居的权利。同样，据说克里特的米诺斯曾寻找逃出迷宫的代达罗斯，抵达哈吕库斯河口并建城。然而，事实是该城起源并不如此光荣，而是由西边邻近的塞利诺斯殖民者于公元前6世纪建立。此后，赫拉克勒亚·米诺亚成为塞利诺斯及更强大的东邻阿克拉格拉斯和与所有这些城市战争的迦太基人之间永无休止的势力争夺战场。"
 heritage_of_anuradhapura:0 "阿㝹罗陀补罗传承"
 heritage_of_anuradhapura_desc:0 "阿㝹罗陀补罗，这座圣城和古城静静地位于圣西吉里亚山下，是居住在兰卡岛北部海岸的自豪而强大的人民的家园。在阿㝹罗陀补罗，伟大的罗阇德瓦南皮亚·提萨建造了第一个佛塔，一个巨大的建筑性宝库，用于保存圣物，使这座城市在佛教徒中被视为圣地。尽管多次遭受来自大陆的入侵，阿㝹罗陀补罗的权力中心仍将在棋盘上继续存在千年，证明了其人民的天才。"
 heritage_of_emporion:0 "恩波里翁传承"
 heritage_of_emporion_desc:0 "希腊殖民地恩波里翁是伊比利亚东部的主要市场。由于在铁和贵金属贸易方面，它已经变得富有，并准备继续保持希腊在该地区的存在。"
 heritage_of_hemeroskopeion:0 "赫墨洛斯科珀翁传承"
 heritage_of_hemeroskopeion_desc:0 "由马塞利亚的希腊人建立的希腊殖民地赫墨洛斯科珀翁位于俯瞰大海的岬角上，在罗马征服之前，它对伊比利亚矿山的铁贸易变得很重要。"
 heritage_of_persis:0 "波斯传承"
 heritage_of_persis_desc:0 "波斯地区曾孕育了强大的、征服世界的阿契美尼德王朝，这个地区未来必将被强大帝国争夺，每个帝国都贪婪地想要吞并其传承并声称其为己有。然而，波斯人民始终保持着独特的身份，希望这个古老民族的火花未被征服者的怒火熄灭。"
 heritage_of_sinhapura:0 "僧诃补罗传承"
 heritage_of_sinhapura_desc:0 "几百年前，我们的祖先，屠魔者和伟大的战士毗阇耶，被他的父亲僧诃补罗驱逐出故土。当时看似诅咒的事后来被证明是神的祝福。被迫四处流浪，毗阇耶凭借自己的功绩在一片肥沃的土地上建立了自己的地位；毗阇耶王朝曾在耻辱中被流放，后来成为遥远土地的统治者。古老的方式，将永远是我们人民的方式。"
 hermione_heritage:0 "德律俄普人的传承"
 hermione_heritage_desc:0 "赫耳米奥涅位于阿尔戈利斯地区的最南端，因地理上的隔离与政治上的独立性，赫耳米奥涅湾亦因其得名。传说中，该地由古老的德律俄普人建立——他们原居俄伊塔山周边的德律俄皮斯地区，在多利安人南迁前早已向南西迁徙。赫耳米奥涅在特洛伊战争前后仍保有独立，成为德律俄普人所遗留城市中最为重要的一座。其重要性超越了德律俄普文化与记忆范畴，赫耳米奥涅成为南方近邻同盟的首要成员，并在邻岛卡劳瑞亚召开会议。然而，这种权势最终随古代文明的衰退一并消散。约公元前464年，赫耳米奥涅与迈锡尼、梯林斯一道落入阿尔戈斯的掌控。尽管如此，该地民众仍保留德律俄普血统，持续供奉德律俄普人最尊崇的神——大地女神得墨忒耳·赫托尼娅，她滋养土地、赐予丰收。"
 herulian_heritage:0 "赫鲁利亚传承"
 herulian_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 hipponion_heritage:0 "被流放者的传承"
 hipponion_heritage_desc:0 "希波尼翁由西洛克里人于公元前7世纪末建立，一直受其他希腊城邦的统治。公元前388年，叙拉古的僭主老狄奥尼修斯掌控此城，并迁走居民，要么移往叙拉古统治下的其他城市，要么迁入叙拉古本土。十年后，受迦太基势力帮助，居民返回希波尼翁。尽管他们对斯基拉海峡对岸的恐惧减轻，但布鲁特提人部族随后控制了他们，要求进贡等荣誉。"
 hispano_celtic_heritage:0 "希斯帕尼亚‑凯尔特传承"
 hispano_celtic_heritage_desc:0 "先辈已为我们指明前路。"
 hnaw_kan_heritage:0 "赫瑙坎传承"
 hnaw_kan_heritage_desc:0 "作为萨蒙山谷中的一处定居点，哈诺坎展示了蒲育人所带来的文化融合和变革，其中以玛瑙珠作为新贸易和影响的象征，剑和矛则代表了由文化冲突带来的对抗。在这个富饶的山谷中，孤立主义是不可行的，哈诺坎的居民时常不得不适应前来定居的外来者，他们希望在肥沃的土地上生根发芽。"
 homonadia_heritage:0 "荷摩那迪亚的传承"
 homonadia_heritage_desc:0 "最糟糕的弥吕亚斯人，荷摩那迪亚人是野蛮的掠夺者，攻击任何胆敢侵占他们土地的人。他们的袭击者从该地区的邻近城市夺取了许多奴隶，并将其出售给伊苏里亚人和奥尔比恩人，以充实他们的市场。"
 hujie_heritage:0 "呼揭遗产"
 hujie_heritage_desc:0 "呼揭人可能是南方乌孙的分支，也可能是东方月氏的分支。为了逃避更强大部落联盟的直接影响，呼揭人（有时也称为乌揭）向西迁徙，从现代贝加尔湖地区迁移到巴尔喀什湖附近。作为草原地带斯基泰-萨尔马提亚族群范围最东端的元素之一，他们受到东方匈奴（或可称为前匈奴）部落的影响。"
 hunyu_heritage:0 "荤粥遗产"
 hunyu_heritage_desc:0 "这个部落的人民与邻近的匈奴人如此相似，以至于他们的名字可能只是对威胁中国和文明世界的危险游牧匈奴的泛称的另一种说法。据记载，他们在传说中周朝的古老公亶父的传说中扮演了一定角色。名为《孟子》的典籍称他们为獯鬻。也许他们曾经拥有与当时匈奴相当甚至更强大的力量，但到了此时已经沦为邻国的附庸。"
 iapodia_heritage:0 "伊阿波德部落的传承"
 iapodia_heritage_desc:0 "生活在利布尔尼部落以北及内陆的伊阿波德部落（又名伊阿皮德斯部落），其土地由科拉皮斯河和欧涅乌斯河滋养，保护由贝比乌斯山提供。他们在公元前8世纪至公元前4世纪之间达到了领土的巅峰，曾多次向内陆定居点发起侵略。随着他们采用了利布尔尼、凯尔特、希腊和伊斯特里亚/威尼提克的文化，导致他们的身份较为混合，学者们很难确认他们的遗址。使用凯尔特的纹身和武器，他们保护并扩展了小规模的小米田地，支撑了他们遥远的村庄。他们的部落图腾是马，但他们也崇拜神圣的蛇。"
 iazygian_heritage:0 "雅斯基传承"
 iazygian_heritage_desc:0 "如今被归为“萨尔马提亚人”的族群中，雅斯基人是最西端的一支，在斯基泰王阿忒亚斯治下的黄金时代终结许久以后，他们率先骑着铠甲闪亮的战马，挥舞着长长的孔托斯骑枪，穿越了衰落的斯基泰人的故土，最终像辛梅里安人曾经做过的那样跨过了提拉斯河，生活在达契亚人的土地上，与当地人——以及日后入侵的罗马军团——作战。"
 iberian_heritage:0 "伊比利亚的传承"
 iberian_heritage_desc:0 "在伊比利亚众多不同部落的领导下，伊比利亚拥有大量人口。只要他们能完全控制这些人口，就能拥有数量庞大的军队。"
 icenian_heritage:0 "伊刻尼传承"
 icenian_heritage_desc:0 "自默默无闻中崛起的伊刻尼人是一个自豪且极为独立的民族；他们精通冶金与驯马，在不列颠尼亚的东海岸上艰难求存。"
 ierapetra_heritage:0 "海盗新娘的传承"
 ierapetra_heritage_desc:0 "因位于岛屿南部而被称为“利比亚海的新娘”，伊拉佩特拉自米诺斯时期到希腊化时代一直是重要的地方势力。据说此地由来自安纳托利亚的科瑞班忒斯所建，他们是崇拜弗里吉亚塞勒涅女神的武装舞者。\n作为岛上有力的竞争者，伊拉佩特拉人将海盗行为作为财富与声望的来源，在掠夺战争中占据一席之地。"
 illyrian_pirate_heritage:0 "伊利里亚海盗传承"
 illyrian_pirate_heritage_desc:0 "由于其作为一个野蛮、无法治理的地区的声誉，伊利里亚成为了海盗舰队隐藏的理想之地，因此不难理解为什么如今有一个可怕的海盗国度控制了亚得里亚海。"
 ilvatia_heritage:0 "伊尔瓦塔族传承"
 ilvatia_heritage_desc:0 "伊尔瓦塔族是利古里亚部落，位于利古里亚阿彭尼内山脉北侧，面向帕都斯河内陆谷地。\n与其邻近的凯尔特族战争态度不同，伊尔瓦塔族坚决保卫世代家园，奋战不息。"
 indian_client_heritage:0 "印度仆从国的传承"
 indian_client_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 indiketian_heritage:0 "印迪刻提亚的传承"
 indiketian_heritage_desc:0 "印第凯特人从与外国势力的贸易中获益匪浅，特别是伊特鲁里亚人和腓尼基人，以及最终的马萨诸塞人。印第凯特人与恩波利昂和罗德的马塞利亚人有着独特的关系，这源于殖民地是在印第凯特人的协助下在印第凯特人的领土上建立的。印第凯特人从希腊邻居那里学到了很多东西，并热切地采用了他们的冶金技术和陶器风格。印第凯特人以在大部分陶器上涂上白漆而闻名，而在细节处理上则使用进口颜料。值得注意的是，印第凯特人的首都印第卡似乎曾坐落在一个小岛上，随着几个世纪的瓦砾堆积，该小岛已成为大陆的一部分。"
 indo_greek_heritage:0 "印度-希腊传承"
 indo_greek_heritage_desc:0 "崛起的印度-希腊人，又被他们的邻居称为耶槃那罗阇人，出现在孔雀王朝衰落的动荡时期，许多小规模的印度-希腊王国能在希腊人与印度人混合的人群中建立起自己的统治地位。"
 indravana_heritage:0 "富饶智者姐妹的传承"
 indravana_heritage_desc:0 "该区域隐藏在莽莽丛林中，宝石和其他珍贵商品的储量惊人。 这片土地本身就很难征服，即使是孔雀王朝在制定入侵计划之前也会犹豫不决，因为该地区两边都是最茂密、最坚不可摧的丛林。 生活在那里的萨奥拉人（或萨瓦纳人）信奉吠陀信仰中的萨满教文化，并实行内婚制，与世隔绝。"
 ingaunia_heritage:0 "纹身利古里亚人传承"
 ingaunia_heritage_desc:0 "因受近期迁入的凯尔特人影响，印高尼人可能在名字上被理解为利古里亚人中的‘纹身者’。‘印高尼’（Ingauni）一词中本应有之‘p’音的缺失，可能与‘皮克提人’（意为‘纹身者’）有关，体现了利古里亚语与凯尔特语的混合。\n他们于公元前4世纪于海岸边的山坡上建立了首都印高农的阿尔朋，意为‘白丘’。印高尼人常与北方山区的邻居——伊潘特里人交战，后者在生活艰难、财富匮乏时会袭击印高尼的富饶土地。因此，印高尼人常常雇佣其他民族的佣兵协助保卫他们的白色山丘。"
 insubria_heritage:0 "精英移民的传承"
 insubria_heritage_desc:0 "因其在意大利北部高卢的重要地位，印苏布雷斯族被视为最重要的凯尔特部落之一。公元前600年以后，他们建立了贸易繁荣的城市米兰（墨迪俄拉农）。传说中，高卢王安比卡图斯派其侄子贝洛维苏斯率领多族大军进入高卢北部，贝洛维苏斯据称在塔奎尼乌斯·普里斯库斯时代创立了米兰。印苏布雷斯文化混合了凯尔特迁徙元素和古老的戈拉塞卡文化。他们的寡头政治依赖于与伊特鲁里亚人和威尼托人的关系，构建了较为先进的文明。"
 intimilia_heritage:0 "因蒂米利人传承"
 intimilia_heritage_desc:0 "位于利古里亚海岸，位于西阿平宁山脉以南的其他利古里亚部落之间，印提弥利人定居在印提弥利翁的阿尔朋镇——与他们的邻居印高尼一样，他们的堡垒也被称为“白山”。虽然他们与居住在山区，同样骚扰着他们印高尼邻居的伊潘特里部落发生过小规模冲突，印提弥利人更重视于掌控其海岸的水域，操弄海盗的营生，并保有一支骚扰为用的舰队。据说此部战士常常无故兴兵，且时刻备好赴战。"
 ionian_heritage:0 "伊奥尼亚传承"
 ionian_heritage_desc:0 "伊奥尼亚是希腊世界许多最具影响力哲学家的诞生地，伊奥尼亚人的心性天生好问，并对宗教迷信抱有怀疑与轻视。"
 isauria_heritage:0 "伊苏里亚传承"
 isauria_heritage_desc:0 "这些人是来自阿拉苏斯山上的掠夺者和突袭者，他们坚定地独立了，为了在公元432年被佩尔迪卡斯围困中生存，他们烧毁了自己的首都吕底亚。凶猛的山地人将在吕底亚帝国、阿契美尼德帝国和阿吉德帝国中幸存下来，因成为安纳托利亚西南部最凶猛的劫掠者，赢得了外界的认可。"
 issa_heritage:0 "狄俄尼修斯的伊利里亚传承"
 issa_heritage_desc:0 "由叙拉古的狄俄尼修斯长老于公元前4世纪创立，伊萨是一个位于伊利里亚海岸线上，控制着一组重要岛屿的希腊殖民地，控制着亚得里亚海的贸易。这个殖民地与利布尔尼部落争夺岛屿的主导地位，但凭借希腊化的城墙和强大的铸币系统，能够维持其作为独立城市国家的贸易力量。"
 istria_heritage:0 "维涅蒂伊利里亚传承"
 istria_heritage_desc:0 "与所有其他伊利里亚亲戚相比，赫斯特里部落被视为威尼提克伊利里亚部落，他们讲一种意大利化的方言，并从意大利半岛汲取他们的风俗习惯。他们位于伊斯特里亚半岛，控制了与威尼提人及其他意大利部落和城镇在西亚得里亚海的贸易，因此显然他们会效仿这些更富有的贸易伙伴。由海岸的岩壁和难以通行的水域保护，他们在贸易无法完全满足需求时，也会进行海盗活动—袭击他们的意大利商业伙伴并非不可能。"
 istros_heritage:0 "伊斯特罗斯的传承"
 istros_heritage_desc:0 "伊斯特罗斯，又称希斯特里亚或希斯特里奥波利斯，是公元前650年后不久建立的米利都殖民地，目的是与盖塔人以及居住在广大森林腹地的其他本土部落贸易。它坐落在同名大河伊斯特罗斯沿岸，控制着船只和旅人沿河上下的通道。这座规模可观的沿海城市占地约六十公顷，主要神祇为医神阿波罗、宙斯和阿佛洛狄忒，并由代表六个米利都部族的寡头政治领导。虽然该城在公元前512年大流士的斯基泰战役期间几乎被毁，但由于与外来王族通婚，它与游牧世界保持着深厚联系。公元前339年前后，斯基泰王阿提亚斯与腓力二世交战时，它再次遭到重创，失去城市和卫城周围的防护墙。它也是公元前313年至309年间反抗吕西马科斯的本都城镇之一，并曾因托米斯问题与拜占庭开战。在所有米利都血统的本都定居点中，希斯特里亚享有很高的尊重与崇敬。"
 ivernia_heritage:0 "希伯尼亚的传承"
 ivernia_heritage_desc:0 "在外国人眼中，伊维耳尼亚“城”和希伯尼亚岛的名字都来自伊维耳尼部落，他们是不列颠岛西部大岛所有部落中最西南端的一个。他们自称为埃瑞恩人，由戴瑞恩王朝统治——戴瑞恩是一个战士种姓，也是希伯尼亚仅有的三个战士种族之一。他们实行铁腕统治，为本国人民所畏惧。"
 jadis_heritage:0 "贾迪石传承"
 jadis_heritage_desc:0 "作为塔斯米特的姊妹部落，贾迪丝永远夹在北方水草丰美的塔斯米特人和南方定居的王国（如萨巴）之间，后者偏爱塔斯米特人，贾迪丝人在政治上经常受到强大邻居的欺凌。萨巴王室的床榻接纳雅迪西亚人的情况并非罕见，这也是王室控制部族血统的一种手段。问题在于，是继续在撒贝人的压力下苟延残喘，还是屈服于塔斯米特人的威胁，抑或是学会如何控制岩石走廊，挤压贸易通道，从而让邻国屈服。"
 jiankun_heritage:0 "冰封青铜冶炼者遗产"
 jiankun_heritage_desc:0 "坚昆人以大型皇家库尔干墓为特征，属于考古学上的塔加尔文化，是米努辛斯克盆地斯基泰类型文化的堡垒。他们既是畜牧社会也是农业社会，驯养马匹等有用动物，同时也用青铜镰刀和收割刀收获谷物。事实上，他们支撑着当时欧亚大陆最大的青铜冶炼社会之一。外人将他们传说中的祖先描述为一位神和一头牛，同时象征着文明与原始。"
 jingjue_heritage:0 "精绝的传承"
 jingjue_heritage_desc:0 "金帐汗国都城加都塔（尼雅考古遗址的古称）曾一度是塔里木盆地南部贸易通道上的一个重要中心，甚至是该地区最大的绿洲之一。 由于其规模和财富，这座城市甚至以拥有果园而闻名，周边还有有限的农田和牧民。 晋爵王国既是沙漠边界托恰尔语社区的一个组成部分，也是国外文化影响的自愿参与者，可能从喜马拉雅山上的商人那里吸收了印度教元素。"
 jubbah_heritage:0 "荒漠湖民传承"
 jubbah_heritage_desc:0 "自中石器时代以来，阿拉伯沙漠的旅行者们就一直在享受被称为朱巴的圣地。在干燥、尘土飞扬的奈富德沙漠中，有一个地方出奇地湿润，这里汇集了水源，支撑着生命甚至农业。这个定居点还充当了从半岛中心到纳巴泰人所在的西北部的贸易漏斗，描绘瞪羚、猴子、鸟类和其他奇异动物的艺术品展示了远道而来的商人通过商队带来的各种生物和货物。由于这里是该地区的地质反常现象和重要的贸易汇合点，这里的阿拉伯人一直在这里安居乐业，与周围的贝都因人形成了鲜明的对比。"
 judea_heritage:0 "犹地亚传承"
 judea_heritage_desc:0 "其传承可追溯至犹大王国时期，至今仍承载着一个民族的传统。这民曾见君王与征服者来来往往，其中有本族的，也有从远方，如希腊、波斯之地来的。直到今日，犹地亚人仍以他们深切的虔诚和刚强的独立为宝，爱他们所受的业。"
 junji_heritage:0 "军箕传承"
 junji_heritage_desc:0 "军箕人是分布在军箕山脉沿线的牧人，他们位于著名的河西走廊以北的北方贸易十字路口，丝绸之路后来有一条强大的支线经过此地。然而，由于他们领地干燥严酷的环境，军箕地区虽然在政治和自然上相对安静，却不如此地以西、穿越月氏人领地的那条更为宜人的路线那样有利于大规模的贸易，而这或许让他们失去了像那些受眷顾的民族那样迅速且强大地崛起的机会。"
 jurcae_heritage:0 "健壮草原民的传承"
 jurcae_heritage_desc:0 "伊尔凯人位于咸海以北，也被称为尤尔凯人或图尔凯人（与现代土耳其人无关），他们在荒凉干旱的平原和丘陵间穿行，在每个水源地之间跨越遥远的距离。要保证他们牧群的安全是一项艰巨的任务，还要考虑到东部部落迁徙到他们的牧场并迫使他们离开牧场的威胁，以及北方寒冷时不时席卷而来给他们带来的威胁。因此，伊尔凯人是一个坚强的民族，他们甚至比传说中的阿里玛斯皮人更强大，更有战略眼光。"
 jushi_heritage:0 "车师传承"
 jushi_heritage_desc:0 "车师人（又称姑师人）形成于公元前1千纪中叶，居住在吐鲁番盆地和名为觉洛浣的湖泊周围——这是整个地区海拔最低的地方，从上方俯瞰时，因其环状的盐层可能形似一轮明月。在这里，车师人控制了塔里木盆地沿线一个重要的贸易与通道节点，并在陡峭而易于防守的悬崖上建造了都城交河，以便从安全的有利位置俯视他们的土地。都城所在的台地在河流一分为二、两股支流环绕这一地理特征的交汇处收束成尖角，赋予了这座城市“河流交汇处”的含义。车师人中既有定居者也有牧人，他们既是城镇的建设者，也是游牧传统的追随者；擅长射箭和使用具有精神活性的大麻进行仪式是司空见惯的。"
 kalingan_heritage:0 "羯陵伽传承"
 kalingan_heritage_desc:0 "据说在遥远的过去，羯陵伽人是附近部落的兄弟，直到今天，我们与环绕我们沿海王国的丛林中的大多数部落还保持着良好的关系。也许这就是我们仍然珍视自己的许多部落传统的原因。随着难陀在此地区的压迫统治的消失，我们自然成了本地区的领导者，尽管我们的财富很容易吸引其他正在崛起的国家不必要的注意。"
 kallatis_heritage:0 "卡拉蒂斯的传承"
 kallatis_heritage_desc:0 "卡拉提斯是本都赫拉克利亚在公元前六世纪建立的殖民地，是一座以贸易为导向的港口。它大体上挺过了希腊人和斯基泰人等部族的大规模军事行动，例如斯基泰王阿提亚斯的征服，并未受到太大影响。它财富与声望增长的时期可能出现在公元前四世纪中叶，当时它在公元前350年开始铸造自己的货币。直到本都尤克辛努斯上的希腊统治或部族统治问题尘埃落定后，卡拉提斯才在吕西马科斯北方扩张远征期间起兵反抗，并因邻近港口托米斯的归属问题卷入与拜占庭的战争。"
 kamarupa_heritage:0 "缓慢而坚定的传承"
 kamarupa_heritage_desc:0 "迦摩缕波是一个边疆王国，不在孔雀帝国的版图之内，也基本上不在印度其他文学和历史的记录和考量范围之内，它的人民和王国是一个长期存在的部落，控制着布拉马普特拉河流域大片肥沃的土地，并在公元前五世纪吞并了它的姊妹铁器时代王国达瓦卡。与伟大的十六雄国和更伟大的印度帝国相比，他们可能只是一个小国，但耐心是有回报的……"
 karusa_heritage:0 "卡鲁沙人的传承"
 karusa_heritage_desc:0 "从摩呵婆罗多（Mahabharata）时代起，这些人就以战士和光荣的勇士著称。 虽然从吠陀时代到亚历山大时代，他们跋涉万里，建立了许多定居点，但他们最传统、保存最完好的家园是在南部，即塞迪部落以东、凯穆尔丘陵以西。 卡鲁沙人的血统可追溯到国王丹塔瓦克拉，他曾支持切底的希舒帕拉，在卡鲁沙政体还是亚达瓦王国之一时，被瓦苏德瓦-克里希纳杀死。"
 kaukonia_heritage:0 "考科尼亚传承"
 kaukonia_heritage_desc:0 "很难说考科尼人是从哪里来的，也很难说他们去了哪里。一些人，比如荷马，认为他们是安纳托利亚的一个土著群体，而另一些人则认为这个名字指的是希腊部落，或者已经迁入希腊的部落。无论什么样的意图和目的，都使用了《伊利亚特》中对考科尼人的引用，所以他们可以说他们是伟大的特洛伊战争的一部分——万岁！"
 kaunos_heritage:0 "卡乌诺斯的传承"
 kaunos_heritage_desc:0 "虽然卡乌诺斯的实物遗址将其建城时间或早期使用定为公元前9世纪，但传统的历史追溯到以卡乌诺斯为名的城市，卡乌诺斯是卡里亚国王米利都的儿子，母亲是水泽女神基安娜。据说，卡乌诺斯和他的妹妹比布利斯相爱，为了避免乱伦，卡乌诺斯逃离了她的陪伴，直到来到了安纳托利亚的吕西亚。在这里，比布利斯追随他，但因悲伤和疯狂而死，最终化为一条泉水，永不停歇的泪水形成了卡尔比斯河。卡乌诺斯在亚洲娶了仙女普罗诺厄为妻，并生下了儿子埃基亚罗斯，后者在附近建立了一座以父亲命名的城市。这个城市是一个卓越的贸易港口，拥有两个功能齐全的港口，赫西俄多图斯曾记载，城市的人民曾顽强抵抗波斯将军哈帕戈斯的进攻，尽管他们最终还是失败了。这位历史学家还指出，虽然他个人不同意卡乌诺斯人关于自己外来起源的说法，因为他们的语言与他自己的家乡非常相似，但他也不得不承认他们在行为上与所有其他卡里亚人和吕基亚人不同。所有的男人、女人甚至孩子都一起饮酒。"
 keramos_heritage:0 "陶艺的传承"
 keramos_heritage_desc:0 "刻拉摩斯的名字既与希腊语“陶器”同名，也与阿里阿德涅和狄俄尼索斯之子刻拉摩斯同名，后者成为陶工。刻拉摩斯的独立一直脆弱，周围强权不断威胁着吞并它。尽管由本土卡里亚人建立，刻拉摩斯仍带有鲜明的希腊影响：科林斯式柱廊环绕克律萨俄瑞斯宙斯神庙，这位神似乎是该城守护神，希腊雕像制品也散布于刻拉摩斯各处。刻拉摩斯曾加入提洛同盟，后来又加入克律萨俄瑞斯同盟。"
 kerasous_heritage:0 "克拉苏斯传承"
 kerasous_heritage_desc:0 "刻拉苏斯之名或许源于希腊语“樱桃”。老普林尼记载，罗马时代最早传入欧洲的樱桃，正是由苏拉密友卢基乌斯·卢库鲁斯从这座殖民城镇带去。该港城由锡诺佩殖民者于公元前6世纪建立，也因色诺芬在《远征记》中到访而闻名。"
 khamboja_heritage:0 "阿湿波传承"
 khamboja_heritage_desc:0 "剑浮沙是印度十六雄国之一，最初由多个部落组成，随着时间的推移，逐渐形成了一个稳定的政体。 他们的历史可以追溯到《摩诃婆罗多》时代，彼时史诗的主角、苏利耶神之子迦尔纳打败了剑浮沙王苏达克西那（Sudakshina）。 这些民族因其武士种姓制度和信奉非婆罗门教的神圣仪式而有别于他们的邻居。 他们在战场上令人生畏，凭借其著名的骑士（阿湿波，希腊人称之为Aspasioi）和盟友或雇主的敌人作战i。"
 kharesmia_heritage:0 "阿夫拉西阿卜传承"
 kharesmia_heritage_desc:0 "希腊人称这里为哈拉兹姆（Kharazm）和克兰斯米亚（Chorasmia），自青铜时代以来，这里一直是文明的中心，当时的奥克苏斯文明（因以奥克苏斯河为中心而得名）繁荣昌盛，从迈锡尼时代的希腊远道进口商品。这一青铜时代的文明也被称为巴克特里亚‑马尔基亚纳文明/复合体。这片土地充满了许多古老的神话和可能性，后来的伊斯兰学者宣称，阿夫拉西阿卜国王等神话人物建立了古代花剌子模王国。从词源学上看，阿夫拉西阿卜与波斯的帕森德斯（Parsondes）相吻合，帕森德斯是卡都西人（Cadusii）的国王，因参与传说中的米底人与波斯人的冲突而闻名于世。花剌子模是晚期塞种人和巴克特里亚人的文化混合体，是隐藏在沙漠中的文明堡垒，因其守卫绿洲的50座要塞而闻名。"
 khasa_heritage:0 "迦娑的传承"
 khasa_heritage_desc:0 "迦娑人属于较晚时期的一个部族王国，曾作为附属边疆政权依附于十六雄国。尽管他们居住在喜马拉雅山地区，但在《梨俱吠陀》文献中以及罗马历史学家老普林尼的记载里，他们仍被称作“印度人”。在《摩诃婆罗多》中，迦娑人曾与许多其他部族一同守护极裕仙人和他的神牛，成为守护圣者的屏障。"
 khotan_heritage:0 "和阗传承"
 khotan_heritage_desc:0 "在梵语中被称为“牛之地”的和阗是一个繁荣且文化丰富的地方。作为历史上最早的佛教国家之一和萨迦语国家，其独特的身份混合是因为它是连接中国、印度次大陆和中亚的主要贸易线路的重要枢纽，而其他塔里木盆地绿洲城市只连接其中一两条线路。"
 kibyra_heritage:0 "基彼拉传承"
 kibyra_heritage_desc:0 "基彼拉提亚是弥吕亚斯地区最强大的城邦，它发展成为一个庞大的政治控制范围，一度从罗得岛珀赖亚地区一直延伸到皮西迪亚。这座城市后来吸纳了它的近邻，建立了基彼拉四城邦，甚至对吕基亚联盟和罗德岛都构成了威胁。"
 kindah_heritage:0 "不幸阿拉伯人传承"
 kindah_heritage_desc:0 "被逐出堤洛斯和革耳剌大陆的金迪人不得不在漫长的岁月中撤入奈季兰，其民族身份、文化传统与人口规模在漫长岁月中日渐式微。在这片最终的避难所，他们为社会构建了坚实框架，并为自己打造出繁荣昌盛的宏伟聚居地。然而命运的阴霾仍笼罩着他们：这段暂避厄运的时光究竟能延续多久？他们是否真的翻开了崭新的篇章？"
 knossos_heritage:0 "米诺陶传承"
 knossos_heritage_desc:0 "克诺索斯早在新石器时代就已有人居住，约在公元前2000年进入中米诺斯早期后，成为米诺斯世界与文化的核心宫殿城市。尽管宫殿历经了繁荣、衰落、毁灭与重建的多个阶段，但它仍是米诺斯文明统治时期克里特岛上最大、最复杂、最具权力的宫殿。\n即使在它的辉煌时代早已过去、迈锡尼人征服了克里特岛、希腊本土成为新兴“希腊世界”的中心之后，克诺索斯依旧是一座靠近海岸、富裕繁荣的城市，与曾经构成其海上霸权的岛屿与港口保持密切联系。众所周知，宙斯与欧罗巴之子、国王米诺斯曾在此统治，建立了强大的米诺斯帝国，其海上统治力如此之强，以至于本土无需建造城墙。他的宫殿结构极为复杂，催生了关于米诺陶与忒修斯屠牛怪的传说，而双面斧“拉布里斯”则是其权力的象征。"
 korkyra_heritage:0 "凯法洛尼亚的传承"
 korkyra_heritage_desc:0 "据说这座岛屿的名字源于一位名叫科基拉的宁芙仙女，她是阿索波斯河神与拉冬河神之女、宁芙墨托佩的女儿。波塞冬爱上了金发的科基拉，将她掳掠至当时尚无名讳的斯刻里亚岛，并以她的名字为该岛命名。水手们望着岛上幽暗的森林，称其为‘黑色的科基拉’。在那里，她与海神育有一子法伊阿克斯，其子即为奥德修斯所遇的阿尔喀诺俄斯国王之父，也是所有法伊阿基亚人的祖先。古风时期，科林斯人来到这座久被遗忘的岛屿，建立了一座强大的殖民地，以掌控伊利里亚海岸的贸易与海军。然而，这座殖民地素以叛逆著称——公元前7世纪中叶，岛屿与母邦科林斯之间爆发了历史上最早记载的海战之一。此后，科基拉岛在后续冲突中屡次扮演关键角色：波斯战争期间为盟军提供舰船，后又因与科林斯就伊利里亚殖民地埃皮达姆诺斯的归属爆发冲突，成为伯罗奔尼撒战争的主要挑起者之一。该岛亦屡易其手——公元前303年曾被斯巴达人短暂占领，后遭马其顿的卡山德围攻，幸得叙拉古的阿伽托克勒斯率领的强大舰队解围，但随即被其征服——而阿伽托克勒斯绝非最后一个征服者。"
 kos_heritage:0 "科斯传承"
 kos_heritage_desc:0 "传说科斯由神话中的本土国王墨罗普斯建立，在古代历史上一直是一个富裕、求学和生产奢侈品的地方。在希波战争后，科斯摆脱了波斯的控制（后来仅被卡里亚总督领统治了一段时间），在大爱琴海联盟、亚历山大帝国和肆虐的继业者周围，科斯基本上保持独立，即使在托勒密王朝的“所有”下，也获得了一种寡头自治的形式，托勒密王朝将其作为教育国家成员的地方。科斯还以美酒、丝绸衣服和岛上著名的医神神殿而闻名。"
 kosar_heritage:0 "忠诚者的传承"
 kosar_heritage_desc:0 "在泰米尔文学中提及的憍萨罗人，以忠于君主著称，被称为“维‑马兹希‑科萨尔”，意为“信守承诺之人”。但这并不意味着他们拒绝与其他势力结盟或为他国军队效力。他们曾作为雇佣军与盟友，效命于其他泰米尔诸王。他们并未将北方强大的孔雀王朝视为可怕的对手，而是视其为保护自己小邦的有力盟友与守护者。"
 kotennia_heritage:0 "科忒尼亚的传承"
 kotennia_heritage_desc:0 "科滕尼亚是潘菲利亚城邦中最后一个反对外来统治的城市，并保持着悠久而自豪的历史，包括自青铜时代起的原住民/希腊文化混合。但对于安提柯王国仍然占据着他们的家园，他们没能做什么。潘菲利亚人是一种海洋文化，事实上他们与经常在他们传统海岸线巡逻的安提柯舰队保持竞争。"
 kotyora_heritage:0 "科堤俄拉传承"
 kotyora_heritage_desc:0 "这座城镇是锡诺佩的米利都人所建殖民地，曾是色诺芬与万名雇佣兵的休整之地，他们在此停留四十五日。色诺芬在《远征记》中向锡诺佩使者谈及当地科堤俄拉人时写道：他们并未以朋友之礼待我方，而是关闭城门，既不准我们入内，也不在城外设市；他们还声称这是你们所派总督的责任。"
 krounoi_heritage:0 "水泉传承"
 krounoi_heritage_desc:0 "克鲁诺伊位于天然设防之地，最初是公元前五世纪由色雷斯人定居的城镇。然而后来伊奥尼亚人来到这里，重新建立了这座堡垒城市，并因周围的天然水泉将其命名为“克鲁诺伊”。后来，当一尊描绘狄俄尼索斯的神像被发现从海浪下探出时，它便被称为狄俄尼索波利斯。此地一度也被称为马提奥波利斯。这些名字都指向一座伟大的海岸堡垒城市，而这片海曾被认为并不宜人。"
 kucha_heritage:0 "库车传承"
 kucha_heritage_desc:0 "库车是塔里木盆地绿洲中最肥沃、最文明、人口最多的地方，是严酷沙漠和雪山沿线的文明堡垒。 它是连接东西方的主要贸易站，后来成为著名的丝绸之路，但这片土地也保持着神圣的气息，山间有许多宁静的僧侣。 在战争中，他们的链甲以其坚固而著称，这种盔甲的样式与伊朗西部的相同。 对于旅行者和商人来说，这里有许多坚固的城市，生活在世界的边缘。"
 kuntala_heritage:0 "纳迦人的传承"
 kuntala_heritage_desc:0 "昆塔拉王国位于德干半岛西部，其历史可追溯到摩诃婆罗多时代，当时国王旃陀罗娑派他的儿子们与著名的阿周那一起参加了两次军事行动。 德瓦吉里的亚达瓦人（Yadavas of Devagiri）指出，半人半蛇的纳迦人（Nagas）是该王国及其人民的首任统治者，这或许与流经该地的众多河流支流所形成的巨大平原湿地有关。"
 kushite_heritage:0 "库施传承"
 kushite_heritage_desc:0 "上尼罗河地区是我们世世代代的家园，库施人曾经是埃及，甚至是犹地亚的主人。虽然下尼罗河地区在希腊人的手中，我们依然是埃及本地遗产以及我们自己传统的保管人。"
 kydonia_heritage:0 "基多尼亚传承"
 kydonia_heritage_desc:0 "关于这座城市的起源，传说不一，大陆人推崇阿卡迪亚王子基冬在一场家族惨剧后，与兄弟们逃离特格亚建立了这座以他命名的城镇；而克里特人则坚信是老国王弥诺斯建造了这座城市，因为他曾统治整个岛屿。不论哪种说法，基多尼亚的定居可追溯到青铜时代，其名字出现在克诺索斯行政记录中的线形文字B的泥板上。基多尼亚港口的城堡讲述了新石器时代的居住史和早期米诺斯时期的文明建立。虽然荷马提及过基多内斯部族，虽与基多尼亚市民不尽相同，但承认这些人存在；而希罗多德声称该地由萨摩斯人在公元前520年建造，后来被克里特人和埃吉那人击败。早期硬币的样式与埃吉那的相符，确认了经济上的联系，虽政治联系尚不明确。"
 kyzikos_heritage:0 "基齐库努斯传承"
 kyzikos_heritage_desc:0 "基齐库斯因其金币基齐库努斯而闻名，这一城邦金币足价28德拉克马，伯罗奔尼撒战争结束后，米利都和雅典都衰落了，基齐库斯仍是一个繁荣的殖民地城市。这座城市也是公元前4世纪克尼多斯的哲学家欧多克斯建立学校的地方。"
 lankan_heritage:0 "楞伽传承"
 lankan_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 lappa_heritage:0 "阿伽门农殖民传承"
 lappa_heritage_desc:0 "内陆城镇拉帕掌控克里特岛北海和南海两边的通道。其南岸通过凤凰港控制海域。传闻这座城镇由迈锡尼的阿伽门农创建，故以邻近的塔拉人拉姆波斯命名——有人认为这个传说不过是为了安抚这座被视为较小邻居殖民地的城镇而构建的声望。"
 laranda_heritage:0 "拉然达传承"
 laranda_heritage_desc:0 "在马其顿帝国的入侵和随后的继业者之间的争权夺利中，安纳托利亚东部最凶狠的掠夺者，拉然达的利考尼人丧失了大部分荣光——尤为关键的是，佩尔迪卡斯于公元前322年摧毁了该聚居地，此后居民才逐渐重返此地。"
 lascutan_heritage:0 "拉斯库塔传承"
 lascutan_heritage_desc:0 "拉斯库塔是山丘中的一座图耳得塔尼亚小城，靠近迦太基领土。但这座城市有一个问题：它处在哈斯塔的强势统治之下，难以拥有任何独立外交政策。"
 late_scythian_heritage:0 "晚期斯基泰传承"
 late_scythian_heritage_desc:0 "斯基泰人最后的伟大国王阿忒亚斯在与马其顿的腓力二世的战斗中阵亡后，他们的帝国崩溃，黄金时代结束。虽然他们还记得自己的游牧传统，但他们已经开始在克里米亚周围定居，并开始与当地的希腊殖民者混杂在一起。"
 legia_heritage:0 "勒吉亚传承"
 legia_heritage_desc:0 "人们对高加索山脉周围讲列兹吉语的古代部落知之甚少，只知道他们在山脉各处一直受到敌人的困扰，因其生活在一个对于贸易和军事活动最有利、地理位置最重要的地方。因此，他们在战争的推动下，培养了一种天生的赚钱谋生的手段。"
 lepreon_heritage:0 "祝福麻风的传承"
 lepreon_heritage_desc:0 "特里斐利亚地区的首府，关于勒普里昂建城的故事众多且多样。有些人说，波塞冬的孙子，皮尔格乌斯之子勒普勒斯，来此建立了这座城市——这正是那个在多场友好比赛中失败后，向英雄赫拉克勒斯挑战决斗并被彻底击败的勒普勒斯。据说这位勒普勒斯属于考科内斯部族，该部族曾被驱逐出安纳托利亚，迅速迁至希腊定居，因此这座城市也被视为米尼安城镇，因为据说米尼安人驱逐了考科内斯人，自己以伟大的米尼亚斯之名占据了这片土地。但也有人认为，这座城镇的名字比这些传说更为简单却也令人不快，源自曾经有一波严重的麻风病波及居住在那里的人们，因此以此灾难命名。无论如何，自新石器时代以来，这里就有人居住，利用丰富的自然资源维生。这里的自然景观也具有宗教意义，因为这片土地上有一片神圣的树林，特别奉献给狄俄涅，她有时被视为全能宙斯的女性对应，有时被视为女性的化身。对许多人来说，这片肥沃且易守难攻的土地被认为是“被祝福的国度”。"
 lesser_armenia_heritage:0 "小亚美尼亚传承"
 lesser_armenia_heritage_desc:0 "青铜时代海亚萨-阿齐联邦的土地，位于传统“大亚美尼亚”之外和西部。与本都和卡帕多西亚接壤，小亚美尼亚的居民保留了更多的安纳托利亚特性，内陆地区也有许多科尔基斯和拉兹部落居住——因此，这片土地更加多样化且不受控制。"
 libernia_heritage:0 "利布尔尼部落的传承"
 libernia_heritage_desc:0 "利布尔尼部落分布在沿海地区，甚至包括科基拉岛，最早可追溯到公元前8世纪。利布尔尼部落群体（包括门托雷斯人、海曼人和剖刻提人等子部落）可能自青铜时代起就存在。作为一个具有敌对性和扩张性的民族，利布尔尼控制并穿梭于许多亚得里亚海岛屿之间，袭击或征服当地的港口，并且常常被希腊人或他们的邻居费力地驱逐。只有叙拉古的海军力量才能将他们限制在自己的民族家园。利布尔尼广泛进行贸易和抢劫，从意大利、北非、希腊甚至更远的地方收集金币和珍宝，其中一位主要神祇是塔兰努库斯。"
 libu_heritage:0 "沙漠入侵者的传承"
 libu_heritage_desc:0 "自从有文字记载以来，就有人生活在尼罗河及其广阔的三角洲沿岸富饶、潮湿的土地上，也有人骑着干枯的骆驼和干渴的马，沿着一望无际的沙丘峰顶远远眺望。这些人就是利布人，他们是古昔兰尼加周围众多古老部落的集合体，从法老时代起就生活在那里。统治三角洲的利布人曾遭受过无数次入侵，虽然埃及人自己说他们从来没有以胜利击退过入侵者，但有证据表明，利布人曾经作为地方领主统治过大河沿岸。也许，即使是现在，他们也在为另一次大入侵做准备......"
 lingonia_heritage:0 "跳跃者的传承"
 lingonia_heritage_desc:0 "字面意思为‘跳跃者’，林贡尼人同样分裂成多个分支，其中一支在公元前5至4世纪期间穿越阿尔卑斯山脉，定居意大利北部高卢地区，时间略早于其他部族。\n有人认为因其与塞农人的亲近和一致目的，他们曾协助布伦努斯军队于公元前390年攻占罗马。他们的名字可能来源于骑马时的特殊技巧，或独特的舞蹈习俗。"
 locri_heritage:0 "西洛克里传承"
 locri_heritage_desc:0 "被称为“西风洛克里”，源自西风神泽菲罗斯，卡拉布里亚的洛克里是公元前680年由来自奥普斯的殖民者建立的，这些殖民者属于奥普恩蒂安洛克里人。其殖民队伍还包括被称为西洛克里的奥佐利安洛克里人以及拉科尼亚人。城市的最初选址并非最终定居地，因狂风恶劣天气，首批殖民者被迫迁往更安全的地方。柏拉图称其为“意大利之花”，但早期因哲学家扎卢库斯等权势人物提出的严厉法律导致立法困难——他主张若法律未通过，提议者将被处以绞刑，据说他曾是奴隶或牧羊人后受教育。此处崇拜珀尔塞福涅，作为婚姻与分娩的保护神，而这功能在大多数地方由赫拉担任。洛克里发展繁荣，足以派遣殖民者建立邻近的希波尼翁和梅德马两城。"
 loulan_heritage:0 "楼兰传承"
 loulan_heritage_desc:0 "坐落在连接塔里木盆地的罗布沙漠边缘，它位于后来将成为丝绸之路主要分支之一的北路起点。楼兰王国快速发展且国际化的城市使其能够控制该地区的大部分贸易，并不断扩张，吞并竞争城市以消除邻国竞争。凭借日益增长的势力，它正蓄势待发，准备控制塔里木盆地的大部分地区。"
 lucania_heritage:0 "驱逐者的传承"
 lucania_heritage_desc:0 "卢卡尼亚是意大利南部的一个意大利部落，讲奥斯坎语。他们用希腊字母书写奥斯坎-翁布里安语的变体，类似邻近的萨姆奈特人。卢卡尼亚不是该部落的原始故乡，传说公元前5世纪迁入此地，驱逐了希腊人所知的奥诺特里安人、科涅斯人和劳特诺伊人。随后他们对希腊城市塔林敦及后来的伊庇鲁斯的亚历山大发动战争，将伊庇鲁斯更紧密纳入大希腊文化圈。与未开化邻居不同，部落精英既热衷于与希腊人交战，也喜欢委托希腊大师制作艺术品，仿照北方伊特鲁里亚人的风格。"
 luguidonensia_heritage:0 "巴拉里亚传承"
 luguidonensia_heritage_desc:0 "在巴拉里安人中，卢古伊多部是撒丁岛北部最显赫的部落之一。像他们的邻居一样，卢古伊多人修建了努拉盖塔。在长期的战争岁月中，他们的部落成功扩展了大量土地，覆盖从山脉到海岸的地区，南面与古老而好战的伊利恩人部落接壤，北面则与好战的科尔西亚人部落相邻。然而，像所有自豪的撒丁人一样，这些巴拉里亚人会在面对外敌时摒弃任何长期分歧，义无反顾地站出来。"
 lycia_heritage:0 "吕基亚的传承"
 lycia_heritage_desc:0 "作为一个非常古老的民族，在古代被称为卢卡人，自从居鲁士大帝入侵以来，他们几乎一直团结在一起，成为阿契美尼德的附庸王国。在普拉塔亚之后，他们加入了提洛联盟，维持了40年的独立，之后他们再次成为附庸。吕基亚设法在亚历山大的入侵中幸存下来没有对人民造成严重的影响，但在继业者战争爆发后，他们的联盟发现自己屈服成为了安提柯王国的附庸。"
 lyctus_heritage:0 "宙斯诞生之地的传承"
 lyctus_heritage_desc:0 "吕克图斯是古克里特最重要的定居点之一，当地人自称是斯巴达殖民者的后裔，并推崇对阿波罗的崇拜。然而，该地的重要性可追溯至《伊利亚特》中“船只名录”的记载，甚至更早。据《神谱》记载，瑞亚曾在此地生出宙斯，并将他藏匿于埃伽翁山的一个洞穴之中。\n它作为克里特最古老城市的主张，也得到了考古印证：阿蒙霍特普三世的葬祭庙中曾提及它的古名“里卡塔”，线形文字B泥板中也以“鲁基托”之名记录此地。公元前344年，福基斯的法拉库斯协助克诺索斯攻占并占领了里克图斯，但不久后该城又被斯巴达国王阿基达马斯夺取。"
 maedia_heritage:0 "迈迪亚的传承"
 maedia_heritage_desc:0 "迈迪亚部族是色雷斯人，定居于斯特吕蒙河流域的佩奥尼亚边境。他们以极强的独立性著称（被俄德律西亚王西塔尔克斯认可），并且非常反叛，曾反抗马其顿的腓力二世和亚历山大。迈迪亚人居住在深峡谷和悬崖环绕的家园中，保护严密，但北部不断变化的强大部族和新迁入的凯尔特人给他们带来极大压力，使他们不得不向南寻找新的可居之地，可能是希腊。"
 maeotian_heritage:0 "迈俄提亚传承"
 maeotian_heritage_desc:0 "作为沼泽栖居部族的离散群体，迈俄提亚人得名于邻近的迈俄提亚湖(今亚速海)。关于这些民族的记载甚少，但在其与博斯普鲁斯王国及辛迪卡人的冲突中，史料记载伊克索玛泰部族的蒂尔吉陶公主因遭受辛迪卡国王赫卡泰厄斯的虐待，曾领导了对辛迪卡人与博斯普鲁斯人的战争。"
 mahiladvipika_heritage:0 "花环洲的传承"
 mahiladvipika_heritage_desc:0 "作为一大片天然环礁和小岛的集合，围绕着传说中的花环洲群岛是相当孤立的人口的家园，最初由印度西南部和斯里兰卡西北部的人组成，但后来受到公元前6世纪僧伽罗人作为摩揭陀流亡者到来的影响。该岛链位于横跨印度—厄律特莱海航线的重要航路点，为厄律特莱海的总体互联互通做出了贡献。佛教徒很快就占领了几个环礁，激发了文化革新和创新，以创造一个马尔代夫的身份认同。"
 mahisamandala_heritage:0 "摩醯娑曼陀罗的传承"
 mahisamandala_heritage_desc:0 "这片土地沿着讷巴达河的边界延伸，其首府位于一个小岛上，这里既是岩石山坡的故乡，也是农庄和谷物田的中心地带。 然而，这里也是宗教好奇者的家园。 传说中佛教徒大天曾在这里修行，他既是罪人，也是僧侣，在故事中，他既是智慧的传播者，也是混乱和不确定性的制造者。"
 mahisha_heritage:0 "恶魔牛的传承"
 mahisha_heritage_desc:0 "《摩诃婆罗多》中提到的南方王国之一，摩诃沙这个名字的意思是伟大或强大。在与阿周那的军队作战时，摩诃沙迦人被认为是凶猛而强大的。也许这是因为摩诃沙迦人据说是国王摩诃沙苏罗（Mahishasura）的后裔，摩诃沙苏罗是一个狡诈的神/魔，特别是水牛魔。"
 mai_adrasha_heritage:0 "金色土地传承"
 mai_adrasha_heritage_desc:0 "这座城市及其周围的土地蕴藏着天然的黄金，注定了它的伟大和繁荣。麦阿德拉沙至少在公元前1250年就已经有人居住，从那时起，这里就有了大规模的金属加工业，矿渣堆满了整个居住区。这座城市与阿拉伯港口和王国有贸易往来，并保持着较高的生产能力，以供应饥肠辘辘的客户。"
 main_heritage:0 "马因传承"
 main_heritage_desc:0 "与其它阿拉伯王国相比，马因的社会结构有所不同，其重心在于贸易，即便是在被外来者统治时也是如此。"
 malao_heritage:0 "香木传承"
 malao_heritage_desc:0 "马劳位于阿瓦利特以东 800 英里处，是利比亚和阿拉伯的门户，是一个较为和平繁荣的港口，地中海商人必须与附近王国的阿拉伯商人竞争。该港口以出口其精选的非洲决明子、肉桂以及杜阿卡、坎卡蒙和马基尔等芳香木材而闻名。这些罕见的货物与少量的没药（myrrh）和乳香一起运输，而没药和乳香在沿海地区随处可见。没药"
 malaya_heritage:0 "达克纳德萨王国的传承"
 malaya_heritage_desc:0 "马来亚位于其相应岛屿的西部，马来亚人有能力参与埃里希拉贸易，将货物运往广阔的西方。 这里的宝石尤其是珍珠闻名遐迩，靠出口致富。 这些人的祖先可以追溯到传说中的僧伽罗人的创始人毗阇耶，他的孙子潘杜瓦斯-德瓦（Panduwas Deva）在玛雅拉塔（Maya Rata）的土地上定居下来。 潘杜瓦斯-德瓦（Panduwas Deva）精心打造了他的王国，建造了大型建筑并训练了一支强大的军队。"
 malayalam_heritage:0 "马拉雅拉姆传承"
 malayalam_heritage_desc:0 "作为一个长期控制印度西南端的亚达瓦王朝，哀伊坐落在一片富饶的土地上，那里有农田和香料产地。哀伊人的领袖是熟练的山地首领，与附近的蕉赖人有亲属关系，与不断威胁他们领土和航道的般帝耶人是对手。然而，在沿着海岸航行或进入大厄律特莱海之前，他们在南端的位置使他们对经过海岸的贸易路线和在港口补给的船只有了重要的控制权。他们说的是原始的泰米尔—马拉雅拉姆语，后来发展成旧的马拉雅拉姆语言，并在整个时代保持着相关性。"
 manapia_heritage:0 "希伯尼亚马纳皮人的传承"
 manapia_heritage_desc:0 "希伯尼亚的马纳庇亚人，正如高卢乃至莫纳岛上那些与他们同名的部族一样，其名称可能源于他们高海拔的聚居地——他们居住在希伯尼亚东部高地，这种地形为部落聚落提供了绝佳的防御优势。他们属于现代伦斯特地区莱金人的一支，而莱金人本身也是希伯尼亚的迁徙民族，早在公元前600年便从不列颠尼亚或高扬帆而来。然而，与其他若干部落相似，他们也在岛上不断迁徙，诸多氏族向北移动，将族人散布在整个岛屿的东海岸。或许终有一日，整个希伯尼亚将成为他们的岛屿，他们矗立海中的山岳。"
 mannaean_heritage:0 "曼奈传承"
 mannaean_heritage_desc:0 "在他们的西边，他们与乌拉尔图王国交战。北边，斯基泰-辛梅里安人群威胁着他们的生存。东边，米底人和掠夺性的伊朗部族袭扰他们的边境村落。南边，新亚述帝国威胁着使其成为附庸。难怪他们在马提尼的山区和湖泊故土筑起堡垒，以抵御外敌并尽力保护自己。在齐维耶要塞内，他们向特舒布及其神祇祈祷，得以暂时获救。现在是他们王座再次成为权力中心的时候了。"
 mantinea_heritage:0 "水利工程传承"
 mantinea_heritage_desc:0 "曼提尼亚由数个邻近村庄融合成一个统一而优越的政治实体，大约在公元前500年形成，以海神波塞冬为主保神。除了三叉戟之神，城墙内还有许多神庙。来自阿卡迪亚普遍崇拜的阿耳忒弥斯·许姆尼亚在此有一席之地——苏格拉底所结交（并在《会饮篇》中提及）的狄奥提玛曾在此担任女祭司。然而，该城最伟大的标志是曼提尼亚水坝，这是古希腊工程的一项伟大奇迹。在这些宏伟的文明建设之外，曼提尼亚的遗产还有死亡与恐惧。它是公元前418年伯罗奔尼撒战争中最大规模陆战的战场。根据公元前387年《安塔西达斯和约》的约定，斯巴达统治者后来将该城拆散为小村庄。公元前362年的第二次曼提尼亚战役同样见证了底比斯军队的战败和该城霸权的终结。在这段历史中，曼提尼亚人实行了一种独特的民主形式——官员并非由民众投票选出，而是由人民投票选出的一个特别委员会来任命。当曼提尼亚于公元前360年加入阿卡迪亚同盟时，这种民主实践得到了其他同盟成员的支持，这与曼提尼亚处于斯巴达统治之下的情形截然相反。"
 mariandynia_heritage:0 "玛里安底努传承"
 mariandynia_heritage_desc:0 "玛里安底努部落有时被描述为类似于邻近的比堤尼亚人，有时被描述成类似于帕弗拉格尼亚人，他们生活在几个民族的强迫奴役中，包括那些生活在本都的赫拉克利亚的人。但所有这些都可以追溯到埃奥利亚·玛里安底努斯和他的同名孙子——哀伤歌曲的作曲家。"
 marsia_heritage:0 "马尔西人的传承"
 marsia_heritage_desc:0 "马耳西人以位于福奇努斯湖东岸的主要城镇马鲁维乌姆为中心，是一个使用翁布里亚语支的民族，其语言或方言被称为“马耳西语”。尽管他们仅占据一小片土地，为了生存，马耳西人与邻近部落组成联盟，包括维斯廷尼人、佩利格尼人与马鲁奇尼人。\n当强大的萨莫奈联盟都无法与罗马争锋时，马耳西人最终向拉丁人屈服——所幸两种语言极为相似，因此双方在文化与语言上拥有许多共同点，有助于维持良好关系。在其位于福奇努斯湖畔的中心地带，马耳西人在圣林之中崇敬意大利女神安吉塔。"
 massagetae_heritage:0 "大萨卡人传承"
 massagetae_heritage_desc:0 "这些人，马萨革泰人，正是那些据称将古代斯基泰人向西驱赶的部落，他们将那些游牧民推向新的土地，在那里蹂躏了伊朗高原和其他不熟悉马上民族劫掠的地方。据多份报告称，这些氏族的首领托米丽司女王在战斗中击败了神童国王居鲁士大帝，当时居鲁士率领着已知世界最大帝国的军队入侵了她的土地。居鲁士的头颅是她的战利品。理所当然地，文明世界深深地恐惧这个部落。"
 massalian_heritage:0 "马赛利亚传承"
 massalian_heritage_desc:0 "马赛利亚是福开亚的伊奥尼亚城邦的主要殖民地，这些人不愿委身于波斯统治，离开了自己的故土。难民们在此处及他们的其他殖民地定居，他们把这个孤立的港口发展成为了西方最重要的贸易力量和殖民地，同时抵御着他们周围的蛮族。"
 matiene_heritage:0 "马提尼传承"
 matiene_heritage_desc:0 "马提尼人从曼尼王国的残垣断壁中脱颖而出，在以他们的名字命名的马提尼湖以南建立了齐维耶要塞，并试图为北面的斯基泰人和东面的伊朗游牧民族建立一道屏障。马铁尼人说胡罗-乌拉尔语，崇拜胡里安神特舒布和胡里安神殿的其他神灵。"
 maurya_heritage:0 "旃陀罗笈多传承"
 maurya_heritage_desc:0 "尽管孔雀帝国才刚刚在北印的舞台上崭露头角，帝国承载了在其孕育之前就已存在的达摩传承以及被其替代的难陀和阿吉德帝国传承。旃陀罗笈多所建立的国家拥有制度优势，但也必须包容多样的人民和信仰。\n\n#R 在孔雀帝国的第一代统治者死去或被废黜之后，该传承将会失去。#!"
 megalopolis_heritage:0 "规模的传承"
 megalopolis_heritage_desc:0 "横跨埃利松河两岸，“麦加”（意为‘大’）之名可谓实至名归。麦加洛波利斯是阿卡迪亚地区规模最大、城市化程度最高的聚居地，拥有众多宏伟建筑，包括一座可容纳两万人的剧场。同样引人注目的是拥有六十七根石柱的特尔西勒昂建筑群与一座神庙，它们在城市景观中格外醒目，令人赞叹。这座城市实际上于公元前317年重建于一座此前也被称为麦加洛波利斯的旧城之上，因此当地人对曾经发生于此的重大历史事件与人物有着根深蒂固的记忆。正因为如此，许多人相信，麦加洛波利斯及其周边地区曾是古代泰坦之战中的主要战场之一，田野间遍布泰坦的遗骨，宙斯投下的雷霆所留下的焦痕点缀着大地——有时，火焰甚至会从岩石大地上自行燃起，仿佛从地底重生。由于其庞大的规模以及阿卡迪亚人在背后给予的坚定支持，麦加洛波利斯被建立为一个对抗斯巴达霸权军事力量的制衡点，并成为阿卡迪亚联盟中极具价值的一员。"
 megaran_heritage:0 "麦加拉传承"
 megaran_heritage_desc:0 "麦加拉作为雅典的古老对手之一，一直与其争夺阿提卡的控制权，其地位来源于其连接希腊与伯罗奔尼撒半岛的地理位置，而且，这里还是麦加拉学派辩证法的发源地。"
 melanchlaenia_heritage:0 "黑袍传承"
 melanchlaenia_heritage_desc:0 "梅兰赫莱尼人几乎本身就是一个神话，他们生活在遥远的北方，在布迪尼人之外，在食人的安多法基人以东。 他们的名字只有希腊人知道，肯定是指他们身上披着的深色兽皮，因为厚厚的兽皮可以在严寒和狂风中起到很好的保暖作用，而狂风则会穿过成群的树木。 如果这些部落的氏族南下，可以想象他们会像没有身体的影子一样在黑夜中移动，在黑暗中发动袭击，给所有定居的世界带来恐怖。"
 memnonia_heritage:0 "门农传承"
 memnonia_heritage_desc:0 "门农人并不一定是以神话中的特洛伊王子门农为祖先的部落，而是一个被邻近战团以及麦罗埃地区强大的库施王国包围的部落。是库施人和森林日益茂密的南部土地之间的缓冲区。他们受益于这个北方邻国的繁荣以及库施人和南方部落之间存在的许多贸易路线。"
 mesembria_heritage:0 "混合希腊人的传承"
 mesembria_heritage_desc:0 "墨森布里亚坐落在海穆斯山脚下。它可能一度因创始人墨纳斯而被称为墨涅布里亚，不过也有人说它最初因名为墨尔萨斯的创始人而称墨尔森布里亚。它是许多希腊人的殖民地，由墨加拉、卡尔西顿或拜占庭建立，也可能是在公元前六世纪多年间由这些来源混合形成。墨森布里亚是色雷斯海岸唯一以多利亚人为主的希腊城市。建城后不久，它就在财富、权力、贸易路线和贸易伙伴方面成为邻近阿波罗尼亚的坚定对手，早在公元前五世纪便铸造自己的青铜币和银币。墨森布里亚在公元前425年至424年间加入提洛同盟。它保持强烈的希腊文化，在城中中央神庙敬奉阿波罗；同时，其地方历史也可见于希腊城墙所环绕的色雷斯防御工事。"
 messapia_heritage:0 "水域中的传承"
 messapia_heritage_desc:0 "梅萨皮人使用其独特的梅萨皮克语，是意大利东南部的亚皮吉亚部落之一，居住于石灰岩遍布的萨伦托半岛。据传他们及其北方亲族横渡亚得里亚海自伊利里亚而来，与原乡有紧密联系。其名意为“水域中的人”，起源可追溯至青铜时代，如公元前15世纪建立的前意大利遗址格纳提亚。梅萨皮人形成独特身份，与意大利其他亚皮吉亚部落区分开来，尤其在语言方面。他们较亲属更倾向城市化，密集聚居。各城邦自治，无统一梅萨皮政府。其势力壮大，卷入多次邻近部落及大希腊希腊城市间战争，被视为文明盟友和强大威胁。"
 metapontine_heritage:0 "麦塔蓬提昂传承"
 metapontine_heritage_desc:0 "麦塔蓬提昂是最古老的意大利俄忒斯殖民地之一，由来自亚该亚的定居者建立，并在其近邻的阴谋中幸存下来。数学家毕达哥拉斯从克罗同逃到这里，许多人仍然遵循他的宗教教义。"
 milesian_heritage:0 "米利都传承"
 milesian_heritage_desc:0 "米利都（Miletus）在赫梯语中被称为Millawanda，似乎是安纳托利亚地区最大的迈锡尼殖民地。根据传说，这座城市由其同名的米利都所建立，米利都是一位宁芙和阿波罗神的儿子。在叔叔米诺斯国王将他的伯祖父萨尔佩冬流放到吕基亚之后，米利都组建了一支军队帮助萨尔佩冬争夺吕基亚王位。一旦吕基亚被征服，米利都便自己出发，在卡里亚建立了以他名字命名的城市。米利都很快成为了伊奥尼亚的实际首都，并在东方海岸播种了无数希腊城市。米利都的一位公民赫卡泰乌斯被希腊人视为地理学的创始人。米利都还孕育了泰勒斯，这位在苏格拉底之前的最著名哲学家，他将巴比伦的知识带入了希腊世界。与阿那克西曼德和阿那克西美尼合作，泰勒斯几乎可以说是创立了哲学这门学科。米利都城在其历史中多次易手，从一个帝国转移到另一个帝国，但始终保持自治，很大程度上避免了频繁消耗小亚细亚的战争。"
 minoan_heritage:0 "米诺斯传承"
 minoan_heritage_desc:0 "米诺斯人曾是克里特的主人，一度称霸全希腊。在毁灭性的锡拉火山爆发后，这个文明陷入沉寂。"
 miran_heritage:0 "米兰传承"
 miran_heritage_desc:0 "米兰依靠一套复杂的灌溉系统为生，该系统利用了现今已经干涸的、源自山脉的河流系统，是塔里木盆地南部商路上的一个重要据点。这座城市受益于大沙漠（有人称之为\"死亡之海\"）造成的东西贸易分岔。作为一个拥有繁荣市场的富裕绿洲，米兰受到了喜马拉雅山另一侧佛教城镇的影响，这些城镇可能也通过疏勒的玉门关将思想传播到了楼兰王国。然而，米兰也可能经手了起源于地中海以及中国南方的贸易物品，显示了塔里木盆地在连接东西方中发挥的巨大纽带作用。"
 monapia_heritage:0 "中岛的传承"
 monapia_heritage_desc:0 "位于不列颠、喀里多尼亚与未知的希伯尼亚之间的岛屿居民，掌握着航海贸易与中介地位带来的贸易关系——罗马人称此地为马纳维亚。这座岛屿自公元前6500年起就有人居住，虽然岛民称它为“岛屿”，但它也从多个来源获得了“莫纳维亚、曼、曼努、莫纳”等名字。一种说法是来自凯尔特神话中的异界之王马南南，另一种说法则是一位名为曼纳南的著名商人曾居住于此。这两个起源说明了该岛既是重要的贸易中心，也具有神秘性质——它像一座从海中突起的孤山，远离其他部族。传说中，神祇曼纳南曾用他的斗篷保护这座岛屿免受入侵，也正因此，许多奇异而令人敬畏的生物与传说，如布甘怪或岩石中居住的仙女，都源于此地。"
 mosylon_heritage:0 "摩叙隆传承"
 mosylon_heritage_desc:0 "伟大贸易城市摩叙隆的人民是海洋的主人。虽然他们的土地并不盛产农业，他们却依靠海洋资源以及与远至印度和罗马的外国帝国贸易为生。象牙、乌木、野兽、药草和黄金等货物从摩叙隆港流向已知世界的其他地方。"
 nabatean_heritage:0 "纳巴泰传承"
 nabatean_heritage_desc:0 "我们的贝都因祖先让我们能控制整个沙漠的贸易，为更广阔的世界提供他们无法得到的货物。这些财富允许我们建造大城市、纪念碑和一支精通沙漠作战的强大军队。"
 nabhaka_heritage:0 "那婆加的传承"
 nabhaka_heritage_desc:0 "日后，当阿育王征服印度次大陆北部大片领土时，这个地区和这里的人民通过阿育王的岩石诏书而为人所知，但他们在其他地方却鲜为人知。\n他们是达底人的一个部落，属于古老传统的一部分，这些部落横跨北方的高山和南方的低地，在那里，大军沿着平坦的原野行进。他们占据高地优势，可能很快就会掠夺遍布各地的城市，然后返回山地家园。"
 nabhapakti_heritage:0 "尼波罗的传承"
 nabhapakti_heritage_desc:0 "虽然早在公元前四世纪的吠陀经文中就有了“尼泊尔”或“尼婆罗”的说法，但在这一古典时代的记载之前，该地区以偏远的生计和佛教寺院而闻名的人们已经在那里生活了多久，我们不得而知。\n佛教来自印度传统，在人类世界中仅有很小的立足点，但那婆般提人是其根基。"
 nagnatia_heritage:0 "杰出希柏耳尼亚人的传承"
 nagnatia_heritage_desc:0 "纳格那泰人，也被称为马格那泰人，是现代康诺特地区最古老的族群之一，他们过着由来已久的传统生活。他们可能是费尔·奥尔·内赫马赫特人的祖先，后者同样声称是该地区的史前居民。\n他们的部落中心，或至少一个重要的定居点，以部落之名命名为纳加塔，位于拉维乌斯河与利布尼乌斯河河口之间。地中海之民称这个地方为‘杰出之地’，因此它必定在地理和贸易上具有重要意义，才得以引起南方建城者们的注意。"
 nesiotic_heritage:0 "群岛联盟传承"
 nesiotic_heritage_desc:0 "群岛联盟是安提柯一世的创意，是一个奇特而短暂的岛屿组织，通过统治马其顿王国力量的继业者而被迫一起合作。最引人注目的是，在被托勒密王朝占领之前，该联盟一直由安提柯王朝控制，后来被解散并在罗得斯的管辖下进行改革。当它为一位继业者主人服务时，联盟在神圣的德洛斯岛举行了一年一度的宗教节日活动，即安提戈尼亚（后来的托勒密救主节），以纪念他们的霸主。"
 neuria_heritage:0 "狼人传承"
 neuria_heritage_desc:0 "Neuri人仅以提拉斯河与众多斯基泰部落相隔，他们自身生活在Hypanis河沿岸。虽然他们可能远眺对岸的斯基泰人，但他们实践了许多斯基泰习俗，并与自己的传统混合。或许是因为被一支强大的蛇族军队驱逐出故土，暂居于布迪尼人中间（据说布迪尼人讲斯基泰语），后来他们返回并征服了蛇族的领地，可能借助了狼人变形的力量，据说Neuri人在一年中的某些日子会变成狼。"
 nuceria_heritage:0 "核桃联盟的传承"
 nuceria_heritage_desc:0 "据说一位伊特鲁里亚公主为了追求爱情逃离故乡，却在此地未能如愿而终。为了纪念心爱的女儿，她的父亲建了一座城镇并以她的名字命名。也有人说这个名字来自一次大洪水，当时洪水冲走了这片地区的所有大树林，只剩下一棵核桃树——核桃在拉丁语中为“nux/nucis”。意大利最早的讲奥斯坎语的居民首先定居于此地，以及庞贝等其他地点，建立了多个要塞城镇以守护这片肥沃的山谷。后来伊特鲁里亚人控制了努刻里亚，创建了坎帕尼亚的伊特鲁里亚十二城联盟。伊特鲁里亚人在库迈战败后离开此地，强大的萨莫奈联邦接管了整个地区，将该地命名为努刻里亚·阿尔法特纳，后者的名称来源于萨姆奈的阿尔法特部族。最终，这座城市走上了独立之路，组建了自己的联盟以获得经济和军事支持——努切里亚联盟——包括邻近的库迈、庞贝、赫库兰尼姆、斯塔比亚和索伦托等地。为管理联盟及行政事务，使用了本地努切里亚语言，这种语言融合了希腊语和伊特鲁里亚语元素。"
 numantian_heritage:0 "努曼提亚传承"
 numantian_heritage_desc:0 "努曼提亚矗立在伊比利亚阿雷瓦奇人的土地上，以本土人民反抗罗马人的象征而闻名。"
 nyaunggan_heritage:0 "青铜新石器交流传承"
 nyaunggan_heritage_desc:0 "自公元前1500年左右起，纽甘遗址已经有人类居住。尽管它并非最富庶的地方，墓葬中的随葬品较为简单，缺乏奢华，但有明确迹象表明这里曾有一种青铜时代前文化，使用石器并且有少量的青铜器。遗址的葬俗包括集体进餐/饮酒和为死者供奉。人们似乎通过新石器交换路线学会了如何用当地的锡矿冶炼青铜，青铜因此成为遗址上葬俗的一个重要组成部分。"
 odessos_heritage:0 "奥德索斯的传承"
 odessos_heritage_desc:0 "自铜石并用时代以来，此地便是富裕精英及其墓葬的家园。色雷斯人在这里建立贸易枢纽，加工青铜，并与帖撒利、高加索和大安纳托利亚的人们交易货物。这些色雷斯人有些人称为克罗比斯部落，他们与强大的奥德律西亚和盖塔精英结盟并订立协议。米利都人在公元前六世纪初首次到来，在色雷斯人周围这片富饶且航行便利的地区建立了“阿波基亚”即贸易据点。奥德索斯是海西岸其他希腊城邦组成的本都五城联盟的重要成员，并在公元前425年前加入提洛同盟。公元前339年击退马其顿腓力二世的围攻后，它最终落入其子亚历山大手中，此后由吕西马科斯继承。奥德索斯积极参与了反对吕西马科斯的大规模起义，但在叛乱结束后成为这位希腊统治者的顺从据点。"
 odrysian_heritage:0 "俄德律西亚传承"
 odrysian_heritage_desc:0 "俄德律西亚王国曾经统治过整个色雷斯区域，后来被马其顿人驱逐到内陆。虽然他们无法与征服者的财富相媲美，但他们仍然记得他们前帝国的传承。"
 oinoandia_heritage:0 "埃诺安狄亚的传承"
 oinoandia_heritage_desc:0 "奥诺安达在弥吕亚斯的忒耳墨索斯人的殖民地，后来与基彼拉提亚联盟，创立了基彼拉四城邦，该联盟持续一百年，并于公元前669年加入了吕基亚联盟"
 olbe_cilicia_heritage:0 "奥尔万传承"
 olbe_cilicia_heritage_desc:0 "奥尔贝是唯一独立的奇里乞亚王国，据说由透克罗斯之子埃阿斯建立。奇里乞亚特拉凯亚的统治祭司王朝落入混乱而短命的僭主之手并进一步陷入失序后，奥尔贝成为海盗避风港。这些奇里乞亚海盗后来在奴隶战争的著名记载中再次出现，他们曾给斯巴达克斯一个从意大利本土渡海前往西西里的机会，随后却拿走他的钱财，把他和军队遗弃在原地。"
 olbia_heritage:0 "快乐之城的传承"
 olbia_heritage_desc:0 "奥尔比亚于公元前7世纪作为米利都殖民地被建立，又称“快乐之城”，是斯基泰文化和希腊文化的重要交汇点，许多古陶器和希腊信仰都通过这个港口进入半游牧地带。据说，王族斯基泰人的国王斯基勒斯参加了这个小镇的巴克斯仪式，并在这里拥有了自己的家，但却因为如此激烈地拥抱希腊文化而被族人杀死。该镇最初很可能只是一个别列赞小岛或半岛上的定居点，但后来在商业和文化方面日益显赫。在亚历山大大帝的时代，奥尔比亚曾与米利都协同，对抗马其顿将军佐皮利昂。"
 olcadian_heritage:0 "俄尔卡迪亚传承"
 olcadian_heritage_desc:0 "与邻近的凯尔特伊比利亚人同源的俄尔卡迪亚人，以佣兵传统和捍卫独立著称。"
 onuban_heritage:0 "奥努巴传承"
 onuban_heritage_desc:0 "在文明世界最后的边界之外坐落着奥努巴。它位于卢西亚河口，控制着塔耳西斯富饶银矿所出产金属的贸易，吸引了大量外国人定居城中。"
 opus_heritage:0 "厄庇克涅密得洛克里斯人的传承"
 opus_heritage_desc:0 "作为厄庇克涅密得洛克里斯人的首邑，俄普斯距所谓的俄普提亚湾岸仅十五斯塔狄亚。该海湾连接大陆、优卑亚岛以及更广阔的爱琴海，商船与战舰皆经其航行。许多希腊人，包含底比斯的品达，都认为该城是希腊最早的城邦之一，其建立者正是洛克洛斯与普罗托革涅亚之子——俄普斯。传说这二人皆为大洪水幸存者丢卡利翁的后裔。据说丢卡利翁与其妻皮拉在洪水退去后便居于此地，因此该地成为众多传奇人物的发源地。腓提奥提斯的英雄阿基琉斯的伙伴帕特洛克罗斯便出生于此，而小埃阿斯——洛克里斯之王俄伊琉斯之子——曾率领此地军队出征，因此俄普斯建有一座小埃阿斯神坛，并举行“埃阿忒亚”竞技会以纪念他。即便在英雄时代及特洛伊战争之后，俄普斯仍不乏荣耀，在温泉关之战中曾与斯巴达并肩对抗波斯王薛西斯的大军。"
 ordovicia_heritage:0 "奥尔多维奇部落的传承"
 ordovicia_heritage_desc:0 "作为最骄傲的民族之一，奥陶维希人不太愿意接受外国人的习俗和习惯，而是更倾向于依靠当地传统。虽然并不确定，但他们的名字可能来源于“锤子”一词，也许表明他们在冶炼和开采山区资源方面的熟练程度。\n该部落主要居住在现代威尔士中部和北部地区，但也可能控制了莫纳岛，那里有许多重要的德鲁伊祭司和信徒。这些人可能利用海峡的隔离性寻求独处，并与自然建立更深的联系。"
 oreos_heritage:0 "葡萄丰盈的传承"
 oreos_heritage_desc:0 "俄瑞俄斯位于特勒特里翁山脚下，旧称希斯提亚亚，掌控着优卑亚岛北部地区，并使该地区得名希斯提亚欧提斯。究竟是谁建立了这座战略要地不得而知，可能是帖撒利的佩耳海比人，或是来自阿提卡的移民，又或是波俄提亚的许里俄斯之女——名为希斯提亚亚的女子。作为优卑亚岛最古老的城邦之一，它被记载在《伊利亚特》第二卷的舰队名录中，曾派遣舰队前往遥远的特洛伊。这座城市对岸便是帖撒利亚的安特戎，掌控着岛屿与大陆之间水道的航运通行。也许正因如此，人们称此城有两座卫城，一座守护市中心，一座俯瞰海面。凭借战略位置和财富，该市及其精英阶层成为了如雅典和马其顿等强权博弈的棋子。"
 oretanian_heritage:0 "俄雷塔尼亚传承"
 oretanian_heritage_desc:0 "奥勒塔尼亚是伊比利亚最发达的非沿海部落之一，因为他们与西地中海不同的腓尼基和希腊国家有贸易关系，而且特别偏爱黎凡特文化，最终与迦太基结下了爱恨情仇。"
 orgame_heritage:0 "俄耳伽墨传承"
 orgame_heritage_desc:0 "俄耳伽墨是现代罗马尼亚地区最古老的希腊殖民地，其建立可追溯至公元前七世纪，至少比邻近的著名城市希斯特里亚早一代。不过，该遗址至少从青铜时代起便明显有人居住，哪怕只是较松散的居住。据说伊阿宋和阿尔戈英雄们带着金羊毛返回希腊世界途中，曾在这里暂时休息。"
 oxuaioia_heritage:0 "俄克苏埃俄伊的传承"
 oxuaioia_heritage_desc:0 "控制德里努斯河（Drinus river）的一族，德里努斯河是伊斯特罗斯河（Istros river）的支流，它分支为塔拉河和林姆河，最终在山中消失。俄克苏埃俄伊（Oxuaioi），也被称为奥兹阿伊（Ozuaei），是伊利里亚德雷梅斯特部族的一个贸易成员。他们掌控了伊利里亚山脉北部的贸易路线，从而比邻近的阿尔米斯塔部族获得了更多的贸易份额。"
 paeonia_heritage:0 "佩奥尼亚的传承"
 paeonia_heritage_desc:0 "佩奥尼亚人是一个融合了伊利里亚、色雷斯和希腊血统的古老民族，曾统治从普罗蓬提斯海到现今土地的广大区域。他们自称是埃利斯王子佩翁的后裔，佩翁是埃奥利亚牧羊人恩底弥翁之子。佩奥尼亚人曾是英雄时代特洛伊战争中特洛伊人的著名盟友。经历缓慢衰落后，佩奥尼亚在大流士入侵中失去广泛控制，只剩以山地为界的故土。公元前5至4世纪马其顿扩张期间，他们屈服于腓力二世的统治。在继承希腊传统中，佩奥尼亚人崇拜酒神狄俄倪索斯，称其为迪亚洛斯或德里亚洛斯，并在山地故土维持强烈的崇拜。"
 palada_heritage:0 "牟剌迦的传承"
 palada_heritage_desc:0 "帕拉达人大多来自穆拉坎部落，该部落是阿斯马卡国王的儿子穆拉卡及其古老领地的后裔。 这个部落位于几个不同地区和文化的印第安族群的交汇处，因此他们处于许多事情的中心。 也许这个位置会给他们带来启示和重要性。"
 pandyan_heritage:0 "般帝耶传承"
 pandyan_heritage_desc:0 "作为泰米尔三大王朝之一，般帝耶人在南部海岸拥有肥沃富饶的土地。般帝耶人获得了商伽摩人或学院的赞助，许多泰米尔文学作品都是从般帝耶的土地或人民那里诞生的。除了肥沃的土地外，般帝耶人还因出口稀有的异国商品而闻名，比如从海上收获的珍珠。因富饶的土地建立了王国，得以在支持不断增长的人口的同时，扩大其对地区的权力。"
 paphlagonia_heritage:0 "皮莱墨涅斯传承"
 paphlagonia_heritage_desc:0 "安纳托利亚最古老的部落之一，神话特洛伊战争中被认为是特洛伊守军的坚定盟友，帕弗拉格尼亚人在古代是由国王皮莱墨涅斯统治的——他的许多继任者都以他的名字为自己的名字，佩戴着“皮莱墨涅斯”的头衔，向他受人尊敬的统治和遗产致敬。亚历山大帝国灭亡后，这个部落很快就会变成米特里达梯王朝，这是罗马共和国最棘手的敌人之一。"
 parambu_heritage:0 "维利尔人的传承"
 parambu_heritage_desc:0 "维利尔人最初来自图瓦拉帕提城，在传说中的圣人阿迦斯提亚的领导下，维利尔人的十八个部族最终分裂成许多团体，定居在印度各地。 其中一支庞大的队伍定居在帕兰布（Parambu）。 在这里，他们过着与世隔绝的简单生活，夹在泰米尔大国之间，而泰米尔大国在南部大地上拥有强大的势力。 如果他们能收集到祖先的残余，也许就能成为该地区的强国......"
 parisia_heritage:0 "不列颠巴黎人部落的传承"
 parisia_heritage_desc:0 "这些人或许与高卢的巴黎部落有关系，但这种联系尚无定论。可以确定的是，他们在不列颠的地位相当危险，周围被布里甘特部落包围，另有亨伯河在一侧。有人称他们拥有一个“好港口”，或许这仅是一个天然的岬角，保护着他们安顿下来的海岸线，也许这就是后来罗马人定居的“幸运港”。\n若他们与大陆上的同名部落确有关联，那么航海或许就是他们抵达不列颠的方式。这个港口或许就是罗马人后来称之为“厄玻拉孔”的地方，其意为“紫杉树之地”，这个地方对于帕里西人来说是一个坚固的堡垒，纵使并非幸运之港，至少对部落来说也是一个易守难攻的所在。"
 parnia_heritage:0 "阿尔塔薛西斯二世传承"
 parnia_heritage_desc:0 "帕尔尼人是大益三大部落之一，他们是入侵刚刚独立的塞琉古帕提亚总督领的著名民族，并建立了著名而危险的阿尔萨息王朝。他们认为自己的王室血统来自于阿契美尼德皇帝阿尔塔薛西斯二世，因此他们拥有统治伊朗高原的巨大合法性，据说他们使用的语言介于斯基泰语和美地亚语之间，但更有可能只是一个斯基泰部落，在游牧民族大迁徙的浪潮中，他们与许多其他部落一起从南方迁徙到奥尔楚斯河沿岸。"
 patrai_heritage:0 "农夫帕特柔斯的传承"
 patrai_heritage_desc:0 "帕特雷位于帕那凯科山的阴影之下，其定居历史可追溯至公元前3千纪的青铜时代。直到迈锡尼文明的鼎盛期结束后的公元前2千纪后期，该地才真正崭露头角。那时，邻近的阿洛伊、安忒亚和梅萨提斯三地合并，形成了一个集中的精英政体。传说这一联合由帕特柔斯促成，他是斯巴达拉刻代梦的后裔普柔革涅斯之子，帕特雷即为其为应对伯罗奔尼撒人口增长而设立的殖民地。自此，帕特雷成为一座农业城市，在古风时期、古典时期及希腊化时期均为周边城市及其征服者提供农产品。"
 paurava_heritage:0 "普鲁传承"
 paurava_heritage_desc:0 "有些人认为波罗伐人和希腊记载中的国王波罗伐来自吠陀时代的普鲁部落联盟，该联盟曾参加过伟大的十王之战（他们与盟友一起战败）。\n居住在旁遮普地区的波罗伐人在公元前525年被阿契美尼德王朝征服，成为印度总督领的一部分，但到公元前338年左右，他们在有记载的波罗斯统治下实现了独立。\n波罗斯国王的军队是亚历山大大帝征战的最后一个巨大障碍，在旃陀罗笈多统治时期，它是希腊世界和大东方之间的边境地区，孔雀帝国在开始反击希腊统治时征服了它。"
 pednelissia_heritage:0 "佩迪内利桑的传承"
 pednelissia_heritage_desc:0 "佩迪内利桑是一个靠近皮西迪亚和潘菲利亚地区边界的小城市，总是很难与人口众多的像瑟尔革等较大的邻国竞争。为了对抗其直接威胁，它有向继业者等更大的盟友屈服和求助的历史。"
 pelignia_heritage:0 "混血儿的传承"
 pelignia_heritage_desc:0 "佩利格尼部族是意大利东部的一个奥斯坎‑翁布里亚族群，实行以村社为基础的有限中央统治，由基于农村的法官“meddixes”领导。在制度及文化领域，他们深受大希腊殖民者的影响，并将部分希腊神祇（如狄奥斯库里兄弟）纳入了本族神谱。\n像许多该地区的小部落一样，他们在强大的萨莫奈联邦多次被拉丁人击退后，臣服于罗马。他们这个不寻常的名字可能源于“混血儿”的含义，暗示了他们与其他奥斯坎语部族的文化融合。"
 pellene_heritage:0 "巨人帕拉斯的传承"
 pellene_heritage_desc:0 "佩勒涅为亚该亚诸城中最东方的一座，其居民追溯自身血统至伟大巨人帕拉斯——在巨人战争后，被雅典娜杀死剥皮，其皮成为她神盾的覆盖物。也许正因如此，此城坐落在一座巨大山丘之上，距海六十斯塔狄亚，山脊横贯全城，地势难以攀登。然而佩勒涅人亦有凡人祖源，据传为强大阿尔戈斯的第六代国王福耳巴斯及其子——来自阿尔戈斯的佩伦。佩伦率众离乡，在伯罗奔尼撒北部建立了属于自己的传承。佩勒涅历史悠久，《伊利亚特》船名单中亦有其名。其后，该地繁荣发展，甚至远在马其顿半岛的锡奥尼，其居民自称为佩勒涅战后归来之人所建。自此之后，佩勒涅亦盛产强劲运动员，其中查戎更在亚历山大大帝的帮助下成为僭主，代表城市崛起。"
 phasis_heritage:0 "发西斯传承"
 phasis_heritage_desc:0 "在古典时期，米列希安人在与米列希安河上建立了一个后来被称作发西斯的殖民地。这座城市坐落在科尔基斯王国的内弯处，四周被当地的“蛮族”包围。然而，这座城市似乎与他们保持了和平，并在印度至黑海间的贸易网络中扮演了重要贸易港口的角色。"
 phrynia_heritage:0 "山蛙传承"
 phrynia_heritage_desc:0 "神秘的蒲犁人生活在帕米尔山脉的中心地带，与世隔绝。 这些斯基泰/萨坎部族居住的地方可能就是现代的洪扎河谷，洪扎河谷沿洪扎河而建，是该地区苯教和佛教信仰的交融之地，他们随商队翻山越岭。 这些人虽然居住在狭小的山区，但却控制着该地区的贸易路线，对帕米尔山脉周围的所有地区都具有领土影响力。"
 physkos_heritage:0 "莱托城堡的传承"
 physkos_heritage_desc:0 "作为一座贸易港口城镇，菲斯科斯以两件事闻名于世。其一是高耸入云的宏伟城堡，希罗多德称其始建于公元前3000年。亚历山大大帝曾围攻这座城堡及城镇本身，当仅有600名守军无力抵御而逃离后，他特意下令修缮并维护这座战术性极强的雄伟建筑。该城还因供奉双子神祇阿波罗与阿尔忒弥斯的母亲——女神勒托而闻名。虽有诸多记载提及供奉她的神圣树林（可能确有其事），但更广为人知的是隐藏在一座小岛上的洞穴，该岛通过狭窄地峡与菲斯科斯周边区域相连。希腊时期的这座洞穴确实曾供奉着莱托女神，但遗迹显示该遗址的使用历史可追溯至近12000年前（公元前10000年）。公元前4世纪中叶，菲斯科斯作为林多斯的一个市区被并入罗德岛珀赖亚地区。罗德岛人极度垂涎菲斯科斯卓越的港口，将其作为连接岛屿据点与亚洲领地的主要纽带。"
 picentia_heritage:0 "啄木鸟的传承"
 picentia_heritage_desc:0 "庇刻农地区由皮森特人居住，可分为‘北皮森特人’和‘南皮森特人’两组。两者虽有相似之处，南方群体更具意大利文化，北方部族则体现多种非意大利元素，可能受迁入凯尔特人的影响。南方讲的是翁布里亚语支的意大利语言。\n罗马人声称皮森特人，或至少南部部分，是萨宾殖民者的后裔，这解释了他们与泛萨宾文化的亲缘关系。传说一只啄木鸟引领他们最终定居庇刻农，这种依赖守护动物引导的故事在意大利神话传统中十分常见。"
 pieria_heritage:0 "皮列阿伊的传承"
 pieria_heritage_desc:0 "皮列阿伊部落（有时被称为皮埃里部落等许多名字）生活在纳罗河沿岸，他们已经非常习惯于与希腊城市居民的接触和影响。皮列阿伊部落附近生活着克尼底亚的定居者和科尔基拉人。希腊人对他们和他们的土地产生兴趣，因为该地区土地肥沃，由河流灌溉，因此进行大量贸易，并学习希腊语以便更容易交易。正因如此，希腊人在纳罗纳建立了商贸站，方便陆路通行。"
 pishan_heritage:0 "皮山传承"
 pishan_heritage_desc:0 "皮山是一个商队枢纽和贸易站，位于通往帕米尔山脉和其他山谷的许多道路的起点。皮山本身及其王国虽然只有500名战士，但却是中国与阿剌科西亚或印度次大陆之间的贸易枢纽。许多人通过这种贸易赚取了巨额财富。"
 pissuria_heritage:0 "皮苏里传承"
 pissuria_heritage_desc:0 "皮苏里族是生活在里海草原上的众多大益部落之一，他们是在据说是由马萨格泰人（Massagetae）掀起的早期斯基泰部落迁徙浪潮之后出现的。皮苏里部族漫游在帕提亚帝国以北的土地上，生活在广袤的沙漠草原开始之前的山区边缘，一直延伸到咸海甚至更远的地方。在帕尔尼人崛起征服帕提亚并建立阿尔萨息王朝的时期，他们是大益人的一个小部落。"
 pitinika_heritage:0 "慷慨者的传承"
 pitinika_heritage_desc:0 "皮提尼卡是马哈拉施特拉邦人和马拉地语族的故乡，这里曾是印度次大陆与海洋交界的边缘之地，他们曾远渡重洋，前往波斯人、埃及人、希腊人和罗马人的神秘国度。\n该地区大部分地区都是丘陵和低山，很少有适合耕作的地方，但人们依靠亚达瓦王国的荣耀和传奇国王辛格哈尼及其慷慨解囊的精神坚持了下来。"
 polyrrhenia_heritage:0 "筑防渔业传承"
 polyrrhenia_heritage_desc:0 "这座城市建在埃利松河两岸，墨伽洛波利斯之名中的“巨大”二字确实名副其实。它是阿卡迪亚地区最大的城市化区域，拥有许多宏伟建筑，包括一座可容纳两万人的剧场。同样，拥有六十七根柱子的忒耳西勒翁及一座神庙也在城市景观中显得壮观非凡。这座城市实际上是在公元前317年于一座同样名为墨伽洛波利斯的旧城之上重建的，因此当地深深理解重大事件与人物曾如何改变此地历史进程。正因如此，许多人相信墨伽洛波利斯及其周边土地至少是古代提坦之战的一处主要战场，田野中散落着提坦遗骨，宙斯掷下的雷霆留下的焦痕点缀景观；火焰有时甚至会从地面自发重生，自岩石大地中冒出。由于规模庞大，又有阿卡迪亚支持其稳定，墨伽洛波利斯被设立为制衡霸权斯巴达军事力量的城市，并成为阿卡迪亚联盟的重要成员。"
 pontic_heritage:0 "本都传承"
 pontic_heritage_desc:0 "早在亚历山大东进之前，一直追溯到希腊殖民者在安纳托利亚海岸兴起之时，本都地区就已经是波斯、安纳托利亚和希腊等文化的交叉口。"
 praesos_heritage:0 "真正克里特人的传承"
 praesos_heritage_desc:0 "普赖索斯人自称“埃忒奥克里特人”或“真正的克里特人”。他们保有一种据称早于希腊人自身的传统，并使用一种见于公元前七世纪至前三世纪铭文的语言，这种语言可能源自线形文字A的米诺斯语。这些就是所谓克里特象形文字。该城是狄克泰宙斯神庙与祭祀的所在地，因为狄克忒山就在邻近领土。此地自新石器时代以来便有人居住，并在米诺斯、迈锡尼和希腊时期始终是一处位置良好的定居点。由于重视克里特遗产和远古时代，普赖索斯人相信殖民克里特部分地区的安纳托利亚科律班忒斯是雅典娜与赫利俄斯之子。"
 ptolemys_heritage:0 "托勒密传承"
 ptolemys_heritage_desc:0 "当亚历山大殒落时，“救主”托勒密确保自己从前主子那分到了经年军旅生涯中见过的最富庶、最繁茂的土地。埃及不仅是地中海的要地，也是数千年遗产的承载者。坐拥埃及的财富，以及希腊化世界和埃及文化的融合传统，托勒密要着手建设一个以赞助宗教与文化闻名的国家。"
 pyrenean_heritage:0 "比利牛斯传承"
 pyrenean_heritage_desc:0 "我们的祖先已经向我们展示了前进之路。"
 qandala_heritage:0 "繁荣之湾传承"
 qandala_heritage_desc:0 "位于摩叙隆以东、“乳香海岸”的更深处，坎达拉是往来印度诸国与厄律特莱海之间商旅的重要站点。港口天然地被海角环绕，以出口多种乳香、树脂与芳香木材而闻名。正因为贸易安全且繁荣，这片地区被人们称为“加肯卡·霍东卡”，意为“繁荣之湾”。港口依靠邻近地区的财富，以及来自印度与南利比亚的稳定商路而兴盛。"
 qataba_heritage:0 "卡塔巴传承"
 qataba_heritage_desc:0 "卡塔巴是阿拉伯南部的一个古代王国，曾与萨巴王国对抗——先是口舌之争，后是刀兵相见。"
 qiemo_heritage:0 "且末的传承"
 qiemo_heritage_desc:0 "作为连接中国和费尔干纳市场的原始玉石之路的一部分，祁莫（首都位于今恰尔汗）在青铜时代就已定居，但它仍然是一个最多只有几千人的小王国。 洞穴壁画和木乃伊证实，祁莫通过翻山越岭的直接联系或其他塔克拉玛干城市，处理来自西藏地区和喜马拉雅山上遍布的苯教定居点的贸易。 除了市场和用于贸易的物质产品外，祁莫还有自己的果园和葡萄园，这使它有能力向邻国提供独特的食品。"
 qohaito_heritage:0 "科海托传承"
 qohaito_heritage_desc:0 "自公元前5世纪以来，科海托及其周边村庄的居民就一直居住在这一地区，这是一座前阿克苏姆人的城市。该定居点位于阿杜里斯沿海港口以西，地处高原，土地肥沃，村落建筑和房屋之间有小块农田。科海托之所以繁荣，是因为它位于阿克苏姆王国与阿杜里斯等沿海城市之间的贸易路线上。作为一个休息站，科海托接待了来自阿拉伯、利比亚和地中海文化的众多商人。"
 qushi_heritage:0 "曲氏的传承"
 qushi_heritage_desc:0 "曲氏被认为与考古学上的乌尤克文化相对应，是一个与许多邻族一样，面临着强大的匈奴联盟高压态势的部落群体。他们可被视为斯基泰-西伯利亚共同体的一员，既保留了欧亚大陆广泛分布的斯基泰型文化的标志性元素，也保留了北部针叶林地区较为本土的特征。他们的艺术中包含用于狩猎和服饰的动物风格装饰品。"
 rathika_heritage:0 "战车手的传承"
 rathika_heritage_desc:0 "罗絺迦一词的意思是“战车手”，这词对生活在这里的人们来说意义重大。他们可能不是第一个使用马拉战车的民族，但在这战争机器凋零的年代，他们可能已经成为战车之主。"
 rhegium_heritage:0 "青铜，香橙树与海市蜃楼的传承"
 rhegium_heritage_desc:0 "该城最初名为厄律特拉，意为‘红色’，可能是当地原名含义。后改名为瑞吉昂，因崇敬阿波罗也短暂改名为福玻亚。“意大利”一词最初指的是瑞吉昂周边地区，源自当地国王伊塔鲁斯。该城是希腊人继库迈之后最早的殖民地之一，由卡尔基斯人于公元前八世纪建立。当地希腊人曾称风神埃俄罗斯之子洛卡斯图斯为建城者，故在其硬币上加以纪念。凭借对斯居拉海峡的控制，瑞吉昂人与其城市一道富甲大希腊，在前五世纪的僭主阿纳克西拉奥斯统治下迎来黄金时代。尽管日后遭遇众多希腊竞争者及伊特鲁里亚海盗舰队侵扰，瑞吉昂依旧抵御四面之敌，仍为艺术与科学中心，毕达哥拉斯学派等学院亦坐落于此。"
 rhodian_heritage:0 "罗德岛传承"
 rhodian_heritage_desc:0 "罗得斯距建国伊始已过数百载，现今成为爱琴海上不可忽视的一支海上势力，同时它的工坊及城防也遐迩闻名。这个岛屿国家最引人为傲的成就在于它抵挡住了“围城者”德墨特里俄斯的攻击，后者尽管携带了诸多世上最先进围城器械，却仍旧无法攻破城池。"
 rizophagia_heritage:0 "罗佐法吉安传承"
 rizophagia_heritage_desc:0 "西边是梅加巴里部落，东边是干燥的丘陵和沙漠，将他们与繁荣的海洋隔开。“食根者”里佐法吉人是已知的几个部落之一，他们与阿蒂里人和巴比伦尼人一起居住在黑尼罗河沿岸的某个地方。在悬崖、空山和沙漠出现之前的最后一点肥沃土地上，可以找到里佐法吉人。也许是他们的根赋予了他们健康的体魄和与邻近部落冲突时的耐力......"
 robogdia_heritage:0 "罗博基人的传承"
 robogdia_heritage_desc:0 "罗博基人生活在希伯尼亚最东北部，接近神话中的达尔阿拉迪王国，大湖洛赫内湖为这片地区提供了肥沃的土壤和饮用水。由于与喀里多尼亚和不列颠南部的岛屿及岬角的接近，使得罗博基人与对岸有了大量的贸易与迁徙机会，交流了思想和习俗。这一位置给了罗博基人很多对外关系的选择……或者征服的机会。"
 roman_heritage:0 "罗马传承"
 roman_heritage_desc:0 "诞于希腊之北，伊鲁特利亚之南，罗马迅速崛起成为意大利中部的主要势力，并成为了同盟联合的领导者，蓄势待发，随时准备出击。罗马总能源源不断地动员人口，并获得处于其保护之下城邦的忠诚，这些优势逐渐成为了其强大的帝国主义传承。"
 roxolani_heritage:0 "罗克索拉尼传承"
 roxolani_heritage_desc:0 "罗克索拉尼人是继伊亚济格人之后第二个跨过第聂伯河的“萨尔马特人”，他们与之前的罗克索拉尼人相似，骑着装备精良的战马，称霸平原。 在博斯普鲁斯与斯基泰人一起征服波斯人失败后，他们继续前进，越过泰拉斯河，进入达契亚/摩厄西亚，与当地人和罗马邻居发生冲突。"
 rubrinsia_heritage:0 "萨尔多传承"
 rubrinsia_heritage_desc:0 "定居在撒丁岛最高山峰与东部的提尔雷尼亚海之间的一片土地上的Rubrensians，与许多与他们相似的部落一起，居住在岛屿最封闭和孤立的角落。据说在所有撒尔丹人中，生活在这些山谷和山脉中的人们对古老的仪式和撒尔多（我们的祖先）传授给最早人类的知识最为熟悉。从小，那里的人们便被送入荒野，磨练祖先的古老技能；独自一人，在充满敌人的恶劣环境中，水和食物匮乏，训练他们永不屈服，永不投降，只服从祖先的真理——这些原则指导着他们的民族。那些幸存下来的孩子将被教授矛术和弓箭术，随后才会学会剑术和海上生活的乐趣。那些在战斗和生活中表现突出的，将获得角盔奖励，并在撒尔丹天堂诺尔戈多终享荣华。"
 ruhunu_heritage:0 "被谋杀的马哈那加的传承"
 ruhunu_heritage_desc:0 "鲁胡努王国位于鲁胡努岛的东面，在阿努拉德普勒王国（鲁胡努王国有时是阿努拉德普勒王国的仆从国）晚期统治鲁胡努岛之前，鲁胡努王国是经济和文化发展的中心。 王国的创始人马哈那加（Mahanaga）是阿努拉达普拉国王穆塔西瓦（Mutasiva）的儿子之一，但在轮到他统治之前，他就离开了，建立了自己的联合王国--他在继承合法遗产之前就被王子的母亲拉玛达塔（Ramadatta）杀害了。 泰米尔三大王朝对该岛虎视眈眈，大陆始终存在进一步的威胁。 因此，控制水域至关重要。"
 saba_heritage:0 "萨巴传承"
 saba_heritage_desc:0 "萨班是古代阿拉伯南部的一个王国；他们建造了玛里巴水坝。被萨班征服的许多地区后来都爆发了叛乱，其中最著名的是近代的迈因。"
 sabinia_heritage:0 "萨宾人的传承"
 sabinia_heritage_desc:0 "萨宾人与罗马始终保持着复杂而深厚的联系。罗马传说讲述了萨宾人分裂的故事，描述罗马人绑架萨宾妇女以繁衍新城，这些妇女投身战场缓和了萨宾人与罗马人的战争。此后，萨宾王提图斯·塔蒂乌斯与罗慕路斯共治罗马，其王国和人民成为罗马及其附属阶层。\n罗马的克劳狄家族以其萨宾血统自豪，取名萨比努斯以示纪念。尽管萨宾人与罗马及其他意大利族群融合形成了罗马身份，但仍有半数萨宾人居住于山地，持续与罗马爆发代价高昂的战争，或许是为昔日妇女被掳的耻辱复仇。"
 sagalassos_heritage:0 "萨伽拉西亚的传承"
 sagalassos_heritage_desc:0 "萨伽拉索斯是皮西迪亚最古老的城市，自赫梯时代以来，萨伽拉索斯一直是阿尔扎瓦的主要中心，在历史和地理上发挥着重要作用。虽然他们是皮西迪亚的第一个城邦，但他们不再是最重要的那个。近几个世纪以来，塞尔吉亚在实力和人口上超过了他们，以至于他们被迫屈服于安提柯王朝的控制之下。"
 samad_heritage:0 "枣农传统"
 samad_heritage_desc:0 "萨马德东南部的阿曼部落有时是游牧民族，有时是定居民族，除了顽固的椰枣，他们不放牧任何动物，吃椰枣的频率如此之高，以至于他们的饮食被认为是灾难性的，但又是美味的。有人说，阿契美尼德王朝统治这里的唯一目的就是食用这种水果。"
 samaria_heritage:0 "撒马利亚传承"
 samaria_heritage_desc:0 "撒玛利亚人声称自己是约瑟夫的以色列人的后裔，也是唯一在预定地点崇拜雅威的人，他们认为自己的犹太邻居和他们的圣殿是异端。"
 samatata_heritage:0 "苏纳古拉的传承"
 samatata_heritage_desc:0 "希腊罗马人知道这个地方叫苏纳古拉（Sounagoura），因为这个地方有一个叫苏纳古拉的贸易站，许多精美的异国商品就来自这个贸易站。 这个港口位于雅鲁藏布江的入海口，雅鲁藏布江从喜马拉雅山流下，汇入梅格纳河，然后注入孟加拉湾。这条水道提供了淡水和出海的便利，许多货物可以在印度、波斯和地中海的港口找到归宿。"
 samnium_heritage:0 "萨莫奈传承"
 samnium_heritage_desc:0 "萨莫奈人可能起源于萨宾人，是讲奥斯坎语的部落联盟，由四大部落组成，生活在萨莫奈地区。公元前354年，他们在与高卢人的威胁中曾与罗马合作，后成为罗马坚定对手。萨莫奈以农业与畜牧业为经济基础，因山地资源有限，采用牧畜与混合耕作供养自身及邻里。至希腊化时期，他们超越了首领制，建立以乡村聚落为单位的政治体系，由称为“帕吉”的官员领导，军队严密，骑兵与步兵结合，称为“好战的萨莫奈”，令敌人胆寒。与希腊城邦及罗马的战争使其军队形成类似希腊方阵的战斗编制，持矛、剑、盾，马蹄声震天。"
 satavahana_heritage:0 "百乘传承"
 satavahana_heritage_desc:0 "百乘王朝从衰弱的勘婆王朝手中夺取了德干高原的控制权，在印度中部建立了一个几乎三世纪内无人能挑战的政权。他们被视为一支强大的军事力量，因轻松击退外国侵略者而闻名，同时也因控制丰富的贸易货物而受到尊敬和嫉妒。即使在遥远的希腊土地上，他们也为人所知；米加斯塞尼的文献警告他的同胞要注意他们的强大力量！"
 satiyaputa_heritage:0 "穆索帕勒的传承"
 satiyaputa_heritage_desc:0 "托勒密通过穆索帕勒城的港口和重要位置命名了这个地方。 这个国家由泰米尔精英统治，统治阶级与主要是阿鲁班人的农民之间存在着矛盾。 它与印度大陆以外的贸易为文化探索提供了一个出口，同时通过商品流入稳定了经济。"
 satrapy_parthia_heritage:0 "帕提亚传承"
 satrapy_parthia_heritage_desc:0 "作为一个地区，帕提亚的历史可以追溯到公元前7世纪，当时它被米底帝国和中东其他地区征服。在接下来的几个世纪里，这个附庸地区不断易手，公元前6世纪，从米底人到阿契美尼德波斯人，再从他们到亚历山大马其顿帝国，不久之后，公元前4世纪又到了塞琉古帝国手中。帕提亚的面积也随着控制它的大帝国改变管理方式而起伏不定。在塞琉古帝国统治时期，帕提亚隶属于许耳卡尼亚行政单位。在亚历山大和塞琉古统治时期，帕提亚的统治权在几位马其顿战争时期的将军和贵族之间辗转，作为一个远离前线和各自霸主首都的后方总督领，帕提亚时常处于不稳定状态。这使其叛乱的本性得以滋长，也许马其顿总督们只是在为更好的人选热身……"
 seleucus_heritage:0 "塞琉古传承"
 seleucus_heritage_desc:0 "塞琉古的统治者们与希腊家乡失去了直接联系，不得不培育新的希腊化文化，使这种文化所包容及扶植的统治阶级能同时迎合希腊人臣民、移民以及数量庞大的迦勒底人和波斯人。因此，塞琉古常常将适应性置于文化优越性之上，逐渐成为了希腊化文化融合的闪亮灯塔。"
 selgia_heritage:0 "塞尔吉亚的传承"
 selgia_heritage_desc:0 "据不同资料记载，瑟尔革是由拉栖代梦的殖民者建立的，成为皮西迪亚最强大、人口最多的城市，亚历山大大帝本人在进军奇里乞亚的途中也经过了皮西迪亚。城市周围的地区非常肥沃，他们的贸易在哈德良时期一直蓬勃发展。"
 selinous_heritage:0 "强力芹菜的传承"
 selinous_heritage_desc:0 "塞利诺斯由西西里岛上较老的殖民地梅格拉·海布莱亚于公元前7世纪建立，在名叫帕米勒斯的人的指导下，由希腊母城梅加拉的殖民者协助创建。此地因大量野生芹菜而得名，芹菜叶也成为其硬币上的图案。作为西西里岛上最西端的希腊殖民地，塞利诺斯与腓尼基人及后来的迦太基人频繁接触，但也与当地的埃利米亚人和锡卡诺人爆发过边境与控制权冲突。通过这些冲突和持续不断的希腊殖民者补给，塞利诺斯变得强大，控制了马扎鲁斯河和哈吕库斯河流域地区。在伯罗奔尼撒战争中，塞利诺斯在阻挡失败的雅典远征中发挥了一定作用，但最终于公元前409年被迦太基的汉尼拔·马戈大军攻陷。"
 sembritia_heritage:0 "森布里提亚传承"
 sembritia_heritage_desc:0 "森布里特人是靠近“乳香海岸”的一个部落，其名称不应与许多“逃亡者”混淆，后者从库施和埃及定居点逃离，或被放逐到白尼罗河以西地区。他们的主要定居点森贝尔早在公元前800年便已建立。在达莫特以及后来的阿克苏姆兴起以前，它可能是利比亚东南部较早且较成功的牧业兼少量农业定居点之一。"
 senones_heritage:0 "掠夺罗马的传承"
 senones_heritage_desc:0 "塞农人原本居住在高卢腹地，被称为‘古代之民’，其中一部分人从塞纳河流域穿越阿尔卑斯山，进入意大利北部。他们进入翁布里人与皮森特人的上部地区，约在公元前400年左右，与其他凯尔特部落一同迁入山南高卢地区，加入贝洛维苏斯率领的迁徙浪潮，翻越阿尔卑斯山——他们的领地被称为‘高卢之地’。\n他们建立了塞纳高卢为其首都，并于公元前391年继续扩张，在著名的塞农人布伦努斯领导下，入侵克卢西翁周边的伊特鲁里亚东境。为了保卫伊特鲁里亚人，罗马违背部族战争法则加入战局，因此塞农人也将矛头对准了罗马人。\n公元前390年，罗马人在阿利亚战役中惨败，蛮族随后进军罗马，洗劫了这座城市。塞农人完成了两件大事：激起了罗马人对高卢人的恐惧与仇恨，并引发了罗马与塞农人在意大利长达百年以上的战争。"
 serdia_heritage:0 "塞尔迪亚的传承"
 serdia_heritage_desc:0 "塞尔迪部族很可能是公元前4世纪凯尔特人迁入北部希腊地区期间进入的众多凯尔特族群之一。然而，该部族也展现出色雷斯特质，可能反映了混合起源或对色雷斯元素的迅速文化适应。受到特里巴利和俄德律西亚人等危险本地色雷斯部族的压力，这些人不断被迫巩固领土边界或迁徙至更弱小的地区——所有目光都投向了日益腐败衰弱的马其顿南方。"
 sesamos_heritage:0 "阿马斯特里斯传承"
 sesamos_heritage_desc:0 "正如《伊利亚特》中描述的那样，虽然塞萨摩斯是伊奥尼亚自己的殖民地，但据说它与其他城市合并是为了建立阿玛丝特丽丝的大城市/领土，阿玛丝特丽丝是以波斯大流士三世、赫拉克利亚的狄俄尼西俄斯和吕西马科斯的妻子阿玛丝特丽丝命名的。在该女子与吕西马科斯分居后塞萨摩斯遗址后来成为新的阿玛丝特丽丝城卫城的中心。"
 shalcaw_heritage:0 "沙尔考传承"
 shalcaw_heritage_desc:0 "沙尔考是“乳香海岸”沿线数个贸易港之一，建在一段海岸上。这里不仅能向到来的商人供应没药，还能供应香木甚至一些椰枣；这些商人会从埃及或遥远东方的印度人土地带来货物。与邻近港口一样，沙尔考吸引了大量迁入的工匠和大师，他们会精炼运入和本地生长的天然产物。"
 shan_heritage:0 "表演者传承"
 shan_heritage_desc:0 "现代缅甸的掸族祖先，古代掸族是亚洲南部一个具有广泛联系的群体。尽管他们与东方的中国帝国有外交联系，但他们善于获取来自西方（如印度、波斯等远方地区）的稀有物品和独特的人物。掸族还因其独特的娱乐表演而著称，比如矮人艺人以喷火和吞火表演，同时进行杂耍，令人叹为观止。这些独特的贡献使掸族赢得了外邦王朝和统治者的青睐，为自己的国王和下属赢得了声望。正是这样，掸族为自己赢得了名声与尊重，为他人提供了奢华和欢愉。"
 shule_heritage:0 "玉门传承"
 shule_heritage_desc:0 "帕米尔山脉与天山和喜马拉雅山脉相连，在帕米尔山脚下，讲萨迦语的疏勒位于丝绸之路北部的起点，塔里木盆地的西入口处。 其首府喀什噶尔（Kashgar）因河流穿山而过而得名，守卫着玉门关（又称玉门关）。 如果商人们希望他们的货物能够到达绿洲王国以外的更大市场，那么该地区几乎所有的贸易都必须经过这个王国。"
 shunga_heritage:0 "巽伽传承"
 shunga_heritage_desc:0 "巽伽王朝的创始人大将军布舍耶密多背叛并杀死了他的君主，最后一位孔雀王朝的罗阇。巽伽政变被视为孔雀王朝无法承受的灾难；帝国崩溃，其核心领土被巽伽王朝所统治。任何阻挡他们的人都会遭遇同样的命运。"
 siculia_heritage:0 "被遗忘母系制传承"
 siculia_heritage_desc:0 "西库利人是西西里三大本土意大利部族中最大的一支，也是西西里之名的来源。由于岛屿沿岸众多希腊殖民地的影响，西库利人迅速融入希腊-罗马文化。然而，他们进入希腊文化圈远早于希腊殖民时代，因为已有证据显示青铜时代的迈锡尼人与此地发生过冲突。荷马在《奥德赛》中谈到西凯尔人土地时，或许知道这一点。他们最初掌握西西里全境，但当来自卡尔基斯和其他人口过剩城市的希腊人到来时，他们的命运便交给了偶然。多利亚人与许多希腊群体一样，并未与他们保持良好关系，而是把他们从有利港口赶入荒野内陆。他们独特的文化很快消失，包括曾支配许多部落的母系习俗传统。"
 sidon_heritage:0 "西顿传承"
 sidon_heritage_desc:0 "西顿可能是所有腓尼基城市中最古老的一个，它发现自己陷入了从古埃及法老到亚历山大大帝等无数帝国的历史中。当它在这些危险的争权夺利的漩涡航行时，它继续生产无数奢侈品出售给整个地中海，甚至派遣自己的人去寻找推罗——这既是它最大的成就，也是它在未来数年最大的对手。"
 siluria_heritage:0 "部落之根的传承"
 siluria_heritage_desc:0 "西卢里亚是一个松散的联盟，或者可能只是一个非常大的部落，他们是生活在现代威尔士地区的布立吞族群，以其凶猛、强大和好战著称。他们精通游击战术和不对称作战，这与地中海强国的大规模阵型作战截然不同。这些人的外貌有类高卢或西班牙的凯尔特人，拥有深色卷发和较深的肤色，与不列颠北部红发部落有别。\n有些人实际上认为这些人及其邻近部落最初来自伊比利亚海岸。他们的名字源自凯尔特语中的‘种子’或‘族群’，这可能为维持他们的部落结构提供了统一元素，强调了家族和血缘关系。利韦尔迪斯科德（Llanvair Discoed）的山堡遗址尽管并非他们实际的首都，但也曾是他们的权力中心。此地有着可追溯到新石器时期的古老传统，包括一系列立石，但凯尔特人的山丘堡垒建于公元前4世纪。有些学者认为这个堡垒就是传说中的亚瑟王宫廷所在地凯利威格（卡美洛）。"
 sindi_heritage:0 "辛迪卡传承"
 sindi_heritage_desc:0 "这个国家通常被认为是各迈俄提亚部落的统治部落，最初位于辛梅里亚‑博斯普鲁斯海峡的一侧，与博斯普鲁斯的潘蒂卡帕伊恩遥遥相对，后来被博斯普鲁斯的入侵和吞并所击退。 他们的一位国王赫卡泰厄斯听从博斯普鲁斯大君萨提罗斯的建议，囚禁了自己的妻子并娶了新的妻子，从而引发了一场大战。 这一被视为背叛的行为在统治家族和他们所统领的部落之间造成了裂痕。"
 sinope_heritage:0 "奥托吕科斯传承"
 sinope_heritage_desc:0 "与红土颜料“sinopia”的同名，锡诺佩殖民地的血统可以追溯到米利都殖民者和传说中的奥托吕科斯，阿尔戈英雄耶逊和漂泊的奥德修斯的祖父。作为一个殖民地，它拓展了建立在好客之海的海岸的殖民地，在许多希腊城市、前哨站和贸易站之间建立了贸易中心。"
 sipontum_heritage:0 "狄俄墨得斯之子狄俄墨得斯的传承"
 sipontum_heritage_desc:0 "狄俄墨得斯因建造此港而闻名——然而此狄俄墨得斯并非特洛伊战争中战斗的那位，而是其子，由他与达乌尼亚国王之女所生。该城虽为希腊殖民地，却被伊阿皮吉人和伊利里亚人环伺。它甚至一度落入萨莫奈人之手，直到公元前355年，亚历山大大帝的叔叔伊庇鲁斯的亚历山大将其收复。这座城市被众多部落包围，因此极度依赖贸易。他们向周围星罗棋布的伊利里亚诸部族出售希腊制造和进口的货物，无论是在意大利本土，还是横跨亚得里亚海对岸的伊利里亚。尽管他们与对岸其他希腊殖民地有血脉之亲，但随着罗马崛起，意大利的局势迅速变化，他们必须时刻应对这些变化带来的挑战。"
 siracian_heritage:0 "西拉基亚传承"
 siracian_heritage_desc:0 "西拉西亚人被一些人称为最希腊化的萨尔马特部落，他们迁徙到库班河谷下游地区，然后成为贸易和文化交流的中心，将亚洲的思想带到黑海，再带到希腊世界--他们复原的衣物上仍然覆盖着黄金和珠宝，显示出他们的巨大财富。 他们因参与（后来的）博斯普鲁斯内战，支持欧梅洛斯对抗萨提罗斯和普里塔尼斯而闻名。"
 sogdian_heritage:0 "粟特传承"
 sogdian_heritage_desc:0 "粟特人是多次迁徙与融合的产物——来自伊朗草原的游牧部落与青铜时代繁荣的巴克特里亚-马尔吉亚纳文明后裔的结合。他们曾被阿契美尼德王朝征服，可能受治于巴克特里亚总督领，却始终保持着草原民族与生俱来的尚武精神，并在阿尔塔薛西斯统治衰弱时重获自由。这些既是战士又是商人的族群，通过撒马尔罕等贸易枢纽开辟了丝绸之路的雏形。而在陷入继业者战争前，他们土地上最后的辉煌时刻，是令亚历山大军中所有希腊士兵惊叹的索格底亚岩要塞之战。  "
 solymia_heritage:0 "索吕弥亚的传承"
 solymia_heritage_desc:0 "它的名气可以追溯到《伊利亚特》，它是亚历山大在与波斯人的战争中为数不多的未能征服的城市之一。忒耳墨索斯是通往潘菲利亚的一个关键隘口上的一座要塞城市，既有严密的防御，也易于管理。据推测，这座城市是由传说中的吕基亚的索吕弥亚人建立的，该城市的民众以自己的名字命名，继承了富有传说的遗产。"
 sophene_heritage:0 "索菲尼传承"
 sophene_heritage_desc:0 "由奥隆提德王朝一个旁支统治的索菲尼王国位于被称为“大亚美尼亚”的最西部。坐落在安纳托利亚、反陶罗斯和陶罗斯山脉之间。位于亚美尼亚、安纳托利亚、美索不达米亚和逐渐衰老的伊朗世界之间的交汇处，索菲尼非常国际化，帝国阿拉姆语用于政府事务，而亚美尼亚语则在大部分崇拜伊朗教派的居民中普遍使用。它一直是亚美尼亚和西方权力贪婪的军阀的目标，自此卷入边界冲突中。"
 soqotra_heritage:0 "极乐岛传承"
 soqotra_heritage_desc:0 "被季风与狂暴海浪环绕的索科特拉岛，被希腊人称为‘双子神之岛’。这里的自然环境独特而神秘，拥有许多特有物种，例如龙血树，其树液因其药用价值而备受追捧。该岛不仅是没药的重要贸易中心，也是令旅人惊叹的奇境。来自希腊、帕尔米拉、阿拉伯、巴克特里亚与埃塞俄比亚的商人纷纷前来，被其自然美景与丰富资源所震撼。它是东西方商人交汇之地，极大地推动了印度与地中海之间的跨海贸易。除没药、乳香与树胶、芦荟外，龟甲也极为珍贵，甚至龟腹的壳厚到可以制成桌面。尽管资源丰富，岛上人口却稀少，需依赖从外地进口粮食与葡萄酒来供养为数不多的居民。"
 spartan_heritage:0 "斯巴达传承"
 spartan_heritage_desc:0 "斯巴达曾是希腊世界的主导强权，如今仍承载着少有人敢质疑的古老尚武遗产。"
 spartocid_heritage:0 "斯巴托科斯传承"
 spartocid_heritage_desc:0 "博斯普鲁斯王国是海外殖民地所能达到高度的一个榜样。强大的斯巴托科斯王朝联合了刻耳索涅索斯人的贸易站，在野心和背叛上可以与东方的希腊化国王相媲美。"
 stymphalia_heritage:0 "斯廷法利亚鸟群的传承"
 stymphalia_heritage_desc:0 "赫拉克勒斯来到此地，是为了杀死斯廷法利亚鸟，完成他十二功业中的第六项。这些食人鸟栖居在斯廷法利亚沼泽中，以躲避狼群；每只鸟都有青铜喙和锋利的金属羽毛。在赫拉克勒斯袭击中幸存的鸟逃往阿瑞提亚斯岛避难。有人说这些鸟根本不是鸟，而是城中斯廷法洛斯王与奥尔尼斯的年轻女儿，赫拉克勒斯因她们不肯款待他而将她们杀死。因此，赫拉克勒斯之母、牛眼的赫拉在这座城市中以少女、主妇和寡妇三种形态受到崇敬。不过，布劳龙的阿耳忒弥斯才是该城主神，这一崇拜也为同一祭仪的雅典人所共享。"
 subartu_heritage:0 "北美索不达米亚集市传承"
 subartu_heritage_desc:0 "苏巴尔图王国位于美索不达米亚北部底格里斯河沿岸的某处，靠近凡湖和乌拉尔人的土地。 美索不达米亚和埃及领导人的来往信件都提到这里是黄金、奴隶和奢侈品的目的地。 虽然苏巴里人最终落入了古代米坦尼王国的统治和影响之下，但他们仍保留着提格里特人的传统，并将这条富饶的水道作为促进自身发展和生存的一种手段，即使在米坦尼人被征服和衰落的过程中也是如此。"
 suionian_heritage:0 "苏伊俄尼亚传承"
 suionian_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 sumpa_heritage:0 "羌的传承"
 sumpa_heritage_desc:0 "中国人称逊巴居民为羌人，他们是公元前两千年商朝的主要对手。羌族位于西藏东北部地区，他们不仅是中原王朝的敌人，也是塔里木盆地王国眼中的掠夺者，有时还是侵略者。\n虽然生活条件艰苦，但逊巴人有很多机会从邻国的弱小中获益。"
 syracusan_heritage:0 "叙拉古传承"
 syracusan_heritage_desc:0 "叙拉古是希腊人在西部数个古老的殖民地之一，其作为一个地区势力长袖善舞，在种种场合都能和其他意大利、腓尼基、希腊势力平起平坐。岁月流逝，罗马、伊特鲁里亚、迦太基的力量水涨船高，叙拉古不得不进一步将自己武装起来。"
 syrakousian_heritage:0 "叙拉古传承"
 syrakousian_heritage_desc:0 "叙拉古城曾是叙拉古人享有盛名的首都，这座城市中驻扎了多股雇佣军，这使得这座城市成为一个军事化的区域。"
 taexalia_heritage:0 "泰克萨利部落的传承"
 taexalia_heritage_desc:0 "泰克萨利是喀里多尼亚的部落之一，可能就是日后被称为“皮克特人”的族群，他们栖居于卡莱多尼亚地区最北端的东海岸。据记载，他们与其他同族部落相似，将首都或政治中心设在俯瞰大海的易守难攻的岬角之上——即泰克萨隆岬。除这处主要聚居地外，他们还散居于海岸线及山间狭窄山谷中的零星村落与聚居点。"
 taguang_heritage:0 "骠国正统传承"
 taguang_heritage_desc:0 "一些人认为太公王朝是缅甸的第一王朝，太公的王朝传奇在许多南方骠人的邻居的起源故事中有所涉及。有些持续的传言甚至声称太公是由释迦族建立的，这为他们的佛教欢迎态度提供了可信度。然而，这些可能只是与藏缅语族人民的迁徙历史相关的社会记忆，他们很早以前就从高原下来到北方，并在蒲育城邦的南北走廊中定居。太公的遗迹正如其所说，提供了来自骠人范畴外的影响的证据，将太公作为外部世界和过去进入骠人生活的门户或入口。"
 tanagra_heritage:0 "希腊人的传承"
 tanagra_heritage_desc:0 "这座古老的玻奥提亚城邦坐落于阿索波斯河肥沃的河岸上。古代作家认为此地便是荷马所述的“格赖亚”，玻奥提亚的格赖科伊人的故乡——“Graecus”（拉丁语中的“希腊人”）一词正源于此。然而，该市的最初居民据称是与底比斯卡德摩斯一同前来的腓尼基人。至少在特洛伊战争时期，该城已有希腊面貌，其英雄波曼德罗斯曾代表其参战。有人说波曼德罗斯在此建城或复建，并以自身命名——波曼德里亚。这一名称也可能与该地诸多草原相关，营造出一片和平之景——然而这片和平无法长存。因靠近雅典，该地卷入数场战争，包括斯巴达与雅典之间著名的伯罗奔尼撒战争。坦那格拉之地曾两度成为战场，虽有战略性胜利，但终究败于战火，其肥沃的土地被占、被掠并沦为军队角力之地。或许这段经历正象征着希腊的共同命运，并反映了其名称的真实内涵。尽管如此，正如希腊文化的本性，坦那格拉小雕像依旧展现出那时代真实男女老少的动人形象，供后人缅怀与效仿。"
 tarentine_heritage:0 "塔林敦传承"
 tarentine_heritage_desc:0 "塔林敦成立时还只是斯巴达在大希腊的殖民地，在附近地区也不常有很多朋友。然而，随着时间推移，这座城市却以其技艺出众的轻骑兵闻名于世，并且成为一个在附近地区有影响力的势力。"
 tarrha_heritage:0 "阿波罗崇拜传承"
 tarrha_heritage_desc:0 "塔拉位于克里特海和萨马利亚峡谷之间，是古典时期的建城。该城也是最早崇拜阿波罗的城镇之一。阿波罗·塔拉依奥斯的神像庙在此受到崇敬，使得这里不仅是克里特岛上的重要祭祀中心，也是希腊世界的重要场所，因为阿波罗是奥林匹斯最古老、最受珍视且最令人生畏的神之一。海岸外有一座高多斯岛，干燥、岩石多且人烟稀少，可能是荷马及古人所称的奥吉吉亚岛，那是海妖卡吕普索的居所。岛上定居可追溯至新石器时代，历史悠久，关于荒凉神秘无人问津的岛屿流传着许多传闻……"
 tasm_heritage:0 "内志传承"
 tasm_heritage_desc:0 "塔斯姆部落坐落在阿拉伯奈季德高原地区农业发达的海尔季绿洲地带，被视为一个古老而受人尊敬的部落，他们在自己的植物家园中安居乐业，时刻准备着向沙漠和尘土飞扬的丘陵中的不幸部落伸出援助之手。塔斯姆人有能力养活更多的人口，并将他们的农产品销往国外，他们也是一个更富裕的部落，掌握着半岛的核心权力。他们是阿拉伯城市化程度较高的民族，在溪流沿岸建立了密集的定居点。有时，这些人与南部定居在萨巴的阿拉伯人有亲缘关系，并有政治意愿支持该王国对抗敌人。"
 taulantia_heritage:0 "陶兰提亚传承"
 taulantia_heritage_desc:0 "陶兰提亚人在外交和征服方面有着丰富的历史。他们常常与希腊人交战，有时也帮助他们。最近，格劳基亚斯帮助皮洛士恢复王位，对抗马其顿的卡山德。所有这些战斗导致农民数量减少。"
 taungthaman_heritage:0 "盐商传承"
 taungthaman_heritage_desc:0 "堂塔曼人依赖哈林周边矿区提供的盐，并将死者葬在村庄的内部。他们在不确定时期保护自己的家园，保持独立，但依赖外来的输入才能维持生活方式，因为新移民不断涌入萨蒙山谷。"
 taurinia_heritage:0 "牛族的传承"
 taurinia_heritage_desc:0 "陶里尼族源于凯尔特语‘陶罗斯’，意为‘牛’，是居住在帕都斯河流域的凯尔特-利古里亚混合部落。\n难以断定他们是凯尔特族侵占古利古里亚土地，还是利古里亚部落凯尔特化，或是凯尔特部落受利古里亚影响。"
 tegea_heritage:0 "致命错误的传承"
 tegea_heritage_desc:0 "提盖亚是古阿卡迪亚最古老且最强大的城市之一，由统治全阿卡迪亚的国王吕卡翁之子提盖特斯建立。提盖特斯和其城曾遭遇悲剧：其子雷蒙因惧怕阿波罗的愤怒而杀死兄弟斯凯弗鲁斯，后又被阿耳忒弥斯射杀。其余子孙逃往克里特，建立新城。提盖特斯为哀悼子女，创设祭祀斯凯弗鲁斯的仪式，阿波罗阿基耶斯节期间由阿耳忒弥斯女祭司驱赶年轻男子，犹如阿耳忒弥斯追逐雷蒙。此后，提盖亚与强大的斯巴达保持特殊关系，提盖军队随拉科尼亚人征战，政权则独立。随着时间推移，这种紧张关系时有波动，提盖亚有时选择战争以保自身安全。"
 teutonic_heritage:0 "条顿传承"
 teutonic_heritage_desc:0 "有时洪水泛滥或收成不好，就需要从辛布里亚半岛迁徙到更青翠的牧场。这些地方以前的居民可能会被赶走，因此确保尽可能多的人，甚至是妇女，都能参加战斗，对部落的生存至关重要。"
 theban_heritage:0 "忒拜传承"
 theban_heritage_desc:0 "忒拜一度是希腊地区的军事领袖和霸权主宰，却被亚历山大“伟大者”碾碎。但马其顿的卡山德重建了这座城市，并邀请忒拜的流亡者们在玻奥提亚的旧家园重建社稷。忒拜人渴望重拾埃帕米农达的传承，现已已整装待发。"
 thrace_heritage:0 "吕西马科斯传承"
 thrace_heritage_desc:0 "作为亚历山大的一位军官和贴身护卫，吕西马科斯一直是位能力出众的将军。但他是作为一位国家建设者和外交家为色雷斯带来持续至今的传承，尽管资源匮乏，却能在继业者战争中获得胜利并攫取最大利益。"
 thuria_heritage:0 "重建的传承"
 thuria_heritage_desc:0 "图里殖民地由雅典人及附近锡巴里斯城的人于公元前443年建立。那里有纪念马格尼亚的菲洛克忒特斯的碑及其箭矢，当地人相信他参与了选址。该地被邻近的克罗同毁灭58年，直至公元前452年，来自锡巴里斯的流亡者在一位不知名的帖撒利人的领导下重新建立此城。城市快速繁荣，令克罗同及周边希腊人与蛮族嫉妒，频繁遭遇驱逐与重建。希罗多德、雄辩家里西阿斯及智者普罗塔戈拉斯均曾参与殖民，后者受伯里克利委托制定法律，类似西洛克里人的扎卢库斯。此城最初建于名为“图里亚”的泉水旁，故名。此后该城繁荣，频繁卷入意大利希腊城邦间的战争。"
 thyssagetia_heritage:0 "孤独游牧民传承"
 thyssagetia_heritage_desc:0 "提萨革泰人与他们的邻居被一片广袤、荒芜的土地从多个方向隔开，当他们的邻居想到他们时，他们几乎生活在神话的世界里。\n\n作为一个讲伊朗语的部落，其很可能是萨尔玛提亚人的后裔，他们季节性地沿着名为提萨革提亚的河流放牧马匹。"
 tibulatia_heritage:0 "科尔西亚传承"
 tibulatia_heritage_desc:0 "隆戈内斯人居住在撒丁岛最北端，据说他们与科西嘉岛名称的由来——科西人的亲缘最为接近。他们定居在隆戈内斯镇周边，这处战略要地位于岛屿最北端附近，既能掌控塔佛洛斯海峡的交通要道，又能肉眼眺望科西嘉岛南岸。正因如此，隆戈内塞人成为天赋优渥的商旅民族，性情温和好客，却也时刻准备在必要时拔剑相向。他们的领地向南延伸，囊括东北部的山谷与险峻山岭——这片地形足以抵御任何企图偷袭的敌人。"
 tieion_heritage:0 "腓勒泰洛斯传承"
 tieion_heritage_desc:0 "提厄翁殖民地建立于公元前7世纪，是菲莱泰罗斯和珀加蒙王朝的诞生地。他一生都是一名太监（据说是一群人压碎了他的生殖器），在继业者战争期间，他在安提柯、吕西马科斯和塞琉古手下服役，之后在珀加蒙独立，建立了阿塔利得斯王朝的统治。"
 tomis_heritage:0 "英雄来访者的传承"
 tomis_heritage_desc:0 "托米斯约建立于公元前600年，是小斯基泰地区，也就是现代罗马尼亚海岸，最古老且持续有人居住的定居区。有人说这座城市本身由马萨格泰女王托米丽司在战胜波斯居鲁士大帝后建立；也有人说这个港口是伊阿宋和阿尔戈英雄同伴夺取金羊毛归来时曾访问的地方。托米斯与达契亚人、色雷斯人和盖塔人群体贸易，把葡萄酒和奢侈品运往内陆。出于北方贸易目的，拜占庭曾希望该城成为附庸，但伊斯特罗斯和卡拉提斯击退了拜占庭远征。"
 trapezan_heritage:0 "特拉佩祖斯传承"
 trapezan_heritage_desc:0 "特剌珀组斯是一个由米利都商人于公元前756年左右建立的锡诺佩殖民地，是一个文化熔炉，最初是几个高加索部落的家园，是从攸克辛海（黑海）到阿契美尼德帝国和整个东部的贸易门户。在他奋力逃离安纳托利亚过程中，色诺芬在他的《长征记》中记录了他和他的10000名雇佣兵“因特剌珀组斯人为我们提供了一个市场，我们得以购买给养，作为对他们对我们的尊敬和对军队的热情款待的回报，我们同样尊重地对待他们；如果有野蛮人是他们的朋友，我们就不会对付他们，而面对他们的敌人，他们自己会带领我们尽我们所能攻击他们”（5.5.14）。"
 trinovantia_heritage:0 "充满活力的新特洛伊传承"
 trinovantia_heritage_desc:0 "特里诺万提部落位于泰姆萨斯河畔，这条河也被称为“黑暗之河”。他们的名字则或许意为“精力充沛之民”。因掌控着肥沃且易于通航的河域，加之毗邻南部从事大规模贸易的文明部落，特里诺万提人曾被视为不列颠诸部落中最强大的存在。\n同样，他们的文化与大陆上的贝尔盖部落有着相似之处，后者是凯尔特人中最勇猛的部落之一。他们厌恶被征服和羞辱，因此在社会和政治层面上很容易激起愤怒。有些人甚至相信他们的部落起源于地中海的古伊利昂——布鲁图斯来到不列颠并在特里诺万图姆定居，创建了一个“新特洛伊”。如果这是真的，那么他们在逆境中自给自足并对抗顽强军队的传统由来已久。"
 troizen_heritage:0 "忒修斯传承的传承"
 troizen_heritage_desc:0 "传说中，皮透斯——坦塔罗斯之孙裴洛普斯最虔诚的儿子，同时也是忒修斯的祖父与导师——将萨罗尼克湾沿岸的姐妹城镇希佩瑞亚与安忒亚合并，建立了特罗伊曾。这座新城的名字取自他已故的兄弟。而在此地，忒修斯由埃特拉所生，并于少年时期掀起巨石，取出其父埃勾斯留置其下的剑与凉鞋，证明了自身的血统与力量。然而荣耀之城也不乏悲剧与耻辱。在城内，克里特王后费德拉爱上了其继子希波吕托斯，最终在城郊酿成其之死。为纪念此悲剧，特罗伊曾的少女在出嫁前会剪下一缕头发献予这位蒙冤而死的青年。也许这座城市唯一未染悲剧之处，便是那座古老的泉眼——据说是天马珀伽索斯落地时以翅膀击地所生。"
 tsang_heritage:0 "藏的传承"
 tsang_heritage_desc:0 "臧是西藏山区中心地带的一部分，与世隔绝，地形崎岖，生活方式也与世隔绝，地形是一道高大、冰冷的屏障，抵御着外界的干扰，同时也是一个牢笼，将这里的居民关在里面。 那里的人们信奉苯教，但也慢慢接受了佛教传统，佛教最终在该地区站稳了脚跟。 这里为数不多的城镇，如首府中卫，给人的印象是一个有序、平衡的社会，街道规划如棋盘。 多么惬意、宁静、祥和的生活啊！愿它长久。"
 tylosian_heritage:0 "堤洛斯传承"
 tylosian_heritage_desc:0 "堤洛斯是东阿拉伯沿海的一个岛屿。该岛以棉花产品闻名，产品远销印度宫廷，甚至阿拉伯沙漠的另一端。"
 tyndaria_heritage:0 "廷达瑞亚德的传承"
 tyndaria_heritage_desc:0 "廷达里斯坐落于俯瞰提雷尼亚海的显著山丘上，是西西里岛上最后建立的新希腊城镇之一，尽管其地理位置优越且易守难攻。这里由伯罗奔尼撒的墨西尼亚流亡者建立，他们因伯罗奔尼撒战争后斯巴达人穷追不舍而被迫渡海逃亡。流亡者心怀欣慰，故以本土神祇“廷达瑞亚德”（著名的狄俄斯库里兄弟的别称）命名此城。该城奉行开放政策，居民迅速增加，成为该地区重要城市。从高处望去，廷达瑞亚人能眺望利帕里群岛及那里防御伊特鲁里亚海盗入侵的克尼多斯殖民地。"
 tyragetae_heritage:0 "岛民部族传承"
 tyragetae_heritage_desc:0 "堤耳革泰是盖塔的一个亚部族，因居住在提拉斯河沿岸而得名。堤耳革泰经常与他们类似的部落邻居以及黑海西海岸的希腊城市和帝国发生关系。值得注意的是，他们在泰拉斯河沿岸的一个岛屿上拥有重要的势力，一个中心定居点或要塞。"
 tyras_heritage:0 "提拉斯传承"
 tyras_heritage_desc:0 "公元前600年左右由米利都建立的提拉斯及其姊妹城尼科尼翁位于通航的提拉斯河口，与卡尔皮和堤耳革泰部落为邻。斯基泰人王族的王（如斯基勒斯）的对这些城镇拥有权力和影响力，因为在尼科尼翁发现的钱币上铸有这些半游牧王族的肖像和名字。"
 umbria_heritage:0 "大雷暴的传承"
 umbria_heritage_desc:0 "作为一个可辨识的定居民族，翁布里亚人的形成可追溯至公元前9至4世纪，他们使用翁布里亚语，其语族和地区也以此得名。虽有古代学者认为他们源自高卢，但也有观点认为翁布里亚人可能是意大利诸族中最古老的，称为翁布里伊人，意为‘雷暴之人’，因他们幸存于淹没世界的大洪水之中——若属实，则翁布里亚人与希腊的丢卡利翁同样幸存，因此和希腊人一样古老。\n在其政治结构中，有两位重要人物负责监督仪式及公务，称为‘乌赫图尔’的职务成员。像其他意大利民族一样，翁布里亚人通过贸易和希腊移民吸收了希腊文化元素。尽管多次与邻近的伊特鲁里亚人开战，他们也极为欢迎伊特鲁里亚的商品和挥霍宴饮的宴会文化。"
 usdia_heritage:0 "乌斯迪亚部落的传承"
 usdia_heritage_desc:0 "乌斯迪亚部落生活在希伯尼亚南部的达布罗纳河与比尔古河流域，西邻伊维尼部落。这个部落是岛上更具力量、难以预测且传统上较为残忍的部落之一。乌斯迪亚人可能也是凯尔特族群——属于莱金人的一支，他们在公元前600年左右便来到希伯尼亚，并殖民了东南海岸。"
 vasconian_heritage:0 "瓦斯科尼亚传承"
 vasconian_heritage_desc:0 "瓦斯科尼亚人定居于比利牛斯山脉与伊比利亚山脉之间的崎岖地带。他们虽聚居在河畔平野，却随时准备在必要时退守群山。得天独厚的地理优势使其屡次抵御外族征服（及凯尔特移民的强制迁徙），完整保留了传统习俗。瓦斯科尼亚人与北部的阿基坦尼亚人渊源颇深——双方共通的巴斯克语/阿基坦语迥异于周边的高卢语和伊比利亚语系，且共同信奉诸多前印欧时期的神祇。"
 veneto_heritage:0 "热情之人的传承"
 veneto_heritage_desc:0 "尽管无法确认，但许多古代与现代学者普遍认为，“维内蒂”之民可能源自‘热情’或‘荣耀’之意。这些热情之民讲一种名为‘维内蒂语’的语言，其虽与拉丁语及其他意大利语支极为相似，但仍保留了一些日耳曼语与凯尔特语的元素。希罗多德曾困惑地记载，这些人的婚姻习俗与巴比伦人相似，他有时称他们为威尼托人，有时又称为伊利里亚人；另有传说认为，维内蒂人实为安纳托利亚人后裔，原居帕弗拉格尼亚，在特洛伊战争结束后，由特洛伊王子安提诺尔率领，西迁至亚得里亚海岸。因此，威尼提人是帕夫拉戈尼亚人与当地欧加奈部族的融合。尽管这一迁徙传说广为流传，其在希腊人中却更以马匹闻名，叙拉古僭主狄奥尼修斯一世甚至在威尼托沿海建立贸易殖民地以获取这些良驹——他尤其钟爱阿德里亚城的贸易，并协助其修建运河，以打破斯皮纳城对海上贸易的垄断。威尼提人自身也与周边其他凯尔特部族保持友好关系，维持边境和平。"
 venicnia_heritage:0 "希伯尼亚猎人的传承"
 venicnia_heritage_desc:0 "维尼克尼人生活在希伯尼亚西北部，那是一片森林密布的地区，因此他们被称为“森林的猎人”。他们与后来的费尼族以及其他以狩猎为生的部落有关，这些部落通过出售猎物和毛皮获利。广阔的森林和丘陵将他们与邻近部落隔开，使他们较为孤立。一些人认为，他们比周围的部族更加野性。"
 voluntia_heritage:0 "沃伦蒂的传承"
 voluntia_heritage_desc:0 "沃伦提人居住在后来被称为阿尔斯特的地区，那里孕育了许多阿尔斯特神话周期中的传说。他们可能也被称为乌奥伦提人，并将名字赋予了乌莱德地区。他们的名字可能意为“有胡须的人”。\n定居的沃伦提人生活在该地区的南部，围绕着拉甘河与博因河流域。考古发现表明，许多定居点中存在技艺娴熟的金属工匠——他们靠近海洋，通往不列颠的遥远海岸，这使这些工匠得以接触来自大陆凯尔特市场的贸易。"
 votadinia_heritage:0 "奥塔迪尼传承"
 votadinia_heritage_desc:0 "沃塔迪尼人居住的区域，正是后来被称为“古北境”的地区南部——当不列颠岛与欧罗巴大陆的联系中断后，该地便获得了这一称谓。沃塔迪尼人（亦称奥塔迪尼人）因此生活在地中海文化影响的边缘地带，他们正是现代威尔士传说中戈多丁人的祖先。公元前8世纪左右，凯尔特文化在此延续发展，山丘要塞王国相继形成——特拉普雷朗遗址上修建的巨型堡垒便是见证，该地历经层层埋葬仪式，早已在土地与部落民众间铸就了深厚的仪式纽带。尽管他们是根深蒂固的古老民族，当异域财富流经其疆域时，他们仍欣然接纳那些自己永远无法亲临之地的珍品——奢侈品、美酒与精工银器皆令他们沉醉。"
 weili_heritage:0 "尉犁传承"
 weili_heritage_desc:0 "以现代库尔勒地区为中心，尉犁人依靠湖中游弋的众多鲤科鱼类、掠过水面的鹭鸶和天鹅等鸟类的羽毛与肉食，以及注入湖泊的河流所创造的耕地而繁荣。因此，尉犁人及其领地是沙漠北线通道上的一片安全港，集市上常有众多旅人和商贾往来。"
 weitou_heritage:0 "尉头的传承"
 weitou_heritage_desc:0 "围头位于从现代阿克苏到喀什噶尔的夏季路线的一个关键岔口，对来自西面费尔干纳河谷的北线贸易具有战略控制作用，那里有天赐的骏马。 围头人与费尔干纳河谷及其以北的草原文化有许多共同之处，他们在高山和严酷沙漠的两侧，以中亚草原民族的方式从事低地农业。"
 weixu_heritage:0 "危须传承"
 weixu_heritage_desc:0 "位于博斯腾湖北岸的现代和硕一带，危须在焉耆面前扮演着次要角色，其可耕种的湖岸较少，北边还有一个喜怒无常的车师王国。他们还毗邻现已消失的玉尔都斯河分支（曾称Tun-hung河），该河流经危须以西、焉耆东北。由于这种更为险峻的地理位置，危须的力量有限，但他们仍能从穿越其领地的贸易中获益，这些贸易来自焉耆或更南方，向北穿过车师领地通往北方贸易的更广阔通道。"
 western_nesiotic_heritage:0 "西部群岛的传承"
 western_nesiotic_heritage_desc:0 "这些岛屿长期以来一直处于迦太基人的统治之下，并保持着强烈的商业特征。"
 wulei_heritage:0 "乌垒传承"
 wulei_heritage_desc:0 "乌垒占据着塔里木盆地沙漠北缘一个虽贫瘠但战略要冲的位置，夹在广阔的龟兹领地和现代博斯腾湖周边的诸民族之间。乌垒盛产玉石等原料，却常常隶属于外来强权，或至少发现自己处于某个势力范围之内。其领地遍布边防要塞和封锁通道的检查站。"
 wusun_heritage:0 "乌孙传承"
 wusun_heritage_desc:0 "一个半游牧的部落，其故土可追溯至祁连山脉——这条山脉是数条河流的发源地，滋养着山下的所谓河西走廊。乌孙人是月氏人在高海拔地带游牧生活中的邻居，被描述为一个奇特的民族，其中有许多绿眼睛、赤发的人，被比作猕猴。乌孙社会是世袭且分层的，引起了下层阶级的怨恨，尤其是在放牧的牧民、定居的农夫和拥有大片土地的人之间存在明显区分的情况下。"
 xi_qiemi_heritage:0 "正且弥的传承"
 xi_qiemi_heritage_desc:0 "据记载被称为“正”且弥国，是两个相邻城邦之一，也被称为更大的且弥国，西且弥位于天山山脉的于大谷中，是一个仅有数千人口的小区域。其人民分为定居的农夫和城镇居民，以及在领地外围放牧的牧民，远离东且弥人的土地。月氏、乌孙和匈奴等游牧部落联盟对谷地人民拥有巨大的政治和情感影响力，在丰收季节威胁着进犯。"
 xiaowan_heritage:0 "小宛的传承"
 xiaowan_heritage_desc:0 "小宛是塔克拉玛干南线以南的一个僻静定居点，方圆人口不过千人左右。 因此，这里的居民大多是牧民，他们松散地控制着蜿蜒于群山之间的小山谷。 由于地处交通要道之外，这里的文化比大沙漠周围的其他吐火罗聚居地更加孤立，因此不会像其邻居那样轻易地接受印度或中国的影响。"
 xihai_heritage:0 "西海传承"
 xihai_heritage_desc:0 "定居在现代吉尔吉斯湖、哈尔湖和哈尔乌苏湖之间的土地上，西海人生活在蒙古高原上水源较充足的区域，这使得他们成为强邻匈奴和月氏人羡慕的对象，这两大势力在此争夺完全的主导权。然而，尽管与这两大强权相邻使他们陷入危险，却也提供了控制最北端贸易路线的可能，并受益于邻族征服所带来的流通货物。"
 xiongnu_heritage:0 "夏后氏的传承"
 xiongnu_heritage_desc:0 "作为蒙古高原上一股崛起的势力，匈奴联盟是南方月氏人的主要对手，并主导了该地区的文化模式。他们后来被与匈人及其横跨欧亚大陆的征服联系在一起。匈奴起源于青铜时代的阿凡纳谢沃考古文化，随后在以冰冻木乃伊（包括“冰公主”）闻名的巴泽雷克文化中发展。然而，据说匈奴是传说中的淳维的后裔，而淳维的血统又可追溯至夏后氏，即大禹。位于名为雁门关之地以北，匈奴被描绘为中原定居民族的对立面，是游牧与野蛮的缩影。"
 xiru_heritage:0 "西蠕传承"
 xiru_heritage_desc:0 "西蠕牧民沿着克鲁伦河滋养的丰美草原放牧。这条生命之路流经肯特山和布尔罕合勒敦山的低坡，跨越北部更严寒的地区和南部宜居的高地，是人北上穿越这片大陆苦寒地区之前的最后一片富饶通道。西蠕人是坚韧而饱经风霜的民族，从不屈服于他们与生俱来的严酷环境。在战斗和谈判中，他们又怎会少一分冷酷与坚定呢？"
 yancai_heritage:0 "控弦十万传承"
 yancai_heritage_desc:0 "奄蔡人有时被称为“上奥尔西人”，是一个真正可怕而强大的群体。他们的敌人，包括他们四面八方的邻居，一想到“奄蔡”号称能控弦十万，就胆战心惊。在中国的记载中，他们的名声传到了遥远的东方，而西方最强大的国家也对他们最后大批地迁出草原充满了恐惧。"
 yanqi_heritage:0 "焉耆传承"
 yanqi_heritage_desc:0 "在吐火罗语中被称为Arshi，焉耆王国位于古老的流沙河（今开都河）注入现代博斯腾湖之处。这片领地的人民与邻族共享吐火罗文化的总体特征，使用吐火罗语A。其主城的名称可能与“火”的含义有关。他们在塔克拉玛干沙漠附近如此丰饶地区的富裕地位，使他们不仅能够影响湖泊区域，还能影响所谓“西域”中的许多地方定居点，将其纳为附庸或仅仅施加影响。然而，其低地位置和旅行者容易从此通往其他地区的便利，使焉耆容易受到占据山间通道的诸多游牧部落的攻击，如乌孙人。"
 yarlung_heritage:0 "雅砻的传承"
 yarlung_heritage_desc:0 "雅砻王朝作为一个前藏族帝国或王国，人们对其知之甚少，只知道他们非常凶猛。 雅鲁藏布江谷地中富饶的山间低地和独特的果园支撑着当地的王朝，果园中盛产苹果和梨。 这个山谷是通往印度和其他山居王国的重要贸易路线枢纽。"
 yaudheya_heritage:0 "刹帝利勇士的传承"
 yaudheya_heritage_desc:0 "作为一个从衰落的俱卢王国中崛起的强大族群，药地耶人最早出现在古典时代梵语语言学家帕尼尼的语法著作《阿施塔德雅义》和《伽纳帕塔》中。 他们最重要的人物和社会价值观都依赖于吠陀思想中的刹帝利，因此他们是一个强大的武士社会，他们的名字甚至来源于“武士”一词。 作为征服者，他们巩固了俱卢的旧有土地，并夺取了宝罗伐人的土地，然后在孔雀王朝的进攻下争取独立。"
 yemeni_heritage:0 "也门传承"
 yemeni_heritage_desc:0 "我们的祖先已经为我们展示前进的道路。"
 yuezhi_heritage:0 "月氏传承"
 yuezhi_heritage_desc:0 "月氏是公元前一千年在干旱的草原上形成的游牧民族联盟，是平原地区部落自东向西流动的重要组成部分，是压力迁移模式的一部分。他们的名字由“月”与“氏”组成，给人一种独特的区别，也暗示了他们的性格。虽然他们是给中原等定居国家制造政治和军事问题的重要力量，但他们也以协助玉石东传以及自己饲养和训练的军马而闻名。\n当他们还是居无定所的游牧民族时，他们用这些稀有物品换取丝绸和其他奢侈品，自己使用，并沿着后来的丝绸之路向西运送。他们的艺术品既反映了斯基泰-萨尔马特草原传统的动物图案，又在某些动物的描绘风格上体现了中国的影响。\n虽然他们据说可以拥有一支超过十万人的部落军队，但他们在天山以北的势力一直受到其他强大联盟（如匈奴）的威胁和牵制。"
 yumi_heritage:0 "扜弥的传承"
 yumi_heritage_desc:0 "尤米的领地有时也被称为汉米，从古代凯里亚的贸易城镇向南一直延伸到乌米和被称为塔格（Tagh）的地下通道，塔格沿着凯里亚河一直延伸到与奇拉河的连接处。 绿洲和河流既是耕种的场所，也是沿沙漠边界和山区进行贸易的通道。 有的人是玉匠，有的人使用丰富的玉髓，有的人则用在隐蔽处发现的黄金矿藏塑造造型。 由于翻山越岭的贸易往来，玉米人在某些方面借鉴了印度犍陀罗地区的文化，墙上的壁画描绘的是希腊佛教。 不过，与邻近的于阗一样，他们也吸收了波斯人和中国人的文化元素，并保留了自己的吐火罗习俗。"
 ywa_htin_kon_heritage:0 "约哈廷昆的传承"
 ywa_htin_kon_heritage_desc:0 "这些人能够从他们的土地中提取财富，无论是田野中的，还是岩石中的，最终他们受益匪浅——聚集的玛瑙、石英和青铜在他们手中；他们的人民能够享用大量由农业生产的稻米。与邻居相比，他们生活富裕，能够将财富戴在手镯和脚镯上，用青铜铃铛装饰他们的村庄。他们能够承受随着北方人到来而带来的文化变革，甚至从增多的劳动力中获益。"
 zalmoxian_heritage:0 "扎尔莫克西斯传承"
 zalmoxian_heritage_desc:0 "扎尔莫克西斯是盖塔人和达契亚人的一位古老的神，目前大多不为人知。他的出身可能是希腊奴隶或伟大的国王。但不可否认的是，他的人民随时准备改变在希腊世界北方的地位。"
 zanthia_heritage:0 "赞提传承"
 zanthia_heritage_desc:0 "赞提人（或称桑提人）是生活在里海大草原上的众多大益部落之一，他们是在据说由马萨格泰人（Massagetae）掀起的早期斯基泰部落迁徙浪潮之后出现的。赞提人游荡在海边的帕尔尼人以东、定居在奥克苏斯河和咸海南部周围的花剌子模人以西的沙漠草原上，是一个小部落群体，他们的部族处于帕尔尼人和城市人之间，帕尔尼人的权力和地位日益增长，即将建立阿尔萨息王朝，而城市人则以其深远的防御工事而闻名。"
 zealot_heritage:0 "热情派的传承"
 zealot_heritage_desc:0 "狂热者是犹地亚激进派，主张结束外族统治。其特别激进的分支——西卡里派，以藏匕首的方式进行政治暗杀而闻名，这些匕首被隐藏在斗篷下，行刺后便消失在民众中，他们也像强盗一样袭击那些被认为支持外族统治的旅行者。"
 zhangzhung_heritage:0 "琼隆银城的传承"
 zhangzhung_heritage_desc:0 "至少在公元前五世纪，长期居住在青藏高原西部的古老居民——象雄人的文化就已经建立了牢固的基础，他们由三个地区组成，即上象雄、中象雄和下象雄。他们的文化产生于该地区佛教皈依之前，马其顿帝国灭亡后，他们主要信奉苯教，但与南方的吠陀部落保持着密切联系；他们的首都琼隆既是苯教寺院所在地，也是苯波魔法师的聚会场所，还被视为吠陀神迦楼罗的宫殿。"
 zygia_heritage:0 "齐吉亚传承"
 zygia_heritage_desc:0 "齐吉部落被记述为残忍的海盗和土匪，后来成为游牧的牧羊人。据说，他们的船只最适合这种做法。"

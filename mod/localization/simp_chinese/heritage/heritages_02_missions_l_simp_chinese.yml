l_simp_chinese:
 achaemenid_heritage:0 "阿契美尼德传承"
 achaemenid_heritage_desc:0 "在亚历山大征服之前，阿契美尼德帝国是历史上最大的帝国。统治着众多不同民族和信仰的它，其统治者对外国人采取了宽容的态度，允许大多数人继续无所畏惧地实践自己的宗教和习俗。"
 alexander_heritage:0 "亚历山大的传承"
 alexander_heritage_desc:0 "我们已经获得了足够的权力和合法性，可以宣称自己是亚历山大遗产的继承人，我们的家族与阿吉德家族有着血缘关系，我们将继续他的梦想，建立一个从马其顿到巴克特里亚的希腊帝国。"
 attalid_heritage:0 "阿塔利得斯的传承"
 attalid_heritage_desc:0 "提厄翁的阿塔罗斯诸子在亚历山大和安提柯的宫廷中声名鹊起，并最终建立了伟大的亚细亚王国珀加蒙——以其图书馆和强烈的独立性闻名于世。"
 bosporan_league_heritage:0 "博斯普鲁斯联盟的传承"
 bosporan_league_heritage_desc:0 "尤辛努斯地区北部海岸的国家联合起来，在希腊世界和未知的野蛮人之间建立了一个统一的最后防线。每个城市都因拥有庞大的农田而蓬勃发展，但他们的工作是吃力不讨好的。大多数希腊人认为他们自己太野蛮了，与部落混居的时间太长了。"
 corinthian_heritage:0 "科林斯的传承"
 corinthian_heritage_desc:0 "直到近年，科林斯一直是希腊最大的城邦之一。它位于富庶的阿提卡与伯罗奔尼撒之间，占据极具防御优势的位置，因此发挥着重要作用。马其顿征服之后，它失去了自身独立，只剩下作为马其顿军队在南方的设防据点而存在。"
 decapolian_heritage:0 "得卡波利斯的传承"
 decapolian_heritage_desc:0 "得卡波利斯的十个大城市经常彼此结盟抵抗南方的犹地亚侵略者，现在他们终于结成了同盟。"
 epikrateia_heritage:0 "厄庇克拉忒亚的传承"
 epikrateia_heritage_desc:0 "西西里人民长久以来一直处于迦太基的保护之下，因为他们面临着屈服于叙拉古的希腊僭主的危险。终于他们联合在一起组成了真正的国家，而不仅是为了保护各个城邦而组成的脆弱防御同盟。"
 hebrew_egypt_heritage:0 "米兹利的传承"
 hebrew_egypt_heritage_desc:0 "米兹拉伊姆是希伯来语中埃及的名字。自从征服埃及后，希伯来人中出现了一个新的阶层。作为埃及的主人，米兹拉伊姆人统治着一片富饶的土地。然而，这是一片分裂的土地。希伯来人并没有善待他们曾经的压迫者。随着奴隶制的扩张和对人民的残酷剥削，人们对自由的渴望与日俱增——如果不加以控制，这种渴望可能会带来危险。"
 hellenized_barbarian_heritage:0 "希腊化蛮族的传承"
 hellenized_barbarian_heritage_desc:0 "当闪电从云层中冲出，刺向地面时，雷声隆隆，但这群人并不害怕，因为他们都看到奥林匹斯山的主人被激怒了，向他的所有敌人发射了闪电，而他们已经不再了。虽然他们从没有真正走进古老的希腊神庙，在没有祭司注视的情况下被接纳，但他们现在是希腊世界复杂而相互关联的网络的一部分。"
 istrian_league_heritage:0 "伊斯特里亚联盟的传承"
 istrian_league_heritage_desc:0 "希罗多德和许多其他人曾经认为伊斯特河贯穿整个欧洲，将尤辛努斯地区与西部无尽之海上连接起来。不幸的是，这与事实相去甚远，但伊斯特河作为通往内部的部落土地的贸易路线的重要性不容低估。然而，并不是每个部落都特别友好——他们是野蛮人，尤辛努斯地区西部的希腊城市必须为任何情况做好准备。"
 lazi_heritage:0 "拉兹传承"
 lazi_heritage_desc:0 "拉兹（或拉兹人）是一个讲卡特维尔语的混合族群，是居住在东部黑海沿岸的高加索居民，随着时间的推移，他们向南迁移并回到北方。他们的人口被分成莫辛诺伊奇、马克罗尼、马雷斯和其他部落的分支。他们的许多神话都与科尔基斯和改变科尔基斯土地的伊阿宋和阿耳戈英雄的远航紧密相关。他们像苏阿尼部落一样勇猛，像阿巴斯戈伊一样迅捷，是令人畏惧的战士。"
 mauryan_abandoned_heritage:0 "颓败的孔雀"
 mauryan_abandoned_heritage_desc:0 "孔雀帝国失去了伟大的月护王旃陀罗笈多和阿育王阿输迦，他们建立的帝国进入了一段衰退的时期。"
 mauryan_revival_heritage:0 "孔雀王朝复兴"
 mauryan_revival_heritage_desc:0 "阿育王死后，我们的国家陷入了巨大的衰落。然而，这种衰弱并没有阻止我们。我们竭尽全力，再次取得了伟大的成就！"
 mithridatic_heritage:0 "米特里达梯的传承"
 mithridatic_heritage_desc:0 "波斯裔米特里达梯家族一直统治着密西亚城市基奥斯，直到米特里达梯二世遇刺，迫使他的继承人在帕夫拉戈尼亚建立新王国；这个王国最终成为小亚细亚北部的区域强权。"
 pontic_league_heritage:0 "本都联盟的传承"
 pontic_league_heritage_desc:0 "本都殖民地在远离其母城的地方过着艰难的生活。他们中的许多人与最伟大、最多元化的帝国接壤，允许各行各业的公民进入他们蓬勃发展的露天集市——这使他们成为一个强大而包容的群体，他们也需要在博斯普鲁斯海峡保持强大的存在感，以稳定贸易路线。尽管这使他们成为了一个各国人的梦想，但他们的第一批公民在自己的城市里就像外国人一样感到失落。"
 religious_enclave_heritage:0 "宗教国家"
 religious_enclave_heritage_desc:0 "这个国家由一座大神庙的祭司集团建立。直到今天，他们仍崇敬前人的古老传统，即使有人会说，随着时间推移，他们的统治已经越来越关注世俗世界。"
 rizan_heritage:0 "里齐奥斯的传承"
 rizan_heritage_desc:0 "里齐亚因位于安纳托利亚北部山坡下的阴影中而闻名。这个小港镇位于里齐奥斯河口，因此得名。建在一小片土地上，这个地方的定居能力有限，但它很好地保护了外部威胁，可以依靠河岸周围丰富的冲积土壤。那里的人们在黑海上交易他们能够交换的东西，同时种植他们缺少的作物。"
 suani_heritage:0 "苏阿尼传承"
 suani_heritage_desc:0 "山地工匠苏阿尼人（斯万人）是一个更为孤立的卡特维尔语族群，以其创新的设计、工艺和在血仇追求中的残忍著称，血仇通过正式决斗和非正式的夜间谋杀在家族之间流传。与他们的许多邻居不同，他们尊重女性的权利和权威。"
 telephis_heritage:0 "勒乌科特亚人民的传承"
 telephis_heritage_desc:0 "大约在公元前8世纪首次城市化，瓦尼/泰勒菲斯/勒乌科特亚的遗址是一个希腊要塞，是科尔基斯土地上文化交流和多样性的中心。在发西斯河沿岸，这里建有要塞和庙宇，包括奉献给阿波罗的庙宇，显示了这个地方的文明和繁荣。它拥有许多金匠作坊，由希腊人和高加索工匠共同经营，并从黑海地区进口许多罐子和陶器。"

l_simp_chinese:
 abyssinian_heritage:0 "阿比西尼亚传承"
 abyssinian_heritage_desc:0 "我们的祖先已为我们指明了前进的道路。"
 fezzani_heritage:0 "费赞的传承"
 fezzani_heritage_desc:0 "费赞部落是沙漠作战的大师，也是利比亚众多绿洲的驯服者。当他们在开阔地与训练有素的军团作战时，他们的沙漠游击作战和使用更多的机动部队对希腊人、腓尼基人和罗马人来说都是一个永恒的挑战。"
 macrobian_heritage:0 "索马里的传承"
 macrobian_heritage_desc:0 "现代索马里人民在陆战中所缺乏的东西，在海上得到了极大的弥补。他们是多产的外国货物贸易商、海盗和沿海劫掠者者，利用比那些航海技术较差的人更好的技术。他们的贸易网络从印度延伸到地中海，再延伸到非洲东海岸，使他们能够在已知的世界各地进行灵活交流。"
 tartessian_heritage:0 "塔耳忒索斯传承"
 tartessian_heritage_desc:0 "数世纪之前，塔耳忒索斯是伊比利亚最为重要的贸易和政治中心之一。当时的传承保留至今，即便主宰此地的部落大部分都已不是古塔耳忒索斯人。"

l_simp_chinese:
 interesting_histories_country_events.ara.a:0 "是时候创造历史了……"
 interesting_histories_country_events.ara.desc:0 "阿拉多斯是波斯人在黎凡特海岸建立的四个腓尼基附庸王国之一，其他三个分别是比布鲁斯、西顿和泰尔。几十年前，[GetCharacter('(int32)39').GetName]击败波斯帝国后，阿拉多斯及其他腓尼基王国落入希腊统治之下。首都位于靠近奥朗特河注入地中海处的一个岛上，为通往奥朗特河谷的商业活动提供了安全的基地。"
 interesting_histories_country_events.ara.t:0 "阿拉多斯"
 interesting_histories_country_events.arm.a:0 "是时候创造历史了……"
 interesting_histories_country_events.arm.desc:0 "当该地区被阿契美尼德帝国奠基者居鲁士大帝征服时，它成为亚美尼亚正式总督辖区的一部分。亚历山大大帝征服波斯并去世后，一名叫尼俄普托勒摩斯的马其顿将军试图控制亚美尼亚。尼俄普托勒摩斯仅两年后便死去，使此前由亚历山大任命统治该地区的亚美尼亚欧伦提德王朝登上王位。"
 interesting_histories_country_events.arm.t:0 "亚美尼亚"
 interesting_histories_country_events.ath.a:0 "是时候创造历史了……"
 interesting_histories_country_events.ath.desc:0 "在过去几十年里，马其顿对雅典事务的主导地位不断增强，最终以马其顿的腓力二世在凯罗尼亚战役中击败由雅典和底比斯领导的希腊城邦联盟告终。马其顿政治家安提帕特解散了雅典政府，建立了现行的富豪统治体系，实际上终结了雅典的独立。随着[GetCharacter('(int32)39').GetName]去世，雅典成为安提柯王国的藩属。雅典依然富裕，是该地区贸易的重要中心之一，但已不再是希腊城邦的领导者。该城以艺术、学术和哲学中心闻名，是柏拉图学院和亚里士多德逍遥学派的所在地。"
 interesting_histories_country_events.ath.t:0 "雅典"
 interesting_histories_country_events.bac.a:0 "是时候创造历史了……"
 interesting_histories_country_events.bac.desc:0 "作为塞琉古王国强大的总督辖区，巴克特里亚位于阿姆河沿岸一串肥沃绿洲上，并在兴都库什山脉以北。亚历山大大帝征服之前，巴克特里亚军队主要由骑兵组成，并以高效战士闻名。征服该地区后，亚历山大在向东推进印度时把巴克特里亚骑兵编入军队，甚至还将忠诚的巴克特里亚人纳入精锐伙伴骑兵。过去数十年间，亚历山大与塞琉古一世都将希腊定居者迁入巴克特里亚，形成了希腊化与巴克特里亚文化的多元混合。"
 interesting_histories_country_events.bac.t:0 "巴克特里亚"
 interesting_histories_country_events.boi.a:0 "是时候创造历史了……"
 interesting_histories_country_events.boi.desc:0 "玻伊是一个高卢游牧部落，因其种植知识和牧牛技术而出名，现在定居在了意大利北部。在跨过阿尔卑斯山之后，高卢的玻伊部落到达了肥沃而灌溉良好的意大利边境。与其他高卢部落一起，他们将意大利的伊特鲁里亚人向南赶出了波河流域，并将他们曾经的定居点费尔西纳占为他们的首都并且改名为博诺尼亚。"
 interesting_histories_country_events.boi.t:0 "玻伊"
 interesting_histories_country_events.bpk.a:0 "是时候创造历史了……"
 interesting_histories_country_events.bpk.desc:0 "博斯普鲁斯王国最初由米利都希腊人定居建立，数个世纪以来，这个繁荣王国已在克里米亚地区确立统治。由于法纳戈里亚城即使冬季也不会结冰，它能够全年出口小麦、鱼类和奴隶。数年前帕里萨德斯国王死后，其子萨堤罗斯与欧墨洛斯之间爆发了一场残酷继承战争，现任国王欧墨洛斯最终在塔提斯河之战击败了他的弟弟。随着繁荣与不受约束的扩张，博斯普鲁斯王国正遭受当地游牧部落日益猛烈的攻击。"
 interesting_histories_country_events.bpk.t:0 "博斯普鲁斯王国"
 interesting_histories_country_events.bri.a:0 "是时候创造历史了……"
 interesting_histories_country_events.bri.desc:0 "作为不列颠领土最大的部族，布里甘蒂亚由众多子部族组成，如约克郡海岸的加布兰托维凯斯部族，以及南泰恩河上游谷地的特克斯托韦尔迪部族。这里的地形包括苔原、沼泽和森林，栖息着欧亚棕熊、野猪、狼、鹿和鹰等野生动物。布里甘提亚诸部族崇拜布里甘蒂亚女神，凯尔特语意为“至高者”。这位女神通常被描绘为戴冠的守护神，胸前饰有蛇发女妖的头颅，手持长矛和胜利之球。"
 interesting_histories_country_events.bri.t:0 "布里甘蒂亚"
 interesting_histories_country_events.byb.a:0 "是时候创造历史了……"
 interesting_histories_country_events.byb.desc:0 "比布鲁斯是波斯人在黎凡特海岸建立的四个腓尼基附庸王国之一，其他三个分别是阿拉多斯、西顿和泰尔。几十年前，[GetCharacter('(int32)39').GetName]击败波斯帝国后，比布鲁斯及其他腓尼基王国落入希腊统治之下。该城市以陶瓷、玻璃和紫色染料产业闻名，其港口设有用于储存从叙利亚、波斯和印度进口商品的仓库。经济繁荣促进了建筑和城市发展的复兴。"
 interesting_histories_country_events.byb.t:0 "彼布罗斯"
 interesting_histories_country_events.byz.a:0 "是时候创造历史了……"
 interesting_histories_country_events.byz.desc:0 "拜占庭是在希腊扩张的早期，由城邦麦加拉的殖民者所定居的。传说描述，有一个叫做拜占斯的人，带领着麦加拉的殖民者团体，在德尔斐得到阿波罗的神谕后定居于此。在希波战争时，拜占庭被占领奴役了整整三十四年，才被斯巴达将军保撒尼阿斯带领的希腊军队所解放。因其同时拥有亚欧之间陆路交通和黑海到地中海的海上航线的区位优势，而作为繁荣的贸易城市享受着相对来说和平且稳定的发展。"
 interesting_histories_country_events.byz.t:0 "拜占庭"
 interesting_histories_country_events.cal.a:0 "是时候创造历史了……"
 interesting_histories_country_events.cal.desc:0 "喀里多尼亚是一个讲布立吞语、居住在人烟稀少的中央高地的部落联盟。这个地区山脉延绵，淡水湖散落其中。如同不列颠的众多凯尔特部落一般，他们定居与耕种于山丘之上，他们建造的石制山堡大多呈圆形，并在其中构建木墙与沟渠作为圆形木屋的第二道防线。"
 interesting_histories_country_events.cal.t:0 "喀里多尼亚"
 interesting_histories_country_events.epo.a:0 "是时候创造历史了"
 interesting_histories_country_events.epo.desc:0 "二百五十年前，来自福西亚的希腊殖民者在弗卢维亚河口的小岛上建立了恩波里翁。尽管承受着来自迦太基的强大压力，该城市设法维系了其独立的希腊化特色。恩波里翁和伊比利亚土著部落的政治和商业共识已经持续了多年。随着迦太基日益强大，而本地的部落也变得更有组织化，恩波里翁通过与附近希腊城邦赫墨洛斯科珀翁与马叙利亚签订共同防御条约来增强存在。 "
 interesting_histories_country_events.epo.t:0 "恩波里翁"
 interesting_histories_country_events.hcp.a:0 "是时候创造历史了……"
 interesting_histories_country_events.hcp.desc:0 "由希腊城邦麦加拉于两个多世纪前建立，本都的赫拉克利亚现在由女王阿玛丝特丽丝、波斯阿契美尼德王朝的最后一位后裔所统治。本都的赫拉克利亚因其肥沃的土地和天然港口的海洋渔业中繁荣起来，很快将其控制范围扩展到了周围的几个城市。"
 interesting_histories_country_events.hcp.t:0 "本都的赫拉克利亚"
 interesting_histories_country_events.hmk.a:0 "是时候创造历史了"
 interesting_histories_country_events.hmk.desc:0 "[ROOT.GetCountry.GetName]，在希腊与中意为#E “瞭望塔”#!，最初是马赛利亚希腊人在这一优越位置建立的贸易港。\n\n附近的铁矿和其在伊比利亚海岸的战略位置，使其已经发展成为了一个小而繁荣的城邦。\n\n然而，#E 希腊人#!和#E 腓尼基让#!在地中海西部商贸利益纠纷持续不断，使人担心我们的孤立处境——尤其是与其他马赛利亚殖民地相比——会让我们成为众矢之的。"
 interesting_histories_country_events.hmk.t:0 "赫墨洛斯科珀翁"
 interesting_histories_country_events.ice.a:0 "是时候创造历史了……"
 interesting_histories_country_events.ice.desc:0 "伊刻尼亚部落，其名源于流经其土地的伊刻河，因其骑术与冶炼工艺而闻名，战车不仅是战场上常用的利器，也是部落中权力的象征。战士们会先在移动的战车上投掷标枪，再下车步行战斗，最后再返回战车重整。他们生活在由大型圆形农舍组成的农舍中，高高的茅草屋顶可以吸收室内火灾产生的热量和烟雾。从经济上来说，他们是农民，耕种分割成小块的小麦或大麦田，并放牧绵羊等家畜。 "
 interesting_histories_country_events.ice.t:0 "伊刻尼亚"
 interesting_histories_country_events.jud.a:0 "是时候创造历史了……"
 interesting_histories_country_events.jud.desc:0 "犹地亚直到最近还是波斯阿契美尼德帝国的一个省份，虽然名义上独立，由犹太总督统治。几十年前在[GetCharacter('(int32)39').GetName]征服之后，犹地亚沦为希腊化帝国的统治下。如今国家再次处于险境，[GetCharacter('(int32)39').GetPraenomen]的将军们为争夺帝国的部分地区权力而角逐不休。"
 interesting_histories_country_events.jud.t:0 "犹地亚"
 interesting_histories_country_events.kno.a:0 "是时候创造历史了……"
 interesting_histories_country_events.kno.desc:0 "在希腊神话中，克里特国王米诺斯在克诺索斯建造了一处带有迷宫的宫殿，以囚禁其牛首人身、被称为米诺陶的儿子。在米诺斯人的衰落后，克里特被来自大陆的希腊人所定居，而克诺索斯成长为岛上最重要的城市之一。该城邦有两处港口：阿穆尼索斯和赫拉克里翁。克诺索斯最近经常与西部较小的城邦吕克图斯发生冲突，致使吕克图斯人向大陆上的斯巴达人求援。"
 interesting_histories_country_events.kno.t:0 "克诺索斯"
 interesting_histories_country_events.ksh.a:0 "是时候创造历史了……"
 interesting_histories_country_events.ksh.desc:0 "几千年前，只是小城邦的科尔玛成为中尼罗河流域的一支主导政治力量，并最终成长为强大的库施王国。由于与北方的埃及敌对，首都迁往南方的麦罗埃，那里有丰富的铁矿石和用于炼铁的硬木。除黄金，象牙和奴隶外，优质铁产品也用于和该地区的国家贸易。麦罗埃现在是政府与王宫所在地，首都发展蓬勃，有很多计划的建筑项目。例如新的皇家陵墓，使用独特的库施金字塔设计，用最优质的的花岗岩和砂石建造。 "
 interesting_histories_country_events.ksh.t:0 "库施"
 interesting_histories_country_events.mas.a:0 "是时候创造历史了"
 interesting_histories_country_events.mas.desc:0 "马塞利亚由自从三百余年前由福西亚人在此建立之后，逐渐成为了具有超过四万人口的著名主要贸易港口。其因出口上等葡萄酒、腌猪肉和鱼，熏香与医用植物，珊瑚和软木而出名。它在俯瞰港口的山顶上有一座大型的德尔斐阿波罗神庙，而在城市的另一端有一座以弗所阿耳忒弥斯神庙。马赛利亚不仅是西方的希腊诸城之首，也是高卢的文明中心，然而这一地位正受到南方日益强大的迦太基和罗马的威胁。"
 interesting_histories_country_events.mas.t:0 "马赛利亚"
 interesting_histories_country_events.mna.a:0 "是时候创造历史了……"
 interesting_histories_country_events.mna.desc:0 "几个世纪前，凯尔特人将炼铁的知识带到了不列颠群岛。铁远胜于土著居民的青铜时代武器，既坚固又耐用。在几个世纪的过程中，他们征服了当地居民，使盖尔成为了岛上的主导文化。盖尔部落马纳庇亚定居在了爱尔兰东部海岸，那里持续不断的部落战争为每个人都提供了一个提高社会地位的机会。"
 interesting_histories_country_events.mna.t:0 "马纳庇亚"
 interesting_histories_country_events.mry.a:0 "是时候创造历史了……"
 interesting_histories_country_events.mry.desc:0 "由旃陀罗笈多·摩揭陀王朝仅在数十年前建立，摩揭陀帝国已开始统治印度次大陆。在[GetCharacter('(int32)39').GetName]去世引发的权力真空后，旃陀罗笈多发动了一系列战役，收复印度境内希腊人控制的土地。希腊将军尤德摩斯掌控着[GetCharacter('(int32)39').GetPraenomen]的印度北部领土，旃陀罗笈多策划了一场叛乱，驱逐了希腊总督，现已将印度河流域纳入其统治。位于西方的庞大希腊塞琉古帝国的国王塞琉古斯正在寻求从摩揭陀夺回这些领土。"
 interesting_histories_country_events.mry.t:0 "孔雀王朝"
 interesting_histories_country_events.mst.a:0 "是时候创造历史了……"
 interesting_histories_country_events.mst.desc:0 "墨涅斯忒起初是希腊城邦马赛利亚的一处殖民地，坐落于瓜达霍斯河口的小岛上。或多或少便于抵御伊比利亚土著部落和腓尼基竞争者定居点。居民生产咸鱼和各种鱼露，然后到城市的露天市集上售卖，或者出口到整个地中海。"
 interesting_histories_country_events.mst.t:0 "墨涅斯忒"
 interesting_histories_country_events.myl.a:0 "是时候创造历史了……"
 interesting_histories_country_events.myl.desc:0 "摩叙隆是红海沿岸一座重要的邦特贸易港，没药、香料、黄金、乌木、牲畜、象牙与乳香从这里远销至埃及和美索不达米亚。它控制着许多从印度港口而来的肉桂贸易，并以拥有世界上最佳品种的这种香料而闻名。它还从古埃及进口玻璃器皿，从底奥斯波利斯进口葡萄，并为柏培拉市场进口布匹。"
 interesting_histories_country_events.myl.t:0 "摩叙隆"
 interesting_histories_country_events.nnt.a:0 "是时候创造历史了……"
 interesting_histories_country_events.nnt.desc:0 "数个世纪以来，斯堪的纳维亚的气候日益恶化，变得更寒冷、更潮湿，迫使许多日耳曼部落南下进入欧洲大陆。留下的人住在长屋中，有时聚成村落，并在冬季把牛、山羊和马等牲畜养在室内。定居点往往集中在海边，那里鱼类和贝类是丰富的食物来源。斯堪的纳维亚建造的船只由长桨推进，较大的船只载着商人南下，与大陆诸国交易皮革与琥珀。斯堪的纳维亚部落能否团结起来，对抗南方日耳曼部落日益增长的力量？"
 interesting_histories_country_events.nnt.t:0 "斯堪的亚部落"
 interesting_histories_country_events.par.a:0 "是时候创造历史了……"
 interesting_histories_country_events.par.desc:0 "亚历山大大帝死后，在巴比伦分封中，帕提亚成为南方庞大塞琉古王国的一个总督辖区。尽管处于希腊化统治之下，帕提亚大体上仍属伊朗文化，这引发了民众不安。当地大部分土地崎岖且海拔较高，气候更加严酷，而斯基泰部落则居住在北方黑海沿岸的草原上。"
 interesting_histories_country_events.par.t:0 "帕提亚"
 interesting_histories_country_events.phi.a:0 "是时候创造历史了……"
 interesting_histories_country_events.phi.desc:0 "数个世纪前，来自米利都的希腊定居者在黑海东畔建立了发西斯城，因为黑海——印度的贸易路线经过于此，这里变得繁荣起来，大量来自印度的货物通过里海的水路和陆路运输而来。而地区本身盛产黄金、铁、木材和蜂蜜，这些商品主要出口到其他希腊城邦。"
 interesting_histories_country_events.phi.t:0 "发西斯"
 interesting_histories_country_events.pnd.a:0 "是时候创造历史了……"
 interesting_histories_country_events.pnd.desc:0 "般帝耶王朝是泰米尔三冕王之一，另外两个是朱罗和掣罗。般帝耶的首都摩菟来，以神圣的‘摩偷罗’（北印度名城，大黑天信仰发源地）为名，以表明这座城市受印度神湿婆所钟爱，是泰米尔人最重要的文化中心。这里也是著名的泰米尔桑迦姆的发源地，汇集了来自许多国家的智者和诗人。胡椒，珍珠，象牙，纺织品和黄金出口到西方，直至欧洲，而进口的奢侈品由繁荣的富裕阶层享用。随着南部各邦之间相互争夺主导地位，北部日益壮大的超级大国会为全印度带来和平与启示吗？"
 interesting_histories_country_events.pnd.t:0 "般帝耶"
 interesting_histories_country_events.rho.a:0 "是时候创造历史了……"
 interesting_histories_country_events.rho.desc:0 "罗得岛是一个财阀共和制国家，长期与其他帝国保持中立条约，以保护其遍布爱琴海的贸易网络。18年前，[GetCharacter('(int32)39').GetName]去世后，罗得岛与[GetCharacter('(int32)39').GetPraenomen]在埃及的将军[GetCharacter('(int32)42').GetName]建立了牢固的商业和文化联系。这些联系最终导致安提柯王国的巴西琉斯[GetCharacter('(int32)37').GetName]派遣其子[GetCharacter('(int32)38').GetName]对罗得岛发动围攻。\n\n[GetCharacter('(int32)38').GetName]率领数万士兵和数百艘舰船，发动了将近一年的围城战。安提柯军队建造了一座前所未见的攻城塔，高达130英尺，仅移动该攻城塔就需3600多名士兵。经过数月的激烈战斗，双方都付出了惨重代价，最终敌军突破了城外防墙。\n\n作为最后的抵抗，罗得岛人民匆忙建造了第二道城墙，即现今所知的罗得卫城。正是在这座卫城内，罗得岛人民英勇抵御并击退了多次安提柯军的正面进攻。几周前，[GetCharacter('(int32)38').GetName]终于接到[GetCharacter('(int32)37').GetName]的命令，停止围攻。如今，罗得岛人民获得了胜利。然而，长达一年的围城战严重摧毁了这座曾经繁荣的岛屿，恢复昔日辉煌还需付出巨大努力。"
 interesting_histories_country_events.rho.t:0 "罗得斯"
 interesting_histories_country_events.sid.a:0 "是时候创造历史了……"
 interesting_histories_country_events.sid.desc:0 "西顿是波斯人在黎凡特海岸建立的四个腓尼基附庸王国之一，其他三个分别是阿拉多斯、比布鲁斯和泰尔。几十年前，[GetCharacter('(int32)39').GetName]击败波斯帝国后，西顿及其他腓尼基王国落入希腊统治之下。该城市如今享有相对自治权，甚至举办竞技比赛，邀请该地区最优秀的运动员参加。"
 interesting_histories_country_events.sid.t:0 "西顿"
 interesting_histories_country_events.spa.a:0 "是时候创造历史了……"
 interesting_histories_country_events.spa.desc:0 "昔日荣光早已逝去。仅仅就在几十年前，在麦加罗波利斯之战中，一支有两万两千人的斯巴达军队为四万马其顿军队所击败。斯巴达国王亚基斯三世，身受重伤并且无法站立，他命令他的部下离他而去，独留自己来面对强大的马其顿军队，给军队争取撤退的时间。斯巴达在西有美塞尼亚、东北有阿耳戈斯的威胁下处于弱势，我们需要重拾斯巴达往日的荣光，终结掉我们附近的对手们，并且对抗北方崛起的马其顿。"
 interesting_histories_country_events.spa.t:0 "斯巴达"
 interesting_histories_country_events.syr.a:0 "是时候创造历史了……"
 interesting_histories_country_events.syr.desc:0 "以富庶着称的叙拉古，其殖民者大部分来自科林斯和泰涅亚。经过数个世纪，这小小的殖民地成长为了地中海最强大的希腊城邦之一，在整个岛屿上建立其自己的城市。叙拉古的势力使其不可避免的与西方当时统治着布匿诸城的迦太基展开了冲突。随着另一份和平协议，最后一次毁灭性的战争在数年前结束，却无法阻止叙拉古的政治被强大的迦太基所干涉。持续的战争和内部动乱已经极大地削弱了其在岛屿上的势力。"
 interesting_histories_country_events.syr.t:0 "叙拉古"
 interesting_histories_country_events.the.a:0 "是时候创造历史了……"
 interesting_histories_country_events.the.desc:0 "三十年前，马其顿的亚历山大大帝在忒拜试图反抗马其顿占领后，将这座城市焚为平地。数千人在战斗中被杀或随后被处决，妇女和儿童则被奴役。亚历山大的继承者卡山德为了争取善意和希腊盟友，在雅典、墨伽洛波利斯和美塞尼的大力贡献下开始重建忒拜。如今，防御城墙已经重建，城内各处的恢复工作仍在进行，忒拜流亡者重新定居于此，希望它能再次恢复昔日显赫地位。"
 interesting_histories_country_events.the.t:0 "忒拜"
 interesting_histories_country_events.umb.a:0 "是时候创造历史了……"
 interesting_histories_country_events.umb.desc:0 "伊特鲁里亚人在过去的几个世纪里从西海岸一路入侵，将翁布里亚人赶上了亚平宁的高地。现在残存的翁布里亚村落与城镇都分布在亚平宁易守难攻的山上。随着南方崛起一个新的强权，我们的老对手开始重新考虑过去的敌对政策。"
 interesting_histories_country_events.umb.t:0 "翁布里亚"
 interesting_histories_country_events.vnt.a:0 "是时候创造历史了……"
 interesting_histories_country_events.vnt.desc:0 "维涅托人生活在多洛米蒂山脉与亚德里亚海之间，他们生活的地区充斥着河流、沼泽与沿海的岛屿。他们是出色的育马者，培养希腊世界最强壮最迅捷的马匹。阿尔蒂诺是来自遥远波罗的海的琥珀之路上的一个繁华贸易中心，这条贸易路线将琥珀向南运送到地中海。一年前斯巴达王子克利奥尼穆斯率领舰队试图劫掠繁荣的维涅托定居点，但维涅托人奋起反击，摧毁了斯巴达人的船只。维涅托人一直以来与高卢部落不断发生冲突，这些高卢部落已经占据了意大利人曾经的定居点。维涅托必须迅速寻找盟友，并且粉碎未来所有的入侵。"
 interesting_histories_country_events.vnt.t:0 "维涅托"
 interesting_histories_country_events.vvt.a:0 "是时候创造历史了……"
 interesting_histories_country_events.vvt.desc:0 "维斯图拉维内蒂部落定居在维斯杜拉河东，他们在那里肥沃而平整的土地上种植和畜牧。利润丰厚的琥珀和毛皮贸易促进了它们的经济发展。几千年来，琥珀一直被商人从波罗的海沿岸沿着琥珀之路运到亚得里亚海，从那里一直运到埃及和叙利亚。对于战争，维内蒂人喜欢快速的轻步兵，使用长矛或铁剑与木盾进行战斗。漫游的蛮族是维内蒂人的重大威胁，他们在沿北部和东部边境突袭维内蒂人的领土。维内蒂部落能否团结起来，对抗维斯图拉河西面日益壮大的日耳曼部落？"
 interesting_histories_country_events.vvt.t:0 "维斯图拉维内蒂部落"
 stupid_ass_tooltip:0 "#G 阿育王登上王位后，一棵独特的使命树将可用#!"

l_simp_chinese:
 assumption_st_mary:0 "你向天后圣玛利亚献上最高崇敬。"
 canonization_st_andrew:0 "你崇敬先驱圣安德鲁"
 canonization_st_cornelius_centurion:0 "你崇敬百夫长圣科尔乃略"
 canonization_st_james_zebedee:0 "你崇敬伟大者圣雅各"
 canonization_st_john:0 "你崇敬启示者圣约翰"
 canonization_st_joseph:0 "你崇敬养父圣若瑟"
 canonization_st_luke_evangelist:0 "你崇敬布道者圣路加"
 canonization_st_mark:0 "你崇敬布道者圣玛尔克"
 canonization_st_matthew_levi:0 "你崇敬使徒圣马太"
 canonization_st_nathanael_bartholomew:0 "你崇敬使徒圣纳撒内尔"
 canonization_st_paul:0 "你崇敬塔尔索的圣保罗"
 canonization_st_peter:0 "你尊崇第一任教皇圣彼得。"
 canonization_st_philip:0 "你尊崇使徒圣菲利普"
 canonization_st_thomas:0 "你崇敬使徒圣托马斯"
 te_saints.1.a:0 "圣安德鲁，为我们祈祷！"
 te_saints.1.desc:0 "安德鲁是拿撒勒人耶稣的门徒西门彼得的哥哥。安德鲁起初是施洗者圣约翰的门徒，后来施洗者派他去跟随耶稣。安德鲁鼓励他的兄弟西门加入他们，告诉他他们已经找到了弥赛亚。这就是安德鲁被誉为第一个被召者的原因；（Πρωτόκλητος）。安德鲁在伊庇鲁斯、卡帕多西亚、斯基泰、色雷斯、马其顿和亚该亚传教。他从安纳托利亚东部到格鲁吉亚西部传教。在一次对基督徒的迫害中，安德鲁成为殉道者，被钉在一个X形的十字架上，这就是著名的圣安德鲁十字架。"
 te_saints.1.t:0 "普罗托克雷托斯的安德鲁"
 te_saints.10.a:0 "万福童贞圣母玛利亚，为我们祈祷！"
 te_saints.10.desc:0 "拿撒勒的玛利亚是耶稣的母亲。玛利亚被誉为受祝福的圣女和上帝之母，她与丈夫若瑟和其他亲戚住在加利利的拿撒勒村。派遣给她的天使加百列向她许诺将生下一个儿子，即以色列人所期待的弥赛亚和上帝之子。天使的讲话（“你这蒙恩的，主与你同在”）将玛利亚置于救赎故事的中心。她问天使应该怎样做，因为她从来没有亲密地“认识”一个人。在回答时，天使告诉她，她将通过圣灵受孕。在她的尘世生活结束时，玛利亚的身体和灵魂被带到天堂的荣耀之中。"
 te_saints.10.t:0 "万福童贞圣母玛利亚"
 te_saints.11.a:0 "圣路加，为我们祈祷！"
 te_saints.11.desc:0 "布道者路加是《新约》中《路加福音》和《使徒行传》的作者。路加偶尔被视为耶稣基督派来的七十名门徒之一。他是圣保罗的合作者，并被称为与使徒约翰的一些旅程里陪同的医生。路加大约在公元63年以84岁的年龄作为底比斯的主教去世，但他是否也遭受了殉道的痛苦还不确定。"
 te_saints.11.t:0 "布道者路加"
 te_saints.12.a:0 "圣雅各，为我们祈祷！"
 te_saints.12.desc:0 "伟大者雅各（意为“长老”）是耶稣基督的十二个使徒之一，是世界上最著名的基督教圣徒之一。雅各与他的兄弟约翰一起，与安得烈和西门彼得一起，是第一批被称为门徒的人之一。当耶稣对以利亚和摩西说话时，雅各与彼得和约翰一起在变容山，在客西马尼园，他目睹了耶稣在受难前的痛苦。雅各和约翰从耶稣那里得到了“Boanerges”的亚拉姆语绰号，意思是雷霆之子，因为他们性情急躁。复活后，雅各与其他使徒一起在耶路撒冷。在希律阿格里帕一世统治整个犹太地区期间（公元41—44年），他被用剑处决。"
 te_saints.12.t:0 "雅各“长老”西庇太"
 te_saints.13.a:0 "圣彼得，为我们祈祷！"
 te_saints.13.desc:0 "西门彼得，安德鲁的兄弟，是拿撒勒人耶稣——弥赛亚或基督——呼唤的跟随他的第一批犹太人之一。西门是门徒或使徒的发言人，第一个忏悔者，但也在审判中否认了耶稣。根据基督教经文，耶稣用一个特别的承诺回答了西门的认主，“你是彼得[Greek, petros]并在此石[petra]上，我要把我的教会[ekklesia]建立在这磐石上，地狱[hades]的力量[pylai, literally gates]就不能压倒了”。彼得是复活的主的目击者，也是耶路撒冷早期教会的领袖之一。彼得是罗马的第一任主教，基督让彼得和罗马的继任主教优先成为所有基督徒的领袖、教师和法官。因此，教宗们也被称为“彼得的继承人”。"
 te_saints.13.t:0 "西门彼得，使徒的领袖"
 te_saints.14.a:0 "圣玛尔克，为我们祈祷！"
 te_saints.14.desc:0 "约翰·玛尔克是昔兰尼加人，据说他是迦拿婚礼上倒出耶稣变酒的水的仆人之一。约翰·玛尔克是拿撒勒人耶稣的七十个门徒之一，在耶稣死后在他的家里接待了门徒们。一个传统认为，复活的耶稣基督来到了玛尔克的家里，圣灵在五旬节降临到门徒身上，也是在这所房子里。在耶稣升天后约19年，福音书作者玛尔克与十二使徒的领袖西门彼得一起旅行并撰写了一本福音书后，他来到亚历山大城，在那里建立了一个教会，这是非洲的第一个教会。该城的异教徒对他努力使亚历山大城的人脱离对其传统神灵的崇拜表示不满。公元68年，他们把绳子套在他的脖子上，在街上拖着他，直到他死去。"
 te_saints.14.t:0 "圣玛尔克，布道者"
 te_saints.2.a:0 "圣托马斯，为我们祈祷！"
 te_saints.2.desc:0 "使徒托马斯是十二个使徒之一，他们作为朋友和学生陪伴耶稣三年。托马斯在印度和周边地区建立了教会，远至中国，传播复活者的福音。托马斯怀疑拿撒勒人耶稣的复活，直到他根据使徒们的见证，亲自看到并触摸到复活的基督。因此，他被戏称为“怀疑者”。托马斯在马拉巴尔海岸建立了最早的七个基督教社区，并在对面科罗曼德海岸的梅拉普尔（Mailapur）殉教而死。"
 te_saints.2.t:0 "托马斯“怀疑者”双胞"
 te_saints.3.a:0 "圣保罗，为我们祈祷！"
 te_saints.3.desc:0 "塔尔索的扫罗是一位成功的早期基督教传教士和最早的基督教神学家之一。作为一个受过希腊教育的犹太人和具有罗马公民身份的守法的法利赛人，扫罗——也被称为保罗——最初迫害耶稣基督的追随者，除了他信主时的出现，他从未见过这些人。然而，自从他信主以来，他就把自己看作是上帝召唤的、为人民传播福音的使徒。因此，他宣扬复活的耶稣基督，特别是对非犹太人或“外邦人”。为了做到这一点，他前往地中海东部，在那里建立了几个基督教社区。他通过他的信件与他们保持联系，这些信件作为书信保存在基督教经文中。"
 te_saints.3.t:0 "塔尔索的扫罗"
 te_saints.4.a:0 "圣约翰，为我们祈祷！"
 te_saints.4.desc:0 "约翰，西庇太的儿子、雅各的兄弟是耶稣基督的门徒，在基督教传统中被认为是《约翰福音》中耶稣的“最喜爱的门徒”。传统上认为他是第四本福音书的作者。由于他的福音书具有崇高的神学意义，他也被传统地称为神学家约翰。约翰被流放到拔摩岛，在那里他得到了关于教会命运的神秘异象，他把它写成了《启示录》或《启示录》。"
 te_saints.4.t:0 "启示者约翰"
 te_saints.5.a:0 "圣菲力普，为我们祈祷！"
 te_saints.5.desc:0 "菲力普是耶稣的十二门徒之一。他与安德鲁一起在黑海周围地区和希拉波利斯（小亚细亚）传教。他在乌克兰的斯基泰死于殉道者之手。"
 te_saints.5.t:0 "伯赛大的菲力普"
 te_saints.6.a:0 "圣巴塞洛缪，为我们祈祷！"
 te_saints.6.desc:0 "巴塞洛缪是耶稣的门徒，也是前三本福音书的使徒名单中提到的十二个使徒之一。他在约翰福音中被称为拿但业。他的全名可能是纳撒内尔·巴·托尔梅。可以假设纳塔纳埃尔·巴·托尔梅是一名抄写员或抄写员学生。"
 te_saints.6.t:0 "纳塔纳埃尔·巴尔·托尔梅"
 te_saints.7.a:0 "圣玛窦，为我们祈祷！"
 te_saints.7.desc:0 "玛窦是拿撒勒人耶稣的门徒，被列为十二个使徒之一。玛窦是拿撒勒人耶稣的门徒，被列为十二个使徒之一。使徒玛窦被认定为《新约》四部福音书中第一部的作者，这就是为什么他也被尊称为福音书作者。为了声援使徒和前税吏玛窦，其他福音书作者会使用部落名字列维而不是玛窦。"
 te_saints.7.t:0 "玛窦·列维"
 te_saints.8.a:0 "圣科尔乃略，为我们祈祷！"
 te_saints.8.desc:0 "百夫长科尔乃略是凯撒利亚马里提马的一位罗马百夫长。他被认为是最早接受基督教洗礼的非犹太人之一。根据圣经故事，他遇到了一位天使，天使让他把使徒西门彼得带过来，听他传话。使徒西门彼得也在异象中确信，救赎的信息也适用于外邦人。在此之前，他一直认为它只适用于犹太人。于是，彼得允许自己被仆人领进科尔乃略的家。科尔乃略在彼得面前跪下，但后者不允许他敬拜他。在彼得讲道的时候，圣灵落在了每一个听众身上。这种情况也发生在非犹太人身上，这对彼得和他的犹太同伴们来说是一个巨大的惊喜。然后，彼得命令科尔乃略和他的朋友及亲属接受洗礼。根据圣经的记录，科尔乃略是第一个罗马的外邦人基督徒。"
 te_saints.8.t:0 "百夫长科尔乃略"
 te_saints.9.a:0 "圣若瑟，为我们祈祷！"
 te_saints.9.desc:0 "若瑟是新郎，后来是耶稣的母亲玛利亚的丈夫。他被称为耶稣的“养父”。由于人口普查，若瑟和他的妻子不得不去他出生的城市伯利恒。耶稣出生后，他们回到了耶路撒冷，在那里的圣殿里正在举行对主的介绍。在耶稣出生后的一个不确定的时间点上，他们一家人不得不按照若瑟在梦中得到的天使的命令从伯利恒逃到埃及，因为希律王因为害怕这个预言中的新生的犹太人国王会取代他，而杀死了伯利恒的所有婴儿。后来，根据若瑟在梦中得到的神的指示，一家人搬回了巴勒斯坦，根据若瑟的决定，他们没有在伯利恒所在的犹太地区定居，而是在加利利的拿撒勒村定居，耶稣在那里长大。在耶稣出现在公众面前的几年前，若瑟在和平中死去。"
 te_saints.9.t:0 "伯利恒的若瑟"

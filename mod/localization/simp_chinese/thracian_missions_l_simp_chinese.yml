l_simp_chinese:
 TRE_fortify_the_crossings_tt:0 "未来#Y 革提亚袭击#!的频率将降低。"
 desc_me_tre_3_15_cmod:0 "通过将庞提克城市的公民身份与我们整个领域的防御联系起来，我们确保了源源不断的新兵。"
 desc_me_tre_3_4_cmod:0 "我们的统治者已经证明他们有资格与阿尔盖德王朝的活神同行。"
 desc_me_tre_3_8_cmod:0 "我们在希腊的光辉成就和我们对其城市提供的保护使我们成为其人民无可争议的英雄。"
 desc_me_tre_3_9_cmod:0 "更直接地驻军城市使我们能够进一步渗透庞提克城市的政府，这对我们有利。"
 desc_me_tre_3_cmod:0 "色雷斯将在其他继业者王国失败的地方成功统一希腊民族。"
 desc_me_tre_3_end_cmod:0 "我们实现了所有继业者的梦想；成为希腊世界无可争议的领袖。"
 me_tre_3_15_cmod:0 "$thrace_03_philhellene_15$"
 me_tre_3_4_cmod:0 "$thrace_03_philhellene_4$"
 me_tre_3_8_cmod:0 "$thrace_03_philhellene_8$"
 me_tre_3_9_cmod:0 "$thrace_03_philhellene_9$"
 me_tre_3_cmod:0 "$thrace_03_philhellene$"
 me_tre_3_end_cmod:0 "希腊领导"
 pontic_city_subject_province_tt:0 "我们在黑海西岸的庞提克城市臣属的省份([GetProvince('(int32)481').GetArea.GetName]，[GetProvince('(int32)4248').GetArea.GetName]和[GetProvince('(int32)4513').GetArea.GetName])也将获得"
 thrace_03_philhellene:0 "新的亲希腊政策"
 thrace_03_philhellene_1:0 "黑海西岸的殖民地"
 thrace_03_philhellene_10:0 "执行皇家铸币权"
 thrace_03_philhellene_10_DESC:0 "铸币是皇家特权，因此我们完全有权要求停止任何地方货币的铸造。"
 thrace_03_philhellene_10_reward_tt:0 "每个庞提克城市的臣属对@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]的意见将减少#R -25#!。"
 thrace_03_philhellene_11:0 "确保中希腊"
 thrace_03_philhellene_11_DESC:0 "长期以来，波奥提亚希腊人一直是我们对手的眼中钉，甚至是腓力二世和亚历山大的眼中钉。如果我们能说服他们我们怀有善意，他们可能会成为宝贵的盟友。"
 thrace_03_philhellene_11_claims_tt:0 "@[GetCountry('BOE').GetOverlord.GetFlag]! [GetCountry('BOE').GetOverlord.GetName]获得对@[GetCountry('BOE').GetFlag]! [GetCountry('BOE').GetName]的宣称"
 thrace_03_philhellene_11_reward_tt:0 "如果@[GetCountry('BOE').GetFlag]! [GetCountry('BOE').GetName]接受我们的提议："
 thrace_03_philhellene_11_reward_tt1:0 "@[GetCountry('BOE').GetFlag]! [GetCountry('BOE').GetName]可能会成为我们的盟友。"
 thrace_03_philhellene_12:0 "希腊同盟"
 thrace_03_philhellene_12_DESC:0 "如果希腊人自己处理事务，我们的许多麻烦都可以解决。或许，与其我们试图无处不在，不如让希腊人自行处理，通过将他们组织成一个在我们指导下的强大联盟。"
 thrace_03_philhellene_12_reward_tt:0 "每个位于[GetProvince('(int32)418').GetArea.GetRegion.GetName]大陆的和平的自由希腊国家将收到加入@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]联合希腊臣属的邀请。\n良好的关系和现有的联盟将增加接受的机会。\n现有的臣属将始终接受。"
 thrace_03_philhellene_13:0 "投资城邦"
 thrace_03_philhellene_13_DESC:0 "我们将通过大力投资于城市的发展来展示我们对希腊殖民地的支持。毕竟，它们的好运也是我们的。"
 thrace_03_philhellene_13_reward_tt:0 "每个庞提克城市的臣属对@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]的意见将增加#G +25#!。"
 thrace_03_philhellene_13_reward_tt1:0 "$pontic_city_subject_province_tt$也将获得“#Y $state_improvement_religious$#!”。"
 thrace_03_philhellene_14:0 "巩固控制"
 thrace_03_philhellene_14_DESC:0 "显然，进一步接受城邦的独立只会一再使我们自食其果。我们唯一的办法是彻底剥夺它们的自治权。"
 thrace_03_philhellene_14_reward_tt:0 "每个庞提克城市的臣属将被@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]吞并。"
 thrace_03_philhellene_15:0 "正式化自治"
 thrace_03_philhellene_15_DESC:0 "我们将签订一项正式协议，尊重希腊庞提克殖民地的自治和名义上的主权，同时也允许它们作为[GetCountry('TRE').GetAdjective]军队的一部分，为保卫自己的家园作出贡献。"
 thrace_03_philhellene_15_reward_tt:0 "每个庞提克城市的臣属对@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]的意见将增加#G +50#!。"
 thrace_03_philhellene_1_DESC:0 "黑海西岸富裕的希腊殖民地，其中一些是由曾经是希腊殖民地的城市建立的，对我们的国家健康至关重要。我们必须尽一切努力促进它们的经济增长。"
 thrace_03_philhellene_1_allow_tt:0 "@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]至少拥有[SCOPE.ScriptValue('tre_mis_3_1_target')|Y0]作为臣属的黑海西岸庞提克城市。([SCOPE.Custom('tre_mis_03_1_cus_loc')]/[SCOPE.ScriptValue('tre_mis_3_1_target')|0Y])"
 thrace_03_philhellene_1_reward_tt:0 "$pontic_city_subject_province_tt$ '#Y $state_improvement_civic$#!'."
 thrace_03_philhellene_2:0 "亲希腊的善行"
 thrace_03_philhellene_2_DESC:0 "善行，即“做好事”，是社会中富人向社区分配财富的预期做法。[ROOT.GetCountry.GetRuler.GetName]不会被[ROOT.GetCountry.GetRuler.GetHerHis]希腊臣民认真对待，除非[ROOT.GetCountry.GetRuler.GetSheHe]以身作则，花费部分[ROOT.GetCountry.GetRuler.GetHerHis]财富来改善所有希腊城邦。"
 thrace_03_philhellene_2_reward_tt:0 "每个非-$macedonian$ #Y $hellenic$#!国家在[GetProvince('(int32)418').GetArea.GetRegion.GetName]地区，排除[GetProvince('(int32)358').GetArea.GetName]和[GetProvince('(int32)476').GetArea.GetName]，将获得一部分金钱([SCOPE.ScriptValue('tre_mis_3_2_gold_svalue')|G2] @gold!)，并且#G +50#!对@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]的意见。"
 thrace_03_philhellene_3:0 "个性崇拜"
 thrace_03_philhellene_3_DESC:0 "作为追随亚历山大步伐的人，[ROOT.GetCountry.GetRuler.GetName]应像亚历山大一样被赞美和崇拜。那些最狂热崇拜[ROOT.GetCountry.GetRuler.GetFirstName]的人应该受到鼓励，并获得手段成为真正崇拜[ROOT.GetCountry.GetRuler.GetFirstName]的核心。"
 thrace_03_philhellene_4:0 "神圣的创始人"
 thrace_03_philhellene_4_DESC:0 "[GetCharacter('(int32)41').GetPraenomen]的成就仅次于亚历山大本人，他受到希腊人和马其顿人的爱戴！如果这些不是神的行为，那么是什么呢？"
 thrace_03_philhellene_4_allow_tt:0 "@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]有一个非部落的非-$macedonian$ #Y $hellenic$#!附属国。"
 thrace_03_philhellene_5:0 "雅典的恩人"
 thrace_03_philhellene_5_DESC:0 "随着我们在希腊本土的对手影响力的增长，我们最好提醒雅典人我们长期以来对他们事业的支持。再加上更多的礼物和军事援助的郑重承诺，我们可能会将他们从敌人的影响中彻底拉出来。"
 thrace_03_philhellene_5_claims_tt:0 "@[GetCountry('ATH').GetOverlord.GetFlag]! [GetCountry('ATH').GetOverlord.GetName]获得对@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName]的宣称"
 thrace_03_philhellene_5_reward_tt:0 "如果@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName]接受我们的提议："
 thrace_03_philhellene_5_reward_tt1:0 "@[GetCountry('ATH').GetFlag]! [GetCountry('ATH').GetName]可能会成为我们的盟友。"
 thrace_03_philhellene_6:0 "伯罗奔尼撒的提议"
 thrace_03_philhellene_6_DESC:0 "伯罗奔尼撒的主导力量，[GetCountry('SPA').GetName]，通过财富和承诺的谨慎运用可能会被我们说服。"
 thrace_03_philhellene_6_claims_tt:0 "@[GetCountry('SPA').GetOverlord.GetFlag]! [GetCountry('SPA').GetOverlord.GetName]获得对@[GetCountry('SPA').GetFlag]! [GetCountry('SPA').GetName]的宣称"
 thrace_03_philhellene_6_reward_tt:0 "如果@[GetCountry('SPA').GetFlag]! [GetCountry('SPA').GetName]接受我们的提议："
 thrace_03_philhellene_6_reward_tt1:0 "@[GetCountry('SPA').GetFlag]! [GetCountry('SPA').GetName]可能会成为我们的盟友。"
 thrace_03_philhellene_7:0 "容忍地方铸币"
 thrace_03_philhellene_7_DESC:0 "允许希腊殖民地自己铸币将大大展示我们的尊重，同时也增强它们发展城市的能力。"
 thrace_03_philhellene_7_reward_tt:0 "$me_thrace_3_new_philhellene_policy.72.at$\n$thrace_03_philhellene_13_reward_tt$"
 thrace_03_philhellene_7_reward_tt1:0 "$pontic_city_subject_province_tt$也将获得“#Y $state_improvement_oratory$#!”。"
 thrace_03_philhellene_8:0 "希腊的冠军"
 thrace_03_philhellene_8_DESC:0 "凭借我们的成就和我们对抗敌人持续支持希腊人的努力，我们可能会理所当然地称自己为“所有希腊人的冠军”。"
 thrace_03_philhellene_9:0 "驻军城邦"
 thrace_03_philhellene_9_DESC:0 "必须劝阻希腊殖民地未来的不忠行为，如果必要，可以用武力。我们将在每个城市驻扎一支强大的部队，及时制止任何叛乱企图。"
 thrace_03_philhellene_9_reward_tt:0 "每个庞提克城市的臣属对@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]的意见将减少#R -50#!。"
 thrace_03_philhellene_BUTTON_TOOLTIP:0 "马其顿人长期以来一直坚持他们优于希腊人，结果我们面对的是一次又一次的希腊臣民叛乱。对待希腊人的新路径，即使不视为平等，至少也要作为有价值和受尊重的人民，可能会带来更好的结果。"
 thrace_03_philhellene_CRITERIA_DESCRIPTION:0 "处理黑海西岸希腊殖民地的不忠问题，通过赢得希腊人的心灵来扩展色雷斯在希腊腹地的影响力。"
 thrace_03_philhellene_DESCRIPTION:0 "我们嘲弄和边缘化希腊人，把他们当作二等公民的方式只会滋生怨恨和敌意，阻碍我们建立对希腊城邦及其殖民地的霸权的努力。也许是时候制定一项新政策——一种尊重和崇敬希腊人及其文化的政策；合作和慷慨，而不是对抗和贪婪。"
 thrace_03_philhellene_black_sea_war_trigger:0 "@[me_thrace_scope.GetFlag]! [me_thrace_scope.GetName]没有与黑海西岸的任何庞提克城市处于战争状态。"
 thracian_01_hellespont:0 "跨越赫勒斯滂"
 thracian_01_hellespont_BUTTON_TOOLTIP:0 "我们应当主动出击，确保在小亚细亚的地位。"
 thracian_01_hellespont_CRITERIA_DESCRIPTION:0 "维持我们在小亚细亚的存在，确保敌对继业者无法从我们后方的[GetProvince('(int32)2770').GetName]发起进攻。"
 thracian_01_hellespont_DESCRIPTION:0 "亚历山大去世后，[GetCharacter('(int32)41').GetName]——我们的首位统治者——一直忙于守护全希腊世界的安全不受北方蛮族威胁，在继业者的权力争斗中处于边缘位置。\n\n然而，近些年来，形势变得愈发明晰，前色雷斯总督领、现色雷斯王国正处于危险的境地，周围的其他继业者虎视眈眈，如果我们不采取强硬的立场，就会被他们吞噬。尤其要注意的是[GetCharacter('(int32)37').GetName]领导的王国，他们的爆炸式扩张正威胁着我们的边境。要想确保安全，我们必须先下手为强，将战争带到小亚细亚，远离我们的领土。"
 thracian_01_hellespont_task_1:0 "粉碎亚洲希腊人的抵抗"
 thracian_01_hellespont_task_10:0 "巩固亚洲的收获"
 thracian_01_hellespont_task_10.tt:0 "我们在[GetProvince('(int32)1919').GetArea.GetName|Y]的一个城市中获得3个堡垒等级。"
 thracian_01_hellespont_task_10_DESC:0 "我们已经在赫勒斯滂的另一边建立了我们的存在，但我们在危险的亚洲边境的孤立领地还不够。我们需要利用邻国的弱点，在亚细亚果断扩展！"
 thracian_01_hellespont_task_11:0 "希腊化亚洲的收获"
 thracian_01_hellespont_task_11_DESC:0 "几个世纪以来，希腊人已经殖民了小亚细亚的西部海岸，以至于许多当地城市已经成为真正的希腊文化中心。然而，如果我们希望将这些地区纳入我们的统治，我们还需要希腊化内陆地区。"
 thracian_01_hellespont_task_12:0 "确保卡帕多西亚"
 thracian_01_hellespont_task_12.tt:0 "[GetCountry('TRE').GetName]在[GetProvince('(int32)1932').GetArea.GetRegion.GetName|Y]拥有至少一块领土。"
 thracian_01_hellespont_task_12_DESC:0 "征服[GetProvince('(int32)1941').GetArea.GetRegion.GetName]为我们打开了通向[GetProvince('(int32)1932').GetArea.GetRegion.GetName]的大门。如果我们能够使我们的南部边界覆盖整个塔罗斯山脉范围，我们就不再需要害怕来自南方的任何入侵者！"
 thracian_01_hellespont_task_13:0 "亚洲自治"
 thracian_01_hellespont_task_13_DESC:0 "小亚细亚西北部，位于赫勒斯滂对面的地区，是一个富饶的、深受希腊化的地区。通过信任他们的自治，我们将获得一个忠诚的臣民，并减轻我们官僚机构的地方行政负担。"
 thracian_01_hellespont_task_14:0 "争夺爱琴海"
 thracian_01_hellespont_task_14.tt:0 "在爱琴海拥有至少[SCOPE.ScriptValue('thracian_01_hellespont_task_14_port_total')|0]个港口。[SCOPE.GetRootScope.GetCountry.Custom('thracian_01_hellespont_task_14_port_counter')]"
 thracian_01_hellespont_task_14_DESC:0 "当我们在亚洲巩固了我们的力量时，我们的敌人在爱琴海上变得更加强大。我们的舰队可能不是地中海上最大的，而且我们的大部分利益可能位于[GetProvince('(int32)2770').GetArea.GetName]，但爱琴海是我们的后院，我们不能允许其他势力主导它。"
 thracian_01_hellespont_task_14_port_counter_1:0 "[SCOPE.ScriptValue('thracian_01_hellespont_task_14_port_current')|0R]/[SCOPE.ScriptValue('thracian_01_hellespont_task_14_port_total')|0Y]"
 thracian_01_hellespont_task_14_port_counter_2:0 "[SCOPE.ScriptValue('thracian_01_hellespont_task_14_port_current')|0Y]/[SCOPE.ScriptValue('thracian_01_hellespont_task_14_port_total')|0Y]"
 thracian_01_hellespont_task_15:0 "诗意的正义"
 thracian_01_hellespont_task_15.tt:0 "一报还一报！"
 thracian_01_hellespont_task_15_DESC:0 "[GetCharacter('(int32)38').GetPraenomen]一直是我们的建国者[GetCharacter('(int32)41').GetPraenomen]的仇敌，还经常用低微司库的绰号来羞辱他。安提柯家族就是我们的灾星，他们会为冒犯我们付出代价。"
 thracian_01_hellespont_task_1_DESC:0 "[GetCharacter('(int32)37').GetPraenomen]的权势很大一部分来自于他招揽盟友的能力。其中一些盟友就来自于我们的家门口；这是不可饶恕的背叛。"
 thracian_01_hellespont_task_2:0 "动摇亚洲希腊人的忠诚"
 thracian_01_hellespont_task_2_DESC:0 "[GetCharacter('(int32)37').GetPraenomen]一直是迷惑盟友的大师，他的诡计让他的影响力扩张到我们邻国身上。是时候以同样的方式回报他了。"
 thracian_01_hellespont_task_3:0 "赫勒斯滂弗里吉亚"
 thracian_01_hellespont_task_3.tt:0 "在#Y 比堤尼亚与帕佛拉戈尼亚#!或#Y 亚细亚#!地区控制至少一省份。"
 thracian_01_hellespont_task_3_DESC:0 "[GetCountry('PRY').GetName]就是我们危险与担忧的源头；他们不受束缚的野心能吞噬所有继业者。我们需要主动出击，进攻他们最虚弱的地方！"
 thracian_01_hellespont_task_4:0 "充实战争金库"
 thracian_01_hellespont_task_4.tt:0 "我们将获得一大笔#G 金钱#!，但我们臣民对我们的#R 好感度#!将降低并增加我们的#R 暴政度#!。"
 thracian_01_hellespont_task_4_DESC:0 "非常时期需要非常措施。我们在[GetProvince('(int32)2770').GetArea.GetName]的附属国非常富庶，但他们在近期的战争中没有尽到本分。我们可以向他们强征特殊税来充实战争金库，虽然他们会对此非常不满。"
 thracian_01_hellespont_task_5:0 "与伊庇鲁斯人的交易"
 thracian_01_hellespont_task_5.tt:0 "我们试图与[GetCountry('EPI').GetName|Y]达成协议，共同对抗[GetCountry('MAC').GetName|Y]。"
 thracian_01_hellespont_task_5_DESC:0 "虽然亚洲战线仍然是我们的首要任务，但我们不应忘记我们在西部也与一个对手继业者接壤。然而，[GetCountry('MAC').GetName]很弱；如果我们与他们的另一个邻国[GetCountry('EPI').GetName]联合，我们可以压倒他们并分享战利品。"
 thracian_01_hellespont_task_6:0 "特洛伊问题"
 thracian_01_hellespont_task_6_DESC:0 "[GetCountry('PRY').GetName]或多或少直接控制了[GetProvince('(int32)257').GetName]若干年，特洛伊战争就发生在这里的海岸，然而他们居然未能纪念这场战争的不朽遗产。我们可不会犯相同的错误。"
 thracian_01_hellespont_task_7:0 "本都的赫拉克利亚"
 thracian_01_hellespont_task_7.tt:0 "我们将尝试通过外交手段获得对[GetCountry('HCP').GetName|Y]的控制。"
 thracian_01_hellespont_task_7.tt.2:0 "[GetCountry('TRE').GetName]与[GetCountry('HCP').GetName|Y]接壤。"
 thracian_01_hellespont_task_7_DESC:0 "我们的邻国[GetCountry('HCP').GetName]军事力量有限，但由于渔业资源、肥沃的土地和横跨[GetProvince('(int32)2770').GetArea.GetName]的贸易路线而极其富有。我们应该尝试控制这里。"
 thracian_01_hellespont_task_8:0 "拜占庭舰队"
 thracian_01_hellespont_task_8.tt:0 "[GetCountry('TRE').GetName]与[GetCountry('BYZ').GetName|Y]接壤。"
 thracian_01_hellespont_task_8.tt.1:0 "拥有至少[SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_total')|0]艘船。[SCOPE.GetRootScope.GetCountry.Custom('thracian_01_hellespont_task_8_ship_counter')]"
 thracian_01_hellespont_task_8.tt.2:0 "我们将尝试通过外交手段获得对[GetCountry('BYZ').GetName|Y]的控制。"
 thracian_01_hellespont_task_8_DESC:0 "[GetCountry('PRY').GetRuler.GetName]和[GetCountry('EGY').GetRuler.GetName]的力量将无人能敌，除非他们的舰队被击败。如果我们想在争夺亚历山大的帝国中保持相关性，我们需要扩大我们的舰队，[GetCountry('BYZ').GetName]可能会在这方面提供一些帮助。"
 thracian_01_hellespont_task_8_ship_counter_1:0 "[SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_current')|0R]/[SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_total')|0Y]"
 thracian_01_hellespont_task_8_ship_counter_2:0 "[SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_current')|0Y]/[SCOPE.ScriptValue('thracian_01_hellespont_task_8_ship_total')|0Y]"
 thracian_01_hellespont_task_9:0 "马其顿问题"
 thracian_01_hellespont_task_9.tt:0 "[GetCountry('TRE').GetName]与[GetCountry('MAC').GetName|Y]接壤。"
 thracian_01_hellespont_task_9.tt.1:0 "我们派遣使节到[GetCountry('EPI').GetName]，请求他们如约加入我们的战争。"
 thracian_01_hellespont_task_9_DESC:0 "[GetCharacter('(int32)32').GetPraenomen]去世后，[GetCountry('MAC').GetName]陷入了混乱。我们必须利用这个机会扩展我们的权力，掌握亚历山大的王座！"
 thracian_01_hellespont_task_final:0 "黑海霸权"
 thracian_01_hellespont_task_final.tt:0 "赫勒斯滂周围的没有省份由其他继业者或他们的臣民拥有。[SCOPE.GetRootScope.GetCountry.Custom('thracian_01_hellespont_task_final_diadochi_counter')]"
 thracian_01_hellespont_task_final_DESC:0 "[GetProvince('(int32)2770').GetArea.GetName]是[GetCountry('TRE').GetName]的后院，也是我们商业收入的主要来源。我们不能容忍与我们的对手分享它。"
 thracian_01_hellespont_task_final_diadochi_counter_1:0 "[SCOPE.ScriptValue('thracian_01_hellespont_task_final_diadochi_current')|0R]"
 thracian_02_getic_raids_counter_1:0 "([me_thrace_scope.MakeScope.GetVariable('getic_raids').GetValue|R0]/#Y 3#!)"
 thracian_02_getic_raids_counter_2:0 "([me_thrace_scope.MakeScope.GetVariable('getic_raids').GetValue|Y0]/#Y 3#!)"
 thracian_02_odrysian_revolts_counter_1:0 "([me_thrace_scope.MakeScope.GetVariable('odrysia_revolted').GetValue|R0]/#Y 2#!)"
 thracian_02_odrysian_revolts_counter_2:0 "([me_thrace_scope.MakeScope.GetVariable('odrysia_revolted').GetValue|Y0]/#Y 2#!)"
 thracian_02_paper_kingdom:0 "纸面上的王国"
 thracian_02_paper_kingdom_1:0 "俄德律西亚荆棘"
 thracian_02_paper_kingdom_10:0 "赫勒斯滂之钥"
 thracian_02_paper_kingdom_10_DESC:0 "吕西玛刻亚的地址是特意选好的：可以防止任何军队穿越赫勒斯滂海峡进入色雷斯和马其顿的大陆，同时也可以防范俄得律西亚从北面进犯。尽管此地已经成为了一个繁荣的贸易港，其在军事防卫上的地位不应该被遗忘。城市的防御工事必须能够经受敌人发动的任何形式的进攻。"
 thracian_02_paper_kingdom_11:0 "阿瑞斯之子"
 thracian_02_paper_kingdom_11_DESC:0 "色雷斯是一群凶猛而骄傲的人民的家园，他们拥有历史悠久的勇士传统，其血脉能够上溯到战神阿瑞斯本人。我们应该充分发挥他们好战的品质，打造一支自亚历山大时代以来全世界最为凶猛的军队！"
 thracian_02_paper_kingdom_12:0 "盖塔人的威胁"
 thracian_02_paper_kingdom_12_DESC:0 "真是够了。必须阻止盖塔人没完没了的劫掠。必须让我们的臣民明白，我们并非无能为力，我们可以保证他们的安全。"
 thracian_02_paper_kingdom_12_allow_tt:0 "至少发生一起#Y 盖塔人劫掠#!。"
 thracian_02_paper_kingdom_13:0 "加固渡口"
 thracian_02_paper_kingdom_13_DESC:0 "伊斯特罗斯河宽阔而深邃，作为入侵者的天然屏障。我们必须通过在格提亚人使用的渡口附近建立加固的军事营地来增强这些天然防御，从这些营地中我们可以更容易地阻止他们入侵我们的土地。"
 thracian_02_paper_kingdom_14:0 "伊斯特罗斯之盾"
 thracian_02_paper_kingdom_14_DESC:0 "伊斯特罗斯河是我们抵御北方入侵者的盾牌。全面控制从黑海到萨尔登西亚的所有渡口应形成一道牢不可破的屏障——完全防止进一步的袭击进入我们的领土。"
 thracian_02_paper_kingdom_14_tt:0 "#Y 革提亚袭击#!将不再发生。"
 thracian_02_paper_kingdom_15:0 "人民之间的桥梁"
 thracian_02_paper_kingdom_15_DESC:0 "伊斯特罗斯城长期以来一直是从希腊到斯基泰亚等地人民的聚集地。为了促进与邻国的更好理解并进一步刺激贸易，我们应鼓励这些人民在我们提供的城市同名河流背后的安全环境中交流。"
 thracian_02_paper_kingdom_16:0 "结束袭击"
 thracian_02_paper_kingdom_16_DESC:0 "像盖塔这样的野蛮人只懂得力量的语言。我们将组建一次惩罚性远征，粉碎盖塔人，永远劝阻他们袭击我们的土地。"
 thracian_02_paper_kingdom_16_allow_tt:0 "至少发生过三次#Y 革提亚袭击#!。[SCOPE.Custom('thracian_02_getic_raids_counter')]。"
 thracian_02_paper_kingdom_17:0 "伊斯特罗斯以北"
 thracian_02_paper_kingdom_17_DESC:0 "为什么伊斯特罗斯河应成为色雷斯边界的自然终点？我们应该向北推进，征服那些袭击我们的人。他们可能会全额偿还他们造成的损失。"
 thracian_02_paper_kingdom_17_tt:0 "@[GetCountry('GTE').GetFlag]![GetCountry('GTE').GetName|Y]已在惩罚性远征中被击败。"
 thracian_02_paper_kingdom_18:0 "进入斯基泰亚"
 thracian_02_paper_kingdom_18_DESC:0 "我们站在命运的门槛上；我们可能会完成菲利普甚至亚历山大本人都未能实现的目标。斯基泰亚就在地平线之外，等待被入侵。[ROOT.GetCountry.GetRuler.GetName]在历史上的印记将得以完成。"
 thracian_02_paper_kingdom_1_DESC:0 "俄德律西亚的不忠行为如同每日升起的太阳一般确凿。我们可以开启谈判，看看他们是否能被安抚。"
 thracian_02_paper_kingdom_1_allow_tt:0 "@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetName|Y]至少反叛过一次。"
 thracian_02_paper_kingdom_2:0 "不愉快的妥协"
 thracian_02_paper_kingdom_2_DESC:0 "俄德律西的暴力循环是无情而无休无止的。可能打破这个死循环，求得生机的办法是我们作出某些退让，尽管这种滋味并不好受。"
 thracian_02_paper_kingdom_2_allow_tt:0 "@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetName|Y]至少反叛过两次。[SCOPE.Custom('thracian_02_odrysian_revolts_counter')]"
 thracian_02_paper_kingdom_2_pops_completion_tt:0 "[GetProvince('(int32)478').GetName|Y]的所有人口有#Y 75%#!的概率被#R 屠杀#!，#Y 15%#!的概率#R 逃亡#!至一个随机的@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetAdjective|Y]省份，#Y 10%#!的概率#G 存活#!。"
 thracian_02_paper_kingdom_3:0 "赢得忠诚"
 thracian_02_paper_kingdom_3_DESC:0 "无论是以怎样的代价，我们必须赢得我们俄德律西亚臣民的忠心。打开局面的办法不是通过流血，而是通过合作以及相互尊重。"
 thracian_02_paper_kingdom_3_completion_tt:0 "@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetName|Y]将不能再发动叛乱。"
 thracian_02_paper_kingdom_4:0 "拔除荆刺"
 thracian_02_paper_kingdom_4_DESC:0 "我们对俄得律西人的耐心已经所剩无几，如果他们不懂得跪下，那么我们只能毁灭他们。之前的战争由他们开启，但是下一场战争将轮到我们主动出击。"
 thracian_02_paper_kingdom_5:0 "粉碎象征"
 thracian_02_paper_kingdom_5_DESC:0 "修忒斯三世建造了俄得律西的都城——修托波利斯，痴心妄想这座城市能够和希腊世界的文明及势力同台而论，这座城市现在成为了他们抵抗和荣耀的象征。这样的象征必须被彻底毁灭；它的构造被掀倒；它的财富被掠夺，它的人民被烧成灰随风而逝。只有这样它的魂才算是真正的被粉碎。"
 thracian_02_paper_kingdom_5_tt:0 "[GetProvince('(int32)478').GetName|Y]被@[GetCountry('TRE').GetFlag]![GetCountry('TRE').GetName|Y]控制。"
 thracian_02_paper_kingdom_6:0 "北方的部落"
 thracian_02_paper_kingdom_6_DESC:0 "既然已经解决了俄德律西人，我们必须将目光投向他们北方的兄弟。伊斯特洛斯南方所有土地都属于色雷斯，如果他们不愿臣服，那我们就用武力解决。"
 thracian_02_paper_kingdom_6_completion_tt_1:0 "所有部落都有概率和平臣服于我们。\n如果他们#G 接受#!："
 thracian_02_paper_kingdom_6_completion_tt_2:0 "如果他们#R 拒绝#!："
 thracian_02_paper_kingdom_6_completion_tt_3:0 "\n你解决@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetName|Y]不忠问题的方法将影响他们接受的可能性。"
 thracian_02_paper_kingdom_7:0 "从纸面到现实"
 thracian_02_paper_kingdom_7_DESC:0 "色雷斯总督区的名义范围——从赫勒斯滂到奥斯特罗斯——已成为现实。不忠的部落已经被安抚并纳入了我们的统治，这使我们能够将资源重新集中在南方的威胁上。"
 thracian_02_paper_kingdom_7_allow_tt:0 "色雷斯总督领的名义上的疆域由我们或我们的附庸持有。\n具体边界为：\n——南界为[GetProvince('(int32)349').GetName|Y]以及与拜占庭的[GetProvince('(int32)1453').GetArea.GetName|Y]为界的省份。\n——北界为#Y 伊斯特洛斯#!河。\n——西界为与[GetProvince('(int32)365').GetArea.GetName|Y]为界的省份，以及[GetProvince('(int32)4115').GetName|Y]、[GetProvince('(int32)4217').GetName|Y]和[GetProvince('(int32)477').GetName|Y]的领土。\n——东界为#Y 黑海#!海岸。"
 thracian_02_paper_kingdom_8:0 "色雷斯人之地"
 thracian_02_paper_kingdom_8_DESC:0 "希罗多德认为，只要色雷斯人团结起来，他们将不可战胜，内斗让他们变得虚弱。团结的第一步就是接纳色雷斯人成为王国的正式公民。"
 thracian_02_paper_kingdom_8_reward_tt:0 "[odrysi_culture_scope.GetName|Y]文化将被整合。"
 thracian_02_paper_kingdom_9:0 "吕西玛刻亚的荣耀"
 thracian_02_paper_kingdom_9_DESC:0 "吕西玛刻亚在建立之后仅仅数年就发展成为了这个区域最大的城市之一。我们应该更进一步鼓励贸易，并且确保我们尽可能充分、最佳地利用了当地居民的财富，并将其用于我们未来的军事计划。"
 thracian_02_paper_kingdom_BUTTON_TOOLTIP:0 "几十年来，面对其他继业者无法想象的逆境，吕西马科斯坚持了下来，解决了威胁他统治色雷斯的所有威胁。现在，我们将不可避免地直接参与到继业者战争中，[ROOT.GetCountry.GetRuler.GetName]·[ROOT.GetCountry.GetRuler.GetHerselfHimself]必须行动起来，铲除[ROOT.GetCountry.GetRuler.GetHerHis]北翼的威胁。"
 thracian_02_paper_kingdom_CRITERIA_DESCRIPTION:0 "解决俄德律西亚和盖塔人的威胁，一统伊斯特洛斯河以南，色雷斯部落的土地。"
 thracian_02_paper_kingdom_DESCRIPTION:0 "继业者战争让色雷斯王国上下同仇敌忾，但是[ROOT.GetCountry.GetRuler.GetName]还不能将[ROOT.GetCountry.GetRuler.GetHerHis]的全部资源投入到争夺亚历山大的遗产之中。色雷斯，长期以来被国内的不忠小人和国外的蛮族掠夺者裹挟，必须先确保北部边境的安全无虞。"
 thracian_02_paper_kingdom_REWARD_DESCRIPTION:0 "防止进一步的俄德律西亚人不忠和革提亚袭击。"

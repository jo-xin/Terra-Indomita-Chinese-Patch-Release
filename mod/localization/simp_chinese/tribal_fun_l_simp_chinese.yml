l_simp_chinese:
 city_of_angels_decision_1:0 "天使之城"
 city_of_angels_decision_1_desc:0 "由于阿扬勒是神圣的生物，他们崇拜至高无上的存在并执行瓦克的意志，我们的城市将被称为天使之城通过谨慎地投资，以效仿神圣规则来服务和庇护我们的人民。"
 city_of_angels_decision_2:0 "阿扬勒地区"
 city_of_angels_decision_3:0 "瓦格的赐福"
 city_of_angels_decision_4:0 "阿波科帕贸易中心"
 city_of_angels_mod:0 "天使之城"
 consolidation_of_zingis_decision:0 "巩固津吉斯"
 consolidation_of_zingis_tooltip:0 "[GetDeityDefinition('omen_waaq').GetName|Y]希望[SCOPE.GetRootScope.GetCountry.GetName]人将崛起统治蓬特的土地。派遣 #Y 8个#!人口去进入[SCOPE.GetRootScope.GetCountry.GetCapital.GetArea.GetName]地区以[GetDeityDefinition('omen_waaq').GetName|Y]的名义移民该地区。"
 desc_disturbed_circles:0 "这个城市最近遭到了抢劫。其中，一些研究论文被盗或被毁。"
 desc_wreck_the_circles:0 "我们已经屈服于勇士们的要求，他们保留了他们的战利品。"
 diadochi_flavor.999.a:0 "暂时不要管他们"
 diadochi_flavor.999.b:0 "我们也要和他们战斗!"
 diadochi_flavor.999.desc:0 "不忠诚的巴克特里亚人已经离开了对抗声势浩大的帕提亚人的战争。他们让我们处于极度虚弱的状态，在这可怕的时刻自生自灭。"
 diadochi_flavor.999.t:0 "巴克特里亚人的背叛"
 disturbed_circles:0 "被掠夺的图书馆"
 do_not_disturb_these_circles:0 "阿基米德的圆圈"
 do_not_disturb_these_circles_desc:0 "这些是阿基米德最后的圆圈，他要求我们不要打断，因为我们围攻他的家乡。我们不知道它们意味着什么，但它们却让我们王国的每一位学者着迷。"
 trade_center_of_apocopa:0 "阿波科帕贸易中心"
 tribal_fun_inv.1.a:0 "一些黄金可以说服[SCOPE.sChar('not_bruce_lee')GetHerHim]。"
 tribal_fun_inv.1.b:0 "我们的[ROOT.GetCountry.GetRulerTitle]可以很有说服力。"
 tribal_fun_inv.1.c:0 "让[SCOPE.sChar('not_bruce_lee')GetName]拥有它。"
 tribal_fun_inv.1.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，在整理我们上次突袭的战利品时，我们发现了一张有趣的羊皮纸。上面画着圆圈，还有一些神秘的符号，我们的祭司向我们保证这些符号是数字的代表。我们的祭司能读，与其他许多人不同，并向我们保证它的价值。\n然而，我们的一位更杰出的战士，[SCOPE.sChar('not_bruce_lee')GetName]已经对这张纸提出了宣称，认为[SCOPE.sChar('not_bruce_lee')GetSheHe]喜欢它的样子，尽管[SCOPE.sChar('not_bruce_lee')GetSheHe]似乎并不反对交易，只要价格合适。"
 tribal_fun_inv.1.t:0 "一个值得注意的发现"
 wreck_the_circles:0 "屈服于勇士们的要求"

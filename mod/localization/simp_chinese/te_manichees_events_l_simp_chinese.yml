l_simp_chinese:
 minor_manichee_char_create:0 "在你的国家中有一群少数又值得注意的的摩尼教徒。"
 prophet_mani_man:0 "你发现了一座栩栩如生的“光之先知”玛尼的肖像。"
 te_manichees.1.a:0 "另一种新的教义涌现出来，使我们的耳朵发痒。我们应该听吗？"
 te_manichees.1.desc:0 "摩尼教很快就获得了成功，并在讲阿拉姆语的地区广泛传播。它在第三和第七世纪之间蓬勃发展，在其鼎盛时期是世界上最广泛的宗教之一。摩尼教的教堂和经书东至中国，西至罗马帝国都有。在取代古典异教的竞争中，它曾短暂地成为基督教的主要对手。一位以迫害基督徒而闻名的异教皇帝也迫害摩尼教，他抱怨摩尼教如何“建立新的和迄今未闻的教派来反对旧的信条，以便他们可以为了自己堕落的教义而抛弃过去神明赐予我们的教义”。"
 te_manichees.1.t:0 "摩尼教传播到东方和西方"
 te_manichees.2.a:0 "处决这些宗教狂热分子似乎并没有达到预期效果。"
 te_manichees.2.desc:0 "一位祆教徒波斯皇帝囚禁并下令处决了玛尼。他的追随者将摩尼的死描绘成受难，有意识地与耶稣受难相类比。有一个故事称他被剥皮，尸体被悬挂在冈德萨普尔大城的正门上；然而，这个说法没有历史依据。他的尸体很可能是通过死后斩首的方式被肢解的，他的头颅被展示出来，这可能是这种修饰的最初来源。"
 te_manichees.2.t:0 "摩尼的处决"
 te_manichees.3.a:0 "我们知道在哪里可以找到他。"
 te_manichees.3.desc:0 "黄昏降临在另一个充满挑战的日子里，作为统治者，你通过晚上的散步来放松自己。当你转过一个阴影道路的角落时，你看到一个斗篷人站在你的路上。他对你闪着阴森的微笑。你的卫兵粗暴地把他推到一边让路，当你经过时，他隐晦地问道：“你听到光了吗？”你注意到他没有任何恐惧，稳健地注视着你，你隐约认出了他，他是精英但次要的家族成员。"
 te_manichees.3.t:0 "一位开明的倾听者"
 te_manichees.31.desc:0 "然而，你又一次听说在该国的小家庭中，有一位来自波斯的，被宣称为“最后的先知”的摩尼，古怪的、同步的宗教的虔诚追随者。这些信徒似乎混合并采用了其他新旧宗教的各种习俗和教义，他们在人民中的存在感越来越强。"
 te_manichees.31.t:0 "另一位开明的倾听者"

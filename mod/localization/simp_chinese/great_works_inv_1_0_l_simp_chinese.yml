 wonder_abu_simbel:0 "阿布辛拜勒"
 wonder_abu_simbel_DESC:0 "阿布辛拜勒的两座巨大的岩石神庙，献给太阳神阿蒙-拉和拉荷拉赫提神，以纪念卡迭石战役。在古代，这些巨像守护着拉美西斯二世统治下的埃及南部边界。"
 wonder_athenian_acropolis:0 "雅典卫城"
 wonder_athenian_acropolis_DESC:0 "雅典卫城是雅典荣耀和力量的有形体现，是主宰雅典城的古老神庙和城堡。"
 wonder_cothon:0 "迦太基巨港"
 wonder_cothon_DESC:0 "迦太基巨港分为一个矩形的商人港口，随后是一个内部受保护的港口和为海军保留的船厂。这个内港是圆形的，周围环绕着一圈干船坞，能够容纳二百二十艘船只。中央是指挥所，建得较高，以便港口管理员可以俯瞰整个海湾。"
 wonder_greek_academy:0 "柏拉图学院"
 wonder_greek_academy_DESC:0 "由柏拉图所创立，雅典学院在整个泛希腊时代都作为学术和希腊哲学的中心而存在。该学院值得注意的成员包括斯珀西波斯、色诺克拉底、亚里士多德、赫拉克利德斯、欧多克索斯和赫拉克利德斯。"
 wonder_knossos_palace:0 "克诺索斯宫"
 wonder_knossos_palace_DESC:0 "克诺索斯是欧罗巴最古老的城市之一，最终成为古代米诺斯文明的礼仪和政治中心，如今只剩下昔日辉煌的影子。在希腊传说中，古老的米诺斯国王居住在宫殿中，他是迷宫的建造者，里面关押着传说中的牛头怪。"
 wonder_marib_dam:0 "马里卜大坝"
 wonder_marib_dam_DESC:0 "在三座山之间，萨巴人建造了马里卜大坝，以收集季风雨水。"
 wonder_numidian_tomb:0 "努米底亚陵墓"
 wonder_punic_tomb:0 "布匿坟墓"
 wonder_punic_tomb_DESC:0 "一座古老的布匿墓，是对死者的尊重。"
 wonder_second_temple_ezra:0 "第二圣殿"
 wonder_second_temple_ezra_DESC:0 "尽管无法与所罗门圣殿相比，且缺少如约柜等许多圣物，这座第二圣殿仍然是根据《托拉》进行犹太人礼拜和祭祀的地方。"
 wonder_second_temple_herod:0 "第二圣殿"
 wonder_second_temple_herod_DESC:0 "在仍在使用时重建的这座第二圣殿覆盖了整个圣殿山。第二圣殿是根据《托拉》进行犹太人礼拜和祭祀的地方。"
 wonder_ur_ziggurat:0 "乌尔的大塔庙"
 wonder_ur_ziggurat_DESC:0 "这座由苏美尔人建造的层层叠叠的神庙上升到众神的境界，后被巴比伦人修复。 "

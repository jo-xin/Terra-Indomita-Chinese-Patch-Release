 invasions_1.a:0 "这不是好事"
 invasions_1_desc:0 "在东部草原遥远的土地上，一个被称为匈奴的部落联盟，在他们的领袖冒顿单于的带领下，已经征服了阿尔泰山以外的大多数部落。人们越来越担心，单于的目光会投向更远的南方和西方。"
 invasions_1_title:0 "匈奴部落"
 invasions_2.a:0 "马蹄声渐近。"
 invasions_2_desc:0 "乌孙族是一个说伊朗语的草原部落，起源于甘肃。几个世纪以来，乌孙族一直被他们的表亲月氏人羞辱和击败。乌孙被迫成为伟大的冒顿单于的保护对象，生活在匈奴的土地上，等待着报复月氏的时机。现在，月氏人已经被匈奴联盟和乌孙人的联合打败了，是时候把我们的人民安置在伊犁山谷肥沃的土地上了，这是剩余的月氏人逃亡的方向。大单于将帮助我们征服他们。"
 invasions_2_title:0 "乌孙迁徙"
 invasions_2_tooltip:0 "#Y [wusun_country_scope.GetName]#!部落以#Y 部落征服#!的战争目标向#Y [wusun_invasion_defender.GetName]#!宣战。"
 invasions_3.a:0 "何其多也……"
 invasions_3_desc:0 "在塔里木盆地以西，强盛的大月氏与崛起的匈奴部落联盟激战正酣。东部草原地区的难民因此正蜂拥而至，涌入粟特地区与伊犁河谷。"
 invasions_3_title:0 "月氏人的到来"
 invasions_3_tooltip:0 "许多 #Y 月氏#! 文化的部落民将出现在塔里木盆地。"
 invasions_4.a:0 "拥抱月氏文化。"
 invasions_4.b:0 "赶走他们"
 invasions_4_desc:0 "越来越多的月氏人迁入这个地区，我们要么接受他们的生活方式，要么努力维持我们所熟知的文化。"
 invasions_4_title:0 "月氏人"
 invasions_4_tooltip:0 "获得 #Y 部落征服#! 的战争目标持续25年\n至多 #Y 50#! 人口将转变为月氏文化。"
 invasions_5.a:0 "他们逃不了多远"
 invasions_5_desc:0 "曾经称霸蒙古高原南部和甘肃地区数百年的强大月氏联盟，在公元前176年被新崛起的冒顿单于及其匈奴联盟击败，并得到宿敌乌孙的协助。大部分月氏人向西逃往伊犁河谷和粟特地区，以躲避强大的匈奴单于的报复，他们认为与塞种部落、粟特人和伊奥尼亚人作战的胜算更大。"
 invasions_5_title:0 "月氏入侵"
 invasions_5_tooltip:0 "#Y [yuezhi_country_scope.GetName]#! 部落以 #Y 部落征服#! 的战争目标向 #Y [yuezhi_invasion_defender.GetName]#! 宣战。"
 invasions_6.a:0 "这不是好事"
 invasions_6_desc:0 "月氏人屡次迫使塞种人离开家园。最初，月氏人从甘肃迁徙后占领了伊犁河谷，迫使塞种人向南方和西方迁移。随着月氏人入侵粟特地区，随后又攻入巴克特里亚，塞种人再次被迫离开故土。如今，为了生存，塞种人不得不继续向南迁移，涌入希腊和印度人统治的犍陀罗及印度河流域。"
 invasions_6_title:0 "塞种人"
 invasions_6_tooltip:0 "#Y [sakia_country_scope.GetName]#! 部落以 #Y 部落征服#! 的战争目标向 #Y [sakia_invasion_defender.GetName]#! 宣战。"
 invasions_8.a:0 "这不是好事"
 invasions_8_A_tooltip:0 "#Y [yuezhi_country_scope_2.GetName]#! 部落以 #Y 部落征服#! 的战争目标向 #Y [yuezhi_bactria_invasion_defender.GetName]#! 宣战。"
 invasions_8_B_tooltip:0 "#Y [yuezhi_country_scope.GetName]#! 部落以 #Y 部落征服#! 的战争目标向 #Y [yuezhi_bactria_invasion_defender.GetName]#! 宣战。"
 invasions_8_desc:0 "就在大月氏认为自己已经摆脱了匈奴的控制时，忠诚的匈奴附庸(也是我们以前的臣民)乌孙被大单于“赐予”了伊犁河谷的土地。乌孙和匈奴联军的兵力实在太强大了，我们无法抗衡，必须再逃一次：这次是向南前往希腊统治的巴克特里亚人的土地。他们的土地十分富饶，可以征服了，因为他们已经与希腊世界的其他地方完全隔绝。月氏将征服大夏的城市，拿走他们的奢侈品，最重要的是，留在这里。"
 invasions_8_title:0 "巴克特里亚的月氏入侵"

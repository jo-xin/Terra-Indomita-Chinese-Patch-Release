l_simp_chinese:
 amaterasuart:0 "天岩户挂毯"
 amaterasuart_desc:0 "据说太阳女神天照大神曾居住在名为天岩户——即天之岩洞的地方。她的弟弟，风暴之神须佐之男，激怒了天照大神，于是她将自己与世界隔绝以示报复。这幅挂毯描绘了那段因风暴肆虐使太阳从世间隐退的黑暗岁月。"
 amberspoon:0 "琥珀匙"
 amberspoon_desc:0 "北海道对琥珀的需求促使绳文陶器贸易在库页岛十分兴旺，以换取珍贵的树脂宝石。此后，许多工匠成为北海道琥珀珠宝及珍贵器物制作的专家。"
 bronzedragon1:0 "青铜龙"
 bronzedragon1_desc:0 "这座以青铜铸造、面目狰狞的龙雕像，令所有凝视它的人心生恐惧。"
 bronzedragon2:0 "双首龙"
 bronzedragon2_desc:0 "一件青铜雕像杰作，双首龙同时见证过去与未来，并主宰两者。"
 bronzedragon3:0 "青铜龙龟"
 bronzedragon3_desc:0 "这尊龙身龟壳、张牙舞爪的雕像能驱散邪灵，为大众带来宗教和谐。"
 bronzenao1:0 "青铜铙"
 bronzenao1_desc:0 "一种筒形鼓，青铜铙被敲击时会发出柔和的音调。"
 bronzenao2:0 "象纹铙"
 bronzenao2_desc:0 "这件打击乐器侧面精雕着一头大象，象鼻朝向天穹高举。"
 bronzenao3:0 "龙纹铙"
 bronzenao3_desc:0 "这面铜鼓两侧浮雕着两条龙，龙尾互相缠绕。"
 chinaart1:0 "帛画"
 chinaart1_desc:0 "这幅绘于最精美丝绸之上的杰作，描绘了一男子乘龙翱翔的画面。"
 chinaart2:0 "田园画"
 chinaart2_desc:0 "一幅描绘农耕社区生活的画作，展现了田间劳动者收割稻谷的场景。"
 chinascroll2:0 "楚帛书"
 chinascroll2_desc:0 "一篇哲学著作，思考生命的意义，并与死亡的必然性抗争。"
 chinaware1:0 "水晶杯"
 chinaware1_desc:0 "由一整块石英雕琢而成，此杯旨在陪伴已故统治者进入来世。"
 chinesepottery1:0 "龙柄陶瓷瓶"
 chinesepottery1_desc:0 "这件精美的陶瓷瓮以花卉图案装饰，并有一条雕刻的龙作为把手。"
 chinesepottery2:0 "黑陶托盘"
 chinesepottery2_desc:0 "一件为皇室制作的托盘，以上等木材雕刻并以黑漆装饰。"
 chinesepottery3:0 "彩釉陶器"
 chinesepottery3_desc:0 "这件风格化的餐盘上旋转着令人眼花缭乱的几何图案，专门用于仪式场合。"
 chineseshield1:0 "漆皮盾"
 chineseshield1_desc:0 "这面盾牌由水牛皮制成并经过彩绘，专供礼仪用途。"
 chinesesword1:0 "楚钢铁剑"
 chinesesword1_desc:0 "这柄华丽的宝剑由楚国的锻造大师打造，他们擅长铸造致命的武器。"
 chinesesword2:0 "秦钢铁剑"
 chinesesword2_desc:0 "这柄钢剑由秦朝最优秀的兵器匠人铸造，品质卓越，刀刃似乎永不钝化。"
 dotaku1:0 "铜铎"
 dotaku1_desc:0 "$dotaku_generic$"
 dotaku2:0 "铜铎"
 dotaku2_desc:0 "$dotaku_generic$"
 dotaku_generic:0 "铜铎是弥生时代用于宗教仪式的独特钟器。制造大型钟所用的金属和设计源自朝鲜和中国的缩小版本。同样，铸造铜铎所用的金属也来自朝鲜和中国，早在公元前2世纪便已在弥生时代的日本普遍使用。"
 goldcup1:0 "金杯"
 goldcup1_desc:0 "这件仪式用杯完全由最纯的黄金制成，据说能带来诸神的祝福，神祇将设法以礼物填满此杯。"
 goldcup2:0 "金圣杯"
 goldcup2_desc:0 "据说这个饮器是从一位早已被人遗忘的军阀墓中取出的。"
 golddragon1:0 "金龙"
 golddragon1_desc:0 "一尊金龙雕像，以纯金雕成，镶嵌两枚红宝石为眼，在光线下如火焰般闪耀。"
 ikutachi:0 "生太刀"
 ikutachi_desc:0 "生命之大刀，生太刀是风暴之神须佐之男的三件传说神器之一。建国之神大国主在须佐之男拒绝将女儿嫁给他时，偷走了这件神器及另外两件。"
 ikuyumiya:0 "生弓"
 ikuyumiya_desc:0 "生命之大弓，生弓是风暴之神须佐之男的三件传说神器之一。建国之神大国主在须佐之男拒绝将女儿嫁给他时，偷走了这件神器及另外两件。"
 jadeartifact1:0 "玉器"
 jadeartifact1_desc:0 "这件精心雕刻了汉字的玉器据称有着极其古老的历史。"
 jadeartifact2:0 "玉器"
 jadeartifact2_desc:0 "一件令人眼花缭乱的玉器似乎自身散发着光芒——对研究者而言是天赐之物。"
 jadeartifact3:0 "玉器"
 jadeartifact3_desc:0 "据传，这件玉器曾属于一位重要官员，握在手中感觉格外沉重。"
 kusanagi:0 "草薙剑"
 kusanagi_desc:0 "天丛云剑——又名草薙剑，由风暴之神须佐之男所持。传说须佐之男在一条巨蛇腹中发现了此剑，并将此剑赠予其姊天照大神以修复关系，使太阳女神从报复性的隐居之中归来。"
 lionstatue:0 "佛之狮"
 lionstatue_desc:0 "这尊威猛雄狮的雕像，巨爪踏在一颗球上，深受百姓喜爱。"
 mitama:0 "布都御魂"
 mitama_desc:0 "布都御魂是雷神与剑神建御雷神的剑。这位强大的神祇曾坐在剑尖之上，要求大地诸神交出对尘世的统治权。此剑最终由天神天迦久山赠予人类。"
 norogoto:0 "天之诏琴"
 norogoto_desc:0 "天之诏琴，是风暴之神须佐之男的三件传说神器之一。建国之神大国主在须佐之男拒绝将女儿嫁给他时，偷走了这件神器及另外两件。"
 nuhoku:0 "天之沼矛"
 nuhoku_desc:0 "天之沼矛是创造之神伊邪那岐和伊邪那美所持的神话之矛。此矛被用来从海中升起构成倭国的岛屿——通过用矛搅动海水，让咸水滴形成众多岛屿。"
 ohabari:0 "天之尾羽张"
 ohabari_desc:0 "天之尾羽张是伊邪那岐使用的矛。伊邪那岐的妻子伊邪那美在痛苦中生下火神迦具土后死去。作为报复，伊邪那岐用天之尾羽张斩首了新生的火神。这一流血事件反过来又为世界诞生了许多新的神祇。此矛最终传给了须佐之男。"
 protodotaku:0 "原始铜铎"
 protodotaku_desc:0 "铜铎是弥生时代独特的宗教用钟。然而，弥生铜铎的灵感来自日本-朝鲜半岛人群，以及后来的朝鲜人和中国人。「原始」铜铎体量更小，因所用金属更为丰富而不那么稀有。"
 redbox1:0 "朱漆盒"
 redbox1_desc:0 "一件做工精致的箱子，覆以朱漆，饰有螺旋状的田园图案。"
 samhantool:0 "三韩青铜犁"
 samhantool_desc:0 "三韩时期的大多数工具由铁制成。这件优秀的冶金制品证明了从青铜时代到铁器时代的发展。"
 teapot1:0 "青铜茶壶"
 teapot1_desc:0 "这件茶壶以简单陶壶的风格雕琢而成，却由青铜铸就，提醒着我们出身卑微的根源。"
 teapot2:0 "陶瓷茶壶"
 teapot2_desc:0 "这把陶瓷茶壶侧面绘有一只精美绝伦的仙鹤。"
 teapot3:0 "玉茶壶"
 teapot3_desc:0 "一把小巧的礼器茶壶，以玉石雕琢而成，饰有汉字纹样。"
 treasure_chuanguoyuxi:0 "珍宝"
 treasure_fuhaoyue:0 "珍宝"
 treasure_heshibi:0 "和氏璧"
 treasure_heshibi_desc:0 "一块中央开孔的大型玉璧，和氏璧是与王权威仪相联系的礼器。"
 treasure_jiche:0 "珍宝"
 treasure_jiuding:0 "九鼎之宝"
 treasure_jiuding_desc:0 "九鼎为青铜所铸，巨大沉重，需二十人之力方能移动，散发着权威与稳定的气息。"
 treasure_liannu:0 "珍宝"
 treasure_liannuche:0 "珍宝"
 treasure_suihouzhu:0 "随侯珠"
 treasure_suihouzhu_desc:0 "传说随侯救下一条蛇后，感恩的蛇赠予他一颗华美明珠。"
 treasure_zhuansheji:0 "珍宝"
 yatashield:0 "八咫镜"
 yatashield_desc:0 "八咫镜意为八咫之镜。这面镜盾是古神道神话中最珍贵的宝物之一。它由镜之神石凝姥锻造而成。它与其他珍贵物品一起被悬挂在树上，以引诱太阳女神天照大神出洞。最终它被日本的大和王朝所持有。"
 yayoijar1:0 "弥生土器"
 yayoijar1_desc:0 "这种土器陶器是弥生文明的定义性特征之一。陶器的球形设计与绳文人更不规则的陶器风格截然不同。"
 yayoijar2:0 "弥生土器"
 yayoijar2_desc:0 "$yayoijar1_desc$"
 yayoijar3:0 "弥生土器"
 yayoijar3_desc:0 "$yayoijar1_desc$"
 yayoimirror1:0 "方格规矩镜"
 yayoimirror1_desc:0 "这面弥生青铜镜被称为方格规矩镜。源自中国的TLV纹饰设计，弥生人的冶金术是他们能够在岛上成为最具军事优势的力量，而绳文人主要使用石器的重要原因之一。"
 yayoimirror2:0 "三角缘神兽镜"
 yayoimirror2_desc:0 "这面弥生青铜镜被称为三角缘神兽镜。源自曹魏中国，弥生人的冶金术是他们能够在岛上成为最具军事优势的力量，而绳文人主要使用石器的重要原因之一。"
 yayoimirror3:0 "画文带神兽镜"
 yayoimirror3_desc:0 "这面弥生青铜镜被称为画文带神兽镜。它描绘了神祇和狐狸等神圣动物。弥生人的冶金术是他们能够在岛上成为最具军事优势的力量，而绳文人主要使用石器的重要原因之一。"

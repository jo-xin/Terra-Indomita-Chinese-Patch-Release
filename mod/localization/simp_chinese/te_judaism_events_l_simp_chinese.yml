l_simp_chinese:
 te_judaism.1.a:0 "愿这些古怪的人享受我们宽容的国家，虽然我们优越的文化有诸多神灵。"
 te_judaism.1.desc:0 "犹太教在印度的根源可能可以追溯到所罗门王时代；有些人声称是古代失落的十个部落的残余，以及亚述人和巴比伦人入侵以色列后的流亡者。圣托马斯使徒访问了南印度科钦的犹太人社区，在公元二世纪末，更多的旅行者在他们的祖国再次被入侵后来到这里。"
 te_judaism.1.t:0 "科契的犹太人"
 te_judaism.21.a:0 "也许我们应该继续对这些可怜的难民采取宽容政策。"
 te_judaism.21.b:0 "这里不欢迎这些仇视我们神灵的外来人。把他们赶走！"
 te_judaism.21.desc:0 "近年来，又有许多蔑视我们神的被称为犹太人的外来人在我们神圣土地上寻求庇护。他们的祖国被征服了，他们受到统治者的严重迫害，统治者也对这些人拒绝承认任何其他神灵的行为感到不满。他们说他们自己的神是唯一的神！然而，他们似乎期望得到我们的保护，而且他们的许多同胞已经在这里安家一段时间了。"
 te_judaism.21.t:0 "犹太移民"
 te_judaism.3.a:0 "有意思。谢谢你的报告。"
 te_judaism.3.desc:0 "我们的一些人要么回到了他们的根，要么被外来移民的宗教言论所说服，他们在逃离家乡的暴力迫害后在我们中间定居。他们采用了希伯来人的法律和习俗。"
 te_judaism.3.t:0 "黎凡特人皈依犹太教"
 te_judaism.4.a:0 "这些人是我们所熟知的，我们现在应该劝阻他们顽强的宗教信仰吗？"
 te_judaism.4.desc:0 "古代以色列人，有些可能来自失落的以色列十部落，已经在我们中间存在了许多个世纪。近代以来，更多的犹太人来到这里，因为他们的祖国被征服了，他们被迫逃离无情的征服者的压迫，征服者试图迫使他们放弃神圣的传统。"
 te_judaism.4.t:0 "埃塞俄比亚人中的贝塔以色列"

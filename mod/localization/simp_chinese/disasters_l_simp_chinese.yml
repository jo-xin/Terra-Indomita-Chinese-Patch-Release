l_simp_chinese:
 anti_locust_power_tt:0 "如果你#R 现在#!就行动蝗虫群就有可能#G 不会进一步聚集#!。"
 desc_flood_initial_damage:0 "一场洪水摧毁了许多人的生计。"
 desc_flood_reduced_damage:0 "一场洪水摧毁了许多人的生计。"
 desc_grow_a_pear:0 "这个地区经历了干旱的侵袭。由于缺水，没有人能有足够的食物和饮水，每个人都有死亡的危险。"
 desc_hit_by_avalanche:0 "这片领土最近遭受了雪崩。许多地方所受的破坏仍然可见。"
 desc_i_bet_you_wish_you_had_my_water:0 "原本就稀缺的水供应不得不与另一地区共享，使这一地区的生产力下降，也让人感到不快。"
 desc_jizz_storm:0 "几代人以来最严重的暴风雪一直困扰着这个地区。"
 desc_light_locust_plague:0 "我们观察到了一群蝗虫。它们会吃掉所有它们看见的东西，但它们似乎是可以控制的。"
 desc_locust_plague:0 "蝗虫吃掉了这里所有从地里长出来的东西，一片叶子都没剩下。"
 desc_locust_plague_non_plant:0 "蝗虫吃光了这里所有从地上长出来的东西，一片叶子都不剩。"
 desc_sand_up_comedy:0 "一场沙尘暴经过这里，其破坏性的影响仍然清晰可见。"
 desc_the_land_slides_into_your_dms:0 "山体滑坡堵塞了道路，毁坏了一些建筑物。通过这一关卡并非易事，尤其是当人们忙于挽救生命时。"
 disaster_spread_chance_tt:0 "灾害可能进一步蔓延"
 disasters_inv.1.a:0 "如果洪水蔓延，我们必须为周边地区做好准备。"
 disasters_inv.1.b:0 "哦，不!无论如何..."
 disasters_inv.1.desc:0 "[the_day_after.GetName]的水位已经上升到前所未有的高度！许多人逃离家园，在绝望中放弃了全部生计，许多人已经死亡，我们担心这些数字将继续增长。不用说，该地区的生产已降至历史最低水平;这条曾经仁慈而肥沃的河流给[the_day_after.GetName]带来了繁荣。现在只会带来毁灭和破坏。"
 disasters_inv.1.t:0 "在[the_day_after.GetName]的水灾"
 disasters_inv.10.a:0 "诸神喜怒无常。"
 disasters_inv.10.desc:0 "从[sandman_daddy.GetArea.GetRegion.GetName]而来的沙尘暴已经袭击了[sandman.GetName]。给那些必须忍受它的贫穷居民造成了巨大的痛苦。沙尘暴阻碍了所有的行动，当地民兵也被困住了，无法帮助居民。每个人基本上都在原地蹲下，等待着被诅咒的沙子停止他们的地狱之风。面对这场可怕的灾难。然而，[sandman.GetName]的市民们已经团结起来，发誓要找回那些被风吹走的东西。"
 disasters_inv.10.t:0 "诸神之风"
 disasters_inv.11.a:0 "诸神喜怒无常。"
 disasters_inv.11.desc:0 "来自[snow_daddy.GetArea.GetRegion.GetName]的大雪让[not_snowden.GetName]坚韧的居民感到惊讶，他们已经习惯了这样的事情；即使是当地的长者也不记得有哪一年的冬天像这次一样严酷。暴风雪阻碍了任何和所有的行动；即使是最顽强的骡子也不能通过覆盖在土地上的厚厚的雪层。[not_snowden.GetName]的公民现在坐在家里，试图不被冻死。除了最基本的家务劳动外，所有的生产都已停止。"
 disasters_inv.11.t:0 "世纪雪灾"
 disasters_inv.12.a:0 "我们必须现在就行动，趁着还有时间。"
 disasters_inv.12.b:0 "这只是一些虫子而已。"
 disasters_inv.12.desc:0 "在 [we_are_hungry.GetName] 发现了一群蝗虫。它们的数量据说非常多，以至于当它们经过时，天空中看不到太阳。尽管听起来不像真的，但这些报道还是令人不安；它们看到什么就吃什么，从一片田地飞到另一片田地，从一个城镇飞到另一个城镇。我们应该密切关注形势，目前来看，这似乎还不是一场全面的灾难。"
 disasters_inv.12.t:0 "蝗虫群被发现"
 disasters_inv.13.a:0 "我们必须采取行动，现在"
 disasters_inv.13.b:0 "他们一无所知。"
 disasters_inv.13.desc:0 "我们正在被入侵，但是是由昆虫大军入侵的！我们正在被入侵。在[we_are_hungry.GetName]首次看到的蝗虫群已经蔓延到邻近的村庄，它们的灾情阻碍了食物的供应。痛苦的农民正在乞求你的援助，我的[ROOT.GetCountry.GetRulerTitle]；在我们收到的信息中，他们听起来绝对是吓坏了。"
 disasters_inv.13.t:0 "蝗虫群在不断扩大"
 disasters_inv.14.a:0 "迟到总比不到好。"
 disasters_inv.14.b:0 "我们将按现状生存下去。"
 disasters_inv.14.desc:0 "来自[we_are_hungry.GetName]蝗虫成群，现在变得越来越大——庞大的部落甚至分裂成几个较小的部落，都在寻找食物。附近的每个居民点都在挨饿。[we_are_hungry.GetName]已经被剥去了每一寸的植物材料。你听到的一些故事是疯狂的;冒险走出家门的人们背上的衣服都被吃掉了。牛、人、野生动物——所有人和所有东西现在都在挨饿，有些人正在死去。我们现在必须找到一个解决方案，如果我们想看到明年冬天。"
 disasters_inv.14.t:0 "蝗虫之灾"
 disasters_inv.15.a:0 "终于！"
 disasters_inv.15.desc:0 "来自[we_are_hungry.GetName]和周边地区的最新消息表明，蝗虫大部分已经消失。蝗灾的危险不再迫在眉睫，但该地区要完全恢复还需要一段时间。希望这些该死的生物现在在我们敌人的土地上……愿他们永远不再回来！"
 disasters_inv.15.t:0 "蝗虫已经消失"
 disasters_inv.2.a:0 "愿众神怜悯我们。"
 disasters_inv.2.desc:0 "噩梦还在继续，因为第二天又有洪水。[the_day_after.GetName]的洪水已经蔓延，现在淹没了邻近的定居点，这些定居点已经因为灾难中的难民而膨胀到爆棚。当地长官报告说我们已经控制住了局势。虽然损害没有我们最初担心的那么严重，但该区域完全恢复功能还需要时间。更糟糕的是，居民数量减少了，这意味着生产能力将比以前更低。"
 disasters_inv.2.t:0 "洪水蔓延"
 disasters_inv.3.a:0 "最坏的情况已经过去了。"
 disasters_inv.3.desc:0 "洪水终于退去了。虽然我们失去了这么多，但仍有希望——我们的人民确实是不屈不挠的。[the_day_after.GetName]的居民。已经开始返回家园，重建家园。这将是很长一段时间之后。[the_day_after.GetName]距完全恢复还有很多工作要做，但值得庆幸的是，人们对此抱有极大的热情。让我们祈祷这样的灾难不会在我们的有生之年再次发生。"
 disasters_inv.3.t:0 "洪水退去"
 disasters_inv.4.a:0 "愿他们的灵魂得到安息。"
 disasters_inv.4.desc:0 "我们收到了灾害的消息！[snowball.GetName] 发生了雪崩，对当地造成了巨大破坏；由于降雪量非常巨大，当地的道路已无法通行，我们听到有消息称当地基础设施遭到破坏。在 [snowball.GetName] 重建之前，恐怕没有多少人想在那里生活。\n不远处，最近又发生了一场雪崩。也许是有联系的？如果人们开始相信这些土地被诅咒了，没有人会想住在那里。是什么导致了这些雪崩？据说震动会使雪层塌陷——也许是求助的呼声导致的。"
 disasters_inv.4.t:0 "一场雪崩"
 disasters_inv.5.a:0 "我们必须为更多的危机做好准备！"
 disasters_inv.5.b:0 "哦，不!无论如何..."
 disasters_inv.5.desc:0 "悲惨的事情接二连三!我们有来自[mudstick.GetName]的可怕消息，那里一直在遭受恶劣的天气。几周来一直在下雨，我们听到报告说，一场巨大的山体滑坡现在已经毁了周围的乡村。当地居民一如既往地顽强，正试图互相救援，并埋葬他们的死者，但是问题的规模对他们微薄的资源来说太大。任何旅行者都很难通过该地区，贸易也因此枯竭，而那些破碎的、被泥浆溅到的建筑也不好看。应该采取一些措施。"
 disasters_inv.5.t:0 "山体滑坡"
 disasters_inv.6.a:0 "幸运的是我们已经准备好了"
 disasters_inv.6.b:0 "耐心是一种我们没有的美德。"
 disasters_inv.6.desc_1:0 "今天早上，[mudstick.GetName]又发生了山体滑坡。然而，你会很高兴地听到，我们的准备工作取得了成果，并没有造成重大损失。人民很感激他们有这样一位明智而慈爱的领袖，一位平等地关心我们王国所有居民的领袖。"
 disasters_inv.6.desc_2:0 "我们本应该听从那些被我们轻率忽视的明智建议。如果我们做了一些事情，任何事情，来帮助[mudstick.GetName]的贫穷居民。在最后一次滑坡来了之后，也许我们现在就不会有更大的问题需要处理了。正如预测的那样，另一场山体滑坡在该地区造成了严重破坏，造成了更多的生命损失。而[mudstick.GetName]的生命。不像我们自己的人那么珍贵，我们没必要奢侈也没有必要去浪费他们。"
 disasters_inv.6.t:0 "第二波"
 disasters_inv.7.a:0 "我们必须拯救我们的臣民！"
 disasters_inv.7.b:0 "谁在乎呢？"
 disasters_inv.7.desc:0 "[i_am_thirsty.GetName]经历了一个极度缺水的时期。这里的土地干枯、肿胀、开裂，几乎不能再耕种，现在商人们开始避开这个地区，因为他们知道，在荒芜的市场上，他们不会获得丰厚的利润。水变得如此稀缺，以至于围绕水的所有权爆发了第一次战斗——你听说过暴徒守卫着他们村庄里越来越少的水井，确保没有陌生人偷走曾经免费提供的水。幸运的是，周围地区还有水资源，我们可以要求共享——然而，这将使许多人不高兴。我们得决定优先处理什么。"
 disasters_inv.7.t:0 "[i_am_thirsty.GetName]的干旱"
 disasters_inv.8.a:0 "愿诸神怜悯。#R RNGesus 请求#!"
 disasters_inv.8.b:0 "我已经改变了我的想法。"
 disasters_inv.8.desc:0 "在吃早饭的时候，你听到了一些不愉快的消息，这使你的情绪很糟糕。起源于[i_am_thirsty.GetName]的干旱已经开始影响到整个地区，现在已经演变成了一场饥荒。面包的价格翻了两番，甚至只有你能找到黑市，才能买到。尽管我们尽了最大的努力去取缔这种行为，但高价贩卖食品的黑市还是很兴旺。饥饿的农民转而从事盗匪活动，使情况更加复杂。缺水正在杀死一切生物和所有人；即使是骆驼这种适应力强的动物也不能幸免。这里没有什么好消息。"
 disasters_inv.8.t:0 "饥荒"
 disasters_inv.9.a:0 "诸神喜怒无常。"
 disasters_inv.9.desc:0 "起源于[stormy_mommy.GetArea.GetRegion.GetName]的可怕风暴已经到达[stormy_daniels.GetName]并造成了巨大的破坏。海港里的船只正在沉没，它们无法承受汹涌的海浪，而这些海浪现在把淹死水手的尸体带到了我们的海岸。许多人在悼念在这次事件中死去的亲人，在海滩上搜寻失去的亲人——这确实是一项艰巨的任务。然而，[stormy_daniels.GetName]的市民们已经团结起来，克服这场可怕的事件，重建他们的城镇;他们鼓舞着我们所有人。"
 disasters_inv.9.t:0 "世纪风暴"
 disasters_inv_8_a_1:0 "旱灾可能进一步蔓延。"
 disasters_inv_8_a_2:0 "旱灾可能很快结束。"
 disasters_inv_8_b:0 "这个选项是可用的，因为你的统治者是仁慈的，精神错乱的，武断的或一个疯子。"
 disasters_inv_destroyed_building:0 "建筑物可能会被摧毁。"
 flood_initial_damage:0 "洪水"
 flood_reduced_damage:0 "洪水"
 grow_a_pear:0 "旱灾"
 hit_by_avalanche:0 "遭遇雪崩"
 i_bet_you_wish_you_had_my_water:0 "水源共享"
 jizz_storm:0 "世纪雪灾"
 light_locust_plague:0 "蝗虫成群"
 locust_plague:0 "蝗虫灾害"
 locust_plague_non_plant:0 "蝗虫灾害"
 locusts_spreading_2_tt:0 "如果它是一个#G 非植物#!贸易品，它将获得这个修正。"
 locusts_spreading_3_tt:0 "所有接壤的领土都没有受到那么严重的影响--然而？"
 locusts_spreading_tt:0 "蝗虫#R 蔓延#! 到与[we_are_hungry.GetName]接壤的所有领土，然后再延伸到更远的地方，一块又一块的田地，一个又一个的定居点。\n如果生产了与#G 植物#! 相关的贸易产品，这些领土将获得以下的修正。"
 sand_up_comedy:0 "世纪沙尘暴"
 the_land_slides_into_your_dms:0 "山体滑坡"

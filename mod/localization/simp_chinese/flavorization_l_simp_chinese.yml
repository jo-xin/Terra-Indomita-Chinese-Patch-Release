 AIN:0 "阿伊努"
 AIN_ADJECTIVE:0 "阿伊努"
 AIN_NAME:0 "阿伊努"
 AIU:0 "绳文"
 AIU_ADJECTIVE:0 "绳文"
 AIU_NAME:0 "绳文"
 CELESTIAL_REFORM_1_DESC:0 "战国乱世导致中央权威松弛，异端邪说得以渗透并污染了民众的宗教实践。纠正臣民的精神谬误，乃是天子受命承担的神圣职责。"
 CELESTIAL_REFORM_2_DESC:0 "通过设立科举制度，天子可确保国中最高的官职由毕生研习经典的饱学之士担任。"
 CELESTIAL_REFORM_3_DESC:0 "臣民方言各异、语言不通，是统治如此庞大帝国的障碍。推广标准语言将极大改善沟通效率，进而改善民生。"
 CELESTIAL_REFORM_4_DESC:0 "丝绸是我们最受追捧的贸易商品，这种轻薄如纱、几若无物的织物已成为上层阶级财富与地位的象征。扩大这种奢侈品的生产只会增加我们的税收。"
 CELESTIAL_REFORM_5_DESC:0 "推动殖民扩张，我们得以在取悦天子的同时扩大势力范围，利国利民。授予大臣更多权力，将其职责扩展至制造战争借口；凡我们所觊觎之地，终将归我所有，无论以何种方式。"
 CELESTIAL_REFORM_6_DESC:0 "通过发行官方货币，天子不仅能取代目前流通的贝币等劣质货币，还能在市场中推行唯一可接受的标准，从而振兴整个经济部门——这是造福社会之举。"
 FNN:0 "扶南"
 FNN_ADJECTIVE:0 "扶南"
 FNN_NAME:0 "扶南"
 GCS_ADJ:0 "黄金半岛"
 GCS_NAME:0 "黄金半岛"
 GRY:0 "大越"
 GRY_ADJECTIVE:0 "大越"
 GRY_NAME:0 "大越"
 MERITOCRACY_REFORM_1_DESC:0 "周室之所以能长治久安，在于他们愿意将权力托付给精心选拔的官僚体系；明智的天子身边围绕着可信的顾问，他们怀着对帝国愿景的绝对忠诚。"
 MERITOCRACY_REFORM_2_DESC:0 "通过对海军进行全面审查，我们可以确保以任人唯贤的制度取代现有的指挥体系；只有最优秀的士兵才配成为军官。"
 MERITOCRACY_REFORM_3_DESC:0 "我们深知，防御工事网络实乃王国的脊梁，是我们的优势地位之所系。因此，加强国防的命令便成了一项道德要务。"
 MERITOCRACY_REFORM_4_DESC:0 "更新我民户籍的时机已到，以便我们了解王国内的户数与人丁之数。派遣监察官，将所有财产登记在册。"
 MERITOCRACY_REFORM_5_DESC:0 "皇帝享有的诸多特权之一，便是管理全国通行的度量衡，以及收紧进出口贸易的流通。"
 MERITOCRACY_REFORM_6_DESC:0 "军队的强弱与国家的兴衰休戚相关；历史一再证明，当一方衰败时，灾祸便随之而来。一位尽责的皇帝当不忘军队，在必要时整饬军官队伍。"
 XIY:0 "大吐火罗"
 XIY_ADJECTIVE:0 "大吐火罗"
 XIY_NAME:0 "大吐火罗"
 anti_steppe_tactics_mods:0 "反草原战术"
 archers_jungle_combat_bonus:0 "弓箭手丛林作战加成"
 caravan_guards_path_1:0 "商队护卫"
 caravan_guards_path_1_desc:0 "富商们雇佣士兵在危险的道路上护送他们的货物与财宝。通过以合理的价格向商人提供我们的士兵，我们可以帮助补贴开支。"
 caravan_guards_path_2:0 "持续袭扰"
 caravan_guards_path_2_desc:0 "草原边缘地带持续不断的劫掠与反劫掠意味着我们从不缺乏经验丰富的战士可供征召。"
 caravan_guards_path_3:0 "财富许诺"
 caravan_guards_path_3_desc:0 "向丝绸之路沿途的护卫与雇佣兵许诺丰厚的薪酬，将使他们蜂拥至我们的旗帜之下！"
 celestial_reform_1:0 "统一祭祀礼仪"
 celestial_reform_2:0 "科举制度"
 celestial_reform_3:0 "推广标准语言"
 celestial_reform_4:0 "丝绸关税"
 celestial_reform_5:0 "推动华夏殖民"
 celestial_reform_6:0 "国家铸币"
 chinese_flavor.2.a:0 "天朝帝国将永世长存！"
 chinese_flavor.2.desc:0 "虽然付出的代价无法估量，唯有神明方能度量，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的努力在漫长而艰苦的奋斗后终于结出硕果。\n\nThe #E 天命#!，曾经托付给#E 商#!和#E 周#!，在他们在神人面前被认定不足之后，如今已授予我们，新王朝的建立预示着和平与繁荣的新纪元即将到来。所有其他的王位觊觎者都已看到他们愚蠢的梦想被[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]粉碎，他为此而生——我们[ROOT.GetCountry.GetRulerTitle]的最终天命在这神圣注定的时刻达到顶峰。\n\n愿神明庇佑我们的皇帝，愿[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族万世长存！"
 chinese_flavor.2.t:0 "天命"
 chinese_flavor.4.a:0 "像这样的帝国不会长久……"
 chinese_flavor.4.desc:0 "今晨，拂晓过后不久，我们的城卫禀报说一支来自远东的皇家使团已经抵达，据称携带着对我国人民至关重要的消息。在接待这些衣着奇特的使节后——他们的语言我们无法解读——我们被呈上一块覆盖着奇异符号与图案的青铜板。\n\n虽然我们最睿智的学者无人能确定这种语言的含义，但所有人都能欣赏这份诏书的精美工艺，它以最上等的青铜铸成，并以金箔装饰。片刻之后，令我们大为惊讶的是，其中一位外交官开始用我们的母语讲话，以正式的口吻宣布了一个伟大帝国的建立。\n\n在经历了一段动荡与战争之后，东方的土地已在一位皇帝的权威下统一起来，这位皇帝命令将他们的荣耀崛起告知天下每一个蛮族之国。宣读完这份公告后，他们请求购买补给，并慷慨地付了款，随后外交官们于当晚继续前行，留下我们困惑不已，思索这一切究竟意味着什么。"
 chinese_flavor.4.t:0 "东方帝国"
 chinese_flavor.5.a:0 "中国将属于我们！"
 chinese_flavor.5.desc:0 "这是一个充满巨大动荡与破坏的不确定时代。数百年前，#E 周朝#!在遭到犬戎蛮族的毁灭性攻击后，被迫放弃都城，向东逃亡，自那关键的一刻起，天子——皇帝——的中央权威便被纷争不休的军阀们的野心逐渐侵蚀，他们各自争夺领地建立王国，同时名义上承认日益衰弱的周室。\n\n日复一日，周室权威的假象受到质疑。即便此刻，孱弱的[GetCharacter('(int32)621').GetName]仍试图在他的诸侯之间斡旋和平，希望让平民百姓免于又一次战火，然而皇帝的诏令在帝都[GetProvince('(int32)8379').GetName]的城墙之外几乎无人理睬。显然，战火重燃只是时间问题……战争与死亡之神正在为即将到来的盛宴做准备。"
 chinese_flavor.5.t:0 "中国动荡"
 chinese_flavor.5.tt:0 "统一战争已迫在眉睫……"
 convert_to_ainu_religion:0 "接纳富吉特信仰"
 convert_to_ainu_religion_desc:0 "绳文人的诸灵，卡穆伊，进入了我们的国度。据说卡穆伊寓于万物之中，从人到动物，乃至猎杀动物的武器皆有其灵。那么，卡穆伊是否也能寓于我们的国度本身？"
 convert_to_austronesian_religion:0 "接纳杜昆信仰"
 convert_to_baiyue_religions:0 "接纳百越信仰"
 convert_to_baiyue_religions_desc:0 "百越信仰中体察万物、敬畏生灵的道路，已经赢得了我们聚落与城市中许多人的归心。信众宣称，只要谨慎守护身边万物的神圣性，生命便会由此获得意义；他们也邀请我们一同分享这份安宁。"
 convert_to_chinese_religions:0 "接纳华夏信仰"
 convert_to_chinese_religions_desc:0 "神州之信仰如高塔上的明灯，光辉照耀四方，也在我们的人民心中投下长影。众人仿佛向日之花，转而面向这些异邦神灵的光芒。然而，它们真的如此陌生吗？它们的道路与我们的传统真有那么不同吗？也许相似之处远比差异更多。"
 convert_to_hu_religions:0 "接纳腾格里传统"
 convert_to_hu_religions_desc:0 "腾格里信仰的教义出于多种原因吸引了我们的人民；他们羡慕其信徒取得的军事成功，也相信腾格里信仰的朴素直接胜过我们复杂的仪式化实践体系。也许他们说的是真话……或许我们已经迷失道路，应当崇拜风与月。"
 convert_to_pinoy_religion:0 "弘扬阿尼托信仰"
 convert_to_pinoy_religion_desc:0 "菲律宾群岛多样的灵体阿尼托，已经在我国受到喜爱。巴朗高的彩虹应当像庇佑其故乡群岛那样庇佑我们的天空。让我们将阿尼托接纳为自己的信仰。"
 convert_to_taiwan_religion:0 "接纳哈尼图信仰"
 convert_to_taiwan_religion_desc:0 "源自台湾岛的福尔摩沙信仰开始吸引我国人民。哈尼图、卡瓦斯以及更多灵体似乎正在呼唤我们。我们是否应追随巴冷公主的脚步，与这哈尼图信仰结缘？"
 convert_to_wa_religions:0 "信奉神道教"
 convert_to_wa_religions_desc:0 "倭岛是一片充满凶悍部落的土地，他们抗拒外来的外交手段，野蛮地守卫着家园——有人说这些特质源自他们的信仰，那是他们力量的源泉。也许我们可以接纳他们的宗教之道为己用？"
 convert_to_yi_religions:0 "接纳彝人信仰"
 convert_to_yi_religions_desc:0 "彝人信仰的奥秘根植于远离我们本土的土地，令人神往，并许诺通过细致研习更深刻地理解人在宇宙中的位置。考虑到我们许多人民目前信奉彝人信仰，将其正式确立为我们的共同信仰并非难事。"
 crafts_workshop_building_cost:0 "工艺作坊建筑成本"
 edge_of_world_path_1:0 "世界边缘"
 edge_of_world_path_1_desc:0 "草原边缘的生活充满了被遗弃者——那些在社会边缘漂泊的被遗忘之人。通过为这些流浪者提供永久的家园，我们将毫无困难地为军队找到替代兵源。"
 form_ainu:0 "成立绳文"
 form_ainu2:0 "成立阿伊努"
 form_ainu2_desc:0 "北方的遥远岛屿属于我们。以征服为权利，我们宣称北海道为一个新民族——阿伊努人的家园，这里是苏苏亚商人和北部北海道绳文人交汇之地。"
 form_ainu_desc:0 "北方的遥远岛屿属于我们，同时也包括倭地本体的大片土地。以征服为权利，我们宣称这些领土及更多土地为己有——成为绳文人的家园。"
 form_china:0 "统一中国"
 form_china_desc:0 "通过将黄河盆地周边各王国与文明的省份、领土和属地统一于中央权威之下，便可宣称天命，建立中华帝国，开创一个新时代。"
 form_funan:0 "成立扶南"
 form_funan_desc:0 "既然我们已经在我们半岛的森林和丛林中建立了统治，我们可以接受大多数外国制图师对此地所用的称呼：扶南。"
 form_golden_chersonese:0 "成立黄金半岛"
 form_golden_chersonese_desc:0 "许多人说这个地方根本不存在，然而我们却站在世界的尽头，还有更多的世界等待征服。"
 form_great_tocharia:0 "成立大吐火罗"
 form_great_tocharia_desc:0 "控制塔里木盆地南北赋予了我们的民族力量优势，使我们能够进一步向西扩张，进入宿敌占领的土地并将其摧毁。大吐火罗策马出击，蹄声给敌人带来苦难与毁灭！"
 form_great_yue:0 "成立大越"
 form_great_yue_desc:0 "越地的腹地，百越信仰的摇篮与堡垒，见证了其居民远离家乡城镇向广阔世界的扩展。如今我们的疆界已与雄心相匹配，也许是时候做出改变了。"
 form_jin:0 "晋之复兴"
 form_jin_desc:0 "几代人之前，晋国被韩、赵、魏三家瓜分；这是我国历史上划时代的时刻，有人说这根本就不该发生。但如今，过去的罪行已得到赎罪，晋国已被我们的双手重新拼合；剩下的唯一要做的就是宣布我们胜利重生的消息。"
 form_malaya:0 "成立马来亚"
 form_malaya_desc:0 "马来人从未被统一为一体，但许多人都说现在就是这样做的时候了。"
 form_steppe_empire:0 "成立草原帝国"
 form_steppe_empire_desc:0 "通过将看似无垠的草原统一于中央权威之下，我们可以建立与定居民族土地上的任何帝国相媲美的帝国！我们的畜群将自由漫游，无论诸神引领至何方，而我们的脚凳将是大地本身……"
 japan_amon_arrows:0 "阿蒙之箭"
 japan_amon_arrows_desc:0 "通过改进我们的武器设计，我们将在战场上取得更大的成功；让我们与制箭工匠合作，看看能做些什么改进。"
 japan_force_of_nature:0 "自然之力"
 japan_force_of_nature_desc:0 "通过将我们各方面的天赋才能汇聚成统一的方向，我们已变得如同一股奔腾不息的巨流，一种势不可挡的自然之力。"
 japan_hacimans_blessing:0 "八幡神的祝福"
 japan_hacimans_blessing_desc:0 "八幡神——深受弓箭手敬爱的战神——注意到了我们令人印象深刻的军事实力，并以他的祝福灌注我军的士兵。"
 japan_island_tactics:0 "岛屿战术"
 japan_island_tactics_desc:0 "我们控制的众多岛屿为我们的水手提供了绝佳的训练场地让他们磨练海战战术。"
 japan_japanese_iron:0 "弥生铁器"
 japan_japanese_iron_desc:0 "在倭国山脉中开采的铁矿常常被锻造成最致命的武器。"
 japan_jomon_techniques:0 "绳文技艺"
 japan_jomon_techniques_desc:0 "让我们学习先辈绳文人的教诲因为古法之中仍有许多智慧可取。"
 japan_mound_works:0 "古坟工程"
 japan_mound_works_desc:0 "因为我们长期以来一直建造墓葬古坟，我们的建筑知识得以提升，工程师们也变得擅长搭建地基和城墙。"
 japan_pacific_pirates:0 "太平洋海盗"
 japan_pacific_pirates_desc:0 "我们的水手和海盗不满足于从水路劫掠的战利品，如今已胆敢袭击城市和港口以掠夺奴隶——这一发展我们恰巧支持。"
 japan_rice_farmer_levies:0 "稻农征召兵"
 japan_rice_farmer_levies_desc:0 "我们有大量身强力壮的男子目前在耕种稻田；昨天的农夫经过适当训练，便能成为明天的士兵。"
 japan_sailors_of_wa:0 "倭之水手"
 japan_sailors_of_wa_desc:0 "通过关照在我们港口寻求庇护的私掠者，我们一定能形成互利的局面。"
 japan_spiritual_war:0 "精神战争"
 japan_spiritual_war_desc:0 "我们的人民深受诸神眷爱，忠诚信守最古老的传统，已成为精神战争的大师，是内在神圣和平的继承者。"
 japan_tribal_ways:0 "部落之道"
 japan_tribal_ways_desc:0 "我们世世代代遵循祖先之道，忠实地践行他们留下的传统，绝不偏离。"
 japan_yayoi_fortifications:0 "弥生城防"
 japan_yayoi_fortifications_desc:0 "弥生人以其坚不可摧的城防所展现的技艺是我们必须为自己掌握的才能。"
 japanese_philosophy:0 "倭国传统"
 japanese_philosophy_desc:0 "倭岛各部落的军事传统是日常生活的重要组成部分；在这片充满无尽仇怨和无休止战争的土地上这是生存的必要条件。"
 light_cavalry_mountain_combat_bonus:0 "轻骑兵山地战斗加成"
 light_infantry_desert_combat_bonus:0 "轻步兵沙漠战斗加成"
 mauryan_tibetan_enable:0 "拥抱印藏影响"
 mauryan_tibetan_enable_desc:0 "令我们懊恼的是，山脉对面蛮族的宗教和文化信仰似乎已在我国人民中流行起来；这是无人能预见的发展。与其对抗不可避免之势，我们或许应接受命运的这一转变。"
 meritocracy_mod_1:0 "扩充宫廷官僚机构"
 meritocracy_mod_2:0 "提拔海军军官"
 meritocracy_mod_3:0 "加强防御工事"
 meritocracy_mod_4:0 "进行人口普查"
 meritocracy_mod_5:0 "加强关税控制"
 meritocracy_mod_6:0 "增强军官团"
 oasis_combat_bonus:0 "绿洲作战加成"
 restoration_of_jin:0 "晋之复兴"
 silk_road_persian_enable:0 "接纳草原影响"
 silk_road_persian_enable_desc:0 "草原那不可抗拒的吸引力在我们人民心中引起了共鸣，他们渴望抛弃我们生活方式的桎梏，投身于那神秘平原所承诺的未知荒野。若我们愿意，可以将其定为国家方略。"
 silk_road_philosophy:0 "喜马拉雅传统"
 silk_road_philosophy_desc:0 "喜马拉雅传统涵盖了喜马拉雅山脉古商道沿线知识与战斗风格的融合，位于草原文明与定居文明的交汇处。"
 steppe_combat_bonus:0 "草原战斗加成"
 steppe_empire:0 "草原帝国"
 steppe_empire_desc:0 "通过将草原上的各路军阀统一在同一面旗帜下而宣告成立，草原帝国是部落游牧民至高无上的政治成就，而一些人错误地认为他们无力组建庞大的联盟。"
 steppe_empire_ruler:0 "皇帝"
 steppe_empire_ruler_female:0 "皇帝"
 steppe_raiders_path_1:0 "草原骑手"
 steppe_raiders_path_1_desc:0 "草原的战士们惯于穿越我们的领土，但其中许多人渴望留下来。我们可以利用他们作为雇佣兵的非凡技艺。"
 steppe_raiders_path_2a:0 "草原战术"
 steppe_raiders_path_2a_desc:0 "草原的骑手们是无可争议的骑兵战大师，通过将他们的战术化为己用，我们可以强化我们的军队。"
 steppe_raiders_path_2b:0 "反劫掠"
 steppe_raiders_path_2b_desc:0 "草原边缘的生活可能极其残酷。主动的反击劫掠将使我们通过威慑对手来保护我们的定居点。"
 steppe_raiders_path_3:0 "恐怖战术"
 steppe_raiders_path_3_desc:0 "草原是一片残酷之地；一刻你还独自与羊群为伴，下一刻你便被成千上万呐喊的劫掠者包围。通过接纳这些劫掠者令人胆寒的战术，我们的敌人将更快屈服。"
 ti_austronesian_path_1:0 "保卫海岸"
 ti_austronesian_path_10:0 "尽取所能"
 ti_austronesian_path_10_desc:0 "我们的水手获准从敌人那里夺走一切能带走的财物；任何手段都是允许的。"
 ti_austronesian_path_11:0 "公海作战"
 ti_austronesian_path_11_desc:0 "我们较小的船只不仅主宰着海岸线，我们的巨舰在公海作战中也无与伦比。"
 ti_austronesian_path_12:0 "强化舰队"
 ti_austronesian_path_12_desc:0 "我们必须竭尽全力鼓舞水手的决心；有了他们我们便拥有一切，没有船只我们便一无所有。"
 ti_austronesian_path_13:0 "河海之间"
 ti_austronesian_path_13_desc:0 "我们的水手精通在河流与海岸线作战的艺术——缺乏回旋空间对我们的船只而言并非难题。"
 ti_austronesian_path_14:0 "海上操练"
 ti_austronesian_path_14_desc:0 "一支训练有素的海军不会在逆境中溃败，而是能克服前进道路上的任何困难。"
 ti_austronesian_path_15:0 "波涛死神"
 ti_austronesian_path_15_desc:0 "我们的#Y 八列桨战舰#!被理所当然地视为死亡先兆；当我们的舰船出现在地平线上时，坟墓之神已在期许地窃笑。"
 ti_austronesian_path_1_desc:0 "如果我们的舰船无法保护我们，那么我们的轻步兵将守护我们的海岸。"
 ti_austronesian_path_2:0 "凭武力之臂"
 ti_austronesian_path_2_desc:0 "以武艺训练我们的士兵将给敌人带来毁灭性的损失。"
 ti_austronesian_path_3:0 "并肩作战"
 ti_austronesian_path_3_desc:0 "一支纪律严明的战斗力量能够承受足以摧毁未受训练者的猛攻。"
 ti_austronesian_path_4:0 "昂扬士气"
 ti_austronesian_path_4_desc:0 "管理军队的秘诀之一就是保持高昂的士气；若要征服，我们的士兵需要坚定的决心。"
 ti_austronesian_path_5:0 "武艺记忆"
 ti_austronesian_path_5_desc:0 "我们的文化崇尚战争和武艺，我们的人民不会轻易忘记他们艰辛学到的教训。"
 ti_austronesian_path_6:0 "快速海军扩张"
 ti_austronesian_path_6_desc:0 "凭借适当的推动，我们可以迅速扩张海军——我们的舰队将快速而精巧地建造起来。"
 ti_austronesian_path_7:0 "掠水而过"
 ti_austronesian_path_7_desc:0 "我们精心建造的舰船令邻国艳羡，它们以非凡的速度和优雅在水面上轻盈掠过。"
 ti_austronesian_path_8:0 "海盗野心"
 ti_austronesian_path_8_desc:0 "公海上的任何船只都是我们水手的猎物，他们是俘获敌人舰船的高手。"
 ti_austronesian_path_9:0 "海洋传统"
 ti_austronesian_path_9_desc:0 "海洋定义着我们的生活方式；它喂养我们、保护我们、滋养我们，我们的人民在海上度过的时间比在陆地上更多。"
 ti_austronesian_philosophy:0 "南岛传统"
 ti_rong_di_path_1:0 "山间骑兵"
 ti_rong_di_path_10:0 "戎人至上"
 ti_rong_di_path_10_desc:0 "我们的生活方式要求我们拥有繁荣的武艺文化来保护我们的人民，而我们已经超越了自己崇高的期望。"
 ti_rong_di_path_11:0 "纪律骑射手"
 ti_rong_di_path_11_desc:0 "我们的骑射手勤勉训练，磨练致命的战术，为战争做好准备。"
 ti_rong_di_path_12:0 "喘息之机"
 ti_rong_di_path_12_desc:0 "在战斗的疯狂中，弱者会在漩涡中崩溃，而我们训练有素的战士却能超越纷乱，依靠训练渡过难关。"
 ti_rong_di_path_13:0 "英勇壮举"
 ti_rong_di_path_13_desc:0 "我们的营中士气高昂，这要归功于我们赞颂英勇壮举的传统——人人都渴望为自己的名字增光添彩。"
 ti_rong_di_path_14:0 "骑射装甲"
 ti_rong_di_path_14_desc:0 "通过改进我们从父辈继承的传统设计，我们可以更好地保护我们的骑射手。"
 ti_rong_di_path_15:0 "死亡骑士"
 ti_rong_di_path_15_desc:0 "当我们的轻骑兵冲锋时，一切希望都破灭了——敌军阵线崩溃，武器被丢弃在地。"
 ti_rong_di_path_1_desc:0 "我们的骑兵在崎岖地形上训练，在山地间作战的轻松自如掩盖了他们所取得成就的艰辛。"
 ti_rong_di_path_2:0 "无情骑士"
 ti_rong_di_path_2_desc:0 "我们骑兵的凶猛令敌人畏惧，他们知道从我们的骑兵手中得不到任何怜悯。"
 ti_rong_di_path_3:0 "骑射手"
 ti_rong_di_path_3_desc:0 "我们的弓箭手在马背上度过一生，向敌军阵线倾洒箭雨后安全地驰骋远离险境。"
 ti_rong_di_path_4:0 "重装战马"
 ti_rong_di_path_4_desc:0 "一旦我们的轻骑兵削弱了敌军阵线，重装战马的一次冲锋通常就能粉碎任何残存的抵抗。"
 ti_rong_di_path_5:0 "披甲骑兵"
 ti_rong_di_path_5_desc:0 "我们的轻骑兵不仅能给敌人造成惨重伤亡，还能有效抵御反击。"
 ti_rong_di_path_6:0 "征服群山"
 ti_rong_di_path_6_desc:0 "我们感激所居住的险峻地形能让我们的骑兵磨练他们的能力。"
 ti_rong_di_path_7:0 "袭扰骑兵"
 ti_rong_di_path_7_desc:0 "我们的先锋部队不惧与敌人交战，积极寻求用袭扰战术骚扰敌军的机会。"
 ti_rong_di_path_8:0 "无畏骑王"
 ti_rong_di_path_8_desc:0 "我们使用的重骑兵无所畏惧，他们为荣耀而战，不顾个人安危。"
 ti_rong_di_path_9:0 "柔缓之地"
 ti_rong_di_path_9_desc:0 "由于我们习惯在山地与森林中作战，在平坦的平原和农田上战斗对我们训练有素的战士来说格外轻松。"
 ti_rong_di_philosophy:0 "戎人传统"
 tibetan_attrition_path_1:0 "经验向导"
 tibetan_attrition_path_1_desc:0 "我们的人民熟知高原的地形地势。挑选他们中最有经验的人作为向导，我们应当能够奇袭即使是最警惕的敌人。"
 tibetan_attrition_path_2:0 "消耗战"
 tibetan_attrition_path_2_desc:0 "低地人不适应高原。我们何必与他们交战，不如撤回我们的堡垒，让大自然来消耗他们？"
 tibetan_fortress_path_1:0 "世界屋脊"
 tibetan_fortress_path_1_desc:0 "青藏高原有时被称为世界屋脊，其海拔对大多数人来说难以忍受。但我们不仅在这片土地上生存，更在此繁荣昌盛。"
 tibetan_fortress_path_2:0 "要塞关隘"
 tibetan_fortress_path_2_desc:0 "天然地形加上人工防御工事，确实应当是相当令人生畏的。"
 tibetan_fortress_path_3:0 "山地社群"
 tibetan_fortress_path_3_desc:0 "每个社群都应当自给自足，能够在受到攻击时独立坚守。"
 tibetan_guerrilla_path_1:0 "社群纽带"
 tibetan_guerrilla_path_1_desc:0 "青藏高原的生活十分艰苦。我们的人民必须日复一日地相互依靠才能生存，那么在战场上又怎能有所不同呢？"
 tibetan_guerrilla_path_2:0 "伏击作战"
 tibetan_guerrilla_path_2_desc:0 "我们也许没有低地的人数、装备或战象，但我们也没有开阔的田野。"
 tibetan_guerrilla_path_3:0 "山地纪律"
 tibetan_guerrilla_path_3_desc:0 "在高原上生存需要自律和克制。通过适当的训练，我们的部队将完全有能力等待合适的时机出击。"
 tibetan_guerrilla_path_4:0 "山岳之怒"
 tibetan_guerrilla_path_4_desc:0 "在我们山中的家园，无人能与我们匹敌；让他们愚蠢地来试试看吧！我们如雄鹰般扑向敌人，将其拖走并从悬崖抛下。"
 tibetan_mauryan_enable:0 "接受藏印影响"
 tibetan_mauryan_enable_desc:0 "外国文化取代了我们人民古老的生活方式已成为不可否认的事实。也许，现在是时候完全接受藏印影响，为我们人民自己的选择给予我们的祝福。"
 tibetan_noble_path_1:0 "贵族领袖"
 tibetan_noble_path_1_desc:0 "让那些出身高贵的人证明自己的价值；愿他们始终冲锋在前，领导我们的征召兵，用他们的存在鼓舞士气。"
 tibetan_noble_path_2:0 "进口武器"
 tibetan_noble_path_2_desc:0 "我们应当利用靠近贸易路线的优势，始终拥有最精良的武器。"
 tibetan_noble_path_3:0 "尚武之责"
 tibetan_noble_path_3_desc:0 "我们精锐士兵中的尚武精神为我们的军队储备了大量能征善战的战士。"
 tibetan_noble_philosophy:0 "吐蕃传统"
 tibetan_noble_philosophy_desc:0 "吐蕃是一个崎岖山脉与险峻山坡构成的严酷地区，居住着一群坚韧的人民，他们会利用这片土地的所有天然优势来保卫家园。吐蕃人民随时准备出击，对抗任何愚蠢到敢在他们地盘上作战的低地势力。\n\n#G 传统焦点#!\n强大的#Y 轻步兵#!\n优秀的#Y 重步兵#!、#Y 要塞#!"
 tocharian_anti_steppe_tactics:0 "反草原战术"
 tocharian_anti_steppe_tactics_desc:0 "我们与草原民族有过许多交往，对他们偏好的军事战术已经了如指掌。久而久之，我们发展出了一套对付他们频繁袭扰的方法。"
 tocharian_chinese_adaptation:0 "华夏适应"
 tocharian_chinese_adaptation_desc:0 "虽然我们相信自身文化的优越性，但当我们发现邻国的传统和方式对我们人民有实用价值时，我们也会乐于采纳。"
 tocharian_city_state_conscription:0 "城邦征兵"
 tocharian_city_state_conscription_desc:0 "当与敌人开战的时刻到来时，我们将拥有庞大的人力资源可供征召——从荒凉的草原到城邦，征兵的号角将响彻四方。"
 tocharian_desert_defenses:0 "沙漠防线"
 tocharian_desert_defenses_desc:0 "构成我们腹地的干旱沙丘是抵御外敌入侵的另一道屏障；沙漠之沙犹如雄伟城池的城墙，将除意志最坚定者之外的所有人挡在远方。"
 tocharian_desert_tactics:0 "沙漠战术"
 tocharian_desert_tactics_desc:0 "虽然沙漠流沙是训练征召兵的艰难环境，但我们克服了这一困难并因此变得更加强大。"
 tocharian_footmen:0 "步兵"
 tocharian_footmen_desc:0 "虽然我们最重视骑兵，但这并不意味着我们的步兵被遗忘；恰恰相反。"
 tocharian_horse_adaptablity:0 "战马适应力"
 tocharian_horse_adaptablity_desc:0 "在马鞍上长大，这是许多草原民族的天赋权利，使我们的骑兵与来自定居城市的骑手相比拥有巨大的优势。"
 tocharian_local_geography:0 "本地地理"
 tocharian_local_geography_desc:0 "当外乡人穿越我们的土地时，他们只看到风沙侵蚀的荒原和崎岖的山隘，不知道我们的本地地理是许多部落民的家园。"
 tocharian_oasis_cities:0 "绿洲城市"
 tocharian_oasis_cities_desc:0 "绿洲是建造城市的理想之地，因为每一位在严酷沙漠景观中跋涉的旅人在有选择时自然会寻求文明的舒适。"
 tocharian_philosophy:0 "吐火罗传统"
 tocharian_philosophy_desc:0 "吐火罗人的军事传统反映了他们所居住的崎岖荒凉之地的特性；只有最强者才能在他们称之为家园的艰难地形中繁衍生息。"
 tocharian_silk_kings:0 "丝绸之王"
 tocharian_silk_kings_desc:0 "通过控制山间通道，我们可以向寻求穿越我们领土的商队收取高额通行费，尤其是对他们运载的丝绸货物。我们收取的通行费已累积成一笔不小的财富，堪比国王。"
 tocharian_steppe_bow_mastery:0 "草原弓术精通"
 tocharian_steppe_bow_mastery_desc:0 "被一支骑射手军队包围，无法攻击敌人却只能被他们从远处射箭，这种战术很少有人能抵御。精通草原弓术将使我们能够以致命效果运用这种策略。"
 tocharian_taklamakan_sands:0 "塔克拉玛干之沙"
 tocharian_taklamakan_sands_desc:0 "塔克拉玛干沙漠无尽的风沙曾吞噬整支整支的军队；进入她无垠的深处时要小心，以免你也迷失在翻涌的沙丘之中。"
 trade_routes_path_1:0 "思想交流"
 trade_routes_path_1_desc:0 "财富并非丝绸之路上流通的唯一商品；知识同样珍贵。"
 trade_routes_path_2:0 "筑垒贸易站"
 trade_routes_path_2_desc:0 "通过建立筑垒的贸易站，我们既能增强防御，又能吸引往来商人的财富。"
 trade_routes_path_3:0 "繁荣集市"
 trade_routes_path_3_desc:0 "大量丰富货物在我们的土地上流通，确保我们在需要时总能找到装备。"
 trade_routes_path_4:0 "宽容"
 trade_routes_path_4_desc:0 "流经我们市场的巨大财富依赖一个关键价值：宽容。所有人都必须知道他们——以及他们的钱币——是受欢迎的。"
 united_malaya_mod:0 "统一的马来亚"
 we_are_tribal_cool:0 "草原帝国政体只能在你已拥有部落政体时解锁。"
 xiongnu_cavalry:0 "匈奴铁骑"
 xiongnu_rise:0 "匈奴崛起"
 yue_bronze_barbarians_mil_trad:0 "青铜蛮族"
 yue_bronze_barbarians_mil_trad_desc:0 "虽然青铜的掌握主要追求军事利益，但往往也会在财政领域带来意想不到的结果。"
 yue_coastal_warfare_mil_trad:0 "海岸作战"
 yue_coastal_warfare_mil_trad_desc:0 "我们的水手熟知地形和海岸线的形状，这在战时给予我们优势，这些知识可用来封锁敌方港口。"
 yue_elephants_of_the_orient_mil_trad:0 "东方战象"
 yue_elephants_of_the_orient_mil_trad_desc:0 "丛林中笨拙温和的巨兽经过适当的军事训练可以成为令人生畏的战争武器。"
 yue_huaxia_ways_mil_trad:0 "华夏之道"
 yue_huaxia_ways_mil_trad_desc:0 "研究我们周围民族的方式可以获益良多；华夏人为我们展示了文明的好处，便是其中一例。"
 yue_jungle_fever_mil_trad:0 "丛林热症"
 yue_jungle_fever_mil_trad_desc:0 "除非一个人完全适应了我们家园的丛林和沼泽，否则将极难避免死于致命疾病。"
 yue_legendary_swords_mil_trad:0 "传奇之剑"
 yue_legendary_swords_mil_trad_desc:0 "我们铁匠锻造的精美宝剑堪称传奇，以其坚固的结构著称，将无与伦比的品质与令人叹为观止的致命优雅融为一体。"
 yue_martial_valor_mil_trad:0 "尚武之勇"
 yue_martial_valor_mil_trad_desc:0 "因为我们的军队在战场上无与伦比，拥有使我们与敌人较弱军队区别开来的尚武精神，我们的征召兵队伍中充满了随时准备保卫家园的振奋青年。"
 yue_one_with_the_water:0 "与水一体"
 yue_one_with_the_water_desc:0 "我们拥有的航海经验使我们不同于邻邦，他们嫉妒地垂涎我们在水面上自如穿行的能力。"
 yue_philosophy:0 "越人传统"
 yue_philosophy_desc:0 "这些在陆地和海上同样游刃有余的娴熟战士，编纂越人战斗传统的军事教条对其敌人而言既可怕又致命。"
 yue_rivermen_mil_trad:0 "河上之民"
 yue_rivermen_mil_trad_desc:0 "我们家园无数的水道和蜿蜒的溪流确保了我们的人民对河流以及如何航行于其上驾轻就熟。"
 yue_royal_armies_mil_trad:0 "王家之师"
 yue_royal_armies_mil_trad_desc:0 "我们的军队不是仓促拼凑的乌合之众，而是一支娴熟专业的军事力量，在王室的全力支持和资助下运作。"
 yue_the_hundred_yue_mil_trad:0 "百越"
 yue_the_hundred_yue_mil_trad_desc:0 "在位于大地尽头、任何人穷尽一生也无法到达的远方伟大皇帝和国王的都城中，他们谈论着百越的力量与威严。"
 yue_tropical_heat_mil_trad:0 "热带酷热"
 yue_tropical_heat_mil_trad_desc:0 "我们地区的炎热和潮湿据说对外邦人来说难以忍受，他们常常难以适应厚重朦胧的空气；这已成为我们意想不到的力量来源。"
 yue_wild_warriors_mil_trad:0 "狂野战士"
 yue_wild_warriors_mil_trad_desc:0 "据说越人战士在战斗将至时，能够使自己陷入一种狂野的狂暴状态，将疯狂的力量加入本已令人生畏的武艺之中。"

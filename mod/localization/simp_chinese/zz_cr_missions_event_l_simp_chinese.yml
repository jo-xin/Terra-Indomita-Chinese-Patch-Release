l_simp_chinese:
 cr_carthage_aelymas_missions.30.a:0 "开战!"
 cr_carthage_aelymas_missions.30.a_tt:0 "战争将在@[GetCountry('CAR').GetFlag]![GetCountry('CAR').GetName|Y]@[GetCountry('MDI').GetFlag]![GetCountry('MDI').GetName|Y]之间展开。\n由于我们的行动，@[GetCountry('MDI').GetFlag]![GetCountry('MDI').GetName|Y]将被认为是侵略者。因此，@[GetCountry('MDI').GetFlag]![GetCountry('MDI').GetName|Y]的防御性联盟将#G #bold 不会#!#!触发。"
 cr_carthage_aelymas_missions.30.a_tt_b:0 "战争将在@[GetCountry('CAR').GetFlag]![GetCountry('CAR').GetName|Y]@[GetCountry('MDI').GetFlag]![GetCountry('MDI').GetName|Y]之间展开。\n由于我们的行动，@[GetCountry('CAR').GetFlag]![GetCountry('CAR').GetName|Y]将被视为侵略者。因此，@[GetCountry('MDI').GetFlag]![GetCountry('MDI').GetName|Y]的防卫联盟#R #bold 将#!#!触发。"
 cr_carthage_aelymas_missions.30.b:0 "我们将等待一个更合适的时机。"
 cr_carthage_aelymas_missions.30.desc:0 "我们的准备工作已经完成，如果我们愿意，我们现在可以与Aelymas开战了。"
 cr_carthage_aelymas_missions.30.t:0 "最后的准备工作"
 cr_carthage_aelymas_missions.40.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen]呼吁援助!"
 cr_carthage_aelymas_missions.40.a_tt:0 "我们将派遣特使前往附近所有国家，以促成结盟。#Y 至少需要15#!正面评价以取得成功。\n#bold 注意：#!这将花费使者至少#Y 10天时间#!抵达目标国。"
 cr_carthage_aelymas_missions.40.b:0 "我们孤军奋战。"
 cr_carthage_aelymas_missions.40.desc:0 "随着阿加索克勒斯被击败，[GetCountry('CAR').GetName]仍在坚守，他们迟早会来敲门；因为，尽管我们最终保证了我们的忠诚，但谁能忘记我们在他们需要的时候背叛了他们？\n\n现在，有消息说迦太基的锻造厂已经被点燃，他们的军队正在操练，看来清算的时刻已经到来......"
 cr_carthage_aelymas_missions.40.t:0 "战争的鼓声"
 cr_carthage_aelymas_missions.41.a:0 "我们站在一起!"
 cr_carthage_aelymas_missions.41.a_tt:0 "#bold 记住：#! 与迦太基的战争即将来临"
 cr_carthage_aelymas_missions.41.b:0 "[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]孤立无援..."
 cr_carthage_aelymas_missions.41.b_tt:0 "我们不会加入即将到来的对迦太基的战争"
 cr_carthage_aelymas_missions.41.desc:0 "几个季度前，当希腊的阿加索克勒斯横渡大海，差点让[GetCountry('CAR').GetName]倒下时，[GetCountry('MDI').GetAdjective][GetCountry('MDI').GetRulerTitle][GetCountry('MDI').GetRuler.GetName]认为明智的做法是改变立场，支持阿加索克勒斯对抗[GetCountry('CAR').GetAdjective]。\n\n现在，随着阿加索克勒斯重返西西里岛，迦太基仍然屹立不倒，[GetCountry('MDI').GetRuler.GetPraenomen]迫切需要新的盟友，因为迦太基已经开始复仇..."
 cr_carthage_aelymas_missions.41.t:0 "[GetCountry('MDI').GetRuler.GetPraenomen]呼吁援助!"
 cr_carthage_aelymas_missions.42.a:0 "我们站在一起!"
 cr_carthage_aelymas_missions.42.desc:0 "我们的特使从[SCOPE.sCountry('prospective_ally').GetCapital.GetName]返回，带来了喜讯：[SCOPE.sCountry('prospective_ally').GetName]的[SCOPE.sCountry('prospective_ally').GetRuler.GetPraenomen][SCOPE.sCountry('prospective_ally').GetRulerTitle]承诺支持[SCOPE.sCountry('prospective_ally').GetRuler.GetHerHis]的人民反对[GetCountry('CAR').GetAdjective]！"
 cr_carthage_aelymas_missions.43.a:0 "更多的羔羊任人宰割。"
 cr_carthage_aelymas_missions.43.desc:0 "我们在[GetCountry('MDI').GetCapital.GetName]的间谍报告称，[SCOPE.sCountry('prospective_ally').GetName]的[SCOPE.sCountry('prospective_ally').GetRuler.GetPraenomen][SCOPE.sCountry('prospective_ally').GetRulerTitle]已经向[SCOPE.sCountry('prospective_ally').GetRuler.GetHerHis]的人民提供了[GetCountry('MDI').GetRuler.GetPraenomen]应加入战争的提议。"
 cr_carthage_aelymas_missions.50.a:0 "一个诱人的交易"
 cr_carthage_aelymas_missions.50.a_desc:0 "如果迦太基在对[GetCountry('MDI').GetAdjective]的战争中获胜，我们将得到上述省份。"
 cr_carthage_aelymas_missions.50.b:0 "婉言谢绝。"
 cr_carthage_aelymas_missions.50.desc:0 "一位来自[PREV.GetCapital.GetName]的特使已经抵达，要求我们支持他们即将到来的对[c:MDI.GetCountry.GetAdjective][c:MDI.GetRuler.GetTitle][c:MDI.GetRuler.GetName]的战争。"
 cr_carthage_aelymas_missions.50.desc_massylia:0 "几个季度前，当阿加索克勒斯横渡大海，差点让[GetCountry('CAR').GetName]倒下时，[GetCountry('MDI').GetAdjective][GetCountry('MDI').GetRulerTitle][GetCountry('MDI').GetRuler.GetName]认为明智的做法是改变立场，支持阿加索克勒斯对抗[GetCountry('CAR').GetAdjective]。\n\n现在，随着阿加索克勒斯返回西西里岛，似乎是[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]重新获得注意的时候了，因为一位特使已经从[GetCountry('CAR').GetCapital.GetName]抵达，提出将我们的领土扩展到[GetCountry('MDI').GetName]：他们将给予我们[GetProvince('(int32)3221').GetName][GetProvince('(int32)8262').GetName][GetProvince('(int32)3217').GetName]和[GetProvince('(int32)3216').GetName]。我们应该在即将到来的针对[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]的战争中支持他们吗？"
 cr_carthage_aelymas_missions.50.desc_musulamia:0 "几个季度前，当阿加索克勒斯横渡大海，差点让[GetCountry('CAR').GetName]倒下时，[GetCountry('MDI').GetAdjective][GetCountry('MDI').GetRulerTitle][GetCountry('MDI').GetRuler.GetName]认为明智的做法是改变立场，支持阿加索克勒斯对抗[GetCountry('CAR').GetAdjective]。\n\n现在，随着阿加索克勒斯返回西西里岛，似乎是[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]重新获得注意的时候了，因为一位特使已经从[GetCountry('CAR').GetCapital.GetName]抵达，提出将我们的领土扩展到[GetCountry('MDI').GetName]，他们将会给与我们[GetProvince('(int32)3238').GetName]和[GetProvince('(int32)3240').GetName]。我们应该在即将到来的针对[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]的战争中支持他们吗？"
 cr_carthage_aelymas_missions.50.t:0 "流沙"
 cr_carthage_aelymas_missions.51.a:0 "很好。"
 cr_carthage_aelymas_missions.51.desc:0 "我们的特使已经从[SCOPE.sCountry('prospective_ally').GetCapital.GetName]返回，带来了好消息，[SCOPE.sCountry('prospective_ally').GetName]的[SCOPE.sCountry('prospective_ally').GetRuler.GetPraenomen][SCOPE.sCountry('prospective_ally').GetRulerTitle]已承诺其人民在即将到来的战争中支持反对[GetCountry('MDI').GetRuler.GetPraenomen][GetCountry('MDI').GetRulerTitle]。"
 cr_carthage_aelymas_missions.51.t:0 "努米底亚的盟友。"
 cr_carthage_aelymas_missions.52.a:0 "拒绝仍然是拒绝。"
 cr_carthage_aelymas_missions.52.desc:0 "我们的特使从[SCOPE.sCountry('prospective_ally').GetName]回来了，带来了[SCOPE.sCountry('prospective_ally').GetAdjective]将不支持我们的消息。当然，是以最谄媚和外交的方式带来的..."
 cr_carthage_aelymas_missions.53.a:0 "多么粗鲁啊!"
 cr_carthage_aelymas_missions.53.a_tt:0 "我们应该做好最坏的打算!"
 cr_carthage_aelymas_missions.53.b:0 "我们不受他们协议的约束。"
 cr_carthage_aelymas_missions.53.desc_massylia:0 "[SCOPE.sChar('random_advisor').GetName]最近在[p:3233.GetName]附近照看他的羊群时，发现一个浮夸的[c:CAR.GetCountry.GetAdjective]商队沿着[p:3233.GetName]以西的巴格拉达斯航行。"
 cr_carthage_aelymas_missions.53.desc_musulamia:0 "[SCOPE.sChar('random_advisor').GetName]最近在[GetCountry('MSL').GetCapital.GetName]花了一些时间，带来了高级[c:CAR.GetCountry.GetAdjective]使节被[GetCountry('MSL').GetRuler.GetName]招待的消息。"
 cr_carthage_aelymas_missions.53.t:0 "行动和反行动"
 cr_carthage_aelymas_missions.55.desc:0 "[GetCountry('CAR').GetName]与马西里和穆苏拉米之间达成的正式协议迫使我们将领土移交给他们。"
 cr_carthage_aelymas_missions.55.t:0 "恶作剧"
 cr_carthage_invasion_missions.1.a:0 "一场精彩的比赛"
 cr_carthage_invasion_missions.1.a_tt:0 "将在 @[GetCountry('CYR').GetFlag]! [GetCountry('CYR').GetName|Y]与 @[GetCountry('CAR').GetFlag]![GetCountry('CAR').GetName|Y]之间接创建一个新的边界，并获得#Y 40年的停战期#!。"
 cr_carthage_invasion_missions.1.b:0 "也许我们可以为我们的跑步者提供一点帮助......"
 cr_carthage_invasion_missions.1.b_tt:0 "边界将推进到比原来更远的西部。"
 cr_carthage_invasion_missions.1.desc:0 "当阿伽托克勒斯为反对迦太基人而入侵非洲时，他呼吁所有的希腊人帮助他对付他曾经的敌人。我们的前任统治者俄斐拉斯响应号召，沿着希尔提斯河出发，到非洲与阿伽托克勒斯会合，并被许诺在非洲拥有广阔的领土。然而，当他到达那里时，阿伽托克勒斯迅速将他杀死并控制了我们的军队。\n\n迦太基人虽然成功地将阿伽托克勒斯赶回了西西里，但似乎不愿意再冒这样的风险。现在，他们向我们提出了一个建议：为了对两国所控制的流沙地带进行永久性势力范围划分，防止未来的冲突，他们建议在他们最好的选手和我们的选手之间进行跑步比赛，他们在同一天出发——将在他们碰巧遇到的任何地方解决边界问题。"
 cr_carthage_invasion_missions.1.desc_other_country:0 "当阿伽托克勒斯为反对迦太基人而入侵非洲时，他呼吁所有的希腊人帮助他对付他曾经的敌人。昔兰尼加的前任统治者俄斐拉斯响应号召，沿着希尔提斯河出发，到非洲与阿伽托克勒斯会合，并被许诺在非洲拥有广阔的领土。然而，当他到达那里时，阿伽托克勒斯迅速将他杀死并控制了我们的军队。\n\n迦太基人虽然成功地将阿伽托克勒斯赶回了西西里，但似乎不愿意再冒这样的风险。现在，他们向我们提出了一个建议：为了对两国所控制的流沙地带进行永久性势力范围划分，防止未来的冲突，他们建议在他们最好的选手和我们的选手之间进行跑步比赛，他们在同一天出发——将在他们碰巧遇到的任何地方解决边界问题。"
 cr_carthage_invasion_missions.1.t:0 "追求名利的人"
 cr_carthage_invasion_missions.11.a:0 "迦太基将经久不衰。"
 cr_carthage_invasion_missions.11.desc:0 "今天在[GetProvince('(int32)3256').GetName]举行了盛大的庆祝活动，因为新城墙的最后一段已经完成。两年来，我们一直在努力确保我们的城市免受未来的入侵，艰苦的工作得到了回报：一系列的三座更令人印象深刻的城墙现在横跨连接迦太基和主地的地峡。第一道城墙不过是一道沟渠和栅栏，但第三道城墙高出前面的平原15米，塔楼甚至比它高9米。\n\n我们再也不用担心阿伽托克勒斯的入侵了：这些城墙肯定能阻止最坚定的入侵者。"
 cr_carthage_invasion_missions.11.t:0 "迦太基的城墙"
 cr_carthage_invasion_missions.12.a:0 "一头勇敢的、训练有素的大象抵得上一千匹马。"
 cr_carthage_invasion_missions.12.desc:0 "在海德斯佩斯，亚历山大第一次在战斗中遇到了大象，并向世界介绍了大象的功效。据说在战斗中面对这样的野兽是一种可怕的经历，它们不止一次成功地扭转了战局。这些野兽给人留下了如此深刻的印象，似乎希腊征服者自己也在战斗中使用了大象。\n\n碰巧的是，我们的土地上也有大象，虽然它们不像东方的大象那样凶猛，但也可以被驯服和训练用于战争。为了让我们了解这种潜力，迦太基的城墙上已经准备好了能够容纳200头这种野兽的围栏，如果有需要的话。"
 cr_carthage_invasion_missions.12.t:0 "象栏"
 cr_carthage_invasion_missions.13.a:0 "神圣的爱对人的体现。"
 cr_carthage_invasion_missions.13.desc:0 "迦太基北部的平原长期以来一直遍布着小庄园和农庄，形成了一个类似于郊区的新城市。然而，它缺乏适当的保护，无法抵御外界和努米底亚人的袭击，因此无法发展成真正的城市。最近完成的迦太基的新城墙，现在将整个平原包围起来，势必会改变这种状况，让这个郊区--梅加拉--繁荣起来。\n\n城市的精英们已经把目光投向了麦加拉，在平原各地购买房产，建立他们的别墅和庄园。因此，该地区现在正迅速转变为一个花园城市，到处是橄榄园和长满果树的花园，被矮墙、树篱和荆棘分割开来。"
 cr_carthage_invasion_missions.13.t:0 "麦加拉"
 cr_carthage_invasion_missions.14.t:0 "瓦加"
 cr_carthage_invasion_missions.15.a:0 "有什么比开采货币本身更有利可图？"
 cr_carthage_invasion_missions.15.desc:0 "贸易曾经是一件简单的事情：你提供一件物品，他们提供一件物品作为交换。双方都能立即得到自己需要和渴望的东西。对于内地的小部落来说，这仍然是一种方式，但在迦太基却不是。为了抵御西西里岛上贪婪的希腊人，我们不得不用银币来支付雇佣兵以增强我们的军队。现在，银币的使用已经渗透到迦太基生活的各个方面，对这种贵金属的需求永远无法满足。\n\n幸运的是，我们在非洲的土地上盛产白银，我们在Trisipensis的矿场也送来了大量的人才，准备用来铸币。"
 cr_carthage_invasion_missions.15.t:0 "白银的天赋"
 cr_carthage_invasion_missions.16.a:0 "有什么比开采货币本身更有利可图？"
 cr_carthage_invasion_missions.16.desc:0 "白银不仅在我们Trisipensis的土地上发现，在其他地方也有。我们在穆斯提的矿场也被证明是高产的，并送来了一大批准备好的银币。"
 cr_carthage_invasion_missions.16.t:0 "白银的人才"
 cr_carthage_invasion_missions.17.a:0 "我们安枕无忧。"
 cr_carthage_invasion_missions.17.desc:0 "自从阿加索克勒斯入侵并迫使我们的姐妹城市迦太基从西西里岛撤军以来，已经过去多年。虽然阿加索克勒斯可能没有成功征服我们姐妹城市的土地，但他确实迫使迦太基放弃了统治西西里的企图。从那时起，她一直在努力加强对非洲土地的控制，对城市和周围的乡村进行深入投资。这并不是徒劳的，因为稳定和繁荣的气息正在空气中弥漫。"
 cr_carthage_invasion_missions.17.t:0 "入侵的后果"
 cr_carthage_invasion_missions.18.a:0 "我们安枕无忧。"
 cr_carthage_invasion_missions.18.desc:0 "自从阿加索克勒斯入侵并迫使我们的姐妹城市迦太基从西西里岛撤军以来，已经过去多年。虽然阿加索克勒斯可能没有成功征服我们姐妹城市的土地，但他确实迫使迦太基放弃了统治西西里的企图。从那时起，她一直在努力加强对非洲土地的控制，对城市和周围的乡村进行深入投资。这并不是徒劳的，因为稳定和繁荣的气息正在空气中弥漫。"
 cr_carthage_invasion_missions.18.t:0 "入侵的后果"
 cr_carthage_invasion_missions.19.a:0 "每个人都是靠交换而活。"
 cr_carthage_invasion_missions.19.desc:0 "我们的城市拥有得天独厚的地理位置--主导地中海西部的贸易--和两个泻湖--形成绝佳的天然港口，供船只停泊和卸货。不太得天独厚的是通往泻湖的通道：每次风暴都会在泻湖口抛出一个新的沙洲，而保持连接城市和海洋的通道畅通是一项全职工作。\n\n沿着海堤建造的码头将大大改善这种情况。这个巨大的石头结构覆盖了危险的悬崖，使船只可以直接从海上装卸货物，避免了通过狭窄和危险的通道进入泻湖。"
 cr_carthage_invasion_missions.19.t:0 "迦太基的乔马"
 cr_carthage_invasion_missions.2.a:0 "拿铲子来……"
 cr_carthage_invasion_missions.2.desc:0 "为了防止我们和昔兰尼加人再发生敌对行动，我们派出了一对赛跑者参加比赛，他们也派出了一对赛跑者。无论他们在哪里相遇，都将成为我们沿着两个叙耳提斯各自势力范围的未来分界点。\n\n我们的赛跑者腓莱尼兄弟比昔兰尼加赛跑者跑得快得多。昔兰尼加人因暴风雨或懒惰而耽搁了时间，他们指责腓莱尼兄弟作弊，并给了他们一个选择：要么他们同意被活埋在这个地方，那里就是边界的延伸处，要么允许昔兰尼加人前进一步直到他们同意对他们做同样的事情......"
 cr_carthage_invasion_missions.2.t:0 "腓莱尼忠骨坛"
 cr_carthage_invasion_missions.3.a:0 "颇为感人的活死人表演"
 cr_carthage_invasion_missions.3.a.tt:0 "这个条约导致了我们和迦太基之间#B 40 #! 年的休战。"
 cr_carthage_invasion_missions.3.desc:0 "为了防止我们和迦太基人之间未来的敌对行动，我们派出了一对跑步者进行较量，他们也派出了一对跑步者。无论他们在哪里相遇，都将是未来我们各自的势力范围沿着两个西提斯的分界点。\n\n我们的使节设定了一个很好的速度，但不知何故，他们的使节，菲莱尼兄弟，设法快得多，并在大西提斯的底部与我们的使节相遇，离半程点还远。然而，当被指控作弊时，菲莱尼兄弟允许自己被活埋，以维护他们和他们同胞的荣誉。他们的埋葬地现在划定了边界的走向。"
 cr_carthage_invasion_missions.3.t:0 "腓莱尼忠骨坛"
 cr_carthage_invasion_missions.4.a:0 "这一定是犯规的行为..."
 cr_carthage_invasion_missions.4.desc:0 "为了防止我们日后与昔兰尼加人产生冲突，我们派出了一对选手参加比赛，他们也派出了一对选手。无论他们在哪里相遇，都将是我们各自的势力范围在叙耳提斯的分界点。\n\n我们的特使是一对著名的跑者，叫做菲莱尼兄弟，他们完全有信心击败昔兰尼加的希腊人，确定一个有利于我们的边界。然而，他们似乎低估了希腊人，因为他们在比预期更近的西方遇到了他们....."
 cr_carthage_invasion_missions.4.t:0 "追求名声的人"
 cr_carthage_invasion_missions.5.a:0 "还是很有利的。"
 cr_carthage_invasion_missions.5.a.tt:0 "这个条约使我们和迦太基之间实现了#B 15 #! 年的休战。"
 cr_carthage_invasion_missions.5.desc:0 "为了防止我们和迦太基人之间未来的敌对行动，我们派出了一对选手进行比赛，他们也派出了一对选手。无论他们在哪里相遇，都将是未来我们各自的势力范围沿着两个西提斯的分界点。\n\n这样重要的事情自然不应该留给机会和人的能力，我们帮助我们的使节抢占先机，尽可能多地争取领土。然而，迦太基人让我们大吃一惊，他们的使节在比我们预期的更远的东面与我们的使节相遇。看来，奸诈的迦太基人并没有把事情交给命运。由于不愿意强求，双方都同意在他们相遇的地方解决边界问题，大约是两个西提斯之间的一半。"
 cr_carthage_invasion_missions.5.t:0 "追求名声的人"
 cr_carthage_invasion_missions.6.a:0 "香料必须流动。"
 cr_carthage_invasion_missions.6.desc:0 "罗盘草价值连城，但昔兰尼加人嫉妒地保护着他们对这种草药的垄断，阻止我们的商人从中获利。只有一小部分通过在两个瑟提斯沿岸经营的走私者到达我们这里。\n\n我们已经在哈拉克斯建立了一个商场，这是罗盘草走私者最喜欢的聚会地点。在那里，我们可以更好地控制走私活动，甚至可能打破昔兰尼加的垄断……"
 cr_carthage_invasion_missions.6.t:0 "叙耳提斯的走私者"
 cr_carthage_invasion_missions.7.a:0 "是时候打击走私活动了。"
 cr_carthage_invasion_missions.7.a.tt:0 "这个选项可以防止迦太基打破罗盘草的垄断。"
 cr_carthage_invasion_missions.7.b:0 "可能发生的最坏情况是什么？"
 cr_carthage_invasion_missions.7.b.tt:0 "不干涉贸易，使迦太基有适度的机会从罗盘草贸易中获利。"
 cr_carthage_invasion_missions.7.desc:0 "罗盘草是一种价值连城的草药，有许多用途，可以作为药物、调味品、香水和春药，而且只生长在我们的山区。然而，奸诈的迦太基人似乎并不满足于让我们拥有这种宝贵的商品：他们在大希尔提斯地区开设了一个商场，显然是希望吸引那些打破我们垄断的走私者。"
 cr_carthage_invasion_missions.7.t:0 "叙耳提斯的走私者"
 cr_carthage_invasion_missions.8.a:0 "香料的流动。"
 cr_carthage_invasion_missions.8.desc:0 "我们在哈拉克斯（Charax）建立的旨在打入昔兰尼加罗盘草垄断市场的商场似乎得到了回报：在航海季节，每周都有船运来，准备卸下他们珍贵的罗盘草，以换取我们的银、香水和染料。从哈拉克斯出发，罗盘草被运往[ROOT.GetCountry.GetCapital.GetName]，从那里分销于整个地中海地区。"
 cr_carthage_invasion_missions.8.t:0 "罗盘草贸易"
 cr_carthage_invasion_missions_1_disreputable_ruler_tooltip:0 "由于 [ROOT.GetCountry.GetRuler.GetName] 的声名狼藉的性格，此选项可用。"

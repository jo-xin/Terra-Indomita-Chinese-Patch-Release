l_simp_chinese:
 MOHE_ADJECTIVE:0 "靺鞨"
 MOHE_NAME:0 "靺鞨"
 desc_sushen_capital_mod:0 "此领土因该区域贸易之增长而获益匪浅；商贾欣然来寻此地之市集，经济蒸蒸日上。"
 desc_sushen_chinese_trade:0 "因我邦以制作至为精美奢华之货物而闻名，华夏诸邦已遣其商贾前来我市场，希冀以折价获取我邦之器物。"
 desc_sushen_conversion_mod:0 "宗教狂热已攫住子民之心，众多人已重新将生命奉献于诸神。"
 desc_sushen_organised_army:0 "我诸部族首领已重整我邦军事力量，并使之经受严苛之训练。"
 me_sushen_1.a:0 "鞍囊之中，能携之物尽可塞满！"
 me_sushen_10.a:0 "神明所赐如此丰厚——此不过微末耳"
 me_sushen_10_desc:0 "[ROOT.GetCountry.GetRuler.GetName]将遗留[ROOT.GetCountry.GetName]人民众多遗产之一，乃我辈宗教习俗之变革。往昔，我民敬拜随心，有人择行他人视作多余之仪轨，然此已为陈迹。\n\n得祭司之支持，[ROOT.GetCountry.GetRuler.GetFirstName]已将正道之虔诚编为规范，并谕令我族子民接纳此等礼法[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_sushen_10_title:0 "$sushen_missions_task_10$"
 me_sushen_11.a:0 "带我的祝福去吧，在冀地好好享受"
 me_sushen_1100.a:0 "成袋黄金送上门来，吾等永不拒绝"
 me_sushen_1100_desc:0 "奇者，数日前有[GetCountry('HSH').GetName]之使者携礼而至。显然此乃其首领[GetCountry('HSH').GetRuler.GetName]之愿，使两国间存和睦之态。\n\n此异邦使者格外礼貌，不曾久留，在我庙宇中献祭，数日内便离去矣。"
 me_sushen_1100_title:0 "肃慎来使"
 me_sushen_11_desc:0 "[ROOT.GetCountry.GetRuler.GetName]近来向[GetCountry('YAN').GetCapital.GetName]之[GetCountry('YAN').GetRuler.GetName]朝廷示好，询问邻邦是否愿接纳[ROOT.GetCountry.GetCapital.GetName]之使团。我[ROOT.GetCountry.GetRulerTitle]久慕燕国，愿加强彼此联系。实言相告，[ROOT.GetCountry.GetRuler.GetFirstName]有朝一日愿征服此国，然此乃后话。\n\n当燕国肯接纳我使节之消息传回[ROOT.GetCountry.GetName]时，举国欢腾，出发之准备已即刻着手。"
 me_sushen_11_title:0 "$sushen_missions_task_11$"
 me_sushen_12.a:0 "我之灵魂为失怙者哀痛…然我不得不为"
 me_sushen_12_desc:0 "虽是[ROOT.GetCountry.GetRuler.GetName]最终下令出师[GetCountry('YAN').GetName]，然此令亦使[ROOT.GetCountry.GetRulerTitle]心中暂掠过一丝哀戚，[ROOT.GetCountry.GetRuler.GetHerHis]心中对此地之民确有怜意。\n\n然而[ROOT.GetCountry.GetName]之外策不能受儿女情长所左右，当行之事，必行无疑。燕人战得光荣，已倾其所能，以此，彼等将作为可敬之敌手被铭记。\n\n然其权势之夕阳已沉，彼等已坠入无尽之长夜。"
 me_sushen_12_title:0 "$sushen_missions_task_12$"
 me_sushen_13.a:0 "已无退路——自今日起唯有前行"
 me_sushen_13_desc:0 "我辈荣耀之日已至！逆一切劫数，[ROOT.GetCountry.GetRuler.GetName]引领我军接连克捷，自我东境崎岖之林地，直捣中原权贵珠光宝气之殿堂。无人能阻我辈之锋，湮灭之王国，其灰烬被我辈传奇战士之蹄踏碎。\n\n异邦之史乘再也不得轻慢我辈为蛮夷猎户，因其已学会正面畏我族之威。遣骑士奔赴大地四方，宣告#E 靺鞨#!之崛起！"
 me_sushen_13_title:0 "$sushen_missions_task_13$"
 me_sushen_1_desc:0 "虽在林地中训练骑兵从非易事，然我士卒于此艰难之境中表现卓异，甚至超越了[ROOT.GetCountry.GetRuler.GetName]对其所寄之厚望。\n\n今我#E 诸部酋长#!来报，我骑兵已堪一战——士气空前高昂，劫掠之诺驱使兵士战如恶鬼。此一代[ROOT.GetCountry.GetAdjective]战士，将成为缔造伟大邦国之人；据各方所说，[ROOT.GetCountry.GetRuler.GetFirstName]重整武备之举，已获前所未有之成功。"
 me_sushen_1_title:0 "$sushen_missions_task_1$"
 me_sushen_2.a:0 "千里之行始于足下，今正是其时"
 me_sushen_2_desc:0 "值我辈着手统一周围涣散之通古斯诸部之际，一宏大念想已入[ROOT.GetCountry.GetRuler.GetName]之脑；何必安于不全之征服？我辈岂容他人夺我理所当然之所有？\n\n我[ROOT.GetCountry.GetRulerTitle]已将[ROOT.GetCountry.GetRuler.GetHerHis]目光定于不朽之荣光，而今唯诸神之意志可阻[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_sushen_2_title:0 "$sushen_missions_task_2$"
 me_sushen_3.a:0 "授权各部会议行地方之政"
 me_sushen_3.b:0 "岂不该由我一人定夺万事？"
 me_sushen_3.c:0 "我信赖我族各部世家"
 me_sushen_3.d:0 "[ROOT.GetCountry.GetName]唯强者可昌！"
 me_sushen_3_desc:0 "纵令在最佳时机，使好争之#E 诸部酋长#!同意任一事务皆为难事，然[ROOT.GetCountry.GetRuler.GetName]再次挽狂澜于既倒，现已有定论：变更部分律法之时机，终已成熟。一场即兴之部落会议已聚于[ROOT.GetCountry.GetCapital.GetName]，以议此等重大事项。\n\n以表对[ROOT.GetCountry.GetRuler.GetFirstName]之敬意，会议将允准[ROOT.GetCountry.GetRulerTitle]作最终定夺——我辈当施行何法？"
 me_sushen_3_title:0 "$sushen_missions_task_3$"
 me_sushen_4.a:0 "人人皆可与吾等和平共处"
 me_sushen_4_desc:0 "当敌人始悟[ROOT.GetCountry.GetRuler.GetName]所构成之威胁时，为时已晚矣——我[ROOT.GetCountry.GetRulerTitle]已屡屡挫败阻止[ROOT.GetCountry.GetRuler.GetHerHim]之图谋，一再压倒我敌。\n\n众多肃慎族人已迁至我都城，弃其旧居，此乃未来属于[ROOT.GetCountry.GetCapital.GetName]之明证，彰显我辈蒸蒸日上之势。"
 me_sushen_4_title:0 "$sushen_missions_task_4$"
 me_sushen_5.a:0 "我倒想看看蛮夷如何尝试…"
 me_sushen_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，西境有佳音来报；新筑之堡垒不仅确保我从草原游牧部族手中夺取之地永为我据，且有精于筑城之匠师已从[ROOT.GetCountry.GetCapital.GetName]遣往[GetProvince('(int32)9526').GetName]与[GetProvince('(int32)9561').GetName]，以加强边地守备。\n\n我辈贵族，欣悦于肃慎领袖所带来之胜利，正豪言西部游牧之族再也无法越我边界半步。"
 me_sushen_5_title:0 "$sushen_missions_task_5$"
 me_sushen_6.a:0 "百姓安乐，则我心亦安"
 me_sushen_6_desc:0 "虽多有灾殃之日与不吉之讯，然今日绝非如此，[ROOT.GetCountry.GetRuler.GetName]，反之，臣等奉来沃野良田养民之佳音。我粮仓盈满达空前之盛，绝无饥荒肆虐、摧毁我辈势头之虞。黎庶饱腹炙肉，歌颂我[ROOT.GetCountry.GetRulerTitle]，举米酒之杯祝[ROOT.GetCountry.GetRuler.GetHerHis]安康。"
 me_sushen_6_title:0 "$sushen_missions_task_6$"
 me_sushen_7.a:0 "国中货物繁多…开个价吧！"
 me_sushen_7_desc:0 "近数月来，中国商船沿我海岸航行之景已为常见，堪与之媲美者，唯有商队不畏艰险穿行陆路以达[ROOT.GetCountry.GetCapital.GetName]市集之壮观。\n\n似此看来，中国人——甄别价值之大师——对我珍奇商品欲求不满，令[ROOT.GetCountry.GetName]之府库充盈欲裂——此情状，[ROOT.GetCountry.GetRuler.GetName]深以为佳。"
 me_sushen_7_title:0 "$sushen_missions_task_7$"
 me_sushen_8.a:0 "前进，肃慎征夫——真正的荣光在等待！"
 me_sushen_8_desc:0 "#E 辰#!之山川丘陵，不能阻挡我师征服其地；我辈战士自幼即乘于马上，终日在故土之山林间游猎。\n\n纵使辰之北境不及南地人稠发达，然不需多时，我士卒便将立于辰国诸城之墙下。"
 me_sushen_8_title:0 "$sushen_missions_task_8$"
 me_sushen_9.a:0 "哈——自然非我。彼等罪有应得更甚，然我慈悲为怀"
 me_sushen_9_desc:0 "我凯旋之师已将诸神之裁决倾泻于腐败之#E 辰国诸邦#!，彼等如低垂枝头之腐李，落入我手。\n\n虽诸三韩之族试图整军以御，意识到我辈战士所代表之存亡威胁，然其所投向我军之一切皆终归失败；彼等于战场上难敌我力，其城防亦不能守住其城。彼等之时机已逝，有谁会为已逝之物坠一滴泪乎？"
 me_sushen_9_title:0 "$sushen_missions_task_9$"
 sushen_capital_mod:0 "区域贸易增长"
 sushen_chinese_trade:0 "华夏贸易纽带"
 sushen_conversion_mod:0 "皈依精神"
 sushen_missions:0 "崎岖东陲"
 sushen_missions_BUTTON_TOOLTIP:0 "时候已到，让天下见识我们的真正面目！"
 sushen_missions_CRITERIA_DESCRIPTION:0 "此任务将于肃慎诸部完成内部改革、将族人统一于一面旗帜之下，并征服区域内与我争雄之敌手时完成。"
 sushen_missions_DESCRIPTION:0 "天下诸多邦国，竟不知我族之存在，南方诸王史册中对我民之记载，即便提及，亦不过寥寥数笔，视为奇闻而已。吾等乃是居于蛮荒东方之民，于广袤森林中安家，其间唯见崇山峻岭与无边草原之际。\n\n试想外人发觉吾等并非传说——既非栖于文明边际，亦非存于想象之境——而实为注定建立永恒王国之雄武征服者时，该是何等惊愕！吾等即是#E肃慎#!，凡阻我道路者，决不宽贷。"
 sushen_missions_task_1:0 "整编军队"
 sushen_missions_task_10:0 "规范仪轨"
 sushen_missions_task_10_DESC:0 "虽我之民久已惯于依各自方式敬奉神明，遵循当地传统习俗，然[ROOT.GetCountry.GetCapital.GetName]已有动议，主张将宗教仪轨纳入国家正式体制。\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 sushen_missions_task_11:0 "遣使至冀"
 sushen_missions_task_11_DESC:0 "[GetCountry('YAN').GetName]之民乃高尚之族，与我北方诸部久有贸易往来，诸多华夏邦国视我为蛮夷，而燕则不在此列，其敬重我传统与生活之道。今我已有能力施展权势，宜考虑向燕国之都[GetProvince('(int32)8742').GetName]致送外交赠礼。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 sushen_missions_task_12:0 "翻越群山"
 sushen_missions_task_12_DESC:0 "虽我有时与[GetCountry('YAN').GetName]邦交甚睦，然此绝非保证其可免于未来之侵伐——[ROOT.GetCountry.GetRuler.GetName]已立誓，一旦良机降临，必挥师南下。\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 sushen_missions_task_12_claims:0 "我们将获得对#Y 冀#!、#Y 青#!和#Y 幽#!地区的宣称。"
 sushen_missions_task_13:0 "派系稳定"
 sushen_missions_task_13_DESC:0 "历经漫长岁月，真正之繁荣与稳定终降临于[ROOT.GetCountry.GetName]，此一切全赖[ROOT.GetCountry.GetRuler.GetName]及[ROOT.GetCountry.GetRuler.GetHerHis]诸谋臣无与伦比之努力，率我族人穿越纷争之期而至黄金盛世。\n\n境遇之变迁，亟需向天下宣告我之伟业——愿我仇雠在#Y靺鞨#!之进逼前颤栗不已。\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 sushen_missions_task_1_DESC:0 "若尚有制服周遭敌对诸邦之念想，则必当自上而下彻底重整我军武力。\n\n不仅须训练征集之兵，使其备妥面对来日之艰危，更须储积金属@base_metals!、野味@wild_game!，尤其毛皮@fur!，以便士卒得获精良之装备。\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 sushen_missions_task_2:0 "统一诸部碎片"
 sushen_missions_task_2_DESC:0 "我族胞分散于各部之间，彼此猜忌，不愿为宏大目标而联为一体。然[ROOT.GetCountry.GetRuler.GetName]不忍坐视我族之力分散消弭；必当将诸碎片统合为一整体，使我辉煌文明得以繁荣昌盛！\n\n\n\n\n\n\n\n\n\n@east_steppemil3! "
 sushen_missions_task_2_claims:0 "吾等将获得对#Y秽发#!、#Y乌苏里#!、#Y肃慎#!、#Y阿穆尔#!、#Y萨哈连#!、#Y玄菟#!及#Y临屯#!诸地之宣称。"
 sushen_missions_task_3:0 "重组部族"
 sushen_missions_task_3_DESC:0 "革新之精神既已充盈我精英之心，遂有议者，谓当趁此时机重整律法与祖制。然践此步骤之前，须确保#Y氏族首领#!与我同心同德。\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 sushen_missions_task_3_choose_between_laws:0 "我们将能够在数种法律中选择。"
 sushen_missions_task_4:0 "制霸敌对的靺鞨"
 sushen_missions_task_4_DESC:0 "吾等决不容许任何他人与吾并立，凡试图阻挠[ROOT.GetCountry.GetRuler.GetName]之意志者，必将征服之、主宰之！\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 sushen_missions_task_4_claims:0 "我们将获得对#Y 饶乐#!、#Y 乌桓#!和#Y 大鲜卑山东部#!地区的宣称。"
 sushen_missions_task_5:0 "西部游牧"
 sushen_missions_task_5_DESC:0 "吾等不可忽视西方之游牧部落；我族与彼等之间，历来兵戎相见，料我两军他日必将再度交锋。掌控西方草原，可为我提供充足屏障以御其散兵游骑，故此事已成当务之急。\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 sushen_missions_task_6:0 "养活吾民"
 sushen_missions_task_6_DESC:0 "虽我之心力多置于外务，然断不可疏忽故土之同胞，而为贤明之[ROOT.GetCountry.GetRulerTitle]者，其职责之一即是确保百姓有充足之美食果腹。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 sushen_missions_task_7:0 "为华夏备办奢华"
 sushen_missions_task_7_DESC:0 "天下皆知我南方之华夏人垂涎我珍贵之货品，而所幸者，彼等有充足之金银，愿以之交换我之珍馐——且遂商贾所愿！\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 sushen_missions_task_8:0 "蹂躏辰邦"
 sushen_missions_task_8_DESC:0 "沙场之势似尽在我方，我凯旋之师已厉兵秣马，欲席卷#E 辰#!之地——是时也，当掠取异族之奴、劫夺濊貊诸部之省邑。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 sushen_missions_task_8_claims:0 "吾等将获得对#Y辽东#!、#Y乐浪#!、#Y马韩#!、#Y辰韩#!、#Y弁韩#!及#Y马韩南#!诸地之宣称。"
 sushen_missions_task_9:0 "辰国诸邦的覆灭"
 sushen_missions_task_9_DESC:0 "哀哉，哀哉，辰韩诸国！自恃城郭之固，骄奢淫逸，于大地之上留下诸多逆天罪行。然我师如净化之北风，席卷其境，终结彼等之腐朽。\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 sushen_opinion_mod:0 "贡矢"
 sushen_organised_army:0 "重整军队"

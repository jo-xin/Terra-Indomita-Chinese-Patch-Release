l_simp_chinese:
 SATRAPY_OF_THRACE:0 "色雷斯总督领"
 THRACIAN_SATRAPY_ADJECTIVE:0 "色雷斯"
 administrating_empire_tt:0 "我们将选择如何管理我们的帝国。"
 alexanders_first_city:0 "亚历山大起始之城"
 alexandria_2:0 "亚历山大里亚扩张"
 all_alexandrias_owned:0 "追随亚历山大的步伐"
 appointed_bureaucracy:0 "委任官僚制"
 diadochi_invictus_1:0 "帝国内的色雷斯"
 diadochi_invictus_10:0 "亚历山大于印度"
 diadochi_invictus_10_DESC:0 "我们跟随亚历山大的步伐，一路来到#E 印度#!——让我们在这片土地上保护他与我们的遗产。"
 diadochi_invictus_11:0 "亚历山大于巴比伦"
 diadochi_invictus_11_DESC:0 "我们必须堡注意里转向底格里斯河上的亚历山大里亚，确保我们在美索不达米亚地区的地位。"
 diadochi_invictus_12:0 "[GetProvince('(int32)946')GetName]的皇室金库"
 diadochi_invictus_12_DESC:0 "这座被称为#E 苏萨#!的城市，其中的宝库在亚历山大困顿之际曾大有帮助。但现在是我们偿还旧债的时候了"
 diadochi_invictus_13:0 "亚历山大于[GetProvince('(int32)7968')GetName]的宝库要塞"
 diadochi_invictus_13_DESC:0 "[GetProvince('(int32)7968').GetName]要塞曾是亚历山大最宏大的宝库之一，诸多继业者都曾染指其无尽财富。我们应当加强卫城防御，以防珍宝继续流失。"
 diadochi_invictus_1_DESC:0 "我们必须做出关于#E 色雷斯#!的决定。我们必须决定如何处理吕西马科斯过去的领地。这一极为重要的区域是连接欧亚的重要纽带，值得我们高度重视。"
 diadochi_invictus_2:0 "帝国管理"
 diadochi_invictus_2_DESC:0 "我们的国家幅员辽阔，需要我们授权代表以我们的名义行事，但问题仍然存在：谁最适合成为代表[ROOT.GetCountry.GetAdjective]权威的人？"
 diadochi_invictus_3:0 "波斯波利斯重建"
 diadochi_invictus_3_DESC:0 "在亚历山大酩酊大醉后下令而引发的#E 波斯比利斯#!大火是我们名誉的污点，但我们也许最后能为它做点什么。"
 diadochi_invictus_4:0 "追随亚历山大的步伐"
 diadochi_invictus_4_DESC:0 "虽然我们确实重新统治了亚历山大所确立的疆域。但我们仍有未竟之事必须处理：拥有每一座由征服者建立的#Y 亚历山大里亚#!、"
 diadochi_invictus_5:0 "亚历山大于安纳托利亚"
 diadochi_invictus_5_DESC:0 "亚历山大确实对#E 伊苏斯的亚历山大里亚#!有一份愿景，但他没能活到看到它真正建立。让我们追随马其顿人的步伐，真正发挥出这处城市的潜力。"
 diadochi_invictus_6:0 "亚历山大于埃及"
 diadochi_invictus_6_DESC:0 "是时候发展地中海世界最伟大的城市——[GetProvince('(int32)516')GetName]。我们的构想甚至将超越亚历山大。"
 diadochi_invictus_7:0 "亚历山大于波斯"
 diadochi_invictus_7_DESC:0 "亚历山大在阿契美尼德王朝的土地上建立了许多城市。现在轮到我们来修缮他所开始的建设了。"
 diadochi_invictus_8:0 "在阿剌科西亚的亚历山大"
 diadochi_invictus_8_DESC:0 "在阿剌科西亚的亚历山大"
 diadochi_invictus_9:0 "亚历山大于巴克特里亚"
 diadochi_invictus_9_DESC:0 "巴克特里亚人的城市，就像他们自己一样富裕而强大，它们依然可以进一步改进——这也将证明我们的能力"
 emporos_focused_administration:0 "恩波罗斯商人税吏"
 emporos_focused_administration_desc:0 "我们已将征税事务托付给恩波罗斯商人税吏代为管理。"
 gw_effect_persepolis:0 "波斯波利斯"
 local_nobility_administration:0 "本地贵族"
 local_nobility_administration_desc:0 "地方贵族总是对维护自身特权颇感兴趣，他们将代表我们进行有效的统治。"
 me_diadochi_empire_events.300.a:0 "#E 色雷斯总督领#!能最大限度的保护我们与此地的利益"
 me_diadochi_empire_events.300.b:0 "我们最好直接控制这片地区"
 me_diadochi_empire_events.300.desc:0 "现在我们终于把和平带到了#E 色雷斯#!——一处动荡之地——这一成就将吕西马科斯永远钉在耻辱柱上，他无法管教不断威胁他的俄德律西亚部落——我们必须为这一重要省份的长远未来做打算。\n\n有人建议我们任命一位候选者，[SCOPE.sCharacter('candidate').GetName]，作为总督。许多人担保[SCOPE.sCharacter('candidate').GetFirstName]的道德水平。但最终的选择仍然是[ROOT.GetCountry.GetRuler.GetName]。"
 me_diadochi_empire_events.300.t:0 "色雷斯总督领"
 me_diadochi_empire_events.301.a:0 "只有指定的官员才能确保一切顺利。"
 me_diadochi_empire_events.301.b:0 "只有有能者才能被允许任职。"
 me_diadochi_empire_events.301.c:0 "一个人的地位应由出生决定。"
 me_diadochi_empire_events.301.t:0 "管理一个帝国"
 me_diadochi_empire_events.302.a:0 "我们需要一个中央集权的官僚机构。"
 me_diadochi_empire_events.302.b:0 "地方行政机构最为稳定。"
 me_diadochi_empire_events.302.t:0 "管理一个帝国"
 me_diadochi_empire_events.303.a:0 "当地贵族将其控制住了。"
 me_diadochi_empire_events.303.b:0 "元老们成为了有用的管理者。"
 me_diadochi_empire_events.303.c:0 "皇帝们是我们的未来。"
 me_diadochi_empire_events.303.desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]已经推掉了最后的决定有一段时间了，但每个人都知道[ROOT.GetCountry.GetRulerTitle]将不得不做出选择，因为现状是站不住脚的，我们对各省的管理已经开始受到影响。我们有几个选择，每个选择都有好处和坏处，虽然[ROOT.GetCountry.GetRuler.GetFirstName]处于一个令人不快的位置，但我们将不得不决定谁来管理[ROOT.GetCountry.GetName]地方上的日常事务。"
 me_diadochi_empire_events.303.t:0 "管理一个帝国"
 me_diadochi_empire_events.304.a:0 "我将美化亚历山大试图摧毁的东西......。"
 me_diadochi_empire_events.304.desc:0 "[ROOT.GetCountry.GetRuler.GetName]不喜欢被提醒那段可耻的插曲，其中#E Persepolis#! 被放在火炬上，因为[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]出席了研讨会，这将对这个古老的城市产生可怕的影响。\与其沉浸在过去的错误中，[ROOT.GetCountry.GetRuler.GetFirstName]发誓要将城市恢复到原始状态，并命令建造一座纪念碑，它将超越该地区以前的任何东西。"
 me_diadochi_empire_events.304.t:0 "波斯波利斯的恢复"
 me_diadochi_empire_events.305.a:0 "愿这座纪念碑能消除这里曾经发生的耻辱"
 me_diadochi_empire_events.305.desc:0 "终于，[ROOT.GetCountry.GetRuler.GetName]传来消息，#E Persepolis#! 终于被重建了。我们的建筑师确实超越了自己，因为世界上任何地方都没有建造过这样的纪念碑。虽然在[ROOT.GetCountry.GetCapital.GetName]的生意上，[ROOT.GetCountry.GetRuler.GetFirstName]不能亲自参加伴随着修复的仪式和节日，但[ROOT.GetCountry.GetRuler.GetSheHe]知道过去的罪孽已经被赎回，他很满足。"
 me_diadochi_empire_events.305.t:0 "复原波斯波利斯"
 me_diadochi_empire_events.306.a:0 "我，[ROOT.GetCountry.GetRuler.GetFirstName]，所完成的这不是一件小事。"
 me_diadochi_empire_events.306.desc:0 "我们的军事顾问报告说，[ROOT.GetCountry.GetRuler.GetName]的一个虚荣项目终于完成了。尽管我们是#E 亚历山大#!帝国的明确继承人，但这位马其顿人几乎在每个地方都以自己的名字命名建造城市，试图传播文化和文明。我们胜利的[ROOT.GetCountry.GetAdjective]部队最终夺取了我们前主人建立的每一个#Y 亚历山大#!，现在它们是[ROOT.GetCountry.GetName]的一部分。"
 me_diadochi_empire_events.306.t:0 "许多亚历山大的人"
 me_diadochi_empire_events.307.a:0 "我将始终以国家的最佳利益行事"
 me_diadochi_empire_events.307.desc:0 "[GetProvince('(int32)795')GetName]是一个充满灵感的城市选择，[ROOT.GetCountry.GetRuler.GetName]可以清楚地看到亚历山大决定在这里建立#E 亚历山大#! 的理由。这个地方的战略位置有多种用途；它的天然港口不仅是我们海军网络的一个重要节点，而且它为我们控制附近的#E 叙利亚门#!，使我们能够进入东部的平原。我们通过在该地区建立自己的存在，做得很好。"
 me_diadochi_empire_events.307.t:0 "亚历山大的安纳托利亚之路"
 me_diadochi_empire_events.308.a:0 "让我们暂时保持原样，但谢谢你。"
 me_diadochi_empire_events.308.desc:0 "也许亚历山大作为城市创始人所取得的最大成就是无与伦比的[GetProvince('(int32)516')GetName]，地中海最伟大的城市，但这位伟大的将军已经被[ROOT.GetCountry.GetRuler.GetName]打败了，他将城市提升到以前无法想象的高度。\在一个伟大的谦逊的表现中，当当地的贵族找到[ROOT.GetCountry.GetRuler.GetFirstName]，提出将大都市改名为#E [ROOT.GetCountry.GetRuler.GetFirstName]opolis#! 以示所取得的成就时，[ROOT.GetCountry.GetRulerTitle]对这个建议嗤之以鼻，感谢[ROOT.GetCountry.GetRuler.GetHerHis]市民的善意，同时拒绝了这个荣誉。"
 me_diadochi_empire_events.308.t:0 "亚历山大在埃及的旅程"
 me_diadochi_empire_events.309.a:0 "我不能改变你的过去，但让我帮助你的未来"
 me_diadochi_empire_events.309.desc:0 "马其顿军队的掠夺破坏了#E 阿契美尼德#! 在#E 美索不达米亚#! 的权威，这种记忆并没有遥远到让当地人忘记侵略者犯下的罪行，但是今天，[ROOT.GetCountry.GetRuler.GetName]已经在该地区做了[ROOT.GetCountry.GetRuler.GetSheHe]能做的一切，试图恢复失去的东西。\通过在北部以及底格里斯河口建设土地，#E #!，[ROOT.GetCountry.GetRulerTitle]希望新的经济机会将有助于缓解人民的痛苦。"
 me_diadochi_empire_events.309.t:0 "亚历山大在巴比伦的旅居生活"
 me_diadochi_empire_events.310.a:0 "别人带来苦难，我却恢复和医治"
 me_diadochi_empire_events.310.desc:0 "[ROOT.GetCountry.GetRuler.GetName]从不放过任何一个以牺牲[ROOT.GetCountry.GetRuler.GetHerHim]对手，特别是其他#E 继业者#!为代价来赞美[ROOT.GetCountry.GetRuler.GetHerHis]自己的机会，所以在修复[GetProvince('(int32)946').GetName]的皇家金库时，有很多人大肆宣传，它已经被太多的入侵者，包括亚历山大罗斯和最近的安提柯，所打击。\n\n现在，国库已经重建，新的大理石外墙非常壮观，凸显了[ROOT.GetCountry.GetAdjective]的权威，每个人都可以看到[ROOT.GetCountry.GetRuler.GetFirstName]为什么要吹嘘——这个建筑非常壮观。"
 me_diadochi_empire_events.310.t:0 "[GetProvince('(int32)946')GetName]的皇家库房"
 me_diadochi_empire_events.311.a:0 "我有责任看到这项工作的完成"
 me_diadochi_empire_events.311.desc:0 "虽然亚历山大在整个#E 波斯#!的土地上建立了许多城市，但将它们变成今天的样子，功劳完全属于[ROOT.GetCountry.GetRuler.GetName]。如果没有[ROOT.GetCountry.GetRulerTitle]的亲自关注，那么#E 阿契美尼德#!的前统治区将在藤蔓上枯萎，但现在，我们又有五个城市得到了扩展，履行了它们作为[ROOT.GetCountry.GetAdjective]文化灯塔的使命。"
 me_diadochi_empire_events.311.t:0 "亚历山大的波斯之行"
 me_diadochi_empire_events.312.a:0 "而据各方所言，我的确已经成功了。"
 me_diadochi_empire_events.312.desc:0 "亚历山大之所以在他所经过的土地上建立城市与防御工事，原因有许多：既是为了将马其顿文明带入蛮荒之地，当然也是为了将控制力延伸至那些在马其顿军队远去之后可能反叛的争夺之地。\n\n意识到艰险之地若不谨慎治理便会带来艰难的问题，[ROOT.GetCountry.GetRuler.GetName]已决定对#E 阿剌科西亚#!诸省进行投入，试图驯服这片由尘土高丘与残酷荒漠构成的躁动之地。"
 me_diadochi_empire_events.312.t:0 "追随亚历山大穿越阿剌科西亚的脚步"
 me_diadochi_empire_events.313.a:0 "我们必须密切关注巴克特里亚，以防它变得过于强大。"
 me_diadochi_empire_events.313.desc:0 "尽管 [ROOT.GetCountry.GetRuler.GetName]已被告知，在 #E 巴克特里亚#!全境进行的建设工程终于完成，但这位[ROOT.GetCountry.GetRulerTitle]对这一消息似乎并不满意。当亲近的心腹询问为何[ROOT.GetCountry.GetRuler.GetSheHe]显得忧心时，得到的回答因坦白直率而令人震惊。\n\n“你去过巴克特里亚吗？我去过……那是一片美丽的土地，蒙受自然赐福，但也因此成为可能被心怀恶意者利用的力量之源。那里的人民强健而好反叛，一旦站稳脚跟，便可能追求自我统治；就仿佛一块充满争斗性的 #E 希腊世界#!——那里充斥着追名逐利的雄心之徒——被放在了已知世界的边缘。”"
 me_diadochi_empire_events.313.t:0 "直到世界尽头"
 me_diadochi_empire_events.314.a:0 "我们的帝国确实辽阔无边……"
 me_diadochi_empire_events.314.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的公民之中，能真正到达那些仿佛虚构之地般遥远城市的人并不多，因为它们距离[ROOT.GetCountry.GetAdjective]的首都实在太远。尽管鲜有人听说过像#E 输陀利#!或 #E 玛尼克耶拉#! 这样的地方，但他们确信[ROOT.GetCountry.GetRuler.GetName]正在改善[ROOT.GetCountry.GetRuler.GetHerHis]国民的生活——无论是居住在权力中心附近的人，还是生活在希达斯佩斯河彼岸那些遥远城市中的人。"
 me_diadochi_empire_events.314.t:0 "跃过希达斯佩斯河"
 me_diadochi_empire_events.315.a:0 "如今一切威胁皆已平息。"
 me_diadochi_empire_events.315.desc:0 "在[GetProvince('(int32)7968').GetName]，亚历山大远征的大量战利品曾被储藏于此，众多继业者在此中饱私囊以资其野心，如取走500塔兰特的欧迈尼斯——当然这与那位盗取万金的叛将安提柯相比简直微不足道！如今我们已掌控这一重要要塞，再无人能染指吾等应得之物。"
 me_diadochi_empire_events.315.t:0 "[GetProvince('(int32)7968').GetName]的王家金库"
 meritocratic_bureaucracy:0 "精英官僚制"
 metics_administration:0 "外邦管理者"
 metics_administration_desc:0 "我们选择依靠这些外邦人来协助管理我们的官僚体系。"
 noble_bureaucracy:0 "贵族官僚制"
 own_all_alexandrias_tt:0 "拥有所有由#Y [GetCharacter('(int32)39')GetName]#!建立的城市。(#R [SCOPE.ScriptValue('owned_alexandrias_svalue')|0]#!/#Y 27#!)"
 reinforced_treasury_citadel:0 "加固皇室金库"
 restored_susa_treasury:0 "恢复[GetProvince('(int32)946')GetName]的皇室金库"
 restoring_persepolis_tt:0 "我们将在开始在#Y [GetProvince('(int32)4799')GetOwner.GetName]#!建造一座奇观"
 satrapy_of_thrace_release:0 "色雷斯将会被释放成为一个总督领，由[candidate.GetName]统治。"
 thrace_satrapy:0 "色雷斯总督领"
 thrace_satrapy_desc:0 "我们相信色雷斯人会记住他们的誓言，在无可避免的时刻到来时支持我们。"
 thrace_satrapy_neg:0 "色雷斯总督领"
 thrace_satrapy_neg_desc:0 "我们决定让色雷斯人与我们一起。"
 wonder_persepolis:0 "波斯波利斯"

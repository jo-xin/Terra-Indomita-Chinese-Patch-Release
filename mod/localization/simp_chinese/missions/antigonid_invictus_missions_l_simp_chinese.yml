l_simp_chinese:
 all_same_reward_thrace_tt:0 "所有#Y [GetCulture('odrysi').GetName]#!省份都得到这一修正。"
 ancient_tyana:0 "提亚纳古城"
 antigonid_integration_negative_tt:0 "如果我们通过#Y 奴役#!文化来完成使命，所有拥有这些主导文化之一的省份将得到以下省份修正。"
 antigonid_invictus_1:0 "安提柯的霸权"
 antigonid_invictus_10:0 "亚细亚战略"
 antigonid_invictus_10_DESC:0 "凭借战功之权，我们“亚细亚统帅”的称呼当之无愧，但明君必当善待新征服之地；切莫令人失望，当竭力扶助当地民众。"
 antigonid_invictus_11:0 "弗里吉亚总督"
 antigonid_invictus_11_DESC:0 "至关重要的弗里吉亚地区，既可能成为我们的福音，也可能成为扼住我们咽喉的枷锁，将我们拖入灾难的深渊——让我们竭尽所能确保前者成为现实，届时整个国家都将受益。"
 antigonid_invictus_12:0 "旧都"
 antigonid_invictus_12_DESC:0 "[GetCharacter('(int32)37').GetName]曾经是安提柯王朝管理的核心所在。在我们征服叙利亚之后，安提柯王朝离开了[GetProvince('(int32)1936').GetName]，转而选择了[GetProvince('(int32)790').GetName]。"
 antigonid_invictus_1_DESC:0 "我们已经打倒了我们的对手，夺取了他们的首都并羞辱了他们--向世界宣布，安提柯的至高无上时代已经来临！我们的目标是让我们的国家成为世界上最好的国家！"
 antigonid_invictus_2:0 "埃及的命运"
 antigonid_invictus_2_DESC:0 "如今托勒密的大军已被击溃，我们必须决定如何处置他侵占的埃及领地。"
 antigonid_invictus_3:0 "巴比伦的命运"
 antigonid_invictus_3_DESC:0 "尽管恍如隔世，但我们确曾在巴比伦的厅堂中聆听亚历山大发号施令——现在，是时候让[ROOT.GetCountry.GetRuler.GetName]取而代之了。"
 antigonid_invictus_4:0 "色雷斯的命运"
 antigonid_invictus_4_DESC:0 "我们现在必须将注意力转向吕西马科斯昔日在色雷斯的领地，但切记提防其北方的俄德律西亚奴从——他们阴险狡诈，绝不可信任。"
 antigonid_invictus_5:0 "马其顿故乡"
 antigonid_invictus_5_DESC:0 "我们应当竭尽所能恢复马其顿的秩序。敞开国库、以工程美化家园，正是经受时间考验的良策。"
 antigonid_invictus_6:0 "一个稳定的国家"
 antigonid_invictus_6_DESC:0 "尽管我们统治着众多迥异民族组成的帝国，唯依安提柯王朝的力量而非天然的亲缘纽带才维系着他们的统一，我们依然成功为这片辽阔的疆域带来了稳定。"
 antigonid_invictus_7:0 "叙利亚的治理"
 antigonid_invictus_7_DESC:0 "让我们统治叙利亚，让塞琉古的野心蒙尘。"
 antigonid_invictus_8:0 "奇里乞亚的财富"
 antigonid_invictus_8_DESC:0 "虽然安纳托利亚高原干燥多尘，但奇里乞亚肥沃的农田为那些能掌握大地和海洋的人提供了难以计数的财富。"
 antigonid_invictus_9:0 "复兴古老的堤亚纳"
 antigonid_invictus_9_DESC:0 "昔日的名城堤亚纳已不复往昔荣光，但我们将竭尽所能，让这座古都重现昔日辉煌。"
 antigonid_odrysia_tt:0 "根据我们如何处理#Y [GetCountry('ODR')GetName]#!，我们将得到#Y 政治影响力#!，#Y 人力#!或#Y 金钱#!。"
 antigonid_oppression:0 "安提柯压迫"
 antigonid_subject:0 "安提柯附庸"
 antigonid_syrian_governance:0 "叙利亚的治理"
 antigonid_victory:0 "安提柯的胜利"
 antigonids_egypt_integration_tt:0 "以下之一必须为真：\n#Y [GetCulture('upper_egyptian').GetName]#!，#Y [GetCulture('middle_egyptian').GetName]#!或#Y [GetCulture('egyptian').GetName]#!必须被整合。\n所有三种文化必须有#Y 奴隶#!人口类型的权利。"
 antigonids_integration_positive_tt:0 "如果我们通过#Y 整合#!文化来完成这项使命，所有相关的整合文化将获得以下文化修正。"
 antigonids_mesopotamia_integration_tt:0 "以下之一必须为真：\n#Y [GetCulture('babylonian').GetName]#!或#Y [GetCulture('assyrian').GetName]#!必须被整合。\n所有两种文化必须有#Y 奴隶#!人口类型的权利"
 antigonids_thrace_integration_tt:0 "#Y [GetCulture('odrysi').GetName]#! 需要被#Y 整合#!或拥有#Y 奴隶#!权利。"
 asia_anti_pop_hapi_tt:0 "在#Y [GetProvince('(int32)278').GetArea.GetRegion.GetName]#!中的所有拥有省份中，需要至少有#Y [SCOPE.ScriptValue('asia_pop_happiness_max_svalue')|0]#!的非奴隶人口，并且至少有#Y 50%#!的幸福度。(#R [SCOPE.ScriptValue('asia_pop_happiness_svalue')|0]#!/#Y [SCOPE.ScriptValue('asia_pop_happiness_max_svalue')|0]#!)"
 cilica_pedias_pops_tt:0 "#Y [GetProvince('(int32)1881').GetArea.GetName]#! 需要至少有#Y 200#!人口。(#R [SCOPE.ScriptValue('cilicia_pedias_pop_svalue')|0]#!/#Y 200#!)"
 cilician_trade:0 "奇里乞亚贸易"
 integrated_into_antigonids:0 "安提柯整合政策"
 me_antigonid_1_vision.200.a:0 "我乃正继！"
 me_antigonid_1_vision.200.desc:0 "当#E 亚历山大#!在高烧不退的病榻上，意识逐渐沉入深渊，虚弱地喃喃道：“给最强者……”之际，鲜少有人知晓这乃是预言——预言着此刻[ROOT.GetCountry.GetRuler.GetFirstName]凌驾于诸位继业者之上的凯旋时刻。\n\n其余继业者与他们褴褛的士兵已被逐出战场，他们的雇佣兵与盟友纷纷改旗易帜，此刻[ROOT.GetCountry.GetAdjective]的爪牙仍在追杀他们的亲族，直至天涯海角。不久之后，亚历山大支离破碎的帝国将再无其他继承者——唯有那位将碎片熔铸成新辉煌的统帅：[ROOT.GetCountry.GetRuler.GetName]，愿[ROOT.GetCountry.GetRuler.GetSheHe]永世长存。"
 me_antigonid_1_vision.200.t:0 "安提柯的霸权"
 me_antigonid_1_vision.201.a:0 "神性从来没有离开过我们。"
 me_antigonid_1_vision.201.desc:0 "[ROOT.GetCountry.GetRuler.GetName]刚刚结束了#E 吉萨高原#!之旅，亲眼目睹了金字塔，此刻正从[GetProvince('(int32)536').GetName]离开，[ROOT.GetCountry.GetRuler.GetHerHim]显得异常沉默。\n\n尽管[ROOT.GetCountry.GetRuler.GetFirstName]渴望追随亚历山大的脚步，前往[GetProvince('(int32)5514').GetName]的预言神谕，但[ROOT.GetCountry.GetCapital.GetName]的紧急事务只允许这位[ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle]得以亲临法老们建造的巍峨陵墓。\n\n而当[ROOT.GetCountry.GetRuler.GetFirstName]驶向尼罗河畔——那里有艘驶往[GetProvince('(int32)516').GetName]的船只等候时，埃及的命运并未萦绕在[ROOT.GetCountry.GetRuler.GetHerHis]心头，唯有当下与未来的思绪盘旋不息。"
 me_antigonid_1_vision.201.t:0 "埃及人民"
 me_antigonid_1_vision.202.a:0 "我们如今掌握着文明跳动的心脏，以及由此带来的一切"
 me_antigonid_1_vision.202.desc:0 "终于，#E 塞琉古#!的可悲的残兵如我们预料般溃散，巴比伦篡位者的残存势力已被驱逐至其盘踞领土的蛮荒腹地深处。\n\n此刻，当[ROOT.GetCountry.GetRuler.GetName]的凯旋将士们在民众欢呼声中扬鞭跨过[GetProvince('(int32)918').GetName]城门时，这位[ROOT.GetCountry.GetAdjective]的[ROOT.GetCountry.GetRulerTitle]心中唯有一个念头萦绕不去。"
 me_antigonid_1_vision.202.t:0 "美索不达米亚的生活之道"
 me_antigonid_1_vision.203.a:0 "我们已经驯服了野蛮人。"
 me_antigonid_1_vision.203.desc:0 "在[GetProvince('(int32)350').GetName]，越来越多的民众聚集在[ROOT.GetCountry.GetAdjective]士兵身后，紧张地注视着他们张贴新颁布的法令——这些由[ROOT.GetCountry.GetRuler.GetName]下令在整个#E 色雷斯#!地区强制执行的法律法规。\n\n如今吕西马科斯已被根除，而他永恒的眼中钉——俄德律西亚蛮族也已遭重创，这饱受战乱的地区即将迎来和平与繁荣的新纪元。"
 me_antigonid_1_vision.203.t:0 "色雷斯人"
 me_antigonid_1_vision.204.a:0 "我们已经确保了合法的地位。"
 me_antigonid_1_vision.204.desc:0 "我们的工程师报告称，他们在[GetProvince('(int32)379').GetName]的工程终于竣工，亚历山大的诞生地现已成为马其顿地区最新的都会。\n\n还有什么比这更彰显[ROOT.GetCountry.GetRuler.GetFamilyDisplayName]家族乃全希腊真正合法统治者的方式？当世人目睹此处成就，怎能不承认新纪元的降临？"
 me_antigonid_1_vision.204.t:0 "祖国"
 me_antigonid_1_vision.205.a:0 "亚历山大，我已经超越了你……"
 me_antigonid_1_vision.205.desc:0 "[ROOT.GetCountry.GetRuler.GetName]正惬意地啜饮着[ROOT.GetCountry.GetCapital.GetName]城中最上等的佳酿，这份悠然实属应得——毕竟[ROOT.GetCountry.GetName]国度难得一片安宁； 今日并无紧迫要务待处理，[ROOT.GetCountry.GetAdjective]的[ROOT.GetCountry.GetRulerTitle]得以片刻沉思，审视已取得的种种成就。\n\n“何者更难？”[ROOT.GetCountry.GetRuler.GetFirstName]自问自答，将金杯中的酒一饮而尽。\"是趁敌不备，数战而取帝国？还是征服四面环伺的宿敌？阿契美尼德人虽是强敌，但我却将这支离破碎的王国重新统一，我的成就比之更为伟大。\""
 me_antigonid_1_vision.205.t:0 "稳定的国度"
 me_antigonid_1_vision.206.a:0 "我们将把叙利亚的城市紧紧地记在心里"
 me_antigonid_1_vision.206.desc:0 "耗费大量时间与金钱，[ROOT.GetCountry.GetAdjective]的工程师们终于建成了连接#E 叙利亚#!各分散城市的本地道路网络。商人将能便捷往来于各市场之间，而我们的士兵也将在必要时利用这些道路，及时平息可能发生的叛乱。\n\n我们在此成就了划时代的事业，[ROOT.GetCountry.GetRuler.GetName]陛下；今夜[ROOT.GetCountry.GetCapital.GetName]理应举行庆典。"
 me_antigonid_1_vision.206.t:0 "叙利亚的野心"
 me_antigonid_1_vision.207.a:0 "贸易网络是[ROOT.GetCountry.GetName]的脉络和筋骨。"
 me_antigonid_1_vision.207.desc:0 "我们很高兴向您报告，[ROOT.GetCountry.GetRuler.GetName]，奇里乞亚多产的农田不负众望。我们不仅能用神明提供给我们的农业财富养活许多人，而且还能在遥远的市场上出售剩余的产品。\n\n如果不是你下令建造的港口城市，我的[ROOT.GetCountry.GetRulerTitle]，那么我们就不会有这样的处境，所以我们要感谢你。"
 me_antigonid_1_vision.207.t:0 "奇里乞亚贸易"
 me_antigonid_1_vision.208.a:0 "告诉我的工程师，我对他们的工作相当满意"
 me_antigonid_1_vision.208.desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]因事务繁忙未能亲临旧[GetProvince('(int32)1951').GetName]——这座曾被#E 阿契美尼德王朝#!用作#E 弗里吉亚#!行省行政中心的区域首府，但 [ROOT.GetCountry.GetRuler.GetSheHe]始终关注着这座古城重建的进展。\n\n堤亚纳历经沧桑：城堡的城墙残留着战火灼痕，防御工事日渐坍塌。但愿在[ROOT.GetCountry.GetAdjective]时代，它能重焕新生，攀登至前所未有的高度。"
 me_antigonid_1_vision.208.t:0 "老堤亚纳"
 me_antigonid_1_vision.209.a:0 "无人能与我抗衡！我的天命即是统治世界！"
 me_antigonid_1_vision.209.desc:0 "如今， [ROOT.GetCountry.GetRuler.GetName]似乎势不可挡——不仅在战场上屡屡击败[ROOT.GetCountry.GetRuler.GetSheHe]的对手，就连新近征服的领土也纷纷臣服于[ROOT.GetCountry.GetAdjective]的权威之下。[ROOT.GetCountry.GetRuler.GetFirstName]并未沉溺于[ROOT.GetCountry.GetRuler.GetHerHis]的功勋，已宣布[ROOT.GetCountry.GetRuler.GetHerHis]将在整个#E 亚细亚#!兴建城市的宏图。"
 me_antigonid_1_vision.209.t:0 "亚细亚战略"
 me_antigonid_1_vision.210.a:0 "我们的最高胜利是不可避免的...。"
 me_antigonid_1_vision.210.desc:0 "无论[ROOT.GetCountry.GetRuler.GetName]走到哪里，好消息都会跟随着[ROOT.GetCountry.GetRuler.GetSheHe]；这是某种神性对[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]投下保护之眼的无可置疑的迹象。弗里吉亚人已经悄悄地采取了一种顺从的状态，派遣他们的儿子在我们的军队中作战，并允许我们的建筑师在他们的领土上建造新的城市。"
 me_antigonid_1_vision.210.t:0 "弗里吉亚行省"
 me_antigonid_1_vision.211.a:0 "对于首都来说，这是一个吉利的地方......古人选择得很好。"
 me_antigonid_1_vision.211.desc:0 "对[ROOT.GetCountry.GetAdjective]来说，[GetProvince('(int32)1936').GetName]是行政中心的绝佳地点；它地处交通枢纽，既可便捷通往安纳托利亚腹地，距海滨也仅需数日骑行。\n\n虽然刻莱奈的重要性从未被遗忘，但[ROOT.GetCountry.GetRuler.GetName]为恢复其昔日荣光所做的努力，必将对整个地区产生深远影响。"
 me_antigonid_1_vision.211.t:0 "刻莱奈，旧都"

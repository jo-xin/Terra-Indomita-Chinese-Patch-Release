 tamilakam_missions_01_task_1:0 "统一南印度"
 tamilakam_missions_01_task_10:0 "马里安曼神庙"
 tamilakam_missions_01_task_10_DESC:0 "修建一座马里安曼神庙会让老百姓很开心，因为雨之女神受到所有人的喜爱。\n\n\n\n\n\n\n\n\n\n\n@india_mil13!."
 tamilakam_missions_01_task_11:0 "毗湿奴神庙"
 tamilakam_missions_01_task_11_DESC:0 "众神中谁能像毗湿奴一般？建造毗湿奴神庙将确保神圣秩序得以维持。\n\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 tamilakam_missions_01_task_12:0 "建造一座大神庙"
 tamilakam_missions_01_task_12_DESC:0 "将我们几乎所有的资源都用于建造一座大神庙，可以为我们的国家带来未来数年的繁荣。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 tamilakam_missions_01_task_12_effect_tt:0 "一个#Y 伟大的建设者#! 将出现在我们国家。他将大大增加我们在其带领下建造的任何纪念碑的威望。"
 tamilakam_missions_01_task_13:0 "阿湿波"
 tamilakam_missions_01_task_13_DESC:0 "阿湿波人与泰米尔人有很多共同之处。我们应该尝试征服他们。\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 tamilakam_missions_01_task_14:0 "发展农业"
 tamilakam_missions_01_task_14_DESC:0 "发展我们的农业将确保恶劣的季风天气不会对我们的民众造成损害。\n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 tamilakam_missions_01_task_14_effect_tt:0 "[mission_country.GetName] 至少有10个生产谷物@grain!或蔬菜@vegetables!的省份有一个#Y 农业定居点#! 建筑或至少有#Y 2个粮仓#! 建筑。"
 tamilakam_missions_01_task_15:0 "建立贸易港口"
 tamilakam_missions_01_task_15_DESC:0 "众人皆知我们贸易收入很高，毫无疑问是因为我们销售的奢侈品。发展繁荣的贸易网络将继续为我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 tamilakam_missions_01_task_16:0 "羯陵伽之王"
 tamilakam_missions_01_task_16_DESC:0 "几个世纪以来，独立的罗阇一直统治着羯陵伽的土地。然而，我们已经摧毁了他们，现在一个泰米尔的王坐在羯陵伽的王座上。\n\n\n\n\n\n\n\n\n\n\n@india_mil16!"
 tamilakam_missions_01_task_16_effect2_tt:0 "释放#Y 羯陵伽#! 作为一个藩属国附庸。"
 tamilakam_missions_01_task_16_effect_tt:0 "拥有或藩属拥有#Y 羯陵伽#! 文化的所有省份。"
 tamilakam_missions_01_task_17:0 "进入丛林"
 tamilakam_missions_01_task_17_DESC:0 "印度东北部的丛林拥有许多难以计数的财富，我们必须征服这些丛林中的人们，以泰米尔人的荣耀夺取他们的财富。\n\n\n\n\n\n\n\n\n\n\n@india_mil9!"
 tamilakam_missions_01_task_17_effect_tt:0 "拥有或让其臣民拥有#Y 萨瓦拉#! 文化的所有省份。"
 tamilakam_missions_01_task_18:0 "羯陵伽的傀儡国王"
 tamilakam_missions_01_task_18_DESC:0 "几个世纪以来，独立的罗阇一直统治着羯陵伽的土地。我们有什么资格去剥夺他们统治那儿民众的权利。羯陵伽有着强大的军事力量，将有助于加强我们伟大的军队。\n\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 tamilakam_missions_01_task_1_DESC:0 "我们必须主宰南印度，这样我们才能壮大起来，以对抗北方的孔雀。\n\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 tamilakam_missions_01_task_1_effect_tt:0 "获得对#Y 羯那多#! 和#Y 达罗毗荼#!区域的宣称。"
 tamilakam_missions_01_task_2:0 "巩固羯那多"
 tamilakam_missions_01_task_20:0 "丛林之王"
 tamilakam_missions_01_task_20_DESC:0 "我们已经征服了印度的丛林，现在我们将宣称获得丛林之王的称号。\n\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 tamilakam_missions_01_task_21:0 "征服民陀高原"
 tamilakam_missions_01_task_21_DESC:0 "随着民陀高原地区在我们的控制之下，我们现在准备对孔雀帝国发动一次致命性的进攻。\n\n\n\n\n\n\n\n\n\n\n@india_mil21!"
 tamilakam_missions_01_task_22:0 "向般遮耶推进"
 tamilakam_missions_01_task_22_DESC:0 "现在我们已经统一了整个达罗毗荼，我们现在必须向北推进到般遮耶，在孔雀攻击我们之前打击他们.......\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 tamilakam_missions_01_task_22_effect2_tt:0 "#Y 羯陵伽#! 省将动乱，并有可能#R 反叛#!。"
 tamilakam_missions_01_task_22_effect_tt:0 "获得#Y 民陀高原#! 地区所有省份的宣称。"
 tamilakam_missions_01_task_24:0 "帝国的终结"
 tamilakam_missions_01_task_24_DESC:0 "在牢牢控制了丛林地区之后，我们现在准备好向孔雀帝国的腹地挺进，结束这个帝国的统治！\n\n\n\n\n\n\n\n\n\n\n@india_por1!"
 tamilakam_missions_01_task_24_effect_tt:0 "获得对#Y 般遮耶#!和#Y 摩柁提娑#!地区的宣称。"
 tamilakam_missions_01_task_25:0 "丛林中的猛兽"
 tamilakam_missions_01_task_25_DESC:0 "做一个统治者不仅仅是发动战争和治理国家；我们也有时间娱乐。我们应该在丛林里寻找奇异的野兽来进献给王室。\n\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 tamilakam_missions_01_task_26:0 "孔雀大都会"
 tamilakam_missions_01_task_26_DESC:0 "伟大的华氏城是全印度最大和最繁荣的城市之一。在泰米尔的统治下，它将继续蓬勃发展。\n\n\n\n\n\n\n\n\n\n\n@india_por2!"
 tamilakam_missions_01_task_27:0 "印度之主"
 tamilakam_missions_01_task_27_DESC:0 "随着孔雀被击败，我们对印度的控制得到巩固，我们现在是整个印度无可争议的主人。泰米尔人无疑将在未来几个世纪里统治印度。荣耀属于昙密罗迦摩！\n\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 tamilakam_missions_01_task_28:0 "丛林大象"
 tamilakam_missions_01_task_28_DESC:0 "将各种品种的大象纳入我们的军队将使我们的战象更有效。我们应该试着在丛林里捕捉一些……\n\n\n\n\n\n\n\n\n\n\n@india_mil11!"
 tamilakam_missions_01_task_29:0 "北部矿区"
 tamilakam_missions_01_task_29_DESC:0 "槃揭梨地区的金矿和银矿正充斥着财富。发展这些省份的基础设施将为我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 tamilakam_missions_01_task_2_DESC:0 "羯那多地区必须在我们的控制之下。 \n\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 tamilakam_missions_01_task_2_effect_tt:0 "如果#Y 军多罗#! 存在，则获得其所有省份的宣称。"
 tamilakam_missions_01_task_3:0 "巩固达罗毗荼"
 tamilakam_missions_01_task_30:0 "东印度贸易"
 tamilakam_missions_01_task_30_DESC:0 "泰米尔人一直是世界上有名的商人。从塞里斯到罗马，都可以看到我们的商人在销售各种类型的印度异域商品。发展我们在东北部的贸易中心将使我们变得非常富有。 \n\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 tamilakam_missions_01_task_31:0 "宝石贸易"
 tamilakam_missions_01_task_31_DESC:0 "昙密罗迦摩以其异国宝石贸易而闻名。从珍珠到钻石的各种宝石都可以在我们这块福地上找到。开发我们的宝石矿将给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n\n@event_pic5!"
 tamilakam_missions_01_task_32:0 "般遮耶的纺织业"
 tamilakam_missions_01_task_32_DESC:0 "印度东北部一直是印度最富裕的地方之一。它主要以布和丝绸的生产和贸易而闻名。现在，这些省份已经在我们的控制之下，我们应该扩展纺织品的贸易，这将使我们非常富有。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 tamilakam_missions_01_task_33:0 "洗劫华氏城"
 tamilakam_missions_01_task_33_DESC:0 "华氏城是孔雀的首都。我们与摩揭陀的冲突已经持续了太多年，今天终于结束。彻底摧毁华氏城将确保我们的对手永远不会再强大起来。\n\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 tamilakam_missions_01_task_33_effect_tt:0 "#Y 摩揭陀#! 省将动乱，并有可能#R 反叛#!。"
 tamilakam_missions_01_task_3_DESC:0 "据说，一个人必须先处理好家里的事情，然后才能在更广阔的世界里做事。统一我们的故土将使我们更加强大。\n\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 tamilakam_missions_01_task_3_effect_tt:0 "获得对#Y 案达罗#!省份的宣称。如果#Y 阿湿波#! 存在，将获得对其所有省份的宣称。"
 tamilakam_missions_01_task_4:0 "主宰案达罗"
 tamilakam_missions_01_task_4_DESC:0 "我们必须征服案达罗人。长久以来，他们一直突袭和攻击北部的泰米尔人。\n\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 tamilakam_missions_01_task_4_effect_tt:0 "#Y Andhapura#!, #Y Mosali#!，和 #Y Alosgyni#! 每个省份获得2人口泰米尔公民和2人口泰米尔自由民。"
 tamilakam_missions_01_task_5:0 "军多罗"
 tamilakam_missions_01_task_5_DESC:0 "军多罗人与泰米尔人有很多共同之处。我们应该尝试征服他们。\n\n\n\n\n\n\n\n\n\n\n@india_mil22!"
 tamilakam_missions_01_task_6:0 "统一达罗毗荼"
 tamilakam_missions_01_task_6_DESC:0 "所有达罗毗荼人都必须对我们的统治低头。\n\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 tamilakam_missions_01_task_6_effect_tt:0 "拥有#Y 达罗毗荼#! 文化组的所有省份。"
 tamilakam_missions_01_task_7:0 "卡拉奈的大坝"
 tamilakam_missions_01_task_7_DESC:0 "朱罗国王迦釐迦罗修建了卡拉奈大坝。大坝大大增加了周围地区的灌溉效率，使农业蓬勃发展，人口增长。\n\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 tamilakam_missions_01_task_7_effect_tt:0 "#Y Koda#! 省永久获得#G +5%人口容量#! 和#G +2%人口增长#!。"
 tamilakam_missions_01_task_8:0 "穆卢甘神庙"
 tamilakam_missions_01_task_8_DESC:0 "尽管我们专注于扩张，但我们仍知道尊敬神灵。为穆卢甘建造一座寺庙将确保我们的繁荣，并为朝圣者提供一个参观的地方。\n\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 tamilakam_missions_01_task_9:0 "湿婆神庙"
 tamilakam_missions_01_task_9_DESC:0 "湿婆在我们战斗时给予了极大的祝福，所以我们应该考虑建造一座神庙——我们想继续接受这些神圣的赐福。\n\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 tamilakam_missions_01_unity:0 "一个统一的达罗毗荼国家"
 tamilakam_missions_01_unity_BUTTON_TOOLTIP:0 "达罗毗荼将是我们的！"
 tamilakam_missions_01_unity_CRITERIA_DESCRIPTION:0 "当我们拥有达罗毗荼文化组的所有省份时，该使命完成。"
 tamilakam_missions_01_unity_DESCRIPTION:0 "我们必须团结我们的人民，使之强大起来，这样我们才能打败我们的对手，北方的孔雀。"
 trade_fleet_tooltip:0 "至少有2个省份拥有以下贸易商品，至少生产4种商品。\n \n#!#Y 琥珀#! @amber! #Y 香料#! @spices! #Y 大象#! @elephants! #Y 玻璃#! @glass! #Y 丝绸#! @silk! #Y 宝石#! @gems! \n \n#!#Y 贵重金属#! @precious_metals! #Y 染料#! @dye! #Y 蜂蜜#! @honey! #Y 香精#! @incense!αωα> #Y 日期#! @dates!"
 unify_tamil_dynasties:0 "统一泰米尔各邦国"
 unify_tamil_dynasties_desc:0 "朱罗、掣罗和般帝耶王朝的统一将确保昙密罗迦摩在我们的统治下继续繁荣。\n\n\n\n\n\n\n\n\n\n\n\n\n@decision_pic1!"
 yellow_glass_scarab:0 "黄玻璃圣甲虫"
 yellow_glass_scarab_desc:0 "这只圣甲虫是在传说中的法老国度生产的。它是由尼罗河畔的沙地上发现的一种罕见的黄色玻璃精心雕刻而成。"

l_simp_chinese:
 KALINGA_FEUDATORY_ADJECTIVE:0 "羯陵伽"
 KALINGA_FEUDATORY_NAME:0 "羯陵伽人"
 LAK:0 "羯陵伽人"
 LAK_ADJ:0 "羯陵伽"
 heshibis_jade_disc:0 "和氏璧"
 heshibis_jade_disc_desc:0 "来自遥远的塞里斯东部土地的精美玉璧。据说它属于远古时期的塞里斯国王，名叫和氏璧。"
 me_tamil_king_1.a:0 "我们将击败我们的宿敌！"
 me_tamil_king_10.a:0 "泰米尔人民必须团结起来!"
 me_tamil_king_10_desc:0 "[mission_country.GetName]已经繁荣了几个世纪。现在，[ROOT.GetCountry.GetRuler.GetName]将他的野心放在一件事上，而且只有一件事。为[mission_country.GetName]王国带来荣耀，并看到[ROOT.GetCountry.GetCapital.GetName]在未来的许多年里繁荣昌盛。"
 me_tamil_king_10_title:0 "泰米尔之王"
 me_tamil_king_11.a:0 "让他们向东，到赛里斯去！"
 me_tamil_king_11.b:0 "让他们向西，到罗马去！"
 me_tamil_king_11.c:0 "让他们向西，到阿拉伯去！"
 me_tamil_king_11.d:0 "让他们向西，到埃及去！"
 me_tamil_king_11_desc:0 "满载着来自整个印度的财宝和货物，我们的大型贸易船队终于可以出海了，并准备好前往外国。传说中的财富在四面八方等待着我们，但我们的船将驶向哪个港口？"
 me_tamil_king_11_title:0 "准备出发的贸易船队"
 me_tamil_king_12.a:0 "我们不应该如此浪费我们的钱！"
 me_tamil_king_12_desc:0 "我们一场灾难！我们珍贵的贸易船队，在驶过几个近海岛屿时，遇到了海洋风暴，不幸触礁，所有的船只都被完全摧毁了。只有少数船员能够回到岸边，他们用船上的碎片作为临时木筏，最终艰难地回到家中报告他们的不幸。您不会想知道的，[ROOT.GetCountry.GetRuler.GetName]，我们损失了多少钱…"
 me_tamil_king_12_title:0 "来自贸易船队的坏消息"
 me_tamil_king_13.a:0 "贸易使我们变得富有!"
 me_tamil_king_13_desc_1:0 "我们引以为豪的贸易舰队已经回到了母港，满载着来自遥远的东方国家赛里斯的财富和异国物品。除了典型的东方商品，如硬木、玉石、青铜艺术品、黄金和珍贵的宝石，我们的贸易舰队还带来了其他一些我们的人民从未见过的异国野兽和物品。其中包括中国人称之为 貊 的巨大黑白熊，一种奇怪的易燃易爆粉末，如何种植桑树和从这些树上养蚕的知识，以及一种危险的绿色生物，据说是传说中的中国龙的幼崽。最令人惊奇的是一个制作精美的玉璧，据说是属于一个遥远的中国国王，名叫和氏璧。"
 me_tamil_king_13_desc_2:0 "终于，我们的贸易船队带着故事和财富从遥远的西方大都市回来了，当地人称之为罗马。在这里，我们的商人向这些罗马人出售他们的货物，以换取一些物品，如各种精美的陶器、琥珀、黄金、橄榄、上等葡萄酒和各种精美的纺织品。携带鲜艳的紫色染料的大型工匠器皿也被收购，还制作了一件精美的服装，用这种染料清洗，并镶嵌了黄金，据说只有国王才会穿；这件神话般的服装是罗马的领导者送给我们陛下的私人礼物。在最令人惊叹的物品中，包括一尊雕刻成我们伟大统治者模样的大理石雕像，它是由罗马工匠根据船员们对我们君主样貌的描述精心制作的。"
 me_tamil_king_13_desc_3:0 "消息传到首都，我们的贸易舰队终于从神秘的阿拉伯土地上回来了。作为对印度财富的交换，阿拉伯海岸的各个城市出售了一些芳香剂和贵重物品，如乳香、没药、咖啡、精美的珍珠、珍贵的宝石、黄金以及来自更遥远土地的货物，如坚硬的乌木、象牙和来自非洲内陆丛林的未知热带水果。还采购了一种奇怪的刺激性植物，阿拉伯人称之为qat，通过咀嚼植物的叶子来服用。最令人好奇的是阿拉伯人获得并交易给我们的非洲异国野兽；一个巨大的、长颈的奇美拉，上面布满了花纹，两个大的、像人一样的有毛的野兽和一个巨大的、双角的灰色野兽，皮肤像盔甲一样。"
 me_tamil_king_13_desc_4:0 "盛大的贸易舰队终于从传说中的伟大法老的土地上回到了家。在一个以世界征服者亚历山大命名的大都市，我们的舰队受到了当地人的热烈欢迎。作为对强大的印度所提供的一切的交换，埃及人给了我们惊人的黄金艺术品、玻璃装饰品、纸莎草、精美的紫色宝石，以及一些曾经属于遥远的法老的精美艺术品。在这些物品中，有一个精雕细琢的黄色圣甲虫，是用在尼罗河以外的旋沙中发现的一种罕见的黄色玻璃制作的。最珍贵的物品是一把形状和图案奇特的匕首，它是由一块黑色和银色的岩石制成的，据说是作为礼物从天上掉下来送给法老的。"
 me_tamil_king_13_title:0 "贸易船队抵达家园"
 me_tamil_king_14.a:0 "大型舰队(20艘)"
 me_tamil_king_14.b:0 "小型舰队(10艘)"
 me_tamil_king_14_desc:0 "印度位于世界贸易路线的十字路口--东边和西边的土地上等待着异国的和尚未发现的货物和知识。我们应该开始建造一支专门的贸易舰队，在已知世界的大洋中寻找财富和神秘。虽然这将是一项昂贵的事业，但潜在的回报甚至无法想象。"
 me_tamil_king_14_title:0 "开始建造贸易船队"
 me_tamil_king_15.a:0 "祝福摩菟来！"
 me_tamil_king_15_desc:0 "在《大史》中描述的传奇城市摩菟来现在在我们统治者的领导下正在蓬勃发展。在开发了印度南部这块传奇的土地后，它将从该地区的香料贸易、矿山和异国野兽中产生更大的利润。"
 me_tamil_king_15_title:0 "伟大的马杜赖城"
 me_tamil_king_16.a:0 "祝福朅帝！"
 me_tamil_king_16_desc:0 "在政府财政的投资下，朅帝现在将成为世界商业中心。从塞里斯到埃及的贸易货物将流入科蒂的港口，印度商品将销往世界各地。我们的政府在这一过程中也能分得一杯羹，这对我们也没有什么影响。"
 me_tamil_king_16_title:0 "印度最伟大的贸易集散地"
 me_tamil_king_17.a:0 "祝福乌洛逾罗！"
 me_tamil_king_17_desc:0 "在我们的统治者的投资下，伟大的、古老的朱罗首都乌洛逾罗现在将重现辉煌。这座位于卡维里河上的伟大城市将成为我们王朝的权威和控制南部富饶土地的堡垒。"
 me_tamil_king_17_title:0 "乌洛逾罗大城"
 me_tamil_king_18.a:0 "祝福羯梨祇！"
 me_tamil_king_18_desc:0 "掣罗港口城市羯梨祇的商人们对我们在他们的港口、防御工事和市场的投资感到高兴。作为朱罗内地货物出口的主要港口，在这里的投资将确保我们在南方的地缘政治地位，同时也为进入该国的外国货物带来巨大的关税利润。"
 me_tamil_king_18_title:0 "贸易大城羯梨祇"
 me_tamil_king_19.a:0 "祝福槃支！"
 me_tamil_king_19_desc:0 "伟大的掣罗古城万吉巍然矗立，彰显着我国统治的辉煌。通过对该城的持续建设，我们必将牢牢掌控南方香料贸易路线，并让当地民众彻底臣服于我们的统治之下。"
 me_tamil_king_19_title:0 "伟大的槃支城"
 me_tamil_king_1_desc:0 "昙密罗迦摩的三个王国统治者被称为穆文达，由掣罗、朱罗和般帝耶组成。这三个伟大的王朝已经统治了昙密罗迦摩几个世纪，并将继续统治下去。近来，由于北方的孔雀帝国的威胁不断逼近，泰米尔王朝之间的战斗变得越来越频繁......"
 me_tamil_king_1_title:0 "穆文达"
 me_tamil_king_20.a:0 "祝福Kodungallur!"
 me_tamil_king_20_desc:0 "最近对科敦加鲁尔港口基础设施的投资肯定会获得长期的回报。已经有来自西方遥远国度的船只，带着皮肤苍白的外国人和不同于希腊人的语言，带着来自地中海的精美商品在港口登陆，寻求与印度商人做生意。"
 me_tamil_king_20_title:0 "科敦加鲁尔贸易城"
 me_tamil_king_3.a:0 "皈依佛教"
 me_tamil_king_3.b:0 "拒绝佛教"
 me_tamil_king_3.c:0 "混合佛教和阿迦摩信仰的价值观"
 me_tamil_king_3.c.tt:0 "#Y 获得接近神化的佛陀信仰。#!"
 me_tamil_king_3_desc:0 "佛教正在我们的王国中传播，现在是时候我们邀请这些佛教徒到我们的宫廷来考虑他们的价值观了。也许我们甚至可以像北方的尼泊尔人一样接受佛教作为我们的国教，孔雀帝国的大部分地区现在都在崇拜佛祖，把佛教带到昙密罗迦摩可能会非常有益。"
 me_tamil_king_3_title:0 "佛教价值观"
 me_tamil_king_4.a:0 "拥抱耆那教"
 me_tamil_king_4.b:0 "拒绝耆那教"
 me_tamil_king_4_desc:0 "耆那教在泰米尔国家已经存在了几代人，现在是时候我们邀请这些耆那教的人到我们的宫廷来传播他们的价值观了。也许我们甚至可以像泰米尔的憍萨罗酋长那样接受耆那教作为我们的国教。"
 me_tamil_king_4_title:0 "耆那教价值观"
 me_tamil_king_5.a:0 "拥抱正命派"
 me_tamil_king_5.b:0 "摒弃正命派邪说"
 me_tamil_king_5_desc:0 "正命论早在耆那教与佛教兴起之前，便已在泰米尔地区扎根。如今或许是时候引入这一教派，审视其教义了。该派主张命运天定，人类无需为自身行为负责，故无罪恶可言。是否应尊此古老信仰为国教，开启我国的正命论纪元？"
 me_tamil_king_5_title:0 "正命论教义"
 me_tamil_king_7.a:0 "向着胜利前进"
 me_tamil_king_7_desc:0 "您会很高兴知道的，[ROOT.GetCountry.GetRuler.GetName]，战争之神喜欢我们主动的行动，并给予我们他们的祝福。我们征召了大量的战士，他们渴望杀死你的敌人，为我们的军队带来永恒的荣耀。"
 me_tamil_king_7_title:0 "伟大的朱罗"
 me_tamil_king_8.a:0 "我们必须延续我们祖先的遗产。"
 me_tamil_king_8_desc:0 "在泰米尔国家，桑迦姆文学已经有几千年的历史了。"
 me_tamil_king_8_title:0 "第一桑迦姆时期"
 me_tamil_king_9.a:0 "荣耀归于昙密罗迦摩！"
 me_tamil_king_9_desc:0 "以前从未有过一个国王统治所有泰米尔人。这是历史上第一次，在神圣的[ROOT.GetCountry.GetRuler.GetName]治下，我们将所有泰米尔人团结成一个光荣的王国，一股前所未有的力量！愿我们的敌人听到昙密罗迦摩崛起的消息时战栗！"
 me_tamil_king_9_title:0 "一个统一的昙密罗迦摩"
 me_tamilakam_unity_1.a:0 "现在是时候建造一座纪念碑了"
 me_tamilakam_unity_1_desc:0 "为神灵建造一座大寺庙将使我们繁荣许多年。"
 me_tamilakam_unity_1_title:0 "一座大寺庙"
 me_tamilakam_unity_2.a:0 "派遣远征队吧!"
 me_tamilakam_unity_2.b:0 "这简直是胡说八道"
 me_tamilakam_unity_2_desc:0 "几个世纪以来，关于居住在奥迪沙丛林中的异国野兽的故事一直在流传。一位勇敢的冒险家出现在我们的法庭上，提出了一个建议。他将带领一支探险队把这些传说中的野兽之一带回王宫。他声称，探险队只需要从国王那里得到一些物资和黄金，他们将把找到的任何异国动物带回皇宫。"
 me_tamilakam_unity_2_title:0 "远征"
 me_tamilakam_unity_3.a:0 "资助远征队!"
 me_tamilakam_unity_3.b:0 "放弃这个愚蠢的冒险"
 me_tamilakam_unity_3_desc:0 "几个星期过去了，离开我们王宫的探险队没有任何消息。然而，我们刚刚收到一封信，要求为探险队提供额外资源。好像我们已经给的几百个金子还不够似的！。如果他们现在回家，他们将带着他们所获得的微薄的黄金。虽然信中确实承诺，如果我们愿意为探险队提供物资，就能获得巨大的财富......"
 me_tamilakam_unity_3_title:0 "丛林"
 me_tamilakam_unity_4.a:0 "白象"
 me_tamilakam_unity_4.b:0 "孟加拉虎"
 me_tamilakam_unity_4.c:0 "独角犀牛"
 me_tamilakam_unity_4_desc:0 "经过许多个月和无数次的投资，离开我们的王宫前往奥迪沙丛林的探险队已经回家了。他们带着一大批异国的动物，泰米尔人以前从未见过这样的动物。根据我们的协议，我们可以从探险队的最好战利品中挑选。这些强大的动物将在王宫里展示给所有人看。"
 me_tamilakam_unity_4_title:0 "丛林中的野兽"
 roman_marble_statue:0 "罗马大理石雕像"
 roman_marble_statue_desc:0 "由遥远的西方大都市罗马最好的工匠制作的大理石雕像，雕刻成我们伟大的统治者的样子。"
 royal_gorillas:0 "大猩猩"
 royal_gorillas_desc:0 "这些来自非洲的异国野兽是在神秘的阿拉伯土地上购买的。它们近乎人类的外表现在成为宫廷中的一种吸引力。"
 send_trade_fleet:0 "准备一支装有异国货物的贸易舰队。"
 send_trade_fleet_desc:0 "从昙密罗迦摩建立一个贸易船队，将异国商品送往外国。\n\n\n\n\n\n\n\n\n\n\n\n\n@decision_pic2!"
 tamil_empire:0 "泰米尔帝国"
 tamil_empire_desc:0 "皇帝对国家拥有绝对权力，通常对较小的国王和贵族拥有主权。"
 tamil_empire_ruler:0 "皇帝"
 tamil_king_crown:0 "泰米尔三王冕"
 tamil_king_crown_desc:0 "这顶王冕是为了象征三个伟大的泰米尔王朝的统一而铸造的。戴上这顶王冕的人被视为所有泰米尔人的真正统治者!"
 tamil_king_missions:0 "泰米尔之王"
 tamil_king_missions_BUTTON_TOOLTIP:0 "达罗毗荼将是我们的！"
 tamil_king_missions_CRITERIA_DESCRIPTION:0 "当我们确保了对南印度的霸权时，该使命完成。"
 tamil_king_missions_DESCRIPTION:0 "我们将带领王国走向伟大。"
 tamil_king_missions_task_1:0 "穆文达"
 tamil_king_missions_task_10:0 "摧毁泰米尔酋邦"
 tamil_king_missions_task_10_DESC:0 "泰米尔小酋长统治着我们的土地，我们必须把这些自命不凡的酋长国融入我们的王国。\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 tamil_king_missions_task_11:0 "突袭楞伽"
 tamil_king_missions_task_11_DESC:0 "征服室利楞伽会加强我们对敌国的威望。室利楞伽是全印度最富有的地方之一，他们会向我们伟大的王国臣服。\n\n\n\n\n\n\n\n\n\n@india_mil21!"
 tamil_king_missions_task_12:0 "打败敌对泰米尔王"
 tamil_king_missions_task_12_DESC:0 "我们的对手反抗我们太久了。我们已经变得足够强大，足以摧毁他们，未来也会如此。\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 tamil_king_missions_task_13:0 "主宰泰米尔人"
 tamil_king_missions_task_13_DESC:0 "湿婆帮助我们摧毁了泰米尔的对手，我们现在控制着昙密罗迦摩的富裕土地。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 tamil_king_missions_task_16:0 "贸易集散地"
 tamil_king_missions_task_16_DESC:0 "伟大的城市朅帝是印度最繁华的贸易城市之一。它以当地出产的美丽珍珠和宝石而闻名。在朅帝设置贸易中心将使我们的商人队伍更加壮大。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 tamil_king_missions_task_17:0 "桑迦姆文学"
 tamil_king_missions_task_17_DESC:0 "桑迦姆文学在这一时期以摩菟来的作品而闻名。桑迦姆是古代泰米尔人生活信息的最重要来源。诗人、作家、歌手和各种各样的人都涌向摩菟来，桑加姆文学已经在这里诞生了数千年。\n\n\n\n\n\n\n\n\n\n@india_por1!"
 tamil_king_missions_task_18:0 "摩菟来都会"
 tamil_king_missions_task_18_DESC:0 "摩菟来一直是般帝耶人的伟大首都。我们必须扩大摩菟来的基础设施，以继续发展。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 tamil_king_missions_task_19:0 "荣耀属于般帝耶！"
 tamil_king_missions_task_19_DESC:0 "伟大的般帝耶人是整个昙密罗迦摩的主人。般帝耶无比光荣！\n\n\n\n\n\n\n\n\n\n@india_mil9!"
 tamil_king_missions_task_1_DESC:0 "穆文达，即三冕王，指的是掣罗、朱罗和般帝耶三国组成的泰米尔政权，他们在孔雀王朝时期统治了印度南部。穆文达政权不稳定，容易发生战争，长期以来一直分裂泰米尔人。 通过在他们置于一国治下，我们将成为整个泰米尔的合法统治者。\n\n\n\n\n\n\n\n\n\n@india_por2!"
 tamil_king_missions_task_2:0 "大象战法"
 tamil_king_missions_task_20:0 "整合楞伽"
 tamil_king_missions_task_20_DESC:0 "我们可以从楞伽文化中学到很多东西。将他们的思想和人民融入我们的王国，将使我们对这片土地的统治合法化。"
 tamil_king_missions_task_21:0 "同化楞伽"
 tamil_king_missions_task_21_DESC:0 "斯里兰卡必须是泰米尔的！雅利安人统治这片土地的时间太久了。"
 tamil_king_missions_task_22:0 "考虑佛教价值观"
 tamil_king_missions_task_22_DESC:0 "佛教已经传播到我们王国的部分地区。我们应该邀请佛教徒来到我们的法庭，考虑他们的价值观。"
 tamil_king_missions_task_23:0 "考虑耆那教的价值观"
 tamil_king_missions_task_23_DESC:0 "耆那教已经传播到我们王国的部分地区。我们应该邀请耆那教的人到我们的法庭来考虑他们的价值观。"
 tamil_king_missions_task_24:0 "摩罗耶的问题"
 tamil_king_missions_task_24_DESC:0 "摩罗耶是昙密罗迦摩最有利可图的省份之一。现在我们已经控制了它，我们可以洗劫它，把财富带到我们的首都。"
 tamil_king_missions_task_25:0 "摩罗耶的繁荣"
 tamil_king_missions_task_25_DESC:0 "摩罗耶是整个昙密罗迦摩最富有的省份之一。它将在我们的统治下继续繁荣。"
 tamil_king_missions_task_26:0 "建立常备象兵"
 tamil_king_missions_task_26_DESC:0 "箭术和骑术在我国早已被传播，然而战场上战象的使用越来越多，它们将成为印度战争的潮流。我们必须建立专业的象兵部队，负责照顾和训练我们的战象。通过我们先进的大象训练方式，我们将粉碎敌人！\n\n\n\n\n\n\n\n\n\n@india_mil16!"
 tamil_king_missions_task_2_B_tt:0 "随机一个不发达的省份将开始生产#Y 大象#!.@elephants!。"
 tamil_king_missions_task_2_DESC:0 "在印度使用战象可以追溯到几个世纪前。尽管很难捕捉、繁殖和训练大象，但大象在战争中仍然非常有效。通过招募驯兽员和捕捉大象，我们可以在军队中建立一支象兵部队。\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 tamil_king_missions_task_2_tt:0 "至少有一个省需要进口#Y 大象#!。@elephants!。"
 tamil_king_missions_task_3:0 "先进的大象部队"
 tamil_king_missions_task_30:0 "战胜般帝耶和掣罗"
 tamil_king_missions_task_30_DESC:0 "我们必须迅速击败我们的对手，巩固我们对泰米尔人民的控制。印度有史以来最大的帝国孔雀正以惊人的速度向南扩张。我们必须为与他们不可避免的冲突做准备。\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 tamil_king_missions_task_31:0 "乌洛逾罗的纺织品"
 tamil_king_missions_task_31_DESC:0 "乌洛逾罗以生产的优质纺织品而闻名。发展这座伟大城市的基础设施将使我们非常富有。\n\n\n\n\n\n\n\n\n\n@india_por1!"
 tamil_king_missions_task_34:0 "干扰案达罗"
 tamil_king_missions_task_34_DESC:0 "我们必须在孔雀征服案达罗人并威胁到我们的统治之前向北挺进。\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 tamil_king_missions_task_35:0 "荣耀归于朱罗！"
 tamil_king_missions_task_35_DESC:0 "伟大的朱罗人是整个昙密罗迦摩的主人。朱罗无比光荣！\n\n\n\n\n\n\n\n\n\n@india_mil9!"
 tamil_king_missions_task_37:0 "掣罗香料贸易"
 tamil_king_missions_task_37_DESC:0 "掣罗是全印度最重要的贸易国家之一。通过在我们富饶的土地上发展香料生产方法，我们可以靠出口香料致富。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 tamil_king_missions_task_38:0 "扩大贸易网络"
 tamil_king_missions_task_38_DESC:0 "扩展与北印度人的贸易关系可以给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 tamil_king_missions_task_39:0 "印度洋贸易网络"
 tamil_king_missions_task_39_DESC:0 "我们已经建立了一个有利可图的印度洋贸易网络。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 tamil_king_missions_task_3_DESC:0 "事实证明，在我们的军队中增加战象是有效的。 大象能够击破敌人的阵型并击退骑兵，在我们的许多战役中，大象一直是关键。通过给大象装备高塔和采用新的训练方法，我们可以提高象兵部队的战斗效率。\n\n\n\n\n\n\n\n\n\n@india_mil11!"
 tamil_king_missions_task_4:0 "拥抱毗湿奴"
 tamil_king_missions_task_40:0 "槃支的香料"
 tamil_king_missions_task_40_DESC:0 "将我们的香料生产扩展到我们的首都相当明智。我们可以通过大大扩展槃支现有的基础设施来实现这一目标。\n\n\n\n\n\n\n\n\n\n@india_por1!"
 tamil_king_missions_task_43:0 "荣耀归于掣罗！"
 tamil_king_missions_task_43_DESC:0 "伟大的掣罗人是整个昙密罗迦摩的主人。掣罗无比光荣！\n\n\n\n\n\n\n\n\n\n@india_mil9!"
 tamil_king_missions_task_44:0 "第一学院"
 tamil_king_missions_task_44_DESC:0 "我们必须学习我们祖先赐予我们的古老的桑迦姆文学。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 tamil_king_missions_task_45:0 "发展槃支"
 tamil_king_missions_task_45_DESC:0 "发展槃支会给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 tamil_king_missions_task_46:0 "发展摩菟来"
 tamil_king_missions_task_46_DESC:0 "发展摩菟来将给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!>"
 tamil_king_missions_task_47:0 "发展乌洛逾罗"
 tamil_king_missions_task_47_DESC:0 "发展乌洛逾罗将给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!>"
 tamil_king_missions_task_48:0 "羯梨祇的港口"
 tamil_king_missions_task_48_DESC:0 "羯梨祇是通往我们伟大土地的门户。扩大该省的贸易港口将使我们从贸易中获得财富。\n\n\n\n\n\n\n\n\n\n@india_mil1!>"
 tamil_king_missions_task_49:0 "巩固关隘"
 tamil_king_missions_task_49_DESC:0 "我们必须巩固我们北部和南部的山口关隘，以确保槃支的安全。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 tamil_king_missions_task_4_DESC:0 "毗湿奴是印度教的主要神祇之一。毗湿奴是三位一体(与梵天、湿婆并称)中的保护者，是创造、保护和改造宇宙的至高存在。如果我们接受毗湿奴的崇拜，我们可能会得到他对我们未来征服的祝福。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 tamil_king_missions_task_5:0 "拥抱湿婆"
 tamil_king_missions_task_50:0 "巩固关隘"
 tamil_king_missions_task_50_DESC:0 "我们必须巩固我们北部和南部的山口关隘，以确保摩菟来的安全。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 tamil_king_missions_task_51:0 "确保乌洛逾罗的安全"
 tamil_king_missions_task_51_DESC:0 "我们必须巩固乌洛逾罗周围的地区，以确保它的繁荣。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 tamil_king_missions_task_5_DESC:0 "湿婆是三神中的第二位。湿婆是掌管毁灭、冥想和瑜伽的神，是印度教四大分支之一的湿婆派的主要神灵。如果我们接受湿婆的崇拜，我们可能会得到‘毁灭者’的祝福。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 tamil_king_missions_task_6:0 "泰米尔酋邦的附庸化"
 tamil_king_missions_task_60:0 "考虑正命论教义"
 tamil_king_missions_task_60_DESC:0 "正命论已在我国部分领地传播。我们应当邀请该教派学者入宫，以审思其教义价值。"
 tamil_king_missions_task_6_DESC:0 "独立的泰米尔酋邦仍然统治着泰米尔的部分地区。我们必须将这些酋长的领地置于我们的控制之下。\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 tamil_king_missions_task_7:0 "附庸楞伽王国"
 tamil_king_missions_task_7_DESC:0 "室利楞伽的雅利安人必须接受我们的统治，征服楞伽一定会给我们带来巨大的财富。\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 tamil_king_missions_task_8:0 "附庸昙密罗迦摩"
 tamil_king_missions_task_8_DESC:0 "征服昙密罗迦摩给我们在所有泰米尔人中带来了巨大的威望。在昙密罗迦摩被我们牢牢控制的情况下，我们的臣民将更愿意融入我们伟大的国家。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 tamil_king_missions_task_9:0 "团结泰米尔人"
 tamil_king_missions_task_9_DESC:0 "拥抱毗湿奴带来了我们人民的繁荣，所有泰米尔人现在都在一个国王的治下。毗湿奴的祝福将确保我们在未来几个世纪继续繁荣。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 tamil_king_missions_task_final:0 "昙密罗迦摩！"
 tamil_king_missions_task_final_DESC:0 "我们把泰米尔人联合成一个王国。光明与伟大在等待着我们！\n\n\n\n\n\n\n\n\n\n@india_por2!"

l_simp_chinese:
 01_sparta_missions_02_peloponnesus:0 "伯罗奔尼撒半岛的保护者"
 01_sparta_missions_02_peloponnesus_BUTTON_TOOLTIP:0 "在确保拉科尼亚的安全后，是时候将目光投向伯罗奔尼撒半岛的其他地区了。"
 01_sparta_missions_02_peloponnesus_CRITERIA_DESCRIPTION:0 "当你控制了伯罗奔尼撒半岛，该任务将视为完成。"
 01_sparta_missions_02_peloponnesus_DESCRIPTION:0 "长期以来，我们的目标是在伯罗奔尼撒半岛形成一个霸权，一个防止野心勃勃的外国人的联盟。如果整个半岛都在我们的统治之下，我们就不必再害怕其他希腊城邦和联盟，也不必害怕继业者。"
 01_sparta_missions_02_peloponnesus_task_1:0 "厄勒亚蛮族"
 01_sparta_missions_02_peloponnesus_task_10:0 "北部海岸线"
 01_sparta_missions_02_peloponnesus_task_10_DESC:0 "伯罗奔尼撒半岛的北边是亚该亚，离我们自己、阿尔戈斯、美塞尼亚和阿卡迪亚人之间的不断斗争有些距离。他们最近崛起，并开始在半岛的区域政治中发挥更大的作用。"
 01_sparta_missions_02_peloponnesus_task_11:0 "谷地的文明化"
 01_sparta_missions_02_peloponnesus_task_11_DESC:0 "在阿卡迪亚建立一个城市中心将为我们提供一个城市，从那里我们可以控制该地区的其他地方。"
 01_sparta_missions_02_peloponnesus_task_11_trigger_tt:0 "无论是#Y [GetProvince('(int32)436').GetName]#!、#Y [GetProvince('(int32)7891').GetName]#!、#Y [GetProvince('(int32)438').GetName]#!、#Y [GetProvince('(int32)435').GetName]#!、#Y [GetProvince('(int32)449').GetName]#!还是#Y [GetProvince('(int32)448').GetName]#! 都满足以下所有要求：\n *属于#Y [SCOPE.GetRootScope.GetCountry.GetName]#!。\n *拥有至少#Y 25#!的人口。\n *拥有城市地位。\n *拥有至少#Y 50#!的文明值。"
 01_sparta_missions_02_peloponnesus_task_12:0 "强化[GetProvince('(int32)418').GetName]的防御"
 01_sparta_missions_02_peloponnesus_task_12_DESC:0 "[GetProvince('(int32)418').GetName]曾是一座重要城市，也是我们的对手，但如今已退化为驻军城镇，供其他试图控制伯罗奔尼撒与希腊其余地区之间海峡的国家使用。"
 01_sparta_missions_02_peloponnesus_task_12_trigger_tt_1:0 "#Y [GetProvince('(int32)418').GetName]#!领土是一座已建立的城市。"
 01_sparta_missions_02_peloponnesus_task_12_trigger_tt_2:0 "#Y [GetProvince('(int32)418').GetName]#!领土拥有至少#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_12_total')|0]#!座$fortress_building$。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_02_peloponnesus_task_12_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_12_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_13:0 "宙斯的故乡"
 01_sparta_missions_02_peloponnesus_task_13_DESC:0 "奥林匹亚是伟大的宙斯神庙的所在地，也是著名的奥林匹克运动会的举办地。无论谁统治这个地区，都必须适当地敬畏，并以应有的尊严对待它。"
 01_sparta_missions_02_peloponnesus_task_13_trigger_tt_1:0 "#Y [GetProvince('(int32)439').GetName]#!领土拥有至少#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_13_total')|0]#!人口。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_02_peloponnesus_task_13_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_13_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_13_trigger_tt_2:0 "#Y [GetProvince('(int32)439').GetName]#!领土拥有至少#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_13_2_total')|0]#!座$temple_building$。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_02_peloponnesus_task_13_2_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_13_2_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_14:0 "参加阿耳戈斯人的活动"
 01_sparta_missions_02_peloponnesus_task_14_DESC:0 "阿尔戈斯人长期以来一直是斯巴达的对手，在我们吞并该地区后，他们仍在与我们的统治作斗争。"
 01_sparta_missions_02_peloponnesus_task_14_trigger_tt:0 "#Y [GetProvince('(int32)440').GetState.GetName]#!省份忠诚度至少为#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_14_total')|0]#!。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_02_peloponnesus_task_14_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_14_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_14_trigger_tt_2:0 "#Y [GetProvince('(int32)440').GetOwner.GetName]#!附属国忠诚度至少为#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_14_2_total')|0]#!。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_02_peloponnesus_task_14_2_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_14_2_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_15:0 "阿卡迪亚农村"
 01_sparta_missions_02_peloponnesus_task_15_DESC:0 "拉科尼亚的北部是阿卡迪亚，是我们长期以来的邻居。虽然我们已经控制了这个地区，但基础设施仍然有些欠缺。"
 01_sparta_missions_02_peloponnesus_task_15_trigger_tt_1:0 "#Y [THIS.GetProvince.GetName]#! 的领土至少有#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_1_total')|0]#! 的建筑。([THIS.GetProvince.Custom('sparta_mission_02_peloponnesus_task_15_1_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_1_total')|0]#!)"
 01_sparta_missions_02_peloponnesus_task_15_trigger_tt_2:0 "#Y [THIS.GetProvince.GetOwner.GetName]#! 的附属国忠诚度至少为#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_2_total')|0]#!。([THIS.GetProvince.Custom('sparta_mission_02_peloponnesus_task_15_2_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_15_2_total')|0]#!)"
 01_sparta_missions_02_peloponnesus_task_16:0 "亚该亚海岸线"
 01_sparta_missions_02_peloponnesus_task_16_DESC:0 "$01_sparta_missions_02_peloponnesus_task_10_DESC$"
 01_sparta_missions_02_peloponnesus_task_16_tt:0 "无论是#Y [GetProvince('(int32)7890').GetName]#!、#Y [GetProvince('(int32)434').GetName]#!、#Y [GetProvince('(int32)444').GetName]#!还是#Y [GetProvince('(int32)7893').GetName]#! 都符合以下所有要求：\n *为#Y [SCOPE.GetRootScope.GetCountry.GetName]#!所有。\n *至少有#Y 15#!人口。\n *至少有#Y 3#! 座建筑。\n *没有正在进行的建设。"
 01_sparta_missions_02_peloponnesus_task_1_DESC:0 "奥林匹亚周围的神庙和地区长期以来一直被来自北方的厄勒亚蛮族所控制。需要适当的希腊人来保护宙斯的家园。"
 01_sparta_missions_02_peloponnesus_task_2:0 "解放宙斯神庙"
 01_sparta_missions_02_peloponnesus_task_2_DESC:0 "我们对奥林匹亚的解放将受到好评，在凡人和神灵中都是如此。"
 01_sparta_missions_02_peloponnesus_task_3:0 "宙斯的祭司们"
 01_sparta_missions_02_peloponnesus_task_3_DESC:0 "奥林匹亚周围的富裕地区长期以来一直在寻求自我管理，特别是在埃利安人的严酷统治之后。"
 01_sparta_missions_02_peloponnesus_task_3_effect_tt:0 "释放#Y $OLYMPIA_FEUDATORY_NAME$#!作为#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的#Y 藩属#!。"
 01_sparta_missions_02_peloponnesus_task_3_effect_tt_2:0 "只要#Y 奥林匹亚#!仍是#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的藩属，他们就会获得以下修正："
 01_sparta_missions_02_peloponnesus_task_4:0 "宗教的支持"
 01_sparta_missions_02_peloponnesus_task_4_DESC:0 "众所周知，阿基辅人谎报和操纵他们的宗教节日，以迫使敌军离开他们的土地，否则将面临可能冒犯的神灵的愤怒。在神的眷顾下，我们将使他们的谎言变得空洞。"
 01_sparta_missions_02_peloponnesus_task_5:0 "阿尔戈斯的对手"
 01_sparta_missions_02_peloponnesus_task_5_DESC:0 "阿尔戈斯长期以来一直是我们在伯罗奔尼撒半岛的主要对手之一，尤其是在近代。经过多年对赛努里亚和拉科尼亚东部土地的争夺，现在是我们结束这场竞争的时候了。"
 01_sparta_missions_02_peloponnesus_task_6:0 "阿卡迪亚腹地"
 01_sparta_missions_02_peloponnesus_task_6_DESC:0 "拉科尼亚的北部是阿卡迪亚，是我们长期以来的邻居。他们最近被证明是对斯巴达的一个威胁，他们在我们的土地附近建立了一个大型的城市中心。"
 01_sparta_missions_02_peloponnesus_task_7:0 "潘的故乡"
 01_sparta_missions_02_peloponnesus_task_7_DESC:0 "随着阿卡迪亚城市在我们的控制之下，我们将能够把目光投向新的土地，而不是担心家园的潜在危险。"
 01_sparta_missions_02_peloponnesus_task_8:0 "重建阿尔戈斯"
 01_sparta_missions_02_peloponnesus_task_8_DESC:0 "阿尔戈斯曾经是我们最大的对手之一，现在可以成为我们最重要的城市之一。"
 01_sparta_missions_02_peloponnesus_task_8_trigger_tt_1:0 "#Y [GetProvince('(int32)440').GetName]#!领土是一座已建立的城市。"
 01_sparta_missions_02_peloponnesus_task_8_trigger_tt_2:0 "#Y [GetProvince('(int32)440').GetName]#!领土拥有至少#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_2_total')|0]#!人口。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_08_peloponnesus_task_8_trigger_2_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_2_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_8_trigger_tt_3:0 "#Y [GetProvince('(int32)440').GetName]#!领土拥有#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_3_total')|0]#!座或更多建筑。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_08_peloponnesus_task_8_trigger_3_custom_loc')]/#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_3_total')|0]#!）"
 01_sparta_missions_02_peloponnesus_task_9:0 "向阿斯克勒庇俄斯致敬"
 01_sparta_missions_02_peloponnesus_task_9_DESC:0 "阿斯克勒皮奥斯已经被广泛地培养起来，并以其治疗师而闻名，但很少有像埃皮达鲁斯的那一个那样受欢迎或有名。"
 01_sparta_missions_02_peloponnesus_task_final:0 "征服伯罗奔尼撒半岛"
 01_sparta_missions_02_peloponnesus_task_final_DESC:0 "多年来，我们在伯罗奔尼撒半岛有许多对手，现在是时候实现我们的梦想，成为半岛的真正霸主了。"

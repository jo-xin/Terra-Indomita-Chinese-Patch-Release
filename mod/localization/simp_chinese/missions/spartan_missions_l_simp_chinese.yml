 spartan_mission_01_laconia:0 "斯巴达的复辟"
 spartan_mission_01_laconia_BUTTON_TOOLTIP:0 "斯巴达已经被许多人扔在一边，就像过去的工艺品。现在是我们崛起并证明他们都错了的时候了。"
 spartan_mission_01_laconia_CRITERIA_DESCRIPTION:0 "当你征服并巩固了整个拉科尼亚后，这项任务才算完成。"
 spartan_mission_01_laconia_DESCRIPTION:0 "我们已经被野心勃勃的外国军阀蹂躏，嫉妒斯巴达的强大，使我们变得虚弱，没有了以前的盟友和臣民。如果我们要再次成为希腊重要的地区性行为者，我们需要恢复斯巴达城昔日的荣耀，并结束我们当地的竞争对手。"
 spartan_mission_01_laconia_task_1:0 "斯巴达的复兴"
 spartan_mission_01_laconia_task_10:0 "黑劳士再次出现"
 spartan_mission_01_laconia_task_10_DESC:0 "随着美塞尼亚在我们的控制之下，整个拉科尼亚将最终在拉栖代梦的统治下再次团结起来。外部的威胁不再会拆毁属于我们的东西。"
 spartan_mission_01_laconia_task_11:0 "重新整合美塞尼亚"
 spartan_mission_01_laconia_task_11_DESC:0 "$spartan_mission_01_laconia_task_12_DESC$"
 spartan_mission_01_laconia_task_11_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_11_current')|0]#!"
 spartan_mission_01_laconia_task_11_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_11_current')|0]#!"
 spartan_mission_01_laconia_task_11_trigger_tt:0 "#Y [GetProvince('(int32)431').GetName]#!领土拥有#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_11_total')|0]#!座或更多建筑。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_11_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_11_total')|0]#!）"
 spartan_mission_01_laconia_task_12:0 "美塞尼亚的土地"
 spartan_mission_01_laconia_task_12_DESC:0 "虽然这座城市由忒拜的伊巴密浓达建立，原本是为了制衡斯巴达的力量，但现在我们将转而利用[GetProvince('(int32)431').GetName]，在其基础上继续建设。"
 spartan_mission_01_laconia_task_13:0 "奴隶制管理"
 spartan_mission_01_laconia_task_13_DESC:0 "在斯巴达，黑劳士经常受到严厉的对待，导致了许多叛乱和反抗的发生。解决这个反复出现的问题，可以让我们在离开家的时候不用担心奴隶的安全。"
 spartan_mission_01_laconia_task_14:0 "处理黑劳士问题"
 spartan_mission_01_laconia_task_14_DESC:0 "既然我们已经决定了如何对待我们的奴隶，剩下的就是在我们所有的土地上执行了。"
 spartan_mission_01_laconia_task_14_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_14_current')|0]#!"
 spartan_mission_01_laconia_task_14_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_14_current')|0]#!"
 spartan_mission_01_laconia_task_14_effect_tt:0 "*如果黑劳士受到良好待遇。"
 spartan_mission_01_laconia_task_14_effect_tt_2:0 "\n*如果黑劳士的待遇很差。"
 spartan_mission_01_laconia_task_14_trigger_fallback:0 "必须在使命任务“#Y 奴隶治理#!”中选择一条道路。"
 spartan_mission_01_laconia_task_14_trigger_tt:0 "#Y [GetProvince('(int32)431').GetName]#!领土的奴隶平均幸福度至少为#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_14_total')|0]#!。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_14_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_14_total')|0]#!）"
 spartan_mission_01_laconia_task_14_trigger_tt_2:0 "#Y [GetProvince('(int32)431').GetName]#!领土中必须有至少#Y 1#!名奴隶人口。"
 spartan_mission_01_laconia_task_15:0 "通往奥林匹亚的道路"
 spartan_mission_01_laconia_task_15_DESC:0 "莱普雷恩的伊莱恩人封锁了从美塞尼亚到奥林匹亚的道路。在我们的统治下，我们将能更自由地穿越伯罗奔尼撒西部，在需要时接近宙斯神庙。"
 spartan_mission_01_laconia_task_1_DESC:0 "为斯巴达的新崛起做准备的第一步是重建我们的家园。"
 spartan_mission_01_laconia_task_1_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_1_current')|0]#!"
 spartan_mission_01_laconia_task_1_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_1_current')|0]#!"
 spartan_mission_01_laconia_task_1_trigger_tt:0 "#Y [GetProvince('(int32)427').GetName]#!领土拥有#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_1_total')|0]#!座或更多建筑。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_1_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_1_total')|0]#!）"
 spartan_mission_01_laconia_task_2:0 "拉科尼亚的食物"
 spartan_mission_01_laconia_task_2_DESC:0 "当我们在忒拜的入侵中失去了美塞尼亚时，我们不得不用我们所拥有的东西来解决。经过那场痛苦的折磨，我们必须学会充分利用拉科尼亚的农田。"
 spartan_mission_01_laconia_task_2_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_2_current')|0]#!"
 spartan_mission_01_laconia_task_2_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_2_current')|0]#!"
 spartan_mission_01_laconia_task_2_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 拉科尼亚省#! 至少拥有#Y 1#! 块领地，拥有：\n * @slaves! #Y 10#! 奴隶\n * #Y $basic_settlement_infratructure_building$#! 建筑"
 spartan_mission_01_laconia_task_2_trigger_tt_2:0 "#Y 拉科尼亚省#! 至少有#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_2_total')|0]#! 食物。 ([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_2_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_2_total')|0]#!)"
 spartan_mission_01_laconia_task_3:0 "招募斯基里泰人"
 spartan_mission_01_laconia_task_3_DESC:0 "农村的斯基里泰人生活在拉科尼亚和阿卡迪亚的边界，他们曾经是斯巴达的忠实臣民。我们可以说服他们回到我们身边，再次成为盟友。"
 spartan_mission_01_laconia_task_3_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_3_current')|0]#!"
 spartan_mission_01_laconia_task_3_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_3_current')|0]#!"
 spartan_mission_01_laconia_task_3_trigger_tt:0 "#Y [GetProvince('(int32)427').GetName]#!领土的自由民平均幸福度至少为#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_3_total')|0]#!。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_3_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_3_total')|0]#!）"
 spartan_mission_01_laconia_task_4:0 "扩大基础设施"
 spartan_mission_01_laconia_task_4_DESC:0 "我们的人民被底比斯人蹂躏，受到马其顿人的威胁，长期以来一直受制于他人的指责。我们需要重建当地的基础设施，使其能够支持我们大胆的野心。"
 spartan_mission_01_laconia_task_5:0 "斯巴达人"
 spartan_mission_01_laconia_task_5_DESC:0 "尽管其他国家把精力集中在建造宏伟的寺庙、巨大的灯塔或巨大的雕像上，但斯巴达一直是创造伟大战士的最佳选择。"
 spartan_mission_01_laconia_task_5_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_5_current')|0]#!"
 spartan_mission_01_laconia_task_5_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_5_current')|0]#!"
 spartan_mission_01_laconia_task_5_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的军队规模至少为#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_5_total')|0]#!。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_5_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_5_total')|0]#!)"
 spartan_mission_01_laconia_task_6:0 "斯巴达的港口"
 spartan_mission_01_laconia_task_6_DESC:0 "为了面对任何战场上的威胁，我们必须确保我们能够组建一支海军和一支军队。"
 spartan_mission_01_laconia_task_6_custom_loc_desc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_01_laconia_task_6_current')|0]#!"
 spartan_mission_01_laconia_task_6_custom_loc_desc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_6_current')|0]#!"
 spartan_mission_01_laconia_task_6_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少拥有#Y 1#! 个具有城市地位的领地和一个港口。"
 spartan_mission_01_laconia_task_6_trigger_tt_2:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的海军规模至少为#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_6_total')|0]#!。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_01_laconia_task_6_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_01_laconia_task_6_total')|0]#!)"
 spartan_mission_01_laconia_task_7:0 "阿耳忒弥斯·俄耳提亚的圣所"
 spartan_mission_01_laconia_task_7_DESC:0 "对阿耳忒弥斯·俄耳提亚的崇拜可以追溯到数个世纪之前，直到斯巴达的建立。她的神庙在艰难时期倒塌，反映了我们国家的命运，这对我们二者都是羞辱。可以让她的领地恢复往日的荣光，是我们的荣幸。"
 spartan_mission_01_laconia_task_7_effect_tt:0 "解锁神灵#Y $deity_artemis_orthia$#!。"
 spartan_mission_01_laconia_task_8:0 "强化赛努里亚"
 spartan_mission_01_laconia_task_8_DESC:0 "长期以来，赛努里亚的土地一直是亚基和拉凯戴蒙利益集团之间的战场；加固该地区将确保我们在该地区的存在。"
 spartan_mission_01_laconia_task_9:0 "美塞尼亚的黑劳士"
 spartan_mission_01_laconia_task_9_DESC:0 "美塞尼亚的黑劳士曾经被统治过；他们的独立和傲慢是对斯巴达利益的一种侮辱。"
 spartan_mission_01_laconia_task_final:0 "拉科尼亚的实力"
 spartan_mission_01_laconia_task_final_DESC:0 "随着整个拉科尼亚在我们的统治之下，我们已经证明那些怀疑拉凯戴蒙人的人是错误的。斯巴达将再次成为伯罗奔尼撒半岛的主要力量，假以时日将成为整个希腊的主要力量。"

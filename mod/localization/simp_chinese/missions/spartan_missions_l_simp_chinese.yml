 spartan_mission_03_peloponnesian_league:0 "第二次伯罗奔尼撒联盟"
 spartan_mission_03_peloponnesian_league_BUTTON_TOOLTIP:0 "恢复古老的伯罗奔尼撒联盟的时机已经到来。"
 spartan_mission_03_peloponnesian_league_CRITERIA_DESCRIPTION:0 "当我们重建了古代伯罗奔尼撒联盟的基础时，我们的任务才算完成。"
 spartan_mission_03_peloponnesian_league_DESCRIPTION:0 "我们曾经是伯罗奔尼撒的霸主，是受人尊敬的伯罗奔尼撒联盟的领袖。在我们的臣民背叛之后，联盟被推翻，并最终被底比斯人和马其顿人压制。随着我们的崛起，我们已经开始着手建立一个新的伯罗奔尼撒联盟。"
 spartan_mission_03_peloponnesian_league_task_1:0 "伯罗奔尼撒半岛的城市"
 spartan_mission_03_peloponnesian_league_task_10:0 "希腊的珍珠"

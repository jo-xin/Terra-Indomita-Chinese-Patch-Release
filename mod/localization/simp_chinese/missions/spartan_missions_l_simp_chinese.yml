 spartan_mission_03_peloponnesian_league_task_12_trigger_seleucid_tt:0 "在#Y $greece_region$#!，#Y 塞琉古帝国#!或其任意附属国不拥有任何领地。[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_12_seleucid_custom_loc')]"
 spartan_mission_03_peloponnesian_league_task_12_trigger_thrace_tt:0 "在#Y $greece_region$#!地区。没有任何由#Y 色雷斯#!或其附属国控制的领地。[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_12_thrace_custom_loc')]"
 spartan_mission_03_peloponnesian_league_task_1_DESC:0 "为了恢复伯罗奔尼撒联盟昔日的辉煌，我们必须控制伯罗奔尼撒半岛的所有主要城市。"
 spartan_mission_03_peloponnesian_league_task_2:0 "伯罗奔尼撒的霸权"
 spartan_mission_03_peloponnesian_league_task_2_DESC:0 "为了确保我们的霸权，我们必须向所有受我们影响的城市和地区说明情况。"
 spartan_mission_03_peloponnesian_league_task_3:0 "联盟基础设施"
 spartan_mission_03_peloponnesian_league_task_3_DESC:0 "如果我们要成为一个远在伯罗奔尼撒半岛边界之外的著名联盟，我们需要强大的主要城市，让小村庄和城邦涌向这些城市。"
 spartan_mission_03_peloponnesian_league_task_3_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_3_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_3_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少拥有#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_total')|0]#! 在#Y $south_peleponnesos_area$省#!、#Y $achaea_area$省#!或#Y $arcadia_area$省#!的既定城市。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_3_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_3_total')|0]#!)"
 spartan_mission_03_peloponnesian_league_task_4:0 "联盟的军队"
 spartan_mission_03_peloponnesian_league_task_4_DESC:0 "军队是我们国家的骨干，也是我们控制联盟的工具。如果我们想在可预见的未来继续成为伯罗奔尼撒半岛的霸主，就必须有一支军队。"
 spartan_mission_03_peloponnesian_league_task_4_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_4_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_4_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_4_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_4_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的军队规模至少为#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_4_total')|0]#!。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_4_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_4_total')|0]#!)"
 spartan_mission_03_peloponnesian_league_task_5:0 "联盟的海军"
 spartan_mission_03_peloponnesian_league_task_5_DESC:0 "随着联盟的恢复，我们将不得不找到应对新的潜在威胁的办法。其中之一就是需要一支更强大的海军，以保护伯罗奔尼撒半岛的海岸。"
 spartan_mission_03_peloponnesian_league_task_5_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_5_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_5_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_5_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_5_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的海军规模至少为#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_5_total')|0]#!。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_03_peloponnesian_league_task_5_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_5_total')|0]#!)"
 spartan_mission_03_peloponnesian_league_task_6:0 "国内的和平"
 spartan_mission_03_peloponnesian_league_task_6_DESC:0 "我们的历史是一部起义和叛乱的历史，常常使我们的家园和人民处于危险之中。"

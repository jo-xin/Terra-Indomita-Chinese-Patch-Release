 spartan_mission_03_peloponnesian_league_task_final:0 "恢复的联盟"
 spartan_mission_03_peloponnesian_league_task_final_DESC:0 "恢复伯罗奔尼撒联盟将确保所有拉栖代梦人、阿卡迪亚人、亚该亚人和厄勒亚人的安全和保护。"
 spartan_mission_04_rivals:0 "古老的对手"
 spartan_mission_04_rivals_BUTTON_TOOLTIP:0 "尽管我们已经收复了大部分曾经属于我们的土地，但古老的对手仍然在我们的边界徘徊，准备对任何软弱的迹象进行打击。"
 spartan_mission_04_rivals_CRITERIA_DESCRIPTION:0 "当我们征服了我们古老的对手后，这个使命才算完成。"
 spartan_mission_04_rivals_DESCRIPTION:0 "在斯巴达和伯罗奔尼撒联盟的漫长历史中，我们遭受过许多对手的攻击，他们对我们的土地充满了野心和欲望。他们都希望成为我们一直注定要成为的希腊霸主。马其顿人、底比斯人和雅典人--过去的过时国家。"
 spartan_mission_04_rivals_task_1:0 "雅典的人民"
 spartan_mission_04_rivals_task_10:0 "平定联盟"
 spartan_mission_04_rivals_task_10_DESC:0 "希腊的中心是古玻奥提亚联盟，西起奥克米诺斯，东至塔纳格拉。就像忒拜曾经利用联盟成为希腊的霸主一样，我们将利用它来确保对我们北部边界的控制。"
 spartan_mission_04_rivals_task_11:0 "结束马其顿的威胁"
 spartan_mission_04_rivals_task_11_DESC:0 "马其顿的野蛮人长期以来一直声称自己是希腊人的后代，即使他们压迫和吞并了希腊的大部分地区。随着我们最近的地区性胜利，现在是时候结束马其顿的威胁，自己控制北方了。"
 spartan_mission_04_rivals_task_12:0 "马其顿人的家园"
 spartan_mission_04_rivals_task_12_DESC:0 "我们将控制马其顿地区最重要的城市。珀拉、塞萨洛尼克和安菲波利斯。有了这三座城市在我们的控制之下，古马其顿的君主制将最终动摇，我们可以结束他们贪婪的野心。"
 spartan_mission_04_rivals_task_12_effect_tt:0 "[THIS.GetProvince.GetName]的很大一部分人口将迁移。"
 spartan_mission_04_rivals_task_13:0 "斯巴达的和平"
 spartan_mission_04_rivals_task_13_DESC:0 "马其顿人已经习惯了压迫别人，现在他们将不得不学会在别人的统治下生活。他们居住在文明世界的边缘，作为抵御居住在更北部和东部的野蛮人的堡垒，他们将在控制该地区方面发挥重要作用。"
 spartan_mission_04_rivals_task_13_chalkidiki_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_04_rivals_task_13_chalkidiki_current')|0]#!"
 spartan_mission_04_rivals_task_13_chalkidiki_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_13_chalkidiki_current')|0]#!"

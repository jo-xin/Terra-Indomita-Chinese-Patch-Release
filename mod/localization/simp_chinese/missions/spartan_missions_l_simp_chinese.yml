 spartan_mission_03_peloponnesian_league_task_10_6:0 "#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_10_corinth_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_10_7:0 "#R [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_10_megalopolis_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_10_8:0 "#Y [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_10_megalopolis_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_10_9:0 "#R [SCOPE.ScriptValue('spartan_mission_03_peloponnesian_league_task_10_messene_current')|0]#!"
 spartan_mission_03_peloponnesian_league_task_10_DESC:0 "我们的目标不仅仅是让这些城市成为其所在地区最伟大的城市，而是在整个地中海地区众所周知的名字。"
 spartan_mission_03_peloponnesian_league_task_10_effect_tt:0 "#Y [GetProvince('(int32)427').GetName]#!、#Y [GetProvince('(int32)418').GetName]#!、#Y [GetProvince('(int32)440').GetName]#!、#Y [GetProvince('(int32)431').GetName]#!、#Y [GetProvince('(int32)446').GetName]#!和#Y [GetProvince('(int32)436').GetName]#!的领土永久获得"

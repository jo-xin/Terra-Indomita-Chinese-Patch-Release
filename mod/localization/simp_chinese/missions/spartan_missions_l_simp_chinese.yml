 spartan_mission_03_peloponnesian_league_task_7:0 "联盟的首都"
 spartan_mission_03_peloponnesian_league_task_7_DESC:0 "伯罗奔尼撒半岛较大的城市有着悠久而宝贵的历史，为其直接社区发挥着重要作用。当我们继续建设当地的基础设施时，我们应该把精力放在这些城市中心。"
 spartan_mission_03_peloponnesian_league_task_7_effect_tt:0 "#Y [GetProvince('(int32)427').GetName]#!、#Y [GetProvince('(int32)418').GetName]#!、#Y [GetProvince('(int32)440').GetName]#!、#Y [GetProvince('(int32)431').GetName]#!、#Y [GetProvince('(int32)446').GetName]#!和#Y [GetProvince('(int32)436').GetName]#!的领土永久获得"
 spartan_mission_03_peloponnesian_league_task_8:0 "东部首府"
 spartan_mission_03_peloponnesian_league_task_8_DESC:0 "伯罗奔尼撒东部坐落着[GetProvince('(int32)418').GetName]和[GetProvince('(int32)440').GetName]，这两座城市长期以来都是各自地区的霸主和管理者。虽然它们曾是我们的古老宿敌，如今却将在我们的宏伟计划与雄心中担任区域管事者的角色。"

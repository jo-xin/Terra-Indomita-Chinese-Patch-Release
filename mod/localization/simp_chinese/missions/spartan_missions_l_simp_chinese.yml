 spartan_mission_04_rivals_task_13_trigger_macedonia_tt:0 "#Y $macedonia_area$#!至少拥有#Y 100#!点国家忠诚度。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_13_macedonia_custom_loc')]/#Y 100#!)"
 spartan_mission_04_rivals_task_13_trigger_own_chalkidiki_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少在#Y $chalkidiki_area$#!拥有#Y 1#!领地。"
 spartan_mission_04_rivals_task_13_trigger_own_macedonia_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y $macedonia_area$省份#!至少拥有#Y 1#!领地。"
 spartan_mission_04_rivals_task_1_DESC:0 "雅典城曾经是我们最大的对手之一，因为我们都是各自联盟的领导者。虽然它已不再是过去那个强大的对手，但吞并他们的古都对我们的人来说将是一个重要的象征性胜利。"
 spartan_mission_04_rivals_task_2:0 "攻下长城"
 spartan_mission_04_rivals_task_2_DESC:0 "我们在赢得伯罗奔尼撒战争时摧毁了雅典和比雷埃夫斯之间的长城，但他们似乎在那之后又大言不惭地要重建这些长城。是时候彻底铲平这些防御工事了。"
 spartan_mission_04_rivals_task_2_effect_tt:0 "在#Y [THIS.GetProvince.GetName]#!中所有领地上的$fortress_building$都会被摧毁。"
 spartan_mission_04_rivals_task_3:0 "重建雅典"
 spartan_mission_04_rivals_task_3_DESC:0 "虽然我们必须确保雅典永远不会再起来反对我们，但它是一个太重要的城市，不能不充分利用其潜力。城市周围丰富的农田，古老的基础设施，以及美丽的寺庙。一切都应该恢复到它以前的辉煌。"
 spartan_mission_04_rivals_task_3_custom_loc_1:0 "(目前：#R [SCOPE.ScriptValue('spartan_mission_04_rivals_task_3_current')|0]#!)"
 spartan_mission_04_rivals_task_3_trigger_tt:0 "#Y [GetProvince('(int32)416').GetName]#! 的领土上没有可用的建筑位置。[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_3_custom_loc')]"
 spartan_mission_04_rivals_task_4:0 "斯巴达的驻军"
 spartan_mission_04_rivals_task_4_DESC:0 "对于那些试图征服城市的人来说，雅典人经常被证明是有问题的。我们将建立一支庞大的驻军，以确保这种情况不会再次发生。"
 spartan_mission_04_rivals_task_4_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_04_rivals_task_4_current')|0]#!"
 spartan_mission_04_rivals_task_4_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_4_current')|0]#!"
 spartan_mission_04_rivals_task_4_effect_tt:0 "最多#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_4_total')|0]#!队位于#Y [GetProvince('(int32)416').GetName]#!的步兵会被移除。"
 spartan_mission_04_rivals_task_4_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_4_total')|0]#! 的领土上至少有#Y [GetProvince('(int32)416').GetName]#!支步兵。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_4_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_4_total')|0]#!)"
 spartan_mission_04_rivals_task_5:0 "埃利乌西斯的神秘事件"
 spartan_mission_04_rivals_task_5_DESC:0 "长期以来，雅典人在埃利乌西斯向德墨忒尔和库雷女神献上了他们的崇拜，几个世纪以来，一个特殊的崇拜在雅典和阿提克的政治和日常生活中发挥着重要作用。"
 spartan_mission_04_rivals_task_5_effect_tt:0 "解锁神灵#Y $deity_demeter_potnia$#!。"
 spartan_mission_04_rivals_task_6:0 "帖撒利平原"
 spartan_mission_04_rivals_task_6_DESC:0 "在菲利普成为希腊霸主的战役中，帖撒利被置于马其顿的控制之下。这个古老的地区从那时起就呼唤着从野蛮人的枷锁中解放出来，再次自由生活。"
 spartan_mission_04_rivals_task_6_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_04_rivals_task_6_current')|0]#!"
 spartan_mission_04_rivals_task_6_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_6_current')|0]#!"
 spartan_mission_04_rivals_task_6_effect_specific_tt:0 "释放#Y [THIS.GetProvince.GetName]#! 作为一个独立的国家。"
 spartan_mission_04_rivals_task_6_effect_thessaly_tt:0 "释放#Y $THESSALY_NAME$#! 作为一个独立的国家。"
 spartan_mission_04_rivals_task_6_trigger_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 控制#Y [macedon_scope.GetName]#! 在#Y $thessaly_area$#!省的每个领土。([SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_6_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_6_total')|0]#!)"
 spartan_mission_04_rivals_task_7:0 "卡德摩斯之子"
 spartan_mission_04_rivals_task_7_DESC:0 "忒拜曾经领导了瓦解伯罗奔尼撒联盟的联盟，并教会了腓力二世战争的艺术。在忒拜被摧毁和恢复后，它在地区政治中扮演了一个小角色，拿下它将是一个象征性的胜利，而不是其他什么。"
 spartan_mission_04_rivals_task_8:0 "恢复七门"
 spartan_mission_04_rivals_task_8_DESC:0 "在最终毁于亚历山大之手之前，忒拜是一个强大的城邦，处于玻奥提亚联盟的中心，控制着南部的阿提卡、西部的福基斯和北部的帖撒利之间的大部分地区政治。"
 spartan_mission_04_rivals_task_8_custom_loc_1:0 "#R [SCOPE.ScriptValue('spartan_mission_04_rivals_task_8_current')|0]#!"
 spartan_mission_04_rivals_task_8_custom_loc_2:0 "#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_8_current')|0]#!"
 spartan_mission_04_rivals_task_8_trigger_tt:0 "#Y [GetProvince('(int32)426').GetName]#!领土拥有至少#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_8_total')|0]#!座$fortress_building$。（[SCOPE.GetRootScope.GetCountry.Custom('spartan_mission_04_rivals_task_8_custom_loc')]/#Y [SCOPE.ScriptValue('spartan_mission_04_rivals_task_8_total')|0]#!）"
 spartan_mission_04_rivals_task_9:0 "讨好玻奥提亚的诸神"
 spartan_mission_04_rivals_task_9_DESC:0 "许多在玻奥提亚庆祝的神祇在我们自己的土地上并不常见，但我们却熟悉他们的名字。为了表示善意，我们将向该地区的圣殿和神庙提供捐款。"
 spartan_mission_04_rivals_task_final:0 "斯巴达的优越性"
 spartan_mission_04_rivals_task_final_DESC:0 "我们已经夺回了曾经属于我们的一切，并征服了每一个威胁我们家园的敌人。在我们身后有几场成功的战役，有一支经验丰富的军队随时听从我们的指挥，我们唯一的限制就是我们的野心有多大。"
 spartan_mission_08_peloponnesus_task_8_trigger_2_custom_loc_1:0 "#R [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_2_current')|0]#!"
 spartan_mission_08_peloponnesus_task_8_trigger_2_custom_loc_2:0 "#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_2_current')|0]#!"
 spartan_mission_08_peloponnesus_task_8_trigger_3_custom_loc_1:0 "#R [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_3_current')|0]#!"
 spartan_mission_08_peloponnesus_task_8_trigger_3_custom_loc_2:0 "#Y [SCOPE.ScriptValue('sparta_mission_02_peloponnesus_task_8_trigger_3_current')|0]#!"

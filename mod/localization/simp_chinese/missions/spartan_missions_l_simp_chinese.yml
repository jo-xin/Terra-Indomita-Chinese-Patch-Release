 spartan_mission_03_peloponnesian_league_task_11:0 "希腊的保护者"
 spartan_mission_03_peloponnesian_league_task_11_DESC:0 "自从菲利波斯和他的儿子崛起后，希腊一直在遥远的珀拉、叙利亚或埃及的马其顿军阀控制之下。他们呼唤着自由，呼唤着从这些外国僭主手中获得解放。"
 spartan_mission_03_peloponnesian_league_task_11_effect_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 获得#Y 马其顿#!、#Y 色雷斯#!、#Y 弗里吉亚#!、#Y 埃及#!、#Y 塞琉古帝国#!或其任何附属国在#Y $greece_region$#!地区拥有的所有领土的宣称。"
 spartan_mission_03_peloponnesian_league_task_12:0 "解放希腊"
 spartan_mission_03_peloponnesian_league_task_12_DESC:0 "希腊曾面临许多威胁，无论是来自波斯人、雅典人的野心，还是马其顿人的野蛮行为。我们最终将使希腊人彻底摆脱外国的威胁。"

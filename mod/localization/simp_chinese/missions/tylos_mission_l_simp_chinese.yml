l_simp_chinese:
 NICKNAME_THE_TYLIAN:0 "“堤洛斯人”"
 TILMUN_ADJECTIVE:0 "蒂尔蒙"
 TILMUN_NAME:0 "蒂尔蒙"
 aryan_arab_cotton_trade_relations_tylos:0 "辛多尼斯棉布贸易"
 declare_babylon_intent_realtion_tylos:0 "宣称恢复巴比伦的意图"
 desc_garden_of_tilmun_tylos_mod:0 "我们国家的核心，凌驾于所有其他城市，以“蒂尔蒙花园”之名享誉四方。"
 desc_gedrosian_city_port_mod:0 "这些省份被直接购买，旨在为我们东行商人提供安全的停靠港。"
 desc_gemstone_pearl_bank_mod:0 "我们首都的顶级宝石匠人在此省建造了一座采石场。"
 desc_gylus_tylos_city_mod:0 "不甘落后于姐妹城市革耳剌和堤洛斯，具卢斯已成为重要的区域贸易中心。"
 desc_master_of_erythraean_sea_mod:0 "无人能否认我们是厄律特莱海的真正霸主。"
 desc_tylos_develop_strait_mod:0 "我们在赫利乌港口的投资使其成为我们国家最重要的港口之一。"
 desc_tylos_makes_room_for_more:0 "每日造访我们港口的商人数量与日俱增，堤洛斯已为这些外邦人划定了一个专门区域作为居所。"
 desc_tylosian_cotton_wood:0 "我们在堤洛斯的港口储备了大量木材和布料，以便快速建造船只，惠及整个国家。"
 desc_tylosian_cotton_wood_port:0 "堤洛斯，我们国家的核心，拥有先进的港口区，使我们能高效快速地建造航海船只。"
 enquiry_into_plants:0 "植物探究"
 enquiry_into_plants_desc:0 "这部由哲学家特奥弗拉斯托斯撰写的论著，编录了多种植物标本。"
 erythraean_master_reward_tt:0 "#Y 我们将获得对以下省份的领土宣称：#!"
 exporting_babylonian_canes:0 "出口巴比伦手杖"
 flowers_of_enzak:0 "因扎克之花"
 form_tilmun:0 "组建蒂尔蒙"
 form_tilmun_desc:0 "通过控制周围的土地，我们重建了古老的蒂尔蒙，那个控制波斯湾贸易的强大贸易社会。"
 garden_of_tilmun_tylos_mod:0 "蒂尔蒙花园"
 gedrosian_city_port_mod:0 "革德罗西亚海岸定居点"
 gemstone_pearl_bank_mod:0 "宝石采石场"
 giant_shark_statue_treasure:0 "翻新阿瓦尔巨鲨雕像"
 giant_shark_statue_treasure_desc:0 "鲨神阿瓦尔眷顾我们的人民，其身影每日可见于环绕堤洛斯的水域。我们必须通过翻新位于首都中心的巨大神像来尊崇我们的神祇。"
 gylus_tylos_city_mod:0 "东阿拉伯航运"
 master_of_erythraean_sea_mod:0 "厄律特莱海霸主"
 me_tylos.10.a:0 "我们很幸运在堤洛斯拥有如此奢华的商品"
 me_tylos.10.desc:0 "在[ROOT.GetCountry.GetRuler.GetName]领导下的堤洛斯人民付出了巨大努力，[ROOT.GetCountry.GetCapital.GetName]已成为往来于我们市场与遥远#E 印度#!海岸的商人的常规停靠点，我们的社区代表在世界尽头的王国和遥远港口建立了贸易之家。\n\n因此，堤洛斯作为经济中心的地位极大提升，在贸易收入方面，我们已超越了我们地区的所有其他城市。"
 me_tylos.10.t:0 "美索不达米亚-印度贸易"
 me_tylos.10_tt:0 "$mission_completed_tooltip_1$“#Y 美索不达米亚-印度贸易#!”$mission_completed_tooltip_2$"
 me_tylos.11.a:0 "我们的影响力与日俱增，国库亦然……"
 me_tylos.11.desc:0 "与周边建立贸易联系有诸多好处，有些显而易见，有些则不然。当然，[ROOT.GetCountry.GetName]将赚取金钱，这是大多数人关注的重点，但也有政治原因使这值得追求。"
 me_tylos.11.t:0 "建立联系"
 me_tylos.11_tt:0 "$mission_completed_tooltip_1$“#Y 建立联系#!”$mission_completed_tooltip_2$"
 me_tylos.12.a:0 "是的，我们完全可以做出这些承诺"
 me_tylos.12.b:0 "我们目前无法负担此费用"
 me_tylos.12.desc:0 "我们改善[ROOT.GetCountry.GetCapital.GetName]附近进出口的努力不仅吸引了商人和贸易者的注意，还吸引了贤者。\n\n目前，著名哲学家#E 特奥弗拉斯托斯#!正在访问首都，据说这位睿智的学者若我们能承诺支付他未来几年的食宿费用，他不介意留在这里。"
 me_tylos.12.t:0 "辛多尼斯棉布的出口"
 me_tylos.12_tt:0 "$mission_completed_tooltip_1$“#Y 辛多尼斯棉布的出口#!”$mission_completed_tooltip_2$"
 me_tylos.13.a:0 "堤洛斯人民有许多值得感恩之事"
 me_tylos.13.desc:0 "多亏[ROOT.GetCountry.GetRuler.GetName]的国家级投资，我们在[ROOT.GetCountry.GetCapital.GetName]的纺织生产正经历快速增长。凡有余钱的都想购买堤洛斯丝绸，若买不起此类奢侈品，堤洛斯布料的袍子是次佳选择。\n\n虽然我们不指望好时光永远持续，但我们感激我们的棉田目前如此丰产。"
 me_tylos.13.t:0 "辛多尼斯棉布的生产"
 me_tylos.13_tt:0 "$mission_completed_tooltip_1$“#Y 辛多尼斯棉布的生产#!”$mission_completed_tooltip_2$"
 me_tylos.14.a:0 "我们欢迎任何人与我们共居"
 me_tylos.14.desc:0 "造访[ROOT.GetCountry.GetCapital.GetName]的访客无不为其国际化的氛围所折服。市场中充斥着各种外语，细心的旁听者在巷弄和大街中若仔细聆听，可能听到五六种语言的交谈片段。\n\n看来我们的灯塔如蜡烛吸引飞蛾般吸引这些陌生人——这对[ROOT.GetCountry.GetAdjective]税吏来说是件好事。"
 me_tylos.14.t:0 "辛多尼斯棉布文化"
 me_tylos.14_tt:0 "$mission_completed_tooltip_1$“#Y 辛多尼斯棉布的文化#!”$mission_completed_tooltip_2$"
 me_tylos.15.a:0 "一百金币微不足道……立即达成！"
 me_tylos.15.b:0 "我们感激这个价格，但目前无法采取行动"
 me_tylos.15.desc:0 "利用我们对#E 迦勒底神系#!的共同宗教信仰作为破冰之举，[ROOT.GetCountry.GetRuler.GetName]成功吸引了两座小岛——[GetProvince('(int32)963').GetName]和[GetProvince('(int32)965').GetName]——省长的注意，并表达了我们直接购买这些土地的兴趣。\n\n尽管此类请求通常遭到鄙视，我们两位领袖的友谊惠及了[ROOT.GetCountry.GetName]，我们现在有了一生难逢的交易可考虑；仅需一百金币，我们即可购买这两座岛屿，但必须立即同意。"
 me_tylos.15.t:0 "阿卡尔岛"
 me_tylos.15_tt:0 "$mission_completed_tooltip_1$“#Y 阿卡尔岛#!”$mission_completed_tooltip_2$"
 me_tylos.16.a:0 "一百二十五金币是我们能负担的"
 me_tylos.16.b:0 "我们不会支付任何费用——我们将以武力夺取#E 赫利乌港口#!！"
 me_tylos.16.desc:0 "现在我们已决定就[GetProvince('(int32)7210').GetName]省的地位进行谈判，一切进展很快。\n\n我们的使节返回[ROOT.GetCountry.GetCapital.GetName]，讲述了粗鲁主人的故事，但我们暂且忽略这些外交侮辱——我们被告知价格为一百二十五金币，且明确这是我们能期待的最优价格。"
 me_tylos.16.t:0 "霍尔木兹海峡"
 me_tylos.16_tt:0 "$mission_completed_tooltip_1$“#Y 霍尔木兹海峡#!”$mission_completed_tooltip_2$"
 me_tylos.17.a:0 "不久我们的军队将夺取大陆！"
 me_tylos.17.desc:0 "看来我们对#E 革耳剌#!的侮辱消息在[GetProvince('(int32)911').GetName]引起了哄笑，据说#E 塞琉古人#!互相传颂我们的嘲讽，为[ROOT.GetCountry.GetRuler.GetName]在冒犯时的胆识与巧妙而捧腹。\n\n除了传播欢乐，我们似乎赢得了宗主的认可——虽然他们不会加入我们，但已祝福我们攻击邻国，并急切等待我们的胜利报告。"
 me_tylos.17.t:0 "海湾战争"
 me_tylos.17_tt:0 "$mission_completed_tooltip_1$“#Y 海湾战争#!”$mission_completed_tooltip_2$"
 me_tylos.18.a:0 "终于，赫利乌港口拥抱了作为堤洛斯前哨的命运"
 me_tylos.18.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您会乐于听到[GetProvince('(int32)7210').GetName]附近的情况。\n\n将该省从前马坎主人的掌控中解放只是开始——看到该地区的真正潜力，我们的劳工在炽热的沙漠阳光下不懈工作，锤子和凿子的声音与头顶海鸥的叫声及海浪的轻拍相呼应。\n\n尽管所需工作量巨大，但一座新港口已建成，并有一座真正的城市支持之。"
 me_tylos.18.t:0 "开发海峡"
 me_tylos.18_tt:0 "$mission_completed_tooltip_1$“#Y 开发海峡#!”$mission_completed_tooltip_2$"
 me_tylos.19.a:0 "因扎克将因我们缅怀他而祝福我们……"
 me_tylos.19.desc:0 "尽管我们的人民早已遗忘对#E 因扎克#!——古老#E 蒂尔蒙#!王国主神——的崇拜，[ROOT.GetCountry.GetRuler.GetName]已下令将[GetProvince('(int32)963').GetName]岛恢复为此至高神祇的圣地。\n\n尽管新建圣殿的砂浆尚未完全干透，阿哈岛已蓬勃发展，许多热切的定居者抵达附近的[GetProvince('(int32)965').GetName]港口，希望在这座小岛上安家。"
 me_tylos.19.t:0 "因扎克之花"
 me_tylos.19_tt:0 "$mission_completed_tooltip_1$“#Y 因扎克之花#!”$mission_completed_tooltip_2$"
 me_tylos.20.a:0 "没有我们勤劳的工人，我们一无所有。他们才应得荣誉，而非我"
 me_tylos.20.desc:0 "由于我们在[GetProvince('(int32)7202').GetName]储备了大量资源，我们的木材、雪松和布料足以支撑多年，首都的造船匠趁机利用这一有利形势，实验船只设计并不足为奇。\n\n多亏他们的努力，我们能建造工艺精湛的海军船只，速度之快令人难以置信。人人都称[ROOT.GetCountry.GetRuler.GetName]应对此负责，然而这位宽厚的[ROOT.GetCountry.GetRulerTitle]表示我们的工程师才是唯一值得赞扬的人。"
 me_tylos.20.t:0 "棉木"
 me_tylos.20_tt:0 "$mission_completed_tooltip_1$“#Y 棉木#!”$mission_completed_tooltip_2$"
 me_tylos.21.a:0 "终于，我可以开始像人一样生活"
 me_tylos.21.desc:0 "令人好奇的是，许多人忘了[ROOT.GetCountry.GetCapital.GetName]的真实名称，简单地称我们骄傲的[ROOT.GetCountry.GetAdjective]首都为‘花园’，或更正式地‘蒂尔蒙花园’。\n\n造访我们大都会的访客常被所见景致迷住，眩目的建筑和广阔的花园常令他们屏息。人们普遍认为，一生中仅造访[ROOT.GetCountry.GetCapital.GetName]一次是不够的——这个地方令人不得不再次返回，因为世上无处与之媲美。"
 me_tylos.21.t:0 "蒂尔蒙花园"
 me_tylos.21_tt:0 "$mission_completed_tooltip_1$“#Y 蒂尔蒙花园#!”$mission_completed_tooltip_2$"
 me_tylos.22.a:0 "我希望如此……"
 me_tylos.22.desc:0 "尽管[GetProvince('(int32)7203').GetName]不久前还只是一片沙漠荒地，[ROOT.GetCountry.GetRuler.GetName]的命令已将其转变为如今的模样——一座繁华的城市，拥有相当的航运贸易。\n\n[GetProvince('(int32)7203').GetName]的航运巨头是[ROOT.GetCountry.GetName]最富有的公民之一，以控制东阿拉伯贸易路线而闻名。"
 me_tylos.22.t:0 "东阿拉伯航运"
 me_tylos.22_tt:0 "$mission_completed_tooltip_1$“#Y 东阿拉伯航运#!”$mission_completed_tooltip_2$"
 me_tylos.23.a:0 "阿基亚斯和他的海军是首选且唯一的选择。"
 me_tylos.23.b:0 "让我们邀请学者安德罗斯忒涅斯。"
 me_tylos.23.c:0 "著名作者尼阿尔科斯？他是我的选择。"
 me_tylos.23.desc:0 "由于[ROOT.GetCountry.GetCapital.GetName]正以一座对各种文化和信条人民友好的城市而闻名，尤其是对#E 马其顿人#!友好，我们见到大批来自西方的定居者涌入，其中包括一些声称拥有显赫姓名，并希望来到[ROOT.GetCountry.GetRuler.GetName]宫廷效力的人。\n\n每个人都有自己能带来的东西。有#E 佩拉的阿耳喀阿斯#!，这位受人尊敬的航海家指挥着强大海军；也有#E 塔索斯的安德罗斯忒涅斯#!，他以学术著作远近闻名。然而我们也不能忽视#E 涅阿耳科斯#!，此人曾陪伴亚历山大远征至世界尽头，并活下来讲述自己的故事。\n\n这三个人的自负确保他们无法共处……我们必须选择一人，而且只能选择一人。"
 me_tylos.23.t:0 "亚历山大的堤洛斯殖民地"
 me_tylos.23_tt:0 "$mission_completed_tooltip_1$“#Y 亚历山大的堤洛斯殖民地#!”$mission_completed_tooltip_2$"
 me_tylos.24.a:0 "我们将摧毁任何反对我们之人！万 hail [ROOT.GetCountry.GetName]！"
 me_tylos.24.desc:0 "在我们之前的许多帝国和王国曾派遣舰队巡航#E 厄律特莱海#!，然而他们的船只已化为漂木，永远消逝。我们谨记万物皆逝，终有一日我们可能不再屹立于权力的巅峰——毕竟，在这残酷的世界中，一切皆有可能。\n\n但那一刻尚远，今日我们无人能敌——我们宣称自己为#E 厄律特莱海霸主#!，无人能与吾等抗衡。"
 me_tylos.24.t:0 "厄律特莱海霸主"
 me_tylos.24_tt:0 "$mission_completed_tooltip_1$“#Y 厄律特莱海霸主#!”$mission_completed_tooltip_2$"
 me_tylos.25.a:0 "印度的商品无价——同意此金额"
 me_tylos.25.b:0 "不，我们不会支付任何费用……我们将直接夺取"
 me_tylos.25.desc:0 "现在我们已提升了[GetProvince('(int32)6517').GetName]居民的好感，我们有胆量请求他们出售其优良港口。\n\n我们的贸易船常冒险前往印度，若有一个堤洛斯港口让我们的水手感到安全，将大有裨益，卡纳西达无疑是理想选择。位于我们伟大城市与#E 印度#!丰富商品的正中途，它是贸易港口的绝佳位置。\n\n幸运的是，一份报价已准备好……虽然昂贵，但如今一切都需要大量金钱。"
 me_tylos.25.t:0 "印度市场"
 me_tylos.25_tt:0 "$mission_completed_tooltip_1$“#Y 印度市场#!”$mission_completed_tooltip_2$"
 me_tylos.26.a:0 "[GetProvince('(int32)7206').GetName]是我选择的地方"
 me_tylos.26.b:0 "[GetProvince('(int32)7205').GetName]如何？"
 me_tylos.26.c:0 "[GetProvince('(int32)7200').GetName]是个值得候选"
 me_tylos.26.d:0 "预兆显示必须是[GetProvince('(int32)7197').GetName]"
 me_tylos.26.desc:0 "众所周知，在[ROOT.GetCountry.GetCapital.GetName]工作的宝石匠人是世界上最好的，无可争议的工艺大师，当他们说附近有值得探索的采石场时，[ROOT.GetCountry.GetRuler.GetName]有兴趣倾听他们的意见。\n\n我们的宝石，尤其是[ROOT.GetCountry.GetAdjective]钻石，各地需求旺盛，附近有四个地点据信含有大量珍贵宝石矿藏，但我们只有资源开发一处——应选哪里？"
 me_tylos.26.t:0 "珍珠海岸"
 me_tylos.26_tt:0 "$mission_completed_tooltip_1$“#Y 珍珠海岸#!”$mission_completed_tooltip_2$"
 me_tylos.27.a:0 "我从未猜到您将要告诉我这些"
 me_tylos.27.desc:0 "[SCOPE.sCharacter('priest').GetName]向[ROOT.GetCountry.GetRuler.GetName]报告了一个惊人发现；在修复[ROOT.GetCountry.GetCapital.GetName]一座圣殿时，一些工人跌入地面裂缝，发现了一个隐藏的密室，里面满是楔形文字石板！\n\n解读这些奇特文字需时，我们急切等待揭晓发现了什么。"
 me_tylos.27.t:0 "腓尼基故土：启示"
 me_tylos.27_tt:0 "$mission_completed_tooltip_1$“#Y 腓尼基故土#!”$mission_completed_tooltip_2$"
 me_tylos.28.a:0 "我们将欢迎难民到[ROOT.GetCountry.GetCapital.GetName]"
 me_tylos.28.b:0 "实际上，我们将直接吞并该城！"
 me_tylos.28.c:0 "让我们互相交换商品和服务"
 me_tylos.28.d:0 "嗯，这是个坏主意……算了"
 me_tylos.28.desc:0 "[SCOPE.sCharacter('priest').GetName]完成了对在[ROOT.GetCountry.GetCapital.GetName]发现的石板翻译。\n\n根据这些文件，我们的[ROOT.GetCountry.GetAdjective]祖先实际上来自[GetProvince('(int32)743').GetName]的定居者——这一事实得到我们方言及宗教、文化实践相似性的证实。\n\n[SCOPE.sCharacter('priest').GetFirstName]自作主张，秘密派遣了一支外交团队前往[GetProvince('(int32)743').GetName]分享我们的发现，发现#E 泰尔人#!有兴趣与我们联合。\n\n我们需做出选择，仔细聆听，[ROOT.GetCountry.GetRuler.GetName]。泰尔的一些公民希望离开他们的城市，在[ROOT.GetCountry.GetCapital.GetName]重新开始生活，而城市代表希望我们完全吞并他们。我们也可以送他们一笔赠款，换取他们的部分技术……或者我们可以忘掉这一切。"
 me_tylos.28.t:0 "腓尼基故土：结论"
 me_tylos.28_tt:0 "$mission_completed_tooltip_1$“#Y 腓尼基故土#!”$mission_completed_tooltip_2$"
 me_tylos.29.a:0 "若我想看到那一天，我还有许多事要做……"
 me_tylos.29.desc:0 "[ROOT.GetCountry.GetCapital.GetName]。我们的家园数百年来一直是重要的贸易中心，尽管我们曾是多个强权的臣属，从#E 阿契美尼德#!到#E 塞琉古#!，我们对独立的渴望并未被统治我们的僭主重手扼杀——事实上，我们的荣耀梦想反而愈发闪耀。\n\n[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]心中怀有一个秘密——#E 巴比伦的复兴#!本身……"
 me_tylos.29.t:0 "巴比伦的复兴"
 me_tylos.29_tt:0 "是时候创造历史了……"
 me_tylos.4.a:0 "这真是好消息！我们有幸发现如此宝藏"
 me_tylos.4.desc:0 "何其幸运的发现！在我们于[GetProvince('(int32)7202').GetName]建造大剧院时，挖掘者发现了一段看似古老废弃圣殿的部分。由此深受鼓舞，挖掘工作继续进行，最终在城市中心发掘出三座小型建筑。\n\n尽管堤洛斯中心一直被视为我们国家最珍贵的地产，贵族和富裕的[ROOT.GetCountry.GetAdjective]公民竞相购买挖掘点附近的物业。终有一日，我们将恢复三座圣殿的真正辉煌——这是神祇的恩赐！\n\n整个经历的愉快结果之一是，[ROOT.GetCountry.GetRuler.GetFirstName]与我们的[GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)]成为了密友，这得益于两人共同观察挖掘的许多时光。"
 me_tylos.4.t:0 "三座圣殿"
 me_tylos.5.a:0 "我们已完全准备好应对任何可能发生之事"
 me_tylos.5.desc:0 "凭借外交天才的惊人壮举，[ROOT.GetCountry.GetRuler.GetName]成功实现了[ROOT.GetCountry.GetAdjective]人民的目标，而无需将我们的军队派往陌生领土。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]说服了一位新结交的朋友背弃誓言，加入我们的事业，为我们带来了新领土——以及新敌人——需要应对。"
 me_tylos.5.t:0 "美索不达米亚生命线"
 me_tylos.5_tt:0 "$mission_completed_tooltip_1$“#Y 美索不达米亚生命线#!”$mission_completed_tooltip_2$"
 me_tylos.6.a:0 "我们将支付所要求的费用"
 me_tylos.6.b:0 "[ROOT.GetCountry.GetName]目前无法负担此费用"
 me_tylos.6.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，现在我们为#E 阿瓦尔#!建造了圣地，并以鲨神的巨大雕像美化之，据说我们的城市正在发生奇妙而无法解释的事情。看来阿瓦尔看到了我们的努力，并对此感到满意。\n\n最近，一位自称‘#E 鲨鱼#!’的怪异祭司出现在[ROOT.GetCountry.GetCapital.GetName]的街头，在街巷中布道和预言，宣称我们的子民将迎来黄金时代。\n\n此人，有些人认为他疯了，但也有人说他受阿瓦尔祝福，他大胆地提出为国家效力，若我们愿意向阿瓦尔慷慨献祭。"
 me_tylos.6.t:0 "海洋之民"
 me_tylos.6_tt:0 "$mission_completed_tooltip_1$“#Y 海洋之民#!”$mission_completed_tooltip_2$"
 me_tylos.7.a:0 "我热切期待学者们发现的结果"
 me_tylos.7.desc:0 "现在[ROOT.GetCountry.GetCapital.GetName]拥有了合适的图书馆和学院，我们可以认真研究[ROOT.GetCountry.GetAdjective]人民感兴趣的事物——这一切皆归功于[ROOT.GetCountry.GetRuler.GetName]的努力。\n\n尽管古老#E 蒂尔蒙#!的强盛早已从地球上消逝，其荣耀的记忆仍存于我们同胞心中，他们相信我们的故事与之相连。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]要求我们的学者研究我们所能接触的一切，希望找到这个古老王国的证据。"
 me_tylos.7.t:0 "蒂尔蒙的记忆：探究"
 me_tylos.8.a:0 "这至少是个有趣的发展……"
 me_tylos.8.desc:0 "一年后的今天，据报道我们的学者完成了对#E 蒂尔蒙#!历史的探究，那个数千年前控制这片区域的古老贸易强国。\n\n我们的贵族阶层在调查中一丝不苟，为我们的图书馆购置了古老的卷轴，并多次派遣探险队前往各地区，希望发现更多关于蒂尔蒙的线索。\n\n想象[ROOT.GetCountry.GetRuler.GetName]的惊讶，当我们的研究者告知[ROOT.GetCountry.GetRuler.GetHerHim]，他们发现了我们国家与其之间的直接联系，凭借征服的权利，我们可以夺回这些被遗忘的故土。"
 me_tylos.8.t:0 "蒂尔蒙的记忆：结论"
 me_tylos.8_tt:0 "$mission_completed_tooltip_1$“#Y 蒂尔蒙的记忆#!”$mission_completed_tooltip_2$"
 me_tylos.9.a:0 "我们必须拥有伊亚-纳西尔及其专长！"
 me_tylos.9.b:0 "我对此感觉不好……"
 me_tylos.9.desc:0 "多亏[ROOT.GetCountry.GetCapital.GetName]的铸造厂和市场，我们以惊人的速度制造奢侈品，并以令人震惊的价格售出全部库存——我们真正看到了之前难以想象的利润。\n\n[ROOT.GetCountry.GetRuler.GetName]并非唯一认识到激动人心的商业气候的人；一位名为#E 伊亚-纳西尔#!的堤洛斯贵族也在贸易中极为活跃，他工坊生产的#E 巴比伦手杖#!深受世界各地上层阶级的追捧。\n\n或许我们可以雇佣这位贵族的服务？这将花费一大笔钱，但这样的价值能用金钱衡量吗？"
 me_tylos.9.t:0 "出口巴比伦手杖"
 me_tylos.9_tt:0 "$mission_completed_tooltip_1$“#Y 出口巴比伦手杖#!”$mission_completed_tooltip_2$"
 me_tylos_1.a:0 "巴比伦再度崛起！"
 me_tylos_1.b:0 "若无堤洛斯，这一切绝不会发生！"
 me_tylos_1_desc:0 "数百年前，[GetProvince('(int32)918').GetName]的贤者和先知必定通过星辰之幕窥视未来，深知他们将在#E 居鲁士#!手中毁灭的预言时刻——那是其悠久历史的低谷。\n\n然而，他们定也感到慰藉，因为他们知道一切并未永远失落，[ROOT.GetCountry.GetRuler.GetName]将重铸那久已破碎的辉煌。看到[ROOT.GetCountry.GetRulerTitle]登上巴比伦的合法王座，[ROOT.GetCountry.GetAdjective]人民欣喜万分。"
 me_tylos_1_title:0 "巴比伦王座"
 me_tylos_2.a:0 "我们相信[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]！"
 me_tylos_2.b:0 "现行体系一直行之有效……"
 me_tylos_25_claims_tt:0 "#Y 我们将获得对#!#T 革德罗西亚#!地区的领土宣称。"
 me_tylos_2_desc:0 "古时候，据说巴比伦人在一个强大的官僚体系指导下处理事务，该体系能在维持神祇祝福的同时有效管理政府。其核心人物称为#E 卢伽尔#!，如同国王般统治，将重要任务分配给副手和顾问。\n\n如今我们已重建古老的#E 蒂尔蒙#!，依法继承了那逝去国度的权威与威严，有人提议我们更进一步，采用#E 巴比伦官僚体系#!作为我们的治理方式。\n\n[ROOT.GetCountry.GetRuler.GetName]认为这将为[ROOT.GetCountry.GetName]带来合法性，大幅提升我们的国际声望，但也有人称这不过是换了名字的君主制。"
 me_tylos_2_title:0 "富饶的记忆"
 me_tylos_3.a:0 "我们将夺取一切所能！"
 me_tylos_3.b:0 "目前仅限巴比伦……"
 me_tylos_3_a_tt:0 "我们将获得对[GetProvince('(int32)933').GetState.GetName]、[GetProvince('(int32)911').GetState.GetName]和[GetProvince('(int32)883').GetState.GetName]的宣称"
 me_tylos_3_desc:0 "多年来，[ROOT.GetCountry.GetRuler.GetName]一直被一个单一愿景指引——为[ROOT.GetCountry.GetAdjective]人民重夺#E 巴比伦#!的荣耀，这包括将侵略者驱逐出城市并通过一系列仪式净化之。\n\n现在我们有能力付诸行动，唯一待定的问题是我们的军队需走多远。"
 me_tylos_3_i_tt:0 "我们获得了对[GetProvince('(int32)918').GetState.GetName]的宣称"
 me_tylos_3_title:0 "巴比伦的记忆"
 memory_of_babylon:0 "巴比伦的记忆"
 memory_of_tilmun:0 "蒂尔蒙的记忆"
 people_of_the_sea:0 "海洋之民"
 renovated_the_three_ancient_temples_tylos_mod:0 "三座古老圣殿"
 restored_babylon:0 "巴比伦复原"
 rich_memory:0 "富饶的记忆"
 treasure_androsthenes_tylos:0 "印度洋航海"
 treasure_androsthenes_tylos_desc:0 "这部由著名航海家安德罗斯特尼斯撰写的文本，详述了他对遥远土地的探险。"
 treasure_giant_shark_statue:0 "阿瓦尔巨鲨雕像"
 treasure_giant_shark_statue_desc:0 "阿瓦尔——保护并捕食堤洛斯人民的鲨神——的巨大雕像是我们最神圣的宗教宝藏之一。"
 treasure_nearchos_tylos:0 "印度记"
 treasure_nearchos_tylos_desc:0 "这卷简朴的卷轴是尼阿科斯的手写记录，详述了他在印度的探险经历。"
 tylos_cotton_fields:0 "棉田"
 tylos_cotton_trade:0 "棉布贸易"
 tylos_develop_strait_mod:0 "赫利乌港口海峡"
 tylos_insult_gerrha_tt:0 "我们需向#Y 革耳剌#!发送侮辱。"
 tylos_makes_room_for_more:0 "商人区"
 tylos_mesopotamian_bay_mod:0 "美索不达米亚生命线"
 tylos_mission_task_18_tech_tt:0 "需拥有#T 波斯军事传统#!中的#Y 海军改革#!。"
 tylos_missions:0 "巴比伦的复兴"
 tylos_missions_BUTTON_TOOLTIP:0 "正如古巴比伦尼亚曾统治目之所及的广袤土地，我们亦将继承其遗弃的荣光……"
 tylos_missions_CRITERIA_DESCRIPTION:0 "当#E 堤洛斯#!将自身建设为一个强大的国家，足以继承古老#E 巴比伦#!的权威时，此使命将视为完成。"
 tylos_missions_DESCRIPTION:0 "在我们所在的#E 堤洛斯#!岛上，我们正行走在刀锋之上；受到#E 塞琉古帝国#!的“保护”，他们对我们富饶的港口和宝石虎视眈眈，我们周围环伺着渴望吞并我们领土的侵略性共和国。毋庸置疑，无论是友是敌，皆与我们为敌，唯有时间能揭示我们是否能实现那被遗忘已久的梦想——#E 巴比伦的复兴#!。"
 tylos_missions_task_1:0 "海洋之民"
 tylos_missions_task_10:0 "蒂尔蒙花园"
 tylos_missions_task_10_DESC:0 "让我们尽力美化#E 堤洛斯#!的大都会，使其成为全世界最优雅、文明的地方。\n\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 tylos_missions_task_11:0 "美索不达米亚-印度贸易"
 tylos_missions_task_11_DESC:0 "建立美索不达米亚与印度之间的贸易路线需要大量工作，但我们坚信这是可行的。\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 tylos_missions_task_12:0 "阿卡尔岛"
 tylos_missions_task_12_DESC:0 "或许我们可以从#E 塞琉古帝国#!购买一些土地？他们的领地如此辽阔，或许愿意以合适的价格出售两座小岛。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 tylos_missions_task_12_a_tt:0 "我们的统治者[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与伊卡罗斯岛的省长（[GetProvince('(int32)963').GetState.GetGovernorOrRuler.GetName]）是朋友。"
 tylos_missions_task_12_a_tt2:0 "神殿中至少有2位[GetReligion('mesopotamian_religion').GetName]神祇。"
 tylos_missions_task_12_c_tt:0 "我们将获得该地区的领土主张。"
 tylos_missions_task_12_s_tt:0 "我们或许能以低价购买这两座岛屿。"
 tylos_missions_task_13:0 "霍尔木兹海峡"
 tylos_missions_task_13_DESC:0 "时机已到，我们需以任何可能的方式夺取#E 霍尔木兹海峡#!。尽管我们倾向于外交解决方案，但开战亦非不可考虑。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 tylos_missions_task_13_c_tt:0 "我们或许能购买海峡的阿拉伯部分，若被拒绝则可为之宣战。"
 tylos_missions_task_14:0 "因扎克之花"
 tylos_missions_task_14_DESC:0 "很久以前，神祇#T 因扎克#!（在某些方言中称为恩扎克）曾保护并祝福蒂尔蒙文明——我们能否也寻求他的青睐？\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 tylos_missions_task_14_a_tt:0 "神殿中所有#Y 4#!位神祇均为[GetReligion('mesopotamian_religion').GetName]（[SCOPE.Custom('tylos_missions_task_14_a_tt_custom_loc')]/#Y [SCOPE.ScriptValue('tylos_missions_task_14_tylos_chaldean_pantheon_gods_total')|0]#!）。"
 tylos_missions_task_14_a_tt_custom_loc_allow_vs_ongoing:0 "#R [SCOPE.ScriptValue('tylos_missions_task_14_tylos_chaldean_pantheon_gods_current')|0]#!"
 tylos_missions_task_14_a_tt_custom_loc_complete:0 "#Y [SCOPE.ScriptValue('tylos_missions_task_14_tylos_chaldean_pantheon_gods_current')|0]#!"
 tylos_missions_task_14_c_tt:0 "神祇#T [GetDeityDefinition('omen_inzak').GetName]#!将被解锁。"
 tylos_missions_task_15:0 "腓尼基故土"
 tylos_missions_task_15_DESC:0 "我们必须查阅记录，彻底确定我们祖先的起源。\n\n#Y 这将开启一系列事件#!。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 tylos_missions_task_15_office_marshal_tt:0 "我们的#T 拉夫·卡纳亚#!官员需拥有至少#Y 65#!的#Y 忠诚度#!，#Y 腐败度#!低于#Y 10#!，且必须是统治者的#Y 朋友#!。"
 tylos_missions_task_16:0 "出口巴比伦手杖"
 tylos_missions_task_16_DESC:0 "#E 铸造厂#!是一项令人印象深刻的成就，一旦我们掌握了建造方法，就应立即在我们的首都建造一座——我们的出口，尤其是手杖，将在建成后迅速扩展。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 tylos_missions_task_16_a_tt:0 "拥有至少#Y [SCOPE.ScriptValue('tylos_missions_task_16_tylos_commerce_income_target')|0]#!的商业收入（[SCOPE.Custom('tylos_missions_task_16_a_tt_custom_loc')]/#Y [SCOPE.ScriptValue('tylos_missions_task_16_tylos_commerce_income_target')|0]#!）"
 tylos_missions_task_16_a_tt_custom_loc_allow_vs_ongoing:0 "#R [SCOPE.ScriptValue('tylos_missions_task_16_tylos_commerce_income_current')|0]#!"
 tylos_missions_task_16_a_tt_custom_loc_complete:0 "#Y [SCOPE.ScriptValue('tylos_missions_task_16_tylos_commerce_income_current')|0]#!。"
 tylos_missions_task_17:0 "亚历山大的堤洛斯殖民地"
 tylos_missions_task_17_DESC:0 "尽管他们是外邦人，但无人能否认#E 马其顿人#!在我们社会中的存在正逐渐增加。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 tylos_missions_task_17_four_religious_investments_tt:0 "我们的首都需进行#T 宗教捐赠#!省级投资。"
 tylos_missions_task_17_macedon_tt:0 "需赋予#Y 马其顿文化#!#T 公民#!或#T 贵族#!公民权利。"
 tylos_missions_task_18:0 "棉木"
 tylos_missions_task_18_DESC:0 "若我们改革海军并备齐物资以妥善装备舰队，投入的时间和资源将物超所值。\n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 tylos_missions_task_18_cotton_wood_tt:0 "需向我们的首都进口#T 木材#!、#T 布料#!和#T 雪松#!。"
 tylos_missions_task_19:0 "印度市场"
 tylos_missions_task_19_DESC:0 "我们的堤洛斯商人穿越险恶的海洋，前往东方的富饶市场。若他们能在革德罗西亚的[GetProvince('(int32)6517').GetName]——通往印度的完美中途点——停留休息，将大有裨益。为方便商人贸易，或许我们可以看看该港口是否出售？\n\n\n\n\n\n\n\n\n\n\n@india_por2!"
 tylos_missions_task_1_DESC:0 "若无#E 阿瓦尔#!——环绕#E 堤洛斯#!、守护我们子民的鲨神——的祝福，我们如何能扩展到周围的海洋？\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 tylos_missions_task_1_a_tt:0 "已完成翻新阿瓦尔巨鲨雕像的决定。"
 tylos_missions_task_1_a_tt2:0 "[GetDeityDefinition('omen_awal').GetName|Y]在#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!拥有圣祠。"
 tylos_missions_task_1_c_tt:0 "#Y 2#!名#E [GetReligion('mesopotamian_religion').GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!#Y #E 贵族#!#!@nobles!出现在#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!。"
 tylos_missions_task_1_tooltip:0 "宗教统一度需高于#Y 50%#!。"
 tylos_missions_task_2:0 "辛多尼斯棉布的出口"
 tylos_missions_task_20:0 "厄律特莱海霸主"
 tylos_missions_task_20_DESC:0 "这一天已到来，我们可以毫无虚饰地宣称自己是厄律特莱海的真正霸主——这绝非易事，值得举国欢庆。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 tylos_missions_task_21:0 "东阿拉伯航运"
 tylos_missions_task_21_DESC:0 "尽管我们在[GetProvince('(int32)7202').GetName]仍有许多发展空间，但我们处理的贸易量促使我们开发附近的[GetProvince('(int32)7203').GetName]省，以进一步提升我们的航运潜力。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 tylos_missions_task_22:0 "珍珠海岸"
 tylos_missions_task_22_DESC:0 "我们从各省开采的宝石数量让我们相信，可能还有其他地方蕴藏类似的自然财富——我们应探索是否有新的矿点。\n\n#Y 我们可以选择一个新地点生产宝石@gems!#!。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 tylos_missions_task_23:0 "巴比伦重生"
 tylos_missions_task_23_DESC:0 "终于，我们站在成就的巅峰——#E 巴比伦#!作为令人畏惧的力量真正重生！\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 tylos_missions_task_23_a_tt:0 "已决定组建#Y 巴比伦#!"
 tylos_missions_task_24:0 "开发海峡"
 tylos_missions_task_24_DESC:0 "[GetProvince('(int32)7210').GetName]的优越位置亟需基础设施改善，原因显而易见；该省控制着通往波斯湾的海峡，重要性不言而喻。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 tylos_missions_task_25:0 "辛多尼斯棉布的生产"
 tylos_missions_task_25_DESC:0 "国内外对棉纺织品的需求始终旺盛。我们必须尽一切努力增加产量！\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 tylos_missions_task_26:0 "辛多尼斯棉布的文化"
 tylos_missions_task_26_DESC:0 "我们繁荣的贸易路线使#E 堤洛斯#!成为一座国际化都市，你永远不知会在其宽阔的街道上遇到何人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 tylos_missions_task_27:0 "建立联系"
 tylos_missions_task_27_DESC:0 "与周边建立良好的商业关系反映了我们敏锐的经济头脑——人人都爱赚钱。让我们寻找志同道合的伙伴。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil15!"
 tylos_missions_task_2_DESC:0 "为确保我们的出口货物抵达目标市场，我们必须拥有适当的舰队和巡航水域的技术知识——还有许多工作亟待完成。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 tylos_missions_task_2_a_tt:0 "巴比伦已颁布#T 保护土地权利#!文化决定。"
 tylos_missions_task_2_c_tt:0 "阿拉伯和雅利安文化组的所有国家对[SCOPE.GetRootScope.GetCountry.GetName]的好感度提升#G 15#!点。"
 tylos_missions_task_2_c_tt2:0 "以下人口将出现在#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!：\n\t#Y 2#!名#E [GetReligion('mesopotamian_religion').GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!自由民@freemen!\n\t#Y 2#!名#E [GetReligion('zoroaster').GetName] [GetCulture('pasargadi').GetName]#!自由民@freemen!\n\t#Y 1#!名#E [GetReligion('hindu').GetName] [GetCulture('sindhi').GetName]#!自由民@freemen!"
 tylos_missions_task_3:0 "三座圣殿"
 tylos_missions_task_3_DESC:0 "在#E 堤洛斯#!最古老的区域之一，当地人视为圣地的地方，有人提议我们建造一座大剧院。让我们着手这项任务，同时留意工地周围土地的古老历史。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 tylos_missions_task_4:0 "乌尔的伟大金字塔"
 tylos_missions_task_4_DESC:0 "待完成"
 tylos_missions_task_4_s_tt:0 "我们将尝试从他们手中偷取乌尔的伟大金字塔。"
 tylos_missions_task_5:0 "美索不达米亚生命线"
 tylos_missions_task_5_DESC:0 "在适当的情况下，我们或许能通过外交手段实现我们的外交政策目标，而无需真正发动战争……\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 tylos_missions_task_5_a_tt:0 "在高亮的#Y 波斯湾#!海域拥有至少#Y 35#!艘船的单一海军部队。"
 tylos_missions_task_6:0 "巴比伦的记忆"
 tylos_missions_task_6_DESC:0 "许多人宣称继承了早已逝去的时代的权威，却未付出应有的努力，而无人能对我们作出同样的指责。时机将至，我们将为自身夺取#E 巴比伦#!的荣光。\n\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 tylos_missions_task_6_a_tt:0 "拥有至少#Y [SCOPE.ScriptValue('tylos_missions_task_6_tylos_temple_theatre_target')|0]#!座[GetBuilding('temple_building').GetName]#E 圣殿#!或[GetBuilding('theathre_building').GetName]#E 剧院#!（[SCOPE.Custom('tylos_missions_task_6_a_tt_custom_loc')]/#Y [SCOPE.ScriptValue('tylos_missions_task_6_tylos_temple_theatre_target')|0]#!）"
 tylos_missions_task_6_a_tt_custom_loc_allow_vs_ongoing:0 "#R [SCOPE.ScriptValue('tylos_missions_task_6_tylos_temple_theatre_current')|0]#!"
 tylos_missions_task_6_a_tt_custom_loc_complete:0 "#Y [SCOPE.ScriptValue('tylos_missions_task_6_tylos_temple_theatre_current')|0]#!"
 tylos_missions_task_6_c_tt:0 "我们将能宣布意图夺取并恢复巴比伦城的正当秩序，作为其真正继承者。"
 tylos_missions_task_7:0 "蒂尔蒙的记忆"
 tylos_missions_task_7_DESC:0 "在我们的世界一隅，人们仍传颂‘蒂尔蒙’，一个曾通过控制贸易路线主宰这片土地的海军强国——我们正走在这条道路上。\n\n#Y 这将开启一系列事件#!。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 tylos_missions_task_7_a_tt:0 "已为马坎文化采取‘创建荣誉卫队’和‘赞助’文化决定。"
 tylos_missions_task_8:0 "海湾战争"
 tylos_missions_task_8_DESC:0 "在我们的宗主#E 塞琉古帝国#!的祝福下，我们可以发动区域冲突，试图夺取邻近共和国的领地。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 tylos_missions_task_9:0 "富饶的记忆"
 tylos_missions_task_9_DESC:0 "古时候，据说巴比伦人使用一种特殊的官僚体系管理他们的土地，尽管那是很久以前的事，[ROOT.GetCountry.GetRuler.GetName]仍记得采用类似治理方式的好处，并希望将其应用于[ROOT.GetCountry.GetName]。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 tylos_missions_task_9_a_tt:0 "[GetCulture('babylonian').GetName]是#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!的主导文化。"
 tylos_missions_task_9_a_tt2:0 "已决定组建#Y 蒂尔蒙#!。"
 tylos_missions_task_9_c_tt:0 "我们将获得对[GetProvince('(int32)7205').GetState.GetName]和[GetProvince('(int32)7212').GetState.GetName]的领土主张。"
 tylos_omen_power_task_3_mod:0 "翻新圣殿"
 tylosian_cotton_wood:0 "堤洛斯棉木"
 tylosian_cotton_wood_port:0 "堤洛斯港"

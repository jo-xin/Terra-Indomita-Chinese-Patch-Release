 me_gordyene_1.a:0 "我们将夺回我们的山脉！"
 me_gordyene_10.a:0 "建筑师应留在他们的工坊。"
 me_gordyene_10.b:0 "训练建筑师学习战争技艺。"
 me_gordyene_10.c:0 "建筑师建设更好的城市！"
 me_gordyene_10_desc:0 "卡杜乔伊的工匠与建筑师向来以其技艺与创造力闻名。考虑到上底格里斯人民面临的诸多挑战，是时候考虑如何最好地引导并利用这些人为我们的城市与军队谋利。"
 me_gordyene_10_title:0 "建筑大师焦点"
 me_gordyene_10_tooltip:0 "任务‘#Y $01_gordyene_task_9$#!’现已#G完成#!"
 me_gordyene_11.a:0 "这些城市将繁荣！"
 me_gordyene_11_desc:0 "萨塔尔卡与萨雷萨的城市终于达到了与其位置和潜力相称的经济与交通水平。"
 me_gordyene_11_title:0 "萨塔尔卡与萨雷萨"
 me_gordyene_11_tooltip:0 "任务‘#Y $01_gordyene_task_10$#!’现已#G完成#!"
 me_gordyene_12.a:0 "让贸易流动。"
 me_gordyene_12_desc:0 "戈尔迪尼掌控一些最伟大的贸易站，皮纳卡的堡垒守护着底格里斯沿岸最有价值的渡口之一。亚历山大本人在征服波斯时曾使用此地。"
 me_gordyene_12_title:0 "底格里斯渡口"
 me_gordyene_12_tooltip:0 "任务‘#Y $01_gordyene_task_21$#!’现已#G完成#!"
 me_gordyene_13.a:0 "让羊群自由漫步。"
 me_gordyene_13_desc:0 "有了更广阔的牧场、更大的流动自由与劳动力，卡尔杜的牧羊人得以饲养更多牲畜，并向美索不达米亚及其他市场的食品出口更多。"
 me_gordyene_13_title:0 "卡尔杜之群"
 me_gordyene_13_tooltip:0 "任务‘#Y $01_gordyene_task_12$#!’现已#G完成#!"
 me_gordyene_14.a:0 "我忙着在王座厅里吞云吐雾……"
 me_gordyene_14.b:0 "香料必须流动。"
 me_gordyene_14_desc:0 "远近的国王与皇帝竞相享用我们美味的阿莫姆香料调制的菜肴。我们的商人卖再多也供不应求。有人呼吁我们投资更多香料田，以满足日益增长的需求。"
 me_gordyene_14_title:0 "阿莫姆丰收"
 me_gordyene_14_tooltip:0 "任务‘#Y $01_gordyene_task_13$#!’现已#G完成#!"
 me_gordyene_15.a:0 "醉态是最佳状态……"
 me_gordyene_15_desc:0 "我们葡萄园的葡萄酒几乎太过成功。几乎找不到没有高脚杯或斟酒杯的餐桌或卧室。贵族及其宾客的醉态造成了一些……尴尬的影响。"
 me_gordyene_15_title:0 "酒须畅饮"
 me_gordyene_15_tooltip:0 "任务‘#Y $01_gordyene_task_14$#!’现已#G完成#!"
 me_gordyene_16.a:0 "我们这里已有成堆的宝石。"
 me_gordyene_16.b:0 "是的，探索新的宝石矿藏！"
 me_gordyene_16_b_tooltip:0 "#Y戈尔迪尼#!将派出一支#G探险队#!，寻找更多有前景的#Y加盖特斯矿#!地点。"
 me_gordyene_16_desc:0 "戈尔迪亚山脉喷涌出加盖特斯宝石，宛如温泉喷出温水——令所有人愉悦。然而，传闻山脉其他地点可能也藏有类似的财富矿脉。"
 me_gordyene_16_title:0 "加盖特斯之山"
 me_gordyene_16_tooltip:0 "任务‘#Y $01_gordyene_task_15$#!’现已#G完成#!"
 me_gordyene_1_desc:0 "重获戈尔迪亚山脉主权的时候到了——无须骚扰与贡赋，自由攀登尼法特斯山崖。我们的土地对外人长期是个谜……充满危险与绝望的世界。让我们证明这些传闻的真实性，在区域舞台上展现我们的存在。"
 me_gordyene_1_title:0 "亚美尼亚不得通过！"
 me_gordyene_1_tooltip:0 "与你的霸主#Y亚美尼亚#!开始一场#R独立战争#!。"
 me_gordyene_2.a:0 "山脉将永远是我们的家。"
 me_gordyene_2.b:0 "尼法特斯山将为我们的人民带来区域声望。"
 me_gordyene_2_a_tooltip:0 "任务‘#Y $01_gordyene_task_2$#!’现已#G完成#!"
 me_gordyene_2_b_tooltip:0 "派遣一支#E探险队#!从#E尼法特斯山#!带回#Y诺亚方舟#!的碎片。"
 me_gordyene_2_desc:0 "戈尔迪亚山脉，我们民族的象征，如今见证了我们的工程师与石匠的成就——卡尔杜人民的保护堡垒。远北的尼法特斯山顶闪耀着雪白光芒，其侧有一个奇特的斑点。长期传闻洪水时期的一艘巨船撞上那陡坡，动物从中散布到陆地。或许那古船的碎片仍嵌在岩石中……"
 me_gordyene_2_title:0 "戈尔迪亚山脉"
 me_gordyene_3.a:0 "渡过底格里斯！"
 me_gordyene_3_desc:0 "我们已突袭了边境以外的所有土地，四处可见升起的浓烟。现在是进攻塞琉古边境、夺取我们触手可及之地的时机。他们的总督很快将惊恐逃离。尼西比斯城，又称安条克麦多尼亚，其麦多尼亚居民对塞琉古霸主毫无好感，我们应解放该地免受其统治。"
 me_gordyene_3_title:0 "上底格里斯之灾"
 me_gordyene_3_tooltip:0 "#Y 戈尔迪尼将对塞琉古#!#R 宣战#!#Y，争夺#Y 尼西比斯#!城及#Y 上美索不达米亚#!地区。#!"
 me_gordyene_4.a:0 "底格里斯的未来将更美好。"
 me_gordyene_4_desc:0 "塞琉古误解了底格里斯及其水域。现在我们已征服其两岸的土地并巩固控制，卡杜乔伊的著名建筑师可有效重建，将上底格里斯的城市与定居点带入新时代。"
 me_gordyene_4_title:0 "$01_gordyene_task_4$"
 me_gordyene_4_tooltip:0 "任务‘#Y $01_gordyene_task_4$#!’现已#G完成#!"
 me_gordyene_5.a:0 "鼓励友好贸易。"
 me_gordyene_5.b:0 "我们的霸权将更惠及他们。"
 me_gordyene_5_desc:0 "我们花时间了解并向南方的阿迪亚贝尼人民学习。在此期间，我们发现他们对塞琉古的忠诚，如我们曾经一样，并不如巴比伦的统治者所相信的那般坚定。有机会与我们的邻居更好互动……为我们自己的利益。"
 me_gordyene_5_title:0 "阿迪亚贝尼之友"
 me_gordyene_5_tooltip:0 "任务‘#Y $01_gordyene_task_5$#!’现已#G完成#!"
 me_gordyene_6.a:0 "阿尔贝拉必将陷落！"
 me_gordyene_6_desc:0 "我们对阿尔贝拉王座及其主人的憎恨在这政治僵局中不断恶化。人民渴望行动，这似乎是正确的。若我们不先入侵他们的土地，他们很快将派军队越过边境进入我们的领土。"
 me_gordyene_6_title:0 "阿迪亚贝尼之敌"
 me_gordyene_7.a:0 "敬戈尔迪尼之王！"
 me_gordyene_7.b:0 "敬卡尔杜之王！"
 me_gordyene_7_desc:0 "卡杜乔伊现已组织为更集中且有序的国家，为人民及其文化的利益而运作。皮纳卡王座上的国王将长久统治，将卡杜乔伊的影响力扩展至两大河流之间的广阔领域。"
 me_gordyene_7_title:0 "山脉之王"
 me_gordyene_7_tooltip:0 "任务‘#Y $01_gordyene_task_6$#!’现已#G完成#!"
 me_gordyene_8.a:0 "道路诸神及其人民不过是历史遗存。"
 me_gordyene_8.b:0 "特舒布及其诸神将再次为我们指引道路。"
 me_gordyene_8.c:0 "我们必须重现古老而富饶的苏巴尔图之地。"
 me_gordyene_8_a_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_gordyene_task_7$#!”$mission_completed_tooltip_2$"
 me_gordyene_8_b_tooltip:0 "#E卡杜霍伊#!将采纳#Y特舒布#!及其#Y胡里安神系#!的崇拜。"
 me_gordyene_8_c_tooltip:0 "#E 卡杜乔伊#!将复兴古老的#Y 苏巴尔图王国#!！"
 me_gordyene_8_desc:0 "在山脉中，许多古老习俗历经岁月得以保留，特舒布的追随者似乎也不例外——他们的旧道信仰更加坚定。许多古老故事述说其追随者的胜利与荣耀。此外，在废弃小屋与传奇时代城墙中发现的古老石板，述说上底格里斯曾拥有的财富。在‘苏巴尔图’之名下，此地人民是最杰出的商人与拍卖师，财富超乎梦想。自那时起，似乎 многое已失……"
 me_gordyene_8_title:0 "苏巴尔图之子"
 me_gordyene_9.a:0 "皮纳卡已受保护。"
 me_gordyene_9_desc:0 "底格里斯是一条雄伟的河流，如今卡杜霍伊的石匠与工程师完成了该地区最强大的防护壁垒。有了这三座堡垒防御工事，王座及其供应的贸易必将稳定。"
 me_gordyene_9_title:0 "皮纳卡之巅"
 me_gordyene_9_tooltip:0 "任务‘#Y $01_gordyene_task_8$#!’现已#G完成#!"

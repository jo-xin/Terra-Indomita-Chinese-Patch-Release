l_simp_chinese:
 01_gordyene:0 "卡杜乔伊之地"
 01_gordyene_BUTTON_TOOLTIP:0 "山岳的移动由此开始：可怕、永恒、无可征服。"
 01_gordyene_CRITERIA_DESCRIPTION:0 "当戈尔迪尼摆脱政治枷锁，卡尔杜的战士建立一个繁荣且持久的王国，统治底格里斯河北部流域时，此任务将完成。"
 01_gordyene_DESCRIPTION:0 "卡杜乔伊人，其家园在数个世纪以来有诸多名称，包括‘卡尔杜’，在历史上以异类和看似掠夺性的部落而存在。他们既在所谓的戈尔迪亚山脉游荡，也在底格里斯河左岸活动。\n\n他们的家园天赋异禀却充满危险，据说能在数日内吞噬整支军队。这个奇特的民族既是出色的战士，也是创造者，精于利用河流隘口和便捷渡口的贸易财富。因此，他们被许多帝国觊觎，但从未被真正‘控制’。他们曾向亚述人和亚美尼亚人纳贡，但往往也被他们的所谓霸主收买。他们的命运是摆脱希腊帝国之间的大陆争霸，登上美索不达米亚地区的独特权力经纪人舞台。"
 01_gordyene_mission_task_1_tooltip:0 "#Y戈尔迪尼#!人民将通过#R战争#!摆脱#E亚美尼亚#!的控制！"
 01_gordyene_mission_task_3_a_tooltip:0 "你的#Y萨德沙尔#!必须是当前#Y统治者#!的#Y朋友#!，且必须是#Y统治家族#!成员。"
 01_gordyene_mission_task_3_b_tooltip:0 "#Y 戈尔迪尼#!的战士将突袭#Y 塞琉古帝国#!的#E 上美索不达米亚#!省，发动一场突袭#R 战争#!。"
 01_gordyene_mission_task_5_tooltip:0 "取决于#Y 戈尔迪尼#!与#Y 阿迪亚贝尼#!的#E 关系#!，可能导致#G 友好关系#!或#R 冲突#!……"
 01_gordyene_mission_task_7_tooltip:0 "#Y 卡杜乔伊人#!将能够#G 复兴#!古老的#E 胡里安宗教#!。"
 01_gordyene_task_1:0 "桀骜不驯的民族"
 01_gordyene_task_10:0 "萨雷萨与萨塔尔卡"
 01_gordyene_task_10_DESC:0 "许多中型定居点长期等待少量人口流入，以成为繁荣的城市。由于卡尔杜的经济依赖底格里斯的贸易及山脉的丰富原材料，萨雷萨与萨塔尔卡的地点亟需改进与成功。"
 01_gordyene_task_12:0 "卡杜霍伊牧场"
 01_gordyene_task_12_DESC:0 "在我们的集体记忆中，我们的民族多为流动牧民，在底格里斯河东的丰饶丘陵及亚美尼亚山脉南的山地放牧牲畜。为安抚我们的部落民并增加自然财富，我们应提升牧场的质量与保护。"
 01_gordyene_task_13:0 "芳香阿莫姆"
 01_gordyene_task_13_DESC:0 "我们的阿莫姆，类似东方的印多伊的豆蔻，是广受欢迎的调味料与消炎工具。底格里斯与幼发拉底河沿岸的厨师不断订购更多阿莫姆及我们的本地薄荷、月桂和桃金娘。我们野生‘灌丛’的天然香料可极大助力经济事业。让我们种植更多这些珍贵物质。"
 01_gordyene_task_14:0 "卡尔杜的葡萄园"
 01_gordyene_task_14_DESC:0 "与远西那些软弱的希腊人不同，我们卡尔杜人饮用烈酒。我们的葡萄园财富丰厚，美索不达米亚的市场渴求更多。为最大化利润与人民幸福，我们必须增加我们著名葡萄酒的产量。"
 01_gordyene_task_15:0 "开采加盖特斯"
 01_gordyene_task_15_DESC:0 "又称甘吉提斯，这种稀有宝石美不胜收。然而，当其熔化时，会产生浓烈的气味，据说能驱赶蜥蜴等生物……据传如此。凭借其药用价值与视觉魅力，这宝石是底格里斯河沿岸极有价值的出口品，应为卡杜霍伊经济所用。"
 01_gordyene_task_1_DESC:0 "虽然亚美尼亚人过去曾在北方对我们施加影响，但他们的时代已逝。我们对他们的贡赋不是乐趣，而是烦恼。我们以山脉为家——若我们封锁比特利斯隘口，拒绝继续做他们的傀儡，他们又如何能繁荣？"
 01_gordyene_task_2:0 "加固卡尔杜山脉"
 01_gordyene_task_21:0 "底格里斯十字路口"
 01_gordyene_task_21_DESC:0 "底格里斯河的流向推动美索不达米亚北部的贸易。商队与商人必须在关键点渡过底格里斯。卡尔杜的土地拥有一些最重要且平静的渡口，正如亚历山大大帝在前往高加梅拉途中发现的那样。贸易路线与利益的机会必须被充分利用。"
 01_gordyene_task_2_DESC:0 "我们的土地是山间隘口。西北有马西翁山，东北有尼法特斯山，据说动物方舟仍存于此。我们在该地区的重要性及对区域贸易路线的控制，依赖于我们防守隘口和底格里斯河渡口的能力。我们必须彻底加固这些交通线，以维持并增强我们的地位。"
 01_gordyene_task_3:0 "突袭塞琉古"
 01_gordyene_task_3_DESC:0 "塞琉古与其他继业者交战，忙于应对叛乱的附庸和危险的邻国，显得脆弱。现在是挑战他们对上底格里斯区域权威的时机。卡杜乔伊可先从边境突袭开始，然后进攻内地……"
 01_gordyene_task_4:0 "巩固上底格里斯"
 01_gordyene_task_4_DESC:0 "沿托罗斯山脉的众多支脉南下，上底格里斯地区的土地比其南方的幼发拉底河上游更为富饶肥沃。通过此地的贸易路线为人民带来财富与活力。古老的文明在此诞生与成长。卡尔杜的卡杜乔伊此前曾探索并时而控制该地区的部分，但从未完全掌控。现在人民可以繁荣发展，挖掘这片土地的潜力。"
 01_gordyene_task_4_tt:0 "[GetProvince('(int32)833').GetArea.GetName]地区至少有#Y 3#!座城市。"
 01_gordyene_task_4_ttt:0 "[GetProvince('(int32)830').GetArea.GetName]地区至少有#Y 3#!座城市。"
 01_gordyene_task_4_tttt:0 "[GetProvince('(int32)862').GetArea.GetName]地区至少有#Y 3#!座城市。"
 01_gordyene_task_5:0 "阿迪亚贝尼的对手"
 01_gordyene_task_5_DESC:0 "东南方的阿迪亚贝尼王国始终对我们构成威胁。他们的边界靠近我们南方的牧场，邻近牧羊人因牲畜放牧的丘陵归属问题多次争执。由于我们的……叛逆……本性，他们常向区域霸主——先是阿契美尼德，现在是塞琉古——请求协助征服我们的家园。我们必须在他们行动之前终结其威胁。"
 01_gordyene_task_5_tt:0 "[GetCountry('ADI').GetName]对[SCOPE.GetRootScope.GetCountry.GetName]的评价至少为#G +75#!，且[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与[GetCountry('ADI').GetRuler.GetName]是朋友。"
 01_gordyene_task_5_ttt:0 "[GetCountry('ADI').GetName]对[SCOPE.GetRootScope.GetCountry.GetName]的评价低于#R -25#!，且[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与[GetCountry('ADI').GetRuler.GetName]是对头。"
 01_gordyene_task_6:0 "戈尔迪尼王国"
 01_gordyene_task_6_DESC:0 "如果卡杜乔伊人要作为一个民族在这个不断变化的世界中生存下去，那么我们的土地和子弟就必须联合在一个人民的王国之中。我们最强大的领袖，来自最伟大部族的那个人，将挺身而出，宣告一个新时代，即戈尔迪尼王国的时代。"
 01_gordyene_task_7:0 "胡里安王国"
 01_gordyene_task_7_DESC:0 "我们最古老的部落知晓古骨悸动之地，古老神庙的废墟仍存。仍有少数隐士，那些在山巅与洞穴中低语咒语与诅咒的男女。然而，我们不应以困惑或鄙夷看待他们。传说他们的世界充满力量。或许学习他们的方式，重现这片土地的昔日荣光，能带来更大益处……\n\n#R完成此任务将禁用#!#T戈尔迪尼王国#!。"
 01_gordyene_task_8:0 "三堡之城"
 01_gordyene_task_8_DESC:0 "皮纳卡的首都已逐渐发展为富裕之地，位于底格里斯河的天然交汇与渡口。城内有三座高地——西岸两座，东岸一座。这些地点提供了完美的防御位置，可保护并监视沿河的经济与军事活动。它也将成为众人觊觎之地，必须不惜一切代价保护。"
 01_gordyene_task_9:0 "建筑大师"
 01_gordyene_task_9_DESC:0 "在山间的工坊中，卡尔杜的建筑师长期打造坚固且富有创意的装置与杰出的建筑。难怪尽管他们分散，卡尔杜人民仍建成了众多成功的堡垒、定居点和城市。鉴于他们的声望，不让他们改善人民的基础设施与防御将是浪费。"

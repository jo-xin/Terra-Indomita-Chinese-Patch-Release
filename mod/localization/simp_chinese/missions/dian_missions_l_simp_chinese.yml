l_simp_chinese:
 desc_dian_advanced_tech:0 "师从楚移民。"
 desc_dian_agriculture:0 "农业兴旺。"
 desc_dian_dynasty_tombs:0 "千秋万代之后，世人仍将惊叹于庄朝陵寝之壮丽辉煌。"
 desc_dian_embassy_qi:0 "使者自齐携知识返滇。"
 desc_dian_embassy_zhao:0 "使者携赵军战术知识返滇。"
 desc_dian_embassy_zhou:0 "我邦使节已将周朝宫廷礼仪之识带回了滇地。"
 desc_dian_final_mod:0 "滇王金印权威确保臣属追随我伟大君王。"
 desc_dian_new_capital:0 "迁至滇池南畔有利都城发展。"
 desc_highway_india_dian:0 "驰骋在通往印度之路，通往印度之路，印度之路。"
 dian_advanced_tech:0 "楚之先进技术"
 dian_agriculture:0 "滇人农耕"
 dian_bronze_house:0 "滇国青铜屋"
 dian_bronze_house_desc:0 "此件精工细作之滇国宅邸青铜模型，自卧具至微细餐具一应俱全，诚为艺术之杰作。"
 dian_dynasty_tombs:0 "庄氏王朝陵墓"
 dian_embassy_qi:0 "使齐"
 dian_embassy_zhao:0 "使赵"
 dian_embassy_zhou:0 "使周"
 dian_final_mod:0 "滇王金印"
 dian_missions:0 "意外王国"
 dian_missions_BUTTON_TOOLTIP:0 "乱世中觅得繁荣之道。"
 dian_missions_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]征服周边诸部落之邦、奉行王政，并成为#E 印度#!与#E 华夏#!之间桥梁之时，此使命即告完成。"
 dian_missions_DESCRIPTION:0 "[ROOT.GetCountry.GetName]之伟大邦国坐落于同名大湖之畔，位于#E 吐蕃#!东南边缘之群山与幽谷之中。公元前四世纪末，#E 滇#!之民以金属工艺闻名，所制青铜、金银器物，皆可见[GetCountry('CHU').GetName]与[GetCountry('LCV').GetName]等地之影响。然而，于此文明边缘之恬静王国中，紧张气氛正在升腾——#E 战国#!之争愈演愈烈，#E 中夏#!之政局动荡，即将溢出目前之疆域，波及更远之方……"
 dian_missions_task_1:0 "征服昆明"
 dian_missions_task_10:0 "还需更多贝"
 dian_missions_task_10_DESC:0 "在大洋沿岸至为富饶之贸易网络中，贝壳贸易——尤其是玳瑁与海贝——乃其中之佼佼者。倘若[ROOT.GetCountry.GetName]据有主导此贸易所需之领地，则帝国府库必将开始满溢！\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 dian_missions_task_11:0 "王家陵墓"
 dian_missions_task_11_DESC:0 "虽然我邦向来敬奉祖先，但#E 楚#!及#E 中夏#!其他诸民装饰死者陵寝之风范，已深深印入国王[ROOT.GetCountry.GetRuler.GetName]及我邦贵族之心。我[ROOT.GetCountry.GetName]之诸大臣已奉命，就当为我伟大已故君主修建如此王家陵寝之耗费进行勘察。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 dian_missions_task_11_first_ruler_rip:0 "我伟大尊贵的首代君主已薨。"
 dian_missions_task_12:0 "向喜马拉雅"
 dian_missions_task_12_DESC:0 "虽然我邦久已消除了#E 昆明#!之威胁，但高原东缘其他#E 吐蕃#!部落，如[GetCountry('QIO').GetName]与[GetCountry('ZUO').GetName]，仍在劫掠我北部领地，并为#E 华夏#!诸民提供了一条入侵我#Y 滇池#!故土之可行路径。我们必须控制这些土地，否则将永在蛮族劫掠与外敌入侵之恐惧中度日。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 dian_missions_task_13:0 "遣使中国"
 dian_missions_task_13_DESC:0 "自#E 庄蹻#!到来以来，我邦日益模仿#E 楚#!之风，如今[ROOT.GetCountry.GetName]王国已有能力协助塑造和引导#E 中夏#!之政局发展，以此谋求利益。若我邦决意入局对抗#E 战国#!群雄，则必须决定与何方结盟——毕竟，不可树敌于天下……\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 dian_missions_task_13_embassy:0 "决定使节前往何国。"
 dian_missions_task_14:0 "投桃报李"
 dian_missions_task_14_DESC:0 "虽然我邦已有时间与#E 楚#!将领之入侵达成和解，但我等绝不会忘却对我至尊王国之冒犯。[ROOT.GetCountry.GetName]朝廷中之军事谋略家认为，今正是向[GetCountry('CHU').GetName]回敬之时；我邦当向#Y 扬子江#!以南之#E 荆#!地区挥师，将这些广阔土地据为己有！\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 dian_missions_task_14_claims:0 "获得荆地区所有行省宣称。"
 dian_missions_task_15:0 "新都城"
 dian_missions_task_15_DESC:0 "[ROOT.GetCountry.GetName]王国已在#E 南中#!成为文明之堡垒，我主[ROOT.GetCountry.GetRuler.GetName]。然我都城[GetProvince('(int32)8914').GetName]正因房舍不足而日益拥挤，且尚未具备#E 中夏#!诸邦那般辉煌之建筑气象。我邦当兴建新楼宇与宫殿宅邸，向臣民与外国显贵们展示我新获之财富与荣耀。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 dian_missions_task_16:0 "草原艺术"
 dian_missions_task_16_DESC:0 "虽然与#E 楚#!及#E 华夏#!诸民之接触对我文化发展影响最为深远，但我等亦不可忽视#E 戎#!骑手对我社会之影响。彼等对马术与骑兵战术之精通，久已令[ROOT.GetCountry.GetName]朝廷为之着迷，国王[ROOT.GetCountry.GetRuler.GetName]欲延揽工匠，模仿#E 戎#!之伟大艺术风格，为我邦圣物匣铸造新器。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 dian_missions_task_17:0 "通往印度之路"
 dian_missions_task_17_DESC:0 "穿越崎岖地形与诸多部落通往#E 印度#!之道路并不易于掌控，我主[ROOT.GetCountry.GetRuler.GetName]。#E 永昌#!虽近在咫尺，却地势艰险，且为[GetCountry('AIL').GetName]所居。过此而往，#E 蒲部#!之地已有大批#E 骠#!人自#E 吐蕃#!涌入，沿途驱逐并吞并#E 濮#!之民。然若我邦能设法驯服此等险恶之地，则自#E 印度#!至#E 华夏#!之繁华陆路商道，便尽归我邦垄断。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 dian_missions_task_18:0 "滇国御玺"
 dian_missions_task_18_DESC:0 "国王[ROOT.GetCountry.GetRuler.GetName]欲以#E 中夏#!诸大邦之风范，铸造一枚新的王室玺印。[ROOT.GetCountry.GetName]之王室议政会已奉命寻觅铸造此件器物之法——或通过#E 华夏#!友邦之外交获取，或自行设法仿制彼等之品质……\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 dian_missions_task_18_req:0 "民政进步≥4 或 有中国盟友。"
 dian_missions_task_1_DESC:0 "蛮族[GetCountry('TB2').GetName]部落永踞我北方，自#E 吐蕃#!成群结队蜂拥而下。长期以来，彼等野蛮劫掠与骑兵战术蹂躏我田畴，屠戮我无辜农人。今正当时，当一劳永逸地教化#E 昆明#!部族之民，并将其战略要地并入我新兴之王国。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 dian_missions_task_2:0 "东方诸部"
 dian_missions_task_2_DESC:0 "东方#E 兴古#!地区之诸小领主，久已游离于我主[ROOT.GetCountry.GetRuler.GetName]之掌控之外。此等小邦不过是尚未开化之蛮夷，不知其土地之全部潜力。若我邦指望自保，免遭北方#E 华夏#!诸民之统治，则必须巩固东线，将东方诸民纳入我邦之生活方式。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 dian_missions_task_3:0 "农牧并举"
 dian_missions_task_3_DESC:0 "国王[ROOT.GetCountry.GetRuler.GetName]，我伟大之[ROOT.GetCountry.GetName]邦国人口日渐繁衍，然我邦对粮食生产之投入——无论是农耕还是畜牧——未能与都城人口之增长并驾齐驱。我邦当拨资以改善粮食安全之状况，以免百姓另觅途径以充饥饿之腹。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 dian_missions_task_3_cattle_with_farm:0 "至少有一畜牧行省设有农垦聚落。"
 dian_missions_task_3_rice_with_farm:0 "至少有一稻米行省设有农垦聚落。"
 dian_missions_task_4:0 "庄蹻"
 dian_missions_task_4_DESC:0 "北方的#E战国#!之乱如今已危及[ROOT.GetCountry.GetName]，随着政治动荡与战火席卷[GetCountry('CHU').GetName]，成群结队的#E楚#!人溃兵开始出现在我国边境。我邦之命运，或将取决于#E中原#!正在上演的变局……\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 dian_missions_task_4_invasion_zhuang_qiao:0 "庄蹻入侵将得解决。"
 dian_missions_task_5:0 "驱逐寿靡"
 dian_missions_task_5_DESC:0 "[GetCountry('SMI').GetName]之民与我邦共享诸多文化习俗，且据有战略要地，正当我邦之北，扼守通往#E蜀地#!之路。若能将其纳入麾下——或以外交，或以武力——则我邦将踞有利之势，称雄整个#E南中#!地区。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 dian_missions_task_6:0 "向海岸"
 dian_missions_task_6_DESC:0 "繁荣的#Y红河#!与大海之贸易就在我邦东南，[ROOT.GetCountry.GetRuler.GetName]大人。虽有众多蛮族盘踞于[ROOT.GetCountry.GetName]与海岸之间，但降服这些桀骜不驯的部落当非难事。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 dian_missions_task_7:0 "青铜时代"
 dian_missions_task_7_DESC:0 "青铜器制作历来是[ROOT.GetCountry.GetName]世代相传之标志，礼仪用器既用于宫中祭祀，亦远销海外。我邦金工匠人亟需扩充锡矿与铜矿，并增建作坊，以满足精良器物之需求，更为[ROOT.GetCountry.GetRuler.GetName]大人铸造堪配王宫之珍品。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 dian_missions_task_7_base_metals_blacksmith:0 "至少有一贱金属行省设有铁匠铺。"
 dian_missions_task_7_base_metals_mine:0 "至少有一贱金属行省设有矿场。"
 dian_missions_task_8:0 "先进技术"
 dian_missions_task_8_DESC:0 "与[GetCountry('CHU').GetName]人日益密切的交往，正令我等愈发意识到自身之不足，[ROOT.GetCountry.GetRuler.GetName]王。那些#E楚#!人仅向我们透露了寥寥数项技术秘辛，然若欲主宰自身命运，我们必须提拔#E楚#!贵族至权位，以诱使他们将其创新之术分享与[ROOT.GetCountry.GetName]王国。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 dian_missions_task_8_three_chu_researchers:0 "至少三名研究员为楚文化。"
 dian_missions_task_9:0 "骄兵必败，加倍奉还"
 dian_missions_task_9_DESC:0 "我邦在#Y长江#!以南地区之首要竞争对手——[GetCountry('YLG').GetName]，一直是[ROOT.GetCountry.GetRuler.GetName]王的心腹之患，处处抗拒合作与友善。据说其君主[GetCountry('YLG').GetRuler.GetName]竟自诩与#E华夏#!诸王乃至#Y天子#!平起平坐，甚至有过之。我等理应将此狂妄之徒一举铲除，并高歌传颂其覆亡。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 dian_missions_task_9_claims:0 "获得武陵、零陵、越巂、汉嘉区域所有行省宣称。"
 dian_new_capital:0 "迁都"
 dian_servant_with_parasol:0 "滇国持伞侍从"
 dian_servant_with_parasol_desc:0 "一件青铜作品，展现了一名滇人侍从撑举大伞为国王遮挡烈日之情景，既彰显了滇人的艺术天才，亦体现了其谦逊之风。"
 dian_shell_vessel:0 "储贝器"
 dian_shell_vessel_desc:0 "一尊饰有动物纹饰的青铜器皿，用于储藏滇王收集的珍贵贝壳。"
 dian_steppe_vessel:0 "骑士青铜器"
 dian_steppe_vessel_desc:0 "一尊青铜花瓶，其上铸有骏马与诸兽小像，瓶顶有一金质骑手跨坐于青铜骏马之上。"
 highway_india_dian:0 "通往印度之路"
 is_in_jing_region:0 "位于荆地区"
 me_dian_1.a:0 "昆明将臣服于吾。"
 me_dian_10.a:0 "兴盛贝贸将令吾富足。"
 me_dian_10_desc:0 "伟大的[ROOT.GetCountry.GetName]王国终于掌握了大规模贝类贸易的来源，吾王[ROOT.GetCountry.GetRuler.GetName]！长久以来，我们必须从大洋沿岸的各部族进口这些奢侈品，而如今我们已统御这些土地，将有足够的贝壳既满足自身需求，又可出口部分以图额外利润！此外，为纪念我们近期对产贝诸省的征服，我们的工匠以您——[ROOT.GetCountry.GetRuler.GetName]王——的名义，铸造了一件独特的青铜贮贝器。"
 me_dian_10_title:0 "$dian_missions_task_10$"
 me_dian_11.a:0 "王家陵墓落成！"
 me_dian_1100.a:0 "不惜工本。"
 me_dian_1100_desc:0 "王陵的预算已高得惊人。然而，我们绝不能玷污先王之名，亦不能折损[ROOT.GetCountry.GetName]王国的威望。[ROOT.GetCountry.GetRuler.GetName]王已命令财政大臣设法筹措资金，不得有任何借口。"
 me_dian_1100_title:0 "$dian_missions_task_11$"
 me_dian_11_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]王步入新建王陵中华丽明亮的殿宇时，他不禁为精美的雕像、石柱与拱门所震撼。入口拱门上镶嵌着宝石，每座墓室中都供奉着来自全国的祭品——香、玉、金、瓷等不一而足。王心中暗想，这才是一座配得上[ROOT.GetCountry.GetName]诸王——包括他自己——的王家陵园。"
 me_dian_11_title:0 "$dian_missions_task_11$"
 me_dian_12.a:0 "北方隘口终得安宁。"
 me_dian_12_desc:0 "[GetCountry('QIO').GetName]人与[GetCountry('ZUO').GetName]人崎岖的领地如今已处于我军占领之下，吾王[ROOT.GetCountry.GetRuler.GetName]！虽然#E 吐蕃#!的崇山峻岭以严酷环境加之于我军的损耗，但我们终究战胜了蛮族与险峻地形，驯服了这处世界尽头的荒芜之地。"
 me_dian_12_title:0 "$dian_missions_task_12$"
 me_dian_13.a:0 "遣使中原天子。"
 me_dian_13.b:0 "使节须赴尚武之赵国。"
 me_dian_13.c:0 "富庶齐国乃首次遣使中国之良选……"
 me_dian_1300.a:0 "天子又一潜在盟友。"
 me_dian_1300_desc:0 "[GetCountry('ZHO').GetName]的天子已向[ROOT.GetCountry.GetName]的朝廷遣回正式使团，吾王[ROOT.GetCountry.GetRuler.GetName]。他们带来了黄金、精铜与贝壳作为礼物，还有对陛下您的天赐恩宠之承诺。或许[GetCountry('ZHO').GetRuler.GetName]帝将成为我们进入#E 中原#!征途中的一位良好盟友。"
 me_dian_1300_title:0 "$dian_missions_task_13$"
 me_dian_1301.a:0 "或许滇国可资利用……"
 me_dian_1301_desc:0 "[GetCountry('ZHA').GetName]国已向[ROOT.GetCountry.GetName]的朝廷遣回正式使团，伟大的[ROOT.GetCountry.GetRuler.GetName]。他们带来了黄金、贝壳、精美的青铜礼仪剑，以及一部论述其对抗#E 戎#!蛮族骑兵战术的论著，因为他们曾在#E 朔方#!与戎狄交战，积累了经验。[ROOT.GetCountry.GetRuler.GetName]对此最后的礼物尤为感激，他将这部典籍交给了他的军事顾问们研习。"
 me_dian_1301_title:0 "$dian_missions_task_13$"
 me_dian_1302.a:0 "且向滇国学所能学。"
 me_dian_1302_desc:0 "[GetCountry('QII').GetName]朝廷已向[ROOT.GetCountry.GetName]的朝廷遣回正式使团，吾主[ROOT.GetCountry.GetRuler.GetName]。他们带来了黄金、贝壳，以及一件精美的青铜器物，其上描绘了古#E 神教#!中#E 上帝#!在天庭的景象，器物底部似乎刻有一种未知的篆书文字。[ROOT.GetCountry.GetRuler.GetName]王下令为此圣器举行祝圣仪式，并由我们的学者研究其铭文。"
 me_dian_1302_title:0 "$dian_missions_task_13$"
 me_dian_13_desc:0 "财政大臣已告知[ROOT.GetCountry.GetRuler.GetName]王，已筹集了各类货物与黄金，可向#E 中原#!诸国之一呈献一支奢华的使团。有些大臣认为我们应直接派遣使节前往[GetCountry('ZHO').GetName]觐见#E 天子#!本人；另一些则渴望从[GetCountry('ZHA').GetName]获取军事机密；而掌管经济的官员则希望与富庶的[GetCountry('QII').GetName]建立关系。"
 me_dian_13_title:0 "$dian_missions_task_13$"
 me_dian_14.a:0 "复仇甜美。"
 me_dian_14_desc:0 "曾受[GetCountry('CHU').GetName]国征服的#E 苗#!之地，如今已被您——慷慨的[ROOT.GetCountry.GetRuler.GetName]王——所解放。您的新臣民详细陈述了#E 楚#!政府对其族人犯下的种种暴行，因此我们洗劫了#E 楚#!城镇，并对被指控贪污腐败和犯有战争罪行的官员进行了报复，理所应当；这是为[ROOT.GetCountry.GetName]以及所有受#E 楚#!欺凌者讨回公道。"
 me_dian_14_title:0 "$dian_missions_task_14$"
 me_dian_15.a:0 "新都配得上滇国。"
 me_dian_1500.a:0 "不惜人力。"
 me_dian_1500_desc:0 "建造新都城并非易事，需动用大量人力。农民被征发参加工役，一些后备军中的正规步兵也被调来。工地上的意外事故、中暑和疾病难免会造成一些伤亡……"
 me_dian_1500_title:0 "$dian_missions_task_15$"
 me_dian_15_desc:0 "新都城的建设堪称奇迹，吾主[ROOT.GetCountry.GetRuler.GetName]。宫殿已升级改建，以彰显陛下的尊贵身份，在王上的私人寝宫与翻新后的藏书阁之间，还增建了一座异域风情花园。[GetProvince('(int32)8914').GetName]的上层与下层民众，对其社区中新建的住宅单元欣喜若狂，人满为患的窘境已得到缓解。愿我们华丽的新都城成为我国公民之圣所，亦为外邦人艳羡之源头。"
 me_dian_15_title:0 "$dian_missions_task_15$"
 me_dian_16.a:0 "新草原风器物巧夺天工。"
 me_dian_1600.a:0 "须重金聘大匠！"
 me_dian_1600_desc:0 "[ROOT.GetCountry.GetRuler.GetName]王已在全国乃至外邦朝廷中放话，[ROOT.GetCountry.GetName]王国正在征募一位伟大的艺术家，创作一件融汇#E 滇#!、#E 戎#!与#E 华夏#!元素于一体的杰作，以激励举国上下。"
 me_dian_1600_title:0 "$dian_missions_task_16$"
 me_dian_16_desc:0 "成果之青铜器堪称神品——它将[ROOT.GetCountry.GetName]、#E 华夏#!艺术之精妙与#E 戎#!草原之纹饰融为一炉。器上的骏马微雕与铭文，在朝堂之上揭幕时引来了对其精湛品质的由衷赞叹。愿此庄严之器存于我国圣地之一，经受万民颂扬与钟爱。"
 me_dian_16_title:0 "$dian_missions_task_16$"
 me_dian_17.a:0 "无力耗费人力穿越丛林山地修路……"
 me_dian_17.b:0 "须投入人力开辟通往印度商道！"
 me_dian_1700.a:0 "首条通印度之路竣工！"
 me_dian_1700_desc:0 "以众多兵士死于中暑和热带疾病为代价，[ROOT.GetCountry.GetName]王国如今终于拥有一条通往#E 哀牢#!的真正道路。我们距目标已行至半途……"
 me_dian_1700_title:0 "$dian_missions_task_17$"
 me_dian_1701.a:0 "通往印度全程已可通行。"
 me_dian_1701_desc:0 "历经漫长岁月，此工程终告完成。数千条生命因意外、疾病、蛮族袭击与中暑而逝去。然而，他们的牺牲并非徒劳，贸易正沿着新开辟的通道迅速流动，我军也可自如地从[GetProvince('(int32)8914').GetName]行军至#E 印度#!之边缘。"
 me_dian_1701_title:0 "$dian_missions_task_17$"
 me_dian_17_desc:0 "我们终于夺取了通往富庶#E 印度#!的最后一块领土，吾主[ROOT.GetCountry.GetRuler.GetName]！虽然征服和殖民这些炎热艰难之地耗资巨大，但新的贸易货物已开始运抵[GetProvince('(int32)8914').GetName]都城，物有所值。如今我们必须决定，是投资修建#Y 道路#!，还是满足于为商贾保留一条野径。"
 me_dian_17_title:0 "$dian_missions_task_17$"
 me_dian_18.a:0 "御玺将令朝堂敬畏威严。"
 me_dian_18_desc:0 "伟大的[ROOT.GetCountry.GetName]王国终于获得了一方显赫的王玺，吾王[ROOT.GetCountry.GetRuler.GetName]。长久以来，#E 中原#!的天子以此等传国之物彰显其对天地的权威，证明其统治#E 中国#!全境之权。作为非#E 华夏#!之民，我滇之玺不会直接冒犯#E 战国#!列国，却能赋予陛下对#E 滇#!全境无可置疑的政治权威。"
 me_dian_18_title:0 "$dian_missions_task_18$"
 me_dian_1_desc:0 "在其山谷的每个角落，在其土地的每座山巅之上，[GetCountry('TB2').GetName]诸部的抵抗已尽数扑灭。有些氏族战死，有些沦为奴隶，沦为战俘束手就擒。剩余的人口将在这片土地上劳作，侍奉我主[ROOT.GetCountry.GetRuler.GetName]，做[ROOT.GetCountry.GetName]的忠顺臣民。"
 me_dian_1_title:0 "$dian_missions_task_1$"
 me_dian_2.a:0 "东方诸地已臣服！"
 me_dian_2_desc:0 "东方#E 兴古#!部族，根本无法与我方的人力与战术优势匹敌。蛮族径直冲入战团，狂吼嘶叫以图在[ROOT.GetCountry.GetName]战士心中播下恐怖。正当我军士卒开始怯战之际，吾王[ROOT.GetCountry.GetRuler.GetName]自敌后策马杀出，出其不意，敌军在铁砧与铁锤之间溃不成军。当地残存的诸氏族迅速求和。"
 me_dian_2_title:0 "$dian_missions_task_2$"
 me_dian_3.a:0 "吾民当得饱食。"
 me_dian_3_desc:0 "建议资助兴建新围场与农庄之策已见成效，吾王[ROOT.GetCountry.GetRuler.GetName]。一批批新收获的肉与稻米正涌入[GetProvince('(int32)8914').GetName]城中，填饱饥民的肚腹，并充实我们的米仓以防未来饥荒。"
 me_dian_3_title:0 "$dian_missions_task_3$"
 me_dian_4.a:0 "楚将今治滇国！"
 me_dian_400.a:0 "于王国意味着什么？"
 me_dian_400_desc:0 "将军#E 庄蹻#!，在征伐其他#E 战国#!与反叛[GetCountry('CHU').GetName]王室的行动皆告失败之后，决定离开故国，携#E 楚#!军中与政治精英中相当可观的一部分人，前往[ROOT.GetCountry.GetName]图谋富贵，意图篡夺我主[ROOT.GetCountry.GetRuler.GetName]之位。倘若他得手，#E 滇#!或将迎来一位新王……"
 me_dian_400_title:0 "$dian_missions_task_4$"
 me_dian_401.a:0 "挺住，大族必守忠……"
 me_dian_401_desc:0 "[ROOT.GetCountry.GetName]东北边境的卫兵英勇地与#E 庄蹻#!将军作战，然而他们终究不敌受过正规战场战术训练的#E 华夏#!成建制之师。眼见大势已去，乡间易受攻击的氏族成员开始倒向这位入侵者。消息传至身处[GetProvince('(int32)8914').GetName]朝中的我主[ROOT.GetCountry.GetRuler.GetName]耳中：敌军浩荡大军正逼近都城……"
 me_dian_401_title:0 "$dian_missions_task_4$"
 me_dian_4_desc:0 "[ROOT.GetCountry.GetName]的诸氏族逐一被#E 庄蹻#!所动摇——在其向#Y 滇池#!进军途中，或通过武力胁迫，或通过投机贪婪——他们皆背弃了我部族之王，以换取在新秩序中的金钱与权力承诺。叛族成员打开了[GetProvince('(int32)8914').GetName]的城门，得胜的将军一路杀穿王家卫队，将我们的王连同尚存的忠贞氏族首领一同俘虏。"
 me_dian_4_title:0 "$dian_missions_task_4$"
 me_dian_5.a:0 "寿靡亲族今入我疆。"
 me_dian_5_desc:0 "北方[GetCountry('SMI').GetName]诸氏族终于归附于[ROOT.GetCountry.GetName]的治下，吾主！陛下[ROOT.GetCountry.GetRuler.GetName]宽仁地接受了统治其主要聚落的部落精英们的投降，同时处决或囚禁了少数抵抗者。#E 滇#!之民如今统一在同一面旗帜之下。"
 me_dian_5_title:0 "$dian_missions_task_5$"
 me_dian_6.a:0 "沿海贸易当致富！"
 me_dian_6_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]王沿#Y 红河#!航行时，他终于望见了远方大海的海岸。一队商船正在远方沿近海航行，有些似乎正停泊在港口。虽然穿越丛林与蛮族之地的旅程殊为不易，但当[ROOT.GetCountry.GetRuler.GetName]看到这些船只、利润之潜力充满双眸时，他感到自己寻求统御大海的征途已得到了印证。"
 me_dian_6_title:0 "$dian_missions_task_6$"
 me_dian_7.a:0 "我金属工艺无出其右。"
 me_dian_7_desc:0 "随着[ROOT.GetCountry.GetName]境内新作坊与矿场的建成，我们的工匠与金属匠师们一直辛勤劳作，铸造用作礼器的新铜器。一件作品描绘了一座精工细造的房屋，内中微缩呈现了[GetProvince('(int32)8914').GetName]家户中所有典型物件。第二件作品描绘了一名谦恭的侍从，以阳伞为吾王[ROOT.GetCountry.GetRuler.GetName]遮挡盛夏烈日。两件作品立即得到王上赞赏，并被置于我国圣物库中。"
 me_dian_7_title:0 "$dian_missions_task_7$"
 me_dian_8.a:0 "从楚学得良多。"
 me_dian_8_desc:0 "[GetCountry('CHU').GetName]技术的奥秘已被解开，吾王[ROOT.GetCountry.GetRuler.GetName]！伟大的[ROOT.GetCountry.GetName]国必将因这些前所未闻之创新的发现而受益匪浅。结合我们本就优越的文化，这些发明将助推我们直上云霄！"
 me_dian_8_title:0 "$dian_missions_task_8$"
 me_dian_9.a:0 "夜郎自大。"
 me_dian_90.a:0 "不妙……"
 me_dian_90_desc:0 "伟大的[GetCountry('CHU').GetName]将军#E 庄蹻#!在其母国正在遭受政治上的边缘化。随着#E 楚#!国力的衰落，以及在#E 战国#!列国面前的节节败退，#E 庄蹻#!正密谋反叛楚王[GetCountry('CHU').GetRuler.GetName]。然而，倘若这位将军未能攻下#E 楚#!都城#E 郢#!，他可能会将[ROOT.GetCountry.GetName]视为逃避#E 楚#!追捕的避难之地，并试图篡夺[ROOT.GetCountry.GetRuler.GetName]之位，将我们的王国据为己有。"
 me_dian_90_title:0 "楚军将临"
 me_dian_9_desc:0 "那永远傲慢的[GetCountry('YLG').GetName]王国，即便在临终之际，仍对自己的劣势嗤之以鼻。其统治者在我方军队于战场上击溃其军后，我们遣使请其和平投降，他竟依然辱骂我使。这位妄自尊大的领袖坚称#E 夜郎#!仍为已知世界中最强大的势力之一。我们的使节不知该笑还是不该笑，便只将此反应禀报了[ROOT.GetCountry.GetRuler.GetName]，其随即下令强行逮捕#E 夜郎#!王。"
 me_dian_9_title:0 "$dian_missions_task_9$"

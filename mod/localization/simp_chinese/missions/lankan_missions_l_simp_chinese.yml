 lankan_trade_center:0 "楞伽贸易中心"
 lankan_unity:0 "楞伽统一"
 maha_bodhi_tree:0 "大菩提树"
 major_lankan_food_supply:0 "主要的楞伽食品供应"
 masters_of_dravida:0 "达罗毗荼之主"
 me_lanka_1.a:0 "阿㝹罗陀补罗将繁荣昌盛！"
 me_lanka_10.a:0 "强制他们皈依，我们不能冒宗教不和的风险。"
 me_lanka_10.b:0 "把他们全部送去阿凡卡"
 me_lanka_10.c:0 "让希腊人自己呆着"
 me_lanka_10_desc:0 "我的王！那些希腊人变得越来越难对付了。起初，我们认为他们只是我们人口中的一小部分，但进一步的调查显示，他们在我们的王国里确实有一个巨大的群体。我们收到了许多抱怨，特别是来自我们的祭司。他们要求希腊人要么抛弃他们的异教，要么在我们的土地上定居。我们应该怎么做？"
 me_lanka_10_title:0 "希腊皈依者"
 me_lanka_1_desc:0 "当毗阇耶王子被放逐到楞伽时，他只带了几个追随者。正是他创建了我们的王国。现在，我们，他的后代，有一段值得骄傲的历史可以回顾。但多年的内部冲突削弱了我们的力量，我们必须在这个艰难的时期找到我们的方向，以确保阿㝹罗陀补罗能够再次崛起！"
 me_lanka_1_title:0 "阿㝹罗陀补罗王国"
 me_lanka_2.a:0 "谷物@grain!"
 me_lanka_2.b:0 "蔬菜@vegetables!"
 me_lanka_2.c:0 "牲畜@cattle!"
 me_lanka_2.d:0 "糖@sugar!"
 me_lanka_2_desc:0 "在进口了大量不同的食物后，我们必须决定在楞伽岛上种植作物。"
 me_lanka_2_title:0 "食物进口"
 me_lanka_3.a:0 "瞿建那 [SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_event_3_loc')]"
 me_lanka_3.b:0 "阿婆迦那 [SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_event_3_loc')]"
 me_lanka_3.c:0 "卢诃那陀 [SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_event_3_loc')]"
 me_lanka_3.d:0 "梨多 [SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_event_3_loc')]"
 me_lanka_3_desc:0 "我们应该选择哪里？"
 me_lanka_3_title:0 "选择一个省份"
 me_lanka_4.a:0 "摩诃帝他"
 me_lanka_4.b:0 "母度菟"
 me_lanka_4.c:0 "许德里亚库斯"
 me_lanka_4_desc:0 "随着人口的不断增长，我们当地的食物来源已不能充分支撑我们的人口增长。需要建设新的农场来确保在任何时候都有足够的食物。我们的专家已经精心挑选了三个地区的土地以供我们可以使用。我们应该在哪里建造这些新的庄园？"
 me_lanka_4_title:0 "阿㝹罗陀补罗的食物来源"
 me_lanka_5.a:0 "废除他们的王！立即整合他们！"
 me_lanka_5.b:0 "让我们先从和平共处开始，藩属国也不赖。"
 me_lanka_5_desc:0 "在许多代表团前往鲁呼奴的土地后，我们的外交官终于带着好消息回来了。鲁呼奴人愿意张开双臂欢迎我们的友谊建议。自从毗阇耶王朝首次建立以来，我们的关系就一直很密切，提婆南毗耶帝沙的弟弟目前统治着这片土地。也许我们可以利用这种情况为我们带来政治优势？"
 me_lanka_5_title:0 "鲁呼奴的问题"
 me_lanka_6.a:0 "用礼物与阿育王交好"
 me_lanka_6.b:0 "用言语的方式与阿育王交好"
 me_lanka_6_desc:0 "我的国王！我们听说北方有一位伟大的国王，孔雀王朝的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]。关于他的智慧和财富的消息传得很远很远。我们应该立即派出代表团，以便与他建立良好的关系。但问题是，我们应该如何赢得他的友谊？"
 me_lanka_6_title:0 "法阿育王"
 me_lanka_7.a:0 "诸神已经让我们失望了太多次了！让佛陀使我们的人民皈依！"
 me_lanka_7.b:0 "抛弃我们祖先的传统？让他打包回家吧！"
 me_lanka_7_desc:0 "一位名叫摩哂陀的僧人来到了我国。他谈到了一种新的信仰，摆脱了物质财富和对神灵的崇拜。据说这种名叫佛教的信仰在我国国内已经有了一些皈依者，而印度的一些地区也已经在追随佛教的教义。也许我们可以通过他的教义获得新的力量？"
 me_lanka_7_title:0 "摩哂陀"
 me_lanka_8.a:0 "阿㝹罗陀补罗！当然是我们的首都"
 me_lanka_8.b:0 "弥醯因多丽"
 me_lanka_8.c:0 "羯耶尼"
 me_lanka_8.d:0 "帝伽伐毘"
 me_lanka_8_desc:0 "我们的僧侣讲述了他们从北方带来的一件珍贵的遗物。一根来自佛陀伽耶的吉祥大菩提树的树枝。他们说，佛陀就是在这棵树下坐着开悟的。在获得了这样一个无价的佛教遗物后，我们可以用它来种植我们自己的大菩提，就在楞伽岛。这样做可以提高我们在佛教世界中的地位，如果我们幸运的话，甚至可以让我们自己开悟。"
 me_lanka_8_title:0 "神圣的大菩提树"
 me_lanka_9.a:0 "多么奇特的现象"
 me_lanka_9_desc:0 "我的王！我们的总督告诉我们城市里有一种奇怪的人。他们说外语，向异教的神灵献祭。他们自称希腊人，并讲述了在遥远的西方的伟大王国。他们认为我们的土地是世界上最遥远的边缘。"
 me_lanka_9_title:0 "希腊化的人群"
 me_lanka_reclamation_1.a:0 "阿㝹罗陀补罗将繁荣昌盛！"
 me_lanka_reclamation_1_desc:0 "印度南部在我们的治下实现了统一，我们确实得到了诸神的祝福。现在我们必须向北看，孔雀帝国的残余以及毗阇耶王子的祖居地都在我们的视野之中。我们也许能够做到以前从未做过的事情——统一整个印度。"
 me_lanka_reclamation_1_title:0 "向北推进"
 me_lanka_reclamation_2.a:0 "阿㝹罗陀补罗"
 me_lanka_reclamation_2.b:0 "医多罗伐"
 me_lanka_reclamation_2.c:0 "希卡杜瓦"
 me_lanka_reclamation_2.d:0 "摩诃揭罗摩"
 me_lanka_reclamation_2_desc:0 "长期以来，糖在宫廷内一直是一种奢侈品，但最近的扩张使我们能够掌握更多我们梦想拥有的糖。现在，在获得了甜香料的种子后，我们的农民不知道该在哪里种植这一宝物。我们必须小心选择，因为如果谨慎小心地处理，白金可以给我们带来许多财富。"
 me_lanka_reclamation_2_title:0 "甜蜜的糖"
 me_lanka_reclamation_3.a:0 "拥抱僧诃补罗的传承。"
 me_lanka_reclamation_3.b:0 "坚守我们的楞伽之根。"
 me_lanka_reclamation_3_desc:0 "我的王！我们已经收复了我们伟大的毗阇耶王子的家园。如果我们愿意，我们可以伪造一些文件，将我们的王朝与他的王朝联系起来。这样做无疑会加强我们的王国。"
 me_lanka_reclamation_3_title:0 "僧诃补罗的传承"

 lankan_missions_task_8_B_tooltip:0 "[mission_country.GetRuler.GetName]获得了#Y 胜利者#!的特质，他有可能也会获得#Y 朱罗的血脉#!。"
 lankan_missions_task_8_DESC:0 "现在，朱罗人已然匍匐在我们脚下。通往北方的道路已是一片坦途。\n\n\n\n\n\n\n\n\n\n@india_mil21!"

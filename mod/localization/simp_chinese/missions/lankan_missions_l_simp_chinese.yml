 lankan_missions_task_5:0 "泰米尔诸国的动荡"
 lankan_missions_task_5_DESC:0 "大陆上的邦国强大而人口众多。旷日持久的战争可能意味着可怕的灾难。我们应该召集我们最伟大的将军！\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 lankan_missions_task_6:0 "信任泰米尔人"
 lankan_missions_task_6_A_tooltip:0 "整合#Y 朱罗、般帝耶、掣罗#! 或#Y 泰米尔#! 文化。"
 lankan_missions_task_6_B_tooltip:0 "至少有10个属于#Y 城市#! 的领土是#Y 朱罗、般帝耶、掣罗#! 或#Y 泰米尔#! 文化。"
 lankan_missions_task_6_DESC:0 "我们和泰米尔人正在争夺南方的统治权，现在他们想居住在我们的城镇里。\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 lankan_missions_task_7:0 "般帝耶问题"
 lankan_missions_task_7_A_tooltip:0 "拥有所有 #Y 般帝耶#! 文化的省份。[SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_task_7_pandya_provinces_loc')]"
 lankan_missions_task_7_B_tooltip:0 "[mission_country.GetRuler.GetName]获得一个随机特性，有可能是#Y 般帝耶的血脉#!。"
 lankan_missions_task_7_DESC:0 "般帝耶人已被我们击败。为了安抚他们，也许我们可以证明我们的王朝的宽容？\n\n\n\n\n\n\n\n\n\n@india_mil8!"

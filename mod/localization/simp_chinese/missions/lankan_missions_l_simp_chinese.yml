l_simp_chinese:
 ambitious_lankan_raja:0 "雄心勃勃的楞伽罗阇"
 anuradhapura_kingdom:0 "阿㝹罗陀补罗王国"
 anuradhapuran_metropolis:0 "阿㝹罗陀补罗大都会"
 building_spree:0 "建设热潮"
 city_of_anuradhapura:0 "阿㝹罗陀补罗城"
 dravidian_cultural_unity:0 "达罗毗荼文化统一"
 glorious_gemstones:0 "灿烂的宝石"
 grand_lankan_builders:0 "宏伟的楞伽建设者"
 hellenistic_community:0 "希腊社区"
 house_of_buddhas_tooth:0 "佛牙舍利"
 indian_ocean_traders:0 "印度洋商人"
 jungle_elephants:0 "丛林大象"
 lankan_center_of_tamilakam:0 "泰米尔的楞伽中心"
 lankan_dominance:0 "楞伽的统治地位"
 lankan_missions:0 "般豆迦薄耶的遗产"
 lankan_missions_CRITERIA_DESCRIPTION:0 "当阿㝹罗陀补罗拥有达罗毗荼文化组的所有省份时，该使命完成。"
 lankan_missions_DESCRIPTION:0 "公元前367年，我们最伟大的国王般豆迦薄耶去世。在他统治期间，阿㝹罗陀补罗统治了整个楞伽，但现在，我们只是寻求统治该岛的竞争者之一。与此同时，在北方，麻烦正在酝酿。新建立的孔雀帝国看起来非常渴望权力。也许提婆南毗耶帝沙·毗阇耶（天爱帝须）王可以带领我们从过去的辉煌走向更辉煌的前路？"
 lankan_missions_event_3_loc_1:0 "适合种植谷物@grain!"
 lankan_missions_event_3_loc_2:0 "适合种植蔬菜@vegetables!"
 lankan_missions_event_3_loc_3:0 "适合饲养牲畜@cattle!。"
 lankan_missions_event_3_loc_4:0 "适合制糖@sugar!。"
 lankan_missions_reclamation:0 "毗阇耶的开垦"
 lankan_missions_reclamation_CRITERIA_DESCRIPTION:0 "当阿㝹罗陀补罗收回毗阇耶王朝祖先的土地时，该使命完成。"
 lankan_missions_reclamation_DESCRIPTION:0 "毗阇耶王子被放逐到南方。如果我们想证明自己有资格成为他的继承人，我们必须对那些敢于驱逐我们伟大王子的王国进行报复。"
 lankan_missions_reclamation_task_1:0 "向北推进"
 lankan_missions_reclamation_task_10:0 "楞伽贵族"
 lankan_missions_reclamation_task_10_A_tooltip:0 "在#Y [SCOPE.ScriptValue('lankan_reclamation_task_10_academy_total')|0]#! 和#Y $north_tambapamni_area$#! 省至少建有#Y $south_tambapamni_area$学院#!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_10_academy_loc')] [SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_10_construction_loc')]。"
 lankan_missions_reclamation_task_10_B_tooltip:0 "在#Y $north_tambapamni_area$#!和#Y $south_tambapamni_area$#!省份，至少有#Y [SCOPE.ScriptValue('lankan_reclamation_task_10_nobles_total')|0]#!人口是#Y 贵族#!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_10_nobles_loc')]"
 lankan_missions_reclamation_task_10_DESC:0 "最近的扩张为我们的贵族带来了许多机会，比如参与政治、教育和军事义务。他们似乎比以前更有效率，更快乐！\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 lankan_missions_reclamation_task_11:0 "进入民陀高原"
 lankan_missions_reclamation_task_11_DESC:0 "民陀高原一直是我们的首要目标。它是回到我们祖先旧地的必经之路。\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 lankan_missions_reclamation_task_12:0 "向般遮耶推进"
 lankan_missions_reclamation_task_12_A_tooltip:0 "任何拥有的省份都在#Y $pracya_region$#!的区域内。"
 lankan_missions_reclamation_task_12_DESC:0 "在毗阇耶王子的出生地之外是般遮耶地区。人们对这一地区知之甚少，只知道在它的中心流淌着恒河。如果我们希望成为整个印度的主人，就连这些最东部的省份也必须得到控制。\n\n\n\n\n\n\n\n\n\n@india_mil21!"
 lankan_missions_reclamation_task_12_tooltip:0 "获得对#Y $pracya_region$#!地区的宣称。"
 lankan_missions_reclamation_task_13:0 "重新宣称我们的传承"
 lankan_missions_reclamation_task_13_DESC:0 "罗多提娑被认为是我们伟大的王子毗阇耶的出生地。夺回它是我们的责任，也是我们的荣誉。\n\n\n\n\n\n\n\n\n\n@india_mil22!"
 lankan_missions_reclamation_task_13_tooltip:0 "获得选项，拥抱#Y 僧诃补罗的传承#!。"
 lankan_missions_reclamation_task_14:0 "般遮耶之力"
 lankan_missions_reclamation_task_14_DESC:0 "般遮耶是一块富饶而人口众多的土地。有了它，我们的国库会无比充盈，使我们能召集更多军队。\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 lankan_missions_reclamation_task_15:0 "佛牙舍利"
 lankan_missions_reclamation_task_15_DESC:0 "佛陀是佛教信仰中最重要的。有了他的牙齿舍利，我们就能以所有佛教徒的保护者的形象示人。\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 lankan_missions_reclamation_task_16:0 "印度洋贸易"
 lankan_missions_reclamation_task_16_DESC:0 "印度洋沿岸的每一个重要港口都在阿㝹罗陀补罗手中。对印度商品的垄断肯定会让我们在国际贸易中受益。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 lankan_missions_reclamation_task_16_tooltip:0 "#Y [mission_country.GetName]#! 拥有#R 军略#!@military_icon!革新#Y 季风航行#!。"
 lankan_missions_reclamation_task_17:0 "不干涉政策"
 lankan_missions_reclamation_task_17_A_tooltip:0 "将启用以下能力：#Y 劫掠奴隶#!。"
 lankan_missions_reclamation_task_17_DESC:0 "阿㝹罗陀补罗主宰着整个印度南部。这片土地给我们带来了许多财富，现在我们的贸易对我们的生存和发展已经不那么重要了。尽管我们周围海域的海盗活动猖獗，但我们不会干涉。毕竟，一定的危险会让竞争远离我们。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 lankan_missions_reclamation_task_18:0 "丛林大象"
 lankan_missions_reclamation_task_18_A_tooltip:0 "#Y $vindhyaprstha_region$#!中#Y [SCOPE.GetRootScope.GetCountry.GetName]#!所拥有的领地至少生产#Y [SCOPE.ScriptValue('lankan_reclamation_task_18_elephant_total')|0]#!#Y 大象#!@elephants!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_18_elephant_loc')]"
 lankan_missions_reclamation_task_18_DESC:0 "象兵一直是我们军事传统的一部分。在我们的领土上有广袤的丛林，使我们有更多的品种可供选择，因此，里面一定有更好的。 \n\n\n\n\n\n\n\n\n\n@india_mil19!"
 lankan_missions_reclamation_task_19:0 "突击阿槃提"
 lankan_missions_reclamation_task_19_DESC:0 "阿槃提位于印度的正中央。把它置于我们的控制之下将为我们开辟许多新的扩张方向。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 lankan_missions_reclamation_task_19_tooltip:0 "获得对#Y 阿槃提#!地区的宣称。"
 lankan_missions_reclamation_task_1_DESC:0 "我们已经击败了泰米尔人，但在达罗毗荼和羯那多仍有一些抵抗势力，我们必须确保边境安全。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 lankan_missions_reclamation_task_1_tooltip:0 "获得对#Y $dravida_region$#! 和#Y $karnata_region$#!地区的宣称。"
 lankan_missions_reclamation_task_2:0 "巩固南方"
 lankan_missions_reclamation_task_20:0 "干涉摩柁提娑"
 lankan_missions_reclamation_task_20_DESC:0 "摩柁提娑位于印度最北部，靠近兴都库什山。群山将为我们提供天然的边界和堡垒。 \n\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 lankan_missions_reclamation_task_20_tooltip:0 "获得对#Y 摩柁提娑#!地区的宣称。"
 lankan_missions_reclamation_task_21:0 "楞伽摩柁提娑"
 lankan_missions_reclamation_task_21_DESC:0 "获得摩柁提娑将极大地确保我们北部边境的安全，并开辟新的贸易路线。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 lankan_missions_reclamation_task_22:0 "阿槃提的发展"
 lankan_missions_reclamation_task_22_DESC:0 "阿槃提是印度的核心省份之一，目前在我们的控制之下。赞美这么一片繁荣的土地，我们只会变得越来越富有。\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 lankan_missions_reclamation_task_23:0 "印度之主"
 lankan_missions_reclamation_task_23_DESC:0 "一个统一的印度一直是我们的梦想。孔雀曾接近成功，但最终失败。我们不会失败。我们将在阿㝹罗陀补罗的统治下统一印度，不断扩大我们超乎想象的财富和知识。\n\n\n\n\n\n\n\n\n\n@india_mil2!"
 lankan_missions_reclamation_task_24:0 "般遮耶的丝绸"
 lankan_missions_reclamation_task_24_A_tooltip:0 "在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!控制的#Y $pracya_region$#!区域，至少生产#Y [SCOPE.ScriptValue('lankan_reclamation_task_24_silk_total')|0]#!#Y 丝绸#!@silk!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_24_silk_loc')]"
 lankan_missions_reclamation_task_24_DESC:0 "这东西卖得这么好，我们可以商道命名为丝绸之路！已经有人这么做了吗？\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 lankan_missions_reclamation_task_25:0 "印度的粮仓"
 lankan_missions_reclamation_task_25_A_tooltip:0 "至少有#Y [SCOPE.ScriptValue('lankan_reclamation_task_25_food_total')|0]#! #Y 谷物#!@grain!或#Y 蔬菜#!@vegetables!在#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有的领土上生产，在#Y $avanti_region$#! 和#Y $madhyadesa_region$#!地区。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_25_food_loc')]"
 lankan_missions_reclamation_task_25_DESC:0 "阿槃提地区一直是印度粮食的主要供应地。有了它，我们可以确保我们的民众不会再挨饿。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 lankan_missions_reclamation_task_2_DESC:0 "占领之后是巩固这一地区。统一印度南部的众多民族是我们的首要任务。我们仍有很多东西要学，尤其是在军略方面。\n\n\n\n\n\n\n\n\n\n@india_mil16!"
 lankan_missions_reclamation_task_3:0 "主宰达罗毗荼"
 lankan_missions_reclamation_task_3_A_tooltip:0 "任何已整合文化都属于#Y 达罗毗荼#! 文化组。"
 lankan_missions_reclamation_task_3_DESC:0 "关于达罗毗荼的争论已经结束，我们证明了自己的成功。没有人敢质疑我们的统治。\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 lankan_missions_reclamation_task_3_tooltip:0 "拥有#Y 达罗毗荼#! 文化组的所有省份。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_3_dravidian_provinces_loc')]"
 lankan_missions_reclamation_task_4:0 "同化泰米尔人"
 lankan_missions_reclamation_task_4_DESC:0 "对泰米尔人的战争既耗时又乏味。为了防止他们再次造反，我们必须在文化上同化我们的人民。\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 lankan_missions_reclamation_task_4_tooltip:0 "至少有#Y 80%#!的#Y [SCOPE.ScriptValue('lankan_reclamation_task_4_absolute_total_pop_value')|0]#!在#Y $dravida_region$#!和#Y $karnata_region$#! 所拥有的#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 和 #Y [SCOPE.GetRootScope.GetCountry.GetReligion.GetName]#!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_4_lankan_pop_total_loc')]"
 lankan_missions_reclamation_task_5:0 "楞伽的建设"
 lankan_missions_reclamation_task_5_DESC:0 "新吞并的领土有着许多大城市。但是战争给它们带来了很多破坏。我们将召集我们最伟大的建筑师来重建它们。\n\n\n\n\n\n\n\n\n\n@india_por2!"
 lankan_missions_reclamation_task_5_tooltip:0 "在#Y $dravida_region$#!，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('lankan_reclamation_task_5_buildings_total')|0]#!个建筑。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_5_dravida_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_5_dravida_construction_loc')]"
 lankan_missions_reclamation_task_6:0 "楞伽的贸易"
 lankan_missions_reclamation_task_6_B_tooltip:0 "在#Y $dravida_region$#!、#Y $karnata_region$#!、#Y $vindhyaprstha_region$#! 和#Y $aparanta_region$#! 地区的所有省份都没有#Y 海盗避难港#! 的修正。"
 lankan_missions_reclamation_task_6_DESC:0 "虽然我们可以统治陆地，但我们在海上仍有敌人。各国可恶的海盗和商人企图篡夺我们的贸易。如果我们真想称王称霸，我们也必须征服海洋。\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 lankan_missions_reclamation_task_6_tooltip:0 "在#Y $dravida_region$#!和#Y $karnata_region$#!，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少拥有#Y [SCOPE.ScriptValue('lankan_reclamation_task_6_ports_total')|0]#!有港口的领地。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_6_dravida_ports_loc')][SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_6_dravida_construction_loc')]"
 lankan_missions_reclamation_task_7:0 "世界渴望之城"
 lankan_missions_reclamation_task_7_DESC:0 "我们的首都真的是一个充满奇迹的杰作。游客从四面八方来参观我们伟大的城市。让我们向世界展示，我们已经变得多么令人印象深刻。\n\n\n\n\n\n\n\n\n\n@india_por2!"
 lankan_missions_reclamation_task_8:0 "食糖贸易"
 lankan_missions_reclamation_task_8_A_tooltip:0 "#Y [mission_country.GetName]#! 进口#Y 糖#!。"
 lankan_missions_reclamation_task_8_B_tooltip:0 "任何拥有的省份都生产#Y 糖#!。"
 lankan_missions_reclamation_task_8_C_tooltip:0 "选择一个省，开始生产#Y 糖#!@sugar!。"
 lankan_missions_reclamation_task_8_DESC:0 "我们的蔗糖种植园似乎不再足够了。我们必须扩大对它的培育。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 lankan_missions_reclamation_task_9:0 "岛屿天堂"
 lankan_missions_reclamation_task_9_A_tooltip:0 "在#Y $north_tambapamni_area$#!和#Y $south_tambapamni_area$#!中至少有#Y [SCOPE.ScriptValue('lankan_reclamation_task_9_island_pops_total')|0]#!人口是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!且#Y [SCOPE.GetRootScope.GetCountry.GetReligion.GetName]#!。[SCOPE.GetRootScope.GetCountry.Custom('lankan_reclamation_task_9_island_pops_loc')]"
 lankan_missions_reclamation_task_9_B_tooltip:0 "在#Y [SCOPE.ScriptValue('lankan_reclamation_task_9_metropolis_total')|0]#! 和#Y $north_tambapamni_area$#! 省至少有#Y $south_tambapamni_area$#! 个领土是#Y 都会#!。"
 lankan_missions_reclamation_task_9_DESC:0 "楞伽的成长没有止境。岛上人口众多，城市众多。美丽的风景随处可见。有些人甚至称我们的岛屿为文明的巅峰。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 lankan_missions_task_1:0 "阿㝹罗陀补罗王国"
 lankan_missions_task_10:0 "整合掣罗"
 lankan_missions_task_10_A_tooltip:0 "拥有#Y 掣罗#! 文化的所有领土。[SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_task_10_cheran_provinces_loc')]"
 lankan_missions_task_10_B_tooltip:0 "[mission_country.GetRuler.GetName]有机会获得#Y 掣罗的血脉#!。"
 lankan_missions_task_10_DESC:0 "掣罗人被攻灭后，我们身旁的敌人又少了一个，可以高枕无忧了。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 lankan_missions_task_10_cheran_provinces_loc_1:0 "(#R [SCOPE.ScriptValue('lankan_missions_task_10_owned_cheran_provinces_current')|0]#!/#Y [SCOPE.ScriptValue('lankan_missions_task_10_owned_cheran_provinces_total')|0]#!)"
 lankan_missions_task_10_cheran_provinces_loc_2:0 "(#Y [SCOPE.ScriptValue('lankan_missions_task_10_owned_cheran_provinces_current')|0]#!/#Y [SCOPE.ScriptValue('lankan_missions_task_10_owned_cheran_provinces_total')|0]#!)"
 lankan_missions_task_13:0 "进口食物"
 lankan_missions_task_13_A_tooltip:0 "在#Y [SCOPE.ScriptValue('lankan_missions_task_13_trade_goods_total')|0]#! 中至少有#Y [GetProvince('(int32)6950').GetArea.GetName]#!种贸易品。#Y 谷物#!@grain!, #Y 蔬菜#!@vegetables!, #Y 鱼#!@fish!, 和#Y 牲畜#!@cattle! [SCOPE.GetRootScope.GetCountry.Custom('lankan_missions_task_13_trade_goods_loc')]。"
 lankan_missions_task_13_DESC:0 "我们的人口增长很快，但我们当地的资源似乎跟不上人口的增长了。或许我们可以从印度大陆进口更多？\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 lankan_missions_task_13_tooltip:0 "选择一个贸易品，将所选地区改为"
 lankan_missions_task_13_trade_goods_loc_1:0 "(#R [SCOPE.ScriptValue('lankan_missions_task_13_trade_goods_current')|0]#!/#Y [SCOPE.ScriptValue('lankan_missions_task_13_trade_goods_total')|0]#!)"
 lankan_missions_task_13_trade_goods_loc_2:0 "(#Y [SCOPE.ScriptValue('lankan_missions_task_13_trade_goods_current')|0]#!/#Y [SCOPE.ScriptValue('lankan_missions_task_13_trade_goods_total')|0]#!)"
 lankan_missions_task_14:0 "当地的食物来源"
 lankan_missions_task_14_DESC:0 "构建我们自力更生的能力对阿㝹罗陀补罗的成功至关重要。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 lankan_missions_task_14_tooltip:0 "选择一个领地成为#Y 主要的楞伽食品供应地#!。"
 lankan_missions_task_15:0 "阿㝹罗陀补罗之城"
 lankan_missions_task_15_DESC:0 "我们的城镇发展很快。所有的楞伽人都应该知道我们荣耀的阿㝹罗陀补罗城！\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 lankan_missions_task_16:0 "楞伽的香料"
 lankan_missions_task_16_DESC:0 "我们的香料一直吸引着来自世界各地的许多商人。我们应该扩大供货范围。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 lankan_missions_task_17:0 "灿烂的宝石"
 lankan_missions_task_17_DESC:0 "大山深处埋藏着许多财富。如果我们能找到它们，我们的金库将永不枯竭！\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 lankan_missions_task_17_tooltip:0 "#Y $north_tambapamni_area$#!和#Y $south_tambapamni_area$#!省份中，至少#Y 2#!块领土正在生产至少#Y 2宝石#!@gems!。"
 lankan_missions_task_18:0 "国家投资"
 lankan_missions_task_18_A_tooltip:0 " #Y $north_tambapamni_area$#! 省至少有任意两种不同的 #Y 省份投资#! 。"
 lankan_missions_task_18_B_tooltip:0 " #Y $south_tambapamni_area$#! 省至少有任意两种不同的 #Y 省份投资#! 。"
 lankan_missions_task_18_DESC:0 "如果我们希望与印度的其他大国竞争，我们必须扩建基础设施。\n\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 lankan_missions_task_19:0 "发展阿㝹罗陀补罗"
 lankan_missions_task_19_DESC:0 "我们王国的荣耀事迹传遍四方。越来越多的人将移居到我们的城市！\n\n\n\n\n\n\n\n\n\n@india_por1!"
 lankan_missions_task_1_DESC:0 "我们现在的王国只是从前的残存。我们必须夺回曾经属于我们的东西！ \n\n\n\n\n\n\n\n\n\n@india_por2!"
 lankan_missions_task_1_tooltip:0 "获得对#Y 南担罗跋魔#!省的宣称。"
 lankan_missions_task_2:0 "鲁呼奴的疑虑"
 lankan_missions_task_20:0 "法阿育王"
 lankan_missions_task_20_A_tooltip:0 "#Y 阿输迦 孔雀#! 是  #Y 孔雀#! 的 #T 罗阇#! "
 lankan_missions_task_20_B_tooltip:0 "#Y [GetCountry('ANU').GetRuler.GetName]#! 将试图结交[GetCharacter('(int32)66').GetName]。"
 lankan_missions_task_20_DESC:0 "孔雀的罗阇阿育王拥有世界上所有的权力。与他为友无疑会让我们从这种力量中获益。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 lankan_missions_task_21:0 "摩哂陀"
 lankan_missions_task_21_A_tooltip:0 "#Y 摩哂陀#! 将抵达#Y 阿㝹罗陀补罗#! 并试图在我们的土地上传播他的佛教教义!"
 lankan_missions_task_21_DESC:0 "我们的外交官谈到了北方的一种新宗教。也许我们可以在阿㝹罗陀补罗这儿，安排一次说法？\n\n\n\n\n\n\n\n\n\n\n@event_pic5!"
 lankan_missions_task_22:0 "种下神圣的大菩提树"
 lankan_missions_task_22_A_tooltip:0 "挑选一个省份来种植#Y 神圣的大菩提#!。"
 lankan_missions_task_22_DESC:0 "佛陀开悟时坐在菩提伽耶的大菩提树下。许多佛教僧人远道而来只为能在它面前呼吸。如果我们能够种下我们自己的大菩提树，我们就能在佛教教团中建立起强大的地位，并加强我们通往觉悟的精神纽带。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 lankan_missions_task_2_A_tooltip:0 "#Y [GetCountry('RHN').GetName]#! 可能会成为#Y 藩属#!。"
 lankan_missions_task_2_DESC:0 "鲁呼奴人以前是我们的朋友，也许我们可以说服他们加入我们的伟大事业？\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 lankan_missions_task_2_tooltip:0 "#Y [mission_country.GetRuler.GetName]#! 是 #Y [GetCountry('RHN').GetRuler.GetName]#! 的朋友或者 [GetCountry('RHN').GetName] 对 #Y [mission_country.GetName]#! 的好感度不低于 #Y 75#! 。"
 lankan_missions_task_3:0 "主宰摩罗耶"
 lankan_missions_task_3_DESC:0 "在我们的西南方是摩罗耶人。他们背信弃义，不可信任。我们必须迅速出击！\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 lankan_missions_task_4:0 "统一楞伽"
 lankan_missions_task_4_DESC:0 "鲁呼奴和摩罗耶已在我们的掌控之下，和平将最终降临楞伽。\n\n\n\n\n\n\n\n\n\n@india_mil13!"

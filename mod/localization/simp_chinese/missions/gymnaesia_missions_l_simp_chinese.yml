l_simp_chinese:
 fortified_ports:0 "强化的港口"
 gymnaesian_breadbasket:0 "具姆奈西亚粮仓"
 gymnaesian_influence:0 "具姆奈西亚的影响"
 gymnaesian_mission_01:0 "巴利阿里群岛"
 gymnaesian_mission_01_BUTTON_TOOLTIP:0 "我们的敌人无视我们的存在，他们将面临危险..."
 gymnaesian_mission_01_CRITERIA_DESCRIPTION:0 "一旦巴利阿里群岛的居民在附近的岛屿上建立起海军霸权，任务将被视为完成。"
 gymnaesian_mission_01_DESCRIPTION:0 "巴利阿里群岛，我们的人民称之为家园的岛屿，远离破坏东地中海的动乱和战争；偶尔，我们从过往的商人那里听到这些灾难的消息，感谢诸神，这些灾难至今都避开了我们的家园。虽然我们的岛屿被视为一个沉睡的落后地区，几乎不值得注意，但这并不意味着我们没有自己的野心。"
 gymnaesian_mission_01_task_01:0 "巴利阿里群岛的王权"
 gymnaesian_mission_01_task_01_DESC:0 "我们，作为一个民族，已经走过了很长的路，我们的这种变化最好用政府的变化来体现。我们的人民不希望被地方官统治，而是希望有一个国王。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 gymnaesian_mission_01_task_02:0 "第一步"
 gymnaesian_mission_01_task_02_DESC:0 "我们在首都[GetProvince('(int32)1464').GetName]以西发现了一个小岛，它似乎是某个大国的附庸。也许当他们的统治者被战争所困扰时，我们可以迅速吞并他们的土地......\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 gymnaesian_mission_01_task_03:0 "伊巴西姆的征服"
 gymnaesian_mission_01_task_03_DESC:0 "我们收到报告，[GetProvince('(int32)3256').GetArea.GetName]现在已经卷入了一场战争--我们必须在他们的军队被占领时迅速行动！。我们需要每一个我们能确保的优势。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 gymnaesian_mission_01_task_04:0 "具姆奈西亚的海军"
 gymnaesian_mission_01_task_04_DESC:0 "在看到拥有一支强大的船队的好处后，如果我们希望成功地将我们的部队登陆到敌人的土地上，我们也必须扩大我们的海军。此外，扩大我们的海军能力将带来公民利益，所以我们更应该开始行动。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 gymnaesian_mission_01_task_04_tt:0 "拥有一支至少12艘船的海军"
 gymnaesian_mission_01_task_05:0 "帕尔马市"
 gymnaesian_mission_01_task_05_DESC:0 "虽然我们当然为我们的首都[GetProvince('(int32)1465').GetName]感到自豪，但知道我们的祖先在建立第一批住宅时选择了明智的方式，我们应该考虑升级我们的基础设施。值得庆幸的是，有许多我们熟悉的建筑风格；让我们用更持久的东西来取代我们的木质结构。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 gymnaesian_mission_01_task_06:0 "东方远征"
 gymnaesian_mission_01_task_06_DESC:0 "准备好我们的定居者；我们要把他们送到[GetProvince('(int32)3515').GetArea.GetName]，希望为他们和我们的人民建立新的生活。我们的人民是多么的勇敢，离开了安全的家园，来到了遥远的海岸!\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 gymnaesian_mission_01_task_07:0 "海盗的生活"
 gymnaesian_mission_01_task_07_DESC:0 "用武力夺取东西没有什么不光彩的，毕竟强权就是真理。现在我们有了一支庞大的海军和一位称职的指挥官，我们可以开始袭击我们的邻居了。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 gymnaesian_mission_01_task_07_tt:0 "拥有一支至少35艘船的海军和一名武功水平至少为10的指挥官。"
 gymnaesian_mission_01_task_07_tt_a:0 "#Y 奴隶掠夺#!能力将被启用。"
 gymnaesian_mission_01_task_08:0 "伊巴希姆之城"
 gymnaesian_mission_01_task_08_DESC:0 "在从布匿地方势力手中征服了[GetProvince('(int32)1464').GetName]之后，我们必须重新建设这个岛屿，改善基础设施，以便更快地整合我们的新人口。我们对伊巴辛市有一个宏伟的愿景......\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 gymnaesian_mission_01_task_09:0 "在科西嘉岛的扩张"
 gymnaesian_mission_01_task_09_DESC:0 "我们东部的[GetProvince('(int32)3515').GetArea.GetName]的整个岛屿将是我们领域的一个不可思议的补充；它比我们的祖国大得多，有大量的自然资源，我们非常渴望得到。那里甚至还有一些城市，比如[GetProvince('(int32)3515').GetName]，总有一天我们会很快拥有这些城市。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 gymnaesian_mission_01_task_10:0 "拥抱海盗行为"
 gymnaesian_mission_01_task_10_DESC:0 "长期以来，[GetProvince('(int32)1469').GetName]的海盗们肆无忌惮地袭击着撒耳多姆海沿岸——在这些私掠者面前，没有人是安全的，甚至是我们自己的人民。然而......也许我们可以拥抱他们，而不是把他们从岛上驱逐出去？这些海盗都是很有见识的人，他们在这个地区做了很长时间的贸易，绝对可以教我们一两件事情。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 gymnaesian_mission_01_task_11:0 "岛屿天堂"
 gymnaesian_mission_01_task_11_DESC:0 "人们普遍认为，我们的家园是人们希望看到的最美丽的地方之一；确实，我们生活在一个岛屿天堂。对我们来说，改善我们在岛上的财产是有好处的；如果我们只是增加建筑物的数量，我们完全有信心，我们的声誉将继续增长。\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 gymnaesian_mission_01_task_12:0 "巩固科西嘉"
 gymnaesian_mission_01_task_12_DESC:0 "现在我们已经在[GetProvince('(int32)3515').GetArea.GetName]上实现了所有的殖民化，我们应该考虑征服[GetProvince('(int32)3504').GetArea.GetName]的剩余领土。但这些土地在强国之间有激烈的争夺，使我们的计划变得复杂。没有人说这是一个简单的任务，但预兆是有利的......\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 gymnaesian_mission_01_task_13:0 "强化港口"
 gymnaesian_mission_01_task_13_DESC:0 "既然我们已将这些城市纳入版图，明智之举便是加固这些港口，使其成为抵御敌人的坚固屏障——那些心怀嫉妒之敌正虎视眈眈，企图从我们手中夺走胜利果实。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 gymnaesian_mission_01_task_14:0 "撒丁岛的胜利"
 gymnaesian_mission_01_task_14_DESC:0 "现在我们已经控制了[GetProvince('(int32)3515').GetArea.GetName]岛，并在[GetProvince('(int32)3483').GetArea.GetName]完成了扫荡抵抗，我们像渔夫撒网一样，投下饥饿的目光，在海上搜寻我们下一个征服的目标。只有上帝才知道我们下一步将驶向哪里!\n\n\n\n\n\n\n\n\n\n\n@egypt_mil18!"
 gymnaesian_mission_01_task_15:0 "剩余的木材"
 gymnaesian_mission_01_task_15_DESC:0 "我们能够将我们的力量投射到国外，因为我们的船队，这使得拥有木材供应成为我们最关键的需求之一。我们的未来要求我们进口足够的木材以确保我们的海军有稳定的供应。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 gymnaesian_mission_01_task_15_tt:0 "巴利阿里德省至少需要进口1根木材和1根雪松。"
 gymnaesian_mission_01_task_16:0 "发挥我们的影响力"
 gymnaesian_mission_01_task_16_DESC:0 "从我们在[ROOT.GetCountry.GetCapital.GetName]的视角来看，我们看到的是一个渴望我们影响力的世间，它正迫切地呼唤着我们的存在。让我们尽一切努力，打造一个将成为[ROOT.GetCountry.GetAdjective]一切事物之灯塔的岛国大都会。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 gymnaesian_mission_01_task_17:0 "地中海粮仓"
 gymnaesian_mission_01_task_17_DESC:0 "虽然我们在[GetProvince('(int32)1466').GetName]拥有肥沃的田地，但我们家乡岛屿上的农田并不能提供足够的食物，我们必须采取措施，发展我们海外属地的一些农业。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 gymnaesian_piracy:0 "具姆奈西亚的海盗"
 gymnaesian_pirate_haven:0 "被拥抱的海盗天堂"
 island_paradise:0 "岛屿天堂"
 king_of_gymnaesia:0 "具姆奈西亚之王"
 me_gymnaesian_1.a:0 "[ROOT.GetCountry.GetRuler.GetName]万岁！"
 me_gymnaesian_10.a:0 "升起海盗的旗帜......"
 me_gymnaesian_10_desc:0 "对我们的邻居来说，这真是一个黑色的日子，因为我们收到消息，我们的海军已经足够大，可以开始袭击附近的港口了。不久之后，所有的人都将惧怕我们，希望永远不要被我们的突袭船在地平线上航行的景象惊醒!告诉弟兄们，他们可以带走任何东西和所有能带走的东西！"
 me_gymnaesian_10_title:0 "海军突袭"
 me_gymnaesian_10_tt:0 "#Y 奴隶掠夺#!能力将被启用。"
 me_gymnaesian_11.a:0 "众神照顾他们自己"
 me_gymnaesian_11_desc:0 "虽然建设[GetProvince('(int32)1464').GetName]需要大量的费用，但我们终于被告知，建设举措已经接近尾声了。当地人对我们所取得的成就感激不尽，他们热切地接受了我们的方式，希望成为我们文化的正式参与者。今天早上有很多值得庆祝的事情，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_gymnaesian_11_title:0 "伊巴斯姆"
 me_gymnaesian_12.a:0 "这很好，但我们想要的是整个科西嘉……"
 me_gymnaesian_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您会很高兴听到，我们前往科西嘉的远征正在蓬勃发展。即便现在，我们的农民也在耕作土地，缓慢却坚定地把荒野变为良田；他们送回本土的税款也相当可观。我们毫不怀疑，几年之后，再也没有人能够分辨我们的新殖民地和既有城市有何区别。"
 me_gymnaesian_12_title:0 "科西嘉人的扩张"
 me_gymnaesian_13.a:0 "对我来说，这就是海盗的生活......"
 me_gymnaesian_13_desc:0 "我们最近结束了与居住在[GetProvince('(int32)1469').GetName]岛上的海盗们的谈判。我们并没有花很长时间来说服他们相信我们所提出的建议是明智的，因为海盗们似乎都很想接受我们的外交姿态--不错。他们无疑意识到，与我们合作符合他们的最大利益，因为我们有很多东西可以相互学习。"
 me_gymnaesian_13_title:0 "黑衣人和旅人"
 me_gymnaesian_14.a:0 "没有什么地方是我们最愿意去的"
 me_gymnaesian_14_desc:0 "有些人住在山洞里，被大自然残酷的暴怒冲击着，还有一些人在沙漠中安家，为几滴水而绝望。然而，我们的人民生活在天堂；温和的微风、温暖的水和丰富的食物是我们永恒的伴侣。我们从世界各地进口最好的商品，来自远方的旅行者来到我们的港口，惊叹于我们所创造的一切。"
 me_gymnaesian_14_title:0 "一个岛屿的天堂"
 me_gymnaesian_15.a:0 "梦想夺取我们港口的敌人有祸了"
 me_gymnaesian_15_desc:0 "我们的海军是我们力量的源泉；夺走我们的舰队就等于夺走我们的力量。意识到我们成功的关键在于拥有足够的海军力量，[ROOT.GetCountry.GetRuler.GetName]下令打开国库，对我们港口的基础设施进行全面检查。我们不希望被敌人打草惊蛇，确保我们的水路安全将确保这种灾难永远不会发生。我们加强的港口将成为我们未来荣耀的基础！"
 me_gymnaesian_15_title:0 "坚固的港口"
 me_gymnaesian_16.a:0 "完全按照我们的计划！"
 me_gymnaesian_16_desc:0 "当我们第一次着手征服撒丁岛时，我们很清楚等待我们的可能性，边境的扩张和新的贸易机会是我们的主要动力。然而，谁能预料到我们将聚集的财富？贸易在[GetProvince('(int32)1465').GetName]简直是爆炸性的增长，因为越来越多的税收和贡品回到了我们的首都。撒丁岛的财富超过了我们最贪婪的期望......也许还有其他岛屿我们可以拿下。"
 me_gymnaesian_16_title:0 "撒丁岛的胜利"
 me_gymnaesian_17.a:0 "我们很高兴知道我们有国外的朋友"
 me_gymnaesian_17_desc:0 "考虑到我们船队的相对重要性，不幸的是我们的木材匮乏；我们的岛屿根本无法种植足够的树木来供应我们繁忙的船工。值得庆幸的是，我们已经从那些得天独厚的人那里获得了源源不断的木材和雪松--愿这些经济纽带发展成更大的友谊。"
 me_gymnaesian_17_title:0 "丰富的木材"
 me_gymnaesian_18.a:0 "远远地，我们将传播我们的具姆奈西亚方式"
 me_gymnaesian_18_desc:0 "虽然有许多文明遍布#E 地中海#!，但我们具姆奈西亚人真正相信，我们的文化提供了其他国家所没有的东西。值得庆幸的是，现在我们已经在[GetProvince('(int32)1465').GetName]建造了一个宏伟的城市，一个可以与东方国王和将军的首都相媲美的城市，我们已经准备好将[ROOT.GetCountry.GetName]的文明之光带到海洋的各个角落。"
 me_gymnaesian_18_title:0 "发挥我们的影响力"
 me_gymnaesian_19.a:0 "想到这里，我的口水都快流出来了……"
 me_gymnaesian_19_desc:0 "参观我们在[GetProvince('(int32)3497').GetArea.GetName]的产业的外国人经常说，他们在踏入我们的港口之前，就能闻到我们生产的[ROOT.GetCountry.GetAdjective]炉子里新鲜出炉的味道。通过命令在整个撒丁岛建立农业定居点，[ROOT.GetCountry.GetRuler.GetName]确保我们所有的人都吃得饱饱的，这赢得了[ROOT.GetCountry.GetRuler.GetHerHim]老百姓不灭的爱。旅行者，下次你在这个地区的时候，我们鼓励你参观我们的面包店，亲自品尝一些面包，你会发现这是你曾经有幸吃过的最好的面包。"
 me_gymnaesian_19_title:0 "地中海粮仓"
 me_gymnaesian_1_desc:0 "这一天终于来临了，这一天似乎很遥远，遥远到可以被误认为是一场梦；我们的君主[ROOT.GetCountry.GetRuler.GetName]登基，成为光荣的巴利阿里德王国的新统治者。在经历了无数年的部落联盟之后，我们决定用王冠来奖励[ROOT.GetCountry.GetRuler.GetFirstName]，他对我们目前的状况负有最大责任。我们将不再被行政长官和长老会所统治，但我们终于有了一个真正的君主来指导我们。\n\n加冕仪式不遗余力，因为最好的葡萄酒和豪华食品都是从国外进口的，补充了我们人民的传统菜肴。在银质和象牙的轿子上，[ROOT.GetCountry.GetRuler.GetFirstName]在[ROOT.GetCountry.GetCapital.GetName]的街道上游行，向希望瞥见皇家队伍的聚集人群赠送金币礼物。宴会和庆祝活动将持续到晚上，甚至可能持续到凌晨。这是一个值得我们的同胞永远记住的日子！"
 me_gymnaesian_1_title:0 "巴利阿里群岛的王权"
 me_gymnaesian_2.a:0 "召集部落首领"
 me_gymnaesian_2_desc:0 "我们在首都西边发现了一个小附庸岛国；我们不知道他们被奴役了多久，但这对我们来说并不重要。但我们肯定比他们的宗主更接近他们，这给了我们一个优势；如果我们在一个战略时机出击，我们可以在他们的主人发现之前迅速吞并他们。"
 me_gymnaesian_2_title:0 "第一步"
 me_gymnaesian_3.a:0 "我们必须做好准备！"
 me_gymnaesian_3_desc:0 "经过庄严的讨论，其中提出了许多激烈的争论，部落领袖们已经做出了决定，不会再有退路。虽然长老们意见不一，但还是[ROOT.GetCountry.GetRuler.GetName]投了决定性的一票，他雄辩地代表了必须做的事。是恐惧引导着我们的手，因为我们看到我们的邻居是如何成为一个遥远的力量的奴隶的，我们不希望成为一些外国领主的奴隶。为了保护我们的未来，我们必须赶走这些敌人，免得我们成为下一个倒下的人。\n\n出其不意的因素将是我们最大的盟友。一旦我们的岛国邻居被卷入战争，我们将对其进行打击。"
 me_gymnaesian_3_title:0 "最初的征服"
 me_gymnaesian_4.a:0 "我们在一个月内出击"
 me_gymnaesian_4_desc:0 "看来迦太基人已经卷入了一场战争。如果我们现在能在他们被占领的时候出击，我们就有希望在他们注意到之前吞并他们的附庸。虽然我们对做出如此大胆的行动感到焦虑，尤其是当我们考虑到激怒迦太基的潜在影响时，这可能是我们唯一的机会。"
 me_gymnaesian_4_title:0 "时间越来越近了"
 me_gymnaesian_5.a:0 "开战!"
 me_gymnaesian_5_desc:0 "经过几周的紧张准备，一切都已就绪。我们已经准备好了我们的部落军团，他们每天都在练习他们的战斗队形，我们已经尽我们最大的能力准备好我们的海军。即使是现在，我们的船只也正在装满像食品一样的物资，在[ROOT.GetCountry.GetRuler.GetName]发出舰队应该上船的命令之前，这只是一个时间问题。准备好自己，因为现在是出击的时候。\n\n我们不会提前向[GetProvince('(int32)3256').GetOwner.GetName]发送消息，他们会因为分心而无法前来援助......很快，所有人都会知道我们做了什么。"
 me_gymnaesian_5_title:0 "伊巴辛的征服"
 me_gymnaesian_6.a:0 "我们不会抱怨这种转折"
 me_gymnaesian_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了我们的海军指挥官的报告，一份你会觉得很高兴的报告。看来，由于我们花了时间和金钱来升级我们的舰队，我们的工程师已经掌握了一些建筑技术，我们可以在我们的王国里应用。这真是我们的幸运日！"
 me_gymnaesian_6_title:0 "具姆奈西亚的海军"
 me_gymnaesian_7.a:0 "帕尔马是一座城市的完美地点；做得好。"
 me_gymnaesian_7_desc:0 "[GetProvince('(int32)1465').GetName]连绵起伏的山丘曾经是散落的小屋和茅屋的家园，但昔日为我们的祖先遮风挡雨的简易帐篷和窝棚现在已经成为一种褪色的记忆，成为我们力量仍在增长的时代的遗物。在[ROOT.GetCountry.GetRuler.GetName]的公民愿景指导下，帕尔马定居点已被一座宏伟的城市所取代，他要求在实现[ROOT.GetCountry.GetRuler.GetHerHis]计划时不考虑成本。用不了多久，我们新升级的首都的荣耀就会远近闻名。"
 me_gymnaesian_7_title:0 "帕尔马市"
 me_gymnaesian_8.a:0 "带着我们的祝福送他们前去。"
 me_gymnaesian_8_desc:0 "时候已经到了，我们该让定居者准备东行，前往科西嘉岛。斥候报告说，岛上还有其他已被占据的领土；虽然岛屿东岸尚无人宣称，我们仍必须小心不要越界。无需军事天才也能预见，我们或许不得不为保护殖民者而战，但我们永远会保护自己人。"
 me_gymnaesian_8_title:0 "向东方的远征"
 me_gymnaesian_9.a:0 "难道还有人怀疑我们会获胜吗？"
 me_gymnaesian_9_desc:0 "哦，[ROOT.GetCountry.GetRuler.GetName]，看来我们的殖民努力已经取得成功。多亏您的杰出领导，我们如今拥有了一处能够自给自足的定居点，许多人民都希望航向这片新土地，为自己开始新生活。用不了多久，这些岛屿的居民就会和我们的故土一样多。"
 me_gymnaesian_9_title:0 "我们的殖民地已能自给自足！"
 punic_integration:0 "布匿整合"
 surplus_of_wood:0 "盈余的木材"
 victory_in_sardinia:0 "撒丁岛的胜利"

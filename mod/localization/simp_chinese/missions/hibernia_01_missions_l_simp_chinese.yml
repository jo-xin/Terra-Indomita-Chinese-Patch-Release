l_simp_chinese:
 bravest_hibernia_ruler_duel_tt:0 "我们的统治者必须对敌国领袖使用角色互动#Y 设为对手#!并#Y 挑战决斗#!。"
 desc_hibernia_abandoned_capital_mod:0 "我们的部落民因我们放弃他们父辈埋葬的连绵丘陵而愤怒。"
 desc_hibernia_historic_capital_mod:0 "我们的人民认为祖先首都的地点神圣，决定留在家中而非迁往他处。"
 desc_hibernian_food_mod:0 "由于我们建造的农场，我们能够为贫瘠的冬季储存粮食。"
 desc_hibernian_stoneworks:0 "无论是从我们的矿山提取铁、石材还是基本金属，我们的部落民擅长这一艰苦任务。"
 desc_iron_weapons_hibernia:0 "我们的希伯尼亚矿山确保我们的战斗部队携带耐用的武器——我们的剑不会断裂或弯曲，将如我们的意志般坚韧。"
 hibernia_abandoned_capital_mod:0 "废弃的历史首都"
 hibernia_group:0 "希伯尼亚"
 hibernia_historic_capital_mod:0 "保留的历史首都"
 hibernian_food_mod:0 "希伯尼亚的粮食储备"
 hibernian_missions_01:0 "联合希伯尼亚部落"
 hibernian_missions_01_BUTTON_TOOLTIP:0 "我们未来的荣耀在等待……"
 hibernian_missions_01_CRITERIA_DESCRIPTION:0 "当#E 希伯尼亚#!国家形成时，此使命将完成。"
 hibernian_missions_01_DESCRIPTION:0 "居住在#E 希伯尼亚#!岛上的各个部落日益不安。战争的阴云在地平线上聚集，传言有雄心勃勃的部落酋长愿意冒着毁灭整个生活方式的风险，以实现梦想：在单一旗帜下政治统一分散的民族。"
 hibernian_missions_task_1:0 "西方"
 hibernian_missions_task_10:0 "希伯尼亚的首都"
 hibernian_missions_task_10_DESC:0 "我们的国家唯一缺少的是一座首都城市，但这问题我们将解决。一旦我们选定国家首都的地点，我们将立即开始建造城市。\n\n#Y我们将有机会移动国家首都，并建造一座城市。#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 hibernian_missions_task_11:0 "希伯尼亚家园"
 hibernian_missions_task_11_DESC:0 "我们日益增长的国家需要食物——让我们在全岛建造农场。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 hibernian_missions_task_12:0 "基本金属矿山"
 hibernian_missions_task_12_DESC:0 "我们缺少许多东西，但幸好基本金属不在其列；我们应发展采矿能力以提升经济地位。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 hibernian_missions_task_1_DESC:0 "#E 希伯尼亚#!西部的部落只懂一种语言，那就是暴力；不幸的是，我们精通此道。他们将臣服或死亡！\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 hibernian_missions_task_2:0 "南方"
 hibernian_missions_task_2_DESC:0 "#E 希伯尼亚#!南部的矿产资源召唤我们的征召兵前往此地，谁拥有这些富饶之地，谁将极为富有。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 hibernian_missions_task_3:0 "东方"
 hibernian_missions_task_3_DESC:0 "岛上东部地区的众多部落据说勇猛无比，战斗无双，但我们仍将征服他们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 hibernian_missions_task_4:0 "北方"
 hibernian_missions_task_4_DESC:0 "控制#E 希伯尼亚#!北部将使我们能跨越海洋接触#E 喀里多尼亚#!，并将几种重要贸易商品置于我们掌控之下。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 hibernian_missions_task_5:0 "战争的战利品"
 hibernian_missions_task_5_DESC:0 "现在我们已征服岛上的大部分，让我们享受劳动的果实——我们俘获了许多奴隶，必须将他们送往[ROOT.GetCountry.GetCapital.GetName]。\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 hibernian_missions_task_6:0 "来之不易的荣耀"
 hibernian_missions_task_6_DESC:0 "无人能否认我们的士兵以鲜血和无数死亡为[ROOT.GetCountry.GetAdjective]胜利付出了代价——我们欠他们一切！\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 hibernian_missions_task_7:0 "希伯尼亚"
 hibernian_missions_task_7_DESC:0 "终于，我们击败了邻近的敌人，使他们的部落酋长臣服——我们在此见证#Y 希伯尼亚#!的诞生。\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 hibernian_missions_task_8:0 "不列颠贸易"
 hibernian_missions_task_8_DESC:0 "海对岸的#E不列颠#!有部落，若我们愿意，可与之建立贸易联系。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 hibernian_missions_task_9:0 "卡勒多尼亚宣称"
 hibernian_missions_task_9_DESC:0 "现在我们已确保岛屿北部，我们意识到海对岸有易于我们夺取的土地……\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 hibernian_stoneworks:0 "希伯尼亚的矿工"
 iron_weapons_hibernia:0 "铁制武器"
 me_hibernia_1.a:0 "我知道那个人会是谁……"
 me_hibernia_10.a:0 "我迫不及待！听起来很精彩"
 me_hibernia_10_desc:0 "尽管人人都知#E 卡勒多尼亚人#!是可怕的战士，这并未阻止[ROOT.GetCountry.GetRuler.GetName]准备对他们的土地提出[ROOT.GetCountry.GetAdjective]宣称。\n\n很快，我们的征召兵将跨越#E 希贝耳尼库姆海#!，给毫无防备者带来毁灭。"
 me_hibernia_10_title:0 "卡勒多尼亚宣称"
 me_hibernia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y 卡勒多尼亚宣称#!' $mission_completed_tooltip_2$"
 me_hibernia_11.a:0 "#E 希伯尼亚#!中心的[GetProvince('(int32)2191').GetName]是自然之选"
 me_hibernia_11.b:0 "海岸的[GetProvince('(int32)2193').GetName]是个吸引人的地方"
 me_hibernia_11.c:0 "西部的[GetProvince('(int32)2169').GetName]吸引了我的注意"
 me_hibernia_11.d:0 "我想我选择了[GetProvince('(int32)2162').GetName]"
 me_hibernia_11.e:0 "我们应保留我们古老的首都"
 me_hibernia_11_desc:0 "现在[ROOT.GetCountry.GetRuler.GetName]已平定[ROOT.GetCountry.GetName]的敌对部落，有人提议我们将国家首都迁往新省。\n\n一些人建议我们将权力中心迁往岛屿中心，而其他人因其天然港口偏好[GetProvince('(int32)2193').GetName]的地点。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]现在必须决定我们将在哪里建造首都……这任务令人羡慕，但[ROOT.GetCountry.GetRuler.GetSheHe]当之无愧。"
 me_hibernia_11_title:0 "希伯尼亚的首都"
 me_hibernia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y 希伯尼亚的首都#!' $mission_completed_tooltip_2$"
 me_hibernia_12.a:0 "这让我满意——希望我们的人民高兴"
 me_hibernia_12_desc:0 "全国各地的农场生产力高、成果丰硕；看来我们岛屿的持续降雨对我们的作物大有裨益。\n\n由于我们现在的基础设施，我们将能储存比以往更多的粮食。"
 me_hibernia_12_title:0 "希伯尼亚家园"
 me_hibernia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y 希伯尼亚家园#!' $mission_completed_tooltip_2$"
 me_hibernia_13.a:0 "我迫不及待想看我们的铁匠能打造什么"
 me_hibernia_13_desc:0 "我们高兴地报告，我们建造的矿山表现超出我们高远期望。\n\n我们不仅确保了足够的矿产财富使建造永久建筑变得简单，还发现了一条重要的铁矿脉，将极大提升我们的武器。"
 me_hibernia_13_title:0 "基本金属矿山"
 me_hibernia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y 基本金属矿山#!' $mission_completed_tooltip_2$"
 me_hibernia_1_desc:0 "尽管许多人若非熟悉希腊探险家撰写的论述，从未听说过#E 希伯尼亚#!岛，它却是一个充满活力、蓬勃发展的地方，居住着众多不断争夺霸权的部落。\n\n虽然无人知晓未来，但人们相信岛屿在单一旗帜下的统一不可避免……历史在等待首位统一#E 希伯尼亚#!的统治者到来。"
 me_hibernia_1_title:0 "希伯尼亚岛"
 me_hibernia_1_tooltip:0 "是时候创造历史了"
 me_hibernia_2.a:0 "神与我们同在，你会看到的！胜利属于我们！"
 me_hibernia_2_desc:0 "[ROOT.GetCountry.GetRuler.GetName]从未否认过[ROOT.GetCountry.GetRuler.GetHerHis]的野心，而占领#E 希伯尼亚#!南部富饶的土地，早已是这位[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]的夙愿。\n\n如今[ROOT.GetCountry.GetName]终于有能力付诸行动，后续发展尚待观察。\n\n约一周后，我们便知晓此次提议是否获得接受。"
 me_hibernia_2_title:0 "南方"
 me_hibernia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y 南方#!' $mission_completed_tooltip_2$"
 me_hibernia_3.a:0 "保持你的剑锋利，矛在手……"
 me_hibernia_3_desc:0 "我们的宣称已准备好并送往邻居——不久我们将收到他们的回复。希望他们有理智和平臣服，但无论他们决定如何，我们已做好准备！\n\n大约一周后，我们将知道我们的提议是否被接受。"
 me_hibernia_3_title:0 "西方"
 me_hibernia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y 西方#!' $mission_completed_tooltip_2$"
 me_hibernia_4.a:0 "流血将值得回报——我确信"
 me_hibernia_4_desc:0 "[ROOT.GetCountry.GetName]发动的侵略战争将因其为[ROOT.GetCountry.GetAdjective]人民带来的荣耀与荣誉而被铭记。\n\n愿历史对[ROOT.GetCountry.GetRuler.GetName]仁慈，他是造成远亲间所有这些苦难与死亡的始作俑者。\n\n大约一周后，我们将知道我们的提议是否被接受。"
 me_hibernia_4_title:0 "东方"
 me_hibernia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y 东方#!' $mission_completed_tooltip_2$"
 me_hibernia_5.a:0 "我带来的和平将如夏日般美好……"
 me_hibernia_5_desc:0 "#E 希伯尼亚#!北部领土对[ROOT.GetCountry.GetRuler.GetName]始终特别，他对年轻时在[ROOT.GetCountry.GetRuler.GetHerHis]海岸度过的夏日有美好回忆。冰冷的海风，壮观的海岸线……这里应有尽有。\n\n或许可以说，是一丝怀旧推动[ROOT.GetCountry.GetName]征服该区域。\n\n大约一周后，我们将知道我们的提议是否被接受。"
 me_hibernia_5_title:0 "北方"
 me_hibernia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y 北方#!' $mission_completed_tooltip_2$"
 me_hibernia_6.a:0 "我将永远为[ROOT.GetCountry.GetAdjective]人民的胜利而战！"
 me_hibernia_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]最近带领[ROOT.GetCountry.GetName]取得了一系列令人瞩目的胜利，[ROOT.GetCountry.GetCapital.GetName]的所有人民为此庆祝，向[ROOT.GetCountry.GetRulerTitle]献上赞美。\n\n现在我们有片刻喘息，是时候庆祝我们在战场上夺取的成果——整个国家都将受益。"
 me_hibernia_6_title:0 "战争的战利品"
 me_hibernia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y 战争的战利品#!' $mission_completed_tooltip_2$"
 me_hibernia_7.a:0 "每个人都为我们的胜利而战，因此每个人都应分享"
 me_hibernia_7_desc:0 "尽管战争对人民从不易，[ROOT.GetCountry.GetRuler.GetName]确保在[ROOT.GetCountry.GetName]从战争中短暂喘息时不忘普通人。\n\n[ROOT.GetCountry.GetRulerTitle]始终相信，每个人都应享受我们的胜利，而不仅是[ROOT.GetCountry.GetCapital.GetName]的居民。"
 me_hibernia_7_title:0 "来之不易的荣耀"
 me_hibernia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y 来之不易的荣耀#!' $mission_completed_tooltip_2$"
 me_hibernia_8.a:0 "我们的名字将永远与永恒的胜利相连"
 me_hibernia_8_desc:0 "难以置信，[ROOT.GetCountry.GetRuler.GetName]已将我们的国家带到荣耀的巅峰；不再是简单的部落民，我们的成就被海对岸的酋长与国王们注意到，他们因[ROOT.GetCountry.GetAdjective]日益增长的力量而正当质疑自身安全。\n\n我们是[ROOT.GetCountry.GetName]——让世界颤抖！"
 me_hibernia_8_title:0 "希伯尼亚"
 me_hibernia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y 希伯尼亚#!' $mission_completed_tooltip_2$"
 me_hibernia_9.a:0 "我们可一起赚钱——我们的[ROOT.GetCountry.GetAdjective]人民值得财富"
 me_hibernia_9_desc:0 "由于定期从我们的港口驶往#E不列颠#!的贸易船，稳定的贸易流已成为[ROOT.GetCountry.GetCapital.GetName]日常生活的固定部分。\n\n虽然每个人都对财富的增长感到满意，无人忘记这一切源于[ROOT.GetCountry.GetRuler.GetName]的举措。"
 me_hibernia_9_title:0 "不列颠贸易"
 me_hibernia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y 不列颠贸易#!' $mission_completed_tooltip_2$"
 me_hibernia_ultimatum.2.tt:0 "我们将对拒绝我们要求的任何#Y $hibernia_group$#!部落宣战！"
 me_hibernia_ultimatum_1.a:0 "无所谓……我们终将胜利"
 me_hibernia_ultimatum_1.b:0 "我们欢迎拥抱我们的人，摧毁背弃我们的人"
 me_hibernia_ultimatum_1_desc:0 "意识到他们永远无法在战场上击败我们，我们的敌人已放弃自由，向我们臣服，仅请求我们善待他们，不滥用权威。"
 me_hibernia_ultimatum_1_title:0 "希伯尼亚的臣服"
 me_hibernia_ultimatum_2.a:0 "告诉我们的部落民为任何可能发生的事做好准备！"
 me_hibernia_ultimatum_2_desc:0 "我们派往希伯尼亚邻邦的外交官带回了令[ROOT.GetCountry.GetRuler.GetName]陛下龙颜大悦的消息，正合[ROOT.GetCountry.GetRuler.GetHerHis]对荣耀的渴求。无论最终局势如何，凡阻我道路者，吾等必战而胜之！"
 me_hibernia_ultimatum_2_title:0 "希伯尼亚的嗜血之性"
 me_hibernia_ultimatum_send.tt:0 "我们将向每个高亮的国家发出最后通牒，要求接受我们的霸权，否则面临战争。"
 we_need_one_hibernian_mines_tt:0 "[GetProvince('(int32)2161').GetArea.GetName|Y]地区中至少#Y 1#!个生产#Y基本金属#!@base_metals!的领土拥有#Y矿山#!。"
 you_need_to_form_hibernia:0 "#Y 我们需要作出决议以#!#E 成立希伯尼亚#!。"

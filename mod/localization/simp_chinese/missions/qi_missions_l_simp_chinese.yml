l_simp_chinese:
 begin_construction_of_jixia_library_tt:0 "在[GetProvince('(int32)8504').GetName|Y]开始兴建稷下学宫之宏伟扩建工程"
 great_cities_of_qi_mod:0 "齐之大城"
 great_city_of_linzi_mod:0 "临淄大城"
 legacy_of_sun_bin_mod:0 "孙膑遗策"
 me_qi.4.a:0 "木石显然为上选"
 me_qi.4.b:0 "大理石与银将尽显华美"
 me_qi.4.c:0 "乌木与象牙，民众之乐，当以为材"
 me_qi.4.d:0 "对[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]而言，一座纯金图书馆是唯一的选择。"
 me_qi_1.a:0 "天下无可与临淄相提并论之城"
 me_qi_10.a:0 "我之将士，来日尚有更多征战"
 me_qi_10_desc:0 "总而言之，南方的战事几乎不能再顺利了。仰赖[ROOT.GetCountry.GetRuler.GetName]受神灵启迪的统帅，我军大获全胜，迅速击溃敌军，以反映我军日益壮大的军威之势将其一举荡平。"
 me_qi_10_title:0 "$qi_missions_task_10$"
 me_qi_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_qi_11.a:0 "信我——我从未引尔等入歧途"
 me_qi_11_desc:0 "奸诈的#E燕#!军队已被齐军势不可挡的推进击退，我军成功将敌人逐出了#E渤海#!和#E渔阳#!地区。这些讨伐北方人的战役死伤之众令人瞠目，然而[ROOT.GetCountry.GetRuler.GetName]比以往任何时候都更加确信这是正确的道路，无论[ROOT.GetCountry.GetName]为此付出何等代价。\n\n我们是否会继续向北推进，抑或向东……无人知晓[ROOT.GetCountry.GetRuler.GetFirstName]的心思。"
 me_qi_11_title:0 "$qi_missions_task_11$"
 me_qi_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_qi_12.a:0 "秉政尽职乃我之责，我郑重于誓"
 me_qi_12_desc:0 "许多君王除自身判断外不信任何谏言，或许仅依赖少数亲信的建议，而[ROOT.GetCountry.GetRuler.GetName]却以在[ROOT.GetCountry.GetCapital.GetName]款待智者与圣贤而著称，[ROOT.GetCountry.GetRuler.GetHerHis]与#E孟子#!的著名对话已载入#E[ROOT.GetCountry.GetName]编年史#!，因其在诸多议题上的博学而流传后世。\n\n如此说来，[ROOT.GetCountry.GetRuler.GetFirstName]赢得了民心也就不足为奇了，人民庆幸有这样一位哲人王执掌国柄。"
 me_qi_12_title:0 "$qi_missions_task_12$"
 me_qi_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_qi_13.a:0 "且从孙膑处汲取智慧"
 me_qi_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]酷爱研读上一代传奇人物#E孙膑#!留下的兵书，此人一生跌宕起伏，影响了成千上万人的命运。\n\n在另一个时代，名将孙膑自称与受人敬仰的兵法家#E孙子#!有亲缘关系，却被卷入#E魏#!的宫廷阴谋，遭人诬陷谋反。他虽免于死罪，却被剜去膝盖骨，面刺囚犯之刑，投入牢狱——许多人以为这将是一代名将的终点。\n\n然而他们摧毁了孙膑的身体，却未能摧毁他的意志，他在我们的帮助下逃脱了囚禁，最终成为[ROOT.GetCountry.GetName]的家臣，为国效力其卓绝才智。\n\n孙膑辞世时众人哀悼，但他留给我们许多载有其哲思与感悟的文字——这是对齐国书库的无价馈赠。"
 me_qi_13_title:0 "$qi_missions_task_13$"
 me_qi_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_qi_14.a:0 "我无愧于此等称号…实至名归"
 me_qi_14_desc:0 "#E青#!和#E徐#!地区已完全落入齐军之手，我军击败了众多前来阻止其巩固东部沿海的敌军。\n\n随着四处劫掠的雇佣军被驱散，[ROOT.GetCountry.GetRuler.GetName]的铁腕统治已经确立，该地区正在恢复一丝稳定。山东半岛之主凭借其富庶的市场和勤劳的农民建立起了不可阻挡的权力根基，成果显而易见；齐国的军队撑起这位所谓的\"#E东方之帝#!\"，从全中原最美丽的城市[ROOT.GetCountry.GetCapital.GetName]发号施令，无人敢于挑战。"
 me_qi_14_title:0 "$qi_missions_task_14$"
 me_qi_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_qi_15.a:0 "此等#E 大城#!乃我工匠牺牲之明证"
 me_qi_15_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已成功将[ROOT.GetCountry.GetRuler.GetSheHe]在#E山东半岛#!运用纯熟的方略推广至#E青#!和#E徐#!地区，以当地前所未见的速度大兴土木，建设新近征服土地上的城市。\n\n[ROOT.GetCountry.GetCapital.GetArea.GetName]的每一位石匠大师都被召来南方，这里的报酬优厚得令人无法拒绝，数千名工人——一支名副其实的熟练工匠大军——在过去几个月里一直埋头苦干。如今他们额头的汗水已干，剩下的唯有自豪之感。"
 me_qi_15_title:0 "$qi_missions_task_15$"
 me_qi_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_qi_16.a:0 "今夜当饮以铭其志"
 me_qi_16_desc:0 "彻底消灭一个古老的对手，总是令人苦乐参半，即便对一个堕落之国的神圣审判是应得的——承认一个值得尊敬的对手的陨落，这其中亦有荣耀，而[ROOT.GetCountry.GetRuler.GetName]对那些为保卫自己人民而奋斗的人怀有至高的敬意，哪怕他们的努力最终归于失败。\n\n如今，#E魏#!已经覆灭——那只牛虻，那根扎在我国侧腹的刺，已不复存在。[ROOT.GetCountry.GetName]的星辰光芒万丈，令周围所有星光黯然失色。"
 me_qi_16_title:0 "$qi_missions_task_16$"
 me_qi_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_qi_17.a:0 "此非背叛——此乃天罚！"
 me_qi_17_desc:0 "尽管#E周#!频频向[ROOT.GetCountry.GetCapital.GetName]派遣使节，却一再遭到拒绝，他们的恳求尚未被听取便被逐出城门。\n\n[ROOT.GetCountry.GetRuler.GetName]无意亲耳聆听他们的哀求，因为[ROOT.GetCountry.GetRuler.GetSheHe]早已清楚他们的说辞：绝望地恳求齐军停止进兵，试图用告密和叛国来讨好，将军们秘密提议在战场上背叛其主君……\n\n周的残余势力在齐的猛攻下分崩离析，其彻底覆灭只是时间问题。"
 me_qi_17_title:0 "$qi_missions_task_17$"
 me_qi_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_qi_18.a:0 "有此等勇士为我而战，焉能不胜？"
 me_qi_18_desc:0 "既然我们已宣布以武力#E统一中国#!的意图，大批农民聚集在[ROOT.GetCountry.GetCapital.GetName]附近。这些[ROOT.GetCountry.GetName]的爱国子弟前来志愿为国捐躯，恳求接受征召训练后派往战场与敌作战——这一意外之喜令我们的将军们倍感欣慰，他们感激这额外的兵源。"
 me_qi_18_title:0 "$qi_missions_task_18$"
 me_qi_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_qi_19.a:0 "皇帝万岁，齐朝万世！"
 me_qi_19_desc:0 "回想起来，这本是命中注定、天神授意的必然——#E中国#!将由一位齐国皇帝统一，这位皇帝在巩固了奢华的东部沿海之后登上宝座。说到底，#E楚#!那腐朽的外壳，或是#E齐#!的山野蛮夷，怎么可能与文明的力量抗衡，与真正的中华文化之优雅火炬手一较高下？唯有愚者和野蛮人才会自欺欺人地以为他们能对抗[ROOT.GetCountry.GetRuler.GetName]——辉煌的#E齐朝#!的开创者。"
 me_qi_19_title:0 "$qi_missions_task_19$"
 me_qi_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_qi_1_desc:0 "近来，富丽堂皇的[ROOT.GetCountry.GetCapital.GetName]变得比以往更加富裕——这几乎难以想象，因为我们都城之名早已是奢华与高雅的代名词。\n\n人心所向往的一切，都可以在这座闻名遐迩的[ROOT.GetCountry.GetAdjective]城市的购物长廊和露天集市中找到，商人们甚至远从#E印度#!而来，购买我们的贸易商品。[GetProvince('(int32)8506').GetName]的港务长收取的税款创下纪录，唯一令人抱怨的只有天气。"
 me_qi_1_title:0 "$qi_missions_task_1$"
 me_qi_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_qi_2.a:0 "我乃华夏文明之心脏…"
 me_qi_2_desc:0 "虽然其他省城或许会愚蠢地自诩为值得一游之地，但所有这些闭塞小镇在我们的辉煌都城[ROOT.GetCountry.GetCapital.GetName]面前都黯然失色——这座城市真正堪称华夏文化之中心。\n\n我们的都城汇聚了四海之内最睿智的哲人与圣贤，遍布全城的作坊中的工匠和艺人皆为其手艺之无可争议的大师。音乐亦在此繁盛，王庭乃是全[ROOT.GetCountry.GetName]最杰出乐师的家园。"
 me_qi_2_title:0 "$qi_missions_task_2$"
 me_qi_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_qi_3.a:0 "齐国永为贤者之家"
 me_qi_3_desc:0 "倾国之力资助学者，已证明是[ROOT.GetCountry.GetRuler.GetName]的明智决策，其显然懂得在[ROOT.GetCountry.GetAdjective]社会核心拥有一批受过教育的精英之价值。\n\n南方传来黑暗流言，说有哲学家因其信仰而遭受迫害，有人甚至声称一些僧侣被活埋或斩首——这与[ROOT.GetCountry.GetName]何其不同，我们可是敞开胸怀拥抱爱智者的！"
 me_qi_3_title:0 "$qi_missions_task_3$"
 me_qi_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_qi_4_desc:0 "随着#E稷下学宫#!扩建工程终于准备开工，[ROOT.GetCountry.GetRuler.GetName]亲自巡视了工地，以会见[SCOPE.sCharacter('scope:library_builder').GetName]，一位受托承担此无上荣誉的才华横溢的年轻建筑师。\n\n当[ROOT.GetCountry.GetRuler.GetFirstName]与[ROOT.GetCountry.GetRuler.GetHerHis]的随行人员抵达学宫时，太阳才刚刚爬上[ROOT.GetCountry.GetCapital.GetName]的城墙，而工人们已在忙碌；沉重的石块正被小心翼翼地铺设为地基，这时[SCOPE.sCharacter('scope:library_builder').GetFirstName]迎上前来向[ROOT.GetCountry.GetRuler.GetFirstName]致意。\n\n\"我的[ROOT.GetCountry.GetRulerTitle]，很高兴您能亲临——有一个重要的问题需要回答。我可用哪些建筑材料？唯您之命是从。\""
 me_qi_4_title:0 "$qi_missions_task_4$"
 me_qi_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_qi_5.a:0 "我誓为临淄之良善守护者"
 me_qi_5_desc:0 "我们欣喜地报告，[ROOT.GetCountry.GetCapital.GetName]这座大都会已被众多前来叩门的外邦人和旅人赋予了一个别号，他们渴望获准进入这座华夏最伟大城市的城墙之内。\n\n我们身处令人艳羡的位置，成为了所谓\"#E大智慧中心#!\"的主人，这一美誉归于我们的都城，皆因城外建起的庞大#E稷下学宫#!建筑群。\n\n不知何故，[ROOT.GetCountry.GetCapital.GetName]的声名与威望日增——如同天穹中最明亮的星辰，高高闪耀。"
 me_qi_5_title:0 "$qi_missions_task_5$"
 me_qi_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_qi_6.a:0 "吾辈之成就，实乃天幸"
 me_qi_6_desc:0 "凡是寻求最佳价格的商人，无论是买家还是卖家，通常都会前往遍布#E山东半岛#!各地的诸多集市。\n\n无论经营何业——漂洗工、织布匠、牲畜贩子、酒商、精美陶瓷商——通常都会在我们的[ROOT.GetCountry.GetAdjective]店铺中找到最优惠的价格，因为我们已几乎主宰了所能找到的每一个市场。"
 me_qi_6_title:0 "$qi_missions_task_6$"
 me_qi_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_qi_7.a:0 "齐邦得天所佑！"
 me_qi_7_desc:0 "不论以何种标准衡量，我们的文化在整个#E山东半岛#!都蓬勃发展；集市和城市如雨后春笋般涌现，我们的一些城镇甚至可称大都会——我们在数量上显然已超越地区对手。\n\n我们的地方官报告说，核心领地内民情昂扬；人人都在赚钱，旱灾与饥荒已许久未降临于民。在这充满艰辛的世上，我们比大多数人过得轻松。"
 me_qi_7_title:0 "$qi_missions_task_7$"
 me_qi_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_qi_8.a:0 "无我城墙，此皆无从谈起"
 me_qi_8_desc:0 "尽管[ROOT.GetCountry.GetName]的国库为驻扎于各处要塞的指挥官和守军支付了巨额饷银，但每一枚银币都物有所值——我们在山东半岛的核心领地如春花般绽放，而这繁荣的一个重要原因便是人民安居无忧。\n\n我们的防御体系确实相当令人印象深刻，必须承认——我军始终处于高度戒备状态，随时准备应对任何威胁，并定期巡逻领地以维持治安。"
 me_qi_8_title:0 "$qi_missions_task_8$"
 me_qi_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_qi_9.a:0 "吾等特此宣告此土归我所有！"
 me_qi_9_desc:0 "一道宏大诏令从[ROOT.GetCountry.GetCapital.GetName]的城墙内发出，信使沿着从齐都延伸出的每一条道路和官道被派往各地传播消息。\n\n尽管他们所携带的信息令人忧惧，注定不为目标受众所乐闻，但此时已无任何力量能够阻止其送达。"
 me_qi_9_title:0 "$qi_missions_task_9$"
 me_qi_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qi_missions_task_9$#!' $mission_completed_tooltip_2$"
 qi_core_states_mod:0 "齐国核心领地"
 qi_final_mod:0 "齐之帝国"
 qi_missions:0 "乱世繁荣之庇所"
 qi_missions_BUTTON_TOOLTIP:0 "我等为中原诸国所羡慕……乃华夏文化之真正中心。"
 qi_missions_CRITERIA_DESCRIPTION:0 "待#E 齐#!振兴#E 山东半岛#!之经济、一统#E 华夏#!，此使命方为达成。"
 qi_missions_DESCRIPTION:0 "当#E 战国#!之乱席卷#E 中夏#!，富庶繁华之#E 山东半岛#!至今尚能免于大难。#E 齐#!之国力冠绝群雄，其都#E 临淄#!尤为至珍之宝——此城中，艺文昌盛，银铜钱币叮当响于万民钱囊之中，往来商贾眉间之汗珠，恍若天降之雨。\n\n然而战云已暗天际。此太平岁月能延续几何，无人得知……"
 qi_missions_task_1:0 "临淄之奢"
 qi_missions_task_10:0 "安靖南境"
 qi_missions_task_10_DESC:0 "欲称南境确属我有，则先须驱除此域数小邦。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 qi_missions_task_11:0 "灭燕"
 qi_missions_task_11_DESC:0 "我凯旋之师已摧折燕国征召兵之脊梁，裂其王国为二，于其故地激起惶恐无限。彼之彻底覆灭，为期不远矣！\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 qi_missions_task_12:0 "大田辟疆"
 qi_missions_task_12_DESC:0 "我[ROOT.GetCountry.GetRulerTitle]，与哲人为友，于军营亦如归家，深得庶民爱戴。凡[ROOT.GetCountry.GetName]境内，[ROOT.GetCountry.GetRuler.GetName]之言即为法令。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 qi_missions_task_13:0 "孙膑遗泽"
 qi_missions_task_13_DESC:0 "#E 孙膑#!虽为#Y 魏#!所残、遭处死刑，然此位杰出之将竟脱囹圄之困、再生而战。今虽此伟岸武士已离凡尘，其遗风犹在，我辈当承其志业。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil1!"
 qi_missions_task_13_tt:0 "一位武艺卓绝的人物将来到齐国。"
 qi_missions_task_14:0 "东方之帝"
 qi_missions_task_14_DESC:0 "赖我卓越之武功，已克取#Y 青#!与#Y 徐#!之域，为[ROOT.GetCountry.GetRuler.GetName]赢来赫赫声誉，众人已不约而同私称其为「#T 东方之帝#!」。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 qi_missions_task_15:0 "东方的繁荣"
 qi_missions_task_15_DESC:0 "#Y 青#!与#Y 徐#!地区所建之基业，为[ROOT.GetCountry.GetAdjective]之邦带来无可匹敌之繁荣，亦引来邻邦之妒羡。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 qi_missions_task_15_tt:0 "#Y $qing_region$#!地区诸省已用建筑槽位不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_15_buildings_max')|0Y]（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_15_qing_svalue')|0Y]）"
 qi_missions_task_15_ttt:0 "#Y $xu_region$#!地区诸省已用建筑槽位不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_15_buildings_max')|0Y]（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_15_xu_svalue')|0Y]）"
 qi_missions_task_16:0 "魏之终焉"
 qi_missions_task_16_DESC:0 "我辈与#Y 魏#!比邻而居已历多年，然此局面已至终局——断不能容彼在#Y 蓟#!之地据有寸土。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 qi_missions_task_16_tt:0 "#Y 魏#!在#Y $ji_region$#!地区不再拥有任何领地。"
 qi_missions_task_17:0 "背弃周室"
 qi_missions_task_17_DESC:0 "周室将以我取其腹地为最不可恕之背叛，然我辈视此一刻为上苍降罚于其腐败——此皆彼辈自取其咎。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 qi_missions_task_18:0 "一统天下之战"
 qi_missions_task_18_DESC:0 "我辈久待之刻即在眼前！当发此至伟之战，此乃横亘于我与毕生梦想间最后之壁垒！\n\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 qi_missions_task_18_tt:0 "已发起最终的#Y 统一中国#!战争。"
 qi_missions_task_19:0 "齐朝"
 qi_missions_task_19_DESC:0 "苍天洞开，宣告显赫之#T 齐朝#!降临，天命降于[ROOT.GetCountry.GetRuler.GetName]及其尊贵之[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏，彼辈以一己之力将[ROOT.GetCountry.GetName]推至权势之巅！\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 qi_missions_task_1_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]日益以风雅繁华而著称于世，凡有所欲，皆可购得。四方商贾跋涉而来，冀望借我美京之珍奇货物而大发其财。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 qi_missions_task_2:0 "华夏文明之中心"
 qi_missions_task_2_DESC:0 "仰赖[ROOT.GetCountry.GetAdjective]官员不计其数之投入，[ROOT.GetCountry.GetCapital.GetName]之光彩令周边诸城黯然失色——此城被尊为华夏文明之中心，良有以也。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 qi_missions_task_3:0 "资助学者"
 qi_missions_task_3_DESC:0 "[ROOT.GetCountry.GetName]当尽其所能襄助学者与哲人，盖我等深知彼辈之教义乃邦国力量之源——此与若干邻邦大相径庭，彼等正始禁压所谓异端之学。我辈誓反其道而行。\n\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 qi_missions_task_4:0 "襄助稷下学宫"
 qi_missions_task_4_DESC:0 "出[ROOT.GetCountry.GetCapital.GetName]西门之外，即可见享誉四海之#E 稷下学宫#!，此学府于我邦国之间声名之隆已无需赘言。有议者建议[ROOT.GetCountry.GetName]当直接资助此间学者——[ROOT.GetCountry.GetRuler.GetName]深表赞同。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 qi_missions_task_5:0 "智慧重镇"
 qi_missions_task_5_DESC:0 "托我辈扩建#E 稷下学宫#!及其周边之努力，[ROOT.GetCountry.GetCapital.GetName]正被称为「#Y 天下智慧之大宗#!」，此尊号于[ROOT.GetCountry.GetAdjective]之民实至名归。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 qi_missions_task_6:0 "齐之大商"
 qi_missions_task_6_DESC:0 "遍布国中之无数集市，确保我辈掌控华夏贸易之出入——我等乃齐之巨商，山东半岛之主宰。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 qi_missions_task_6_tt:0 "#Y $donglai_area$#!、#Y $beihai_area$#!、#Y $linzi_area$#!、#Y $qiansheng_area$#!及#Y $langya_area$#!诸区中，拥有不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_6_buildings_max')|0Y]座[GetBuilding('port_building').GetName|Y]或[GetBuilding('commerce_building').GetName|Y]建筑（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_6_buildings_svalue')|0Y]）"
 qi_missions_task_7:0 "山东霸权"
 qi_missions_task_7_DESC:0 "我文明于山东半岛全境正如金辉般繁荣璀璨，[ROOT.GetCountry.GetAdjective]之都会星罗棋布，人口殷实而勤勉。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 qi_missions_task_7_tt:0 "#Y $donglai_area$#!、#Y $beihai_area$#!、#Y $linzi_area$#!、#Y $qiansheng_area$#!及#Y $langya_area$#!诸区中，拥有不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_cities_max')|0Y]座[GetProvinceRank('city').GetName|E]级城市（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_cities_svalue')|0Y]）"
 qi_missions_task_7_ttt:0 "#Y $donglai_area$#!、#Y $beihai_area$#!、#Y $linzi_area$#!、#Y $qiansheng_area$#!及#Y $langya_area$#!诸区中，拥有不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_metropolis_max')|0Y]座[GetProvinceRank('city_metropolis').GetName|E]级都会（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_metropolis_svalue')|0Y]）"
 qi_missions_task_7_tttt:0 "#Y $donglai_area$#!、#Y $beihai_area$#!、#Y $linzi_area$#!、#Y $qiansheng_area$#!及#Y $langya_area$#!诸区中，总人口不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_pops_max')|0Y]（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_7_pops_svalue')|0Y]）"
 qi_missions_task_8:0 "加固长城"
 qi_missions_task_8_DESC:0 "北境胡人之患无时可忽，纵使维持抵御来犯之防务工事耗资甚巨，亦在所不辞。务必拨出足量国库之财，巩固护我之长城。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 qi_missions_task_8_tt:0 "标亮之省份拥有不少于[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_8_forts_max')|0Y]级堡垒等级。（当前：[GuiScope.SetRoot( Player.MakeScope ).ScriptValue('qi_missions_task_8_forts_svalue')|0Y]）"
 qi_missions_task_9:0 "齐国"
 qi_missions_task_9_DESC:0 "虽西、北两境敌寇环伺，然彼辈不能阻我伸张领土之主张！\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"

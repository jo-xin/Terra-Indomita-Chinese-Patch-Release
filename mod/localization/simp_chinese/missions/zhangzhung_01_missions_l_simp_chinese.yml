l_simp_chinese:
 01_zhangzhung_missions:0 "山地王国"
 01_zhangzhung_missions_BUTTON_TOOLTIP:0 "在我们的安全的山中之家，我们准备我们雄心勃勃的计划..."
 01_zhangzhung_missions_CRITERIA_DESCRIPTION:0 "当我们在山区建立起一个王国时，该使命完成——我们必须找到一个能够保护我们的人民并带领苯教的信徒们进入一个光辉的未来的领袖。"
 01_zhangzhung_missions_DESCRIPTION:0 "在世界最遥远的地方，平地变成了高耸如云的山脉，几乎能碰到天空本身--这就是我们的土地，我们自时间之初就生活在山丘和岩石的裂缝中。很少有足够勇敢的人进入我们的家园，因为旅程很艰难，但有很多商人冒着生命危险在我们的领土上的山谷和山路上航行，因为我们坐落在许多强大和富有的国家的十字路口。\n\n我们也到了变得强大和富有的时候了。"
 01_zhangzhung_missions_task_1:0 "边境上的紧张局势"
 01_zhangzhung_missions_task_10:0 "北方"
 01_zhangzhung_missions_task_10_DESC:0 "我们为控制塔里木盆地的战争仍在继续，这使我们的士兵离家比以往更远。希望他们在外地的征战能给我们的人民带来胜利！除此之外，别无他选！\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 01_zhangzhung_missions_task_11:0 "苯教告密者"
 01_zhangzhung_missions_task_11_DESC:0 "并不是所有生活在我们敌人土地上的人都是我们的敌人；相反，有些人明白我们的统治者比他们自己的更好，并渴望看到我们掌权。当地居民中的这些告密者愿意为我们提供情报，告知他们防御工事中的弱点，但他们希望能为这些信息获得高额报酬。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 01_zhangzhung_missions_task_12:0 "吉尔吉特之墙"
 01_zhangzhung_missions_task_12_DESC:0 "由于我们在[GetProvince('(int32)5593').GetArea.GetName]建造了堡垒，我们的工程师学到了很多东西，现在已经是经验丰富的建筑师。在未来，他们将能够记住他们在山区劳动时学到的东西，并希望从这些教训中受益，但要做到这一点，我们需要储备大量的石料。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_zhangzhung_missions_task_13:0 "寻找沃摩隆仁"
 01_zhangzhung_missions_task_13_DESC:0 "我们的古老传说提到，苯教创始人辛饶弥沃来自遥远的西方，被称为沃摩隆仁的土地。现在我们控制了帕米尔山脉，我们应该派探险者到西部去寻找这个神话中的地区。\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 01_zhangzhung_missions_task_14:0 "南方"
 01_zhangzhung_missions_task_14_DESC:0 "在整个塔里木盆地坚持他们权力不放的僭主即将被永远打败，但前提是我们的人民能够坚持度过未来的艰难日子。我们将在日出时分向他们的首都进军！\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 01_zhangzhung_missions_task_15:0 "天马之地"
 01_zhangzhung_missions_task_15_DESC:0 "我们在塔里木盆地地区的贸易伙伴对[GetProvince('(int32)6736').GetArea.GetName]区域的马匹评价很高。虽然我们可以很容易地宣称那儿，但有些人却迫切要求克制，认为我们占领另一个山谷是让自己暴露在不必要的危险中。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 01_zhangzhung_missions_task_16:0 "新时代的黎明"
 01_zhangzhung_missions_task_16_DESC:0 "一个值得庆祝的时刻到来了！我们的征服战争虽然艰难，但很快就会被遗忘，我们必须作为一个民族走到一起，迎接摆在我们面前的未来。宣布在我们的新首都举行为期一个月的盛宴吧！\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 01_zhangzhung_missions_task_17:0 "一个值得信赖的家"
 01_zhangzhung_missions_task_17_DESC:0 "没有什么好说的，我们的首都很寒酸。我们必须尽一切努力为我们的人民建立一个配得上他们伟大的家园，但这需要时间和金钱。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_zhangzhung_missions_task_18:0 "圣地"
 01_zhangzhung_missions_task_18_DESC:0 "在我们的首都建设一个宏伟的圣地将向世界证明，我们的苯教信仰指导着我们的每一步行动。让我们不要忘记我们的祖先在这个美好时代的信仰，但让我们记住神明对我们的恩赐，并感谢他们。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_zhangzhung_missions_task_19:0 "为大家提供面包"
 01_zhangzhung_missions_task_19_DESC:0 "养活我们公民的空腹一直是一项艰巨的任务，这无疑是由于缺乏适合种植作物的土地。然而，这不能再成为借口了；我们必须采取措施，增加粮食储备。那么，为什么不利用我们的地形优势呢？我们可以把粮仓建在山的深处......那儿冰冷的石头对保存食物有很大的帮助。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_zhangzhung_missions_task_1_DESC:0 "我们不断收到报告说，外国人越过我们的边界，在我们的土地上随意游荡，如果当地部落的人抵制他们的入侵，他们就会攻击他们。为了保护我们的人民不受这些强盗的侵害，我们应该夺取珠穆朗玛，把这些无赖赶回山里去。\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 01_zhangzhung_missions_task_2:0 "台拉山麓"
 01_zhangzhung_missions_task_20:0 "山地王国"
 01_zhangzhung_missions_task_20_DESC:0 "任何沿着贸易路线进入高海拔地区的人都会很快发现他们几乎无法呼吸；不是由于稀薄的山地空气，而是被嵌在峭壁高处的令人印象深刻的城市的景象。这样一个荒凉的地区如何能支持这样一个宏伟的国家？\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_zhangzhung_missions_task_21:0 "群山之王"
 01_zhangzhung_missions_task_21_DESC:0 "如果我们能征服周围山区的所有都城，那么当我们宣称自己是群山之王时，谁还能和我们争论呢？\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 01_zhangzhung_missions_task_22:0 "在一个屋檐下"
 01_zhangzhung_missions_task_22_DESC:0 "现在我们终于征服了塔里木盆地，我们应该尽我们所能为该地区带来和平;我们自然希望我们所有治下的民众，无论他们的宗教或文化如何，都能彼此友好相处。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_zhangzhung_missions_task_23:0 "堵住裂缝"
 01_zhangzhung_missions_task_23_DESC:0 "我们不能容忍边界有漏洞，必须采取必要的措施来确保山口的安全。任何入侵者都不会自由地进入我们的腹地；他们必须为他们的每一步前进付出惨重的代价。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 01_zhangzhung_missions_task_24:0 "索取山麓"
 01_zhangzhung_missions_task_24_DESC:0 "相信属于我们的财富会在南方的异国和郁郁葱葱的土地上等待着我们，我们将大规模地准备宣称，告诉当地人，任何位于我们山脉阴影下的领土自然属于我们。\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 01_zhangzhung_missions_task_25:0 "御马官"
 01_zhangzhung_missions_task_25_DESC:0 "由于我们对[GetProvince('(int32)6736').GetArea.GetName]山谷中的马匹资源的控制，我们能够采购到市面上最好的战马和种马。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 01_zhangzhung_missions_task_2_DESC:0 "台拉的原始森林，尽管纯净无瑕，但对于任何决定给我们制造麻烦的南方国家来说，并不会构成真正的障碍；我们应该立即占领这个省份，以免在某个不合时宜的时刻遭遇不愉快的意外。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 01_zhangzhung_missions_task_3:0 "终结藏区"
 01_zhangzhung_missions_task_3_DESC:0 "在意识到我们永远无法与东边的敌人和平共处后，我们决定必须直接统治他们。辉煌的战斗正等待着我们的士兵！\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 01_zhangzhung_missions_task_4:0 "战利品"
 01_zhangzhung_missions_task_4_DESC:0 "除了伴随战争胜利的通常的黄金和奴隶，我们现在是藏区积累的知识的继承者；我们应该派我们的学者去他们的前首都，看看他们能从当地人那里收集到什么智慧。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 01_zhangzhung_missions_task_5:0 "宝石的传闻"
 01_zhangzhung_missions_task_5_DESC:0 "从我们远在北方的定居点回来的商人说，当地人有一个激动人心的发现——有传言说在山上可以找到耀眼的绿色和红色宝石。我们应该派出一支探险队，看看我们是否能找到这种传说中的财富的来源。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_zhangzhung_missions_task_5_tt:0 "在#T 苏伐剌拏瞿呾罗区域#!内#Y 我们的一块领土#!#Y 将贸易品设为#!#G 宝石#!。"
 01_zhangzhung_missions_task_6:0 "统一苯教政权"
 01_zhangzhung_missions_task_6_DESC:0 "在最近的记忆中，曾经几乎是梦想的事情——将苯教信徒在政治上统一为一个强大的国家——正在切实地被实行着。我们应该准备好必要的花费，前往东部山区的深处冒险。\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 01_zhangzhung_missions_task_7:0 "保护西部"
 01_zhangzhung_missions_task_7_DESC:0 "现在，我们已经拥有着自然边界，我们决定有计划地穿过我们的省份，加强我们的防御系统。西部不稳定的局势需要我们的关注；我们在那里有强大的邻居，也不希望看到他们的军队在我们的山路上蜿蜒。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_zhangzhung_missions_task_8:0 "世界屋脊"
 01_zhangzhung_missions_task_8_DESC:0 "虽然这儿很难居住，和我们所处的地形很像，但[GetProvince('(int32)6769').GetArea.GetName]的山区居住着一个弱小的民族，我们可以轻易地攻灭并赶走他们。控制他们的地区不仅可以提高我们的防御能力，而且可以进一步巩固我们对当地贸易路线的控制。\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 01_zhangzhung_missions_task_9:0 "进入盆地"
 01_zhangzhung_missions_task_9_DESC:0 "塔里木盆地肥沃的绿洲在远处闪闪发光，异国珍宝和丰厚财富的承诺随着沙漠的微风飘来。生活在那里的居民与我们的民众有很大的不同，他们会为了守住他们所拥有的东西而进行激烈的斗争——我们应该为一场艰难的战役做好准备。\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 ascendant_bon:0 "苯教权力的提升"
 bon_informers:0 "苯教信息网"
 build_food_tt:0 "在任意生产粮食的地块，我们需要至少3个#Y 农业定居点#!建筑。"
 desc_ascendant_bon:0 "信奉苯教的部落已经团结在一个旗帜下，控制着高山上的一个广阔的领域。"
 desc_bon_informers:0 "我们在邻国的土地上有一个有偿线人网络，他们与我们信奉的宗教相同。"
 desc_gilgit_walls:0 "我们在吉尔吉特建造堡垒的经验可以为我们整个国家应用。"
 desc_glorious_battle:0 "我们对敌人的胜利激发了我们的士兵在战斗中寻求荣耀。"
 desc_horse_lord:0 "由于我们控制着世界上一些最好的种马繁殖地区，我们被赋予了‘马主’的绰号。"
 desc_mauryan_mercenaries_zhangzhung_mod:0 "我们花费了大量黄金，以说服大量雇佣军迁往我国。"
 desc_mountain_granaries:0 "我们在山中建造了大型仓库，使我们能够在一年中储存大量的粮食。"
 desc_mountain_power:0 "由于我们的统治者鼓舞人心的领导，我们实际上已经达到了我们可以达到的最崇高的高度——我们是云中之国，山地王国。"
 desc_one_tent:0 "在我们枷锁下的不同部族将认识到我们多么温和。"
 desc_persuasive_bon:0 "因为我们变得如此强大，人们认为这证明我们的苯教信仰是真正的宗教。"
 desc_secure_borders:0 "我们在山区建立的令人印象深刻的环形防御工事，使我们的整个国家变成了一个几乎无懈可击的堡垒。"
 desc_state_investments:0 "由于州一级的投资，我们的国家正在以惊人的速度发展其基础设施。"
 desc_the_gates_of_parsni_mod:0 "波萨尼要塞代表了我国军事工程师迄今为止最伟大的建筑成就。"
 gilgit_walls:0 "吉尔吉特之墙"
 glorious_battle:0 "光荣的战斗"
 horse_lord:0 "马主"
 mauryan_mercenaries_zhangzhung_mod:0 "孔雀的雇佣军"
 me_zhangzhung_1.a:0 "我们不能让这种强盗行为继续下去"
 me_zhangzhung_10.a:0 "继续信任我，你将继续看到这些结果"
 me_zhangzhung_10_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在[GetProvince('(int32)6744').GetArea.GetName]的城市召开了临时的战争会议，在塔里木盆地边缘的城镇现在已经落入我们的部队的控制。协商简短，决断一致，更妙的是，预兆是有利的--我们应该继续向北推进，胜利就在我们面前。"
 me_zhangzhung_10_title:0 "$01_zhangzhung_missions_task_10$"
 me_zhangzhung_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_10$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_11.a:0 "归根结底，我们只是在努力拯救生命"
 me_zhangzhung_11_desc:0 "虽然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经表明，与犯罪分子和叛徒交往，无论他们的忠诚度如何，都是一件不光彩的事情，但如果允许这种小的疑虑妨碍我们实现自己的目的，也是非常愚蠢的。如果有什么是真的，那就是[ROOT.GetCountry.GetRuler.GetFirstName]不是傻瓜。\n\n我们的特工报告说，他们已经会见了一些线人，他们会告诉我们什么时候城墙上最不可能有人，以及哪里是我们集中攻击的最佳地点。如果运气好的话，这些城市和要塞会很快沦陷。"
 me_zhangzhung_11_title:0 "$01_zhangzhung_missions_task_11$"
 me_zhangzhung_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_11$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_12.a:0 "以后大家都会感谢我的，你会看到"
 me_zhangzhung_12_desc:0 "虽然我们的许多商人和生意人都希望我们在城市建设中使用我们精良的专业知识，但我们的优先事项首先是加强我们的堡垒和防御工事。\n\n所有文明带来的精致的东西都很好，但我们宁愿安全而不是柔软。"
 me_zhangzhung_12_title:0 "$01_zhangzhung_missions_task_12$"
 me_zhangzhung_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_12$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_13.a:0 "辛饶弥沃保佑了我们！"
 me_zhangzhung_13_desc:0 "傍晚时分，城门处出现了一阵骚动，很快就有[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]下去为[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]自己看个究竟了。很快就知道为什么街上会有欢呼声和赞叹声了；我们送走的心爱的儿子们作为探险者，去寻找辛饶弥沃的故乡，在他们离开十年后终于回来了。当人群聚集在广场上时，他们的故事细节很快就被大家分享。\n\n男人们骑马穿过山脉，进入[GetProvince('(int32)6634').GetArea.GetName]的山丘，远离道路两旁许多侦察兵和哨兵的监视。似乎有许多战争在西方进行，将军们为帝国的残余碎片争斗不休，由于冲突不断，即使在这么远的东方也能感受到紧张的气氛。尽管如此，我们的探险者还是能够继续前进，而不必流血。\n\n在遇到无数听不懂我们语言的陌生人后，他们终于在大草原上遇到了一些能说象雄语的部落，这时我们才意识到，我们终于找到了#E 辛饶弥沃#!的诞生地。在与我们的远房亲戚呆在一起研究了很多年后，他们终于带着对我们来说早已失传的我们的宗教圣典的副本回来了。这对我们的人民来说是改变生活的一天！"
 me_zhangzhung_13_title:0 "$01_zhangzhung_missions_task_13$"
 me_zhangzhung_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_13$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_14.a:0 "的确如此——因为谁知道明天会带来什么？"
 me_zhangzhung_14_desc:0 "考虑到南塔里木离我们自己的边境相当近，它应该是一个比我们进行过的更容易征服的地方。我们很感激，我们的补给线不会像以前那样捉襟见肘——这是你必须保持感激的小事情。"
 me_zhangzhung_14_title:0 "$01_zhangzhung_missions_task_14$"
 me_zhangzhung_14_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_14$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_15.a:0 "我们都可以从彼此身上学到很多东西"
 me_zhangzhung_15_desc:0 "[GetProvince('(int32)6736').GetArea.GetName]山谷离我们的首都很远，但我们却发现我们的利益在这个地区纠缠在一起。虽然我们预计这里的城市居民会有激烈的抵抗，但我们期待着将这些文明和文化中心加入我们不断增长的边疆。"
 me_zhangzhung_15_title:0 "$01_zhangzhung_missions_task_15$"
 me_zhangzhung_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_15$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_16.a:0 "我向你们保证，一个更好的未来正在等待着你们"
 me_zhangzhung_16_desc:0 "在我们整个王国，人们都在为即将在[GetProvince('(int32)5557').GetName]举行的庆祝活动做准备，这无疑是人们在未来一百年都会谈论的事件。今天是一个不同于最近记忆中其他日子的日子，因为我们终于可以说，我们对兄弟民族的战争已经结束，一个和平的时代正在向我们走来。\n\n当游行队伍蜿蜒穿过我们首都的街道时，在一个短暂的时刻，过去的纷争和破坏被遗忘，我们的民众是一体的。"
 me_zhangzhung_16_title:0 "$01_zhangzhung_missions_task_16$"
 me_zhangzhung_16_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_16$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_17.a:0 "随着时间的推移，我们的城市将与世界上任何地方的城市相媲美"
 me_zhangzhung_17_desc:0 "由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]所表现出的意志（以及[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]为国家的发展慷慨解囊），我们看到[GetProvince('(int32)5557').GetName]的发展时期，我们希望看到这在我国的整个地区推广。让我们继续资助我们已经开始的建设举措，同时寻找我们可以建设和投资的新地方。"
 me_zhangzhung_17_title:0 "$01_zhangzhung_missions_task_17$"
 me_zhangzhung_17_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_17$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_18.a:0 "我想下去看看这个奇迹！这可能意味着什么？"
 me_zhangzhung_18_desc:0 "当我们在[GetProvince('(int32)5557').GetName]，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]完成了一个圣地的建设，最不可思议的事情发生了。正如你所知道的，我们的苯教信仰相信动物的精神，我们的巫师和圣人经常与我们周围的动物交流。\n\n有一天早上，我们醒来时发现我们的寺庙内有一个名副其实的动物园；似乎每一种生物，从兔子、猴子、鹿、老虎、蛇、鹰和大象，都在神庙里一起做礼拜。除非我亲自看到，否则我不会相信这个故事。"
 me_zhangzhung_18_title:0 "$01_zhangzhung_missions_task_18$"
 me_zhangzhung_18_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_18$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_19.a:0 "说到面包，我们手上有吗？我有点饿了"
 me_zhangzhung_19_desc:0 "在山区长大意味着你很快就会熟悉饥饿的痛苦，因为冬天是严酷的，饱腹变得像洗热水澡一样稀少和奢侈。不过，通过仔细的计划，最坏的情况是可以缓解的，特别是如果您有一个像 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 这样认真的领导者。\n\n虽然在预算紧张的情况下，把钱花在农场上并不受欢迎，但每个人都能享受到直接从烤箱里烤出来的新鲜面包——这是一种更频繁地享受到的享受，因为我们巧妙地在山上建造了粮仓，扩大了我们的储存能力。我们真的有一位有远见的领导人带领我们的国家前进。"
 me_zhangzhung_19_title:0 "$01_zhangzhung_missions_task_19$"
 me_zhangzhung_19_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_19$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_1_desc:0 "当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]连续两天收到报告说，来自[GetProvince('(int32)5588').GetArea.GetName]的土匪已经越过我们的边界，杀害了一些当地人，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的愤怒是不言而喻。意识到这种情况只会继续恶化，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]做出了一个艰难的决定，在外国土地上伪造宣称。虽然一些长老怀疑这条道路是否正确，但在这个问题上已经无话可说。"
 me_zhangzhung_1_title:0 "$01_zhangzhung_missions_task_1$"
 me_zhangzhung_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_1$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_2.a:0 "我们不是来这里自找麻烦的"
 me_zhangzhung_20.a:0 "请在我们这里住上一段时间，享受我们的热情款待。"
 me_zhangzhung_20_desc:0 "当外国人第一次听说我们主要生活在山区时，他们总是不知道该怎么想——有些人可能想象我们一定住在山洞里。虽然我们听到这些故事时会发笑，但我们向任何希望亲自访问所谓'山地王国'的人发出邀请，因为有些人已经习惯于如此称呼我们的国家。\n\n你很快就会发现，我们和许多其他国家一样文明，我们的城市可以为旅行者提供愉悦，可以与你在伟大王国的传说首都找到的任何东西相媲美。"
 me_zhangzhung_20_title:0 "$01_zhangzhung_missions_task_20$"
 me_zhangzhung_20_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_20$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_21.a:0 "我接受这一神圣的职责，并向你发誓，我将尽我所能"
 me_zhangzhung_21_desc:0 "当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]第一次承担起指挥我们人民的职责时，很少有人能预见[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]流星般的崛起并达到权力的绝对巅峰，然而我们在这里-也许连诸神本身都感到惊讶。\n\n发生了这么多事，如果再去叙述[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的那么多事迹，那将是一件愚蠢的事情，此外，会有很多诗人和吟游诗人整晚都在唱那些故事。然而，在狂欢开始之前，有一个加冕仪式，我们必须参加。"
 me_zhangzhung_21_title:0 "$01_zhangzhung_missions_task_21$"
 me_zhangzhung_21_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_21$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_22.a:0 "正是我们的多样性给了我们力量；你不明白吗？"
 me_zhangzhung_22_desc:0 "当不同的人能够聚集在一起，尽管他们有不同的背景，并为更大的利益而努力，这是一件美好的事情，无论是在军事上确保我们国家的边界，还是像一起在公共领域工作这样平凡的事情。\n\n无论某人是士兵还是农民，我们都希望我们所有的阶层之间能够和谐，因为和平和相互理解是我们能够前进的唯一途径。"
 me_zhangzhung_22_title:0 "$01_zhangzhung_missions_task_22$"
 me_zhangzhung_22_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_22$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_23.a:0 "我们不会轻易放弃山口"
 me_zhangzhung_23_desc:0 "我们毫不怀疑，在未来某个黑暗的日子里，侵略者的军队会从地平线上出现，进入我们的家园。虽然我们不能保证这种不幸永远不会发生，但我们可以确保在这一时刻到来时，我们做好了准备。通过在我们边境上控制的每一个山口附近建立堡垒，我们至少可以说我们不会被打得措手不及。"
 me_zhangzhung_23_title:0 "$01_zhangzhung_missions_task_23$"
 me_zhangzhung_23_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_23$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_24.a:0 "我们希望这不会在政治上使事情复杂化"
 me_zhangzhung_24_desc:0 "虽然一些谨慎的声音认为，发动征服战争是在寻求灾难，特别是当我们考虑到在印度可以找到的帝国的力量时，正是他们的力量迫使我们确保山麓的安全——我们希望尽可能多的警告，在他们和我们之间有某种缓冲区域。"
 me_zhangzhung_24_title:0 "$01_zhangzhung_missions_task_24$"
 me_zhangzhung_24_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_24$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_25.a:0 "我一生中从未见过如此壮丽的场景"
 me_zhangzhung_25_desc:0 "尽管对我们的人民来说，在战争中使用马匹仍有些陌生，因为他们无法在陡峭山坡上好好学习骑乘，但我们发现自己能够得到世界上一些最优秀的马匹。因此，这是一项值得投入时间和资源去掌握的技能。诚然，我们可以在市场上出售马匹，但让这些致命的野兽加入军队也会带来军事上的好处。"
 me_zhangzhung_25_title:0 "$01_zhangzhung_missions_task_25$"
 me_zhangzhung_25_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_25$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_26.a:0 "世界很快就会了解关于我们的一切......"
 me_zhangzhung_26_desc:0 "进入我们国家的人寥寥无几，因为进入山区的道路险恶而不受欢迎，而且由于我们远离低地的城市，人们对我们的民众有很多猜测和偏见。\n\n由于毁灭性战争的传言向我们袭来，我们被隔离在遥远的北方，因此决定现在是我们正式登场的时候了。"
 me_zhangzhung_26_title:0 "象雄，群山之国"
 me_zhangzhung_26_tooltip:0 "是时候创造历史了..."
 me_zhangzhung_2_desc:0 "虽然从我们在[GetProvince('(int32)5573').GetName]的新定居点到南部摩揭陀邻居的一些令人印象深刻的城市只有几天的路程，但我们必须承认，把我们带到山那边的并非友好关系。我们应当足够友好，只要我们边界的完整性得到强大的孔雀的尊重。"
 me_zhangzhung_2_title:0 "$01_zhangzhung_missions_task_2$"
 me_zhangzhung_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_2$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_3.a:0 "我们的士兵将获得经验，他们可以..."
 me_zhangzhung_3_desc:0 "虽然对苯教信仰的同胞挥舞武器让[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]感到烦恼，但我们的战争有其公正的一面；我们只想统一我们分散的人民，使我们的信仰之光能够真正绽放。随着时间的推移，我们希望我们的侵略罪孽得到宽恕......或者至少被遗忘。\n\n尽管如此，在与兄弟的战争中寻求荣耀，还是有一些感觉不对。"
 me_zhangzhung_3_title:0 "$01_zhangzhung_missions_task_3$"
 me_zhangzhung_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_3$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_4.a:0 "我们的期望值仍然很低，但我们希望能有惊喜"
 me_zhangzhung_4_desc:0 "我们收到消息，我们中最优秀和最聪明的人正在研究他们在[GetProvince('(int32)5630').GetName]中发现的文件。希望我们能从藏区积累的智慧中学习到一两样东西——毕竟，也许我们这些毫无价值的表兄弟最终可能会有好处。"
 me_zhangzhung_4_title:0 "$01_zhangzhung_missions_task_4$"
 me_zhangzhung_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_4$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_5.a:0 "我们要发财了！绝对的富有！"
 me_zhangzhung_5_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们有一个重要的消息，虽然我们的一些人害怕进入洞穴，但他们最终还是习惯了洞穴探险，最终找到了宝石的来源。一个我们以前用来放牛的地区很快就会是世界上最好的钻石出产地之一——这是多么不可思议的转折啊！"
 me_zhangzhung_5_title:0 "$01_zhangzhung_missions_task_5$"
 me_zhangzhung_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_5$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_6.a:0 "我们不可能对所发生的一切负责......"
 me_zhangzhung_6_desc:0 "战争总是一件可怕的事情，当它是针对自己的兄弟而不是外敌发动的时候，感觉会更糟糕。除了对在这些冲突中失去生命的无辜灵魂表示遗憾外，没有什么可说的；我们希望他们的天堂之旅不受罪孽和业障的阻挠。"
 me_zhangzhung_6_title:0 "$01_zhangzhung_missions_task_6$"
 me_zhangzhung_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_6$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_7.a:0 "这些墙会保护你们的母亲和孩子——别忘了"
 me_zhangzhung_7_desc:0 "尽管我们的士兵们正咬牙切齿地想在他们的手下获得更多的战斗经验，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经命令利用他们来协助正在[GetProvince('(int32)5594').GetArea.GetName]省的建设努力。虽然许多人不高兴他们举起的是石头而不是剑，但这都是为了更好的发展——有了坚实的防御工事网络，我们都会更安全。"
 me_zhangzhung_7_title:0 "$01_zhangzhung_missions_task_7$"
 me_zhangzhung_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_7$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_8.a:0 "我们为我们的人民带来荣耀——让我们冒险进入这些陌生的土地"
 me_zhangzhung_8_desc:0 "新的一天来临了，在这一天里，我们离开家乡熟悉的山谷和山路，去征服我们祖先不知道的地方。\n\n也许我们的祖先不够强大，无法与外国人作战，或者他们尊重一些传统，而我们显然已经忘记了——因为我们毫无顾虑地进入帕米尔山脉。"
 me_zhangzhung_8_title:0 "$01_zhangzhung_missions_task_8$"
 me_zhangzhung_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_8$#!”$mission_completed_tooltip_2$"
 me_zhangzhung_9.a:0 "这很愚蠢——我们会没事的"
 me_zhangzhung_9_desc:0 "有人说，没有向导就不要进入塔里木盆地，因为任何愚蠢的人都会发现自己很快就会迷失在沙漠的沙丘中--许多入侵的军队被变幻的沙子吞噬，再也回不了家。值得庆幸的是，我们的银子已经足以收买到一些当地人的忠诚，但如果说我们的士兵没有一点害怕，那是在撒谎。"
 me_zhangzhung_9_title:0 "$01_zhangzhung_missions_task_9$"
 me_zhangzhung_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_zhangzhung_missions_task_9$#!”$mission_completed_tooltip_2$"
 mountain_granaries:0 "山地粮仓"
 mountain_power:0 "山地王国"
 one_tent:0 "在一个屋檐下"
 persuasive_bon:0 "有说服力的苯教信仰"
 secure_borders:0 "安全边境"
 state_investments:0 "国家投资"
 the_gates_of_parsni_mod:0 "波萨尼之门"
 three_texts:0 "三个神圣的苯教经典"
 three_texts_desc:0 "我们的骑手为了寻找辛饶弥沃的出生地，已经几乎到了陆地的边缘，现在他们带着神圣的宗教文本回来了。"
 walls_of_gilgit_tt:0 "#Y #T Parsni#!领土需要一座#!#G 要塞#!。"

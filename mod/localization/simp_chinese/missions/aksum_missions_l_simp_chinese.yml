l_simp_chinese:
 aksum_development_decision_1:0 "埃塞俄比亚的文明中心"
 aksum_development_decision_1_desc:0 "我们做了一些人错误地认为不可能的事；通过在我们的阿克苏姆的城市建设一个伟大的大都市，我们无疑是埃塞俄比亚文明中心。"
 aksum_development_decision_1_tt:0 " #Y 阿克苏姆#! 省拥有大都市的领土和至少有 #Y 5#! 领土不少于 #Y 5#! 建筑。"
 aksum_development_decision_2:0 "伟大的马赫尔神庙"
 aksum_development_decision_2_desc:0 "马赫尔，这位仁慈地地驱散敌人的战神，像风中的谷糠一样，赐予阿克苏姆胜利，祂值得拥有一座伟大的神庙。让我们开始建造以便我们可以得体地举办庆祝仪式。"
 aksum_mission_1_ethiopia:0 "阿克苏姆的崛起"
 aksum_mission_1_ethiopia_BUTTON_TOOLTIP:0 "埃塞俄比亚将是我们的!"
 aksum_mission_1_ethiopia_CRITERIA_DESCRIPTION:0 "当我们保证了对埃塞俄比亚周边地区的霸权时，这项任务才算完成。"
 aksum_mission_1_ethiopia_DESCRIPTION:0 "阿克苏姆王国坐落在埃塞俄比亚多山的高地，无论从字面上还是比喻上，都处于十字路口——有许多人穿越我们的王国，惊叹于我们的奇迹。 然而，在这些土地上，大胆的人有很多机会； 通过准备征服我们的邻国，我们将控制这些蜿蜒穿过遥远地区的富饶贸易路线。"
 aksum_mission_1_ethiopia_task_1:0 "阿克苏姆王国"
 aksum_mission_1_ethiopia_task_10:0 "发展基础设施"
 aksum_mission_1_ethiopia_task_10_DESC:0 "我们建造的越多，我们的建筑师就被训练得越好。 Aksumite 的基础设施是我们地区最好的，我们应该继续在资金允许的情况下尽快为建设提供资金。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 aksum_mission_1_ethiopia_task_10_tt:0 "至少有 #Y 3#! 块领土在 #Y $aksum_area$#! 地区并拥有不少于 #Y 3#! 个建筑."
 aksum_mission_1_ethiopia_task_11:0 "沿海贸易"
 aksum_mission_1_ethiopia_task_11_DESC:0 "我们生产世界各地都需要的各种贸易商品，我们的员工也在慢慢地品尝到市场上出售的更精美的商品。 陆路路线有利可图，但进展缓慢； 我们应该加强我们通过阿拉伯湾进行贸易的能力。 扩大我们的港口！\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 aksum_mission_1_ethiopia_task_11_tt:0 "任何领土至少拥有 #Y 2#! 港口建筑."
 aksum_mission_1_ethiopia_task_12:0 "没药问题"
 aksum_mission_1_ethiopia_task_12_DESC:0 "没药是我们在Matara生产的有价值的贸易商品，在市场上的价格总是很高，而市场的需求总是超过供应。 我们可以做些什么来生产更多吗？\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 aksum_mission_1_ethiopia_task_1_DESC:0 "我们邻国的土地将由我们更好地管理，这就是我们需要声明它的原因。 让我们的愿望在整个地区广为人知，并告诉我们的人为战斗做好准备。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 aksum_mission_1_ethiopia_task_1_tt:0 "获得对 #Y $aksum_area$#!, #Y $tana_area$#!, 和 #Y $ona_area$#!省的宣称。"
 aksum_mission_1_ethiopia_task_2:0 "养育人民"
 aksum_mission_1_ethiopia_task_2_DESC:0 "我们的农田很少，而构成我们土地核心的岩石山坡往往收成不佳。 我们绝对必须确保为我们的人民提供食物，尤其是当人们想到军队在胃上行军的格言时。 这已成为国家安全问题。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 aksum_mission_1_ethiopia_task_2_tt:0 "任何一个产粮省份至少生产 #Y 2#! 商品。"
 aksum_mission_1_ethiopia_task_3:0 "伟大的[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]城"
 aksum_mission_1_ethiopia_task_3_DESC:0 "我们的首都已经让我们的邻居羡慕不已； 确实，附近没有其他城市可以声称是平等的。 然而，我们可以做的还有更多； 打开宝库，召唤建造者。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 aksum_mission_1_ethiopia_task_4:0 "统治阿克苏姆"
 aksum_mission_1_ethiopia_task_4_DESC:0 "麦阿德拉沙和达莫特那可笑的“国王”声称阿克苏姆省的部分地区属于他们，但很快他们就会知道自己只配当你的垫脚石。\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 aksum_mission_1_ethiopia_task_5:0 "攻击Tenesis"
 aksum_mission_1_ethiopia_task_5_DESC:0 "你有很多渴望将特尼西斯省据为己有的理由，其中最主要的是进入阿拉伯半岛的水域。用不了多久，阿克苏姆人的船只就会从阿杜利港驶出。\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 aksum_mission_1_ethiopia_task_6:0 "进入塔纳"
 aksum_mission_1_ethiopia_task_6_DESC:0 "我们决定将我们的边界推向南方； 在我们的王国触及塔纳湖水域之前，我们不会停息。 瓜纳拉国王很快就会永远被打倒。\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 aksum_mission_1_ethiopia_task_6_tt:0 " #Y $aksum_area$#! 省至少有任意两种不同的 #Y 省份投资#! 。"
 aksum_mission_1_ethiopia_task_7:0 "一个崛起的国家"
 aksum_mission_1_ethiopia_task_7_DESC:0 "阿克苏姆王国不满足于固步自封，而是对自己进行投资，因为他知道一个强大、繁荣的家园是实现未来强权的必要条件。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 aksum_mission_1_ethiopia_task_8:0 "阿克苏姆的统一"
 aksum_mission_1_ethiopia_task_8_DESC:0 "由于我们胜利的国王鼓舞人心的领导，我们建立了一个真正配得上阿克苏姆人的王国。 人们欢欣鼓舞，金币流入我们的金库；为阿克苏姆之主 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 欢呼！\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 aksum_mission_1_ethiopia_task_8_tt:0 "解锁多个独特决议"
 aksum_mission_1_ethiopia_task_9:0 "象牙贸易的萌芽"
 aksum_mission_1_ethiopia_task_9_DESC:0 "我们很幸运能够接触到大象，因此，我们也生产象牙作为奢侈品，尽管数量很少。 如果我们决定这样做，通过一点点投资，无疑可以发展我们的象牙贸易。\n\n\n\n\n\n\n\n\n\n@egypt_mil20!"
 aksum_mission_1_ethiopia_task_9_tt:0 "任何产出 #Y 大象t#! 省份至少有 #Y 2#! 商品和不少于 #Y 15#! 人口。"
 aksum_mission_2_nubia:0 "尼罗河下游"
 aksum_mission_2_nubia_BUTTON_TOOLTIP:0 "努比亚将是我们的!"
 aksum_mission_2_nubia_CRITERIA_DESCRIPTION:0 "扩张的时候到了,合并领国土地的同时向西推进我们的国界.当我们确保对Nubia地区的霸权,军事行动将被认为完成"
 aksum_mission_2_nubia_DESCRIPTION:0 "我们将带领王国走向伟大。"
 aksum_mission_2_nubia_task_1:0 "向努比亚进军"
 aksum_mission_2_nubia_task_10:0 "埃及多神教冲突"
 aksum_mission_2_nubia_task_10_DESC:0 "虽然我们的土地上有一些外国宗教的影响, 埃及信仰有着最牢固的根基，这是我们希望看到的变化。\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 aksum_mission_2_nubia_task_10_tt:0 "至少拥有 #Y 2#! 省其中 #Y 90%#! 的领土是 #Y 埃及多神教#!信仰。"
 aksum_mission_2_nubia_task_11:0 "阿拉伯多神教影响"
 aksum_mission_2_nubia_task_11_DESC:0 "阿拉伯信仰在我们的土地上扩大, 由行商携带并在我们的人民中传播。然而，国家可以采取一些措施来确保这一进程加快。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 aksum_mission_2_nubia_task_12:0 "阿克苏姆基础设施"
 aksum_mission_2_nubia_task_12_A_loc_1:0 "(#R [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_cities_current')|0]#!/#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_cities_total')|0]#!)"
 aksum_mission_2_nubia_task_12_A_loc_2:0 "(#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_cities_current')|0]#!/#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_cities_total')|0]#!)"
 aksum_mission_2_nubia_task_12_B_loc_1:0 "(#R [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_buildings_total')|0]#!)"
 aksum_mission_2_nubia_task_12_B_loc_2:0 "(#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_buildings_total')|0]#!)"
 aksum_mission_2_nubia_task_12_DESC:0 "为了真正地传播我们的文化, 我们需要尽可能广泛地扩展我们的基础设施, 特别是在我们获得的更为空旷的省份。我们所有的领土都应该有繁荣的机会。 \n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 aksum_mission_2_nubia_task_12_tt:0 " #Y $kumuzia_area$#!, #Y $atbaras_area$#!, 和 #Y $gash_area$#! 省包含 #Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_cities_total')|0]#! 城 (现在t: [SCOPE.GetRootScope.GetCountry.Custom('aksum_mission_2_nubia_task_12_A_loc')]"
 aksum_mission_2_nubia_task_12_tt_2:0 " #Y $kumuzia_area$#!, #Y $atbaras_area$#!, 和 #Y $gash_area$#! 省有一个混合的 #Y [SCOPE.ScriptValue('aksum_mission_2_nubia_task_12_buildings_total')|0]#!建筑 (现在: [SCOPE.GetRootScope.GetCountry.Custom('aksum_mission_2_nubia_task_12_B_loc')]"
 aksum_mission_2_nubia_task_12_tt_3:0 " #Y $kumuzia_area$#!, #Y $atbaras_area$#!, 和 #Y $gash_area$#! 省没有正在进行的建筑项目。"
 aksum_mission_2_nubia_task_13:0 "丰饶平原"
 aksum_mission_2_nubia_task_13_DESC:0 "这些都是我们在这里拥有的肥沃土地，尽管目前它们没有得到充分利用，这是因为我们缺乏适当的资源和人力来利用大自然的恩赐。 让我们建设城市，希望人们能来这里生活。\n\n\n\n\n\n\n\n\n\n@greek_mil7!!"
 aksum_mission_2_nubia_task_13_tt:0 "#Y $qadarif_area$#!，#Y $gezira_area$#!和#Y $kartub_area$#! 每个省至少拥有  #Y 2#! 座建有 #Y 3#! 个建筑的城市。"
 aksum_mission_2_nubia_task_14:0 "麦罗埃阴谋"
 aksum_mission_2_nubia_task_14_DESC:0 "麦罗埃岛的确是非凡的；它的前任主人库施应该为他们能够完成的成就感到骄傲。 然而，阿克苏姆对这座城市的贡献将超过我们之前的任何人；尽管放心吧。 \n\n\n\n\n\n\n\n\n\n@event_pic10!"
 aksum_mission_2_nubia_task_1_DESC:0 "吞并邻国的土地对我们未来的成功很重要；我们不能让任何接近我们的人威胁到我们在该地区的计划。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 aksum_mission_2_nubia_task_1_tt:0 "获得 #Y $gash_area$#!, #Y $atbaras_area$#!, 和 #Y $kumuzia_area$#! 省的宣称。"
 aksum_mission_2_nubia_task_2:0 "保卫加什"
 aksum_mission_2_nubia_task_2_DESC:0 "向西延伸, 当地人称为加斯的土地有些荒无人烟, 人口稀少的流浪部落，一旦我们征服了他们，就不会对我们构成真正的威胁。 \n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 aksum_mission_2_nubia_task_3:0 "进攻阿特巴拉斯"
 aksum_mission_2_nubia_task_3_DESC:0 "众所周知，阿特巴拉斯地区的阿布利亚塔城是南北贸易路线的重要站点。谁控制了这个城市，谁就控制了这个地区；我们知道该做什么。 \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 aksum_mission_2_nubia_task_4:0 "进入库穆齐亚"
 aksum_mission_2_nubia_task_4_DESC:0 "库穆齐亚是一个满是森林的地区，这里充满了各种有价值的商品，这些商品将增加我们已经相当可观的资源。通过迁移到南方并使自己在当地立足，我们为成功的未来奠定了基础。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 aksum_mission_2_nubia_task_5:0 "库施矛盾"
 aksum_mission_2_nubia_task_5_DESC:0 "随着我们影响力的增长, 我们发现自己正在与库施的政权发生冲突, 他们已经对我们的扩张表现出了不满。我们有理由相信，我们两国人民之间的冲突是不可避免的。\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 aksum_mission_2_nubia_task_5_tt:0 "获得 #Y $nubia_region$#!地区的宣称"
 aksum_mission_2_nubia_task_6:0 "麦罗埃的终结"
 aksum_mission_2_nubia_task_6_DESC:0 "麦罗埃岛是我们的！我们通过夺取了库施珍贵的首都，彻底羞辱了她； 对他们来说，这是无法挽回的。我们的军队继续前进！\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 aksum_mission_2_nubia_task_7:0 "弓之地"
 aksum_mission_2_nubia_task_7_DESC:0 "外国人给我们的土地起了一个绰号，显示了我们恐怖的军事实力,  '弓之地'. 我们确实通过弓弦征服了很多地方，所以这个称号是当之无愧的，符合我们的优雅。 \n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 aksum_mission_2_nubia_task_8:0 "说服阿卢特"
 aksum_mission_2_nubia_task_8_DESC:0 "我们已经决定，让他们未来在阿卢特的最大利益与我们一致; 不管是外交上还是在军事上完全取决于他们。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 aksum_mission_2_nubia_task_9:0 "向西部扩张"
 aksum_mission_2_nubia_task_9_DESC:0 "虽然有些人指责我们恣意的地发动征服战争, 但我们知道，我们向西扩张的真正目的是确保该地区的和平。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 aksumite_agriculture:0 "阿克苏姆人的农业"
 aksumite_construction:0 "阿克苏姆人的建筑"
 aksumite_conversion_state_mod:0 "阿克苏姆人的改变"
 aksumite_fortifications:0 "阿克苏姆的防御工事"
 aksumite_fortifications_desc:0 "阿克苏姆建筑师建造的防御工事令人生畏，任何愚蠢地希望翻越宽大城墙的军队都会感到绝望。"
 aksumite_influence_mod:0 "阿克苏姆人的影响"
 aksumite_influence_state_mod:0 "阿克苏姆人的影响"
 arabic_influence_country_mod:0 "阿拉伯多神教的影响"
 blessing_of_maher:0 "马赫赐福"
 center_of_ivory_trade:0 "象牙贸易中心"
 center_of_myrrh_trade:0 "没药贸易中心"
 center_of_trade_aksum:0 "阿克苏姆贸易中心"
 city_of_axum:0 "阿克苏姆城"
 great_builders_of_aksum_state_mod:0 "阿克苏姆的伟大建筑"
 heart_of_the_kingdom_state_mod:0 "王国的心脏"
 kemetic_clashes_country_mod:0 "埃及多神教冲突"
 kings_of_aksum:0 "阿克苏姆诸王"
 masters_of_nubia:0 "努比亚的主人"
 masters_of_nubia_country_mod:0 "努比亚的主人"
 me_aksum_nubia_1.a:0 "如果他们对此有问题，就让他们试着阻止我们"
 me_aksum_nubia_10.a:0 "一定要给工人们大量啤酒以示感谢"
 me_aksum_nubia_10_desc:0 "经验是最好的老师,当说到城市建设,没人会声称AKsum的建筑师是新手.虽然在炎热并尘土飞扬的土地上工作很难,但我们的人出色的完成了任务.并在此过程学会了一些技巧;我们可以在王国其余地方利用这些技术"
 me_aksum_nubia_10_title:0 "$aksum_mission_1_ethiopia_task_10$"
 me_aksum_nubia_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_10$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_11.a:0 "我们正慢慢变得富有 "
 me_aksum_nubia_11_desc:0 "虽然我们的海滨是沙漠,环境恶劣,不欢迎外地人,但我们做到了其他人未做到的事情;通过在不毛之地修建港口,我们创造了真正的绿洲,商人和旅行者在冒险去其他遥远的地方前聚集在这.我们的海报贸易正蓬勃发展,我们的国库随着税收膨胀."
 me_aksum_nubia_11_title:0 "$aksum_mission_1_ethiopia_task_11$"
 me_aksum_nubia_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_11$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_12.a:0 "AKsum人有福了,谁有如此财富?"
 me_aksum_nubia_12_desc:0 "据说你在看到Matara 城前就可以闻到它的味道.沿着离开AKsum的路,一路向东北行,沿着起伏的山丘,山丘变成山峰.你走的越远路越难走,就在人和驮畜看起来将要因疲惫而晕倒,他们的鼻孔竖了起来;尘土飞扬的风中携带着香气,你第一次示意Matara 就在远处,没药产于这城的作坊,磨坊是此城命脉,确保了这篇偏远地区的繁荣."
 me_aksum_nubia_12_title:0 "$aksum_mission_1_ethiopia_task_12$"
 me_aksum_nubia_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_12$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_1_desc:0 "现在没有回头路了； 你对塔纳和特涅西斯土地的宣称已被公之于众，信使将你的宣言传递给你邻居的法庭。 虽然你被指责为威胁我们祖国和平的战争贩子，但你不禁嘲笑侮辱； 这就是你的敌人计划做的吗？"
 me_aksum_nubia_1_title:0 "$aksum_mission_1_ethiopia_task_1$"
 me_aksum_nubia_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_1$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_2.a:0 "你为阿克苏姆做了一件伟大的事情，我很高兴"
 me_aksum_nubia_2_desc:0 "现在还很早； 太阳刚刚升起在阿拉伯湾的水面上，但炎热已经令人窒息和枯萎； 幸好你不会在外面待太久。 您正在访问您资助的一个农业社区，当地工程师和建筑师正在带领您参观，他们为取得的成就感到非常自豪。 当您沿着将水带入田野的运河漫步时，您不禁会被工人的聪明才智所折服。"
 me_aksum_nubia_2_title:0 "$aksum_mission_1_ethiopia_task_2$"
 me_aksum_nubia_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_2$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_3.a:0 "我们将在马赫尔神庙献祭"
 me_aksum_nubia_3_desc:0 "'那这个呢?' 你指着前面的草图，问到.经过几个月的建造,工作终于结束了, 你正在检查你的建筑师提交上来的总结报告. '嗯 是的, [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 大人' 建筑师回答道并且略微鞠着躬. '我想您会很高兴的. 我们完成的设计大大扩展了我们的商业区; 五湖四海的人们现在将涌向阿克苏姆的市场.' \n\n你站得笔直, 并拍了拍手. '我想亲眼看看你建了什么, 然后我们会向庇佑我们的诸神致敬.'"
 me_aksum_nubia_3_title:0 "$aksum_mission_1_ethiopia_task_3$"
 me_aksum_nubia_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_3$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_4.a:0 "阿克苏姆属于我，我只做了我必须做的事"
 me_aksum_nubia_4_desc:0 "在血腥的战争之后，你的敌人们尽数倒下了，他们的统治永远结束了，而且阿克苏姆省已经重新合并在一个统治者的旗下 -那就是你-.为了这一天的到来，让许多人不得不死去是不幸的，但你心里知道，必须做出这种艰难的决定，甚至是现在，邻国开始给予你以前没有的尊重；未来的辉煌必将值得今天付出的代价。"
 me_aksum_nubia_4_title:0 "$aksum_mission_1_ethiopia_task_4$"
 me_aksum_nubia_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_4$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_5.a:0 "今天，我们历史上的新篇章开始了。"
 me_aksum_nubia_5_desc:0 "阿杜利斯城的防御工事可以居高临下的观看阿拉伯湾；你正站在战火纷飞的城垛上，俯瞰混乱的场面。你最近结束的这场站在使大地满目疮痍，你的军队造成的损坏将及时修复。甚至现在,一队队人正努力修复城墙；你轻吹口哨同时看这成百上千工人安置巨大的石块到位，不久后，港口将被建筑工人清空，商船将就位——你等不及了."
 me_aksum_nubia_5_title:0 "$aksum_mission_1_ethiopia_task_5$"
 me_aksum_nubia_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_5$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_6.a:0 "我们将在 Blue Nile河的水中洗澡"
 me_aksum_nubia_6_desc:0 "你在Semien 的战役已经结束,你决定在tana湖进行巡游庆祝胜利,现在,你可以进入这片水域.当你看着工人把葡萄酒和粮食装上驳船,你不禁反思这条蜿蜒的河此刻把你带到这.AKsum曾只是一片山地溪谷,而你如今控制了河流和山谷-生活有时很奇怪,有曲折.拿起一枚多汁的椰枣放入嘴中,缓慢咀嚼,享受当下;麻烦可能随黎明而来,但现在,你感到满足."
 me_aksum_nubia_6_title:0 "$aksum_mission_1_ethiopia_task_6$"
 me_aksum_nubia_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_6$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_7.a:0 "贤王关心他的子民"
 me_aksum_nubia_7_desc:0 "由于您下令进行的省份投资，Aksum正在享受一段不同于其传奇历史的时期。看来[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的先见之明正在得到回报， 由此带来的研究推动将使我们走的更远。这是一个值得庆祝的日子!"
 me_aksum_nubia_7_title:0 "$aksum_mission_1_ethiopia_task_7$"
 me_aksum_nubia_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_7$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_8.a:0 "我才刚开始,你会看到未来发生什么."
 me_aksum_nubia_8_desc:0 "写阿克苏姆的历史时, 会有一个名字先于其他人被记住; 那就是[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], 统一了之前无主的土地的统治者, 并击败了觊觎者，为我们的人民建立了宏伟的城市. 还有谁像我们的国王? 所有荣誉归于[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName], 所有荣誉归于阿克苏姆!"
 me_aksum_nubia_8_title:0 "$aksum_mission_1_ethiopia_task_8$"
 me_aksum_nubia_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_8$#!”$mission_completed_tooltip_2$"
 me_aksum_nubia_9.a:0 "多么,可爱,体贴的礼物!"
 me_aksum_nubia_9_desc:0 "最近你下令使国中象牙产量增加两倍.你比大多数人更清楚象牙是多么珍贵.尤其在它们被大师级工匠加工过以后.经过一段时间的投资,得知Aksum 正以象牙贸易的中心而闻名,你异常开心.某些产于你旗下工坊的商品因品质令人震惊;你特别中意一根商人赠送的象牙权杖.作为你对这个迅速增长行业作出周到管理的感谢."
 me_aksum_nubia_9_title:0 "$aksum_mission_1_ethiopia_task_9$"
 me_aksum_nubia_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_1_ethiopia_task_9$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_1.a:0 "任何注意的人都会预见到这一时刻"
 me_aksum_upper_nubia_10.a:0 "诸神会保佑虔诚者!"
 me_aksum_upper_nubia_10_desc:0 "威卡教（埃及信仰）在这片土地上有着古老的根基，即使许多的国王和僭主都尝试过移除它并扶持自己的信仰.但我们尊重这些习俗，问题重点是我们不能接受我们人民之间的宗教分歧，所以我们已经决定在该地区温和地施加压力，希望让最后的一些落伍者放弃他们的习俗，去接受我们的正路."
 me_aksum_upper_nubia_10_title:0 "$aksum_mission_2_nubia_task_10$"
 me_aksum_upper_nubia_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_10$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_11.a:0 "给人民展示众神的道路是我们的使命."
 me_aksum_upper_nubia_11_desc:0 "我们让 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 作为我们的国王这是何等的幸事！我们的军队在战场上几乎无人能挡,但即使在和平时期 我们也无忧无虑，感谢我们一手创就的现在，阿拉伯信仰继续繁荣，很快我们的整个社会就会成为一个整体 ，我们当今有很多事情要庆祝！"
 me_aksum_upper_nubia_11_title:0 "$aksum_mission_2_nubia_task_11$"
 me_aksum_upper_nubia_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_11$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_12.a:0 "从哪里来的将有更多！"
 me_aksum_upper_nubia_12_desc:0 "看来我们的建设计划，在[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]顽强意志的指挥和资助下，正在开始获得回报。 我们不仅大幅增加了该地区的建筑数量，而且开始看到这种前瞻性思维带来的税收效益。 我们的王室管事告诉我们，我们收集了一大笔横财，并将其存入我们的国库。"
 me_aksum_upper_nubia_12_title:0 "$aksum_mission_2_nubia_task_12$"
 me_aksum_upper_nubia_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_12$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_13.a:0 "即使是沙漠的废土也会结出甜美的果实。。。"
 me_aksum_upper_nubia_13_desc:0 "尽管我们拥有丰富的资源而且对众神的恩赐表达过感谢，但我们缺少了一些东西，良好的耕地就是其中一个，尽管这是个棘手的问题，但我们已经尽可能地建立基础设施，以充分利用我们的实际情况，我们很高兴地宣布，我们已经开始看到我们精心规划的结果。"
 me_aksum_upper_nubia_13_title:0 "$aksum_mission_2_nubia_task_13$"
 me_aksum_upper_nubia_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_13$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_14.a:0 "我们将为此而铭记于世"
 me_aksum_upper_nubia_14_desc:0 "[GetProvince('(int32)641').GetName]已经沦陷，尽管库施人不顾一切地试图拖延这一必然的到来。在战争的早期，我们曾担心过最坏的情况，怀疑我们的傲慢是否将我们引向了毁灭之路。但诸神还是在我们最需要的时候为我们带来了胜利。麦罗埃城外的战斗尤其激烈，因为库施的军队意识到这将是最后一战。他们曾试图重振驻军，但最终，在士气与意志的竞争中，我们胜利了。\n\n然而，我们的打算并不仅仅是征服麦罗埃而已，而是希望能美化它。我们从城边上撤走了我们的攻城器械，带来了建筑师和工程师团队，他们经过阿克苏姆人的培训，以我们的想象重建这座城市。现在，我们的工作已经完成，一个全新的麦罗埃，一个在所有可以想象的方面都超越了以前的麦罗埃，已经占据了该地区卓越城市的地位。"
 me_aksum_upper_nubia_14_title:0 "$aksum_mission_2_nubia_task_14$"
 me_aksum_upper_nubia_14_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_14$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_1_desc:0 "正如你所吩咐的, 伟大的[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]啊, 我们已经采取了必要的步骤来宣称我们的邻国领土, 为我们进行战争提供了必要的正当理由。 用不了多久，沙漠的沙子就会被敌人的鲜血染红！"
 me_aksum_upper_nubia_1_title:0 "$aksum_mission_2_nubia_task_1$"
 me_aksum_upper_nubia_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_1$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_2.a:0 "我们的敌人永远不会看到我们来......"
 me_aksum_upper_nubia_2_desc:0 "虽然我们的一些军事参谋对与于我们自己保护加斯土地的前景表示担忧, 现在我们的军事行动已经完成, 即使是最犹豫的人也不得不承认 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的计划。的确，这些荒地目前不符合我们的标准, 但它们确实为我们提供了战略优势; 不久，我们的部队就会从这些尘土飞扬的平原上走出来, 一场真正的愤怒沙尘暴将吞噬我们的敌人！"
 me_aksum_upper_nubia_2_title:0 "$aksum_mission_2_nubia_task_2$"
 me_aksum_upper_nubia_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_2$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_3.a:0 "今天阿克苏姆的阿布利亚塔城的太阳照常升起了"
 me_aksum_upper_nubia_3_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 亲自见证了 [GetProvince('(int32)7589').GetName]围城; 想占领这座城市很久了, 在我们的胜利时刻，我们的国王亲自出席是非常合适的。\n\n阿特巴拉斯的居民战斗很顽强，持续时间比任何人都要长; 毫无疑问，正是他们丰厚的贸易收入支撑了他们的持续抵抗。 在战场, 我们设法打败了他们微不足道的征召兵，甚至打败了被他们愚蠢地雇佣的雇佣兵。 很遗憾他们没有向我们敞开大门; 他们本可以让他们的人民免于围攻的残酷。 然而，这一切总有一天会成为遥远的记忆。"
 me_aksum_upper_nubia_3_title:0 "$aksum_mission_2_nubia_task_3$"
 me_aksum_upper_nubia_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_3$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_4.a:0 "你认为我们会看到河马吗？"
 me_aksum_upper_nubia_4_desc:0 "因为我们的祖国到处都是山和丘陵,非常高兴的是 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 宣布树木繁茂的库穆齐亚省现已并入阿克苏姆。 除了保护在这个地区发现的有价值的贸易品，我们的国王还一直嚷嚷着要去森林里打猎；塔纳湖周围的树林里充满了生机。"
 me_aksum_upper_nubia_4_title:0 "$aksum_mission_2_nubia_task_4$"
 me_aksum_upper_nubia_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_4$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_5.a:0 "我们将用残忍来报复这些侮辱！"
 me_aksum_upper_nubia_5_desc:0 "几周前，我们在 [GetCountry('KSH').GetName]接待来自邻国的使节, 一个带着如此粗鲁的信息以至于我们要竭力制止 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 不必当场伤害无礼的使节。 '你对人民犯下的罪行不会被忽视, [GetCountry('AXM').GetName]; 你非但没有摆正自己的位置，反而用愚蠢的自命不凡激怒了神灵。 这是一个警告，以免你发现你们的王宫被一砖一瓦拆毁，用作厕所。 想想你的妻子和孩子，因为当我们带着军队回来时，我们不会手下留情。\n\n脸色难看到说不出话, [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 走向 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] , 愤怒得发抖 - “现在立刻离开！告诉你的国王，所发生的一切不是我们的责任！"
 me_aksum_upper_nubia_5_title:0 "$aksum_mission_2_nubia_task_5$"
 me_aksum_upper_nubia_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_5$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_6.a:0 "我们会表现出他们对我们所没有的仁慈"
 me_aksum_upper_nubia_6_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]胜利地站在[GetProvince('(int32)641').GetName]城墙的垛口上，将[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]目光投向地平线。即使是现在，在战斗结束后的几个小时，长长的黑色刺鼻烟雾继续在城市中蜿蜒，就像死去的库施士兵前往冥界的影子。我们的士兵已经暂时放下了他们的武器，正在尽一切努力扑灭大火......在我们控制住一切之前，应该不会有多长时间。\n\n“麦罗埃……”[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]低声说，眼睛被泪水打湿了，虽然没有人能够分辨出这是由于情绪还是由于刺激性的烟雾。“你给自己带来了如此大的破坏和毁灭……但我将使这一切变得更好，假以时日。”"
 me_aksum_upper_nubia_6_title:0 "$aksum_mission_2_nubia_task_6$"
 me_aksum_upper_nubia_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_6$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_7.a:0 "欢迎努比亚新的主人！"
 me_aksum_upper_nubia_7_desc:0 "当我们最初达成将进军努比亚的中心地带的协议时，虽然不知道我们如何取得最终成功，但知道我们未来的生存需要这样做，许多人怀疑我们是否有能力继续这场战争。“我们的敌人太强大了，” 这些懦夫抱怨，让他们的恐惧盖过了理智，他们的贬低之词引起许多人的心中对 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]所走的路线产生了质疑。\n\n我们不会否认在做这件事的时候，我们似乎都失去了一切，但我们坚持了下来，并激发了我们潜在的力量。 现在，在我们辉煌的时刻，没有人能质疑 [GetCountry('AXM').GetName] 完成了她的命运。"
 me_aksum_upper_nubia_7_title:0 "$aksum_mission_2_nubia_task_7$"
 me_aksum_upper_nubia_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_7$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_8.a:0 "带来更多的酒"
 me_aksum_upper_nubia_8_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 正在参加一场盛宴，当一位信使打断庆祝活动向他分享一些喜讯时，他正沉浸在 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] ;  [GetCountry('AUT').GetName] 的土地现在被视为 [GetCountry('AXM').GetName] 一部分, 这是我们人民长期以来所期望的结果。"
 me_aksum_upper_nubia_8_title:0 "$aksum_mission_2_nubia_task_8$"
 me_aksum_upper_nubia_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $aksum_mission_2_nubia_task_8$#!”$mission_completed_tooltip_2$"
 me_aksum_upper_nubia_9.a:0 "死亡将不再降临这片土地"
 me_aksum_upper_nubia_9_desc:0 "在战斗许多年之后,看起来我们终于平定了杰济拉和加达里夫的土地.将不再有敌军不受阻碍就能进军泛洪平原, 不在有敌人能在这片土地上播下毁灭的种子. 一个在[GetCountry('AXM').GetName]的庇护下极其的繁荣的新时代，将取代强奸和饥荒的艰苦日子。."
 me_aksum_upper_nubia_9_title:0 "$aksum_mission_2_nubia_task_9$"

 hcp_merc_focus:0 "雇佣兵重点"
 hcp_mesopotamia_farms.tt:0 "在 [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] 地区，至少有 #Y 10#! 个生产食品贸易品的定居点具有#Y 农业定居点#!。"
 hcp_mesopotamia_happy.tt:0 "在接下来的 #Y 5#! 年内，每个位于 [GetProvince('(int32)918').GetArea.GetRegion.GetName|Y] 的省份都将获得：\n\n[GetModifier('hcp_return_of_the_king').GetDesc]"
 hcp_military_reform_underway.tt:0 "我们将开始改革军队的过程，并能在几个临时修饰语之间做出选择。\n\n如此激进的做法可能会降低我们的#Y 军事经验#!，但长期的好处超过风险！"
 hcp_mission_01:0 "最后的阿契美尼德王朝"
 hcp_mission_01_BUTTON_DETAILS:0 "最后的阿契美尼德王朝"
 hcp_mission_01_BUTTON_TOOLTIP:0 "尽管我们已经衰落，但我们不会悄无声息地消失！"
 hcp_mission_01_CRITERIA_DESCRIPTION:0 "当我们扩展了对北本都海岸的统治并稳固了我们王朝的地位后，该使命将被视为完成。"
 hcp_mission_01_DESCRIPTION:0 "曾经统治着世界上最大帝国的阿契美尼德王朝，如今已沦为远离故土、被外国势力包围的小国！"
 hcp_mission_01_task_01:0 "确保继承权"
 hcp_mission_01_task_01_DESC:0 "阿马斯特里斯的儿子奥克西亚雷斯和克里阿尔科斯之间的深刻对立早已不是秘密，他们俩都贪婪地觊觎母亲的位置。\n\n也许我们可以安排他们与旧帝国中最显赫的家庭联姻，以平息他们的争斗，避免任何...极端的行为。\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
 hcp_mission_01_task_02:0 "本都联盟"
 hcp_mission_01_task_02_DESC:0 "塞萨莫斯和提翁城邦与我们有相互防御的盟约，或许通过适当的提议，我们可以将这种关系发展为对我们更有利的形式。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 hcp_mission_01_task_03:0 "稳定我们的统治"
 hcp_mission_01_task_03_DESC:0 "虽然外国敌人仍然在我们四周环绕，但我们的处境已不像以前那么岌岌可危。现在我们有了一个相当大的权力基础，可以开始考虑向外扩张我们的领土。\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 hcp_mission_01_task_04:0 "进入帕弗拉格尼亚"
 hcp_mission_01_task_04_DESC:0 "为了在未来几年中生存下去，我们的领地必须扩张。北部沿海地区帕弗拉格尼亚被认为是最合适的目标。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 hcp_mission_01_task_05:0 "建立阿马斯特里斯城"
 hcp_mission_01_task_05_DESC:0 "所谓的'塞萨莫斯城'实际上只是几个独立管理的希腊殖民地的集合。我们应该集中统治这些地方，并建立一座真正值得我们祖先的城市！\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 hcp_mission_01_task_06:0 "本都玛吉"
 hcp_mission_01_task_06_DESC:0 "虽然我们宽容待人，允许臣民自由信仰，但我们国家缺乏正式的祆教祭司（或称为 “#E 玛吉（Magi）#!”）是没有借口的。让我们邀请一些来自东方的学者，向那些愿意倾听的人传播#E 阿胡拉·玛兹达#!的光明。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 hcp_mission_01_task_07:0 "安抚玛利安底尼亚人"
 hcp_mission_01_task_07_DESC:0 "马里安迪尼亚人是色雷斯部落中的一个凶猛部落，他们对外国统治非常不满。或许需要采取更温和的方法？\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 hcp_mission_01_task_08:0 "色雷斯辅助部队"
 hcp_mission_01_task_08_DESC:0 "我们对当地色雷斯部落的支持和接纳已经结出了果实，现在许多人都加入了我们的军队。我们应该为他们建立正式的辅助军团。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 hcp_mission_01_task_09:0 "奥伦蒂德接触"
 hcp_mission_01_task_09_DESC:0 "奥伦蒂德王朝世代担任我们家族的忠实总督。让我们提醒他们我们之间的联系。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 hcp_mission_01_task_10:0 "发展锡诺普"
 hcp_mission_01_task_10_DESC:0 "城市 #E 锡诺普#! 是所有伊奥尼亚殖民地中历史最悠久的城市之一，但它已经辉煌不再。我们应该努力确保其作为主要贸易枢纽的遗产得以延续。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 hcp_mission_01_task_11:0 "安纳托利亚公民身份"
 hcp_mission_01_task_11_1.tt:0 "[GetCulture('pasargadi').GetName|Y] 文化的族群已经#Y 放宽了公民权限制#!。"
 hcp_mission_01_task_11_2.tt:0 "拥有一个带有#Y 荣誉卫队#!修饰语的整合的#Y [GetCultureGroup('anatolian').GetName|Y]#!文化。"
 hcp_mission_01_task_11_3.tt:0 "被授予公民身份后，#Y [GetCultureGroup('anatolian').GetName|Y] #!族群将离开他们的希腊压迫者并定居在我们的土地上——这无疑会给我们带来巨大的好处！"
 hcp_mission_01_task_11_DESC:0 "我们应该考虑给予安纳托利亚人更多的社会自由，因为这将带来诸多好处。\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 hcp_mission_01_task_12:0 "军事改革"
 hcp_mission_01_task_12_DESC:0 "简单的言语无法描述我们在对抗希腊人的战争中是多么的准备不足。尽管我们人数占优，亚历山大还是多次击败了我们。我们必须采取措施，确保这种情况不会再发生！\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 hcp_mission_01_task_13:0 "重新思考我们的战术"
 hcp_mission_01_task_13_DESC:0 "从我们的研究来看，显然需要对我们指挥结构和军事学说进行改革。我们的士兵可能难以适应这种不断的变化，但这将使我们能够更好地专注于创新战术。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 hcp_mission_01_task_14:0 "新不死军"
 hcp_mission_01_task_14_DESC:0 "希腊历史学家希罗多德给我们的精英步兵部队起了这个名字，因为他们的兵力始终保持在一万整。每个阵亡、重伤或生病的士兵都会立即被替换，以保持部队的凝聚力和恒定数量。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 hcp_mission_01_task_15:0 "铁甲骑兵"
 hcp_mission_01_task_15_DESC:0 "字面意思是“装甲”或“完全封闭”，铁甲骑兵源自我们帝国早期与北方斯基泰人和帕尼部落的接触。如果我们能确保有稳定的适合战争的马匹供应，我们将能够部署更多这些几乎不可阻挡的骑兵！\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 hcp_mission_01_task_16:0 "从失败中学习"
 hcp_mission_01_task_16_1.tt:0 "我们已经做出了#Y 学习希腊的战争方式#! #E 文化决议#!。"
 hcp_mission_01_task_16_2.tt:0 "我们的#Y 阿格达布#!（元帅）忠诚度至少为 #Y 75#!且属于任何 #Y [GetCultureGroup('hellenic').GetName|Y]#! 文化。"
 hcp_mission_01_task_16_DESC:0 "不可否认，亚历山大是一位天才，在战争艺术上天赋异禀。为了更好地保护自己免受其继承者的威胁，我们将尝试吸引他们战役中的老兵到我们的土地定居，因为我们能从他们那里学到很多。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 hcp_mission_01_task_17:0 "真正的波斯军队"
 hcp_mission_01_task_17_DESC:0 "这是一个巨大的工程，但我们已经组建了一支自大流士一世时代以来未曾见过的波斯军队——世界将为之颤抖！\n\n\n\n\n\n\n\n\n\n@italic_mil8!"
 hcp_mission_01_task_18:0 "本都霸权"
 hcp_mission_01_task_18_DESC:0 "我们现在是安纳托利亚北部无可争议的主宰。外国使节在我们的宫廷中争取好感，希腊人、波斯人和安纳托利亚人相对和谐地生活在一起！\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 hcp_mission_01_task_19:0 "渔业生意"
 hcp_mission_01_task_19_DESC:0 "#E 黑海#!拥有无数鱼群，投资于渔业以及[GetProvince('(int32)1807').GetName]的盐场将促进我们的经济发展和人口增长！\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 hcp_mission_01_task_20:0 "重新思考我们的关系"
 hcp_mission_01_task_20_DESC:0 "亚美尼亚人在我们迅速崛起的过程中一直是坚定的盟友。然而，作为联盟中的明显资深伙伴，或许是时候重新考虑我们的关系了...\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 hcp_mission_01_task_21:0 "希波文化"
 hcp_mission_01_task_21_DESC:0 "希腊人和波斯人有着……复杂的历史，消除我们民族之间的敌意并非易事。如果我们能放下分歧，希腊人和波斯人可以互相学习无数东西。\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 hcp_mission_01_task_22:0 "利昂托福罗斯号"
 hcp_mission_01_task_22_DESC:0 "拥有一支能够保护我们海岸并投射力量的海军后，领先的造船师提出了一个雄心勃勃（如果不是疯狂的话）的计划，建造一艘巨大的旗舰，向世界证明我们的实力！\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 hcp_mission_01_task_final:0 "阿契美尼德王国"
 hcp_mission_01_task_final_DESC:0 "尽管我们仍然远离故土，敌人众多，但阿契美尼德王朝再次成为一个强大的势力，现在是时候让世界知道我们的回归！\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 hcp_mission_02:0 "伟大的战役"
 hcp_mission_02_BUTTON_DETAILS:0 "伟大的战役"
 hcp_mission_02_BUTTON_TOOLTIP:0 "伟大的战役将成为历史上最伟大的反击战而载入史册！"
 hcp_mission_02_CRITERIA_DESCRIPTION:0 "在我们驱逐波斯的外国占领者并重建#E 阿契美尼德帝国#! 后，该任务将被视为完成。"
 hcp_mission_02_DESCRIPTION:0 "时机终于到来；我们的祖传土地已经在外族压迫下太久。现在是时候通过任何必要手段收复我们的权利！"
 hcp_mission_02_task_01:0 "重申我们的宣称"
 hcp_mission_02_task_01_DESC:0 "在开始之前，我们应该召集我们的军事和民政领导人开会，讨论我们战役的具体细节。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 hcp_mission_02_task_02:0 "阿苏尔的收复"
 hcp_mission_02_task_02_DESC:0 "在我们的帝国沦陷之前，[GetProvince('(int32)870').GetArea.GetRegion.GetName]是一个超过两个世纪的重要和平省份（除了公元前546年和前520年的两次地区级叛乱）。\n\n以战斗技能闻名的亚述士兵（以及安纳托利亚的吕底亚人）构成了阿契美尼德军队的主要重步兵力量。\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 hcp_mission_02_task_03:0 "巴比鲁什再度屈服"
 hcp_mission_02_task_03_DESC:0 "古老的[GetProvince('(int32)918').GetName]大城，以及[GetProvince('(int32)918').GetArea.GetRegion.GetName|E]的其余部分，再次落入我们的手中。这富饶的土地与我们军队不久前穿越的山脉和沙漠真是对比鲜明！\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 hcp_mission_02_task_04:0 "履行居鲁士的诺言"
 hcp_mission_02_task_04_DESC:0 "在[GetProvince('(int32)918').GetName]的修复工作中，我们的工人发现了一项惊人的发现！一块刻有阿卡德文的泥板出土，上面记载了我们的祖先——大居鲁士的工作和他的承诺，即恢复[GetProvince('(int32)918').GetName]的荣耀，并誓言所有民族都将在他的统治下和平生活。如果我们效仿这个文物上记载的行为，我们将为[GetProvince('(int32)918').GetName]的人民和阿契美尼德王朝带来荣誉！\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 hcp_mission_02_task_05:0 "恢复帝国流散人口"
 hcp_mission_02_task_05_DESC:0 "[GetProvince('(int32)918').GetArea.GetRegion.GetName|E] 曾经居住着大量波斯人，其中大多数在亚历山大的远征和继业者的战争中逃离或被杀。发展这片肥沃的地区应该能鼓励他们再次将其称为家园！\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 hcp_mission_02_task_06:0 "荣耀埃安娜和埃巴达尔"
 hcp_mission_02_task_06_DESC:0 "在以前的统治者手下，[GetDeityDefinition('omen_ishtar').GetName] 和 [GetDeityDefinition('omen_shamash').GetName] 的神圣寺庙被忽视，这两个在当地 [GetProvince('(int32)918').GetArea.GetRegion.GetName] 人民中备受尊敬的神灵受到了侮辱。我们将通过装饰他们的寺庙并在他们被蔑视的神灵名下建立美丽的城市来让我们的公民安心。\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 hcp_mission_02_task_07:0 "渡过幼发拉底河"
 hcp_mission_02_task_07_DESC:0 "在幼发拉底河西岸，坐落着叙利亚的土地，这里是 [GetCulture('aramaic').GetName|E] 和 [GetCulture('phoenician').GetName|E] 人民的家园。这片土地将在明智的 [GetCulture('pasargadi').GetName|E] 统治下繁荣！\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 hcp_mission_02_task_08:0 "收复埃伯-纳里"
 hcp_mission_02_task_08_DESC:0 "叙利亚省，或 [GetCulture('pasargadi').GetName] 中的 #E 埃伯-纳里#!，再次处于阿契美尼德的统治之下。我们的玛吉对此地区非常感兴趣，并相信人们会对智慧之主的教义作出积极回应。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 hcp_mission_02_task_09:0 "与腓尼基人谈判"
 hcp_mission_02_task_09_DESC:0 "每个人都知道亚历山大大帝围攻推罗的故事。腓尼基的寡头和商人以其独立性和海上实力而自豪。然而，通过承诺保护其商人的特权和行会，我们可以诱使独立的城市国家加入我们的影响范围。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 hcp_mission_02_task_10:0 "大流士大帝的首都"
 hcp_mission_02_task_10_DESC:0 "虽然苏萨是一座古老的城市，但它的鼎盛时期是在大流士大帝统治下，他将其作为帝国的四个皇家首都之一。我们必须尽一切努力修复马其顿占领者造成的破坏！\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 hcp_mission_02_task_11:0 "准备东方战役"
 hcp_mission_02_task_11_DESC:0 "随着我们控制了肥沃的美索不达米亚地区，我们现在可以开始向东推进到真正的波斯。雄伟的 #E 扎格罗斯山脉#! 是美索不达米亚和波斯其他地区的天然屏障，我们可以利用它使敌人更难尝试反攻。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 hcp_mission_02_task_12:0 "向波西斯省督呼吁"
 hcp_mission_02_task_12_DESC:0 "塞琉古王朝在[GetProvince('(int32)4799').GetArea.GetRegion.GetName]创建了一个总督领，试图欺骗波斯人民认为他们没有被束缚在伊奥尼亚的枷锁下！我们将直接向[GetCountry('PES').GetName|E]的总督们呼吁，给予他们摆脱外国压迫者的自由！\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 hcp_mission_02_task_13:0 "第一位立法者的土地"
 hcp_mission_02_task_13_DESC:0 "#E 迪奥凯斯#! “第一位立法者”是第一个独立米底王国的传奇创始人、沙赫和高级祭司。我们将确保他的遗产得到保障，通过将整个米底置于我们的控制之下！\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 hcp_mission_02_task_14:0 "波斯的核心地带"
 hcp_mission_02_task_14_DESC:0 "[GetProvince('(int32)4799').GetArea.GetRegion.GetName]，我们的人民的土地，几十年来一直受制于外国统治者的压迫。我们从黑海沿岸的小王国走到了今天，最终，阿契美尼德王朝回到了家乡。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 hcp_mission_02_task_15:0 "阿特罗帕特纳的臣服"
 hcp_mission_02_task_15_DESC:0 "[GetCharacter('(int32)222').GetName] 是一位明智尽责的米底总督，以至于亚历山大征服该地区后依然重新任命了他。让我们看看他的智慧是否传给了他的后代……\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 hcp_mission_02_task_16:0 "尼萨战马"
 hcp_mission_02_task_16_DESC:0 "尼萨平原的尼萨马长期以来一直是波斯贵族喜爱的马匹。我们应该开发这些马厩和繁殖地，以确保我们的军队有足够的坐骑供应。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 hcp_mission_02_task_17:0 "迪奥凯斯的宝座"
 hcp_mission_02_task_17_DESC:0 "迪奥凯斯建立了 [GetProvince('(int32)1595').GetName] 城市，并使其成为米底的第一个真正首都。不幸的是，在希腊统治下，这座城市没有得到与其遗产相称的投资。让我们尽快扭转这种衰败。\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 hcp_mission_02_task_18:0 "塞琉西亚的命运"
 hcp_mission_02_task_18_DESC:0 "在夺取了亚历山大大帝崩溃帝国的大部分之后，[GetCharacter('(int32)24').GetName] 在傲慢中放弃了强大的巴比伦，转而选择了一座以他自己名字命名的希腊殖民地！我们现在面临的问题是如何处理他的这座城市的命运？\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 hcp_mission_02_task_19:0 "独眼巨人的遗产"
 hcp_mission_02_task_19_DESC:0 "关于“独眼巨人” [GetCharacter('(int32)37').GetName] 有很多可说的。他是地中海众多小希腊国家独立的坚定捍卫者。\n\n作为一名才华横溢的将军，他多次击败其他继业者，直到最后因对手联合起来反对他而失败。尽管我们承认他的成就，但他帮助外族征服者羞辱和奴役波斯人民的遗产是否值得继续？\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 hcp_mission_02_task_20:0 "北方的安纳巴斯"
 hcp_mission_02_task_20_DESC:0 "[GetProvince('(int32)3440').GetArea.GetRegion.GetName] 的高地是波斯与北部草原和沙漠之间的天然屏障。确保这一地区的安全至关重要，因为没有它，我们将难以应对如大益这样的游牧部落的入侵。\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 hcp_mission_02_task_21:0 "东方的安纳巴斯"
 hcp_mission_02_task_21_DESC:0 "[GetProvince('(int32)6552').GetArea.GetRegion.GetName] 可能人口稀少，地形恶劣，但它仍然是波斯不可分割的一部分，必须回归阿契美尼德的统治！\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 hcp_mission_02_task_22:0 "修复居鲁士的陵墓"
 hcp_mission_02_task_22_DESC:0 "在 [GetProvince('(int32)4951').GetName] 有一座由淡黄色石灰石建造的令人印象深刻的陵墓，这是 #E 大居鲁士#! 的安息之地。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 hcp_mission_02_task_23:0 "探索[GetProvince('(int32)4799').GetName]的档案"
 hcp_mission_02_task_23_DESC:0 "幸运的是，我们发现波斯波利斯的大量行政档案似乎在亚历山大对该城市的焚毁中大部分幸存了下来。随着城市重新回到波斯手中，我们可以从这里记录的信息中学到很多。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 hcp_mission_02_task_24:0 "加固北部边界"
 hcp_mission_02_task_24_DESC:0 "没有防御工事的情况下，我们在[GetProvince('(int32)3440').GetArea.GetRegion.GetName]的北部边界非常容易受到北部草原游牧部落的侵袭。加强帕提亚山脉的通道防御应该可以让我们的公民安心。\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 hcp_mission_02_task_25:0 "游牧民族的臣服"
 hcp_mission_02_task_25_DESC:0 "越过帕提亚山脉，有许多游牧民族，如果他们统一起来，可能会对我国的存在构成严重威胁。我们应该接触这些最大的部落之一，并提供我们的友谊和保护。\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 hcp_mission_02_task_26:0 "[GetProvince('(int32)843').GetName]堡垒城"
 hcp_mission_02_task_26_DESC:0 "[GetProvince('(int32)843').GetName]守卫着扎格罗斯山脉的战略要地[GetProvince('(int32)992').GetName]通道。改善那里的防御措施应该能为我们在东部战役期间提供足够的北方侧翼保护。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 hcp_mission_02_task_27:0 "[GetProvince('(int32)786').GetName]造船"
 hcp_mission_02_task_27_DESC:0 "我们应该利用[GetProvince('(int32)784').GetName]丰富的雪松资源，在附近的腓尼基海岸资助建造一个大型船厂。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 hcp_mission_02_task_final:0 "阿契美尼德的归来"
 hcp_mission_02_task_final_DESC:0 "他们认为我们被打倒、破碎、被废黜和羞辱，但我们已经反抗命运本身并收复了我们的祖传土地。荣耀属于波斯，荣耀属于阿契美尼德！\n\n\n\n\n\n\n\n\n\n@persia_mil10!"

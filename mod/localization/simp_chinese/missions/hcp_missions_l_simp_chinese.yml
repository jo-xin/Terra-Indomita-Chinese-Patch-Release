 hcp_safe_from_raids:0 "边境保护"
 hcp_seleukia_nuked:0 "塞琉西亚被摧毁！"
 hcp_seleukia_spared:0 "塞琉西亚被宽恕"
 hcp_sinope_revitalised:0 "锡诺普复兴"
 hcp_syrian_magi.tt:0 "我们的马吉将开始向 [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y] 传播#T 阿胡拉·马兹达之光#!！"
 hcp_the_new_immortals:0 "新不朽者"
 hcp_thracian_auxiliaries:0 "色雷斯辅助部队"
 hcp_thracian_waifus:0 "满意"
 hcp_triumphant_achaemenids:0 "阿契美尼德的胜利"
 hcp_trolled_antigonus_opmod:0 "侮辱安提柯"
 hcp_true_persian_army:0 "改革后的阿契美尼德军队"
 hcp_unlock_armeno_pontic.tt:0 "亚美尼亚-本都军事传统现已可用。"
 hcp_upset:0 "激怒民众"
 hcp_zagros_bastion:0 "扎格罗斯要塞"
 me_hcp_01.1.a:0 "提出提议！"
 me_hcp_01.1.desc:0 "[GetCountry('TIE').GetName]和[GetCountry('SMS').GetName]这两个小国无疑是我们同盟中的次要伙伴，通过适当的“礼物”，他们也会认同这一点。如果他们拒绝，他们知道会有怎样的后果……"
 me_hcp_01.1.t:0 "本都联盟"
 me_hcp_01.10.a:0 "[GetProvince('(int32)194').GetName]位于古老的王道上，是最合适的选择！"
 me_hcp_01.10.b:0 "[GetProvince('(int32)1812').GetName]的财富将在全国范围内体现出来！"
 me_hcp_01.10.c:0 "[GetCharacter('(int32)82').GetName]的遗产将永远流传！"
 me_hcp_01.10.d:0 "我们当前的首都很棒"
 me_hcp_01.10.desc:0 "随着我们国家的增长，我们的行政机构也随之扩大。[ROOT.GetCountry.GetCapital.GetName]一直为我们服务得很好，但需要翻新以适应日益增长的官僚体系。鉴于我们在北安纳托利亚的霸权已稳固，我们应该考虑重新建立我们的朝廷和行政部门在一个更合适的地方。"
 me_hcp_01.10.t:0 "一个新的首都？"
 me_hcp_01.11.a:0 "我们必须改革我们的军队，否则会被竞争对手淘汰！"
 me_hcp_01.11.desc:0 "[ROOT.GetCountry.GetRuler.GetName]召集了[ROOT.GetCountry.GetName]所有将军、元帅和主要军官，目的是讨论我们军队糟糕的状态。\n\n我们的军队主要由几乎没有军事训练的征召兵组成，他们对分发口粮的人比对君主更加忠诚。原材料短缺意味着大多数人装备着劣质武器或农具，我们常常被迫依赖雇佣兵来增加部队数量。这种可悲的局面不能再继续下去了，因此[ROOT.GetCountry.GetRuler.GetName]和我们的#Y 阿格达布#!提出了几项雄心勃勃的提案来改革军队，使其成为一个更专业、装备更好的力量，能够应对未来的威胁。"
 me_hcp_01.11.t:0 "军事改革"
 me_hcp_01.12.a:0 "向着波斯前进！"
 me_hcp_01.12.desc:0 "当帝国崩溃时，大多数人认为被废黜的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝会逐渐淡出历史，仅存于文字记载中。\n\n但是从失败的灰烬中，我们的王朝再次崛起，决心不再默默无闻地消失。我们的统治者、军队和公民日复一日地为重新夺回他们的权利而战斗！\n\n现在是时候做好准备了，因为最大的挑战即将到来……"
 me_hcp_01.12.t:0 "阿契美尼德王朝的回归"
 me_hcp_01.13.a:0 "他非常受欢迎！"
 me_hcp_01.13.desc:0 "今天，一位衣衫褴褛、疲惫不堪的男人来到我们的首都，请求与[ROOT.GetCountry.GetRuler.GetName]见面。\n\n“陛下您好，我听说您需要精通[GetCharacter('(int32)335').GetName]教义的人，所以我从[GetProvince('(int32)4781').GetName]出发，只带着身上的衣服来到这里。我愿意以任何您认为合适的方式为您服务，只要这也能服务于阿胡拉·马兹达！”\n\n那人简短地鞠了一躬，然后高兴地接受了宫殿仆人递来的一壶水。这显然是一个值得成为我们领域内玛吉成员的人，因为他必定受到了神的祝福，才能毫发无损地完成这样的旅程！"
 me_hcp_01.13.t:0 "玛吉的回归"
 me_hcp_01.14.a:0 "凭借这支军队，我们将夺回我们的权利！"
 me_hcp_01.14.desc:0 "我们对军队进行了广泛的改革和现代化，终于完成了。#E 不朽者#!已经重生，并将成为我们军队不可摧毁的核心，而势不可挡的具装骑兵将粉碎任何愚蠢到试图抵挡他们冲锋的力量。\n\n旧帝国的教条主义已经被清除，我们的将军们渴望在战场上应用新的、创新的战术！"
 me_hcp_01.14.t:0 "真正的波斯军队"
 me_hcp_01.15.a:0 "让我们不要冒险破坏关系，只需请求边界调整"
 me_hcp_01.15.b:0 "[GetCountry('ARM').GetName]必须重归麾下，也要求他们臣服！"
 me_hcp_01.15.desc:0 "[GetCountry('ARM').GetName]一直是我们的坚定盟友，然而，对我们边境地区的重叠宣称正在给我们的关系带来压力，我们必须努力解决这个问题。\n\n我们宫廷的一些成员认为可以通过适当的价格说服他们放弃控制权。然而，其他人则认为我们应该走得更远，要求的不仅仅是领土，而是通过支付大量资金并利用所有的人情和政治让步，试图迫使他们再次屈服于我们作为我们的#Y 总督#!！"
 me_hcp_01.15.t:0 "重新思考我们的关系"
 me_hcp_01.16.a:0 "同意。"
 me_hcp_01.16.b:0 "拒绝。"
 me_hcp_01.16.desc:0 "把你们的土地交出来，蠢货。"
 me_hcp_01.16.t:0 "来自[GetCountry('HCP').GetName]的一封信"
 me_hcp_01.17.a:0 "同意。"
 me_hcp_01.17.b:0 "拒绝。"
 me_hcp_01.17.desc:0 "把你们的土地交出来，蠢货；而且还要成为总督辖区。"
 me_hcp_01.17.t:0 "来自[GetCountry('HCP').GetName]的一封信"
 me_hcp_01.18.a:0 "我们尝试过讲道理，或许我们的军队会改变他们的想法……"
 me_hcp_01.18.desc:0 "[GetCountry('ARM').GetRuler.GetName]送来了措辞强硬的回复，明确拒绝了我们的慷慨提议，并指责我们提出了令人无法接受的要求，从而破坏了我们的联盟。这一侮辱不能不回应！"
 me_hcp_01.18.t:0 "来自[GetCountry('ARM').GetName]的回复"
 me_hcp_01.19.a:0 "太好了"
 me_hcp_01.19.desc:0 "我们收到了[GetCountry('ARM').GetRuler.GetName]的回复，感谢我们的慷慨礼物并同意了我们的条款。[GetCountry('ARM').GetAdjective]驻军已撤出，并通知了相关地区的管理人员他们的新效忠对象。"
 me_hcp_01.19.t:0 "来自[GetCountry('ARM').GetName]的回复"
 me_hcp_01.2.a:0 "同意"
 me_hcp_01.2.b:0 "拒绝"
 me_hcp_01.2.desc:0 "说同意或死亡"
 me_hcp_01.2.t:0 "成为藩属？"
 me_hcp_01.20.a:0 "这对[GetCountry('ARM').GetName]和[ROOT.GetCountry.GetName]来说都是一个吉祥的日子！"
 me_hcp_01.20.desc:0 "我们收到了[GetCountry('ARM').GetRuler.GetName]的回复，感谢我们的慷慨礼物并同意了我们的条款。[GetCountry('ARM').GetAdjective]驻军已从要求的地区撤出，并且[GetCountry('ARM').GetRuler.GetName]承诺将前往我们的首都亲自向[ROOT.GetCountry.GetRuler.GetName]宣誓效忠！"
 me_hcp_01.20.t:0 "来自[GetCountry('ARM').GetName]的回复"
 me_hcp_01.21.a:0 "为什么让我们的公民去战场上送死，而不是花钱请外国人来做这件事？"
 me_hcp_01.21.b:0 "雇佣兵渣滓不可信任！应专注于改进征召方法！"
 me_hcp_01.21.c:0 "我们务实的[ROOT.GetCountry.GetRulerTitle]倾向于混合策略"
 me_hcp_01.21.desc:0 "我们的军事会议陷入僵局。\n\n许多年轻和更受欢迎的军官反对征召公民服役，而是希望我们专注于雇佣雇佣兵为我们的战争效力。\n\n然而，大多数人支持维持现有的军事服役要求，并提交了关于更精简高效征召政策的计划。\n\n最终决定权落在[ROOT.GetCountry.GetRuler.GetName]手中……"
 me_hcp_01.21.t:0 "议会争吵"
 me_hcp_01.22.a:0 "不是终结的开始，也许是开始的终结？"
 me_hcp_01.22.desc:0 "经过漫长而分裂的多次会议后，军事改革委员会终于就如何推进达成了一致意见。\n\n除了最固执己见的军官外，所有人都同意我们的方法需要改进，依靠雇佣兵或征召制是不够的。因此，一致同意改革的主要目标如下：\n\nI. 确保获得制造装备所需原材料\nII. 恢复并现代化传说中的#E 不朽者#!作为所有士兵的战斗核心和灵感来源，同时也是我们君主的皇家卫队。\nIII. 确保大规模繁殖战马，使我们能够部署大量强大的#E 具装骑兵#!。\nIV. 采用和发展在亚历山大远征中使用的战术，确保这样的耻辱不再发生！\n\n委员会同意，如果我们能够成功采纳这四个要点，我们的军队就能挑战新兴的#E 继业者#!并拥有收复波斯的手段！"
 me_hcp_01.22.t:0 "会议结束"
 me_hcp_01.23.a:0 "他的后代将与我们一起走向荣耀！"
 me_hcp_01.23.desc:0 "我们[ROOT.GetCountry.GetRulerTitle]心爱的战马迪奥尼西斯最近被安置在位于[GetProvince('(int32)196').GetName]的新建皇家马厩中。尽管年事已高，但他依然精力充沛，已经与一匹年轻的母马生育了一匹小马驹。这匹小马驹表现出如此旺盛的活力，以至于[ROOT.GetCountry.GetRuler.GetFirstName]表达了希望它在足够大之后能成为[ROOT.GetCountry.GetRuler.GetHerHis]的新战马的愿望。\n\n看来阿契美尼德家族不会是[ROOT.GetCountry.GetName]唯一的著名血统！"
 me_hcp_01.23.t:0 "皇家诞生"
 me_hcp_01.24.a:0 "他们站立的土地将在他们之前断裂！"
 me_hcp_01.24.desc:0 "经过严格的训练、演习和装备，一万士兵重生为#Y 不朽者#!。穿着鳞甲和闪亮胸甲，手持最致命的武器。这些人可以自称为全世界最精锐的步兵之一，是我们军队不可动摇的核心！"
 me_hcp_01.24.t:0 "不朽者的重生"
 me_hcp_01.25.a:0 "正是我们需要的人……欢迎回家"
 me_hcp_01.25.desc:0 "今天，一位老战士来到了皇宫，他众多的伤疤和坚毅、独眼的目光表明他是一个既经历过死亡也给予过死亡的人。\n\n在法庭上介绍自己时，他谦虚地说自己是一位厌倦了祖国待遇的老兵，听闻我们对了解希腊军事知识的人才提供的机会，他加入了前往[ROOT.GetCountry.GetCapital.GetName]的一群[GetCulture('macedonian').GetName|E]移民，希望能找到一个更能发挥他才华的雇主。"
 me_hcp_01.25.t:0 "希腊老兵提供服务"
 me_hcp_01.26.a:0 "我们将共同建立一个更美好的未来！"
 me_hcp_01.26.desc:0 "几个世纪的战争、占领以及单纯的排外情绪在波斯和希腊人民之间造成了巨大的隔阂，双方都将对方视为未开化的野蛮人。由于我们仁慈的统治，这些紧张关系在[ROOT.GetCountry.GetName]开始缓解。\n\n希腊和波斯家庭开始通婚，许多贵族学会了讲希腊语和波斯语。在市场上，希腊人购买波斯地毯，而波斯人在城市周围建造的体育馆里玩起了希腊体育运动。在寺庙中，一些波斯人与希腊人一起崇拜希腊万神殿，同时也有对祆教亚扎塔的献祭。\n\n在整个王国中，这两个民族相互交融，一种独特的混合文化开始形成。这两个庞大且曾经征服世界的古老文化从未如此接近过！这种文化的融合不仅象征着和平共处的新时代的到来，也为两国人民带来了更加丰富多彩的生活方式。通过这样的交流，一个更具包容性和多样性的社会正在逐步建立起来。"
 me_hcp_01.26.t:0 "希波融合"
 me_hcp_01.27.a:0 "鱼儿人人有份！"
 me_hcp_01.27.desc:0 "我们对渔业的投资导致了供应和需求的爆炸性增长。即使最近有所扩展，[GetProvince('(int32)1807').GetName]盐场也只能勉强满足大幅增加的用于保存渔民捕获物所需的盐的需求。实际上，出口的过剩鱼类数量如此之多，以至于“[ROOT.GetCountry.GetName]”这个名字开始成为咸鱼的代名词。"
 me_hcp_01.27.t:0 "鱼和盐的故事"
 me_hcp_01.28.a:0 "它劈波斩浪，指挥大海，藐视风浪！"
 me_hcp_01.28.desc:0 "今天标志着巨型八桨战舰#E 利昂托弗罗斯#!的下水仪式，我们的工程师认为这是有史以来建造的最大战舰。\n\n所有人都聚集在海边见证这艘令人印象深刻的船只的首次航行，包括[ROOT.GetCountry.GetRuler.GetName]。这艘海上巨兽将成为我们新舰队的旗舰。"
 me_hcp_01.28.t:0 "利昂托弗罗斯号的下水"
 me_hcp_01.29.a:0 "虽然不是[GetProvince('(int32)4799').GetName]，但它是我们的！"
 me_hcp_01.29.b:0 "我们的[ROOT.GetCountry.GetRulerTitle]对此项目表现出了极大的个人兴趣！"
 me_hcp_01.29.desc:0 "我们的新城市展现出巨大的潜力，今天，大批[GetCulture('pasargadi').GetName|E]移民选择在此定居。\n\n这些移民，加上我们任命的[GetCulture('pasargadi').GetName|E]行政人员，将确保#E 阿马斯特里斯#!成为其名字所代表的文化和建筑的光辉灯塔！"
 me_hcp_01.29.t:0 "阿马斯特里斯的建立"
 me_hcp_01.3.a:0 "这是极好的消息……"
 me_hcp_01.3.desc:0 "[hcp_offer.GetName]明智地接受了我们提供更大保护的提议，并向我们宣誓效忠！"
 me_hcp_01.3.t:0 "[hcp_offer.GetName]的回应"
 me_hcp_01.30.a:0 "让他们了解我们的善意"
 me_hcp_01.30.desc:0 "[GetCulture('mariandynian').GetName|Y]民族是一个古老的部落，以其同名英雄#Y 玛里安杜纳斯#!命名。他们居住在#Y 比提尼亚#!的山丘和山谷之间，是一个自豪且极其独立的民族，过去曾与该地区定居的#Y 希腊#!殖民者发生过冲突。\n\n为了赢得他们的支持，[ROOT.GetCountry.GetRuler.GetName|Y]已经派遣外交官前往我们领土内最大的部落定居点，并扩展了他们的公民权利。希望我们能说服他们，我们只希望和平共处。"
 me_hcp_01.30.t:0 "玛利安底尼亚人"
 me_hcp_01.31.a:0 "看来有些人仍然对我们家族的遗产怀有敬意！"
 me_hcp_01.31.desc:0 "我们对[GetCountry('ARM').GetName|E]的示好已见成效。[GetCountry('ARM').GetRuler.GetName|E]热情接受了我们的联盟提议，声称忽视#E 居鲁士#!和#E 大流士#!的后代在其困难时期的需求，将是对[GetCountry('ARM').GetRuler.GetFamilyDisplayAdjective|E]家族荣誉的巨大污点！"
 me_hcp_01.31.t:0 "患难中的朋友"
 me_hcp_01.32.a:0 "好吧……"
 me_hcp_01.32.desc:0 "我们收到了[GetCountry('SMS').GetRuler.GetName]，即[GetCountry('SMS').GetName|Y]统治者的来信。看起来[GetCountry('SMS').GetRuler.GetHerHis]的管理人员对该地区的财政管理不善，导致了一场危机，使人民濒临公开叛乱的边缘！\n\n意识到[GetCountry('SMS').GetRuler.GetHerHis]的地位已无法维持，[GetCountry('SMS').GetRuler.GetSheHe]请求我们兼并[GetProvince('(int32)208').GetName]以恢复秩序。"
 me_hcp_01.32.t:0 "塞萨莫斯的请愿"
 me_hcp_01.33.a:0 "我们将不惜一切代价恢复[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝的荣耀！"
 me_hcp_01.33.desc:0 "令人难以置信的是，仅仅几十年前，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝统治着世界上曾经见过的最大帝国，从东方的印度河延伸到西方的普罗庞提斯。但这一切都随着篡位者亚历山大的到来而改变了。现在只剩下[ROOT.GetCountry.GetName]这个小王国是[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝领土的全部了。四周都是贪婪地盯着我们土地的外国统治者。只有时间能证明[ROOT.GetCountry.GetRuler.GetName]是否有雄心壮志和决心带领我们重返伟大之路！"
 me_hcp_01.33.t:0 "一个破碎的帝国"
 me_hcp_01.4.a:0 "我们会看到结果的……"
 me_hcp_01.4.desc:0 "[hcp_offer.GetName]愚蠢地拒绝了我们的提议，声称希腊人永远不会再次生活在波斯人的统治之下！"
 me_hcp_01.4.t:0 "[hcp_offer.GetName]的回应"
 me_hcp_01.5.a:0 "至少在今天，我们可以放下所有的忧虑"
 me_hcp_01.5.desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName]看着她的儿子们，嘴角微微上扬。今天是自从狄俄尼修斯去世以来，她第一次看到他们一起笑。虽然从那时起两人变得疏远，但似乎节日（以及昂贵的酒）让他们再次靠近，即使只是短暂的一刻。\n\n两人都对他们的新娘感到满意，这些新娘以其智慧和美丽赢得了宫廷的赞赏，不过考虑到她们家族的地位，这也在意料之中。"
 me_hcp_01.5.t:0 "皇家婚礼"
 me_hcp_01.6.a:0 "与这样有能力的战士并肩作战是一种荣誉！"
 me_hcp_01.6.desc:0 "我们宽松的管理方式似乎对马里安迪尼亚人很有效。山地部落的人们热情欢迎我们的贡品收集者和使者，有些人甚至开始迁移到城市地区。\n\n自然而然地，许多马里安迪尼亚男人加入了军队，我们的将军认为将他们组织成地方辅助团既能满足他们对士兵生活的渴望，也能为我们急需扩充的部队规模提供帮助。"
 me_hcp_01.6.t:0 "玛利安底尼亚人踊跃参军"
 me_hcp_01.7.a:0 "回家路上迈出新的一步"
 me_hcp_01.7.desc:0 "尽管困难重重，我们还是做到了！在#E 第四次继业者战争#!的混乱中，我们设法从一个小城邦成长为一个新兴的波斯王国。由于大多数臣民是希腊人、色雷斯人和安纳托利亚人，他们最初对波斯领主持怀疑甚至敌视态度并不奇怪。\n\n然而，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝的英明仁慈统治已经赢得了我们臣民的心，人们在每条街上欢呼[ROOT.GetCountry.GetRuler.GetName]的名字！\n\n现在我们的王朝在国内的地位稳固了，是时候把目光转向东方……"
 me_hcp_01.7.t:0 "巩固我们的地位"
 me_hcp_01.8.a:0 "太好了！这让我非常高兴"
 me_hcp_01.8.desc:0 "安纳托利亚对#E 波斯#!统治并不陌生。旧帝国的“王道”很大一部分穿过这里的山脉和山谷，在我们总督的明智治理下，该地区繁荣起来。\n\n为了巩固我们的关系，并展示我们共存而非征服的决心，[ROOT.GetCountry.GetRuler.GetName]下令组建一支完全由#E 卡帕多西亚#!、#E 弗里吉亚#!、#E 帕弗拉格尼亚#!和#E 亚美尼亚#!士兵组成的皇宫卫队。这些人发誓绝对忠诚于[ROOT.GetCountry.GetRulerTitle]，以保护君主及其家人。如此重要且享有盛誉的角色必将赢得人民的好感！"
 me_hcp_01.8.t:0 "安纳托利亚的接受"
 me_hcp_01.9.a:0 "[GetProvince('(int32)1812').GetName|E]将成为黑海最富有的城市！"
 me_hcp_01.9.desc:0 "由于我们在该地区的投资，[GetProvince('(int32)1812').GetName]的生意再次兴隆！市场上商品琳琅满目，港口停满了来自各地的船只。[ROOT.GetCountry.GetRuler.GetName]亲自访问了这座城市，审查其复兴情况，并据说与那些明确表示对他们命运逆转深感感激的商人和工匠进行了成功的会面。"
 me_hcp_01.9.t:0 "[GetProvince('(int32)1812').GetName]"
 me_hcp_01_21.c.tt:0 "因为我们的统治者是#Y 明智#!、#Y 精明#!或#Y 聪明#!，所以此选项可用。"
 me_hcp_01_29.b.tt:0 "因为#Y [GetCharacter('(int32)82').GetName]#!是我们的现任统治者，所以此选项可用！"
 me_hcp_02.1.a:0 "烧毁一切。"
 me_hcp_02.1.a.tt:0 "你的士兵会掠夺一切有价值的东西然后烧毁城市，#Y 塞琉西亚#!的三分之二的人口将会#R 死亡#!。任何剩余的[GetCulture('macedonian').GetName|Y]族群将被@slaves!奴役并重新安置在[GetProvince('(int32)918').GetName]!"
 me_hcp_02.1.b:0 "剥夺[GetCulture('macedonian').GetName]公民的权利并没收他们的财富！"
 me_hcp_02.1.b.tt:0 "[GetCulture('macedonian').GetName|Y] @nobles!贵族和@citizens!公民将被剥夺特权并降为@freemen!自由民，城市的大部分@slaves!奴隶人口将被重新安置到[GetProvince('(int32)918').GetName]!"
 me_hcp_02.1.c:0 "'儿子不应承担父亲的罪过'"
 me_hcp_02.1.c.tt:0 "曾经是#Y 塞琉西亚#!的地方的[GetCulture('macedonian').GetName|Y]族群将不会受到干扰。"
 me_hcp_02.1.desc:0 "没有人会轻易忘记由希腊征服者无意或有意造成的波斯波利斯的毁灭。我们宫廷的一些成员要求我们通过将[GetCharacter('(int32)24').GetName]建立的城市夷为平地来复仇。虽然这种行为可能会提供短暂的情绪宣泄，但如此公然的野蛮行为不太可能为我们赢得任何朋友……"
 me_hcp_02.1.t:0 "塞琉西亚的命运"
 me_hcp_02.10.a:0 "“...准备好，#E 大远征#!已经开始了！”"
 me_hcp_02.10.desc:0 "随着第二次军事会议接近尾声，[ROOT.GetCountry.GetRuler.GetName]要求大家安静，所有人的目光都集中在[ROOT.GetCountry.GetRuler.GetHerHim]身上，开始讲话...\n\n“朋友们，我们都知道为什么聚在这里。长久以来，骄傲的波斯人民沦为外国僭主的奴隶！长久以来，我们祖先的土地被掠夺和剥削！长久以来，波斯真正的统治者被剥夺了他们应有的权利！今天，我们的正义之战开始了，我们将如汹涌澎湃的潮水般向东进军，任何不与我们站在一起的人都将在我们的盾牌和长矛下破碎。历史将铭记我们；不是作为像继业者们那样的残暴征服者，而是作为援助那些渴望自由之人的高贵解放者！\n\n兄弟姐妹们，朋友们，同胞们...”"
 me_hcp_02.10.t:0 "第二次军事会议结束"
 me_hcp_02.11.a:0 "这些无与伦比的战士将再次与我们并肩作战！"
 me_hcp_02.11.desc:0 "再次，[GetProvince('(int32)843').GetArea.GetRegion.GetName]（在波斯统治下被称为“阿苏尔”）被重新征服。令人惊讶的是，相当数量的[GetCulture('assyrian').GetName]士兵——其中许多人最近还与我们作战——请求加入我们的军队！在过去，[GetCulture('assyrian').GetName]人组成了阿契美尼德帝国重步兵的很大一部分。\n\n看来时间并未减少他们的热情……"
 me_hcp_02.11.t:0 "亚述重新征服"
 me_hcp_02.12.a:0 "几十年来第一次，一位阿契美尼德人走在巴比伦的街道上！"
 me_hcp_02.12.desc:0 "今天，[ROOT.GetCountry.GetRuler.GetName]穿过[GetProvince('(int32)918').GetName]的#E 伊什塔门#!，受到了热烈的欢迎。\n\n市民们排列在铺满花瓣的街道两旁，许多人踮起脚尖试图越过闪亮的不朽者头盔看到他们的新[ROOT.GetCountry.GetRulerTitle]。对于许多巴比伦人来说，阿契美尼德的名字备受尊敬，因为该市最辉煌的时代之一就是在他们的统治下。\n\n在这个充满希望的日子里，[GetProvince('(int32)918').GetName]的居民对未来怀着谨慎的乐观态度。"
 me_hcp_02.12.t:0 "重返巴比伦"
 me_hcp_02.13.a:0 "难以置信……想到它被隐藏了这么多年……"
 me_hcp_02.13.desc:0 "[ROOT.GetCountry.GetRuler.GetName]在手中翻转着这个小泥圆柱，感谢过去学习阿卡德文字的日子。对于[ROOT.GetCountry.GetRuler.GetFirstName]而言，铭文的后半部分最为有趣——似乎是由一只自信的手写成，甚至可能是居鲁士本人？\n\n‘我是居鲁士，世界的王，伟大的王，强大的王，巴比伦的王，苏美尔和阿卡德的王，世界四角的王，甘梅罗斯的儿子，提斯帕斯的后裔，安善的王，国王的永恒种子，我的统治受到[GetDeityDefinition('omen_marduk').GetName]和[GetDeityDefinition('omen_nabu').GetName]的喜爱，他们因我的统治而感到高兴。我恢复了巴比伦和其他神圣于[GetDeityDefinition('omen_marduk').GetName]的城市的和平，解救了那里的居民，为破败的房屋带来了救济。’"
 me_hcp_02.13.t:0 "居鲁士圆柱"
 me_hcp_02.14.a:0 "他们将在[GetProvince('(int32)918').GetArea.GetRegion.GetName]的人民中繁荣昌盛"
 me_hcp_02.14.desc:0 "在整个旧阿契美尼德帝国范围内，形成了一个[GetCulture('pasargadi').GetName]流散社区，这些难民将[GetCulture('pasargadi').GetName]的艺术、语言和文化传播到了帝国的每一个角落。其中最大的社区位于[GetProvince('(int32)918').GetArea.GetRegion.GetName]，那里有相当数量的[GetCulture('pasargadi').GetName]少数民族与[GetCulture('babylonian').GetName]和[GetCulture('assyrian').GetName]人民并肩工作。我们在该地区的基础设施和食品供应方面的投资应该会吸引许多波斯人考虑在那里定居，并让古老的帝国流散社区再次繁荣起来。"
 me_hcp_02.14.t:0 "帝国流散者归来"
 me_hcp_02.15.a:0 "取悦神灵即取悦人民！"
 me_hcp_02.15.a.tt:0 "在接下来的 #Y 20#! 年内，每个[GetReligion('mesopotamian_religion').GetName|Y]占多数的省份都将获得：\n\n[GetModifier('hcp_chaldeans_rejoicing').GetDesc]"
 me_hcp_02.15.desc:0 "对于崇拜[GetReligion('mesopotamian_religion').GetName]万神殿的信徒来说，[GetProvince('(int32)937').GetName]城和[GetProvince('(int32)910').GetName]的埃巴巴尔神庙具有重要意义，因为它们是其一些最重要神灵的主要崇拜地。\n\n分别是[GetDeityDefinition('omen_ishtar').GetName]（也被称为Eanna或Inanna），天堂之王及爱、战争和生育女神，以及她的孪生兄弟[GetDeityDefinition('omen_shamash').GetName]（苏美尔人称其为Utu），正义和太阳之神。在他们的前统治者手下，这两座神庙都被忽视并任其衰败，这令信徒们十分绝望。现在我们已将这些崇拜场所恢复到昔日的辉煌，我们的美索不达米亚臣民正在庆祝，为了回报我们对他们的神灵的慷慨，他们受到鼓舞更加努力地工作！"
 me_hcp_02.15.t:0 "尊敬美索不达米亚的神灵"
 me_hcp_02.16.a:0 "叙利亚等待着……"
 me_hcp_02.16.desc:0 "随着[GetProvince('(int32)876').GetArea.GetRegion.GetName]的安全稳固，下一个征服目标自然就是幼发拉底河西岸的土地，即[GetProvince('(int32)790').GetArea.GetRegion.GetName]。\n\n有多少军队曾在这片地区交锋？或许即使是整个[ROOT.GetCountry.GetName]中最聪明的人也难以回答。确实，几个世纪以来这片土地被不同民族反复争夺。将其纳入我们的版图将极大地提升我们的国际地位。"
 me_hcp_02.16.t:0 "跨越幼发拉底河"
 me_hcp_02.17.a:0 "埃伯-纳里，永远属于我们"
 me_hcp_02.17.a.tt:0 "在接下来的 #Y 10#! 年内，位于 [GetProvince('(int32)782').GetArea.GetRegion.GetName|Y] 的每个省份都将获得：\n\n[GetModifier('hcp_magi_activity').GetDesc]"
 me_hcp_02.17.desc:0 "[GetProvince('(int32)790').GetArea.GetRegion.GetName]，或#E “Eber-Nari”#!（意为“跨过/超越河流”，因为它位于幼发拉底河西岸）是一块对外来征服者并不陌生的土地，在其历史记录中曾处于埃及、亚述、巴比伦、波斯和希腊的统治之下。\n\n叙利亚最有价值的商品可以说是大量的雪松木，因其在造船中的广泛应用而备受追捧，这也是[GetCulture('phoenician').GetName]人民成为如此熟练的航海者的原因之一。"
 me_hcp_02.17.t:0 "叙利亚收复"
 me_hcp_02.18.a:0 "很高兴回来"
 me_hcp_02.18.desc:0 "[GetProvince('(int32)946').GetName]是一座古老的城市，不仅对波斯人文化意义重大。\n\n值得注意的是，这座城市内有[GetDeityDefinition('omen_daniel').GetName]的陵墓，一位被巴比伦的尼布甲尼撒二世俘虏的[GetReligion('judaism').GetName]贵族，他忠诚且能干地服务于国王及其继承人，直到由我们的祖先居鲁士大帝解放（他也是一位在[GetReligion('judaism').GetName]信仰中受尊敬的人物）。当居鲁士的亲戚大流士一世登上王位时，他在城市进行了众多建筑项目，使其成为一个繁华的大都市和帝国的皇家首都之一。"
 me_hcp_02.18.t:0 "大流士之城"
 me_hcp_02.19.a:0 "越过山脉就是波斯的土地……我们的土地"
 me_hcp_02.19.desc:0 "随着我们巩固了对[GetProvince('(int32)918').GetArea.GetRegion.GetName]和[GetProvince('(int32)843').GetArea.GetRegion.GetName]的控制，并加固了扎格罗斯山脉中的堡垒以抵御任何反击，我们现在可以全心投入到#E 大战役#!的下一阶段——重新征服[GetProvince('(int32)1595').GetArea.GetRegion.GetName]地区，然后是[GetProvince('(int32)4799').GetArea.GetRegion.GetName]地区！"
 me_hcp_02.19.t:0 "目光东移"
 me_hcp_02.2.a:0 "他的遗产将被摧毁，就像他和他的同伴试图摧毁我们的那样！"
 me_hcp_02.2.a.tt:0 "[GetCulture('macedonian').GetName|Y] @nobles!贵族和@citizens!公民将被剥夺特权并降为@freemen!自由民。"
 me_hcp_02.2.a2.tt:0 "外交范围内的每个非继业者[GetCultureGroup('hellenic').GetName|Y]国家对我们失去#R 15#!好感度！"
 me_hcp_02.2.b:0 "让他的记忆在他的城市中永存，并激励他的[GetCulture('macedonian').GetName]同胞！"
 me_hcp_02.2.b.tt:0 "外交范围内的每个非继业者[GetCultureGroup('hellenic').GetName|Y]国家对我们获得#G 15#!好感度！"
 me_hcp_02.2.desc:0 "[GetCharacter('(int32)37').GetName]一直是一个有争议的人物。在许多希腊人眼中，他是捍卫较小的希腊化国家独立的英雄。对于继业者们来说，他则被视为阻碍他们统一企图的可恨对手。现在，他的城市[GetProvince('(int32)790').GetName]处于我们的控制之下，我们可以选择是纪念他积极的一面还是彻底摧毁他的遗产……"
 me_hcp_02.2.t:0 "[GetCharacter('(int32)37').GetName]的遗产"
 me_hcp_02.20.a:0 "尝试说服他们对我们宣誓效忠"
 me_hcp_02.20.a.tt:0 "我们将施压[GetCountry('PES').GetName|Y]向我们宣誓效忠，这将有#G 中等#!的成功几率。"
 me_hcp_02.20.b:0 "波西斯理应属于我们，立即要求他们合并！"
 me_hcp_02.20.b.tt:0 "我们将要求[GetCountry('PES').GetName|Y]的整合，这将有#R 较低#!的成功几率。"
 me_hcp_02.20.desc:0 "为了安抚他的被束缚的[GetCulture('pasargadi').GetName]臣民，塞琉古创建了[GetCountry('PES').GetName]的“总督领”。这是对阿契美尼德总督领的粗鄙模仿，但我们对波西斯土地的宣称高于其他任何人，因为我们首先是波斯人。通过利用我们所有的支持和政治影响力，我们可以利用[GetCountry('PES').GetName]的阿契美尼德忠实者向[GetCountry('PES').GetRuler.GetName]施压，迫使其归顺我们！"
 me_hcp_02.20.t:0 "波西斯“总督领”"
 me_hcp_02.21.a:0 "阿契美尼德家族才是波斯的真正统治者！"
 me_hcp_02.21.b:0 "这些化石甚至不值得回应！"
 me_hcp_02.21.desc:0 "我们收到了来自复兴的[GetCountry('HCP').GetName]的统治者[GetCountry('HCP').GetRuler.GetName]的消息。他们要求我们归顺，声称对整个波斯的统治权是他们的出生权利！"
 me_hcp_02.21.t:0 "真正的统治者？"
 me_hcp_02.23.a:0 "他们认可了这些土地的真正统治者！"
 me_hcp_02.23.desc:0 "[GetCountry('PES').GetName]同意了我们的要求。[GetCountry('PES').GetRuler.GetName]发布了一份公开声明，承认[GetCountry('HCP').GetRuler.GetName]为波斯的合法统治者，并提供了效忠！"
 me_hcp_02.23.t:0 "波西斯屈服！"
 me_hcp_02.24.a:0 "这是怎么回事？"
 me_hcp_02.24.desc:0 "主公！从[GetCountry('PES').GetName]传来了一则令人震惊的消息。[GetCountry('PES').GetRuler.GetName]屈服于阿契美尼德忠实者的压力，并通过向[GetCountry('HCP').GetRuler.GetName]宣誓效忠背叛了我们，他们不再是我们的臣民！"
 me_hcp_02.24.t:0 "背叛！"
 me_hcp_02.25.a:0 "这也太无礼了！"
 me_hcp_02.25.desc:0 "[GetCountry('PES').GetName]甚至没有回应我们的要求！这样的傲慢不可不答……"
 me_hcp_02.25.t:0 "波西斯的沉默"
 me_hcp_02.26.a:0 "阿契美尼德家族才是波斯的真正统治者！"
 me_hcp_02.26.b:0 "不要回复这些蠢货！"
 me_hcp_02.26.desc:0 "我们收到了来自复兴的[GetCountry('HCP').GetName]的统治者[GetCountry('HCP').GetRuler.GetName]的消息。他们要求我们立即重新加入他们的王国，声称我们的土地理应属于他们！"
 me_hcp_02.26.t:0 "真正的统治者？"
 me_hcp_02.27.a:0 "波西斯重回怀抱"
 me_hcp_02.27.desc:0 "[GetCountry('PES').GetRuler.GetName]已经屈服，并承诺不会抵抗我们对其领土的占领。所有他们的领土现在都在我们的控制之下！"
 me_hcp_02.27.t:0 "波西斯的整合"
 me_hcp_02.28.a:0 "将他们重新安置到更西边"
 me_hcp_02.28.b:0 "他们可以留下，但鼓励他们采用当地方式"
 me_hcp_02.28.c:0 "他们并没有造成伤害，让他们去吧"
 me_hcp_02.28.desc:0 "随着亚历山大大帝不断向东征服，他在亚洲各地建立了许多希腊殖民地。大多数定居者是士兵，通常是那些生病或受伤的，可能无法完成漫长回家旅程的人。今天，这些定居者的后代仍可以在旧阿契美尼德帝国的许多地区找到，包括[GetProvince('(int32)1595').GetArea.GetRegion.GetName|Y]地区，最著名的是靠近旧皇都#Y 埃克塔班纳#!附近的#Y 赫拉克利亚·梅迪亚#!。\n\n现在该地区重新回到我们的控制下，我们必须决定这些定居者的命运，是否应该驱逐这些希腊人离开波斯的土地？还是允许他们留下？"
 me_hcp_02.28.t:0 "米底亚的马其顿人"
 me_hcp_02.29.a:0 "一位值得效仿的统治者！"
 me_hcp_02.29.desc:0 "数百年前，米底人的传奇首位沙赫迪奥塞斯统一了米底部落，创建了第一个真正的伊朗帝国。他被铭记为一位公正且高尚的统治者，改善了人民的生活，给混乱带来了秩序。他的孙子赛阿克瑟雷斯成功地联合了所有主要的[GetCultureGroup('persia').GetName]部落，成为一股强大力量，与斯基泰人、亚述帝国和吕底亚帝国作战。"
 me_hcp_02.29.t:0 "首位立法者的土地"
 me_hcp_02.3.a:0 "让我们看看他们对我们提议的看法"
 me_hcp_02.3.desc:0 "几个世纪以来，#E 腓尼基#!一直是商业城邦的家园。事实上，作为商人和航海家他们是如此成功，以至于很难找到一个没有至少一艘[GetCulture('phoenician').GetName]船只停靠的港口。为了确保我们在叙利亚的统治权，这些国家必须被纳入我们的影响范围。我们将伸出友谊之手，提供保护，以换取他们对我们的忠诚！"
 me_hcp_02.3.t:0 "腓尼基的城市"
 me_hcp_02.30.a:0 "这些希腊人不应再玷污我们祖先的土地，将他们送到安纳托利亚！"
 me_hcp_02.30.b:0 "他们可以留下，但鼓励他们采用当地方式"
 me_hcp_02.30.c:0 "他们并没有造成伤害，让他们去吧"
 me_hcp_02.30.desc:0 "随着亚历山大大帝不断向东征服，他在亚洲各地建立了许多希腊殖民地。大多数定居者是士兵，通常是那些生病或受伤的，可能无法完成漫长回家旅程的人。今天，这些定居者的后代仍可以在旧阿契美尼德帝国的许多地区找到，包括[GetProvince('(int32)943').GetArea.GetRegion.GetName|Y]地区，最著名的是靠近#Y 苏萨#!的#Y 塞琉西亚-希第丰河畔#!。\n\n现在该地区重新回到我们的控制下，我们必须决定这些定居者的命运，是否应该驱逐这些希腊人离开波斯的土地？还是允许他们留下？"
 me_hcp_02.30.t:0 "波西斯的马其顿人"
 me_hcp_02.31.a:0 "多年之后，我们终于回家了"
 me_hcp_02.31.desc:0 "终于，我们重新夺回了祖先的家园[GetProvince('(int32)4799').GetArea.GetRegion.GetName]——这一胜利将永载史册。这里不仅是世界上大多数波斯人的故乡，还拥有许多具有文化意义的遗址，如旧礼仪首都[GetProvince('(int32)4799').GetName]和居鲁士大帝在[GetProvince('(int32)4951').GetName]的陵墓。\n\n随着消息传遍[ROOT.GetCountry.GetName]，我们重新征服了失去已久的领土，许多波斯贵族返回到他们家族几代人未曾拥有的祖居地。"
 me_hcp_02.31.t:0 "波斯故土"
 me_hcp_02.32.a:0 "让我们看看他们的忠诚在哪里"
 me_hcp_02.32.desc:0 "在亚历山大的战役中涉及的所有人里，很少有人的命运能像[GetCharacter('(int32)222').GetName]那样发生如此巨大的逆转。\n\n在#E 高加米拉之战#!中被亚历山大彻底击败后，[GetCharacter('(int32)222').GetFirstName]失去了他的总督职位给另一位名叫奥克西达特斯的贵族。然而，这并不是[GetCharacter('(int32)222').GetFirstName]故事的终结，因为奥克西达特斯因不当行为和腐败在任职两年后被捕。\n\n面对这个困境，亚历山大选择重新任命[GetCharacter('(int32)222').GetFirstName]回到他的旧职位。当亚历山大去世，其帝国被继业者们瓜分时，[GetCharacter('(int32)222').GetFirstName]的米底总督领分配给了[GetCharacter('(int32)24').GetFirstName]。[GetCharacter('(int32)222').GetFirstName]坚决拒绝向他屈服，他的领地自那时起一直保持独立。但现在，真正的波斯主人——阿契美尼德人回来了，[GetCharacter('(int32)222').GetFirstName]的后代必须低头！"
 me_hcp_02.32.t:0 "阿特罗帕特王国"
 me_hcp_02.33.a:0 "屈服于波斯统治"
 me_hcp_02.33.b:0 "米底人再也不会向波斯人低头！"
 me_hcp_02.33.desc:0 "我们收到了复兴的阿契美尼德国家的消息。要求我们作为波斯的一个总督领重新并入，再次屈服于阿契美尼德是否是我们的命运？"
 me_hcp_02.33.t:0 "来自旧主的信息"
 me_hcp_02.34.a:0 "太好了"
 me_hcp_02.34.desc:0 "[GetCountry('MAP').GetRuler.GetName]对我们的要求作出了积极回应，并认为我们的条款是可以接受的。"
 me_hcp_02.34.t:0 "阿特罗帕特内的回应"
 me_hcp_02.35.a:0 "显然，阿特罗帕忒斯的智慧并没有传给他的后代"
 me_hcp_02.35.desc:0 "[GetCountry('MAP').GetRuler.GetName]拒绝投降，声称米底人永远不会再次向波斯统治者低头！"
 me_hcp_02.35.t:0 "阿特罗帕特内的回应"
 me_hcp_02.36.a:0 "不可思议的生物...多么幸运现在它们属于我们"
 me_hcp_02.36.desc:0 "尼萨战马以其无与伦比的战斗力闻名于世。这些高大强壮、速度惊人的战马需求极旺，在大流士一世统治时期，从亚美尼亚到粟特地区都设有专门的尼萨战马牧场。当亚历山大征服[GetProvince('(int32)1595').GetArea.GetRegion.GetName]时，他特别要求各城进贡的不是银塔兰特或奴隶，而是数以千计的尼萨战马！"
 me_hcp_02.36.t:0 "尼萨马"
 me_hcp_02.37.a:0 "[GetProvince('(int32)1595').GetName]将再次成为文明的灯塔！"
 me_hcp_02.37.desc:0 "根据希腊历史学家希罗多德的说法，[GetProvince('(int32)1595').GetName]在公元前678年由米底的初代沙阿代奥凯斯选为米底的首都。\n\n代奥凯斯设想了一个中心有一座配得上皇室的宏伟宫殿的奇妙城市，尽管职责常常使代奥凯斯无法实现他的梦想，但这个愿景从未消失，最终宫殿得以建成。在居鲁士征服米底帝国后，[GetProvince('(int32)1595').GetName]仍然是一个重要城市，其宫殿常被用作阿契美尼德统治者的夏宫。随着这座城市重回我们手中，它将再次成为波斯人的皇家首都！"
 me_hcp_02.37.t:0 "迪奥塞斯的王座"
 me_hcp_02.38.a:0 "散步的好地方！"
 me_hcp_02.38.desc:0 "[GetProvince('(int32)3455').GetArea.GetRegion.GetName]是一片崎岖却美丽的山地与草原地带，适合我们的士兵适应类似的地形作战。\n\n[GetCulture('parthian').GetName]人民主要是乡村社会，但在整个波斯以他们繁荣的吟游文化而闻名。许多[GetCulture('parthian').GetName]诗人曾在亚洲各地的宫廷中表演，他们悦耳的声音讲述着往昔的英雄事迹，伴随着竖琴的甜美弹奏。"
 me_hcp_02.38.t:0 "帕提亚收复"
 me_hcp_02.39.a:0 "将他们重新安置到更西边"
 me_hcp_02.39.b:0 "他们可以留下，但鼓励他们采用当地方式"
 me_hcp_02.39.c:0 "阿里亚纳已经很稀疏，让他们留下吧"
 me_hcp_02.39.desc:0 "随着亚历山大大帝不断向东征服，他在亚洲各地建立了许多希腊殖民地。大多数定居者是士兵，通常是那些生病或受伤的人，可能无法完成漫长回家旅程。今天，这些定居者的后代仍可以在旧阿契美尼德帝国的许多地区找到。事实上，在[GetProvince('(int32)6619').GetArea.GetRegion.GetName|Y]的严酷山脉和沙漠中可以找到不少于三个散落在亚洲的众多“亚历山大城”之一！\n\n现在该地区重新回到我们的控制下，我们必须决定这些定居者的命运，是否应该驱逐这些希腊人离开波斯的土地？还是允许他们留下？"
 me_hcp_02.39.t:0 "阿里亚纳的马其顿人"
 me_hcp_02.4.a:0 "这在长期内只会对我们有利！"
 me_hcp_02.4.b:0 "这是对臣服的掩饰尝试！"
 me_hcp_02.4.desc:0 "我们收到了来自[GetCountry('HCP').GetName]的统治者[GetCountry('HCP').GetRuler.GetName]的一个有趣的提议，他们提出在交换条件下给予我们保护，即在他们的城市中享有独家贸易权。虽然朝廷中有些人欢迎我们的独立得到保障，但也有人警告不要接受他们的提议，声称其条款明显侵犯了我们的主权。"
 me_hcp_02.4.t:0 "阿契美尼德王朝的提议"
 me_hcp_02.40.a:0 "我们将文明化这些严酷的土地！"
 me_hcp_02.40.a.tt:0 "在接下来的 #Y 20#! 年内，位于 [GetProvince('(int32)6517').GetArea.GetRegion.GetName|Y] 的每个省份都将获得：\n\n[GetModifier('hcp_ariana_restored').GetDesc]"
 me_hcp_02.40.desc:0 "[GetProvince('(int32)6619').GetArea.GetRegion.GetName]，或#E '阿维斯坦'#!，包含了阿契美尼德帝国东部省份的大部分。尽管这里的地形主要由山脉和沙漠组成，环境苛刻，但它也是许多[GetCultureGroup('persia').GetName]部落的家园，如[GetCulture('carmanian').GetName]和[GetCulture('pactyan').GetName]。现在这片区域重回我们的控制之下，我们应该努力将其集中并文明化，以丰富居住在此的臣民的生活。"
 me_hcp_02.40.t:0 "阿里亚纳收复"
 me_hcp_02.41.a:0 "'我将永远努力无愧于您的名字，伟大的居鲁士！'"
 me_hcp_02.41.desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName]坚持不让[ROOT.GetCountry.GetRuler.GetHerHis]保镖陪同进入[GetProvince('(int32)4951').GetName]的皇家公园。当[ROOT.GetCountry.GetRuler.GetSheHe]接近[ROOT.GetCountry.GetRuler.GetHerHis]最伟大的祖先的陵墓时，注意到周围除了附近某处伊朗地鸦的婉转叫声外，异常安静。[ROOT.GetCountry.GetRuler.GetFirstName]闭上了眼睛，思考着自己的遗产将会是什么。是否会像居鲁士一样，有一个令人惊叹的陵墓？或者[ROOT.GetCountry.GetRuler.GetHerHis]的名字会被诅咒，只能在私语中提及？\n\n沉浸在思考中，[ROOT.GetCountry.GetRuler.GetFirstName]听到头顶传来一阵响动时感到惊讶，首先想到的是刺客，[ROOT.GetCountry.GetRuler.GetHerHis]的眼睛猛然睁开。令[ROOT.GetCountry.GetRuler.GetHerHis]先是宽慰，随后愤怒的是，声音是由之前听到的地鸦发出的；那只棕色的鸟栖息在居鲁士的陵墓上，正在大声鸣叫！\n\n[ROOT.GetCountry.GetRuler.GetFirstName]最初的想法是赶走这只鸟，因为它竟敢玷污这样一位伟人的陵墓！但接着[ROOT.GetCountry.GetRuler.GetHerHis]的目光与那只乌鸦相遇，不知为何，内心深处[ROOT.GetCountry.GetRuler.GetFirstName]知道这不是一只普通的鸟，而是一个神圣的使者！再次闭上眼睛，[ROOT.GetCountry.GetRuler.GetFirstName]鞠躬，并对自己和所有的祖先许下了承诺，他知道此刻祖先们正在注视着他。"
 me_hcp_02.41.t:0 "致敬"
 me_hcp_02.42.a:0 "任何官僚都会视为宝藏！"
 me_hcp_02.42.desc:0 "随着[GetProvince('(int32)4799').GetName]重新回到我们的控制之下，我们获得了存放在那里的档案中的大量信息。\n\n数百块泥板，主要用阿拉姆语和埃兰语书写，记录了几百年的行政和经济资料，现在归我们所有，我们的学者们忙着翻译这些文本。这些丰富的信息将极大地有助于改进我们的管理。"
 me_hcp_02.42.t:0 "波斯波利斯的档案"
 me_hcp_02.43.a:0 "眼睛盯着地平线，监视山口"
 me_hcp_02.43.desc:0 "通过在整个[GetProvince('(int32)3455').GetArea.GetRegion.GetName]加固战略位置，我们可以更好地防御来自北方的任何入侵。永久驻扎在堡垒中的部队，以及一连串可点燃的烽火台，意味着我们将能够迅速通知南方任何突然袭击的消息！"
 me_hcp_02.43.t:0 "北方边界的瞭望"
 me_hcp_02.44.a:0 "每个人都喜欢黄金和好伙伴...对吧？"
 me_hcp_02.44.desc:0 "要真正控制伊朗高原的统治者必须充分意识到游牧部落的威胁，这些部落将[GetProvince('(int32)3455').GetArea.GetRegion.GetName]和[GetProvince('(int32)5491').GetArea.GetRegion.GetName]作为家园。\n\n他们是擅长骑射的独立而骄傲的战士，在几个世纪以来一直是许多波斯统治者的棘手问题。\n\n尽管[ROOT.GetCountry.GetRuler.GetHerHis]朝廷恳求，[ROOT.GetCountry.GetRuler.GetFirstName]决定亲自带着礼物前往最大的部落，伸出友谊之手。虽然许多人认为这是徒劳的努力，但也有人认为与最强大的部落建立正式友好的关系对于改善我们北部地区的安全非常有利。"
 me_hcp_02.44.t:0 "部落外交"
 me_hcp_02.45.a:0 "您以这份礼物荣耀我们，请接受我们的回礼！"
 me_hcp_02.45.b:0 "关于您提供的‘保护’..."
 me_hcp_02.45.desc:0 "今天收到了一个惊喜。[GetCountry('HCP').GetName]的统治者带来了丰厚的礼物，并享受了我们数天的热情款待。在谈判中，他们的领导人明确表达了两国之间希望进行合作并提供“保护”的愿望。"
 me_hcp_02.45.t:0 "南方邻国的访问"
 me_hcp_02.46.a:0 "非凡的样本"
 me_hcp_02.46.desc:0 "起初对我们的意图持怀疑态度，但在收到我们的礼物并意识到[GetCountry('HCP').GetName]的统治者是亲自前来递交贡品后，[hcp_horseboi.GetRuler.GetName]热情欢迎了[ROOT.GetCountry.GetRuler.GetFirstName]及其随行人员。经过几天享受[hcp_horseboi.GetAdjective]的热情款待后，[hcp_horseboi.GetRuler.GetFirstName]向我们的[ROOT.GetCountry.GetRulerTitle]赠送了一匹最好的马作为告别礼物。\n\n虽然我们没有获得[hcp_horseboi.GetAdjective]的臣服，但我们建立了牢固的相互尊重的关系，两位统治者都热切同意未来的合作！"
 me_hcp_02.46.t:0 "我们的礼物得到回应"
 me_hcp_02.47.a:0 "[hcp_horseboi.GetAdjective]将在我们的保护下安全无虞"
 me_hcp_02.47.desc:0 "起初对我们的意图持怀疑态度，但在收到我们的礼物并意识到[GetCountry('HCP').GetName]的统治者是亲自前来递交贡品后，[hcp_horseboi.GetRuler.GetName]热情欢迎了[ROOT.GetCountry.GetRuler.GetFirstName]及其随行人员。\n\n在享受了几日[hcp_horseboi.GetAdjective]的热情款待期间，双方共享了许多盛宴和娱乐活动后，[hcp_horseboi.GetRuler.GetFirstName]要求私下交谈。令双方卫士失望的是，[ROOT.GetCountry.GetRuler.GetFirstName]接受了这一请求，两人消失了几小时。他们之间的会谈内容将永远只有他们知道，但当他们返回时，[hcp_horseboi.GetRuler.GetFirstName]宣布我们的[ROOT.GetCountry.GetRulerTitle]现在成为了[hcp_horseboi.GetAdjective]人民的守护者，并当场宣誓效忠于[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_hcp_02.47.t:0 "请求"
 me_hcp_02.48.a:0 "无人能过！"
 me_hcp_02.48.desc:0 "[GetProvince('(int32)843').GetName]是一座重要的城市，因为它守卫着通往#E 亚美尼亚#!的一个关键山口，这个山口被旅行商人和流浪军队所使用。确保这座城市有足够的防御工事将阻止任何来自北方的入侵，从而使我们能够集中精力进行东方的战役。\n\n一旦消息传到[ROOT.GetCountry.GetCapital.GetName]，堡垒城市已经完成，所有人都能稍微安心一些。"
 me_hcp_02.48.t:0 "堡垒城市"
 me_hcp_02.49.a:0 "不妨好好利用那些雪松"
 me_hcp_02.49.desc:0 "围绕着雄伟的[GetProvince('(int32)783').GetName]的土地上有着世界上最大和最古老的雪松森林之一。这些树木的声誉远播叙利亚边界之外，甚至在巴比伦的《吉尔伽美什史诗》中也有提及。\n\n在不破坏这一传奇地标的前提下，我们在附近的腓尼基海岸新建造的造船厂将使我们能够利用这种自然资源快速扩展海军！"
 me_hcp_02.49.t:0 "冈比西斯的遗产"
 me_hcp_02.5.a:0 "太好了"
 me_hcp_02.5.desc:0 "[hcp_phoenician_offer.GetRuler.GetName]感谢我们提供的保护，并同意优先考虑我们的市场，从而实际上使我们成为他们的宗主国。"
 me_hcp_02.5.t:0 "[hcp_phoenician_offer.GetName]的回应"
 me_hcp_02.50.a:0 "赞美阿胡拉·玛兹达！"
 me_hcp_02.50.desc:0 "被流放到[GetProvince('(int32)207').GetName]，我们敌人以为我们已被打败，注定随着帝国沦为废墟而默默无闻……但是从一颗余烬中，火焰可以重燃！就像永恒燃烧在我们重建帝国的[GetReligion('zoroaster').GetName]寺庙中的火焰一样，阿契美尼德的光辉精神拒绝熄灭！一个接一个，我们击败了旧敌，重新夺回了不仅是王朝的，而且是所有波斯人民的诞生权利！\n\n这是有生以来第一次，在[GetProvince('(int32)4951').GetName]举行了阿契美尼德的加冕仪式。[ROOT.GetCountry.GetRuler.GetName]在一个辉煌的仪式中被宣布为#E ‘沙赫纳沙赫’#!（万王之王），再次确认了我们王朝不仅对波斯，而且对居鲁士、大流士和其他所有阿契美尼德征服的所有土地拥有统治权的权利！"
 me_hcp_02.50.t:0 "阿契美尼德的胜利"
 me_hcp_02.501.a:0 "愚蠢……"
 me_hcp_02.501.desc:0 "[hcp_phoenician_offer.GetRuler.GetName]拒绝了我们的提议！指责我们试图公然侵犯他们的独立性，并威胁要切断所有与我们的贸易往来。看来[hcp_phoenician_offer.GetName]将不得不通过武力获得。"
 me_hcp_02.501.t:0 "[hcp_phoenician_offer.GetName]的回应"
 me_hcp_02.6.a:0 "不久之后，我们的军团将向东进发！"
 me_hcp_02.6.desc:0 "正如我们改革军队时一样，我们的[ROOT.GetCountry.GetRulerTitle]召集了我们领域内所有领先的将军、战术家、军官和工程师举行峰会。然而，这次讨论的重要性远超以往！\n\n第二次军事会议将决定我们如何执行#E 大战役#!。尽管成员之间已经存在分歧，但最终所有决议的最终决定都将由[ROOT.GetCountry.GetRuler.GetName]作出。"
 me_hcp_02.6.t:0 "第二次军事会议"
 me_hcp_02.7.a:0 "即使是最低的潮汐也会侵蚀石头"
 me_hcp_02.7.b:0 "我们将如闪电般迅猛！"
 me_hcp_02.7.desc:0 "如同所有此类会议一样，事情很快变得政治化，与会者就微小差异争吵不休。\n\n一个激烈争论的重要细节是我们战役的整体运作方式。许多人赞成快速而果断的推进，在敌人能够巩固力量之前迅速压倒他们。然而，另一些人认为更系统、谨慎的方法将更为有效，建议我们在进一步征战前仔细巩固已征服的土地。"
 me_hcp_02.7.t:0 "如何继续？"
 me_hcp_02.8.a.tt:0 "每位不属于[GetCultureGroup('persia').GetName|Y]文化的角色将在#Y 60#!个月内获得#G 5#! @loyalty_icon!忠诚度。"
 me_hcp_02.8.b.tt:0 "每位不属于[GetCultureGroup('persia').GetName|Y]文化的角色将在#Y 60#!个月内失去#R 5#! @loyalty_icon!忠诚度。"
 me_hcp_02.8.desc:0 "关于我们的政治正当性的辩论已经形成，因为雇佣兵和野蛮人才会为了血或金而战，而不是像我们这样的尊贵王国。\n\n一方认为我们应该展示自己为仁慈的收复者，解放那些现在在外族压迫下受苦的人们。另一方面则认为我们无需复杂化，只需宣称我们的血脉赋予我们比其他自称为万王之王的人更大的对波斯的主张！\n\n最后，我们的[ROOT.GetCountry.GetRulerTitle]呼吁安静，并大声宣布。"
 me_hcp_02.8.t:0 "我们的理由是什么？"
 me_hcp_02.9.a:0 "征召将是不幸的必要"
 me_hcp_02.9.b:0 "我们的一个战士将相当于十个敌人的价值！"
 me_hcp_02.9.desc:0 "再一次，会议陷入僵局。\n\n一方支持征召所有适龄男子参与即将到来的战争，因为我们如果不这样做，敌人无疑将在数量上占据巨大优势。\n\n然而，另一方认为我们应该投资于对我们现有的常备军进行进一步训练，专注于创建一支虽小但高度训练的部队，能够果断粉碎和驱散敌人的未受训的新兵。"
 me_hcp_02.9.t:0 "我们的军队？"
 me_hcp_free_pantheon:0 "此外，您将能够在半年内以#G 大幅降低的成本#!改变您的国家神殿组成！"

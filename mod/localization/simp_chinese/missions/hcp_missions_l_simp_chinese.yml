 hcp_persis_submission.tt:0 "我们将呼吁 [GetCountry('PES').GetName|Y] 中的阿契美尼德忠臣，并尝试将其领土重新置于我们的控制之下。"
 hcp_phoenician_city.tt:0 "在 [GetProvince('(int32)790').GetArea.GetRegion.GetName|Y] 地区至少有一个独立的[GetCulture('phoenician').GetName|Y]国家，其领土少于5个且未与我们结盟或处于战争状态。"
 hcp_phoenician_subject.tt:0 "我们将向[GetCulture('phoenician').GetName|Y]城邦提供保护，可能使它们成为我们的#Y 联盟城市#!!"
 hcp_pleased:0 "取悦人民"
 hcp_pontic_league.tt:0 "我们将向我们的防御联盟成员提供更强大的保护，作为我们的#Y 藩属#!。"
 hcp_promises_kept:0 "履行居鲁士的承诺"

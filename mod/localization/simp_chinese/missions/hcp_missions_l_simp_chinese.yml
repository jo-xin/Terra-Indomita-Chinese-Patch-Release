 hcp_horse_bois.tt:0 "在[GetProvince('(int32)3455').GetArea.GetRegion.GetName|Y]或[GetProvince('(int32)5491').GetArea.GetRegion.GetName|Y]地区至少有一个独立的[GetCulture('derbiccan').GetName]、[GetCulture('kharesmian').GetName]或[GetCulture('massagetaean').GetName]国家作为首都，且不与我们结盟或处于战争状态。"
 hcp_horseboi_diplomacy.tt:0 "我们的统治者将亲自访问最大的草原部落，并携带丰厚的礼物，以改善我们与他们的关系，并有可能使他们成为我们的#Y 部落附庸#!!"
 hcp_imperial_diaspora.tt:0 "大量 [GetCulture('pasargadi').GetName|Y] 族群将出现在整个美索不达米亚！"
 hcp_larp_mode_activated.tt:0 "我们的名字、旗帜和传承将改变以更好地反映#T 阿契美尼德王朝#!的荣耀！"
 hcp_leontophoros_launching.tt:0 "史上最大战舰——#Y 利昂托弗罗斯#!将#G 启航!#!"
 hcp_levy_focus:0 "征召兵重点"
 hcp_macedonians_ariana.tt:0 "我们将决定如何对待 #Y 阿里亚纳#!中的[GetCulture('macedonian').GetName|Y]定居者！"
 hcp_macedonians_media.tt:0 "我们将决定如何对待 #Y 米底#!中的[GetCulture('macedonian').GetName|Y]定居者！"
 hcp_macedonians_persis.tt:0 "我们将决定如何对待 #Y 波斯#!中的[GetCulture('macedonian').GetName|Y]定居者！"

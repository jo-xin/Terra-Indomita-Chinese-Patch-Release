l_simp_chinese:
 achaemenid_adj:0 "阿契美尼德"
 achaemenid_kingdom_name:0 "阿契美尼德王国"
 cyrus_cylinder:0 "居鲁士圆筒"
 cyrus_cylinder_desc:0 "描述阿契美尼德国王居鲁士大帝在其征服巴比伦时的事迹的一块泥筒。铭文首先谴责了巴比伦之前的统治者那波尼德斯，并将居鲁士与美索不达米亚的神马尔杜克联系起来。"
 desc_hcp_achaemenid_capital:0 "这座城市已被宣布为阿契美尼德帝国的皇家首都，赋予其众多特权，并包含一个豪华的宫殿建筑群，供统治者的家族在访问时使用。"
 desc_hcp_city_of_amastris:0 "本都殖民地塞萨穆斯、基托鲁斯和克罗姆纳已统一为一座波斯城市，以我们亲爱的统治者的名字命名！"
 desc_hcp_encouraged_settlers:0 "随着该省大部分人口的重新安置，地方政府正在提供激励措施，吸引新的、更理想的人来取代他们。"
 desc_hcp_homelands_reclaimed:0 "人们对于能够返回他们的祖居地感到非常高兴！"
 desc_hcp_magi_activity:0 "祆教祭司在这片土地上传教的热情异常高涨。"
 desc_hcp_magnificent_steppe_horse:0 "一件非凡的标本，作为友谊的象征由萨卡酋长赠送给他们。"
 desc_hcp_parthian_training:0 "在帕提亚崎岖的山丘中训练我们的士兵，使他们更好地适应类似地形上的战斗！"
 desc_hcp_persepolis_administrative_archive:0 "在这座城市里有波斯波利斯行政档案，数百块泥板揭示了阿契美尼德帝国的经济、管理、宗教和社会条件！"
 desc_hcp_seleukia_nuked:0 "这种文化对我们完全摧毁塞琉西亚感到震惊。"
 desc_hcp_seleukia_spared:0 "这种文化感谢我们对塞琉西亚居民表现出的仁慈。"
 desc_hcp_triumphant_achaemenids:0 "阿契美尼德帝国在重重困难下重生了！"
 desc_hcp_zagros_bastion:0 "一个强大且防守严密的位置，确保了穿越扎格罗斯山脉的关键咽喉要道的安全。"
 hcp_01_pantheon.tt:0 "我们的万神殿中至少有1位[GetReligion('roman_pantheon').GetName|Y]和1位[GetReligion('zoroaster').GetName|Y]的神明。"

l_simp_chinese:
 flavor_egy.12.desc.2:0 "随着[flavor_egy_12_magas_scope.GetPraenomen]在[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的地位得到巩固，他开始寻求效法阿加托克勒斯与继业者诸王，以独立国王的身份巩固对该地区的控制。\n\n我们应当保持警惕，并铭记当奥斐拉斯的野心超越了仅仅对[GetCountry('EGY').GetName]的臣服时，众神是如何惩罚他的狂妄自大的……"
 flavor_egy.13.desc.2:0 "依托其在[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的稳固地位，[flavor_egy_12_magas_scope.GetName]已自立为[GetCountry('CYR').GetName]之王，并明确宣示其疆域不再仅仅是[GetCountry('EGY').GetName]的附庸。\n\n这个背信之徒辜负了拉戈斯王朝的信任，但或许让他统治彭塔波利斯，比用一场旷日持久的战争削弱我们自己更为简单。"
 me_egypt_1_sea.1.a:0 "让我们来修建一座新的要塞！"
 me_egypt_1_sea.1.b:0 "既然现在的城墙能挡住[GetCharacter('(int32)38').GetName]，那它就能挡住一切事物。"
 me_egypt_1_sea.1.desc:0 "不久前，[GetCharacter('(int32)38').GetName]，[GetCharacter('(int32)37').GetName]之子，围攻了[GetProvince('(int32)266').GetName]以阻止他们与我们联手。\n\n我们应当资助罗得斯人修建新的要塞，更高的城墙和更坚固的塔楼，以彰显我们对罗得斯人的保护与友谊。我们在地中海这一地区的影响力无人可以质疑！"
 me_egypt_1_sea.1.t:0 "罗得斯宫廷：罗得斯人的堡垒"
 me_egypt_1_sea.10.a:0 "没错，让我们创建#Y 克律萨俄里斯同盟#!！"
 me_egypt_1_sea.10.a.tt:0 "创建#Y 克律萨俄里斯同盟#!作为藩属国。"
 me_egypt_1_sea.10.a.tt.2:0 "我们或附属国在[GetProvince('(int32)1980').GetArea.GetName|Y]和[GetProvince('(int32)1956').GetArea.GetName|Y]拥有的每一块领土，现在都将属于#Y 克律萨俄里斯同盟#!。"
 me_egypt_1_sea.10.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_10$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.10.b:0 "不，这片地区还是我们直接控制比较好。"
 me_egypt_1_sea.10.desc:0 "考虑到卡里亚（[GetProvince('(int32)1980').GetArea.GetName]和[GetProvince('(int32)1956').GetArea.GetName]）的地理位置，它是我们的海上帝国难以控制的地区。然而，我们可以利用卡里亚人强烈的本地认同，减轻军事和官僚机构的负担。允许他们一定程度的自治将确保其满意和长期忠诚。这还会提高我们在所有希腊人中的声望，他们会把[ROOT.GetCountry.GetRuler.GetName]视为期待已久的解放者。\n我们可以在克律萨俄柔斯·宙斯的庇护下，将卡里亚人释放为一个附属同盟；这位神祇在[GetProvince('(int32)1980').GetName]当地圣所受到崇拜。\n\n我们是否要继续？"
 me_egypt_1_sea.10.t:0 "亚细亚同盟：克律萨俄里斯同盟"
 me_egypt_1_sea.11.a:0 "就这样！今天，希腊联盟重生了。"
 me_egypt_1_sea.11.a.tt:0 "创建#Y 希腊联盟#!作为藩属。"
 me_egypt_1_sea.11.a.tt.2:0 "整个地中海的[GetCulture('macedonian').GetCultureGroup.GetName|Y]人都会对我们满意。"
 me_egypt_1_sea.11.a.tt.3:0 "我们或我们的附属国在[GetProvince('(int32)427').GetArea.GetRegion.GetName|Y]和[GetProvince('(int32)389').GetArea.GetName|Y]拥有的所有领土现在都会属于#Y 希腊联盟#!。"
 me_egypt_1_sea.11.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_11$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.11.b:0 "在任何事上都不要相信希腊人。我们最好保持现状。"
 me_egypt_1_sea.11.b.tt:0 "整个地中海地区的[GetCulture('macedonian').GetCultureGroup.GetName|Y]文化人民将对我们感到不满。"
 me_egypt_1_sea.11.b.tt.2:0 "我们的希腊属民将深感失望。"
 me_egypt_1_sea.11.desc:0 "希腊人从未在政治上统一过，他们一直为自己共享文化但各城邦自治的传统而自豪。只有在非常必要的情况下，例如波斯人入侵时，他们才会短暂结成高度不稳定的同盟。\n\n这种心态让他们在面对亚历山大帝国的崛起和继业者的统治时四分五裂，脆弱不堪。这也是为什么希腊人最终选择了[ROOT.GetCountry.GetRuler.GetName]来团结他们，指引他们。他们视我们的巴西琉斯为解放者和保护者，梦想着希腊再次团结起来，对抗东方的敌人。"
 me_egypt_1_sea.11.t:0 "新希腊联盟"
 me_egypt_1_sea.12.a:0 "那就开始吧！"
 me_egypt_1_sea.12.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]将在[GetProvince('(int32)266').GetName]启动建设工程。"
 me_egypt_1_sea.12.desc:0 "罗得人自太古之初便受到众神庇佑。他们的岛屿是希腊本土、爱琴海诸岛、小亚细亚与东方之间的天然桥梁。其面积足够富庶、人口稠密，又不至于难以控制与防御，[GetProvince('(int32)266').GetName]数世纪以来一直繁荣昌盛。\n\n该地位于爱琴海入口，坐落于重要的贸易航线上，吸引了我们的关注。而他们抵御[GetCharacter('(int32)38').GetName]时所展现出的坚定勇气，更值得我们给予相应的补偿。\n\n我们应当投资[GetProvince('(int32)266').GetName]的发展，使其成为我们扩张该地区的重要跳板。"
 me_egypt_1_sea.12.t:0 "罗得法庭：罗得的发展"
 me_egypt_1_sea.13.a:0 "这结果令人满意。"
 me_egypt_1_sea.13.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_8$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.13.desc:0 "历经一年投资与施工，如今[GetProvince('(int32)266').GetName]已焕然一新，终于配得上作为我们帝国北方首都的称号！\n\n现代建筑与精美雕像装点着城市，固若金汤的堡垒守护着它。我们的顶尖学者云集于罗得的学堂，来自已知世界各地的商品充斥着罗得的市场，如今，这座城市随时都可迎接巴西琉斯的驾临！"
 me_egypt_1_sea.13.t:0 "罗得法庭"
 me_egypt_1_sea.14.a:0 "我们就这么干吧！"
 me_egypt_1_sea.14.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]将在[GetProvince('(int32)331').GetArea.GetName]启动建设工程。"
 me_egypt_1_sea.14.desc:0 "[GetProvince('(int32)331').GetArea.GetName]，美丽的[aphrodite_scope.GetName]女神的诞生地，确有其神祇般的魅力。然而对我们而言，真正重要的是其优越的地理位置与良港，这使我们能够监控叙利亚与小亚细亚的沿海。\n\n岛屿比内陆地区更容易防守，但若不扩展[GetProvince('(int32)331').GetArea.GetName]的港口设施与贸易经济，也难以实现我们的目标。"
 me_egypt_1_sea.14.t:0 "塞浦路斯港口：投资塞浦路斯"
 me_egypt_1_sea.15.a:0 "这一切都值得。"
 me_egypt_1_sea.15.a.tt:0 "若尚未拥有，[GetProvince('(int32)334').GetName|Y]、[GetProvince('(int32)331').GetName|Y]以及[GetProvince('(int32)331').GetArea.GetName|Y]中所有拥有矿场的领土，现皆归属于[GetCountry('EGY').GetName]。"
 me_egypt_1_sea.15.a.tt.2:0 "[GetProvince('(int32)334').GetName|Y]还将获得“#Y $cyprian_docks_modifier$#!”。"
 me_egypt_1_sea.15.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_9$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.15.desc:0 "过去一年，整个岛屿尤其是[GetProvince('(int32)331').GetArea.GetName]的主要港口纷纷设立了施工场地。如今工程已告完成，一个更加富庶、更加高效的[GetProvince('(int32)331').GetArea.GetName]正等待着[ROOT.GetCountry.GetRuler.GetName]的检阅。"
 me_egypt_1_sea.15.t:0 "塞浦路斯港口：塞浦路斯的新港口"
 me_egypt_1_sea.16.a:0 "干得漂亮。"
 me_egypt_1_sea.16.a.tt:0 "[GetProvince('(int32)529').GetName|Y]与[GetProvince('(int32)517').GetName|Y]也将获得“#Y $alexandria_shipyard_modifier$#!”。"
 me_egypt_1_sea.16.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_1$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.16.desc:0 "埃及之所以长期专注内陆事务，其中一个主要原因便是缺乏适于远洋的木材。纸莎草虽能建造轻便的小船，在尼罗河上行之有效，却完全无法面对大海的风浪。\n\n如今我们已通过贸易为[GetProvince('(int32)516').GetName]确保了稳定的木材来源，是时候建造有史以来最大的舰船，去挑战波涛了！"
 me_egypt_1_sea.16.t:0 "亚历山大船厂：亚历山大的港口"
 me_egypt_1_sea.17.a:0 "这一成就值得自豪。"
 me_egypt_1_sea.17.a.tt:0 "海军上将#Y 卡利克拉忒斯（Kallikrates）#!现身于#Y $mare_aegyptum_area$#!。"
 me_egypt_1_sea.17.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_2$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.17.desc:0 "海盗已困扰尼罗河、地中海与红海数世纪之久。他们之兴旺，全赖所有地方势力的软弱或纵容。\n\n彻底根除海盗乃不可能完成之事，但我们已成功将海盗从其沿岸巢穴中逐出，令其重回可控范围。诚然，我们仍需抗击来自他国的海盗，但我方的信号已明确无误：海盗在[GetCountry('EGY').GetName]不受欢迎。"
 me_egypt_1_sea.17.t:0 "安全航线：海盗肃清"
 me_egypt_1_sea.18.a:0 "继续前进！"
 me_egypt_1_sea.18.a.tt:0 "[GetCountry('EGY').GetName]获得对[GetProvince('(int32)7901').GetName|Y]、[GetProvince('(int32)283').GetName|Y]、[GetProvince('(int32)1974').GetName|Y]、[GetProvince('(int32)266').GetName|Y]、[GetProvince('(int32)331').GetName|Y]、[GetProvince('(int32)1989').GetName|Y]和[GetProvince('(int32)1973').GetName|Y]的宣称，若其尚未被拥有或非属国所有。\n海军将领#Y 巴克洪#!出现在#Y $mare_aegaeum_area$#!。"
 me_egypt_1_sea.18.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_3$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.18.desc:0 "[GetProvince('(int32)1915').GetArea.GetName]自亚历山大去世后便纷争不断。我们虽重视海权，但[GetCharacter('(int32)37').GetPraenomen]的野心更盛，他派其子[GetCharacter('(int32)38').GetPraenomen]前往爱琴海诸岛，以极其苛刻的条件换取友谊。诸岛无法拒绝，遂屈服于他，然而在后来却将[ROOT.GetCountry.GetRuler.GetName]视为救星与和平缔造者，也确实未曾失望。\n\n如今大多数岛屿已归我们庇护之下，我们应当巩固我们在整个爱琴海的地位！"
 me_egypt_1_sea.18.t:0 "岛屿联盟：爱琴海的和平"
 me_egypt_1_sea.19.a:0 "[GetCountry('EGY').GetName]乃可畏之敌。"
 me_egypt_1_sea.19.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_4$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.19.desc:0 "连远征特洛伊的伟大阿伽门农，其舰队都不及我们这般浩荡。若将我军舰船汇聚于一地，其帆足以遮蔽天际！\n\n这支王室舰队历经时间、精力与金银的投入，终得建成，已整装待发，足以应对任何挑战，将我们的影响力扩展至地中海的每一个角落。"
 me_egypt_1_sea.19.t:0 "海军强权：最强舰队"
 me_egypt_1_sea.2.a:0 "让我们来修建一座新的图书馆！"
 me_egypt_1_sea.2.b:0 "[GetProvince('(int32)516').GetName]应当成为唯一一座我国人民所向往的文化之都。"
 me_egypt_1_sea.2.desc:0 "我们正努力将[GetProvince('(int32)266').GetName]建成王国的北都，但如果只有伟岸的城墙和建筑，城内却没有同样伟岸的智者，那这一目标不过是空谈。这座城市应当能够吸引最高水平的知识分子搬迁至此，或者能够培养出最高水平的知识分子，他们应该将这里视作生活以及追求知识的完美地点。\n\n要想满足他们的需求，我们必须建立更多图书馆，并派出我们最优秀的知识分子去管理！"
 me_egypt_1_sea.2.t:0 "罗得斯宫廷：罗得斯的图书馆"
 me_egypt_1_sea.20.a:0 "看到了吧，[GetCharacter('(int32)37').GetPraenomen]，你这老傻瓜！"
 me_egypt_1_sea.20.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_5$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.20.desc:0 "在[GetCharacter('(int32)37').GetName]及其子[GetCharacter('(int32)38').GetPraenomen]之前，无人尝试全面控制爱琴海。而他们虽曾尝试，却唯有[ROOT.GetCountry.GetRuler.GetName]真正实现了这一目标。\n\n如今，爱琴海的众多岛屿皆在我们庇护之下，首次享受同一旗帜下的和平与安全。岛民们为我们的到来举办盛会，向诸神献祭欢庆！"
 me_egypt_1_sea.20.t:0 "爱琴守护者：爱琴领地"
 me_egypt_1_sea.21.a:0 "继续前进。"
 me_egypt_1_sea.21.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_6$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.21.desc:0 "我们已掌控东地中海最大岛屿，并在小亚细亚建立了若干海军基地，确保了我们在该区域的地位，同时也令我们的势力不断增长！\n\n但我们切不可自满。我们在亚洲的领地远离埃及、防守困难，一旦失去海上优势，这些飞地将彻底孤立无援。"
 me_egypt_1_sea.21.t:0 "亚洲港口：安全飞地"
 me_egypt_1_sea.22.a:0 "这是莫大的荣誉。"
 me_egypt_1_sea.22.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_7$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.22.desc:0 "曾经以海军强大和海上霸权著称的雅典人，如今承认了我们的卓越地位，并将他们的命运托付于我们。 \n\n我们谦卑地继承了他们守护希腊自由与自治的使命，承诺将在共同敌人与未来入侵者面前支持希腊的事业。"
 me_egypt_1_sea.22.t:0 "希腊立足点：古老传统的守护者"
 me_egypt_1_sea.23.a:0 "干得好。"
 me_egypt_1_sea.23.a.tt:0 "我们拥有的[GetProvince('(int32)438').GetArea.GetName|Y]、[GetProvince('(int32)416').GetArea.GetName|Y]和[GetProvince('(int32)440').GetArea.GetName|Y]区域内的所有领地将获得“#Y $greek_stronghold_secured$#!”修正。"
 me_egypt_1_sea.23.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_12$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.23.desc:0 "我们在[GetProvince('(int32)416').GetName]附近夺取了一些坚固的海军基地。这些地区人口稀少，资源也不特别丰厚，但它们具有极高的战略价值，能够加强我们在希腊的地位。\n\n整个区域都在我们的直接控制之下，我们的舰队得以安全停泊，如今敌人要将我们逐出希腊将难如登天！"
 me_egypt_1_sea.23.t:0 "希腊据点：萨罗尼科斯湾已稳固"
 me_egypt_1_sea.24.a:0 "欢呼吧！"
 me_egypt_1_sea.24.a.tt.1:0 "[GetCountry('EGY').GetName]获得对[GetProvince('(int32)379').GetArea.GetRegion.GetName|Y]（[GetProvince('(int32)379').GetName|Y]、[GetProvince('(int32)393').GetName|Y]及[GetProvince('(int32)365').GetName|Y]）的宣称。"
 me_egypt_1_sea.24.a.tt.2:0 "我们拥有的[GetProvince('(int32)416').GetArea.GetRegion.GetName|Y]与[GetProvince('(int32)391').GetArea.GetName|Y]内的所有省份将获得“#Y $egypt_free_greece$#!”修正。"
 me_egypt_1_sea.24.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_13$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.24.desc:0 "完成了。\n\n在[ROOT.GetCountry.GetRuler.GetName]的卓越领导下，希腊终于摆脱了亚历山大继业者的压迫与干涉，从今往后，不再是他们偏爱的战场。\n\n今日起，整个希腊将在我们的保护下享有自由与自治！传统与信仰将受到尊重，希腊人也将摆脱那些困扰他们历史的内战，迈向前所未有的繁荣。"
 me_egypt_1_sea.24.t:0 "克雷莫尼德战争：希腊得以解放"
 me_egypt_1_sea.25.a:0 "前进！"
 me_egypt_1_sea.25.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_14$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.25.desc:0 "[GetProvince('(int32)379').GetName]陷落，随之而去的是马其顿的古都[GetProvince('(int32)428').GetName]，那是马其顿诸王祖先陵墓的所在。\n\n[ROOT.GetCountry.GetRuler.GetName]证明了其家族对亚历山大失落帝国的正统继承，现在他坐上了亚历山大的王座。而昔日的梦想，如今近在眼前。\n\n我们的下一个目标是重建亚历山大的帝国。"
 me_egypt_1_sea.25.t:0 "亚历山大的王座"
 me_egypt_1_sea.26.a:0 "让我们庆祝这份成就吧！"
 me_egypt_1_sea.26.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_final$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.26.desc:0 "这是值得庆祝的壮举。\n\n整个东地中海尽归我们控制。我们的舰船畅行无阻，受到各港欢迎；商旅得以安然通行于遥远之地；希腊人在我们的保护下歌颂自由；沿海各城也因我们带来的和平而欢欣鼓舞。\n\n我们的海权已无可匹敌。"
 me_egypt_1_sea.26.t:0 "地中海之主"
 me_egypt_1_sea.27.a:0 "希望罗得人明智抉择。"
 me_egypt_1_sea.27.a.tt:0 "我们向[GetProvince('(int32)266').GetName|Y]派出使团。大约一个月后将收到回应。"
 me_egypt_1_sea.27.desc:0 "关于[GetProvince('(int32)266').GetName]的事务，再次引起了[ROOT.GetCountry.GetRuler.GetPraenomen]的关注。\n\n这座富饶的岛屿在我们王国建立初期、继业者之间激战不断之时，曾是我们的朋友。罗得人以友好换来了一场漫长的围城战——由[GetCharacter('(int32)38').GetPraenomen]，即[GetCharacter('(int32)37').GetName]之子发动——但他们熬过了考验，在我们与安提柯之间的斗争中维持了一种中立的平衡。然而多年过去，显而易见的是，这种平衡无法永续。[GetProvince('(int32)266').GetName]既诱人又软弱，地中海列强迟早会对其下手。\n\n我们必须立即采取行动，为自己争取一个安全港口。 [ROOT.GetCountry.GetRuler.GetPraenomen]的朝廷已达成共识：我们将向[GetProvince('(int32)266').GetName]派遣使团，带去礼物，正式提出保护请求。"
 me_egypt_1_sea.27.t:0 "关于罗德岛的问题：向罗德岛提出建议"
 me_egypt_1_sea.28.a:0 "战争！"
 me_egypt_1_sea.28.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_15$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.28.desc:0 "不幸的是，我们的提议来得太晚。[GetProvince('(int32)266').GetName]已经接受了[GetCountry('PRY').GetName]的庇护，无法被我们争取。\n\n但该岛对我们的地中海霸权至关重要，我们无法容忍这种对[GetProvince('(int32)266').GetName]中立地位的公开侵犯。\n\n唯一可行的选项只有一个。"
 me_egypt_1_sea.28.t:0 "关于罗德岛的问题：安提柯的庇护"
 me_egypt_1_sea.29.desc:0 "不幸的是，我们的提议来得太晚。[GetProvince('(int32)266').GetName]已经接受了[rhodes_owner_egypt_29.GetName]的庇护。\n\n但该岛对我们地中海政策至关重要，我们无法容忍罗得人沦为外族奴役。\n\n要解救他们，唯有一途可行。"
 me_egypt_1_sea.29.t:0 "关于罗德岛的问题：外国势力介入"
 me_egypt_1_sea.3.a:0 "让我们来修建一座新的学院！"
 me_egypt_1_sea.3.b:0 "罗得斯人想要学习，那他们应该去[GetProvince('(int32)516').GetName]。"
 me_egypt_1_sea.3.desc:0 "想要将[GetProvince('(int32)266').GetName]建成王国的文化之都，我们需要投资学校，让当地的精英能接受与[GetProvince('(int32)516').GetName]同水准的教育。\n\n国家最有前途的贵族青年将在[GetProvince('(int32)266').GetName]接受高水平的哲学教育，并成长为统治阶级；优秀的学院还会吸引周边国家的统治阶级，这样我们的文化将传播得更广！"
 me_egypt_1_sea.3.t:0 "罗得斯宫廷：罗得斯学院"
 me_egypt_1_sea.30.a:0 "虽非我们所愿，但也算一个开端。"
 me_egypt_1_sea.30.desc:0 "近年来我们与罗德岛的关系不断恶化，以至于我们的保护提议在岛上引发了严重动荡。\n\n经过整整一个月的激烈辩论，他们终于做出了决定。\n\n他们欣赏我们对其自由与安全的关切，但岛上反对者众多，若贸然接受我方提议，很可能引发内战。因此，他们提出缔结同盟，以此向岛内民众展示我方善意，并为今后消弭分歧争取时间。"
 me_egypt_1_sea.30.t:0 "关于罗德岛的问题：不安的联盟"
 me_egypt_1_sea.31.a:0 "成功了！"
 me_egypt_1_sea.31.desc:0 "我们收到了来自罗德岛的回复：他们接受我们慷慨的保护提议！\n\n从今日起，他们将成为我们的附庸，享受我们的保护，协助我们作战，也许有朝一日，将完全融入我们光辉的帝国。[GetProvince('(int32)266').GetName]无疑是希腊世界最富庶美丽的城市之一，我们将热情欢迎他们，作为我们王冠上的又一颗宝石。"
 me_egypt_1_sea.31.t:0 "关于罗德岛的问题：接受庇护"
 me_egypt_1_sea.32.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen]只该用最好的玻璃器皿。"
 me_egypt_1_sea.32.a.tt:0 "每个产出玻璃的领地将获得“#Y $egypt_rhodian_glass_masters$#!”修正。"
 me_egypt_1_sea.32.b:0 "我们不需要玻璃——它总是碎！"
 me_egypt_1_sea.32.desc:0 "[GetProvince('(int32)266').GetName]自古以来便是希腊地中海世界最早的玻璃生产与贸易中心之一。奢侈玻璃制品与其他独特玻璃工艺品自罗德作坊传出，流传四方。若要表达我们对该岛的感激，最好的方式就是支持其本地贸易。同时，玻璃产量的提升也将惠及我们这些主要贸易伙伴。"
 me_egypt_1_sea.32.t:0 "罗德宫廷：玻璃工坊"
 me_egypt_1_sea.33.a:0 "可恶！"
 me_egypt_1_sea.33.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_8$#!' $mission_bypassed_tooltip_2$"
 me_egypt_1_sea.33.desc:0 "对[GetCountry('EGY').GetName]而言，这确是一个悲痛的日子。我们已失去对[GetProvince('(int32)266').GetName]的控制，随之失去的，还有我们在地中海建立都城的梦想。\n他人将收获我们投资的成果，除非我们立即夺回[GetProvince('(int32)266').GetName]！\n\n无论如何，我们的投资项目进展受阻——我们不想将钱财投入敌人之库！"
 me_egypt_1_sea.33.t:0 "罗德宫廷：罗德沦陷！"
 me_egypt_1_sea.34.a:0 "这可不妙……"
 me_egypt_1_sea.34.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_9$#!' $mission_bypassed_tooltip_2$"
 me_egypt_1_sea.34.desc:0 "我们已经失去了众神的青睐。\n\n[aphrodite_scope.GetName]愤怒地转过头去，我们放弃了对[GetProvince('(int32)331').GetArea.GetName]的控制，所有的投资将被外族享用——除非我们重新夺回这座岛屿。\n\n但在此之前，我们必须终止投资计划。[GetProvince('(int32)331').GetArea.GetName]已不再是受控地区，而是争议区域，我们不能冒险让我们的黄金反过来资助敌人！"
 me_egypt_1_sea.34.t:0 "塞浦路斯船坞：失去塞浦路斯！"
 me_egypt_1_sea.35.a:0 "这才是该有的做法。"
 me_egypt_1_sea.35.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_15$#!' $mission_bypassed_tooltip_2$"
 me_egypt_1_sea.35.desc:0 "有时候，帝国扩张的需要已经无法等待冗长的外交程序。我们无法再等那些冥顽不灵的罗得岛政客权衡他们所谓的外交方针，于是亲自解决了问题。\n\n如今我们已掌控了[GetProvince('(int32)266').GetName]，罗得岛人失去了所有自决的权利。我们的使团将空手而归，可惜的是，我们随使节派出的黄金也打了水漂；或许我们还能设法让罗得岛人退还一部分。"
 me_egypt_1_sea.35.t:0 "罗得岛之事：罗得岛的主宰"
 me_egypt_1_sea.36.a:0 "祝贺我们！"
 me_egypt_1_sea.36.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea$#!' $mission_completed_tooltip_2$"
 me_egypt_1_sea.36.desc:0 "地中海上已无敌手！现在，唯有波塞冬能挑战我们在海上的霸权。我们拥有最大规模的舰队，所有岛屿皆屈从于我们的意志并颂扬我们的庇护，我们的敌人惶恐不安地望着海面，猜不透我们何时、何地会发起下一次打击，却能预见他们必将失败。自弥诺斯王以来，从未有人在海上取得如此伟业！"
 me_egypt_1_sea.36.t:0 "称霸海洋！"
 me_egypt_1_sea.37.a:0 "我们将以武力征服他们！"
 me_egypt_1_sea.37.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_1_sea_task_15$#!' $mission_bypassed_tooltip_2$"
 me_egypt_1_sea.37.desc:0 "有时候，帝国扩张的需要已经无法等待冗长的外交程序。我们无法再等那些冥顽不灵的罗得岛政客权衡他们所谓的外交方针，于是亲自解决了问题。\n\n我们将以战争手段夺取[GetProvince('(int32)266').GetName]的控制权，罗得岛人将失去所有自决的权利。我们的使团将空手而归，可惜的是，我们随使节派出的黄金也打了水漂；也许我们可以通过洗劫城市的方式拿回这笔钱。"
 me_egypt_1_sea.37.t:0 "罗得岛之事：诉诸武力"
 me_egypt_1_sea.4.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen]期待着精美雕塑的诞生。"
 me_egypt_1_sea.4.b:0 "要是这些艺术家真有那么好，他们应该都搬去[GetProvince('(int32)516').GetName]。"
 me_egypt_1_sea.4.desc:0 "如今，全世界最优秀的雕刻家皆聚集于[GetProvince('(int32)266').GetName]以精进技艺。他们充满戏剧性的风格风靡于各个继业者宫廷，已然成为精致与高雅的代名词。此市场尚有巨大潜力，只要有合适的资助，罗得人甚至可以将雕像卖给西方的蛮族！"
 me_egypt_1_sea.4.t:0 "罗得斯宫廷：雕刻学校"
 me_egypt_1_sea.5.a:0 "让我们在[GetProvince('(int32)331').GetName]修建一座新市场！"
 me_egypt_1_sea.5.b:0 "我们不需要更多商人了。"
 me_egypt_1_sea.5.desc:0 "[GetProvince('(int32)331').GetArea.GetName]一直是希腊世界、埃及和小亚细亚之间的天然贸易桥梁。对当地商业的每一笔投资都会为我们带来丰厚的回报。\n\n尤其是[GetProvince('(int32)331').GetName]，一座古老而富裕的城市，以其商人闻名于世，首先将亚述货物和埃及神灵介绍给大陆希腊人的就是他们。我们应当展示对当地市场的支持，安抚城市里最具影响力的商人。"
 me_egypt_1_sea.5.t:0 "塞浦路斯码头：萨拉米斯市场"
 me_egypt_1_sea.6.a:0 "那么，让我们来支持当地的传统！"
 me_egypt_1_sea.6.a.tt:0 "[GetProvince('(int32)334').GetName|Y]、[GetProvince('(int32)516').GetName|Y]和[GetProvince('(int32)416').GetName|Y]获得#Y $cyprus_shipbuilder_tradition$#!。"
 me_egypt_1_sea.6.b:0 "我们不需要更多船了。"
 me_egypt_1_sea.6.desc:0 "[GetProvince('(int32)331').GetName]是控制小亚细亚南海岸和叙利亚及腓尼基沿海的理想港口。岛上木材资源丰富，传统上以造船工和桨手闻名。\n\n我们应该利用这一点；支持当地的木材贸易也对[GetProvince('(int32)331').GetArea.GetName]的主要贸易伙伴大有裨益。另一方面，我们的利益在于海洋，安抚这些臭名昭著的水手只会对我们有利。"
 me_egypt_1_sea.6.t:0 "塞浦路斯码头：闻名遐迩的造船工"
 me_egypt_1_sea.7.a:0 "让我们修建一座献给[aphrodite_scope.GetName]的新神庙！"
 me_egypt_1_sea.7.b:0 "[aphrodite_scope.GetName]的圣所已经足够宏伟，足够富裕了。"
 me_egypt_1_sea.7.desc:0 "[GetProvince('(int32)334').GetName]是东地中海[aphrodite_scope.GetName]崇拜最大、最重要的中心；根据传说，女神诞生于海浪之中，从海中现身后，最先于[GetProvince('(int32)334').GetName]登陆。因为这个故事，她获得了“帕菲亚”的名号，数个世纪以来，人们都以这一别名称呼她。\n\n既然我们追求对海洋的绝对控制，那就绝不可忽视这位诞生于海浪中的强大女神！"
 me_egypt_1_sea.7.t:0 "塞浦路斯码头：阿佛洛狄忒的祝福"
 me_egypt_1_sea.8.a:0 "让我们来修建一些矿井！"
 me_egypt_1_sea.8.b:0 "要是太多铜流入市场导致通货膨胀怎么办？"
 me_egypt_1_sea.8.desc:0 "[GetProvince('(int32)331').GetArea.GetName]是全地中海的主要铜矿出产地之一，而铜可以铸造硬币。我们应该确保有稳定的原材料产出来供应我们的铸币厂！\n\n此外，铜还广泛应用于几种日常使用的合金，尤其是青铜。虽然青铜在军事装备中的使用越来越少，但它仍是制作雕像的重要材料，并且广泛用于陶器和装饰。"
 me_egypt_1_sea.8.t:0 "塞浦路斯码头：铜矿"
 me_egypt_1_sea.9.a:0 "让我们来修建更多税务所！"
 me_egypt_1_sea.9.b:0 "我们尊重臣民勤劳致富。"
 me_egypt_1_sea.9.desc:0 "由于人口众多，自然资源丰富，地处理想的贸易位置，[GetProvince('(int32)331').GetArea.GetName]成为了一座非常富裕的岛屿。不过大部分财富仍将掌握在普通公民手中——除非我们向他们征税。"
 me_egypt_1_sea.9.t:0 "塞浦路斯码头：巴西琉斯的税收"
 me_egypt_2_pharaoh.1.a:0 "梦想成真。"
 me_egypt_2_pharaoh.1.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_1$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.1.desc:0 "亚历山大在[GetProvince('(int32)516').GetName]建立了埃及的新城，位置极为优越，坐落于尼罗河三角洲，面朝地中海拥有两个天然港口。他梦想着这座城市能成为马其顿新统治者的希腊化都城，一座连接尼罗河与希腊世界的桥梁。他在奠基后再也未曾归来。\n\n然而我们相信，若亚历山大能亲眼见到今天的[GetProvince('(int32)266').GetName]，他一定会认同：这正是他梦想中的城市。"
 me_egypt_2_pharaoh.1.t:0 "王都：亚历山大的城市"
 me_egypt_2_pharaoh.10.a:0 "举兵反攻！"
 me_egypt_2_pharaoh.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_5$#!' $mission_bypassed_tooltip_2$"
 me_egypt_2_pharaoh.10.desc:0 "我们光辉的首都不再属于我们！\n\n这本身就是极大的耻辱，也意味着我们必须暂时放弃对这座城市的文化美化计划。由于敌人占据了[GetProvince('(int32)516').GetName]，我们无法在此建造任何东西，打造一个超过[GetProvince('(int32)416').GetName]、引领希腊文化的全新首都的梦想也被迫搁置。\n\n我们必须尽快夺回[GetProvince('(int32)516').GetName]！"
 me_egypt_2_pharaoh.10.t:0 "贤士之城：失落的亚历山大"
 me_egypt_2_pharaoh.11.a:0 "这才是现代国家的运作方式。"
 me_egypt_2_pharaoh.11.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]开始对埃及的税制进行大规模改革。"
 me_egypt_2_pharaoh.11.desc:0 "埃及的自然财富（主要是农业）一直是经济基础和每位法老权力的来源。古时的法老会记录臣民的信息以征发劳役，但并未实行货币税制，而是通过土地丈量来征收实物税，主要是农产。\n\n然而，一个现代国家需要更精细的行政工具。亚历山大首次将货币化引入埃及，我们必须确保它深入各地。\n\n我们首先需要更新人口普查，并据此建立货币税制与土地调查。所有数据将由地方收集，并统一保存于[GetProvince('(int32)516').GetName]的中央机构中。"
 me_egypt_2_pharaoh.11.t:0 "官僚之都：人口与田赋改革"
 me_egypt_2_pharaoh.12.a:0 "赋税是必要之恶。"
 me_egypt_2_pharaoh.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_6$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.12.desc:0 "过去一年中，我们从民众那里收集了关于人口与土地的数据。现在，是时候根据这些数据实行新的税收体系了。\n\n首先，我们可以开征新的人头税（如食盐税），向所有人征收而不仅是劳工。其次，可以引入更高效的征税机制，结合王室与私人的征收官。最后，收入法规也可依据土地调查结果加以调整。\n\n我们的中央官僚机构比以往更为庞大与繁忙，但体系也前所未有地高效。"
 me_egypt_2_pharaoh.12.t:0 "官僚之都：改革完成"
 me_egypt_2_pharaoh.13.a:0 "干得不错。"
 me_egypt_2_pharaoh.13.a.tt:0 "#Y $central_delta_area$#!还将获得“#Y $egypt_delta_trade_center$#!”。"
 me_egypt_2_pharaoh.13.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_7$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.13.desc:0 "尼罗河三角洲是地中海与埃及之间的天然交汇点，埃及传统上是一个依赖尼罗河的内陆国家。\n\n从军事、政治和经济角度看，向地中海开放是明智之举。尽管我们的重点仍是[GetProvince('(int32)516').GetName]，三角洲地区广大，其诸多分支河道两岸都涌现出富庶的城市与贸易站。\n\n我们在整个地区的投资是极为明智的。国际贸易空前繁荣，商船每日往返于我们的港口，来自遥远国度的奇珍异货充斥着我们的市场。来自已知世界各地的商人纷纷前来在三角洲交易，这里将很快被誉为全球贸易的中心！"
 me_egypt_2_pharaoh.13.t:0 "世界贸易中心：商业繁荣"
 me_egypt_2_pharaoh.14.a:0 "麦罗埃的剑是最好的。"
 me_egypt_2_pharaoh.14.a.tt:0 "[GetProvince('(int32)576').GetArea.GetName|Y]与[GetProvince('(int32)569').GetArea.GetName|Y]中所有我们拥有的领地将获得#Y $egypt_border_trade_nubia$#!。"
 me_egypt_2_pharaoh.14.a.tt.2:0 "若尚未拥有，[GetCountry('EGY').GetName]获得对[GetProvince('(int32)576').GetArea.GetName|Y]、[GetProvince('(int32)600').GetArea.GetName|Y]和[GetProvince('(int32)613').GetArea.GetName|Y]的宣称。"
 me_egypt_2_pharaoh.14.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_8$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.14.desc:0 "[GetProvince('(int32)576').GetArea.GetName]传统上被视为[GetProvince('(int32)573').GetArea.GetRegion.GetName]与[GetProvince('(int32)591').GetArea.GetRegion.GetName]的分界。从第一瀑布起，埃及即为始，尼罗河自此至三角洲皆可通航。[GetProvince('(int32)576').GetArea.GetName]与[GetProvince('(int32)569').GetArea.GetName]人口稀少，纪念性建筑不多，以采石场与陵墓著称，而非城市，但该地区是尼罗河贸易的重要枢纽。\n\n来自南方的商人携带铁器、珠宝、陶器、棉布、香料与异域动物，必经此地并缴纳关税。为此地建设适当的基础设施，是我们提升贸易流量与收益的必要之举。"
 me_egypt_2_pharaoh.14.t:0 "尼罗河贸易：上埃及之主"
 me_egypt_2_pharaoh.15.a:0 "向众神献祭！"
 me_egypt_2_pharaoh.15.a.tt:0 "我们的巴西琉斯[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]宣布举行盛大的宗教节日！"
 me_egypt_2_pharaoh.15.desc:0 "希腊的神祇引领我们来到此地，而埃及的神祇也对我们微笑相迎。\n\n亚历山大征服埃及时，曾前往[GetProvince('(int32)5514').GetName]，参拜[ammon_scope.GetName]的神谕。该神赐雨于沙漠，解其军之渴，又派两条会说话的蛇引军穿越沙海，引导其前行。[GetCharacter('(int32)42').GetName]亲历其事，回忆神谕的答复——亚历山大的生父正是[ammon_scope.GetName]，即我们所称之[zeus_scope.GetName]。\n\n如今，亚历山大已登奥林匹斯神座，[GetProvince('(int32)516').GetName]也建起了他的陵墓。\n\n由此看来，我们的权力乃诸神所赐，理应向众神表达感恩。就让我们举行盛大的宗教庆典，祭祀众神的庇佑吧！"
 me_egypt_2_pharaoh.15.t:0 "众神之城：亚历山大的神明"
 me_egypt_2_pharaoh.16.a:0 "我们拥抱这一新信仰，愿女神保佑众人！"
 me_egypt_2_pharaoh.16.a.tt:0 "[euploia_scope.GetName|Y]崇拜立于[GetCountry('EGY').GetName]。"
 me_egypt_2_pharaoh.16.a.tt.2:0 "对女神虔诚无比的卡利克拉忒斯·博伊斯基德斯在[GetProvince('(int32)3378').GetName|Y]推动建立一座供奉[euploia_scope.GetName]的神殿。"
 me_egypt_2_pharaoh.16.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_9$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.16.desc:0 "过去数月的宗教庆典清晰表明，无论希腊人还是其他族群，我们人民的宗教情感都极为深厚。众神以前所未有的祭祀烟火为宴，古庙重修，新殿落成。\n\n为庆祝节日结束，我们理应正式推行一项新信仰。[euploia_scope.GetName]，航海者的守护神，保佑我们的海运顺利，应当受到我们感恩的尊崇。\n\n王室中有声音认为，这位女神早已降世人间——[SCOPE.sCharacter('lagid_goddess_candidate').GetName]正是她的化身。在世时，[SCOPE.sCharacter('lagid_goddess_candidate').GetName]乃[GetProvince('(int32)534').GetName]公羊神的女祭司，按照该教的仪式下葬，并由此获神格化。她将在全国各地的神庙中作为座上宾神受到敬奉！"
 me_egypt_2_pharaoh.16.t:0 "众神之城：古神与新神"
 me_egypt_2_pharaoh.17.desc:0 "过去数月的宗教庆典，清晰凸显出了我国人民——无论希腊人还是非希腊人——心中宗教情感之深厚。在[GetCountry('EGY').GetName]每一处聚落中，牺牲之烟——比以往任何时候都更为众多——供奉诸神，古老的庙宇得以修复，新的神庙拔地而起。在我们的护佑者、神圣的亚历山大及其父[ammon_scope.GetName]的注视之下，我国人民齐聚一堂，共庆诸神共享的恩宠。本土埃及人与希腊—马其顿移民之间的关系从未如此亲密，建立共同崇拜的必要性也日益凸显——这应是我们的行政机构在不久的将来需要考虑之事。\n\n为庆祝这一系列欢庆的圆满结束，正式推出一项新崇拜似颇为合宜。[euploia_scope.GetName]——全体水手的护佑者——将因其在过往海上事业中赐予我们的恩惠而受到尊崇，并为我们未来的海上征服祈求庇佑！"
 me_egypt_2_pharaoh.18.a:0 "愿法罗斯灯塔的光芒永照地中海！"
 me_egypt_2_pharaoh.18.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_10$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.18.desc:0 "终于完成了。经过多年的不懈努力、巨大的投入和雄心勃勃的设想，#Y 法罗斯灯塔#!终于建成。\n\n它独特的轮廓在天际线中清晰可见，灯火通明，如同第二轮明月照亮黑夜！在已知世界中无物可比拟。[GetProvince('(int32)516').GetName]的这座灯塔将永远屹立，作为我们民族智慧与伟大的见证！"
 me_egypt_2_pharaoh.18.t:0 "奇迹之城：法罗斯灯塔"
 me_egypt_2_pharaoh.19.a:0 "我等文化之光将永照地中海！"
 me_egypt_2_pharaoh.19.desc:0 "终于完成了。经过多年的不懈努力、巨大的投入和雄心勃勃的设想，#Y 缪斯神殿（Mouseion）#!终于建成。\n\n这座献给缪斯的壮丽殿堂被众多致力于美与知识的建筑群所环绕。来自希腊世界各地的最优秀的艺术家、诗人和学者争相在此谋得一席之地。终有一日，这些神圣殿堂将囊括世间所有的知识！"
 me_egypt_2_pharaoh.19.t:0 "奇迹之城：大图书馆与缪斯神殿"
 me_egypt_2_pharaoh.2.a:0 "[GetCountry('EGY').GetName]繁荣昌盛！"
 me_egypt_2_pharaoh.2.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_2$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.2.desc:0 "我们在[GetProvince('(int32)543').GetArea.GetName]的投资已经开始见效。我们通过大规模的灌溉、开渠工程彻底改变了这片地区的面貌，甚至还修建了水坝，从莫伊里斯湖中围垦出肥沃土地。\n\n如今，大片农田和庄园遍布全区，显著提升了我们的粮食产量。这片新开辟的土地必将吸引希腊和马其顿定居者，并可能成为安置老兵的关键资产。"
 me_egypt_2_pharaoh.2.t:0 "尼罗的馈赠：赫普塔诺米斯水利工程"
 me_egypt_2_pharaoh.21.a:0 "这是一场值得纪念[GetCharacter('(int32)42').GetName]功绩的盛典。"
 me_egypt_2_pharaoh.21.a.tt:0 "希腊诸民充满钦佩与尊重，他们对我们的看法提升了。"
 me_egypt_2_pharaoh.21.b:0 "我们应将其定为周期性庆典！"
 me_egypt_2_pharaoh.21.b.tt:0 "托勒密节将每四年举办一次。"
 me_egypt_2_pharaoh.21.desc:0 "为筹备本次盛典，我们不惜一切代价。\n\n[GetCharacter('(int32)42').GetName]与其家族塑造了我们的国家，并将继续引领其未来，而这场盛典已将拉吉德王朝的慷慨与权势展示于世人面前。\n\n来自异域的奇珍异兽——包括我们著名的战象——连同披挂新甲的士兵，每日行进于[GetProvince('(int32)516').GetName]街头，举国上下祭祀神明，豪华的宴席昼夜不停。我们邀请了所有希腊诸国前来参加音乐、诗歌与竞技比赛，所设奖赏之丰堪比奥林匹克盛会。各地亦自发举办小型节庆以仿效之。\n\n托勒密节大获成功！"
 me_egypt_2_pharaoh.21.t:0 "托勒密节"
 me_egypt_2_pharaoh.21.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_11$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.22.a:0 "我们的节日定将超越奥林匹克，记住我的话！"
 me_egypt_2_pharaoh.22.a.tt:0 "四年后，我们将再次举办托勒密节！"
 me_egypt_2_pharaoh.22.desc:0 "首届托勒密节取得巨大成功。来自整个希腊世界的宾客被我们所展示的权力与财富深深震撼，而我们的人民则满怀自豪。\n\n虽然筹办一场如此盛大的庆典耗时耗力、代价不菲，但它为我们带来了丰厚的回报。若能将其定为例行盛典，托勒密节或许有朝一日将超越奥林匹克，成为希腊文明的中心盛会！"
 me_egypt_2_pharaoh.22.t:0 "托勒密节成为例行盛典"
 me_egypt_2_pharaoh.23.a:0 "分秒必争！"
 me_egypt_2_pharaoh.23.a.tt:0 "我们开始为下一次托勒密节做准备。"
 me_egypt_2_pharaoh.23.b:0 "这次就不办了。"
 me_egypt_2_pharaoh.23.b.tt:0 "下一次托勒密节将在四年后举行。"
 me_egypt_2_pharaoh.23.d:0 "我们有更好的方式来庆祝我们的成就。"
 me_egypt_2_pharaoh.23.d.tt:0 "托勒密节将被永久取消。"
 me_egypt_2_pharaoh.23.desc:0 "距离上一次托勒密节已有将近四年，盛典带来的辉煌与其对我等巴西琉斯的声望的提升正逐渐淡去。\n\n若想再次举办盛典以持续歌颂拉吉德王朝的伟业，是时候开始筹备工作了。\n\n一场令天下羡慕与钦佩的盛典并非一日之功！"
 me_egypt_2_pharaoh.23.t:0 "托勒密节筹备工作"
 me_egypt_2_pharaoh.24.a:0 "众皆满意！"
 me_egypt_2_pharaoh.24.desc:0 "一切已就绪！\n\n[ROOT.GetCountry.GetRuler.GetName]正式开启托勒密节的庆典。来自希腊各地的宾客齐聚[GetProvince('(int32)516').GetName]，参与竞技比赛、共享盛宴、祭祀诸神，并在游行中惊叹于托勒密王朝所展现的权力与财富。我们的人民喜不自胜，而我们的巴西琉斯也成为世间最令人羡慕与钦佩之人！"
 me_egypt_2_pharaoh.24.t:0 "[SCOPE.Custom('get_ptolemaia_count_suffix')]托勒密节"
 me_egypt_2_pharaoh.25.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen]寻求答案。"
 me_egypt_2_pharaoh.25.a.tt:0 "埃及与希腊最睿智的祭司将回应其召唤。"
 me_egypt_2_pharaoh.25.desc:0 "我们的巴西琉斯[ROOT.GetCountry.GetRuler.GetName]做了一个梦。一位神明显现于[ROOT.GetCountry.GetRuler.GetHerHim]的梦中，形象为头戴粮斗冠、手持权杖的威严男子，三头犬刻耳柏洛斯安静地卧于其足下。这位神祇命令[ROOT.GetCountry.GetRuler.GetPraenomen]从[GetProvince('(int32)1812').GetName]带走其神像，并将其信仰引入[GetProvince('(int32)516').GetName]。\n\n[ROOT.GetCountry.GetRuler.GetPraenomen]深感不安，已召集睿智的祭司解梦。"
 me_egypt_2_pharaoh.25.t:0 "宗教融合：[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]之梦"
 me_egypt_2_pharaoh.26.a:0 "愿[GetDeityDefinition('omen_serapis').GetName]为埃及带来和平与和谐。"
 me_egypt_2_pharaoh.26.a.tt:0 "[GetDeityDefinition('omen_serapis').GetName]的神圣遗址已建于[GetProvince('(int32)529').GetName|Y]。"
 me_egypt_2_pharaoh.26.desc:0 "一切已准备就绪。伴随着庄严的游行与丰厚的供品，[GetDeityDefinition('omen_serapis').GetName]正式被迎入我们的神祇体系。\n\n愿这一共享信仰为我国人民带来新一轮的团结，化解希腊神明与埃及传统之间的分歧。[GetDeityDefinition('omen_serapis').GetName]将成为所有人的神明，无论是希腊人还是埃及人，象征我等民族的双重本质：两种文化、两种信仰，却是一国同心。"
 me_egypt_2_pharaoh.26.t:0 "融合：[GetDeityDefinition('omen_serapis').GetName]的祭祀确立"
 me_egypt_2_pharaoh.26.tt:0 "[GetDeityDefinition('omen_serapis').GetName]的信仰已在埃及正式确立。"
 me_egypt_2_pharaoh.26.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_12$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.27.a:0 "派人前往[GetProvince('(int32)1812').GetName]迎回神像。"
 me_egypt_2_pharaoh.27.a.tt:0 "我们的使节将前往普路同神庙，不择手段地获得那座雕像。"
 me_egypt_2_pharaoh.27.desc:0 "[serapis_cult_instigator_egyptian.GetName]被广泛认为是埃及祭司中最明智者；[serapis_cult_instigator_greek.GetName]则是雅典欧摩尔庇代家族的重要成员，这一家族自古守护着厄琉西斯秘仪的奥秘。他们二人都应[ROOT.GetCountry.GetRuler.GetName]之请前来解读他的梦。\n\n两位智者很快达成一致：那位神祇不是别人，正是[GetDeityDefinition('omen_serapis').GetName]，而且祂已经向[ROOT.GetCountry.GetRuler.GetPraenomen]显露恩宠。如果我们想最终在国内实现宗教平衡，我们的巴西琉斯就必须谨慎而迅速地遵循神的指示。"
 me_egypt_2_pharaoh.27.t:0 "融合：祭司的回应"
 me_egypt_2_pharaoh.28.a:0 "我们将为他建造一座新的圣殿！"
 me_egypt_2_pharaoh.28.a.tt:0 "我们将投资建设一处供奉[GetDeityDefinition('omen_serapis').GetName]的圣地。"
 me_egypt_2_pharaoh.28.b:0 "这事只能暂且搁置。"
 me_egypt_2_pharaoh.28.b.tt:0 "[GetDeityDefinition('omen_serapis').GetName]将无法拥有圣地。"
 me_egypt_2_pharaoh.28.desc:0 "成功了！\n\n我们的使节已带着珍贵的雕像返回[GetProvince('(int32)516').GetName]。在一场盛大的游行和庆典中，[GetDeityDefinition('omen_serapis').GetName]被迎入我国。\n\n据[SCOPE.sCharacter('serapis_cult_instigator_egyptian').GetName]所言，[GetDeityDefinition('omen_serapis').GetName]——或希腊埃及人所称的奥索拉庇斯——是[osiris_scope.GetName]的化身，曾与[isis_scope.GetName]一同在现代[GetProvince('(int32)1812').GetName]所在地的一座圣殿中接受祭祀。[serapis_scope.GetName]并非外来的神祇，而是他的信仰终于回到了故乡！不过，他的古老圣殿早已不复存在，我们应当为其建立一个新的圣所。"
 me_egypt_2_pharaoh.28.t:0 "融合信仰：[GetDeityDefinition('omen_serapis').GetName]的降临"
 me_egypt_2_pharaoh.29.a:0 "荣耀归于巴西琉斯！"
 me_egypt_2_pharaoh.29.a.tt:0 "此事件开创了一个先例，或将在未来的统治者身上引发连锁反应。"
 me_egypt_2_pharaoh.29.desc:0 "在希腊世界，伟大的古代国王与建城者常在死后获得英雄式的神圣荣耀。埃及的法老死后也可登上神位。近年来，希腊语地中海地区各地已开始出现对在世伟大领袖（包括[ROOT.GetCountry.GetRuler.GetName]本人）的地方性崇拜。\n\n我们的巴西琉斯曾正式反对此等行为，认为这是一种亵渎。然而时代在变，人民对他的感激之情愈发高涨，赐予他越来越多的荣誉——终有一日，他将如亚历山大一般，被奉为神明！"
 me_egypt_2_pharaoh.29.t:0 "神化：神圣的荣耀"
 me_egypt_2_pharaoh.29.tt:0 "[GetCharacter('(int32)42').GetName|Y]将在死后被视为神明；如今，他几乎已是尘世之神。"
 me_egypt_2_pharaoh.29.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_final$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.3.a:0 "我们要大赚一笔！"
 me_egypt_2_pharaoh.3.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_3$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.3.desc:0 "[GetProvince('(int32)516').GetName]注定成为三角洲经济的跳动心脏。不过，还有其他港口与城市同样潜力巨大，我们明智地选定其中两座进行投资。\n\n[GetProvince('(int32)515').GetName]是古希腊人的早期殖民地，向来是埃及与希腊之间贸易的主要枢纽。几个世纪以来，这座城市不断扩张、日益富庶。传统的埃及统治者姑且容忍其作为一个特例，而我们这更具国际视野、面向地中海世界的王国将为其提供一个面向世界的舞台。\n\n[GetProvince('(int32)529').GetName]虽然规模较小，但也有相似的历史。据传，第一批定居此地的希腊商人以墨涅拉俄斯的领航员之名为其命名，该人据说正是在这里遇难。从那时起，来自尼罗河的货物便源源不断地经[GetProvince('(int32)529').GetName]运往希腊。我们对当地社区的支持，必将推动他们贸易的进一步扩展。"
 me_egypt_2_pharaoh.3.t:0 "地中海之门：繁忙的市场"
 me_egypt_2_pharaoh.30.a:0 "荣耀归于神圣的[GetCharacter('(int32)42').GetName]！"
 me_egypt_2_pharaoh.30.desc:0 "在希腊世界，伟大的古代国王与建城者常在死后获得英雄式的神圣荣耀。埃及的法老死后也可登上神位。近年来，希腊语地中海地区各地已开始出现对在世伟大领袖的地方性崇拜。\n\n我们王朝的奠基者[dead_ptolemy_scope.GetName]在世时始终拒绝接受神格化，认为那是一种亵渎；但如今他早已长眠，而他的伟大遗产已为天下人所共识，现在正是将他正式奉为神明的时机！"
 me_egypt_2_pharaoh.30.t:0 "神化"
 me_egypt_2_pharaoh.30.tt:0 "[GetCharacter('(int32)42').GetName|Y]现已被纳入我方万神殿之中。"
 me_egypt_2_pharaoh.31.a:0 "我们的人民实乃天降神佑。"
 me_egypt_2_pharaoh.31.desc:0 "在希腊世界，伟大的古代国王与建城者常在死后获得英雄式的神圣荣耀。埃及的法老死后也可登上神位。\n\n我们王朝的奠基者[SCOPE.sCharacter('dead_ptolemy_scope').GetName]已登神位，与亚历山大同列神祇。他如今庇护着他的继承人和子孙，静待他们有朝一日与他共登奥林匹斯山。"
 me_egypt_2_pharaoh.31.t:0 "神化：拯救者的祝福"
 me_egypt_2_pharaoh.31.tt:0 "继位者[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的神圣先祖[SCOPE.sCharacter('dead_ptolemy_scope').GetName]赐予其庇护与神力。"
 me_egypt_2_pharaoh.32.desc:0 "在希腊世界，伟大的古代国王与建城者常在死后获得英雄式的神圣荣耀。埃及的法老死后也可登上神位。近年来，希腊语地中海地区各地已开始出现对在世伟大领袖的地方性崇拜。我们的巴西琉斯[ROOT.GetCountry.GetRuler.GetName]因其不凡的功绩而受到人民高度推崇，唯有神明方能施恩于凡人至此之境！"
 me_egypt_2_pharaoh.32.t:0 "神化：尘世之神"
 me_egypt_2_pharaoh.32.tt:0 "完成诸多非凡功绩后，我方巴西琉斯现已被视为尘世之神。"
 me_egypt_2_pharaoh.33.a:0 "的确！有朝一日，[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]将与宙斯同坐奥林匹斯山！"
 me_egypt_2_pharaoh.33.b:0 "我们不应鼓励此类亵渎之举。"
 me_egypt_2_pharaoh.33.desc:0 "我方巴西琉斯[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的伟业与美德世人皆知，人民为全国的繁荣昌盛而称颂他的名字。\n\n显然，自[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]登基那一刻起，众神便赐福于我等。起初，只有零星的声音称他为神圣的恩主，但这些声音日益增多，愈发坚定。我们必须对此正式表态。\n\n宣称我们由一位尘世之神统治是一种大胆的行为，甚至可谓亵渎；但我们可以正式承认[SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]拥有神圣火种，死后将与其荣耀的祖先一同护佑国家。"
 me_egypt_2_pharaoh.33.t:0 "尘世之神"
 me_egypt_2_pharaoh.34.a:0 "我们正式将[hermanubis_scope.GetName]与[harpocrates_scope.GetName]纳入万神殿。"
 me_egypt_2_pharaoh.34.desc:0 "自从我们引入了[serapis_scope.GetName]与[amun_scope.GetName]的信仰以来，人民对融合信仰产生了浓厚兴趣。\n\n融合是希腊宗教的悠久传统。我们出于虔诚之心，对所有神明都表示尊敬，无论其起源如何，唯恐因疏忽冒犯某位神明而遭其报复。然而，多数人崇拜的神祇与我们相同——此乃其威能所致——只是使用了不同的名字或称谓。认知诸神本源一致，方能实现和谐共处。\n\n在我方国内涌现的新兴融合信仰中，最受瞩目的是[hermanubis_scope.GetName]——引导亡者灵魂前往冥界的神祇——以及[harpocrates_scope.GetName]——[isis_scope.GetName]与[GetDeityDefinition('omen_serapis').GetName]之神子。"
 me_egypt_2_pharaoh.34.t:0 "新兴的融合信仰"
 me_egypt_2_pharaoh.35.a:0 "干得漂亮！"
 me_egypt_2_pharaoh.35.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.35.desc:0 "今日，全埃及的人民共同欢庆！\n\n终于，一位真正继承埃及法老与亚历山大遗志的王者登上了王座。我们巧妙的政治选择确保了各族人民和平共处、繁荣幸福。\n\n埃及从未如此富庶、团结且令人景仰。有朝一日，我们将实现亚历山大的梦想，将我等文化传播至世界各地！"
 me_egypt_2_pharaoh.35.t:0 "马其顿的法老"
 me_egypt_2_pharaoh.36.a:0 "让我们请求雅典人！"
 me_egypt_2_pharaoh.36.a.tt:0 "我们的使节将前往[GetCountry('ATH').GetName]，请求借阅官方定本卷轴。"
 me_egypt_2_pharaoh.36.desc:0 "自从我们完成宏伟的图书馆以来，学者们便夜以继日地从希腊各地搜集充满艺术与知识的珍贵卷轴。\n\n最近，他们意识到还有一项瑰宝尚未入藏。[GetProvince('(int32)416').GetName]作为戏剧的摇篮，哀斯库罗斯、索福克勒斯、欧里庇得斯与阿里斯托芬之名仍被希腊世界广泛尊崇。由于戏剧为现场演出，其作品在多年演出与流传中多有修改，艺术水准不如往昔。然而，[GetCountry('ATH').GetName]保存着这些杰作的官方定本，数百年来未曾更改。我们必须获得它们，以供学者研究与保存。"
 me_egypt_2_pharaoh.36.t:0 "雅典剧作"
 me_egypt_2_pharaoh.37.a:0 "我们将送去这些文本！"
 me_egypt_2_pharaoh.37.b:0 "不，这太危险了。"
 me_egypt_2_pharaoh.37.b.tt:0 "他们会非常不满我们。"
 me_egypt_2_pharaoh.37.desc:0 "[GetCountry('EGY').GetName]的使节来到我们的议事会，提出了一项请求。\n\n[GetProvince('(int32)516').GetName]的大图书馆已是世界上最大的文献收藏之所，最杰出的希腊学者们日以继夜地钻研我们文化中诸多杰作的特色，力图将其恢复至原始的完美状态——历经数个世纪来不乏粗糙的传抄，这一完美早已失落。因此，倘若我们愿意将载有我们举世闻名戏剧之作的官方抄本送往彼处，他们将永远欠我们一份人情。他们将制作忠实副本，一旦完成，便将我们珍贵的卷轴即刻归还。\n\n我们对祖先的成就感到无比自豪，让每个人都有机会接触原始脚本并欣赏其伟大，当是纪念他们的一种方式；然而，在运输途中，卷轴极易遗失或损毁……"
 me_egypt_2_pharaoh.37.t:0 "来自亚历山大里的请求"
 me_egypt_2_pharaoh.38.a:0 "将副本送回！"
 me_egypt_2_pharaoh.38.a.tt:0 "雅典人将感到愤怒。"
 me_egypt_2_pharaoh.38.desc:0 "好消息！雅典议会接受了我们的提案！\n\n由我们的使节小心运输的雅典戏剧官方定本，终于进入了伟大的图书馆。我们的学者们对当代戏剧剧本与这些古代手稿之间的差异感到惊讶，无论大小差异都在其中。它们的文化价值简直是无法估量的。我们不能仅仅把它们送回去，再让它们在某个神庙里落灰！我们应该制作完美的副本再寄回去；如果幸运的话，雅典人永远不会发现，但即使他们发现了，也为时已晚！"
 me_egypt_2_pharaoh.38.t:0 "雅典卷轴"
 me_egypt_2_pharaoh.38.tt:0 "我们从[GetCountry('ATH').GetName]收到了宝贵的[tragedies_scope.GetName|Y]！"
 me_egypt_2_pharaoh.39.a:0 "雅典人会后悔的。"
 me_egypt_2_pharaoh.39.desc:0 "我们的使节带回了坏消息：雅典人并不信任我们，他们拒绝将他们的戏剧杰作官方定本交给我们。\n\n我们图书馆的学者们感到失望，但我们无能为力。这一尝试是值得的；现在，我们唯一能做的就是等到适当时机，通过入侵强行夺取这些卷轴。希望它们到时不会受损。"
 me_egypt_2_pharaoh.39.t:0 "雅典戏剧被拒"
 me_egypt_2_pharaoh.4.a:0 "又一个问题解决了。"
 me_egypt_2_pharaoh.4.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_4$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.4.desc:0 "我们在莫伊里斯湖新开垦土地及尼罗河两岸的殖民活动进展顺利。\n\n希腊与马其顿的退伍军人正稳定迁入此地定居，这不仅带来经济上的好处，也将促进[hellenic_culture_group_scope.GetName]文化在该地区的传播！"
 me_egypt_2_pharaoh.4.t:0 "分封士兵"
 me_egypt_2_pharaoh.40.a:0 "不过，我们不会忘记这件事。"
 me_egypt_2_pharaoh.40.desc:0 "我们被骗了！\n\n[GetCountry('EGY').GetName]狡猾的巴西琉斯欺骗了我们。我们曾承诺送往[GetProvince('(int32)516').GetName]图书馆的戏剧杰作官方副本将尽快归还；然而经仔细查验，我们发现被归还的不过是一文不值的赝品，一场骗局！\n\n当这一发现被公布时，议事会爆发出愤怒的喧嚣。但我们对此束手无策，除非向这个骗子宣战，并冒着在此过程中被彻底摧毁的风险。"
 me_egypt_2_pharaoh.40.t:0 "上当了！"
 me_egypt_2_pharaoh.5.a:0 "我们来建一座新图书馆吧！"
 me_egypt_2_pharaoh.5.b:0 "我们的子民已经是世界上最有文化的。"
 me_egypt_2_pharaoh.5.desc:0 "更多图书馆将吸引王国乃至海外最优秀的学者。此外，我们的贵族也将因更便捷地获取世界知识而欣喜不已，从而提升他们的行政能力。\n\n在我们的首都打造世界领先的文化中心，其优势无可否认。朝廷内已充满激动的气氛，有学者甚至梦想，有朝一日，[GetProvince('(int32)516').GetName]将建起人类历史上最伟大的图书馆，汇聚世间全部知识！"
 me_egypt_2_pharaoh.5.t:0 "贤者之城：亚历山大的图书馆"
 me_egypt_2_pharaoh.6.a:0 "我们来建一所新学院！"
 me_egypt_2_pharaoh.6.b:0 "我们的研究已无人能敌。"
 me_egypt_2_pharaoh.6.desc:0 "世界上最优秀的知识分子将齐聚[GetProvince('(int32)516').GetName]的学院！他们将在此交流见解，与著名哲学家辩论，学习最先进的行政与军事理论，创作学术诗篇，发明将我等永载史册的辉煌技艺！"
 me_egypt_2_pharaoh.6.t:0 "贤者之城：亚历山大的学院"
 me_egypt_2_pharaoh.7.a:0 "我们应加大对研究的投入！"
 me_egypt_2_pharaoh.7.b:0 "我们的黄金还有更紧要的用途。"
 me_egypt_2_pharaoh.7.desc:0 "若我们不能为图书馆和学院提供充足资助，其成果也将大打折扣。尽管大多数知识分子出身贵族，有能力自给自足，王室资助依然是推动研究的有力激励！\n\n获得王室赞助是莫大荣誉，必将激励研究人员全力以赴。"
 me_egypt_2_pharaoh.7.t:0 "贤者之城：研究资助"
 me_egypt_2_pharaoh.8.a:0 "让我们开始吧！"
 me_egypt_2_pharaoh.8.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]开始一项建筑工程，以提升[GetProvince('(int32)516').GetName|Y]的文化产出。"
 me_egypt_2_pharaoh.8.desc:0 "我们的首位巴西琉斯[GetCharacter('(int32)42').GetName]，曾是亚历山大的史官，他所著的亚历山大征战史很快为他赢得了客观诚实的作家与学者之美誉。他对文学的欣赏为其统治及其继任者们的统治定下了基调：[GetCountry('EGY').GetName]将成为继业者世界中希腊文化的领航力量，而[GetProvince('(int32)516').GetName]将是其王冠上的明珠。\n这一雄心勃勃的计划将耗费时日且代价不菲，但其裨益将是永恒的。我们的历代巴西琉斯将被后世铭记为有史以来最伟大的艺术与文化赞助者！"
 me_egypt_2_pharaoh.8.t:0 "智者之城"
 me_egypt_2_pharaoh.9.a:0 "亚历山大的文化令人惊叹。"
 me_egypt_2_pharaoh.9.a.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_2_pharaoh_task_5$#!' $mission_completed_tooltip_2$"
 me_egypt_2_pharaoh.9.desc:0 "我们实现了一个重要目标。\n\n多亏了[ROOT.GetCountry.GetRuler.GetName]的投资，[GetProvince('(int32)516').GetName]如今美轮美奂。来自全国各地的杰出学者纷纷前来[GetProvince('(int32)516').GetName]的学院修习智慧，我们的研究者在[GetProvince('(int32)516').GetName]的图书馆中搜集诗篇与技术典籍，哲学家在[GetProvince('(int32)516').GetName]的花园中散步沉思，数学家为其宫殿设计巧妙的水利工程，文化在四处蓬勃发展！"
 me_egypt_2_pharaoh.9.t:0 "贤士之城：我们的文化之都"
 me_egypt_3_empire.1.a:0 "努比亚人可能会成为问题..."
 me_egypt_3_empire.1.a.tt:0 "将军菲隆·卡斯托里德斯出现在宫廷中。"
 me_egypt_3_empire.1.desc:0 "我们已控制红海南岸的港口，地方港口繁荣昌盛，来自远方的商人将香料、染料、乌木和象牙等商品运输至我们的港口。然而，东部和非洲的贸易仍然通过我们南部的港口以及尼罗河流域之外的航道进行。\n\n可能需要更果断的干预。"
 me_egypt_3_empire.1.t:0 "红海探险：准备启航"
 me_egypt_3_empire.1.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_1$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.10.t:0 "昔兰尼人民：骄傲的[SCOPE.sChar('flav_egy_2_cyr_ruler').GetCountry.GetName]"
 me_egypt_3_empire.11.a:0 "我们拭目以待。"
 me_egypt_3_empire.11.desc:0 "昔兰尼人依旧顽强抵抗埃及的统治，并对[SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen]的部队举兵反抗。他们骄傲的统治者[SCOPE.sChar('flav_egy_5_old_ruler').GetName]在其位于[flav_egy_5_old_ruler.GetCountry.GetCapital.Custom('get_city_type_loc')]的首都[flav_egy_5_old_ruler.GetCountry.GetCapital.GetName]中集结大军，号召各路昔兰尼人加入其行列，共同驱逐[ROOT.GetCountry.GetAdjective]侵略者。\n\n[SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen]已成功控制了部分地区，召集忠于亚历山大及其继任者的支持者返回我们的怀抱。尽管我们已经向[SCOPE.sChar('flavor_egy_2_magas_scope').GetPraenomen]提供了部队，但也有人建议加大援助力度；再派几支援军前往[SCOPE.sChar('flavor_egy_2_magas_scope').GetEmployer.GetCapital.GetName]，便可确保其胜利。毕竟，若[flavor_egy_2_magas_scope.GetPraenomen]失败，对我们毫无益处。"
 me_egypt_3_empire.11.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_7$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.11.t:0 "昔兰尼人民：内战"
 me_egypt_3_empire.12.a:0 "战争是唯一的选项。"
 me_egypt_3_empire.12.desc:0 "昔兰尼人固执己见，无法理喻，但他们的傲慢终将是他们的灭亡。他们曾谋杀我们首位总督俄斐拉斯，从未对其表示悔意，如今又拒绝了我们慷慨的提议。\n\n他们不值得信任，我们再也无法容忍。[GetProvince('(int32)3354').GetArea.GetRegion.GetName]本该属于我们，我们将为之而战。"
 me_egypt_3_empire.12.t:0 "昔兰尼人民：战争之风"
 me_egypt_3_empire.13.a:0 "拿出最好的比布林葡萄酒来！"
 me_egypt_3_empire.13.desc:0 "今日乃喜庆之日：昔兰尼加人已接受我方慷慨的条件，未流一滴血，如今承认[GetCountry('EGY').GetName]为其宗主。\n\n掌控该地区比预期更为容易，但真正的挑战在于维持对其的控制，因昔兰尼加人过去已证明难以驾驭、容易反叛。尽管如此，今天是值得庆祝的日子！"
 me_egypt_3_empire.13.t:0 "昔兰尼人民：臣服"
 me_egypt_3_empire.14.a:0 "一步一个脚印。"
 me_egypt_3_empire.14.a.tt:0 "[GetProvince('(int32)3360').GetArea.GetName|Y]和[GetProvince('(int32)3344').GetArea.GetName|Y]也获得“#Y $egypt_silphium_trade$#!”。"
 me_egypt_3_empire.14.a.tt.2:0 "地方神祇[GetDeityDefinition('omen_zeus_amun').GetName|Y]现已可加入我们的万神殿！"
 me_egypt_3_empire.14.desc_1:0 "[SCOPE.sChar('flavor_egy_2_magas_scope').GetCountry.GetName]的野心与贪婪毁了他自己。不满足于身为我们信任的总督，他竟敢公然反抗，结果遭天谴。他的狂妄被击溃，[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的所有土地如今都归我们的巴西琉斯与法老[ROOT.GetCountry.GetRuler.GetName]直辖。\n\n直辖确保我们免受不稳定邻国的影响，但并不代表没有风险。我们接下来采取的措施将决定我们在此地能否真正立足。"
 me_egypt_3_empire.14.desc_2:0 "[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的所有土地如今都归我们的巴西琉斯与法老[ROOT.GetCountry.GetRuler.GetName]直辖，此地终于不再是历代法老的心病。\n\n虽然直辖可使我们远离动荡不安的邻国，但潜在危险仍在，接下来的治理将决定我们在此地的命运。"
 me_egypt_3_empire.14.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_8$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.14.t:0 "昔兰尼问题：彻底解决"
 me_egypt_3_empire.15.a:0 "这是不得不做的事。"
 me_egypt_3_empire.15.a.tt:0 "[GetProvince('(int32)3344').GetArea.GetName|Y]也获得“#Y $egypt_cyrene_pacified_by_force$#!”。"
 me_egypt_3_empire.15.desc:0 "为了平定[GetProvince('(int32)3354').GetArea.GetRegion.GetName]这个问题重重的地区，我们采取了强硬措施。虽然此举短期内可能引发民怨，但从长远来看，这将是一项安全的投资。\n\n在[lagid_cyrenaica_governor.GetName]的铁腕统治与地方财政官协助下，[GetProvince('(int32)3354').GetArea.GetRegion.GetName]将很快成为我们王国中安全、繁荣且忠诚的一部分。"
 me_egypt_3_empire.15.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_9$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.15.t:0 "铁腕统治：昔兰尼已平定"
 me_egypt_3_empire.16.a:0 "这是伟大的成就。"
 me_egypt_3_empire.16.desc:0 "[GetCountry('EGY').GetName]四面受敌，蛮族环伺。但从今日起，[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的希腊兄弟姐妹们不再构成威胁。他们已正式进入我国的统治阶层，而作为另一善意之表示，我朝巴西琉斯[ROOT.GetCountry.GetRuler.GetName]已为[GetProvince('(int32)3354').GetArea.GetRegion.GetName]的希腊城市颁布了一部新宪制。\n\n尽管在亚历山大继业者们的伟大王国时代，各城专属的宪制似乎已无足轻重，但对希腊人而言，这些宪制乃是其自豪之源与族群认同的象征，代表着他们地方自治的传统。"
 me_egypt_3_empire.16.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_10$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.16.t:0 "一体化：宪法颁布"
 me_egypt_3_empire.17.a:0 "我们在西方有可靠的朋友。"
 me_egypt_3_empire.17.a.tt:0 "所有已拥有的港口获得“#Y $egypt_carthaginian_traders_mod$#!”。"
 me_egypt_3_empire.17.desc:0 "[GetCountry('EGY').GetName]近数十年的繁荣，多得益于与西方邻邦[GetCountry('CAR').GetName]的友好合作。然而，我们对在非洲、贸易及地中海扩张的浓厚兴趣，却可能使我们走上与之冲突的道路。\n\n我们分隔势力范围的政策——东方地中海归我，西方地中海归彼——确保了长期和平，并最终促成了同盟。这一结果将通过促进贸易与保障安全而令双方受益。"
 me_egypt_3_empire.17.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_11$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.17.t:0 "西方贸易：可靠的伙伴"
 me_egypt_3_empire.18.a:0 "他们会妥善处理我们的事务。"
 me_egypt_3_empire.18.a.tt:0 "我们创建西部海岛联盟，作为一个附庸国。它们将获得我们在[GetProvince('(int32)1470').GetArea.GetRegion.GetName|Y]、[GetProvince('(int32)3488').GetArea.GetRegion.GetName|Y]、[GetProvince('(int32)1465').GetArea.GetRegion.GetName|Y]和[GetProvince('(int32)1471').GetName|Y]的所有领土。"
 me_egypt_3_empire.18.desc:0 "我们在西地中海的存在显著增加，可以说我们已成为该地区的一大强权。\n\n然而，将资源过度分散的风险已迫在眉睫。我们的新领土远离核心地区，且由野蛮人居住，直接严格控制这些地区可能过于繁重；我们应当授予它们一定的自治权，同时让它们保护我们在西方的利益。"
 me_egypt_3_empire.18.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_12$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.18.t:0 "西海之王：占领基地"
 me_egypt_3_empire.19.a:0 "[GetCountry('EGY').GetName]乃地中海以南最强。"
 me_egypt_3_empire.19.a.tt:0 "此外，[GetCulture('upper_egyptian').GetName|Y]和[GetCulture('middle_egyptian').GetName|Y]文化获得“#Y $egypt_safe_borders$#!”。"
 me_egypt_3_empire.19.a.tt.2:0 "若尚未拥有，[GetCountry('EGY').GetName]获得对[GetProvince('(int32)3333').GetArea.GetName|Y]、[GetProvince('(int32)3256').GetArea.GetName|Y]和[GetProvince('(int32)3245').GetArea.GetName|Y]的宣称。"
 me_egypt_3_empire.19.desc:0 "我们的人民，尤其是埃及人，都在庆祝——努比亚的统治耻辱已被抹去，昔兰尼卡不再是威胁，连西地中海也不再是我们触及不到的地方。\n\n我们的边界已安全，地位已巩固，因此我们应将注意力转向来自其他继业者的威胁，并作为亚历山大的真正继承者，加入他们的行列。"
 me_egypt_3_empire.19.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_final$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.19.t:0 "非洲的统治者"
 me_egypt_3_empire.2.a:0 "让我们继续！"
 me_egypt_3_empire.2.b:0 "这不值得冒险，费用也太高。"
 me_egypt_3_empire.2.desc:0 "我们试图说服当地人，但由于他们与我们有着不同的风俗，语言也难以理解，因此谈判异常艰难。然而，我们的使节最终成功了，南方的部落现在愿意将一片沿海定居点出售给我们，作为贸易站。\n\n控制红海的关键定居点将增加我们的贸易，并帮助我们防范来自海上的威胁（包括海盗）。我们甚至可能能够加强该地区的防御，将其作为进一步向南征服的跳板！"
 me_egypt_3_empire.2.t:0 "贸易站：新的市场"
 me_egypt_3_empire.2.tt:0 "[GetCountry('EGY').GetName]将有可能购买[GetProvince('(int32)4631').GetName|Y]或[GetProvince('(int32)7502').GetName|Y]。"
 me_egypt_3_empire.2.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_2$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.20.a:0 "我们比以往任何时候都强大。"
 me_egypt_3_empire.20.a.tt:0 "我们将创建大希腊作为一个仆从国。它们将获得我们在[GetProvince('(int32)72').GetArea.GetRegion.GetName|Y]的所有领土。"
 me_egypt_3_empire.20.desc:0 "许多希腊城市在我们的指引下不再受到意大利人和迦太基人威胁，得到了安全保障。我们直接介入这一地区必将打破当地的权力平衡，形成我们在西地中海的一个新动荡边界。将这项资源密集型的任务委托给当地附庸国，可能是我们最稳妥的选择。\n\n另一方面，我们在西西里岛的存在意味着我们目前掌控着地中海的“粮仓”：埃及与西西里。我们应当利用在粮食市场上的垄断地位。"
 me_egypt_3_empire.20.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_13$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.20.t:0 "西方希腊人：边界"
 me_egypt_3_empire.21.a:0 "这是值得的成就！"
 me_egypt_3_empire.21.desc:0 "埃及从未享有如此的安全！\n\n最终，埃及的漫长争议边界已经安全，无人再来侵扰，曾经威胁埃及的人民要么被说服加入我们，要么被我们的军队彻底消灭。我们的力量因这些胜利而急剧增长，甚至敢于向西扩展，进入前所未有的埃及领土，连亚历山大都未曾涉足！"
 me_egypt_3_empire.21.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.21.t:0 "大帝国"
 me_egypt_3_empire.3.a:0 "[timosthenes_admiral.GetPraenomen]: 地中海对我们更为重要。"
 me_egypt_3_empire.3.a.tt:0 "[timosthenes_admiral.GetPraenomen]开始环游地中海。"
 me_egypt_3_empire.3.b:0 "[eudoxos_admiral.GetPraenomen]: 印度及其财富更具吸引力。"
 me_egypt_3_empire.3.b.tt:0 "[eudoxos_admiral.GetPraenomen]启航前往印度。"
 me_egypt_3_empire.3.desc:0 "亚历山大的东方之旅唤醒了地中海地区希腊人的想象力与好奇心。每座大城市的热情探险家和作家都期待着能拓展我们对世界的认知！其中有两位探险家来到了[ROOT.GetCountry.GetRuler.GetName]的宫廷，希望能得到王室的赞助。\n\n[timosthenes_admiral.GetName]根据十二种风推导出的新型航海导航体系吸引了我们学者的注意，这一体系证明了亚里士多德的错误，他拥有的专业地理知识让他有能力环绕地中海，并编写一份通往赫拉克勒斯之柱的路线和路上港口的说明。\n\n另一位，[eudoxos_admiral.GetName]，则与印度水手关系密切，其中有一位愿意指引他跨过[GetProvince('(int32)4650').GetName]——希腊商人曾去过的最远的地方——前往印度。\n\n两种探险都将大大有助于我们的商人，我们应该支持哪一种？"
 me_egypt_3_empire.3.t:0 "勇敢的航海者"
 me_egypt_3_empire.4.a:0 "我们将充分利用这笔新获得的知识。"
 me_egypt_3_empire.4.a.tt:0 "同时[GetProvince('(int32)519').GetArea.GetName|Y]和[GetProvince('(int32)511').GetArea.GetName|Y]获得‘#Y $egypt_med_periplus_mod$#!’"
 me_egypt_3_empire.4.desc:0 "一年多以前，[timosthenes_admiral.GetPraenomen]从埃及东行，绕地中海各国航行。\n\n如今他已归来，带回了一大批有关航道、地形、港口、海岸形态、地理形状和距离的知识。\n\n我们对世界的认知依然不完美，但我们对海洋及其海岸的理解将大大促进我们商人和海军指挥官的工作。"
 me_egypt_3_empire.4.t:0 "勇敢的航海者：地中海的故事"
 me_egypt_3_empire.4.tt.end:0 "$mission_completed_tooltip_1$ #Y $egypt_mission_3_empire_task_3$#! $mission_completed_tooltip_2$"
 me_egypt_3_empire.5.a:0 "印度现在离我们更近了。"
 me_egypt_3_empire.5.desc:0 "一年多以前，[eudoxos_admiral.GetPraenomen]和他的印度向导启航前往印度。他们避开阿拉伯海岸和海盗，直接穿越海洋到达印度，[GetProvince('(int32)4650').GetName]是希腊商人通常会停靠的地方。\n\n如今他已归来，带回了印度商品和关于安全航道的大量知识。"
 me_egypt_3_empire.5.t:0 "勇敢的航海者：印度的故事"
 me_egypt_3_empire.5.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_3$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.6.a:0 "这是一个伟大的成功。"
 me_egypt_3_empire.6.desc:0 "埃及的历史敌人已被打败！埃及已失去对[GetProvince('(int32)641').GetArea.GetRegion.GetName]的统治数百年，因此我们的胜利无疑会成为庆祝和纪念的时刻。\n\n[ROOT.GetCountry.GetRuler.GetName]组织了一场盛大的凯旋游行，游行通过[GetProvince('(int32)516').GetName]的街头，成群的埃塞俄比亚贡品展示了我们的胜利战利品：600根象牙、2000根乌木、60个金银混合碗、奴隶和珍宝。"
 me_egypt_3_empire.6.t:0 "象牙之国：胜利"
 me_egypt_3_empire.6.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_4$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.7.a:0 "象可以改变战局。"
 me_egypt_3_empire.7.desc:0 "我们终于控制了非洲的象牙繁殖地。\n\n[GetProvince('(int32)7500').GetName]将作为我们的基地，狩猎队将从这里出发，前往内陆，装载象牙的船只将向北航行，带到集结地进行训练，最终投入我们的军队。\n\n狩猎队危险且昂贵，它们需要时间和数百名合格的猎人，且总是有可能大幅减少野生象的数量，但这是确保我们的军队能够与东方对手竞争的唯一方法。"
 me_egypt_3_empire.7.t:0 "象贸易：狩猎场"
 me_egypt_3_empire.7.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_5$#!' $mission_completed_tooltip_2$"
 me_egypt_3_empire.8.a:0 "去捕几头大象吧！"
 me_egypt_3_empire.8.b:0 "这次先不去了。"
 me_egypt_3_empire.8.b.tt:0 "没有任何事情发生。"
 me_egypt_3_empire.8.desc:0 "在原产地以外的地区繁殖战象被证明是不可能的，因此如果我们希望为军队保持稳定而廉价的象源供应，就必须在象群繁殖地组织狩猎远征。\n\n我们的猎人从[GetProvince('(int32)7500').GetName]出发，前往内陆的野象栖息地。捕获的象随后被装载到专门的“战象船”上，穿越红海、古老的尼罗运河，最终送到[GetProvince('(int32)500').GetName]接受训练。"
 me_egypt_3_empire.8.t:0 "象猎远征"
 me_egypt_3_empire.9.a:0 "我们必将迎难而上。"
 me_egypt_3_empire.9.a.tt:0 "[GetProvince('(int32)84').GetArea.GetRegion.GetName]中所有非希腊国家将视我们为威胁。"
 me_egypt_3_empire.9.a.tt.2:0 "其他继业者将对我们分散注意力而感到满意。"
 me_egypt_3_empire.9.a.tt.3:0 "若尚未拥有，[GetCountry('EGY').GetName]获得对[GetProvince('(int32)84').GetArea.GetName|Y]、[GetProvince('(int32)80').GetArea.GetName|Y]、[GetProvince('(int32)72').GetArea.GetName|Y]和[GetProvince('(int32)56').GetArea.GetName|Y]的宣称。"
 me_egypt_3_empire.9.desc:0 "埃及天生关注东地中海。但出于各种原因，有抱负的巴西琉斯也可能将目光投向西方：新的贸易机会、混乱不堪的敌人、寻求保护的脆弱希腊人，还有远离其他继业者贪婪之手的土地与资源。\n\n不过这也伴随着风险，[GetProvince('(int32)84').GetArea.GetRegion.GetName]的过度冒进曾摧毁了无数王国与帝国。若我们想奠定西方帝国的基石，必须胜过前人。"
 me_egypt_3_empire.9.t:0 "西进事业：西方机遇"
 me_egypt_3_empire.9.tt.end:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_3_empire_task_6$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.1.a:0 "这是最佳的解决方案。"
 me_egypt_4_border.1.a.tt:0 "每个已拥有的港口将获得“#Y $egypt_sidonian_cedars$#!”。"
 me_egypt_4_border.1.a.tt.2:0 "我们在西顿建立一个由[sideon_new_king.GetName]统治的附庸国。"
 me_egypt_4_border.1.desc:0 "[GetProvince('(int32)747').GetName]是地中海主要的港口与贸易中心之一。作为最大且最古老的腓尼基城市之一，以高质量的雪松木船与紫色染料闻名，这座城市在其先前统治者的治理下一直享有相当程度的自由。\n\n虽然让我们朝廷的一员登上王位可能不被当地人接受，但建立一个友好的君主制无疑是我们控制该地区最简便的方法。"
 me_egypt_4_border.1.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_1$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.1.t:0 "西顿之王：新国王"
 me_egypt_4_border.10.a:0 "这将对我们和他都有好处。"
 me_egypt_4_border.10.a.tt:0 "我们在[GetProvince('(int32)1992').GetName]创建一个由[egypt_telmessos_ruler.GetName]统治的仆从国。"
 me_egypt_4_border.10.desc:0 "在我们通过王室联姻与[GetCountry('TRE').GetName]缔结同盟之后，[egypt_telmessos_ruler.GetName]与妻子的家族愈发亲近，而对自己国家的政治日益不满。近来，他甚至表达了携家迁往[GetCountry('EGY').GetName]的意愿。\n\n凭借其与拉吉德家族和阿尔基马科斯家族的双重纽带，他可能成为一个危险的觊觎者；一个简便的解决方案是将其安置于一片新近征服的地区，作为我们的代表与藩属。[GetProvince('(int32)1992').GetName]及其周边聚落，足以作为一位地方国王的权力根基，而[egypt_telmessos_ruler.GetName]将在不加重我方官僚系统负担的情况下，处理该地区的我方事务。"
 me_egypt_4_border.10.desc.2:0 "[egypt_telmessos_ruler.GetName]，来自[GetCountry('TRE').GetName]的阿尔基马基德家族的一个小成员，已经对他家族项目的平庸和对他雄心的轻视愈加不满，甚至提出为我们国家提供服务的意愿。\n\n信任他可能是一个错误，但他似乎与[GetProvince('(int32)1992').GetName]地区有一些家族关系，给他一个小型附庸王国来统治，可能正是我们测试他的勇气与忠诚的最佳方式。"
 me_egypt_4_border.10.desc.3:0 "[egypt_telmessos_ruler.GetName]刚开始的忠诚与日益增长的影响力，使得他成为了[ROOT.GetCountry.GetRuler.GetName]的心头之患。\n\n经过长时间的考虑，[ROOT.GetCountry.GetRuler.GetName]决定，最安全的处理方式，并且同时解决一个紧迫问题的办法，就是让他作为我们的代表，统治[GetProvince('(int32)1992').GetName]。这不仅能够满足他的雄心，同时也将他远离我们的朝廷，并减轻我们官僚制度直接控制该地区的负担。"
 me_egypt_4_border.10.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_7$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.10.t:0 "特尔梅索斯：新王朝"
 me_egypt_4_border.11.a:0 "很好。今天我们将庆祝！"
 me_egypt_4_border.11.b:0 "我们不需要他们的帮助，也不需要他们的友谊。他们是我们的竞争对手！"
 me_egypt_4_border.11.b.tt:0 "他们不会对我们的回答感到高兴。"
 me_egypt_4_border.11.desc:0 "[GetCountry('EGY').GetRuler.GetName]——[GetCountry('EGY').GetName]的巴西琉斯——已征服[GetProvince('(int32)790').GetName]，此处曾是[GetCharacter('(int32)37').GetName]选定的驻跸之地——继业者之间的权力天平再次倾斜。\n\n来自[egypt_scope.GetName]的一位使节刚刚抵达我朝，以联姻盟约的方式奉上[GetCountry('EGY').GetRuler.GetName]的友谊。目前，[GetCountry('EGY').GetName]并不构成对我们的威胁，故称其为友或许是明智之举——至少眼下如此。"
 me_egypt_4_border.11.t:0 "王室婚礼"
 me_egypt_4_border.12.a:0 "尽管如此，诅咒他！"
 me_egypt_4_border.12.a.tt:0 "[egypt_telmessos_ruler.GetName]已迁至[GetProvince('(int32)1992').GetName]，并成为[GetCountry('EGY').GetName]的藩属王。"
 me_egypt_4_border.12.desc:0 "长期以来，[egypt_telmessos_ruler.GetName]对我们之统治及其在我国中之地位一直心怀不满，如今他更是越过了底线！\n\n这个懦夫已与[GetCountry('EGY').GetName]的朋友密谋多时，现在终于摊牌：他更青睐[GetCountry('EGY').GetRuler.GetName]与埃及人的诡计，如今竟为了一块埃及土地而背弃自己的家族！\n\n他已正式背叛我们，但这或许不过是一桩披着诅咒外衣的祝福；这应当能既满足其野心，又将其远远逐出我朝——像他这般人脉深厚之人，留在朝中可真会成为心腹大患。"
 me_egypt_4_border.12.t:0 "叛徒"
 me_egypt_4_border.13.a:0 "今日，我们当举国欢庆！"
 me_egypt_4_border.13.desc:0 "[GetCountry('SEL').GetRuler.GetName] 展现出了高超的政治手腕，已欣然接受我们提出的联姻提议，将 [egypt_wedding_9_bride.GetName] 与 [egypt_wedding_9_husb.GetName] 缔结婚姻。这场婚礼将正式确认我们与 [GetCountry('SEL').GetName] 的同盟关系。\n\n在亚历山大诸继业者之间，联盟每天都在缔结与瓦解，但我们希望，这项安排至少能在一段时间内为我们带来一条稳定的边境。毕竟，我们并不需要同时与所有对手交战，才能确保最终的胜利。"
 me_egypt_4_border.13.desc.2:0 "[GetCountry('TRE').GetRuler.GetName] 展现出了高超的政治手腕，已欣然接受我们提出的联姻提议，将 [egypt_wedding_9_bride.GetName] 与 [egypt_wedding_9_husb.GetName] 缔结婚姻。这场婚礼将正式确认我们与 [GetCountry('TRE').GetName] 的同盟关系。\n\n在亚历山大诸继业者之间，联盟每天都在缔结与瓦解，但我们希望，这项安排至少能在一段时间内为我们带来一条稳定的边境。毕竟，我们并不需要同时与所有对手交战，才能确保最终的胜利。"
 me_egypt_4_border.13.t:0 "王室联姻已接受"
 me_egypt_4_border.14.a:0 "他们竟敢如此无礼？！"
 me_egypt_4_border.14.desc:0 "[GetCountry('SEL').GetRuler.GetName] 展现出令人遗憾的政治愚蠢，拒绝了我们提出的联姻提议，将 [egypt_wedding_9_bride.GetName] 与 [egypt_wedding_9_husb.GetName] 缔结婚姻。这场婚礼本可确认我们与 [GetCountry('SEL').GetName] 的友谊，并为双方带来一个稳定的边境；但他们既然选择了战争，那战争就将如期而至。很快。"
 me_egypt_4_border.14.desc.2:0 "[GetCountry('TRE').GetRuler.GetName] 展现出令人遗憾的政治愚蠢，拒绝了我们提出的联姻提议，将 [egypt_wedding_9_bride.GetName] 与 [egypt_wedding_9_husb.GetName] 缔结婚姻。这场婚礼本可确认我们与 [GetCountry('TRE').GetName] 的友谊，并为双方带来一个稳定的边境；但他们既然选择了战争，那战争就将如期而至。很快。"
 me_egypt_4_border.14.t:0 "王室联姻遭拒"
 me_egypt_4_border.15.a:0 "海盗行径绝不容许！"
 me_egypt_4_border.15.a.tt:0 "一支由改过自新的海盗组成的小型舰队加入了我们的行列，地点位于 $mare_lycium_area$。"
 me_egypt_4_border.15.a.tt.2:0 "此外，[GetProvince('(int32)1881').GetArea.GetName|Y] 获得 '#Y $egy_cilicia_safe_trade$#!'。"
 me_egypt_4_border.15.desc:0 "数个世纪以来，奇里乞亚海盗横行于东地中海，袭击沿海城市，劫掠商船，并助长奴隶市场的繁荣。这一切，到此为止。\n\n当我们征服该地区后，我们确保了海域的安全，沿海城市纷纷颂扬 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 的英名。奇里乞亚海盗的可怕传奇，就此终结——至少我们已对其造成沉重打击。\n\n从今日起，奇里乞亚的贸易将繁荣发展，我们愿意招募任何改过自新的海盗加入我们日益壮大的舰队。"
 me_egypt_4_border.15.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_8$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.15.t:0 "奇里乞亚商人：安全航线"
 me_egypt_4_border.16.a:0 "就连海盗也有其可用之处。"
 me_egypt_4_border.16.desc:0 "数个世纪以来，奇里乞亚海盗横行于东地中海，袭击沿海城市，劫掠商船，并助长奴隶市场的繁荣。\n\n在过去，我们曾是他们劫掠的受害者，那时他们对我们而言是一大祸患；但如今，我们已说服他们为我们效力，我们可以从这种合作中获得巨大利益。海盗为我们带来黄金——而且数量相当可观。我们无需追问这些黄金的来源。"
 me_egypt_4_border.16.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_9$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.16.t:0 "奇里乞亚海盗：维持现状"
 me_egypt_4_border.17.a:0 "这是我国迈向伟大的又一步。"
 me_egypt_4_border.17.desc:0 "[GetProvince('(int32)1910').GetArea.GetName] 终于归我们所有。尤其是 [GetProvince('(int32)1910').GetName]，这座古老的城市及其港口，对我们扩张计划而言是一个至关重要的基石：从她的港口出发，我们的舰队现在可以畅通无阻地在东地中海由北至南航行，直达 [GetProvince('(int32)516').GetName]。\n\n此外，控制海峡两岸将使我们对地中海诸岛的统治更加稳固，并为未来的北向扩张提供一个安全的基地。"
 me_egypt_4_border.17.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_10$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.17.t:0 "北方港口：据点"
 me_egypt_4_border.18.a:0 "尽管如此，这对我国的舰队与财政而言仍是一个伟大的日子。"
 me_egypt_4_border.18.b:0 "的确，该地区过于广阔且复杂，难以直接统治。或许建立一个附庸政权是更好的选择。"
 me_egypt_4_border.18.b.tt:0 "我们决定设立一个附庸王国。"
 me_egypt_4_border.18.b.tt.2:0 "我们创建了 [GetCountry('PRG').GetName] 王国作为藩属国。[GetCountry('PRG').GetName] 现在控制我们所拥有的一切位于 [GetProvince('(int32)290').GetArea.GetName|Y]、[GetProvince('(int32)279').GetArea.GetName|Y]、[GetProvince('(int32)278').GetArea.GetName|Y] 与 [GetProvince('(int32)254').GetArea.GetName|Y] 的领土。"
 me_egypt_4_border.18.desc:0 "[GetProvince('(int32)290').GetArea.GetName] 与 [GetProvince('(int32)279').GetArea.GetName] 的海岸自远古以来便由希腊人定居。就在这些海岸上，特洛伊战争曾爆发，数代希腊人为抵抗波斯王而奋战。\n\n如今，我们控制了通往爱琴海与希腊的亚洲出口。虽然我们对东地中海沿岸的广泛统治使运输与通讯更加便利，但这些土地位于我们王国最遥远的角落，距离 [GetProvince('(int32)516').GetName] 太远，我们有充分理由担忧未来可能发生叛乱……"
 me_egypt_4_border.18.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_11$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.18.t:0 "亚洲的希腊人：最遥远的土地"
 me_egypt_4_border.19.a:0 "他们选择了正确的阵营。"
 me_egypt_4_border.19.a.tt:0 "我们创建了以 [attalid_head.GetName] 为首领的珀加蒙王国作为藩属国。珀加蒙现在控制我们所拥有的一切位于 [GetProvince('(int32)290').GetArea.GetName|Y]、[GetProvince('(int32)279').GetArea.GetName|Y]、[GetProvince('(int32)278').GetArea.GetName|Y] 与 [GetProvince('(int32)254').GetArea.GetName|Y] 的领土。"
 me_egypt_4_border.19.desc:0 "当我国朝廷与巴西琉斯[GetCountry('EGY').GetRuler.GetName]正在斟酌关于一个新属国的最佳方略时，[attalid_head.GetName]——一位效力于[GetCountry('PRY').GetName]的次要家族成员——现身于[GetProvince('(int32)516').GetName]，带来了一项有趣的提议。\n\n[GetCountry('PRY').GetAdjective]的挫败已令其众多最显赫的仆臣倒向别处，[attalid_head.GetFamilyDisplayAdjective]王朝便是在此背景下抵达我朝。\n\n他们在[GetProvince('(int32)290').GetArea.GetRegion.GetName]拥有深厚的地方关系，并表示愿将忠诚转投于我，以换取一个与其重要性相称的地位……"
 me_egypt_4_border.19.t:0 "亚洲的希腊人：阿塔罗斯王国"
 me_egypt_4_border.2.a:0 "我们信任[GetCharacter('(int32)253').GetName]。"
 me_egypt_4_border.2.desc:0 "[GetProvince('(int32)747').GetName]是地中海主要的港口与贸易中心之一。作为最大且最古老的腓尼基城市之一，以高质量的雪松木船与紫色染料闻名，这座城市在其先前统治者的治理下一直享有相当程度的自由。\n\n[GetCharacter('(int32)253').GetName]，我们朝廷中的新成员，是一位希腊化的腓尼基人，与[GetProvince('(int32)747').GetName]之前的王室有着血缘关系。在离开安提柯政权后，他证明自己是我们值得信赖且有效的代理人。凭借他对我们建立的信任，他可能也会受到西顿人欢迎。他是确保我们控制该城的理想人选。"
 me_egypt_4_border.2.t:0 "西顿之王：菲洛克勒斯"
 me_egypt_4_border.20.a:0 "这可能看起来像是一场豪赌，但它终将带来回报。"
 me_egypt_4_border.20.a.tt:0 "我们所拥有的一切位于 [GetProvince('(int32)1774').GetArea.GetRegion.GetName|Y] 的省份将获得 #Y $egy_thracian_outpost_mod$#!。"
 me_egypt_4_border.20.desc:0 "[GetProvince('(int32)1774').GetArea.GetRegion.GetName]一直离我们的核心利益太过遥远，因此我们与该地区及当地势力的互动历来有限，尽管总体上是友好的。然而，我们最近在北方的扩张，使我们意识到有必要在北爱琴海采取更积极的干预。我们对海域的强烈兴趣意味着我们需要安全的前哨基地，以监控周边海域。\n\n我们的地位仍然脆弱，防守困难，但能够控制爱琴海两岸将为我们在东地中海的战略计划带来不可估量的优势。"
 me_egypt_4_border.20.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_12$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.20.t:0 "色雷斯威胁：稳固根基"
 me_egypt_4_border.21.a:0 "让我们听听他们有什么要说的。"
 me_egypt_4_border.21.a.tt:0 "我们接见了犹太使节团。"
 me_egypt_4_border.21.desc:0 "自从我们征服了所有希伯来人的土地以来，我们与当地人的关系日益改善。\n\n越来越多的希伯来知识分子在 [GetProvince('(int32)516').GetName] 找到了新的归宿，并在此深受希腊文化影响。他们的智慧促进了丰富的跨文化交流。在他们的调和下，[GetProvince('(int32)687').GetArea.GetRegion.GetName] 地区的 [hebrew_scope.GetName] 人民如今将我们视为朋友与保护者，而非入侵的敌人；尽管他们不愿放弃自己独特的宗教信仰，但在文化和习俗上正日益希腊化。\n\n在此背景下，一群来自亚历山大的犹太学者来到 [ROOT.GetCountry.GetRuler.GetName] 面前，提出了一个建议。"
 me_egypt_4_border.21.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_13$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.21.t:0 "犹地亚地区已平定"
 me_egypt_4_border.22.a:0 "[ROOT.GetCountry.GetRuler.GetPraenomen] 批准后，你们可前往 [GetProvince('(int32)687').GetName]！"
 me_egypt_4_border.22.a.tt:0 "犹太学者们从 [GetProvince('(int32)516').GetName] 出发。"
 me_egypt_4_border.22.b:0 "我们其实并不太在意这些事。"
 me_egypt_4_border.22.b.tt:0 "失望的犹太学者离开了宫殿。"
 me_egypt_4_border.22.desc:0 "由于他们独特的信仰、古老的传统以及强烈的民族认同感，[hebrew_scope.GetName] 人民始终受到我们宫廷与学者们的关注——尤其是他们的圣典与历史记忆。\n\n因此，当一群长期居住在我们首都的犹太知识分子提出，愿作为中间人，前往 [GetProvince('(int32)687').GetName] 的犹太大祭司处，请求获取其圣典副本时，宫廷上下对此提议反响热烈。"
 me_egypt_4_border.22.t:0 "学术兴趣"
 me_egypt_4_border.23.a:0 "学者们得到了 [ROOT.GetCountry.GetRuler.GetPraenomen] 的支持。"
 me_egypt_4_border.23.a.tt:0 "学者们开始他们的翻译工作。"
 me_egypt_4_border.23.b:0 "尽管我们尊重这些古老传统，但我们并不需要它们。"
 me_egypt_4_border.23.b.tt:0 "学者们离开了。"
 me_egypt_4_border.23.desc:0 "我们派往[GetProvince('(int32)687').GetName]的犹太学者已经返回。\n\n他们向该宗教的领袖——大祭司——传达了我们对犹太历史的兴趣，并阐述了将其神圣经文的官方副本送往[GetProvince('(int32)516').GetName]以供翻译的充分理由。虽然大多数埃及希伯来人仍通晓其祖先的语言，但希腊文译本将使经文更易于我们好奇的学者以及居住在王国中深度希腊化的犹太人接触。此外，这也将展示我们对这些人的善意以及他们如何良好地融入了我们的国家。我们的翻译家们热切希望表明，[GetCountry('EGY').GetName]是其上帝之选民的新家园，而再不是摩西时代的奴役之地——不管那意味着什么。"
 me_egypt_4_border.23.t:0 "犹太圣典"
 me_egypt_4_border.24.a:0 "[GetProvince('(int32)516').GetName] 是世界的中心，欢迎所有人！"
 me_egypt_4_border.24.desc:0 "经过多年的辛勤努力，负责将犹太圣典翻译为希腊语的学者们终于向 [ROOT.GetCountry.GetRuler.GetName] 呈上了他们的成果。\n\n希伯来人称这些经典为《妥拉》，但我们的学者更习惯称其为『五卷书』，其中详细记载了世界的起源、犹太民族的远古历史，以及他们的律法体系。这些书籍将成为这些人民融入我国的重要基石，而我们对这一独特文化历史的日益关注，也将在我国首都掀起一股研究与翻译的热潮。"
 me_egypt_4_border.24.t:0 "七十士译本"
 me_egypt_4_border.25.a:0 "这是伟大的成就。愿我们的力量继续增长！"
 me_egypt_4_border.25.desc:0 "在过去数年中，我们的成就是巨大的。东地中海海岸相当一部分现已纳入我国版图：友好的港口随时准备迎接我方舰队，新的臣民欢庆我们带给他们土地的繁荣与和平，而[GetCountry('EGY').GetName]从未如此富裕或强大。\n\n通过在东方与北方对抗竞争对手奠定了坚实基础后，我们现在处于更有利的位置，可收回[ROOT.GetCountry.GetRuler.GetName]作为亚历山大唯一合法继承者的头衔！"
 me_egypt_4_border.25.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_final$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.25.t:0 "沿海统治"
 me_egypt_4_border.26.a:0 "全面胜利！"
 me_egypt_4_border.26.desc:0 "我们的对手在我们不可阻挡的推进面前退却或覆灭！\n\n埃及在地理上远离亚历山大帝国的核心区域，但这并不足以让我们完全免于其他继业者的扩张野心。特别是我们的东方边境曾长期受到安提柯王朝的侵扰。然而，这一威胁如今已不复存在。通过外交手腕与军事实力的结合，我们将疆域扩展至整个东地中海沿岸，向对手展示了我们的优势，并确保了我国核心地区的安全。"
 me_egypt_4_border.26.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.26.t:0 "东方边境安全"
 me_egypt_4_border.3.a:0 "我们必须信任[GetCharacter('(int32)253').GetName]。"
 me_egypt_4_border.3.desc:0 "[GetProvince('(int32)747').GetName]是地中海主要的港口与贸易中心之一。作为最大且最古老的腓尼基城市之一，以高质量的雪松木船与紫色染料闻名，这座城市在其先前统治者的治理下一直享有相当程度的自由。\n\n[GetCharacter('(int32)253').GetName]，现任国王，是一位与[GetProvince('(int32)747').GetName]之前的王室有着血缘关系的希腊化腓尼基人。尽管他曾是安提柯的代理人，但现在他已宣誓效忠于我们。他的忠诚仍存疑，但他是我们赢得西顿人信任的最佳机会。"
 me_egypt_4_border.3.t:0 "西顿之王：正确的选择"
 me_egypt_4_border.4.a:0 "愿他们的婚姻获得神明的祝福！"
 me_egypt_4_border.4.desc:0 "为巩固与[GetProvince('(int32)747').GetName]统治者的友谊，我们提议在我拉吉德家族成员与国王本人之间举行一场联姻。\n\n愿通过[SCOPE.sCharacter('egypt_wedding_sidon_ruler').GetName]与[SCOPE.sCharacter('egypt_wedding_sidon_bride').GetName]的结合，世人皆知[GetCountry('EGY').GetName]的拉吉德家族保护[GetProvince('(int32)747').GetName]，而[GetProvince('(int32)747').GetName]以忠诚回报，永世不渝！"
 me_egypt_4_border.4.t:0 "西顿之王：皇家婚礼"
 me_egypt_4_border.5.a:0 "他们将大大帮助我们的事业。"
 me_egypt_4_border.5.a.tt:0 "我们在$mare_phoenicium_area$地区获得腓尼基舰队。"
 me_egypt_4_border.5.desc:0 "我们的敌人在海上，只有最强大的舰队才能打败他们。\n\n腓尼基自古以来以其优质的雪松木、快速的船只和勇敢的航海家闻名，他们横渡并殖民了整个地中海。腓尼基人有着深厚的航海与贸易传统，他们的加盟将让我们的舰队更强大，财富更加丰盈。"
 me_egypt_4_border.5.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_2$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.5.t:0 "腓尼基水手：为我效劳"
 me_egypt_4_border.6.a:0 "这只是第一步。"
 me_egypt_4_border.6.desc:0 "[GetProvince('(int32)660').GetArea.GetName] 是一片古老的城市和堡垒之地。长时间以来，这里是埃及与东方民族的边界；最近，它成为了[GetCharacter('(int32)37').GetName]在控制亚历山大王国时所能到达的最南端。\n\n如今，该地区已成为我们的一部分，并且得到了充分的防御，边界更为安全，我们向北的扩张可以在更坚实的基础上进行。"
 me_egypt_4_border.6.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_3$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.6.t:0 "边界安全：防御工事"
 me_egypt_4_border.7.a:0 "让我们邀请他们最精英的学者到[GetProvince('(int32)516').GetName]。"
 me_egypt_4_border.7.desc:0 "[GetProvince('(int32)687').GetArea.GetRegion.GetName]，位于叙利亚南部，夹在腓尼基和埃及之间，自腓力士人首次定居以来就被称为这个名字，但它更以当地人民独特的风俗而闻名：当地的部落自称为[hebrew_scope.GetName]，只承认自己的神！他们还是一个骄傲的民族，控制他们所居住的战略性区域一直是所有地方势力的挑战。\n\n如今，该地区完全在我们控制之下，我们需要与当地精英达成微妙的平衡，使该地区能够在我们的引导下繁荣发展，并造福我们所有人。"
 me_egypt_4_border.7.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_4$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.7.t:0 "犹地亚事务：统一"
 me_egypt_4_border.8.a:0 "我们的投资得到了回报。"
 me_egypt_4_border.8.a.tt:0 "此外，[GetProvince('(int32)769').GetArea.GetName|Y] 获得 “#Y $egypt_phoenician_docks_develop$#!”。"
 me_egypt_4_border.8.desc:0 "征服腓尼基的城市是一次伟大的成就。然而，这仅仅是我们介入该地区的开始。腓尼基的城市已经拥有一些地中海最大的港口和最富有的商贸中心，凭借我们的投资，我们现在可以充分利用它们的贸易优势；尤其是，地中海紫色染料的生产和贸易垄断是一笔无穷无尽的黄金财富，而当地的雪松木将不仅助力贸易，还将增强我们的舰队。"
 me_egypt_4_border.8.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_5$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.8.t:0 "紫色码头：腓尼基商人"
 me_egypt_4_border.9.a:0 "正义已经得到伸张，这就足够了。"
 me_egypt_4_border.9.a.tt:0 "[GetCountry('EGY').GetName]获得对[GetProvince('(int32)795').GetArea.GetName|Y]、[GetProvince('(int32)1883').GetArea.GetName|Y]和[GetProvince('(int32)1910').GetArea.GetName|Y]的宣称。"
 me_egypt_4_border.9.a.tt.2:0 "可能会与 [GetCountry('SEL').GetName] 或 [GetCountry('TRE').GetName] 进行王室婚姻。"
 me_egypt_4_border.9.b:0 "是时候进行外交了！"
 me_egypt_4_border.9.desc:0 "局势如何翻转……数年前，[GetCharacter('(int32)38').GetName]——[GetCharacter('(int32)37').GetPraenomen]之子——曾率军直逼至[GetProvince('(int32)516').GetName]城下，我整个王国险些落入其手。\n\n而今日，我光荣的大军已踏过[GetCharacter('(int32)37').GetName]的历史都城[GetProvince('(int32)790').GetName]。这一成就将洗刷我们昔日战败之耻，并向可恨的[GetCountry('PRY').GetName]昭示：[GetCountry('EGY').GetName]才是亚历山大的合法继承者。"
 me_egypt_4_border.9.desc.2:0 "数年前，[GetCharacter('(int32)38').GetName]，[GetCharacter('(int32)37').GetPraenomen]的儿子，率领军队几乎攻入了[GetProvince('(int32)516').GetName]的大门，整个王国差点落入他手中。\n\n安提柯家族早已离开了[GetProvince('(int32)790').GetName]，但曾经令人憎恶的[GetCharacter('(int32)37').GetPraenomen]的历史首都仍让人记忆犹新。这虽然是迟来的安慰，但我们可以认为[GetCharacter('(int32)38').GetPraenomen]入侵的耻辱至少部分得以复仇，而[GetCharacter('(int32)37').GetPraenomen]的记忆也得到了应有的冒犯。"
 me_egypt_4_border.9.end.tt:0 "$mission_completed_tooltip_1$ '#Y $egypt_mission_4_border_task_6$#!' $mission_completed_tooltip_2$"
 me_egypt_4_border.9.t:0 "安提柯的敌人：期待已久的复仇"
 me_egypt_4_border.9.wedding_tt:0 "我们将提议[egypt_wedding_9_husb.GetName]与[egypt_wedding_9_bride.GetName]结婚，并由此建立@[egypt_wedding_9_husb.GetEmployer.GetFlag]! [egypt_wedding_9_husb.GetEmployer.GetName|Y] 和 @[egypt_wedding_9_bride.GetEmployer.GetFlag]! [egypt_wedding_9_bride.GetEmployer.GetName|Y]之间的联盟"
 ptolemaia_number:0 "[SCOPE.ScriptValue('ptolemaia_svalue')|0]"

l_simp_chinese:
 any_allied_country_trigger:0 "任意盟国"
 ascension_of_yamato:0 "大和崛起"
 authority_of_the_king_mod:0 "王权"
 cities_of_wa:0 "倭之诸城"
 developing_navy_mod:0 "发展水军"
 great_city_of_yamato:0 "大和大城"
 major_food_source_prov_mod:0 "主要粮源"
 me_yamato_consolidate_1.a:0 "我之将士整装待战"
 me_yamato_consolidate_10.a:0 "诚然，[ROOT.GetCountry.GetRuler.GetFirstName]乃太阳女神天照大神之后裔也。"
 me_yamato_consolidate_10_desc:0 "旅者行至繁华之城[GetProvince('(int32)9684').GetArea.GetName]，目中尽是对此成就之惊叹，其心渐思及成就此一切之王；孰能置疑半神[ROOT.GetCountry.GetRuler.GetName]之权威耶？大和之民岂非奉一位在世神祇为君乎？"
 me_yamato_consolidate_10_title:0 "$yamato_02_consolidate_task_10$"
 me_yamato_consolidate_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_10$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_11.a:0 "我甘愿接受命运。来吧，引路前行"
 me_yamato_consolidate_11_desc:0 "旭日自东方海面升起，神光先照我土，晨光中[ROOT.GetCountry.GetRuler.GetName]静坐沉思，身着素白袍服——室中唯闻[ROOT.GetCountry.GetRuler.GetHerHis]平缓之呼吸。[GetProvince('(int32)9684').GetArea.GetName]之城虽在清早，已人声鼎沸，盖今日乃我王国历史中非凡之日。不数时，一场政教合一之大典将行；[ROOT.GetCountry.GetRuler.GetFirstName]将以凡人之身入殿，受天命之祚后，自圣堂步出即为在世之神，神圣天皇。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]沉思之深，初未觉侍者已聚于王室，彼等双手恭合，面容谦抑。片刻宁静后，一近臣轻咳声道：「吉时已至，陛下。万事俱备。」\n\n[ROOT.GetCountry.GetRuler.GetFirstName]起身，俨然天人合一之姿，颔首未语，恰似号令一般，日光骤明，满室生辉。"
 me_yamato_consolidate_11_title:0 "$yamato_02_consolidate_task_11$"
 me_yamato_consolidate_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_11$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_12.a:0 "极佳之讯，国造大人"
 me_yamato_consolidate_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，自[GetProvince('(int32)9328').GetArea.GetRegion.GetName]传来令人振奋之进展。此地虽多石难耕，然我坚韧之民竟在此不利境地中勉力治田。因我民此番艰辛劳作，自倭地所征之税大增——首批税入已于今日送达。"
 me_yamato_consolidate_12_title:0 "$yamato_02_consolidate_task_12$"
 me_yamato_consolidate_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_12$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_13.a:0 "此等教训须施用于未来诸城"
 me_yamato_consolidate_13_desc:0 "[GetProvince('(int32)9684').GetArea.GetName]之匠人实为勤勉，于其日益扩张之域内处处立城。一种独特建筑风格——深受古城旧都影响之风——见于遵[ROOT.GetCountry.GetRuler.GetName]之命而起之新城；此等砖石之伟业，必能垂于千秋矣。"
 me_yamato_consolidate_13_title:0 "$yamato_02_consolidate_task_13$"
 me_yamato_consolidate_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_13$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_14.a:0 "自拂晓初光，我心即系大和与报效之道"
 me_yamato_consolidate_14_desc:0 "伟哉，[ROOT.GetCountry.GetRuler.GetName]！当初令下，命我城邑以适当之公益设施为之美化，未料成就竟至于斯。百姓日谢陛下之恩，以淳朴感恩之心度其日常琐务，盖彼等知君王时时以苍生福祉系于[ROOT.GetCountry.GetRuler.GetHerHis]心。"
 me_yamato_consolidate_14_title:0 "$yamato_02_consolidate_task_14$"
 me_yamato_consolidate_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_14$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_15.a:0 "天照大神之光普照大和"
 me_yamato_consolidate_15_desc:0 "我大邑[GetProvince('(int32)9328').GetName]自柑橘农地崛起为雄伟大都，诚为列岛间文明灯塔。凡居其垣内之#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!皆当知，我等正处真正黄金时代，皆赖[ROOT.GetCountry.GetRuler.GetName]之辉煌治世。"
 me_yamato_consolidate_15_title:0 "$yamato_02_consolidate_task_15$"
 me_yamato_consolidate_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_15$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_1_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我等于$iya_area$、$kii_area$及$mino_area$之宣称已备妥。连尾张之地亦未遗漏；不日，我将驱逐蛮夷，将文明播于未开之地。黎明时分，信使将驰赴敌廷，呈递警告。"
 me_yamato_consolidate_1_title:0 "$yamato_02_consolidate_task_1$"
 me_yamato_consolidate_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_1$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_2.a:0 "待彼等开化之后，或有一日吾将建港筑城"
 me_yamato_consolidate_2_desc:0 "今我武士已破伊耶与纪伊之军，正可开治此地。呈[ROOT.GetCountry.GetRuler.GetName]之首议为：当增力以化伊耶，使我滨海之地真正融入大和之风。"
 me_yamato_consolidate_2_title:0 "$yamato_02_consolidate_task_2$"
 me_yamato_consolidate_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_2$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_3.a:0 "我要港湾、码头、船坞…尽皆建之"
 me_yamato_consolidate_3_desc:0 "[GetProvince('(int32)9679').GetArea.GetName]之地势得天独厚，堪为我北方海上力量之座，其地利可令我扬威于日本海。先知津间未来之重，[ROOT.GetCountry.GetRuler.GetName]诏令匠师尽一切所能，使此地为繁盛滨海之省。"
 me_yamato_consolidate_3_title:0 "$yamato_02_consolidate_task_3$"
 me_yamato_consolidate_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_3$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_4.a:0 "我慷慨赐予我之子民，因其已为我付出一切"
 me_yamato_consolidate_4_desc:0 "[GetProvince('(int32)9672').GetArea.GetName]及[GetProvince('(int32)9331').GetArea.GetName]二省何其速降也！或我斥候所报未臻周全，然于生死之事，岂有太过预备之理。览将军奏报时，[ROOT.GetCountry.GetRuler.GetName]淡然评曰：「关乎[GetProvince('(int32)9684').GetArea.GetName]之民，无有太巨之业，无有太高之价——吾甘舍己身所有以护己民。对吾所为，吾无愧焉。」"
 me_yamato_consolidate_4_title:0 "$yamato_02_consolidate_task_4$"
 me_yamato_consolidate_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_4$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_5.a:0 "幸有如此勤勉之守护者"
 me_yamato_consolidate_5_desc:0 "大和之民不仅蒙[ROOT.GetCountry.GetRuler.GetName]非常之君临，更幸赖王国至贤至能者理其庶政。昭然可见，大和已将孔夫子之训銘刻于心：「国之强，源于家之正。」"
 me_yamato_consolidate_5_title:0 "$yamato_02_consolidate_task_5$"
 me_yamato_consolidate_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_5$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_6.a:0 "吾等将善用此意外之财"
 me_yamato_consolidate_6_desc:0 "今晨文书之中夹有一函，乃督办北地绥靖之财计官吏所发。今日皆佳音也：我已籍没诸军阀之库藏，尽入我府库。所幸此等金钱不致再资叛乱之用。"
 me_yamato_consolidate_6_title:0 "$yamato_02_consolidate_task_6$"
 me_yamato_consolidate_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_6$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_7.a:0 "我等势不可挡！"
 me_yamato_consolidate_7_desc:0 "大和之军终再奏凯歌，此番克取[GetProvince('(int32)9690').GetArea.GetName]及[GetProvince('(int32)9308').GetArea.GetName]之可怖居民。战前所获预兆虽吉，然无人逆料九州之武士竟悍勇至此，不惜一切以求自由。我军蒙受巨损，然终得坚持而胜。"
 me_yamato_consolidate_7_title:0 "$yamato_02_consolidate_task_7$"
 me_yamato_consolidate_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_7$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_8.a:0 "真正的统帅身先士卒"
 me_yamato_consolidate_8_desc:0 "午后渐深，夕阳缓隐于[GetProvince('(int32)9328').GetArea.GetName]峨峨城墙之后，而城中却非如人意料那般沉寂。下方训练营中，士卒犹在操练；空中充溢愤怒战吼之喧嚣与铁器相击之铿鸣。纵是暮色轻笼京城之际，[ROOT.GetCountry.GetRuler.GetName]犹在场观军团演武，深陷于所观之战。[ROOT.GetCountry.GetRuler.GetHerHis]二名至强武士正在对决，面容扭曲，尽显刚毅之志，盖无人愿在诸目睽睽之下自辱。\n\n「有破绽，惟礼——出击！」[ROOT.GetCountry.GetRuler.GetFirstName]大喝，那武士立时乘势，将对手击倒在地。周遭响起稀落掌声，然[ROOT.GetCountry.GetRuler.GetFirstName]举手立止之。「此乃好开端，然吾等任重道远。明晨于此重逢。」行至倒卧于地、面含羞愧之武士前，[ROOT.GetCountry.GetRuler.GetFirstName]微笑伸手扶之起身。「吾以汝为傲——吾见汝之勤勉。明日吾将教汝一二招，或许用得上。」\n\n此语一出，掌声复起。"
 me_yamato_consolidate_8_title:0 "$yamato_02_consolidate_task_8$"
 me_yamato_consolidate_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_8$#!' $mission_completed_tooltip_2$"
 me_yamato_consolidate_9.a:0 "不久，我水师之力将与陆军比肩"
 me_yamato_consolidate_9_desc:0 "我获报，造船之举已告成。然「获报」一词恐未尽确；今午，我收得最终支出明细，支出之数确逾初计。虽然，陛下必然认同物超所值；只是我船匠手艺尚在精进，故建我舰队需时略长。然此一切仍令我甚感欣慰。"
 me_yamato_consolidate_9_title:0 "$yamato_02_consolidate_task_9$"
 me_yamato_consolidate_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_02_consolidate_task_9$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_1.a:0 "大和值得最好的"
 me_yamato_heartland_10.a:0 "罢了；我将亲往获取其保证"
 me_yamato_heartland_10_desc:0 "多时以来，[ROOT.GetCountry.GetRuler.GetName]心神不宁，盖有一难题未解：[GetProvince('(int32)9328').GetName]之民果能信任素以私欲闻名之氏族首领乎？当定数降临之时，我何以知彼等将力挺[ROOT.GetCountry.GetRuler.GetFirstName]？\n\n而后一日，众人齐聚祭祀之际，答案不显自明矣。"
 me_yamato_heartland_10_title:0 "$yamato_01_heartland_task_10$"
 me_yamato_heartland_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_10$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_11.a:0 "确是佳讯——所费时日…与金钱…物有所值"
 me_yamato_heartland_11_desc:0 "经数周与诸氏族首领之会商，[ROOT.GetCountry.GetRuler.GetName]虽勉力而得彼等誓言，却付出巨大个人代价。过程虽有挫败，需时时费心周旋，口舌博弈，然[ROOT.GetCountry.GetRuler.GetFirstName]对结果尚感满意。大和静待阁下下一令，吾主。"
 me_yamato_heartland_11_title:0 "$yamato_01_heartland_task_11$"
 me_yamato_heartland_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_11$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_12.a:0 "吾等需一专制君主"
 me_yamato_heartland_12.b:0 "贵族君主制最合吾意"
 me_yamato_heartland_12.c:0 "军国君主制乃我所好"
 me_yamato_heartland_12.d:0 "神权政治乃唯一之道"
 me_yamato_heartland_12.e:0 "财阀政治甚合吾宜"
 me_yamato_heartland_12_desc:0 "世人皆知[ROOT.GetCountry.GetRuler.GetName]乃周详之谋划者，能于想象之局中推演每一转折之后果，故此，当其宣告为[GetProvince('(int32)9328').GetName]之民立新政体之时，竟无一人异议，无一语斥叛逆谋反——此事遂不足为奇。一切反对早被消弭于未萌，举众似皆认同；唯余一事：[ROOT.GetCountry.GetRuler.GetFirstName]须予以[ROOT.GetCountry.GetRuler.GetHerHis]最终之御准。"
 me_yamato_heartland_12_title:0 "$yamato_01_heartland_task_12$"
 me_yamato_heartland_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_12$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_1_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，遵命遣出之使臣已有回音。君上欲结品格高尚之盟，既明示[GetProvince('(int32)9328').GetName]之民不与声名狼藉者交好，我方使节益加奋勉，誓不达目的不休。君上必感欣慰——因其非常之努力，我邦外交声誉大增，已获志同道合者之敬重。"
 me_yamato_heartland_1_title:0 "$yamato_01_heartland_task_1$"
 me_yamato_heartland_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_1$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_2.a:0 "大和之勇士整装待发！"
 me_yamato_heartland_2_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]竭力封锁备武行动之机密，然[GetProvince('(int32)9328').GetName]之民将欲兴兵之消息已不胫而走。铁匠近乎昼夜不息，务使刀兵甲胄足备其图；地方农夫亦被窥见向京城输运大量粮秣。大和正在囤积物资……不久便将闻战讯矣。"
 me_yamato_heartland_2_title:0 "$yamato_01_heartland_task_2$"
 me_yamato_heartland_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_2$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_3.a:0 "愿火神与我等同征至凯旋！"
 me_yamato_heartland_3_desc:0 "战端已启！拂晓时分，[GetProvince('(int32)9328').GetName]之散兵自隐伏营帐蜂拥而出，跨越疆界之标，冲入毫无戒备之邻邦田野牧场。纵此刻，[ROOT.GetCountry.GetRuler.GetName]已下绝无宽宥之令——终焉，我辈迎拥宿命！"
 me_yamato_heartland_3_title:0 "$yamato_01_heartland_task_3$"
 me_yamato_heartland_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_3$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_4.a:0 "到底得了多少？"
 me_yamato_heartland_4_desc:0 "吾主，理财之吏有书至。且慢问——非意外之账目，恰恰相反。具体不必细表，单说地方百姓见税吏至，皆慷慨解囊。彼等毕竟深知战事费财。"
 me_yamato_heartland_4_title:0 "$yamato_01_heartland_task_4$"
 me_yamato_heartland_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_4$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_5.a:0 "对此城吾有前所未有之宏伟愿景…"
 me_yamato_heartland_5_desc:0 "时近午前，[ROOT.GetCountry.GetRuler.GetName]引一众匠师，穿行[GetProvince('(int32)9328').GetName]之沃野，向谷中新立之城前行。大和之营建已绵延累月，[ROOT.GetCountry.GetRuler.GetName]表明[ROOT.GetCountry.GetRuler.GetHerHis]欲亲自督视最后阶段。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]默行街中，[ROOT.GetCountry.GetRuler.GetHerHis]面上唯有[ROOT.GetCountry.GetRuler.GetHerHis]双目从容扫视之动静；显然，[ROOT.GetCountry.GetRuler.GetFirstName]正一一过目。无尽无言之后，当[ROOT.GetCountry.GetRuler.GetFirstName]颔首以示认可，总匠作可闻之舒气声出。「伟哉此功，无愧将来居此之民。卿等辛劳，朕心谢之。」"
 me_yamato_heartland_5_title:0 "$yamato_01_heartland_task_5$"
 me_yamato_heartland_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_5$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_6.a:0 "我已能嗅到佳肴烹制之芬芳…"
 me_yamato_heartland_6_desc:0 "佳音！我农耕居落告竣，已享收获之果。今我稻谷稳供，可满我民之碗而溢之，此皆赖[ROOT.GetCountry.GetRuler.GetName]之恩。为表感激，今夜将为[ROOT.GetCountry.GetRuler.GetFirstName]设宴。"
 me_yamato_heartland_6_title:0 "$yamato_01_heartland_task_6$"
 me_yamato_heartland_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_6$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_7.a:0 "我承诺繁荣，并已兑现繁荣"
 me_yamato_heartland_7_desc:0 "昔时被视为边疆之[GetProvince('(int32)9328').GetName]，今已成区域间势力枢纽，威加远逾其京畿城垣。域内之事，[ROOT.GetCountry.GetRuler.GetName]无不了然于胸，诸多军阀将领因之切齿咒骂[ROOT.GetCountry.GetRuler.GetHerHis]之名，公然哀叹昔日或可阻挡大和崛起之时日，然彼等时日已一去不返矣。"
 me_yamato_heartland_7_title:0 "$yamato_01_heartland_task_7$"
 me_yamato_heartland_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_7$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_8.a:0 "天下将见证我之崛起，万邦将颤栗于我之威严"
 me_yamato_heartland_8_desc:0 "环抱雄城[GetProvince('(int32)9328').GetName]之省，实为壮丽可观——尤今[ROOT.GetCountry.GetRuler.GetName]之军竟成就前人所不能者：一统素以民性独立著称之全境。纷争终归沉寂，万众来朝，共奉一人——[ROOT.GetCountry.GetRuler.GetFirstName]。兹腹地既合于一帜之下，开启繁荣昌盛之纪元，谁能预见大和之未来？"
 me_yamato_heartland_8_title:0 "$yamato_01_heartland_task_8$"
 me_yamato_heartland_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_8$#!' $mission_completed_tooltip_2$"
 me_yamato_heartland_9.a:0 "我岂未言此等事必将发生？"
 me_yamato_heartland_9_desc:0 "[GetProvince('(int32)9328').GetName]迅为四境最要之城，此事无人意外。诚然四周乡野多丘多石，土质贫瘠，然环抱大和之农田宽厚宜人，足养其中蓬勃而起之雄城。纵今，其崇楼高厦远距可望，旅途劳顿者知黄昏前可于其城垣内得憩，因以释怀。此名城之百姓，当感恩于[ROOT.GetCountry.GetRuler.GetName]。"
 me_yamato_heartland_9_title:0 "$yamato_01_heartland_task_9$"
 me_yamato_heartland_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $yamato_01_heartland_task_9$#!' $mission_completed_tooltip_2$"
 organized_admin_country_mod:0 "整饬吏治"
 prosperity_of_yamato:0 "大和之繁荣"
 strong_alliance_network:0 "强固盟网"
 thriving_coastal_province_state_mod:0 "繁荣的沿海省邦"
 war_preparations_country_mod:0 "战备"
 warriors_of_yamato:0 "大和之武士"
 yamato_01_heartland:0 "大和之心"
 yamato_01_heartland_CRITERIA_DESCRIPTION:0 "当大和的心脏地带统一在一面旗帜之下时，此任务将完成，因为这片土地注定要由一只手来统治。"
 yamato_01_heartland_DESCRIPTION:0 "在本州南部的多山乡间，如果沿着蜿蜒的小径穿越险峻的峡谷和崎岖的地形，疲惫的双脚最终会抵达大和丰饶的农田；对旅人酸痛的脊背来说，这是一道令人欣慰的风景。正是在这里，在这个被周围山丘像巢中卵一般怀抱的省份，一个辉煌未来的愿景诞生了。"
 yamato_01_heartland_task_1:0 "忠信盟友"
 yamato_01_heartland_task_10:0 "齐聚诸首领"
 yamato_01_heartland_task_10_DESC:0 "在我们考虑任何对外纠葛之前，明智的做法是先在氏族首领之间达成共识，因为我们自己人民之间的和谐仍然是首要目标。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 yamato_01_heartland_task_10_tt:0 "至少有#Y 2#!位氏族首领忠诚度#Y 50#!或以上。"
 yamato_01_heartland_task_10_ttt:0 "获得使用#Y 争取支持#!角色互动的权限。此互动可用于氏族首领，为即将到来的国家变革争取支持。"
 yamato_01_heartland_task_11:0 "新的前路"
 yamato_01_heartland_task_11_DESC:0 "关于改革的讨论日益增多，关于[GetProvince('(int32)9328').GetName]前进的新道路的建议不断涌现——假以时日，我们将看到这些努力是否会有所成就。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 yamato_01_heartland_task_12:0 "大和王国"
 yamato_01_heartland_task_12_DESC:0 "前进的道路已经向我们展现，永恒的荣耀在前方等待着，只要我们抓住时机。让天下知晓，[GetProvince('(int32)9328').GetName]将成为一个王国，一个有史以来举世无双的王国！\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 yamato_01_heartland_task_12_tt:0 "[THIS.GetCountry.GetName|Y]将成为#Y 王国。#!"
 yamato_01_heartland_task_1_DESC:0 "如果我们要将计划付诸行动，我们不仅需要盟友守护我们的后方，而且他们必须值得信赖、品行高洁——除此之外我们绝不接受。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 yamato_01_heartland_task_2:0 "备战"
 yamato_01_heartland_task_2_DESC:0 "是时候放下外交，转而依靠武力来实现我们的意志。敌人的土地正等待着我们的军队——让我们的战士做好战争的准备。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 yamato_01_heartland_task_3:0 "对外扩张"
 yamato_01_heartland_task_3_DESC:0 "我们的士兵渴望战斗，准备消灭大和的敌人，同时向外扩张我们的疆域。愿我们的武士引领我们走向胜利！\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 yamato_01_heartland_task_4:0 "初步步伐"
 yamato_01_heartland_task_4_DESC:0 "我们周边民族拥有大量可榨取的财富，而由于我们的征服战争耗资巨大，第一步就是整顿我们的财政秩序。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 yamato_01_heartland_task_5:0 "大和之雄城"
 yamato_01_heartland_task_5_DESC:0 "[GetProvince('(int32)9328').GetName]的农田难道不是建造城市最吉祥的地方吗？我们的人民配得上一座体现他们优雅与高贵的首都。\n\n\n\n\n\n\n\n\n\n\n@event_pic6!"
 yamato_01_heartland_task_6:0 "水稻种植"
 yamato_01_heartland_task_6_DESC:0 "随着我们领土的扩展和增长，我们的责任也在增加，而且我们有许多饥饿的肚子要填饱——很明显，[GetProvince('(int32)9328').GetName]需要一个主要的食物来源来满足它的需求。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 yamato_01_heartland_task_7:0 "立足妥当"
 yamato_01_heartland_task_7_DESC:0 "[GetProvince('(int32)9328').GetName]终于进入了一个安定舒适的状态，在这个动荡不安的世界中找到了稳固的立足点。我们知道更伟大的事业在前方等待着，心中充满安宁。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 yamato_01_heartland_task_8:0 "掌控腹地"
 yamato_01_heartland_task_8_DESC:0 "我们的统一事业得到了众神的认可，他们不断以好运祝福我们——[GetProvince('(int32)9328').GetName]已经统一了核心地带，将其牢牢地置于我们的控制之下。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil11!"
 yamato_01_heartland_task_8_tt:0 "[GetProvince('(int32)9328').GetArea.GetName|Y] 为[ROOT.GetCountry.GetName]所拥有。"
 yamato_01_heartland_task_9:0 "经营大和"
 yamato_01_heartland_task_9_DESC:0 "在[GetProvince('(int32)9328').GetName]建造城市只是一个开始，很明显还有大量的工作要做。我们必须竭尽全力发展我们的首都。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 yamato_01_heartland_task_9_tt:0 "[GetProvince('(int32)9328').GetArea.GetName|Y] 有任何类型的行省投资。"
 yamato_02_consolidate:0 "列岛整合"
 yamato_02_consolidate_CRITERIA_DESCRIPTION:0 "当大和王国摧毁了周边的小军阀并完全控制了这些岛屿时，此任务将完成。"
 yamato_02_consolidate_DESCRIPTION:0 "所有人都见证了大和令人瞩目的崛起，她完成了几乎不可能的任务——在单一领袖之下统一了核心故土；谁能预料到她那令人叹为观止的升腾？然而，大和怀有雄心壮志，想要完成前所未有的事业——建立一个强大的帝国，这已不是秘密。"
 yamato_02_consolidate_task_1:0 "大和王国"
 yamato_02_consolidate_task_10:0 "王权"
 yamato_02_consolidate_task_10_DESC:0 "我们国王的话不容质疑或挑战；一旦命令下达，我们就有责任竭尽全力完成王室的愿望。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 yamato_02_consolidate_task_10_tt:0 "没有角色的忠诚度低于#Y 30#!。"
 yamato_02_consolidate_task_11:0 "神皇"
 yamato_02_consolidate_task_11_DESC:0 "神化之时正朝我们走来，这是我们一生事业的顶峰。要真正接受我们作为神圣帝国的命运，我们必须首先由一位活神统治。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 yamato_02_consolidate_task_12:0 "倭之主宰"
 yamato_02_consolidate_task_12_DESC:0 "我们已成为倭地无可争辩的主宰，是这个地区一切事务的最终权威，因此，我们有权分享我们领土内产生的财富。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 yamato_02_consolidate_task_12_tooltip:0 "#Y $wa_region$#!地区中至少有#Y 90%#!的人口（总计#Y [SCOPE.ScriptValue('yamato_absolute_total_pop_value')|0]#!）属于#Y [SCOPE.GetRootScope.GetCountry.GetName]#!并且为#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!文化或已整合文化。[SCOPE.GetRootScope.GetCountry.Custom('yamato_wa_region_pops_loc')]"
 yamato_02_consolidate_task_13:0 "开发列岛"
 yamato_02_consolidate_task_13_DESC:0 "征服新的领土只是硬币的一面；我们必须发展基础设施，特别是如果我们希望新臣民接纳我们的话。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 yamato_02_consolidate_task_14:0 "大和之建设者"
 yamato_02_consolidate_task_14_DESC:0 "诚然，我们的城市在成长，但我们需要投资建设供人民使用和享受的建筑物。日子漫长，有很多工作要做，但我们必将取得胜利。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 yamato_02_consolidate_task_14_tt:0 "[GetProvince('(int32)9328').GetArea.GetRegion.GetName]地区拥有至少#Y 250#!座建筑，且没有正在进行的施工。\n当前共有#Y [SCOPE.ScriptValue('current_yam_buildings_svalue')|0]#!"
 yamato_02_consolidate_task_15:0 "配得上皇帝之城"
 yamato_02_consolidate_task_15_DESC:0 "由于本王朝带来的空前增长，首都大和城正在迅速膨胀，人满为患。在拥挤成为问题之前，我们可能需要开始制定建造一座大都会的计划。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 yamato_02_consolidate_task_1_DESC:0 "到现在为止，我们对周围土地的主张应当已被居住在那里的人们所理解。为了我们未来的繁荣，我们必须控制环绕我们家园的内陆地区。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 yamato_02_consolidate_task_1_tt:0 "获得对#Y $iya_area$#!、#Y $kii_area$#!和#Y $mino_area$#!省份的宣称。"
 yamato_02_consolidate_task_2:0 "南进"
 yamato_02_consolidate_task_2_DESC:0 "军事行动中的势头可以成为盟友，特别是从强势地位出击时。不要让我们的敌人站稳脚跟，继续向他们施压！\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 yamato_02_consolidate_task_3:0 "沿海开拓"
 yamato_02_consolidate_task_3_DESC:0 "[GetProvince('(int32)9679').GetArea.GetName]的海岸以其天然良港而闻名，这一自然优势我们可以通过有针对性的投资来加强。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 yamato_02_consolidate_task_4:0 "北上"
 yamato_02_consolidate_task_4_DESC:0 "我们对北方蛮族日益增长的力量感到不安，与其让他们积蓄实力，我们决定一劳永逸地终结他们妄自尊大的妄想。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 yamato_02_consolidate_task_5:0 "有效行政"
 yamato_02_consolidate_task_5_DESC:0 "官僚体系运转失灵是不可容忍的事态；一首优美乐曲中一个不和谐的音符就足以驱散沉醉。我们必须确保我们的行政官员称职胜任。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 yamato_02_consolidate_task_5_tt:0 "至少有#Y 3#!名担任官职的角色拥有至少#Y 80#!的忠诚度和#Y 50#!的治国才能。（当前：#Y [SCOPE.ScriptValue('current_yamato_chad_office_holders')|0]#!）"
 yamato_02_consolidate_task_6:0 "北方整合"
 yamato_02_consolidate_task_6_DESC:0 "北方蛮族的藏身处蕴藏着大量金银，他们摒弃正当谋生之道，沉迷于放荡的盗匪生活。我们再也不能容忍这种情况。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 yamato_02_consolidate_task_7:0 "清理熊袭"
 yamato_02_consolidate_task_7_DESC:0 "是时候向九州岛扩张了。该地区的居民以骁勇善战著称，精于陆战和海战，因此我们必须为一场激烈的战役做好准备。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 yamato_02_consolidate_task_8:0 "大和武士阶层"
 yamato_02_consolidate_task_8_DESC:0 "我们军队的骨干应由一个武士阶层组成，他们将自愿承担起作为大和先锋的职责。我们的精英军团将成为各地战士的楷模。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 yamato_02_consolidate_task_9:0 "正规水师"
 yamato_02_consolidate_task_9_DESC:0 "因为我们是岛国，需要一支合适的海军来保护我们的海岸。砍伐树木，立即开始建造！\n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 yamato_empire:0 "大和帝国"
 yamato_empire_desc:0 "大和帝国的建立将为倭岛开创一个新时代，使其成为一个强大的区域性力量。"
 yamato_gather_support_1.a:0 "只消一笔小数目即可。"
 yamato_gather_support_1.b:0 "[target.GetName]需要更多才能被说服。"
 yamato_gather_support_1_desc:0 "[ROOT.GetCountry.GetRuler.GetName]最近几天似乎心事重重，拒绝透露[ROOT.GetCountry.GetRuler.GetHerHis]心中的想法。尽管有此小小的分心，但暴躁的脾气对[ROOT.GetCountry.GetRuler.GetFirstName]来说实属罕见，都城的生活如常继续。长老们之间无休止的辩论仍在进行，街道上挤满了商人和工匠，平民百姓照常度日。不够有雄心的人甚至可能满足于这种状态。\n\n然而，如果他们知道[ROOT.GetCountry.GetRuler.GetFirstName]焦虑的真正原因，他们一定会瞠目结舌；此时此刻，秘密使者已被派往[target.GetName]，希望为政府的变革争取支持。直到现在，我们的悄悄话运动仍在继续……"
 yamato_gather_support_1_desc_2:0 "你做出了一个艰难的决定，当你真正考虑到其影响时，你的身体因兴奋而颤抖。通过试图废除部落长老的权威并以你的统治取而代之，你已做出了攸关生死的决定；任何失误，任何计划中的疏漏，都将导致你作为国家公敌被公开处决。目光短浅的人可能会说你所提议的是叛国……但你不能独自完成此事；你必须寻求与你有同样想法的人的支持，以便赋予你的主张以合法性。"
 yamato_gather_support_1_desc_3:0 "[ROOT.GetCountry.GetRuler.GetName]决定，[target.GetName]的支持将是前进的必要条件，因为在叛乱时刻到来之际，[ROOT.GetCountry.GetRuler.GetFirstName]无法仅凭[ROOT.GetCountry.GetRuler.GetHerHis]自己的双腿站立。不过，众所周知，[target.GetFirstName]是个忠诚可靠的人，尽管[target.GetHerHis]的忠诚当然也是可以收买的。正如生活中的一切，这里没有承诺。"
 yamato_gather_support_1_desc_4:0 "\"你清楚你在提议什么吗，[ROOT.GetCountry.GetRuler.GetFirstName]？\"[target.GetName]向后靠在卧榻上，[ROOT.GetCountry.GetRuler.GetHerHis]眼中闪烁着锐利的光芒。夜已深沉；所有家奴都已入睡，只有一名侍从昏昏欲睡地站在门口。\"别担心田伯，他是聋子。\"[target.GetName]平淡地说道。\"他不会跑去向长老报告你所说的话。\"\n\n\"那么你怎么说，[target.GetFirstName]？你的支持对即将到来的事业至关重要。\""
 yamato_gather_support_2.a:0 "[target.GetName]将加入我们！"
 yamato_gather_support_2.b:0 "[target.GetName]已拒绝加入！"
 yamato_gather_support_2_desc_failed:0 "你收到了[target.GetName]的回信，一封充满侮辱和公然嘲弄的信……还有威胁！\"如果你继续沿着这条叛逆的道路走下去，我们将向当局告发你的阴谋——放弃你的愚蠢，记住你的本分。\"你将羊皮纸揉成一团，嗤笑着扔到地上。记住[target.GetName]，将他们全家列入清洗名单；时机到来时，你不会忘记他们懦弱地拒绝支持。"
 yamato_gather_support_2_desc_success:0 "你已派遣一位可信赖的顾问前往[target.GetName]，请求他们暗中支持你推翻长老并自立为王的企图。你必须承认，当[target.GetFirstName]某天傍晚亲自出现在你的家中，脸庞隐藏在他们的长袍皱褶下时，你感到十分惊讶。\"恕我冒昧来访，\"[target.GetFirstName]低语道，靠近你，\"但我不敢信任其他任何人来回应如此敏感的请求。我想亲口告诉你，时机到来时，你可以指望我们的支持。\""
 yamato_gather_support_2_title:0 "来自[target.GetName]的回应"
 yamato_gather_support_title:0 "争取支持"
 yamato_influence_state_mod:0 "大和影响"
 yamato_wa_region_pops_loc_1:0 "（#R [SCOPE.ScriptValue('yamato_current_pop_value')|0]#!/#Y [SCOPE.ScriptValue('yamato_total_pop_value')|0]#!）"
 yamato_wa_region_pops_loc_2:0 "（#Y [SCOPE.ScriptValue('yamato_current_pop_value')|0]#!/#Y [SCOPE.ScriptValue('yamato_total_pop_value')|0]#!）"
 yamato_warrior_class_mod:0 "大和武士阶层"
 ymt_gather_support:0 "争取支持"
 ymt_gather_support_act:0 "暗中接触$CHAR$以争取其支持"

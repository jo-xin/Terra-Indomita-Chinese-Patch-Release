l_simp_chinese:
 best_dueling_equipment:0 "精良决斗装备"
 desc_sons_of_heaven_zhou_mod:0 "已证吾等乃真天子。"
 desc_unified_currency_measure:0 "统一货币度量之制。"
 desc_unified_laws:0 "有统一法典。"
 desc_zhou_agriculture_mod:0 "精通水利工程"
 desc_zhou_inspected_country:0 "皇家巡视官提升治理效率。"
 dueling_equipment:0 "决斗装备"
 loyalty_to_zhou:0 "周室复兴"
 me_zhou_1.a:0 "我确有分量！"
 me_zhou_10.a:0 "周室之威大胜！"
 me_zhou_10_desc:0 "#E 秦#!国本是最有望终结#E 周朝#!、开创自家#E 秦朝#!之国。吾等已大挫此望。吾等已攻取其腹地，而无心腹之#E 秦#!将速亡。然吾等不可松懈，彼等尚存。"
 me_zhou_10_title:0 "$zhou_missions_task_10$"
 me_zhou_11.a:0 "下一个就是你！"
 me_zhou_11_desc:0 "#E 庆#!地既复归我治，吾等须巩卫边疆，夺取#E 幽#!之地。此区夹处于未开化之蛮族草原与#E 华夏#!大城之间。控扼此区亦将确保吾等对#E 渤海湾#!之贸易优势地位。"
 me_zhou_11_title:0 "$zhou_missions_task_11$"
 me_zhou_12.a:0 "百姓信我！"
 me_zhou_12_desc:0 "#E 义渠#!蛮部既已平定，吾等已护卫#E 华夏#!文明之地免遭未开化之威胁。更有进者，吾等已雪#E 西周#!覆灭之耻。我民欢庆此功业，万民争相归附，愿为守护和平与继续复兴#E 周朝#!而战。"
 me_zhou_12_title:0 "$zhou_missions_task_12$"
 me_zhou_13.a:0 "如今还有谁能拦阻我们？"
 me_zhou_13_desc:0 "#E 秦#!国之末日已然降临。彼曾于我最弱之时为最大之威胁，然今已不复存在。在另一世界中，#E 秦朝#!或与此时代同义，所幸者，吾等未生于如此现实。"
 me_zhou_13_title:0 "$zhou_missions_task_13$"
 me_zhou_14.a:0 "吾等已抵华北之边陲。"
 me_zhou_14_desc:0 "#E 燕#!乃由#E 姬#!氏所统领，其自称我#E 周朝#!之继承者。显然，我朝无需继承者。此地民众多已同情吾等大业，以捐赠资财我师以示支持。"
 me_zhou_14_title:0 "$zhou_missions_task_14$"
 me_zhou_15.a:0 "谁说官僚制度乏味无聊？"
 me_zhou_15_desc:0 "#E 周礼官制#!乃一先进体系，划分臣属等秩为#E 公、侯、伯、子、男#!。此简明制度，令我较任何他邦更有准备以治理广大臣民，且使我在整体上处技术优势之地位。"
 me_zhou_15_title:0 "$zhou_missions_task_15$"
 me_zhou_16.a:0 "我们真了不起！"
 me_zhou_16_desc:0 "我农业之发展及#E 水利工程#!之专精，使吾等得以规避江河雨涝之相关天灾，此等灾异他邦仍深受其困。"
 me_zhou_16_title:0 "$zhou_missions_task_16$"
 me_zhou_17.a:0 "也许巡查制度也没那么糟！"
 me_zhou_1700.a:0 "吾等不能冒险触怒贵族。"
 me_zhou_1700.b:0 "那些懒惰的蠢货休想得到喘息！"
 me_zhou_1700_desc:0 "我#E 王室巡察使#!在国中#E 贵族#!间引发不少骚动。众多#E 贵族#!此前尚可敷衍度日、疏于职守，然彼等抱怨#E 王室巡察使#!令其过度劳累，且过于刻板。吾等应否顺#E 贵族#!之愿，减少#E 王室巡察使#!之派驻，抑或置之不理？"
 me_zhou_1700_title:0 "$zhou_missions_task_17$：怨声载道之贵族"
 me_zhou_1701.a:0 "限制军事计划。"
 me_zhou_1701.b:0 "让监察官自行裁断。"
 me_zhou_1701_desc:0 "我一位#E 王室巡察使#!正协力增加征募#E 平民#!入伍之事。然若行之过甚，恐在#E 平民#!中引发不小骚动。吾等应否稍加约束#E 王室巡察使#!，以避此风险？"
 me_zhou_1701_title:0 "$zhou_missions_task_17$：军法森严"
 me_zhou_1702.a:0 "确保其达标即可，不过于此。"
 me_zhou_1702.b:0 "将其逼至极限！"
 me_zhou_1702_desc:0 "我#E 王室巡察使#!已下令应增加#E 公民#!用于研究之工时，其法在确保无人怠工。然此无疑将在公民中引发若干不安。吾等是否仍应照此进行？"
 me_zhou_1702_title:0 "$zhou_missions_task_17$：学术管理"
 me_zhou_1703.a:0 "以高效征税为目标即可。"
 me_zhou_1703.b:0 "让我们实施这些建议。"
 me_zhou_1703_desc:0 "平民多有逃漏税赋之行。#E 王室巡察使#!建议增设征税之法，以求更有效征收。然此举将使庶民颇为不满，因其已惯于现行征税之法。无论如何，更高效之征税为我带来收益，然若纳#E 巡察使#!之策，长远观之，收益将更丰。"
 me_zhou_1703_title:0 "$zhou_missions_task_17$：赋税之畏"
 me_zhou_17_desc:0 "随着我疆域之扩展，吾等已启用#E 王室巡察使#!。吾等将确保国中官僚体制尽可能清廉无垢。赋税、征兵与善治将确保我邦再度繁荣壮大之际，不致重蹈覆辙。"
 me_zhou_17_title:0 "$zhou_missions_task_17$"
 me_zhou_18.a:0 "下一步，禁止犯罪吧。"
 me_zhou_18_desc:0 "我邦律法与时俱进而日臻完善。此成就彰显我政治之创见，亦彰明我治理#E 华夏#!此古老大地之遗绪与经验。此亦将助我确保不再沦于#E 战国#!割据之局，盖此等分裂之举必将触法！"
 me_zhou_18_title:0 "$zhou_missions_task_18$"
 me_zhou_19.a:0 "一个崭新的货币时代展开了。"
 me_zhou_1900.a:0 "快，我要沐浴在黄金中。"
 me_zhou_1900_desc:0 "货币之统一已带来额外税收！实情如此，统一货币已令市井生发更多信任与更高利润。虽账目数字枯燥，然额外款项大受欢迎！"
 me_zhou_1900_title:0 "$zhou_missions_task_19$：一笔小财"
 me_zhou_1901.a:0 "所以你是说他之前不诚实…？"
 me_zhou_1901_desc:0 "我近在度量衡标准化之推进，显已触动国中一权贵。随精确度之提高，彼等发觉更易信赖他人，并已赢得清廉官员之誉。"
 me_zhou_1901_title:0 "$zhou_missions_task_19$：回心转意"
 me_zhou_1902.a:0 "不是我的钱！"
 me_zhou_1902_desc:0 "币制改革非可轻松推行之事。如分娩，历经痛楚方得新生……惜乎此意味着吾等须动用国库以资助新币之发行。"
 me_zhou_1902_title:0 "$zhou_missions_task_19$：成长之痛"
 me_zhou_1903.a:0 "有些人就是目光短浅！"
 me_zhou_1903_desc:0 "每一次现代化尝试，固然伴生思想保守之民。惜乎君上政权所带来之变革，已使此阶层颇为不满。彼等抱怨为何今需新币新度量，而旧法本已够用。"
 me_zhou_1903_title:0 "$zhou_missions_task_19$：变革之惧"
 me_zhou_19_desc:0 "往昔，吾等从无真正中央统一之货币与度量衡。在此新纪元，吾等方悟其对治理中央集权帝国何其重要。此将完成我不断加强之中央集权之最后一步。"
 me_zhou_19_title:0 "$zhou_missions_task_19$"
 me_zhou_1_desc:0 "是时不再俯视惨淡之境。是时起于沉郁之中。[ROOT.GetCountry.GetRuler.GetName|E]之心境正映我国事之状，今其沉郁消退而雄心勃发，整个#E 周#!邦亦将如此。"
 me_zhou_1_title:0 "$zhou_missions_task_1$"
 me_zhou_2.a:0 "只能有一人。"
 me_zhou_20.a:0 "我选择分权而治！"
 me_zhou_20.b:0 "我选择集权而治！"
 me_zhou_2000.a:0 "让我们开始准备。"
 me_zhou_2000_desc:0 "#E 大朝议#!行将召开。于此，吾等将决定#E 周朝#!之前途。仅征服土地并不足以成事。昔日教训已告吾等，即便有精练之官僚体系亦不足够。吾等需确保我治理之制可为长久之计。"
 me_zhou_2000_title:0 "$zhou_missions_task_20$ 之一"
 me_zhou_2001.a:0 "朝廷"
 me_zhou_2001.b:0 "地方总督"
 me_zhou_2001_desc:0 "我邦权威分而为二：地方之治与朝廷之治。各有利弊。\n\n#E 朝廷#!彰显我宏大与权势。我等可直接洞察万机。然此亦使我易受朝中腐败所害，更易遭内乱之伤。\n\n#E 方伯#!赋予我外部之势力。彼等差守我边疆，使我号令自#E 成周#!传至#E 柴桑#!。然一方伯可能权势过盛，至与#E 天子#!抗衡。\n\n我当择何派而扶持之？"
 me_zhou_2001_title:0 "$zhou_missions_task_20$ 之二"
 me_zhou_2002.a:0 "我会像鹰一样盯着你。"
 me_zhou_2002.b:0 "给他们一些私人空间。"
 me_zhou_2002_desc:0 "朝议之间，有一问浮现：#E 天子#!之言何重？固然，其言本具分量，然昔日各域皆期一定之自治。我官僚体制自彼时已有进益，今有能力更紧密治理国中，然民众或将视朝廷深监其背为更#E 暴虐#!之举。"
 me_zhou_2002_title:0 "$zhou_missions_task_20$ 之三"
 me_zhou_2003.a:0 "我想我也算半个演讲稿写手吧。"
 me_zhou_2003_desc:0 "#E 大朝议#!进展极为顺利。臣民交口称赞君之伟大。君之声如洪钟，旨令远播，尽人皆闻。显然，#E 周朝#!在君之引领下正向安泰之途迈进。"
 me_zhou_2003_title:0 "$zhou_missions_task_20$ 之四"
 me_zhou_20_annex_all:0 "吾等将吞并所有华夏属国，从而激怒当地民众。"
 me_zhou_20_desc:0 "经多番深思与辩论，#E 大朝议#!终告落幕。各派系各陈己见，然最终仍决于#E 天子#!。吾等应褫夺#E 华夏#!全境之自治权，抑或恢复自主属邦之制？"
 me_zhou_20_title:0 "$zhou_missions_task_20$ 终章"
 me_zhou_21.a:0 "周朝万岁！"
 me_zhou_21_desc:0 "今无人能再否认，#E 天命#!已重归于#E 周人#!之手。诚然，人人皆以为此不可能。自一空有虚名之城至今所见之泱泱帝国，实是不可思议！吾等将铭记#E 西周#!与#E 东周#!之时。然当我等开启#E 周#!室新盛之纪元，当记此诸时代皆属我绵延之邦，属我伟大王朝。此乃自青铜时代存续至今之王朝。此乃纵#E 华夏#!全境皆欲灭之而终未熄灭之王朝。\n\n此乃充盈上天之子的王朝。"
 me_zhou_21_title:0 "$zhou_missions_task_21$"
 me_zhou_2_desc:0 "#E 周#!邦于末世之际裂为三处分立之城。然真正之#E 周#!唯有一也！故，让吾等为另两处残存之邦掘好象征之墓穴，进而演化为独一无二之#E 周#!邦。于此，我雄图霸业将重新启程。"
 me_zhou_2_title:0 "$zhou_missions_task_2$"
 me_zhou_3.a:0 "好一份俊#E 韩#!美的嫁妆。"
 me_zhou_300.a:0 "如此厚礼，他们定然无法拒绝。"
 me_zhou_300_desc:0 "#E 周朝#!局势万分紧迫。西有崛起之#E 秦#!，南有背信弃义之#E 楚#!，北有#E 晋#!之残余——#E 魏、赵、韩#!。其中，于#E 周人#!朝廷而言，#E 秦#!最值关注。一策已出：吾等将予#E 韩#!一项无法拒绝之议。#E 周人#!之女嫁与#E 韩#!，以换取#E 韩#!重效忠顺！"
 me_zhou_300_title:0 "盛大求婚"
 me_zhou_301.a:0 "名声是关键。"
 me_zhou_301_desc:0 "#E 周#!与#E 韩#!之联姻，非仅在我近邻掀起波澜，更震动整个#E 华夏#!世界。霎时间，#E 周#!之皇室正统陡增十倍。此虽非全然复兴，然确令吾等及我决策者倍受鼓舞。"
 me_zhou_301_title:0 "美满婚姻"
 me_zhou_3_desc:0 "协议既被接纳，年轻之#E 周人#!新娘与#E 韩王#!之婚事便成定局。当此对欢喜新人共庆盛大婚典之际，#E 周王#!或更为欣慰。未久之前，#E 周#!尚不得不承认#E 韩#!及另两个#E 晋#!衍生邦之独立。而今，光荣之重生正由此秦晋之好肇启。"
 me_zhou_3_title:0 "$zhou_missions_task_3$"
 me_zhou_4.a:0 "旧日之悲剧，今朝之胜利。"
 me_zhou_4_desc:0 "六百余年前，#E 楚熊绎王#!臣服于#E 周文王#!，奠定不破之忠心……此乃#E 周人#!之所想！#E 楚#!于公元前九世纪经由一附庸国攻入#E 周#!疆土。#E 周昭王#!率#E 西六师#!反击，大难临头。异域水土令#E 昭王#!全然无所适从，当其渡#E 汉水#!撤退之时，桥梁崩塌！最终，#E 昭王#!及王室半数之师皆丧。此奇耻大辱与惨败，竟成为#E 周人#!权势极盛之终点。由此开启之衰落，至今仍萦绕#E 周#!之心。\n\n而终于，经数百年之久，吾等已施#E 昭王#!之惩罚与复仇！#E 楚#!之区将记住此为其对#E 豫#!域背信统治之终结，亦为#E 周#!权威重振之际#E 楚#!衰败之始。"
 me_zhou_4_title:0 "$zhou_missions_task_4$"
 me_zhou_5.a:0 "现在无人再能挡我之路！"
 me_zhou_500.a:0 "此事不可为人所知。"
 me_zhou_500_desc:0 "#E 魏惠公#!是#E 晋#!诸邦中首个自称王者。此后，#E 周#!昔日之封臣益加独立。赖我于#E 魏#!邦中之关系网络，加之巨量黄金与诸多外交恩惠，吾等将再次辖制#E 魏#!，褫夺其自封之'王国'地位，使其复归于泱泱#E 周#!邦之臣属！"
 me_zhou_500_title:0 "为魏政变 之一"
 me_zhou_501.a:0 "此事一完即告知于我"
 me_zhou_501_desc:0 "#E 周#!与我在#E 魏#!邦中之盟友已策划一桩奸巧密谋。一场政变，或称之政变。以助我盟友夺取#E 魏#!王位为交换，彼等将复归于泱泱#E 周朝#!之臣属。此政变之第一步，乃寻一适当候选之人及一名刺客以行其事。幸而，已有志于我大业之王位候选人可资利用。"
 me_zhou_501_title:0 "为魏政变 之二"
 me_zhou_502.a:0 "很好——有事再报！"
 me_zhou_502_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，吾等已接获刺客密报——诸事皆按谋划推进。魏王惯行之路已勘察妥当，周详之计渐趋成形。万事俱备之日，料不久矣。"
 me_zhou_502_title:0 "阴谋渐深"
 me_zhou_503.a:0 "我心狂跳…"
 me_zhou_503_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，刺杀魏王之行动此刻正在展开！已无退路可言；或成或败，然接下来之事，势不可止。"
 me_zhou_503_title:0 "此刻再无回头之路"
 me_zhou_5_desc:0 "魏王遇刺身亡，众人皆为之震动，然当此恶讯传入[ROOT.GetCountry.GetRuler.GetName]耳中之时，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]却面不改色。\n\n此事实属惨烈。魏王于[GetCountry('WEI').GetCapital.GetName]街市之上遭蒙面刺客袭杀——一柄匕首直贯咽喉，终结了魏国暴君之性命，混乱之中，刺客竟混入人群遁走无踪。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]，若君有意，今夜可于寝殿之外加派侍卫——吾等不欲君亦遭此等厄运。"
 me_zhou_5_title:0 "$zhou_missions_task_5$"
 me_zhou_6.a:0 "胜利属我！荣耀归于[ROOT.GetCountry.GetName]！"
 me_zhou_600.a:0 "[ROOT.GetCountry.GetAdjective]士兵之常规装备足矣"
 me_zhou_600.b:0 "打开国库，购置一切最佳装备"
 me_zhou_600_desc:0 "吾[ROOT.GetCountry.GetRulerTitle]，一名来自[ROOT.GetCountry.GetCapital.GetName]宫廷之勇士，一位流淌着#E周#!血脉之武者，已被遴选出战。吾方英雄将迎战背信弃义之赵王，为[ROOT.GetCountry.GetName]之荣耀、为赵国之王座而战！\n\n臣等建言陛下或可为我方武士配备兵甲器械之事略尽绵力。"
 me_zhou_600_title:0 "周之勇士"
 me_zhou_601.a:0 "吾等将掌握难以想象之技艺"
 me_zhou_601.b:0 "前所未有地加倍苦练"
 me_zhou_601_desc:0 "吾方周人勇士正于[ROOT.GetCountry.GetCapital.GetName]城垣之外厉兵秣马，以备决斗。每日清晨，[ROOT.GetCountry.GetRuler.GetName]自城门眺望武士操练，心中暗生亲授剑术之念。大胆之思涌入[ROOT.GetCountry.GetRuler.GetHerHis]心间，一个时辰之后，[ROOT.GetCountry.GetRuler.GetSheHe]已身着庶民布衣，立于周人武士之侧，手握兵刃。\n\n「吾来此与汝同训，然汝万不可告知他人吾在此处。」"
 me_zhou_601_title:0 "备战操练"
 me_zhou_602.a:0 "我几乎不忍目睹！"
 me_zhou_602_desc:0 "#E周人勇士#!与#E赵王#!之间之战已持续一刻之久，双方至今势均力敌，你来我往，互不相让。一丝恐惧于[ROOT.GetCountry.GetRuler.GetName]腹中悄然滋长，彼立于场边，冷汗涔涔。众人目光齐聚两位武者，当赵王发出一声原始咆哮向前猛扑之际，[ROOT.GetCountry.GetRuler.GetFirstName]不禁失声呻吟——此战胜负难料。"
 me_zhou_602_title:0 "险象环生"
 me_zhou_603.a:0 "了结他！"
 me_zhou_603_desc:0 "「饶命！」赵王双膝跪地，高声惨叫，然#E周人勇士#!毫无怜悯之意，面色阴沉坚毅，步步逼近。[ROOT.GetCountry.GetRuler.GetName]惊愕不已——周人剑士击败赵王之速竟如此之快，战斗方始便已尘埃落定。"
 me_zhou_603_title:0 "完全压制"
 me_zhou_604.a:0 "尔之土地终将归我，无论以何种方式！"
 me_zhou_604_desc:0 "[ROOT.GetCountry.GetRuler.GetName]目睹#E赵王#!击落#E周人勇士#!兵刃，不禁蹙眉畏缩，然未待众人出声，赵王已将利刃刺穿对手胸膛，将那可怜之人推倒在地。彼痛苦扭动挣扎之际，赵王转身面向[ROOT.GetCountry.GetRuler.GetFirstName]，脸上血汗交织，露出轻蔑之冷笑。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]紧咬面颊，直至鲜血渗出，攥紧[ROOT.GetCountry.GetRuler.GetHerHis]拳头，低声自语[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_zhou_604_title:0 "苦涩之败"
 me_zhou_605.a:0 "我们还能有何选择？"
 me_zhou_605_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，惊闻噩耗——赵王已于阵前为#E周人勇士#!所杀，而背信弃义之#E周#!大军已夺取我国土。虽苦药难咽，然吾等不得不承认已有了新主上。"
 me_zhou_605_title:0 "君王之死"
 me_zhou_6_desc:0 "#E周人勇士#!挥剑斩下，#E赵王#!向前颓然倒地——片刻之后，其头颅滚落尘埃。周人武士以优雅之姿擦拭剑刃、收入鞘中，转身面向[ROOT.GetCountry.GetRuler.GetName]，深深一躬，向前迈步。赵王已死，王座归于[ROOT.GetCountry.GetRuler.GetFirstName]——吾方勇士已赢得此役！"
 me_zhou_6_title:0 "$zhou_missions_task_6$"
 me_zhou_7.a:0 "他们将传唱我伟大归来之歌。"
 me_zhou_7_desc:0 "既已完成对#E宋#!之掌控，吾等须向#E青#!之地进发，以推动后续大计。#E青#!之地自#E周幽王#!崩后即告沦丧。#E齐#!崛起，雄踞此土大半。此虽为争夺之地，然不久必将重归王室之手。"
 me_zhou_7_title:0 "$zhou_missions_task_7$"
 me_zhou_8.a:0 "汝觉得如何？！"
 me_zhou_8_desc:0 "#E楚#!之地须彻底征服。彼等虽在过去五百年间不断壮大、全然自主行事，然其故土已空虚可乘。终结此背信弃义之国，将为吾等复兴之#E周#!成就一大功业，雪洗多年之前所受之辱。然吾等不可懈怠。#E楚#!曾雄霸#E荆#!之地，其残部犹踞彼处。吾等绝不罢休，直至全境尽归我有！"
 me_zhou_8_title:0 "$zhou_missions_task_8$"
 me_zhou_9.a:0 "吾等无需授予任何人称号。"
 me_zhou_9.b:0 "韩将持此称号。"
 me_zhou_9.c:0 "魏将持此称号。"
 me_zhou_9.d:0 "赵将持此称号。"
 me_zhou_9.e:0 "吾等将重建一个独立的晋国。"
 me_zhou_90.a:0 "如此便将其统一之。"
 me_zhou_90_desc:0 "#E西周#!之覆亡，于诸多方面可谓终局之始。公元前八世纪，#E西周王朝#!末代君王#E周幽王#!以嫔妃取代正宫。前王后之权父引兵叛乱，联合#E犬戎#!蛮族，终至攻陷都城、诛杀#E幽王#!。此后，太子#E宜臼#!被立为新王。其新都定于#E成周#!，西都为#E王城#!，东都为#E巩#!。诸城昔日统一于#E周#!邦治下，今已各自为政。若欲复兴#E周#!之威仪，三都必当一统。"
 me_zhou_90_title:0 "天子"
 me_zhou_9_desc:0 "#E晋#!邦昔为忠顺之臣。自其分裂之后，吾等迅速丧失了对#E魏#!、#E韩#!、#E赵#!之掌控。今可恢复#E晋#!之旧疆，重振其地。彼等置于吾等掌控之下，必能安然无恙，然吾等须决断将#E晋#!之地授与#E韩、魏抑或赵#!。又或，吾等自掌其地。倘若#E韩、魏或赵#!已无足轻重，吾等或可恢复#E晋#!全境，使之为名义独立之附庸。"
 me_zhou_9_title:0 "$zhou_missions_task_9$"

 zhou_decentralized_rule:0 "分权统治"
 zhou_employer_is_target_employer_tt:0 "我统治者至少有一位#Y朋友#!在#Y[GetCountry('WEI').GetName]#!（不得为[GetCountry('WEI').GetRuler.GetName]之#Y近亲#!、#Y侍卫长#!或#Y贴身侍卫#!）。"
 zhou_inspected_country:0 "已巡视国家"
 zhou_missions:0 "天子"
 zhou_missions_BUTTON_TOOLTIP:0 "飞升至天。"
 zhou_missions_CRITERIA_DESCRIPTION:0 "当#Y 周#!恢复其帝国威势时，此任务即告完成。"
 zhou_missions_DESCRIPTION:0 "强大之#E周朝#!曾为天下至高无上之存在。远溯至#T青铜时代#!，#E周朝#!建于公元前1046年，至今犹存。然中央权威之崩溃可谓显而易见。实际上，幸存之#E周#!邦国，不过凭借#E秦#!、#E楚#!、#E齐#!、#E魏#!、#E赵#!及#E燕#!之口头敷衍维系；而实际之权威不出都城#E成周#!之远郊。\n\n#E周朝#!注定将为#E秦#!及随后之#E汉#!朝所取代，诸多中国哲人将指斥#E周朝#!之腐朽与处置失当，转而赞颂#E商#!朝及神话中之#E夏#!朝。然而，余烬尚存，便可复燃为烈焰。而王朝之余烬，尚未熄灭。#E周朝#!能否重夺其皇权之衣钵，抑或#Y天子#!之名号将传予下一位应得之候选者？"
 zhou_missions_task_1:0 "终结消沉"
 zhou_missions_task_10:0 "遏制秦国"
 zhou_missions_task_10_DESC:0 "#E秦#!邦乃最有可能终结#E周朝#!并开创自身#E秦朝#!之国。至关紧要者，吾等当尽早粉碎此等迷梦，以免彼等之梦想不再仅是梦想。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 zhou_missions_task_10_claims:0 "获得对[GetProvince('(int32)8254').GetArea.GetName|Y]、[GetProvince('(int32)8271').GetArea.GetName|Y]、[GetProvince('(int32)8566').GetArea.GetName|Y]及[GetProvince('(int32)8577').GetArea.GetName|Y]之宣称。"
 zhou_missions_task_11:0 "镇抚东方"
 zhou_missions_task_11_DESC:0 "东方之地曾为#E周朝#!不可分割之一部分。然在#E周幽王#!死后之混乱中，#E齐#!邦终获独立并征服了#Y青#!之地大部。是时也，终于重新征服东方。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 zhou_missions_task_11_claims:0 "获得对[GetProvince('(int32)8722').GetArea.GetRegion.GetName|Y]的宣称"
 zhou_missions_task_12:0 "羁縻夷人"
 zhou_missions_task_12_DESC:0 "#E义渠#!之蛮族部落及其他#E戎#!人威胁着#E中国#!本身之完整。即便在我强盛之时，#E戎#!人仍骚扰我边境。当然，#E西周#!之终结，在很大程度上归因于与#E犬戎#!蛮族之联盟。吾等将控制此地域，以防在我尚未全然复兴之际发生此类荒唐之事。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 zhou_missions_task_13:0 "终结秦国"
 zhou_missions_task_13_DESC:0 "#E秦朝#!将在其诞生之前便被终结。在我等之时间线中，#E秦#!最终一劳永逸地终结了#E周朝#!。然今时今日，局面将截然相反。吾等必须摧毁#E秦#!！\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 zhou_missions_task_14:0 "横扫燕国"
 zhou_missions_task_14_DESC:0 "#E燕#!之#E姬#!氏家族，在公元前256年#E成周#!陷于#E秦#!之后，曾自称为#E周朝#!之继承者。彼等既已如此热切地自命为#E周#!，想必必将乐意归入我之直接统辖。\n\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 zhou_missions_task_15:0 "周室官僚"
 zhou_missions_task_15_DESC:0 "#Y公#!、#Y侯#!、#Y伯#!、#Y子#!及#Y男#!。此乃#E周朝官僚体系#!内不同之王室爵位。分别对应#Y公爵#!、#Y侯爵#!、#Y伯爵#!、#Y子爵#!及#Y男爵#!。欲于此时推行此等制度，吾等必须具备相应之基础设施。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 zhou_missions_task_16:0 "农业进步"
 zhou_missions_task_16_DESC:0 "#E周朝#!曾处于农业发展及技术之前沿，且常由政府直接主导。#Y水利工程#!以助灌溉，#Y水库#!以减轻对雨水之依赖，#Y运河系统#!以掌控水流本身之走向。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 zhou_missions_task_17:0 "王室巡视官"
 zhou_missions_task_17_DESC:0 "随着我疆域之扩张，吾等再度启用#E王室巡检使#!。此举将使吾等得以更高效地监管税收、律法及治理帝国所涉之诸般繁琐事务。纵然繁冗，然无人能否认其无可估量之效用。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 zhou_missions_task_17_officers_have_8_in_main_attribute:0 "我丞相、大元帅、宫廷哲人及大司徒之主属性技能至少为8。"
 zhou_missions_task_18:0 "统一法典"
 zhou_missions_task_18_DESC:0 "中央集权之国，必具中央集权之法典。此举有助确保吾等绝不再次坠入#E战国#!之乱局，盖因此举定然有悖于法！\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 zhou_missions_task_19:0 "统一货币与度量"
 zhou_missions_task_19_DESC:0 "往昔，吾等从未拥有真正统一之货币或度量衡。在此新时代，吾等如今认识到彼等于治理一个中央集权帝国何其重要。此将完成我不断壮大之中央集权权威之最后一步。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 zhou_missions_task_1_DESC:0 "#E延王姬#!，更以#E赧王#!之名著称，乃#E周朝#!之末代君王……然此次历史将走向不同之方向。让吾等治愈现实之创伤，那些令#E延姬#!伤痕累累之创痛。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 zhou_missions_task_2:0 "一姬周，二陵墓"
 zhou_missions_task_20:0 "大朝会"
 zhou_missions_task_20_DESC:0 "吾等必须召请国中所有师者、学者及哲人，举行一场#Y大集会#!。吾等已再度成为#E中国#!首屈一指之强国，必须就如何治理此等疆土做出决断。是重返曾行之有效之旧制，抑或为新纪元锻造一套全新之制度？\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 zhou_missions_task_20_decide_governance:0 "我们将能够决定是集权还是分权治理领土。"
 zhou_missions_task_20_loyal_governors_generals_officers:0 "我们没有总督、将军或官员忠诚度低于70。"
 zhou_missions_task_21:0 "光复天命"
 zhou_missions_task_21_DESC:0 "#E天命#!乃#E中国#!帝国合法化之形式。而天意昭然若揭；#E周朝#!之复兴已然来临。吾等已证明自身即为#Y天子#!。#E天命#!再度归于我身，且将永世归于我身。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 zhou_missions_task_2_DESC:0 "#E周#!之三都分立，必须首先终结。吾等须击败那两个僭越者，宣告我城为真正之都城，乃#E周室#!中央权威之复兴者！\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 zhou_missions_task_2_claims:0 "获得对[GetProvince('(int32)8384').GetArea.GetName|Y]、[GetProvince('(int32)8393').GetArea.GetName|Y]、[GetProvince('(int32)8958').GetArea.GetName|Y]及[GetProvince('(int32)8407').GetArea.GetName|Y]之宣称。"
 zhou_missions_task_3:0 "左右韩国"
 zhou_missions_task_3_DESC:0 "朝堂之上普遍存有一种恐惧——#E秦#!将进攻于我。#E史官延#!建言吾等应请求#E韩#!将其领土割让于我之治下。吾等当说服彼等以#Y藩属#!之身份加入我之疆域，以此达成此事。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 zhou_missions_task_3_woman:0 "我们至少有一位#Y 适婚女子#!拥有#Y 周室血脉#!。"
 zhou_missions_task_4:0 "惩罚楚国"
 zhou_missions_task_4_DESC:0 "自#E公元前961-957年#!起，#E周昭王#!对#E楚王朝#!发动战争，因一场灾难性之意外及不熟悉之气候，造成不可胜数之伤亡与损失。尽管#E周室#!有所扩张，#E昭王#!终归陨落，创伤已然造成。自此以后，#E楚#!遂成为事实上独立而强大之#E华夏#!邦国，而#E周#!则开启了长期衰落之时代。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 zhou_missions_task_4_claims:0 "获得对[GetCountry('SNG').GetName|Y]领土的宣称。"
 zhou_missions_task_5:0 "控制魏国"
 zhou_missions_task_5_DESC:0 "#E魏惠公#!乃#E韩#!、#E赵#!及#E魏#!之中首位称王者。自此之后，昔日#E周#!之附庸国变得日益独立。吾等必须再度驾驭#E魏#!，以巩固我不断壮大之中央集权。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 zhou_missions_task_5_man:0 "我朝至少拥有一位非我首要继承人或统治者之#Y成年男子#!，且该男子拥有#Y周室血统#!。"
 zhou_missions_task_6:0 "挑战赵国"
 zhou_missions_task_6_DESC:0 "如今#E韩#!与#E魏#!既已再度成为我之臣属，吾等便将目光投向#E赵#!。然#E赵#!已开拓出自身之庞大王国，并具备驯服蛮族附庸之能力。欲将#E赵#!重新纳入我之版图，尚需真正证明我之实力。\n\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 zhou_missions_task_6_challenge_zhao_for_throne:0 "我们的勇士将向赵王发起决斗挑战以决定赵国的命运。"
 zhou_missions_task_6_claims:0 "获得对[GetProvince('(int32)8316').GetArea.GetName|Y]、[GetProvince('(int32)8329').GetArea.GetName|Y]、[GetProvince('(int32)8340').GetArea.GetName|Y]、[GetProvince('(int32)8360').GetArea.GetName|Y]及[GetProvince('(int32)8285').GetArea.GetName|Y]之宣称。"
 zhou_missions_task_6_claims_2:0 "获得对[GetCountry('ZHA').GetName|Y]领土的宣称。"
 zhou_missions_task_6_man:0 "我朝至少拥有一位非我首要继承人或统治者之#Y成年男子#!，该男子拥有#Y周室血统#!，且其#Y武力#!至少为10。"
 zhou_missions_task_7:0 "征服宋国"
 zhou_missions_task_7_DESC:0 "据传，在久远之往昔，当#E商朝#!衰落之际，#E商纣王#!于#Y牧野之战#!中被击败，揭开了#E周朝#!之序幕。此后，#E周#!将一位#E商朝#!之族人封为#E宋公#!。\n\n尽管今时之境况已大不相同，然一个独立之#E宋#!国再度出现。再次册封一位#E宋公#!，何其合宜！\n\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 zhou_missions_task_7_claims:0 "获得对[GetProvince('(int32)8509').GetArea.GetRegion.GetName|Y]的宣称"
 zhou_missions_task_8:0 "肢解楚国"
 zhou_missions_task_8_DESC:0 "#E楚#!之地必须彻底征服。虽然彼等在过去五百年间不断壮大、全然自主行事，然其故土已空虚可乘。终结此背信弃义之国，将为吾等复兴之#E周室#!成就一大伟业，雪洗多年之前所受之辱。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 zhou_missions_task_8_claims:0 "获得对[GetCountry('CHU').GetName|Y]领土之宣称\n获得对[GetProvince('(int32)8983').GetArea.GetRegion.GetName|Y]之宣称"
 zhou_missions_task_9:0 "统一晋邦"
 zhou_missions_task_9_DESC:0 "#E晋#!邦分裂为#E韩#!、#E赵#!及#E魏#!三部，由此开启了#Y战国时代#!。如今吾等既已据有昔日#E晋#!之地，是时候决断如何处置此等领土。与#E晋#!之关系向来多变，而今将由吾等来书写此等疆域之未来。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 zhou_missions_task_9_decide_fate_of_jin:0 "我们将决定晋的命运。"
 zhou_secured_wei_throne:0 "稳固了魏国王位"
 zhou_sided_with_centre:0 "强化朝廷"
 zhou_sided_with_regions:0 "强化地方总督"

l_simp_chinese:
 01_cde_pontus_missions_01_black_sea:0 "黑海的本都霸主"
 01_cde_pontus_missions_01_black_sea_BUTTON_TOOLTIP:0 "荣耀归于本都！荣耀归于米特里达梯！"
 01_cde_pontus_missions_01_black_sea_CRITERIA_DESCRIPTION:0 "当本都确立自己为黑海的主导力量时，此任务将完成。"
 01_cde_pontus_missions_01_black_sea_DESCRIPTION:0 "#E 黑海#!居住着悠久的文化、遗产和不同背景的国家，包括黑海沿岸的#E 希腊殖民地#!以及我们北方的#E 斯基泰人#!和#E 萨尔马提亚人#!。虽然#E 博斯普鲁斯王国#!曾是一个强大的力量，能抵抗吕西马科斯王国等希腊化王国的影响，但如今很少有统治者有能力保护黑海免受外来影响。因此，让我们，#E 本都#!的#E 米特里达提#!统治者，建立自己作为黑海希腊人的真正霸主和保护者！"
 01_cde_pontus_missions_01_task_1:0 "祖先领地"
 01_cde_pontus_missions_01_task_1.tt:0 "获得对#Y 科尔基斯#!和#Y 帕弗拉格尼亚#!的宣称"
 01_cde_pontus_missions_01_task_10:0 "科尔基斯商埠"
 01_cde_pontus_missions_01_task_10_DESC:0 "发西斯和迪奥斯库里亚斯的希腊商埠是科尔基斯人民享有财富和富饶的两个主要来源。因此，若我们利用我们本都王国的财富将这些贸易城市扩展成我们帝国的繁荣商埠，我们必将赢得那些直接受益于此类发展的科尔基斯人民的心。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 01_cde_pontus_missions_01_task_11:0 "安抚科尔基斯部落"
 01_cde_pontus_missions_01_task_11.tt:0 "#Y 科尔基斯#!省"
 01_cde_pontus_missions_01_task_11_DESC:0 "科尔基斯地区是一个极其多样化的文化、语言和传统的熔炉；仅迪奥斯库里亚斯城就有一百到三百种语言在其居民中通行。因此，该地区极难控制，因为过去对阿契美尼德等大国的科尔基斯叛乱很可能会再次发生。因此，让我们在我们的统治下努力安抚科尔基斯的众多部落。\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_cde_pontus_missions_01_task_12:0 "科尔基斯的仆从统治"
 01_cde_pontus_missions_01_task_12.tt:0 "在科尔基斯、苏阿涅提和阿巴斯戈伊省的所有拥有和附属国拥有的领土中形成一个#Y 藩属国#!\n\n选择某人担任科尔基斯的新仆从统治者"
 01_cde_pontus_missions_01_task_12_DESC:0 "虽然我们已安抚了科尔基斯的部落，但几乎无法保证他们将对我们的国家保持忠诚，特别是我们的中央政府远在本都。因此，通过在科尔基斯建立一个代表我们治理的仆从王国可能更好，这将赋予当地部落一个能更好解决他们不满的统治者，同时确保国家仍掌握在本都手中。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 01_cde_pontus_missions_01_task_13:0 "征服沿海部落"
 01_cde_pontus_missions_01_task_13_DESC:0 "齐吉和亨尼奥基的沿海部落历来极其独立。齐吉是牧羊人和海盗，而希罗多德描述亨尼奥基人愿意杀死并食用同类。因此，击败并征服这些部落无疑将证明我们的武力。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_cde_pontus_missions_01_task_14:0 "海外野心"
 01_cde_pontus_missions_01_task_14.tt:0 "获得对#Y 陶里卡#!的宣称"
 01_cde_pontus_missions_01_task_141:0 "驱逐斯基泰人"
 01_cde_pontus_missions_01_task_141.tt:0 "陶里卡省"
 01_cde_pontus_missions_01_task_141.tt2:0 "#Y 斯基泰#!及其臣属在#Y 陶里卡#!不拥有任何领土"
 01_cde_pontus_missions_01_task_141_DESC:0 "陶里卡的皇家斯基泰人的崛起是我们实现黑海唯一本都霸权的重大障碍。虽然我们不太关心陶里卡的大部分是否在友好国家控制下，但我们必须夺取斯基泰人的主要城市，陶里卡的斯基泰新城，以受益于其战略位置。\n\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 01_cde_pontus_missions_01_task_14_DESC:0 "在特拉佩祖斯建立了海军基地，我们现在拥有海上入侵北方的基础。因此，让我们现在宣称北方的土地，从陶里卡开始。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_cde_pontus_missions_01_task_15:0 "赫尔松涅斯忠诚"
 01_cde_pontus_missions_01_task_15.tt:0 "获得对#Y 奥尔比亚#!和#Y 泰拉斯#!的宣称"
 01_cde_pontus_missions_01_task_15.tt2:0 "#Y 刻耳索涅苏斯#!与我们结盟且对我们的好感度至少达到#Y 80#!"
 01_cde_pontus_missions_01_task_15_DESC:0 "我们过去与赫尔松涅斯的人民关系友好。因此，让我们利用我们的影响力，确保赫尔松涅斯愿意追随我们追求陶里卡和黑海北部海岸的霸权目标。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_cde_pontus_missions_01_task_16:0 "北方商埠"
 01_cde_pontus_missions_01_task_16_DESC:0 "奥尔比亚和泰拉斯的富裕商埠，或贸易城市，曾具有自身的影响力。然而，这两个商埠现已衰落，处于北方蛮族部落斯基泰人和萨尔马提亚人的影响之下。作为黑海希腊人的保护者，让我们向西北航行，解放这些城市，恢复它们昔日的辉煌。\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 01_cde_pontus_missions_01_task_17:0 "陶里卡新城"
 01_cde_pontus_missions_01_task_17_DESC:0 "我们已夺取了著名的斯基泰城市陶里卡新城。这里居住着斯基泰人和希腊人，斯基泰人诚然将该城发展成陶里卡的繁华中心，希腊商人、建筑师和工匠为该城的文化和财富做出了贡献。因此，让我们为该城的发展做出贡献，将陶里卡新城变成陶里卡的本都特色城市。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 01_cde_pontus_missions_01_task_18:0 "征服博斯普鲁斯人"
 01_cde_pontus_missions_01_task_18_DESC:0 "黑海北部海岸的博斯普鲁斯王国曾是一个强权，甚至能挑战继业者吕西马科斯王国。然而，该王国现已衰落。因此，让我们将辛梅里亚的博斯普鲁斯人纳入霸权体系，使其置于更强大的王国统治之下，从而保障他们的安全。\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 01_cde_pontus_missions_01_task_19:0 "博斯普鲁斯整合"
 01_cde_pontus_missions_01_task_19_DESC:0 "作为黑海地区希腊人的自封守护者，我们若剥夺博斯普鲁斯希腊人‑即我们故土本都希腊人的近亲‑的公民权利与特权，实属不公。因此，让我们接纳博斯普鲁斯人民，并以友谊之名，直接资助其古都潘提卡帕翁的重建工程。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_cde_pontus_missions_01_task_1_DESC:0 "当黑海沿岸的各个希腊城市被北方的蛮族——斯基泰人、萨尔马提亚人和凯尔特人——袭击和围困时，黑海沿岸仅有少数国家有能力阻止他们。因此，我们将介入；作为本都王国的伟大国王，我们的统治者将担任希腊人的保护者，乘船渡海，将所有人都置于我们的保护之下。由于黑海沿岸的这些土地是我们的祖先领地，我们将向所有人表明，我们是这些土地名正言顺的霸主。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_cde_pontus_missions_01_task_2:0 "锡诺普宫殿"
 01_cde_pontus_missions_01_task_2.tt:0 "触发事件，允许您选择#Y 将首都迁至锡诺普#!并为该城提供奖励"
 01_cde_pontus_missions_01_task_20:0 "平定部落"
 01_cde_pontus_missions_01_task_20.tt:0 "博斯普鲁斯地区出现斯基泰蛮族"
 01_cde_pontus_missions_01_task_20_DESC:0 "随着博斯普鲁斯王国的征服，许多享有特权甚至与前博斯普鲁斯国王有亲属关系的斯基泰贵族部落担心他们将失去与远在本都的中央政府的影响力。为防止进一步问题，让我们激起那些不忠的人露出真面目，结束任何分裂主义思想。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_cde_pontus_missions_01_task_21:0 "进军斯基泰"
 01_cde_pontus_missions_01_task_21_DESC:0 "随着斯基泰人被驱逐出陶里卡，我们现已在该地区建立了立足点。因此，让我们在陶里卡集结我们的力量，深入斯基泰领土，全面控制北部博斯普鲁斯海岸，并向所有部落展示我们不容小觑。\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_cde_pontus_missions_01_task_22:0 "陶里卡的希腊人"
 01_cde_pontus_missions_01_task_22_DESC:0 "虽然希腊人欢迎我们作为从斯基泰威胁中解救他们的救星，但许多人对我们对其城市的意图仍持怀疑态度。因此，让我们通过发展他们的城市以及赞助陶里卡的当地崇拜，如帕特诺斯女神的崇拜，来赢得他们的心——陶里人，曾经是斯基泰的盟友，也将帕特诺斯作为主要神祇崇拜，因此这也将安抚不安的陶里人。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_cde_pontus_missions_01_task_23:0 "黑海希腊的捍卫者"
 01_cde_pontus_missions_01_task_23_DESC:0 "我们已解放了黑海北部和东部的所有希腊人，沿岸的所有希腊人都知道我们伟大国王的名字。因此，让我们正式宣布自己为黑海希腊人的救星！\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_cde_pontus_missions_01_task_24:0 "征服海岸"
 01_cde_pontus_missions_01_task_24_DESC:0 "当南部海岸布满敌人的要塞和堡垒时，我们如何能宣称对黑海的霸权？派出军队，摧毁任何抵抗我们[ROOT.GetCountry.GetAdjective]力量的势力！\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 01_cde_pontus_missions_01_task_24_tt:0 "拥有[GetProvince('(int32)1806').GetArea.GetRegion.GetName]和[GetProvince('(int32)1797').GetArea.GetRegion.GetName]地区至少75%的沿海领土（当前：[SCOPE.ScriptValue('pontus_02_coasts_task_24_current')|0Y] / [SCOPE.ScriptValue('pontus_02_coasts_task_24_total')|0Y]）"
 01_cde_pontus_missions_01_task_2_DESC:0 "我们在帕弗拉戈尼亚征服中的最新收获之一是希腊城市锡诺普。这座拥有持久希腊遗产的繁荣城市，是黑海希腊身份的完美体现。我们的统治者不仅考虑在该城建造一座夏季居所，还因其战略和文化价值，考虑在锡诺普建造一座皇家居所。我们的统治者甚至考虑将首都完全迁至锡诺普。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_cde_pontus_missions_01_task_3:0 "特拉佩祖斯海军基地"
 01_cde_pontus_missions_01_task_3_DESC:0 "若想扩展我们在黑海的影响力，我们必须首先建立一支强大的舰队；要建立强大的舰队，我们必须有一个足够大的指定海军基地来容纳这样的舰队。因此，我们的顾问一致认为，希腊城市特拉佩祖斯是理想地点，因为它已有一个完善的港口，容纳舰队和商船。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_cde_pontus_missions_01_task_4:0 "阿米索斯贸易纽带"
 01_cde_pontus_missions_01_task_4.tt:0 "任何#Y 希腊#!文化组国家与我们#Y 进行贸易#!"
 01_cde_pontus_missions_01_task_4_DESC:0 "通过扩展关键贸易城市阿米索斯的影响力，我们可以扩展我们在黑海的经济和文化影响，使用本都货币。阿米索斯将作为本都与黑海沿岸希腊城市之间经济和文化联系的纽带。这将在我们的王国货币下创造一个经济统一的领域，为沿岸的希腊人敞开怀抱接受我们的霸权铺平道路。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_cde_pontus_missions_01_task_5:0 "希腊化宫廷"
 01_cde_pontus_missions_01_task_5.tt:0 "任意#Y 希腊#!文化组国家对我们的好感度至少达到#Y 80#!"
 01_cde_pontus_missions_01_task_5.tt2:0 "获得一位具有优秀智略和魅力属性的本都文化顾问"
 01_cde_pontus_missions_01_task_51:0 "本都城邦"
 01_cde_pontus_missions_01_task_51.tt:0 "拥有一个#Y 广场#!以及#Y 大神庙#!或#Y 大剧院#!"
 01_cde_pontus_missions_01_task_51.tt2:0 "每一个拥有的#Y 城市#!，非首都"
 01_cde_pontus_missions_01_task_51_DESC:0 "希腊文明的标志性特征之一是希腊城邦，即城市，它是许多我们希望效仿的希腊文化方面的家园，以成为真正的希腊化王国。在继业者的希腊化王国中，如果臣民建造希腊风格的城邦并融入希腊化社会，他们有时会获得特权和更大的社会流动性。因此，让我们通过在我们的王国中建造具有独特希腊-本都风格的伟大城邦，来吸引我们的希腊和非希腊臣民。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 01_cde_pontus_missions_01_task_5_DESC:0 "米特里达提王朝几乎与波斯人一样是希腊人，无论在文化上还是血统上。通过与塞琉古王朝的联姻，我们的国王一直努力将本都建立为一个合法且独特的希腊化王国，从采用希腊头衔“国王”到指定希腊语为宫廷的官方语言和文字。因此，让我们开始邀请来自我们信任的外国希腊国家的个人在我们的宫廷中服务。这样的希腊影响也将使当前和未来的希腊臣民更容易认同我们的标准。\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 01_cde_pontus_missions_01_task_6:0 "希腊雇佣兵"
 01_cde_pontus_missions_01_task_6_DESC:0 "我们的统治者米特里达梯五世是第一位广泛使用希腊雇佣兵的本都统治者。虽然雇佣兵通常只为金钱而战，对任何国家都没有忠诚，但或许我们可以通过向他们展示我们在战时将善待他们，与这些贪财的雇佣兵建立一种伪友谊。因此，让我们继续与海边的希腊雇佣兵建立牢固的关系，以便我们建立一个以尊严和尊重对待雇佣兵的客户声誉。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 01_cde_pontus_missions_01_task_6_tt:0 "雇佣一名雇佣兵队长。"
 01_cde_pontus_missions_01_task_7:0 "德尔斐的赞助者"
 01_cde_pontus_missions_01_task_7.tt:0 "#Y 德尔斐城#!之主"
 01_cde_pontus_missions_01_task_71:0 "希腊人的保护者"
 01_cde_pontus_missions_01_task_71.tt:0 "至少#Y 2#!个希腊文化组国家#Y 由我们保障独立#!且对我们的好感度至少达到#Y 90#!"
 01_cde_pontus_missions_01_task_71_DESC:0 "若想承担黑海希腊人保护者的空缺角色，我们必须以行动而非言语证明我们的意图。因此，让我们保证希腊城市的独立和安全，使他们不再需要恐惧边境虎视眈眈的蛮族和外国势力。\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 01_cde_pontus_missions_01_task_72:0 "担保的贡金"
 01_cde_pontus_missions_01_task_72.tt:0 "1个希腊文化组国家#Y 由我们保障独立#!且对我们的好感度至少达到#Y 150#!"
 01_cde_pontus_missions_01_task_72.tt2:0 "一个#Y 希腊#!文化的，#Y 较低等级#!且由我们保障独立的非玩家国家，成为了我们的#Y 朝贡国#!"
 01_cde_pontus_missions_01_task_72_DESC:0 "本都的米特里达提王国过去曾与黑海周围的希腊城邦结盟，作为他们的保护者并保证希腊的自治。因此，或许是时候与我们保障独立的国家建立牢固的关系，以确立我们作为他们永久保护者的地位，以换取贡金。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_cde_pontus_missions_01_task_7_DESC:0 "许多希腊化统治者通过赞助德尔斐城赢得希腊城邦的尊重，德尔斐是著名的阿波罗神庙和同样著名的德尔斐神谕的所在地。因此，让我们向德尔斐城送去慷慨的捐款，以便他们为我们建造一座纪念碑，向整个希腊世界传播本都国王是亲希腊者、热爱希腊文化和人民的消息。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_cde_pontus_missions_01_task_8:0 "施压帕弗拉戈尼亚人"
 01_cde_pontus_missions_01_task_8.tt:0 "#G 若帕弗拉戈尼亚王国不拥有任何土地，则绕过此任务#!"
 01_cde_pontus_missions_01_task_8.tt2:0 "若#Y 帕弗拉戈尼亚#!不成为我们的藩属国，则#R 威胁开战#!。"
 01_cde_pontus_missions_01_task_81:0 "控制帕弗拉戈尼亚"
 01_cde_pontus_missions_01_task_81.tt:0 "由我们、附属国或盟友拥有"
 01_cde_pontus_missions_01_task_81.tt2:0 "#Y 下帕弗拉戈尼亚#!和#Y 上帕弗拉戈尼亚#!省份"
 01_cde_pontus_missions_01_task_81_DESC:0 "帕弗拉戈尼亚的残余王国仅拥有整个历史帕弗拉戈尼亚地区的一部分。作为我们的祖先领地，我们现在可以对任何拒绝将我们合法宣称的土地移交给我们王国的势力宣战。"
 01_cde_pontus_missions_01_task_8_DESC:0 "帕弗拉戈尼亚的本土国王曾统治安纳托利亚北部的大片领土。然而，现在我们远比他们强大——因此，我们有能力简单地胁迫帕弗拉戈尼亚国王将其领土遗赠给我们，作为我们的忠诚仆从国，直到我们认为适合将他们整合为我们王国的直接附属。"
 01_cde_pontus_missions_01_task_9:0 "征服科尔基斯"
 01_cde_pontus_missions_01_task_9.tt:0 "#Y 科尔基斯#!省"
 01_cde_pontus_missions_01_task_9_DESC:0 "夺取科尔基斯地区将对我们大有裨益，因为该地区将是我们沿黑海海岸进一步向北扩张的战略要地。此外，作为米特里达提家族所源自的阿契美尼德的前臣属，将该地区置于我们统治之下是恰当的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 cappodocian_conqueror_mod:0 "卡帕多西亚征服者"
 cde_me_pon_01.1.a:0 "让我们建立一个配得上我们祖先遗产的王国！"
 cde_me_pon_01.1.desc:0 "一个多世纪以前，我们的奠基者米特里达梯·克提斯忒斯在帕夫拉戈尼亚建立了一个小王国，最终发展为今日统治一方的本都王国。我们的王朝出自波斯贵族，甚至可以将血脉追溯到波斯伟大的阿契美尼德国王居鲁士与大流士诸族。若要建立一个能够抵御罗马与希腊化诸国影响的泛本都国家，就让我们先从祖先在科尔基斯与帕夫拉戈尼亚的土地开始宣称权利吧，那些地方曾在阿契美尼德时代由我们高贵的先祖掌握。"
 cde_me_pon_01.1.t:0 "祖先领地"
 cde_me_pon_01.1.tt:0 "我们将开始宣称我们的祖先领地"
 cde_me_pon_01.10.a:0 "我们对他们的捐款表示感激"
 cde_me_pon_01.10.desc:0 "#Y 本都#!的统治者向德尔斐城慷慨捐赠了一大笔钱币。看来他们希望成为德尔斐的赞助者，效仿过去的希腊化统治者。"
 cde_me_pon_01.10.t:0 "本都对德尔斐的捐款"
 cde_me_pon_01.11.a:0 "我们将捍卫黑海的所有希腊人！"
 cde_me_pon_01.11.desc:0 "通过保证几个希腊国家的自治和安全，我们向所有人展示了我们打算承担黑海希腊人保护者的空缺角色。黑海的希腊人不再需要恐惧蛮族的袭击或世界大国的威胁，因为我们本都将站在他们身边！"
 cde_me_pon_01.11.t:0 "黑海希腊的保护者"
 cde_me_pon_01.12.a:0 "他们不会后悔他们的决定"
 cde_me_pon_01.12.desc:0 "[me_epi_royal_wedding_country_scope.GetName]，我们长期以来担保其独立的国家，明智地决定永久接受我们的保护和霸权。作为保护其人民免受边境敌人侵害的回报，我们将定期从他们那里收取贡金，使他们正式成为我们国家的臣属。"
 cde_me_pon_01.12.t:0 "新的朝贡国"
 cde_me_pon_01.13.a:0 "让我们希望他们做出正确的决定……"
 cde_me_pon_01.13.desc:0 "帕弗拉戈尼亚的本土国王曾统治安纳托利亚北部的大片领土。然而，现在我们远比他们强大——因此，我们有能力简单地胁迫帕弗拉戈尼亚国王将其领土遗赠给我们，作为我们的忠诚仆从国，直到我们认为适合将他们整合为我们王国的直接附属。"
 cde_me_pon_01.13.t:0 "施压帕弗拉戈尼亚人"
 cde_me_pon_01.14.a:0 "让我们避免流血并臣服"
 cde_me_pon_01.14.b:0 "我们绝不投降！"
 cde_me_pon_01.14.desc:0 "本都王国威胁若我们不臣服于他们的统治，将与我们开战。他们过去曾夺取我们的领土，虽然他们的王国比我们的强大，但我们可能希望战斗以维护我们人民的骄傲。另一方面，接受他们的宗主权将避免流血，我们的统治者将继续作为本都的仆从王坐在帕弗拉戈尼亚王座上。"
 cde_me_pon_01.14.t:0 "本都压迫我们臣服"
 cde_me_pon_01.15.a:0 "他们做出了正确的选择"
 cde_me_pon_01.15.desc:0 "为避免流血，帕弗拉戈尼亚王国明智地决定臣服于我们的统治，成为我们的仆从国。"
 cde_me_pon_01.15.t:0 "帕弗拉戈尼亚臣服"
 cde_me_pon_01.16.a:0 "让我们将这些愚人置于应得的位置"
 cde_me_pon_01.16.desc:0 "尽管我们在武力和影响力上占据优势，帕弗拉戈尼亚王国愚蠢地拒绝了我们以和平换取其臣服的提议。因此，我们现在将对其国家宣战，强行将其领土置于我们的统治之下。"
 cde_me_pon_01.16.t:0 "帕弗拉戈尼亚拒绝臣服"
 cde_me_pon_01.17.a:0 "我们怎能以不同方式对待他们？"
 cde_me_pon_01.17.desc:0 "帕弗拉格尼亚是米特里达梯家族的祖先领地，正是在这里，创始人米特里达梯一世·克提斯忒斯建立了米特里达梯王国；因此，其融入王国对当地帕弗拉戈尼亚人来说是一大福祉，他们被当地米特里达梯总督平等对待。"
 cde_me_pon_01.17.t:0 "帕弗拉格尼亚的祖先领地"
 cde_me_pon_01.18.a:0 "多么有趣，我们是新的阿尔戈英雄！"
 cde_me_pon_01.18.desc:0 "我们终于确保了我们在科尔基斯的祖先领地，因为整个科尔基斯地区已置于本都统治之下。科尔基斯长期以来对希腊人来说是一个神秘和敬畏之地，是金羊毛的所在地。现在，我们是第一个实际夺取整个科尔基斯的希腊化国家。"
 cde_me_pon_01.18.t:0 "金羊毛之地"
 cde_me_pon_01.19.a:0 "愿他们为科尔基斯和本都带来财富"
 cde_me_pon_01.19.desc:0 "几个世纪前建立的发西斯和迪奥斯库里亚斯的希腊商埠是科尔基斯人民享有财富和富饶的两个主要来源。因此，我们对城市发展和地区贸易的直接国家赞助为我们赢得了最直接受益于我们资助的希腊和科尔基斯商人和市民的青睐。"
 cde_me_pon_01.19.t:0 "发西斯和迪奥斯库里亚斯"
 cde_me_pon_01.2.a:0 "本都必须团结一致！"
 cde_me_pon_01.2.desc:0 "为了形成一个有能力抵御罗马和希腊化王国侵入本都土地的泛本都国家，让我们巩固我们在科尔基斯和帕弗拉戈尼亚的祖先领地的控制！"
 cde_me_pon_01.2.t:0 "为了泛本都国家"
 cde_me_pon_01.20.a:0 "让我们努力保持这些人民的忠诚"
 cde_me_pon_01.20.desc:0 "科尔基斯地区是一个极其多样化的文化、语言和传统的熔炉；仅迪奥斯库里亚斯城就有数百种语言在其居民中通行。因此，我们暂时安抚了科尔基斯的众多部落和人民是一项相当了不起的成就。"
 cde_me_pon_01.20.t:0 "科尔基斯的众多部落"
 cde_me_pon_01.21.a:0 "[ruler_family_client_candidate.GetName]应统治"
 cde_me_pon_01.21.b:0 "[ruler_cousin_client_candidate.GetName]应统治"
 cde_me_pon_01.21.btt:0 "统治者的表亲成为科尔基斯的仆从王"
 cde_me_pon_01.21.c:0 "[ruler_local_client_candidate.GetName]应统治"
 cde_me_pon_01.21.ctt:0 "当地的科尔基斯统治者成为科尔基斯的仆从王"
 cde_me_pon_01.21.desc:0 "虽然我们决定通过仆从王间接统治科尔基斯更好，但我们尚未决定究竟谁应承担统治科尔基斯土地的责任。经过一番审议，确定了三个人选：[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]的直系家族成员、[ROOT.GetCountry.GetRuler.GetName]的远房表亲，以及一位杰出的当地科尔基斯统治者。"
 cde_me_pon_01.21.t:0 "科尔基斯的仆从王"
 cde_me_pon_01.22.a:0 "保护陶里卡的希腊人！"
 cde_me_pon_01.22.desc:0 "现在我们在特拉佩祖斯建立了海军基地，我们有了保护海对岸希腊人的手段。陶里卡的希腊人几乎被皇家斯基泰人击败，刻耳索涅苏斯以及博斯普鲁斯王国的城市是唯一未落入斯基泰统治的前希腊殖民地。因此，让我们宣称陶里卡，以便我们作为希腊自治的真诚捍卫者渡海！"
 cde_me_pon_01.22.t:0 "陶里卡的宣称"
 cde_me_pon_01.23.a:0 "在我们的保护下，他们将永不恐惧！"
 cde_me_pon_01.23.desc:0 "我们作为陶里卡希腊人的保护者介入陶里卡，为他们带来了期盼已久的和平与安全，免受北方蛮族部落的威胁。"
 cde_me_pon_01.23.t:0 "陶里卡的本都保护者"
 cde_me_pon_01.24.a:0 "辉煌！"
 cde_me_pon_01.24.desc:0 "随着赫尔松涅斯城在本都的影响下得到保障，是时候在黑海沿岸扩展我们的影响力了。我们的赫尔松涅斯朋友告诉我们奥尔比亚和泰拉斯的富裕商埠，曾经是有影响力的希腊城市，现在落入北方斯基泰人和萨尔马提亚蛮族部落的影响之下。因此，作为黑海希腊的保护者，让我们也解放这些城市。"
 cde_me_pon_01.24.t:0 "赫尔松涅斯的朋友"
 cde_me_pon_01.25.a:0 "在我们的旗帜下，任何希腊人都将无畏"
 cde_me_pon_01.25.desc:0 "我们已从蛮族领主手中解放了奥尔比亚和提拉斯的贸易城市，驱逐了斯基泰人和萨尔马提亚人，使他们不再袭击城市，给沿海脆弱的希腊人带来恐惧。"
 cde_me_pon_01.25.t:0 "保障西北商埠的贸易"
 cde_me_pon_01.26.a:0 "让我们继续发展陶里卡"
 cde_me_pon_01.26.desc:0 "我们已夺取了著名的斯基泰城市陶里卡新城。这里居住着斯基泰人和希腊人，斯基泰人诚然将该城发展成陶里卡的繁华中心，希腊商人、建筑师和工匠为该城的文化和财富做出了贡献。因此，我们已投资自己的资金，扩展陶里卡新城作为本都在陶里卡的战略、经济和文化中心。"
 cde_me_pon_01.26.t:0 "陶里卡新城"
 cde_me_pon_01.27.a:0 "极好。"
 cde_me_pon_01.27.desc:0 "博斯普鲁斯希腊人的征服为我们提供了更大的军事和经济机会。因此，让我们利用我们的新领土，在中心城市特奥多西亚建立本都商人。"
 cde_me_pon_01.27.t:0 "博斯普鲁斯征服"
 cde_me_pon_01.28.a:0 "所有希腊人，无论是本都还是博斯普鲁斯，都将繁荣"
 cde_me_pon_01.28.desc:0 "我们通过发展他们的土地并确保他们在本都统治下繁荣，证明了我们对博斯普鲁斯希腊人的奉献。因此，即使是博斯普鲁斯城市中对我们在其故土意图持怀疑态度的人，也被我们的慷慨和仁慈所感化。"
 cde_me_pon_01.28.t:0 "博斯普鲁斯整合"
 cde_me_pon_01.29.a:0 "让我们粉碎这可悲的抵抗！"
 cde_me_pon_01.29.desc:0 "担心在我们掌权后失去在博斯普鲁斯地区影响力的斯基泰贵族被故意煽动叛乱。这清除了对我们统治不满的人，只留下忠诚的，或至少是中立立场的斯基泰人作为我们王国的附属。因此，让我们粉碎这些斯基泰叛军，向所有部落展示我们不容违抗！"
 cde_me_pon_01.29.t:0 "斯基泰贵族部落叛乱"
 cde_me_pon_01.3.a:0 "将首都迁至锡诺普。"
 cde_me_pon_01.3.b:0 "那里仅建一座夏季宫殿就够了。"
 cde_me_pon_01.3.desc:0 "君主在沿海城市锡诺普的夏季居所已被#Y [ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]#!扩建，这反过来提升了该城在我们王国中的重要性和地位。虽然锡诺普是米特里达梯五世最近的收购，但其沿海岸的战略位置以及持久的繁荣和希腊遗产使其成为新首都的主要候选地。因此，在我们计划扩展黑海时，或许在锡诺普的沿海首都将更好地服务于我们，这将涉及永久将皇室家族迁至锡诺普。"
 cde_me_pon_01.3.t:0 "锡诺普的新皇家居所"
 cde_me_pon_01.30.a:0 "‘索特’，意为‘救世主’"
 cde_me_pon_01.30.b:0 "‘欧埃尔盖特斯’，意为‘恩人’"
 cde_me_pon_01.30.c:0 "‘梅加斯索特’，意为‘伟大救世主’"
 cde_me_pon_01.30.d:0 "尽管我们成就斐然，我们应保持谦逊……"
 cde_me_pon_01.30.desc:0 "我们已解放了黑海北部和东部的所有希腊人，沿岸的所有希腊人都知道我们伟大国王的名字。因此，我们已正式宣布我们的统治者为黑海希腊人的救星。\n\n在为黑海希腊人开创了一个崭新时代之际，为我们的统治者采用一个合适的称号或绰号以纪念其成就可能是恰当的。"
 cde_me_pon_01.30.t:0 "黑海希腊的捍卫者"
 cde_me_pon_01.4.a:0 "愿本都从我们的海岸统治海洋！"
 cde_me_pon_01.4.desc:0 "我们已将已然繁忙的特拉佩祖斯港口城市扩展成本都舰队的中央海军基地。为适应这一扩展，海军船坞已大幅扩建，使我们能够容纳和建造比以往更多的船只。"
 cde_me_pon_01.4.t:0 "特拉佩祖斯扩建船坞"
 cde_me_pon_01.5.a:0 "我们将用货币和外交赢得他们的心！"
 cde_me_pon_01.5.desc:0 "通过扩展关键贸易中心阿米索斯，我们已扩展了我们在黑海的经济影响力，将我们统治者的肖像传播到远超本都领域的货币上。通过继续以本都货币统一黑海，我们将创造一个统一的本都经济圈，所有个体在希腊-本都身份下团结一致。"
 cde_me_pon_01.5.t:0 "阿米索斯的经济霸主"
 cde_me_pon_01.6.a:0 "极好。"
 cde_me_pon_01.6.desc:0 "通过我们最近将黑海沿岸的希腊文化融入我们希腊化国家的政策，我们吸引了来自友好国家的才华横溢的个人，愿意在我们在本都的希腊化宫廷中为我们的统治者服务。"
 cde_me_pon_01.6.t:0 "希腊顾问加入我们的宫廷"
 cde_me_pon_01.7.a:0 "愿我们的忠诚臣民继续为我们服务"
 cde_me_pon_01.7.desc:0 "通过在我们的领域内建造希腊风格的城邦推行希腊化政策，我们反过来激励了我们的希腊和非希腊人民参与希腊化，以在我们的王国中获得更大的社会流动性。"
 cde_me_pon_01.7.t:0 "本都的希腊城邦"
 cde_me_pon_01.8.a:0 "愿他们在我们未来需要他们的服务时为我们效力"
 cde_me_pon_01.8.desc:0 "我们作为希腊雇佣兵公平客户的良好声誉，使我们成为全国雇佣兵的吸引客户。"
 cde_me_pon_01.8.t:0 "希腊雇佣兵关系"
 cde_me_pon_01.9.a:0 "愿我们与希腊人的纽带日益牢固"
 cde_me_pon_01.9.desc:0 "我们的统治者及其配偶向德尔斐城慷慨捐赠。这不仅改善了我们与该城及其领主的关系，还向所有希腊城邦明确表明，我们是亲希腊的仁慈王国，热爱希腊文化和人民，愿意保护他们免受伤害。因此，作为回报，德尔斐人为我们的统治者建造了一座纪念碑。"
 cde_me_pon_01.9.t:0 "本都的亲希腊者"
 cde_me_pon_cultural_integration:0 "文化整合政策"
 cde_me_pon_dedications_to_parthenos:0 "对帕特诺斯的奉献"
 cde_me_pon_developed_emporion:0 "发达的商埠"
 cde_me_pon_economic_hegemons:0 "经济霸主"
 cde_me_pon_greek_mercenary_ties:0 "希腊雇佣兵关系"
 cde_me_pon_hellenistic_poleis:0 "希腊化城邦"
 cde_me_pon_land_of_the_golden_fleece:0 "金羊毛之地"
 cde_me_pon_paphlagonian_ancestral_lands:0 "祖先领地"
 cde_me_pon_philhellene_of_pontus:0 "本都的亲希腊者"
 cde_me_pon_pontic_neapolis:0 "本都新城"
 cde_me_pon_pontic_protectorship:0 "本都保护权"
 cde_me_pon_pontic_royal_palace:0 "本都皇家宫殿"
 cde_me_pon_pontic_shipyard:0 "本都船坞"
 cde_me_pon_pontic_summer_palace:0 "本都夏季宫殿"
 cde_me_pon_protector_of_hellenes:0 "希腊人的保护者"
 cde_me_pon_scythian_champion_of_euxine_greeks:0 "黑海希腊的救星"
 cde_me_pon_scythian_nobles_disciplined:0 "斯基泰贵族受罚"
 cde_me_pon_secure_pontic_trade:0 "安全贸易"
 cde_me_pon_temples_to_local_cults:0 "当地崇拜的寺庙"
 cde_me_pon_theodosian_trade:0 "皇家赞助"
 cde_me_pon_tribes_appeased:0 "部落安抚"
 desc_cde_me_pon_developed_emporion:0 "我们在科尔基斯希腊人建立的基础上，打造了这座城市的繁荣贸易中心。"
 desc_cde_me_pon_economic_hegemons:0 "阿米索斯城作为本都与黑海希腊沿海城市之间的纽带，使我们能够以更丰富的本都货币统一这些较小的城市。"
 desc_cde_me_pon_greek_mercenary_ties:0 "我们作为希腊雇佣兵公平客户的良好声誉，使我们成为全国雇佣兵的吸引客户。"
 desc_cde_me_pon_hellenistic_poleis:0 "通过在我们的领域内建造希腊风格的城邦推行希腊化政策，我们反过来激励了我们的希腊和非希腊人民参与希腊化，以在我们的王国中获得更大的社会流动性。"
 desc_cde_me_pon_land_of_the_golden_fleece:0 "科尔基斯长期以来对希腊人来说是一个神秘和敬畏之地，是金羊毛的所在地。现在，我们是第一个实际夺取整个科尔基斯的希腊化国家。"
 desc_cde_me_pon_paphlagonian_ancestral_lands:0 "帕弗拉格尼亚是米特里达提家族的祖先领地；其融入王国对当地帕弗拉戈尼亚人来说是一大福祉，他们被当地米特里达提总督平等对待。"
 desc_cde_me_pon_pontic_protectorship:0 "我们作为陶里卡希腊人的保护者介入陶里卡，为他们带来了期盼已久的和平与安全，免受北方蛮族部落的威胁。"
 desc_cde_me_pon_pontic_summer_palace:0 "这里建造了一座夏季居所，统治者将在夏季居住于此。"
 desc_cde_me_pon_secure_pontic_trade:0 "本都王国的保护使商埠的贸易更加安全，允许商人进出城市而不必担心海盗和蛮族袭击。"
 desc_cde_me_pon_temples_to_local_cults:0 "我们赞助了当地崇拜的寺庙和神龛的建设，如陶里卡人民中特别受欢迎的帕特诺斯崇拜。"
 desc_cde_me_pon_tribes_appeased:0 "科尔基斯居住着多达数百种不同的语言，因此我们以某种方式安抚了科尔基斯的所有部落尤为令人印象深刻。"
 fight_for_a_new_kingdom_mod:0 "为新王国而战"
 great_works_of_pontus_mod:0 "本都伟大工程"
 kings_of_kios_mod:0 "基奥斯诸王"
 me_pon_donated_to_delphi:0 "捐献给德尔斐"
 me_pontus_kingdom.222.a:0 "我们必须夺回我们合法的土地！"
 me_pontus_kingdom.222.b:0 "我们暂时放过他们……"
 me_pontus_kingdom.222.desc:0 "一则几乎令人难以置信的消息传至[ROOT.GetCountry.GetCapital.GetName]，我们的骑士气喘吁吁，战马口吐白沫，保证此消息属实——似乎来自[GetCountry('KIO').GetName]的一支小型军事力量，在逃避#E 安提柯#!军队的到来时，夺取了[GetProvince('(int32)200').GetName]的要塞，从我们手中偷走了土地。\n\n懦弱的守军甚至未尝试捍卫我们的权利便打开了城门，现在基奥斯的军队在城墙上巡逻。\n\n如此严重的侮辱绝不能容忍——我们该怎么办，我的[ROOT.GetCountry.GetRulerTitle]？"
 me_pontus_kingdom.222.t:0 "来自基奥斯的威胁"
 me_pontus_kingdom_1.a:0 "再会了，基奥斯……暂时如此"
 me_pontus_kingdom_10.a:0 "有什么能阻挡我们的人民？我认为没有"
 me_pontus_kingdom_10_desc:0 "经过广泛的建设，[ROOT.GetCountry.GetCapital.GetName]已获得全新的基础设施，这将进一步为我们国家的荣耀做出贡献。地方税收比以往任何时候都要好，首都自身在持续增长，数千人在我们的城墙内安家。\n\n在这日益增长的都市混乱中，[ROOT.GetCountry.GetRuler.GetName]的名字每日被赞颂，因为每个人都完全清楚是谁一手将我们的首都带到这一刻。"
 me_pontus_kingdom_10_title:0 "$pontus_kingdom_missions_task_10$"
 me_pontus_kingdom_10_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_10$#!’现已#G 完成#!"
 me_pontus_kingdom_11.a:0 "我希望它别无他法……"
 me_pontus_kingdom_11_desc:0 "虽然每个人都正确地认为[ROOT.GetCountry.GetRuler.GetName]将是一位英勇的战士，但很少有人能猜到我们的[ROOT.GetCountry.GetRulerTitle]也是一位出色的建设者，然而多亏了[ROOT.GetCountry.GetRuler.GetHerHim]的明智投资，[ROOT.GetCountry.GetCapital.GetName]的声誉达到了历史最高点。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]并未忽视人民，而是认为应将我们的首都发展成一个名副其实的本都文明中心，足以媲美#E 黑海#!沿岸的任何城市。"
 me_pontus_kingdom_11_title:0 "$pontus_kingdom_missions_task_11$"
 me_pontus_kingdom_11_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_11$#!’现已#G 完成#!"
 me_pontus_kingdom_12.a:0 "愿我们的[ROOT.GetCountry.GetAdjective]人民成为有史以来最智慧的人"
 me_pontus_kingdom_12_desc:0 "在我们国家散布的众多学院中，一小群图书馆员负责管理[ROOT.GetCountry.GetRuler.GetName]下令编纂的众多卷轴和论文。据说，人类创作的所有最伟大的作品——外国历史、科学探究、战争史诗——都可以在我们的学习中心找到，这些中心对我们国家的所有公民开放。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]，一个真正相信获取知识价值的人，因此确保我们的知识霸权将保持不败——就像我们的军队一样。"
 me_pontus_kingdom_12_title:0 "$pontus_kingdom_missions_task_12$"
 me_pontus_kingdom_12_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_12$#!’现已#G 完成#!"
 me_pontus_kingdom_13.a:0 "我们将是你们的末日！"
 me_pontus_kingdom_13_desc:0 "[ROOT.GetCountry.GetName]的内地正发生动荡，因为我们的敌人已清楚地知道，我们不会满足于现状；不，我们的军队渴望战场上的战利品和荣耀，我们只能在邻国未设防的土地上找到我们的战士所渴望的。\n\n在可怕的[ROOT.GetCountry.GetRuler.GetName]领导下的[ROOT.GetCountry.GetAdjective]军队，正准备发动更多侵略战争——[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]地区的和平梦想正迅速消逝……"
 me_pontus_kingdom_13_title:0 "$pontus_kingdom_missions_task_13$"
 me_pontus_kingdom_13_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_13$#!’现已#G 完成#!"
 me_pontus_kingdom_14.a:0 "复仇献给敌人时，的确是一道甜美的佳肴。"
 me_pontus_kingdom_14.b:0 "如今除名义以外，我们已是#E 本都#!。让我们改正这一点。"
 me_pontus_kingdom_14_desc:0 "荣耀已在我们手中，且牢牢归于我们。敌人曾拼死守护这些土地，如今却已被我们逐出；他们的堡垒被夷平，妇孺也戴上铁镣。城市的灰烬弥漫空中，士兵穿行于占领区时，乡野之间回荡着哀歌。\n\n既然我们已经永久粉碎了#E 本都#!的力量，便有人提议，我们可以承袭其名，自称为这个国家合法权威的继承者。"
 me_pontus_kingdom_14_title:0 "$pontus_kingdom_missions_task_14$"
 me_pontus_kingdom_14_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_14$#!’现已#G 完成#!"
 me_pontus_kingdom_15.a:0 "前路依旧难以捉摸，但我们必须继续向前。"
 me_pontus_kingdom_15_desc:0 "谁能预见为我们人民设置的诸多危险和陷阱，就像猎人耐心地为猎物设下的罗网？\n\n就像一条因暴雨泛滥的蜿蜒河流，众神的意志带着我们走上一条我们无法逃脱的道路，虽然许多较弱的统治者会在压迫性的潮汐和海上风暴中屈服，但[ROOT.GetCountry.GetRuler.GetName]不知何故驾驶着国家之船度过了艰难时期。\n\n[ROOT.GetCountry.GetName]的众多敌人屏息等待来自[ROOT.GetCountry.GetCapital.GetName]的消息，害怕胜利的[ROOT.GetCountry.GetAdjective]军队随时可能到来。"
 me_pontus_kingdom_15_title:0 "$pontus_kingdom_missions_task_15$"
 me_pontus_kingdom_15_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_15$#!’现已#G 完成#!"
 me_pontus_kingdom_16.a:0 "我们确是真正的本都人，这一点应当远近皆知。"
 me_pontus_kingdom_16_desc:0 "[ROOT.GetCountry.GetName]全国正在发生变化，其中最明显的迹象之一便是人民之中的文化转向；甚至连[ROOT.GetCountry.GetAdjective]口语也已经改变。地区方言正在形成自身特色，外国人也常常评价我们的语言带有乐音般的声调。\n\n几代人以前，我们的[ROOT.GetCountry.GetAdjective]同胞几乎与其他#E 米底人#!难以区分。然而，随着时间缓慢推移，米底人的影响正从我们的城市和聚居地中消退，取而代之的是更优越的#E 本都#!行事方式。"
 me_pontus_kingdom_16_title:0 "$pontus_kingdom_missions_task_16$"
 me_pontus_kingdom_16_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_16$#!’现已#G 完成#!"
 me_pontus_kingdom_1_desc:0 "[GetCharacter('(int32)52').GetNameWithNoTooltip]已被[GetCharacter('(int32)37').GetNameWithNoTooltip]杀害！[GetCharacter('(int32)52').GetNameWithNoTooltip]之死的消息在全国激起巨大震动，人民为这场背叛而悲痛不已。\n\n然而此刻我们无暇哀悼，否则我们的头颅也会被安提柯军的长矛挑起，任由乌鸦啄食。[GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip]之民摆脱安提柯枷锁的时刻已经到来——我们必须尽可能集结大军，逃离此地！\n\n逃亡计划已经定下，此刻我们的骑兵正奔向[GetProvince('(int32)200').GetNameWithNoTooltip]，要在主力抵达之前夺下那座要塞……"
 me_pontus_kingdom_1_title:0 "$pontus_kingdom_missions_task_1$"
 me_pontus_kingdom_1_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_1$#!’现已#G 完成#!"
 me_pontus_kingdom_2.a:0 "基奥斯不会白白失去！"
 me_pontus_kingdom_2.b:0 "现在不是敌对的时候……"
 me_pontus_kingdom_2223.a:0 "对基奥斯人民来说是荣耀的一天！"
 me_pontus_kingdom_2223.b:0 "和平从来不是选项……他们必须全部死去！！！"
 me_pontus_kingdom_2223_desc:0 "在战争中失去[GetProvince('(int32)198').GetNameWithNoTooltip]后，[kimiata_owner.GetName]意识到这场战争已毫无意义，并向我们提出了一个无法拒绝的条件。帕弗拉戈尼亚北部几乎全境都将割让给我们，作为交换，我们会允许[kimiata_owner.GetName]继续存在……暂时如此。"
 me_pontus_kingdom_2223_title:0 "和平提议"
 me_pontus_kingdom_2223_tooltip:0 "[kimiata_owner.GetName]在[GetProvince('(int32)198').GetArea.GetName]与[GetProvince('(int32)208').GetArea.GetNameWithNoTooltip]地区拥有的每一个省份"
 me_pontus_kingdom_2_desc:0 "经过一场足以被后人传颂数十年的大胆突袭，我们的人几乎未遭当地抵抗，便夺取了[GetProvince('(int32)200').GetNameWithNoTooltip]要塞。事情顺利得仿佛他们本就希望被我们征服。[kimiata_owner.GetNameWithNoTooltip]无疑会为我们的行动勃然大怒，然而我们还可以让他们更加愤怒；我们是否敢继续索取更多土地？"
 me_pontus_kingdom_2_title:0 "为生存而战"
 me_pontus_kingdom_2_tooltip:0 "是时候让基奥斯向世人展示我们的真正身份了，因为今天便是[kimiata_owner.GetName]之民迎来末日的日子。许多人认为，只需夺取[GetProvince('(int32)200').GetName]一省，便足以迫使[kimiata_owner.GetName]屈服，因为他们如今比以往任何时候都更加虚弱。"
 me_pontus_kingdom_2_tooltipp:0 "我们将低调行事，看看[kimiata_owner.GetName]是否会对我们的行动以武力回应……"
 me_pontus_kingdom_3_title:0 "$pontus_kingdom_missions_task_3$"
 me_pontus_kingdom_3_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_3$#!’现已#G 完成#!"
 me_pontus_kingdom_4.a:0 "我们看起来或许不起眼，但我们有关键的力量"
 me_pontus_kingdom_4_desc:0 "我们的敌人从四面八方压迫我们的边境，有人声称预兆预示着[ROOT.GetCountry.GetName]的毁灭——我们如何能对抗集结起来的敌军？我们是一条小鱼，游在饥饿鲨鱼的海洋中……\n\n然而[ROOT.GetCountry.GetRuler.GetName]并未屈服于这种恐惧，而是选择每时每刻与我们的军队训练，准备实现[ROOT.GetCountry.GetRuler.GetHerHis]的命运。尽管洪水威胁要吞没我们，我们将为我们的雄心英勇作战！"
 me_pontus_kingdom_4_title:0 "$pontus_kingdom_missions_task_4$"
 me_pontus_kingdom_4_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_4$#!’现已#G 完成#!"
 me_pontus_kingdom_5.a:0 "密特拉信仰已俘获人民的心"
 me_pontus_kingdom_5.b:0 "希腊众神强大，我们渴望他们的力量"
 me_pontus_kingdom_5.c:0 "让我们继续为琐罗亚斯德点燃圣火……"
 me_pontus_kingdom_5.d:0 "必须拥抱琐罗亚斯德之道！"
 me_pontus_kingdom_5_desc:0 "经过一天激动人心的对话，居住在[ROOT.GetCountry.GetCapital.GetName]城内的圣人与[ROOT.GetCountry.GetRuler.GetName]的交谈终于结束，所有人返回家中，思考他们的讨论。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]，一个对众神极感兴趣的人，长期寻求精神真理，邀请了希腊人和米底的祭司与[ROOT.GetCountry.GetRuler.GetHerHim]讨论他们的哲学。在听取他们的论点后，公开考虑改变[ROOT.GetCountry.GetName]的宗教习俗。\n\n有理由拥抱#E 密特拉#!信仰，许多人认为遵循米底的仪式有智慧，但也有声音主张#E 希腊#!众神已向全世界证明了他们的英勇，仅此一点就应追随他们。\n\n当然，我们也可以选择维持现状……我们敢冒犯神灵的愤怒吗？"
 me_pontus_kingdom_5_title:0 "$pontus_kingdom_missions_task_5$"
 me_pontus_kingdom_5_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_5$#!’现已#G 完成#!"
 me_pontus_kingdom_6.a:0 "我们特此为[ROOT.GetCountry.GetName]宣称以下领土……"
 me_pontus_kingdom_6_desc:0 "消息传来，[ROOT.GetCountry.GetCapital.GetName]的要塞内，我们已准备好信使，他们将于今晚骑马前往邻国的首都和要塞，向他们宣布一个严峻的消息；除非他们离开我们认为合法属于我们的定居点和城市，否则我们两国将开战。"
 me_pontus_kingdom_6_title:0 "$pontus_kingdom_missions_task_6$"
 me_pontus_kingdom_6_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_6$#!’现已#G 完成#!"
 me_pontus_kingdom_7.a:0 "[ROOT.GetCountry.GetCapital.GetName]是个好地方；维持现状"
 me_pontus_kingdom_7.b:0 "让我们将首都迁至锡诺普，实际上的"
 me_pontus_kingdom_7_desc:0 "据各方报道，[GetProvince('(int32)1812').GetName]城，这座以真正国际化都市而闻名的著名港口，在其新[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]统治者的管理下继续繁荣。\n\n虽然[ROOT.GetCountry.GetRuler.GetName]开始喜欢上[GetProvince('(int32)200').GetName]，但这位[ROOT.GetCountry.GetRulerTitle]对被遗弃在#E 普罗蓬提斯#!海岸的[GetProvince('(int32)245').GetName]怀有苦乐参半的回忆。一天早晨，一个奇思妙想进入[ROOT.GetCountry.GetRuler.GetHerHis]的脑海；有什么能阻止我们将[ROOT.GetCountry.GetAdjective]权威的中心迁至海岸？或许我们能再次生活在辽阔的海洋旁。"
 me_pontus_kingdom_7_title:0 "$pontus_kingdom_missions_task_7$"
 me_pontus_kingdom_7_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_7$#!’现已#G 完成#!"
 me_pontus_kingdom_8.a:0 "贸易真正使我们的国家繁荣……"
 me_pontus_kingdom_8_desc:0 "旭日尚未跃出#E 攸克辛海#!（即黑海）水面，港口已传来水手们靠岸时的欢呼雀跃。结束海上漂泊的他们，个个迫不及待要踏上陆地，揣着鼓鼓囊囊的银铜钱袋，穿行于我们城市的街巷——那些叮当作响的硬币，正渴望着在我们的市集里找到归宿。\n\n所幸，他们很快就能开怀畅饮新鲜美酒、大快朵颐时令美食，甚至享受数月来的首次热水浴。只要钱袋未空，一切所欲皆可如愿。"
 me_pontus_kingdom_8_title:0 "$pontus_kingdom_missions_task_8$"
 me_pontus_kingdom_8_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_8$#!’现已#G 完成#!"
 me_pontus_kingdom_9.a:0 "让你们的舰队掉头吧，因为在[ROOT.GetCountry.GetName]只有死亡在等着你们"
 me_pontus_kingdom_9_desc:0 "虽然我们在陆上激战中无疑能坚持战斗，但有人担心我们漫长的海岸线是一个弱点。若无适当保护，海盗或雇佣军的入侵军队可能登陆我们的海岸，给沿海居民带来灾难。\n\n但这不再是问题，多亏了[ROOT.GetCountry.GetRuler.GetName]在最脆弱的防线上建造了一道名副其实的堡垒之墙。"
 me_pontus_kingdom_9_title:0 "$pontus_kingdom_missions_task_9$"
 me_pontus_kingdom_9_tooltip:0 "任务‘#Y $pontus_kingdom_missions_task_9$#!’现已#G 完成#!"
 pontic_jewel_of_the_euxine_mod:0 "黑海之珠"
 pontus_capital_modifier:0 "本都文明中心"
 pontus_euxine_forts_mod:0 "黑海堡垒"
 pontus_euxine_ports_mod:0 "黑海港口"
 pontus_kimiata_move_effect_tt:0 "[GetCharacter('(int32)97').GetName]带领人民从[GetProvince('(int32)245').GetName]逃至[GetProvince('(int32)200').GetName]，以躲避[GetCharacter('(int32)37').GetName]的愤怒。"
 pontus_kingdom_mission_task_5_tt:0 "考虑[mission_country.GetName]的宗教未来……"
 pontus_kingdom_missions:0 "本都王国"
 pontus_kingdom_missions_BUTTON_TOOLTIP:0 "前路艰难，但只要我们坚守信念，无人能阻挡我们的步伐……"
 pontus_kingdom_missions_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]在#E 继业者战争#!的混乱后果中巩固其地位时，此任务将完成。"
 pontus_kingdom_missions_DESCRIPTION:0 "我们的国家正处于真正的危急时刻。那些自称朋友的人公然贪婪地觊觎我们的财产，四方边境又受到野心将领征召军队的压迫，他们无不渴望扑灭我们骄傲文明中仍在闪烁的微光。\n\n面对这场危险，我们的统治者并未在巨大压力下屈服，而是选择同那看似不可避免的浪潮抗争到底。"
 pontus_kingdom_missions_task_1:0 "安提柯的威胁"
 pontus_kingdom_missions_task_10:0 "合适的首都"
 pontus_kingdom_missions_task_10_DESC:0 "现在我们有片刻喘息之机，可以评估我们最近的成就，让我们将注意力转向美化我们的首都[ROOT.GetCountry.GetCapital.GetName]。\n\n我们不能让[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族生活在谦卑之中，而应建立一座反映其永恒荣耀的真正首都！\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 pontus_kingdom_missions_task_11:0 "明智的投资"
 pontus_kingdom_missions_task_11_DESC:0 "多亏了[ROOT.GetCountry.GetRuler.GetName]的商业头脑，我们的首都[ROOT.GetCountry.GetCapital.GetName]正迅速赢得本都文明中心的声誉——对我们的[ROOT.GetCountry.GetRulerTitle]来说，还有什么更高的赞誉？\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 pontus_kingdom_missions_task_12:0 "本都的伟大工程"
 pontus_kingdom_missions_task_12_DESC:0 "来自世界各地的博学旅行者和哲学家乘船前往[ROOT.GetCountry.GetName]的港口，希望参加我们国家众多学院中举办的讲座。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 pontus_kingdom_missions_task_12_tt:0 "共拥有#Y [SCOPE.ScriptValue('pontus_academy_task_12_max')]#!个学院（当前：[SCOPE.ScriptValue('pontus_academy_task_12_current')|0]）"
 pontus_kingdom_missions_task_13:0 "米特里达梯的进攻"
 pontus_kingdom_missions_task_13_DESC:0 "战争的顺风吹动我们的船帆，推动我们的军队取得更大的胜利；前进吧，[ROOT.GetCountry.GetName]的军队！世界是我们可征服的！\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 pontus_kingdom_missions_task_13_tt:0 "获得对[GetProvince('(int32)1787').GetArea.GetName|Y]和[GetProvince('(int32)1791').GetArea.GetName|Y]地区的宣称。"
 pontus_kingdom_missions_task_14:0 "本都人的复仇"
 pontus_kingdom_missions_task_14_DESC:0 "如今我们已经拓展边境，让所有怀疑我们能否如传说凤凰般从灰烬中重生的反对者闭口无言。[ROOT.GetCountry.GetCapital.GetName]的城墙之内，必须作出一个将回荡于历史的重要抉择。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 pontus_kingdom_missions_task_14_tt:0 "决定我们应继续以本都王国前进，还是成为米特里达梯王国。"
 pontus_kingdom_missions_task_15:0 "前进之路"
 pontus_kingdom_missions_task_15_DESC:0 "智者说，无人能知晓众神反复无常的意志以及他们为我们准备了什么。虽然这睿智的观察或许正确，但我们的人民相信，前进之路将是繁荣的……\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 pontus_kingdom_missions_task_15_tt:0 "确定本都的前进之路……"
 pontus_kingdom_missions_task_16:0 "本都人的反击"
 pontus_kingdom_missions_task_16_DESC:0 "在[ROOT.GetCountry.GetName]各地，精英宅邸中都在进行令人不安的谈话：我们还真的是#Y 米底#!之民吗？也许拥抱新的身份才是前路……向所有愿意倾听的人宣告，我们自认是#Y 本都#!人。\n\n\n\n\n\n\n\n\n\n@persia_mil4!"
 pontus_kingdom_missions_task_16_tt:0 "放弃我们的[GetCulture('median').GetName|Y]道路，转而采纳[GetCulture('greco_pontic').GetName|Y]文化。"
 pontus_kingdom_missions_task_16_ttt:0 "[GetCulture('greco_pontic').GetName|Y]文化已被整合。"
 pontus_kingdom_missions_task_1_tt:0 "[GetCharacter('(int32)52').GetName]将与[GetCharacter('(int32)37').GetName]商议，试图提升[mission_country.GetName]的地位。"
 pontus_kingdom_missions_task_2:0 "安提柯王朝的进攻"
 pontus_kingdom_missions_task_2_tt:0 "随着[GetCharacter('(int32)52').GetName]的死亡，[GetProvince('(int32)245').GetName]对[GetCharacter('(int32)52').GetFamily.GetName]的人民不再安全，是时候前往更绿的牧场了……"
 pontus_kingdom_missions_task_3:0 "米底人的复仇"
 pontus_kingdom_missions_task_4:0 "新的希望"
 pontus_kingdom_missions_task_4_DESC:0 "当世界在我们周围燃起战火，我们人民的未来似乎充满疑虑，我们绝不屈服于恐惧——我们国家的希望寄托于我们的武力。\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 pontus_kingdom_missions_task_5:0 "新的道路"
 pontus_kingdom_missions_task_5_DESC:0 "我们当前的处境是众神抛弃我们的结果吗？我们的人民一直虔诚，但我们不禁注意到，我们的虔诚并未得到回报。或许我们应选择一个值得[ROOT.GetCountry.GetAdjective]崇拜的神系？\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 pontus_kingdom_missions_task_6:0 "本都觉醒"
 pontus_kingdom_missions_task_6_DESC:0 "让我们不要袖手旁观，看着邻国在这混乱时代争夺霸权；我们对敌人也有宣称，我们将不懈奋斗，直到打造一个名副其实的王国。\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 pontus_kingdom_missions_task_7:0 "黑海之珠"
 pontus_kingdom_missions_task_7_DESC:0 "想想[GetProvince('(int32)1812').GetName]这座城市，拥有繁忙的港口和俯瞰#E 黑海#!的壮丽景色；确实，它让[ROOT.GetCountry.GetRuler.GetName]想起了[GetProvince('(int32)245').GetName]。我们应将首都迁至安纳托利亚北部海岸，还是留在原地？需要做出重要决定。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 pontus_kingdom_missions_task_7_currenttt:0 "考虑将首都迁至[GetProvince('(int32)1812').GetName|Y]。"
 pontus_kingdom_missions_task_8:0 "米特里达梯贸易的回归"
 pontus_kingdom_missions_task_8_DESC:0 "由于我们北部海岸的众多港口，我们征收的税收和关税呈指数增长。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 pontus_kingdom_missions_task_8_tt:0 "$paphlagonia_inferior_area$和$machelonia_area$地区共有#Y [SCOPE.ScriptValue('pontus_ports_task_8_max')|0]#!个港口（当前：[SCOPE.ScriptValue('pontus_ports_task_8_current')|0Y]）"
 pontus_kingdom_missions_task_9:0 "保卫海岸"
 pontus_kingdom_missions_task_9_DESC:0 "我们决定必须通过沿海岸线建造一系列堡垒，保护我们的同胞免受海盗和野心勃勃的海军将领的侵害。这些要塞将是抵御任何试图剥夺我们财产者的第一道防线。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 pontus_kingdom_missions_task_9_tt:0 "$paphlagonia_superior_area$和$pontus_area$地区共有#Y [SCOPE.ScriptValue('pontus_forts_task_9_max')|0]#!个堡垒（当前：[SCOPE.ScriptValue('pontus_forts_task_9_current')|0Y]）"
 pontus_startup.1.a:0 "我们只能寄希望于最好的结果……"
 pontus_startup.1.desc:0 "[GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip]家族统治[GetProvince('(int32)245').GetNameWithNoTooltip]已有多年，而我们的人民从未经历过比今日更艰难的时刻。\n\n亚历山大死后，我们的王国落入[GetCharacter('(int32)37').GetNameWithNoTooltip]支配之下，而他如今正濒临败于其他所谓继业者之手。我们会沦为马其顿人棋局中的又一枚棋子，还是能在[GetCharacter('(int32)52').GetFamily.GetNameWithNoTooltip]诸王统治下重新繁荣？\n\n答案唯有时间能够揭晓。眼下，[GetCharacter('(int32)52').GetNameWithNoTooltip]决意确保基奥斯仍为独立之邦，并已带着一小队人前往[GetCharacter('(int32)37').GetNameWithNoTooltip]的宫廷，为我们的伟大城市据理力争。"
 pontus_startup.1.t:0 "基奥斯诸王"

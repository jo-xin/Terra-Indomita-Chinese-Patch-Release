 desc_gm_subject_army_cmod:0 "我们的军队已经训练了几个月，为眼前的冲突做好准备。"
 desc_gm_subject_building_pmod:0 "我们对我们的首都进行了大量的投资，因此我们的后代仍将从这些改进中受益。"
 desc_gm_subject_defensive_pmod:0 "我们已经做好准备，击退任何入侵者。"
 desc_gm_subject_diplo_reward_cmod:0 "我们被奴役的枷锁被释放，现在我们可以自由选择自己的命运。"
 desc_gm_subject_military_reward_cmod:0 "我们已经打破了奴役的枷锁，可以自由选择自己的命运。"
 desc_gm_subject_navy_cmod:0 "我们的海军已经建立起来，以保卫我们的海岸免受外国侵略者的侵扰。"
 desc_gm_subject_opinion_cmod:0 "我们因外交能力而闻名，我们的外交官在外国法院享有某些积极的偏见。"
 desc_gm_subject_reward_cmod:0 "在这个动荡的时代，我们需要小心任何试图打击的机会主义者。"
 desc_gm_subject_stability_cmod:0 "我们正准备重新获得独立。"
 desc_me_overlord_army_1_cmod:0 "我们在雇佣军中的声誉很差。那些仍然同意与我们合作的人对他们的服务收取高昂的价格。"
 desc_me_overlord_army_2_cmod:0 "一个重要的补给站被摧毁了。供应我们的部队和管理增援部队的工作受到了阻碍。"
 desc_me_overlord_defensiveness_pmod:0 "所有的通道和秘密走廊都已成为众所周知的事实。我们的防御系统的有效性已被严重削弱。"
 desc_me_overlord_food_pmod:0 "最近，粮食储备被烧毁了。市民们一直在囤积他们能找到的任何食物，而他们在空腹的情况下，工作效率会降低。"
 desc_me_overlord_navy_1_cmod:0 "我们的许多船只被破坏了，有几艘甚至被摧毁。重建和修复这一切需要一些时间。"
 desc_me_overlord_navy_2_cmod:0 "一个重要的船坞被破坏了。维护我们的舰队已经变得更加昂贵。"
 desc_me_overlord_to_war_cmod:0 "我们的臣民干脆宣布独立于我们。这损害了我们的权威和领导能力。"
 desc_me_subject_advisor_charmod:0 "这个人物在政府中被授予一个小顾问的职位。"
 desc_me_subject_exch_char_cmod:0 "我们的一个人被派往国外为外国政府服务。"
 desc_me_subject_extradition_cmod:0 "一个公民在没有任何保证或保护的情况下被移交给外国当局。"
 desc_visiting_foreign_citizen:0 "这个人物暂时在这个国家访问，很快就会回国。"

 gm_subject_army_cmod:0 "军队准备就绪"
 gm_subject_building_pmod:0 "繁荣的首都"
 gm_subject_defensive_pmod:0 "一个坚固的首都"
 gm_subject_diplo_reward_cmod:0 "释放的锁链"
 gm_subject_independence:0 "自由之路"
 gm_subject_independence_1:0 "关于独立的争论"
 gm_subject_independence_1.tt:0 "虽然每个人都希望独立，但在如何赢得我们的自由方面存在重大分歧。\n取决于你在这个过程中的决定，将采取外交或积极的方法。"
 gm_subject_independence_10a:0 "发出最后通牒"
 gm_subject_independence_10a.tt:0 "最后通牒发给[our_overlord.GetRuler.GetName]，我们等待他的决定。\n--如果导致战争，任何承诺支持的盟友都将加入我们，反对[our_overlord.GetName]。\n--如果我们的独立被批准，我们将获得与[our_overlord.GetName]的休战，他们将获得对我们领土的宣称。"
 gm_subject_independence_10a_DESC:0 "发出最后通牒!我们的宗主国必须在和平或流血之间做出选择。如果不心甘情愿，我们将为我们的自由而战。每个公民都准备为这个目标献出自己的生命。我们将获得自由，否则我们将死亡。"
 gm_subject_independence_10b:0 "发送提案"
 gm_subject_independence_10b.tt:0 "建议被发送给[our_overlord.GetRuler.GetName]，我们等待他的决定。\n--如果我们的请求被接受，我们将获得独立，如果可能的话，我们将获得与[our_overlord.GetName]的联盟。\n--如果我们的请求被拒绝，两个国家之间的关系将恶化，但我们仍将是一个附属国。另一条道路将成为独立的最后尝试。"
 gm_subject_independence_10b_DESC:0 "发送提案!我们要做的就是等待他们的答复，但经过我们的努力，毫无疑问，我们的宗主国会接受。"
 gm_subject_independence_11a:0 "军事胜利"
 gm_subject_independence_11a_DESC:0 "终于独立了!然而由于我们的行动，我们肯定会在未来几年看到这些行动的后果。让我们希望我们准备好面对即将到来的艰难困苦。"
 gm_subject_independence_11b:0 "外交胜利"
 gm_subject_independence_11b.allow:0 "[our_overlord.GetName]肯定接受了我们的提议。"
 gm_subject_independence_11b_DESC:0 "终于独立了。我们的前宗主已经给予我们所要求的。作为交换，我们建立了一个肯定会持续几十年的联盟。在未来的岁月里，对彼此的信任将被证明是极其宝贵的。"
 gm_subject_independence_11c:0 "背后的匕首"
 gm_subject_independence_11c.allow:0 "[our_overlord.GetName]一定是拒绝了我们的提议。"
 gm_subject_independence_11c_DESC:0 "难以想象的事情发生了。我们的宗主国已经拒绝了我们的独立建议。许多人对这个结果感到失望，因为没有人预料到这个结果。我们以后该怎么办？"
 gm_subject_independence_12c:0 "潜入他们的首都"
 gm_subject_independence_12c_DESC:0 "我们将派一名特工进入他们的首都，探寻破坏的机会。这必须保密，因为我们不想让我们的宗主国知道我们还在寻求获得独立。"
 gm_subject_independence_13c:0 "阻碍他们的军队"
 gm_subject_independence_13c_DESC:0 "我们的一名特工将调查他们的军事活动，如果有任何我们可以利用的机会，将立即告诉我们。"
 gm_subject_independence_14c:0 "破坏他们的海军"
 gm_subject_independence_14c_DESC:0 "监视他们的海军和船坞是找到他们海军活动薄弱点的一个好办法。我们派去做这件事的人，必须非常小心。"
 gm_subject_independence_15c:0 "贿赂官员"
 gm_subject_independence_15c_DESC:0 "他们政府的一名成员将成为目标。我们将尝试动摇他对我们事业的支持。如果可能的话，甚至可以说服他们加入我们这边。"
 gm_subject_independence_16c:0 "邪恶的活动"
 gm_subject_independence_16c_DESC:0 "在我们宗主国里有几个关键人物。干掉他们会引起巨大的动荡，并有利于我们的目的。我们必须追求这一点。"
 gm_subject_independence_17c:0 "引起动乱"
 gm_subject_independence_17c.tt:0 "一群强盗会不断地袭击[our_overlord.GetName]，并零星地归还他们成功的战利品。"
 gm_subject_independence_17c_DESC:0 "强盗和土匪不是新闻。他们一直在各地出现。我们将从我们的预备队中派出一些人，冒充这样的队伍，让他们扰乱他们的首都省份的乡村地区。他们获得的任何战利品，都会增加我们的库房。"
 gm_subject_independence_18c:0 "联系同胞"
 gm_subject_independence_18c.allow:0 "你的宗主必须有其他的附属国。"
 gm_subject_independence_18c_DESC:0 "还有一些像我们一样的人，被我们的宗主国束缚在臣民的地位上。我们必须尝试说服他们在时机成熟时加入我们。没有基础，塔就会倒下。"
 gm_subject_independence_19c:0 "宣布独立"
 gm_subject_independence_19c.allow:0 "在宣布独立之前，你需要做至少4个任务。"
 gm_subject_independence_19c_DESC:0 "是时候让我们摆脱这种臣民地位了。我们将选择自己的道路。拒绝我们的提议是一个严重的错误，我们的宗主国将永远不会忘记。他们的国家被削弱了，他们现在能做什么来反对我们的独立？"
 gm_subject_independence_1_DESC:0 "获得独立是所有人都能同意的事情。然而，主要的争论是在细节方面。我们需要就如何处理这个看似难以逾越的任务达成共识。"
 gm_subject_independence_2a:0 "尝试造反"
 gm_subject_independence_2a.tt:0 "从这里开始，你就没有退路了......"
 gm_subject_independence_2a_DESC:0 "没有任何和平或外交的方式可以满足我们的愿望。只有恐吓和咄咄逼人的姿态才能让我们达到目的。如果有必要，我们将为之战斗或牺牲。"
 gm_subject_independence_2b:0 "尝试外交"
 gm_subject_independence_2b.tt:0 "从这里开始，你就没有退路了......"
 gm_subject_independence_2b_DESC:0 "我们将试图动摇我们的宗主国，并通过谈判达成互利的协议，使我们获得独立。外交手段将占上风。"
 gm_subject_independence_3a:0 "建立防卫"
 gm_subject_independence_3a_DESC:0 "我们的首都必须为任何敌人的围攻做好准备。花费一些时间和资源来改善我们的本地防御将保证我们的公民在里面的安全。"
 gm_subject_independence_3b:0 "建立关系"
 gm_subject_independence_3b_DESC:0 "增进与我们宗主的关系是我们尝试成功的关键。如果我们的提议要有任何机会，他们必须首先愿意听从我们的提议。"
 gm_subject_independence_4a:0 "操练军队"
 gm_subject_independence_4a_DESC:0 "军队的日子已经不好过了。我们必须确保它准备好应对一切。"
 gm_subject_independence_4b:0 "交换人物"
 gm_subject_independence_4b.tt:0 "你将可以把一个人物送到[our_overlord.GetName]，以换取关系的改善。"
 gm_subject_independence_4b_DESC:0 "自从我们有记忆以来，交换值得注意的人一直是历史的一部分。我们将选择一个志愿者去我们宗主的国家生活。如果幸运的话，他们也会派人来。"
 gm_subject_independence_5a:0 "确保支持"
 gm_subject_independence_5a_DESC:0 "我们必须确保各大家族的忠诚度。我们国家的命运经常被这些人的奇思妙想所左右。确保他们的支持是一个优先事项。"
 gm_subject_independence_5b:0 "首都改善"
 gm_subject_independence_5b_DESC:0 "我们的首都是我们社会的闪亮灯塔。我们必须把它建设好，以反映我们自己所能达到的伟大程度。"
 gm_subject_independence_6a:0 "寻求盟友"
 gm_subject_independence_6a.allow:0 "必须有一个[our_overlord.GetRankName]国家不是[our_overlord.GetName]的盟友。"
 gm_subject_independence_6a.tt:0 "我们将请求其他国家支持我们的事业。"
 gm_subject_independence_6a_DESC:0 "我们的宗主国有很多对手，我们必须向他们寻求帮助。他们中的一些人肯定会在我们需要的时候承诺给予支持。"
 gm_subject_independence_6b:0 "政治礼物"
 gm_subject_independence_6b.allow:0 "你们政府中的大多数职位都必须被填补。"
 gm_subject_independence_6b.tt:0 "你可以向[our_overlord.GetName]提供黄金、人力等以换取关系的改善。"
 gm_subject_independence_6b_DESC:0 "可以通过礼物来动摇我们的宗主国。我们将要求政府中的成员为更大的利益提供这些礼物。"
 gm_subject_independence_7a:0 "求助于人"
 gm_subject_independence_7a.allow:0 "你必须填补你的政府中的宗教职位。"
 gm_subject_independence_7a.tt:0 "我们将向我们国家和国外的几个人物索取黄金、人力、政治影响和宗教支持。"
 gm_subject_independence_7a_DESC:0 "在准备最后通牒的过程中，我们的资源损失很大。我们将求助于我们的政府成员，要求他们为更大的利益提供特别的帮助。"
 gm_subject_independence_7b:0 "个人贿赂"
 gm_subject_independence_7b_DESC:0 "谁不欣赏黄金？我们将提供一份个人礼物来动摇他们的统治者本人。"
 gm_subject_independence_8a:0 "建立一支海军"
 gm_subject_independence_8a.allow:0 "你需要拥有与[our_overlord.GetName]相等或更多的船只，或者拥有超过#Y 20#! 艘船只。"
 gm_subject_independence_8a.allow_2:0 "你需要一个有港口的沿海省份。"
 gm_subject_independence_8a_DESC:0 "我们的海军无法与今天的标准相提并论。我们必须花时间和精力来改善和增加我们的舰队。"
 gm_subject_independence_8b:0 "友好的姿态"
 gm_subject_independence_8b_DESC:0 "与他们的统治者交好将提供一个独特的机会，与将作出决定的人直接沟通。实现这一点将使我们受益匪浅。"
 gm_subject_independence_9a:0 "做好最后的准备工作"
 gm_subject_independence_9a.allow:0 "在开始之前，你需要做至少3个任务。"
 gm_subject_independence_9a.tt:0 "我们将处理任何最后的准备工作，并起草我们的最后通牒给我们的宗主国。\n任何在过去被轻视的角色都会在最后一刻提出一些抗议..."
 gm_subject_independence_9a_DESC:0 "我们就快到了。现在是我们向宗主发出最后通牒前做最后准备的时候了。希望这将尽可能顺利地进行，但也有一些心怀不满的人可能会造成一些麻烦。"
 gm_subject_independence_9b:0 "起草协议"
 gm_subject_independence_9b.allow:0 "在开始之前，你需要做至少3个任务。"
 gm_subject_independence_9b.tt:0 "我们将处理任何最后的准备工作，并起草我们的提案给我们的宗主国。\n任何在过去被轻视的角色都会在最后一刻提出抗议......"
 gm_subject_independence_9b_DESC:0 "现在是时候了。我们将准备授予我们独立的合同。许多人为了达到这一点付出了很多，甚至可能有一些心怀不满的人可能会挑起一些麻烦。"
 gm_subject_independence_BUTTON_TOOLTIP:0 "我们必须以任何必要的手段结束我们的臣民地位。"
 gm_subject_independence_CRITERIA_DESCRIPTION:0 "这个任务树将提供关于如何追求独立之路和结束我们的臣民地位的选择。"
 gm_subject_independence_DESCRIPTION:0 "我们的宗主国想让我们永远成为他们的忠实臣民，否则可能会把我们的土地据为己有。不满的抱怨声越来越多，独立运动正在我们的王国里慢慢形成。如果我们想摆脱屈服，精明的外交和大胆的行动是必要的。"
 gm_subject_independence_REWARD_DESCRIPTION:0 "你将通过你选择的道路获得独立。"
 gm_subject_military_reward_cmod:0 "枷锁断裂"
 gm_subject_navy_cmod:0 "海军准备就绪"
 gm_subject_opinion_cmod:0 "友好关系"
 gm_subject_reward_cmod:0 "最后的自由"
 gm_subject_stability_cmod:0 "通往自由之路"
 kidnapped_loyalty:0 "被绑架"
 manpower_big_gift_pos_opmod:0 "在需要时提供支持"
 manpower_gift_neg_opmod:0 "在需要的时候转身离开"
 manpower_gift_pos_opmod:0 "需要时的支持"
 me_overlord_army_1_cmod:0 "声誉不佳"
 me_overlord_army_2_cmod:0 "供应中断"
 me_overlord_defensiveness_pmod:0 "渗透的首都"
 me_overlord_food_pmod:0 "烧毁我们的粮食供应"
 me_overlord_navy_1_cmod:0 "破碎的海军"
 me_overlord_navy_2_cmod:0 "船坞被破坏"
 me_overlord_to_war_cmod:0 "破碎和背叛"
 me_subject_advisor_charmod:0 "一个小顾问"
 me_subject_exch_char_cmod:0 "人物交流"
 me_subject_extradition_cmod:0 "被引渡的公民"
 me_subject_independence.1.a:0 "我们需要认真考虑所有选项。"
 me_subject_independence.1.at:0 "这两种方法都将被讨论。\n取决于这个过程中做出的决定，在前进的过程中，一条路比另一条路更难。"
 me_subject_independence.1.desc:0 "我们国家的民意是明确的：再次成为一个独立的国家是我们的命运。然而，我们如何去做是一个有争议的话题，导致了我们政府的两极化讨论。在采取任何可怕的行动之前，我们必须首先就我们必须采取的道路达成一致。\n\n一种方法是确保足够的资源，以便恐吓[our_overlord.GetName]释放我们。[random_left_advisor.GetName]已经作为这一派别的领导人物站了出来。然而，由于这将导致严重的侵略姿态，任何失败的恐吓尝试肯定会导致战争。\n\n其他人认为外交途径，即我们与[our_overlord.GetName]展开对话，试图达成对两国都有利的解决方案。[random_right_advisor.GetName]看起来是这一派系的首领。但是，如果[our_overlord.GetName]拒绝了我们的提议，那么我们应该怎么做？"
 me_subject_independence.1.t:0 "$gm_subject_independence_1$:分歧的方法"
 me_subject_independence.10.a:0 "恐吓是前进的方向。"
 me_subject_independence.10.at:0 "已经达成共识，军国主义派系对我们国家最有利。挑选其他选项会有后果......"
 me_subject_independence.10.desc:0 "最后，达成了共识。经过几个月的辩论，大家都权衡了自己的意见和利益。现在，几乎所有人都能同意在我们争取独立的努力中采取的理想立场。看起来[random_left_advisor.GetName]已经胜出了。大众的意见现在倾向于一种#Y 侵略性#! 的做法。\n仍有一些人对此不满意。[random_right_advisor.GetName]听到这个消息后，有人看到他生闷气，冲了出去。他不会很快忘记这件事。"
 me_subject_independence.10.t:0 "$gm_subject_independence_1$。共识"
 me_subject_independence.100.a:0 "措辞必须准确。"
 me_subject_independence.100.desc:0 "这一刻已经到来。最后，我们已经接近这整个磨难的终点。剩下的事情就是决定给[our_overlord.GetName]的建议的措辞。之后，我们只能希望[our_overlord.GetRuler.GetName]会明白事理，满足我们的迫切愿望。"
 me_subject_independence.100.t:0 "$gm_subject_independence_9b$"
 me_subject_independence.102.a:0 "把他从这里带走。"
 me_subject_independence.102.at:0 "不会失去任何进展。"
 me_subject_independence.102.b:0 "别管他了。"
 me_subject_independence.102.bt:0 "你已经取得的一些进展将会失去。宗主会更不可能放弃你。"
 me_subject_independence.102.desc:0 "[selected_spurned_character.GetName]在任何公共活动中一提到我们的做法，就大肆讽刺。这些批评对我们政府的看法有很大影响。我们需要控制这种损害。"
 me_subject_independence.102.t:0 "$gm_subject_independence_9b$。犬儒主义"
 me_subject_independence.103.a:0 "把他买下来吧。"
 me_subject_independence.103.at:0 "没有进展就没有损失。"
 me_subject_independence.103.b:0 "现在已经太晚了。"
 me_subject_independence.103.bt:0 "你已经取得的一些进展将会失去。宗主会更不可能放弃你。"
 me_subject_independence.103.desc:0 "你发现[selected_spurned_character.GetName]在镇上的广场上对一大群市民积极发表反对现行政策的言论。他声音中的侮辱性语气清楚地表明了他对当前政府的漠视程度。他的反叛言论不利于我们的事业，肯定会损害我们精心打造的形象。"
 me_subject_independence.103.t:0 "$gm_subject_independence_9b$: 侮辱性的话语"
 me_subject_independence.104.a:0 "把他交出来吧。"
 me_subject_independence.104.at:0 "没有任何进展。"
 me_subject_independence.104.b:0 "他仍然是一个[unwilling_subject.GetAdjective]公民。"
 me_subject_independence.104.bt:0 "你已经取得的一些进展将会失去。宗主会更不可能放弃你。"
 me_subject_independence.104.desc:0 "一场悲剧发生了。[selected_spurned_character.GetName]曾试图在[our_overlord.GetRuler.GetFamily.GetName]家族中进行暗杀。这一行动是由情感推理指导的。目前还不清楚[selected_spurned_character.GetFirstName]希望从中得到什么。幸运的是，[selected_spurned_character.GetSheHe]失败了，[wounded_char.GetName]只受了轻伤。不出所料，[our_overlord.GetRuler.GetName]对此完全愤怒，要求将[selected_spurned_character.GetFirstName]引渡给[our_overlord.GetAdjective]关押。我们要交出一个自己人吗？"
 me_subject_independence.104.t:0 "$gm_subject_independence_9b$。误导的行动"
 me_subject_independence.105.a:0 "我们已经准备好了。"
 me_subject_independence.105.desc:0 "书面提案已经完成。我们相信这是一个公平的交易，[our_overlord.GetName]会毫不犹豫地同意。我们所要做的，就是派我们的外交官过去。"
 me_subject_independence.105.t:0 "$gm_subject_independence_9b$。收尾工作"
 me_subject_independence.11.a:0 "外交是前进的道路。"
 me_subject_independence.11.at:0 "已经达成共识，外交派系对我们国家最有利。挑选其他选项会有后果......"
 me_subject_independence.11.desc:0 "最后，共识已经达成。经过几个月的辩论，每个人都权衡了自己的意见和利益。现在，几乎所有人都同意在我们争取独立的努力中采取理想的立场。看起来[random_right_advisor.GetName]已经胜出了。大众的意见现在倾向于#Y 外交#! 方针。\n仍有一些人对此不满意。[random_left_advisor.GetName]听到这个消息后，有人看到他生闷气，冲了出去。他不会很快忘记这件事。"
 me_subject_independence.11.t:0 "$gm_subject_independence_1$。共识"
 me_subject_independence.110.a:0 "让我们寄希望于最好的结果。"
 me_subject_independence.110.at:0 "我们等待着他们的答复..."
 me_subject_independence.110.desc:0 "我们已经派外交官带着我们的建议去了[our_overlord.GetName]，但这不过是一种形式而已。这几乎可以保证他们会批准。"
 me_subject_independence.110.t:0 "$gm_subject_independence_10b$"
 me_subject_independence.111.a:0 "这是最好的行动方案。"
 me_subject_independence.111.at:0 "[unwilling_subject.GetName]将获得独立。\n我们也将获得与他们的联盟。"
 me_subject_independence.111.b:0 "我们不能同意这一点。"
 me_subject_independence.111.bt:0 "[unwilling_subject.GetName]不会获得独立。\n这将使两国的关系紧张。"
 me_subject_independence.111.desc:0 "我们的附属国[unwilling_subject.GetName]已经派来了他们的外交官，提出了一个建议。我们将不得不给予他们独立，但我们将继续合作，使我们双方受益。他们向我们保证将建立密切的外交关系，以保证两国的最佳命运。我们怎么说呢？"
 me_subject_independence.111.t:0 "一个独立的案例"
 me_subject_independence.112.a:0 "赞美诸神!"
 me_subject_independence.112.at:0 "我们从以前的宗主那里获得了独立。\n[our_overlord.GetName]将成为我们的盟友。"
 me_subject_independence.112.desc:0 "成功![our_overlord.GetName]已经看到了我们建议的好处。他们已经给予我们独立，并同意两国结盟。我们将在未来几年内继续加强彼此的关系。"
 me_subject_independence.112.t:0 "$gm_subject_independence_10b$：独立"
 me_subject_independence.113.a:0 "他们会对这个决定感到后悔。"
 me_subject_independence.113.at:0 "我们并没有从我们的宗主国那里获得独立。一条替代的道路将变得可用，对自由进行最后的尝试。"
 me_subject_independence.113.desc:0 "我们的外交官在[our_overlord.GetName]被嘲笑了。看来他们从未认真对待我们的信念，嘲笑我们请求独立的徒劳尝试。现状依然存在..."
 me_subject_independence.113.t:0 "$gm_subject_independence_10b$。请求被拒绝"
 me_subject_independence.115.a:0 "笔比剑更有力量。"
 me_subject_independence.115.desc:0 "我们的外交方式已经得到了回报。所有的反对者都被证明是错误的，我们因此而更加强大。沟通和外交已经成为我们外交政策的主要内容。我们掌握着自己的命运"
 me_subject_independence.115.t:0 "$gm_subject_independence_11b$"
 me_subject_independence.12.a:0 "这个决定是我的，也是我一个人的。"
 me_subject_independence.12.at:0 "还没有达成共识。你可以打破平局，自由选择任何一个选项。"
 me_subject_independence.12.desc:0 "在我们社会的重要成员之间经过几个月的辩论，没有达成共识。[random_left_advisor.GetName]和[random_right_advisor.GetName]在这个问题上成功地分化了我们的顾问和普通民众。我将不得不切断联系并作出选择。无论我选什么，都会有人不高兴......"
 me_subject_independence.12.t:0 "$gm_subject_independence_1$: 僵局"
 me_subject_independence.120.a:0 "我们必须找到另一种方式。"
 me_subject_independence.120.at:0 "你要努力寻找另一种选择。"
 me_subject_independence.120.desc:0 "[our_overlord.GetName]拒绝给予我们独立，这令人深感沮丧。我们的人民感到被这一冷酷回应所背叛。对自由的渴望不仅未曾消退，更已点燃全体公民的怒火。在这股炽热激情转向针对我们之前，必须采取行动。"
 me_subject_independence.120.t:0 "$gm_subject_independence_11c$。出乎意料的结果"
 me_subject_independence.121.a:0 "他们将不得不学会与之相处。"
 me_subject_independence.121.at:0 "你的对象可能仍会试图以不太光彩的方式获得他们的独立。"
 me_subject_independence.121.desc:0 "[unwilling_subject.GetName]显然对我们的回答不满意。他们的外交官在我们告诉他们时，履行了所有必要的职业礼节，但显然他们是怀着沉重的心情这样做的。希望这将是他们愚蠢的独立愿望的终结。"
 me_subject_independence.121.t:0 "一个失望的[unwilling_subject.GetName]"
 me_subject_independence.122.a:0 "让我们讨论一下我们的选择。"
 me_subject_independence.122.desc:0 "[random_right_advisor.GetName]要求与你会面。在这次会面中，他对自己支持失败的外交尝试表示遗憾。作为该方法的主要支持者，[our_overlord.GetName]的严词拒绝对他来说是最刺耳的。讨论转向了获得我们独立的其他方式。"
 me_subject_independence.122.t:0 "$gm_subject_independence_11c$。[random_right_advisor.GetFirstName]接近"
 me_subject_independence.123.a:0 "他们永远不会看到它的到来。"
 me_subject_independence.123.at:0 "你将开始破坏[our_overlord.GetName]，迫使他们处于不利地位。"
 me_subject_independence.123.desc:0 "经过与[random_right_advisor.GetName]的长时间讨论，你们两个人同意，只有通过更阴暗的手段才能确定独立。[random_right_advisor.GetFirstName]有一些想法，如何阻挠[our_overlord.GetName]的正常运作，这样一旦我们简单地宣布独立，他们将无法阻止我们。"
 me_subject_independence.123.t:0 "$gm_subject_independence_11c$: 潜规则"
 me_subject_independence.13.a:0 "诸神眷顾勇敢的人。"
 me_subject_independence.13.at:0 "你的上司已经通知你要走这条路。现在已经没有回头路了..."
 me_subject_independence.13.desc:0 "我们将赢得我们的独立，如果有必要，就用剑来赢得。我们必须开始为不可避免的报复作准备。"
 me_subject_independence.13.t:0 "$gm_subject_independence_2a$"
 me_subject_independence.130.a:0 "[potential_infiltrator_1.GetFirstName]是这项工作的最佳人选。"
 me_subject_independence.130.at:0 "[potential_infiltrator_1.GetName]将移动到[our_overlord.GetName]并开始潜入[our_overlord.GetCapital.GetName]。\n高@oratory_icon!魅力和@civic_icon!精细加上#G 谨慎#!、#G 狡猾#! 和#G 不引人注意#! 的特征将减少被发现的机会。\n低@oratory_icon!魅力和@civic_icon!技巧，加上#R 轻率#!、#R 狡猾#! 和#R 突出#! 的特质，会增加被发现的机会。"
 me_subject_independence.130.b:0 "我们应该考虑派遣[potential_infiltrator_2.GetFirstName]。"
 me_subject_independence.130.bt:0 "[potential_infiltrator_2.GetName]将移动到[our_overlord.GetName]并开始潜入[our_overlord.GetCapital.GetName]。\n高@oratory_icon!魅力和@civic_icon!技巧，加上#G 谨慎#!、#G 狡猾#! 和#G 不引人注意#! 的特征，将减少被发现的机会。\n低的@oratory_icon!魅力和@civic_icon!技巧，加上#R 轻率#!、#R 狡猾#! 和#R 突出#! 的特质，会增加被发现的机会。"
 me_subject_independence.130.c:0 "也许，[potential_infiltrator_3.GetFirstName]将是最佳选择。"
 me_subject_independence.130.ct:0 "[potential_infiltrator_3.GetName]将移动到[our_overlord.GetName]并开始潜入[our_overlord.GetCapital.GetName]。\n高@oratory_icon!魅力和@civic_icon!精细加上#G 谨慎#!、#G 狡猾#! 和#G 不引人注意#! 的特征将减少被发现的机会。\n低的@oratory_icon!魅力和@civic_icon!技巧，加上#R 轻率#!、#R 狡猾#! 和#R 突出#! 的特质，会增加被发现的机会。"
 me_subject_independence.130.desc:0 "渗透到[our_overlord.GetAdjective]的首都符合我们的利益。我们需要有人在那里寻找任何机会来扰乱[our_overlord.GetCapital.GetName]的日常生活。然而，我们必须保持警惕，无论我们决定派谁去，都可能被抓，甚至更糟。我们需要选择一个足够细致的人，以避免这种命运，同时提供尽可能多的选择。"
 me_subject_independence.130.t:0 "$gm_subject_independence_12c$"
 me_subject_independence.131.a:0 "让[selected_infiltrator.GetHerHim]得到[selected_infiltrator.GetSheHe]需要的任何东西。"
 me_subject_independence.131.at:0 "没有机会让[our_overlord.GetName]发现我们的特工。"
 me_subject_independence.131.b:0 "猜测[selected_infiltrator.GetSheHe]将不得不作出回应。"
 me_subject_independence.131.bt:0 "有很小的机会让[our_overlord.GetName]发现我们的特工。"
 me_subject_independence.131.desc:0 "[selected_infiltrator.GetName]已经发出通知，可以绘制出城市和她的防御系统。然而[selected_infiltrator.GetFirstName]要求提供一些额外的资源，以避免引起[our_overlord.GetAdjective]当局的怀疑。目前还没有发生什么严重的事情，但谨慎的做法是保证[selected_infiltrator.GetHerHim]在整个[our_overlord.GetCapital.GetName]的行动。"
 me_subject_independence.131.t:0 "$gm_subject_independence_12c$:绘制他们的防卫图"
 me_subject_independence.132.a:0 "我们可以拿出一点钱来。"
 me_subject_independence.132.at:0 "[our_overlord.GetName]发现我们的代理人的可能性很小。"
 me_subject_independence.132.b:0 "很明显，他们是想骗我们。"
 me_subject_independence.132.bt:0 "[our_overlord.GetName]发现我们的代理人的可能性是中等的。"
 me_subject_independence.132.desc:0 "我们收到了[selected_infiltrator.GetName]的信件，他是我们在[our_overlord.GetCapital.GetName]的潜入者。看起来，[selected_infiltrator.GetSheHe]已经与一些当地人取得了联系，他们愿意协助破坏当地的粮食仓库。为了使准备工作尽可能不受影响，当地人要求提供一些资金。[selected_infiltrator.GetFirstName]提到，[selected_infiltrator.GetSheHe]不确定这是否真的有必要，或者他们是否想利用这种情况。无论如何，最好能保证他们对帮助我们的兴趣。"
 me_subject_independence.132.t:0 "$gm_subject_independence_12c$：烧毁食品供应"
 me_subject_independence.133.a:0 "派遣一些志愿者。"
 me_subject_independence.133.at:0 "[our_overlord.GetName]发现我们的代理人的可能性是中等的。"
 me_subject_independence.133.b:0 "我们不能派人去。"
 me_subject_independence.133.bt:0 "有很大的机会被[our_overlord.GetName]发现我们的特工。"
 me_subject_independence.133.desc:0 "来自[selected_infiltrator.GetName]的另一封信件已经到达。据[selected_infiltrator.GetHerHim]说，当地的奴隶人口在最近受到了异常的虐待，很容易发生起义。很明显，[selected_infiltrator.GetFirstName]对这个机会非常兴奋，[selected_infiltrator.GetSheHe]要求一些人力来帮助。因此，当时机到来时，解放这些奴隶的工作可以尽可能顺利地进行。如果没有多余的人手，这仍然是一个选择，然而在这个计划执行之前，怀疑可能更容易落在[selected_infiltrator.GetHerHim]身上。"
 me_subject_independence.133.t:0 "$gm_subject_independence_12c$: 煽动奴隶骚乱"
 me_subject_independence.134.a:0 "奴隶的叛乱对我们最有利。"
 me_subject_independence.134.b:0 "没有食物，他们肯定会挣扎。"
 me_subject_independence.134.c:0 "最好的办法是为武装冲突做准备。"
 me_subject_independence.134.d:0 "我们不能冒这个险。拉[selected_infiltrator.GetHerHim]出来。"
 me_subject_independence.134.desc:0 "[selected_infiltrator.GetName]已经在[our_overlord.GetCapital.GetName]呆了几个月了。在这段时间里，[selected_infiltrator.GetSheHe]设法为我们创造了一些可以采取的选择。现在是时候决定哪种行动最符合我们的利益了。"
 me_subject_independence.134.desc_1:0 "\n\n在过去几周的某个地方，[selected_infiltrator.GetFirstName]被[our_overlord.GetAdjective]当局注意到了。他们对[selected_infiltrator.GetHerHim]产生了怀疑，因此，[selected_infiltrator.GetSheHe]无法进行任何其他询问或准备。由于这个不幸的事实，我们现在让[selected_infiltrator.GetHerHim]做的任何有罪的行为都保证会导致[selected_infiltrator.GetHerHis]被捕。那时[selected_infiltrator.GetFirstName]会怎么样，我们不能说。我们该如何决定？"
 me_subject_independence.134.desc_2:0 "\n\n当[selected_infiltrator.GetHerHis]位于[our_overlord.GetAdjective]首都期间，没有人不会死盯着[selected_infiltrator.GetHerHis]的一言一行。但我们只能假设[selected_infiltrator.GetHerHim]进行的任何犯罪行动都还不会危及到[selected_infiltrator.GetHerHis]安全。我们该如何决定呢？"
 me_subject_independence.134.t:0 "$gm_subject_independence_12c$：行动时间"
 me_subject_independence.135.a:0 "密切关注[selected_infiltrator.GetHerHim]..."
 me_subject_independence.135.desc:0 "在[our_overlord.GetCapital.GetName]的一些警卫发现[selected_infiltrator.GetName]的行为相当可疑。他们目睹了[selected_infiltrator.GetHerHim]与已知的激进分子会面。这可能是更大事件的征兆，也可能根本没有什么。在任何情况下，对[selected_infiltrator.GetHerHim]进行监视是谨慎的。如果[selected_infiltrator.GetFirstName]做了任何有罪的事情，我们就可以扑上去逮捕他。"
 me_subject_independence.135.t:0 "可疑的行为"
 me_subject_independence.136.a:0 "砍掉[selected_infiltrator.GetHerHis]的头!"
 me_subject_independence.136.b:0 "监禁[selected_infiltrator.GetHerHim]。"
 me_subject_independence.136.c:0 "放走[selected_infiltrator.GetHerHim]。"
 me_subject_independence.136.desc:0 "看起来我们对[selected_infiltrator.GetName]的怀疑是有根据的。最近事件的目击者认为[selected_infiltrator.GetHerHim]是主要煽动者之一。"
 me_subject_independence.136.desc_0:0 " 逮捕工作很顺利，现在只剩下决定如何处理[selected_infiltrator.GetHerHim]了。"
 me_subject_independence.136.desc_2:0 "\n[selected_infiltrator.GetFirstName]把第一把火炬放到了我们的粮库，如果证词可信的话。"
 me_subject_independence.136.desc_3:0 "\n[selected_infiltrator.GetFirstName]被抓获，将我国首都的防御计划送走。不幸的是，我们不知道去哪里，而且[selected_infiltrator.GetSheHe]拒绝告诉我们。"
 me_subject_independence.136.t:0 "破坏活动"
 me_subject_independence.137.a:0 "我们永远不会知道可能发生了什么。"
 me_subject_independence.137.desc:0 "看来我们对[selected_infiltrator.GetName]的怀疑是没有必要的。在没有发生任何事件的情况下，[selected_infiltrator.GetSheHe]回到了[selected_infiltrator.GetHerHis]回家的路上。"
 me_subject_independence.137.t:0 "可疑人物离开"
 me_subject_independence.138.a:0 "[selected_infiltrator.GetFirstName]将被错过。"
 me_subject_independence.138.b:0 "这本可以更糟糕。"
 me_subject_independence.138.c:0 "多么令人欣慰。"
 me_subject_independence.138.desc_1:0 "我们收到消息，我们的特工被[our_overlord.GetAdjective]当局抓获。不幸的是，[selected_infiltrator.GetName]在那之后不久就遇到了[selected_infiltrator.GetHerHis]的结局。[our_overlord.GetRuler.GetName]决定，处决是[selected_infiltrator.GetHerHis]的命运。幸运的是，我们的参与没有被揭露。就[our_overlord.GetName]而言，这只是一个人的行为。"
 me_subject_independence.138.desc_2:0 "我们收到消息，我们的特工被[our_overlord.GetAdjective]当局抓获。[our_overlord.GetRuler.GetName]决定，监禁是[selected_infiltrator.GetHerHis]的命运。幸运的是，我们的参与没有被揭露。就[our_overlord.GetName]而言，这只是一个人的行为。"
 me_subject_independence.138.desc_3:0 "我们收到消息，我们的特工被[our_overlord.GetAdjective]当局抓获。幸运的是，[selected_infiltrator.GetName]在那之后不久就被释放了。显然，[our_overlord.GetRuler.GetName]决定，没有足够的证据将[selected_infiltrator.GetFirstName]判处[selected_infiltrator.GetHerHis]命运。[our_overlord.GetName]似乎毫不知情。"
 me_subject_independence.138.t:0 "[selected_infiltrator.GetName]的命运"
 me_subject_independence.139.a:0 "愿众神帮助我们。"
 me_subject_independence.139.desc_1:0 "[our_overlord.GetCapital.GetName]的奴隶们获得了解放，并拿起武器反对我们。他们现在正在围攻这座城市。我们必须迅速采取行动!"
 me_subject_independence.139.desc_2:0 "昨天晚上，食品仓库被烧毁。我们失去了这么多月的养料。民众已经开始恐慌，并试图在家中储存尽可能多的食物，为即将到来的绝境做准备。要从这场灾难中恢复过来，需要一些时间。"
 me_subject_independence.139.desc_3:0 "我们收到消息，[our_overlord.GetCapital.GetName]的防御系统已经被绘制出来。显然，连所有的秘密通道和门都在那张地图上。谁知道它现在在哪里。如果我们在未来几年被围困，这肯定会伤害我们。"
 me_subject_independence.139.t:0 "灾难降临到[our_overlord.GetCapital.GetName]身上"
 me_subject_independence.14.a:0 "密切关注此事。"
 me_subject_independence.14.at:0 "你的对象正计划以#Y 攻击性#! 的方式获得他们的独立。"
 me_subject_independence.14.desc:0 "我们收到消息说，我们的一个臣民一直在吵着要独立的荒唐主张。目前情况似乎得到了控制，但麻烦可能正在酝酿。"
 me_subject_independence.14.t:0 "麻烦在蠢蠢欲动"
 me_subject_independence.145.a:0 "[potential_infiltrator_1.GetFirstName]是这项工作的最佳人选。"
 me_subject_independence.145.at:0 "[potential_infiltrator_1.GetName]将移动到[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!武功加上#G 明智#!、#G 自信#! 和#G 精明#! 的特质会减少被发现的机会。\n低@military_icon!武功加上#R 轻率#!、#R 战术不灵活#! 和#R 愚蠢#! 的特质会增加被发现的机会。"
 me_subject_independence.145.b:0 "我们应该考虑派遣[potential_infiltrator_2.GetFirstName]。"
 me_subject_independence.145.bt:0 "[potential_infiltrator_2.GetName]将移动到[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!的武功加上#G 明智#!、#G 自信#! 和#G 精明#! 的特征会减少被发现的机会。\n低@military_icon!的武功加上#R 轻率#!、#R 战术不灵活#! 和#R 愚蠢#! 的特征会增加被发现的机会。"
 me_subject_independence.145.c:0 "也许，[potential_infiltrator_3.GetFirstName]将是最佳选择。"
 me_subject_independence.145.ct:0 "[potential_infiltrator_3.GetName]将会去[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!军事能力与诸如#G 明智#!，#G 自信#!和#G 精明#!的特质会降低被发现的可能性。\n低@military_icon!军事能力与诸如#R 莽撞#!，#R 战术古板#!和#R 愚蠢#!的特质会提高被发现的可能性。"
 me_subject_independence.145.desc:0 "一旦我们宣布独立，[our_overlord.GetAdjective]军队可能会成为我们的眼中钉肉中刺。试图遏制他们的潜在力量是明智的。我们应该派人去监视[our_overlord.GetName]的军事活动。然而，无论我们决定派谁去，都应该保持警惕，因为他可能会被抓，甚至更糟。我们需要选择一个足够细致的人，以避免这种命运，同时提供尽可能多的选择。"
 me_subject_independence.145.t:0 "$gm_subject_independence_13c$"
 me_subject_independence.146.a:0 "给[selected_infiltrator.GetHerHim]的人。"
 me_subject_independence.146.at:0 "[our_overlord.GetName]有很小的机会发现我们的特工。"
 me_subject_independence.146.b:0 "[selected_infiltrator.GetFirstName]将不得不单独行动。"
 me_subject_independence.146.bt:0 "[our_overlord.GetName]有中等机会发现我们的特工。"
 me_subject_independence.146.desc:0 "我们在[our_overlord.GetName]的间谍发现了一些有用的信息。似乎[selected_infiltrator.GetSheHe]发现了一个特殊的补给站，对[our_overlord.GetAdjective]的补给线至关重要。如果这个仓库被摧毁，将导致增援速度减慢，甚至可能因为缺乏食物而导致逃亡。[selected_infiltrator.GetName]已经请求提供一些人力，以获得关于这个仓库的更多信息。没有它，[selected_infiltrator.GetSheHe]将不得不冒更大的风险来获得这些信息。"
 me_subject_independence.146.t:0 "$gm_subject_independence_13c$: 补给站"
 me_subject_independence.147.a:0 "发送这些资金。"
 me_subject_independence.147.at:0 "[our_overlord.GetName]发现我们的代理人的可能性是中等的。"
 me_subject_independence.147.b:0 "[selected_infiltrator.GetFirstName]将不得不冒险。"
 me_subject_independence.147.bt:0 "[our_overlord.GetName]有很大的机会发现我们的特工。"
 me_subject_independence.147.desc:0 "[selected_infiltrator.GetName]，我们在[our_overlord.GetName]的特工，已经让我们知道一个独特的机会出现了。一些曾经受雇于雇佣军团的当地人对[our_overlord.GetAdjective]军队表示不满。他们已经与[selected_infiltrator.GetFirstName]达成协议，与他们以前的雇主联系，散布不好的谣言，劝说他们不要与[our_overlord.GetName]签订任何合同。[selected_infiltrator.GetFirstName]已经要求提供一些资金，为这些当地人提供额外的激励。"
 me_subject_independence.147.t:0 "$gm_subject_independence_13c$。不满的雇佣兵"
 me_subject_independence.148.a:0 "联系那些雇佣兵。"
 me_subject_independence.148.b:0 "摧毁补给站。"
 me_subject_independence.148.bt:0 "[our_overlord.GetName]将损失三分之一的最大人力。"
 me_subject_independence.148.c:0 "我们不能冒[selected_infiltrator.GetHerHis]被俘的风险。"
 me_subject_independence.148.desc:0 "[selected_infiltrator.GetName]已经观察[our_overlord.GetName]的军事活动几个月了。在这段时间里，[selected_infiltrator.GetSheHe]设法为我们创造了一些选择。现在是时候决定哪种行动最符合我们的利益了。"
 me_subject_independence.148.desc_1:0 "\n\n在过去几周的某个地方，[selected_infiltrator.GetFirstName]被[our_overlord.GetAdjective]当局注意到了。他们对[selected_infiltrator.GetHerHim]产生了怀疑，因此，[selected_infiltrator.GetSheHe]无法进行任何其他询问或准备。由于这个不幸的事实，我们现在让[selected_infiltrator.GetHerHim]做的任何有罪的行为都保证会导致[selected_infiltrator.GetHerHis]被捕。那时[selected_infiltrator.GetFirstName]会怎么样，我们不能说。我们该如何决定？"
 me_subject_independence.148.desc_2:0 "\n\n当[selected_infiltrator.GetHerHis]位于[our_overlord.GetName]期间，没有人不会死盯着[selected_infiltrator.GetHerHis]的一言一行。但我们只能假设[selected_infiltrator.GetHerHim]进行的任何犯罪行动都还不会危及到[selected_infiltrator.GetHerHis]安全。我们该如何决定呢？"
 me_subject_independence.148.t:0 "$gm_subject_independence_13c$：行动时间"
 me_subject_independence.149.a:0 "密切关注[selected_infiltrator.GetHerHim]..."
 me_subject_independence.149.desc:0 "有人发现[selected_infiltrator.GetName]的行为相当可疑。显然，有人看到[selected_infiltrator.GetHeShe]与已知的激进分子会面。这可能是更大的事情的征兆，也可能只是什么都没有。无论如何，保持对[selected_infiltrator.GetHerHim]的关注是谨慎的。如果[selected_infiltrator.GetFirstName]做了任何有罪的事情，我们就可以扑上去逮捕他。"
 me_subject_independence.149.t:0 "可疑的行为"
 me_subject_independence.15.a:0 "我们将提供我们能提供的东西来动摇他们？"
 me_subject_independence.15.at:0 "谈判将从贵国重要家族的首领开始。\n他们可能会在承诺毫不动摇的忠诚之前向你索取一些东西。"
 me_subject_independence.15.desc:0 "[unwilling_subject.GetName]的大家族在我们的王国里一直拥有巨大的财富和影响力。有几次，我们国家的命运是由他们祖先的奇思妙想决定的。按理说，我们需要确保他们支持我们当前的行动方案。如果我们发现自己处于与[our_overlord.GetName]的战争中，我们就不能承受在后方的异议或内讧。当然，我们可以为他们的忠诚提供一些东西？"
 me_subject_independence.15.t:0 "$gm_subject_independence_5a$。接近家族"
 me_subject_independence.150.a:0 "砍掉[selected_infiltrator.GetHerHis]的头!"
 me_subject_independence.150.b:0 "监禁[selected_infiltrator.GetHerHim]。"
 me_subject_independence.150.c:0 "放走[selected_infiltrator.GetHerHim]。"
 me_subject_independence.150.desc:0 "看起来我们对[selected_infiltrator.GetName]的怀疑是有根据的。最近事件的目击者认为[selected_infiltrator.GetHerHim]是主要煽动者之一。"
 me_subject_independence.150.desc_0:0 " 逮捕工作进展顺利，现在只剩下决定如何处理[selected_infiltrator.GetHerHim]了。"
 me_subject_independence.150.desc_2:0 "\n[selected_infiltrator.GetFirstName]在补给站被摧毁前被看到。"
 me_subject_independence.150.t:0 "破坏活动"
 me_subject_independence.151.a:0 "诸神保佑我们。"
 me_subject_independence.151.desc_1:0 "看来，当地的雇佣兵队伍中已经有了一些谣言。这些谣言将我们描述为不值得信任和懦弱的人。不幸的是，在可预见的未来，我们雇佣这些乐队的能力将受到严重限制。"
 me_subject_independence.151.desc_2:0 "昨天晚上，一个重要的补给站被摧毁。里面有大量的食物和设备，现在已经丢失。由于缺乏资源，许多人都开了小差，我们维持军队的能力在不久的将来就会被掏空。"
 me_subject_independence.151.t:0 "破坏军事行动"
 me_subject_independence.155.a:0 "[potential_infiltrator_1.GetFirstName]是这项工作的最佳人选。"
 me_subject_independence.155.at:0 "[potential_infiltrator_1.GetName]将移动到[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!武功加上#G 精力充沛#!、#G 海岸突袭者#! 和#G 聪明#! 的特质将减少被发现的机会。\n低@military_icon!武功加上#R 懒惰#!、#R 好斗#! 和#R 愚蠢#! 的特质将增加被发现的机会。"
 me_subject_independence.155.b:0 "我们应该考虑派遣[potential_infiltrator_2.GetFirstName]。"
 me_subject_independence.155.bt:0 "[potential_infiltrator_2.GetName]将会去[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!军事能力与诸如#G 精力充沛#!，#G 海贼#!和#G 聪慧#!的特质会降低被发现的可能性。\n低@military_icon!军事能力与诸如#R 懒惰#!，#R 侵略如火#!和#R 愚昧#!的特质会提高被发现的可能性。"
 me_subject_independence.155.c:0 "也许，[potential_infiltrator_3.GetFirstName]将是最佳选择。"
 me_subject_independence.155.ct:0 "[potential_infiltrator_3.GetName]将移动到[our_overlord.GetName]并开始监视他们的军事活动。\n高@military_icon!武功加上#G 精力充沛#!、#G 海岸突袭者#! 和#G 聪明#! 的特征将减少被发现的机会。\n低@military_icon!武功加上#R 懒惰#!、#R 进取#! 和#R 愚蠢#! 的特征将增加被发现的机会。"
 me_subject_independence.155.desc:0 "如果不解决[our_overlord.GetAdjective]海军这个问题，[our_overlord.GetName]可能会让我们更快地被束缚住，而不是我们能够处理的。避免这种结果是当务之急。我们应该派人去检查[our_overlord.GetName]的海军和船坞。然而，无论我们决定派谁去，都应该保持警惕，因为他可能会被抓，甚至更糟。我们需要选择足够细致的人，以避免这种命运，同时提供尽可能多的选择。"
 me_subject_independence.155.t:0 "$gm_subject_independence_14c$"
 me_subject_independence.156.a:0 "发送[selected_infiltrator.GetHerHim]需要的任何东西给[selected_infiltrator.GetSheHe]。"
 me_subject_independence.156.at:0 "[our_overlord.GetName]有很小的机会发现我们的特工。"
 me_subject_independence.156.b:0 "我们现在不能放过任何东西。"
 me_subject_independence.156.bt:0 "[our_overlord.GetName]有中等机会发现我们的代理人。"
 me_subject_independence.156.desc:0 "我们从[our_overlord.GetName]的特工那里得到了好消息。[selected_infiltrator.GetName]已经发现了作为[our_overlord.GetAdjective]海军行动中心的主要船坞。如果它被废止，他们的海军实力就会有所下降。[selected_infiltrator.GetFirstName]要求我们提供额外的资源，以便更有效地侦查这个机会。"
 me_subject_independence.156.t:0 "$gm_subject_independence_14c$:停用船坞"
 me_subject_independence.157.a:0 "提供资金。"
 me_subject_independence.157.at:0 "[our_overlord.GetName]发现我们的代理人的可能性是中等的。"
 me_subject_independence.157.b:0 "没有这些资金，一定是可以的。"
 me_subject_independence.157.bt:0 "有很大的机会[our_overlord.GetName]发现我们的代理人。"
 me_subject_independence.157.desc:0 "[selected_infiltrator.GetName]已经让我们知道了削弱[our_overlord.GetAdjective]海军的可能性。有可能尝试摧毁一些船只，同时使其他船只丧失能力。[our_overlord.GetName]需要一些时间才能从中恢复。如果有一些额外的资金，这个尝试可以顺利得多。"
 me_subject_independence.157.t:0 "$gm_subject_independence_14c$。削弱海军"
 me_subject_independence.158.a:0 "一个残缺的海军是无用的。"
 me_subject_independence.158.at:0 "[our_overlord.GetAdjective]海军会失去一些船只，一些会被损坏。"
 me_subject_independence.158.b:0 "让我们把目标放在船坞。"
 me_subject_independence.158.c:0 "我们不能拿[selected_infiltrator.GetHerHis]的安全冒险。"
 me_subject_independence.158.desc:0 "[selected_infiltrator.GetName]已经观察[our_overlord.GetName]的海军活动几个月了。在这段时间里，[selected_infiltrator.GetSheHe]设法为我们创造了一些选择。现在是决定哪种行动最符合我们利益的时候了。"
 me_subject_independence.158.desc_1:0 "\n\n在过去几周的某个地方，[selected_infiltrator.GetFirstName]被[our_overlord.GetAdjective]当局注意到了。他们对[selected_infiltrator.GetHerHim]产生了怀疑，因此，[selected_infiltrator.GetSheHe]无法进行任何其他询问或准备。由于这个不幸的事实，我们现在让[selected_infiltrator.GetHerHim]做的任何有罪的行为都保证会导致[selected_infiltrator.GetHerHis]被捕。那时[selected_infiltrator.GetFirstName]会怎么样，我们不能说。我们该如何决定？"
 me_subject_independence.158.desc_2:0 "\n\n当[selected_infiltrator.GetHerHis]位于[our_overlord.GetName]期间，没有人不会死盯着[selected_infiltrator.GetHerHis]的一言一行。但我们只能假设[selected_infiltrator.GetHerHim]进行的任何犯罪行动都还不会危及到[selected_infiltrator.GetHerHis]安全。我们该如何决定呢？"
 me_subject_independence.158.t:0 "$gm_subject_independence_14c$：行动时间"
 me_subject_independence.159.a:0 "保持[selected_infiltrator.GetHerHim]在视线范围内......"
 me_subject_independence.159.desc:0 "有人发现[selected_infiltrator.GetName]的行为相当可疑。显然，有人看到[selected_infiltrator.GetHeShe]与知名的激进分子会面。这可能是更大事件的征兆，也可能根本没有什么。无论如何，保持对[selected_infiltrator.GetHerHim]的关注是谨慎的。如果[selected_infiltrator.GetFirstName]做了任何有罪的事情，我们就可以扑上去逮捕他。"
 me_subject_independence.159.t:0 "可疑的行为"
 me_subject_independence.160.a:0 "砍掉[selected_infiltrator.GetHerHis]的头!"
 me_subject_independence.160.b:0 "监禁[selected_infiltrator.GetHerHim]。"
 me_subject_independence.160.c:0 "放走[selected_infiltrator.GetHerHim]。"
 me_subject_independence.160.desc:0 "看起来我们对[selected_infiltrator.GetName]的怀疑是有根据的。最近事件的目击者认为[selected_infiltrator.GetHerHim]是主要煽动者之一。"
 me_subject_independence.160.desc_0:0 " 逮捕工作进展顺利，现在只剩下决定如何处理[selected_infiltrator.GetHerHim]了。"
 me_subject_independence.160.desc_2:0 "\n[selected_infiltrator.GetFirstName]在船坞被禁用之前被人看到。"
 me_subject_independence.160.t:0 "破坏"
 me_subject_independence.161.a:0 "诸神保佑我们。"
 me_subject_independence.161.desc_1:0 "我们的舰队被攻击了!几艘船被击沉，许多船被打坏。要从这次损失中恢复过来需要一些时间。不管是谁干的，都还没有抓到。我们必须在未来更加小心。"
 me_subject_independence.161.desc_2:0 "我们的主要船坞昨晚被毁。我们肯定会在未来的几年里感受到这次破坏的影响。建造和维护舰队的费用将大大增加。不幸的是，肇事者还没有被抓住。"
 me_subject_independence.161.t:0 "海上灾难"
 me_subject_independence.165.a:0 "召集人手。"
 me_subject_independence.165.desc:0 "[our_overlord.GetName]的土地是一个真正的宝库，可以被第一个愿意抓住机会的机会主义者所利用。[our_overlord.GetCapital.GetArea.GetName]的主要省份防卫薄弱，这几乎是荒谬的。我们怎么能不利用这个上天赐予的机会呢。我们将派出一队强盗来夺取即将属于我们的东西。[our_overlord.GetAdjective]们不会知道是什么袭击了他们。"
 me_subject_independence.165.t:0 "$gm_subject_independence_17c$ 一伙强盗"
 me_subject_independence.166.a:0 "灿烂的。"
 me_subject_independence.166.desc:0 "我们的强盗团送来了一些他们在[our_overlord.GetAdjective]地获得的战利品。让我们看看他们发现了什么..."
 me_subject_independence.166.desc_1:0 "\n\n看来他们成功地掠夺了[our_overlord.GetCapital.GetArea.GetName]中的一个城镇。黄金和珠宝很多。"
 me_subject_independence.166.desc_2:0 "\n\n看起来他们伏击并击败了[our_overlord.GetAdjective]的驻军。他们获得的经验将有利于我们的军队。"
 me_subject_independence.166.desc_3:0 "\n\n看来他们奴役了前[our_overlord.GetAdjective]公民。他们现在将在[unwilling_subject.GetCapital.GetName]中充当奴隶。"
 me_subject_independence.166.t:0 "$gm_subject_independence_17c$。一次成功的突袭"
 me_subject_independence.167.a:0 "我们一定是激怒了诸神。"
 me_subject_independence.167.b:0 "派出一个大规模的搜索队，找到并消灭这些强盗。"
 me_subject_independence.167.bt:0 "袭击将停止。"
 me_subject_independence.167.desc:0 "我们收到报告说，在我们的首都省有一小队强盗在逃。到目前为止，我们还没能抓到他们。然而我们的抓捕尝试并没有阻止这些罪犯对我们的城镇进行袭击。"
 me_subject_independence.167.desc_1:0 "\n\n他们成功地掠夺了[our_overlord.GetCapital.GetArea.GetName]中的一个城镇。这需要一段时间来恢复。"
 me_subject_independence.167.desc_2:0 "\n\n他们伏击并击败了我们的一支驻军。有了这些新获得的经验，接下来的战斗可能会更加危险。"
 me_subject_independence.167.desc_3:0 "\n\n他们绑架并奴役了[our_overlord.GetAdjective]公民。我们可能永远不知道他们被带到哪里去了。"
 me_subject_independence.167.t:0 "逃亡中的强盗"
 me_subject_independence.167.tt:0 "你在[our_overlord.GetCapital.GetArea.GetName]的两个老爹被带走了。你不知道去哪里..."
 me_subject_independence.17.a:0 "也许国库可以为[selected_family_head.GetFirstName]腾出几个人才。"
 me_subject_independence.17.b:0 "不可接受的。"
 me_subject_independence.17.desc:0 "在你与[selected_family_head.GetName]会面时，他突然在你的演讲中打断了你。\n'听着[unwilling_subject.GetRuler.GetFirstName]，'他说，'你可以暂缓练习演讲。我只要求对我的支持给予公平的补偿'。他想要什么样的补偿，这一点太清楚了。"
 me_subject_independence.17.t:0 "$gm_subject_independence_5a$。阴暗的交易"
 me_subject_independence.170.a:0 "[corrupt_them_all_1.GetName]有军事背景。"
 me_subject_independence.170.b:0 "我们的目标是[corrupt_them_all_2.GetName]。"
 me_subject_independence.170.c:0 "[corrupt_them_all_3.GetName]怎么样？"
 me_subject_independence.170.d:0 "我们将去找[corrupt_them_all_4.GetName]。"
 me_subject_independence.170.desc:0 "我们应该联系[our_overlord.GetAdjective]政府的成员，试图向他们求婚。他们可以在那里引起一些骚动，或者如果被说服，甚至可以加入我们的行列。问题是，我们的目标是谁？"
 me_subject_independence.170.t:0 "$gm_subject_independence_15c$"
 me_subject_independence.170.tt:0 "你将尝试向这个人物求婚。"
 me_subject_independence.171.a:0 "让我们慷慨地赠送。"
 me_subject_independence.171.b:0 "适度的金额是合适的。"
 me_subject_independence.171.c:0 "我们到底能错过多少？"
 me_subject_independence.171.desc:0 "[unwilling_subject.GetRuler.GetName]和[selected_to_corrupt_char.GetName]之间的沟通已经打开。到目前为止，[selected_to_corrupt_char.GetSheHe]对我们所暗示的话题表现出了好奇心。在我们不能保证保密的情况下，直接提出我们的任何要求都太早了。让我们确保[selected_to_corrupt_char.GetHerHis]的好奇心变成真正的兴趣。黄金肯定会起到作用。"
 me_subject_independence.171.t:0 "$gm_subject_independence_15c$：人人都喜欢黄金"
 me_subject_independence.172.a:0 "对于未来的朋友来说，一切皆有可能。"
 me_subject_independence.172.b:0 "让我们不要无理取闹。"
 me_subject_independence.172.c:0 "当然是在限制范围内。"
 me_subject_independence.172.desc:0 "[unwilling_subject.GetRuler.GetName]和[selected_to_corrupt_char.GetName]之间能够更坦诚地交谈了。[selected_to_corrupt_char.GetFirstName]要求我们利用我们在[our_overlord.GetName]的一些影响力来促进他的利益。在这里协助[selected_to_corrupt_char.GetHerHim]是明智的。"
 me_subject_independence.172.t:0 "$gm_subject_independence_15c$。政治上的恩惠"
 me_subject_independence.173.a:0 "我们将好好利用[selected_to_corrupt_char.GetHerHis]的才能。"
 me_subject_independence.173.at:0 "[selected_to_corrupt_char.GetName]搬到你的国家并获得公民身份。"
 me_subject_independence.173.b:0 "[selected_to_corrupt_char.GetFirstName]将成为[our_overlord.GetAdjective]的一根刺。"
 me_subject_independence.173.c:0 "真是白费功夫。"
 me_subject_independence.173.desc_1:0 "赞美诸神!我们收到了来自[selected_to_corrupt_char.GetName]的消息，[selected_to_corrupt_char.GetSheHe]已经决定放弃[our_overlord.GetName]，在我们的国家寻找财富和荣耀。我们将按照承诺给予他公民身份，这样[selected_to_corrupt_char.GetFirstName]就可以享受到[selected_to_corrupt_char.GetSheHe]应得的所有自由。我们当然可以在我们的政府中为[selected_to_corrupt_char.GetHerHim]找到一个职位？"
 me_subject_independence.173.desc_2:0 "我们收到了来自[select_to_corrupt_char.GetName]的消息，[select_to_corrupt_char.GetSheHe]决定在[our_overlord.GetName]引起一些动荡。这不是我们所希望的，但[selected_to_corrupt_char.GetFirstName]可能会对[selected_to_corrupt_char.GetHerHis]不忠诚的既定当局构成威胁。"
 me_subject_independence.173.desc_3:0 "我们收到来自[selected_to_corrupt_char.GetName]的消息，[selected_to_corrupt_char.GetSheHe]已经决定留在[our_overlord.GetName]。所有进一步的通信将被停止。不管是什么东西惊动了[selected_to_corrupt_char.GetHerHim]做出这个决定，也保证了他的沉默。我们不必担心我们的秘密尝试会成为[our_overlord.GetName]的常识。"
 me_subject_independence.173.t:0 "$gm_subject_independence_15c$。我们努力的结果"
 me_subject_independence.174.a:0 "他希望在[unwilling_subject.GetName]找到什么？"
 me_subject_independence.174.at:0 "[selected_to_corrupt_char.GetName]搬到[unwilling_subject.GetName]并被授予公民身份。"
 me_subject_independence.174.desc:0 "我们的政府成员已经离开我们，到其他地方寻找[selected_to_corrupt_char.GetHerHis]财富。[selected_to_corrupt_char.GetName]已经成为[unwilling_subject.GetAdjective]公民，我们对此已经无能为力......"
 me_subject_independence.174.t:0 "一个不稳定的政府"
 me_subject_independence.18.a:0 "给予[selected_family_head.GetFirstName]他所要求的控股权。"
 me_subject_independence.18.b:0 "那是不可能的。"
 me_subject_independence.18.desc:0 "在你向[selected_family_head.GetName]陈述完你的论点后，他仍然保持沉默，似乎陷入了沉思。\n最后，他说'我准备向你提供我家族的支持。然而，似乎我家族的一些财产已经被瓜分，失去了我们的支持。我们现在发现自己的财产太少，无法传给我们的孩子。也许有一些国有土地可以为我们所用？从他走进房间的那一刻起，你就会立刻明白这是他的价格。"
 me_subject_independence.18.t:0 "$gm_subject_independence_5a$。材料要求"
 me_subject_independence.180.a:0 "当然是[kill_them_all_1.GetName][kill_them_all_1.GetHerHim]自己了!"
 me_subject_independence.180.at:0 "去找[our_overlord.GetName]的统治者，机会会严重减少。"
 me_subject_independence.180.b:0 "总督[kill_them_all_2.GetName]是正确的选择。"
 me_subject_independence.180.c:0 "没有[kill_them_all_3.GetName]将军，他们会怎么做？"
 me_subject_independence.180.d:0 "[kill_them_all_4.GetName]是他们最聪明的人之一。"
 me_subject_independence.180.desc:0 "干掉[our_overlord.GetName]中的一个关键人物是一件很冒险的事情。我们需要非常谨慎地选择我们的目标。有些人将比其他人更难接近。无论我们派谁去干掉这个人，都要承担相当大的风险。现在，我们选择谁来对付？"
 me_subject_independence.180.t:0 "$gm_subject_independence_16c$。选择一个目标"
 me_subject_independence.180.tt:0 "成功的机会将由目标的@civic_icon!精细度和以下特征决定：\n#G 顺从的#!、#G 轻率的#! 和#G 信任的#!\n#R 自信的#!、#R 谨慎的#! 和#R 凶险的#!。"
 me_subject_independence.181.a:0 "[would_be_assassin_1.GetName]是最合适的。"
 me_subject_independence.181.b:0 "让我们给[would_be_assassin_2.GetName]一个机会。"
 me_subject_independence.181.c:0 "唯一的选择是[would_be_assassin_3.GetName]。"
 me_subject_independence.181.desc:0 "为了使我们的机会最大化，选择最合适的代理人是当务之急。有几个男人和女人被我们看中来完成这项任务。我们将派谁来承担这一巨大的风险？"
 me_subject_independence.181.t:0 "$gm_subject_independence_16c$。选择你的代理人"
 me_subject_independence.181.tt:0 "你的特工将转移到[our_overlord.GetName]，以接近目标。\n成功的机会将由特工的@civic_icon!精细度和以下特征决定：\n#G 狡猾#!、#G 谨慎#! 和#G 精明#!\n#R 无耻#!、#R 轻率#! 和#R 愚蠢#!。"
 me_subject_independence.182.a:0 "[selected_to_kill_char.GetFirstName]必须死。"
 me_subject_independence.182.at:0 "你的特工人员将尝试暗杀目标。"
 me_subject_independence.182.b:0 "尝试把[selected_to_kill_char.GetHerHim]带到这里。"
 me_subject_independence.182.bt:0 "你的特工人员将尝试绑架目标人物。这将降低成功的机会。"
 me_subject_independence.182.desc:0 "现在，[selected_assassin_char.GetName]已经到位，我们必须决定对[selected_to_kill_char.GetName]采取什么行动。[selected_assassin_char.GetFirstName]可以尝试暗杀目标。另一个选择是，[selected_assassin_char.GetHerHim]试图将[selected_to_kill_char.GetFirstName]绑架回[unwilling_subject.GetName]。第二种方案显然风险更大，但可以获得更高的回报。"
 me_subject_independence.182.t:0 "$gm_subject_independence_16c$。选择你的方法"
 me_subject_independence.183.a:0 "完美。"
 me_subject_independence.183.b:0 "不幸的是。"
 me_subject_independence.183.c:0 "最坏的结果。"
 me_subject_independence.183.desc_1:0 "我们收到了关于我们在[selected_to_kill_char.GetName]刺杀[our_overlord.GetName]的消息。"
 me_subject_independence.183.desc_1_1:0 " 看来，[selected_assassin_char.GetName]在[selected_assassin_char.GetHerHis]的尝试中获得了成功。当这一时刻到来时，[selected_assassin_char.GetSheHe]设法在[selected_to_kill_char.GetFirstName]的心脏上插了一把匕首。死亡很快就降临了。"
 me_subject_independence.183.desc_1_2:0 " 看来，[selected_assassin_char.GetName]在[selected_assassin_char.GetHerHis]的尝试中没有成功。当这一时刻到来时，[selected_assassin_char.GetSheHe]发出一些声音，提醒[selected_to_kill_char.GetFirstName]注意[selected_assassin_char.GetHerHis]的存在。"
 me_subject_independence.183.desc_2:0 "我们收到了关于我们在[selected_to_kill_char.GetName]绑架[our_overlord.GetName]的尝试的消息。"
 me_subject_independence.183.desc_2_1:0 " 看来，[selected_assassin_char.GetName]在[selected_assassin_char.GetHerHis]的尝试中是成功的。[selected_to_kill_char.GetFirstName]被抓住了，在任何人发现之前被带到了城外。"
 me_subject_independence.183.desc_2_2:0 " 看来，[selected_assassin_char.GetName]在[selected_assassin_char.GetHerHis]的尝试中没有成功。当这一时刻到来时，[selected_assassin_char.GetSheHe]发出一些声音，提醒[selected_to_kill_char.GetFirstName]注意[selected_assassin_char.GetHerHis]的存在。"
 me_subject_independence.183.desc_3:0 " [selected_assassin_char.GetFirstName]在引起更多的怀疑之前成功地溜走了，没有被发现。我们很快就会在[selected_assassin_char.GetHerHim]看到[unwilling_subject.GetCapital.GetName]回来。"
 me_subject_independence.183.desc_4:0 " 经过短暂的追逐，[selected_assassin_char.GetFirstName]被[selected_assassin_char.GetHerHis]的追兵逼到了角落。为了避免被抓，[selected_assassin_char.GetSheHe]喝了一些毒药。随着[selected_assassin_char.GetHerHis]的死亡，没有人能够将这一企图与我们联系起来。"
 me_subject_independence.183.t:0 "$gm_subject_independence_16c$。结果"
 me_subject_independence.184.a:0 "没有人看到这一点。"
 me_subject_independence.184.desc_1_1:0 "我们得知，一名外国特工成功地暗杀了我们社会的一名高级成员。[selected_to_kill_char.GetName]现在死了，凶手永远不会对[selected_assassin.char.GetHerHis]的罪行负责。这是对[our_overlord.GetName]的巨大损失。"
 me_subject_independence.184.desc_1_2:0 "我们获悉，一名外国特工未能刺杀我国社会的一名高级成员。[selected_to_kill_char.GetName]在行凶前就被提醒了，他的谋杀者就在那里。[our_overlord.GetName]一定是得到了众神的青睐。"
 me_subject_independence.184.desc_2_1:0 "我们了解到，我们社会的一位高级成员突然消失了。没有人知道[selected_to_kill_char.GetName]去了哪里。有一些传言说他被一个外国特工绑架了。如果是这样，那么这就是[our_overlord.GetName]的巨大损失。"
 me_subject_independence.184.desc_2_2:0 "我们了解到，有人试图绑架我们社会中的一位高级成员。幸运的是，[selected_to_kill_char.GetName]设法避免了这种命运。"
 me_subject_independence.184.desc_3:0 "\n所谓的肇事者不幸地成功逃脱，没有任何严重的麻烦。我们可能再也见不到[selected_assassin_char.GetHerHim]了。"
 me_subject_independence.184.desc_4:0 "\n肇事者在我们的追捕过程中不幸杀死了[selected_assassin_char.GetHerHim]自己。我们可能永远也找不到[selected_assassin_char.GetSheHe]的真实身份了。"
 me_subject_independence.184.t:0 "邪恶的活动"
 me_subject_independence.184.tt_1:0 "[selected_to_kill_char.GetName]被暗杀了。"
 me_subject_independence.184.tt_2:0 "[selected_to_kill_char.GetName]被绑架到某个地方。"
 me_subject_independence.19.a:0 "让[selected_family_head.GetName]和他的兄弟们拥有这些象征性的头衔。"
 me_subject_independence.19.b:0 "不幸的是，这是不可能的。"
 me_subject_independence.19.desc:0 "在与[selected_family_head.GetName]的讨论中，很快就能看出他想让自己和一些家庭成员担任一些名义上的工作。他们不会有任何实际权力，但会获得声望和影响力。"
 me_subject_independence.19.t:0 "$gm_subject_independence_5a$。小顾问的角色"
 me_subject_independence.190.a:0 "也提供一份礼物。"
 me_subject_independence.190.at:0 "你会要求[subject_ally.GetName]在时机成熟时和你一起宣布独立。黄金将提供更好的成功机会。"
 me_subject_independence.190.b:0 "他们肯定会支持我们。"
 me_subject_independence.190.bt:0 "一旦时机成熟，你将要求[subject_ally.GetName]与你一起宣布独立。"
 me_subject_independence.190.c:0 "也许不是他们..."
 me_subject_independence.190.ct:0 "你不问[subject_ally.GetName]。"
 me_subject_independence.190.desc:0 "你的同伴[subject_ally.GetName]，可能会被诱惑加入我们的自由追求。我们可以要求他们承诺在时机成熟时加入我们的独立行动。赠送黄金肯定会提高成功的机会。"
 me_subject_independence.190.t:0 "$gm_subject_independence_18c$"
 me_subject_independence.191.a:0 "他们得到了我们的支持。"
 me_subject_independence.191.at:0 "一旦[unwilling_subject.GetName]宣布独立，你们将加入他们。"
 me_subject_independence.191.b:0 "我们不能同意这样做。"
 me_subject_independence.191.desc:0 "我们收到了来自[unwilling_subject.GetName]的消息，这是在[our_overlord.GetAdjective]统治下的另一个国家。他们正在寻找其他人加入他们，以获得他们的独立，并要求我们在时机成熟时承诺提供支持。当然，这是一个相当大胆的声明，无论它多么诱人。无论我们做什么决定，最好不要让[our_overlord.GetName]知道这个消息。他们的愤怒和不相信可能会影响我们以及[unwilling_subject.GetAdjective]人。"
 me_subject_independence.191.desc_1:0 "\n也提供了一份慷慨的礼物，以更容易动摇我们的思想。我们将看看它是否会影响我们的判断。"
 me_subject_independence.191.t:0 "一个机会出现了"
 me_subject_independence.192.a:0 "我们在一起了。"
 me_subject_independence.192.desc:0 "来自[subject_ally.GetName]的回应已经到来。我们得到了他们的承诺，他们将在时机成熟时加入我们。我们现在要做的，就是发出信号。"
 me_subject_independence.192.t:0 "$gm_subject_independence_18c$。[subject_ally.GetName]接受"
 me_subject_independence.193.a:0 "他们会后悔的。"
 me_subject_independence.193.desc:0 "来自[subject_ally.GetName]的消息到了。不幸的是，他们已经拒绝了我们的提议。看来他们太害怕[our_overlord.GetAdjective]的反应了，不敢把我们的计划告诉他们。"
 me_subject_independence.193.t:0 "$gm_subject_independence_18c$。[subject_ally.GetName] 拒绝"
 me_subject_independence.20.a:0 "这的确是一个惊喜，但也是一个值得欢迎的惊喜!"
 me_subject_independence.20.desc:0 "你还没来得及说话，[selected_family_head.GetName]就插话了。'你甚至不需要劝说我[unwilling_subject.GetRuler.GetTitle]。自然，你有我的全力支持。你的事业是正义的，是光荣的事情。你灵巧地点点头，就打发了他。"
 me_subject_independence.20.t:0 "$gm_subject_independence_5a$。一个意想不到的惊喜"
 me_subject_independence.200.a:0 "这就是了。"
 me_subject_independence.200.at:0 "你和那些承诺支持的同胞，将获得独立。\n现在取决于[our_overlord.GetName]是让它过去，还是愿意为此开战。\n你在[our_overlord.GetAdjective]国家造成的混乱程度将影响到更和平的结果的机会。"
 me_subject_independence.200.desc:0 "经过几个月的准备，现在终于到了。是时候摆脱我们背上的[our_overlord.GetAdjective]重负了。我们和其他可能承诺支持的同胞一起宣布我们的独立。在他们所处的残缺状态下，[our_overlord.GetName]要怎么做呢？"
 me_subject_independence.200.t:0 "$gm_subject_independence_19c$"
 me_subject_independence.201.a:0 "他们怎么敢。"
 me_subject_independence.201.desc:0 "我们的一个臣民，[selected_subject.GetName]，已经决定宣布自己独立于我们的影响。这显然是对我们国家的侮辱。他们一定会对这种错误的行为感到后悔。"
 me_subject_independence.201.t:0 "[selected_subject.GetName]决裂"
 me_subject_independence.202.a:0 "他们将不得不付出铁的代价。"
 me_subject_independence.202.at:0 "你向[unwilling_subject.GetName]和所有其他可能脱离的附属国宣战。"
 me_subject_independence.202.b:0 "我们没有战争的状态。"
 me_subject_independence.202.bt:0 "你将获得与[unwilling_subject.GetName]和所有其他可能脱离的附属国的休战。"
 me_subject_independence.202.desc:0 "过去几个月，[unwilling_subject.GetName]一直在破坏我们。我们当然有怀疑，但我们始终无法收集到任何谴责性的证据。现在看来，他们终于准备揭开秘密的面纱，公开地藐视我们。他们的独立宣言是对我们所代表的一切的侮辱。我们不能让这种情况不受惩罚。不幸的是，[unwilling_subject.GetAdjective]的破坏活动已经相当成功地扰乱了我们的治理。我们现在甚至有能力做任何事情吗？"
 me_subject_independence.202.t:0 "通讯员的反应"
 me_subject_independence.203.a:0 "让他们来吧。"
 me_subject_independence.203.desc:0 "尽管[unwilling_subject.GetName]努力破坏[our_overlord.GetAdjective]国家，但他们已经宣战，以重新获得他们以前的科目。我们必须为即将到来的冲击做准备。"
 me_subject_independence.203.t:0 "$gm_subject_independence_19c$。[our_overlord.GetName]拿起了武器"
 me_subject_independence.204.a:0 "我们打破了骆驼的背。"
 me_subject_independence.204.desc:0 "[unwilling_subject.GetName]破坏[our_overlord.GetAdjective]民族的努力，迫使他们接受了现在的状况。不会为此打仗。我们现在可以自由地享受我们的独立。不过他们可能会怀恨在心，为任何这种情况做好准备是明智的。"
 me_subject_independence.204.t:0 "$gm_subject_independence_19c$。[our_overlord.GetName]保持沉默"
 me_subject_independence.21.a:0 "希望这不会对我们产生反作用。"
 me_subject_independence.21.desc:0 "在与所有大家族的首领交谈后，你只能希望这件事得到解决。尽管他们作出了保证，但他们是否会遵守诺言，谁也说不准。只有时间才能证明。"
 me_subject_independence.21.t:0 "$gm_subject_independence_5a$: 会谈结束"
 me_subject_independence.25.a:0 "我们将有更好的机会用黄金贡品来赢得他们的支持。"
 me_subject_independence.25.at:0 "你要做出重大努力，说服这个国家协助你，当时机到来时......"
 me_subject_independence.25.b:0 "我们需要所有能得到的帮助。"
 me_subject_independence.25.bt:0 "你将作出适度的努力来说服这个国家协助你，当时机成熟时......"
 me_subject_independence.25.c:0 "也许不是来自他们..."
 me_subject_independence.25.ct:0 "不会试图劝说他们。"
 me_subject_independence.25.desc:0 "尽管在过去几个月里做出了所有的姿态和承诺，但现实是我们很可能无法靠自己来做这件事。谨慎的做法是向其他国家询问他们是否会承诺提供支持。[tmp_ally_scope.GetName]将是一个可以接触的好人选。"
 me_subject_independence.25.t:0 "$gm_subject_independence_6a$"
 me_subject_independence.26.a:0 "我们将为他们的事业提供援助。当然，[our_overlord.GetName]的损失就是我们的收获。"
 me_subject_independence.26.at:0 "如果[unwilling_subject.GetName]宣布独立战争，我们将作为盟友加入战争。"
 me_subject_independence.26.b:0 "我们不会提供任何援助。"
 me_subject_independence.26.bt:0 "我们将让他们听从自己的命运。"
 me_subject_independence.26.desc:0 "来自[unwilling_subject.GetName]的外交官找到了我们。他们向我们讲述了他们的宗主[our_overlord.GetName]的劣迹和不公正行为。甚至[our_overlord.GetRuler.GetName]也被亲自指控犯有一些相当严重的罪行。我们知道这些被指控行为的真相，然而与[unwilling_subject.GetName]建立友好关系可能符合我们的利益。如果发生独立战争，如果[tmp_ally_scope.GetAdjective]士兵来帮助他们，他们将永远不会忘记。"
 me_subject_independence.26.desc_1:0 "\n\n他们在请求援助时甚至包括了一份黄金的礼物!"
 me_subject_independence.26.t:0 "求助的呼声"
 me_subject_independence.27.a:0 "赞美诸神！"
 me_subject_independence.27.desc:0 "我们终于收到了来自[tmp_ally_scope.GetName]的消息。他们承诺提供军事援助，并表示他们将加入我们可能发起的任何独立战争。有了他们的帮助，我们成功恐吓[our_overlord.GetName]让我们不战而屈人之兵的机会就增加了他们将不得不面对[tmp_ally_scope.GetAdjective]的剑，否则......"
 me_subject_independence.27.t:0 "$gm_subject_independence_6a$。回复"
 me_subject_independence.28.a:0 "诅咒[tmp_ally_scope.GetName]。"
 me_subject_independence.28.desc:0 "我们终于收到了来自[tmp_ally_scope.GetName]的消息。他们已经决定不参与我们可能发起的任何独立战争。当然，[our_overlord.GetRuler.GetName]目前正在嘲笑我们的不幸。即使没有[tmp_ally_scope.GetAdjective]的剑，我们也会向前推进，直到赢得我们的独立......"
 me_subject_independence.28.t:0 "$gm_subject_independence_6a$。回复"
 me_subject_independence.3.a:0 "辩论仍在继续..."
 me_subject_independence.3.at_l:0 "军国主义派推动了他们的议程，离达成共识又近了一步。"
 me_subject_independence.3.at_r:0 "外交派推动了他们的议程，离达成共识又近了一步。"
 me_subject_independence.3.desc:0 "其中一个派别已经将许多人的思想动摇到他们的事业上。虽然争论仍在继续，但这一派似乎正在获得比其他派别更多的支持。"
 me_subject_independence.3.desc_l:0 "\n\n[selected_advisor.GetName]最近为他们的事业提出了一个无可辩驳的论点。他们的观点很明确：\n只有实力和军事力量才能恐吓[our_overlord.GetName]释放我们。"
 me_subject_independence.3.desc_r:0 "\n\n[selected_advisor.GetName]最近为他们的事业提出了一个无可辩驳的论点。他们的观点很明确：\n只有理性和妥协才能带来理想的结果。"
 me_subject_independence.3.t:0 "$gm_subject_independence_1$。派别进展"
 me_subject_independence.30.a:0 "也许[selected_family_head.GetName]可以捐献？"
 me_subject_independence.30.at:0 "你会向这个角色索要金币，但他们可能会觉得自己被强加了，并记恨一段时间。"
 me_subject_independence.30.b:0 "我们在[selected_friendly_neighbour.GetName]的朋友可以提供一些人力。"
 me_subject_independence.30.bt:0 "你会向一个友好国家请求额外的人力。"
 me_subject_independence.30.c:0 "我们可以向[selected_office_boy.GetName]请求支持。"
 me_subject_independence.30.ct:0 "你会向这个角色请求政治影响，但他们可能会觉得自己被强行拉拢，并记恨一阵子。"
 me_subject_independence.30.d:0 "[selected_high_priest.GetName]可以请求神灵的祝福。"
 me_subject_independence.30.desc:0 "我们需要为任何可能发生的情况做准备，但准备这份最后通牒的费用对我们的国库和广大民众来说是非常大的负担。为慎重起见，也许应该向一些重要人物寻求帮助。"
 me_subject_independence.30.desc_1:0 "\n\n我们可以要求某个大家族提供财政捐助。他们肯定不能拒绝这个援助国家的机会？"
 me_subject_independence.30.desc_2:0 "\n\n我们可以向我们的一个友好邻国请求支持。也许他们有一些可以抽出的战斗人员？"
 me_subject_independence.30.desc_3:0 "\n\n我们可以向我们的[selected_office_boy.GetTitle]请求一些恩惠。他们的帮助可能会让我们更快地实现我们的目标。"
 me_subject_independence.30.desc_4:0 "\n\n我们可以向我们的[selected_high_priest.GetTitle]求得祝福。获得众神的青睐会缓解一些人的困扰。"
 me_subject_independence.30.dt:0 "将会有一个牺牲，为我们的国家带来稳定。然而，这个人物可能会觉得自己被强暴了，并且会记恨一阵子。"
 me_subject_independence.30.e:0 "我们不需要其他东西。"
 me_subject_independence.30.t:0 "$gm_subject_independence_7a$"
 me_subject_independence.31.a:0 "多么慷慨。"
 me_subject_independence.31.desc:0 "[selected_family_head.GetName]勉强接受了我们的捐赠请求。由于政府向他们的贵族提出这样的要求是非常不正常的，所以他的酸溜溜的举止是可以理解的。希望他将来不会拿这个来对付我们......"
 me_subject_independence.31.t:0 "$gm_subject_independence_7a$: 额外的黄金"
 me_subject_independence.32.a:0 "我们应该尽我们所能给予。"
 me_subject_independence.32.b:0 "只有我们能拿出的东西。"
 me_subject_independence.32.c:0 "他们要靠自己了。"
 me_subject_independence.32.desc:0 "来自[unwilling_subject.GetName]国家的外交官在他们需要的时候找到了我们。他们正准备脱离[our_overlord.GetName]，开辟自己的道路。他们现在要求我们的志愿者在即将到来的战争中帮助他们充实队伍。我们将如何回应？"
 me_subject_independence.32.t:0 "在他们需要的时候"
 me_subject_independence.33.a:0 "这的确是一份伟大的礼物!"
 me_subject_independence.33.b:0 "我们需要所有我们能得到的人。"
 me_subject_independence.33.c:0 "诅咒他们。"
 me_subject_independence.33.desc:0 "我们的外交官已经从[selected_friendly_neighbour.GetName]回来了，带来了关于我们请求的消息。他们有什么决定？"
 me_subject_independence.33.desc_1:0 "\n\n他们决定给我们送来大量的士兵!我们对他们感激不尽。这个伟大的礼物将永远不会被忘记!"
 me_subject_independence.33.desc_2:0 "\n\n他们决定派出尽可能多的士兵。真的，他们是我们的好朋友。"
 me_subject_independence.33.desc_3:0 "\n\n他们决定什么都不送。我们的希望被粉碎了。这不会被遗忘。"
 me_subject_independence.33.t:0 "$gm_subject_independence_7a$: 额外的人力"
 me_subject_independence.34.a:0 "他的努力不会很快被遗忘。"
 me_subject_independence.34.desc:0 "[selected_office_boy.GetName]已经勉强接受了我们的支持请求。有了他的支持，我们将在政府中拥有额外的影响力，打开以前关闭的大门。不过，[selected_office_boy.GetFirstName]看起来并不太高兴。让我们希望这是我们最后一次看到他的不高兴。"
 me_subject_independence.34.t:0 "$gm_subject_independence_7a$: 额外影响"
 me_subject_independence.35.a:0 "我们的事业被众神认为是公正的。"
 me_subject_independence.35.desc:0 "在与我们的[selected_high_priest.GetTitle][selected_high_priest.GetName]进行了长时间的坚持不懈的讨论后，他得出结论，神灵一定会保佑我们的道路。我们的努力肯定是成功的。这将在一定程度上增加我们的内部稳定性，但[selected_high_priest.GetFirstName]看起来并不高兴被逼到这种境地。他将来可能会以此来对付我们。"
 me_subject_independence.35.t:0 "$gm_subject_independence_7a$：额外的稳定性"
 me_subject_independence.4.a:0 "我将向他们提供支持。"
 me_subject_independence.4.at_l:0 "军国主义派将推动他们的议程，并向达成共识迈进一步。"
 me_subject_independence.4.at_r:0 "外交派将推动他们的议程，离达成共识又近了一步。"
 me_subject_independence.4.b:0 "这是不正当的。"
 me_subject_independence.4.bt_l:0 "外交派将推动他们的议程。"
 me_subject_independence.4.bt_r:0 "军国主义派系将推动他们的议程，而不是。"
 me_subject_independence.4.desc:0 "其中一个派别提出了另一方从根本上反对的论点。"
 me_subject_independence.4.desc_l:0 "\n\n[selected_advisor.GetName]和他的追随者绝不会同意与[our_overlord.GetName]达成妥协。他们已经公开反对这个论点，现在[selected_advisor.GetFirstName]要求我们直接向他们提供支持。"
 me_subject_independence.4.desc_r:0 "\n\n[selected_advisor.GetName]和他的追随者绝不会同意与[our_overlord.GetName]发生军事冲突。他们已经公开反对这种说法，现在[selected_advisor.GetFirstName]要求我们直接向他们提供支持。"
 me_subject_independence.4.t:0 "$gm_subject_independence_1$。反对意见"
 me_subject_independence.40.a:0 "我们不会被吓倒!"
 me_subject_independence.40.desc:0 "这一刻已经到来。终于，我们接近了这整个磨难的终点。剩下的事情就是决定给[our_overlord.GetName]的最后通牒的措辞。之后，我们只能希望[our_overlord.GetRuler.GetName]会明白道理，满足我们迫切希望的东西。"
 me_subject_independence.40.t:0 "$gm_subject_independence_9a$"
 me_subject_independence.42.a:0 "让它消失吧。"
 me_subject_independence.42.at:0 "不会失去任何进展。"
 me_subject_independence.42.b:0 "别管他。"
 me_subject_independence.42.bt:0 "你们已经取得的一些进展将会丧失。宗主将更不可能在不流血的情况下给予你们独立。"
 me_subject_independence.42.desc:0 "当你转过一个角落时，可以听到令人不安的深沉的啜泣声和陶罐的叮当声。你发现[selected_spurned_character.GetName]坐在地上，边哭边喝得很起劲。从他凌乱的外表来看，很明显他已经很久没有清洗自己或换衣服了。他用死亡的哭声和对未来的恐惧来骚扰每个路人。他声称[our_overlord.GetRuler.GetName]自己会来找我们所有人。显然，这不能继续下去了。"
 me_subject_independence.42.t:0 "$gm_subject_independence_9a$。[selected_spurned_character.GetFirstName]投诉"
 me_subject_independence.43.a:0 "让他离开那里。"
 me_subject_independence.43.at:0 "不会失去任何进展。"
 me_subject_independence.43.b:0 "不要管他。"
 me_subject_independence.43.bt:0 "你们已经取得的一些进展将会丧失。宗主将更不可能在不流血的情况下给予你们独立。"
 me_subject_independence.43.desc:0 "你发现[selected_spurned_character.GetName]在镇上的广场上对一大群市民积极发言反对当前的政策。他声音中的绝望表明他对即将到来的未来是多么的恐惧。他的恐吓行为不利于我们的事业，如果战争真的来临，肯定会损害人民的士气。"
 me_subject_independence.43.t:0 "$gm_subject_independence_9a$:[selected_spurned_character.GetFirstName] 破坏"
 me_subject_independence.44.a:0 "胆小鬼!不会做这样的事。离开我的视线!"
 me_subject_independence.44.at:0 "不会失去任何进展。"
 me_subject_independence.44.b:0 "我在听..."
 me_subject_independence.44.bt:0 "你们已经取得的一些进展将会丧失。宗主将更不可能在不流血的情况下给予你们独立。"
 me_subject_independence.44.desc:0 "当你收到仆人的消息说[selected_spurned_character.GetName]已经到达并希望与你交谈时，太阳已经落山了。一旦你们两个人单独在一起，他就开始谈论未来，以及它可能有多危险。他声称认识[our_overlord.GetRuler.GetName]的一些亲戚，可以让我与他们联系。如果我们迅速行动，我们也许能够与他达成交易，'[selected_spurned_character.GetFirstName]说。'甚至可能保证我们的安全，如果......'"
 me_subject_independence.44.t:0 "$gm_subject_independence_9a$:[selected_spurned_character.GetFirstName]方法"
 me_subject_independence.45.a:0 "且来取土！"
 me_subject_independence.45.desc:0 "空气中弥漫着一种可感的紧张，就像暴风雨前的宁静。我们的最后通牒已经起草完毕，马匹也已准备好，我们只需要派人去找我们的外交官。当然，[our_overlord.GetRuler.GetName]不会愚蠢到拒绝我们的请求？如果事情到了这一步，每个[unwilling_subject.GetAdjective]男人、女人和孩子都准备好为我们的自由而战斗和牺牲。我们团结一致，反对僭主。如果他们想拿我们的剑，就让他们来吧。"
 me_subject_independence.45.t:0 "$gm_subject_independence_9a$。暴风雨前的平静"
 me_subject_independence.5.a:0 "多么贴心啊!"
 me_subject_independence.5.at_l:0 "军国主义派将推动他们的议程，离达成共识更近一步。"
 me_subject_independence.5.at_r:0 "外交派将推动他们的议程，离达成共识又近了一步。"
 me_subject_independence.5.b:0 "这是不可想象的!"
 me_subject_independence.5.bt:0 "没有取得任何进展。"
 me_subject_independence.5.desc:0 "其中一个论点的领导人私下找我讨论一个最 微妙 的问题。\n在一个僻静的房间里见面时，[selected_advisor.GetName]微笑着提议说，如果我公开支持他的论点，我个人就会受益。"
 me_subject_independence.5.t:0 "$gm_subject_independence_1$。一个阴暗的提议"
 me_subject_independence.50.a:0 "辉煌的。"
 me_subject_independence.50.desc:0 "我们最近对工事的改进是工程的一个奇迹。我们的首都一定会准备好抵御最漫长的围攻，如果它来了。她的城墙比以前更坚固了。任何入侵者都会在这个堡垒上自寻死路。"
 me_subject_independence.50.t:0 "$gm_subject_independence_3a$"
 me_subject_independence.51.a:0 "确保所有的东西都有了着落。"
 me_subject_independence.51.desc:0 "我们的储备已经得到了补充，我们已经准备好进行持续的冲突。如果有必要，我们会比我们的敌人更持久。"
 me_subject_independence.51.t:0 "$gm_subject_independence_4a$"
 me_subject_independence.52.a:0 "我们不能被大海围困住。"
 me_subject_independence.52.desc:0 "我们的海军已经得到加强，以保护我们的港口不受任何敌对的攻击。我们可以放心，我们的沿海城市将继续繁荣。"
 me_subject_independence.52.t:0 "$gm_subject_independence_8a$"
 me_subject_independence.6.a:0 "我怎么能拒绝他呢？我自己也被感动了。"
 me_subject_independence.6.at_l:0 "军国主义派将推动他们的议程，并向达成共识迈进一步。"
 me_subject_independence.6.at_r:0 "外交派将推动他们的议程，并离达成共识更近一步。"
 me_subject_independence.6.b:0 "我会制止这一切。他的论点是有缺陷的。"
 me_subject_independence.6.bt_l:0 "外交派反而会推动他们的议程。"
 me_subject_independence.6.bt_r:0 "军国主义派系反而会推动他们的议程。"
 me_subject_independence.6.desc:0 "欢呼和掌声响彻整个城市。其中一个派别的领导人刚刚发表了振奋人心的演讲，表示支持民众的观点。我目睹了[selected_advisor.GetName]在展台上的演讲，他受到了民众热烈欢迎。\n\n然而，他的论点并不完美，有几个问题如果被提出来，肯定会使他的一些论点站不住脚。不过，[selected_advisor.GetFirstName]的话术是不可否认的，如果没有其他事情发生，他肯定会获得民众对他的支持。"
 me_subject_independence.6.t:0 "$gm_subject_independence_1$。一个令人信服的论点"
 me_subject_independence.60.a:0 "我们已经准备好了。"
 me_subject_independence.60.at:0 "我们等待着他们的回应..."
 me_subject_independence.60.desc:0 "当信使们消失在地平线上时，一股寒意涌上你的脊梁。收到我们的最后通牒后，我们要么欢呼雀跃，要么准备血战。现在已经没有回头路了。"
 me_subject_independence.60.t:0 "$gm_subject_independence_10a$:发出的最后通牒"
 me_subject_independence.61.a:0 "我们没有选择，只能暂时接受。"
 me_subject_independence.61.at:0 "[unwilling_subject.GetName]将不再是[our_overlord.GetName]的臣民。\n我们将获得与他们的休战和对他们所有领土的宣称。"
 me_subject_independence.61.b:0 "这是不可接受的!召集人手!"
 me_subject_independence.61.bt:0 "[unwilling_subject.GetName]将不会获得独立。\n他们将在未来几天内宣布独立战争。"
 me_subject_independence.61.desc:0 "我们刚刚收到附庸国[unwilling_subject.GetName]的消息。令人惊讶的是，他们发出了最后通牒，打算从我们仁慈的统治中获得独立。这条信息一直在说，说的是轻蔑和不公正，吹嘘他们的军事力量和许多朋友。如果我们默许，他们将从我们的统治中解放出来，这将为我们的其他臣民树立一个先例。如果我们拒绝他们，我们就会有战争!"
 me_subject_independence.61.t:0 "一个要求独立的对象"
 me_subject_independence.62.a:0 "我们将在今晚举行庆典，以示庆祝!"
 me_subject_independence.62.at:0 "我们将不再是[our_overlord.GetName]的附属国，并将与我们以前的宗主制定休战协议。[our_overlord.GetName]获得对我们所有领土的宣称。"
 me_subject_independence.62.desc:0 "最令人瞩目的消息刚刚传来!来自[our_overlord.GetName]的消息已经传到了我们的耳朵里，他们已经接受了我们的要求!不再需要进贡或与[our_overlord.GetName]协商我们的事务。"
 me_subject_independence.62.t:0 "$gm_subject_independence_10a$：成功"
 me_subject_independence.63.a:0 "战争。战争已经来临。"
 me_subject_independence.63.at:0 "我们以寻求独立的战争目标向[our_overlord.GetName]宣战。任何承诺支持的盟友都将加入我们的阵营。"
 me_subject_independence.63.desc:0 "来自[our_overlord.GetName]的消息!他们拒绝了我们的要求，目前正在集结军队准备开战。他们承诺将我们压在脚下，将我们的妇女和儿童卖为奴隶，并为这一背叛行为在我们的田地里撒盐。"
 me_subject_independence.63.t:0 "$gm_subject_independence_10a$。战争是这样的"
 me_subject_independence.65.a:0 "终于自由了。"
 me_subject_independence.65.desc:0 "经过长达数月的艰苦战斗和数千人的死亡，我们已经取得了胜利![our_overlord.GetName]的军队被打败了，我们的独立统治再也不能被质疑了。现在是[unwilling_subject.GetName]决定自己命运的时候了。"
 me_subject_independence.65.t:0 "$gm_subject_independence_11a$"
 me_subject_independence.7.a:0 "让我们希望如此。"
 me_subject_independence.7.at_l:0 "军国主义派已经推动了他们的议程，离达成共识又近了一步。"
 me_subject_independence.7.at_r:0 "外交派已经推动了他们的议程，离达成共识又近了一步。"
 me_subject_independence.7.desc:0 "一方的领导人已经开始猜测可能的未来，向任何愿意听的人作出宏伟的承诺......当然，如果他喜欢的立场被采纳的话。"
 me_subject_independence.7.desc_l:0 "\n\n[selected_advisor.GetName]谈到了荣誉、在被征服的土地上的新机会和归还以前从我们这里拿走的宝物[our_overlord.GetName]。事情对每个人来说都会更好，所以他声称......"
 me_subject_independence.7.desc_r:0 "\n\n[selected_advisor.GetName]说的是和平、我们将获得的新特权和与[our_overlord.GetName]共同努力的新机会。他声称，事情对每个人来说都会更好。"
 me_subject_independence.7.t:0 "$gm_subject_independence_1$。做出承诺"
 me_subject_independence.70.a:0 "诸神偏爱勇敢的人。"
 me_subject_independence.70.at:0 "你的宗主已经通知你要走这条路。现在已经没有回头路了……"
 me_subject_independence.70.desc:0 "我们将起草一份对双方都有利的协议。[our_overlord.GetName]必须表明我们已经准备好掌握自己的命运。"
 me_subject_independence.70.t:0 "$gm_subject_independence_2b$"
 me_subject_independence.71.a:0 "密切关注此事。"
 me_subject_independence.71.at:0 "你的对象正计划以#Y 外交#! 方式获得他们的独立。"
 me_subject_independence.71.desc:0 "我们收到消息说，我们的一个臣民一直在吵着要独立的荒唐主张。目前情况似乎得到了控制，但麻烦可能正在酝酿。"
 me_subject_independence.71.t:0 "麻烦在蠢蠢欲动"
 me_subject_independence.72.a:0 "灿烂的。"
 me_subject_independence.72.desc:0 "我们为改善我们和[our_overlord.GetAdjective]们之间的关系做出了积极努力。[unwilling_subject.GetRuler.GetName]使许多不信教的人相信，我们在外交上的独立尝试将会成功。我们作为一个统一的国家而存在。"
 me_subject_independence.72.t:0 "$gm_subject_independence_3b$"
 me_subject_independence.73.a:0 "对未来的投资。"
 me_subject_independence.73.desc:0 "我们在[unwilling_subject.GetCapital.GetName]的首都得到了极大的改善。新的基础设施对于国家的中心来说是堪称典范的。我们的子孙后代将感谢我们今天的努力。"
 me_subject_independence.73.t:0 "$gm_subject_independence_5b$"
 me_subject_independence.75.a:0 "每个人都喜欢黄金。"
 me_subject_independence.75.at:0 "你将向[our_overlord.GetName]赠送黄金。\n然而，[selected_tax_man.GetName]将因为这个特殊的恩惠而失去一些忠诚度。"
 me_subject_independence.75.b:0 "一些额外的储备将是有益的。"
 me_subject_independence.75.bt:0 "你将赠送人力给[our_overlord.GetName]。\n然而，[selected_manpower_man.GetName]将因为这个特殊的恩惠而失去一些忠诚度。"
 me_subject_independence.75.c:0 "他的影响力可以派上用场。"
 me_subject_independence.75.ct:0 "你将向[our_overlord.GetName]赠送影响力。\n然而，[selected_influence_man.GetName]将因为这个特殊的恩惠而失去一些忠诚度。"
 me_subject_independence.75.d:0 "获得诸神的青睐是最好的礼物。"
 me_subject_independence.75.desc:0 "[our_overlord.GetName]仍然把我们当做一个附属国。让我们送给他们一些我们的商品和经验。这必将有助于他们欣赏我们的事业，并炫耀我们的自力更生。"
 me_subject_independence.75.desc_1:0 "\n\n我们可以要求[selected_tax_man.GetName]预留一些资金。这样的礼物会受到欢迎的。"
 me_subject_independence.75.desc_2:0 "\n\n我们可以派几个士兵作为[our_overlord.GetAdjective]的预备队。当然，[selected_manpower_man.GetName]可以作出安排。"
 me_subject_independence.75.desc_3:0 "\n\n我们可以让[selected_influence_man.GetName]协助[our_overlord.GetAdjective]的外交活动。有一点额外的经验会使他们受益匪浅。"
 me_subject_independence.75.desc_4:0 "\n\n我们可以请[selected_stab_man.GetName]为[our_overlord]探路。获得众神的祝福将为他们的国家提供一些受欢迎的稳定。"
 me_subject_independence.75.dt:0 "[our_overlord.GetName]将获得稳定。\n然而，[selected_stab_man.GetName]将因为这个特殊的恩惠而失去一些忠诚。"
 me_subject_independence.75.e:0 "他们已经有了足够的东西。"
 me_subject_independence.75.t:0 "$gm_subject_independence_6b$"
 me_subject_independence.76.a:0 "很好。"
 me_subject_independence.76.desc:0 "[selected_tax_man.GetName]勉为其难地提供了一些额外的资金，送给[our_overlord.GetName]。很明显，[selected_tax_man.GetSheHe]对此并不高兴。"
 me_subject_independence.76.t:0 "$gm_subject_independence_6b$。金子的礼物"
 me_subject_independence.77.a:0 "很好。"
 me_subject_independence.77.desc:0 "[selected_manpower_man.GetName]已经下令让我们的一些人力为[our_overlord.GetName]所用。然而，你可以从[selected_tax_man.GetHerHis]的眼中看到，这种不合理的要求不会被遗忘。"
 me_subject_independence.77.t:0 "$gm_subject_independence_6b$。人力的馈赠"
 me_subject_independence.78.a:0 "灿烂的。"
 me_subject_independence.78.desc:0 "[selected_influence_man.GetName]在一些压力下同意协助[our_overlord.GetAdjective]国处理他们的事务。也许我们把[selected_influence_man.GetHerHim]推得太远了。"
 me_subject_independence.78.t:0 "$gm_subject_independence_6b$。影响力的礼物"
 me_subject_independence.79.a:0 "赞美诸神。"
 me_subject_independence.79.desc:0 "在与我们的[selected_stab_man.GetTitle][selected_stab_man.GetName]进行了长时间的坚持不懈的讨论后，他得出结论，神灵一定是在保佑[our_overlord.GetAdjective]的道路。这将在一定程度上增加他们的内部稳定性，但[selected_stab_man.GetFirstName]看起来并不高兴被逼到这种境地。他将来可能会以此来对付我们。"
 me_subject_independence.79.t:0 "$gm_subject_independence_6b$。稳定的礼物"
 me_subject_independence.80.a:0 "很好。"
 me_subject_independence.80.desc:0 "[unwilling_subject.GetName]赠送了我们一些黄金。这将加强[our_overlord.GetAdjective]的经济。"
 me_subject_independence.80.t:0 "黄金的礼物"
 me_subject_independence.81.a:0 "很好。"
 me_subject_independence.81.desc:0 "我们收到消息，一些[unwilling_subject.GetAdjective]的储备可供我们使用。我们的军队对这一辉煌的礼物表示感谢。"
 me_subject_independence.81.t:0 "人力的馈赠"
 me_subject_independence.82.a:0 "辉煌的。"
 me_subject_independence.82.desc:0 "一位[unwilling_subject.GetAdjective]公民，[selected_influence_man.GetName]，提供了一些建议，以改善[our_overlord.GetAdjective]国家的机制。"
 me_subject_independence.82.t:0 "影响力的馈赠"
 me_subject_independence.83.a:0 "赞美诸神。"
 me_subject_independence.83.desc:0 "[unwilling_subject.GetName]的祭司们已经看到我们得到了诸神的青睐。我们的内部稳定肯定会从这一神圣的确认中受益。"
 me_subject_independence.83.t:0 "稳定的礼物"
 me_subject_independence.85.a:0 "我们可以找到一些志愿者。"
 me_subject_independence.85.at:0 "我们将可以从几个人物中选择，与[our_overlord.GetName]交换。"
 me_subject_independence.85.b:0 "政治联姻可能是有利的。"
 me_subject_independence.85.bt:0 "我们将与每个国家的统治者家族的人物启动政治婚姻。"
 me_subject_independence.85.desc:0 "如果一个[our_overlord.GetName]加入[unwilling_subject.GetAdjective]宫廷，我们与[our_overlord.GetAdjective]的关系将大大加强。他们的技能可以为我们的宗主国带来好处，使我们更加亲近。"
 me_subject_independence.85.desc_1:0 "\n\n由于[our_overlord.GetName]是一个君主制国家，与皇室联姻可以带来更大的好处。这是值得考虑的。"
 me_subject_independence.85.t:0 "$gm_subject_independence_4b$"
 me_subject_independence.86.a:0 "[subject_char_martial.GetFirstName]是最佳人选。"
 me_subject_independence.86.at:0 "派出一个以#Y 武术#! 为最佳技能的人物。"
 me_subject_independence.86.b:0 "最佳选择是[subject_char_finesse.GetFirstName]。"
 me_subject_independence.86.bt:0 "派出一个以#Y 精巧#! 为最佳技能的人物。"
 me_subject_independence.86.c:0 "[subject_char_charisma.GetFirstName]的论点很有说服力。"
 me_subject_independence.86.ct:0 "派出一个拥有#Y 魅力#! 的人物作为最佳技能。"
 me_subject_independence.86.d:0 "没有什么能胜过[subject_char_zeal.GetFirstName]的奉献精神。"
 me_subject_independence.86.desc:0 "有几个人主动提出要搬到[our_overlord.GetName]。他们提出的理由并不重要，他们愿意做出牺牲，抛下家庭和国家。我们能错过谁呢？"
 me_subject_independence.86.dt:0 "派出一个拥有#Y 热诚#! 的人物作为最佳技能。"
 me_subject_independence.86.t:0 "$gm_subject_independence_4b$。志愿者"
 me_subject_independence.87.a:0 "让我们开始吧。"
 me_subject_independence.87.at:0 "你将请求[our_overlord.GetName]批准这场政治婚姻。"
 me_subject_independence.87.desc:0 "尊敬古老的传统，通过婚姻将家庭融合在一起，这将使我们比以往任何时候都更亲密。[subject_wife.GetName]是[unwilling_subject.GetRuler.GetName]的一个远房表妹。在她年轻的时候，她是这场婚姻的最佳人选。[our_overlord.GetAdjective]国王甚至可能自己喜欢上她。我们等待着他们的批准。"
 me_subject_independence.87.t:0 "$gm_subject_independence_4b$。政治联姻"
 me_subject_independence.88.a:0 "[overlord_char_martial.GetFirstName]是最佳人选。"
 me_subject_independence.88.at:0 "发送一个以#Y 武术#! 为最佳技能的人物。"
 me_subject_independence.88.b:0 "最佳选择是[overlord_char_finesse.GetFirstName]。"
 me_subject_independence.88.bt:0 "派出一个以#Y 精巧#! 为最佳技能的人物。"
 me_subject_independence.88.c:0 "[overlord_char_charisma.GetFirstName]的论点很有说服力。"
 me_subject_independence.88.ct:0 "派出一个拥有#Y 魅力#! 的人物作为最佳技能。"
 me_subject_independence.88.d:0 "没有什么能胜过[overlord_char_zeal.GetFirstName]的奉献精神。"
 me_subject_independence.88.desc:0 "我们的当事人[unwilling_subject.GetName]给我们送来了[selected_exch_char.GetName]。显然，[selected_exch_char.GetSheHe]是自愿参加的，认为他们最好的未来是在我们这里。我们是否应该要求一个志愿者来回报我们的帮助？"
 me_subject_independence.88.dt:0 "派出一个拥有#Y zeal#! 的角色作为最佳技能。"
 me_subject_independence.88.e:0 "我们不欠他们什么。"
 me_subject_independence.88.t:0 "一个来自[unwilling_subject.GetName]的人物来到这里"
 me_subject_independence.89.a:0 "[subject_wife.GetFirstName]将成为我的女王"
 me_subject_independence.89.b:0 "[overlord_husband_1.GetFirstName]是个好对象。"
 me_subject_independence.89.c:0 "一个远房亲戚也行。"
 me_subject_independence.89.ct:0 "你家族的一个新人物将加入你的宫廷。"
 me_subject_independence.89.d:0 "这有什么意义？"
 me_subject_independence.89.desc:0 "来自[unwilling_subject.GetName]的请求已经到来。他们提议我们的统治家族联合起来，并选择了可爱的[subject_wife.GetName]作为新娘。现在，谁会成为她的好丈夫？"
 me_subject_independence.89.t:0 "联姻提议"
 me_subject_independence.90.a:0 "很好。"
 me_subject_independence.90.desc:0 "看起来[our_overlord.GetName]也效仿了我们的做法。一个[our_overlord.GetAdjective]已经来到[unwilling_subject.GetName]。[selected_exch_char.GetName]将为我们提供良好的服务。"
 me_subject_independence.90.t:0 "$gm_subject_independence_4b$。一个人物的到来"
 me_subject_independence.91.a:0 "太糟糕了。"
 me_subject_independence.91.desc:0 "看起来[our_overlord.GetName]没有效仿我们的做法。今天没有[our_overlord.GetAdjective]加入我们的法庭。"
 me_subject_independence.91.t:0 "$gm_subject_independence_4b$：无事发生"
 me_subject_independence.92.a:0 "欢欣鼓舞。"
 me_subject_independence.92.desc:0 "[subject_wife.GetName]与[overlord_husband.GetName]的婚礼盛况空前。来自[our_overlord.GetName]各地的人们纷纷前来共庆这场盛宴。新人佳偶天成，必将成为令人敬畏的权势伴侣。"
 me_subject_independence.92.t:0 "$gm_subject_independence_4b$。一对快乐的夫妇"
 me_subject_independence.93.a:0 "太糟糕了。"
 me_subject_independence.93.desc:0 "不幸的是，[our_overlord.GetRuler.GetName]已经拒绝了我们国家之间的联合提议。我们对这一结果感到非常失望。[subject_wife.GetName]将不得不自己寻找丈夫，但令人怀疑的是，她会有一段艰难的日子。"
 me_subject_independence.93.t:0 "$gm_subject_independence_4b$。被拒绝"
 me_subject_independence.95.a:0 "人人都喜欢黄金。"
 me_subject_independence.95.desc:0 "[unwilling_subject.GetRuler.GetName]已经把他的一些个人财富赠送给[our_overlord.GetRuler.GetName]。这肯定会动摇[our_overlord.GetRuler.GetHerHim]，使其以我们的方式看待问题。"
 me_subject_independence.95.t:0 "$gm_subject_independence_7b$"
 me_subject_independence.96.a:0 "一个好朋友。"
 me_subject_independence.96.desc:0 "我们的统治者[unwilling_subject.GetRuler.GetName]和[our_overlord.GetAdjective]统治者[our_overlord.GetRuler.GetName]之间的友谊是[unwilling_subject.GetName]和[our_overlord.GetName]之间直接沟通的良好进展。它甚至提升了[unwilling_subject.GetRuler.GetFirstName]的地位。每个[unwilling_subject.GetAdjective]都知道[unwilling_subject.GetRuler.GetHerHis]的名字。"
 me_subject_independence.96.t:0 "$gm_subject_independence_8b$"
 overlord_neg_opmod:0 "对象希望独立"
 proposal_neg_opmod:0 "拒绝独立建议"
 proposal_pos_opmod:0 "接受的独立建议"
 shared_wealth_pos_opmod:0 "分享他们的财富"
 sneaky_fellow_subject_pos_opmod:0 "共同宣布独立"
 sneaky_overlord_neg_opmod:0 "破坏了我们"
 ultimatum_neg_opmod:0 "发出最后通牒"
 visiting_foreign_citizen:0 "来访的外国人"

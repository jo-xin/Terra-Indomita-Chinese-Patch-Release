l_simp_chinese:
 EBRO_CONFEDERATION:0 "埃布罗邦联"
 EBRO_CONFEDERATION_ADJ:0 "埃布罗邦联的"
 NICKNAME_FIRE:0 "“烈焰山脉之王”"
 NICKNAME_FIRE_Q:0 "“烈焰山脉女王”"
 VASCONIAN_EBRO_WAR:0 "伊勒格提亚"
 VASCONIAN_EBRO_WAR_ADJECTIVE:0 "伊勒格提亚"
 arditurri_mines:0 "阿尔迪图里矿场"
 capital_stronghold:0 "首都要塞"
 chief_city:0 "瓦斯科尼亚的主城"
 identity_of_vasconia:0 "瓦斯科尼亚身份"
 love_of_mari:0 "玛丽的爱"
 mari_happy:0 "每个#Y 玛丽特#!宗教的国家将对[THIS.GetCountry.GetName]的好感度增加#G 30#!点。"
 me_vasconian_1.a:0 "知道我们的边境受到保护，我们可以安然入睡"
 me_vasconian_10.a:0 "告诉战士们专注于进攻和打击敌人"
 me_vasconian_10.b:0 "我们将希望寄托在强大的防御上"
 me_vasconian_10_desc:0 "现在我们通过在#E 塔拉科嫩西斯#!各地建造的军营和训练营补充了[ROOT.GetCountry.GetAdjective]的人力水平，我们的军事顾问希望立即为我们的部队实施特殊训练计划。\n\n我们的军队应该专注于什么？专注于进攻有其优点，但强大的防御可能更重要——[ROOT.GetCountry.GetRuler.GetName]必须做出决定。"
 me_vasconian_10_title:0 "山地训练"
 me_vasconian_11.a:0 "面包——还有什么比这对我们持续增长更重要？"
 me_vasconian_11_desc:0 "[GetProvince('(int32)1071').GetName]和[GetProvince('(int32)1070').GetName]出产的粮食对我们的国家至关重要，尽管我们可以通过其他地区的农产品养活人民，但众所周知，这两片土地构成了[ROOT.GetCountry.GetName]的粮仓。\n\n幸运的是，[ROOT.GetCountry.GetRuler.GetName]已确保这些重要的农田能够胜任养活我们国家的任务。"
 me_vasconian_11_title:0 "瓦斯科尼亚农田"
 me_vasconian_12.a:0 "巴斯昆人与瓦斯科尼亚人永远是朋友"
 me_vasconian_12_desc:0 "现在我们已成为真正的#Y 地区强国#!，[ROOT.GetCountry.GetRuler.GetName]已将[ROOT.GetCountry.GetRuler.GetHerHis]注意力转向我们领土内的一些强大部落。\n\n所有人都听说过#E 巴斯昆人#!，那些热爱金钱、喜欢铸造自己货币的氏族。[ROOT.GetCountry.GetRuler.GetFirstName]没有将这个高贵的氏族视为竞争来源，而是全心全意地拥抱他们。\n\n我们卓越的[ROOT.GetCountry.GetRulerTitle]意识到，一个多样的社会只会使整个[ROOT.GetCountry.GetName]更加强大。"
 me_vasconian_12_title:0 "召集所有巴斯昆人"
 me_vasconian_13.a:0 "我是烈焰山脉的主人……我无所不能"
 me_vasconian_13_desc:0 "长久之后，当山脉崩塌，海洋蒸发，[ROOT.GetCountry.GetRuler.GetName]的威力和权威仍将屹立，因为我们的[ROOT.GetCountry.GetRulerTitle]建立了一个将永恒存在的王国。\n\n谁能与[ROOT.GetCountry.GetRuler.GetFirstName]相比，谁又能希望战胜[ROOT.GetCountry.GetName]的军队？如同喷发的火山，[ROOT.GetCountry.GetRuler.GetFirstName]的愤怒无处不在，极具破坏力，震撼着大地的根基！"
 me_vasconian_13_title:0 "比利牛斯霸权"
 me_vasconian_14.a:0 "这肯定比回复信件有趣得多"
 me_vasconian_14_desc:0 "[ROOT.GetCountry.GetRuler.GetName]决定在[ROOT.GetCountry.GetCapital.GetName]的市场中度过一段难得的自由时光。\n\n希望不被人群发现，[ROOT.GetCountry.GetRuler.GetSheHe]披上一件连帽长袍，悄悄走进城市街道。"
 me_vasconian_14_title:0 "巴斯昆人的身份"
 me_vasconian_15.a:0 "我想知道这到底是怎么回事……"
 me_vasconian_15_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]有消息称，#E 伊勒格提亚#!地区的动荡有失控的危险……我们应该密切关注局势。"
 me_vasconian_15_title:0 "埃布罗的真正领主"
 me_vasconian_16.a:0 "你们到了这里就会知道原因……"
 me_vasconian_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已向整个[ROOT.GetCountry.GetName]派遣使者，要求所有部落酋长聚集在[ROOT.GetCountry.GetCapital.GetName]召开特别会议。"
 me_vasconian_16_title:0 "埃布罗联邦"
 me_vasconian_17.a:0 "追求和平手段永远不是坏事，对吧？"
 me_vasconian_17.b:0 "我们的征召兵需要战斗经验……必须是战争"
 me_vasconian_17_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的部落酋长会议已经结束，在所有意见讨论后，问题归结为两个选择：和平还是战争。\n\n我们可以尝试通过派遣使节来展现我们的外交力量，看看他们是否有兴趣成为我们的附庸。当然，[ROOT.GetCountry.GetAdjective]部落中有很多人希望派我们的战士进入瓦杜利亚的定居点。决定性的投票必须由[ROOT.GetCountry.GetRuler.GetName]做出。"
 me_vasconian_17_title:0 "瞄准大西洋"
 me_vasconian_18.a:0 "我们焦急地等待他们的答复……"
 me_vasconian_18.b:0 "我们焦急地等待他们的答复……"
 me_vasconian_18.c:0 "我们焦急地等待他们的答复……"
 me_vasconian_18_desc:0 "现在我们已决定与瓦杜利亚人追求和平，我们在[ROOT.GetCountry.GetCapital.GetName]组建了一个使团。我们将为外交官装满精美的[ROOT.GetCountry.GetAdjective]货物，举行适当的祭祀，然后将他们送到邻居的土地上。\n\n我们希望他们能带回令人兴奋的消息，但现在一切都掌握在神的手中。"
 me_vasconian_18_title:0 "瞄准大西洋"
 me_vasconian_19.a:0 "那就必须是战争！"
 me_vasconian_19_desc:0 "#E 瓦杜利亚人#!需要学会如何控制他们的言辞，因为如果他们不小心，他们的夸夸其谈可能会给他们带来麻烦。\n\n他们侮辱了我们的外交官，对我们可怜的人大肆辱骂并威胁他们的生命——不用说，我们短期内看不到他们向我们臣服。"
 me_vasconian_19_title:0 "瞄准大西洋"
 me_vasconian_1_desc:0 "现在我们在新城市[GetProvince('(int32)1076').GetName]的防御工事已经完工，我们的驻军一直在守卫#E 比利牛斯隘口#!，每隔几小时就有一组士兵巡逻山脉。\n\n从伊阿卡的高处，我们的士兵能够俯瞰下面的山谷——这些时刻保持警惕的战士几乎不可能被偷袭，他们活着就是为了保护[ROOT.GetCountry.GetName]的边境。"
 me_vasconian_1_title:0 "比利牛斯隘口"
 me_vasconian_2.a:0 "这是一个不可轻率做出的决定……"
 me_vasconian_20.a:0 "瓦斯科尼亚的彻底胜利！"
 me_vasconian_20_desc:0 "#E 瓦杜利亚人#!已经倾听了我们的话，并同意了我们的要求——他们将成为我们的附庸，并在他们的首都[GetProvince('(int32)1083').GetName]举行盛宴以庆祝这一时刻。"
 me_vasconian_20_title:0 "瞄准大西洋：最终"
 me_vasconian_21.a:0 "我们为什么要向一个比我们弱的部落屈服？"
 me_vasconian_21.b:0 "我们真的想要战争吗？让我们同意他们的要求"
 me_vasconian_21_desc:0 "我们接待了来自[GetProvince('(int32)1016').GetName]的外交官，他们带来了部落酋长的提议。\n\n#E 瓦斯科尼亚人#!正在积极推行激进的外交政策，希望获得通往#E 坎塔布连海#!的通道，请求我们同意成为他们的附庸。尽管没有明说任何威胁，但我们感觉这只是他们的形式——如果我们不同意他们的奴役，他们无疑会试图强加枷锁……我们需要小心。"
 me_vasconian_21_title:0 "瞄准大西洋"
 me_vasconian_22.a:0 "我们要把他们埋葬！"
 me_vasconian_22_desc:0 "瓦杜利亚人对我们的提议做出了回应，而且态度相当无礼——显然，他们不仅不愿成为我们的附庸，甚至对与我们保持友好关系也没有兴趣。\n\n我们的军队很快就会再次相遇……"
 me_vasconian_22_title:0 "瞄准大西洋：最终"
 me_vasconian_23.a:0 "他们比我们原先想的更明智——很好"
 me_vasconian_23_desc:0 "来自[GetProvince('(int32)1083').GetName]的绝佳消息！懦弱的瓦杜利亚人权衡了他们的选择，决定终生为奴好过死在[ROOT.GetCountry.GetAdjective]征召兵手中——他们将成为我们的附庸！"
 me_vasconian_23_title:0 "瞄准大西洋：最终"
 me_vasconian_24.a:0 "我们将允许他们保持名义上的独立"
 me_vasconian_24.b:0 "他们必须与[ROOT.GetCountry.GetCapital.GetName]建立更密切的联系"
 me_vasconian_24_desc:0 "经过几周的审议，[ROOT.GetCountry.GetRuler.GetName]宣布[ROOT.GetCountry.GetRuler.GetSheHe]已就山地民族的地位做出了决定。\n\n虽然我们的社区之间关系一直友好，但现在是时候巩固这种模糊关系的时候了。"
 me_vasconian_24_title:0 "山地民族"
 me_vasconian_25.a:0 "山地民族忠诚，这才是我关心的"
 me_vasconian_25_desc:0 "山地部落向[ROOT.GetCountry.GetRuler.GetName]表达了感谢，重申他们对[ROOT.GetCountry.GetName]的忠诚誓言，并承诺如果需要，他们将协助国家。\n\n虽然一些人哀叹失去了拉近山地民族的机会，但[ROOT.GetCountry.GetRuler.GetFirstName]对[ROOT.GetCountry.GetRuler.GetHerHis]决定完全感到平静。"
 me_vasconian_25_title:0 "山地民族"
 me_vasconian_26.a:0 "我们是一个民族，一个国家……在我的统治下"
 me_vasconian_26_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的命令被山地部落平静地接受，他们同意结束隔离，拥抱国家[ROOT.GetCountry.GetAdjective]身份。他们的社区对外开放，来自[GetProvince('(int32)1016').GetName]的旅行者频繁前往高地。\n\n这对[ROOT.GetCountry.GetRuler.GetFirstName]来说是一场惊艳的胜利，将我们的同胞拉得更近——[ROOT.GetCountry.GetName]的社会结构从未如此紧密。"
 me_vasconian_26_title:0 "山地民族"
 me_vasconian_27.a:0 "告诉士兵们准备战斗，立即派他们出去"
 me_vasconian_27_desc:0 "我们的侦察兵报告，伊塞塔尼的征召兵正在行动！他们似乎希望对我们的领土发动牲畜掠夺，但他们的士兵装备精良，可能是发动入侵。\n\n我们必须集结部队，召集防御！"
 me_vasconian_27_title:0 "突袭伊塞塔尼"
 me_vasconian_28.a:0 "我们别无选择……必须谈判"
 me_vasconian_28.b:0 "我们必须趁着出其不意的优势立即进攻！"
 me_vasconian_28_desc:0 "经过几天的追踪，我们的[ROOT.GetCountry.GetAdjective]征召兵成功追捕到伊塞塔尼的掠袭队伍，他们的数量惊人——他们的人数轻易超过我们的四倍。\n\n面对如此压倒性的优势，营地中有人恳求[ROOT.GetCountry.GetRuler.GetName]提出和平条款，但其他人认为这是软弱，想要发动攻击。"
 me_vasconian_28_title:0 "突袭伊塞塔尼"
 me_vasconian_29.a:0 "希望谈判能成功……"
 me_vasconian_29_desc:0 "‘拿上这些金币，看看伊塞塔尼人是否会接受钱财离开我们’。[ROOT.GetCountry.GetRuler.GetName]将一个沉重的袋子递给一名头盔士兵，士兵迅速点头，转向征召兵。发出行军的信号，士兵们片刻后消失在森林中。"
 me_vasconian_29_title:0 "突袭伊塞塔尼"
 me_vasconian_2_desc:0 "如果我们想要畅通无阻地进入#E 坎塔布连海#!——[ROOT.GetCountry.GetRuler.GetName]显然是这么想的——那么我们有一个问题；#E 瓦杜利亚#!部落挡住了我们的去路。\n\n必须采取行动……我们需要决定是对瓦杜利亚人采取和平还是暴力手段。我们必须到达大西洋！\n\n在[ROOT.GetCountry.GetCapital.GetName]召集了战争会议，[ROOT.GetCountry.GetName]的部落酋长们将发表他们的意见。"
 me_vasconian_2_title:0 "瞄准大西洋"
 me_vasconian_3.a:0 "我必须对此深思熟虑……"
 me_vasconian_30.a:0 "我对我们彻底战胜这些蛮族的胜利充满信心"
 me_vasconian_30_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，[ROOT.GetCountry.GetRuler.GetHerHis]脸和身体涂满蓝靛，站在我们的征召兵前列，悄无声息地穿过灌木丛，朝伊塞塔尼掠袭者的营地前进。\n\n片刻之内，我们的[ROOT.GetCountry.GetAdjective]士兵将扑向毫无防备的蛮族！"
 me_vasconian_30_title:0 "突袭伊塞塔尼"
 me_vasconian_31.a:0 "我始终首先追求和平——我不在乎别人怎么说"
 me_vasconian_31_desc:0 "令人好奇的是，伊塞塔尼掠袭者拒绝了我们的礼物，反而请求我们接受他们作为附庸进入我们的领土。\n\n似乎他们的酋长之间的政治不稳定导致部落的一个分支放弃了他们的家园，我们的[ROOT.GetCountry.GetAdjective]侦察兵误以为他们要攻击我们的领土。\n\n虽然一些人对[ROOT.GetCountry.GetRuler.GetName]向这些外来者伸出橄榄枝感到不满，但无人能否认没有流血，我们的人数增加了。"
 me_vasconian_31_title:0 "突袭伊塞塔尼：最终"
 me_vasconian_32.a:0 "为了胜利！全体向[ROOT.GetCountry.GetName]致敬！"
 me_vasconian_32_desc:0 "尽管伊塞塔尼人激烈抵抗战斗，确实有几次似乎掠袭者将占据上风，但我们的部队最终取得了胜利，尽管代价巨大。\n\n然而，胜利就是胜利，所有人都对[ROOT.GetCountry.GetRuler.GetName]的武力威慑感到敬畏，他能够击败比我们更大的军队。"
 me_vasconian_32_title:0 "突袭伊塞塔尼：最终"
 me_vasconian_33.a:0 "我同意这个想法——当然可以"
 me_vasconian_33.b:0 "不，我看不出有什么意义"
 me_vasconian_33_desc:0 "一些贵族拜访了[ROOT.GetCountry.GetRuler.GetName]，请求[ROOT.GetCountry.GetRulerTitle]拨款建设一座图书馆。\n\n随着我们的权力和地位增长，官僚机构也在扩大，上层阶级希望确保我们有地方存储商业交易记录。"
 me_vasconian_33_title:0 "瓦斯科尼亚的主城：图书馆"
 me_vasconian_34.a:0 "多么绝妙的主意——我惊讶自己怎么没想到"
 me_vasconian_34.b:0 "不幸的是，我们现在没有这笔钱"
 me_vasconian_34_desc:0 "受到成功请求的鼓舞，贵族们小心翼翼地向我们的[ROOT.GetCountry.GetRulerTitle]提出一个谦卑的请求——[ROOT.GetCountry.GetName]是否有资金再建一个市场？"
 me_vasconian_34_title:0 "瓦斯科尼亚的主城：市场"
 me_vasconian_35.a:0 "我会支付市场建设的费用，好的"
 me_vasconian_35.b:0 "他们以为金币是从我屁股里掉出来的吗？告诉他们不行！"
 me_vasconian_35_desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]不同意资助图书馆，但这并未阻止我们的贵族继续试探运气——这一次，他们想知道[ROOT.GetCountry.GetName]能否拨款建设一个新市场。"
 me_vasconian_35_title:0 "瓦斯科尼亚的主城：市场"
 me_vasconian_36.a:0 "一个绝妙的主意——这里是钱，现在就去做"
 me_vasconian_36.b:0 "抱歉，但我没有这笔预算"
 me_vasconian_36_desc:0 "看来[ROOT.GetCountry.GetAdjective]贵族认为[ROOT.GetCountry.GetRuler.GetName]的口袋深不见底，因为现在他们向我们的[ROOT.GetCountry.GetRulerTitle]送信，询问是否有可能在[GetProvince('(int32)1078').GetName]建造一个论坛。"
 me_vasconian_36_title:0 "瓦斯科尼亚的主城：广场"
 me_vasconian_37.a:0 "他们让我屈服了……告诉他们我同意"
 me_vasconian_37.b:0 "我最终会建一个论坛，但现在，答案是不行"
 me_vasconian_37_desc:0 "永远乐观的贵族们再次请求[ROOT.GetCountry.GetRuler.GetName]为[GetProvince('(int32)1078').GetName]拨款，这一次是为了建造一个论坛。我们的人民无论如何都在镇中心聚集，一个合适的设施将对居民大有裨益。"
 me_vasconian_37_title:0 "瓦斯科尼亚的主城：广场"
 me_vasconian_38.a:0 "我为我的人民做了一件伟大的事……"
 me_vasconian_38_desc:0 "现在[GetProvince('(int32)1078').GetName]的建设终于结束，这座城市迅速成为瓦斯科尼亚的主城，在某些方面甚至超过了[ROOT.GetCountry.GetCapital.GetName]。\n\n来到庞佩洛的访客常常在进入城门时目瞪口呆，觉得自己身处#E 希腊#!的古老城市，而不是瓦斯科尼亚丘陵中一座新建的城镇。"
 me_vasconian_38_title:0 "瓦斯科尼亚的主城：最终"
 me_vasconian_39.a:0 "我还记得那种纯真的感觉吗？"
 me_vasconian_39_desc:0 "片刻后，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetCapital.GetName]的街道上观察人群，一个奇特的景象让[ROOT.GetCountry.GetRulerTitle]停下脚步。\n\n靠着墙，一个乞女坐着睡着了，皱巴巴的手拿着一个小木杯，希望得到施舍。旁边，一个小孩在泥土中玩耍，用树枝当玩具，哼着轻柔的曲调。显然他们一无所有，但看起来很快乐。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]突然感到胸口一阵刺痛，充满情感。将一枚金币放入乞女的碗中，[ROOT.GetCountry.GetRuler.GetSheHe]默默走开，无法忘记那个玩耍的孩子。"
 me_vasconian_39_title:0 "巴斯昆人的身份"
 me_vasconian_3_desc:0 "北方的山地民族以自己的方式生活，对外来者充满怀疑，尽管他们是[ROOT.GetCountry.GetName]的忠诚公民，但人们认为他们可以为我们的国家做更多贡献。\n\n然而，我们需要做出决定；我们应该寻求与他们建立更密切的关系以中央集权，还是让他们继续按原来的方式生活？"
 me_vasconian_3_title:0 "山地民族"
 me_vasconian_4.a:0 "愿战神与我们同在！"
 me_vasconian_40.a:0 "我以前为什么没这样做过？"
 me_vasconian_40_desc:0 "感觉喉咙里莫名地哽咽，[ROOT.GetCountry.GetRuler.GetName]继续在[ROOT.GetCountry.GetCapital.GetName]中行走。巷子里传来笑声，煮粥的香味让[ROOT.GetCountry.GetRuler.GetFirstName]的肚子咕咕作响。\n\n钻进一家小酒馆，[ROOT.GetCountry.GetRuler.GetFirstName]支付了几枚铜币，坐在桌旁，吃着简单的炖菜，喝着兑水的酒，聆听周围的交谈。\n\n令[ROOT.GetCountry.GetRuler.GetHerHis]惊讶的是，[ROOT.GetCountry.GetRulerTitle]意识到这些人不是瓦斯科尼亚人，而是阿基坦尼人——他们的口音暴露了这一点。\n\n好奇的是，[ROOT.GetCountry.GetRuler.GetFirstName]意识到[ROOT.GetCountry.GetRuler.GetSheHe]从未在现实中见过阿基坦尼人。[ROOT.GetCountry.GetRuler.GetFirstName]在友好的闲聊中愉快地吃完饭，享受店内的愉快气氛。"
 me_vasconian_40_title:0 "巴斯昆人的身份"
 me_vasconian_41.a:0 "我应该邀请更多阿基坦尼人加入我们的国家，因为他们是好人"
 me_vasconian_41.b:0 "我钦佩巴斯昆文化，但我为身为瓦斯科尼亚人感到骄傲"
 me_vasconian_41_desc:0 "[ROOT.GetCountry.GetRuler.GetName]当晚回到家中，[ROOT.GetCountry.GetRuler.GetHerHis]脑海中充满了当天的景象和声音。尽管筋疲力尽，[ROOT.GetCountry.GetRuler.GetSheHe]无法停止思考巴斯昆人，以及他们与我们[ROOT.GetCountry.GetAdjective]人民有多么相似。\n\n一个念头进入[ROOT.GetCountry.GetRuler.GetHerHis]脑海……"
 me_vasconian_41_title:0 "巴斯昆人的身份：最终"
 me_vasconian_42.a:0 "尽我们所能平息他们的情绪"
 me_vasconian_42.b:0 "我不会被这些愚蠢的人吓倒"
 me_vasconian_42_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，#E 伊勒格提亚#!地区的人民感到被我们瓦斯科尼亚人忽视和压制，他们指责我们想要统治邻居的土地，却不让任何人分享这片土地的自然财富。\n\n如果我们不采取措施，这可能会成为一个问题……"
 me_vasconian_42_title:0 "埃布罗的真正领主"
 me_vasconian_43.a:0 "好吧，烦人——再给他们送点东西"
 me_vasconian_43.b:0 "我已经给了他们我愿意给的一切"
 me_vasconian_43_desc:0 "虽然听到这个消息令人沮丧，但#E 伊勒格提亚人#!拒绝了[ROOT.GetCountry.GetRuler.GetName]向他们提出的提议，声称这是侮辱，远远不够。\n\n我们还有一次和平解决此事的机会。"
 me_vasconian_43_title:0 "埃布罗的真正领主"
 me_vasconian_44.a:0 "我们将对他们毫不留情！"
 me_vasconian_44_desc:0 "难以置信！东方的背信弃义的#E 伊勒格提亚人#!宣布独立，正在向[ROOT.GetCountry.GetCapital.GetName]进军！我们必须在战场上制服他们，否则一切都将失去！"
 me_vasconian_44_title:0 "埃布罗的真正领主：最终"
 me_vasconian_45.a:0 "我很快将发表演讲……"
 me_vasconian_45_desc:0 "现在[ROOT.GetCountry.GetAdjective]社会的精英们已聚集在[ROOT.GetCountry.GetCapital.GetName]附近，[ROOT.GetCountry.GetRuler.GetName]命令所有人到要塞中等候[ROOT.GetCountry.GetRuler.GetHerHim]。\n\n今晚，一切终将揭晓。"
 me_vasconian_45_title:0 "埃布罗联邦"
 me_vasconian_46.a:0 "全体向#E 埃布罗联邦#!致敬！"
 me_vasconian_46_desc:0 "‘[ROOT.GetCountry.GetName]已死。’[ROOT.GetCountry.GetRuler.GetName]的话沉重地悬在空中，引发会场一片震惊的喘息。\n\n‘如蝴蝶从茧中破出，我们的国家已转变为比以往更伟大的存在。’转向房间里聚集的睿智长者，[ROOT.GetCountry.GetRuler.GetHerHis]声音逐渐高昂，[ROOT.GetCountry.GetRuler.GetFirstName]向天空举起胜利的拳头。\n\n‘我召集你们在此宣布我们最伟大的时刻——为了确保我们人民的安全和持续稳定，#E 瓦斯科尼亚#!的权威将重组为一个部落联邦！’\n\n当卫兵站在[ROOT.GetCountry.GetRuler.GetFirstName]身后，演讲继续。‘我们将以武力捍卫我们的边境。我们不会对敌人让步，将团结一致，对抗来自内部或外部的攻击。让我们的敌人注意；那些挑战我们决心的人将被粉碎。’"
 me_vasconian_46_title:0 "埃布罗联邦"
 me_vasconian_4_desc:0 "现在[GetProvince('(int32)1076').GetName]的训练营已经建成，我们的征召兵始终处于备战状态。我们不断听到有陌生侦察队在试探我们边境的报告，我们的间谍认为攻击可能即将来临。\n\n幸运的是，我们已经为任何可能发生的事情做好了准备。"
 me_vasconian_4_title:0 "突袭伊塞塔尼"
 me_vasconian_5.a:0 "我们欢迎所有希望生活在我国人民中的人"
 me_vasconian_5_desc:0 "相信与[ROOT.GetCountry.GetAdjective]人民的友谊对所有邻居都有吸引力，[ROOT.GetCountry.GetRuler.GetName]已向四面八方派遣使者，特别是在我们北方的#E 阿基坦尼#!部落的土地上。\n\n这一外交行动显然已经取得了回报，因为我们得知许多北方人正迁移到[ROOT.GetCountry.GetName]，希望为自己寻找更好的生活。"
 me_vasconian_5_title:0 "与阿基坦尼接触"
 me_vasconian_6.a:0 "无论昼夜，任何该地区的变化都要向我汇报"
 me_vasconian_6_desc:0 "[GetProvince('(int32)1078').GetName]发现的铁矿品质极佳，现在我们拥有了这片领土，[ROOT.GetCountry.GetRuler.GetName]已明确表示[ROOT.GetCountry.GetRuler.GetSheHe]希望将这份财富用于[ROOT.GetCountry.GetName]的人民。\n\n现在我们有时间关注庞佩洛，我们将尽一切努力使这一地区繁荣。"
 me_vasconian_6_title:0 "瓦斯科尼亚的主城"
 me_vasconian_7.a:0 "现在没有人能够攻陷卡拉古里斯……"
 me_vasconian_7_desc:0 "在[GetProvince('(int32)1016').GetName]聚集的工人们的凿子和锤子终于被搁置，因为[ROOT.GetCountry.GetRuler.GetName]主持的宏伟建设工程终于完工。\n\n卡拉古里斯的城墙看似坚不可摧，石头塔楼守护着通往城市主体的大门。城外挖了一条宽大的护城河，外围布置了壕沟，森林中还为我们的弓箭手建造了小型树屋。\n\n我们的首都现在是一座名副其实的要塞，将我们[ROOT.GetCountry.GetAdjective]的力量投射到周围的乡村。"
 me_vasconian_7_title:0 "首都要塞"
 me_vasconian_8.a:0 "我们富有了！富得流油！我简直不敢相信……"
 me_vasconian_8_desc:0 "[GetProvince('(int32)1017').GetName]的矿场刚刚建成，但[ROOT.GetCountry.GetName]的人民已经开始看到其益处。\n\n源源不断的金银流入[ROOT.GetCountry.GetCapital.GetName]的国库，负责奥亚索的监工告诉我们，这座矿场在未来多年内都将保持高产。"
 me_vasconian_8_title:0 "阿尔迪图里矿场"
 me_vasconian_9.a:0 "风暴女神将她的祝福洒在我们身上！"
 me_vasconian_9_desc:0 "位于[GetProvince('(int32)1099').GetName]的#E 玛丽神龛#!长期以来一直是玛丽特信徒的朝圣地，但这座简陋的建筑已被升级为正式的庙宇，由[ROOT.GetCountry.GetName]的国库资助。\n\n尽管我们与一些邻居关系紧张，但所有崇拜风暴女神的信徒都感谢[ROOT.GetCountry.GetRuler.GetName]对安博托宗教设施的投资，我们的国际声望在许多人眼中得到了提升。"
 me_vasconian_9_title:0 "玛丽的爱"
 mountain_defense:0 "山地训练"
 mountain_offense:0 "山地训练"
 negotiated_icetani:0 "平定的伊塞塔尼"
 pyrenean_dominance:0 "比利牛斯霸权"
 pyrenean_pass:0 "比利牛斯隘口"
 the_lonely_mountain:0 "山地民族"
 the_love_of_mari:0 "玛丽的爱"
 the_social_mountain:0 "山地民族"
 vasconian_mission_01:0 "比利牛斯之主"
 vasconian_mission_01_BUTTON_TOOLTIP:0 "千里之行，始于足下……"
 vasconian_mission_01_CRITERIA_DESCRIPTION:0 "当瓦斯科尼亚改善其基础设施、征服邻居并建立#E 埃布罗联邦#!时，此使命将视为完成。"
 vasconian_mission_01_DESCRIPTION:0 "居住在#E 比利牛斯山脉#!山麓的#E 瓦斯科尼亚#!部落，控制着这片险峻山脉中为数不多的隘口之一，迫使他们时刻警惕敌人的入侵。\n\n他们在伊贝鲁斯河的柔和水域旁建立定居点，生活在一片充满无限潜力的宜人土地上……一个有雄心和魄力的人可以让瓦斯科尼亚大放异彩，将其转变为一个真正令人畏惧的国家。"
 vasconian_mission_01_task_01:0 "比利牛斯隘口"
 vasconian_mission_01_task_01_DESC:0 "[GetProvince('(int32)1076').GetName]是我们国家最重要的战略要冲之一——我们必须尽一切努力确保比利牛斯隘口对敌人来说是无法逾越的。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 vasconian_mission_01_task_02:0 "瞄准大西洋"
 vasconian_mission_01_task_02_DESC:0 "西方的#E [GetCountry('VAD').GetName]#!控制着通往#E 坎塔布连海#!的通道，但我们的[ROOT.GetCountry.GetAdjective]人民也想要占有这片海域。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 vasconian_mission_01_task_02_tt:0 "将触发一系列事件，我们可以决定如何处理我们的邻居，#Y [GetCountry('VAD').GetName]#!。"
 vasconian_mission_01_task_03:0 "山地民族"
 vasconian_mission_01_task_03_DESC:0 "北方的山地民族在生活方式上始终与[ROOT.GetCountry.GetCapital.GetName]的居民略有不同。然而，我们需要就这些人的未来做出决定。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 vasconian_mission_01_task_03_tt:0 "拥有至少3块具有#Y 丘陵#!、#Y 山地#!或#Y 森林#!地形且建有#Y 部落定居点#!的领土。"
 vasconian_mission_01_task_03_tt_2:0 "将触发一系列事件，我们将决定是否尝试中央集权。#R 根据你处理事件链的方式，你将获得以下两种奖励之一：#!"
 vasconian_mission_01_task_03_tt_3:0 "\n #R 或 #! \n\n"
 vasconian_mission_01_task_04:0 "突袭伊塞塔尼"
 vasconian_mission_01_task_04_DESC:0 "我们的掠袭者终将让敌人的土地闻风丧胆，但我们必须首先建设必要的基础设施来维持他们的数量。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 vasconian_mission_01_task_04_tt:0 "此任务的奖励将因你选择如何处理入侵你领土的掠袭者而有所不同。你会与他们谈判并允许他们在你的土地上定居，还是与他们作战？"
 vasconian_mission_01_task_05:0 "与阿基坦尼接触"
 vasconian_mission_01_task_05_DESC:0 "我们山脉北方的#E 阿基坦尼#!部落值得尊敬，他们的友谊值得我们去争取。让我们与他们建立友好的关系，因为这比让远方的敌人联合起来对抗我们要好。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 vasconian_mission_01_task_05_tt:0 "在#Y 阿基坦尼地区#!和#Y 山南高卢地区#!内，至少有2个主要文化为#Y 阿基坦尼#!的国家与我们结盟，且对我们的评价至少为#G 65#!。"
 vasconian_mission_01_task_05_tt_2:0 "我们将根据结盟数量获得一定数量的人口。"
 vasconian_mission_01_task_05_tt_bypass:0 "没有足够的国家可供结盟以完成此任务。"
 vasconian_mission_01_task_06:0 "瓦斯科尼亚的主城"
 vasconian_mission_01_task_06_DESC:0 "现在我们已经征服了瓦斯科尼亚人，我们必须决定如何处理他们的领土——幸运的是，我们有多种选择。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 vasconian_mission_01_task_06_tt_2:0 "将触发一系列事件，我们可以选择投资某些领土。"
 vasconian_mission_01_task_07:0 "首都要塞"
 vasconian_mission_01_task_07_DESC:0 "尽管我们正在明智地加固边境，但我们也不应忽视[ROOT.GetCountry.GetCapital.GetName]的城墙，因为我们还有很多可以做的事情，以确保我们的首都被视为真正的要塞。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 vasconian_mission_01_task_08:0 "阿尔迪图里矿场"
 vasconian_mission_01_task_08_DESC:0 "瓦斯科尼亚人愚蠢地在[GetProvince('(int32)1017').GetName]建造了一个港口，而我们将开采那里发现的贵金属。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 vasconian_mission_01_task_09:0 "玛丽的爱"
 vasconian_mission_01_task_09.tt:0 "你的神殿中的#Y 玛丽特丰收之神#!是#Y $deity_mari$#!。"
 vasconian_mission_01_task_09_DESC:0 "我们绝不能忽视对#Y $deity_mari$#!的崇拜，而必须正式将风暴女神的仪式纳入我们的日常仪式中。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 vasconian_mission_01_task_10:0 "山地训练"
 vasconian_mission_01_task_10_DESC:0 "我们的征召兵总有工作可以做，以提高他们的战斗准备，尽管这普遍不受欢迎，但在山地训练是必要的。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 vasconian_mission_01_task_10_tt:0 "将触发一个事件，我们可以决定让我们的部队在训练中专注于什么。"
 vasconian_mission_01_task_10_tt_2:0 "#Y 塔拉科嫩西斯#!区域内至少有#Y 4#!个省份拥有#G 1#!个#T 兵营#!或#T 训练营#!。"
 vasconian_mission_01_task_11:0 "瓦斯科尼亚农田"
 vasconian_mission_01_task_11_DESC:0 "我们必须确保[ROOT.GetCountry.GetName]的人民始终有充足的食物可吃，建设农田遍布我们的领土是实现这一目标的一种方式。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 vasconian_mission_01_task_12:0 "召集所有巴斯昆人"
 vasconian_mission_01_task_12_DESC:0 "现在我们的力量已经增强，我们可以向生活在其中的各部落传达这一地位变化的消息。#E 巴斯昆人#!是一个强大的氏族，我们希望他们未来站在我们这边。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 vasconian_mission_01_task_13:0 "比利牛斯霸权"
 vasconian_mission_01_task_13_DESC:0 "我们不仅加固了#E 比利牛斯隘口#!，还控制了山脉南北的土地——从任何标准来看，我们已经主宰了这一地区。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 vasconian_mission_01_task_14:0 "巴斯昆人的身份"
 vasconian_mission_01_task_14_DESC:0 "随着时间的推移，#E 巴斯昆人#!氏族在我们国家中的角色不断扩大，反映了他们的影响力和国家内部身份的变化。\n\n但这些人是谁？他们到底是什么样的人？[ROOT.GetCountry.GetRuler.GetName]有许多未解的问题。\n\n#Y 这将开启一系列事件#!。\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 vasconian_mission_01_task_15:0 "埃布罗的真正领主"
 vasconian_mission_01_task_15_DESC:0 "居住在#E 埃布罗河#!附近的人民骄傲而顽强，许多人拒绝承认任何外部权威。我们必须密切关注这一地区，因为我们预计他们向我们，埃布罗的真正领主臣服时会遇到问题。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 vasconian_mission_01_task_15_tt:0 "将宣布埃布罗的真正领主。"
 vasconian_mission_01_task_16:0 "埃布罗联邦"
 vasconian_mission_01_task_16_DESC:0 "现在是时候召集我们的附庸酋长前往[ROOT.GetCountry.GetCapital.GetName]，宣布一项重要声明。\n\n#Y 这将开启一系列事件#!。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 vasconian_mission_01_task_16_tt:0 "每个担任#Y 官职#!的人物忠诚度#Y 大于或等于#! #G 60#!。"
 vasconian_task_22_tt:0 "我们将获得对#Y [GetCountry('VAD').GetName]#!拥有的每个省份的宣称"
 vasconium_agrum:0 "瓦斯科尼亚农田"
 vasconium_supply:0 "瓦斯科尼亚补给"

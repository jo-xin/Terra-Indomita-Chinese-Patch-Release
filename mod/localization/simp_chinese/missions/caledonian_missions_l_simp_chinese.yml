l_simp_chinese:
 01_caledonian_missions:0 "纹饰之民的土地"
 01_caledonian_missions_BUTTON_TOOLTIP:0 "荣耀之日已近在眼前——喀里多尼亚的诞生……"
 01_caledonian_missions_CRITERIA_DESCRIPTION:0 "当我们完成以下目标时，此使命即告完成：建设好我们的核心地区、征服并劫掠敌国领土，同时团结周边部落建立#E 喀里多尼亚联盟#!。"
 01_caledonian_missions_DESCRIPTION:0 "#E 喀里多尼亚 #!部族栖息于#E 阿尔比恩#!岛最偏远的北方疆域——那片严酷而蛮荒的土地，就连南方他们坚韧勤勉的同胞 #E 海岛凯尔特  #!人也未曾涉足。\n\n此处，石楠丛生的荒原终年狂风肆虐，灰暗的山峦凛冽逼人。居住在这片冻土沼泽与原始森林中的族群，仿佛随时会隐没于周遭的苍茫天地之中……"
 01_caledonian_missions_task_1:0 "我们意见一致"
 01_caledonian_missions_task_10:0 "高地狩猎"
 01_caledonian_missions_task_10_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]的几位好友近来常提及要深入荒野狩猎——这项活动素来深受[ROOT.GetCountry.GetAdjective]子民的热爱。\n\n#Y 这将触发一系列事件#!。\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 01_caledonian_missions_task_11:0 "#E 诺万泰#!盐场"
 01_caledonian_missions_task_11_DESC:0 "盐乃民生至宝，日常百业皆不可或缺。我们应当尽快开发[GetProvince('(int32)2109').GetName]的天然盐业资源。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_caledonian_missions_task_12:0 "用这个交换那个"
 01_caledonian_missions_task_12_DESC:0 "物物交换在[ROOT.GetCountry.GetName]的经济生活中长期占据重要地位，如今[ROOT.GetCountry.GetRuler.GetName]决定以整个[ROOT.GetCountry.GetAdjective]国家的力量推动这项传统。我们必须在首都建造特殊市场，让民众能自由集会交易。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 01_caledonian_missions_task_13:0 "喀里多尼亚的首都"
 01_caledonian_missions_task_13_DESC:0 "近年来我们[ROOT.GetCountry.GetRulerTitle]的权威已不容置疑，部落长老们越来越愿意遵从[ROOT.GetCountry.GetCapital.GetName]发出的政令。[ROOT.GetCountry.GetRuler.GetName]为巩固[ROOT.GetCountry.GetRuler.GetHerHis]在[ROOT.GetCountry.GetName]的统治遗产，下令建造一座真正的城市。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_caledonian_missions_task_14:0 "荣誉之问"
 01_caledonian_missions_task_14_DESC:0 "随着国内威望提升，有些声音质疑[ROOT.GetCountry.GetRuler.GetName]领导[ROOT.GetCountry.GetAdjective]民族的资格。让我们用武艺展示永远堵住这些饶舌之徒的嘴。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_caledonian_missions_task_15:0 "世界将被燃烧！"
 01_caledonian_missions_task_15_DESC:0 "主宰世界的时刻到了！无人能阻挡我们；我们的征召兵已准备好点燃战火！\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 01_caledonian_missions_task_16:0 "大陆贸易"
 01_caledonian_missions_task_16_DESC:0 "虽然大部分所需物资都能在境内获取，但有些货物只能来自海外。让我们设法加强与大陆的贸易联系。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_caledonian_missions_task_17:0 "著名的鱼出口商"
 01_caledonian_missions_task_17_DESC:0 "外人总以为我们临海而居必以鱼为主食，实则不然——我们偏爱大麦与肉类，但本地渔获大可出口邻邦。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 01_caledonian_missions_task_18:0 "喀里多尼亚联盟"
 01_caledonian_missions_task_18_DESC:0 "让全世界见证我们凭武力取得的伟业——愿敌人在我们联盟成立的消息前颤抖！\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_caledonian_missions_task_19:0 "纹面战士"
 01_caledonian_missions_task_19_DESC:0 "我们的征召兵喜欢用靛青@woad!涂身，让那些愚蠢对抗彩绘战士的敌人胆战心惊。\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 01_caledonian_missions_task_1_DESC:0 "尽管要让我们各部族的酋长们达成共识绝非易事，但只要能在境内建立稳固的和平，我们就能让战士们明白远征域外的好处。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_caledonian_missions_task_2:0 "然必战矣"
 01_caledonian_missions_task_20:0 "洗劫圣地"
 01_caledonian_missions_task_20_DESC:0 "我们不会阻止掠夺者洗劫任何目标——无论是城市、村落、坟墓还是神庙，对我们战士来说都是公平的游戏！\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_caledonian_missions_task_21:0 "纹饰之民"
 01_caledonian_missions_task_21_DESC:0 "随着我等威权日盛，故土终得太平——[ROOT.GetCountry.GetAdjective]子民正在治下欣欣向荣。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 01_caledonian_missions_task_22:0 "希伯尼亚之滨"
 01_caledonian_missions_task_22_DESC:0 "#E 希伯尼亚北境#!既入我手，全岛征服指日可待。[ROOT.GetCountry.GetCapital.GetName]的奴隶围栏，想必还装得下更多战俘……\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 01_caledonian_missions_task_23:0 "奴隶船队"
 01_caledonian_missions_task_23_DESC:0 "必须让我们的海军也获得劫掠之力，如我陆上征召之师所为。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_caledonian_missions_task_2_DESC:0 "我们忍受同族相残的战争带来的无尽创伤已经太久了——必须终结这一切。要在#E 喀里多尼亚#!实现持久和平，唯有厉兵秣马，以战止战。\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 01_caledonian_missions_task_3:0 "被石块与银子包围"
 01_caledonian_missions_task_3_DESC:0 "我们脚下的土地蕴藏着珍贵的矿藏财富，理应以群山之石筑我城塞。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_caledonian_missions_task_4:0 "夺取#E 泰克萨利亚#!"
 01_caledonian_missions_task_4_DESC:0 "南方那些泰克萨利亚与丹诺尼亚部族不过是一群孱弱卑劣的蠕虫，岂敢妄想抵挡[ROOT.GetCountry.GetAdjective]大军的锋芒！让我们把这些敌人赶出他们的土地，统统逐入大海！\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_caledonian_missions_task_5:0 "穿越希贝耳尼亚海"
 01_caledonian_missions_task_5_DESC:0 "故土林木稀缺，然天不与我，非我无需良材。囤积木材益处良多——既可建造战船，更能遣舰队远征异邦……\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_caledonian_missions_task_6:0 "喀里多尼亚劫掠者"
 01_caledonian_missions_task_6_DESC:0 "我军百战勇士求战心切，渴望挥师南下西进，横扫敌境——只待[ROOT.GetCountry.GetRuler.GetName]一声令下，掠袭军团即刻出击！此刻他们已集结于[ROOT.GetCountry.GetCapital.GetName]周边，唯待王命。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 01_caledonian_missions_task_7:0 "#E 俄耳卡得斯#!的层叠石冢"
 01_caledonian_missions_task_7_DESC:0 "据说在[GetProvince('(int32)2132').GetName]存在着奇异的聚落，若有资金派遣考察队，或许值得一探究竟。\n\n#Y 若不存在#T 戈班努斯圣地#!，将触发事件链#!。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 01_caledonian_missions_task_7_tt:0 "#T 大祭司#!需拥有8点@religious_icon!#Y 热忱#!。"
 01_caledonian_missions_task_8:0 "部落定居者"
 01_caledonian_missions_task_8_DESC:0 "和平终于到来，但我们绝不能安于现状——恰恰相反。若想牢牢掌控这片浴血奋战夺得的土地，就必须将部族子民迁往周边那些无人居住的区域。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_caledonian_missions_task_9:0 "在山区采矿"
 01_caledonian_missions_task_9_DESC:0 "[ROOT.GetCountry.Custom('get_forge_god')]赐予我们子民的诸多恩赐之一，便是唾手可得的矿藏财富——无论是石材、金银之类的贵金属，还是铁匠们梦寐以求的粗金属。我们岂能懈怠？当兴建矿场，采掘民众渴求的建筑之材。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 caledonia_fish_trade_mod:0 "繁荣的贸易"
 caledonia_mission_tree_task_9_tt:0 "[GetProvince('(int32)2120').GetArea.GetName|Y]地区至少#Y 2#!个产出#Y 基础金属#!@base_metals!的领土拥有#Y 矿井#!。"
 caledonian_cheaper_slaves_cost:0 "部落安置"
 caledonian_marketplaces:0 "喀里多尼亚易货盟会"
 caledonian_omen_boost_mod:0 "戈班努斯的祝福"
 caledonian_stoneworks:0 "喀里多尼亚矿工团"
 desc_caledonia_fish_trade_mod:0 "我们通过向海外出售鱼类赚得颇丰。"
 desc_caledonian_cheaper_slaves_cost:0 "如今既已牢牢掌控喀里多尼亚全境，自当全力拓殖周遭无主之地。"
 desc_caledonian_marketplaces:0 "我们在此兴建了一座专事以物易物的特殊市集。"
 desc_caledonian_omen_boost_mod:0 "众神因我们的虔诚而喜悦，戈班努斯神对我们的作为报以微笑。"
 desc_caledonian_stoneworks:0 "无论开采铁矿、石材，还是粗金属矿，我族子民皆精于此等艰苦劳作。"
 desc_fisheries_of_caledonia:0 "经过一段时期的重点建设，我们已在此建成大型渔场，以便向周边地区输出渔获。"
 desc_iron_weapons_caledonia:0 "我喀里多尼亚矿脉所铸之兵刃坚不可摧——利剑既不会崩裂亦不会弯折，其刚韧如我族意志般永恒。"
 desc_pictish_mainland_trade:0 "我们强大的海军确保贸易持续在我国港口与大陆之间往来流通。"
 desc_pictish_mines_modifier:0 "我们高产的金矿是国家财富的重要来源。"
 desc_pictish_salt_flats_mod:0 "我们在此行省修建了大型盐池，以提高采盐效率。"
 desc_pictish_slave_raid_distance:0 "我们的劫掠船队纵横四海，搜寻防御薄弱的海港以掳掠奴隶。"
 desc_pictish_slave_raid_hibernia_mod:0 "希伯尼亚那些弱小可悲的部落，对我们经验丰富的掠夺者来说不过是囊中之物。"
 desc_pictish_warriors_mod:0 "由于我们的征召兵常在身上刺满纹身，敌人给我们起了\"纹饰之民\"的绰号。"
 desc_the_world_will_burn_picts_mod:0 "如今我们已在北方建立要塞，不论敌人在何处，都将遭受我们毁灭性的打击。"
 fisheries_of_caledonia:0 "喀里多尼亚的渔业"
 hove_amber_cup_treasure:0 "霍夫琥珀杯"
 hove_amber_cup_treasure_desc:0 "我们的掠夺者在一座圆形墓冢中发现了非凡珍宝——用整块琥珀雕琢而成的饮杯。"
 iron_weapons_caledonia:0 "铁制武器"
 me_caledonian_1.a:0 "我很庆幸这件事已经解决了。"
 me_caledonian_11.a:0 "我们会毫无疑问地并肩作战——我们之间有足够的空间共存。"
 me_caledonian_11.b:0 "传授我你的海盗之道，[SCOPE.sCharacter('salt_pirate').GetFirstName]——我必须掌握你的秘技"
 me_caledonian_11_desc:0 "最后，[GetProvince('(int32)2109').GetName]的盐田终于完工了。沿海岸线修建了长而浅的盐池，工人们利用各种工具将结晶盐层敲碎成易于搬运的小块，待海水蒸发后便可收获盐晶。\n\n[ROOT.GetCountry.GetRuler.GetName]决定亲赴诺万泰，同时意图接触盘踞该地区的海盗势力。多年来，这些海盗通过港口贩卖盐业补充收入，而[ROOT.GetCountry.GetRuler.GetFirstName]希望确保在我们接管该省后，双方民众之间不会产生矛盾。\n\n[ROOT.GetCountry.GetName]的幸运之处在于，这些海盗的首领——名为[SCOPE.sCharacter('salt_pirate').GetName]之人——对我们的到来表示欢迎，并表示天气允许时愿加入我们的劫掠行动——我们的声名早已传遍四方。"
 me_caledonian_11_title:0 "$01_caledonian_missions_task_11$"
 me_caledonian_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_11$#!”$mission_completed_tooltip_2$"
 me_caledonian_12.a:0 "我在想今天能不能捡到什么便宜……我们最好快点。"
 me_caledonian_12_desc:0 "每月一次，[ROOT.GetCountry.GetCapital.GetName]的中心地带便化作热闹非凡的露天市集。木制摊位搭建起来，常摇摇欲坠地倚靠着城墙支撑，长桌被搬到街上，摆满形形色色的货物：金属碎片、武器、雕像、纺织品、毛皮、蜂蜜、矿石块……这里应有尽有。\n\n[ROOT.GetCountry.GetAdjective]人热衷于以物易物和讨价还价，街道上充斥着关于价格的友好争论声。"
 me_caledonian_12_title:0 "$01_caledonian_missions_task_12$"
 me_caledonian_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_12$#!”$mission_completed_tooltip_2$"
 me_caledonian_13.a:0 "在我逝去之后，[ROOT.GetCountry.GetCapital.GetName]这座城市仍将屹立不倒……"
 me_caledonian_13_desc:0 "只要[ROOT.GetCountry.GetAdjective]民族仍在地球表面游荡，我们的同胞就将永远铭记[ROOT.GetCountry.GetRuler.GetName]为[ROOT.GetCountry.GetRuler.GetHerHis]族裔所做的一切功绩与遗泽。\n\n此次[ROOT.GetCountry.GetRulerTitle]取得的最新胜利并非在战场上赢得，而是由工程师与奴隶们挥动铁锹、搅拌砂浆的劳动铸就。[ROOT.GetCountry.GetCapital.GetName]终于成为真正的城市，我们整个[ROOT.GetCountry.GetName]民族都在庆祝这一值得称颂的成就。"
 me_caledonian_13_title:0 "$01_caledonian_missions_task_13$"
 me_caledonian_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_13$#!”$mission_completed_tooltip_2$"
 me_caledonian_14.a:0 "我会与任何诋毁我名誉的人决一死战。"
 me_caledonian_14_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]平日多忙于执掌国政，但这并不意味着[ROOT.GetCountry.GetRulerTitle]会对损害[ROOT.GetCountry.GetRuler.GetHerHis]尊严的侮辱置之不理。\n\n值得庆幸的是，[ROOT.GetCountry.GetRuler.GetFirstName]仍拨冗处理个人荣誉之事——国民欣慰于知晓，我们的统治者并未遗忘战斗之道。"
 me_caledonian_14_title:0 "$01_caledonian_missions_task_14$"
 me_caledonian_14_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_14$#!”$mission_completed_tooltip_2$"
 me_caledonian_15.a:0 "我们将把世界置于火海！一切都归我们所有！"
 me_caledonian_15_desc:0 "燃烧村庄的浓烟在天空中阴森地盘旋，连刺骨的寒风也驱散不了这片阴霾。[ROOT.GetCountry.GetAdjective]的征兵者逐户搜刮，掠尽财物后纵火焚屋，街道上遍布着男人的尸体。妇女孩童的哀嚎声令人心碎，而[ROOT.GetCountry.GetRuler.GetName]面无表情地伫立着，满脸血污。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]转向凯旋的士兵，发出刺耳的战吼，将剑高举向天际。大地随之震颤，万千声浪呼应着这位[ROOT.GetCountry.GetRulerTitle]的号令。"
 me_caledonian_15_title:0 "$01_caledonian_missions_task_15$"
 me_caledonian_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_15$#!”$mission_completed_tooltip_2$"
 me_caledonian_16.a:0 "这笔贸易将推动我们的经济持续快速增长。"
 me_caledonian_16_desc:0 "每当贸易船只返回[ROOT.GetCountry.GetCapital.GetName]港口，总是一场欢庆盛事，民众常涌向海港观看货物卸载。\n\n得益于日益壮大的舰队，我们得以在海外建立这些初生的贸易纽带。我们从未想过会有外国商人慕名而来，如今却已成真。"
 me_caledonian_16_title:0 "$01_caledonian_missions_task_16$"
 me_caledonian_16_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_16$#!”$mission_completed_tooltip_2$"
 me_caledonian_17.a:0 "要是你不快点，最好的鱼就卖完了。"
 me_caledonian_17_desc:0 "若你钟情鱼鲜，那么[ROOT.GetCountry.GetName]的市集便是#E 喀里多尼亚#!全境最新鲜渔获的首选之地。渔民返港时太阳尚在天际，渔网几乎要撑破，我们的奴隶整日忙于清理鱼肉，并将未即时售出的鱼类熏制保存。\n\n毋庸置疑，得益于海洋的馈赠，我们正赚得盆满钵满。"
 me_caledonian_17_title:0 "$01_caledonian_missions_task_17$"
 me_caledonian_17_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_17$#!”$mission_completed_tooltip_2$"
 me_caledonian_18.a:0 "这是一个充满好运的日子，必将永载史册。"
 me_caledonian_18_desc:0 "过去一周，[ROOT.GetCountry.GetCapital.GetName]的庆典喧闹欢腾，狂喜的人群畅饮着如河流般奔涌的蜂蜜酒与葡萄酒。[ROOT.GetCountry.GetRuler.GetName]的宿醉已持续两日，却仍计划今夜再度酩酊大醉。\n\n这场狂欢的缘由不难理解——国家诞生并非寻常之事，而新成立的[ROOT.GetCountry.GetName]正是梦想成真的见证，预示着未来的辉煌。"
 me_caledonian_18_title:0 "$01_caledonian_missions_task_18$"
 me_caledonian_18_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_18$#!”$mission_completed_tooltip_2$"
 me_caledonian_19.a:0 "当然，战争过后我们会进行清理；毕竟我们不是野蛮人。"
 me_caledonian_19_desc:0 "尽管我军部分士兵在身上刺了纹身，但几乎每位战士都会在冲锋陷阵前用#E 靛青#!@woad!涂满全身。那些蓝纹交织的面孔扭曲成骇人的狞笑，我们所谓的“#E 战靛战士#!”仅凭现身战场便能撕裂敌阵——其恐怖之相可见一斑。\n\n当然，战斗结束后我们会用牛脂皂洗去战靛，毕竟归家时可不想吓坏亲人。"
 me_caledonian_19_title:0 "$01_caledonian_missions_task_19$"
 me_caledonian_19_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_19$#!”$mission_completed_tooltip_2$"
 me_caledonian_1_desc:0 "[ROOT.GetCountry.GetRuler.GetName]从未相信达成共识是可能的，但若说[ROOT.GetCountry.GetAdjective]人热衷于什么，那便是攻击和掠夺弱于我们的人，这使得提案轻易获得通过。\n\n当[ROOT.GetCountry.GetRuler.GetFirstName]提议向南入侵#E 泰克萨利亚#!，将矛头指向邻邦而非同族时，众人洞悉了这位[ROOT.GetCountry.GetRulerTitle]的深谋远虑，纷纷应允待时机成熟便集结出征。"
 me_caledonian_1_title:0 "$01_caledonian_missions_task_1$"
 me_caledonian_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_1$#!”$mission_completed_tooltip_2$"
 me_caledonian_2.a:0 "召集士兵，命令他们磨快刀刃！"
 me_caledonian_20.a:0 "无论它来自哪里，它现在属于[ROOT.GetCountry.GetAdjective]民族。"
 me_caledonian_20_desc:0 "我军在南方攻陷一座城池后，发现了惊人的秘密——[ROOT.GetCountry.GetRuler.GetName]定会感兴趣。\n\n当战士们正将城中一切付之一炬时，意外发现了古墓冢。他们劈开土冢强行闯入，发现大量未经扰动的陪葬品，其中包括一件由整块#E 琥珀#!@amber!雕琢而成的华美酒器。长老们推测，这件珍宝必定源自遥远东方的土地——那里盛产这种珍贵物质。"
 me_caledonian_20_title:0 "$01_caledonian_missions_task_20$"
 me_caledonian_20_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_20$#!”$mission_completed_tooltip_2$"
 me_caledonian_21_tooltip:0 "任务现已#G 完成#!!"
 me_caledonian_22_tooltip:0 "任务现已#G 完成#!!"
 me_caledonian_23_tooltip:0 "任务现已#G 完成#!!"
 me_caledonian_24.a:0 "请代我向他们表示感谢，感谢他们在这里的所作所为。"
 me_caledonian_24_desc:0 "如今我们已将#E 喀里多尼亚#!省全境纳入版图，正收获前所未有的丰厚回报。\n\n除了越来越多的同胞聚集在[ROOT.GetCountry.GetCapital.GetName]——这种情况总是令人欣喜——这些新迁入首都的居民还带来了家乡的先进技术，如今整个[ROOT.GetCountry.GetName]国家都将从中受益。"
 me_caledonian_24_title:0 "纹饰之民"
 me_caledonian_24_tooltip:0 "$mission_completed_tooltip_1$ “#Y 纹饰之民#!”$mission_completed_tooltip_2$"
 me_caledonian_26.a:0 "我们期待收到他们彻底臣服的消息。"
 me_caledonian_26_desc:0 "正如预言所示，#E 希伯尼亚#!那些可怜的部落终究无法抵挡我军精锐的[ROOT.GetCountry.GetAdjective]部队——我们的刀剑已浸透当地人的鲜血，同时更激起了对更多掠夺的渴望。\n\n据所有情报显示，敌军兵力薄弱且分散，将成为我奴隶贩子们的猎物。针对该岛其余区域的宣称文件已备妥，其征服行动理应不费吹灰之力。"
 me_caledonian_26_title:0 "希伯尼亚之滨"
 me_caledonian_26_tooltip:0 "$mission_completed_tooltip_1$“#Y 希伯尼亚之滨#!”$mission_completed_tooltip_2$"
 me_caledonian_27.a:0 "你会后悔那一天看到我们的帆在地平线上升起……"
 me_caledonian_27_desc:0 "无数舌头无疑都诅咒着[ROOT.GetCountry.GetRuler.GetName]诞生的那一天，因为这位[ROOT.GetCountry.GetRulerTitle]独力缔造了那些肆虐邻邦、播撒苦难的掠夺舰队\n\n。鉴于迄今遭遇的微弱抵抗，我们已决定每年在天气允许时派遣战舰出征。"
 me_caledonian_27_title:0 "奴隶船队"
 me_caledonian_27_tooltip:0 "$mission_completed_tooltip_1$“#Y 奴隶船队#!”$mission_completed_tooltip_2$"
 me_caledonian_28.a:0 "时候不早了，狩猎的事以后再说。"
 me_caledonian_28_desc:0 "[ROOT.GetCountry.GetRuler.GetName]某日清晨外出狩猎——这项活动深得[ROOT.GetCountry.GetRuler.GetSheHe]喜爱。正当他即将向一头雄壮的雄鹿射出箭矢时，身后突然传来一声巨响与窸窣声响：一棵橡树的树枝折断坠落。\n\n受惊的鹿窜进灌木丛后，[ROOT.GetCountry.GetRuler.GetFirstName] 叹了口气，心不在焉地拍掉落在[ROOT.GetCountry.GetRuler.GetHerHis]颈间的蚊蚋，随即踏上归途，朝[ROOT.GetCountry.GetCapital.GetName]方向走去。"
 me_caledonian_28_title:0 "纹饰之民的土地"
 me_caledonian_28_tooltip:0 "是时候创造历史了……"
 me_caledonian_29.a:0 "我们将继续搜索[GetProvince('(int32)2132').GetName]，看看还能发现什么。"
 me_caledonian_29_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]与[SCOPE.sCharacter('priest').GetName]抵达[GetProvince('(int32)2132').GetName]时，他们立即着手勘察该岛及其周边区域，所见景象令他们大为震惊。\n\n岛上散落着废弃的农庄，其石砌工艺令人叹为观止——他们遇到的某些建筑，建造时必定耗费了惊人的人力与时间。\n\n尽管这些建筑令人震撼，却不见任何当地居民的踪迹，唯有那些来到此岛的[ROOT.GetCountry.GetAdjective]殖民者。"
 me_caledonian_29_title:0 "层叠石冢：搜寻"
 me_caledonian_29_tooltip:0 "$mission_completed_tooltip_1$“#Y 室状石冢：搜寻#!”$mission_completed_tooltip_2$"
 me_caledonian_2_desc:0 "某日清晨，[ROOT.GetCountry.GetRuler.GetName]得知一场牲畜劫掠导致一名年轻战士丧生。尽管此类事件本是日常常态，但当发现邻近部落竟在幸灾乐祸时，[ROOT.GetCountry.GetRuler.GetSheHe]顿时怒火中烧。\n\n“他们太过分了——我定要彻底了结此事。”"
 me_caledonian_2_title:0 "$01_caledonian_missions_task_2$"
 me_caledonian_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_2$#!”$mission_completed_tooltip_2$"
 me_caledonian_3.a:0 "让他们铭记，究竟是谁将这一切赐给了他们！"
 me_caledonian_30.a:0 "既然如此，我们以后就常来这里祭祀。"
 me_caledonian_30_desc:0 "几周后，[ROOT.GetCountry.GetRuler.GetName]与[SCOPE.sCharacter('priest').GetName]发现了毕生难遇的奇观——山顶上矗立着一座巨型石堆的废墟，[SCOPE.sCharacter('priest').GetFirstName]瞬间被一种神圣感所笼罩。“就是这里——梦中见到的圣地！”\n\n两位[ROOT.GetCountry.GetAdjective]的探险者火速行动，从石堆顶部的入口钻入地下。待双眼适应昏暗后，他们发现中央存在着宽敞的殿堂。\n\n墙壁仿佛在震颤着神圣能量，令大祭司脊背发凉。“此地虽已废弃，却依然神圣……昔日献祭在此举行，若能重启祭祀，诸神必将欢欣。我们必须将这座现存建筑改作神殿，[ROOT.GetCountry.GetRuler.GetFirstName]。” "
 me_caledonian_30_title:0 "层叠石冢：神殿"
 me_caledonian_30_tooltip:0 "$mission_completed_tooltip_1$“#Y 室状石冢：神殿#!”$mission_completed_tooltip_2$"
 me_caledonian_3_desc:0 "我族无人能忆及如此挥霍黄金的岁月——[ROOT.GetCountry.GetRuler.GetName]掀起的建造狂潮，让锤击声与奴隶呻吟充斥山林。\n\n尽管代价高昂，矿井源源不断涌出的石料与金属正为我们创造可观利润。这份财富将支撑族人世代安居。"
 me_caledonian_3_title:0 "$01_caledonian_missions_task_3$"
 me_caledonian_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_3$#!”$mission_completed_tooltip_2$"
 me_caledonian_4.a:0 "诸神与我们同在——此刻绝不能停下！"
 me_caledonian_4_desc:0 "我军攻占#E 泰克萨利亚#!区域之易，令[ROOT.GetCountry.GetRuler.GetName]确信必须继续推进，诸位部落酋长亦皆赞同此议。\n\n若连战连捷的战果将持续降临于我等，拒绝这份馈赠实乃愚行。"
 me_caledonian_4_title:0 "$01_caledonian_missions_task_4$"
 me_caledonian_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_4$#!”$mission_completed_tooltip_2$"
 me_caledonian_5.a:0 "希伯尼亚的部落实力薄弱……"
 me_caledonian_5_desc:0 "我族中有人坚信西方的岛屿乃神圣之地，入侵这般圣域必将给[ROOT.GetCountry.GetAdjective]族招致灾祸。\n\n诸神意念难测，但无论何种劝阻都未能动摇[ROOT.GetCountry.GetRuler.GetName]的决心——他执意要让新造的船只满载物资与士兵渡海而行。"
 me_caledonian_5_title:0 "$01_caledonian_missions_task_5$"
 me_caledonian_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_5$#!”$mission_completed_tooltip_2$"
 me_caledonian_6.a:0 "感谢我们忠诚的老兵，告诉他们尽情享受吧。"
 me_caledonian_6.b:0 "让我们出资尽可能的多招募战士。"
 me_caledonian_6_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]竭尽全力确保[ROOT.GetCountry.GetRuler.GetHerHis]久经沙场的勇士能在战役间隙休整， 但大批老兵已聚集于[ROOT.GetCountry.GetCapital.GetName]，要求尽快重返战场——无人愿错失这般功勋与战利品的良机。"
 me_caledonian_6_title:0 "$01_caledonian_missions_task_6$"
 me_caledonian_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_6$#!”$mission_completed_tooltip_2$"
 me_caledonian_7.a:0 "无需多言——我们即刻起航前往岛屿。"
 me_caledonian_7_desc:0 "[SCOPE.sCharacter('priest').GetName]向[ROOT.GetCountry.GetRuler.GetName]报告了[GetProvince('(int32)2132').GetName]岛上出现了诡异的聚居点，此事已令我方大祭司深陷执念。他坚信必须亲赴该岛献祭，否则[ROOT.GetCountry.GetAdjective]国度将遭遇浩劫。\n\n每夜，[SCOPE.sCharacter('priest').GetFirstName]总做着相同的梦境：[SCOPE.sCharacter('priest').GetSheHe]坠入深山腹地某座遗忘的地下密室——那遥远之地正传来某种召唤。"
 me_caledonian_7_title:0 "$01_caledonian_missions_task_7$"
 me_caledonian_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_7$#!”$mission_completed_tooltip_2$"
 me_caledonian_8.a:0 "我们亟需[ROOT.GetCountry.GetAdjective]殖民者——我们将为你寻觅家园"
 me_caledonian_8_desc:0 "虽然我们终于为#E 喀里多尼亚#!省准备好了宣称！但部落长老们意识到，派遣族人走向世界是一项耗资巨大的事业。\n\n值得庆幸的是，整个[ROOT.GetCountry.GetName]国家都理解我们的需求，并一致同意应尽己所能减轻周边领土殖民的成本。在这一喜悦的契机下，我族民众正纷纷涌向首都，期盼能迁居至宜居之地。"
 me_caledonian_8_title:0 "$01_caledonian_missions_task_8$"
 me_caledonian_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_8$#!”$mission_completed_tooltip_2$"
 me_caledonian_9.a:0 "脚踏实地的工作没有什么可耻的。"
 me_caledonian_9_desc:0 "尽管我族中有人对在采石场劳作心生抗拒， [ROOT.GetCountry.GetRuler.GetName]却冷冰冰地指出：整个[ROOT.GetCountry.GetName]正享用着我们开采矿藏的成果——在[ROOT.GetCountry.GetCapital.GetName]，石砌房屋随处可见，精工锻造的铁器武器也日益普及。\n\n得益于我族人长期积累的原材料储备，无论是建筑师还是战士都将从中获益。"
 me_caledonian_9_title:0 "$01_caledonian_missions_task_9$"
 me_caledonian_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_caledonian_missions_task_9$#!”$mission_completed_tooltip_2$"

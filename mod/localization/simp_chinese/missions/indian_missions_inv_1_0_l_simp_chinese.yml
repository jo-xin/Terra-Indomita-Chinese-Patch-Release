 indian_empire_mission:0 "一个印度帝国"
 indian_empire_mission_BUTTON_TOOLTIP:0 "我们应该沐浴在我们的帝国荣耀中。"
 indian_empire_mission_CRITERIA_DESCRIPTION:0 "在我们建立了印度帝国之后，该使命完成。"
 indian_empire_mission_DESCRIPTION:0 "经过几十年的征服，我们终于拥有了对整个印度大陆的统治权。也许我们的王国现在配得上‘帝国’这个名字，而不是‘王国’。"
 indian_empire_mission_task_1:0 "一个印度帝国"
 indian_empire_mission_task_1_DESC:0 "我们的帝国从海洋延伸到海洋。也许是时候宣布一个帝国的建立了？"
 indian_empire_mission_task_2:0 "一个帝国的首都"
 indian_empire_mission_task_2_DESC:0 "我们首都是我们伟大的印度帝国的文化和政治中心。它应该被提升到‘帝国首都’的级别。"
 indian_empire_mission_task_final:0 "印度的马哈拉吉亚斯"
 indian_empire_mission_task_final_DESC:0 "我们的伟大领袖拥有对整个印度的统治权！应该为他们举行一次盛大的凯旋仪式。"
 indian_mission_01_gandara:0 "一个印度-希腊王国"
 indian_mission_01_gandara_BUTTON_TOOLTIP:0 "印度河流域上游由几条大河提供水源，肥沃无比，有充足的发展和增长空间。虽然目前大多是农业，人口不足，但犍陀罗和五河流域的山谷可以作为我们王国的一个充满活力和财富的新首都地区。然而，这需要我们的充分投资，我们需要击退孔雀帝国和其他强大的印度国家来扩大我们的控制。"
 indian_mission_01_gandara_CRITERIA_DESCRIPTION:0 "在我们征服了整个印度河流域并建立了我们新的统治中心之后，该使命完成。"
 indian_mission_01_gandara_DESCRIPTION:0 "印度是一个广阔的大陆，充满了财富，是我们希腊人所不了解的古老文化、宗教和习俗的家园。我们已经在印度河流域上游建立了一个立足点，确保了我们对犍陀罗和般阐那陀地区的控制，这将成为我们新王国的中心地带和首都地区。印度河谷是许多不同文化和部落的家园，其中许多是亚历山大本人多年前征服的。我们的首要任务应该是恢复和建设该地区的希腊社区，然后顺着印度河向南扩张，直到到达厄律特莱海。这将使我们与孔雀发生冲突，我们应该做好充分准备。"
 indian_mission_01_gandara_task_1:0 "欧特希米德家族的崛起"
 indian_mission_01_gandara_task_10:0 "潘多卢姆省"
 indian_mission_01_gandara_task_10_DESC:0 "我们把首都地区建设好，变成一个主要的经济和文化中心。它将被重新命名为'潘多卢姆'省。"
 indian_mission_01_gandara_task_11:0 "犍陀罗的道路"
 indian_mission_01_gandara_task_11_DESC:0 "犍陀罗有着通往巴克特里亚和阿里亚以外土地的主要通道。它拥有许多古老的城市，并正在成为佛教的重要宗教中心。如果我们明智地投资并建设其城市，它将无疑将成为我们最繁荣的省份之一。"
 indian_mission_01_gandara_task_12:0 "奢叉尸罗大学"
 indian_mission_01_gandara_task_12_DESC:0 "[GetProvince('(int32)7314').GetName]大学是一个古老而重要的学习中心，吸引了来自印度各地和其他地区的学者。我们应该扩大大学的校园，把它变成一个可以与希腊和埃及的大学相媲美的学习中心。"
 indian_mission_01_gandara_task_13:0 "双子亚历山大城"
 indian_mission_01_gandara_task_13_DESC:0 "亚历山大在Hydaspes河上建立了两个城市，[GetProvince('(int32)4322').GetName]和[GetProvince('(int32)4316').GetName]。这些希腊定居点的规模不断缩小，现在只有几千名马其顿定居者居住在这里。用新的公共工程扩大这些城市，将确保这两个希腊人定居点成为伟大的城市。"
 indian_mission_01_gandara_task_14:0 "犍陀罗之都"
 indian_mission_01_gandara_task_14_DESC:0 "[GetProvince('(int32)4300').GetName]是犍陀罗的都城。在这里为我们的王室建立一座宫殿，并扩大现有的希腊神庙和剧院，将使其成为我们新王国的陪都。"
 indian_mission_01_gandara_task_15:0 "山地堡垒"
 indian_mission_01_gandara_task_15_DESC:0 "犍陀罗险峻多山，也是敌人入侵的可能通道。强化这一区域将使我们的印度中心地带免受可能的西方入侵。"
 indian_mission_01_gandara_task_16:0 "犍陀罗省"
 indian_mission_01_gandara_task_16_DESC:0 "犍陀罗已被确立为我们王国最新的省份，其首都在[GetProvince('(int32)4300').GetName]。它已经成为一个重要的学习和宗教中心，并将在我们的管理下茁壮成长。"
 indian_mission_01_gandara_task_17:0 "向南扩张"
 indian_mission_01_gandara_task_17_DESC:0 "南部是印度河的主要分支及其肥沃的洪泛区。与海洋的联系日益重要，并将使印度-希腊王国进入新的贸易市场。"
 indian_mission_01_gandara_task_18:0 "印度河畔的亚历山大城"
 indian_mission_01_gandara_task_18_DESC:0 "[GetProvince('(int32)4371').GetName]是由亚历山大大帝在印度河的分叉处建立的，是该地区最大和最重要的希腊化定居点。作为印度河口的港口和我们的首都之间的转口港，它的重要性将越来越大。"
 indian_mission_01_gandara_task_19:0 "印度河上的贸易"
 indian_mission_01_gandara_task_19_DESC:0 "印度河很肥沃，河岸上有许多大城市。扩大这一地区的商业潜力将使其成为一个富裕和强大的贸易和农业中心。"
 indian_mission_01_gandara_task_1_DESC:0 "我们在印度的新近征服使我们的王室陷入混乱。贵族们为谁来统治我们的新土地而争吵不休，现任巴西琉斯被认为太弱，无法阻止我们的王国崩溃成更小的国家。然而，在这一背景下，一个新的人物来到了宫廷，有人认为他可能正是我们需要的统治者。"
 indian_mission_01_gandara_task_2:0 "一个印度-希腊的首都"
 indian_mission_01_gandara_task_20:0 "我们王国的一个港口"
 indian_mission_01_gandara_task_20_DESC:0 "[GetProvince('(int32)6821').GetName]是我们与厄律特莱海的主要联系，也将成为我们的主要港口城市。现在我们终于有了出海口，我们可以扩大与印度其他地区和其他国家的贸易。"
 indian_mission_01_gandara_task_21:0 "古代的钵呾罗"
 indian_mission_01_gandara_task_21_DESC:0 "[GetProvince('(int32)6815').GetName]是帕塔勒涅省的首府，但它现在遭受了水灾，管理不善。它将被重建为一个希腊城市，并被赋予一个新的名字。"
 indian_mission_01_gandara_task_22:0 "印度的省份"
 indian_mission_01_gandara_task_22_DESC:0 "我们新的印度省份已经建立，财富流入我们的港口，并顺着印度河流向我们的首都地区潘多卢姆。我们商业潜力的扩大将使我们能够资助更大的军队，并进一步向印度大陆扩张。"
 indian_mission_01_gandara_task_23:0 "吸引希腊移民"
 indian_mission_01_gandara_task_23_DESC:0 "印度的希腊人口很少，如果我们想把我们的统治强加给我们所征服的人民，最终是不可持续的。我们应该尝试从希腊和马其顿的希腊人故乡吸引定居者到我们的王国定居。由于希腊和安纳托利亚的大部分地区被战争和混乱所困扰，我们在吸引移民方面应该没有问题。"
 indian_mission_01_gandara_task_24:0 "拥护佛教"
 indian_mission_01_gandara_task_24_DESC:0 "一种新的宗教正在印度蓬勃发展，它是由一个名叫乔达摩悉达多的人在几百年前创立的。我们已经征服了许多重要的佛教圣地，我们皇室的一些成员已经皈依，被其和平的教义所吸引。如果我们要统治印度，也许有必要放弃希腊多神教......"
 indian_mission_01_gandara_task_25:0 "印度-希腊文化"
 indian_mission_01_gandara_task_25_DESC:0 "随着我们在印度征服了更多的土地，我们的文化似乎与希腊的文化越走越远。虽然我们不想放弃我们的希腊根源，但拥抱印度文化的各个方面将是一个谨慎的决定。"
 indian_mission_01_gandara_task_26:0 "打造新的血统"
 indian_mission_01_gandara_task_26_DESC:0 "欧特希米德家族自上台以来发展迅速，家族的许多成员在印度-希腊王国中担任重要职务。欧特希米德的血统已经成为权力和合法性的象征。"
 indian_mission_01_gandara_task_2_DESC:0 "我们的旧首都离我们在印度的土地很远，我们宫廷里的一些人认为有必要把它搬到一个更中心、更方便的地方。有人建议将[GetProvince('(int32)4340').GetName]作为印度-希腊王国的潜在新王城和首都。"
 indian_mission_01_gandara_task_3:0 "紧盯印度河"
 indian_mission_01_gandara_task_3_DESC:0 "我们已经建立了对犍陀罗和般阐那陀的控制，然而印度河的其余部分，包括通往厄律特莱海的通道，都在敌人手中。我们是亚历山大帝国的继承者，他以前在印度的土地理所当然属于我们。"
 indian_mission_01_gandara_task_4:0 "五河流域腹地"
 indian_mission_01_gandara_task_4_DESC:0 "[GetProvince('(int32)4340')GetArea.GetName]、[GetProvince('(int32)4380')GetArea.GetName]和[GetProvince('(int32)4414')GetArea.GetName]省构成了我们王国的中心地带。需要广泛的城市化和省份投资来提升和发展这些省份。"
 indian_mission_01_gandara_task_5:0 "发展我们的首都"
 indian_mission_01_gandara_task_5_DESC:0 "[GetProvince('(int32)4340').GetName]已经从一个小定居点发展成为一个繁荣的城市，因为来自我们王国各地的移民在我们的新首都定居。然而，从大多数方面来看，[GetProvince('(int32)4340').GetName]仍然是一个相对较小的城市，希腊人的存在有限。用新的基础设施建设我们的首都，将有助于吸引潜在的定居者。"
 indian_mission_01_gandara_task_6:0 "皇权"
 indian_mission_01_gandara_task_6_DESC:0 "[GetProvince('(int32)4340').GetName]现在是一个主要城市。把它建成一个真正的希腊-印度大都市将提高我们的合法性，并为我们的王室带来巨大的威望。"
 indian_mission_01_gandara_task_7:0 "接近犍陀罗河"
 indian_mission_01_gandara_task_7_DESC:0 "犍陀罗人占我们印度臣民的大多数，如果我们要和平地统治这片土地，我们也必须向这个新征服地区的居民伸出橄榄枝。这反过来将有助于我们在未来避免冲突和紧张。"
 indian_mission_01_gandara_task_8:0 "希帕尼斯的亚历山大里亚"
 indian_mission_01_gandara_task_8_DESC:0 "[GetProvince('(int32)7485').GetName]是亚历山大在试图征服印度的过程中建立的最东边的定居点。这座城市可能代表了亚历山大对印度的最后入侵，但不是我们的。我们应该把这座城市建成一个合适的希腊城市，并使其成为东扩的基地。"
 indian_mission_01_gandara_task_9:0 "摩利人的城市"
 indian_mission_01_gandara_task_9_DESC:0 "摩利人居住在[GetProvince('(int32)4350').GetName]城，它是他们的首都。我们应该建设它，重新建立一个希腊的定居点。"
 indian_mission_01_gandara_task_final:0 "印度的拉吉亚斯"
 indian_mission_01_gandara_task_final_DESC:0 "印度-希腊王国发展迅速，我们的王室在其土地上享有最高统治权。我们的领袖以‘拉吉亚斯’代替了‘巴西琉斯’的称号，并宣称自己是全印度的统治者。"
 indian_mission_02_ganges:0 "顺着恒河而下"
 indian_mission_02_ganges_BUTTON_TOOLTIP:0 "我们必须把孔雀的腹地据为己有！"
 indian_mission_02_ganges_CRITERIA_DESCRIPTION:0 "在我们征服了整个恒河流域并占有了孔雀的首都[GetProvince('(int32)4440').GetName]之后，该使命完成。"
 indian_mission_02_ganges_DESCRIPTION:0 "在我们首都地区的东部，是孔雀帝国的腹地，它围绕着肥沃的恒河而建。恒河是印度的命脉，它为印度提供了丰富的食物和水，并反过来创造了已知世界上最肥沃的河流流域。这个地区能够养活大量的人口，征服它的确是一个很高的要求。在这个地区的中心是孔雀的首都[GetProvince('(int32)4440').GetName]，是人类已知的最伟大和最大的城市之一。征服这个伟大的大都市，攻陷他们的首都，将巩固印度-希腊人作为印度真正统治者的地位。"
 indian_mission_02_ganges_task_1:0 "东方的野心"
 indian_mission_02_ganges_task_10:0 "法轮"
 indian_mission_02_ganges_task_10_DESC:0 "[GetProvince('(int32)4429').GetName]是佛陀初转法轮之地。作为狂热的佛教徒，这座城市对我们有巨大的意义，应该被确立为一个圣地。"
 indian_mission_02_ganges_task_11:0 "憍萨罗王国"
 indian_mission_02_ganges_task_11_DESC:0 "憍萨罗王国很富裕，其大部分权力集中在[GetProvince('(int32)4437').GetName]和[GetProvince('(int32)4451').GetName]两座王城。它们在孔雀的统治下已经消亡，但恢复憍萨罗无疑会使其人民对我们的统治感到兴奋。"
 indian_mission_02_ganges_task_12:0 "孔雀大都会"
 indian_mission_02_ganges_task_12_DESC:0 "[GetProvince('(int32)4440').GetName]是孔雀帝国的伟大首都，可能也是世界上最大的城市。它比雅典、巴比伦和亚历山大的辉煌更胜一筹，也是孔雀帝国昔日实力的证明。其他帝国可能为了提高自己首都的威望而夷平这座城市，但是，尽管[GetProvince('(int32)4340').GetName]永远是我们最伟大的都会，但[GetProvince('(int32)4440').GetName]必须成为印度-希腊人的‘第二座城市’。"
 indian_mission_02_ganges_task_13:0 "伽耶圣地"
 indian_mission_02_ganges_task_13_DESC:0 "[GetProvince('(int32)4444').GetName]是佛教中最神圣的地方，具有巨大的宗教意义。现在我们已经获得了这个伟大的圣城，我们可以在那里建立一个坚定的希腊人的存在，这样我们可以更接近涅槃。"
 indian_mission_02_ganges_task_14:0 "普拉西亚卡的希腊城市"
 indian_mission_02_ganges_task_14_DESC:0 "在摩揭陀的中心地带，我们是外来者。在这片土地上没有希腊人的存在，如果我们要有效地统治它，这种情况必须改变。建立希腊城市将巩固我们对[GetProvince('(int32)4440').GetArea.GetRegion.GetName]的控制。"
 indian_mission_02_ganges_task_15:0 "摩揭陀之王"
 indian_mission_02_ganges_task_15_DESC:0 "虽然我们已经征服了骄傲的摩揭陀人，但我们决不能傲慢到认为可以把我们的文化和价值观强加给他们。摩揭陀人必须被平等地接受到我们的王国中来，自由地按照他们认为合适的方式实践自己的习俗。"
 indian_mission_02_ganges_task_16:0 "普拉西亚卡省"
 indian_mission_02_ganges_task_16_DESC:0 "普拉西亚卡省已经建立，巩固了印度-希腊对孔雀中心区域的统治。这对我们的王国来说是一个巨大的成就。"
 indian_mission_02_ganges_task_17:0 "恒河之口"
 indian_mission_02_ganges_task_17_DESC:0 "恒河之口代表了希腊世界所认识的最大范围。甚至亚历山大也没有到达兢伽海。这将为我们的王国打开与塞里斯贸易的大门。"
 indian_mission_02_ganges_task_18:0 "安提波勒涅王国"
 indian_mission_02_ganges_task_18_DESC:0 "安提波勒涅王国在战略上位于恒河和狄阿达涅斯河的分叉处。作为通往我国第二首都[GetProvince('(int32)4440').GetName]的门户，这一地区必须有充足的投资。"
 indian_mission_02_ganges_task_19:0 "众神之城"
 indian_mission_02_ganges_task_19_DESC:0 "[GetProvince('(int32)7493').GetName]是安提波勒涅的首都，被称为‘众神之城’。将这个都会变成一个完全希腊化的城区，将扩大这个城市和整个安提波勒涅的商业潜力。"
 indian_mission_02_ganges_task_1_DESC:0 "在我们的东面是孔雀王朝的腹地，以肥沃的恒河为中心。我们已经获得了印度河流域，现在必须把目光投向一个新的目标：恒河和它所有的辉煌。"
 indian_mission_02_ganges_task_2:0 "恒河上游"
 indian_mission_02_ganges_task_20:0 "五城港口"
 indian_mission_02_ganges_task_20_DESC:0 "港口城市[GetProvince('(int32)7331').GetName]被我们的一些制图师称为'世界的尽头'。在这个城市之外，是希腊化世界所不知道的地区。[GetProvince('(int32)7331').GetName]将作为一个重要的港口城市，使我们与新的民族和文化接触。"
 indian_mission_02_ganges_task_21:0 "甘加里戴王国"
 indian_mission_02_ganges_task_21_DESC:0 "甘加里戴是以恒河为名的民族。作为一个骄傲的战士国家，他们以其军事能力而闻名。我们应该在他们的首都[GetProvince('(int32)7345').GetName]建立据点，学习他们的军事经验。"
 indian_mission_02_ganges_task_22:0 "征服基拉狄亚人"
 indian_mission_02_ganges_task_22_DESC:0 "在安提波勒涅的北部，是基拉狄亚人所在的野蛮土地。基拉狄亚多山，森林茂密，确实是一头难以驯服的野兽，但将是我们王国的一个有价值的补充。"
 indian_mission_02_ganges_task_23:0 "开化基拉狄亚"
 indian_mission_02_ganges_task_23_DESC:0 "随着基拉狄亚现在在我们的控制之下，这个地区的开化和城市化是最重要的。"
 indian_mission_02_ganges_task_24:0 "甘杰提卡省"
 indian_mission_02_ganges_task_24_DESC:0 "甘杰提卡省已经建立，我们伟大的王国现在统治着印度次大陆的两边。"
 indian_mission_02_ganges_task_2_DESC:0 "在[GetProvince('(int32)4414')GetArea.GetName]省之外，是恒河上游的省份，以[GetProvince('(int32)4405').GetName]和[GetProvince('(int32)4425').GetName]的传奇城市为中心。恒河在这里一分为二，提供了一个肥沃的河流三角洲，能够提供难以计数的食物。它也是进一步入侵孔雀土地的中转站。"
 indian_mission_02_ganges_task_3:0 "因陀罗平原"
 indian_mission_02_ganges_task_3_DESC:0 "[GetProvince('(int32)4405').GetName]是一座以印度教和佛教神灵因陀罗命名的古城。这个地区的都会确实是一个值得褒奖的地方。"
 indian_mission_02_ganges_task_4:0 "战象训练"
 indian_mission_02_ganges_task_4_DESC:0 "[GetProvince('(int32)4424').GetArea.GetName]省是战象的主要出口地。孔雀和其他印度王国已经掌握了在战争中使用大象的方法，如果我们要在军事上处于平等地位，我们也必须使战象成为我们军队的重要组成部分。"
 indian_mission_02_ganges_task_5:0 "卡瑙季札王城"
 indian_mission_02_ganges_task_5_DESC:0 "[GetProvince('(int32)4425').GetName]是孔雀的大都市之一，人口众多，有许多富丽堂皇的宫殿和寺庙。将[GetProvince('(int32)4425').GetName]建筑为皇家首都，将提高它的地位和威望。"
 indian_mission_02_ganges_task_6:0 "生命之河"
 indian_mission_02_ganges_task_6_DESC:0 "随着我们征服了更多的土地，我们的臣民人口也越来越多。恒河能够提供不可估量的食物，以至于我们伟大的王国将不再需要食物。我们必须在恒河上建立起我们的农业能力。"
 indian_mission_02_ganges_task_7:0 "在恒河上定居的希腊人"
 indian_mission_02_ganges_task_7_DESC:0 "我们的帝国从阿里安山脉延伸到恒河中央，然而我们离首都越远，我们的帝国就越不希腊化。我们必须在这个地区建立希腊城市，以建立希腊人的存在。"
 indian_mission_02_ganges_task_8:0 "梭德拉巴提亚省"
 indian_mission_02_ganges_task_8_DESC:0 "梭德拉巴提亚省已经建立，我们的控制权扩展到恒河上游。在这个地区之外，是通往兢伽海的通道和孔雀帝国的首都。"
 indian_mission_02_ganges_task_9:0 "孔雀的堡垒"
 indian_mission_02_ganges_task_9_DESC:0 "摩揭陀人将这一地区称为家园。这里有他们宏伟的首都[GetProvince('(int32)4440').GetName]，以及大部分的主要人口中心。我们已经与孔雀打了几场战争，现在我们的军队正在向他们的门户靠近。"
 indian_mission_02_ganges_task_final:0 "孔雀王朝的征服者"
 indian_mission_02_ganges_task_final_DESC:0 "我们伟大的领袖已经征服了孔雀帝国的首都，并因为这一宏伟的成就而被授予‘印度人’的称号。"
 indian_mission_03_aparanta:0 "西部边界"
 indian_mission_03_aparanta_BUTTON_TOOLTIP:0 "西部诸国和他们的财富将是我们王国囊中之物。"
 indian_mission_03_aparanta_CRITERIA_DESCRIPTION:0 "在我们征服了阿里亚卡省和拉里昔省的全部地区之后，该使命完成。"
 indian_mission_03_aparanta_DESCRIPTION:0 "在我们所拥有的印度河流域以南，是印度充满活力和富裕的贸易城市，这些城市在西海岸一带。再往内陆走，是由神话中的国王南巴努斯统治的富裕的西部卫星国。这个地区是一个巨大的贸易中心，连接着印度与波斯、阿拉伯和非洲以及希腊的贸易。这是扩张的下一个合理步骤。"
 indian_mission_03_aparanta_task_1:0 "西部边境"
 indian_mission_03_aparanta_task_10:0 "厄律特莱海航行记"
 indian_mission_03_aparanta_task_10_DESC:0 "[GetProvince('(int32)6859').GetName]城是西印度的主要贸易港口，从世界各地进口货物。这个地区沿海的其他贸易城市也拥有巨大的商业潜力。投资将扩大我们在厄律特莱海的贸易能力。"
 indian_mission_03_aparanta_task_11:0 "纳马底斯河岸"
 indian_mission_03_aparanta_task_11_DESC:0 "纳玛底斯河是印度众多的圣河之一。在这里建立一个希腊化的定居点可能有助于我们扩大影响力。"
 indian_mission_03_aparanta_task_12:0 "德干高原"
 indian_mission_03_aparanta_task_12_DESC:0 "伟大的德干高原覆盖了印度中部的大部分地区。征服这一地区可能具有挑战性，但风险是值得回报的。"
 indian_mission_03_aparanta_task_13:0 "阿里亚卡贸易中心"
 indian_mission_03_aparanta_task_13_DESC:0 "[GetProvince('(int32)7074').GetName]和[GetProvince('(int32)7078').GetName] 这两个城市被希腊化世界称为印度中部的两个伟大之城。确保我们在这些定居点的存在将扩大我们对印度中部商业的控制。"
 indian_mission_03_aparanta_task_14:0 "西部贸易中心"
 indian_mission_03_aparanta_task_14_DESC:0 "在阿里亚卡的海岸线上有几个富裕的贸易中心，流淌着来自厄里特里亚海对面的财富。我们必须建立起这些定居点。位于[GetProvince('(int32)6871').GetName]市附近、被称为 Heptanesia 的七个岛屿群被建议为可能的希腊新殖民地。"
 indian_mission_03_aparanta_task_15:0 "阿里亚卡省"
 indian_mission_03_aparanta_task_15_DESC:0 "我们已经建立了阿里亚卡省，确保了我们对西印度海岸的控制。"
 indian_mission_03_aparanta_task_16:0 "西部行省"
 indian_mission_03_aparanta_task_16_DESC:0 "印度塞西亚人的西部总督领因其广泛的贸易路线与阿里亚卡海岸线相连而繁荣。将他们纳入我们的王国，将为我们打开拉里昔的宝藏。"
 indian_mission_03_aparanta_task_17:0 "南巴努斯王国"
 indian_mission_03_aparanta_task_17_DESC:0 "前任国王南巴努斯的领土现在是我们的了。这些繁荣的贸易中心应该得到重振。"
 indian_mission_03_aparanta_task_17_tooltip:0 "[GetProvince('(int32)6843').GetArea.GetName]、[GetProvince('(int32)4478').GetArea.GetName]和[GetProvince('(int32)4475').GetArea.GetName]的省份也将获得'#Y $indian_trade_goods_modifier$#!'修正。"
 indian_mission_03_aparanta_task_18:0 "湿婆神庙之城"
 indian_mission_03_aparanta_task_18_DESC:0 "[GetProvince('(int32)4475').GetName]是该地区最大和最重要的城市，也是印度教湿婆神的庙宇城市。我们应该把湿婆神引入希腊-佛教的万神殿，并在[GetProvince('(int32)4475').GetName]建造一座寺庙。"
 indian_mission_03_aparanta_task_19:0 "进入苏罗犀那"
 indian_mission_03_aparanta_task_19_DESC:0 "当我们越过西方国家时，我们在这一地区的最后征服者是新成立的苏罗犀那王国。它的独立时间并不长。"
 indian_mission_03_aparanta_task_1_DESC:0 "印度河以外是印度海岸的繁华贸易城市，以及属于印度塞西亚的西部总督领。这一地区由几个相互争斗的印度国家主导，这些国家征服的时机已经成熟。"
 indian_mission_03_aparanta_task_2:0 "消灭孔雀王朝"
 indian_mission_03_aparanta_task_20:0 "摩偷罗城"
 indian_mission_03_aparanta_task_20_DESC:0 "[GetProvince('(int32)4420').GetName]是苏罗犀那的首都，是重要的佛教圣地。我们已经在这里设立了一个总督领，应该开始让希腊定居者居住在这个城市。"
 indian_mission_03_aparanta_task_21:0 "沙漠贸易站"
 indian_mission_03_aparanta_task_21_DESC:0 "一片广阔的沙漠将我们在印度河流域的领土与拉里昔分开。虽然对这个沙漠地区的控制是有限的，但在其外围建立一个希腊化的贸易站将使我们能够与称之为家园的各个部落进行交流。"
 indian_mission_03_aparanta_task_22:0 "拉里昔省"
 indian_mission_03_aparanta_task_22_DESC:0 "我们已经建立了拉里昔省，那里有许多印度最伟大的城市和建筑奇迹。"
 indian_mission_03_aparanta_task_2_DESC:0 "孔雀帝国已经失去了位于恒河流域的中心地带，但仍然拥有西部的土地。我们应该确保一劳永逸地彻底铲除孔雀帝国。"
 indian_mission_03_aparanta_task_3:0 "锡拉斯特里亚半岛"
 indian_mission_03_aparanta_task_3_DESC:0 "锡拉斯特里亚半岛是一个重要的贸易和商业中心，拥有宝贵的战略价值。征服这个半岛是至关重要的。"
 indian_mission_03_aparanta_task_4:0 "狄奥菲洛斯港"
 indian_mission_03_aparanta_task_4_DESC:0 "[GetProvince('(int32)6857').GetName]港口是西格迪斯省的首府。作为一个重要而有价值的沿海定居点，[GetProvince('(int32)6857').GetName]应该被希腊化，并被重建为一个合适的希腊城市。"
 indian_mission_03_aparanta_task_5:0 "健絺的堡垒"
 indian_mission_03_aparanta_task_5_DESC:0 "健絺岛具有至关重要的战略意义，应该加强防御，防止敌人从海上入侵。"
 indian_mission_03_aparanta_task_6:0 "王朝港口"
 indian_mission_03_aparanta_task_6_DESC:0 "[GetProvince('(int32)6830').GetName] 这个小定居点已经有了一个希腊名字，然而我们家族中的一些人认为它应该被重新建立为一个完全希腊化的城市，并以我们王朝的一个成员重新命名。"
 indian_mission_03_aparanta_task_7:0 "锡拉斯特雷纳王国"
 indian_mission_03_aparanta_task_7_DESC:0 "由于整个锡拉斯特里亚半岛都在我们的控制之下，我们应该对这个古老的王国和它的许多商业港口进行大量投资。"
 indian_mission_03_aparanta_task_8:0 "西格迪斯省"
 indian_mission_03_aparanta_task_8_DESC:0 "我们已经建立了西格迪斯省。这个半岛具有巨大的商业和战略价值，将成为希腊-印度文明的摇篮。"
 indian_mission_03_aparanta_task_9:0 "阿里亚卡的河流"
 indian_mission_03_aparanta_task_9_DESC:0 "[GetProvince('(int32)7074').GetArea.GetRegion.GetName]是一个拥有数不清的财富、民族和文化的地区。相对来说，它还未被希腊世界所开发，以一些大型贸易集市而闻名。"
 indian_mission_03_aparanta_task_final:0 "主宰西方"
 indian_mission_03_aparanta_task_final_DESC:0 "我们的伟大领袖已经征服了西格迪斯、阿里亚卡和拉里昔地区。由于这一宏伟的成就，他们被授予‘征服者’的称号。"
 indian_mission_04_dravidia:0 "征服南方"
 indian_mission_04_dravidia_BUTTON_TOOLTIP:0 "现在是我们将南方诸侯纳入麾下的时候了。"
 indian_mission_04_dravidia_CRITERIA_DESCRIPTION:0 "在我们征服了迈索里亚、潘狄奥尼亚和利迈里卡的全部省份之后，该使命完成。"
 indian_mission_04_dravidia_DESCRIPTION:0 "印度南部由达罗毗荼民族统治，长期以来一直不被征服，甚至连摩揭陀也不例外。佛教在那里占有一席之地，强大的般帝耶诸侯对厄里特里亚海的贸易施加了巨大的影响。它是我们全面征服印度大陆的最后一块垫脚石。"
 indian_mission_04_dravidia_task_1:0 "征服南方"
 indian_mission_04_dravidia_task_10:0 "泰米尔贸易"
 indian_mission_04_dravidia_task_10_DESC:0 "泰米尔诸侯对这个地区的贸易施加了大量的影响。这些贸易城市现在是我们的，他们的商业利益也是我们的。"
 indian_mission_04_dravidia_task_11:0 "三王城"
 indian_mission_04_dravidia_task_11_DESC:0 "潘狄奥尼亚国王在[GetProvince('(int32)6917').GetName]、[GetProvince('(int32)6947').GetName]和[GetProvince('(int32)6938').GetName]三座城市会面，这三座城市也被称为‘三王城’。这三座圣城构成了泰米尔人在印度南部权力基地的核心。在这里的大量投资将使泰米尔人对我们的统治心悦诚服，同时也在潘狄奥尼亚建立一个强大的希腊权力中心。"
 indian_mission_04_dravidia_task_12:0 "通往塔普罗巴涅的桥梁"
 indian_mission_04_dravidia_task_12_DESC:0 "在港口城市[GetProvince('(int32)6915').GetName]之外，是连接印度和塔普罗巴涅岛的唯一陆桥。我们应该把[GetProvince('(int32)6915').GetName]作为入侵该岛的集结地。"
 indian_mission_04_dravidia_task_13:0 "征服塔普罗巴涅"
 indian_mission_04_dravidia_task_13_DESC:0 "我们已经征服了塔普罗巴涅岛。这是一个重要的宗教和商业地区，在我们的统治下一定会蓬勃发展。"
 indian_mission_04_dravidia_task_14:0 "狮子岩"
 indian_mission_04_dravidia_task_14_DESC:0 "锡吉里耶（Sigiriya）岩石，也被称为‘狮子岩’，已经发展成为一个至关重要的佛教圣地。它与塔普罗巴涅的首都[GetProvince('(int32)6950').GetName]相连，这两个城市吸引了许多朝圣者。重要的是，我们要发展这个地区，以反映我们宗教的伟大。"
 indian_mission_04_dravidia_task_15:0 "塔普罗巴涅的希腊港口"
 indian_mission_04_dravidia_task_15_DESC:0 "塔普罗巴涅的希腊人人数有限。而且它的港口充斥着海上贸易带来的财富，在沿海地区建立希腊城市将在岛上建立突出的希腊化存在。"
 indian_mission_04_dravidia_task_16:0 "潘狄奥尼亚省"
 indian_mission_04_dravidia_task_16_DESC:0 "我们已经建立了潘狄奥尼亚省。泰米尔人将及时学会接受希腊人的统治。"
 indian_mission_04_dravidia_task_17:0 "南方的王国"
 indian_mission_04_dravidia_task_17_DESC:0 "利迈里卡是重要的印度香料贸易的中心。我们必须控制这个地区，并控制这些贸易路线。"
 indian_mission_04_dravidia_task_18:0 "香料贸易"
 indian_mission_04_dravidia_task_18_DESC:0 "利迈里卡海岸的几个城市提供了通往阿拉伯、非洲和希腊世界其他地区的重要贸易路线。从罗马到亚历山大再到波斯波利斯，对香料的需求从未如此之高。如果我们不利用这些贸易路线，那就是傻子。"
 indian_mission_04_dravidia_task_18_tooltip:0 "[GetProvince('(int32)6890').GetName]、[GetProvince('(int32)6893').GetName]和[GetProvince('(int32)6895').GetName]也将获得'#Y $spice_trade_modifier$#!'修正。"
 indian_mission_04_dravidia_task_19:0 "地球的尽头"
 indian_mission_04_dravidia_task_19_DESC:0 "[GetProvince('(int32)6902').GetName]代表了我们伟大王国所到达的最远范围。在印度次大陆南部的尖端建立一个港口将作为一个伟大的象征性胜利。"
 indian_mission_04_dravidia_task_1_DESC:0 "南方富裕的泰米尔王国控制着与波斯和阿拉伯的宝贵的香料贸易，并且一直在抵制来自北方的征服。现在是改变这种状况的时候了。"
 indian_mission_04_dravidia_task_2:0 "征服羯陵伽"
 indian_mission_04_dravidia_task_20:0 "利迈里卡省"
 indian_mission_04_dravidia_task_20_DESC:0 "我们已经在次大陆西海岸建立了利迈里卡省。随着南部的贸易城市现在在我们的庇护下，财富将从整个希腊化世界流向我们的王国。"
 indian_mission_04_dravidia_task_2_DESC:0 "羯陵伽人是一个没有中央政府的独立而强大的民族，并且拥有一支强大的海军。他们已经拒绝了附庸的提议，现在已经成为一个必须被消除的麻烦。"
 indian_mission_04_dravidia_task_3:0 "建立印度海军"
 indian_mission_04_dravidia_task_3_DESC:0 "随着羯陵伽王国成为废墟，我们现在有机会建立一支能与亚洲任何强国相匹敌的海军。我们将成为厄里特里亚海的统治者。"
 indian_mission_04_dravidia_task_4:0 "东方市场"
 indian_mission_04_dravidia_task_4_DESC:0 "羯陵伽海岸的富裕城市从与东方国家的贸易中获益良多。现在是我们夺取这些贸易网络控制权的时候了，这对我们有利。"
 indian_mission_04_dravidia_task_5:0 "攻克迈索卢斯"
 indian_mission_04_dravidia_task_5_DESC:0 "迈索卢斯河贯穿印度中部，其肥沃的土地是许多伟大王国的源泉。在这个地区茂密的森林和不太友好的地形上航行可能是一个挑战，但我们的毅力会得到回报。"
 indian_mission_04_dravidia_task_6:0 "发展内部省份"
 indian_mission_04_dravidia_task_6_DESC:0 "随着迈索里亚内部地区在我们的控制之下，用当地的基础设施和投资来发展这一地区将对我们有很大帮助。"
 indian_mission_04_dravidia_task_7:0 "迈索里亚港口"
 indian_mission_04_dravidia_task_7_DESC:0 "迈索卢斯河口有几个伟大的港口城市。这将是一个新的希腊化城市的最佳位置。"
 indian_mission_04_dravidia_task_8:0 "迈索里亚省"
 indian_mission_04_dravidia_task_8_DESC:0 "我们已经建立了迈索里亚省。随着羯陵伽被征服，内部省份被纳入麾下，这片森林覆盖的不羁之地终于被驯服了。"
 indian_mission_04_dravidia_task_9:0 "谦卑的达罗毗荼人"
 indian_mission_04_dravidia_task_9_DESC:0 "达罗毗荼人是一个骄傲的、热烈的独立民族。这种独立必须结束，这个地区的人民应该尽早熟悉希腊人的统治，而不是以后。"
 indian_mission_04_dravidia_task_final:0 "主宰南方"
 indian_mission_04_dravidia_task_final_DESC:0 "我们伟大的领袖已经征服了迈索里亚、潘狄奥尼亚和利迈里卡区域。他们被授予‘达罗毗底克斯‘称号，以纪念他们的成就。"
 own_all_of_india_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有#Y $dravida_region$#!、#Y $karnata_region$#!、#Y $vindhyaprstha_region$#!、#Y $aparanta_region$#!、#Y $pracya_region$#!、#Y $madhyadesa_region$#!、#Y $avanti_region$#!、#Y $maru_region$#! 和#Y $gandhara_region$#!区域的所有省份。"

l_simp_chinese:
 NUMIDIAN_EMPIRE:0 "努米底亚帝国"
 alliance_network:0 "联盟网络"
 atlas_resurgence:0 "阿特拉斯的复兴"
 breadbasket_of_numidia:0 "努米底亚的面包篮"
 fezzani_influence:0 "费赞的影响"
 king_of_numidia:0 "努米底亚的国王"
 me_numidian.7.tt_a:0 "我们将获得对[GetCountry('MAU').GetName]所拥有的每个省份的宣称。"
 me_numidian.7.tt_b:0 "我们将对[GetCountry('MSS').GetName]拥有的每一个省提出宣称"
 me_numidian_1.a:0 "国王[ROOT.GetCountry.GetRuler.GetName]万岁！"
 me_numidian_10.a:0 "为我们国家之间的新起点干杯！"
 me_numidian_10_desc:0 "你已经完成了与你的顾问们的会面，一些重要的决定已经做出。索科西亚的仆从国将在我们未来的军事努力中帮助我们。他们的支持将是无价的，因为我们将继续扩张，征服我们周围的当地部落，以及我们在未来可能遇到的任何其他地区的权力。"
 me_numidian_10_title:0 "索科西亚的仆从国"
 me_numidian_11.a:0 "我们已经明智地选择了我们的新指挥官！"
 me_numidian_11_desc:0 "现在我们已经找到一个优秀的指挥官来领导我们的军队，我们可以继续推进我们的征服。有了真正的努米底亚指挥官领导我们的轻骑兵，我们将粉碎任何愚蠢到站在我们践踏的铁蹄前的人！"
 me_numidian_11_title:0 "努米底亚的指挥官"
 me_numidian_12.a:0 "我们将加强我们的军队"
 me_numidian_12_desc:0 "我们现在在国内有了可靠的、稳定的马匹生产，这要归功于你所下达的命令和我们忠实的执行。我们可以利用这些盈余来建立我们的军队，增加我们骑士的规模和质量，提高我们人口的产出。你提出这个行动方案是非常明智的；这些马匹将在我们未来的征服中证明是至关重要的。"
 me_numidian_12_title:0 "马术"
 me_numidian_13.a:0 "现在正是打击迦太基之时。"
 me_numidian_13_desc:0 "迦太基及其众多臣属目前掌握着一些我们视为重大利益所在的土地。我们必须夺回曾属于祖先的土地，愿祖先引导我们复仇之手，并在敌人来得及准备之前发动攻击。"
 me_numidian_13_title:0 "对抗迦太基"
 me_numidian_14.a:0 "为长久和繁荣的联盟干杯"
 me_numidian_14_desc:0 "与一些伊比利亚部落建立这个联盟网络，可能会被证明对阻止我们国家的潜在入侵者很有用。只要我们能说服我们的新盟友在我们的进攻战争中帮助我们!就不会有多少人能够抵御联合攻击了。"
 me_numidian_14_title:0 "一个联盟网络"
 me_numidian_15.a:0 "我们的国家将繁荣"
 me_numidian_15_desc:0 "现在，我们控制了海峡两岸的两块领土，我们基本上控制了进出地中海的所有贸易。然而，这种成功带来了新的责任；我们将需要一支海军来帮助保护我们的贸易利益不受潜在的海盗影响。"
 me_numidian_15_title:0 "海峡"
 me_numidian_16.a:0 "离努米底亚王国又近了一步"
 me_numidian_16_desc:0 "我们与[GetCountry('CAR').GetName]和他们的各个科目的对抗非常成功。我们能够从他们的控制中夺取努米底亚地区的控制权，我们现在几乎拥有所有属于我们的土地。我们现在把目光投向了我们国家新扩大的边界，投向了费赞地区，以及撒丁岛和科西嘉岛。"
 me_numidian_16_title:0 "努米底亚是我们的！"
 me_numidian_17.a:0 "我们的帝国还在不断延伸"
 me_numidian_17_desc:0 "费赞部落终于倒下了!他们的征兵部队不是我们协调和纪律严明的军队的对手，我们能够迅速吞并他们所占领的沙漠土地。看到他们的军队在我们的人面前迅速散去，你会笑的--这几乎是在浪费我们追击他们的时间。"
 me_numidian_17_title:0 "堕落的费赞部落"
 me_numidian_18.a:0 "他们的土地将属于我们"
 me_numidian_18_desc:0 "现在我们已经加强了我们国家的边界，我们可以把目光投向位于阿特拉斯地区南部的努米底亚小部落。猎杀这些强盗是件小事，因为我们知道我们可以在我们自己加强的领土上安全地休息。"
 me_numidian_18_title:0 "阿特拉斯地区"
 me_numidian_19.a:0 "我们是不可阻挡的"
 me_numidian_19_desc:0 "我们已经征服了所有属于我们祖先的土地，向世界展示了我们的事业是公正的，得到了诸神的认可。我们与地方、区域和大国进行了很多很多的战争，尽管我们付出了血腥和残酷的人马代价，但我们总是取得了胜利。在别人怀疑我们能否成功的时候，我们在征服中表现出了坚韧不拔的精神、决心和耐心。我们应该为我们所完成的一切感到骄傲--努米底亚帝国万岁！"
 me_numidian_19_title:0 "努米底亚帝国"
 me_numidian_1_desc:0 "我们的新君主，[ROOT.GetCountry.GetRuler.GetName]，作为光荣的努米底亚王国的新国王，加冕是如此壮观的见证--真的，在这些土地上从未见过这样的场景。我们已经收到了来自邻近地区各部落的使节，他们的驮兽满载着贡品和礼物送给新国王。在[ROOT.GetCountry.GetRuler.GetName]的领导下，我们的王国只能想象未来会怎样..."
 me_numidian_1_title:0 "努米底亚王室"
 me_numidian_2.a:0 "召集战争委员会"
 me_numidian_20.a:0 "撒丁岛和科西嘉岛将是我们的！"
 me_numidian_20_desc:0 "现在我们拥有整个非洲地区，北部的撒丁岛和科西嘉岛拥有的土地将被证明是有用的，特别是如果我们决定在意大利半岛上展开行动。只要你一句话，我们就会开始为即将到来的事情做初步准备。"
 me_numidian_20_title:0 "撒丁人和科西嘉人的愿望"
 me_numidian_2_desc:0 "众所周知，我们渴望得到新的土地，渴望用我们的力量来证明我们真正的能力。[ROOT.GetCountry.GetRuler.GetName]将与他的顾问们商议，与他们每一个人进行长时间的讨论，然后决定我们将扩展哪块疆土。"
 me_numidian_2_title:0 "最初的扩张"
 me_numidian_3.a:0 "开战！"
 me_numidian_3_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已经做出了一个决定，这个决定在事后看来很容易做出。我们将向位于南方的部落提出要求，结束他们对我们领土的侵犯。预兆是有利的；我们不期望我们的设计受到严重的抵抗。"
 me_numidian_3_title:0 "最初的征服"
 me_numidian_4.a:0 "开始整合！"
 me_numidian_4_desc:0 "现在，[GetCountry('MSY').GetName]的部落作为仆从国受到我们的保护，让我们联合起来，加强我们的国家。我们将立即开始[GetCountry('MSY').GetName]的整合工作。这将需要几年的艰苦工作，然而在完成后，他们将成为国家的一个组成部分。"
 me_numidian_4_title:0 "部落联盟"
 me_numidian_5.a:0 "离统一的努米底亚又近了一步！"
 me_numidian_5_desc:0 "一件事导致了另一件事；[GetCountry('MSS').GetName]和[GetCountry('CAR').GetName]的两位统治者之间不太可能的友谊为两国人民之间的战略联盟开辟了道路。现在，我们与强大的布匿国家迦太基友好相处，关系很好，他们允许我们领导[GetCountry('MSY').GetName]的仆从国，一个相对强大的努米底部落。"
 me_numidian_5_title:0 "一个不可能的联盟"
 me_numidian_6.a:0 "一个值得庆祝的理由！"
 me_numidian_6_desc:0 "多年来不断努力整合马叙利亚国家，终于得到了回报。我们现在可以认为他们是我们王国的一个组成部分。虽然我们在过去有过困难，但现在是时候让我们背弃共同的历史，共同展望未来了。愿诸神赐予我们多年的和平与繁荣！"
 me_numidian_6_title:0 "马叙利亚的整合"
 me_numidian_7.a:0 "打击的时机就是现在！"
 me_numidian_7_desc:0 "长久以来，邻近的努米底亚部落一直是我们的眼中钉，无论是袭击还是影响我们的贸易。已经有了预兆，据了解，诸神赞成我们主动结束他们的持续犯罪。出击的时间临近了；我们必须按要求成为努米底亚部落的主导者，并在他们获得更强大的联盟和加强他们的士兵之前迅速吞并他们的土地。"
 me_numidian_7_title:0 "敌对部落"
 me_numidian_8.a:0 "让我们继续进一步推动"
 me_numidian_8_desc:0 "作为我们成功征服的结果，我们似乎遇到了各种其他的部落，他们的方式很奇怪，是我们自己不熟悉的。鉴于这些巨大的差异，我们显然很难和谐地并肩生活；也许我们可以进一步扩大我们的边界..."
 me_numidian_8_title:0 "发现更多的小部落"
 me_numidian_9.a:0 "我们将共同繁荣！"
 me_numidian_9_desc:0 "由于重建我们新征服的土地和改善现有的基础设施，我们已经赢得了占领土地的居民的好感。人们错误地认为我们是简单的骑兵，是不熟悉如何管理领土的野蛮人；你们在这里取得的成就将结束这些错误的观念。"
 me_numidian_9_title:0 "重建我们新征服的土地"
 numidian_commanders:0 "努米底亚指挥官"

 numidian_march:0 "努米底亚游行"
 numidian_mission_01:0 "努米底亚王国"
 numidian_mission_01_BUTTON_TOOLTIP:0 "努米底亚王国"
 numidian_mission_01_CRITERIA_DESCRIPTION:0 "一旦努米底亚王国成立，我们在西地中海建立了一个权力基地，任务才算完成。"
 numidian_mission_01_DESCRIPTION:0 "努米底亚人必须从迦太基人的桎梏中解放出来。我们必须利用我们的优势骑兵来对抗迦太基，解放我们的人民，并在努米底亚王国下统一起来。\n然后我们就可以开始巩固我们在地中海西部地区的地位，利用迦太基使用的贸易路线，建立一个跨越海峡进入伊比利亚的立足点。"
 numidian_mission_01_task_01:0 "努米底亚王室"
 numidian_mission_01_task_01_DESC:0 "努米底亚人需要一个能够崛起并将该地区统一在一个王冠之下的领袖；也许[ROOT.GetCountry.GetRuler.GetName]就是那个人......\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 numidian_mission_01_task_02:0 "第一步"
 numidian_mission_01_task_02_DESC:0 "为了证明我们能扛起努米底亚的王冠，扩大我们的边界和加强我们的军队是明智的。\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 numidian_mission_01_task_03:0 "一个不可能的联盟"
 numidian_mission_01_task_03_DESC:0 "迦太基目前对努米底亚的一个部落拥有影响力，[GetCountry('MSY').GetName]。也许如果我们与[GetCountry('CAR').GetName]交好，他们会允许我们再次领导被征服的努米底亚部落。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 numidian_mission_01_task_04:0 "一个部落的联合"
 numidian_mission_01_task_04_DESC:0 "现在我们已经把[GetCountry('MSY').GetName]的Numidian部落从[GetCountry('CAR').GetName]的桎梏中解救出来，我们必须把我们的部落统一在一个统治者之下。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 numidian_mission_01_task_04_tt:0 "[GetCountry('MSS').GetName]将与[GetCountry('MSY').GetName]建立一个部落联盟，将国家合并在一个领导者之下。"
 numidian_mission_01_task_05:0 "对立的部落"
 numidian_mission_01_task_05_DESC:0 "与我们相邻的努米底亚部落一直在巩固他们的权力基础，慢慢地扩张并建立强大的联盟。在他们变得过于强大之前，需要做些什么……\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 numidian_mission_01_task_05_tt:0 "我们将获得邻近的努米底亚部落的每一个省份的宣称"
 numidian_mission_01_task_06:0 "繁荣的首都"
 numidian_mission_01_task_06_DESC:0 "我们的首都领土的基础设施需要改进。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 numidian_mission_01_task_07:0 "建设矿区"
 numidian_mission_01_task_07_DESC:0 "我们必须充分利用这片土地所蕴含的自然资源；通过辛勤劳动，我们可以建设自己的基础设施。通过与其他国家进行贸易往来，从而增加我们的财富和名望——这两样正是我们迫切需要的。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 numidian_mission_01_task_08:0 "我们国家的粮仓"
 numidian_mission_01_task_08_DESC:0 "如果我们计划在整个努米底亚地区和其他地区展开辉煌的战役，我们必须有一条足够强大的供应线来支持军队。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 numidian_mission_01_task_09:0 "马术"
 numidian_mission_01_task_09_DESC:0 "我们必须利用我们国家生产的马匹的优势。我们必须对年轻一代进行骑马训练，并有选择地培育出最强壮的马匹。\n\n\n\n\n\n\n\n\n\n@persia_mil19!"
 numidian_mission_01_task_10:0 "遇到更多的部落"
 numidian_mission_01_task_10_DESC:0 "由于我们的边界不断扩大，我们的征服成果来自于我们的祖先所不知道的陌生土地，我们遇到了许多其他的部落，我们很快就会提出自己的宣称。\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 numidian_mission_01_task_11:0 "重建被征服的土地"
 numidian_mission_01_task_11_DESC:0 "现在我们已经控制了这片土地，我们必须重建我们的运动所造成的破坏 - 这片土地呼唤着恢复。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 numidian_mission_01_task_12:0 "强化我们的边界"
 numidian_mission_01_task_12_DESC:0 "若要确保我们持续免受潜在入略者的威胁，就必须加强我们的边境防御。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 numidian_mission_01_task_13:0 "对抗迦太基"
 numidian_mission_01_task_13_DESC:0 "迦太基掌握着一些曾经属于我们人民的土地，我们必须夺回属于我们的东西！这最终可能导致与迦太基发生冲突，但我们绝不会退让……\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 numidian_mission_01_task_13_tt:0 "我们将获得对整个努米底亚地区的宣称。"
 numidian_mission_01_task_14:0 "从朝贡国到仆从国"
 numidian_mission_01_task_14_DESC:0 "如果我们要成为一个更强大的国家，与我们周围的地方势力抗衡，特别是迦太基这个地区势力，我们需要我们的朝贡国作为一个正式的仆从国加入到这些战斗中。"
 numidian_mission_01_task_15:0 "创建一个联盟网络"
 numidian_mission_01_task_15_DESC:0 "我们必须在我们信任和可以依赖的国家之间建立一个联盟网络，以帮助我们征服和保卫我们的土地。"
 numidian_mission_01_task_16:0 "柱子"
 numidian_mission_01_task_16_DESC:0 "现在，我们控制了海格力斯之柱，我们控制了进出地中海的任何贸易；我们可以利用这一点，提高我们自己的贸易价值。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 numidian_mission_01_task_17:0 "努米底亚是我们的"
 numidian_mission_01_task_17_DESC:0 "现在我们掌握了努米底亚地区，我们必须进一步向东看。我们必须在迦太基巩固并迫使我们回到努米底亚之前，进一步攻击并瓦解他们。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 numidian_mission_01_task_17_tt:0 "我们将获得对整个非洲和费赞地区的宣称。"
 numidian_mission_01_task_18:0 "非洲贸易港口"
 numidian_mission_01_task_18_DESC:0 "在与迦太基的战争之后，我们必须利用我们吞并的地中海沿岸的一些有价值的贸易港口。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 numidian_mission_01_task_19:0 "费赞之事"
 numidian_mission_01_task_19_DESC:0 "现在我们是这些土地的新主人，我们必须重建一些在与迦太基的战斗中遭到破坏的省份，并加强我们对这些省份的控制。\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 numidian_mission_01_task_20:0 "布匿的城市"
 numidian_mission_01_task_20_DESC:0 "我们现在控制的努米底亚地区曾经属于布匿民族的城市--继续保持甚至改善基础设施是明智之举。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 numidian_mission_01_task_21:0 "巩固阿特拉斯"
 numidian_mission_01_task_21_DESC:0 "阿特拉斯区域剩余的部落将了解努米底亚的力量。\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 numidian_mission_01_task_21_tt:0 "我们将获得对整个阿特拉斯地区的宣称。"
 numidian_mission_01_task_22:0 "小努米底亚部落"
 numidian_mission_01_task_22_DESC:0 "现在，小努米底亚部落终于被吸收到我们的国家，我们可以建立起现在属于我们的土地。\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 numidian_mission_01_task_23:0 "努米底亚帝国"
 numidian_mission_01_task_23_DESC:0 "现在，我们庞大的国家横跨多个地区，我们现在可以宣称是努米底亚帝国的称号！\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 numidian_mission_01_task_24:0 "努米底亚人的指挥官"
 numidian_mission_01_task_24_DESC:0 "现在我们的军队有了稳定的马匹供应，我们需要有能力的将军来带领我们的骑兵作战。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 numidian_mission_01_task_24_tt:0 "有一个军团，它的指挥官有超过#Y 10#! 军略。"
 numidian_mission_01_task_25:0 "撒丁人的愿望"
 numidian_mission_01_task_25_DESC:0 "我们已经把目光投向撒丁岛和科西嘉岛。然而，为了征服这些外国岛屿，我们需要一支足够大的海军来运送我们的军队。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 numidian_mission_01_task_26:0 "阿特拉斯的城市"
 numidian_mission_01_task_26_DESC:0 "阿特拉斯地区的基础设施必须得到改善，以支持现有的人口；这些遥远的省份，离文明中心如此之远，迫切需要我们的时间和投资。\n\n\n\n\n\n\n\n\n\n@persia_mil17!"

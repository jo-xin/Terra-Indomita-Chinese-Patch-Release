l_simp_chinese:
 blacksmith_tt:0 "至少拥有一行省设有铁匠铺。"
 bronze_mine_tt:0 "至少拥有一行省产贱金属且有矿场。"
 crumbling_zhongshan:0 "崩塌之墙"
 desc_crumbling_zhongshan:0 "近因赵攻，国中大乱。"
 desc_zhongshan_final_mod:0 "中山之星冉冉升起。"
 desc_zhongshan_inspired_disloyalty:0 "中山君王煽动我狄人臣属反叛。"
 desc_zhongshan_leage_of_public_weal:0 "推翻赵国的联盟已成立。"
 desc_zhongshan_steppe_heritage:0 "中山由春秋时期操狄语之族群所建立。此一传承如今已焕发新生。"
 desc_zhongshan_steppe_mod:0 "纵使我邦已深受华夏同化，其他华夏诸邦仍视吾辈为蛮夷。如今，正是时候让彼等见识蛮夷之能耐。"
 integrated_di:0 "狄人擢升"
 integrated_di_tt:0 "白狄文化拥有贵族公民权。"
 is_in_modong_shuofang:0 "位于漠东或朔方地区。"
 is_in_yong_yu_ji:0 "位于雍、豫或冀地区。"
 me_zhongshan_1.a:0 "我之防御工事已修复！"
 me_zhongshan_10.a:0 "草原兄弟将援助吾等！"
 me_zhongshan_100.a:0 "修葺费用不菲…"
 me_zhongshan_100_desc:0 "虽王[ROOT.GetCountry.GetRuler.GetName]曾望修缮提前完工而耗费不超额，然现实几不如此。当我工匠修葺[GetProvince('(int32)8686').GetName]南墙一处损毁之时，一段城墙坍塌，压死数十役夫，且将工期与耗费一并拖后。更糟者，数人请辞，以其缺乏安全标准，且恐为落石压毙。"
 me_zhongshan_100_title:0 "$zhongshan_missions_task_1$"
 me_zhongshan_10_desc:0 "吾等日益亲近草原祖脉之风，正为国中带来可嘉之利，吾主。吾等已觅得草原盟友，与誓将驰援之部落结盟，且新友之各氏族已承诺举族加入我军。此外，重修草原之道亦大进吾骑术之艺，使吾等能如先祖所曾那般，令#E 中国#!敌邦闻风丧胆。"
 me_zhongshan_10_title:0 "$zhongshan_missions_task_10$"
 me_zhongshan_11.a:0 "纵是齐国亦将惊叹此艺术杰作！"
 me_zhongshan_11_desc:0 "[ROOT.GetCountry.GetRuler.GetName]急不可耐地等候新近定制之银翼神兽雕像揭幕，渴望向[ROOT.GetCountry.GetName]臣民与异邦显贵展示王国之艺术辉煌。当匠人揭幕雕像之际，其景令人叹为观止——两只巨大银制貔貅神兽，镶嵌宝石，羽翼辉煌，金丝嵌边。人群爆发出狂热赞叹，异邦人士交头接耳，纳闷如[ROOT.GetCountry.GetName]这般号称落后之蛮邦，何以有此等神工，能将天地融汇于如此壮观之中。"
 me_zhongshan_11_title:0 "$zhongshan_missions_task_11$"
 me_zhongshan_12.a:0 "复仇之味甘甜。"
 me_zhongshan_12_desc:0 "吾等已从[GetCountry('ZHA').GetName)]王国夺取其权位重镇，[ROOT.GetCountry.GetRuler.GetName]吾主！今我国家终趋稳定，且向敌复仇已遂，[ROOT.GetCountry.GetName]可欣欣向荣，再度越界出击。"
 me_zhongshan_12_title:0 "$zhongshan_missions_task_12$"
 me_zhongshan_13.a:0 "惊叹此神妙之剑！"
 me_zhongshan_13_desc:0 "赖奴隶与农民在锡铜矿中加班劳作，我冶炼工匠得以产出丰裕之青铜，[ROOT.GetCountry.GetRuler.GetName]吾王！最上等最纯净之熔炼青铜，复由我铁匠锻造成一柄华美致命之宝剑，既可用于传统仪典，亦可由大王亲持征战沙场！愿此威仪战器点缀我殿堂，斩杀[ROOT.GetCountry.GetName]之敌。"
 me_zhongshan_13_title:0 "$zhongshan_missions_task_13$"
 me_zhongshan_14.a:0 "北方部落已在我掌控之下。"
 me_zhongshan_14_desc:0 "广袤北部平原与荒漠终于为[ROOT.GetCountry.GetName]所据，此赖吾王[ROOT.GetCountry.GetRuler.GetName]之征伐与外交之功！吾等对#E 朔方#!与#E 漠东#!诸部之统治方启，更多部民蜂拥归附，扩张我疆界。新附之民促吾等从草原分散氏族中夺取更多土地，以此通过人口增益进一步巩固[GetProvince('(int32)8686').GetName]王廷中之部落习俗与利益。"
 me_zhongshan_14_title:0 "$zhongshan_missions_task_14$"
 me_zhongshan_15.a:0 "我们从未真正遗忘本根…"
 me_zhongshan_15_desc:0 "朝中保守之#E 姬#!大臣恳请王[ROOT.GetCountry.GetRuler.GetName]三思，然近在#E 狄#!与#E 胡#!之地之胜绩已坚我王之心。部落军团之大批武士已加入我行列，#E 白狄#!诸部在将游牧世界引入[GetProvince('(int32)8686').GetName]中发挥了关键作用。王与朝议决意引导[ROOT.GetCountry.GetName]远离#E 华夏#!之奸巧作风，聚精致力于效忠先祖之正道。王当如先祖所为之装束：驰骋出征，征收贡赋，令敌胆寒，并力争成为草原游牧诸部无可争议之#E 单于#!。"
 me_zhongshan_15_title:0 "$zhongshan_missions_task_15$"
 me_zhongshan_16.a:0 "吾等将统治中夏！"
 me_zhongshan_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]吾王，今可认为[ROOT.GetCountry.GetName]已跻身#E 中国#!最强之邦！我城邑日趋繁荣，因我日益受各类#E 华夏#!族群之艺术文化影响，吸收其哲学、兵法与治国之道。[GetProvince('(int32)8686').GetName]大都会为全华夏所艳羡，此伟大世界性都城吸引天下四方之艺匠与工程师纷至沓来，而昔日部落旧俗正缓缓消逝于远方。让我等无疑地作为华夏之邦前行，并夺取#E 中国#!全境及#Y 天子#!之尊号，献予我亲爱之王。"
 me_zhongshan_16_title:0 "$zhongshan_missions_task_16$"
 me_zhongshan_17.a:0 "时间飞快流逝…"
 me_zhongshan_17_desc:0 "即便在深夜，[ROOT.GetCountry.GetRuler.GetName]亦梦见[GetCountry('ZHA').GetName)]大军围攻[GetProvince('(int32)8686').GetName]，蹂躏我乡野。[GetCountry('ZHA').GetName)]之王[GetCountry('ZHA').GetRuler.GetName)]之连番猛攻，于[GetCountry('ZHS').GetName)]举国而言实为惨痛之经历，盖[GetProvince('(int32)8686').GetName]城垣与中山全境所有防御工事正日趋崩坏。\n\n遏制此衰败乃[ROOT.GetCountry.GetRuler.GetName]王之所职，否则[GetCountry('ZHS').GetName)]将如晋国般化为乌有。"
 me_zhongshan_17_title:0 "$zhongshan_missions$"
 me_zhongshan_1_desc:0 "我工匠汇聚足够资财，已修复我最后堡垒之残破城垣，为困苦之民带来希望曙光。近败之腐臭终渐消散，[ROOT.GetCountry.GetName]今可稍作喘息。"
 me_zhongshan_1_title:0 "$zhongshan_missions_task_1$"
 me_zhongshan_2.a:0 "齐将拯救我等。"
 me_zhongshan_200.a:0 "中山将得保护。"
 me_zhongshan_200_desc:0 "岌岌可危之[GetCountry('ZHS').GetName)]小邦已向我王[GetCountry('QII').GetRuler.GetName]呈递最后求援之请，祈保其免遭我共同之敌[GetCountry('ZHA').GetName)]侵害。彼等早已证明乃转移#E 赵#!诸领主注意力之绝佳牵制，使其无暇顾及[GetCountry('WII').GetName)]之地。此乃不可错失之机，且为最后之机。"
 me_zhongshan_200_title:0 "中山来请"
 me_zhongshan_2_desc:0 "[ROOT.GetCountry.GetName]使臣抵[GetProvince('(int32)8504').GetName]，向[GetCountry('QII').GetName)]之王[GetCountry('QII').GetRuler.GetName]跪拜。彼等恳求大王予任何可得之援助，然最欲得者，乃王之一诺——若[GetCountry('ZHA').GetName)]意图吞并我国，彼将发兵相抗。[GetCountry('QII').GetRuler.GetName]纳我提议，为使臣设宴款待，后送之返[GetProvince('(int32)8686').GetName]，携有大王将予庇护之保证。"
 me_zhongshan_2_title:0 "$zhongshan_missions_task_2$"
 me_zhongshan_3.a:0 "白狄贵族今与华夏贵族平起平坐。"
 me_zhongshan_3_desc:0 "#E 姬#!贵族久已抵制#E 白狄#!部落精英在[GetProvince('(int32)8686').GetName]王宫中获平等地位。虽怨恨犹存，然[ROOT.GetCountry.GetName]大部领土沦丧之存亡危机，及其随之而来贵族昔日所享财富之流失，已迫使#E 姬#!最终放弃其作为朝中唯一贵族之地位。王[ROOT.GetCountry.GetRuler.GetName]于最新贵族会议之后诏令，终赐#E 白狄#!平等地位！"
 me_zhongshan_3_title:0 "$zhongshan_missions_task_3$"
 me_zhongshan_4.a:0 "吾等将粉碎赵国！"
 me_zhongshan_4.b:0 "眼下不能冒险开战。"
 me_zhongshan_4_desc:0 "我部落密探已成功渗透敌营，抵达#E 林胡#!、#E 楼烦#!与#E 合宗室#!诸部首领之王帐。密探初时混入主力部众，每夜在篝火旁向部民播撒对[GetCountry('ZHA').GetName)]臣服之不满。待旧伤重揭、怨恨于部营中演为骚乱，三部附庸之首脑已为我密探所说动，联手[ROOT.GetCountry.GetName]，密谋摆脱#E 赵#!之枷锁。吾等应否借此绝佳良机，即刻宣战？"
 me_zhongshan_4_title:0 "$zhongshan_missions_task_4$"
 me_zhongshan_5.a:0 "中山铁骑将至！"
 me_zhongshan_5_desc:0 "当[baidi_marshal.GetName]向[ROOT.GetCountry.GetRuler.GetName]建议我骑兵重新穿戴#E 狄#!先祖之旧式服饰，朝中汉化诸臣大加抵制，深恶此种公然接纳奇行异举之举。\n\n然[ROOT.GetCountry.GetRuler.GetFirstName]一旦被说服，便再无回头之路。[baidi_marshal.GetName]确信我军将从中受益，此明智之大将军不久即被证明无误。今吾等再擅骑术，衣装极利马上作战。\n\n赵人与华夏全境，今将感受我骑马征召兵之致命长矛……"
 me_zhongshan_5_title:0 "$zhongshan_missions_task_5$"
 me_zhongshan_6.a:0 "我之婚盟已固！"
 me_zhongshan_600.a:0 "让我们庆祝此番缔盟！"
 me_zhongshan_600_desc:0 "吾等与[GetCountry('ZHS').GetName)]王国新生之友谊与保护关系，已证明极有利于遏制我西、北两方之敌[GetCountry('ZHA').GetName)]与[GetCountry('YAN').GetName)]之野心。值此#E 中国#!联盟变幻莫测之世，吾等应与其中王室交换公主，引一位新#E 中山#!新娘入[GetProvince('(int32)8504').GetName]宫廷，以固其忠诚。"
 me_zhongshan_600_title:0 "中山新娘"
 me_zhongshan_6_desc:0 "始于[ROOT.GetCountry.GetName]之生存需要与[GetCountry('QII').GetRuler.GetName]之简易地缘策略，今已化为两邦之间因共敌众多而萌生之友谊。王[ROOT.GetCountry.GetRuler.GetName]之嗣将迎娶[GetCountry('QII').GetRuler.GetName]之一位公主，以印证我两国间袍泽之谊，且吾等将携手歼灭#E 中国#!之敌。"
 me_zhongshan_6_title:0 "王室联姻"
 me_zhongshan_7.a:0 "圣物将受永世尊崇。"
 me_zhongshan_7_desc:0 "当我新都[GetProvince('(int32)8686').GetName]之宏伟圣地典礼揭幕之时，王[ROOT.GetCountry.GetRuler.GetName]立于入口，向人群挥手致意。万民欢呼，始唱颂先祖之歌，并赞颂大王及其伟大工匠。彼时，王命人将青铜制纪念性丧葬饰品抬出示众，引发轰动，随后宣布三日宴飨节庆，以祭祀[GetCountry('ZHS').GetName)]历代先祖之灵。"
 me_zhongshan_7_title:0 "$zhongshan_missions_task_7$"
 me_zhongshan_8.a:0 "吾等从绝境中归来！"
 me_zhongshan_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName]吾王，战无不胜之主，新诗将为君而作，因君已恢复[ROOT.GetCountry.GetName]民族昔日之雄威。畏惧[GetCountry('ZHA').GetName)]势力之日已逝，君之神剑将敌溃军逐出战场。我武士传颂君亲率士卒冲入敌之浩大军阵，将敌步卒劈为两半，英勇挫败敌之反冲锋。凭君之娴熟韬略与个人勇武而光复此诸地，[ROOT.GetCountry.GetName]举国将共庆之，伟哉吾王！"
 me_zhongshan_8_title:0 "$zhongshan_missions_task_8$"
 me_zhongshan_9.a:0 "燕已无力为患。"
 me_zhongshan_9_desc:0 "[GetCountry('YAN').GetName)]之军企图在通往[GetProvince('(int32)8742').GetName]之路设伏，然我[GetCountry('QII').GetName)]之盟邦素悉此区之地形，因其常与北邻交锋。#E 齐#!密探传信予王[ROOT.GetCountry.GetRuler.GetName]，告之有诈，王遂于最后关头变更部署，分军为二，试图绕至盟友所供之阵地侧后。#E 齐#!之情报果然无误，伏兵遭致全然出其不意，[ROOT.GetCountry.GetName]之军从左右后方实施精妙钳形攻势。另有一支佯攻步卒亦被遣入#E 齐#!步卒预料我全军所在之正面阵地，此佯攻恰如重锤击砧，而骑兵从后方冲锋形成合击。#E 燕#!之军溃败，其腹地终为伟大之#E 中山#!所夺！"
 me_zhongshan_9_title:0 "$zhongshan_missions_task_9$"
 pissed_off_ji:0 "触怒于冀"
 tribal_ally_tt:0 "我们至少有一个部落盟友。"
 zhongshan_bronze_trident:0 "中山三叉戟"
 zhongshan_bronze_trident_desc:0 "此等郭鞍形青铜「三叉戟」，常为中山国用于各类祭祀仪典之中。"
 zhongshan_coalition:0 "中山之同盟"
 zhongshan_final_mod:0 "中山战邦"
 zhongshan_funerary_items:0 "中山随葬品"
 zhongshan_funerary_items_desc:0 "此套用以尊崇中山诸先王、表达追思之随葬器物，包含品种繁多之青铜釜、瓶及枝形烛台。"
 zhongshan_inspired_disloyalty:0 "煽动不忠"
 zhongshan_leage_of_public_weal:0 "中山之盟"
 zhongshan_missions:0 "摇摇欲坠的王国"
 zhongshan_missions_BUTTON_TOOLTIP:0 "若我等不有所行动，独立的中山将不复存在。"
 zhongshan_missions_CRITERIA_DESCRIPTION:0 "此任务将于#E 赵#!之威胁已被挫败、且#E 中山#!于其先祖之道与华夏化之间做出抉择之时完成。"
 zhongshan_missions_DESCRIPTION:0 "公元前304年，[ROOT.GetCountry.GetName]国陷入彻底之混乱，面临被[GetCountry('ZHA').GetName)]与#E战国#!诸雄自地表抹去之危局。不过一代人之前，我邦尚相对完整，参与#E合纵#!同盟以对抗[GetCountry('QIN').GetName)]，甚至如#E中原#!其他邦国一般称王。然而，伐#E秦#!之役失败后，#E赵#!于公元前307年重启战端，迅速压倒我远为弱小之王国。面对#E赵#!之猛攻，我几无领土可守，欲求生存唯赖奇迹。"
 zhongshan_missions_task_1:0 "修缮防务"
 zhongshan_missions_task_10:0 "草原遗风"
 zhongshan_missions_task_10_DESC:0 "[ROOT.GetCountry.GetName]境内之#E白狄#!族群，仍对马背之道怀有怀旧与向往之情。诚然，回溯我几近遗忘之过往，或可迎来诸多益处——草原之上，有众多潜在盟友，更有广袤之人力储备可供我于#Middle 中原#!之战事中征调。\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 zhongshan_missions_task_11:0 "银翼神兽"
 zhongshan_missions_task_11_DESC:0 "国中伟大之艺匠，齐聚[ROOT.GetCountry.GetCapital.GetName]，呈上彼等为[ROOT.GetCountry.GetName]构想之最新宏图。不甘于文化显赫之[GetCountry('QII').GetName)]之后，一份铸造华美银翼神兽之图样已呈于[ROOT.GetCountry.GetRuler.GetName]面前。虽耗费不菲，然或物有所值……\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 zhongshan_missions_task_12:0 "赵之覆亡"
 zhongshan_missions_task_12_DESC:0 "时机终至，[ROOT.GetCountry.GetRuler.GetName]王。盟军随行，我核心故土已自凶恶之[GetCountry('ZHA').GetName)]手中光复，吾等终可为我上一代阵亡与被奴役之族人复仇雪恨。[GetCountry('ZHA').GetRuler.GetName]必须为其灭绝成性之国所犯之罪行付出代价。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 zhongshan_missions_task_12_claims:0 "我们将获得冀州地区和河东地区的宣称。"
 zhongshan_missions_task_13:0 "开发锡铜矿"
 zhongshan_missions_task_13_DESC:0 "虽铁器正成为自软丝绸以来最炙手可热之物，#Y青铜#!于军事及整个区域之文化习俗中仍具有巨大价值。或若吾等能更好开采金属矿山，便可为仪典与战阵锻造一件崭新之绝妙兵器。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 zhongshan_missions_task_14:0 "驯服草原"
 zhongshan_missions_task_14_DESC:0 "伟大之草原于吾等既是机遇亦是挑战，[ROOT.GetCountry.GetRuler.GetName]王。广袤之平原提供不可胜数之马匹与牛畜，更有可将怒火引向我#E华夏#!诸敌之部族勇士。然驯服此广袤地域中桀骜不驯、独立自主之民，绝非易事，且有招致劫掠我邦之风险。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 zhongshan_missions_task_14_claims:0 "我们将获得朔方和漠东地区的宣称。"
 zhongshan_missions_task_15:0 "回归草原"
 zhongshan_missions_task_15_DESC:0 "吾等于#E华夏#!族群中度日之岁月可谓动荡不安。虽居此已有数百年之久，彼等却从未真正接纳我之存在，纵使我采纳其诸多风俗，且为#E中原#!政治事务之参与者。或许，是时候考虑重返我之根源，重新跨上被遗弃之战马，再次驰骋草原，将文明抛诸身后。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 zhongshan_missions_task_16:0 "下一站：华夏"
 zhongshan_missions_task_16_DESC:0 "我北翼既已稳固，可恶之宿敌[GetCountry('ZHA').GetName)]亦已溃败，吾等今可将目光投向成为#E中原#!首屈一指之强国！让吾等深插#Y魏#!及#Y黄河#!谷地，以征服余下之#E战国#!诸雄而宣告我#E天子#!之名号。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 zhongshan_missions_task_16_claims:0 "我们将获得雍州和豫州地区的宣称。"
 zhongshan_missions_task_17:0 "AI紧急退出"
 zhongshan_missions_task_17_DESC:0 "切勿按下此按钮！"
 zhongshan_missions_task_1_DESC:0 "若尚存击败[GetCountry('ZHA').GetName)]并阻止我国自由坠落之一线希望，吾等必须立即投入修缮我残余之防御，以免我最后之堡垒为饥饿之#E战国#!诸雄所吞噬。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 zhongshan_missions_task_2:0 "上表齐国"
 zhongshan_missions_task_2_DESC:0 "[GetCountry('QII').GetName)]乃#E中原#!第二强国，有言称其文化及其都城#E临淄#!为天下最令人敬仰者。吾等需向伟大之[GetCountry('QII').GetName)]诸王请援，以抗击可憎之[GetCountry('ZHA').GetName)]。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 zhongshan_missions_task_3:0 "擢升狄人"
 zhongshan_missions_task_3_DESC:0 "#E狄#!人于过去数百年间迁徙至#E中国#!，为无情草原上变幻莫测之政治格局所迫而东迁，尤以[GetCountry('QII').GetName)]联盟之压力为甚。当诸#E狄#!部族试图在#Y黄河#!以北之丘陵地带安身立命之时，东部之#E白狄#!选择与#E华夏#!族群融合，创立了半蛮夷之[ROOT.GetCountry.GetName]国。汉化之贵族如今推崇#E姬#!姓，背弃我众多#E白狄#!同胞。让此两种文化平等共存。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 zhongshan_missions_task_4:0 "动摇赵国"
 zhongshan_missions_task_4_DESC:0 "[GetCountry('ZHA').GetName)]憎恨我之自治，图谋集中其权威。吾等必须反制此等图谋，并——借赵国新获之部族附庸之力——领导一场针对其王之大起义。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 zhongshan_missions_task_4_can_declare_on_zhao:0 "我们可以对赵国宣战。"
 zhongshan_missions_task_4_claims:0 "我们将获得对恒山、巨鹿、代、渔阳和右北平地区的宣称。"
 zhongshan_missions_task_5:0 "胡服骑射"
 zhongshan_missions_task_5_DESC:0 "数年前，赵国之[GetCharacter('(int32)622').GetName]已不再视#E楼烦#!之#E狄#!部族人为落后之累赘，而视其为激励其军事之源泉。此等部族人乃我之先祖，然因骄奢淫逸，过去数十年来吾等已荒废此种训练之道。若欲与赵国抗衡，吾等必须再次如野蛮人一般训练——欲在北方荒原中生存，必具钢铁之躯。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 zhongshan_missions_task_5_baidi_marshal:0 "我们有一位白狄文化的元帅。"
 zhongshan_missions_task_6:0 "亲善于齐"
 zhongshan_missions_task_6_DESC:0 "[GetCountry('QII').GetName)]已然证明对[GetCountry('ZHA').GetName)]构成巨大威慑，我王，此令我赢得喘息之机，使[ROOT.GetCountry.GetName]得以重返角逐。或许，是时候让[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏王室向[GetCountry('QII').GetName)]之王[GetCountry('QII').GetRuler.GetName]提亲联姻，以巩固我新兴之同盟。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 zhongshan_missions_task_6_arrange_royal_marriages:0 "我们将能够安排齐国和我们之间的王室联姻。"
 zhongshan_missions_task_6_heir:0 "我们的#Y 继承人#!是一位#Y 未婚成年#!且拥有#Y 中山血脉#!。"
 zhongshan_missions_task_6_woman:0 "我们至少有一位#Y 适婚女子#!拥有#Y 中山血脉#!。"
 zhongshan_missions_task_7:0 "敬奉先祖"
 zhongshan_missions_task_7_DESC:0 "引领我族至此地之先人，其所应得者远非我辈为其亡灵所献之寒酸墓葬与祠庙。让吾等以在[GetProvince('(int32)8686').GetName]修建一座宏伟之#E圣地#!并供奉其圣物为念，以颂扬先人辉煌之业绩。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 zhongshan_missions_task_8:0 "瓜分赵国"
 zhongshan_missions_task_8_DESC:0 "吾等已做好万全准备，发起解放#E狄#!族群、抗击[GetCountry('ZHA').GetName)]之斗争。让吾等宣示对[GetCountry('ZHA').GetName)]诸王新近据有之核心部族区域之主权，并将彼等受压迫之民招至我旗帜之下！\n\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 zhongshan_missions_task_8_claims:0 "我们将获得并州地区和赵国所有省份的宣称。"
 zhongshan_missions_task_9:0 "对付燕国"
 zhongshan_missions_task_9_DESC:0 "虽[GetCountry('ZHA').GetName)]无疑为最凶恶之侵略者，然吾等不可忘却[GetCountry('YAN').GetName)]之罪行，彼等亦于多年间屡屡趁机劫掠我东北边境。虽我等曾于公元前315年借助[GetCountry('QII').GetName)]之力几近摆脱#E燕#!之威胁，然彻底消灭彼等之良机失之交臂，今彼等已卷土重来。是时候此番彻底了结此事。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 zhongshan_missions_task_9_claims:0 "我们将获得对辽西、辽东、乌桓和饶乐地区的宣称。"
 zhongshan_petitioned:0 "已受中山上表"
 zhongshan_silver_winged_beasts:0 "银翼神兽"
 zhongshan_silver_winged_beasts_desc:0 "中山国技艺精湛之匠人，创造了一尊以银铸就之双翼神兽之壮丽造像。其于族民之中激起无上敬畏，据传于其前俯首叩拜，便可获赐福佑。"
 zhongshan_steppe_heritage:0 "草原遗风"
 zhongshan_steppe_mod:0 "草原在等待"

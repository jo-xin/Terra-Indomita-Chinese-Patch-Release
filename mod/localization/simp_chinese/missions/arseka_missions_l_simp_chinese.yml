l_simp_chinese:
 ARSEKAN_LEAGUE_NAME:0 "阿尔塞肯联盟"
 aqueloo_blessing_modifier:0 "阿奎卢祝福"
 aqueloo_statue:0 "阿奎洛雕像"
 aqueloo_statue_desc:0 "这座石灰石制成的阿奎洛雕像长期以来是一个孔忒斯塔尼教派的焦点，其风格明显受到希腊文化的影响。"
 arcus_religious_investments_tt:0 "吾等须于#Y 埃德塔尼亚#!行省完成两笔#T 宗教捐献#!行省投资。"
 arseka_01_task_1:0 "召开会议"
 arseka_01_task_10:0 "马斯提安银"
 arseka_01_task_10_DESC:0 "[ROOT.GetCountry.GetName]国内各方显贵正热切鼓动我们夺取#E 马斯提亚#!。这股呼声日益高涨的原因在于传闻#E 马斯提亚#!腹地蕴藏着#E 丰富银矿#!。这些银矿有望提供铸造高价值且声望卓著的钱币所需的#Y 贵金属#!@precious_metals!。"
 arseka_01_task_10_tt:0 "#Y 这将启动一条事件链。#!"
 arseka_01_task_11:0 "勘察银矿"
 arseka_01_task_11_DESC:0 "鉴于有关最近获得的#E 马斯提亚#!中#E 丰富的银矿床#!@precious_metals!的传言，至关重要的是派遣一支专家团队去核实位置并评估建立大规模采矿作业的可行性。一旦确认这些矿床的真实性，就必须做出决策，如何最好地战略性地开发这种宝贵资源，以促进[ROOT.GetCountry.GetName]的经济增长和铸币野心。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 arseka_01_task_11_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 将有机会在 [GetProvince('(int32)1036').GetName|Y] 建立一个 #E #Y 殖民地#!#!"
 arseka_01_task_13:0 "向[GetCountry('BLD').GetName]派遣使者"
 arseka_01_task_13_DESC:0 "为了确保我们不断扩大的铸币厂有稳定的#Y 贵金属#!@precious_metals!供应，必须向[GetCountry('BLD').GetName]进行外交接触，其#Y 贵金属#!@precious_metals!储备已得到证实。我们的熟练大使应能够协商直接控制#E 帕尔马#!的条款，或者至少确保我们的商人能高效地提取和出口#Y 贵金属#!@precious_metals!至[ROOT.GetCountry.GetCapital.GetName]的铸币厂。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 arseka_01_task_14:0 "[GetCountry('BLD').GetAdjective] 动荡"
 arseka_01_task_14_DESC:0 "近期事件使[GetCountry('BLD').GetName]陷入不稳定和不确定性。我们必须抓住这一机会来保障我们的利益，并部署我们的力量填补权力真空。\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 arseka_01_task_14_allow_tt:0 "帕尔马的统治者必须被#E 马戈海盗#!谋杀，且#Y [GetCountry('BLD').GetName]#! 不存在。"
 arseka_01_task_15:0 "一个综合性的城市"
 arseka_01_task_15_DESC:0 "成功收购#E 帕尔马#!后，我们现在面临着重建这座遭受破坏的城市的任务。为此，我们将部署资源和熟练工匠，将#E 帕尔马#!重建为一个#E 综合性城市#!，和谐融合伊比利亚、布匿和希腊建筑风格，反映我们蓬勃发展的王国多文化的本质。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 arseka_01_task_16:0 "白银时代的曙光"
 arseka_01_task_16_DESC:0 "经过一系列精明的努力，[ROOT.GetCountry.GetName]终于获得了充足的银矿 @precious_metals!，解锁了铸造更高价值和声望硬币的潜力。我们的后代将会回顾这个时代，称之为：#E 白银时代#!。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 arseka_01_task_16_allow_tt:0 "#E 厄得塔尼亚#!省份正在#E 进口#! #Y 贵金属#! @precious_metals!。"
 arseka_01_task_17:0 "阿耳库斯庇护所"
 arseka_01_task_17_DESC:0 "阿耳库斯圣所近来已逐渐废弃。我们宗教领袖的神圣建言敦促我们装点这座圣所，以重振这片神圣空间，并灌注更强烈的阿尔塞卡认同。\n\n#Y 我们将每五年在#E 阿耳库斯#!举办一场盛大庆典#!。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 arseka_01_task_18:0 "阿克洛欧的避风港"
 arseka_01_task_18.a.tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 需要建立一个属于[GetDeityDefinition('omen_aqueloo').GetName|Y]的圣地，并且需要拥有一个大型神庙建筑。\n\n只有城市才能拥有大型神庙建筑。"
 arseka_01_task_18_DESC:0 "为了取得河流与丰饶之神#E 阿克洛欧#!的眷顾，我们必须设法建立一处供奉其神力的圣所。#E 阿耳库斯#!似乎正合适。\n\n#Y [GetDeityDefinition('omen_aqueloo').GetName|Y]将庇佑其圣所所在的地区，确保丰收与兴旺的农事。#!"
 arseka_01_task_19:0 "夺取神圣的萨利卡"
 arseka_01_task_19_DESC:0 "神圣之地#E 萨利卡#!，供奉着#E 德尔塞提乌斯#!，传出了神性力量的低语。众神似乎要求我们掌控这一圣地及其内部的宝藏。我们怎能不听从牛神的天命召唤？\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 arseka_01_task_1_DESC:0 "#Y 这将启动一条事件链#!\n\n许多人认为，#E 埃德塔尼#!人民迅速接近团结在同一面旗帜下的时候了，而那面旗帜正是我们的旗帜。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 arseka_01_task_2:0 "宣称中心地带"
 arseka_01_task_20:0 "泛神和谐"
 arseka_01_task_20_DESC:0 "与我们的 #E 希腊#! 和 #E 腓尼基#! 邻邦之间的贸易构成了我们经济的支柱。我们必须让他们在我们的城市中感受到宾至如归。为此，我们应有意识地将我们的神祇与他们所崇敬的神相对应，以此加强外交与贸易关系的基础。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 arseka_01_task_20_tt:0 "颁布 #Y 鼓励融合#! 法令，并至少拥有 #Y 1#! 位来自 [GetReligion('roman_pantheon').GetName|Y] 以及 #Y 1#! 位来自 [GetReligion('carthaginian_pantheon').GetName|Y] 神系中的神祇。"
 arseka_01_task_21:0 "神庙外交"
 arseka_01_task_21_DESC:0 "由于马萨利亚人在商业领域占据主导，希腊信仰长期以来一直影响着商人阶层；近来，它的影响力也扩展到普通公民心中。意识到阿尔塞卡正处于转折点，[ROOT.GetCountry.GetRuler.GetName]希望通过访问#E 东方希腊人#!的一些主要宗教中心来促进文化交流。"
 arseka_01_task_22:0 "马赛利亚商人"
 arseka_01_task_22_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]繁荣的#E 港口#!和蓬勃发展的贸易机会的消息已经传到了许多#E 马赛利亚商人#!的耳中。对#E [SCOPE.GetRootScope.GetCountry.GetName]#!取得的显著进步印象深刻，这些商人对我们城市的未来充满信心，许多人现在希望在繁忙的#E 萨贡图姆港#!及周边地区建立更显赫的存在。"
 arseka_01_task_22_completed_tt:0 "#Y 5#!个#E $massalian$#!文化人口将在#E 萨贡图姆#!定居，另外#Y 5#!个分布于[SCOPE.GetRootScope.GetCountry.GetName]#!各地。"
 arseka_01_task_22_tt:0 "任何马萨利亚国家对#E [SCOPE.GetRootScope.GetCountry.GetName]#!的好感度必须大于或等于#Y 80#!。"
 arseka_01_task_23:0 "阿尔塞的崛起"
 arseka_01_task_23_DESC:0 "认识到我们当前政府形式的不足，许多人主张转向一种更类似于#E 马赛利亚人#!的治理模式。经济繁荣的迫切需求要求黄金自由流动，而为了实现这一点，我们需要采取变革性的步骤。在深陷细节之前，我们必须将[ROOT.GetCountry.GetCapital.GetName]打造成一个配得上我们构想中的#E #Y 阿尔塞肯联盟#!#!的首都。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 arseka_01_task_23_tt:0 "[ROOT.GetCountry.GetCapital.GetName]将成为#Y都会#!。"
 arseka_01_task_24:0 "阿尔塞肯联盟"
 arseka_01_task_24_DESC:0 "在#E 阿尔塞卡#!走向伟大的旅程中，我们为自己在文明边缘争取到了一席之地。受#E 马赛利亚精神#!的启发，是时候将我们的保护和友谊延伸到邻国，并将它们纳入我们的统治之下。超越了小酋长的时代，我们认识到需要改进我们的治理方式。将代表权交给那些最能带领[SCOPE.GetRootScope.GetCountry.GetName]走向繁荣的人手中是再合适不过的。这种演变不仅仅是治理方式的转变，更是向志同道合的城市联盟的转型，共同追求繁荣与集体力量。这个#Y #E 阿尔塞肯联盟#!#!的中心自然将设在我们的首都#E 阿尔塞#!。\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 arseka_01_task_25:0 "扩展萨贡图姆"
 arseka_01_task_25.tt:0 "#E 萨贡图姆#!的港口将得到扩建。"
 arseka_01_task_25_DESC:0 "位于[ROOT.GetCountry.GetCapital.GetName]怀抱中的#E 萨贡图姆#!港口是我们海上事业的关键枢纽。为了满足日益增长的商业和贸易需求，我们必须对#E 萨贡图姆的港口设施#!进行重大扩建。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 arseka_01_task_26:0 "造船厂倡议"
 arseka_01_task_26_DESC:0 "为了在#E 西地中海#!市场中占据主导地位，建立足够的造船厂至关重要。这些造船厂将成为锻造我们海军力量的熔炉。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 arseka_01_task_26_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]必须拥有至少#Y 3#!个拥有二级#Y 港口#!的领土。"
 arseka_01_task_27:0 "水上力量"
 arseka_01_task_27_DESC:0 "为了确保我们在区域贸易中的#E 主导地位#!，我们必须扩展我们的#E 海军#!能力。建造一支#E 强大的舰队#!不仅会增强我们的军事实力，还能让我们‘鼓励’较小的国家建立有利的贸易条款。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 arseka_01_task_27_tt:0 "拥有一支至少#Y 40#!艘船的单一海军编队。"
 arseka_01_task_28:0 "商业收购"
 arseka_01_task_28.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]在####获得海军。"
 arseka_01_task_28_DESC:0 "为了遏制困扰我们#E 贸易#!利益的#E 海盗#!威胁，我们将找出陷入困境的#E 商人#!，并设法收购他们的海上资产，为贸易建立更安全的环境。"
 arseka_01_task_29:0 "码头开发"
 arseka_01_task_29.tt:0 "#E码头#!将在部分沿海领地建造。"
 arseka_01_task_29_DESC:0 "在沿海与沿河领土兴建#E 码头#!；这些#E 码头#!将提供必要的停泊设施，促进贸易运转更加顺畅，并鼓励我们的水道上出现更多海上活动。"
 arseka_01_task_29_allow.tt:0 "[GetProvince('(int32)1029').GetArea.GetName|Y]的州正在进口#Y 石料#! @stone! 和#Y 木材#! @wood!。"
 arseka_01_task_2_DESC:0 "为了巩固我们关于统一#E 埃达塔尼#!人民的愿景，我们必须对我们文明的核心地区施加权威。让祖先土地的每一个角落都感受到[ROOT.GetCountry.GetName]统一力量的影响。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 arseka_01_task_3:0 "[ROOT.GetCountry.GetRuler.GetFamily.GetName]的梦想"
 arseka_01_task_30:0 "罗马贸易纽带"
 arseka_01_task_30_DESC:0 "随着越来越多的罗马商人偶尔光顾我们的港口，现在提升阿尔塞卡经济地位并培养与日益强大的罗马共和国的外交关系变得至关重要。关键在于巩固我们的贸易关系，建立稳定的渠道以实现商品的无缝交换，并培育一个作为未来合作基石的弹性贸易安排。\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 arseka_01_task_30_tt:0 "任一拉丁国家对#E [SCOPE.GetRootScope.GetCountry.GetName]#!的好感度大于或等于#Y 50#!。"
 arseka_01_task_31:0 "迦太基亲缘"
 arseka_01_task_31_DESC:0 "随着迦太基在我们南方影响力的增长，谨慎的做法是迎合迪多继承者不断增长的力量。认识到友好关系的战略重要性，[ROOT.GetCountry.GetRuler.GetName]派遣了[ROOT.GetCountry.GetRuler.GetHerHis]最信任的一些顾问前往[GetProvince('(int32)1464').GetName]与在那里经营的迦太基商人会面。也许我们可以谈判达成一项协议来确保对[GetProvince('(int32)1464').GetName]的所有权？\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 arseka_01_task_32:0 "探索东方市场"
 arseka_01_task_32_DESC:0 "为了增强阿尔塞卡的经济版图，[ROOT.GetCountry.GetRuler.GetName]设想与遥远东方充满活力的希腊城邦建立贸易联系。[ROOT.GetCountry.GetRuler.GetName]准备派遣熟练的使者到这些遥远的希腊领域，任务是处理外交和贸易谈判的复杂事务。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 arseka_01_task_33:0 "布匿弱点"
 arseka_01_task_33.tt:0 "#Y #E 迦太基#!#! 必须正与一个拥有港口且控制超过40块领地的国家处于战争状态。"
 arseka_01_task_33_DESC:0 "最近的情报表明迦太基已卷入与强大对手的冲突中。鉴于迦太基军队正忙于战争，或许我们可以利用萨贡廷造船厂来帮助他们的敌人改变战局。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 arseka_01_task_3_DESC:0 "如果阿尔塞要成为我们国家的一个有价值的首都，我们必须投资于其基础设施。这是 #E [ROOT.GetCountry.GetRuler.GetName]'s梦想#!，将来[ROOT.GetCountry.GetRuler.GetSheHe]可以将其转变为文化和商业的中心，甚至超越我们富裕的马赛利亚邻居的城市。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 arseka_01_task_4:0 "厄得塔尼亚的粮仓"
 arseka_01_task_4.tt:0 "所有在#Y $edetania_area$#!中拥有食品贸易商品的领土都有一个$basic_settlement_infratructure_building$。"
 arseka_01_task_4_DESC:0 "为了确保[ROOT.GetCountry.GetName]及其人民的繁荣，我们必须将肥沃的#E 厄得塔尼亚#!土地变成一个繁荣的粮仓，充分利用其丰富的土壤和有利的气候条件。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 arseka_01_task_5:0 "埃德科米恩达制度"
 arseka_01_task_5_DESC:0 "认识到最大化资源利用的需求，[ROOT.GetCountry.GetRuler.GetName]意识到是时候通过在全国范围内建立#E 奴隶庄园#!来充分发挥我们土地的潜力。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 arseka_01_task_6:0 "巩固厄得塔"
 arseka_01_task_6_DESC:0 "为了确保我们人民与城市#E 厄得塔#!之间特殊联系的延续，并保证它在我们的统治下持续繁荣，最重要的是#E 加固厄得塔#!，保护城市及其居民免受任何可能出现的挑战。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 arseka_01_task_7:0 "瑟贝拉基海岸"
 arseka_01_task_7_DESC:0 "为了巩固我们在#E 马赛利亚商人#!中的影响力并增强与他们的贸易联系，我们必须专注于提升#E 瑟贝拉奇#!，即[ROOT.GetCountry.GetCapital.GetName]的沿海邻国，确保它成为我们经济努力的重要延伸。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 arseka_01_task_8:0 "集中铸币"
 arseka_01_task_8_DESC:0 "作为#E 伊比利亚人#!首次拥抱铸币艺术的先驱城市，[ROOT.GetCountry.GetCapital.GetName]长期以来一直被视为文明的支柱。然而，为确保持续增长并吸引新商人，必须整顿我们的货币体系。建立一个#E #Y 中央铸币厂#!#! 并编纂我们的税收系统将巩固[ROOT.GetCountry.GetName]作为该地区可靠而繁荣的贸易枢纽的地位。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 arseka_01_task_8_tt:0 "一座#T 中央铸币厂#!将在#Y #E [GetProvince('(int32)1029').GetName]#!#!建立\n#Y 这将启动一条事件链。#!"
 arseka_01_task_9:0 "铜矿铸造"
 arseka_01_task_9_DESC:0 "随着#E #Y 中央铸币厂#!#! 的建立，下一步关键步骤是开始生产硬币。历史上，在这个时期[ROOT.GetCountry.GetAdjective]几乎只使用#E 银币#!@precious_metals!进行铸造；然而，我们目前缺乏足够的#E 银币#!@precious_metals!。为了启动铸造过程并确保稳定的硬币供应，必须努力获取用于熔炼的#E 铜#!@base_metals!。\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 arseka_01_task_9_tt:0 "#Y 这将启动一条事件链。#!"
 arseka_20_ships_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]在####获得二十艘舰船舰队。"
 arseka_coin_horseman:0 "硬币上的骑手"
 arseka_coin_trireme:0 "硬币上的三列桨战船"
 arseka_fleet_prep:0 "舰队准备"
 arseka_missions_01:0 "阿尔塞肯的崛起"
 arseka_missions_01_BUTTON_TOOLTIP:0 "黄金将流淌！"
 arseka_missions_01_CRITERIA_DESCRIPTION:0 "通过军事行动、经济扩展和外交手腕引导[SCOPE.GetRootScope.GetCountry.GetName]走向显赫。"
 arseka_missions_01_DESCRIPTION:0 "面对四分五裂的地区和外国势力阴影的挑战，#E [SCOPE.GetRootScope.GetCountry.GetName]#!将从文化交汇、贸易路线交织的#E 伊比利亚半岛#!的熔炉中脱颖而出，成为一个掌握#E 孔忒斯塔尼亚#!的共和国，并雄心勃勃地成为一个更伟大的国家。"
 arseka_punic_war_event.1.a:0 "任何有助于破坏迦太基霸权之举！"
 arseka_punic_war_event.1.at1:0 "[SCOPE.sC('arseka_rome_scope').GetName]将收到我方出售战舰之提议。若彼等接受："
 arseka_punic_war_event.1.at2:0 "[SCOPE.sC('arseka_rome_scope').GetName]将获得四艘#Y 三列桨战船#! @trireme! 及四艘#Y 利布尔尼亚战船#! @liburnian!"
 arseka_punic_war_event.1.b:0 "无意帮助[SCOPE.sC('arseka_rome_scope').GetName]……"
 arseka_punic_war_event.1.t:0 "[SCOPE.sC('arseka_rome_scope').GetAdjective]-[SCOPE.sC('dhe_massalia_carthage_scope').GetAdjective]战争"
 arseka_punic_war_event.1_desc:0 "吾等获悉，西地中海之制海霸主迦太基人，已与[SCOPE.sC('arseka_rome_scope').GetName]这一[SCOPE.sC('arseka_rome_scope').GetCapital.GetArea.GetRegion.GetName]新兴而强盛之国发生冲突。\\n\\n驻#E 萨贡提乌姆#!之若干商贾认为，此乃天赐良机，既可削弱迦太基人，又可借为[SCOPE.sC('arseka_rome_scope').GetAdjective]人提供战舰而博取此一潜在区域强权之好感。\\n\\n#E 萨贡提乌姆#!之船坞实力雄厚，且因无需操心训练船员与军官，吾等可于较短时间内完成相当数量舰船之建造。"
 arseka_punic_war_event.2.a:0 "极其慷慨之提议。"
 arseka_punic_war_event.2.at:0 "[SCOPE.sC('arseka_rome_scope').GetName]将获得四艘#Y 三列桨战船#! @trireme! 及四艘#Y 利布尔尼亚战船#! @liburnian!"
 arseka_punic_war_event.2.b:0 "接受，加倍订购！"
 arseka_punic_war_event.2.bt:0 "[SCOPE.sC('arseka_rome_scope').GetName]将获得八艘#Y 三列桨战船#! @trireme! 及八艘#Y 利布尔尼亚战船#! @liburnian!"
 arseka_punic_war_event.2.c:0 "无需援助。"
 arseka_punic_war_event.2.t:0 "萨贡托献船"
 arseka_punic_war_event.2_desc:0 "阿尔塞卡#E 萨贡提乌姆#!精明的希腊人提出一项建议。彼等愿以合理之报酬，将其船坞供我方使用，以助我邦在对迦太基人不可避免之胜利中一臂之力——迦太基人正阻挡着彼等经济野心之实现。\\n\\n迦太基之强在于其可畏舰队之威，而充实我海上力量、增添舰船数量，无疑将增强我邦于海上与之抗衡之能力。然而，某些元老对在外邦势力处积欠人情之债心存顾虑，无论彼等表面看来何等孱弱……"
 arseka_punic_war_event.3.a:0 "极好。"
 arseka_punic_war_event.3.b:0 "完美！"
 arseka_punic_war_event.3.c:0 "随他们便。"
 arseka_punic_war_event.3.t:0 "[SCOPE.sC('arseka_rome_scope').GetName]回应"
 arseka_punic_war_event.3_desc_1:0 "在我方贸易使节自熙攘之[SCOPE.sC('arseka_rome_scope').GetAdjective]都城[SCOPE.sC('arseka_rome_scope').GetCapital.GetName]归来后，令人沮丧之消息传至——彼邦领袖断然拒绝了我方慷慨之提议，表示担忧由此欠下人情之债。鉴于彼等之决定，吾等唯有期盼其独自面对迦太基之自信确有根据……"
 arseka_punic_war_event.3_desc_2:0 "据我方遣往[SCOPE.sC('arseka_rome_scope').GetCapital.GetName]之使节最新来报，事态出现了令人惊喜之转折。[SCOPE.sC('arseka_rome_scope').GetAdjective]都城的领袖不仅接受了我方最初之提议，更进一步要求提供原定数量两倍之舰船。此等意外之热情，既有益于我邦外交关系，亦确保对迦太基之胜利几成定局。此外，此笔合作所带来之丰厚财政收益，足以维系我船匠数年之生计，确保我邦在此区域之海上优势。"
 arseka_punic_war_event.3_desc_3:0 "我使团自[SCOPE.sC('arseka_rome_scope').GetAdjective]都城归来，携来振奋人心之消息——彼邦领袖已欣然接受我方慷慨之提议，允为对迦太基战争建造舰船。"
 arseka_quay:0 "码头"
 arseka_ship_aid_opmod:0 "海军援助"
 arseken_coinage_modifier:0 "阿尔塞肯货币"
 arseken_league_mod:0 "阿尔塞肯联盟"
 arseken_start_buff:0 "地平线上的和谐"
 breadbasket_of_arseka_modifier:0 "阿尔塞卡粮仓"
 desc_aqueloo_blessing_modifier:0 "受尊敬的丰饶之神阿奎卢的慷慨祝福笼罩这片土地，确保了丰收和繁荣的农业努力。"
 desc_arseka_coin_horseman:0 "由#E #Y 中央铸币厂#!#!制造的第纳尔硬币一面是[ROOT.GetCountry.GetRuler.GetName]的肖像，另一面是一位孔忒斯塔尼骑手，以突出孔忒斯塔尼的伊比利亚特性。"
 desc_arseka_coin_trireme:0 "由#E #Y 中央铸币厂#!#!制造的第纳尔硬币一面是[ROOT.GetCountry.GetRuler.GetName]的肖像，另一面是一艘三列桨战船，以突出阿尔塞卡的海军野心。"
 desc_arseka_fleet_prep:0 "我们的造船工人正在努力建造一支强大的舰队。"
 desc_arseka_quay:0 "在这座城市的水滨建成了一个码头，允许船只平行靠岸，大大增加了可以在此交易的船只数量。"
 desc_arseken_coinage_modifier:0 "在伊比利亚商业的新时代中，#E [SCOPE.GetRootScope.GetCountry.GetName]#!作为其伊比利亚同行中的先驱建立了中央铸币系统，巩固了其在经济复杂性和贸易方面的先锋地位。"
 desc_arseken_start_buff:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!准备统一#E 厄得塔尼亚人民#!，无论是和平还是其他方式。"
 desc_breadbasket_of_arseka_modifier:0 "厄得塔尼亚的丰富田地和果园生产出令人印象深刻的作物种类，构成了[THIS.GetCountry.GetName]粮食生产的支柱。"
 desc_massalian_colony:0 "该领土拥有一个#E 马赛利亚殖民地#!，由一群#E 马赛利亚商人#!管理。"
 desc_pantheic_harmony:0 "[ROOT.GetCountry.GetName]的伊比利亚和希腊信仰的牧师们费尽心思将他们的神祇与对立信仰的神等同起来。"
 desc_sagointium_port:0 "港口#E 萨贡图姆#!已经过显著扩展，能够容纳更多的船只并促进海上贸易的增长。"
 desc_sgs_vein_of_silver:0 "勘测员在此地发现了已证实的银储量。"
 desc_syncretic_city_modifier:0 "该领土反映了其居民的多样性，融合了多种建筑风格。"
 form_arseken_league_claims_tooltip:0 "阿尔塞肯联盟将获得对#Y 孔忒斯塔尼亚#!和#Y 塔拉科嫩西斯#!区域的宣称。"
 form_arseken_league_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#Y $ARSEKAN_LEAGUE$#!\n\n#G 完成此任务将为#E 阿尔塞卡同盟#!解锁一棵新任务树。#!"
 massalian_colony:0 "马赛利亚殖民地"
 me_arseka.4.a.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_4$#!”$mission_completed_tooltip_2$"
 me_arseka_0100.a:0 "希望他们不会花太长时间。"
 me_arseka_0100_desc:0 "#E 埃德塔尼亚#!的命运悬而未决，#E 阿尔塞卡议会#!正在审议此事。毕竟#E 埃德塔尼亚#!是我们人民的故土，也是长期贸易伙伴。主战派认为，其肥沃土地应当被强行并入扇贝旗帜之下，并预见由此而来的无匹繁荣。反对者则强调与邻邦培育友谊和合作的重要性，认为只要给予机会，#E 埃德塔尼亚#!人民会自愿加入我们的国家。看来今日不会达成共识。"
 me_arseka_0100_title:0 "埃达塔尼亚的困境"
 me_arseka_0101.a:0 "备战！"
 me_arseka_0101.b:0 "派遣外交官。"
 me_arseka_0101.tt:0 "#Y 这将启动一个事件链#!"
 me_arseka_0101_desc:0 "围绕#E 埃德塔尼亚#!命运的争论仍在继续，#E 阿尔塞卡议会#!内部的紧张已近沸点。主张军事行动者坚信，#E 埃德塔尼亚#!绝不会单纯接受吞并；一旦发现我们意图夺取其土地，他们便会试图召集盟友。然而主张外交解决者也同样坚定，认为兄弟之间没有彼此屠戮的理由。眼见这场争吵毫无进展，一些议员请求[ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName]介入调停，以免局势恶化。"
 me_arseka_0101_title:0 "需要调解"
 me_arseka_0102.a:0 "或许我可以保留#E 埃德塔#!？"
 me_arseka_0102.a.tt:0 "#R #E 埃德塔尼亚#!将把除#E 埃德塔#!以外的全部领土割让给#E 阿尔塞卡#!，并成为一个#E 阿尔塞卡#!藩属！#!"
 me_arseka_0102.b:0 "拒绝提议，并为潜在冲突做准备。"
 me_arseka_0102.b.tt:0 "#E 阿尔塞#!很可能会宣战。"
 me_arseka_0102_desc:0 "我们尊敬的#E 阿尔塞卡#!兄弟派来的外交官已经带着提议抵达#E 埃德塔#!。他们的提议很简单：让我们加入他们，在扇贝旗帜下铸成一个强大的国家。外交官们盛赞团结的美德，向#E 埃德塔尼亚#!许诺一个繁荣无匹、资源共享、人民团结有力的未来。虽然#E 阿尔塞卡#!的提议颇具诱惑，但保留独立并继续当前道路的前景同样诱人。"
 me_arseka_0102_title:0 "诱人的提议"
 me_arseka_0103.a:0 "让我们张开双臂欢迎他们！"
 me_arseka_0103.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_1$#!”$mission_completed_tooltip_2$"
 me_arseka_0103_desc:0 "我们的外交努力已经结出果实，#E 埃德塔尼亚#!的统治者表示愿意与#E 阿尔塞卡#!合一。这是极好的消息；它使我们免于一场兄弟相残的战争。"
 me_arseka_0103_title:0 "和平统一"
 me_arseka_0104.a:0 "开战！"
 me_arseka_0104.tt:0 "#R 向#E 埃德塔尼亚#!宣战#!\n$mission_completed_tooltip_1$“#Y $arseka_01_task_1$#!”$mission_completed_tooltip_2$"
 me_arseka_0104_desc:0 "令人不安的谣言传入#E 阿尔塞卡领导层#!耳中。在#E 埃德塔#!拥有商业利益的[finesse_thinker.GetName]神色惊慌，[finesse_thinker.GetSheHe]报告说背叛的流言似乎正在#E 埃德塔#!街头传播。看来#E 埃德塔尼亚官员#!已经听闻我们议会中的辩论，并公开讨论把#E 阿尔塞卡#!瓜分给周边邻国的策略。这种背叛必须以鲜血回应。"
 me_arseka_0104_title:0 "背叛的耳语"
 me_arseka_0800.a:0 "终于。"
 me_arseka_0800_desc:0 "经过数月的精心规划和建设，位于[ROOT.GetCountry.GetCapital.GetName]的#E #Y 中央铸币厂#!#!已经完成。这座宏伟的建筑是我们致力于建立繁荣经济的象征。铸币厂配备了阿尔塞卡最好的工具，并准备好生产不仅象征我们繁荣，而且代表我们国家身份的硬币。"
 me_arseka_0800_title:0 "中央铸币厂"
 me_arseka_0801.a:0 "[mint_man_good.GetName]显然是不二之选。"
 me_arseka_0801.b:0 "我迫不及待想从[mint_man_bad.GetName]那里拿到样品。"
 me_arseka_0801_desc:0 "现在#E #Y 中央铸币厂#!#!已经建立，需要一位有能力且值得信赖的人来监督这一关键事业变得显而易见。在众多竞争这一崇高角色的候选人中，[mint_man_good.GetName]脱颖而出，这是一位极具资格的铸币师，因其制作出无与伦比美丽的硬币而广受赞誉。将此责任交给[mint_man_good.GetName]可能会使我们的货币达到新的高度，吸引来自各地的赞赏。\n然而，出现了一位经验不足但雄心勃勃的候选人。尽管缺乏专业知识，[mint_man_bad.GetName]试图通过提供让[ROOT.GetCountry.GetRuler.GetName]‘试用’一些硬币的方式来赢得青睐，这是一个诱人的贿赂。"
 me_arseka_0801_title:0 "铸币者的困境"
 me_arseka_0802.a:0 "重新考虑[mint_man_good.GetName]的专业知识可能是解决之道。"
 me_arseka_0802_desc:0 "[ROOT.GetCountry.GetRuler.GetName]决定将关键的铸币监督职责交给[mint_man_bad.GetName]，过去几个月的结果令人失望。关于由他监督的#E #Y 中央铸币厂#!#!生产的硬币质量低劣、形状不规则的报告传到了[ROOT.GetCountry.GetRuler.GetName]耳中，这些硬币缺乏一个合格铸币师应有的精细和工艺。原本设计为优雅扇贝图案的硬币现在看起来更像是一棵扭曲的棕榈树，因为他的无能。[mint_man_bad.GetName]证明了其无法维持我们货币的质量，[ROOT.GetCountry.GetCapital.GetName]的铸币厂现在生产的硬币远未达到人民期望的标准。\n\n令[ROOT.GetCountry.GetRuler.GetName]沮丧的是，[mint_man_bad.GetName]甚至在他的住所留下了一些变形且变色的硬币堆，进一步凸显了铸币厂产出的糟糕状态。"
 me_arseka_0802_title:0 "铸币失误"
 me_arseka_0803.a:0 "真是松了一口气。"
 me_arseka_0803_desc:0 "由于对[mint_man_bad.GetName]生产的硬币质量不佳感到困扰，[ROOT.GetCountry.GetRuler.GetName]认识到#E #Y 中央铸币厂#!#!领导层迫切需要更换人选。意识到拥有经验丰富的铸币师监督我们经济这一关键方面的重要性，[ROOT.GetCountry.GetRuler.GetName]寻求曾被忽视的著名铸币专家[mint_man_good.GetName]的帮助。\n\n[ROOT.GetCountry.GetRuler.GetName]邀请[mint_man_good.GetName]参观铸币厂，展示最先进的设施，并表达创建卓越铸币遗产的愿景。[mint_man_good.GetName]立即同意承担起监督#E #Y 中央铸币厂#!#!的责任，准备带领其达到新的工艺和声望高度。"
 me_arseka_0803_title:0 "纠正[mint_man_good.GetName]"
 me_arseka_0804.a:0 "[mint_man_good.GetName]正是此任人选。"
 me_arseka_0804_desc:0 "随着决定将才华出众的[mint_man_good.GetName]委任为#T中央铸币局#!之主，[ROOT.GetCountry.GetCapital.GetName]的钱币生产迎来了一场复兴。铸出的钱币展现出超凡的品质与工艺。每一枚都是他才华的明证，不仅赢得了我邦境内的赞誉，更获得了海外商贾与收藏家的钦慕。人民为钱币焕然一新的卓越品质而欢欣鼓舞，这正反映了[ROOT.GetCountry.GetName]的繁荣与文雅。"
 me_arseka_0804_title:0 "$arseka_01_task_9$"
 me_arseka_0901.a:0 "[mint_man_good.GetName]的才华确实非凡。"
 me_arseka_0901_desc:0 "在阿尔塞卡议会和[ROOT.GetCountry.GetRuler.GetName]面前的一次重要展示中，[mint_man_good.GetName]揭开了铸币技术的一项突破性创新。\n这项创新围绕使用精密制造的模具和先进的雕刻技术展开。[mint_man_good.GetName]解释了这种方法如何使我们能够创造具有复杂设计和无与伦比精度的硬币，超越传统铸币工艺的能力。议会对于铸造不仅是财富媒介，也是艺术品的硬币前景感到惊叹。\n\n这项技术飞跃的潜力得到了议会和[ROOT.GetCountry.GetRuler.GetName]的热情响应，他们认识到它对我们货币可能产生的变革性影响。"
 me_arseka_0901_title:0 "钱币学的独创性"
 me_arseka_0902.a:0 "这只是个小问题，毫无疑问！"
 me_arseka_0902_desc:0 "负责铸币的权威[mint_man_good.GetName]带着审慎的表情接近[ROOT.GetCountry.GetRuler.GetName]，表达了对我们当前硬币生产状况的深切担忧。‘我的[ROOT.GetCountry.GetRuler.GetTitle]，’[mint_man_good.GetName]开始说，‘我必须对我们目前以铜作为铸币介质所面临的固有限制表示诚挚的忧虑。虽然我们最近的努力展示了工艺，但我们硬币的真实潜力仍因这种贱金属的本质特性而受到限制。’\n俯身在一桌装饰有我们铜币的例子上，[mint_man_good.GetName]带着一丝失望地指着这些硬币说：‘铜，尽管易于获取，却未能捕捉到真正卓越的本质。它的可塑性和易腐蚀性质阻碍了能够真正反映[ROOT.GetCountry.GetName]繁荣与精致的硬币的创造。为了实现钱币学成就的巅峰，我们必须转向一种更能体现[ROOT.GetCountry.GetName]追求的伟大性的介质。’\n稍作停顿后，[mint_man_good.GetName]继续坚定地说：‘陛下，那种介质就是银。据传言，在#E 马斯蒂亚#!的土地内蕴藏的丰富银矿可能是开启我们铸币新时代的关键。银以其内在的光泽和持久的品质，将使我们能够铸造不仅价值更高，而且作为声望和繁荣象征的硬币。不幸的是，这些矿脉目前仍然不在[ROOT.GetCountry.GetName]的仁慈控制之下。’"
 me_arseka_0902_title:0 "$arseka_01_task_9$"
 me_arseka_10.a:0 "嗯，[wealthy_trader.GetName]真是个慷慨的人。"
 me_arseka_10.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_10$#!”$mission_completed_tooltip_2$"
 me_arseka_1001.a:0 "肯定会有银子的 @precious_metals!"
 me_arseka_1001_desc:0 "表现出兴趣投资#E 马斯蒂亚#!的精明且富有的商人[wealthy_trader.GetName]带着坚定的表情接近[ROOT.GetCountry.GetRuler.GetName]。[wealthy_trader.GetName]宣布打算派遣一批熟练的代理人去探查马斯蒂亚，并核实所报道的银储量的存在和规模。[wealthy_trader.GetName]认为，这一主动措施对于评估投资的潜在盈利能力以及对未来区域发展的明智决策至关重要。"
 me_arseka_1001_title:0 "$arseka_01_task_10$"
 me_arseka_1002.a:0 "[wealthy_trader.GetName]太急切了；事情有些不对劲。"
 me_arseka_1002_desc:0 "[wealthy_trader.GetName]的侦察员从#E 马斯蒂亚#!发回的报告显示该地区确实存在大量的银@precious_metals!矿藏。这个消息让[wealthy_trader.GetName]感到兴奋和满意，他对未开发的#E 马斯蒂亚土壤下#!的财富垂涎欲滴。现在看来，投资的利润潜力更加诱人，[wealthy_trader.GetName]热切希望利用这些新发现的资源进一步增加他的财富和影响力。值得注意的是，在听到消息后不久，[wealthy_trader.GetName]立即派了一队建筑师和艺术家前往#E 马斯蒂亚#!。"
 me_arseka_1002_title:0 "$arseka_01_task_10$"
 me_arseka_10_desc:0 "关于新获得的#E 马斯蒂亚#!土地中存在大量银 @precious_metals!储量的传闻引起了我们国家最富有的商人之一[wealthy_trader.GetName]的注意。渴望利用这一潜在财富来源，[wealthy_trader.GetName]向[ROOT.GetCountry.GetRuler.GetName]提出了一项重大投资建议，用于开发#E 马斯蒂亚#!的采矿和贸易业务。\n\n[wealthy_trader.GetName]对这种努力的盈利能力充满信心，预计通过开采报告中的银 @precious_metals!矿藏将获得可观的投资回报。"
 me_arseka_10_title:0 "$arseka_01_task_10$"
 me_arseka_11.tt:0 "#R 这将提前结束事件链#!"
 me_arseka_1100.a:0 "让我们听听更多关于这个提案的内容。"
 me_arseka_1100.b:0 "感谢你的努力，但#E 阿尔塞卡#!将直接管理#E 马斯蒂亚#!。"
 me_arseka_1100_desc:0 "凭借着无可辩驳的证据，证实了#E 马斯蒂亚#!腹地蕴藏着丰富的白银@precious_metals!储备，这位精明的商人再度拜访了[ROOT.GetCountry.GetRuler.GetName]。此次，[wealthy_trader.GetName]带来了一个足以重塑马斯蒂亚与阿尔塞卡两国经济格局的宏伟提案。[wealthy_trader.GetName]自信满满地阐述其雄心壮志：计划在银矿富饶之地建立新殖民地。提案核心在于实现私营企业与国家资源的无缝融合，凭借其雄厚财力加速开采并贸易珍贵的#Y 贵金属#!@precious_metals!。其终极目标明确——确保银流持续畅通无阻，不仅充盈商人金库，更将惠及整个国家。"
 me_arseka_1100_title:0 "$arseka_01_task_11$"
 me_arseka_1101.a:0 "这看起来合理。"
 me_arseka_1101.b:0 "感谢你的努力，但#E 阿尔塞卡#!将直接管理#E 马斯蒂亚#!。"
 me_arseka_1101_desc:0 "随着与[wealthy_trader.GetName]的讨论进展，这位精明的商人详细阐述了发展和管理#E 马斯蒂亚#!的全面愿景。他提案的重点围绕着自治权的概念，这是一个据他说能够推动马斯蒂亚达到前所未有的繁荣的关键要素。[wealthy_trader.GetName]详述了放松对马斯蒂亚事务控制所带来的潜在好处。他热情地争论道，在自由运用其庞大的资源和专业知识的情况下，他可以构建一个精细调校的经济机器，不仅服务于其私人事业的利益，还为国家的整体繁荣做出重要贡献。\n\n[wealthy_trader.GetName]设想了一个在他的专家指导下作为经济活动动态枢纽运作的马斯蒂亚，促进创新、贸易和财富创造。他的提案表明，通过允许他更广泛的控制范围，马斯蒂亚可以成为一个经济成功的典范，吸引有利可图的贸易企业及寻求在蓬勃发展的区域内寻找机会的技术人员和投资者。\n\n在他的详细演示中，[wealthy_trader.GetName]概述了在自主管理下，马斯蒂亚如何简化行政流程、优化资源配置并实施针对该地区特定经济环境的政策。他认为，这将产生一个更加灵活和响应迅速的治理结构，能够快速适应马斯蒂亚新发现的银@precious_metals!财富带来的不断变化的需求和机遇。\n\n此外，[wealthy_trader.GetName]强调他对马斯蒂亚成功的既得利益与阿尔塞卡的整体利益一致。随着马斯蒂亚在他管理下蓬勃发展，由此产生的经济效益将在全国范围内产生反响，促进整体增长、稳定并在国际舞台上增强影响力。"
 me_arseka_1101_title:0 "$arseka_01_task_11$"
 me_arseka_1102.a:0 "很好，[wealthy_trader.GetName]。建立你的殖民地吧。"
 me_arseka_1102.b:0 "实际上，这份协议需要修改。"
 me_arseka_1102.tt:0 "#Y 这将触发决定马斯蒂亚如何被治理的事件。#!"
 me_arseka_1102_desc:0 "有了自治权的前景，[wealthy_trader.GetName]明确表示他打算邀请其他马赛利亚商人加入他在#E 马斯蒂亚#!建立某种形式的殖民地的努力。他向[ROOT.GetCountry.GetRuler.GetName]保证这项工作将以我们的名义进行，提供伴随治理一个繁荣殖民地而来的声望和影响力。[wealthy_trader.GetName]愿意承担治理责任，确保#E 扇贝壳#!自豪地飘扬在马斯蒂亚上空。"
 me_arseka_1102_title:0 "$arseka_01_task_11$"
 me_arseka_1103.a:0 "允许[wealthy_trader.GetName]在马斯蒂亚建立一个马赛利亚殖民地。"
 me_arseka_1103.b:0 "指定马斯蒂亚作为马赛利亚的附属国，由[wealthy_trader.GetName]负责。"
 me_arseka_1103.c:0 "阿尔塞卡将直接治理马斯蒂亚。"
 me_arseka_1103_desc:0 "随着[wealthy_trader.GetName]富有远见的提案逐渐生根，[ROOT.GetCountry.GetRuler.GetName]与这位富商的谈判进入关键阶段。协议条款如今必须进一步细化，而马斯提亚的命运仍悬而未决。[wealthy_trader.GetName]满怀期待地坐在谈判桌对面。[ROOT.GetCountry.GetRuler.GetName]必须决定如何最妥善地利用马斯提亚的潜在财富。桌面上有三种方案等待斟酌。\n\n#E 建立殖民地：#! \n[wealthy_trader.GetName]再次申明在马斯提亚建立马萨利亚支持之殖民地的好处。他强调私人事业能够为该地区带来迅速的经济增长与繁荣。选择此路时，马斯提亚将处于马萨利亚统治之下，却由这位商人治理，从而确保白银和经济发展源源不断。\n\n#E 朝贡地位：#! \n[wealthy_trader.GetName]提出另一种方案，让马斯提亚成为马萨利亚的朝贡国。掌控该地区的商人会定期向阿尔塞卡缴纳贡赋，以换取保护和支持。此方案让马斯提亚保留一定自治，却能确保资源持续流向阿尔塞卡。\n\n#E 直接治理：#! \n[ROOT.GetCountry.GetRuler.GetName]也可以选择直接治理，将马斯提亚置于阿尔塞卡控制之下。虽然这能确保最大程度的监督和控制，却也可能带来更重的行政责任，并使经济发展步伐放缓。"
 me_arseka_1103_title:0 "$arseka_01_task_11$"
 me_arseka_13.a:0 "做得好，[palma_diplomat.GetName]。"
 me_arseka_13.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_13$#!”$mission_completed_tooltip_2$"
 me_arseka_1301.a:0 "这对我们的贸易协议意味着什么？"
 me_arseka_1301_desc:0 "对于最近[GetCountry('BLD').GetName]与[ROOT.GetCountry.GetName]之间关于从帕尔马提取和出口#Y 贵金属#! @precious_metals!达成的协议感到不安，一群心怀不满的贵族在[GetCountry('BLD').GetCapital.GetName]陷入了愤怒与怨恨。由于认为这是对国家利益的背叛，愤怒的精英们秘密雇佣臭名昭著的#E 马戈海盗#!执行一场残酷的报复行动。\n\n在一系列血腥事件中，以残忍著称的#E 马戈海盗#!精心策划了针对[palma_ruler.GetName]的袭击。毫无防备的[palma_ruler.GetName]成为海盗无情攻击的受害者。这次暗杀的残忍程度在政治舞台上留下了令人胆寒的印记，震动了权力走廊。\n\n这场黑暗事件不仅夺去了[palma_ruler.GetName]的生命，也为[GetCountry('BLD').GetName]带来了恐惧和不确定性的阴影。"
 me_arseka_1301_title:0 "$arseka_01_task_13$"
 me_arseka_1302.a:0 "如果他们想要战争，那就给他们战争。"
 me_arseka_1302_desc:0 "[palma_ruler.GetName]死后，我们的精明顾问一直在仔细审查最近关于从帕尔马提取和出口#Y 贵金属#!@precious_metals!所达成的贸易协议的复杂性。经过数天的讨论，他们认为起草协议中的模糊语言，加上[palma_diplomat.GetName]获得的单方面让步，提供了对帕尔马领土进行宣称的法律借口。\n\n[palma_diplomat.GetName]，我们技巧娴熟地制定条款的使者，坚持认为武力夺取帕尔马是唯一务实的选择。[palma_diplomat.GetName]观察到[GetCountry('BLD').GetAdjective]贵族的背信弃义，认为他们显然没有诚意遵守由[palma_ruler.GetName]谈判达成的协议。[GetCountry('BLD').GetName]的这种背叛更加坚定了[palma_diplomat.GetName]的观点，即通过军事手段确保帕尔马不仅是正当的，而且对于维护我们的国家利益至关重要。"
 me_arseka_1302_title:0 "$arseka_01_task_13$"
 me_arseka_13_desc:0 "当我们的外交使节[palma_diplomat.GetName]踏上#E 帕尔马#!海岸时，[palma_ruler.GetName]前来迎接，[palma_ruler.GetSheHe]正是[ROOT.GetCountry.GetAdjective]人民真正的朋友与盟友。[palma_ruler.GetName]深知两国之间的相互尊重与合作，表示愿意讨论开采并出口帕尔马地下#Y 贵金属#!@precious_metals!的条件。\n\n谈判期间，我们的大使巧妙地主张直接控制帕尔马采矿作业，或至少取得有利条件，使我们的商人能够高效开采并把这些#Y 贵金属#!@precious_metals!出口到首都铸币厂。[palma_ruler.GetName]考虑到[GetProvince('(int32)1465').GetOwner.GetName]与[ROOT.GetCountry.GetRuler.GetName]之间的深厚联系，表示[palma_ruler.GetSheHe]愿意寻求一种尊重双方利益的“互利”安排。讨论深入到税收、基础设施建设、利润公平分配等复杂细节。随着谈判推进，[palma_diplomat.GetName]终于领会了[palma_ruler.GetName]的暗示，向这位统治者奉上一笔厚礼。[palma_ruler.GetName]立刻接受[palma_diplomat.GetName]提出的所有要求，并在没有咨询任何顾问的情况下，给这份草拟协议盖上[palma_ruler.GetHerHis]正式批准印信。[palma_diplomat.GetName]故意把协议写得含糊不清，使阿尔塞卡几乎单方面掌握了帕尔马的白银储藏。\n\n[palma_diplomat.GetName]兴高采烈地离开谈判桌，急忙把这项胜利传达给[ROOT.GetCountry.GetRuler.GetName]。然而回到阿尔塞后，[palma_diplomat.GetName]又提出警告：帕尔马精英虽然暂时沉默，但一旦他们完全理解这份有意含糊的协议意味着什么，很可能会心生不满。"
 me_arseka_13_title:0 "$arseka_01_task_13$"
 me_arseka_14.a:0 "在[ROOT.GetCountry.GetAdjective]管理下，帕尔马将重新崛起！"
 me_arseka_14.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_14$#!”$mission_completed_tooltip_2$"
 me_arseka_14_desc:0 "[ROOT.GetCountry.GetRuler.GetName]骑马胜利穿过帕尔马的街道，见证了[ROOT.GetCountry.GetRuler.GetHerHis]努力的成果。尽管最近领导层的变化让帕尔马人民暂时屈服，但他们无法否认由[ROOT.GetCountry.GetRuler.GetName]建立的稳定和秩序带来的明显好处。获得帕尔马宝贵的#Y 贵金属#! @precious_metals!储备，也为[ROOT.GetCountry.GetRuler.GetHerHis]成就增添了另一颗璀璨宝石。\n\n作为征服英雄被庆祝，[ROOT.GetCountry.GetRuler.GetName]站在帕尔马和[ROOT.GetCountry.GetName]新时代的边缘。然而，当[ROOT.GetCountry.GetRuler.GetSheHe]以敏锐目光审视城市景观时，[ROOT.GetCountry.GetRuler.GetSheHe]不禁惋惜地注意到，这座曾被忽视的城市如今已成为我们领域的一部分，值得关注与复兴。为[Palma_ruler.GetName]复仇，这一帕尔马历史上的黑暗篇章，成为了庄重誓言。[ROOT.GetCountry.GetRuler.GetName]决心不仅为这片新获得的土地带来繁荣，还要对造成[Palma_ruler.GetName]悲惨死亡的人施以正义。"
 me_arseka_14_title:0 "$arseka_01_task_14$"
 me_arseka_15.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_15$#!”$mission_completed_tooltip_2$"
 me_arseka_1500.a:0 "有买家，为什么不早说呢。"
 me_arseka_1500.b:0 "让我们将其献给帕尔马的公众。"
 me_arseka_1500_desc:0 "[palma_architect.GetName] 是负责帕尔马修缮工作的杰出建筑师，近日展示了一项建筑设计，完美体现了这座城市融合复兴的精神。[palma_architect.GetSheHe] 所呈现的设计将伊比利亚、布匿与希腊风格和谐地融为一体，创造出一座反映阿尔塞卡文化多样性的建筑杰作。从精细雕刻的檐壁到每一根柱子的布局，处处体现出 [palma_architect.GetHerHis] 对美学的深刻理解。[palma_architect.GetName] 表达了将该作品出售给私人买家的意愿，以收回国家对帕尔马的部分投资。"
 me_arseka_1500_title:0 "辉煌的愿景"
 me_arseka_1501.a:0 "[palma_architect.GetName]，你最好解决这个问题。"
 me_arseka_1501.b:0 "销毁这座雕像的所有痕迹。"
 me_arseka_1501_desc:0 "在一个相当奇特的转折中，[palma_architect.GetName]决定委托其侄子制作一尊纪念[ROOT.GetCountry.GetRuler.GetName]的雕像，这似乎是在几杯庆祝酒后做出的决定。当市民们兴奋地聚集起来准备揭幕仪式时，气氛充满了期待。然而，当覆盖物被移开露出雕像时，气氛急转直下。人群中发出一阵惊恐的叹息，因为雕像呈现的是一个噩梦般的[ROOT.GetCountry.GetRuler.GetName]的脸部置于公牛的身体上。[palma_architect.GetName]站在这个怪物旁边，看似若无其事，脸上带着一丝神秘的微笑。原本满怀期待的群众现在匆忙散去，他们的表情混合着困惑和恐惧。"
 me_arseka_1501_title:0 "帕尔马的恐慌"
 me_arseka_1502.a:0 "干得好，[palma_architect.GetName]。"
 me_arseka_1502_desc:0 "随着尘埃落定于曾经破败的帕尔马城，一场非凡的转变开始展现。多亏了阿尔塞建筑师、熟练工匠以及丰富的资源，在[palma_architect.GetName]的带领下，原本简陋的城镇焕然一新，成为一个光辉和谐的城市。城市的天际线现在拥有了柱子和拱门的结合，融合了伊比利亚结构的简洁与布匿和希腊影响的宏伟。曾经仅是小径的街道现在装饰有描绘伊比利亚民间故事、布匿航海冒险和希腊神话场景的马赛克。供奉赫拉克勒斯-梅尔卡特的寺庙与供奉奥林匹斯传统神祇及塔莱奥提人的神庙并排而立。"
 me_arseka_16.a:0 "我们的后代将回顾我们，并记住：#E 银的时代#!。"
 me_arseka_16.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_16$#!”$mission_completed_tooltip_2$"
 me_arseka_1601.a:0 "选择骑兵，我们首先是伊比利亚人。"
 me_arseka_1601.b:0 "选择三列桨战船，我们将很快成为海洋的主人。"
 me_arseka_1601_desc:0 "随着所谓白银时代展开，阿尔塞的#T 中央铸币厂#!一片繁忙，正准备铸造带有[ROOT.GetCountry.GetRuler.GetName]肖像的钱币，这是阿尔塞卡历史上的第一次。我们已经决定，#T 中央铸币厂#!将生产重量与纯度等同罗马第纳里的银币。铸币厂使者带着两种别具特色的背面图案来到[ROOT.GetCountry.GetRuler.GetName]面前，寻求统治者的明智建议。第一种图案描绘一名英姿勃发的#E 孔特斯塔尼骑手#!，象征伊比利亚人民的骑术力量与传统。第二种图案则刻画一艘#E 威严的三列桨战船#!破浪前行，船身上醒目绘着荷鲁斯之眼。鉴于这些钱币将成为伊比利亚首次印有部落统治者肖像的货币，铸币者说明这些钱币很可能受到远近各方的审视。这是一个黄金机会，让阿尔塞卡有意识地决定要把怎样的遗产刻入所有见到这些第纳里者的记忆。"
 me_arseka_1601_title:0 "阿尔塞卡的遗产"
 me_arseka_16_desc:0 "站在集会的人群前，[ROOT.GetCountry.GetRuler.GetName]发表了一场关于银币生产的奇怪演讲：\n‘我庄严宣誓。每一枚闪亮的硬币，每一块铸造的银片。货币时代即将到来。智慧之下的千锤百炼。这里开始了涵盖一切的金属共鸣，直至伟大的金库。进入财富、繁荣和富足……随着国库扩展至丰盈。’\n[ROOT.GetCountry.GetRuler.GetName]的话语虽神秘但引人入胜，回荡在人群中。阿尔塞的人民对这场非传统的演讲感到困惑，他们向统治者的朋友们寻求线索。[ROOT.GetCountry.GetRuler.GetHerHis]的朋友同样困惑，但也热烈欢呼响应演讲。他们的热情支持激发了人群中的兴奋波。尽管最初存在不确定性，阿尔塞的市民仍受到那一刻能量的鼓舞，加入了庆祝活动。事后，[ROOT.GetCountry.GetRuler.GetName]向一位朋友透露，演讲原本是为了争取扩大边界的支援，但现在[ROOT.GetCountry.GetRuler.GetHerHis]可能有点偏离主题。"
 me_arseka_16_title:0 "$arseka_01_task_16$"
 me_arseka_1700.a:0 "在富足时记住神灵，因为明天可能会是另一番景象。"
 me_arseka_1700_desc:0 "[current_high_priest.GetName]，一位德高望重的占卜师，身着伊比利亚信仰的神圣服饰，怀着沉重的心情走近[ROOT.GetCountry.GetRuler.GetName]，脸上写满了忧虑。在一次庄严的会面中，他揭示了曾经神圣的#E 阿尔库斯圣地#!的悲惨现状，这个地方曾是我们人民与神灵之间的神圣联系，但随着时间推移已逐渐被侵蚀。带着哀叹的语气，[current_high_priest.GetName]描述了那些曾经用雄伟的公牛和高贵的绵羊进行的神圣仪式，如今已退化为宰杀鸡兔的微不足道行为，严重削弱了仪式的神圣性。\n出于恢复#E 阿尔库斯圣地#!昔日荣耀的强烈渴望，这位宗教领袖恳请[ROOT.GetCountry.GetRuler.GetName]考虑对圣地进行重大投资修复。[current_high_priest.GetSheHe]强调了这个神圣空间在维系我们社会精神结构中的关键作用，它是连接凡人世界与神圣领域的纽带。\n除了修复之外，[current_high_priest.GetName]还提议创建一个由国家资助的仪式，每十年举行一次。这一仪式不仅象征圣地的重生，也象征我们集体对神灵承诺的更新。在仪式期间，周围地区的母亲们将向神灵献上她们的新生儿，这是一种神圣的社会融入仪式，也是对我们人民所受恩赐的感恩之举。"
 me_arseka_1700_title:0 "$arseka_01_task_17$"
 me_arseka_1701.a:0 "让我们怀着敬畏和庆祝的心情齐聚神圣的#E 阿尔库斯圣地#!。"
 me_arseka_1701.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_17$#!”$mission_completed_tooltip_2$"
 me_arseka_1701_desc:0 "修复完成后，[current_high_priest.GetName]带着喜悦和满足的表情再次来到[ROOT.GetCountry.GetRuler.GetName]面前。以虔诚的语气，[current_high_priest.GetName]报告说，人们感受到与这片圣地重新建立的联系。#E 公牛崇拜教派#!的信徒们自发地开始再次带来供品，仿佛被一种无形的力量吸引来向神灵致敬。那些一度被遗忘的仪式现在正以超出占卜师预期的热情复兴。\n\n圣地周围的空气中弥漫着一种神圣的存在感，这片神圣的空间已成为我们人民精神福祉的核心。对修复结果印象深刻，[ROOT.GetCountry.GetRuler.GetName]决定抓住这一时机，强化与神灵重新建立的联系。[current_high_priest.GetName]之前的建议与此愿景完全吻合。因此，[ROOT.GetCountry.GetRuler.GetName]宣布将在一个月后举行一场盛大的仪式，标志着我们与神灵重新建立联系的重大时刻。"
 me_arseka_1701_title:0 "$arseka_01_task_17$"
 me_arseka_1702.a:0 "愿神灵继续保佑[ROOT.GetCountry.GetName]及其人民！"
 me_arseka_1702.tt:0 "#Y #E 阿尔库斯神秘仪式#!将每十年举行一次。#!"
 me_arseka_1702_desc:0 "#E 阿尔库斯圣地#!的盛大仪式在一片神圣的敬仰和社区庆祝中展开。来自[ROOT.GetCountry.GetName]各地的人们汇聚到阿尔塞参加这一神圣活动，每个人都携带着供奉物以表达对神灵的虔诚。精心制作的青铜雕像描绘了男女献礼或祈祷的场景，战士、骑士，甚至还有一个雕刻像[current_high_priest.GetName]的形象，象征着精神领导。\n\n空气中弥漫着香火的气息，圣歌回荡，旗帜和彩带装饰着圣地的色彩斑斓。在庆典中，一头美丽的黑色公牛作为祭品呈现出来。[ROOT.GetCountry.GetRuler.GetName]以庄重的姿态亲自执行祭祀仪式，将公牛献给神灵，并邀请同胞一起享用盛宴。\n\n随着黄昏让位给夜晚，仪式的高潮到来。周围地区的母亲们一一上前，将她们的新生儿献给神灵。同时，那些达到年龄的人首次亲自参与仪式，这标志着他们精神旅程的重要里程碑。庆典伴随着盛大的宴席继续进行，增进了人们的联系，强化了社区意识。#E 阿尔库斯圣地#!成为宗教与文化生活的活跃中心，见证了我们的人民与神灵之间重新焕发的联系。"
 me_arseka_1702_title:0 "$arseka_01_task_17$"
 me_arseka_1703.a:0 "让我们十年后再聚一堂，再次庆祝。"
 me_arseka_1703.b:0 "国家的金库再也无法承受这一负担。"
 me_arseka_1703.tt:0 "#R #E 阿尔库斯神秘仪式#!将永久取消。#!"
 me_arseka_1703_desc:0 "阿尔库斯神秘仪式的神圣时刻再次降临[ROOT.GetCountry.GetName]，吸引了远近的人们来到备受尊敬的#E 阿尔库斯圣地#!。当信徒们聚集在一起准备盛大的仪式时，空气中充满了深深的敬仰之情。在这神圣的活动中，许多参与者受深刻的精神情感驱使，向神灵献上供奉物。精心制作的青铜雕像描绘了#E 阿尔塞肯人#!献礼或热切祈祷的场景。战士、公牛，甚至还有一个雕刻像[current_high_priest.GetName]的形象，成为这些虔诚象征的一部分。气氛充满了神秘感和社区庆祝的气息。由[ROOT.GetCountry.GetName]国库资助的盛大宴席展开，象征着神灵赐予[ROOT.GetCountry.GetName]的团结与繁荣。在一个庄严的时刻，[ROOT.GetCountry.GetRuler.GetName]牺牲了一头雄伟的公牛，作为对神灵的祭品。作为神圣仪式的一部分，周围地区的母亲们上前将她们的新生儿献给神灵。那些达到年龄的人首次参与仪式，延续传统并加深人民与神圣之间的联系。"
 me_arseka_1703_title:0 "阿尔库斯神秘仪式"
 me_arseka_1800.a:0 "赞美阿奎洛！"
 me_arseka_1800_desc:0 "阿尔塞卡人民热切期待献给#Y [GetDeityDefinition('omen_aqueloo').GetName|Aqueloo]#!的圣所揭幕。这个重要日子到来时，[current_high_priest.GetName]率领盛大队伍揭示这处圣化之地。信众聚集见证揭幕仪式，空气中充满期待。在这片神圣空间中，阿尔塞卡人民寻得慰藉与希望。信徒虔诚祈祷，献上象征性的供物以表达敬意。这些努力终于引来神圣显现，仁慈的#Y [GetDeityDefinition('omen_aqueloo').GetName|Aqueloo]#!将祂的神圣祝福赐予这片土地。当阿克洛欧恩宠的迹象化作丰盛收成与兴旺农事显现时，阿尔塞卡人民欢欣鼓舞。"
 me_arseka_1800_title:0 "阿奎洛的祝福"
 me_arseka_1801.a:0 "愿阿奎洛的祝福永远庇佑我们的土地。"
 me_arseka_1801_desc:0 "对阿奎洛的深深感激之情席卷了阿尔塞卡。在[current_high_priest.GetName]的带领下，信徒们组织了一场盛大的感恩丰收庆典，聚集在圣地向#Y [GetDeityDefinition('omen_aqueloo').GetName|阿奎洛]#!表达感谢。空气中充满了颂歌、祈祷和供奉的声音，人群参与着虔诚的行为。从精巧编织的花环到手工制作的供奉物，象征性的感恩之物被呈上。一种强烈的团结感和对阿奎洛的共同敬仰弥漫在空气中。在他的仁慈下，#Y [GetDeityDefinition('omen_aqueloo').GetName|阿奎洛]#!继续赐福这片土地。[ROOT.GetCountry.GetName]的人民欣喜若狂，庆祝这场感恩的丰收，认识到他们的虔诚与这位河流与生育之神的蓬勃祝福之间的紧密联系。节日的气氛洋溢着欢乐，暗示着更多喜庆时刻的到来，人们期待阿奎洛以新的开始和即将到来的婴儿潮的形式带来祝福，这一切都得益于丰收的丰盈。"
 me_arseka_1801_title:0 "感恩的丰收"
 me_arseka_1802.a:0 "神的旨意绝非小事。"
 me_arseka_1802_desc:0 "在#E 阿奎洛神圣避难所#!盛大揭幕之后，一种空灵的氛围持续存在，将圣地与河流与生育之神紧密连接起来。阿尔塞卡的人民受到繁荣与丰盈承诺的鼓舞，欣然接受了渗透在这片神圣空间中的神圣能量。随着神圣的气息在大地上传播，[current_high_priest.GetName]和几位选定的侍从以谦逊而坚定的语气向[ROOT.GetCountry.GetRuler.GetName]揭示了一个意想不到的重大启示。\n祭司们分享道，受阿奎洛深远影响的启发，崇高的#E 公牛崇拜教派#!已选择将其虔诚转向对#E 阿奎洛#!的崇拜。他们阐述了对阿奎洛祝福的超越性质的信仰，强调这种神恩超越了个别教派的界限。这一转向象征着一种统一的力量，促进了伊比利亚信徒之间的共同虔诚与团结。\n[current_high_priest.GetName]的面容发生了一丝变化，当他观察[ROOT.GetCountry.GetRuler.GetName]对这一启示的反应时。当晚，举行了一场私人聚会，祭司们陪同[ROOT.GetCountry.GetRuler.GetFirstName]深入讨论了具有重大意义的议题。在这启示之夜，显然祭司们将他们教团的一些秘密智慧托付给了[ROOT.GetCountry.GetRuler.GetFirstName]。当火堆的余烬燃尽，祭司们第二天早晨离开前往#E 阿尔库斯#!。尽管所有人询问，[ROOT.GetCountry.GetRuler.GetFirstName]坚决拒绝透露讨论的细节，反复重复着同一句话。"
 me_arseka_1802_title:0 "启示之夜"
 me_arseka_1803.a:0 "愿阿奎洛的祝福继续以繁荣与丰盈恩泽我们的土地。"
 me_arseka_1803_desc:0 "在盛大的感恩丰收祭之后，季节流转，阿尔塞卡出现了非同寻常的现象。各地行政官报告说，出生人数出现前所未有的激增。喜讯传遍四方，证明#Y 阿克洛欧#!丰饶祝福已经真实影响了我们的人民。曾经献给阿克洛欧的圣所见证着赐予阿尔塞卡的丰足与生命力。无数家庭欢庆新生儿降临，这正是河流与丰饶之神神恩的证明。行政官们在报告中特别强调，感恩丰收祭、阿克洛欧的祝福与显著增长的出生数之间联系昭然，标志着国家进入一段繁荣与增长的时期。"
 me_arseka_1803_title:0 "婴儿潮"
 me_arseka_18_dream.a:0 "此何意？"
 me_arseka_18_dream.a.tt:0 "来自伊比利亚与希腊化两大传统的祭司将齐聚一堂，解读那神圣的梦境，照亮那神秘莫测的神祇所铺设的道路。"
 me_arseka_18_dream_1.a:0 "阿刻罗俄斯，阿奎卢。都一样，不是吗？"
 me_arseka_18_dream_1_desc:0 "造访[ROOT.GetCountry.GetRuler.GetTitle][ROOT.GetCountry.GetRuler.GetName]的神圣梦境，至今仍令人迷惑又好奇。为寻求指引，[ROOT.GetCountry.GetRuler.GetHerHim]召集了不同信仰的祭司共商其解。希腊化祭司以斩钉截铁的语气宣称，梦中的天庭形象非阿刻罗俄斯莫属——这位由大地与海洋所生的牛角之神，曾为赫拉克勒斯所败。然而，深植于自身传统的伊比利亚祭司则断言，该神的正确名称应为阿刻洛奥。祭司之间的辩论愈发激烈，双方试图调和各自的解读。在争论之中，伊比利亚祭司补充道：「我知晓在塞里卡有一尊宏伟的阿刻洛奥雕像。或许神意欲令我们将之取回，携至阿尔库斯，以尊崇其神圣意志。」尽管希腊化祭司面露疑虑，但还是同意了伊比利亚祭司的解读。"
 me_arseka_18_dream_1_title:0 "解读神梦"
 me_arseka_18_dream_desc:0 "对我邦[ROOT.GetCountry.GetRuler.GetTitle][ROOT.GetCountry.GetRuler.GetName]而言，一个非凡的夜晚在梦境中展开了画卷。在沉睡的寂静怀抱中，一道神圣的存在降临于[ROOT.GetCountry.GetRuler.GetHerHim]。那天庭形象显为一老迈者，头顶王冠之上伸出两只威严的犄角。灰白的长发如柔波般垂落，一副蓬乱的胡须——水从其中源源不断地流淌——衬托着那张饱经风霜的面庞。他立于无尽的牛骨堆中，周身散发着神威的光晕。在这缥缈的梦境之中，一道谕令传达给了[ROOT.GetCountry.GetRuler.GetPraenomen]，敦促[ROOT.GetCountry.GetRuler.GetHerHim]从[GetProvince('(int32)1254').GetName]的圣地取回一尊神圣的雕像。此番天启令[ROOT.GetCountry.GetRuler.GetPraenomen]心神不宁，促使其寻求圣者的指引，以解读嵌入梦中的讯息。"
 me_arseka_18_dream_title:0 "[ROOT.GetCountry.GetRuler.GetName]夜中启示"
 me_arseka_1900.a:0 "毫无疑问，无论是阿克洛奥斯还是阿奎洛，无论他叫什么名字，都会非常高兴。"
 me_arseka_1900_desc:0 "随着胜利的旗帜展开，空气中弥漫着胜利的甜美气息，我们英勇的军队凯旋回到阿尔库斯，携带着巨大的战利品——征服的成果。在欢呼的人群中，一座巨大的雕像骄傲地展示出来，这是一座人与公牛结合的奇特雕塑，是用石灰岩雕刻而成的阿克洛奥斯或阿奎洛的宏伟化身。这座雕像技艺精湛，捕捉到了这位备受尊敬的神灵的本质，细节处理极为细致。\n\n这座雕像本身象征了希腊人对我们人民的影响。尽管很可能是由康塔斯坦人创作，但雕像风格明显带有希腊影响的印记，这一点通过头发和胡须的直线凹槽表现得淋漓尽致。"
 me_arseka_1900_title:0 "阿尔库斯的胜利"
 me_arseka_1901.a:0 "神已经发声，我们将听从他们的神圣召唤。"
 me_arseka_1901_desc:0 "在夜晚的寂静中，当[ROOT.GetCountry.GetRuler.GetName]安睡时，一位神圣的存在在一个生动的梦中显现。阿奎洛，这位备受尊敬的河流与生育之神，以天界造访的形式降临统治者面前。散发着超凡脱俗的光环，阿奎洛以如河流轻柔流淌和树叶沙沙作响般回荡的声音说道：'我对你的虔诚感到非常满意，'神灵宣告道，'要知道阿克洛奥斯和阿奎洛只是同一神圣本质的两个方面，就像硬币的两面。所有神灵都将接受这种二元性，其本质将分裂为和谐的两半的时间即将到来。'[ROOT.GetCountry.GetRuler.GetName]被一种深刻的宁静感包围，阿奎洛继续说道：'我恳求你将我的阿提卡阿克洛奥斯崇拜带到[ROOT.GetCountry.GetAdjective]的土地上。让这一古老传统的神圣仪式在阿尔塞卡的土地上扎根，并见证即将展开的神圣统一。'"
 me_arseka_1901_title:0 "神圣启示"
 me_arseka_2.a:0 "这种背叛不能置之不理。"
 me_arseka_2.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_2$#!”$mission_completed_tooltip_2$"
 me_arseka_2000.a:0 "希望没有人会利用这一点。"
 me_arseka_2000_desc:0 "经过审慎考虑，并收到许多有影响力的希腊人物请愿后，[ROOT.GetCountry.GetRuler.GetName]以公开敕令向阿尔塞卡人民发表讲话。[ROOT.GetCountry.GetRuler.GetName]宣布实行正式的宗教宽容政策，鼓励阿尔塞卡境内各种信仰共存。站在萨戈因提乌姆中心聚集的人群面前，[ROOT.GetCountry.GetRuler.GetName]强调向外部世界展现统一阵线的重要性。人群对此反应不一；有人因社会将更具包容性而感到宽慰，也有人依旧谨慎或怀疑。"
 me_arseka_2000_title:0 "官方宽容政策"
 me_arseka_2001.a:0 "这可能会引发麻烦。"
 me_arseka_2001_desc:0 "商人们的耳语提到一位来自马赛利亚的富有魅力的祭司，[charismatic_priest.GetName]，他俘获了当地民众的心灵与思想。凭借出色的口才和对神圣事务的独特见解，[charismatic_priest.GetName]挑战了对神灵的现有理解，传授了一种混合了伊比利亚和希腊信仰的变体。他的教义随着他在全国旅行而声名远扬，吸引了越来越多好奇和感兴趣的人。[charismatic_priest.GetName]宣讲希腊信仰，声称我们对神灵的当前理解是有缺陷且不完整的。他断言，接受希腊的方式将带来与神圣更深层次的联系，动摇了原本忠诚于伊比利亚信仰的人，转而支持希腊诸神的事业。"
 me_arseka_2001_title:0 "新声音的崛起"
 me_arseka_2002.a:0 "邀请[charismatic_priest.GetName]共进晚餐。"
 me_arseka_2002.b:0 "镇压这一异端。"
 me_arseka_2002_desc:0 "随着[charismatic_priest.GetName]的信息在民众中激起回响，尤其打动了[SCOPE.sP('converted_province').GetName]那些失去依靠的人，一股变革浪潮席卷阿尔塞卡。他富有魅力的身影成了磁石，吸引大量皈依者投入希腊信仰怀抱。献给希腊诸神的供物日渐流行，马萨利亚祭司的热忱追随者自发组织集会，讨论并庆祝他们新近获得的信仰。这场皈依运动如生长藤蔓的卷须般蔓延整个阿尔塞卡，在选择拥抱希腊道路的人群之间培育出团结感。[charismatic_priest.GetName]成为这场精神转化的催化剂，不知疲倦地走遍全国，聚集追随者，并在阿尔塞卡信仰的沃土中滋养希腊信仰的根系。"
 me_arseka_2002_title:0 "皈依的召唤"
 me_arseka_2003.a:0 "终于和平了。"
 me_arseka_2003_desc:0 "随着[charismatic_priest.GetName]的影响如野火般蔓延，阿尔塞卡的宗教景观发生剧变。这位魅力祭司的教义挑战传统伊比利亚信仰，威胁着撕裂国家精神生活的织物。由于担心传统信仰遭到侵蚀，并引发随之而来的混乱，[ROOT.GetCountry.GetRuler.GetName]决定必须采取行动镇压这一异端。一道公告随即发布，谴责[charismatic_priest.GetName]的教导虚假而误人。统治者动员祭司团和忠诚信徒，对异端运动展开真正的圣战。献给伊比利亚诸神的神庙成为信众集结点，他们团结起来抵御逼近的希腊影响。阿尔塞卡各地的伊比利亚领袖汇聚阿尔塞，共商策略，并强化既有信仰的神圣性。为抵消[charismatic_priest.GetName]的个人魅力，祭司们加紧发表慷慨激昂的布道，反驳异端教义。在这种动荡气氛中，马萨利亚祭司的狂热追随者与坚定捍卫伊比利亚传统者发生冲突，紧张不断升级。市场和广场上爆发公开辩论，双方都激烈捍卫自己的信念。这场斗争之后，传统派取得胜利；[charismatic_priest.GetName]的追随者几乎无一例外，最终不是放弃其异端信仰，就是倒在剑下。"
 me_arseka_2003_title:0 "[charismatic_priest.GetName]的异端"
 me_arseka_2004.a:0 "支付神龛费用。"
 me_arseka_2004.b:0 "监禁异端。"
 me_arseka_2004.c:0 "杀了他……现在就杀！"
 me_arseka_2004_desc:0 "对希腊信仰在阿尔塞卡日益增长的受欢迎程度感到好奇，[ROOT.GetCountry.GetRuler.GetName]的仆从精心策划了一场秘密邀请，邀请[charismatic_priest.GetName]参加一场奢华而私密的晚宴，地点设在[ROOT.GetCountry.GetRuler.GetHerHis]的住所。统治者深知象征力量的重要性，确保晚宴的所有出席者都是马赛利亚人，显然是为了向[charismatic_priest.GetName]传递一个微妙但明确的信息。当[charismatic_priest.GetName]步入房间时，一种肃然起敬的气氛笼罩着他。这位马赛利亚祭司敏锐意识到与[ROOT.GetCountry.GetRuler.GetName]对话的重要性，对这次难得的机会表达感谢，分享他独特的见解。\n\n他们的讨论在奢华环境中展开，精致蜡烛的闪烁光芒在聚集者的脸上投下阴影。[charismatic_priest.GetName]凭借其雄辩和魅力，热情地提出了一种挑战严格遵循伊比利亚传统的观点。这位马赛利亚祭司解释说，许多阿尔塞卡的神灵都有希腊对应者，这些对应者似乎拥有更大的力量。他还主张，接纳希腊万神殿将为阿尔塞卡带来繁荣和神圣恩宠。随着夜晚的推移，一个意想不到的转折打断了谈话。晚餐进行到一半时，奴隶们抬着两头巨大的伊比利亚黑野猪进入大厅。引人注目的是，这些野猪的准备方式让人联想到对伊比利亚诸神的祭祀，每个烹饪细节都反映了古老的仪式。\n\n当[ROOT.GetCountry.GetRuler.GetName]观察马赛利亚祭司面对这一明显挑战的反应时，气氛变得充满了未言明的紧张。然而[charismatic_priest.GetName]毫不动摇，抓住这个时机将话题转向未来。他谦逊却有力地请求，在阿尔塞卡中心建立一座赫拉克勒斯神龛。[charismatic_priest.GetName]认为，这样的举动将极大地满足萨贡图姆的商人。然而，批准他的请求无疑会被他的追随者视为对这一明显异端的默许。"
 me_arseka_2004_title:0 "启示与反思"
 me_arseka_21.a:0 "出发前往罗马和朱庇特至高无上神庙！"
 me_arseka_21.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_21$#!”$mission_completed_tooltip_2$"
 me_arseka_2101.a:0 "欣然接受邀请！"
 me_arseka_2101.b:0 "我们必须立即出发前往奥林匹亚。"
 me_arseka_2101_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]抵达所谓的#E 永恒之城罗马#!时，[ROOT.GetCountry.GetRuler.GetName]受到了当年两位执政官之一、#E [arseka_consul_friend.GetName]#!的迎接。他们互相寒暄，并讨论了治国方略和神学问题。执政官[arseka_consul_friend.GetName]展示了[arseka_consul_friend.GetHerHis]的热情好客，并向[ROOT.GetCountry.GetRuler.GetName]介绍了罗马核心的传统精华。在[arseka_consul_friend.GetName]的建议下，[ROOT.GetCountry.GetRuler.GetName]参观了这座城市著名的#E 公共浴场#!。热闹的氛围、精美的马赛克地板以及集体精神让[ROOT.GetCountry.GetRuler.GetName]得以一窥罗马市民的日常生活。\n\n在悠闲地探索了罗马的活力生活后，执政官邀请[ROOT.GetCountry.GetRuler.GetName]于晚间特别参观罗马的神圣中心——#E 至高无上的朱庇特神庙#!。执政官[arseka_consul_friend.GetName]亲自引导[ROOT.GetCountry.GetRuler.GetName]穿过罗马错综复杂的街道，来到#E 卡皮托利山#!，这座宏伟的神庙矗立于此，是罗马工程技术与宗教虔诚的见证。随着神庙大门缓缓打开，一种肃然的惊叹笼罩着[ROOT.GetCountry.GetRuler.GetName]。这座巨大的建筑献给朱庇特、朱诺和密涅瓦，其金色屋顶在夕阳余晖中熠熠生辉。空气中弥漫着香火的味道，神庙周围回荡着祭司们的低语声和远处城市生活的喧嚣。\n\n离开神庙后，[arseka_consul_friend.GetName]向[ROOT.GetCountry.GetRuler.GetName]发出了一个极为#E 优雅的邀请#!，请[ROOT.GetCountry.GetRuler.GetName]前往位于罗马郊外的[arseka_consul_friend.GetHerHis] #E 别墅#!居住。[arseka_consul_friend.GetName]向[ROOT.GetCountry.GetRuler.GetName]保证，这座别墅将为[ROOT.GetCountry.GetRuler.GetName]提供一个远离城市喧嚣的宁静舒适的休憩之所。"
 me_arseka_2101_title:0 "永恒之城"
 me_arseka_2102.a:0 "确实是一次难忘的逗留！"
 me_arseka_2102_desc:0 "怀着感激之情，[ROOT.GetCountry.GetRuler.GetName]欣然接受了执政官入住[arseka_consul_friend.GetName]别墅的邀请。当别墅的大门缓缓打开时，[ROOT.GetCountry.GetRuler.GetName]被迎入了一个隐秘的奢华绿洲。这座#E 执政官的别墅#!坐落在郁郁葱葱的花园之中，俯瞰起伏的山丘，展现了罗马人的品味与富裕。\n\n在[ROOT.GetCountry.GetRuler.GetName]居住于别墅的数周里，[arseka_consul_friend.GetName]扮演了主人兼导游的角色。他们的早晨从漫步修剪整齐的花园开始，[ROOT.GetCountry.GetRuler.GetName]可以欣赏到由熟练园丁精心照料的多样植物。早餐则在阴凉的庭院中享用，执政官在此向[ROOT.GetCountry.GetRuler.GetName]讲述罗马的神祇、历史、政治和社会生活。下午则用于私人导览执政官丰富的#E 艺术收藏品#!，探索永恒之城，并结识重要的元老院议员。晚上则是精致的罗马美食盛宴，呈现出风味与香气的交响曲。执政官向[ROOT.GetCountry.GetRuler.GetName]介绍罗马美食的细微差别，强调每道菜肴在共和国文化拼图中的意义。执政官特别鼓励[ROOT.GetCountry.GetRuler.GetName]尝试一种名为‘鱼酱’（Garum）的#E 臭名昭著的调味品#!。起初，[ROOT.GetCountry.GetRuler.GetName]觉得这种味道令人厌恶，但几周后，[ROOT.GetCountry.GetRuler.GetName]逐渐欣赏到了这一罗马美食的独特风味。"
 me_arseka_2102_title:0 "[arseka_consul_friend.GetName]的热情款待"
 me_arseka_2103.a:0 "再见了，感谢所有的鱼！"
 me_arseka_2103_desc:0 "在[ROOT.GetCountry.GetRuler.GetName]停留的最后一晚，执政官给[ROOT.GetCountry.GetRuler.GetName]带来了一份特别的惊喜——一盘#E 最优质的伊比利亚黑火腿#!，这是一种从[ROOT.GetCountry.GetName]进口的美味佳肴。家乡的味道唤起了无数回忆，[ROOT.GetCountry.GetRuler.GetName]被这份体贴的举动深深打动。在他们共享最后一餐时，[arseka_consul_friend.GetName]举起一杯罗马葡萄酒祝酒，宣布与[ROOT.GetCountry.GetRuler.GetName]的#E 永恒友谊#!。作为临别礼物，执政官赠送给[ROOT.GetCountry.GetRuler.GetName]几罐装满臭名昭著的鱼酱油（Garum）的双耳瓶。\n\n当[ROOT.GetCountry.GetRuler.GetName]准备#E 前往奥林匹亚#!时，执政官祝愿[ROOT.GetCountry.GetRuler.GetName]旅途平安，并推荐[ROOT.GetCountry.GetRuler.GetName]去拜访他朋友经营的#E 古希腊摔跤学校（Palaestra）#!，那里训练奥林匹克比赛的参赛者。"
 me_arseka_2103_title:0 "外交的味道"
 me_arseka_2104.a:0 "训练我吧！"
 me_arseka_2104.b:0 "听起来需要很多努力。"
 me_arseka_2104_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]踏上奥林匹亚这片#E 奥林匹克运动会#!的圣地时，一股兴奋感涌上心头。这座城市装饰着永恒的纪念碑和运动设施，回荡着古代竞技的余音。出于探索的精神，[ROOT.GetCountry.GetRuler.GetName]决定听从#E 罗马执政官#! [arseka_consul_friend.GetName]的建议，参观了一所著名的#E 摔跤学校（Palaestra）#!，据说这里训练出了最优秀的奥林匹克选手。学校的主人[wrestle_teacher.GetName]是一位经验丰富的著名教练，他热情地欢迎了[ROOT.GetCountry.GetRuler.GetName]并带领参观了设备齐全的设施。被这里对身体卓越的追求所震撼，[ROOT.GetCountry.GetRuler.GetName]与[wrestle_teacher.GetName]交谈，询问他是如何取得如此卓越的成绩的。令[ROOT.GetCountry.GetRuler.GetHerHis]惊讶的是，[wrestle_teacher.GetName]微笑着回答：‘啊，我们技艺的秘密是严加守护的，我的朋友。我不能向一个外人透露它们。然而，对于像你这样有潜力的人，我愿意破例。我可以教你#E 摔跤的艺术#!，把你塑造成一名杰出的运动员。你愿意投身于我的艺术吗？’"
 me_arseka_2104_title:0 "[wrestle_teacher.GetName]的摔跤学校"
 me_arseka_2105.a:0 "请接受我对贵角力学校的一点微薄捐赠。"
 me_arseka_2105_desc:0 "经过在[wrestle_teacher.GetName]的摔跤学校为期一个月的严格训练，[ROOT.GetCountry.GetRuler.GetName]成为了一名#E 强大的斗士#!。资深教练[wrestle_teacher.GetName]自豪地看着[ROOT.GetCountry.GetRuler.GetName]击败了一位前奥运会选手，[ROOT.GetCountry.GetRuler.GetHerHis]的技能甚至超越了[wrestle_teacher.GetHerHis]最高的期望。在一次私人会面中，[wrestle_teacher.GetName]带着#E 赞许的点头#!走向[ROOT.GetCountry.GetRuler.GetName]。‘你，[ROOT.GetCountry.GetRuler.GetName]，证明了自己是一名非凡的学生。你的奉献精神和天赋让你达到了很少有人能达到的高度。在摔跤领域，我已经没有什么可以教你的了。你已经#E 掌握了这些神圣墙壁内的战斗艺术#!。’\n[wrestle_teacher.GetName]随后向[ROOT.GetCountry.GetRuler.GetName]赠送了一顶传统的#E 橄榄叶花环#!，象征胜利与荣誉。‘愿这顶花环成为你实力的证明。指导你完成这场身体掌控之旅是我的荣幸。我相信，你新获得的技能无论是在竞技场还是战场上都会对你大有裨益。’"
 me_arseka_2105_title:0 "掌握摔跤学校"
 me_arseka_2106.a:0 "好，我们出发。"
 me_arseka_2106_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]探索奥林匹亚的圣地时，[ROOT.GetCountry.GetRuler.GetHerHis]的注意力被引向了雄伟的#E 宙斯神庙#!。被其宏伟所吸引，[ROOT.GetCountry.GetRuler.GetName]指示[arseka_scribe.GetName]仔细记录下关于这座神庙及其建造的所有细节。武装着羊皮纸和羽毛笔的[arseka_scribe.GetName]认真地检查了#E 宙斯神庙#!，注意到了它的结构元素和独特之处。书记员发现，从靠近#E 提洛岛#!的一些岛屿进口的帕罗斯大理石是建造这座非凡建筑的重要材料之一。#E 宙斯神庙#!作为杰作屹立不倒，它是#E 多立克柱式#!与复杂饰带的和谐结合。以其简洁和坚固著称的#E 多立克柱式#!为支撑上层结构提供了坚实的基础。饰带上装饰有神话场景和浮雕，叙述着神祇和英雄的故事。当[ROOT.GetCountry.GetRuler.GetName]沿着柱廊行走时，柱子的节奏模式以及光影的交错创造了一个迷人的景象。在#E 宙斯神庙#!的核心处，[arseka_scribe.GetName]和[ROOT.GetCountry.GetRuler.GetName]一同惊叹于由黄金和雕刻象牙覆盖在木框架上的巨大#E 金象牙雕像#!——宙斯像。这座非凡的雕像出自艺术家#E 菲迪亚斯#!之手，他同样也是雅典人嫉妒的#E 帕台农神庙中的雅典娜像#!的创作者。坐在华丽宝座上的众神之王右手握着雷电，象征着神圣的力量。雕像的眼睛由珍贵宝石制成，仿佛以一种超凡脱俗的强度凝视着前方。[arseka_scribe.GetName]向[ROOT.GetCountry.GetRuler.GetName]保证，总有一天[ROOT.GetCountry.GetName]也将拥有这样的奇观。‘也许我们能在雅典了解更多关于#E 菲迪亚斯#!的信息？’"
 me_arseka_2106_title:0 "众神之王"
 me_arseka_2107.a:0 "[arseka_scribe.GetName]，记录每一个细节。"
 me_arseka_2107_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]抵达希腊文化和智慧的心脏——古老的雅典城时，空气中弥漫着敬意。[ROOT.GetCountry.GetRuler.GetName]的第一个目的地就是著名的#E 卫城#!，它是一个高耸的城堡，顶部冠有标志性的#E 帕特农神庙#!。在攀登卫城的岩石阶梯时，[ROOT.GetCountry.GetRuler.GetName]由[arseka_scribe.GetName]陪同，确保这个圣地的每一个细节都被揭示。作为雅典民主和建筑辉煌象征的#E 帕特农神庙#!自豪地矗立在卫城之巅。[arseka_scribe.GetName]热情地讲述了献给城市守护女神雅典娜的#E 帕特农神庙#!的故事。神庙的#E 多立克柱式#!，饰有复杂的饰带和雕塑，体现了古典希腊建筑的顶峰。大师建筑师#E 伊克蒂诺斯#!和#E 卡利克拉特斯#!实施的黄金比例和光学改进被充满学术热情地指出。当[ROOT.GetCountry.GetRuler.GetName]凝视着#E 帕特农神庙#!时，它巨大的历史意义变得触手可及。尽管历经时间的侵蚀，这座大理石结构依然散发出不可否认的神圣威严光辉。雕刻的中楣和山墙使古代传说栩栩如生。[arseka_scribe.GetName]特别提请注意饰带上描绘的泛雅典娜节游行的复杂性，这是对雕塑家#E 菲迪亚斯#!及其熟练学徒艺术造诣的见证。"
 me_arseka_2107_title:0 "令人敬畏的雅典"
 me_arseka_2108.a:0 "够了，别开玩笑了，我们回到商人那里吧。"
 me_arseka_2108.b:0 "很好，[arseka_scribe.GetName]，我来唱。"
 me_arseka_2108_desc:0 "me_arseka_2108_desc:0 \"在饱览了神圣的#E 卫城#!之巅那令人叹为观止的#E 帕特农神庙#!之美后，[ROOT.GetCountry.GetRuler.GetName][ROOT.GetCountry.GetRuler.GetHerHim]决定沉浸于雅典娜城市的活力氛围中。从卫城下来后，[ROOT.GetCountry.GetRuler.GetName]和[arseka_scribe.GetName]穿梭于雅典热闹的街道之间，这座城市以其学术热情和商业活动而闻名。[ROOT.GetCountry.GetRuler.GetName]的第一项任务是与当地商人会面，讨论潜在的贸易协议。这座城市的战略位置及其海上实力使其成为地中海各地商品的枢纽，[ROOT.GetCountry.GetRuler.GetName]看到了通过这些新建立的联系来丰富[ROOT.GetCountry.GetName]的潜力。中央市场阿哥拉充满了活力，商人们兜售着他们的货物，从异国香料到精美的陶器应有尽有。在城市中的悠闲漫步期间，[arseka_scribe.GetName]指出了一些点缀雅典天际线的著名地标。以位于阿哥拉西侧、宏伟的#E 赫菲斯托斯神庙#!为背景，[arseka_scribe.GetName]讲述了这座供奉工艺之神的神庙的历史，并记录下任何哪怕稍微有用的信息。[ROOT.GetCountry.GetRuler.GetName]还花了一点时间欣赏了用于举办音乐比赛和表演的优雅圆形剧场#E 伯里克利音乐厅#!。[arseka_scribe.GetName]开玩笑说[ROOT.GetCountry.GetRuler.GetName]应该为雅典人表演一番。”"
 me_arseka_2108_title:0 "商业或旋律"
 me_arseka_2109.a:0 "再见，雅典。"
 me_arseka_2109_desc:0 "在雅典度过了两周充实的日子后，[ROOT.GetCountry.GetRuler.GetName]决定参观#E 柏拉图学院#!来结束这次访问。学院坐落在雅典西北部的神圣阿卡德米亚树林内，长期以来一直是开明思想的中心。这片由古老橄榄树和神圣神龛装点的树林营造了一个适合沉思和学习的环境。[ROOT.GetRuler.GetName]受到了柏拉图教学的现任守护者的欢迎，他们是继承了尊敬导师衣钵的忠实学生。在橄榄树的阴影下，讨论涉及了从形而上学到伦理学等各个方面的主题。学生们作为自己领域的热心学者，热切地分享了柏拉图奠定的哲学基础见解。随着太阳在树林上方落下，[arseka_scribe.GetName]勤奋地记录下了这些对话中的智慧结晶。在这古老的橄榄树下共享的知识将成为阿尔塞卡的智慧财富的一部分。夕阳西下时，[ROOT.GetCountry.GetRuler.GetName]和随行人员前往码头，启程回家，回到阿尔塞卡。"
 me_arseka_2109_title:0 "阿卡德米亚树林"
 me_arseka_2110.a:0 "有什么想法？"
 me_arseka_2110_desc:0 "回到[ROOT.GetCountry.GetRuler.GetHerHis]钟爱的阿尔塞后，[ROOT.GetCountry.GetRuler.GetName]沉浸于阿尔塞卡熟悉的景象与声响之中：萨戈因提乌姆旁繁忙的市场、市民温暖的问候，都像欢迎的怀抱一样抚平了旅途劳顿。急于分享过去几个月的见闻，[ROOT.GetCountry.GetRuler.GetName]决定把一丝罗马式好客带给阿尔塞卡要人，并为国家规划新路线。[ROOT.GetCountry.GetRuler.GetName]取出罗马执政官[arseka_consul_friend.GetName]赠予的临别礼物，即精心保存的鱼露，邀请一群密友赴宴，以庆祝这次外交使命成功。朋友们围坐桌旁，鱼露香气弥漫空中。不幸的是，[ROOT.GetCountry.GetRuler.GetHerHis]一位朋友不熟悉鱼露的浓烈滋味，在一片火腿上堆了令人担忧的分量，鼓起勇气咬下一口后立刻退缩，无法咽下这种异域味道。众人笑声四起，而这位朋友则英勇地试图恢复镇定。\n\n然而，当欢快气氛渐渐平息，[ROOT.GetCountry.GetRuler.GetName]改变了聚会的基调。[ROOT.GetCountry.GetRuler.GetName]透露，[ROOT.GetCountry.GetRuler.GetSheHe]召集这些能够称为朋友的阿尔塞卡最有影响力者，并不只是为了宴饮，而是要讨论一件极其重要之事。[ROOT.GetCountry.GetRuler.GetName]严肃起来，说在[ROOT.GetCountry.GetRuler.GetHerHis]旅程之后，[ROOT.GetCountry.GetRuler.GetSheHe]认为时机已经成熟，可以探讨是否让使阿尔塞卡富裕起来的萨贡廷人信仰也成为大众信仰。这顿看似简单的餐宴，很可能会被铭记为阿尔塞卡历史上最重要的一餐。在分享了阿尔塞卡希腊化未来的愿景之后，[ROOT.GetCountry.GetRuler.GetSheHe]开放讨论，急切想听听国家要人对此事有何看法。"
 me_arseka_2110_title:0 "归乡之喜"
 me_arseka_2111.a:0 "让我们听听另一方的观点。"
 me_arseka_2111_desc:0 "讨论展开时，[arseka_nativist_friend.GetName]和[arseka_hellenic_friend.GetName]成为席间最响亮的声音，各自热切阐述把希腊万神殿接纳为阿尔塞卡国教的利弊。[arseka_hellenic_friend.GetName]似乎早已对此深思熟虑。他认为，让阿尔塞卡与希腊万神殿保持一致，必然会在东方市场获得更有利的贸易地位。希腊人当然更愿意同一个共享其信仰的国家通商。此外，[arseka_hellenic_friend.GetName]主张，皈依会使阿尔塞卡更接近被希腊人视为真正平等者，而不是成功的蛮族。[arseka_hellenic_friend.GetName]条理清晰地指出，历史上已有无数其他国家成功融入希腊世界的先例。众人专心聆听时，[arseka_hellenic_friend.GetName]描绘出一个愿景：阿尔塞卡将成为希腊世界中受尊敬且有影响力的一员，收获共同宗教与文化纽带带来的好处。繁荣与认可所标志的光明未来悬在空中，[arseka_hellenic_friend.GetName]为接纳希腊万神殿提出了强有力的理由。"
 me_arseka_2111_title:0 "[arseka_hellenic_friend.GetName]的辩论"
 me_arseka_2112.a:0 "我们投票吧？"
 me_arseka_2112_desc:0 "房间中议论纷纷时，[arseka_nativist_friend.GetName]抓住机会，激烈反对采纳希腊万神殿这一想法。在一番近乎失控的咆哮中，[arseka_nativist_friend.GetName]愤怒谴责接纳外邦神祇的念头，称这是一场酝酿数百年的马萨利亚阴谋，意在取代伊比利亚人并夺走他们的土地。他强烈主张，这样的同化会侵蚀阿尔塞卡的身份与遗产。在[arseka_nativist_friend.GetName]看来，萨戈因提乌姆的马萨利亚飞地正是外来影响如何颠覆本土生活方式的警示。[arseka_nativist_friend.GetName]认为，采纳希腊万神殿将背叛把阿尔塞卡建设为繁荣文明的埃德塔尼亚人。他担心此举会为外来者逐步取代本土人口铺平道路。[arseka_nativist_friend.GetName]眼中满是狂热，主张驱逐所有鼓吹外邦神祇者，当然[ROOT.GetCountry.GetRuler.GetName]除外；他把这些人视为威胁阿尔塞卡本质的存在。"
 me_arseka_2112_title:0 "[arseka_nativist_friend.GetName]的狂言"
 me_arseka_2113.a:0 "民意即天意"
 me_arseka_2113.b:0 "呃……[arseka_nativist_friend.GetName]可能有点道理……"
 me_arseka_2113.tt:0 "#E 阿尔塞卡#!将皈依#Y [GetReligion('roman_pantheon').GetName]#!信仰。"
 me_arseka_2113_desc:0 "看到他的咆哮未能说服任何人，[arseka_nativist_friend.GetName]突然转向，猛烈谴责据说#E 阿凯洛斯#!赐予信徒的幻象。他驳斥这些所谓的预言为公然的#E ‘马其顿心理战’#!，尽管他难以解释心理战是什么。在他的狂热中，他指责几乎所有与会者都是潜在的外国特工。[arseka_nativist_friend.GetName]的非理性和（希望是）毫无根据的指控给会议蒙上了阴影，将讨论推向了混乱的边缘。他无法区分真正的担忧和无端的偏执，开始疏远大多数与会者。当他指向想象中的阴谋者时，气氛变得越来越令人不安。相比之下，[arseka_hellenic_friend.GetName]的理性论点在旁观者中获得了支持。[arseka_nativist_friend.GetName]表现出的非理性开始凸显务实方法的重要性，促成了支持接受希腊万神殿的共识增长，因其可能为阿尔塞卡带来潜在的好处。看到[arseka_nativist_friend.GetName]的论点无路可走，[ROOT.GetCountry.GetRuler.GetName]呼吁投票。结果几乎一致通过，只有[arseka_nativist_friend.GetName]投票反对接受新的国教。"
 me_arseka_2113_title:0 "希腊化的阿尔塞卡？"
 me_arseka_2114.a:0 "也许阿尔塞卡终究真的能成为一个希腊化国家……"
 me_arseka_2114_desc:0 "自决定接纳希腊万神殿作为阿尔塞卡国教以来，六个月已经过去。尽管转变并非没有挑战，它已开始在阿尔塞卡人民心中扎根。曾经充满争议的辩论让位于新的团结感，阿尔塞卡公民逐渐接受这一文化与宗教转向。在阿尔塞，繁忙街道上如今出现了供奉各位希腊神祇的小神龛。受希腊建筑奇观启发的简陋神庙点缀城景，为礼拜与公共聚会提供场所。阿尔塞卡日常生活的节奏如今与希腊信仰的仪式和庆典交织在一起。[ROOT.GetCountry.GetRuler.GetName]花了更多时间在萨戈因提乌姆，监督这种新信仰的融合。值得注意的是，[ROOT.GetCountry.GetRuler.GetName]选择阿刻洛俄斯作为[ROOT.GetCountry.GetRuler.GetHerHis]守护神，这一象征性转变自有其意义。这个选择不同于阿克洛欧，清楚反映出一种有意识的决定，要与昨日的伊比利亚阿尔塞卡决裂。阿尔塞卡各地城市街道装饰着花环，公民参加敬奉诸神的节日。许多一度怀疑的声音已经缓和，好奇心占据上风。"
 me_arseka_2114_title:0 "新的黎明"
 me_arseka_21_desc:0 "为了尽可能多地了解希腊人的宗教，我们尊敬的[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]决定踏上一次#E 伟大的朝圣之旅#!，前往一些希腊诸神最重要的宗教中心。目的地包括#E 罗马、奥林匹亚和雅典。#! 这一重大旅程的准备工作正在进行中。宫廷里一片繁忙景象，顾问、学者和随从们不辞辛劳地确保[ROOT.GetCountry.GetRuler.GetName]为这次朝圣做好充分准备。地图被查阅，行程被起草，关于每个目的地的文化和宗教意义的讨论层出不穷。[ROOT.GetCountry.GetRuler.GetName]精心挑选了一支由博学的学者和值得信赖的助手组成的随行队伍，陪伴[ROOT.GetCountry.GetRuler.GetHerHim]完成这次精神探索。\n\n[arseka_scribe.GetName]精通多种语言，远超大多数阿尔塞卡人能数清的数量，他被选中陪同[ROOT.GetCountry.GetRuler.GetName]进行这次精神之旅。[ROOT.GetCountry.GetRuler.GetName]将依靠[arseka_scribe.GetName]在#E 伊比利亚和希腊#!传统方面的广泛知识来弥合语言和文化差距。由[arseka_scribe.GetName]领导的随行队伍负责记录沿途遇到的仪式、传统和建筑奇观，为[ROOT.GetCountry.GetRuler.GetName]提供对希腊宗教景观的全面理解。随着出发日期的临近，向伊比利亚和希腊诸神献上了祈求安全和启迪旅程的供奉。[ROOT.GetCountry.GetName]的神庙中回荡着为[ROOT.GetCountry.GetRuler.GetName]及其随行队伍平安祈福的祷告声。"
 me_arseka_21_title:0 "$arseka_01_task_21$"
 me_arseka_2201.a:0 "欢迎来到[SCOPE.GetRootScope.GetCountry.GetName]！"
 me_arseka_2201.tt:0 "#Y 5#!个#E $massalian$#!文化人口已经定居在#E 萨戈因提乌姆#!，另有#Y 5#!个已定居在[SCOPE.GetRootScope.GetCountry.GetName]各地#!\n$mission_completed_tooltip_1$“#Y $arseka_01_task_22$#!”$mission_completed_tooltip_2$"
 me_arseka_2201_desc:0 "我们与#E 马赛利亚人#!的友好关系为我们带来了巨大的成功，最近居住在[SCOPE.GetRootScope.GetCountry.GetName]的#E 马赛利亚人#!数量显著增加。\n未来他们可能会争取更高的地位。"
 me_arseka_2201_title:0 "马赛利亚移民"
 me_arseka_23.a:0 "这个#Y #E 阿尔塞肯联盟#!#!的所在地自然将是#E 阿尔塞#!"
 me_arseka_23.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_23$#!”$mission_completed_tooltip_2$"
 me_arseka_23_desc:0 "阿尔塞城现在配备了设施，即使是最苛刻的希腊独裁者也会感到羞愧，事实上‘城市’这个词已经不足以形容它了。阿尔塞已经成为一个真正的#Y 大都市#!。新的参议院大楼已经完成最后的装修工作。现在唯一剩下的就是让[ROOT.GetCountry.GetRuler.GetName]撰写一篇演讲，宣布成立#E #Y 阿尔塞肯联盟#!#!，并由[ROOT.GetCountry.GetRuler.GetSheHe]正式宣布阿尔塞将成为同名#E #Y 阿尔塞肯联盟#!#!的所在地，这是提升我们国家地位的一个微小但必要的步骤。"
 me_arseka_23_title:0 "$arseka_01_task_23$"
 me_arseka_24.a:0 "如果你能维持，那就是共和国。"
 me_arseka_24.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_24$#!”$mission_completed_tooltip_2$"
 me_arseka_24_desc:0 "新近成立的阿尔塞卡参议院在宏伟的参议院大厅举行首次会议。许多参议员尚不熟悉议程，似乎不确定自己的角色，紧张地看向同僚。众人落座时，空气中充满期待与不安。[ROOT.GetCountry.GetRuler.GetName]主持大会，并以大胆宣言开启会议：“近来，阿尔塞卡实力激增，其保护延伸至新的土地。阿尔塞卡已经到了抛弃部落根源最后残余的时候，应像希腊人惯常所喜爱的那样，将自身改造为一个同盟。阿尔塞卡必须消亡，#Y 阿尔塞卡同盟#!方能存活。”参议员们认真聆听，有人点头赞同，也有人交换不安眼神。一些参议员对正在演变的治理结构表达担忧，怀疑这种明显处于[ROOT.GetCountry.GetRuler.GetName]领导之下的参议院转变，是否正迈向世袭君主制。一位大胆的参议员问出了许多同僚心中的问题：“那么，[ROOT.GetCountry.GetRuler.GetName]，我们得到的究竟是共和国，还是君主制？”"
 me_arseka_24_title:0 "$arseka_01_task_24$"
 me_arseka_25.a:0 "#E 阿尔塞#!，#E 萨贡图姆#!，只要黄金继续流动，一切都无所谓！"
 me_arseka_25.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_25$#!”$mission_completed_tooltip_2$"
 me_arseka_25_desc:0 "分配给港口#E 萨贡图姆#!的土地面积增加了，并投资扩建其设施。称#E 萨贡图姆#!为港口有些名不副实，因为它已经发展到甚至超过了#E 阿尔塞#!本身。实际上，许多人开始将我们的首都称为#E 萨贡图姆#!而非#E 阿尔塞#!，这一习惯始于商人，但迅速渗透到了各个社会阶层。"
 me_arseka_25_title:0 "$arseka_01_task_25$"
 me_arseka_26.a:0 "或许是时候建立一支真正的海军了？"
 me_arseka_26.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_26$#!”$mission_completed_tooltip_2$"
 me_arseka_26_desc:0 "由于工艺质量，[ROOT.GetCountry.GetAdjective]造船厂近年来需求量大增，因为[ROOT.GetCountry.GetName]现在能够生产用于出口的船只，而不仅仅是国内使用。"
 me_arseka_26_title:0 "$arseka_01_task_26$"
 me_arseka_27.a:0 "总有一天阿尔塞卡将令迦太基黯然失色。"
 me_arseka_27.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_27$#!”$mission_completed_tooltip_2$"
 me_arseka_27_desc:0 "在我们这片世界，除了最富有的国家以外，没有谁能够指望与阿尔塞卡海军匹敌。然而，维持海军代价高昂。我们应该寻找办法，通过商业或不那么体面的手段收回投入……"
 me_arseka_27_title:0 "$arseka_01_task_27$"
 me_arseka_28_title:0 "$arseka_01_task_28$"
 me_arseka_29.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_29$#!”$mission_completed_tooltip_2$"
 me_arseka_29_title:0 "$arseka_01_task_29$"
 me_arseka_2_desc:0 "有传言称，我们的邻居#E 孔忒斯塔尼#!秘密推动我们的厄得塔尼亚同胞去不惜一切代价抵抗统一。证据表明，他们希望利用我们的困境，夺取我们的一部分领土。"
 me_arseka_2_title:0 "孔忒斯塔尼阴谋"
 me_arseka_3.a:0 "我找到了一座木城，而离开时是一座砖城。"
 me_arseka_3.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_3$#!”$mission_completed_tooltip_2$"
 me_arseka_30.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_31$#!”$mission_completed_tooltip_2$"
 me_arseka_30_title:0 "$arseka_01_task_30$"
 me_arseka_31.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_31$#!”$mission_completed_tooltip_2$"
 me_arseka_31_title:0 "$arseka_01_task_31$"
 me_arseka_32.tt:0 "任务'#Y $arseka_01_task_31$ #!'已#G完成#!!"
 me_arseka_32_title:0 "$arseka_01_task_30$"
 me_arseka_33.tt:0 "任务'#Y $arseka_01_task_31$ #!'已#G完成#!!"
 me_arseka_33_title:0 "$arseka_01_task_30$"
 me_arseka_3_desc:0 "今天，[ROOT.GetCountry.GetRuler.GetName]的愿景实现了，阿尔塞经过翻新转变成为一个文化和商业中心。这座城市终于可以与马赛利亚人和布匿人的城市相媲美，尽管光芒仍然略显暗淡。[ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName]在论坛上举办了一场盛大的活动，邀请外国商人见证焕然一新的阿尔塞，并探索共同繁荣的机会，希望最终能与马赛利亚商人谈判达成有利条款。"
 me_arseka_3_title:0 "翻新庆典"
 me_arseka_4.a:0 "非常好。"
 me_arseka_4_desc:0 "在我们的统治下，#E 厄得塔尼亚#!的农业潜力得到了极大的扩展。田野似乎无限延伸，作物随风摇曳，土壤的肥沃预示着丰收的到来。"
 me_arseka_4_title:0 "丰收在望"
 me_arseka_5.a:0 "一切都如我所预见的那样进行。"
 me_arseka_5.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_5$#!”$mission_completed_tooltip_2$"
 me_arseka_5_desc:0 "[ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName]大胆地启动了他们称为#E “埃德科米恩达制度”#!的实施。随着监督者、工头和劳工在这一新制度下汇聚，产业的齿轮开始更有效地转动，预示着[ROOT.GetCountry.GetName]将获得更大的繁荣与稳定。埃德科米恩达制度的成功取决于它能否从我们的土地中榨取最充分的潜力，[ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName]也热切注视着这一变革事业的根基扎下。"
 me_arseka_5_title:0 "埃达庄园的喜悦"
 me_arseka_6.a:0 "#E 厄得塔#!坚不可摧。"
 me_arseka_6.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_6$#!”$mission_completed_tooltip_2$"
 me_arseka_6_desc:0 "我们向厄得塔尼亚人承诺，他们将在我们的统治下安全繁荣；我们信守诺言。在[ROOT.GetCountry.GetRuler.GetTitle] [ROOT.GetCountry.GetRuler.GetFamily.GetName]的精心指导下，#E 厄得塔#!（#E 厄得塔尼亚#!的旧首都）的广泛防御工事已成功完成。这些坚固的建筑现在是我们对#E 厄得塔#!人民安全和繁荣承诺的象征。"
 me_arseka_6_title:0 "厄得塔的坚韧"
 me_arseka_7.a:0 "告诉你的朋友们也来投资吧！"
 me_arseka_7.tt:0 "$mission_completed_tooltip_1$“#Y $arseka_01_task_7$#!”$mission_completed_tooltip_2$"
 me_arseka_7_desc:0 "我们加强沿海邻居#E 赛贝拉奇#!的努力引起了极具影响力的#E 马赛利亚商人#!的注意，他们对我们财政状况有着巨大的影响。认识到有利可图的机会，一群精明的交易商向我们提出了一个建议。他们表示有兴趣投资我们的国家，预计加强贸易关系将带来互利。"
 me_arseka_7_title:0 "$arseka_01_task_7$"

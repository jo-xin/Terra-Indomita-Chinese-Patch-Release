l_simp_chinese:
 ALPINE_FEDERATION:0 "阿尔卑斯联邦"
 ALPINE_FEDERATION_ADJ:0 "阿尔卑斯"
 CAMUNIA:0 "卡穆尼"
 CAMUNIA_ADJ:0 "卡穆尼人"
 EUGANIA:0 "欧加内"
 EUGANIA_ADJ:0 "欧加内人"
 desc_me_alpine_warfare_rae_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetAdjective] 部队利用他们对山区地形的广泛了解，使用高度山地战争特化的战术。"
 desc_me_better_rhaetian_garrisons:0 "这个国家将大量精干的士兵投入到防御中。虽然这需要耗费本可用于经济的人力，但这意味着其防御工事更难攻克。"
 desc_me_celtic_magic_cmod:0 "雷蒂亚部落采纳了周围凯尔特民族的许多宗教习俗，包括他们的迷信和涉及魔法的仪式。"
 desc_me_funneling_raetic_manpower_to_defense_cmod:0 "该国正在将其人力转向边境防御，这意味着它削弱了军队的后备力量。"
 desc_me_impenetrable_alps_cmod:0 "这个国家的山区是敌对国家的噩梦。"
 desc_me_impenetrable_mountain_fort_pmod:0 "这个省份广泛的山地防御，以及层层的陷阱和土方工程，意味着任何试图占领这些防御工事的入侵军队都将面临一场消耗战。"
 desc_me_rae_millitary_shakeup_cmod:0 "这个国家正在进行军事战术改革。虽然从长远来看是有益的，但这意味着它的士兵和总指挥暂时处于混乱和无序状态。"
 desc_me_raetia_westward_expansion_cmod:0 "这个国家已经开始向西扩张到高卢，它的战士们对征服和荣耀的前景充满活力。"
 desc_me_raetic_colonization_of_venetia_pmod:0 "雷蒂亚殖民者正在抵达这个省份，取代了在这里生活了数百年的居民。"
 desc_me_raetic_urbanization_pmod:0 "这座城市的房屋设计符合一定的雷蒂亚标准。融合了意大利南部城市住宅的特色，并采用本土雷蒂亚建筑技术对其进行改造，使其非常适合山区城市人口。"
 desc_me_revamped_rhaetian_fortification_techniques_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 已将凯尔特人的防御方法用于山地防御，效果显著。"
 desc_me_rhaetia_city_defense_pmod:0 "该省在其主要定居点周围修建了一系列城墙。"
 desc_me_rhaetia_foreign_integration_cmod:0 "尽管这个国家的统治文化不是凯尔特文化，但他们与高卢邻居的融合反映出他们社会的良好氛围，这让这个国家的凯尔特居民非常高兴。"
 desc_me_rhaetian_fort_system_pmod:0 "该省进行了一系列防御工程，改善了基础设施，以备进一步的防御工程。"
 desc_me_vindelician_milita_cmod:0 "凯尔特人与 [SCOPE.GetRootScope.GetCountry.GetAdjective] 社会的紧密融合使得一批有能力的战士被招募来对抗联邦的敌人。"
 desc_me_well_seasoned_food_cmod:0 "尽管这个国家本身没有海岸线，但它还是设法通过从亚得里亚海沿岸进口盐来向其公民供应盐，这让其公民非常高兴。"
 descme_a_rhaetian_capital_pmod:0 "这个省份有一座城市，是雷蒂亚人的首都。这座城市建于阿尔卑斯山的高地，雄心勃勃，渴望与塔奎尼亚、维爱、帕塔维乌姆甚至罗马等城市竞争。"
 me_a_rhaetian_capital_pmod:0 "雷蒂亚人的首都"
 me_alpine_warfare_rae_cmod:0 "山地战争"
 me_better_rhaetian_garrisons:0 "优先驻军"
 me_celtic_magic_cmod:0 "凯尔特秘仪"
 me_funneling_raetic_manpower_to_defense_cmod:0 "将人力投入国防"
 me_impenetrable_alps_cmod:0 "难以穿越的山口"
 me_impenetrable_mountain_fort_pmod:0 "险恶的山口"
 me_rae_millitary_shakeup_cmod:0 "军事大变革"
 me_raetia_westward_expansion_cmod:0 "向西扩张"
 me_raetic_colonization_of_venetia_pmod:0 "雷蒂亚殖民者的到来"
 me_raetic_urbanization_pmod:0 "扩建的雷蒂亚房屋"
 me_revamped_rhaetian_fortification_techniques_cmod:0 "改进的防御技术"
 me_rhaetia.25.a:0 "我们希望他们能够接受！"
 me_rhaetia.25.desc:0 "赫尔维蒂人是我们西北部的一个自豪部落，随着我们联盟的扩张，我们与他们有了越来越多的接触。现在我们已经在赫尔维蒂领土上建立了立足点，可以从这里投射 [SCOPE.GetRootScope.GetCountry.GetAdjective] 的力量，我们有一个可以号召当地部落加入我们联盟作为合作伙伴的计划。"
 me_rhaetia.25.t:0 "赫尔维蒂人的忠诚"
 me_rhaetia.26.a:0 "$rhaetian$人是好文明，我们当然会加入"
 me_rhaetia.26.b:0 "我们拒绝被征服！"
 me_rhaetia.26.desc:0 "崛起的雷蒂亚部落终于到达了赫尔维蒂的土地。在该地区建立了稳固的立足点后，他们现在向我们发出邀请，希望我们加入他们的联盟成为附庸。虽然他们看起来确实很强大，但我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]必须决定我们是否应该服从$rhaetian$的统治，或者不惜一切代价优先考虑[SCOPE.GetRootScope.GetCountry.GetAdjective]的主权。"
 me_rhaetia.26.t:0 "雷蒂亚人提供保护"
 me_rhaetia.27.a:0 "啊哈哈…真可惜"
 me_rhaetia.27.desc:0 "虽然我们希望剩余的赫尔维蒂部落能加入我们成为附庸，但似乎其中一个部落粗鲁地拒绝了我们的提议，对我们‘无礼’的效忠要求感到不满。我们不会太惊讶，但这确实意味着现在只能通过武力来控制他们的 $helvetian$ 土地。"
 me_rhaetia.27.t:0 "赫尔维蒂部落拒绝"
 me_rhaetia.28.a:0 "从高山之巅起，降临全世界！"
 me_rhaetia.28.a_tt:0 "#G  #E $rhaetia_alpine_mission_task_18$#! 任务完成!#!\n#E [SCOPE.GetRootScope.GetCountry.GetName]#! 组建了 #E #Y $ALPINE_FEDERATION$#!#!"
 me_rhaetia.28.b:0 "我们依然是雷蒂亚,但是我们会改旗易帜"
 me_rhaetia.28.b_tt:0 "#G #E $rhaetia_alpine_mission_task_18$#! 任务完成!#!\n#E [SCOPE.GetRootScope.GetCountry.GetName]#! 采用了 #E #Y $ALPINE_FEDERATION$ 旗帜#!#!"
 me_rhaetia.28.c:0 "我们联邦的身份依然是雷蒂亚"
 me_rhaetia.28.c_tt:0 "#G #E $rhaetia_alpine_mission_task_18$#! 任务完成!#!\n#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#! 不会成立任何新国家。"
 me_rhaetia.28.desc:0 "我们 $rhaetian$s 长期以来一直被孤立在阿尔卑斯山的一隅，畏惧周围更具侵略性的部落，但现在情况已不再如此。通过鲜血、汗水和外交手段，我们的部落在阿尔卑斯山脉上形成了一个庞大的部落联盟，从高卢边境一直延伸到潘诺尼亚边境，无数凯尔特部落都归我们管辖。阿尔卑斯山脉内部从未出现过这样的国家，我们的家园位于世界其他地方无法触及的高地，这样的国家怎么可能被摧毁？"
 me_rhaetia.28.t:0 "阿尔卑斯山联合起来"
 me_rhaetia.29.a:0 "让我们重建 #E 卡穆尼人#! 和 #E 欧加内人#! "
 me_rhaetia.29.a_tt:0 "#E $CAMUNIA$#! 和 #E $EUGANIA$#! 将被释放为 [SCOPE.GetRootScope.GetCountry.GetAdjective] #E #Y 附庸#!#!"
 me_rhaetia.29.b:0 "这些土地最好直辖。"
 me_rhaetia.29.b_tt:0 "#E #Y $east_insubria_area$#!#! and #E #Y $ferraria_area$#!#! 将继续作为 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的领土"
 me_rhaetia.29.desc:0 "很久以前，据说帕达纳山谷的北部土地上居住着许多不同的 雷蒂亚 部落，其中包括如今 刻诺曼尼亚 的 卡穆尼人部落和 奥赖伊 的 欧加内人部落，随着外来部落涌入这片土地，他们不幸地被遗忘在被时间的长河里。\n\n然而现在，所有这些土地在数百或数千年以来首次再次被雷蒂亚部落控制。我们现在可以建立新的部落来取代曾经失去的部落，或者我们可以继续将这些土地置于我们的直接控制之下......"
 me_rhaetia.29.t:0 "低地的雷蒂亚人"
 me_rhaetia.30.a:0 "我们希望他们能够接受！"
 me_rhaetia.30.desc:0 "可怕的卡尼人部落居住在我们东部边境附近的土地上，是居住在阿尔卑斯山这一角的最后几个尚未加入我们联邦的部落。我们的特使愿意首先寻求外交合作，一直在努力讨好卡尼人，以便他们愿意加入我们的事业，现在我们已向这些部落发出加入雷蒂的提议，希望我们的努力能够得到回报。"
 me_rhaetia.30.t:0 "卡尼人你听我说"
 me_rhaetia.31.a:0 "为什么不，$rhaetian$人是好文明，"
 me_rhaetia.31.b:0 "我们不会被征服。"
 me_rhaetia.31.desc:0 "崛起的雷蒂人部落终于到达了卡尼亚的土地。他们在我们的土地附近扩张，改善了与我们的关系，现在他们向我们发出邀请，希望我们加入他们的联盟成为附庸。虽然他们看起来很强大，但我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] 必须决定我们是否应该服从 $rhaetian$ 的统治，还是优先考虑 [SCOPE.GetRootScope.GetCountry.GetAdjective] 的主权。"
 me_rhaetia.31.t:0 "雷蒂亚人提供保护"
 me_rhaetia.32.a:0 "我们还有别的方式进入卡耳尼亚……"
 me_rhaetia.32.desc:0 "似乎与我们改善关系的$carnian$部落之一拒绝了我们的附庸提议，并嘲笑我们的使者提出的“古怪”要求。虽然我们曾认为我们的良好关系足以说服他们加入我们的阵营，但看来我们错了。"
 me_rhaetia.32.t:0 "卡耳尼亚部落拒绝"
 me_rhaetia.33.a:0 "好耶！"
 me_rhaetia.33.desc:0 "令我们高兴的是，#E 赫尔维蒂#!的一个凯尔特部落已同意加入我们的联邦，成为$rhaetian$的附庸！\n他们肯定不会后悔受到[SCOPE.GetRootScope.GetCountry.GetAdjective]部落的保护，因为我们共同努力，为我们两国人民创造更光明的未来。"
 me_rhaetia.33.t:0 "赫尔维蒂部落同意加入联邦"
 me_rhaetia.34.a:0 "欢迎加入我们的联邦！"
 me_rhaetia.34.desc:0 "令我们高兴的是， #E Carnia#! 的一个凯尔特部落已同意加入我们的联邦成为 $rhaetian$ 的附庸！\n他们肯定不会后悔受到 [SCOPE.GetRootScope.GetCountry.GetAdjective] 部落的保护，因为我们共同努力，为我们两国人民创造更光明的未来。"
 me_rhaetia.34.t:0 "卡耳尼亚部落同意加入联邦"
 me_rhaetia.37.a:0 "这些土地永远属于 [SCOPE.GetRootScope.GetCountry.GetAdjective]"
 me_rhaetia.37.a_tt:0 "#E #Y $rhaetia_alpine_mission_task_25$#!#! 人物已经 #G 完成#!!"
 me_rhaetia.37.desc:0 "帕杜斯河周围的肥沃平原现已完全被我们控制。我们的征战已使雷蒂亚人统治了该地区。最初，我们渴望将我们远方的低地亲戚从凯尔特人和意大利人的统治中解放出来，因此我们进入了一个富饶的地区，那里到处都是肥沃的农田和庄稼。此外，我们还占领了伊特鲁里亚人在该地区建立的城市，伊特鲁里亚人是熟悉的民族，他们的语言对我们来说并不像高卢和威尼斯部落的语言那么陌生。我们为我们的联邦夺取了这片土地，从阿尔卑斯山到伊特鲁里亚人的故乡边境，为雷蒂亚人在这个南部边境重新开始提供了充足的机会。\n已经有许多家庭离开了他们艰苦的山区家园，前往了帕达纳山谷的肥沃土地。\n\n我们伟大联邦的创始人民的未来似乎一片光明。"
 me_rhaetia.37.t:0 "帕达纳河谷的肥沃平原"
 me_rhaetia.37.tt:0 "#E #G 10#!#! #E $rhaetian$#! 人口开始在 #E #Y $cisalpine_gaul_region$#!#! 定居。"
 me_rhaetia.38.a:0 "我们众多部落的意愿应该优先考虑"
 me_rhaetia.38.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将改革为 #E #Y $democratic_republic$#!#!"
 me_rhaetia.38.b:0 "在单一领导人的统治下，我们更加强大"
 me_rhaetia.38.b_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将改革为 #E #Y $aristocratic_monarchy$#!#!"
 me_rhaetia.38.desc:0 "尽管我们的新邦联庞大而强大，但与南方更强大的国家相比，其治理体系却低效且陈旧。我们低效的部落贡品制度意味着邦联有效筹集资金的能力有限，对我们领土的控制也是如此。\n 为了解决这个问题，我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle], [SCOPE.GetRootScope.GetCountry.GetRuler.GetName], 正在努力改革我们国家的官僚机构，并与邦联各地部落的酋长举行会议。\n\n在讨论如何构建这个新政府时，人们关注的焦点是权力是否应该在部落代表之间分配，还是集中在一个主要酋长手中。"
 me_rhaetia.38.t:0 "邦联的治理"
 me_rhaetia_city_defense_pmod:0 "雷蒂亚城墙"
 me_rhaetia_foreign_integration_cmod:0 "凯尔特人的融合"
 me_rhaetian_fort_system_pmod:0 "扩大防御"
 me_vindelician_milita_cmod:0 "招募凯尔特人"
 me_well_seasoned_food_cmod:0 "调味精良的食物"
 rhaetia_alpine_mission:0 "阿尔卑斯山天降伟人"
 rhaetia_alpine_mission_BUTTON_TOOLTIP:0 "雷蒂亚部落将再次遍布阿尔卑斯山脉。"
 rhaetia_alpine_mission_CRITERIA_DESCRIPTION:0 "一旦雷蒂亚将 #E $rhaetia_region$#! 地区统一为 #E 单一联邦#!，并建造了一座文明首都以展现雷蒂亚人的力量，这一任务便会完成。"
 rhaetia_alpine_mission_DESCRIPTION:0 "自人类可以记事以来，神秘莫测的雷蒂亚人的祖先就已经居住在中西欧的阿尔卑斯山地区了。尽管近几千年年来， #E 雷蒂亚部落#!的活动范围已经大大缩水,而他们的表亲民族，欧加内人,已经在几个世纪前基本消失了。如今阿尔卑斯山的雷蒂亚人正遭受来自诺里克山的凯尔特人的袭击，但雷蒂亚语仍然在阿尔卑斯山那些险要的山口苦苦支撑。\n\n不过随着意大利南部中央集权城市国家的崛起, #E 或许雷蒂亚人是时候该开始雄心勃勃的建设了#!。毕竟——如果有什么伟大的国家能从阿尔卑斯山崛起，那也一定只能由我们雷蒂亚人，阿尔卑斯最古老的居民来完成。"
 rhaetia_alpine_mission_task_1:0 "雷蒂亚人的联邦"
 rhaetia_alpine_mission_task_10:0 "致最后的雷蒂亚人"
 rhaetia_alpine_mission_task_10_DESC:0 "我们只是在自己的土地周围修建防御工事，却没有足够的人力来支持这些防御工事，这是不够的。考虑到雷蒂部落的人口相对于我们的邻国来说相对较少，如果我们想要能够配备这样的防御工事，就需要采取严厉的政策。\n如果我们想要保卫自己的土地免受更多民族的侵袭，我们需要每个男人和女人都愿意用生命来保卫我们的边界。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 rhaetia_alpine_mission_task_10_allow_tt_1:0 "在#E #Y $alpes_raetiae_occidentalis$#!#! 地区实施 #Y 2#! 项不同的国家投资"
 rhaetia_alpine_mission_task_10_allow_tt_2:0 "在 #E #Y $alpes_raetiae_occidentalis$#!#! 之外的任何地区实施 #E $state_improvement_military$#! 国家投资"
 rhaetia_alpine_mission_task_10_tt:0 "政策将在 #E [SCOPE.GetRootScope.GetCountry.GetName]#!中通过和标准化，要求更多的 $rhaetian$s 来保卫 #E [SCOPE.GetRootScope.GetCountry.GetAdjective]#! 土地。"
 rhaetia_alpine_mission_task_11:0 "阿尔卑斯战争"
 rhaetia_alpine_mission_task_11_DESC:0 "阿尔卑斯山的山区地形对某些人来说是危险的，但对我们来说，这是我们世世代代习惯的家园。凭借对这片土地的深入了解，我们处于改革战术的最佳位置，充分利用我们祖国的特点，同时将周围部落的军事改革纳入我们的新战略。当然，我们首先需要确保我们所有的部落都同意这样的改革。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 rhaetia_alpine_mission_task_11_allow_tt:0 "没有省份少于 #Y 60#! #E 省份忠诚度#!"
 rhaetia_alpine_mission_task_11_tt:0 "在经历了一些社会动乱之后， #E [SCOPE.GetRootScope.GetCountry.GetName]#! 军队将会发展出适合在 #E 阿尔卑斯山#!进行山地作战的特定战术和武器。"
 rhaetia_alpine_mission_task_12:0 "雷蒂亚城市化"
 rhaetia_alpine_mission_task_12_DESC:0 "我们的首都 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 只是一个小定居点，与我们称霸阿尔卑斯山的野心完全不相称。我们王国的中心需要一座大城市，只有在这一中心的指挥下我们才能做到让雷蒂亚部落称霸阿尔卑斯山。如果我们能从维涅托和伊特鲁里亚等民族的城市中心中汲取灵感，我们一定可以建造与意大利半岛的城市中心相媲美的城市。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 rhaetia_alpine_mission_task_13:0 "雷蒂亚住房"
 rhaetia_alpine_mission_task_13_DESC:0 "雷蒂亚人长期以来一直拥有某些建造住房的方法，这些方法独特地适应了阿尔卑斯山严酷的冬季景观，使我们的人民能够在这种气候下茁壮成长。相比之下，意大利人采用的城市建设方法虽然允许大量城市居民居住，但却不适合阿尔卑斯山，无法移植到我们位于 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 的新山区城市。如果我们要建造合适的城市住宅，那么最好设计新的城市住房标准，将我们传统的雷蒂亚房屋的建筑与意大利人的高容量建筑相结合。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 rhaetia_alpine_mission_task_13_tt:0 "#E $rhaetian$#! 的房屋建造方法将得到改进和标准化，从而允许在 #E #Y [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!#! 城市中传播独特的 #E [SCOPE.GetRootScope.GetCountry.GetAdjective]#! "
 rhaetia_alpine_mission_task_14:0 "征服勒蓬蒂人"
 rhaetia_alpine_mission_task_14_DESC:0 "山南高卢人是一支可怕的民族，他们征服并同化了古老的勒蓬蒂人，他们的凯尔特部落还征服了帕达纳（Padana）山谷的伊特鲁里亚城市，并粉碎了该地区的雷蒂亚-欧加内人和卡穆尼人。但在我们西部的山区，仍有一些居住在阿尔卑斯山的勒蓬蒂人。我们应该将他们的土地纳入我们的联邦，并利用他们的军事能力。\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 rhaetia_alpine_mission_task_14_allow_tt_1:0 "#E $LPO$#! 的土地已被完全 #E 征服#!，并且 #E #Y $LPO$#!#! 不再 #E 存在#!"
 rhaetia_alpine_mission_task_14_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得对  #E #Y $helvetia_inferioris_area$#!#!, #E #Y $helvetia_superioris_area$#!#!, #E #Y $tigurinia_area$#!#! 和 #E #Y $alpes_graiae_area$#!#! 的宣称"
 rhaetia_alpine_mission_task_15:0 "诺里库姆阿尔卑斯"
 rhaetia_alpine_mission_task_15_DESC:0 "诺里库姆凯尔特人的阿尔卑斯山土地位于我们东部。凶猛而好战的诺里基人曾多次从他们的古老家园袭击我们的土地，他们是现在围绕着我们的凯尔特人最古老的居住地。除了他们的实力之外，他们的土地还因其丰富的矿藏而闻名，诺里克人擅长利用该地区丰富的铁矿来制造他们著名的钢铁。如果我们要统治该地区，诺里克阿尔卑斯山必须落入雷蒂克的控制之下。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 rhaetia_alpine_mission_task_15_allow_tt:0 "所有的 #Y $alpes_raetiae_orientalis$#! 都已经被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 统治"
 rhaetia_alpine_mission_task_15_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将会得到整个 #E #Y $helvetia_orientalis_area$#!#! 的宣称"
 rhaetia_alpine_mission_task_16:0 "西部的赫尔维蒂人"
 rhaetia_alpine_mission_task_16_DESC:0 "像我们一样，赫尔维蒂人也是一支骄傲的阿尔卑斯山民族。赫尔维蒂人远离我们的首都，在阿尔卑斯山的这片地区防御严密，对他们发动军事远征可能会付出高昂代价。不过，如果我们只是在该地区建立定居点，展示我们的实力，我们也许能够说服西部的赫尔维蒂部落自愿加入我们的联邦。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 rhaetia_alpine_mission_task_16_allow_tt_1:0 "在 #E #Y $helvetia_inferioris_area$#!#!,  #E #Y $helvetia_superioris_area$#!#! 或是 #E #Y $tigurinia_area$#!#! 拥有至少一个省份。"
 rhaetia_alpine_mission_task_16_allow_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!在核心赫尔维蒂土地内至少拥有#Y 1#!个#E #Y $helvetian$#!#!#E 文化#!邻国，且这些邻国对#E [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感度至少为#Y 90#!点"
 rhaetia_alpine_mission_task_16_allow_tt_3:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!已经征服了所有的 #Y $helvetia_inferioris_area$#!, #Y $helvetia_superioris_area$#! 与 #Y $tigurinia_area$#!。"
 rhaetia_alpine_mission_task_16_tt:0 "任何在#Y 雷蒂亚#! 地区对#E [SCOPE.GetRootScope.GetCountry.GetName]#! 有 #G 正面#! 关系的 #E #Y $helvetian$#!#! 国家,都将会收到成为#E [SCOPE.GetRootScope.GetCountry.GetName]#! #E #Y $feudatory$#!#! 的邀请"
 rhaetia_alpine_mission_task_17:0 "河畔诺里库姆"
 rhaetia_alpine_mission_task_17_DESC:0 "诺里库姆的北部低地非常诱人。这里位于波罗的海贸易路线进入阿尔卑斯山之前的停顿处，是一个拥有大量商业机会的地方，因此该地区经常遭受来自凯尔特人和日耳曼部落的袭击。我们明智的做法是占领该地区，并获取随之而来的财富。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 rhaetia_alpine_mission_task_17_allow_tt:0 "所有 #E #Y $helvetia_orientalis_area$#!#! 都被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有"
 rhaetia_alpine_mission_task_17_tt:0 "征服 #E $helvetia_orientalis_area$#! 地区将被视为 #E [SCOPE.GetRootScope.GetCountry.GetAdjective] 人民#!的伟大胜利！ 给 [SCOPE.GetRootScope.GetCountry.GetName] 的统治者带来 #E popularity#!。"
 rhaetia_alpine_mission_task_18:0 "阿尔卑斯联邦"
 rhaetia_alpine_mission_task_18_DESC:0 "我们的雷蒂亚国家已经超越了我们卑微的起源，将阿尔卑斯山各地的各个部落纳入我们的单一联邦。只要我们继续扩张，我们最终就能宣布我们的雷蒂亚部落为庞大的阿尔卑斯联邦的首领，从阿尔卑斯山的一端延伸到另一端！\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 rhaetia_alpine_mission_task_18_allow_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有至少 #Y 65#! #E 领土#! 在 #E #Y $rhaetia_region$#!#! #E 地区#!"
 rhaetia_alpine_mission_task_18_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 系那个被合并到 #E #Y $ALPINE_FEDERATION$#!#!.\n #E $ALPINE_FEDERATION$#! 将会宣称 #E #Y $rhaetia_region$#! 地区#! 的剩余部分。"
 rhaetia_alpine_mission_task_18_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将会获得对 #E #Y $alpes_maritimae_two_area$#!#!, #E #Y $transpadana_area$#!#!, #E #Y $west_insubria_area$#!#! 和 #E #Y $aemilla_area$#!#!的宣称权"
 rhaetia_alpine_mission_task_18_tt_3:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将收到一个事件来改革他们的 #E #T 政府#!#!"
 rhaetia_alpine_mission_task_19:0 "坚不可摧的山脉"
 rhaetia_alpine_mission_task_19_DESC:0 "我们的大雷蒂亚邦联是一个受到阿尔卑斯山安全保护的国家，但它还不是无懈可击的。许多阿尔卑斯山隘口仍然允许可能试图摧毁我们的敌对军队通过。只有封锁所有剩余的进入我们阿尔卑斯山家园的隘口，并让这些隘口对任何敌对势力来说尽可能危险，我们才能保证我们的阿尔卑斯山国家能像建造起它的石头一样坚不可摧。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 rhaetia_alpine_mission_task_19_allow_tt_1:0 "一座 #E fortress#! 已经在 #E #Y [GetProvince('(int32)3661').GetName]#!#!, #E #Y [GetProvince('(int32)3660').GetName]#!#! or #E #Y [GetProvince('(int32)3659').GetName]#!#!建成"
 rhaetia_alpine_mission_task_19_allow_tt_2:0 "一座 #E 堡垒#! 已经在 #E #Y [GetProvince('(int32)3667').GetName]#!#! 或 #E #Y [GetProvince('(int32)3668').GetName]#!#! 建造"
 rhaetia_alpine_mission_task_19_allow_tt_3:0 "一座 #E 堡垒#! 已经在 #E #Y [GetProvince('(int32)3657').GetName]#!#! 或 #E #Y [GetProvince('(int32)3618').GetName]#!#! 建造"
 rhaetia_alpine_mission_task_19_allow_tt_4:0 "一座 #E 堡垒#! 已经在 #E #Y [GetProvince('(int32)3611').GetName]#!#! 建造"
 rhaetia_alpine_mission_task_19_allow_tt_5:0 "一座 #E 堡垒#! 已经在 #E #Y [GetProvince('(int32)3538').GetName]#!#! 或 #E #Y [GetProvince('(int32)3608').GetName]#!#! 建造"
 rhaetia_alpine_mission_task_19_allow_tt_6:0 "一座 #E 堡垒#! 已经在 #E #Y [GetProvince('(int32)3614').GetName]#!#! 建造"
 rhaetia_alpine_mission_task_19_tt_1:0 "将在 #E #Y $rhaetia_region$#!#! 地区修建大规模防御工事，使阿尔卑斯山脉几乎无法被敌军逾越。"
 rhaetia_alpine_mission_task_19_tt_2:0 "随着大多数现有防御工事得到极大加固，所有#E #Y $rhaetia_region$#!#! 地区的 #E 山区#! 堡垒将会得到如下修正:"
 rhaetia_alpine_mission_task_1_DESC:0 "长期以来，雷蒂亚部落一直居住在阿尔卑斯山脉的这片土地上，几个世纪以来，我们目睹了周围土地的诸多变化。然而，随着周边土地上新兴力量的扩张，我们$rhaetian$也许是时候整合整合诸部落，同时向外寻找新的机会来增强我们雷蒂亚人的力量，以免我们沦为更具侵略性的邻居的牺牲品。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 rhaetia_alpine_mission_task_1_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得整个 #Y #E $alpes_raetiae_occidentalis$#!#! 的宣称。"
 rhaetia_alpine_mission_task_2:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]周边防御"
 rhaetia_alpine_mission_task_20:0 "欧加内旧土"
 rhaetia_alpine_mission_task_20_DESC:0 "帕达纳（Padana）山谷如今是利古里亚人和维内蒂沿岸的山南高卢部落的角力场，但很久以前，这里也是雷蒂亚部落的领地。据说，在该地区的一些农村地区，仍然可以听到一些部落的雷蒂亚语。如果我们要为我们的同胞伸张正义，我们必须夺回被征服部落的土地。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 rhaetia_alpine_mission_task_20_allow_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 控制着#E #Y $east_insubria_area$#!#! #E 地区#!的大部分 #Y 雷蒂亚人#! 土地 "
 rhaetia_alpine_mission_task_20_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得对剩余 #E #Y $east_insubria_area$#!#!, 以及 #E #Y $ferraria_area$#!#! 的宣称。"
 rhaetia_alpine_mission_task_21:0 "维涅提亚的海盐"
 rhaetia_alpine_mission_task_21_DESC:0 "虽然我们的阿尔卑斯山家园有很多优势，但有一个缺点就是山区家园提供的食物味道平淡。幸运的是，我们与南部的维内蒂人的贸易网络​​为我们提供了解决方案。维涅提亚人位于亚得里亚海沿岸，拥有丰富的盐资源。通过贸易，这种商品可以很容易地进入我们的库存，并最终成为我们的饭菜。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 rhaetia_alpine_mission_task_21_allow_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 正在从从 #E #Y $VNT$#!#!进口 #E $salt$#!"
 rhaetia_alpine_mission_task_21_allow_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 在 #E #Y $venetia_area$#!#! 或是 #E #Y $ferraria_area$#!#!控制了至少 #Y 2#! 处 #E $salt$#! 产地 #E territories#!"
 rhaetia_alpine_mission_task_21_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 的公民将非常高兴能够获得更多调味品！为 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 提供以下修正："
 rhaetia_alpine_mission_task_22:0 "波河平原上的部落"
 rhaetia_alpine_mission_task_22_DESC:0 "凭借帕达纳山谷的稳固立足点，我们现在拥有了欧加内人和卡穆尼人的许多土地。如今，尤加内山丘，据说曾经是雷蒂亚部落的人口稠密的堡垒，以及卡穆尼人的家园，都在我们的掌握之中。随着我们的崛起，该地区早已被摧毁的古老部落不必再被遗忘在历史中。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 rhaetia_alpine_mission_task_22_allow_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有 #E #Y [GetProvince('(int32)3595').GetName]#!#!"
 rhaetia_alpine_mission_task_22_allow_2:0 "#E $VNT$#! 在 #E #Y $ferraria_area$#!#! #E 地区#! #E 没有#! 领土"
 rhaetia_alpine_mission_task_22_allow_3:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有 #E #Y [GetProvince('(int32)3582').GetName]#!#!"
 rhaetia_alpine_mission_task_22_allow_4:0 "#E $CNM$#! 在#E #Y $east_insubria_area$#!#! #E 地区#! #E 没有#! 领土"
 rhaetia_alpine_mission_task_22_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得一个选项，释放在帕达纳山谷的古老的 #Y 雷蒂亚#! 部落作为 #E #Y $feudatory$#! 附庸#!"
 rhaetia_alpine_mission_task_23:0 "殖民帕达纳"
 rhaetia_alpine_mission_task_23_DESC:0 "几个世纪前，甚至在凯尔特人入侵之前，据说意大利人涌入意大利半岛，摧毁了所有反对他们的部落。这些人曾经是我们祖先的雷蒂亚亲戚，曾经居住在现在由维内蒂人和凯尔特人定居的土地上。然而现在，我们已经崛起，让雷蒂亚部落在该地区占据主导地位。如果我们征服这些民族，就像他们征服他们之前的部落一样，我们可以派遣部落定居者用我们自己的民族淹没帕丹山谷的土地，并确保雷蒂亚的名字再次在整个帕达纳地区响彻！\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 rhaetia_alpine_mission_task_23_allow_tt_1:0 "所有的 #E #Y $venetia_area$#!#! 被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 或者他们的 #E 附属国#! 拥有"
 rhaetia_alpine_mission_task_23_allow_tt_2:0 "所有的 #E #Y $ferraria_area$#!#! 被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 或者他们的 #E 附属国#! 拥有"
 rhaetia_alpine_mission_task_23_allow_tt_3:0 "所有的 #E #Y $east_insubria_area$#!#! 被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 或者他们的 #E 附属国#! 拥有"
 rhaetia_alpine_mission_task_23_tt:0 "#E $rhaetian$ 殖民者#! 将涌向从外来部落解放出来的土地，在#E #Y $ferraria_area$#!#!, #E #Y $east_insubria_area$#!#!, #E #Y $west_insubria_area$#!#! and #E #Y $venetia_area$#!#! 的每个省份都有 #Y 1#!现有人口转向 #E #Y $rhaetian$#!#! 文化，并且每个省份将获得以下修正："
 rhaetia_alpine_mission_task_23_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得对 #E #Y $noricum_mediterranum_area$#!#! 地区的宣称。"
 rhaetia_alpine_mission_task_24:0 "拉托比基亚的卡耳尼亚人"
 rhaetia_alpine_mission_task_24_DESC:0 "当我们抵达东阿尔卑斯的边陲时，眼前只剩下最后一个阻挡在潘诺尼亚平原之前的凯尔特部族——凶悍的卡尔尼人。与这些山地战士爆发冲突或许并非上策，尤其是在首次接触之时。然而，如果能与他们建立良好的关系，或许我们还有机会说服他们，认识到加入我们联邦的好处。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 rhaetia_alpine_mission_task_24_allow_tt_1:0 "在#E #Y $noricum_mediterranum_area$#!#! #E 地区#! 至少有 #Y 1#! 接壤的 #E #Y $carnian$#!#! 文化的 #E 国家#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 有超过 #Y 90#!的关系"
 rhaetia_alpine_mission_task_24_allow_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 完全控制了 #E #Y $noricum_mediterranum_area$#!#! 地区"
 rhaetia_alpine_mission_task_24_tt:0 "任何位于#E #Y $noricum_mediterranum_area$#!#! #E 地区#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 保持 #G 正面#!关系的 #E #Y $carnian$#!#!  国家都将收到成为 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的 #E #Y $feudatory$#!#! 的邀请"
 rhaetia_alpine_mission_task_25:0 "巩固帕达纳山谷"
 rhaetia_alpine_mission_task_25_DESC:0 "为了保护该地区失散多年的亲人，我们的联盟已经深入帕达纳山谷。然而，虽然我们的控制只是部分，但我们仍然容易受到当地高卢部落的攻击。我们必须巩固我们在该地区的控制，以便更好地鼓励 雷蒂亚定居者建立他们的殖民地。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 rhaetia_alpine_mission_task_25_allow_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 已经征服了正与的 #E 勒蓬蒂-帕达纳山谷#! (也就是 #Y $west_insubria_area$#!, #Y $transpadana_area$#! #Y $aemilla_area$#! 地区)。"
 rhaetia_alpine_mission_task_25_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得 #E #Y $cisalpine_gaul_region$#!#! 未征服地区的宣称"
 rhaetia_alpine_mission_task_25_tt_2:0 "#E #G 10#!#! #E $rhaetian$ 定居者#! 将会遍布 #E [SCOPE.GetRootScope.GetCountry.GetAdjective]#! 的 #E #Y $cisalpine_gaul_region$#!#! 土地。"
 rhaetia_alpine_mission_task_26:0 "越过阿尔卑斯"
 rhaetia_alpine_mission_task_26_DESC:0 "随着阿尔卑斯山融入我们的联盟，我们比以往任何时候都更加强大。凭借我们新发现的力量，我们将目光投向西方，面对分裂、争吵不休的部落。一旦我们南部的阿尔卑斯山土地的最后一片残余被处理好，我们将准备好走出我们的山脉，进入高卢。\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 rhaetia_alpine_mission_task_26_allow_tt:0 "所有 #E #Y $alpes_maritimae_two_area$#!#! 被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有"
 rhaetia_alpine_mission_task_26_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将会获得 #E #Y $narbonensis_occidentalis_area$#!#!, #E #Y $allobrogia_area$#!#!, #E #Y $sequania_area$#!#!, #E #Y $narbonensis_centralis_area$#!#! 和 #E #Y $celtica_orientalis_area$#!#! 的宣称"
 rhaetia_alpine_mission_task_2_DESC:0 "尽管位于山口中间，我们的首都防御却依旧薄弱，无法抵御那些不畏惧我们严酷国土的敌人。这种情况必须被纠正——只需稍稍投资来加强我们当地的防御即可。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 rhaetia_alpine_mission_task_2_tt:0 "我们位于#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!首都定居点周围的防御将得到极大改善，并给予以下修正："
 rhaetia_alpine_mission_task_3:0 "封锁西部关隘"
 rhaetia_alpine_mission_task_3_DESC:0 "在寻求保护我们核心领土的过程中，我们注意到我们的防御存在严重漏洞——通往雷蒂亚领土的西部通道敞开着，这意味着任何得知这一情况的大型军队都可能通过这里相对轻松地征服我们的人民。如果我们要确保自己的地位，就必须建造防御工事来封锁通道。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 rhaetia_alpine_mission_task_3_allow_tt_1:0 "已经在#E #Y [GetProvince('(int32)3656').GetName]#!#!或是#E #Y [GetProvince('(int32)3657').GetName]#!#!建立了#E 一座堡垒#!"
 rhaetia_alpine_mission_task_3_tt:0 "根据建造堡垒的领土，#E [GetProvince('(int32)3656').GetName]#!或者#E [GetProvince('(int32)3657').GetName]#!将获得以下修正："
 rhaetia_alpine_mission_task_4:0 "巩固南方"
 rhaetia_alpine_mission_task_4_DESC:0 "帕达纳（Padana）山谷南部地区最近被高卢部落占领，该地区一些我们原本的同胞也因此消失了。虽然我们避开了这次猛攻，但考虑到我们天然的防御位置，封锁通往首都​​的南部通道仍然是明智之举，这样可以确保没有任何山南部落将我们的土地视为进一步扩张的潜在目标。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 rhaetia_alpine_mission_task_4_allow_tt_1:0 "已经在#E #Y [GetProvince('(int32)3661').GetName]#!#!，或#E #Y [GetProvince('(int32)3660').GetName]#!#!又或者#E #Y [GetProvince('(int32)3659').GetName]#!#!建造了一座#E 堡垒#!"
 rhaetia_alpine_mission_task_4_tt:0 "根据建造堡垒的领土，#E [GetProvince('(int32)3661').GetName]#!或#E [GetProvince('(int32)3660').GetName]#!将获得以下修正："
 rhaetia_alpine_mission_task_5:0 "巩固雷蒂亚"
 rhaetia_alpine_mission_task_5_DESC:0 "虽然在过去几个世纪中，我们设法躲过了凯尔特人的袭击，但雷蒂亚部落的土地还是略有缩减。如果我们要巩固统一的雷蒂亚基地以进一步扩张，我们就应该主动出击向外推进，先发制人打击周围的部落。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 rhaetia_alpine_mission_task_5_allow_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!在#E #Y $alpes_raetiae_occidentalis$#!#!至少拥有#Y 10#!领土"
 rhaetia_alpine_mission_task_5_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#E #Y $vindelician$#!地区#!，以及#E #Y $alpes_raetiae_orientalis$#!#!的宣称，并且将获得在#E #Y $east_insubria_area$#!#!#E 地区#!的#E #Y 雷蒂亚人#!#!土地的宣称"
 rhaetia_alpine_mission_task_5_tt_2:0 "雷蒂亚诸部落将合并为一个联邦,并且#E [SCOPE.GetRootScope.GetCountry.GetName]#!将会成为#E #Y $tribal_federation$#!#!"
 rhaetia_alpine_mission_task_6:0 "进入温德利西亚的土地"
 rhaetia_alpine_mission_task_6_DESC:0 "如果说有哪个凯尔特部落是我们最熟悉的，那莫过于温德利西亚人了，我们雷蒂亚人与温德利西亚人之间的纽带是那样的稳固——以至于如果我们不接纳这些凯尔特人，雷蒂亚人国家哪怕再大都显得不完整。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 rhaetia_alpine_mission_task_6_allow_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!在#E #Y $helvetia_superioris_area$#!#!或者#E #Y $tulingia_area$#!#!拥有至少#Y 8#!领土"
 rhaetia_alpine_mission_task_6_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将会得到#E #Y $LPO$#!#!的宣称"
 rhaetia_alpine_mission_task_7:0 "与温德利西亚人混居"
 rhaetia_alpine_mission_task_7_DESC:0 "文得里西人的习俗与我们自己的习俗几乎没有什么区别，我们与这些凯尔特人的家族纽带使他们成为我们联邦不可分割的一部分。因此，他们的部落应该立即完全融入我们的联邦！\n此外，接受这些凯尔特人群体肯定也会让其他更远的部落感到高兴……\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 rhaetia_alpine_mission_task_7_allow_tt_1:0 "#E $vindelician$#!文化已经获得#Y $right_of_marriage$#!、#Y $inheritance_right$#!和#Y $right_to_enter_contracts$#!文化权利，或已经被#Y 整合#!。"
 rhaetia_alpine_mission_task_7_tt:0 "如果#E $vindelician$#!尚未被整合，#E #Y $vindelician$#!#!将成为#E [SCOPE.GetRootScope.GetCountry.GetName]#!的#Y 已整合文化#!"
 rhaetia_alpine_mission_task_8:0 "凯尔特秘仪"
 rhaetia_alpine_mission_task_8_DESC:0 "凯尔特文化的一个方面让我们非常着迷，那就是他们在仪式中使用魔法。虽然我们已经分享了许多做法，但到​​目前为止，这一做法尚未通过我们自己的崇拜而传播。这种魔法的好处有多大？它是如何实践的？\n我们应该采用这些迷人的做法，充分利用我们凯尔特兄弟的智慧。\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 rhaetia_alpine_mission_task_8_allow_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!万神殿里#Y 至少有2个#!来自#E #Y $druidism$#!#!的神明"
 rhaetia_alpine_mission_task_8_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!将更进一步采用#E #Y $druidism$#!#!宗教的习俗，这将给予#E [SCOPE.GetRootScope.GetCountry.GetName]#!如下修正"
 rhaetia_alpine_mission_task_9:0 "山堡技术"
 rhaetia_alpine_mission_task_9_DESC:0 "在寻找保护我们古老家园完整性的方法时，我们可以再次从凯尔特邻居的方法中汲取灵感。他们似乎充分利用了他们的山堡来防御领土，而这些方法似乎很容易被我们自己采用。虽然这些技术专门用于在平坦的土地上建造堡垒，但如果将这些技术与我们现有的阿尔卑斯山生活建筑方法相结合，我们应该能够建造出最适合防御山区地形的防御结构。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 rhaetia_alpine_mission_task_9_allow_tt_1:0 "在 #Y $alpes_raetiae_occidentalis$#! 地区进行了 #E $state_improvement_military$#! 国家投资"
 rhaetia_alpine_mission_task_9_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将采用建造凯尔特 #E 山堡#! 的许多技术作为自己的防御结构, 并将它们与现有的 #E [SCOPE.GetRootScope.GetCountry.GetAdjective]#! 方法相结合，以构建最佳的山地防御结构。"

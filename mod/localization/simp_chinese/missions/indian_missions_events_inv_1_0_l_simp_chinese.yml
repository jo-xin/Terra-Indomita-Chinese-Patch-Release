 me_indian_empire.1.a:0 "荣耀属于印度！"
 me_indian_empire.1.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_empire_mission_task_1$#!' $mission_completed_tooltip_2$"
 me_indian_empire.1.desc:0 "我们已经建立了印度帝国！我们现在是一个真正的大国，在财富和实力上是任何其他国家无法比拟的。"
 me_indian_empire.1.t:0 "$indian_empire_mission_task_1$"
 me_indian_empire.2.a:0 "我们的首都是宏伟的。"
 me_indian_empire.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_empire_mission_task_2$#!' $mission_completed_tooltip_2$"
 me_indian_empire.2.desc:0 "我们的首都现在是一个真正的帝国大都市，是世界上有史以来最伟大的希腊化定居点。它可以与雅典、亚历山大甚至巴比伦本身相媲美。"
 me_indian_empire.2.t:0 "$indian_empire_mission_task_2$"
 me_indian_empire.3.a:0 "荣耀归于马哈拉吉亚斯！"
 me_indian_empire.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_empire_mission_task_3$#!' $mission_completed_tooltip_2$"
 me_indian_empire.3.desc:0 "我们宽宏大量的领袖将在他们庄严的统治下带领我们走向未来。"

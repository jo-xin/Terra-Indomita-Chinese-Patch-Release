l_simp_chinese:
 me_india_01_gandara.1.a:0 "也许我们需要改变领导层？"
 me_india_01_gandara.1.desc:0 "一个新的人物来到了印度-希腊宫廷，他有着令人钦佩的技能和一个小的但不断增长的追随者。有些人认为他可能比现任的巴西琉斯更适合统治我们的国家。"
 me_india_01_gandara.1.t:0 "$indian_mission_01_gandara_task_1$ - 宫廷中的新人物"
 me_india_01_gandara.10.a:0 "这是一个伟大的新希腊定居点的开始。"
 me_india_01_gandara.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_8$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.10.desc:0 "[GetProvince('(int32)7485').GetName]现在是一个大型、繁华的希腊城市。"
 me_india_01_gandara.10.t:0 "$indian_mission_01_gandara_task_8$"
 me_india_01_gandara.11.a:0 "摩利人将在一段时间内适应这一点。"
 me_india_01_gandara.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_9$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.11.desc:0 "摩利人的首都已经被改造成希腊化的城市，拥有希腊化的街道布局和建筑。"
 me_india_01_gandara.11.t:0 "$indian_mission_01_gandara_task_9$"
 me_india_01_gandara.12.a:0 "我们的王国壮大而繁荣。"
 me_india_01_gandara.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_10$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.12.desc:0 "潘多卢姆省已经建立并作为我们的首都。它将成为印度-希腊王国的文化、经济和政治中心。"
 me_india_01_gandara.12.t:0 "$indian_mission_01_gandara_task_10$"
 me_india_01_gandara.13.a:0 "犍陀罗的未来是光明的。"
 me_india_01_gandara.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_11$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.13.desc:0 "犍陀罗已经得到了极大的建设和改善。新的寺庙、学习中心和寺院已经建成，位于这里的古代城市的基础设施也得到了改善。在我们的赞助下，犍陀罗将会繁荣起来。"
 me_india_01_gandara.13.t:0 "$indian_mission_01_gandara_task_11$"
 me_india_01_gandara.14.a:0 "这将为我们的科技进步带来益处。"
 me_india_01_gandara.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_12$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.14.desc:0 "[GetProvince('(int32)7314').GetName]大学得到了极大的扩大和美化，这也带动了城市的发展。它将成为亚洲最大的学习中心。"
 me_india_01_gandara.14.t:0 "$indian_mission_01_gandara_task_12$"
 me_india_01_gandara.15.a:0 "愿部刻法利亚和尼西亚繁荣。"
 me_india_01_gandara.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_13$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.15.desc:0 "双子亚历山大城已经扩建，在未来的岁月里将能够接纳许多新的定居者和居民。"
 me_india_01_gandara.15.t:0 "$indian_mission_01_gandara_task_13$"
 me_india_01_gandara.16.a:0 "非常好。"
 me_india_01_gandara.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_14$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.16.desc:0 "我们在[GetProvince('(int32)4300').GetName]建造了一座新的宫殿，这座城市将作为我们的次要首都，并作为印度和巴克特里亚之间的重要中转站。"
 me_india_01_gandara.16.t:0 "$indian_mission_01_gandara_task_14$"
 me_india_01_gandara.17.a:0 "每一点防御都有帮助。"
 me_india_01_gandara.17.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_15$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.17.desc:0 "我们在通往犍陀罗的道路上建造了不少防御设施，使任何潜在的攻击者更难通过阿里安山脉进入我们的中心地带。"
 me_india_01_gandara.17.t:0 "$indian_mission_01_gandara_task_15$"
 me_india_01_gandara.18.a:0 "犍陀罗已被牢固地确立为我们王国的下一个主要省份。"
 me_india_01_gandara.18.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_16$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.18.desc:0 "犍陀罗省已经在新的印度-希腊管理方式下重建。它的财富和美景将是我们的邻居和敌人所羡慕的。"
 me_india_01_gandara.18.t:0 "$indian_mission_01_gandara_task_16$"
 me_india_01_gandara.19.a:0 "我们的王国继续扩大规模。"
 me_india_01_gandara.19.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_17$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.19.desc:0 "我们已经控制了印度河主支流周围的土地，最终将我们的王国与海洋连接起来。这将开辟有利可图的新贸易机会。"
 me_india_01_gandara.19.t:0 "$indian_mission_01_gandara_task_17$"
 me_india_01_gandara.2.a:0 "印度需要新的领导者。"
 me_india_01_gandara.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_1$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.2.b:0 "我们对我们目前的统治者感到满意。"
 me_india_01_gandara.2.b.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_1$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.2.desc:0 "在他进宫的短短几周内，米南德-欧特希米德的地位不断崛起，权势不断增强。他给我们王室的许多成员留下了深刻的印象，现在有一个庞大的、声势浩大的运动，要让他成为我们的新巴西琉斯。"
 me_india_01_gandara.2.t:0 "$indian_mission_01_gandara_task_1$--印度的新领导者？"
 me_india_01_gandara.20.a:0 "这将是一个伟大城市的开始。"
 me_india_01_gandara.20.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_18$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.20.desc:0 "[GetProvince('(int32)4371').GetName]已经开始迅速发展，毫无疑问，它将成为我们王国最大和最重要的定居点之一。"
 me_india_01_gandara.20.t:0 "$indian_mission_01_gandara_task_18$"
 me_india_01_gandara.21.a:0 "财富流入我们的王国。"
 me_india_01_gandara.21.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_19$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.21.desc:0 "我们在印度河洪泛区的许多城市建造了新的市场，并扩大了这一地区的商业和农业潜力。我们将在短时间内看到这项投资带来的好处。"
 me_india_01_gandara.21.t:0 "$indian_mission_01_gandara_task_19$"
 me_india_01_gandara.22.a:0 "我们王国的未来是光明的。"
 me_india_01_gandara.22.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_20$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.22.desc:0 "随着[GetProvince('(int32)6821').GetName]作为主要港口城市的建立，我们的王国已经向许多新的贸易路线开放。印度河无疑将成为我们王国的尼罗河，而我们的港口也拥有‘亚历山大’这个名字，这是非常合适的。"
 me_india_01_gandara.22.t:0 "$indian_mission_01_gandara_task_20$"
 me_india_01_gandara.23.a:0 "这将是一个伟大城市的开始。"
 me_india_01_gandara.23.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_21$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.23.desc:0 "[GetProvince('(int32)6815').GetName] 已被重新建立作为一个希腊城市，拥有新的希腊化名称。由于它与[GetProvince('(int32)6821').GetName]港口直接相连，帕塔勒涅省的首府将迅速发展。"
 me_india_01_gandara.23.t:0 "$indian_mission_01_gandara_task_21$"
 me_india_01_gandara.24.a:0 "非常好。"
 me_india_01_gandara.24.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_22$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.24.desc:0 "新的印度省份已经建立，它拥有着印度河的财富和我们的新港口。现在，我们的商人、贸易商和军队在印度河上下游的旅行完全不受阻碍了。"
 me_india_01_gandara.24.t:0 "$indian_mission_01_gandara_task_22$"
 me_india_01_gandara.25.a:0 "他们中的每一个人都将得到很好的照顾和赞助。"
 me_india_01_gandara.25.desc:0 "我们已经派出使者，向[GetProvince('(int32)416').GetArea.GetRegion.GetName]、[GetProvince('(int32)379').GetArea.GetRegion.GetName]、[GetProvince('(int32)84').GetArea.GetRegion.GetName]、[GetProvince('(int32)350').GetArea.GetRegion.GetName]和[GetProvince('(int32)290').GetArea.GetRegion.GetName]的希腊定居者发出呼吁。他们在地中海各地建立殖民地的历史源远流长，我们希望这个提议能吸引他们中的许多人到我们[GetProvince('(int32)4340').GetArea.GetRegion.GetName]的城市定居。"
 me_india_01_gandara.25.t:0 "$indian_mission_01_gandara_task_23$--提议"
 me_india_01_gandara.26.a:0 "定居者是无价之宝。"
 me_india_01_gandara.26.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_23$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.26.desc:0 "我们已经看到大量的新定居者涌入我们的几个城市，准备在我们的统治下服务，提供税收和人力。随着忠诚的希腊定居者穿插在当地人之间，我们肯定会在任何潜在的动乱发生之前进行补救。"
 me_india_01_gandara.26.t:0 "$indian_mission_01_gandara_task_23$"
 me_india_01_gandara.27.a:0 "定居者是无价之宝。"
 me_india_01_gandara.27.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_23$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.27.desc:0 "我们看到大量的新移民涌入我们的几个城市，准备在我们的统治下服务，提供税收和征税。随着忠诚的希腊定居者穿插在当地人中间，我们肯定会在任何潜在的动乱和叛乱发生之前进行补救。"
 me_india_01_gandara.27.t:0 "$indian_mission_01_gandara_task_23$"
 me_india_01_gandara.28.a:0 "让我们试着从他们留下的东西中赚点钱，至少？"
 me_india_01_gandara.28.desc:0 "我们的许多人被在[GetProvince('(int32)4340').GetArea.GetRegion.GetName]（最近在那里建立的许多城市之一）过新生活的承诺所蛊惑。他们抛弃了许多财物和家园，在东部定居后得到了新的家园和工作。"
 me_india_01_gandara.28.t:0 "安置在[GetProvince('(int32)4340').GetArea.GetRegion.GetName]中"
 me_india_01_gandara.29.a:0 "是的，我们必须接受佛教!"
 me_india_01_gandara.29.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_24$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.29.b:0 "我们永远不会放弃希腊主义。让这些异端燃烧吧。"
 me_india_01_gandara.29.b.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_24$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.29.desc:0 "佛教正在犍陀罗省迅速传播，取代了吠陀教和琐罗亚斯德教，成为许多城市的主流信仰。这是一种和平、宁静的宗教，在我们的宫廷中也吸引了不少信徒。如果我们真的要称自己为印度国王，或许改信佛教是个明智之举。"
 me_india_01_gandara.29.t:0 "$indian_mission_01_gandara_task_24$"
 me_india_01_gandara.3.a:0 "是的，印度需要一个新的首都。"
 me_india_01_gandara.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_2$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.3.b:0 "不，我们目前的首都很适合我们的需要。"
 me_india_01_gandara.3.b.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_2$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.3.desc:0 "我们已经在[GetProvince('(int32)4340').GetName]选择了一个新的地点作为潜在的首都。这座城市会成为印度-希腊王国的新王都吗？"
 me_india_01_gandara.3.t:0 "$indian_mission_01_gandara_task_2$"
 me_india_01_gandara.30.a:0 "是的，让我们拥抱印度文化的元素。"
 me_india_01_gandara.30.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_25$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.30.b:0 "胡说八道，我们将把我们优越的希腊文化强加给这些野蛮人。"
 me_india_01_gandara.30.b.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_25$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.30.desc:0 "随着我们与祖国和祖国文化的距离越来越远，我们已经开始在穿着和日常生活中适应印度社会的元素。我们不应该放弃希腊主义，也不应该培养文化至上主义，而是应该同时拥抱希腊和印度文化，如果我们要有效地统治这片土地。"
 me_india_01_gandara.30.t:0 "$indian_mission_01_gandara_task_25$"
 me_india_01_gandara.31.a:0 "让我们建立起家族的纽带。"
 me_india_01_gandara.31.desc:0 "米南德的血脉是一种天然的纽带，将我们王朝的所有成员联系在一起。对印度的统治应该是我们与生俱来的权利。"
 me_india_01_gandara.31.t:0 "$indian_mission_01_gandara_task_26$--皇家血统"
 me_india_01_gandara.32.a:0 "我们的血脉是神圣的。"
 me_india_01_gandara.32.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_26$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.32.desc:0 "现在欧特希米德家族的每个成员都带有米南德的皇家血统。我们是印度和其所有辉煌的继承者。"
 me_india_01_gandara.32.t:0 "$indian_mission_01_gandara_task_26$"
 me_india_01_gandara.33.a:0 "我们真的有一个伟大的国王。"
 me_india_01_gandara.33.desc:0 "在最近的征服中，我们领导者的声望飙升。随着印度经济的增长，我们的威望也在与日俱增。"
 me_india_01_gandara.33.t:0 "$indian_mission_01_gandara_task_final$--真正的国王"
 me_india_01_gandara.34.a:0 "印度的拉吉亚斯万岁！"
 me_india_01_gandara.34.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_final$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.34.desc:0 "我们的领袖被赋予了一个新的绰号。欧特希米德家族的统治是至高无上的。现在我们必须把目光转向印度的其他地区。我们的征服才刚刚开始。"
 me_india_01_gandara.34.t:0 "$indian_mission_01_gandara_task_final$"
 me_india_01_gandara.35.a:0 "让我们邀请新的移民。"
 me_india_01_gandara.35.desc:0 "[GetProvince('(int32)6815').GetName]是一个重要的港口城市，应该被希腊化。"
 me_india_01_gandara.35.t:0 "$indian_mission_01_gandara_task_21$"
 me_india_01_gandara.4.a:0 "我们的部队很快就会准备好占领该地区！"
 me_india_01_gandara.4.desc:0 "我们击伤了孔雀王朝，并削弱了印度河流域周围的印度国家。我们应该为入侵南方领土做准备。"
 me_india_01_gandara.4.t:0 "$indian_mission_01_gandara_task_3$"
 me_india_01_gandara.5.a:0 "准备好部队，战争一触即发。"
 me_india_01_gandara.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_3$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.5.desc:0 "现在是时候征服印度河流域的其他地区，并最终建立起与厄里特里亚海的联系了！"
 me_india_01_gandara.5.t:0 "$indian_mission_01_gandara_task_3$"
 me_india_01_gandara.6.a:0 "脚踏实地。"
 me_india_01_gandara.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_4$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.6.desc:0 "我们在般阐那陀的首都区域在新的统治下迅速发展，许多新的城市和定居点已经建立。我们将把这个地区从一个农业的落后地区转变为一个有着大量城市的经济重镇。"
 me_india_01_gandara.6.t:0 "$indian_mission_01_gandara_task_4$"
 me_india_01_gandara.7.a:0 "[GetProvince('(int32)4340').GetName]日渐壮大。"
 me_india_01_gandara.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_5$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.7.desc:0 "新的宫殿、寺庙、剧院、浴室、水渠和住房将[GetProvince('(int32)4340').GetName]变成了一个繁荣的城市，它吸引了来自波斯和印度各地的希腊定居者。"
 me_india_01_gandara.7.t:0 "$indian_mission_01_gandara_task_5$"
 me_india_01_gandara.8.a:0 "愿我们的王国繁荣昌盛。"
 me_india_01_gandara.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_6$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.8.desc:0 "[GetProvince('(int32)4340').GetName]现在是一个大都市。这座伟大的城市提高了我们王室的威望，也增加了我们的合法性。"
 me_india_01_gandara.8.t:0 "$indian_mission_01_gandara_task_6$"
 me_india_01_gandara.9.a:0 "好极了。"
 me_india_01_gandara.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_01_gandara_task_7$#!' $mission_completed_tooltip_2$"
 me_india_01_gandara.9.desc:0 "犍陀罗人将很好地融入我们的新王国，他们中的许多人已经在自己的习俗之上接受了希腊的习俗。愿这成为我们两个民族之间和平与合作的标志。"
 me_india_01_gandara.9.t:0 "$indian_mission_01_gandara_task_7$"
 me_india_02_ganges.1.a:0 "我们正在备战，准备攻占这一地区。"
 me_india_02_ganges.1.desc:0 "我们再次被卷入与孔雀的冲突是不可避免的。这一次，我们把目光投向了以恒河为中心的肥沃而富有的中印度。"
 me_india_02_ganges.1.t:0 "$indian_mission_02_ganges_task_1$ - 顺着恒河而下"
 me_india_02_ganges.10.a:0 "我们取得了胜利。"
 me_india_02_ganges.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_9$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.10.desc:0 "孔雀帝国的中心地带现在在我们手中。它被我们的人民称为'普拉西亚卡'，这座伟大城市甚至让埃及和波斯的那些都会都黯然失色。普拉西亚卡的宝藏和财富是我们的囊中之物。"
 me_india_02_ganges.10.t:0 "$indian_mission_02_ganges_task_9$"
 me_india_02_ganges.11.a:0 "让我们在[GetProvince('(int32)4429').GetName]建立一个圣地。"
 me_india_02_ganges.11.desc:0 "[GetProvince('(int32)4429').GetName]是佛陀初转法轮，宣讲真谛所在。这个宗教圣地应该在我们手中。"
 me_india_02_ganges.11.t:0 "$indian_mission_02_ganges_task_10$"
 me_india_02_ganges.12.a:0 "好极了!"
 me_india_02_ganges.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_10$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.12.desc:0 "[GetProvince('(int32)4429').GetName]已被确立为圣地，现在我们的万神殿里有‘法轮’圣典。"
 me_india_02_ganges.12.t:0 "$indian_mission_02_ganges_task_10$"
 me_india_02_ganges.13.a:0 "愿[GetProvince('(int32)4440').GetName]作为我们的陪都繁荣发展。"
 me_india_02_ganges.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_12$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.13.desc:0 "当我们的军队胜利进入伟大的孔雀首都[GetProvince('(int32)4440').GetName]时，他们被这座城市的规模和美丽所震惊。[GetProvince('(int32)4440').GetName]确实是世界上有史以来最伟大的大都市；一个拥有几十万或更多人口的城市。将这个伟大的城市作为陪都，将确保它仍然是印度-希腊王国真正宏伟的大都会之一。"
 me_india_02_ganges.13.t:0 "$indian_mission_02_ganges_task_12$"
 me_india_02_ganges.14.a:0 "愿我们更接近涅槃。"
 me_india_02_ganges.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_13$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.14.desc:0 "作为这座重要城市的守护者，我们必须确保伽耶在我们的统治下蓬勃发展。任何不足之处都是亵渎。"
 me_india_02_ganges.14.t:0 "$indian_mission_02_ganges_task_13$"
 me_india_02_ganges.15.a:0 "他们会学会适应我们的统治。"
 me_india_02_ganges.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_15$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.15.desc:0 "我们已经向摩揭陀人伸出了橄榄枝，并完全接纳他们成为我们帝国的一个组成部分。随着时间的推移，他们受伤的自尊心会痊愈。"
 me_india_02_ganges.15.t:0 "$indian_mission_02_ganges_task_15$"
 me_india_02_ganges.16.a:0 "普拉西亚卡省是我们王国最新的省份。"
 me_india_02_ganges.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_16$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.16.desc:0 "我们已经建立了普拉西亚卡省，该省包含了孔雀的首都和恒河周边的大部分肥沃土地。我们应该警惕太多的世俗权力转移到这个地区，而忽视我们的首都。"
 me_india_02_ganges.16.t:0 "$indian_mission_02_ganges_task_16$"
 me_india_02_ganges.17.a:0 "我们的国家从印度的这一边延伸到另一边。"
 me_india_02_ganges.17.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_17$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.17.desc:0 "经过在北印度的多次军事行动，我们终于到达了地球的尽头。恒河之海代表了已知世界的范围，而在它的外面则是有着难以言喻的神秘和壮丽的土地。与这些国家建立联系将给我们带来难以计数的知识和财富。"
 me_india_02_ganges.17.t:0 "$indian_mission_02_ganges_task_17$"
 me_india_02_ganges.18.a:0 "也许这个王国应该被希腊化..."
 me_india_02_ganges.18.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_18$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.18.desc:0 "安提波勒涅王国已经恢复，现在将拥有几个重要的贸易城市，它们将作为通往[GetProvince('(int32)4440').GetName]城的门户。"
 me_india_02_ganges.18.t:0 "$indian_mission_02_ganges_task_18$"
 me_india_02_ganges.19.a:0 "这将是一个伟大城市的开端。"
 me_india_02_ganges.19.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_20$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.19.desc:0 "[GetProvince('(int32)7331').GetName]是世界上最远的希腊化定居点。它将作为恒河三角洲的主要港口，使我们与许多新的民族和文化接触。"
 me_india_02_ganges.19.t:0 "$indian_mission_02_ganges_task_20$"
 me_india_02_ganges.2.a:0 "战争一触即发。"
 me_india_02_ganges.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_1$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.2.desc:0 "如果我们要真正成为印度的统治者，就必须把摩揭陀人赶出他们的都城。确保恒河流域的安全将确保我们成为印度无可争议的力量。"
 me_india_02_ganges.2.t:0 "$indian_mission_02_ganges_task_1$"
 me_india_02_ganges.20.a:0 "他们将成为我们军队的重要助力。"
 me_india_02_ganges.20.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_21$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.20.desc:0 "我们已经在甘加里戴的首府 [GetProvince('(int32)7345').GetName] 建立了稳固的军事存在，并从其居民那里学到了很多东西。甘加里戴人已经加入了我们的军队，并带来了关键的军事知识。"
 me_india_02_ganges.20.t:0 "$indian_mission_02_ganges_task_21$"
 me_india_02_ganges.21.a:0 "好极了！"
 me_india_02_ganges.21.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_22$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.21.desc:0 "尽管这个地区森林覆盖率很高，但基拉狄亚人已经被征服。现在，最大的挑战将是驯服这片野蛮的土地。"
 me_india_02_ganges.21.t:0 "$indian_mission_02_ganges_task_22$"
 me_india_02_ganges.22.a:0 "基拉狄亚人将逐渐习惯于我们的统治。"
 me_india_02_ganges.22.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_23$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.22.desc:0 "我们已经在基拉狄亚建造了新的城市，并建立了法治和强大的军事存在。虽然我们预计会有来自基拉狄亚人的持续袭击，但我们会在适当的时候制服他们并使其文明化。"
 me_india_02_ganges.22.t:0 "$indian_mission_02_ganges_task_23$"
 me_india_02_ganges.23.a:0 "好极了！"
 me_india_02_ganges.23.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_24$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.23.desc:0 "我们已经建立了甘杰提卡省，它覆盖了恒河三角洲的大部分地区。在未来几年，它将成为一个重要的沿海贸易地区。"
 me_india_02_ganges.23.t:0 "$indian_mission_02_ganges_task_24$"
 me_india_02_ganges.24.a:0 "印度的拉吉亚斯万岁!"
 me_india_02_ganges.24.desc:0 "我们已经征服了孔雀的土地。这将给我们的王室带来巨大的威望。"
 me_india_02_ganges.24.t:0 "$indian_mission_02_ganges_task_final$"
 me_india_02_ganges.25.a:0 "这仅仅是个开始..."
 me_india_02_ganges.25.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_final$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.25.desc:0 "我们的领袖被赋予了一个新的名字；印度人。在首都举行了盛大的庆祝活动，我们的军队将其野心转向了南方。"
 me_india_02_ganges.25.t:0 "$indian_mission_02_ganges_task_final$"
 me_india_02_ganges.26.a:0 "让我们准备一下。"
 me_india_02_ganges.26.desc:0 "我们对恒河上游地区新近的征服为我们提供了许多新的附属和城市。因陀罗平原的都会中，以[GetProvince('(int32)4405').GetName]为首。未来几周，我们计划在这座城市举行一场盛大的胜利庆典。"
 me_india_02_ganges.26.t:0 "$indian_mission_02_ganges_task_3$"
 me_india_02_ganges.27.a:0 "好极了！"
 me_india_02_ganges.27.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_14$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.27.desc:0 "孔雀王朝的中心地带几乎没有希腊人的存在。鼓励希腊人在这一地区定居是明智的。有几个地方已经被选为潜在的希腊化城市。"
 me_india_02_ganges.27.t:0 "$indian_mission_02_ganges_task_14$"
 me_india_02_ganges.28.a:0 "这将是一个伟大城市的开端。"
 me_india_02_ganges.28.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_19$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.28.desc:0 "[GetProvince('(int32)7493').GetName]已被改造成一个完全希腊化的城市，具有希腊的城市布局。它在恒河和狄阿达涅斯河岔路口的重要位置将确保它成为东部伟大的希腊化都会之一。"
 me_india_02_ganges.28.t:0 "$indian_mission_02_ganges_task_19$"
 me_india_02_ganges.29.a:0 "好极了！"
 me_india_02_ganges.29.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_11$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.29.desc:0 "憍萨罗王国及其两个都城[GetProvince('(int32)4437').GetName]和[GetProvince('(int32)4451').GetName]已被扩大和重建。憍萨罗的人民对他们城市的这项投资做出了积极的回应，并张开双臂欢迎我们的统治。"
 me_india_02_ganges.29.t:0 "$indian_mission_02_ganges_task_11$"
 me_india_02_ganges.3.a:0 "好极了!"
 me_india_02_ganges.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_2$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.3.desc:0 "恒河上游的省份现在是我们的了。[GetProvince('(int32)4405').GetName]和[GetProvince('(int32)4425').GetName] 的大城市已经张开双臂欢迎我们的士兵。"
 me_india_02_ganges.3.t:0 "$indian_mission_02_ganges_task_2$"
 me_india_02_ganges.30.a:0 "让我们邀请新移民。"
 me_india_02_ganges.30.desc:0 "[GetProvince('(int32)7493').GetName]是一个重要的港口城市，应该被希腊化。"
 me_india_02_ganges.30.t:0 "$indian_mission_02_ganges_task_19$"
 me_india_02_ganges.4.a:0 "因陀罗将被纳入我们的万神殿!"
 me_india_02_ganges.4.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_3$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.4.desc:0 "因陀罗城及其周边地区现在已经完全纳入了我们的帝国。当我们的士兵冒险进入这个宏伟的印度大都市时，它的人民为我们提供了大量的财物。我们的领袖已被居住在[GetProvince('(int32)4405').GetName]的佛教僧侣授予‘因陀罗的祝福’。"
 me_india_02_ganges.4.t:0 "$indian_mission_02_ganges_task_3$"
 me_india_02_ganges.5.a:0 "好极了!"
 me_india_02_ganges.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_4$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.5.desc:0 "战象已经成为我们军事体系的一个重要组成部分。这将使我们在未来与其他印度王国的冲突中获益匪浅。这些宏伟的动物将真正成为我们军队的福音。"
 me_india_02_ganges.5.t:0 "$indian_mission_02_ganges_task_4$"
 me_india_02_ganges.6.a:0 "[GetProvince('(int32)4425').GetName]将在我们的扶持下茁壮成长。"
 me_india_02_ganges.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_5$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.6.desc:0 "[GetProvince('(int32)4425').GetName]的皇城是恒河上的一个重要的大都市。一进入这座城市，我们的士兵就被它的美丽所震慑。这样一个伟大的城市应该被指定为‘皇家首都’。它将成为我们在印度所拥有的一个令人骄傲的新成员。"
 me_india_02_ganges.6.t:0 "$indian_mission_02_ganges_task_5$"
 me_india_02_ganges.7.a:0 "我们的人口将迅速增长。"
 me_india_02_ganges.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_6$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.7.desc:0 "恒河是印度的命脉，养活的人比整个希腊世界的人口总和还要多。我们在这一地区的农业潜力已大大扩展，我们的王国将永远不会缺粮。"
 me_india_02_ganges.7.t:0 "$indian_mission_02_ganges_task_6$"
 me_india_02_ganges.8.a:0 "这是两个伟大的新城市的开始。"
 me_india_02_ganges.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_7$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.8.desc:0 "我们已经在恒河流域建立了希腊国度的存在，新的城市接纳了来自我们王国其他地区的希腊定居者。"
 me_india_02_ganges.8.t:0 "$indian_mission_02_ganges_task_7$"
 me_india_02_ganges.9.a:0 "继续前往华氏城。"
 me_india_02_ganges.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_02_ganges_task_8$#!' $mission_completed_tooltip_2$"
 me_india_02_ganges.9.desc:0 "我们已经建立了梭德拉巴提亚省。这个省人口众多，土地肥沃，将很快成为印度-希腊王国的主要人口中心。我们在这里的希腊殖民地也在该地区建立了希腊人的存在。"
 me_india_02_ganges.9.t:0 "$indian_mission_02_ganges_task_8$"
 me_india_03_aparanta.1.a:0 "让我们准备好我们的部队，去占领这个地区。"
 me_india_03_aparanta.1.desc:0 "阿里亚卡省和拉里昔省构成了印度的西部边界。这个地区充满了财富，征服的时机已经成熟。"
 me_india_03_aparanta.1.t:0 "$indian_mission_03_aparanta_task_1$"
 me_india_03_aparanta.10.a:0 "很好。"
 me_india_03_aparanta.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_7$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.10.desc:0 "在我们杰出的统治下，锡拉斯特雷纳王国繁荣昌盛。"
 me_india_03_aparanta.10.t:0 "$indian_mission_03_aparanta_task_7$"
 me_india_03_aparanta.11.a:0 "很好。"
 me_india_03_aparanta.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_8$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.11.desc:0 "我们已经建立了西格迪斯省！"
 me_india_03_aparanta.11.t:0 "$indian_mission_03_aparanta_task_8$"
 me_india_03_aparanta.12.a:0 "我们的王国壮大了，繁荣了。"
 me_india_03_aparanta.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_9$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.12.desc:0 "阿里亚卡的海岸和其富裕的商业城市现在是我们的了。这对印度-希腊王国来说将是一个巨大的财政繁荣!"
 me_india_03_aparanta.12.t:0 "$indian_mission_03_aparanta_task_9$"
 me_india_03_aparanta.13.a:0 "财富流向阿里亚卡！"
 me_india_03_aparanta.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_10$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.13.desc:0 "[GetProvince('(int32)6859').GetName]现在是一个主要的希腊贸易中心，将我们的王国与波斯、阿拉伯和非洲的市场连接起来。"
 me_india_03_aparanta.13.t:0 "$indian_mission_03_aparanta_task_10$"
 me_india_03_aparanta.14.a:0 "很好。"
 me_india_03_aparanta.14.desc:0 "在[GetProvince('(int32)7420').GetName]的工作已经开始。它很快将成为一个新的希腊城市的所在！"
 me_india_03_aparanta.14.t:0 "$indian_mission_03_aparanta_task_11$"
 me_india_03_aparanta.15.a:0 "这是一个伟大城市的开始!"
 me_india_03_aparanta.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_11$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.15.desc:0 "[GetProvince('(int32)7420').GetName]现在是西印度最新的希腊化定居点！"
 me_india_03_aparanta.15.t:0 "$indian_mission_03_aparanta_task_11$"
 me_india_03_aparanta.16.a:0 "很好。"
 me_india_03_aparanta.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_12$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.16.desc:0 "我们的部队已经征服了伟大的德干高原，建立了希腊人对印度中部许多新的奇特城市的控制。"
 me_india_03_aparanta.16.t:0 "$indian_mission_03_aparanta_task_12$"
 me_india_03_aparanta.17.a:0 "很好。"
 me_india_03_aparanta.17.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_13$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.17.desc:0 "[GetProvince('(int32)7074').GetName]和[GetProvince('(int32)7078').GetName]是中印度的伟大贸易城市。[GetProvince('(int32)7078').GetName]由于大量的移民，已经成为一个主要的希腊城市，在该地区建立了希腊化的存在。"
 me_india_03_aparanta.17.t:0 "$indian_mission_03_aparanta_task_13$"
 me_india_03_aparanta.18.a:0 "香料必须流动。"
 me_india_03_aparanta.18.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_14$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.18.desc:0 "[GetProvince('(int32)6871').GetName]沿海的七个岛屿将成为新的希腊殖民地的所在地。同时，西印度海岸的贸易城市在我们的统治下蓬勃发展。"
 me_india_03_aparanta.18.t:0 "$indian_mission_03_aparanta_task_14$"
 me_india_03_aparanta.19.a:0 "我们的王国壮大而繁荣。"
 me_india_03_aparanta.19.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_15$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.19.desc:0 "我们已经建立了阿里亚卡省！"
 me_india_03_aparanta.19.t:0 "$indian_mission_03_aparanta_task_15$"
 me_india_03_aparanta.2.a:0 "战争一触即发。"
 me_india_03_aparanta.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_1$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.2.desc:0 "我们已经对西部地区提出了宣称。孔雀的残余势力和众多的封建王国都无法与我们的力量相比。"
 me_india_03_aparanta.2.t:0 "$indian_mission_03_aparanta_task_1$"
 me_india_03_aparanta.20.a:0 "好极了。"
 me_india_03_aparanta.20.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_16$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.20.desc:0 "西部各省和那里的所有财富都属于我们！"
 me_india_03_aparanta.20.t:0 "$indian_mission_03_aparanta_task_16$"
 me_india_03_aparanta.21.a:0 "好极了。"
 me_india_03_aparanta.21.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_17$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.21.desc:0 "西部各省的财富已经得到振兴和重建，吸引了来自我们整个伟大王国的定居者。南巴努斯，这个地区臭名昭著的国王，在我们的地牢里腐烂了。"
 me_india_03_aparanta.21.t:0 "$indian_mission_03_aparanta_task_17$"
 me_india_03_aparanta.22.a:0 "一个伟大的新宗教中心诞生了！"
 me_india_03_aparanta.22.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_18$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.22.desc:0 "[GetProvince('(int32)4475').GetName]，湿婆之城，现在有一座主要的寺庙，专门用于希腊化诠释这位伟大的印度教神祇。我们将湿婆，或‘印度的狄奥尼索斯’，反过来添加到佛教万神殿中。"
 me_india_03_aparanta.22.t:0 "$indian_mission_03_aparanta_task_18$"
 me_india_03_aparanta.23.a:0 "苏罗犀那是印度-希腊王国的一个优秀新城。"
 me_india_03_aparanta.23.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_19$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.23.desc:0 "我们已经征服了拉里昔的其他地区，我们的士兵在其首都[GetProvince('(int32)4420').GetName]中行进。"
 me_india_03_aparanta.23.t:0 "$indian_mission_03_aparanta_task_19$"
 me_india_03_aparanta.24.a:0 "非常好。"
 me_india_03_aparanta.24.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_20$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.24.desc:0 "[GetProvince('(int32)4420').GetName]是拉里昔的王都。随着时间的推移，它应该成为我们最宏伟和最重要的城市之一。"
 me_india_03_aparanta.24.t:0 "$indian_mission_03_aparanta_task_20$"
 me_india_03_aparanta.26.a:0 "我们的王国壮大而繁荣。"
 me_india_03_aparanta.26.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_22$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.26.desc:0 "我们已经建立了拉里昔省！"
 me_india_03_aparanta.26.t:0 "$indian_mission_03_aparanta_task_22$"
 me_india_03_aparanta.27.a:0 "我们必须做好准备工作。"
 me_india_03_aparanta.27.desc:0 "我们已经消灭了孔雀，征服了西部边境。正在为我们的统治者计划一场辉煌的胜利，以庆祝这一惊人的成就！我们必须做好准备。"
 me_india_03_aparanta.27.t:0 "$indian_mission_03_aparanta_task_final$"
 me_india_03_aparanta.28.a:0 "让我们沐浴在我们征服的荣耀之中。"
 me_india_03_aparanta.28.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_final$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.28.desc:0 "我们的领袖作为一个光荣的征服者进入首都。我们在印度取得的伟大军事胜利为我们的王国带来了巨大的声望，我们的统治者被赋予了 Kataktitis 或 征服者 的绰号。"
 me_india_03_aparanta.28.t:0 "$indian_mission_03_aparanta_task_final$"
 me_india_03_aparanta.3.a:0 "荣耀属于我们!"
 me_india_03_aparanta.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_2$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.3.desc:0 "曾经庞大的孔雀帝国终于被摧毁了。我们控制了他们在印度的所有土地，我们现在是这个大陆上最伟大、最强大的国家。"
 me_india_03_aparanta.3.t:0 "$indian_mission_03_aparanta_task_2$"
 me_india_03_aparanta.4.a:0 "很好。"
 me_india_03_aparanta.4.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_3$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.4.desc:0 "我们已经征服了锡拉斯特里亚半岛。我们必须加固和建设这个关键地区。"
 me_india_03_aparanta.4.t:0 "$indian_mission_03_aparanta_task_3$"
 me_india_03_aparanta.5.a:0 "很好。"
 me_india_03_aparanta.5.desc:0 "希腊定居者已经开始抵达[GetProvince('(int32)6857').GetName]，我们正在制定更加希腊化的城市布局和规划。"
 me_india_03_aparanta.5.t:0 "$indian_mission_03_aparanta_task_4$"
 me_india_03_aparanta.6.a:0 "这是一个伟大的新城市的开始。"
 me_india_03_aparanta.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_4$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.6.desc:0 "[GetProvince('(int32)6857').GetName]已经被重建为一个希腊人的定居点。它将成为印度伟大的希腊化港口之一。"
 me_india_03_aparanta.6.t:0 "$indian_mission_03_aparanta_task_4$"
 me_india_03_aparanta.7.a:0 "愿这些堡垒拱卫我们。"
 me_india_03_aparanta.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_5$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.7.desc:0 "健絺现在是一个重要的战略中心，它将成为抵抗来自海上攻击的堡垒。"
 me_india_03_aparanta.7.t:0 "$indian_mission_03_aparanta_task_5$"
 me_india_03_aparanta.8.a:0 "很好。"
 me_india_03_aparanta.8.desc:0 "在[GetProvince('(int32)6830').GetName]开始建造了！"
 me_india_03_aparanta.8.t:0 "$indian_mission_03_aparanta_task_6$"
 me_india_03_aparanta.9.a:0 "这将是一个伟大城市的开始。"
 me_india_03_aparanta.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_03_aparanta_task_6$#!' $mission_completed_tooltip_2$"
 me_india_03_aparanta.9.desc:0 "[GetProvince('(int32)6830').GetName]现在是一座希腊城市，并以我们王朝的成员命名，提高了我们家族的威望，留下了持久的遗产。"
 me_india_03_aparanta.9.t:0 "$indian_mission_03_aparanta_task_6$"
 me_india_04_dravidia.1.a:0 "让我们准备好部队，拿下这个地区。"
 me_india_04_dravidia.1.desc:0 "南部的泰米尔王国富甲一方，控制着印度利润丰厚的大部分香料贸易。泰米尔诸侯是一支强大的团结力量，他们抵制北方的扩张，不会轻易被驯服。然而，南方也是印度最富有的地区之一，应该被吞并。"
 me_india_04_dravidia.1.t:0 "$indian_mission_04_dravidia_task_1$"
 me_india_04_dravidia.10.a:0 "好极了！"
 me_india_04_dravidia.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_7$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.10.desc:0 "沿着迈索卢斯河的港口城市现在在我们的统治下蓬勃发展。它已成为我们王国的权力中心，也是通往印度内地的希腊化门户。"
 me_india_04_dravidia.10.t:0 "$indian_mission_04_dravidia_task_7$"
 me_india_04_dravidia.11.a:0 "好极了！"
 me_india_04_dravidia.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_8$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.11.desc:0 "我们已经建立了迈索里亚省！"
 me_india_04_dravidia.11.t:0 "$indian_mission_04_dravidia_task_8$"
 me_india_04_dravidia.12.a:0 "达罗毗荼人的土地在我们手中"
 me_india_04_dravidia.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_9$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.12.desc:0 "达罗毗荼人是一个骄傲的民族；商人和生意人，他们主宰着厄里特里亚海的香料贸易，他们的城市充斥着埃及和希腊黄金的财富。然而，这块骄傲的土地现在已经乖乖就范，将不得不服从希腊的统治。"
 me_india_04_dravidia.12.t:0 "$indian_mission_04_dravidia_task_9$"
 me_india_04_dravidia.13.a:0 "财富流向潘狄奥尼亚！"
 me_india_04_dravidia.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_10$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.13.desc:0 "我们已经控制了与东南亚的泰米尔贸易网络！"
 me_india_04_dravidia.13.t:0 "$indian_mission_04_dravidia_task_10$"
 me_india_04_dravidia.14.a:0 "好极了！"
 me_india_04_dravidia.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_11$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.14.desc:0 "我们给了泰米尔领主一定程度的自治权，以修复脆弱的希腊与泰米尔关系。随着时间的推移，泰米尔人民将逐渐接受我们在他们土地上的存在。"
 me_india_04_dravidia.14.t:0 "$indian_mission_04_dravidia_task_11$"
 me_india_04_dravidia.15.a:0 "塔普罗巴涅将是我们的。"
 me_india_04_dravidia.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_12$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.15.desc:0 "[GetProvince('(int32)6915').GetName]的港口现在是入侵塔普罗巴涅的重要军事集结地。这座城市本身将成为一个重要的港口，希腊定居者已经在最近几个月抵达。"
 me_india_04_dravidia.15.t:0 "$indian_mission_04_dravidia_task_12$"
 me_india_04_dravidia.16.a:0 "好极了！"
 me_india_04_dravidia.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_13$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.16.desc:0 "我们已经征服了塔普罗巴涅岛，并消灭了它的海军存在。这个岛屿将成为我们贸易和宗教的乐土，因为它正迅速成为佛教的主要中心。"
 me_india_04_dravidia.16.t:0 "$indian_mission_04_dravidia_task_13$"
 me_india_04_dravidia.17.a:0 "我们确实受神眷顾。"
 me_india_04_dravidia.17.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_14$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.17.desc:0 "狮子岩现在是我们最神圣的宗教中心之一，[GetProvince('(int32)6950').GetName]充斥着来自印度各地的朝拜者。未来几年，希腊佛教将在这个地区蓬勃发展。"
 me_india_04_dravidia.17.t:0 "$indian_mission_04_dravidia_task_14$"
 me_india_04_dravidia.18.a:0 "好极了！"
 me_india_04_dravidia.18.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_15$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.18.desc:0 "希腊港口在[GetProvince('(int32)6981').GetName]和[GetProvince('(int32)6971').GetName]的建立，在塔普罗巴涅岛形成了突出的希腊化存在。随着时间的推移，我们对该岛的影响力将会增加。"
 me_india_04_dravidia.18.t:0 "$indian_mission_04_dravidia_task_15$"
 me_india_04_dravidia.19.a:0 "我们的王国成长和繁荣。"
 me_india_04_dravidia.19.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_16$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.19.desc:0 "我们已经建立了潘狄奥尼亚省！"
 me_india_04_dravidia.19.t:0 "$indian_mission_04_dravidia_task_16$"
 me_india_04_dravidia.2.a:0 "战争一触即发。"
 me_india_04_dravidia.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_1$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.2.desc:0 "我们已经对印度的南部地区提出了宣称！现在，我们必须羞辱这些达罗毗荼人，一劳永逸地完成对印度的征服。"
 me_india_04_dravidia.2.t:0 "$indian_mission_04_dravidia_task_1$"
 me_india_04_dravidia.20.a:0 "好极了！"
 me_india_04_dravidia.20.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_17$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.20.desc:0 "利迈里卡王国已被我们的军队所征服。我们已经确保了对印度南部海岸的控制，现在开始了将其人民融入我们王国的漫长任务。"
 me_india_04_dravidia.20.t:0 "$indian_mission_04_dravidia_task_17$"
 me_india_04_dravidia.21.a:0 "香料必须流动。"
 me_india_04_dravidia.21.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_18$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.21.desc:0 "长期以来，利润丰厚的利迈里卡香料贸易一直被独立王国和城邦所控制。现在，印度-希腊王国可以对利迈里卡香料贸易实施全面控制，这将使我们成为希腊世界的主要参与者。"
 me_india_04_dravidia.21.t:0 "$indian_mission_04_dravidia_task_18$"
 me_india_04_dravidia.22.a:0 "好极了！"
 me_india_04_dravidia.22.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_19$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.22.desc:0 "我们已经在印度次大陆南部的尖端建立了一个殖民地！这是一场象征性的胜利，也是我们征服南方的证明。"
 me_india_04_dravidia.22.t:0 "$indian_mission_04_dravidia_task_19$"
 me_india_04_dravidia.23.a:0 "好极了！"
 me_india_04_dravidia.23.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_20$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.23.desc:0 "我们已经建立了利迈里卡省！"
 me_india_04_dravidia.23.t:0 "$indian_mission_04_dravidia_task_20$"
 me_india_04_dravidia.24.a:0 "我们必须做好准备工作。"
 me_india_04_dravidia.24.desc:0 "我们已经征服了泰米尔国王和南部的省份！为庆祝这一惊人的成就，我们的统治者正在计划一场辉煌的凯旋！"
 me_india_04_dravidia.24.t:0 "$indian_mission_04_dravidia_task_final$"
 me_india_04_dravidia.25.a:0 "让我们沐浴在我们征服的荣耀之中。"
 me_india_04_dravidia.25.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_final$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.25.desc:0 "我们的领袖作为一个光荣的征服者进入首都。我们在南印度取得的伟大军事胜利为我们的王国带来了巨大的声望，我们的统治者被赋予了‘达罗毗底克斯’的绰号。"
 me_india_04_dravidia.25.t:0 "$indian_mission_04_dravidia_task_final$"
 me_india_04_dravidia.3.a:0 "随着时间的推移，繁荣将回到羯陵伽。"
 me_india_04_dravidia.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_2$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.3.desc:0 "我们与羯陵伽的战争使该地区遭到破坏。由于不愿意屈服，我们被迫火烧他们的城市，摧毁他们的港口，这给这片土地带来了无尽的破坏。现在，成千上万的羯陵伽人被卖为奴隶，他们的海军陨落于兢伽海的底部。这个地区需要很多年才能从这场灾难性的战争中恢复过来。"
 me_india_04_dravidia.3.t:0 "$indian_mission_04_dravidia_task_2$"
 me_india_04_dravidia.4.a:0 "让我们建造一支伟大的舰队！"
 me_india_04_dravidia.4.desc:0 "我们的王国曾经是完全的内陆国，然而最近的征服使我们有了无可匹敌的出海口。随着羯陵伽海军的瓦解，我们现在有能力利用他们的港口来建造一支庞大的舰队，与该地区的其他势力相抗衡。"
 me_india_04_dravidia.4.t:0 "$indian_mission_04_dravidia_task_3$"
 me_india_04_dravidia.5.a:0 "非常好。"
 me_india_04_dravidia.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_3$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.5.desc:0 "我们的舰队现在可以和其他所有可以进入厄律特莱海的国家媲美。我们的海军优势无可匹敌，并将把我们的影响力延伸到赛里斯和其他地区。"
 me_india_04_dravidia.5.t:0 "$indian_mission_04_dravidia_task_3$"
 me_india_04_dravidia.6.a:0 "让我们重建这些陷落的城市。"
 me_india_04_dravidia.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_4$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.6.desc:0 "羯陵伽的贸易城市处于废墟之中，并遭受了大规模的人口减少。重建这个地区作为希腊化的权力中心，将使我们成为兢伽海的主导贸易国。"
 me_india_04_dravidia.6.t:0 "$indian_mission_04_dravidia_task_4$"
 me_india_04_dravidia.7.a:0 "好极了。"
 me_india_04_dravidia.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_5$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.7.desc:0 "我们已经征服了迈索里亚！这个地区森林茂密，难以穿越，需要大量投资以确保我们在这里的影响力不会减弱。"
 me_india_04_dravidia.7.t:0 "$indian_mission_04_dravidia_task_5$"
 me_india_04_dravidia.8.a:0 "很好。"
 me_india_04_dravidia.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $indian_mission_04_dravidia_task_5$#!' $mission_completed_tooltip_2$"
 me_india_04_dravidia.8.desc:0 "迈索里亚的内部省份已经被征服，道路已经被修建，基础设施已经被更新。我们将在适当的时候看到这项投资的好处。"
 me_india_04_dravidia.8.t:0 "$indian_mission_04_dravidia_task_6$"
 me_india_04_dravidia.9.a:0 "我们期待着最终的结果。"
 me_india_04_dravidia.9.desc:0 "在[GetProvince('(int32)7019').GetName]、[GetProvince('(int32)7040').GetName]和[GetProvince('(int32)4046').GetName]的港口城市已经开始建设。"
 me_india_04_dravidia.9.t:0 "$indian_mission_04_dravidia_task_7$"

 VENETIA:0 "威尼托"
 VENETIA_ADJ:0 "威尼托"
 VENETIA_ET_HISTRIA:0 "威尼托与希斯特里亚"
 VENETIA_ET_HISTRIA_ADJ:0 "$VENETIA_ADJ$"
 VENETIC_EMPIRE:0 "威尼托帝国"
 VENETIC_EMPIRE_ADJ:0 "威尼托"

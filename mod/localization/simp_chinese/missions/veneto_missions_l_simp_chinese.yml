 VENETIC_LEAGUE_ADJ:0 "威尼托"
 appropriated_money_for_illyria_veneto:0 "挪用了我们的资金！"
 declare_venetian_empire:0 "宣布 $VNT_ADJ$ 帝国"
 declare_venetian_empire_desc:0 "自我们有记忆以来，$VNT$ 一直处于其他文明的阴影之下。我们总是试图独善其身，却不得不在 $cisalpine_gaul_region$ 中为生存而战。\n然而，现在我们的国家在迅速增长。受我们商人阶层的雄心驱使，我们的财阀国家达到了我们的祖先无法想象的高度。现在，随着 $venetic$ 控制下的领土不断增加，我们作为真正帝国的地位很快将无可争议。"
 declare_venetian_empire_tt:0 "国家将变为 #Y $VENETIC_EMPIRE$#!"
 declare_venetic_league:0 "宣布 $venetic$ 联盟"
 declare_venetic_league_desc:0 "自我们有记忆以来，$VNT$ 一直处于其他文明的阴影之下。我们总是试图独善其身，却不得不在 $cisalpine_gaul_region$ 中为生存而战。然而，我们并非独自在安全斗争中，最近我们与其他商人城市联合起来，与我们的合作对他们证明是有益的。\n随着我们联合规模的增长，我们所有城市的联合保护力量也在增强，很快我们将能够安全地宣布自己为地中海城市的联合联盟，当然由位于 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 的威尼托领导，联合起来追求安全与繁荣的集体意志。"
 declare_venetic_league_tt:0 "将形成 #Y $VENETIC_LEAGUE$#!"
 desc_me_a_fleet_to_rival_carthage_ven_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 最近使其首都的辉煌超越迦太基，并建立了强大的海军传统。"
 desc_me_amber_imports_secured_cmod:0 "该国的贸易路线已清除匪徒和敌对邻居，促进了商业发展。"
 desc_me_arrival_of_roman_colonists_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 正经历来自罗马的殖民者涌入，人口增加。"
 desc_me_atestine_situli_pmod:0 "[GetProvince('(int32)3595').GetName] 城工匠生产的青铜桶（situla）是北意大利最好的之一。融合凯尔特、伊特鲁里亚和希腊风格，阿泰斯特青铜桶展现了威尼托神话与品质。"
 desc_me_bellicose_doctrine_veneto_cmod:0 "这个国家周围的世界危险且不可预测。威尼托人深知，为了生存，他们必须抓住每一个扩张和增强力量的机会。"
 desc_me_benevolent_treatment_to_the_spartans_pmod:0 "这个国家决定放弃对斯巴达人民的残酷报复，赢得了他们的感激和斯巴达军事力量的忠诚。"
 desc_me_carnian_fortifications_pmod:0 "该省份进行了广泛的防御工事建设。"
 desc_me_center_of_the_amber_road_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 位于从斯堪尼亚和波罗的海延伸至希腊的广泛琥珀贸易路线的中心，几乎所有流向地中海的琥珀都首先通过 $VNT_ADJ$ 边境。这为 [SCOPE.GetRootScope.GetCountry.GetName] 带来了高额利润。"
 desc_me_consolidating_the_veneti_cities_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 正在整合其分裂的城邦，以形成更正式的联合政府。"
 desc_me_este_fortifications_pmod:0 "该省份进行了广泛的防御工事建设。"
 desc_me_etruscan_settlers_arrive_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 正接收来自伊特鲁里亚的移民，人口增加。"
 desc_me_expanded_adria_harbor_pmod:0 "阿德里亚的著名港口已拥有令人印象深刻的海运水道，现进一步扩展，可容纳更大的贸易或战船。"
 desc_me_expanded_adrian_waterworks_pmod:0 "该城的水务和基础设施得到广泛投资，大幅提升了其商业价值和城市扩展潜力。"
 desc_me_expanded_altinos_port_pmod:0 "在 [GetProvince('(int32)3598').GetName] 城建造了大型港口，不仅促进威尼托贸易，还能容纳和建造宏伟舰队……"
 desc_me_expanded_venetic_fleet_cmod:0 "威尼托舰队最近大幅扩展，大大提升了水手的士气。"
 desc_me_favorable_diplomacy_veneto_cmod:0 "该国已就如何安全、外交地处理邻国关系达成共识，因此暂时稳固了其地缘政治地位。"
 desc_me_great_temple_at_altinom_pmod:0 "一座献给阿尔蒂诺神的宏伟神庙已在此建成，令 [GetProvince('(int32)3598').GetName] 的所有公民感到敬畏和钦佩。"
 desc_me_growth_of_venetic_colony_pmod:0 "这片领土正在建立一个 $VNT_ADJ$ 殖民地，来自 [SCOPE.GetRootScope.GetCountry.GetName] 各地的 $venetic$ 商人和贸易者蜂拥而至，寻求在这里开始新生活。"
 desc_me_high_access_to_scanian_amber_pmod:0 "大量获取来自斯堪尼亚的利润丰厚的琥珀使该省份极为富裕！"
 desc_me_imports_from_the_east_ven_cmod:0 "控制了通过克里特的贸易路线后，该国获得了大量通过亚洲进入东地中海的货物，并成功垄断了其向西的出口。"
 desc_me_improved_commerce_cmod:0 "该国最近投资了新商业路线，大幅扩展了贸易者的盈利可能性。"
 desc_me_improved_horses_veneto_cmod:0 "经过广泛的育种计划，威尼托培育的马匹比其他国家的更快更强。然而，这也伴随着更高的维护成本。"
 desc_me_nationwide_fortifications_cmod:0 "该国为其领土内所有防御工事制定了标准，确保防御无盲点。"
 desc_me_new_route_for_amber_imports_cmod:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 最近开辟了一条通过雷蒂亚进口琥珀的新贸易路线，商业得到显著提升。"
 desc_me_noricum_fortifications_vnt_pmod:0 "该省份已加固要塞，以保护低地城市。"
 desc_me_outpost_at_lagola_pmod:0 "该领土拥有重要的商业据点，商人和贸易者在穿越多洛米蒂山脉前在此休息并向特鲁姆西亚特祈祷。"
 desc_me_padovian_cloth_pmod:0 "[GetProvince('(int32)3594').GetName] 最近投资大幅扩展纺织生产，成为北意大利最重要的织物生产中心之一。"
 desc_me_pleased_padovians_pmod:0 "[GetProvince('(int32)3594').GetName] 的市民感到国家慷慨满足了他们对城市投资的需求，未来相当长时间将保持安抚。"
 desc_me_port_of_spina_ven_pmod:0 "斯皮纳港是北亚得里亚海的主要出口中心，与意大利大部分商业相连，其港口已大幅扩展，提升了贸易能力，同时增加了当地渔业强度。"
 desc_me_ship_building_spree_vnt_cmod:0 "该国最近开始扩大舰队，目前有专门的造船工人勤奋工作。"
 desc_me_sovereign_supremacy_modifier_cmod:0 "该国决定主要依靠自身力量防御。不幸的是，对其邻国而言，这意味着以进攻作为防御。"
 desc_me_specialized_horse_breeding_veneto_pmod:0 "该省份生产世界上最好的赛马，为罗马、希腊等地提供骏马。然而，马匹生产的强化也增加了对马饲料的需求。"
 desc_me_subjugated_illyrians_illyria_pmod:0 "在伊利里亚内陆对威尼托统治的抵抗已被粉碎，伊利里亚人短期内难以再次反抗 [SCOPE.GetRootScope.GetCountry.GetName]，威尼托人准备利用这一事实实施压迫性的税收和征兵政策。"
 desc_me_venetian_security_cmod:0 "为避免被邻国吞并，该国实施了高效的边境防御政策。"
 desc_me_venetian_urbanization_program_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 投资了大规模城市化计划，大幅增加其人口。"
 desc_me_venetic_manpower_law_cmod:0 "通过中央集权和官僚体系的完善，[SCOPE.GetRootScope.GetCountry.GetName] 成功改革了征兵制度，提供了更大、更易获取的人力资源。"
 desc_me_veneto_chose_diplomacy_cmod:0 "这个国家选择通过外交手段保护自己，培养中立和绥靖的形象。虽然这对邻国来说是讨喜的，但也意味着 [SCOPE.GetRootScope.GetCountry.GetName] 的任何侵略行为将更难以正当化和解释。"
 desc_me_veneto_gallic_warfare_cmod:0 "我们采纳了许多已融合的凯尔特人的武器和战术，并针对未融合的凯尔特人开发了应对措施。"
 desc_me_veneto_protected_adriatic_waterways_cmod:0 "征服伊利里亚海岸后，威尼托不仅证明了其海上霸权，还暂时清除了亚得里亚海的海盗，确保了该地区更大的商业自由。"
 desc_me_well_equipped_ekupets_cmod:0 "[SCOPE.GetRootScope.GetCountry.GetName] 的主导武士阶层‘艾库佩塔波斯’（马王）的装备已大幅升级，使其成为强大的冲击骑兵。"
 desc_ven_venetian_empire_cmod:0 "这个国家已发展成为一个庞大的海上帝国，进行了改革以在海上发挥超乎寻常的军事力量。"
 desc_ven_venetic_league_cmod:0 "这个国家宣布了威尼托联盟，将众多民族和城市联合成一个海上霸权的单一领域。"
 form_veneto_decision:0 "统一 #E 威尼托#!"
 form_veneto_decision_desc:0 "威尼托人长期以来居住在 #Y [GetProvince('(int32)3598').GetArea.GetName]#! 的土地上，但我们如此分裂，可能无法持久。\n处于独特的强势地位，我们应该承担起将 $venetic$ 人民统一成单一联邦的责任！"

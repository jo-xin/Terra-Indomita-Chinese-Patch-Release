 veneto_flavour_event.10.t:0 "统一的威尼托"
 veneto_flavour_event.12.a:0 "愿克莱奥尼莫斯永世受诅咒！"
 veneto_flavour_event.12.desc:0 "我们的部队击败了狡诈的#E [GetCharacter('(int32)176').GetPraenomen]#!!\n他的大部分船只已被击沉，他剩余的少量部队已被分散。[GetCharacter('(int32)176').GetPraenomen]自己已经逃回 #E 斯巴达#!，不太可能再次踏足我们的土地。\n\n虽然我们的部分土地被他的部队掠夺，但我们击败他的斯巴达军队是$venetic$人民的伟大胜利。"
 veneto_flavour_event.12.t:0 "克莱奥尼莫斯的失败"
 veneto_flavour_event.14.a:0 "让我们给克莱奥尼莫斯他想要的财富"
 veneto_flavour_event.14.b:0 "[GetProvince('(int32)3594').GetName]现在在克莱奥尼莫斯的控制之下"
 veneto_flavour_event.14.b_tt:0 "#E 克莱奥尼莫斯#!在#E [GetProvince('(int32)3594').GetName]#!建立了斯巴达殖民地#Y $SPARTAN_PATAVIUM$#!。"
 veneto_flavour_event.14.desc:0 "尽管我们尽了最大努力战胜他，#E [GetCharacter('(int32)176').GetPraenomen]#!已占领#E [GetProvince('(int32)3594').GetName]#!并将其烧为平地，我们的军队未能夺回城市剩余的部分。\n\n接下来发生的事情取决于我们能与这位可怕的王子达成什么条款；然而，任何结果现在都将给[SCOPE.GetRootScope.GetCountry.GetName]带来巨大损失。"
 veneto_flavour_event.14.t:0 "克莱奥尼莫斯的胜利"
 veneto_flavour_event.16.a:0 "危机解除！"
 veneto_flavour_event.16.desc:0 "斯巴达王子，#E [GetCharacter('(int32)176').GetPraenomen]#!，像他出现时一样迅速撤离了我们的土地。\n\n作为老斯巴达国王克莱奥梅尼斯之子，克莱奥尼莫斯是一位野心勃勃的王子，在建城452年已在大希腊进行了一次远征，但最终被迫撤回斯巴达。然而，今年他发动了一次新远征，攻击了我们领土上的 #E [GetProvince('(int32)66').GetName]#! 的图里埃。\n\n幸运的是，#E [GetCountry('ROM').GetName]#! 军队的威胁迫使他退回船上，拯救了我们的领土免受他庞大军队的愤怒。"
 veneto_flavour_event.16.t:0 "克莱奥尼莫斯从阿普利亚撤退"
 veneto_flavour_event.17.a:0 "希望他不再回来"
 veneto_flavour_event.17.desc:0 "去年对梅森尼人的远征失败后，#E [GetCharacter('(int32)176').GetPraenomen]#!再次集结了一支庞大的军队，希望在意大利寻找财富。\n\n随着[GetCharacter('(int32)176').GetPraenomen]和他的部队离开 #E [GetCountry('SPA').GetName]#!的土地，至少暂时如此，我们的统治者，#E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!将免受这位觊觎者恶意影响的任何威胁。"
 veneto_flavour_event.17.t:0 "克莱奥尼莫斯出发前往意大利"
 veneto_flavour_event.18.a:0 "这次远征的可耻结局。"
 veneto_flavour_event.18.desc:0 "在放弃夺取阿普利亚诸城的尝试之后，#E [GetCharacter('(int32)176').GetPraenomen]#!似乎在#E [GetCountry('VNT').GetName]#!遭受了彻底失败，在试图攻取[GetProvince('(int32)3594').GetName]城时损失了大部分军队。\n\n如今，他灰溜溜地回到斯巴达，几乎再也没有机会组织这样的远征。虽然他仍会是$SPA_ADJ$政治中的重要人物，但这场最终失败将永远玷污他在其余$SPA_ADJ$民众心中的形象。"
 veneto_flavour_event.18.t:0 "克莱奥尼莫斯在意大利遭受失败"
 veneto_flavour_event.19.a:0 "一个暴徒的暴力终结。"
 veneto_flavour_event.19.desc:0 "在他对意大利的最后一次远征中，#E [GetCharacter('(int32)176').GetPraenomen]#! 似乎在战斗中被杀。\n\n他的大部分军队已被摧毁，尚不清楚他究竟是在试图进攻阿普利亚时，还是在对亚得里亚海对岸的维尼托人进行突袭时，遭受了致命一击。我们只知道，他和他的士兵都将永远无法回到 #E $SPA$#!，这为我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#! 带来了极大的宽慰。"
 veneto_flavour_event.19.t:0 "克莱奥尼莫斯在意大利被杀"
 veneto_flavour_event.2.a:0 "长寿威尼托帝国！"
 veneto_flavour_event.2.desc:0 "太久以来，$VNT$ 一直存在于已知世界的落后边缘。被许多人视为落后的部落国家，受到他人的影响和政治游戏。然而，现在，威尼托人已崛起至邻国无法想象的力量高度。通过迅速的改革和大规模扩张，我们彻底摆脱了昔日的不安全地位，崛起为主宰地中海的伟大国家。\n凭借我们现在拥有的巨大领土和海军力量，我们作为海上新帝国的地位现在无可争议。"
 veneto_flavour_event.2.t:0 "威尼托帝国的崛起"
 veneto_flavour_event.20.a:0 "这让事情变得复杂了……"
 veneto_flavour_event.20.desc:0 "#E [GetCharacter('(int32)176').GetPraenomen]#! 从 #E 意大利#! 的远征归来，带来了金银财宝和无上荣耀，这让我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#! 感到不安。\n\n他洗劫了 #E [GetProvince('(int32)3594').GetName]#!，让 #E [GetCountry('VNT').GetName]#! 屈服，迫使维尼托人缴纳了巨额贡金，并带着新获得的财富返回我们的国家。他已是 [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen] 的危险竞争者，现在在 $SPA_ADJ$ 精英中的突然高涨人气以及他的财富，使他成为 $SPA_ADJ$ 政治中的重要人物，对我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] 构成迫在眉睫的威胁。"
 veneto_flavour_event.20.t:0 "克莱奥尼莫斯光荣归来！"
 veneto_flavour_event.21.a:0 "我们欢迎新的斯巴达殖民地！"
 veneto_flavour_event.21.desc:0 "#E [GetCharacter('(int32)176').GetPraenomen]#! 对意大利的远征为他自己和整个 #E [GetCountry('SPA').GetName]#! 带来了巨大的成果。\n他摧毁了亚得里亚海北部 [GetCountry('VNT').GetName] 部落的军队，攻占并洗劫了他们最古老、最繁荣的城市 #E [GetProvince('(int32)3594').GetName]#!。\n\n现在，他自封为 $SPA_ADJ$ 国家 $SPARTAN_PATAVIUM$ 的 #E [GetCharacter('(int32)176').GetCountry.GetRulerTitle]#!，并提出以移民为条件，将他的新王国正式设为 [GetCountry('SPA').GetName] 的殖民地。\n这对我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] #E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#! 是极为有利的，因为这不仅进一步扩大了 [GetCountry('SPA').GetAdjective] 在该地区的影响力，还通过将一个危险的竞争者流放到维尼托，有助于我们的 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] 清除 $SPA_ADJ$ 政治中的威胁。"
 veneto_flavour_event.21.t:0 "克莱奥尼莫斯的[GetProvince('(int32)3594').GetName]王国"
 veneto_flavour_event.22.a:0 "让我们与伊特鲁里亚建立良好关系！"
 veneto_flavour_event.22.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 试图安抚 #Y [GetCountry('ETR').GetName]#!，\n可能导致形成 #Y 联盟#!"
 veneto_flavour_event.22.b:0 "我们不需要新的联盟"
 veneto_flavour_event.22.desc:0 "我们早已在帕丹平原上与伊特鲁里亚的强大力量抗衡，但我们的祖先成功地抵挡了他们，直到高卢人到来，将他们逐出该地区。然而，现在 [GetCountry('ETR').GetName] 又回来了，带着 [GetCountry('ETR').GetAdjective] 的力量重返该地区。\n我们或许曾经能够抵抗伊特鲁里亚的统治，但这并不意味着我们能够轻松应对这股新势力。或许采取更外交的方式，能更好地保护我们免受 [GetCountry('ETR').GetAdjective] 扩张的威胁？"
 veneto_flavour_event.22.t:0 "伊特鲁里亚的扩张"
 veneto_flavour_event.23.a:0 "我们可以在该地区多一个盟友"
 veneto_flavour_event.23.b:0 "为何要与维尼托结盟，我们完全可以征服他们？"
 veneto_flavour_event.23.desca:0 "我们再次到达维尼托的边境，过去的扩张记忆似乎仍然让维尼托人感到恐惧。为了通过更外交的手段维持他们的独立性，[GetCountry('VNT').GetName] 派来使节，恳求我们两国之间缔结联盟。\n虽然我们可以无视他们的安抚尝试，但这确实为我们提供了一个不流血就能扩大影响力的机会。"
 veneto_flavour_event.23.descb:0 "罗马人对我们生存的威胁日益严重，但我们并不是唯一害怕拉丁人扩张的国家。在我们的东北方，我们的老对手维尼托人也与罗马人接触，并寻求结盟以对抗罗马的扩张。尽管我们祖先的历史充满血腥，但为了应对共同的威胁，或许有必要搁置恩怨。"
 veneto_flavour_event.23.t:0 "维涅托请求结盟"
 veneto_flavour_event.24.a:0 "让我们寻求安抚罗马人"
 veneto_flavour_event.24.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 试图安抚 #Y [GetCountry('ROM').GetName]#!，\n可能导致形成 #Y 联盟#!"
 veneto_flavour_event.24.b:0 "我们必须寻求伊特鲁里亚的帮助！"
 veneto_flavour_event.24.b.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 试图与 #Y [GetCountry('ETR').GetName]#! 缔结 #Y 联盟#!。"
 veneto_flavour_event.24.c:0 "我们可以独自应对。"
 veneto_flavour_event.24.desc:0 "由于长期关注周围的高卢人，我们似乎忽略了边境上突然出现的新势力。在意大利中部的几次战争后，两个强大的国家开始在半岛上行军。我们的祖先曾成功抵御的伊特鲁里亚人，以及可怕的军事国家罗马。\n这两个国家在该地区展现出强烈的侵略野心，如果我们想保持领土免受这些新兴巨头的威胁，我们可能需要选择一方。"
 veneto_flavour_event.24.t:0 "南方的扩张"
 veneto_flavour_event.3.a:0 "愿我们伟大的联盟为所有人带来繁荣！"
 veneto_flavour_event.3.desc:0 "在过去的几个世纪里，威尼托的城市一直在毁灭的边缘摇摇欲坠，不断受到永恒入侵的威胁，生存前景渺茫，更不用说增长了。然而，凭借一切困难，这些城市设法巩固了自己，并在共同的 $VNT_ADJ$ 旗帜下联合起来，扩展了他们的集体影响，超越了原本的威尼托核心地带。\n现在，威尼托的保护之翼覆盖了许多不同的城市和民族，联合在繁荣与安全之中，是时候宣布这个跨地中海的联盟了，让所有其他国家知道我们的城市受到位于 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 的海军力量的保护。"
 veneto_flavour_event.3.t:0 "威尼托联盟的崛起"
 veneto_flavour_event.5.a:0 "让我们向他们请求建立友谊！"
 veneto_flavour_event.5.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 向 #Y [GetCountry('ROM').GetName]#! 提供对抗高卢战术的军事专长，\n可能导致 #Y 联盟#!"
 veneto_flavour_event.5.b:0 "我们完全可以独自对抗高卢人"
 veneto_flavour_event.5.desc:0 "我们长期以来独自对抗敌对的高卢邻居。现在，意大利中部崛起了一个新的意大利势力，罗马战争机器已到达我们的边境。他们与某些高卢部落也有长期的敌对历史，并寻求击败阿尔卑斯南高卢的那些凯尔特国家。\n如果我们请求与 [GetCountry('ROM').GetName] 结盟，或许我们可以合作，为该地区带来和平与稳定……"
 veneto_flavour_event.5.t:0 "罗马人的到来"
 veneto_flavour_event.6.a:0 "我们需要一个对抗高卢的盟友"
 veneto_flavour_event.6.b:0 "为什么要与威尼托结盟，我们可以直接征服他们？"
 veneto_flavour_event.6.desc:0 "在我们向阿尔卑斯南高卢的扩张中，我们的边境遇到了一个被称为威尼托的孤立意大利民族。他们热情地接待了我们，并对我们伟大的文明表现出兴趣。\n与 [GetCountry('ROM').GetName] 一样，他们也长期受到意大利高卢威胁的困扰，现在提出与我们建立友谊，结成对抗高卢的联盟。作为回报，他们保证在对抗高卢战争策略方面有许多专长可以分享。"
 veneto_flavour_event.6.t:0 "威尼托请求结盟"
 veneto_flavour_event.7.a:0 "我们必须改变邻国对我们的看法"
 veneto_flavour_event.7.b:0 "我们当前的做法很好！"
 veneto_flavour_event.7.desc:0 "我们的邻国在规模和力量上远远超过我们，但我们成功地与该地区一些最强大的国家建立了联盟。\n然而，我们之间的力量差距使我们对更强大的本地势力的当前外交立场受到质疑。\n如果我们要继续维持当前的外交状态，我们可能会因否认他们对该地区的霸权而冒犯我们的大邻居。因此，我们的最佳选择可能是追求绥靖政策。"
 veneto_flavour_event.7.t:0 "如履薄冰"
 veneto_flavour_event.9.a:0 "克莱奥尼莫斯将后悔踏足 [SCOPE.GetRootScope.GetCountry.GetName]！"
 veneto_flavour_event.9.desc:0 "在建城452年，[GetCharacter('(int32)176').GetPraenomen] 斯巴达的王子到达威尼托海岸，准备洗劫，甚至可能征服帕塔维乌姆城。在意大利半岛上一次征服和掠夺远征失败后，这是这位野心勃勃王子的最后赌注。他的目标直指 #E [GetProvince('(int32)3594').GetName]#!，他率领大军进入帕塔维领土，一路掠夺。\n\n另一方面，帕塔维人准备了他们的军队和海军，以粉碎克莱奥尼莫斯的部队，以免他将他们的家园化为灰烬……"
 veneto_flavour_event.9.t:0 "克莱奥尼莫斯军队的到来"
 veneto_flavour_event.9_tt:0 "#E [GetCharacter('(int32)176').GetPraenomen]'#! 的雇佣军必须在 #Y 2#! #E 年#! 内被击败"
 veneto_refused_further_integration:0 "拒绝进一步整合"
 veneto_requested_subjugation:0 "请求臣服"
 veneto_roman_friendship:0 "威尼托-罗马友谊"
 veneto_roman_relations_opinion:0 "威尼托-罗马友谊"
 veneto_shunned_foreign_relations:0 "威尼托的傲慢"
 veneto_stuck_with_the_ligoni:0 "维持与利戈尼的关系"

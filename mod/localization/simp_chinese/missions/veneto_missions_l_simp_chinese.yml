 secure_venetia_a_grand_fleet_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 舰船的 #Y 海军士气#! 将在数年内提升。"
 secure_venetia_a_single_state_tt:0 "若 [SCOPE.GetRootScope.GetCountry.GetName] 为部落，其 #Y 政府类型#! 将改变。\n\n通过改善征兵系统，"
 secure_venetia_a_venetian_empire_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将成为 #Y $VENETIC_EMPIRE$#!。\n#Y $VENETIC_EMPIRE$#! 将获得对 #Y 意大利#!、#Y 伊利里亚#! 和 #Y 希腊#! 的所有宣称。"
 secure_venetia_a_venetic_league_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将成为 #Y $VENETIC_LEAGUE$#!。\n任何非 $subject_league_city_state$ 的 #E 附庸#! 将成为 #Y $subject_league_city_state$#!。\n[SCOPE.GetRootScope.GetCountry.GetName] 的所有现有 #E $subject_league_city_state$s#! 将整合进 #Y $VENETIC_LEAGUE$#!。"
 secure_venetia_access_to_scanian_amber_tt:0 "#Y 诺里库姆#! 地区最多 #Y 4#! 个省份将获得以下修正："
 secure_venetia_adopt_gallic_warfare_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将采纳 #Y 凯尔特军事传统#!。"
 secure_venetia_alliance_with_the_rhaeti_tt:0 "#Y [GetCountry('RAE').GetName]#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感度将大幅 #Y 提升#!"
 secure_venetia_ally_the_cenomani_tt:0 "若 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的新盟友是 #Y [GetCountry('CNM').GetName]#!，#E [GetCountry('CNM').GetName]#! 对 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感将大幅提升。\n(#R 若 [GetCountry('CNM').GetName] 与 [GetCountry('LGN').GetName] 结盟，他们可能或不会解除与 [GetCountry('LGN').GetName] 的联盟。#!)\n#E [SCOPE.GetRootScope.GetCountry.GetName]#! 获得对 #Y $ferraria_area$#! 其余地区的 #E 宣称#!。"
 secure_venetia_ally_the_etruscans_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 与 #Y [GetCountry('ETR').GetName]#! 结盟。#Y [GetCountry('ETR').GetName]#! 对 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感将大幅提升。"
 secure_venetia_ally_the_romans_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 与 #Y [GetCountry('ROM').GetName]#! 结盟。#Y [GetCountry('ROM').GetName]#! 对 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感将大幅提升。"
 secure_venetia_an_outpost_in_crete_tt:0 "在克里特岛建立贸易中心后，东方货物将开始流入 #Y [SCOPE.GetRootScope.GetCountry.GetName]#!，"
 secure_venetia_arrangement_with_chersos_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将向 #Y [GetCountry('ASP').GetName]#! 发送成为 #Y $subject_league_city_state$#! 的提议。"
 secure_venetia_bring_in_the_histrians_tt:0 "获得对 #Y 希斯特里亚#! 其余地区的 #E 宣称#!。"
 secure_venetia_build_up_the_navy_tt:0 "随着造船劳动力的显著增加，"
 secure_venetia_buy_illyria_graecia_tt:0 "持有 #Y $illyria_graeca_area$#! 土地的任何国家将收到 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 购买的提议。\n\n[SCOPE.GetRootScope.GetCountry.GetName] 在 #Y $illyria_graeca_area$#! 购买的所有领土将获得 $venetic$ 殖民者，每块领土增加 #G 3#! #Y 人口#!。"
 secure_venetia_colonies_in_epirus_tt:0 "夺取伊庇鲁斯地区领土后，#Y [GetCountry('EPI').GetName]#! 可能被迫成为 [SCOPE.GetRootScope.GetCountry.GetName] 的附庸，该地区随机拥有的省份将涌入 #Y $venetic$#! 殖民者。\n#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 获得对 #Y $aetolia_area$#! 的宣称。"
 secure_venetia_colonies_in_illyria_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将以每块 #R -65#! #T 金币#! 的价格发送购买伊利里亚海岸多个省份的提议。\n#R ([SCOPE.GetRootScope.GetCountry.GetName] 可能损失高达 650 金币)#!\n#Y $venetic$#! 殖民者将涌入 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有的 #Y 达尔马提亚海岸#! 领土。\n\n[SCOPE.GetRootScope.GetCountry.GetName] 购买的每个领土将获得 #G 3#! #Y 人口#! 并获得以下修正："
 secure_venetia_commercial_interests_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]将开始效仿盟友的共和政体，启动把政府改革为#Y 财阀共和国#!的进程。"
 secure_venetia_conquer_the_illyrian_coast_tt:0 "获得对 #Y [GetProvince('(int32)4083').GetName]#! 和 #Y $illyria_graeca_area$#! 的宣称。\n\n由于减少了亚得里亚海的伊利里亚海盗活动，"
 secure_venetia_consolidate_the_cities_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 的城市将在共同法治下开始合作。"
 secure_venetia_decimate_the_cenomanni_tt:0 "获得对 #Y $aemilla_area$#! 地区的宣称。"
 secure_venetia_direct_control_over_cennomania_tt:0 "除非 [SCOPE.GetRootScope.GetCountry.GetName] 已征服 [GetCountry('CNM').GetAdjective] 土地，否则将向 #Y [GetCountry('CNM').GetName]#! 发出附庸化提议。"
 secure_venetia_ekupets_tt:0 "[SCOPE.GetRootScope.GetCountry.GetAdjective] 艾库佩塔斯将装备更高质量的重型装备。"
 secure_venetia_etruscan_protection_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 将成为 #Y [GetCountry('ETR').GetName]#! 的 #T $vassal_tribe$#!。\n若 #E [GetCountry('ETR').GetName]#! 接受，"
 secure_venetia_etruscan_settlers_tt_1:0 "将鼓励 #Y 10#! #E $etruscan$#! 文化 #E 人口#! 从 #Y [GetCountry('ETR').GetName]#! 迁往我们的乡村。"
 secure_venetia_etruscan_settlers_tt_2:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 将成为 #E [GetCountry('ETR').GetName]#! 的 #Y $subject_colony$#!。"
 secure_venetia_favorable_diplomacy_tt:0 "邻国对 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 无直接威胁。\n\n若 [SCOPE.GetRootScope.GetCountry.GetName] 仍与 #Y [GetCountry('ETR').GetName]#! 或 #Y [GetCountry('ROM').GetName]#! 结盟，双方好感将增强，直至联盟解除。"
 secure_venetia_fortify_carnia_tt:0 "一旦 #Y [GetProvince('(int32)4025').GetName]#! 的 #Y 要塞等级#! 提升至 #Y 2#!，或 [SCOPE.GetRootScope.GetCountry.GetName] 筹集资金投资现有要塞，"
 secure_venetia_fortify_este_tt:0 "一旦在 #Y [GetProvince('(int32)3595').GetName]#! 建造一座要塞，"
 secure_venetia_gallic_colonies_tt:0 "将鼓励 #Y $lepontic$#! 塞诺曼尼凯尔特人定居。\n\n#Y $lepontic$#! 文化将开始融合。\n\n"
 secure_venetia_give_power_to_the_rakos_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]将开始采纳邻国的中央集权君主制，之后成为#Y 财阀君主制#!。"
 secure_venetia_mission_event.101.a:0 "这肯定会保护我们的东部边境！"
 secure_venetia_mission_event.101.desc:0 "[GetCountry('ROM').GetName] 收到了我们需要帮助保卫边境的消息，并慷慨地同意提供帮助！\n来自罗马的殖民者已经被派往阿基莱亚的土地，准备建立一个他们计划命名为‘阿奎莱亚’的殖民地，以保卫我们的东部边境。\n我们对 $roman$ 的感激之情无以言表！我们不会忘记他们的援助！"
 secure_venetia_mission_event.101.t:0 "[GetCountry('ROM').GetName] 向阿奎莱亚派遣殖民者"
 secure_venetia_mission_event.106.a:0 "让我们加入这个威尼托联盟！"
 secure_venetia_mission_event.106.b:0 "也许我们应该重新考虑与 [GetCountry('VNT').GetName] 的联盟"
 secure_venetia_mission_event.106.desc:0 "我们的盟友 [GetCountry('VNT').GetName] 一直在稳步崛起。曾经是一个分裂的部落民族，他们现在是一个坚定以海上为中心的中央集权国家，不仅有能力自卫，还能在海上施加自己的意志。\n现在 [GetCountry('VNT').GetName] 向我们提出了一个有趣的提议。他们告诉我们，他们希望利用他们的力量形成一个跨海联盟，从 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 领导，为所有参与者提供安全和贸易，并希望我们加入他们的计划。"
 secure_venetia_mission_event.106.t:0 "威尼托联盟的形成"
 secure_venetia_mission_event.107.a:0 "让我们发送最后通牒"
 secure_venetia_mission_event.107.b:0 "我们负担不起为雷托而战"
 secure_venetia_mission_event.107.desc:0 "雷托已落入外国势力手中，我们保护邻居的愿望落空。\n但我们是一个顽强的民族，我们的国家不会因为盟友暂时被征服而轻易放弃联盟。此外，我们不能允许别人控制雷托通道，贸易从中流过。\n结果很简单：雷托的持有者和平放弃对雷托的控制，否则将被迫这样做。"
 secure_venetia_mission_event.107.t:0 "对雷蒂亚的最后通牒"
 secure_venetia_mission_event.108.a:0 "让他们试试！"
 secure_venetia_mission_event.108.b:0 "我们今天无法与 [GetCountry('VNT').GetName] 作战"
 secure_venetia_mission_event.108.desc:0 "[GetCountry('VNT').GetName] 向我们派出了一个代表团，称我们最近征服 [GetCountry('RAE').GetName] 持有的土地违反了他们最近达成的协议，即保护 [GetCountry('RAE').GetAdjective] 土地以换取两国之间的优惠贸易。\n因此，他们向我们发出最后通牒：将雷托的控制权归还给雷托人，置于 [GetCountry('VNT').GetAdjective] 的保护之下，否则 [GetCountry('VNT').GetName] 将通过武力控制该地区。"
 secure_venetia_mission_event.108.t:0 "威尼托要求雷蒂亚"
 secure_venetia_mission_event.110.a:0 "让我们都穿上罗马托加袍"
 secure_venetia_mission_event.110.b:0 "我们应该努力不放弃祖先的传统！"
 secure_venetia_mission_event.110.desc:0 "随着在罗马统治下的时间流逝，我们的人民越来越迷恋罗马的生活方式。从他们令人印象深刻的建筑到他们的组织和公共管理，他们文明的各个方面对 [GetCountry('VNT').GetAdjective] 人民来说都极具吸引力。因此，越来越多的威尼托人逐渐采纳了罗马文化的各个方面，他们的服饰、习惯，甚至拉丁语，毫不奇怪。\n这种社会转变无疑将极大地改变 [GetCountry('VNT').GetName] 的生活，至少如果任其发展的话。"
 secure_venetia_mission_event.110.t:0 "罗马的生活方式"
 secure_venetia_mission_event.111.a:0 "看来我们的贸易者会失望"
 secure_venetia_mission_event.111.desc:0 "虽然我们希望我们的提议被接受，但伊利里亚人似乎拒绝考虑出售他们的沿海土地的想法，彻底终结了我们在该地区建立殖民地的计划。"
 secure_venetia_mission_event.111.t:0 "拒绝出售伊利里亚领土"
 secure_venetia_mission_event.112.a:0 "这些偷窃的骗子！"
 secure_venetia_mission_event.112.desc:0 "#E $illyria_graeca_area$#! 的卑鄙恶棍夺取了我们用于收购伊利里亚希腊土地的全部付款，却没有交出任何领土！\n当然，提前发送如此巨额款项可能是不明智的，我们不能再次犯这样的错误。然而，我们对该土地当前领主的看法现在已被不诚实和背叛永远玷污。"
 secure_venetia_mission_event.112.t:0 "没收我们的付款！"
 secure_venetia_mission_event.113.a:0 "那我们只能绕过他们，另寻出路"
 secure_venetia_mission_event.113.desc:0 "出于政治利益或对我们的不信任，#E $illyria_graeca_area$#! 的当前持有者决定他们宁愿拥有伊利里亚希腊而不是我们送去的大笔款项，并将我们的付款退还给我们。\n看来我们的商人阶层在亚得里亚海尽头建立据点的雄心暂时受阻，这一事实可能在长远上限制我们的贸易。"
 secure_venetia_mission_event.113.t:0 "拒绝出售伊利里亚希腊"
 secure_venetia_mission_event.114.a:0 "哦，好吧"
 secure_venetia_mission_event.114.desc:0 "尽管我们提出了付款提议，但看来我们从当前占领者手中购买斯皮纳的请求被拒绝了。虽然投资斯皮纳对于将我们的出口导向意大利是理想的，但现在看来我们必须修改我们的计划。"
 secure_venetia_mission_event.114.t:0 "斯皮纳购买请求被拒"
 secure_venetia_mission_event.115.a:0 "明智的选择！"
 secure_venetia_mission_event.115.desc:0 "或许是看到了经济合作的好处，或者只是被我们日益增长的力量所震慑，[GetCountry('ASP').GetName] 决定同意进入 [GetCountry('VNT').GetAdjective] 的领域是他们最安全的选择。"
 secure_venetia_mission_event.115.t:0 "[GetCountry('ASP').GetName] 臣服"
 secure_venetia_mission_event.116.a:0 "一个受欢迎的发展！"
 secure_venetia_mission_event.116.desc:0 "由于我们与 [GetCountry('CNM').GetName] 的长期友好关系，以及我们武力的崛起，塞诺曼尼同意我们的行政帮助将有益于他们的安全和他们自己土地的发展。现在我们将能够保证该地区的古老城市，如维罗纳，重新置于 [GetCountry('VNT').GetAdjective] 的保护之下。"
 secure_venetia_mission_event.116.t:0 "对 [GetCountry('CNM').GetName] 的控制"
 secure_venetia_mission_event.117.a:0 "欢迎加入我们的保护！"
 secure_venetia_mission_event.117.desc:0 "受到罗马人和其他威胁势力的威胁，安科纳人已接受置于我们的保护之下。\n我们相信这将是一个极佳的决定，因为与 $venetic$ 城市的合作肯定将为 [GetCountry('ANO').GetName] 的商业带来丰硕成果！"
 secure_venetia_mission_event.117.t:0 "安科纳接受保护"
 secure_venetia_mission_event.118.a:0 "这肯定将为我们的商人带来长期的新机会"
 secure_venetia_mission_event.118.desc:0 "我们争取伊利里亚人的努力已见成效，他们接受了我们以付款换取其沿海土地的提议！\n我们的商人和他们的家庭已经蜂拥而至前往我们在伊利里亚的新领土，希望在海外殖民地建立新的生活和机会。"
 secure_venetia_mission_event.118.t:0 "获取伊利里亚海岸"
 secure_venetia_mission_event.119.a:0 "我们的贸易者肯定会受益！"
 secure_venetia_mission_event.119.desc:0 "看来我们的大笔付款成功了，$illyria_graeca_area$ 的土地属于我们了！\n$venetic$ 定居者已到达该地区，我们的控制已经建立。有了这样的商业据点，我们的贸易者现在将拥有通往地中海的无限通道！"
 secure_venetia_mission_event.119.t:0 "我们的策略成功了！"
 secure_venetia_mission_event.120.a:0 "这将是一个对所有相关方真正有益的安排！"
 secure_venetia_mission_event.120.desc:0 "面对凯尔特入侵的威胁，[GetCountry('RAE').GetName] 虽有些犹豫，但同意让我们更直接地保护他们的土地，我们的部队已经进入 [GetCountry('RAE').GetAdjective] 的领土。\n他们不会后悔这个决定，因为除了保护他们的土地，我们的经济（已经联系在一起）肯定会实现共同增长，$rhaetian$ 将有机会从地中海进口更多商品，我们也将通过阿尔卑斯的琥珀贸易获得更大通道。"
 secure_venetia_mission_event.120.t:0 "[GetCountry('RAE').GetName] 接受保护"
 secure_venetia_mission_event.121.a:0 "[GetProvince('(int32)117').GetName] 在 $venetic$ 手中是安全的"
 secure_venetia_mission_event.121.desc:0 "经过大量外交努力，我们成功说服了 #E [GetProvince('(int32)117').GetName]#! 的当前所有者将城市交给我们。尽管成本高昂，但我们相信将这座城市纳入我们领域的投资肯定会带来回报。\n此外，鉴于我们现在给予安科纳人的自治权，他们肯定会对他们的新保护者永远感激，并在与我们的关系中保持忠诚。"
 secure_venetia_mission_event.121.t:0 "对安科纳的保护国"
 secure_venetia_mission_event.122.a:0 "现在进军希腊本身……"
 secure_venetia_mission_event.122.desc:0 "在我们的军事力量面前畏缩，伊庇鲁斯人似乎决定臣服于 [GetCountry('VNT').GetName] 确实比他们肯定会输的冲突更可取。\n当然，这是预料之中的，因为我们的迅速崛起确实令人畏惧。\n有了 [GetCountry('EPI').GetName] 在我们的掌控之下，我们的商人将可以自由在该地区建立殖民地。"
 secure_venetia_mission_event.122.t:0 "伊庇鲁斯臣服！"
 secure_venetia_mission_event.123.a:0 "欢迎我们的同胞！"
 secure_venetia_mission_event.123.desc:0 "我们邀请塞诺曼尼定居者的政策取得了巨大成功，现在定居在我们国家的高卢部落成员数量大幅增加！\n虽然他们可能仍难以适应我们的本地语言，但他们觉得自己也是 [SCOPE.GetRootScope.GetCountry.GetName] 的一部分只是时间问题。"
 secure_venetia_mission_event.123.t:0 "高卢人的到来"
 secure_venetia_mission_event.123_tt_1:0 "#Y 15#! #E $lepontic$#! 文化人口已在 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 各地定居。"
 secure_venetia_mission_event.123_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 已开始整合 #Y #E $lepontic$#!#! #E 文化#!，整合从 #Y 50%#! 开始。"
 secure_venetia_mission_event.16.a:0 "我们最好切断与利戈尼人的联系"
 secure_venetia_mission_event.16.b:0 "[GetCountry('VNT').GetName] 无权干涉我们的外交！"
 secure_venetia_mission_event.16.desc:0 "我们与东方的威尼托人建立了友好联盟。这确保了我们东部边境的安全，但也与我们与利戈尼人的长期关系产生了冲突，他们似乎与 [GetCountry('VNT').GetName] 争夺土地。我们可以尝试维持现状，但这种骑墙态度可能会冒犯我们的新盟友……"
 secure_venetia_mission_event.16.t:0 "与威尼托的联盟"
 secure_venetia_mission_event.17.a:0 "让我们看看他们是否接受！"
 secure_venetia_mission_event.17.a.tt:0 "我们的贡品提议已经送出。"
 secure_venetia_mission_event.17.desc:0 "强大的罗马战争机器席卷意大利，扫除一切敢于对抗的敌人。但威尼托人民并未选择抵抗，而是将罗马视为法律和秩序的保障。\n因此，我们决定向罗马提出请求，请求他们在我们的内政中提供监督和裁决，以换取承认他们对意大利的主导地位。"
 secure_venetia_mission_event.17.t:0 "向罗马臣服"
 secure_venetia_mission_event.18.a:0 "他们寻求我们的帮助是多么正确！"
 secure_venetia_mission_event.18.b:0 "威尼托最好被更直接地控制……"
 secure_venetia_mission_event.18.desc:0 "我们的忠诚盟友威尼托请求我们保护并监督他们的地方争端。\n这并不令人意外，因为威尼托长期以来一直处于分裂和各城邦争吵的状态；然而，这是一个将我们的统治进一步扩展到阿尔卑斯南高卢的机会。考虑到他们愿意接受罗马文明的好处，这尤其是一个诱人的机会……"
 secure_venetia_mission_event.18.t:0 "威尼托请求保护"
 secure_venetia_mission_event.19.a:0 "是时候送出我们的提议了。"
 secure_venetia_mission_event.19.a.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 向 #Y [GetCountry('ETR').GetName]#! 臣服。"
 secure_venetia_mission_event.19.desc:0 "伊特鲁里亚人很久以前可能是我们的敌人，但来自南方的共同敌人使我们走到了一起。虽然我们现在联合在一起，但我们之间的力量差距仍然很大，罗马军队集中在威尼托的压力可能会导致我们的盟友抛弃我们。\n因此，将我们自身的利益与伊特鲁里亚的利益更直接地结合可能是有必要的。虽然向老对手屈膝可能会令人痛苦，但我们可能因此存活下来，并在未来再次崛起为主导力量。"
 secure_venetia_mission_event.19.t:0 "向伊特鲁里亚屈膝"
 secure_venetia_mission_event.20.a:0 "他们终于屈膝是多么正确！"
 secure_venetia_mission_event.20.b:0 "哈！现在他们寻求我们的保护！"
 secure_venetia_mission_event.20.desc:0 "过去，伊特鲁里亚人多次试图攻入威尼托的核心地带，但我们从未能完全征服他们。然而，现在由于来自南方的更大威胁，恐惧终于使他们屈服！\n他们的使节显然对不得不向我们献上土地感到痛苦，但他们的叛逆精神似乎终于走到了尽头。"
 secure_venetia_mission_event.20.t:0 "威尼托臣服！"
 secure_venetia_mission_event.21.a:0 "你知道，罗马的生活方式似乎非常吸引人"
 secure_venetia_mission_event.21.b:0 "对朱庇特的崇拜不会消失，但让我们保留一些旧传统"
 secure_venetia_mission_event.21.c:0 "这些外来的异端必须不惜一切代价被消灭！"
 secure_venetia_mission_event.21.desc:0 "我们进入罗马统治的方式没有冲突。罗马人似乎并不将我们视为简单的蛮族，而是视为远方的亲戚，‘特洛伊的后裔’，并投资于将他们的文明带到威尼托的项目。另一方面，许多威尼托人以开放的姿态欢迎罗马人。许多人甚至直接采纳了我们新领主的风俗，穿着罗马服饰，建造罗马风格的房屋，甚至崇拜新的罗马神祇。\n很快，我们的街道上将只听到拉丁语。"
 secure_venetia_mission_event.21.t:0 "入乡随俗……"
 secure_venetia_mission_event.22.a:0 "很好，让我们与罗马进一步整合！"
 secure_venetia_mission_event.22.a.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#Y [GetCountry('ROM').GetName]#!的#Y 藩属#!。\n#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的名称将发生变化。"
 secure_venetia_mission_event.22.b:0 "这一要求太过分了，即使是来自罗马"
 secure_venetia_mission_event.22.b.tt:0 "#Y [GetCountry('ROM').GetName]#! 将极为愤怒"
 secure_venetia_mission_event.22.desc:0 "虽然我们目前的安排对我们来说可能是满意的，但毫不意外，[GetCountry('ROM').GetName] 越来越将威尼托视为其帝国的另一个行省。虽然我们至今能够维持一定程度的自治，但越来越明显的是，罗马对我们进一步融入其统治的期望与我们的现状相去甚远，违背罗马对我们进一步融入其文明的期望将是一种严重的侮辱。"
 secure_venetia_mission_event.22.t:0 "[GetCountry('ROM').GetName] 希望进一步整合"
 secure_venetia_mission_event.23.a:0 "看来我们必须通过武力整合这些蛮族！"
 secure_venetia_mission_event.23.desc:0 "威尼托长期以来享受着罗马统治带来的繁荣；他们的争端得到调解，他们的边境由我们的军队保护。但现在，当他们需要开始作为我们统治的一部分支付代价时，他们却对我们吐口水！\n他们的傲慢和侮辱绝不能置之不理。我们为他们带来了和平与文明，待他们如同我们的兄弟，他们却背叛了我们。"
 secure_venetia_mission_event.23.t:0 "威尼托拒绝进一步整合"
 secure_venetia_mission_event.27.a:0 "希望他们接受！"
 secure_venetia_mission_event.27.desc:0 "虽然塞诺曼尼长期以来是我们的忠诚盟友，但现在是时候让我们的故土回归我们的控制了。当然，考虑到我们长期的友谊，和平与自治对我们的盟友来说远比流血更可取。此外，随着我们力量的增长，我们的直接保护甚至对塞诺曼尼有益！\n我们的使节已经派出，我们只希望我们的盟友能够明白事理……"
 secure_venetia_mission_event.27.t:0 "塞诺曼尼的附庸化"
 secure_venetia_mission_event.28.a:0 "他们的力量似乎确实在增长"
 secure_venetia_mission_event.28.b:0 "他们想要什么？"
 secure_venetia_mission_event.28.b.tt:0 "#Y [GetCountry('VNT').GetName]#! 很可能会对我们宣战"
 secure_venetia_mission_event.28.desc:0 "悲哀的是，我们的老盟友从忠诚转向了贪婪。我们长期的朋友，#Y 威尼托#! 竟然厚颜无耻地要求我们臣服于他们！\n这对我们的人民来说极为不利；然而，他们至少是我们熟悉且有许多联系的民族。而且，也许吞下我们的骄傲比面对他们的刀剑更可取。"
 secure_venetia_mission_event.28.t:0 "[GetCountry('VNT').GetName] 请求臣服"
 secure_venetia_mission_event.29.a:0 "是时候召集军队了"
 secure_venetia_mission_event.29.desc:0 "看来塞诺曼尼粗鲁地拒绝了我们的保护提议，并切断了与我们的联系！\n鉴于他们的土地对我们的重要性，只有一个可能的结果……"
 secure_venetia_mission_event.29.t:0 "[GetCountry('CNM').GetName] 拒绝！"
 secure_venetia_mission_event.67.a:0 "我们必须发出要求，他们肯定会接受"
 secure_venetia_mission_event.67.desc:0 "我们的商人长期以来一直在向 [SCOPE.GetRootScope.GetCountry.GetRulerTitle] 施压，要求获得更多土地以建立前哨站，迫使 [SCOPE.GetRootScope.GetCountry.GetName] 夺取 [GetProvince('(int32)470').GetName] 岛。从我们的新前哨站面对伊庇鲁斯海岸，我们现在有能力利用我们的力量迫使伊庇鲁斯屈服于商业臣服。这不仅将极大丰富我们的商人，还将为更大的目标——希腊本身——敞开大门。"
 secure_venetia_mission_event.67.t:0 "向 [GetCountry('EPI').GetName] 施压以获取殖民地"
 secure_venetia_mission_event.68.a:0 "我们无法阻止他们的扩张。或许屈服更好"
 secure_venetia_mission_event.68.b:0 "这些蛮族想要什么？"
 secure_venetia_mission_event.68.b.tt:0 "[GetCountry('VNT').GetName] 可能会对我们宣战"
 secure_venetia_mission_event.68.desc:0 "从亚得里亚海的北部，一个蛮族势力突然出现。长期以来只是简单的贸易民族，[GetCountry('VNT').GetAdjective] 似乎屈服于他们的商业贪婪，开始打造一个贸易帝国。他们现在将目光投向了我们。\n来自 [GetCountry('VNT').GetName] 的代表团接触了我们的 [GetCountry('EPI').GetRulerTitle]，给了我们一个最后通牒：承认他们的力量并允许我们在伊庇鲁斯海岸建立殖民地，否则后果自负。"
 secure_venetia_mission_event.68.t:0 "[GetCountry('VNT').GetName] 请求殖民地"
 secure_venetia_mission_event.69.a:0 "看来我们必须通过武力夺取海岸"
 secure_venetia_mission_event.69.desc:0 "伊庇鲁斯王国拒绝了我们慷慨的要求，固执地优先考虑他们的主权。不幸的是，伊庇鲁斯人阻碍了我们进入地中海的道路，在这种情况下，我们的选择受限于形势。\n我们别无选择，只能通过武力夺取伊庇鲁斯海岸。"
 secure_venetia_mission_event.69.t:0 "[GetCountry('EPI').GetName] 拒绝！"
 secure_venetia_mission_event.70.a:0 "让我们看看是否有希腊国家承认我们的力量……"
 secure_venetia_mission_event.70.desc:0 "长期以来，我们的人民在外国势力和威胁中挣扎求存，总是处于其他更伟大文明的阴影之下。然而，现在，我们商人阶层的雄心使 [SCOPE.GetRootScope.GetCountry.GetName] 达到了前所未有的力量和财富水平，将我们带到了伟大的希腊文明的门前。现在，我们的伟大国家幅员辽阔，要求希腊人承认我们的力量是理所当然的。\n让他们看看爱琴海及其丰富的贸易真正属于谁！"
 secure_venetia_mission_event.70.t:0 "要求希腊人臣服"
 secure_venetia_mission_event.72.a:0 "让我们与这个新势力结盟"
 secure_venetia_mission_event.72.b:0 "让我们送上贡品，以免他们攻击我们"
 secure_venetia_mission_event.72.c:0 "这些蛮族的胆大妄为！"
 secure_venetia_mission_event.72.desc:0 "威尼托人长期以来是一个安静的蛮族民族。据传说，他们是特洛伊战败后由帕弗拉格尼亚王子安特诺尔带领到此的安特诺尔之子，满足于在亚得里亚海的尽头生活和贸易，倾向于贸易而非战争。\n然而，现在，[GetCountry('VNT').GetName] 的蛮族威尼托国家迅速在亚得里亚海建立了帝国，以获取海上贸易财富的名义征服了所有挡路者。现在他们已经到达了希腊的边缘。我们的政府收到了来自 [GetCountry('VNT').GetName] 的代表团，[GetCountry('VNT').GetAdjective] 提出了一个看似离谱的要求：\n\n承认 [GetCountry('VNT').GetName] 的力量，并屈膝臣服。"
 secure_venetia_mission_event.72.t:0 "[GetCountry('VNT').GetName] 进入希腊"
 secure_venetia_mission_event.73.a:0 "希望我们的收购成功"
 secure_venetia_mission_event.73.desc:0 "[GetProvince('(int32)144').GetName] 港口就在我们的边界对面，但我们可以看到，如果我们控制了它，我们可以将其用于出口，使其成为一个真正的港口城市，就像它曾经那样。由于我们一直在努力争取并改善与 [GetProvince('(int32)144').GetName] 当前所有者的关系，我们现在有能力看看他们是否愿意接受以一定价格让渡该定居点。\n现在，我们的外交官代表国家被派往斯皮纳港口进行交易。"
 secure_venetia_mission_event.73.t:0 "请求购买斯皮纳"
 secure_venetia_mission_event.74.a:0 "一笔非常慷慨的交易！"
 secure_venetia_mission_event.74.a.tt:0 "#Y [GetProvince('(int32)144').GetName]#! 将归于 #Y [GetCountry('VNT').GetName]#! 的控制。\n[GetCountry('VNT').GetName] 将支付 [ROOT.GetCountry.GetName] #Y 300#! 金币。"
 secure_venetia_mission_event.74.b:0 "放弃 [GetProvince('(int32)144').GetName] 对我们不利"
 secure_venetia_mission_event.74.desc:0 "来自 [GetCountry('VNT').GetName] 的代表团提出了一个有趣的提议，购买位于 [GetProvince('(int32)144').GetName] 的斯皮纳港口。当然，代表保证付款会非常慷慨。\n考虑到该地区的相对价值，这对我们来说可能是一笔好交易。然而，我们必须看看威尼托人计划用它做什么……"
 secure_venetia_mission_event.74.t:0 "[GetCountry('VNT').GetName] 提出购买 [GetProvince('(int32)144').GetName]"
 secure_venetia_mission_event.75.a:0 "现在是时候开放港口并盈利了！"
 secure_venetia_mission_event.75.desc:0 "斯皮纳港口现已归于 [GetCountry('VNT').GetAdjective] 控制，未来通过该港口的所有贸易也是如此！\n[GetCountry('VNT').GetAdjective] 的规划者已经前往现场，研究如何再次将该港口扩展成一个伟大的港口。"
 secure_venetia_mission_event.75.t:0 "成功购买！"
 secure_venetia_mission_event.76.a:0 "让我们向 [GetCountry('ASP').GetName] 发送这个最后通牒"
 secure_venetia_mission_event.76.desc:0 "希腊城市 $ASP$ 长期以来一直是我们的眼中钉，由于他们靠近我们最近的港口，切断了我们商人的利润。然而，我们并不认为我们两国之间的冲突是不可避免的。\n我们的外交官已经准备好了一份协议，送给 $ASP_ADJ$，提出最后一次进入稳定、互利安排的机会，否则将采取更激烈的措施。"
 secure_venetia_mission_event.76.t:0 "与 [GetCountry('ASP').GetName] 的安排"
 secure_venetia_mission_event.761.a:0 "我们无法对抗 [GetCountry('VNT').GetName]"
 secure_venetia_mission_event.761.b:0 "是时候一劳永逸地阻止这些可恶的威尼托人了……"
 secure_venetia_mission_event.761.b.tt:0 "#Y [GetCountry('VNT').GetName]#! 将对我们宣战"
 secure_venetia_mission_event.761.desc:0 "我们长期以来与西北的威尼托部落共存，有时与他们交易，有时从本应通过他们城市的琥珀贸易中获利。\n然而，现在他们似乎在 $VNT$ 的旗帜下团结起来，并认为我们当前的安排有问题。\n来自 [GetCountry('VNT').GetName] 的代表团带着最后通牒来到我们的议会：与 $VNT$ 签订不利贸易协议并臣服于他们的力量，否则他们将采取更激烈的措施。"
 secure_venetia_mission_event.761.t:0 "[GetCountry('VNT').GetName] 寻求安排"
 secure_venetia_mission_event.77.a:0 "如果他们拒绝和平加入我们……"
 secure_venetia_mission_event.77.desc:0 "唉，[GetCountry('ASP').GetName] 拒绝了我们和平与友谊的提议。因此，接下来的行动是不可避免的，因为我们必须不惜一切代价确保我们的亚得里亚海贸易。"
 secure_venetia_mission_event.77.t:0 "[GetCountry('ASP').GetName] 拒绝！"
 secure_venetia_mission_event.78.a:0 "让我们看看 [GetCountry('ANO').GetName] 是否接受我们的提议"
 secure_venetia_mission_event.78.b:0 "让我们看看 $ANO$ 的领主是否接受我们的提议"
 secure_venetia_mission_event.78.desca:0 "[GetProvince('(int32)117').GetName] 城被敌对民族包围，毫无疑问会对他们造成很大伤害；另一方面，我们可以保护他们的人民，当然从中获得他们贸易利润的一小部分。\n让我们向 [GetCountry('ANO').GetName] 发送保护提议，以便我们为双方共同利益保护这座城市。"
 secure_venetia_mission_event.78.descb:0 "[GetProvince('(int32)117').GetName] 城被外国势力控制，城市的维护和防御被忽视，$ANO_ADJ$ 居民容易受到强盗和海盗的侵害。显然，当前的城市占领者无法保证其安全。\n另一方面，如果我们介入，我们将能够给予 $ANO_ADJ$ 很大的自治权，让他们再次发展自己的城市，同时提供我们的民兵和船只的安全保障。当然，我们必须首先说服他们的当前领主将城市割让给我们，为此我们已经筹集了资金。"
 secure_venetia_mission_event.78.t:0 "提供 $ANO$ 保护"
 secure_venetia_mission_event.79.a:0 "这样的协议可能对我们的城市有益"
 secure_venetia_mission_event.79.b:0 "将我们的商业利润送给 [GetCountry('VNT').GetName] 不符合我们的利益！"
 secure_venetia_mission_event.79.desc:0 "面对席卷意大利中部的 $ROM_ADJ$ 军事机器，以及从西部威胁我们的激进伊特鲁里亚人，我们处于脆弱的境地。\n因此，[GetCountry('VNT').GetName] 提出保护我们的城市免受外部势力侵害可能是一种福音。然而，付出的代价——部分主权和利润分成——可能对我们来说太不利，无法接受他们的交易。"
 secure_venetia_mission_event.79.t:0 "[GetCountry('VNT').GetName] 提出保护我们！"
 secure_venetia_mission_event.80.a:0 "真遗憾"
 secure_venetia_mission_event.80.desca:0 "尽管我们的保护提议有诸多好处，[GetProvince('(int32)117').GetName] 城似乎拒绝了我们的提议，选择优先维护他们的主权。"
 secure_venetia_mission_event.80.descb:0 "尽管我们的保护提议有相互的好处，[SCOPE.sCountry('owner_of_ankona_city').GetName] 似乎拒绝了我们的提议，选择继续保有 [GetProvince('(int32)117').GetName] 城。"
 secure_venetia_mission_event.80.t:0 "[SCOPE.sCountry('owner_of_ankona_city').GetName] 拒绝"
 secure_venetia_mission_event.81.a:0 "面对这样的诱惑，持有 [GetProvince('(int32)117').GetName] 真的值得麻烦吗？"
 secure_venetia_mission_event.81.b:0 "我们没有兴趣助长 [GetCountry('VNT').GetName] 的野心"
 secure_venetia_mission_event.81.desc:0 "我们意外地收到了来自 [GetCountry('VNT').GetName] 的代表团，请求控制 [GetProvince('(int32)117').GetName] 城。\n他们说他们希望接管城市的治理，称我们自己对它几乎没有需求。当然，他们愿意支付一大笔钱来甜化这笔交易。"
 secure_venetia_mission_event.81.t:0 "[GetCountry('VNT').GetName] 寻求对 [GetProvince('(int32)117').GetName] 的保护"
 secure_venetia_mission_event.82.a:0 "让我们看看是否有伊利里亚人接受"
 secure_venetia_mission_event.82.desc:0 "当我们凝视亚得里亚海对岸，我们羡慕地看着希腊殖民国家，如凯尔索斯、法罗斯和利萨。这是希腊人成功的秘密吗？通过海上建立永久联系，之后用于贸易？\n这个问题促使 [GetCountry('VNT').GetName] 的商人阶层对我们的政府施加巨大压力，试图模仿希腊的殖民建设方法，现在已经制定了一个计划，在伊利里亚海岸获取土地以建立这样的殖民地。现在我们只需要看看这些土地的当前所有者是否愿意用金币交易它们，以实现我们的计划。"
 secure_venetia_mission_event.82.t:0 "渴望亚得里亚海殖民地"
 secure_venetia_mission_event.83.a:0 "多么受欢迎的交易！"
 secure_venetia_mission_event.83.b:0 "他们在这里找不到这样的交易！"
 secure_venetia_mission_event.83.desc:0 "看来 [GetCountry('VNT').GetName] 对伊利里亚海岸的土地有很大兴趣，并提出用一大笔金币交换。当然，这意味着这片土地可能比我们最初想的更有价值；另一方面：金币。"
 secure_venetia_mission_event.83.t:0 "[GetCountry('VNT').GetName] 提出购买我们的海岸"
 secure_venetia_mission_event.84.a:0 "现在我们的提议和付款已送出……"
 secure_venetia_mission_event.84.desc:0 "我们的商人迫切希望看到伊利里亚希腊落入 [SCOPE.GetRootScope.GetCountry.GetAdjective] 手中，作为地中海进一步贸易的据点和建立新殖民地的土地，他们甚至愿意与国家一起出资购买对该地区的控制权。\n如此大规模的商业化土地夺取尝试是前所未有的；然而，这确实显示了我们的贸易者愿意承担的风险。当然，如果他们要在这项努力中取得成功，[SCOPE.GetRootScope.GetCountry.GetAdjective] 国有责任支持他们。\n当我们的代表带着该地区的首付款出发时，我们只能希望成功。"
 secure_venetia_mission_event.84.t:0 "对伊利里亚希腊的提议"
 secure_venetia_mission_event.85.a:0 "有了这样的财富，我们将欢迎我们的新 [GetCountry('VNT').GetAdjective] 领主"
 secure_venetia_mission_event.85.a_tt:0 "您的国家将为 [GetCountry('VNT').GetName] 购买的 #Y $illyria_graeca_area$#! 中的每块领土获得 #Y 100#! 金币"
 secure_venetia_mission_event.85.b:0 "有了这么一大笔金币，我们可能没有这些土地也能过得更好"
 secure_venetia_mission_event.85.b_tt:0 "您的国家将为 [GetCountry('VNT').GetName] 购买的 #Y $illyria_graeca_area$#! 中的每块领土获得 #Y 100#! 金币"
 secure_venetia_mission_event.85.c:0 "如果我们留下这些钱会怎样？"
 secure_venetia_mission_event.85.c_tt:0 "您的国家将为 [GetCountry('VNT').GetName] 追求的 #Y $illyria_graeca_area$#! 中的每块领土夺取 #Y 100#! 金币的付款"
 secure_venetia_mission_event.85.d:0 "我们绝不会为了金币放弃 $illyria_graeca_area$！"
 secure_venetia_mission_event.85.d_tt:0 "付款将退还给 #Y [GetCountry('VNT').GetName]#!"
 secure_venetia_mission_event.85.desc:0 "[GetCountry('VNT').GetName] 的外交官向我们提出了一个雄心勃勃的提议。他们希望通过购买获得整个 $illyria_graeca_area$ 地区。为了表明决心，他们的商人带来了巨额付款，希望成功说服我们将领土割让给 [GetCountry('VNT').GetName]。\n他们的提议可能很诱人，换来一大笔钱；然而，他们要求的土地非常广泛。"
 secure_venetia_mission_event.85.t:0 "[GetCountry('VNT').GetName] 渴望伊利里亚希腊"
 secure_venetia_mission_event.86.a:0 "希望他们能看到这种安排的必要性"
 secure_venetia_mission_event.86.desc:0 "我们长期以来与雷托人共存，定期与他们交易，甚至与南下的雷托贸易者和北上的我们的人混杂在一起。然而，现在我们意识到他们在阿尔卑斯的受保护存在可能接近尾声。随着凯尔特部落包围并骚扰 [GetCountry('RAE').GetName] 的土地，即使与他们结盟也可能无法拯救我们的老贸易伙伴。\n但是，如果我们能说服我们的新盟友与我们达成保护安排，我们可以派遣我们的士兵直接巡逻并保护他们的边境，抵御凯尔特的侵扰。此外，如果通过他们土地的琥珀路线被切断，我们也将直接受损。"
 secure_venetia_mission_event.86.t:0 "对 $RAE$ 的保护"
 secure_venetia_mission_event.87.a:0 "我们需要 [GetCountry('VNT').GetAdjective] 士兵保护我们的边境"
 secure_venetia_mission_event.87.b:0 "外国人应该保持距离"
 secure_venetia_mission_event.87.b.tt:0 "如果他们持有 #Y 好战#! 外交立场，[GetCountry('VNT').GetName] 可能会对我们宣战"
 secure_venetia_mission_event.87.desc:0 "我们在山区的家园目前处于危险境地，周围的激进凯尔特部落威胁要跨境进行突袭，甚至全面入侵我们的土地。作为帮助，我们的新盟友 [GetCountry('VNT').GetName] 提出通过派遣他们的军队守卫我们的边境来协助我们。\n然而，这将以我们完全主权的代价换取。"
 secure_venetia_mission_event.87.t:0 "[GetCountry('VNT').GetName] 提供军事保护"
 secure_venetia_mission_event.88.a:0 "至少让我们保证他们的独立"
 secure_venetia_mission_event.88.b:0 "我们将以某种方式确保北部通道……"
 secure_venetia_mission_event.88.desc:0 "看来 [GetCountry('RAE').GetName] 拒绝了我们更直接保护的提议，理由是担心维持他们的完全独立。看来我们无法直接控制他们的安全，将由 [GetCountry('RAE').GetAdjective] 自己保护他们的土地，以及通过其中的宝贵贸易。"
 secure_venetia_mission_event.88.t:0 "[GetCountry('RAE').GetName] 拒绝"
 secure_venetia_mission_event_101_tt:0 "[GetCountry('ROM').GetName]派遣#Y $roman$#!殖民者前往[GetProvince('(int32)3606').GetName]定居\n[GetProvince('(int32)3606').GetName]的名称将变更。\n[GetProvince('(int32)3606').GetName]将获得一座#Y $fortress_building$#!"
 secure_venetia_mission_task_1:0 "收复阿德里亚"
 secure_venetia_mission_task_10:0 "向罗马宣誓效忠"
 secure_venetia_mission_task_10_DESC:0 "罗马的强大已显而易见。他们的扩张欲望无止境，军队无人能挡。而我们威尼托人分散且内讧，接受这样一个大国的管理可能对我们有益。此外，罗马的统治或许还能带来商业机会……\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 secure_venetia_mission_task_10_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 与 #Y [GetCountry('ROM').GetName]#! 接壤。"
 secure_venetia_mission_task_11:0 "联合伊特鲁里亚"
 secure_venetia_mission_task_11_DESC:0 "中部意大利面临一个激进的新对手，我们的老敌伊特鲁里亚人也受到攻击。现在或许是修补关系、共同应对威胁的好时机。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 secure_venetia_mission_task_12:0 "伊特鲁里亚保护"
 secure_venetia_mission_task_12_DESC:0 "罗马的战争机器已逼近我们的家门，我们单独难以抵挡这股不可阻挡的力量。越来越清楚，我们必须不惜一切代价寻求伊特鲁里亚的永久保护，即便这意味着向老对手低头。\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 secure_venetia_mission_task_12_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 与 #Y [GetCountry('ETR').GetName]#! 接壤。"
 secure_venetia_mission_task_13:0 "威尼托霸权"
 secure_venetia_mission_task_13_DESC:0 "我们周围一片混乱，强敌威胁我们。我们虽结成新联盟，但盟友对我们的土地怀有恶意。我们不会屈服。我们在外交上务实，但自由必须优先。若必须先发制人消灭威胁，那就如此吧。\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 secure_venetia_mission_task_14:0 "有利外交"
 secure_venetia_mission_task_14_DESC:0 "我们的外交努力似乎有了回报，尽管付出代价。我们应确保没有忽视邻国的动向。此时放松警惕将是愚蠢的！\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 secure_venetia_mission_task_14_tt:0 "#Y [GetCountry('ROM').GetName]#! 或 #Y [GetCountry('ETR').GetName]#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感至少为 #Y 90#!，或两者均不存在。"
 secure_venetia_mission_task_15:0 "威尼托安全"
 secure_venetia_mission_task_15_DESC:0 "联盟已稳固，地缘政治地位已确立，现在只需巩固尚未归于我们统治的威尼托土地。一旦所有土地安全，特蒙防线妥善设防，威尼托将坚不可摧！\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 secure_venetia_mission_task_16:0 "罗马之道"
 secure_venetia_mission_task_16_DESC:0 "我们作为罗马帝国一部分的时间越长，越能看到罗马事物的价值。从建造水渠和道路，到精致的罗马演说，甚至他们的神都颇具吸引力……\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 secure_venetia_mission_task_16_tt_1:0 "#Y [GetCountry('ROM').GetCapital.GetName]#! 的文明等级达到 #Y 40#! 或以上。"
 secure_venetia_mission_task_16_tt_2:0 "#Y [GetCountry('ROM').GetName]#! 拥有 #Y 10#! 或更多省份。"
 secure_venetia_mission_task_17:0 "摧毁凯尔索斯"
 secure_venetia_mission_task_17_DESC:0 "希斯特里人已被我们征服，我们可进一步关注亚得里亚海岸。伊利里亚海盗问题虽仍困扰我们，但更紧迫的是希腊殖民地凯尔索斯。他们不仅统治着合法的希斯特里-威尼托土地，还作为我们门前的商业竞争者，转移了本应属于我们的货物和利润！这不能容忍。\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 secure_venetia_mission_task_17_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 完全控制 #Y $histria_area$#! 地区，包括 #Y [GetProvince('(int32)4034').GetName]#!。"
 secure_venetia_mission_task_18:0 "上伊利里亚海岸"
 secure_venetia_mission_task_18_1:0 "[SCOPE.GetRootScope.GetCountry.GetName] 完全拥有 #Y $dalmatia_occidentalis_area$#! 地区。"
 secure_venetia_mission_task_18_2:0 "#Y $dalmatia_centralis_area$#! 地区至少 #Y 5#! 个省份由 [SCOPE.GetRootScope.GetCountry.GetName] 拥有。"
 secure_venetia_mission_task_18_DESC:0 "伊利里亚海盗和匪徒长期霸占亚得里亚海，骚扰我们的合法水道，干扰珍贵贸易。够了！我们有能力终结这一切，向伊利里亚人展示谁才是亚得里亚海的真正主人！\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 secure_venetia_mission_task_19:0 "控制塞诺曼尼亚"
 secure_venetia_mission_task_19_DESC:0 "虽然我们与塞诺曼尼的联盟至今成果丰硕，但他们保卫塞诺曼尼亚土地的能力令人质疑。作为我们曾经的土地，且位于我们最重要的城市边界，我们不能将此区域的安全留给偶然。只有更直接控制我们的旧地，才能确保边界无盲点。\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 secure_venetia_mission_task_19_tt1:0 "#E [GetCountry('CNM').GetName]#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感大于或等于 #Y 110#!。"
 secure_venetia_mission_task_19_tt2:0 "[SCOPE.GetRootScope.GetCountry.GetName] 已征服 #Y $east_insubria_area$#! 地区。"
 secure_venetia_mission_task_1_DESC:0 "阿德里亚城历史悠久，先由伊特鲁里亚人建设，后被来自埃吉纳和叙拉古的希腊人殖民，如今落入凯尔特利戈尼部落控制。然而，我们是最早定居阿德里亚的民族，尽管与许多高卢部落关系友好，阿德里亚及西部地区必须重归维涅托控制。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 secure_venetia_mission_task_2:0 "占领山口"
 secure_venetia_mission_task_20:0 "预防性扩张"
 secure_venetia_mission_task_20_DESC:0 "我们的边界不能依靠他人的武力来保卫。在如此危险的处境中，周围尽是敌对国家，唯一确保不被突袭的方法是先发制人。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 secure_venetia_mission_task_20_tt:0 "任意已拥有省份拥有[GetBuilding('barracks_building').GetName|Y]建筑。"
 secure_venetia_mission_task_21:0 "对抗塞诺曼尼亚"
 secure_venetia_mission_task_21_DESC:0 "塞诺曼尼人对威尼托人是一种侮辱。几个世纪前，他们来到我们祖先的边界，夺取了维罗纳城，使我们的大城市面临威胁。我们通过与这个部落建立友好关系来确保安全，但他们的土地本应属于我们，据说曾由我们的祖先持有。因此，重新夺回塞诺曼尼的土地不仅是必要，也是纠正历史错误。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 secure_venetia_mission_task_22:0 "摧毁塞诺曼尼"
 secure_venetia_mission_task_22_DESC:0 "够了！他们在我们合法的维罗纳城堡中嘲笑我们！不再容忍！我们将摧毁他们的军队，将他们驱逐出我们的视线！\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 secure_venetia_mission_task_22_tt:0 "#Y [GetCountry('CNM').GetName]#! 已被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 完全征服。"
 secure_venetia_mission_task_23:0 "夺取斯皮纳和费尔西纳"
 secure_venetia_mission_task_23_DESC:0 "南方的古老伊特鲁里亚城市长期影响我们，赋予我们文字和与意大利的贸易通道，我们深知通过控制这些琥珀贸易末端的枢纽可获得财富。拥有斯皮纳、费尔西纳和凯乌纳，我们将完全掌控对意大利的琥珀出口！\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 secure_venetia_mission_task_23_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 已征服包括 #Y [GetProvince('(int32)142').GetName]#!、#Y [GetProvince('(int32)144').GetName]#!、#Y [GetProvince('(int32)146').GetName]#! 和 #Y [GetProvince('(int32)149').GetName]#! 在内的 #Y 艾米利亚#! 城市，以及该地区另外 #Y 4#! 个省份。"
 secure_venetia_mission_task_24:0 "雷蒂亚路线"
 secure_venetia_mission_task_24_DESC:0 "雷蒂亚的土地对我们至关重要，因为我们通过这些土地从遥远的斯堪尼亚获得琥珀！通过将边界推向琥珀来源地，我们可更有效地控制这一产品的进口。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 secure_venetia_mission_task_24_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 已开辟通过雷蒂亚阿尔卑斯山的通道。"
 secure_venetia_mission_task_25:0 "保护琥珀之路"
 secure_venetia_mission_task_25_DESC:0 "我们已通过雷蒂亚开辟了一条更便捷的贸易路线；然而，雷蒂亚人并未坐视不管，我们的商队正遭受周边不受控制的雷蒂亚部落的骚扰。必须立即制止这些袭击！\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 secure_venetia_mission_task_25_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 通过征服 #Y 卡尼阿尔卑斯#! 至少 #Y 5#! 个省份和 #Y 雷蒂亚阿尔卑斯#! 至少 #Y 10#! 个省份，保护了其贸易路线。"
 secure_venetia_mission_task_26:0 "获取斯堪尼亚琥珀"
 secure_venetia_mission_task_26_DESC:0 "阿尔卑斯山的北麓已触及我们的边界，但我们面临许多竞争部落，每一个都在争夺珍贵的斯堪尼亚琥珀贸易。若能将边界进一步推向北方，我们可在这些荒野中建立据点，垄断整个地中海的琥珀进口！\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
 secure_venetia_mission_task_26_tt:0 "已清除阿尔卑斯山北侧入口，并征服 #Y 诺里库姆#! 至少 #Y 8#! 个省份。"
 secure_venetia_mission_task_27:0 "在希腊伊利里亚建立据点"
 secure_venetia_mission_task_27_DESC:0 "随着我们对亚得里亚贸易的包围几近完成，在伊利里亚南端建立据点将切断竞争对手的贸易。这是我们下一个战略步骤。\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 secure_venetia_mission_task_27_tt_1:0 "#Y [GetProvince('(int32)422').GetName]#! 和 #Y [GetProvince('(int32)415').GetName]#! 均由 [SCOPE.GetRootScope.GetCountry.GetName] 拥有。"
 secure_venetia_mission_task_27_tt_2:0 "在 #Y [GetProvince('(int32)422').GetName]#! 或 #Y [GetProvince('(int32)415').GetName]#! 建造了 #Y 市场#!。"
 secure_venetia_mission_task_28:0 "夺取达奥尔松"
 secure_venetia_mission_task_28_DESC:0 "我们的边界已深入伊利里亚海岸，触手可及达奥尔松城。这座伊利里亚贸易中心的财富川流不息，我们怎能不认为它应归我们所有。机会成熟，谁能责怪我们……\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 secure_venetia_mission_task_29:0 "在伊庇鲁斯建立殖民地"
 secure_venetia_mission_task_29.a:0 "他们定会屈服于我们的力量，"
 secure_venetia_mission_task_29_DESC:0 "控制了亚得里亚海后，东部贸易路线的下一个落脚点是伊庇鲁斯。虽然伊庇鲁斯王国强大，但在 [GetProvince('(int32)470').GetName] 夺取一个港口可展示我们的力量，说服伊庇鲁斯人允许我们在其海岸建立商贸殖民地。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 secure_venetia_mission_task_2_DESC:0 "东北部的山脉并非我们可忽视的荒地，而是好战卡尼部落的领地。他们导致我们东部边境人口减少，曾试图入侵我们的土地，未来也可能再次行动。这些土地不仅是外敌入侵的源头，也是通往重要琥珀之路的通道！若卡尼人切断琥珀来源，我们的贸易将受重创。我们绝不能允许这种情况发生！\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 secure_venetia_mission_task_2_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 已征服 #Y 卡耳尼亚#! 的土地。"
 secure_venetia_mission_task_3:0 "加固 [GetProvince('(int32)3595').GetName]"
 secure_venetia_mission_task_30:0 "巩固拉托比西亚边界"
 secure_venetia_mission_task_30_DESC:0 "征服敌对的卡尼人后，我们更好地保障了东北部通往波罗的海琥珀的路线，并利用当地矿山获利。然而，这一位置可能脆弱，山区隐藏着各种匪徒和敌对部落。因此，控制周边拉托比西亚地区以建立更远的山地防御是明智之举。\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 secure_venetia_mission_task_30_tt:0 "#Y 拉托比西亚#! 地区至少 #Y 11#! 个领土由 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有。"
 secure_venetia_mission_task_31:0 "压迫希腊人"
 secure_venetia_mission_task_31_DESC:0 "进入更广阔的东地中海后，我们直接面对希腊文明的中心。希腊人长期以来被视为力量与进步的象征，但我们稳步扩张，可能已能匹敌希腊力量！若在希腊建立一个小据点展示我们的力量，或许能说服一些较弱的希腊城邦屈服于我们不可避免的霸权。\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 secure_venetia_mission_task_32:0 "在克里特建立据点"
 secure_venetia_mission_task_32_DESC:0 "我们的商业网络迅速扩展至地中海世界。若想进一步增加现金流，错过进入近东市场的机会将是愚蠢的。埃及的谷物可养活我们日益增长的 $VNT_ADJ$ 人口，更直接获取来自印度的香料可大幅提升我们的商业利润。在克里特建立至少一个据点，将使我们开始从近东沿海城市进口这些财富。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 secure_venetia_mission_task_32_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有 #Y $crete_area$#! 地区任何领土，并建有至少一个 #Y 市场#!。"
 secure_venetia_mission_task_33:0 "扩建海军"
 secure_venetia_mission_task_33_DESC:0 "我们的舰船最近与斯巴达王子克莱奥尼莫斯率领的小型斯巴达舰队交战。虽然我们彻底击败了他们，但我们意识到希腊的大海军可触及我们，未来可能会有更大舰队对我们构成威胁。我们必须增加船只数量，使其更能应对来自南方的希腊威胁。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 secure_venetia_mission_task_34:0 "阿德里亚港口"
 secure_venetia_mission_task_34_DESC:0 "[GetProvince('(int32)3593').GetName] 城长期以来是不同文化的交汇处，许多文化从海上远道而来。因此，该城有悠久的水上建设历史，伊特鲁里亚人建造了将河水排入沼泽的渠道，希腊人则从 [GetProvince('(int32)3593').GetName] 至亚得里亚海修建了运河。若我们延续这一传统，可将 [GetProvince('(int32)3593').GetName] 打造为港口城市，吸引各地贸易，同时作为我们的舰船停靠地。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 secure_venetia_mission_task_35:0 "[GetProvince('(int32)3598').GetName] 的港口"
 secure_venetia_mission_task_35_DESC:0 "随着海军规模稳步扩大，我们需要更多空间停靠舰船。幸运的是，[GetProvince('(int32)3598').GetName] 位于我们可防御的 $VNT_ADJ$ 泻湖海岸，是新建海军港口的绝佳位置。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 secure_venetia_mission_task_36:0 "宏伟舰队"
 secure_venetia_mission_task_36_DESC:0 "$VNT_ADJ$ 海军现已足够强大，可防御大规模外敌入侵，但若想投射力量，仅有简单舰队是不够的。若大幅扩展 [SCOPE.GetRootScope.GetCountry.GetName] 的舰队，不仅能防御更强大的海军国家，还可能让我们追求海军霸权。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 secure_venetia_mission_task_37:0 "威尼托马匹育种"
 secure_venetia_mission_task_37_DESC:0 "$VNT$ 的优良马匹以无与伦比的美感和速度闻名于罗马至希腊，这是长期精心育种的结果，特别注重母马选择。然而，近几十年来我们的标准有所下降，马匹变得更慢更弱。在如今的动荡与不安全中，我们不能忽视军事上的主要优势。\n通过投入资金和时间再次提升马匹速度与耐力，并从草原进口优良特性的马匹，我们可培育出超越以往的最佳 $VNT_ADJ$ 战马。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 secure_venetia_mission_task_38:0 "艾库佩塔斯"
 secure_venetia_mission_task_38_DESC:0 "马王（艾库佩塔斯）长期是我们军事力量的支柱。这支训练有素的贵族骑兵曾在 [GetProvince('(int32)3594').GetName] 古城击败斯巴达人的袭击（尽管对方兵力分散），非常适合威尼托的平原。然而，随着我们与希腊世界及其他地区的接触增加，我们的骑兵在某些方面显得不足。尽管艾库佩塔斯精通骑兵战，但与马其顿的同伴骑兵或波斯的重装骑兵相比，他们的装备仍有不足。若我们投资新装备，并说服贵族家庭采纳新的混合与适应战术，我们的骑兵将无人能敌。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 secure_venetia_mission_task_39:0 "整合城市"
 secure_venetia_mission_task_39_DESC:0 "威尼托长期分裂，帕塔维乌姆和阿泰斯特等城市经常因商业和边界争端发生冲突。但面对四面八方的敌人和东部的卡尼人袭击，$VNT$ 的城市不能再保持分裂。让我们召集 [GetProvince('(int32)3594').GetName]、[GetProvince('(int32)3596').GetName]、[GetProvince('(int32)3595').GetName]、[GetProvince('(int32)3603').GetName] 和 [GetProvince('(int32)3598').GetName] 的城市，共同平等参与 [SCOPE.GetRootScope.GetCountry.GetName] 的治理，成立城市间委员会调解未来可能出现的争端。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 secure_venetia_mission_task_3_DESC:0 "[GetProvince('(int32)3595').GetName] 是威尼托的入口，虽有尤甘尼丘陵作为防御屏障，但一旦被突破，敌人将畅通无阻地进入我们的平原。必须立即改善 [GetProvince('(int32)3595').GetName] 的防御工事！\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 secure_venetia_mission_task_4:0 "加固卡耳尼亚"
 secure_venetia_mission_task_40:0 "支持中央政府"
 secure_venetia_mission_task_40_DESC:0 "随着我们的城市开始联合，正式中央政府的问题变得更加可行。通过争取贵族和商业精英的支持，我们终于可以迈向更集中的治理体系。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 secure_venetia_mission_task_41:0 "商业利益"
 secure_venetia_mission_task_41_DESC:0 "在思考如何构建理想政府体系时，我们可以观察盟友，了解代表制统治的好处。考虑到我们以商业为导向的文化，我们当然应当把代表权交到那些有能力带领[SCOPE.GetRootScope.GetCountry.GetName]走向巨大财富的人手中。\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 secure_venetia_mission_task_42:0 "赋予国王权力"
 secure_venetia_mission_task_42_DESC:0 "虽然我们的人民文化倾向于商人和贵族的利益，但我们从亲密盟友中看到将权力集中于一人之手的价值。因此，显而易见的选择是将权力集中于国王——我们的拉科斯，他将为 [SCOPE.GetRootScope.GetCountry.GetName] 提供智慧与稳定。当然，也会听取重要精英的建议。\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 secure_venetia_mission_task_43:0 "单一威尼托国家"
 secure_venetia_mission_task_43_DESC:0 "随着行政体系的整合，[SCOPE.GetRootScope.GetCountry.GetName] 的土地上新的法律与秩序正在蔓延。我们的城市争端减少，旅行更安全，威尼托各地被忽视的边境匪患减少。记录的标准化使地方治理更可控，$VNT_ADJ$ 人民中兴起了一种统一的身份感。现在只需最终完成行政改革，我们就能真正宣布自己为单一的统一国家。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 secure_venetia_mission_task_44:0 "罗马殖民"
 secure_venetia_mission_task_44_DESC:0 "我们的土地人口稀少，难以控制乡村，而罗马的城市人满为患。我们的罗马领主至今仁慈，若我们为潜在殖民者提供少量金钱激励，请求殖民者填充我们的土地，定不会被拒绝……\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 secure_venetia_mission_task_45:0 "伊特鲁里亚移民"
 secure_venetia_mission_task_45_DESC:0 "随着时间推移，我们与新领主的关系日益友好。看着我们空旷的边境，我们看到了利用友谊的机会。若以金钱激励 [GetCountry('ETR').GetName]，他们可能愿意派遣移民填充我们的土地。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 secure_venetia_mission_task_46:0 "城市化计划"
 secure_venetia_mission_task_46_DESC:0 "我们渴望达到意大利同胞的伟大，但我们的城市与 [GetCountry('ROM').GetName] 或 [GetCountry('ETR').GetName] 相比黯然失色。若要建造如此宏伟的城市，我们首先需要城市劳动力。若投入资源进行大规模城市化计划，借鉴意大利盟友的历史，我们可能提升城市人口，获得投资公共工程的人力。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 secure_venetia_mission_task_47:0 "伊利里亚内陆"
 secure_venetia_mission_task_47_DESC:0 "随着伊利里亚海岸大部分受我们控制，贸易船只的威胁已显著减少；然而，我们在伊利里亚的地位尚未稳固。只有将与伊利里亚部落的边界进一步推离海岸，才能确保他们无法再次从事海盗活动。\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 secure_venetia_mission_task_47_tt_1:0 "#Y $dalmatia_orientalis_area$#! 地区已被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 完全征服。"
 secure_venetia_mission_task_47_tt_2:0 "#Y $savia_orientalis_area$#! 地区已被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 完全征服。"
 secure_venetia_mission_task_48:0 "购买斯皮纳"
 secure_venetia_mission_task_48_DESC:0 "斯皮纳长期是亚得里亚海意大利海岸的重要出口中心，连接南北意大利的货物进出。过去斯皮纳的重要性仅因希腊对阿德里亚的投资而削弱。若我们控制此城，可扩展其港口，使其更具盈利能力。或许其当前拥有者愿意以一定价格出售……\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 secure_venetia_mission_task_49:0 "与凯尔索斯达成协议"
 secure_venetia_mission_task_49_DESC:0 "长期以来，希腊城邦凯尔索斯与我们在亚得里亚海顶端的贸易竞争，但这种竞争琐碎且不利于生意。现在我们更强大，或许可利用地位与凯尔索斯达成有利协议。当然，我们会让其觉得值得。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 secure_venetia_mission_task_4_DESC:0 "卡尼娅已受我们控制，我们掌握了另一个可保障商路的据点。然而，我们应确保其长期留在威尼托手中。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 secure_venetia_mission_task_5:0 "征服希斯特里"
 secure_venetia_mission_task_50:0 "保护安科纳"
 secure_venetia_mission_task_50_DESC:0 "安科纳是意大利中部亚得里亚海岸的战略贸易城市，我们与之有良好贸易。其港口令人印象深刻，是亚得里亚海最佳港口之一。然而，随着罗马等大国的崛起，其政治地位削弱，贸易潜力可能被浪费。我们应利用局势，投资建立对安科纳市民的保护国。\n\n\n\n\n\n\n\n\n\n@italic_mil25!"
 secure_venetia_mission_task_51:0 "在伊利里亚建立殖民地"
 secure_venetia_mission_task_51_DESC:0 "若要效仿希腊建立广泛贸易网络的成功，模仿希腊建立贸易殖民地的做法可能是明智的。若能说服达尔马提亚海岸的伊利里亚部落以高价出售土地，我们可能有机会建立繁荣的贸易中心。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 secure_venetia_mission_task_52:0 "购买希腊伊利里亚"
 secure_venetia_mission_task_52_DESC:0 "我们对海上贸易的控制正逐步迈向开放的地中海，但若要确保亚得里亚贸易的垄断，必须控制我们的海域入口。以武力夺取代价高昂，但若筹集巨额资金，可能通过金钱收购希腊伊利里亚的土地。\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 secure_venetia_mission_task_53:0 "对抗迦太基"
 secure_venetia_mission_task_53_DESC:0 "我们曾经只是一个由部落城邦组成的弱小集合，但如今我们的国家$VNT$已崛起为真正的海上帝国。然而，在地中海的水域中，我们并非独霸一方。在遥远的西部，北非海岸的迦太基长期以来一直主宰着贸易和海军力量，他们辉煌城市的故事常常传到我们的港口。然而，这并不能阻挡我们的雄心，因为我们将向迦太基人证明，随着$VNT$帝国的崛起，他们的辉煌时代即将终结。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 secure_venetia_mission_task_53_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有的船只数量超过 #Y $CAR$#!"
 secure_venetia_mission_task_53_tt_2:0 "[SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 的人口超过 #Y [GetCountry('CAR').GetCapital.GetName]#!"
 secure_venetia_mission_task_53_tt_3:0 "$VNT$ 已形成 #Y $VENETIC_LEAGUE$#! 或 #Y $VENETIC_EMPIRE$#!"
 secure_venetia_mission_task_54:0 "全国防御"
 secure_venetia_mission_task_54_DESC:0 "尽管我们在威尼托平原两端的防御工事在一定程度上保护了我们最重要的城市，但我们的新领地仍然容易受到外国袭击和敌对邻国的攻击。如果我们能在防御工事建设中实施某些广泛的标准，采用凯尔特人在建造烦人山堡时的一些技术，并增加我们新领地中的堡垒数量，我们或许能够围绕我们的领土建立一个没有弱点的防御链。\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 secure_venetia_mission_task_55:0 "雷托联盟"
 secure_venetia_mission_task_55_DESC:0 "我们与雷托部落的关系悠久而复杂。这些人自古以来就居住在我们北方的山区，沿我们北部边境发生了多次小规模冲突，但也带来了贸易和旅行者穿越我们的领土。现在，我们的目光聚焦于北方的群山和南方的海岸，是时候与我们的老邻居建立更永久的关系了。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 secure_venetia_mission_task_56:0 "保护雷蒂亚"
 secure_venetia_mission_task_56_DESC:0 "随着我们与 [GetCountry('RAE').GetName] 的商业联系加强，来自北欧的琥珀通过 [GetCountry('RAE').GetAdjective] 领土的流量也在增加。然而，考虑到他们薄弱的军事力量，如果 [GetCountry('RAE').GetName] 遭到攻击，我们随时可能失去这一商业增长。作为一个拥有更大、更组织化防御手段的国家，我们有责任确保通过雷托的阿尔卑斯路线的安全。此外，这对 [GetCountry('RAE').GetName] 和我们自己都是有利的。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 secure_venetia_mission_task_57:0 "城市复兴"
 secure_venetia_mission_task_57_DESC:0 "威尼托的城市已从卡尼人和高卢人的入侵中恢复过来。现在我们有机会利用这些收益，重新投资于振兴一些更重要的城市中心。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 secure_venetia_mission_task_57_completion_tt:0 "若 [SCOPE.GetRootScope.GetCountry.GetName] 为部落，将获得 #Y 中央化#!。若非部落，#E [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得 #Y 稳定#!。"
 secure_venetia_mission_task_57_tt:0 "在 #Y $ferraria_area$#! 或 #Y $venetia_area$#! 地区至少建立 #Y 1#! 座城市，同时拥有这两个地区。"
 secure_venetia_mission_task_58:0 "阿泰斯特青铜桶"
 secure_venetia_mission_task_58_DESC:0 "[GetProvince('(int32)3595').GetName] 以青铜桶之城闻名北意大利，几个世纪以来一直制作装饰精美的青铜桶（situla），用于实用、仪式或奉献。然而，威尼托并非唯一生产青铜桶的地区，凯尔特人和伊特鲁里亚人的竞争可能盖过 [GetProvince('(int32)3595').GetName] 的作品。必须借鉴竞争者的技艺和希腊艺术，提升阿泰斯特生产的青铜桶。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 secure_venetia_mission_task_58_completion_tt:0 "[GetProvince('(int32)3595').GetName] 将加剧其青铜桶的生产。"
 secure_venetia_mission_task_58_tt:0 "#Y $ferraria_area$#! 正在进口 #Y $base_metals$#!。"
 secure_venetia_mission_task_59:0 "帕多瓦布料"
 secure_venetia_mission_task_59_DESC:0 "虽然维罗纳和阿德里亚等周边城市目前控制 $cisalpine_gaul_region$ 的纺织生产，但这可能改变。[GetProvince('(int32)3594').GetName] 是该地区最古老的城市之一，但目前在手工制品生产上落后于竞争者。若帕多瓦人投资生产布料，可利用充足的 [SCOPE.GetRootScope.GetCountry.GetAdjective] 羊毛，专注于布料生产，超越其他城市，成为 $cisalpine_gaul_region$ 最重要的布料生产中心。\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
 secure_venetia_mission_task_59_completion_tt:0 "[GetProvince('(int32)3594').GetName] 将开始生产 #Y $cloth$ @cloth!#!。"
 secure_venetia_mission_task_59_tt:0 "#Y $ferraria_area$#! 正在进口 #Y $cloth$#! 或 #Y $cattle$#!。"
 secure_venetia_mission_task_5_DESC:0 "威尼托远非统一国家，南方希斯特里人尤其麻烦。受伊利里亚人影响，我们的希斯特里同胞已成为野蛮海盗！为了我们的商人，必须立即制止并征服他们！\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 secure_venetia_mission_task_5_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 完全征服了 #Y [GetCountry('HIS').GetName]#! 国家。"
 secure_venetia_mission_task_6:0 "联合凯尔特部落"
 secure_venetia_mission_task_60:0 "阿奎莱亚的罗马殖民地"
 secure_venetia_mission_task_60_DESC:0 "$venetia_area$ 的东部荒凉且无防备。卡耳尼亚人不断袭击使该地区人口稀少，对我们的商人危险。然而，与罗马的友谊提供了机会。若充分争取 $ROM$，我们可说服 $ROM_ADJ$ 元老院在 [GetProvince('(int32)3606').GetName] 建立殖民地，以保护我们核心的 $VNT_ADJ$ 土地。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 secure_venetia_mission_task_60_completion_tt:0 "[GetCountry('ROM').GetName] 将在我们的 [GetProvince('(int32)3606').GetName] 领土设立殖民地，派遣 #Y $roman$#! 文化的 #Y 殖民者#!，"
 secure_venetia_mission_task_61:0 "旅行者据点"
 secure_venetia_mission_task_61_DESC:0 "琥珀之路为 [SCOPE.GetRootScope.GetCountry.GetAdjective] 商人提供了许多财富机会；然而，通往贸易路线北端的路径之一需穿越寒冷险峻的多洛米蒂山脉。许多商人在启程前会在 [GetProvince('(int32)3604').GetName] 的拉戈莱休息并向神特鲁姆西亚特祈祷安全。若我们扩展这一据点，将深受商人和贸易者的欢迎，甚至可能增强他们的旅程力量，提升商业成功率。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 secure_venetia_mission_task_61_completion_tt:0 "[GetProvince('(int32)3604').GetName] 领土的商人据点将得到投资，"
 secure_venetia_mission_task_62:0 "扩展琥珀贸易"
 secure_venetia_mission_task_62_DESC:0 "琥珀之路是威尼托的巨大财富来源，从阿尔卑斯山以北获取琥珀，销售至亚得里亚海。据说我们的琥珀甚至远达埃及！我们必须优先尽一切努力扩展贸易，首步应是为进出口开辟新路线，为商人提供更多盈利潜力。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 secure_venetia_mission_task_62_completion_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName] 的贸易商业网络将得到扩展，"
 secure_venetia_mission_task_62_tt:0 "在 #Y $ferraria_area$#! 或 #Y $venetia_area$#! 地区实施 #Y $state_improvement_oratory$#! 国家投资。"
 secure_venetia_mission_task_63:0 "出口基础设施"
 secure_venetia_mission_task_63_DESC:0 "若要增加 [SCOPE.GetRootScope.GetCountry.GetAdjective] 的琥珀贸易，首先需要基础设施，否则大量货物将瓶颈或在途中丢失。必须增加 [SCOPE.GetRootScope.GetCountry.GetAdjective] 港口数量，以匹配我们的雄心。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 secure_venetia_mission_task_63_completion_tt:0 "将在 #Y $ferraria_area$#! 和 #Y $venetia_area$#! 建造 #Y 道路#!。"
 secure_venetia_mission_task_63_tt:0 "#Y $ferraria_area$#! 或 #Y $venetia_area$#! 至少 #Y 6#! 个省份拥有 #Y $port_building$s#!。"
 secure_venetia_mission_task_64:0 "阿德里亚基础设施"
 secure_venetia_mission_task_64_DESC:0 "[GetProvince('(int32)3593').GetName] 长期是 $cisalpine_gaul_region$ 的著名贸易城市，希腊人选择其作为殖民地，许多文化已对其投资。然而，在利戈尼统治下，该城部分基础设施年久失修。我们应投资 [GetProvince('(int32)3593').GetName]，为其进一步扩展提供潜力。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 secure_venetia_mission_task_64_completion_tt:0 "[GetProvince('(int32)3593').GetName] 的基础设施和水务工程得到扩展，"
 secure_venetia_mission_task_65:0 "阿尔蒂诺神庙"
 secure_venetia_mission_task_65_DESC:0 "阿尔蒂诺是 [GetProvince('(int32)3598').GetName] 的守护神，其圣林是城市中心，定期为他举行祭祀。然而，与希腊和罗马的宏伟神庙相比，这片圣林简陋。若我们扩展神庙，[GetProvince('(int32)3598').GetName] 的市民定会因其守护神的神庙改善而高兴。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 secure_venetia_mission_task_65_completion_tt:0 "在 [GetProvince('(int32)3598').GetName] 建造了一座宏伟神庙，"
 secure_venetia_mission_task_66:0 "帕多瓦代表性"
 secure_venetia_mission_task_66_DESC:0 "过去几年，[GetProvince('(int32)3594').GetName] 的市民日益不满。人们担心这座由安特诺尔创立的伟大城市在与 [GetProvince('(int32)3595').GetName] 和 [GetProvince('(int32)3598').GetName] 的竞争中落于下风。若不进一步投资安抚和发展 [GetProvince('(int32)3594').GetName]，他们将不愿与其他 $VNT_ADJ$ 城市合作。投资 [GetProvince('(int32)3594').GetName] 不仅可平息帕多瓦的骄傲，还可使其与伊特鲁里亚和中部意大利的大型城市中心竞争。\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 secure_venetia_mission_task_66_completion_tt:0 "[GetProvince('(int32)3594').GetName] 的人民将感到国家已满足他们的需求，"
 secure_venetia_mission_task_67:0 "琥珀之路中心"
 secure_venetia_mission_task_67_DESC:0 "我们已投入大量资源提升 [SCOPE.GetRootScope.GetCountry.GetAdjective] 商业；然而，仍有许多工作要做。若要扩展我们的商人阶层，与地中海的腓尼基人或希腊人竞争，必须大幅投资 $VNT$ 周围的商业中心，激发更有雄心的新贸易者追求利润，由国家支持。作为位于琥珀贸易中心和亚得里亚海顶端的国家，我们的商人将垄断整个欧洲的商业！\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 secure_venetia_mission_task_67_tt:0 "#Y $ferraria_area$#! 或 #Y $venetia_area$#! 至少 #Y 8#! 个省份拥有 #Y $commerce_building$s#!。"
 secure_venetia_mission_task_68:0 "建立威尼托联盟"
 secure_venetia_mission_task_68_DESC:0 "在我们国家崛起的路上，我们为生存奋战，历经艰辛。虽然我们为自己争取了有利地位，但其他国家未必如此幸运。经历了这些困难，我们愿意向较弱小的国家伸出保护之翼。团结在单一商业联盟的旗帜下，我们可共同繁荣与安全。\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 secure_venetia_mission_task_68_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 要么与至少 #Y 4#! 个总人口少于自身且最多拥有 #Y 15#! 个领土的国家结盟，要么拥有至少 #Y 5#! 个附庸。"
 secure_venetia_mission_task_69:0 "威尼托帝国"
 secure_venetia_mission_task_69_DESC:0 "我们的崛起迅速且出乎邻国意料，面对诸多障碍，我们一一克服。现在我们的国家从雷蒂亚延伸至克里特，我们有能力对意大利至希腊的所有邻近土地宣示帝国霸权。\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 secure_venetia_mission_task_6_DESC:0 "虽然许多入侵意大利的高卢人与我们兵戎相见，但一些部落保持友好。例如，塞诺曼尼人在威尼托多地定居，尽管偶尔发生冲突，他们对我们的敌意远低于其他部落。茵苏布里人也多次寻求我们的专长。为确保我们在北意大利的未来，必须与部分邻近部落建立稳固关系。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 secure_venetia_mission_task_6_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#! 与任何首都在 #Y $cisalpine_gaul_region$#! 地区的 #Y $gallic$#! 国家结盟。"
 secure_venetia_mission_task_7:0 "高卢殖民"
 secure_venetia_mission_task_7_DESC:0 "许多塞诺曼尼凯尔特人已来到我们的土地，与我们融合，定居于我们的家园和村庄。更多人保卫我们的土地总是好事！通过少量激励，我们定能达成协议，让更多部落民迁入。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 secure_venetia_mission_task_7_tt:0 "#Y [GetCountry('CNM').GetName]#! 对 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感大于或等于 #Y 120#!。"
 secure_venetia_mission_task_8:0 "适应高卢战法"
 secure_venetia_mission_task_8_DESC:0 "凯尔特人对威尼托社会的影响日益增强，我们的服饰、语言甚至工具都越来越像高卢风格。除了采纳许多高卢习俗，我们对高卢战法也越来越熟悉。虽然我们与许多凯尔特人融合，但仍有敌对部落使用这些战法对抗我们。通过采纳新兄弟的战术并开发对抗策略，我们将能更好地防御帕达纳谷地的其他部落。\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 secure_venetia_mission_task_8_tt_1:0 "#Y [GetCountry('CNM').GetName]#! 要么与 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 结盟，要么其土地被 #E [SCOPE.GetRootScope.GetCountry.GetName]#! 拥有。"
 secure_venetia_mission_task_8_tt_2:0 "#Y $lepontic$#!文化已完全整合。"
 secure_venetia_mission_task_9:0 "联合罗马"
 secure_venetia_mission_task_9_DESC:0 "罗马人是一个好战且扩张的民族，长期在南方扩张。他们的文化与我们熟悉的伊特鲁里亚人相似，但其军事霸权无人能敌。不尝试与他们建立关系将是愚蠢的。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"

 veneto_flavour_event.1.c:0 "不留任何活物在斯巴达城中！"
 veneto_flavour_event.1.desc:0 "[special_province.Custom('get_city_type_loc')] 的 [SCOPE.sP('special_province').GetName] 终于落入 [SCOPE.GetRootScope.GetCountry.GetAdjective] 军队手中。\n许多年前，在 [GetProvince('(int32)1').GetName] 建立452年后，以及 [GetProvince('(int32)3594').GetName] 建立881年后，斯巴达的王子克莱奥尼莫斯率领他的舰队来到 [GetProvince('(int32)3594').GetName]，意图破坏和征服。当然，他被一支伟大的 $venetic$ 舰队击败，他的部队几乎全军覆没，但在此之前，他洗劫了帕塔维周围的许多土地。现在，这些侵略者的 [special_province.Custom('get_city_type_loc')]，[SCOPE.sP('special_province').GetName]，已在我们手中。\n城市在我们的控制之下，我们的士兵和顾问们在思考如何对待我们的宿敌。我们是报复，彻底洗劫这座城市？还是宽恕 [SCOPE.sP('special_province').GetName] 人民因一位野心勃勃的王子所犯的罪行，并利用他们长期以来的军事传统？"

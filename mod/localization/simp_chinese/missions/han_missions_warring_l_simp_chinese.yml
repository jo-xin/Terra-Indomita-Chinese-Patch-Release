l_simp_chinese:
 coalition_han_against_qin:0 "合纵抗秦"
 coalition_han_bonus:0 "韩为纵长"
 desc_han_capital_mod:0 "郑韩故城欣欣向荣。"
 desc_han_feizi_mod:0 "韩非子于朝廷广为传阅。"
 desc_han_final_mod:0 "煊赫之韩室，非但于瓜分之后光复晋土，更已一统中夏。"
 desc_han_xbows_swords:0 "我精锐军团已精熟弩机与剑术之运用，并将此等技艺传授于我军各部。"
 desc_han_yellow_river_mod:0 "黄河乃我经济脊梁。"
 desc_lobbied_as_han:0 "蒙周天子恩宠。"
 desc_zhengguo_canal_mod:0 "运河大幅提升该区经济产出。"
 han_capital_mod:0 "郑韩故城"
 han_feizi_mod:0 "敕撰韩非子"
 han_feizi_treasure:0 "韩非子"
 han_feizi_treasure_desc:0 "由韩公子暨法家学者韩非所撰写的一部论文集，收录了其文章、评注与观察。"
 han_final_mod:0 "汉朝"
 han_warring_missions:0 "晋之子，华夏之父"
 han_warring_missions_BUTTON_TOOLTIP:0 "将建首个汉朝……"
 han_warring_missions_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]击败其区域竞争对手，引领人民迈向一个由[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族统治统一中国的新纪元之时，此使命即告完成。"
 han_warring_missions_DESCRIPTION:0 "[ROOT.GetCountry.GetName]的居民曾是#E晋#!国内极具影响力的权力掮客，并最终促成了其#E三家分晋#!。自从我们建立[ROOT.GetCountry.GetRuler.GetName]所统治的王国那一刻起，我的同胞们便战胜了许多更强大的对手，那些对手曾致命地轻视我们，将我们视为落后的山区之民。\n\n尽管我们过往曾取得辉煌的胜利——我们曾吞并#E郑#!国，并将其都城据为己有——但我们近来也遭受了挫败，玷污了执政的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族的遗产。韩能否在席卷#E中原#!的诸场战争中存活，仍是未知之数，因为它身处险境，无法信任邻邦会信守诺言。"
 han_warring_missions_task_1:0 "游说周室"
 han_warring_missions_task_10:0 "郑国渠"
 han_warring_missions_task_10_DESC:0 "有一位才华横溢的工程师，一位名叫#E郑国#!的卓越之士，他怀有一个我们将助其实现的愿景：修建一条#Y大渠#!以灌溉关中平原。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 han_warring_missions_task_11:0 "牵制秦国"
 han_warring_missions_task_11_DESC:0 "我们听闻[GetCountry('QIN').GetName)]热衷于大兴土木——无疑全是为了满足[GetCountry('QIN').GetRuler.GetName)]的虚荣心。或许向他们提议一个庞大的工程以使其忙碌不停，不失为良策？我们更希望他们的士兵在田间劳作，而非陈兵我境。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 han_warring_missions_task_11_qin_builds_canal:0 "诱使秦修渠。"
 han_warring_missions_task_12:0 "韩非子"
 han_warring_missions_task_12_DESC:0 "#E韩非#!近来繁忙不已，正将其思想整理汇编成文章；据说他正在撰写一部手稿，内容将涵盖广泛的议题。或许我们能说服这位智者割爱其杰作……\n\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 han_warring_missions_task_12_has_office:0 "韩非为宗教研究员。"
 han_warring_missions_task_13:0 "南晋"
 han_warring_missions_task_13_DESC:0 "若我们有任何恢复#E晋#!的希望，就必须击败邻邦——这个梦想曾看似天方夜谭，如今却前所未有地近在咫尺。[ROOT.GetCountry.GetRuler.GetName]已谕令我方将领制定针对阻挡我伟业的南方诸邦的作战计划。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 han_warring_missions_task_14:0 "北晋"
 han_warring_missions_task_14_DESC:0 "让我们集结兵力，驱逐那些占据了昔日属于#E晋#!的北方领土之人——如今那些土地属于我们！\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 han_warring_missions_task_15:0 "黄河农耕"
 han_warring_missions_task_15_DESC:0 "#T黄河#!是我邦命脉，它赋予我们快速通行的能力，输入食粮与珍馐，并灌溉农田。我们必须善用这条天然水道，沿河兴建农庄，因为[GetCountry('HAN').GetName)]的军团正急速壮大，且胃口颇大！\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 han_warring_missions_task_15_all_our_yellow_river_provinces:0 "黄河上游所有行省将获得："
 han_warring_missions_task_15_seven_farms_yellow_river:0 "黄河上游至少有七处农垦聚落。"
 han_warring_missions_task_16:0 "统一华夏之战"
 han_warring_missions_task_16_DESC:0 "光荣的时刻已然来临，[ROOT.GetCountry.GetRuler.GetName]已抛出[ROOT.GetCountry.GetRuler.GetHerHis]对#T天命#!的主张——整个#Y中原#!将归我所有！\n\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 han_warring_missions_task_17:0 "汉朝"
 han_warring_missions_task_17_DESC:0 "[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族不仅恢复了#Y晋#!——这本身几乎便是一个奇迹——这一显赫家族更在[ROOT.GetCountry.GetRuler.GetName]神授般的领导下，建立了一个名号将响彻世界史册的王朝！\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 han_warring_missions_task_18:0 "劲弩利剑"
 han_warring_missions_task_18_DESC:0 "据传韩弩可射八百米之远，韩剑亦锋利无比。其「挥之可断陆上牛马及水上雁鹜」，且「临敌可斩铁如泥」。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 han_warring_missions_task_18_trigger_tt:0 "有一支军团至少10弓箭手和10重步兵。"
 han_warring_missions_task_1_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]设法讨好居于[GetProvince('(int32)8379').GetName]的#E天子#!是合乎情理的；一旦我们提升其好感，从和睦关系中所获之声望将远超所付代价。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 han_warring_missions_task_2:0 "瓜分楚国"
 han_warring_missions_task_2_DESC:0 "随着我军开始在昔日[GetCountry('CHU').GetName)]所据之地上推进，我们已决定瓜分其剩余领地。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 han_warring_missions_task_2_claims:0 "我们将获得对#Y咸阳#!、#Y栎阳#!、#Y长安#!和#Y弘农#!诸区域的宣称权。"
 han_warring_missions_task_3:0 "申不害遗产"
 han_warring_missions_task_3_DESC:0 "大约三十年前，[ROOT.GetCountry.GetName]失去了一位最伟大的学者——无可比拟的#E申不害#!。虽然我们可能无法再有这位受人尊敬的贤者向[ROOT.GetCountry.GetRuler.GetName]奉献智慧箴言，但我们当然可以传承他的遗产。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 han_warring_missions_task_4:0 "合纵抗秦"
 han_warring_missions_task_4_DESC:0 "[GetCountry('QIN').GetName)]咄咄逼人的外交政策对所有人皆构成威胁，也令其毫无朋友。我们应当考虑联络周边诸邦国，看看他们是否愿意结成联盟以对抗[GetCountry('QIN').GetRuler.GetName)]的军团。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 han_warring_missions_task_4_form_coalition_against_qin:0 "试图组建反秦联盟。"
 han_warring_missions_task_5:0 "保卫北境郡县"
 han_warring_missions_task_5_DESC:0 "若让北部侧翼暴露在外，且无适当防御工事来迟滞入侵军团的推进，那将是愚蠢之举。修建一座能保护北方诸郡的堡垒，时机已至。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 han_warring_missions_task_5_fort_in_hedong_shangdang_area:0 "河东或上党区域至少有一座堡垒。"
 han_warring_missions_task_6:0 "郑韩故城"
 han_warring_missions_task_6_DESC:0 "我邦都城[ROOT.GetCountry.GetCapital.GetName]有着悠久的历史，它曾是#E郑#!国之都，直到我们的先祖推翻他们，接过其权威。如此古都理当加以美化与扩建。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 han_warring_missions_task_7:0 "招募韩非"
 han_warring_missions_task_7_DESC:0 "在#Y法家#!学说中蕴藏着力量，而我邦恰好拥有一位卓越的学者——一位具有哲学头脑的公子，名曰#E韩非#!。或许我们能说服这位年轻人来[ROOT.GetCountry.GetCapital.GetName]效力？\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 han_warring_missions_task_8:0 "肢解秦国"
 han_warring_missions_task_8_DESC:0 "我们正缓慢而坚定地击退[GetCountry('QIN').GetName)]。[ROOT.GetCountry.GetRuler.GetName]毫不留情，下令军团持续进攻，不给秦人以喘息之机。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 han_warring_missions_task_8_claims:0 "获得#Y太原#!和#Y上党#!区域宣称。"
 han_warring_missions_task_9:0 "背刺魏国"
 han_warring_missions_task_9_DESC:0 "尽管我们曾与[GetCountry('WEI').GetName)]和[GetCountry('ZHA').GetName)]联手推翻#E晋#!的暴君，但三家分晋已是很久以前的事了，时势已变。魏已成为必须迅速处置的对手。\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 han_warring_missions_task_9_claims:0 "获得#Y豫#!地区所有行省宣称。"
 han_xbows_swords:0 "韩弩与剑"
 han_yellow_river_mod:0 "黄河"
 lobbied_as_han:0 "周室支持"
 me_han_warring_1.a:0 "韩需高处之友以备将来……"
 me_han_warring_10.a:0 "此可谓奇迹……"
 me_han_warring_100.a:0 "送婴入秦，送吉石入楚，祈求和平"
 me_han_warring_100.b:0 "唯幼子为质——别了，吉石"
 me_han_warring_100_desc:0 "[ROOT.GetCountry.GetCapital.GetName]外农田周围起伏平缓的乡野，也许会令旅人以为正步入一个和谐国度的都城，但事实远非如此。[ROOT.GetCountry.GetName]近年来遭受了一次又一次的危机——时常是[GetCountry('QIN').GetName)]挑起的——这一连串厄运已令[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族内部关系剑拔弩张。\n\n毁灭性的军事失败迫使[ROOT.GetCountry.GetRuler.GetName]遣送人质至国外，但他最终会选择让谁住在敌国朝廷，尚有待观察。[ROOT.GetCountry.GetRuler.GetFirstName]心中所想，无非是将儿子们分开是件好事，因他们已开始为继承之事争执不休。"
 me_han_warring_100_title:0 "家族内斗"
 me_han_warring_101.a:0 "吾子将毁韩国！"
 me_han_warring_101_desc:0 "今晨朝中传来一则凶讯——#E 姬氏#!因不明原因被投入地牢，这违犯了人质协议，危及这位年轻韩王子的性命。\n\n尽管[GetCountry('HAN').GetRuler.GetName)]无法确认为何会发生此事，但[GetCountry('HAN').GetRuler.GetSheHe)]无法摆脱一丝暗暗的怀疑：此事与姬氏的某位兄弟——比如#E 咎季#!——有关。"
 me_han_warring_101_title:0 "楚地惊讯"
 me_han_warring_10_desc:0 "当一位才华横溢的年轻工程师带着详细方案来到[ROOT.GetCountry.GetCapital.GetName]，提出沿#E 关中平原#!修建#E 大运河#!时，[GetCountry('HAN').GetRuler.GetName)]请这位名为#E 郑国#!的能人与[GetCountry('HAN').GetRuler.GetHerHim)]亲自会面，以阐释设计。\n\n数小时后，[GetCountry('HAN').GetRuler.GetFirstName)]被说服了，深信有必要开凿此等运河。郑国沉着的风度与其对自身能力的自信令其印象深刻，[GetCountry('HAN').GetRuler.GetSheHe)]当场便聘用了他。\n\n一年后，当#E 郑国渠#!竣工时，就连[GetCountry('HAN').GetRuler.GetSheHe)]也无法相信这一举措所带来的繁荣与财富。"
 me_han_warring_10_title:0 "$han_warring_missions_task_10$"
 me_han_warring_11.a:0 "如兄所言——一路平安"
 me_han_warring_1100.a:0 "须念百姓，亦念功业"
 me_han_warring_1100_desc:0 "与[GetCountry('HAN').GetRuler.GetName)]会面之后，[GetCountry('QIN').GetRuler.GetName)]决定资助修建一条连接泾水与洛水的#E 大运河#!。\n\n虽然这是一项耗资巨大的工程，[GetCountry('QIN').GetRuler.GetFirstName)]已被彻底说服此事必须尽快进行，不计代价。"
 me_han_warring_1100_title:0 "千载难逢之邀"
 me_han_warring_1101.a:0 "人才永缺——郑国，干得好"
 me_han_warring_1101_desc:0 "我主[ROOT.GetCountry.GetRuler.GetName]，您下令修建的#E 大运河#!已告竣工，负责这一惊人成就的建筑师——杰出的#E 郑国#!——已抵达[ROOT.GetCountry.GetCapital.GetName]，意欲向朝廷提供进一步的效劳。\n\n在未来的岁月中，#E 郑国渠#!将为民所广为利用，并将该地区转变为经济重镇。"
 me_han_warring_1101_title:0 "郑国与其渠"
 me_han_warring_11_desc:0 "'此计甚妙……细思之，饶有趣味。一条能灌溉目前无法耕种之地的运河……嗯。但为何兄长不自行建造呢？难道[ROOT.GetCountry.GetCapital.GetName]的菜市尚且供应不足吗？'\n\n[GetCountry('QIN').GetRuler.GetName)]向后靠入[GetCountry('QIN').GetRuler.GetHerHis)]椅中，向[GetCountry('HAN').GetRuler.GetName)]投去询问的目光。韩王邀请了其尊贵的客人前来，商讨一项大规模基础设施工程。\n\n'我若有此财力与手段，自当为之，仁兄。不幸的是，[ROOT.GetCountry.GetCapital.GetName]城中并无能处理如此大工的主匠。'[GetCountry('HAN').GetRuler.GetFirstName)]勉强一笑，注意到对方脸上的轻蔑之色。秦人确实视韩人为下等之辈，而韩[ROOT.GetCountry.GetRulerTitle]正利用[GetCountry('QIN').GetRuler.GetFirstName)]的自负，准备蒙骗这位秦王。'如此重任，需我等目前不具备的雄才大略，说实话，我想到的名字只有一个——便是阁下您，[GetCountry('QIN').GetRuler.GetFirstName)]。'\n\n秦王嘎嘎大笑，双手拍膝。'甚好，既如此，便由我朝自行开工吧。泾水洛水确应连通——你所言不错。'当秦王起身时，[GetCountry('QIN').GetRuler.GetSheHe)]以怜悯的目光看向[GetCountry('HAN').GetRuler.GetFirstName)]。\n\n'不过，别指望因此得到什么补偿。'\n\n[GetCountry('HAN').GetRuler.GetName)]咬紧牙关，[ROOT.GetCountry.GetRuler.GetHerHis]面不改色，微微颔首[GetCountry('HAN').GetRuler.GetHerHis)]。"
 me_han_warring_11_title:0 "$han_warring_missions_task_11$"
 me_han_warring_12.a:0 "虽艰难亦不可废文教"
 me_han_warring_12_desc:0 "因为[GetCountry('HAN').GetRuler.GetName)]是一位贤明的[ROOT.GetCountry.GetRulerTitle]，即使在战乱阴霾下亦未曾荒废我[ROOT.GetCountry.GetAdjective]文化，[GetCountry('HAN').GetRuler.GetSheHe)]特委托杰出的#E 韩非#!将其思想付之于稿。\n\n如今这部被命名为#E 韩非子#!的杰作已然完成，后世将能欣赏并理解在这乱世中引导韩国的智慧。"
 me_han_warring_12_title:0 "$han_warring_missions_task_12$"
 me_han_warring_13.a:0 "楚亡有因——不可蹈其覆辙"
 me_han_warring_13_desc:0 "因我先祖曾参与#E 三家分晋#!，[GetCountry('HAN').GetRuler.GetName)]已明示，[GetCountry('HAN').GetRuler.GetSheHe)]认为凡昔日为我先辈所据之土，皆为[GetCountry('HAN').GetRuler.GetHerHis)]军之合法目标。\n\n#E 豫#!州之地今已重归其合法主人，我方正努力清除已夺取城市中的楚文化——居于我国之民，不应与昔日占领者存有任何残余联系。"
 me_han_warring_13_title:0 "$han_warring_missions_task_13$"
 me_han_warring_14.a:0 "城建好后告知我"
 me_han_warring_14_desc:0 "在[GetCountry('HAN').GetRuler.GetName)]到来之前，[GetProvince('(int32)8636').GetName]是#E 晋#!故地北部唯一的城市，但我等英明的[ROOT.GetCountry.GetRulerTitle]已然收复这些失地，并通过下令建造一座新城，将[ROOT.GetCountry.GetAdjective]文明之光照耀该地区。"
 me_han_warring_14_title:0 "$han_warring_missions_task_14$"
 me_han_warring_15.a:0 "神明仁慈，赐我丰饶"
 me_han_warring_15_desc:0 "#E 黄河#!沿岸的农田，据称乃[ROOT.GetCountry.GetName]全境中最为富饶之地，这无疑是拜[GetCountry('HAN').GetRuler.GetName)]优先发展该地区农业之努力所赐。\n\n因[ROOT.GetCountry.GetRulerTitle]之智慧，韩国百姓得以在收获季节尽享各式蔬果，饭碗总是满溢。乡间聚居着勤劳农夫及其日渐兴旺的家庭，这些辛劳之人正养育着强壮儿女，孩子们将照料好他们精心耕种的田地。"
 me_han_warring_15_title:0 "$han_warring_missions_task_15$"
 me_han_warring_16.a:0 "神明佑我，引向荣光！"
 me_han_warring_16_desc:0 "最终的统一战争终于到来——愿胜利属于[GetCountry('HAN').GetRuler.GetName)]当之无愧的大军！"
 me_han_warring_16_title:0 "$han_warring_missions_task_16$"
 me_han_warring_17.a:0 "汉朝纪元，始于今日"
 me_han_warring_17_desc:0 "[ROOT.GetCountry.GetRuler.GetName]成就了不可能的伟业，这一刻将永载史册；就连我们伟大的先祖#E 韩简子#!也未必能想象到此番成就。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]率领[ROOT.GetCountry.GetName]之军，四面迎敌，以高超的外交手腕与无可匹敌的武勇赢得了统一战争。自今日始，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族将把和平带给#E 中原#!，其统治将延续至星辰坠落苍穹之时。"
 me_han_warring_17_title:0 "$han_warring_missions_task_17$"
 me_han_warring_18.a:0 "我军团永不会败于敌"
 me_han_warring_18_desc:0 "我军团历经无数胜仗，其赫赫战功已迅速化为传奇，无疑是#E 中原#!全境之中最令人生畏的军队。我军的勇士们不仅在战场上因其卓越而备受赞誉，其手中所持并以冷酷的精湛技艺挥舞的锐利武器同样令人胆寒。"
 me_han_warring_18_title:0 "$han_warring_missions_task_18$"
 me_han_warring_1_desc:0 "多亏了[ROOT.GetCountry.GetRuler.GetName]的外交努力，[GetCountry('ZHO').GetRuler.GetName)]特意来到我京城，与我[ROOT.GetCountry.GetRulerTitle]进行了私人会谈。\n\n虽然关于他们谈话的具体细节仍然保密——这让[ROOT.GetCountry.GetCapital.GetName]朝中的好事者们颇为不满——但众人皆承认，此次会面似乎对我朝大有益处。天子在返回[GetProvince('(int32)8379').GetName]之前，拥抱了[ROOT.GetCountry.GetRuler.GetFirstName]，并承诺将再次来访。"
 me_han_warring_1_title:0 "$han_warring_missions_task_1$"
 me_han_warring_2.a:0 "[GetCountry('CHU').GetRuler.GetFirstName)]是否足够清醒，以领悟其身处之危境？"
 me_han_warring_2_desc:0 "[GetCountry('CHU').GetName)]——一个如此腐朽堕落、以至于只要一提其名，便令[ROOT.GetCountry.GetRuler.GetName]嫌恶皱眉的王国——其边境已被[GetCountry('HAN').GetName)]的英勇军队屡次突破。\n\n随着[ROOT.GetCountry.GetRuler.GetFirstName]的大军继续向南挺进，一场接一场的血战不断打响，据说[GetCountry('CHU').GetRuler.GetName)]对[GetCountry('CHU').GetRuler.GetHerHis)]将领发来的紧急战报置若罔闻。有传言称，楚王已将自己锁在[GetCountry('CHU').GetCapital.GetName)]中，以酒浇愁。"
 me_han_warring_2_title:0 "$han_warring_missions_task_2$"
 me_han_warring_3.a:0 "我非申不害，然深爱韩国"
 me_han_warring_3_desc:0 "着眼于确保国内稳定，[ROOT.GetCountry.GetRuler.GetName]继承了无与伦比的#E 申不害#!之遗产，这位哲人就政府官僚机构与王国有效治理，有着诸多深刻见解。\n\n除了奉行国家礼遇学者的政策之外，[ROOT.GetCountry.GetRuler.GetFirstName]更下令在各行省兴建法庭，以确保王法在[ROOT.GetCountry.GetName]全境得以伸张。"
 me_han_warring_3_title:0 "$han_warring_missions_task_3$"
 me_han_warring_4.a:0 "祈愿善果……"
 me_han_warring_400.a:0 "今日比昨日更强——来吧"
 me_han_warring_400_desc:0 "各路使节终于将消息传至[ROOT.GetCountry.GetRuler.GetName]耳中——这位[ROOT.GetCountry.GetRulerTitle]曾遣使遍告#E中原#!诸国，所幸吾等所传达的危言并未全然落于聋人之耳。\n\n[GetCountry('QIN').GetRuler.GetName)]已向[ROOT.GetCountry.GetCapital.GetName]发出正式抗议，称此番合纵之举实属好战，动摇区域安危，或将迫使[GetCountry('QIN').GetName)]之军采取强硬回应。"
 me_han_warring_400_title:0 "志同道合之友"
 me_han_warring_401.a:0 "同意与韩结盟"
 me_han_warring_401.b:0 "收礼拒盟"
 me_han_warring_401_desc:0 "吾等迎来了[GetCountry('HAN').GetRuler.GetName)]——[GetCountry('HAN').GetName)]的[ROOT.GetCountry.GetRulerTitle]所遣之使者，彼等携来一项大胆之请：邀我共组#E反秦联盟#!。来使言辞恳切，更携厚礼，欲以此说动[ROOT.GetCountry.GetRuler.GetName]之心。"
 me_han_warring_401_title:0 "志同道合之友"
 me_han_warring_4_desc:0 "既已备足打点关节之资，[ROOT.GetCountry.GetRuler.GetName]决意试探邻邦，观其是否有意与我联手，共抗那和平之死敌——[GetCountry('QIN').GetName)]。\n\n骑士将驰赴四方邻国之都，鞍囊之中塞满馈赠。若#E中原#!尚有睿智留存，但愿我辈兄弟君王能捐弃琐细纷争，共御真正之患。"
 me_han_warring_4_title:0 "$han_warring_missions_task_4$"
 me_han_warring_5.a:0 "承诺善用此赠……嗯，但用何处？"
 me_han_warring_5_desc:0 "工师已回报[ROOT.GetCountry.GetRuler.GetName]，带来佳音：北境防御工事已然竣工。\n\n从此[ROOT.GetCountry.GetRuler.GetFirstName]不仅可高枕安眠，更欣喜得知，赖劳工之艰辛付出，各行省尚有更多投资可待推行。"
 me_han_warring_5_title:0 "$han_warring_missions_task_5$"
 me_han_warring_6.a:0 "终于有座配得上韩的都城！"
 me_han_warring_6_desc:0 "[ROOT.GetCountry.GetCapital.GetName]这座古城确有来历，因其曾为#E郑#!国之都。郑国绵延数百年，然在政治棋局中屡作拙择，遭#E晋#!等诸多诸侯蹂躏，终为我先祖永绝其宗嗣。\n\n当日吾国肇建之际，先人仍以故都为都，然过去七十余年间，城垣修缮之需日益昭然。\n\n幸赖[ROOT.GetCountry.GetRuler.GetName]解决此难，王上不遑宁处，直至都城扩建一新、重焕生机。大功告成，王心大悦。"
 me_han_warring_6_title:0 "$han_warring_missions_task_6$"
 me_han_warring_7.a:0 "好消息！你不会后悔，韩非"
 me_han_warring_7_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]初闻外郡有一少年公子，正以法家之学扬名四方，[ROOT.GetCountry.GetRuler.GetSheHe]毫不犹豫，当日便遣骑驰赴这位#E韩非#!的宅邸。\n\n一番恳谈，各陈所期——外加一笔丰厚酬金——韩非遂允诺前来[ROOT.GetCountry.GetCapital.GetName]朝廷效命。"
 me_han_warring_7_title:0 "$han_warring_missions_task_7$"
 me_han_warring_8.a:0 "非彻底肢解不足接受"
 me_han_warring_8_desc:0 "屡次交锋，[GetCountry('HAN').GetRuler.GetName)]与[GetCountry('QIN').GetRuler.GetName)]之军在战场上兵戎相见，而托我朝英武[ROOT.GetCountry.GetRulerTitle]之洪福，吾军屡次将秦犬逐回西方荒原。\n\n虽无人能预知未来，[ROOT.GetCountry.GetRuler.GetFirstName]心中已有成算——秦之最终命运早已注定。惟愿诸神庇佑我[ROOT.GetCountry.GetRulerTitle]及[ROOT.GetCountry.GetRuler.GetHerHis]雄图。"
 me_han_warring_8_title:0 "$han_warring_missions_task_8$"
 me_han_warring_9.a:0 "谋划对魏之战？轻而易举！"
 me_han_warring_9_desc:0 "据传，当[GetCountry('WEI').GetName)]之民初闻[GetCountry('HAN').GetRuler.GetName)]已对彼国领土大规模备置宣称权，[GetCountry('HAN').GetRuler.GetSheHe)]便被骂作背信弃义之友，然[GetCountry('HAN').GetRuler.GetFirstName)]似对此等辱骂毫不在意。当被问及[GetCountry('HAN').GetRuler.GetSheHe)]何以能对昔日盟友备战，这位[ROOT.GetCountry.GetRulerTitle]冷然一笑，惹得[ROOT.GetCountry.GetCapital.GetName]满朝上下齐声附和[ROOT.GetCountry.GetRuler.GetHerHis]之欢谑。"
 me_han_warring_9_title:0 "$han_warring_missions_task_9$"
 zhengguo_canal_mod:0 "郑国渠"

 rudder_of_alcinous:0 "阿尔西努斯之舵"
 rudder_of_alcinous_desc:0 "国王Alcinous，Phaecians的统治者，拥有一艘非凡的船，它的速度就像一只猎鹰，在水面上撕扯，就像天上的鸟一样。"

l_simp_chinese:
 desc_korkyra_mercs:0 "因为我们的领导层愿意自由地花费黄金来雇佣士兵，所以雇佣兵蜂拥到我们的旗帜下。"
 desc_molossian_hounds:0 "摩洛士猎犬，因为其凶猛的外表和健壮的体魄，被作为护卫犬使用，在我们前哨的营地和驻军中巡逻，效果非常好。"
 desc_mountain_master:0 "因为我们的部队在我们的峭壁上进行了艰苦的训练，轻松地爬上了崇高的山峰，就好像他们是山羊一样，所以我们被誉为平都山的主人。"
 desc_sharp_scythe:0 "在古代，早期的制图师根据我们的地理形状给我们的岛屿起了一个绰号，叫我们'镰刀'。通过利用每一块可用的土地用于公民和家庭用途，我们确实磨砺了这把刀！"
 greek_7_korkyra:0 "科基拉，黑岛"
 greek_7_korkyra_BUTTON_TOOLTIP:0 "科基拉不会向她的敌人屈服，而是会以她的成就让世界感到惊讶。"
 greek_7_korkyra_CRITERIA_DESCRIPTION:0 "当科基拉建立起她的基础设施和军事能力，并为她的同胞建立起安全的边界时，这项任务就会完成。"
 greek_7_korkyra_DESCRIPTION:0 "我们居住的科基拉岛在我们之前是许多民族的家园；伊利里亚人、辉格人和希腊人都自称是黑岛的主人，这个绰号源于其丰富的土壤和遍布岛内的茂密森林。多年来，我们的事务一直与埃皮罗特人的事务纠缠在一起，但仍有一些希望，我们很快就能与大陆上发生的事情分开。"
 greek_7_korkyra_task_1:0 "利用我们所拥有的"
 greek_7_korkyra_task_10:0 "摩罗西亚猎犬"
 greek_7_korkyra_task_10_DESC:0 "伊庇鲁斯崎岖不平的高地和山谷是一种凶猛的藏獒品种的故乡，被称为摩罗西亚猎犬，这种狗很凶猛，适合在战争中训练。我们正在训练这些野兽与我们的人并肩作战，并充当护卫犬......那些发现自己面对这些地狱之犬的可怜人有祸了!\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 greek_7_korkyra_task_11:0 "山的主人"
 greek_7_korkyra_task_11_DESC:0 "如果我们能够确保[GetProvince('(int32)422').GetArea.GetName]省，特别是通往山口的山麓，我们将控制进入马其顿本身心脏地带的道路。这将是监视我们不守规矩的邻居的最好方法。\n\n告诉我们的士兵，现在是他们在Pindus训练的时候了，因为我们的目标是成为这些山脉的无可争议的主人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 greek_7_korkyra_task_12:0 "阻止斯巴达人"
 greek_7_korkyra_task_12_DESC:0 "我们能从纵容的将军们的野心中解脱出来吗？现在我们收到消息，[GetProvince('(int32)427').GetName]认为自己比我们强，认为我们会落入她的军队，成为一个新兴的海外帝国的外国港口。我们将在战场上建立我们的声誉，让骄傲的拉凯戴蒙人屈服。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 greek_7_korkyra_task_13:0 "丰富的知识"
 greek_7_korkyra_task_13_DESC:0 "在我们胜利之后，我们对[GetProvince('(int32)84').GetName]施加的部分条款包括获得他们的哲学家和智者的著作，因为我们已经听到了许多关于在城墙内工作的传说中的工程师的故事。\n\n尽管他们需要一些时间才能到达，我们已经得到保证，一批有学问的人将来到我们的首都，指导我们自己的学者。他们还将带来他们欠我们的战争赔偿金，所以我们急切地等待着他们的到来。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 greek_7_korkyra_task_14:0 "来自神的礼物"
 greek_7_korkyra_task_14_DESC:0 "我们在[GetProvince('(int32)470').GetName]的公民报告了一件最奇特的事情，他们声称一个海神在早晨拜访了我们在那里建造的神殿，停留了一会儿，然后随着潮汐离开了。我们应该亲自去拜访那个地方，传说那里是以前辉格人的聚居地，并进行祭祀。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 greek_7_korkyra_task_15:0 "紧张的关系"
 greek_7_korkyra_task_15_DESC:0 "了解我们历史的人都知道，我们是[GetProvince('(int32)418').GetName]城市的一个前殖民地。虽然我们曾经与我们以前的故乡有着美好的关系，但最近，这种关系已经变得紧张，无法修复......\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 greek_7_korkyra_task_16:0 "抓紧脚跟"
 greek_7_korkyra_task_16_DESC:0 "在Fretum Hydruntis水域对面的富裕港口城市正在向我们呼唤，就像传说中的海妖一样，唱着甜蜜的歌，承诺如果我们扩大我们的存在，就会有财富和荣耀。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 greek_7_korkyra_task_1_DESC:0 "虽然我们可利用的土地不多，但这并不意味着我们不应该尽最大努力开发它们。我们的基础设施越好，我们的公民就会有更多的空间。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 greek_7_korkyra_task_2:0 "庇于墙后"
 greek_7_korkyra_task_2_DESC:0 "除了我们自己的力量，我们什么都不相信，我们必须尽一切努力确保我们受到保护，不受外国入侵。建立我们的海军应该是一个高度优先事项。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 greek_7_korkyra_task_3:0 "外国战士的家"
 greek_7_korkyra_task_3_DESC:0 "因为我们不能仅仅依靠我们自己的士兵来保卫我们的岛屿，我们已经让人们知道，雇佣军将在我们这里找到长期的工作。这需要时间和金钱来传播这个消息，但我们确信，这个投资是值得的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 greek_7_korkyra_task_4:0 "磨好镰刀"
 greek_7_korkyra_task_4_DESC:0 "任何有能力的建筑师都会告诉你，如果你希望建造一座宏伟的大厦，你将需要一个坚实的基础；在初步阶段采取的任何捷径都只会招致下一步的灾难。幸运的是，我们不是傻瓜，我们将确保[GetProvince('(int32)470').GetName]为她的未来做好准备。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 greek_7_korkyra_task_5:0 "因其虔诚而受到赞誉"
 greek_7_korkyra_task_5_DESC:0 "我们的岛长期以来一直是众神嬉戏的地方；甚至我们的名字也来自于传说，因为科基拉是波塞冬绑架并带到我们海岸的一个仙女。因为我们的人民一直保留着对神灵的喜爱，他们要求我们建立一个神圣的圣殿。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 greek_7_korkyra_task_6:0 "我们这边的平度"
 greek_7_korkyra_task_6_DESC:0 "虽然在[GetProvince('(int32)459').GetArea.GetName]省有许多外国利益集团，但我们必须控制我们这边的所有土地--允许敌人如此接近我们的岛屿家园是自找麻烦。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 greek_7_korkyra_task_7:0 "进入伊庇鲁斯"
 greek_7_korkyra_task_7_DESC:0 "虽然我们在[GetProvince('(int32)421').GetArea.GetName]的邻居比我们强大，但我们不应该允许他们像这样欺负我们。因为他们无视我们的外交官，那么也许他们会听从我们的士兵。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 greek_7_korkyra_task_8:0 "把你的舰队转向其他地方"
 greek_7_korkyra_task_8_DESC:0 "我们听说，[GetProvince('(int32)84').GetName]的暴君已经把饥饿的目光投向了国外，寻找可以吞噬的小国--他们会发现我们并不是软柿子；事实上，恰恰相反！。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 greek_7_korkyra_task_9:0 "趁手的工具"
 greek_7_korkyra_task_9_DESC:0 "也许与他人相比，我们的军队规模较小，但我们的部队历经战火洗礼，习惯于在你所能想象的最艰难地形中作战……在军事事务上，我们完全可以依靠现有的力量进行作战。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 korkyra_mercs:0 "科基拉雇佣军"
 me_greek_7_korkyra_1.a:0 "这里有这么多未开发的潜力......"
 me_greek_7_korkyra_10.a:0 "谁是好孩子？"
 me_greek_7_korkyra_10_desc:0 "从Molossian猎犬--人类最好的朋友中无出其右的恶性护卫犬--中得到启发，我们已经开始训练这些动物与我们的士兵一起作战。它们不仅在我们城市的营地和宫殿中保持警惕，而且还与我们的士兵并肩行进，在他们穿越困难的国家时保持士气。而且，当战斗命令下达后，我们的猎犬就会冲进战场，它们的叫声和咆哮绝对是一种可怕的声音。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，从不放过任何一个黄金机会，甚至收养了一只狗作为宠物。给它取名 Hierax 或 Hawk，这只巨大的杂种狗已经成为营地里的一种吉祥物，到处跟着它的主人，并受到官兵们的喜爱。"
 me_greek_7_korkyra_10_title:0 "$greek_7_korkyra_task_10$"
 me_greek_7_korkyra_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_10$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_11.a:0 "我们不能袖手旁观，让我们的敌人对我们做白日梦"
 me_greek_7_korkyra_11_desc:0 "生活在[GetProvince('(int32)415').GetArea.GetName]山区的Taulantian部落成员对我们的人来说并不陌生；我们曾与他们交替进行经济产品和矛刺的交易，这种舞蹈我们已经非常熟悉了。当听说陶朗蒂人正在寻求与[GetProvince('(int32)415').GetArea.GetRegion.GetName]中任何愿意反对我们的人结盟时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]认为已经够了，于是下令准备宣称事宜。"
 me_greek_7_korkyra_11_title:0 "$greek_7_korkyra_task_11$"
 me_greek_7_korkyra_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_11$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_12.a:0 "斯巴达的盾牌将把他们儿子的尸体渡到哈迪斯！"
 me_greek_7_korkyra_12_desc:0 "在最近的记忆中，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]曾多次被迫宣布发动先发制人的战争，以确保和平；对于一个有良知的领导人来说，这是一个可怕的困境，尤其是一个不太愿意看到[GetProvince('(int32)470').GetName]的士兵死于无意义战争的领导人。对[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]来说，不幸的是，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]要做出一个艰难的决定；似乎斯巴达人想把我们的岛屿占为己有，并开始准备一支入侵部队。我们会让拉凯戴蒙人后悔游离于伯罗奔尼撒半岛。"
 me_greek_7_korkyra_12_title:0 "$greek_7_korkyra_task_12$"
 me_greek_7_korkyra_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_12$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_13.a:0 "我对大家都在谈论的阿基米德的著作很好奇......"
 me_greek_7_korkyra_13_desc:0 "最后，叙拉古人送来了我们在上次战争中从他们贪婪的手指上撬下来的东西；他们不仅同意送来一笔慷慨的战争赔偿，这将对缓解战争花费的痛苦刺痛起到神奇的作用，而且我们还要求得到比金银更有价值的东西。深知[GetProvince('(int32)84').GetArea.GetName]是许多科学家与贤者的家园，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]要求我们接收他们图书馆中所有文献的副本。没有任何文件被认为是不值得复制的，所以除了哲学论文和建筑蓝图之外，我们还收到了皇家食谱、叙拉古与其邻国之间的条约副本，甚至还有一些私人信件。\n\n我们的图书管理员将有他们的工作要做；一项他们乐在其中的任务。"
 me_greek_7_korkyra_13_title:0 "$greek_7_korkyra_task_13$"
 me_greek_7_korkyra_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_13$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_14.a:0 "这到底会是什么呢！"
 me_greek_7_korkyra_14_desc:0 "虽然我们在[GetProvince('(int32)470').GetName]的耳目向当局报告了各种八卦，但下面的故事一直在大家的口中，终于引起了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的亲自关注。似乎在[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]吩咐在科基拉建造的神殿建成后仅几个月，一个神秘的神就会随着早晨的潮水来到这里，在进入圣地时淹没了圣地，几个小时后才离开。我们的牧师一直宣称这是一个奇迹，并邀请[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]亲自前来祭祀，希望能见证这一神圣的景象，许多人认为这与曾经居住在这里的克尔基拉人有关。\n\n一天早上，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]带着[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的随从来到这里，带来了用钱能买到的最好的香火。进入圣地后，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]点燃了香，将甜美的烟雾送往天堂，并跪倒在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的面前。当没药的香味充满神殿时，水开始涌入神殿，用海的泡沫覆盖每个人。太阳在苍穹中变暗了，一个幽灵般的声音大声而深沉地叹息着，一个闪闪发光的存在出现了，让所有在场的人都充满了恐惧。\n\n但是，就在骚动开始的时候，一切又迅速改变了；阴凉消失了，洪水退去了，天空又充满了阳光和鸟鸣。转身看向一位顾问，脸色苍白如纸，就在这时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]注意到祭坛上的礼物......"
 me_greek_7_korkyra_14_title:0 "$greek_7_korkyra_task_14$"
 me_greek_7_korkyra_14_tooltip:0 "#Y 阿尔基诺俄斯之舵#!已加入你的宝物库。$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_14$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_15.a:0 "让我们的“母亲”知道我们正在津津有味地研究奥瑞斯提斯的传说……"
 me_greek_7_korkyra_15_desc:0 "虽然建立[GetProvince('(int32)470').GetName]的第一批定居者来自大陆上的[GetProvince('(int32)418').GetName]城市，但我们和我们的前辈之间并没有失去爱。虽然发生在一个多世纪以前，但被称为埃庇丹努斯事件的事件仍然让那些记得的人感到不安，偶尔人们可以在科基拉的街道上发现一个演说家对Korinthians进行谩骂，声称我们的荣誉要求我们用军事手段惩罚我们的母城。\n\n虽然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]发现这些复兴主义的梦想让人心烦意乱，但毫无疑问，拥护这些宣称是有政治利益的，因此，最终征服科林斯的目标已经成为官方的国策。"
 me_greek_7_korkyra_15_title:0 "$greek_7_korkyra_task_15$"
 me_greek_7_korkyra_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_15$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_16.a:0 "我们在意大利不怕任何人......"
 me_greek_7_korkyra_16_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们已经敲定了入侵意大利的计划，并准备了必要的宣称。我们的士兵为有机会在[GetProvince('(int32)64').GetArea.GetName]的城镇和村庄中致富而感到巨大的兴奋，我们也很难责怪他们--从表面上看，这是一片富裕的土地，将使我们的国库充满金银。"
 me_greek_7_korkyra_16_title:0 "$greek_7_korkyra_task_16$"
 me_greek_7_korkyra_16_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_16$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_1_desc:0 "从一天中最早的时候，当太阳勉强爬上地平线时，到傍晚时分，当我们的工程师不得不在火炬下工作时，我们的工人一直在[GetProvince('(int32)470').GetName]忙着不停地建设。现在我们得到消息，最后的项目正在完成，城里的每个人都难以抑制他们的兴奋。漫步在新装饰的科基拉街道上，树荫下的花环装饰，已经成为一个可爱的方式来度过一个下午。"
 me_greek_7_korkyra_1_title:0 "$greek_7_korkyra_task_1$"
 me_greek_7_korkyra_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_1$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_2.a:0 "我们的船只是我们的第一道防线"
 me_greek_7_korkyra_2_desc:0 "我们离海岸线很近，一直是一把双刃剑；的确，我们从离大陆这么近的地方获得了很多好处，特别是在与埃皮罗特人进行贸易的时候，但科基拉海峡非常狭窄，即使是一个十岁的孩子也能从[GetProvince('(int32)421').GetName]游到我们岛上。虽然我们欢迎所有和平访问的人，但我们已经投资了一支海军，可以在接到通知的瞬间从我们的港口出发，阻止任何怀有邪恶目的的人来到我们的家园。"
 me_greek_7_korkyra_2_title:0 "$greek_7_korkyra_task_2$"
 me_greek_7_korkyra_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_2$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_3.a:0 "向每个首都派出传令兵，并让画师在agorae的墙壁上做标记"
 me_greek_7_korkyra_3_desc:0 "意识到我们所处的危险境地，特别是当涉及到可用来保卫[GetProvince('(int32)470').GetName]的微不足道的灵魂时，我们的领导层已经做出决定，完全接受雇佣军的加入。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]是辩论中具有说服力的声音，说服我们政治机构中的保守分子开放国库，邀请[GetProvince('(int32)421').GetArea.GetRegion.GetName]的经验丰富的战斗人员涌向我们的指挥。命令将我们的公告传得很远很广，需要几个月的时间来分享这个消息，但我们相信，我们的训练营里很快就会有大量的战士。"
 me_greek_7_korkyra_3_title:0 "$greek_7_korkyra_task_3$"
 me_greek_7_korkyra_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_3$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_4.a:0 "试图翻越我们城墙的侵略者有祸了！"
 me_greek_7_korkyra_4_desc:0 "过去的几个月里，压力很大，代价也很大，这种组合让[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]很烦躁，但我们终于实现了我们的初衷，现在我们的部队已经训练有素，对可能到来的一切都保持高度警惕。通过升级我们的进攻和防御能力，同时建设我们首都的基础设施，我们终于准备好了，如果我们选择的话，可以将目光投向我们的城市之外......"
 me_greek_7_korkyra_4_title:0 "$greek_7_korkyra_task_4$"
 me_greek_7_korkyra_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_4$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_5.a:0 "我们将亲自参加早晨的祭祀活动，并祈求保佑"
 me_greek_7_korkyra_5_desc:0 "自从人类聚集在火堆旁分享故事以来，诗人就一直唱着我们的家，[GetProvince('(int32)470').GetName]的歌，因为我们生活在一片受祝福的土地上，甚至连神明都不时地在这里徘徊。众所周知，波塞冬曾经把一个被绑架的仙女Korkya带到我们的家，献给她，我们忠实的人民从来没有忘记我们的起源，而是用感恩的祈祷来记住。\n\n由于我们如此虔诚，在我们的城墙内建造一个神圣的神殿是非常合适的，这样人们就可以随意献上祭品。"
 me_greek_7_korkyra_5_title:0 "$greek_7_korkyra_task_5$"
 me_greek_7_korkyra_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_5$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_6.a:0 "我们只寻求确保我们的自然边界"
 me_greek_7_korkyra_6_desc:0 "平都山是一个天然的防御工事，保护我们不受东方军队的肆虐，这是一个小小的祝福，我们相当感激。然而，如果我们不控制山口，我们就会公开招致灾难。意识到我们的安全状况有多么微妙，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经推动我们在编造主张后尽快确保[GetProvince('(int32)459').GetArea.GetName]省的安全；我们不仅渴望得到遍布Sinus Patraicus海岸线的港口城市，而且我们根本无法允许不受约束地通过山区。"
 me_greek_7_korkyra_6_title:0 "$greek_7_korkyra_task_6$"
 me_greek_7_korkyra_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_6$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_7.a:0 "我们要么走向荣耀，要么走向毁灭；诸神与我们同在！"
 me_greek_7_korkyra_7_desc:0 "有些人认为我们自己的历史是[GetProvince('(int32)419').GetArea.GetName]这个大故事中的一个脚注，认为我们的岛屿不过是一种事后的考虑，或者是遥远的贵族之间交易的嫁妆，但这是我们断然拒绝的一种说法。意识到埃皮罗特人的凶猛和好战，我们不会轻易决定宣称他们的土地，但我们不会允许敌人为我们书写未来。"
 me_greek_7_korkyra_7_title:0 "$greek_7_korkyra_task_7$"
 me_greek_7_korkyra_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_7$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_8.a:0 "可能的侵略者将很快被迫保护他们的城墙"
 me_greek_7_korkyra_8_desc:0 "我们从探子那里得到消息，[GetProvince('(int32)84').GetArea.GetName]的僭主已经观察我们的进展有一段时间了，并决定如此丰厚的战利品会给他们的城市带来荣耀，公开谈论一旦大海允许航行，就入侵我们。真正侮辱人的是，叙拉古人并没有隐藏他们的战争计划，而是无所事事地对任何愿意听的人说；难道我们就那么无能，允许有人公开策划我们的灭亡？相信出其不意的因素将是一个福音，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经发誓要让敌人自食其果……"
 me_greek_7_korkyra_8_title:0 "$greek_7_korkyra_task_8$"
 me_greek_7_korkyra_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_8$#!”$mission_completed_tooltip_2$"
 me_greek_7_korkyra_9.a:0 "我们绝对可以和这样的军队合作"
 me_greek_7_korkyra_9_desc:0 "虽然我们不是一个喜欢和别人比较的人，认为我们坚定地走自己的路，只为今天比昨天做得更好而努力，但我们不能忽视我们的军队规模，尤其是和一些邻国的军队相比。虽然我们长期依赖雇佣军，但今天我们很高兴地报告，我们自己的征兵部队终于达到了一个可观的规模。"
 me_greek_7_korkyra_9_title:0 "$greek_7_korkyra_task_9$"
 me_greek_7_korkyra_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $greek_7_korkyra_task_9$#!”$mission_completed_tooltip_2$"

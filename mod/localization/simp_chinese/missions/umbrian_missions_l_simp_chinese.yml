l_simp_chinese:
 UMBRIAN_FEDERATION:0 "翁布里亚联邦"
 UMBRIAN_FEDERATION_ADJ:0 "翁布里亚"
 UMBRIA_GALLICA_SUBJECT:0 "高卢翁布里亚"
 UMBRIA_GALLICA_SUBJECT_ADJ:0 "高卢-翁布里亚"
 iguvine_tablets:0 "伊古维乌姆青铜板"
 iguvine_tablets_desc:0 "来自翁布里亚城市伊古维乌姆的一系列青铜板，上面记录了献给朱庇特祭司的宗教仪式与行为。"
 me_abandoned_umbria_cmod:0 "被遗弃的翁布里亚"
 me_declaration_of_the_umbrian_federation_cmod:0 "翁布里亚联邦宣言"
 me_local_umbrian_metalworking_tradition_pmod:0 "本地翁布里亚金属加工"
 me_mercy_to_the_etruscans_umb_culturemod:0 "对伊特鲁里亚人的宽恕"
 me_the_mints_of_Iguvium_pmod:0 "伊古维乌姆铸币厂"
 me_umbria.28.a:0 "我们需要[GetCountry('ETR').GetName]站在我们这边"
 me_umbria.28.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将与#E #Y [GetCountry('ETR').GetName]#!#!追求友好关系。"
 me_umbria.28.b:0 "唯一的好伊特鲁里亚人是没有气息的伊特鲁里亚人！"
 me_umbria.28.b_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将寻求摧毁#E #Y [GetCountry('ETR').GetName]#!#!。"
 me_umbria.28.desc:0 "长久以来，我们向西望去总带着某种不安。有时我们会借助伊特鲁里亚人进行贸易，但另一些时候又会与他们爆发血腥冲突，翁布里亚与伊特鲁里亚诸城在边境地带积怨甚深。甚至许多翁布里亚人随着时间推移不得不退入更深的丘陵与山地。\n\n但拉丁人在我们南方扩张得太快，已使我们双方都无法忽视；若要战胜他们，我们或许必须联合起来。\n\n我们能否与伊特鲁里亚邻人建立兄弟般的纽带，还是会在南下之前先让他们承受血腥复仇？"
 me_umbria.28.t:0 "伊特鲁里亚边境"
 me_umbria.30.a:0 "我们支持翁布里亚盟友！"
 me_umbria.30.a_tt:0 "我们将加入#E 翁布里亚#!对#E #Y $ROM$#!#!的战争。"
 me_umbria.30.b:0 "战争真的是解决之道吗？"
 me_umbria.30.b_tt:0 "我们将#E [GetCountry('UMB').GetName]#!留给其命运，#R 大幅降低他们对我们的评价#!。"
 me_umbria.30.desc:0 "在公元前4世纪末，罗马与翁布里亚人接触不久后，便将其战争机器开入该地区，以平定不愿与罗马签订条约的定居点。然而，他们并非孤军奋战，伊特鲁里亚联盟于公元前300年介入，试图保护如内奎尼乌姆等定居点免受罗马围攻。\n\n联合对抗罗马，我们或许能战胜他们的强大力量。然而，胜利并非板上钉钉，审慎考虑其他选择或许更为明智。"
 me_umbria.30.t:0 "罗马-翁布里亚战争"
 me_umbria.31.a:0 "我们必须超越前人。是时候宽恕了。"
 me_umbria.31.a_tt:0 "#E #Y $etruscan$#!#!文化将开始整合。\n因#E [SCOPE.GetRootScope.GetCountry.GetName]#!展现的仁慈，#E #Y $etruscan$#!#!文化的幸福度将提升。"
 me_umbria.31.b:0 "以血还血。屠戮他们。"
 me_umbria.31.b_tt:0 "在#E 伊特鲁里亚领土#!的每个#E $etruscan$#!主要文化领土中，#E #T 4#!#!个#E #Y $etruscan$#!#!文化人口将被#R 杀死#!，由#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!州人口定居该领土，并从掠夺中获得#Y 40#!金币。"
 me_umbria.31.desc:0 "那些给我们带来诸多苦难的人有祸了……\n\n数世纪的敌对将我们两族带至这一关键时刻，如今胜利站立的是我们，#E 翁布里亚人#!。\n但面对这新获得的胜利，我们该如何抉择？当然，我们可以对伊特鲁里亚城市展现仁慈，免除过度的愤怒，他们定会对我们意外的慷慨感激不尽。但他们#E 自己#!以极大残忍摧毁的数百个定居点……城市……又当如何？#E 伊特鲁里亚人给我们展现过何种仁慈？#!"
 me_umbria.31.t:0 "伊特鲁里亚的命运"
 me_umbria.32.a:0 "我从未想过会与伊特鲁里亚人并肩作战而死……"
 me_umbria.32.a_tt:0 "#E #Y [GetCountry('ETR').GetName]#!#!已加入我们对#E $ROM$#!的战争。"
 me_umbria.32.desc:0 "在与罗马的殊死战斗中，我们寡不敌众。但在危急时刻，我们的老对手回应了我们绝望的求援，如今#E [GetCountry('ETR').GetName]#!的军队已抵达，援助我们渡过难关！\n\n曾经的敌人，如今成为并肩作战的兄弟，组成统一战线，准备击败我们所知的最大威胁！"
 me_umbria.32.t:0 "伊特鲁里亚人的到来"
 me_umbria.33.a:0 "希望萨宾人能明白事理……"
 me_umbria.33.a_tt:0 "向#E $SAB$#!发出最后通牒。"
 me_umbria.33.desc:0 "距离翁布里亚权力中心不远处居住着萨宾人。这一熟悉的部落，与我们联盟内的其他部落并无太大不同。尽管我们有诸多相似之处，#E [GetProvince('(int32)23').GetName]#!定居点的归属问题却成为争议焦点。\n\n作为翁布里亚的重要中心，该地必须落入联盟手中。我们不愿见血流成河，但无论付出何种代价，哪怕是同室操戈，我们也要控制这片领土。"
 me_umbria.33.t:0 "与萨宾人的谈判"
 me_umbria.34.a:0 "我们必须放弃内奎尼乌姆"
 me_umbria.34.a_tt:0 "#E [GetProvince('(int32)23').GetName]#!省份将割让给#E #Y [GetCountry('UMB').GetName]#!#!。"
 me_umbria.34.b:0 "让他们试试夺取我们的土地！"
 me_umbria.34.b_tt:0 "#E [GetCountry('UMB').GetName]#!可能对我们#R 宣战#!。"
 me_umbria.34.desc:0 "[GetCountry('UMB').GetName]远非他们自称的正义泛翁布里亚联盟，他们宣布了对我们持有领土内奎尼乌姆的欲望，并发出最后通牒要求我们放弃！\n\n虽然我们的战士决心不惜一切代价保卫领土，但翁布里亚人数量众多，若我们选择错误道路，可能被彻底粉碎。"
 me_umbria.34.t:0 "来自翁布里亚的最后通牒"
 me_umbria.35.a:0 "太好了！"
 me_umbria.35.a_tt:0 "#E [GetProvince('(int32)23').GetName]#!已被整合进#Y #E [SCOPE.GetRootScope.GetCountry.GetName]#!#!"
 me_umbria.35.desc:0 "外交取得胜利，#E [GetProvince('(int32)23').GetName]#!已落入我们手中！\n通过外交官的说服，我们最轻松地将又一座翁布里亚城市纳入联盟。现在，我们的人民更加团结，或许能更好地抵御如拉丁低地快速扩张者等更强大的威胁。"
 me_umbria.35.t:0 "萨宾人明白事理"
 me_umbria.36.a:0 "那就是战争……"
 me_umbria.36.a_tt:0 "我们将为#E [GetProvince('(int32)23').GetName]#!对#Y #E $SAB$#!#!宣战。"
 me_umbria.36.desc:0 "我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]疲惫地看着使团，刚收到$SAB$拒绝交出#E [GetProvince('(int32)23').GetName]#!的消息。\n\n最后通牒不容无视，保护翁布里亚定居点的意愿反映了我们的荣誉，我们不能轻易放弃内奎尼乌姆——尤其是我们已投入如此多的资源。"
 me_umbria.36.t:0 "$SAB$拒绝我们的要求"
 me_umbria.37.a:0 "加入我们，兄弟们，共同击败罗马！"
 me_umbria.37.a_tt:0 "意大利中部所有#E [GetCultureGroup('latin').GetName|Y]#!文化的#E 藩属#!，且隶属#E #T $ROM$#!#!，将被提供转投我们一方的选项。"
 me_umbria.37.desc:0 "在罗马战争机器的征伐中，#E $ROM$#!成功积累了与该地区部落的大量不平等联盟条约。\n\n在罗马的巨大力量与威势笼罩下，几乎所有争夺权力的其他国家都被罗马的扩张所掩盖，盟友发现自己被困于对不可战胜力量的奴役之中。直到现在。\n\n随着罗马在翁布里亚战役的灾难，我们的翁布里亚-萨贝利兄弟终于看到，罗马之狼已血流成河，终于有机会摆脱旧主人的枷锁。"
 me_umbria.37.t:0 "意大利中部的盟友"
 me_umbria.38.a:0 "我们将摆脱枷锁，加入你们的战斗！"
 me_umbria.38.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将放弃#E $ROM$#!，成为#E #Y [GetCountry('UMB').GetName]#!#!的#T $feudatory$#!#!。"
 me_umbria.38.b:0 "我们不会背叛拉丁盟友！"
 me_umbria.38.b_tt:0 "我们将继续参与#E $ROM$#!对#E #Y [GetCountry('UMB').GetName]#!#!的战争。"
 me_umbria.38.desc:0 "与预期相反，翁布里亚的战争对罗马造成了巨大损失。作为附庸，我们的士兵被送入战场，亲眼目睹了展开的屠杀，我们开始认识到原本认为不可能的事：罗马军队完全可以被击败。\n\n现在，翁布里亚人派来使者，提出诱人的提议，加入他们的联邦，对抗罗马的强大力量，一劳永逸地击败我们当前的主人，或者继续与罗马盟友站在一起，试图扭转战局。"
 me_umbria.38.t:0 "来自翁布里亚的解放者？"
 me_umbria.39.a:0 "欢迎加入我们的联盟！"
 me_umbria.39.a_tt:0 "#E #Y $PIE$#!#!将被送往加入#E [SCOPE.GetRootScope.GetCountry.GetName]#!作为#T #E $feudatory$#!#!的邀请"
 me_umbria.39.desc:0 "在我们东侧居住着皮塞尼人。这一略显疏远的意大利族群拥有独特的丧葬习俗，但我们对这些奇特邻居的语言已习以为常。随着我们的联邦扩张，纳入了更多我们接触较少的部落，不向这些与我们相处数百年的兄弟提供保护是不合适的。\n\n让皮塞尼人看到加入我们伟大联邦的无数好处！"
 me_umbria.39.t:0 "向皮塞尼提供保护"
 me_umbria.40.a:0 "我们很高兴加入你们的联邦！"
 me_umbria.40.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $feudatory$#!#!。"
 me_umbria.40.b:0 "我们必须保留独立。"
 me_umbria.40.b_tt:0 "什么也不会发生，尽管翁布里亚人会感到遗憾。"
 me_umbria.40.desc:0 "数世纪以来，我们与西方的翁布里亚邻居进行贸易与交流。然而，现在他们统一成大联盟，并在意大利地区扩张，他们也邀请我们加入联邦。\n\n获得更永久的保护可能带来好处，尤其是来自与我们兄弟般的民族，但这肯定会以完全独立为代价。"
 me_umbria.40.t:0 "加入翁布里亚联邦的邀请"
 me_umbria.41.a:0 "欢迎，兄弟们！"
 me_umbria.41.a_tt:0 "#E #Y $PIE$#!#!已决定成为#E [SCOPE.GetRootScope.GetCountry.GetName]#!的#T #E $feudatory$#!#!。"
 me_umbria.41.desc:0 "我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]喜出望外！因为#E $PIE$#!的兄弟们同意加入我们的联盟，现在是联邦的$feudatory$！\n有了我们能提供的保护，他们定不会后悔这个决定。"
 me_umbria.41.t:0 "皮森提亚加入！"
 me_umbria.42.a:0 "真遗憾"
 me_umbria.42.a_tt:0 "#E $PIE$#!已拒绝加入联邦。"
 me_umbria.42.desc:0 "尽管我们已经令人信服地阐明加入翁布里联邦的好处，#E $PIE$#!派来的使者仍告知我们，他们不会加入，理由是希望在自身事务上保有完全独立。\n我们确实尊重他们的愿望，但邻邦拒绝我们增进友谊的提议，仍令我们感到遗憾。"
 me_umbria.42.t:0 "皮塞尼决定不加入"
 me_umbria.43.a:0 "让我们寻求了解这些高卢人，"
 me_umbria.43.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将在#Y #E $cisalpine_gaul_region$#!#!追求更外交的扩张。"
 me_umbria.43.desc:0 "在审视我们边境的弱点时，北方是我们最脆弱的地方。不久前，凯尔特部落涌入一个居住着多种民族和部落的地区，包括许多翁布里亚定居点，征服了它们。现在，我们自己面临边境上一些最令人畏惧的高卢部落。\n\n但这些新来者是如此勇猛的战士，或许寻找共同点比更多流血更有益。若我们以友好态度接近最近的邻居，与这些战士结盟可能确实有用。"
 me_umbria.43.t:0 "在山南高卢的姿态"
 me_umbria.44.a:0 "我们将把高卢人逐出这片土地！"
 me_umbria.44.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将在#Y #E $cisalpine_gaul_region$#!#!寻求军事扩张。"
 me_umbria.44.desc:0 "在审视我们边境的弱点时，北方是我们最脆弱的地方。不久前，凯尔特部落涌入一个居住着多种民族和部落的地区，包括许多翁布里亚定居点，征服了它们。现在，我们自己面临边境上一些最令人畏惧的高卢部落。\n\n鉴于高卢人给我们兄弟带来的苦难，我们不能袖手旁观。我们必须以任何必要手段将凯尔特人逐出该地区，否则将承受无情部落的愤怒。"
 me_umbria.44.t:0 "在山南高卢的姿态"
 me_umbria.45.a:0 "让凯尔特人看到我们联盟的伟大！"
 me_umbria.45.a_tt:0 "我们最北方的#E 高卢#!文化邻居将被送往成为我们#T #E $feudatory$#!#!的邀请"
 me_umbria.45.desc:0 "尽管我们两族之间或许存在差异，翁布里-高卢联盟仍将符合所有人的最佳利益，至少在我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]看来如此。\n\n北方的凯尔特邻邦是否会以善意看待我们的接近尚未可知，但我们对在该地区取得立足点抱有很高期望。"
 me_umbria.45.t:0 "联盟提议"
 me_umbria.46.a:0 "我们必须接受翁布里亚的统治"
 me_umbria.46.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $feudatory$#!#!"
 me_umbria.46.b:0 "让我们全心全意采纳这些邻居的方式！"
 me_umbria.46.b_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $feudatory$#!#!"
 me_umbria.46.b_tt2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将采纳#E #Y $umbrian$#!文化#!和#E #Y $italic_pantheon$#!宗教#!。"
 me_umbria.46.c:0 "我们不向任何人低头。"
 me_umbria.46.c_tt:0 "#E #Y [GetCountry('UMB').GetName]#!#!可能宣称我们的土地。"
 me_umbria.46.desc:0 "来自南方邻居#E [GetCountry('UMB').GetName]#!的使者抵达，提出他描述为‘互利友好条约’的提议，与意大利强国结盟。我们最近看到翁布里亚人在南方迅速扩张，且我们的军队已耗尽，当前陷入这场血腥战争，我们可能别无选择。\n\n我们是否接受翁布里亚的保护提议，还是维持现状，尽管目前处于弱势？"
 me_umbria.46.t:0 "效忠的提议"
 me_umbria.47.a:0 "优秀的战士，让我们在战斗中并肩作战！"
 me_umbria.47.a_tt:0 "我们的北部凯尔特邻居已接受成为我们的#T #E $feudatory$#!#!"
 me_umbria.47.desc:0 "我们北方的邻居接受了我们的保护提议，现在由我们的联邦间接控制。\n\n虽然他们犹豫地加入，我们承认对这样一个自由生活的民族接受这种提议所需付出的痛苦，并以开放的怀抱欢迎他们加入我们的联邦！"
 me_umbria.47.t:0 "高卢人接受保护"
 me_umbria.48.a:0 "我们暂时必须放弃他们"
 me_umbria.48.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!放弃在#Y $cisalpine_gaul_region$#!的野心"
 me_umbria.48.b:0 "我们将带着军队返回"
 me_umbria.48.b_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!宣称#Y $aemilla_area$#!及我们直接的北部边境地带。"
 me_umbria.48.desc:0 "当我们派使者前往北方的交战邻国时，我们预计会遇到一定程度的抵制，进入我们联邦的影响。然而，得知他们完全拒绝我们影响他们加入事业的努力，对我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]来说是极大的失望。\n\n我们接下来的道路尚不确定。我们可以通过武力进入高卢领土，或者完全放弃在该地区的野心。"
 me_umbria.48.t:0 "北方的失败"
 me_umbria.49.a:0 "他们应该不会顽强抵抗"
 me_umbria.49.a_tt:0 "向我们的凯尔特邻居发出最后通牒"
 me_umbria.49.desc:0 "战争降临我们的高卢邻居，他们的军队已精疲力竭。我们一直在等待这一刻，伺机而动，现在是时候出击了。\n\n#E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!已派出使者，向疲弱的高卢人发出最后通牒，“将我们在#E $ariminum_area$#!的合法领土割让给我们，否则我们将以武力夺取”。"
 me_umbria.49.t:0 "施压高卢人"
 me_umbria.50.a:0 "希望我们的族人免受巨大愤怒。"
 me_umbria.50.a_tt:0 "我们在#E $ariminum_area$#!的所有领土被#E #Y [GetCountry('UMB').GetName]#!#!吞并"
 me_umbria.50.b:0 "这些背信弃义的秃鹫将死于我们的剑下！"
 me_umbria.50.b_tt:0 "#E [GetCountry('UMB').GetName]#!将对我们#R #E 宣战#!#!"
 me_umbria.50.desc:0 "我们精疲力竭。我们伤痕累累。现在，在最糟糕的时刻，南方的#E [GetCountry('UMB').GetName]#!秃鹫派来使者，带来令人寒心的威胁：‘将你在$ariminum_area$的所有领土割让给我们，否则我们将以武力夺取’。\n\n现实地看，我们过于虚弱，无法进行通常的战斗。是否干脆放弃，希望我们的族人在翁布里亚霸主手下得到仁慈，还是为我们部落的生存拼命战斗？"
 me_umbria.50.t:0 "翁布里亚的最后通牒"
 me_umbria.51.a:0 "他们无论如何都没有胜算。"
 me_umbria.51.a_tt:0 "我们将吞并#Y #E $ariminum_area$#!#!"
 me_umbria.51.desc:0 "我们的恐吓在彻底毁灭面前显得势不可挡，似乎我们的凯尔特邻居决定遵从我们的要求。\n有了在#E $cisalpine_gaul_region$#!的这个立足点，我们将自由地进一步扩张，甚至进入伊特鲁里亚人很久以前在帕杜斯河岸建立的城市。"
 me_umbria.51.t:0 "高卢人割让$ariminum_area$"
 me_umbria.52.a:0 "他们将在我们面前倒下。"
 me_umbria.52.a_tt:0 "我们将对高卢人开战。"
 me_umbria.52.desc:0 "我们的使者被嘲笑，我们的最后通牒被驳回。虽然我们宁愿不让双手沾满鲜血，但我们对碾碎高卢军队的残余毫无顾忌。\n我们已为战斗准备好战士，现在是时候一劳永逸地确保北方边境了。"
 me_umbria.52.t:0 "高卢人拒绝我们的威胁"
 me_umbria.53.a:0 "让我们奖励我们的兄弟。此外，用高卢人控制高卢人更好。"
 me_umbria.53.a_tt:0 "#Y #E $aemilla_area$#!#!地区将割让给我们新的#E 高卢#!附庸。"
 me_umbria.53.b:0 "不，这些土地现在是我们的。"
 me_umbria.53.b_tt:0 "#E $aemilla_area$#!将保持在#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!控制之下。"
 me_umbria.53.desc:0 "经过多次考验和辉煌的战斗，我们终于到达帕杜斯河岸。该地区的所有古老城市牢牢掌握在我们手中，乡村土地也是如此，现在居住着凯尔特农民。‘我的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]’，我们的附庸抱怨道，‘我们一直勤奋地与您并肩作战，但您现在持有的这些土地是我们族人的土地，若由我们为您管理不是更好吗？’我们的新#E 凯尔特附庸#!提出了一个好观点。该地区的乡村居民若由他们视为同族的部落间接统治，可能更容易安抚。此外，我们新勇敢的凯尔特战士确实应该因其服务得到回报。\n\n我们是将这些新领土交给我们的附庸，还是保持在#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!控制之下？"
 me_umbria.53.t:0 "帕杜斯河的问题"
 me_umbria.54.a:0 "雷霆之民将引领意大利部落走向荣耀！"
 me_umbria.54.b:0 "翁布里亚人只是众多之一……"
 me_umbria.54.b_tt:0 "你将转而组建#E $ITALIA_NAME$#!标签。"
 me_umbria.54.desc:0 "我们的军队四处征战，击败无数敌人，现在我们掌控了意大利半岛的大部分。随着翁布里亚人控制了大多数部落，敌对的罗马人和萨莫奈人终于被击败，我们现在可以宣布翁布里亚人为整个意大利的霸主！\n\n但我们的意大利联邦会将所有部落视为平等——包括拉丁低地人和萨贝利萨莫奈人——还是未来只属于雷霆之民？"
 me_umbria.54.t:0 "泛翁布里亚联邦"
 me_umbria.55.a:0 "希望我们的希腊朋友接受。"
 me_umbria.55.a_tt:0 "将向我们在#E #Y $magna_graecia_region$#!#!的#E 希腊#!朋友发送保护邀请。"
 me_umbria.55.desc:0 "大希腊的希腊城邦富裕繁荣，我们与其中一些建立了密切联系。然而，作为独立城邦，它们依然脆弱，若落入外国势力影响，可能成为进入该地区的门户。因此，保护这些希腊国家符合我们自身的最佳利益。\n\n我们的使者已被派往希腊盟友，主动提供无条件的保护，由他们自行决定。"
 me_umbria.55.t:0 "召集大希腊人"
 me_umbria.56.a:0 "让我们至少接受他们的保护提议。"
 me_umbria.56.a_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $tributary$#!#!"
 me_umbria.56.b:0 "为何不直接加入他们的联邦？"
 me_umbria.56.b_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $feudatory$#!#!"
 me_umbria.56.c:0 "我们宁愿不与翁布里亚人过于亲近"
 me_umbria.56.c_tt:0 "什么也不会发生"
 me_umbria.56.desc:0 "鉴于他们迅速扩张进入我们所在地区，我们与这个扩张中的翁布里国家建立了友好关系，并善用他们整合半岛的成果，与意大利诸城达成有利贸易安排。然而现在，他们派来使者，提出为我们提供“抵御外部威胁的保护”。\n\n我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]仍不确定该如何看待此事。翁布里人真只是想保护我们的共同利益，还是这是他们让我城臣服于其统治的计谋？"
 me_umbria.56.t:0 "翁布里亚人提供保护"
 me_umbria.57.a:0 "你们在翁布里亚之盾后是安全的。"
 me_umbria.57.a_tt:0 "我们在#E #Y $magna_graecia_region$#!#!获得了一个#T #E $tributary$#!#!。"
 me_umbria.57.desc:0 "鉴于我们对大希腊希腊人的提议，至少有一座希腊城市接受了我们的保护提议，以换取贡品！\n对我们的#E [SCOPE.GetRootScope.GetCountry.GetRulerTitle]#!来说，这是一个极好的进展。"
 me_umbria.57.t:0 "希腊城市寻求保护"
 me_umbria.58.a:0 "你们非常欢迎加入我们的势力范围。"
 me_umbria.58.a_tt:0 "我们在#E #Y $magna_graecia_region$#!#!获得了一个#T #E $feudatory$#!#!。"
 me_umbria.58.desc:0 "虽然一些人拒绝了我们的保护提议，但其他人热情接受。一座城市甚至请求完全加入我们的联邦！虽然意外，但这种惊喜无疑是受欢迎的。因为这座新城市定将作为通往更广阔希腊世界的枢纽，带来大量贸易。"
 me_umbria.58.t:0 "希腊城市请求加入联邦"
 me_umbria.59.a:0 "真遗憾"
 me_umbria.59.desc:0 "虽然我们希望所有人都接受我们的提议，但似乎有一座城市以怀疑态度看待我们的提议，并拒绝了，理由是‘试图对其施加我们的影响’。\n\n虽然我们暂时不会争辩，但这使该城市比必要时更加脆弱。"
 me_umbria.59.t:0 "希腊城市拒绝我们的保护提议"
 me_umbria.60.a:0 "加入我们，勇敢的战士，你们无需再挣扎！"
 me_umbria.60.a_tt:0 "#E #Y [GetCountry('BRT').GetName]#!#!将被送往加入我们的联邦作为#T #E $feudatory$#!#!的邀请。"
 me_umbria.60.desc:0 "我们南方的布卢提人长期以来有反抗外来压迫者的历史。被视为逃亡者和叛乱者，我们对罗马人和伊特鲁里亚人的斗争使我们对这些坚定的战士产生同情。虽然他们不愿向任何外国人低头，若我们保证他们的自治和特权，或许能说服他们加入我们联邦的好处。"
 me_umbria.60.t:0 "对布卢提人的保护"
 me_umbria.61.a:0 "他们似乎比希腊人更可取……"
 me_umbria.61.a_tt:0 "我们将成为#E #Y [GetCountry('UMB').GetName]#!#!的#T #E $feudatory$#!#!。"
 me_umbria.61.b:0 "我们不向他人低头！"
 me_umbria.61.b_tt:0 "我们将保持独立。"
 me_umbria.61.desc:0 "来自#E [GetCountry('UMB').GetName]#!的使者抵达，提出让我们加入其联邦的‘机会’。使者表达同情，谈到在其领域内的‘好处’和‘自治’，以及我们布卢提人与翁布里亚人作为‘大希腊的意大利民族’共同扩展权力的机会。\n虽然他们的外交官能言善辩，我们的[SCOPE.GetRootScope.GetCountry.GetRulerTitle]，#E [SCOPE.GetRootScope.GetCountry.GetRuler.GetPraenomen]#!，对[GetCountry('UMB').GetAdjective]的提议有何看法？"
 me_umbria.61.t:0 "[GetCountry('UMB').GetName]提供保护"
 me_umbria.62.a:0 "欢迎！"
 me_umbria.62.a_tt:0 "#Y #E [GetCountry('BRT').GetName]#!#!已成为我们的#T #E $feudatory$#!#!。"
 me_umbria.62.desc:0 "我们的努力开花结果！叛逆的布卢提人热情接受加入我们的联邦，条件是受到充分尊重。当然，我们是信守承诺的民族。\n随着我们的国家不断壮大，似乎我们已准备好进一步扩展，甚至跨越西西里海峡……"
 me_umbria.62.t:0 "布卢提人加入联邦！"
 me_umbria.63.a:0 "我们将继续前进！越过西西里海峡！"
 me_umbria.63.a_tt:0 "#E [GetCountry('BRT').GetName]#!必须被征服。"
 me_umbria.63.desc:0 "唉，即使我们最好的外交官也不够，$BRT$拒绝了我们的提议。当然，我们在该地区的利益依然存在，我们将以某种方式掌握这些土地。看来我们必须放下笔，拿起剑。"
 me_umbria.63.t:0 "$BRT$拒绝"
 me_umbria.64.a:0 "让神明诅咒你们，伊特鲁里亚人！"
 me_umbria.64.a_tt:0 "#E [GetCountry('ETR').GetName]#!已将你抛弃给#E #R $ROM$#!#!的命运。"
 me_umbria.64.desc:0 "虽然内奎尼乌姆仍处于罗马围攻之下，其居民仍向北眺望，朝伊特鲁里亚的方向。\n朝越来越明显永远不会到来的援助方向。\n\n我们本不该信任伊特鲁里亚人，我们认识他们足够久，应该更加谨慎。即便如此，面对如此强大的敌人，现在纠结于这个错误可能为时已晚。"
 me_umbria.64.t:0 "伊特鲁里亚抛弃我们"
 me_umbrian_ruralism_pmod:0 "翁布里亚乡村主义"
 treasure_it_mars_of_todi:0 "托迪的马尔斯"
 treasure_it_mars_of_todi_desc:0 "这是一尊大型青铜雕像，很可能献给伊特鲁里亚神祇拉兰。“托迪的马尔斯”在伊特鲁里亚制成后，被赠予一个翁布里部落。其胸甲裙摆上还刻有翁布里语和伊特鲁里亚语两种献词。"
 umb_etrurian_imports_cmod:0 "伊特鲁里亚进口"
 umb_influence_from_etruscan_cities_cmod:0 "来自伊特鲁里亚城市的影响"
 umb_picentine_imports_cmod:0 "皮塞尼进口"
 umbria_mission_01:0 "雷霆之威"
 umbria_mission_01_BUTTON_TOOLTIP:0 "翁布里亚的威势将远远超越我们的亚平宁故土……"
 umbria_mission_01_CRITERIA_DESCRIPTION:0 "当翁布里亚将#E 意大利#!部落从拉丁的枷锁中解放，并将#E 意大利#!整合为单一的翁布里亚#E 联邦#!时，此使命将视为完成。"
 umbria_mission_01_DESCRIPTION:0 "隐匿于亚平宁山脉的丘陵之中，翁布里亚部落长久以来一直是偏远、乡村的民族。尽管我们偶尔会联合对抗共同威胁，但通常由各个部落或定居点自行与外敌交战，例如敌对的伊特鲁里亚城邦。\n如今，一股#E 军国主义国家#!正从我们西南方的拉丁低地崛起。\n在这不确定的局势下，翁布里亚部落再次结成大联盟，团结一致，欲将我们的意志扩展至整个地区。\n\n#E 让我们击溃威胁，翁布里亚人将称霸意大利！#!"
 umbria_mission_task_1:0 "应对伊特鲁里亚人"
 umbria_mission_task_10:0 "颠覆罗马的盟友"
 umbria_mission_task_10_DESC:0 "若我们谨慎行事，便有很大机会说服罗马的附庸放弃忠诚誓言，加入我们的事业。\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 umbria_mission_task_10_requirement_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!在与#E #Y $ROM$#!#!的战争中至少有#E #T 25#!战争分数#!。"
 umbria_mission_task_10_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将收到事件，接管#E $ROM$#!的意大利#E #Y 附庸#!#!，将其从罗马控制中解放。"
 umbria_mission_task_11:0 "征服拉齐奥"
 umbria_mission_task_11_DESC:0 "我们不可放弃对罗马的征服，而应深入他们的省份——卡普阿必须归于我们。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 umbria_mission_task_11_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#Y 罗马卡普阿#!的宣称。"
 umbria_mission_task_12:0 "进军卡普阿"
 umbria_mission_task_12_DESC:0 "卡普阿终于归于我们，[ROOT.GetCountry.GetName]内部有足够的政治意愿彻底摧毁罗马……我们必须继续前进，直到完成此举。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 umbria_mission_task_12_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将宣称意大利剩余的罗马领土。"
 umbria_mission_task_13:0 "皮塞尼联盟"
 umbria_mission_task_13_DESC:0 "皮塞尼的城市充满勤劳的人民，他们渴望与我们的[ROOT.GetCountry.GetAdjective]同胞建立友谊与兄弟情谊。在这危险的时代，双方更紧密的联系对两国皆有益。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 umbria_mission_task_13_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetAdjective]#!与#E $PIE_ADJ$#!关系将#G 改善#!。"
 umbria_mission_task_14:0 "欢迎皮森提亚"
 umbria_mission_task_14_DESC:0 "皮塞尼的领导者有多明智？他们能否抓住千载难逢的机会，在十字路口选择智慧之路？为了我们两国持续的和谐，我们希望他们理解我们请求的严肃性。\n\n\n\n\n\n\n\n\n\n@italic_mil8!"
 umbria_mission_task_14_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将请求#E #Y $PIE$#!#!成为[SCOPE.GetRootScope.GetCountry.GetAdjective]#Y 的#E $feudatory$#!#!。"
 umbria_mission_task_14_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#E #Y [GetProvince('(int32)117').GetName]#!#!的宣称。"
 umbria_mission_task_15:0 "皮塞尼贸易"
 umbria_mission_task_15_DESC:0 "多亏翁布里亚货物源源不断地流向皮塞尼海岸的港口城市，我们的经济从未如此繁荣，且持续增长。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 umbria_mission_task_16:0 "夺取安科纳"
 umbria_mission_task_16_DESC:0 "小型城市[GetProvince('(int32)117').GetName]发现自己被敌对势力包围，却相信他们能免受席卷意大利的战争影响。是时候让他们明白他们错得有多离谱。\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 umbria_mission_task_17:0 "北方安全"
 umbria_mission_task_17_DESC:0 "北方的众多高卢部落让我们不知如何看待——他们是和平与繁荣的潜在伙伴，还是可能将毁灭带至[ROOT.GetCountry.GetCapital.GetName]城墙的又一敌人？我们必须决定如何应对这些蛮族，不能做出错误选择——这可能是生死攸关之事。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 umbria_mission_task_17_requirement_tt_1:0 "任何邻国，其主要文化为[GetCulture('lepontic').GetName|Y]或[GetCulture('sennonian').GetName|Y]，其首都位于[GetProvince('(int32)121').GetArea.GetName|Y]地区或[GetProvince('(int32)144').GetArea.GetRegion.GetName|Y]区域，且对[SCOPE.GetRootScope.GetCountry.GetName]的评价为#G +50#!或#R -50#!。"
 umbria_mission_task_17_tt:0 "根据此任务的完成方式，#E [SCOPE.GetRootScope.GetCountry.GetName]s#!对#Y $cisalpine_gaul_region$#!高卢人的态度将#E 决定下一任务的结果#!。"
 umbria_mission_task_18:0 "确保北方边境"
 umbria_mission_task_18_DESC:0 "我们面临的最大威胁并非来自南方，而是来自北方边境——我们听过太多关于蛮族部落从山口蜂拥而出的故事。若想安稳入睡，最好确保北方边境的安全。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 umbria_mission_task_18_allow_tt_1:0 "任何邻国，其主要文化为[GetCulture('lepontic').GetName|Y]或[GetCulture('sennonian').GetName|Y]，其最大人力少于40%，且当前处于战争状态。"
 umbria_mission_task_18_tt:0 "#t 根据第一个任务的完成方式#!，#E [SCOPE.GetRootScope.GetCountry.GetName]#!将要求北方的#Y 凯尔特#!邻国成为#Y #E $feudatory$#!#!，或要求#Y #E 吞并#!#!。"
 umbria_mission_task_18_tt_2:0 "#t 除非你决定放弃$cisalpine_gaul_region$#!，#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#Y #E $aemilla_area$#!#!地区的宣称。"
 umbria_mission_task_19:0 "向帕杜斯河进发"
 umbria_mission_task_19_DESC:0 "胜利在召唤我们的军队，他们已为[ROOT.GetCountry.GetName]夺取#E 帕杜斯河#!河口——继续前进，朝山脉进发！对愚蠢抵抗的高卢人毫不留情！\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 umbria_mission_task_1_DESC:0 "翁布里亚人与伊特鲁里亚城邦长期以来关系敌对。然而，随着我们双方面临更大的威胁，是时候决定我们将继续争斗，还是为了共同利益放下分歧。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 umbria_mission_task_1_requirement_tt_1:0 "#Y #E $ETR$#!#!对#E [SCOPE.GetRootScope.GetCountry.GetName]#!的评价#T 要么#!大于或等于#G +40#!，要么小于或等于#R -40#!。"
 umbria_mission_task_1_tt:0 "将触发事件，#E [SCOPE.GetRootScope.GetCountry.GetName]#!可决定与#Y #E $ETR$#!#!结盟或敌对。"
 umbria_mission_task_2:0 "伊特鲁里亚盟友"
 umbria_mission_task_20:0 "对抗萨莫奈人"
 umbria_mission_task_20_DESC:0 "#E 萨莫奈人#!认为自己比我们优越，他们的外交官甚至暗示，若我们两国开战，他们的军队将占据上风。我的[ROOT.GetCountry.GetRulerTitle]，是时候一劳永逸地羞辱这些高谈阔论的山民了吗？\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 umbria_mission_task_20_requirement_tt_2:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]的人力超过#E #Y $SAM$#!#!（当前：[SCOPE.ScriptValue('umbria_mission_task_20_manpower_current')|0Y] / [SCOPE.ScriptValue('umbria_mission_task_20_manpower_needed')|0Y]）"
 umbria_mission_task_20_requirement_tt_3:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]的领土数量超过#E #Y $SAM$#!#!（当前：[SCOPE.ScriptValue('umbria_mission_task_20_cities_current')|0Y] / [SCOPE.ScriptValue('umbria_mission_task_20_cities_needed')|0Y]）"
 umbria_mission_task_20_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#Y #E $neapolis_area$#!#!及所有#Y 萨莫奈领土#!的宣称。"
 umbria_mission_task_21:0 "意大利霸主"
 umbria_mission_task_21_DESC:0 "随着我们对意大利最强大的对手彻底摧毁，我们在此宣称自己为这片土地的#E 霸主#!——派遣使者前往尚未臣服的各邦首府，告知他们时日无多！\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 umbria_mission_task_21_requirement_tt_1:0 "#E #Y $SAM$#!#!不再拥有领土"
 umbria_mission_task_21_requirement_tt_2:0 "#E #Y $ROM$#!#!不再拥有领土"
 umbria_mission_task_21_requirement_tt_3:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!或其附庸拥有整个#E #Y $roma_area$#!#!地区"
 umbria_mission_task_21_requirement_tt_4:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!或其附庸拥有整个#E #Y $neapolis_area$#!#!地区"
 umbria_mission_task_21_requirement_tt_5:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!或其附庸拥有整个#E #Y $aternum_area$#!#!地区"
 umbria_mission_task_21_requirement_tt_6:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!或其附庸拥有整个#E #Y $asculum_area$#!#!地区"
 umbria_mission_task_21_requirement_tt_7:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!已征服#Y #E 萨莫奈人的领土#!#!"
 umbria_mission_task_21_tt_1:0 "随着意大利处于[SCOPE.GetRootScope.GetCountry.GetAdjective]控制之下，#E [SCOPE.GetRootScope.GetCountry.GetName]#!将宣布自己为#Y $UMBRIAN_FEDERATION$#E #!#!"
 umbria_mission_task_21_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将宣称尚未控制的整个#E #Y $central_italy_region$#!#!地区。"
 umbria_mission_task_22:0 "翁布里亚金属加工"
 umbria_mission_task_22_DESC:0 "我们的铁匠与金属工匠以精湛技艺闻名，来自#E 意大利#!各地的商人纷纷前往[ROOT.GetCountry.GetCapital.GetName]的市场，购买我们精制的饰品与器物。让我们通过投资图德尔附近的最大中心，进一步鼓励#E 翁布里亚#!金属加工。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 umbria_mission_task_22_allow_tt_1:0 "[GetProvince('(int32)103').GetName|Y]或[GetProvince('(int32)102').GetName|Y]由[SCOPE.GetRootScope.GetCountry.GetName]拥有，且至少有1座[GetBuilding('workshop_building').GetName|Y]。"
 umbria_mission_task_22_allow_tt_2:0 "[GetProvince('(int32)14').GetArea.GetName|Y]州正在进口#Y 基础金属#! @base_metals!、#Y 贵金属#! @precious_metals!。"
 umbria_mission_task_22_tt:0 "你鼓励金属加工的翁布里亚南部定居点将获得以下修正："
 umbria_mission_task_23:0 "伊古维乌姆铸币厂"
 umbria_mission_task_23_DESC:0 "为确保经济稳定与货币质量，我们必须在[GetProvince('(int32)123').GetName]建造一座铸币厂，生产符合我们标准的货币。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 umbria_mission_task_23_allow_tt_2:0 "[GetProvince('(int32)121').GetArea.GetName|Y]州正在进口#Y 贵金属#! @precious_metals!。"
 umbria_mission_task_23_tt:0 "将在#Y #E [GetProvince('(int32)123').GetName]#!#!建立铸币厂"
 umbria_mission_task_24:0 "乡村扩张"
 umbria_mission_task_24_DESC:0 "我们不仅应通过建筑扩展城市，还应注意开发我们的内地。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 umbria_mission_task_24_allow_tt:0 "[GetProvince('(int32)121').GetArea.GetName|Y]、[GetProvince('(int32)104').GetArea.GetName|Y]地区或[GetProvince('(int32)23').GetName|Y]、[GetProvince('(int32)23').GetName|Y]、[GetProvince('(int32)23').GetName|Y]省份内所有[GetProvinceRank('settlement').GetName|Y]等级的领土没有空余建筑槽。"
 umbria_mission_task_24_tt:0 "翁布里亚核心领土内的所有乡村定居点将获得以下修正："
 umbria_mission_task_25:0 "寻求与希腊人结盟"
 umbria_mission_task_25_DESC:0 "让我们通知希腊朋友，我们寻求超越现有关系的更正式协议。若幸运，我们或能找到愿意在我们危急时刻并肩作战的盟友。\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 umbria_mission_task_25_allow_tt_1:0 "至少有#Y 2#!个盟国，其主要文化为[GetCulture('italiotian').GetName|Y]、[GetCulture('syracusan').GetName|Y]或[GetCulture('epirote').GetName|Y]，且其首都位于[GetProvince('(int32)51').GetArea.GetName|Y]、[GetProvince('(int32)55').GetArea.GetName|Y]、[GetProvince('(int32)10').GetArea.GetName|Y]或[GetProvince('(int32)36').GetArea.GetName|Y]地区。"
 umbria_mission_task_25_tt:0 "大希腊地区的所有#Y #E 希腊#!#!城邦，与#E [SCOPE.GetRootScope.GetCountry.GetName]#!有联盟或对其评价至少#E #Y 80#!#!，将收到加入联邦的邀请，成为#T #E 贡国#!#!或#T #E 附庸#!#!。"
 umbria_mission_task_26:0 "征服卢卡尼亚"
 umbria_mission_task_26_DESC:0 "我们向南推进，远方的#E 伊奥尼亚海#!平静水面已映入眼帘——这是一个优良地区，我们应为[ROOT.GetCountry.GetName]征服之。\n\n\n\n\n\n\n\n\n\n@italic_mil25!"
 umbria_mission_task_26_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将宣称#E #Y $tarentum_area$#!#!和#E #Y $cannae_area$#!#!地区。"
 umbria_mission_task_27:0 "邀请布卢提乌姆加入联邦"
 umbria_mission_task_27_DESC:0 "虽然我们的军队永不厌倦战斗，或许我们能通过外交手段说服$BRT$加入我们……他们怎能希望对抗我们？\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 umbria_mission_task_27_allow_tt_1:0 "#E #Y $BRT$#!#!对#E [SCOPE.GetRootScope.GetCountry.GetName]#!的评价至少为#Y #E 100#!#!。"
 umbria_mission_task_27_allow_tt_2:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]的总人口超过#E #Y $BRT$#!#!（当前：[SCOPE.ScriptValue('umbria_mission_task_27_population_current')|0Y] / [SCOPE.ScriptValue('umbria_mission_task_27_population_needed')|0Y]）"
 umbria_mission_task_27_allow_tt_3:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]的领土数量超过#E #Y $BRT$#!#!（当前：[SCOPE.ScriptValue('umbria_mission_task_27_cities_current')|0Y] / [SCOPE.ScriptValue('umbria_mission_task_27_cities_needed')|0Y]）"
 umbria_mission_task_27_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将邀请#E #Y $BRT$#!#!作为#T #E $feudatory$#!#!加入联邦"
 umbria_mission_task_27_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#E #Y $east_sicily_area$#!#!和#E #Y $croton_area$#!#!的宣称"
 umbria_mission_task_28:0 "青铜文献"
 umbria_mission_task_28_DESC:0 "这是我们人民的重要日子，崇拜伟大#E 朱庇特#!的正确方式将被铭刻于青铜板上，供后世永远珍视！\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 umbria_mission_task_2_DESC:0 "虽然我们并非在所有事情上都能达成一致，但伊特鲁里亚人真的那么糟糕吗？尤其与某些替代选择相比……或许对我们双方来说，寻求友好与合作的政策是最佳选择。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 umbria_mission_task_2_requirement_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!决定与#E #Y $ETR$#!#!追求友好关系。"
 umbria_mission_task_2_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!与#E $ETR$#!将加强彼此的正面评价。"
 umbria_mission_task_3:0 "伊特鲁里亚贸易联系"
 umbria_mission_task_3_DESC:0 "随着我们与邻近伊特鲁里亚人日益紧密的经济联系，我们乐于与他们开展贸易，其益处多得数不胜数。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 umbria_mission_task_4:0 "来自伊特鲁里亚的援助"
 umbria_mission_task_4_DESC:0 "伊特鲁里亚履行誓言的时刻已到，与我们并肩作战的日子来临——我们的联合力量将一劳永逸地羞辱罗马之狼！\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 umbria_mission_task_4_tt:0 "#E $ETR$#!将加入我们与#E #Y $ROM$#!#!的战争，无论他们是否处于休战状态。"
 umbria_mission_task_5:0 "击退伊特鲁里亚"
 umbria_mission_task_5_DESC:0 "我们无法与西方的伊特鲁里亚人共存，我们将利用他们的内讧与争吵，在他们最意想不到时突袭他们的城市！\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 umbria_mission_task_5_requirement_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!决定摧毁#E #Y $ETR$#!#!。"
 umbria_mission_task_5_requirement_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!已夺取#E 翁布里亚-伊特鲁里亚#Y 边境地带#!#!。"
 umbria_mission_task_5_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对所有#Y $etruscan$#!领土的宣称。"
 umbria_mission_task_6:0 "伊特鲁里亚城市"
 umbria_mission_task_6_DESC:0 "既然我们已粉碎伊特鲁里亚人对我们统治的所有抵抗，让我们命令新臣民打开他们的金库与宝库——战争代价高昂，[ROOT.GetCountry.GetName]有许多账单需要支付。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 umbria_mission_task_6_requirement_tt_1:0 "至少#Y #E 10#!#!座#E $ETR$的城市#!已被#E [SCOPE.GetRootScope.GetCountry.GetName]#!夺取。"
 umbria_mission_task_6_tt:0 "#E 伊特鲁里亚#!的财富将流入#E [SCOPE.GetRootScope.GetCountry.GetName]#!，产生以下效果："
 umbria_mission_task_7:0 "伊特鲁里亚的命运"
 umbria_mission_task_7_DESC:0 "命运的残酷转折中，神明赋予我们对伊特鲁里亚人生死的权力——由[ROOT.GetCountry.GetRuler.GetName]决定是否将我们复仇的怒火倾泻于他们。我们会为曾经失去的定居点与土地彻底报仇吗？\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 umbria_mission_task_7_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将收到事件，决定是否宽恕或惩罚#E #Y $etruscan$s#!#!。"
 umbria_mission_task_8:0 "控制西方"
 umbria_mission_task_8_DESC:0 "随着伊特鲁里亚核心领土牢牢掌握在我们手中，我们的目光转向西方，#E 撒丁岛#!与#E 科西嘉岛#!在召唤我们的军队。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 umbria_mission_task_8_requirement_tt_1:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!已向#E #Y $ETR$#!#!赠送礼物。"
 umbria_mission_task_8_requirement_tt_2:0 "#E $ETR$#!的所有州至少有#E #Y 60#!忠诚度#!。"
 umbria_mission_task_8_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将获得对#Y #E $corsica_area$#!#!、#E #Y $sardinia_meridionalis$#!#!和#Y #E $sardinia_septentrionalis$#!#!地区的宣称。"
 umbria_mission_task_9:0 "拉丁威胁"
 umbria_mission_task_9_DESC:0 "虽然[GetProvince('(int32)23').GetName]曾是[ROOT.GetCountry.GetAdjective]的领地，但多年来已被#E 萨宾人#!占领——但不再如此！现在我们处于强势地位，必须要求归还这片领土，归于其合法主人。\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 umbria_mission_task_9_requirement_tt_1:0 "#Y #E $ROM$#!#!对#E [SCOPE.GetRootScope.GetCountry.GetName]#!的评价为#R 负面#!。"
 umbria_mission_task_9_tt:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将向#E #Y $SAB$#!#!发出最后通牒，要求归还我们的边境定居点#Y [GetProvince('(int32)23').GetName]#!。"
 umbria_mission_task_9_tt_2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!将宣称整个#Y #E $roma_area$#!#!地区。"

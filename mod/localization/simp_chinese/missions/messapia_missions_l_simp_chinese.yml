 taros_conquest.a:0 "我们将在塔拉斯的街道上游行！"
 taros_conquest_desc:0 "我们与#E 塔林敦#!的历史跨越了几代又几代。让我们回顾一下：\n\n公元前490年，#E 塔林敦人#!给了我们毁灭性的打击。\n公元前473年，我们对他们进行了报复，屠杀了他们。\n公元前460年，#E 塔伦图姆人#!再次反击，又一次击败了我们。\n公元前433年，我们被#E 塔伦图姆人#!击退。\n公元前413年，我们再次战成了平局。\n公元前333年，#E 塔林敦#!获得了又一次胜利。\n公元前330年，我们一起联合起来对抗#E 罗马#!。\n公元前304年，我们再次共同参与了#E 卢卡尼亚-塔林敦战争#!。\n\n最终，我们占领了这座我们与其战斗、合作的城市；一个我们曾屠杀过也屠杀过我们的民族；一个像我们挑战它一样挑战我们的对手。这个竞争的结束是苦乐参半的，但随着我们对其的占领，它结束了！#E 塔拉斯#!再也不会对我们构成威胁，因为我们#E 梅萨皮人#!已经给予了他们沉重的一击！"
 taros_conquest_title:0 "塔拉斯的沦陷"
 war_303_samnoum_out_tt:0 "萨莫奈投降了，他们在战争中抛弃了我们。"

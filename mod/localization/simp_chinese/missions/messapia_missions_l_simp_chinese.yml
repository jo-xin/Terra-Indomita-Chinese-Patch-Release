 war_303_tt_2:0 "我们将背叛对盟友的承诺，战争将在没有我们的情况下进行。"
 war_303_tt_3:0 "斯巴达的帮助肯定会有所帮助，但代价不菲。"
 we_will_continue_fighting_tt:0 "我们将继续战斗这场战争。"

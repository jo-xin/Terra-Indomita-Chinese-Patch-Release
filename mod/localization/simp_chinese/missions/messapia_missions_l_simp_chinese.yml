l_simp_chinese:
 MAGNA_ILLYRIA_ADJECTIVE:0 "大梅萨皮亚"
 MAGNA_ILLYRIA_NAME:0 "大伊利里亚"
 MAGNA_ILLYRIA_NAME_2:0 "大梅萨皮亚"
 NICKNAME_DESTROYER:0 "“毁灭者”"
 assimilate_pops_messapia_tt:0 "最多#Y 15#!个人口将同化为[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]。"
 cannae_and_tarentum_tt:0 "#Y [GetProvince('(int32)56').GetArea.GetName]#! 和 #Y [GetProvince('(int32)36').GetArea.GetName]#! 地区拥有#Y 宗教转换#!总督政策。"
 cant_form_illyria_tt:0 "我们将#R 无法#!创建#E 伊利里亚#!。"
 crossroads_of_adriatic:0 "亚得里亚海的十字路口"
 cult_of_zis:0 "齐斯崇拜"
 event_war_over_tt:0 "我们已经#G 赢得#!或#R 输掉#!了对抗#Y 卢坎人#!的战争。奖励将根据结果有所不同。\n\n这场战争发生在#Y 事件链#!中。"
 expand_statesmanship_tt:0 "每个角色将获得#Y 5#!@statesmanship!政治手腕。"
 illyria_owned_provinces_tt:0 "在#Y [GetProvince('(int32)8026').GetArea.GetRegion.GetName]#!地区至少拥有#Y 40#!个省份。（[SCOPE.ScriptValue('illyria_region_owned_prov_svalue')|R0]/#Y 40#!）"
 italia_owned_provinces_tt:0 "在#Y [GetProvince('(int32)1').GetArea.GetRegion.GetName]#!地区至少拥有#Y 40#!个省份。（[SCOPE.ScriptValue('italia_region_owned_prov_svalue')|R0]/#Y 40#!）"
 laws_and_litigations:0 "新法律的出现"
 lessons_from_war:0 "战争的教训"
 lucania_war_rep_tt:0 "卢卡尼亚向胜利方的每个参与者支付这笔金额。"
 marulum_nostrum:0 "我们的马拉鲁姆"
 marulum_nostrum_tt:0 "拥有亚得里亚海周围的所有沿海省份。（[SCOPE.ScriptValue('adriatic_coast_owned_prov_svalue')|R0]/#Y 59#!）"
 me_messapia_1.a:0 "死亡等待着我们所有人。"
 me_messapia_10.a:0 "我们将拥抱我们的表亲。"
 me_messapia_10.b:0 "梅萨皮亚人与其他人都不同。奴役他们。"
 me_messapia_101.a:0 "塔林敦可以指望我们的支持。"
 me_messapia_101.b:0 "我们不在乎塔林敦的命运。"
 me_messapia_101_desc:0 "[GetProvince('(int32)56').GetName|E]被#E 卢卡尼亚#!部落攻击了！这一发展可能会彻底打破该地区的权力平衡。然而，如果我们加入战争，这也许可以为我们所用。虽然我们与#E 塔林敦#!的关系有些复杂，但我们不应让过去决定我们的未来行动。"
 me_messapia_101_title:0 "塔林敦-卢卡尼亚战争"
 me_messapia_102.a:0 "请求斯巴达人来援助我们。"
 me_messapia_102.b:0 "我们可以自己处理。"
 me_messapia_102_desc:0 "我们一直与#E 意大利#!和#E 梅萨皮人#!部落有问题，但是，#E 卢卡尼亚#!和#E 萨莫奈#!部落可能过于强大，我们无法独自防御。我们的母城#E 斯巴达#!或许可以说服加入战争，彻底改变战争局势，有利于我们。"
 me_messapia_102_title:0 "母爱"
 me_messapia_103.a:0 "我们将击溃所有反对塔拉斯的人！"
 me_messapia_103.b:0 "我们有更重要的事情要处理。"
 me_messapia_103_desc:0 "[GetProvince('(int32)56').GetName|E]的人们在很多方面就是#E 斯巴达人#!。殖民地是由[GetProvince('(int32)56').GetArea.GetRegion.GetName|E]的一些#E 斯巴达人#!建立的，现在他们需要我们的帮助。邪恶的#E 卢卡尼亚#!部落袭击了他们。如果我们选择帮助我们的女儿殖民地，我们的军队将使[GetProvince('(int32)56').GetName|E]的敌人充满恐惧。"
 me_messapia_103_title:0 "塔拉斯陷入困境"
 me_messapia_104.a:0 "这将确保我们的胜利！"
 me_messapia_104.b:0 "我们将消灭斯巴达人。"
 me_messapia_104.c:0 "我们投降！"
 me_messapia_104_desc:0 "#E 斯巴达人#!决定加入战争，表明他们愿意帮助他们在[GetProvince('(int32)56').GetName|E]的女儿殖民地。强大的传奇战士将抵达#E 意大利#!，肯定会影响战争的状态。"
 me_messapia_104_title:0 "斯巴达人到来"
 me_messapia_105.a:0 "现在进军卢卡尼亚！"
 me_messapia_105.b:0 "那些懦夫……"
 me_messapia_105_desc:0 "#E 萨莫奈#!部落已经投降了！#E 卢卡尼亚#!被摧毁只是时间问题。战争很快就要结束了。"
 me_messapia_105_title:0 "萨莫奈的投降。"
 me_messapia_108.a:0 "欢呼吧，万岁！"
 me_messapia_108.b:0 "我们下次一定会打败他们……"
 me_messapia_108_desc:0 "亚得里亚海东海岸欢呼声四起。#E 塔林敦#!及其盟友成功赢得了#E 卢卡尼亚-塔林敦#!战争！"
 me_messapia_108_title:0 "塔林敦的胜利！"
 me_messapia_109.a:0 "我们现在必须投降……"
 me_messapia_109.b:0 "我们绝不屈服！"
 me_messapia_109_desc:0 "#E 萨莫奈人#!已经……投降了。这对我们的胜利机会是一个巨大的打击。我们是否还应该继续这场战争？可能继续战斗已不再值得。"
 me_messapia_109_title:0 "萨莫奈退出战争"
 me_messapia_10_desc:0 "#E 伊利里亚#!的#E 伊利里亚人#!，我们自己文化的起源者。随着时间的推移，我们与他们有了很大的分歧，我们可以重新采纳许多已经失去的传统，特别是在建立一个新的#E 政府#!方面。然而，他们嘲笑我们的口音，说我们已经变得太多。也许相反，我们应该像对待其他被征服的民族一样对待他们：作为奴隶。"
 me_messapia_10_title:0 "$messapia_missions_task_10$"
 me_messapia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_messapia_11.a:0 "嗷呜！"
 me_messapia_110.a:0 "我们必须接受失败。"
 me_messapia_110.b:0 "我们必须在没有斯巴达支持的情况下赢得胜利。"
 me_messapia_110_desc:0 "#E 斯巴达人#!拒绝帮助我们！听到这个消息令人极度失望，我们的士气每秒钟都在下降……我们应该怎么办？"
 me_messapia_110_title:0 "被斯巴达抛弃"
 me_messapia_111.a:0 "塔林敦人的表现可耻。"
 me_messapia_111.b:0 "哈！我们的力量和勇气赢得了胜利。"
 me_messapia_111_desc:0 "城邦#E 塔拉斯#!，又称#E 塔林敦#!，宣布了他们打算投降的意图。战争中的#E 卢卡尼亚#!一方击败了这座声名显赫的城邦。"
 me_messapia_111_title:0 "塔林敦颤抖"
 me_messapia_112.a:0 "失望至极……"
 me_messapia_112.b:0 "这场战争胜利在望！"
 me_messapia_112.c:0 "挥舞白旗表示投降。"
 me_messapia_112.d:0 "组建新军队以弥补损失。"
 me_messapia_112_desc:0 "两军对峙，一边是#E 卢卡尼亚#!部落，另一边是城邦#E 塔拉斯#!。数千人交战，#E 塔林敦#!的重装步兵对阵#E 卢卡尼亚#!的骑兵。然而，最终是#E 卢卡尼亚#!击败了他们的敌人，给失败的#E 塔林敦#!造成了巨大的损失。他们能否从这次失败中恢复过来？"
 me_messapia_112_title:0 "势不可挡的卢卡尼亚"
 me_messapia_113.a:0 "这场战争胜利在望！"
 me_messapia_113.b:0 "这预示着我们阵营的失败。"
 me_messapia_113.c:0 "我们必须向希腊人投降。"
 me_messapia_113.d:0 "我们绝不向希腊人屈膝！"
 me_messapia_113_desc:0 "两军对峙，一边是#E 卢卡尼亚#!部落，另一边是城邦#E 塔拉斯#!。数千人交战，#E 塔林敦#!的重装步兵对阵#E 卢卡尼亚#!的骑兵。然而，最终是#E 塔林敦#!击败了他们的敌人，给失败的#E 卢卡尼亚#!造成了巨大的损失。他们能否从这次失败中恢复过来？"
 me_messapia_113_title:0 "令人敬畏的塔林敦"
 me_messapia_114.a:0 "可耻的叛徒，没有他们我们也会赢。"
 me_messapia_114.b:0 "没有士兵我们无法获胜。我们投降。"
 me_messapia_114_desc:0 "许多#E 塔林敦#!士兵失踪了。指挥官们很快意识到，这些士兵实际上是逃兵。由于严重缺乏兵力，战争的继续进行受到了质疑。"
 me_messapia_114_title:0 "塔林敦逃兵"
 me_messapia_115.a:0 "我们必须继续战斗，以维护我们的联盟。"
 me_messapia_115.b:0 "我们已经尽力了，但一无所获。我们将退出战争。"
 me_messapia_115_desc:0 "随着战争的持续，#E 萨莫奈人#!可能是获得最少收益的一方。士气低落，态度冷淡。许多人开始质疑，为什么还要继续战斗。"
 me_messapia_115_title:0 "逐渐减少的价值"
 me_messapia_11_desc:0 "狼崇拜在#E 梅萨皮亚#!得到认可。最高兴的莫过于北部的#E 多尼安梅萨皮亚人#!，但无论如何，我们的信仰倾向于我们祖先的传统。"
 me_messapia_11_title:0 "$messapia_missions_task_11$"
 me_messapia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_messapia_12.a:0 "愿齐斯击倒我们的敌人！"
 me_messapia_12_desc:0 "#E 齐斯崇拜#!在我们人民中享有盛誉。虽然有人可能会说这只是希腊神祇#E 宙斯#!的一个变种，但我们的#E 齐斯#!实际上来自我们本土的传统。然而，不可否认的是，希腊宗教的盛行增强了我们对#E 齐斯#!的信仰，并使其更加辉煌。无论怎样，我们信仰的坚韧让我们的臣民越来越相信他的力量和威严。"
 me_messapia_12_title:0 "$messapia_missions_task_12$"
 me_messapia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_messapia_13.a:0 "马的父亲，愿你带领我们走向胜利！"
 me_messapia_13_desc:0 "#E 门扎纳斯崇拜#!是一种特定称号的崇拜，即所谓的#E 门扎纳斯#!称号。不仅如此，#E 门扎纳斯#!也是马神。因此，#E 朱庇特-门扎纳斯#!是我们的天父和马神。一个强大的神祇，无疑会激发我们的贵族！此外，我们的女神#E 维纳斯#!虽然与#E 伊特鲁里亚#!的女神#E 维纳斯#!相似，但实际上源自我们自己的起源。尽管存在这种假同源词，这两种女神的融合显然非常普遍，随着#E 门扎纳斯#!崇拜的兴起，#E 维纳斯#!崇拜也变得更加流行。"
 me_messapia_13_title:0 "$messapia_missions_task_13$"
 me_messapia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_messapia_14.a:0 "我们有梅萨皮亚的神祇，无论我们称他们为deus还是theos。"
 me_messapia_14_desc:0 "$messapia_missions_task_14_DESC$"
 me_messapia_14_title:0 "$messapia_missions_task_14$"
 me_messapia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_messapia_15.a:0 "希腊式的！"
 me_messapia_15.b:0 "意大利式的！"
 me_messapia_15.c:0 "伊利里亚式的！"
 me_messapia_15_desc:0 "虽然我们来自#E [GetReligion('illyrian_pantheon').GetName]#!海岸，但我们已经接受了#E [GetReligion('roman_pantheon').GetName]#!宗教，同时也深受#E [GetReligion('italic_pantheon').GetName]#!宗教的影响。因此，我们的信仰包含了这些宗教的元素。我们应该在[GetProvince('(int32)56').GetArea.GetName|E]和[GetProvince('(int32)39').GetArea.GetName|E]地区促进哪种宗教的增长？"
 me_messapia_15_title:0 "$messapia_missions_task_15$"
 me_messapia_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_messapia_16.a:0 "我们将建造最伟大的城市。"
 me_messapia_16_desc:0 "我们的首都[SCOPE.GetRootScope.GetCountry.GetCapital.GetName|E]位于#E 亚得里亚海#!不同民族的交汇点。无论是来自意大利或伊利里亚的#E 伊利里亚人#!；来自意大利、叙拉古或希腊的#E 希腊人#!；来自罗马、沃尔西尼或阿尔提努姆的#E 意大利人#!；他们都将会来到[SCOPE.GetRootScope.GetCountry.GetCapital.GetName|E]！"
 me_messapia_16_title:0 "$messapia_missions_task_16$"
 me_messapia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_messapia_17.a:0 "迈向新纪元！"
 me_messapia_17_desc:0 "经过所有辩论、整合和处理人民事务后，我们终于决定如何治理自己。伟大的#E 梅萨皮亚人#!部落可以文明化并采用我们认为合适的政府形式。"
 me_messapia_17_title:0 "$messapia_missions_task_17$"
 me_messapia_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_messapia_18.a:0 "[SCOPE.GetRootScope.GetCountry.GetName]统治着波浪。"
 me_messapia_18_desc:0 "我们跨越海洋进入#E 伊利里亚#!，我们的旧家园！随着这次征服完成，我们离将整个#E 亚得里亚海#!变为我们的私人海域又近了一步。这将极大地改善任何在#E 梅萨皮亚人#!水域旅行的商人的生活，是一个高尚而光荣的目标。"
 me_messapia_18_title:0 "$messapia_missions_task_18$"
 me_messapia_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_messapia_19.a:0 "现在谁是野蛮人？"
 me_messapia_19_desc:0 "很明显，过去我们在文化影响和宗教灵感方面从#E 希腊人#!那里学到了很多。然而，我们更进一步，将整个#E 希腊#!故乡纳入我们的势力范围！传说中的伟大城市#E 底比斯#!、#E 斯巴达#!和#E 雅典#!，都将在#E 梅萨皮亚#!旗帜下统一。"
 me_messapia_19_title:0 "$messapia_missions_task_19$"
 me_messapia_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_messapia_1_desc:0 "随着#E 卢坎战争#!的完成，我们需要超越它，开始确立自己为一个强大的国家和力量。时不我待！"
 me_messapia_1_title:0 "$messapia_missions_task_1$"
 me_messapia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_messapia_2.a:0 "接受！让婚礼钟声敲响吧！"
 me_messapia_2.b:0 "拒绝...这个联盟还有什么意义！？"
 me_messapia_20.a:0 "大伊利里亚万岁！"
 me_messapia_20.b:0 "难道大梅萨皮亚听起来不是更好吗？"
 me_messapia_200.a:0 "允许他们与我们联姻。"
 me_messapia_200.b:0 "拒绝他们的请求。"
 me_messapia_200_desc:0 "#E 梅萨皮亚人#!派来了使者，请求为了将来在#E 意大利#!的战役中得到我们的援助而联姻。我们的这些盟友非常有用，如果我们拒绝他们可能会感到不满。"
 me_messapia_200_title:0 "梅萨皮亚联姻"
 me_messapia_20_desc:0 "$messapia_missions_task_20_DESC$"
 me_messapia_20_title:0 "$messapia_missions_task_20$"
 me_messapia_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_messapia_21.a:0 "未来一片光明。"
 me_messapia_21_desc:0 "我们选择了我们的道路。采纳了新的政府形式，接受了新的宗教灵感，并征服了新的土地。我们真正成为了一个前所未有的文明化的[GetCulture('messapian').GetName|E]国家。随着我们的未来得到了保障，我们可以安全地顺应时间的潮流，享受我们自己的荣耀。"
 me_messapia_21_title:0 "$messapia_missions_task_21$"
 me_messapia_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_messapia_22.a:0 "这是所有梅萨皮亚人的光辉胜利！"
 me_messapia_22.b:0 "敌人的城市将成为我们的新首都。"
 me_messapia_22_desc:0 "$messapia_missions_task_22_DESC$"
 me_messapia_22_title:0 "$messapia_missions_task_22$"
 me_messapia_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_messapia_23.a:0 "梅萨皮亚人团结强大。"
 me_messapia_23_desc:0 "北部的佩克提安人形成了#E 阿普利亚#!部落。南部真正的梅萨皮亚人形成了#E 梅萨皮亚#!部落。然而，我们都是伊阿皮吉亚人，即#E [GetCulture('messapian').GetName]#!人。为了我们和他们的利益，我们可以外交上团结起来，共同对抗那些想要抹去我们在意大利的人民、文化和信仰的人。\n\n我们只需要一句话就能将两个部落联合成一个联盟。"
 me_messapia_23_title:0 "$messapia_missions_task_23$"
 me_messapia_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_messapia_24.a:0 "我是毁灭者！"
 me_messapia_24_desc:0 "曾经伟大的罗马帝国已屈服于我们的脚下。不久之后，罗马将成为历史上的一个脚注，不，是我们故事中的一个脚注。我们的故事——从小部落和城邦之间的争斗开始，到征服#E 意大利#!，再到#E 罗马毁灭者#!。"
 me_messapia_24_title:0 "$messapia_missions_task_24$"
 me_messapia_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_messapia_25.a:0 "饥饿不再是问题。"
 me_messapia_25_desc:0 "$messapia_missions_task_25_DESC$"
 me_messapia_25_title:0 "$messapia_missions_task_25$"
 me_messapia_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_messapia_26.a:0 "一个伊利里亚式的意大利诞生了。"
 me_messapia_26_desc:0 "崎岖的#E 意大利#!大地，几代以来我们称之为家的山脉，现已完全处于我们的控制之下。确实，#E 意大利#!几乎不能被称为意大利，因为它现在是#E 梅萨皮亚#!！抛开大胆的宣言不说，这一成就将使我们的显赫地位如此显著，历史永远不会忘记我们。"
 me_messapia_26_title:0 "$messapia_missions_task_26$"
 me_messapia_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_messapia_27.a:0 "我们小小的亚得里亚~"
 me_messapia_27_desc:0 "$messapia_missions_task_27_DESC$"
 me_messapia_27_title:0 "$messapia_missions_task_27$"
 me_messapia_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_messapia_28.a:0 "让我们好好利用这些教训吧。"
 me_messapia_28_desc:0 "无论胜败，我们从#E 卢卡尼亚战争#!以及与其他如#E 塔林敦#!的战争中学到的经验教训对我们来说都是有用的。每一场胜利或失败，每一个英雄般的胜利或灾难性的牺牲，都不是徒劳无功的。在很多方面，知识和经验是我们人民最大的财富。"
 me_messapia_28_title:0 "$messapia_missions_task_28$"
 me_messapia_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_28$#!' $mission_completed_tooltip_2$"
 me_messapia_2_desc:0 "我们已于180天前向#E 伊庇鲁斯人#!发送了联姻请求。我们刚刚收到了他们对信件的回复。我们在#E 伊庇鲁斯#!的盟友..."
 me_messapia_2_title:0 "$messapia_missions_task_2$"
 me_messapia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_messapia_3.a:0 "他们都向我鞠躬！"
 me_messapia_3_desc:0 "[GetProvince('(int32)39').GetArea.GetName|E]区域大部分被#E 罗马#!势力占领。然而，这一情况已经被改变。#E 梅萨皮亚人#!现在自由并获得了解放。我们现在应该将注意力转向#E 意大利#!南部以及#E 大希腊#!的财富。同时庆祝一下，因为整个[GetProvince('(int32)39').GetArea.GetName|E]区域都已自由！"
 me_messapia_3_title:0 "$messapia_missions_task_3$"
 me_messapia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_messapia_4.a:0 "整个意大利都将属于梅萨皮亚。"
 me_messapia_4_desc:0 "入侵#E 意大利#!南部取得了彻底的成功。#E 梅萨皮亚人#!终于成为了一股连#E 罗马人#!也无法忽视的强大势力。现在我们将目光投向其余的#E 意大利#!，即真正的#E 意大利#!。其中包含了圣城#E 罗马#!本身。"
 me_messapia_4_title:0 "$messapia_missions_task_4$"
 me_messapia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_messapia_5.a:0 "我们将统治从海到闪耀之海的所有地方。"
 me_messapia_5_desc:0 "#E 亚得里亚海#!对于许多人来说是一个边界，但对我们#E 梅萨皮亚人#!而言却不是。我们曾穿越它，从#E 伊利里亚#!迁移到#E 意大利#!，现在我们将再次这样做。启航前往我们的古老家园，同时也向着希腊人的发源地前进。"
 me_messapia_5_title:0 "$messapia_missions_task_5$"
 me_messapia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_messapia_6.a:0 "羊皮纸的力量。"
 me_messapia_6_desc:0 "#E 希腊#!的知识流入我们的图书馆。通过征服几个#E 大希腊#!的城市，我们已经开始受益于#E 希腊#!的学习。这有助于我们自己的研究和技术或创新的发展。"
 me_messapia_6_title:0 "$messapia_missions_task_6$"
 me_messapia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_messapia_7.a:0 "快，让我们起草新法律！"
 me_messapia_7_desc:0 "当我们处于不同地区和文化的交汇处进行中央集权时，我们开始采用新的法律。在此期间，我们需要记住政治灵活性的价值。一个伟大的变革时代即将到来，#E 梅萨皮亚#!人民的治理方式本身也将随之改变。"
 me_messapia_7_title:0 "$messapia_missions_task_7$"
 me_messapia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_messapia_8.a:0 "我们可以从这些希腊人那里学到东西。"
 me_messapia_8.b:0 "让我们摆脱这些人。"
 me_messapia_8_desc:0 "我们土地上的#E 希腊#!存在是我们必须解决的问题。我们应该采纳他们的方法，#E 希腊化#!，并为自己采用他们的#E 治理#!传统...或者干脆奴役他们，摆脱#E 希腊#!思想带来的麻烦。"
 me_messapia_8_title:0 "$messapia_missions_task_8$"
 me_messapia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_messapia_9.a:0 "他们有很多可以教我们的。"
 me_messapia_9.b:0 "我对‘意大利人’毫不在乎。"
 me_messapia_9_desc:0 "我们的#E 伊特鲁里亚#!臣民是一个庞大的群体。他们是#E 意大利#!最初的民族，在治理方面可能有许多可以学习的地方。然而，我们也可以摆脱#E 伊特鲁里亚化#!，直接奴役他们。选择在于您，我的君主。"
 me_messapia_9_title:0 "$messapia_missions_task_9$"
 me_messapia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $messapia_missions_task_9$#!' $mission_completed_tooltip_2$"
 menzanas_cult_tt:0 "#E 解锁#!新的意大利-梅萨皮#E 神祇#!。"
 mes_enslaved_hellenic_tt:0 "所有#Y [GetCultureGroup('hellenic').GetName]#!文化组的文化都将被奴役。"
 mes_enslaved_illyrian_tt:0 "所有#Y [GetCultureGroup('illyrian_group').GetName]#!文化组的文化（除了[GetCulture('messapian').GetName]）都将被奴役。"
 mes_enslaved_latin_tt:0 "所有#Y [GetCultureGroup('latin').GetName]#!文化组的文化都将被奴役。"
 mes_goc_choice_tt:0 "我们将根据我们如何对待#Y [GetCultureGroup('hellenic').GetName]#!、#Y [GetCultureGroup('latin').GetName]#!和#Y [GetCultureGroup('illyrian_group').GetName]#!文化组来改变我们的#Y 政府#!。"
 mes_gov_ath_cmod:0 "效仿雅典"
 mes_gov_enslaved_all_cmod:0 "绝对权力至上"
 mes_gov_hel_cmod:0 "追随文明的脚步"
 mes_gov_hel_il_cmod:0 "文明化伊利里亚人"
 mes_gov_il_cmod:0 "踏上传统之路"
 mes_gov_integrated_all_cmod:0 "自由之国"
 mes_gov_lat_cmod:0 "遵循意大利模式"
 mes_gov_lat_hel_cmod:0 "复制文明"
 mes_gov_lat_il_cmod:0 "传统与新颖的交织"
 mes_rel_task_tt:0 "\n任务#Y $messapia_missions_task_11$#!、#Y $messapia_missions_task_12$#!和#Y $messapia_missions_task_13$#!是#R 相互排斥#!的"
 messapia_alliance_break_tt:0 "我们可能#R 断绝#!与#E 梅萨皮人的联盟#!。"
 messapia_balkan_tt:0 "我们的国家至少有#Y 250#!个非[GetCulture('messapian').GetName]的[GetCultureGroup('illyrian_group').GetName]人口。（[SCOPE.ScriptValue('messapia_balkan_pops_svalue')|R0]/#Y 250#!）"
 messapia_conversion_hellenic_tt:0 "我们的国家至少有#Y 200#!个[GetReligion('roman_pantheon').GetName]人口。（[SCOPE.ScriptValue('messapia_religion_hellenic_svalue')|R0]/#Y 200#!）"
 messapia_conversion_illyric_tt:0 "我们的国家至少有#Y 125#!个[GetReligion('illyrian_pantheon').GetName]人口。（[SCOPE.ScriptValue('messapia_religion_illyrian_svalue')|R0]/#Y 125#!）"
 messapia_conversion_italic_tt:0 "我们的国家至少有#Y 200#!个[GetReligion('italic_pantheon').GetName]人口。（[SCOPE.ScriptValue('messapia_religion_italic_svalue')|R0]/#Y 200#!）"
 messapia_greece_attack_tt:0 "至少拥有#Y 1#!个高亮显示的省份。"
 messapia_greeks_decision_tt:0 "我们将决定如何处理#Y 希腊人#!。"
 messapia_hellenistic_tt:0 "我们的国家至少有#Y 250#!个[GetCultureGroup('hellenic').GetName]人口。（[SCOPE.ScriptValue('messapia_hellenistic_pops_svalue')|R0]/#Y 250#!）"
 messapia_illyrians_decision_tt:0 "我们将决定如何处理#Y 伊利里亚人#!。"
 messapia_italian_tt:0 "我们的国家至少有#Y 250#!个[GetCultureGroup('latin').GetName]人口。（[SCOPE.ScriptValue('messapia_latin_pops_svalue')|R0]/#Y 250#!）"
 messapia_marriage_good_tt:0 "与#E 梅萨皮人#!的一次#G 联姻#!将发生。"
 messapia_missions:0 "意大利的伊利里亚"
 messapia_missions_BUTTON_TOOLTIP:0 "意大利属于#E 梅萨皮人#!!"
 messapia_missions_CRITERIA_DESCRIPTION:0 "当#E [GetCulture('messapian').GetName]#!成为#E 意大利#!的主要势力时，该任务将完成。"
 messapia_missions_DESCRIPTION:0 "从公元前一千年初开始，#E [GetCulture('messapian').GetName]人#!分为两波来到#E 意大利#!。他们来自[GetCultureGroup('illyrian_group').GetName|E]的#E 伊阿皮吉亚#!部落，以其‘狼崇拜’而闻名。然而，到公元前304年，他们已经吸收了许多[GetCultureGroup('latin').GetName|E]和[GetCultureGroup('hellenic').GetName|E]的影响，从而形成了独特的文化融合。"
 messapia_missions_task_1:0 "卢坎战争"
 messapia_missions_task_10:0 "启蒙的伊利里亚人"
 messapia_missions_task_10_DESC:0 "为了向前发展，我们常常需要回顾过去。当然，我们保留了许多与我们的#E [GetCulture('messapian').GetCultureGroup.GetName]#!兄弟相同的自我治理思想，但我们仍可以通过他们学到更多。无论是通过他们与其他更文明民族的接触，还是直接学习，我们都可以从#Y 政府#!中学到很多关于表亲的知识。"
 messapia_missions_task_11:0 "拥抱狼崇拜"
 messapia_missions_task_11_DESC:0 "达乌尼部落的#E [GetCulture('messapian').GetName|E]#!向我们介绍了他们的#Y 狼崇拜#!，而东部的#E [GetCulture('messapian').GetCultureGroup.GetName]#!告诉我们他们的#Y 太阳崇拜#!、#Y 蛇崇拜#!和#Y 骑士崇拜#!。如果我们选择采纳更多的#E [GetReligion('illyrian_pantheon').GetName|E]#!宗教影响，所有这些崇拜可能非常适合我们多样的宗教立场。"
 messapia_missions_task_12:0 "美化齐斯崇拜"
 messapia_missions_task_12_DESC:0 "我们的信仰最接近于#E [GetReligion('roman_pantheon').GetName|E]#!宗教，并且应保持这种方式。通过更多的[GetReligion('roman_pantheon').GetName|E]影响，我们可以#Y 美化#!对[GetDeityDefinition('omen_zis').GetName|E]的崇拜，并从我们坚定而一致的信仰中获得益处。"
 messapia_missions_task_13:0 "增强门扎纳斯崇拜"
 messapia_missions_task_13_DESC:0 "[GetReligion('italic_pantheon').GetName|E]宗教长期以来影响着独特的神祇。确实，更直接地#Y 接受#![GetReligion('italic_pantheon').GetName|E]的影响将使我们本土的神祇进一步#Y 增强#!，让我们更好地受到庇护神的奖赏。"
 messapia_missions_task_14:0 "梅萨皮亚的信仰"
 messapia_missions_task_14_DESC:0 "无论我们从哪种信仰中汲取更多影响，我们都发现自己处于一种无疑将三种信仰融入我们自己的品牌[SCOPE.GetRootScope.GetCountry.GetReligion.GetName|E]宗教的情况。随着我们的[GetCulture('messapian').GetName|E]信仰传播开来，它在新的影响下不断成长和繁荣，适应当地信仰的同时，在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName|E]得到维护和集中。"
 messapia_missions_task_15:0 "德乌斯还是特奥斯？"
 messapia_missions_task_15_DESC:0 "虽然我们来自#E [GetReligion('illyrian_pantheon').GetName]#!海岸，但我们已经接受了#E [GetReligion('roman_pantheon').GetName]#!宗教，同时又深受#E [GetReligion('italic_pantheon').GetName]#!宗教的影响。因此，我们的信仰包含了这些宗教的元素。随着我们扩展影响力并整合更多这些宗教的信仰，我们应该接受哪个民族的信仰影响的问题仍然悬而未决。"
 messapia_missions_task_16:0 "亚得里亚海的十字路口"
 messapia_missions_task_16_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]的位置非常适合吸收来自#E 意大利#!、#E 希腊#!和#E 伊利里亚#!的文化、政治和宗教影响。这不仅为我们提供了一个繁荣的首都，也为我们决定采纳哪些文化影响提供了决策之地。"
 messapia_missions_task_17:0 "梅萨皮亚王国"
 messapia_missions_task_17_DESC:0 "我们的王国准备好选择我们的#Y 政府#!了。我们研究了周围的各个民族，因此我们有信心做出选择。"
 messapia_missions_task_18:0 "古老的家园"
 messapia_missions_task_18_DESC:0 "[GetProvince('(int32)8026').GetArea.GetRegion.GetName|E]曾是我们的原始家园。尽管我们与他们有了很大分歧，但我们依然是#E [GetCulture('messapian').GetCultureGroup.GetName]#!人。因此，现在是我们整合表亲，向他们展示我们从#E 希腊人#!和#E 罗马人#!那里学到的东西的时候了，同时提醒他们和我们自己祖先的土地。"
 messapia_missions_task_19:0 "进入希腊"
 messapia_missions_task_19_DESC:0 "似乎不管朝哪个方向看，都有[GetCulture('macedonian').GetCultureGroup.GetName|E]人民。我们迟早会把目光投向[GetProvince('(int32)432').GetArea.GetRegion.GetName|E]本身。"
 messapia_missions_task_1_DESC:0 "公元前303年，一场涉及#E [GetCulture('messapian').GetName]人#!、#E 塔林敦#!、#E 斯巴达#!和#E 卢卡尼#!的短期战争爆发了。我们必须等到解决完战争问题后，才能继续制定其他计划。"
 messapia_missions_task_2:0 "皮洛士的计划"
 messapia_missions_task_20:0 "大伊利里亚"
 messapia_missions_task_20_DESC:0 "一个名为‘大伊利里亚’的想法已经形成。就像希腊有他们的‘大希腊’一样，我们的大伊利里亚是由前[GetCulture('messapian').GetCultureGroup.GetName|E]殖民地建立的，提供了比我们原籍更多的土地和人口，并全面超越了我们的起源。我们创造了一个新的家园、新文化、新宗教、新管理和新民族。大伊利里亚万岁！"
 messapia_missions_task_21:0 "我们的未来已定"
 messapia_missions_task_21_DESC:0 "我们选择了如何通过#Y 治理#!和#Y 宗教#!来发展我们的#Y 文化#!。我们真正成为了一个前所未有的文明化的[GetCulture('messapian').GetName|E]国家。我们的未来得到了保障，我们的遗产才刚刚开始建立。"
 messapia_missions_task_22:0 "战胜塔林敦"
 messapia_missions_task_22_DESC:0 "#E 塔林敦#!数百年来一直是我们的刺！这个斯巴达殖民地和我们与他们复杂的关系构成了我们人民历史上最大的竞争。这一切终于结束了。[GetProvince('(int32)56').GetName|E]现在是一个[GetCulture('messapian').GetName|E]城市！"
 messapia_missions_task_23:0 "血亲兄弟"
 messapia_missions_task_23_DESC:0 "北部的剖刻提人形成了#E 阿普利亚#!部落。南部真正的梅萨皮亚人形成了#E 梅萨皮亚#!部落。然而，我们都是伊阿皮吉亚人，即#E [GetCulture('messapian').GetName]#!人。为了我们和他们的利益，我们可以外交上团结起来，共同对抗那些想要抹去我们在意大利的人民、文化和信仰的人。"
 messapia_missions_task_24:0 "毁灭罗马"
 messapia_missions_task_24_DESC:0 "[GetProvince('(int32)1').GetName|E]，伟大的文明和[GetProvince('(int32)56').GetArea.GetRegion.GetName|E]的城市，终将由我们亲手结束。当[GetProvince('(int32)1').GetName|E]曾经是#E 意大利#!最伟大的城市时，它将被[SCOPE.GetRootScope.GetCountry.GetCapital.GetName|E]取代。"
 messapia_missions_task_25:0 "夺取西西里"
 messapia_missions_task_25_DESC:0 "[GetProvince('(int32)84').GetArea.GetName|E]是一片非常富饶的土地。作为最伟大的希腊殖民地之一，[GetProvince('(int32)84').GetName|E]应该成为我们的领地。凭借[GetProvince('(int32)84').GetArea.GetName|E]的谷物和财富，我们将为我们的人民和影响力提供数代的支持。"
 messapia_missions_task_26:0 "征服意大利内陆"
 messapia_missions_task_26_DESC:0 "在很多方面，意大利已经成为我们的新家园。那么，让我们征服其余部分吧！[GetCulture('roman').GetCultureGroup.GetName|E]的方式已经以许多方式影响了我们的文化，从小小的民间传说到农业和耕作的最大方式。最终，整个地区都将在我们的影响之下。"
 messapia_missions_task_27:0 "我们的小海"
 messapia_missions_task_27_DESC:0 "‘我们的海’的概念是基于拥有整个海域的海岸线。作为亚得里亚海之间文化和宗教的交汇点，我们应当拥有自己的‘我们的海’。然而，亚得里亚海作为一个家园比地中海要小得多，所以‘Marulum’或‘小’的‘我们的海’可能更为合适。"
 messapia_missions_task_28:0 "战争的教训"
 messapia_missions_task_28_DESC:0 "这次，我们与#E 希腊人#!并肩作战而不是对抗。从中，我们学到了更多关于他们战争方式的知识。让我们投资于实施他们的方法，以提升我们自身的能力。"
 messapia_missions_task_2_DESC:0 "年轻但野心勃勃的#E 伊庇鲁斯人#![GetCharacter('(int32)70').GetPraenomen]计划入侵意大利并攻打#E 罗马#!。我们可以加入他们对抗#E [GetCulture('roman').GetName]#!的战争，或者我们只需等待并利用局势以自己的方式获利。"
 messapia_missions_task_3:0 "阿普利亚的获取"
 messapia_missions_task_3_DESC:0 "北部的达乌尼部落是#E [GetCulture('messapian').GetName]#!人民的一部分...然而他们已被#E [GetCulture('roman').GetName]#!和其他#E [GetCultureGroup('latin').GetName]#!占领。我们必须解放他们，并提醒他们作为血亲兄弟的意义。"
 messapia_missions_task_4:0 "意大利的入侵"
 messapia_missions_task_4_DESC:0 "#E [GetCulture('roman').GetName]#!、#E [GetCulture('etruscan').GetName]#!及其他#E [GetCulture('roman').GetCultureGroup.GetName]#!的财富将是我们的！这片土地是我们的家园，现在是时候让那些与我们共同居住在#E 意大利#!的人们明白这一点了。"
 messapia_missions_task_5:0 "跨越亚得里亚海"
 messapia_missions_task_5_DESC:0 "我们的祖先故土#E 伊利里亚#!近在咫尺。征服它并不意味着回到过去，而是通过重新找回古老根基来引入新的元素。让我们把影响力扩展到#E [GetCulture('messapian').GetCultureGroup.GetName]#!的土地上。"
 messapia_missions_task_6:0 "大希腊的任务"
 messapia_missions_task_6_DESC:0 "在整个历史中，#E 大希腊#!及其人民与我们之间的关系可能是最变幻莫测的。我们曾与他们作战，但也曾为他们而战。无论如何，完全征服这片地区将确保它永远成为盟友而非敌人。"
 messapia_missions_task_7:0 "法律与诉讼"
 messapia_missions_task_7_DESC:0 "随着我们逐渐成为一个正式的国家，我们有许多关于如何做到这一点的考虑。#E [GetCulture('roman').GetName]#!展示了其中一种模式，而#E [GetCulture('italiotian').GetName]#!则向我们展示了另一种模式，#E [GetCulture('syracusan').GetName]#!也给我们展示了多种治理模式的例子。让我们决定究竟采用哪种结构。"
 messapia_missions_task_8:0 "希腊治理"
 messapia_missions_task_8_DESC:0 "希腊的治理方式多种多样。例如，#E [GetCulture('macedonian').GetName]#!有#Y 贵族君主制#!系统，而#E [GetCulture('athenian').GetName]#!有一个#Y 民主共和国#!。当然还有#E [GetCulture('peloponnesian').GetName]#!的#Y 斯巴达二元制#!。此外，#E [GetCulture('italiotian').GetName]#!的#Y 城邦#!与#E [GetCulture('syracusan').GetName]#!使用的多种系统也不同。简而言之，我们有很多不同的方式将#E 希腊#!的治理理念应用到我们的国家。"
 messapia_missions_task_9:0 "意大利探索"
 messapia_missions_task_9_DESC:0 "意大利的治理方式包括#E [GetCulture('roman').GetName]#!及其#Y 共和国#!，还包括#E [GetCulture('etruscan').GetName]#!及其去中心化的#Y 君主制#!。无论如何，我们决定探索#E 意大利#!原住民的方式，以确定哪种最适合我们的国家。"
 messapia_romans_decision_tt:0 "我们将决定如何处理#Y 意大利人#!。"

 bharat_missions_task_9_K_tooltip:0 "任何省份至少生产5个#Y 玻璃#!@glass!。"
 bharat_missions_task_9_L_tooltip:0 "任何省份至少生产5个#Y 丝绸#!@silk!。"
 bharat_missions_task_9_M_tooltip:0 "每个相关省份获得#G +10%商业价值，+1基础资源，+3来自奴隶的货物#!。"

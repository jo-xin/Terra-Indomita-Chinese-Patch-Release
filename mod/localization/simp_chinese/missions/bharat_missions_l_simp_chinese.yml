 bharat_missions:0 "印度帝国"
 bharat_missions_BUTTON_TOOLTIP:0 "我们将统治世界！"
 bharat_missions_CRITERIA_DESCRIPTION:0 "当我们效仿亚历山大的征服完成时，该使命完成。"
 bharat_missions_DESCRIPTION:0 "我们是婆罗多人"
 bharat_missions_task_1:0 "统一雅利安"
 bharat_missions_task_10:0 "印度的奇观"
 bharat_missions_task_10_A_tooltip:0 "#Y 钵帝傥那#!已经有一个我国建造的奇观了"
 bharat_missions_task_10_B_tooltip:0 "#Y 伽耶#!已经有一个我国建造的奇观了"
 bharat_missions_task_10_C_tooltip:0 "#Y 乌洛逾罗#!已经有一个我国建造的奇观了"
 bharat_missions_task_10_DESC:0 "我们将建造我们自己的奇观，让希腊的建筑蒙羞--印度的奇迹将让世界眼花缭乱，经久不衰。"
 bharat_missions_task_10_D_tooltip:0 "#Y 筏他婆陀#!已经有一个我国建造的奇观了"
 bharat_missions_task_10_E_tooltip:0 "#Y 钵罗薄娑#!已经有一个我国建造的奇观了"
 bharat_missions_task_11:0 "征服吐蕃和巴克特里亚"
 bharat_missions_task_11_B_tooltip:0 "[mission_country.GetRuler.GetName]获得#Y 优良的军事才干#!特质。"
 bharat_missions_task_11_DESC:0 "自雅利安人入侵以来，青藏高原和巴克特里亚地区一直是进入印度的主要门户。确保这些周边地区的安全将永久地结束北方的威胁，打开通往彪悍的草原马匹栖息地的通道，并为世界闻名的巴克特里亚山脉中的宝石开辟采矿机会。"
 bharat_missions_task_11_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_12:0 "征服波斯"
 bharat_missions_task_12_DESC:0 "在过去的几个世纪里，波斯被再三证明是对独立印度的威胁，他们是伊朗游牧民族突袭的通道，是波斯人进攻的基地，现在又是希腊入侵者的垫脚石。我们必须确保这些土地的安全，以保卫我们的西翼。"
 bharat_missions_task_12_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_13:0 "征服美索不达米亚"
 bharat_missions_task_13_DESC:0 "底格里斯河和幼发拉底河的大都会自阿契美尼德时代以来一直是对印度独立的威胁。占领它们不仅可以保证印度的安全，还可以为帝国带来数不清的财富和新的粮仓。"
 bharat_missions_task_13_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_14:0 "征服埃及"
 bharat_missions_task_14_A_tooltip:0 "[mission_country.GetRuler.GetName]是否应该宣称获得#Y 法老#!的称号？"
 bharat_missions_task_14_DESC:0 "传说中的法老的古老土地将是我们的，为我们不断发展的帝国带来永恒的荣耀和另一个农业中心。"
 bharat_missions_task_14_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_15:0 "征服叙利亚和阿拉伯"
 bharat_missions_task_15_DESC:0 "事实证明，叙利亚和阿拉伯的人民是好管闲事的中间人，他们依靠我们的贸易货物发财，并对通往欧洲和非洲的贸易路线进行控制。现在是时候亲手抓住这些关键的贸易路线，为自己攫取利益了。"
 bharat_missions_task_15_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_16:0 "进入小亚细亚"
 bharat_missions_task_16_DESC:0 "安纳托利亚的人民几乎和整个印度的人民一样多样化和分裂--当然是在我们征服之前。我们可以很容易地利用这些分裂来获得对西部这一战略地区的统治权，在希腊人的家门口。"
 bharat_missions_task_16_tooltip:0 "建立一个或多个#G 印度仆从国#! 或多个#G 印度殖民地#!。"
 bharat_missions_task_17:0 "大山历亚"
 bharat_missions_task_17_DESC:0 "我们终于控制了希腊人统治的腹地，印度已经报了仇！历史将歌颂我们的征服，而忘记亚历山大这个名字。"
 bharat_missions_task_18:0 "印度哲学"
 bharat_missions_task_18_A_tooltip:0 "以下条件至少满足一个：[SCOPE.GetRootScope.GetCountry.GetName|Y]的#Y 军略研究员#!至少有#Y 10军略#!或拥有以下特质#Y 废寝忘食、博学多才、博学或聪慧#!"
 bharat_missions_task_18_B_tooltip:0 "以下条件至少满足一个：[SCOPE.GetRootScope.GetCountry.GetName|Y]的#Y 民政研究员#!至少有#Y 10智略#!或拥有以下特质#Y 废寝忘食、博学多才、博学或聪慧#!"
 bharat_missions_task_18_C_tooltip:0 "以下条件至少满足一个：[SCOPE.GetRootScope.GetCountry.GetName|Y]的#Y 雄辩研究员#!至少有#Y 10魅力#!或拥有以下特质#Y 废寝忘食、博学多才、博学或聪慧#!"
 bharat_missions_task_18_DESC:0 "几个世纪以来，印度一直是学者、圣人和哲学家的天下。国家将通过促进印度的思想和灵魂的成就而繁荣。"
 bharat_missions_task_18_D_tooltip:0 "以下条件至少满足一个：[SCOPE.GetRootScope.GetCountry.GetName|Y]的#Y 宗教研究员#!至少有#Y 10热枕#!或拥有以下特质#Y 废寝忘食、博学多才、博学或聪慧#!"
 bharat_missions_task_18_E_tooltip:0 "确定婆罗多的哲学之路。"
 bharat_missions_task_19:0 "有组织的粮食生产"
 bharat_missions_task_19_A_tooltip:0 "至少#Y [SCOPE.ScriptValue('bharat_missions_task_19_food_total')|0]#!的#Y 谷物#!@grain!、#Y 盐#!@salt!、#Y 牲畜#!@cattle!、或#Y 蔬菜#!@vegetables!在#Y 印度#!在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的领土上生产。[SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_19_food_loc')]"
 bharat_missions_task_19_DESC:0 "虽然我们能够达到我们的生产配额，但粮食安全始终是一个不应忽视的问题。我们应该扩大目前的产能，尽可能多地储备，因为众神是变幻莫测的。"
 bharat_missions_task_19_food_loc_1:0 "(#R [SCOPE.ScriptValue('bharat_missions_task_19_food_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_19_food_total')|0]#!)"
 bharat_missions_task_19_food_loc_2:0 "(#Y [SCOPE.ScriptValue('bharat_missions_task_19_food_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_19_food_total')|0]#!)"
 bharat_missions_task_1_A_tooltip:0 "自身或附庸是唯一主导文化属于#Y 雅利安#! 文化组，或者没有国家的主导文化属于#Y 雅利安#! 文化组。"
 bharat_missions_task_1_B_tooltip:0 "有一个#Y 已整合文化#! 属于#Y 雅利安#! 文化组"
 bharat_missions_task_1_C_tooltip:0 "拥有雅利安文化占多数的大都会。"
 bharat_missions_task_1_DESC:0 "雅利安人在几个世纪前入侵印度次大陆，改变了历史的进程。统一雅利安邦国将确保我们在该地区的主导地位，并将印度河的古老文化中心地带置于我们的控制之下。"
 bharat_missions_task_2:0 "统一达罗毗荼"
 bharat_missions_task_20:0 "南方宝石"
 bharat_missions_task_20_A_tooltip:0 "在#Y 达罗毗荼#! 和#Y 羯那多#!区域，至少有#Y [SCOPE.ScriptValue('bharat_missions_task_20_gems_total')|0]#! #Y 宝石#!@gems!在#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的领土上生产。[SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_20_gems_loc')]"
 bharat_missions_task_20_DESC:0 "我们拥有得天独厚的自然资源，我们的宝石的质量是已知最好的，是全世界的国王和女王所渴望的。我们应该扩大生产吗？随着时间的推移，投资的成本将得到回报。"
 bharat_missions_task_20_gems_loc_1:0 "(#R [SCOPE.ScriptValue('bharat_missions_task_20_gems_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_20_gems_total')|0]#!)"
 bharat_missions_task_20_gems_loc_2:0 "(#Y [SCOPE.ScriptValue('bharat_missions_task_20_gems_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_20_gems_total')|0]#!)"
 bharat_missions_task_21:0 "制糖业的扩散"
 bharat_missions_task_21_A_tooltip:0 "至少#Y [SCOPE.ScriptValue('bharat_missions_task_21_sugar_total')|0]#!#Y 蔗糖#!@sugar!在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的领土上生产。[SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_21_sugar_loc')]"
 bharat_missions_task_21_DESC:0 "蔗糖是相当稀有的贸易商品，很多人愿意花所有的好运去品尝一口这种甜蜜，这是我们可以扩展生产的领域。讲真的，没有什么比钱币更甜蜜的了，我们将使这种商品远销海外。"
 bharat_missions_task_21_sugar_loc_1:0 "(#R [SCOPE.ScriptValue('bharat_missions_task_21_sugar_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_21_sugar_total')|0]#!)"
 bharat_missions_task_21_sugar_loc_2:0 "(#Y [SCOPE.ScriptValue('bharat_missions_task_21_sugar_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_21_sugar_total')|0]#!)"
 bharat_missions_task_22:0 "扶助南方商人"
 bharat_missions_task_22_A_tooltip:0 "在#Y $dravida_region$#!、#Y $karnata_region$#!、#Y $aparanta_region$#!或#Y $vindhyaprstha_region$#!地区至少有#Y [SCOPE.ScriptValue('bharat_missions_task_22_port_total')|0] 港口#!已建成。[SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_22_port_loc')] [SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_22_construction_loc')]。"
 bharat_missions_task_22_DESC:0 "我们南部沿海的港口城市将我们的优质商品运送到遥远的市场，确保了全年健康的贸易收入。考虑到这些收入流变得多么重要，我们应该尽一切努力帮助我们的南方贸易商人。"
 bharat_missions_task_22_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $dravida_region$#!、#Y $karnata_region$#!、#Y $aparanta_region$#!或#Y $vindhyaprstha_region$#!区域有正在进行的建设。"
 bharat_missions_task_22_port_loc_1:0 "(#R [SCOPE.ScriptValue('bharat_missions_task_22_port_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_22_port_total')|0]#!)"
 bharat_missions_task_22_port_loc_2:0 "(#Y [SCOPE.ScriptValue('bharat_missions_task_22_port_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_22_port_total')|0]#!)"
 bharat_missions_task_23:0 "专注于异国商品的出口"
 bharat_missions_task_23_A_tooltip:0 "至少#Y [SCOPE.ScriptValue('bharat_missions_task_23_exotic_total')|0]#! #Y 异域商品#! 在#Y 印度#!由#Y [SCOPE.GetRootScope.GetCountry.GetName]#!控制的土地生产。[SCOPE.GetRootScope.GetCountry.Custom('bharat_missions_task_23_exotic_loc')]\n异域货物包括： #!#Y 琥珀#! @amber! #Y 香料#! @spices! #Y 大象#! @elephants! #Y 玻璃#! @glass! #Y 丝绸#! @silk! #Y 宝石#! @gems! #!#Y 贵金属#! @precious_metals! #Y 染料#! @dye! #Y 蜂蜜#! @honey! #Y 香#! @incense! #Y 椰枣#! @dates! and #Y 蔗糖#! @sugar!. "
 bharat_missions_task_23_DESC:0 "虽然我们被赐予一切可以想象的好东西，但我们的外国出口在我们的贸易中占了很大的份额，这已经不是什么秘密了。通过专注于提高产量，我们将让我们的商人感到高兴，让他们的摊位备货充足。"
 bharat_missions_task_23_exotic_loc_1:0 "(#R [SCOPE.ScriptValue('bharat_missions_task_23_exotic_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_23_exotic_total')|0]#!)"
 bharat_missions_task_23_exotic_loc_2:0 "(#Y [SCOPE.ScriptValue('bharat_missions_task_23_exotic_current')|0]#!/#Y [SCOPE.ScriptValue('bharat_missions_task_23_exotic_total')|0]#!)"
 bharat_missions_task_2_A_tooltip:0 "自身或附庸是唯一主导文化属于#Y 达罗毗荼#! 文化组，或者没有国家的主导文化属于#Y 达罗毗荼#! 文化组。"
 bharat_missions_task_2_B_tooltip:0 "有一个#Y 已整合文化#! 属于#Y 达罗毗荼#! 文化组"
 bharat_missions_task_2_C_tooltip:0 "拥有达罗毗荼文化占多数的大都会。"
 bharat_missions_task_2_DESC:0 "印度南部的人民长期以来一直处于分裂状态，并相互争斗。现在是时候结束小规模的内斗，团结古老的达罗毗荼了。"
 bharat_missions_task_3:0 "统一般遮耶"
 bharat_missions_task_3_A_tooltip:0 "自身或附庸是唯一主导文化属于#Y 般遮耶#! 文化组，或者没有国家的主导文化属于#Y 般遮耶#! 文化组。"
 bharat_missions_task_3_B_tooltip:0 "有一个#Y 已整合文化#! 属于#Y 般遮耶#! 文化组"
 bharat_missions_task_3_C_tooltip:0 "拥有般遮耶文化占多数的大都会。"
 bharat_missions_task_3_DESC:0 "般遮耶是印度的经济和农业支柱。我们必须将该地区置于我们的统治之下，并利用在圣洁的恒河流域中的伟大城市的力量。"
 bharat_missions_task_4:0 "印度帝国"
 bharat_missions_task_4_A_tooltip:0 "拥有至少100个大队。"
 bharat_missions_task_4_B_tooltip:0 "#R 你的国家将进入一场致命的内战，祝你好运！#!。"
 bharat_missions_task_4_DESC:0 "我们的印度国家已经发展到成为一个帝国的程度。现在是我们接受帝国政府形式的时候了，以保持对我们现在负责的不同土地和人民的控制。"
 bharat_missions_task_5:0 "印度的宝藏"
 bharat_missions_task_5_A_tooltip:0 "采用#Y 印度佛教宝藏#! 的决议。"
 bharat_missions_task_5_B_tooltip:0 "以印度的#Y 吠陀宝藏#! 决定为例。"
 bharat_missions_task_5_DESC:0 "几个世纪以来，吠陀和佛教信仰的巨大宝藏散落在整个大陆，但现在被我们的神圣统治结合在一起，受到全印度人的敬仰。"
 bharat_missions_task_6:0 "婆罗多"
 bharat_missions_task_6_DESC:0 "我们伟大的统治者与其说是一个人，不如说是一个神。他们应该进入万神殿，一如那些过往的婆罗多王一般，这能巩固我们统治的合法性，神化我们的血脉。"
 bharat_missions_task_6_tooltip:0 "拥抱伟大的婆罗多王的古老血脉。"
 bharat_missions_task_7:0 "宗教和谐"
 bharat_missions_task_7_DESC:0 "印度次大陆在宗教上和民族上一样多样化。如果我们希望和平统治，就必须在印度的各种信仰体系之间实现内部宗教和谐。"
 bharat_missions_task_7_tooltip:0 "拥有大于#Y 80%#! 的宗教统一度。"
 bharat_missions_task_8:0 "帝国首都"
 bharat_missions_task_8_DESC:0 "全印度的首都将作为一个蓬勃发展的商业中心而闻名于世，它是一座拥有无与伦比建筑的城市，也许是世界上最大的城市。"
 bharat_missions_task_9:0 "印度的异国商品"
 bharat_missions_task_9_A_tooltip:0 "至少有一个省份拥有以下每种贸易商品，生产5种商品。"
 bharat_missions_task_9_B_tooltip:0 "任何省份至少生产5个#Y 琥珀#!@amber!。"
 bharat_missions_task_9_C_tooltip:0 "任何省份至少生产5个#Y 香料#!@spices!。"
 bharat_missions_task_9_DESC:0 "长期以来，印度生产的异国商品受到世界其他国家的珍视，而且只在我们的土地上生产。我们将利用这一垄断地位。"
 bharat_missions_task_9_D_tooltip:0 "任何省份至少生产5个#Y 大象#!@elephants!。"
 bharat_missions_task_9_E_tooltip:0 "任何省份至少生产5个#Y 贵金属#!@precious_metals!。"

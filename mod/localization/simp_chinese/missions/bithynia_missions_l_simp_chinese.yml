l_simp_chinese:
 BZZ:0 "拜占庭"
 BZZ_ADJ:0 "拜占庭"
 aegean_center_of_administration:0 "爱琴海的行政中心"
 assimilating_thracians:0 "同化色雷斯人"
 bit_assign_commander:0 "指派新的指挥官"
 bit_assign_commander_act:0 "必须选择一个新的人作为我们军团最重要的指挥官来领导比提尼亚。"
 bit_assign_commander_select_title:0 "选择新的比提尼亚指挥官"
 bithynia_missions:0 "齐波厄忒斯王国"
 bithynia_missions_BUTTON_TOOLTIP:0 "一条漫长而雄心勃勃的道路摆在我们面前，但我们热切地迈出了迈向永恒荣耀的第一步。"
 bithynia_missions_CRITERIA_DESCRIPTION:0 "当齐波厄忒斯王国实现其真正的潜力，将其领地扩展到更远更广的地方时，这项任务才算完成......"
 bithynia_missions_DESCRIPTION:0 "齐波厄忒斯统治的小王国，坐落在比提尼亚和帕弗拉格尼亚的北岸，并没有大到足以容纳我们强大王朝的野心。当混乱席卷更广阔的世界，国王和将军们每天都在崛起和倒下，齐波厄忒斯发誓他的名字将被永远记住。"
 bithynia_missions_task_1:0 "一处真正的首都"
 bithynia_missions_task_10:0 "扩大王国"
 bithynia_missions_task_10_DESC:0 "比提尼亚王国理应统治任何冠以相同名称的省份。比提尼亚应当成为所有比提尼亚人的家园，而不仅仅是那些生活在我们边境之外的蛮族的归属。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 bithynia_missions_task_11:0 "齐波厄忒斯王国"
 bithynia_missions_task_11_DESC:0 "没有人可以否认我们是一个强大的王国，但我们并不满足于我们所拥有的，因为还有很多东西可以拿。准备好我们的宣称，让骰子落在他们可能的地方。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 bithynia_missions_task_11_tt:0 "获得对[GetProvince('(int32)326').GetArea.GetName|Y]和[GetProvince('(int32)210').GetArea.GetName|Y]省份的宣称。"
 bithynia_missions_task_12:0 "比希尼亚的城市"
 bithynia_missions_task_12_B_tt:0 "至少#Y 5#!领土具有[GetProvinceRank('city').GetName|Y]地位。"
 bithynia_missions_task_12_DESC:0 "我们作为城市建设者的声誉是建立在我们丰富的经验之上的，这些经验是由多年的成功建设计划磨练出来的。由于我们在建筑方面的专业性，比希尼亚的城市是独一无二的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 bithynia_missions_task_12_tt:0 "获得一个独特的角色互动，将允许 [SCOPE.GetRootScope.GetCountry.GetName] 的当前统治者建立一个#T 比堤尼亚城市#!。\n"
 bithynia_missions_task_13:0 "传播比提尼亚传统"
 bithynia_missions_task_13_DESC:0 "卡尔珀在你的心中有着特殊的地位，你对这个城市的大量投资一直是一种爱的付出。然而，我们还可以为我们的宠物项目做更多的事情。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 bithynia_missions_task_14:0 "扩大海军"
 bithynia_missions_task_14_DESC:0 "虽然我们周围有很多伟大的航海国，我们必须与之抗衡，但我们愿意接受挑战。下令砍伐树木，并立即开始在我们的船厂进行施工。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 bithynia_missions_task_15:0 "向东走"
 bithynia_missions_task_15_DESC:0 "虽然我们不一定贪婪，但我们也不一定满足于我们所拥有的。现在，玛利安底尼亚无可争议地在我们的控制之下，我们有新的选择向东扩张--我们应该这样做。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 bithynia_missions_task_15_tt:0 "获得对[GetProvince('(int32)211').GetArea.GetName|Y]和[GetProvince('(int32)1829').GetArea.GetName|Y]省份的宣称。"
 bithynia_missions_task_16:0 "比提尼亚的主人"
 bithynia_missions_task_16_DESC:0 "如果我们巩固了对整个比提尼亚和帕弗拉格尼亚的控制，我们当之无愧的领袖将受到人民的尊敬。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 bithynia_missions_task_17:0 "一个比堤尼亚军团"
 bithynia_missions_task_17_DESC:0 "我们的军团带领我们取得了无数的胜利，但是通过扩大我们的军团，我们将拥有一支专业的战斗力量，这将增强我们已经令人印象深刻的军事力量。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 bithynia_missions_task_17_tooltip:0 "拥有一个至少有#Y 10#!单位的军团"
 bithynia_missions_task_17_tt:0 "#Y 比提尼亚#!的首都军团将获得军事加成。"
 bithynia_missions_task_18:0 "比提尼亚的港口"
 bithynia_missions_task_18_DESC:0 "通过增加我们控制的港口数量，我们的财政安全将得到充分保证。我们将成为邻国羡慕的对象，尤其是当他们看着自己的钱财进入我们的国库时。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 bithynia_missions_task_18_tt:0 "在#Y $bithynia_region$#!地区至少有#Y 15#!领土有一个[GetBuilding('port_building').GetName|Y]（当前。#Y [SCOPE.ScriptValue('bithynia_missions_task_18_ports_current')|0]#!"
 bithynia_missions_task_19:0 "新市场"
 bithynia_missions_task_19_DESC:0 "我们的市场目前无法跟上我们所经历的贸易需求。为这些贸易商和商人提供市场是我们的最佳利益，以确保他们继续在我们的城市销售他们的商品。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 bithynia_missions_task_19_tt:0 "在#Y $bithynia_region$#!地区至少有#Y 15#!领土有一个[GetBuilding('commerce_building').GetName|Y]（当前。#Y [SCOPE.ScriptValue('bithynia_missions_task_19_markets_current')|0]#!）"
 bithynia_missions_task_1_DESC:0 "我们的玛利安底尼亚省是我们王国的一个重要部分，然而它的省会是一个尴尬的地方‑几乎没有一个值得一提的定居点。我们的人民应该得到一个合适的城市，一个合适的首都。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 bithynia_missions_task_2:0 "齐波厄忒斯之城"
 bithynia_missions_task_20:0 "色雷斯人的土地"
 bithynia_missions_task_20_DESC:0 "在确保了我们在亚洲的地位之后，我们已经大胆地在欧洲海岸建立了我们的立足点。时间很快就会到来，色雷斯的居民将承认他们在大洋彼岸的新主人；比特尼人。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 bithynia_missions_task_20_tt:0 "获得对[GetProvince('(int32)1453').GetArea.GetRegion.GetName|Y]区域内所有领土的宣称。"
 bithynia_missions_task_21:0 "进入亚细亚"
 bithynia_missions_task_21_DESC:0 "到目前为止，我们的扩张主要集中在我们周围丰富的沿海城市，这在很大程度上要归功于我们惊人的海军力量。但我们没有充分的理由把自己限制在水路上；亚洲的土地值得我们去征服。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 bithynia_missions_task_21_tt:0 "获得对[GetProvince('(int32)266').GetArea.GetRegion.GetName|Y]地区的所有领土的宣称。"
 bithynia_missions_task_22:0 "重夺家园"
 bithynia_missions_task_22_DESC:0 "在被遗忘的日子里，是一群色雷斯殖民者第一次来到比希尼亚，寻求摆脱暴政的自由--现在让我们把自由带到我们古老的家园。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 bithynia_missions_task_23:0 "色雷斯人的保护者"
 bithynia_missions_task_23_B_tt:0 "属于[GetCultureGroup('thrace_group').GetName|Y]文化组的所有民众，在#Y $thrace_region$#!、#Y $bithynia_region$#!和#Y $moesia_region$#!地区的省份中，都属于[SCOPE.GetRootScope.GetCountry.GetName]（当前。#Y [SCOPE.ScriptValue('bithynia_missions_task_23_thracian_provinces_current')|0]#! Total:#Y [SCOPE.ScriptValue('bithynia_missions_task_23_thracian_provinces_total')|0]#!）"
 bithynia_missions_task_23_DESC:0 "经过我们的对外征服战争，似乎我们是整个色雷斯民族的领主。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 bithynia_missions_task_23_tt:0 "决定所有[GetCultureGroup('thrace_group').GetName|Y]人的命运"
 bithynia_missions_task_24:0 "弗里吉亚力量"
 bithynia_missions_task_24_DESC:0 "Phyrgia省将是你的领地的一个有吸引力的补充；此外，最近有很多人在争夺这片土地，以至于没有人能够真正声称它是他们自己的，因为这里没有真正合法的统治者--那么，为什么比提尼亚人不应该拥有它？\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 bithynia_missions_task_24_tt:0 "获得对#Y $galatia_region$#!地区的所有领土的宣称！"
 bithynia_missions_task_25:0 "征服卡帕多西亚"
 bithynia_missions_task_25_DESC:0 "有很多东西我们可以容忍，但我们不能容忍卡帕多西亚的威胁存在，另一个时刻，另一个日子。如果我们把我们的边界向那个方向再延伸一点，对各方都有好处。\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 bithynia_missions_task_25_tt:0 "获得对#Y $cappadocia_region$#!地区的所有领土的宣称！"
 bithynia_missions_task_26:0 "穿越海洋"
 bithynia_missions_task_26_DESC:0 "我们的海军资金充足且精通海战，但仍有成长空间；只要继续明智投入资金并打造庞大舰队，我们就能真正主宰海域。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 bithynia_missions_task_26_tt:0 "拥有比其他国家更多的船只。\n（当前最高的船只：#Y [SCOPE.ScriptValue('bithynia_country_with_the_most_ships')|0]#!）"
 bithynia_missions_task_27:0 "陶里卡的动荡"
 bithynia_missions_task_27_DESC:0 "由于整个黑海都被纳入我们的影响范围内，国外的干扰往往会在国内造成破坏性的影响——正如他们所说，有时最好将这些潜在的问题扼杀在萌芽状态。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 bithynia_missions_task_27_tt:0 "获得对#Y $taurica_region$#!地区的所有领土的宣称！"
 bithynia_missions_task_28:0 "控制海岸"
 bithynia_missions_task_28_DESC:0 "成为亚洲海岸难以想象的潜力的主人，这本身就是一种奖励。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 bithynia_missions_task_29:0 "一个爱琴海的力量"
 bithynia_missions_task_29_DESC:0 "整个爱琴海的稳定交通，最好由一个专门的官僚机构来管理，这个机构在管理日常事务的同时，直接向我们汇报。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 bithynia_missions_task_29_tt:0 "从三个省份中挑选一个，获得以下内容："
 bithynia_missions_task_2_DESC:0 "阿耳塔涅斯，政府所在地，一直在以一种看似指数的速度增长；这证明了齐波厄忒斯的动态领导。因为我们对我们的国王功不可没，我们正在考虑以他的名义重新命名这个城市。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 bithynia_missions_task_3:0 "最后的阿契美尼德王朝"
 bithynia_missions_task_30:0 "伯罗奔尼撒半岛的主人"
 bithynia_missions_task_30_DESC:0 "在我们为伯罗奔尼撒半岛的居民所做的一切之后，有人能否认我们是它真正的主人吗？\n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 bithynia_missions_task_31:0 "希腊的保护者"
 bithynia_missions_task_31_DESC:0 "希腊政治局势的现实要求我们保护弱者，使其免受周边势力的阴谋摆布。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 bithynia_missions_task_32:0 "主宰弗里吉亚"
 bithynia_missions_task_32_DESC:0 "拥有弗里吉亚省广泛的公路网络已经成为一个可怕的利益问题；我们想从这些公路上的贸易中分一杯羹。\n\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 bithynia_missions_task_33:0 "南部海岸"
 bithynia_missions_task_33_DESC:0 "安纳托利亚南部海岸的断裂状态为我们提供了征服和扩张的机会。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 bithynia_missions_task_34:0 "摧毁米特里达梯王朝"
 bithynia_missions_task_34_DESC:0 "一想到可恨的米特里达梯王朝处于权力地位......不，我们不允许这样。\n\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 bithynia_missions_task_34_tt:0 "没有一个国家的统治者是带有#Y 米特里达梯的血脉#!特征的。"
 bithynia_missions_task_35:0 "卡帕多西亚的国王"
 bithynia_missions_task_35_DESC:0 "继续前进，哦，比提尼亚，到Cappadocians的土地上，到亚美尼亚的门口--让所有的人都在我们面前逃亡。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 bithynia_missions_task_36:0 "色雷斯的陶里卡"
 bithynia_missions_task_36_DESC:0 "我们可以从陶里卡的不同民族那里学到很多东西，我们可以在我们的王国里应用这些经验。\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 bithynia_missions_task_37:0 "亚细亚的国王"
 bithynia_missions_task_37_DESC:0 "亚细亚是我们的；比提尼亚人现在是它的国王和领主。我们为这片充满争议的土地带来了统一，它已经成为我们安全的堡垒；我们现在与世界上最伟大的文明进行竞争。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 bithynia_missions_task_38:0 "希腊的国王"
 bithynia_missions_task_38_DESC:0 "我们终于成为希腊诸王，我们的名号将被永远传颂。永恒荣耀已归于我们。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 bithynia_missions_task_39:0 "叙利亚的野心"
 bithynia_missions_task_39_DESC:0 "我们将向南推进，进入叙利亚的土地，因为没有人可以阻止我们做任何想做的事情。强者为王，我们是最强大的!\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 bithynia_missions_task_39_tt:0 "获得对#Y $assyria_region$#!和#Y $syria_region$#!地区的所有领土的宣称。"
 bithynia_missions_task_3_DESC:0 "虽然阿契美尼德的政治力量已经被粉碎，但阿契美尼德的血液仍在流动。通过加入豪门，只会增强我们自己的地位--让我们为我们的继承人寻找一个合适的婚姻。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 bithynia_missions_task_3_tt:0 "安排与来自[GetCountry('HCP').GetName|Y].\n\n的阿契美尼德人物结婚"
 bithynia_missions_task_4:0 "比提尼亚的国王"
 bithynia_missions_task_40:0 "征服叙利亚"
 bithynia_missions_task_40_DESC:0 "我们的财产远远超出了黑海海岸的原始边界，包括遥远的叙利亚和亚述的土地。\n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 bithynia_missions_task_41:0 "黎凡特人的愿望"
 bithynia_missions_task_41_DESC:0 "我们现在控制了黎凡特的一个重要的战略区域，这让你的将军们放松了警惕--我们人民的安全在我们的掌握之中。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 bithynia_missions_task_42:0 "法老之国"
 bithynia_missions_task_42_DESC:0 "法老的土地属于那些能够宣称她的人，正如阿契美尼德王朝和托勒密王朝的罪行所表明的。从我们现在的有利位置，我们几乎可以看到金字塔，而且很快，它们将是我们的。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 bithynia_missions_task_42_tt:0 "获得对#Y 下埃及#!地区的所有领土的宣称！"
 bithynia_missions_task_43:0 "一个新的王朝"
 bithynia_missions_task_43_DESC:0 "虽然有些人可能会说我们疯了，充满了不符合比提尼亚 Basileus的宏伟幻想，但我们有权要求一个新的称号，一个能正确描述我们已经成为的称号。\n\n\n\n\n\n\n\n\n\n\n@egypt_por1!"
 bithynia_missions_task_43_tt:0 "决定[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]是否应该为自己加冕为下一任#T  法老#!"
 bithynia_missions_task_44:0 "美索不达米亚事务"
 bithynia_missions_task_44_DESC:0 "神秘的巴比伦城在向我们招手；让我们为自己驾驭这个古老的力量和智慧的源泉。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 bithynia_missions_task_45:0 "拿起菩多"
 bithynia_missions_task_45_DESC:0 "我们第一次穿越Fretum Hydruntis的水域，肯定不会是最后一次。\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 bithynia_missions_task_46:0 "为南方而战"
 bithynia_missions_task_46_DESC:0 "作为希腊的国王，我们认为大希腊的土地也在我们的管辖范围内，并将驱逐任何侵入我们财产的人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 bithynia_missions_task_47:0 "罗马的陷落"
 bithynia_missions_task_47_DESC:0 "征服可怕的罗马人，他们对战争的热爱，会给我们的市场带来宁静和稳定；我们根本不能再让这些野蛮人扰乱我们的贸易。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 bithynia_missions_task_48:0 "主宰意大利"
 bithynia_missions_task_48_DESC:0 "我们以某种方式成功地扩展到了远远超出我们原来边界的领土，在我们以前从不知道存在的山脉的山脚下停下来。\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 bithynia_missions_task_49:0 "伊利里亚突袭"
 bithynia_missions_task_49_DESC:0 "我们已经厌倦了那些讨厌的伊利里亚部落，他们以海默斯山脉为盾牌，相对肆无忌惮地袭击我们的土地，然后像懦夫一样跑回峭壁山中。我们应该让这些野蛮人屈服。\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 bithynia_missions_task_4_DESC:0 "普罗蓬提斯海沿岸的那些富庶城市，都被卑劣的僭主与海盗所掌控；这些不配占据我们土地的蝼蚁理应被驱逐。让我们正式宣告我们的主权，准备好驱逐这些觊觎者。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 bithynia_missions_task_4_tt:0 "获得对#Y $bithynia_inferior_area$#!的宣称。"
 bithynia_missions_task_5:0 "发展食品店"
 bithynia_missions_task_50:0 "伊利里亚的国王"
 bithynia_missions_task_50_DESC:0 "谨慎起见，我们应该拥有整个伊利里亚，因为只要他们承认我们是他们的国王，我们就能为这些人做很多事情。我们比其他任何人都好。\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 bithynia_missions_task_51:0 "比堤尼亚的统治地位"
 bithynia_missions_task_51_DESC:0 "我们已经接受了我们作为保护者和主人的角色，我们的人民为我们神圣的领导和我们劳动的所有成果感到高兴。\n\n\n\n\n\n\n\n\n\n\n@egypt_por2!"
 bithynia_missions_task_52:0 "比堤尼亚的影响"
 bithynia_missions_task_52_DESC:0 "这么多人希望像比提尼亚人一样，这有什么奇怪的？你怎么能在参观我们的城市时不渴望像我们一样伟大？我们欢迎所有希望采用我们方式的人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 bithynia_missions_task_53:0 "一个繁荣的首都"
 bithynia_missions_task_53_DESC:0 "齐波厄忒斯正在成为该地区最大的城市之一，如果你还能称它为城市的话。不久之后，齐波厄忒斯市将很快被称为齐波厄忒斯的大都市。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 bithynia_missions_task_54:0 "在亚洲的投资"
 bithynia_missions_task_54_A_tt:0 "#Y $mysia_area$#!和#Y $mysia_abrettene_area$#!省份中所有是[GetProvinceRank('city').GetName|Y]地位的领土都拥有[GetBuilding('commerce_building').GetName|Y]。"
 bithynia_missions_task_54_B_tt:0 "在#Y $aeolia_area$#!, #Y $troas_area$#!, 和#Y $ionia_area$#! 的省份中，至少有#Y 10#!块领土具有[GetProvinceRank('city').GetName|Y]状态，有#Y 5#!或以上的建筑。"
 bithynia_missions_task_54_DESC:0 "当考虑到亚洲土地的巨大潜力时，以前的统治者没有充分开发该地区，这是一个悲剧。把比提尼亚集市带到这些饥饿的省份，看着收入的增长。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 bithynia_missions_task_55:0 "沿海风险投资"
 bithynia_missions_task_55_DESC:0 "我们广泛的港口城市网络，是我们社会的经济和文化支柱，需要我们拥有最强大的海军；没有人能够在海上挑战我们。\n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 bithynia_missions_task_56:0 "增加粮食生产"
 bithynia_missions_task_56_DESC:0 "我们的土地是好的，也是令人向往的，但我们城市里的居民数量太多，养活他们是一项繁重的任务。如果我们增加国内的粮食生产，那么我们就不必从国外进口那么多粮食。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 bithynia_missions_task_56_food_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_56_food_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_56_food_total')|0]#!)"
 bithynia_missions_task_56_food_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_56_food_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_56_food_total')|0]#!)"
 bithynia_missions_task_56_tooltip:0 "至少生产#Y [SCOPE.ScriptValue('bithynia_missions_task_56_food_total')|0]#!在#Y $bithynia_region$#!和#Y $cappadocia_pontica_region$#!地区的粮食。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_56_food_loc')]"
 bithynia_missions_task_57:0 "比堤尼亚人口"
 bithynia_missions_task_57_DESC:0 "我们的人数越多，想和我们一样的人就越多。为什么我们如此幸运？\n\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 bithynia_missions_task_57_pops_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_57_pops_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_57_pops_total')|0]#!)"
 bithynia_missions_task_57_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_57_pops_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_57_pops_total')|0]#!)"
 bithynia_missions_task_57_tt:0 "至少有#Y 80%#!的#Y [SCOPE.ScriptValue('bithynia_missions_task_57_pops_absolute_total')|0]#!在#Y $bithynia_region$#!和#Y $thrace_region$#! 所拥有的#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_57_pops_loc')]"
 bithynia_missions_task_58:0 "卡帕多西亚建设"
 bithynia_missions_task_58_B_tt:0 "#Y $cappadocia_region$#!和#Y $cappadocia_pontica_region$#!的地区至少有#Y 1#!省份，并具有[GetProvinceRank('city_metropolis').GetName|Y]状态。"
 bithynia_missions_task_58_DESC:0 "卡帕多西亚的土地像野草一样生长，每天都有阵雨浇灌；伟大的都市在它的山脉和丘陵中出现。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 bithynia_missions_task_58_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_58_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_58_buildings_total')|0]#!)"
 bithynia_missions_task_58_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_58_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_58_buildings_total')|0]#!)"
 bithynia_missions_task_58_construction_loc_1:0 "\n @trigger_no!#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y $cappadocia_region$#!和#Y $cappadocia_pontica_region$#!的地区有正在进行的建设。"
 bithynia_missions_task_58_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('bithynia_missions_task_58_buildings_total')|0]#!在#Y $macedonia_region$#!地区的自有领土上的建筑物。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_58_buildings_loc')]。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_58_construction_loc')]"
 bithynia_missions_task_59:0 "拜占庭之城"
 bithynia_missions_task_59_DESC:0 "拜占庭，由梅加拉的拜占庭建造的古城，就在我们的西面，曾经是我们激烈的竞争者，但我们已经用自己的荣耀让他们黯然失色。尽管如此，这个城市仍有不可否认的潜力，我们预测博斯普鲁斯海峡的这个城市会有很大的发展。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 bithynia_missions_task_59_tt:0 "释放#Y [GetProvince('(int32)1453').GetName|Y]#!作为#Y 藩属#!，或者可能更多......"
 bithynia_missions_task_5_DESC:0 "我们城市的爆炸性增长导致我们需要扩大基础设施；我们只是需要更多的食物。让我们发展我们的牧场，这样我们就可以避免在我们的街道上出现饥饿的暴徒。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 bithynia_missions_task_6:0 "巩固比提尼亚"
 bithynia_missions_task_60:0 "发展色雷斯"
 bithynia_missions_task_60_DESC:0 "我们应该对我们在色雷斯的财产投入一些关注；毕竟这是我们对祖先的神圣职责。让我们尽可能地增加贸易产品的生产。\n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 bithynia_missions_task_60_goods_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_60_goods_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_60_goods_total')|0]#!)"
 bithynia_missions_task_60_goods_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_60_goods_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_60_goods_total')|0]#!)"
 bithynia_missions_task_60_tooltip:0 "至少有#Y [SCOPE.ScriptValue('bithynia_missions_task_60_goods_total')|0]#!货物是在#Y 色雷斯#!地区的所属省份生产的。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_60_goods_loc')]"
 bithynia_missions_task_61:0 "爱琴海市场"
 bithynia_missions_task_61_A_tt:0 "所有在#Y $sporades_area$#!, #Y $crete_area$#!, 和#Y $aegean_islands_area$#! 省内具有[GetProvinceRank('city').GetName|Y]地位的领土都有一个[GetBuilding('commerce_building').GetName|Y]。"
 bithynia_missions_task_61_B_tt:0 "在#Y $sporades_area$#!, #Y $crete_area$#!, 和#Y $aegean_islands_area$#!的省份中，至少有#Y 10#!块领土具有[GetProvinceRank('city').GetName|Y]状态，有#Y 5#!或以上的建筑。"
 bithynia_missions_task_61_DESC:0 "我们的爱琴海岛屿是进一步发展经济的最佳选择；我们应该停止谈论这个问题，并将其变为现实。\n\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!"
 bithynia_missions_task_62:0 "希腊合作"
 bithynia_missions_task_62_DESC:0 "葡萄酒和橄榄是比提尼亚饮食的基石，在希腊各地发现的许多品种被证明是非常受我们人民欢迎的。说实话，我们对这两样东西永远都不够用。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 bithynia_missions_task_63:0 "比提尼亚的城市"
 bithynia_missions_task_63_B_tt:0 "所有拥有[GetProvinceRank('bithynian_city').GetName|T]地位的领土上最多#Y 10#!个人口将同化为[GetCulture('bithynian').GetName|Y]。"
 bithynia_missions_task_63_C_tt:0 "#T 比提尼亚城市#!建立将不再有冷却时间，但建立成本将更高。"
 bithynia_missions_task_63_DESC:0 "在这一点上，我们已经把建立比提尼亚城市从一门科学提炼成了一门艺术，我们是技艺精湛的人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 bithynia_missions_task_63_tt:0 "拥有#Y 10#!块满足以下条件的领土：\n*人口大于#Y 40#!\n*拥有至少#Y 8#!座建筑\n*没有正在进行的建设\n*拥有[GetProvinceRank('bithynian_city').GetName|T]地位"
 bithynia_missions_task_64:0 "比堤尼亚的伟大"
 bithynia_missions_task_64_DESC:0 "我们的港口城市和其他各种财产在整个比提尼亚和Paghlagonia的有利位置，集中在一起，是繁荣的经济引擎，使我们的国家超越所有其他国家。进一步发展这些财产将使我们成为世界上最富有的土地。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 bithynia_missions_task_64_tt:0 "#Y 比堤尼亚与帕弗拉格尼亚#!地区的省份比世界上任何其他地区的省份收入都要多。\n（比提尼亚：#Y [SCOPE.ScriptValue('bithynia_missions_task_64_bithynia_region_income_svalue')|0]#!）"
 bithynia_missions_task_65:0 "马其顿的钱"
 bithynia_missions_task_65_B_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('bithynia_missions_task_65_buildings_total')|0]#!在#Y $macedonia_region$#!地区的自有领土上的建筑物。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_65_buildings_loc')]。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_65_construction_loc')]"
 bithynia_missions_task_65_DESC:0 "马其顿是一个建设和维护城市的好地方；我们已经有很好的财产可以支配，但我们还有发展的空间。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 bithynia_missions_task_65_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_65_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_65_buildings_total')|0]#!)"
 bithynia_missions_task_65_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_65_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_65_buildings_total')|0]#!)"
 bithynia_missions_task_65_construction_loc_1:0 "\n @trigger_no!#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 马其顿#!区域有正在进行的建设。"
 bithynia_missions_task_65_tt:0 "#Y $macedonia_region$#! 的地区至少有#Y 2#! 个省份具有[GetProvinceRank('city_metropolis').GetName|Y]状态。"
 bithynia_missions_task_66:0 "比提尼亚的指挥官"
 bithynia_missions_task_66_DESC:0 "只有最优秀的军事家才能指挥我们的士兵。让我们找到一个合适的领袖来激励我们的人取得更多更大的胜利。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 bithynia_missions_task_66_tt:0 "有一个军团，它的指挥官有超过#Y 10#!的武功。"
 bithynia_missions_task_67:0 "确保控制"
 bithynia_missions_task_67_DESC:0 "我们已经征服了我们周围的土地，这是一个巨大的任务，值得赫拉克勒斯自己去做，但安全是一个永远无法实现的东西。让我们通过建立防御工事来确保我们对自己家园的控制，以保护我们不受众多权力对手的侵害。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 bithynia_missions_task_67_forts_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_67_forts_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_67_forts_total')|0]#!)"
 bithynia_missions_task_67_forts_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_67_forts_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_67_forts_total')|0]#!)"
 bithynia_missions_task_67_tooltip:0 "至少有#Y [SCOPE.ScriptValue('bithynia_missions_task_67_forts_total')|0]#!在#Y $bithynia_inferior_area$#!和#Y $heracleotis_area$#!的省份建造堡垒。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_67_forts_loc')] "
 bithynia_missions_task_68:0 "一个新头衔"
 bithynia_missions_task_68_B_tt:0 "获得一个角色互动的机会，可以获得#T 比提尼亚指挥官#!的荣誉称号。只有[SCOPE.GetRootScope.GetCountry.GetName]中的#Y 1#!角色可以同时拥有这个称号。"
 bithynia_missions_task_68_DESC:0 "我们杰出的军团如果有一个专职的指挥官就会得到更好的服务，一个我们可以信赖的指挥官可以带领我们的军队走向辉煌。我们将立即设立这一级别。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 bithynia_missions_task_68_tt:0 "在首都地区拥有一个军团，该军团至少有#Y 20#!单位和#Y 5#!称号。"
 bithynia_missions_task_69:0 "胜利的军团"
 bithynia_missions_task_69_DESC:0 "比提尼亚的指挥官不应该是理论家，躲在军事文献后面，以箴言为指导，而是应该对战场有第一手的了解。\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 bithynia_missions_task_69_tooltip:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]的军团在被授予#T 比提尼亚指挥官#!荣誉称号的指挥官带领下，至少赢得#Y 25#!的战斗。（当前：#Y [SCOPE.ScriptValue('bithynia_legion_battles_won_svalue')|0]#!）"
 bithynia_missions_task_6_A_tt:0 "对[GetProvince('(int32)240').GetOwner.GetName|Y]#R 宣战#!。由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与[GetProvince('(int32)240').GetOwner.GetOverlord.GetRuler.GetName]#E 的#!关系，[GetProvince('(int32)240').GetOwner.GetOverlord.GetName]不会援助。"
 bithynia_missions_task_6_B_tt:0 "对[GetProvince('(int32)243').GetOwner.GetName|Y]#R 宣战#!。由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与[GetProvince('(int32)243').GetOwner.GetOverlord.GetRuler.GetName]#E 的#!关系，[GetProvince('(int32)243').GetOwner.GetOverlord.GetName]不会援助。"
 bithynia_missions_task_6_DESC:0 "卡尔西顿和阿斯塔科斯，躲在强大的安提柯家族的担保下，最近一直在肆无忌惮地行事。唉，他们的土地将是多么美妙的财产，但我们不敢冒险与安提柯家族王国开战。是否有其他方法可以防止敌对行动？\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 bithynia_missions_task_6_tt:0 "对[GetProvince('(int32)240').GetOwner.GetName|Y]和[GetProvince('(int32)243').GetOwner.GetName|Y]#R 宣战#!。由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]与[GetProvince('(int32)240').GetOwner.GetOverlord.GetRuler.GetName]#E 的#!关系，[GetProvince('(int32)240').GetOwner.GetOverlord.GetName]不会援助。"
 bithynia_missions_task_6_tt_1:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]是[GetProvince('(int32)243').GetOwner.GetOverlord.GetRuler.GetName|Y]的朋友。"
 bithynia_missions_task_6_tt_2:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]是[GetProvince('(int32)240').GetOwner.GetOverlord.GetRuler.GetName|Y]的朋友。"
 bithynia_missions_task_7:0 "马里安底尼亚之友"
 bithynia_missions_task_70:0 "希腊的亚洲"
 bithynia_missions_task_70_DESC:0 "宗教和谐是我们的人民所期望的；我们没有耐心让地方上的小争斗演变成什么严重的事情。我们应该鼓励人们遵循适当的宗教仪式，并希望我们的榜样被效仿。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 bithynia_missions_task_70_pops_loc_1:0 "(#R [SCOPE.ScriptValue('bithynia_missions_task_70_pops_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_70_pops_total')|0]#!)"
 bithynia_missions_task_70_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('bithynia_missions_task_70_pops_current')|0]#!/#Y [SCOPE.ScriptValue('bithynia_missions_task_70_pops_total')|0]#!)"
 bithynia_missions_task_70_tt:0 "在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!拥有的#Y 小亚细亚#!地区中，高亮的省份里的#Y [SCOPE.ScriptValue('bithynia_missions_task_70_pops_absolute_total')|0]#!人口中至少有#Y 75%#!的人口是#Y [SCOPE.GetRootScope.GetCountry.GetReligion.GetName]#! 。[SCOPE.GetRootScope.GetCountry.Custom('bithynia_missions_task_70_pops_loc')]"
 bithynia_missions_task_7_B_tt:0 "拥有比[GetCountry('MIT').GetName|Y]更多的领土。"
 bithynia_missions_task_7_DESC:0 "虽然我们已经是玛利安底尼亚海岸的主人，但丘陵和山脉暂时仍不在我们的控制之下。如果我们与邻邦结盟，并提升他们对我们的好感，他们便有机会向我们臣服。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 bithynia_missions_task_7_tt:0 "提供[GetCountry('MYD').GetName]，成为我们的#Y 藩属#!"
 bithynia_missions_task_8:0 "与马里安底尼亚的战争"
 bithynia_missions_task_8_DESC:0 "既然我们已经控制了该省如此多土地，就没有理由继续容忍一个独立的玛利安底尼亚。扩展我们的统治，终结他们的僭称。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 bithynia_missions_task_9:0 "越过玛利安底尼亚"
 bithynia_missions_task_9_B_tt:0 "拥有或附属国拥有至少#Y 5#!以[GetCulture('mariandynian').GetName|Y]为主导文化的领土。"
 bithynia_missions_task_9_DESC:0 "虽然我们与马里安迪尼亚人有一些古老的文化联系，但我们是两个独立的民族，被迫生活在同一个房子里。通过将他们融入或同化到我们的社会，可以平息任何潜在的摩擦。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 bithynia_missions_task_9_tt:0 "选择融入或同化[GetCulture('mariandynian').GetName|Y]文化"
 bithynian_administration:0 "比提尼亚管理"
 bithynian_boot:0 "比堤尼亚之靴"
 bithynian_builders:0 "比提尼亚建设者"
 bithynian_cities:0 "比提尼亚城市"
 bithynian_cities_act:0 "在一个有价值的定居点建立一个比提尼亚城市。\n#!比提尼亚城市有一个独特的省份等级，只能通过这个互动获得。这个互动只能每#Y 25#!年进行一次，除非使命任务'$bithynia_missions_task_63$'已经完成。"
 bithynian_cities_select_title:0 "选择一个省，成为一个比提尼亚城市"
 bithynian_city:0 "比提尼亚城"
 bithynian_city.1.a:0 "令人惊叹的消息"
 bithynian_city.1.desc:0 "我们从我们的首席建设者那里得到消息，一个新的比提尼亚城已经完成。城市的边界已经划定，一丝不苟地设计了扩大的基础设施，使我们的城市有别于所有其他城市。建设所需的各种熟练的雇工--石匠、马赛克工、日工、木匠、铁匠、车工，以及其他无数的工作，不胜枚举--已经从比提尼亚国库领取了他们慷慨的工资，并且已经回家，希望他们在未来得到类似的工作。"
 bithynian_city.1.t:0 "一个新的比提尼亚城市"
 bithynian_city_desc:0 "比提尼亚城市是比提尼亚独有的[province_rank|E]；此乃比提尼亚诸王所建之大城。一座[GetProvinceRank('bithynian_city').GetName|E]优于[GetProvinceRank('city').GetName|E]，但不及[GetProvinceRank('city_metropolis').GetName|E]之恢宏。\\n\\n可于此建造城市[buildings|E]，但比提尼亚城市不可产出食物[tradegoods|E]，且每一行省仅可建立一座比提尼亚城市。"
 bithynian_city_mod:0 "比提尼亚城"
 bithynian_dominance:0 "比西尼亚的统治地位"
 bithynian_food_stores:0 "比提尼亚食品商店"
 bithynian_homeland:0 "比提尼亚人的家园"
 bithynian_influx:0 "比提尼亚人的涌入"
 bithynian_markets:0 "比提尼亚市场"
 bithynian_protection:0 "比提尼亚保护"
 byzantium_adj:0 "拜占庭"
 byzantium_name:0 "拜占庭"
 cappadocian_kings:0 "卡帕多西亚国王"
 commander_of_bithynia:0 "比西尼亚的指挥官"
 competent_commanders:0 "有能力的指挥官"
 conquer_the_conquerors:0 "征服者"
 dominating_the_seas:0 "主宰海洋"
 establish_bithynian_city_price:0 "确定比提尼亚城的价格"
 expanding_navy:0 "扩大海军"
 forts_of_bithynia:0 "比堤尼亚的要塞"
 founding_bithynian_city_in_progress:0 "建立比提尼亚城市"
 hellenic_asia:0 "希腊的亚洲"
 increased_production:0 "增加生产"
 increased_taxes:0 "增加税收"
 kings_of_asia:0 "亚细亚的国王"
 kings_of_bithynia:0 "比提尼亚的国王"
 kings_of_illyria:0 "伊利里亚的国王"
 legion_of_bithynia:0 "比提尼亚的军团"
 masters_of_mariandynia:0 "玛利安底尼亚的主人"
 me_bithynia_1.a:0 "让我们庆祝吧！"
 me_bithynia_10.a:0 "向众神献祭，感谢他们的祝福"
 me_bithynia_10_desc:0 "好运仍在眷顾我们。人们普遍认为，向比提尼亚本土扩张将为我们带来经济利益，但没有人能预料到我们如今所获得的巨大收益。该地区的贸易正在蓬勃发展，来自欧亚各地的人们都希望移民至普罗蓬提斯海沿岸的城市，渴望从中分得一杯羹。从今天起，我们迈入了一个崭新的奢华时代。"
 me_bithynia_10_title:0 "比堤尼亚的统治地位"
 me_bithynia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_bithynia_11.a:0 "好吧，你有了。"
 me_bithynia_11_desc:0 "当你坐在办公桌前时，你发出了一声深深的叹息；有一叠信件在等着你，要花一上午的时间来处理。当然，有些比其他的更重要，但你对大事小事都给予同样的关注；这是你个人风格的一个标志。然而，勤奋并不能使工作过得更快。给自己倒上一杯酒，你认命于工作负担，开始写你的信件。\n\n几个小时后，一位顾问来找你，他站在你面前时轻轻地清了清嗓子。'请原谅我的打扰，但我想告诉你，我们有必要的要求来推进你的设计，我的国王。"
 me_bithynia_11_title:0 "边界将增长"
 me_bithynia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_bithynia_12.a:0 "我们将继续按照比特尼亚的风格建造城市"
 me_bithynia_12_desc:0 "有一句谚语开始在居住在黑海周边城镇和港口的各个民族中流行起来，这是你们给这个地区带来的切实变化的反映--'生活在水边很好，生活在一个仁慈的国王的统治下更好，但生活在比提尼亚人建造的城市里是这个世界上所能期望的最好的。诚然，我们已经把建立城市的艺术变成了一门科学，我们所学到的经验使我们能够创造出前所未有的东西。"
 me_bithynia_12_title:0 "比提尼亚城市"
 me_bithynia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_bithynia_13.a:0 "想一想，我们要对这样的壮丽负责......"
 me_bithynia_13_desc:0 "一个商人的城市，有优雅的、镶嵌着马赛克的商场，出售太阳下想象中的一切；一个城市，每天有一万次的梦想和财富的产生和失去。这是一座贵族之城，有广阔的大理石浮雕庄园，慵懒地延伸到黑海宜人的海岸边；城市的空气中充满了成熟的苹果和富人的娱乐花园中的芳香葡萄的味道。绘画的雕像站在主干道宽阔的林荫道旁的柱子上，欢迎无数的游客蜂拥在雄伟的城墙外，来到这个充满奇迹的地方。\n\n旅行者，你已经到达了卡尔珀的大门，这是一座比提尼亚的城市。"
 me_bithynia_13_title:0 "卡尔珀，一个比提尼亚的城市"
 me_bithynia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_bithynia_14.a:0 "这仅仅是个开始"
 me_bithynia_14_desc:0 "虽然你的不耐烦会让你失望，但你相信你的建筑师们不会为了时间而牺牲质量，虽然在你收到海军已经集结的消息之前，你感觉已经过了很久，但你对他们的手艺感到满意。这支舰队不仅能确保我们在国内的稳定，还能让我们有机会与国外的朋友......和敌人接触。"
 me_bithynia_14_title:0 "一支值得信赖的海军"
 me_bithynia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_bithynia_15.a:0 "玛利安底尼亚的丘陵和山脉是一扇开放的大门……"
 me_bithynia_15_desc:0 "我们已经完成了不可能的任务；以前无法想象的事情现在已经成为现实。我们是玛利安底尼亚的主人；比提尼亚对我们邻居的森林和山丘投以羡慕的目光，准备征服帕弗拉格尼亚的土地。在我们自己的财产中获得安全感，我们将从我们的山脉中溢出，进入我们的敌人的土地，把比西尼亚的文明带给所有反对我们的人。"
 me_bithynia_15_title:0 "通往东方之门"
 me_bithynia_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_bithynia_16.a:0 "'请给我拿杯水'。"
 me_bithynia_16_desc:0 "我们城市的大理石街道上挂满了成千上万的花瓣，这是昨晚举行的大规模游行的最后残余--还有让你一上午都躺在床上的头痛欲裂--庆祝我们在比希尼亚和帕弗拉格尼亚的胜利。我们一次又一次地让我们的敌人屈服，而你正迅速成为一个活着的传奇。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 的知名度和合法性从未如此之高，人们声称你一定是由神明选中的。人们每天都在为你的持续成功而祈祷，而你的臣民的热诚只会激励你为他们做更多的事情。\n\n然而，在适当的时候......因为这种宿醉会杀了你。"
 me_bithynia_16_title:0 "比西尼亚的胜利"
 me_bithynia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_bithynia_17.a:0 "为我们的战斗人员欢呼三声！"
 me_bithynia_17_desc:0 "阅兵式刚刚落下帷幕，即使是像你这样身经百战的怀疑论者，也对站在原地的队伍的组织性和纪律性印象深刻。在你多年的经历中，你见过许多战斗；所有这些都是记录在案的，但你很难记得有哪个敌人像聚集在你面前、等待你指挥的军队一样勇敢。比西尼亚的敌人有祸了！"
 me_bithynia_17_title:0 "比提尼亚军团"
 me_bithynia_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_bithynia_18.a:0 "我们将暂时不考虑税收，但这是好事"
 me_bithynia_18_desc:0 "我们对经过我们领土的所有贸易都有绝对的控制权。我们不仅在我们控制的富饶土地上榨取它们的价值，而且我们最近扩大港口和船厂的举措也使我们成为海洋的主人。你们的国库正享受着对贸易征收的税款，这就像一团不受控制的火一样在增长--真的，你们很高兴。"
 me_bithynia_18_title:0 "比提尼亚的港口"
 me_bithynia_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_bithynia_19.a:0 "我们应谨慎管理我们的财富"
 me_bithynia_19_desc:0 "在一些邻近的首都，商人们都挤在同一个狭窄的地方，对他们市场的明显设计没有任何韵律或理由。在一个卖香水的小贩旁边买鲜鱼？或者在主要广场旁边有一个制革区？谁能想象这样的傻事，城市规划者如此缺乏远见？\n\n谢天谢地，在比堤尼亚的城市里没有这样的问题，那里的专业市场几乎是爆满的。如果你寻求来自遥远岛屿的香料，有一些地方你可以找到它们，或者也许你的品味在于东方的宝石和珍贵的石头？这里有出售金银、钻石和珠宝的商贩，他们靠近银行区，王国的大商人家族在这里进行交易。没有其他市场能像比西尼亚的市场一样；我们是世界的榜样。"
 me_bithynia_19_title:0 "令人难以置信的奢侈"
 me_bithynia_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_bithynia_1_desc:0 "经过几个月的稳步建设，我们的首席建筑师报告说，卡尔珀，曾经是黑海海岸上的一个由小屋和茅草屋组成的破烂定居点，现在是一个真正的城市。关于我们伟大成就的消息很快就传开了，我们已经看到有大量的公民涌入整个比希尼亚。许多人希望在玛利安底尼亚的新首都找到他们的财富，而且每天都有越来越多的船只抵达你们繁忙的港口。我们资助建设是明智的，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]。"
 me_bithynia_1_title:0 "卡尔珀城"
 me_bithynia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_bithynia_2.a:0 "这才是我们真正的家......没有其他地方能比得上它"
 me_bithynia_20.a:0 "我们应该得到这个机会；让我们的士兵为即将到来的事情做好准备"
 me_bithynia_20_desc:0 "我们已经完成了对曾经属于吕西马科斯的土地的宣称，吕西马科斯是在亚历山大大帝死后敢于为自己挣得一个王国的继业者之一。我们说这些土地曾经属于他，因为现在它们属于比提尼亚；我们宣称色雷斯的所有城市、他们的港口、他们的寺庙和圣地，甚至他们在海姆斯山的野蛮人王族的领地，我们也要求成为我们自己的。"
 me_bithynia_20_title:0 "色雷斯人的推力"
 me_bithynia_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_bithynia_21.a:0 "我们是一个虔诚的民族，尊重我们的祖先"
 me_bithynia_21_desc:0 "我们编造了一些文件，声称我们的古都阿耳塔涅斯曾经在整个亚洲建立了一个庞大的仆从国网络，包括在上密西亚和下密西亚的藩属。虽然许多记录者都在抗议这些公认的可笑的说法，认为绝对没有证据证明这种事情曾经发生过，但似乎我们的敌人没有实力挑战我们。我们已经表明，我们寻求维护我们祖先的方式，并将为属于我们的东西而战。"
 me_bithynia_21_title:0 "亚洲升华"
 me_bithynia_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_bithynia_22.a:0 "我们将被张开双臂拥抱"
 me_bithynia_22_desc:0 "我们的祖先称之为家园的色雷斯的土地，在这些漫长的战争和破坏的岁月里确实遭受了痛苦--我们认为这是一个令人心碎的事实，甚至是完全不能容忍的。\n\n我们怎么能眼睁睁地看着养育我们祖先的土地在一个疯狂的世界里自生自灭？我们应该等待多久，听着他们可怜的呼救声，而不做任何事情来解放他们？每个人都明白，我们做了必须要做的事情。"
 me_bithynia_22_title:0 "色雷斯的自由"
 me_bithynia_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_bithynia_23.a:0 "他们和我们之间有什么真正的区别吗？"
 me_bithynia_23.b:0 "我们在统一的整体中颂扬个性"
 me_bithynia_23_B_tooltip:0 "所有处于[GetCultureGroup('thrace_group').GetName|Y]文化组的人口将成为[GetCulture('bithynian').GetName|Y]"
 me_bithynia_23_desc:0 "命运决定让我们成为孕育我们的土地的主人；当我们古老的色雷斯人的祖先放弃他们的家园，在水面上寻找他们的财富时，他们有没有预料到我们会作为征服者的英雄回来？我们现在可以决定如何对待我们的色雷斯表亲......我们控制文化就像控制城市一样。"
 me_bithynia_23_title:0 "色雷斯人的保护者"
 me_bithynia_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_bithynia_24.a:0 "我们将把被征服的弗里吉亚人视为自己人--嗯，也许不完全是......"
 me_bithynia_24_desc:0 "弗里吉亚有一个很好的公路系统，这个系统与安纳托利亚南岸的富裕城市相连，它使穿越弗里吉亚的山地变得更加容易。比提尼亚吸收这些领土是很好的；要求控制这些重要的路线对我们来说应该是一个足够的理由。"
 me_bithynia_24_title:0 "弗里吉亚属地"
 me_bithynia_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_bithynia_25.a:0 "假以时日，没有人会记得这次侵略，如果他们记得？太糟糕了"
 me_bithynia_25_desc:0 "尽管你一直被公开指控觊觎伊里斯下游省份，且直到现在都否认这一指控，如今你终于决定公开表明：这些绝非流言。是的，你的士兵正在边境动员；是的，当你说自己想要整个省份时，你是认真的。无论如何，又有谁能阻止你呢？"
 me_bithynia_25_title:0 "卡帕多西亚的宣称"
 me_bithynia_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_bithynia_26.a:0 "我们感谢我们的海员们为国家做出的重要贡献"
 me_bithynia_26_desc:0 "我们的海军已经成为一个专业的实体，轻松超越了你的崇高期望。你们的人不仅有能力击溃派来对付他们的更大的舰队，而且你们的水手也是凶猛的战士，把与他们登上的敌船进行手刃战作为一种骄傲，希望能尽可能多地捕获船只。这似乎是一个骄傲的点，看谁能夺取最多的船只--这是一个你很乐意鼓励的游戏。此外，你们的人也越来越善于在海上修复他们所夺取的受损船只--有什么是他们做不到的吗？"
 me_bithynia_26_title:0 "比堤尼亚的优势地位"
 me_bithynia_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_bithynia_27.a:0 "结束这种强盗行为；拿下整个省"
 me_bithynia_27_desc:0 "虽然陶里卡的土地远在比提尼亚的海岸之外，但其丰硕的产出的声誉却在它之前。他们的产量惊人，商品令人向往，正是这种经济上的成功导致北方人成为不可靠的商业伙伴；他们的商人不仅总是试图压低我们的价格，而且还试图欺骗他们的方式，不支付在比西尼亚城市开展业务所需的税收。\n\n更多的时候，每当你听到关于陶里卡省的消息，总是坏消息。需要对这个问题采取一些措施，一劳永逸。"
 me_bithynia_27_title:0 "陶里卡的动荡"
 me_bithynia_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_bithynia_28.a:0 "这也是一个如此可爱的地方"
 me_bithynia_28_desc:0 "虽然这让我们与许多渴望得到的人产生了矛盾，但我们已经成功地确保了艾欧里斯和艾欧尼亚的全部安全--没有船只会在没有看到比提尼亚的海岸线的情况下通过这一地区。"
 me_bithynia_28_title:0 "控制海岸"
 me_bithynia_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_28$#!' $mission_completed_tooltip_2$"
 me_bithynia_29.a:0 "克里特岛"
 me_bithynia_29.b:0 "斯波拉德"
 me_bithynia_29.c:0 "爱琴海群岛"
 me_bithynia_29_desc:0 "经过几周的考虑，期间每天都会咨询你的财务和军事顾问，你已经决定建立一个爱琴海管理中心，以促进最顺利的商业交易。现在，困难的部分已经解决了，唯一要做的就是选择一个合适的地点。"
 me_bithynia_29_title:0 "一个爱琴海的力量"
 me_bithynia_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_29$#!' $mission_completed_tooltip_2$"
 me_bithynia_2_desc:0 "在过去的几年里，阿耳塔涅斯发展得非常好，老城区几乎无法辨认；甚至连历史区，也就是建在城墙外的小鱼市场，也已经变成了非常不同的东西。因为旧时的阿尔塔内斯已经被你的建筑计划所取代，有人提议将这座城市改名为齐波厄忒斯，你谦虚地接受了这个荣誉。\n\n一天下午，当夕阳把黑海的水面涂成耀眼的橙色和红色时，你决定在主要的大道上散步，陶醉于你的城市在夜晚沉淀下来的声音。现在市场上只有微弱的叫卖声；一个个孤独的店主顽强地想在夜幕降临前多赚几个硬币。当你把目光投向港口，看到几十艘沉睡的船只在温柔的水面上摇曳，你的心为这一切的美丽而澎湃。"
 me_bithynia_2_title:0 "齐波厄忒斯"
 me_bithynia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_bithynia_3.a:0 "我们将永远珍惜这一天"
 me_bithynia_30.a:0 "这是它应该有的样子"
 me_bithynia_30_desc:0 "我们不仅给伯罗奔尼撒半岛上有争议的省份带来了真正的自由，而且用我们的建筑和投资美化了他们的土地。我们的举措永远地改变了景观的面貌，未来的子孙后代将看到我们城楼高耸的墙，知道我们是这片土地的主人。"
 me_bithynia_30_title:0 "伯罗奔尼撒半岛的主人"
 me_bithynia_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_30$#!' $mission_completed_tooltip_2$"
 me_bithynia_31.a:0 "他们应该感谢我们的好意"
 me_bithynia_31_desc:0 "坚信其他地方的不稳定如果放任不管，只会给我们的市场带来麻烦，我们再次被要求进行军事干预，以确保比特尼亚货物的自由进入。对希腊人民来说，我们决定直接管理他们是一件好事；他们没有什么可担心的了，可以专注于为自己建立美好的生活。"
 me_bithynia_31_title:0 "希腊的保护者"
 me_bithynia_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_31$#!' $mission_completed_tooltip_2$"
 me_bithynia_32.a:0 "好吧，我们当然不会对这个说不"
 me_bithynia_32_desc:0 "弗里吉亚的尘土飞扬的平原、森林和丘陵终于是我们的了，我们可以高兴地说，我们已经从解放这些中部省份中受益了。我们的军队不仅能快速穿越安纳托利亚高原，而且我们的贸易收入也随之增加--这还不算太糟，嗯？"
 me_bithynia_32_title:0 "骠骑兵的力量"
 me_bithynia_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_32$#!' $mission_completed_tooltip_2$"
 me_bithynia_33.a:0 "多好的祝福啊！"
 me_bithynia_33_desc:0 "我们有很多值得庆祝的事情，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]；我们不仅在安纳托利亚南部的优秀海岸线上建立了稳固的地位，而且由此带来的贸易繁荣也给我们的两个首要城市--卡尔珀和瑞巴斯带来了收益。比特希尼亚的大商人家族在这一天有很多值得感激的事情。"
 me_bithynia_33_title:0 "南部海岸"
 me_bithynia_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_33$#!' $mission_completed_tooltip_2$"
 me_bithynia_34.a:0 "只有强者才能在这个世界上生存"
 me_bithynia_34_desc:0 "米特里达特人的力量已经被[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]打破；[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的意志和命令已经足以粉碎我们敌人古老血统的力量。我们不仅确立了我们自己的比特尼的至高无上的地位，让所有人都看到了，而且我们还剥夺了我们的对手的统治特权。作为征服者和王朝的建立者，我们的知名度是无与伦比的。"
 me_bithynia_34_title:0 "亚洲的晚祷"
 me_bithynia_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_34$#!' $mission_completed_tooltip_2$"
 me_bithynia_35.a:0 "不尊重我们，后果自负"
 me_bithynia_35_desc:0 "我们的力量涵盖了安纳托利亚中部的广大地区，不仅侵占了凶猛而有争议的卡帕多西亚人的力量，而且即使是坚固的亚美尼亚人，在他们的山地堡垒中也有理由害怕比提尼亚的进军；无论我们想要什么，我们都会采取，因为这与真正的卡帕多西亚国王相称。"
 me_bithynia_35_title:0 "卡帕多西亚的国王"
 me_bithynia_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_35$#!' $mission_completed_tooltip_2$"
 me_bithynia_36.a:0 "在时间允许的情况下，我们应该亲自访问这个地区"
 me_bithynia_36_desc:0 "博斯普鲁斯希腊人有着独特而多彩的文化，野眼的斯基泰人主宰着草原却接近我们的城市进行贸易，当然还有无处不在的比特尼亚商人和旅行者......色雷斯陶里卡是一片好奇的土地，充满了许多有趣和引人入胜的人，而我们对世界的了解也因此更加丰富。"
 me_bithynia_36_title:0 "色雷斯的陶里卡"
 me_bithynia_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_36$#!' $mission_completed_tooltip_2$"
 me_bithynia_37.a:0 "我们的敌人因我们的名字而颤抖！"
 me_bithynia_37_desc:0 "当我们的敌人和对手的首都传来我们已经统一了整个亚洲半岛的消息时，他们会哭泣和恐惧，巨大的恐惧会抓住他们；在晚上，国王们会躺在床上，他们的大脑飞速运转，被一个问题紧紧抓住......\n\n如果比堤尼亚人接下来攻击我，我应该怎么办？谁能从他们的正义之怒中获得安全？谁能战胜他们？"
 me_bithynia_37_title:0 "亚细亚的国王"
 me_bithynia_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_37$#!' $mission_completed_tooltip_2$"
 me_bithynia_38.a:0 "然而，我还有更多的事情要做......"
 me_bithynia_38_desc:0 "在许多人失败的地方获得成功，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]承担了[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]神圣的命运，将比特希尼亚人确立为希腊的国王。这样一个令人难以置信的成就肯定会让全世界为之侧目，未来的学者们将会向他们的学生传授那个责罚整个希腊的伟大的Basileus的名字；[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 。"
 me_bithynia_38_title:0 "希腊的国王"
 me_bithynia_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_38$#!' $mission_completed_tooltip_2$"
 me_bithynia_39.a:0 "一个令人振奋的事情，这么多的权力......"
 me_bithynia_39_desc:0 "虽然我们与叙利亚和亚述的土地没有真正的历史联系，但我们不能允许这个地区被任何敌视我们自己利益的人所统治。迫于形势，我们不得不对这些土地提出宣称，我们可以保证，我们将成为比我们之前的人更好的统治者。"
 me_bithynia_39_title:0 "踏入叙利亚"
 me_bithynia_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_39$#!' $mission_completed_tooltip_2$"
 me_bithynia_3_desc:0 "我们向本都的赫拉克利亚发出的联姻提议已获成功，双方家族联姻之事已达成共识。婚礼之日终于到来，您为儿子选得这般佳偶实属明智之举——您此前曾有幸与她一面之缘，她确是位魅力非凡的姑娘，聪慧过人且容貌出众，所幸您儿子也持相同看法。她必将成为家族中令人欣喜的新成员。"
 me_bithynia_3_title:0 "一个阿契美尼德的新娘"
 me_bithynia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_bithynia_4.a:0 "我们很遗憾事情发展到这一步，但我们接受我们的职责"
 me_bithynia_40.a:0 "这些土地将成为未来战役的重要集结地"
 me_bithynia_40_desc:0 "叙利亚如你所料，o [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，已经落入我们胜利的部队手中。我希望我可以说，叙利亚的人进行了令人钦佩的防御，但当所有事情都考虑到时，他们的士兵是软弱的，是懦夫......我们屠杀了他们，是对战争之神的献祭。"
 me_bithynia_40_title:0 "叙利亚提交"
 me_bithynia_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_40$#!' $mission_completed_tooltip_2$"
 me_bithynia_41.a:0 "相信我，我们还没有完成"
 me_bithynia_41_desc:0 "我们最新的军事行动又一次取得了胜利，但你比往常更加自豪；你的士兵已经征服了黎凡特的大部分地区，将比特希尼亚的领地扩展到了一些地区，这将确保你在未来几十年的经济和军事发展。随着我们胜利的消息传开，整个比西尼亚都将庆祝这一令人难以置信的成就。"
 me_bithynia_41_title:0 "黎凡特之主"
 me_bithynia_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_41$#!' $mission_completed_tooltip_2$"
 me_bithynia_42.a:0 "比提尼亚的人民，束装待发吧"
 me_bithynia_42_desc:0 "我们将追随众多名将的脚步，挺进埃及本土；我们把富饶的尼罗河三角洲收归己有，为此不择手段。传令给那些蛰伏在吾土之上的埃及冒名者，让他们知晓——这片土地很快将重归正统之手！"
 me_bithynia_42_title:0 "法老的土地"
 me_bithynia_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_42$#!' $mission_completed_tooltip_2$"
 me_bithynia_43.a:0 "我们可能不是法老，但我们肯定是神"
 me_bithynia_43.b:0 "让我们拥护埃及人的方式"
 me_bithynia_43_desc:0 "当夜幕降临在孟菲斯城，在城市的天际线上铺上她的紫色斗篷，闪闪发光的星星，你从你私人房间的僻静窗户向远处的金字塔望去。金字塔顶部的顶石捕捉并放大了即将逝去的天光，在聚集的阴暗中亮了起来--这一景象让你的眼睛里流下了惊叹的泪水。曾经你凝视着黑海的汹涌波涛，但现在你的视线迷失在环绕你的无尽沙海中。你已经走了多远……\n\n然而，还有更多。如果你愿意，你可以宣称法老的头衔，在埃及的神圣土地上建立一个比堤尼亚王朝。你所要做的只是说一句话，就可以了。"
 me_bithynia_43_title:0 "比西尼亚王朝"
 me_bithynia_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_43$#!' $mission_completed_tooltip_2$"
 me_bithynia_43_tooltip_2:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]将担任法老的称号。比希尼亚的统治者将不必遵循埃及的传统，而是可以肆无忌惮地进行统治。"
 me_bithynia_44.a:0 "我们将极大地重视他们的伙伴关系"
 me_bithynia_44_desc:0 "当我们的军队第一次进入巴比伦城时，我们惊讶地发现，迎接我们的是一群杂七杂八的人物；占星家、历史学家、商人家族、地方官僚、来自最高贵和古老家族的代表，都聚集在城中心的堡垒外等待。一位发言人站出来，用当地语言宣布，虽然你的文士用停顿的语调翻译过来，但你还是明白了所说的大意。显然，这一刻是由星星预示的，巴比伦人已经期待了很久。他们没有进行徒劳的抵抗，而是向我们提供支持，同意我们最好把我们的财富结合在一起。"
 me_bithynia_44_title:0 "来自巴比伦的祝福"
 me_bithynia_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_44$#!' $mission_completed_tooltip_2$"
 me_bithynia_45.a:0 "我们不惧怕任何人"
 me_bithynia_45_desc:0 "虽然意大利半岛是拥有古老历史的老牌国家，在该地区的合法性要高得多，但这并不足以阻止我们看看能不能为自己剥离出一个地区。由于各种原因，塔林敦是我们选择的滩头堡省份--我们意大利战役的一个吉祥的开始。"
 me_bithynia_45_title:0 "脚趾头在靴子里"
 me_bithynia_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_45$#!' $mission_completed_tooltip_2$"
 me_bithynia_46.a:0 "无论如何，大希腊的财富都是我们应得的"
 me_bithynia_46_desc:0 "由于我们的军事努力，大希腊已经与希腊世界重新统一，不再受僭主国王或扩张主义共和国的影响。在我们赶走最后一支入侵部队后，大希腊的公民拥抱了我们，敞开他们的心扉和财库，以示感谢。这样忠心耿耿的人民将成为比提尼亚王国的美好补充。"
 me_bithynia_46_title:0 "大希腊"
 me_bithynia_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_46$#!' $mission_completed_tooltip_2$"
 me_bithynia_47.a:0 "可悲啊......"
 me_bithynia_47_desc:0 "人们对这些罗马人大惊小怪，但你却看不出有什么大不了的--现在他们的首都已经落入你的手中，你没有发现他们有什么值得一提的地方。事实上，与比西尼亚的人民相比，罗马人在每一个类别中都被发现是缺乏的。"
 me_bithynia_47_title:0 "罗马的衰落"
 me_bithynia_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_47$#!' $mission_completed_tooltip_2$"
 me_bithynia_48.a:0 "山南高卢，嗯？这些山脉的另一边是什么？"
 me_bithynia_48_desc:0 "当我们第一次把野蛮人赶出塔林敦的时候，我们没有想到这将是我们统治整个意大利半岛的开始。肥沃的波河谷现在是我们管理的众多领域中最新的一员，在我们民族的历史上，贸易和持续繁荣的前景从来没有这么好过--诸神对比提亚微笑。"
 me_bithynia_48_title:0 "意大利人的统治"
 me_bithynia_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_48$#!' $mission_completed_tooltip_2$"
 me_bithynia_49.a:0 "希望其他野蛮人会注意到"
 me_bithynia_49_desc:0 "起初，是偶尔的牛群袭击——也许是一两个农民被杀，他的财产被毁坏和破坏。惯常的歌舞，把懦夫赶回山里，也许在不可避免的强奸报告到来之前，有一两个安静的季节。然而，当伊利里亚的野蛮人认为他们可以攻击整个村庄，杀死和奴役几十个比特尼人时，我们不能忽视的界限就被越过了。"
 me_bithynia_49_title:0 "伊利里亚的无知"
 me_bithynia_49_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_49$#!' $mission_completed_tooltip_2$"
 me_bithynia_4_desc:0 "我们已经向各地派出了大使馆，让整个地区都知道，所谓的'比提尼亚的国王'，这些无赖用他们的强盗行为污染了我们南部的土地和水域，是比提尼亚的领土的非法占领者，我们将尽一切努力纠正这些错误。虽然少数人对我们的主张感到愤怒，误以为我们的大胆是傲慢，但我们的大使馆表示，更多的国家对我们的倡议印象深刻，并暗中支持我们。我们的军队正在动员，等待你的命令。"
 me_bithynia_4_title:0 "比西尼亚的国王"
 me_bithynia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_bithynia_5.a:0 "我们的人民应该庆祝"
 me_bithynia_50.a:0 "在我们已经拥有的众多荣誉中又多了一项"
 me_bithynia_50_desc:0 "我们对伊利里亚土地的统治被证明是成功的，也许甚至比我们最初预期的还要多一点。我们不仅最终成功地平息了居住在这些山脉和荒野上的海盗和盗贼的野蛮人袭击，而且我们还发现这些人愿意接受我们的比提尼亚方式。全世界都称我们为伊利里亚的国王。"
 me_bithynia_50_title:0 "伊利里亚的国王"
 me_bithynia_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_50$#!' $mission_completed_tooltip_2$"
 me_bithynia_51.a:0 "而未来仍然在召唤我们前进......"
 me_bithynia_51_desc:0 "当伟大的历史学家讲授《亚历山大的历史》时，他们并没有以这位著名的马其顿人Basileus在巴比伦的死亡床上神志不清的生活结束；他令人印象深刻的故事被看作是一个序幕，这个故事与比提尼亚人的崛起交织在一起，在一个火花结束的地方，另一个火花就会燃烧起来。比提尼亚人已经建立了一个让人无法理解的霸权，他们富有的国王是如此庞大和强大。阻止比特尼人征服广阔世界的唯一原因是他们自己的克制；没有人能够挑战他们。"
 me_bithynia_51_title:0 "比提尼亚时代"
 me_bithynia_51_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_51$#!' $mission_completed_tooltip_2$"
 me_bithynia_52.a:0 "我们接受所有希望成为我们这样的人"
 me_bithynia_52_desc:0 "卡尔珀，著名的马里安迪尼亚的首都，已经成为一个文化热点。最富有的人把他们的孩子送到我们的城市，希望给他们一个适当的比提尼亚教育的礼物，而更多的人没有能力参加我们杰出的学院，正在采用比提尼亚名字和服装礼仪。我们的诗人是文明世界羡慕的对象，他们的舞台剧在雅典和亚历山大等遥远的城市的剧院取得了巨大的成功。似乎每个人都想成为比提尼亚人。"
 me_bithynia_52_title:0 "比提尼亚文化"
 me_bithynia_52_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_52$#!' $mission_completed_tooltip_2$"
 me_bithynia_53.a:0 "史无前例的增长，全靠我们--我们心存感激"
 me_bithynia_53_desc:0 "“阿耳塔涅斯”这个陈旧的名字，曾经出现在每个比特希尼亚人的嘴边，现在已经被历史学家们归入尘封的卷轴和文本中；没有人知道齐波厄忒斯城的古老称号。我们的首都从一个卑微的开始，现在已经成为黑海上最重要的目的地，成千上万的人把它豪华的街道当作自己的家。但现在是再次增加城市边界的时候了；我们的大都市，骄傲的齐波厄忒斯城，是一个繁荣的首都，配得上这个地区最伟大的力量--比提尼亚。"
 me_bithynia_53_title:0 "齐波厄忒斯的大都会"
 me_bithynia_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_53$#!' $mission_completed_tooltip_2$"
 me_bithynia_54.a:0 "我们告诉你，这将会发生"
 me_bithynia_54_desc:0 "我们在亚细亚控制区发起的史无前例的建设活动已经完成，新建立的市场和论坛已经被商贩和商人填满。当人们谈到东方的财富时，他们所指的无疑是比堤尼亚的辉煌。"
 me_bithynia_54_title:0 "投资于亚细亚"
 me_bithynia_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_54$#!' $mission_completed_tooltip_2$"
 me_bithynia_55.a:0 "历史将以我们的事迹记住我们"
 me_bithynia_55_desc:0 "我们从我们控制的港口获得的收入是一个惊人的数字，这反映了我们作为一个经济强国的地位。在我们港口流淌的黄金之河上，我们资助建造了有史以来最大的海军舰队，并训练了金钱可以买到的最好的船员。我们勇敢的水手也渴望战斗；他们已经准备好在海浪中展示比特尼的力量。"
 me_bithynia_55_title:0 "比提尼亚的港口"
 me_bithynia_55_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_55$#!' $mission_completed_tooltip_2$"
 me_bithynia_56.a:0 "让我尝尝大家都在谈论的这种蜂蜜"
 me_bithynia_56_desc:0 "我们在整个比希尼亚建立的农场的第一批收成开始来了，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]。我们的农民不得不修改他们的技术，因为他们不熟悉当地的地形，但通过试验和错误，成功地种植了丰盛的谷物和草药--我相信我们可以在我们王国的其他地方应用我们学到的东西。\n\n而且，我的国王，如果我可以的话--他们说当地有一种蜂蜜，有你所建的这些农场里种植的百里香的味道，有一点烟熏的味道，简直是美味。我们这里有一些，如果你好奇，可以自己尝试一下。"
 me_bithynia_56_title:0 "比堤尼亚的产粮地区"
 me_bithynia_56_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_56$#!' $mission_completed_tooltip_2$"
 me_bithynia_57.a:0 "比提尼亚人是最伟大的人！"
 me_bithynia_57_desc:0 "每个人都想成为比西尼亚人；普通的方言经常被说成是我们的方言，在每个值得访问的大城市和国家的首都都能看到比西尼亚人。我们的着装方式因其实用性和优雅性而受到欢迎，甚至我们的菜肴也出现在遥远的盘子里，这要归功于我们带到他们市场上的香料。这些菜肴的真实性是否是真正的比提尼亚有待商榷--我的意思是，任何人都可以在他们的豆类中加入葫芦巴和薄荷--但它使你高兴地看到比提尼亚文化正在变得如此根深蒂固。"
 me_bithynia_57_title:0 "要成为拜蒂尼亚人"
 me_bithynia_57_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_57$#!' $mission_completed_tooltip_2$"
 me_bithynia_58.a:0 "如果有一天能访问这些城市就好了"
 me_bithynia_58_desc:0 "我们给卡帕多西亚带来的和平鼓励了旅行者和朝圣者放弃他们的流浪之路，在我们在安纳托利亚的尘土飞扬的平原和山谷中建造的城市里定居下来。随着这些庞大的城市数量的膨胀，我们已经明白了如何更好地管理我们发现自己所负责的成群结队的人类。"
 me_bithynia_58_title:0 "卡帕多西亚建设"
 me_bithynia_58_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_58$#!' $mission_completed_tooltip_2$"
 me_bithynia_59.a:0 "拜占庭将成为我们的藩属，并为我们提供良好的服务"
 me_bithynia_59.b:0 "发挥拜占庭的作用"
 me_bithynia_59_desc:0 "就像古代的拜扎斯，那个走南闯北寻找合适地点建造城市的流浪者，你也成为了一个伟大的创始人，也许在个人野心上甚至超过了拜扎斯。但与麦加拉不同的是，你不需要咨询神谕来寻找你的位置；你可以清楚地看到需要做什么来增强拜占庭，把你的建筑专长带到水面对面的欧洲。\n\n随着拜占庭的重要性不断增加，我们决定以政治权宜之计，重新考虑现状，将拜占庭作为藩属释放，但有一个新的名字；拜占庭。让骄傲的拜占庭人管理自己的事务，同时承认我们的宗主国地位……在亚洲还有很多工作要做。"
 me_bithynia_59_title:0 "拜占庭的野心"
 me_bithynia_59_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_59$#!' $mission_completed_tooltip_2$"
 me_bithynia_59_tooltip_2:0 "释放#Y 拜占庭#!作为#Y 藩属#!"
 me_bithynia_59_tooltip_B:0 "放弃#Y 比堤尼亚#!扮演#Y 拜占庭#!"
 me_bithynia_5_desc:0 "感谢你的远见卓识，我们通过建立更多的农业定居点，防止了食物供应的中断；现在，城市市场上已经充满了新鲜的、本地种植的蔬菜，你甚至已经听到传言，由于牲畜供过于求，羊的价格已经大幅下降。很好；我们的数量比我们需要的要多，这就更好了。市场会恢复的；让人民吃肉，快乐地生活吧。"
 me_bithynia_5_title:0 "稳定的供应"
 me_bithynia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_bithynia_6.a:0 "安提柯王朝已经放弃了卡尔西顿和阿斯塔科斯——宣战！"
 me_bithynia_60.a:0 "我们一直知道这里有一些潜力"
 me_bithynia_60_desc:0 "这是一件奇怪的事情，金钱所带来的力量；那些没有任何金钱的人对它的渴望高于一切，甚至那些拥有比任何一个人一生都要多的黄金的人也经常觊觎别人的财富。钱币的力量主宰着人和土地；即使是色雷斯这个富饶的地区也获得了超出想象的收益，这都是因为我们勤奋的财政管理。我们确实是一个令人印象深刻的管理者，有着无可挑剔的金融敏锐度。"
 me_bithynia_60_title:0 "照顾色雷斯"
 me_bithynia_60_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_60$#!' $mission_completed_tooltip_2$"
 me_bithynia_61.a:0 "对我们来说多么可爱"
 me_bithynia_61_desc:0 "在比提尼亚国家付出巨大代价的情况下，我们资助并建造了符合我们严格标准的市场，正如每个人都能预料到的那样，经济繁荣几乎是瞬息万变的，而且没有任何迹象表明很快就会减弱。我们以比提尼亚方式来发展这些城市是明智的。"
 me_bithynia_61_title:0 "爱琴海的成就"
 me_bithynia_61_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_61$#!' $mission_completed_tooltip_2$"
 me_bithynia_62.a:0 "其实我现在并不介意喝点酒"
 me_bithynia_62_desc:0 "当你收到关于希腊食品生产的消息时，你正在享受中午的点心--你喜欢生活中的讽刺，相信没有所谓的巧合，一切都有神的启示。看来你在葡萄园的投资得到了回报，到处都是丰收的景象；就好像你的农民用金币播种了他们的田地。不用说，今年的葡萄酒将是精美的。"
 me_bithynia_62_title:0 "生活的主食"
 me_bithynia_62_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_62$#!' $mission_completed_tooltip_2$"
 me_bithynia_63.a:0 "谢谢你，我的朋友。我将制作并分发一百份副本"
 me_bithynia_63_desc:0 "你和你的宫廷哲学家有一个会议，你已经期待了一段时间。在她所有的荣耀中，管理比提尼亚并不是一件容易的事，而且经常有几个星期的时间，你没有向你的每一位大臣汇报。有时事情就是这样，而且这些天来，军营比图书馆更重要，这已经不是什么秘密了......\n\n但现在别管这些了。在过去的几周里，你们的图书管理员一直在收集我们各个建筑师的书面记录，特别是那些被委托建造比特尼亚城市的荣誉。你会对这一举措本身感到高兴，但似乎你的宫廷哲学家更进一步，通过汇编每个独立作品的最佳部分，已经组装了一个总的论文，一个相当干燥的标题 比提尼亚建筑实践及其实际应用。虽然这肯定是一本不适合外行人的专业文本，但通过遵循这份文件作为某种手册，我们全国的建筑商将能够比以前更快地建造比特希尼亚城市。"
 me_bithynia_63_title:0 "主人的模板"
 me_bithynia_63_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_63$#!' $mission_completed_tooltip_2$"
 me_bithynia_64.a:0 "他们只是妒忌"
 me_bithynia_64_desc:0 "'人才归人才，钱币归钱币，奢侈归奢侈；当所有的一切都被计算在内时，比西尼亚无疑是世界上最富有的土地。她的港口充满了满载而归的船只，这些船只在黑海的水面上危险地沉没，它们被挤得满满的，装满了美味佳肴和放荡物品，她邪恶的人们贪婪地吞噬着。比西尼亚人粗俗地炫耀他们的财富；甚至男人也戴着浮夸的珠宝，他们的手臂上挂着厚厚的、镶有宝石的金箍。真的，我在我的旅行中从未见过这样的情况。\n\n-这是公元前1世纪罗马参议员Kaeso Brocchus对拜占廷人的抨击，是'Res Bythinicus'一文中的片段"
 me_bithynia_64_title:0 "比堤尼亚的财富"
 me_bithynia_64_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_64$#!' $mission_completed_tooltip_2$"
 me_bithynia_65.a:0 "把这些经验应用到我们能做的任何地方"
 me_bithynia_65_desc:0 "我的Basileus，我们派去监督整个马其顿的建设的工程队已经回来了，你会很高兴地知道，我们的建筑师们在外面的时候学到了很多东西。他们不仅说，由于他们掌握了新的建筑技术，他们可以为我们省钱，而且他们甚至认为，他们可以建得更快大胆的说法是肯定的，但比提尼亚人确实在几乎所有方面都很出色......"
 me_bithynia_65_title:0 "比提尼亚建设者"
 me_bithynia_65_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_65$#!' $mission_completed_tooltip_2$"
 me_bithynia_66.a:0 "只要我们的将军们记得他们的位置，我们就很好"
 me_bithynia_66_desc:0 "在忙碌地管理你的王国后，你决定突然拜访你的军团，他们在新的领导下进行训练。当你抵达营地的消息传开后，士兵们聚集成阵，开始操练；空气被成千上万的士兵的呼喊声打破，他们的长矛在执行演习时向天空刺去。你发出一声低沉的口哨，继续观看这个场面；你以前从未见过一群长矛手如此团结一致地行动。"
 me_bithynia_66_title:0 "一个致命的军团"
 me_bithynia_66_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_66$#!' $mission_completed_tooltip_2$"
 me_bithynia_67.a:0 "只有傻瓜或疯子才会试图现在攻击我们"
 me_bithynia_67_desc:0 "你刚刚完成对整个比提尼亚与马里安迪尼亚诸省所修建的雄伟防御工事的巡视。在众位将领与首席建筑师的陪同下，你开始了对当地人称之为“齐波厄忒斯之墙”的全面视察，这项工作整整持续了数日。当一切结束之时，你对这道所谓的“墙”感到无比满意。今晚，你将安然入眠，在对自身权力的笃定之中安享稳固与安宁。"
 me_bithynia_67_title:0 "齐波厄忒斯之墙"
 me_bithynia_67_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_67$#!' $mission_completed_tooltip_2$"
 me_bithynia_68.a:0 "一切都在按计划进行"
 me_bithynia_68_desc:0 "因为我们继续以令人难以置信的速度扩张，所以我们任命一位比提尼亚指挥官是合理的。有许多职责是您亲自负责的，包括参加不断需要您关注的众多仪式活动，因此，您将指挥权下放是很自然的。您的军事顾问对这一举措表示支持，许多人都在争先恐后地想把这一荣誉赋予他们。"
 me_bithynia_68_title:0 "一个值得信赖的指挥官"
 me_bithynia_68_tooltip:0 "任务'#Y $bithynia_missions_task_68$#!'已#G完成#!!\n"
 me_bithynia_69.a:0 "我们的选择是明智的"
 me_bithynia_699.a:0 "我们已经明智地选择了我们的指挥官"
 me_bithynia_699_desc:0 "我们收到了一个消息，由于你经常听到同样的报告，这个消息在这一点上几乎已经成为了惯例；我们的指挥官在战场上又一次获得了成功，摧毁了另一支愚蠢到与他们作战的军队。"
 me_bithynia_699_title:0 "新的比提尼亚指挥官"
 me_bithynia_69_desc:0 "我们收到了一个消息，由于你经常听到同样的报告，这个消息在这一点上几乎已经成为惯例；我们的指挥官在战场上又一次取得了成功，摧毁了另一支愚蠢到与他们作战的军队。"
 me_bithynia_69_title:0 "著名的指挥官"
 me_bithynia_69_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_69$#!' $mission_completed_tooltip_2$"
 me_bithynia_6_desc:0 "你没有冒着与可怕的安提柯王国公开敌对的风险，而是用你的聪明才智解决了一个军事问题。在过去的几周里，你一直与 [GetCharacter('(int32)37').GetName] 保持联系，向他们赠送礼物和承诺，看来这一活动正在得到回报。虽然你肯定没有资格挑战安提柯的实力，但你肯定听说过关于他们处于绝望境地的传闻；以前的同胞兄弟现在成了你的对手，发动的战争威胁到了所有人的毁灭。这些天来，真正的友谊似乎很匮乏，当 [GetCharacter('(int32)37').GetName] 把你纳入他的信任范围时，这几乎是个意外。\n\n一天晚上，你的新朋友来了一封信；是对你几天前发出的一个大胆请求的回应。他承认他对你向他提出的要求略感不安，但他承认他重视你在未来继续合作，并祝福你追求你的战争。他所要求的是，当时机成熟时，你们要记住这一点，并在你们被要求时回报他。"
 me_bithynia_6_title:0 "朋友之间的礼物"
 me_bithynia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_bithynia_7.a:0 "他们在外交上拒绝给予我们的东西，终将在矛尖前失去。"
 me_bithynia_7.b:0 "作为一群山民，他们的确比一般蛮族明智得多。"
 me_bithynia_70.a:0 "如果我们照顾好众神，他们就会照顾好我们"
 me_bithynia_70_desc:0 "虽然这片土地曾经被称为充满了奇怪的神灵，但我们已经决定将我们人民的思想从不受欢迎的宗教影响中净化出来。通过为我们的臣民树立一个好的榜样，我们可以说服他们放弃他们的旧神，拥抱我们的万神殿，因为我们的胜利肯定是我们神明的恩惠。"
 me_bithynia_70_title:0 "希腊的亚洲"
 me_bithynia_70_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_70$#!' $mission_completed_tooltip_2$"
 me_bithynia_7_desc_1:0 "马里安迪尼亚使团在数日友好谈判后，终于离开了卡尔珀城。我们敞开国库与心扉，给予了他们前所未有的款待。当他们被给予成为比提尼亚人民之友的机会时，他们做出了明智的选择，我们获得了一个新的盟友。"
 me_bithynia_7_desc_2:0 "马里安迪尼亚人在我们发出邀请后前来卡尔珀，但在几天以美酒与佳肴款待之后，很明显他们并无心讨论我们提出的问题。不，看来他们只是将此视为一个大快朵颐的借口，而你却因不得不为这些饕餮之徒买单而感到非常、非常恼火。他们什么承诺也没做，只留下鼓胀的肚皮……野蛮人。\n\n很好。我们将吞并他们的土地，不久之后就与他们清算。"
 me_bithynia_7_title:0 "马里安迪尼亚人的机动性"
 me_bithynia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_bithynia_8.a:0 "玛利安底尼亚将是我们的！"
 me_bithynia_8_desc:0 "外交的时间已经结束了，比提尼亚的军队聚集在一起，向马里安迪尼亚的山区进发。虽然必须发动战争从来都不是一件快乐的事，但我们进入这场战争时，知道诸神是站在我们这边的；我们的军队相信我们摆在他们面前的使命，没有人能够反对我们。"
 me_bithynia_8_title:0 "向着荣耀前进"
 me_bithynia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_bithynia_9.a:0 "同化[GetCulture('mariandynian').GetName]人"
 me_bithynia_9.b:0 "整合[GetCulture('mariandynian').GetName]人"
 me_bithynia_9_desc:0 "在我们成功的征服战争之后，我们面临着一个有趣的困境，我们的答案可以阻止未来的内乱，甚至成为内乱的原因。拐弯抹角是没有用的，因为我们的选择已经很清楚了；我们应该同化马里安迪尼亚人，还是完全融合他们？无论我们做出什么决定，有些人都会不高兴，但决定是必须要做的。你怎么说，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]？"
 me_bithynia_9_title:0 "比提尼亚人和马里安迪尼亚人"
 me_bithynia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $bithynia_missions_task_9$#!' $mission_completed_tooltip_2$"

 city_of_fish_oshima:0 "鱼之城"
 city_of_fish_oshima_desc:0 "虽然大多数城市难以生产足够之食物以供贸易，#E 大岛#!却以其闻名遐迩之渔夫而独擅胜场。纵然今已非昔日区区#Y 聚落#!，其仍可作#Y 城市#!之身而出口鱼鲜。"

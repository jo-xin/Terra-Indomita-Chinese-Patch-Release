 emishi_electric:0 "虾夷风雅"
 emishi_elite:0 "虾夷精英主义"
 emishi_equal:0 "虾夷平等"
 emishi_missions:0 "#E东北#!之患"
 emishi_missions_BUTTON_TOOLTIP:0 "神威将引领[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]走向胜利！"
 emishi_missions_CRITERIA_DESCRIPTION:0 "当[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]统一了#E 东北#!地区的[GetCulture('dewa').GetCultureGroup.GetName|Y]各部之后，此使命即告完成。"
 emishi_missions_DESCRIPTION:0 "#E本州#!的[GetCulture('dewa').GetCultureGroup.GetName|Y]已被完全驱逐至#E本州#!北部的#E东北#!地区。在已然褪色的记忆中，[GetCulture('dewa').GetCultureGroup.GetName|Y]曾遍布于今日所谓#E倭#!的全境。\n\n自#Y弥生#!入侵#E倭#!以来，#E弥生时代#!便主宰了这座孤岛。#Y绳文#!人正步入所谓#E续绳文时代#!——这是一个将见证最后残余的#Y绳文#!文化被崛起的#Y弥生#!文化所吞没，或向北迁徙至他们称为#E虾夷岛#!之地的时代。"
 emishi_missions_task_1:0 "游击之乐"
 emishi_missions_task_10:0 "虾夷一统"
 emishi_missions_task_10_DESC:0 "#E虾夷#!一词日后将统称#T本州#!岛上最后的#E绳文#!文化族群，包括#Y出羽#!、#Y砂泽#!及#Y白河#!之民。一旦统一，一个伟大的#E泛虾夷#!部落将傲然屹立，抵御任何#E弥生#!或其他胆敢侵犯我等家园之敌。"
 emishi_missions_task_11:0 "殊异分歧"
 emishi_missions_task_11_DESC:0 "正是我等[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]统一了#T本州#!的#E绳文#!诸部！不幸的是，与邻近的#E弥生#!不同，#E绳文#!各部落彼此之间的关系远为疏远。在我三部真正融为一体之前，还需付出格外的努力。"
 emishi_missions_task_11_tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|E]治国才能至少#Y 60%#!。"
 emishi_missions_task_12:0 "[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]精英"
 emishi_missions_task_12_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]是我等的主要文化。任何其他#E绳文#!文化之于我们，其疏远程度不亚于#E弥生#!！我们应当建立对所有其他#E绳文#!族群的至高地位，并以此为基础缔造我全新的#Y虾夷#!文化！\n\n#E这将影响哪些#Y人口#!被转化为#Y虾夷#!文化。#!"
 emishi_missions_task_13:0 "#E绳文#!团结则强"
 emishi_missions_task_13_DESC:0 "我三部之民有一共同之处：我们的土地皆遭#E弥生#!所侵夺。通过促进文化统一，我等将以一个包容万象的#Y虾夷#!文化重获新生！\n\n#E这将影响哪些#Y人口#!被转化为#Y虾夷#!文化。#!"
 emishi_missions_task_14:0 "虾夷文化兴起"
 emishi_missions_task_14_DESC:0 "无论是在诸部之上建立精英阶层，还是在彼此之间建立相互理解，我等的努力终将有所回报。一个新兴的#Y虾夷#!文化将被采纳。随着时代推移，这一文化亦将发展出超越其原初形态的伟大特质。"
 emishi_missions_task_15:0 "修弥生之好"
 emishi_missions_task_15_DESC:0 "#Y弥生#!是我们的敌人，其敌意不亚于与之竞争的#Y绳文#!诸部。尽管他们比我们远为集权，但如今我们已凌驾于他们之上，可以充分利用这一关系。\n\n这将为#Y弥生化#!增加#G 1点#!。"
 emishi_missions_task_16:0 "断弥生之交"
 emishi_missions_task_16_DESC:0 "#Y弥生#!是我等在#E倭#!地的主要敌人。我们必须处决其首领，代之以#Y绳文#!人。日后我们还可将此附庸吞并。\n\n这将为#Y弥生化#!减去#G 1点#!。"
 emishi_missions_task_1_DESC:0 "#E出羽#!人在与之接壤的#E弥生#!人眼中臭名昭著。他们擅长#Y游击战术#!，其手段与#E弥生#!所遭遇的一切截然不同。若要在#E弥生#!文化永无止境的扩张中求存，我们必须善用这一看家本领。"
 emishi_missions_task_2:0 "稻作奥秘"
 emishi_missions_task_2_DESC:0 "#Y稻作#!通常与#E弥生#!联系在一起……但有一支精明的#E绳文#!人例外——那便是#E砂泽#!。#E砂泽#!早在公元前340年便已采纳了#E弥生#!标志性的#Y稻作#!技术！#Y稻作#!的力量曾是#E弥生#!最终成功而#E绳文#!最终衰落的重要因素。我等将把#E弥生#!人最强大的工具转用于对付他们自己。\n\n这将为#Y弥生化#!增加#G 1点#!。"
 emishi_missions_task_3:0 "昼为商贾，夜为移民"
 emishi_missions_task_3_DESC:0 "#E白河#!人通过向北迁徙至#T北海道#!来逃避#E弥生#!文化日益扩张的浪潮。与此同时，他们专注于与北方#E绳文#!亲族进行贸易。自然而然地，这一贸易动力只会进一步将他们沿海岸线向北吸引，直至#T北海道#!。"
 emishi_missions_task_4:0 "东北之患"
 emishi_missions_task_4_DESC:0 "#T东北#!指的是#T本州#!北部我邦所在的区域。它涵盖了#E倭#!地上残存的大多数#E绳文#!部落。然而，现状远非一成不变，我们面临着诸多威胁。让我们来一一应对。"
 emishi_missions_task_5:0 "绳文盛会"
 emishi_missions_task_5_DESC:0 "#T东北#!各地的#E绳文#!部落与族群彼此迥异，然而，少数有识之士萌生了统一他们的想法。如此一来，#T东北#!的#E绳文#!各部之间将不再有相互仇杀。"
 emishi_missions_task_6:0 "邪恶邻邦"
 emishi_missions_task_6_DESC:0 "#E弥生#!业已在#T本州#!大部分地区取代了#E绳文#!。我们必须将其击退，将#T东北#!据为己有，否则#E弥生#!的推进将更加深入。"
 emishi_missions_task_7:0 "沿海走廊"
 emishi_missions_task_7_DESC:0 "#Y出羽#!人是世居此地的原始#E绳文#!族群与来自#T本州#!腹地的#E绳文#!人之混合。是时候为我自己夺回海岸了。"
 emishi_missions_task_8:0 "北海道第二家园"
 emishi_missions_task_8_DESC:0 "#Y砂泽#!人被逼至[GetProvince('(int32)9328').GetArea.GetRegion.GetName|Y]主岛的最边缘。因此，与#T北海道#!的#Y虾夷#!绳文人的贸易非常频繁。是时候在#Y虾夷#!之地建立一所避暑别业，并将其征服为我所有了。"
 emishi_missions_task_9:0 "空旷东方"
 emishi_missions_task_9_DESC:0 "#E绳文#!世界较开化地区的许多居民或许将#T本州#!东部视为一片空旷之地。但作为#Y白河#!人，我们对此再清楚不过。我们的同胞世代以先祖之道在这片土地上繁衍生息，我们可以轻易将这片「空旷」之地据为己有，建立一个伟大的#Y白河#!部落。"
 emishi_name:0 "虾夷"
 emishi_tactics:0 "游击战术"
 empower_women_tt:0 "我们的#E大祭司#!和#E智者#!将各自获得#G 5#!@religious_icon!。\n我们的#E仲裁官#!和#E大长老#!将各自获得#G 5#!@oratory_icon!。"
 esan_mixed_culture:0 "#E #Y Esan#!#!已#G 整合#!#Y Sunazawa#!文化。"
 expert_pottery:0 "陶器大师"
 ezo_adj:0 "虾夷"
 ezo_amber_demand:0 "虾夷琥珀之需"
 ezo_ebetsu_blue:0 "虾夷岛之水"
 ezo_esan_orange:0 "北海道落日"
 ezo_investments:0 "虾夷-铃谷互利"
 ezo_kitami_green:0 "虾夷之森"
 ezo_missions:0 "#E北海道#!之巅"
 ezo_missions_BUTTON_TOOLTIP:0 "#E虾夷#!将如旭岳崛起！"
 ezo_missions_CRITERIA_DESCRIPTION:0 "当[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]在同一面伟大旗帜下统一之后，此使命即告完成。"
 ezo_missions_DESCRIPTION:0 "[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]人分为三个氏族：#E惠山#!、#E江别#!和#E北见#!。在#E绳文时代#!，这些部落构成了诸多[GetCulture('dewa').GetCultureGroup.GetName|Y]文化圈之一，他们共享着许多文化特征，远非仅仅同为[GetCulture('dewa').GetCultureGroup.GetName|Y]那么简单。\n\n到#E公元前三至七世纪#!的#E续绳文时代#!末期，#E北海道#!的居民将作为最后的[GetCulture('dewa').GetCultureGroup.GetName|Y]留存于世，最终在十二世纪与#Y库页#!人融合，形成了今日我们所知的#Y阿伊努#!文化。"
 ezo_missions_task_1:0 "北海道地平线"
 ezo_missions_task_10:0 "渡岛浅水堡"
 ezo_missions_task_10_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]部落以其「#E箱式堡垒#!」——即浅壕堡垒——而闻名。与#E本州#![GetCulture('dewa').GetCultureGroup.GetName|Y]及[GetCulture('wa').GetCultureGroup.GetName|Y]的贸易伴随着该地区频繁的小规模冲突与动荡，这使得这些#E箱式堡垒#!成为必要，以保护领土完整及贸易利润。"
 ezo_missions_task_11:0 "石狩动物谐趣"
 ezo_missions_task_11_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]是#E幽默河#!的所在地——此河因其浑浊而得名——同时也是[SCOPE.GetRootScope.GetCountry.GetName|E]人以动物视角叙述的第一人称故事的故乡。这背后有着宗教的驱动，因为#E北海道#!这一地区的信仰深受#E库页#!人的#Y伊兹克#!信仰之影响。"
 ezo_missions_task_12:0 "鄂霍次克扇贝养殖"
 ezo_missions_task_12_DESC:0 "作为扇贝养殖的发源地，[SCOPE.GetRootScope.GetCountry.GetName|E]部落坐落于山海之间的绝佳位置，既可凭借扇贝养殖获取丰厚利润，亦能在渔业市场中全面成功。"
 ezo_missions_task_13:0 "北境诸神"
 ezo_missions_task_13_DESC:0 "在北方，我们亲密的贸易伙伴——#E铃谷#!人——信奉他们的#Y伊兹克#!信仰。虽然该信仰的许多方面与我们的#Y富士#!信仰有所不同，但其中对动物的崇拜尤为吸引我们。或许我们应当考虑采纳一些#Y伊兹克#!传统。"
 ezo_missions_task_14:0 "南境诸神"
 ezo_missions_task_14_DESC:0 "在南方，[GetCulture('wa').GetCultureGroup.GetName|Y]居住之地，他们敬奉的诸多神祇与我等并无太大差别。或许我们的#E神威#!与他们的#E神祇#!并非如此迥异。我们或可考虑采纳一些#Y古道#!传统。"
 ezo_missions_task_15:0 "开化虾夷"
 ezo_missions_task_15_DESC:0 "在[SCOPE.GetRootScope.GetCountry.GetName|E]的领导下，[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]已统一于我等旗帜之下，达到了崭新的高度。尽管若欲使之真正成为一个#T黄金时代#!，我们仍有漫长的路要走，但我们应当珍视迄今所取得的巨大进步。[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]之岛——#E虾夷地#!——是所有[GetCulture('dewa').GetCultureGroup.GetName|Y]人民的希望灯塔。"
 ezo_missions_task_17:0 "阿伊努独统"
 ezo_missions_task_17_DESC:0 "#R若你看到这条文本，你要么是作弊者，要么是观察者，要么就是出了大问题。#!"
 ezo_missions_task_1_DESC:0 "我们#Y虾夷#!人或许安居于#E北海道#!岛上，然而，在我们的海岸之外蕴藏着新的机遇。我们应当投入一些资源，以评估我们在地平线之外施加影响的最佳途径。"
 ezo_missions_task_2:0 "三部落"
 ezo_missions_task_2_DESC:0 "#E北海道#!由三个#Y虾夷#!部落分据：即#E惠山#!部落、#E江别#!部落和#E北见#!部落。有一个梦想，便是将这三个部落统一起来——或以武力，或以外交。"
 ezo_missions_task_3:0 "渔猎精通"
 ezo_missions_task_3_DESC:0 "#E惠山#!的渔夫们技艺精湛。他们与大海本身搏斗，享用着种类繁多的鱼类。他们的渔获足以将#Y鱼获#!交易至南方的#E本州#!岛。"
 ezo_missions_task_4:0 "桦太石液"
 ezo_missions_task_4_DESC:0 "#E江别#!的商贾狡黠与魅力在[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]无人能及。对他们而言，利润尤为丰厚的是与#E库页#!部落——#E铃谷#!——之间进行的#Y琥珀#!贸易。"
 ezo_missions_task_5:0 "琥珀之艺"
 ezo_missions_task_5_DESC:0 "#E北见#!的珠宝匠心灵手巧、一丝不苟，独具匠心，能以从#E江别#!人处购得的#Y琥珀#!打造出最为精美的首饰。"
 ezo_missions_task_6:0 "北海道家园"
 ezo_missions_task_6_DESC:0 "我们在#E北海道#!的家园已统一于我等旗帜之下。我们的#Y虾夷#!文化虽极具多样性，但如今既已统一，我们发现彼此之间的共通之处远多于以往的分歧。#E北海道#!#E绳文#!人的未来一片光明，我们将目光投向海湾之外，投向#E本州#!的海岸。"
 ezo_missions_task_7:0 "砂泽同胞"
 ezo_missions_task_7_DESC:0 "#E惠山#!部落从来都不是一个纯粹#Y虾夷#!的实体。虽然随着时间的推移，#E北海道#!内部的贸易以及由此产生的文化交流为我们带来了共同的身份认同，但#E惠山#!人与我们的距离要远得多。当其他#Y虾夷#!人与#E铃谷#!贸易时，#E惠山#!人独自捕鱼，将渔获售予#E东北#!之民。#E惠山#!的身份本身即是#Y砂泽#!与#Y虾夷#!文化的混合体，因此，我们应当正式接纳#Y砂泽#!文化为平等之民，并征服我们同胞的土地，建立一个混合的民族国家。"
 ezo_missions_task_8:0 "铃谷同胞"
 ezo_missions_task_8_DESC:0 "尽管#E库页#!的#Y铃谷#!人是一个独特的民族，但他们已与我们进行了数个世纪的贸易。我们通过贸易和文化交流紧密相连，这一关系我们可进一步加以培育，邀请他们成为我们的#G独家贸易殖民地#!。作为回报，他们将以优惠价格获得我方出口商品所带来的利益，从而能够迅速集权统一他们的国度。"
 ezo_missions_task_9:0 "众神游乐场"
 ezo_missions_task_9_DESC:0 "神威明塔拉——或如[GetCulture('wa').GetCultureGroup.GetName|Y]所称之阿叶志泷——是#E北海道#!全境的最高峰。我们视其为众神的游乐场。如今我们已据有#E北海道#!所有沿海之地，我们应当与那些继续侵扰我土地的山间之民沟通，让他们和平定居于我疆土之内，而非任由他们劫掠不断。"
 ezo_name:0 "虾夷地"
 feasts_of_victory:0 "胜利之宴"
 fish_surplus_ezo_mod:0 "江差渔夫"
 flame_pot:0 "火焰陶"
 foreign_amber_tt:0 "  #E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName|Y]#! 进口 #G 2#! 或更多的 #Y 琥珀#!。"
 form_nanto:0 "建立南岛"
 form_nanto_desc:0 "#E南西#!是#E弥生#!人对#E独柱#!人的称呼。大致可译为「西南之人」，如今我们已采纳了许多#E独柱#!传统，从而使#E南西#!成为一种融合文化。凭借我们自身的语言和传统，#E南岛#!之国崛起了！"
 form_ryukyu:0 "宣告琉球王国"
 form_ryukyu_desc:0 "尽管在历史上，#E琉球王国#!直至公元第一个千年才出现，但#E琉球#!的名称与文化却早已存在。通过建立自己作为#E中国#!与#E日本#!之间海域霸主的地位，#E阿摩美久#!之民已取得了对波涛的支配权。"
 formable_not_nanto_exists:0 "#Y南岛#!尚不存在。"
 fruits_of_labor:0 "采集能手"
 ghost_deity_tt:0 "解锁恐怖神祇#Y生灵#!。"
 ghost_in_tsushima:0 "鬼魂作祟"
 haunted_tt:0 "可能被鬼魂#R附身#!！"
 haunted_tt_2:0 "移除所有鬼魂#R附身#!。"
 hokkaido_claims_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]获得#Y北海道#!区域宣称。"
 hokkaido_opinion_tt:0 "任何其他[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]国家对我国的好感度超过#G 125#!。"
 hokkaido_unification_decision_tt:0 "解锁#E统合北海道#!决议。"
 honor_spirits_tt:0 "国内拥有至少#Y 7#!处#E圣地#!。"
 hostile_ambitions_ezo:0 "武力统一之野心"
 hostile_unification_of_hokkaido:0 "武力统合虾夷"
 hostile_unification_of_hokkaido_desc:0 "#E北海道#!岛必须统一于一面旗帜之下：我们的旗帜。唯有如此，我们才能傲然挺立于世间。#E惠山#!、#E江别#!和#E北见#!诸氏族将合而为一！\n\n若#E惠山#!、#E江别#!或#E北见#!不复存在，则我们将无法再采取此决策。"
 hub_of_amber:0 "琥珀匠人"
 ichor_of_igorot:0 "伊戈洛特之灵液"
 japan_culture_neighbor_tt:0 "国家文化为#Y弥生#!。"
 jeulmeun_adj:0 "栉文"
 jeulmeun_sub:0 "栉文"
 jeulmeun_tt:0 "创建#Y栉文#!国家为#Y藩属#!。"
 jomon_city_mod:0 "神威之佑。"
 jomon_duuchuu_missions:0 "琉球静水"
 jomon_duuchuu_missions_BUTTON_TOOLTIP:0 "扭转命运之潮。"
 jomon_duuchuu_missions_CRITERIA_DESCRIPTION:0 "当#E 独柱#!在其区域建立海上霸权之后，此使命即告完成。"
 jomon_duuchuu_missions_DESCRIPTION:0 "#E琉球#!部落的宁静诸岛安然无恙。他们以贝壳交换铁器，他们制作精美的陶罐，他们向自己的神灵——#Y神人#!——和祖先祈祷。数千年来，他们憩居在这些岛屿上，与#E倭#!本土的风云变幻隔绝开来。\n\n然而，若命运注定改道，他们的与世隔绝或许很快便将终结。与世隔绝的#E独柱#!及其珍贵的岛屿，将会面临怎样的命运？"
 jomon_duuchuu_missions_task_1:0 "风暴前夕"
 jomon_duuchuu_missions_task_10:0 "新安罗"
 jomon_duuchuu_missions_task_10_DESC:0 "#E穴纳吕#!岛位处绝佳位置，堪称完美的贸易殖民点。让我们开发此地，为建城做好准备。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 jomon_duuchuu_missions_task_11:0 "伊戈洛特之灵液"
 jomon_duuchuu_missions_task_11_DESC:0 "我们对#E伊戈罗特#!人几乎一无所知，只知道他们似乎与#E夷州#!人有所关联。无论如何，他们的岛屿对我日益壮大的王国而言似乎完美无瑕。我们绝对必须将其征服为己有，即使要付出鲜血的代价。\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 jomon_duuchuu_missions_task_12:0 "朱崖碧岸"
 jomon_duuchuu_missions_task_12_DESC:0 "#E珠崖#!的海岸相当遥远，但殖民此地将使我们在#E交阯#!地区获得一处立足之地。此外，该岛拥有#Y珍珠#!——这一珍贵资源。它们的美丽吸引了我们的目光，让我们尽快殖民#E珠崖#!吧！\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 jomon_duuchuu_missions_task_13:0 "前进殖民"
 jomon_duuchuu_missions_task_13_DESC:0 "#Y [GetProvince('(int32)9740').GetName]#!之民乃是我们的骨肉同胞，然而他们距大陆的#E熊袭#!人更近。宣称此地为我所有固然颇具侵略性，但我们对此岛确有正当主张。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 jomon_duuchuu_missions_task_14:0 "征服熊袭"
 jomon_duuchuu_missions_task_14_DESC:0 "#E熊袭#!是我们仅交往不久的贸易伙伴，却已对我们产生了巨大的影响。直接吞并他们只会使我们之间的关系更加复杂。我们也将被直接卷入#E倭#!主岛的战事之中。希望我们不必走得太远。\n\n\n\n\n\n\n\n\n\n@egypt_por2!"
 jomon_duuchuu_missions_task_15:0 "末罗事宜"
 jomon_duuchuu_missions_task_15_DESC:0 "#Y末罗#!的#E熊袭#!人对我们而言较#Y熊袭#!之地的更为陌生。他们更远，但都居于同一岛上，这使他们进入我们的势力范围。我们必须从舰船转进陆地，以征服整个#Y熊袭岛#!。\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 jomon_duuchuu_missions_task_16:0 "对马之鬼"
 jomon_duuchuu_missions_task_16_DESC:0 "关于#Y对马岛#!上来自该岛古老#E古道#!神祇的幽灵传闻开始浮现。据我们的#E由他#!所言，我们必须筹集资金修建一座神社以安抚这些神灵。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 jomon_duuchuu_missions_task_17:0 "威震耽罗"
 jomon_duuchuu_missions_task_17_DESC:0 "使用恐吓手段对我们来说并非禁忌。为了夺取战略要岛#E耽罗#!，我们将恐吓其民众。如果他们仍不屈服，我们将径直宣战，将其击溃，纳入版图。\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 jomon_duuchuu_missions_task_18:0 "隐岐换冲绳"
 jomon_duuchuu_missions_task_18_DESC:0 "#E隐岐#!岛的名字与我们#E冲绳#!岛——即#E内海#!——之名有着诙谐的相似之处。撇开这一细节不谈，该岛恰好位于#E日本海#!的中央，是投射力量于这片北方海域的绝佳据点。\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 jomon_duuchuu_missions_task_19:0 "佐藤开拓者"
 jomon_duuchuu_missions_task_19_DESC:0 "#E佐渡#!岛尤为野蛮……亟需一位新主人！我们永远是合适之选。其位置将有助于我们将力量投射至#E本州#!北部地区，那里居住着……不知为何令我们想起自己的人群。\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 jomon_duuchuu_missions_task_1_DESC:0 "#E独柱#!诸岛充满了和平的居民，他们依靠当地资源进行贸易与生存。他们与#E绳文#!世界的其余部分隔绝了数千年，也从未与#E弥生#!交战。因此，这是一个投资诸岛繁荣的大好时机。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 jomon_duuchuu_missions_task_2:0 "她卖海贝"
 jomon_duuchuu_missions_task_20:0 "所谓家族"
 jomon_duuchuu_missions_task_20_DESC:0 "被#E弥生#!之海隔开——甚至在此之前，还有数千年各自独特的发展——#E续绳文#!人如今已进入我们的视野。尽管与我们远方表亲的联系相当薄弱，但我们仍应尝试教化他们，将我们的方式传授给他们。\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 jomon_duuchuu_missions_task_21:0 "购长城"
 jomon_duuchuu_missions_task_21_DESC:0 "#E长城#!港口位于#E燕国#!人的领土上。尽管距我诸岛甚远，但我们与他们有着贸易往来的悠久历史。我们应该能卖出个好价钱！\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 jomon_duuchuu_missions_task_22:0 "海盗生涯适合我？"
 jomon_duuchuu_missions_task_22_DESC:0 "我们周围的海域向来充斥着#E海盗#!。随着我们军事重心的转变，我们应当考虑采纳#E海盗王国#!政体的可能性。\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 jomon_duuchuu_missions_task_23:0 "夺取龙州洞"
 jomon_duuchuu_missions_task_23_DESC:0 "#E龙珠洞#!港口将成为一个绝佳的军事和经济基地。它易守难攻，是一座岛屿，且恰好位于#E福尔摩沙#!岛与#E耽罗#!岛之间等距之处。事实上，我们应当直接夺取此港，即便引发战争也在所不惜。凭借我们庞大而令人生畏的海军，他们又如何能将其夺回？\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 jomon_duuchuu_missions_task_24:0 "由塔辩驳"
 jomon_duuchuu_missions_task_24_DESC:0 "#Y由他#!是#E神人#!宗教阶层的另一个主要派别。尽管#Y奴留#!通常更为重要，但#Y由他#!总能设法削弱他们的影响力。他们驳斥#Y奴留#!关于在外交上采取更积极新立场的建议。让我们听听他们有何话说。\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 jomon_duuchuu_missions_task_25:0 "八重山由塔提案"
 jomon_duuchuu_missions_task_25_DESC:0 "#Y由他#!阶层对我等治理#E夷州#!人的方式另有提案。让我们听听他们有何话说。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 jomon_duuchuu_missions_task_26:0 "南西之名"
 jomon_duuchuu_missions_task_26_DESC:0 "#E弥生#!似乎更偏爱以#E南西#!称呼我等。鉴于他们中许多人已归我统辖，境外的#E弥生#!如今也开始将我境内的#E熊袭#!人称为#E南西#!了。或许我们应当正式承认这一新兴文化？\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 jomon_duuchuu_missions_task_27:0 "手之道"
 jomon_duuchuu_missions_task_27_DESC:0 "#E空手道#!的原始形态被称为#E手#!，发源于#E冲绳#!。#E手#!究竟最早在何时形成已无从考证，但它很可能自#E琉球#!历史之初便以分散的形态存在着。\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 jomon_duuchuu_missions_task_2_DESC:0 "#E琉球#!人擅长制作#Y贝镯#!并将其售卖给#E弥生#!人，以换取#Y贱金属#!和#Y贵金属#!。\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 jomon_duuchuu_missions_task_3:0 "鱼之营生"
 jomon_duuchuu_missions_task_3_DESC:0 "作为海岛之民，#E琉球#!人必须善于采集#Y鱼获#!，充分利用其食物来源。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 jomon_duuchuu_missions_task_4:0 "人母"
 jomon_duuchuu_missions_task_4_DESC:0 "#E乌那利#!宗教在该地区诸信仰中独树一帜。有人甚至认为其社会曾为#E母系氏族#!。无论如何，女性显然在宗教事务中受到偏爱，因此我们应当委任足够的女性执掌权力。\n\n\n\n\n\n\n\n\n\n@tibet_mil13!"
 jomon_duuchuu_missions_task_5:0 "海上商贾"
 jomon_duuchuu_missions_task_5_DESC:0 "为促进贸易，我们应建立一支海军来相助！我们只需要#Y轻舟#!——毕竟，我们并不打算与任何人交战，不是吗？\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 jomon_duuchuu_missions_task_6:0 "贝币稻米尽美好"
 jomon_duuchuu_missions_task_6_DESC:0 "#E独柱#!人从#E弥生#!以外的渠道交易获取#Y货贝#!和#Y稻米#!。事实上，他们甚至发展出了自己有限的#E湿地稻作#!。更有证据表明，其贸易远达#E燕#!地。\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 jomon_duuchuu_missions_task_7:0 "奴鲁来讯"
 jomon_duuchuu_missions_task_7_DESC:0 "#Y奴留巫女#!是#Y神人#!阶层中最为重要的人物。她们历来为女性，充当着神域与人间的媒介。她会给我们带来何等消息？\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 jomon_duuchuu_missions_task_8:0 "水流向福尔摩沙"
 jomon_duuchuu_missions_task_8_DESC:0 "#E福尔摩沙海#!既是#E夷州#!人的家园，也是我#E南琉球#!诸岛之所在。我们与他们已有数百年的接触，其文化与信仰的诸多方面已影响了我南方诸岛。是时候与之更紧密地融为一体，直接控制#E福尔摩沙#!岛了。\n\n\n\n\n\n\n\n\n\n@china_mil2!"
 jomon_duuchuu_missions_task_9:0 "常驻平湖"
 jomon_duuchuu_missions_task_9_DESC:0 "#E平湖#!岛位处绝佳之地，堪称完美的贸易殖民点。让我们开发此地，为建城做好准备。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 jomon_honshu_missions:0 "绳文新时代"
 jomon_honshu_missions_BUTTON_TOOLTIP:0 "#E 绳文时代#!再度开启！"
 jomon_honshu_missions_CRITERIA_DESCRIPTION:0 "当[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]完成对[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]的全面支配之后，此使命即告完成。"
 jomon_honshu_missions_DESCRIPTION:0 "#E弥生时代#!如今必须在#E本州#!地区直接与#E续绳文时代#!抗衡。事实上，我们或许不该再称其为#E续绳文时代#!了，因为它如今已真正成为一个#E新绳文时代#!！从北方诸地，到如今几乎囊括[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]最大岛屿的全境。\n\n我们曾是支离破碎的部落与文化，被#Y弥生#!人步步逼退，但如今我们正踞有利之势，可不受挑战地支配[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]的其余部分。我们必须决定：当#E吸纳#!几分、#E拒斥#!几分，又当为高贵的#Y绳文#!之民收复多少疆土。"
 jomon_honshu_missions_task_1:0 "绳文二重性"
 jomon_honshu_missions_task_10:0 "稻米代价"
 jomon_honshu_missions_task_10_DESC:0 "#Y弥生#!人的#Y稻作#!技术正是他们得以迅速扩张疆域、遍布#E倭#!地的根本所在。我们自己也应当考虑#Y稻作#!。\n\n#R禁用#!使命任务#E劳动之果#!。"
 jomon_honshu_missions_task_11:0 "劳作果实"
 jomon_honshu_missions_task_11_DESC:0 "#Y绳文#!人历来为狩猎采集者，以采集#Y果实#!维持生计。这才是生活应有的方式。\n\n#R禁用#!使命任务#E稻米之价#!。"
 jomon_honshu_missions_task_12:0 "青铜勾玉"
 jomon_honshu_missions_task_12_DESC:0 "将传统的#Y绳文#!工艺与来自#E中国#!的令人赞叹的新金属相结合，我们便能以#Y贱金属#!铸造传统的#E勾玉#!。"
 jomon_honshu_missions_task_13:0 "不劳无获"
 jomon_honshu_missions_task_13_DESC:0 "尽管我们试图避免使用外来兵器，坚守自己的传统战法，但我们也采纳了#Y稻作#!。使用新式金属制作工具固然诱人，但我们决不允许。相反，我们将更加努力地为我们的谷物而劳作！"
 jomon_honshu_missions_task_14:0 "青铜鱼钩"
 jomon_honshu_missions_task_14_DESC:0 "#Y鱼获#!将成为维系我们生计的新途径！我们本就有着作为熟练渔民的悠久历史，如今既然对#Y贱金属#!有了更大的需求，便可借此提高国内产出，使我们的人民即使拒斥#Y稻作#!也能获得充足的食粮。"
 jomon_honshu_missions_task_15:0 "赤狐奇谭"
 jomon_honshu_missions_task_15_DESC:0 "#Y稻荷#!神在#Y弥生#!之地颇为盛行。通常我们不会在意，但许多#Y绳文#!人觉得此神也同样与我们文化颇为契合。"
 jomon_honshu_missions_task_16:0 "心之炉火"
 jomon_honshu_missions_task_16_DESC:0 "#Y神威富士#!之道永驻我心。她在灶火中的神性已化为我们心中的神性。"
 jomon_honshu_missions_task_17:0 "北狐稻荷神社"
 jomon_honshu_missions_task_17_DESC:0 "#Y弥生#!之神#Y稻荷#!与#Y绳文#!之神#Y知努普#!之间的融合催生了一项新传统——兴建#Y知努普稻荷#!神社。"
 jomon_honshu_missions_task_18:0 "名器火焰陶"
 jomon_honshu_missions_task_18_DESC:0 "古时，我们曾制作过远为更多的#Y火焰陶器#!。它们惊艳夺目，我们应当重拾制作这些复杂陶器的技艺。"
 jomon_honshu_missions_task_19:0 "铜铎狂热"
 jomon_honshu_missions_task_19_DESC:0 "#Y弥生#!人有一项非常令人赞叹的发明——#Y铜铎#!。我们想要亲自动手尝试铸造它们。或许#Y弥生#!人并不如我们曾经想象的那般恶劣？"
 jomon_honshu_missions_task_1_DESC:0 "随着我们成长为#E倭#!地的一大强权，我们已有些迷失了自我。在前进的道路上，我们必须决定接纳多少#Y弥生#!的影响。"
 jomon_honshu_missions_task_2:0 "敬奉神灵"
 jomon_honshu_missions_task_20:0 "土偶量产不辍"
 jomon_honshu_missions_task_20_DESC:0 "在坚守传统的过程中，我们已开始创作更多传统的#Y绳文#!艺术作品。#Y土偶#!便是其中之一。这些小型人偶对我们而言极为独特。"
 jomon_honshu_missions_task_21:0 "四岛物语"
 jomon_honshu_missions_task_21_DESC:0 "#E倭#!四岛由#E北海道#!、#E本州#!、#E伊予#!和#E熊袭#!组成。让我们逐一评估诸岛，探讨如何在各岛推进我们的利益。"
 jomon_honshu_missions_task_22:0 "北海道之美"
 jomon_honshu_missions_task_22_DESC:0 "我们亏欠#E北海道#!岛良多。即便一切皆失，它也将成为躲避#Y弥生#!的最后避难所。我们应当开发此地，以防有朝一日再度被逼至如此境地。"
 jomon_honshu_missions_task_23:0 "本州和谐"
 jomon_honshu_missions_task_23_DESC:0 "既然#E本州#!大部已在治下，我们必须继续向前推进。#E本州#!将承载我国绝大多数人口。"
 jomon_honshu_missions_task_24:0 "和谐之都"
 jomon_honshu_missions_task_24_DESC:0 "最先进的#Y弥生#!邦国之都——#E大和#!，在其语言中意为「和谐」。我们的语言中亦有此概念。我们应将该地更名为#E乌波波伊#!。"
 jomon_honshu_missions_task_25:0 "西向纪伊"
 jomon_honshu_missions_task_25_DESC:0 "#E纪伊#!地区是#E本州#!之最远端。在几乎被完全逐出#E本州#!之后，攻克此地将是最终的成就。"
 jomon_honshu_missions_task_26:0 "四国海岸"
 jomon_honshu_missions_task_26_DESC:0 "#E伊予#!——亦称#E四国#!——是四大主岛中最小的一个。尽管如此，此地盛产绝佳的#Y贸易货物#!，无疑将是一处利于开发的好地方。"
 jomon_honshu_missions_task_27:0 "九州若合"
 jomon_honshu_missions_task_27_DESC:0 "#E九州#!岛，即#E熊袭#!之地，以与海外诸国如#E中国#!、#E高丽#!及#E福尔摩沙#!的贸易而闻名。夺取这些西部贸易枢纽，将为我#Y绳文#!之邦带来前所未有的繁荣。"
 jomon_honshu_missions_task_28:0 "远方的琉球"
 jomon_honshu_missions_task_28_DESC:0 "有趣的是，#E琉球#!诸岛的#Y独柱#!人语言与我等相通，他们信奉一种被曲解的#Y神威富士#!信仰。若欲自称为#Y绳文#!，我们必须将他们纳入我们的势力范围。"
 jomon_honshu_missions_task_29:0 "栉文殖民地"
 jomon_honshu_missions_task_29_DESC:0 "很久以前，曾存在另一支民族。我们无从分辨他们究竟是我们的亲族，还是仅仅深受我们的影响。无论如何，应以此为由在#E高丽#!建立一处殖民地，作为入侵的借口。"
 jomon_honshu_missions_task_2_DESC:0 "尊崇过往的神灵、众神与祖先至关重要，以免反受其诅咒。"
 jomon_honshu_missions_task_3:0 "锅碗瓢盆"
 jomon_honshu_missions_task_3_DESC:0 "#Y绳文#!与#Y弥生#!皆有各自引人入胜的陶器风格。无论未来作何抉择，#Y陶器#!的供应必须增加。"
 jomon_honshu_missions_task_4:0 "吾为剑骨"
 jomon_honshu_missions_task_4_DESC:0 "随着新材料涌入我国，确保我们有理由使用剑、矛及其他武器将是明智之举。"
 jomon_honshu_missions_task_5:0 "胜利盛宴"
 jomon_honshu_missions_task_5_DESC:0 "值我统一的#Y绳文#!邦国建立之际，是时候为我们的成就举行盛大庆典了。"
 jomon_honshu_missions_task_6:0 "光滑陶器"
 jomon_honshu_missions_task_6_DESC:0 "#Y弥生#!光滑的陶器风格与我等迥异。或许我们应当考虑将其采纳为己用。\n\n#R禁用#!使命任务#E绳纹陶器#!。"
 jomon_honshu_missions_task_7:0 "绳纹陶"
 jomon_honshu_missions_task_7_DESC:0 "我传统的#Y绳文#!陶器风格别致、美观且实用。这里无需那些索然无味的#Y弥生#!陶罐。\n\n#R禁用#!使命任务#E光滑陶器#!。"
 jomon_honshu_missions_task_8:0 "青铜时代"
 jomon_honshu_missions_task_8_DESC:0 "#E日本青铜时代#!是由#E弥生#!与#E中国#!之间的贸易所催生的。我们必须采用这些新型金属，方能在此日新月异的世界中不落人后。\n\n#R禁用#!使命任务#E新新石器时代#!。"
 jomon_honshu_missions_task_9:0 "新新石器时代"
 jomon_honshu_missions_task_9_DESC:0 "让我们摒弃现代，回归#Y绳文#!吧！#Y绳文#!在#E新石器时代#!最为鼎盛，我们绝不放弃这一点。我们将开创一个崭新的#E新石器时代#!。\n\n#R禁用#!使命任务#E青铜时代#!。"
 jomon_jamboree:0 "绳文盛会"
 jomonify_jomon:0 "终结倭之争：文化支配"
 jomonify_jomon_desc:0 "争夺#E倭#!地霸权的斗争并未磨灭我们的文化认同。对#Y弥生#!之道的憎恨使我们保持了独特的身份——事实上，这是一种与#Y弥生#!针锋相对的身份。如今，我们以一支#Y绳文#!部落联盟的姿态直面天下！"
 kamuy_mintara:0 "神威-御岳"
 kamuy_mintara_2_tt:0 "神祇#Y神威-御岳#!已#G解锁#!。"
 kamuy_mintara_prov:0 "神威-御岳"
 kamuy_mintara_tt:0 "#Y不可逾越#!更名为#Y神威-御岳#!。"
 kii_to_the_west:0 "西向纪伊"
 kodo_syncretism:0 "古道教融合"
 kumaso_decision_tt:0 "决定是否承认#Y南西#!文化。"
 local_amber_tt:0 "  #E [SCOPE.GetRootScope.GetCountry.GetName|Y]#! 在任何省份产出 #G 1#! 或更多的 #Y 琥珀#!。"
 me_duuchuu_1.a:0 "大概无事。"
 me_duuchuu_10.a:0 "安罗将成宏伟之城！"
 me_duuchuu_10.b:0 "存钱备他用。"
 me_duuchuu_10.c:0 "不如设为自治殖民地。"
 me_duuchuu_10_desc:0 "#E 安乐#!岛地处对#E 南岛#!施加影响的绝佳位置。在此建造一座城市以掌控#E 南海#!的贸易，堪称理想之地。从某种意义上说，它为我们开辟了一条全新的影响路线。"
 me_duuchuu_10_title:0 "$jomon_duuchuu_missions_task_10$"
 me_duuchuu_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_duuchuu_11.a:0 "诸岛全境皆归我有。"
 me_duuchuu_11_desc:0 "首都之中有人加以非议。我们已远远超出我们那些小小岛屿的边界。然而，绝大多数人视我等成就为功绩。随着征服#E 伊戈罗特#!人的土地，我们已证明了自己具备从遥远之地实施统治和作战的能力。#E 伊戈罗特#!人的鲜血，便是我等能力的见证。"
 me_duuchuu_11_title:0 "$jomon_duuchuu_missions_task_11$"
 me_duuchuu_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_duuchuu_12.a:0 "那珍珠白光令我目眩神迷……"
 me_duuchuu_12_desc:0 "远离故土之处，坐落着#E 朱崖#!岛。在一处岸边，我们瞥见一抹天青色的光芒……那是水面反射出的我们平生见过最美丽的珍珠。随着我们在岛上建立殖民地，我们应尽快殖民其余各地，以便利用珍珠贸易中的潜在利润。"
 me_duuchuu_12_title:0 "$jomon_duuchuu_missions_task_12$"
 me_duuchuu_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_duuchuu_13.a:0 "妙极！"
 me_duuchuu_13.b:0 "长远看必有所值。"
 me_duuchuu_130_desc:0 "不幸的是，#E 弥生#!人先我们一步占据了#E 大隅#!岛……然而，由于我们长期以来一直是其稳定的贸易伙伴，#E 大隅#!的所有者愿意以一定代价割让该岛！我们已打造了一条特别漂亮的海贝手链，对#E 弥生#!人价值不菲。作为交换，我们将获得此岛。"
 me_duuchuu_13_desc:0 "我们在#E 奄美#!诸岛的庞大存在，吸引了#E 大隅#!岛上的土著#E 土中#!人。他们向我们表达了加入我们联盟的意愿，愿成为#E 琉球#!本土的一部分！"
 me_duuchuu_13_title:0 "$jomon_duuchuu_missions_task_13$"
 me_duuchuu_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_duuchuu_14.a:0 "前景光明。"
 me_duuchuu_14_desc:0 "#E 熊袭#!地区之民，我们早已知悉。与之通商多年，如今我们已统治了他们。这改变带来一种奇异却令人沉醉的感受。这是权力、影响与伟大的初尝。我们已在#E 倭#!建立了立足点，唯#E 奄美国主#!知晓这会将我们带往何方。"
 me_duuchuu_14_title:0 "$jomon_duuchuu_missions_task_14$"
 me_duuchuu_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_duuchuu_15.a:0 "必须立即处理此诅咒。"
 me_duuchuu_15_desc:0 "#E 松浦#!地区聚居着更多的#E 熊袭#!人。#E 熊袭#!全岛如今尽在我方掌控之下。#E 琉球#!之民，威震四海，无与伦比。凭#E 新里主#!之恩典，我们将继续精进……然而，我们从#E 由他#!那里收到了一则骇人听闻的禀报。他们告知我们有#E 对马岛的幽灵#!。此事完全出乎意料，若不除此幽灵，我们或将遭受诅咒！"
 me_duuchuu_15_title:0 "$jomon_duuchuu_missions_task_15$"
 me_duuchuu_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_duuchuu_16.a:0 "终于！好可怕……"
 me_duuchuu_16_desc:0 "怀着恐惧，一座供奉#E 生灵#!的神社已在#E 对马#!建成。顷刻间，笼罩在#E 冲绳#!上空的诡异被纠缠感便烟消云散。#E 由他#!所言非虚，诅咒已解。"
 me_duuchuu_16_title:0 "$jomon_duuchuu_missions_task_16$"
 me_duuchuu_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_duuchuu_17.a:0 "哈，且看彼哀嚎！"
 me_duuchuu_170.a:0 "无能为力。"
 me_duuchuu_170.b:0 "谅彼不至真宣战。"
 me_duuchuu_170_desc:0 "#E 琉球#!人已经威胁到#E 耽罗#!的安全！他们派来了一位名为#E '由他'#!的使节，以令人胆寒的方式宣读了我们即将灭亡的预言……我们该怎么办？！"
 me_duuchuu_171.a:0 "必须宣战！"
 me_duuchuu_171.b:0 "日后再来……"
 me_duuchuu_171_desc:0 "尽管他们似乎被我们的#E 由他#!吓住，却依然拒绝交出#E 耽罗#!。我们必须决定下一步行动。我们是兑现威胁，还是退缩以待时日再来？"
 me_duuchuu_17_desc:0 "#E 耽罗#!之民或许愿意臣服于我。我们只需令其胆寒！我们将派遣一位使节，携一名#E 由他#!女子同往。她将宣读一条启示，昭示其若不归顺将遭灭顶之灾。"
 me_duuchuu_17_title:0 "$jomon_duuchuu_missions_task_17$"
 me_duuchuu_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_duuchuu_18.a:0 "设为城市！"
 me_duuchuu_18.b:0 "好，就设为港口。"
 me_duuchuu_18_desc:0 "#E 隐岐#!岛同样位于#E 日本海#!的中央，这使其成为在这片北方海域投射力量的理想据点。若我们愿意，亦可选择将其改建为城市。"
 me_duuchuu_18_title:0 "$jomon_duuchuu_missions_task_18$"
 me_duuchuu_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_duuchuu_19.a:0 "绝佳中转站！"
 me_duuchuu_19.b:0 "绝佳中转站！"
 me_duuchuu_19.c:0 "算了。"
 me_duuchuu_190_desc:0 "不幸的是，#E 佐渡#!岛已为土著所有……然而，我们准备支付一笔巨款以换取此岛。本地人定会接受。"
 me_duuchuu_19_desc:0 "借助从#E 对马#!岛日益增长的影响力，我们得以派遣殖民者远至#E 佐渡#!。我们以向#E 日本海#!扩张之名宣示对此岛的主权。这无疑将使我们的影响力延伸至我们渴望达到的最远之处……至少在北方如此！"
 me_duuchuu_19_title:0 "$jomon_duuchuu_missions_task_19$"
 me_duuchuu_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_duuchuu_1_desc:0 "温润的海风轻柔拂过#E 酋长#![GetCountry('OK1').GetRuler.GetPraenomen|E]的面庞。与#E 土中群岛#!的所有居民一样，他们享受着相对的和平与繁荣。他们信奉独特的#E 乌那里#!仪式，依靠海岛经济维生，且大体上仅与本土#E 倭#!的#E 弥生#!人维持和平往来。\n\n然而，似乎有些不对劲。或许毫无端由，但风中是否带有一丝以往不曾有的寒意？这令#E 酋长[GetCountry('OK1').GetRuler.GetPraenomen]#!想起了台风，只是此次有所不同……更为微妙。"
 me_duuchuu_1_title:0 "$jomon_duuchuu_missions_task_1$"
 me_duuchuu_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_duuchuu_2.a:0 "真想据为己有！"
 me_duuchuu_20.a:0 "令其皈依#E宇那利#!。"
 me_duuchuu_20.b:0 "令其为藩属。"
 me_duuchuu_20_desc:0 "北方的远亲#E 后绳文#!人，迄今已与我们分离了数千年。如今我们以一项他们无法误解的提议重聚。他们将获赠文明之礼，作为交换，须接受我们的神明……或许还将成为我方的臣属。"
 me_duuchuu_20_title:0 "$jomon_duuchuu_missions_task_20$"
 me_duuchuu_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_duuchuu_21.a:0 "多么划算！"
 me_duuchuu_21_desc:0 "购买#E 燕#!国港口#E 长城#!的交易已然达成！虽然它不过是一处聚落，但我们有机会将其打造为重要城市与贸易中心。我们之所以能以如此低价成交，全凭多年来与#E 燕#!人通商之故。"
 me_duuchuu_21_title:0 "$jomon_duuchuu_missions_task_21$"
 me_duuchuu_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_duuchuu_22.a:0 "哟嗬！"
 me_duuchuu_22.b:0 "或应改行共和。"
 me_duuchuu_22_desc:0 "海洋之道，残酷无情。我们必须适应并克服所遭遇的重重艰难。为此，施行#E 海盗#!统治的前提颇为诱人。它将我们新生的影响大海之渴望与重商之传统巧妙融合。当然，海盗不会是最佳盟友，因此我们应当审慎权衡。"
 me_duuchuu_22_title:0 "$jomon_duuchuu_missions_task_22$"
 me_duuchuu_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_duuchuu_23.a:0 "汝物即我物。"
 me_duuchuu_230.a:0 "无能为力……"
 me_duuchuu_230.b:0 "此即宣战！"
 me_duuchuu_230_desc:0 "那些狂妄的#E 琉球#!海盗！他们从我们手中窃取了#E 永住洞#!港口。他们以至少#E 三十#!艘舰船的水师出现，当地人立即投降。我们又能如何？"
 me_duuchuu_231.a:0 "此方为征服之权。"
 me_duuchuu_231_desc:0 "#E 华夏#!人已经退缩，他们对我等威名畏惧万分，无力夺回如今理所当然属于我们之地！万岁！"
 me_duuchuu_23_desc:0 "#E 永住洞#!港及其所在之岛，已被我声势浩大的水师及其令人生畏的将领所夺取。#E 华夏#!人视此夺取为侮辱，但我们倒要看看他们是否真敢有所行动。我们应于未来数月内获知其意图。我们必须做好战争准备。"
 me_duuchuu_23_title:0 "$jomon_duuchuu_missions_task_23$"
 me_duuchuu_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_duuchuu_24.a:0 "令人信服。"
 me_duuchuu_24.b:0 "只听奴鲁之言。"
 me_duuchuu_24_desc:0 "#E 由他#!灵媒向我们提出了一项方案。她们对神明话语的阐释与#E 祝女#!不同。她们说，影响无需如此直接，我们可以通过和平方式做到，而且我们也不能忘记照顾好我们自己的岛屿。"
 me_duuchuu_24_title:0 "$jomon_duuchuu_missions_task_24$"
 me_duuchuu_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_duuchuu_25.a:0 "建立八重山。"
 me_duuchuu_25.b:0 "建立八重山，但保留[GetProvince('(int32)10831').GetArea.GetName|E]区域。"
 me_duuchuu_25.c:0 "直辖此岛。"
 me_duuchuu_25_desc:0 "来自#E 八重山#!岛的#E 由他#!灵媒向我们提出了一项有趣的方案。她们希望建立一个独立的融合政权，吸纳更多#E 八重山#!特有的传统。虽然这可能导致#E 土中#!与#E 八重山#!之间产生一定的文化分歧，但这将有助于我们治理新获取的#E 福尔摩沙#!领土。\n\n无论我们作何选择，我们都将保留#E 平湖#!与#E 安乐#!港口。那么，我们是否应考虑#E 由他#!的提议，在#E 福尔摩沙#!建立一个藩属国？"
 me_duuchuu_25_title:0 "$jomon_duuchuu_missions_task_25$"
 me_duuchuu_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_duuchuu_26.a:0 "域内承认此新文化。"
 me_duuchuu_26.b:0 "全境采用#E南西#!文化！"
 me_duuchuu_26.c:0 "建立#E南西藩属#!国！"
 me_duuchuu_26.d:0 "维持现状。"
 me_duuchuu_26_desc:0 "#E 弥生#!人对我们#E 土中#!人的称呼是#E 南西#!。由于我们统辖了许多#E 熊袭#!人，我境外的#E 弥生#!人已开始将其境内的同胞改称为#E 南西#!人。我们若愿意，可以选择承认这一新文化。或许……我们甚至可以自已采用这一称谓？"
 me_duuchuu_26_title:0 "$jomon_duuchuu_missions_task_26$"
 me_duuchuu_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_duuchuu_27.a:0 "嘿呀！"
 me_duuchuu_27_desc:0 "在我们的语言中，#E 手#!之道即是手之途。许多人于身心灵魂各方面刻苦修炼。是时候将这一武术形式正式化，并用以训练我们自己的士兵了。由此带来的#E 纪律#!必将回报丰厚。"
 me_duuchuu_27_title:0 "$jomon_duuchuu_missions_task_27$"
 me_duuchuu_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_duuchuu_2_desc:0 "我们这些爱好和平的#E 土中#!人，最钟爱的莫过于海贝手链与饰品。这培养了我们设计精美纹样的专长。#E 弥生#!人与#E 华夏#!人似乎也同样喜爱这些物品。我们以手链换取了他们大量的铁。\n\n特别值得一提的是，一位来自#E 奄美#!的匠人制作了一条融合铁与海贝的手链。其璀璨之美，值得进献给神灵。"
 me_duuchuu_2_title:0 "$jomon_duuchuu_missions_task_2$"
 me_duuchuu_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_duuchuu_3.a:0 "此处无鱼。"
 me_duuchuu_3_desc:0 "讽刺的是，以打鱼为生并没有什么可疑之处！对于一个岛民的生存而言，精通捕鱼之道至关重要。对#E 宫古#!而言尤其如此。#E 宫古#!岛民曾数次与#E 北琉球#!岛链隔离，这迫使他们变得格外擅长生存。"
 me_duuchuu_3_title:0 "$jomon_duuchuu_missions_task_3$"
 me_duuchuu_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_duuchuu_4.a:0 "感谢奄美赐女子。"
 me_duuchuu_4_desc:0 "在#E 琉球#!社会中，女性构成了一个强大宗教阶层的主体，这一阶层被称为#E 神人#!，意即蒙神赐福之人。正因如此，在#E 琉球#!，女子与男子平起平坐并不罕见，且在诸多情况下，女子比男子更受重视。\n\n#E 祝女#!阶层可比作神谕者，与#E 由他#!阶层一道，构成了由神灵直接拣选的人群。较低阶层的#E 下知#!、#E 宇佐家#!与#E 宇久里#!也都与神圣职能相关，且并非仅限于女性。\n\n允许女子施展才华，使她们在我们社会的宗教职能中展现出超群的专业水准与造诣。"
 me_duuchuu_4_title:0 "$jomon_duuchuu_missions_task_4$"
 me_duuchuu_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_duuchuu_5.a:0 "效率确实高。"
 me_duuchuu_5_desc:0 "我们的水师纯为经济之用。其目的乃是确保商贾安全、能言善道且心满意足。因此，我们无需以士兵装载船只，而是可以装载货物！这将大大降低舰队建造与维护的成本。诚然，我们并不需要强大的水师，毕竟，谁会对我等怀有恶意呢？"
 me_duuchuu_5_title:0 "$jomon_duuchuu_missions_task_5$"
 me_duuchuu_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_duuchuu_6.a:0 "嗯，米与鱼！"
 me_duuchuu_6_desc:0 "我们的贸易向北向南双向延伸；与#E 弥生#!人、#E 夷洲#!人，甚至#E 越#!人通商！我们的贸易传统更可远溯至#E 弥生#!人到来之前甚久，这使得我们早已熟悉诸如#E 稻#!米之类的事物。\n\n近来，随着人们注意到#E 弥生#!人运用水田稻作成效显著，此地水田农业有了显著增长。这应有助于补充我们生产粮食的能力。"
 me_duuchuu_6_title:0 "$jomon_duuchuu_missions_task_6$"
 me_duuchuu_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_duuchuu_7.a:0 "变革之潮已至。"
 me_duuchuu_700.a:0 "吾等真无望乎？"
 me_duuchuu_700_desc:0 "#E 祝女#!巫女带来了严峻的消息。她恍惚而言，声音扭曲。"
 me_duuchuu_701_desc:0 "你怀着忐忑之心，恰于二十九天后返回#E 祝女#!处。她以温和但锐利的目光迎接你，不再如上次那般恍惚出神。\n\n"
 me_duuchuu_702_desc:0 "十日后，你返回#E 祝女#!处。她正在行占卜之术。你等候数小时，直至她睁开眼睛。她身旁燃烧的火焰瞬间熄灭。她起身直立，开口言道。\n\n"
 me_duuchuu_7_title:0 "$jomon_duuchuu_missions_task_7$"
 me_duuchuu_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_duuchuu_8.a:0 "想想用这些货物能造什么。"
 me_duuchuu_8_desc:0 "#E 福尔摩沙岛#!上的#E 夷洲#!人，长久以来与#E 南土中#!诸部族互动频繁。他们是我们所享有的诸多商品的来源。如今我们直接统治了他们，我们应花时间发展其土地，以获取最大可能的价值。\n\n此外，当我们目光南望之时，更看到了获取珍贵贸易品的更多机遇。我们应考虑向更远处、与#E 夷洲#!同宗文化的#E 伊戈罗特#!人继续扩张。"
 me_duuchuu_8_title:0 "$jomon_duuchuu_missions_task_8$"
 me_duuchuu_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_duuchuu_9.a:0 "平湖将成绝佳之城！"
 me_duuchuu_9.b:0 "存钱备他用。"
 me_duuchuu_9.c:0 "不如设为自治殖民地。"
 me_duuchuu_9_desc:0 "#E 平湖#!岛地处对#E 华夏#!贸易的绝佳位置。在此建造一座城市以掌控#E 南海#!的贸易，堪称理想之地。从某种意义上说，它为我们开辟了一条全新的影响路线。"
 me_duuchuu_9_title:0 "$jomon_duuchuu_missions_task_9$"
 me_duuchuu_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_duuchuu_missions_task_9$#!' $mission_completed_tooltip_2$"
 me_emishi_1.a:0 "挫彼骄横的完美工具。"
 me_emishi_10.a:0 "吾虾夷，吾自豪！"
 me_emishi_10_desc:0 "我们已成为#E 东北#!全境的唯一强权！#E 弥生#!人常称我们为#E 虾夷#!，或许语带贬义，但以此宽泛称谓统一各部却有其可取之处。我们将以此名为己用，建立一个全新的#E 虾夷#!之国。"
 me_emishi_10_title:0 "$emishi_missions_task_10$"
 me_emishi_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_emishi_11.a:0 "而#E我#!将是成事之人！"
 me_emishi_11_desc:0 "不同#E 绳文#!群体之间的差异错综复杂。虽然我们都被视为'#E 绳文人#!'，但现实是，与不同的#E 弥生#!群体相比，我们彼此之间远没有那么相似。将所有这些群体统一为遍布#E 绳文#!所居#E 倭#!全境的单一#E 虾夷#!文化，需得一位干练之人方能达成。"
 me_emishi_11_title:0 "$emishi_missions_task_11$"
 me_emishi_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_emishi_12.a:0 "[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]显然最优。"
 me_emishi_12_desc:0 "高贵的[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]应居于统治地位。是我们统一了这些我们称之为家园的土地，也应当是我们统治所有其他的#E 绳文#!人！当我们推行[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]统治阶层时，这将影响有多少人愿意接受一种融合的单一文化。"
 me_emishi_12_title:0 "$emishi_missions_task_12$"
 me_emishi_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_emishi_13.a:0 "吾等并肩而立。"
 me_emishi_13_desc:0 "虽然我们自己便是[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人，但我们决定做仁厚的统治者，赋予其他文化及我们自身的#E 自由民#!以权利。当我们推行统一的#E 绳文#!文化时，这一促进跨文化权利的决定，将影响有多少人愿意接受一种融合的单一文化。"
 me_emishi_13_title:0 "$emishi_missions_task_13$"
 me_emishi_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_emishi_14.a:0 "登场；#E虾夷#!。"
 me_emishi_14_desc:0 "一个新的时代伴随着一种新的文化认同而到来。#E 虾夷#!文化认同，以[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]为领导，是所有受我们支配的#E 绳文#!群体间的融合认同。南迁者、东贸者、西战者，合而为一。团结一致，我们永不退缩，尤其不会屈服于那些#E 弥生#!入侵者！"
 me_emishi_14_title:0 "$emishi_missions_task_14$"
 me_emishi_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_emishi_15.a:0 "知己知彼"
 me_emishi_15_desc:0 "我们与#E 弥生#!附庸之间的关系，在他们看来或许宽仁，然而对我们而言，却极具利用价值。我们学会了他们的作战之道、他们的农耕之法，以及他们的生活方式！"
 me_emishi_15_title:0 "$emishi_missions_task_15$"
 me_emishi_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_emishi_16.a:0 "我视此为完胜。"
 me_emishi_16_desc:0 "我们与#E 弥生#!附庸之间的关系一直动荡不安，以至于我们决定用一位#E 绳文#!后裔替换#E 弥生#!酋长。这也将使他们转变为#E 藩属#!。"
 me_emishi_16_title:0 "$emishi_missions_task_16$"
 me_emishi_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_emishi_1_desc:0 "#E 游击战术#!的成功实施，必将成为边境上任何#E 弥生#!部族的梦魇。有人称此为怯懦，但我们深知，这无非是一种生存之道；而且似乎颇为成功。"
 me_emishi_1_title:0 "$emishi_missions_task_1$"
 me_emishi_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_emishi_2.a:0 "稻作由此兴"
 me_emishi_2_desc:0 "稻米之秘在#E 倭#!历史上渊源深远。正是得益于稻米的种植，#E 弥生#!的人口才得以如此迅速地增长，而#E 绳文#!的人口却继续萎缩。如今，局势必将反转。"
 me_emishi_2_title:0 "$emishi_missions_task_2$"
 me_emishi_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_emishi_3.a:0 "再见群山，你好海滩。"
 me_emishi_3_desc:0 "白日商贾，夜中迁徙。这便是#E 白河#!人的生活。我们在山中已定居日久，是时候迁往海岸了。当然，有朝一日我们还会回到旧日家园。"
 me_emishi_3_title:0 "$emishi_missions_task_3$"
 me_emishi_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_emishi_4.a:0 "空谈已够，动手吧。"
 me_emishi_4_desc:0 "#E 东北#!诸事纷繁，同时发生。#E 白河#!人日益增多的迁徙；#E 出羽#!人日渐增长的侵略性与影响力；#E 砂川#!人的贸易路线继续向#E 北海道#!延伸。当然，还有众多#E 弥生#!部族之事，他们的边界正不断向#E 绳文#!土地推进。我们必须决定先处理哪些问题，但无疑，所有这些问题都必须得到应对。"
 me_emishi_4_title:0 "$emishi_missions_task_4$"
 me_emishi_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_emishi_5.a:0 "啊，不再有部落劫掠……对吧？"
 me_emishi_5_desc:0 "北部#E 本州#!——即#E 东北#!——的众多#E 绳文#!部族散布于整个地区。各部族全然不团结，坦白讲，此前从未想过要统一。收服诸部乃一项宏大使命。我们已夺取了诸部的所有文化中心，这场#E 绳文大会#!即将告终。"
 me_emishi_5_title:0 "$emishi_missions_task_5$"
 me_emishi_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_emishi_6.a:0 "气势日盛！"
 me_emishi_6_desc:0 "#E 弥生#!人已被平定！他们如今处于我宗主权之下，是我等附庸。问题依然存在……该如何处置这个附庸？我们是因他们曾将我族驱逐至此而惩罚他们……还是应当从直接控制一支#E 弥生#!部族中获益？他们的所有秘密都可以成为我们的。"
 me_emishi_6_title:0 "$emishi_missions_task_6$"
 me_emishi_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_emishi_7.a:0 "大海为我所有！"
 me_emishi_7_desc:0 "#E 出羽#!曾经统治着#E 加贺#!北部海岸的大部分地区，而如今它终于被收复！佐渡岛是#E 绳文#!文化在#E 倭#!本土最后的据点之一，也像#E 倭#!的许多小岛一样充当着海盗港口。如今这片海岸已归我所有，水师实力得以增强。"
 me_emishi_7_title:0 "$emishi_missions_task_7$"
 me_emishi_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_emishi_8.a:0 "整体吞并。"
 me_emishi_8.b:0 "彼将为傀儡。"
 me_emishi_8_desc:0 "#E 虾夷岛#!——各族散居的#E 虾夷#!诸部所居之岛——一直是#E 砂川#!人兴趣所在。如今它已完全处于我方控制之下，我们有两个选择：直接将这片土地并入我国正式领土，或在[GetProvince('(int32)10567').GetName|E]扶持一个#E 藩属#!国。"
 me_emishi_8_title:0 "$emishi_missions_task_8$"
 me_emishi_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_emishi_9.a:0 "金钱！山川！垄断！"
 me_emishi_9_desc:0 "我们向海岸的迁徙以及随后的中央集权化，吸引了众多同族#E 白河#!人前来投奔我部。如今我们可以建立一个正式的#E 部落联盟#!，并垄断东部#E 东北#!海岸。"
 me_emishi_9_title:0 "$emishi_missions_task_9$"
 me_emishi_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $emishi_missions_task_9$#!' $mission_completed_tooltip_2$"
 me_ezo_1.a:0 "愿神威指引。"
 me_ezo_10.a:0 "人人皆有Hak-Casi！"
 me_ezo_10_desc:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]与#E 本州#!的[GetCulture('dewa').GetCultureGroup.GetName|Y]人及[GetCulture('wa').GetCultureGroup.GetName|Y]人的贸易，有利可图但险象环生。那些移民——尤其是野心勃勃之辈——怀着在我领地中自订规矩的图谋。然而，我们创新的#E 箱馆#!既护卫了我们之海岸，又保持着有利于繁荣经济所需的灵活性。"
 me_ezo_10_title:0 "$ezo_missions_task_10$"
 me_ezo_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_ezo_11.a:0 "滑稽鸡叫什么？笑母鸡！"
 me_ezo_11_desc:0 "#E 石狩#!聚落坐落于#E 石狩川#!之畔。这条河有个诙谐的别称——'幽默之河'。得此名，主要是因我们有以动物第一人称讲述滑稽故事的独特传统。这一传统源自我们频繁交易的#E 铃谷#!部族的#E 伊兹克#!宗教。此传统已成为我们独特性中重要的组成部分，自当大力弘扬！"
 me_ezo_11_title:0 "$ezo_missions_task_11$"
 me_ezo_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_ezo_12.a:0 "北海道扇贝，我新国菜！"
 me_ezo_12_desc:0 "在#E 鄂霍次克#!，扇贝几乎自己跳上我们的餐盘。这处聚落是交易填满我们渔场之肥美扇贝的绝佳之地。尽管#E 江差#!人夸耀其捕鱼之能，但就连他们也不得不出钱购买我们当地的扇贝珍馐。"
 me_ezo_12_title:0 "$ezo_missions_task_12$"
 me_ezo_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_ezo_13.a:0 "采纳些Yzic传统。"
 me_ezo_13.b:0 "应正式以Yzic取代Fuchite。"
 me_ezo_13.c:0 "建议铃谷人改行Fuchite。"
 me_ezo_13_desc:0 "北方之灵宗教——#E 铃谷#!教——在我国土地上散发出某种魅力。我们的长期贸易伙伴向我们讲述了他们的#E 伊兹克#!宗教。或许我们应考虑吸纳某些#E 伊兹克#!思想。"
 me_ezo_13_title:0 "$ezo_missions_task_13$"
 me_ezo_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_ezo_14.a:0 "我们是[GetCulture('dewa').GetCultureGroup.GetName|E]人，而非[GetCulture('wa').GetCultureGroup.GetName|E]人。"
 me_ezo_14.b:0 "神与神威并无大异。"
 me_ezo_14.c:0 "以古道教为国教。"
 me_ezo_14_desc:0 "[GetCulture('wa').GetCultureGroup.GetName|E]人信奉'神'。这些神灵与我们自己的神威并非全无相似之处。虽然这是外来的传统，但或许从其#E 古道#!传统中汲取一些思想会有所裨益。"
 me_ezo_14_title:0 "$ezo_missions_task_14$"
 me_ezo_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_ezo_15.a:0 "北海道绳文宣告虾夷地。"
 me_ezo_15_desc:0 "在[SCOPE.GetRootScope.GetCountry.GetName|E]的领导下，我们的国家已不再仅仅是一个部族。不，如今我们代表了所有[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人的家园——#E 虾夷地#!。而如今，#E 虾夷地#!将成为所有[GetCulture('dewa').GetCultureGroup.GetName|E]人民在对抗[GetCulture('wa').GetCultureGroup.GetName|E]的斗争中的希望灯塔。"
 me_ezo_15_title:0 "$ezo_missions_task_15$"
 me_ezo_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_ezo_16.a:0 "虾夷将救绳文！"
 me_ezo_16_desc:0 "随着[SCOPE.GetRootScope.GetCountry.GetName|E]——[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人的土地——的彻底建成，我们如今将目光转向了其余[GetCulture('dewa').GetCultureGroup.GetName|E]人。若我们能够统一自己的岛屿，为何不尝试统一我们全体人民？\n\n虽然[GetCulture('dewa').GetCultureGroup.GetName|E]人是多样的民族，但我们所有人都有一共同之处：我们正被[GetCulture('wa').GetCultureGroup.GetName|E]人从[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]祖传的家园驱逐。我们在南方的同族终究将被迫退至[SCOPE.GetRootScope.GetCountry.GetName|E]，那么我们为何不将[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]之战火主动引向他们，而非坐以待毙？"
 me_ezo_16_title:0 "虾夷-绳文时代？"
 me_ezo_16_tooltip:0 "任务树'#Y北海道之巅#!'已#G完成#!!"
 me_ezo_1_desc:0 "[GetProvince('(int32) 10567').GetArea.GetName|E]的[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人已在此居住了数个世纪，甚至上千年。然而是时候开阔我们的视野，越过海岸，望向新的土地了。我们应投入资源，探索在我们当前疆域之外等待着我们的新机遇。"
 me_ezo_1_title:0 "$ezo_missions_task_1$"
 me_ezo_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_ezo_2.a:0 "[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]同心共荣。"
 me_ezo_201.a:0 "血肉之亲，当可讲理。"
 me_ezo_201.b:0 "或为宏图，血溅同胞。"
 me_ezo_201_desc:0 "统一[GetProvince('(int32) 10567').GetArea.GetName|E]诸部族有两种方法。我们应致力于以外交统一或以战争统一。但我们应侧重何种方式？以外交方式统一虽可避免流血，但可能比以征服统一耗时更长，花费也更多。"
 me_ezo_2_desc:0 "[GetProvince('(int32) 10567').GetArea.GetName|E]由三个[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]部族瓜分：#E 江差#!部族、#E 江别#!部族与#E 北见#!部族。虽然我们彼此有别，但我们理当在我们的旗帜下统治同族[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]。无论以和平或战争方式，我们的岛屿终将统一。"
 me_ezo_2_title:0 "$ezo_missions_task_2$"
 me_ezo_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_ezo_3.a:0 "江差人果然精于#E渔#!。"
 me_ezo_3_desc:0 "#E 江差#!的渔夫技艺精湛，即便在[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人中也属佼佼者。渔场中始终充盈着上等的鱼类，捕获量足以与南方的#E 本州#!岛通商，无论[GetCulture('dewa').GetCultureGroup.GetName|E]人还是[GetCulture('wa').GetCultureGroup.GetName|E]人，皆可交易。"
 me_ezo_3_title:0 "$ezo_missions_task_3$"
 me_ezo_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_ezo_4.a:0 "江别乃最佳商贾。"
 me_ezo_4_desc:0 "若非#E 江别#!的商贾，谁又能以兽类换取琥珀？他们的狡黠与魅力，为他们赢得了与#E 库页#!半岛的厚利贸易，使[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人得以接触到这种珍贵的树脂宝石。"
 me_ezo_4_title:0 "$ezo_missions_task_4$"
 me_ezo_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_ezo_5.a:0 "神威眷顾北见。"
 me_ezo_5_desc:0 "#E 北见#!部族的珠宝匠已成为行家里手。他们的珠宝以#E 江别#!人交易来的琥珀制成，畅销于[GetProvince('(int32) 10567').GetArea.GetName|E]全境。近来，某位珠宝匠制作了一枚精美绝伦的琥珀戒指，其神圣之质堪当进献给神威。"
 me_ezo_5_title:0 "$ezo_missions_task_5$"
 me_ezo_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_ezo_6.a:0 "家在[GetProvince('(int32) 10567').GetArea.GetName]处。"
 me_ezo_6_desc:0 "[GetProvince('(int32) 10567').GetArea.GetName|E]的海岸已在[SCOPE.GetRootScope.GetCountry.GetName|E]部族旗下完成统一。由此统一，我们应正式宣告此岛为我们永久的家园。我们再无需为资源在全岛迁徙，因为整座岛屿已归我所有！"
 me_ezo_6_title:0 "$ezo_missions_task_6$"
 me_ezo_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_ezo_7.a:0 "同心共荣。"
 me_ezo_7_desc:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]部族从来并非纯粹的[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人。当然，我们已在[GetProvince('(int32) 10567').GetArea.GetName|E]居住了数世纪，然而，通过来自南方#E 本州#!的移民，以及与[GetProvince('(int32) 10567').GetArea.GetRegion.GetName|E]各地持续不断的贸易往来，我们与#E 砂川#!人之间已寻得许多共同之处。接纳#E 砂川#!人为兄弟，既融合了我们双方的传统，若我们选择将影响力进一步扩展至北#E 东北#!之外，也将助益于我辈。"
 me_ezo_7_title:0 "$ezo_missions_task_7$"
 me_ezo_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_ezo_8.a:0 "但愿彼同意。"
 me_ezo_801.a:0 "听来互利共赢！"
 me_ezo_801.b:0 "放弃独立？绝不。"
 me_ezo_801_desc:0 "[GetProvince('(int32) 10567').GetArea.GetName|E]的#E 虾夷#!人向我们派遣了一支使团。他们说，多年来我们之间的贸易关系使双方亲如一家，他们希望我们成为其宗主，以换取更便捷的贸易往来。诚然，我们与#E 虾夷#!人通商已历数世纪，但这真的值得以我们的自治为代价吗？"
 me_ezo_801_susuya_response:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]保持自治实体。"
 me_ezo_801_susuya_response_good:0 "[SCOPE.GetRootScope.GetCountry.GetName|E]将成为#E虾夷#!的#Y贸易殖民地#!。"
 me_ezo_801_title:0 "虾夷提案"
 me_ezo_802.a:0 "备战！"
 me_ezo_802.b:0 "与之保持友好。"
 me_ezo_802_desc:0 "#E 铃谷#!人带来了他们的答复。不幸的是，他们拒绝了我们的善意！然而，我们仍可挽回这一尴尬，我们可以自行夺取他们的土地，建立一个傀儡政权，使其服从理智的安排。"
 me_ezo_802_title:0 "$ezo_missions_task_8$"
 me_ezo_803.a:0 "铃谷今为家人。"
 me_ezo_803_desc:0 "#E 铃谷#!人已经接受了我们的庇护！他们如今将成为我们的#E 贸易殖民地#!。这保障了#E 琥珀#!贸易，对两国人民都将有所裨益。"
 me_ezo_803_title:0 "$ezo_missions_task_8$"
 me_ezo_8_desc:0 "虽为独特的民族，来自#E 库页#!的#E 铃谷#!部族却已与我们通商数百年。#E 江别#!与#E 北见#!两部族皆因琥珀贸易而繁荣。得之于#E 铃谷#!，贸之于#E 江别#!，而由#E 北见#!人加工雕琢。这一关系已使我等民众亲如一家。#E 铃谷#!人乐于成为我们的非正式属臣，以互惠贸易附庸的形式。"
 me_ezo_8_title:0 "$ezo_missions_task_8$"
 me_ezo_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_ezo_9.a:0 "神威-御岳之赐福。"
 me_ezo_9_desc:0 "神威峰——众神的游乐场。[GetProvince('(int32) 10567').GetArea.GetName|E]全境的最高点。生活在其周围的人们坚韧刚毅，能够在沿岸[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|E]人所不愿想象的条件下生存。幸运的是，这些人是我们的亲族，他们走下自己的游乐场，进入我们的城市，为我们带来了在严酷条件下生存的宝贵经验，也充实了我们的聚落。"
 me_ezo_9_title:0 "$ezo_missions_task_9$"
 me_ezo_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $ezo_missions_task_9$#!' $mission_completed_tooltip_2$"
 me_honshu_1.a:0 "生存还是毁灭，此乃绳文……等等——"
 me_honshu_10.a:0 "稻米还需香料配。"
 me_honshu_10_desc:0 "#E弥生#!稻农是#E弥生#!人在#E倭#!取得成功的最大原因。我们必须尽快适应这些稻作之法，方能如彼等一般繁荣昌盛。"
 me_honshu_10_title:0 "$jomon_honshu_missions_task_10$"
 me_honshu_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_honshu_11.a:0 "再寻更多果实！"
 me_honshu_11_desc:0 "#E绳文#!之道素以渔猎采集为本。此外，#E绳文#!人善于觅食以补其粮。此道我辈未曾遗忘，吾等将继行采集，而非定居农耕。"
 me_honshu_11_title:0 "$jomon_honshu_missions_task_11$"
 me_honshu_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_honshu_12.a:0 "如海上明月般闪耀。"
 me_honshu_12_desc:0 "勾玉既是个人饰物，亦为贵重礼器。而青铜作为金属，于铸造各类工具与兵器亦颇有用。我等已能将工艺与青铜冶铸融会贯通，如今可造出精美绝伦之金属艺术品，如此青铜勾玉便是明证！"
 me_honshu_12_title:0 "$jomon_honshu_missions_task_12$"
 me_honshu_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_honshu_13.a:0 "辛勤终有回报！"
 me_honshu_13_desc:0 "虽力求避免使用外来兵器，坚守传统战法，吾等却也采用了#E稻#!作农耕。以新金属制工具颇为诱人，然我等不会应允。取而代之，吾等将更辛勤耕耘，以求丰收！"
 me_honshu_13_title:0 "$jomon_honshu_missions_task_13$"
 me_honshu_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_honshu_14.a:0 "看来青铜投资极明智。"
 me_honshu_14_desc:0 "凭借青铜工具，吾等能更高效地果腹充饥！青铜鱼钩可反复使用，使我等渔获更为频繁。"
 me_honshu_14_title:0 "$jomon_honshu_missions_task_14$"
 me_honshu_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_honshu_15.a:0 "此必为好事。"
 me_honshu_15.b:0 "皈依古道教！"
 me_honshu_15_desc:0 "#E弥生#!人所崇奉之灵——#E稻荷大神#!令吾等颇感兴趣。她颇合我万神殿之仪，代表狐之灵性。#E稻荷#!之崇祀已在我国境内传播开来。"
 me_honshu_15_title:0 "$jomon_honshu_missions_task_15$"
 me_honshu_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_honshu_16.a:0 "让炉火温暖吾等灵魂。"
 me_honshu_16_desc:0 "#E绳文#!文化中的灶火，既非仅代表#E火神#!之神性，亦非区区家户之物。灶火乃我辈家宅之心。无此，则无以为家。赞美居于我所有#E绳文#!子民之中的#E火神#!吧。"
 me_honshu_16_title:0 "$jomon_honshu_missions_task_16$"
 me_honshu_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_honshu_17.a:0 "应引彼入我神系。"
 me_honshu_17_desc:0 "新的融合诞生了！#E稻荷#!之崇祀已在我国境内迅速传播，并与#E知罗努普神#!之信仰相融。二狐之灵合而为一，化作#E知罗努普·稻荷#!——狐之大神。"
 me_honshu_17_title:0 "$jomon_honshu_missions_task_17$"
 me_honshu_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_honshu_18.a:0 "最精美火焰陶供奉圣所。"
 me_honshu_18_desc:0 "古时，吾等曾制作远多于此的#E火焰陶#!。其器形动人，我等理当重拾此类繁复陶器之制作。无论采用何种陶风，赖#E火神#!与灶火之庇佑，吾等始终能创制如此惊艳之陶器。"
 me_honshu_18_title:0 "$jomon_honshu_missions_task_18$"
 me_honshu_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_honshu_19.a:0 "绳文铜铎铸造开工！"
 me_honshu_19_desc:0 "#E弥生#!人有一项极为惊人的创新：#E铜铎#!。这些铜铃甚至可资防御之用，亦使我等得以在其设计上融入自身特色。"
 me_honshu_19_title:0 "$jomon_honshu_missions_task_19$"
 me_honshu_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_honshu_1_desc:0 "身为#E绳文#!之人……其意为何？身为#E弥生#!之人，便非#E绳文#!之人乎？吾等须觅得此问之解。\n\n于抉择前行之道时，我辈当留意#E#Y弥生化#!#!之程度。"
 me_honshu_1_title:0 "$jomon_honshu_missions_task_1$"
 me_honshu_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_honshu_2.a:0 "神明赐我力量。"
 me_honshu_20.a:0 "吾辈何其伟大，不是吗？"
 me_honshu_20_desc:0 "#E绳文#!土偶是#E绳文#!工艺之标志。吾等可继续多制此类器物，以展其精巧之貌，并确证我文化远胜#E弥生#!。"
 me_honshu_20_title:0 "$jomon_honshu_missions_task_20$"
 me_honshu_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_honshu_21.a:0 "诸岛皆为我有。"
 me_honshu_21_desc:0 "四岛之故事：#E北海道、本州、四国与九州#!。每座岛屿皆因不同缘由而令吾等心向往之，而凡此诸岛，皆须纳入#E绳文#!之治下。让我等逐一应对各岛之难吧。"
 me_honshu_21_title:0 "$jomon_honshu_missions_task_21$"
 me_honshu_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_honshu_22.a:0 "吾乃仁德之主。"
 me_honshu_22_desc:0 "#E北海道#!是#E倭#!以北的一座美丽岛屿。自#E弥生#!人出现以来，此地便一直是众多#E绳文#!人之避难所。如今吾等已以各族之荣耀相报。愿#E北海道人#!长存于世。"
 me_honshu_22_title:0 "$jomon_honshu_missions_task_22$"
 me_honshu_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_honshu_23.a:0 "本州和谐终至。"
 me_honshu_23_desc:0 "历经数代，吾等一直在#E本州#!岛上与#E弥生#!人交战。如今，吾等已夺取其人口中心。我们可正式宣告此为#E弥生时代#!之终结，盖因我辈现已掌控#E倭#!半数以上之陆地。"
 me_honshu_23_title:0 "$jomon_honshu_missions_task_23$"
 me_honshu_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_honshu_24.a:0 "迁至乌波波伊。"
 me_honshu_24.b:0 "寸步不移。"
 me_honshu_24_desc:0 "同名都城#E大和#!曾是全#E倭#!最令人叹为观止的聚落。吾等已将其更名为#E绳文#!式名称——#E乌波波伊#!，而今我们须做一抉择。是否应将都城迁至#E乌波波伊#!？其居中之位，毕竟使治理更为便利。"
 me_honshu_24_title:0 "$jomon_honshu_missions_task_24$"
 me_honshu_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_honshu_25.a:0 "此乃我纪伊成功之道。"
 me_honshu_25_desc:0 "#E纪伊#!地区位于#E本州#!最西端。此地为我等打开了通往西方的绝佳门户，无论征伐还是贸易皆然。"
 me_honshu_25_title:0 "$jomon_honshu_missions_task_25$"
 me_honshu_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_honshu_26.a:0 "美酒佳肴，不亦乐乎！"
 me_honshu_26_desc:0 "#E四国#!岛是四岛中最小者，然资源最为可资开发。其中，一处酿酒聚落与一处染料聚落在吾等治下有兴旺之潜力。"
 me_honshu_26_title:0 "$jomon_honshu_missions_task_26$"
 me_honshu_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_26$#!' $mission_completed_tooltip_2$"

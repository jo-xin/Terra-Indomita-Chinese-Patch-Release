 me_honshu_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_honshu_28.a:0 "绳文一统！"
 me_honshu_28_desc:0 "#E土蜘蛛#!与其余#E绳文#!人隔绝已有千年之久。#E弥生#!人之入侵无疑令此雪上加霜。然终究，吾等重建了联络，且已准备将其收为藩属，终使#E倭#!之地连年战乱尘埃落定。"
 me_honshu_28_title:0 "$jomon_honshu_missions_task_28$"
 me_honshu_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_28$#!' $mission_completed_tooltip_2$"
 me_honshu_29.a:0 "起来吧，我的弟兄们，从死亡中苏醒！"
 me_honshu_29_desc:0 "吾等对#E朝鲜#!之宣称权，往好里说也颇为牵强，然既已占据半岛大片领土，我等终可建立一个#E栉文#!封建邦国！"
 me_honshu_29_title:0 "$jomon_honshu_missions_task_29$"
 me_honshu_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_29$#!' $mission_completed_tooltip_2$"
 me_honshu_2_desc:0 "敬奉神灵，乃吾等在#E倭#!之地长治久安之根本。正因有彼等庇佑，我方得以行至今日。既为#E火神#!之儿女，让我等继续虔诚礼拜吧。"
 me_honshu_2_title:0 "$jomon_honshu_missions_task_2$"
 me_honshu_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_honshu_3.a:0 "此土归绳文所有！"
 me_honshu_3_desc:0 "#E绳文#!与#E弥生#!皆擅长制陶。在我邦之内，随着可支配收入日益增多，对#E土器#!之需求亦呈指数增长。如今我等已真正成为黏土之匠师。"
 me_honshu_3_title:0 "$jomon_honshu_missions_task_3$"
 me_honshu_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_honshu_4.a:0 "吾身为剑骨"
 me_honshu_4_desc:0 "我方将士经历了数月的严酷训练，学会在装备更精良的兵器与战术之前，善用现有之一切。"
 me_honshu_4_title:0 "$jomon_honshu_missions_task_4$"
 me_honshu_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_honshu_5.a:0 "绳文万世！"
 me_honshu_5_desc:0 "#E绳文#!人从艰难守卫故土以御#E弥生#!入侵者，走到今日，已历漫长之途。故此，吾等特设盛大宴会，以彰我民之坚韧、勇武、忍耐与美德。"
 me_honshu_5_title:0 "$jomon_honshu_missions_task_5$"
 me_honshu_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_honshu_6.a:0 "啊，美哉陶罐！"
 me_honshu_6_desc:0 "#E弥生#!人的陶器风格颇为雅致。其光滑莹润的外表，与我标志性的绳纹陶风相映成趣。再者，此风格之下，我等仍可施加纹理。"
 me_honshu_6_title:0 "$jomon_honshu_missions_task_6$"
 me_honshu_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_honshu_7.a:0 "啊，美哉纹样！"
 me_honshu_7_desc:0 "传统#E绳文#!陶器风格居全#E倭#!之冠。吾等精巧的绳纹设计，正是“绳文”之名的由来。先祖之道，吾辈永不背弃。"
 me_honshu_7_title:0 "$jomon_honshu_missions_task_7$"
 me_honshu_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_honshu_8.a:0 "绳文青铜时代开启"
 me_honshu_8_desc:0 "使用#E铁#!及其他#E卑金属#!的概念，在#E弥生#!人通过与中国贸易将其带入#E倭#!之前，于我辈实为陌生。我等已选择采纳这些新的冶金之法，此举定能助我邦在技术上追赶世界余部。"
 me_honshu_8_title:0 "$jomon_honshu_missions_task_8$"
 me_honshu_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $jomon_honshu_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_honshu_9.a:0 "新新石器时代降临"
 me_honshu_9_desc:0 "#E弥生#!人携其金属棍棒与青铜杖来到此地。我辈无需此类赘物，无之亦可存活，且必将如此。取而代之，我们将更注重传统战法。"

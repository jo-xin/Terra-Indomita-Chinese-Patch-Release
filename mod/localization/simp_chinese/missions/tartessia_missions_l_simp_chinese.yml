l_simp_chinese:
 astigi_et_urso_1:0 "准备工作"
 astigi_et_urso_1_DESC:0 "长久以来，[GetProvince('(int32)1374').GetName]一直主宰此地区，阿斯蒂吉和乌尔索奋力抗争。现在这一切将改变，我们将一劳永逸地确立霸主地位。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 astigi_et_urso_2:0 "清除对手"
 astigi_et_urso_2_DESC:0 "终于，我们的权力竞争对手已被铲除，无人能阻挡我们，我们现已成为这片土地的合法统治者。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 astigi_et_urso_3:0 "三城联盟"
 astigi_et_urso_3_DESC:0 "击败对手后，我们现已成为这片地区的无可争议的统治者。然而，无人居住的土地又有何用？我们需吸引人口迁入。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 bull_of_porcuna:0 "波尔库纳之牛"
 bull_of_porcuna_desc:0 "一尊雕刻精美的跪牛雕像，装饰有旋转图案，奉献给伊比利亚的众神。"
 carthaginian_turdetanian_connection_mod:0 "非洲的联系"
 desc_carthaginian_turdetanian_connection_mod:0 "我们与非洲人签订了为期十年的谅解条约；这是对我们国家的一大恩惠，也是我们外交影响力增长的象征。"
 desc_five_turdenian_cities_mod:0 "伊比利亚南部的五座图耳德塔尼城市——哈斯塔、拉斯库塔、阿西尼波、卡尔莫和阿斯蒂吉——被征收特别税，为塔尔特西亚国家的持续增长提供资金。"
 desc_greek_trade_connection_turdetania_mod:0 "多亏我们人民的投资，这座城市已成为遥远希腊商人常来的地方。"
 desc_mighty_tartessia:0 "我们热情的人民为古老塔尔特西亚力量的重塑而欢欣鼓舞！"
 desc_mines_of_tharsis_turdetania_mod:0 "塔尔特西亚人享有塔尔西斯的高产矿山，尽管它们不如昔日富饶，仍是该地区宝贵的矿石来源。"
 desc_tartessian_pantry_modifier:0 "多亏我们领导层确保粮仓充盈，当地民众蜂拥而至，涌向我们的首都。"
 desc_tharsis_mines_iron_boom:0 "多亏附近矿山金属矿石的盈余，我们的大师金属工匠得以打造致命的铁制武器，供我们的轻步兵使用。"
 desc_turdetanian_aggression_mod:0 "我们胜利的士兵，因战场上一连串令人印象深刻的胜利而士气高昂，因纪律严明而继续称霸。"
 desc_turdetanian_coin_mint_mod:0 "这座城市建有一座铸币厂，大量铸造带有我们统治者肖像的货币。"
 fight_to_remain_free:0 "对抗对手"
 five_turdenian_cities_mod:0 "五城税收"
 form_tartessia_new_mission_tree_tooltip:0 "#Y 组建#E 塔尔特西亚#!将解锁任务树#G “伊比利亚征服者”#!。#!"
 greater_karmo:0 "扩展的卡尔莫影响"
 greek_trade_connection_turdetania_mod:0 "希腊-图耳德塔尼贸易路线"
 hasta_task_1:0 "拥抱迦南理念"
 hasta_task_1_DESC:0 "与布匿迦南人的长期接触在我们的社会中留下了痕迹，无论好坏。许多人信奉这些外来神祇，人数之多，称其为外来已不再恰当。\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 hasta_task_2:0 "贸易致富"
 hasta_task_2_DESC:0 "我们是贸易之国，许多人认为买卖是我们与生俱来的天赋。若有通过物物交换或销售赚取金币的方法，[ROOT.GetCountry.GetName]必感兴趣。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 hasta_task_3:0 "商人之都"
 hasta_task_3_DESC:0 "#Y [ROOT.GetCountry.GetCapital.GetName]#!的市场熙熙攘攘，位于城市中心，我们的首都是不断增长的经济命脉。\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 hasta_task_4:0 "贸易启智"
 hasta_task_4_DESC:0 "人们相遇时分享思想，贸易时相遇。因此，贸易促成思想交流，作为顶尖的贸易者，我们最先听到新奇的创新。\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 have_mine_tartessia_tt:0 "我们需在国家境内拥有#Y 3座矿山#!。"
 karmo_rebellious_sentiments:0 "叛乱情绪"
 karmo_task_1:0 "吞并阿斯蒂吉"
 karmo_task_1_DESC:0 "卡尔莫的宿敌阿斯蒂吉城终将成为我们的囊中之物。无人可挑战我们的霸权！\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 karmo_task_2:0 "征服乌尔索"
 karmo_task_2_DESC:0 "东南方的乌尔索正崛起为新兴势力，若不加以遏制，定将与我们抗衡。我们绝不允许乌尔索凌驾于[ROOT.GetCountry.GetCapital.GetName]之上。乌尔索的命运已定！\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 karmo_task_3:0 "叛乱的民众"
 karmo_task_3_DESC:0 "乌尔索和阿斯蒂吉的居民对新主人的统治颇为不满。现在是时候让他们明白为何应服从我们——若非出于爱，便以恐惧驯服！\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 karmo_task_4:0 "扩展我们的影响"
 karmo_task_4_DESC:0 "通过外交与军事侵略的结合，[ROOT.GetCountry.GetName]已在伊比利亚南部广泛传播了我们的[ROOT.GetCountry.GetAdjective]影响——谁能否认我们在地球上留下的印记？\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 killed_rivals:0 "清除对手"
 me_tartessia_1.a:0 "还有什么可说？迅速传达此讯！"
 me_tartessia_10.a:0 "‘若你渴望暴君的王冠，[ROOT.GetCountry.GetRuler.GetFirstName]，那将是战争！’"
 me_tartessia_10.b:0 "若#E 塔尔特西亚#!的市民如此期望，我将交出我的权威"
 me_tartessia_10_desc:0 "过去数日，[ROOT.GetCountry.GetRuler.GetName]沉浸在#E 塔尔特西亚#!成形的狂喜中，忙于无数伴随这一壮举的仪式，浑然不觉[ROOT.GetCountry.GetCapital.GetName]内针对[ROOT.GetCountry.GetRuler.GetHerHim]的阴谋已悄然成形。\n\n然而，阴谋显现；[SCOPE.sCharacter('civil_war_leader').GetName]送来威胁，宣称[SCOPE.sCharacter('civil_war_leader').GetHerHim]自为这一阴谋集团的领袖。[SCOPE.sCharacter('civil_war_leader').GetFirstName]在全副武装的卫兵簇拥下，宣读一小卷卷轴，[SCOPE.sCharacter('civil_war_leader').GetHerHis]声音因愤慨而颤抖。\n\n‘你为[ROOT.GetCountry.GetName]做了许多值得称颂之事，哦，[ROOT.GetCountry.GetRuler.GetFirstName]——无人能贬低你的功绩或剥夺你的荣耀。然而，你认为自己有资格戴上王冠？我们不承认你的血统统治我们的权利——我们要求你退位，让我们建立一个#E 共和国#!，由塔尔特西亚的人民当家作主。’"
 me_tartessia_10_title:0 "塔尔特西亚的重生"
 me_tartessia_10_tooltip:0 "任务‘#Y 塔尔特西亚的重生#!’现已#G 完成#!"
 me_tartessia_10_tooltip2:0 "#R 我们将自愿放弃君主制，转变为共和国！#!"
 me_tartessia_11.a:0 "我们将尽所能收服这些野蛮人"
 me_tartessia_11_desc:0 "终于，我们在[GetProvince('(int32)1371').GetName]的宿敌永远失去了他们愚蠢的独立梦想。如此小城怎能对抗[ROOT.GetCountry.GetAdjective]的霸权？他们幡然醒悟是件好事。\n\n[ROOT.GetCountry.GetRuler.GetName]取得的不流血胜利必将载入[ROOT.GetCountry.GetName]的史册，当一切尘埃落定，这座城市以一曲一舞归我们所有。"
 me_tartessia_11_title:0 "吞并阿斯蒂吉"
 me_tartessia_11_tooltip:0 "任务‘#Y $karmo_task_1$#!’现已#G 完成#!"
 me_tartessia_12.a:0 "密切监视这些家伙，他们的承诺对我毫无意义"
 me_tartessia_12_desc:0 "尽管[ROOT.GetCountry.GetCapital.GetName]的一些将领嘲笑[ROOT.GetCountry.GetRuler.GetName]坚称[GetProvince('(int32)1369').GetName]的要塞定有一日成为[GetProvince('(int32)1369').GetArea.GetName]权力中心的说法，无人能阻止[ROOT.GetCountry.GetRulerTitle]秘密派遣军队越境。\n\n尽管我们两国人民敌意深重，我们的[ROOT.GetCountry.GetAdjective]征召兵利用当地节庆，伪装成朝圣者和兴奋的旅人，大举进入乌尔索城门。当准备好的信号响起，卡尼克斯号角声响彻天空，我们的士兵迅速制服卫戍部队，就这样，[GetProvince('(int32)1369').GetName]落入我军手中。\n\n失去首都后，乌尔索的部落放下武器，立下痛苦的忠诚誓言。"
 me_tartessia_12_title:0 "征服乌尔索"
 me_tartessia_12_tooltip:0 "任务‘#Y $karmo_task_2$#!’现已#G 完成#!"
 me_tartessia_13.a:0 "我很高兴当地人决定理智行事"
 me_tartessia_13_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]以冷酷著称，这位[ROOT.GetCountry.GetRulerTitle]真诚关怀[ROOT.GetCountry.GetName]市民的福祉，投入大量资源安抚新征服的地区。\n\n虽然许多人认为[ROOT.GetCountry.GetRuler.GetFirstName]的努力徒劳无功，这位[ROOT.GetCountry.GetAdjective]领袖的坚定最终获得回报，通过贿赂、公共基础设施项目和人情召集，困扰我们领土的愤怒情绪终于消散。"
 me_tartessia_13_title:0 "平息叛乱情绪"
 me_tartessia_13_tooltip:0 "任务‘#Y $karmo_task_3$#!’现已#G 完成#!"
 me_tartessia_14.a:0 "总有一天，[ROOT.GetCountry.GetName]的旗帜将统一整个#E 伊比利亚#!"
 me_tartessia_14_desc:0 "缓缓但坚定地，[ROOT.GetCountry.GetName]的疆域扩展，涵盖了我们的祖先从未想象会落入[ROOT.GetCountry.GetAdjective]霸权的领土。\n\n确实，人们观察到，自古#E 塔尔特西亚#!时代以来，[GetProvince('(int32)1369').GetArea.GetName]从未见过如此力量，越来越多人承认我们是那古老荣耀的真正继承者。"
 me_tartessia_14_title:0 "大卡尔莫亚"
 me_tartessia_14_tooltip:0 "任务‘#Y $karmo_task_4$#!’现已#G 完成#!"
 me_tartessia_15.a:0 "我身着国人的铠甲，带领军队冲锋陷阵"
 me_tartessia_15_desc:0 "塔尔特西亚社会中有许多人寻求#E 图耳德塔尼铠甲#!作为战斗装备，[ROOT.GetCountry.GetRuler.GetName]亦在其中，因为在保护生命方面，没有比这更好的胸甲或头盔。\n\n我们的铁匠勤奋工作，始终忙碌，淹没在无尽的工作海洋中，锤子的敲击声与锻炉的辉光是我们城市工坊的常伴。"
 me_tartessia_15_title:0 "图耳德塔尼铠甲"
 me_tartessia_15_tooltip:0 "任务‘#Y $tartessia_mission_inv_11_task$#!’现已#G 完成#!"
 me_tartessia_16.a:0 "我们时间不多，但必须准备！"
 me_tartessia_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]示意[ROOT.GetCountry.GetRuler.GetHerHis]顾问中途停止宣读讯息，难以控制[ROOT.GetCountry.GetRuler.GetHerHis]脸上的痛苦表情。片刻后，所有人离开[ROOT.GetCountry.GetRulerTitle]不适地端坐的房间，思索着一杯葡萄酒。渴望呼吸新鲜空气，[ROOT.GetCountry.GetRuler.GetFirstName]步出阳台，让凉风轻抚[ROOT.GetCountry.GetRuler.GetHerHis]的脸庞，俯瞰下方城市。\n\n来自外地的消息严峻，却非全然意外；[GetProvince('(int32)1374').GetName]公开觊觎我们家园的财富，甚至向[ROOT.GetCountry.GetCapital.GetName]送信，表明最终吞并我们的意图。\n\n‘我们不能坐视不理。你想夺取[ROOT.GetCountry.GetName]，卡尔莫？那我希望你准备好为此一战。’[ROOT.GetCountry.GetRuler.GetFirstName]低声自语，心思飞速计算各种可能。"
 me_tartessia_16_title:0 "准备工作"
 me_tartessia_16_tooltip:0 "任务‘#Y 准备工作#!’现已#G 完成#!"
 me_tartessia_17.a:0 "对那些对抗[ROOT.GetCountry.GetName]者，永远如此……"
 me_tartessia_17_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]城墙外，过去数日上演了一场恐怖场景，来自[GetProvince('(int32)1374').GetName]和[GetProvince('(int32)1369').GetName]的叛军与叛乱者被接连处决。\n\n[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]荣耀时刻宽宏大量，饶恕了许多人，然而仍有一些不幸者徒劳反抗命运的改变。随着妇女的哀嚎刺破空气，[ROOT.GetCountry.GetRuler.GetFirstName]面无表情，注视着斧头起落的血腥工作。"
 me_tartessia_17_title:0 "清除对手"
 me_tartessia_17_tooltip:0 "任务‘#Y 清除对手#!’现已#G 完成#!"
 me_tartessia_18.a:0 "我们欢迎所有和平来到[ROOT.GetCountry.GetName]之人……"
 me_tartessia_18_desc:0 "雄伟的#E 贝蒂斯河#!蜿蜒穿过[ROOT.GetCountry.GetAdjective]势力牢牢控制的土地，[GetProvince('(int32)1374').GetName]和[GetProvince('(int32)1369').GetName]，[ROOT.GetCountry.GetRuler.GetName]成功军事战役的珍贵战利品，与[GetProvince('(int32)1371').GetName]并肩闪耀，宛如镶嵌在精美王冠上的三颗璀璨宝石。\n\n区域冲突暂时平息后，当地经济开始复苏，许多贸易船从#E 利古斯廷湖#!驶入我们的土地。\n\n这些船只常载着精明的商人，希冀在我们的市场中发财，也有许多冒险者。关于[ROOT.GetCountry.GetName]机遇的消息传开，城门卫兵已数不清通过城门、希望重新开始生活的自由民。"
 me_tartessia_18_title:0 "三城联盟"
 me_tartessia_18_tooltip:0 "任务‘#Y 三城联盟#!’现已#G 完成#!"
 me_tartessia_19.a:0 "#E 巴力#!将从今日起护佑[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族！"
 me_tartessia_19_desc:0 "尽管我国腹地居住着#E 伊比利亚#!的虔诚信徒，[ROOT.GetCountry.GetCapital.GetName]的精英阶层长期崇拜由#E 迦太基#!旅人和商人带来的#E 迦南#!神祇。\n\n[ROOT.GetCountry.GetRuler.GetName]在本地传统与布匿世界的折中感到矛盾，终于决定[ROOT.GetCountry.GetRuler.GetHerHis]家族将做出重大抉择，拥抱迦南神系，不惜代价。即刻在[ROOT.GetCountry.GetCapital.GetName]外，高地上正建造祭坛，向风与雨之主献祭。"
 me_tartessia_19_title:0 "拥抱迦南理念"
 me_tartessia_19_tooltip:0 "任务‘#Y 拥抱迦南理念#!’现已#G 完成#!"
 me_tartessia_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]手指轻敲嘴唇，倚靠在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]座椅上，聆听使者的朗诵。房间中央聚集着一群外交官，一位演说者站在中心，宣读卷轴。\n\n‘……根据[ROOT.GetCountry.GetAdjective]人民的意志及#E 塔尔特西亚继承者#!的合法权威，我们特此宣称你们的土地归我们所有。自今日起，愿——’\n\n‘很好，很好。’[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]拍手，立即遣散面前的外交官。"
 me_tartessia_1_title:0 "塔尔特西亚的继承者"
 me_tartessia_1_tooltip:0 "任务‘#Y 塔尔特西亚的继承者#!’现已#G 完成#!"
 me_tartessia_2.a:0 "为我们而战的勇士将获得丰厚的金币"
 me_tartessia_20.a:0 "国与国之间的货物流动与交换惠及所有人"
 me_tartessia_20_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的市场中，各种外语交织于空气中；希腊语、布匿语和伊比利亚方言在价格谈判和金币交换中激昂喊出。\n\n多亏[ROOT.GetCountry.GetRuler.GetName]努力将我们的[ROOT.GetCountry.GetAdjective]商埠推向世界，外国贸易从未如此繁荣——关税与通行费充实国库便是明证。"
 me_tartessia_20_title:0 "贸易致富"
 me_tartessia_20_tooltip:0 "任务‘#Y 贸易致富#!’现已#G 完成#!"
 me_tartessia_21.a:0 "我自己也想不出比#E 哈斯塔#!更贴切的名字"
 me_tartessia_21_desc:0 "我们的[ROOT.GetCountry.GetAdjective]工程师与建筑师终于完成了[ROOT.GetCountry.GetCapital.GetName]港口区的扩建，欢迎众多渴望游览繁华首都中心庞大市场的外国访客。\n\n在哈斯塔，一切所需皆可觅得；来自遥远北方的毛皮与琥珀，伊比利亚北部沿海城市的玻璃制品，高卢的银金项圈，精雕细琢、嵌着朱砂眼的象牙小雕像……只要价格合适，一切皆可得。\n\n散布于[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]的部落开始称我们的首为‘#E 商人之都#!’，[ROOT.GetCountry.GetRuler.GetName]认为这一称号实至名归。"
 me_tartessia_21_title:0 "商人之都"
 me_tartessia_21_tooltip:0 "任务‘#Y 商人之都#!’现已#G 完成#!"
 me_tartessia_22.a:0 "毕竟，我们不能吃金子……"
 me_tartessia_22_desc:0 "尽管为在我们的[ROOT.GetCountry.GetAdjective]领地遍布农场筹集资金颇为困难，[ROOT.GetCountry.GetRuler.GetName]坚称稳定的粮食供应对[ROOT.GetCountry.GetName]的持续增长至关重要。\n\n现在，丰收滚滚而来，我们的粮仓塞得满满当当，[ROOT.GetCountry.GetCapital.GetName]内吝啬的声音终于沉寂。"
 me_tartessia_22_title:0 "图耳德塔尼的丰饶"
 me_tartessia_22_tooltip:0 "任务‘#Y 图耳德塔尼的丰饶#!’现已#G 完成#!"
 me_tartessia_23.a:0 "或许某天我会亲自参加一场讲座"
 me_tartessia_23_desc:0 "[ROOT.GetCountry.GetName]全境贸易的爆炸性增长不仅为我们的国家带来了难以想象的财富，更珍贵的礼物——知识——随金币一同流入我们的国度。\n\n[ROOT.GetCountry.GetCapital.GetName]的#E 学院#!建成后，迅速成为我们领土的智识生活中心，众多哲学家与贤者在它的大理石殿堂中相会，探讨高深的思想。"
 me_tartessia_23_title:0 "贸易启智"
 me_tartessia_23_tooltip:0 "任务‘#Y 贸易启智#!’现已#G 完成#!"
 me_tartessia_24.a:0 "#E 塔尔西斯#!将装备我们的士兵，充实我们的国库……这真是好消息"
 me_tartessia_24_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]收到[GetProvince('(int32)1415').GetName]矿山修复的消息时，[ROOT.GetCountry.GetRuler.GetSheHe]兴奋得脊背发凉。我们的工程师绕过了祖先耗尽的矿脉，最终发现了塔尔特西亚镐未触及的丰富@iron!铁#!矿脉。\n\n当一车车矿石运往[ROOT.GetCountry.GetCapital.GetName]的工坊加工时，所有人都清楚，[ROOT.GetCountry.GetName]发生了一件重大事件。"
 me_tartessia_24_title:0 "塔尔西斯矿山"
 me_tartessia_24_tooltip:0 "任务‘#Y 塔尔西斯矿山#!’现已#G 完成#!"
 me_tartessia_25.a:0 "让我们感恩，知晓无人能预知明日"
 me_tartessia_25_desc:0 "看到[ROOT.GetCountry.GetName]各地建造的矿山对[ROOT.GetCountry.GetAdjective]经济的重大影响，令人叹为观止。不仅我们的士兵受益于用于武器和铠甲的高品质金属，我们的铁匠与大师工匠也充分利用了可用的图耳德塔尼金属，效果显著。\n\n多亏我们在[ROOT.GetCountry.GetCapital.GetName]囤积的原材料盈余，我们的出口激增，为国库带来大量银币与金币。"
 me_tartessia_25_title:0 "图耳德塔尼金属"
 me_tartessia_25_tooltip:0 "任务‘#Y 图耳德塔尼金属#!’现已#G 完成#!"
 me_tartessia_26.a:0 "[ROOT.GetCountry.GetName]需要你这样的战士——我将记住你的名字"
 me_tartessia_26_desc:0 "从不吝啬于[ROOT.GetCountry.GetName]福祉的开支，[ROOT.GetCountry.GetRuler.GetName]投入巨额资金与个人政治资本，确保我们的征召兵熟悉古#E 塔尔特西亚#!的武器传统。\n\n当我们的士兵操练与训练我们尊贵祖先的武艺战术时，一位深受普通士兵欢迎的老战士，名叫#E 阿尔甘托尼奥斯#!，在一次训练中同时 disarm 四人，引起了[ROOT.GetCountry.GetRuler.GetFirstName]的注意。\n\n悄悄调查后，[ROOT.GetCountry.GetRulerTitle]得知这位阿尔甘托尼奥斯在战场上屡立战功，是晋升为领导职位的天然人选。"
 me_tartessia_26_title:0 "塔尔特西亚武器传统"
 me_tartessia_26_tooltip:0 "任务‘#Y 塔尔特西亚武器传统#!’现已#G 完成#!"
 me_tartessia_27.a:0 "我们的[ROOT.GetCountry.GetAdjective]面包是整个#E 伊比利亚#!最好的！"
 me_tartessia_27_desc:0 "造访[ROOT.GetCountry.GetCapital.GetName]的访客常说，进入主城门后首先闻到的是烘焙面包的美味香气，他们往往循着气味，来到遍布首都的众多面包店。\n\n多亏[ROOT.GetCountry.GetRuler.GetName]确保我们的主粮仓始终充盈，我们的人民从不担心下一餐从何而来。"
 me_tartessia_27_title:0 "充实的粮仓"
 me_tartessia_27_tooltip:0 "任务‘#Y 充实的粮仓#!’现已#G 完成#!"
 me_tartessia_28.a:0 "我感谢这份荣誉，这是我毕生事业的巅峰"
 me_tartessia_28_desc:0 "尽管贵族中一些保守派悄悄谴责这一举措，他们的公开不满未能阻止[ROOT.GetCountry.GetCapital.GetName]的市民在主广场中心为[ROOT.GetCountry.GetRuler.GetName]竖立一尊巨型雕像。\n\n虽然[ROOT.GetCountry.GetRuler.GetFirstName]从不承认，[ROOT.GetCountry.GetRuler.GetHerHis]内心在看到完成的雕像时充满骄傲，雕像展现了一位理想化的[ROOT.GetCountry.GetRulerTitle]，手持长矛，目光扫视地平线，搜寻[ROOT.GetCountry.GetName]的敌人。\n\n雕像在一场盛大的公开仪式上揭幕，聚集的群众雷鸣般掌声后，[ROOT.GetCountry.GetRuler.GetFirstName]站在人群前深深鞠躬，即兴发表演说。"
 me_tartessia_28_title:0 "致敬征服英雄"
 me_tartessia_28_tooltip:0 "任务‘#Y 致敬征服英雄#!’现已#G 完成#!"
 me_tartessia_2_desc:0 "尽管我们的初创舰队远非[GetCountry('CAR').GetName]等海军强国的对手，我们的小船足以载着外交官往返于[GetProvince('(int32)3061').GetName]，那是管理#E 毛里塔尼亚#!海岸的地方总督驻地，安全地坐落于[GetProvince('(int32)3061').GetName]的要塞之中。\n\n在向南方友人保证我们除恢复祖先名誉与荣耀外并无侵略意图后，我们达成了一致。我们承诺为复兴#E 伊比利亚#!的塔尔特西亚荣耀而战，并允诺若本地军队疲惫，将考虑雇佣#E 非洲#!的雇佣兵。\n\n消息传开后，[ROOT.GetCountry.GetRuler.GetName]欣喜地得知[ROOT.GetCountry.GetName]内有许多雇佣兵渴望加入我们的军饷名册。"
 me_tartessia_2_title:0 "非洲的联系"
 me_tartessia_2_tooltip:0 "任务‘#Y 非洲的联系#!’现已#G 完成#!"
 me_tartessia_3.a:0 "我们从矿山提取的矿石将重塑塔尔特西亚的根基！"
 me_tartessia_3_desc:0 "不久前，#E 塔尔特西亚#!的矿山以如今难以想象的产能运转，尽管我们尚未完全掌握祖先对大地的驾驭，[ROOT.GetCountry.GetRuler.GetName]决心以一切可能手段提升[ROOT.GetCountry.GetName]的产量。\n\n对我们的[ROOT.GetCountry.GetAdjective]征召兵而言幸运的是，矿山的财富并未流入[ROOT.GetCountry.GetCapital.GetName]富商的口袋——确实，我们的许多士兵获得了城中大师铁匠打造的精良武器，军队是这些物质财富的最大受益者。"
 me_tartessia_3_title:0 "修复古代矿山"
 me_tartessia_3_tooltip:0 "任务‘#Y 修复古代矿山#!’现已#G 完成#!"
 me_tartessia_4.a:0 "这些土地是#E 塔尔特西亚#!的重要部分，注定将迎来辉煌"
 me_tartessia_4_desc:0 "虽然北岸不如南部人口稠密——仅有[GetProvince('(int32)1339').GetName]和[GetProvince('(int32)1356').GetName]两城值得一提——但夺取#E 贝蒂斯河#!北岸的土地仍值得大肆庆祝。\n\n[ROOT.GetCountry.GetRuler.GetName]借机宣扬[ROOT.GetCountry.GetRuler.GetHerHis]的功绩，向[ROOT.GetCountry.GetName]的人民誓言，这只是更大成就的预兆。"
 me_tartessia_4_title:0 "贝蒂斯河北岸"
 me_tartessia_4_tooltip:0 "任务‘#Y 贝蒂斯河北岸#!’现已#G 完成#!"
 me_tartessia_5.a:0 "这些都是为了我们国家更大荣耀的必要步骤"
 me_tartessia_5_desc:0 "当昔日构成#E 塔尔特西亚#!核心的富裕城市向[ROOT.GetCountry.GetAdjective]旗帜臣服，[ROOT.GetCountry.GetRuler.GetName]毫不迟疑地对新征服地实施特别税收，以资助[ROOT.GetCountry.GetName]全境的建设项目。\n\n当一些愤怒的当地人争辩说，他们饱受战火蹂躏的社区需要这些资金重建时，他们的抱怨被[ROOT.GetCountry.GetRulerTitle]冷漠以对。"
 me_tartessia_5_title:0 "伊比利亚最南端"
 me_tartessia_5_tooltip:0 "任务‘#Y 伊比利亚最南端#!’现已#G 完成#!"
 me_tartessia_6.a:0 "这是我们人民将永远铭记的礼物……"
 me_tartessia_6_desc:0 "当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定在[GetProvince('(int32)1377').GetName]建造圣地，这位雄心勃勃的[ROOT.GetCountry.GetRulerTitle]秘密支付了一笔巨款，聘请大师石匠为该地打造一件珍宝。\n\n如今圣地已建成，华丽的#E 波尔库纳之牛#!雕像被安置于圣殿内，当地人称这是#E 伊比利亚南部#!最壮观的朝拜中心，甚至超越了附近[GetProvince('(int32)1287').GetName]的著名神龛。"
 me_tartessia_6_title:0 "波尔库纳之牛"
 me_tartessia_6_tooltip:0 "任务‘#Y 波尔库纳之牛#!’现已#G 完成#!"
 me_tartessia_7.a:0 "我们拥有希腊人感兴趣的奇珍异宝，反之亦然"
 me_tartessia_7_desc:0 "尽管我们的首都[ROOT.GetCountry.GetCapital.GetName]与东方王国的文明中心相距甚远，我们自豪地说，来自这些遥远之地的希腊商人航行至我们的市场，发现我们本地产品的价值，值得他们长途跋涉。\n\n[ROOT.GetCountry.GetRuler.GetName]长期以来优先考虑发展这些经济联系，尽管在首都建设市场代价高昂，但人人都能看到遵循[ROOT.GetCountry.GetRuler.GetName]建议的智慧——[ROOT.GetCountry.GetCapital.GetName]已成为贸易路线上的重要一站。"
 me_tartessia_7_title:0 "希腊贸易联系"
 me_tartessia_7_tooltip:0 "任务‘#Y 希腊贸易联系#!’现已#G 完成#!"
 me_tartessia_8.a:0 "我们将追求无尽的塔尔特西亚荣耀……"
 me_tartessia_8_desc:0 "尽管曾有人担忧塔尔特西亚语言会逐渐湮没，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]骄傲地宣布，[ROOT.GetCountry.GetCapital.GetName]的新#E 铸币厂#!将在我们的货币上铸刻塔尔特西亚的符号与文字。这些货币纯度极高，含银量与含金量充足，将确保其在本地长期流通。\n\n当[ROOT.GetCountry.GetAdjective]士兵将装满闪亮金币的货车运往地方政府和军队薪饷时，[ROOT.GetCountry.GetName]的梦想从未如此近在咫尺。"
 me_tartessia_8_title:0 "塔尔特西亚货币"
 me_tartessia_8_tooltip:0 "任务‘#Y 塔尔特西亚货币#!’现已#G 完成#!"
 me_tartessia_9.a:0 "每一代，我们都将庆祝丰收盛宴"
 me_tartessia_9.b:0 "这场庆典仅此一次"
 me_tartessia_9_desc:0 "[ROOT.GetCountry.GetCapital.GetName]的丰收节正盛大举行，这场盛事纪念[ROOT.GetCountry.Custom('get_harvest_goddess')]的慷慨恩赐，节日的盛大仪式即将来临。\n\n在城墙外的林地深处，一座仪式祭坛已准备就绪，摆放着最精美的[ROOT.GetCountry.GetAdjective]佳肴，斟满了进口的上等美酒。在这关键时刻，[ROOT.GetCountry.GetRuler.GetName]在祭司陪同下，牵着一匹马来到祭坛中央，停顿片刻，让祈祷与颂歌结束。\n\n片刻后，信号发出，[ROOT.GetCountry.GetRuler.GetFirstName]举起锋利的刀，划开马的喉咙，鲜血喷涌至下方祭台上。随着马倒地，祭坛被点燃，牲畜、食物与酒被烈焰吞噬，作为对[ROOT.GetCountry.Custom('get_harvest_goddess')]的献祭。"
 me_tartessia_9_title:0 "丰收节"
 me_tartessia_9_tooltip:0 "任务‘#Y 丰收节#!’现已#G 完成#!"
 mighty_tartessia:0 "强大的塔尔特西亚"
 mines_of_tharsis_turdetania_mod:0 "修复的塔尔特西亚矿山"
 onuba_task_1:0 "塔尔西斯矿山"
 onuba_task_1_DESC:0 "[GetProvince('(int32)1415').GetName]的古老矿山是我们国家的财富之源，我们应增加其产量。我们的铁匠定会乐于获得更多铁料加工。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 onuba_task_2:0 "图耳德塔尼金属"
 onuba_task_2_DESC:0 "冶金术是古#E 塔尔特西亚#!人精通的技艺，但他们的知识并未全部失传。我们的征召兵需要尽可能多的金属，让我们不负使命！\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 onuba_task_3:0 "塔尔特西亚武器传统"
 onuba_task_3_DESC:0 "奥努巴人是图耳德塔尼中最传统的一支，记得他人遗忘的共同历史。我们应探究他们的武艺传统。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 onuban_metal_production_boom:0 "金属生产热潮"
 oripp_task_1:0 "充实的粮仓"
 oripp_task_1_DESC:0 "尽管我们的部落成员是熟练的猎人，单靠野味养活国家纯属愚蠢。我们必须采取措施储备粮食，因为无人知晓众神的安排。\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 oripp_task_2:0 "致敬征服英雄"
 oripp_task_2_DESC:0 "因[ROOT.GetCountry.GetRuler.GetName]为[ROOT.GetCountry.GetName]人民做出了巨大贡献，[ROOT.GetCountry.GetCapital.GetName]的市民在首都中心为[ROOT.GetCountry.GetRulerTitle]竖立了一尊雕像。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 pos_neg_op_rew_karmo_tt:0 "若我们以#G 正面#!好感完成任务，#Y 阿斯蒂吉#!将成为#Y 附庸国#!。若以#R 负面#!好感完成任务，我们将#G 吞并#!#Y 阿斯蒂吉#!，但民众将#R 叛乱#!。"
 tartessia:0 "塔尔特西亚的后人"
 tartessia_BUTTON_TOOLTIP:0 "在光荣的塔尔特西亚从废墟中崛起之前，我们绝不懈怠！"
 tartessia_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]通过征服其故土并复兴王权，重塑南#E 伊比利亚#!的古老霸权——#E 塔尔特西亚#!时，此使命将视为完成。"
 tartessia_DESCRIPTION:0 "在#E 伊比利亚#!南部，#E 塔尔特西亚#!的辉煌曾在数世纪前名震四方，然而今日已不复存在。[ROOT.GetCountry.GetName]雄心勃勃的[ROOT.GetCountry.GetRulerTitle]愈发明确，[ROOT.GetCountry.GetSheHe]应将所有分散的#E 图耳德塔尼#!部落统一于一面旗帜之下。\n\n无人知晓复兴塔尔特西亚的尝试能否成功，众人的目光聚焦于首都[ROOT.GetCountry.GetCapital.GetName]，观察并等待着[ROOT.GetCountry.GetAdjective]人的下一步行动。"
 tartessia_mission_inv_10_task:0 "塔尔特西亚的重生"
 tartessia_mission_inv_10_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]完成了无人能及的伟业——复兴了#T 塔尔特西亚#!，当所有人都以为这个国家已从地球上永远消失。\n\n#G 完成此任务将为塔尔特西亚解锁新的任务树#!。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 tartessia_mission_inv_11_task:0 "图耳德塔尼铠甲"
 tartessia_mission_inv_11_task_DESC:0 "我们从土地中开采珍贵的矿石，加工成可用的金属，其中最珍贵的产品之一是#Y 图耳德塔尼铠甲#!。以此装备的[ROOT.GetCountry.GetAdjective]士兵拥有#E 伊比利亚#!最好的防护！\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 tartessia_mission_inv_12_task:0 "图耳德塔尼的丰饶"
 tartessia_mission_inv_12_task_DESC:0 "我们的土壤肥沃，食物丰盛，因此我们的勤劳农夫备受尊敬。然而，若想建造值得称道的庄园，他们需要[ROOT.GetCountry.GetName]的协助。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 tartessia_mission_inv_1_task:0 "塔尔特西亚的后人"
 tartessia_mission_inv_1_task_DESC:0 "数月之内，[ROOT.GetCountry.GetRuler.GetName]将发表一项大胆宣言——[ROOT.GetCountry.GetName]的部落特此宣布，我们意图重塑破碎的#T 塔尔特西亚王权#!，由[ROOT.GetCountry.GetRuler.GetFamilyDisplayName]家族夺回其王冠与断裂的权威！\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 tartessia_mission_inv_2_task:0 "非洲的联系"
 tartessia_mission_inv_2_task_DESC:0 "#E 迦太基#!的强大不容忽视，尽管未来我们或将与其军队交锋，但目前对[ROOT.GetCountry.GetName]而言，维持现有的良好关系更为明智。\n\n[ROOT.GetCountry.GetRuler.GetName]已派遣使团前往[GetProvince('(int32)3061').GetName]城，期望巩固我们的友谊——让我们拭目以待，看看我们的示好如何被接受。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 tartessia_mission_inv_3_task:0 "修复古代矿山"
 tartessia_mission_inv_3_task_DESC:0 "在古时候，#E 塔尔特西亚#!的物质力量源于附近山脉的矿藏财富，尽管大地已赐予我们的祖先诸多宝藏，仍有矿石等待发掘。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 tartessia_mission_inv_4_task:0 "贝蒂斯河北岸"
 tartessia_mission_inv_4_task_DESC:0 "昔日塔尔特西亚在#E 贝蒂斯河#!北岸的领地已逐一落入[ROOT.GetCountry.GetAdjective]手中，这一局势在[ROOT.GetCountry.GetCapital.GetName]的街头引发了空前的欢庆。\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 tartessia_mission_inv_5_task:0 "伊比利亚最南端"
 tartessia_mission_inv_5_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]发起的征服热潮势不可挡，聚集在#E 伊比利亚#!南端的众多城市纷纷臣服于看似无敌的[ROOT.GetCountry.GetRulerTitle]。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]立誓复兴古老的#T 塔尔特西亚#!，赢得了[ROOT.GetCountry.GetAdjective]人民的支持，他们为伊比利亚南部五座图耳德塔尼城市成为我们的领地而欢欣鼓舞。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 tartessia_mission_inv_6_task:0 "波尔库纳之牛"
 tartessia_mission_inv_6_task_DESC:0 "有人提议在[GetProvince('(int32)1377').GetName]城内建造一处圣地，让伊比利亚的信徒能如古时般朝拜。\n\n[ROOT.GetCountry.GetRuler.GetName]抓住机会，欲彰显塔尔特西亚的荣耀与慷慨，决定聘请[ROOT.GetCountry.GetName]最优秀的石匠，雕刻一件壮丽的珍宝。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 tartessia_mission_inv_7_task:0 "希腊贸易联系"
 tartessia_mission_inv_7_task_DESC:0 "来自遥远[GetProvince('(int32)84').GetName]甚至[GetProvince('(int32)516').GetName]的希腊商人偶尔造访[ROOT.GetCountry.GetCapital.GetName]的市场，这促使[ROOT.GetCountry.GetRuler.GetName]提议将这些贸易联系固化为永久关系。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 tartessia_mission_inv_8_task:0 "塔尔特西亚货币"
 tartessia_mission_inv_8_task_DESC:0 "为彰显[ROOT.GetCountry.GetCapital.GetName]日益增长的经济实力，我们决定在首都建造一座#T 铸币厂#!，铸造带有塔尔特西亚文字的货币。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 tartessia_mission_inv_9_task:0 "丰收节"
 tartessia_mission_inv_9_task_DESC:0 "一个月后，[GetProvince('(int32)1377').GetName]将举行一场向[ROOT.GetCountry.Custom('get_harvest_goddess')]致敬的节日，圣化那里的圣地。现在是感谢众神持续赐福的时刻，若我们有足够的金币支付费用，我们将能以盛宴庆祝丰收。\n\n#Y 每二十年我们将有机会资助一次丰收节#!。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"

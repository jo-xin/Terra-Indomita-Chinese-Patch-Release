l_simp_chinese:
 camel_cavalry_sogdia_mod:0 "粟特骆驼"
 camel_farms:0 "骆驼养殖场"
 desc_camel_cavalry_sogdia_mod:0 "我们精于培育战驼与长途行旅骆驼的驯养之道。"
 desc_camel_farms:0 "我们在迦尸岚建造了专门的养殖场，用于饲养骆驼。"
 desc_good_grazing:0 "我们拥有一些世界上最好的牧场，牲畜和马匹可以在那里尽情地吃草和游荡。"
 desc_heavenly_horses:0 "我们引进了最好的种马，并让最有经验的驯马师按照严格的标准训练它们。"
 desc_horse_farms:0 "我们在梅檀拘伽建立了专门的养殖场，用于养殖草原马。"
 desc_lake_fisheries:0 "我们在这里的湖岸边建立了渔业。"
 desc_narin_fort:0 "我们在那林的整个山口建造了一系列的防御工事。"
 desc_sogdian_bread:0 "因为我们已经建立了我们的农业基础设施，我们的田地产出了比以往更多的粮食，我们的人民从来不缺面包。"
 desc_sogdian_rock:0 "该省是被称为‘粟特岩’的令人印象深刻的防御工事的所在地。"
 desc_steppe_trading:0 "由于我们靠近北方草原，我们已经与他们的商人建立了联系。"
 establish_sogdian_emporium_price:0 "建立粟特商栈的花费"
 farming_settlement_tt:0 "我们需要在任何一个产粮区建立5个#Y 农业定居点#!"
 founding_sogdian_emporium_in_progress:0 "建设粟特商栈"
 good_grazing:0 "优质的牧地"
 heavenly_horses:0 "天马"
 horse_farms:0 "草原马场"
 lake_fisheries:0 "湖泊渔业"
 me_sogdia_1.a:0 "让我们都相信神灵赐予我们的祝福"
 me_sogdia_10.a:0 "有人说'胜者为王，败者为寇'......"
 me_sogdia_10_desc:0 "虽然有些声音认为，我们继续向西扩张正在破坏与邻国几十年的良好关系，但他们的反对意见几乎立即被忽略和遗忘。似乎我们的领导者，他们的胃口已经被血腥的味道磨得很尖锐，想继续向那些似乎已经成熟的富饶领土深入推进。"
 me_sogdia_10_title:0 "$sogdia_missions_task_10$"
 me_sogdia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_sogdia_11.a:0 "我们可以从一些人可能认为是幼稚的游戏中学到很多东西"
 me_sogdia_11_desc:0 "虽然现在是清晨，草地上的露水还未干，但居住在药杀水边的棚屋和小屋里的当地村民已经站在家门口，看着这个奇怪的景象；每隔几分钟，成群的骑兵就会沿着道路奔向平原，在空中掀起大片的灰尘，让大家争相回屋躲避。我们的骑兵首次有了长长的平坦的草原可以比赛，他们正在互相竞争，看谁是这片土地上最快的骑手。\n\n最吸引人的是，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 已经接受了这种做法，甚至亲自加入了这种即兴的比赛。一种友好的竞争精神已经传遍了整个军队，让全军有一种日益增长的兄弟情谊和新的目标，我们的士兵觉得很振奋。区域首府[GetProvince('(int32)7254').GetName]从未如此喧闹和活跃，当地渔民也从未如此忙碌过——总而言之，今天是个好日子，我的[ROOT.GetCountry.GetRulerTitle]。"
 me_sogdia_11_title:0 "$sogdia_missions_task_11$"
 me_sogdia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_sogdia_12.a:0 "这些旱地让人无法忍受......我等不及要去游泳了！"
 me_sogdia_12_desc:0 "在这些土地上，药杀水是唯一的道路，为商人和旅行者提供了一条穿过卡拉库姆沙漠北部迷宫般的荒地的纤细路线。当咸海的蓝色水域出现在地平线上时，这是一种极大的解脱；在沿着蜿蜒的平原穿过尘土飞扬的灌木丛数周后，人们不仅会欣赏风景的变化，而且同样期冀着在目的地痛快地洗个澡。\n\n对我们的人来说，幸运的是，当地人是热情、慷慨的人，对我们的军队非常欢迎。我们的士兵对风景的改变表示振奋，这是一种快乐的状态，我们对湖边的生活有了很大的了解。"
 me_sogdia_12_title:0 "$sogdia_missions_task_12$"
 me_sogdia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_sogdia_13.a:0 "请相信我，时间最重要"
 me_sogdia_13_desc:0 "我们在[GetProvince('(int32)7260').GetArea.GetName]的存在显然没有被当地人注意到，在我们确保沿咸海南岸的路线通畅的过程中，我们不得不将他们中的许多人赶出他们的家园。现在我们已经到达了乌浒河口，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]明智地要求我们尽快在库皮尔建造防御工事，甚至从我们的训练营中派出一千人到施工现场，以便实行两班倒。在这种极快的速度下，我们相信，我们将能够在一半的时间内建成一个堡垒，即便最后我们会多花一点钱。"
 me_sogdia_13_title:0 "$sogdia_missions_task_13$"
 me_sogdia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_sogdia_14.a:0 "缓慢而稳定地，我们将确保北部山区的安全"
 me_sogdia_14_desc:0 "虽然[GetProvince('(int32)6781').GetArea.GetName]地区的寒冷山路就在[GetProvince('(int32)6784').GetName]的门口，但我们必须承认，我们并没有完全控制这个区域——旦我们对战略领土的宣称完成，我们将有望在未来的日子里改变这种情况。"
 me_sogdia_14_title:0 "$sogdia_missions_task_14$"
 me_sogdia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_sogdia_15.a:0 "你真是太有哲理了"
 me_sogdia_15_desc:0 "虽然 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 访问时经过该地区时，水面上风浪很大，但这并不减少任何人在伊塞克湖上航行时的乐趣。尽管它是一个难以居住的地区，但它将成为我们不断扩大的领土的一个很好的补充，而那些在湖边勉强维持生计，在水中拖着渔网，在岸边抖动着它们的渔夫，都是善良的人。\n\n当地的渔民已经习惯了恶劣的天气，这是 [GetProvince('(int32)8755').GetName] 的生活现实，正如他们所说，尽管天空灰暗，日子还是要继续。"
 me_sogdia_15_title:0 "$sogdia_missions_task_15$"
 me_sogdia_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_sogdia_16.a:0 "除了战争，别无选择；它又来到了我们身边"
 me_sogdia_16_desc:0 "[GetProvince('(int32)5484').GetArea.GetName]离我们的权力中心所在相当遥远，但与我们传统家园的地理距离使得我们有着控制该地区的必要性。我们不寻求彻底吞并整个区域，但我们的军事顾问希望至少将我们的势力扩展到南部的萨里加米什湖水域，这也是我们的士兵乐意做的。"
 me_sogdia_16_title:0 "$sogdia_missions_task_16$"
 me_sogdia_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_sogdia_17.a:0 "让我们的敌人在我带领的复仇大军面前发抖吧！"
 me_sogdia_17_desc:0 "虽然我们王国付出的代价是惊人的，但所有人都知道，如果不是[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的领导，我们的人民将被彻底摧毁。在最近的记忆中，我们的人民被赶出了古老的家园，并被遣送到沙漠和山区作为游牧民族流浪，但尽管我们的命运发生了这种令人难以置信的变化，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]还是能够将我们的人民带回我们的家园。\n\n现在，在我们胜利的时刻，谁能说[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]不是诸神派来拯救我们的？谁能凝视[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]所做的工作而不看到神的杰作？愿诸神指引[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]在[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]继续带领我们的部队走向胜利——万福[ROOT.GetCountry.GetName]！"
 me_sogdia_17_title:0 "$sogdia_missions_task_17$"
 me_sogdia_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_sogdia_18.a:0 "没有我们的允许，任何人不得通过山区"
 me_sogdia_18_desc:0 "由于我们史无前例地在[GetProvince('(int32)6787').GetName]附近建立了防御工事，经过这些高地的旅行者可能很难将我们的堡垒与山脉本身区分开来。控制这个进入三个区域的战略门户将继续为我们整个国家带来和平与繁荣--我们在这里做得很好。"
 me_sogdia_18_title:0 "$sogdia_missions_task_18$"
 me_sogdia_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_sogdia_19.a:0 "我感谢你通知我这件事"
 me_sogdia_19_desc:0 "我们已经收到我们书记官的消息，我们对[GetProvince('(int32)6634').GetArea.GetName]的最北端领土的宣称已经完成——我们剩下要做的就是向他们宣战。"
 me_sogdia_19_title:0 "$sogdia_missions_task_19$"
 me_sogdia_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_sogdia_1_desc:0 "这个令全民族蒙羞的故事代代相传——狡诈的亚历山大率领士兵攀上粟特山崖要塞，趁守军猝不及防时施展诡计，致使惊慌的将士集体投降。正是这场灾难使我们骤然衰亡：当凝聚民族精神的要塞陷落，军心便土崩瓦解，众神亦背弃了我们，接踵而至的屈辱败绩如影随形。  \n\n而今我们终得弥补先祖之失！昔日要塞的断壁残垣已被重铸为钢铁壁垒。让这座堡垒成为民族回归的象征，化作未来雄心的丰碑——粟特定将洗雪前耻，攀登前所未有的巅峰！  "
 me_sogdia_1_title:0 "$sogdia_missions_task_1$"
 me_sogdia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_sogdia_2.a:0 "如果他们呆在自己的河边，这对大家都是最好的"
 me_sogdia_20.a:0 "我们欢迎大家亲自来看看"
 me_sogdia_20_desc:0 "当旅行者经过我们的土地并在我们的旅馆过夜时，很多时候会一起喝酒，舌头也会相应地放松，如果你愿意的话，欢快的谈话和噼啪作响的火堆会成为你整晚的伙伴。因此，当我们听到我们粟特人的声誉在遥远的城市似乎是一个模糊的形象时，我们感到非常有趣——人们说，我们被称为神秘的商人，也许是世界上最好的货物的提供者，但对我们没有太多的其他了解。\n\n尽管我们被认为爱钱胜过一切，但我们仍被视为和蔼可亲的人，总是乐于欢迎外国人来我们的市场，这些市场的规模必须亲眼目睹才能相信。商人们会走遍全世界，只为参观传说中的粟特集市，因为没有其他市场能比得上在一个地方发现的稀有商品数量。"
 me_sogdia_20_title:0 "$sogdia_missions_task_20$"
 me_sogdia_20_tooltip:0 "我们现可使用一项独特人物互动，允许[SCOPE.GetRootScope.GetCountry.GetName]的当前统治者建造一座#T 粟特商栈#!。$mission_completed_tooltip_1$“#Y $sogdia_missions_task_20$#!”$mission_completed_tooltip_2$"
 me_sogdia_21.a:0 "一个明智的领导者为明天而不仅仅是今天做计划"
 me_sogdia_21_desc:0 "许多人错误地认为，骆驼只能在非洲的沙漠和干旱地区找到，但有一些亚洲品种，虽然与它们的远房表亲略有不同，但同样健壮，能够在我们控制的尘土飞扬的高原上游荡数周而不需要水——这是我们的商人，我们经济的命脉，利用这一特点取得了巨大的收益。"
 me_sogdia_21_title:0 "$sogdia_missions_task_21$"
 me_sogdia_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_sogdia_22.a:0 "我们祈祷这次冲突是一场短暂的冲突"
 me_sogdia_22_desc:0 "聚集在乌浒河周围的巴克特里亚城市是一个诱人的战利品，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]一直无法忽视，现在我们发现自己公开要求得到他们的土地，并将我们的士兵布置在战争的位置。尽管我们已经多次与巴克特里人发生冲突，知道他们是劲敌，但我们的命运似乎纠缠在一起，无论好坏，诸神认为我们的儿子再次拿起武器对付他们是合适的。"
 me_sogdia_22_title:0 "$sogdia_missions_task_22$"
 me_sogdia_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_sogdia_23.a:0 "我们将不会犯之前许多人所犯的错误"
 me_sogdia_23_desc:0 "有很多关于军队的故事，他们的装备并不适合他们所行进的土地的崎岖地形，虽然他们的侦察员和他们的先锋队正在拼命地寻找敌军，但最大的威胁实际上是缺乏新鲜的饮用水。值得庆幸的是，我们有值得信赖的向导，他们会帮助我们穿过变幻莫测的沙地，走向绿洲的定居点。"
 me_sogdia_23_title:0 "$sogdia_missions_task_23$"
 me_sogdia_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_sogdia_24.a:0 "诸神是任性的，自由地给予，也同样迅速地夺走"
 me_sogdia_24_desc:0 "[GetProvince('(int32)6637').GetArea.GetName]，我们的劲敌，是一片有着悠久历史的土地--这些丘陵和山谷是琐罗亚斯德本人走过的地方；简直就是一个宗教诞生的国家。而现在，粟特的军队站在奥克苏斯河畔，准备亲自进入巴克特里亚的中心地带，甚至连[GetProvince('(int32)6678').GetName]的首都都是我们游动部队的目标。虽然没有人知道摆在我们面前的战斗结果，但我们都必须承认把我们带到历史上这个关键时刻的道路。"
 me_sogdia_24_title:0 "$sogdia_missions_task_24$"
 me_sogdia_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_sogdia_25.a:0 "你们这些懦夫不适合向真正的战士提出意见！"
 me_sogdia_25_desc:0 "我们的一些军事顾问对向巴克特里人发动战争的前景感到恐惧，并竭力破坏公众对正在提出的倡议的信心，这一事实激怒了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。\n\n虽然有些人认为这是夸张的说法，但 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 却非常认真，许多人在会议上提出他们的担忧后，震惊地发现武装的警卫在他们家门口。这些反对者被迫脱掉他们的衣服，穿上奴工的服装，然后在叛国罪的威胁下被送往缝制战争帐篷。"
 me_sogdia_25_title:0 "通往马拉坎达之路"
 me_sogdia_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_sogdia_26.a:0 "我们很幸运，妃子在我们需要的时候还记得我们"
 me_sogdia_26_desc:0 "虽然阿帕玛-斯皮塔梅尼德嫁给塞琉古一世已经将近二十年了，但她对粟特兄弟的爱和亲和力是整个帝国都知道的——她从来没有忘记她的人民的困境，没有忘记我们曾经的骄傲地位，她看到命运是如何打击我们，使我们沦落到有史以来最糟糕的境地。\n\n但是，有一点不为人所知的是她与[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的关系非常亲密，这是事实，因为当他们还是孩子的时候，他们的家庭就已经是快活的朋友了——粟特的贵族圈很小。\n\n正是通过这些渠道，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]能够向王后发送信息，要求她在粟特人试图重新征服[GetProvince('(int32)6682').GetName]的时候，在她的能力范围内做任何事情，以阻止她丈夫干涉。然而，当有消息传来，我们可以不惧怕塞琉古的军团而继续前进时，这真是一个严峻的时刻。未来的战争仍将非常难以进行，但希望诸神与我们同在。"
 me_sogdia_26_title:0 "$sogdia_missions_task_26$"
 me_sogdia_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_sogdia_27.a:0 "我为粟特所做的一切都有神性的触动"
 me_sogdia_27_desc:0 "[GetProvince('(int32)6682').GetName]——光是这个名字就足以让人联想到无尽的财富、汇聚四方奇珍的市集，以及由一位睿智而全能的统治者所治理的文明之邦，这位君主或许还是某位远古神祇的后裔……\n\n尽管众所周知马拉坎达（Marakanda）是一座潜力无限的城市，但即便[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]听闻了关于自己神性的流言，也未曾采取任何行动来平息这些传闻。"
 me_sogdia_27_title:0 "$sogdia_missions_task_27$"
 me_sogdia_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_sogdia_28.a:0 "除了永恒的荣耀，我们别无他求！"
 me_sogdia_28_desc:0 "我们的人民已经取得了巨大的进步，将我们的新首都 [GetProvince('(int32)6682').GetName] 建设成它注定要成为的地方，公共项目将这个饱受战火摧残的地方改造成我们的人民可以真正自豪的城市。我们可能没有世界上成熟的城市可能拥有的所有设施，但我们正在迅速赶上他们，我们的目标是超越我们周围的每个人，这是我们有希望达到的。"
 me_sogdia_28_title:0 "$sogdia_missions_task_28$"
 me_sogdia_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_28$#!' $mission_completed_tooltip_2$"
 me_sogdia_29.a:0 "你将拥有你所要求的一切，甚至更多"
 me_sogdia_29_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的众多才能之一是[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]对种马的眼光；在我们国家，很少有人对马的饲养和训练有更多了解，所以当一小群商人找到[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 提出了一个涉及动物的建议。\n\n他们认为在[GetProvince('(int32)7261').GetName] 发现的马匹品质优异，要求国家把这个地区划出来，明确用于培育草原马。为了推销这一点，他们把精心挑选的最健康的母马带到[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，让[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]亲自检查。看到这些动物后，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]没过多久就下定决心，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]立即批准了这个请求。"
 me_sogdia_29_title:0 "$sogdia_missions_task_29$"
 me_sogdia_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_29$#!' $mission_completed_tooltip_2$"
 me_sogdia_2_desc:0 "虽然我们多年来一直与萨卡邻居和平相处，但我们并非不知道他们逐渐侵占了本应属于我们的土地。首先，他们在我们的河边定居，甚至敢于把一些山地低地作为自己的土地？药杀水是划定我们领土的完美地点；是我们所能要求的最好的自然边界。必须让塞种人明白，我们不会允许他们在离我们土地一天路程的范围内定居！"
 me_sogdia_2_title:0 "$sogdia_missions_task_2$"
 me_sogdia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_sogdia_3.a:0 "让我们准备好迎接未来的战斗——它们将是激烈而残酷的"
 me_sogdia_30.a:0 "很奇怪，一件幸运的事会导致另一件幸运的事"
 me_sogdia_30_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们听说在[GetProvince('(int32)7256').GetArea.GetName]整个地区的当地人正在庆祝即兴的宗教节日的消息。人们似乎在感谢当地的神灵，因为他们给了我们的牛群良好的放牧地，现在牛群可以在草海中无休止地游荡，尽情地食用牧草。大家都知道，当民众幸福的时候，对那些负责民众福祉的人来说是一件好事。"
 me_sogdia_30_title:0 "$sogdia_missions_task_30$"
 me_sogdia_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_30$#!' $mission_completed_tooltip_2$"
 me_sogdia_31_title:0 "$sogdia_missions_task_31$"
 me_sogdia_31_tooltip:0 "我们现在可以在一个省建造#Y 粟特集市#!，一种特殊类型的市场，每十年一次。"
 me_sogdia_32.a:0 "每个人都喜欢以弱胜强的故事"
 me_sogdia_32_desc:0 "当后来的历史学者最终写下这场冲突时，我们毫不怀疑，每个时代的将军都会研究我们军队所采用的战术和后勤。不过，还是有很多敌人看起来无所不能，但他们却被不经意地征服了——这不正是亚历山大在征服阿契美尼德王朝时给整个世界上的教训吗？在一个以混沌为唯一确定性的世界里，任何事情都可能发生......"
 me_sogdia_32_title:0 "$sogdia_missions_task_32$"
 me_sogdia_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_32$#!' $mission_completed_tooltip_2$"
 me_sogdia_33.a:0 "我们将为我们的祖先报仇！荣耀属于粟特！"
 me_sogdia_33_desc:0 "镌刻在[GetProvince('(int32)4973').GetName]附近阿契美尼德宫殿墙上的石雕，至今仍可见我们祖先向奴役者进贡的场景——他们手捧金杯与兽皮，向征服者屈膝。历史学者们确信，我们所有的苦难都可追溯至居鲁士大帝，正是他的征服使我们走上这条直至近年才得以摆脱的屈辱之路。\n\n但往昔已逝，今朝当立。今日，索格底亚纳大军将穿越南部山口，剑指那些曾掠夺我们财富的城镇，心中唯有一念……复仇。"
 me_sogdia_33_title:0 "$sogdia_missions_task_33$"
 me_sogdia_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_33$#!' $mission_completed_tooltip_2$"
 me_sogdia_34.a:0 "大学在我们手中会更安全......"
 me_sogdia_34_desc:0 "今天下午在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]传来了战争开始的消息；似乎我们的士兵在几天前黎明后不久越过边界进入[GetProvince('(int32)7314').GetArea.GetName]，开始进攻当地。当我们的军事顾问专注于我们面前的巨大任务时，我们的学者却满足于研究[GetProvince('(int32)7314').GetName]的许多卷轴的梦想，这也是我们交战的主要目标。有些人甚至想知道，是否曾经为知识而发起过一场战争——这很可能是第一次。"
 me_sogdia_34_title:0 "$sogdia_missions_task_34$"
 me_sogdia_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_34$#!' $mission_completed_tooltip_2$"
 me_sogdia_35.a:0 "愿诸神指引我们实现目标"
 me_sogdia_35_desc:0 "虽然我们的人民曾经生活在南部的农田和丘陵，但环境迫使我们越来越向北，现在 [GetProvince('(int32)6784').GetName] 的寒冷山区是我们的家--这种情况没有人会感到高兴。\n\n我们的人民，即使他们以半游牧状态游荡在文明的边缘，也梦想着统治一个巨大的帝国，使他们能够沉浸在他们的第一爱好中；贸易和赚钱。即使是现在，我们中也有雄心勃勃的领导人，他们希望给粟特人带来更好的日子。\n\n愿万马奔腾的声音--我们可怕的马弓手和重骑兵--在山间山谷中回荡，带领我们的部队走向胜利！"
 me_sogdia_35_title:0 "我们现在处于十字路口。"
 me_sogdia_35_tooltip:0 "是时候创造历史了..."
 me_sogdia_36.a:0 "什么？朕何时准许巴克特里亚独立？等着人头落地吧......"
 me_sogdia_36.b:0 "阿帕玛不会这样背叛我……应该不会吧？"
 me_sogdia_36_desc:0 "哦，[ROOT.GetCountry.GetRuler.GetName]，我们有令人不安的消息禀报您：我们的附庸[GetCountry('BAC').GetName]似乎不再承认我们的权威。他们与[GetCountry('SOG').GetName]卷入了某种争端，而我们的密探报告说，两国如今正在彼此死战，愿诸神乐意将他们双方都毁灭。\n\n我们的密探也不愿分享下面这个故事，但他们最终还是在巨大压力下说了出来：据说您的妻子[ROOT.GetCountry.GetRuler.GetSpouse.GetName]，她是粟特流亡统治者的童年好友，不知为何牵涉进了这场灾难，不过没有证据能证明她参与其中。"
 me_sogdia_36_title:0 "巴克特里亚人的背叛"
 me_sogdia_36_tooltip:0 "#E 巴克特里亚#!已不再是我们的#G 总督领#!"
 me_sogdia_37.a:0 "塞琉古王朝背弃了我们……"
 me_sogdia_37_desc:0 "#E [GetCountry('SOG').GetAdjective]#!人愚蠢地向我们宣战，但我们必将把他们彻底碾碎。这些蓬头垢面的山野之犬，是发了什么疯竟敢入侵我国领土？蝼蚁也敢挑衅雄狮。\n\n蹊跷的是，当粟特人入侵的消息传到驻[ROOT.GetCountry.GetCapital.GetName]的塞琉古外交官耳中时，他们非但没有向[ROOT.GetCountry.GetRuler.GetName]通报，反而在深夜不告而别。\n\n有传言称他们收受了贿赂，但事实是[GetCountry('SEL').GetName]不会在此次冲突中援助我们。"
 me_sogdia_37_title:0 "塞琉古的沉默"
 me_sogdia_37_tooltip:0 "#E 塞琉古帝国#!已不再是我们的#G 宗主国#!"
 me_sogdia_3_desc:0 "任何住在[GetProvince('(int32)6704').GetArea.GetName]山谷一个月路程内的人都熟悉这个地区的出口；他们不仅在农田里种植好的粮食，这在这么远的北方是很罕见的，而且据说他们还有很好的马。我们对向这一地区扩张没有任何顾虑，即使其居民不愿意离开他们的山村。"
 me_sogdia_3_title:0 "$sogdia_missions_task_3$"
 me_sogdia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_sogdia_4.a:0 "仍有许多城市需要我去攻克......"
 me_sogdia_4_desc:0 "短短几年前，我们所取得的成就如同奇迹一般，但这是事实；[GetProvince('(int32)6704').GetName]、[GetProvince('(int32)6703').GetName] 和 [GetProvince('(int32)6682').GetName]，我们地区最重要的三个城市，都已落入我们的势力范围，将永远成为我们统治的一部分。由于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]带领我们的部队取得了无数次的胜利，外国人经常用'Poliorketes'，或者'围城者'这个绰号来指代[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]——对此，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]已经欣然接受。"
 me_sogdia_4_title:0 "$sogdia_missions_task_4$"
 me_sogdia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_sogdia_5.a:0 "我们渴望这些东西，以及进入巴克特里亚的西部门户"
 me_sogdia_5_desc:0 "乌浒河是[GetProvince('(int32)6799').GetArea.GetName]领土的命脉，使当地人可以在河边的平原上进行各种农业活动。除了种植蔬菜和麻类等重要作物外，人们还在缓缓流淌的河岸边还饲养着马匹和各种牲畜。管理这个地区会给我们带来巨大的经济收益，同时也会加强我们的整体军事安全。"
 me_sogdia_5_title:0 "$sogdia_missions_task_5$"
 me_sogdia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_sogdia_6.a:0 "即便是我，也难挡这般铁骑冲锋......"
 me_sogdia_6_desc:0 "现在我们能够全年为牲畜提供足够的饲料，我们在首都训练坐骑时，看到了令人振奋的景象。每个人都能清楚地看到这些来自[GetProvince('(int32)6704').GetArea.GetName]山谷的动物是多么优越，当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]看着骑兵们练习他们的动作时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]明显听到金戈铁马之声。这些动物的野蛮凶猛，令人难以相信！"
 me_sogdia_6_title:0 "$sogdia_missions_task_6$"
 me_sogdia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_sogdia_7.a:0 "谁不喜欢交易？我们都可以一起赚钱"
 me_sogdia_7_desc:0 "虽然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]个人并不想在广阔的草原上生活，但有很多人感受到边疆以外生活的不可抗拒的召唤，放弃他们知道的一切，生活在我们无法理解的无法无天的社会里。尽管我们对草原居民的记录很少，但我们确实知道他们偶尔会派商人到我们的北方定居点，以交换他们自己无法制造的东西。在适当的推动下，如果北方人有同样的愿望，我们可以使这些关系永久化。我们的市场会因为有他们的货物而受益。"
 me_sogdia_7_title:0 "$sogdia_missions_task_7$"
 me_sogdia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_sogdia_8.a:0 "让这种饥饿感给他们带来一些奋斗的动力"
 me_sogdia_8_desc:0 "战场上的士兵们最怀念家乡生活的一件事就是我们城市里的新鲜面包。我们独特的面包是圆形的，上面撒有研磨好的草药和种子，被烤得金黄完美，通常每餐都要吃。虽然我们的人做的以供干粮的面包是足够的——也许由于我们优秀的粟特谷物而比其他地方好，但每个人都希望他们能吃上家乡出产的好面包。"
 me_sogdia_8_title:0 "$sogdia_missions_task_8$"
 me_sogdia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_sogdia_9.a:0 "诸神会对这种表现感到高兴！我们的财主也会感到高兴。我们的财务人员也会......"
 me_sogdia_9_desc:0 "随着我们不断征服异教徒从我们这里抢走的土地，我们获得了大量的金银雕像--这些雕像是从我们发现的异教神灵的寺庙和神殿里拿出来的。在我们的宗教领袖进行了一些简短的发言后，我们最终决定将这些雕像熔化并制成硬币，以便我们所有的人都能从战争的战利品中获益。"
 me_sogdia_9_title:0 "$sogdia_missions_task_9$"
 me_sogdia_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $sogdia_missions_task_9$#!' $mission_completed_tooltip_2$"
 narin_fort:0 "那林的要塞"
 new_establish_sogdian_emporium_price:0 "建立粟特商栈的花费"
 recently_established_tt:0 "每隔#Y 10#!年才能建造一个粟特商栈！"
 recently_established_tt_2:0 "粟特商栈每年只能建造一次。"
 sogdia_friend_tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]与[GetProvince('(int32)6682').GetOwner.GetOverlord.GetRuler.GetSpouse.GetName|Y]是朋友。"
 sogdia_missions:0 "万马奔腾之国"
 sogdia_missions_BUTTON_TOOLTIP:0 "有些人声称，粟特最好的日子已经是遥远的过去，但我们知道得更清楚！"
 sogdia_missions_CRITERIA_DESCRIPTION:0 "当粟特征服了一些历史上的领土，确保了北方的贸易区，并确立了自己作为一个强大的贸易力量时，该使命完成。"
 sogdia_missions_DESCRIPTION:0 "很久以前，粟特人的生活没有被与他人的纠葛所束缚；这是在居鲁士领导的波斯人征服我们的土地并将我们的边界分割成几个世纪以来一直处于模糊状态之前的时期。波斯人和现在的希腊人将我们的命运与我们南方的巴克特里亚人的命运纠缠在一起，他们将我们从祖先的家园中赶走，并从他们沿乌浒河的城市中欺负我们。我们从他们那里独立出来是最近的事情；多年来，我们作为巴克特里亚人的坐骑被统治，而巴克特里亚人又被其他人统治，使我们沦为仆人的仆人，但我们不再是奴隶，尽管我们是否能够保持这种自由是一个未解决的问题。"
 sogdia_missions_task_1:0 "恢复岩堡"
 sogdia_missions_task_10:0 "沿着平原向西"
 sogdia_missions_task_10_DESC:0 "从我们在[GetProvince('(int32)7251').GetName]的有利位置来看，那里的山脉开始逐渐向平地过渡，我们可以看到[GetProvince('(int32)7250').GetArea.GetName]的平原将是一个放牧的好地方。很快，再次攻击我们的敌人的时候就要到了——荣耀在等待着我们的士兵！\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 sogdia_missions_task_11:0 "驰骋河岸"
 sogdia_missions_task_11_DESC:0 "因为我们已经征服了一大片药杀水沿岸的平坦乡村，我们的一些士兵已经利用这一点，秘密地与他们的马匹比赛，以看看谁是最快的。也许我们应该加入部队，看看这些比赛的情况如何？\n\n\n\n\n\n\n\n\n\n@persia_mil13!"
 sogdia_missions_task_12:0 "到达海岸"
 sogdia_missions_task_12_DESC:0 "空气中弥漫着一种奇怪的咸味，这是我们的人民和我们的马匹所不熟悉的气味......当地人声称，它来自西部的一个大水体，被称为咸海或Lacus Oxianus，取决于你问谁。现在我们已经征服了这个地区的首府，我们将搜寻这片土地，看看我们能从其居民那里收集到什么智慧。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 sogdia_missions_task_13:0 "绕过黑沙"
 sogdia_missions_task_13_DESC:0 "我们的部队已经征服了卡拉库姆沙漠的北部，使我们更接近于著名的斯基泰人的土地。鉴于我们的危机感，我们应该加倍努力，在[GetProvince('(int32)7260').GetName]周围的战略区域建造要塞；如果我们有意愿，我们可以在正常情况下花费一半的时间建造工事。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 sogdia_missions_task_14:0 "向北远行"
 sogdia_missions_task_14_DESC:0 "[GetProvince('(int32)6781').GetArea.GetName]地区就像一条走廊，将入侵的军队和好奇的商人输送到这里，他们都在寻求同样的东西，尽管手段不同。控制这一地区，使其既能进入我们的腹地，又能通往费尔干纳河谷的北部路线，已成为我们国家的优先事项，但其偏远的地理位置将使编造宣称需要时间。\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 sogdia_missions_task_15:0 "伊塞克湖"
 sogdia_missions_task_15_DESC:0 "我们发现自己拥有伊塞克湖周围地区的想法愈发迫切，原因很多，其中湖泊提供的宁静是最重要的......以及当地的鱼类供应，这是很美味的。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 sogdia_missions_task_16:0 "大斯基泰"
 sogdia_missions_task_16_DESC:0 "来自[GetProvince('(int32)7260').GetName]的边境要塞的消息！斯基泰人对我们在该地区的存在感到不满，他们每天都会派出小股部队越过边境，骚扰我们的驻军。虽然[GetProvince('(int32)5484').GetArea.GetName]离我们的首都很远，但我们必须向该地区派兵，平定这个野蛮的地区。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 sogdia_missions_task_17:0 "粟特的神化"
 sogdia_missions_task_17_DESC:0 "当马其顿军队第一次穿过我们的土地，让我们措手不及，并在一次令人羞愧的失败后他们把我们带到了北方，许多人认为这将是粟特力量的终结，但他们错了！我们的智者告诉我们，诸神密谋派遣一位应许者来恢复我们以前的荣耀，现在胜利的时刻已经来临，我们将承认在我们中间行走的神灵。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 sogdia_missions_task_18:0 "那林的要塞"
 sogdia_missions_task_18_DESC:0 "问问任何一个在[GetProvince('(int32)6704').GetArea.GetName]山谷旅行的商人，你会听到同样的话；[GetProvince('(int32)6787').GetName]的山口是整个地区的门户，谁控制了山口，谁就能密切控制贸易路线的情况。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 sogdia_missions_task_19:0 "在山峦之间"
 sogdia_missions_task_19_DESC:0 "在我们进入[GetProvince('(int32)6634').GetArea.GetName]的腹地之前，我们必须控制山脉之间的土地——我们不能让任何我们不认可的人进入高地。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 sogdia_missions_task_1_DESC:0 "被称为'粟特岩'的古老堡垒曾经被认为是坚不可摧的，但这是在多年前野蛮人亚历山大从我们手中夺走它，打破了这种幻想。现在我们已经[GetProvince('(int32)6682').GetName]已经在它的合法主人——我们手中，我们应该竭尽全力重建岩堡。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 sogdia_missions_task_2:0 "我们的药杀水"
 sogdia_missions_task_20:0 "粟特集市"
 sogdia_missions_task_20_DESC:0 "如今我们已掌控北方贸易要道——这条从咸海通向伊塞克湖的安全商路至关重要。现在，我们可以开始建造真正粟特风格的宏伟市集了。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 sogdia_missions_task_21:0 "骆驼农场"
 sogdia_missions_task_21_DESC:0 "[GetProvince('(int32)7270').GetName]以生活在该地区的骆驼而闻名，因为经常可以发现它们在河流附近的尘土飞扬的平原上徘徊。通过一些努力，我们可以利用大自然无偿提供给我们的东西，真正在这个地区有所作为，特别是如果我们在附近修建道路的话。\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 sogdia_missions_task_22:0 "突袭[GetProvince('(int32)6691').GetArea.GetName]"
 sogdia_missions_task_22_DESC:0 "渐渐地，[GetProvince('(int32)6637').GetArea.GetName]的富饶中心地带向我们敞开怀抱。虽然争夺[GetProvince('(int32)6694').GetName]的战斗会很激烈，但当战争结束后，我们可以夺取该地区的自然资源来补偿。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 sogdia_missions_task_23:0 "触摸塔里木"
 sogdia_missions_task_23_DESC:0 "我们的战争把我们带到了塔里木盆地的门口，这块土地的名声在千里之内人人皆知。我们可以派遣军队进入沙漠，去寻找我们经常听说的富饶的绿洲......\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 sogdia_missions_task_24:0 "[GetProvince('(int32)6637').GetArea.GetName]之战"
 sogdia_missions_task_24_DESC:0 "曾经，我们的国家对来自[GetProvince('(int32)6637').GetArea.GetName]的统治者表示效忠，我们被迫向那些从不为我们的人民着想的领导人送去繁重的贡品。然而，这些日子已经成为遥远的记忆，当我们的军队聚集在[GetProvince('(int32)6637').GetArea.GetRegion.GetName]地区之外时，我们很难相信我们即将入侵我们以前的主人。一旦坎达拉省是我们的，这个国家的其他地方应该很快会屈服于我们的逐步推进。\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 sogdia_missions_task_25:0 "通往马拉坎达之路"
 sogdia_missions_task_25_DESC:0 "在阿契美尼德王朝时期，我们的土地与巴克特里亚同属一个总督辖区，两国人民自由跨境往来。正因如此，我们的人民渴望收复南方失地，尤其是[GetProvince('(int32)6682').GetName]城。甚至有人说，与其让巴克特里亚总督管理[GetProvince('(int32)6682').GetArea.GetName]的门户，不如交给粟特国王统治更为妥当。\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 sogdia_missions_task_26:0 "高位之友"
 sogdia_missions_task_26_DESC:0 "塞琉古帝国的统治者迎娶了粟特公主[GetProvince('(int32)6682').GetOwner.GetOverlord.GetRuler.GetSpouse.GetName]。尽管她如今的生活必定大不相同，但想必仍心系故土子民的困境。若能派人暗中联络这位旧友，我们或许就能兵不血刃地拿下[GetProvince('(int32)6682').GetName]城，避开她丈夫大军的干涉……\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 sogdia_missions_task_27:0 "粟特的首都"
 sogdia_missions_task_27_DESC:0 "虽然与巴克特里人作战并非易事，但我们能够夺回那些字面上承载着我们祖先、我们人民名字的省份——我们必须搬出山中的城市，在马拉坎达占据我们应有的位置。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 sogdia_missions_task_28:0 "一个真正的家园"
 sogdia_missions_task_28_DESC:0 "自从我们南迁后，我们正在尽一切努力使[GetProvince('(int32)6682').GetName]有家园的感觉，在美化我们的新首都时，我们不惜靡费重金。\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 sogdia_missions_task_29:0 "养马人"
 sogdia_missions_task_29_DESC:0 "一些最优秀的养马人私下与我们联系，要求我们出资在 [GetProvince('(int32)7261').GetName] 建立一个养种马的农场。如果我们能够筹集到资金，我们的顾问认为这是一个值得追求的好主意。自然我们还需要好的道路来把动物送到市场。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 sogdia_missions_task_2_DESC:0 "萨卡人已经越过了药杀水，占领了低地平原，甚至占据了北部的部分山口。我们应该考虑把他们推回他们来的地方... ...\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 sogdia_missions_task_3:0 "两河交汇的山谷"
 sogdia_missions_task_30:0 "优质的牧地"
 sogdia_missions_task_30_DESC:0 "[GetProvince('(int32)7254').GetArea.GetName]一望无际的平原对牲畜来说是很好的土地；我们不仅可以在这里放牧，而且还有野生动物可以捕捉，这里还是成群的马匹自由驰骋的地方...我们获得这些领土是很不错的。\n\n\n\n\n\n\n\n\n\n@persia_mil19!"
 sogdia_missions_task_32:0 "没有办法的事"
 sogdia_missions_task_32_DESC:0 "我们正在面临一场艰难的战争，但我们知道，我们必须在这里取得成功，然后才能梦想着做其他事情。然而，告诉我们的士兵不要失去信心！我们将与我们的敌人殊死搏斗，并将在最后取得胜利！\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 sogdia_missions_task_33:0 "戳击巨人"
 sogdia_missions_task_33_DESC:0 "几个世纪以来，我们的人民被迫向遥远的国王送去贡品，而这些国王有时甚至从未访问过我们的国家——哦，在一个陌生人面前卑躬屈膝是多么羞耻！但现在，历史的风向已经改变。现在，上天与我们同在，我们希望能让我们的前主人卑躬屈膝。\n\n\n\n\n\n\n\n\n\n@egypt_mil15!"
 sogdia_missions_task_34:0 "呾叉始罗大学"
 sogdia_missions_task_34_DESC:0 "位于[GetProvince('(int32)7314').GetName]的大学是整个世界上最杰出的学习中心之一，无数的学者和圣人不远万里来到Glausae省，希望能跟随大师学习。有传言说它的墙内储存着宝物，而且不仅仅是卷轴上的那种......我们可以准备宣称，占领整个地区，自己去调查。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 sogdia_missions_task_3_DESC:0 "我们最想做的就是把我们的统治权扩展到美丽的[GetProvince('(int32)6704').GetArea.GetName]山谷，但为了做到这一点，我们必须首先准备好我们的宣称，并把我们的力量聚集在一起。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 sogdia_missions_task_4:0 "三城的大胜"
 sogdia_missions_task_4_DESC:0 "因为[ROOT.GetCountry.GetRuler.GetName]带领我们战胜了一个又一个敌人，取得了惊人的胜利，轻松夺取了该地区最大的城池，[ROOT.GetCountry.GetRuler.GetSheHe]已经被称为'围城者'，这个名字是当之无愧的。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 sogdia_missions_task_5:0 "乌浒河畔"
 sogdia_missions_task_5_DESC:0 "我们的政治利益迫使我们征服大片领土，特别是那些有河流穿过的地区，如乌浒河，我们不能允许其他人控制这些经济要道，所以我们准备好我们的宣称，并为战斗做好准备。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 sogdia_missions_task_6:0 "天马"
 sogdia_missions_task_6_DESC:0 "我们有机会获得人类已知的最好的马匹，这不是什么秘密——事实上，整个世界都很清楚这一事实，无论好坏。但是，当其他国家只是简单地进口这些宏伟的野兽时，我们却有一个长期的、完善的传统，即在国内训练我们的坐骑。\n\n这些雄伟的骏马需要最好的饲料，所以我们必须建造一个粮仓，专门为它们提供饲料。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 sogdia_missions_task_7:0 "联系草原商人"
 sogdia_missions_task_7_DESC:0 "我们的土地被认为是在文明和野蛮的边界上，而我们处于两者的中间。北部草原上有各种各样的游牧民族，也有一些人会冒险到周边地区与定居的民族进行交易。我们应该主动出击，建立贸易联系。\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 sogdia_missions_task_8:0 "灌溉药杀水"
 sogdia_missions_task_8_DESC:0 "诸神给了我们一些世界上最好的土地，这样一个令人敬畏的责任要求我们成为我们所获得的东西的优秀管理者。我们的农田很肥沃，产量很高，但如果我们药杀水的河水引到灌溉渠中，我们相信我们可以种植比以前更多的作物。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 sogdia_missions_task_9:0 "融化神像"
 sogdia_missions_task_9_DESC:0 "很久以前，萨卡人曾经和我们有相同的信仰，但他们被外国人的奇怪的神灵所吸引，接受了七神崇拜。现在，他们不再向长生天祈祷，而是向人的手所制作的金银雕像鞠躬。我们将摧毁这些可憎的东西，并将这片土地从偶像崇拜的污点中净化出来！\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 sogdian_bread:0 "粟特面包"
 sogdian_emporium:0 "粟特商栈"
 sogdian_emporium.1.a:0 "这真是个好消息！"
 sogdian_emporium.1.desc:0 "我们从我们的首席工程师那里得到消息，一个新的粟特集市已经完成了。即使是现在，在建设完成仅仅几天之后，数以百计的市民已经涌向新区，那里混乱的景象和气味--异国的香料在拥挤的街道上飘荡，卖烤肉和锅的小店，在堆满刺绣纺织品和精美丝绸的摊位旁争论价格的嘈杂声音，牲畜嘶嘶，笼中鸟鸣，这些声音几乎淹没了所有的感官。"
 sogdian_emporium.1.t:0 "一个新的粟特商栈"
 sogdian_emporium_act:0 "在一个有价值的定居点建立粟特商栈。\n#! 粟特商栈是一种特殊的市场类型，只有通过这种互动才能建立。这种互动只能每隔#Y 10#!年采取一次。"
 sogdian_emporium_select_title:0 "选择一个省份，我们将在那里建立一个粟特商栈"
 sogdian_emporium_tt:0 "获得一个独特的角色互动，让[SCOPE.GetRootScope.GetCountry.GetName]的现任统治者建造一个#T 粟特商栈#!。\n\n"
 sogdian_rock:0 "粟特山岩"
 steppe_trading:0 "草原贸易联系"
 war_2_tt:0 "我们将对[GetProvince('(int32)6682').GetOwner.GetName|Y]#R 宣战#!，且[GetProvince('(int32)6682').GetOwner.GetName]不会介入。"
 war_tt:0 "#R 宣战#!在未获得#Y 塞琉古帝国#!支援的情况下，因[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]#E 与#![GetProvince('(int32)6682').GetOwner.GetOverlord.GetRuler.GetSpouse.GetName]的关系，向[GetProvince('(int32)6682').GetOwner.GetName|Y]开战"

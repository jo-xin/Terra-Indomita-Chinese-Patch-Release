l_simp_chinese:
 court_of_joseon_mod:0 "朝鲜朝廷"
 desc_court_of_joseon_mod:0 "#E王俭#!朝廷被誉为#E辰#!全境文明之最。"
 desc_joseon_border_patrols:0 "因忧我边疆不稳，吾等于北方诸区增派了军事巡逻。"
 desc_joseon_bustling_capital:0 "#E王俭#!正值繁荣，皆因明智投资。"
 desc_joseon_chinese_influence:0 "华夏文化对朝鲜之影响不可低估。"
 desc_joseon_prosperous_hinterland:0 "都城外各处领土中的作坊产能丰沛，为我诸城供应各式精工良造之货物。"
 desc_joseon_the_end_mod:0 "终结乱世战火，开启和平繁荣。"
 desc_wanggeom_harbour_mod:0 "朝鲜所进行之大规模建设倡议，已使#E 王俭#!城成为海上枢纽。"
 joseon_border_patrols:0 "边境巡逻"
 joseon_bustling_capital:0 "繁盛都城"
 joseon_chinese_influence:0 "华夏影响"
 joseon_mission_tree:0 "古老王国，新家园"
 joseon_mission_tree_BUTTON_TOOLTIP:0 "南方沃土召唤——取之即是！"
 joseon_mission_tree_CRITERIA_DESCRIPTION:0 "当#E 朝鲜#!向南扩张，征服并同化朝鲜半岛诸部之后，此使命即告完成。"
 joseon_mission_tree_DESCRIPTION:0 "将近两千年前，我族神话中的领袖#E檀君#!——天帝之孙——册立其嗣为#E朝鲜#!之王，自那个预兆性的时刻起，我族便一直与西部及北方的邻邦进行着艰苦卓绝的斗争。\n\n近来与西方#E燕#!国的冲突已促使我方军事思想发生转变，加之北方及东方部落侵袭的持续威胁，共同推动了朝鲜向南挺进。这将是一条我们必须以血开辟的道路，然而我古老王国之未来，系于我们在一个无处可寻安全的世界中提供安全的能力。"
 joseon_mission_tree_task_1:0 "可守之都"
 joseon_mission_tree_task_10:0 "南方诸盟"
 joseon_mission_tree_task_10_DESC:0 "既然已惩戒了蛮横的#Y高夷#!之民，我们可将目光转向南方，转向那些效忠于#E辰国#!的城邦联盟——任何敢于与我们图谋作对的联盟，无论是防御性的还是其他性质的，我们都将予以粉碎！\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 joseon_mission_tree_task_10_claims_tt:0 "获得#Y石弩佛寺#!、#Y百济#!、#Y武遂#!和#Y古离#!宣称。"
 joseon_mission_tree_task_11:0 "通靖海之路"
 joseon_mission_tree_task_11_DESC:0 "将疆域拓展至#E鲸海#!之滨，我们便打开了通往异域市场的大门——这对[ROOT.GetCountry.GetRuler.GetName]而言是一次个人的凯旋，他向我族子民许诺过如此胜利。\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 joseon_mission_tree_task_12:0 "终章"
 joseon_mission_tree_task_12_DESC:0 "#E辰国#!那可笑的首都、卑微的聚落#E目支#!既已落入我军之手，我在南方的全面彻底胜利便已几乎毫无悬念——南方独立的时代已屈辱地走向终结。\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 joseon_mission_tree_task_12_claims_tt:0 "我们将获得对#Y南马韩#!、#Y弁韩#!和#Y辰韩#!诸省的宣称权。"
 joseon_mission_tree_task_13:0 "初章"
 joseon_mission_tree_task_13_DESC:0 "每一个终结之中皆蕴藏着开端；太阳每日落山，然每逢清晨，黎明的承诺便再度更新。在我们着手构建一个新王国——一个囊括整个半岛及其上所有不同族群的王国之际，让我们铭记这些智慧的教诲。\n\n这片土地的未来已与#E朝鲜#!的命运交织在一起；彼此再不会分离。\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 joseon_mission_tree_task_13_reward_tt:0 "可选一行省建造#Y城市#!。"
 joseon_mission_tree_task_13_reward_tt_2:0 "#Y南马韩#!、#Y弁韩#!和#Y辰韩#!的每一省份都将获得#Y朝鲜之和平#!修正，降低本地叛乱并提高异文化幸福度。"
 joseon_mission_tree_task_14:0 "繁荣腹地"
 joseon_mission_tree_task_14_DESC:0 "#E王俭#!周边地区得天独厚，蕴藏着各类自然资源——优质的石料、染料，甚至山中出产的琥珀令我们目不暇接。尽我们所能向作坊投入资金，以便我们的工匠能将货物销往远方的市场。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 joseon_mission_tree_task_1_DESC:0 "近来与#E燕#!国的冲突令我们质疑将都城设于距其边境如此之近是否明智。我们应放弃#E险渎#!的沼泽之地，迁往#E王俭#!附近的平原，那里更易于保卫家园。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 joseon_mission_tree_task_2:0 "防燕"
 joseon_mission_tree_task_2_DESC:0 "我邦在#E徒河#!的聚居地——争议中的辽西省首府——正位于燕国区域首府的对面。既然我们预见到与燕的战争将持续不断，必须在靠近敌人的地方修筑一座要塞。拆除#E险渎#!的旧防御工事，于边境附近重建。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 joseon_mission_tree_task_3:0 "巡边"
 joseon_mission_tree_task_3_DESC:0 "来自北方定居部落的#E草原骑手#!不断穿越形同虚设的边境，绕过我们简陋的防御工事，随心所欲地发动袭击。由于修筑一连串防御工事耗资巨大，我们必须加强边境巡逻以防此类事件发生。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 joseon_mission_tree_task_4:0 "新都"
 joseon_mission_tree_task_4_DESC:0 "我们正在新都#E王俭#!安居下来，一切顺利，然而在建设当地基础设施方面仍有大量工作要做。让我们尽力将其建设为[ROOT.GetCountry.GetAdjective]人民的真正家园。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 joseon_mission_tree_task_5:0 "朝鲜朝廷"
 joseon_mission_tree_task_5_DESC:0 "#Y朝鲜宫廷#!的名声正广为传播，如同无云之夜的明月般散发着文明与文化的光辉。有幸在#E王俭#!受到[ROOT.GetCountry.GetRuler.GetName]款待的旅人，无不屏息传颂着城中宫殿里无尽的奢华与辉煌。\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 joseon_mission_tree_task_6:0 "王俭港"
 joseon_mission_tree_task_6_DESC:0 "#E王俭#!坐落于#E大同江#!之畔，拥有作为巨型造船厂之未竟潜力——一处商贾与海军皆可停泊船只的枢纽。提高海军能力将有益于贸易，亦能增强我军事战备。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 joseon_mission_tree_task_7:0 "对中贸易"
 joseon_mission_tree_task_7_DESC:0 "#E渤海#!对岸的我#E中国#!邻邦将是极佳的贸易伙伴，若能增进经济合作，我们或许还能进一步加强政治联系——在异域结交一些朋友对我们大有裨益。\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 joseon_mission_tree_task_8:0 "开化影响"
 joseon_mission_tree_task_8_DESC:0 "几乎无法抗拒南方#E中国#!友邦的影响。既有诸多可向他们学习之处，我们决定全心全意接纳其文化。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 joseon_mission_tree_task_8_unlocked_trads_tt:0 "将获得#Y狄#!军事传统。"
 joseon_mission_tree_task_9:0 "东方紧张"
 joseon_mission_tree_task_9_DESC:0 "东部诸部落对我定居之民构成威胁，我们再也不能坐视不理。集结部队，告知他们辉煌的战斗正在前方等候！\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 joseon_mission_tree_task_9_claims_tt:0 "获得#Y高夷#!、#Y沃沮#!和#Y东濊#!宣称。"
 joseon_prosperous_hinterland:0 "繁荣腹地"
 joseon_the_end_mod:0 "朝鲜太平"
 me_joseon_1.a:0 "愿诸神同行，吾等书写历史"
 me_joseon_10.a:0 "天降横财，感恩不尽"
 me_joseon_10_desc:0 "即使在一年中最风平浪静的月份，航行#E渤海#!亦可谓险象环生，但#E齐#!国繁华的市场——尤其是位于其[GetProvince('(int32)8514').GetName]城的那些——吸引着我等坚韧的商人，他们甘冒生命危险、以肢体为赌注，在汹涌波涛中航行以牟取利润。\n\n总而言之，[ROOT.GetCountry.GetRuler.GetName]，我方确实获益匪浅；我朝与齐国的政治经济联系日益紧密，齐国刀币源源不断流入我府库之中。"
 me_joseon_10_title:0 "华夏贸易之缘"
 me_joseon_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_10$#!' $mission_completed_tooltip_2$"
 me_joseon_11.a:0 "取人之长，非示弱也"
 me_joseon_11_desc:0 "虽我辈昔日曾与华夏之民有所冲突——众人皆知我等同西面#E燕#!国之争——然其文化与文明之中，确有与我相得益彰之处。\n\n正如我朝与#E齐#!国之贸易联系所昭示，学习邻邦之道，获益良多。\n\n有人对[ROOT.GetCountry.GetRuler.GetName]所议之策表示抗拒，称背弃我传统神灵乃逾越之举，然在#E朝鲜#!境内，已无人敢质疑君上之令。"
 me_joseon_11_title:0 "革新之风"
 me_joseon_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_11$#!' $mission_completed_tooltip_2$"
 me_joseon_12.a:0 "两军会猎于战场，吾必凯旋而归"
 me_joseon_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已向环伺于美好[ROOT.GetCountry.GetName]周围的诸部落首领发出最后通牒——蛮族已知，那#E高夷#!之地、#E沃沮#!之地以及#E东濊#!之地，已不再归彼等所有。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]意识到，只要好战部落仍盘踞于地平线外，我定居之民便永无宁日，故已立誓将其逐一彻底消灭。\n\n当然，#E部落酋长#!对此嗤之以鼻，扬言要威胁我城池，但我等毫不退缩。"
 me_joseon_12_title:0 "东方角力"
 me_joseon_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_12$#!' $mission_completed_tooltip_2$"
 me_joseon_13.a:0 "无所畏惧，纵使辰国武士——此域吾必取之！"
 me_joseon_13_desc:0 "在我邦之南，盘踞着众多部落，彼等据守弹丸之地，向#E辰国#!宣誓效忠。虽我辈迄今设法避免在该地区陷入持久战，但那样的日子即将终结。\n\n不幸的是，这些部落的聚落恰挡在我扩张之路上，故必亡于朝鲜雄师之手。"
 me_joseon_13_title:0 "南方诸盟"
 me_joseon_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_13$#!' $mission_completed_tooltip_2$"
 me_joseon_14.a:0 "备我旗舰，吾欲亲航新海一观"
 me_joseon_14_desc:0 "虽我辈多年来以#E渤海#!水域为家，然既已夺取东岸，我等便可开始探索#E鲸海#!了。人人皆在颂扬[ROOT.GetCountry.GetRuler.GetName]之功，若无[ROOT.GetCountry.GetRuler.GetHerHis]之指引，此事绝无可能发生。"
 me_joseon_14_title:0 "通航鲸海"
 me_joseon_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_14$#!' $mission_completed_tooltip_2$"
 me_joseon_15.a:0 "万事皆有终，日久自明…"
 me_joseon_15_desc:0 "#E辰国#!之权势已被永久摧毁，[ROOT.GetCountry.GetRuler.GetHerHis]旧都[GetProvince('(int32)9595').GetName]已化为灰烬，作为献给战神的祭品。毁灭彻底无遗；该地区除了一排排面容憔悴、正被押往[GetProvince('(int32)8801').GetName]的新俘奴隶外，已别无他物。\n\n当朦胧的硝烟缭绕于战场之上，[ROOT.GetCountry.GetRuler.GetName]阴冷一笑，转身背对那片废墟。"
 me_joseon_15_title:0 "终章"
 me_joseon_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_15$#!' $mission_completed_tooltip_2$"
 me_joseon_16.a:0 "海岸之#E 日南#!将建一城"
 me_joseon_16.b:0 "秀丽之#E 东那#!，祥瑞之地"
 me_joseon_16.c:0 "于#E 于宇#!山间筑城"
 me_joseon_16_desc:0 "我朝在南方的征服之战已至辉煌终点，此时[ROOT.GetCountry.GetRuler.GetName]处，有工师前来进献一项激动人心的提议。\n\n既已认识到我辈在该地区立足未稳，遂有人提议兴建一座真正的朝鲜城池；此举不仅可为我民奠定基业，更可打消任何以为我辈仅暂居于此的愚蠢念头。"
 me_joseon_16_title:0 "开篇"
 me_joseon_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_16$#!' $mission_completed_tooltip_2$"
 me_joseon_17.a:0 "灭亡已不可免…吾等安然归降"
 me_joseon_17.b:0 "遣返来使，整军备战！"
 me_joseon_17_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们迎来了一支#E朝鲜#!的使团，但您不会喜欢他们带来的消息。\n\n双方照例寒暄之后，使节便直言不讳：彼等此来非为示好，而是来下最后通牒。我们要么允许朝鲜在我城池驻军，事实上沦为藩属，要么就只能眼睁睁看着他们的士兵屠戮我之家人。\n\n这算不上什么选择，但却是我们必须做出的决定，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_joseon_17_title:0 "外交斡旋"
 me_joseon_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_17$#!' $mission_completed_tooltip_2$"
 me_joseon_18.a:0 "感念本地工匠之辛勤"
 me_joseon_18_desc:0 "时日渐移，[ROOT.GetCountry.GetRuler.GetName]当初将都城从[GetProvince('(int32)8781').GetName]迁至[GetProvince('(int32)8801').GetName]的决定，证明愈发英明。新都不但临海通航，此优势正成为巨大资产，且#E王俭#!腹地之工坊与农庄，其出产之精良，乃#E朝鲜#!前所未有。\n\n由此得以充实，我辈预见都城将持续繁荣——实为天赐之福，我等皆亲身体会。"
 me_joseon_18_title:0 "繁荣腹地"
 me_joseon_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_18$#!' $mission_completed_tooltip_2$"
 me_joseon_19.a:0 "愿诸神同行，吾等书写历史"
 me_joseon_19_desc:0 "天兆已显，[ROOT.GetCountry.GetRuler.GetName]，上苍之意昭然若揭：若[ROOT.GetCountry.GetName]不能顺应时势之变，我古老王国便将彻底毁灭，片石不留。\n\n我辈处境艰危，然此并非意味着我无路可走。我王[ROOT.GetCountry.GetRuler.GetFirstName]将需行走于一条精细平衡之道，但前路已然分明。\n\n我辈须尽一切所能，护我子民免于#E燕#!与#E扶余#!之敌，同时向南拓展。此后数年定当危机四伏，然我之雄心壮志，远胜于对未来之恐惧。"
 me_joseon_19_title:0 "古国新居"
 me_joseon_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ancient Kingdom, New Home#!' $mission_completed_tooltip_2$"
 me_joseon_1_desc:0 "天兆已显，[ROOT.GetCountry.GetRuler.GetName]，上苍之意昭然若揭：若[ROOT.GetCountry.GetName]不能顺应时势之变，我古老王国便将彻底毁灭，片石不留。\n\n我辈处境艰危，然此并非意味着我无路可走。我王[ROOT.GetCountry.GetRuler.GetFirstName]将需行走于一条精细平衡之道，但前路已然分明。\n\n我辈须尽一切所能，护我子民免于#E燕#!与#E扶余#!之敌，同时向南拓展。此后数年定当危机四伏，然我之雄心壮志，远胜于对未来之恐惧。"
 me_joseon_1_title:0 "古国新居"
 me_joseon_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y Ancient Kingdom, New Home#!' $mission_completed_tooltip_2$"
 me_joseon_2.a:0 "吾等将迁都至大同江畔之王俭城"
 me_joseon_2_desc:0 "无需村中长老，任何人都会记得上一次我西面宿敌#E燕#!大军携攻城槌兵临#E险渎#!城下之景。我邦毗邻其边境，事实上几乎注定了不久之后又将面临持久围城。\n\n虽我辈与这片沼泽地中的都城渊源深远，[ROOT.GetCountry.GetRuler.GetName]仍做出了不受欢迎的决定：放弃我古老家园，南迁定居。"
 me_joseon_2_title:0 "$joseon_mission_tree_task_2$"
 me_joseon_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_2$#!' $mission_completed_tooltip_2$"
 me_joseon_3.a:0 "再忍耐几日，疲惫的双足即可安歇，孩子们…"
 me_joseon_3_custom_mission_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_3$#!' $mission_completed_tooltip_2$"
 me_joseon_3_desc:0 "今晨，一支绵延数百里之长的队伍自故都#E险渎#!旧址出发。过去数月间，我民一直在料理后事，了结契约，收拾行装，等待[ROOT.GetCountry.GetRuler.GetName]的号令。我们任又一个收获季节匆匆而过，以确保尽可能多地储备粮食，终于，当积攒的稻米足以支撑我们度过寒冬之后，[ROOT.GetCountry.GetRuler.GetFirstName]便下令南行。\n\n当这支由国民组成的长队蜿蜒穿过丘陵与平原，朝#E大同江#!方向前进时，[ROOT.GetCountry.GetRuler.GetFirstName]正走在队伍最前列，向[ROOT.GetCountry.GetRuler.GetHerHim]周围之人予以慰勉之词。"
 me_joseon_3_title:0 "易守之都"
 me_joseon_4.a:0 "须取羡都之材以供沱河之建"
 me_joseon_4_desc:0 "因[ROOT.GetCountry.GetRuler.GetName]决意必须在[GetProvince('(int32)8773').GetName]修筑防御工事，遂下达了令人痛心的命令：拆除我在#E险渎#!的旧城堡。\n\n尽管工人们开始拆除先祖所砌城墙之时，泪流满面，[ROOT.GetCountry.GetRuler.GetFirstName]却不为所动。"
 me_joseon_4_title:0 "夷平要塞"
 me_joseon_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_4$#!' $mission_completed_tooltip_2$"
 me_joseon_5.a:0 "燕人永不能克此城矣！"
 me_joseon_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我等接获消息，[GetProvince('(int32)8773').GetName]的工程终于竣工，此事令我在#E燕#!国之敌大为不快。彼等已派出小股部队试探我防线，但一发现我城墙何其坚固，便几乎立即折返。\n\n攻击毫无防备的#E朝鲜#!的日子已一去不返；若说有何不同，那便是我敌须当警惕，因我辈若有意，亦可主动出击。"
 me_joseon_5_title:0 "沱河要塞"
 me_joseon_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_5$#!' $mission_completed_tooltip_2$"
 me_joseon_6.a:0 "远离故土之侵者，吾必尽灭之"
 me_joseon_6_custom_mission_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_3$#!' $mission_completed_tooltip_2$"
 me_joseon_6_desc:0 "因手头尚缺兴建永久防御工事之资源，[ROOT.GetCountry.GetRuler.GetName]便转向次优之选——我朝军队——并下令斥候在北方丘陵与荒原间持续巡逻。\n\n虽不能完全免于草原之劫掠，但我骑兵在关键时刻足以独当一面。"
 me_joseon_6_title:0 "$joseon_mission_tree_task_3$"
 me_joseon_7.a:0 "勿疑我决断，吾自知何为至善"
 me_joseon_7_desc:0 "今晨吾等欣喜若狂，[ROOT.GetCountry.GetRuler.GetName]，因听闻[GetProvince('(int32)8801').GetName]正欣欣向荣。虽曾有人以为迁都乃是灾难性之决断，为暗日将至之凶兆，然如今已无人再能道出这些非议了。\n\n简而言之，#E王俭#!便是当今显赫之地——我民众多抛家弃宅，期盼能在都城为自己开辟新生。"
 me_joseon_7_title:0 "新都"
 me_joseon_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_7$#!' $mission_completed_tooltip_2$"
 me_joseon_8.a:0 "若我为诗人，亦愿居王俭"
 me_joseon_8_desc:0 "[GetProvince('(int32)8801').GetName]正迅速赢得文化中心之美誉，此处画师与乐师同将军与君王比肩共处。作为我社稷基石的仪礼歌舞，正在我新家蓬勃发展，众多远道而来之人亲耳聆听我民族鼓舞人心的故事。\n\n至于邻邦之朝堂则不值一提——我等已听闻那些蛮人如何生活的传闻，实不堪复述——天下皆知，#E朝鲜#!社稷之座，犹如暗夜明灯，闪耀四方。"
 me_joseon_8_title:0 "朝鲜朝廷"
 me_joseon_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_8$#!' $mission_completed_tooltip_2$"
 me_joseon_9.a:0 "欢庆吧，朝鲜——吾于此地确有建树"
 me_joseon_9_desc:0 "清晨，太阳尚未攀越#E太白山脉#!之巅，[GetProvince('(int32)8801').GetName]的繁忙港区已是熙熙攘攘。在那里，睡眼惺忪的店主在盘旋海鸥饥渴的啼鸣声中摆出货物，满载着来自#E中国#!与#E印度#!贸易品的船只抵达我港。丁香与肉桂等芳香香料在集市中飘荡，撩拨鼻息，晨光如火焰般在商贩小心翼翼陈列的金银玉饰上闪烁。甲板水手与搬运工将忙碌卸货直至入夜，小睡几个时辰，明日一切周而复始。\n\n虽有人觉得港口的无尽喧嚣令人不安与窒息，[ROOT.GetCountry.GetRuler.GetName]却在这片混沌中欣喜不已，深知这正是经济蓬勃之兆。"
 me_joseon_9_title:0 "王俭港"
 me_joseon_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $joseon_mission_tree_task_9$#!' $mission_completed_tooltip_2$"
 wanggeom_harbour_mod:0 "王俭之港"

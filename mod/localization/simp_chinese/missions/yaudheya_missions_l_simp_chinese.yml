l_simp_chinese:
 PN5_ADJ:0 "五河"
 are_you_STUUPID_tt:0 "……什么？"
 ask_for_mahasenapati:0 "请求大统帅"
 ask_for_mahasenapati_desc:0 "[GetCountry('YDD').GetName|E]联盟是一个非常有用的附庸。历史上，他们为其宗主的军队提供了精锐战士大统帅，或称大统帅。我们可以请求他们的领袖成为我们的军队指挥官。\n\n#E 将提出请求，但可能不被接受。#!"
 blood_of_pandava:0 "般度的血脉"
 blood_of_pandava_desc:0 "般度是般度五子的养父。每位兄弟通过一位女子般遮丽联结，她误嫁给了所有兄弟。坚战和阿周那两兄弟成为了俱卢国的罗阇。很久之后，阿周那一脉的迦那梅伽亚之子和坚战一脉的普拉提文提耶之子分别统治了药地耶联盟的不同部分。"
 declare_war_dards_tt:0 "#R 向[GetCountry('NBA').GetName|E]宣战！#!"
 declare_war_on_paurava_tt:0 "#R 向[GetCountry('PRA').GetName|E]宣战！#!"
 defensive_dards:0 "达德山民"
 every_man_a_merchant:0 "马利安市场"
 fight_for_your_right_tt:0 "根据你的选择获得#Y 军事加成#!。\n根据你的选择获得#Y 文化幸福度加成#!。"
 hastinapura_homes:0 "象城的家园"
 he_believes_you_tt:0 "[GetCountry('MRY').GetRuler.GetPraenomen]相信你的故事。"
 he_doesnt_believe_you_tt:0 "[GetCountry('MRY').GetRuler.GetPraenomen]驳回了你的故事。"
 he_somehow_buys_it_tt:0 "[GetCountry('MRY').GetRuler.GetPraenomen]……尽管你愚蠢，却不知为何被说服了。"
 hes_angry_at_you_tt:0 "[GetCountry('MRY').GetRuler.GetPraenomen]因你的谎言惩罚你。"
 kshatriya_warriors:0 "刹帝利精锐战士"
 maharaja_senapati_loyalty:0 "忠诚于大王统帅"
 mahasenapati_arrives_tt:0 "#E 药地耶#!的#Y 大统帅#!已抵达为你效力。"
 mahasenapati_arrives_tt_not:0 "我们将在#Y 5年内#!#E 无法#!再次提出此类请求。"
 make_panchnagara_league_tt:0 "在[GetProvince('(int32)4340').GetArea.GetName|E]和[GetProvince('(int32)4384').GetArea.GetName|E]两个地区建立#Y 殖民地#!。"
 mallian_marriages:0 "马利安的婚姻"
 mallian_marriages_desc:0 "马利安家族的婚姻对马利安人民的幸福度产生了深远影响。他们现在更加支持我们，在共和国中找到了超出预期的位置。"
 mallian_mercenaries:0 "马利安雇佣兵"
 mallian_merchants_tt:0 "[GetProvince('(int32)4349').GetArea.GetName|E]内的每个省份获得以下修正："
 me_yaudheya_1.a:0 "世界将在我们的尚武共和国前颤抖。"
 me_yaudheya_10.a:0 "外交带来何等喜悦。"
 me_yaudheya_100.a:0 "当然，我们不需要那个偏僻之地。"
 me_yaudheya_100.b:0 "放弃土地？哈哈……滚出去。"
 me_yaudheya_100_desc:0 "#E 药地耶联盟#!请求我们放弃对[GetProvince('(int32)9263').GetArea.GetName|E]地区的控制。他们的论点很有趣，我们损失不大。他们认为在该地区拥有一座拥有超过#E 30#!个人口的热门行政城市，给予他们这片土地将暂时为我们带来财政自由，摆脱这个乡村地区。我们该如何回应他们的大统帅？"
 me_yaudheya_102.a:0 "多么遗憾！"
 me_yaudheya_102_desc:0 "孔雀王朝拒绝了我们控制[GetProvince('(int32)9263').GetArea.GetName|E]的请求！尽管如此，下[GetProvince('(int32)9263').GetArea.GetName|E]的人民仍在呼吁加入我们的国家。我们对该地区的权利是合法的。"
 me_yaudheya_10_desc:0 "孔雀王朝接受了我们控制[GetProvince('(int32)9263').GetArea.GetName|E]的请求！该地区人民的喧嚣在#E 罗塔克#!都能听到！"
 me_yaudheya_10_title:0 "$yaudheya_missions_task_10$"
 me_yaudheya_10_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_10$#!’现已#G 完成#!!"
 me_yaudheya_11.a:0 "[GetDeityDefinition('omen_kartikeya').GetName]保佑我们的刀锋！"
 me_yaudheya_110_desc:0 "我的罗阇！可怕的[GetCountry('YDD').GetName|E]#E 联盟#!即将对我们宣战！#E 孔雀王朝#!允许了此事！宫廷一片恐慌，#E 布罗伐#!能存活吗？我们该怎么办？"
 me_yaudheya_111.a:0 "我们将尽我们所能。"
 me_yaudheya_11_desc:0 "波罗斯王国，[GetCountry('PRA').GetName|E]，终将走向终结。[GetCountry('MRY').GetRuler.GetPraenomen|E]允许我们攻击他们，感谢我们的外交努力，我们将宣战征服他们的整个国家！"
 me_yaudheya_11_title:0 "$yaudheya_missions_task_11$"
 me_yaudheya_11_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_11$#!’现已#G 完成#!!"
 me_yaudheya_12.a:0 "萨卡拉的衬衫、裙子和袜子，人人皆有！"
 me_yaudheya_12_desc:0 "#E 萨卡拉#!是我们敌人在#E 波拉瓦#!的前首都，现已归我们所有。其纺织品远超整个#E 印度#!的任何城市，其荣耀超越了#E 马利阿#!城市的能力。继续#E 萨卡拉#!的辉煌，进入我们领导的新时代，是理所当然的。"
 me_yaudheya_12_title:0 "$yaudheya_missions_task_12$"
 me_yaudheya_12_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_12$#!’现已#G 完成#!!"
 me_yaudheya_13.a:0 "人人都是……商人？"
 me_yaudheya_13_desc:0 "美妙的#E 马利阿#!地区！单是这个省份的谷物就足以养活整个#E 印度#!。宏伟的城市并肩而立，真是独一无二的地方。据说来自天涯海角的商人在#E 马利阿#!聚集。此外，我们对该地区的征服进一步提升了下旁遮普的声誉。"
 me_yaudheya_13_title:0 "$yaudheya_missions_task_13$"
 me_yaudheya_13_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_13$#!’现已#G 完成#!!"
 me_yaudheya_14.a:0 "若有一本关于战争艺术的书就好了……"
 me_yaudheya_14_desc:0 "#E 奢叉尸罗#!，或我们称之的#E 塔克萨西拉#!，是任何学生、教师或教育人士的必到之地。虽然我们当然对刀枪的兴趣远超笔墨，但若忽视#E 塔克萨西拉#!这座历史悠久且奇妙的城及其大学，我们将失职。"
 me_yaudheya_14_title:0 "$yaudheya_missions_task_14$"
 me_yaudheya_14_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_14$#!’现已#G 完成#!!"
 me_yaudheya_15.a:0 "我一直觉得马利安女子很美。"
 me_yaudheya_15_desc:0 "与#E 马利安#!的婚姻从未被禁止，但他们缺乏继承和签订法律合同的权利。现在，他们拥有这些基本权利，并对我们的统治表现出热烈的支持。我们的共和国建立在#E 刹帝利#!之上，但这并不意味着我们不能公平对待其他种姓的人。"
 me_yaudheya_15_title:0 "$yaudheya_missions_task_15$"
 me_yaudheya_15_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_15$#!’现已#G 完成#!!"
 me_yaudheya_16.a:0 "[GetProvince('(int32)7385').GetName|E]，我们来了。"
 me_yaudheya_160.a:0 "我们将从山中防御！"
 me_yaudheya_160_desc:0 "我的领主！可怕的[GetCountry('YDD').GetName|E]#E 联盟#!即将对我们宣战！#E 孔雀王朝#!允许了此事！宫廷一片恐慌，我们能存活吗？我们该怎么办？"
 me_yaudheya_16_desc:0 "#E 达德人#!的时代已到尽头。我们进攻高耸于#E 斯塔尼什瓦拉#!之上的山脉，不将整个[GetProvince('(int32)7385').GetArea.GetName|E]置于我们控制之下，绝不返回。"
 me_yaudheya_16_title:0 "$yaudheya_missions_task_16$"
 me_yaudheya_16_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_16$#!’现已#G 完成#!!"
 me_yaudheya_17.a:0 "建立五城联盟！"
 me_yaudheya_17.b:0 "我们是一个统一的共和国。"
 me_yaudheya_17_desc:0 "[GetProvince('(int32)4380').GetArea.GetName|E]一直以来都是声誉卓著、贸易繁荣、人民富足的地区，拥有一切人们梦想之物。然而，它在被我们引入#E 刹帝利#!共和控制之前，基本由#E 拉贾#!和#E 拉尼#!统治。这对我们来说很好，但他们可能不这么认为。因此，建立一个新的合作伙伴联盟——#E 五城联盟#!，五座城市的联盟，可能是有益的。\n\n这样做将使我们受益于他们的全力合作，增加#E 谷物#!、#E 丝绸#!、#E 贸易#!和#E 布料#!的产量。或者我们可以保留对该地区的行政控制，直接管理他们的税收和产品。虽然效率较低，但更安全。我们该怎么办？"
 me_yaudheya_17_title:0 "$yaudheya_missions_task_17$"
 me_yaudheya_17_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_17$#!’现已#G 完成#!!"
 me_yaudheya_18.a:0 "五个#E 孔雀王朝人#!，一个#E 药地耶#!人足矣。"
 me_yaudheya_18_desc:0 "战士之道，#E 刹帝利#!之道，是我们人民之道，我们当然是#E 刹帝利#!。#E 刹帝利#!是种姓制度四大主要社会阶层之一，意为‘权威’，自#E 吠陀#!文化之始，它代表我们这些贵族战士。我们的共和#E 刹帝利#!统治方式造就了一种该地区前所未有的尚武文化。"
 me_yaudheya_18_title:0 "$yaudheya_missions_task_18$"
 me_yaudheya_18_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_18$#!’现已#G 完成#!!"
 me_yaudheya_19.a:0 "而你，我的才能。"
 me_yaudheya_19_desc:0 "#E 大王统帅#!，我的领主，是#E 拘楼-药地耶#!文化中最崇高的头衔。没有哪个民选职位更高。它字面意为“伟大国王军事统帅”。#E 孔雀王朝#!称你为#E 大统帅#!，或“伟大军事统帅”，仍是一个极高的荣誉。我们以纪律严明的战士自豪，你可以确信我们的忠诚。"
 me_yaudheya_19_title:0 "$yaudheya_missions_task_19$"
 me_yaudheya_19_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_19$#!’现已#G 完成#!!"
 me_yaudheya_1_desc:0 "#E 刹帝利#!党派，或称#E 寡头#!，已获得授权！这一伟大胜利意味着#E 刹帝利#!战士文化将融入我们的共和制度。当然，我们必须小心确保没有哪位#E 刹帝利#!凌驾于他人之上，但我们可以宣称每位#E 刹帝利#!都是王。"
 me_yaudheya_1_title:0 "$yaudheya_missions_task_1$"
 me_yaudheya_1_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_1$#!’现已#G 完成#!!"
 me_yaudheya_2.a:0 "向罗阇[GetCharacter('(int32)22').GetPraenomen]派遣药地耶士兵！"
 me_yaudheya_20.a:0 "马利安的财富将为他们赢得胜利。"
 me_yaudheya_20.b:0 "达德人的崎岖山地已训练了他们。"
 me_yaudheya_200.a:0 "药地耶人仍是我们的朋友。"
 me_yaudheya_200_desc:0 "#E [GetCountry('YDD').GetName]联盟#!为我们派遣了一名战士。他们始终在我们的战役中助我们一臂之力，此次也不例外。如果我们愿意，可以充分利用这位精锐战士。"
 me_yaudheya_201.a:0 "#E 药地耶#!万岁！"
 me_yaudheya_201.b:0 "#E 药地耶联盟#!万岁！"
 me_yaudheya_201.c:0 "#E 优陀耶氏族#!!万岁！"
 me_yaudheya_201_desc:0 "#E 药地耶#!共和国从一个小型但强大的#E 拘楼王国#!继承国，成长为一个能以超常力量对抗任何敌人的强大势力，无论是北方的入侵者、南方的帝国、东方的攻击者，还是西方的军阀。我们无需期盼未来好运，因为我们的财富已由我们的努力、技能和韧性赢得。"
 me_yaudheya_201_title:0 "不可征服的共和国"
 me_yaudheya_201_tooltip:0 "使命树‘#Y $yaudheya_missions$#!’现已#G 完成#!!"
 me_yaudheya_20_desc:0 "我们国家中有两个民族具有显著存在且生活方式截然不同。#E 马利安#!，在旁遮普最低处的富裕商人和农民；#E 达德人#!，在旁遮普最高处的山地游牧民。他们都要求更多权利，并表示如有必要，准备为之而战。好吧，我们宣布他们可以被授予#E #Y 特殊权利#!#!……只要他们证明自己有能力加入我们的精锐军队。毕竟他们想为权利而战！我们应将这些特殊权利授予哪个文化？"
 me_yaudheya_20_title:0 "$yaudheya_missions_task_20$"
 me_yaudheya_20_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_20$#!’现已#G 完成#!!"
 me_yaudheya_21.a:0 "因陀罗之城再次属于我们。"
 me_yaudheya_210.a:0 "这是背叛、叛国，或两者皆有！"
 me_yaudheya_210.b:0 "因陀罗之城理应属于他们。"
 me_yaudheya_210_desc:0 "#E 药地耶#!的#E 大统帅#!向我们“坚持”要求归还#E 因陀罗普拉什塔#!。它是#E 拘楼王国#!的首城，#E 药地耶#!的几个政治派系宣称是该城传奇#E 潘达瓦#!创始人的后裔。虽然这样做让我们痛苦，但我们只能眼睁睁看着这座城市欢欣地重归共和国。这已发生了。现在重要的是我们的感受。"
 me_yaudheya_210_title:0 "$yaudheya_missions_task_21$"
 me_yaudheya_21_desc:0 "#E 孔雀王朝#!占领了#E 因陀罗普拉什塔#!的领土，但现在它已归还我们。在古老的#E 拘楼王国#!时代，我们的两个贵族家族，#E 迦那梅伽亚#!和#E 普拉提文提耶#!的祖先，在史诗故事《摩诃婆罗多》中为王国争斗。#E 普拉提文提耶#!兄弟获胜后，#E 因陀罗普拉什塔#!从那场战争的和平中诞生。我们是#E 拘楼王国#!的合法继承者，因此也是这座辉煌城市的合法继承人。"
 me_yaudheya_21_title:0 "$yaudheya_missions_task_21$"
 me_yaudheya_21_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_21$#!’现已#G 完成#!!"
 me_yaudheya_2_desc:0 "#E [GetCountry('MRY').GetName]帝国#!正处于征服我们整个世界的进程中。氏族国家的时代早已在他们手中结束。然而，我们在这其中发挥了作用，并应继续如此。\n\n除了[GetCountry('YDD').GetName|E]的强大刹帝利战士，谁为罗阇[GetCharacter('(int32)22').GetPraenomen|E]#E 孔雀#!带来了比旁遮普谷物还多的胜利？除了我们，谁骑着大象翻越兴都库什，抗击#E [GetCharacter('(int32)39').GetPraenomen]帝国#!的残余，斩杀的人头比圣神[GetDeityDefinition('omen_kartikeya').GetName]的头颅还多！"
 me_yaudheya_2_title:0 "$yaudheya_missions_task_2$"
 me_yaudheya_2_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_2$#!’现已#G 完成#!!"
 me_yaudheya_3.a:0 "都城将熠熠生辉！"
 me_yaudheya_3_desc:0 "#E 药地耶#!的三座都城自联盟之初便是其身份的一部分！主要的行政首都#E 罗塔克#!。俱卢国的古都#E 象城#!。最后是#E 罗德瓦拉#!地区，虽无单一都城统治，仍形成一个独特的行政区。\n\n每座都城都应进一步发展，在我们的统治下繁荣。我们从每个区域获得了资金，由我们决定如何分配这些资金给各行政区。"
 me_yaudheya_3_title:0 "$yaudheya_missions_task_3$"
 me_yaudheya_3_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_3$#!’现已#G 完成#!!"
 me_yaudheya_4.a:0 "大王在伟大的罗塔克。"
 me_yaudheya_4_desc:0 "#E 罗塔克#!是我们最接近真正首都的城市。在某种程度上，它是都城中的都城，我们的辉煌城市仍在不断成长。它连接着东部的恒河谷地和我们人民的印度河谷地。"
 me_yaudheya_4_title:0 "$yaudheya_missions_task_4$"
 me_yaudheya_4_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_4$#!’现已#G 完成#!!"
 me_yaudheya_5.a:0 "象城是如此温馨的家园！"
 me_yaudheya_50_desc:0 "我们有选择在#E 马利亚#!地区创建另一个#E 殖民共和国#!。或者，我们可以将#E 五城联盟#!扩展至包括#E 马利亚#!。"
 me_yaudheya_50_title:0 "马利安共和国"
 me_yaudheya_5_desc:0 "#E 象城#!是我们母体#E 俱卢国#!的旧都。虽然我们取代了古老的王国，但并未取代其伟大的首都。#E 象城#!仍是#E 俱卢#!人民的圣地，最近的扩建将使其继续发展，尽管其起源极为古老。"
 me_yaudheya_5_title:0 "$yaudheya_missions_task_5$"
 me_yaudheya_5_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_5$#!’现已#G 完成#!!"
 me_yaudheya_6.a:0 "让我们沿着萨特卢杰河漫步。"
 me_yaudheya_6_desc:0 "#E 罗德瓦拉#!之地从未高度集权化。位于萨特卢杰河岸边和南部沙漠边缘，它难以像我们其他富饶之地那样文明化。现在情况不同了，我们为#E 罗德瓦拉#!的行政管理建造了一座真正的城市。这将帮助#E 罗德瓦拉#!的人民在我们的联盟中繁荣，同时增强我们穿越南部拉贾斯坦沙漠的能力。"
 me_yaudheya_6_title:0 "$yaudheya_missions_task_6$"
 me_yaudheya_6_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_6$#!’现已#G 完成#!!"
 me_yaudheya_7.a:0 "我想知道那里的月光是否也更明亮。"
 me_yaudheya_70.a:0 "我将为军队效力，这是我的职责。"
 me_yaudheya_70.b:0 "不。"
 me_yaudheya_70_desc:0 "我的#E [GetCountry('YDD').GetRulerTitle]#!，我们的宗主请求你作为指挥官在他们的军队中服役。你将如何回应？"
 me_yaudheya_70_title:0 "请求大统帅"
 me_yaudheya_71.a:0 "多么失望……"
 me_yaudheya_71_desc:0 "我的#E [GetCountry('MRY').GetRulerTitle]#!，#E 药地耶#!的#E 大统帅#!拒绝离开他的国家为你上战场作战。"
 me_yaudheya_71_title:0 "大统帅拒绝"
 me_yaudheya_72.a:0 "太好了，我们将善加利用他们。"
 me_yaudheya_72_desc:0 "我的#E [GetCountry('MRY').GetRulerTitle]#!，#E 大统帅#!已抵达你的宫廷，准备以你的名义带领士兵取得胜利！"
 me_yaudheya_72_title:0 "大统帅抵达"
 me_yaudheya_7_desc:0 "关于#E 斯塔尼什瓦拉#!还能说什么，只能说‘哇’。尽管不是我们的主要行政中心，毫无疑问，#E 斯塔尼什瓦拉#!注定成为一座伟大的城市，或许将来会成为某国的首都。可能是我们，也可能不是。无论如何，#E 斯塔尼什瓦拉#!的星光更加闪耀。"
 me_yaudheya_7_title:0 "$yaudheya_missions_task_7$"
 me_yaudheya_7_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_7$#!’现已#G 完成#!!"
 me_yaudheya_8.a:0 "城中之城，坚墙环绕。"
 me_yaudheya_8_desc:0 "征服#E 诺哈尔#!使我们获得了一座当时位置最佳的城市之一。特别是#E 卢赫瓦尔#!区似乎适合发展，其中的#E 洛赫-科特#!堡坚不可摧。愿这些城墙屹立千年！"
 me_yaudheya_8_title:0 "$yaudheya_missions_task_8$"
 me_yaudheya_8_tooltip:0 "使命任务‘#Y $yaudheya_missions_task_8$#!’现已#G 完成#!!"
 me_yaudheya_9.a:0 "接受了我们的联姻请求！"
 me_yaudheya_9.b:0 "拒绝了我们的联姻请求……"
 me_yaudheya_900.a:0 "当然可以与他们联姻！"
 me_yaudheya_900.b:0 "我们宁愿不这样做。"
 me_yaudheya_900.c:0 "不幸的是，我们已与他们在#E 布罗伐#!的对手联姻。"
 me_yaudheya_900_desc:0 "[GetCountry('MRY').GetRuler.GetPraenomen|E]，#E 药地耶#!的大统帅，请求与孔雀家族之一联姻……虽然我们之前与该共和国联姻，他们始终是我们最忠诚的盟友和臣属，但我们是否应再次与他们联姻？"
 me_yaudheya_91.a:0 "我的逻辑绝对无懈可击。"
 me_yaudheya_91_desc:0 "[GetCountry('MRY').GetRuler.GetPraenomen]对我们的请求给出了一个困惑的回答。他似乎……不知为何……相信了这种疯狂？！多么幸运！"
 me_yaudheya_91_title:0 "[GetCountry('MRY').GetRuler.GetPraenomen]疯了吗？"
 me_yaudheya_92.a:0 "他是傻瓜，不是我！"
 me_yaudheya_92_desc:0 "[GetCountry('MRY').GetRuler.GetPraenomen]对我们的请求给出了一个困惑的回答。他似乎……嗯……坦白说在质疑你的理智。"
 me_yaudheya_92_title:0 "你疯了吗？"
 me_yaudheya_93.a:0 "这太侮辱了！"
 me_yaudheya_93_desc:0 "我们收到消息，[GetCountry('MRY').GetRuler.GetPraenomen]认为我们侮辱了他！他说这是[GetCountry('YDD').GetName|E]的该死的[GetCountry('YDD').GetRulerTitle]告诉他的。不知为何，[GetCountry('MRY').GetRuler.GetPraenomen]相信他们……幸好，他们只是给了我们一个轻微的惩罚，而不是允许#E 优陀耶人#!攻击。"
 me_yaudheya_93_title:0 "背叛！谎言！欺骗！"
 me_yaudheya_94.a:0 "这些野蛮的骗子！"
 me_yaudheya_94_desc:0 "我们收到消息，[GetCountry('MRY').GetRuler.GetPraenomen]认为我们侮辱了他！他说这是[GetCountry('YDD').GetName|E]的该死的[GetCountry('YDD').GetRulerTitle]告诉他的。不知为何，[GetCountry('MRY').GetRuler.GetPraenomen]相信他们，并允许他们直接攻击我们，如果他们选择这样做。我们必须做好准备。"
 me_yaudheya_94_title:0 "背叛！谎言！欺骗！"
 me_yaudheya_95.a:0 "这可没按计划进行。"
 me_yaudheya_95_desc:0 "[GetCountry('MRY').GetRuler.GetPraenomen]对我们回应时带着鄙视。他声称你明显在撒谎，要求你立即送上额外贡品以示歉意。"
 me_yaudheya_95_title:0 "政治战士：受罚"
 me_yaudheya_96.a:0 "这可没按计划进行。"
 me_yaudheya_96_desc:0 "[GetCountry('MRY').GetRuler.GetPraenomen]对我们回应时带着鄙视。他声称你明显在撒谎，要求你立即送上额外贡品以示歉意。"
 me_yaudheya_96_title:0 "政治战士：受罚"
 me_yaudheya_97.a:0 "哼，我们必须把故事讲得更好。"
 me_yaudheya_97_desc:0 "我们成功说服了[GetCountry('MRY').GetRuler.GetPraenomen|E]，[GetCountry('PRA').GetName|E]必须受到惩罚……然而他只是给了他们一个轻微的惩罚，而不是允许我们用长矛给他们一击。如果我们想获准攻击他们，我们必须更有说服力。"
 me_yaudheya_97_title:0 "政治战士：成功？"
 me_yaudheya_98.a:0 "太好了！现在开战……"
 me_yaudheya_98_desc:0 "我们成功说服了[GetCountry('MRY').GetRuler.GetPraenomen|E]，[GetCountry('PRA').GetName|E]必须受到惩罚。幸运的是，我们被允许执行这一惩罚。我们有#E 5年#!的时间，直到这场外交事件平息。"
 me_yaudheya_98_title:0 "政治战士：成功"
 me_yaudheya_99_desc:0 "你被授予与[GetCountry('MRY').GetRuler.GetPraenomen|E]本人会晤的机会。这是你说服他为何我们应自由攻击#E 波罗伐王国#!的良机。\n\n“[ROOT.GetCountry.GetRuler.GetPraenomen|E]，你说我#E 波罗伐#!的臣民说了什么坏话？”[GetCountry('MRY').GetRuler.GetPraenomen]问道。\n你回答：“我的[GetCountry('MRY').GetRulerTitle]，他们……”"
 me_yaudheya_99_title:0 "政治战士：诽谤"
 me_yaudheya_9_desc:0 "来自#E 孔雀#!罗阇的消息传来，我伟大的战神啊！#E 孔雀帝国#!已经……"

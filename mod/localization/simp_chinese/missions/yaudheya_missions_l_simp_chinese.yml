 permanent_yaudheya_happiness_mod:0 "为权利而战"
 permanent_yaudheya_happiness_mod_desc:0 "我们授予这些人特殊权利，以换取他们在军事能力上的贡献。"
 punjabi_heritage:0 "五城遗产"
 punjabi_heritage_desc:0 "般阐那陀的五座城市，即五城联盟，在尊贵的#E 药地耶联盟#!的赞助下成立了五城联盟。\n\n般阐那陀意为“五条河流”，而‘五城’由‘五’和‘城’组成。"

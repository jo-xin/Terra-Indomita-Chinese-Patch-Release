 rest_of_rodewala_tt:0 "[GetProvince('(int32)9264').GetArea.GetName|E]内任何拥有的省份至少有#Y 30个居民#!。"
 rodewala_city_tt:0 "[GetProvince('(int32)9264').GetArea.GetName|E]地区内任何#E 拥有的#!省份是一座#E #Y 城市#!#!。"
 rodewala_has_loyalty_tt:0 "#Y 罗德瓦拉#!的州忠诚度大于或等于#Y 75#!。"
 rodewala_wishes_to_join_ydd:0 "罗德瓦拉的行政困境"
 rohtok_rises:0 "罗塔克的崛起"
 sabotage_paurava:0 "破坏波罗伐"
 sabotage_paurava_desc:0 "尝试破坏[GetCountry('PRA').GetName|E]王国的声誉。你可以#R 每年尝试一次#!。如果你与[GetCountry('MRY').GetRuler.GetPraenomen|E]是朋友、拥有#E 银舌#!或极高的#E 魅力#!，成功破坏的机会将#G 增加#!……然而，拥有不受欢迎的#E 魅力#!或其他特质将#R 降低#!你的成功机会。"
 sabotaged_paurava_tt:0 "在过去5年内成功实施了#Y 破坏波拉瓦#!决定。"
 they_are_coming_tt:0 "#E 药地耶#!即将宣布#R 战争#!。"
 trustworthy_warriors:0 "忠诚的刹帝利战士"
 unlock_decision_to_make_more_republics_tt:0 "解锁创建更多#Y 殖民共和国#!的决定。"
 unlock_sabotage_tt:0 "解锁#Y 破坏布罗伐#!决议。"
 unlock_sabotage_tt_extended:0 "解锁#Y 破坏布罗伐#!决议。\n向#E 旃陀罗笈多#!的宫廷派遣一名能干的#E 刹帝利战士#!。"
 walls_of_lahore:0 "洛赫-科特堡"
 we_marry_ydd_tt:0 "我们为大统帅寻找一位#E 孔雀王朝#!的配偶。"
 what_the_frick_tt:0 "[GetCountry('MRY').GetRuler.GetPraenomen]完全不明白你在说什么。"
 yaudheya_dardic_war_tt:0 "#R 战争即将来临。#!"
 yaudheya_maurya_150_tt:0 "[GetCountry('YDD').GetName|E]与[GetCountry('MRY').GetName|T]的关系至少为#G 150#!。"
 yaudheya_maurya_170_tt:0 "[GetCountry('YDD').GetName|E]与[GetCountry('MRY').GetName|T]的关系至少为#G 170#!。"
 yaudheya_missions:0 "孤独的共和国"
 yaudheya_missions_BUTTON_TOOLTIP:0 "刹帝利共和国必将胜利。"
 yaudheya_missions_CRITERIA_DESCRIPTION:0 "当药地耶巩固其作为强大军事共和国的地位时，此使命将视为完成。"
 yaudheya_missions_DESCRIPTION:0 "[GetCountry('YDD').GetName|E]共和国，或称优陀耶氏族，是一个以昔日俱卢王国遗迹为中心的尚武共和国。地处世界上两条最大河谷之间的偏僻之地，[GetCountry('YDD').GetAdjective]人是唯一的共和氏族国家。药地耶现受孔雀王朝的庇护，后者极为重视药地耶人的精锐军队。"
 yaudheya_missions_task_1:0 "每位刹帝利皆为王"
 yaudheya_missions_task_10:0 "罗德瓦拉的其余部分"
 yaudheya_missions_task_10_DESC:0 "我们与[GetCountry('MRY').GetName|E]的关系使我们有资格请求他们在我们国家的投资。由于我们在#E 罗德瓦拉#!有一座城市，#E 孔雀王朝#!可能认为我们在该地区的管理值得将他们的那部分土地授予我们。\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 yaudheya_missions_task_11:0 "终结波罗斯王国"
 yaudheya_missions_task_11_DESC:0 "是时候终结[GetCountry('PRA').GetName|E]王国了。[GetCharacter('(int32)498').GetPraenomen|E]之子的暴政在西旁遮普肆虐太久。是时候在所谓[GetCountry('PRA').GetName|E]的‘智者’之上建立刹帝利共和统治了！\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 yaudheya_missions_task_12:0 "来自萨卡拉的顺滑丝绸"
 yaudheya_missions_task_12_DESC:0 "#E 波拉瓦#!的前首都#E 萨卡拉#!不仅是西旁遮普，也是整个印度河谷的卓越城市之一。虽然它以#E 佛教#!中心而闻名，但更因其极为丰厚的纺织品和丝绸利润而著称。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 yaudheya_missions_task_13:0 "管理马利亚"
 yaudheya_missions_task_13_DESC:0 "#E 马利阿#!不仅是一座城市，而是一个区域。其发展、组织和人口密度极高。管理这片区域需要温和的手法使其繁荣，但更需小心谨慎以防叛乱。\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 yaudheya_missions_task_14:0 "奢叉尸罗的胜利"
 yaudheya_missions_task_14_DESC:0 "#E 奢叉尸罗#!的知识奇迹已归我们所有。虽然我们通常重武轻文，但#E 奢叉尸罗#!的大学将是我们在不断扩张的共和国中最强大的例外。我们应培育这座城市达到新的高度！\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 yaudheya_missions_task_15:0 "马利安的婚姻"
 yaudheya_missions_task_15_DESC:0 "#Y [GetCulture('sivi').GetName]s#!与我们彼此熟知。是时候赋予他们通婚的权利了。这将帮助我们管理新获得的#E 马利亚#!领土和富裕城市。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 yaudheya_missions_task_16:0 "德瓦普拉亚伽的达德人"
 yaudheya_missions_task_16_DESC:0 "#E 斯塔尼什瓦拉#!如今是一座伟大的城市，但只要其东部边境的野蛮[GetCulture('dardic').GetName|Y]部落存在，其安全便岌岌可危。我们必须为人民向狡诈的达德人宣战，直至他们的城市#E 德瓦普拉亚伽#!。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 yaudheya_missions_task_17:0 "般阐那陀的五城联盟"
 yaudheya_missions_task_17_DESC:0 "[GetProvince('(int32)4380').GetArea.GetName|E]，后称旁遮普，是我们人民的地区。作为印度的粮仓，其智者、战士、文化等孕育了一个复杂而富饶的地区。然而，这也使其难以治理。作为共和国，我们必须正视这一事实并决定如何处理。是否应赞助创建五城联盟？\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 yaudheya_missions_task_18:0 "战士之道"
 yaudheya_missions_task_18_DESC:0 "[GetCountry('YDD').GetName|E]共和国首先是为#E 刹帝利#!战士种姓的共和国。让我们通过制定法律确保我们的战士文化得以延续。\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 yaudheya_missions_task_19:0 "大王统帅"
 yaudheya_missions_task_19_DESC:0 "意为“大王统帅”的领袖是[GetCountry('YDD').GetName|E]共和国的民选领袖。这位领袖还担任#E 孔雀王朝#!军队的大统帅（摩诃塞纳帕蒂），显示出#E 孔雀王朝#!对#E 药地耶人#!的巨大依赖。凭借如此崇高的头衔，我们应从#E 孔雀王朝#!获得更多自治权，因为我们当之无愧。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 yaudheya_missions_task_1_DESC:0 "[GetCountry('YDD').GetName|E]是一个战士共和国。在西方，我们通常将其视为#E 寡头共和国#!，然而在吠陀印度，#E 寡头#!通常代表战士#E 刹帝利#!种姓。在[GetCountry('YDD').GetName|E]尤其如此。\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 yaudheya_missions_task_2:0 "忠诚的战士"
 yaudheya_missions_task_20:0 "为你的权利而战"
 yaudheya_missions_task_20_DESC:0 "从西旁遮普边缘的#E 马利阿#!到东旁遮普顶端的#E 达德#!地区，人民开始呼吁‘为他们的权利而战’。我们何必反对？如果他们想要权利，必须先学会像#E 刹帝利#!战士那样战斗！\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 yaudheya_missions_task_21:0 "坚持因陀罗普拉什塔"
 yaudheya_missions_task_21_DESC:0 "我们的两个贵族家族，#E 普拉提文提耶#!和#E 迦那梅伽亚#!，是#T 摩诃婆罗多#!传奇故事中的亲族。故事中，我们的前身#E 拘卢王国#!以#E 因陀罗普拉什塔#!为首都被建立，由#E 潘达瓦#!兄弟亲手创建。我们有权统治这座城市，必须尽快向#E 孔雀王朝#!坚持要求归还。"
 yaudheya_missions_task_2_DESC:0 "[GetCountry('MRY').GetName|E]极为依赖[GetCountry('YDD').GetName|E]的战士。事实上，#E [GetCountry('YDD').GetName]联盟#!为[GetCharacter('(int32)22').GetPraenomen|E]提供了众多将领、酋长和军事胜利。\n\n#Y 我们将派遣药地耶战士加入孔雀王朝军队。#! \n\n\n\n\n\n\n\n\n\n@india_mil5!"
 yaudheya_missions_task_3:0 "三座都城"
 yaudheya_missions_task_3_DESC:0 "我们并非单一民族。#E 药地耶人#!由三个州组成，可大致整合为一个联盟。行政中心因此围绕三座不同的都城或地区：#E 罗塔克#!、#E 北潘恰拉#!和#E 北拉贾斯坦#!。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 yaudheya_missions_task_4:0 "罗塔克的崛起"
 yaudheya_missions_task_4_DESC:0 "三座都城中最大且事实上为国家首都的#E 罗塔克#!，是如今唯一仍广为人知的都城。#E 罗塔克#!一直是#E 药地耶人#!的事实首都，直到他们在#E 公元1世纪#!被并入#E 笈多帝国#!。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 yaudheya_missions_task_5:0 "象城的家园"
 yaudheya_missions_task_5_DESC:0 "#E 象城#!是位于#E 巴胡达尼卡#!的重要城市，字面意为‘玉米之国’。这片玉米之地构成了#E [GetCountry('YDD').GetName]联盟#!三个行政共和国之一。#E 象城#!本身是#E [GetCulture('kuru').GetName]王国#!的旧都，#E 药地耶人#!是其继承国家。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 yaudheya_missions_task_6:0 "罗德瓦拉的漫游"
 yaudheya_missions_task_6_DESC:0 "#E 罗德瓦拉#!是一个地区，后来被确认为#E 北拉贾斯坦#!的一部分，是#E 药地耶人#!第三个行政共和国的所在地。这个联盟部分多为乡村，但作为通往西旁遮普的重要纽带，历史上在#E 公元前2世纪#!由#E [GetCountry('YDD').GetName]共和国#!控制和管理。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 yaudheya_missions_task_7:0 "斯塔尼什瓦拉的星光"
 yaudheya_missions_task_7_DESC:0 "#E 斯塔尼什瓦拉#!是一座日益重要的城市。虽然它尚未成为任何国家的首都，但它将在#E 公元6世纪#!成为戒日帝国的首都。其起源可追溯至古代，将如星辰般崛起。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 yaudheya_missions_task_8:0 "敲响诺哈尔之门"
 yaudheya_missions_task_8_DESC:0 "#E 诺哈尔#!最终被其辖区内的拉合尔城所取代。这个‘原型拉合尔’在波鲁斯王国中仍是一座重要城市，位于旁遮普中心，以其洛赫-科特堡闻名，这是‘洛哈瓦尔’或‘拉合尔’名称的起源。控制并发展#E 诺哈尔#!对确保大旁遮普地区的稳定至关重要。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 yaudheya_missions_task_9:0 "与孔雀王朝联姻"
 yaudheya_missions_task_9_DESC:0 "虽然历史上从未与[GetCountry('MRY').GetName|E]联姻，但与药地耶人的密切关系极为常见。为了进一步加强联系，我们可以向我们的宗主请求联姻……前提是讨厌的[GetCountry('PRA').GetName|E]王国没有抢先一步。如果他们已经联姻，我们仍可提出请求，但可能会被拒绝。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"

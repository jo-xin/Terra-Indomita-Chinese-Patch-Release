 treasure_silver_hoard_of_pelendava:0 "佩楞达瓦的白银宝藏"
 treasure_silver_hoard_of_pelendava_desc:0 "这是一批由革提亚人中最优秀的工匠锻造的精美银金崇拜雕像。"
 walls_of_sarmizegetusa_getia_mod:0 "萨耳弥泽革图萨之墙"
 wonder_sveshtari_tomb:0 "斯韦什塔里之墓"
 you_need_to_form_dacia_tt:0 "我们需要做出决定，#T 成立达契亚#!。"

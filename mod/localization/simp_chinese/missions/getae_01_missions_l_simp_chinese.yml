 has_falx_and_sica_military_tradition:0 "#Y 我们拥有#!#T 达契亚-色雷斯军事传统#![GetMilitaryBonus( 'thracian_path_1' ).GetName|G]。"
 have_barracks_getia_tt:0 "我们需要在国内建造#Y 3个兵营#!。"
 have_fortress_getia_tt:0 "我们需要在国内拥有#Y 7座要塞#!。"
 integrate_them_thracians_please_tt:0 "#Y 我们需要整合#! #T 普罗蓬提斯文化#!。"
 me_getae_01_inv.10.a:0 "愿神灵继续向我们展现他们的面容"
 me_getae_01_inv.12.a:0 "一切荣耀归于达契亚!所有荣誉归于[ROOT.GetCountry.GetRuler.GetFirstName]！"
 me_getae_01_inv.12.b:0 "现在给我加冕为王，否则我的弓箭手会杀了你们所有人！"
 me_getae_01_inv.13.a:0 "命令我们在[ROOT.GetCountry.GetName]全境的征召兵每天都要用弯刀和短剑进行训练。"
 me_getae_01_inv.14.a:0 "我们的西部边境从未像现在这样安全"
 me_getae_01_inv.15.a:0 "在带领我们走向荣耀的过程中，扎尔莫克西斯将指引我的手！"
 me_getae_01_inv.16.a:0 "还有很多山峰等着我们去攀登……"
 me_getae_01_inv.17.a:0 "没有什么能平息我对新土地和新奴隶的渴望......"
 me_getae_01_inv.18.a:0 "每个人都爱金银财宝，对吧？我当然也是……"
 me_getae_01_inv.19.a:0 "真是一个可怕的噩梦……"
 me_getae_01_inv.19.b:0 "萨耳弥泽革图萨必须成为我们的新首都！"
 me_getae_01_inv.2.a:0 "#E 狄诺革提亚#!将属于我们——这将是众多要塞中第一个要沦陷的！向东进发！"
 me_getae_01_inv.2.b:0 "考虑南方选项有什么不好，[SCOPE.sCharacter('random_dude_2').GetFirstName]？"
 me_getae_01_inv.20.a:0 "索耳努斯终将成为[ROOT.GetCountry.GetName]境内最重要的城邦。"
 me_getae_01_inv.20.b:0 "我们应该将索耳努斯设为我们新的首都"
 me_getae_01_inv.21.a:0 "我祈祷我们永远不需要动用这些储备……"
 me_getae_01_inv.22.a:0 "即便我不在了，我们的国家也将长久地得到保护……"
 me_getae_01_inv.23.a:0 "多么不可思议的发现啊！"
 me_getae_01_inv.24.a:0 "死亡终究会降临到每一个人身上，但至少我将拥有一座配得上我的陵墓。"
 me_getae_01_inv.3.a:0 "我们绝不容许弱者存活，必须将他们从高处驱逐。"
 me_getae_01_inv.4.a:0 "这些石头是我们国家未来的实际基石"
 me_getae_01_inv.5.a:0 "我们现在仅满足于现有的贸易联系。"
 me_getae_01_inv.5.b:0 "支付色雷斯研究者的津贴，并欢迎他来到革提亚"
 me_getae_01_inv.6.a:0 "谁又能确切地说出在海上会发生什么呢？"
 me_getae_01_inv.7.a:0 "我们最伟大的胜利就在前方！"
 me_getae_01_inv.7.b:0 "没有比现在更好的时机了——我们现在就入侵色雷斯！"
 me_getae_01_inv.8.a:0 "对革提亚而言，直接统治海岸更为合适——很抱歉，但答案是否定的。"
 me_getae_01_inv.8.b:0 "按照他们的请求去做，将这些城市作为革提亚的藩属国释放。"
 me_getae_01_inv.9.a:0 "请注意，我绝不允许任何人质疑我的荣誉！"
 me_getae_01_inv_1.a:0 "今晚，我有许多事情需要深思熟虑......"
 me_getae_10_desc:0 "既然我们的杯盏已经满溢，现在是时候回报这些神圣的恩赐，通过建立一个圣地来表达感激之情。神灵在[ROOT.GetCountry.GetRuler.GetName][ROOT.GetCountry.GetRuler.GetHerHis]的梦境中低语：[GetProvince('(int32)4270').GetName]的森林必须为#E 扎尔莫克西斯信仰#!的信徒建造一座神庙。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]从来不做半途而废的事情，不仅确保这座神庙得以建造，而且还成为了[ROOT.GetCountry.GetName]境内最精美的建筑之一。此外，还出资聘请了[ROOT.GetCountry.GetCapital.GetName]的金银匠人，制作我们民族的神祇小雕像作为神圣的供品——这是一笔令人惊叹的宝藏，真正展现了我们工匠的技艺精湛以及我们上层阶级的优雅和财富。"
 me_getae_10_title:0 "#E 佩楞达瓦#!的白银宝藏"
 me_getae_10_tooltip:0 "$mission_completed_tooltip_1$“#Y 佩楞达瓦的白银宝藏#!”$mission_completed_tooltip_2$"
 me_getae_11_tooltip:0 "任务现已#G 完成#!!"
 me_getae_12_desc:0 "今天，在[ROOT.GetCountry.GetCapital.GetName]举行了一场庄严的典礼——这场典礼将会被载入歌谣之中，并被后世永远铭记。在[ROOT.GetCountry.GetAdjective]城堡的城墙之上，满编的弓箭手方阵肃立待命，他们的眼神都聚焦于下方的庭院。\n\n在那里，在人群的中心，站立着[ROOT.GetCountry.GetRuler.GetName] —— #E 普莱伊斯特罗斯#!神祇的化身。谁能与[ROOT.GetCountry.GetRuler.GetFirstName]相比，是[ROOT.GetCountry.GetRuler.GetHerHis]将自己的人民带到了荣耀的巅峰？谁能期望能对抗由这位神圣的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏族后代锻造的达西亚？\n\n远处，一位祭司正站在[ROOT.GetCountry.GetRulerTitle]面前，后者已经跪倒在地。当一顶白金王冠被戴在[ROOT.GetCountry.GetRuler.GetHerHis]的头上时，鼓声响起，以此为信号，弓箭手们拉弓射箭，成千上万支箭矢射向天空，使得天色为之变暗。"
 me_getae_12_title:0 "达契亚的崛起"
 me_getae_12_tooltip:0 "$mission_completed_tooltip_1$“#Y 达契亚的崛起#!”$mission_completed_tooltip_2$"
 me_getae_13_desc:0 "“很好，[SCOPE.sCharacter('heir').GetFirstName]，现在再来一次！记住把持盾的手臂抬高——进攻！”\n\n[SCOPE.sCharacter('random_dude').GetName]发出一声巨吼，向[ROOT.GetCountry.GetRuler.GetName]冲去，把致命的弯曲短剑#E 锡卡#!高举过头；这是我们[ROOT.GetCountry.GetAdjective]人偏爱的短剑。一小群士兵聚在[ROOT.GetCountry.GetCapital.GetName]附近的兵营旁，观看两名战士训练，空气中充满斗士粗哑的喊声。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]冲上前迎向[ROOT.GetCountry.GetRuler.GetHerHis]攻击者，只见[ROOT.GetCountry.GetRulerTitle]以与其尺寸不符的惊人速度挥动一柄巨大的双手#E 法尔克斯#!。法尔克斯彻底击碎了[SCOPE.sCharacter('heir').GetFirstName]的盾牌，木头迸裂声令人牙酸，盾牌被劈成两半，震惊的战士也跪倒在地。\n\n“该死，你这个混蛋！你差点把我的胳膊砍下来！”[SCOPE.sCharacter('heir').GetFirstName]愤怒地咒骂，一边甩着左手；聚集的士兵发出零散笑声。[ROOT.GetCountry.GetRuler.GetFirstName]走到[SCOPE.sCharacter('heir').GetFirstName]身边扶他起身，为这番夸张示范道歉，随即转向部队讲话。\n\n“你们看见我们的法尔克斯有多强大了吗？它或许比普通剑更重，而且需要双手使用，但这里每个人都刚刚见证了我能做到什么……”"
 me_getae_13_title:0 "使用弯刀和短剑训练"
 me_getae_13_tooltip:0 "$mission_completed_tooltip_1$“#Y 使用弯刀和短剑训练#!”$mission_completed_tooltip_2$"
 me_getae_14_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 并不确定为何感到如此强烈的驱动力，[ROOT.GetCountry.GetRuler.GetSheHe]要用[ROOT.GetCountry.GetName]的财富来加强[GetProvince('(int32)4282').GetName]这个省份的建设，但现在这项任务已经完成，所有人都能看到[ROOT.GetCountry.GetRulerTitle]行动的智慧。\n\n萨耳弥泽革图萨夹在两个无法逾越的山脉之间，位置极佳，可以抵御任何试图穿过山口的入侵者。但现在这座加固的城市建成后，要想不付出高昂代价就悄悄通过这些峡谷几乎是不可能的。\n\n这座城市本身也在蓬勃发展，这是一大额外的好处——确实，我们的[ROOT.GetCountry.GetAdjective]同胞无论被派往何地都能繁荣昌盛。"
 me_getae_14_title:0 "强化[GetProvince('(int32)4282').GetName]"
 me_getae_14_tooltip:0 "$mission_completed_tooltip_1$“#Y 强化[GetProvince('(int32)4282').GetName]#!”$mission_completed_tooltip_2$"
 me_getae_15_desc:0 "来自南方的奇怪骚乱报告不断传入[ROOT.GetCountry.GetCapital.GetName]，由旅人和越过边境的斥候带到[ROOT.GetCountry.GetRuler.GetName]面前；人们越来越担心，我们会被卷入如今正如野火般蔓延的冲突。\n\n距我们首次赢得自由不过六十年，因为我们曾是如今已经破碎的#E 俄德律西亚王国#!之奴；那是昨日的强权，自其领袖#E 科提斯一世#!死后便眼看力量不断衰退。如今，俄德律西亚只剩昔日空壳，破碎之躯如腐肉般被人啄食。倘若我们不谨慎，或许同样命运也在等待我们。\n\n虽然我们试图在世上走自己的道路，但边境沿线的紧张正在积聚，仿佛要逼迫我们选择某条道路。我们必须盯紧东方的#E 希腊人#!，而那些阴谋重重的#E 继业者#!投在我们野心上的阴影十分漫长。不论是#E 马其顿人#!之手，他们或许还记得#E 腓力二世#!曾干涉我们的事务，还是精明的#E 吕西马科斯#!本人某个愚蠢谋划的终局，[ROOT.GetCountry.GetRuler.GetFirstName]都知道，奔涌的#E 伊斯特尔河#!挡不住敌军入侵我们的土地。\n\n如果革提亚人要在这个世界寻求安稳与安全，那就必须用剑赢得。我们人民前方仍有漫长道路，但他们已经准备好踏上旅程。"
 me_getae_15_title:0 "伊斯忒耳河无法阻挡他们"
 me_getae_15_tooltip:0 "是时候创造历史了......"
 me_getae_16_desc:0 "我们在西部的最近战役为[ROOT.GetCountry.GetName]带来了多重好处；不仅我们的边界扩张到了几代以来的最大规模，而且我们的骑兵尤其被锻炼成了一支致命的战斗力量。\n\n我们的骑兵通常在[ROOT.GetCountry.GetCapital.GetName]周围的森林中训练，这在过去多次为我们带来了优势，但在山区和丘陵中冲锋则需要一套完全不同的技能。\n\n幸运的是，我们的骑兵很快适应了在艰难地形中的作战——这对于[ROOT.GetCountry.GetRuler.GetName]的侵略战争来说将非常有用。"
 me_getae_16_title:0 "山麓之主"
 me_getae_16_tooltip:0 "$mission_completed_tooltip_1$“#Y 山麓之主#!”$mission_completed_tooltip_2$"
 me_getae_17_desc:0 "我们终于征服了聚集在我国边境周边的各个部落。曾经自由之民居住的[GetCountry('APP').GetName]、[GetCountry('ABN').GetName]以及[GetCountry('CAC').GetName]，而今却注定要作为[ROOT.GetCountry.GetAdjective]的奴隶苟延残喘——赞美普利斯托罗斯！\n\n征服敌人是一回事，然而迁入目前无人认领的土地则是另一回事。幸运的是，[ROOT.GetCountry.GetRuler.GetName]已经竭尽[ROOT.GetCountry.GetRuler.GetHerHis]所能确保我们的未来殖民者在进入北方荒地时能够得到支持。"
 me_getae_17_title:0 "西进"
 me_getae_17_tooltip:0 "$mission_completed_tooltip_1$“#Y 西进#!”$mission_completed_tooltip_2$"
 me_getae_18_desc:0 "随着我们的边界不断向西扩展，我们的定居者开始遇到与我们非常不同的部落民。\n\n当然，我们以前就亲自了解过这些愚蠢的#E 凯尔特人#!，他们对#E 扎尔莫克西斯#!一无所知，崇拜着我们祖先闻所未闻的陌生神祇。他们还有许多习俗实在是令人费解——他们怎么能那样生活？\n\n不过，他们也并非完全可恶的人，还有一点荣誉感，我们希望肯定能找到共同点来建立关系。尽管过去我们的军队曾发生过冲突，但这些怨恨暂时被搁置一旁，因为我们的政权之间开始有了更多的贸易往来。"
 me_getae_18_title:0 "邂逅凯尔特人"
 me_getae_18_tooltip:0 "$mission_completed_tooltip_1$“#Y 邂逅凯尔特人#!”$mission_completed_tooltip_2$"
 me_getae_19_desc:0 "[ROOT.GetCountry.GetRuler.GetName]满身大汗，将[ROOT.GetCountry.GetRuler.GetHerHis]的被褥扔到地上，从床上起身，面色苍白，浑身颤抖。伸手取来一盆水，这位[ROOT.GetCountry.GetRulerTitle]洗了洗[ROOT.GetCountry.GetRuler.GetHerHis]脸，回忆起惊醒[ROOT.GetCountry.GetRuler.GetHerHim]的噩梦中的细节。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]站在一座城市里——那是[ROOT.GetCountry.GetCapital.GetName]还是别的什么地方？不，这是[GetProvince('(int32)4282').GetName]——对此，[ROOT.GetCountry.GetRuler.GetSheHe]十分确定。这座城市似乎没有变化，却又显得更加古老……究竟过去了多少时间？主要街道空无一人，空气中弥漫着烟雾和垂死之人的哀嚎——就在那边！我们正在遭受攻击，敌人即将冲破城门。\n\n这些可怕的入侵者是谁？一面绣有金色鹰徽的红色旗帜在远处飘扬，一名被称为#E “无敌”#!的将领正带领着攻势。从表面上看，我们距离屈服于这些无情的攻击只有一步之遥——我们已别无他法。\n\n随着投石机继续向城墙发射炮弹，一个虚无缥缈的声音在[ROOT.GetCountry.GetRuler.GetFirstName]的脑海中响起……\n\n“如果你把首都迁往山区，你的人民将在未来的许多年里受到保护……但如果你留在[ROOT.GetCountry.GetCapital.GetName]，你的末日几乎已成定局。”"
 me_getae_19_title:0 "扰人的死亡之梦"
 me_getae_19_tooltip:0 "$mission_completed_tooltip_1$“#Y 扰人的死亡之梦#!”$mission_completed_tooltip_2$"
 me_getae_1_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]召开的战争议会已落下帷幕，然而[ROOT.GetCountry.GetRuler.GetName]陛下仍对沿海希腊殖民地的处置举棋不定。\n\n来自[SCOPE.sCharacter('random_dude').GetFamilyDisplayAdjective]氏族的激进派[SCOPE.sCharacter('random_dude').GetName]力主武力征服希腊城邦，他详陈了这条策略的诸多优势。这位将领声称这些设防的贸易城邦对[ROOT.GetCountry.GetName]的存续构成威胁，[SCOPE.sCharacter('random_dude').GetFirstName]不断敦促发动军事远征以夺取海岸线。毕竟能掠夺的财富不可胜数——当此言一出，帐中诸多酋长纷纷颔首称是。\n\n当然异议始终存在。[SCOPE.sCharacter('random_dude_2').GetName]认为睦邻政策才是上策，反问我们是否承受得起激怒#E 色雷斯人#!的后果——若其当真决心开战，碾碎我军易如反掌。[SCOPE.sCharacter('random_dude_2').GetFirstName]非但不主张征召兵员，反而恳请[ROOT.GetCountry.GetRuler.GetFirstName]陛下筹备盛大的外交献礼，以此赢得希腊人的民心，昭示我国乃本地区可靠盟友。他们的文明可有许多值得我们借鉴之处！\n\n虽然酋长们的辩论始终保持着礼节，但双方暗流涌动的对峙足见此事争议之烈。对于我们的[ROOT.GetCountry.GetRulerTitle]而言，这注定是个艰难的抉择。"
 me_getae_1_title:0 "友与敌？"
 me_getae_1_tooltip:0 "$mission_completed_tooltip_1$“#Y 友与敌？#!”$mission_completed_tooltip_2$"
 me_getae_20_desc:0 "虽然等待建设完成仿佛过了永恒一般漫长，但建筑师们、石匠们和工程师们终于离开了他们在[GetProvince('(int32)4811').GetName]的工作地点和临时营地，新的[ROOT.GetCountry.GetAdjective]城市终于准备就绪，迎接兴奋的新居民。\n\n[ROOT.GetCountry.GetRuler.GetName]委托我们的劳工承担了扩建索尔努斯港口的重要任务，而港口现在已经挤满了来自海岸的希腊船只和水手，他们沿着河流航行至此，许多人已经开始建造永久性的住所。这个所谓的“#E 希腊区#!”紧邻水域，是那些资助城市建设的外国商人的家园。[ROOT.GetCountry.GetRuler.GetFirstName]有些不好意思地承认，他们为自己选了最好的地段，但这正是为了换取一个几乎无需我们投入成本就能建成的城市所付出的代价。\n\n得益于希腊人和[ROOT.GetCountry.GetAdjective]人的共同努力，为了建造一座宏伟的城市，索耳努斯迅速成为了[ROOT.GetCountry.GetName]境内最具国际化的城市。"
 me_getae_20_title:0 "伊斯忒耳河畔的索耳努斯"
 me_getae_20_tooltip:0 "$mission_completed_tooltip_1$“#Y 伊斯忒耳河畔的索耳努斯#!”$mission_completed_tooltip_2$"
 me_getae_21_desc:0 "必须说，我国的农民无疑是[ROOT.GetCountry.GetName]中最勤劳的人。供养一个不断增长的国家是一项艰巨的任务，而我们的乡村则充满了辛勤耕作的劳动者。\n\n金色的小麦田在来自北方的微风中轻轻摇曳，我们的磨坊从清晨的第一缕阳光就开始研磨面粉。时刻谨记饥荒的危险，[ROOT.GetCountry.GetRuler.GetName]在全国各地建造了大型粮仓，因此我们的粮食盈余得以储备以备不时之需。"
 me_getae_21_title:0 "革提亚的粮食"
 me_getae_21_tooltip:0 "$mission_completed_tooltip_1$“#Y 革提亚的粮食#!”$mission_completed_tooltip_2$"
 me_getae_22_desc:0 "[ROOT.GetCountry.GetRuler.GetName]并不是一个喜欢夸耀的人，认为空洞的话语既让人反感又没有必要，然而即便是[ROOT.GetCountry.GetRuler.GetSheHe]也无法抑制内心的自豪之情，当想到[ROOT.GetCountry.GetName]的防御工事状态时。\n\n当我们众多的敌人眼看着我们像野火一样蔓延，他们除了咬牙切齿、咒骂我们的名字之外，几乎做不了什么——他们还能做什么呢？许多入侵的军队在我们的堡垒前破碎了占领我们家园的梦想，这些堡垒像海浪撞击海滩一样击退了入侵者。\n\n多亏了我们[ROOT.GetCountry.GetRulerTitle]不懈的努力，[ROOT.GetCountry.GetRuler.GetFirstName]为[ROOT.GetCountry.GetRuler.GetHerHis]深爱的子民留下了一份永世难忘的遗产。"
 me_getae_22_title:0 "达契亚之盾"
 me_getae_22_tooltip:0 "$mission_completed_tooltip_1$“#Y 达契亚之盾#!”$mission_completed_tooltip_2$"
 me_getae_23_desc:0 "当[ROOT.GetCountry.GetCapital.GetName]市场上开始出现令人炫目的宝石@gems!时，[ROOT.GetCountry.GetRuler.GetName]得知了这一新的财富来源，并进行了秘密调查。\n\n尽管一些西方商人不愿透露他们的秘密，[ROOT.GetCountry.GetRuler.GetFirstName]下令对那些保持沉默的商人进行审问，经过几次用橡木棍敲打脚底的拷问后，所有的秘密很快就被揭露了。\n\n似乎一些生活在[GetProvince('(int32)4905').GetName]附近的牧羊人在带着羊群前往山区时，有一个年轻人不慎掉进了一个最近出现在地面上的裂缝中。担心那个年轻人可能遇难，他的同伴们惊讶地听到了他从地下深处兴奋的呼喊声。他们放下绳子，闪烁的火光很快揭示了他们实际上发现了一条无价的钻石矿脉！\n\n[ROOT.GetCountry.GetRuler.GetFirstName]立即派遣信使前往帕特里达瓦，这些传言很快就得到了证实——山中有宝石；这对整个[ROOT.GetCountry.GetName]来说都是一大福音。"
 me_getae_23_title:0 "山中的宝石"
 me_getae_23_tooltip:0 "$mission_completed_tooltip_1$“#Y 山中的宝石#!”$mission_completed_tooltip_2$"
 me_getae_24_desc:0 "得知奇妙的#E 斯韦什塔里之墓#!已在[GetProvince('(int32)4252').GetName]建造完毕，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]繁忙的日程中抽空访问了该省份，以便亲眼目睹这座建筑。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]对设计亲力亲为，并从[ROOT.GetCountry.GetCapital.GetName]派遣了最优秀的雕塑家和工匠前往工地，确实，这里没有任何地方能与之相比——美丽的卡里亚蒂德雕像从棕榈叶装饰中浮现，守卫着陵墓的角落，它们华丽彩绘的面容凝视着永恒。\n\n离开赫利斯后，[ROOT.GetCountry.GetRuler.GetFirstName]心情沉重，在回家的路上异常安静。当被要求分享[ROOT.GetCountry.GetRuler.GetHerHis]的想法时，这位[ROOT.GetCountry.GetRulerTitle]悲伤地摇了摇[ROOT.GetCountry.GetRuler.GetHerHis]头，没有说什么。"
 me_getae_24_title:0 "斯韦什塔里之墓"
 me_getae_24_tooltip:0 "$mission_completed_tooltip_1$“#Y 斯韦什塔里之墓#!”$mission_completed_tooltip_2$"
 me_getae_2_desc:0 "既然[ROOT.GetCountry.GetRuler.GetName]决定我们将征服沿海的希腊城邦，[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetHerHim]首先关注的就是[ROOT.GetCountry.GetName]的人力资源问题——如果没有足够的士兵来填充征召兵，就无法发动战争，我们需要成千上万的战士。\n\n随后开始了艰苦的训练期，将部落成员锻造成为准备迎接即将到来的艰难日子的兄弟会。最终确信[ROOT.GetCountry.GetAdjective]军队的实力后，[ROOT.GetCountry.GetRuler.GetFirstName]决定我们的部队将通过陆路行军，避免不必要的危险，即运送我们的部队穿越#E 伊斯忒耳河#!。\n\n在查看地图后，[ROOT.GetCountry.GetRuler.GetFirstName]主张我们应该向东行军。唯一的“复杂之处”，正如[ROOT.GetCountry.GetRuler.GetFirstName]所描述的那样，是我们这样的行动将导致与#E 卡耳庇亚人#!发生冲突，他们在我们的边界上建造了令人印象深刻的要塞。\n\n[SCOPE.sCharacter('random_dude').GetName]抱怨说[GetProvince('(int32)4800').GetName]的要塞将让我们的士兵难以攻克，然后建议我们同时准备向南进攻——在[GetProvince('(int32)4809').GetName]附近有一处自然的河流渡口，可以将我们的部队带入防守较为薄弱的#E 克罗彼左亚#!省。\n\n然而，这一“南部战略”也有反对者；特别是[SCOPE.sCharacter('random_dude_2').GetName]认为这是一种奢侈的花费，在我们需要资源最多的时候会分散我们的资源。"
 me_getae_2_title:0 "卡耳庇亚走廊"
 me_getae_2_tooltip:0 "$mission_completed_tooltip_1$“#Y 卡耳庇亚走廊#!”$mission_completed_tooltip_2$"
 me_getae_3_desc:0 "既然已经确立了必要的宣称，[ROOT.GetCountry.GetRuler.GetName]亲自见证了我们的征召兵从[ROOT.GetCountry.GetCapital.GetName]出发。不久之后，我们的部队就会到达西部的山脉，那里一些远亲部落已经集结了他们的力量。\n\n我们已经观察了预兆，神灵已经清楚地表明，这些分离出去的部落在我们的[ROOT.GetCountry.GetAdjective]霸权下会更加安全。为了即将到来的胜利，我们的战士们已经在山脚下进行了训练——我们必须准备好应对艰难的地形。"
 me_getae_3_title:0 "向群山进军"
 me_getae_3_tooltip:0 "$mission_completed_tooltip_1$“#Y 向群山进军#!”$mission_completed_tooltip_2$"
 me_getae_4_desc:0 "在我们摧毁他们之前，[GetCountry('TYR').GetName]的部落曾在[GetProvince('(int32)4294').GetName]建造了他们的首都——[ROOT.GetCountry.GetRuler.GetName]记得带领[ROOT.GetCountry.GetRuler.GetHerHis]的部队进军到他们在起伏乡野顶部建造的堡垒。\n\n现在这些#E 拉塔肯瑟斯人#!已经被制服，已经决定将他们在安顾斯提亚的定居点改造成一座矿山。虽然[ROOT.GetCountry.GetName]有自己的石头资源，但这里地下蕴藏着丰富的资源——我们的奴隶永远也无法耗尽山脚下的采石场。"
 me_getae_4_title:0 "安顾斯提亚的矿山"
 me_getae_4_tooltip:0 "$mission_completed_tooltip_1$“#Y 安顾斯提亚的矿山#!”$mission_completed_tooltip_2$"
 me_getae_5_desc:0 "我们为争取[GetProvince('(int32)4519').GetName]居民所做的努力终于有了回报——如今当地总督已欣然欢迎[ROOT.GetCountry.GetAdjective]商人前往#E 伊斯特河#!河口的港口贸易。\n\n目睹我们的商队和平地将货物运往#E 黑海#!沿岸，与异国商人交易，这番景象着实令人欣慰。希腊人对我们的信任与日俱增，甚至允许我们进入邻近的[GetProvince('(int32)4516').GetName]城采购奢侈品，再运回[ROOT.GetCountry.GetCapital.GetName]。\n\n当地总督对我们日益增长的经济兴趣印象深刻，主动提议派遣一位#E 色雷斯官员#!——名为#E 布泽斯#!的能人——前往我国都城，以提升我们的市政技术。不过，我们必须预先支付这位官员一年的薪俸。"
 me_getae_5_title:0 "色雷斯的商人"
 me_getae_5a_tooltip:0 "$mission_completed_tooltip_1$“#Y 色雷斯的商人#!”$mission_completed_tooltip_2$"
 me_getae_6_desc:0 "[ROOT.GetCountry.GetAdjective]的桨帆船在#E 伊斯忒耳河#!上频繁航行已经成为日常景象，这些船只从新建成的[GetProvince('(int32)4811').GetName]港口出发，该港口正迅速成为[ROOT.GetCountry.GetName]最重要的领土之一。\n\n[GetProvince('(int32)4811').GetName]的农田已经成为许多海盗的家园，他们向我们海岸上的不安的希腊朋友们保证，他们的航运不会受到骚扰。在[GetProvince('(int32)4519').GetName]签署了一份谅解条约，由[ROOT.GetCountry.GetRuler.GetName]和当地总督共同见证，现在我们的船只在#E 黑海#!的巡逻，希望能捕获迷航的贸易船只，无论它们来自哪里或要去往何处。"
 me_getae_6_title:0 "革提亚的桨帆战船"
 me_getae_6_tooltip:0 "$mission_completed_tooltip_1$“#Y 革提亚的桨帆战船#!”$mission_completed_tooltip_2$"
 me_getae_7_desc:0 "在#E 黑海#!沿岸的希腊人心中，唯有一个名字能让他们闻风丧胆——[ROOT.GetCountry.GetRuler.GetName]。\n\n正是[ROOT.GetCountry.GetRuler.GetFirstName]将他们驱逐出富丽堂皇的神庙与雅致宅邸，将他们的儿女掳为[ROOT.GetCountry.GetAdjective]贵族的奴隶。这位被称为#E \"扎尔莫克西斯之斧 #!\"的[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]，在洗劫城镇与神庙时毫不留情，让所有人都领教了北方蛮族的狂暴怒火。每当[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]劫掠完圣所内殿的宝库后，那些孱弱的希腊神像往往会被砸碎头颅，残破的大理石头颅滚落在地，任人践踏。\n\n如今的[ROOT.GetCountry.GetName]已成为连高傲的#E 希腊#!本土都为之震颤的国度……想当年马其顿人与雅典人还肆意干涉我国内政，如今这般变化，真是天翻地覆！"
 me_getae_7_title:0 "海岸征服者"
 me_getae_7_tooltip:0 "$mission_completed_tooltip_1$“#Y 海岸征服者#!”$mission_completed_tooltip_2$"
 me_getae_8_desc:0 "经过漫长而激烈的多次战役，[ROOT.GetCountry.GetName]终于成功地占领了#E 斯基泰#!这个省份——这是一个了不起的成就，特别是考虑到敌方投入的大量资源对抗我们的国家。\n\n除了激烈的地面战斗，还有许多艰难且旷日持久的围攻，因为沿海希腊城市的自豪居民们储备充足，并由一些北方[GetProvince('(int32)350').GetName]最好的士兵进行防卫。但最终，雇佣军和人力并没有拯救他们，胜利再次属于我们。\n\n现在我们的士兵已经从战场上返回，一些新征服的沿海城市代表向[ROOT.GetCountry.GetCapital.GetName]提出了一个有趣的提议，询问他们能否通过作为[ROOT.GetCountry.GetName]的藩属国来保留名义上的独立。当然，选择完全取决于[ROOT.GetCountry.GetRuler.GetName]，[ROOT.GetCountry.GetRuler.GetSheHe]已经成为我们国家的一个名人——没有人会拒绝给予[ROOT.GetCountry.GetRulerTitle]所希望的任何东西。"
 me_getae_8_title:0 "夺取城市"
 me_getae_8_tooltip:0 "$mission_completed_tooltip_1$“#Y 夺取城市#!”$mission_completed_tooltip_2$"
 me_getae_8a_tooltip:0 "#T 俄耳伽墨，伊斯特洛斯，托弥斯和卡拉提斯#!将被释放为#G 附庸国#!。"
 me_getae_9_desc:0 "虽然有些人愚蠢地认为[ROOT.GetCountry.GetRuler.GetName]只会说大话而不采取行动，但最近[ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle]参与的决斗彻底平息了这种无谓的议论。\n\n现在，每当[ROOT.GetCountry.GetRuler.GetFirstName]在[ROOT.GetCountry.GetCapital.GetName]的街道上行走时，当地民众都会自发地欢呼，回忆起我们领导人的英勇事迹。在如此出色的武艺展示之后，[ROOT.GetCountry.GetName]内部很少有人愿意与[ROOT.GetCountry.GetRuler.GetHerHim]交手。"
 me_getae_9_title:0 "无心游戏"
 me_getae_9_tooltip:0 "$mission_completed_tooltip_1$“#Y 无心游戏#!”$mission_completed_tooltip_2$"
 release_orgame_feudatory_tt:0 "#Y 我们将释放#!#T  俄耳伽墨#!#Y 作为#!#G 藩属#!。"
 send_dem_thracians_a_gift_cuh:0 "#Y 我们必须给#T 哈尔密里斯#!的统治者送一份礼物#!。"

 befriend_governor_of_halmyris_tt:0 "#Y 我们的统治者必须是#!#T 哈尔密里斯#!#Y 总督#!的#T 朋友#!。"
 dacian_stronghold_modifier:0 "达契亚的堡垒"
 desc_dacian_stronghold_modifier:0 "我们的首都城市是强大的达契亚人的权力中心，他们为自己建立了一个辉煌的王国。"
 desc_getae_halmyris_trade_modifier:0 "我们加强了与访问哈尔密里斯港口的商人们的贸易联系，确保了货物稳定流入我们的首都。"
 desc_getia_meets_the_gauls_mod:0 "我们已经与西边的凯尔特人建立了定期贸易。"
 desc_getia_trained_falx_warriors_mod:0 "我们的征召兵已经接受了使用我们人民的传统武器——弯刀和短剑的广泛训练。"
 desc_getian_buccaneers_mod:0 "我们的部落成员已经开始沿着伊斯特河从庇厄腓吉亚纳港口进行掠夺，为我们的国家带来了一条秘密的财富来源。"
 desc_getian_grains_2_mod:0 "我们在首都建造了一个大型谷仓，因为我们意识到需要为严寒的冬季储存食物。"
 desc_getian_grains_mod:0 "这个农场是我们国家重要的食物供应来源。"
 desc_getian_light_cavalry_hill_mod:0 "我们的轻骑兵已经在喀尔巴阡山脉的山麓进行了机动训练，使他们在艰难地形中的战斗能力得到了提升。"
 desc_getian_mountain_boys_mod:0 "我们的部队充满斗志，准备将较弱的部落驱逐出他们居住的山区领土。"
 desc_getian_move_slaves_tribesmen_mod:0 "我们机智的部落成员已经团结起来，聚集资源并冒险进入我们周围的未开发土地，努力为我们的人民带来荣耀。"
 desc_getian_shield_of_dacians_mod:0 "我们的防御工事系统建立在一个非常特殊的建筑风格之上，因为我们融合了我们自己本地的传统元素，同时也采用了希腊大师们使用的防御方法。"
 desc_getian_slave_mine_angustia:0 "安顾斯提亚的矿山是我们人民重要的石材来源，他们利用这些采石场来建造城市和防御工事。"
 desc_greek_getian_foreign_quarter_mod:0 "为了纪念与资助此处建设的希腊沿海商人达成的协议，城市中的一大块区域已被划拨给他们，并且他们获得了当地税收的百分之二十五。"
 desc_walls_of_sarmizegetusa_getia_mod:0 "革提亚人已经将这个省份建造成了一座巨大的要塞城市，它更像是一个军事营地而不是一个正常的城镇。"
 getae_civil_war_begins_in_earnest_tt:0 "#R 我们将夺取#T 达契亚#!的王位，引发内战！#!"
 getae_halmyris_trade_modifier:0 "哈尔密里斯贸易中心"
 getae_mission_01_inv:0 "达契亚的剑与盾"
 getae_mission_01_inv_10_task:0 "清除强盗营地"
 getae_mission_01_inv_10_task_DESC:0 "我们收到消息，一群逃亡奴隶在山区建立了一个强盗营地，[ROOT.GetCountry.GetRuler.GetName]想要看到这个营地被摧毁。\n\n#Y 这将启动一个事件链#!。\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 getae_mission_01_inv_11_task:0 "腹地狩猎"
 getae_mission_01_inv_11_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]被邀请参加一场在野外举行的狩猎活动；这对于平时忙于处理[ROOT.GetCountry.GetCapital.GetName]日常混乱事务的统治者来说，是一次受欢迎的改变。\n\n#Y 这将启动一个事件链#!。\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 getae_mission_01_inv_12_task:0 "#E 达契亚#!的崛起"
 getae_mission_01_inv_12_task_DESC:0 "让我们的敌人因我们今天所成就的一切而颤抖——我们接受了我们的权利，#E 达契亚#!的形成。从此以后，我们不再有任何理由害怕周围的人，因为我们的力量无可争议，我们的权威从[ROOT.GetCountry.GetCapital.GetName]辐射开来。向[ROOT.GetCountry.GetRuler.GetName]致敬，是他带领我们来到了这一刻！\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 getae_mission_01_inv_13_task:0 "使用弯刀和短剑训练"
 getae_mission_01_inv_13_task_DESC:0 "尽管我们的征召兵已经是相当强大的，但我们认识到应该鼓励士兵们使用我们传统的武器——弯刀和短剑进行训练。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 getae_mission_01_inv_14_task:0 "强化[GetProvince('(int32)4282').GetName]"
 getae_mission_01_inv_14_task_DESC:0 "有很多理由我们应该加强建设[GetProvince('(int32)4282').GetName]区域；它的重要位置使其能够控制进出西部山脉的通道，并且会是一个建立坚固城市的绝佳位置。\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 getae_mission_01_inv_16_task:0 "山麓之主"
 getae_mission_01_inv_16_task_DESC:0 "既然我们已经征服了围绕我们所宣称的山脉周围的荒地，我们的部队北进已没有任何物理障碍——我们是这些山麓的主宰。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 getae_mission_01_inv_17_task:0 "西进"
 getae_mission_01_inv_17_task_DESC:0 "有什么能阻止我们向西推进对抗那些部落呢？没有——绝对没有。让我们把敌人赶离我们的边境，以便我们的殖民者能够和平定居。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 getae_mission_01_inv_18_task:0 "邂逅凯尔特人"
 getae_mission_01_inv_18_task_DESC:0 "在我们建立#E 达契亚#!的过程中，我们不得不与我们西边内陆地区的#E 高卢#!文化部落作战——这使我们又一次发现自己处于的不利局面。但我们并不惧怕这些凯尔特人，如果有必要，我们会彻底摧毁他们以及任何挡在我们面前的人！\n\n希望这些外来者对和平感兴趣……为了他们自己的缘故。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 getae_mission_01_inv_19_task:0 "伊斯忒耳河畔的索耳努斯"
 getae_mission_01_inv_19_task_DESC:0 "因为我们与希腊沿海地区掌权人的联系为我们双方带来了财富，一群商人提议我们更进一步，允许他们资助在我国境内建造一座城市。好处显而易见，这是我们在该地区日益增长的经济实力的明确标志。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 getae_mission_01_inv_1_task:0 "友与敌？"
 getae_mission_01_inv_1_task_DESC:0 "我们不能忽视东部海岸上的#Y 希腊人#!的存在——这些色雷斯人的走狗可能会在我们最不经意的时候咬我们一口。但非得开战吗？如果我们愿意寻找的话，我们之间还是有共同点的。\n\n让我们召开一次战议会来决定如何处理这些外来者，同时我们也要准备好应对之策，以防万一……\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 getae_mission_01_inv_20_task:0 "革提亚的粮食"
 getae_mission_01_inv_20_task_DESC:0 "我们绝不能忽视我们的粮食储备，因为饥饿和绝望会迅速降临到那些没有为明天做计划的人身上。只要我们有能力这样做，我们就应该建造农田庄园以最大化我们的粮食生产。\n\n在我们过于急躁之前，我们需要确保[ROOT.GetCountry.GetCapital.GetName]的粮仓有足够的容量来储存我们的收成。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 getae_mission_01_inv_21_task:0 "达契亚之盾"
 getae_mission_01_inv_21_task_DESC:0 "如果我们投资于在整个[ROOT.GetCountry.GetName]建设的防御工事网络，充分利用我们的山区和森林地形，我们将能够为我们的人民提供安全保障——这确实是一个值得追求的崇高目标。\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 getae_mission_01_inv_22_task:0 "山中的宝石"
 getae_mission_01_inv_22_task_DESC:0 "我们听说在#Y 科斯托玻基亚#!省的山区附近可以找到#T 宝石@gems! #!。我们应当派遣一支探险队前往崇山峻岭，看看他们能否找到这传说中的财富来源。\n\n#Y 当完成这项任务后，#!#T 帕特里达瓦#!#Y 将产出#!#G 宝石#!。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 getae_mission_01_inv_23_task:0 "斯韦什塔里之墓"
 getae_mission_01_inv_23_task_DESC:0 "既然[ROOT.GetCountry.GetRuler.GetName]已经处于可以开始思考[ROOT.GetCountry.GetRuler.GetHerHis]遗产的位置，现在是时候建造一座能够历经所有时代的建筑了。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 getae_mission_01_inv_24_task:0 "佩楞达瓦的白银宝藏"
 getae_mission_01_inv_24_task_DESC:0 "#E 扎尔莫克西斯#!赐福于我们的国家，特别是赐福于[ROOT.GetCountry.GetRuler.GetName]，通过预兆表明我们应该建造一处圣地，以便我们的信仰之光能够壮大。\n\n不仅这座圣殿必须被建造，而且还必须用一件精致的宝物来装饰它。神灵赐予了我们丰盛的时刻，现在轮到我们回馈了。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 getae_mission_01_inv_2_task:0 "卡耳庇亚走廊"
 getae_mission_01_inv_2_task_DESC:0 "通往海岸的最快路径要穿过#E 卡耳庇亚#!人居住的土地，但这只是暂时的干扰，我们打算解决这个问题。如果我们行动迅速，我们可以为自己夺取这条至关重要的陆上路线，但我们首先必须确保自己已经为冲突做好了准备。\n\n#R 完成这项任务将绕过任务树的另一项。#!\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 getae_mission_01_inv_3_task:0 "向山区推进"
 getae_mission_01_inv_3_task_DESC:0 "战争的时刻即将到来——我们必须摧毁周围的弱小部落，并将他们纳入我们的[ROOT.GetCountry.GetAdjective]霸权之中。准备好我们的宣称，并让战士们知道他们很快就要被派去战斗！\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 getae_mission_01_inv_4_task:0 "安顾斯提亚的矿山"
 getae_mission_01_inv_4_task_DESC:0 "我们不断壮大的国家渴望获得建造帝国所需的原材料；我们对木材和石头的需求就像对葡萄酒和面包一样迫切。在[GetProvince('(int32)4294').GetName]建立一座矿山会是一个绝佳的选择，这将增加我们在[GetProvince('(int32)4805').GetName]的森林中目前所获取的资源。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 getae_mission_01_inv_5_task:0 "色雷斯的商人"
 getae_mission_01_inv_5_task_DESC:0 "[GetProvince('(int32)4519').GetName]的小港口位于#E 伊斯忒耳河#!的河口，控制着进出#E 黑海#!的贸易。如果我们增加与该地区势力的关系，我们只会作为朋友和伙伴更加亲近。\n\n#R 完成这项任务将绕过使命树的另一项。#!\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 getae_mission_01_inv_6_task:0 "革提亚的桨帆战船"
 getae_mission_01_inv_6_task_DESC:0 "既然我们已经在[GetProvince('(int32)4519').GetName]建立了贸易中心，那我们现在就需要一支能够往返于海岸运送货物的舰队。在风景优美的地方建立港口对我们来说是有利的，因为我们希望许多旅行者能频繁地光顾我们的水域……这也是那些在这条河流安家的众多海盗盗所共有的愿望。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 getae_mission_01_inv_7_task:0 "海岸征服者"
 getae_mission_01_inv_7_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]已经带领我们的军队取得了迄今为止最伟大的胜利，征服了那些早已为我们即将进攻做足准备的城市，然而这些城市最终仍然无力抵挡。\n\n最为珍贵的奖赏就在眼前，几乎触手可及；那就是#E 吕西马科斯#!的首都城市及其所在的#E 博斯普鲁斯#!地区。我们绝不会在试图夺取这一切的过程中失败！\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 getae_mission_01_inv_8_task:0 "夺取城市"
 getae_mission_01_inv_8_task_DESC:0 "终于，我们成功摧毁了沿海希腊人的防御，将他们众多富饶的城市据为己有。我们不会浪费现在属于我们的宝贵资源，而是会利用它们继续向南推进！我们的军队不会停止，直到他们到达[GetProvince('(int32)482').GetName]的城墙。\n\n#Y 我们将有机会释放#! #T 俄耳伽墨，伊斯特洛斯，托弥斯和卡拉提斯#! #Y 作为#! #G 附庸国#! #Y ，这需要#! #G 75点政治影响力#!。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 getae_mission_01_inv_9_task:0 "无心游戏"
 getae_mission_01_inv_9_task_DESC:0 "有些人质疑[ROOT.GetCountry.GetRuler.GetName]是否有足够的军事才能带领[ROOT.GetCountry.GetName]走向荣耀。众所周知，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]善于言辞，但人们在怀疑[ROOT.GetCountry.GetRuler.GetFirstName]是否能用大胆的行动来支持[ROOT.GetCountry.GetRuler.GetHerHis]的言论。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 getae_mission_01_inv_BUTTON_TOOLTIP:0 "没有人能够阻挡我们的梦想——建立起强大的#E 达契亚#!……"
 getae_mission_01_inv_CRITERIA_DESCRIPTION:0 "当我们建立#E 达契亚#!，并且建设了一座配得上其名号的首都城市后，这个使命才算完成。"
 getae_mission_01_inv_DESCRIPTION:0 "我们的人民，即定居在此地的#E 革提亚#!，我们居住在北方#E 喀尔巴阡山脉#!南侧绵延起伏的林木覆盖的丘陵之中，我们的领土范围以#E 伊斯忒耳河#!的强大水流为界，这条河流将我们与居住在其南岸的#E 色雷斯人#!分隔开来。\n\n虽然我们远离了正在撕裂亚洲的冲突，但对我们而言时代也在发生变化；东部沿海城市正涌入越来越多的#E 希腊#!殖民者，他们对我们的土地虎视眈眈，周围还有凶猛的野蛮人，一旦我们的警戒稍有松懈，就会毫不犹豫地夺取我们的家园。我们仅仅自由生活了几代人的时间，绝不会允许任何人再次统治我们。\n\n虽然有许多障碍挡在我们面前，但我们的命运因此更加呼唤着我们——我们必须超越这一切，将#E 达契亚人#!团结在一把剑之下，成为对抗任何敢于与我们为敌者的盾牌。"

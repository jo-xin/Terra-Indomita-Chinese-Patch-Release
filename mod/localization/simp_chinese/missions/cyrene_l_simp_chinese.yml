 battiad:0 "巴图斯的血脉"
 battiad_desc:0 "巴图斯一世是最早定居在昔兰尼加的希腊人领袖。他原名亚里士多德或阿里斯泰俄斯，在德尔斐神谕的指引下前往利比亚建立殖民地后，改名为‘巴图斯’——在本地利比亚语中意为‘国王’。他的殖民地后来发展为城市，并成为昔兰尼加的第一位国王。\n\n巴图斯的后裔继续统治昔兰尼加长达两百年，直到昔兰尼加被纳入波斯帝国。巴图斯家族的统治以希腊移民与利比亚原住民之间的良好关系著称，同时也以对哲学与学术的慷慨支持闻名。\n\n#G 此特质将由 [CHARACTER.GetPraenomen] 的后代继承。#!"
 cyr_academies_01.1.a:0 "整个世界，摆在我们面前!"
 cyr_academies_01.1.desc:0 "今天，[eratosthenes_scope.GetName]宣布了一个突破性的发现；通过测量不同地点的相同棒子投下的影子的长度差异，[eratosthenes_scope.GetFirstName]能够计算出地球的精确周长。他并不满足于成为第一个知道世界真实大小的人，接着他还计算了地球自转轴相对于太阳平面的倾斜度。他甚至通过将他的计算结果与访问过文明外围遥远省份的旅行者的记述相结合，绘制了第一张已知世界的精确地图。\n\n他本人出生于[GetProvince('(int32)3360').GetName]，但在[GetProvince('(int32)416').GetName]和[GetProvince('(int32)516').GetName]学习后赢得了他作为学者的声誉。他因所从事的广泛课题而闻名；除了对地球大小的研究外，他还发明了平行线和经线来指示地球上的位置，是第一个试图确定特洛伊战争确切日期的人，并开发了一种有效识别质数的方法。  \n\n[eratosthenes_scope.GetFirstName]的发现被收集在他的巨作《对地球大小的修正》中。"
 cyr_academies_01.1.t:0 "地球的周长"
 cyr_academies_01.10.a:0 "我们的经济一塌糊涂!"
 cyr_academies_01.10.a.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]#R 失去了#! #Y $cyr_new_export_markets$、#!#Y $cyr_silphium_medicine$、#!#Y $cyr_silphium_cuisine$、#!#Y $cyr_silphium_economy$和#! #Y $cyr_silphium_scarce$的效果#!。\n\n#Y $cyr_silphium_settlement$#! 和#Y $cyr_silphium_trade_hub$#! 是#R 从每个领土上移走#!\n\n。"
 cyr_academies_01.10.a.ttt:0 "\n"
 cyr_academies_01.10.desc:0 "无节制地开采#Y 罗盘草#! 已经导致该植物的衰退，以至于我们的采集者现在很难找到任何它。就实际情况而言，罗盘草已经灭绝了。曾经使我们国家繁荣的罗盘草贸易已经完全枯竭，我们的商人现在正努力在他们的外国对手占有天然优势的行业中实现多样化。不用说，这是一场灾难--对我们经济的打击，我们可能永远无法完全恢复。如果我们在还有时间的时候就采取行动就好了……\n\n今年收获的唯一一株，也是最后一株罗盘草—已经被晒干，保存起来，并赠送给[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，他打算把它作为一种好奇心来保存--这是曾经使[SCOPE.GetRootScope.GetCountry.GetName]闻名于整个地中海的阿波罗礼物的最后遗迹。"
 cyr_academies_01.10.t:0 "罗盘草绝迹"
 cyr_academies_01.11.a:0 "一个不可避免的牺牲。"
 cyr_academies_01.11.desc:0 "由于我国政府的及时行动，#Y 罗盘草#! 的收获已经稳定在一个可持续的水平。\n\n虽然目前的出口率与罗盘草贸易曾经给我们国家带来的惊人财富相比是一种退步，但它至少保证了[SCOPE.GetRootScope.GetCountry.GetName]的人民能够从阿波罗的礼物中获利，并世代相传。"
 cyr_academies_01.11.t:0 "罗盘草的开采得到稳定"
 cyr_academies_01.2.a:0 "昔兰尼哲学正在改变……"
 cyr_academies_01.2.desc:0 "[SCOPE.GetRootScope.GetCountry.GetName]是著名的昔兰尼学派哲学学园所在地。该学派由#Y 亚里斯提卜“长者”#!在苏格拉底时代创立，但其多数学说直至[GetCharacter('(int32)233').GetName]时期才系统化。这位被称为“母教者”（Metrodidaktos）的哲学家，其哲学思想源于母亲阿瑞蒂（Arete）——她正是亚里士多德之女。\n\n昔兰尼学派是主张享乐主义的哲学流派，强调个人快乐乃人生至高目标。其他价值观念——如德行生活——仅在能增进个人快乐或减轻个人痛苦的范围内具有意义。\n\n然而近来，昔兰尼派的影响力日渐式微，主要归因于新晋非昔兰尼派享乐主义哲学家的崛起——例如[GetCharacter('(int32)218').GetName]，其思想体系较阿里斯提普更为精炼。作为回应，新一代昔兰尼学派哲学家应运而生，他们正致力于革新学派理念，使其能与当代其他哲学流派抗衡。其中尤为引人瞩目的是[GetCharacter('(int32)469').GetName]、[GetCharacter('(int32)230').GetName]和[GetCharacter('(int32)468').GetName]的学说。 \n\n与其他昔兰尼学派成员一样，[GetCharacter('(int32)469').GetName]认为快乐是人生的终极目标。但不同于阿里斯提普斯，他主张应针对每项具体行为考量快乐（而非以终生累积的快乐总量为准），并认为痛苦并非快乐的对立面。因此，对[GetCharacter('(int32)469').GetFirstName]而言，友谊、忠诚与爱国等美德虽可能带来长远痛苦，但因能创造当下愉悦，仍可视为善行。\n\n[GetCharacter('(int32)230').GetName]同样秉持昔兰尼学派“享乐即终极目标”的核心信念。但他公开否定友谊与爱国主义，认为这些会干扰幸福追求，并宣称“世界即其祖国”。事实上，[GetCharacter('(int32)230').GetFirstName]认为偷窃、通奸等行为本身并无本质错误——仅因社会施加的惩罚会带来痛苦（从而削减快乐）才应避免。然而[GetCharacter('(int32)230').GetFirstName]最具争议的论断，莫过于他坚称诸神——至少是希腊化世界普遍信奉的神祇——皆为虚妄，诸神、祈祷、祭祀与亵渎皆是人类的发明。他执意宣称神明不存在，因此获得了“Atheus”（“无神论者”）的绰号。\n\n[GetCharacter('(int32)468').GetName]同样将幸福视为人生至高目标。与另外两人不同，他认为实现真正幸福在根本上是不可能的。此外，[GetCharacter('(int32)468').GetFirstName]认为人无法真正理解他人的经历。因此对他而言，国王与奴隶的生活并无本质区别：两者皆无法获得真实幸福，都不得不承受痛苦，且因无法知晓对方经历而无法相互比较。因此，[GetCharacter('(int32)468').GetFirstName]的人生目标并非追求最大快乐，而是最小化个人痛苦——而对他而言，消解痛苦的终极方式便是死亡。这是[GetCharacter('(int32)468').GetFirstName]最激进的论断：死亡优于生存，因死亡终结一切苦痛。传闻称[GetCharacter('(int32)468').GetFirstName]的演讲已诱使数百人自尽，故获“Peisithanatos”——“死亡劝诱者”的绰号。"
 cyr_academies_01.2.t:0 "昔兰尼哲学的未来"
 cyr_academies_01.3.a:0 "赫基西亚德哲学已成为昔兰尼学派的主导学派。"
 cyr_academies_01.3.desc:0 "我们对 #Y 赫基西亚德学派（Hegesiad School）#! 的积极支持，使其成为 [SCOPE.GetRootScope.GetCountry.GetName] 实际上的国家哲学。\n\n[GetCharacter('(int32)468').GetName] 认为，幸福是人生中最高的目标。然而，他坚信真正的幸福在本质上是无法实现的。此外，他认为人无法真正理解他人的经历。因此，在 [GetCharacter('(int32)468').GetFirstName] 看来，国王的生活与奴隶的生活并无区别：两者都无法获得真正的幸福，都必须承受苦难，而他们也无法彼此比较，因为他们无法了解对方的感受。因此，对 [GetCharacter('(int32)468').GetFirstName] 而言，人生的意义不在于追求快乐的最大化，而在于将痛苦最小化。而对 [GetCharacter('(int32)468').GetFirstName] 来说，没有什么比死亡更能减少痛苦的方式了。这是 [GetCharacter('(int32)468').GetFirstName] 最大胆的主张：死亡优于生命，因为死亡之中没有痛苦。有传言称，[GetCharacter('(int32)468').GetFirstName] 的讲学已说服了数百人结束自己的生命，因此他获得了“佩西坦纳托斯”——“劝死者”——的绰号。\n\n[GetCharacter('(int32)468').GetFirstName] 的思想集中于他最著名的作品《绝食而亡》一书中。该书以一位智者向朋友解释为何选择饿死自己为主题，书中对人类处境悲惨的描述据说极具说服力，以至于许多读者读后都会开始思考自杀的可能。"
 cyr_academies_01.3.t:0 "推广赫基西亚德哲学"
 cyr_academies_01.4.a:0 "狄奥多里德哲学已成为昔兰尼学派的主导流派。"
 cyr_academies_01.4.desc:0 "我们对 #Y 狄奥多里德学派（Theodorid School）#! 的积极支持，使其成为 [SCOPE.GetRootScope.GetCountry.GetName] 实际上的国家哲学。\n\n[GetCharacter('(int32)230').GetName] 拥有昔兰尼学派所共有的信念，即快乐是人生的终极目标。然而，他公开拒绝将友谊与爱国视为通往幸福的路径，反而坚持认为：“世界即是他的祖国”。事实上，[GetCharacter('(int32)230').GetFirstName] 认为诸如盗窃与通奸等行为本身并无对错之分，它们之所以应被避免，仅仅是因为社会对此类行为施加的惩罚会带来痛苦（从而减少快乐）。然而，[GetCharacter('(int32)230').GetFirstName] 最具争议性的主张远不止于此。他坚称——至少在希腊化世界所普遍信奉的诸神——是虚假的。他主张：神明、祈祷、献祭与渎神，不过是人类的发明。他对神明存在的彻底否定，使[GetCharacter('(int32)230').GetFirstName]获得了“无神者”（Atheus）的绰号。\n\n[GetCharacter('(int32)230').GetFirstName] 最具影响力的著作是一本名为《论诸神》（On the Gods）的书籍，集中阐述了他的神学思想。据说，这本书对后来的享乐主义哲学家（包括 [GetCharacter('(int32)218').GetName]）产生了深远影响。"
 cyr_academies_01.4.t:0 "狄奥多里德哲学得到推广"
 cyr_academies_01.5.a:0 "安尼克里德哲学已成为昔兰尼学派的主导学派。"
 cyr_academies_01.5.desc:0 "我们对#Y 安尼克里德学派#! 的积极支持，使其成为[SCOPE.GetRootScope.GetCountry.GetName]事实上的国家哲学。\n\n与其他赛尔纳学派一样，[GetCharacter('(int32)469').GetName]认为快乐是人生的终极目标，但与其他学派不同的是，他认为快乐需要单独考虑每个行为（而不是一生中累积的总快乐），而且痛苦不是快乐的反面。因此，对[GetCharacter('(int32)469').GetFirstName]来说，友谊、忠诚和爱国主义等美德可以是好的，因为它们在当下会带来快乐，即使它们偶尔会在长期内造成痛苦和折磨。"
 cyr_academies_01.5.t:0 "提倡安尼克里德哲学"
 cyr_academies_01.6.a:0 "一个真正的艺术大师!"
 cyr_academies_01.6.desc:0 "在[GetProvince('(int32)3360').GetName]的众多作家和诗人中，有一个人高高在上：0 [kallimakhos_scope.GetName]已经被公认为可能是这个时代最伟大的诗人。  [kallimakhos_scope.GetFirstName]的美学哲学被称为卡里马切主义，强调短小精悍的作品，而不是长篇大论的故事，在他的同辈作家中已具有很大的影响力。[kallimakhos_scope.GetFirstName]据说他 \"为希腊时代重塑了诗歌\"，而且很可能会塑造未来几个世纪，甚至几千年的文学方向。\据说他本人创作了800多部作品，其中最突出的是 \"Pinakes\"（所有希腊文学的综合目录）、\"Aetia\"（关于现实的神话起源的一系列诗歌）、\"Hecale\"（通过英雄特修斯的眼睛讲述一位老妇人的生活的史诗），以及他的Iambs（讽刺诗）和Hymns（一套60首宗教颂歌）。"
 cyr_academies_01.6.t:0 "希腊化时代的诗歌"
 cyr_academies_01.7.a:0 "#Y 伊壁鸠鲁派#!是昔兰尼学派的自然继承者。"
 cyr_academies_01.7.b:0 "我们的公民最好效仿#Y 斯多葛主义#!的毅力。"
 cyr_academies_01.7.c:0 "我们必须像#Y 犬儒主义#!那样顺应自然地生活。"
 cyr_academies_01.7.desc:0 "由于其对快乐的享乐主义关注，昔兰尼哲学不利于建立一个功能完善的国家。幸运的是，昔兰尼主义的流行已经在下降。在政府的支持下，我们应该能够引导[GetProvince('(int32)3360').GetName]的学院走向正确的方向。在现有的许多哲学流派中，有三个特别适合作为新的国家哲学的候选人：\n\n#Y 伊壁鸠鲁主义#!是另一个享乐主义流派，在许多方面是我们的赛里纳主义的继承者。然而，赛尔纳主义强调的是肉体的快乐，而伊壁鸠鲁主义则更倾向于心灵的快乐。伊壁鸠鲁派拒绝肉体的快乐，如贪食和欲望，认为从长远来看，它们造成的痛苦多于快乐。相反，[GetCharacter('(int32)218').GetFirstName]的追随者在追求来自友谊、正义和智力追求的非物质快乐的同时，也过着适度的生活。\n\n#Y 斯多葛主义#!强调坚忍不拔、自我控制和过一种有德行的生活。对斯多葛派来说，幸福不是生活的目标，而是按照斯多葛派的美德生活的自然结果。为此，斯多葛派努力使自己摆脱激情，而是以理性、逻辑和平静的心态来应对生活中的一切。通过遵循这些教义，斯多葛派相信他们可以避免痛苦--从而获得幸福--通过承认痛苦事件在宇宙的自然秩序中发挥的作用。\n\n最后，#Y 犬儒主义#!着重于通过拒绝社会的人为惯例和按照自然秩序生活来追求一种有德行的生活。犬儒主义宣扬贫穷和无耻，不是因为他们低于耻辱，而是因为他们认为自己高于物质财富和耻辱。相应地，犬儒主义者生活在贫困之中，毫不犹豫地在公共场合进食、解手或进行交际，经常不遗余力地使自己的状况尽可能地显露出来，希望能够传播他们的哲学。"
 cyr_academies_01.7.t:0 "新时代的新思想"
 cyr_academies_01.8.a:0 "阿波罗真的把这个礼物赐给了我们。"
 cyr_academies_01.8.desc:0 "我们国家最重要的贸易产品是#Y 罗盘草#!。这种极其罕见的植物只生长在昔兰尼加，但却是整个地中海世界医药的宝贵组成部分。\n\n银杏被认为可以治疗从咳嗽和喉咙痛到疣子、消化不良和肠道突出等任何疾病。然而，它最重要的用途是防止生出意外的孩子。想避免一夜激情带来的意外后果的妇女，会在与伴侣同房前食用部分植物，这样就不会有孩子在她的子宫里扎根。同样地，怀疑意外怀孕的妇女会食用更大剂量的希尔菲姆，使她的身体拒绝孩子。\n\n这些特性以及罗盘草不能被种植的事实，因为它拒绝在昔兰尼加的边界外生长，使得罗盘草对我们的经济如此重要，以至于在昔兰尼加铸造的大多数硬币的其中一面都有这种植物的图像。\n\n在我们的王国之外，希尔菲姆与爱情有着密切的联系，以至于抱着希尔菲姆种子的果实形状成为许多地方公认的爱情象征。显然，一些不熟悉这种植物的野蛮人把它称为“心形”，尽管有人能从果实的形状中看到人的心脏，这对我们来说是个谜......"
 cyr_academies_01.8.t:0 "罗盘草贸易"
 cyr_academies_01.9.a:0 "对我们的国库来说是一种祝福……"
 cyr_academies_01.9.a.tt:0 "#Y 几个新的决议已经出现。#!"
 cyr_academies_01.9.desc:0 "#Y 罗盘草#!的出口正为我国带来巨大财富。\n\n然而近来罗盘草的年产量持续下滑。某种程度上这堪称天赐良机——需求增长与供给减少的双重作用，进一步推高了罗盘草的市场价值。但有人担忧当前的开采速度是否可持续……"
 cyr_academies_01.9.t:0 "罗盘草越来越稀少"

 cyr_control_exports:0 "#R 罗盘草#!·限制罗盘草出口"
 cyr_control_exports_desc:0 "罗盘草衰退的最大原因是我们自己不受控制地出口这种植物。执行严格的出口限制不会受到欢迎，但如果我们想给罗盘草以种群恢复的时间，这是必须的。"
 cyr_control_grazing:0 "#R 罗盘草#!控制牲畜放牧"
 cyr_control_grazing_desc:0 "罗盘草收成下降的部分原因是在昔兰尼加放牧的牲畜，特别是牛的数量越来越多。成群结队的牲畜在繁殖之前就吃掉了许多罗盘草植物。\n\n如果我们想保证罗盘草的供应，我们就需要控制允许在昔兰尼加放牧的牛的数量。"

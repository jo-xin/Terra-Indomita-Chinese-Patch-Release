 cyr_macedonian_settlers:0 "马其顿定居者"
 cyr_magas_01.1.a:0 "派遣特使。"
 cyr_magas_01.1.desc:0 "昔兰尼加，希腊的殖民地，曾是托勒密埃及的一部分，但自从托勒密任命的前任总督在建城历444年（公元前309年）入侵迦太基失败时被他的叙拉古盟友杀死后，昔兰尼加就一直处于混乱状态。由于新任总督尚未被任命，当地的希腊精英们目前仍掌控着该国政权。\n\n眼下埃及统治者的目光牢牢锁定在东方的对手身上，但托勒密王朝任命新总督只是时间问题。届时他们很可能要求我们与埃及建立更紧密的联系。\n\n或许我们应主动向埃及提出新总督人选，在他们作出决定前证明自身的忠诚。此举或许还能让我们比其他埃及属地保持更大的自治空间……"
 cyr_magas_01.1.t:0 "昔兰尼加的新总督"
 cyr_magas_01.10.a:0 "向希腊世界的每一个大国派出使者!"
 cyr_magas_01.10.desc:0 "长期以来，[GetCountry('EGY').GetAdjective]霸权一直是昔兰尼加肩上的沉重负担。现在，[GetCountry('CYR').GetRuler.GetName]和[GetCountry('EGY').GetRuler.GetFamily.GetName]埃及统治者之间的王朝关系已经被打破，要求独立的呼声日渐高涨。\n\n然而，单靠它自己，昔兰尼加几乎没有胜利的机会。我们应该努力说服埃及的众多对手中的一个支持我们的独立申请。"
 cyr_magas_01.10.t:0 "寻找盟友"
 cyr_magas_01.11.a:0 "昔兰尼加王国万岁!"
 cyr_magas_01.11.desc:0 "今天，[GetCountry('CYR').GetRuler.GetName]在昔兰尼加的大庙里举行了盛大的加冕仪式，成为昔兰尼加的国王。在欢呼雀跃的人群的注视下，大祭司将一条金色的头带戴在他的头上，来自昔兰尼加每个城市的政要都被领到他面前，送上礼物并宣誓效忠。\n\n已经开始铸造新的硬币，上面印有[GetCountry('CYR').GetRuler.GetName]的头衔，即昔兰尼加和潘塔波利斯所有城市的国王。波斯和埃及统治的枷锁已被遗忘。自公元313年（公元前440年）阿西拉乌斯四世去世以来，第一次有一个真正的国王坐在昔兰尼加的王座上。"
 cyr_magas_01.11.t:0 "昔兰尼国王"
 cyr_magas_01.12.a:0 "它属于图书馆!"
 cyr_magas_01.12.desc:0 "受佛教传教士教义影响，昔兰尼学派著名哲学家[death_persuader.GetName]发展出了该学派中一个尤为激进的哲学分支。与其他昔兰尼学派哲学家一样，他认为获得幸福是人生的唯一目的，任何无助于增进幸福的事物都毫无意义。但[death_persuader.GetName]更进一步，主张真正的幸福在生命中根本无法实现，因此生命本身毫无意义——甚至提出\"智者对待生死应一视同仁\"的极端观点。\n\n [death_persuader.GetName] 将其学说汇编成《饿殍录》一书。据传已有数百人阅读此书后选择结束生命，而非继续承受生存之苦。这使[death_persuader.GetName]获得了\"劝死者\"（Peisithanatos）的恶名。\n\n尽管其中某些说法确有夸大之嫌，但不可否认《饿殍录》仍是当代最伟大的哲学著作之一。"
 cyr_magas_01.12.t:0 "死亡劝导者"
 cyr_magas_01.13.a:0 "我们将寻求与利比亚人的和解"
 cyr_magas_01.13.b:0 "利比亚的威胁将被粉碎"
 cyr_magas_01.13.desc:0 "早在第一批希腊定居者到来之前，利比亚人就已经居住在[GetProvince('(int32)3365').GetArea.GetName]。传统上，利比亚人过着游牧的生活，放养山羊、绵羊和其他动物。自从古希腊人到来后，许多靠近希腊城市的北部利比亚人已经定居下来，其生活方式与他们的新邻居基本相同。然而，南部的利比亚人保留了他们传统的游牧生活方式，沿着商队路线从绿洲到绿洲。\n\n当第一批希腊定居者到达[GetProvince('(int32)3365').GetArea.GetName]时，与当地的利比亚人的关系最初是非常密切的。希腊人最初在[GetProvince('(int32)3365').GetName]定居后，是一群当地的利比亚人建议在[GetProvince('(int32)3360').GetName]的当前位置建立城市，作为一个更好的地方。希腊人则选择了传说中的希腊女猎手$omen_cyre$作为他们城市的守护神（与$omen_apollo$一起，$omen_apollo$的神谕将他们带到了昔兰尼加）。利比亚人和希腊人之间的通婚很普遍，许多利比亚的宗教和文化习俗被纳入了昔兰尼加文化--首先是对利比亚的公羊头神$omen_ammon$的崇拜。这种文化的融合在昔兰尼加的第二大城市[GetProvince('(int32)3357').GetName]最为明显，许多人认为它既是希腊的，也是利比亚的。\n\n然而，自从希腊人定居的早期，利比亚和希腊的关系就大大恶化了。来自南方的利比亚游牧部落是对古希腊城市的持续威胁，他们经常援助农村，偶尔也会联合起来攻击城市本身。与北方利比亚人的关系，现在在他们自己的土地上是少数，仍然相对较好，但在[GetProvince('(int32)3357').GetName]以外的地方，通婚已经变得很少，利比亚人经常发现自己被推到社会的边缘。\n\n尽管如此，利比亚人仍是[GetProvince('(int32)3365').GetArea.GetName]的一股强大力量。根据我们的行动，他们可能会成为[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]新政府的强大盟友或强大敌人。"
 cyr_magas_01.13.t:0 "利比亚人"
 cyr_magas_01.14.a:0 "专注于守卫边境"
 cyr_magas_01.14.b:0 "攻击任何我们能找到的利比亚人"
 cyr_magas_01.14.desc:0 "为了打击利比亚人对我国农村的袭击威胁，我们已经加强了对沙漠边缘的巡逻。一些特别大胆的指挥官甚至对他们认为可疑的利比亚游牧民群体发动了先发制人的攻击。这有助于大幅减少对我国领土的袭击，但也在边境一带的利比亚人中引起了很大的敌意。"
 cyr_magas_01.14.t:0 "先发制人的打击"
 cyr_magas_01.15.a:0 "必须在他们到达海岸上的弱小城市之前阻止他们!"
 cyr_magas_01.15.b:0 "利比亚人再次崛起的时刻已经到来！"
 cyr_magas_01.15.desc:0 "似乎与利比亚当地人的持续冲突已经升级为公开战争。\n\n在一系列不断升级的袭击和边境小规模冲突之后，利比亚沙漠的南部部落已经聚集在纳萨蒙斯部落的魅力领袖周围。现在，他们的联合队伍正向昔兰尼加的城市进发，急于带走任何他们能够携带的战利品并将其带回他们的沙漠绿洲。"
 cyr_magas_01.15.t:0 "利比亚战争"
 cyr_magas_01.16.a:0 "放下其他一切，现在是我们行动的时候了。"
 cyr_magas_01.16.a.tt:0 "在 托勒密之死 之前的所有未完成的任务将被绕过。"
 cyr_magas_01.16.b:0 "利比亚问题将不得不在以后的时间里处理。"
 cyr_magas_01.16.b.tt:0 "任务树的利比亚分支中所有未完成的任务将被绕过。"
 cyr_magas_01.16.c:0 "我们有能力等待时机。"
 cyr_magas_01.16.c.tt:0 "没有任务会被绕过。"
 cyr_magas_01.16.desc:0 "在最近[GetCharacter('(int32)42').GetName]的死亡之后，[GetCountry('EGY').GetName]的政治局势越来越不稳定。这将是推进我们自己野心的绝佳机会，然而，我们似乎还有一些自己的国内问题需要处理......"
 cyr_magas_01.16.t:0 "托勒密之死"
 cyr_magas_01.17.a:0 "我们应该多花点时间与[cyr_focus_martial_char_scope.GetName]相处。"
 cyr_magas_01.17.b:0 "其实我有一些具体的事情想谈......"
 cyr_magas_01.17.c:0 "这是在浪费时间。"
 cyr_magas_01.17.desc:0 "[cyr_focus_martial_char_scope.GetOffice] [cyr_focus_martial_char_scope.GetName]是一个非常有才华的战略家。  最近他似乎很想和[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]多呆一会儿。虽然这一切可能只是为了增加他自己在宫廷中的影响力而做的薄薄的尝试，但这可能有助于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]加深对战争艺术的理解......"
 cyr_magas_01.17.t:0 "战争的艺术"
 cyr_magas_01.18.a:0 "每周的征兵演习将由[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]亲自领导"
 cyr_magas_01.18.b:0 "扩大训练场，目前的演习区域是不够的"
 cyr_magas_01.18.c:0 "这些时间最好花在审查账目上"
 cyr_magas_01.18.desc:0 "任何希腊城市的军队的骨干都是它的公民征兵，[GetProvince('(int32)3360').GetName]也不例外。作为总督，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的职责之一是确保征兵工作井然有序，并在需要时做好战斗准备。"
 cyr_magas_01.18.t:0 "在昔兰尼操练的公民征兆兵"
 cyr_magas_01.19.a:0 "除了最危险的流亡者，大规模赦免所有流亡者，我们在这里需要他们。"
 cyr_magas_01.19.b:0 "现在不是通过不尊重公民的法律来激怒他们的时候。"
 cyr_magas_01.19.c:0 "实际上，有一个人最好远离昔兰尼加……"
 cyr_magas_01.19.desc:0 "分散在地中海各地的赛里亚人流亡者数量并不少。他们中的大多数人都是在对当地城市政治产生分歧后被迫逃离家乡的人。然而，由于许多流亡者在昔兰尼加仍有亲属，在[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的法庭上，乞求[GetProvince('(int32)3360').GetName]赦免的请愿者是常见的。\n\n总的来说，流亡者对[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的权威没有威胁，但通过赦免流亡的罪犯来颠覆昔兰尼加城市的法庭，不会受到公民的欢迎。另一方面，昔兰尼加周围有许多强大的对手，驱逐自己的公民是一种奢侈，它负担不起。"
 cyr_magas_01.19.t:0 "赦免流亡者"
 cyr_magas_01.2.a:0 "昔兰尼加有了一个新的总督"
 cyr_magas_01.2.desc:0 "终于找到了一个适合担任昔兰尼加总督的候选人。[GetCharacter('(int32)46').GetFullName]，是[GetCharacter('(int32)42').GetFullName]本人的继子。  \n\n马加斯的父亲菲利普是亚历山大军队中一名出色的指挥官，从第一次进军波斯的安纳托利亚到入侵遥远的印度河流域的土地，他都在这位伟大的征服者的军队中服役。\n\n然而更重要的是，他的母亲[GetCharacter('(int32)18').GetFullName]最近嫁给了埃及国王[GetCharacter('(int32)42').GetFullName]，她的儿子[GetCharacter('(int32)45').GetFullName]--马加斯的同父异母兄弟--虽然还很年轻，但已经被认为是埃及王位的可能继承人。贝雷尼克本人是前马其顿摄政王[GetCharacter('(int32)9').GetFullName]的孙女，也是亚历山大大帝的远房亲戚，这使她在与托勒密奥斯结婚之前就已经是地位极高的女性。  \n\n在父亲的军事才能和母亲的遗产和政治关系之间，马加斯将使昔兰尼加在争夺亚历山大遗产的战争中发挥重要作用。"
 cyr_magas_01.2.t:0 "昔兰尼的马加斯"
 cyr_magas_01.20.a:0 "把他们整合成一队战士。"
 cyr_magas_01.20.b:0 "让他们随时准备好，以防我们需要增援军队。"
 cyr_magas_01.20.desc:0 "我们在利比亚人中招募战士的努力正在显示出成功。一小股利比亚士兵已经聚集在[cyr_libyan_mercs_spawn_province.GetName]周围，准备为我们的事业贡献他们的长矛。"
 cyr_magas_01.20.t:0 "利比亚雇佣兵"
 cyr_magas_01.21.a:0 "我们将接近[cyr_marriage_country_scope_1.GetName]。"
 cyr_magas_01.21.b:0 "[cyr_marriage_country_scope_2.GetName]将成为一个好的盟友。"
 cyr_magas_01.21.c:0 "我们将与[cyr_marriage_country_scope_3.GetName]碰碰运气。"
 cyr_magas_01.21.d:0 "[cyr_marriage_country_scope_4.GetName]可能是最安全的选择。"
 cyr_magas_01.21.desc:0 "考虑到[GetCountry('EGY').GetAdjective]的力量相对于我们自己的力量，仅靠我们自己来确保昔兰尼加的独立将是非常困难的。幸运的是，我们的宗主国有很多敌人，他们可能愿意支持我们的事业。\n\n然而，为了确保我们的未来盟友在时机到来时不会抛弃我们，我们应该坚持以[GetCountry('CYR').GetRuler.GetName]和盟友宫廷中的公主之间的皇家婚姻来完成联盟。  \n\n几个主要的希腊人将成为这种联盟的有希望的候选人。"
 cyr_magas_01.21.e:0 "也许[cyr_marriage_country_scope_5.GetName]会帮助我们？"
 cyr_magas_01.21.f:0 "我们毕竟不需要任何盟友。"
 cyr_magas_01.21.t:0 "通过联姻结盟"
 cyr_magas_01.22.a:0 "这是一个削弱[GetCountry('EGY').GetName]的绝佳机会。"
 cyr_magas_01.22.b:0 "我们现在不能与[GetCountry('EGY').GetName]对立。"
 cyr_magas_01.22.desc:0 "来自[GetCountry('CYR').GetRuler.GetName]宫廷的[GetCountry('CYR').GetName]的使者与我们接触。他们建议我们结成联盟，对抗我们在[GetCountry('EGY').GetName]的共同对手。[GetCountry('CYR').GetName]是[GetCountry('EGY').GetAdjective]的重要附属国，他们的独立将是对[GetCountry('EGY').GetName]的重大打击。\n\n然而，为了确保我们对[GetCountry('CYR').GetAdjective]事业的承诺，[GetCountry('CYR').GetRuler.GetName]正在请求与[cyr_marriage_princess_scope.GetFullName]联姻。"
 cyr_magas_01.22.t:0 "一场皇家婚姻"
 cyr_magas_01.23.a:0 "安排一场盛大的婚礼吧!"
 cyr_magas_01.23.a.tt:0 "[cyr_royal_marriage_country.GetName]将在时机成熟时加入[GetCountry('CYR').GetName]的独立战争。"
 cyr_magas_01.23.desc:0 "由于我们的使节的不懈努力，我们已经能够安排我们的统治者[GetCountry('CYR').GetRuler.GetName]和[cyr_royal_marriage_country.GetRuler.GetFamily.GetName]家族的一位年轻贵族女子结婚。希望这能保证[cyr_royal_marriage_country.GetAdjective]在埃及人挑战我们的独立愿望时得到援助。"
 cyr_magas_01.23.t:0 "与[cyr_royal_marriage_country.GetName]的皇家联姻"
 cyr_magas_01.24.a:0 "我们将与[cyr_marriage_country_scope_1.GetName]接触"
 cyr_magas_01.24.b:0 "[cyr_marriage_country_scope_2.GetName]将成为一个好的盟友。"
 cyr_magas_01.24.c:0 "我们将在[cyr_marriage_country_scope_3.GetName]上试试运气"
 cyr_magas_01.24.d:0 "[cyr_marriage_country_scope_4.GetName]可能是最安全的选择。"
 cyr_magas_01.24.desc:0 "不幸的是，[cyr_royal_marriage_country.GetName]已经拒绝了我们的结盟提议。我们应该考虑其他候选人中的一个..."
 cyr_magas_01.24.e:0 "也许[cyr_marriage_country_scope_5.GetName]会帮助我们？"
 cyr_magas_01.24.f:0 "我们毕竟不需要任何盟友。"
 cyr_magas_01.24.t:0 "皇家婚姻--提议被拒绝"
 cyr_magas_01.25.a:0 "我们需要[GetCharacter('(int32)18').GetFirstName]的财政支持来控制[GetCountry('CYR').GetName]。"
 cyr_magas_01.25.b:0 "也许[GetCharacter('(int32)18').GetFirstName]可以写信给[GetCharacter('(int32)46').GetFirstName]父亲的一些亲戚"
 cyr_magas_01.25.b.tt:0 "数个具有#G 提升的忠诚度#!的#Y 马吉德人物#!将加入你的宫廷。"
 cyr_magas_01.25.c:0 "我们将为支持这个家庭尽一份力"
 cyr_magas_01.25.desc:0 "自从[GetCharacter('(int32)18').GetName]与[GetCharacter('(int32)42').GetName]结婚以来，她就把确保自己的孩子被安排到权力岗位上作为自己的使命。因此，主要是由于她的支持，[GetCharacter('(int32)46').GetName]被任命为[GetCountry('CYR').GetName]的总督。  \n\n[GetCharacter('(int32)18').GetFirstName]的支持直到现在仍然是无价的。我们可以请求她帮助我们确保对昔兰尼加的控制，但现在也是为马吉德家族的福祉做出我们自己贡献的好时机。"
 cyr_magas_01.25.t:0 "支持贝雷尼克的人"
 cyr_magas_01.26.a:0 "[GetCountry('CYR').GetRuler.GetName]万岁"
 cyr_magas_01.26.desc:0 "[GetCountry('CYR').GetRuler.GetName]对[GetCountry('CYR').GetName]内部事务的关注，坚定了他作为该地区统治者的地位。虽然官方称[GetCountry('CYR').GetRuler.GetName]仍然效忠于[GetCountry('EGY').GetName]，但对许多当地人来说，他就像[GetCountry('CYR').GetName]在遥远的[GetCountry('EGY').GetRuler.GetName]一样是[GetCountry('EGY').GetCapital.GetName]的国王。\n\n这一天可能还会到来，[GetCountry('CYR').GetName]将从[GetCountry('EGY').GetAdjective]的影响中挣脱出来。"
 cyr_magas_01.26.t:0 "昔兰尼加的真正统治者"
 cyr_magas_01.3.a:0 "埃及统治的代价相当高昂……"
 cyr_magas_01.3.desc:0 "#R 已弃用。若您看到此提示，说明出现严重错误#!随着我们指派的统治者上位，昔兰尼加将享有比埃及其他附属地区更高的自治权。但此种制度本身极为脆弱——一旦埃及与昔兰尼加的同盟关系破裂，埃及极可能立即宣战。"
 cyr_magas_01.3.t:0 "与埃及的关系"
 cyr_magas_01.4.a:0 "埃及向昔兰尼加宣战"
 cyr_magas_01.4.desc:0 "#R 已弃用。若你看到此提示，说明出现严重错误。#!无论是由于我方行动还是对方所为，埃及与昔兰尼加的纽带已然断裂。昔兰尼加将自主行事，但其原宗主国埃及绝不会坐视不理。"
 cyr_magas_01.4.t:0 "断绝与埃及的联系"
 cyr_magas_01.5.a:0 "我们别无选择……"
 cyr_magas_01.5.b:0 "不再是了，现在是我们为真正的独立而战的时候了。"
 cyr_magas_01.5.desc:0 "#R 已弃用。如果你看到这条信息，说明系统出现了严重错误 #!现在是我们向宗主埃及缴纳定期贡品的时候了。埃及人要求我们进贡粮食、黄金，以及士兵以充实他们的军队。"
 cyr_magas_01.5.t:0 "埃及要求进贡"
 cyr_magas_01.6.a:0 "等一下，我们毕竟不需要他们的帮助。"
 cyr_magas_01.6.b:0 "试着让他们相信我们的困境"
 cyr_magas_01.6.c:0 "没有什么比黄子更有说服力的了"
 cyr_magas_01.6.desc:0 "我们的使者已经抵达[magas_diplomacy_scope.GetAdjective]宫廷。他们现在将试图说服[magas_diplomacy_scope.GetRuler.GetName]，[GetCountry('EGY').GetName]的每一次损失都是[magas_diplomacy_scope.GetName]的收获。当然，在适当的地方送上一些慷慨的礼物，很可能有助于使这个过程更加直接……"
 cyr_magas_01.6.t:0 "接近中 [magas_diplomacy_scope.GetName]"
 cyr_magas_01.7.a:0 "安排一场盛大的婚礼吧!"
 cyr_magas_01.7.desc:0 "由于我们的使节的不懈努力，我们已经能够安排我们的统治者[GetCountry('CYR').GetRuler.GetName]和[cyr_royal_marriage_country.GetRuler.GetFamily.GetName]家族的一位年轻贵族妇女结婚。希望这能保证[cyr_royal_marriage_country.GetAdjective]在埃及人挑战我们的独立愿望时得到援助。"
 cyr_magas_01.7.t:0 "与[cyr_royal_marriage_country.GetName]的皇家联姻"
 cyr_magas_01.8.a:0 "这些外国人将帮助我们加深对草药学的理解。"
 cyr_magas_01.8.b:0 "他们的哲学，尽管很奇怪，但会充实我们的本地学院。"
 cyr_magas_01.8.b.tt:0 "5%的昔兰尼人将皈依佛教。"
 cyr_magas_01.8.b.ttt:0 "一位非常有才华的哲学大师将加入我们的宫廷。"
 cyr_magas_01.8.c:0 "外国人是对的，我们必须采用他们的生活方式!"
 cyr_magas_01.8.c.tt:0 "10%的昔兰尼人将皈依佛教。"
 cyr_magas_01.8.desc:0 "[GetCharacter('(int32)46').GetFullName]的父亲是亚历山大入侵印度时的指挥官之一。从他和他的许多同伴那里，马加斯继承了对远东土地的浓厚兴趣。现在，来自印度最伟大的统治者[GetCountry('MRY').GetRuler.GetName]的使者来到了我们的宫廷。除了礼物和贸易提议外，他们还带来了外国医药知识和一个陌生的新信仰的消息。"
 cyr_magas_01.8.t:0 "马加斯的印度关系"
 cyr_magas_01.9.a:0 "昔兰尼加的命运岌岌可危……"
 cyr_magas_01.9.desc:0 "我们已经通知[GetCountry('EGY').GetRuler.GetName]，昔兰尼加的城市将停止向埃及人支付的定期贡品。不用说，他对这个消息不以为然。我们的使者已经被处决，而且有传言说，就在我们说话的时候，一支军队正在组建，以 \"对付昔兰尼加的叛乱\"。"
 cyr_magas_01.9.t:0 "对埃及的独立战争"
 cyr_magas_01_15_tooltip_1:0 "我们将对抗野蛮人的威胁。"
 cyr_magas_01_15_tooltip_2:0 "我们将放弃昔兰尼加，变成利比亚。"
 cyr_magid_family_recruit:0 "马吉德的表弟"
 cyr_magid_kingdom:0 "希腊王国"
 cyr_magid_sympathiser:0 "马吉德的同情者"
 cyr_magnificent_palace:0 "宏伟的宫殿"
 cyr_marmarica_growing:0 "马耳马里卡的发展"
 cyr_marriage_offer_rejected:0 "拒绝皇室联姻"
 cyr_medical_school:0 "医学院"
 cyr_moderate_palace:0 "令人印象深刻的宫殿"
 cyr_new_barke:0 "新巴尔克"
 cyr_new_export_markets:0 "罗盘草出口市场"
 cyr_new_pharaoh_lower_egypt:0 "一个新的法老"
 cyr_on_the_measure_of_the_world:0 "《丈量大地》"
 cyr_on_the_measure_of_the_world_desc:0 "昔兰尼的埃拉托色尼的巨著。它描述了他如何利用不同地点的影子的长度来准确计算世界的周长。"
 cyr_ophellas_01.1.a:0 "向他们保证，他们有我们的支持。"
 cyr_ophellas_01.1.b:0 "最好不要卷入外国战争。"
 cyr_ophellas_01.1.desc:0 "来自[cyr_adventuring_root_scope.GetName]的使者最近来到了我们的宫廷。他们正计划对[GetCountry('CAR').GetName]发动战争，并请求我们允许从我们的公民中组建军队。"
 cyr_ophellas_01.1.t:0 "冒险的呼唤"
 cyr_ophellas_01.1.tt:0 "#R 这可能导致我们成为[cyr_adventuring_root_scope.GetName]的臣民#!。"
 cyr_ophellas_01.10.a:0 "他们将不得不从我们冰冷的死手中撬出它。"
 cyr_ophellas_01.10.a.tt:0 "[cyr_syracuse_invasion_root_scope.GetName]将被告知，我们无意交出城市。"
 cyr_ophellas_01.10.b:0 "我们没有什么选择，交出城市。"
 cyr_ophellas_01.10.b.tt:0 "#R 我们将放弃[GetProvince('(int32)84').GetName]的领土#!。"
 cyr_ophellas_01.10.desc:0 "看来[cyr_syracuse_invasion_root_scope.GetName]国对我们的[GetProvince('(int32)84').GetName]城有一些宿怨。他们要求我们撤回驻军，将城市交给他们摆布。在正常情况下，这当然是不可能的，但如果[cyr_syracuse_invasion_root_scope.GetName]的威胁性足够大，我们可能别无选择......"
 cyr_ophellas_01.10.t:0 "外国人的威胁叙拉古"
 cyr_ophellas_01.11.a:0 "现在，[GetProvince('(int32)84').GetName]很容易被采摘!"
 cyr_ophellas_01.11.a.tt:0 "#Y [GetProvince('(int32)84').GetName]已经独立。#!"
 cyr_ophellas_01.11.desc:0 "[cyr_syracuse_foreign_owner.GetName]的领导人已经向我们的要求投降了。[cyr_syracuse_foreign_owner.GetAdjective]的驻军已经从[GetProvince('(int32)84').GetName]撤出，除了少数勇敢的当地人匆忙地联合起来保卫家园外，该城现在毫无防备。"
 cyr_ophellas_01.11.t:0 "叙拉古的外国统治者——接受的要求"
 cyr_ophellas_01.12.a:0 "至少没有人可以说我们没有警告他们。"
 cyr_ophellas_01.12.a.tt:0 "#Y [GetProvince('(int32)84').GetName]仍然是[cyr_syracuse_foreign_owner.GetName]的一部分。#!"
 cyr_ophellas_01.12.desc:0 "不出所料，[cyr_syracuse_foreign_owner.GetName]的领导人拒绝了我们和平移交城市的要求。我们将不得不用武力夺取它。"
 cyr_ophellas_01.12.t:0 "叙拉古的外国统治者——要求被拒绝"
 cyr_ophellas_01.13.a:0 "尽早出击吧!"
 cyr_ophellas_01.13.desc:0 "我们入侵[GetProvince('(int32)84').GetName]的准备工作终于完成了。很快，叙拉古人就会为他们用矛头对付朋友的那一天而后悔。"
 cyr_ophellas_01.13.t:0 "准备工作完成"
 cyr_ophellas_01.14.a:0 "这是不应该发生的..."
 cyr_ophellas_01.14.desc:0 "似乎发生了一些意想不到的事情，在叙拉古没有人可以让我们惩罚了。"
 cyr_ophellas_01.14.t:0 "叙拉古失踪了？"
 cyr_ophellas_01.15.a:0 "毫不留情!摧毁城市，在田地里撒盐，杀死任何反抗的人!"
 cyr_ophellas_01.15.a.tt:0 "[GetProvince('(int32)84').GetName]中的每个人口都有#Y 45%#!的机会被#R 杀死#!，#Y 40%#!的机会被#R 奴役和流离失所#!到昔兰尼加的一个随机省份，还有#Y 15%#!的机会#G 幸免于难#!。"
 cyr_ophellas_01.15.b:0 "摧毁城市，将其居民流放到昔兰尼加。"
 cyr_ophellas_01.15.b.tt:0 "[GetProvince('(int32)84').GetName]中的每个人都有#Y 15%#! 的机会被#R 杀死#!，#Y 65%#! 的机会被#R 流放#! 到[syracuse_destruction_target_scope.GetName]，以及#Y 20%#! 的机会#G 存活#!。"
 cyr_ophellas_01.15.c:0 "摧毁城市，在西西里岛建立一个新的权力中心"
 cyr_ophellas_01.15.c.tt:0 "[GetProvince('(int32)84').GetName]中的每个人都有#Y 15%#! 的机会被#R 杀死#!，#Y 65%#! 的机会被#R 流放#! 到[syracuse_destruction_target_scope.GetName]，以及#Y 20%#! 的机会#G 生存#!。"
 cyr_ophellas_01.15.d:0 "不要管这个城市，只惩罚它的领导人。"
 cyr_ophellas_01.15.desc:0 "[GetProvince('(int32)84').GetName]，这个背信弃义的[GetCharacter('(int32)56').GetName]的城市，长期以来一直是希腊世界最强大的城市之一，当后者处于其力量的顶峰时，其规模甚至可以与雅典相媲美。现在，它终于被我们摆布了，我们将不得不决定它的命运。\n\n鉴于叙拉古人对奥佩拉斯犯下的严重罪行，许多人都在叫嚣着要彻底摧毁这座城市。然而，这就留下了如何处理其公民的问题。最直接的解决办法当然是简单地奴役那些可以被奴役的人，并杀死任何反抗的人。\n\n然而，把叙拉古的人口留在一个地方，并利用他们在其他地方建立一个新的城市，可能是更谨慎的做法。希望强制流放造成的混乱足以确保新城市不会像叙拉古那样构成威胁。\n\n最后，我们当然可以不动这个城市——毕竟可以提出一个论点，即叙拉古的人民本身只是[GetCharacter('(int32)56').GetName]暴政的受害者。"
 cyr_ophellas_01.15.t:0 "叙拉古的命运"
 cyr_ophellas_01.16.a:0 "西西里联盟由此诞生。"
 cyr_ophellas_01.16.a.tt:0 "#Y 西西里联盟#!将作为[SCOPE.GetRootScope.GetCountry.GetName]的一个藩属而独立。"
 cyr_ophellas_01.16.desc:0 "当我们的军队第一次踏上西西里岛的土地时，是为了惩罚叙拉古对我们前任统治者奥佩拉斯的背叛。然而，现在叙拉古被适当地羞辱了，我们发现自己在我们势力范围的边缘拥有了相当大的一块土地。\n\n由于我们的目的从来不是为了征服西西里，我们决定在一个新的政府下给予我们的新属地自治权。这个新国家将采取联盟的形式，首都设在[cyr_sicilian_league_capital.GetName]，并将被要求定期缴纳贡品，在战争中援助我们。"
 cyr_ophellas_01.16.t:0 "西西里联盟的形成"
 cyr_ophellas_01.17.a:0 "好极了!"
 cyr_ophellas_01.17.desc:0 "俄斐拉斯自乐土欢呼！曾经的西方希腊霸主，[GetProvince('(int32)84').GetName]已经陨落了。这座城市的特产是背信弃义的僭主，我们伟大的先主正是不幸死于其手。同样，我们的非洲邻居布匿人也被我们的大军狠狠地挫败了，甚至连[GetProvince('(int32)3256').GetName]这座伟大的城市本身也同样在我们的控制之下。\n\n昔兰尼加从冲突中脱颖而出，成为西方希腊人和尼罗河以西非洲无可置疑的霸主。"
 cyr_ophellas_01.17.t:0 "俄斐拉斯自乐土欢呼"
 cyr_ophellas_01.2.a:0 "从[cyr_adventurer_city_candidate_1.GetName]招募冒险者"
 cyr_ophellas_01.2.b:0 "从[cyr_adventurer_city_candidate_2.GetName]招募冒险者"
 cyr_ophellas_01.2.c:0 "从[cyr_adventurer_city_candidate_3.GetName]招募冒险者"
 cyr_ophellas_01.2.d:0 "就雇佣一帮雇佣兵来代替吧。"
 cyr_ophellas_01.2.desc:0 "我们派出的使者已经回来了，有几个城市愿意支持我们对迦太基的战争。现在，我们必须决定将我们的招募工作集中在哪个城市。\n\n我们选择的城市将成为我们的临时附属国，在我们的战争中与我们并肩作战，直到我们在非洲征服了足够的土地供冒险者定居。"
 cyr_ophellas_01.2.t:0 "希腊冒险家——筹建军队"
 cyr_ophellas_01.3.a:0 "把消息传到希腊世界的每个角落!"
 cyr_ophellas_01.3.desc:0 "当俄斐拉斯首次入侵迦太基时，他从雅典籍妻子[GetCharacter('(int32)148').GetName]的故乡征募了一支军队。尽管[GetCharacter('(int32)148').GetFirstName]与其子[GetCharacter('(int32)549').GetFirstName]已离开昔兰尼加，改嫁[GetCharacter('(int32)38').GetFullName]，但希腊各城邦仍充斥着冒险者——只要我们承诺其在新征服地的定居权，就能说服他们为我们而战。\n\n与俄斐拉斯不同，我们未能有幸迎娶雅典权贵之女，因此只能向希腊世界的小邦派遣使者，试探是否有城邦愿意为本邦大业输送其公民为兵。"
 cyr_ophellas_01.3.t:0 "希腊冒险家"
 cyr_ophellas_01.4.a:0 "在[cyr_adventurer_colony_1.GetName]发现了一个殖民地"
 cyr_ophellas_01.4.b:0 "在[cyr_adventurer_colony_2.GetName]发现了一个殖民地"
 cyr_ophellas_01.4.c:0 "他们已经完成了他们的目的，把他们送走吧。"
 cyr_ophellas_01.4.desc:0 "继我们最近在非洲的征服之后，我们雇佣的冒险家的领导人找到了我们。他们提醒我们，我们承诺过他们有权在被征服的领土上定居，并坚持认为现在是兑现我们承诺的时候了。\n\n冒险家们已经在[cyr_adventurer_colony_1.GetName]附近指定了他们想要建立城市的地方，但我们行政部门的一些人坚持认为[cyr_adventurer_colony_2.GetName]会是一个更合适的地点。"
 cyr_ophellas_01.4.t:0 "希腊冒险家想要定居"
 cyr_ophellas_01.5.a:0 "在[kinyps_scope.GetName]的旧址上建立一座城市。"
 cyr_ophellas_01.5.b:0 "在[leptis_scope.GetName]的布匿人定居点附近，再往西一点找到一个城市"
 cyr_ophellas_01.5.c:0 "这听起来是个坏主意。"
 cyr_ophellas_01.5.desc:0 "斯巴达并不像其他希腊城市那样因其殖民地而闻名。然而这并没有阻止斯巴达王子多里厄斯，即后来的斯巴达国王列奥尼达的哥哥，试图在的黎波里塔尼亚的辛普斯河附近建立一个殖民地。尽管斯巴达人仅在几年后就被腓尼基人和当地部落成员的联盟赶走了，但对多里厄斯的殖民地的记忆仍然存在。现在，该地区已被我们牢牢控制，我们也许能说服新的定居者群体重新建立殖民地。"
 cyr_ophellas_01.5.t:0 "斯巴达在非洲丢失的殖民地"
 cyr_ophellas_01.5.tt:0 "#Y 有一个@military_icon!特别高的人物会加入你的事业!#!"
 cyr_ophellas_01.6.a:0 "告诉他们立即开始建造!"
 cyr_ophellas_01.6.b:0 "他们收取多少钱？"
 cyr_ophellas_01.6.desc:0 "尽管土壤肥沃，但昔兰尼加生产的适合建造战舰的木材非常少。幸运的是，[cyr_ship_builders.GetName]的船匠们愿意为我们建造一支小型的先进重型战舰舰队。当然，只要价格合适。\n\n一旦我们下了订单并收到付款，大约需要一年的时间，直到船只完工并准备好移交。"
 cyr_ophellas_01.6.t:0 "购买重型战舰"
 cyr_ophellas_01.7.a:0 "终于来了!"
 cyr_ophellas_01.7.desc:0 "我们向[cyr_ship_builders.GetName]订购的战舰终于完工了，并已交付给我们在昔兰尼的港口。\n\n它可能并不便宜，但现在我们的舰队可以和世界上伟大的海上力量相抗衡。"
 cyr_ophellas_01.7.t:0 "购买重型战舰--建造完成"
 cyr_ophellas_01.8.a:0 "一个了不起的女人!"
 cyr_ophellas_01.8.desc:0 "我们接待了[GetCharacter('(int32)148').GetFullName]的使团。[GetCharacter('(int32)148').GetFirstName]现任[GetCountry('PRY').GetName]统治者[GetCharacter('(int32)38').GetName]的妻子。但更重要的是，她是俄斐拉斯的遗孀——我们此次远征叙拉古正是要为俄斐拉斯遭背叛杀害复仇。\n\n[GetCharacter('(int32)148').GetFirstName]出身雅典最具影响力的家族之一（其先祖米太亚德曾谋划赢得马拉松战役的战略），正是凭借这层雅典关系，俄斐拉斯当年才能招募希腊冒险者军队入侵迦太基。俄斐拉斯早逝后，[GetCharacter('(int32)148').GetFirstName]逃回雅典，嫁给了[GetCharacter('(int32)37').GetName]的继承人[GetCharacter('(int32)38').GetName]。\n\n[GetCharacter('(int32)148').GetFirstName]对杀害首任丈夫的凶手同样深恶痛绝，她承诺将倾其所有资助我们此次远征。"
 cyr_ophellas_01.8.t:0 "[GetCharacter('(int32)148').GetName]使团"
 cyr_ophellas_01.9.a:0 "问一问总没有坏处..."
 cyr_ophellas_01.9.a.tt:0 "将向[cyr_syracuse_foreign_owner.GetName]发出最后通牒。"
 cyr_ophellas_01.9.b:0 "胡说八道，我们进行的是枪尖上的外交!"
 cyr_ophellas_01.9.b.tt:0 "不会发出最后通牒。"
 cyr_ophellas_01.9.desc:0 "也许是神的报应，叙拉古城自[GetCharacter('(int32)56').GetFullName]的时代起就失去了独立性。[GetProvince('(int32)84').GetName]现在位于[cyr_syracuse_foreign_owner.GetName]的边界内。\n\n虽然这可能是对他们罪行的适当惩罚，但它确实给我们计划的惩罚性远征带来了问题。如果全面战争不符合我们的利益，也许值得问问[cyr_syracuse_foreign_owner.GetName]是否愿意先和平投降……"
 cyr_ophellas_01.9.t:0 "叙拉古的外国宗主"
 cyr_ophellas_no_adventurers:0 "雇佣雇佣兵"
 cyr_ophellas_shade_rests:0 "奥菲拉斯的阴谋得逞"
 cyr_pentapolis:0 "五城"
 cyr_pharaoh_of_lower_egypt:0 "下埃及的法老"
 cyr_philosophical_atlantis:0 "哲学的亚特兰蒂斯"
 cyr_port_at_apollonia:0 "阿波罗尼亚的港口"
 cyr_preparing_war_carthage:0 "准备对迦太基的战争"
 cyr_preparing_war_syracuse:0 "准备对叙拉古的战争"
 cyr_priests_of_apollo:0 "阿波罗祭司制度"
 cyr_punic_integration:0 "希腊-布匿王国"
 cyr_reform_01.1.a:0 "我们必须小心行事..."
 cyr_reform_01.1.desc:0 "在经历了几个世纪由遥远的国王强加给他们的统治者之后，希腊的昔兰尼加城市终于又有了一个自己的国王。  然而，[reform_mission_root_scope.GetRuler.GetFamily.GetName]们本身就是外国人，他们在马其顿人的帮助下登上了[reform_mission_root_scope.GetCapital.GetName]的王位。在许多昔兰尼加人眼中，这使他们与之前的一连串外国统治者没有什么区别。\n\n如果[reform_mission_root_scope.GetRuler.GetName]想保持他的权力，他将不得不在他的公民眼中使他的统治合法化；或者通过接受当地的习俗和借鉴前波斯王国的昔兰尼加的记忆，或者通过按照塞琉西和托勒密的方式将自己确立为希腊化的国王。否则，[reform_mission_root_scope.GetRuler.GetFamily.GetName]们可能很快就会发现自己被他们渴望统治的人民推翻了。\n\n#G 保皇派#! 和#R 共和派#! 势力正在竞争对[reform_mission_root_scope.GetName]的影响。在没有获得相应派别支持的情况下试图进行激进的政府改革--或者在对立派别的支持率很高的情况下--可能会导致内战的发生。"
 cyr_reform_01.1.t:0 "昔兰尼加的国家"
 cyr_reform_01.10.a:0 "在[GetProvince('(int32)3354').GetName]找到了一个新的城市。"
 cyr_reform_01.10.b:0 "这座新城市将被称为Magadeia。"
 cyr_reform_01.10.b.tt:0 "[GetProvince('(int32)3354').GetName]将被称为玛加迪亚"
 cyr_reform_01.10.c:0 "[GetProvince('(int32)3357').GetName]很好，因为它是。"
 cyr_reform_01.10.desc:0 "[GetProvince('(int32)3357').GetName]传统上是昔兰尼加的第二大城市。它是著名的希腊人和利比亚人并肩生活的地方，以至于它甚至在昔兰尼加的其他城市中脱颖而出，与他们的本土邻居一直保持着异常友好的关系。\然而，[GetProvince('(int32)3357').GetName]也位于内陆，离海岸线很远。自从亚历山大的征服使昔兰尼加与希腊世界更深入地融合后，这就成为一个问题。幸运的是，有一个靠近大海的城市的好地方......"
 cyr_reform_01.10.t:0 "巴尔克的新港湾"
 cyr_reform_01.11.a:0 "[GetProvince('(int32)3354').GetName]总是作为[GetProvince('(int32)3357').GetName]的一个港湾。"
 cyr_reform_01.11.b:0 "[GetProvince('(int32)3354').GetName]将取代[GetProvince('(int32)3357').GetName]成为昔兰尼加的第二个城市。"
 cyr_reform_01.11.b.tt:0 "[GetProvince('(int32)3357').GetName]的75%的人口将#Y 迁移#! 到[GetProvince('(int32)3354').GetName]。"
 cyr_reform_01.11.desc:0 "我们在[GetProvince('(int32)3354').GetName]的新城市的建设正在顺利进行。城市的行政中心已经完成，新港口已经准备好接收第一批船只。现在，我们必须决定[GetProvince('(int32)3354').GetName]建成后的作用是什么。"
 cyr_reform_01.11.t:0 "成长中的[GetProvince('(int32)3354').GetName]城市"
 cyr_reform_01.12.a:0 "取来马匹，我们将立即启程。"
 cyr_reform_01.12.desc:0 "[reform_mission_root_scope.GetRuler.GetName]可能是昔兰尼加无可争议的统治者，但许多人除了知道他的名字之外，对他所知甚少。为了确保他被他的臣民认可，[reform_mission_root_scope.GetRuler.GetFirstName]决定开始对昔兰尼加的乡村进行一次广泛的巡视。\在接下来的6个月里，[reform_mission_root_scope.GetRuler.GetFirstName]和他的保镖将访问尽可能多的城市，以裁决当地的争端，并给当地的统治阶层留下深刻印象。"
 cyr_reform_01.12.t:0 "游览各城市--开始"
 cyr_reform_01.13.a:0 "死者的财产属于[tour_location_scope_1_2.GetName]。"
 cyr_reform_01.13.b:0 "在[tour_location_scope_1_1.GetName]领土上的东西属于[tour_location_scope_1_1.GetName]。"
 cyr_reform_01.13.c:0 "显然，合法的继承人不是别人，正是[reform_mission_root_scope.GetRuler.GetName]本人。"
 cyr_reform_01.13.desc:0 "到达[tour_location_scope_1_1.GetName]后不久，附近[reform_mission_root_scope.GetRuler.GetName]定居点的代表找到了[tour_location_scope_1_2.GetName]。他们请求[reform_mission_root_scope.GetRuler.GetName]对[tour_location_scope_1_2.GetName]和[tour_location_scope_1_1.GetName]之间长期存在的争端作出判决。\n\n在[tour_location_scope_1_2.GetName]的一个富有的贵族无继承人死亡后，[tour_location_scope_1_1.GetName]占有了该人位于[tour_location_scope_1_1.GetName]领土内的一个庄园。然而，[tour_location_scope_1_2.GetName]坚持认为，由于此人是[tour_location_scope_1_2.GetName]的公民，他的所有财产都属于[tour_location_scope_1_2.GetName]。\n\n无论我们支持谁，都有可能激怒另一方。"
 cyr_reform_01.13.t:0 "城市之间的争端"
 cyr_reform_01.14.a:0 "当然，一笔慷慨的捐款足以说服他们"
 cyr_reform_01.14.b:0 "祭司们会服从他们国王的要求的！我们不要激怒神灵。"
 cyr_reform_01.14.c:0 "我们不要因为打破传统而激怒了神灵"
 cyr_reform_01.14.desc:0 "当王室队伍经过[tour_location_scope_2.GetName]的大门时，很明显，这个地方正在为一个重要的地方节日做准备。作为国王，让[reform_mission_root_scope.GetRuler.GetName]在庆祝活动中发挥核心作用是非常合适的。然而，当地的神职人员似乎不愿意为了他们的国王而修改他们的传统仪式......"
 cyr_reform_01.14.t:0 "当地仪式"
 cyr_reform_01.15.a:0 "没有时间可以浪费了，我们将在这里和现在一起对付他们。"
 cyr_reform_01.15.a.tt:0 "\n #Y 不然的话。#!"
 cyr_reform_01.15.b:0 "匪徒会被处理掉，但首先我们要从周围的城镇筹集援军。"
 cyr_reform_01.15.c:0 "我们没有时间去对付他的..."
 cyr_reform_01.15.desc:0 "当[reform_mission_root_scope.GetRuler.GetName]的旅行队伍经过[tour_location_scope_3.GetName]时，他们收到了关于一小队利比亚强盗的消息，他们在该地区安营扎寨，正在骚扰当地社区。作为昔兰尼加的国王，保护我们的人民免受这种剥削当然是我们最重要的职责。然而，仅凭我们的小保镖，正面攻击这些强盗可能是危险的。"
 cyr_reform_01.15.t:0 "利比亚强盗"
 cyr_reform_01.16.a:0 "让保镖受到鞭打，并对该男子的家人进行赔偿。"
 cyr_reform_01.16.b:0 "这个人听起来很有用......如果他加入我们的护卫队，就可以得到他的正义感作为回报"
 cyr_reform_01.16.b.tt:0 "#Y [cyr_tour_local_brother.GetName]#! 将加入法庭。"
 cyr_reform_01.16.c:0 "我们不能因为我们的人骚扰了村里的女人就惩罚他们"
 cyr_reform_01.16.d:0 "其实，我是想找个人给我暖床... ..."
 cyr_reform_01.16.d.tt:0 "#Y [cyr_tour_local_sister.GetName]#! 将入朝为官。"
 cyr_reform_01.16.d.ttt:0 "#Y [cyr_tour_local_sister.GetName]#! 可能会怀孕。"
 cyr_reform_01.16.desc:0 "正当[reform_mission_root_scope.GetRuler.GetName]准备晚上退休时，附近[tour_location_scope_5.GetName]社区的一个年轻人找到他。他声称，我们的一名保镖一直在对他的妹妹进行不受欢迎的挑逗，并宣称严惩该保镖。如果我们不想冒着激怒当地人的风险，就必须小心处理这种情况。"
 cyr_reform_01.16.t:0 "不受欢迎的关注"
 cyr_reform_01.17.a:0 "家，甜蜜的家。"
 cyr_reform_01.17.desc:0 "经过六个月的长途跋涉，[reform_mission_root_scope.GetRuler.GetName]终于回到了[reform_mission_root_scope.GetCapital.GetName]的家。这次旅行让人疲惫不堪，在国王不在的时候，首都的很多工作都堆积如山，但至少昔兰尼加的公民现在应该感到与他们的国王更加亲近。"
 cyr_reform_01.17.t:0 "返回家园"
 cyr_reform_01.2.a:0 "辉煌的!"
 cyr_reform_01.2.desc:0 "我们已经开始了一个雄心勃勃的项目，要把[GetProvince('(int32)3360').GetName]变成一个适合国王的城市。我们的工程师已经在规划新的道路，检查旧的建筑，看看哪些将被美化，哪些将被拆毁。\重建将是一个漫长的过程，但一旦完成，[GetProvince('(int32)3360').GetName]将站在地中海最伟大的城市中，成为希腊文明和[reform_mission_root_scope.GetAdjective]智慧的骄傲。"
 cyr_reform_01.2.t:0 "[GetProvince('(int32)3360').GetName]的皇家城市"
 cyr_reform_01.3.a:0 "从头开始重建城市!"
 cyr_reform_01.3.b:0 "有限的重新设计就可以了"
 cyr_reform_01.3.desc:0 "在[GetProvince('(int32)3360').GetName]的扩张能够继续之前，我们必须决定重建的范围。许多由亚历山大和他的继任者建立的城市都是按照严格的网格系统布置的，这样可以优化空间的使用，使城市街道的导航更加直接。我们可以尝试按照希腊模式重建[GetProvince('(int32)3360').GetName]，然而这需要拆掉许多现有的建筑。\n\n自然，这样的行动将是昂贵的，而且很可能不受[GetProvince('(int32)3360').GetName]目前居民的欢迎……"
 cyr_reform_01.3.t:0 "皇城——希腊的城市"
 cyr_reform_01.4.a:0 "奉献一座宏伟的寺庙!"
 cyr_reform_01.4.b:0 "为[GetProvince('(int32)3360').GetName]的公民建造一个大剧院!"
 cyr_reform_01.4.c:0 "这些资金可以在其他地方得到更好的利用......"
 cyr_reform_01.4.desc:0 "作为[GetProvince('(int32)3360').GetName]正在进行的扩建工作的一部分，我们有机会以[reform_mission_root_scope.GetRuler.GetName]的名义奉献其中一座新建筑。一旦完成，新建筑将作为[reform_mission_root_scope.GetRuler.GetFamily.GetName]家族辉煌的纪念碑，是[reform_mission_root_scope.GetRuler.GetFamily.GetName]的权力和权威的实际体现。当然，伟大的公共工程从来不会便宜......"
 cyr_reform_01.4.t:0 "皇家城市--奉献"
 cyr_reform_01.5.a:0 "[GetProvince('(int32)3360').GetName]是为昔兰尼加准备的!"
 cyr_reform_01.5.b:0 "[GetProvince('(int32)3360').GetName]欢迎任何人的到来。"
 cyr_reform_01.5.c:0 "胡说八道!发出消息，[GetProvince('(int32)3360').GetName]的大门对任何人都是开放的。"
 cyr_reform_01.5.c.tt:0 "在#Y 4#! 和#Y 7#! 之间，将出现在[GetProvince('(int32)3360').GetName]。"
 cyr_reform_01.5.desc:0 "[GetProvince('(int32)3360').GetName]的扩张开始吸引了大量的移民，他们希望在王城获得好运。自然，这种外国人的涌入对[GetProvince('(int32)3360').GetName]的当地人来说不是没有争议的。如果我们想获得人民的支持，我们可能不得不对来自[reform_mission_root_scope.GetName]以外的移民关闭大门。"
 cyr_reform_01.5.t:0 "皇家城市--移民"
 cyr_reform_01.6.a:0 "我们的规则中心将是首屈一指的！\"！"
 cyr_reform_01.6.b:0 "一个适度的设计应该足够了。"
 cyr_reform_01.6.c:0 "一个简陋的住所，我们不需要颓废的奢侈品。"
 cyr_reform_01.6.desc:0 "重建[GetProvince('(int32)3360').GetName]的宏伟工程已经非常接近完成。这座城市已经变成了希腊文明的瑰宝之一。现在，唯一缺少的是一座适合这样一个城市的统治者的王宫。问题是我们愿意投资多少钱来建造。"
 cyr_reform_01.6.t:0 "王城--王宫"
 cyr_reform_01.7.a:0 "我们不能无视他们古老的血统。"
 cyr_reform_01.7.b:0 "巴特亚德王国早已灭亡。"
 cyr_reform_01.7.desc:0 "300多年前，巴图斯一世Battiad带领一群定居者从爱琴海的[GetProvince('(int32)454').GetName]岛来到利比亚海岸，在那里建立了[GetProvince('(int32)3360').GetName]城。巴图斯成为昔兰尼加的第一位国王，他建立的王朝--巴蒂亚德王朝，在屈服于内部动乱和波斯人的扩张主义之前，将继续统治两个世纪。\n\n虽然巴特德家族失去了王位，但他们的许多后代仍在整个昔兰尼加担任重要职务。这使他们在某种程度上成为我们新政府的挑战。将巴特兹家族纳入我们的政府可以支持我们统治的合法性，然而这很可能意味着将我们最大的竞争对手置于王位的咫尺之内。另一方面，虽然忽视他们可能会限制他们的影响力，但几乎肯定会把他们推向我们敌人的怀抱。"
 cyr_reform_01.7.t:0 "巴蒂亚德王朝"
 cyr_reform_01.8.a:0 "[cyr_battiad_bride.GetName]将与[reform_mission_root_scope.GetRuler.GetName]结婚"
 cyr_reform_01.8.b:0 "[cyr_battiad_bride.GetName]和[cyr_battiad_groom_heir.GetName]之间的结合将是最有利的。"
 cyr_reform_01.8.c:0 "不，巴蒂亚德家族已经有了机会。"
 cyr_reform_01.8.desc:0 "今天，[battiad_1.GetName]带着一个诱人的提议来到了法庭。他要向[cyr_battiad_bride.GetName]求婚。[cyr_battiad_bride.GetFirstName]是一位年轻的适婚年龄的女性，来自Battiad家族树的一个最著名的分支。她和[reform_mission_root_scope.GetRuler.GetFamily.GetName]家族成员之间的婚姻肯定会加强我们的权威，但不能保证这一切不是让巴特迪德家族重回王位的计划的一部分......"
 cyr_reform_01.8.t:0 "与巴蒂亚德家族的联姻"
 cyr_reform_01.9.a:0 "在新的地点重新找到[GetProvince('(int32)3350').GetName]。"
 cyr_reform_01.9.b:0 "重新安置，并给它起个新名字：贝勒尼基。"
 cyr_reform_01.9.c:0 "这只是水中的一点沙子，他们会没事的，就像现在这样。"
 cyr_reform_01.9.desc:0 "[GetProvince('(int32)3360').GetName]最初是由逃离政治动荡的流亡者建立的，[GetProvince('(int32)3350').GetName]是昔兰尼加中心地带最偏远的城市。这使得作为其港口的天然泻湖一直在淤积，使船只越来越难在那里登陆，这就更加可怕了。在这一点上，唯一的解决办法可能是将整个城市搬到几公里外的一个有更好港口的新地点。"
 cyr_reform_01.9.t:0 "欧厄斯佩里得斯的淤泥湖"
 cyr_renewed_kingdom:0 "复兴的王国"
 cyr_republican_support_large.tt:0 "这将#Y 极大地增加#!我国的#R 共和派#!权力基础。"
 cyr_republican_support_moderate.tt:0 "这将#Y 中度增加#!我们国家的#R 共和派#!权力基础。"
 cyr_republican_support_small.tt:0 "这将#Y 略微增加#!我国境内的#R 共和派#!权力基础。"
 cyr_reviewing_ledgers:0 "行政重点"
 cyr_rock_edict:0 "岩敕：弘法臾那"
 cyr_rock_edict_desc:0 "然，天爱思惟、依法之胜利，此才是最上之胜利。而此胜利，天爱既再三于此朕之领内并至六百由旬止，凡于诸邻邦人之间——于此有称为安提瑜迦之臾那王，又越过其安提瑜迦王，有称为土罗耶王、安提奇那王、摩迦王、阿利奇修达罗王之四王。"
 cyr_royal_mint:0 "皇家铸币厂"
 cyr_royalist_support_large.tt:0 "这将#Y 极大地增加#!我国的#G 保皇派#!权力基础。"
 cyr_royalist_support_moderate.tt:0 "这将#Y 中度增加#!我国的#G 保皇派#!权力基础。"
 cyr_royalist_support_small.tt:0 "这将#Y 略微增加#!我国的#G 保皇派#!权力基础。"
 cyr_silphium_cuisine:0 "罗盘草菜肴"
 cyr_silphium_economy:0 "罗盘草经济"
 cyr_silphium_extinct:0 "罗盘草绝迹"
 cyr_silphium_medicine:0 "罗盘草医学"
 cyr_silphium_scarce:0 "罗盘草日益稀缺"
 cyr_silphium_settlement:0 "收割罗盘草"
 cyr_silphium_sustainable_exports:0 "可持续的罗盘草出口"
 cyr_silphium_trade_disrupted:0 "罗盘草贸易被破坏"
 cyr_silphium_trade_hub:0 "罗盘草贸易中心"
 cyr_southern_libyans_pacified:0 "平定利比亚的袭击者"
 cyr_southern_libyans_subjugated:0 "利比亚突击队被征服"
 cyr_spartan_colony:0 "斯巴达人的殖民地"
 cyr_sponsored_games:0 "赞助游戏"
 cyr_stabilise_silphium:0 "#R 罗盘草#!·稳定罗盘草的出产"
 cyr_stabilise_silphium.tt:0 "已经做出了$cyr_control_grazing$和$cyr_control_exports$的决定。"
 cyr_stabilise_silphium_desc:0 "由于我国政府的及时行动，罗盘草的收获已经稳定在一个可持续的水平。虽然与过去罗盘草贸易给我国带来的巨大财富相比，这有点退步，但它保证了[SCOPE.GetRootScope.GetCountry.GetName]的人民能够在未来几代人中从阿波罗的礼物中获益。"
 cyr_stoic_state_philosophy:0 "斯多葛学派国家哲学"
 cyr_supply_lines:0 "确保供应线的安全"
 cyr_supporting_berenike:0 "支持贝勒尼基女王"
 cyr_syracuse_punished:0 "叙拉古的惩罚"
 cyr_syracuse_spared:0 "叙拉古被赦免"
 cyr_temple_dedicated:0 "寺庙献身"
 cyr_temple_of_ammon:0 "阿蒙大庙"
 cyr_the_last_silphium:0 "最后的罗盘草"
 cyr_the_last_silphium_desc:0 "最后一株Silphium植物的干燥和保存的遗迹，曾经收获过。这种药草曾经在昔兰尼加非常丰富，昔兰尼加的大部分经济都是围绕它的出口而建立的。现在只剩下这一小捆植物物质了。"
 cyr_theatre_dedicated:0 "剧院专用"
 cyr_theodorid_philosopher:0 "狄奥多里德学派哲学家"
 cyr_theodorid_state_philosophy:0 "狄奥多里德学派国家哲学"
 cyr_thera_01.1.a:0 "我们将在他们的战争中站在[cyr_crete_war_country_1.GetName]一边!"
 cyr_thera_01.1.a.tt:0 "如果[cyr_crete_war_country_1.GetName]接受，我们将#R 加入[cyr_crete_war_country_1.GetName]一方的战争#! 而#G [cyr_crete_war_country_1.GetName]将成为我们的附属国。#!"
 cyr_thera_01.1.b:0 "[cyr_crete_war_country_2.GetName]应该得到我们的援助!"
 cyr_thera_01.1.b.tt:0 "如果[cyr_crete_war_country_2.GetName]接受，我们将#R 加入[cyr_crete_war_country_2.GetName]一方的战争#!并且#G [cyr_crete_war_country_2.GetName]将成为我们的附属国。#!"
 cyr_thera_01.1.c:0 "[cyr_crete_war_country_3.GetName]需要我们的援助!"
 cyr_thera_01.1.c.tt:0 "如果[cyr_crete_war_country_3.GetName]接受，我们将#R 加入[cyr_crete_war_country_3.GetName]一方的战争#!并且#G [cyr_crete_war_country_3.GetName]将成为我们的附属国。#!"
 cyr_thera_01.1.d:0 "转念一想--最好不要纠缠于此......"
 cyr_thera_01.1.d.tt:0 "我们将不参与克里特岛的事务。"
 cyr_thera_01.1.desc:0 "克里特岛的许多城邦不断卷入彼此间的小冲突和对外部入侵者的冲突中。为了获得超越对手的优势，他们中的许多人都习惯于寻求外国势力的帮助来巩固自己的地位。我们也许可以利用这个机会在克里特岛建立一个立足点：如果我们帮助其中一个交战城市赢得他们目前的战争，我们可以利用这种情况将他们永久地拉入我们的影响范围。"
 cyr_thera_01.1.t:0 "克里特岛的华林城市"
 cyr_thera_01.10.a:0 "之前的礼物已经足够了..."
 cyr_thera_01.10.b:0 "让我们为[GetCountry('DEL').GetName]洒下黄金。"
 cyr_thera_01.10.c:0 "在他们的一个城市里建造一座宏伟的寺庙!"
 cyr_thera_01.10.desc:0 "[GetCountry('DEL').GetName]的人们对我们最近送给他们的礼物印象深刻。这可能是我们加倍慷慨并进行更大规模捐赠的合适时机。无论我们做什么，这肯定会拉近[GetCountry('DEL').GetName]与我们的影响范围。"
 cyr_thera_01.10.t:0 "给[GetCountry('DEL').GetName]的礼物"
 cyr_thera_01.11.a:0 "让所有的海盗都去死吧!"
 cyr_thera_01.11.b:0 "通过攻击海盗的大本营，进一步打动[GetCountry('DEL').GetName]。"
 cyr_thera_01.11.desc:0 "海盗是爱琴海的祸害，这就是为什么根除他们是[GetCountry('CYR').GetAdjective]海军的主要任务之一。看来这种对海上安全的投资并没有被[GetCountry('DEL').GetName]注意到，他们现在非常依赖我们的帮助来保持其沿海水域的安全。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_thera_01.11.t:0 "铲除海盗行为"
 cyr_thera_01.12.a:0 "令人印象深刻。"
 cyr_thera_01.12.desc:0 "作为一个小岛屿的集合体，[GetCountry('DEL').GetName]的生存在很大程度上依赖于海洋。可以毫不夸张地说，谁控制了海洋，谁就控制了[GetCountry('DEL').GetName]。我们现在拥有一支庞大的舰队，足以在爱琴海水域与几乎所有的敌人争夺。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_thera_01.12.t:0 "一支庞大的战争舰队"
 cyr_thera_01.13.a:0 "[GetCountry('CYR').GetAdjective]舰队的统治是至高无上的!"
 cyr_thera_01.13.desc:0 "现在，[GetCountry('CYR').GetAdjective]舰队比[GetCountry('DEL').GetName]的霸主[GetCountry('PRY').GetName]的舰队要大得多。如果没有一支强大的舰队，[GetCountry('PRY').GetName]将发现很难继续对爱琴群岛施加影响。这将拉近[GetCountry('DEL').GetName]与我们的势力范围。"
 cyr_thera_01.13.t:0 "使[GetCountry('PRY').GetName]的海军力量黯然失色"
 cyr_thera_01.14.a:0 "[GetCountry('PRY').GetAdjective]的力量在摇摆不定。"
 cyr_thera_01.14.desc:0 "[GetCountry('PRY').GetName]是小而弱的。在他们目前的状态下，他们将发现很难维持对[GetCountry('DEL').GetName]的控制，特别是当他们与一个更强大的国家如我们的国家竞争时。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_thera_01.14.t:0 "黯然失色的[GetCountry('PRY').GetName]"
 cyr_thera_01.15.a:0 "良好的信息传递是非常重要的。"
 cyr_thera_01.15.b:0 "为了证明我们的善意，我们将降低臣民缴纳的贡品。"
 cyr_thera_01.15.desc:0 "我们最近将[cyr_wooing_DEL_liberated_country_scope.GetName]从外国压迫下解放出来，坚定了[GetCountry('CYR').GetName]作为希腊小城邦和其他国家的朋友的地位。这使得我们作为[GetCountry('DEL').GetName]的潜在盟友的吸引力大大增加，因为他们可以确信在我们的统治下他们的权利将得到保护。这将拉近[GetCountry('DEL').GetName]与我们的影响范围。"
 cyr_thera_01.15.t:0 "解放[cyr_wooing_DEL_liberated_country_scope.GetName]的问题"
 cyr_thera_01.16.a:0 "仅仅是目前的游戏就足够了。"
 cyr_thera_01.16.b:0 "在[GetCountry('DEL').GetCapital.GetName]举办我们自己的游戏。"
 cyr_thera_01.16.desc:0 "也许[GetCountry('PRY').GetAdjective]对[GetCountry('DEL').GetName]的权威最明显的标志就是每年在[GetCountry('DEL').GetCapital.GetName]举行的纪念[GetCountry('PRY').GetAdjective]统治家族的游戏。如果我们要赞助我们自己的游戏，与[GetCountry('PRY').GetAdjective]的游戏相媲美，这肯定会大大削弱[GetCountry('PRY').GetAdjective]的统治。"
 cyr_thera_01.16.t:0 "赞助公共游戏"
 cyr_thera_01.17.a:0 "给他们一个好得无法拒绝的提议。"
 cyr_thera_01.17.a.tt:0 "如果我们给[GetCountry('DEL').GetName]留下了足够的印象，他们可能会选择成为附庸国。"
 cyr_thera_01.17.b:0 "给他们一个好得无法拒绝的提议。"
 cyr_thera_01.17.c:0 "给他们一个好得无法拒绝的提议。"
 cyr_thera_01.17.desc:0 "一段时间以来，[GetCountry('CYR').GetAdjective]外交官一直在进出[GetCountry('DEL').GetCapital.GetName]，试图说服[GetCountry('DEL').GetName]相信[GetCountry('CYR').GetAdjective]保护的好处。现在，我们终于准备好正式建立我们的关系。如果[GetCountry('DEL').GetName]接受我们的提议，他们将离开[GetCountry('PRY').GetName]的势力范围，成为[GetCountry('CYR').GetName]的藩属。不幸的是。由于[GetCountry('DEL').GetName]中几个有影响力的人仍然反对与我们建立更紧密的关系，所以成功远远没有保证。我们只能希望，我们过去的行动已经获得了足够的支持，以淹没那些反对的声音。"
 cyr_thera_01.17.t:0 "争取[GetCountry('DEL').GetName]--真理的时刻"
 cyr_thera_01.18.a:0 "一个明智的选择。"
 cyr_thera_01.18.desc:0 "看来[GetCountry('DEL').GetName]已经急切地接受了我们保护他们的提议。该[GetCountry('DEL').GetName]现在是[GetCountry('CYR').GetName]的臣民。"
 cyr_thera_01.18.t:0 "追求[GetCountry('DEL').GetName]--接受保护"
 cyr_thera_01.19.a:0 "[GetCountry('CYR').GetAdjective]的保护听起来很美妙。"
 cyr_thera_01.19.a.tt:0 "#R 我们将成为[GetCountry('CYR').GetName]的藩属。#!"
 cyr_thera_01.19.b:0 "我们再也不会屈服于外国僭主了！"
 cyr_thera_01.19.desc:0 "今天，我们收到了来自[GetCountry('CYR').GetName]的外交官。[GetCountry('CYR').GetName]向我们提供保护，以换取我们的定期进贡和对其战争的援助。如果我们接受，我们将成为[GetCountry('CYR').GetName]的臣民，但如果我们拒绝，他们可能试图通过战争征服我们。"
 cyr_thera_01.19.t:0 "[GetCountry('CYR').GetName]提供保护"
 cyr_thera_01.2.a:0 "我们可以利用我们能得到的所有帮助。"
 cyr_thera_01.2.a.tt:0 "[GetCountry('CYR').GetName]将加入我们目前的战争中"
 cyr_thera_01.2.a.ttt:0 "#R 我们将成为[GetCountry('CYR').GetName]的附属国！#!。"
 cyr_thera_01.2.b:0 "不需要外国干涉者!"
 cyr_thera_01.2.b.tt:0 "[GetCountry('CYR').GetName]将不会进一步介入我们的事务。"
 cyr_thera_01.2.desc:0 "今天，[GetCountry('CYR').GetRuler.GetName]的[GetCountry('CYR').GetName]派出的使团来到了我们的宫廷。[GetCountry('CYR').GetRuler.GetName]声称在我们目前的战争中同情我们的事业，他要向我们提供[GetCountry('CYR').GetName]的援助以赢得战争。\n\n虽然用[GetCountry('CYR').GetAdjective]的人和长矛来加强我们的地位是非常诱人的，但接受这个提议很可能会让[GetCountry('CYR').GetName]对我们的国内事务产生相当大的影响。"
 cyr_thera_01.2.t:0 "[GetCountry('CYR').GetRuler.GetName]提供援助"
 cyr_thera_01.20.a:0 "傻瓜们!"
 cyr_thera_01.20.desc:0 "看来，尽管我们尽了最大努力，[GetCountry('DEL').GetName]还是拒绝了我们保护他们的提议。如果我们仍然希望控制基克拉迪群岛，我们将不得不通过武力来实现。"
 cyr_thera_01.20.t:0 "争取[GetCountry('DEL').GetName]--保护被拒绝"
 cyr_thera_01.21.a:0 "很好!"
 cyr_thera_01.21.a.tt:0 "[GetProvince('(int32)454').GetName]现在属于[SCOPE.GetRootScope.GetCountry.GetName]。"
 cyr_thera_01.21.a.ttt:0 "几个昔兰尼加人口已经搬到了[GetProvince('(int32)454').GetName]。"
 cyr_thera_01.21.desc:0 "几个世纪前，[GetProvince('(int32)3360').GetName]第一批定居者的祖先逃离了[GetProvince('(int32)454').GetName]岛上的饥荒，在现在的昔兰尼加找到了新的生活。\n\n现在[GetProvince('(int32)454').GetName]在我们的控制之下，终于到了他们的后代返回家园的时候了。第一批昔兰尼加定居者已经抵达[GetProvince('(int32)454').GetName]，相信很快会有更多的人加入。"
 cyr_thera_01.21.t:0 "返回锡拉"
 cyr_thera_01.22.a:0 "锡拉比以往任何时候都要大"
 cyr_thera_01.22.desc:0 "不久前，[GetProvince('(int32)454').GetName]还只是基克拉迪群岛外围的一个小定居点。现在，由于我们的努力，它已经成为一个大型的、繁华的城市，即使不是该地区最重要的城市之一。从[GetProvince('(int32)454').GetName]开始，我们的影响力远远地传遍了整个水域，使我们成为爱琴海影响力争夺战中的关键竞争者。"
 cyr_thera_01.22.t:0 "从灰烬中崛起的锡拉"
 cyr_thera_01.23.a:0 "战争的代价..."
 cyr_thera_01.23.desc:0 "在混乱的战争中，我们的克里特岛盟友似乎已经被敌人摧毁。这可能对我们的计划造成重大挫折。"
 cyr_thera_01.23.t:0 "克里特岛的盟友被吞并"
 cyr_thera_01.3.a:0 "很好!"
 cyr_thera_01.3.b:0 "实际上，情况已经发生了变化..."
 cyr_thera_01.3.desc:0 "[cyr_crete_war_country_chosen.GetRuler.GetName]的[cyr_crete_war_country_chosen.GetName]已经急切地接受了我们对他们战争的帮助。这肯定会给我们在未来的[cyr_crete_war_country_chosen.GetAdjective]事务中带来重要的筹码。"
 cyr_thera_01.3.t:0 "克里特岛的瓦林城--接受援助"
 cyr_thera_01.4.a:0 "他们会对这个决定感到后悔。"
 cyr_thera_01.4.b:0 "很好，我们只是想帮忙。"
 cyr_thera_01.4.desc:0 "看来[cyr_crete_war_country_chosen.GetRuler.GetName]的[cyr_crete_war_country_chosen.GetName]已经拒绝了我们提供的帮助。[cyr_crete_war_country_chosen.GetName]更倾向于在没有外国参与的情况下打自己的战争。"
 cyr_thera_01.4.t:0 "克里特岛的瓦林城--援助被拒绝"
 cyr_thera_01.5.a:0 "检查工具提示"
 cyr_thera_01.5.desc:0 "隐藏的事件...你不应该看到这个。"
 cyr_thera_01.5.t:0 "检查克里特岛是否仍然处于战争状态"
 cyr_thera_01.6.a:0 "他们欠我们一个人情......"
 cyr_thera_01.6.desc:0 "[cyr_crete_war_country_chosen.GetName]所卷入的战争已经结束，但我们通过及时干预获得的影响力依然存在。[cyr_crete_war_country_chosen.GetName]现在牢牢地处于我们的影响范围内。我们应该以他们为桥头堡，将我们的影响力扩大到克里特岛的其他地方。"
 cyr_thera_01.6.t:0 "对[cyr_crete_war_country_chosen.GetName]的影响"
 cyr_thera_01.7.a:0 "[GetCountry('PRY').GetName]干扰[GetCountry('DEL').GetName]的时间太长了。"
 cyr_thera_01.7.desc:0 "[GetProvince('(int32)454').GetName]是[GetProvince('(int32)3360').GetName]希腊人的祖籍，目前由[GetCountry('DEL').GetName]控制，这是爱琴海各岛之间的一个松散联盟，总部设在[GetCountry('DEL').GetCapital.GetName]。然而，真正的权力在于[GetCountry('PRY').GetName]，他们对[GetCountry('DEL').GetAdjective]的政治保持严格的控制，并利用它们在该地区施加影响。在我们能够光荣地返回泰拉之前，我们必须先把[GetCountry('DEL').GetName]从他们的势力范围内扳回来。\n\n#R 这个任务解锁了几个新的决议，我们可以增加对[GetCountry('DEL').GetName]的影响力。一旦我们的影响力足够强大，我们就可以尝试用'要求忠诚'的决议将[GetCountry('DEL').GetName]拉入我们的势力范围。#!"
 cyr_thera_01.7.t:0 "争取基克拉迪群岛"
 cyr_thera_01.8.a:0 "非常好!"
 cyr_thera_01.8.desc:0 "[GetCountry('CYR').GetRuler.GetName]利用他与[GetCountry('DEL').GetRulerTitle][GetCountry('DEL').GetRuler.GetName]的密切友谊，向[GetCountry('DEL').GetFirstName]强调与[GetCountry('CYR').GetName]形成更紧密联系的好处。这将使[GetCountry('DEL').GetName]更接近于我们的影响范围。"
 cyr_thera_01.8.t:0 "统治者之间的友谊"
 cyr_thera_01.9.a:0 "一切按计划进行。"
 cyr_thera_01.9.b:0 "双重的侮辱!"
 cyr_thera_01.9.desc:0 "我们最近对[GetCountry('PRY').GetName]施加的粘稠的外交侮辱已经达到了预期效果。[GetCountry('PRY').GetRuler.GetName]无法做出决定性的回应，使他在臣民眼中显得软弱。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_thera_01.9.t:0 "外交侮辱"
 cyr_three_tribes:0 "三大部落"
 cyr_touring_cyrenaica:0 "皇家旅游"
 cyr_traditions_spurned:0 "抛弃的传统"
 cyr_tribute_reduced_mod:0 "贡品减少"
 cyr_tripod_of_triton:0 "特里同之鼎"
 cyr_tripod_of_triton_desc:0 "据称，这个简陋的三脚架是为暴躁的海神特里同制作的。"
 cyr_tripolitanian_colony:0 "的黎波里亚殖民地"
 cyr_undisturbed_celebration:0 "不受干扰的庆祝活动"
 cyr_unhappy_locals:0 "不快乐的当地人"
 cyr_upset_bodyguard:0 "苦恼的保镖"
 cyr_western_horn:0 "西部之角"
 cyr_wonder_library_of_cyrene:0 "昔兰尼图书馆"
 cyr_wooing_DEL_demand_loyalty:0 "#R 群岛联盟#! 要求忠诚"
 cyr_wooing_DEL_demand_loyalty.tt:0 "我们对[GetCountry('DEL').GetName]的影响力是足够大的。"
 cyr_wooing_DEL_demand_loyalty_desc:0 "现在是时候要求[GetCountry('DEL').GetName]接受我们作为他们的新霸主了。如果他们接受，[GetCountry('DEL').GetName]将不再是[GetCountry('PRY').GetName]的臣民，而成为我们影响范围的一部分。"
 cyr_wooing_DEL_eclipsing_PRY:0 "#R 群岛联盟#! 黯然失色的安提柯家族"
 cyr_wooing_DEL_eclipsing_PRY_desc:0 "[GetCountry('PRY').GetName]小而弱。在他们目前的状态下，他们将发现很难维持对[GetCountry('DEL').GetName]的控制，特别是当他们与一个更强大的国家如我们的国家竞争时。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_wooing_DEL_eclipsing_fleet:0 "#R 群岛联盟#! 黯然失色的海军力量"
 cyr_wooing_DEL_eclipsing_fleet_desc:0 "[GetCountry('CYR').GetAdjective]的舰队现在比[GetCountry('DEL').GetName]的霸主[GetCountry('PRY').GetName]的舰队大得多。如果没有一支强大的舰队，[GetCountry('PRY').GetName]将很难继续对爱琴群岛施加影响。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_wooing_DEL_fleet:0 "#R 群岛联盟#! 一支大型战争舰队"
 cyr_wooing_DEL_fleet_desc:0 "作为一个小岛屿的集合体，[GetCountry('DEL').GetName]在很大程度上依赖海洋而生存。可以毫不夸张地说，谁控制了海洋，谁就控制了[GetCountry('DEL').GetName]。我们现在拥有一支庞大的舰队，足以在爱琴海水域与几乎所有的敌人争夺。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_wooing_DEL_friendship:0 "#R 群岛联盟#! 统治者之间的友谊"
 cyr_wooing_DEL_friendship_desc:0 "[GetCountry('CYR').GetRuler.GetName]利用他与[GetCountry('DEL').GetRulerTitle][GetCountry('DEL').GetRuler.GetName]的亲密友谊，向[GetCountry('DEL').GetFirstName]暗示与[GetCountry('CYR').GetName]建立更紧密联系的好处。这将使[GetCountry('DEL').GetName]更接近于我们的影响范围。"
 cyr_wooing_DEL_games:0 "#R 群岛联盟#! 赞助公共游戏"
 cyr_wooing_DEL_games_desc:0 "也许[GetCountry('PRY').GetAdjective]对[GetCountry('DEL').GetName]的权威最明显的标志就是每年在[GetCountry('DEL').GetCapital.GetName]举行的纪念[GetCountry('PRY').GetAdjective]统治家族的游戏。如果我们要赞助我们自己的游戏，与[GetCountry('PRY').GetAdjective]的游戏相媲美，这肯定会大大削弱[GetCountry('PRY').GetAdjective]的统治。"
 cyr_wooing_DEL_gifts:0 "#R 群岛联盟#! 礼物"
 cyr_wooing_DEL_gifts_desc:0 "[GetCountry('DEL').GetName]的人民对我们最近送给他们的礼物印象深刻。这可能是我们加倍慷慨并进行更大捐赠的合适时机。不管我们怎么做，这肯定会拉近[GetCountry('DEL').GetName]与我们的影响范围。"
 cyr_wooing_DEL_insult:0 "#R 群岛联盟#! 外交侮辱"
 cyr_wooing_DEL_insult_desc:0 "我们近期对[GetCountry('PRY').GetName]施加的恶意外交侮辱已达成预期效果——[GetCountry('PRY').GetRuler.GetName]无力作出果断回应，这使其在臣民眼中显得软弱。此举将使[GetCountry('DEL').GetName]更倾向于我们的势力范围。"
 cyr_wooing_DEL_liberation:0 "#R 群岛联盟#! 解放"
 cyr_wooing_DEL_liberation_desc:0 "我们最近将[cyr_wooing_DEL_liberated_country_scope.GetName]从外国压迫下解放出来，牢固地确立了[GetCountry('CYR').GetName]作为希腊和其他小城邦的朋友。这使得我们作为[GetCountry('DEL').GetName]的潜在盟友的吸引力大大增加，因为他们可以确信在我们的统治下，他们的权利将得到保护。这将使[GetCountry('DEL').GetName]更接近我们的影响范围。"
 cyr_wooing_DEL_piracy:0 "#R 群岛联盟#! 根除海盗行为"
 cyr_wooing_DEL_piracy_desc:0 "海盗是爱琴海的祸害，这就是为什么根除他们是[GetCountry('CYR').GetAdjective]海军的主要任务之一。看来这种对海上安全的投资并没有被[GetCountry('DEL').GetName]所忽视，他们现在非常依赖我们的帮助来保持其沿海水域的安全。这将拉近[GetCountry('DEL').GetName]与我们影响范围的距离。"
 cyr_wooing_DEL_uncertain_overlordship:0 "#R 群岛联盟#! 不确定的权力"
 cyr_wooing_DEL_uncertain_overlordship_desc:0 "似乎发生了一些不可预见的事情，[GetCountry('PRY').GetName]对[GetCountry('DEL').GetName]的权威正在滑落。这可能是我们采取行动的时候了。"
 cyr_works_of_kallimakhos:0 "《卡利马科斯诗集》"
 cyr_works_of_kallimakhos_desc:0 "伟大诗人卡利马科斯的作品合计超过八百篇，或许是希腊化时代最具影响力的文学成果。\n\n卡利马科斯最重要的创作包括《皮纳克斯》——一部囊括全部希腊文学的综合目录；《起源》——一系列关于现实神话起源的诗歌；《赫卡勒》——一部以英雄忒修斯视角讲述老妇人生平的史诗；以及他的讽刺诗和六十首宗教赞歌。"
 cyrene_1_academies:0 "利比亚的瑰宝"
 cyrene_1_academies_BUTTON_TOOLTIP:0 "促进昔兰尼加成为一个学习中心，并通过鼓励锡尔菲姆贸易来扩大经济。"
 cyrene_1_academies_CRITERIA_DESCRIPTION:0 "当昔兰尼学派得到改革，罗盘草贸易得到扩大，这项使命才算完成。"
 cyrene_1_academies_DESCRIPTION:0 "[GetProvince('(int32)3360').GetName]作为希腊最伟大的城市之一，主要归功于两件事：该市许多知识分子创作的大量文学作品，以及在昔兰尼加以外任何地方都找不到的珍贵药草罗盘草。\n\n[GetProvince('(int32)3360').GetName]的知识分子中，最杰出的是昔兰尼学派的哲学家。西里亚学派认为，快乐是人生的最高目标，所有的决定都应该建立在努力使快乐最大化、痛苦最小化的基础上。不幸的是，昔兰尼学派正日益受到更年轻、更精致的哲学流派的挑战，这使得该学派在最新一代昔兰尼哲学家争论如何应对时出现了断裂。\n\n与此同时，[GetProvince('(int32)3360').GetName]的财政财富来自于罗盘草的出口。西尔菲姆是一种非常有价值的商品，可以作为治疗各种疾病的药物，也可以作为高级菜肴中的芳香调料。然而，它最重要的用途是控制意外怀孕。当妇女食用罗盘草时，会使身体排斥孩子，必要时防止或终止怀孕。"
 cyrene_1_academies_task_1:0 "学习中心"
 cyrene_1_academies_task_1.tt:0 "#Y 埃拉托斯特尼 “全才”#!，一个高度熟练的学者，将加入你的宫廷。"
 cyrene_1_academies_task_10:0 "加大罗盘草的采集"
 cyrene_1_academies_task_10.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在[GetProvince('(int32)3360').GetArea.GetName|Y]和[GetProvince('(int32)3347').GetArea.GetName|Y]省份的领地拥有至少#Y [SCOPE.ScriptValue('cyrene_1_academies_task_10_buildings_total')|0]#!#Y 磨坊#!或#Y 矿井#![SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_academies_task_10_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_academies_task_10_construction_loc')]"
 cyrene_1_academies_task_10_DESC:0 "对罗盘草的需求实际上超过了我们的供应能力，我们正在错过潜在的收入，这是一笔小财富。不惜一切代价，下令在整个昔兰尼加建造磨坊和矿场，以促进我们最宝贵的作物的销售！"
 cyrene_1_academies_task_10_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('cyrene_1_academies_task_10_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_academies_task_10_buildings_total')|0]#!)"
 cyrene_1_academies_task_10_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('cyrene_1_academies_task_10_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_academies_task_10_buildings_total')|0]#!)"
 cyrene_1_academies_task_10_construction_loc_1:0 "\n    @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 正在省份[GetProvince('(int32)3360').GetArea.GetName|Y]和[GetProvince('(int32)3347').GetArea.GetName|Y]进行建设"
 cyrene_1_academies_task_11:0 "出口产业的多样化"
 cyrene_1_academies_task_11.tt:0 "在 [GetProvince('(int32)8178').GetArea.GetRegion.GetName|Y] 与 [GetProvince('(int32)3360').GetArea.GetRegion.GetName|Y] 地区中，至少各有 #Y 3#! 个产出过 #Y 马匹#! @horses! 的领地建有 #Y 奴隶庄园#! 建筑。"
 cyrene_1_academies_task_11_DESC:0 "虽然我们从目前的出口中赚了很多钱，但我们的一些顾问建议我们使经济多样化，不要太依赖任何一种贸易品，以免市场条件的变化导致我们的收入波动。看到建议中的智慧，你们决定发展我们的马匹市场，因为昔兰尼加的骏马是世界上最好的。"
 cyrene_1_academies_task_12:0 "医学奇迹"
 cyrene_1_academies_task_12.tt:0 "一个#Y 熟练的医生#! 将加入我们的法庭。"
 cyrene_1_academies_task_12_A.tt:0 "[GetProvince('(int32)3360').GetArea.GetRegion.GetName|Y]区域内的任意领土拥有#Y 学院#!、#Y 国家基础设施#!投资，并生产#Y 罗盘草#!@silphium!。"
 cyrene_1_academies_task_12_DESC:0 "罗盘草，这种神奇的植物有无数的用途，也可以提炼成药物--还有什么是这种神奇的作物不能做的吗？"
 cyrene_1_academies_task_13:0 "烹饪学校"
 cyrene_1_academies_task_13_A.tt:0 "[GetProvince('(int32)3360').GetArea.GetRegion.GetName|Y]地区的每一个领土都有#Y 广场#!、#Y 定向投资#! 省份投资和生产#Y 罗盘草#! @silphium!."
 cyrene_1_academies_task_13_DESC:0 "丝瓜的辛辣味道是一种美食，被那些寻求以其罕见的异国风味来炫耀味蕾的老饕们高度要求。有人推测，一些旅行者来到我们的城市，不是为了喝我们哲学学校里溢出的井水，而是为了品尝我们厨房里的美味。"
 cyrene_1_academies_task_14:0 "阿波罗尼亚的港口"
 cyrene_1_academies_task_14.tt:0 "#Y [GetProvince('(int32)3361').GetName]#! 在$port_building$$port_building$#Y 中的每一个[GetProvince('(int32)3360').GetName]都会获得一个#!。\n在$port_building$#Y [GetProvince('(int32)3360').GetName]中每有一个#! ，就有两个随机弹出的人从#Y [GetProvince('(int32)3360').GetName]#! 移动到#Y [GetProvince('(int32)3361').GetName]#!。\n#Y [GetProvince('(int32)3360').GetName]#! 失去了所有的$port_building$s。"
 cyrene_1_academies_task_14_A.tt:0 "[GetProvince('(int32)3361').GetName|Y]的领土满足以下条件：\n*拥有#Y 城市#! 地位\n*拥有#Y 港口#!\n*拥有比拥有港口的[GetProvince('(int32)3360').GetName|Y]更多的可用建筑槽位"
 cyrene_1_academies_task_14_DESC:0 "由于大量的定居者涌入，试图利用我们的繁荣，凯雷恩已经变得如此拥挤，一个雄心勃勃的扩张计划已经摆在你面前；在邻近的[GetProvince('(int32)3361').GetName]领土上建造一个大港口。这可以在我们的首都释放出宝贵的土地，这些土地可能更好地用于建造其他建筑。"
 cyrene_1_academies_task_1_A.tt:0 "[GetProvince('(int32)3360').GetArea.GetName|Y]省正在进口#Y Papyrus#! @papyrus!，并且其领土上至少有#Y 3个图书馆#!。"
 cyrene_1_academies_task_1_DESC:0 "[GetProvince('(int32)3360').GetName]，由于我们的投资，已经成为著名的地中海学问精英聚集的地方，可以自由讨论和分享想法。我们可以做的还有很多；通过进口纸莎草纸，我们将确保那些已经工作到骨子里的抄写员，就像现在这样，继续发展我们的图书馆。"
 cyrene_1_academies_task_2:0 "昔兰尼哲学"
 cyrene_1_academies_task_2.tt:0 "数位#Y 技艺高超的哲学家#!将加入你的宫廷。"
 cyrene_1_academies_task_2_A.tt:0 "[GetProvince('(int32)3360').GetArea.GetName|Y]省至少有#Y 2#! 个领地有#Y 3个学院#!。"
 cyrene_1_academies_task_2_DESC:0 "我们的学院正在成为文明世界的羡慕对象，许多人甚至说我们已经开始超越雅典，成为哲学思想的灯塔--你碰巧同意这种看法。我们应该继续资助学院的建设，这样我们在哲学界的卓越地位就不会受到挑战。"
 cyrene_1_academies_task_3:0 "促进艺术的发展"
 cyrene_1_academies_task_3.tt:0 "#Y 卡利马科斯#!，一位杰出的诗人，将加入你的宫廷。"
 cyrene_1_academies_task_3.ttt:0 "在每个有大剧院的城市中，最多有#Y 三个非主要宗教人口#! 将#G 同化#! 到我们的文化。"
 cyrene_1_academies_task_3_A.tt:0 "在 [GetProvince('(int32)3360').GetArea.GetName|Y] 与 [GetProvince('(int32)3347').GetArea.GetName|Y] 地区中，至少各有 #Y 3#! 块领土建有 #Y 大剧场#!。"
 cyrene_1_academies_task_3_DESC:0 "我们的剧院是令人难以置信的热门景点；每当有最新的戏剧上演时，几乎不可能在屋内找到一个空位。为了使我们有文化的民众得到娱乐，我们应该考虑建造更多的大剧院。"
 cyrene_1_academies_task_4:0 "昔兰尼加学派国家哲学"
 cyrene_1_academies_task_4.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]将获得#Y $cyr_annicerid_state_philosophy$#!、#Y $cyr_theodorid_state_philosophy$#!或#Y $cyr_hegesiad_state_philosophy$#! ，这取决于被支持的候选人的哲学流派。"
 cyrene_1_academies_task_4_A.tt:0 "#Y [GetOffice('office_philosopher').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!或#Y [GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!拥有至少#Y 10#!热忱@religious_icon!，且是一位#Y 安尼克里德、狄奥多里德或赫基西亚德哲学家#!。"
 cyrene_1_academies_task_4_DESC:0 "虽然我们无疑看到了采用官方国家哲学的好处，但如果我们决定专门研究在我们王国传播的众多流派中的一种，我们可能做得更好。安纳塞里德、狄奥多里德和赫基西亚德的教义都是可以接受的人选。"
 cyrene_1_academies_task_5:0 "一个新的思想流派"
 cyrene_1_academies_task_5.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]将获得#Y $cyr_epicurean_state_philosophy$#!，#Y $cyr_stoic_state_philosophy$#!，或#Y $cyr_cynic_state_philosophy$#! ，基于支持的候选人的哲学流派。"
 cyrene_1_academies_task_5_A.tt:0 "#Y [GetOffice('office_philosopher').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!或#Y [GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#!拥有至少#Y 10#!热忱@religious_icon!，且不是#Y 安尼克里德、狄奥多里德或赫基西亚德哲学家#!。"
 cyrene_1_academies_task_5_DESC:0 "凯雷恩城被称为'哲学广场'，这是因为有史以来最伟大的思想家聚集在一个城市所传授的奇妙学说数量之多。因此，各种哲学流派开始生根发芽，这一发展让你非常高兴。我们可以正式采用斯多葛派、伊壁鸠鲁派、甚至犬儒派的信条，如果陛下高兴的话。"
 cyrene_1_academies_task_6:0 "西里安学院"
 cyrene_1_academies_task_6_DESC:0 "我们作为博学思想中心的声誉与日俱增，有人甚至称我们为'哲学的亚特兰蒂斯'，把我们比作柏拉图在对话录《蒂迈欧与克里蒂亚斯》中描述的传说中的城市--我们有什么好争论的？"
 cyrene_1_academies_task_7:0 "阿波罗给昔兰尼加的礼物"
 cyrene_1_academies_task_7.tt:0 "我们的一个省将开始生产罗盘草。"
 cyrene_1_academies_task_7_A.tt:0 "在[GetProvince('(int32)3360').GetArea.GetName|Y]和[GetProvince('(int32)3347').GetArea.GetName|Y]省的任何领地，如果有#Y 平原#! 地形，就有一个#Y 农业定居点#! 建筑。"
 cyrene_1_academies_task_7_DESC:0 "如果我们扩大我们的农业定居点，就很有可能生产出罗盘草；这是受到祝福的阿波罗送给他所喜爱的昔兰尼加人的礼物。"
 cyrene_1_academies_task_8:0 "促进罗盘草贸易"
 cyrene_1_academies_task_8.tt:0 "我们的一个城市将开始生产罗盘草。"
 cyrene_1_academies_task_8_A.tt:0 "在[GetProvince('(int32)3360').GetArea.GetName|Y]和[GetProvince('(int32)3347').GetArea.GetName|Y]省的任何领土上，至少有#Y 2个港口#! 和#Y 3个市场#!。"
 cyrene_1_academies_task_8_DESC:0 "罕见的作物罗盘草为我们的港口和市场带来了繁荣的时代；似乎全世界的人都渴望得到这种贸易品。发出消息，增加它的种植！"
 cyrene_1_academies_task_9:0 "确保新的出口市场"
 cyrene_1_academies_task_9.tt:0 "在外交范围内，至少有#Y 3#!个拥有#Y 50#!块领土以上的国家，对[SCOPE.GetRootScope.GetCountry.GetName|Y]有至少#Y 50#!好感。"
 cyrene_1_academies_task_9_DESC:0 "虽然我们在国外的声誉受到了应有的尊重，但如果真到了那个时候，用外交姿态和礼物来润滑友谊的车轮也是无妨的。如果我们与邻国建立良好的关系，无疑会增加我们的贸易收入，特别是我们珍贵的经济作物，罗盘草。"
 cyrene_1_academies_task_final:0 "罗盘草出口"
 cyrene_1_academies_task_final_DESC:0 "由于我们对这一宝贵资源的精心管理，罗盘草贸易已经成为我们经济的基石，而且我们的人民每天都在消费它，他们对这种香料已经有了贪婪的胃口。我们的公民，他们的呼吸中充满了我们心爱的罗盘草的辛辣香味，庆祝我们高尚的美食带来的快乐。"
 cyrene_1_intoegypt:0 "埃及的财富"
 cyrene_1_intoegypt_CRITERIA_DESCRIPTION:0 "当骄傲的埃及被征服，她的巨大资源被她的合法主人——昔兰尼加人所占有时，这个任务才算完成。"
 cyrene_1_intoegypt_DESCRIPTION:0 "埃及土地的财富，在生命的尼罗河的祝福和支持下，像蜂蜜吸引苍蝇一样吸引着索取者，饥饿的昔兰尼加人在这方面与波斯人或马其顿人没有什么不同。尽管奖品将被激烈地争夺，但法老们的丰厚宝藏是诱人的，只是勉强够不着......但是，在我们大胆的愿景引领下，这将永远改变。"
 cyrene_1_intoegypt_task_1:0 "马耳马里卡的边界冲突"
 cyrene_1_intoegypt_task_1.tt:0 "我们将开始尝试对#Y [cyr_egypt_scope.GetName]#!的边境上省份#Y 伪造宣称#!。"
 cyrene_1_intoegypt_task_10:0 "尼罗河上游"
 cyrene_1_intoegypt_task_10.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!获得#Y [THIS.GetProvince.GetArea.GetRegion.GetName]#!地区#Y [cyr_egypt_scope.GetName]#!拥有的所有领土的宣称。"
 cyrene_1_intoegypt_task_10_A.tt:0 "在[GetProvince('(int32)552').GetArea.GetRegion.GetName|Y]区域拥有任意领土。"
 cyrene_1_intoegypt_task_10_B.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]没有与[cyr_egypt_scope.GetName|Y]休战或结盟。"
 cyrene_1_intoegypt_task_10_DESC:0 "尼罗河的水在召唤，有希望带领我们取得更大的胜利；让我们继续我们艰巨的工作，继续将托勒密王朝驱逐出埃及。"
 cyrene_1_intoegypt_task_11:0 "地中海帝国"
 cyrene_1_intoegypt_task_11_A.tt:0 "托勒密王朝在#Y $palestine_region$#!或#Y $syria_region$#!拥有领土。"
 cyrene_1_intoegypt_task_11_DESC:0 "从我们在[GetProvince('(int32)509').GetName]的权力地位，我们能够将我们的权威投射到那些可能曾经质疑过它的领域。曾经被托勒密宣称的迦南和叙利亚的土地现在是我们的囊中之物；战鼓声引领我们走向辉煌的未来。"
 cyrene_1_intoegypt_task_12:0 "阿蒙之家"
 cyrene_1_intoegypt_task_12.tt:0 "#Y [GetProvince('(int32)5537').GetName]#! 是$omen_ammon$、$omen_zeus_amun$或$omen_amun$的圣地。"
 cyrene_1_intoegypt_task_12.ttt:0 "当地的神[GetDeityDefinition('omen_zeus_amun').GetName|Y]现在可以在我们的万神殿中使用!"
 cyrene_1_intoegypt_task_12_DESC:0 "[GetProvince('(int32)5537').GetName]绿洲是利比亚公羊头神阿蒙的最神圣的地方。虽然阿蒙起源于利比亚，但在昔兰尼加是一个非常受欢迎的神。[GetProvince('(int32)3360').GetName]的人们将他的崇拜与宙斯的崇拜结合在一起，成为一个神，即宙斯-阿蒙，对阿蒙的崇拜现在已经远远传遍了整个地中海，这在很大程度上要归功于昔兰尼加。  \n\n现在[GetProvince('(int32)3373').GetName]在我们的控制之下，我们应该通过建造一座宏伟的新神庙来容纳位于那里的阿蒙神谕来表示我们的感谢。"
 cyrene_1_intoegypt_task_13:0 "阿蒙的祝福"
 cyrene_1_intoegypt_task_13_DESC:0 "有一次，[GetCharacter('(int32)39').GetName]前往[GetProvince('(int32)5537').GetName]的绿洲，在那里他被公认为是一个神圣的存在，是埃及的合法法老。鉴于昔兰尼加与阿蒙的特殊关系，我们的统治者试图踏上[GetCharacter('(int32)39').GetFirstName]的脚步是很自然的。"
 cyrene_1_intoegypt_task_14:0 "讨好阿蒙祭司"
 cyrene_1_intoegypt_task_14.tt:0 "任何#Y 万神殿神祇#! 都是#Y $egyptian_pantheon$#!的。"
 cyrene_1_intoegypt_task_14.ttt:0 "$omen_ammon$、$omen_zeus_amun$或$omen_amun$必须在#Y 万神殿#!中。"
 cyrene_1_intoegypt_task_14_A.tt:0 "[GetCulture('egyptian').GetName|Y]文化拥有#Y 高贵的#! @nobles!权利。"
 cyrene_1_intoegypt_task_14_DESC:0 "阿蒙神等同于昔兰尼加崇拜的埃及神祇阿蒙。这使得阿蒙祭司阶层自然成为我们合法化统治埃及的重要盟友。"
 cyrene_1_intoegypt_task_15:0 "下埃及的法老"
 cyrene_1_intoegypt_task_15_A.tt:0 "[GetCulture('egyptian').GetName|Y]文化是一体化的。"
 cyrene_1_intoegypt_task_15_B.tt:0 "如果[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]决定为自己加冕#Y 法老#! 获得以下效果：\n\n。"
 cyrene_1_intoegypt_task_15_C.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]获得#Y 法老特性#! @pharaoh!。"
 cyrene_1_intoegypt_task_15_DESC:0 "现在，整个下埃及都在我们的统治之下，当地的祭司也站在了我们这一边，我们可以利用这个机会让我们的统治者成为下埃及的法老，这将使管理埃及变得容易许多，尽管者在我们的领土内并不受一些埃及人的欢迎。\n\n\n\n\n\n\n\n\n\n@egypt_por1!"
 cyrene_1_intoegypt_task_1_A.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]和[GetCountry('EGY').GetName|Y]在#Y [GetProvince('(int32)3367').GetArea.GetName]#!省都有领土。"
 cyrene_1_intoegypt_task_1_DESC:0 "马耳马里卡区域传统上被视为昔兰尼加的一部分，但实际上目前由[cyr_egypt_scope.GetName]控制，该势力在该地区唯一的重要城市[GetProvince('(int32)3373').GetName]驻有守军。\n\n反观周边地区，人口稀少且[cyr_egypt_scope.GetAdjective]控制力薄弱。若能派遣本国公民定居这些无人认领的土地，必将显著增强我方对该区域的主权主张。"
 cyrene_1_intoegypt_task_2:0 "定居马耳马里卡"
 cyrene_1_intoegypt_task_2.tt:0 "在#Y [GetProvince('(int32)3373').GetArea.GetName]的每个其他省份#! 获得#Y $cyr_marmarica_growing$#!。"
 cyrene_1_intoegypt_task_2_A.tt:0 "[GetProvince('(int32)3367').GetArea.GetName|Y]省份中至少有#Y 3#!块具有#Y 城市#!地位的领土拥有[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]文化。"
 cyrene_1_intoegypt_task_2_DESC:0 "现在，[GetProvince('(int32)3372').GetArea.GetName]是我们的了，我们应该通过增加该地区的人口来确保我们的控制。[GetProvince('(int32)3372').GetArea.GetName]的大部分地区都是荒凉的，但[GetProvince('(int32)3370').GetName]的领土（因其位于克里特岛皮尔戈斯城的对面而得名）拥有非洲最好的天然港口之一，将成为建设新城市的好地点。  "
 cyrene_1_intoegypt_task_3:0 "扩大沿海商队"
 cyrene_1_intoegypt_task_3.tt:0 "[GetProvince('(int32)3366').GetName|Y]、[GetProvince('(int32)3373').GetName|Y]和[GetProvince('(int32)3378').GetName|Y]有公路相连。"
 cyrene_1_intoegypt_task_3_DESC:0 "走陆路，穿过[GetProvince('(int32)3372').GetArea.GetName]的沙漠，从来都不是一件容易的事，但现在我们已经给这个地区带来了和平，我们应该考虑建造道路，以方便旅行。通过这样做，我们将大大扩大沿海商队的规模。"
 cyrene_1_intoegypt_task_4:0 "引进昔兰尼加官僚"
 cyrene_1_intoegypt_task_4.tt:0 "几个#Y 昔兰尼加人贵族人口#! 将搬到#Y 上埃及#!的城市。"
 cyrene_1_intoegypt_task_4_A.tt:0 "在#Y [GetProvince('(int32)516').GetArea.GetRegion.GetName]#!地区拥有至少20个省。"
 cyrene_1_intoegypt_task_4_B.tt:0 "在 #Y [GetProvince('(int32)516').GetArea.GetRegion.GetName]#! 地区中，至少有 #Y 3#! 块领土建有 #Y 3 座法院#!。"
 cyrene_1_intoegypt_task_4_DESC:0 "虽然有些人故意服从于我们给埃及土地带来的变化，但我们不相信当地的精英会管理我们的事务--我们为什么要这样做？通过将昔兰尼加安排到权力岗位上，我们的心就会放下来。"
 cyrene_1_intoegypt_task_5:0 "亚历山大之门"
 cyrene_1_intoegypt_task_5_DESC:0 "在一次令人震惊的军事力量展示中，昔兰尼加人将懦弱的托勒密人赶出了亚历山大城，为自己夺取了这座美丽的城市。在[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的军队征服被背信弃义的马其顿人占领的其余领土之前，这只是时间问题。"
 cyrene_1_intoegypt_task_6:0 "与亚历山大港合作"
 cyrene_1_intoegypt_task_6_A.tt:0 "[GetProvince('(int32)516').GetArea.GetRegion.GetName|Y]的总督至少有#Y 8个智略#! @civic_icon!。"
 cyrene_1_intoegypt_task_6_DESC:0 "通过将我们的一些财富倾注于美化亚历山大城，我们将确保该城居民的忠诚度，这反过来又应该促进他们的生产产出。但我们不要忽视我们的首都；命令在两个城市都进行建设，以促进这两个文明灯塔之间的思想和货物的交流。"
 cyrene_1_intoegypt_task_7:0 "昔兰尼的宿敌俯首"
 cyrene_1_intoegypt_task_7_DESC:0 "曾经，我们被来自亚历山大人的异想天开和暴虐的命令打得遍体鳞伤，但现在诸神眷顾我们，把马其顿人打入苦难的深渊。如果我们惩罚我们昔日的敌人，提醒他们对昔兰尼加犯下的多种罪行，这才符合正义的利益。"
 cyrene_1_intoegypt_task_8:0 "迁移缪斯神庙"
 cyrene_1_intoegypt_task_8.tt:0 "#Y NOT#! 亚历山大图书馆正在建设中。"
 cyrene_1_intoegypt_task_8.ttt:0 "#Y 亚历山大图书馆#! 之前已经建造过了。"
 cyrene_1_intoegypt_task_8.tttt:0 "[GetProvince('(int32)516').GetName]没有#Y 亚历山大图书馆#!。"
 cyrene_1_intoegypt_task_8_DESC:0 "亚历山大城的缪斯神庙，从各种意义上都是这座城市的冠冕之珍，它的声誉吸引着全世界的学者和旅者来到尼罗河三角洲。在与你的顾问协商后，我们决定应将缪斯神庙的馆藏迁移到[GetProvince('(int32)3360').GetName]——成本会很大，但回报会更大。"
 cyrene_1_intoegypt_task_9:0 "埃及之角"
 cyrene_1_intoegypt_task_9_DESC:0 "埃及拥有得天独厚的天然防御工事，我们可以加以改进；这是我们绝对应该做的。通过加强[GetProvince('(int32)509').GetName]的堡垒，我们将保护进入我们新领土的陆路通道。命令这样做，同时扩大[GetProvince('(int32)3378').GetName]的市场。"
 cyrene_1_intoegypt_task_final:0 "托勒密的梦想破灭了"
 cyrene_1_intoegypt_task_final_DESC:0 "托勒密，这条背信弃义的臭狗，单方面自立为埃及的巴西琉斯，对他的形同手足的继业者们发动贪婪的征服战争，他统治埃及王国的梦想破灭了；这是一个正确的结局，无疑是他应得的。当黑暗和阴影覆盖托勒密政权的所有遗迹时，太阳，就像光辉的阿吞神一样，在胜利的昔兰尼加人身上升起！"
 cyrene_1_magas:0 "女王的长子"
 cyrene_1_magas_BUTTON_TOOLTIP:0 "将昔兰尼加建立为一个独立的王国"
 cyrene_1_magas_CRITERIA_DESCRIPTION:0 "当我们解决了埃及人的霸权问题，并且昔兰尼加重新确立了其作为一个独立王国的地位时，这项使命才算完成。"
 cyrene_1_magas_DESCRIPTION:0 "在无情的利比亚沙漠中，有着茂盛平原和葱郁森林的昔兰尼加之土无疑是一片绿洲。\n\n正是这种丰富的资源在三百年前吸引了来自锡拉岛的希腊定居者，他们建立了昔兰尼加的五个城市：昔兰尼、陶刻拉、欧厄斯佩里得斯、贝拉革拉和巴耳刻。这五座城市让昔兰尼加得到了两个名字：蓬塔波利斯，即“五城”，或昔兰尼加，即“昔兰尼人之地”，以五城之首命名。建立昔兰尼的领袖以利比亚人之名“巴图斯”为己之名，他的世系将作为昔兰尼加的国王进行统治，直到这个王国被不断扩张的波斯帝国攻陷。\n\n在巴图斯家族的统治下，年轻的昔兰尼加殖民地逐渐成为希腊世界最重要的学习中心之一，其医学院和哲学学院有时能与雅典本身相媲美。与克里特岛和伯罗奔尼撒的希腊城市之间的繁荣贸易不仅带来了大量的财富，而且还带来了越来越多的来自希腊世界的新定居者。\n\n但很快，来自锡拉的原始定居者、其他希腊人和当地的利比亚人之间的关系开始变得紧张。因此，在建城历约200年左右（约公元前550年），当时的昔兰尼加国王巴图斯三世，为了稳定他的王国，实行了宪法改革，大大限制了国王的权力，而组建了选举产生的元老院。巴图斯三世的继任者们对这种走向共和的做法非常反感，这导致了一系列的内战。当其父阿基劳斯三世最终被谋杀时，巴图斯三世的孙子巴图斯四世为了确保他的旧有权利，邀请了波斯的军队。\n\n然而，臣服于波斯人并不能挽救巴图斯王朝。在公元前313年（公元前440年），巴蒂德四世的继任者阿基劳斯四世也同样被自己的公民所杀害，这次取代他的不是另一个巴图斯统治者，而是由波斯皇帝任命的总督。\n\n因此，昔兰尼加王国走到了尽头，首先被波斯人的统治所取代，然后是对其征服者亚历山大大帝和最终他在埃及的继任者“救主”托勒密一世的臣服。托勒密将昔兰尼加交给了俄斐拉斯，一个参加过亚历山大印度战役的老兵。然而，俄斐拉斯在入侵迦太基时被自己的盟友出卖而被杀害。俄斐拉斯的死使昔兰尼加没有一个正式的统治者，在形式上仍然是埃及的一部分，但事实上是独立的。然而，这种情况不太可能持续很久——可以肯定的是，托勒密王朝将很快任命一位新的总督。"
 cyrene_1_magas_task_1:0 "昔兰尼加的总督"
 cyrene_1_magas_task_1.tt:0 "#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!将在#Y [GetProvince('(int32)3353').GetArea.GetRegion.GetName]#!任命一个新的州长。"
 cyrene_1_magas_task_10:0 "外国朋友"
 cyrene_1_magas_task_10.tt:0 "任一在#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 外交范围内的国家的统治者与#Y [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]#!是朋友。"
 cyrene_1_magas_task_10_DESC:0 "如果我们能与一位外国统治者成为朋友，我们在国内外的地位将大大提升--我们应该加倍努力寻找一位知己，一位值得了解[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的思想的人。"
 cyrene_1_magas_task_11:0 "埃及法院的朋友"
 cyrene_1_magas_task_11.tt:0 "在#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!中，任一没有王位宣称的男性角色是#Y [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]#!的朋友。"
 cyrene_1_magas_task_11_DESC:0 "我们必须尽可能多地拥有朋友，特别是考虑到我们以某种方式获得了众多的敌人，这一点非常重要。通过在埃及宫廷中的嗅探，我们也许能找到一个愿意分享秘密的朋友，这是很低调的..."
 cyrene_1_magas_task_12:0 "东昔兰尼加的总督"
 cyrene_1_magas_task_12.tt:0 "在#Y [GetProvince('(int32)3353').GetArea.GetRegion.GetName]#! #Y 中的[GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!总督拥有#Y 受教唆的不忠#! 修正。"
 cyrene_1_magas_task_12_DESC:0 "我们在埃及宫廷的朋友向我们透露，东昔兰尼加的总督是个受贿者，如果价格合适，他愿意忘记他们对亚历山大的忠诚誓言。如果我们帮助促成这种不忠的行为，我们就会得到好处。"
 cyrene_1_magas_task_13:0 "托勒密之死"
 cyrene_1_magas_task_13.tt:0 "#Y [GetCharacter('(int32)42').GetName]#! 已经死亡。"
 cyrene_1_magas_task_13_DESC:0 "继承并不总是顺利的事情，明智的人应该利用统治者死亡后的混乱。一旦[GetCharacter('(int32)42').GetName]从这个世界进入下一个世界，我们的计划制定的时机就会成熟。"
 cyrene_1_magas_task_14:0 "聚焦昔兰尼加"
 cyrene_1_magas_task_14.tt:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]将暂时专注于确立自己在昔兰尼加的统治地位。"
 cyrene_1_magas_task_14_DESC:0 "通过投资于我们的昔兰尼加省，我们将加强我们统治者的合法性，在我们的人民心中牢固确立我们的统治权。"
 cyrene_1_magas_task_15:0 "掌控外交事务"
 cyrene_1_magas_task_15.tt:0 "#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!对#Y [SCOPE.GetRootScope.GetCountry.GetName]#!有至少75的意见。"
 cyrene_1_magas_task_15_A.tt:0 "不是#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!或其附庸国的#Y 2#!个国家对#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y 40#!好感度。"
 cyrene_1_magas_task_15_B.tt:0 "停止成为#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!的#Y 藩属#!并脱离他们目前所领导的任何战争。"
 cyrene_1_magas_task_15_DESC:0 "鼓吹战争的托勒密王朝已经在昔兰尼加造成了足够多的苦难和痛苦，我们已经决定，够了。向亚历山大城传话，我们不认为他们再能掌管我们的外交事务了。"
 cyrene_1_magas_task_16:0 "大使馆对外国法院"
 cyrene_1_magas_task_16.tt:0 "扩大我们对盟友的搜寻范围"
 cyrene_1_magas_task_16_DESC:0 "任何有心人都知道会发生什么；昔兰尼加很快就会成为她自己命运的主人。让我们利用我们的外交网络，看看有没有人愿意在军事上支持我们。"
 cyrene_1_magas_task_17:0 "雇用利比亚雇佣兵"
 cyrene_1_magas_task_17.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]已经与利比亚当地人形成#G 友好关系#! 。"
 cyrene_1_magas_task_17_A.tt:0 "至少#Y 2#!块以#Y [GetCulture('libyan').GetName|Y]#!文化为主导的领土拥有#Y 兵营#!建筑。"
 cyrene_1_magas_task_17_B.tt:0 "招募#Y [GetCulture('libyan').GetName|Y]#!雇佣兵。"
 cyrene_1_magas_task_17_DESC:0 "我们比大多数人更清楚，利比亚人是凶猛的战士。我们应该派一个使者到各部落去，看看能不能召集一些雇佣兵；我们指挥的长矛越多，我们的前景就越好。"
 cyrene_1_magas_task_17_c.tt:0 "#G 与利比亚人关系良好。#!"
 cyrene_1_magas_task_18:0 "婚姻联盟"
 cyrene_1_magas_task_18.tt:0 "#Y 我们将寻找一个愿意支持我们独立的国家。#!"
 cyrene_1_magas_task_18_B.tt:0 "任何 #Y 希腊#! 君主国，只要不与 #Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]! 结盟，并且拥有超过 #Y 50#! 领地，则其对 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感至少为 #Y 75#!。"
 cyrene_1_magas_task_18_DESC:0 "婚姻的纽带可以将我们的命运与更大的势力联系在一起；让我们通过与希腊化的势力结盟来确保我们继续生存。如果成功的话，我们几乎就可以挑战托勒密家族了。"
 cyrene_1_magas_task_19:0 "准备好防御措施"
 cyrene_1_magas_task_19.tt:0 "#Y [GetProvince('(int32)3360').GetArea.GetName]#!行省至少拥有#Y 1#!座要塞建筑。"
 cyrene_1_magas_task_19_DESC:0 "虽然我们对我们的战斗人员充满信心，但只有傻瓜才会忽视我们的防御工事。发出消息，我们在小佩特拉的堡垒应该得到加强，并告诉守军准备开战--时机几乎已经来临。"
 cyrene_1_magas_task_1_DESC:0 "自从俄斐拉斯死于叙拉古人之手后，昔兰尼加一直处于政治真空状态。我们应该向埃及人申请一个新的总督。"
 cyrene_1_magas_task_2:0 "巩固对昔兰尼的控制"
 cyrene_1_magas_task_2.tt:0 "所有担任职务的人物都至少有#Y 60#! 的忠诚度。"
 cyrene_1_magas_task_20:0 "穿越沙漠前进"
 cyrene_1_magas_task_20.tt:0 "#Y [GetCountry('CYR').GetCapital.GetArea.GetName]#! 省至少有#Y 2只骆驼#!@camel!或#Y 马匹#!@horses!的剩余。"
 cyrene_1_magas_task_20_DESC:0 "通过迅速行动，我们的军队将能让托勒密人措手不及--我们当然可以利用惊喜的因素。在我们把我们的人送进沙漠走向荣耀之前，确保我们有足够的骆驼和马匹。"
 cyrene_1_magas_task_21:0 "独立战争"
 cyrene_1_magas_task_21.tt:0 "停止成为#Y [GetCountry('EGY').GetName]#!@[GetCountry('EGY').GetFlag]!的附属国。"
 cyrene_1_magas_task_21_DESC:0 "真理的时刻终于来临了；经过几个月的稳步准备，为我们的自由而战的时候到了。告诉亚历山大城的伪君子，昔兰尼加人是一个自由的民族，不屈服于任何人！"
 cyrene_1_magas_task_2_DESC:0 "一个巨大的重要的东西；忠诚度。因为如果我们赖以生存的基础已经烂到了极点，我们怎么能梦想着扩张呢？我们已经提供了捐款，做出了承诺，提醒我们的官僚们注意他们的位置--我们现在可以放心了，我们得到了我们雇用的人的全力支持。"
 cyrene_1_magas_task_3:0 "利比亚问题"
 cyrene_1_magas_task_3.tt:0 "#Y 我们将决定如何对待国内的利比亚人。#! #R 站边希腊人肯定会激怒利比亚人，但可能会带来其他机会。#!"
 cyrene_1_magas_task_3_DESC:0 "希腊定居者和利比亚本地居民之间的紧张关系正达到沸点--我们必须尽早解决这个问题，否则我们将有一个更大的问题。"
 cyrene_1_magas_task_4:0 "利比亚人的共存"
 cyrene_1_magas_task_4.tt:0 "[GetCulture('libyan').GetName|Y]文化已获#Y 整合#!或享有#Y 通婚权#!。"
 cyrene_1_magas_task_4_DESC:0 "利比亚人虽然可能无法与希腊人平起平坐，但他们是一个优秀的民族，尽管有一些明显的缺陷。为什么不给予他们更多的权利呢？这将确保我们民族之间的长久和平。"
 cyrene_1_magas_task_5:0 "安抚突袭者"
 cyrene_1_magas_task_5.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]将与利比亚当地人形成#G 友好关系#! 。"
 cyrene_1_magas_task_5_DESC:0 "那些可恶的利比亚突袭者在我们的省份造成了很多麻烦，我们已经决定，够了。发出消息，立即处理这些野蛮人!我们没有时间把突袭者赶回沙漠中。"
 cyrene_1_magas_task_5_b.tt:0 "#Y [GetProvince('(int32)3360').GetArea.GetName]#!，#Y [GetProvince('(int32)3352').GetArea.GetName]#!，#Y [GetProvince('(int32)3341').GetArea.GetName]#!和#Y [GetProvince('(int32)3367').GetArea.GetName]#!的省份拥有#Y 文明开化#!的总督政策。"
 cyrene_1_magas_task_5_c.tt:0 "#Y [GetProvince('(int32)5993').GetName]#!的不可通行地形没有#R 野蛮人堡垒#!或至少#Y 2#!的邻近领土有#Y 30#!或更多的#Y 文明度#!。"
 cyrene_1_magas_task_6:0 "希腊的统治地位"
 cyrene_1_magas_task_6.tt:0 "该#Y [GetCulture('libyan').GetName|Y]#! 文化有#Y 奴隶#!@slaves!或#! #Y 部落民#!@tribesmen!权利。"
 cyrene_1_magas_task_6_B.tt:0 "#Y [GetProvince('(int32)3352').GetArea.GetRegion.GetName]#! 地区的任何省份都有#Y 宗教转换#! 或#Y 文化同化#! 的省长政策。"
 cyrene_1_magas_task_6_DESC:0 "利比亚的当地人，与希腊定居者生活在一起，开始认为自己是平等的，我们都知道这是一个危险的谎言。我们需要让他们的社会地位成为国家政策的一部分，以免我们处理不可预知的后果。"
 cyrene_1_magas_task_7:0 "利比亚战争"
 cyrene_1_magas_task_7.tt:0 "#R 利比亚人将为维护他们的权利而战。我们将有机会站在他们一边对抗希腊人。#!"
 cyrene_1_magas_task_7_DESC:0 "愚蠢的利比亚人已经决定与希腊人作战，居然觉得彻底毁灭比奴役更可取。很好，那么——我们将给他们带来他们如此迫切渴望的死亡。\n\n然而，虽然看起来很牵强，但也许利比亚人会解开他们的枷锁......"
 cyrene_1_magas_task_8:0 "贝勒尼基女王"
 cyrene_1_magas_task_8.tt:0 "#G 我们将可以选择如何使用[GetCharacter('(int32)18').GetFirstName]支持。#!"
 cyrene_1_magas_task_8_A.tt:0 "#Y [GetCountry('CYR').GetRuler.GetName]#!与#Y [GetCharacter('(int32)18').GetName]#!是朋友"
 cyrene_1_magas_task_8_DESC:0 "[GetCharacter('(int32)18').GetFirstName]，愿众神保护她，她一直对我们很好，在别人不喜欢的时候对我们示好。如果我们成为快速的朋友，我们可以考虑请求她的帮助。"
 cyrene_1_magas_task_9:0 "担任阿波罗的祭司职务"
 cyrene_1_magas_task_9.tt:0 "#Y [GetOffice('office_high_priest_monarchy').GetCulturalName(SCOPE.GetRootScope.GetCountry)]#! 至少有#Y 85#! 的忠诚度，至少有#Y 6#! 的热情@religious_icon!。"
 cyrene_1_magas_task_9_A.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]最近#Y 赞助了艺术#!。"
 cyrene_1_magas_task_9_DESC:0 "众所周知，昔兰尼加人是一个虔诚的民族，受到许多神的喜爱，阿波罗一直与我们心心相印。如果我们能宣称获得菲比斯神职的衣钵，那将是一个巨大的荣誉。"
 cyrene_1_magas_task_independence_final:0 "昔兰尼的国王"
 cyrene_1_magas_task_independence_final_DESC:0 "虽然没有人能够预料到所发生的一切，但相信的人从未怀疑过结果；昔兰尼加已经打败了托勒密军队，彻底甩掉了奴隶制的桎梏。现在是为凯里尼亚的新国王加冕的时候了。"
 cyrene_1_ophellas:0 "为俄斐拉斯复仇"
 cyrene_1_ophellas_BUTTON_TOOLTIP:0 "入侵迦太基并惩罚叙拉古人"
 cyrene_1_ophellas_CRITERIA_DESCRIPTION:0 "当俄斐拉斯在迦太基的征服得到恢复，叙拉古人的背叛得到惩罚，这项使命才算完成。"
 cyrene_1_ophellas_DESCRIPTION:0 "多年前，在罗马历444年（公元前309年），[GetCountry('SYR').GetName]的僭主[GetCharacter('(int32)56').GetFullName]找到了昔兰尼加的统治者俄斐拉斯，要求联合入侵[GetCountry('CAR').GetName]。根据这个联盟的条款，叙拉古将获得对迦太基在西西里岛的财产的控制权，而我们将保留在非洲的任何被征服的领土。\n\n在一支由叙拉古人和来自希腊本土的冒险家组成的混合军队的带领下，俄斐拉斯在利比亚沙漠中一路奋战，在此过程中夺取了大片迦太基的领土。然而，当他最终与阿伽托克勒斯的军队会合时，他遭到了背叛。\n\n叙拉古人在最初友好地接待了俄斐拉斯后，把矛头转向了自己的盟友，攻击了俄斐拉斯疲惫不堪的军队，最终杀死了俄斐拉斯本人。之后，俄斐拉斯的入侵部队所剩无几，被并入[GetCharacter('(int32)56').GetFirstName]的军队。\n\n阿伽托克勒斯的背叛使昔兰尼加失去了新征服的西部属地，使其政府陷入混乱和内战。尽管叙拉古人自己最终也被迫在失败中溜回西西里，但昔兰尼加从未忘记他们的背叛。"
 cyrene_1_ophellas_task_1:0 "打击迦太基"
 cyrene_1_ophellas_task_1.tt:0 "#Y [GetCountry('CAR').GetName]#!@[GetCountry('CAR').GetFlag]!对#Y [SCOPE.GetRootScope.GetCountry.GetName]#!有#R -50#!或以下的好感。"
 cyrene_1_ophellas_task_10:0 "对叙拉古的报复"
 cyrene_1_ophellas_task_10.tt:0 "[GetProvince('(int32)84').GetOwner.GetName|Y]最近受到了侮辱。"
 cyrene_1_ophellas_task_10_DESC:0 "在公元前444年（公元前309年），[GetCountry('SYR').GetName]的僭主[GetCharacter('(int32)56').GetFullName]说服了当时的昔兰尼加统治者俄斐拉斯，与他一起入侵迦太基。然而，在这次战役中，[GetCharacter('(int32)56').GetFirstName]背叛了俄斐拉斯，导致他死在[GetCharacter('(int32)56').GetFullName]的军队手中。我们不能让这种令人发指的罪行免受惩罚。"
 cyrene_1_ophellas_task_11:0 "构建入侵舰队"
 cyrene_1_ophellas_task_11_DESC:0 "我们在昔兰尼加的土地与西西里岛的叙拉古城之间隔着许多英里的公海。一支强大的舰队将是支持我们惩罚性驱逐的必要条件。"
 cyrene_1_ophellas_task_12:0 "购买重型舰艇"
 cyrene_1_ophellas_task_12.tt:0 "凡是在#Y 、#! 或[GetProvince('(int32)84').GetArea.GetRegion.GetName|Y]地区拥有至少[GetProvince('(int32)427').GetArea.GetRegion.GetName|Y]10[GetProvince('(int32)266').GetArea.GetRegion.GetName|Y]个城市的首都与港口建筑的国家，都对#Y 有至少#! 30[SCOPE.GetRootScope.GetCountry.GetName]种看法。"
 cyrene_1_ophellas_task_12_DESC:0 "昔兰尼加虽然土地肥沃，但适合建造大型战舰的木材很少。幸运的是，我们不需要建造自己的船只。有许多希腊城市愿意以合适的价格借给我们使用他们的船工。"
 cyrene_1_ophellas_task_13:0 "准备惩罚性的远征"
 cyrene_1_ophellas_task_13_DESC:0 "现在是为我们对叙拉古的惩罚性远征做最后准备的时候了。"
 cyrene_1_ophellas_task_14:0 "叙拉古的命运"
 cyrene_1_ophellas_task_14.tt:0 "#Y 叙拉古#! 没有土地。"
 cyrene_1_ophellas_task_14.ttt:0 "决定了[GetProvince('(int32)84').GetName|Y]的命运。"
 cyrene_1_ophellas_task_14_DESC:0 "现在，叙拉古已在我们手中，我们必须决定该城的命运。"
 cyrene_1_ophellas_task_15:0 "西西里岛的仆从国"
 cyrene_1_ophellas_task_15.tt:0 "#Y 西西里岛上的所有自有领土将被释放，并独立成为[SCOPE.GetRootScope.GetCountry.GetName]的附属国。#!"
 cyrene_1_ophellas_task_15_DESC:0 "当我们的军队第一次踏上西西里岛的土地时，是为了惩罚叙拉古的背叛行为。现在，叙拉古被适当地羞辱了，我们发现自己在我们势力范围的边缘拥有了相当大的一块土地。由于我们的目的从来都不是要征服西西里，因此，将被征服的土地重组为一个新的国家，在我们的保护下，也许是明智的。"
 cyrene_1_ophellas_task_16:0 "最西边的省份"
 cyrene_1_ophellas_task_16.tt.fail:0 "[cyr_sicily_owned_province_scope.GetName] #Y [SCOPE.sP('lilybaeum_province').GetName]#! 拥有#Y [SCOPE.ScriptValue('cyr_combined_finesse_and_martial')|0]#! 或更高的人口（#Y [SCOPE.ScriptValue('cyr_combined_finesse_and_martial_target')|0]#!/#Y [GetProvince('(int32)84').GetState.GetGovernorOrRuler.GetName.ScriptValue('cyr_combined_finesse_and_martial')|0]#!）。"
 cyrene_1_ophellas_task_16_A.tt:0 "在[GetProvince('(int32)84').GetArea.GetName|Y]，[GetProvince('(int32)80').GetName|Y]或[GetProvince('(int32)94').GetName|Y]省份中，至少#Y 5#!块领土上有#Y 3#!座#Y 法院#!，且没有正在进行的建设。"
 cyrene_1_ophellas_task_16_B.tt:0 "[GetProvince('(int32)84').GetArea.GetRegion.GetName|Y]总督的#Y 军略#!@military_icon!和#Y 智略#!@civic_icon!都至少有#Y 14#!点。"
 cyrene_1_ophellas_task_16_DESC:0 "虽然我们远征西西里的目的是为了惩罚叙拉古人，但我们现在控制的这块西西里将作为一个完美的行动基地，以扩展到西西里丰富而肥沃的土地。直接控制这个不安分的地区，需要一个熟练的总督和对当地行政基础设施的大量投资。"
 cyrene_1_ophellas_task_17:0 "希腊在的黎波里塔尼亚的殖民地"
 cyrene_1_ophellas_task_17.tt:0 "[GetProvince('(int32)3201').GetName|Y]领土有[GetDeityDefinition('omen_athena_tritogeneia').GetName|Y]的圣地。"
 cyrene_1_ophellas_task_17_DESC:0 "为了继续我们的发展，在任何地方资助殖民地都符合我们的最大利益，的黎波里塔尼亚与其他地方没有什么不同。"
 cyrene_1_ophellas_task_1_DESC:0 "建城历444年（公元前309年），俄斐拉斯对迦太基的入侵因叙拉古的僭主阿伽托克勒斯的背叛而中断。俄斐拉斯之死使昔兰尼加陷入混乱，但现在国内局势再次稳定，是时候继续俄斐拉斯留下的工作了。"
 cyrene_1_ophellas_task_2:0 "准备补给线"
 cyrene_1_ophellas_task_2.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 巴尔卡#!和#Y 叙耳提卡#!省份的领土上至少有#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_2_buildings_total')|0]#!个建筑物。[SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_2_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_2_construction_loc')]"
 cyrene_1_ophellas_task_2_DESC:0 "穿越利比亚沙漠的道路是艰辛的。它给俄斐拉斯的入侵部队带来的疲惫无疑是远征军灭亡的原因。如果我们要追随他的脚步，我们应该确保我们有基础设施来保持我们的部队有良好的供应。"
 cyrene_1_ophellas_task_2_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('cyrene_1_ophellas_task_2_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_2_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_2_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_2_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_2_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_2_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y Barka#! 和#Y Syrtica#!省有正在进行的建设。"
 cyrene_1_ophellas_task_3:0 "招募希腊冒险家"
 cyrene_1_ophellas_task_3.tt:0 "任何拥有少于#Y 3#!个领土的国家，如果其首都在#Y 希腊#!、#Y 亚洲#!或#Y 大希腊#!地区，属于#Y 希腊#! 文化组，至少有#Y 25#![SCOPE.GetRootScope.GetCountry.GetName]好感度。"
 cyrene_1_ophellas_task_3_A.tt:0 "向相关国家发出要约，成为我们的#Y 主体#!。"
 cyrene_1_ophellas_task_3_DESC:0 "当俄斐拉斯第一次入侵迦太基时，他从他妻子[GetCharacter('(int32)17').GetFirstName]的家乡募集了一支军队。[GetCharacter('(int32)17').GetFirstName]后来离开了昔兰尼加与[GetCharacter('(int32)38').GetFullName]结婚，但希腊的城市仍然充满了冒险的灵魂，如果我们答应他们在我们的新征服地定居的权利，他们可以被说服为我们而战。"
 cyrene_1_ophellas_task_4:0 "入侵的黎波里塔尼亚"
 cyrene_1_ophellas_task_4_DESC:0 "一切准备就绪，我们对迦太基的入侵已经可以开始。首先，我们必须确保控制的黎波里塔尼亚的迦太基盟友。"
 cyrene_1_ophellas_task_5:0 "在的黎波里塔尼亚建立殖民地"
 cyrene_1_ophellas_task_5_A.tt:0 "#Y [GetProvince('(int32)3325').GetArea.GetName]#!省份中至少#Y 1#!块我方拥有的领土满足以下条件：\n*人口大于#Y 15#!\n*拥有城市地位\n*拥有#Y 港口#!建筑\n*没有正在进行的建设"
 cyrene_1_ophellas_task_5_B.tt:0 "#Y [GetProvince('(int32)3296').GetArea.GetName]#!省份中至少#Y 1#!块我方拥有的领土满足以下条件：\n*人口大于#Y 15#!\n*拥有城市地位\n*拥有#Y 港口#!建筑\n*没有正在进行的建设"
 cyrene_1_ophellas_task_5_DESC:0 "虽然我们已经控制了西部的新属地，但他们的人口仍然对迦太基怀有强烈的同情心。通过在整个的黎波里塔尼亚建立希腊殖民地，我们可以开始建立一个当地的权力基地，确保我们对该地区的控制。"
 cyrene_1_ophellas_task_6:0 "斯巴达的失落殖民地"
 cyrene_1_ophellas_task_6_A.tt:0 "#Y [GetCountry('SPA').GetName]#! @[GetCountry('SPA').GetFlag]!至少有#Y 100#! 对#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的意见。"
 cyrene_1_ophellas_task_6_B.tt:0 "在#Y [GetProvince('(int32)3324').GetName]#!或#Y [GetProvince('(int32)3306').GetName]#!境内安置#Y 斯巴达#!殖民者。"
 cyrene_1_ophellas_task_6_DESC:0 "很久以前，斯巴达人试图在的黎波里塔尼亚的辛普斯河附近建立一个殖民地，但失败了。现在这个地区在我们的控制之下，我们也许可以说服他们再次尝试。"
 cyrene_1_ophellas_task_7:0 "迦太基的心脏"
 cyrene_1_ophellas_task_7_DESC:0 "的黎波里塔尼亚既已臣服，此刻正是我们直捣布匿世界核心的良机——剑指富庶的阿非利加诸城，乃至迦太基本城。"
 cyrene_1_ophellas_task_8:0 "将布匿的城市希腊化"
 cyrene_1_ophellas_task_8.tt:0 "#Y 大量国家文化人口将定居阿非利加地区。#!"
 cyrene_1_ophellas_task_8.ttt:0 "#Y 非洲的每座城市获得$cyr_aggressive_hellenisation$#!"
 cyrene_1_ophellas_task_8_A.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 阿非利加#!地区的领土上至少有#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_8_buildings_total')|0]#!#Y 大神殿#!或#Y 大剧院#!。[SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_8_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_8_construction_loc')]"
 cyrene_1_ophellas_task_8_B.tt:0 "[GetCulture('carthaginian').GetName|Y]文化有#Y 奴隶#! 的权利"
 cyrene_1_ophellas_task_8_DESC:0 "只要非洲的城市仍然是布匿的，我们就永远无法将它们真正融入我们的帝国。只有压制布匿文化，促进该地区的希腊化，我们的新征服才能得到保障。"
 cyrene_1_ophellas_task_8_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('cyrene_1_ophellas_task_8_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_8_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_8_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_8_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_8_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_8_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 阿非利加#!区域有正在进行的建设。"
 cyrene_1_ophellas_task_9:0 "整合布匿人的管理"
 cyrene_1_ophellas_task_9.tt:0 "#Y 解锁布匿军事传统#!"
 cyrene_1_ophellas_task_9_A.tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 阿非利加#!地区的领土上至少有#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_9_buildings_total')|0]#!#Y 法院#!。 [SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_9_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('cyrene_1_ophellas_task_8_construction_loc')]"
 cyrene_1_ophellas_task_9_DESC:0 "迦太基人的数量和他们的财富一样多。我们最好能确保他们的管理顺利过渡到我们自己的管理。"
 cyrene_1_ophellas_task_9_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('cyrene_1_ophellas_task_9_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_9_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_9_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_9_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('cyrene_1_ophellas_task_9_buildings_total')|0]#!)"
 cyrene_1_ophellas_task_final:0 "俄斐拉斯野望得竟"
 cyrene_1_ophellas_task_final_DESC:0 "迦太基被征服，叙拉古被惩罚，俄斐拉斯的阴影如今终得安息。"
 cyrene_1_reform:0 "五城政治"
 cyrene_1_reform_BUTTON_TOOLTIP:0 "改革昔兰尼加政府"
 cyrene_1_reform_CRITERIA_DESCRIPTION:0 "当昔兰尼加对其政府理念进行改革时，这项任务将被视为完成。"
 cyrene_1_reform_DESCRIPTION:0 "在经历了几个世纪的统治者被遥远的国王命令强加之后，希腊的昔兰尼加城市终于再次有了自己的国王。  然而，昔兰尼加的新君主本身就是外国人，他们在马其顿军队的帮助下夺取了凯里尼亚的王位。在许多塞浦路斯人眼中，这使他们与之前的一连串外国统治者没有什么区别。\如果目前的统治者想保住他们的权力，他们就必须在公民眼中使他们的统治合法化；要么接受当地的习俗，借鉴前波斯王国的昔日记忆，要么按照塞琉西和托勒密的方式将自己打造成希腊化的国王。否则，他们可能很快就会发现自己被一种更具包容性的政府形式所取代。"
 cyrene_1_reform_task_1:0 "新时代的曙光"
 cyrene_1_reform_task_10:0 "组建一支皇家军队"
 cyrene_1_reform_task_10_DESC:0 "亚历山大的继任者通过其个人军队的权威进行统治。如果[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]有一支自己的私人军队，那么其他国家要挑战他的权威就会困难得多。"
 cyrene_1_reform_task_11:0 "驱逐外国国王"
 cyrene_1_reform_task_11.tt:0 "国内#R 共和派#!支持度必须足够高。"
 cyrene_1_reform_task_11_DESC:0 "国王和僭主的时代已经过去。昔兰尼加将扔掉君主制的枷锁，把权力还给它的公民！……至少是那些有资格行使权力的人。"
 cyrene_1_reform_task_12:0 "德莫纳克斯的愿景"
 cyrene_1_reform_task_12_DESC:0 "在昔兰尼加第一个王国的衰落时期，伟大的立法者德莫纳克斯为昔兰尼加写了一部宪法。在德莫纳克斯的统治下，君主的权力被严格限制，以至于国王只是一个傀儡而已。显然，德莫纳克斯的想法是正确的--现在是我们恢复他的宪法的时候了。"
 cyrene_1_reform_task_13:0 "复兴的王国"
 cyrene_1_reform_task_13_DESC:0 "一百年来，昔兰尼加的国王们以绝对的权威进行统治，在他们统治期间，昔兰尼加强大而独立。只是在第五位国王巴图斯三世将他的大部分权力交给他的下属后，王国才被内乱所吞噬；最终导致它被波斯人吞并。我们不会重蹈巴图斯三世的覆辙，赛里亚国王必须以绝对的权威来统治!"
 cyrene_1_reform_task_14:0 "一个继业者国王"
 cyrene_1_reform_task_14.tt:0 "国内#G 保皇派#!支持度必须足够高。"
 cyrene_1_reform_task_14_DESC:0 "尽管[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]统治着昔兰尼加，但他首先是亚历山大的继业者之一。昔兰尼加将成为[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]用来夺取亚历山大帝国版图的根基之地。"
 cyrene_1_reform_task_1_DESC:0 "由巴图斯一世和他的泰兰殖民者建立的第一个昔兰尼加王国，因为王室应该拥有多大的权力而分崩离析，最终走向终结。现在，一个新的王朝已经取代了巴图斯的位置，昔兰尼加再次处于一个十字路口。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFamily.GetName]们将会保守他们的权力，作为绝对的国王进行统治，还是通过与他们的下级分享一些权力来赢得他们的臣民的信任？他们甚至可能看到自己被完全取代......"
 cyrene_1_reform_task_2:0 "游览五城"
 cyrene_1_reform_task_2_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]可能是昔兰尼加无可争议的统治者，但许多人除了知道他的名字之外，对他所知甚少。对昔兰尼加乡村的广泛巡视可以确保[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的臣民承认他是真正的国王。"
 cyrene_1_reform_task_3:0 "最后的巴蒂亚德"
 cyrene_1_reform_task_3.tt:0 "在#Y 昔兰尼加区域#! 所有拥有的省份都获得了#Y 地方议会#!。"
 cyrene_1_reform_task_3_DESC:0 "300多年前，巴图斯一世带领一群定居者从爱琴海的[GetProvince('(int32)454').GetName]岛来到利比亚的海岸，在那里建立了[GetProvince('(int32)3360').GetName]城。巴图斯成为昔兰尼加的第一位国王，他建立的王朝--巴蒂亚德王朝，在屈服于内部动乱和波斯人的扩张主义之前，将继续统治两个世纪。虽然巴蒂亚德家族失去了王位，但他们的许多后裔继续担任重要职务……"
 cyrene_1_reform_task_4:0 "赋予地方议会权力"
 cyrene_1_reform_task_4_DESC:0 "昔兰尼加的每个城市都有自己的地方议会，决定太不重要--或太紧急--而无法提交给国王的事务。在昔兰尼加，许多人要求扩大这些议会的权力并使之正规化。然而，这可能会开创一个非常危险的先例......"
 cyrene_1_reform_task_5:0 "昔兰尼加的三个部落"
 cyrene_1_reform_task_5.tt:0 "在#Y 希腊文化组#!中的每一个其他外国文化都获得了#Y $cyr_three_tribes$#!。\n\n"
 cyrene_1_reform_task_5_DESC:0 "很久以前，希腊立法者德莫纳克斯将昔兰尼加的公民分为三个部落：0来自色拉岛的希腊人，来自伯罗奔尼撒和克里特的希腊人，以及来自其他爱琴海岛屿的希腊人。在当时，这有效地平息了笼罩在昔兰尼加的动乱。恢复这一古老的规则可以帮助我们更好地组织生活在我们境内的不同人群。"
 cyrene_1_reform_task_6:0 "点缀五城"
 cyrene_1_reform_task_6_DESC:0 "昔兰尼加以其五个城市而闻名：昔兰尼、巴尔克、陶切拉、欧斯佩里德斯和阿波罗尼亚。由于凯里纳是昔兰尼加君主制的所在地，其他四个城市有时会被忽视。对这些城市的重大投资将被视为皇室仁慈的强烈信号，尽管这意味着将大量资源投入到不直接受皇室控制的地方。"
 cyrene_1_reform_task_7:0 "铸造皇家钱币"
 cyrene_1_reform_task_7_DESC:0 "按照传统，国王在登基后开始铸造带有他们形象的硬币。这不仅使钱币更难伪造，而且还实现了一个非常重要的功能，即让国王出现在臣民的日常生活中。"
 cyrene_1_reform_task_8:0 "扩建皇城"
 cyrene_1_reform_task_8_DESC:0 "[GetProvince('(int32)3360').GetName]是昔兰尼加最古老的城市，长期以来一直是昔兰尼加的王权中心。这使得[GetProvince('(int32)3360').GetName]几乎成为国王权力的代名词。在[GetProvince('(int32)3360').GetName]的一系列宏伟的建筑工程将直接反映出君主制的辉煌。"
 cyrene_1_reform_task_9:0 "沿海的权力基地"
 cyrene_1_reform_task_9_DESC:0 "[GetProvince('(int32)3360').GetName]的希腊化新统治者的权威在沿海地区最为强大，因为那里的船只可以将昔兰尼加与希腊的故乡连接起来。然而，昔兰尼加的几个传统权力中心却远离海岸，在肥沃的高原上与利比亚沙漠接壤。一系列的新城市可以将昔兰尼加的经济中心移到离海岸更近的地方，这样我们就更容易控制。"
 cyrene_1_reform_task_final_authocracy:0 "王室权利得到维护"
 cyrene_1_reform_task_final_authocracy.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]根据#Y 保皇派#!的支持程度，获得#G 合法性#! 。"
 cyrene_1_reform_task_final_authocracy_DESC:0 "所有不同的声音都被粉碎了，国王的权力得到了彻底的展示。现在，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]和他的王室王朝的权威是毫无疑问的。"
 cyrene_1_reform_task_final_democracy:0 "自由的保障"
 cyrene_1_reform_task_final_democracy.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName]根据#Y 共和派#!的支持程度，失去#R 暴政#! 。"
 cyrene_1_reform_task_final_democracy_DESC:0 "现在，昔兰尼加公民的权利得到了保障，君主制的权力得到了削弱，昔兰尼加已经成为其他爱好自由的国家效仿的典范。"
 cyrene_1_thera:0 "爱琴海的统治地位"
 cyrene_1_thera_BUTTON_TOOLTIP:0 "扩张到克里特岛，发展爱琴海的特拉岛。"
 cyrene_1_thera_CRITERIA_DESCRIPTION:0 "当我们控制了克里特岛，将[GetProvince('(int32)454').GetName]发展成一个繁荣的城市，并肯定了我们在爱琴海的统治地位，这项任务才算完成。"
 cyrene_1_thera_DESCRIPTION:0 "几个世纪前，来自爱琴海[GetProvince('(int32)454').GetName]岛的定居者为了逃避家乡的严重饥荒，建立了[GetProvince('(int32)3360').GetName]，这个城市的名字就来源于Cyrenaica。虽然[GetProvince('(int32)3360').GetName]的地位不断提高，很快就支配了该地区的其他希腊殖民地，并将它们统一在昔兰尼加王国之下，但[GetProvince('(int32)454').GetName]本身却不断衰落，成为爱琴海政治阴谋中的一个脚注而已。\n\n现在，昔兰尼加再次崛起，然而，可能是时候让[GetProvince('(int32)454').GetName]最骄傲的孩子们回到他们的母城了。由于[GetProvince('(int32)454').GetName]位于基克拉泽斯群岛的南端，也使其成为主导爱琴海上利润丰厚的贸易的完美地点，这一前景变得更加诱人。然而，在我们胜利返回[GetProvince('(int32)454').GetName]之前，我们需要从目前的霸主手中夺回它......\n\n如果[GetProvince('(int32)454').GetName]证明我们无法立即到达，我们可以选择先在该地区建立自己的地位。在昔兰尼加和[GetProvince('(int32)454').GetName]之间有一个很大的克里特岛。克里特岛是一个混乱的城邦，经常要求外人干预他们的国内争吵。如果我们能将该岛统一在我们的统治之下，将大大加强我们在北方的地位。"
 cyrene_1_thera_task_1:0 "克里特岛的华林国家"
 cyrene_1_thera_task_1.tt:0 "任何首都在[GetProvince('(int32)370').GetArea.GetName|Y]省的国家都与非[SCOPE.GetRootScope.GetCountry.GetName|Y]的国家交战。"
 cyrene_1_thera_task_10:0 "克里特岛的弓箭手"
 cyrene_1_thera_task_10_A.tt:0 "在 [GetProvince('(int32)370').GetArea.GetName|Y] 地区中，至少有 #Y 3#! 块领土建有 #Y 军营#! 建筑。"
 cyrene_1_thera_task_10_DESC:0 "克里特岛以其弓箭手的技能而闻名。招募这些人加入我们的军队可以给我们带来赢得未来战争的优势。"
 cyrene_1_thera_task_1_DESC:0 "克里特岛的众多城邦彼此之间不断纠缠于小争执中。我们也许可以通过协助他们的战争，将他们中的一个纳入我们的影响范围。"
 cyrene_1_thera_task_2:0 "扩大对克里特岛的影响"
 cyrene_1_thera_task_2.tt:0 "在#Y 省拥有或附属国拥有至少#! 3[GetProvince('(int32)370').GetArea.GetName|Y]个领地。"
 cyrene_1_thera_task_2_DESC:0 "随着我们在该岛的第一个立足点的建立，我们应该继续扩张，直到整个岛屿都在我们的控制之下。"
 cyrene_1_thera_task_3:0 "平定克里特岛"
 cyrene_1_thera_task_3.tt:0 "任何在[GetProvince('(int32)370').GetArea.GetName|Y]省拥有首都的臣民至少有50个忠诚度。"
 cyrene_1_thera_task_3_A.tt:0 "[GetProvince('(int32)370').GetArea.GetName|Y]省至少有#Y 80#! 个省的忠诚度。"
 cyrene_1_thera_task_3_DESC:0 "克里特岛是一个非常分裂的地区。要真正统一该岛，仅仅征服城市是不够的，我们必须确保克里特岛的人民接受我们的统治。"
 cyrene_1_thera_task_4:0 "争取基克拉迪群岛"
 cyrene_1_thera_task_4.tt:0 "#Y 将解锁新的决议，以吸引[GetProvince('(int32)454').GetName]的所有者进入我们的势力范围。#!"
 cyrene_1_thera_task_4_DESC:0 "基克拉迪群岛，包括锡拉，目前正处于外国势力的保护之下。如果我们想回到瑟拉并在爱琴海建立我们的地位，我们需要说服他们，让他们相信我们会成为一个更合适的宗主。"
 cyrene_1_thera_task_5:0 "返回锡拉"
 cyrene_1_thera_task_5_DESC:0 "一旦锡拉被我们统治，我们就可以开始努力恢复该岛。"
 cyrene_1_thera_task_6:0 "爱琴海贸易之心"
 cyrene_1_thera_task_6_DESC:0 "据说很久以前，在特洛伊战争时期，塞拉岛是一个强大的贸易帝国的中心。今天，这方面的证据很少，但鉴于其位置，特拉岛肯定可以成为爱琴海的一个重要贸易中心。我们只需要投入资源来建设必要的基础设施。"
 cyrene_1_thera_task_7:0 "战争舰队的大港"
 cyrene_1_thera_task_7.tt:0 "#Y 一个熟练的海军将领将加入你的事业。#!"
 cyrene_1_thera_task_7_DESC:0 "锡拉岛的位置非常好，可以作为我们战争舰队的一个主要港口。如果我们建立起必要的基础设施，这里的海军基地可以让我们的舰队主宰爱琴海。"
 cyrene_1_thera_task_8:0 "从灰烬中崛起的锡拉"
 cyrene_1_thera_task_8_DESC:0 "曾经是一个省级的落后地区，我们的努力使泰拉成为基克拉迪群岛最重要的城市之一。它现在是我们在北方无可争议的首都。"
 cyrene_1_thera_task_9:0 "罗德岛的对手"
 cyrene_1_thera_task_9_A.tt:0 "获得对所有#Y 爱琴海岛屿#!的宣称。"
 cyrene_1_thera_task_9_DESC:0 "随着克里特岛和基克拉迪群岛在我们的统治之下，我们对爱琴海南部的控制几乎已经完成。然而，有一个对手仍然存在。强大的罗德斯城历来主宰着这片海域，在解决罗德斯城带来的威胁之前，我们不能休息。"
 cyrene_1_thera_task_final:0 "爱琴海制海权"
 cyrene_1_thera_task_final_A.tt:0 "拥有或附属国拥有至少#Y 30#! 个高亮的爱琴海领土。"
 cyrene_1_thera_task_final_DESC:0 "我们在爱琴海的所有对手都被解决了，该地区的大部分主要岛屿现在都在我们的控制之下。我们是爱琴海无可争议的霸主。"
 desc_independent_egyptian_subject:0 "虽然我们比大多数埃及臣民享有更大的独立性，但我们在形式上仍然是埃及王国的一部分。在我们与埃及断绝关系之前，我们独立行事的能力仍然有限。"
 independent_egyptian_subject:0 "与埃及的关系"
 is_cyr.tt:0 "是昔兰尼加"
 magas:0 "马加斯与贝勒尼丝的血脉"
 magas_desc:0 "贝勒尼丝是一位地位显赫的马其顿贵族女子。她是前[GetCharacter('(int32)39').GetFirstName]帝国摄政[GetCharacter('(int32)9').GetName]的侄孙女，也是[GetCharacter('(int32)39').GetName]的远亲。\n\n在第一任丈夫腓力去世后，她前往埃及投奔自己的亲戚——埃及国王[GetCharacter('(int32)42').GetName]的妻子[GetCharacter('(int32)29').GetName]。不久后，贝勒尼丝取代了[GetCharacter('(int32)29').GetFirstName]，成为[GetCharacter('(int32)42').GetFirstName]的正妻，实际上成为埃及女王，并确保她与[GetCharacter('(int32)42').GetFirstName]所生的第一个儿子[GetCharacter('(int32)45').GetName]继承了[GetCharacter('(int32)42').GetFirstName]的王位。\n\n贝勒尼丝利用影响力将自己前夫所生的子女安排在重要位置。她的长子[GetCharacter('(int32)46').GetName]将成为昔兰尼加国王，而她的两个女儿[GetCharacter('(int32)115').GetFirstName]和[GetCharacter('(int32)57').GetFirstName]则分别嫁给了伊庇鲁斯国王[GetCharacter('(int32)70').GetName]与西西里僭主[GetCharacter('(int32)56').GetName]。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"

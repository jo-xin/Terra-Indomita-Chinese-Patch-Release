 cyr_intoegypt_01.1.a:0 "他们可以自由行动"
 cyr_intoegypt_01.1.a.tt:0 "这将#G 加强#! 我们对东昔兰尼加的宣称。"
 cyr_intoegypt_01.1.b:0 "我们不会将我们的人民送入埃及的怀抱"
 cyr_intoegypt_01.1.desc:0 "一群被剥夺权利的昔兰尼加人请求我们支持他们在[cyr_egypt_scope.GetAdjective]控制的[GetProvince('(int32)3373').GetArea.GetName]建立一个殖民地。当然，这意味着我们要放弃一些自己的附庸，但为了加强我们对[GetProvince('(int32)3373').GetArea.GetName]的宣称，这种牺牲也许是值得的。"
 cyr_intoegypt_01.1.t:0 "马尔马利卡的昔兰尼加定居者"
 cyr_intoegypt_01.2.a:0 "他们得到了我们的充分支持"
 cyr_intoegypt_01.2.b:0 "我们不需要野蛮人中的盟友。"
 cyr_intoegypt_01.2.desc:0 "我们的一些利比亚臣民与东[GetProvince('(int32)3373').GetArea.GetName]有历史联系，愿意在当地的利比亚民众中为我们筹集支持。他们所要求的回报是为当地政要购买足够的礼物的资金。"
 cyr_intoegypt_01.2.t:0 "利比亚人在马尔马利卡的支持"
 cyr_intoegypt_01.3.a:0 "好"
 cyr_intoegypt_01.3.desc:0 "尽管[GetProvince('(int32)3373').GetArea.GetName]大部分地区仍处于[cyr_egypt_scope.GetAdjective]统治之下，但我们近期的行动已在该地区获得足够支持——若决定推进对该区域的宣称，整合进程将大为简化。"
 cyr_intoegypt_01.3.t:0 "对马尔马利卡的要求--成功"
 cyr_intoegypt_01.4.a:0 "不幸的是"
 cyr_intoegypt_01.4.desc:0 "不幸的是，我们一直无法挑战[cyr_egypt_scope.GetName]对[GetProvince('(int32)3373').GetArea.GetName]的控制。我们将不得不以传统的方式编造一个主张。"
 cyr_intoegypt_01.4.t:0 "对马尔马利卡的要求--失败"
 cyr_intoegypt_01.5.a:0 "[GetCharacter('(int32)42').GetFirstName]的遗产已经破败不堪。"
 cyr_intoegypt_01.5.desc:0 "我们最近对[GetProvince('(int32)516').GetArea.GetRegion.GetName]的征服将[cyr_egypt_scope.GetAdjective]王国一分为二。由于无法维持对其分裂领域的控制，[GetCharacter('(int32)42').GetName]的继承人已经撤回到地中海沿岸周围的北方属地。\n\n由于没有任何中央权威，他们王国的其余部分已经被地方军阀分割开来，他们为了争夺[GetCharacter('(int32)42').GetFirstName]曾经的伟大帝国的破碎残余而相互争斗。"
 cyr_intoegypt_01.5.t:0 "托勒密王朝的梦想破灭了"
 cyr_intoegypt_01.6.a:0 "遵循埃及的传统!"
 cyr_intoegypt_01.6.b:0 "我们不需要他们愚蠢的传统!"
 cyr_intoegypt_01.6.desc:0 "今天，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]被阿蒙的大祭司加冕为下埃及的法老。尽管埃及南部的许多人否认这个头衔的合法性，但毫无疑问，下埃及的精英们至少把我们视为埃及传统的捍卫者。这应该会使我们在管理埃及财产时更容易获得他们的支持。"
 cyr_intoegypt_01.6.t:0 "法老的加冕仪式"
 cyr_intoegypt_01.7.a:0 "[GetCharacter('(int32)42').GetFirstName]的遗产已经破败不堪。"
 cyr_intoegypt_01.7.desc:0 "我们最近对[GetProvince('(int32)516').GetArea.GetRegion.GetName]的征服将[cyr_egypt_scope.GetAdjective]的王国一分为二。由于无法维持对其分裂领域的控制，[GetCharacter('(int32)42').GetName]的继承人已经撤回到他们在尼罗河沿岸的南部属地。\n\n没有任何中央权威，他们王国的其余部分已被地方军阀分割开来，他们现在正为[GetCharacter('(int32)42').GetFirstName]曾经的伟大帝国的破碎残余相互争斗。"
 cyr_intoegypt_01.7.t:0 "托勒密王朝的梦想破灭了"

l_simp_chinese:
 based_astronomer_from_lu_tt:0 "此选项因角色#T热忱#!#Y高而可用#!。"
 battle_of_changshao_mod:0 "长勺之战教训"
 battle_of_changshao_mod_desc:0 "吾等从昔日在长勺之战中对齐之胜利中，习得了击败彼等之法。"
 confucius_lu_mod:0 "孔子之言"
 confucius_lu_mod_desc:0 "今正当时，当将孔子之道广传四方。"
 desc_lu_etiquette_mod:0 "鲁之礼"
 destroyed_last_huanen:0 "三桓已灭"
 destroyed_last_huanen_desc:0 "三桓之势力已荡然无存，我邦无需再俯仰其喜怒与意愿。"
 lu_etiquette_mod:0 "$lu_missions_task_2$"
 lu_etiquette_opinion_mod:0 "推行鲁礼"
 lu_missions:0 "周礼尽在鲁"
 lu_missions_BUTTON_TOOLTIP:0 "荣耀唯勇者可得！"
 lu_missions_CRITERIA_DESCRIPTION:0 "当鲁国击败其中原地区的诸敌国之后，此使命即告完成。"
 lu_missions_DESCRIPTION:0 "数百年前，[GetCountry('LUU').GetName)]邦国在[GetProvince('(int32)8533').GetName]建立，并由周公赐予伯禽。历经数代，我们统治着这片土地，但鲁国已不复昔日之强盛。\n\n自多年前那场伟大的#E长勺之战#!以来，我邦国力在[GetCountry('QIIU').GetName)]与[GetCountry('CHU').GetName)]诸邦的阴影中日渐衰微。多年间，#E三桓#!——三个权势滔天的家族——将我们伟大的鲁国牢牢扼于掌中，直至多代之后的孔子时代，鲁国公室的权威才得以恢复。\n\n如今，时局之动荡前所未有；#E中原#!诸王彼此倾轧，给予#E周天子#!的尊崇也日渐消散。齐楚二国不断扩张的疆界，已使我们这个昔日伟邦的安稳岌岌可危；唯有时间能证明鲁国还能否重振昔日荣光。"
 lu_missions_task_1:0 "整军备战"
 lu_missions_task_10:0 "制衡楚国"
 lu_missions_task_10_DESC:0 "腐败的庞然大物[GetCountry('CHU').GetName)]犹如枝头腐烂的李子，肿胀欲裂，随时可能迸发。如今[GetCountry('LUU').GetName)]已拥有一支堪当捍卫我邦利益的军团，向南方人施以惩戒的时机已然到来。\n\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 lu_missions_task_10_claims:0 "我们将获得对#Y广陵#!、#Y阳城#!、#Y吴#!、#Y丹阳#!、#Y豫章#!和#Y会稽#!诸区域的宣称权。"
 lu_missions_task_11:0 "资助天文"
 lu_missions_task_11_DESC:0 "曾有一位杰出的天文学家居于我邦境内，其名曰#E甘德#!，惜我先辈未能给予足够资助，他便前往了[GetCountry('QII').GetName)]。如今又有另一位志在天文的学者声称，若能得到国家充足的资助，他将能够绘制星辰轨迹并揭示其天界奥秘。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 lu_missions_task_12:0 "灭齐"
 lu_missions_task_12_DESC:0 "[GetCountry('QII').GetName)]既已被我军团重创——失其都城[GetProvince('(int32)8504').GetName]何以苟存——[ROOT.GetCountry.GetRuler.GetName]决意给予致命一击的时机已经到来。齐国必须被彻底摧毁！\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 lu_missions_task_12_claims:0 "获得#Y豫#!地区所有行省宣称。"
 lu_missions_task_13:0 "解放越国"
 lu_missions_task_13_DESC:0 "越人已在暴虐政权的统治下受难良久，但[ROOT.GetCountry.GetRuler.GetName]决不容忍此等逆行再延续一刻。集结[ROOT.GetCountry.GetName]之征召兵，遣其南下以解救越人！\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 lu_missions_task_14:0 "西方同胞"
 lu_missions_task_14_DESC:0 "世人皆知，[GetCountry('LUU').GetName)]的公族乃是[GetCountry('ZHO').GetName)]王室的远支亲族，纵使岁月的流逝削弱了这些纽带，他们依然是我等之兄弟。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 lu_missions_task_15:0 "春秋"
 lu_missions_task_15_DESC:0 "[GetCountry('LUU').GetName)]诸王的事迹与功业虽已不朽，然若不将这些史实载录以传后世，只怕时光的摧残将磨灭我传奇先祖的记忆。我们必须编纂一部史书，一部足以垂范千古的著作——我们必须撰写#Y春秋#!！\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 lu_missions_task_16:0 "少昊之墟"
 lu_missions_task_16_DESC:0 "相传太古之时，传奇君主#E少昊#!——#Y黄帝#!之子——曾迁都至[GetProvince('(int32)8533').GetName]，其简朴的陵墓至今仍可于城郊得见。\n\n为向这位伟大的领袖致敬，[ROOT.GetCountry.GetRuler.GetName]下令扩建此城——为这位神秘人物留下一份相称的遗产。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 lu_missions_task_1_DESC:0 "战争的时刻显然正在迅速逼近，唯一的问题是与谁交战、何时开战。国中许多人建言，我们应当立即为这场似已不可避免的争斗做好准备……\n\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 lu_missions_task_1_claims:0 "我们将获得对#Y临淄#!、#Y琅琊#!、#Y济南#!、#Y泰山#!和#Y东#!诸区域的宣称权。"
 lu_missions_task_1_marshal_7:0 "我#T元帅#!军事能力至少7。"
 lu_missions_task_2:0 "鲁之礼"
 lu_missions_task_2_DESC:0 "尽管周边许多[GetCountry('ZHO').GetName)]诸侯已抛弃了昔日伟大王朝那不胜枚举的正式礼仪与典制，[GetCountry('LUU').GetName)]的公族却从未动摇过对备受尊崇的古老传统之矢志忠诚。\n\n恪守礼仪向来是鲁国所有贤能政治家之共通之处。纵使时光流转，周遭诸邦已将古法遗弃身后，然岁月的无尽洪流至今仍未改变鲁国之道。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 lu_missions_task_3:0 "主导小邦"
 lu_missions_task_3_DESC:0 "在我邦南部边境之外散布着诸多小邦；它们历来属于我势力范围之内。鲁国朝廷中数位显赫的政治家建言，我们应在与某一更大势力不可避免的对抗来临之前，加强对这些邦国的控制以巩固我邦之势。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 lu_missions_task_3_offer_small_states:0 "提议南方小邻为藩属。"
 lu_missions_task_4:0 "夺取宋国"
 lu_missions_task_4_DESC:0 "我南部边境的[GetCountry('SNG').GetName)]是我们意欲征伐的合乎情理之目标。若在此时与[GetCountry('QII').GetName)]或[GetCountry('CHU').GetName)]等大国直接对抗，恐将招致覆灭。夺取宋国之地将巩固我邦之势，甚至可能威慑任何潜在的侵略者。\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 lu_missions_task_4_claims:0 "我们将获得对#Y沛#!、#Y九江#!、#Y临淮#!、#Y庐江#!和#Y东海#!诸区域的宣称权。"
 lu_missions_task_5:0 "礼乐之邦"
 lu_missions_task_5_DESC:0 "虽有一些邻邦忘却了正统礼仪，弃绝了对周代传统的研究——尤其是在朝堂上使用乐礼——但[GetCountry('LUU').GetName)]的子民却始终将先祖之道谨守于心。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 lu_missions_task_6:0 "灭三桓之末"
 lu_missions_task_6_DESC:0 "虽然#Y三桓#!的铁腕已从[GetCountry('LUU').GetName)]邦国身上被撬开，但仍有一个最后的军阀需要推翻——我们决不能再让这些贵族继续主宰我王国！\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 lu_missions_task_7:0 "削弱齐国"
 lu_missions_task_7_DESC:0 "[GetCountry('QII').GetName)]的军力如滚滚雷云般悬于天际，逼近的风暴恐将血雨倾洒于[GetCountry('LUU').GetName)]的田野之上。我们必须采取措施削弱我们的对手，否则将见其征召兵陈于[ROOT.GetCountry.GetCapital.GetName]城外。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 lu_missions_task_7_claims:0 "获得#Y齐#!所有行省宣称。"
 lu_missions_task_8:0 "子曰"
 lu_missions_task_8_DESC:0 "尊敬的哲人#Y孔子#!的著述与言论值得研习效法，其教诲中蕴含着诸多宝贵的道理。[GetCountry('LUU').GetName)]之国策即是使孔子之言传遍我王国全境。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 lu_missions_task_9:0 "孔庙"
 lu_missions_task_9_DESC:0 "传奇哲人孔子的诞生地[GetProvince('(int32)8533').GetName]长期以来一直是那些渴望向至圣先师致敬之人的非正式朝圣之地。[ROOT.GetCountry.GetRuler.GetName]已下令，应在先贤故里修建一座尊奉圣人的祠庙。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 lu_rituals_music_mod:0 "$lu_missions_task_5$"
 lu_rituals_music_mod_desc:0 "天下皆知鲁为礼乐之邦。"
 lu_spring_autumn_annals:0 "春秋"
 lu_spring_autumn_annals_desc:0 "鲁国的史记与典册已被编汇成一部鸿篇巨著，称为《春秋》。"
 me_lu_1.a:0 "彼等永世难忘吾等将施加之威"
 me_lu_10.a:0 "吾等特此宣称以下诸地…"
 me_lu_100.a:0 "佳音——吾等永不嫌兵多！"
 me_lu_100_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，正当我辈继续为将临之战做准备时，四队志愿兵意外抵达了[ROOT.GetCountry.GetCapital.GetName]。这些勇武之士闻召而来，已准备好为[GetCountry('LUU').GetName)]的荣耀而战。"
 me_lu_100_title:0 "$lu_missions_task_1$"
 me_lu_101.a:0 "一切戎马经验皆可贵"
 me_lu_101_desc:0 "随着我征召兵在[ROOT.GetCountry.GetCapital.GetName]郊外持续训练，众将禀报称，他们正在精进战术，逐渐成为一支更具凝聚力的作战部队。"
 me_lu_101_title:0 "$lu_missions_task_1$"
 me_lu_102.a:0 "天大喜讯！"
 me_lu_102_desc:0 "正当[GetCountry('LUU').GetName)]之民继续为将临之战做准备时，一群学者在[ROOT.GetCountry.GetCapital.GetName]的宫殿中发现了若干被遗忘的兵书，此前一直尘封于库。\n\n我众将已在研读这些卷轴，探寻其中可能蕴含的洞见。据称，这一意外发现已提升了我军之战备水平。"
 me_lu_102_title:0 "$lu_missions_task_1$"
 me_lu_10_desc:0 "有奏报呈于[ROOT.GetCountry.GetRuler.GetName]，称[GetCountry('CHU').GetName)]的暴君[GetCountry('CHU').GetRuler.GetName)]，因麾下众将未能阻止我[ROOT.GetCountry.GetAdjective]大军推进，已处决数名将领。[GetCountry('CHU').GetRuler.GetFirstName)]确有震怒之理；毕竟我朝士卒已摧垮敌军，并为我国夺得大片疆土。\n\n如今首血已流，且正恣意流淌，[ROOT.GetCountry.GetRuler.GetFirstName]宣告，鲁国大军正趁势追击，以取全功。"
 me_lu_10_title:0 "$lu_missions_task_10$"
 me_lu_11.a:0 "此事大悦！善哉"
 me_lu_11.b:0 "何其卓越之天文家！"
 me_lu_11_desc:0 "[ROOT.GetCountry.GetRuler.GetName]对苍穹素来神往，且总是乐于聆听朝中卜者与星象官之占卜，故当有人提议由[GetCountry('LUU').GetName)]国库出资，延请一位德高望重的学者来研究星宿运行之道，[ROOT.GetCountry.GetRuler.GetSheHe]当即欣然应允。\n\n此决定已被证明是明智之举，因赖此项举措，我辈对天穹之认知大有增益。"
 me_lu_11_title:0 "$lu_missions_task_11$"
 me_lu_12.a:0 "#E 豫#!地之内，凡未归者皆须取之"
 me_lu_12_desc:0 "不朽的[ROOT.GetCountry.GetRuler.GetName]已完成了久远以前始于#E长勺之战#!的未竟之功，[GetCountry('QII').GetName)]王国已在[ROOT.GetCountry.GetRuler.GetHerHis]铁腕之下化为齑粉。\n\n如今彼等既已覆灭，[ROOT.GetCountry.GetRuler.GetFirstName]便可移[ROOT.GetCountry.GetRuler.GetHerHis]目光于他方了。"
 me_lu_12_title:0 "$lu_missions_task_12$"
 me_lu_13.a:0 "融合吴越"
 me_lu_13.b:0 "安于现状，亦无不可"
 me_lu_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的凯旋之师既已解放南方#E吴越#!诸族，使之摆脱奴役，这位[ROOT.GetCountry.GetRulerTitle]便面临一项重大抉择，此事将影响[GetCountry('LUU').GetName)]的未来走向。\n\n有人提议，我等应将公民权授予#E吴越#!文化之民，盖因彼等为勇武战士，可与我分享其专长——以及人力。虽然[ROOT.GetCountry.GetRuler.GetFirstName]正斟酌此议，但最终抉择尚未作出；单是宣称此胜之威望便已足够，之后便可继续前行。"
 me_lu_13_title:0 "$lu_missions_task_13$"
 me_lu_14.a:0 "陛下，臣当护您免受敌患"
 me_lu_1400.a:0 "吾乃大周之纯正子孙"
 me_lu_1400_desc:0 "通过夺取曾属于我西方兄弟之领土，[ROOT.GetCountry.GetRuler.GetName]已证明[ROOT.GetCountry.GetRuler.GetHerHim]self乃举世无双之[ROOT.GetCountry.GetRulerTitle]，其名将载入史册，为万民之冠军。\n\n[GetCountry('LUU').GetName)]之军为夺取这些省份所付出的努力，为[ROOT.GetCountry.GetRuler.GetFirstName]带来了威望与荣耀，众人皆称其为#E周#!室后裔——如此功业，岂是其他家族所能成就？"
 me_lu_1400_title:0 "$lu_missions_task_14$"
 me_lu_14_desc:0 "在一场庄严肃穆的典礼中，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetCapital.GetName]迎接了尊贵的[GetCountry('ZHO').GetRuler.GetName)]，以接受天子提出的附庸之请。\n\n显然，众多邦国已然忘却了对[GetProvince('(int32)8379').GetName]的誓言，然[ROOT.GetCountry.GetRuler.GetFirstName]并未如此，他立誓保卫天子，抵御环伺之众敌。当[GetCountry('ZHO').GetRuler.GetFirstName)]向我[ROOT.GetCountry.GetRulerTitle]躬身之际，[GetCountry('ZHO').GetRuler.GetHerHis)]脸上浮现释然之色。如今[GetCountry('LUU').GetName)]已同意接受周为藩属，#E中原#!的一个新时代已然到来。"
 me_lu_14_title:0 "$lu_missions_task_14$"
 me_lu_15.a:0 "愿此青史他日随我入土…"
 me_lu_1500.a:0 "但愿此著不耗时日！"
 me_lu_1500_desc:0 "如今[ROOT.GetCountry.GetRuler.GetName]已决定，[ROOT.GetCountry.GetRuler.GetSheHe]愿见[GetCountry('LUU').GetName)]之藏书阁中充盈一部正统史册——一部凸显我族在过去百年惨烈冲突中所扮演角色之史书——这位[ROOT.GetCountry.GetRulerTitle]已拨出专款，以托付撰写此作。"
 me_lu_1500_title:0 "$lu_missions_task_15$"
 me_lu_15_desc:0 "那部日后将被称作#E《春秋》#!的杰作终告完成，欣喜的[ROOT.GetCountry.GetRuler.GetName]邀请著者前来[ROOT.GetCountry.GetCapital.GetName]，于朝中朗诵卷中篇章。\n\n此部史书，自[GetCharacter('(int32)592').GetName]之治起，绵延至今上[ROOT.GetCountry.GetRuler.GetFirstName]之朝，注定将成为这一时代的经典之作。"
 me_lu_15_title:0 "$lu_missions_task_15$"
 me_lu_16.a:0 "愿[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏万世永昌！"
 me_lu_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的功业与成就之长卷，已载入#E《春秋》#!，然[ROOT.GetCountry.GetRuler.GetHerHis]治世最具实体之明证，可在[ROOT.GetCountry.GetCapital.GetName]寻得。\n\n这座名城不仅是传奇人物[GetCharacter('(int32)520').GetName]的诞生之地，更藏有古老的#E少昊陵#!——那位将权力中心迁至我都城的上古君主之墓。\n\n为追念少昊——那位被我部分族人奉若神明的所谓#E白帝#!——[ROOT.GetCountry.GetRuler.GetFirstName]降旨扩建都城，将原本位于城外的这座古陵遗址纳入城墙之内。自今日起，曲阜将因威严的[ROOT.GetCountry.GetRuler.GetFirstName]之雄心，而被列为全#E中原#!最为卓越的都城之一。"
 me_lu_16_title:0 "$lu_missions_task_16$"
 me_lu_1_desc:0 "我朝史上最伟大的时刻之一，便是在#E长勺之战#!中战胜[GetCountry('QII').GetName)]之军。我征召兵在不朽的[GetCharacter('(int32)614').GetName]率领下，给齐人上了一课——而齐人似乎已经遗忘了这一教训，因为他们正试图在整个#E山东半岛#!耀武扬威，此举已激起[ROOT.GetCountry.GetRuler.GetName]之怒。\n\n所幸，我#E司马#!乃学史之人，未曾遗忘那些在昔日为我带来胜利、历经沙场考验的韬略。"
 me_lu_1_title:0 "$lu_missions_task_1$"
 me_lu_2.a:0 "礼不下庶人"
 me_lu_2.b:0 "与赵共享吾等之价值观与教化"
 me_lu_2.c:0 "燕国亟需智慧"
 me_lu_200.a:0 "全心接纳此议，更求鲁国之助"
 me_lu_200.b:0 "善遇来客，然不结盟"
 me_lu_200_desc:0 "今日，[GetCountry('LUU').GetName)]的使节抵达[ROOT.GetCountry.GetCapital.GetName]，带来一项饶有趣味的提议：据称[GetCountry('LUU').GetRuler.GetName)]欲与我分享[GetCountry('LUU').GetRuler.GetHerHis)]族人之礼仪，并慷慨提议指导[ROOT.GetCountry.GetRuler.GetName]学习[ROOT.GetCountry.GetRuler.GetHerHis]令人钦佩的仪轨。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]的谋臣还私下建言，我方可借此契机与鲁国更为亲近，然最终决断，仍在我[ROOT.GetCountry.GetRulerTitle]手中。"
 me_lu_200_title:0 "$lu_missions_task_2$"
 me_lu_2_desc:0 "因[GetCountry('LUU').GetName)]之民素以品行端正闻名，故有人向[ROOT.GetCountry.GetRuler.GetName]——这位至高品味的终极仲裁者——建言，我辈应与若干邻邦分享我礼仪知识。此举之利可使诸族同心共济，然最终抉择仍在[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_lu_2_title:0 "$lu_missions_task_2$"
 me_lu_3.a:0 "告之吾等接受提议"
 me_lu_3.b:0 "略献薄贡，婉拒其请"
 me_lu_300.a:0 "有意思……"
 me_lu_300_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我朝派往海外为[GetCountry('LUU').GetName)]争取新藩属的使节已经归来，他们欲向您呈报。"
 me_lu_300_title:0 "$lu_missions_task_3$"
 me_lu_3_desc:0 "主上，我等迎来了[GetCountry('LUU').GetName)]的使节，该国正在此地区逐步壮大。其所传递的信息颇为简单：鲁国问我们，是否愿意作为藩属归附于彼，声称此举将使我双方之共同繁荣得到巩固。"
 me_lu_3_title:0 "$lu_missions_task_3$"
 me_lu_4.a:0 "战神同在！吾等势不可挡！"
 me_lu_4_desc:0 "战场捷报，[ROOT.GetCountry.GetRuler.GetName]啊——[GetCountry('SNG').GetName)]之军已遭永久击溃，其宝贵领土已并入[GetCountry('LUU').GetName)]之版图。\n\n其军队的全面投降已开辟了前进之路，新的宣称权已为我备妥。"
 me_lu_4_title:0 "$lu_missions_task_4$"
 me_lu_5.a:0 "吾等永不舍弃传承"
 me_lu_5_desc:0 "造访[ROOT.GetCountry.GetCapital.GetName]的来客，一踏入[ROOT.GetCountry.GetRuler.GetName]的宫殿，往往惊异于耳畔时常萦绕的#E六代乐舞#!的悠扬旋律——诸多外邦人误以为，对#E雅乐#!的合宜奉行早已被全然遗忘。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]引以为傲的是，我朝之民仍恪守古制，[ROOT.GetCountry.GetRuler.GetSheHe]坚信，仪礼与音乐之宁神功效，将继续为王国带来安定。"
 me_lu_5_title:0 "$lu_missions_task_5$"
 me_lu_6.a:0 "信我，我永不负卿"
 me_lu_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]终于推翻了最后一位#E三桓#!，为[ROOT.GetCountry.GetRuler.GetHerHis]王国带来荣耀与威望。\n\n不仅外敌已被废黜，在我邦之内，众将与诸郡守亦纷纷表示拥护[ROOT.GetCountry.GetRuler.GetFirstName]。忠诚之誓已立，[GetCountry('LUU').GetName)]上下皆一心一意，确保[ROOT.GetCountry.GetRuler.GetFirstName]的意志得以贯彻。"
 me_lu_6_title:0 "$lu_missions_task_6$"
 me_lu_7.a:0 "齐啊，汝之末日将至…"
 me_lu_7_desc:0 "[ROOT.GetCountry.GetRuler.GetName]与[GetCountry('QII').GetRuler.GetName)]正重蹈其先祖之途，两国已互为死敌，显而易见，在未来的战争中，只有一个王国能够幸存。\n\n然[ROOT.GetCountry.GetRuler.GetFirstName]并未在确保先削弱敌人之前，便将我军投入这场生死之争。天兆已显，向我众将保证永恒之胜利早已注定。最后的决战降临，不过是时间问题。"
 me_lu_7_title:0 "$lu_missions_task_7$"
 me_lu_8.a:0 "孔子之言将为吾等前路之导"
 me_lu_8_desc:0 "[GetCharacter('(int32)520').GetName]的教诲素为[GetCountry('LUU').GetName)]之民所珍视，但近来，其已成为国家社会结构中不可或缺的一部分。[ROOT.GetCountry.GetRuler.GetName]已下令，这位至圣先师的哲学须由人人习诵深思，我民已全心接纳此令。"
 me_lu_8_title:0 "$lu_missions_task_8$"
 me_lu_9.a:0 "凡愿为#E 鲁#!之民者，皆可来归"
 me_lu_90.a:0 "不容任何敌手……"
 me_lu_90_desc:0 "虽我辈与邻邦诸国确有血缘关联——毕竟，我辈与#E周朝#!乃是远亲——然令人遗憾，我等对周遭诸侯并无丝毫亲族之情。\n\n不久之前，三家强宗大族主宰着鲁国之运，直至[GetCharacter('(int32)610').GetName]公削弱其中两家之权势。彼等合称三桓，因皆为[GetCharacter('(int32)593').GetName]公之庶出后裔。然三家之中最后一支，仍据[GetProvince('(int32)8548').GetName]周边，统辖一方小邦。\n\n而今，既然#E天子#!在[GetProvince('(int32)8379').GetName]的权威与敬重，已几乎不被该地区真正的权力掮客所承认，在[ROOT.GetCountry.GetCapital.GetName]城墙内举行的廷议中已做出决断：是时候消除一切对[ROOT.GetCountry.GetSuccession.GetPrimaryHeir.GetName]最终掌权构成威胁的势力了。"
 me_lu_90_title:0 "三桓之覆"
 me_lu_91.a:0 "我倒想看看他们如何尝试……"
 me_lu_91_desc:0 "虽我辈与邻邦诸国确有血缘关联——毕竟，我辈与#E周朝#!乃是远亲——然令人遗憾，我等对周遭诸侯并无丝毫亲族之情。\n\n不久之前，三家强宗大族主宰着鲁国之运，直至[GetCharacter('(int32)610').GetName]公削弱其中两家之权势。彼等合称三桓，因皆为[GetCharacter('(int32)593').GetName]公之庶出后裔。我等便是三家中的最后一支，仍据[GetProvince('(int32)8548').GetName]周边，统辖一方小邦。\n\n而今，既然#E天子#!在[GetProvince('(int32)8379').GetName]的权威与敬重，已几乎不被该地区真正的权力掮客所承认，在[ROOT.GetCountry.GetCapital.GetName]城墙内举行的廷议中已做出决断：是时候消除一切对[ROOT.GetCountry.GetRuler.GetName]掌控权力的威胁了——此情亦为[GetCountry('LUU').GetName)]的诸公所认同，彼等正公然夸耀，视[ROOT.GetCountry.GetRuler.GetFirstName]为必将废黜之敌手。"
 me_lu_91_title:0 "三桓之覆"
 me_lu_9_desc:0 "如今，宏伟的#E孔庙#!已在[GetProvince('(int32)8533').GetName]落成，[GetCountry('LUU').GetName)]之民纷纷前往这位德高望重的[GetCharacter('(int32)520').GetName]的诞生地朝圣，以表敬意。\n\n此举不仅惠及我宗教实践，更引来外邦之人涌入我城——但凡向往智慧者，莫不渴望居于一个珍视并尊重学问的王国疆土之内。"
 me_lu_9_title:0 "$lu_missions_task_9$"
 revenge_of_last_huanen:0 "末代三桓之仇"
 revenge_of_last_huanen_desc:0 "吾等，三桓之末裔，已推翻鲁国公室本宗之腐败君主。"
 shahoa_ruins_mod:0 "$lu_missions_task_16$"
 shahoa_ruins_mod_desc:0 "我巍巍大城，建于少昊之故都之上。"
 temple_of_confucius_country_mod:0 "$lu_missions_task_9$"
 temple_of_confucius_country_mod_desc:0 "在此巍巍殿堂之中，至圣先师孔子受万世景仰。"
 temple_of_confucius_state_mod:0 "$lu_missions_task_9$"
 temple_of_confucius_state_mod_desc:0 "$temple_of_confucius_state_mod_desc$"

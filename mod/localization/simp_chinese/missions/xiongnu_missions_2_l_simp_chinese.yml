l_simp_chinese:
 any_chinese_subject:0 "至少有一华夏文化附庸。"
 city_of_chanyu:0 "单于之城"
 desc_city_of_chanyu:0 "此城享匈奴大单于所赐辉煌。"
 desc_xiongnu_02_final_mod:0 "可仰赖联盟中诸贵族之忠诚。"
 desc_xiongnu_desert_mod:0 "人马皆已习沙漠之道。"
 desc_xiongnu_sanctuary_mod:0 "龙城圣所令人皈依我道。"
 desc_xiongnu_speed_run:0 "因单于政治手腕，总督保持忠诚……"
 desc_xiongnu_speed_run_reward:0 "旷野草原骑术无与伦比。"
 is_in_you_bing_yong_region:0 "至少拥有25行省，位于幽、并或雍地区。"
 me_xiongnu_2_1.a:0 "最大之劲敌已被摧毁！"
 me_xiongnu_2_10.a:0 "华夏之富将归我所有！"
 me_xiongnu_2_10_desc:0 "我伟大领袖在征服最近之敌后发表演说——'我辈不满足于浩瀚草海，我辈不满足于仅有牛羊与马匹。我等已亲眼目睹丝绸、黄金、美女、佳酿，以及那些比我弱小者之全部财富。我等对其土地之可怜交易与稀疏劫掠，仅对其奢靡给出微渺之一瞥。其长老身服华衣，每夜饮宴，金玉满堂，畅饮甘醴，随心所欲；而我辈之长老年迈居于寒舍，常处贫贱之中，一场劫掠或一群羊群之失便陷于绝境。为何强者当甘于居世界之冰封边缘，而文明之软弱者居于温暖石屋之中，一无所缺？我等将驰骋穿越彼等之华堂，赐我长老彼世世代代所享有之一切！我等将夺其酒、其丝、其金与其女，然后彼等方知何为艰难之生活！'"
 me_xiongnu_2_10_title:0 "$xiongnu_missions_2_task_10$"
 me_xiongnu_2_11.a:0 "敬畏我伟大单于之威严！"
 me_xiongnu_2_11_desc:0 "又一件由龙城新获之中国工匠奴隶所制之金器已然完成；一顶灿丽之金冠，将戴于单于之首，象征他在中国人间之皇家地位，亦令其部众为之倾倒。从浩瀚草原至中国城邑，臣民皆将跪拜于冒顿之金冠前。"
 me_xiongnu_2_11_title:0 "$xiongnu_missions_2_task_11$"
 me_xiongnu_2_12.a:0 "龙城永为我精神家园。"
 me_xiongnu_2_12_desc:0 "对帝国之心与魂——#E 龙城#!——之祭祀修饰，已引发笼罩都城居民之一股新的宗教狂热。部民与工匠惊羡于庙宇之兴建，观视每日弥漫神秘气息之祭祀礼仪，深信自身已融入一项超越自身之伟业。与此同时，萨满阶层对其新居所与新地位极感满意，其对国之忠诚愈益深固。一切皆如所料……"
 me_xiongnu_2_12_title:0 "$xiongnu_missions_2_task_12$"
 me_xiongnu_2_13.a:0 "吐火罗人若明智，当俯首称臣。"
 me_xiongnu_2_13_desc:0 "塔克拉玛干之干热的沙漠气候，与北方草原骑兵格格不入——我辈在此沙漠中因损耗而失却许多亲爱族人，诸多战马渴死途中，军中亦有疑惑，何以我辈远涉至此而收获甚微。然，在远方地平线处，一座环树绕水、有城墙之巨大沙漠城市映入眼帘。劫掠与荣耀之幻景填满部众之幻想，士气为之一振。对此第一座城池之围攻对我远征队伍而言极为艰苦，然有若干中国工匠授我军以攻取有墙城镇之术。终于，在艰苦围攻后，我得胜之部落勇士得以尽享当初初见此绿洲城市时眼中所充满之种种幻想。"
 me_xiongnu_2_13_title:0 "$xiongnu_missions_2_task_13$"
 me_xiongnu_2_14.a:0 "此不过入主华夏之第一步…"
 me_xiongnu_2_14_desc:0 "燕之将帅试图在蓟城门外逃离战场，然惜乎，我铁骑更快，未待城门开启，便已将其斩于马下。整片乡野皆被焚荡，城市亦遭围困。最终，城中胡人奴隶应诺城内非中国居民可得幸免而叛变献城。然除彼等人命外，一无所存。城市被洗劫一空，数千人丧命，而燕王国之府库尽归单于，诸将分赏其勇士。此城所获之巨富，远胜任何一名匈奴部民生平所见，然而比此更富、更大之城尚在中原更深处。单于意犹未尽。"
 me_xiongnu_2_14_title:0 "$xiongnu_missions_2_task_14$"
 me_xiongnu_2_15.a:0 "善用此新得之地…"
 me_xiongnu_2_15_desc:0 "通古斯之地的酷寒森林与针叶林，令匈奴骑兵受到巨大损耗，加之此等民族悍烈之游击战术，更添艰难。单于绝不容忍这些鼠辈苟延若不彻底归降，他下令整村屠戮，尽掠一切值钱之物。唯有待彼等接受新主，单于方能充分榨取此新地之巨量自然资源，并从这些本就贫困之民身上榨取贡赋。"
 me_xiongnu_2_15_title:0 "$xiongnu_missions_2_task_15$"
 me_xiongnu_2_16.a:0 "单于所爱者，莫过于绝色女子…"
 me_xiongnu_2_16_desc:0 "中原诸王与诸侯终于对我辈有所察觉，携来美酒与美女以作馈赠。中国诸王室声称此等女子皆出自各邦王室之血统，每一位皆可为单于之妾室，更有诸多贵族女子可赐予我疆域辽阔、诸部并存之邦中各族首领。日久天长，中国妾室将成单于之爱宠。"
 me_xiongnu_2_16_title:0 "$xiongnu_missions_2_task_16$"
 me_xiongnu_2_17.a:0 "龙城乃堪配我王庭之城！"
 me_xiongnu_2_17_desc:0 "随着匈奴自中国人手中征服更多土地，并将其工匠带入朝廷，一来自某些被占城市之匠师阶层，携带着无数规划与想法，将把被称为龙城的杂乱帐幕之城，打造为一座真正的帝国之都。一座融合草原与中国建筑风格之宏伟皇宫，已浮现于规划图中，另重新设计了商贸区与马政场地。单于即刻批准了他们的辉煌构想，并为此举提供无限财力，而此等资财，大多取自这些匠师们已遭屠戮的亲族手中。"
 me_xiongnu_2_17_title:0 "$xiongnu_missions_2_task_17$"
 me_xiongnu_2_18.a:0 "我草原帝国不断西进。"
 me_xiongnu_2_18_desc:0 "我西方诸部之可厌部族，居然狂妄到自以为能与匈奴铁骑匹敌。凡意图在大乌拉尔山脉以东反抗我辈之一切联盟，其微末之望已烟消云散，而单于则打探着传说中遥远西极之富庶之地。一名阿里马斯普商人带来了西方巨富之证物——一口镌刻着雷神之像的雕花壶、若干铸有名为伊斯坎德尔的战神般君主之面的钱币，以及自其王室榨取而来之紫袍。其中一些器物与塔里木盆地诸城所见之物有相似之处，单于遂相信传说中之西方乃真实之地。西方的诱惑将在单于心中萦绕不去，然中国仍横亘于他面前。"
 me_xiongnu_2_18_title:0 "$xiongnu_missions_2_task_18$"
 me_xiongnu_2_19.a:0 "塔里木城邦已易其主。"
 me_xiongnu_2_19_desc:0 "塔克拉玛干沙漠周边之城邑，一座接一座，在残酷的围城战中尽归匈奴军队所有——龟兹、卡多塔、于阗，甚至固若金汤之疏勒，皆在雄伟单于面前陷落，此间当然也少不了中国工匠与穴攻兵之力。这些城镇中惊慌失措之居民从未见过如此战术，必将悔不当初未向单于和平归顺，盖在城破劫掠之际，成千上万人横死或被奴役。自其中某些城中所得之财富，甚至可与中国诸城之富豪相匹敌，尤以伟大之龟兹及其美玉为最。"
 me_xiongnu_2_19_title:0 "$xiongnu_missions_2_task_19$"
 me_xiongnu_2_1_desc:0 "当单于将最后一支箭射入一名逃亡月氏骑兵之背时，他按捺住了内心的亢奋。其部众已赢得此日，此刻正欢呼庆祝，边呐喊战号边了结逃窜之伤敌。不留任何俘虏。单于立于战场的尸山血海之中，沉思对月氏之胜对匈奴意味着什么，对他个人又意味着什么。他曾为这个伟大部族社会之囚徒，而今他引领一支军队，将其彻底夷为尘芥。月氏向西溃逃，遁入匈奴所知之范围外。征服东方诸地之愿景袭上单于心间，他遂掉转马头，背离欢呼之同伴，背离向西溃逃之月氏，开始向东驰骋而去。"
 me_xiongnu_2_1_title:0 "$xiongnu_missions_2_task_1$"
 me_xiongnu_2_2.a:0 "治权在我们的血脉中。"
 me_xiongnu_2_20.a:0 "吾等须更张目南望…"
 me_xiongnu_2_20_desc:0 "单于欣悦地看着陈列于他脚下各式奇形铜刀——此乃他最近又一次成功征伐不幸部族之战利品。单于命各部之冶铁匠集于其朝中，受若干匈奴匠师之管辖。他们将获准沿袭其祖先之文化传统，然而是为了满足单于及他日益刁钻的品味。或许我辈能在此神秘半岛上寻得更多的冶铁匠？"
 me_xiongnu_2_20_title:0 "$xiongnu_missions_2_task_20$"
 me_xiongnu_2_21.a:0 "对外围诸域之掌控依然牢固。"
 me_xiongnu_2_21_desc:0 "通过贿赂、许诺、联姻、交谊以及其他一切笼络手段，单于已能确保对此广阔疆域之掌控。他与每一位谋臣、每一位总督、每一个部族世家所建立之私人关系，令单于心安——因他无法在战斗中奋勇冲锋之时，对留在后方守护其辛苦得来之战果者的忠诚存有疑虑。当知悉身后无敌，面前之敌便易对敌得多了。"
 me_xiongnu_2_21_title:0 "$xiongnu_missions_2_task_21$"
 me_xiongnu_2_22.a:0 "朝鲜全境今已臣服于单于。"
 me_xiongnu_2_22_desc:0 "我主，神秘之辰韩半岛已悉数臣服！最后一员小诸侯已向我军呈递完全归降之书，承诺纳贡之使者正从乡野各处源源而来。甚至耽罗岛亦已屈膝称臣，盖彼等恐惧我辈将造巨船，乘马跨波踏浪而击其城邑。单于心下将此视为戏言，然而在朝堂之上，却以极为郑重之态向该岛之使节传达，若此岛胆敢背叛，此事将确凿无疑。"
 me_xiongnu_2_22_title:0 "$xiongnu_missions_2_task_22$"
 me_xiongnu_2_2_desc:0 "纵使五百代之后，部民仍将追忆此一时日，追忆#E 大单于冒顿#!。他们将凭单于冒顿生前所为之伟业，声称自己统治草原之合法性，并自称此草原第一位神祇之后裔。愿挛鞮之血，于千年中成为我后裔敌手之梦魇与恐吓。"
 me_xiongnu_2_2_title:0 "$xiongnu_missions_2_task_2$"
 me_xiongnu_2_3.a:0 "让我们继承格里芬之遗产。"
 me_xiongnu_2_3_desc:0 "单于在与被俘的格里芬人萨满交谈后，策马驰入巍峨之阿尔泰山中。他被告知一则传说：在冰雪覆盖之极高山顶，有金翅狮鹫看守着黄金，洞口之外则举行祭奉与牺牲。单于携其亲卫，发现了一处堆满宝石、青铜剑、护盾以及冰封祭牲的密藏。此地便是传说之所。单于毫不犹豫，手持火炬踏入洞穴。行数步后，单于驻足倒吸凉气。眼之所见，巨大之狮鹫颅骨冻结于他面前之岩壁与冰壁之中。火炬之光在壁上明亮闪耀，照出贯穿岩洞之条条金脉纹。单于喃喃念叨着腾格里与大狼之语，转身离开洞穴，禁绝任何人再入此洞，并命人每年在洞口献祭与供奉。"
 me_xiongnu_2_3_title:0 "$xiongnu_missions_2_task_3$"
 me_xiongnu_2_4.a:0 "胡人非我敌手。"
 me_xiongnu_2_4_desc:0 "胡人中最初几个可怜部落，在单于及其军队面前毫无招架之力。诸地迅速并入新的部落秩序之中，成千上万之胡人畜群加入我部。一场盛大的联姻仪式举行，胡人之女被许配给疆域内各部贵族，其中最出色者则留予单于本人。胡人男子将继续居其故地，产育牲畜以供匈奴军食，并在需要时提供人力。"
 me_xiongnu_2_4_title:0 "$xiongnu_missions_2_task_4$"
 me_xiongnu_2_5.a:0 "幽州之地，甚有可为…"
 me_xiongnu_2_5.b:0 "吾等须确保并州！"
 me_xiongnu_2_5.c:0 "雍州劫掠潜力最佳。"
 me_xiongnu_2_5_desc:0 "山马之斯基泰-戎人诸部，在我优势兵力与更高明之战术面前毫无抵抗之力。单于仍如初征般全神贯注地骑马陷阵，以刀与弓斩杀久经考验之草原猛士。彼等可悲之抵抗已遭粉碎，部众大宴庆祝，又一个民族被纳入日益壮大之联盟。单于心犹未足，每日清晨凝望东方之晨光，驱师向中国而进。"
 me_xiongnu_2_5_title:0 "$xiongnu_missions_2_task_5$"
 me_xiongnu_2_6.a:0 "匈奴共庆贤明之老上单于登位！"
 me_xiongnu_2_6_desc:0 "老上，我广袤帝国军政领袖中一颗冉冉升起之新星，竟敢挑战我辈之统治！据报他至少已获军中及部族议会中部分势力之支持。单于毫不迟延策马而出，急欲令一切指摘者噤声，并对此野心勃勃之后起者发起单挑。老上闻远处蹄声如雷，遂策骑迎接其主。当二人相遇，单于持手中华美之铜铁剑，向其敌挥出深重一击，斩于马身。单于驱马掠过，瞬时察觉自己腹部在淌血，那一击他竟毫无知觉。单于坠马失知，而老上亦随其重伤之马一同坠入尘土。当老上站起身来，回首望见单于之尸静卧地上。整个营地高呼老上之名，新一任挛鞮氏统治者遂继其先祖之号，统领匈奴令人畏惧之大军。"
 me_xiongnu_2_6_title:0 "$xiongnu_missions_2_task_6$"
 me_xiongnu_2_7.a:0 "辽阔之西草原今已敞开。"
 me_xiongnu_2_7_desc:0 "巴尔喀什湖沿岸诸部，绝非匈奴铁骑之敌。其沿湖广袤草原今已在我单于疆域之内，草原上又有更多氏族向其宣誓效忠。有趣者，这些部族言及遥远之西南方有巨大富庶，甚至声称我辈旧敌月氏中有部分已向南遁逃至彼处避难，以寻求传说中富庶之地。或许，我辈正是时候再向更远处出击……"
 me_xiongnu_2_7_title:0 "$xiongnu_missions_2_task_7$"
 me_xiongnu_2_8.a:0 "堪配单于之厚礼！"
 me_xiongnu_2_8_desc:0 "在最近一次劫掠后返回龙城王室朝廷时，单于在其巨帐入口附近，被一座金碧辉煌之雕像所震撼，此雕像乃为他在战斗中陨落的昔日爱马所立，由从广阔疆域各处征召而来之最优秀工匠所造。大单于诏令设宴，邀请匈奴联盟中所有主要组成部族之贵族至其殿中，慷慨将己之畜群分赏予部族贵族，并在宗教庙宇中献祭供奉。此举有两重目的——以恩赐笼络贵族之忠心，并以展示此雄伟金马来激励对其统治的敬畏与至尊之念。"
 me_xiongnu_2_8_title:0 "$xiongnu_missions_2_task_8$"
 me_xiongnu_2_9.a:0 "东草原之上，再无敌手。"
 me_xiongnu_2_90.a:0 "无人能逃匈奴之掌控。"
 me_xiongnu_2_90_desc:0 "千载间最伟大的草原领袖单于冒顿，今已执掌强大之匈奴联盟，是时候向四方之敌灌输恐惧了。我辈南、东、西三面之骑马民族，仍在抗拒我日益增长之威权，而中原丰饶之地恰在咫尺之外。我辈不能歇止，直至将次等民族并入我优越之联盟，并夺取华夏锦绣之地中真正之奖赏。"
 me_xiongnu_2_90_title:0 "匈奴扩张"
 me_xiongnu_2_9_desc:0 "东胡仅为阿尔泰山以东最后一个可能挑战我辈统治之主要草原部落联盟。在将其广阔大军击溃于旷野之后，联盟瓦解，诸组成部落逐一宣称效忠于大单于，并准许其地并入匈奴。我辈之新胡人兄弟言及正南方有一富庶辽阔之王国，向其进献诸多华美神秘之物入我朝廷。胡人甚至向单于进献了来自该伟大王国之奴隶与女子，低语南方之地所藏之巨富。自此时此刻起，大单于将竭力学习这些筑城者之战术文化，并痴迷于将中原纳入其统治。"
 me_xiongnu_2_9_title:0 "$xiongnu_missions_2_task_9$"
 xiongnu_02_final_mod:0 "草原主宰"
 xiongnu_2_speed_run_tt:0 "#Y 若我们完成$xiongnu_missions_2_task_21$，我们将保留此加成。#!"
 xiongnu_crown:0 "单于之冠"
 xiongnu_crown_desc:0 "一顶奇丽之金冠，饰以雄鹿与狼之纹样，兼融华夏金匠之卓绝技艺。此草原君王之头饰，乃举世无双之珍宝，凡见其戴于策马之人首者，无不敬畏战栗。"
 xiongnu_desert_mod:0 "沙漠求生"
 xiongnu_golden_horse:0 "匈奴金马"
 xiongnu_golden_horse_desc:0 "一匹金马，奉献予大单于冒顿之陨落坐骑。由被掳至匈奴宫廷之华夏金工铸造。"
 xiongnu_missions_2:0 "匈奴扩张"
 xiongnu_missions_2_BUTTON_TOOLTIP:0 "天下才刚刚开始感受到匈奴铁骑的威力！"
 xiongnu_missions_2_CRITERIA_DESCRIPTION:0 "此使命将于匈奴向四方出击、建立起辽阔草原帝国时完成。"
 xiongnu_missions_2_DESCRIPTION:0 "历史上，匈奴将于公元前三世纪后期统一于冒顿麾下——在其推翻其父头曼栾提之政变之后——旋即向[GetCountry('YEZ').GetName]复仇，继而吞并言说数十种语言之诸部加入匈奴联盟。向西、南、东三方，匈奴将吞噬一切敌对，并将整个东草原之威势倾泻于中夏之地，于公元前二世纪成功使汉朝称臣纳贡。重现并光大此段历史之时机已至。"
 xiongnu_missions_2_task_1:0 "征服月氏"
 xiongnu_missions_2_task_10:0 "征伐华夏"
 xiongnu_missions_2_task_10_DESC:0 "草原之敌已尽平定，我之资源因征伐而充溢，骏马已为战阵而繁育。吾等终有实力，令中夏领悟何为真正之恐怖。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 xiongnu_missions_2_task_11:0 "单于之金冠"
 xiongnu_missions_2_task_11_DESC:0 "我之征伐及与华夏之接触，令单于朝廷对精制之威仪物品产生喜好。当延聘异邦工匠，铸造一顶金冠，以激扬单于麾下无数臣民之敬畏与尊荣。\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 xiongnu_missions_2_task_11_artist:0 "我们至少拥有一省有艺术家。"
 xiongnu_missions_2_task_12:0 "中央圣所"
 xiongnu_missions_2_task_12_DESC:0 "自我大举征伐之前，龙城素为匈奴民族之精神心脏。以适合我新获财富之神圣奉献与仪典，将此帝国之都及至圣之城恭敬礼待。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 xiongnu_missions_2_task_13:0 "踏入沙漠"
 xiongnu_missions_2_task_13_DESC:0 "仅控制河西走廊贸易尚不足够，盖塔克拉玛干周边诸小邦与部落依然获利，而此利本当归我所有。当驰入沙漠绿洲之首区，以索取我之贡赋。\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 xiongnu_missions_2_task_13_claims:0 "吾等将获得对库伦达、科尔甘塔斯、巴拉巴、塔里木、北塔里木及南塔里木诸地之宣称。"
 xiongnu_missions_2_task_14:0 "横扫燕国"
 xiongnu_missions_2_task_14_DESC:0 "燕乃华夏战国中最北之一国，素来试图将我草原战术与华夏常规武力相融合。我辈断不可容其在我骑兵之上占得优势。劫掠雄城蓟，将为我部众提供足够之诱因——最美丽之女子与最精美之货物，皆当归单于所有。\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 xiongnu_missions_2_task_14_claims:0 "我们将获得对辽东、玄菟、临屯和乐浪地区的宣称。"
 xiongnu_missions_2_task_15:0 "东海岸"
 xiongnu_missions_2_task_15_DESC:0 "胡人之外，更有操通古斯语之诸部，坐落于大洋之畔。其地为寒林与冻原所据，由虽骁悍然较逊色之武士统辖，而彼等尚未领悟其林地与矿藏之价值。是时矣，当征服此等散乱之民，善用其资源。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 xiongnu_missions_2_task_15_conquer_provinces:0 "吾等将吞并我臣属所据有之全部省份，以及大鲜卑山东部、秽发、肃慎及乌苏里境内一切无主之省。"
 xiongnu_missions_2_task_16:0 "华夏姬妾"
 xiongnu_missions_2_task_16_DESC:0 "对华夏筑城者所课之代价之一，便是强令华夏公主嫁入匈奴宫廷——其中最美丽者充为单于之妃嫔，余者则赏予散布于辽阔多民族部落联盟中之贵族。今当自我华夏附庸之一，取一美艳公主入侍皇家宫室。\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 xiongnu_missions_2_task_16_we_get_concubine:0 "我单于将迎娶一位华夏女子，此女将极大提升其于我族中之威望。"
 xiongnu_missions_2_task_17:0 "单于之城"
 xiongnu_missions_2_task_17_DESC:0 "是时矣，当将龙城建为真正之城邑——不复仅为帐幕与牧场之地，而乃草原腹心之一座雄都，融游牧之风与华夏建筑之璀璨于一体。单于将自一座光辉四射之宝座，统御我辽阔疆土。\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 xiongnu_missions_2_task_18:0 "继续西征"
 xiongnu_missions_2_task_18_DESC:0 "征服巴尔喀什湖区，使我辈接触到更多草原部落。此等马背之民描述远方南国与西土中前所未闻之帝国之巨量财富。彼等近期劫掠之赃物，证实此等邦国之奢华富足，单于对此等威仪之品心驰神往。唯一之碍，在于此等部落挡于我军与彼未知帝国之间——然此障碍，不难化解……\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 xiongnu_missions_2_task_18_conquer_provinces:0 "我们将吞并所有属国拥有的省份，以及库伦达、科尔甘塔斯和巴拉巴的所有无主省份。"
 xiongnu_missions_2_task_19:0 "西塔克拉玛干"
 xiongnu_missions_2_task_19_DESC:0 "塔里木盆地绿洲城市的无尽财富如今已触手可及——他们的沙漠堡垒无法永远抵挡单于亚洲大军的威势。丝绸之路大城市的战利品将填满我们部民的钱袋，以及单于的财库。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 xiongnu_missions_2_task_1_DESC:0 "数百年来我们生存的祸根——[GetCountry('YEZ').GetName]——必须为他们背叛伟大的单于冒顿付出代价。时机已到，我们的铁蹄已备，终于要在这一地区终结我们最强大的对手。[GetCountry('YEZ').GetName]将被彻底消灭。\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 xiongnu_missions_2_task_1_claims:0 "我们将获得对敦煌、酒泉和张掖地区的宣称。"
 xiongnu_missions_2_task_2:0 "挛鞮王朝"
 xiongnu_missions_2_task_20:0 "进逼辰地"
 xiongnu_missions_2_task_20_DESC:0 "手持奇异青铜刀、操着闻所未闻的语言的民族，居住在我们最东端领地以南的丘陵半岛上。是时候让单于令这些奇特的民族臣服，向半岛上的居民征收贡赋、施以征服，并夺取他们的青铜宝藏。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 xiongnu_missions_2_task_20_claims:0 "我们将获得对马韩、南马韩、弁韩和辰韩地区的宣称。"
 xiongnu_missions_2_task_21:0 "从西到东"
 xiongnu_missions_2_task_21_DESC:0 "我们帝国的疆域从西到东如此辽阔，以至于我们几乎无法想象它的边界。我们必须确保帝国各个角落的稳固，确保各外族地区的总督们忠心耿耿。\n\n\n\n\n\n\n\n\n\n@tibet_mil6!"
 xiongnu_missions_2_task_21_all_governor_loyal:0 "我们所有的总督忠诚度高于70。"
 xiongnu_missions_2_task_21_all_officers_loyal:0 "我们所有的政府官员忠诚度高于70。"
 xiongnu_missions_2_task_22:0 "辰之半岛"
 xiongnu_missions_2_task_22_DESC:0 "不能再有独立的朝鲜——我们必须完成使命，征服该地区残存的独立国家，巩固我们面向浩瀚大海的整个东部陆地边界。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 xiongnu_missions_2_task_2_DESC:0 "冒顿从亚洲如此多样的民族中锻造出一个草原帝国，这一伟业证明了挛鞮氏血脉的活力。冒顿的后裔将永远作为有史以来最伟大的骑主的后代而受到敬畏和尊崇。\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 xiongnu_missions_2_task_3:0 "格里芬之金"
 xiongnu_missions_2_task_3_DESC:0 "据说我们西部边境的大山中有守护黄金的狮鹫居住——实际上，那不过是另一个独占阿尔泰山脉广袤财富的部落民族。我们将向他们证明他们不过是凡人，让他们屈服于单于的铁蹄之下。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 xiongnu_missions_2_task_3_claims:0 "我们将获得对科什卡尔科尔和布苏地区的宣称。"
 xiongnu_missions_2_task_4:0 "东胡"
 xiongnu_missions_2_task_4_DESC:0 "我们东面的胡人游牧民族继续挑战我们东部边境的完整性，并争夺戈壁和贝加尔湖以东的牧场。虽然他们曾作为我们与东胡联盟之间的缓冲，但我们再也无法忍受他们在我们边境的挑衅了。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 xiongnu_missions_2_task_4_claims:0 "我们将获得东胡所有省份的宣称。"
 xiongnu_missions_2_task_4_conquer_provinces:0 "我们将吞并所有属国拥有的省份，以及外贝加尔、巴彦温都尔、艾马克、弓卢、特里衮、漠东和乌兰朱赫的所有无主省份。"
 xiongnu_missions_2_task_5:0 "确保山马"
 xiongnu_missions_2_task_5_DESC:0 "对[GetCountry('YEZ').GetName]的毁灭性打击使我们成为河西走廊的主导力量，但这并不意味着该地区庞大的贸易财富完全掌握在我们手中。我们必须完全控制这条走廊以及中国与塔里木盆地吐火罗人之间蓬勃发展的丝绸之路贸易。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 xiongnu_missions_2_task_5_choose_claims:0 "我们将能够在多个宣称中选择。"
 xiongnu_missions_2_task_5_claims_1:0 "我们将获得幽州地区的宣称。"
 xiongnu_missions_2_task_5_claims_2:0 "我们将获得并州地区的宣称。"
 xiongnu_missions_2_task_5_claims_3:0 "我们将获得雍州地区的宣称。"
 xiongnu_missions_2_task_6:0 "老上"
 xiongnu_missions_2_task_6_DESC:0 "草原政治的运作需要我们持续对那些胆敢挑战单于统治的人展示武力，否则我们的统治将失去合法性。那些野心勃勃的部落精英可能会觊觎单于之位，除非我们让他们安分守己。\n\n\n\n\n\n\n\n\n\n@east_steppemil11!"
 xiongnu_missions_2_task_6_laoshang_challenges_ruler:0 "老上将挑战我们的统治者。"
 xiongnu_missions_2_task_6_laoshang_not_ruler:0 "老上尚非我们的统治者。"
 xiongnu_missions_2_task_6_modun_dead:0 "冒顿已死。"
 xiongnu_missions_2_task_7:0 "巴尔喀什湖"
 xiongnu_missions_2_task_7_DESC:0 "阿尔泰山以西便是广阔的巴尔喀什湖，湖周围分布着草原上最好的牧场和草地，正等待着我们。那些弱小的骑主们长期以来一直在争夺这片土地，而它远在南方大帝国势力范围之外。是时候将这片区域纳入我们不断扩张的帝国版图了。\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 xiongnu_missions_2_task_7_claims:0 "我们将获得对北山和焉耆地区的宣称。"
 xiongnu_missions_2_task_7_conquer_provinces:0 "我们将吞并所有属国拥有的省份，以及科什卡尔科尔和布苏的所有无主省份。"
 xiongnu_missions_2_task_8:0 "一匹金马"
 xiongnu_missions_2_task_8_DESC:0 "我们众多的征服已使黄金资源落入我们的掌控之中。让我们开采新矿，铸造一匹宏伟的金马来荣耀单于。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 xiongnu_missions_2_task_8_blacksmith_on_gold:0 "我们至少有一省拥有铁匠铺建筑。"
 xiongnu_missions_2_task_9:0 "毁灭东胡"
 xiongnu_missions_2_task_9_DESC:0 "东胡长期以来是我们东方最大的威胁——一个由蒙古语族民族主导的敌对骑主联盟。我们必须摧毁他们的领导层，将胡人中能征善战的勇士纳入我们日益壮大的草原帝国。\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 xiongnu_missions_2_task_9_claims:0 "我们将获得渔阳、右北平、辽西、大鲜卑山东部、秽发、肃慎和乌苏里等地区的宣称权。"
 xiongnu_sanctuary_mod:0 "中央圣所"
 xiongnu_speed_run:0 "风驰电掣"
 xiongnu_speed_run_reward:0 "草原骑术"

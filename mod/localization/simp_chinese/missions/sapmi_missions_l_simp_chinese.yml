l_simp_chinese:
 desc_integrated_fenns:0 "芬人与萨米人乃同源之族群，彼此互有重大价值。唯有团结一致，方能觅得力量。"
 desc_reorganised_sapmi_1:0 "斯奇里提尼亚之萨米部族首领，已推动趋向#E 集权#!之潮流。"
 desc_reorganised_sapmi_2:0 "斯奇里提尼亚之萨米部族首领，已推动趋向#E 分权#!之潮流。"
 desc_sapmi_final_mod:0 "今正当时，我伟大邦国当褪去区省小邦之朴衣，向懵然不觉之欧罗巴人倾泻我无上威势。"
 desc_sapmi_food_mod:0 "我邦在农耕与渔业方面之进步，使我邦得以仅凭稀缺之资源自给自足。"
 desc_sapmi_migrate_mod:0 "我邦海上之霸权，已在我疆界内酿成一种面对海洋之安全感，致使大批#E 波罗的人#!迁徙至我邦领土。"
 desc_sapmi_skirith:0 "斯奇里特部族对其土地适应极佳，能与其周遭环境浑然一体。传说雪花会低语。"
 desc_sapmi_trade_mod:0 "波罗的海贸易乃我民至为重要之贸易通道，由此孕育出专精与娴熟。"
 desc_tarand_grave_mod:0 "塔兰德墓冢乃#E 萨米#!人标志性之建筑，遍布于彼等所曾居住之诸区域。"
 integrated_fenns:0 "萨米与芬兰联盟"
 me_sapmi_1.a:0 "吾等将夺取海洋！"
 me_sapmi_10.a:0 "彼等无力阻挡！"
 me_sapmi_10_desc:0 "我辈已在#E 斯堪地亚#!之地展示了我族之坚韧与适应之能。全取#E 斯堪地亚人#!全境之准备，已然就绪。#E 斯堪地亚#!全境，不久将尽归#E 萨米#!所主宰！"
 me_sapmi_10_title:0 "$sapmi_missions_task_10$"
 me_sapmi_11.a:0 "芬人、埃斯特人、哥特人，无一能阻我前行。"
 me_sapmi_11_desc:0 "随着我辈掌控更多海岸线，#E 波罗的海为我内湖#!之梦想已近在眼前。我辈当继续沿此神圣之海岸线推进，不达#E 波罗的海#!即#E 萨米海#!之称谓易换，我辈绝不歇止。"
 me_sapmi_11_title:0 "$sapmi_missions_task_11$"
 me_sapmi_12.a:0 "彼等乃吾手足战友！"
 me_sapmi_12_desc:0 "#E 芬人#!虽与我族有异，却多有相似之处。况且彼等在雪地中之技艺及其对本土之适应力，足证彼等配享公民之待遇。让我辈缔结#E 芬人#!与#E 萨米#!之联盟，此盟约必将使敌人闻风丧胆。"
 me_sapmi_12_title:0 "$sapmi_missions_task_12$"
 me_sapmi_13.a:0 "整合诸部！"
 me_sapmi_13.b:0 "吾等不侵部落之权！"
 me_sapmi_13_desc:0 "我辈近来将我族宗教集中至都城周围之举措，已招致些许非议。随着权力自众人之手中缓慢转入酋长之掌控，一份正式之意图宣言实属必要。无论我辈如何抉择，持续之胜利必能争取民心。"
 me_sapmi_13_title:0 "$sapmi_missions_task_13$"
 me_sapmi_14.a:0 "白色死神不等人。"
 me_sapmi_14_desc:0 "我辈对#E 波罗的海#!之主宰及我族文化遍及#E 欧罗巴#!之影响，已为#E 萨米#!文明带来黄金时代。我辈之战法，令敌境之人心胆俱裂。彼等称之为#E 白色死亡#!。其名之骇人，几近实况之可怖！此等声望，必将助我辈踏入文明下一阶段，无论其为何。"
 me_sapmi_14_title:0 "$sapmi_missions_task_14$"
 me_sapmi_1_desc:0 "我辈必须主宰海洋！海乃我辈之命脉。商贾自海而来，食粮自海而入，皮毛自海而输。似我辈之民族，理当建一支配得上我辈需求之水师。此举亦将使我辈得以扩展影响力——若我辈有意为之——跨越汪洋。"
 me_sapmi_1_title:0 "$sapmi_missions_task_1$"
 me_sapmi_2.a:0 "强健之基，造就强健之民。"
 me_sapmi_2_desc:0 "我辈近来在农事上之努力，已使每一#E 萨米#!人腹中皆满盛鱼鲜！我辈所居之冬日冻土，虽食物稀疏，然人口将不再如此稀疏矣。"
 me_sapmi_2_title:0 "$sapmi_missions_task_2$"
 me_sapmi_3.a:0 "芬人之地将归我所有！"
 me_sapmi_300.a:0 "船长，小心航行。"
 me_sapmi_300_desc:0 "为探索#E 波罗的海#!，我辈必须为我水师中有经验之统领支付酬劳。船队之长须得报酬，然大海所蕴之诱惑及其或藏之奥秘，其价值远胜黄金。"
 me_sapmi_300_title:0 "$sapmi_missions_task_3$"
 me_sapmi_301.a:0 "相信你会善用这笔款项。"
 me_sapmi_301.b:0 "哈，要是雪能变金子，行啊。"
 me_sapmi_301_desc:0 "船员既已准备就绪，船长忽来面陈一项意外且——老实说——令人不快之请求。彼恳请再赐更多黄金。彼断言此举乃约束船员所必需，尤其对如此之远航而言。"
 me_sapmi_301_title:0 "$sapmi_missions_task_3$"
 me_sapmi_3_desc:0 "自#E 韦尔霍河#!与#E 穆斯塔河#!至#E 瓦因河#!，我船皆已驶遍。我对地形的认知与勘察之功，既足用又引人入胜。纵使此等领土属于#E 芬人#!……然此诸地尽在我水师能力之内。或许，此等地亦当归入我陆师之力所及。"
 me_sapmi_3_title:0 "$sapmi_missions_task_3$"
 me_sapmi_4.a:0 "万箭自雪渊而降。"
 me_sapmi_4_desc:0 "我#E 斯里基斯#!#E 萨米#!人，已极善适应环境。随着时光流转，我辈之能亦与日俱增。年少之#E 萨米#!人自幼受训，与雪融为一体。无人可与我辈之耐寒媲美，亦无人可在本土上与我辈之战力匹敌。"
 me_sapmi_4_title:0 "$sapmi_missions_task_4$"
 me_sapmi_5.a:0 "波罗的海乃我内湖。"
 me_sapmi_5_desc:0 "#E 波罗的海#!之贸易，乃我辈所必控之重器。我辈经济赖皮毛、驯鹿、禽鸟及我土特有之生物与物产之交易。控制全部贸易路线，则我辈获利倍增。于我辈所居之严酷环境，每一枚金币皆弥足珍贵。"
 me_sapmi_5_title:0 "$sapmi_missions_task_5$"
 me_sapmi_6.a:0 "愿吾等皆得死之荣光。"
 me_sapmi_6_desc:0 "#E 塔兰德墓#!之结构，遍布#E 卡尔米斯托马基#!与#E 伊尔曼杜#!各地。此乃我辈安葬亡者之典型方式。单人墓葬突出于地面，覆以滚石，常内置若干陪葬品。#E 蒂沃泰克#!乃委制一精美墓葬之绝佳地点，今我辈先祖将于来世享此荣光。"
 me_sapmi_6_title:0 "$sapmi_missions_task_6$"
 me_sapmi_7.a:0 "雪域之民，唯我独尊！"
 me_sapmi_7_desc:0 "#E 斯堪地亚#!之地，住着名为#E 斯堪地亚人#!的异族。然彼等似乎全然无力阻止我辈在这一地区的统治。此等新土，令我辈想起故乡；亦如故乡一般，我辈可在此无阻碍地扩展势力。"
 me_sapmi_7_title:0 "$sapmi_missions_task_7$"
 me_sapmi_8.a:0 "吾等将自白色家园带来死亡。"
 me_sapmi_8_desc:0 "征服#E 韦尔霍河#!与#E 瓦因河#!之间#E 芬人#!之壮举，当向世人昭示#E 萨米#!之伟岸。为我辈之胜绩所激励，我辈目光转向#E 波罗的海#!沿岸。全海当为我辈所有！"
 me_sapmi_8_title:0 "$sapmi_missions_task_8$"
 me_sapmi_9.a:0 "啊，伟大的伊尔玛，指引我等前行。"
 me_sapmi_9_desc:0 "在都城行省建一座集中之圣所，将使我民更感与#E 伊尔玛#!及众神祇之亲近。#E 塔兰德墓#!群亦已附建于此。我辈都城日益集权，然我辈之灵魂仍如暴风雪般狂野不羁。"
 me_sapmi_9_title:0 "$sapmi_missions_task_9$"
 reorganised_sapmi_1:0 "中央集权部落"
 reorganised_sapmi_2:0 "分权部落"
 sapmi_final_mod:0 "白色死神降临欧陆"
 sapmi_food_mod:0 "养活吾民"
 sapmi_migrate_mod:0 "波罗的海迁徙"
 sapmi_missions:0 "巡狩雪原"
 sapmi_missions_BUTTON_TOOLTIP:0 "那就让我们巡狩雪原吧！"
 sapmi_missions_CRITERIA_DESCRIPTION:0 "此任务将在以下条件完成后结束："
 sapmi_missions_DESCRIPTION:0 "冰封雪覆之地，遍布冻湖与白茫茫之旷野，以及居住于此之[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]族[SCOPE.GetRootScope.GetCountry.GetName|E]部落。切勿误以为地广人稀便可轻侮。[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]人是捕捉猛禽之高手，是驯牧驯鹿之行家，且能在懦夫绝不敢涉足之地繁荣生息。"
 sapmi_missions_task_1:0 "建设水师"
 sapmi_missions_task_10:0 "斯堪的亚征服"
 sapmi_missions_task_10_DESC:0 "吾等殖民#T斯堪迪亚#!之成功，激发吾人主宰此地之雄心。必将整片#T斯堪迪亚#!之地尽归吾族所有！\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 sapmi_missions_task_10_claims:0 "我们将获得斯堪的亚地区的宣称。"
 sapmi_missions_task_11:0 "波罗的海主宰"
 sapmi_missions_task_11_DESC:0 "波罗的海域乃强权之适居之所。鉴于近来游牧与日耳曼诸部之窥伺，吾等必当竭力守护海岸，并确立对其沿岸之霸主地位！\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 sapmi_missions_task_11_claims:0 "我们将获得对鲁吉亚、法罗得尼亚、约基、佳科沃和苏奥诺地区的宣称。"
 sapmi_missions_task_12:0 "整合芬恩人"
 sapmi_missions_task_12_DESC:0 "芬人者，居于我方以南茂密森林中之民也，其地无其他萨米人居处。其所居之地，依制当属我所有。宜将其融入吾人社会，以便从此等林泽中获利。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 sapmi_missions_task_13:0 "重整部落"
 sapmi_missions_task_13_DESC:0 "自由之于尝过奴役之苦者，最为甘美。当为自主而奋争，挣脱过往之桎梏！萨米人必将自由。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 sapmi_missions_task_14:0 "人民之地"
 sapmi_missions_task_14_DESC:0 "虽军事与行政诸务成就斐然，然国家认同之问题正于吾人社会中缓缓酝酿。吾等必当确保我文化之至上地位，继续向四方开拓。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 sapmi_missions_task_14_claims:0 "我们将获得希珀伯利亚地区的宣称。"
 sapmi_missions_task_14_culture_group:0 "省份主流文化属于芬尼语群。"
 sapmi_missions_task_1_DESC:0 "我部落在强邻环伺之下，或显微不足道。然必建立舟师，以争取并拱卫我之独立！\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 sapmi_missions_task_1_admiral_martial_8:0 "我们有一位军事能力至少为8的海军将领。"
 sapmi_missions_task_2:0 "农耕社群"
 sapmi_missions_task_2_DESC:0 "我国之经济，以渔猎农耕为本。明智之举，在于保障新辟之财源，从而为繁荣国家奠定坚实之基。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 sapmi_missions_task_3:0 "探索波罗的海"
 sapmi_missions_task_3_DESC:0 "应当建立一支探险船队，纵横波罗的海，为我殖民之雄心寻觅良机。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 sapmi_missions_task_3_claims:0 "我们将获得对上伊尔曼杜、下伊尔曼杜和韦尔霍地区的宣称。"
 sapmi_missions_task_4:0 "斯基里思之发展"
 sapmi_missions_task_4_DESC:0 "为求生存，必须随世而变。日月推移，我穿行雪原、匿迹于皑皑之中、克敌制胜之能，必将日渐精进。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 sapmi_missions_task_5:0 "掌控波罗的海贸易"
 sapmi_missions_task_5_DESC:0 "波罗的海之鱼滋养吾民，其波涛导我至异邦珍宝。然其尚有另一重要之任，盖此乃我商贸交易之海域。当于国中要邑设立市集，以便掌控贸易。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 sapmi_missions_task_5_three_baltic_ports:0 "我们至少有三座波罗的海港口有商人特殊人口。"
 sapmi_missions_task_6:0 "敬奉先祖"
 sapmi_missions_task_6_DESC:0 "称为#E蒂沃泰克#!之地，实乃兴建#E#Y塔兰德墓#!#!之绝佳处所，此乃我族标志性之葬仪。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 sapmi_missions_task_6_high_priest_zeal_7:0 "我们有一位狂热技能至少为7的大祭司。"
 sapmi_missions_task_7:0 "殖民斯堪的亚"
 sapmi_missions_task_7_DESC:0 "海之彼岸，有一方名为#T斯堪迪亚#!之土地。如同我故土一般，其地酷寒、湖泊密布，正待我前往收取。当以在家园所学之能，向西拓张势力。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 sapmi_missions_task_7_claims:0 "吾等将获得对锡索尼亚、绥奥尼亚、东哥特、西哥特及赫鲁利亚诸地之宣称。"
 sapmi_missions_task_8:0 "芬恩人的白色死神"
 sapmi_missions_task_8_DESC:0 "是时矣，我泱泱大国当脱去谦逊行省之衣装，向毫无防备之芬人倾泻我雷霆之威。日后诸多征伐，将传颂我军威之史诗。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 sapmi_missions_task_8_claims:0 "我们将获得对图戎提亚、克罗诺尼斯和加林迪亚地区的宣称。"
 sapmi_missions_task_9:0 "中央圣所"
 sapmi_missions_task_9_DESC:0 "继往开来，继续我族劝化民众之途，须奋力前行，兴建一处祭司云集之新中央圣所，以昭示我矢志不渝、无可遏止之壮大！\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 sapmi_skirith:0 "斯基里思之发展"
 sapmi_trade_mod:0 "波罗的海贸易"
 tarand_grave_mod:0 "塔兰德墓"

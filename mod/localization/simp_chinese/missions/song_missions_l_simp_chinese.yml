l_simp_chinese:
 court_of_song:0 "宋国王庭"
 desc_court_of_song:0 "待补"
 desc_song_confucius_mod:0 "待补"
 desc_song_final_mod:0 "待补"
 desc_song_king_zhou_mod:0 "待补"
 desc_song_mozi_mod:0 "伟大墨翟之哲思与教诲，已奇迹般改善了我邦子民之心境。"
 desc_song_secured_succ:0 "待补"
 desc_song_zhuangzi_mod:0 "一种颂赞智识成就之欣悦精神，弥漫于我举国上下。"
 desc_trade_policy_song_1:0 "举国专注出口珍贵商货。"
 desc_trade_policy_song_2:0 "举国专注进口珍贵商货。"
 me_song_ws_1.a:0 "让他们慢慢等吧！"
 me_song_ws_10.a:0 "韩将是下一个覆灭者"
 me_song_ws_10.b:0 "必须尽早解决秦人"
 me_song_ws_10.c:0 "前路在魏"
 me_song_ws_10.d:0 "腐朽之楚将在吾军前土崩瓦解"
 me_song_ws_10_chu_claims:0 "吾将获取楚国所有省份之宣称。"
 me_song_ws_10_desc:0 "[ROOT.GetCountry.GetRuler.GetName]既已成功消灭[GetCountry('QII').GetName]之威胁，我尊敬之[ROOT.GetCountry.GetRulerTitle]可将[ROOT.GetCountry.GetRuler.GetHerHis]注意力转向其余劲敌之一。\n\n一旦做出决定，我辈将向敌人宣告我辈之领土主张，并整军备战，以待即将到来之交锋。"
 me_song_ws_10_han_claims:0 "吾将获取韩国所有省份之宣称。"
 me_song_ws_10_qii_claims:0 "吾将获取齐国所有省份之宣称。"
 me_song_ws_10_title:0 "$song_missions_task_10$"
 me_song_ws_10_wei_claims:0 "吾将获取魏国所有省份之宣称。"
 me_song_ws_11.a:0 "天命归我！"
 me_song_ws_11_desc:0 "凡以为[ROOT.GetCountry.GetName]不能击败角逐#E 中原#!之诸多强敌者，实为大谬，因其忽略一事：即[ROOT.GetCountry.GetRuler.GetName]，那位坐镇[ROOT.GetCountry.GetCapital.GetName]之凯旋[ROOT.GetCountry.GetRulerTitle]。\n\n彼等轻蔑[ROOT.GetCountry.GetRuler.GetFirstName]之辈，可在镣铐中反省其愚昧，因都城之狱中已填满废黜之王与败北之将——凡胆敢兴兵对抗[ROOT.GetCountry.GetName]者尽在其中。而今，再无挑战者存焉，永世荣耀之刻，已在眼前。"
 me_song_ws_11_title:0 "$song_missions_task_11$"
 me_song_ws_12.a:0 "我治下真乃圣贤先知之地"
 me_song_ws_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]治下最重大之决策之一，乃颁行[GetCharacter('(int32)524').GetName]之著作。[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]命令书府与学宫遍藏[GetCharacter('(int32)524').GetFirstName]之卷轴，且一如所料，此大贤之教义已广为国民所研习。\n\n赖#E 墨子之言#!深入人心，我邦子民已为未来任何变局做好准备。"
 me_song_ws_12_title:0 "$song_missions_task_12$"
 me_song_ws_13.a:0 "且看你新官上任如何施为"
 me_song_ws_13_desc:0 "[GetCharacter('(int32)659').GetName]，此一奇人，既得众多仰慕者，亦树敌相当，近年来在[ROOT.GetCountry.GetCapital.GetName]之朝廷中声名日显，已引起[ROOT.GetCountry.GetRuler.GetName]之注意。\n\n经数次私下询访后，[ROOT.GetCountry.GetRuler.GetFirstName]委任[GetCharacter('(int32)659').GetFirstName]于#E 宗教事务司#!担任要职，以尽其才学。众人对[GetCharacter('(int32)659').GetFirstName]寄予厚望，然此贤老已全心投入新任，冀得王室恩宠。\n\n此实验之初效颇为可喜，因[GetCharacter('(int32)659').GetFirstName]声称已有突破。"
 me_song_ws_13_title:0 "$song_missions_task_13$"
 me_song_ws_14.a:0 "愿此微薄之献为宋国增光"
 me_song_ws_14_desc:0 "无与伦比之[GetCharacter('(int32)659').GetName]年事虽高，却未显丝毫倦怠之迹；彼不仅于#E 宗教事务司#!恪尽职守，且坊间久传[GetCharacter('(int32)659').GetFirstName]于闲暇之余尚在著书立说。\n\n当[ROOT.GetCountry.GetRuler.GetName]闻悉此书——即所谓《#E 庄子#!》——[ROOT.GetCountry.GetRuler.GetSheHe]遂令拨重金赐予此老怪人，欲将此卷轴收入[ROOT.GetCountry.GetName]之宝库。数日后，卷轴抵达[ROOT.GetCountry.GetCapital.GetName]，并附有[GetCharacter('(int32)659').GetFirstName]亲笔之便笺。"
 me_song_ws_14_title:0 "$song_missions_task_14$"
 me_song_ws_15.a:0 "宋之吉时！让他们为我所用"
 me_song_ws_15_desc:0 "赖[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetName]全境广建农庄之努力，我辈不仅扩充了此区域之贸易，且见人口亦有增长。新到之自由民及农家子弟在农闲时节涌入[ROOT.GetCountry.GetCapital.GetName]寻找机遇，城邑日见繁盛。"
 me_song_ws_15_title:0 "$song_missions_task_15$"
 me_song_ws_16.a:0 "投入愈多，机遇愈多"
 me_song_ws_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已督令我邦之土木匠师倾力于各城修筑广阔市集，而今工程既毕，[ROOT.GetCountry.GetRuler.GetSheHe]所预言之事如愿成真；异国商贾，慕我邦之潜力与实力，已迁居我国，携其财富与人脉而来。"
 me_song_ws_16_title:0 "$song_missions_task_16$"
 me_song_ws_17.a:0 "将货物售予外邦更为明智"
 me_song_ws_17.b:0 "凡可入口之奢物，尽皆引进"
 me_song_ws_17_desc:0 "[ROOT.GetCountry.GetRuler.GetName]之贸易政策，在吸引才俊涌向[ROOT.GetCountry.GetCapital.GetName]方面已收奇效，往来城门之商贾与行旅络绎不绝。\n\n无人对此口出怨言，因[ROOT.GetCountry.GetRuler.GetFirstName]已为城中居民带来巨量财富。始终不忘经济之重要，[ROOT.GetCountry.GetRulerTitle]已决意就市集颁布新令。"
 me_song_ws_17_title:0 "$song_missions_task_17$"
 me_song_ws_1_desc:0 "果勇之[ROOT.GetCountry.GetRuler.GetName]不仅成功夺取[GetProvince('(int32)8428').GetName]城，更昭告天下：[ROOT.GetCountry.GetName]之军不会止步于此，而将继续往[ROOT.GetCountry.GetRulerTitle]所遣之处——此宣告激怒了[GetCountry('LUU').GetRuler.GetName]。\n\n[GetCountry('LUU').GetRuler.GetFirstName]已遣使奔赴[ROOT.GetCountry.GetCapital.GetName]，警告不得再有冒进之举。'窃贼，当以所得为满足！汝之贪婪或令汝失足。'[GetCountry('LUU').GetRuler.GetFirstName]之使者公然不屑。'我可断言，诸多他方正伺汝倾覆……'"
 me_song_ws_1_title:0 "$song_missions_task_1$"
 me_song_ws_2.a:0 "彼之虚弱正是可乘之机"
 me_song_ws_2_desc:0 "虽[GetCountry('CHU').GetName]之[GetCountry('CHU').GetRuler.GetName]一直在内行改革，然其收效未如其愿之速，且其军旅在战场上屡战屡败，致其领土沦丧。\n\n[ROOT.GetCountry.GetRuler.GetName]从不放过如此良机，已连续为[ROOT.GetCountry.GetName]之人民带来胜利，国人渐觉新日或将临焉。"
 me_song_ws_2_title:0 "$song_missions_task_2$"
 me_song_ws_3.a:0 "不知明日如何，但今日我心安然"
 me_song_ws_3_desc:0 "善用[ROOT.GetCountry.GetRuler.GetHerHis]之崇高正统及周围之人对[ROOT.GetCountry.GetRuler.GetHerHim]之效忠，绝非易事，然[ROOT.GetCountry.GetRuler.GetName]得以从容化解此难题。\n\n赖[ROOT.GetCountry.GetRulerTitle]之努力，继嗣之棘手难题，似在成为祸端之前多年前即已解决——此实为待继大统者之福音。"
 me_song_ws_3_title:0 "$song_missions_task_3$"
 me_song_ws_4.a:0 "此宴非为奢靡，实为要务"
 me_song_ws_400.a:0 "吾等有资财；来，取走吧"
 me_song_ws_400_desc:0 "[ROOT.GetCountry.GetRuler.GetName]既决意在[ROOT.GetCountry.GetCapital.GetName]举办盛宴，以表彰效力于[ROOT.GetCountry.GetName]之诸多贤才，遂已着手筹备迎接我辈非凡之宾客。一如诸事，此必耗巨资，然[ROOT.GetCountry.GetRulerTitle]之决心不可动摇。"
 me_song_ws_400_title:0 "朝廷之费"
 me_song_ws_401.a:0 "佳音也，卿相——谢你告知"
 me_song_ws_401_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，约一月后，部分宾客将抵达[ROOT.GetCountry.GetCapital.GetName]参加此特殊盛宴。我辈已接驿马来报，知悉其行程将近，我等已准备就绪！"
 me_song_ws_401_title:0 "贵客将至"
 me_song_ws_402.a:0 "丞相应得此荣"
 me_song_ws_402.b:0 "我要侍卫长在侧"
 me_song_ws_402_desc:0 "[ROOT.GetCountry.GetName]之卿相与谋臣，已抵达[ROOT.GetCountry.GetCapital.GetName]，旅途劳顿，而华美盛宴正为彼等预备中，热水浴亦已备妥。数时辰后，待彼等精神恢复，便将与[ROOT.GetCountry.GetRuler.GetName]同席共宴。\n\n然尚有一事待决；谁能获得坐于[ROOT.GetCountry.GetRuler.GetFirstName]身旁之殊荣？此必为年度盛事，宴上显赫之座席将被视为王室恩宠之象征。"
 me_song_ws_402_title:0 "居我右席"
 me_song_ws_403.a:0 "宴上论天命之事"
 me_song_ws_403.b:0 "借此与内臣叙旧"
 me_song_ws_403_desc:0 "经数月奔走与幕后筹划，宾客终抵[ROOT.GetCountry.GetCapital.GetName]之朝堂，盛宴至此已获极大成功。舞者与杂技艺人在聚齐之精英面前献上令人叹为观止之表演，当彼等随着铜锣声退下时，众多精美佳肴已奉至宾客面前，众人饱啖炙肉、炒饭，以米酒解渴。\n\n众多陪臣欲与[ROOT.GetCountry.GetRuler.GetName]交谈，然[ROOT.GetCountry.GetRulerTitle]可惜无暇与每人对谈。消化不良之际，我辈当谈何话题？"
 me_song_ws_403_title:0 "妙趣对谈"
 me_song_ws_404.a:0 "恳请务必；吾等须重学术"
 me_song_ws_404.b:0 "凡事须心怀天道"
 me_song_ws_404.c:0 "我发现，平衡之道最为上策"
 me_song_ws_404_desc:0 "宴会将终之际，[ROOT.GetCountry.GetRuler.GetName]想起[ROOT.GetCountry.GetRuler.GetSheHe]照例当发表演说；此番话语将为在座诸公未来之行动定下基调。\n\n众人目光齐聚[ROOT.GetCountry.GetRuler.GetFirstName]，[ROOT.GetCountry.GetRuler.GetSheHe]清了清喉咙，举起了米酒杯。[ROOT.GetCountry.GetRuler.GetSheHe]将向齐聚之众传授何等睿智之言？[ROOT.GetCountry.GetRuler.GetHerHis]。"
 me_song_ws_404_title:0 "抉择之际"
 me_song_ws_4_desc:0 "宾客渐次离开[ROOT.GetCountry.GetCapital.GetName]之际，[ROOT.GetCountry.GetRuler.GetName]有诸多事务需在为其所设之宴后深思。都城之喧攘活动为我市集带来滚滚钱币，亦引才俊之士踏足我门——此乃款待贵族及其随从之意料外之收获，然绝非不受欢迎。\n\n[ROOT.GetCountry.GetName]实为非凡之地，此秀丽之邦及其居民，值得深研——[ROOT.GetCountry.GetRuler.GetFirstName]在力求成为一位好[ROOT.GetCountry.GetRulerTitle]时，始终谨记此点。纵然[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏不乏诋毁者，无人能言[ROOT.GetCountry.GetRuler.GetFirstName]未认真履行[ROOT.GetCountry.GetRuler.GetHerHis]之职责。"
 me_song_ws_4_title:0 "$song_missions_task_4$"
 me_song_ws_5.a:0 "我亦心向往之，欲谒先师孔子之墓"
 me_song_ws_5_desc:0 "夺取[GetProvince('(int32)8533').GetName]为[ROOT.GetCountry.GetName]之人民带来无上荣耀与声誉，我辈以对被征服者之宽仁而闻名。#E 孔子墓#!既未遭侵伐之师破坏，亦未被洗劫，而是受到了至为尊崇之礼遇。\n\n[ROOT.GetCountry.GetRuler.GetName]久仰至圣先师之智慧，期盼能得数周之暇，使[ROOT.GetCountry.GetRuler.GetSheHe]亲赴曲阜朝圣。"
 me_song_ws_5_title:0 "$song_missions_task_5$"
 me_song_ws_6.a:0 "凡利[ROOT.GetCountry.GetName]者，我必竭尽所能"
 me_song_ws_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]一直不愿与[ROOT.GetCountry.GetName]之征召兵正面会战，宁可蓄我精锐以待真正需要之时。\n\n而今[ROOT.GetCountry.GetRuler.GetFirstName]既已结得强力之外援，我辈之势已足，可与我辈新友公开商议如何共分所将征服之地。\n\n[ROOT.GetCountry.GetCapital.GetName]中人人皆知此乃暂时便宜之计，然无不为我[ROOT.GetCountry.GetRulerTitle]之远见而喝彩。"
 me_song_ws_6_title:0 "$song_missions_task_6$"
 me_song_ws_7.a:0 "终于，我将以己之成就闻名于世"
 me_song_ws_7_desc:0 "足堪[ROOT.GetCountry.GetRuler.GetHerHis]自傲者，[ROOT.GetCountry.GetRuler.GetName]经多年奋求成为一贤德之君后，终已恢复[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之名誉。[ROOT.GetCountry.GetName]之民已宽恕[ROOT.GetCountry.GetRuler.GetFirstName]先祖之错失，庶民不再将[ROOT.GetCountry.GetRulerTitle]比作#E 商纣王#!。"
 me_song_ws_7_title:0 "$song_missions_task_7$"
 me_song_ws_8.a:0 "此非胆怯者之时代…"
 me_song_ws_8_desc:0 "我凯旋之师已为[GetCountry('WEI').GetName]之民带来毁灭与苦难，彼等本已岌岌可危之地位，已沦至更惨淡之境地。我辈夺取其所踞之城邑与行省，直如利刃插入其心脏，楔穿其国境；此致命之伤，彼等永难复苏。\n\n如秃鹫环伺战场，魏之诸多敌人准拟在彼残余领土之尸骸上分食。"
 me_song_ws_8_title:0 "$song_missions_task_8$"
 me_song_ws_9.a:0 "迈向更宏大之事…"
 me_song_ws_99.a:0 "我将洗刷污名，重振荣光"
 me_song_ws_99_desc:0 "不幸[ROOT.GetCountry.GetName]之民，近年已饱受磨难，其统治者为一群挥霍无度之昏庸之辈，将国家宝贵资源浪费于浮华——与恶名昭彰之#E 商纣王#!无异。\n\n此等局面已使[ROOT.GetCountry.GetRuler.GetName]之声誉受损，欲克服当前之难题，需下极大功夫；我辈四面环敌，彼等觊觎我城，而庶民之心未全归附。\n\n愿诸神庇佑[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏，使我辈得以存续！"
 me_song_ws_99_title:0 "败劣之名"
 me_song_ws_9_desc:0 "[ROOT.GetCountry.GetRuler.GetName]久以善外交而受尊敬，然近来[ROOT.GetCountry.GetRuler.GetSheHe]亦被赞为可畏之战士，全赖[ROOT.GetCountry.GetName]之征召兵在东方诸小城所赢之诸多胜利。彼等无力抵御我师，遂逐一屈服于大势，为其兵开启城门。\n\n此等战事几近形式之举——[ROOT.GetCountry.GetRuler.GetFirstName]从未真正视国家处于危境，而将此诸役比作收拾顽童肆虐后凌乱之游戏室——一场易於清理之狼藉。"
 me_song_ws_9_title:0 "$song_missions_task_9$"
 price_support_primary_heir_cost_modifier:0 "支持储君花费"
 song_confucius_mod:0 "孔子墓"
 song_final_mod:0 "宋之战邦"
 song_king_zhou_mod:0 "商纣王之声名"
 song_missions:0 "永恒荣耀之歌"
 song_missions_BUTTON_TOOLTIP:0 "高唱吾族之歌——一曲胜利的军乐！"
 song_missions_CRITERIA_DESCRIPTION:0 "此任务将于[ROOT.GetCountry.GetName]之民击败周边诸国、从而#E 统一中国#!之时完成。"
 song_missions_DESCRIPTION:0 "[ROOT.GetCountry.GetName]之国，地处要冲，正宜周旋于#E战国#!诸雄之政局与纷争之间，而[ROOT.GetCountry.GetRuler.GetName]尽趁其便，于列王致命之博弈中未尝退避。\n\n强敌环伺——[GetCountry('CHU').GetName]、[GetCountry('QII').GetName]、[GetCountry('QIN').GetName]——莫不欲见我师败绩于沙场，[ROOT.GetCountry.GetCapital.GetName]向其纳贡称臣，然我[ROOT.GetCountry.GetRulerTitle]不识降服求饶之曲调——吾等必将超越群伦，凯旋而归！"
 song_missions_task_1:0 "完成未尽之业"
 song_missions_task_10:0 "退齐"
 song_missions_task_10_DESC:0 "若吾等能挫败[GetCountry('QII').GetName]经略其南方属土之图谋，则有比威名与荣耀更为丰厚之赏赐以待[ROOT.GetCountry.GetRuler.GetName]——[ROOT.GetCountry.GetRuler.GetHerHis]将获授权，向[ROOT.GetCountry.GetRuler.GetHerHis]所选之敌国兴师讨伐。\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 song_missions_task_10_choose_claims:0 "我们将能够选择对一个战邦的宣称。"
 song_missions_task_11:0 "战邦"
 song_missions_task_11_DESC:0 "谁能预见[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏竟能引领[ROOT.GetCountry.GetName]之民至于此境？于万难之中，吾等战胜了远超己方之大军——诚然，[ROOT.GetCountry.GetRuler.GetName]乃天授神启之领袖！\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 song_missions_task_12:0 "墨子之言"
 song_missions_task_12_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]素来尊崇且践行哲人#Y墨子#!之训诫，诚然，若非圣哲之教诲，[ROOT.GetCountry.GetName]之民断无今日之强盛。\n\n今我处可弘扬墨翟之道之地位，已颁令于[ROOT.GetCountry.GetCapital.GetName]，将#E兼爱#!之教广布国中。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil1!"
 song_missions_task_13:0 "庄周"
 song_missions_task_13_DESC:0 "[GetCharacter('(int32)659').GetName]乃才华卓绝之士，[ROOT.GetCountry.GetName]若能令此行为乖异之老臣执掌宗教进阶之学，诚有益于国。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 song_missions_task_14:0 "庄子"
 song_missions_task_14_DESC:0 "虽保守之士对[GetCharacter('(int32)659').GetName]颇有怨言，谓其与道家过从甚密，然此杰出之哲人与学者仍在其位恪尽职守。\n\n甚至有传言称，此位大师正缓缓将其所思编纂成册，一部能让后世子孙分享其睿智隽语之典籍。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 song_missions_task_15:0 "粮食供应"
 song_missions_task_15_DESC:0 "我朝蒙赐广袤沃野与壮美畜群，然不可仅恃[ROOT.GetCountry.Custom('get_harvest_goddess')]之馈赠——是时宜当勤力耕耘，以确保粮食供应之稳固。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 song_missions_task_16:0 "培育市场"
 song_missions_task_16_DESC:0 "若欲国富民殷，有资可投于邦国与军队，则必当竭力确保诸城蕃兴商贾。宜于国中广建市集、增设商路！\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 song_missions_task_16_port_with_commercial_district:0 "我们至少有一座港口拥有商业区。"
 song_missions_task_17:0 "贸易政策"
 song_missions_task_17_DESC:0 "仰赖[ROOT.GetCountry.GetRuler.GetName]运筹[ROOT.GetCountry.GetName]经济之努力，我朝贸易之策不断以银钱充盈王家府库。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 song_missions_task_1_DESC:0 "北方诸蕞尔小邦，实为心腹之患，甚于厨中萦绕之蝇蚋，然[GetProvince('(int32)8428').GetName]之陷落已然证明，凡虫豸之属，无论大小与锋芒，皆可捻灭。时至今日，当毕其功于一役，彻底铲除诸小领主。\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 song_missions_task_2:0 "扑袭楚国"
 song_missions_task_2_DESC:0 "[GetCountry('CHU').GetRuler.GetFamilyDisplayAdjective]氏之家——即[GetCountry('CHU').GetName]之王——其邪恶与腐化，其邻邦无不洞悉，久盼见此暴君受挫。\n\n百姓呼求正义，必将褒赏[ROOT.GetCountry.GetRuler.GetName]将楚置于应有之地——吾等必当予以惩戒。\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 song_missions_task_3:0 "继承之争"
 song_missions_task_3_DESC:0 "虽我朝所行之#Y兄终弟及#!继承法，可追溯至#T商朝#!之神圣岁月，然[ROOT.GetCountry.GetName]国内已有改弦更张之声，而此番[ROOT.GetCountry.GetRuler.GetName]亦附和其议；更张法度之时机已至。\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 song_missions_task_3_no_pretender_lower_than_60_loyalty:0 "没有觊觎者的忠诚度低于60。"
 song_missions_task_4:0 "奢靡之王"
 song_missions_task_4_DESC:0 "某些君王吝于将军资之外耗费帑金，然[ROOT.GetCountry.GetRuler.GetName]乃开明之君，深知于朝堂之上容留敢言直谏之士之裨益。[ROOT.GetCountry.GetRulerTitle]已传诏召集四方俊彦齐集[ROOT.GetCountry.GetCapital.GetName]，共商[ROOT.GetCountry.GetName]未来之走向。\n\n#Y此举将开启一连串事件。#!\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 song_missions_task_5:0 "孔子墓"
 song_missions_task_5_DESC:0 "[GetProvince('(int32)8533').GetName]有两事引以为豪：其为圣人#E孔夫子#!之诞生地，亦为其长眠之所。今我得据有这座声名显赫之城及其卓著陵墓，[ROOT.GetCountry.GetName]之民正为此成就欢呼不已。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 song_missions_task_6:0 "投机同盟"
 song_missions_task_6_DESC:0 "虽来日或将于沙场之上与昔日之友兵戎相见，然当机会来临时，缔结权宜之盟亦不失为明智之举。且观谁愿与我携手共为裂土封疆之大业。\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 song_missions_task_6_claims:0 "吾等将获得对#Y大梁#!、#Y济阴#!、#Y淮阳#!、#Y东海#!、#Y东#!、#Y山阳#!、#Y泰山#!及#Y琅琊#!诸地之宣称。"
 song_missions_task_7:0 "纣王之声名"
 song_missions_task_7_DESC:0 "虽需近乎超人之努力，方能摆脱与商纣之昏庸相类比之羞耻，然[ROOT.GetCountry.GetRuler.GetName]已然说服即便[ROOT.GetCountry.GetRuler.GetHerHis]最激烈之批评者，[ROOT.GetCountry.GetName]境内已迎来崭新之一日。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 song_missions_task_8:0 "楔入魏国"
 song_missions_task_8_DESC:0 "虽[GetCountry('WEI').GetName]地处险境，其领土横跨#E黄河#!两岸，然其疆界之畸形错杂，已使[ROOT.GetCountry.GetRuler.GetName]决意夺取其大片领地。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 song_missions_task_9:0 "清理门户"
 song_missions_task_9_DESC:0 "眼下诸多迫在眉睫之威胁已获处置，吾等遂有余力将目光转向沿海之蕞尔小邦——将此等小国逐入大海之时机已至。\n\n\n\n\n\n\n\n\n\n@china_mil1!"

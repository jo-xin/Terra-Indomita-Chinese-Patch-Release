 etruria_roman_incursion_BUTTON_TOOLTIP:0 "Remove 罗马，伊特鲁里亚 strong ！"
 etruria_roman_incursion_CRITERIA_DESCRIPTION:0 "当伊特鲁里亚人消除了罗马人的威胁时，这项任务将被视为完成。"
 etruria_roman_incursion_DESCRIPTION:0 "[GetProvince('(int32)16').GetName] 被蒸蒸日上的 [GetProvince('(int32)1').GetName] 夺走的记忆仍在我们脑海里记忆犹新,，很难想象那些人对权力和统治的追求会让他们满足于在我们的边境前止步。\n\n多久之后，我们那些松散结盟的城市就会在城门前发现罗马大军，要求投降或是毁灭？然而，这些野蛮人傲慢地忘记了，我们拉森纳人（注：伊特鲁里亚人自称）曾经统治过罗马，而现在，我们可能会恢复过去对他们的统治……"
 etruria_roman_incursion_modifier:0 "$etruria_roman_incursion$"
 etruria_roman_incursion_one_of_three.a.tt:0 "完成以下至少一项任务：\n\t\t#Y [SCOPE.Custom('etruria_roman_incursion_one_of_three_senones_loc')] 塞农人归来\n\t\n\t\t[SCOPE.Custom('etruria_roman_incursion_one_of_three_carthage_loc')] 警惕伊特鲁里亚人打布匿牌\n\t\t[SCOPE.Custom('etruria_roman_incursion_one_of_three_epirus_loc')] 伊庇鲁斯的雄心#!"
 etruria_roman_incursion_one_of_three_carthage_loc_1:0 "@trigger_yes!"
 etruria_roman_incursion_one_of_three_carthage_loc_2:0 "@trigger_no!"

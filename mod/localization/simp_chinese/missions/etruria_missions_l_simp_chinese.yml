 etruria_roman_incursion_task_1:0 "家有恶邻"
 etruria_roman_incursion_task_10:0 "希腊之道"
 etruria_roman_incursion_task_10.a.tt:0 "@[GetCountry('EPI').GetFlag]!#Y [GetCountry('EPI').GetName]#!已同意提供帮助"
 etruria_roman_incursion_task_10.c.tt:0 "#E [GetCountry('EPI').GetReligion.GetName] [GetCountry('EPI').GetPrimaryCulture.GetName]#! 人口将出现在 #E [GetProvince('(int32)14').GetName]#!:\n#Y 2#! 贵族 @nobles! |  #Y 3#! 公民 @citizens! |  #Y 3#! 自由民 @freemen! |  #Y 5#! 奴隶 @slaves!"
 etruria_roman_incursion_task_10.c.tt2:0 "#E [GetCountry('EPI').GetPrimaryCulture.GetName]#!获得#Y 赞助#!"
 etruria_roman_incursion_task_10.c.tt3:0 "#Y [GetCountry('EPI').GetPrimaryCulture.GetName]#!被整合"
 etruria_roman_incursion_task_10_DESC:0 "自从我们与伊庇鲁斯人联合对抗共同的敌人以来，我们与他们的关系变得更加密切。如果我们允许他们在我们社会中享有更大的自由，也许他们可以教给我们更多东西。\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 etruria_roman_incursion_task_11:0 "罗马值得我们尊重"
 etruria_roman_incursion_task_11_DESC:0 "罗马已经忘记了我们曾经是它的统治者，它与我们有着许多共同的理想和文化。我们不要与他们作战，而是说服他们回归我们的信仰。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 etruria_roman_incursion_task_12:0 "交好罗马的附庸"
 etruria_roman_incursion_task_12.c.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]的附庸要么选择保持忠诚，要么加入我们。"
 etruria_roman_incursion_task_12_DESC:0 "有趣的是，罗马本身并不大。我们发现，他们的力量有一半在于他们众多被奴役的附庸。也许我们巧舌如簧的商人可以利用他们的同情心。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 etruria_roman_incursion_task_13:0 "坎帕尼亚叛乱"
 etruria_roman_incursion_task_13.c.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]的[GetProvince('(int32)6').GetArea.GetName|E]省份可能会选择反抗他们的主人。"
 etruria_roman_incursion_task_13_DESC:0 "有趣的是，罗马本身并不大。我们发现，他们的力量有一半在于他们众多被奴役的家属。也许我们巧舌如簧的特工可以利用他们的同情心。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 etruria_roman_incursion_task_14:0 "罗马统治的终结"
 etruria_roman_incursion_task_14.c.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]要么向我们投降，要么我们开战"
 etruria_roman_incursion_task_14_DESC:0 "我们已尽一切努力，通过联盟和颠覆，从罗马的地下夺取力量，增强我们的军队。现在让我们发挥我们的实力，看看这只虚弱的雄鹰会如何反应。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 etruria_roman_incursion_task_15:0 "罗马的命运"
 etruria_roman_incursion_task_15.a.tt:0 "@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]控制着所有@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]省份（[SCOPE.Custom('etruria_roman_incursion_task_15_provinces_rome_loc')]/[SCOPE.ScriptValue('etruria_roman_incursion_task_15_provinces_rome_target_svalue')|Y0]）"
 etruria_roman_incursion_task_15.a.tt2:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]是@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]的附庸"
 etruria_roman_incursion_task_15.c.tt:0 "@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]将决定怎么处理@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]"
 etruria_roman_incursion_task_15_DESC:0 "嚯嚯嚯，罗马现在已经被我们牢牢地踩在脚下，只能够摇尾乞怜。我们可以在这里做很多事情。该怎么办？嗯哼，您打算该怎么办~？\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 etruria_roman_incursion_task_15_provinces_rome_loc_completed:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_15_provinces_rome_svalue')|0Y]"
 etruria_roman_incursion_task_15_provinces_rome_loc_ongoing:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_15_provinces_rome_svalue')|0R]"
 etruria_roman_incursion_task_16:0 "窃取伊庇鲁斯的利益"
 etruria_roman_incursion_task_16.a.tt:0 "@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]的[GetOffice('office_tribune_of_the_soldiers').GetCulturalName(etruria_scope)]拥有至少[SCOPE.ScriptValue('etruria_roman_incursion_task_16_martial_target_svalue')|Y0]军略@military_icon!（[SCOPE.Custom('etruria_roman_incursion_task_16_etruria_marshal_martial_loc')]/[SCOPE.ScriptValue('etruria_roman_incursion_task_16_martial_target_svalue')|Y0]）"
 etruria_roman_incursion_task_16.c.tt:0 "@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]将吞并所有在[GetProvince('(int32)1').GetArea.GetRegion.GetName|Y]，[GetProvince('(int32)54').GetArea.GetRegion.GetName|Y]的@[GetCountry('EPI').GetFlag]![GetCountry('EPI').GetName|Y]领土"
 etruria_roman_incursion_task_16_DESC:0 "虽然皮洛士和他的手下是我们与罗马冲突中的重要盟友，但让罗马威胁如此迅速地被希腊威胁取代是愚蠢的。我们需要维护我们对整个半岛的主权，并在伊庇鲁斯营地扎根之前背刺他们将其清除。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 etruria_roman_incursion_task_16_etruria_marshal_martial_loc_1:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_svalue')|0Y]"
 etruria_roman_incursion_task_16_etruria_marshal_martial_loc_2:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_svalue')|0R]"
 etruria_roman_incursion_task_17:0 "更加和平的意大利"
 etruria_roman_incursion_task_17.a.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]#R 不是#!独立国家 - 我们必须完全吞并它们，或者它们就必须是我们的附庸国。"
 etruria_roman_incursion_task_17_DESC:0 "对意大利稳定的最大威胁罗马终于被制服了。欢喜吧！ \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 etruria_roman_incursion_task_1_DESC:0 "罗马及其疆域已逼近我国南部边境，无论陆上还是海上，都在蚕食我们的势力范围。这已然引发了不少……麻烦。不过，或许我们可以通过外交手段加以应对，甚至从中获利。毕竟，他们从我们这里夺走的，实在太多了。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 etruria_roman_incursion_task_1_c_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!将解决一些邻国纠纷"
 etruria_roman_incursion_task_2:0 "罗马-必须被-毁灭！"
 etruria_roman_incursion_task_2_DESC:0 "毋庸置疑——罗马必须在战场上被我们击败。但另一方面，罗马仍然是我们曾经建立并且统治的城市，正是我们将其推向了伟大的成功之路。那么问题来了——我们必须弄清楚，罗马的哪个部分元素才是我们真正看不惯的？ \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 etruria_roman_incursion_task_2_c_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!将会获得一个针对#E [GetProvince('(int32)1').GetArea.GetName]#!的#Y 宣称#!"
 etruria_roman_incursion_task_3:0 "改革陆军"
 etruria_roman_incursion_task_3_DESC:0 "罗马的七座山丘提供了坚实的防御体系。如果我们想要威胁或者甚至用武力夺取它，就需要更好的装备，以便向如此防守严密的城市进军。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 etruria_roman_incursion_task_3_effect_tt:0 "@[etruria_scope.GetFlag]![etruria_scope.GetName|Y]的[GetOffice('office_tribune_of_the_soldiers').GetCulturalName(etruria_scope)]拥有至少[SCOPE.ScriptValue('etruria_roman_incursion_task_3_target_svalue')|Y0]的忠诚@loyalty_icon!（[SCOPE.Custom('etruria_roman_incursion_task_3_etruria_marshal_loyalty_loc')]/[SCOPE.ScriptValue('etruria_roman_incursion_task_3_target_svalue')|Y0]）以及至少[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_target_svalue')|Y0]点军略@military_icon!（[SCOPE.Custom('etruria_roman_incursion_task_3_etruria_marshal_martial_loc')]/[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_target_svalue')|Y0]）"
 etruria_roman_incursion_task_3_etruria_marshal_loyalty_loc_1:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_svalue')|0Y]"
 etruria_roman_incursion_task_3_etruria_marshal_loyalty_loc_2:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_svalue')|0R]"
 etruria_roman_incursion_task_3_etruria_marshal_martial_loc_1:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_svalue')|0Y]"
 etruria_roman_incursion_task_3_etruria_marshal_martial_loc_2:0 "[SCOPE.ScriptValue('etruria_roman_incursion_task_3_martial_svalue')|0R]"
 etruria_roman_incursion_task_4:0 "秘密入侵"
 etruria_roman_incursion_task_4.c.tt:0 "一名@[etruria_scope.GetFlag]![etruria_scope.GetAdjective|Y]特工将会破坏@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]的事业"
 etruria_roman_incursion_task_4_DESC:0 "虽然我们是一个强大而自豪的民族，但在这里或那里拥有额外的优势并没有错。如果我们能从内部削弱罗马，他们在战场上和元老院里都会成为一个更脆弱、更胆怯的敌人。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 etruria_roman_incursion_task_5:0 "塞农人归来"
 etruria_roman_incursion_task_5.c.tt:0 "@[GetCountry('SNI').GetFlag]!#Y [GetCountry('SNI').GetName]#!将成为盟友、附庸国或为我们对抗@[GetCountry('ROM').GetFlag]!#Y [GetCountry('ROM').GetName]#!提供人力"
 etruria_roman_incursion_task_5_DESC:0 "哪怕过去了这么多年，罗马人仍然非常害怕一群人——当然也许我们也一样。\n一个叫布伦努斯的人曾洗劫过他们的城市，玷污了他们的名声。(注：这里说的是公元前387年高卢人入侵罗马)，也许如果我们与这些野蛮的战士结成伙伴关系，罗马人就会三思而后行。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 etruria_roman_incursion_task_6:0 "凯尔特人之道"
 etruria_roman_incursion_task_6.a.tt:0 "@[GetCountry('SNI').GetFlag]!#Y [GetCountry('SNI').GetName]#!已经同意提供帮助"
 etruria_roman_incursion_task_6.c.tt:0 "#E [GetCountry('SNI').GetReligion.GetName][GetCountry('SNI').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)131').GetName]#!省份：\n包括#Y 1#!公民@citizens!|#Y 3#!自由民@freemen!|#Y 5#!部落民@tribesmen!"
 etruria_roman_incursion_task_6.c.tt2:0 "#E [GetCountry('SNI').GetPrimaryCulture.GetName]#!获得#Y 赞助#!"
 etruria_roman_incursion_task_6.c.tt3:0 "#Y [GetCountry('SNI').GetPrimaryCulture.GetName]#!被整合"
 etruria_roman_incursion_task_6_DESC:0 "自从我们与塞农人联合，对抗共同的敌人以来，我们与他们的关系开始变得更加密切。如果我们允许他们在我们社会中享有更大的自由，也许他们可以教给我们更多东西。 \n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 etruria_roman_incursion_task_7:0 "打迦太基的牌"
 etruria_roman_incursion_task_7.c.tt:0 "@[GetCountry('CAR').GetFlag]!#Y [GetCountry('CAR').GetName]#!将成为盟友或为我们对抗 @[GetCountry('ROM').GetFlag]! #Y [GetCountry('ROM').GetName]#! 提供人力"
 etruria_roman_incursion_task_7_DESC:0 "虽然我们经常与他们争夺水道的控制权，但我们之前也同样曾与迦太基联手对抗我们的敌人。他们肯定会意识到，如果罗马变得足够强大到可以与我们作战，它将带来经济和影响力的威胁。 \n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 etruria_roman_incursion_task_8:0 "布匿之道"
 etruria_roman_incursion_task_8.a.tt:0 "@[GetCountry('CAR').GetFlag]!#Y [GetCountry('CAR').GetName]#!已同意提供帮助"
 etruria_roman_incursion_task_8.c.tt:0 "#E [GetCountry('CAR').GetReligion.GetName][GetCountry('CAR').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)3515').GetName]#!省份：\n包括#Y 1#!贵族@nobles!|#Y 2#!公民@citizens!|#Y 5#!自由民@freemen!|#Y 3#!奴隶@slaves!"
 etruria_roman_incursion_task_8.c.tt2:0 "#E [GetCountry('CAR').GetPrimaryCulture.GetName]#!获得#Y 赞助#!"
 etruria_roman_incursion_task_8.c.tt3:0 "#Y [GetCountry('CAR').GetPrimaryCulture.GetName]#!被整合"
 etruria_roman_incursion_task_8_DESC:0 "自从我们与迦太基人联合对抗共同的敌人以来，我们与迦太基人的关系变得更加密切。如果我们允许他们在我们的社会中享有更大的自由，也许他们可以教给我们更多东西。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 etruria_roman_incursion_task_9:0 "伊庇鲁斯的雄心"
 etruria_roman_incursion_task_9.c.tt:0 "@[GetCountry('EPI').GetFlag]!#Y [GetCountry('EPI').GetName]#!将成为盟友或为我们对抗@[GetCountry('ROM').GetFlag]!#Y [GetCountry('ROM').GetName]#!提供人力"
 etruria_roman_incursion_task_9_DESC:0 "伊庇鲁斯国王，年轻的皮大王，被许多人视为希腊世界在这个艰难时期的未来之光之一。也许他可以成为我们的光，并摧毁我们一直经历的罗马问题。 \n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 etruria_roman_puppeteer_modifier:0 "附庸罗马"
 etruria_roman_puppeteer_pch_modifier:0 "$etruria_roman_puppeteer_modifier$"
 etruria_roman_subjects_modifier:0 "罗马附庸"
 etruria_roman_subjects_output_modifier:0 "罗马附庸"
 etruria_rome_attacked_port_relations:0 "袭击我的港口"
 etruria_rome_crippled_economy_relations:0 "削弱了我们的经济"
 etruria_rome_failed_rebellion_relations:0 "失败的叛乱"
 etruria_rome_foreign_investments_relations:0 "外国投资"
 etruria_rome_good_relations:0 "贸易协定"
 etruria_rome_ignore_menrva_relations:0 "被忽略的密涅瓦"
 etruria_rome_maintained_traditions_relations:0 "保持传统"
 etruria_rome_ostia_sabotaged_modifier:0 "遭到破坏"
 etruria_rome_stole_from_us_relations:0 "偷我的东西"
 etruria_rome_successful_rebellion_relations:0 "成功的叛乱"
 etruria_salting_rome_modifier:0 "在罗马撒盐"
 etruria_siegecraft_experiments_modifier:0 "攻城术的实验"
 etruria_suppressed_modifier:0 "被镇压的叛乱"
 etruria_took_epirote_land_loyalty:0 "夺走伊庇鲁斯的土地"
 etruria_trade_on_the_tiber_modifier:0 "台伯河贸易"
 etruria_traditional_values_modifier:0 "传统价值观"
 etruria_training_grounds_modifier:0 "训练场"
 etruria_uncontested_waters_modifier:0 "没有争议的水域"
 etruria_worship_of_menrva_modifier:0 "崇拜密涅瓦"
 etruria_yearning_for_veii_modifier:0 "对维爱的向往"
 lavinium_etrurian_league_city_name:0 "拉维尼翁"
 lavinium_etrurian_league_city_name_adjective:0 "拉维尼翁"
 me_etruria.1.a:0 "我们在进行一场危险的博弈游戏"
 me_etruria.1.desc:0 "过去许多年里，我们和罗马一直处于战争的泥沼中，有好有坏，既有直接对抗也有代理人战争。 但是 [GetProvince('(int32)16').GetName]，我们父辈的骄傲……维爱已经离我们远去，失去它永远不可原谅。既然如此，那就让伊特鲁里亚人和罗马人如今的痛苦关系以其中一个人站在顶端作结吧。"
 me_etruria.1.title:0 "$etruria_roman_incursion$"
 me_etruria.10.a:0 "他们这一击，正中我军命脉！"
 me_etruria.10.a.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]的一支随机舰队损失了#R 5 #!艘舰船。"
 me_etruria.10.desc:0 "执政官！执政官！快俯瞰这座城。它在燃烧！在燃烧！市集与要塞已成废墟，而看哪：远处河畔的[GetProvince('(int32)15').GetName]燃起了大火！这绝对是#E 伊特鲁里亚人#!在背后作祟。"
 me_etruria.10.title:0 "$etruria_roman_incursion_task_4$：摧毁罗马贵金属储备"
 me_etruria.11.a:0 "他给予我们莫大的荣耀，而罗马人必将陷入惶恐。"
 me_etruria.11.a.tt:0 "[minor_etrurian_spy.GetName|Y]将在 #Y 30#!天后以 #Y 次要人物#! 的身份返回@[SCOPE.GetRootScope.GetCountry.GetFlag]![SCOPE.GetRootScope.GetCountry.GetName|Y]\n待其抵达后，他将成为 #Y [GetOffice('office_pontifex').GetCulturalName(SCOPE.GetRootScope.GetCountry)] #!"
 me_etruria.11.desc:0 "他们简直是抬着他回来的。一群圣徒将维尔图尔扛在肩上带回。他们声称是维尔图尔寻得他们，并传授了罗马人崇拜伪神的谬误。于是他们焚尽所有财物，说服其他祭司效法，最终归入我神庙，奉维尔图尔为大祭司。更带回了我们昔日被罗马人夺走的圣物。"
 me_etruria.11.title:0 "$etruria_roman_incursion_task_4$：误入歧途的圣职者"
 me_etruria.12.a:0 "没有了我们的神，我们算什么？"
 me_etruria.12.desc:0 "执政官！执政官！他们离开了#E 至尊朱庇特#!的神殿——所有人。他们竟肩扛着一个异族人走出来——我发誓那是个伊特鲁里亚人。又有急报传来，连[GetProvince('(int32)6').GetName]的狄安娜神殿祭司也都离去，甚至将圣地付之一炬。\n\n绝望的民众觉得，诸神的光辉仿佛已在这烈火中燃尽。"
 me_etruria.12.title:0 "$etruria_roman_incursion_task_4$：烈焰公牛"
 me_etruria.14.a:0 "您说他们的器物颇为精巧？若由我们仿制，可有利可图？"
 me_etruria.14.a.tt:0 "这些#E [GetCountry('SNI').GetReligion.GetName][GetCountry('SNI').GetPrimaryCulture.GetName]#!的人口将会出现在#E [GetProvince('(int32)14').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 2#! 公民@citizens!\n #E [GetCountry('SNI').GetPrimaryCulture.GetName]#!文化获得#Y 赞助凯尔特文学和艺术#!"
 me_etruria.14.b:0 "他们确实洗劫过罗马。或许...我们该向他们讨教一二。"
 me_etruria.14.b.tt:0 "#E [GetCountry('SNI').GetPrimaryCulture.GetName]#!文化获得#Y 研习凯尔特战法#!"
 me_etruria.14.c:0 "此族民风彪悍又吃苦耐劳——正可遣往矿区效命。"
 me_etruria.14.c.tt:0 "这些#E [GetCountry('SNI').GetReligion.GetName][GetCountry('SNI').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)124').GetName]#!：\n#Y 4#! 自由民@freemen!|  #Y 5#! 奴隶@slaves! "
 me_etruria.14.desc:0 "尽管各地偶有骚动，但容留瑟诺尼亚人在我们的城市与道路间自由通行，实则利大于弊。他们带来了诸多异域奇珍与独特风俗。有识之士认为，我们或可将彼此关系再推进一步。既已结为友邦，或许他们愿意向我们更深入地传授其智慧。"
 me_etruria.14.title:0 "$etruria_roman_incursion_task_6$：瑟诺尼亚人意欲何为？"
 me_etruria.15.a:0 "其精工巧艺与商道网络确有可取之处。着人探其奥妙。"
 me_etruria.15.a.tt:0 "这些#E [GetCountry('CAR').GetReligion.GetName][GetCountry('CAR').GetPrimaryCulture.GetName]#!的人口将会出现在#E [GetProvince('(int32)14').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 2#! 公民@citizens!\n #E [GetCountry('CAR').GetPrimaryCulture.GetName]#!文化获得#Y 赞助凯尔特文学和艺术#!"
 me_etruria.15.b:0 "其水师之精，冠绝七海。当效其舟楫之术。"
 me_etruria.15.b.tt:0 "#E [GetCountry('CAR').GetPrimaryCulture.GetName]#!文化获得#Y 研习布匿战法#!"
 me_etruria.15.c:0 "彼辈既为商贾——何不借其力兴我货殖？"
 me_etruria.15.c.tt:0 "这些#E [GetCountry('CAR').GetReligion.GetName][GetCountry('CAR').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)22').GetName]#!：\n#Y 4#! 自由民@freemen!|  #Y 5#! 奴隶@slaves!"
 me_etruria.15.desc:0 "眼下既已达成协议——纵使短暂——迦太基商人便如潮水般涌入我国港口，各类奇货络绎而至。此辈身上…大有可学之处，恐远超我等所料。"
 me_etruria.15.title:0 "$etruria_roman_incursion_task_8$：迦太基人作何提议？"
 me_etruria.16.a:0 "我等当效其技法，自铸良器。"
 me_etruria.16.a.tt:0 "这些#E [GetCountry('EPI').GetReligion.GetName][GetCountry('EPI').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)126').GetName]#!：\n#Y 1#! 贵族 @nobles! | #Y 2#! 公民 @citizens!\n#E [GetCountry('EPI').GetPrimaryCulture.GetName]#!文化获得#Y 赞助希腊文学和艺术#!"
 me_etruria.16.b:0 "希腊方阵战术确为利器。其中奥妙，恐不止于此。"
 me_etruria.16.b.tt:0 "#E [GetCountry('EPI').GetPrimaryCulture.GetName]#!文化获得#Y 研习希腊战法#!"
 me_etruria.16.c:0 "希腊人确是良谋善治之才。"
 me_etruria.16.c.tt:0 "这些#E [GetCountry('EPI').GetReligion.GetName][GetCountry('EPI').GetPrimaryCulture.GetName]#!人口将会出现在#E [GetProvince('(int32)126').GetName]#!：\n#Y 4#! 自由民@freemen!|  #Y 5#! 奴隶@slaves!"
 me_etruria.16.desc:0 "我国与[GetCountry('EPI').GetName]的[GetCharacter('(int32)70').GetName]建立的互利关系，使得双方使节与信使往来频繁。虽多数时候这些往来都严谨有序，但仍有零星的消息、艺术品和故事流传至市井。我人民素来喜爱希腊器物......或许我们该让两种文化更加水乳交融。"
 me_etruria.16.title:0 "$etruria_roman_incursion_task_10$：伊庇鲁斯人作何承诺？"
 me_etruria.17.a:0 "他们将重归伊特鲁里亚！"
 me_etruria.17.b:0 "罗马必须臣服——但可存续。"
 me_etruria.17.desc:0 "诸位都清楚必须压制[GetCountry('ROM').GetName]的威胁。但问题在于——这座城市和它的人民该如何处置？\n\n是让繁荣的罗马作为盟友对我们更有利？还是应该让他们成为臣属，在我们的威慑下服从？这项伟业需要给人民一个明确的目标。"
 me_etruria.17.title:0 "$etruria_roman_incursion_task_11$：罗马-伊特鲁里亚之盟"
 me_etruria.18.a:0 "我们需要整个坎帕尼亚平原的支持。"
 me_etruria.18.a.tt:0 "已向@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y][GetProvince('(int32)6').GetArea.GetName|E]的每个领地派遣密探。"
 me_etruria.18.b:0 "此举过于冒险。且任坎帕尼亚的棋子自行落定吧。"
 me_etruria.18.desc:0 "[GetProvince('(int32)6').GetName]在一个世纪前还是我们的城市，直到坎帕尼亚人洗劫贵族庄园、篡夺权柄。他们的自由可曾带来福祉？罗马的庇护又给予过什么？他们在共和国无选举权，甚至屡次背叛拉丁同盟。[GetProvince('(int32)7').GetName]亦遭此厄运——那些曾与我们贸易的希腊良民，接纳了坎帕尼亚人，却仍难逃被征服的命运。或许...我们的怀抱才是他们最终的归宿......"
 me_etruria.18.title:0 "$etruria_roman_incursion_task_13$：坎帕尼亚的暗影"
 me_etruria.19.a:0 "只在卡普阿武装我们的同胞！"
 me_etruria.19.b:0 "收买希腊人，煽动不满的民众。"
 me_etruria.19.c:0 "必须让他们全部参与。"
 me_etruria.19.d:0 "但事态已超出掌控——我们无力支持这场叛乱。"
 me_etruria.19.desc:0 "我们的密探已带回消息。那些昔日伊特鲁里亚寡头统治者的子孙后代，仍在[GetProvince('(int32)6').GetName]、[GetProvince('(int32)10').GetName]及我们曾统治过的南方其他城镇蠢蠢欲动。这些富庶家族愿意起事，若我们支持其行动，他们将通过叛乱夺回政治权力——简而言之，他们需要一支军队。\n\n[GetProvince('(int32)7').GetName]、[GetProvince('(int32)1713').GetName]及皮特库萨岛的情况也颇为相似。当地的希腊人深感被罗马压制，且与同样受罗马奴役的拉丁原住民关系良好——据密探研判，他们的支持可以用金钱换取。"
 me_etruria.19.title:0 "$etruria_roman_incursion_task_13$：南境自由的代价"
 me_etruria.2.a:0 "广辟商路，再遣新舟。"
 me_etruria.2.b:0 "商贾趋利，必择安处。当为庇佑。"
 me_etruria.2.bt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#E [GetProvince('(int32)22').GetName]#!获得一支精锐舰队，含：\n#Y 5 #!艘三列桨战船 #Y 2 #!艘六列桨巨舰 #Y 1 #!艘八列桨旗舰"
 me_etruria.2.bt2:0 "#G 3 #!位#Y 公民 #! @citizens!出现在#E [GetProvince('(int32)22').GetName]#!境内"
 me_etruria.2.c:0 "与奥斯提亚商人达成协议，重新分配其进口货物。"
 me_etruria.2.d:0 "遣我商旅豪杰，挫奥斯提亚港之锐气。"
 me_etruria.2.desc:0 "[GetProvince('(int32)22').GetName]向为海贸要冲，撒丁岛等商货皆溯河而入其港。\n\n然罗马已仿维尔卡之制，于台伯河口另立奥斯蒂亚港，与我争衡。若欲保维尔卡及北方商路之盛，须解此双港相争之局。"
 me_etruria.2.title:0 "$etruria_roman_incursion_task_1$：奥斯提亚 vs 维尔卡"
 me_etruria.20.a:0 "但愿他们能坚持到我方完成战备部署。"
 me_etruria.20.desc:0 "我们接到消息，[GetProvince('(int32)6').GetName]已揭竿而起，成为罗马人眼中顽固的肉中刺，并宣布独立。我们为他们提供的军队已驻守该城，成功牵制了罗马的大批兵力。"
 me_etruria.20.i.tt:0 " [capua_revolt_scope.GetName|Y]领土 #R 叛乱#! 以反抗@[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetName|Y]\n [capua_revolt_scope.GetName|Y] 叛乱领土获得一支军队包含 #Y 4k重步兵#! 和#Y 4k长矛步兵#!\n[capua_revolt_scope.GetName|Y] 领土获得二等级 #Y 要塞#!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在#E [GetProvince('(int32)6').GetName]#!:\n#Y 4#! 贵族 @nobles! |  #Y 3#! 公民 @citizens!"
 me_etruria.20.title:0 "$etruria_roman_incursion_task_13$：卡普阿的反叛"
 me_etruria.21.a:0 "一场尴尬的挫折"
 me_etruria.21.a.tt:0 " [GetProvince('(int32)7').GetName|Y]领土失去 #R 5#! #Y 意大利希腊#! 人口"
 me_etruria.21.desc:0 "我们收到消息：虽然意大利的希腊人成功鼓动了同族和坎帕尼亚地区的权贵阶级起义反抗罗马人，但罗马人察觉了整个计划，并胁迫奴隶和劳工对抗他们的主人。\n\n我们在那些城邦的盟友已被逮捕，部分甚至遭到处决。目前尚不清楚罗马人是否已追查到我们头上。"
 me_etruria.21.title:0 "$etruria_roman_incursion_task_13$：未竟之叛"
 me_etruria.22.a:0 "愿自由之火焚尽镣铐！"
 me_etruria.22.a.tt:0 "这些#E [campania_revolt_scope.GetReligion.GetName][campania_revolt_scope.GetPrimaryCulture.GetName]#!的人口将会出现在#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!:\n#Y 2#! 贵族 @nobles! |  #Y 1#! 公民 @citizens!!"
 me_etruria.22.desc:0 "斥候来报，坎帕尼亚已全面起义，[GetProvince('(int32)6').GetName]与[GetProvince('(int32)7').GetName]正率众反抗罗马暴政。\n\n全民皆兵，连昔日侵夺我族土地的坎帕尼亚人也加入其中。"
 me_etruria.22.i.tt:0 "[campania_revolt_scope.GetName|Y] 省份#R 叛乱#! 反抗@[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetName|Y]\n叛乱国[campania_revolt_scope.GetName|Y]获得一支军队包含 #Y 6k重步兵#!, #Y 6k长矛步兵#!, #Y 3k轻步兵#! and #Y 2k 补给队#!\n[GetProvince('(int32)6').GetName|Y] and [GetProvince('(int32)7').GetName|Y] 领土获得二级#Y 要塞#!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!将出现在#E [GetProvince('(int32)6').GetName]#!:\n#Y 4#! noble @nobles! |  #Y 3#! 公民 @citizens!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在 #E [GetProvince('(int32)7').GetName]#!:\n#Y 2#! 贵族@nobles! |  #Y 1#! 公民@citizens!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在#E [GetProvince('(int32)8').GetName]#!:\n#Y 1#! 公民@citizens! |  #Y 1#! 自由民@freemen!\n这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在#E [GetProvince('(int32)31').GetName]#!:\n#Y 1#! 自由民@freemen!"
 me_etruria.22.title:0 "$etruria_roman_incursion_task_13$：坎帕尼亚叛乱"
 me_etruria.23.a:0 "要么跪地称臣，要么血染沙场！"
 me_etruria.23.a.tt:0 "向@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]#Y 元老院#!发出最后通牒！"
 me_etruria.23.desc:0 "时机终于到来。我们已为这场期待已久的罗马之战做足准备——尽管这将是一场恶战，但此刻，让我们以最后通牒彰显实力与决心。至于他们那意料之中的回应……我们静候便是。"
 me_etruria.23.title:0 "$etruria_roman_incursion_task_14$：罗马臣服条款"
 me_etruria.24.a:0 "我们的命运，将在战场上见分晓！"
 me_etruria.24.b:0 "我们毫无胜算，何必让子民徒受战乱之苦。"
 me_etruria.24.desc:0 "十二位伊特鲁里亚君王发来了一则狂妄、险恶而卑劣的讯息。这群盘踞山巅的宝座之主，此刻竟放下他们的鎏金酒樽，联合起来要与我们兵戎相见。他们扬言兵力远胜我军，更暗示有外邦盟军增援。\n\n我军斥候确实观测到敌军集结，原以为只是为抵御山内高卢人的防御部署——大错特错。他们给出两个选择...\n\n交出[GetProvince('(int32)1').GetName]，或者死。"
 me_etruria.24.title:0 "$etruria_roman_incursion_task_14$：伊特鲁里亚的命令"
 me_etruria.25.a:0 "准备战斗！"
 me_etruria.25.desc:0 "我们的使者身首异处而归——他们的答复，已然明了……"
 me_etruria.25.title:0 "$etruria_roman_incursion_task_14$: 战火燎原"
 me_etruria.26.a:0 "夺取他们的土地！"
 me_etruria.26.desc:0 "罗马人已派出一支\"使节大军\"携厚礼至我诸城，在我军兵锋前乞求宽恕——看来他们心知肚明，自己毫无胜算。\n\n欢迎回到拉森纳人（伊特鲁里亚人自称）的土地，拉丁人。"
 me_etruria.26.title:0 "$etruria_roman_incursion_task_14$：重归故土"
 me_etruria.27.a:0 "罗马必须毁灭！"
 me_etruria.27.a.tt:0 "#Y [GetProvince('(int32)1').GetName]#!将有#Y 66%#!的人口丧生。"
 me_etruria.27.a.tt2:0 "@[SCOPE.GetRootScope.GetCountry.GetFlag]![SCOPE.GetRootScope.GetCountry.GetName|Y]将获得@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]除#Y $roma_area$ #!行省外的所有领土！"
 me_etruria.27.b:0 "罗马当归吾有！"
 me_etruria.27.b.tt:0 "@[SCOPE.GetRootScope.GetCountry.GetFlag]! [SCOPE.GetRootScope.GetCountry.GetName|Y]吞并@[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetName|Y]"
 me_etruria.27.c:0 "他们将成为提线木偶。"
 me_etruria.27.c.tt:0 "@[SCOPE.GetRootScope.GetCountry.GetFlag]! [SCOPE.GetRootScope.GetCountry.GetName|Y] 吞并@[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetName|Y] 并创建一个 @[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetAdjective|Y]藩属位于[GetProvince('(int32)1').GetName|Y0]"
 me_etruria.27.d:0 "罗马之土，我之商基。"
 me_etruria.27.d.tt:0 "@[SCOPE.GetRootScope.GetCountry.GetFlag]! [SCOPE.GetRootScope.GetCountry.GetName|Y] 吞并所有@[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetAdjective|Y] 领土，除了[GetProvince('(int32)1').GetName|E0]"
 me_etruria.27.d.tt2:0 "道路被建造自[GetProvince('(int32)3').GetName|E0]穿过[GetProvince('(int32)1').GetName|E0], [GetProvince('(int32)16').GetName|E0]和[GetProvince('(int32)18').GetName|E0] 去往 [GetProvince('(int32)21').GetName|E0]。\n道路被建造自[GetProvince('(int32)3').GetName|E0]穿过[GetProvince('(int32)15').GetName|E0] 去往 [GetProvince('(int32)14').GetName|E0]."
 me_etruria.27.d.tt3:0 "这些领土：[GetProvince('(int32)1').GetName|E0], [GetProvince('(int32)15').GetName|E0], [GetProvince('(int32)2').GetName|E0]，和 [GetProvince('(int32)3').GetName|E0] 成为[SCOPE.GetRootScope.GetCountry.GetAdjective|Y] #E 联盟城市#!"
 me_etruria.27.desc:0 "罗马的土地如今已臣服于我们的军队与律法之下。该由十二人议会来决定如何处置这些民众与他们的城邦——他们的命运，将在此尘埃落定。"
 me_etruria.27.e:0 "烧毁罗马，将其撒盐。"
 me_etruria.27.e.tt:0 "[GetProvince('(int32)1').GetArea.GetName|Y0]省内所有城市成为[GetProvinceRank('settlement').GetName|Y0]#Y #E s#!#!\n所有@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetAdjective|Y]人口中的#Y 33%#!随城市毁灭\n@[SCOPE.GetRootScope.GetCountry.GetFlag]![SCOPE.GetRootScope.GetCountry.GetName|Y]吞并@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]"
 me_etruria.27.e.tt2:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]获得#Y 6#!革新"
 me_etruria.27.title:0 "$etruria_roman_incursion_task_15$：罗马的命途"
 me_etruria.28.a:0 "让拉丁人去吧。对我们来说，这是一座被遗忘的城市。"
 me_etruria.28.b:0 "它将再次成为真正的伊特鲁里亚人据点！"
 me_etruria.28.b.tt:0 "这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName][SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将会出现在#E [GetProvince('(int32)1').GetName]#!:\n#Y 5#! 贵族@nobles! |  #Y 6#! 公民 @citizens! |  #Y 7#! 自由民 @freemen! |  #Y 10#! 奴隶 @slaves!"
 me_etruria.28.b.tt2:0 "#E [SCOPE.GetRootScope.GetCountry.GetName]#!给[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]文化颁布#Y 放宽公民身份限制#!和#Y 上诉权#!的文化决议。"
 me_etruria.28.desc:0 "我们在[GetCountry('ROM').GetName]上取得了成功，我们的祖先正在高兴我们给死敌造成的耻辱。但是，现在到了决定如何前进的时候了；我们是否打算将来回到[GetProvince('(int32)1').GetName]，并将其重建为我们日益壮大的联盟中的中心城市，这个问题我们今天还无法给出明确的答案。\n\n但是，第一步必须尽快迈出；我们是开始让拉森纳人返回罗马，还是让拉丁人去处理他们的事务？"
 me_etruria.28.title:0 "$etruria_roman_incursion_task_15$：重返伊特鲁里亚罗马"
 me_etruria.29.a:0 "我们将直接统治他们！"
 me_etruria.29.a.tt:0 "这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在#E [GetProvince('(int32)6').GetName]#!:\n#Y 1#!贵族 @nobles! |  #Y 2#! 公民@citizens! |  #Y 3#! 自由民@freemen! |  #Y 3#!奴隶 @slaves!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在#E [GetProvince('(int32)8').GetName]#!:\n#Y 1#! 贵族@nobles! |  #Y 2#! 公民@citizens! |  #Y 3#! 自由民@freemen! |  #Y 3#!奴隶@slaves!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在#E [GetProvince('(int32)40').GetName]#!:\n#Y 1#! 贵族@nobles! |  #Y 2#! 公民@citizens! |  #Y 3#! 自由民@freemen! |  #Y 3#!奴隶@slaves!\n这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在#E [GetProvince('(int32)31').GetName]#!:\n#Y 1#! 贵族@nobles! |  #Y 2#! 公民@citizens! |  #Y 3#! 自由民@freemen! |  #Y 3#! 奴隶 @slaves!"
 me_etruria.29.a.tt2:0 "[SCOPE.Custom('etruria_me_etruria_29_campania_annex_loc')]"
 me_etruria.29.b:0 "让人民联盟生生不息！"
 me_etruria.29.b.tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]释放[GetProvince('(int32)6').GetArea.GetName|Y0]省份作为被称为#Y 伊特鲁里亚联盟#!的藩属国。"
 me_etruria.29.b.tt2:0 "这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在#E [GetProvince('(int32)6').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 3#! 公民 @citizens! |  #Y 4#! 自由民@freemen! |  #Y 4#! 奴隶 @slaves!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将出现在#E [GetProvince('(int32)8').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 3#! 公民@citizens! |  #Y 4#! 自由民n @freemen! |  #Y 4#! 奴隶@slaves!\n这些#E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在#E [GetProvince('(int32)40').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 3#! 公民 @citizens! |  #Y 4#! 自由民 @freemen! |  #Y 4#!奴隶@slaves!\n这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!人口将出现在 #E [GetProvince('(int32)31').GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 3#! 公民@citizens! |  #Y 4#! 自由民@freemen! |  #Y 4#!奴隶@slaves!"
 me_etruria.29.b.tt3:0 "#E 伊特鲁里亚联盟#!获得#Y $etruria_lega_dei_popoli_modifier$#!：\n@global_commerce_icon!全国商业价值：#G +5.00%#!\n@global_export_commerce_icon!出口价值：#G +5.00%#!\n@global_pop_assimilation_speed_icon!人口同化速度：#G +10.00%#!"
 me_etruria.29.desc:0 "随着[GetProvince('(int32)1').GetName]本身命运的决定，我们有必要处理一下[GetProvince('(int32)6').GetName]周围及其南方的盟友，因为我们记得这些城市曾经是拉森纳的城市，是我们控制南方贸易的证明。\n\n如果我们要奖赏他们并增强我们在该地区的实力，我们是应该将他们重新纳入伟大的拉森纳联盟，还是恢复他们作为坎帕尼亚联盟（波波利联盟）的地位？"
 me_etruria.29.title:0 "$etruria_roman_incursion_task_15$：坎佩尼亚的命运"
 me_etruria.3.a:0 "任他们在维伊亵渎神祇——我们将在维尔卡建造更宏伟的神庙。"
 me_etruria.3.b:0 "让吾等说服罗马人保留此城的古老传统。"
 me_etruria.3.c:0 "维爱陷落之时，伟大的梅恩尔瓦又在何方？"
 me_etruria.3.desc:0 "[GetProvince('(int32)16').GetName]的大祭司匍匐于统治者座前，向最高议会陈情：\n\n\"提尼之女，乌尼之女啊！罗马人将您从我们身边夺走！伟大的梅恩尔瓦——您自父神首级诞生，曾与他共掷赤红雷霆，如今圣像却被窃取，被罗马人充作他们的'密涅瓦'。诸位智者，岂能坐视罗马人扭曲我们的女神，使她背弃子民？\"\n\n凡人皆须跪拜神明，奉献终生——此事当如何解？"
 me_etruria.3.title:0 "$etruria_roman_incursion_task_1$: 伊特鲁里亚或是罗马神明？"
 me_etruria.30.a:0 "我们的工作将继续。"
 me_etruria.30.desc:0 "自从很久以前在罗马推翻塔克文的统治以来，这是一场漫长的斗争，然而，当所有其他人都认为我们最好的时代已经过去时，我们却坚持了下来，并取得了胜利。我们在团结中找到了力量，绝不会屈服于罗马人自大的弱点！我们看到了这种性格的后果。让他们的历史到此结束，作为我们的警示，警示我们的弱点。\n\n虽然我们在北部地区重新确立了统治地位，但四面八方仍有许多敌人。在[GetProvince('(int32)3256').GetName]的老伙计们仍在窃取我们的航道，北面、西面和南面的希腊人已经包围了我们，而我们在北面山外的亲戚们仍处于蛮族的征服之下。在这个拥挤而危险的世界上，我们的安全无处可寻。"
 me_etruria.30.title:0 "$etruria_roman_incursion_task_17$：拉丁遗产的终结"
 me_etruria.31.a:0 "我们的关系是非常重要的。把这一点说清楚。"
 me_etruria.31.at:0 "#Y 瑟诺尼亚#!可能会成为一个#Y 仆从国#!。"
 me_etruria.31.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_etruria.31.bt:0 "#Y 瑟诺尼亚#! 可能会成为了一个 #Y 盟友#!."
 me_etruria.31.c:0 "让我们给他们送去一份友谊的信物。"
 me_etruria.31.ct:0 "#Y 瑟诺尼亚#!很可能会拒绝我们的提议，或者干脆派一帮热心青年来。"
 me_etruria.31.desc:0 "瑟诺尼亚人因洗劫罗马而闻名于世，他们的凶残和固步自封依然闻名遐迩。\n让我们与他们达成协议，这样我们就有了盟友以战胜罗马人。"
 me_etruria.31.title:0 "瑟诺尼亚序曲"
 me_etruria.32.a:0 "说这话让我难受——但眼下这乱世，我们需要他们的保护。与其为敌，不如合作。"
 me_etruria.32.at:0 "#Y 瑟诺尼亚#! 成为 #Y 伊特鲁里亚#! 的 #T 仆从国#!。"
 me_etruria.32.b:0 "或许一份军事同盟能安抚他们，同时为我们带来利益？"
 me_etruria.32.bt:0 "#Y 瑟诺尼亚#! 成为#Y 伊特鲁里亚#! 的 #T 盟友#! 。"
 me_etruria.32.c:0 "我们会派一些战士支援他们的远征。"
 me_etruria.32.ct:0 "外交官们很失望，他们的统治者可能会被冒犯，但也许我们的勇士会打破平衡。"
 me_etruria.32.desc:0 "伊特鲁里亚同盟的使者携其统治者之信抵达。他们誓要终结罗马狼的威胁——鉴于我们曾有摧毁罗马城墙、蹂躏其街巷的战绩，故特来相邀。"
 me_etruria.32.desc_1:0 "$me_etruria.32.desc$\n他们献上大量金银，企图拉拢我们加入其阵营。其统治者正寻求军事盟友与贸易伙伴。"
 me_etruria.32.desc_2:0 "$me_etruria.32.desc$\n他们献上若干银两，企图诱使我等加入其阵营。该邦君主正广结军事盟友，兼觅贸易伙伴。"
 me_etruria.32.desc_3:0 "$me_etruria.32.desc$\n虽其言甘如蜜，所献之礼却寡薄难入眼。"
 me_etruria.32.title:0 "来自伊特鲁里亚的信使"
 me_etruria.33.a:0 "我们的努力已经取得了成功!"
 me_etruria.33.at:0 "#Y 瑟诺尼亚#! 成为一个#Y 附属部落#!。"
 me_etruria.33.b:0 "我相信，这是一个互利的联盟。"
 me_etruria.33.bt:0 "#Y 瑟诺尼亚#! 成为了一个 #Y 盟友#!."
 me_etruria.33.c:0 "他们怎么敢这样侮辱我们！"
 me_etruria.33.ct:0 "我们什么都没得到，几乎什么都没有……"
 me_etruria.33.desc:0 "瑟诺尼亚使者已经带着他们的回复抵达。“# description 关于使者从辛迪卡抵达斯基泰。"
 me_etruria.33.desc_1:0 "$me_etruria.33.desc$\n他们接受了我们慷慨的建议，甚至将臣服作为我们的仆从国。"
 me_etruria.33.desc_2:0 "$me_etruria.33.desc$\n他们接受了我们的结盟建议，希望与我们携手共创美好未来。"
 me_etruria.33.desc_3:0 "$me_etruria.33.desc$\n他们决定拒绝我们的外交努力，并排除了进一步加强两国关系的可能性。为防止双方关系恶化，他们派出了一队战士来协助我们的行动。"
 me_etruria.33.title:0 "瑟诺尼亚的回应"
 me_etruria.34.a:0 "我们的关系是非常重要的。把这一点说清楚。"
 me_etruria.34.at:0 "#Y 迦太基#! 可能向我们发送#G 资源#! 以及建立一个#Y 联盟#! 。"
 me_etruria.34.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_etruria.34.bt:0 "#Y 迦太基#! 可能成为#Y 盟友#! 。"
 me_etruria.34.c:0 "让我们送给他们一个友谊的象征。"
 me_etruria.34.ct:0 "#Y 迦太基#! 无论如何，他们都可能拒绝我们的请求。"
 me_etruria.34.desc:0 "我们的老贸易对手和西地中海的超级大国迦太基仍然是一个海军巨头，可能会成为我们冲突的决定性因素，就像他们很久以前对福西亚人所做的那样。\n让我们与他们达成协议，这样我们就有了盟友以战胜罗马人。"
 me_etruria.34.title:0 "迦太基序曲"
 me_etruria.35.a:0 "罗马人在未来将是一个巨大的威胁。我们将派遣的不仅仅是一个联盟——为他们提供人员、训练等。"
 me_etruria.35.at:0 "#Y 迦太基#! 成为#Y 伊特鲁里亚#! 的一个 #T 盟友#! ，并将发送#G 人力#! 同时给予#G 军事经验 #! 以及#G 军事通行权#! 。"
 me_etruria.35.b:0 "或许一份军事同盟能安抚他们，同时为我们带来利益？"
 me_etruria.35.bt:0 "#Y 迦太基#! 成为#Y 伊特鲁里亚#! 的一个 #T 盟友#! 。"
 me_etruria.35.c:0 "我们不会给他们任何东西——让意大利人为了我们以后的征服而毁了自己。"
 me_etruria.35.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_etruria.35.desc:0 "伊特鲁里亚联盟的使者带着统治者的口信抵达。他们试图最终杀死罗马狼。鉴于我们的海上控制历史和之前的合作关系，他们找到了我们。"
 me_etruria.35.desc_1:0 "$me_etruria.35.desc$\n他们为我们提供了大量的金银财宝，试图将我们争取到他们的事业中。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_etruria.35.desc_2:0 "$me_etruria.35.desc$\n他们向我们提供了一定数量的银子，试图争取我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_etruria.35.desc_3:0 "$me_etruria.35.desc$\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_etruria.35.title:0 "来自伊特鲁里亚的信使"
 me_etruria.36.a:0 "我们的努力已经取得了成功!"
 me_etruria.36.at:0 "#Y 迦太基#! 成为#Y 盟友#! 并提供更大的军事支持。"
 me_etruria.36.b:0 "我相信，这是一个互利的联盟。"
 me_etruria.36.bt:0 "#Y 迦太基#! 成为#Y 盟友#! 。"
 me_etruria.36.c:0 "他们怎么敢这样侮辱我们！"
 me_etruria.36.ct:0 "我们什么都没得到，什么都没有。"
 me_etruria.36.desc:0 "迦太基大使已经抵达，并做出了回应。“ # description 从辛迪卡抵达斯基泰的使者的描述。"
 me_etruria.36.desc_1:0 "$me_etruria.36.desc$\n他们已经接受了我们的慷慨提议，甚至将提供比想象中更多的援助，包括人力、军事经验以及通过其土地和港口城镇的军事通行权。"
 me_etruria.36.desc_2:0 "$me_etruria.36.desc$\n他们已经接受了我们的结盟提议，并希望与我们合作以获得更美好的未来。"
 me_etruria.36.desc_3:0 "$me_etruria.36.desc$\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_etruria.36.title:0 "迦太基的回应"
 me_etruria.37.a:0 "我们的关系是非常重要的。把这一点说清楚。"
 me_etruria.37.at:0 "#Y 伊庇鲁斯#! 可能向我们发送#G 资源#! 以及建立一个#Y 联盟#! 。"
 me_etruria.37.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_etruria.37.bt:0 "#Y 伊庇鲁斯#! 可能成为一个 #Y 盟友#!."
 me_etruria.37.c:0 "让我们送给他们一个友谊的象征。"
 me_etruria.37.ct:0 "#Y 伊庇鲁斯#! 无论如何，他们都可能拒绝我们的请求。"
 me_etruria.37.desc:0 "伊庇鲁斯是一个希腊强国，一直在大希腊地区南部试水，其目标是窃取意大利半岛南部，它仍然是一个军事强国，考虑到皮洛士的勇敢和灵巧，它可能会成为我们冲突中的一个决定性因素。\n让我们与他们达成协议，这样我们就有了盟友以战胜罗马人。"
 me_etruria.37.title:0 "伊庇鲁斯序曲"
 me_etruria.38.a:0 "罗马人在未来将是一个巨大的威胁。我们将派遣的不仅仅是一个联盟——为他们提供人员、训练等。"
 me_etruria.38.at:0 "#Y 伊庇鲁斯#! 成为#Y 伊特鲁里亚#! 的一个 #T 盟友#! ，并将发送#G 人力#! 同时给予#G 军事经验 #! 以及#G 军事通行权#! 。"
 me_etruria.38.b:0 "也许军事联盟能安抚他们，并给我们带来好处作为回报？"
 me_etruria.38.bt:0 "#Y 伊庇鲁斯#! 成为#Y 伊特鲁里亚#! 的一个 #T 盟友#! 。"
 me_etruria.38.c:0 "我们不会给他们任何东西——让意大利人为了我们以后的征服而毁了自己。"
 me_etruria.38.ct:0 "外交官们很失望，他们的统治者也许会被冒犯。"
 me_etruria.38.desc:0 "伊特鲁里亚联盟的使者带着统治者的口信抵达。他们试图最终杀死罗马狼。考虑到我们自己穿越亚得里亚海并占领意大利半岛上希腊南部城市的野心，他们来找我们了。"
 me_etruria.38.desc_1:0 "$me_etruria.38.desc$\n他们为我们提供了大量的金银财宝，试图将我们争取到他们的事业中。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_etruria.38.desc_2:0 "$me_etruria.38.desc$\n他们向我们提供了一定数量的银子，试图争取我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_etruria.38.desc_3:0 "$me_etruria.38.desc$\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_etruria.38.title:0 "来自伊特鲁里亚的信使"
 me_etruria.39.a:0 "结果比我们预想的还要好！"
 me_etruria.39.at:0 "伊庇鲁斯给我们的比我们要求的还要#Y 更多#!。"
 me_etruria.39.b:0 "为我们的复兴再添一枚砝码。"
 me_etruria.39.bt:0 "伊庇鲁斯给予我们一个 #Y 结盟请求#!。"
 me_etruria.39.c:0 "他们会为这种侮辱而后悔的。"
 me_etruria.39.ct:0 "伊庇鲁斯 #R 什么都没有#!给我们。"
 me_etruria.39.desc_1:0 "$me_etruria.39.desc$伊庇鲁斯人不仅接受了我们的结盟提议，还为我们提供了更大的支持。他们向我们输送人员、经验和战术，并允许我们的军队在两国之间自由行动。我们与伊庇鲁特人的新友谊必将结出丰硕的果实。"
 me_etruria.39.desc_2:0 "$me_etruria.39.desc$伊庇鲁斯人接受了我们的结盟提议。我们现在可以利用这个在意大利的重要盟友了。强大的继业者将为我们提供支持！"
 me_etruria.39.desc_3:0 "令人失望的是……伊庇鲁斯已经给了我们答复：一个响亮的“不”。这对我们的领导和我们在意大利脆弱的权力平衡中的政治地位都不利。"
 me_etruria.39.title:0 "伊庇鲁斯的反应"
 me_etruria.4.a:0 "派我们的特工去煽动穷人的叛乱——我们必须再次控制维埃纳。"
 me_etruria.4.a.tt:0 "#E [GetProvince('(int32)16').GetName]#! 的新王将以#Y 统帅#!之姿君临"
 me_etruria.4.b:0 "维伊纳昔为天下首富之都——当令商贾们重忆此荣光。"
 me_etruria.4.c:0 "冲突可以等待。现在，让我们“投资”我们未来的领土。"
 me_etruria.4.c.tt:0 "这些 #E [GetCountry('ROM').GetReligion.GetName] [GetCountry('ROM').GetPrimaryCulture.GetName]#!的人口将会出现在#E [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#!:\n#Y 1#! 贵族 @nobles! |  #Y 2#! 公民 @citizens!"
 me_etruria.4.c.tt2:0 "这些 #E [SCOPE.GetRootScope.GetCountry.GetReligion.GetName] [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 人口将会出现在 #E [GetProvince('(int32)16').GetName]#!:\n#Y 1#! 贵族@nobles! |  #Y 2#! 公民 @citizens! |  #Y 3#! 自由民 @freemen! |  #Y 4#! 奴隶 @slaves!"
 me_etruria.4.d:0 "时机未至，当静待其变。"
 me_etruria.4.desc:0 "罗马人攻占[GetProvince('(int32)16').GetName]已逾一代人之久。我们的祖辈犹记当年他们对这场冲突的漠然——那时他们不惧罗马，至今仍未能看透这个宿敌将致我们于万劫不复的可怕潜力。他们早已忘却马库斯·弗留斯·卡米卢斯当年的血腥屠戮。维伊纳城至今仍是我们两大势力之间的重要边界。若能鼓动民众起义，使其重归我邦，日后对抗罗马时胜算必将大增。但须谨言慎行，罗马人绝不会坐视不理太久。"
 me_etruria.4.title:0 "$etruria_roman_incursion_task_1$: 维爱的困境"
 me_etruria.40.a:0 "立即派出骑兵清理港口！"
 me_etruria.40.b:0 "我打赌他们什么也不会做——记住我的话s"
 me_etruria.40.btt:0 "#R 伊特鲁里亚间谍将摧毁奥斯蒂亚的一个港口#!。"
 me_etruria.40.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们的间谍发现了伊特鲁里亚人的阴谋，他们要烧毁我们在[GetProvince('(int32)15').GetName]的一个港口！他们的破坏者已经设法进入了城市——几天后就会摧毁港口，如果我们不马上采取行动，可能就来不及了。"
 me_etruria.40.title:0 "伊特鲁里亚干预"
 me_etruria.41.a:0 "伊特鲁里亚人不能就这样逍遥法外！做该做的事"
 me_etruria.41.b:0 "我们将在更合适的时机反击"
 me_etruria.41.desc:0 "虽然您听到这个消息会非常愤怒，[ROOT.GetCountry.GetRuler.GetName]，但我们不能向您隐瞒真相……-伊特鲁里亚人成功地从我们手中抢走了[GetProvince('(int32)16').GetName]和[GetProvince('(int32)18').GetName]两座城市。\n\n细节目前还不清楚——我们的一些探子说伊特鲁里亚人在市场上行贿，让城里的贵族家庭想起了他们一起赚钱的日子，而其他人则认为城里的穷人爆发了叛乱，然后他们制服了罗马守军并屠杀了他们！\n\n但这并不重要，#E 元老院和罗马人民#!唯一的愿望就是恢复正义！我们的一些元老认为，我们现在就应该派全副武装的人去那两座城市，为[ROOT.GetCountry.GetName]夺回它们。我们应该怎么做，我的[ROOT.GetCountry.GetRulerTitle]？"
 me_etruria.41.title:0 "伊特鲁里亚人的盗窃"
 me_etruria.5.a:0 "火速派兵查明局势！"
 me_etruria.5.desc:0 "急报！执政官阁下，[GetProvince('(int32)16').GetName]叛乱将起！伊特鲁里亚战士已充斥城郊，随时可能屠尽罗马守军，为#E 伊特鲁里亚联盟#!夺取该地。此刻干预或可避免这场灾祸——但必须即刻行动！"
 me_etruria.5.title:0 "$etruria_roman_incursion_task_1$: 维爱的陷落"
 me_etruria.6.a:0 "我们要将七丘之城的每一块基石都连根拔起。"
 me_etruria.6.b:0 "罗马不过弹丸之地，然其子民......屡屡犯我疆界，罪愆难数。"
 me_etruria.6.desc:0 "眼下我等虽皆视[GetCountry('ROM').GetName]为心腹大患，亦认同击溃罗马将开启我族黄金时代，然伊特鲁里亚诸邦对\"罗马之患\"的本质却莫衷一是。\n\n有识之士指罗马城本身乃万恶之源，另有人则谓当惧者实为罗马精神——那股不死不休的蛮劲。必须明确此战首要目标，方能使万民同心戮力。"
 me_etruria.6.title:0 "$etruria_roman_incursion_task_2$: 理念之争还是疆域之夺？"
 me_etruria.7.a:0 "塔尔昆家族曾君临罗马，如今唯有塔耳库那深谙制胜之道。"
 me_etruria.7.b:0 "怖畏之神沃尔图姆纳将庇佑维尔兹纳的将士。"
 me_etruria.7.desc:0 "我军整兵备战之际，两座曾力抗罗马军团的重镇主动请缨助训——[GetProvince('(int32)17').GetName]与[GetProvince('(int32)21').GetName]皆愿倾囊相授。此二城虽皆威名赫赫，然我军中枢仅可择一而立。切莫令城邦之差，毁我三军辎重，乱我同袍之谊。"
 me_etruria.7.title:0 "$etruria_roman_incursion_task_3$：塔耳库那或维尔兹纳的战士"
 me_etruria.8.a:0 "派西斯拉的拉斯·丘里纳斯去。"
 me_etruria.8.a.tt:0 "一位#Y 伊特鲁里亚次要人物 #!出现在@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]境内：#Y 拉斯克·丘里纳斯 #!"
 me_etruria.8.b:0 "派维尔兹纳的维尔图·帕帕特纳斯去。"
 me_etruria.8.b.tt:0 "一个#Y 伊特鲁里亚小人物#! 出现在 @[GetCountry('ROM').GetFlag]! [GetCountry('ROM').GetName|Y]: #Y 维尔图·帕帕特纳斯#! "
 me_etruria.8.desc:0 "是时候派一个人进去了。我们必须明智地选择我们的间谍，因为一旦他离开我们的监视，我们就无法召回他。让我们希望他们能照顾好自己。"
 me_etruria.8.title:0 "$etruria_roman_incursion_task_4$：内应密谋"
 me_etruria.9.a:0 "他这一击，让敌国经济元气大伤！真乃传奇战神！"
 me_etruria.9.a.tt:0 "@[GetCountry('ROM').GetFlag]![GetCountry('ROM').GetName|Y]损失了#R 5 #!艘随机舰船\n[minor_etrurian_spy.GetName|Y]将于#Y 30 #!天后作为#Y 次要人物 #!返回@[SCOPE.GetRootScope.GetCountry.GetFlag]![SCOPE.GetRootScope.GetCountry.GetName|Y]。"
 me_etruria.9.desc:0 "今晨信使急报，[GetProvince('(int32)1').GetName]与[GetProvince('(int32)15').GetName]已陷入滔天火海——看来我们的密探功成身退。据传这名破坏者策动了城中不满的非罗马商人协同作案，待守军察觉时，临水而建的连绵货仓早已尽数燃起。\n\n当奥斯提亚港口的烈焰吞噬最后一片船帆，这名间谍似已搭乘末班船只，逃往我们在科西嘉岛[GetProvince('(int32)3515').GetName]的殖民据点。想必不久后，我们或将重逢。"
 me_etruria.9.title:0 "$etruria_roman_incursion_task_4$: 令人困惑的商人"
 me_etruria_sennones_100_pos_opmod:0 "伊特鲁里亚盟友"
 me_etruria_sennones_50_pos_opmod:0 "附庸宗主国"
 ostia_etrurian_league_city_name:0 "奥斯蒂亚"
 ostia_etrurian_league_city_name_adjective:0 "奥斯蒂亚"
 startup_events.17.a:0 "拉森纳人将再次主宰意大利！"
 startup_events.17.desc:0 "多年来，[ROOT.GetCountry.GetName]一直在缓慢衰退，在我们的请愿祭司面前，预兆和神灵都沉默不语，他们急切地寻找着我们国家至今都没有找到的答案。\n\n自从两百年前的#E 叙拉古人#!和 #E 库迈人#!的舰队在 #E 库迈战役#! 中阻止了我们的南方野心之后，我们在国外的命运就一落千丈，而我们在[GetProvince('(int32)16').GetArea.GetRegion.GetName]的国内情况也好不到哪里去。九十二年前，[GetCountry('ROM').GetName]夺取了[GetProvince('(int32)16').GetName]的控制权，并确保了他们进入意大利中部的通道，这才是真正的危险，我们的边防哨所已经高度警惕，随时准备在边境发现罗马狼的踪迹。\n\n[ROOT.GetCountry.GetRuler.GetName]能否逆转航向，我们拭目以待……"
 startup_events.17.t:0 "伊特鲁里亚的衰落"
 tibur_etrurian_league_city_name:0 "提部耳"
 tibur_etrurian_league_city_name_adjective:0 "提部耳"

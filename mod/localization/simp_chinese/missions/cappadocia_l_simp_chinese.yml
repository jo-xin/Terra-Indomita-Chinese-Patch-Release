 cappadocia_event.1.a:0 "欧迈尼斯是我们必须处理的一个威胁"
 cappadocia_event.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]有一些细枝末节需要解决，不幸的是，这包括老糊涂[GetCharacter('(int32)431').GetName]的继承者，他们已经向[ROOT.GetCountry.GetName]宣战。\n\n欧迈尼斯家族，相信他们的时刻已经到来，聚集在[GetCharacter('(int32)432').GetName]周围，企图推翻我们，他们严重误判了。"
 cappadocia_event.1.t:0 "欧迈尼斯的继承者"
 cappadocia_event.10.a:0 "多么美妙啊!"
 cappadocia_event.10.b:0 "这让我很难过..."
 cappadocia_event.10.desc_1:0 "我很遗憾地告诉大家，尽管我们提出了一个公平的提议，但我们向我们的宗主购买领土的请求却遭到了嘲笑和讥讽。我们被严肃地告知，如果我们再问这种愚蠢的问题，我们将因言行不一而受到惩罚。"
 cappadocia_event.10.desc_2:0 "你可能不相信，[ROOT.GetCountry.GetRuler.GetName]，但是霸宗主已经对我们购买土地的请求做出了回应，并且同意了这笔交易！他们的代理人已经拿了我们的钱！他们的代理人已经收了我们的钱，目前一切都已完成。"
 cappadocia_event.10.t:0 "提议：回复"
 cappadocia_event.100.a:0 "亚历山大自豪地看着我们。"
 cappadocia_event.100.desc:0 "所有那些追求个人荣誉而背弃誓言的叛徒都被埋入坟墓，而[ROOT.GetCountry.GetRuler.GetName]立于最高点，被公认为阿吉德的真正保卫者。"
 cappadocia_event.100.t:0 "阿吉德的保卫者"
 cappadocia_event.101.a:0 "现在只有一个了……"
 cappadocia_event.101.desc:0 "在一个真正高贵的光芒几乎熄灭的世界里，确有一团明亮的火焰在[ROOT.GetCountry.GetCapital.GetName]燃烧着。无可匹敌的[ROOT.GetCountry.GetRuler.GetName]的家园——最后的保皇派。"
 cappadocia_event.101.t:0 "最后的保皇派"
 cappadocia_event.102.a:0 "市场将充满黄金可以买到的最好的商品。"
 cappadocia_event.102.desc:0 "卡帕多西亚的首府，#E 马匝卡#!，处于一个很好的位置，我们肯定可以将其扩展为该地区卓越的贸易中心--让我们看看随着时间的推移我们能够做什么。"
 cappadocia_event.102.t:0 "马匝卡的贸易中心"
 cappadocia_event.103.a:0 "确实很光荣。让我们继续，不遗余力。"
 cappadocia_event.103.desc:0 "在过去的日子里[GetProvince('(int32)7998').GetName]的谦卑省份是#E 本都#!国王的居所。恢复这个被遗弃的地方昔日的辉煌将为[ROOT.GetCountry.GetName]带来巨大的荣耀。"
 cappadocia_event.103.t:0 "加齐乌拉的宫殿"
 cappadocia_event.104.a:0 "的确，亚历山大的文化是值得敬仰的。"
 cappadocia_event.104.desc:0 "说来说去，谁不希望成为马其顿人呢？他们是征服者，在战斗中无可匹敌，狡猾而熟练......拥抱这种著名的文化是很自然的。"
 cappadocia_event.104.t:0 "优秀文化"
 cappadocia_event.105.a:0 "地下的天气总是很好。"
 cappadocia_event.105.desc:0 "在过去的日子里，当危险的威胁抬头时，我们的人民会涌向刻在大地本身石头上的地下城市。尽管许多人可能认为，那些麻烦的日子仍然与我们同在，所以我们应该在有时间的时候扩大这些城市。"
 cappadocia_event.105.t:0 "拓展地下城市"
 cappadocia_event.106.a:0 "那么就应该如此。"
 cappadocia_event.106.desc:0 "[GetProvince('(int32)1951').GetName]市正处于一个重要的十字路口，值得我们特别关注——它的宝贵位置使它成为扩大[ROOT.GetCountry.GetAdjective]存在的自然候选者。"
 cappadocia_event.106.t:0 "提亚纳的行政管理"
 cappadocia_event.107.a:0 "我们有在战斗中磨练出来的卓越力量。"
 cappadocia_event.107.desc:0 "我们已经掌握了在我们周围的困难国家作战的艺术，无论我们是在平原上驰骋，还是在山上冲锋，我们的部队总是会带来胜利。"
 cappadocia_event.107.t:0 "卡帕多西亚训练"
 cappadocia_event.108.a:0 "完美；进口最好的货物。"
 cappadocia_event.108.desc:0 "我们已经征服了通往海岸的道路，这是一个值得整个[ROOT.GetCountry.GetName]庆祝的轰动性武器壮举。我们现在可以进入太过遥远而无法从陆路到达的外国市场——这改变了一切。"
 cappadocia_event.108.t:0 "卡帕多西亚的海岸线"
 cappadocia_event.109.a:0 "我们的海军将威胁到海洋本身。"
 cappadocia_event.109.desc:0 "在#E 奇里乞亚#!地区，人们可以渴望的一切都应有尽有；富庶的农田，宏伟的城市，繁荣的矿场和肥沃的田地。既然我们是如此珍贵土地的管理者，我们应该采取措施，在该地区建立我们的海军力量--对#E 奇里乞亚海#!的控制必须是我们的。"
 cappadocia_event.109.t:0 "奇里乞亚产业"
 cappadocia_event.11.a:0 "你说的没错，先生！谢谢你，先生"
 cappadocia_event.11.desc:0 "由于我们对主人事业的忠诚奉献，[ROOT.GetCountry.GetRuler.GetName]得到了[GetCharacter('(int32)37').GetName]的奖励，为[ROOT.GetCountry.GetAdjective]的国家和人民举行了豪华的仪式。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]你是我最忠诚的仆人之一，为此我赞美你。就像一条忠实的猎犬，你在我身边，我为你的顺从而高兴——我们将一起享受许多阳光灿烂的日子，我的朋友。"
 cappadocia_event.11.t:0 "安于本分"
 cappadocia_event.110.a:0 "嗯……液体黄金……"
 cappadocia_event.110.desc:0 "[GetProvince('(int32)1854').GetName]——即使只是提到生产如此精致的蜂蜜的地方，也足以让人流口水。让我们建设这个地区，以便我们能够制造更多甜美、黄色的东西......而我们指的是黄金。"
 cappadocia_event.110.t:0 "蜂蜜之城"
 cappadocia_event.111.a:0 "自由！！！"
 cappadocia_event.111.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]有理由庆祝，因为我们终于是一个自由的国家了！一种感恩的精神战胜了我们的人民！一种感恩的精神征服了我们的人民，即兴的宗教庆祝活动正在[ROOT.GetCountry.GetName]各地举行，感谢诸神赐予我们的胜利。"
 cappadocia_event.111.t:0 "自由的命运"
 cappadocia_event.112.a:0 "我们是最好的，在我们所做的一切中都是无可超越的。"
 cappadocia_event.112.desc:0 "虽然我们处理了数量惊人的冲突，但我们毫发无损地度过了风暴--这证明了我们的力量和在逆境中不愿意退缩。"
 cappadocia_event.112.t:0 "饱经风暴"
 cappadocia_event.113.a:0 "向我们的工程师致以特别感谢"
 cappadocia_event.113.desc:0 "我们王国中奇妙的地下城市已经越来越受欢迎，无论是在我们的人民中居住，还是在外国土地上的自然环境。我们应该扩大并创建更多的此类城市，这肯定会是一种繁荣。"
 cappadocia_event.113.t:0 "扩大了地下城市网络"
 cappadocia_event.114.a:0 "确保不要直接向下开采。"
 cappadocia_event.114.desc:0 "[GetProvince('(int32)7981').GetName]是我们地下网络的重要枢纽，无数商旅穿梭于其宏伟的地下厅堂，经由通道往来于外界。确保所有货物与人员都能安全通行，必将巩固本地区贸易，吸引更多人口——而人口正是所有文明的根基。  "
 cappadocia_event.114.t:0 "地下城枢纽"
 cappadocia_event.115.a:0 "家庭重聚的时间到了。"
 cappadocia_event.115.desc:0 "我们住在#Y 卡帕多西亚#! 的兄弟们曾经是我们土地的一部分，他们是我们历史的一部分。我们应该把这两部分重新结合起来......"
 cappadocia_event.115.t:0 "恢复祖先的领土"
 cappadocia_event.116.a:0 "理所当然。"
 cappadocia_event.116.desc:0 "一个国家，一个民族，这是一个梦想。当然，这个领域也可以成为其他民族的家园，但这是我们的历史"
 cappadocia_event.116.t:0 "卡帕多西亚的国度"
 cappadocia_event.117.a:0 "聪明而强大，要我说，还很帅。"
 cappadocia_event.117.desc:0 "商品与食物必须有充足的供应，这样才不会已偶然受饥饿和贫困的威胁。幸运的是，我们的统治者很明智地预测到了这一点。"
 cappadocia_event.117.t:0 "地下基础设施"
 cappadocia_event.118.a:0 "我再也不会失去他了。"
 cappadocia_event.118.desc:0 "为了坚持我们的自由，我们需要有一支装备精良的常备军，随时准备保卫我们的边界。对我们来说，庆幸的是，这是所有官兵的共同心声；我们都牺牲了太多才走到今天，没有人希望看到回到过去的日子。"
 cappadocia_event.118.t:0 "获得独立"
 cappadocia_event.119.a:0 "我们相信我们的亲属，但其他任何人都是可疑的"
 cappadocia_event.119.desc:0 "虽然我们在一定程度上信任我们的外国盟友，但很明显，我们会觉得与我们的同胞有更紧密的联系。"
 cappadocia_event.119.t:0 "犯罪团伙"
 cappadocia_event.12.a:0 "我们希望得到政治帮助"
 cappadocia_event.12.b:0 "军事支持总是有益的东西"
 cappadocia_event.12.c:0 "他们的技术超过了我们......他们是否愿意分享？"
 cappadocia_event.12.d:0 "增加经济发展是我们所期望的"
 cappadocia_event.12.desc:0 "今天早上，我们宗主的一位大使来到了[ROOT.GetCountry.GetCapital.getName]。这位[SCOPE.sCharacter('ambassador_char_scope').GetName]被派来帮助我们谈判，以确定我们所要求的到底是什么。一旦我们解决了细节问题，[SCOPE.sCharacter('ambassador_char_scope').GetFirstName]会让我们知道一切进展如何。\n\n然而，一个重要的问题仍然存在；我们所要求的到底是什么？"
 cappadocia_event.12.t:0 "谈判开始"
 cappadocia_event.120.a:0 "遗产！历史！我们将再起！"
 cappadocia_event.120.desc:0 "我们死去已久的祖先给我们留下了遗产，这个遗产我们已经接受并生活。一个我们将复兴的遗产!"
 cappadocia_event.120.t:0 "辛梅里亚的复兴"
 cappadocia_event.121.a:0 "安纳托利亚的妇女是相当..."
 cappadocia_event.121.desc:0 "经过几个世纪与本地卡帕多西亚人和卡塔俄尼亚人的交融，现代的#E 辛梅里亚人#! 已经不再是他祖先的那个辛梅里亚人了。\n\n据说古代的辛梅里亚人是黑发的，双目阴沉，手握利剑；小偷、掠夺者、杀手，有着巨大的忧郁和巨大的欢笑，据说在他们穿着便鞋的脚下踩着地球的宝石宝座。尽管如此，变化并不总是一件坏事......"
 cappadocia_event.121.t:0 "与安纳托利亚人融合"
 cappadocia_event.122.a:0 "我们驰骋在一条新的道路上!"
 cappadocia_event.122.desc:0 "本着我们游牧民族的精神，我们在全国范围内接受了马的方式。与他们一起，我们将把马主新的复苏的消息带到所有的领域。对一些人来说，我们手里拿着弓和箭。"
 cappadocia_event.122.t:0 "马主的崛起"
 cappadocia_event.123.a:0 "冰冷的复仇是如此甜蜜。"
 cappadocia_event.123.desc:0 "#E 辛梅里安人#!曾被#E 吕底亚人#!和#E 弗里吉亚人#!击败，这场失败几乎让我们失去了自己的文化传承。如今我们终于为祖先报仇，确保了我们民族的延续。"
 cappadocia_event.123.t:0 "为古老的辛梅里安人复仇"
 cappadocia_event.124.a:0 "哦，形势逆转......"
 cappadocia_event.124.desc:0 "东方古老富庶的文明静卧于此。昔有来寇，奴役我民；今我往矣，报施相当。"
 cappadocia_event.124.t:0 "向东推进"
 cappadocia_event.125.a:0 "选择，选择......我们有决定要做"
 cappadocia_event.125.desc:0 "我们向古老的故乡进发，解放了被外国占领的大草原，并与我们祖先的亲属建立了联系。虽然我们与#Y 卡帕多西亚人#! 的交融改变了我们的民族，但游牧部落仍然坚持着传统的旧方式，这些方式因部落而异。一些声音声称，我们必须回到我们祖先的方式，然而另一些人说，我们的人民已经发生了太多的变化，我们应该充分利用在这种混合中出现的新文化。"
 cappadocia_event.125.t:0 "古老家园"
 cappadocia_event.13.a:0 "多么光荣的消息啊!发送我们的感谢"
 cappadocia_event.13.b:0 "按我们的运气，发送一个还价，要求更多的东西"
 cappadocia_event.13.c:0 "这是某种玩笑吗？"
 cappadocia_event.13.desc:0 "我们收到的消息是，我们的政治援助请求已被接受，人们期望我们将送去感谢并解决此事。"
 cappadocia_event.13.t:0 "谈判继续进行"
 cappadocia_event.14.a:0 "发出请求"
 cappadocia_event.14.b:0 "这不是我们想要的..."
 cappadocia_event.14.desc:0 "既然我们已经决定请求军事支持，剩下的就是给我们的外交官布置任务，让他们了解任务的具体内容，这是保留给[ROOT.GetCountry.GetRuler.GetName]的任务。"
 cappadocia_event.14.t:0 "军事援助"
 cappadocia_event.15.a:0 "让我们派出我们的谈判代表并希望得到最好的结果"
 cappadocia_event.15.b:0 "我们目前不会派人"
 cappadocia_event.15.desc:0 "现在我们的想法已经决定了，我们只需真正向我们的宗主派出一个信使——我们真的希望我们被认为有足够的价值来接收他们的技术秘密。"
 cappadocia_event.15.t:0 "技术援助"
 cappadocia_event.16.a:0 "我们已经迫不及待地想听到 \"是 \"这个词了!"
 cappadocia_event.16.b:0 "我想我们会接受他们想要的一切"
 cappadocia_event.16.c:0 "我们将加倍努力!"
 cappadocia_event.16.d:0 "多么令人失望..."
 cappadocia_event.16.desc_1:0 "[SCOPE.sCharacter('ambassador_char_scope').GetName]向我们报告说，谈判进行得非常顺利，除非发生意外，否则我们所要求的一切似乎都会得到满足。"
 cappadocia_event.16.desc_2:0 "[SCOPE.sCharacter('ambassador_char_scope').GetName]没有盲目地同意我们的要求，而是返回了一个还价，一个感觉有点争议的还价--看来我们还有一些谈判要做。"
 cappadocia_event.16.desc_3:0 "虽然我们可以看出，[SCOPE.sCharacter('ambassador_char_scope').GetName]很尴尬地给了我们一个否定的答案，但抛开所有的感觉，最终的结果是一样的——我们的宗主已经断然拒绝了我们的请求，并中断了讨论。"
 cappadocia_event.16.t:0 "谈判继续进行"
 cappadocia_event.17.a:0 "让我们派出我们的谈判代表并希望得到最好的结果"
 cappadocia_event.17.b:0 "我们目前不会派人"
 cappadocia_event.17.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们必须派出我们最好的外交官去见我们的宗主，希望他们的恳求能够成功——正如我们所知，生活中没有什么是可以保证的。这甚至值得我们花时间去追求吗？"
 cappadocia_event.17.t:0 "经济援助"
 cappadocia_event.18.a:0 "我们对任何事物都心存感激"
 cappadocia_event.18.b:0 "对我们来说是多么的不幸啊..."
 cappadocia_event.18.desc_1:0 "我们的统治者已经做出了肯定的回应，尽管已经注意到这将是所提供的援助的范围。"
 cappadocia_event.18.desc_2:0 "我们的宗主已经断然拒绝了我们的请求，并要求我们不要用愚蠢的问题浪费他们的时间。"
 cappadocia_event.18.t:0 "一个答案"
 cappadocia_event.19.a:0 "我们对此非常感激--这对[ROOT.GetCountry.GetName]来说是多么大的祝福啊"
 cappadocia_event.19.b:0 "好吧，他们没有必要为此而无礼--嗯哼"
 cappadocia_event.19.desc_1:0 "奇妙的消息!我们从我们的宗主那里得到消息，他们将派一些研究人员和工程师到[ROOT.GetCountry.GetCapital.GetName]工作——看来他们愿意赞助我们的研究活动！"
 cappadocia_event.19.desc_2:0 "我们的霸主对我们的技术援助请求的回应是一个简单的词--不。"
 cappadocia_event.19.t:0 "伸出援助之手"
 cappadocia_event.2.a:0 "我们有大量的金子，所以让我们把这些金子送到"
 cappadocia_event.2.b:0 "我们目前可以腾出人手"
 cappadocia_event.2.desc:0 "为了赤裸裸地讨好[GetCharacter('(int32)37').GetName]，[ROOT.GetCountry.GetRuler.GetName]决定[ROOT.GetCountry.GetName]应该给我们强大的宗主送一份礼物，但还没有决定我们应该给他们什么。"
 cappadocia_event.2.t:0 "忠诚的奖赏"
 cappadocia_event.20.a:0 "我们应该对我们所拥有的感到高兴"
 cappadocia_event.20.b:0 "这对我们来说是不可接受的"
 cappadocia_event.20.desc:0 "[ROOT.GetCountry.GetCapital.GetName]传来消息，我们的问题已经得到了我们亲切的宗主的回答，他认为我们应该满足于目前的一切。"
 cappadocia_event.20.t:0 "收到的答复"
 cappadocia_event.21.a:0 "我们非常幸运地得到了这个"
 cappadocia_event.21.b:0 "对我们来说是多么的不幸啊......唉"
 cappadocia_event.21.desc_1:0 "我们是多么幸运啊！我们的宗主慷慨地派出了他最好的经济顾问到我们的宫廷——我想这意味着我们的援助请求得到了很好的回应。"
 cappadocia_event.21.desc_2:0 "我们的宗主拒绝了我们的请求，声称我们不配获得这种荣誉。"
 cappadocia_event.21.t:0 "经济专家"
 cappadocia_event.22.a:0 "我们对任何事物都心存感激"
 cappadocia_event.22.b:0 "对我们来说是多么不幸啊......这让我很难过"
 cappadocia_event.22.desc_1:0 "必须承认，有时冒险一试是明智的，即使请求已被拒绝，仍可再次提出。\n\n在我们的案例中，我们成功地从我们的统治者那里获得了恩惠，尽管此前已被拒绝——这正是[ROOT.GetCountry.GetRuler.GetName]这位政治家的风范。"
 cappadocia_event.22.desc_2:0 "我们不应该第二次尝试请求帮助，因为我们没有得到回应——看来我们的宗主对我们如此不屑。"
 cappadocia_event.22.t:0 "期待已久的回应"
 cappadocia_event.23.a:0 "我们向着永恒的荣耀迈进!"
 cappadocia_event.23.desc:0 "我们最伟大的胜利时刻即将到来--让我们扭转我们的主人的局面，并作为我们自己土地的真正统治者取得应有的地位。[ROOT.GetCountry.GetRuler.GetName]已经采取了前所未有的步骤，向[ROOT.GetCountry.GetOverlord.GetName]宣战，现在我们所有的地区邻国都焦急地看着谁将从这场冲突中脱颖而出。"
 cappadocia_event.23.t:0 "竞争对手被推翻"
 cappadocia_event.24.a:0 "我们应该专注于[SCOPE.sChar('cap_beguile_gov_char_1').GetGovernorship.GetName]。"
 cappadocia_event.24.b:0 "[SCOPE.sChar('cap_beguile_gov_char_2').GetGovernorship.GetName]是需要关注的更重要的区域。"
 cappadocia_event.24.c:0 "我们不需要他们的帮助。"
 cappadocia_event.24.desc:0 "随着我们决定接管我们的宗主的王国，一些顾问向我们提出建议，试图贿赂一些靠近我们边境的总督，这样一旦我们宣布独立，他们就会加入我们。\n\n虽然这个计划有其优点，但我们应该谨慎，以免惊动[ROOT.GetCountry.GetOverlord.GetRuler.GetName]。"
 cappadocia_event.24.t:0 "谋划反对我们的宗主"
 cappadocia_event.25.a:0 "钱是解决一切问题的办法。"
 cappadocia_event.25.b:0 "一个漂亮的办公场所肯定会得到赞赏。"
 cappadocia_event.25.desc:0 "在购买任何人时，你应该始终确保你不会被人告发。此外，你应该有你的目标想要的东西。这对[SCOPE.GetChar('cap_beguile_gov_char_1').GetName]来说也是如此，他肯定会很好地接受我们的提议，但永远没有完全的确定性......"
 cappadocia_event.25.t:0 "确保[SCOPE.GetChar('cap_beguile_gov_char_1')GetGovernorship.GetName]的安全"
 cappadocia_event.26.a:0 "钱是解决一切问题的办法。"
 cappadocia_event.26.b:0 "一个漂亮的办公场所肯定会得到赞赏。"
 cappadocia_event.26.desc:0 "在购买任何人时，你应该始终确保你不会被人告发。此外，你应该有你的目标想要的东西。这对[SCOPE.GetChar('cap_beguile_gov_char_2').GetName]来说也是如此，他肯定会很好地接受我们的提议，但永远没有完全的确定性......"
 cappadocia_event.26.t:0 "确保[SCOPE.GetChar('cap_beguile_gov_char_2')GetGovernorship.GetName]的安全"
 cappadocia_event.27.a:0 "令人惊叹。"
 cappadocia_event.27.b:0 "这是很值得的。"
 cappadocia_event.27.c:0 "这个恶棍不会得到一个额外的德拉克马！"
 cappadocia_event.27.desc:0 "[SCOPE.GetChar('cap_beguile_gov_char_1').GetName]对我们的'请求'做出了积极的反应，但似乎对交易不太满意......似乎他渴望得到更多。无论如何，他并不渴望[ROOT.GetCountry.GetOverlord.GetAdjective.GetName]的领导权......"
 cappadocia_event.27.t:0 "确保[SCOPE.GetChar('cap_beguile_gov_char_1')GetGovernorship.GetName]的安全：响应"
 cappadocia_event.28.a:0 "令人惊叹。"
 cappadocia_event.28.b:0 "这是很值得的。"
 cappadocia_event.28.c:0 "这个恶棍不会得到一个额外的德拉克马！"
 cappadocia_event.28.desc:0 "[SCOPE.GetChar('cap_beguile_gov_char_2').GetName]对我们的'请求'做出了积极的反应，但似乎对这笔交易并不十分满意......似乎他渴望得到更多。无论如何，他并不渴望[ROOT.GetCountry.GetOverlord.GetAdjective.GetName]的领导权......"
 cappadocia_event.28.t:0 "确保[SCOPE.GetChar('cap_beguile_gov_char_2')GetGovernorship.GetName]的安全：响应"
 cappadocia_event.29.a:0 "现在要处理的是[ROOT.GetCountry.GetOverlord.GetRuler.GetName]。"
 cappadocia_event.29.desc:0 "现在我们已经与[SCOPE.GetChar('cap_beguile_gov_char_1').GetName]达成了协议，我们终于可以着手计划打倒我们共同的敌人了。在我们的新朋友的帮助下，我们一定会战胜我们的敌人所提供的一切。"
 cappadocia_event.29.t:0 "有保障的支持"
 cappadocia_event.3.a:0 "他们肯定会感谢一些技术"
 cappadocia_event.3.b:0 "呃，我们将在政治上帮助他们"
 cappadocia_event.3.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，你会很高兴地知道，我们的一个忠诚的臣子给我们送来了礼物，虽然有一个明确的期望，那就是会有某种回报。我们应该送什么给我们忠实的仆人？他们急切地等待着看我们会送什么给他们。"
 cappadocia_event.3.t:0 "慷慨的礼物"
 cappadocia_event.30.a:0 "现在要处理的是[ROOT.GetCountry.GetOverlord.GetRuler.GetName]。"
 cappadocia_event.30.desc:0 "现在我们已经与[SCOPE.GetChar('cap_beguile_gov_char_2').GetName]达成了协议，我们终于可以着手计划打倒我们共同的敌人了。在我们的新朋友的帮助下，我们一定会战胜我们的敌人所提供的一切。"
 cappadocia_event.30.t:0 "有保障的支持"
 cappadocia_event.31.a:0 "这是为了更大的利益。"
 cappadocia_event.31.b:0 "我不是低级趣味的人。"
 cappadocia_event.31.desc:0 "最近，我们有一些顾问建议尝试暗杀[ROOT.GetCountry.GetOverlord.GetRuler.GetName]，试图为我们反击[ROOT.GetCountry.GetOverlord.GetName]时播种不满和混乱。然而，这将是一个不光彩的行为，并可能被追溯到我们身上，但有明显的好处......如果我们成功的话，那就是。"
 cappadocia_event.31.t:0 "刺杀：一个邪恶的计划"
 cappadocia_event.32.a:0 "发送[SCOPE.sChar('cap_martial_assassin')GetName]。"
 cappadocia_event.32.b:0 "[SCOPE.sChar('cap_charisma_assassin')GetName]将被通过。"
 cappadocia_event.32.desc:0 "在决定谋杀[ROOT.GetCountry.GetOverlord.GetRuler.GetName]后，我们必须决定派谁去做这件事。我们的间谍头子已经强调了可能的路径来接近[ROOT.GetCountry.GetOverlord.GetAdjective][ROOT.GetCountry.GetOverlord.GetRuler.GetTitle]。一个是通过隐形和蛮力，在晚上制服守卫，[SCOPE.sChar('cap_martial_assassin')GetName]会很适合这项任务。另一种方法是通过女性的诱惑，在饭菜或饮料中加入一些毒药......这是一个[SCOPE.sChar('cap_charisma_assassin')GetName]非常愿意承担的角色。"
 cappadocia_event.32.t:0 "刺杀：代理人"
 cappadocia_event.33.a:0 "我们将看到我们的目标在今年年底前被杀死。"
 cappadocia_event.33.b:0 "我们的目标是将[ROOT.GetCountry.GetOverlord.GetRuler.GetHerHim]自己放在银牌上。"
 cappadocia_event.33.c:0 "这是不值得的。"
 cappadocia_event.33.desc:0 "[ROOT.GetCountry.GetOverlord.GetRuler.GetName]已经开始大大信任我们的代理人，让[ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis]未来的凶手在晚上轻松进入[ROOT.GetCountry.GetOverlord.GetRuler.GetHerHis]的房间。当然，前提是我们的特工愿意为这样一个有声望的职位付出代价。然而，如此接近，可能会增加被发现的风险......"
 cappadocia_event.33.t:0 "刺杀：机会"
 cappadocia_event.34.a:0 "这是灾难性的。"
 cappadocia_event.34.desc:0 "祸不单行！我方密探行至宗主国首都[ROOT.GetCountry.GetOverlord.GetCapital.GetName]时，竟被王室近卫军认出。虽未全面拉响警报，但已人人自危，哨卫兵力倍增。愿刺客尚能功成..."
 cappadocia_event.34.t:0 "刺杀：挫折"
 cappadocia_event.35.a:0 "没有人会相信他。"
 cappadocia_event.35.b:0 "付钱给他们"
 cappadocia_event.35.desc:0 "大事不妙！我方密探在宗主国首都[ROOT.GetCountry.GetOverlord.GetCapital.GetName]行动时，竟被一名亚历山大远征军老兵识破。所幸此人对[ROOT.GetCountry.GetOverlord.GetRuler.GetName]素有不满，愿意保持沉默——当然，得收点封口费——但若我们拒绝支付，他极可能向宫廷告密以换取赏赐。"
 cappadocia_event.35.t:0 "刺杀：骚动"
 cappadocia_event.36.a:0 "那就开战吧。"
 cappadocia_event.36.b:0 "当你谈及此事时，一切都会好转。"
 cappadocia_event.36.desc_1:0 "随着[ROOT.GetCountry.GetOverlord.GetAdjective]要求屈服而我们要求独立。我们已经得出结论，解决我们之间分歧的方法只有一个，战争。我们的名誉将在#E 安纳托利亚#!的战场上决定，他将用优秀者非鲜血浇灌。"
 cappadocia_event.36.desc_2:0 "幸运的是，[ROOT.GetCountry.GetOverlord.GetAdjective]们已经同意了我们的独立要求，他们甚至向我们提出了友谊，说结盟会加强我们两个国家，否则我们会在其他继业者的秃鹰面前变得脆弱。"
 cappadocia_event.36.t:0 "[ROOT.GetCountry.GetName]的独立"
 cappadocia_event.37.a:0 "战争是我们唯一的选择。"
 cappadocia_event.37.b:0 "我们应首先尝试外交手段。"
 cappadocia_event.37.desc:0 "在过去的几年里，越来越多的异议声音在我们城市的市场上响起，他们要求我们的国家从[ROOT.GetCountry.GetOverlord.GetAdjective]s.中独立出来，表达他们的不满。\n\n然而，并不是所有的人都渴望同样的事情，有些人想看到为过去的错误行为偿还我们的宗主，并把它看作是一种偿还的形式，而其他人则参与到和平地确保我们的独立，说没有人需要死亡。"
 cappadocia_event.37.t:0 "要求独立"
 cappadocia_event.38.a:0 "那就开战吧。"
 cappadocia_event.38.b:0 "让他们自由活动。"
 cappadocia_event.38.desc:0 "灾难性的一天!我们的附庸[SCOPE.sCountry('cap_subject_country_scope')GetName]要求独立，如果我们不立即释放他们，就威胁要发动战争!"
 cappadocia_event.38.t:0 "独立的要求"
 cappadocia_event.39.a:0 "如果你想要自由，你就必须为它而战。"
 cappadocia_event.39.b:0 "一个盟友比一个敌人好。"
 cappadocia_event.39.desc:0 "我们的主体[SCOPE.sCountry('cap_subject_country_scope')GetName]渴望独立，要求我们给予他们充分的自治权，而接受他们为盟友。他们的外交官甚至敢于讨论所谓的双方'互利'。"
 cappadocia_event.39.t:0 "独立的要求"
 cappadocia_event.4.a:0 "我们对他们给予我们的一切表示感谢"
 cappadocia_event.4.desc:0 "奇妙的消息!我们的宗主已经承认了我们的礼物，并且已经回报了我们——事实上，我们今天早上已经收到了他们的奉献。我想知道送的是什么？"
 cappadocia_event.4.t:0 "忠诚的奖赏"
 cappadocia_event.41.a:0 "亚历山大的遗产将是我们的。"
 cappadocia_event.41.desc:0 "作为[GetCharacter('(int32)51').GetName]的继承人，我们和其他所有的继业者一样拥有对亚历山大帝国的宣称，这一宣称通过把我们从安提柯人的枷锁下解放出来，并抵御塞琉古人的威胁而得到巩固。最重要的是，我们控制了亚历山大最初征服的大部分地区。如果不是我们，谁能重演他的战役？"
 cappadocia_event.41.t:0 "阿明塔斯王国"
 cappadocia_event.42.a:0 "在世界的这个角落，我的话就是法律"
 cappadocia_event.42.desc:0 "[ROOT.GetCountry.GetRuler.GetName]拥有一支训练有素、装备精良的军队，[ROOT.GetCountry.GetRuler.GetSheHe]可以随时调用，以捍卫[ROOT.GetCountry.GetName]的边界和利益，在争夺#E 安纳托利亚#!的控制权时，没有人能够与他们的人民对抗。不用说，\"安纳托利亚的霸主 \"这一称谓是当之无愧的。"
 cappadocia_event.42.t:0 "安纳托利亚霸主"
 cappadocia_event.43.a:0 "太少了，太晚了--胜利将属于我们！"
 cappadocia_event.43.desc:0 "考虑到[ROOT.GetCountry.GetRuler.GetName]最近是多么的平静，没有人想到自称是[ROOT.GetCountry.GetRulerTitle]的#E 阿里亚拉提王朝#! 正在秘密地举兵进攻卡帕多西亚。当疯狂的信使带着[ROOT.GetCountry.GetRuler.GetFirstName]宣战的消息到达时，[GetProvince('(int32)1799').GetName]出现了巨大的惊愕，并立即发出了征兵的号召。"
 cappadocia_event.43.t:0 "阿里阿拉特的叛乱"
 cappadocia_event.44.a:0 "我们将报答我们的亚美尼亚朋友。"
 cappadocia_event.44.b:0 "我绝不屈服！"
 cappadocia_event.44.desc:0 "对于他们对马其顿伪君子的慷慨支持，亚美尼亚人现在要求付款，算是一种贡品吧。我们应该向那些野蛮的山民的要求低头吗？"
 cappadocia_event.44.t:0 "支持亚美尼亚人的代价"
 cappadocia_event.45.a:0 "我们将用黄金来报答他们的帮助。"
 cappadocia_event.45.b:0 "我们支持他们的政治图谋。"
 cappadocia_event.45.c:0 "我们将服从他们的统治。"
 cappadocia_event.45.desc:0 "生活中没有什么是真正免费的，这是一句古老的谚语，它是如此真实。为了报答亚美尼亚人对我夺回王位的支持，我们必须决定如何报答他们。我们是送去贡品，还是支持他们？甚至两者兼而有之？我们的亚美尼亚伙伴肯定希望得到补偿，所以我们需要考虑一下我们要给他们什么。"
 cappadocia_event.45.t:0 "支持亚美尼亚人的代价"
 cappadocia_event.46.a:0 "至此，债务两清。"
 cappadocia_event.46.b:0 "对于人们所流的血来说，这只是一个微不足道的数字。"
 cappadocia_event.46.c:0 "至此，债务两清。"
 cappadocia_event.46.d:0 "我们给他的东西是不够的。"
 cappadocia_event.46.desc_1:0 "阿里亚拉特斯虽已偿还债务，送来丰厚钱款——但此等数目岂能令人满意？何不索求更多？"
 cappadocia_event.46.desc_2:0 "为报援助之恩，阿里亚拉特斯已承诺支持我国政治图谋——然我军将士流血牺牲，岂是区区承诺可偿？"
 cappadocia_event.46.desc_3:0 "阿里阿拉特向我们提供了他的附庸地位，作为我们支持夺回卡帕多西亚王位的报酬。虽然这是一个诱人的提议，但我们确定要接受它吗？"
 cappadocia_event.46.e:0 "至此，债务两清。"
 cappadocia_event.46.f:0 "我们不需要祈求者。"
 cappadocia_event.46.t:0 "阿里阿拉特对援助的报答"
 cappadocia_event.47.a:0 "我们没有选择..."
 cappadocia_event.47.b:0 "我们已经偿清债务！"
 cappadocia_event.47.c:0 "真是松了一口气。"
 cappadocia_event.47.desc_1:0 "亚美尼亚人欣然受礼，旧账已清。愿友谊之树长青，来日方长。"
 cappadocia_event.47.desc_2:0 "亚美尼亚人给我们送来了一个信使，这可不是什么好消息。他们认为我们提供的贡品是微不足道的，并要求更高的金额！我们应该同意他们的无理要求吗？我们应该答应他们无理的要求吗？"
 cappadocia_event.47.t:0 "支持亚美尼亚人的代价：答复"
 cappadocia_event.48.a:0 "他将为这一天的到来而感到后悔!"
 cappadocia_event.48.b:0 "我们是一个讲道理的人，也许他会是一个讲道理的朋友。"
 cappadocia_event.48.desc_1:0 "这个波斯恶棍没有满足我们增加报酬的要求，这条猎犬！我们现在必须迫使他屈服！我们现在必须迫使他屈服。我们给他的，我们可以拿走！"
 cappadocia_event.48.desc_2:0 "事实证明，阿里阿拉特是通情达理的，满足了我们越来越多的赔偿要求。他认识到，为他的王位流了多少亚美尼亚人的血，就值多少黄金。"
 cappadocia_event.48.t:0 "阿里阿拉特对援助的报答"
 cappadocia_event.49.a:0 "警惕性是今天的名称。"
 cappadocia_event.49.b:0 "一切都是美好的。"
 cappadocia_event.49.desc_1:0 "亚美尼亚人因我方拒绝而震怒，已开始动员备战......我等须整军经武。但愿他们只是虚张声势。"
 cappadocia_event.49.desc_2:0 "尘埃落定，宿债已偿。自此前路无碍，更得挚友相伴。"
 cappadocia_event.49.t:0 "支持亚美尼亚人的代价：回复"
 cappadocia_event.5.a:0 "我们需要你的帮助来赢得这场战争!"
 cappadocia_event.5.b:0 "我们需要的只是人和钱......我们可以自己做这件事。"
 cappadocia_event.5.c:0 "嗯，我们不需要任何东西"
 cappadocia_event.5.desc:0 "我们的附庸国[GetCountry('cap').GetName]已多次证明其忠诚，且时常进献厚礼。\n但令人担忧的是，我们最近听闻[GetCharacter('(int32)431').GetName]之子在卡帕多西亚发动叛乱，企图夺回其父的旧业。既然我们曾击败其父，如今这位忠诚的附庸请求我们伸出援手。最终要由[ROOT.GetCountry.GetRuler.GetName]来决定如何回应他们的请求。"
 cappadocia_event.5.t:0 "忠诚的奖赏"
 cappadocia_event.50.a:0 "他们会屈服的！"
 cappadocia_event.50.b:0 "我们该做些什么？"
 cappadocia_event.50.desc:0 "阿里阿拉特拒绝遵守我们的合理要求，只看到一个可能的结果；战争。只有[ROOT.GetCountry.GetRuler.GetName]最后一刻的决定，肯定是不受欢迎的，才能改变最近发生的事情给我们带来的轨迹。"
 cappadocia_event.50.t:0 "给阿里阿拉特的最后通牒"
 cappadocia_event.51.a:0 "我们将屈服...目前为止。"
 cappadocia_event.51.b:0 "我们将战斗到底。"
 cappadocia_event.51.desc:0 "亚美尼亚狗向我们发出了最后通牒；要么鞠躬，要么死。\n\n现在，是讲真话的时候了，我们的能力将在战斗中得到检验——否则我们将被视为懦夫，只要我们受到无名小卒的威胁，就会屈服。"
 cappadocia_event.51.t:0 "亚美尼亚的最后通牒"
 cappadocia_event.52.a:0 "钱会说服他们，就像它说服所有人一样。"
 cappadocia_event.52.b:0 "送给他们健全的人，看看他们怎么说。"
 cappadocia_event.52.desc:0 "亚美尼亚人可能会成为国家的宝贵盟友，因为我们的一些利益是一致的。也许是是向亚美尼亚人伸出友谊之手了.......毕竟，问问也无妨。"
 cappadocia_event.52.t:0 "亚美尼亚联盟"
 cappadocia_event.53.a:0 "你在我这里有了一个朋友!"
 cappadocia_event.53.b:0 "联盟？与卡帕多西亚？哈，好像是。"
 cappadocia_event.53.desc:0 "卡帕多西亚人把结盟的提议带到了亚美尼亚的边界，希望通过把他们的命运与我们的命运联系起来，为他们的国家找到某种稳定。\n\n请注意，一旦他们知道有伙伴愿意和他们一起战斗，他们无疑会要求军事援助。"
 cappadocia_event.53.t:0 "卡帕多西亚的朋友？"
 cappadocia_event.54.a:0 "这将改变我们地区的权力平衡。"
 cappadocia_event.54.desc:0 "我们送给亚美尼亚的供品受到了好评，他们带回了一个好消息。我们的敌人一旦发现卡帕多西亚和亚美尼亚手拉手站在一起，就会畏惧！"
 cappadocia_event.54.t:0 "亚美尼亚接受!"
 cappadocia_event.55.a:0 "看看这些黄金是否会改变他们的想法。"
 cappadocia_event.55.b:0 "那些亚美尼亚的狗......我们不需要它们"
 cappadocia_event.55.desc:0 "这些顽固不化的亚美尼亚人竟拒绝我们的慷慨提议！他们口出恶言——为避免失态，恕不转述——但我们该如何回应？"
 cappadocia_event.55.t:0 "亚美尼亚拒绝了!"
 cappadocia_event.56.a:0 "他们似乎不顾一切的忠与我们。"
 cappadocia_event.56.b:0 "哈!多么可悲。没有。"
 cappadocia_event.56.desc:0 "有趣的是，尽管我们拒绝与卡帕多西亚人结盟，但他们却给我们送来了更多的黄金，试图说服我们。诚然，他们一定是急于寻找一个盟友+他们愿意为了买一个朋友而使自己的王国破产吗？\n\n我们应该改变立场吗？"
 cappadocia_event.56.t:0 "又是卡帕多西亚？"
 cappadocia_event.57.a:0 "我们将继续忠于塞琉古。"
 cappadocia_event.57.b:0 "挣脱这头猪的时候到了。"
 cappadocia_event.57.desc:0 "我们目前仍然是塞琉古王国的附属国。然而，许多[ROOT.GetCountry.GetName]在的人渴望自由地管理我们自己独立的国家。\n\n虽然我们的军事顾问对在战场上对阵塞琉古的前景感到紧张，但如果我们希望独立，他们不会阻止我们宣布独立。"
 cappadocia_event.57.t:0 "塞琉古帝国的附庸主权问题"
 cappadocia_event.58.a:0 "和平投降，拯救人民的生命"
 cappadocia_event.58.b:0 "拒绝!我们并不害怕[GetCharacter('(int32)24').GetFirstName]。"
 cappadocia_event.58.desc:0 "[GetCharacter('(int32)24').GetName]的信使们以不寻常的粗暴态度发出了最后通牒，这种缺乏外交装饰的做法表明，他们真的不在乎我们如何回答，因为他们相信他们最终会得到他们的方式。\n\n[ROOT.GetCountry.GetRuler.GetName]仍在观察他们是否同意。"
 cappadocia_event.58.t:0 "塞琉古的最后通牒"
 cappadocia_event.59.a:0 "我们必须为战争做好准备..."
 cappadocia_event.59.b:0 "告诉他们，我们宣称一些边境省份..."
 cappadocia_event.59.c:0 "实际上，我不认为有必要改变什么"
 cappadocia_event.59.desc:0 "长久以来，我们允许亚美尼亚人在他们坚固的山路上统治我们的土地，而不考虑我们的人民，但这种情况必须改变。\n\n[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetCapital.GetName]聚集了信使，以便向我们的宗主传递一个信——-我们是一个自由的民族。"
 cappadocia_event.59.t:0 "来自亚美尼亚的自由"
 cappadocia_event.5_war_overlord_tt:0 "我们将派遣使者前往附庸国，申明我方对此次战争的支援立场。"
 cappadocia_event.6.a:0 "事情就是这样..."
 cappadocia_event.6.desc_1:0 "我们已经收到了我们的宗主的回复——他们已经加入了我们的战争，感谢诸神！"
 cappadocia_event.6.desc_2:0 "我们的宗主对我们的恳求作出了回应，认为我们值得得到一份礼物——幸运的是，他们给我们送来了物质援助，在未来的日子里会有很大用途。"
 cappadocia_event.6.desc_3:0 "虽然我们已经请求我们的宗主帮助我们，但他们似乎没有理会我们......。"
 cappadocia_event.6.t:0 "忠诚的奖赏"
 cappadocia_event.60.a:0 "当然，我们会要求它。"
 cappadocia_event.60.b:0 "让我们采取一种外交方式。"
 cappadocia_event.60.desc:0 "我们很想维护我们在#E 亚美尼亚#!地区的主导地位。唯一的问题是我们将如何做到这一点。一方面，我们可以尝试宣称我们的统治地位，这可能会导致流血事件，但另一方面，外交策略同样可以导致一个理想的结果。"
 cappadocia_event.60.t:0 "我们的亚美尼亚"
 cappadocia_event.61.a:0 "让他们去吧......这就是事实。"
 cappadocia_event.61.b:0 "他们将拥有这块土地......目前。"
 cappadocia_event.61.c:0 "只要价格合适，他们就可以拥有它。"
 cappadocia_event.61.d:0 "绝不！"
 cappadocia_event.61.desc:0 "来自我们的附庸[GetCountry('ARI').GetName]的消息已经传到了我们的宫廷。他们不仅要求独立，而且还宣称了我们最西部的一些领土，并要求和平地移交这些领土——真是胆大包天！"
 cappadocia_event.61.t:0 "对独立的要求"
 cappadocia_event.62.a:0 "最后。"
 cappadocia_event.62.b:0 "令人惊叹的是。"
 cappadocia_event.62.c:0 "战争它是。"
 cappadocia_event.62.desc_1:0 "我们终于实现了我们的人民渴望已久的东西--自由。我们现在是我们自己命运的主人，荣耀在等待着我们。我们现在终于可以朝着夺回[ROOT.GetCountry.GetRuler.GetName]的祖国#Y 波斯#!的方向前进了。"
 cappadocia_event.62.desc_2:0 "我们终于实现了我们的人民渴望已久的东西--自由。我们现在是我们自己命运的主人，荣耀在等待着我们。[GetCountry('ARM')GetAdjective]们也承认了我们对[GetProvince('(int32)1778')GetArea.GetName]和[GetProvince('(int32)1850')GetArea.GetName]的优越要求！[GetCountry('ARM')GetAdjective]们也承认了我们对[GetProvince('(int32)1778')GetArea.GetName]的优越要求！向着光荣前进!"
 cappadocia_event.62.desc_3:0 "[GetCountry('ARM').GetAdjective]已经拒绝了我们对独立的要求，这些狗。现在他们拒绝了我们对[GetProvince('(int32)1778').GetArea.GetName]和[GetProvince('(int32)1850').GetArea.GetName]的宣称……不，他们甚至拒绝我们的基本愿望。我们将不得不让他们看看现在谁能把对方打得服服帖帖--对这些混蛋毫无怜悯之心!"
 cappadocia_event.62.t:0 "来自亚美尼亚的自由"
 cappadocia_event.63.a:0 "夺回阿契美尼德王朝的王位。"
 cappadocia_event.63.b:0 "我们将永远被称为 \"波斯\"。"
 cappadocia_event.63.c:0 "打造一个新的遗产。"
 cappadocia_event.63.d:0 "我们的名字将不那么宏伟，但却很有气势"
 cappadocia_event.63.desc:0 "当考虑到这一切时，我们不就成了名副其实的阿契美尼德吗？在这一点上，我们可以很容易地宣称他们的衣钵，或者也许我们应该给自己一个新的称号，一个反映我们自己成就的称号？我们应该让[ROOT.GetCountry.GetRuler.GetName]来决定我们是谁。"
 cappadocia_event.63.t:0 "新阿契美尼德王朝"
 cappadocia_event.64.a:0 "出击之时已至——我将为我父亲的死报仇!"
 cappadocia_event.64.desc:0 "[ROOT.GetCountry.GetRuler.GetName]在过去几个月里一直在秘密积蓄力量，积累了大量的黄金和忠于#E 欧迈尼斯#!事业的人手。[ROOT.GetCountry.GetRuler.GetFirstName]从未怀疑过，许多人记得曾对他父亲所犯的罪行，当伸张正义的时刻到来时，他们会涌向他的旗帜。\n\n背信弃义的卡帕多西亚人将要遭遇不幸，他们的时日已至。"
 cappadocia_event.64.t:0 "一个大胆的赌注"
 cappadocia_event.65.a:0 "囫囵吞枣地吃下去"
 cappadocia_event.65.b:0 "我们应该做适当的预算，并在许多年内利用这一点。"
 cappadocia_event.65.desc:0 "如今#E 奇里乞亚#!的丰饶资源尽归我手，我们必须做出振奋人心的抉择——该如何运用从这片沃土掠夺的财富？"
 cappadocia_event.65.t:0 "奇里乞亚的战利品"
 cappadocia_event.66.a:0 "我是有史以来最伟大的将军，我将证明这一点。"
 cappadocia_event.66.desc:0 "尽管许多人怀疑我们是否有能力实现我们所取得的成就，但[ROOT.GetCountry.GetRuler.GetName]又一次完成了不可能的任务，震惊了世界。\n\n唯一未知的荣耀是[GetCharacter('(int32)39').GetName]本人的遗产。"
 cappadocia_event.66.t:0 "希腊化帝国"
 cappadocia_event.67.a:0 "总是先下手为强。"
 cappadocia_event.67.b:0 "专注于保护我们的侧翼"
 cappadocia_event.67.desc:0 "[ROOT.GetCountry.GetRuler.GetName]决定亲自参观令人恐惧的#E 卡帕多西亚骑兵#! 在战役季节之间训练的马厩。[ROOT.GetCountry.GetRulerTitle]很高兴看到这些人在勤奋地工作，但访问的原因不是简单的检查--现在是让我们的骑兵磨练战斗战术的时候了，[ROOT.GetCountry.GetRuler.GetFirstName]在那里给骑兵们下命令。"
 cappadocia_event.67.t:0 "卡帕多西亚骑兵"
 cappadocia_event.68.a:0 "任命本地#E 卡帕多西亚人#!。"
 cappadocia_event.68.b:0 "古代马主之路将是我们的选择。"
 cappadocia_event.68.desc:0 "一段时间以来，我们在政治上受到各方面的困扰，与内部和外部的敌人作斗争。缓解这种压力的方法之一是任命许多当地人担任权力职务；这是一条不受欢迎的道路，但也是我们发现自己不得不走的道路。\n\n现在唯一的问题是任命谁？一个肯定会导致争吵的问题。希望它能在未来带来一个强大的卡帕多西亚。"
 cappadocia_event.68.t:0 "本地管理"
 cappadocia_event.69.a:0 "我量他们不敢他们造反!"
 cappadocia_event.69.b:0 "让出一些特权以维持和平。"
 cappadocia_event.69.desc:0 "并非所有的人都对为当地人进入政府让路的决定感到满意，他们要求对他们的特权进行担保和让步，如果我们不遵守，他们就威胁要公开反叛。我们应该如何处理这些要求？"
 cappadocia_event.69.t:0 "一个本土政府：反对派"
 cappadocia_event.7.a:0 "然而，我们将取得胜利——向着胜利前进!"
 cappadocia_event.7.desc:0 "诅咒!卑鄙的[GetCharacter('(int32)50').GetName]认为现在是为自己夺取权力的时刻，并且已经宣战，但更糟糕的是，背信弃义的#E 亚美尼亚人#! 已经响应了他的号召。\n\n我们现在面临一场大规模的区域冲突，只有众神知道我们是否准备好了。"
 cappadocia_event.7.t:0 "阿里阿拉特的威胁"
 cappadocia_event.70.a:0 "这只是一些部落。"
 cappadocia_event.70.b:0 "我们应该进一步研究这些人是谁。"
 cappadocia_event.70.desc:0 "最近，我们的一些侦察员报告说，在我们乡下的平原上看到了一个奇怪的游牧民族，他们说一种外国语言，但却掌握了我们的语言。他们骑着小马，比马应该有的尺寸还要小。只有小马驹才有这样的尺寸，然而那些显然不是!\n这些人足够友好，对贸易持开放态度，说他们已经在这个地区生活了几代人。虽然他们似乎喜欢骑着马从一个地方到另一个地方，但他们与当地的卡帕多西亚人和卡塔俄尼亚人有很多相似之处，他们肯定与他们有关系。"
 cappadocia_event.70.t:0 "一个陌生的民族"
 cappadocia_event.71.a:0 "我们已经使安纳托利亚再次变得伟大。"
 cappadocia_event.71.desc:0 "长期以来，安纳托利亚一直被外来势力占领，先是亚述人，然后是波斯人，直到最近才是马其顿人。然而，今天我们站在这里，摆脱了外国的枷锁，自由地成为我们的传统所决定的，从外国统治中解放出来。安纳托利亚人再次统治了安纳托利亚！\n小部分入侵者仍然生活在我们的国家，然而他们已经开始追随我们的步伐，在我们的领域里和平地生活，谁知道呢？也许再过几代人，他们也会成为安纳托利亚人，不再是外来者......"
 cappadocia_event.71.t:0 "安纳托利亚帝国"
 cappadocia_event.72.a:0 "我们有一个梦想......而且我们实现了它！"
 cappadocia_event.72.desc:0 "许多代以前，我们的祖先从草原来到卡帕多西亚，寻找新的家园和住所。当他们被吕底亚人打败后，一切似乎都失去了意义，西梅里亚王国的梦想瞬间消失了。然而，今天我们站在这里，战胜了我们古老的敌人，为我们的人民创造了一个王国。西梅里亚人现在可以随风而行，过着平静的生活，并始终确信有一个可以回来的家。"
 cappadocia_event.72.t:0 "辛梅里亚之梦"
 cappadocia_event.73.a:0 "即使没有任何流血事件，我们现在也是自由的!欢乐的日子"
 cappadocia_event.73.desc:0 "慑于我们的军事实力和我们对战争的威胁，我们的宗主给予了我们自由，害怕战场上的战斗。"
 cappadocia_event.73.t:0 "被授予自由"
 cappadocia_event.8.a:0 "这是一笔千载难逢的交易 -——是的，绝对是的"
 cappadocia_event.8.b:0 "我们无法承担如此昂贵的价格"
 cappadocia_event.8.desc:0 "[GetCharacter('(int32)37').GetName]已经认可了[ROOT.GetCountry.GetRuler.GetName]所提供的服务，为了表示善意，他向[ROOT.GetCountry.GetCapital.GetName]派出了外交官，提出了一个诱人的提议--以300金出售整个#E 卡帕多西亚-伽耳扫拉#! 地区。"
 cappadocia_event.8.t:0 "忠诚的奖赏"
 cappadocia_event.80.a:0 "让我们做好准备。"
 cappadocia_event.80.desc:0 "在我们向更广阔世界采取任何行动之前，我们必须确保我们在国内的地位是稳固的——我们的人民已经为未来的挑战做好了准备！"
 cappadocia_event.80.t:0 "稳定我们的地位"
 cappadocia_event.81.a:0 "宁为友，不为敌。"
 cappadocia_event.81.desc:0 "我们国家的未来与#E 安提柯王国#!的命运交织在一起。与其成为他们身边的讨厌鬼，不如尽我们所能加强与我们的关系，提高我们在他们心目中的地位。"
 cappadocia_event.81.t:0 "强度与[ROOT.GetCountry.GetOverlord.GetName]的关系"
 cappadocia_event.82.a:0 "本都属于我们！"
 cappadocia_event.82.desc:0 "时机已到，我们必须派遣军队向北进攻#E 本都#!，因我们渴望扩张我们的边界。\n\n我们不觉得北方的部落民能给我们带来多少麻烦，我们的战士希望这是一场快速而简单的战役。"
 cappadocia_event.82.t:0 "推回总督领边界"
 cappadocia_event.83.a:0 "我们的时机已至......希望我们准备充分。"
 cappadocia_event.83.desc:0 "卑鄙的#E 亚美尼亚人#! 利用地区混乱，以我们为代价增加他们的权力，但这个可耻的时代将因为我们而结束！\n\n现在我们已经聚集了我们的力量，让我们赶走插手者，恢复我们国家的荣誉。"
 cappadocia_event.83.t:0 "恢复亚美尼亚所窃"
 cappadocia_event.84.a:0 "我们很快就会像昔日的克罗伊索斯那样富有。"
 cappadocia_event.84.desc:0 "诸神赐予我们深不可测的财富，确认我们注定要享受作为一个忠诚的总督所带来的财富和安全。\n\n据说，[ROOT.GetCountry.GetRuler.GetName]甚至只用金银餐具进餐，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家里的财富是如此巨大。"
 cappadocia_event.84.t:0 "最富有的总督领"
 cappadocia_event.85.a:0 "他们的古老学问很有价值。"
 cappadocia_event.85.desc:0 "我们可以从卡帕多西亚的波斯人那里学到很多东西，因为他们的文化是一种古老的智慧。在战争、文化、宗教、历史的问题上......波斯人的学生可以学到很多东西，我们也打算这样做。"
 cappadocia_event.85.t:0 "波斯的卡帕多西亚"
 cappadocia_event.86.a:0 "同步性中存在着力量。"
 cappadocia_event.86.desc:0 "当#E 希腊#! 和#E 波斯#! 文化相互比较时，人们会注意到，在两者中都有许多令人钦佩的品质。我们不应该把它们看作是相互对立的，而是应该模仿和接受它们所提供的最好的方面。"
 cappadocia_event.86.t:0 "一个希腊-波斯的世界"
 cappadocia_event.87.a:0 "卡帕多西亚一直都是波斯人。"
 cappadocia_event.87.desc:0 "转变卡帕多西亚[ROOT.GetCountry.GetReligion.GetName]，现在这是个值得的目标。虽然每个人都有权有自己的信仰，但我们的信仰显然是最好的。我们希望，我们推动群众皈依的努力能得到张开的双臂和心灵的回应。"
 cappadocia_event.87.t:0 "[ROOT.GetCountry.GetReligion.GetName]的卡帕多西亚"
 cappadocia_event.88.a:0 "他们毕竟不是那么糟糕......"
 cappadocia_event.88.desc:0 "我们不应该把他们视为局外人，而应该完全欢迎亚美尼亚人进入[ROOT.GetCountry.GetAdjective]社会--难道他们没有赢得这个权利？难道他们没有证明他们对我们的事业的忠诚，为了让我们获得自由而流下了他们的血？"
 cappadocia_event.88.t:0 "亚美尼亚人的存在"
 cappadocia_event.89.a:0 "我们将立于不败之地。"
 cappadocia_event.89.desc:0 "古代的波斯人以使用军团而闻名，既然我们在追随他们的脚步，我们就必须拥有一支真正属于我们自己的波斯军队。\n\n一旦传出我们正在恢复昔日的战斗战术，我们就会预见到敌人的士气全面崩溃。"
 cappadocia_event.89.t:0 "一支真正的波斯军队"
 cappadocia_event.9.a:0 "我们将出售有关的土地"
 cappadocia_event.9.b:0 "告诉信使们，这件事永远不会发生"
 cappadocia_event.9.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，我们收到了一份提案，需要您立即查看\n\n似乎有人正在调查我们所拥有的一些领土——如果我们想赚钱，我们所需要做的就是同意售卖一些领土给某个附庸，您觉得我们该怎么做？"
 cappadocia_event.9.t:0 "提案"
 cappadocia_event.90.a:0 "我们向东行进!"
 cappadocia_event.90.desc:0 "向我们的同胞传话，我们的军队正在向#E 波斯#! 进军——我们需要一切可能的人手！我们已经走得太远了，无路可退——唯一的路即是向前!"
 cappadocia_event.90.t:0 "前往波斯"
 cappadocia_event.91.a:0 "以居鲁士之名。"
 cappadocia_event.91.desc:0 "就像过去的#E 阿契美尼德#!那般，当涉及到那些统治下的人时我们会温柔以待，因为我们更喜欢一起工作，而不是从上方强加一支沉重之手。"
 cappadocia_event.91.t:0 "宽容的国度"
 cappadocia_event.92.a:0 "毕竟是为了探索的缘故。"
 cappadocia_event.92.desc:0 "#E 本都#!海岸对我们的财产是有益的补充，它将作为通往#E 攸克星海#!的通道为我们探索许多新的机会\n\n不久，我们的[ROOT.GetCountry.GetAdjective]船匠就有活干了，因为我们准备建立一支海军来探索这片海洋。"
 cappadocia_event.92.t:0 "本都探险队"
 cappadocia_event.93.a:0 "我们在这里只寻求友谊......我们保证"
 cappadocia_event.93.desc:0 "因掌控黑海沿岸诸多名城，我们已获益良多。\n\n区域内各国虽不情愿，却不得不容我舰游弋其水域。纵有国家更愿我等偏安安纳托利亚高原，亦只能缄默不言。"
 cappadocia_event.93.t:0 "本都之产"
 cappadocia_event.94.a:0 "埃兰的孩子们将得到良好的待遇。"
 cappadocia_event.94.desc:0 "我们必须接受#E 波斯人#!已经在此地生活良久的事实，我们必须学会和平共处，而不是把他们用我们的生活方式同化。"
 cappadocia_event.94.t:0 "接纳波斯人"
 cappadocia_event.95.a:0 "他们合该受死……愿你身覆之土轻柔，欧迈尼斯。"
 cappadocia_event.95.desc:0 "谋害#E 卡迪亚的欧迈尼斯#!的罪徒已伏诛，此皆[ROOT.GetCountry.GetRuler.GetName]之功。"
 cappadocia_event.95.t:0 "为欧迈尼斯复仇"
 cappadocia_event.96.a:0 "我们是不可阻挡的!"
 cappadocia_event.96.desc:0 "通过控制#E 安纳托利亚#!，崭新的时代即将到来，这是#E 欧迈尼斯帝国#!的时代！\n\n我们的敌人撤退到荒野，一边舔舐伤口，一边徒劳地密谋和计划反对[ROOT.GetCountry.GetRuler.GetName]。众神与我们同在，没有人能够抵挡迈欧尼斯帝国！"
 cappadocia_event.96.t:0 "确保安纳托利亚的安全"
 cappadocia_event.97.a:0 "命运是无常的，我的敌人——这个教训知道得太晚了。"
 cappadocia_event.97.desc:0 "在命运的转折中，我们是给予安提柯最后一击之人——所有人都知道这点，我们有责任永远践踏在他们的领土上。\n\n为了庆祝这一无与伦比的成就，将在[ROOT.GetCountry.GetCapital.GetName]举行大规模游行，以表彰[ROOT.GetCountry.GetRuler.GetName]带领我们取得胜利。"
 cappadocia_event.97.t:0 "铲除安提柯王国"
 cappadocia_event.98.a:0 "我们将翻越群山！"
 cappadocia_event.98.desc:0 "每个人都知道[GetCharacter('(int32)39').GetName]渴望比前人征服更远，但最终未能实现他的目标——我们将在马其顿人未能成功的地方取得成功。"
 cappadocia_event.98.t:0 "亚历山大的愿景"
 cappadocia_event.99.a:0 "我们也是希腊人。"
 cappadocia_event.99.b:0 "我们的祖先来自希腊，但我们已经改变。让我们怀着敬意铭记过去。"
 cappadocia_event.99.desc:0 "我们已经决定拥抱我们的希腊传统，即使马其顿人会对我们感到不满——不过最终，利大于弊。"
 cappadocia_event.99.t:0 "希腊遗产"
 cappadocia_fort_svalue_tt:0 "拥有至少#Y 5#!个要塞。（#R [SCOPE.ScriptValue('cappadocia_fort_svalue')|0]#!/#Y 5#!）"
 cappadocia_going_native_patience:0 "安抚反对派"
 cappadocia_mission_inv:0 "卡帕多西亚的命运"
 cappadocia_mission_inv_10A_task:0 "竞争被废黜者"
 cappadocia_mission_inv_10A_task_DESC:0 "最近，有人认为我们比我们的主人更强大，我们目前处在一种不自然的状态，我们在对一个我们可以正当毁灭之人表以敬意——也许是时候了。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 cappadocia_mission_inv_10d_task:0 "蜂蜜之城"
 cappadocia_mission_inv_10d_task_DESC:0 "[GetProvince('(int32)1854').GetName]——即使只是提到生产如此精致的蜂蜜的地方，也足以让人流口水。让我们建设这个地区，以便我们能够制造更多甜美的黄色东西......而我们指的是黄金。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 cappadocia_mission_inv_11A_task:0 "独立的希腊王国"
 cappadocia_mission_inv_11A_task_DESC:0 "长久以来，我们让我们别人决定我们前进的道路——这是为何？我们难道不是我们自己的主人吗？\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 cappadocia_mission_inv_12A_task:0 "[ROOT.GetCountry.GetOverlord.GetName]的继任者"
 cappadocia_mission_inv_12A_task_DESC:0 "让世间僭主与独裁者在恐惧中颤抖吧！#Y 梅南德里德王国#!——这片土地上崛起的全新[ROOT.GetCountry.GetAdjective]权力掮客，必将令所有图谋不轨者自食其果。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 cappadocia_mission_inv_13A_task:0 "安纳托利亚霸主"
 cappadocia_mission_inv_13A_task_DESC:0 "所有在#E 安纳托利亚#!尘土飞扬的高原寻找通路者，将知晓#Y 大卡帕多西亚#!是此地的最高权威。\n\n\n\n\n\n\n\n\n\n@persia_mil20!"
 cappadocia_mission_inv_15_task:0 "卡帕多西亚王国"
 cappadocia_mission_inv_15_task_DESC:0 "因他们在上次战争中的帮助，我们欠#E 亚美尼亚人#!一笔很大的债，我们的荣誉迫使我们适当得感谢他们......问题是该怎么做。\n\n该任务与#Y $cappadocia_mission_inv_16_task$#!是#R 互斥任务#!\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 cappadocia_mission_inv_16_task:0 "亚美尼亚的伙伴"
 cappadocia_mission_inv_16_task_DESC:0 "有些人可能会尽其所能阻止#E 亚美尼亚#!和[ROOT.GetCountry.GetName]之间的相互接近，但他们的努力是徒劳的。\n\n这个任务与#Y $cappadocia_mission_inv_15_task$#!是#R 互斥任务#!\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 cappadocia_mission_inv_17_task:0 "塞琉古帝国的最后通牒"
 cappadocia_mission_inv_17_task_DESC:0 "傲慢的#E 塞琉古#!认为他们可以随心所欲地对我们呼来唤去——这是真是假，取决于我们。\n\n\n\n\n\n\n\n\n\n@persia_mil10!"
 cappadocia_mission_inv_18_task:0 "波斯的卡帕多西亚"
 cappadocia_mission_inv_18_task_DESC:0 "在卡帕多西亚，我们可以从#E 波斯人#!身上学到很多东西，他们的文化古老而充满智慧。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 cappadocia_mission_inv_19A_task:0 "[ROOT.GetCountry.GetReligion.GetName]卡帕多西亚"
 cappadocia_mission_inv_19A_task_DESC:0 "让卡帕多西亚转信[ROOT.GetCountry.GetReligion.GetName]，这是个有价值的目标。虽然每个人都有权利拥有自己的信仰，但我们的信仰显然是最好的。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 cappadocia_mission_inv_19B_task:0 "亚美尼亚人的存在"
 cappadocia_mission_inv_19B_task_DESC:0 "我们不应该将他们视为外人，而应完全欢迎亚美尼亚加入[ROOT.GetCountry.GetAdjective]社会——他们难道没有争取这个权利吗？\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 cappadocia_mission_inv_19B_task_tt:0 "#Y 亚美尼亚#!需要拥有#Y 贵族#!权利和#Y 荣誉卫队#!。"
 cappadocia_mission_inv_19_task:0 "希腊-波斯世界"
 cappadocia_mission_inv_19_task_DESC:0 "当#E 希腊#!和#E 波斯#!文化相互比较时，人们会主意到两者都有许多令人钦佩的品质。我们不应该把它们看作是相互对立的，而应该效仿并接受它们所能提供的最好的方面。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 cappadocia_mission_inv_1_task:0 "稳固我们的地位"
 cappadocia_mission_inv_1_task_DESC:0 "在我们向更广阔世界采取任何行动之前，我们必须确保我们在国内的地位是稳固的——我们的人民已经为未来的挑战做好了准备！\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 cappadocia_mission_inv_1d_task:0 "[ROOT.GetCountry.GetCapital.GetName]的贸易中心"
 cappadocia_mission_inv_1d_task_DESC:0 "我们首都地理位置优越，我们当然可以将其扩展为该地区优秀的贸易中心——让我们看看随着时间推移我们能够做些什么。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 cappadocia_mission_inv_20B_task:0 "为了波斯"
 cappadocia_mission_inv_20B_task_DESC:0 "传话给我们的同胞，我们的军队向波斯进军——我们需要所有的人力！\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 cappadocia_mission_inv_20_task:0 "真正的波斯军队"
 cappadocia_mission_inv_20_task_DESC:0 "古代的波斯人以使用军团而闻名，既然我们跟随他们的脚步，我们你必须拥有一支真正的波斯军队。\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 cappadocia_mission_inv_21_task:0 "宽容之国"
 cappadocia_mission_inv_21_task_DESC:0 "就像过去的#E 阿契美尼德#!那般，当涉及到那些统治下的人时我们会温柔以待，因为我们更喜欢一起工作，而不是从上方强加一支沉重之手。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 cappadocia_mission_inv_22_task:0 "超越亚美尼亚人的年岁"
 cappadocia_mission_inv_22_task_DESC:0 "虽然我们已经接近过去的#E 亚美尼亚#!，我们不能让我们的友谊成为纠正历史错误的障碍。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 cappadocia_mission_inv_23B_task:0 "本都之产"
 cappadocia_mission_inv_23B_task_DESC:0 "因为我们拥有本都海岸许多著名的城市，我们将获得巨大的利益。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 cappadocia_mission_inv_23_task:0 "本都探险"
 cappadocia_mission_inv_23_task_DESC:0 "#E 本都#!海岸对我们的财产是有益的补充，它将作为通往#E 攸克星海#!的通道为我们探索许多新的机会。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 cappadocia_mission_inv_24_task:0 "崭新的阿契美尼德"
 cappadocia_mission_inv_24_task_DESC:0 "所有人都将看到，我们是#E 阿契美尼德帝国#!的真正继承者，我们将继续追逐他们的宣称，向所有人证明他们所言非虚。\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 cappadocia_mission_inv_26_task:0 "欧迈尼斯的遗产"
 cappadocia_mission_inv_26_task_DESC:0 "“安提柯的罪行怎能不被惩罚？我，#E 欧迈尼斯·欧迈尼德#!，会爬到谋杀我父亲的人身边像狗一样跪在他们面前祈求残羹剩饭？众生正呼唤正义——他们将与我们同在！我必须为我父亲报仇！ ”\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 cappadocia_mission_inv_27_task:0 "阿里阿拉特的威胁"
 cappadocia_mission_inv_27_task_DESC:0 "叛逆的#E 阿里阿拉特家族#!在追踪一个愚蠢的梦想，宣布独立——我们必须彻底摧毁他们。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 cappadocia_mission_inv_28_task:0 "接纳波斯人"
 cappadocia_mission_inv_28_task_DESC:0 "我们必须接受#E 波斯人#!已经在此地生活良久的事实，我们必须学会和平共处，而不是把他们用我们的生活方式同化。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 cappadocia_mission_inv_29_task:0 "为欧迈尼斯复仇"
 cappadocia_mission_inv_29_task_DESC:0 "杀害#E 卡迪亚的欧迈尼斯#!的凶手已受到惩处，这都要归功于[ROOT.GetCountry.GetRuler.GetName]。 \n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 cappadocia_mission_inv_2A_task:0 "以[ROOT.GetCountry.GetOverlord.GetName]之力！"
 cappadocia_mission_inv_2A_task_DESC:0 "我们国家的未来与#E 阿契美尼德王国#!的命运交织在一起。与其成为他们身边的讨厌鬼，不如尽我们所能加强与我们的关系，提高我们在他们心目中的地位。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 cappadocia_mission_inv_2B_task:0 "阿里阿拉特王朝"
 cappadocia_mission_inv_2B_task_DESC:0 "曾有那么段时间，就在不久之前，希腊人和马其顿人还没有来到这个国家，人们的生活在#E 阿契美尼德#!的统治下繁荣昌盛——有许多人希望看到那些美好日子的回归。\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 cappadocia_mission_inv_2d_task:0 "卡帕多西亚骑兵"
 cappadocia_mission_inv_2d_task_DESC:0 "说到养马，我们的人民是无与伦比的，我们有动物证明这一点。我们的战马比大多数同类都训练得更好。能够执行复杂的机动，这使它们超越了所有其他的战马。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 cappadocia_mission_inv_30_task:0 "保卫安纳托利亚"
 cappadocia_mission_inv_30_task_DESC:0 "通过控制#E 安纳托利亚#!，崭新的时代即将到来，这是#E 欧迈尼斯帝国#!的时代！\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 cappadocia_mission_inv_31_task:0 "消灭安提柯王国"
 cappadocia_mission_inv_31_task_DESC:0 "在命运的转折中，我们是给予安提柯最后一击之人——所有人都知道这点，我们有责任永远践踏在他们的领土上。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 cappadocia_mission_inv_32_task:0 "亚细亚的竞争者"
 cappadocia_mission_inv_32_task_DESC:0 "有消息说#E 塞琉古帝国#!来的信使正在奋力前往[ROOT.GetCountry.GetCapital.GetName]并带着一份给[ROOT.GetCountry.GetRuler.GetName]的最后通牒——我们最好做好准备。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 cappadocia_mission_inv_33_task:0 "奇里乞亚的战利品"
 cappadocia_mission_inv_33_task_DESC:0 "#E 佩迪亚斯的奇里乞亚#!区域与其他所有地区相比，都是一颗珍贵的宝石。我们有一项愉快的任务，就是决定如何处理他们的财富。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 cappadocia_mission_inv_34B_task:0 "希腊遗产"
 cappadocia_mission_inv_34B_task_DESC:0 "我们已经决定拥抱我们的希腊传统，即使马其顿人会对我们感到不满——不过最终，利大于弊。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 cappadocia_mission_inv_34C_task:0 "阿吉德的保卫者"
 cappadocia_mission_inv_34C_task_DESC:0 "所有那些追求个人荣誉而背弃誓言的叛徒都被埋入坟墓，而[ROOT.GetCountry.GetRuler.GetName]立于最高点，被公认为阿吉德的真正保卫者。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 cappadocia_mission_inv_34D_task:0 "最后的保皇派"
 cappadocia_mission_inv_34D_task_DESC:0 "在一个真正高贵的光芒几乎熄灭的世界里，确有一团明亮的火焰在[ROOT.GetCountry.GetCapital.GetName]燃烧着。无可匹敌的[ROOT.GetCountry.GetRuler.GetName]的家园——最后的保皇派。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 cappadocia_mission_inv_34_task:0 "亚历山大帝国"
 cappadocia_mission_inv_34_task_DESC:0 "通过占领马其顿的重要城市，我们赢得了追求#Y 希腊化帝国#!这一目标的权利——我们也确实打算这么做。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 cappadocia_mission_inv_35_task:0 "亚历山大的愿景"
 cappadocia_mission_inv_35_task_DESC:0 "每个人都知道[GetCharacter('(int32)39').GetName]渴望比前人征服更远，但最终未能实现他的目标——我们将在马其顿人未能成功的地方取得成功。\n\n\n\n\n\n\n\n\n\n@india_por2!"
 cappadocia_mission_inv_3A_task:0 "欧迈尼斯的威胁再起"
 cappadocia_mission_inv_3A_task_DESC:0 "我们曾希望，#E 卡迪亚的欧迈尼斯#!所教的课程其后裔必将铭记，但他们却愚昧地选择灭亡的道路。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 cappadocia_mission_inv_3d_task:0 "加齐乌拉的宫殿"
 cappadocia_mission_inv_3d_task_DESC:0 "在过去的日子里[GetProvince('(int32)7998').GetName]的谦卑省份是#E 本都#!国王的居所。恢复这个被遗弃的地方昔日的辉煌将为[ROOT.GetCountry.GetName]带来巨大的荣耀。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 cappadocia_mission_inv_4A_task:0 "忠诚的奖励"
 cappadocia_mission_inv_4A_task_DESC:0 "既然我们有能力向我们的恩人赠礼，我们希望他们会认为我们值得回报。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 cappadocia_mission_inv_4d_task:0 "优秀文化"
 cappadocia_mission_inv_4d_task_DESC:0 "说来说去，谁不希望成为马其顿人呢？他们是征服者，在战斗中无可匹敌，狡猾而熟练......拥抱这种著名的文化是很自然的。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 cappadocia_mission_inv_5A_task:0 "推回总督领边界"
 cappadocia_mission_inv_5A_task_DESC:0 "时机已到，我们必须派遣军队向北进攻#E 本都#!，因我们渴望扩张我们的边界。\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 cappadocia_mission_inv_5d_task:0 "拓展地下城市"
 cappadocia_mission_inv_5d_task_DESC:0 "在过去的日子里，当危险的威胁抬头时，我们的人民会涌向刻在大地本身石头上的地下城市。尽管许多人可能认为，那些麻烦的日子仍然与我们同在，所以我们应该在有时间的时候扩大这些城市。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 cappadocia_mission_inv_6A_task:0 "波斯遗迹"
 cappadocia_mission_inv_6A_task_DESC:0 "可怕的消息——我们土地上的波斯人在#E [GetCharacter('(int32)50').GetName]#!的领导下联合起来，正以一种不明智的方式试图夺回权力。武装起来！\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 cappadocia_mission_inv_6d_task:0 "提亚纳的行政管理"
 cappadocia_mission_inv_6d_task_DESC:0 "[GetProvince('(int32)1951').GetName]城市正处于一个重要的十字路口，值得我们特别关注——它的宝贵位置使它成为扩大[ROOT.GetCountry.GetAdjective]存在的自然候选者。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 cappadocia_mission_inv_7A_task:0 "恢复亚美尼亚所窃"
 cappadocia_mission_inv_7A_task_DESC:0 "卑鄙的#E 亚美尼亚人#!利用地区的混乱以我们的牺牲增强他们自己的力量。但这个可耻的时期将因为我们而结束！\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 cappadocia_mission_inv_7d_task:0 "卡帕多西亚培训"
 cappadocia_mission_inv_7d_task_DESC:0 "我们已经掌握了在我们周围的困难国家作战的艺术，无论我们是在平原上驰骋还是在山上冲锋，我们的部队总是会带来胜利。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 cappadocia_mission_inv_8A_task:0 "最富有的总督领"
 cappadocia_mission_inv_8A_task_DESC:0 "诸神赐予我们深不可测的财富，确认我们注定要享受作为一个忠诚的总督所带来的财富与安全感。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 cappadocia_mission_inv_8A_task_tt:0 "我们需要#Y 8座城市#!，每座城市至少有#Y 5个@nobles!贵族#!人口，并且达到#T 35文明度#!。"
 cappadocia_mission_inv_8d_task:0 "卡帕多西亚海岸线"
 cappadocia_mission_inv_8d_task_DESC:0 "我们已经征服了通往海岸的道路，这是一个值得整个[ROOT.GetCountry.GetName]庆祝的轰动性武器壮举。我们现在可以进入太过遥远而无法从陆路到达的外国市场——这改变了一切。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 cappadocia_mission_inv_9A_task:0 "安于本分"
 cappadocia_mission_inv_9A_task_DESC:0 "历史上充满了雄心勃勃者飞德离太阳太近的故事，但，[ROOT.GetCountry.GetRuler.GetName]可不是傻瓜——知道自己的位置是由好处的，一个人甚至可能在卑躬屈膝时获利。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 cappadocia_mission_inv_9d_task:0 "奇里乞亚产业"
 cappadocia_mission_inv_9d_task_DESC:0 "在#E 奇里乞亚#!区域，人们可以要求的一切都有了；富庶的农田，宏伟的城市，繁荣的矿场和肥沃的田地。既然我们是如此珍贵土地的管理者，我们应该采取措施，在该地区建立我们的海军力量——对#E 奇里乞亚海#!的控制必须是我们的。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 cappadocia_mission_inv_BUTTON_TOOLTIP:0 "前方的道路危机重重，但承诺的回报将超乎想象..."
 cappadocia_mission_inv_CRITERIA_DESCRIPTION:0 "在选择我们想要遵循的道路后骂我们将带领卡帕多西亚走向未来，大多数情况下，我们将最终形成横跨整个安纳托利亚大部的广阔疆域。"
 cappadocia_mission_inv_DESCRIPTION:0 "卡帕多西亚经历多年动荡，现在它的未来有着多条道路。从让波斯的阿里阿拉特回归到让本地人接管，谁能知道卡帕多西亚的未来呢？"
 cappadocia_native_path_1:0 "本土化"
 cappadocia_native_path_10:0 "地下基础设施"
 cappadocia_native_path_10_DESC:0 "货物和食物总是要有充足的数量，以便没有人受到饥饿或贫困的威胁。幸运的是，我们的统治者有足够的智慧来预测这一点......"
 cappadocia_native_path_11:0 "安纳托利亚帝国"
 cappadocia_native_path_11_DESC:0 "安纳托利亚为安纳托利亚人服务!外来者在我们美丽的家园将一无所得!无论是希腊人和马其顿人，还是波斯人和亚述人，他们都把自己的方式强加给我们的人民。我说，不要再这样了!"
 cappadocia_native_path_12:0 "确保独立"
 cappadocia_native_path_12_DESC:0 "为了坚守我们的自由，我们需要有一支装备精良的常备军，随时准备保卫我们的边界。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 cappadocia_native_path_13:0 "犯罪团伙"
 cappadocia_native_path_13_DESC:0 "虽然我们在一定程度上信任我们的外国盟友，但很明显，我们会觉得与我们的同胞有更紧密的联系。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 cappadocia_native_path_14:0 "辛梅里亚人的复生"
 cappadocia_native_path_14_DESC:0 "我们死去已久的祖先给我们留下了遗产，这个遗产我们已经接受并生活。一个我们将复兴的遗产!"
 cappadocia_native_path_15:0 "与安纳托利亚人融合"
 cappadocia_native_path_15_DESC:0 "经过几个世纪与本地卡帕多西亚人和卡塔俄尼亚人的交融，现代的#Y 辛梅里亚人#! 已经不再是他祖先的那个辛梅里亚人。不过，变化并不总是一件坏事......"
 cappadocia_native_path_16:0 "马主的崛起"
 cappadocia_native_path_16_DESC:0 "本着我们游牧民族的精神，我们在全国范围内接受了马上生活的方式。与他们一起，我们将把马主复苏的消息带到所有的领域。对一些人来说，我们手里拿着弓和箭。"
 cappadocia_native_path_17:0 "为古老的西梅里亚人复仇"
 cappadocia_native_path_17_DESC:0 "昔日的#Y 辛梅里安人#!被#Y 吕底亚人#!和#Y 弗里吉亚人#!击败，这场惨败几乎让我们的文化濒临灭绝。如今，我们已为祖先复仇，确保了族群的延续。"
 cappadocia_native_path_18:0 "向东推进"
 cappadocia_native_path_18_DESC:0 "东方古老富庶的文明静卧于此。昔有来寇，奴役我民；今我往矣，报施相当。"
 cappadocia_native_path_19:0 "西米里亚人的境界"
 cappadocia_native_path_19_DESC:0 "#Y 斯基泰人#! 再次统治了高加索山脉以南，这一次，没有人可以推翻我们的统治！"
 cappadocia_native_path_1_DESC:0 "为什么不好好利用眼前的情况呢？有许多迷人的当地习俗使这里的生活变得愉快和有价值--通过与当地人交朋友，我们可以学到很多东西。\n\n#Y 我们将把我们的主流文化变为为#T 卡帕多西亚#! ，我们的信仰改为#T 库柏勒崇拜#!#!。\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 cappadocia_native_path_2:0 "马其顿人的遗迹"
 cappadocia_native_path_20:0 "古老的祖国"
 cappadocia_native_path_20_DESC:0 "我们向古老的故乡进发，解放了被外国占领的大草原，并与我们祖先的亲属建立了联系。虽然我们与#Y 卡帕多西亚人#! 的交融改变了我们的民族，但游牧部落仍然坚持着传统的旧方式，这些方式因部落而异。一些声音声称，我们必须回到我们祖先的方式，然而另一些人说，我们的人民已经发生了太多的变化，我们应该充分利用在这种混合中出现的新文化。"
 cappadocia_native_path_2_DESC:0 "[GetCharacter('(int32)431').GetName]相信他夺取权力的机会已经道路，但我们将击碎他的幻想。\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 cappadocia_native_path_3:0 "波斯宣称权"
 cappadocia_native_path_3_DESC:0 "[GetCharacter('(int32)50').GetName]狗胆包天宣布独立，并领导对我们的反抗！\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 cappadocia_native_path_4:0 "自由的命运"
 cappadocia_native_path_4_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]将有理由庆祝这一切，因为我们终于是一个自由的国家了！\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 cappadocia_native_path_5:0 "经历过的风暴"
 cappadocia_native_path_5_DESC:0 "虽然我们处理了数量惊人的冲突，但我们毫发无损地度过了这场风暴——这是我们力量的证明。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 cappadocia_native_path_6:0 "扩大地下城网络"
 cappadocia_native_path_6_DESC:0 "我们王国中奇妙的地下城市已经越来越受欢迎，无论是在我们的人民中居住，还是在外国土地上的自然环境。我们应该扩大和创造更多的这种城市，这肯定会是一种繁荣。"
 cappadocia_native_path_7:0 "地下城枢纽"
 cappadocia_native_path_7_DESC:0 "[GetProvince('(int32)7981').GetName]是我们地下网络的重要枢纽，无数商旅穿梭于其宏伟的地下厅堂，经由通道往来于外界。确保所有货物与人员都能安全通行，必将巩固本地区贸易，吸引更多人口——而人口正是所有文明的根基。  "
 cappadocia_native_path_8:0 "开垦祖先的土地"
 cappadocia_native_path_8_DESC:0 "我们住在#Y 卡帕多西亚#! 的兄弟们曾经是我们土地的一部分，他们是我们历史的一部分。我们应该把这两部分重新结合起来......"
 cappadocia_native_path_9:0 "卡帕多西亚的国度"
 cappadocia_native_path_9_DESC:0 "一个国家，一个民族，这是一个梦想。当然，这个领域也可以成为其他民族的家园，但这是我们的历史"
 cappadocia_rebellion_adj:0 "欧迈尼斯"
 cappadocia_rebellion_name:0 "欧迈尼斯叛乱"
 cappadocian_coast:0 "卡帕多西亚海岸线"
 cappadocian_terrain_expertise:0 "卡帕多西亚地形训练"
 cilica_traiders_tt:0 "我们需要在#Y [GetProvince('(int32)1881')GetArea.GetRegion.GetName]#!区域拥有至少#Y 30#!个港口。（#R [SCOPE.ScriptValue('cilicia_ports_svalue')|0]#!/#Y 30#!）"
 cilicia_pedias_claims_tt:0 "我们将获得#Y [GetProvince('(int32)1881')GetArea.GetName]#!的宣称。"
 cilicia_treasure_tt:0 "我们将决定如何处理从奇里乞亚获得的战利品。"
 cilician_traiders:0 "奇里乞亚开拓计划"
 cimmerian:0 "辛梅里亚"
 cimmerian_adjective:0 "辛梅里亚"
 cimmerian_empire_name:0 "辛梅里亚帝国"
 cimmerian_name:0 "辛梅里亚"
 cimmerian_pops_increase_tt:0 "所有已拥有省份都将获得1名#Y 辛梅里亚#!人口。"
 claims_anatolia_and_more_tt:0 "我们将获得安纳托利亚全境无主之地及周边部分地区的宣称。"

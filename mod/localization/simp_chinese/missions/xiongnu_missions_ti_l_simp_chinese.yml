l_simp_chinese:
 bloodline_xiongnu_luandi:0 "挛鞮之血"
 bloodline_xiongnu_luandi_desc:0 "草原首位大单于冒顿之血脉，已为千载以来诸多伟大马背领主所继承，如上帝之鞭阿提拉与成吉思汗。让此王系之威权，令世间所有伟大文明中那些居于城郭者心惊胆裂。"
 breeding_grounds_xiongnu:0 "匈奴牧马地"
 consolidated_clans_xiongnu:0 "统一诸部"
 conversion_05_xiongnu:0 "传匈奴之道"
 desc_breeding_grounds_xiongnu:0 "对龙城周边王室马场之投资，使我邦得以在产量上超越同类草原聚落。"
 desc_consolidated_clans_xiongnu:0 "匈奴各争闹小部今统于我领导之下。"
 desc_conversion_05_xiongnu:0 "匈奴之道将行遍草原。"
 desc_hoarding_xiongnu:0 "马匹众多且品种优良，令我卓尔不群。"
 desc_insults_xiongnu:0 "敌已得警，我必不仁慈。"
 desc_jumping_xiongnu:0 "联盟中皆当敬奉长生天。"
 desc_loyalty_luandi_xiongnu:0 "匈奴王室之忠暂得确保。"
 desc_pastures_xiongnu:0 "畜牧经济投资持续增长人口与军队。"
 desc_steppe_mod_xiongnu:0 "鞍具技术创新令我成为当世最伟大骑手！"
 desc_toumans_tribe_xiongnu:0 "头曼将领导挛鞮氏，乃至整个匈奴部族，迈向辉煌之征服！"
 desc_tribute_xiongnu:0 "小部年贡持续补充战士之列。"
 hoarding_xiongnu:0 "囤聚骏马"
 insults_xiongnu:0 "匈奴犯境"
 jumping_xiongnu:0 "传长生天"
 loyalty_luandi_xiongnu:0 "忠于挛鞮"
 me_xiongnu_01_1.a:0 "诸部终于臣服于我。"
 me_xiongnu_01_10.a:0 "此等藩属之贡，将源源滋养我之战争机器。"
 me_xiongnu_01_10_desc:0 "单于[ROOT.GetCountry.GetRuler.GetName]已决意，并非所有民族皆堪由我部落权威直接治理——在某些情形下，这些部落得以以承诺每年向[ROOT.GetCountry.GetName]之师纳贡为条件换来某种程度的独立。此安排暂且颇合单于之意，盖此减少了需供养照料之人口，同时仍通过贡赋为我辈进一步征伐做准备。"
 me_xiongnu_01_10_title:0 "$xiongnu_missions_01_task_10$"
 me_xiongnu_01_11.a:0 "龙城将为草原之明珠！"
 me_xiongnu_01_11_desc:0 "我主[ROOT.GetCountry.GetRuler.GetName]！陛下增产我权力中枢财富之最新策略已见成效。新建之都城良马牧场已吸引[ROOT.GetCountry.GetName]联盟内外之马商云集，携来宝贵之经济活动并增加我都城之威望。维持此等场地亦将确使#E 单于#!之师于未来征战中拥有最优之战马。"
 me_xiongnu_01_11_title:0 "$xiongnu_missions_01_task_11$"
 me_xiongnu_01_12.a:0 "吾等永不再向南方马上领主低头！"
 me_xiongnu_01_12_desc:0 "我主[ROOT.GetCountry.GetRuler.GetName]已告知我辈大敌[GetCountry('YEZ').GetName]，我辈将不再容忍其妄图奴役我族人、劫掠我牧场之行径。据说其联盟之首向我国使节唾面，并迫使他们赤身无鞍而骑，从其在#E 巴里坤草原#!之都城一路赶回#E 龙城#!。这将是我民在[GetCountry('YEZ').GetName]手中遭受之最后屈辱，在其最终灭亡之前……"
 me_xiongnu_01_12_title:0 "$xiongnu_missions_01_task_12$"
 me_xiongnu_01_13.a:0 "且看这年轻新贵将有何作为…"
 me_xiongnu_01_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]之妻，以全然轻蔑与切齿之恨注视着那个孩子——#E 冒顿#!。她亲生之子，乃#E 单于#!之嫡长子，方应为君父之掌上明珠。她将不惜一切诱使[ROOT.GetCountry.GetRuler.GetName]拒绝此妾室所出之子，抬高并培养己子以统率诸部。暂且，#E 单于#!将如此子如其他诸子一般抚养，而她则在暗中运作，图谋削弱于他……"
 me_xiongnu_01_13_title:0 "$xiongnu_missions_01_task_13$"
 me_xiongnu_01_14.a:0 "吾等终于摆脱了冒顿。"
 me_xiongnu_01_1400.a:0 "冒顿之看守为其魅力所倾倒。"
 me_xiongnu_01_1400_desc:0 "#E 冒顿#!在[GetCountry('YEZ').GetName]手中为质期间，已成为一桩奇谈。他不断以其勇力之壮举、马上之精技与领袖之风度令其他部民折服。#E 冒顿#!正学着打动[GetCountry('YEZ').GetName]部众之心，彼等日益为其在营中之风采所倾倒。"
 me_xiongnu_01_1400_title:0 "笼络守卫"
 me_xiongnu_01_1401.a:0 "冒顿这人，真是狡猾。"
 me_xiongnu_01_1401_desc:0 "#E 冒顿#!深知自己已对奴役者施下魅惑之术，遂于一个漆黑夜中佯装与[GetCountry('YEZ').GetName]部众狂饮至深宵。待看守者醉倒昏睡，#E 冒顿#!潜入马厩，跨上所能寻得之最快骏马，飞驰遁入黑暗之中。翌晨，[GetCountry('YEZ').GetName]宿醉初醒，发觉囚犯已于夜中逃脱，他们自身亦惧怕其联盟之长[GetCountry('YEZ').GetRuler.GetName]之责罚，遂自顾弃营而散。冒顿之父[ROOT.GetCountry.GetRuler.GetName]，佯装张开双臂欢迎其归来，而其妻则为#E 冒顿#!此番惊人之举暗妒切齿。实际上，在部族会议之要求下，[ROOT.GetCountry.GetRuler.GetName]被迫赐予其子高位军职及一军以统领。"
 me_xiongnu_01_1401_title:0 "冒顿脱逃"
 me_xiongnu_01_1402.a:0 "我之人马将随我至天涯海角。"
 me_xiongnu_01_1402_desc:0 "因其勇武之名，#E 冒顿#!始聚拢一群极其忠诚之勇士。他发明了一种飞行时发出啸声之鸣镝，并训其部属依声齐射。为确信部下之忠诚，#E 冒顿#!命勇士们射其爱马，凡有犹豫不从者，当即处斩。此后，他又以此忠诚之试验施于其一位爱妻，再次将那些犹豫而未执行命令者处决。"
 me_xiongnu_01_1402_title:0 "统御忠诚"
 me_xiongnu_01_1403.a:0 "冒顿万岁！"
 me_xiongnu_01_1403_desc:0 "直至#E 冒顿#!确信其残余部众之绝对忠诚之时，他才命令他们执行最危险之任务。在一次行猎中，他令其部众射杀其父，万箭齐发而毙之——麾下无一人在其令下失射。随着#E 头曼#!之死，再无人可挑战#E 冒顿#!对[ROOT.GetCountry.GetName]之统治，部族议会接受他为新一代#E 单于#!。"
 me_xiongnu_01_1403_title:0 "弑父"
 me_xiongnu_01_14_desc:0 "应单于爱妻之请，[ROOT.GetCountry.GetRuler.GetName]已决意将#E 冒顿#!流放至我敌[GetCountry('YEZ').GetName]之朝中为质，借口曰单于不得不屈服于[GetCountry('YEZ').GetName]之要求，否则彼等将劫掠我境。于此年轻后起之秀而言，此实为必死之刑，一切皆依单于之妻之计而行……"
 me_xiongnu_01_14_title:0 "$xiongnu_missions_01_task_14$"
 me_xiongnu_01_15.a:0 "呼揭之地将彻底纳入我联盟。"
 me_xiongnu_01_15_desc:0 "[GetCountry('HUJ').GetName]在正面会战中被我无畏之#E 单于#![ROOT.GetCountry.GetRuler.GetName]所迎击。近身搏杀甚为惨烈；双方之主帅皆劈开寻常士卒而冲向对方，于驰骋愈深之中闪避箭雨。当面迎之时，一队亲兵围住#E 单于#!，引弓待发。[ROOT.GetCountry.GetRuler.GetName]翻身下马，以马身为盾，向#E 腾格里#!祈求神迹。恰于此时，其左翼骑兵击溃敌之右翼，转而向内扫灭[GetCountry('HUJ').GetName]之亲兵，生擒其将。此战遂告大捷，众人无不称道#E 单于#!冲锋陷阵直贯敌腹之胆魄。"
 me_xiongnu_01_15_title:0 "$xiongnu_missions_01_task_15$"
 me_xiongnu_01_16.a:0 "坚昆之地，任我劫掠！"
 me_xiongnu_01_16_desc:0 "在与[GetCountry('JIK').GetName]之最后一战后，其族中长老匆匆议决，奉我领袖[ROOT.GetCountry.GetRuler.GetName]为其国主，且为示归顺，倾其神圣之#E 古墓#!以纳贡于#E 单于#!。所获珍品中有精雕金鞍与金扣、神秘之圣树金匾，以及据云来自南方及西方未知王国之瑰丽宝石。此等姿态并未逃过#E 单于#!之眼，于是[GetCountry('JIK').GetName]中操#E 萨莫耶德语#!之部族得以免遭屠戮，而并入[ROOT.GetCountry.GetName]之中。"
 me_xiongnu_01_16_title:0 "$xiongnu_missions_01_task_16$"
 me_xiongnu_01_17.a:0 "通往华夏之路，今已穿越戈壁豁然洞开…"
 me_xiongnu_01_17_desc:0 "征服并殖民#E 戈壁#!荒原之艰苦任务终告完工。我斥候已开始勘察地形，在沿途驿站掘井，并规划穿越沙漠之路线，以便从彼处突击#E 中原#!之丰饶之地。良机已备，正待我主[ROOT.GetCountry.GetRuler.GetName]之英明谋划，挥师南下。"
 me_xiongnu_01_17_title:0 "$xiongnu_missions_01_task_17$"
 me_xiongnu_01_18.a:0 "且看中原之主有何话说…"
 me_xiongnu_01_1800.a:0 "付金银了事——不值得与其纠缠。"
 me_xiongnu_01_1800.b:0 "让他们从我等尸身上来取吧。"
 me_xiongnu_01_1800_desc:0 "有使节自称为#E 匈奴#!之新兴部落联盟而来，要求我辈以金帛进贡，作为交换，彼等将不劫掠我境。我辈与北方蛮族之威胁已周旋数百年之久，然此次威胁似乎更为不祥。我辈是否当无视其要求，寄望彼等不蹂躏我田园，抑或屈服而从其所求？"
 me_xiongnu_01_1800_title:0 "匈奴来使"
 me_xiongnu_01_1801.a:0 "彼等甚是明智。"
 me_xiongnu_01_1801_desc:0 "其朝廷既已在中国遭受如此多战乱之苦，无力再面临草原部落蹂躏其庄稼、驰骋践踏其土地之威胁。其君王勉强以金银为礼，遣使随匈奴使臣而归，呈于[ROOT.GetCountry.GetRuler.GetName]，冀能安抚此等马背之主。"
 me_xiongnu_01_1801_title:0 "贡品已纳"
 me_xiongnu_01_1802.a:0 "吾等将不得不用武…"
 me_xiongnu_01_1802_desc:0 "此吝啬之主竟敢拒我慷慨之提议——若其径直交出黄金，较之白白葬送其子民之性命明智多矣，彼等将在[ROOT.GetCountry.GetName]铁蹄踏碎其尸骨时哭求哀怜。"
 me_xiongnu_01_1802_title:0 "贡品被拒"
 me_xiongnu_01_18_desc:0 "伟哉单于，我辈终得在大#Y 黄河#!之曲降服诸部！#E 河西#!之散落诸氏族，绝非[ROOT.GetCountry.GetName]铁骑之敌，今我辈终在#Y 戈壁#!之彼端得有坚实据点！我辈当遣使臣去向那些彼此争斗不休的#E 战国#!索贡，否则便劫掠焚毁其家园[GetCountry('HEZ').GetName]。"
 me_xiongnu_01_18_title:0 "$xiongnu_missions_01_task_18$"
 me_xiongnu_01_19.a:0 "乌孙明智，听从我之警告…"
 me_xiongnu_01_19_desc:0 "[GetCountry('WUS').GetName]人自然在我使节向其部落首领传达威胁时惶然畏缩。关于[ROOT.GetCountry.GetRuler.GetName]之无尽胜利及对抵抗者之无情，种种传说已传至其营地。\n\n正当其萨满与长老争论如何应对之际，其中最年长之萨满——一位独眼老妪，双目失明而每年只吐数语——忽嘶喊道：'抵抗……将使我族尽灭，断绝尔等血胤；归顺，尔等子孙后代方能与其亲族并肩而荣战。'部族会议遂决意允[ROOT.GetCountry.GetName]为其宗主，并提供补给与人力。\n\n乌孙将帅对此裁决目瞪口呆，遂策骑挑战[ROOT.GetCountry.GetRuler.GetName]以行单挑，为家族与部族之荣誉而战。他在马上疯狂挥舞兵器，来回冲刺，而[ROOT.GetCountry.GetRuler.GetName]轻巧避其冲击。终于，当乌孙首领再度冲锋之时，#E 单于#!自远处掷出其匕首，正中其眉心。至此，乌孙已为匈奴之藩属，无人再敢异议。"
 me_xiongnu_01_19_title:0 "$xiongnu_missions_01_task_19$"
 me_xiongnu_01_1_desc:0 "伟哉领袖[ROOT.GetCountry.GetRuler.GetName]，我辈之政治权谋已结硕果——散落诸氏族正在我辈敦促下化解前嫌，日渐倚赖陛下之英明领导。"
 me_xiongnu_01_1_title:0 "$xiongnu_missions_01_task_1$"
 me_xiongnu_01_2.a:0 "头曼挛鞮氏终得其所。"
 me_xiongnu_01_20.a:0 "冒顿将驰骋四方，劫掠征服天下诸大文明！"
 me_xiongnu_01_20_desc:0 "伟大之#E 单于冒顿#![ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]，无畏而有魅力，其掠夺与征伐之雄心甚至超越其伟大之父头曼挛鞮。伟大单于在与萨满的会议后，向朝廷述及他横跨东西之征伐愿景，统合前所未遇之部族与前所未闻之言语，遍布浩瀚之#E 欧亚草原#!。在[ROOT.GetCountry.GetName]之旗帜下，草原之骑兵将凝聚力量，对南方文明之国发动征伐！"
 me_xiongnu_01_20_title:0 "$xiongnu_missions_01_task_20$"
 me_xiongnu_01_21.a:0 "开始吧。"
 me_xiongnu_01_21_desc:0 "[ROOT.GetCountry.GetName]诸氏族之微末起源，隐没于晦暗不明之中。据传我族中部分氏族原出于西方，即#E 阿尔泰山#!那些雄伟#E 古墓#!之故地。我辈中某些氏族自言居此已逾千年，吸纳西方迁入之氏族，并沿袭其马背之道。无论真相若何，[ROOT.GetCountry.GetName]乃此地域崛起中之部落联盟，而其中一族，即[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏，尤为出类拔萃之战士与机敏之部落政治家。此等后起之秀能驰骋至多远？"
 me_xiongnu_01_21_title:0 "单于崛起"
 me_xiongnu_01_2_desc:0 "我酋长[ROOT.GetCountry.GetRuler.GetName]，朝廷已得报，我辈已获联盟中重要酋长与受人敬重之领袖之支持。再无一人可在内部挑战[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]之名！首领之嗣子#E 头曼挛鞮#!在#E 头曼挛鞮#!过世后已稳居通往单于之位。然此番宣告方落，我酋长竟在马上遭逢惨祸，于氏族会议后殒命……莫非此一切皆早有预谋？"
 me_xiongnu_01_2_title:0 "$xiongnu_missions_01_task_2$"
 me_xiongnu_01_3.a:0 "头曼将成为伟大的单于。"
 me_xiongnu_01_3_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已崭露头角，为新生一代中最伟大之战士。身为[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏，他自然享有部落贵胄之地位与特权，但他亦已证明自己为可畏之勇士、干练之战略家、#E 腾格里#!之虔诚追随者与机敏之政客。此人将以铁骑引领[ROOT.GetCountry.GetName]诸部走向辉煌之凯旋！"
 me_xiongnu_01_3_title:0 "$xiongnu_missions_01_task_3$"
 me_xiongnu_01_4.a:0 "彼等毫无还手之力！"
 me_xiongnu_01_4_desc:0 "我辈在#E 安侯河#!流域之宿敌兄弟，世代以来屡屡逃脱我辈之掌控，随意劫掠偷盗我部族之牲畜。[GetCountry('AHO').GetName]未曾料及我诸氏族竟在[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏下整合为统一政体，因而我部已能以自上而下之集中策略，配合我骑兵个人之可怖战力，战胜彼等。携战利品在手，我辈遂将[GetCountry('AHO').GetName]部众收入联盟，并将其财富归于[ROOT.GetCountry.GetName]所有。"
 me_xiongnu_01_4_title:0 "$xiongnu_missions_01_task_4$"
 me_xiongnu_01_5.a:0 "彼等之土今归我治下！"
 me_xiongnu_01_5_desc:0 "[GetCountry('DLG').GetName]诸部绝非[ROOT.GetCountry.GetName]铁骑之敌。我部在我无畏领袖[ROOT.GetCountry.GetRuler.GetName]统率下，对敌发起一次精妙之夜袭。我斥候前日擒获一名可怜的丁零#Y 迷途者#!——彼当时正自其主营策马离去，显然是欲南下向我之敌求援——由此得以探知敌军方位。今其营地已化为焦土，而[GetCountry('DLG').GetName]之军已全然崩溃。"
 me_xiongnu_01_5_title:0 "$xiongnu_missions_01_task_5$"
 me_xiongnu_01_6.a:0 "吾之势力日益西扩…"
 me_xiongnu_01_6_desc:0 "我主[ROOT.GetCountry.GetRuler.GetName]，#E 乌兰固木#!与#E 西海#!之地终于直接归于我之治下！我西部诸部族聚居着我[ROOT.GetCountry.GetName]许多氏族之同宗族人，实际上我辈诸多生活方式皆可追溯至此区域所传承之文化习俗。今成为[ROOT.GetCountry.GetName]联盟之一部，我新附之民将为我军之力做出贡献，而此等新域可供畜牧及自然资源之开发。"
 me_xiongnu_01_6_title:0 "$xiongnu_missions_01_task_6$"
 me_xiongnu_01_7.a:0 "纵我战马，踏碎敌寇！"
 me_xiongnu_01_7_desc:0 "伟哉[ROOT.GetCountry.GetRuler.GetName]，请看陛下心血结成之硕果！陛下之英明判断与指令，引领我辈投入马政之扩展与繁育。今观我遍布之优良战马厩舍，凭借此举，我日益壮大之师将称霸草原之田野与平原。东方之劣等#E 胡#!诸部与西方之#E 斯基泰-西伯利亚人#!，最好在我骏骑踏碎其躯之前俯首归降。"
 me_xiongnu_01_7_title:0 "$xiongnu_missions_01_task_7$"
 me_xiongnu_01_8.a:0 "此必引吾等走向对敌之荣光…"
 me_xiongnu_01_8_desc:0 "经试以各种木材制作更硬实之马鞍，我部中一人已发现此种实验性设计所适用之完美木料。与西方及南土之贸易与征伐，使我辈得见此类新式，然我民之巧思与求知，已觅得较可靠之法，可在军中大量复制此类样式。此等样品将在我主[ROOT.GetCountry.GetRuler.GetName]下次征伐中便可投入实用。"
 me_xiongnu_01_8_title:0 "$xiongnu_missions_01_task_8$"
 me_xiongnu_01_9.a:0 "我之牧场牲畜繁盛，前所未有。"
 me_xiongnu_01_9_desc:0 "单于[ROOT.GetCountry.GetRuler.GetName]，陛下投资畜牧繁育之策已见回报——我畜群因从联盟各地引入新种而愈益健壮，地方部族间因牧地之争，亦因陛下之斡旋而得以解决。由此，草原经济空前繁荣，面临饥荒之部众亦已大减。"
 me_xiongnu_01_9_title:0 "$xiongnu_missions_01_task_9$"
 pastures_xiongnu:0 "牧野草场"
 steppe_mod_xiongnu:0 "早期草原马镫"
 toumans_tribe_xiongnu:0 "头曼之部"
 tribute_xiongnu:0 "勒索的贡赋"
 xiongnu_missions_01:0 "单于崛起"
 xiongnu_missions_01_BUTTON_TOOLTIP:0 "让我等的铁蹄雷鸣般踏过草原……"
 xiongnu_missions_01_CRITERIA_DESCRIPTION:0 "此使命将于[ROOT.GetCountry.GetName]制服我境周边之弱小部族、且#E 冒顿#!成为领导我帐下之#E 单于#!时完成。"
 xiongnu_missions_01_DESCRIPTION:0 "[ROOT.GetCountry.GetName]乃#E 东草原#!原有之主宰，远在千年后更为著名之蒙古人之前。仅数代之间，今#E 蒙古中部#!之偏远氏族，便从不为人知、彼此倾轧之无名小辈，崛起为草原之主，令陌路之人莫不恐惧。操#E 突厥#!语之精英统领部盟，日渐壮大，整合了#E 印度-伊朗#!、#E 蒙古#!、#E 乌拉尔#!、#E 吐火罗#!、#E 汉藏#!、#E 叶尼塞#!以及跨越百族之更多人群。此非凡之成就，赖[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之领导，尤以草原原始恐怖——#E 冒顿#!为最……"
 xiongnu_missions_01_task_1:0 "巩固氏族"
 xiongnu_missions_01_task_10:0 "外邦贡赋"
 xiongnu_missions_01_task_10_DESC:0 "我辈须向较弱势之部族征收贡赋，以资我横扫草原之征伐——然后将其疆土直接并入我之境域。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 xiongnu_missions_01_task_11:0 "都城育马场"
 xiongnu_missions_01_task_11_DESC:0 "我日益壮大之权力中心[ROOT.GetCountry.GetCapital.GetName]，正成为贸易之要冲——盖我有#Y 戈壁#!以北最优之良马与牧场。我辈当投资于京城及周边专用繁育场之维护，以激励经济活动，并巩固我于马匹与牲畜贸易之掌控。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 xiongnu_missions_01_task_12:0 "南方之辱"
 xiongnu_missions_01_task_12_DESC:0 "我宿敌[GetCountry('YEZ').GetName]，久为我壮大之最大威胁。我辈断不可再受制于南方马背之酋。今我部盟已可与之分庭抗礼，向[GetCountry('YEZ').GetName]挑起战端之时机已至。\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 xiongnu_missions_01_task_13:0 "单于之子"
 xiongnu_missions_01_task_13_DESC:0 "随[ROOT.GetCountry.GetRuler.GetName]年事渐高，我辈须思虑[ROOT.GetCountry.GetName]领导之下一代。少壮之冒顿，为#T 单于#![ROOT.GetCountry.GetRuler.GetName]之一名次妃所出，深为#T 单于#!正妻所厌。其妻将不惜一切手段，为亲生骨肉抢夺#T 单于#!之位，不惜牺牲冒顿。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 xiongnu_missions_01_task_13_create_children:0 "头曼与妾室所生子女将加入我朝。"
 xiongnu_missions_01_task_14:0 "雄主冒顿"
 xiongnu_missions_01_task_14_DESC:0 "虽招致#T 单于#!正妻之怒，然冒顿——[ROOT.GetCountry.GetRuler.GetName]之一名次妃之子——正以骁悍草原战士之姿证明其能。其魅力令部族精英难以抗拒，打乱了#T 单于#!为其正妻所生诸子争夺地位之图谋。或可在策划应对之策时，暂于部落治理架构中授其一职以安抚之……\n\n\n\n\n\n\n\n\n\n@tibet_mil6!"
 xiongnu_missions_01_task_14_modun_event_chain:0 "我们且看看冒顿在做什么……"
 xiongnu_missions_01_task_14_modun_has_office_general:0 "冒顿身居官职或为将军。"
 xiongnu_missions_01_task_15:0 "掏空呼揭"
 xiongnu_missions_01_task_15_DESC:0 "[GetCountry('HUJ').GetName]部族盘踞于浩渺西草原之门户，数百年间于其#E 库尔干#!积累巨额财富。今时已至，当将其诸部纳入[ROOT.GetCountry.GetName]政治秩序，夺其财富归我所有。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 xiongnu_missions_01_task_15_claims_tt:0 "吾等将获得对#Y 巴里坤#!、#Y 戈壁阿尔泰#!、#Y 北山北#!及#Y 北山#!诸地之宣称。"
 xiongnu_missions_01_task_16:0 "突袭坚昆"
 xiongnu_missions_01_task_16_DESC:0 "操萨摩耶德语之[GetCountry('JIK').GetName]族众，久为我于更广阔之#E 斯基泰-西伯利亚#!世界中贸易与文化之伙伴。今当将其巨量财富据为己有，并将其纳入我部盟之中。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 xiongnu_missions_01_task_17:0 "掌控戈壁"
 xiongnu_missions_01_task_17_DESC:0 "#Y 戈壁#!沙漠，既是一片广袤之荒原，亦为通往#Y 黄河#!财富之大道。掌控穿越#Y 戈壁#!之路途，将使我劫掠之师得以深入南下，蹂躏#T 中夏#!之膏腴之地。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 xiongnu_missions_01_task_18:0 "河套远征"
 xiongnu_missions_01_task_18_DESC:0 "穿越#Y 戈壁#!后最显而易见之首目标是#Y 河套#!，此区草原尤其适合游牧放养与牲畜繁育。掌控此广袤平原，可将我辈带至#E 华夏#!城池之门前，并为我草原经济带来崭新之巨量财富。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 xiongnu_missions_01_task_18_send_emissaries:0 "我们将向华夏统治者派遣使者。"
 xiongnu_missions_01_task_19:0 "警告乌孙"
 xiongnu_missions_01_task_19_DESC:0 "区区[GetCountry('WUS').GetName]部落，乃我宿敌[GetCountry('YEZ').GetName]之末等同宗，断不可容其干涉我与他草原部族之往来。且以「外交」手段，确保其无此能为。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 xiongnu_missions_01_task_19_tt:0 "以角色互动向[GetCountry('WUS').GetRuler.GetName]发起决斗挑战。"
 xiongnu_missions_01_task_1_DESC:0 "[ROOT.GetCountry.GetName]诸部之领导权分裂且紊乱无章。若我辈尚望与邻邦竞争，则必须将散乱之[ROOT.GetCountry.GetName]各部政治领导统一于一个强有力王朝之旗帜下。\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 xiongnu_missions_01_task_1_req:0 "没有世家遭到轻慢。"
 xiongnu_missions_01_task_2:0 "效忠挛鞮"
 xiongnu_missions_01_task_20:0 "新单于崛起"
 xiongnu_missions_01_task_20_DESC:0 "一位崭新之#T 单于#!将崛起，开创征服与恐怖之遗产，其回响将穿越千年……\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 xiongnu_missions_01_task_20_modun_is_ruler:0 "冒顿为统治者。"
 xiongnu_missions_01_task_2_DESC:0 "[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之血脉已被选定，率领我部落联盟凌驾邻邦、走向光荣——并以战利为酬。[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]宗脉万岁！\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 xiongnu_missions_01_task_2_claimant:0 "一位新的觊觎者将会出现。"
 xiongnu_missions_01_task_2_tt:0 "所有氏族首领和政府官员忠诚度高于#E 75#!。"
 xiongnu_missions_01_task_2_tt_family_check:0 "我统治者之家族为[SCOPE.GetRootScope.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏。"
 xiongnu_missions_01_task_3:0 "头曼之部"
 xiongnu_missions_01_task_3_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]于武士与强干政治领袖两途，皆显露非凡之禀赋。其赢得我境域各部族民之敬仰，乃领导下一代[ROOT.GetCountry.GetName]征伐与革新之最佳人选。\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 xiongnu_missions_01_task_3_spouse_with_reqs_exists:0 "我统治者拥有一位年不满#E 30#!岁之配偶，该配偶为[SCOPE.GetRootScope.GetCountry.GetName]文化、信奉#E 腾格里#!教。"
 xiongnu_missions_01_task_3_touman_is_ruler:0 "头曼为统治者。"
 xiongnu_missions_01_task_4:0 "吞并安侯"
 xiongnu_missions_01_task_4_DESC:0 "我同胞[GetCountry('AHO').GetName]部族，久以劫掠我牧场、掳夺我马匹而困扰[ROOT.GetCountry.GetName]。今时已至，当以征服统一之，终结劫掠之患。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 xiongnu_missions_01_task_5:0 "制霸丁零"
 xiongnu_missions_01_task_5_DESC:0 "传说中之[GetCountry('DLG').GetName]部族，乃北方一恼人之患，顽固独立，且更擅于忍耐#Y 贝加尔湖#!之严冬。我辈必须以武力将其纳入我之旗帜下，以掌控彼大湖之资源，并确保我北境免受侵掠与侵犯。\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 xiongnu_missions_01_task_5_claims_tt:0 "我们将获得对#Y 西海#!和#Y 乌兰固木#!地区的宣称。"
 xiongnu_missions_01_task_6:0 "西向征伐"
 xiongnu_missions_01_task_6_DESC:0 "是时矣，当向西挺进，制服那些久已遥控我土之诸氏族。我西方兄弟所筑之#E 库尔干#!中巨量财富，必将归我所有！\n\n\n\n\n\n\n\n\n\n@east_steppemil11!"
 xiongnu_missions_01_task_6_claims_tt:0 "我们将获得对#Y 阿尔泰#!、#Y 呼揭#!和#Y 坚昆#!地区的宣称。"
 xiongnu_missions_01_task_7:0 "囤积马匹"
 xiongnu_missions_01_task_7_DESC:0 "无马，我辈何以立？若尚望继续称霸草原，则必须繁育更多、更优之马匹。\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 xiongnu_missions_01_task_8:0 "早期草原马镫"
 xiongnu_missions_01_task_8_DESC:0 "虽原始马镫之源起久有争议，然无疑[ROOT.GetCountry.GetName]之硬木马鞍，促进了技术之进步与传播，终至今日我们所知之马镫。且投资于此骑乘之术，令所有闻我蹄声者无不胆寒。\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 xiongnu_missions_01_task_9:0 "牧野草场"
 xiongnu_missions_01_task_9_DESC:0 "于草原与牧场中牧养牲畜，乃我政治与经济体制之基石。[ROOT.GetCountry.GetName]之政治领导，断不可忽视此务。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 xiongnu_missions_1_task_20_claims:0 "吾等将获得对#Y 格里菲亚#!、#Y 鄂毕#!、#Y 外贝加尔#!、#Y 巴彦温都尔#!、#Y 艾马克#!、#Y 弓卢#!、#Y 特里衮#!、#Y 漠东#!及#Y 安德兰佐赫#!诸地之宣称。"

l_simp_chinese:
 01_chu_missions:0 "秋去春来"
 01_chu_missions_BUTTON_TOOLTIP:0 "且看那桃花瓣上枯萎的残红，如何被春日的绯霞重新唤醒……"
 01_chu_missions_CRITERIA_DESCRIPTION:0 "当#E 楚#!能够击退内外之敌，缔造一个#Y 华夏帝国#!之时，此使命即告完成。"
 01_chu_missions_DESCRIPTION:0 "诗人与史官常吟诵#E 楚#!之歌，追忆那个#E 春秋#!时代——彼时我邦星辰犹在上升。不幸的是，我楚历代君主多屈膝于风中，未能挺立如松，世人皆叹吾辈之盛世早已如雪片落于水面般消逝无踪。\\n\\n然而世间并无注定之事；若得诸神庇佑，日可出于西方，秋亦可重返为春……"
 01_chu_missions_task_1:0 "口角酿死仇"
 01_chu_missions_task_10:0 "蛮风夷韵"
 01_chu_missions_task_10_DESC:0 "如今我们的宿敌秦人已永世碎裂其锋芒，我等可将目光投诸更为愉悦之事，譬如礼乐之享。因我楚地混杂楚人与越人，故传统与乐章皆为二者之独特交融；世人或斥吾辈为蛮夷，然我等欣然拥抱此一脉之传承。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 01_chu_missions_task_11:0 "人贩商贾"
 01_chu_missions_task_11_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]乃#E 江#!上最后一座大城，天下四方之商贾皆自东溟之海扬帆而至我煌煌都城之港区。不仅吾邦所产之最精良货物于此贸易，我邦更拥有[GetProvince('(int32)8972').GetArea.GetRegion.GetName]全境规模最巨之奴市。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 01_chu_missions_task_12:0 "[ROOT.GetCountry.GetCapital.GetName]港区"
 01_chu_missions_task_12_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]正成长为[GetProvince('(int32)8972').GetArea.GetRegion.GetName]全境最为重要的经济中心之一，此无疑得益于通达其市集的诸多道路。即便是远方的[GetProvince('(int32)8845').GetName]都城亦与郢有路相连，确保商旅穿行于[ROOT.GetCountry.GetName]之境而不为山峦所阻。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_chu_missions_task_13:0 "丛林勇士"
 01_chu_missions_task_13_DESC:0 "我英勇之将士于至为艰险之地形中持续操练，锤炼其于密林穹盖之下可资运用的奇谋妙策。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil11!"
 01_chu_missions_task_14:0 "刀剑·鸟虫篆"
 01_chu_missions_task_14_DESC:0 "吾等务必延揽[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]全境至为卓绝之兵器匠师，为吾锻造一柄堪配之剑——一柄能令世人铭记楚室致命武威之剑。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 01_chu_missions_task_15:0 "吾辈为友……"
 01_chu_missions_task_15_DESC:0 "吾等素有风标之友之讥，谓我邦反复于盟约之间，唯利是图。若坦诚言之，此番彼等所言非虚——吾等即将挥师，攻向旧日之友#E 齐#!。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 01_chu_missions_task_16:0 "融越入楚"
 01_chu_missions_task_16_DESC:0 "虽然楚文化仍为我邦社会之主流，然境内亦多有越文化之民——为防止臣民间生出嫌隙，吾等当倡导万民和睦相亲。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 01_chu_missions_task_17:0 "北向拓疆"
 01_chu_missions_task_17_DESC:0 "备我邦对昔日赵人所居之地的宣称——吾等将摧毁其军旅，尽收其所有之物为吾有。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@tibet_mil7!"
 01_chu_missions_task_18:0 "草原门户"
 01_chu_missions_task_18_DESC:0 "吾等所居之丘陵与干燥平原渐次化为无垠草海——此即草原，悍猛之马背领主于此称雄无匹。若有意向草原扩张，吾等当倍加审慎。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@east_steppemil4!"
 01_chu_missions_task_19:0 "速成盟友"
 01_chu_missions_task_19_DESC:0 "吾等已与#E 齐#!之友达成默契——双方一致认为，分隔我疆界之诸小邦，皆为我军旅可以摧毁的公平猎物。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_chu_missions_task_1_DESC:0 "#E 恒密#!意欲参与一场庆典，[ROOT.GetCountry.GetRuler.GetName]已慷慨恩准[SCOPE.sCharacter('next_king').GetFirstName]前往。所有贵族门阀皆遣其至佳者赴会，故我邦嗣子理当亲临。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_por1!"
 01_chu_missions_task_2:0 "战火流民"
 01_chu_missions_task_20:0 "扼守江口"
 01_chu_missions_task_20_DESC:0 "[GetProvince('(int32)8556').GetName]与[GetProvince('(int32)9083').GetName]之地扼守江口，乃我邦掌控之军事要地。吾等当竭尽所能，使彼处要塞化为金汤之城。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_chu_missions_task_21:0 "扩建王舟"
 01_chu_missions_task_21_DESC:0 "吾等必建一支堪与远近海上列强争锋之舰队——距海稍远，不应成为我邦忽视水师之理由。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 01_chu_missions_task_22:0 "御草原铁骑"
 01_chu_missions_task_22_DESC:0 "虽于此处维持要塞耗资甚巨，然决不可令蛮族穿越山隘——吾等须有一道防线，以应其窥伺之图。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 01_chu_missions_task_23:0 "秋去春来"
 01_chu_missions_task_23_DESC:0 "楚室已臻前所未想之巅峰，统御文明世界之终极权柄，乃我朝血脉得天独厚之生来权利。\\n\\n#Y 此#! #R 痛苦改革#! #Y 修正将被移除#!。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n@china_mil15!"
 01_chu_missions_task_24:0 "黄金水道"
 01_chu_missions_task_24_DESC:0 "今既已据有利之位，明智之举当为投资#E 江#!沿岸之天然港湾。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 01_chu_missions_task_25:0 "渤海之滨"
 01_chu_missions_task_25_DESC:0 "渤海虽为远方水域，然我邦经济与军事之利益却不断将吾等引回其平静港湾。或许今正当时，我邦当永驻此域。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 01_chu_missions_task_2_DESC:0 "吾等所陷之战火已摧残乡野，源源不断之流民涌向[ROOT.GetCountry.GetCapital.GetName]。所幸于此黑暗岁月，我邦尚有余力顾恤吾民。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 01_chu_missions_task_3:0 "荣耀之战"
 01_chu_missions_task_3_DESC:0 "近与#E 秦#!之战提醒我邦将士，昔日荣光并非过往——我等乃命运之主宰，若心意已决，便可改写青史！\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@tibet_mil5!"
 01_chu_missions_task_4:0 "暗夜烛光"
 01_chu_missions_task_4_DESC:0 "所幸并非万般皆暗；纵有诸多顽固而严峻之难题，我邦[ROOT.GetCountry.GetCapital.GetName]城却蒸蒸日上。族中耆老皆言未尝见都城如此繁盛，今已成为域内重要之贸易枢纽。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 01_chu_missions_task_5:0 "使齐"
 01_chu_missions_task_5_DESC:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]将遣失宠之使臣[GetCharacter('(int32)710').GetFullName]出使#E 齐#!之都城[GetProvince('(int32)8504').GetName]。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 01_chu_missions_task_6:0 "伐越"
 01_chu_missions_task_6_DESC:0 "纵然吾等正经历痛苦之改革，此并非意味吾邦将停止于可行之处拓展疆界。东方之诸#E 越#!小部落，一旦我据有其土地之宣称，便将轻易被征服。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 01_chu_missions_task_7:0 "夺岛"
 01_chu_missions_task_7_DESC:0 "今既已征服[GetProvince('(int32)9105').GetName]与[GetProvince('(int32)9101').GetName]诸大港城，吾等当思将霸权扩展至琉球之岛。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_chu_missions_task_8:0 "泽中练兵"
 01_chu_missions_task_8_DESC:0 "#E 越#!之民，源自[GetProvince('(int32)9087').GetName]之沼泽与林地，已研发出于泽地作战之战术，彼等可将此术传授于我举国上下。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 01_chu_missions_task_9:0 "清剿秦人"
 01_chu_missions_task_9_DESC:0 "吾等不共戴天之死敌秦人必须被逐出权力之席；彼等必如蛇虺般被践踏入尘土。\\n\\n\\n\\n\\n\\n\\n\\n\\n\\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 ascendant_chu_bwahaha:0 "大楚雄起"
 chu_barbarian_tradition_and_song:0 "蛮风夷韵"
 chu_candle_dark:0 "暗夜烛光"
 chu_defended_border_passes:0 "固守关隘"
 chu_fairweather_friends:0 "酒肉之交"
 chu_glorious_combat:0 "荣耀之战"
 chu_house_of_chu:0 "楚室"
 chu_jungle_modifier:0 "丛林勇士"
 chu_legion_20_tt:0 "需一支#Y军团#!，兵力至少#Y 20#!。"
 chu_marshland_modifier:0 "泽沼争锋"
 chu_merchants_men:0 "贩卖人口的商人"
 chu_mil_gov_reform:0 "沉痛变法"
 chu_missions_task_9_tt:0 "无任何国家统治者拥有#Y秦之血脉#!特质。"
 chu_river_mouth:0 "江防要塞"
 chu_royal_navy:0 "楚王水师"
 chu_royal_river:0 "黄金之河"
 chu_ying_harbor_district:0 "郢都港区"
 chu_yue_integrate_tt:0 "必须整合任意#Y越#!文化。"
 desc_ascendant_chu_bwahaha:0 "历经数十年之奋斗，吾等终将秦人逐出权力之巅，消除其对各处和平所构成之威胁。"
 desc_chu_barbarian_tradition_and_song:0 "世人或以吾等奇异之传统与乐章为据，斥吾辈为蛮夷——然吾等以此为傲，欣然纳之。"
 desc_chu_candle_dark:0 "虽困于纷争之时，然我郢都之光，犹如暗夜中之烛火，穿透层层阴霾。"
 desc_chu_defended_border_passes:0 "后方已固，可御蛮夷侵入。"
 desc_chu_fairweather_friends:0 "我邦素有应得之名——结盟之后，旋又背盟，转而攻我昔日之友。"
 desc_chu_glorious_combat:0 "犹如匠师锻就之宝剑，我邦军旅已于沙场磨砺锋芒，今正渴求征战中觅取荣光。"
 desc_chu_house_of_chu:0 "赫赫楚室已承天命，秉诸神之祝佑，统御中夏，尽享此位所赋予之万般权柄与威仪。"
 desc_chu_jungle_modifier:0 "训练有素，我军在丛林中亦能有效作战。"
 desc_chu_marshland_modifier:0 "我邦士卒能于沼泽与湿地之中有效作战，令敌寇大感惊愕。"
 desc_chu_merchants_men:0 "四方贩奴之徒，自广域各处汇聚我郢都之港，于市集中交易。"
 desc_chu_mil_gov_reform:0 "吾等正经受政府改革之至艰时期，涤除军政与官僚体系中贪腐之蠹。"
 desc_chu_river_mouth:0 "我邦堡垒扼守江口，确保不速之客无从扬帆驶入我腹地。"
 desc_chu_royal_navy:0 "因我邦以国家之力度投资水师力量，我皇家水军于水上无可匹敌。"
 desc_chu_royal_river:0 "因我邦致力于拓展长江流域之贸易，此江有时被称作「黄金之河」——楚地经济之命脉。"
 desc_chu_ying_harbor_district:0 "吾等可全然自信地断言，郢都之港区堪称举世无双，其壮丽与恢宏，足以媲美沿海诸城。"
 me_chu.1000.a:0 "宣战！"
 me_chu.1000.b:0 "时机未到……"
 me_chu.1000.desc:0 "一件可怕的事发生了，[ROOT.GetCountry.GetRuler.GetName]：东方山中有贵族家族聚会，一位#E 秦#!国王子醉酒后被#E 楚#!王储刺死。您可想而知这对两国关系意味着什么……\n\n秦国已为此事宣战，并派遣使节至[ROOT.GetCountry.GetCapital.GetName]，提醒[ROOT.GetCountry.GetRuler.GetName]我们义不容辞，必须#R 加入其征伐#!。若一切按秦国的计划进行，楚国将面临三面受敌之局——他们将毫无胜算。\n\n这或可是从楚国夺取一些土地的大好机会，他们不过外强中干……"
 me_chu.1000.t:0 "伐楚之战"
 me_chu_1.a:0 "敌人将为此后悔！"
 me_chu_10.a:0 "我一直喜爱此曲，不得不承认"
 me_chu_10_desc:0 "入夜时分，[ROOT.GetCountry.GetCapital.GetName]城中烛火通明，照亮[ROOT.GetCountry.GetRuler.GetName]的宫殿。[ROOT.GetCountry.GetRuler.GetFirstName]的宅邸中正大摆宴席；米酒流淌，乐声盈室，欢笑与欢愉之声中夹杂着半管筝清雅的旋律。\n\n尽管许多外人鄙夷#E 楚#!乐，认为其沾染蛮夷之风，然我楚人以自身文化为傲，坦然拥抱传统。一位乐师转向[ROOT.GetCountry.GetRuler.GetFirstName]，高声宣言：'现在，让我们唱一首《九歌》——若会歌词，敬请同唱。\n\n吉日兮辰良\n穆将愉兮上皇。'"
 me_chu_10_title:0 "$01_chu_missions_task_10$"
 me_chu_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_chu_11.a:0 "生财之道，各显神通"
 me_chu_11_desc:0 "[ROOT.GetCountry.GetCapital.GetName]的市场已名闻遐迩，据说只要有钱，便可买到天底下任何东西。精美的手工制品沿着#E 江水#!蜿蜒而下，最终出现在高声叫卖的商贩摊位上。\n\n有心之买家还能在此找到整个[GetProvince('(int32)8972').GetArea.GetRegion.GetName]最大的奴隶市场；这确是#E 楚#!人为自己谋得的一桩厚利营生。"
 me_chu_11_title:0 "$01_chu_missions_task_11$"
 me_chu_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_chu_12.a:0 "郢都商旅云集，须早作准备"
 me_chu_12_desc:0 "途经[ROOT.GetCountry.GetCapital.GetName]港口的旅人，无不赞叹[ROOT.GetCountry.GetRuler.GetName]所建的宏伟港区；诚然，郢都的码头堪与沿海最伟大的港口城市媲美，其宽阔的泊位在河港城市中实属罕见。\n\n滨河地产价格已飙升至惊人地步，足见当地商贾争相在河边建造仓库，竞争之激烈。"
 me_chu_12_title:0 "$01_chu_missions_task_12$"
 me_chu_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_chu_13.a:0 "归根结底，我宁战丛林不战沼泽"
 me_chu_13_desc:0 "虽丛林之中有大象栖息，然将这些巨兽从其天然栖息地中运出，殊为不易。鲜有人敢于深入广袤的雨林，除非是为捕获这些令人生畏的坐骑。\n\n因此，当发现汗流浃背的[ROOT.GetCountry.GetRuler.GetName]竟在丛林深处与[ROOT.GetCountry.GetRuler.GetHerHis]精兵一同操练时，不免令人惊讶。因为#E 楚#!如今已拥有广袤的丛林领地需要统治，[ROOT.GetCountry.GetRuler.GetFirstName]公开立誓要精通在如此艰险地形中作战。"
 me_chu_13_title:0 "$01_chu_missions_task_13$"
 me_chu_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_chu_14.a:0 "越王勾践剑，一击必中"
 me_chu_14_desc:0 "单手提举起#Y 勾践剑#!，[ROOT.GetCountry.GetRuler.GetName]挥剑破空，满意地啧啧称赞。此剑工艺精美，乃由[ROOT.GetCountry.GetCapital.GetName]最顶尖的工匠打造而成。平衡完美，磨至耀眼光泽，青铜剑身映射阳光，令人炫目。剑身上以我楚人独有的'鸟虫篆'刻就的铭文，是[ROOT.GetCountry.GetRuler.GetFirstName]最中意的细节之一。无人能质疑这乃一把#E 楚#!剑。\n\n虽然我国的兵器匠已是天下无双，此番他们确实超越了自己。"
 me_chu_14_title:0 "$01_chu_missions_task_14$"
 me_chu_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_chu_15.a:0 "莫信他人，莫称友朋；唯己是赖"
 me_chu_15_desc:0 "#E 楚#!人被指责为朝秦暮楚的朋友，只结权宜之盟，一旦运势扭转便背信弃义。由于我们乐于欺骗旧日盟友，我国的外交声誉正在受损——[ROOT.GetCountry.GetRuler.GetName]对此却耸耸肩，不以为意。\n\n如今最激烈的诋毁者无疑是#E 齐王#!，他亲历了楚国的背信弃义，逢人便诽谤我楚之美名。"
 me_chu_15_title:0 "$01_chu_missions_task_15$"
 me_chu_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_chu_16.a:0 "我向越人承诺，楚地有更好的未来"
 me_chu_16_desc:0 "巡访新近征服的#E 越#!各村落，令[ROOT.GetCountry.GetRuler.GetName]心生对这些贫苦部族民的怜悯。许多统治者出于现实考量整合被征服者，而[ROOT.GetCountry.GetRuler.GetFirstName]却言道，[ROOT.GetCountry.GetRuler.GetSheHe]真正希望改善[ROOT.GetCountry.GetRuler.GetHerHis]臣民的生活。"
 me_chu_16_title:0 "$01_chu_missions_task_16$"
 me_chu_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_chu_17.a:0 "楚师所指，虽天涯亦至"
 me_chu_17_desc:0 "我[ROOT.GetCountry.GetAdjective]大军正向外推进，前所未有地远离核心领土的森林与农田，向北方的沙漠与尘土飞扬的平原挺进。\n\n虽然卷入域外的纷争向来暗藏凶险，然[ROOT.GetCountry.GetRuler.GetName]至今未曾令我们偏离正道，故而我们对[ROOT.GetCountry.GetRuler.GetHerHim]的信任依然坚定不移。"
 me_chu_17_title:0 "$01_chu_missions_task_17$"
 me_chu_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_chu_18.a:0 "若有必要，我亲逐胡骑"
 me_chu_18_desc:0 "将#E 楚#!边境扩展至草原门户，自会带来一系列特殊凶险；即来自骑射之民的袭击威胁已成倍增长，众多军事顾问正在暗中备战，以应对未来可能爆发的战争。\n\n能否将草原骑士阻于我国领土之外，这将是对我国日益壮大之霸权的真正考验——[ROOT.GetCountry.GetRuler.GetName]已全心全意地迎接这一挑战。"
 me_chu_18_title:0 "$01_chu_missions_task_18$"
 me_chu_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_chu_19.a:0 "共饮此杯，永结盟好！"
 me_chu_19_desc:0 "多亏曾遭贬谪的#E 屈原#!——他在出使#E 齐#!朝廷后已足以将功补过——楚齐两国已同意缔结同盟。据说齐王起初不愿接见我国使节，但屈原以其高超的外交手腕大放异彩，最终赢得了觐见。\n\n当然，齐国并非无条件地同意互为后援；他们索要了大量兵员，要求约二十五队兵马充实其军力。尽管条件苛刻，但各方荣誉皆因盟约条款而得到满足，[ROOT.GetCountry.GetRuler.GetName]盛赞此番发展为#E 楚#!的一大里程碑。"
 me_chu_19_title:0 "$01_chu_missions_task_19$"
 me_chu_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_chu_1_desc:0 "在[GetProvince('(int32)8828').GetArea.GetName]附近山中举行的一场贵族家族聚会酿成了灾难性的后果！[GetCharacter('(int32)707').GetName]与[SCOPE.sCharacter('next_king').GetHerHis]的随从遭到[GetCharacter('(int32)667').GetName]家臣的羞辱，事态逐步升级，最终[GetCharacter('(int32)667').GetFirstName]被[GetCharacter('(int32)707').GetFirstName]刺死。\n\n毋庸多言，#E 秦#!人愤慨万分，其如此重要的家族成员竟遭谋杀，如今他们已发兵入侵[GetProvince('(int32)5573').GetName]以行报复！\n\n更为糟糕的是，秦的走狗#E 韩#!与#E 魏#!亦响应了战争召唤——此番三面受敌，令我楚措手不及！"
 me_chu_1_title:0 "$01_chu_missions_task_1$"
 me_chu_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_chu_2.a:0 "告流民：我辈当竭尽所能"
 me_chu_20.a:0 "敌舰休想逾越我水寨巡防"
 me_chu_20_desc:0 "[ROOT.GetCountry.GetCapital.GetName]坐落于#E 江水#!之畔，#E 楚#!因而拥有一条令全国引以为豪的内陆水道；我楚商贾不仅可乘船通达腹地众多城市，兵员运输船更可确保大军从京城迅速出发驰赴热点。\n\n[GetProvince('(int32)8556').GetName]与[GetProvince('(int32)9083').GetName]是扼守江水入口的两处要地，我等欣然禀报，已在两岸建成了令人瞩目的城防工事。如今，楚国可以高枕无忧，深知自己乃是江水真正的主人，未得我方许可，无人可航行于其水面之上。"
 me_chu_20_title:0 "$01_chu_missions_task_20$"
 me_chu_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_chu_21.a:0 "此舰守护我万千利益——船匠们，干得好"
 me_chu_21_desc:0 "#E 楚#!的国力，如此之多依赖于水道；#E 江水#!堪称国家之血脉，是无法想象离之而生的财富源泉。正因我们欠这片温润水域如此之深，[ROOT.GetCountry.GetCapital.GetName]的权力中枢已决定必须拥有一支像样的水师，一支不仅能护卫沿海城市，而且能确保水道远离海盗侵扰的水师。[ROOT.GetCountry.GetRuler.GetName]愿尽[ROOT.GetCountry.GetRuler.GetSheHe]所能，确保贸易畅通无阻。"
 me_chu_21_title:0 "$01_chu_missions_task_21$"
 me_chu_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_chu_22.a:0 "彼若愚蠢来犯，我必次次击退"
 me_chu_22_desc:0 "北方传来喜讯！我们终于完成了巩固边境所需的城防工事。我方欣然禀报，一套由瞭望塔和巡逻士兵组成的体系，如今已令后方腹地免遭草原骑士的袭扰。\n\n或许有朝一日他们会企图突然袭击，但我们可以信赖石墙将我们守护周全。"
 me_chu_22_title:0 "$01_chu_missions_task_22$"
 me_chu_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_chu_23.a:0 "我方起步——未来属楚"
 me_chu_23_desc:0 "短短数年之前，#E 楚王室#!似乎濒临彻底覆灭。腐败窒息了整个体制，如背负重担，几乎令我们无法展翅高飞。犹如仙鹤陷入罗网，终结似乎近在咫尺。\n\n然而，尽管如此内忧外患，我们竟成功建立了将延续至时间尽头的#Y 华夏帝国#!——这对任何人而言都是了不起的成就，而对楚人而言更是如此。我们四面受敌，却未曾屈服。\n\n如今，所有争霸的对手皆已覆灭，我们可以开创一个和平的新时代。让我们将#E 周朝#!的鉴戒铭记于心，汲取其过失的教训，同时祈望不落入同样的陷阱。"
 me_chu_23_title:0 "$01_chu_missions_task_23$"
 me_chu_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_chu_24.a:0 "人称'黄金水道'，岂是虚言？"
 me_chu_24_desc:0 "造访[ROOT.GetCountry.GetCapital.GetName]的旅客往往不愿离去，因为即使穷尽一生，也不足以观赏#E 楚#!都城的全部奇迹。\n\n傍晚时分沿#E 港区#!大道漫步，是[ROOT.GetCountry.GetRuler.GetName]最喜爱的活动之一。因为，倘若恰逢日落时分，凝望水波倒影，那#E 江水#!便宛若由熔金铸成——这令人屏息的绝美景象，令人心荡神驰。"
 me_chu_24_title:0 "$01_chu_missions_task_24$"
 me_chu_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_chu_25.a:0 "水流何方，我辈随之，恐无他选"
 me_chu_25_desc:0 "极目远眺，地平线彼方，是#E 渤海#!的水域，那是与我们迥然不同的富裕王国之后院。沿岸的城镇与都市中，遍布售卖海中捕捞渔获的集市，若带的钱足够，甚至还有珍珠可买。\n\n虽有人质疑#E 楚#!为何要在此地区扩张，[ROOT.GetCountry.GetRuler.GetName]对[ROOT.GetCountry.GetRuler.GetHerHis]未来的计划，却一反常态地缄口不言。"
 me_chu_25_title:0 "$01_chu_missions_task_25$"
 me_chu_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_chu_26.a:0 "天下终将尽知我楚……"
 me_chu_26_desc:0 "鲜有人跋涉进入我国，因入山之路险恶难行，令人望而却步。且因我们远离低地城邦，关于我族的传闻与猜测甚多。\n\n当灾厄般的战事传闻传至我们耳中时——我们地处北方偏远，与世隔绝——我们决定，是时候正式亮明身份了。"
 me_chu_26_title:0 "楚国·山中之王"
 me_chu_26_tooltip:0 "书写历史之时……"
 me_chu_27.a:0 "父债子偿！何其诅咒的命运"
 me_chu_27_desc:0 "多年来，#E [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族#!心不在焉地执掌着国之航船，如今我们发现自己身处腐败的完美风暴之中，岌岌可危。我们的政府已几乎因无能的统治者而陷入瘫痪，他们更关心的是侵吞国库和用珍馐美馔填饱肚子，而非照顾其应负责的子民。多年以来，不受制约的腐败文化已成常态，有效的治理完全被束缚了手脚。\n\n改革将会困难重重，但势在必行——我们再不能拖延一日而不试图剜除腐肉。虽尚未完全陷入危机，我们的状况已不如应当的那样健康——这一事实，我们众多的敌人正在拭目以待……"
 me_chu_27_title:0 "腐败失控"
 me_chu_27_tooltip:0 "#E楚国#!若图存续，必经沉痛变法……"
 me_chu_2_desc:0 "连年的战争已使乡间动荡不安，连番征战带来的意外后果之一，便是源源不断的难民涌入[ROOT.GetCountry.GetCapital.GetName]。\n\n难民们相信[ROOT.GetCountry.GetName]中最安全之地便是京城，我们不得不迅速行动，以确保这些聚集的流民有处可居。所幸郢都尚有临时容身之所，但我们不知道还会有多少流离失所之人前来寻求庇护。"
 me_chu_2_title:0 "$01_chu_missions_task_2$"
 me_chu_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_chu_3.a:0 "荣耀之战在前！恢复大楚荣光！"
 me_chu_3_desc:0 "在与#E 秦#!的近期冲突中，[ROOT.GetCountry.GetRuler.GetName]与士兵并肩而战。尽管[ROOT.GetCountry.GetRuler.GetFirstName]向来以把握民心国脉而自傲，我王却从士兵身上学到了许多。\n\n饱受压抑，因官府腐败而士气消沉，在战场上重拾昔日荣光的念想，却在这些战士心中重新点燃了旧日辉煌的火花——[ROOT.GetCountry.GetRuler.GetFirstName]立即察觉到了这一点，并决心善加利用。\n\n意识到关键时刻就在眼前，[ROOT.GetCountry.GetRuler.GetFirstName]决定向全军将士发表讲话，作一番即席演说，[ROOT.GetCountry.GetRuler.GetSheHe]希望能提振士气[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_chu_3_title:0 "$01_chu_missions_task_3$"
 me_chu_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_chu_4.a:0 "郢都乃楚王冠上璀璨明珠"
 me_chu_4_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]不断收到已成定局的噩耗，[ROOT.GetCountry.GetCapital.GetName]持续进行的建设却总能让[ROOT.GetCountry.GetRuler.GetFirstName]脸上浮现笑容；一切如计划般推进，按时完工且不超预算——这难得的好消息三连胜。\n\n前线传来的消息常带绝望之色，而#E 郢都#!的稳步建设却未受我们面临的顽固问题所扰。"
 me_chu_4_title:0 "$01_chu_missions_task_4$"
 me_chu_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_chu_5.a:0 "为楚之未来，旧怨可泯"
 me_chu_5_desc:0 "[GetCharacter('(int32)710').GetFullName]响应了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的召唤，同意前往#E 齐国朝廷#!代表我国的国家利益。\n\n屈的故事在#E 郢都#!的宫殿中广为人知，包括这位卓越谋臣曾遭流放的羞辱时期。尽管[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]曾发誓永不让[GetCharacter('(int32)710').GetFirstName]回国，但#E 楚#!如今遗憾地需要屈的外交才能。"
 me_chu_5_title:0 "$01_chu_missions_task_5$"
 me_chu_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_chu_6.a:0 "愿战事速结，少流血"
 me_chu_6_desc:0 "虽北方与西方边境皆有威胁，但这并不意味着南方的#E 越#!部族便可肆无忌惮地劫掠我土。是时候将注意力转向南方了，预计我军将不会费力便能瓦解我们当前面临的越人威胁。"
 me_chu_6_title:0 "$01_chu_missions_task_6$"
 me_chu_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_chu_7.a:0 "在此开始建造舰队，并设定航向驶往[GetProvince('(int32)10839').GetName]。"
 me_chu_7_desc:0 "[GetProvince('(int32)9105').GetName]与[GetProvince('(int32)9101').GetName]乃[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]垂涎已久的两个港口，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]一直设想#E 楚#!能成为值得重视的海上力量，如今这两座重要城市已归于其治下，计划中对#E 琉球#!的海上入侵便可展开。"
 me_chu_7_title:0 "$01_chu_missions_task_7$"
 me_chu_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_chu_8.a:0 "此地形训练虽难，然物有所值！"
 me_chu_8_desc:0 "南方的沼泽似乎绵延无尽，覆盖了长达数千里的广阔区域，其间遍布城市与骄傲的部族，自己们抗拒外人的存在。\n\n正是在这里，#E 越#!人磨砺出他们独特的战斗传统。就连[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]也加入了行伍，在我楚新招纳的越人军事顾问严格监督下操练列阵——看来我王欲[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]掌握沼泽作战的技艺。"
 me_chu_8_title:0 "$01_chu_missions_task_8$"
 me_chu_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_chu_9.a:0 "与旧敌苦乐参半道别"
 me_chu_9_desc:0 "多年来，我们一直在与#E 秦#!的势力抗争，我们可以忆起无数敌人占上风的时刻——甚至历史潮流似乎也站在他们一边，仿佛他们注定要征服我们，将我们的土地瓜分殆尽。\n\n然而上天并未灭绝#E 楚#!，反而将毁灭降临于那些图谋我们灭亡之人。没有秦的世界，无论如何都将不再相同……"
 me_chu_9_title:0 "$01_chu_missions_task_9$"
 me_chu_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_chu_missions_task_9$#!' $mission_completed_tooltip_2$"
 no_more_chu_reform_tt:0 "我们的改革大业已然完成！"
 sword_of_goujian:0 "越王勾践剑"
 sword_of_goujian_desc:0 "虽勾践亲铸之剑已湮没于岁月长河，然楚室已造出一件在工艺与美态上皆超越其传奇同名者之利器。"

l_simp_chinese:
 assassinate_qin_as_yan:0 "刺帝"
 byjing_yan_mod:0 "巨都摇篮"
 desc_assassinate_qin_as_yan:0 "外国密探成功刺杀秦国之主，令其王国陷入一片混乱。"
 desc_byjing_yan_mod:0 "我都城冠绝天下，真乃未来帝国之摇篮。"
 desc_northern_wall_yan:0 "我方工匠从修筑北方防御工事中学获良多；彼等将把此等经验应用于我举国上下。"
 desc_northern_wall_yan_province_mod:0 "此行省受燕人所建之广阔防御工事所庇护，民间俗称为「北墙」。"
 desc_qinged_qi:0 "一股必胜之尚武精神已攫住吾民之魂，吾等已摧毁腐朽之齐。"
 desc_rebuilt_yan_mod:0 "赖君主主持重建，国民兴旺。"
 desc_yan_coalition_mod:0 "赖我邦领袖所缔之雄强联盟，我邦之声望与军力皆熠熠生辉。"
 desc_yan_donghu_strategies:0 "因得当地内应之助，我邦对东胡领地之形势了如指掌，且我方征召兵已充备于丘陵之间，随时可与之交战。"
 desc_yan_iron_mod:0 "我邦矿山与群山之慷慨馈赠，为我军旅提供了锻造精良武器所需之原矿。"
 desc_yan_royal_bronzeware:0 "此套青铜食器由国君下令铸造，以炫耀其匠人之高超技艺，乃燕文化优越之象征。"
 is_in_jin_region:0 "位于辰地区。"
 me_yan_1.a:0 "但愿你所言不虚，[SCOPE.sCharacter('guo_character').GetFirstName]…"
 me_yan_10.a:0 "我绝不留情，必直捣其覆灭！"
 me_yan_10_desc:0 "于[GetCountry('QII').GetName]而言，何等晦暗之日——莫非诸神未示警其民审判之日已至乎？传谕之先知何在，其口唇岂未衔警诫之语？然今为时已晚，哀戚毁灭之挽歌弥漫焚烧省份之烟火空气。\n\n[GetCountry('YAN').GetName]之军已将背信之齐逐出其腹地——纵彼等骄傲之传奇之城[GetProvince('(int32)8504').GetName]亦陷于燕军之手，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之旗今已飘扬于其残破城垛之上。齐经此毁灭之失，永难恢复，其国祚屈指可数矣。"
 me_yan_10_title:0 "$yan_missions_task_10$"
 me_yan_11.a:0 "我之文明日益繁荣，威望与日俱增"
 me_yan_11_desc:0 "在一番慷慨昭示中，[ROOT.GetCountry.GetRuler.GetName]诏命居于[ROOT.GetCountry.GetCapital.GetName]之治金名匠铸造一套#E 皇家青铜礼器#!。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]期望庶民将赞美[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之慷慨。"
 me_yan_11_title:0 "$yan_missions_task_11$"
 me_yan_12.a:0 "更多战斗在前，尔等是否与我同行？"
 me_yan_12_desc:0 "前线捷报！我凯旋之师已逐退[GetCountry('JSN').GetName]之弱旅，夺取控制#E 渤海湾#!贸易流之关键半岛。\n\n预兆已言，几可保[ROOT.GetCountry.GetRuler.GetName]之军永胜——诸神已视其为盖世之征服者！"
 me_yan_12_title:0 "$yan_missions_task_12$"
 me_yan_13.a:0 "然而他们将继续前进…"
 me_yan_13_desc:0 "我对[GetCountry('ZHA').GetName]之防务工事已毕，今得以据强位而击敌；诸神亦以大片领土犒赏[ROOT.GetCountry.GetRuler.GetName]卓越之韬略。\n\n我征卒心怀感激，因知最恶情势之下，彼等可退据西境所筑之堡垒；然眼下，对赵之占据仍将继续。"
 me_yan_13_title:0 "$yan_missions_task_13$"
 me_yan_14.a:0 "正有此意…"
 me_yan_14_desc:0 "为昭示[ROOT.GetCountry.GetAdjective]对败亡之敌之优越，[ROOT.GetCountry.GetRuler.GetName]下此攸关之令：须将[GetProvince('(int32)8504').GetName]之珍宝藏品移置[ROOT.GetCountry.GetCapital.GetName]。纵此刻，惊愕之齐民哀号充溢临淄街巷，我士卒正井井有条地清空祠庙中之圣物。\n\n心怀复仇之[ROOT.GetCountry.GetRulerTitle]对苦苦哀求保留神圣珍藏之齐地显贵未曾动心，彼等力陈此举将永摧国人志气。"
 me_yan_14_title:0 "$yan_missions_task_14$"
 me_yan_15.a:0 "然而吾等须继续南征…"
 me_yan_15_desc:0 "[GetCountry('QII').GetName]所据之土已几近全毁，瘟疫饥荒迅扫燕军新占之残破地域。此地之农夫盼最难之期已过，正悄然努力重建破碎余生，艰难以偿新立燕地监官所课之赔款。\n\n昔日熙攘村落，人烟生灵充盈之处，唯余鸦啼凄厉……\n\n[GetCountry('QII').GetName]已倾覆，永世不复……"
 me_yan_15_title:0 "$yan_missions_task_15$"
 me_yan_16.a:0 "你说得对——此消息确令我甚喜"
 me_yan_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，君必乐闻——海上贸易正于[ROOT.GetCountry.GetName]各地蓬勃兴盛。我港口与商区之拓展大为促动地方显贵之投资，据云诸多大商行已遣商贾入驻港城，以助经贸之昌。"
 me_yan_16_title:0 "$yan_missions_task_16$"
 me_yan_17.a:0 "此墙将保我免遭胡骑——你且看着"
 me_yan_17_desc:0 "虽我严惩北方蛮夷，教训彼等数代难忘，[ROOT.GetCountry.GetRuler.GetName]始终警醒于诸神之无常：彼等今日赐人以非凡之礼，明日便可尽数夺去。\n\n亲巡北方边地后，[ROOT.GetCountry.GetRuler.GetFirstName]下令构筑一道#E 北境边墙#!，以借地形之利——若有草原掠骑妄图无阻闯入[ROOT.GetCountry.GetName]，必将遭遇出其不意之惊。"
 me_yan_17_title:0 "$yan_missions_task_17$"
 me_yan_18.a:0 "我正牵线操纵，尔等浑然不觉…蠢货。"
 me_yan_18_desc:0 "在一绝妙外交大手笔中，[ROOT.GetCountry.GetRuler.GetName]密遣间谍暗探遍布东方诸地，携满袋钱币，以散播不和为使命。我[ROOT.GetCountry.GetRulerTitle]之期望在于能令争竞不休之各地方势力彼此倾轧；当我使节暗中煽动当地世仇纠纷之烈火，东方之众将四分五裂，遂成[ROOT.GetCountry.GetCapital.GetName]可操纵之傀儡。"
 me_yan_18_title:0 "$yan_missions_task_18$"
 me_yan_19.a:0 "时局虽紧，所求尚能应付"
 me_yan_19.b:0 "尽克净所需以助其成功"
 me_yan_1900.a:0 "我想我们尚可分些专长之助"
 me_yan_1900.b:0 "凡你所求，无不应允！"
 me_yan_1900_desc:0 "诸事备矣，荆轲将于明晨驰赴秦君之廷。轲将佯装逃避燕军之「突袭」，声称携有标绘燕军动向之地图。一柄淬毒精匕已藏于此地图卷轴之内，将以此偷携至秦王驾前，唯望其能安息于秦王心口。\n\n轲正收拾余物之际，托人向[ROOT.GetCountry.GetRuler.GetName]请求数名护卫随行——其似略有紧张，欲得老练武士从旁守护。"
 me_yan_1900_title:0 "$yan_missions_task_19$"
 me_yan_1901.a:0 "天神在上，克所求过多——尽力支援"
 me_yan_1901.b:0 "既已入局，无退之理…此刻不能后退"
 me_yan_1901_desc:0 "一封荆轲之密信已由贩梅酒之商人私传至[ROOT.GetCountry.GetRuler.GetName]手中，此等商人潜越秦境而未遭盘查。\n\n荆轲报称诸事顺遂，一切均按计而行，然有一小碍——秦人始生疑窦，有人声称彼非真贵族，实乃秦邦诸敌之一所遣之间谍。\n\n为摆脱密探之纠缠，轲求增资财——欲于[GetProvince('(int32)8313').GetName]广散钱财，或设一宴；其称此举可助其更好融入上流之社交圈，或得近秦王之机。"
 me_yan_1901_title:0 "$yan_missions_task_19$"
 me_yan_1902.a:0 "但愿克知其所为…"
 me_yan_1902.b:0 "我对你们二人有好的预感…"
 me_yan_1902_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，荆轲又有书信至！于[GetCountry('QIN').GetCapital.GetName]耗费巨资并运用人脉后，轲已博得当地显贵之好感，终获秦国朝廷之召见。\n\n荆轲告[GetCountry('QIN').GetRuler.GetName]秦王，称已取一著名秦之叛将首级，愿当面呈献天子——天子已允见之！\n\n天命之刻近在咫尺。当我们展读此信之时，荆轲应已携其随从秦舞阳入朝矣。"
 me_yan_1902_title:0 "$yan_missions_task_19$"
 me_yan_1903.a:0 "于燕国而言何其神奇之日！"
 me_yan_1903_desc:0 "[GetCountry('QIN').GetRuler.GetName]遇刺之讯传至[ROOT.GetCountry.GetCapital.GetName]街巷之时，荆轲之任何音讯尚未抵达——消息如野火沿商路蔓延；秦王神秘之死似为万民唯愿谈论之事。\n\n如常，传闻混杂，几分真实杂几分虚妄；有称[GetCountry('QIN').GetRuler.GetFirstName]为攀墙入宫之刺客群所弑，亦有称其被逼以矛尖饮下一大碗水银。尚有信者谓一妖魔、一复仇之魂附体秦王，迫其自[GetCountry('QIN').GetCapital.GetName]城墙跳下。\n\n然无人言及燕之刺客竟能近秦王之身——似无人疑[ROOT.GetCountry.GetRuler.GetName]与此有任何牵连。"
 me_yan_1903_title:0 "$yan_missions_task_19$"
 me_yan_1904.a:0 "愿冥界诸神折磨此二愚人！"
 me_yan_1904_desc:0 "数周以来无人得荆轲之消息，[ROOT.GetCountry.GetRuler.GetName]始惧最恶之况。虽燕之[ROOT.GetCountry.GetRulerTitle]早为恶讯做好[ROOT.GetCountry.GetRuler.GetHerHim]之备，然当真讯至时，仍令[ROOT.GetCountry.GetRuler.GetFirstName]恐惧颤栗。\n\n简言之，行刺之举彻底溃败，令人汗颜。荆轲与秦舞阳于朝堂举止宛若乡野村夫，圆睁双目、张口结舌，环顾四周之华丽而瞠目。更糟者，秦舞阳汗出如产驹之牝马，浸透衣衫，引秦卫士疑窦，遂拒其入[GetCountry('QIN').GetRuler.GetName]之驾前。\n\n知计已败露，荆轲至少奋力扑向[GetCountry('QIN').GetRuler.GetFirstName]，据称其持刃追逐秦王，而秦王躲于柱后——一幕几近可笑之景。\n\n片刻之后，荆轲之颅为秦卒劈为两半，二荆与秦残破之尸身悬于[GetCountry('QIN').GetCapital.GetName]正门之外。\n\n不消言，秦人对我怒不可遏……"
 me_yan_1904_title:0 "$yan_missions_task_19$"
 me_yan_1905.a:0 "愿神明怜悯秦国之民…"
 me_yan_1905_desc:0 "一场浩劫降临于[ROOT.GetCountry.GetName]——我亲爱之[ROOT.GetCountry.GetRulerTitle]竟遭刺客之刃夺命！燕之贵族名唤#E 荆轲#!及其仆人#E 秦舞阳#!，不知何以获邀入朝，然彼等未呈秦之著名叛将首级，反而将一柄淬毒匕首私携入[ROOT.GetCountry.GetRuler.GetFirstName]之寝殿。\n\n其后之事难以复原；显然荆轲深刺匕首入秦王之背，当[ROOT.GetCountry.GetRuler.GetFirstName]痛苦嘶喊、倒地之时，荆轲与秦舞阳竟于混乱中脱逃。\n\n此护卫之彻底失职不可容忍，当值护卫[ROOT.GetCountry.GetRuler.GetFirstName]之卫士已悉数处决。然此举无以令死者复生，已有流言谓诸神自[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏收回眷顾矣。"
 me_yan_1905_title:0 "$yan_missions_task_19$"
 me_yan_1906.a:0 "我对燕之怒火如千日燃烧！"
 me_yan_1906_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，君之密探擒获两名来自[GetCountry('YAN').GetName]之贵族，企图潜入我朝。彼等声称携有秦之叛将#E 樊於期#!之首级，请谒陛下亲呈。然此皆谎言——其怀中淬毒匕首已泄密。此二蠢物竟欲将兵器藏于卷轴盒中以私携入宫——彼等以为我辈何等愚钝？\n\n刽子手已被召至，当二人遭受凌迟之刑时，尽吐其实：彼等乃[GetCountry('YAN').GetRuler.GetName]所遣，图使我邦动荡，因彼等自认战场上取胜无望，唯有借助阴谋诡计方可达其肮脏目的。\n\n所幸我卫士于事态失控前处置了此局，然我等以为陛下当知君敌甚众。"
 me_yan_1906_title:0 "$yan_missions_task_19$"
 me_yan_19_desc:0 "因军探屡报[GetCountry('QIN').GetName]之军训练有素，恒处备战之态，[ROOT.GetCountry.GetRuler.GetName]闻之懊恼，遂决计行刺以在南方制造混乱——刺杀[GetCountry('QIN').GetRuler.GetName]。\n\n秦遣军北向只是迟早之事，除非[ROOT.GetCountry.GetRuler.GetFirstName]能阻其图谋于未发之际，否则一场毁灭之战或将夺去我等辛苦所得之一切。\n\n正当吾王思索此不可更易之策及应行之计，一名为#E 荆轲#!之流亡贵族至[ROOT.GetCountry.GetCapital.GetName]；轲昔日为秦军夺去一切，恨秦至深，一如[ROOT.GetCountry.GetRuler.GetFirstName]，愿将一切付诸行动，唯求所需之资。"
 me_yan_19_title:0 "$yan_missions_task_19$"
 me_yan_1_desc:0 "虽然众多谋臣希求得[ROOT.GetCountry.GetRuler.GetName]之侧听，然[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]对阿谀奉承之徒了无兴致，彼等只会对[ROOT.GetCountry.GetRuler.GetHerHim]说[ROOT.GetCountry.GetRuler.GetSheHe]想听之辞。唯忠仆之诚言方足取信，然立于殿前者皆图自肥或谋朝中地位之升。\n\n听尽愚者之说数时辰后，[ROOT.GetCountry.GetRuler.GetFirstName]召#E 魏鞪#!立于王前，问臣[ROOT.GetCountry.GetName]之最佳前路。\n\n「先求贤达之教，使之知君重学问，则远较臣更智之贤者将自至君门。」"
 me_yan_1_title:0 "$yan_missions_task_1$"
 me_yan_2.a:0 "此实为至吉之讯"
 me_yan_2_desc:0 "臣启[ROOT.GetCountry.GetRuler.GetName]，西境所兴之基建诸事已见成效。经行此地者皆称[ROOT.GetCountry.GetName]于[GetCharacter('(int32)553').GetName]王灾祸之治后好时重返，诸神已赐福于[ROOT.GetCountry.GetRulerTitle]。我之繁荣必为未来吉兆！"
 me_yan_2_title:0 "$yan_missions_task_2$"
 me_yan_3.a:0 "我要开秦所见一切之详图"
 me_yan_3_desc:0 "一桩难以置信之事已在[ROOT.GetCountry.GetCapital.GetName]传遍，[ROOT.GetCountry.GetRuler.GetName]决心查明真相，终探得底细——传闻属实！\n\n多年前，有一名[ROOT.GetCountry.GetAdjective]武士唤为#E 秦开#!者，被遣作人质至[GetCountry('DGH').GetName]之部族；世人皆谓开永难归乡，因东胡乃无信义之族——彼等屡背誓言，然彼时我亦别无选择。开被迫抛弃所知一切，沦为蛮族首领之奴——确为悲惨之命。\n\n然开似于草原与北方荒地漂泊多年后脱出囚禁，挟敌方领土之详悉归来。还至[ROOT.GetCountry.GetName]后，开本欲返家探望亲族，然[ROOT.GetCountry.GetRuler.GetFirstName]之命召此脱逃者至[ROOT.GetCountry.GetCapital.GetName]。"
 me_yan_3_title:0 "$yan_missions_task_3$"
 me_yan_4.a:0 "愿胜利与你同在，剧辛，也与我们"
 me_yan_400.a:0 "燕邹，我闻汝名…且看虚实！"
 me_yan_400_desc:0 "[ROOT.GetCountry.GetRuler.GetName]铭记魏鞪之言，遣使四出，遍行[ROOT.GetCountry.GetName]之城邑与通衢，昭示强大之[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]将赏金银与愿为国效力之才士。\n\n故此，当一位略有声望之学者名唤#E 燕邹#!现身于[ROOT.GetCountry.GetCapital.GetName]城门时，无人意外；其除背上褴褛斗篷与双手捧持之空米碗外，一无所有。\n\n邹举碗过头，高声喊道不日将侍王侧以食——其报效[ROOT.GetCountry.GetRuler.GetFirstName]之志如此之大——其誓以勤勉证己，不求次而坐御膳之席。"
 me_yan_400_title:0 "$yan_missions_task_4$"
 me_yan_401.a:0 "'我们'，嗯？不过我欣赏你的想法…"
 me_yan_401_desc:0 "随着[ROOT.GetCountry.GetRuler.GetName]招揽外国才俊之名远播，又一位贤哲——兼具哲人与将领之才者，名唤#E 乐毅#!——跋涉至[ROOT.GetCountry.GetCapital.GetName]，欲向[ROOT.GetCountry.GetRulerTitle]献剑效力，但附有一条件。\n\n「战则必战，然我多年游历所学，在于交友之重。[ROOT.GetCountry.GetName]需盟友方能于将来取胜，我誓助成此事！」"
 me_yan_401_title:0 "$yan_missions_task_4$"
 me_yan_4_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在#E 劇辛#!这位大名鼎鼎之将抵达[ROOT.GetCountry.GetCapital.GetName]城门之前，早已得知其将至，盖此将行踪沿[ROOT.GetCountry.GetName]之驰道与官路传布飞快。\n\n闻此资深军略家乃来向[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]效力，着实令人松一口气，因原有传言谓某种灾厄与此致命武士同行。"
 me_yan_4_title:0 "$yan_missions_task_4$"
 me_yan_5.a:0 "你竟敢如此威胁我与我的盟友！"
 me_yan_5_desc:0 "「我尊贵之[ROOT.GetCountry.GetRuler.GetName]，勿谓吾不知汝之所为——汝虽欲掩其嘶声，吾固知汝乃毒蛇也，终将被[GetCountry('QII').GetName]之军踏于足下，有一日将其头斩下。」\n\n[GetCountry('QII').GetRuler.GetName]之来函以此开端，其后益发难堪——对[ROOT.GetCountry.GetRuler.GetFirstName]所加之辱骂，上流社交场中不可复述，[ROOT.GetCountry.GetRulerTitle]双颊因怒而涨红，[ROOT.GetCountry.GetRuler.GetSheHe]听着连串咒骂。\n\n「够了！」[ROOT.GetCountry.GetRuler.GetFirstName]厉喝，自[ROOT.GetCountry.GetRuler.GetHerHis]座立起。「齐若欲战，便与之一战！」"
 me_yan_5_title:0 "$yan_missions_task_5$"
 me_yan_6.a:0 "我之军力日增，须以精良兵器装备之"
 me_yan_6_desc:0 "我之奴隶在矿中辛勤劳作，然纵其日夜不息、折脊断骨之劳，亦仅勉敷[ROOT.GetCountry.GetAdjective]之民饥渴熔炉与铁匠铺之需。\n\n监工奉命守此等可怜之人，腰包银钱叮当，仍逼奴隶至极限，因知铁与青铜之需正日益增长。"
 me_yan_6_title:0 "$yan_missions_task_6$"
 me_yan_7.a:0 "蓟城最美的日子仍在前面，亲爱的市民…拭目以待"
 me_yan_7_desc:0 "[ROOT.GetCountry.GetCapital.GetName]，[ROOT.GetCountry.GetName]之都，为燕地增长至速之区，已逾其初始边界，成与天下至大之城相较之大都会——此诚为[ROOT.GetCountry.GetRuler.GetName]之伟绩，其亲督此空前扩张。\n\n众多人不远千里而来，只为迷途于蓟城繁闹商区之喧嚣，或在某间茶舍消磨宁静午后，听近旁溪水潺潺，默思一日之度。"
 me_yan_7_title:0 "$yan_missions_task_7$"
 me_yan_8.a:0 "一往无前，燕之将士！向胜利进军！"
 me_yan_8_desc:0 "当[GetCountry('YAN').GetName]之师于战场上初遇来自[GetCountry('DGH').GetName]之蛮族时，据称其怯懦之众惊惶失措，争相奔逃之际竟自相攻伐；[ROOT.GetCountry.GetRuler.GetName]趁势麾军进击，扫荡诸般抵抗。\n\n其后之事唯可谓杀戮，贪婪之鸦今饱啄东胡人马之肉。"
 me_yan_8_title:0 "$yan_missions_task_8$"
 me_yan_9.a:0 "不能令其不战而踏入我腹地！"
 me_yan_9_desc:0 "虽[ROOT.GetCountry.GetRuler.GetName]更愿亲在战场与[GetCountry('ZHA').GetName]之兵刃相接，然雄心勃勃之[ROOT.GetCountry.GetRulerTitle]不可分身各处，而[ROOT.GetCountry.GetName]北疆与东域时常有事需[ROOT.GetCountry.GetRuler.GetHerHis]关注。\n\n不甘拱手让出西境边地，[ROOT.GetCountry.GetRuler.GetFirstName]已令于诸省建造防务工事——此为抵挡进逼之赵寇之第一道防线。"
 me_yan_9_title:0 "$yan_missions_task_9$"
 northern_wall_yan:0 "已筑北方城墙"
 northern_wall_yan_province_mod:0 "北方城墙"
 qinged_qi:0 "已灭齐国"
 rebuilt_yan_mod:0 "重建燕国"
 yan_coalition_mod:0 "已结同盟"
 yan_donghu_strategies:0 "东胡策略"
 yan_iron_mod:0 "为我军铸铁"
 yan_missions:0 "最后的诸侯"
 yan_missions_BUTTON_TOOLTIP:0 "愿我剑锋永不落空……"
 yan_missions_CRITERIA_DESCRIPTION:0 "当#E 燕#!重建了其核心领土，平定了东西边境的威胁，并摧毁了我们在南方的宿敌时，此任务将完成。"
 yan_missions_DESCRIPTION:0 "我们周围，死亡与征服的双重承诺无处不在；究竟是死于南方野心勃勃的君王之手，还是亡于北方荒原上庞大的草原部落大军，只有众神知晓。然而，显而易见的是，#E 燕#!面临的前路黑暗而险恶，身边几乎没有朋友同行。\n\n虽然有些人面对如此严峻的生存困境会颤抖不已，但[ROOT.GetCountry.GetRuler.GetName]对危险嗤之以鼻，对[ROOT.GetCountry.GetRuler.GetHerHis]未来的愿景充满信心。当周围许多王国因内部分裂和外敌入侵而倒下时，[ROOT.GetCountry.GetRuler.GetFirstName]独自屹立——燕不会屈服于黑暗，而将凌驾于一切之上！"
 yan_missions_task_1:0 "擢升郭隗"
 yan_missions_task_10:0 "镇服齐国"
 yan_missions_task_10_DESC:0 "[GetCountry('QII').GetName]的富庶城市正在诱惑地呼唤着我们的征召兵，他们渴望掠夺那些南方软绵绵居民的家乡。一旦我们击败他们的军队，我们将放任我们的兵力席卷齐国的核心地带，让他们尽情饱餐，直到腹满囊鼓。\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 yan_missions_task_10_claims_tt:0 "我们将获得#Y 北海#!、#Y 东莱#!、#Y 琅琊#!、#Y 泰山#!、#Y 东#!、#Y 济阴#!和#Y 山阳#!地区的宣称权。"
 yan_missions_task_11:0 "王室青铜器"
 yan_missions_task_11_DESC:0 "既然我们现在有了财力，就应该委托铸造青铜器，以彰显[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族的尊贵地位——他们是[ROOT.GetCountry.GetName]有史以来坐在其宝座上的最伟大统治者。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 yan_missions_task_12:0 "夺取朝鲜"
 yan_missions_task_12_DESC:0 "如今[ROOT.GetCountry.GetName]之国力已然复兴，吾等当挥师东进，尽可能多地夺取[GetCountry('JSN').GetName]之领土。吾等有理由相信，蛮族必将在吾等胜利之师面前土崩瓦解——诸神已将其土地赐予吾等！\n\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 yan_missions_task_12_claims_tt:0 "我们将获得对#Y 马韩#!和#Y 南马韩#!地区的宣称。"
 yan_missions_task_13:0 "击退赵国"
 yan_missions_task_13_DESC:0 "吾等心中深知，永无可能与[GetCountry('ZHA').GetName]和平共处——唯有将其来势汹汹之征卒远远逐出边界，我民方得安宁。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 yan_missions_task_13_claims_tt:0 "我们将获得#Y 并州#!地区所有省份的宣称。"
 yan_missions_task_14:0 "齐之宝藏"
 yan_missions_task_14_DESC:0 "有人反复传扬一则愚昧之说，称[GetProvince('(int32)8504').GetName]——昔日[GetCountry('QII').GetName]之都城——乃天下第一雄城，其荣耀与威望远超我[ROOT.GetCountry.GetCapital.GetName]。然此等摇唇鼓舌之辈，一旦听闻吾等已将齐国最珍贵之宝物据为己有，自当哑口无言。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 yan_missions_task_15:0 "南征"
 yan_missions_task_15_DESC:0 "如今[GetCountry('QII').GetName]之腹地已落入我手，便再无多少阻碍可阻我进一步向南扩张——号令我将士向敌之都城进军！\n\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 yan_missions_task_16:0 "海上贸易"
 yan_missions_task_16_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]已然洞见[GetProvince('(int32)8724').GetName]省之潜力，[ROOT.GetCountry.GetRulerTitle]下诏宣布此地将成为一座壮丽港口之所在，此港必将掌控该区域之海上贸易。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 yan_missions_task_17:0 "北方城墙"
 yan_missions_task_17_DESC:0 "为守护吾等浴血奋战所得之疆土，使其免受北方草原蛮族之威胁，吾等决意扩建防御工事网络。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 yan_missions_task_18:0 "辰之傀儡"
 yan_missions_task_18_DESC:0 "传闻[ROOT.GetCountry.GetRuler.GetName]以[ROOT.GetCountry.GetRuler.GetHerHis]手指牵动诸多丝线，遍布[ROOT.GetCountry.GetName]全境之密探与线人，皆将秘密情报源源不断送回[ROOT.GetCountry.GetCapital.GetName]。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 yan_missions_task_19:0 "荆轲刺秦王"
 yan_missions_task_19_DESC:0 "我[ROOT.GetCountry.GetRulerTitle]不惧动用[ROOT.GetCountry.GetRuler.GetHerHis]所能支配之一切手段，以达成[ROOT.GetCountry.GetRuler.GetHerHis]之政治目标，尤其事关保护[ROOT.GetCountry.GetName]之百姓安危。\n\n#Y 更多资源将增加我之胜算。#!\n\n#Y 此举将开启一连串事件。#!\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 yan_missions_task_19_attempt_assassination:0 "我们将试图对秦王实施刺杀密谋。"
 yan_missions_task_1_DESC:0 "若[ROOT.GetCountry.GetName]尚存成为强国——一个令敌手既敬且畏之国——之一线希望，则必须以有远见之大臣、敢作敢为之士人指引我等前行——断不可容许品格软弱之顾问窃据要津。\n\n所幸，仍有甘愿以生命奉献于百姓之人，而郭隗正是其中一位。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 yan_missions_task_2:0 "重建南燕"
 yan_missions_task_2_DESC:0 "与我南方诸敌接壤之土地，在[GetCharacter('(int32)553').GetName]王治下历经了诸多灾厄，然如今吾等须将资源集中于重建；于此兵燹蹂躏之地域，吾等于基础设施方面大有可为。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 yan_missions_task_2_all_rebuilt_provinces_get:0 "所有重建省份将获得："
 yan_missions_task_2_three_farms_in_zhuo_yuyang_bohai_shanggu:0 "吾等需要在涿郡、渔阳、渤海、中山或上谷诸郡至少拥有三处农耕聚落。"
 yan_missions_task_2_two_reservois_in_zhuo_yuyang_bohai_shanggu:0 "我们需要在涿、渔阳、渤海、中山或上谷地区至少有两座水库。"
 yan_missions_task_3:0 "贵质"
 yan_missions_task_3_DESC:0 "我[ROOT.GetCountry.GetRulerTitle]，一桩至为神奇之事已然发生；一名被遣往#E东胡#!之地为质的燕国将领，已然自彼等蛮族之魔掌中逃脱，携我敌邦及其生活方式之珍贵情报返回[ROOT.GetCountry.GetCapital.GetName]。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 yan_missions_task_4:0 "招募异邦贤才"
 yan_missions_task_4_DESC:0 "吾等必须广传消息，[ROOT.GetCountry.GetCapital.GetName]之王室朝廷亟需俊才——我[ROOT.GetCountry.GetRulerTitle]将为愿来效力于[ROOT.GetCountry.GetName]之百姓者支付俸禄。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 yan_missions_task_4_recruit:0 "我们将尝试招募异邦贤才。"
 yan_missions_task_5:0 "反齐同盟"
 yan_missions_task_5_3_chinese_allies:0 "我们至少有三位华夏盟友。"
 yan_missions_task_5_DESC:0 "吾等无法凭一己之力击败[GetCountry('QII').GetName]，若无盟友则连尝试亦断不可为——吾等需要能在战事临头之际鼎力相助之友邦。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 yan_missions_task_6:0 "铁铜冶金"
 yan_missions_task_6_DESC:0 "虽山中蕴藏铁与青铜为我所用，然若无矿山，此等矿藏于我铁匠便毫无用处——我饥渴之国亟需此等珍贵金属。\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 yan_missions_task_6_base_metals_mine_in_zhuo_yuyang_bohai_shanggu:0 "吾等需在涿郡、渔阳、渤海、中山或上谷诸郡至少拥有一处基础金属矿山。"
 yan_missions_task_6_iron_mine_in_zhuo_yuyang_bohai_shanggu:0 "我们需要在涿、渔阳、渤海、中山或上谷地区至少有一座铁矿。"
 yan_missions_task_7:0 "于冀"
 yan_missions_task_7_DESC:0 "美丽之城#E蓟#!凌驾于诸城之上，然我美好之都城仍有发展之余地——若能得远见卓识者之引导，此城可成为中原大地最伟大之都会。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 yan_missions_task_8:0 "击败东胡"
 yan_missions_task_8_DESC:0 "[GetCountry('DGH').GetName]之蛮族部落遣其劫掠队潜入我山林之中——此乃最后一次；[ROOT.GetCountry.GetRuler.GetName]必将一劳永逸地终结此等蛮夷。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 yan_missions_task_8_claims_tt:0 "我们将获得对#Y 辽西#!、#Y 辽东#!和#Y 乐浪#!地区的宣称。"
 yan_missions_task_9:0 "抵御赵国"
 yan_missions_task_9_DESC:0 "[GetCountry('ZHA').GetName]王国久为吾民心腹之患；乃一顽固难化之敌，吾等绝不可有片刻忽视，否则彼等必将利用一切可乘之机。让吾等修筑堡垒，作为抵御我敌手之第一道防线。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 yan_missions_task_9_claims_tt:0 "吾等将获得对#Y上谷#!、#Y左#!、#Y代#!、#Y恒山#!、#Y中山#!、#Y巨鹿#!及#Y河间#!诸郡之宣称。"
 yan_royal_bronzeware:0 "王室青铜器"

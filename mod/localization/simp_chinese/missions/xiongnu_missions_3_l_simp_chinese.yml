l_simp_chinese:
 XIONGNU_EMPIRE:0 "匈奴帝国"
 desc_upset_xiongnu_chars:0 "我境内部族诸贵胄，对我邦采行华夏之道及彼等缺少战利品之现状颇为不满。"
 desc_xiongnu_chewed:0 "吞并楚地为我民开辟广阔新土。"
 desc_xiongnu_chinese_capital:0 "新华夏都城将是部落与新臣民之天国堡垒。"
 desc_xiongnu_enslaved_chinese:0 "对华夏诸民之系统奴役，虽于我国经济大有裨益，然不知何故，却令彼等对我益发心怀不满。"
 desc_xiongnu_heavenly_horses:0 "天马令我军骑兵为天下第一。"
 desc_xiongnu_hun_storm:0 "让我草原勇士疾驰而前，征服四方，将恐惧注入世间文明诸民之心胆！"
 desc_xiongnu_ships_southern_china:0 "匈奴对海岸之征服，促使我邦效法我华夏臣民之风貌，建立一支水师。"
 desc_xiongnu_silk_road:0 "垄断丝路商道，国库必充。"
 desc_xiongnu_spared_linzi:0 "维系临淄知识中心确有其益……"
 desc_xiongnu_wu:0 "军方研习孙子兵法，必助征服。"
 me_xiongnu_3_1.a:0 "狄人之地理当归我所有。"
 me_xiongnu_3_10.a:0 "保留蛮夷之城完好。"
 me_xiongnu_3_10.b:0 "将珍宝与奴隶运予部落贵族。"
 me_xiongnu_3_10.c:0 "将城市夷为平地，取走一切值钱之物。"
 me_xiongnu_3_10_desc:0 "伟哉单于！我铁骑已征服百越之密林群山与谷地！涂面战士之遗体遍布丛林，当他们试图伏击我军时，被一一剿灭。中国人对这些民族及其土地之知识，在此任务中极为宝贵。面朝浩瀚海洋，东瓯之城富藏宝石及数千新俘之越人奴隶。单于陛下，有何旨意？"
 me_xiongnu_3_10_title:0 "$xiongnu_missions_3_task_10$"
 me_xiongnu_3_11.a:0 "秦人在颤抖…"
 me_xiongnu_3_11_desc:0 "围绕渭河河谷之战略要地，今已入大单于掌中！秦人今恐我进迫，盖一切外援与贸易之望，均已被我切断于其都城咸阳之外。此番终于围困那座宏伟之城、并为匈奴夺取秦之沃野的时刻，已近在眼前！"
 me_xiongnu_3_11_title:0 "$xiongnu_missions_3_task_11$"
 me_xiongnu_3_12.a:0 "听从华夏谋臣，保全此城。"
 me_xiongnu_3_12.b:0 "允许有限没收，但不伤建筑与民众。"
 me_xiongnu_3_12.c:0 "一个不留——洗劫全城，斩尽杀绝！"
 me_xiongnu_3_12_desc:0 "咸阳城之守护者已匍匐于大单于足下——其全军已丧，其城已陷，其邦土亦已尽失。中国谋士进谏宽恕此番贵族及一般百姓，声称统御感恩之被解放者，胜于统御满怀仇恨之被奴役秦人而化为荒芜。臣主，陛下将作何决断？"
 me_xiongnu_3_12_title:0 "$xiongnu_missions_3_task_12$"
 me_xiongnu_3_13.a:0 "保留此要塞之城，作为西南堡垒。"
 me_xiongnu_3_13.b:0 "取走一切值钱之物，让部众分些奴隶。"
 me_xiongnu_3_13.c:0 "推倒城墙，焚烧全城。奴役土著与秦人主子。"
 me_xiongnu_3_13_desc:0 "四川盆地之浩瀚财富今已属大匈奴帝国，臣主！虎豹、茶茗、柑橘、稻米种种，今皆为陛下王室之享用，庶民已被征调劳作以确保诸般奢物持续出产。蜀人旧都成都，此座巍峨要塞之城，乃通往吐蕃之门户与盆地之枢纽，具有特殊之战略意义。此古城将何去何从？"
 me_xiongnu_3_13_title:0 "$xiongnu_missions_3_task_13$"
 me_xiongnu_3_14.a:0 "郢将为长江上游之首府。"
 me_xiongnu_3_14.b:0 "运走古老珍宝与一些奴隶。"
 me_xiongnu_3_14.c:0 "夷平郢都，抹除楚之记忆。"
 me_xiongnu_3_14_desc:0 "我单于，西南山地之险峻地形，今终已无蛮族之踪。虽我骑兵在此地遭受巨大损耗，然我辈得以逐一剿灭蛮族游击之徒，并根除楚人与秦人残余之影响。尤可一提者，乃楚人古都郢，踞于长江上游，恰在通往四川之陡峻峡谷之前，今已入我掌控。我辈当如何处置此楚人古都？"
 me_xiongnu_3_14_title:0 "$xiongnu_missions_3_task_14$"
 me_xiongnu_3_15.a:0 "发展此初具雏形之蛮夷城镇。"
 me_xiongnu_3_15.b:0 "将牲畜与财宝带回北方。"
 me_xiongnu_3_15.c:0 "焚其城镇以惩蛮夷。"
 me_xiongnu_3_15_desc:0 "征服广袤的南方丛林于我匈奴与于楚人一般艰难。民庶抗拒吾等之治，丛林致北方骑兵损耗甚巨，瘴疠之气复阻开发。然则我军终获全胜，制服南方濮、苗诸蛮，为单于夺取丛林中异域之珍宝。海滨蛮城番禺，乃大象驯养之所，为全境最为知名之城邑。"
 me_xiongnu_3_15_title:0 "$xiongnu_missions_3_task_15$"
 me_xiongnu_3_16.a:0 "亚历山大之城归我所有！"
 me_xiongnu_3_16_desc:0 "传说中自称「爱奥尼亚人」之天马，终归我大单于所有矣！我军于一座名为亚历山大里亚之城郊外，完取尚存之马场；此城据云乃数代之前一位据称征服文明世界之神王所建。此地所育良马为迄今所见最强健之品种，必将为我匈奴日后征伐之无价利器。"
 me_xiongnu_3_16_title:0 "$xiongnu_missions_3_task_16$"
 me_xiongnu_3_17.a:0 "唯有最好的马才配得上单于！"
 me_xiongnu_3_17_desc:0 "吾主在上，费尔干纳谷地良马繁育之经营已见成效！此等神骏已于战场上展露锋芒，谷地所产马匹之数亦超越我军征伐蹂躏此地之前。单于明鉴，拓殖牧场、广输奴隶于此地，诚乃神授之智也！"
 me_xiongnu_3_17_title:0 "$xiongnu_missions_3_task_17$"
 me_xiongnu_3_18.a:0 "成周之命运就在眼前…"
 me_xiongnu_3_1800.a:0 "成周之民恐难善终…"
 me_xiongnu_3_1800_desc:0 "单于立于已陷之城前，部众汹汹，急欲纵掠。单于自知难遏族人贪噬之心，遂亲率冲锋直捣城心，逢人便斩。沿途纵掠渐起，部落之众谨记勿取单于目中所瞩之物。于毁灭与屠戮之乱中，城门至王宫间数处火起之报已传至……"
 me_xiongnu_3_1800_title:0 "洗劫成周"
 me_xiongnu_3_1801.a:0 "此乃纯粹之屠杀…"
 me_xiongnu_3_1801_desc:0 "屠城首日，周王贵胄之区与王宫多处火起。部落武士自烈焰燃烧之楼宇中掠出不可胜计之黄金、瓷器、珍宝及诸般贵重之物，屠戮胆敢护卫家财者。明智者或潜匿藏身，或仓皇出奔，然诸多仍葬身火海，或被掳为奴。据云是日单于已是天下至富之人。"
 me_xiongnu_3_1801_title:0 "成周火起"
 me_xiongnu_3_1802.a:0 "成周仍在焚烧…"
 me_xiongnu_3_1802_desc:0 "次日，大火蔓延至城中主要民居之区，无论贵贱，屋宅尽焚。众多居民奔逃中丧命，为我骑兵所截杀；骑兵于房屋焚毁前竭力搬取其中一切。全城百姓之财富皆被榨取殆尽，多数建筑化为焦砾。单于则趁隙往来王宫苑囿，搜罗各处密室所藏之珍奇。"
 me_xiongnu_3_1802_title:0 "城在燃烧"
 me_xiongnu_3_1803.a:0 "此曾辉煌之城已几无残留。"
 me_xiongnu_3_1803_desc:0 "末日之临，烟尘渐散，浩劫之惨状终于清晰可辨。城中十有八区，唯余焦尸、沸血之迹与残垣断壁，仅河畔少数区域得以幸免。王宫废墟成为单于新设之大营，单于于此宣告屠城终结。百姓泰半或死或奴，生还之民受命清运瓦砾、掩埋亡骸。"
 me_xiongnu_3_1803_title:0 "废城"
 me_xiongnu_3_18_desc:0 "圣城成周，及敌对周王所据之巩与王城，今皆入单于之掌中！此乃匈奴迄今未有之伟业，亦符大单于冒顿破月氏后挥师征伐中原之宏图。华夏文明诸圣物——包括神圣九鼎——今皆听命于吾主，足证单于君临中国之正统！我部落大军入城时难遏嗜血之欲，凡挡路者尽数斩戮，争奔圣城掠取各自之份。"
 me_xiongnu_3_18_title:0 "$xiongnu_missions_3_task_18$"
 me_xiongnu_3_19.a:0 "华夏将哀叹我之统治。"
 me_xiongnu_3_19_desc:0 "华夏之民悉数被奴，吾先祖之梦终成现实。昔日抗拒我征服之石筑大城今已沦陷，其民尽为我大单于及匈奴帝国之仆役。彼等之困苦将为我等之增益，盖奴役百万之众必将大益于单于所渴求之粮秣与珍玩之产。然对中国之残酷统治尚有更深之用——彻底摧折抗拒吾治之意志。"
 me_xiongnu_3_19_title:0 "$xiongnu_missions_3_task_19$"
 me_xiongnu_3_1_desc:0 "大单于在上，我军终在昔日狄人部落之故地获得立足之处——狄人所操之语言与吾族至为亲近。近百年间，狄地渐为华夏赵、秦、燕诸国所并。今我继承此狄夏杂处之地，已更近中原之心腹矣。"
 me_xiongnu_3_1_title:0 "$xiongnu_missions_3_task_1$"
 me_xiongnu_3_2.a:0 "此城将基本保留原貌。"
 me_xiongnu_3_2.b:0 "轻掠一番应无大碍…"
 me_xiongnu_3_2.c:0 "邯郸将夷为平地！"
 me_xiongnu_3_20.a:0 "让我们征服居鲁士与亚历山大之疆土。"
 me_xiongnu_3_20.b:0 "穿越庞蒂克草原，驰向欧罗巴。"
 me_xiongnu_3_20_desc:0 "中国既入我奴役之中，匈奴统驭草原之预言方始启幕；我等方初窥传闻中之西方诸地，彼处更有万民繁盛，抗拒吾等之治。我可择先南向深入，征服更多传奇亚历山大大帝之城，亦可率更多斯基泰之地归我统辖，尽合马上之民。"
 me_xiongnu_3_20_title:0 "$xiongnu_missions_3_task_20$"
 me_xiongnu_3_21.a:0 "蓟城将是融合两界之绝佳都城。"
 me_xiongnu_3_21_desc:0 "龙城虽永为精神故土，然今乃在中国之地营建华夏式都城以治新附之民之时矣。此举合乎情理，盖我国人口大半在此，我族亦日益习染彼等习俗，取彼等兵略，纳彼等技艺，享彼等奢华。今单于所任中国谋士、哲人、匠师、军略家之数，竟逾本族匈奴部人。鉴于斯，当重修北地燕之故都蓟城为新都，统御我泱泱之国。"
 me_xiongnu_3_21_title:0 "$xiongnu_missions_3_task_21$"
 me_xiongnu_3_22.a:0 "吾等是否该抛弃根源？"
 me_xiongnu_3_2200.a:0 "进步难免带来不幸后果。"
 me_xiongnu_3_2200_desc:0 "部落腹地奏报纷至，称若干守旧部民率小股氏族离我疆域，远走西方广袤平原及北方冻土荒野。似有部落显贵不满我等化夷为夏、合城居之民与马上之民为一体之图。此事虽有中国谋臣预见在先，然终究值得。"
 me_xiongnu_3_2200_title:0 "部民离散"
 me_xiongnu_3_2201.a:0 "吾等在部落贵族中之影响正在流失。"
 me_xiongnu_3_2201_desc:0 "吾等以财货笼络、以辞令诱说诸部贵胄接纳新秩序之策，未尽遂意……草原各地之强宗悍部日益抗拒将华夏礼俗哲理融入彼等简朴部落生涯。我必耗费更多时日与人心资本以羁縻此等集团，尤因彼等乃我军旅之脊梁。"
 me_xiongnu_3_2201_title:0 "掌控渐失"
 me_xiongnu_3_2202.a:0 "单于负伤返回蓟城。"
 me_xiongnu_3_2202_desc:0 "于故都龙城之岁首部族显贵聚会上，一部首领当众诘问吾主——大单于、天子——关于全境部民汉化之事。诸人数落单于采用华夏宗教礼仪之举，质问单于是否更在意与神秘青铜鼎彝对话，而非远境贫苦部民之疾苦。会后，保守部落派系愈加视单于为「天子」矣。"
 me_xiongnu_3_2202_title:0 "忽里勒台"
 me_xiongnu_3_2203.a:0 "吾等不再受挟制以换取忠诚。"
 me_xiongnu_3_2203.b:0 "倾尽国库以确保忠诚与进步。"
 me_xiongnu_3_2203_desc:0 "在分发最新一轮贿赂安抚对时势变迁不满的部民以维系其忠诚后，一项新最后通牒呈递于单于面前。龙城一批最为可靠且权势炙手可热之宗亲传话称，若彼等之忠亦不得如不满者一般受赏，势不肯罢休。此辈所索之价骇人听闻，若非单于深感受辱，几可付诸一笑。此公开行贿之策，以维系匈奴传统价值为名行笼络之实，令单于勃然大怒，旋又自抑，与近臣商讨万全之策。我等可倾国库以维忠顺，亦可彻断此公开行贿，虽冒更大动荡之险。"
 me_xiongnu_3_2203_title:0 "临界点"
 me_xiongnu_3_22_desc:0 "时候已到——昔卑而今雄霸天下之匈奴之民，当世之至强战士，当与文明优越之华夏合为一体矣。此前狄人如中山亦曾试图化入中原之道，然彼时彼等相对于华夏之地位，不及我今日之优越。决不可令联盟中阻挠之部落显贵沮我大志。使我匈汉合一，震动乾坤——使单于与天子之号归一，注定君临万物，如神王临世。"
 me_xiongnu_3_22_title:0 "$xiongnu_missions_3_task_22$"
 me_xiongnu_3_23.a:0 "勿炫我帝国之威，保持谦逊。"
 me_xiongnu_3_23.b:0 "采用皇帝尊号，更易御玺。"
 me_xiongnu_3_23_desc:0 "社会各层——自贵胄衣冠，至朝廷兴作之工程，纳华夏谋臣之建言，耽玩新出之哲理，用彼等之文字——匈奴统治者已尽取中国生活之道。昔日旷野艰辛生涯已不复见，部民常居京城，享文明之安适，复携文明之财富奢华归于部落，分诸部众。然此非无代价，众多保守部族显贵抗拒我开化之图，唯凭金银荣耀之许诺方被说服。然今，我等终成真正中国之帝国，单于已是无可争辩之天子矣。"
 me_xiongnu_3_23_title:0 "$xiongnu_missions_3_task_23$"
 me_xiongnu_3_24.a:0 "北藏已归我所有！"
 me_xiongnu_3_24_desc:0 "这是一场如闪电般穿越诺木洪人干旱高原之战役。此等部落之民——多为避北方宜居草原无尽兵燹而遁入此偏远角落之难民——哀求我骑兵饶恕彼等贫瘠微薄之财物。彼等愚钝之心，不解此地扼守中国与西方通道之战略价值；吾主甚至不屑作答，径直踏平其营帐，尽取所欲奴仆而去。"
 me_xiongnu_3_24_title:0 "$xiongnu_missions_3_task_24$"
 me_xiongnu_3_25.a:0 "大梁将永为中黄河之文明支柱。"
 me_xiongnu_3_25.b:0 "至少得分与部众一部分此大城之战利品。"
 me_xiongnu_3_25.c:0 "大梁必须毁灭。"
 me_xiongnu_3_25_desc:0 "大单于，河中地区之抵抗今已彻底粉碎！三晋之记忆今已全然抹去，其坚城巨邑如诸国先前者尽陷于我大军。据称固若金汤之大梁——当世至大至精之城——亦无以抵御我匈奴骑射合中国攻城之术之联击。唯余一事，即如何待我新附之民，大单于。"
 me_xiongnu_3_25_title:0 "$xiongnu_missions_3_task_25$"
 me_xiongnu_3_26.a:0 "立即用作我方河港。"
 me_xiongnu_3_26.b:0 "轻掠后仍可稍加利用。"
 me_xiongnu_3_26.c:0 "惩其民众之无礼。"
 me_xiongnu_3_26_desc:0 "中国三大河流——黄河、淮水与扬子江——今皆尽在我军团掌握之中矣，大单于！敌寇将无以藉中原漫长海岸与纵横水道获得援助，盖今我驱使中国船工水手巡行其间，往来贸易。淮河大港徐城，乃此区域贸易之枢纽，久逸我手而资敌。此座昔日常常插手之城的命运又将如何？"
 me_xiongnu_3_26_title:0 "$xiongnu_missions_3_task_26$"
 me_xiongnu_3_27.a:0 "吾等将比以往更为富有。"
 me_xiongnu_3_27_desc:0 "蚕桑之秘今已为我所用矣，吾主。我等已从华夏臣民处成功习得丝绸之艺，并纳彼等扩产此精美织品之策，必将以此丰我府库。使我商贾四向散出，携我精制品以易天下之金！"
 me_xiongnu_3_27_title:0 "$xiongnu_missions_3_task_27$"
 me_xiongnu_3_28.a:0 "为匈奴带来繁荣！"
 me_xiongnu_3_28_desc:0 "我匈奴对新兴丝路贸易之掌控，创造出征伐中原时难以置信之财富与繁荣。华西与河西走廊诸城藉帝国精良货品之输出，经济勃兴，财富日增；我族之新黄金时代已然开启。"
 me_xiongnu_3_28_title:0 "$xiongnu_missions_3_task_28$"
 me_xiongnu_3_2_desc:0 "赵国——百余年来草原北族之眼中钉——终不复存矣！彼等仿胡服、习骑射之举，不过苟延一时。虽曾力拒狄人与东胡之寇，且为战国逐鹿之要角，终究屈服于匈奴之威。赵人既习于新主，吾等当决其大邑邯郸之命运……"
 me_xiongnu_3_2_title:0 "$xiongnu_missions_3_task_2$"
 me_xiongnu_3_3.a:0 "郑地将保持完好。"
 me_xiongnu_3_3.b:0 "只取最珍贵的物品…"
 me_xiongnu_3_3.c:0 "让韩人悔不该生于此世。"
 me_xiongnu_3_3_desc:0 "三晋中最弱之韩，全然不敌我匈奴浩荡之众。其庸将竟敢在旷野中挑战单于，步卒遂葬身于滚滚铁蹄之山岳之下。唯余一事，即当以何道统御我新附之韩民，及从大城郑取利几何。"
 me_xiongnu_3_3_title:0 "$xiongnu_missions_3_task_3$"
 me_xiongnu_3_4.a:0 "此将成为我部众之堡垒。"
 me_xiongnu_3_4.b:0 "运走一切值钱之物，但保留原貌。"
 me_xiongnu_3_4.c:0 "夷平城市，屠尽居民。"
 me_xiongnu_3_4_desc:0 "楚国扬子江以北昔日所据之诸多土地，今已入我版图矣，大单于。数座人烟稠密之城及其中巨量财富，今皆悬于我部民一念之间。尤其宛城，地处秦、楚与周天子领地之交汇通衢，具战略价值。此城之命运将如何？"
 me_xiongnu_3_4_title:0 "$xiongnu_missions_3_task_4$"
 me_xiongnu_3_5.a:0 "柴桑将为我新设之地方权力中心。"
 me_xiongnu_3_5.b:0 "部众理当纵情一番…"
 me_xiongnu_3_5.c:0 "摧毁柴桑，奴役居民。"
 me_xiongnu_3_5_desc:0 "楚之广土，连同扬子江以南辽阔丛林，今已尽入匈奴掌控矣，我大单于！湿热林地之瘴疠令骑兵损折甚重，然扬子江重港柴桑之价，足偿此牺牲——城中珍宝为迄今所见之冠。吾族之血未白流，匈奴今强于既往。此扬子江畔辉煌之城又将如何？"
 me_xiongnu_3_5_title:0 "$xiongnu_missions_3_task_5$"
 me_xiongnu_3_6.a:0 "阜阳将为我新北港。"
 me_xiongnu_3_6.b:0 "给部众一两天劫掠之欢。"
 me_xiongnu_3_6.c:0 "不需港口，劫城并奴役所有人。"
 me_xiongnu_3_6_desc:0 "传说中黄河之口今已紧握我手，敌自中国北方漫长海岸来援之威胁几近消弭。此外，此地沃野千里，宜谷宜稻，足供我日益壮大之军团所需。大港阜阳亦有潜力为我帝国海上堡垒，若我欲为之……"
 me_xiongnu_3_6_title:0 "$xiongnu_missions_3_task_6$"
 me_xiongnu_3_7.a:0 "临淄将为我日增帝国之新冠上明珠。"
 me_xiongnu_3_7.b:0 "取中之道——令将士饱掠而保全城市。"
 me_xiongnu_3_7.c:0 "临淄之记忆将从史册抹除，珍宝散与诸部。"
 me_xiongnu_3_7_desc:0 "齐国——战国中至强至众者之一——其腹地已丧于我草原大军。大邑临淄，或为天下已知世界之至奇观，尤以稷下学宫与王宫令我大单于叹为观止。单于心中同时浮现此文明重镇之两种景象：一则为在其治下延续辉煌，一则为匈奴诸部庆贺之彻底毁灭。吾当取何道？"
 me_xiongnu_3_7_title:0 "$xiongnu_missions_3_task_7$"
 me_xiongnu_3_8.a:0 "圣城睢阳将完好无损。"
 me_xiongnu_3_8.b:0 "难以抗拒劫掠之诱惑。"
 me_xiongnu_3_8.c:0 "抹除睢阳之史，焚毁此城。"
 me_xiongnu_3_8_desc:0 "孔子之地今为单于之域矣！宋国坚城虽予我军些许损伤，然我以浩荡军旅合中国攻城匠师，轻易克其林立之堡垒。宋地诸城藏有无数文物、数百金宝及数万中国新臣民。孔子之土与其古老巨邑睢阳，其命运将如何？"
 me_xiongnu_3_8_title:0 "$xiongnu_missions_3_task_8$"
 me_xiongnu_3_9.a:0 "吾等将开发并用作南方据点。"
 me_xiongnu_3_9.b:0 "将所有珍宝运回都城。"
 me_xiongnu_3_9.c:0 "夷平此污秽之城，奴役蛮夷。"
 me_xiongnu_3_9_desc:0 "吴越之神秘沃土于华夏人或为虚幻，于我匈奴骑兵则不然。其地炎热潮湿，蚊虫蛮族横行。然此地出产诸多价值之货，包括异兽、丝绸及无垠稻田。此区亦有蛮人大城吴，富产丝绸。此新城当何以处之，单于？"
 me_xiongnu_3_9_title:0 "$xiongnu_missions_3_task_9$"
 upset_xiongnu_chars:0 "不满的传统匈奴人"
 xiongnu_chewed:0 "吞并楚国"
 xiongnu_chinese:0 "汉-匈奴"
 xiongnu_chinese_capital:0 "新匈奴都城"
 xiongnu_enslaved_chinese:0 "被奴役的华夏人"
 xiongnu_heavenly_horses:0 "天马"
 xiongnu_hun_storm:0 "匈奴风暴"
 xiongnu_missions_3:0 "华夏之匈奴"
 xiongnu_missions_3_BUTTON_TOOLTIP:0 "我们将成为全中国的主人！"
 xiongnu_missions_3_CRITERIA_DESCRIPTION:0 "当中国完全处于匈奴帝国的控制之下时，此任务将完成。"
 xiongnu_missions_3_DESCRIPTION:0 "伟大的匈奴帝国，在历史上并未征服中国并加以统治。事实上，冒顿的继承者们满足于和亲联姻制度，中国人每年会向匈奴送来女子、丝绸、稻米、酒、珍奇物品、金银，以换取匈奴仅对其边境进行轻微劫掠。但如果单于们并不满足于仅仅掠夺，就像他们未来的后继者——蒙古的忽必烈汗那样呢？如果他们直接统治整个中国乃至更多地方，会发生什么？"
 xiongnu_missions_3_mery_or_not:0 "我们将能够选择仁慈对待或劫掠华夏。"
 xiongnu_missions_3_task_1:0 "赵之臣民"
 xiongnu_missions_3_task_10:0 "喔，越"
 xiongnu_missions_3_task_10_DESC:0 "百越部落，长期以来是中国文明的祸患，如今随着我们的征服而成为我们继承的问题。热带的疾病、奇异的动物，以及丛林战士涂满彩绘的身躯，都让我们的骑兵感到恐惧，而中国步兵也同样畏缩不前。我们必须打破围绕这些蛮族的神秘感，将他们碾入尘土。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 xiongnu_missions_3_task_10_claims:0 "我们将获得对都提空山和麒麟地区的宣称。"
 xiongnu_missions_3_task_11:0 "巩固西北中国"
 xiongnu_missions_3_task_11_DESC:0 "秦国是我们在中国最后的强敌，必须加以围困。控制其核心地带周围的土地将确保我们在黄河地区没有对手，并为我们提供一个进攻其首都的跳板。\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 xiongnu_missions_3_task_11_claims:0 "我们将获得陇西、天水、咸阳、长安、栎阳、金城、安多和诺木洪等地区的宣称权。"
 xiongnu_missions_3_task_12:0 "扑灭秦国"
 xiongnu_missions_3_task_12_DESC:0 "战国时代的终结即将到来——伴随着铁蹄踏破秦国都城咸阳、摧毁长安宫殿的声响。在秦被彻底消灭之后，单于将让整个中华民族在他骁勇的战马前俯首称臣。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 xiongnu_missions_3_task_12_claims:0 "我们将获得对武都、广汉、蜀、犍为和巴地区的宣称。"
 xiongnu_missions_3_task_13:0 "席卷四川盆地"
 xiongnu_missions_3_task_13_DESC:0 "四川盆地盛产珍禽异兽、茶叶以及单于垂涎的其他物产。这块盆地必须属于伟大的单于，如果不能和平取得，那就以武力夺取。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 xiongnu_missions_3_task_13_claims:0 "我们将获得对武陵、南、汉中和弘农地区的宣称。"
 xiongnu_missions_3_task_14:0 "三峡"
 xiongnu_missions_3_task_14_DESC:0 "长江上游的多山地带是一片艰险之地。巴、蜀、戎以及其他各种部落实体长期以来从这些地方给中国人制造麻烦，即使在秦、楚等国征服之后，这里仍然是叛乱的堡垒。然而，这些地区具有重要的战略意义——河流是进行贸易和沿长江全线发动袭击的高速通道，对于确立对四川盆地的绝对统治至关重要。让我们粉碎这些地区残存的一切反抗，永久巩固我们在黄河上游和长江上游的地位。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil11!"
 xiongnu_missions_3_task_14_claims:0 "我们将获得对零陵、桂阳、南海和苍梧地区的宣称。"
 xiongnu_missions_3_task_15:0 "南岭"
 xiongnu_missions_3_task_15_DESC:0 "南方森林和丘陵的深处给我们带来了与之前楚人所面临的同样多的麻烦——各部落不断骚扰我们的巡逻队，疾病肆虐，地形对我们的骑兵十分不利。然而这些土地也蕴含着巨大的机遇……长着巨牙的野兽在丛林中漫步，这些生物群落中还能找到其他珍禽异兽，丝绸、稻米和金属储量丰富。单于极度渴望控制这些南方土地，因此我们必须清除一切部落反抗，取得全面控制。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 xiongnu_missions_3_task_16:0 "费尔干纳谷地"
 xiongnu_missions_3_task_16_DESC:0 "费尔干纳谷地聚居着希腊人、粟特人、塞种人等各种民族，据说拥有最优良的马匹。事实上，根据我们的侦察兵和商人的报告，这似乎确有其事；\"天马\"是当世已知的最优良的骏马之一。作为最伟大的骑手民族，匈奴不能将这种马匹品种收入厩中是不可原谅的。我们必须出击，以单于之名夺取这些土地。\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 xiongnu_missions_3_task_16_claims:0 "我们将获得粟特地区的宣称。"
 xiongnu_missions_3_task_17:0 "天马"
 xiongnu_missions_3_task_17_DESC:0 "费尔干纳盆地的天马一直是我们西征的首要目标，因为维持最优质的马匹对帝国具有极高的战略价值。让我们为伟大的单于而扩大这些牲畜的繁育和出口。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 xiongnu_missions_3_task_18:0 "周室之篝火"
 xiongnu_missions_3_task_18_DESC:0 "成周古城——中原之古都，将成为匈奴最宏伟的战利品。数百年来，周天子的合法性寄托于这座传奇城市的宫殿之中，积聚了难以估量的财富，收藏着其人民的圣物。通过征服和洗劫这座城市，我们伟大的单于将消灭中国的政治体系，摧垮其余战国士气，为我们部民夺取周朝的巨大宝藏，并彰显我们对整个中国的绝对统治。\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 xiongnu_missions_3_task_18_sacking_conqueror_effect_tooltip:0 "成周将化为灰烬！"
 xiongnu_missions_3_task_19:0 "奴役华夏人"
 xiongnu_missions_3_task_19_DESC:0 "新征服的中国人口必须安分守己。他们文化和政治占主导的时代已经结束，他们的人民现在只能作为伟大单于的奴隶。让我们在律法中铭刻他们的\"权利\"，将曾经强大的中原变为永久的奴隶阶层。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 xiongnu_missions_3_task_19_three_enslaved_chinese:0 "我们至少有三个华夏文化拥有奴隶人口权利。"
 xiongnu_missions_3_task_1_DESC:0 "赵国长期以来一直推行模仿我们作战和服饰风格的政策，试图抵御我们的进攻，与先前的燕国如出一辙。我们必须从这里开始入侵，对抗我们最强大的对手之一，以消除中国战略家抵消我们骑兵战术优势的任何可能。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 xiongnu_missions_3_task_1_claims:0 "我们将获得对太原、恒山、巨鹿、邯郸和西河地区的宣称。"
 xiongnu_missions_3_task_2:0 "摧毁赵国"
 xiongnu_missions_3_task_20:0 "追寻自由"
 xiongnu_missions_3_task_20_DESC:0 "我们将继续沿袭头曼和冒顿等先祖开创的道路——我们摒弃定居文明的浮华，以征服和掠夺天下城居之民为生。我们将永远在马背上追寻荣耀，决不像我们华夏奴隶那样堕入定居生活的安逸之中。\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 xiongnu_missions_3_task_20_claims_persia:0 "我们将获得对巴克特里亚、阿里亚纳、帕提亚和波斯地区的宣称。"
 xiongnu_missions_3_task_20_claims_steppe:0 "我们将获得萨基亚、斯基泰-西伯利亚、中亚草原、亚细亚萨耳马提亚、陶里卡和萨喀等地区的宣称权。"
 xiongnu_missions_3_task_21:0 "大城蓟"
 xiongnu_missions_3_task_21_DESC:0 "蓟城地处我们戈壁以北广阔草原故土与如今大部分由我们帝国控制的伟大华夏文明之间的绝佳位置。我们应在这座伟大的城市设立南方都城，将草原文明与中国城市文明融为一体。\n\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 xiongnu_missions_3_task_22:0 "华夏化"
 xiongnu_missions_3_task_22_DESC:0 "匈奴族群已经变成了少数，不仅在草原部落民众中如此，如今在我们征服的广大中国人中更是如此。如果我们还有任何希望维持对中国的控制，就必须同化他们的人民，接受中国的方式，采纳更多他们的文化习俗。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 xiongnu_missions_3_task_22_three_integrated_chinese:0 "我们至少整合了三个华夏文化。"
 xiongnu_missions_3_task_22_upset_tribes:0 "我们可能惹怒我们的人民。"
 xiongnu_missions_3_task_23:0 "匈奴王朝"
 xiongnu_missions_3_task_23_DESC:0 "我们对一个数量远超过我们自身、拥有数千年悠久文化的民族的征服，导致我们的人民缓慢地被汉化。而中原的民众也在慢慢习惯被外来统治者统治，但他们的心中，尤其是受过教育的精英阶层，仍存有疑虑。我们，伟大的单于，是否应该全面接受#E 天子#!的称号，以彻底合法化我们对中国的统治，并全面采纳他们成熟的官僚体系，以便更好地治理我们庞大而多民族的帝国？\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 xiongnu_missions_3_task_24:0 "旁道"
 xiongnu_missions_3_task_24_DESC:0 "虽然北方的#E 河西走廊#!是从#E 中国#!前往#E 塔里木盆地#!的主要通道，但还有另一条更为艰险的南方路线，从#E 吐火罗#!地区的南端向东穿过#E 西藏#!北部。这条走廊居住着被称为#E 诺木洪#!的#E 戎#!部落民族，如果我们的敌人利用它来获取军事或经济利益，将对[ROOT.GetCountry.GetName]构成战略上的隐患。让我们确保这条通道的安全，确保我们控制所有从#E 中国#!出发的路线。\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 xiongnu_missions_3_task_25:0 "魏之覆亡"
 xiongnu_missions_3_task_25_DESC:0 "三晋中的最后一个——魏国，坐落在黄河的心脏地带。我们必须出击，夺取大梁的丰厚战利品，将中原的心脏挖出来。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 xiongnu_missions_3_task_25_claims:0 "我们将获得对江夏、庐江和汝南地区的宣称。"
 xiongnu_missions_3_task_26:0 "大河之口"
 xiongnu_missions_3_task_26_DESC:0 "中国另外两条大河——淮河和长江——的入海口必须置于刀锋之下，如果我们希望阻止援助从这条海岸线沿河北上流向中国叛乱者的话。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 xiongnu_missions_3_task_26_claims:0 "我们将获得对吴、丹阳和盐城地区的宣称。"
 xiongnu_missions_3_task_27:0 "经营丝场"
 xiongnu_missions_3_task_27_DESC:0 "丝绸制造的秘密如今已掌握在我们手中，作为全中国的主人。让我们利用这一知识，加大丝绸生产，充实帝国国库。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 xiongnu_missions_3_task_28:0 "掌控丝绸之路"
 xiongnu_missions_3_task_28_DESC:0 "控制中国和丝绸之路将为我们民族带来千年的繁荣。来自世界各地的商人将涌向我们的都城，寻求我们国家源源不断的财富，希望能将其中哪怕一小部分带回故乡。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 xiongnu_missions_3_task_2_DESC:0 "我们不能满足于仅仅削弱赵国——他们的国家必须作为一个政治实体不复存在，我们才能获得黄河沿岸富庶之地的统治权。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 xiongnu_missions_3_task_2_claims:0 "我们将获得河东、上党、河南、颖川、河内、魏、大梁、济阴和东等地区的宣称权。"
 xiongnu_missions_3_task_3:0 "吞并韩国"
 xiongnu_missions_3_task_3_DESC:0 "三晋中的第二个——韩国——长期以来一直是战国中的弱者。他们疆域狭小而脆弱，还未曾目睹过匈奴百族铁蹄兵临城下的景象。让我们向韩国展示我们的武力，在其他列强夺取之前掠夺他们富庶的城市。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 xiongnu_missions_3_task_3_claims:0 "我们将获得对邓、南阳和宜城地区的宣称。"
 xiongnu_missions_3_task_4:0 "粉碎楚国"
 xiongnu_missions_3_task_4_DESC:0 "楚国尽管控制着从肥沃平原延伸到南方热带丛林的广袤领土，但早已在走下坡路。我们应该猛扑向楚国，吞并他们的广阔领土，以免秦或齐抢先一步。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 xiongnu_missions_3_task_4_claims:0 "我们将获得对长沙、豫章、庐陵和常德地区的宣称。"
 xiongnu_missions_3_task_5:0 "咀嚼楚国"
 xiongnu_missions_3_task_5_DESC:0 "是时候最终终结虚弱不堪的楚国的存在了——他们有幸生活在伟大单于的轭下，单于将更好地治理他们的土地。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 xiongnu_missions_3_task_6:0 "黄河之口"
 xiongnu_missions_3_task_6_DESC:0 "黄河入海口既拥有富庶的城市，又具有至关重要的军事价值，可以阻止敌人利用海军港口肆意袭击我们的海岸。特别是，临淄地区让伟大的单于垂涎欲滴，据说那里拥有难以计量的财富以及密集的潜在奴隶人口。让我们策马出征，主宰那条大河之口！\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 xiongnu_missions_3_task_6_claims:0 "我们将获得对千乘、临淄、北海、东莱、泰山和琅琊地区的宣称。"
 xiongnu_missions_3_task_7:0 "制衡齐国"
 xiongnu_missions_3_task_7_DESC:0 "齐国数百年来一直是中原最强大的国家之一。他们的谋士足智多谋，他们的工匠天下无双，他们的都城临淄在辉煌、学识和财富方面无与伦比。所有这些，都是我们伟大单于想要据为己有的……\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 xiongnu_missions_3_task_7_claims:0 "我们将获得山阳、彭、淮阳、沛、东海、临淮、广陵和九江等地区的宣称权。"
 xiongnu_missions_3_task_8:0 "终曲"
 xiongnu_missions_3_task_8_DESC:0 "孔夫子的故土拥有数座富庶的城市，是现代哲学思想的堡垒。我们的单于对这些新发现的哲学思想、它们的起源以及孕育它们的人民充满好奇。对宋国的君主们而言不幸的是，这意味着他们的土地现在将属于匈奴。\n\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 xiongnu_missions_3_task_9:0 "名扬于吴"
 xiongnu_missions_3_task_9_DESC:0 "根据我们朝廷现在雇佣的中国史官所述，从最近获得的中国典籍中得知，吴国故地是一个在上个世纪被击败的强大国家，它因有史以来最美丽的女子——西施——而亡国。她的美貌迷惑了吴王，正如这个故事迷惑了我们的单于。我们必须出征吴国故地，探寻当地的传说以取悦单于；对此使命的任何抵抗都将不会被容忍。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 xiongnu_missions_3_task_9_claims:0 "我们将获得对会稽、临海、建安和武夷地区的宣称。"
 xiongnu_ships_southern_china:0 "席卷海疆"
 xiongnu_silk_road:0 "已建丝绸之路"
 xiongnu_spared_linzi:0 "保全稷下学宫"
 xiongnu_wu:0 "修习兵法"

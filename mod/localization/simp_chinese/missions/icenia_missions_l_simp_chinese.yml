l_simp_chinese:
 cenimagni_end_mod:0 "塞尼马尼"
 desc_cenimagni_end_mod:0 "在我们的岛屿乃至海外，我们作为普里塔尼亚主人的声誉先行。"
 desc_icenia_a_firm_grip_mod:0 "现在我们已驯服邻近省份，将其纳入伊刻尼亚阵营，我们在目标与方向上统一。"
 desc_icenia_center_of_trade_mod:0 "我们的市场以卓越的商品闻名，吸引了许多热切的商人来到我们的土地。"
 desc_icenia_chariot_recruiters:0 "我们的战车手行动迅猛，从天而降，将敌军碾为尘土。"
 desc_icenia_toll_house_mod:0 "我们在首都建造了一座建筑物，向路上的商人收取通行费。"
 desc_icenian_agriculture:0 "该地区的农场肥沃，为许多饥饿的肚子提供食物。"
 desc_icenian_allies_mod:0 "我们的伊刻尼亚征召兵前所未有地奋战，受到背后可靠盟友的鼓舞。"
 desc_icenian_belgae_trading_partners:0 "我们的商船定期穿越日耳曼海，抵达大陆海岸的港口与市场。"
 desc_icenian_cities_end_modifier:0 "我们发现，在新领地建造城市是确保忠诚的最佳方式。"
 desc_icenian_food_stores:0 "我们扩展了核心地区的农场以养活日益增长的国家，并在首都储存我们的丰收。"
 desc_icenian_foundry_mod:0 "我们在首都建造了一座大型铸造厂，以生产更多有价值的商品。"
 desc_icenian_horse_trainers_mod:0 "全国奴隶庄园饲养的马匹由专家训练。"
 desc_icenian_la_tene_workshops_mod:0 "在我们的首都，我们有意建造专注于生产高质量拉坦风格艺术品的工坊。"
 desc_icenian_metalworking_master_mod:0 "我们的铁匠因其工坊中制作的精湛作品而闻名。"
 desc_icenian_united_research_mod:0 "全国最优秀、最聪明的头脑已迁往首都。"
 desc_iron_mines_of_durovigutum_mod:0 "尽管该地区的铁矿石位于沼泽中，我们仍在此建立了令人印象深刻的矿山。"
 desc_pictish_raiders_mod:0 "我们可怕的掠夺者肆意劫掠敌人的土地。"
 desc_the_battle_for_the_south_mod:0 "我们勇敢的征召兵已为即将到来的辉煌战斗做好准备！"
 icenia_a_firm_grip_mod:0 "统一的人民"
 icenia_center_of_trade_mod:0 "繁荣的市场"
 icenia_chariot_recruiters:0 "毁灭战车"
 icenia_la_tene_shield:0 "拉坦仪式盾"
 icenia_la_tene_shield_desc:0 "由伊刻尼工坊制作，这面青铜盾饰有精致的旋涡、冲锋的野猪和风格化的马匹。"
 icenia_mission_tree:0 "塞尼马尼的崛起"
 icenia_mission_tree_BUTTON_TOOLTIP:0 "我们注定成就伟业……"
 icenia_mission_tree_CRITERIA_DESCRIPTION:0 "当伊刻尼亚统一#E 普里塔尼亚#!，建立起经济繁荣的国家时，此使命完成。"
 icenia_mission_tree_DESCRIPTION:0 "在世界西北边缘阴郁岛屿居住的众多部落之一，#E 伊刻尼人#!居住在#E 不列颠#!东部的沼泽与平原，统治着沿海附近的平原。他们的首都#E 伊刻尼亚的文塔#!位于领土中心，俯瞰东部低地与附近的沼泽。据说他们擅长缔约，热爱马匹与金钱，对外来者友好，但别被他们的微笑欺骗——低估他们将自招祸患。"
 icenia_mission_tree_task_1:0 "背后的盟友"
 icenia_mission_tree_task_10:0 "拥抱拉坦艺术"
 icenia_mission_tree_task_10_DESC:0 "在[ROOT.GetCountry.GetCapital.GetName]的工坊中，带有旋涡图案和精美复杂设计的#E拉坦#!风格正复兴，但我们在生产精美器物方面还有更多可为。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 icenia_mission_tree_task_11:0 "熟练的铁匠"
 icenia_mission_tree_task_11_DESC:0 "我们的铁匠是整个#E不列颠#!中最熟练的，精通为任何目的加工金属——无论是黄金项圈还是铁剑，[ROOT.GetCountry.GetName]的锻炉随时待命。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 icenia_mission_tree_task_12:0 "木制道路"
 icenia_mission_tree_task_12_DESC:0 "在[ROOT.GetCountry.GetCapital.GetName]提议，我们应建造一条连接北部港口[GetProvince('(int32)2031').GetName]与#E 伊刻尼亚#!其余地区的道路——这将极大简化贸易。由于木材唾手可得，我们将用其建造。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 icenia_mission_tree_task_13:0 "牢牢掌控敌人"
 icenia_mission_tree_task_13_DESC:0 "尽管新征服的邻居会怨恨我们在他们传统土地上的存在，我们不能让这一不幸事实阻止我们巩固对该地区的控制。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 icenia_mission_tree_task_14:0 "沼泽中的铁"
 icenia_mission_tree_task_14_DESC:0 "[GetProvince('(int32)2052').GetName]的沼泽藏有一个秘密——该地区有可开采的铁。尽管在沼泽地建矿困难，我们别无选择，只能前进。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 icenia_mission_tree_task_15:0 "迎接西部"
 icenia_mission_tree_task_15_DESC:0 "一旦我们真正平定#E不列颠#!西部地区，我们将能从被征服的土地和人民中榨取财富。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 icenia_mission_tree_task_16:0 "金属加工大师"
 icenia_mission_tree_task_16_DESC:0 "随着我们在金属加工和铁匠技艺的专长增长，之前无法企及的机会已成为必然。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 icenia_mission_tree_task_1_DESC:0 "我们与许多可怕的部落共享陆地边界，有理由相信其中一些部落可在未来战争中成为可靠盟友——我们应考验这些友谊。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 icenia_mission_tree_task_1_tt:0 "#Y[SCOPE.GetRootScope.GetCountry.GetName]#!至少与#Y 1个拥有#T岛屿凯尔特#!文化的国家#!结盟。"
 icenia_mission_tree_task_2:0 "毁灭战车"
 icenia_mission_tree_task_21:0 "请求德鲁伊"
 icenia_mission_tree_task_21_DESC:0 "位于[GetProvince('(int32)2012').GetName]的神秘奇迹#E巨石阵#!最近归入[ROOT.GetCountry.GetAdjective]所有。我们可派使者前往#E高卢#!，请求大陆的德鲁伊在此圣地定居。\n\n#Y这将开启一个事件链#!。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 icenia_mission_tree_task_22:0 "苏利斯神殿"
 icenia_mission_tree_task_22_DESC:0 "[GetProvince('(int32)2009').GetName]的治愈之水吸引了来自#E不列颠#!各地的朝圣者，据说连#E高卢#!的信徒也远渡重洋向当地女神致敬。现在是时候为#E苏利斯#!建造一座合适的神殿，让她的祝福惠及[ROOT.GetCountry.GetName]全体。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 icenia_mission_tree_task_23:0 "伊刻尼亚城市"
 icenia_mission_tree_task_23_DESC:0 "随着我们将势力扩展到边境之外，我们感到有责任尽全力发展我们领地的基础设施——我们必须将[ROOT.GetCountry.GetAdjective]文化传播给新部落民。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 icenia_mission_tree_task_23_tt:0 "我国拥有的至少#Y 10#!块领土具有城市地位。"
 icenia_mission_tree_task_24:0 "心脏地粮仓"
 icenia_mission_tree_task_24_DESC:0 "现在我们已扩展领土，我们应考虑投资于生产粮食的省份，以免歉收季节给人民带来无数苦难。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 icenia_mission_tree_task_2_DESC:0 "我们的社会长期使用战车，我们的骑士在战场上的景象常令敌人惊慌失措——派出#E毁灭战车#!\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 icenia_mission_tree_task_3:0 "真实意图"
 icenia_mission_tree_task_3_DESC:0 "南方的#E 特里诺万忒斯人#!开始在我们的#E 伊刻尼#!省建造定居点——[ROOT.GetCountry.GetRuler.GetName]不会容忍此罪行未受惩罚。让我们先羞辱他们，再让他们屈服！\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 icenia_mission_tree_task_4:0 "与比利其交易"
 icenia_mission_tree_task_4_DESC:0 "众所周知，我们的统治阶层与大陆上好战的#E 比利其#!部落有着远亲渊源——或许我们可以重新激活这份血脉联系，以促进整个[ROOT.GetCountry.GetName]的贸易繁荣。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 icenia_mission_tree_task_5:0 "边境之战"
 icenia_mission_tree_task_5_DESC:0 "现在我们已准备好进行长期征服战争，我们必须全力投入即将到来的战斗——懦夫与胆怯者永无胜算！\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 icenia_mission_tree_task_6:0 "西进"
 icenia_mission_tree_task_6_DESC:0 "中部#E多布尼亚#!省将是全面入侵西部的完美起点——若我们希望征服整个#E不列颠#!，我们的道路直通[GetProvince('(int32)2039').GetName]。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 icenia_mission_tree_task_7:0 "伊刻尼亚马场"
 icenia_mission_tree_task_7_DESC:0 "据说[ROOT.GetCountry.GetAdjective]人只有两种热爱：金钱与马匹。然而，我们为我们饲养的动物感到骄傲，确保我们的战马接受严格训练。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 icenia_mission_tree_task_7_tt:0 "在 [GetProvince('(int32)2044').GetArea.GetName|Y] 与 [GetProvince('(int32)2068').GetArea.GetName|Y] 地区中，至少各有 #Y 3#! 块产出 #Y 马匹#! @horses! 的领土建有 #Y 奴隶庄园#! 建筑。"
 icenia_mission_tree_task_8:0 "伟大的伊刻尼"
 icenia_mission_tree_task_8_DESC:0 "尽管不满的低语在国内传扬，我们决不会放弃统一#T 普里塔尼亚#!，因为我们是伟大的伊刻尼，注定统治这片岛屿。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 icenia_mission_tree_task_9:0 "贸易与行政"
 icenia_mission_tree_task_9_DESC:0 "尽管我们的首都[ROOT.GetCountry.GetCapital.GetName]潜力无限，但目前仍有不足——我们必须开始将权力中心转变为贸易与行政中心。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 icenia_send_insult_tt:0 "我们必须向#E 特里诺万提亚#!#Y 发送侮辱#!。"
 icenia_toll_house_mod:0 "收费站"
 icenian_agriculture:0 "肥沃的农场"
 icenian_allies_mod:0 "战斗中的朋友"
 icenian_belgae_trading_partners:0 "比利其贸易联系"
 icenian_cities_end_modifier:0 "伊刻尼亚城市"
 icenian_food_stores:0 "伊刻尼亚粮食储备"
 icenian_foundry_mod:0 "伊刻尼亚铸造厂"
 icenian_horse_trainers_mod:0 "伊刻尼亚驯马师"
 icenian_la_tene_workshops_mod:0 "拉登工坊"
 icenian_metalworking_master_mod:0 "熟练的铁匠"
 icenian_united_research_mod:0 "不列颠学者"
 iron_mines_of_durovigutum_mod:0 "杜罗维古图姆铁矿"
 iron_weapons_icenia:0 "我们高产的伊刻尼亚矿山产出大量矿石，使我们能为士兵装备最精良的武器。"
 me_icenia_1.a:0 "今天有许多事要做——我该开始工作了"
 me_icenia_10.a:0 "这很好，非常好……多么壮观的生物"
 me_icenia_10_desc:0 "如同每个优秀的[ROOT.GetCountry.GetAdjective]部落民，[ROOT.GetCountry.GetRuler.GetName]是马匹的行家，能迅速评估一匹马的价值，[ROOT.GetCountry.GetRuler.GetHerHis]半生都在马背上度过。\n\n尽管[ROOT.GetCountry.GetRulerTitle]的日常行程充满需要亲自处理的事务，[ROOT.GetCountry.GetRuler.GetFirstName]决定抽出一个下午去视察工人最近建造的马场。\n\n进入马厩时，[ROOT.GetCountry.GetRuler.GetHerHis]脸上绽放出宽广的笑容，满意地点点头，看着奴隶小心地刷洗马匹。它们刚完成训练，满身汗水，饥饿地吞噬饲料。我们只给马匹喂食最优质的谷物，它们光亮的皮毛下肌肉结实，埋头于食槽。"
 me_icenia_10_title:0 "伊刻尼亚马场"
 me_icenia_10_tooltip:0 "$mission_completed_tooltip_1$“#Y 伊刻尼亚马场#!”$mission_completed_tooltip_2$"
 me_icenia_11.a:0 "若这是和平的代价，我将按你说的做"
 me_icenia_11.b:0 "我不会悄无声息地消失——即便这会毁了[ROOT.GetCountry.GetName]！"
 me_icenia_11_desc:0 "某晚，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]房间，悠闲地啜饮蜂蜜酒，凝视壁炉中的木柴噼啪作响时，门口传来怯懦的敲门声。来者是一名信使，由[SCOPE.sCharacter('civil_war_leader').GetName]派遣。\n\n‘请原谅，[ROOT.GetCountry.GetRuler.GetFirstName]，我奉命通知您，我的主人已集结支持，现宣称[ROOT.GetCountry.GetName]的领导权归[SCOPE.sCharacter('civil_war_leader').GetHerHis]所有。\n\n看到[ROOT.GetCountry.GetRuler.GetFirstName]脸上怒火升腾，信使颤抖着后退。‘若您拒绝放弃权力，我的主人及其众多支持者准备夺权……我很抱歉。除非您立即离开[ROOT.GetCountry.GetCapital.GetName]，否则他们今晚将进攻。’"
 me_icenia_11_title:0 "伟大的伊刻尼"
 me_icenia_11_tooltip:0 "$mission_completed_tooltip_1$“#Y 伟大的伊刻尼#!”$mission_completed_tooltip_2$"
 me_icenia_12.a:0 "金币叮当的声音真是美妙"
 me_icenia_12_desc:0 "现在[GetProvince('(int32)2032').GetName]的市场正式营业，且我们在首都地区进行了省级投资，这些变化的消息迅速传遍[ROOT.GetCountry.GetName]。\n\n每天，数百名旅人进入城门，有的带来纺织品和其他手工艺品交易，有的只是好奇想看看骚动与喧嚣——这一切对[ROOT.GetCountry.GetRuler.GetName]而言如音乐般动听。"
 me_icenia_12_title:0 "贸易与行政"
 me_icenia_12_tooltip:0 "$mission_completed_tooltip_1$“#Y 贸易与行政#!”$mission_completed_tooltip_2$"
 me_icenia_13.a:0 "旋涡与跃马——这就是我喜欢的艺术"
 me_icenia_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]一直迷恋我们人民熟悉的大陆古老风格，现在[ROOT.GetCountry.GetRuler.GetSheHe]有能力实现，命令[ROOT.GetCountry.GetCapital.GetName]附近致力于手工艺的工坊与小屋专注于以此方式制作艺术品。\n\n由于这一努力，我们的市场充满品质卓越的物品，因其细致入微的关注与精湛工艺在国内外备受赞誉。"
 me_icenia_13_title:0 "拉登工坊"
 me_icenia_13_tooltip:0 "$mission_completed_tooltip_1$“#Y 拉登工坊#!”$mission_completed_tooltip_2$"
 me_icenia_14.a:0 "我们急需这些铁"
 me_icenia_14_desc:0 "得益于我们对铁的便捷获取，我们的铁匠技艺日益精湛，生产的武器与项圈成为品质标准。\n\n在[ROOT.GetCountry.GetCapital.GetName]，金属加工的景象与气味已有些扰民，但[ROOT.GetCountry.GetRuler.GetName]拒绝采取任何措施，称拥有[ROOT.GetCountry.GetName]全境最佳铁匠在首都的益处值得忍受这气味。"
 me_icenia_14_title:0 "熟练的铁匠"
 me_icenia_14_tooltip:0 "$mission_completed_tooltip_1$“#Y 熟练的铁匠#!”$mission_completed_tooltip_2$"
 me_icenia_15.a:0 "不，一切保持现状就好"
 me_icenia_15.b:0 "花钱建造收费站"
 me_icenia_15_desc:0 "消息传到[ROOT.GetCountry.GetRuler.GetName]，[ROOT.GetCountry.GetRuler.GetSheHe]下令在#E 伊刻尼亚#!省核心地带建造的道路终于完工。\n\n巨大的橡木原木被小心沉入地面，构成基础，再铺设更多木材。这条木制高速公路令人印象深刻，宽到足以支持货车，连接[GetProvince('(int32)2031').GetName]的港口至[GetProvince('(int32)2028').GetName]郊外。\n\n我们的部落民已广泛使用这条路，选择此路径以避开湿地。有人提议我们利用这一新局面，在[GetProvince('(int32)2032').GetName]建造一座#E 收费站#!向旅人收税——我们该怎么做？"
 me_icenia_15_title:0 "木制道路"
 me_icenia_15_tooltip:0 "$mission_completed_tooltip_1$“#Y 木制道路#!”$mission_completed_tooltip_2$"
 me_icenia_16.a:0 "许多人会不满，但假以时日，他们将采纳我们优越的方式"
 me_icenia_16_desc:0 "我们的敌人奋勇抗争，值得称赞，但最终，[ROOT.GetCountry.GetAdjective]的猛攻对他们而言太过沉重，他们被迫从祖先埋葬的田野与森林撤退。\n\n现在，随着我们夺取越来越多邻居曾经居住的领土，我们开始向所有当地村庄派遣外交使节。这些使者负责解释我们在该地区的存在及我们未来的计划。\n\n我们已明确表示，我们打算永远留下。"
 me_icenia_16_title:0 "牢牢掌控敌人"
 me_icenia_16_tooltip:0 "$mission_completed_tooltip_1$“#Y 牢牢掌控敌人#!”$mission_completed_tooltip_2$"
 me_icenia_17.a:0 "我们必须去铁矿所在之地；这是神赐的礼物"
 me_icenia_17_desc:0 "尽管我们的许多同胞仅为狩猎进入沼泽，尽量避免核心领土周围的有害环境，除非绝对必要，[ROOT.GetCountry.GetRuler.GetName]决定在[GetProvince('(int32)2052').GetName]附近建矿。\n\n尽管从常因乡村沼泽性质而淹水的矿井中提取铁矿石将是艰难的工作，若[ROOT.GetCountry.GetName]的人民想要这宝贵的金属，别无选择。"
 me_icenia_17_title:0 "沼泽中的铁"
 me_icenia_17_tooltip:0 "$mission_completed_tooltip_1$“#Y 沼泽中的铁#!”$mission_completed_tooltip_2$"
 me_icenia_18.a:0 "一把上好的伊刻尼剑，让我欣悦胜过一切"
 me_icenia_18_desc:0 "问任何有价值的战士他想要怎样的军事装备，若他诚实（且有钱，因为[ROOT.GetCountry.GetAdjective]的金属制品昂贵），他会告诉你他最觊觎[ROOT.GetCountry.GetCapital.GetName]打造的武器。\n\n原因显而易见；我们的铁匠是工艺大师，将艺术优雅与无与伦比的耐用性与强度结合。现在我们土地上建了一座#E铸造厂#!，[ROOT.GetCountry.GetRuler.GetName]希望我们能用整个#E不列颠#!生产的最精美物品充满市场。"
 me_icenia_18_title:0 "金属加工大师"
 me_icenia_18_tooltip:0 "$mission_completed_tooltip_1$“#Y 金属加工大师#!”$mission_completed_tooltip_2$"
 me_icenia_19.a:0 "[ROOT.GetCountry.GetName]需要学者——他们将受到良好照顾"
 me_icenia_19_desc:0 "#E 杜姆诺尼亚#!、#E 得墨提亚#!和#E 奥陶维希亚#!行省距离[ROOT.GetCountry.GetCapital.GetName]相当遥远，然而我们已将这些边陲之地纳入囊中——这在一代人之前简直是不可想象的。\n\n[ROOT.GetCountry.GetRuler.GetName]汲取了先前军事行动的经验，迅速为[ROOT.GetCountry.GetName]巩固了这些领土。[ROOT.GetCountry.GetRuler.GetName]不仅收缴了当地部分国库储备，这位[ROOT.GetCountry.GetRulerTitle]更要求将当地的贤者与长老遣送至首都，以协助我们研究新技术。"
 me_icenia_19_title:0 "迎接西部"
 me_icenia_19_tooltip:0 "$mission_completed_tooltip_1$“#Y 迎接西部#!”$mission_completed_tooltip_2$"
 me_icenia_1_desc:0 "太阳刚刚升起，[ROOT.GetCountry.GetRuler.GetName]已醒来，饮着稀释的葡萄酒，凝视那挣扎着驱散[GetProvince('(int32)2032').GetName]上空厚重云层的苍白圆盘。片刻后，细雨开始，很快转为倾盆大雨，显而易见，这将是一个湿漉漉的日子。\n\n在[ROOT.GetCountry.GetName]有过许多这样的早晨，然而，今天有些不同……今天是一切改变的日子。\n\n从[ROOT.GetCountry.GetRuler.GetHerHis]简朴的座椅起身，[ROOT.GetCountry.GetRuler.GetFirstName]喝干高脚杯中的最后几滴，大声打了个嗝，走出[ROOT.GetCountry.GetRuler.GetHerHis]私人房间，低声喃喃。"
 me_icenia_1_title:0 "平凡的一天，如同往常"
 me_icenia_1_tooltip:0 "是时候创造历史了……"
 me_icenia_2.a:0 "我们将把你们碾成湮灭！"
 me_icenia_20.a:0 "我们有这样的才华是福分——让我请你喝一杯"
 me_icenia_20_desc:0 "来自[ROOT.GetCountry.GetCapital.GetName]的意外消息！一位以拉坦风格工作的顶级工匠、铁匠[SCOPE.sCharacter('humble_icenian_blacksmith').GetName]为[ROOT.GetCountry.GetRuler.GetName]打造了一面巨大的仪式盾，并将其捐赠给[ROOT.GetCountry.GetName]人民。\n\n当被问及[SCOPE.sCharacter('humble_icenian_blacksmith').GetSheHe]是否想要为此壮举获得奖励时，[SCOPE.sCharacter('humble_icenian_blacksmith').GetFirstName]拒绝了，说荣誉与荣耀仅归于[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_icenia_20_title:0 "工坊的礼物"
 me_icenia_20_tooltip:0 "$mission_completed_tooltip_1$“#Y 工坊的礼物#!”$mission_completed_tooltip_2$"
 me_icenia_21.a:0 "重要的是我们的部落民吃得饱"
 me_icenia_21_desc:0 "尽管#E 伊刻尼亚#!省的耕地不多，我们通过在吞并的领土上建造农场充分利用了我们的处境。\n\n现在我们在全国核心地带建成了农场，我们可在[ROOT.GetCountry.GetCapital.GetName]储存多余粮食，以便在需要时分发全国。"
 me_icenia_21_title:0 "心脏地粮仓"
 me_icenia_21_tooltip:0 "$mission_completed_tooltip_1$“#Y 心脏地粮仓#!”$mission_completed_tooltip_2$"
 me_icenia_2_desc:0 "当敌人察觉我们的战车加入战斗时，通常为时已晚。\n\n尽管他们愚蠢地试图逃跑，匆忙中丢弃武器以求保命，却如狗般被追逐屠戮——我们的骑士从不留情。\n\n毫不意外，我们的敌人畏惧我们[ROOT.GetCountry.GetAdjective]的‘#E毁灭战车#!’，因为他们认为我们轮式部队的出现预示着即将来临的死亡。"
 me_icenia_2_title:0 "毁灭战车"
 me_icenia_2_tooltip:0 "$mission_completed_tooltip_1$“#Y 毁灭战车#!”$mission_completed_tooltip_2$"
 me_icenia_3.a:0 "很好！伊刻尼亚理应属于我们"
 me_icenia_3_desc:0 "我们的外交官从[GetProvince('(int32)2028').GetName]返回，据说#E 特里诺万提人#!怒不可遏——在争议土地上准备宣称是一回事，但在使团旗帜下亲自送上恶毒侮辱完全是另一回事。\n\n我们的军事顾问报告，自那以后，特里诺万提的斥候一直在试探我们的边界，测试我们的军事准备……看来我们很快将面临一场战争。"
 me_icenia_3_title:0 "真实意图"
 me_icenia_3_tooltip:0 "$mission_completed_tooltip_1$“#Y 真实意图#!”$mission_completed_tooltip_2$"
 me_icenia_4.a:0 "我在这片土地的遗产将是我下令建造的众多城镇"
 me_icenia_4_desc:0 "[ROOT.GetCountry.GetRuler.GetName]始终相信，在[ROOT.GetCountry.GetName]全境建造城市是确保我们文化取代被征服者本地传统的最佳方式。\n\n从各方面看，[ROOT.GetCountry.GetRuler.GetFirstName]已成功；全国的定居点被拆除，石头与砖块的永久建筑取代了昔日的简陋茅屋。我们感恩的臣民现已心甘情愿接受我们加于他们颈上的温和枷锁。"
 me_icenia_4_title:0 "伊刻尼亚城市"
 me_icenia_4_tooltip:0 "$mission_completed_tooltip_1$“#Y 伊刻尼亚城市#!”$mission_completed_tooltip_2$"
 me_icenia_6.a:0 "我们的部落民需要正直的朋友保护他们的后方……"
 me_icenia_6_desc:0 "尽管[ROOT.GetCountry.GetAdjective]征召兵渴望战场上的荣耀，[ROOT.GetCountry.GetRuler.GetName]以[ROOT.GetCountry.GetRuler.GetHerHis]实用主义著称，寻求联盟以增强我们的兵力。\n\n将人力与战士视为[ROOT.GetCountry.GetRuler.GetHerHis]掌中最宝贵的资源之一，[ROOT.GetCountry.GetRulerTitle]努力在国内确保盟友，希望战争的惨重代价能在作战者间平等分担。"
 me_icenia_6_title:0 "背后的盟友"
 me_icenia_6_tooltip:0 "$mission_completed_tooltip_1$“#Y 背后的盟友#!”$mission_completed_tooltip_2$"
 me_icenia_7.a:0 "我们人民之间的货物交换只会让我们更亲近"
 me_icenia_7_desc:0 "若采信#E 部落长老#!口耳相传的轶闻，往昔确有一支#E 比利其#!贵族渡海而来，在此繁衍生息，相传正是我族先祖。\n\n尽管[ROOT.GetCountry.GetRuler.GetName]难以考证这飘渺的血脉联系，但[ROOT.GetCountry.GetRuler.GetSheHe]深谙传说之妙用，决意以此为由，与聚居在[GetProvince('(int32)3843').GetName]周边的比利其部落开启对话。\n\n那些剽悍的大陆战士听闻这段渊源颇觉玩味，竟同意与我们通商——[ROOT.GetCountry.GetRulerTitle]亲赴[GetProvince('(int32)2031').GetName]见证首支商船启航，可谓外交奇策。"
 me_icenia_7_title:0 "与比利其交易"
 me_icenia_7_tooltip:0 "$mission_completed_tooltip_1$“#Y 与比利其交易#!”$mission_completed_tooltip_2$"
 me_icenia_8.a:0 "让战争之神与我们同行，带我们走向胜利！"
 me_icenia_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName]站在四名战士举起的盾牌上，向在[GetProvince('(int32)2032').GetName]附近集结准备征战季节的[ROOT.GetCountry.GetAdjective]征召兵发表演讲。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]高声向天空举起长矛，发出响亮的战吼，紧接着被数千名尖叫的士兵回响。"
 me_icenia_8_title:0 "边境之战"
 me_icenia_8_tooltip:0 "$mission_completed_tooltip_1$“#Y 边境之战#!”$mission_completed_tooltip_2$"
 me_icenia_9.a:0 "这个回答够清楚了吗？"
 me_icenia_9_desc:0 "随着我们的[ROOT.GetCountry.GetAdjective]驻军开始占领新征服敌人的首都要塞，邻近部落在猜测我们的嗜血是否已满足——我们会停止好战吗？\n\n作为对这一紧迫问题的回答，[ROOT.GetCountry.GetRuler.GetName]拒绝了所有外国使团，拒绝提供款待或聆听他们精心准备的恳求。外交官们一个接一个返回各自国家，严肃地分享[ROOT.GetCountry.GetName]无法理喻、无人知晓我们下一步计划的消息。"
 me_icenia_9_title:0 "西进"
 me_icenia_9_tooltip:0 "$mission_completed_tooltip_1$“#Y 西进#!”$mission_completed_tooltip_2$"
 more_drinks:0 "与我们的统治者共饮葡萄酒"

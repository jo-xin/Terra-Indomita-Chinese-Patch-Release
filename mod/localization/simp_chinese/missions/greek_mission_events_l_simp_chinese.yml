l_simp_chinese:
 get_me_gre_3_5_brt:0 "布鲁提乌姆"
 get_me_gre_3_5_lca:0 "卢卡尼亚"
 get_me_gre_3_5_sam:0 "萨莫奈"
 gm_1_get_go_back_1:0 "还有其他选项……"
 gm_1_get_go_back_2:0 "再想想……"
 gm_1_likely:0 "他们#G 有可能#!接受。"
 gm_1_unlikely:0 "他们#R 不可能#!接受。"
 gre_mis_1_haven_3_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_3')|0]#!"
 gre_mis_1_haven_3_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_3')|0]#!"
 gre_mis_4_haven_3_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('gre_mis_4_haven_ongoing_3')|0]#!"
 gre_mis_4_haven_3_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('gre_mis_4_haven_ongoing_3')|0]#!"
 me_gre_task_start_tt_1:0 "[gm_1_greek_scope.GetRulerTitle][gm_1_greek_scope.GetRuler.GetPraenomen]将着手"
 me_gre_task_start_tt_2:0 "[gm_2_greek_scope.GetRulerTitle][gm_2_greek_scope.GetRuler.GetPraenomen]将着手"
 me_gre_task_start_tt_3:0 "[gm_3_greek_scope.GetRulerTitle][gm_3_greek_scope.GetRuler.GetPraenomen]将着手"
 me_gre_task_start_tt_4:0 "[gm_4_greek_scope.GetRulerTitle][gm_4_greek_scope.GetRuler.GetPraenomen]将着手"
 me_greek_1_black_sea.10.a:0 "我们会让他们进行自治。"
 me_greek_1_black_sea.10.at:0 "[gm_hellenic_reclamation_scope.GetName]会被释放为藩属。"
 me_greek_1_black_sea.10.b:0 "我们将其归功于[gm_family_head_1.GetPraenomen]。"
 me_greek_1_black_sea.10.desc:0 "收购了[gm_hellenic_reclamation_scope.GetName]之后，[gm_family_head_1.GetFamilyDisplayAdjective]家族冒出尖来，努力升值其财产组合。\n\n他们在促进好客之海的扩张与雄心中发挥着很大作用，其他人建议我们给予这座城市古老的自治权。"
 me_greek_1_black_sea.10.t:0 "$greek_1_6$：[gm_hellenic_reclamation_scope.GetName]"
 me_greek_1_black_sea.10.tt:0 "$mission_task_completed_tt_1$$greek_1_6$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.11.a:0 "赶快点。"
 me_greek_1_black_sea.11.at:0 "$me_gre_task_start_tt_1$估价蛮族所持有的港口。"
 me_greek_1_black_sea.11.desc:0 "[gm_family_head_1.GetFamilyDisplayAdjective]的[gm_family_head_1.GetPraenomen]正在组织商人团第调查各个蛮族城市，估算他们的价值以及当前所有者的亲善程度。"
 me_greek_1_black_sea.11.t:0 "$greek_1_14$：在周围采购"
 me_greek_1_black_sea.12.a:0 "开工。"
 me_greek_1_black_sea.12.at:0 "$me_gre_task_start_tt_1$估价自由殖民地。"
 me_greek_1_black_sea.12.desc:0 "我们可以依靠[gm_family_head_1.GetPraenomen][gm_family_head_1.GetFamilyDisplayAdjective]对各类我们可用的机会进行诚实的估价——我们的利益完美一致。"
 me_greek_1_black_sea.12.desc_1:0 "我们正在扩张对黑海各殖民地的影响力，他们曾在过去找到了适合自己的道路。\n\n"
 me_greek_1_black_sea.12.t:0 "$greek_1_5$：希腊使团"
 me_greek_1_black_sea.13.a:0 "可靠的血统。"
 me_greek_1_black_sea.13.b:0 "新血液保持一切的新鲜。"
 me_greek_1_black_sea.13.desc_1:0 "可惜，[gm_old_family_head.GetFamilyDisplayAdjective]家族的[gm_old_family_head.GetPraenomen]过世了，留下了[gm_old_family_head.GetHerHis]未完成的项目。\n\n"
 me_greek_1_black_sea.13.desc_2:0 "[gm_old_family_head.GetPraenomen]在缘由不明的事件中，永远离开了[gm_1_greek_scope.GetName]，在也无法执行我们的行动了。\n\n"
 me_greek_1_black_sea.13.desc_3:0 "看来[gm_old_family_head.GetPraenomen]的运气到头了，遭到关押，再也不能为我们的事业效劳了。\n\n"
 me_greek_1_black_sea.13.desc_4:0 "[gm_family_head_1.GetPraenomen]替代了[gm_old_family_head.GetSheHe|U]，这个家族曾使其老对手黯然失色。"
 me_greek_1_black_sea.13.desc_5:0 "[gm_family_head_1.GetPraenomen]替代了[gm_old_family_head.GetSheHe|U]，成为了[gm_old_family_head.GetFamilyDisplayAdjective]的新首领。"
 me_greek_1_black_sea.13.t:0 "$greek_1_black_sea$：[gm_family_head_1.GetName]的崛起"
 me_greek_1_black_sea.14.a:0 "非常好。"
 me_greek_1_black_sea.14.at1:0 "$mission_task_completed_tt_1$$greek_1_7$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.14.at2:0 "$mission_task_completed_tt_1$$greek_1_8$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.14.at3:0 "$mission_task_completed_tt_1$$greek_1_10$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.14.at4:0 "$mission_task_completed_tt_1$$greek_1_9$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.14.desc:0 "我们最近扩张进入了好客之海的新地区，提高了我们对北方贸易路线的掌控能力，诚如[gm_family_head_1.GetPraenomen]曾希望的那样。\n\n"
 me_greek_1_black_sea.14.desc_1:0 "在南岸的比堤尼亚的旧殖民地将成为希腊影响力的重要堡垒。"
 me_greek_1_black_sea.14.desc_2:0 "在整个区域最富裕的地方，坐落着刻耳索涅索斯的旧殖民地，它们一定会给我们带来巨大的财富。"
 me_greek_1_black_sea.14.desc_3:0 "革提亚的旧殖民地将再次崛起，堪配商贸与文明中心的盛名。"
 me_greek_1_black_sea.14.desc_4:0 "科尔基斯不竭的财富终于再次向渴望开发的希腊人敞开怀抱；这些旧日的港口将重获新生。"
 me_greek_1_black_sea.14.t_1:0 "$greek_1_7$"
 me_greek_1_black_sea.14.t_2:0 "$greek_1_8$"
 me_greek_1_black_sea.14.t_3:0 "$greek_1_10$"
 me_greek_1_black_sea.14.t_4:0 "$greek_1_9$"
 me_greek_1_black_sea.14.tt:0 "相关领土的城邦获得了商业与同化的好处。"
 me_greek_1_black_sea.15.a:0 "我们会使它们成为不可忽视的武力。"
 me_greek_1_black_sea.15.b:0 "减轻搭载，并只招募最好的桨手。"
 me_greek_1_black_sea.15.desc:0 "我们蔓延的海洋网络需要一支同样蔓延的海军，以此护卫我们的商人，免受劫掠、强盗或仇敌的侵扰。\n\n现在我们需要决定我们的海军中队专精于速度还是生存能力。"
 me_greek_1_black_sea.15.t:0 "$greek_1_11$"
 me_greek_1_black_sea.15.tt:0 "$mission_task_completed_tt_1$$greek_1_11$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.16.a:0 "理当如此。"
 me_greek_1_black_sea.16.at:0 "$mission_task_completed_tt_1$$greek_1_3$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.16.desc:0 "博斯普鲁斯海峡才是取得控制权的关键，任何试图支配好客之海的人们都必须接受这个事实。\n\n现在这道控制进出的关键已落入我们的掌控，我们无疑支配了所有爱琴海东部的贸易。"
 me_greek_1_black_sea.16.t:0 "$greek_1_3$"
 me_greek_1_black_sea.17.a:0 "经济就是一切。"
 me_greek_1_black_sea.17.b:0 "没有新兵，我们就完了。"
 me_greek_1_black_sea.17.desc:0 "我们成功将[me_gre_1_argo_scope.GetName]转变为一个可与西方任何城市媲美的城市——文化中心、贸易枢纽、抵御野蛮人的堡垒。\n\n现在有一个机会为这座城市设定一个先例，要么作为生产中心，要么作为我们遥远领地的军事核心。"
 me_greek_1_black_sea.17.t:0 "$greek_1_2$：[me_gre_1_argo_scope.GetName]"
 me_greek_1_black_sea.17.tt:0 "$mission_task_completed_tt_1$$greek_1_2$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.18.a:0 "让我们与[gm_1_colony_scope_1.GetName]接洽吧。"
 me_greek_1_black_sea.18.b:0 "[gm_1_colony_scope_2.GetName]怎么样？"
 me_greek_1_black_sea.18.c:0 "应该就是[gm_1_colony_scope_3.GetName]了。"
 me_greek_1_black_sea.18.d:0 "[gm_1_colony_scope_4.GetName]很有前途。"
 me_greek_1_black_sea.18.desc:0 "我们的商人带着他们的估价从黑海的希腊殖民地返回。\n\n我们应该明智的出价，将我们之前的关系和两国的相对大小考虑进去。"
 me_greek_1_black_sea.18.e:0 "不，一定是[gm_1_colony_scope_5.GetName]。"
 me_greek_1_black_sea.18.f:0 "蠢货，只有[gm_1_colony_scope_6.GetName]最合适。"
 me_greek_1_black_sea.18.g:0 "[SCOPE.Custom('gm_1_get_go_back_colony')]"
 me_greek_1_black_sea.18.gt:0 "我们会考虑其他可能的殖民地。"
 me_greek_1_black_sea.18.h:0 "算了，他们不值得。"
 me_greek_1_black_sea.18.ht:0 "[gm_1_greek_scope.GetName]不会再试图与殖民地接洽。"
 me_greek_1_black_sea.18.t:0 "$greek_1_5$：希腊诸国"
 me_greek_1_black_sea.18.tt:0 "我们会与#Y [gm_1_colony_target_scope.GetName]#!接洽，提议以#G [SCOPE.ScriptValue('gm_1_colony_value')]#!@gold!的价格让他们成为我们的藩属。\n接受概率受#Y [gm_family_head_1.GetPraenomen]#!的魅力、国家的相对大小和外交好感度影响。[SCOPE.Custom('gm_1_chance_colony')]\n如果他们拒绝，我们会获得所有[gm_1_colony_target_scope.GetAdjective]领土的宣称。"
 me_greek_1_black_sea.19.a:0 "安全的代价。"
 me_greek_1_black_sea.19.b:0 "我们可以再要点。"
 me_greek_1_black_sea.19.bt:0 "如果#Y [gm_1_greek_scope.GetName]#!同意，我们会成为他们的藩属，并收到双倍的钱（#G [SCOPE.ScriptValue('gm_1_colony_double_value')]#!@gold!），否则他们会获得宣称。"
 me_greek_1_black_sea.19.c:0 "他们小看我们了。"
 me_greek_1_black_sea.19.ct:0 "[gm_1_greek_scope.GetName]获得对我们所有领土的宣称。"
 me_greek_1_black_sea.19.desc:0 "来自[gm_1_greek_scope.GetName]代表当地政府的商人前来与我们接洽。他们希望向我们提供保护，以此换取礼物，不过显然，他们的真实目的是扩张自己的影响力……"
 me_greek_1_black_sea.19.t:0 "$greek_1_5$：[gm_1_greek_scope.GetAdjective]的提议"
 me_greek_1_black_sea.20.a:0 "他们真明智。"
 me_greek_1_black_sea.20.b:0 "我们欣赏他们的意志……"
 me_greek_1_black_sea.20.c:0 "……但是他们应当接受那份提议。"
 me_greek_1_black_sea.20.d:0 "臭名昭著的耻辱。"
 me_greek_1_black_sea.20.desc:0 "[gm_family_head_1.GetName]派去与[gm_1_colony_target_scope.GetName]谈判的商人返回了 "
 me_greek_1_black_sea.20.desc_1:0 "带着[gm_1_colony_target_scope.GetRulerTitle][gm_1_colony_target_scope.GetRuler.GetPraenomen]蛮族接受的条款！\n\n我们已经办妥了所许诺的资金，外加用来监督[gm_1_colony_target_scope.GetAdjective]一队政务官，它将作为[gm_1_greek_scope.GetAdjective]的附属国进行纳贡。"
 me_greek_1_black_sea.20.desc_2:0 "带回了他们的[gm_1_colony_target_scope.GetRulerTitle][gm_1_colony_target_scope.GetRuler.GetPraenomen]的反邀约。\n\n他们准备接受我的保护并纳贡，作为交换，他们要求更高的价款。"
 me_greek_1_black_sea.20.desc_3:0 "带着他们的[gm_1_colony_target_scope.GetRulerTitle][gm_1_colony_target_scope.GetRuler.GetPraenomen]平白的拒绝。\n\n这封信声称他们相当有能力自己做好防御工作，而且[gm_1_colony_target_scope.GetAdjective]人民不会出卖自己的自由。"
 me_greek_1_black_sea.20.t:0 "$greek_1_5$：[gm_1_colony_target_scope.GetAdjective]的谈判"
 me_greek_1_black_sea.20.tt:0 "$mission_task_completed_tt_1$$greek_1_14$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.21.a:0 "我们配得上。"
 me_greek_1_black_sea.21.b:0 "的确慷慨……"
 me_greek_1_black_sea.21.desc:0 "我们发往[gm_1_greek_scope.GetName]的反邀约终于得到了答复。\n\n"
 me_greek_1_black_sea.21.desc_1:0 "看来他们急切想要扩张在黑海的掌控范围，并接受了我们昂贵的要价！"
 me_greek_1_black_sea.21.desc_2:0 "看来这些吝啬鬼被我们的要价吓坏了，并拒绝撤回他们那“慷慨的友谊提议。”"
 me_greek_1_black_sea.21.t:0 "$greek_1_5$：[gm_1_greek_scope.GetName]的答复"
 me_greek_1_black_sea.22.a:0 "总有一天，整个东部海岸线都会属于希腊。"
 me_greek_1_black_sea.22.at:0 "$mission_task_completed_tt_1$$greek_1_19$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.22.desc:0 "几百年来，希腊商人侵扰着迈俄提斯湖，他们把商品强卖给当地的斯基泰人，并沿岸定居。\n\n随着我们控制了塔奈斯，那儿早已存在繁荣的希腊定居点，希腊影响力在世界的远方得到了保障。"
 me_greek_1_black_sea.22.t:0 "$greek_1_19$"
 me_greek_1_black_sea.23.a:0 "他们不会忘记。"
 me_greek_1_black_sea.23.at:0 "$mission_task_completed_tt_1$$greek_1_12$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.23.desc:0 "是我们的祖先以及他们大胆的努力，才给了希腊人在黑海的家园与生命。\n\n现在轮到我们了，他们将得到未来的安全、繁荣和荣耀。"
 me_greek_1_black_sea.23.t:0 "$greek_1_12$"
 me_greek_1_black_sea.24.a:0 "$me_greek_1_black_sea.23.a$"
 me_greek_1_black_sea.24.at:0 "$mission_task_completed_tt_1$$greek_1_13$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.24.desc:0 "$me_greek_1_black_sea.23.desc$."
 me_greek_1_black_sea.24.t:0 "$greek_1_13$"
 me_greek_1_black_sea.25.a:0 "海盗之死。"
 me_greek_1_black_sea.25.at:0 "$mission_task_completed_tt_1$$greek_1_15$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.25.desc:0 "我们勇敢的士兵与水手成功地彻底捣毁了好客之海周围的劫掠窝点。\n\n在我们警惕的舰队的维护下，新的和平时代降临了，该区域的和平与繁荣将得到保障。"
 me_greek_1_black_sea.25.t:0 "$greek_1_15$"
 me_greek_1_black_sea.26.a:0 "现在我们能处理真正的问题了。"
 me_greek_1_black_sea.26.at:0 "$mission_task_completed_tt_1$$greek_1_16$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.26.desc:0 "好客之海的海盗非常高兴能得到我们的贿赂，并准备离开前往其他水域。\n\n他们的新邻居或许不会喜欢这种情况，但是我们的商人和地主当然会喜欢！"
 me_greek_1_black_sea.26.t:0 "$greek_1_16$：平静的水"
 me_greek_1_black_sea.27.a:0 "他们会分享赃物吗？"
 me_greek_1_black_sea.27.at:0 "$mission_task_completed_tt_1$$greek_1_17$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.27.desc:0 "因着我们的赦免与薪水，我们对好客之海周围的海盗的招安工作一帆风顺。\n\n等必要时，应不会再缺可怖的舰船。"
 me_greek_1_black_sea.27.t:0 "$greek_1_17$"
 me_greek_1_black_sea.28.a:0 "见鬼。"
 me_greek_1_black_sea.28.at:0 "任务'#Y $greek_1_5$#!'已被#R跳过#!!"
 me_greek_1_black_sea.28.desc:0 "我们的商人使团空手而归，看来那儿没有适合我们提供保护的殖民地。"
 me_greek_1_black_sea.28.t:0 "$greek_1_5$：命运"
 me_greek_1_black_sea.29.a:0 "为什么是我们？"
 me_greek_1_black_sea.29.desc:0 "一大群游手好闲之人与土匪出现在我们的港口，他们在当地地区立足，并在那儿停靠他们的舰队。\n\n看来崛起的[gm_1_greek_scope.GetName]付钱给他们，让他们从好客之海转移到其他水域，而且他们觉得我们港口还不错……"
 me_greek_1_black_sea.29.t:0 "$greek_1_16$：新牧场"
 me_greek_1_black_sea.3.a:0 "确实，还能为了谁。"
 me_greek_1_black_sea.3.desc:0 "[gm_1_greek_scope.GetName]的牢骚已经有段时日了，他们煽动情绪，要求扩大在好客之海的影响力。\n\n看来主要的煽动者是[gm_family_head_1.GetPraenomen]，[gm_family_head_1.GetHerHis]无疑在为自己的目的行动，但如果不是为了我们——还能为谁呢？"
 me_greek_1_black_sea.3.t:0 "$greek_1_black_sea$：有胆魄的[gm_family_head_1.GetFamilyDisplayAdjective]"
 me_greek_1_black_sea.30.a:0 "该死。"
 me_greek_1_black_sea.30.at:0 "任务'#Y $greek_1_14$#!'已被#R跳过#!!"
 me_greek_1_black_sea.30.desc:0 "我们的商人使团空手而归，看来那儿没有适合我们贸易的地方。"
 me_greek_1_black_sea.30.t:0 "$greek_1_14$：命运"
 me_greek_1_black_sea.31.a:0 "也难怪他们，毕竟……"
 me_greek_1_black_sea.31.at:0 "$mission_task_completed_tt_1$$greek_1_18$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.31.desc:0 "与野蛮邻居的密切接触鼓励了许多部落成员在我们的边界内重新定居，他们渴望在我们的保护下致富。许多外国部落成员访问了[ROOT.GetCountry.GetCapital.GetName]，陪伴他们的酋长作为随从，或者甚至担任旅行商人的武装保镖和翻译，他们对[ROOT.GetCountry.GetAdjective]首都的景象和声音感到震撼。\n\n一旦他们的服役合同结束，这些雇佣兵中的许多人会走向我们的城市大门，意识到未来在于此。"
 me_greek_1_black_sea.31.t:0 "$greek_1_18$"
 me_greek_1_black_sea.4.a:0 "理所当然。"
 me_greek_1_black_sea.4.at:0 "使命“#Y 好客之海#!”已#G 完成#!！"
 me_greek_1_black_sea.4.desc:0 "“好客之海”这个地名最早是个玩笑般错误， 不过我们成功驯服了这片不安分的内海，并使它的繁荣远超以往。\n\n随着海盗受制、商贸兴旺，这片水域终于配得上了它自己的名字。"
 me_greek_1_black_sea.4.t:0 "不再不好客"
 me_greek_1_black_sea.5.a:0 "它等着我们去征服。"
 me_greek_1_black_sea.5.at:0 "$mission_task_completed_tt_1$$greek_1_4$$mission_task_completed_tt_2$"
 me_greek_1_black_sea.5.desc:0 "快速的扩张使我们得以统治整个好客之海，并将它从未开花的黑暗水域转变成了希腊世界的中心。\n\n我们必须继续我们的势头，并将我们在这些城市所取得的成就保持下去，毕竟我们在这里投入了太多的资源了。"
 me_greek_1_black_sea.5.t:0 "$greek_1_4$"
 me_greek_1_black_sea.6.a:0 "[gm_1_bartering_scope_1.GetName]，[gm_1_bartering_scope_1.GetOwner.GetName]的港口？"
 me_greek_1_black_sea.6.b:0 "我们听说[gm_1_bartering_scope_2.GetOwner.GetAdjective]的[gm_1_bartering_scope_2.GetName]不错。"
 me_greek_1_black_sea.6.c:0 "那么[gm_1_bartering_scope_3.GetOwner.GetName]的[gm_1_bartering_scope_3.GetName]怎么样？"
 me_greek_1_black_sea.6.d:0 "必须是在[gm_1_bartering_scope_4.GetOwner.GetName]的[gm_1_bartering_scope_4.GetName]。"
 me_greek_1_black_sea.6.desc:0 "[gm_family_head_1.GetPraenomen]派遣的商人返回了，他们带回了一张表单，上面记着我们或能购为己用的港口。\n\n如果一切可能的话，其中还写明了我们需要提供些什么才能符合当前那些所有者的口味。"
 me_greek_1_black_sea.6.e:0 "[gm_1_bartering_scope_5.GetName]似乎对[gm_1_bartering_scope_5.GetOwner.GetName]有益……"
 me_greek_1_black_sea.6.f:0 "[gm_1_bartering_scope_6.GetOwner.GetAdjective][gm_1_bartering_scope_6.GetName]的位置很棒。"
 me_greek_1_black_sea.6.g:0 "[SCOPE.Custom('gm_1_get_go_back')]"
 me_greek_1_black_sea.6.gt:0 "我们会考虑其他可能的港口。"
 me_greek_1_black_sea.6.h:0 "不值得我这样做。"
 me_greek_1_black_sea.6.ht:0 "[gm_1_greek_scope.GetName]将停止对港口估价。"
 me_greek_1_black_sea.6.t:0 "$greek_1_14$：黑海避风港"
 me_greek_1_black_sea.6.tt:0 "我们将提出以#R -[SCOPE.ScriptValue('gm_1_barter_territory_value')]#! @gold!从[gm_1_barter_target_territory.GetOwner.GetName]手中购买#Y [gm_1_barter_target_territory.GetName]#!\n接受概率受#Y [gm_family_head_1.GetPraenomen]#!的魅力、港口的相对价值和外交好感度影响。[SCOPE.Custom('gm_1_chance_barter')]\n如果他们拒绝，我们将获得对#Y [gm_1_barter_target_territory.GetName]#!的宣称"
 me_greek_1_black_sea.7.a:0 "真走运，那些蠢货会让我们变得富裕！"
 me_greek_1_black_sea.7.b:0 "也许他们是为了更有价值的东西。"
 me_greek_1_black_sea.7.bt:0 "如果#Y [gm_1_greek_scope.GetName]#!接受，我们将会因交换#Y [gm_1_barter_target_territory.GetName]#!而得到双倍的金钱（#G [SCOPE.ScriptValue('gm_1_barter_territory_double_value')]#! @gold!），否则他们会得到一个宣称。"
 me_greek_1_black_sea.7.c:0 "他们这是在侮辱我们的智力！"
 me_greek_1_black_sea.7.ct:0 "[gm_1_greek_scope.GetName]获得对#Y [gm_1_barter_target_territory.GetName]#!的宣称。"
 me_greek_1_black_sea.7.desc:0 "一伙自称代表[gm_1_greek_scope.GetName]的商人前来与我们洽谈，他们来自好客之海沿岸的[gm_1_greek_scope.GetCapital.GetArea.GetRegion.GetName]，那是个希腊国家。\n\n他们希望收购位于[gm_1_barter_target_territory.GetName]的登陆点，并支付‘一笔合理的费用。’"
 me_greek_1_black_sea.7.t:0 "$greek_1_14$：[gm_1_greek_scope.GetName]的精明的希腊人"
 me_greek_1_black_sea.8.a:0 "哈，这群傻子！"
 me_greek_1_black_sea.8.b:0 "非常精明，对野蛮的小崽子来说……"
 me_greek_1_black_sea.8.c:0 "……但我们最初的提议可是再公平不过了！"
 me_greek_1_black_sea.8.d:0 "我们还有其他方法，更血腥的那种。"
 me_greek_1_black_sea.8.desc:0 "[gm_family_head_1.GetName]派去与[gm_1_barter_target_territory.GetOwner.GetName]谈判的商人已经返回。 "
 me_greek_1_black_sea.8.desc_1:0 "带着[gm_1_barter_target_territory.GetOwner.GetRulerTitle][gm_1_barter_target_territory.GetOwner.GetRuler.GetPraenomen]蛮族接受的条款！\n\n我们已经办妥了所许诺的资金，外加用来监督[gm_1_barter_target_territory.GetName]行政的一队政务官，那里将成为[gm_1_greek_scope.GetAdjective]的港口。"
 me_greek_1_black_sea.8.desc_2:0 "带回了[gm_1_barter_target_territory.GetOwner.GetRulerTitle][gm_1_barter_target_territory.GetOwner.GetRuler.GetPraenomen]蛮族的反邀约。\n\n他们准备卖给我们[gm_1_barter_target_territory.GetName]周围的土地和港口，作为交换，他们要求更高的价款。"
 me_greek_1_black_sea.8.desc_3:0 "带回了[gm_1_barter_target_territory.GetOwner.GetRulerTitle][gm_1_barter_target_territory.GetOwner.GetRuler.GetPraenomen]蛮族的平白的拒绝。\n\n这封信声称这片土地是[gm_1_barter_target_territory.GetOwner.GetAdjective]人民的古老领土，比任何廉价的发光饰品都重要。"
 me_greek_1_black_sea.8.t:0 "$greek_1_14$：[gm_1_barter_target_territory.GetOwner.GetAdjective]的谈判"
 me_greek_1_black_sea.9.a:0 "他们知道我们不知道的东西？"
 me_greek_1_black_sea.9.b:0 "那些乡巴佬最好别打这主意。"
 me_greek_1_black_sea.9.desc:0 "我们发往[gm_1_greek_scope.GetName]的反邀约终于得到了答复。\n\n"
 me_greek_1_black_sea.9.desc_1:0 "看来他们非常需要土地和避风港来停靠船只，并接受了我们的要求。因我们自信的交易，我们的国库财富横溢！"
 me_greek_1_black_sea.9.desc_2:0 "看来这些吝啬鬼被我们的要价吓坏了，并拒绝“被穿裤子的野蛮人活生生地剥皮。”"
 me_greek_1_black_sea.9.t:0 "$greek_1_14$：[gm_1_greek_scope.GetName]的回复"
 me_greek_2_10_op_tt:0 "希腊的$hellenic$国家将对[gm_2_greek_scope.GetName]增加#G 10#!好感度。"
 me_greek_2_20_op_tt:0 "希腊的$hellenic$国家将对[gm_2_greek_scope.GetName]增加#G 20#!好感度。"
 me_greek_2_greece.1.a:0 "想象一下……"
 me_greek_2_greece.1.desc:0 "\n\n迥异的传统、方言和政府，我们必须与之搏斗，不过依然有可能……"
 me_greek_2_greece.1.desc_1:0 "太久了，希腊一直遭到外来君主支配，在更大的一统的敌军的蹂躏下，饱受欺凌与威胁。"
 me_greek_2_greece.1.desc_2:0 "在这离奇的时代中，有人想到了统一的希腊可以抵御外来侵略的袭击，正如提洛同盟时代一样。"
 me_greek_2_greece.1.t:0 "$greek_2_greece$：全希腊的梦想"
 me_greek_2_greece.10.a:0 "我们将打败他们。"
 me_greek_2_greece.10.at:0 "$mission_completed_tooltip_1$ '#Y $greek_2_4$#!' $mission_completed_tooltip_2$"
 me_greek_2_greece.10.b:0 "$me_greek_2_greece.10.a$"
 me_greek_2_greece.10.bt:0 "$mission_completed_tooltip_1$ '#Y $greek_2_5$#!' $mission_completed_tooltip_2$"
 me_greek_2_greece.10.claim_tt_1:0 "[gm_2_greek_scope.GetName]已获得对希腊所有$hellenic$寡头制和君主制国家的宣称。"
 me_greek_2_greece.10.claim_tt_2:0 "[gm_2_greek_scope.GetName]已获得对希腊所有$hellenic$非寡头制共和国的宣称。"
 me_greek_2_greece.10.desc:0 "我们勇敢的领袖，[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]，准备了一篇针对阻碍希腊统一的Hellenic政府的激烈辩论演讲。"
 me_greek_2_greece.10.desc_1:0 "[gm_2_greek_scope.GetRuler.GetHerHis|U] 的尖锐言辞使民众相信需要一个强有力的政府，并减少或替换Hellenic民主制度。"
 me_greek_2_greece.10.desc_2:0 "[gm_2_greek_scope.GetRuler.GetHerHis|U] 的尖锐言辞使民众相信需要解放所有希腊人，摧毁公民之间的暴政和不平等。"
 me_greek_2_greece.10.t_1:0 "$greek_2_4$: 辩论演讲"
 me_greek_2_greece.10.t_2:0 "$greek_2_5$: 辩论演讲"
 me_greek_2_greece.11.a:0 "我们必须说服他们停止争斗。"
 me_greek_2_greece.11.at:0 "$me_gre_task_start_tt_2$ 准备外交提议。"
 me_greek_2_greece.11.desc:0 "还有其他与我们价值观相同的希腊城邦，可以轻松融入我们不断壮大的城市联盟。\n\n就像所有希腊人一样，他们都很自豪，必须说服他们，但显然希腊人团结起来会更强大，即使有些人必须放弃直接控制。"
 me_greek_2_greece.11.t:0 "$greek_2_6$: 号召团结"
 me_greek_2_greece.12.a:0 "这比我们预期的还要好！"
 me_greek_2_greece.12.at:0 "$mission_task_completed_tt_1$$greek_2_6$$mission_task_completed_tt_2$"
 me_greek_2_greece.12.b:0 "那些傻瓜迟早会看到道理，无论用什么方式。"
 me_greek_2_greece.12.desc:0 "我们的外交努力已经结束，最富有魅力的代表已被派往希腊各地，试图说服希腊人接受我们的领导能力。\n\n"
 me_greek_2_greece.12.desc_1:0 "[gm_2_greek_scope.GetRuler.GetPraenomen] 的论点取得了一些成功 - 我们收到了一些受压迫城市的支援承诺。"
 me_greek_2_greece.12.desc_2:0 "[gm_2_greek_scope.GetRuler.GetPraenomen] 的论点却没有得到回应 - 看来其他希腊人并不信任我们的意图。"
 me_greek_2_greece.12.t:0 "$greek_2_6$: 回应"
 me_greek_2_greece.13.a:0 "赞美众神。"
 me_greek_2_greece.13.at:0 "任务'#Y $greek_2_4$#!'已被#R跳过#!!"
 me_greek_2_greece.13.b:0 "$me_greek_2_greece.13.a$"
 me_greek_2_greece.13.bt:0 "任务'#Y $greek_2_5$#!'已被#R跳过#!!"
 me_greek_2_greece.13.desc:0 "在准备激发公众支持反对不良政府的运动时，我们收到消息说最后一个这样的冒牌货已经被推翻了。"
 me_greek_2_greece.13.t_1:0 "$greek_2_4$: 形势变化"
 me_greek_2_greece.13.t_2:0 "$greek_2_5$: 形势变化"
 me_greek_2_greece.14.a:0 "总会有办法的..."
 me_greek_2_greece.14.at:0 "任务'#Y $greek_2_6$#!'已被#R跳过#!!"
 me_greek_2_greece.14.desc:0 "整个希腊类似思想的政府崩溃阻止了我们在该地区的外交努力。\n\n如果我们要成为区域领导者，就必须寻求其他途径。"
 me_greek_2_greece.14.t:0 "$greek_2_6$: 失去的机会"
 me_greek_2_greece.15.a:0 "可恶的事件..."
 me_greek_2_greece.15.at:0 "任务'#Y $greek_2_15$#!'已被#R跳过#!!"
 me_greek_2_greece.15.b:0 "可恶的事件..."
 me_greek_2_greece.15.bt:0 "$mission_completed_tooltip_1$ '#Y $greek_2_16$#!' $mission_bypassed_tooltip_2$"
 me_greek_2_greece.15.desc:0 "失去我们的附属国破坏了我们更好地将其资源整合进更广泛的[gm_2_greek_scope.GetAdjective]战略中的计划。"
 me_greek_2_greece.15.t_1:0 "$greek_2_15$: 浪费的计划"
 me_greek_2_greece.15.t_2:0 "$greek_2_16$: 浪费的计划"
 me_greek_2_greece.17.a:0 "大海将是我们的领地，有波塞冬的祝福。"
 me_greek_2_greece.17.at:0 "$mission_completed_tooltip_1$ '#Y $greek_2_18$#!' $mission_task_completed_tt_2$"
 me_greek_2_greece.17.desc:0 "我们终于重新建立了某种程度上的提洛同盟海军优势，盟友的基地遍布爱琴海，并确保其水域免受侵扰。\n\n如果我们想保持强大，我们必须让我们的海军和陆军一样重要，时刻保持对其质量和战备状态的高度警惕。"
 me_greek_2_greece.17.t:0 "$greek_2_18$"
 me_greek_2_greece.18.a:0 "整个希腊，都是我们的。"
 me_greek_2_greece.18.at:0 "$mission_completed_tooltip_1$ '#Y $greek_2_9$#!' $mission_task_completed_tt_2$"
 me_greek_2_greece.18.desc:0 "希腊的历史名城已经得到保障，确保了我们在希腊文化和传统中的主导地位。\n\n从柏拉图的橄榄园到忒拜的大门；从皮提亚的圣地到科林斯的妓院。"
 me_greek_2_greece.18.t:0 "$greek_2_9$"
 me_greek_2_greece.19.a:0 "毕竟，时代令人担忧..."
 me_greek_2_greece.19.at:0 "在未来几周内："
 me_greek_2_greece.19.b:0 "多么傲慢！"
 me_greek_2_greece.19.desc:0 "[gm_2_greek_scope.GetName] 的代表们已经降临希腊的宫廷，请求所有愿意倾听的人加入他们统一希腊以对抗共同威胁的努力。\n\n他们要求为希腊的防御做出贡献，以换取保护和友谊，尽管许多人对他们的真实意图持怀疑态度..."
 me_greek_2_greece.19.t:0 "$greek_2_6$：[gm_2_greek_scope.GetAdjective]交流"
 me_greek_2_greece.2.a:0 "我们是希腊文明的保护者"
 me_greek_2_greece.2.desc:0 "希腊历史中首次，所有的希腊人团结在一个国家内，曾经的分裂只不过成了往昔的追忆。\n\n虽然前方依然会有挫折，不过所有希腊人都明白，统一就是力量，我们曾经忽视它太久了。"
 me_greek_2_greece.2.t:0 "$greek_2_greece$：统一的全希腊"
 me_greek_2_greece.20.a:0 "[gm_2_greek_scope.GetCapital.GetName] 将成为永恒之城。"
 me_greek_2_greece.20.at:0 "$mission_task_completed_tt_1$$greek_2_7$$mission_task_completed_tt_2$"
 me_greek_2_greece.20.desc:0 "[gm_2_greek_scope.GetCapital.GetName] 的街道充满了全球首都的繁忙景象，商人、哲学家、士兵和工匠们都在从事他们的贸易。\n\n我们的首都现在无疑是希腊文明和文化的无可争议的中心，吸引着最优秀的希腊人来到我们的土地！"
 me_greek_2_greece.20.t:0 "$greek_2_7$: [gm_2_greek_scope.GetCapital.GetName]"
 me_greek_2_greece.20.tt:0 "希腊的$hellenic$国家对[gm_2_greek_scope.GetName]增加#G 20#!好感度"
 me_greek_2_greece.21.a:0 "[gm_2_greek_scope.GetRuler.GetPraenomen] 将带领我们走向荣耀！"
 me_greek_2_greece.21.at:0 "$mission_task_completed_tt_1$$greek_2_8$$mission_task_completed_tt_2$"
 me_greek_2_greece.21.desc:0 "在这些艰难时期，强有力的领导的重要性不容忽视，而希腊人有幸拥有 [gm_2_greek_scope.GetRuler.GetPraenomen] 为我们争取利益。\n\n"
 me_greek_2_greece.21.desc_1:0 "$me_greek_2_greece.21.desc_body$ 并以其熟练的统治赢得了人民的支持。"
 me_greek_2_greece.21.desc_2:0 "$me_greek_2_greece.21.desc_body$ 并证明了作为任命的战略家的素质。"
 me_greek_2_greece.21.desc_body:0 "[gm_2_greek_scope.GetRulerTitle] 势如破竹，驱逐了[gm_2_greek_scope.GetName]的敌人"
 me_greek_2_greece.21.t:0 "$greek_2_8$: [gm_2_greek_scope.GetRuler.GetName]"
 me_greek_2_greece.22.a:0 "希腊的安全需要它。"
 me_greek_2_greece.22.at:0 "$me_gre_task_start_tt_2$ 要求藩属国提供兵役。"
 me_greek_2_greece.22.desc:0 "希腊军队需要士兵来保卫边界和利益，这一需求从未如此迫切。\n\n现在，我们的政治家提出了一项建议，以更好地将我们的兄弟城市纳入我们的军事体系，以确保稳定的兵员供应。"
 me_greek_2_greece.22.t:0 "$greek_2_15$：掌控加强"
 me_greek_2_greece.23.a:0 "这只是自由的代价..."
 me_greek_2_greece.23.at:0 "$mission_task_completed_tt_1$$greek_2_15$$mission_task_completed_tt_2$"
 me_greek_2_greece.23.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] 已完成立法，要求我们的希腊附属国提供更大规模的人力资源。\n\n$me_greek_2_greece_own_good_desc$"
 me_greek_2_greece.23.t:0 "$greek_2_15$：征兵"
 me_greek_2_greece.24.a:0 "$me_greek_2_greece.22.a$"
 me_greek_2_greece.24.at:0 "$me_gre_task_start_tt_2$ 要求更大的贡献。"
 me_greek_2_greece.24.desc:0 "我们朝贡国市场的日益紧密的整合及其对我们共管国库的贡献，导致了比预期更紧密的关系。\n\n为了保护那些保证我们自由的收入流，自然应该使这种新现状更加稳固。"
 me_greek_2_greece.24.t:0 "$greek_2_16$：财政依赖"
 me_greek_2_greece.25.a:0 "$me_greek_2_greece.23.a$"
 me_greek_2_greece.25.at:0 "$mission_task_completed_tt_1$$greek_2_16$$mission_task_completed_tt_2$"
 me_greek_2_greece.25.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] 完成了一个新的标准化度量衡系统，这将增加我们从希腊兄弟市场获得的价值。\n\n$me_greek_2_greece_own_good_desc$"
 me_greek_2_greece.25.t:0 "$greek_2_16$：公共财库"
 me_greek_2_greece.26.a:0 "自由与商业。"
 me_greek_2_greece.26.at:0 "$mission_task_completed_tt_1$$greek_2_10$$mission_task_completed_tt_2$"
 me_greek_2_greece.26.desc:0 "[gm_2_greek_scope.GetName] 的领导者以雅典及其附属国组成的海上帝国为例，指导他们的雄心壮志。\n\n他们的成功甚至超越了提洛同盟，为未来的整合铺平了道路，并带来了巨大的好处。"
 me_greek_2_greece.26.t:0 "$greek_2_10$"
 me_greek_2_greece.27.a:0 "和平与稳定。"
 me_greek_2_greece.27.at:0 "$mission_completed_tooltip_1$“#Y $greek_2_11$#!”$mission_task_completed_tt_2$"
 me_greek_2_greece.27.desc:0 "[gm_2_greek_scope.GetName] 的领导者以拉栖第梦人的策略及其对希腊城市的支配为例，指导他们的雄心壮志。\n\n我们驻军的城市和附属国网络超越了任何斯巴达的成就，确保了希腊的安全，并带来了巨大的好处。"
 me_greek_2_greece.27.t:0 "$greek_2_11$"
 me_greek_2_greece.28.a:0 "哈，你们的萨里沙长矛现在在哪里？"
 me_greek_2_greece.28.at:0 "$mission_completed_tooltip_1$“#Y $greek_2_14$#!”$mission_task_completed_tt_2$"
 me_greek_2_greece.28.desc:0 "我们的士兵兴奋地向阿吉德王朝的古老宫殿群进发，渴望分得一份丰厚的战利品。\n\n通过这一象征性的举动，我们向希腊世界表明，野蛮的马其顿国王的时代已经结束，[gm_2_greek_scope.GetName] 现在是希腊无可争议的主人。"
 me_greek_2_greece.28.t:0 "$greek_2_14$"
 me_greek_2_greece.29.a:0 "他们会为此付出代价！"
 me_greek_2_greece.29.at:0 "$mission_completed_tooltip_1$“#Y $greek_2_11$#!”$mission_task_completed_tt_2$"
 me_greek_2_greece.29.b:0 "我们只是用一个残忍的主人换另一个吗？"
 me_greek_2_greece.29.c:0 "他们给予的荣耀，最终又夺走..."
 me_greek_2_greece.29.desc:0 "来自佩拉的使者带来消息，报告说 [gm_2_greek_scope.GetAdjective] 士兵为了报复希腊的征服，洗劫了艾加伊的阿吉德宫殿群！\n\n"
 me_greek_2_greece.29.desc_1:0 "这些混蛋侮辱了亚历山大及其所有祖先的记忆，尤其是我们这些合法继承人！"
 me_greek_2_greece.29.desc_2:0 "他们显然想激怒继业者，并向希腊人民展示他们是值得信赖的抵御外国君主的保护者。"
 me_greek_2_greece.29.desc_3:0 "看来马其顿在希腊的霸权时代确实已经结束，[gm_2_greek_scope.GetName] 已经接过他们的血腥披风。"
 me_greek_2_greece.29.t:0 "$greek_2_14$: 艾加伊被劫掠"
 me_greek_2_greece.3.a:0 "寡头制是稳定的最有力保障。"
 me_greek_2_greece.3.at:0 "$me_gre_task_start_tt_2$普及寡头制的政策。"
 me_greek_2_greece.3.desc:0 "民主制、君主制、寡头制政体之间的争端在希腊各地延续，各方都对邻居与被击败的对手强加自己的传统。\n\n不论用武力还是外交手段，为了团结希腊，必须结束这种分歧，我们一定可以解决这种亚历山大与他的将军们产生的混乱。"
 me_greek_2_greece.3.t:0 "$greek_2_1$：分裂了几个世纪"
 me_greek_2_greece.30.a:0 "无论环境如何，团结使我们更强大。"
 me_greek_2_greece.30.b:0 "他们只是想控制我们！"
 me_greek_2_greece.30.desc:0 "[gm_2_greek_scope.GetAdjective] 外交官不断恳求我们的官员，主张统一的希腊可以抵御外敌入侵带来的毁灭性打击的好处。\n\n"
 me_greek_2_greece.30.desc_1:0 "他们提议以结盟和少量志愿者加入联合军队为交换条件，为我们提供保护。"
 me_greek_2_greece.30.desc_2:0 "他们提议以支付小额贡金作为交换条件，将贡金存入共享国库用于支付整个希腊的防御费用，以此来保护我们。"
 me_greek_2_greece.30.t:0 "$greek_2_1$: [gm_2_greek_scope.GetAdjective] 保护"
 me_greek_2_greece.31.a:0 "改变方向可以获得很多好处。"
 me_greek_2_greece.31.b:0 "他们应该远离我们的事务！"
 me_greek_2_greece.31.desc:0 "我们受到了野心勃勃的 [gm_2_greek_scope.GetAdjective] 国家使者的接洽，他们希望通过修补旧有的分歧和争端来统一希腊。\n\n"
 me_greek_2_greece.31.desc_1:0 "他们提议帮助我们重新起草法律，以一种更有助于自由的方式，旨在让所有希腊人在文化和共识上更加紧密。"
 me_greek_2_greece.31.desc_2:0 "他们提议帮助我们按照寡头政治路线重组共和国，旨在让所有希腊人在文化和共识上更加紧密。"
 me_greek_2_greece.31.t:0 "$greek_2_1$: [gm_2_greek_scope.GetAdjective] 劝说"
 me_greek_2_greece.31_ari:0 "#Y [me_gre_2_convinced_scope.GetName]#! 成为贵族共和国。"
 me_greek_2_greece.31_dem:0 "#Y [me_gre_2_convinced_scope.GetName]#! 成为民主共和国。"
 me_greek_2_greece.31_oli:0 "#Y [me_gre_2_convinced_scope.GetName]#! 成为寡头共和国。"
 me_greek_2_greece.31_plu:0 "#Y [me_gre_2_convinced_scope.GetName]#!成为财阀共和国。"
 me_greek_2_greece.31_the:0 "#Y [me_gre_2_convinced_scope.GetName]#! 成为神权共和国。"
 me_greek_2_greece.32.a:0 "做得非常好。"
 me_greek_2_greece.32.desc:0 "[gm_2_family_head_scope.GetPraenomen] 的外交努力得到了回报！[gm_2_family_head_scope.GetSheHe|U] 报告称，[me_gre_2_convinced_scope.GetAdjective] 国家已同意接受我们的保护，以换取对统一希腊力量的贡献！"
 me_greek_2_greece.32.t:0 "$greek_2_1$: [gm_2_greek_scope.GetAdjective] 劝说"
 me_greek_2_greece.33.a:0 "非常好。"
 me_greek_2_greece.33.desc:0 "[gm_2_family_head_scope.GetPraenomen] 带来消息称，[gm_2_family_head_scope.GetHerHis] 努力说服希腊政府的努力在 [me_gre_2_convinced_scope.GetName] 取得了成功。\n\n经过长时间的辩论，他们认为转向我们的治理模式对整个希腊都有利。"
 me_greek_2_greece.33.t:0 "$greek_2_1$: [gm_2_greek_scope.GetAdjective] 劝说"
 me_greek_2_greece.34.a:0 "如果我们要繁荣，希腊必须真正统一。"
 me_greek_2_greece.34.at:0 "$me_greek_2_greece.34.tt$除#Y $crete_area$#!和#Y $epirus_area$#!地区外，位于#Y $thessaly_area$#!省份和#Y $greece_region$#!区域的所有希腊附属国都将被[gm_2_greek_scope.GetCapital.GetName]吞并。\n$me_greek_2_greece.34.ct$"
 me_greek_2_greece.34.b:0 "古老的部落将在我们的领导下自治。"
 me_greek_2_greece.34.bt:0 "$me_greek_2_greece.34.tt$$greece_region$的每个#Y 省份#!都将被释放为以[gm_2_greek_scope.GetCapital.GetState.GetShortName]为中心的泛希腊政府之自治藩属，提供人力与一支军队。"
 me_greek_2_greece.34.c:0 "$me_greek_2_greece.34.a$"
 me_greek_2_greece.34.ct:0 "$me_greek_2_greece.34.tt$ [gm_2_greek_scope.GetCapital.GetName]将遭受#Y 25#!年的全局动荡加剧。"
 me_greek_2_greece.34.desc:0 "终于，从基塞拉岛到帖撒利平原，整个希腊都在[gm_2_greek_scope.GetAdjective]领导下统一。\n\n政府聚集在一起庆祝这一重要时刻，并决定如何治理希腊世界……"
 me_greek_2_greece.34.t:0 "希腊地区的 [gm_2_greek_scope.GetAdjective] 帝国：希腊的领导者"
 me_greek_2_greece.34.tt:0 "当任务“#Y [gm_2_greek_scope.GetAdjective]帝国#!”完成时：\n"
 me_greek_2_greece.35.a:0 "分裂的时代已经过去。"
 me_greek_2_greece.35.b:0 "作为盟友我们更强大。"
 me_greek_2_greece.35.c:0 "$me_greek_2_greece.35.a$"
 me_greek_2_greece.35.desc:0 "所有必要的行政准备工作都已完成，新的希腊政府已经接管了整个希腊。\n\n"
 me_greek_2_greece.35.desc_1:0 "希腊的附属城市和平地接受了我们的吞并要求，在我们的领导下整合了它们的人口。"
 me_greek_2_greece.35.desc_2:0 "希腊的历史地区，因方言和文化而分离，已被授予自治权，但在[gm_2_greek_scope.GetName]的总体领导下，他们的军队将与我们的军队一起服役，并为保卫整个希腊贡献士兵。"
 me_greek_2_greece.35.desc_3:0 "希腊人民不得不接受我国的完全统治，使希腊的每一个城市都处于 [gm_2_greek_scope.GetName] 的统治之下。"
 me_greek_2_greece.35.mod_tt:0 "每个附庸都收到了"
 me_greek_2_greece.35.t:0 "[gm_2_greek_scope.GetAdjective]帝国：$greek_2_greece$"
 me_greek_2_greece.35.tt:0 "希腊的每个 #Y 省#! 都已成为基于 [gm_2_greek_scope.GetCapital.GetState.GetShortName] 的泛希腊政府的自治附庸，提供人力和军队。"
 me_greek_2_greece.35.tt2:0 "[gm_2_greek_scope.GetName]已获得希腊附近的所有希腊地区的宣称。"
 me_greek_2_greece.35.tt3:0 "除#Y $crete_area$#!和#Y $epirus_area$#!地区外，位于#Y $thessaly_area$#!省份和#Y $greece_region$#!区域的$hellenic$附属国已被吞并。"
 me_greek_2_greece.4.a:0 "[gm_2_family_head_scope.GetPraenomen]是个好[gm_2_family_head_scope.GetWomanMan]。"
 me_greek_2_greece.4.at:0 "希腊所有寡头制与君主制国家对[gm_2_greek_scope.GetName]的好感度增加#G 25#!。\n未来$hellenic$国家有小概率被说服改变政府，或成为我们的藩属国。"
 me_greek_2_greece.4.desc:0 "[gm_2_family_head_scope.GetPraenomen]公开成为寡头制的最大支持者，并且[gm_2_family_head_scope.GetHerHis]自愿努力推进我们的事业。\n\n$me_greek_2_stoke_desc$"
 me_greek_2_greece.4.t:0 "$greek_2_1$：寡头制的努力"
 me_greek_2_greece.5.a:0 "我们效忠于民主。"
 me_greek_2_greece.5.at:0 "$me_gre_task_start_tt_2$普及民主制的政策。"
 me_greek_2_greece.5.desc:0 "$me_greek_2_greece.3.desc$"
 me_greek_2_greece.5.t:0 "$greek_2_2$：世纪分裂"
 me_greek_2_greece.6.a:0 "[gm_2_family_head_scope.GetPraenomen]是个好[gm_2_family_head_scope.GetWomanMan]。"
 me_greek_2_greece.6.at:0 "希腊所有非寡头制共和国对[gm_2_greek_scope.GetName]的好感度增加#G 25#!。\n未来希腊的$hellenic$国家有小概率被说服改变政府，或成为我们的朝贡国。"
 me_greek_2_greece.6.desc:0 "[gm_2_family_head_scope.GetPraenomen]公开成为民主制的最大支持者，并且[gm_2_family_head_scope.GetHerHis]自愿努力推进我们的事业。\n\n$me_greek_2_stoke_desc$"
 me_greek_2_greece.6.t:0 "$greek_2_1$：民主制的努力"
 me_greek_2_greece.7.a:0 "希腊将不再低头。"
 me_greek_2_greece.7.at:0 "$mission_task_completed_tt_1$$greek_2_13$$mission_task_completed_tt_2$"
 me_greek_2_greece.7.desc:0 "近期，曾经的希腊领土都被重新占领，许多人指出[gm_2_greek_scope.GetRuler.GetPraenomen]是个煽动者。\n\n人们已经把[gm_2_greek_scope.GetRuler.GetHerHim]称为‘$NICKNAME_ELEUTHERIOS$’，即“解放者”，而[gm_2_greek_scope.GetRuler.GetHerHis]的盛名远播[gm_2_greek_scope.GetName]和全希腊。"
 me_greek_2_greece.7.t:0 "$greek_2_13$"
 me_greek_2_greece.8.a:0 "[me_gre_2_3_scope.GetName]现在安全了。"
 me_greek_2_greece.8.at:0 "[me_gre_2_3_scope.GetName]将#Y 被释放为附属国#!。\n$me_greek_2_20_op_tt$"
 me_greek_2_greece.8.b:0 "[gm_2_greek_scope.GetName]将保护所有希腊人。"
 me_greek_2_greece.8.bt:0 "[me_gre_2_3_scope.GetName]将继续作为我们的领土。\n$me_greek_2_10_op_tt$"
 me_greek_2_greece.8.c:0 "我们将监督[me_gre_2_3_scope.GetName]。"
 me_greek_2_greece.8.ct:0 "[me_gre_2_3_scope.GetOwner.GetName]将继续作为我们的附属如故。\n$me_greek_2_20_op_tt$"
 me_greek_2_greece.8.d:0 "我们将保护[me_gre_2_3_scope.GetName]。"
 me_greek_2_greece.8.desc_1:0 "[me_gre_2_3_scope.GetName]终于回到了真正希腊人的手中，他们可以再次享受同胞政府下自由。\n\n"
 me_greek_2_greece.8.desc_2:0 "[me_gre_2_3_scope.GetName]终于再次回归希腊，作为[me_gre_2_3_scope.GetOwner.GetName]的领地的一部分，我们的附属国。\n\n"
 me_greek_2_greece.8.desc_3:0 "[me_gre_2_3_scope.GetName]终于得到了解放，被带回了自己民族的政府的怀抱。\n\n"
 me_greek_2_greece.8.desc_4:0 "现在，我们的政府正辩论这座城市是否应被允许继续当我们的附属国，还是置于我们更加直接的保护下。"
 me_greek_2_greece.8.desc_5:0 "现在，我们的政府正在辩论这座得解放的城市是否应由我们直接管理，还是释放为臣服于我们的保护城。"
 me_greek_2_greece.8.desc_6:0 "现在，我们的正在辩论这座得解放的城市是否应由我们直接管辖，还是由其当前管理者负责。"
 me_greek_2_greece.8.dt:0 "$me_greek_2_10_op_tt$"
 me_greek_2_greece.8.e:0 "[me_gre_2_3_scope.GetOwner.GetAdjective]将保护[me_gre_2_3_scope.GetName]。"
 me_greek_2_greece.8.et:0 "[me_gre_2_3_scope.GetName]将继续作为[me_gre_2_3_scope.GetOwner.GetAdjective]的领土。\n$me_greek_2_20_op_tt$"
 me_greek_2_greece.8.f:0 "[me_gre_2_3_scope.GetName]将被吞并。"
 me_greek_2_greece.8.ft:0 "$me_greek_2_10_op_tt$"
 me_greek_2_greece.8.g:0 "关系需要改进，仅此而已。"
 me_greek_2_greece.8.gt:0 "$me_greek_2_10_op_tt$"
 me_greek_2_greece.8.t:0 "$greek_2_3$"
 me_greek_2_greece.8.tt:0 "$mission_task_completed_tt_1$$greek_2_3$$mission_task_completed_tt_2$"
 me_greek_2_greece.9.a:0 "强有力的政府必须占上风。"
 me_greek_2_greece.9.at:0 "$me_gre_task_start_tt_2$ 针对希腊共和国。"
 me_greek_2_greece.9.b:0 "希腊人应该享有民主。"
 me_greek_2_greece.9.bt:0 "$me_gre_task_start_tt_2$ 针对希腊寡头和君主。"
 me_greek_2_greece.9.desc:0 "[gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen] 在将希腊置于[gm_2_greek_scope.GetName]领导下的决心上变得更加大胆。\n\n事实上，这种必要性使得[gm_2_greek_scope.GetRuler.GetSheHe]已经开始起草演讲稿，攻击希腊落后的政府，以争取公众对其入侵的支持。"
 me_greek_2_greece.9.t_1:0 "$greek_2_4$: 激励行动"
 me_greek_2_greece.9.t_2:0 "$greek_2_5$: 激励行动"
 me_greek_2_greece_own_good_desc:0 "他们可能不喜欢这样，但这不仅是为了他们自己的利益，也是为了所有希腊人的福祉。"
 me_greek_2_stoke_desc:0 "[gm_2_family_head_scope.GetSheHe|U]将尽[gm_2_family_head_scope.GetHerHis]的全力说服我们的邻居与仇敌，奉承统一的希腊的梦想。"
 me_greek_3_italiote.1.a:0 "真是个煽动者。"
 me_greek_3_italiote.1.desc:0 "希腊世界对日益加剧的继业者冲突感到恐惧，而现在叙拉古也显露了其亚历山大式的野心。\n\n在 [gm_family_head_3.GetPraenomen] 的鼓励下，[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 对 [gm_3_greek_scope.GetAdjective] 生存越来越充满激情，并视自己为 [gm_3_greek_scope.GetName] 新时代的中心人物。"
 me_greek_3_italiote.1.t:0 "$greek_3_italiote$: 奇怪的时代"
 me_greek_3_italiote.10.a:0 "我们将援助我们的殖民者！"
 me_greek_3_italiote.10.b:0 "送他们一份礼物，仅此而已。"
 me_greek_3_italiote.10.c:0 "时代变了；他们必须自力更生。"
 me_greek_3_italiote.10.desc:0 "来自城市 [gm_3_greek_scope.GetCapital.GetName] 的使者呼吁我们作为他们的母城，提供援助。他们请求在这些艰难时期给予任何可能的帮助以支持我们的殖民地同胞。"
 me_greek_3_italiote.10.t:0 "$greek_3_13$: [gm_3_greek_scope.GetAdjective] 殖民者"
 me_greek_3_italiote.11.a:0 "永恒之城。"
 me_greek_3_italiote.11.at:0 "$mission_task_completed_tt_1$$greek_3_10$$mission_task_completed_tt_2$"
 me_greek_3_italiote.11.desc:0 "[gm_3_greek_scope.GetCapital.GetName] 作为 [gm_3_greek_scope.GetName] 的首都，现在是一个拥有无数居民的繁华都市，完全可以与希腊的古老城市以及其他曾经伟大的世界城市相媲美。"
 me_greek_3_italiote.11.t:0 "$greek_3_10$: 辉煌的 [gm_3_greek_scope.GetCapital.GetName]"
 me_greek_3_italiote.12.a:0 "[gm_3_7_scope_1.GetName]"
 me_greek_3_italiote.12.at:0 "$mission_task_completed_tt_1$$greek_3_10$$mission_task_completed_tt_2$"
 me_greek_3_italiote.12.b:0 "[gm_3_7_scope_2.GetName]"
 me_greek_3_italiote.12.c:0 "[gm_3_7_scope_3.GetName]"
 me_greek_3_italiote.12.d:0 "[gm_3_7_scope_4.GetName]"
 me_greek_3_italiote.12.desc:0 "由于 [gm_3_greek_scope.GetName] 面临全面入侵的威胁，[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 开始倡导我们应该像过去那样向我们的希腊兄弟寻求帮助。\n\n目前的辩论集中在应该接触哪个国家。"
 me_greek_3_italiote.12.e:0 "[gm_3_7_scope_5.GetName]"
 me_greek_3_italiote.12.f:0 "[gm_3_7_scope_6.GetName]"
 me_greek_3_italiote.12.g:0 "还有其他国家。"
 me_greek_3_italiote.12.gt:0 "我们将考虑其他可能的国家。"
 me_greek_3_italiote.12.h:0 "我们必须独自站立。"
 me_greek_3_italiote.12.ht:0 "[gm_3_greek_scope.GetName] 将停止寻找帮助。"
 me_greek_3_italiote.12.t:0 "$greek_3_7$: 希腊援助"
 me_greek_3_italiote.12.tt:0 "我们将请求 #Y [gm_3_foreign_aid_target.GetName]#! 提供军队、资金和联盟的支持。"
 me_greek_3_italiote.13.a:0 "尽我们所能帮助他们。"
 me_greek_3_italiote.13.b:0 "他们会得到一些人手和资金。"
 me_greek_3_italiote.13.c:0 "乞丐！小偷！"
 me_greek_3_italiote.13.desc:0 "伊达利奥特城邦 [gm_3_greek_scope.GetName] 向我们发来了一封信，信中是 [gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 的信息。信中恳求我们在面临毁灭威胁时作为希腊同胞提供援助。"
 me_greek_3_italiote.13.t:0 "$greek_3_7$: 希腊援助"
 me_greek_3_italiote.14.a:0 "祝福你，[gm_3_foreign_aid_target.GetRuler.GetPraenomen]！"
 me_greek_3_italiote.14.b:0 "我们非常感激！"
 me_greek_3_italiote.14.c:0 "算了吧，这是无望的。"
 me_greek_3_italiote.14.ct:0 "我们将放弃请求。"
 me_greek_3_italiote.14.d:0 "我们必须再试一次。"
 me_greek_3_italiote.14.desc:0 "我们的使者带着 [gm_3_foreign_aid_target.GetRulerTitle] [gm_3_foreign_aid_target.GetRuler.GetPraenomen] 的回复从 [gm_3_foreign_aid_target.GetName] 返回。"
 me_greek_3_italiote.14.desc_1:0 "[gm_3_foreign_aid_target.GetRuler.GetSheHe|U]同意援助我们，派来士兵和资金，并同意结盟以震慑进一步的侵略者！"
 me_greek_3_italiote.14.desc_2:0 "他们报告说 [gm_3_foreign_aid_target.GetRuler.GetSheHe] 同意派遣志愿者和部分资金但没有更多，提到 [gm_3_foreign_aid_target.GetRuler.GetHerHis] 自身也面临着困难。"
 me_greek_3_italiote.14.desc_3:0 "[gm_3_foreign_aid_target.GetRuler.GetSheHe|U] 拒绝向我们提供援助，指责我们的统治者如此软弱，像个乞丐一样乞讨，[gm_3_greek_scope.GetRuler.GetSheHe] 应该感到羞耻。"
 me_greek_3_italiote.14.dt:0 "我们将接近另一个国家。"
 me_greek_3_italiote.14.t:0 "$greek_3_7$: [gm_3_foreign_aid_target.GetName] 回应"
 me_greek_3_italiote.15.a:0 "我们都是兄弟。"
 me_greek_3_italiote.15.at:0 "$me_gre_task_start_tt_3$ 组织伊达利奥特联盟。"
 me_greek_3_italiote.15.desc:0 "曾几何时，伊达利奥特联盟只是纸上谈兵；互相援助的城市共同行动。\n\n随着我们的影响力增强，[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 认为是时候让这个联盟成为我们身份的核心，接纳所有伊达利奥特人为同胞。"
 me_greek_3_italiote.15.t:0 "$greek_3_4$: 希望在增长"
 me_greek_3_italiote.16.a:0 "我们将团结一切。"
 me_greek_3_italiote.16.at:0 "$mission_task_completed_tt_1$$greek_3_4$$mission_task_completed_tt_2$"
 me_greek_3_italiote.16.desc:0 "我们成功建立了伊达利奥特联盟，尽管它比以往任何时候都更加统一。\n\n通过这一步骤，我们声称对所有伊达利奥特希腊人的领导权，因此整个大希腊都在我们的领导下。"
 me_greek_3_italiote.16.t:0 "$greek_3_4$: 新的黎明"
 me_greek_3_italiote.16.tt:0 "[gm_3_greek_scope.GetName]对所有意大利希腊城市提出宣称。"
 me_greek_3_italiote.16.tt1:0 "所有伊达利奥特附属国已被吞并。"
 me_greek_3_italiote.16.tt2:0 "至少有一个伊达利奥特城邦屈服于我们的领导。"
 me_greek_3_italiote.16.tt3:0 "没有伊达利奥特城邦屈服于我们的领导。"
 me_greek_3_italiote.17.a:0 "希腊人重新掌控局面。"
 me_greek_3_italiote.17.at:0 "$mission_task_completed_tt_1$$greek_3_5$$mission_task_completed_tt_2$"
 me_greek_3_italiote.17.desc:0 "我们终于克服了内陆地区的意大利部落，其崛起动摇了我们祖先的伊达利奥特霸权。愿 [SCOPE.Custom('gre_mission_3_5_custom_loc')] 再也不复存在！"
 me_greek_3_italiote.17.t:0 "$greek_3_5$"
 me_greek_3_italiote.18.a:0 "确实的大希腊。"
 me_greek_3_italiote.18.at:0 "$mission_task_completed_tt_1$$greek_3_12$$mission_task_completed_tt_2$"
 me_greek_3_italiote.18.desc:0 "我们完成了不可能的任务，将意大利政府驱逐出南意大利，确保整个大希腊处于希腊统治之下。我们必须确保意大利永远保持希腊特色，为了我们的子孙后代。"
 me_greek_3_italiote.18.t:0 "$greek_3_12$"
 me_greek_3_italiote.19.a:0 "我们需要尽可能多的人。"
 me_greek_3_italiote.19.at:0 "$me_gre_task_start_tt_3$ 确保雇佣军合同。"
 me_greek_3_italiote.19.desc:0 "意大利的希腊城市从来无法让本土人口增长到足以支撑如希腊那样的军队。相反，雇佣军合同的交易十分活跃，许多意大利战士为了荣耀和战利品宣誓效忠。"
 me_greek_3_italiote.19.t:0 "$greek_3_8$: 为报酬而战"
 me_greek_3_italiote.2.a:0 "现在是时候了。"
 me_greek_3_italiote.2.at:0 "任务 '#Y $greek_3_italiote$#!' 已经 #G 完成#!!"
 me_greek_3_italiote.2.desc:0 "我们的小城邦在过去几年里受到几位爱国者的鼓舞，成功地成为大希腊的主导力量和伊达利奥特人的统一者。也许这只是开始，谁知道这样一个强大而狡猾的民族未来会怎样？"
 me_greek_3_italiote.2.t:0 "$greek_3_italiote$: 大希腊"
 me_greek_3_italiote.20.a:0 "他们将为我们和自己赢得荣耀。"
 me_greek_3_italiote.20.at:0 "$mission_task_completed_tt_1$$greek_3_12$$mission_task_completed_tt_2$"
 me_greek_3_italiote.20.desc:0 "在确保合同的同时，一位经验丰富的意大利老兵 [gm_3_merc_scope.GetPraenomen] 主动向 [gm_3_greek_scope.GetName] 表示愿意再次战斗。"
 me_greek_3_italiote.20.t:0 "$greek_3_8$: 渴望储备"
 me_greek_3_italiote.20.tt:0 "[gm_3_merc_scope.GetPraenomen] 加入我们的宫廷。"
 me_greek_3_italiote.21.a:0 "希腊人不向野蛮人低头。"
 me_greek_3_italiote.21.at:0 "$mission_task_completed_tt_1$$greek_3_11$$mission_task_completed_tt_2$"
 me_greek_3_italiote.21.desc:0 "我们发挥了关键作用，扩大了大希腊地区希腊殖民地的力量，使它们不再害怕野蛮人的统治。整个大希腊的伊达利奥特人都欢呼雀跃，因为他们终于自由了！"
 me_greek_3_italiote.21.t:0 "$greek_3_11$"
 me_greek_3_italiote.22.a:0 "超越希腊。"
 me_greek_3_italiote.22.at:0 "$mission_task_completed_tt_1$$greek_3_17$$mission_task_completed_tt_2$"
 me_greek_3_italiote.22.desc:0 "我们终于声称对整个大希腊的领导权，因为我们已经将大部分城市统一在我们的领导下。我们的领导者，[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 因为统一了争吵不休的大希腊城市而被称为‘Omagyrios’，即组装者。\n\n有了统一的目标，伊达利奥特城市终于可以通过汇集资源来应对新时代的各种新型威胁。"
 me_greek_3_italiote.22.t:0 "$greek_3_17$"
 me_greek_3_italiote.23.a:0 "向着荣耀前进！"
 me_greek_3_italiote.23.at:0 "$mission_task_completed_tt_1$$greek_3_6$$mission_task_completed_tt_2$"
 me_greek_3_italiote.23.desc:0 "看来我们的方向转变正在结出果实，[gm_3_greek_scope.GetName] 再次成为大希腊地区的重要角色。我们必须确保这一势头得以保持！"
 me_greek_3_italiote.23.t:0 "$greek_3_6$"
 me_greek_3_italiote.24.a:0 "$me_greek_4_west.2.a$"
 me_greek_3_italiote.24.at:0 "$mission_task_completed_tt_1$$greek_3_6$$mission_task_completed_tt_2$"
 me_greek_3_italiote.24.desc_1:0 "随着与西西里的战略连接得到保障，我们剥夺了西西里人其中一个最重要的城市，并在贸易机会和税收方面获得了大量利益。"
 me_greek_3_italiote.24.desc_2:0 "我们的城市最初是由伊阿皮吉亚人建立的，我们成功地重新征服了这个意大利部落的核心土地。通过将他们的传统与我们自己的传统融合，我们将能够从中受益。"
 me_greek_3_italiote.24.desc_3:0 "伊利里亚海岸线在某些地方得到了保障，为我们提供了新的贸易和海盗活动途径。仅收入就应该是相当可观的，许多人视此为我们人民跨越波涛的新纪元。"
 me_greek_3_italiote.24.t:0 "$greek_3_18$"
 me_greek_3_italiote.25.a:0 "西西里人值得更好的。"
 me_greek_3_italiote.25.at:0 "$mission_task_completed_tt_1$$greek_3_15$$mission_task_completed_tt_2$"
 me_greek_3_italiote.25.desc:0 "动荡的叙拉古时代终于结束，以及她对我们$croton_area$的伊达利奥特城市的侵略也一去不复返了。在我们的统治下，西西里人将会把那些日子视为过去痛苦的记忆，相比我们仁慈的统治而言。"
 me_greek_3_italiote.25.t:0 "$greek_3_15$"
 me_greek_3_italiote.26.desc_1:0 "可惜，[gm_old_family_head.GetFamilyDisplayAdjective]家族的[gm_old_family_head.GetPraenomen]过世了，留下了[gm_old_family_head.GetHerHis]未完成的项目。\n\n"
 me_greek_3_italiote.26.desc_2:0 "[gm_old_family_head.GetPraenomen] 由于不明事件离开了 [gm_3_greek_scope.GetName] 并且不再能继续我们的行动。\n\n"
 me_greek_3_italiote.26.desc_3:0 "看来[gm_old_family_head.GetPraenomen]的运气到头了，遭到关押，再也不能为我们的事业效劳了。\n\n"
 me_greek_3_italiote.26.desc_4:0 "[gm_old_family_head.GetSheHe|U] 被 [gm_family_head_3.GetPraenomen] 所取代，其家族已经超过了旧对手。\n\n"
 me_greek_3_italiote.26.desc_5:0 "[gm_old_family_head.GetSheHe|U] 被 [gm_family_head_3.GetPraenomen] 所取代，成为了 [gm_old_family_head.GetFamilyDisplayAdjective] 家族的新家长。"
 me_greek_3_italiote.26.t:0 "$greek_3_italiote$: [gm_family_head_3.GetName] 的崛起"
 me_greek_3_italiote.27.a:0 "这不公平..."
 me_greek_3_italiote.27.at:0 "使命“#Y $greek_3_italiote$#!”已被#R 放弃#!！"
 me_greek_3_italiote.27.desc:0 "随着一个大希腊国家的创建，我们统一意大利希腊人的梦想破灭了。我们将不得不寻找其他方法来维持我们的力量和独立性。"
 me_greek_3_italiote.27.t:0 "$greek_3_italiote$: 被偷走的梦想"
 me_greek_3_italiote.3.a:0 "我们必须行动。"
 me_greek_3_italiote.3.at:0 "$me_gre_task_start_tt_3$ 激励人民。"
 me_greek_3_italiote.3.b:0 "我们必须行动。"
 me_greek_3_italiote.3.desc:0 "[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 正领导辩论并鼓励改变我们的外交政策以反映这一点。"
 me_greek_3_italiote.3.desc_1:0 "[gm_3_greek_scope.GetName] 曾经有过更好的日子，快速变化的时代揭示了如果我们的城市要生存下去，就需要采取激进行动。"
 me_greek_3_italiote.3.desc_2:0 "长期以来，[gm_3_greek_scope.GetName] 一直受制于 [gm_3_greek_scope.GetOverlord.GetName] 的统治，如果我们的城市要生存下去，我们必须采取激进行动。"
 me_greek_3_italiote.3.t_1:0 "$greek_3_2$: 行动号召"
 me_greek_3_italiote.3.t_2:0 "$greek_3_1$: 行动号召"
 me_greek_3_italiote.4.a:0 "这是我们的时代。"
 me_greek_3_italiote.4.at:0 "$mission_task_completed_tt_1$$greek_3_2$$mission_task_completed_tt_2$"
 me_greek_3_italiote.4.b:0 "[gm_3_greek_scope.GetName] 将会自由。"
 me_greek_3_italiote.4.bt:0 "$mission_task_completed_tt_1$$greek_3_1$$mission_task_completed_tt_2$"
 me_greek_3_italiote.4.desc:0 "剩下的就是声明我们生存和幸福的权利。"
 me_greek_3_italiote.4.desc_1:0 "[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 因其呼吁 [gm_3_greek_scope.GetName] 投入战斗的演讲而广受赞誉，并赢得了政治分歧各方的支持。"
 me_greek_3_italiote.4.desc_2:0 "[gm_3_greek_scope.GetRulerTitle] [gm_3_greek_scope.GetRuler.GetPraenomen] 通过演讲激发了对我们的领主的强烈不满，人们大声疾呼自治。"
 me_greek_3_italiote.4.t_1:0 "$greek_3_2$: 正义事业"
 me_greek_3_italiote.4.t_2:0 "$greek_3_1$: 正义事业"
 me_greek_3_italiote.5.a:0 "[gm_3_greek_scope.GetCapital.GetName] 将成为大希腊的明珠。"
 me_greek_3_italiote.5.at:0 "$mission_task_completed_tt_1$$greek_3_9$$mission_task_completed_tt_2$"
 me_greek_3_italiote.5.desc:0 "与所有的伊达利奥特城邦一样，在动荡中，我们的祖父辈们的辉煌岁月早已被遗忘，尤其是在意大利野蛮人崛起之后。\n\n随着我们的新举措，我们终于将城市恢复到了伟大状态——至少尽可能接近——并吸引了新的定居者来到这一地区。"
 me_greek_3_italiote.5.t:0 "$greek_3_9$: [gm_3_greek_scope.GetCapital.GetName]"
 me_greek_3_italiote.6.a:0 "专业化是通向完美的道路。"
 me_greek_3_italiote.6.at:0 "$me_gre_task_start_tt_3$ 引发辩论。"
 me_greek_3_italiote.6.desc:0 "在这个动荡的时代，我们需要一个强大的统一思想来聚集我们的资源和努力作为一种生存手段。\n\n伊达利奥特殖民地见证了本地和外来思想的混合，在接下来的日子里将不乏争论。"
 me_greek_3_italiote.6.t:0 "$greek_3_19$: [gm_3_greek_scope.GetAdjective] 辩论"
 me_greek_3_italiote.7.a:0 "我们著名的骑兵必须是我们关注的焦点。"
 me_greek_3_italiote.7.at:0 "这个选项可用因为我们是 #Y [gm_3_greek_scope.GetName]#!。\n\n"
 me_greek_3_italiote.7.b:0 "我们依赖我们的流浪舰队。"
 me_greek_3_italiote.7.c:0 "毕达哥拉斯的教学将带领我们走向未来。"
 me_greek_3_italiote.7.d:0 "应鼓励哲学和学习。"
 me_greek_3_italiote.7.desc:0 "一场激烈的辩论已经被点燃，各派都认为国家的未来取决于不同的道路。\n\n"
 me_greek_3_italiote.7.desc_1:0 "我们的城市因开创了袭扰骑兵战术而闻名，并且这种战术已经在整个希腊世界得到广泛采用，这是非常合理的。\n\n"
 me_greek_3_italiote.7.desc_10:0 "$me_greek_3_italiote_some_point_desc$效仿哈尔基斯，我们鼓励提升我们的造船技术，并依靠我们城墙的力量。"
 me_greek_3_italiote.7.desc_11:0 "$me_greek_3_italiote_some_point_desc$效仿佛西斯，其殖民地通过强调造船技术和与外国人群体紧密共存而繁荣。"
 me_greek_3_italiote.7.desc_2:0 "本质上，我们是一群流浪的水手，我们的祖先从伊奥尼亚逃离，然后是科西嘉，寻求在波涛之上建立家园。\n\n"
 me_greek_3_italiote.7.desc_3:0 "我们与毕达哥拉斯——这位出生于克罗同并在麦塔蓬提昂安葬的数学家和智者的宗教和遗产之间的紧密联系备受推崇，他的学派至今仍然繁荣。\n\n"
 me_greek_3_italiote.7.desc_5:0 "$me_greek_3_italiote_some_point_desc$斯巴达，鼓励采用严格的训练技术和追求军事完美。"
 me_greek_3_italiote.7.desc_6:0 "$me_greek_3_italiote_some_point_desc$效仿雅典，我们鼓励掌握船舶建造和海军作战的技术。"
 me_greek_3_italiote.7.desc_7:0 "$me_greek_3_italiote_some_point_desc$效仿叙拉古，我们鼓励充分利用意大利丰富的雇佣兵和人力资源。"
 me_greek_3_italiote.7.desc_8:0 "$me_greek_3_italiote_some_point_desc$效仿亚该亚，我们鼓励采用积极进取的战术，并通过增强内部团结来促进招募。"
 me_greek_3_italiote.7.desc_9:0 "$me_greek_3_italiote_some_point_desc$效仿洛克里斯，我们鼓励虔诚并重视防御。"
 me_greek_3_italiote.7.e:0 "我们的军队必须强大。"
 me_greek_3_italiote.7.f:0 "海洋是我们的力量。"
 me_greek_3_italiote.7.g:0 "我们应该回归我们的根源。"
 me_greek_3_italiote.7.gt:0 "这个选项可用因为我们的母邦是 #Y [SCOPE.Custom('get_gre_3_metropolis_2')]#!。\n\n"
 me_greek_3_italiote.7.t:0 "$greek_3_19$: 新发现的热情"
 me_greek_3_italiote.7.tt:0 "$mission_task_completed_tt_1$$greek_3_19$$mission_task_completed_tt_2$"
 me_greek_3_italiote.8.a:0 "派遣使者。"
 me_greek_3_italiote.8.at:0 "$me_gre_task_start_tt_3$ 接近 [me_gre_3_13_target.GetName]。"
 me_greek_3_italiote.8.desc:0 "据说我们城市的创始人主要来自 [SCOPE.Custom('get_gre_3_metropolis_1')]，在这些艰难时期有人建议我们尝试利用这些古老的联系来获取优势。\n\n我们的使者准备好出发前往希腊进行长途旅行。"
 me_greek_3_italiote.8.t:0 "$greek_3_13$: 殖民地情感"
 me_greek_3_italiote.9.a:0 "[me_gre_3_13_target.GetName] 和 [gm_3_greek_scope.GetName]。"
 me_greek_3_italiote.9.b:0 "著名的 [me_gre_3_13_target.GetAdjective] 慷慨。"
 me_greek_3_italiote.9.c:0 "就是这样吗？"
 me_greek_3_italiote.9.desc:0 "我们的使者从 [me_gre_3_13_target.GetName] 返回，带来了他们对我们请求回应的消息。\n\n他们高兴地报告说，[me_gre_3_13_target.GetName] 热情地同意了，甚至送来了银子礼物，并同意结盟！更重要的是，听到我们困境的定居者们来到了意大利寻找新的生活！\n\n他们报告说，[me_gre_3_13_target.GetName] 给我们送来了礼物，包括一些渴望在意大利开始新生活的定居者，但并没有我们希望的那种友谊的爆发。\n\n他们沮丧地报告说，[me_gre_3_13_target.GetName] 粗暴地拒绝了他们，当他们自己都处于如此艰难的情况下，嘲笑我们索要救济的要求……"
 me_greek_3_italiote.9.desc_1:0 "他们欣喜地汇报称，[me_gre_3_13_target.GetName] 热情响应，不仅送来了银制礼物，还同意与我们结盟！此外，听闻我们困境的移民们也纷纷前来意大利寻求新的生活机会！"
 me_greek_3_italiote.9.desc_2:0 "他们汇报称，[me_gre_3_13_target.GetName] 向我们赠送了实物礼物，并送来了一些渴望在意大利开启新生活的移民，然而，这种友好表示并未达到我们所期望的程度。"
 me_greek_3_italiote.9.desc_3:0 "他们沮丧地汇报称，[me_gre_3_13_target.GetName] 粗鲁地打发了他们，对我们提出的援助请求嗤之以鼻，因为对方自身也正处于困境之中……"
 me_greek_3_italiote.9.t:0 "$greek_3_13$: 母邦情感"
 me_greek_3_italiote.9.tt:0 "$mission_task_completed_tt_1$$greek_3_13$$mission_task_completed_tt_2$"
 me_greek_3_italiote_some_point_desc:0 "有人指出，我们作为佛西斯的殖民地继承了其传统"
 me_greek_4_west.1.a:0 "[ROOT.GetCountry.GetName]的人们支持你，[ROOT.GetCountry.GetRuler.GetFirstName]！"
 me_greek_4_west.1.desc:0 "尽管我们的前辈们尽了最大的努力阻止潮流，命运依然对地中海西方的希腊人越来越严苛，越来越多的殖民地落入当地部落和与我们激烈竞争的布匿人手中。\n\n我们的利益常常被[GetCountry('CAR').GetName]损害，他们在#E 撒耳多姆海#!公然挑衅我们——[GetProvince('(int32)3256').GetName]是敌非友，无需预见之才能，也可知晓我们必有一战。\n\n在这种阴郁的气氛中，一位名为[gm_family_head_4.GetName]，十分雄心勃勃的官员脱颖而出，鼓吹为[ROOT.GetCountry.GetAdjective]带来一个新的大胆扩张时代，保护我们的城市，扭转我们的气运，[ROOT.GetCountry.GetRuler.GetName]承诺以这些神的祝福带领[ROOT.GetCountry.GetName]达到前所未有的高度。"
 me_greek_4_west.1.t:0 "$greek_4_west$: 资源丰富的 [gm_family_head_4.GetFamilyDisplayAdjective]s"
 me_greek_4_west.10.at:0 "[gm_hellenic_reclamation_scope.GetName]会被释放为藩属。"
 me_greek_4_west.10.b:0 "我们欠 [gm_family_head_4.GetPraenomen] 一个人情。"
 me_greek_4_west.10.desc:0 "随着 [gm_hellenic_reclamation_scope.GetName] 的收购，[gm_family_head_4.GetFamilyDisplayAdjective] 家族抓住机会增加其财产组合。\n\n虽然他们在鼓励我们的扩张和雄心方面发挥了重要作用，但也有人建议给予该城市一定的自治权。"
 me_greek_4_west.10.tt:0 "$mission_task_completed_tt_1$$greek_4_6$$mission_task_completed_tt_2$"
 me_greek_4_west.11.at:0 "$me_gre_task_start_tt_4$ 评估野蛮人控制的港口。"
 me_greek_4_west.11.desc:0 "[gm_family_head_4.GetPraenomen] 正在组织商人团队来调查各种野蛮人的城市，评估它们的价值以及当前所有者的友好程度。"
 me_greek_4_west.12.a:0 "是的，是的，去吧。"
 me_greek_4_west.12.at:0 "$me_gre_task_start_tt_4$ 评估自由殖民地。"
 me_greek_4_west.12.desc:0 "我们可以依靠 [gm_family_head_4.GetPraenomen] [gm_family_head_4.GetFamilyDisplayAdjective] 给我们一个关于我们面前的各种机会的诚实评价——我们的利益完美一致。"
 me_greek_4_west.12.desc_1:0 "我们现在有能力扩展对我们过去找到自己道路的其他马赛利亚殖民地的影响力。\n\n"
 me_greek_4_west.12.t:0 "$greek_4_5$: 希腊使节"
 me_greek_4_west.14.a:0 "形势正在好转。"
 me_greek_4_west.14.at1:0 "$mission_task_completed_tt_1$$greek_4_1$$mission_task_completed_tt_2$"
 me_greek_4_west.14.desc:0 "近来在地中海沿岸获得新的贸易站，使[gm_family_head_4.GetName]的抱负大受鼓舞；收入增长让[gm_family_head_4.GetHerHis]十分满意。\n\n自然，[ROOT.GetCountry.GetRuler.GetName]也很高兴听闻这些正在向[ROOT.GetCountry.GetName]敞开的经济机会，并且一直在私下悄悄询问商机。\n\n"
 me_greek_4_west.14.desc_1:0 "高卢海岸的前哨将成为北岸希腊影响力的要塞。"
 me_greek_4_west.14.desc_2:0 "北伊比利亚海岸的前哨是整个地区最富有的，肯定会给我们带来巨大的财富。"
 me_greek_4_west.14.desc_3:0 "东伊比利亚海岸的前哨将确保我们在该地区的希腊影响力和强大的贸易网络。"
 me_greek_4_west.14.desc_4:0 "南伊比利亚终于开放给希腊开发，脱离了布匿人的手中；这些古老的港口将重生。"
 me_greek_4_west.14.desc_5:0 "确保西地中海丰富的布匿前哨将削弱他们的财库，并增强我们在该地区的希腊影响力。"
 me_greek_4_west.14.t:0 "$greek_4_7$"
 me_greek_4_west.14.tt:0 "相关领土的状态接收："
 me_greek_4_west.15.a:0 "我们会使它们成为不可忽视的武力。"
 me_greek_4_west.15.b:0 "减轻搭载，并只招募最好的桨手。"
 me_greek_4_west.15.desc:0 "我们庞大的海上网络需要一支同样庞大的海军，能够保护我们的商人免受袭击者、掠夺者和对手的侵害——不幸的是，多年来 [ROOT.GetCountry.GetName] 树敌无数。然而，我们信任我们的海军力量保护我们免受任何威胁，特别是有 [SCOPE.sCharacter('gm_4_euxine_admiral').GetName] 担任舰队指挥官。[SCOPE.sCharacter('gm_4_euxine_admiral').GetFirstName] 是一位无可挑剔的人，来自古老的家族，是一位技艺高超的海军上将，并发誓要保护 [ROOT.GetCountry.GetName] 免受任何敢于威胁她的人。\n\n现在让我们决定是否让我们的中队专门用于速度或生存能力。"
 me_greek_4_west.15.t:0 "$greek_4_11$"
 me_greek_4_west.15.tt:0 "$mission_task_completed_tt_1$$greek_4_11$$mission_task_completed_tt_2$"
 me_greek_4_west.16.a:0 "我们会看看他们喜欢这样吗。"
 me_greek_4_west.16.at:0 "$mission_task_completed_tt_1$$greek_4_3$$mission_task_completed_tt_2$"
 me_greek_4_west.16.desc:0 "我们从布匿威胁中安全地保住了赫拉克勒斯之柱，现已成为远西地区无可争议的贸易主宰。迦太基人再也不能为了自身利益而决定谁能通过海峡航行。"
 me_greek_4_west.16.t:0 "$greek_4_3$"
 me_greek_4_west.17.a:0 "一切都归结于金钱。"
 me_greek_4_west.17.b:0 "它必须是一座希腊堡垒。"
 me_greek_4_west.17.desc:0 "[me_gre_4_hub_scope.GetName] 中心是一个繁荣的贸易港口，来自整个地中海的商人都聚集在这里讨价还价，推销他们的商品。\n\n这座城市可媲美东方的任何一座城市，并可能成为世界上最重要的一座希腊城市。"
 me_greek_4_west.17.t:0 "$greek_4_2$"
 me_greek_4_west.17.tt:0 "$mission_task_completed_tt_1$$greek_4_2$$mission_task_completed_tt_2$"
 me_greek_4_west.18.a:0 "让我们接近 [gm_4_colony_scope_1.GetName]。"
 me_greek_4_west.18.b:0 "那 [gm_4_colony_scope_2.GetName] 怎么样？"
 me_greek_4_west.18.c:0 "应该是 [gm_4_colony_scope_3.GetName]。"
 me_greek_4_west.18.d:0 "[gm_4_colony_scope_4.GetName] 非常有前途。"
 me_greek_4_west.18.desc:0 "我们的商人带来了剩余愿意接受我们保护的马赛利亚殖民地的评估。\n\n然而，他们只有在较弱且信任我们的情况下才可能接受。"
 me_greek_4_west.18.e:0 "不，必须是 [gm_4_colony_scope_5.GetName]。"
 me_greek_4_west.18.f:0 "蠢货，只有 [gm_4_colony_scope_6.GetName] 是合适的。"
 me_greek_4_west.18.g:0 "[SCOPE.Custom('gm_1_get_go_back_colony')]"
 me_greek_4_west.18.gt:0 "我们将考虑其他可能的殖民地。"
 me_greek_4_west.18.ht:0 "[gm_4_greek_scope.GetName] 将停止尝试接近殖民地。"
 me_greek_4_west.18.t:0 "$greek_4_5$: 希腊政府"
 me_greek_4_west.18.tt:0 "我们将以#G [SCOPE.ScriptValue('gm_4_colony_value')]#! @gold!的提议接近#Y [gm_4_colony_target_scope.GetName]#!，使其成为我们的藩属。\n接受的可能性受#Y [gm_family_head_4.GetPraenomen]#!的魅力、国家相对规模和外交好感度的影响。[SCOPE.Custom('gm_4_chance_colony')]\n如果他们拒绝，我们将获得对所有 [gm_4_colony_target_scope.GetAdjective]领土的宣称。"
 me_greek_4_west.19.bt:0 "如果 #Y [gm_4_greek_scope.GetName]#! 接受，我们将收到双倍的钱以交换成为他们的附庸国 (#G [SCOPE.ScriptValue('gm_4_colony_double_value')]#! @gold!)，否则他们会获得宣称权。"
 me_greek_4_west.19.ct:0 "[gm_4_greek_scope.GetName] 获得对我们所有领土的宣称权。"
 me_greek_4_west.19.desc:0 "我们被来自 [gm_4_greek_scope.GetName] 的商人接触，他们代表他们的政府。他们想为我们提供保护，以换取一份礼物，尽管很明显他们的真正意图是扩大自己的影响力..."
 me_greek_4_west.19.t:0 "$greek_4_5$: [gm_4_greek_scope.GetAdjective] 提议"
 me_greek_4_west.2.a:0 "这是我们的时代！"
 me_greek_4_west.2.at:0 "任务 '#Y $greek_4_west$#!' 已被 #G 完成#!!"
 me_greek_4_west.2.desc:0 "我们完成了不可能的任务，既生存下来对抗门口野蛮人的攻击，又战胜了狡猾的布匿商人。我们的帝国横跨地中海，无数城市依赖于我们的贸易网络生存。谁能想到我们可以走到这么远？"
 me_greek_4_west.2.t:0 "$greek_4_west$: 马赛利亚的主导地位"
 me_greek_4_west.20.desc:0 "[gm_family_head_4.GetName] 派出与 [gm_4_colony_target_scope.GetName] 谈判的商人们已经返回 "
 me_greek_4_west.20.desc_1:0 "带着他们的 [gm_4_colony_target_scope.GetRulerTitle], [gm_4_colony_target_scope.GetRuler.GetPraenomen] 同意条款！\n\n我们已派出承诺的资金以及一组官员，他们将监督作为 [gm_4_greek_scope.GetAdjective] 附庸的 [gm_4_colony_target_scope.GetAdjective] 纳贡。"
 me_greek_4_west.20.desc_2:0 "带着他们的 [gm_4_colony_target_scope.GetRulerTitle], [gm_4_colony_target_scope.GetRuler.GetPraenomen] 提出的反报价。\n\n他们准备接受我们的保护并支付贡金，但要求更高的价格。"
 me_greek_4_west.20.desc_3:0 "带着他们的 [gm_4_colony_target_scope.GetRulerTitle], [gm_4_colony_target_scope.GetRuler.GetPraenomen] 的直接拒绝。\n\n信中声称他们完全有能力自卫，并且 [gm_4_colony_target_scope.GetAdjective] 人民不会为了利益而出卖自由。"
 me_greek_4_west.20.t:0 "$greek_4_5$: [gm_4_colony_target_scope.GetAdjective] 谈判"
 me_greek_4_west.20.tt:0 "$mission_task_completed_tt_1$$greek_4_14$$mission_task_completed_tt_2$"
 me_greek_4_west.21.desc:0 "我们对 [gm_4_greek_scope.GetName] 的反报价终于得到了回应。\n\n"
 me_greek_4_west.21.desc_1:0 "看来他们渴望扩大对所有福西亚人的影响力，并接受了我们的高价要求！"
 me_greek_4_west.21.t:0 "$greek_4_5$: 来自 [gm_4_greek_scope.GetName] 的回应"
 me_greek_4_west.22.a:0 "向北的道路已经打开。"
 me_greek_4_west.22.at:0 "$mission_task_completed_tt_1$$greek_4_19$$mission_task_completed_tt_2$"
 me_greek_4_west.22.desc:0 "传说中的奥利西波港几个世纪以来一直是商人们的遥远梦想；有些人认为它根本不存在，而另一些人则知道它是从北方进口稀有矿物和其他商品的中心。\n\n作为一个希腊化的港口，这座城市将成为我们在西伊比利亚的核心存在。"
 me_greek_4_west.22.t:0 "$greek_4_19$"
 me_greek_4_west.23.a:0 "我们不会再失去它。"
 me_greek_4_west.23.at:0 "$mission_task_completed_tt_1$$greek_4_12$$mission_task_completed_tt_2$"
 me_greek_4_west.23.desc:0 "在一次公正的复仇行动中，我们最终逆转了伊特鲁里亚和布匿野蛮人对我们古老的科西嘉殖民地的卑鄙攻击。这个殖民地将再次成为一个重要的马赛利亚中心。"
 me_greek_4_west.23.t:0 "$greek_4_12$"
 me_greek_4_west.23.tt:0 "所有 #Y 马赛利亚#! 国家对 [gm_4_greek_scope.GetName] 的好感度增加 #G 25#!。"
 me_greek_4_west.24.a:0 "这是我们的命运。"
 me_greek_4_west.24.at:0 "$mission_task_completed_tt_1$$greek_4_13$$mission_task_completed_tt_2$"
 me_greek_4_west.24.desc:0 "通过征服巴利阿里群岛和撒丁岛，我们解决了一个使我们的人民受到布匿狗侮辱的百年宿怨。现在他们将不得不欣赏我们的实力，因为他们舔舐伤口准备下一轮。"
 me_greek_4_west.24.t:0 "$greek_4_13$"
 me_greek_4_west.25.a:0 "命运有时会晚到。"
 me_greek_4_west.25.at:0 "$mission_task_completed_tt_1$$greek_4_15$$mission_task_completed_tt_2$"
 me_greek_4_west.25.desc:0 "通过精明的管理和我们军队的勇敢，我们控制了许多迦太基人在西地中海最古老和最重要的贸易站。\n\n不再有任何疑问，我们注定要取代衰败的布匿霸权，成为内海的主宰。"
 me_greek_4_west.25.t:0 "$greek_4_15$"
 me_greek_4_west.26.a:0 "永不放弃！"
 me_greek_4_west.26.at:0 "$mission_task_completed_tt_1$$greek_4_16$$mission_task_completed_tt_2$"
 me_greek_4_west.26.b:0 "夺取一切权力！现在正是时候！"
 me_greek_4_west.26.desc:0 "经过多次尝试和辛勤努力，我们团结了被波斯野蛮人驱散的福西亚侨民，并在这个过程中在西地中海建立了一个希腊商业帝国。\n\n我们的人民欢呼雀跃，正如所有的马赛利亚人一样，因神的祝福而感到喜悦。过去的伤痛由于泰奇最近的馈赠而变得更容易承受。现在，我们的领袖 [gm_4_greek_scope.GetRulerTitle] [gm_4_greek_scope.GetRuler.GetPraenomen] 被亲切地称为‘Omagyrios’——统一者。"
 me_greek_4_west.26.t:0 "$greek_4_16$"
 me_greek_4_west.27.a:0 "历史不会重演。"
 me_greek_4_west.27.at:0 "$mission_task_completed_tt_1$$greek_4_17$$mission_task_completed_tt_2$"
 me_greek_4_west.27.desc:0 "克服重重困难，我们回到了被波斯火炬摧毁的城市福西亚，并重新建立了这座城市，这段历史至今仍是我们的人民深深哀悼的记忆。\n\n凭借新一代定居者的努力，福西亚将从灰烬中崛起，再次成为一座著名城市。"
 me_greek_4_west.27.t:0 "$greek_4_17$"
 me_greek_4_west.28.at:0 "任务'#Y $greek_4_5$#!'已被#R跳过#!!"
 me_greek_4_west.28.t:0 "$greek_4_5$: 命运"
 me_greek_4_west.29.a:0 "好，但也有坏处..."
 me_greek_4_west.29.at:0 "任务 '#Y $greek_4_west$#!' 已被 #R 放弃#!!"
 me_greek_4_west.29.desc:0 "似乎另一个马赛利亚殖民地与我们共享梦想，并已经承担起了西方希腊防御者的角色。我们必须找到另一种确保自身防御的方法。"
 me_greek_4_west.29.t:0 "$greek_4_west$: 共同愿望"
 me_greek_4_west.3.desc_1:0 "可惜，[gm_old_family_head.GetFamilyDisplayAdjective]家族的[gm_old_family_head.GetPraenomen]过世了，留下了[gm_old_family_head.GetHerHis]未完成的项目。\n\n"
 me_greek_4_west.3.desc_2:0 "[gm_old_family_head.GetPraenomen]在缘由不明的事件中，永远离开了[gm_1_greek_scope.GetName]，在也无法执行我们的行动了。\n\n"
 me_greek_4_west.3.desc_3:0 "看来[gm_old_family_head.GetPraenomen]的运气到头了，遭到关押，再也不能为我们的事业效劳了。\n\n"
 me_greek_4_west.3.desc_4:0 "[gm_old_family_head.GetSheHe|U] 被 [gm_family_head_4.GetPraenomen] 所取代，其家族已经超过了旧对手。\n\n"
 me_greek_4_west.3.desc_5:0 "[gm_old_family_head.GetSheHe|U] 被 [gm_family_head_4.GetPraenomen] 所取代，成为了 [gm_old_family_head.GetFamilyDisplayAdjective] 家族的新家长。"
 me_greek_4_west.3.t:0 "[gm_family_head_4.GetName] 的崛起"
 me_greek_4_west.30.at:0 "任务'#Y $greek_4_14$#!'已被#R跳过#!!"
 me_greek_4_west.30.t:0 "$greek_4_14$: 命运"
 me_greek_4_west.31.at:0 "$mission_task_completed_tt_1$$greek_4_31$$mission_task_completed_tt_2$"
 me_greek_4_west.31.t:0 "$greek_4_31$"
 me_greek_4_west.32.a:0 "我们比大多数人更了解萨鲁维亚人是如何战斗的..."
 me_greek_4_west.32.at:0 "$mission_task_completed_tt_1$$greek_4_32$$mission_task_completed_tt_2$"
 me_greek_4_west.32.desc:0 "终于，我们最终征服了居住在 #E 加利西亚湾#! 沿岸的令人头疼的高卢人。作为我们所征服的最强土著部落，#E 萨鲁维亚人#! 被授予了与我们的 [ROOT.GetCountry.GetAdjective] 族人相当的权利 - 这一决定是由 [ROOT.GetCountry.GetRuler.GetName] 出于半明显的原因推动的。\n\n看起来 [ROOT.GetCountry.GetRulerTitle] 希望安抚该地区，希望通过给予当地精英一些让步来降低紧张局势，但也着眼于增加 [ROOT.GetCountry.GetName] 可用的征兵数量。"
 me_greek_4_west.32.t:0 "$greek_4_32$"
 me_greek_4_west.33.a:0 "我自然知道在哪里能得到最好的价格"
 me_greek_4_west.33.at:0 "$mission_task_completed_tt_1$$greek_4_33$$mission_task_completed_tt_2$"
 me_greek_4_west.33.desc:0 "外国旅行者观察到，在 #E 高卢南部#! 海岸发现的 [ROOT.GetCountry.GetAdjective] 商栈中可以找到任何你想要的东西。\n\n除了像纺织品、谷物和农产品等常见物品外，由内陆野蛮人生产的最精美的奢侈品也会南下到达由 [ROOT.GetCountry.GetName] 所拥有的港口城市，在那里可以找到# from 来自遥远北方的琥珀@amber!# jewelry 和厚重的毛皮@fur!\n\n当然，访问市场的人们最喜欢的活动之一就是与以讨价还价闻名的[ROOT.GetCountry.GetAdjective]商人进行谈判。没有价格是固定的，所有合理的报价都会被考虑。"
 me_greek_4_west.33.t:0 "$greek_4_33$"
 me_greek_4_west.34.a:0 "如果这些城墙倒塌，也没人能说我没尽力"
 me_greek_4_west.34.at:0 "$mission_task_completed_tt_1$$greek_4_34$$mission_task_completed_tt_2$"
 me_greek_4_west.34.desc:0 "[ROOT.GetCountry.GetRuler.GetName] 最大的恐惧之一是野蛮人群涌过我们的边界，压倒我们的防御。我们的祖先曾因波斯人而遭受失去家园的耻辱，[ROOT.GetCountry.GetRuler.GetFirstName] 私下里担心历史可能会重演，特别是如果 [ROOT.GetCountry.GetName] 不够谨慎。\n\n出于保护我们在 #E 山北高卢#! 的马叙利亚兄弟免于失去他们辛苦得来的成果的愿望，[ROOT.GetCountry.GetRuler.GetFirstName] 支付了大量资金以加固 [GetProvince('(int32)2311').GetName] 和 [GetProvince('(int32)2297').GetName] 附近的关隘。\n\n尽管没有人知道未来，但不可否认的是，[ROOT.GetCountry.GetRuler.GetFirstName] 已经为保护人民尽了最大努力。"
 me_greek_4_west.34.t:0 "$greek_4_34$"
 me_greek_4_west.35.a:0 "我已经为 [ROOT.GetCountry.GetName] 宣称了整个科西嘉 - 很快，非常快..."
 me_greek_4_west.35.at:0 "$mission_task_completed_tt_1$$greek_4_35$$mission_task_completed_tt_2$"
 me_greek_4_west.35.desc:0 "尽管 [ROOT.GetCountry.GetRuler.GetName] 讨厌向 [GetProvince('(int32)3515').GetName] 的港口当局行贿的想法，尤其是考虑到这里曾经是从我们祖先手中夺走的马叙利亚殖民地，但实用主义占了上风，任何自尊受损的感觉都被悄悄搁置。\n\n现在 [ROOT.GetCountry.GetCapital.GetName] 有了一个正规的市场，[ROOT.GetCountry.GetRuler.GetFirstName] 对于其摊位和货架上的外来商品产生了兴趣，阿拉利亚很快成为了首选。我们的商船队熟悉这条路线，且靠近大陆的科西嘉岛 #E 科西嘉#! 成为了航行船只的一个热门目的地。\n\n商业谈判结束后，在回家的路上，[ROOT.GetCountry.GetRuler.GetFirstName] 向外交使团透露了一个会议中的惊人细节。看来 [ROOT.GetCountry.GetRulerTitle] 并没有忘记对 [ROOT.GetCountry.GetAdjective] 荣誉的轻蔑，或许有一天阿拉利亚会被解放。"
 me_greek_4_west.35.t:0 "$greek_4_35$"
 me_greek_4_west.36.a:0 "我们确实很幸运...在这里没什么可抱怨的"
 me_greek_4_west.36.at:0 "$mission_task_completed_tt_1$$greek_4_36$$mission_task_completed_tt_2$"
 me_greek_4_west.36.desc:0 "虽然在 #E 高卢#! 和 #E 伊比利亚#! 有充足的木材可供砍伐，但为什么 #E 科西嘉#! 的原始森林迅速成为 [ROOT.GetCountry.GetCapital.GetName] 船厂的主要木材供应地有很多原因。\n\n岛屿的中心位置使得我们可以轻松将货物送到需要的地方，更重要的是，当地人温和、和平；远比大陆上的野蛮部落更加文明。\n\n一切都在按计划进行；[ROOT.GetCountry.GetName] 现在有足够的木材快速建造她的船只，并从这有利可图的贸易中获利。"
 me_greek_4_west.36.t:0 "$greek_4_36$"
 me_greek_4_west.37.a:0 "有这些海盗作为我们的老师真是太好了"
 me_greek_4_west.37.at:0 "$mission_task_completed_tt_1$$greek_4_37$$mission_task_completed_tt_2$"
 me_greek_4_west.37.desc:0 "看到我们的 [ROOT.GetCountry.GetAdjective] 船只与来自 [GetProvince('(int32)1469').GetName] 的海盗舰队一起训练，这是一个奇特的景象，这些海盗以前一见到我们的海军就会发动攻击 - 但这都是在 [ROOT.GetCountry.GetRuler.GetName] 上台改变一切之前的事了。\n\n意识到马戈岛的居民是出色的水手，甚至可能与我们著名的 #E 福西亚#! 祖先不相上下，[ROOT.GetCountry.GetRuler.GetFirstName] 通过改善他们岛屿的基础设施赢得了这些臭名昭著的敌对海盗的支持——这是一项私掠者由于在 #E 巴利阿里海#! 游荡而忽视的任务。\n\n一旦这一关键友谊得以确立——谁能拒绝黄金的魅力呢——迈向改变命运的第一步就被踏出，现在我们来到了 [ROOT.GetCountry.GetName] 历史上又一个重要转折点 - 在 [ROOT.GetCountry.GetCapital.GetName] 和 #E 马戈#! 成立 #E 海军学院#!。\n\n这两所学校代表了我们对未来的希望，为我们的退役海军将领和经验丰富的袭击者提供了一个教导下一代 [ROOT.GetCountry.GetAdjective] 水手的地方。"
 me_greek_4_west.37.t:0 "$greek_4_37$"
 me_greek_4_west.38.a:0 "我的目光聚焦于 [GetProvince('(int32)84').GetName]..."
 me_greek_4_west.38.at:0 "$mission_task_completed_tt_1$$greek_4_38$$mission_task_completed_tt_2$"
 me_greek_4_west.38.desc:0 "今晚，在 [ROOT.GetCountry.GetCapital.GetName] 将举行一场庆祝活动，以表彰 [ROOT.GetCountry.GetRuler.GetName] 的军事成就，他成功征服了 #E 巴利阿里群岛#!，以及 #E 撒丁岛#! 和 #E 科西嘉#! 岛。\n\n虽然没有什么能真正替代失去我们古老的家园 [GetProvince('(int32)285').GetName] 的损失，但知道我们现在拥有整座岛屿可以称之为自己的地方，让我们国家感到安心——这给了我们重建未来的希望。\n\n[ROOT.GetCountry.GetRuler.GetFirstName] 曾经将 [ROOT.GetCountry.GetName] 比喻为船边的藤壶；一个勉强 clinging 到海岸的小城邦。但是那已经是过去，而现在我们已经占领了大片岛屿供我们的人民居住，并将在未来继续占领更多。"
 me_greek_4_west.38.t:0 "$greek_4_38$"
 me_greek_4_west.39.a:0 "[ROOT.GetCountry.GetName] 因此而注入了这种野蛮之血的力量"
 me_greek_4_west.39.at:0 "$mission_task_completed_tt_1$$greek_4_39$$mission_task_completed_tt_2$"
 me_greek_4_west.39.desc:0 "虽然我们承认 [ROOT.GetCountry.GetAdjective] 军事技术和战略的优越性，但我们的将军们也尴尬地承认，野蛮人在某些战斗技巧上表现出色，比如在森林中进行伏击式的打带跑作战。\n\n因此，[ROOT.GetCountry.GetRuler.GetName] 决定为 [ROOT.GetCountry.GetName] 采取一项极端措施，允许我们的部队与野蛮人部队一同战斗和训练，甚至让士兵们共用营地。\n\n为了缓解上层阶级对于 [ROOT.GetCountry.GetRulerTitle] 正在树立自己为民众拥护者的担忧，[ROOT.GetCountry.GetRuler.GetFirstName] 首先推动了一些法律变更，确保贵族处于我们军队的领导地位。有了我们贵族的儿子们带领萨鲁维亚-[ROOT.GetCountry.GetAdjective] 征兵进入战场，胜利几乎是确定无疑的。"
 me_greek_4_west.39.t:0 "$greek_4_39$"
 me_greek_4_west.40.a:0 "一位 [ROOT.GetCountry.GetRuler.GetWomanMan] 的名字就是他的命运 - 我听到了你们的声音，哦，希腊人！"
 me_greek_4_west.40.at:0 "$mission_task_completed_tt_1$$greek_4_40$$mission_task_completed_tt_2$"
 me_greek_4_west.40.desc:0 "尽管 [ROOT.GetCountry.GetCapital.GetName] 中的一些声音对我们 [ROOT.GetCountry.GetRuler.GetName] 所推行的几乎持续不断的军事扩张感到厌倦，但很难反驳 [ROOT.GetCountry.GetRulerTitle] 所采用的方法，特别是在像 [GetProvince('(int32)84').GetName] 这样的富裕城市落入我们手中之后。\n\n我们的力量花了一些时间才平息该地区，因为大量的叛乱分子和山贼试图利用低地的混乱局面，但 [ROOT.GetCountry.GetRuler.GetFirstName] 终结了这一切，击败了这些捣乱者，确保日常生活得以恢复。\n\n听到真正的希腊人驱逐了该地区的迦太基人的消息后，#E 大希腊#! 的欣喜若狂的公民赋予了 [ROOT.GetCountry.GetRuler.GetFirstName] ‘#E 解放者#!’ 的绰号，试图通过奉承来确保自身的自由。"
 me_greek_4_west.40.t:0 "$greek_4_40$"
 me_greek_4_west.41.a:0 "我们将看看他们所说是否属实..."
 me_greek_4_west.41.at:0 "$mission_task_completed_tt_1$$greek_4_41$$mission_task_completed_tt_2$"
 me_greek_4_west.41.desc:0 "随着 #E 伊比利亚#! 东海岸落入我们手中，主要城市的港口区正在扩展，带来了大量活动。\n\n当地野蛮人虽然为争取独立进行了激烈的战斗，但他们对自己处境的变化适应得很好，比预期更快地适应了作为 [ROOT.GetCountry.GetAdjective] 奴隶的生活。事实上，一些当地酋长，希望通过取悦 [ROOT.GetCountry.GetRuler.GetName] 来获取好感，建议我们进一步向内陆的 #E 塔拉科嫩西斯#! 进军，声称那里的山脉充满了银矿，且几乎不受当地部落的保护。"
 me_greek_4_west.41.t:0 "$greek_4_41$"
 me_greek_4_west.42.a:0 "恐怕这就是在 [ROOT.GetCountry.GetName] 做生意的代价"
 me_greek_4_west.42.at:0 "$mission_task_completed_tt_1$$greek_4_42$$mission_task_completed_tt_2$"
 me_greek_4_west.42.desc:0 "[ROOT.GetCountry.GetName] 在西地中海近乎垄断的一种最珍贵的商品是 #E 玻璃#! @glass!# ，而在 [GetProvince('(int32)1000').GetName] 和 [GetProvince('(int32)1003').GetName] 发现的大师级工匠无法生产足够的特色商品来满足巨大的需求。\n\n当埃姆波里的一些行会大师发现可以在 [GetProvince('(int32)1468').GetName] 生产高质量玻璃时，他们很快请求 [ROOT.GetCountry.GetRuler.GetName] 允许他们在那里扩展业务。\n\n他们得到了想要的东西，但狡猾的 [ROOT.GetCountry.GetRulerTitle] 所要的价格很高。[ROOT.GetCountry.GetRuler.GetFirstName] 从不错过任何机会，不仅说服贵族在所有三个省份建立 #E 玻璃作坊#!，还以某种方式说服他们承担在 [GetProvince('(int32)1468').GetName] 建设一座合适的城市的主要成本。"
 me_greek_4_west.42.t:0 "$greek_4_42$"
 me_greek_4_west.43.a:0 "这是我们辉煌文明当之无愧的声誉"
 me_greek_4_west.43.at:0 "$mission_task_completed_tt_1$$greek_4_43$$mission_task_completed_tt_2$"
 me_greek_4_west.43.desc:0 "在 [GetProvince('(int32)1000').GetName], [GetProvince('(int32)1003').GetName] 和 [GetProvince('(int32)1468').GetName] 的城市中，这三个因所生产的玻璃质量卓越而闻名世界的城邦，我们的大师级工匠不断改进他们的设计，追求卓越的方式令 [ROOT.GetCountry.GetRuler.GetName] 心生自豪。\n\n[ROOT.GetCountry.GetAdjective] 玻璃已成为奢华的代名词，只有最富有的上层阶级成员才能买得起我们商店制作的餐具。"
 me_greek_4_west.43.t:0 "$greek_4_43$"
 me_greek_4_west.44.a:0 "真是个绝妙的想法！"
 me_greek_4_west.44.at:0 "$mission_task_completed_tt_1$$greek_4_44$$mission_task_completed_tt_2$"
 me_greek_4_west.44.desc:0 "我们在 #E 伊比利亚#! 南部的城市接待了相当数量的外国访客，因为众所周知，我们的城墙坚固，气候宜人。而且谁又能责怪这些人渴望生活在一个阳光终年普照、微风轻拂成熟谷物田野的国度呢？\n\n随着我们的 [ROOT.GetCountry.GetAdjective] 城镇开始涌入宾客，有人建议我们应该征服一些腹地。"
 me_greek_4_west.44.t:0 "$greek_4_44$"
 me_greek_4_west.45.a:0 "以这种方式控制年轻人将剪断叛乱的翅膀"
 me_greek_4_west.45.at:0 "$mission_task_completed_tt_1$$greek_4_45$$mission_task_completed_tt_2$"
 me_greek_4_west.45.desc:0 "一旦 [ROOT.GetCountry.GetRuler.GetName] 确信#E 塔拉科嫩西斯#!区域终将属于我们，[ROOT.GetCountry.GetRuler.GetSheHe]便系统地派遣[ROOT.GetCountry.GetRuler.GetHerHis]军队前往每个定居点，带走所有适龄男子加入 [ROOT.GetCountry.GetName] 的征兵队伍，并掠夺小部落的财库。\n\n通过带走那些可能为自由而战的热血青年，[ROOT.GetCountry.GetRuler.GetFirstName]不仅增加了我们的可用人力，同时也减少了对我们当地[ROOT.GetCountry.GetAdjective]统治者的威胁。他们甚至无法雇佣佣兵或煽动者来制造麻烦——[ROOT.GetCountry.GetRuler.GetFirstName]在每一个回合都胜过他们。"
 me_greek_4_west.45.t:0 "$greek_4_45$"
 me_greek_4_west.46.a:0 "我们的军队将摧毁任何反对他们的人！"
 me_greek_4_west.46.at:0 "$mission_task_completed_tt_1$$greek_4_46$$mission_task_completed_tt_2$"
 me_greek_4_west.46.desc:0 "我们的军队在 #E 塔拉科嫩西斯#! 训练新的战斗战术时享受了这段时间。特别是我们的重步兵和重骑兵接受了广泛的训练，许多最优秀的战士是从该地区建造的所有军营中招募来的。\n\n塔拉科嫩西斯迅速成为重要的军事前线，因为北方和西方被诅咒的野蛮人不喜欢我们在该地区的存在，并且正在探测我们的边界，寻找任何可以利用的弱点。\n\n来自 #E 加利西亚#! 的袭击者变得如此烦人，以至于 [ROOT.GetCountry.GetRuler.GetName] 已下令我们的部队在完成训练后入侵伊比利亚西北部。"
 me_greek_4_west.46.t:0 "$greek_4_46$"
 me_greek_4_west.47.a:0 "谁能阻止我们追求这些目标？我看谁都不行"
 me_greek_4_west.47.at:0 "$mission_task_completed_tt_1$$greek_4_47$$mission_task_completed_tt_2$"
 me_greek_4_west.47.desc:0 "现在我们可以宣称 #E 赫拉克勒斯之柱#! 是我们自己的了，当地的总督请求允许我们驻扎在那里的 [ROOT.GetCountry.GetAdjective] 部队继续征服 #E 伊比利亚#! 的工作，以 [ROOT.GetCountry.GetName] 的更大荣耀。\n\n#E 贝提卡#! 地区主要居住着易于征服的部落，而且他们控制着像贵金属 @precious_metals! 和 #E 辰砂#! @cinnabar! 这样的自然资源，我们若是放弃将是愚蠢的。现在迦太基国 'CAR' 贪婪的手指已被从赫拉克勒斯之柱上撬开，我们可以在伊比利亚随心所欲。"
 me_greek_4_west.47.t:0 "$greek_4_47$"
 me_greek_4_west.48.a:0 "如果我不能享受我的生活，当 [ROOT.GetCountry.GetRulerTitle] 又有什么意义？"
 me_greek_4_west.48.at:0 "$mission_task_completed_tt_1$$greek_4_48$$mission_task_completed_tt_2$"
 me_greek_4_west.48.desc:0 "[ROOT.GetCountry.GetAdjective] 精英们最近有了一个新的爱好；购买遍布 #E 山北高卢#! 的巨大农场和奴隶庄园，那里是充满葡萄园和野生动物森林的美丽土地。即使是 [ROOT.GetCountry.GetRuler.GetName] 也无法免疫这种狂热，派 [ROOT.GetCountry.GetRuler.GetHerHis] 的代理人进行私人商业调查，并购买吸引 [ROOT.GetCountry.GetRuler.GetHerHis] 注意的地产。\n\n生活在 [ROOT.GetCountry.GetCapital.GetName] 继续；富人变得更富，穷人得到面包和娱乐。"
 me_greek_4_west.48.t:0 "$greek_4_48$"
 me_greek_4_west.49.a:0 "我希望我的人民对我所做的感到满意"
 me_greek_4_west.49.desc:0 "[ROOT.GetCountry.GetAdjective] 对伊比利亚贸易的掌控日益增强，关键港口和堡垒控制着贸易流动，为 [ROOT.GetCountry.GetName] 和她的人民带来利益。\n\n流入 [ROOT.GetCountry.GetCapital.GetName] 的奢侈品稳定流促使 [ROOT.GetCountry.GetRuler.GetName] 在市中心建立了一个新的商业区，一个将成为我们首都经济交易中心的 #E 大市场广场#!。"
 me_greek_4_west.49.t:0 "$greek_4_49$"
 me_greek_4_west.5.at:0 "$mission_task_completed_tt_1$$greek_4_4$$mission_task_completed_tt_2$"
 me_greek_4_west.5.desc:0 "财富滚滚而来，我们的希腊贸易站也在我们的倡议下繁荣起来，将西方从一个沉闷的未开化边疆转变为一个繁荣的希腊堡垒。\n\n还有很多事情要做，很多钱可以赚，但很明显我们选择这条路至少是正确的。"
 me_greek_4_west.5.t:0 "$greek_4_4$"
 me_greek_4_west.6.a:0 "[gm_4_bartering_scope_1.GetName]，属于 [gm_4_bartering_scope_1.GetOwner.GetName] 的港口？"
 me_greek_4_west.6.b:0 "我们听说了关于 [gm_4_bartering_scope_2.GetOwner.GetAdjective] [gm_4_bartering_scope_2.GetName] 的好话。"
 me_greek_4_west.6.c:0 "那 [gm_4_bartering_scope_3.GetOwner.GetName] 的 [gm_4_bartering_scope_3.GetName] 怎么样？"
 me_greek_4_west.6.d:0 "必须是 [gm_4_bartering_scope_4.GetOwner.GetName] 的 [gm_4_bartering_scope_4.GetName]。"
 me_greek_4_west.6.desc:0 "[gm_family_head_4.GetPraenomen] 派出的商人带回了一份可能购买使用权的港口清单。\n\n他们还指出了我们需要提供什么来激发当前所有者的兴趣，如果有可能的话。"
 me_greek_4_west.6.e:0 "[gm_4_bartering_scope_5.GetName] 似乎对 [gm_4_bartering_scope_5.GetOwner.GetName] 有益..."
 me_greek_4_west.6.f:0 "[gm_4_bartering_scope_6.GetOwner.GetAdjective] [gm_4_bartering_scope_6.GetName] 的位置非常优越。"
 me_greek_4_west.6.ht:0 "[gm_4_greek_scope.GetName] 将停止评估港口。"
 me_greek_4_west.6.tt:0 "我们将提出以#R -[SCOPE.ScriptValue('gm_4_barter_territory_value')]#! @gold!从[gm_4_barter_target_territory.GetOwner.GetName]手中购买#Y [gm_4_barter_target_territory.GetName]#!\n接受概率受#Y [gm_family_head_4.GetPraenomen]#!的魅力、港口的相对价值和外交好感度影响。[SCOPE.Custom('gm_4_chance_barter')]\n如果他们拒绝，我们将获得对#Y [gm_4_barter_target_territory.GetName]#!的宣称"
 me_greek_4_west.7.bt:0 "如果 #Y [gm_4_greek_scope.GetName]#! 接受，我们将收到双倍的钱交换 #Y [gm_4_barter_target_territory.GetName]#! (#G [SCOPE.ScriptValue('gm_4_barter_territory_double_value')]#! @gold!)，否则他们会获得一个宣称权。"
 me_greek_4_west.7.ct:0 "[gm_4_greek_scope.GetName] 获得对 #Y [gm_4_barter_target_territory.GetName]#! 的宣称权。"
 me_greek_4_west.7.desc:0 "我们被自称代表位于地中海沿岸 [gm_4_greek_scope.GetCapital.GetArea.GetRegion.GetName] 地区的希腊贸易城市 [gm_4_greek_scope.GetName] 的商人所接触。\n\n他们希望用‘合理的支出’换取 [gm_4_barter_target_territory.GetName] 的登陆点。"
 me_greek_4_west.7.t:0 "$greek_4_14$: 精明的 [gm_4_greek_scope.GetName] 希腊人"
 me_greek_4_west.8.desc:0 "[gm_family_head_4.GetName] 派出与 [gm_4_barter_target_territory.GetOwner.GetName] 谈判的商人们已经返回 "
 me_greek_4_west.8.desc_1:0 "带着野蛮的 [gm_4_barter_target_territory.GetOwner.GetRulerTitle], [gm_4_barter_target_territory.GetOwner.GetRuler.GetPraenomen] 同意条款！\n\n我们已派出承诺的资金以及一组官员，他们将监督作为 [gm_4_greek_scope.GetAdjective] 港口的 [gm_4_barter_target_territory.GetName] 的管理。"
 me_greek_4_west.8.desc_2:0 "带着野蛮的 [gm_4_barter_target_territory.GetOwner.GetRulerTitle], [gm_4_barter_target_territory.GetOwner.GetRuler.GetPraenomen] 提出的反报价。\n\n他们准备将 [gm_4_barter_target_territory.GetName] 及其周边的土地和港口卖给我们，但要求更高的价格。"
 me_greek_4_west.8.desc_3:0 "带着野蛮的 [gm_4_barter_target_territory.GetOwner.GetRulerTitle], [gm_4_barter_target_territory.GetOwner.GetRuler.GetPraenomen] 的直接拒绝。\n\n信中声称这片土地是 [gm_4_barter_target_territory.GetOwner.GetAdjective] 人民的古老领土，价值远超任何闪亮的小玩意。"
 me_greek_4_west.8.t:0 "$greek_4_14$: [gm_4_barter_target_territory.GetOwner.GetAdjective] 谈判"
 me_greek_4_west.9.desc:0 "我们对 [gm_4_greek_scope.GetName] 的反报价终于得到了回应。\n\n"
 me_greek_4_west.9.t:0 "$greek_4_14$: [gm_4_greek_scope.GetName] 的回应"

l_simp_chinese:
 COGNOMEN_BRITANNICUS:0 "不列塔尼库斯"
 deity_sulis_minerva:0 "$omen_sulis_minerva$"
 desc_rhaetia_ferrum_noricum:0 "我们将把诺里库姆的铁器用得比当地人好得多。"
 desc_rome_rhaetia_stopped_raids:0 "因为我们终结了这个地区的盗匪袭击，商业和贸易正在增长。"
 desc_rome_rhaetian_wine:0 "他们在维罗纳生产的葡萄酒非常精致，因其风土条件和奢华的口感而受到赞誉。"
 desc_rome_root_out_pirates:0 "我们已将清除亚得里亚海的伊利里亚海盗作为一项国策。"
 desc_tropaeum_alpium:0 "我们在Cenelenum建立了一个巨大的纪念碑，一个特罗派翁，以纪念我们在该地区的永恒胜利。"
 me_roman_10_invading_britannia.10.desc:0 "一些精明的外交官提出了一个有趣的建议，以扩大我们在不列颠尼亚的权力。他们一直在评估当前政治格局的弱点，并确定了[SCOPE.sC('rm_offer_scope').GetName]的部落。\n\n他们发现自己与[SCOPE.sC('rm_protection_enemy_scope').GetName]处于战争状态，有机会通过要求附庸权作为回报，介入[SCOPE.sC('rm_offer_scope').GetName]一方的工作。"
 me_roman_3_britannia.1.a:0 "向他们提供一个联盟……"
 me_roman_3_britannia.1.at:0 "提供一个联盟"
 me_roman_3_britannia.1.b:0 "……以换取附庸地位。"
 me_roman_3_britannia.2.c:0 "发出还价……"
 me_roman_3_britannia.3.a:0 "很好。"
 me_roman_3_britannia.3.b:0 "蠢货。"
 me_roman_3_britannia.3.c:0 "这将不得不做。"
 me_roman_3_britannia.3.d:0 "他们应该接受所提供的条件。"
 me_roman_3_britannia.3.desc_5:0 "[SCOPE.sC('rm_offer_scope').GetName]已经对我们的慷慨提议做出了还价。他们只希望与罗马建立友谊，但条件要比他们认为的更公平......"
 me_roman_3_britannia.4.desc:0 "我们的特使被派去与不列颠尼亚最强大的部落谈判，以确定谁是最强大的。\n\n[SCOPE.sC('rm_offer_scope').GetName]，被发现是最强大的，但我们将向他们的领袖[SCOPE.sC('rm_offer_scope').GetRulerTitle] [SCOPE.sC('rm_offer_scope').GetRuler.GetName] 提供或要求什么？"
 me_roman_3_britannia.4.t:0 "在不列颠尼亚的一个朋友"
 me_roman_missions_inv.1.a:0 "我们接受这个提议；这比直接被征服要好"
 me_roman_missions_inv.1.b:0 "荒唐！他们不会这么容易得到我们的土地"
 me_roman_missions_inv.1.desc:0 "今天早上，我们收到了来自罗马人的使者，他要求与我们的领导人会面。我们知道罗马之子是凶猛的战士，所以我们竭力迎合这些外交官，因为我们不希望激怒他们的元老院。他们带来的建议肯定是一个大胆的建议；他们向我们提供了他们的友谊，并要求我们成为他们的一个仆从国。这个要求的替代方案没有说出来，但我们可以想象，拒绝会带来什么。"
 me_roman_missions_inv.1.t:0 "罗马大使"
 me_roman_missions_inv.2.a:0 "我们向诺里西亚的人民伸出友谊之手"
 me_roman_missions_inv.2.desc:0 "当你听到诺里西亚的消息时，你会欣喜若狂的，伟大的[ROOT.GetCountry.GetRuler.GetName]；我们派出的使者报告说，我们的提议已经被他们的人民全心全意地接受了，他们知道，他们未来的繁荣是由他们对罗马的力量的服从所保证的。既然他们已经同意成为我们的仆从国，我们就一起向前迈进。"
 me_roman_missions_inv.2.t:0 "一个仆从国"
 me_roman_missions_inv.3.a:0 "他们的女人和孩子真可怜……"
 me_roman_missions_inv.3.desc:0 "我们派往诺里库姆人的使者回来了，除了坏消息，什么都没有。似乎我们在诺里库姆建立一个仆从国的提议受到了嘲笑，我们的要求一提出，人们的情绪立即发生了变化，他们对我们在他们的领土上的存在感到厌恶。一些头脑发热的诺里安战士声称，这些人不是使者，而是试图侦察的间谍，并开始悄悄地集体聚集在我们的人所住的房子外面。我们的外交官觉得再呆下去也不安全，当天晚上就离开了，担心自己的生命安全。这是多么严重的侮辱！"
 me_roman_missions_inv.3.t:0 "诺里库姆的反对者"
 me_roman_missions_inv.4.a:0 "你说，这酒来自维罗纳？令人印象深刻，[ROOT.GetCountry.GetRuler.GetFirstName]"
 me_roman_missions_inv.4.desc:0 "[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]的私人住宅为[GetProvince('(int32)1').GetArea.GetName]的一些主要家庭举办晚宴，但到了晚上，显然[ROOT.GetCountry.GetRuler.GetFirstName]的酒将用尽；对任何主人来说，这可能是一场灾难。绞尽[ROOT.GetCountry.GetRuler.GetHerHis]脑汁，[ROOT.GetCountry.GetRuler.GetFirstName]突然想起，我们刚刚从[GetProvince('(int32)3584').GetName]收到一批双耳瓶，里面是他们在北方生产的年份酒。没有引起太大的骚动，[ROOT.GetCountry.GetRuler.GetFirstName]悄悄地命令仆人把维罗纳的酒拿出来，当赞美之词开始涌入时，他大大松了一口气--看来今晚避免了一场尴尬的惨败。"
 me_roman_missions_inv.4.t:0 "雷蒂亚酒"
 me_roman_missions_inv.5.a:0 "一旦建设完成，我们将亲自访问凯梅伦姆"
 me_roman_missions_inv.5.desc:0 "我们在阿尔卑斯山的辉煌军事行动不仅已经结束，而且我们的努力也得到了很多回报；我们不仅增加了罗马的荣耀和威望，而且我们把文明的光芒带到了那些自己永远也看不到的地区。即使是现在，我们的工程师也开始驯服土地，为我们的公民建造建筑，很快，另一座罗马城市就会建成。在这一天，我们有很多事情要庆祝，[ROOT.GetCountry.GetRuler.GetName]。"
 me_roman_missions_inv.5.t:0 "阿尔卑斯山的战利品"
 me_roman_missions_inv.6.a:0 "[ROOT.GetCountry.GetRuler.GetFirstName]将耗费政治资本来阻止辩论"
 me_roman_missions_inv.6.b:0 "允许程序继续进行"
 me_roman_missions_inv.6.c:0 "我即是元老院！"
 me_roman_missions_inv.6.desc:0 "几周前，[GetProvince('(int32)1').GetName]的公民被当地贸易巨头Gaius Manercus在[GetProvince('(int32)4020').GetArea.GetRegion.GetName]以外的海盗那里损失了20艘船的消息大大扰乱了。在这次灾难性的发现之后，因其慷慨而受到老百姓爱戴的盖乌斯自杀了，而罗马的暴民们一直吵着要对这些野蛮的私掠者进行报复。\n\n面对越来越大的公众压力，元老院同意召开会议，以讨论行动方案；一些人主张采取不容忍政策，而其他人则认为，我们应该与伊利里亚人达成谅解。\n\n几个小时后，气氛变得焦灼，参议院会议上的攻辩上升到了人身攻击。一些参议员拼命与[ROOT.GetCountry.GetRuler.GetName]进行眼神交流，希望[ROOT.GetCountry.GetRuler.GetSheHe]能提出议案。"
 me_roman_missions_inv.6.t:0 "一场有争议的辩论"
 me_roman_missions_inv.7.a:0 "让人们知道，罗马不容忍肆意的犯罪行为"
 me_roman_missions_inv.7.desc:0 "在[ROOT.GetCountry.GetRuler.GetName]一系列慷慨激昂的演讲之后，允许不受控制的海上威胁不受惩罚地运作的危险被谴责为不适合我们人民的懦弱行为，罗马元老院一致同意现状是不可容忍的，并相应改变了我们的法律。\n\n由于[ROOT.GetCountry.GetRuler.GetFirstName]的说服力，我们现在有了所需的法律依据来结束这种无法无天的现象。"
 me_roman_missions_inv.7.t:0 "铲除海盗威胁"
 me_roman_missions_inv.8.a:0 "无论如何，我们目前有更好的事情要做......"
 me_roman_missions_inv.8.desc:0 "在持续了一整天的辩论中，罗马元老院最优秀的演说家们发表了许多大胆的宣言，但绝对没有任何成果。尽管[ROOT.GetCountry.GetRuler.GetName]发誓一旦元老院再次召开就继续审议，但这个动议很快就被[ROOT.GetCountry.GetRuler.GetHerHis]的元老们忽略了，他们决定将日常讨论转向一直存在的土地改革问题。"
 me_roman_missions_inv.8.t:0 "对海盗的温和姿态"
 me_roman_missions_inv.9.a:0 "我们将按你说的做，因为有好处"
 me_roman_missions_inv.9.b:0 "妄想……告诉巴托别做梦了，送他回家"
 me_roman_missions_inv.9.bmodtt:0 "#Y 伊利里亚#!和#Y 潘诺尼亚#!南部的全部领土将获得"
 me_roman_missions_inv.9.desc:0 "我们的外交官今天一早从[GetProvince('(int32)4020').GetArea.GetRegion.GetName]回来了，陪同他们的是一位被称为[bato_the_illyrian.GetName]的当地领导人。似乎[bato_the_illyrian.GetFirstName]感觉到了罗马人胜利的必然性，在伊利安战役的早期就与我们投缘，成为自己人的叛徒，以便为自己争取更好的地位。诚然，我们依靠巴托和他的侦察兵提供的信息，这些信息被证明是非常宝贵的，但现在看来，贝托认为我们欠了他的人情。\n\n在通过prandium讨论了通常的寒暄之后，巴托提出了他的想法；他要求我们释放伊利里亚作为部落附庸，给他权力以我们的名义进行统治。'虽然我们非常尊重罗马人，但对于我们的文化，[ROOT.GetCountry.GetRuler.GetName]你有很多不了解的地方--来自外国人的直接统治将是我的人民难以容忍的。我向你保证，我将忠实地履行我的承诺。\n\nBato向前倾斜，直视[ROOT.GetCountry.GetRuler.GetFirstName]的眼睛，目光坚毅，可以理解为是在对抗--这个野蛮人有什么胆量！当然，我们都同意，如果有一个人在这里，他就会有机会。'当然，我们都同意，在整个伊利里亚发生动乱，对我们双方都不利。希望你能做出明智的选择。"
 me_roman_missions_inv.9.t:0 "提议和提议"
 omen_sulis_minerva:0 "苏利斯的密涅瓦"
 omen_sulis_minerva_desc:0 "$athena_description$\n\n#Y 苏利斯#!：苏利斯是$britain_region$南部温泉的地方女神，一部分是母亲女神形象，一部分是抵御诅咒的守护者。甚至远方的人们也开始前往温泉，向这位女神献上祈祷，请求她帮助抵御可能缠上他们的诅咒。\n\n在异邦，人们称她为弥涅耳瓦或雅典娜，将她与自己的智慧女神相联系。"
 rhaetian_pop_tt:0 "我们需要在#Y 维罗纳#!市至少有一个具有#Y 雷蒂亚#!文化的人口。"
 roman_10_belerion:0 "征服贝勒里昂"
 roman_10_belerion_DESC:0 "我们的入侵行动依计而行；我们已经在贝勒里昂建立了滩头阵地，并向内陆进一步派兵。诸神保佑，完全确保该岛西南部的安全目前只是一个时间问题。"
 roman_10_belerion_claims_tt:0 "#Y 罗马#!获得了[GetProvince('(int32)2092').GetArea.GetName]和[GetProvince('(int32)2102').GetArea.GetName]地区中全部领土的宣称。"
 roman_10_brigantia:0 "布里甘特人的土地"
 roman_10_brigantia_DESC:0 "罗马之鹰飞过布里甘蒂亚缥缈的荒野和雾气缭绕的沼泽，它刺耳的叫声让涂着靛蓝条纹的野蛮人惊恐地跪下。继续向前，带领我们的军团取得不朽的胜利！"
 roman_10_brigantia_claims_tt:0 "#Y 罗马#!获得对[GetProvince('(int32)2111').GetArea.GetName]、[GetProvince('(int32)2133').GetArea.GetName]和[GetProvince('(int32)2120').GetArea.GetName]地区的所有领土的宣称。"
 roman_10_established_in_britannia:0 "不列颠尼亚的胜利"
 roman_10_established_in_britannia_DESC:0 "正如预期的那样，我们终于征服了不列颠尼亚岛，在我们目前管理的省份中又增加了一个省份。虽然在管理这样一个遥远的地区时有一些后勤方面的挑战，但我们迎难而上，向整个世界展示了罗马人有能力完成我们的任何目标。元老院和罗马人民都欠你的，小皇帝。"
 roman_10_hadrians_wall:0 "哈德良长城"
 roman_10_hadrians_wall_DESC:0 "喀里多尼亚人是一个不守规矩的民族，虽然他们在被压倒性击败后勉强服从了罗马的权威，但我们知道，荣誉对他们来说是一个陌生的概念。我们不相信任何人，应该在喀里多尼亚高地的山脚下建立我们的防御；这将保护我们的北方财产不受他们突击队的怒火影响。"
 roman_10_invading_britannia:0 "征服不列颠尼亚"
 roman_10_invading_britannia_CRITERIA_DESCRIPTION:0 "征服或附庸不列颠尼亚"
 roman_10_invading_britannia_DESCRIPTION:0 "被迷雾笼罩的不列颠尼亚岛已经成为凯尔特强盗和小偷的避难所，他们愚蠢地认为孤悬海外可以保护他们免受罗马的惩罚。我们已经容忍了太长时间，显而易见，我们必须采取进一步措施。"
 roman_10_invading_britannia_REWARD_DESCRIPTION:0 "不列颠尼亚。"
 roman_10_ireland:0 "希伯尼亚岛"
 roman_10_ireland_DESC:0 "就像曾经不列颠尼亚是高卢雇佣兵和麻烦制造者的避难所一样，他们愚蠢地认为只要驶出我们的管辖范围，就可以逃避罗马的法律制裁，希伯尼亚岛也成为强盗和逃犯、谋杀犯和小偷的避难所。除非我们平定这个岛屿，否则我们在北方的财产将面临危险。"
 roman_10_northern_fleet:0 "建造一支北方舰队"
 roman_10_northern_fleet_DESC:0 "随着我们的注意力转向离海洋领地最近的野蛮土地，我们对一支北方舰队的需求已经变得很明显，这支舰队可以运送我们的入侵部队并为他们提供补给。传话给我们，让我们立即开始建造，因为谨慎起见，我们不应该把任何一支舰队从我们的海洋转移到这些该死的腹地。"
 roman_10_offer_britons_protection:0 "向普雷顿人提供保护"
 roman_10_offer_britons_protection_DESC:0 "尽管我们无疑将会被卷入这场混战，介入凯尔特部落与异族侵略者之间的争斗可能会成为赢得他们友谊与效忠的契机。这是一个我们达成目的所愿付出的代价。"
 roman_10_offer_gauls_protection_rewtt:0 "有机会在介入他们的战争时获得一个#Y $britannic$#!附属国"
 roman_10_offer_gauls_protection_tooltip:0 "在#Y $britain_region$#!存在#Y $britannic$#!的国家，与#Y 罗马#!或其附属国接壤，且不是一个附属国，也不是#Y 罗马#!的盟友，并对#Y 罗马#!的好感大于#R -50#!，而且它的国家等级比#Y 罗马#!低，且正在与一个拥有比它更多领土的国家交战。"
 roman_10_scotland:0 "征服喀里多尼"
 roman_10_scotland_DESC:0 "有多少罗马人曾像我们在喀里多尼亚的部队一样远离家乡？这是一片被诅咒的土地，那里的天空是阴沉的，永远下着雨。居住在这些迷雾笼罩的荒原上的部落对我们使出浑身解数希望能把我们赶走。多么愚蠢的幻想。"
 roman_10_scotland_claims_tt:0 "#Y 罗马#!获得[GetProvince('(int32)2172').GetArea.GetName]、[GetProvince('(int32)2167').GetArea.GetName]、[GetProvince('(int32)2198').GetArea.GetName]和[GetProvince('(int32)2182').GetArea.GetName]地区所有领土的宣称。"
 roman_10_secure_allies:0 "与普雷顿结盟"
 roman_10_secure_allies_DESC:0 "没有人比普雷顿部落的手足更了解他们的弱点。与一个重要的凯尔特部落成为盟友，可以使对不列颠尼亚的征服更加顺利。"
 roman_10_secure_allies_rewtt:0 "$roman_diplo_reward_tt$一个邻近的#Y 普雷顿#!部落。"
 roman_10_secure_allies_tooltip:0 "在#Y $britain_region$#!存在#Y $britannic$#!的国家，与#Y 罗马#!或其附属国接壤，且不是#Y 罗马#!的盟友，也不是一个附属国，该国至少有#Y 4#!块领土，并对#Y 罗马#!的好感大于#R -50#!，而且它的国家等级比#Y 罗马#!低。"
 roman_10_secure_allies_tooltip2:0 "#Y 罗马#!在#Y $britain_region$#!的地区拥有至少#Y 1#!领土。"
 roman_10_secure_aremorica:0 "阿雷摩里卡海岸"
 roman_10_secure_aremorica_DESC:0 "在进行侦察之后，我们的技术人员向我们汇报，阿雷摩里卡海岸将是对于我们高卢财产的有利补充。如果为罗马拿下那些土地，我们将处于入侵南不列颠尼亚的有利位置。阿雷摩里卡是我们海军的完美集结地。"
 roman_10_secure_aremorica_claims_tt:0 "#Y 罗马#!获得了[GetProvince('(int32)2003').GetArea.GetName]、[GetProvince('(int32)2015').GetArea.GetName]和[GetProvince('(int32)2039').GetArea.GetName]地区中全部领土的宣称"
 roman_10_secure_belgica:0 "比利时海岸"
 roman_10_secure_belgica_DESC:0 "将剽悍的比利其人驱逐出他们的海岸线固然是艰巨任务，但我们已别无选择——这些蛮族拒绝和平共处，而您的军事顾问们一致认为，夺取不列颠海的港口，是未来进军伊刻尼亚与坎蒂亚基亚的战略要着。"
 roman_10_secure_belgica_claims_tt:0 "#Y 罗马#!获得了[GetProvince('(int32)2038').GetArea.GetName]和[GetProvince('(int32)2034').GetArea.GetName]地区中全部领土的宣称。"
 roman_10_southern_england:0 "征服东部海岸"
 roman_10_southern_england_DESC:0 "征服东部诸国所需的代价很高，然而玛尔斯不会忽视献祭在这片土地上的罗马之血！没有哪个蛮族部落能抵挡住文明的脚步。向北进军！"
 roman_10_southern_england_claims_tt:0 "#Y 罗马#!获得对[GetProvince('(int32)2063').GetArea.GetName]、[GetProvince('(int32)2070').GetArea.GetName]和[GetProvince('(int32)2079').GetArea.GetName]地区的所有领土的宣称。"
 roman_10_sulis_minerva:0 "苏利斯的密涅瓦"
 roman_10_sulis_minerva_DESC:0 "苏利斯的阿库埃，一个位于温泉边的定居点，已经成为当地人和我们自己人的朝圣地，是进一步罗马化的自然候选地。让我们把这个地方的圣地变成一个配得上其最新居民的寺庙；也许居住在这些洁净的水中的女神会注意到我们。"
 roman_10_sulis_minerva_activation:0 "解锁苏利斯的密涅瓦的预兆。"
 roman_10_wales:0 "西部蛮荒"
 roman_10_wales_DESC:0 "随着我军深入不列颠尼亚这座遥远岛屿的内陆，遭遇的抵抗正变得愈发激烈。然而这些蛮族终究无法阻挡历史的必然——当得墨提亚与奥陶维希亚的野蛮人彻底覆灭后，我们将向这些土地派遣殖民者，让罗马文明在此生根发芽。"
 roman_11_mission_task_1:0 "格赖亚与布匿阿尔卑斯"
 roman_11_mission_task_10:0 "雷蒂亚酒"
 roman_11_mission_task_10_DESC:0 "虽然毫无疑问不如我们自己的人民所生产的葡萄酒，他们的酿酒技术是无与伦比的，但来自雷蒂亚的葡萄酒并没有半点坏处。似乎贝纳库斯湖的水对风土有特殊作用，如果我们愿意，我们可以扩大雷蒂亚的葡萄酒生产。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 roman_11_mission_task_1_DESC:0 "尽管在阿尔卑斯山度过的将是一段艰苦的生活，但罗马的安全要求我们在这些山口建立一个永久的存在。我们很幸运，我们的人民都很健壮，可以接受挑战。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 roman_11_mission_task_1_claims_tt:0 "我们将收到对#Y 提古林尼亚#!和#Y 赫尔维蒂#!国家的宣称。"
 roman_11_mission_task_2:0 "征服雷蒂亚人"
 roman_11_mission_task_2_DESC:0 "雷蒂亚人是一个顽固的民族，他们盘踞在山区，对罗马商人有抵触情绪，对外来者普遍有敌意。现在是时候了，我们应该把这些外来者从他们的洞穴住所中驱逐出去，把真正的文明带到阿尔卑斯山。\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 roman_11_mission_task_2_claims_tt:0 "我们将接受对#Y 图林吉亚#!、#Y 上赫尔维蒂#!和#Y 下赫尔维蒂#!区域的宣称。"
 roman_11_mission_task_3:0 "阿尔卑斯山湖泊之乡"
 roman_11_mission_task_3_DESC:0 "穿过阿尔卑斯山的天然防御工事，人们进入了一片美得令人窒息的土地，这个地方在高山峭壁上布满了湖泊。这些省份的自然美景将成为罗马霸权的一个受欢迎的补充，并且无疑将证明对潜在的殖民者具有吸引力。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 roman_11_mission_task_3_claims_tt:0 "我们将收到对#Y 拉托布里吉亚#!、#Y 日耳曼尼孔#!和#Y 西卡蒂亚#!地区的宣称。"
 roman_11_mission_task_4:0 "征服温德利西亚人"
 roman_11_mission_task_4_DESC:0 "罗马人和温德利西亚人之间确实没有爱情，我们无法看到我们两个民族并肩生活太久。我们必须制服我们的敌人的时候到了……\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 roman_11_mission_task_4_tt:0 "我们将接受对#Y 杜姆诺尼亚#!，#Y 杜罗特里吉亚#!和#Y 多布尼亚#!地区的宣称。"
 roman_11_mission_task_5:0 "诺里库姆王国"
 roman_11_mission_task_5_DESC:0 "经过商议，我们决定，罗马将寻求诺里奇亚居民的友谊。当然，这些野蛮人会抓住这个机会，被称为罗马人民的朋友，这种荣誉不是随便给谁的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 roman_11_mission_task_6:0 "诺里库姆的铁矿"
 roman_11_mission_task_6_DESC:0 "我们有机会开发诺里基亚的阿尔卑斯的富铁资源，而考虑到为我们强大的罗马士兵配备适当装备的重要性，确保我们能够获得这些铁资源已变得至关重要。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 roman_11_mission_task_7:0 "阿尔卑斯山的战利品"
 roman_11_mission_task_7_DESC:0 "因为我们在为自己确保阿尔卑斯山的资源方面做了如此出色的工作，罗马人民吵着要庆祝我们的成功，还有什么比一座新的城市更好的纪念品呢，一座象征着我们对这片土地完全和完全控制的城市？\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 roman_11_mission_task_8:0 "戴古马特田野"
 roman_11_mission_task_8_DESC:0 "慢慢地，罗马的边界扩展到了远远超出我们核心领土的地区，越过了遮挡我们的山脉，延伸到了日耳曼高地省份。这片土地将被生活在那里的蛮族激烈地争夺，但我们已经准备好迎接即将到来的一切。\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 roman_11_mission_task_9:0 "停止袭击"
 roman_11_mission_task_9_DESC:0 "也许我们可以说服野蛮人放弃他们的山中藏身之处，把文明的光芒带给他们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 roman_11_rhaetia_vindelicia:0 "确保阿尔卑斯山口的安全"
 roman_11_rhaetia_vindelicia_CRITERIA_DESCRIPTION:0 "征服或降服阿尔卑斯山的部落。"
 roman_11_rhaetia_vindelicia_DESCRIPTION:0 "长期以来，我们在确保通往[GetProvince('(int32)3615').GetArea.GetName]的山口安全方面一直很松懈，这给我们的北部地区带来了袭击问题。尽管居住在这一地区的部落很难从他们的堡垒中解脱出来，但我们必须继续前进，以免我们遭遇灾难。罗马元老院命令我们一劳永逸地征服这一地区。"
 roman_11_rhaetia_vindelicia_REWARD_DESCRIPTION:0 "一旦罗马人扩展到雷蒂亚，这个任务就会被认为完成了。"
 roman_12_illyria_pannonia:0 "结束亚得里亚海的海盗活动"
 roman_12_illyria_pannonia_CRITERIA_DESCRIPTION:0 "当罗马征服或降服了伊利里亚和潘诺尼亚部落时，这个使命才算完成。"
 roman_12_illyria_pannonia_DESCRIPTION:0 "随着我们的影响力不断扩大，与我们的海外利益相称，我们的努力被一个似乎日趋严重的烦扰所阻碍--野蛮的海盗袭击我们的沿海城镇，掠夺贸易路线。我们担心，面对这些挑衅，我们继续保持沉默会被理解为默许......罗马元老院和人民会允许在我们自己的后院发生这种无法无天的事情吗？"
 roman_12_illyria_pannonia_REWARD_DESCRIPTION:0 "伊利里亚和潘诺尼亚。"
 roman_12_mission_task_1:0 "讨论反海盗法"
 roman_12_mission_task_10:0 "征服蛮荒之地"
 roman_12_mission_task_10_DESC:0 "罗马又一次被引向荣耀！玛尔斯带领我们的部队取得了胜利，粉碎了那些愚蠢到反对我们意志的力量。野蛮的土地将不再是充满争吵的野蛮人，而是将作为罗马文明和力量的延伸而闪耀！\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 roman_12_mission_task_1_DESC:0 "伊利里亚海盗带来的威胁是不可容忍的，原因有很多。我们不能再允许野蛮的私掠者骚扰我们的海岸线；元老院肯定会看到这一行动的明智之处。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 roman_12_mission_task_1_claims_tt:0 "我们将接受对#Y 希斯特里亚#!、#Y 西达尔马提亚#!、#Y 中达尔马提亚#!、#Y 东达尔马提亚#!和#Y 西萨维亚#!区域的宣称。"
 roman_12_mission_task_1_comp:0 "关于这个问题的辩论将在#Y 罗马元老院#!展开。"
 roman_12_mission_task_2:0 "利部耳尼亚海岸"
 roman_12_mission_task_2_DESC:0 "罗马早就意识到困扰利伯尼亚海岸的无法无天的现象，它吸引了最糟糕的掠夺者和盗贼在其境内定居。够了，让我们结束这种犯罪行为。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 roman_12_mission_task_2_claims_tt:0 "我们将获得对#Y 西第一潘诺尼亚#!、#Y 东第一潘诺尼亚#!、#Y 内诺里库姆#!和#Y 卡耳农提亚#!地区的宣称。"
 roman_12_mission_task_3:0 "得尔马泰海岸"
 roman_12_mission_task_3_DESC:0 "为了坚定我们对伊利里亚的长期野心，我们在德尔马提亚海岸建立一个永久性的存在是有意义的。穿过超级海的水域是一件微不足道的事情；不久之后，我们就会控制整个地区和它的许多港口。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 roman_12_mission_task_3_claims_tt:0 "我们将获得对#Y 潘诺尼亚瓦勒里亚#!、#Y 西萨维亚#!和#Y 第二潘诺尼亚#!区域的宣称。"
 roman_12_mission_task_4:0 "上潘诺尼亚"
 roman_12_mission_task_4_DESC:0 "沿着分割阿尔卑斯山和希斯特里亚山的狭窄通道，人们最终离开了岩石的隘口，来到了一片连绵的农田和广阔的森林——潘诺尼亚。我们必须占领这些重要的山脉通道，以免我们在保护家园的责任上有所松懈，将土地据为己有。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 roman_12_mission_task_5:0 "下潘诺尼亚"
 roman_12_mission_task_5_DESC:0 "潘诺尼亚的茂密林地逐渐开辟为广阔的平原；是马匹和牲畜放牧的好地方。当务之急是将潘诺尼亚下层的丰富资源置于罗马权力的指挥之下。在这个地区建立一个殖民地也是明智之举。\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 roman_12_mission_task_6:0 "降服斯科耳迪斯基人"
 roman_12_mission_task_6_DESC:0 "我们已经决定不再允许斯科耳迪斯基人生活在上摩厄西亚的土地上——我们不允许野蛮人在我们目前的边界之外集结力量。对抗的时间越来越近了，但我们对这个地区的最终发展还有其他的和平计划。\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 roman_12_mission_task_7:0 "叛乱的人民"
 roman_12_mission_task_7_DESC:0 "各省出现了骚乱；似乎有些人对他们的命运变化不以为然，而且没有从以前的错误中吸取教训，试图用邪恶的手段甩掉我们的温柔之手。\n\n不用说，罗马不会容忍任何反叛的同情心，并将在平息这种活动中发挥积极作用。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 roman_12_mission_task_7_allow_tt:0 "罗马必须直接拥有或通过附属国控制以下省份，而且它们都必须拥有#Y 伊利里亚#!国家文化：#Y 伊斯特里亚#!、#Y 中达尔马提亚#!、#Y 西达尔马提亚#!、#Y 东达尔马提亚#!、#Y 西萨维亚#!、#Y 东萨维亚#!和#Y 第二潘诺尼亚#!。"
 roman_12_mission_task_8:0 "根除海盗"
 roman_12_mission_task_8_DESC:0 "我们已经对我们在Mare Superum所面临的海盗问题忍无可忍了，我们决定将这些海盗彻底铲除。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 roman_12_mission_task_9:0 "接近伊利里亚殖民地"
 roman_12_mission_task_9_DESC:0 "暴力从来不是罗马人的第一选择，他们向所有愿意与我们和平共处的人提供友谊和接纳，但我们从不害怕在需要时拿起武器。对一些伊利里亚殖民地的外交姿态将是我们的第一步。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 roman_12_mission_task_9_effect_effect_2_tt:0 "我们将向一个#Y 伊利里亚#!国家派出外交官，询问他们是否愿意成为我们的仆从国。"
 roman_12_mission_task_9_trigger_tt:0 "任何#Y 伊利里亚#!的国家必须不是附属国，必须与#Y 罗马#!和平相处，必须对#Y 罗马#!的好感大于或等于15，必须拥有至少一块领土，并且必须以#Y 希腊文化#!作为国家文化。"
 roman_4_punic_rivals_weaken_carthage_tooltip:0 "#Y 迦太基#!和其附庸不能拥有除#Y $africa_region$#!、#Y $numidia_region$#!、#Y $cyrenaica_region$#!、#Y $fezzan_region$#!和#Y $mauretainia_region$#!地区之外的任何领土。"
 roman_5_british_dominance.modtt:0 "在#Y $britain_region$#!和#Y $caledonia_region$#!区域的每一个拥有的省份都会获得"
 roman_5_british_dominance.modtt2:0 "在#Y $britain_region$#!和#Y $caledonia_region$#!区域的每一个拥有的省份都会获得一份动乱和幸福度的加成。"
 roman_conquest_missions_inv.1.a:0 "雷多农的孔达忒是自然的选择。"
 roman_conquest_missions_inv.1.b:0 "我们应该把目光投向东部海岸，投向科里亚隆。"
 roman_conquest_missions_inv.1.c:0 "沃耳加尼翁，在陆地的尽头。"
 roman_conquest_missions_inv.1.d:0 "Tregetorium的港口可能变得很重要。"
 roman_conquest_missions_inv.1.desc:0 "阿雷摩里卡半岛的高卢人已经被征服了，我们现在有了一个安全的位置，可以从那里向不列颠尼亚发动海上入侵。"
 roman_conquest_missions_inv.1.t:0 "$me_roman_conquest_of_tooltip$ 阿雷摩里卡"
 roman_conquest_missions_inv.10.a:0 "布里甘提翁在山上，但有水，在那里建设"
 roman_conquest_missions_inv.10.b:0 "特里登同在森林里有一个重要的位置；它是明确的选择"
 roman_conquest_missions_inv.10.desc:0 "虽然在山区作战总是很困难，但我们的军队总是迎难而上，完成元老院和罗马人民交给他们的任何任务。我们在这里完成了一项伟大的任务；通过控制雷蒂亚，我们现在可以加固山口，为这个曾经被强盗和战争折磨的地区带来和平与繁荣。"
 roman_conquest_missions_inv.10.t:0 "彻底击败雷蒂亚人"
 roman_conquest_missions_inv.11.a:0 "革纳瓦，拥有铁矿，对我们的吸引力最大。"
 roman_conquest_missions_inv.11.b:0 "阿文提孔，由于可以获得鱼类，应该成为首都"
 roman_conquest_missions_inv.11.c:0 "康斯坦丁娜将成为赫尔维蒂的新首都"
 roman_conquest_missions_inv.11.d:0 "蛮族喜欢他们的靛青，而维马尼亚有丰富的靛青。"
 roman_conquest_missions_inv.11.desc:0 "罗马继续向北推进它的边界，笼罩着那些曾经无法保卫自己家园的人所居住的土地。而这个[GetProvince('(int32)3631').GetArea.GetName]是一个怎样的地区啊!阿尔卑斯山逐渐从其崇高的高度退去，成为一片湖泊之地，有充足的机会进行扩张。我们毫不怀疑，这一地区将成为我们殖民者的热门目的地。"
 roman_conquest_missions_inv.11.t:0 "阿尔卑斯山湖泊之乡"
 roman_conquest_missions_inv.12.a:0 "我已选择奥古斯塔·提比略作为省会"
 roman_conquest_missions_inv.12.b:0 "尤瓦翁的大理石已经为我们做出了选择"
 roman_conquest_missions_inv.12.c:0 "奥古斯塔·温德里科鲁姆将成为温得利基亚的永久首都"
 roman_conquest_missions_inv.12.d:0 "巴塔维斯和其他选择一样是个好地方"
 roman_conquest_missions_inv.12.desc:0 "终于，我们打败了温德利西亚人的军队，在他们无望地试图防守的平原上击溃了他们的部队。对他们来说，在敌对行动开始时屈服会好得多，然而我们不能责怪他们试图保护自己的家园。罗马元老院希望，随着时间的推移，我们的侵略战争被遗忘，温德利西亚人将接受他们作为未来罗马人的新身份。"
 roman_conquest_missions_inv.12.t:0 "被征服的温德利西亚人"
 roman_conquest_missions_inv.13.a:0 "日耳曼尼亚的阿奎勒亚将是我们建设的地方"
 roman_conquest_missions_inv.13.b:0 "佛拉维亚的阿赖位置有其他地方所没有的好处"
 roman_conquest_missions_inv.13.c:0 "日耳曼尼卡是个好地方"
 roman_conquest_missions_inv.13.d:0 "格里纳里翁有一个奇怪的名字，听起来很吉利"
 roman_conquest_missions_inv.13.desc:0 "来自[GetProvince('(int32)3771').GetArea.GetRegion.GetName]的消息今天早上到达，[ROOT.GetCountry.GetRuler.GetName]。该地区的敌对行动终于停止了，因为当地人终于意识到，他们永远无法对抗[GetProvince('(int32)1').GetName]的强大力量！现在，我们已经为该地区带来了和平，有一些常规的行政职责需要你来签字——我们一定会立即执行你的命令，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 roman_conquest_missions_inv.13.t:0 "在山的那边"
 roman_conquest_missions_inv.14.a:0 "伊德尔是个受祝福的地方，因为它将成为罗马的殖民地"
 roman_conquest_missions_inv.14.b:0 "皮埃塔斯·尤莉亚……嗯。选择这里有很好的理由"
 roman_conquest_missions_inv.14.c:0 "瑟革斯提卡是一个特殊的建设地点"
 roman_conquest_missions_inv.14.d:0 "塔耳萨提卡是你向我介绍的最好的地点"
 roman_conquest_missions_inv.14.desc:0 "荣耀归于罗马！我们已经成功地将利布尔尼亚海岸据为己有，确保这个极其重要的地区最终成为我们罗马霸权的一个稳定和安全的部分。如你所知，[ROOT.GetCountry.GetRuler.GetFirstName]，以[GetProvince('(int32)4020').GetName]为基地的海盗们一直横行霸道，肆无忌惮地进行袭击和恐吓；那些日子已经永远结束了。"
 roman_conquest_missions_inv.14.t:0 "利部耳尼亚海岸"
 roman_conquest_missions_inv.15.a:0 "萨洛纳是我们选择的地方"
 roman_conquest_missions_inv.15.b:0 "里西尼乌姆将是我们最新的殖民地的所在地"
 roman_conquest_missions_inv.15.c:0 "把定居者送到迪伦图姆"
 roman_conquest_missions_inv.15.d:0 "我们已亲自选定德尔米尼乌姆作为地点"
 roman_conquest_missions_inv.15.desc:0 "你会很高兴知道，[ROOT.GetCountry.GetRuler.GetName]，为了罗马的荣耀和力量，得尔马泰海岸已经得到保障。对我们的军队来说，驱散这些野蛮人的散兵游勇是件微不足道的事情，现在我们已经获得了新的领土，我们必须选择在哪里建立一个新的殖民地。请注意，[ROOT.GetCountry.GetRuler.GetFirstName]，仔细选择；该殖民地将成为该地区的新省会，因为我们希望我们的人民有一个新的开始。"
 roman_conquest_missions_inv.15.t:0 "得尔马泰决议"
 roman_conquest_missions_inv.16.a:0 "把定居者送到塞莱亚"
 roman_conquest_missions_inv.16.b:0 "萨瓦利亚也是一个不错的地点"
 roman_conquest_missions_inv.16.c:0 "卡农图姆将成为省会"
 roman_conquest_missions_inv.16.d:0 "摩根提亚纳？我已经为我们的人民选择了这个地区"
 roman_conquest_missions_inv.16.desc:0 "我们的罗马士兵真的离家很远；潘诺尼亚似乎离我们台伯河上的城市非常遥远，这就更需要庆祝这个光荣的时刻。我们罗马人不仅成为意大利无可争议的主人，而且还将我们的边界扩展到遥远的腹地，比如这个潘诺尼亚......任何威胁到我们和平的人都会发现自己被毁灭，无论他们的家在哪里！"
 roman_conquest_missions_inv.16.t:0 "潘诺尼亚的力量"
 roman_conquest_missions_inv.17.a:0 "西耳弥翁是我们的地方"
 roman_conquest_missions_inv.17.b:0 "“阿昆孔”这个名字有一种幸运的声音"
 roman_conquest_missions_inv.17.c:0 "穆尔萨是个吉利的地方--开始建设"
 roman_conquest_missions_inv.17.d:0 "印刻罗将成为省会"
 roman_conquest_missions_inv.17.desc:0 "你会相信吗，[ROOT.GetCountry.GetRuler.GetName]，我们的士兵完全占据下潘诺尼亚是多么容易？考虑到当地的蛮族给我们带来的麻烦，我们总觉得会遭到更多的抵抗才对……但这从未发生。\n\n算了，反正我们不会为被征服者的命运洒下任何眼泪。对于这个地区的未来，我们有重要的决定要做。"
 roman_conquest_missions_inv.17.t:0 "扩张到下潘诺尼亚"
 roman_conquest_missions_inv.18.a:0 "摩厄西亚的维弥纳基翁将成为这里最新的罗马城市"
 roman_conquest_missions_inv.18.b:0 "马耳索尼亚是我们选定的地方"
 roman_conquest_missions_inv.18.c:0 "辛吉杜农将成为斯科耳迪斯基亚的新省会"
 roman_conquest_missions_inv.18.d:0 "达斯弥尼翁是我们的工程师青睐的地点"
 roman_conquest_missions_inv.18.desc:0 "考虑到罗马人在潘诺尼亚地区的快速扩张，我们本以为生活在南部的斯科耳迪斯基人会从观察他们的邻居中吸取教训——显然，你不能指望野蛮人自行领悟什么，这些动物只懂得暴力。不用说，我们摧毁了他们的力量，必须决定这些领土中的哪一个将受到罗马建筑和文明的祝福。"
 roman_conquest_missions_inv.18.t:0 "粉碎斯科耳迪斯基人"
 roman_conquest_missions_inv.2.a:0 "罗托马顾斯有很大的潜力。"
 roman_conquest_missions_inv.2.b:0 "萨马罗布里瓦是跨越萨马拉河的桥梁。"
 roman_conquest_missions_inv.2.c:0 "革索里亚孔才是指挥海峡的地方。"
 roman_conquest_missions_inv.2.d:0 "我们应该着眼于加努恩塔和北海。"
 roman_conquest_missions_inv.2.desc:0 "当一个信使来到你的战备帐篷时，已经是深夜了，但你并没有睡觉，尽管已经快到三更天了；你的心思一直专注于管理贝尔吉卡的战事。你叫士兵上前，给自己倒了一杯波斯卡，靠在椅子上，把地图放在一边，一边打着哈欠。国王，我们从战场上的士兵那里得到了消息。诸神与我们同在；贝尔吉卡的海岸是我们的。虽然有小股抵抗力量在整个农村发酵，但维多利亚向我们微笑着。我们等待着你的下一个命令。\n\n你站起身来，所有睡眠的想法都消失了，你向士兵点头致谢。'告诉我的随从，我们在黎明时分离开营地；我想亲自视察建设新城市的地点。"
 roman_conquest_missions_inv.2.t:0 "$me_roman_conquest_of_tooltip$ 比利其"
 roman_conquest_missions_inv.3.a:0 "冬诺尼亚的伊斯卡，冬诺尼伊人人的家园！"
 roman_conquest_missions_inv.3.b:0 "我们的人民将在苏利斯的阿库埃温泉中康复。"
 roman_conquest_missions_inv.3.c:0 "我已经选择贝尔加鲁姆的文塔作为地点。"
 roman_conquest_missions_inv.3.d:0 "科里尼乌姆·多布诺鲁姆将成为不列颠尼亚最新的城市。"
 roman_conquest_missions_inv.3.desc:0 "紧紧抓住你的斗篷，你站在被风吹动的不列颠尼亚海海岸上，看着附近拥挤的港口里正在展开的场景。一场持续的大雨已经下了一整天，导致你的手下抱怨的声音比你通常接受的要大一些，但恶劣的天气和更恶劣的情绪并没有对你的计划造成任何严重的延误。几十艘满载士兵、驮畜和各种物资的罗马船沿着地平线聚集，咸湿的空气中充满了甲板工人和他们的船长准备登陆时的呼喊声。所有的骚动都很容易解释；现在不列颠尼亚的西南部已经被征服，你已经下令在附近建立永久的防御工事，你是来观察登陆的。渐渐地，你会把罗马文明带到这个地狱般的岛屿上，即使你必须亲自杀死每一个野蛮人，并亲手建造每一座城市才行。"
 roman_conquest_missions_inv.3.t:0 "$me_roman_conquest_of_tooltip$ 贝勒里昂"
 roman_conquest_missions_inv.4.a:0 "伦敦是一个很好的选择；让我们在那里建造。"
 roman_conquest_missions_inv.4.b:0 "卡穆洛杜努姆的遗址让我很高兴。"
 roman_conquest_missions_inv.4.c:0 "通知杜罗弗纳姆·坎蒂亚科鲁姆他们地位的改变。"
 roman_conquest_missions_inv.4.d:0 "爱西尼亚的文塔的周围平原是一个吉利的地点。"
 roman_conquest_missions_inv.4.desc:0 "我们吞并了不列颠尼亚岛的东南部，这应该不足为奇，尤其是考虑到这些土地离我们在高卢的财产有多近。你很高兴听到这样的报告：除了轻松击败派来对付你的潦倒的军队外，你的士兵们还发现了许多绝佳的建筑地点--我们可以以野蛮人做梦都想不到的方式开发这些土地。我们应该把我们的工程师和建筑师送到哪里？如果你选择的话，我们甚至可以重新利用其中一个现有的城市来适应罗马的议程。"
 roman_conquest_missions_inv.4.t:0 "$me_roman_conquest_of_tooltip$ 东南不列颠尼亚"
 roman_conquest_missions_inv.5.a:0 "文塔·西卢鲁姆的自然财富应该被开发"
 roman_conquest_missions_inv.5.b:0 "预兆表明维罗科尼翁是个好地方"
 roman_conquest_missions_inv.5.c:0 "Moriodunum和其他任何地方一样好"
 roman_conquest_missions_inv.5.desc:0 "你会高兴地听到，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们在西不列颠的军队已经彻底摧毁了派来对付他们的微弱力量，不放过任何一个敢于挑战罗马元老院和人民的权威的人。让我们征服这些土地的胜利成为对他们尚未臣服的野蛮亲属的一个信息。"
 roman_conquest_missions_inv.5.t:0 "$me_roman_conquest_of_tooltip$ 西不列颠尼亚"
 roman_conquest_missions_inv.6.a:0 "厄玻拉孔就是好地方。"
 roman_conquest_missions_inv.6.b:0 "我已经选择了卢顾瓦利翁。"
 roman_conquest_missions_inv.6.c:0 "也许我们应该考虑德瓦·维克特里克斯。"
 roman_conquest_missions_inv.6.d:0 "伊苏里翁·布里甘提翁姆将成为科里塔尼亚的新首都。"
 roman_conquest_missions_inv.6.desc:0 "千百年来，你从未想过你会离罗马城如此之远，然而你却在这里，看着你的士兵在布里甘蒂亚的森林中心竖起临时工事。拍掉脖子上的一只蠓，你往地上吐口水；这是一片被诅咒的土地，充满了看似无尽的沼泽和躲在粘稠水里的蓝纹野蛮人，一心想取罗马人的脑袋。在这些地区建立一个合适的罗马城市势在必行；现在你不惜一切代价也要泡上一个热水澡！"
 roman_conquest_missions_inv.6.t:0 "$me_roman_conquest_of_tooltip$ 布里甘蒂亚"
 roman_conquest_missions_inv.7.a:0 "雷里戈尼乌姆……是的，把我们的人送到那里去。"
 roman_conquest_missions_inv.7.b:0 "维卢尼亚忒将是我们的新殖民地的所在地。"
 roman_conquest_missions_inv.7.c:0 "不莱梅尼亚自然是唯一的选择。"
 roman_conquest_missions_inv.7.desc:0 "当你反思你最近的征服时，你不确定哪个成就更难实现；打败该死的喀里多尼亚人，你在不列颠岛遇到的最凶猛的战士，还是把文明带给他们。卡里多尼亚人是一个多愁善感的厚道人，对采用我们的方式有抵触情绪，但他们会在一段时间内被制服。为了加快这一进程，我们必须挑选一个新的地点进行开发——这些蛮族急需一切。"
 roman_conquest_missions_inv.7.t:0 "$me_roman_conquest_of_tooltip$ 喀里多尼亚"
 roman_conquest_missions_inv.8.a:0 "北达里尼亚将是我们的希伯尼亚前哨。"
 roman_conquest_missions_inv.8.b:0 "厄布拉尼亚是自然的选择。"
 roman_conquest_missions_inv.8.c:0 "集中我们的力量在西乌斯迪亚。"
 roman_conquest_missions_inv.8.d:0 "我已经决定在南奥忒尼亚。"
 roman_conquest_missions_inv.8.desc:0 "这次北方战役充满了惊喜；当你第一次决定征服不列颠尼亚时，你甚至不确定它是否是一个岛屿，你只听说过希伯尼亚的传闻，据说是在东部更远的地方的另一块土地。但现在，世界的这个角落已经没有什么神秘的东西了；希伯尼亚不是传说，而是罗马元老院和人民的最新财产，这要归功于你的野心。现在让我们转向在我们最新的省份建造城市这一令人满意的任务；请[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，告诉我们应该去哪里。"
 roman_conquest_missions_inv.8.t:0 "$me_roman_conquest_of_tooltip$希伯尼亚"
 roman_conquest_missions_inv.9.a:0 "曼塔拉可以获得最新鲜的水……它是自然的选择"
 roman_conquest_missions_inv.9.b:0 "俄克托杜鲁斯，不管出于什么原因，似乎是比其他地方更好的选择"
 roman_conquest_missions_inv.9.c:0 "奥古斯塔·普拉托里亚已经有了一个优雅的名字——也许我们应该在那里建造"
 roman_conquest_missions_inv.9.desc:0 "你好，[ROOT.GetCountry.GetRuler.GetName]——我们收到了来自驻扎在阿尔卑斯地区的军队的消息，并认为最好让你亲自听到这个消息。我们不仅高兴地报告，我们的军队已经支配了曾经居住在这些山丘和山谷的部落，而且我们现在必须为新的城市选择一个地点。这些山区急需罗马文明；我们越早开始建设越好。"
 roman_conquest_missions_inv.9.t:0 "阿尔卑斯山上雄心勃勃的活动"
 roman_mission_08_greece_task_final_tt:0 "我们将有机会选择释放#Y 希腊#!的一些主要城市作为#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的#Y 藩属国#!。"
 roman_roman_10_established_in_britannia_tt:0 "在不列颠尼亚选择生产或文明政策。"
 rome_rhaetia_ferrum_noricum:0 "诺里库姆的铁矿"
 rome_rhaetia_stopped_raids:0 "阻止雷蒂亚人的袭击"
 rome_root_out_pirates:0 "根除海盗"

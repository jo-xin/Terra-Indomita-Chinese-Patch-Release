l_simp_chinese:
 20_hellenic_pops_tt:0 "拥有20个或更多的#Y 希腊#!文化的人口。"
 DARAB:0 "达勒布"
 DERAZ:0 "“德拉兹·达斯特”"
 PENTAPOTAMIA:0 "般阐那陀"
 allow_hellenistic_empire_paurava:0 "可以解锁#Y 希腊化帝国#!任务树。"
 allow_them_to_attack_tt:0 "允许#E 波罗伐#!进攻#E 药地耶#!。"
 approval_of_the_people:0 "人民的批准"
 blessing_of_porus:0 "波罗斯的祝福"
 bread_for_all:0 "粮仓之粮仓"
 bread_for_bharat:0 "婆罗多的粮仓"
 careful_there_kid_tt:0 "#R 警告#!，#E 孔雀王朝#!已经#R 禁止#!这一行为。"
 center_of_faith:0 "信仰的中心"
 destroyer_of_taxila:0 "奢叉尸罗的毁灭者"
 frigg_up_arachosia:0 "获得对#Y 阿剌科西亚#!和#Y 萨塔吉地亚#!的宣称。"
 gandhara_claims_tt:0 "获得整个#Y 犍陀罗#!宣称。"
 hellenic_advancement:0 "希腊进步"
 indo_greek_unrest:0 "希腊动乱"
 indo_hellenic_home:0 "希腊人之家"
 major_leather_producer:0 "主要的皮革生产国"
 me_paurava_1.a:0 "菲伽斯"
 me_paurava_1.b:0 "伊拉瓦蒂瓦尔"
 me_paurava_1.c:0 "乔布纳特纳格尔"
 me_paurava_10.a:0 "显然，这是我们选择正确的标志。"
 me_paurava_100.a:0 "愿我们的帝国持续一千年。"
 me_paurava_100.b:0 "愿我们的人民生活在舒适之中，直到时间的尽头。"
 me_paurava_100_desc:0 "随着我们对印度的征服完成，我们的帝国跨越了一个巨大的土地网络。我们与许多不同的民族作战，从马其顿人，到孔雀人。而现在，我们自己已经成为历史上伟大的帝国之一。\n我们现在是一个伟大的王国，一个帝国，一个拥有一千个灵魂的国家。作为这样一片富饶土地的管理者，我们有责任决定它的命运应该是什么样子的。一些顾问主张征服已知的世界，他们显然是[GetCharacter('(int32)39').GetPraenomen]战役的老兵，而其他人只是想和平地享受他们的生活，并告诉我们。"
 me_paurava_100_title:0 "印度的宝石"
 me_paurava_100_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_33$#!' $mission_completed_tooltip_2$"
 me_paurava_10_desc:0 "萨卡拉在印度河流域有很大的影响力。我们的人民很快就皈依了国教!"
 me_paurava_10_title:0 "我们的信仰在传播"
 me_paurava_11.a:0 "佛陀是明智的。"
 me_paurava_11.b:0 "《吠陀经》是我们的传统。"
 me_paurava_11_desc:0 "佛教在我们的首都广泛传播，而我们对它的公开支持使人们对国家认为的国家信仰产生了疑问。"
 me_paurava_11_title:0 "信仰的问题"
 me_paurava_12.a:0 "筏驮摩那是明智的。"
 me_paurava_12.b:0 "《吠陀经》是我们的传统。"
 me_paurava_12_desc:0 "耆那教在我国首都广泛传播，我们对它的公开支持使人们对国家所认为的国家信仰产生了疑问。"
 me_paurava_12_title:0 "信仰的问题"
 me_paurava_13.a:0 "戈沙拉是明智的。"
 me_paurava_13.b:0 "《吠陀经》是我们的传统。"
 me_paurava_13_desc:0 "正命论在我国首都的传播非常广泛，我们对它的公开支持使人们对国家所认为的国家信仰产生了怀疑。"
 me_paurava_13_title:0 "信仰的问题"
 me_paurava_19.a:0 "令人惊讶但又是好消息!"
 me_paurava_19_desc:0 "看来#E 波罗伐#!决定逆势而为，与我们对抗，争取独立。这些愚蠢的家伙就该受到这样的对待。我们将粉碎这些自诩能像波罗斯对抗亚历山大那样战斗的后起之秀。"
 me_paurava_19_title:0 "布罗伐宣战"
 me_paurava_1_desc:0 "萨卡拉已成为纺织品和丝绸的重要生产地。随着我们资本的增长和纺织业利润的提升，这一影响力有望进一步扩大。\n\n我们应在哪个地区鼓励发展纺织品的补充生产？"
 me_paurava_1_title:0 "皮革生产"
 me_paurava_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_paurava_2.a:0 "谴责这三个疯子。"
 me_paurava_2.b:0 "佛教徒有一些令人信服的观点。"
 me_paurava_2.c:0 "耆那教的人是本地人，让他漫游。"
 me_paurava_2.d:0 "那个正命论者似乎很敬业，让我们听听他的意见。"
 me_paurava_20.a:0 "我们会好好利用这些资金。"
 me_paurava_20_desc:0 "我们是波罗斯的孩子，我们已经向保拉瓦的人民承诺为我们的王国提供一个盛大的回归形式。他们反过来也聚集了资金，给我们支持，以实现这个梦想。"
 me_paurava_20_title:0 "波罗斯的孩子"
 me_paurava_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_0$#!' $mission_completed_tooltip_2$"
 me_paurava_21.a:0 "让我们看看他们的反应。"
 me_paurava_210.a:0 "我们会让他们做这个白日梦。"
 me_paurava_210.b:0 "他们敢和我们讨价还价？"
 me_paurava_210_desc:0 "#E 布罗伐人#!计划对#E 药地耶#!宣战。我们必须选择谴责他们，否则就意味着我们选择让他们与#E  药地耶人#!作战。如果我们允许他们进攻#E 药地耶#!，他们将继续成为我们的附庸。然而，如果我们拒绝，他们可能会在有机会时直接与我们开战，届时他们将不再是我们的附庸国。"
 me_paurava_210_title:0 "犍陀罗为了……波罗伐？！"
 me_paurava_21_desc:0 "让孔雀王朝和#E 犍陀罗#!区域的其他部落感到懊恼的是，我们已经宣布自己是上印度河谷的合法统治者！最关心的莫过于#E 药地耶#!的对手们，对此我们只能说“真可惜！”\n\n我们将向#E 摩揭陀#!提出一项协议：若他们允许我们终结#E 药地耶#!——该区域争夺#E 犍陀罗#!霸权的最大竞争者，我们将继续成为他们的附庸。我们将在任务期限结束时得知他们的决定。"
 me_paurava_21_title:0 "犍陀罗的罗阇"
 me_paurava_22.a:0 "我们将自己征服这些土地。"
 me_paurava_22_desc:0 "#E 犍陀罗#!的人们来到我们的首都传递消息。他们听说了我们对#E 犍陀罗#!的宣称，决定支持我们与#E 孔雀王朝#!开战，助我们夺回这片土地，让它回归更熟悉的民族手中。我们刻不容缓，此刻正是击溃#E 旃陀罗笈多#!血脉的时机。"
 me_paurava_22_title:0 "对抗一个帝国"
 me_paurava_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_paurava_23.a:0 "像波罗斯一样，我将领导!"
 me_paurava_23_desc:0 "准备的时间已经结束。现在是大象和战车与敌人交战的时候了。"
 me_paurava_23_title:0 "宣布开战!"
 me_paurava_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_9$#!' $mission_completed_tooltip_2$"
 me_paurava_24.a:0 "让我们利用这个团结的机会。"
 me_paurava_24_desc:0 "孔雀王朝公主和波罗伐国王的结合是盛大的，代表着未来两国之间更大的合作机会。"
 me_paurava_24_title:0 "一个盛大的婚礼"
 me_paurava_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_paurava_25.a:0 "药地耶的时代已经到来！"
 me_paurava_25.b:0 "时机未到。"
 me_paurava_25_desc:0 "是时候终结#E 药地耶#!威胁！我们可以向他们宣战，而且我们最好做好准备，迎战这个强大好战的共和国，以免我们在前往#E 罗塔克#!的进军中失败。"
 me_paurava_25_title:0 "消灭药地耶人"
 me_paurava_2_desc:0 "萨卡拉是一个位于印度河谷的完美部分的城市，可以影响他人。因此，它吸引了许多宗教人士前来并试图传播他们的信仰。\n\n最近，一位著名的佛教僧侣来到首都，传播他的思想。这激起了当地一位耆那教苦行僧做同样的事。现在，一个裸体的正命论者也不甘示弱，来宣扬自己的信仰。"
 me_paurava_2_title:0 "传播一种信仰"
 me_paurava_3.a:0 "确实是一个富有成果的安排。"
 me_paurava_3_desc:0 "我们对五河之地的宣称已经得到了孔雀王朝的批准。他们给予我们任何他们能给予的土地。"
 me_paurava_3_title:0 "般阐那陀是我们的！"
 me_paurava_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_paurava_4.a:0 "为战争做好准备。"
 me_paurava_40.a:0 "萨卡拉将成为世界上最伟大的城市!"
 me_paurava_40_desc:0 "我们的首都成长为该地区一个突出的贸易中心。在未来几年，在伟大的领导下，它可能会发展得更快。"
 me_paurava_40_title:0 "我们伟大的首都"
 me_paurava_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_paurava_41.a:0 "必须只有一个伟大的城市。"
 me_paurava_41_desc:0 "曾经的伟大城市奢叉尸罗已经被洗劫一空。让全世界都知道波罗斯之子和我们的首都的优越性。"
 me_paurava_41_title:0 "奢叉尸罗被洗劫一空！"
 me_paurava_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_paurava_42.a:0 "这对我们这个宏伟的城市来说是一个美妙的选择。"
 me_paurava_42_desc:0 "我们新的萨卡拉大学是世界上最伟大，甚至是最伟大的知识殿堂之一。这将使我们的人口在未来几代人中得到丰富。"
 me_paurava_42_title:0 "萨卡拉大学完成"
 me_paurava_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_paurava_43.a:0 "终于有地方可以容纳我的书了。"
 me_paurava_43_desc:0 "塔克萨西拉是一个值得我们怜悯和尊重的伟大。我们将维护这座城市并宣布它为知识的第二首都。奢叉尸罗大学的大门现在向我们敞开了。"
 me_paurava_43_title:0 "塔克萨西拉的第二首都"
 me_paurava_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_paurava_44.a:0 "波罗斯国王保佑我们!"
 me_paurava_44_desc:0 "我们的王国现已囊括了整个犍陀罗的土地。我们终于建立了一个连波罗斯国王都会引以为傲的国家。这一历史性时刻甚至让一些人开始向这位传奇国王祈祷。事实上，你甚至可以亲自接受这位神灵，以进一步巩固你的统治合法性。"
 me_paurava_44_title:0 "波鲁斯必须感到骄傲"
 me_paurava_45.a:0 "现在没有亚历山大可以拯救他们了。"
 me_paurava_45_desc:0 "现在是时候了，我们要为希腊人所说的Hydaspes战役的失败报仇，并将希腊人赶回去。"
 me_paurava_45_title:0 "消灭来自马其顿的威胁"
 me_paurava_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_paurava_46.a:0 "很明显，他们承认我们的伟大领导。"
 me_paurava_46_desc:0 "我们的信仰已经传遍了印度河流域，影响了所有围绕我们的人。"
 me_paurava_46_title:0 "信仰的传播者"
 me_paurava_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_paurava_47.a:0 "更多的臣民不可能成为一个问题。"
 me_paurava_47_desc:0 "希腊人曾经是外国人，但现在他们属于印度，当然是在我们的统治之下。"
 me_paurava_47_title:0 "希腊人的家"
 me_paurava_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_paurava_48.a:0 "希腊的仪式是一种方式。"
 me_paurava_48.b:0 "我们是希腊人，但我们也是印度人。"
 me_paurava_48.c:0 "利用桑加拉将希腊万神殿传遍印度河!"
 me_paurava_48_desc:0 "既然我们自己是坚定的希腊人，那么采用希腊神的问题就出现了。我们应该接受宙斯的方式吗？"
 me_paurava_48_title:0 "另一个信仰问题"
 me_paurava_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_27$#!' $mission_completed_tooltip_2$"
 me_paurava_49.a:0 "波罗斯的孩子们是至高无上的。"
 me_paurava_49_desc:0 "随着希腊人的威胁在印度的结束，很明显，我们布罗伐人是印度库什山这边最伟大的民族，实际上，也是在印度库什山以外的地方！保拉旺人的孩子们是最伟大的！"
 me_paurava_49_title:0 "布罗伐人的至高无上的地位"
 me_paurava_49_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_paurava_4_desc:0 "我们宣称马德拉斯为我们的王国！萨卡拉是该区域的首府，因此该区域的其他地方应该由我们主政。3个月后，我们将进攻并占领理应属于我们的地方。"
 me_paurava_4_title:0 "保拉瓦的马德拉斯!"
 me_paurava_5.a:0 "无论如何，他们在我们的领导下会更好。"
 me_paurava_50.a:0 "一个位于世界边缘的闪亮的希腊王国。"
 me_paurava_50_desc:0 "在采用了希腊人的生活和思想方式之后，我们已经摆脱了我们的老路。因此，从现在开始，我们将被称为希腊的般阐那陀王国！"
 me_paurava_50_title:0 "般阐那陀成立！"
 me_paurava_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_paurava_51.a:0 "足以哺育整个婆罗多大地的粮仓！"
 me_paurava_51_desc:0 "旁遮普始终是印度全境最繁荣的地区之一。无论追溯至吠陀时代之前，还是展望遥远未来，这片土地永远都是人烟稠密之地。"
 me_paurava_51_title:0 "旁遮普地区的繁荣盛景"
 me_paurava_51_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_51$#!' $mission_completed_tooltip_2$"
 me_paurava_52.a:0 "这座要塞永不会陷落！"
 me_paurava_52_desc:0 "诺哈尔堪称旁遮普的缩影——既有乡村的质朴风情，又具备都市般的人口密度。其中有个名为\"卢瓦尔\"的设防村落，近来尤其受到贵族阶层的青睐。这座集村庄与要塞于一体的特殊城镇，未来将如何发展，唯有时间能给出答案。"
 me_paurava_52_title:0 "诺哈尔的贵族们"
 me_paurava_52_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_52$#!' $mission_completed_tooltip_2$"
 me_paurava_53.a:0 "我爱莫妮——我是说——马利亚！"
 me_paurava_53_desc:0 "当人们论及五河之城，或许会遥指极北的奢叉尸罗、我国都城萨卡拉，抑或东境的哈斯提纳普尔与因陀罗普罗斯陀——但事实上，旁遮普的心脏正在马利亚跃动。下般阐那陀诸城商贾云集，四方来客皆欲从这繁华市井中分一杯羹。而在我们的统治下，这般盛况必将长续不衰。"
 me_paurava_53_title:0 "马利亚的商贾"
 me_paurava_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_53$#!' $mission_completed_tooltip_2$"
 me_paurava_54.a:0 "面包将不会成为一个问题！"
 me_paurava_54_desc:0 "旁遮普省拥有得天独厚的耕地和丰沛的年降水量。这个地区可以养活整个婆罗多，而且还能剩下一些出口到海外！我们只需助力这片土地的发展，就已经看到了可观的回报。"
 me_paurava_54_title:0 "印度的粮仓"
 me_paurava_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_54$#!' $mission_completed_tooltip_2$"
 me_paurava_5_desc:0 "被称为印度-希腊人的他们已从孔雀王朝叛离，并成为我王国的威胁。我们必须将这些王国纳入我方版图，以免让希腊人肆意蹂躏摩卢与犍陀罗。"
 me_paurava_5_title:0 "征服印度-希腊人"
 me_paurava_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_15$#!' $mission_completed_tooltip_2$\n\n获得了对#Y 印度-希腊王国#!的宣称。"
 me_paurava_6.a:0 "让我们亲眼看看亚历山大的家。"
 me_paurava_65.a:0 "回到正题。"
 me_paurava_65_desc:0 "被一些人戏称为“希腊危机”的政治不稳定已经解决。"
 me_paurava_65_title:0 "希腊危机得到解决"
 me_paurava_65_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_paurava_69.a:0 "这句话听起来不错。"
 me_paurava_69_desc:0 "India顶端的土地一直都有自己的传统，有王公贵族什么的。我们已经将这些土地统一起来，人们现在称你为王子之王。"
 me_paurava_69_title:0 "使命任务'#Y $paurava_missions_task_69$#!'现已#G 完成#!！"
 me_paurava_6_desc:0 "希腊国内的事情已经彻底解决了，然而在我们的人民中，他们现在喊着要占领地平线，就像亚历山大曾经征服过我们的一样。有人称其为“逆转俄刻阿诺斯”。要征服直到我们看到世界的另一面，在那里它将在无尽的海洋中结束。"
 me_paurava_6_title:0 "希腊地平线"
 me_paurava_6_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_paurava_7.a:0 "这是进一步征服的门户!"
 me_paurava_77.a:0 "我仍然看到那边的土地..."
 me_paurava_77_desc:0 "终于，我们征服了亚历山大的故乡。我们的帝国比他的帝国更加辽阔。现在，我们需要巩固这一统治并庆祝胜利。俄刻阿诺斯并非由亚历山大征服，而是由我们征服的。"
 me_paurava_77_title:0 "终于"
 me_paurava_77_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_77$#!' $mission_completed_tooltip_2$"
 me_paurava_7_desc:0 "我们期待进一步扩展到我们南部的富饶土地。有一些伟大的城市将完全适合不断增长的帝国。"
 me_paurava_7_title:0 "印度河以南"
 me_paurava_7_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_paurava_88.a:0 "达罗毗荼人或雅利安人，他们将是我的臣民。"
 me_paurava_88_desc:0 "德干高原是阿加玛人的土地的起点。达罗毗荼人成为我们征服印度的下一个目标。"
 me_paurava_88_title:0 "德干高原"
 me_paurava_88_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_32$#!' $mission_completed_tooltip_2$"
 me_paurava_89.a:0 "旃陀罗笈多正在看着。"
 me_paurava_89_desc:0 "般遮耶是孔雀帝国人口稠密的城市的所在地。现在是时候让他们接受我们的统治了。"
 me_paurava_89_title:0 "般遮耶"
 me_paurava_89_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_31$#!' $mission_completed_tooltip_2$"
 me_paurava_90.a:0 "沿着这条强大的河流向东走!"
 me_paurava_90_desc:0 "恒河孕育了许多文化、宗教，甚至是人。该地区资源丰富，将是我们接下来征服的明显步骤。"
 me_paurava_90_title:0 "恒河"
 me_paurava_90_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_30$#!' $mission_completed_tooltip_2$"
 me_paurava_96.a:0 "我几乎可以尝到俄刻阿诺斯的味道了!"
 me_paurava_96_desc:0 "亚历山大的家就在赫勒斯滂的那边。我们终于成功了，只剩下一步了!"
 me_paurava_96_title:0 "俄刻阿诺斯在望"
 me_paurava_97.a:0 "我几乎可以尝到俄刻阿诺斯的味道了!"
 me_paurava_97_desc:0 "现在我们到达了安纳托利亚的土地。这些人一直处于文明的十字路口，比任何人都记得更久。现在轮到我们在这里建立统治了。"
 me_paurava_97_title:0 "我们对安纳托利亚的统治"
 me_paurava_97_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_97$#!' $mission_completed_tooltip_2$"
 me_paurava_98.a:0 "这一切都像巴比伦一样倒下了。"
 me_paurava_98_desc:0 "我们对马其顿的征服的第二步是幼发拉底河和底格里斯河的土地，包括传说中的巴比伦城市。"
 me_paurava_98_title:0 "我们对巴比伦的统治"
 me_paurava_98_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_98$#!' $mission_completed_tooltip_2$"
 me_paurava_99.a:0 "因此，冒险开始了。"
 me_paurava_99_desc:0 "我们对马其顿的征服的第一步是波斯。我们对这些土地很熟悉，曾经由居鲁士大帝统治，然后由马其顿人统治。"
 me_paurava_99_title:0 "我们对波斯的统治"
 me_paurava_99_tt:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_99$#!' $mission_completed_tooltip_2$"
 me_paurava_task_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $paurava_missions_task_10$#!' $mission_completed_tooltip_2$"
 okeanos_reached:0 "俄刻阿诺斯的成就"
 paurava_40_percen_tt:0 "40%以上的人信奉国教。"
 paurava_eat_anatolia:0 "获得对#Y 安纳托利亚#!的整个地区的宣称。"
 paurava_eat_avanti:0 "获得对#Y 摩卢#!和#Y 阿槃提#!的宣称。"
 paurava_eat_deccan:0 "获得对#Y 阿婆兰多#!和#Y 民陀高原#!的宣称。"
 paurava_eat_dravidia:0 "获得对#Y 达罗毗荼#!和#Y 羯那多#!的宣称。"
 paurava_eat_ganges:0 "获得对#Y 摩柁提娑#!的宣称。"
 paurava_eat_macedon:0 "获得对#Y 亚历山大#!的家乡的宣称。"
 paurava_eat_mesopotamia:0 "获得对#Y 美索不达米亚#!和#Y 亚述#!的宣称。"
 paurava_eat_persia:0 "获得对#Y 阿里亚纳#!和#Y 波斯#!的宣称。"
 paurava_eat_pracya:0 "获得对#Y 般遮耶#!的宣称。"
 paurava_enslave_hellenes_tt:0 "任一#Y 希腊#!文化是#R 被奴役#!文化。"
 paurava_final_task_choices_tt:0 "我们将可以选择一个奖励。"
 paurava_greek_gods:0 "#T 般阐那陀#!采用#Y 希腊#!信仰。"
 paurava_hellenic_integrated_tt:0 "任一#Y 希腊#!文化是#G 被接受#!文化。"
 paurava_hellenic_pop_tt:0 "省内的任何民众都是希腊文化。"
 paurava_indo_greek_claims_tt:0 "获得了对#Y 印度-希腊王国#!的宣称。"
 paurava_indo_greeks_tt:0 "在印度-希腊王国到来之前，该使命无法完成。"
 paurava_maurya_100.tt:0 "与#G 100#!的关系超过#T Maurya#!。"
 paurava_maurya_120.tt:0 "与#G 120#!有超过#T 孔雀王朝#!的关系。"
 paurava_missions:0 "国王波罗斯的后裔"
 paurava_missions_02_mod:0 "丝绸"
 paurava_missions_BUTTON_TOOLTIP:0 "波罗斯的王国将变得伟大。"
 paurava_missions_CRITERIA_DESCRIPTION:0 "这个任务将在恢复波罗斯王国和处理马其顿的威胁后完成。"
 paurava_missions_DESCRIPTION:0 "传说中的波罗斯国王在十王之战中与亚历山大大帝交战。虽然没有取得胜利，但波罗斯国王的战斗令人印象深刻，甚至连伟大的马其顿将军都对波罗斯产生了敬意。我们将夺回这位传奇国王曾经统治的土地，并粉碎那些反对恢复其王国的人。然后，我们将进一步推进!"
 paurava_missions_button_tooltip:0 "为了波罗斯国王的遗产!"
 paurava_missions_criteria_desc:0 "这一使命将在波罗斯国王的王国被开垦和充实后完成。"
 paurava_missions_desc:0 "传说中的波罗斯国王在十王之战中与亚历山大大帝交战。虽然没有取得胜利，但波鲁斯国王的战斗令人印象深刻，甚至伟大的马其顿将军也对波鲁斯产生了敬意。我们将夺回这位传奇国王曾经统治的土地，并粉碎那些反对恢复其王国的人。"
 paurava_missions_task_0:0 "波罗斯的孩子"
 paurava_missions_task_0_DESC:0 "传说中的波罗斯国王在十王之战中与亚历山大大帝交战。虽然没有取得胜利，但波罗斯国王的战斗力令人印象深刻，甚至连伟大的马其顿将军都对他充满了敬意。我们将夺回曾经由这位传奇国王统治的土地，并粉碎那些反对恢复其王国的人。\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 paurava_missions_task_1:0 "保拉瓦的首都"
 paurava_missions_task_10:0 "药地耶的对手"
 paurava_missions_task_10_DESC:0 "药地耶共和国的威胁正危及我们的安全。他们好战的作风以及与孔雀王朝的密切联系，可能使他们掌控我们应得的领土。我们应当成为犍陀罗的国王，为此，我们必须终结药地耶。\n\n\n\n\n\n\n\n\n\n@india_mil21!"
 paurava_missions_task_11:0 "波罗斯王国"
 paurava_missions_task_11_DESC:0 "传说中的波罗斯会对我们的统治感到骄傲。他的王国被骄傲地恢复了。印度河流域上游是波罗斯之子的家园。\n\n\n\n\n\n\n\n\n\n@india_mil12!。"
 paurava_missions_task_12:0 "消灭孔雀王朝"
 paurava_missions_task_12_DESC:0 "是时候我们像罗阇波罗斯一样挺身而出，向整个帝国宣战了！\n\n#R 我们将向#E 孔雀帝国宣战。#!。#! \n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 paurava_missions_task_15:0 "印度希腊人"
 paurava_missions_task_15_DESC:0 "印度-希腊王国在反抗孔雀王朝之后到达我们的边界。这是我们的领域，因此我们有责任来处理。\n\n\n\n\n\n\n\n\n\n@greek_mil12!。"
 paurava_missions_task_16:0 "希腊人的家园"
 paurava_missions_task_16_DESC:0 "我们应该在印度为被征服的希腊人提供一个家。他们可能对我们的社会有用。\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 paurava_missions_task_17:0 "让希腊人离开"
 paurava_missions_task_17_DESC:0 "我们必须把印度河的亚历山大枷锁永远地扯掉！\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 paurava_missions_task_18:0 "拥抱希腊思想"
 paurava_missions_task_18_DESC:0 "希腊人涌入我们的土地，对我们的文化产生了深刻的影响。也许我们应该拥抱他们的方式而不是反对他们？\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 paurava_missions_task_19:0 "希腊存在问题的处理"
 paurava_missions_task_19_DESC:0 "我们以出色的效率和领导力解决了希腊危机。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 paurava_missions_task_1_DESC:0 "强大的萨卡拉城是宗教和文化传播的好地方，也是接下来两千年的纺织之都。\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 paurava_missions_task_2:0 "萨卡拉的丝绸"
 paurava_missions_task_20:0 "希腊地平线"
 paurava_missions_task_20_DESC:0 "我们的目光远离印度，面向希腊人的土地。让我们亲眼看看亚历山大从哪里来。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 paurava_missions_task_21:0 "征服南方"
 paurava_missions_task_21_DESC:0 "我们的焦点转移到南方和印度的财富。\n\n\n\n\n\n\n\n\n\n@india_mil18! 征服南方"
 paurava_missions_task_22:0 "验证吠陀经"
 paurava_missions_task_22_DESC:0 "作为我们民族最古老的信仰，《吠陀经》在几代人中一直很突出。为什么要改变我们一直以来的信仰？\n\n\n\n\n\n\n\n\n\n@india_mil2!"
 paurava_missions_task_23:0 "烙印佛教"
 paurava_missions_task_23_DESC:0 "佛教已经迅速在我们民族中传播。作为最新的萨满教信仰，佛教可以在我们的王国里蓬勃发展。\n\n\n\n\n\n\n\n\n\n@event_pic6!"
 paurava_missions_task_24:0 "加入耆那教"
 paurava_missions_task_24_DESC:0 "耆那教在印度河流域一直占有重要地位，已经成为我们民族乃至整个流域身份的一部分。\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 paurava_missions_task_25:0 "正命论的回答"
 paurava_missions_task_25_DESC:0 "正命论曾经远为繁荣，然而它最近却在衰退。然而，它可能在我国重新繁荣并焕发新生。\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 paurava_missions_task_26:0 "山谷的宗教之都"
 paurava_missions_task_26_DESC:0 "萨卡拉可能会将其宗教信仰传播到邻国，因为它是印度河流域上游的贸易中心，地位显赫。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 paurava_missions_task_27:0 "印度河流域的希腊诸神"
 paurava_missions_task_27_DESC:0 "有了新的希腊-印度身份，信仰的问题又一次得到了回答。我们应该继续保持我们的印度信仰还是采用希腊的仪式？\n\n\n\n\n\n\n\n\n\n@greek_mil18!。"
 paurava_missions_task_2_DESC:0 "萨卡拉，作为纺织品之都，只生产最好的丝线。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 paurava_missions_task_3:0 "奢叉尸罗之劫"
 paurava_missions_task_30:0 "恒河"
 paurava_missions_task_30_DESC:0 "恒河是仅次于我们的印度河的第二大河。事实上，它更大。让我们把它作为我们领域的一部分。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 paurava_missions_task_31:0 "向般遮耶前进"
 paurava_missions_task_31_DESC:0 "般遮耶地区是孔雀王朝帝国的家园。让我们为自己打造这个历史悠久的地区，真正成为统治印度的最伟大的帝国。\n\n\n\n\n\n\n\n\n\n@persia_mil6!。"
 paurava_missions_task_32:0 "征服德干高原"
 paurava_missions_task_32_DESC:0 "德干高原将我们与信奉阿迦摩信仰的土地隔开。我们要让他们感到没有安全感，并在这片高原上建立我们的统治。\n\n\n\n\n\n\n\n\n\n\n\n@india_mil15!"
 paurava_missions_task_33:0 "印度的瑰宝"
 paurava_missions_task_33_DESC:0 "我们从印度河谷崛起。一个敢于同帝国作战的国王的影子。就像他一样，我们与一个帝国战斗，与许多敌人斗争。而现在，我们已经建立了我们认为是有史以来最伟大的帝国——我们是印度的大宝石。\n\n\n\n\n\n\n\n\n\n@india_mil11!。"
 paurava_missions_task_3_DESC:0 "由于奢叉尸罗在我们的控制之下，我们可以洗劫它的财富，并将利润点缀到我们伟大的城市——萨卡拉将取代奢叉尸罗的位置。\n\n#R 这是一项互斥任务。#!\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 paurava_missions_task_4:0 "萨卡拉大学"
 paurava_missions_task_4_DESC:0 "奢叉尸罗大学的知识和遗产将在萨卡拉得到延续。我们将建立萨卡拉的大大学。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 paurava_missions_task_4_tt:0 "已经完成$paurava_missions_task_3$。"
 paurava_missions_task_5:0 "第二座首都"
 paurava_missions_task_51:0 "旁遮普地区的繁荣盛景"
 paurava_missions_task_51_DESC:0 "旁遮普是印度最繁荣的区域之一。无论追溯到吠陀时代之前，还是展望遥远的未来，旁遮普都将永远是人类的中心。\n\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 paurava_missions_task_52:0 "诺哈尔的贵族们"
 paurava_missions_task_52_DESC:0 "#E 诺克尔#! 是我们与#E 药地耶#! 接壤的一座享有盛誉的城市。在卢瓦尔区，乡村的城墙已经有了良好的基础，足以抵御#E 药地耶人#! 的袭击。\n\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 paurava_missions_task_53:0 "马利亚的商贾"
 paurava_missions_task_53_DESC:0 "#E 摩罗婆#!是一个蒙祝福的城市。下旁遮普的土地非常适合人口增长，就连亚历山大也曾感叹五河两岸有诸多城市。\n\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 paurava_missions_task_54:0 "婆罗多的粮仓"
 paurava_missions_task_54_DESC:0 "旁遮普是许多著名城市、学者、商贾等的家园。但它最引以为傲的宣称是其作为任何想在#E 婆罗多#!建立霸业者的“粮仓”的地位。\n\n\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 paurava_missions_task_5_DESC:0 "塔克西拉是犍陀罗地区唯一像萨卡拉一样宏伟的城市。让我们把它变成国家的第二首都。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 paurava_missions_task_6:0 "信仰的中心"
 paurava_missions_task_69:0 "王子中的国王"
 paurava_missions_task_69_DESC:0 "印度最南端的王公们将成为我们大帝国的优秀臣民。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 paurava_missions_task_6_DESC:0 "在历史上，萨卡拉是一个对整个北印度产生宗教影响的地方。它负责传播佛教，然而我们可能有机会选择在我们的国家传播任何宗教。\n\n\n\n\n\n\n\n\n\n@india_mil13!"
 paurava_missions_task_7:0 "孔雀联姻"
 paurava_missions_task_77:0 "俄刻阿诺斯的成就"
 paurava_missions_task_77_DESC:0 "我们终于来到了大海上，实现了亚历山大的俄刻阿诺斯之梦。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 paurava_missions_task_7_DESC:0 "旃陀罗笈多和他伟大的孔雀帝国笼罩着我们的王国。最好是用血缘关系将我们与强大的帝国联系在一起，以免他们反而将我们视为敌人。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 paurava_missions_task_8:0 "五河之国"
 paurava_missions_task_8_DESC:0 "般阐那陀，是流入印度河的五条大河的土地。我们对这片土地的统治是有限的，然而，凭借我们与孔雀王朝的密切关系，我们应该能够说服他们授予我们般阐那陀的其他地区。\n\n\n\n\n\n\n\n\n\n@india_mil3!。"
 paurava_missions_task_9:0 "马德拉斯的问题"
 paurava_missions_task_96:0 "成功抵达马其顿"
 paurava_missions_task_96_DESC:0 "终于，我们来到了希腊人最初的家园的短板上。这里的大水体，一定是俄刻阿诺斯本身。我们的最后一步必须是征服亚历山大本人的家园。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 paurava_missions_task_97:0 "吞并安纳托利亚"
 paurava_missions_task_97_DESC:0 "安纳托利亚是到达希腊人的故乡之前的最后一步。这些土地曾经是一千个神和一千个民族的家园。让我们把我们的规则介绍给这些多样化的土地。\n\n\n\n\n\n\n\n\n\n@persia_mil11!。"
 paurava_missions_task_98:0 "掌握美索不达米亚"
 paurava_missions_task_98_DESC:0 "两条河的土地，即底格里斯河和幼发拉底河。传说讲述了Alexander是如何征服这片土地的，更多的是讲述了这里的文明。有些人甚至说曾经有Indians像我们一样，在很久很久以前建立了一个帝国。让我们从传说中找出真相。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 paurava_missions_task_99:0 "推过波斯"
 paurava_missions_task_99_DESC:0 "通往希腊和马其顿的第一步是通过曾经由居鲁士大帝统治的土地。我们已经从几代人的努力中熟悉了这些人。兴都库什山脉以外的地方正等待着冒险! \n\n\n\n\n\n\n\n\n\n@persia_mil8!。"
 paurava_missions_task_9_DESC:0 "我们在萨卡拉的首都属于被称为马德拉斯的地区。野蛮的Khasa部落的Dardic人占据了马德拉斯的北部。让我们纠正这种情况。\n\n\n\n\n\n\n\n\n\n@india_mil14!。"

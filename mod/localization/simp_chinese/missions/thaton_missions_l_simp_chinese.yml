 me_thaton_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_thaton_14.a:0 "吾等即金邻，诸神之殿本身。"
 me_thaton_14_desc:0 "我辈已成#E 孟人诸邦#!之最伟者。此刻，我辈理当自称为所有孟人之#E #Y 帝国#!#!。"
 me_thaton_14_title:0 "$thaton_missions_task_14$"
 me_thaton_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_thaton_15.a:0 "吾等将通过宗教探寻自我。"
 me_thaton_15_desc:0 "我贸易路线横贯东西，我征服之土纵跨南北，我辈已成为荟萃诸多#E #Y 文化与宗教#!#!之实体。因此，寻定一体认同已极为艰难。我辈确为#E 孟人#!之王国，然#E 信仰之归宿#!尚未明朗。在我辈信念真正统一之前，必须细察所有涌入我国之信仰，加以辨析。"
 me_thaton_15_title:0 "$thaton_missions_task_15$"
 me_thaton_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_thaton_16.a:0 "吾等应更多了解此容教。"
 me_thaton_16.b:0 "我看此容教毫无意义。"
 me_thaton_16.c:0 "东方尚有其他信仰如何？"
 me_thaton_160.a:0 "此墨家似乎玄妙。"
 me_thaton_160.b:0 "百越或有益处。"
 me_thaton_160.c:0 "那神道信仰引我注目。"
 me_thaton_160.d:0 "我还是倾向其他选项。"
 me_thaton_160_desc:0 "我辈已对#E 扶南#!以东更远之处之信仰心生好奇。毕竟，若信仰相近，则我与远至#E 中国#!之贸易可更上层楼。#E 扶南#!以东及以北，#E 傣#!人信奉#E #Y 甲#!#!，即其#E 莫教#!中之雷神。再往东去，#E #Y 万物有灵#!#!之#E 百越#!信仰亦似颇为有趣。而自彼再往北，黄河之民所言及之#E #Y 神#!#!信仰，颇令我辈想起自家之#E 纳特#!。我辈当斟酌东方之何种信仰？"
 me_thaton_160_title:0 "东方诸信仰"
 me_thaton_16_desc:0 "我辈吞并#E 沈犁王国#!之故地，使我辈接触到名为#E 雍教#!之宗教。此教与我#E 纳特#!信仰，殊非迥异。此颇值玩味，或可助我辈更贴近东方之贸易伙伴。且鉴于#E 雍教#!与#E 纳特#!之相似，令民众皈依当为易事。"
 me_thaton_16_title:0 "$thaton_missions_task_16$"
 me_thaton_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_thaton_17.a:0 "佛教"
 me_thaton_17.b:0 "吠陀教"
 me_thaton_17.c:0 "阿含教"
 me_thaton_17.d:0 "耆那教"
 me_thaton_17.e:0 "阿耆毗伽教"
 me_thaton_17.f:0 "遮卢婆伽教"
 me_thaton_17.g:0 "容教"
 me_thaton_17.h:0 "那提教"
 me_thaton_17.i:0 "墨家"
 me_thaton_17.j:0 "百越信仰"
 me_thaton_17.k:0 "神道"
 me_thaton_17_desc:0 "终究定夺之时已至……我辈之国教当为何？我辈已为#E 佛教徒#!所围，受#E 沙门#!诸教之动摇，为#E 雍教徒#!所争取，叹服于#E 吠陀#!与#E 阿含#!，亦未忘我#E 纳特#!之本源。然，我辈乃#E 众神殿#!，众神集会之所。若不知如何敬拜，众神何得集会？\n\n我辈必须回答：#E 众神殿之门当为何方神祇而开？#!"
 me_thaton_17_title:0 "$thaton_missions_task_17$"
 me_thaton_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_thaton_18.a:0 "佛法萌芽于吾湾。"
 me_thaton_18_desc:0 "来自#E 楞伽#!之#E 佛教徒#!涌入我国！码头充斥彼等关于#E 佛陀#!之宣教，我民已开始皈信。此事已不可再忽视，#E 佛教#!在我国内已俨然成为主要宗教。此究竟为好为坏，须由我辈决断。"
 me_thaton_18_title:0 "$thaton_missions_task_18$"
 me_thaton_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_thaton_19.a:0 "生机勃勃之吠陀似有趣味…"
 me_thaton_19.b:0 "若吠陀生机勃勃，阿含则令人惊叹。"
 me_thaton_19.c:0 "沙门诸教？为我道来。"
 me_thaton_19.d:0 "佛教徒已充斥处处，不容更多异端！"
 me_thaton_190.a:0 "耆那教似显高尚…"
 me_thaton_190.b:0 "阿耆毗伽教似显专业…"
 me_thaton_190.c:0 "遮卢婆伽教似有说服力…"
 me_thaton_190.d:0 "我觉得还是之前的选项好…"
 me_thaton_190_desc:0 "#E 沙门#!诸教包含#E 佛教#!。其虽未似#E 佛教#!之盛，然或许亦合于我民。#E #T 耆那教徒#!#!于信仰之热忱令人欣悦。#E #G 阿耆毗伽#!#!之禁欲苦行令人惊叹。#E #R 顺世论者#!#!之否认论调亦令人深思。"
 me_thaton_190_title:0 "照亮沙门诸教"
 me_thaton_19_desc:0 "随#E 佛教徒#!流入我国，亦有其他来自#E 婆罗多#!之信仰抵我港口。其中有宣讲#E #T 光辉吠陀#!#!者，我民对此信仰似颇易接纳。除#E 吠陀#!外，尚有不少人讲述#E 阿含#!，亦有论及似#E 佛教#!而实则不同之信仰，称为#E 沙门#!诸教。"
 me_thaton_19_title:0 "$thaton_missions_task_19$"
 me_thaton_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_thaton_1_desc:0 "#E 直通#!，亦称#E 萨杜因#!，乃我邦国。我辈为#E 孟#!人，据#E 伊洛瓦底江#!之入海口。我#E 孟#!人之中，有三大王国，其余我族则为部落聚落。作为#E 南方王国#!，我辈有责任在#E 伊洛瓦底江#!沿岸之伟大民族中确立霸权。因我辈即#E 萨杜因#!，乃#E #Y 众神殿#!#!。"
 me_thaton_1_title:0 "$thaton_missions_task_1$"
 me_thaton_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_thaton_2.a:0 "南方王国扩张。"
 me_thaton_20.a:0 "为何不#E 纳#!入考量，至少铭记于心。"
 me_thaton_20_desc:0 "近来，在#E 佛教#!及来自#E 婆罗多#!之其他外来信仰纷纷扰扰之际，我辈亦当铭记本源。我辈对#E 纳特#!之信仰，及我辈珍贵之#E 纳特#!信念，在#E 孟#!人之中流布甚广。"
 me_thaton_20_title:0 "$thaton_missions_task_20$"
 me_thaton_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_thaton_21.a:0 "双赢！"
 me_thaton_21_desc:0 "#E 星诃那伐提#!之#E 掸#!人乃一群未开化之族群，与我等#E 直通#!#E 孟#!人自不可同日而语。我辈将在该地立足，此事关我辈当前之利益，作为交换，将许#E 掸#!人迁入该地，托庇于我。"
 me_thaton_21_title:0 "$thaton_missions_task_21$"
 me_thaton_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_thaton_2_desc:0 "我辈已决意#E #R 征服#!#!沿海之#E 孟人#!部落。此举虽显凌厉，然此诸部之民终将悟得，并入#E 直通王国#!将使其与我辈同得其利。"
 me_thaton_2_title:0 "$thaton_missions_task_2$"
 me_thaton_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_thaton_3.a:0 "确是辉煌之日。"
 me_thaton_30.a:0 "#E 萨杜因#!繁荣昌盛"
 me_thaton_30_desc:0 "自#E 直通#!城邦始，我辈之势已扩至南岸。越山至#E 乌通#!之崎岖之地。及至我西岸与伊洛瓦底河谷之#E 勃固#!。#E 孟#!人已齐聚，统一于强大之贸易帝国之下。而今我辈可进一步扩展市集，亦可广传我信仰。因我辈即为众神之会场。愿#E 苏凡纳布米帝国#!万世长存！"
 me_thaton_30_title:0 "贸易帝国"
 me_thaton_30_tooltip:0 "任务树'#Y 诸神之殿#!'现已#G 完成#!！"
 me_thaton_3_desc:0 "#E 丹那沙林#!沿岸诸部已受我影响，加入我势力范围。纵使其仍为部落形态，因文化相近，我辈当能迅速#E 整合#!之。#E 直通#!，伟大之#E 南方王国#!，其荣耀由外交而增焉。"
 me_thaton_3_title:0 "$thaton_missions_task_3$"
 me_thaton_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_thaton_4.a:0 "为王真好！"
 me_thaton_4_desc:0 "以我势力遍及南岸，今可获益于东方世界之贸易矣！与东方之珍异而宝贵之贸易，将助长我#E 文明#!、#E 财货#!与#E 人口#!。"
 me_thaton_4_title:0 "$thaton_missions_task_4$"
 me_thaton_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_thaton_5.a:0 "人愈多，税愈多！"
 me_thaton_5_desc:0 "#E #Y 海风#!#!拂面而来，港口市肆熙攘喧嚣，满是来自#E 中国#!至#E 扶南#!之异域奇货，芬芳馥郁，味道醇烈。而至关要者，#E #T 金满府库#!#!。此即贸易之力也。"
 me_thaton_5_title:0 "$thaton_missions_task_5$"
 me_thaton_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_thaton_6.a:0 "神明对萨杜因微笑。"
 me_thaton_6_desc:0 "#E 直通#!，于我辈更以#E 萨杜因#!闻名，乃至圣之城。此地，神与人于光天化日之下并肩而行。此地，对神之崇敬无可匹敌。此城，实为虔诚、崇拜与祝福之城。我之#E #T 光明灯塔#!#!，我之神之城。"
 me_thaton_6_title:0 "$thaton_missions_task_6$"
 me_thaton_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_thaton_7.a:0 "要是我们的孩子爱吃蔬菜就好了。"
 me_thaton_7_desc:0 "我之#E 马达班#!聚落虽远不如都城#E 直通#!显赫，然其肩负至为关键之使命。镶宝石之盘碟与银器，若不能盛以食物，则毫无意义。是以#E 马达班#!已成为我辈之伟大园圃。西方传闻有所谓#E #T 悬空之巨园#!#!。虽我不甚解此传说之全意，然#E #G 我绿意葱茏之园圃#!#!定可与彼等之'空中花园'一争高下。"
 me_thaton_7_title:0 "$thaton_missions_task_7$"
 me_thaton_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_thaton_8.a:0 "新岸线、新货物、新财源！"
 me_thaton_8_desc:0 "#E 萨杜因#!已成为#E #Y 熏香#!#!贸易中极负盛名之城。此亦理之当然，盖#E #Y 熏香#!#!在东西两地诸多宗教仪式中皆被奉用。赖我强大之商路，今已引来远逾预期之四方来客。"
 me_thaton_8_title:0 "$thaton_missions_task_8$"
 me_thaton_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_thaton_9.a:0 "吾等处于香料与丝绸之交汇点。"
 me_thaton_9_desc:0 "与西方之贸易已通，今大量#E #Y 乌兹钢#!#!已涌入我口岸。此种产自#E 婆罗多#!的神秘物产用途甚广，然于我辈而言，更紧要者在于——通往西方之商路已豁然开朗！"

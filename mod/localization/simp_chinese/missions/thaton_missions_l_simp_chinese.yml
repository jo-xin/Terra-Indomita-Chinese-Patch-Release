 me_thaton_110_desc:0 "#E 勃固#!之卑劣王竟已察觉我方攻彼之图谋，遂下令对我发动#R 先发制人#!之击！ #E 勃固#!之陆师与水师已临我城门之下，我辈须火速行动，#R 然我尚未真正准备好#!迎接此战。"
 me_thaton_110_title:0 "勃固先发制人！"
 me_thaton_11_desc:0 "光荣之王[ROOT.GetCountry.GetRuler.GetName]已迅速应对#E 勃固#!之突袭，我师现已整备，决意#G 击败来犯之敌#!。#Y 众神殿#!将显其震怒！"

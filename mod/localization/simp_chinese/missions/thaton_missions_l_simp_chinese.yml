 thaton_missions_BUTTON_TOOLTIP:0 "#E 萨杜因#!之子啊，众神召唤于你。"
 thaton_missions_CRITERIA_DESCRIPTION:0 "此任务将于#E 直通王国#!巩固其对东南亚孟族人之霸权时完成。"
 thaton_missions_DESCRIPTION:0 "神秘之#E直通王国#!，据佛教传说，乃佛陀诞生后不久所建，传至#E 59代上座部佛教君主#!。然考古与史籍所载并非如此。\n\n直通在土人孟语中称为#E萨杜印#!，其名源自苏檀摩补罗一词，乃印度-雅利安语，意为#E「众神之集会」#!。萨杜印之城邦，至迟于公元前四世纪建立，因与锡兰间之贸易而致富。此王国，俗称#E直通王国#!，日后将统一南孟大部，并进入传奇之林，最终为#E勃固王国#!所征服。自其建立至最终毁灭之漫长岁月中，留下了持久之文化遗产，永存于其最终信仰之传说中。\n\n在此任务中，通过统一南方，创建传奇之#E直通王国#!，进而超越历史上直通所未能企及之极境。#E众神之殿#!，必将成为不仅界定南孟之认同，更超越其上之神授国度！"
 thaton_missions_task_1:0 "南方王国"
 thaton_missions_task_10:0 "传奇诞生"
 thaton_missions_task_10_DESC:0 "我王国已成为孟人眼中#T传奇#!般之存在。他国对我投以艳羡之目光，盖我之影响力随#E自楞伽至寮国之商路#!远播四方。"
 thaton_missions_task_11:0 "勃固之王"
 thaton_missions_task_11_DESC:0 "#Y勃固王国#!乃我#Y直通王国#!之真敌手。是时矣，我两方之角逐#R已至兵戎相见#!。吾等断不可再坐视旁观。#T只能存在一个传奇#E孟#!人王国#!。"
 thaton_missions_task_12:0 "溯伊洛瓦底而上"
 thaton_missions_task_12_DESC:0 "#Y伊洛瓦底江河谷#!乃我新兴王国自然扩张之所。此地丰饶之#Y贸易货品#!，以及#E孟#!人在河口定居之历史，皆为我统一#Y伊洛瓦底江#!诸部提供充足之理据。"
 thaton_missions_task_13:0 "孟人遍山野"
 thaton_missions_task_13_DESC:0 "于我东方，有一#E孟#!人王国，#Y谌离王国#!。虽昔时遥远，然今我已与彼及彼等雄都#E乌通#!接壤。是时宜将最后之#E孟#!人王国统一于一面旗帜之下。"
 thaton_missions_task_14:0 "全孟帝国"
 thaton_missions_task_14_DESC:0 "我之疆土，虽难称广袤，然商贾繁盛，自有其传奇之资。他人或须真正征服天下方能宣称#Y帝国#!，而我仅需稍事扩张便可#W铭刻我之遗产#!，成为#E全孟族人之帝国#!。"
 thaton_missions_task_15:0 "信仰之命运"
 thaton_missions_task_15_DESC:0 "人口之涌入及其所带来之#Y诸宗教#!，已开始阻碍我妥善弘扬#E国教#!之能力。宜当决断如何处置我之#Y宗教#!局面。#T我信仰之命运#!，系于未来之瞬息。"
 thaton_missions_task_16:0 "雍教枷锁"
 thaton_missions_task_16_DESC:0 "#E 孟#!族之民属于#Y 谌离王国#!者，今已归我管辖。由此，对#Y 雍吉教#!之分析，将有助于我等理解新附之民及其#E 信仰#!。"
 thaton_missions_task_17:0 "诸神归谁之殿？"
 thaton_missions_task_17_DESC:0 "抉择#Y 何宗何教#!为我#E 国教#!之时机已至。我等非独审视#E 佛教#!与#E 纳特教#!，亦遍观东西各方之信仰。此事绝非易决，然答案终将揭晓。"
 thaton_missions_task_18:0 "萌芽的佛教"
 thaton_missions_task_18_DESC:0 "#E 佛教#!于我国中已成极盛之信仰。#E 楞伽#!商贾甚至已着手#Y 劝化#!我土民皈依#E 佛陀#!之教。彼等尤重宣扬此#T 上座部佛教#!。然于我详察其情之前，凡此皆为#E 佛门#!之事而已。"
 thaton_missions_task_19:0 "鲜活的吠陀"
 thaton_missions_task_19_DESC:0 "#E 婆罗多#!之地，不仅将#E 佛教#!带入我港口，亦携来#T 吠陀#!之说。究竟此#T 吠陀#!为何物？而#E 婆罗多#!之地，是否尚有#W 他种信仰#!可供我参详？"
 thaton_missions_task_1_DESC:0 "#E 孟#!人之王国，仅有三者。山岭之彼端，有#Y 顺里王国#!。北境伊洛瓦底巨川之口，崛起#Y 勃固王国#!。终焉，自#E 萨杜印#!城邦起，我#Y 直通王国#!临御一方。当固我王国之基，筹划#G 扩张势力#!之策。"
 thaton_missions_task_2:0 "沿海征服"
 thaton_missions_task_20:0 "勿贬纳神"
 thaton_missions_task_20_DESC:0 "吾#E 孟#!人首要信奉者，乃#E 纳特#!之伟大信仰。我本土之宗教虽已为我等所熟谙，然仍当审视其于我国瞬息万变之宗教生态中所居之位。或竟无需更张，但#G 弘扬#E 纳特#!#!信仰，使其为我土唯一之真信。"
 thaton_missions_task_21:0 "开化辛哈纳瓦提"
 thaton_missions_task_21_DESC:0 "#Y 新诃那伐底#!之#E 掸#!人，可以#T 钱财#!、#G 势力#!与#R 殖民#!化之。彼等或终成我优良之臣民，且事实上，于我与此区之关系，实属#W 两利#!之境。\n\n我等仅需毗邻此区，并展示我对此地之绝对掌控，便可着手行动。"
 thaton_missions_task_2_DESC:0 "#E 萨杜印#!以南沿海之兄弟族众，犹处我掌控之外。吾等将以#R 武力夺取#!之，令其领受我王国之荣光！"
 thaton_missions_task_3:0 "萨杜因的信众"
 thaton_missions_task_3_DESC:0 "何必向南境#E 孟#!同胞兄弟流血相残？彼辈必将#G 闻理而从，以外交协迫归附我王国#!。"
 thaton_missions_task_4:0 "东向商路"
 thaton_missions_task_4_DESC:0 "我之势力今已遍及南岸，遂可自与#E 东方世界#!之贸易中#G 获益#!。此诸岸口，必将因交易而#T 殷富#!！"
 thaton_missions_task_5:0 "海上之城"
 thaton_missions_task_5_DESC:0 "#E 珍贵商货#!既抵我岸，此地昔日部落之民，已开始聚为#E 雄壮之城#!。#Y 文明于海畔繁兴#!。"
 thaton_missions_task_6:0 "诸神之城"
 thaton_missions_task_6_DESC:0 "我城#E 萨杜印#!——或称#E 直通#!者——确为#T 诸神集会#!之城。凡来我城者，不论神圣抑或凡俗，必当使其尽享#Y 直通文明之奇观#!。"
 thaton_missions_task_7:0 "翠绿园圃"
 thaton_missions_task_7_DESC:0 "为供应我疾速膨胀之都城#E 萨杜印#!以粮秣，必须开垦田野，提高#E 马达班#!之#G 蔬食#!产量。当使此乡野狭地化为#T 粮仓#!——或更确切言之，#T 萨杜印之蔬圃#!。"
 thaton_missions_task_8:0 "焚香有理"
 thaton_missions_task_8_DESC:0 "#E 萨杜印#!今以其#Y 熏香#!贸易而驰名。#R 需求既增#!，#G 供给自当随之#!，以此#T 极尽我之利#!，凭贸易日益壮大我之势力。"
 thaton_missions_task_9:0 "西向商路"
 thaton_missions_task_9_DESC:0 "#E 萨杜印#!已成为#T 婆罗多#!商贾之常至贸易地。彼等之香料与货物，随其离港而涌入我城，我辈因而大获其利。此等货物，包括彼等卓异之#G 乌兹钢#!——其制法举世莫知，然依然流转至我之码头。\n\n#E 我当确保与#T 达罗毗荼#!之#G 乌兹钢#!贸易#!。"

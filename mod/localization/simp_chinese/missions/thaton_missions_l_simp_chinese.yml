 me_thaton_12.a:0 "吾等纯蒙神明眷顾。"
 me_thaton_12_desc:0 "#E #Y 伊洛瓦底河谷#!#!，乃诸多民族之家园，如#E 布朗族#!、#E 若开族#!、#E 掸族#!、#E 骠族#!，及当然，我#E 孟族#!。如此伟大之河谷，理应由如我辈之文明之族统治。整条可航行之河川已尽归我手，全#E #Y 骠地#!#!归我治下，仅为时日问题矣。"
 me_thaton_12_title:0 "$thaton_missions_task_12$"
 me_thaton_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $thaton_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_thaton_13.a:0 "此等言语…何义？何人语我？必为神明。"
 me_thaton_130.a:0 "吾等要求其臣服。"
 me_thaton_130.b:0 "吾等将以补偿换取其忠诚。"
 me_thaton_130.c:0 "不必下最后通牒，直接宣战。"
 me_thaton_130_desc:0 "#E 沈犁王国#!归我统治之时已至。只可有一大#E 孟#!邦，且此邦必为#E 萨杜因#!。#E 乌通#!城将成为通往我#E 萨杜因#!之陆路贸易之绝佳通道，而所有#E 孟人#!之财富，亦将归于一统！"
 me_thaton_130_title:0 "$thaton_missions_task_13$"
 me_thaton_131.a:0 "吾等别无选择，唯有降服。"
 me_thaton_131.b:0 "呸！黄金摇篮岂能屈从诸神之殿。"
 me_thaton_131.c:0 "无需言语回应。且看他们如何。"
 me_thaton_131_desc:0 "吾主，吾主！#E 直通王国#!传来警讯。彼等#E #R 要求#!#!我辈臣服！我辈或可屈服于其最后通牒，或以反抗回击，或全然置之不理。国家将来之命运，悬于君手。"
 me_thaton_131_title:0 "达通最后通牒"
 me_thaton_132.a:0 "那就兄弟阋墙，以战相决吧。"
 me_thaton_132.b:0 "他们自然臣服于我之治下。"
 me_thaton_132_desc_1:0 "#E 森利王国#!决定#E #G 接受#!#!吾等之通牒。"
 me_thaton_132_desc_2:0 "#E 森利王国#!决定#E #R 拒绝#!#!吾等之通牒。"
 me_thaton_132_title:0 "森利之回应"
 me_thaton_13_desc:0 "你好，我是#E 伊兹恩#!，此任务树出自我手！若你看到此条任务，说明发生了可怕之事，我完全不明白你是怎么触发这个的。不过，如果你是随机发现的，那还挺有趣的！拿一个彩蛋称号吧。"

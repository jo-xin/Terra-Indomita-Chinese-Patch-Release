 aryavarta_missions:0 "雅利安人的土地"
 aryavarta_missions_BUTTON_TOOLTIP:0 "#E 雅利安人#! 将统治印度。"
 aryavarta_missions_CRITERIA_DESCRIPTION:0 "当 #E 雅利瓦尔塔#! 将北印度统一于其统治之下时，此任务将被视为完成。"
 aryavarta_missions_DESCRIPTION:0 "#E 雅利瓦尔塔#! 意为“雅利安人的土地”，主要指 #E 犍陀罗#! 和 #E 摩柁提娑#!，这些地区统称为 #E 印度-恒河平原#!。随着时间推移，#E 雅利瓦尔塔#! 涵盖的区域有所变化，但通常指西部印度-雅利安人居住的区域，这些人被称为 #E [GetCultureGroup('aryan').GetName]#!。"
 aryavarta_missions_task_1:0 "雅利瓦尔塔之心"
 aryavarta_missions_task_10:0 "猎人高原"
 aryavarta_missions_task_10_DESC:0 "民陀高原大致翻译为猎人高原，展示了居住在这片土地上的人民类型。我们的东部般遮耶表亲很好地主宰了这里，是一个强大的对手。因此，将他们纳入我们的旗帜下比作为一个独立实体更容易。"
 aryavarta_missions_task_11:0 "南方的姐妹"
 aryavarta_missions_task_11_DESC:0 "萨特普拉山脉以南有许多王国，其中许多与我们共享雅利安遗产。通过外交而非流血说服其中一个归于我们的统治，应该不会太难。"
 aryavarta_missions_task_12:0 "羯陵伽的新王"
 aryavarta_missions_task_12_DESC:0 "羯陵伽人是般遮耶人中最文明的群体之一，在我们的统治下他们可以更加繁荣。虽然我们可以直接控制他们，但他们已展现出显著的自治能力，因此在我们的领导下给予名义上的独立或许是命运的安排。"
 aryavarta_missions_task_13:0 "楞伽，达罗毗荼，香料"
 aryavarta_missions_task_13_DESC:0 "婆罗多南端以三件事闻名于我们：最远的雅利安人——楞伽人，介于我们与楞伽之间的达罗毗荼人，以及湿婆亲自赐福的各种香料 @spices!。"
 aryavarta_missions_task_14:0 "辉煌之岛"
 aryavarta_missions_task_14_DESC:0 "色彩丰富、充满活力的斯里兰卡岛远离雅利安世界的核心，发展出了自己的历史。或许应将他们重新引入主流雅利安领域，或许他们应成为我们伟大土地的附庸国。无论如何，有一件事是肯定的：斯里兰卡应受我们的统治。"
 aryavarta_missions_task_15:0 "加兰德岛"
 aryavarta_missions_task_15_DESC:0 "被描述为岛屿花环的马尔代夫有着有趣的历史。源于楞伽人，它们代表了雅利安文化的奇特分支，某种程度上既更接近又更远离雅利瓦尔塔的核心。无论如何，他们是我们的血亲兄弟，统一的雅利安国家需要他们受到我们的保护。"
 aryavarta_missions_task_16:0 "高地"
 aryavarta_missions_task_16_DESC:0 "卡纳塔被称为高地。它为我们雅利安人所熟知，尤其是西高止山脉的富庶部分，其季风雨从未停止让外人惊叹。西高止山脉以东的高原则由达罗毗荼人主宰。这两片土地共同构成了高地，因此整个地区都将受我们控制。"
 aryavarta_missions_task_17:0 "水环之地"
 aryavarta_missions_task_17_DESC:0 "达罗毗荼是梵语中指三面环水的土地。它还源自“泰米尔”一词，很好地描述了居住在这里的人民类型。除了被水环绕，它还被印度-雅利安人四面包围，这自然意味着要完成雅利安控制的婆罗多，最终必须由雅利安人定居。"
 aryavarta_missions_task_18:0 "远征缅甸"
 aryavarta_missions_task_18_DESC:0 "缅甸地区居住着与我们无关的异族，与南方的达罗毗荼人无甚关联，但他们不同之处在于大规模采纳我们的传统，并熟悉我们的文化。让我们将这种联姻更进一步，正式将缅甸引入雅利瓦尔塔的领域。"
 aryavarta_missions_task_19:0 "婆罗多的主人"
 aryavarta_missions_task_19_DESC:0 "当婆罗多的所有土地都由雅利安人控制时，我们的使命将完成。婆罗多是我们的 homeland，现在已统一。虽然边界内居住着外族，但来到婆罗多的最纯粹的吠陀文明主宰了它。雅利瓦尔塔和婆罗多瓦尔沙终有一天将合二为一。"
 aryavarta_missions_task_1_DESC:0 "放下征服雅利安核心疆域之外的欲望，我们必须首先统一核心领土。萨特莱杰河、拉维河、比亚斯河、杰赫勒姆河和奇纳布河，这些河流由印度河连接，还有恒河、亚穆纳河和萨拉斯瓦蒂河。正是这些河流赋予了我们身份认同。"
 aryavarta_missions_task_2:0 "巩固信德"
 aryavarta_missions_task_20:0 "卡恰盐沼"
 aryavarta_missions_task_20_DESC:0 "卡恰地区以一种被称为盐沼的地理特征而闻名。盐沼意为卡恰的盐泽。事实上，尽管卡恰在我们的地图上几乎显示为一个岛屿，但这并非全年如此。有时，覆盖盐沼的几英寸水会被太阳神苏利耶显现。无论如何，我们可以利用卡恰盐沼为我们自己收获盐 @salt!。"
 aryavarta_missions_task_21:0 "雅利安农业"
 aryavarta_missions_task_21_DESC:0 "$me_aryavarta_21_desc$"
 aryavarta_missions_task_22:0 "建立贸易联系"
 aryavarta_missions_task_22_DESC:0 "我们需要在我们的土地上建立洲际贸易。这可以通过在辛德河和恒河沿线推广和发展一系列贸易城市来实现，从而在我们的边界内促进东西雅利安人之间更密切的关系。"
 aryavarta_missions_task_23:0 "色彩文化"
 aryavarta_missions_task_23_DESC:0 "#E 吠陀#! 文化是我们所推崇的，总是充满色彩。红色、蓝色、紫色等点缀了我们的生活方式。我们之所以能做到这一点，是因为我们在雅利瓦尔塔各地生产了大量的 #Y 染料#! @dye!。"
 aryavarta_missions_task_24:0 "印度-恒河之路"
 aryavarta_missions_task_24_DESC:0 "#E 孔雀王朝#!修建了连接恒河#E 孟加拉#!到#E 般阐那陀#!的道路，然而辛德河没有类似的道路系统。让我们将位于旧#E 孔雀王朝#!道路系统上的#E 萨卡拉#!连接到辛德河尽头的#E 德巴尔#!。"
 aryavarta_missions_task_25:0 "卡提凯亚神庙"
 aryavarta_missions_task_25_DESC:0 "千头之神 #E 卡提凯亚#! 当然值得我们为其建造一座宏伟的神庙。因此，让我们在他的追随者众多的 #E 罗托克#! 向他致敬，展示 #E 雅利安人#! 有足够的能力获得他的祝福。"
 aryavarta_missions_task_26:0 "湿婆神庙"
 aryavarta_missions_task_26_DESC:0 "#E 湿婆#!，毁灭者，吉祥之神，伟大之神。#E 瓦拉纳西#! 的人民已经很好地崇拜他，因此我们将通过在追随者可以膜拜蓝喉之神的地点建造一座宏伟神庙，进一步向 #E 湿婆#! 致敬。"
 aryavarta_missions_task_27:0 "罗摩神庙"
 aryavarta_missions_task_27_DESC:0 "最贴近人心的神 #E 罗摩#! 将获得一座全新城市供其崇拜。#E 诺卡尔#! 的一个区域有特别虔诚的 #E 罗摩#! 崇拜者。这个区域将被命名为 #E 拉瓦普尔#!，以 #E 罗摩#! 之子拉瓦王子的名字命名。"
 aryavarta_missions_task_28:0 "毗湿奴神庙"
 aryavarta_missions_task_28_DESC:0 "#E 毗湿奴#! 是最受欢迎的神之一，因此将在 #E 阿约提亚#! 最繁荣且历史悠久的地区中心为他建造一座宏伟神庙。愿他的崇拜永存！"
 aryavarta_missions_task_29:0 "建造宏伟神庙"
 aryavarta_missions_task_29_DESC:0 "如果我们拨出巨额资金并投入这些资源建造一座献给众神的宏伟神庙，可能会为我们的国家带来多年的繁荣。我们只需决定哪个伟大的圣城值得拥有这样的神庙。"
 aryavarta_missions_task_2_DESC:0 "辛德河，外人称之为印度河，为这片我们称为家园的土地赋予了“印度”之名。我们必须为新的雅利安国家整合所有辛德河流域的土地。"
 aryavarta_missions_task_3:0 "整合恒河流域"
 aryavarta_missions_task_30:0 "重燃吠陀信仰"
 aryavarta_missions_task_30_DESC:0 "作为前波罗斯王国 #E 帕乌拉瓦#!，我们曾面临多种信仰选择。现在，作为所有雅利安人的罗阇，我们需要对我们土地上的 #E 吠陀#! 信徒做出让步。如果我们自己已是 #E 吠陀#!，这将是一大福音！但若不然，我们可能需要考虑妥协。"
 aryavarta_missions_task_32:0 "达罗毗荼之梦"
 aryavarta_missions_task_32_DESC:0 "我们现在统治的达罗毗荼人是一群有趣的人。他们的 #E 阿伽玛#! 信仰与我们的 #E 吠陀#! 传统相似，却又截然不同。他们完全不是 #E 印度-雅利安人#!，或许应该保持如此。或者，我们现在就应该消除他们独立的任何希望。"
 aryavarta_missions_task_3_DESC:0 "恒河，亦称冈嘎河，是整个婆罗多地区最大的河流系统，也是雅利安身份开始演变的地方。我们必须为新的雅利安国家整合恒河流域。"
 aryavarta_missions_task_4:0 "印度-恒河平原"
 aryavarta_missions_task_4_DESC:0 "印度-恒河平原是雅利瓦尔塔土地的基本地理描述。这里是我们雅利安人最繁荣的地方。然而，我们不会止步于此。雅利瓦尔塔虽已实现，但我们的边界之外仍有雅利安人。因此，我们还有更多工作要做。"
 aryavarta_missions_task_5:0 "七山之外"
 aryavarta_missions_task_5_DESC:0 "七山，或称萨特普拉山脉，位于我们的南部边界，将北婆罗多与南婆罗多分隔开来。我们很容易在此划定边界，但事实是，雅利安文明已远远扩展到这些山脉之外。因此，我们必须追随我们的同胞，跨越这些雄伟的悬崖。"
 aryavarta_missions_task_6:0 "摩卢地区"
 aryavarta_missions_task_6_DESC:0 "毗邻下辛德河的摩卢区域，拥有得天独厚的海岸线，便于贸易往来。有了信德作为起点，我们拥有将摩卢区域其余部分纳入控制的所有条件。"
 aryavarta_missions_task_7:0 "阿槃提的雅利安人"
 aryavarta_missions_task_7_DESC:0 "在婆罗多西北海岸与东部恒河系统之间，曾经存在伟大的雅利安王国阿槃提。虽然不总是被纳入雅利瓦尔塔的定义中，但他们是雅利安人，且能通过陆地连接我们的国家，而非仅依赖辛德河和恒河。"
 aryavarta_missions_task_8:0 "摩揭陀王国"
 aryavarta_missions_task_8_DESC:0 "雅利安群体在摩柁提娑区域发生了文化转变，这在很大程度上归因于普拉恰的摩揭陀人。普拉恰文明可能是我们的表亲群体，但我们需要确保他们回归传统的雅利安文化。还有什么比征服孔雀王朝的家乡更好的方法呢？"
 aryavarta_missions_task_9:0 "西部边界"
 aryavarta_missions_task_9_DESC:0 "西部边界，或称阿婆兰多，是一个灌溉系统极佳的区域。西高止山脉的北部通向南婆罗多丰富的香料地。雅利安文明的连续性在阿婆兰多结束，因此一旦它受我们影响，就应视为雅利瓦尔塔不可或缺的新部分。"
 aryavarta_not_existing:0 "#E 雅利瓦尔塔#! 尚未存在。"

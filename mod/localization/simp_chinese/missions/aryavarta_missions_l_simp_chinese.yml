 form_aryavarta:0 "组建雅利瓦尔塔"
 form_aryavarta_desc:0 "雅利瓦尔塔，雅利安人的土地，贵族之国。所有吠陀印度-雅利安人的集体土地已汇聚一堂。通过联合这些土地的人民，我们可以击败任何敢于阻挡我们的帝国。一个保护北印度人民、他们的理想、宗教、传统以及我们称之为家的国家的诞生。"
 hunter_plains_arya:0 "平原与森林的猎人"
 indian_ocean_trade:0 "印度洋贸易"
 indus_highway_tt:0 "每个 #Y 信德#! 省份永久获得 #G +5% 人口容量#! 和 #G +2% 人口增长#!。"
 kalinga_arya_tt:0 "选择创建一个新的 #E 羯陵伽#! 傀儡国家。"
 kalinga_confed_tt:0 "创建#E 羯陵伽联邦#!作为#Y 藩属#!。"
 kalinga_kingdom_tt:0 "恢复 #E 羯陵伽王国#! 作为 #Y 藩属#!。"
 lanka_confed_tt:0 "创建#E 斯里兰卡共和国#!作为 #Y 藩属#!。"
 lanka_kingdom_tt:0 "创建#E 阿㝹罗陀补罗王国#!作为 #Y 藩属#!。"
 lavapur:0 "拉瓦普尔"
 markets_of_maru:0 "摩卢市场城市"
 me_aryavarta_1.a:0 "我们将统一雅利安人！"
 me_aryavarta_10.a:0 "我们将利用这种经验为我们所用。"
 me_aryavarta_10_desc:0 "民陀高原的这些土地居住着许多民族。当然有般遮耶人和达罗毗荼人，甚至一些雅利安人，但在最部落化的地区还有阿迪瓦西。管理这片土地不易，但将为我们在森林和平原作战提供丰富经验。"
 me_aryavarta_10_title:0 "$aryavarta_missions_task_10$"
 me_aryavarta_10_tooltip:0 "任务‘#Y $aryavarta_missions_task_10$#!’现已 #G 完成#!"
 me_aryavarta_11.a:0 "我们真是最伟大的摩诃罗阇。"
 me_aryavarta_11_desc:0 "作为伟大的雅利安国家 #E 雅利瓦尔塔#!，我们在南方的盟友很容易被说服成为我们的附庸国。他们获得名义上的独立，我们获得一个可选择扩展的臣属国。"
 me_aryavarta_11_title:0 "$aryavarta_missions_task_11$"
 me_aryavarta_11_tooltip:0 "任务‘#Y $aryavarta_missions_task_11$#!’现已 #G 完成#!"
 me_aryavarta_12.a:0 "我们就是羯陵伽的国王。"
 me_aryavarta_12.b:0 "我们将为羯陵伽国王开启新时代。"
 me_aryavarta_12.c:0 "向他们展示共和国的道路；一个羯陵伽联邦！"
 me_aryavarta_12_desc:0 "羯陵伽人一直是高尚的民族，即使他们是 #E 般遮耶#!。我们现在必须决定如何处理他们。是恢复他们的国家，还是简单地保留为我们所有？"
 me_aryavarta_12_title:0 "$aryavarta_missions_task_12$"
 me_aryavarta_12_tooltip:0 "任务‘#Y $aryavarta_missions_task_12$#!’现已 #G 完成#!"
 me_aryavarta_13.a:0 "机会多多在等待。"
 me_aryavarta_13_desc:0 "婆罗多的剩余地区可简化为三个关注点：楞伽人、达罗毗荼人和香料。首先是楞伽人，他们是最远的 #E 雅利安#!。遥远的 #E 楞伽人#! 在异乡作战，雕琢出远离其余雅利安 homeland 的奇特部分。其次是 #E 达罗毗荼人#!，一群与我们毫无关联的人，却依然占据了南婆罗多。最后是香料，如果我们能为己所用，将丰富我们的国库和味蕾。"
 me_aryavarta_13_title:0 "$aryavarta_missions_task_13$"
 me_aryavarta_13_tooltip:0 "任务‘#Y $aryavarta_missions_task_13$#!’现已 #G 完成#!"
 me_aryavarta_14.a:0 "所有雅利安人将统一于一个旗帜下。"
 me_aryavarta_14.b:0 "将建立一个新的阿努拉达普拉国家。"
 me_aryavarta_14.c:0 "我们将建立一个斯里兰卡共和国！"
 me_aryavarta_14_desc:0 "遥远的 #E 楞伽#! 人民确实是 #E 雅利安#!，但他们已发展出自己的身份。虽然我们可以直接统治他们，但我们可能考虑将其设为傀儡国家。"
 me_aryavarta_14_title:0 "$aryavarta_missions_task_14$"
 me_aryavarta_14_tooltip:0 "任务‘#Y $aryavarta_missions_task_14$#!’现已 #G 完成#!"
 me_aryavarta_15.a:0 "马尔代夫是我的！"
 me_aryavarta_15_desc:0 "被描述为岛屿花环的 #E 马尔代夫#! 是我们所有兄弟中最遥远的。现在，他们终于被重新引入我们的 homeland！这必将为岛民的历史带来贸易时代。"
 me_aryavarta_15_title:0 "$aryavarta_missions_task_15$"
 me_aryavarta_15_tooltip:0 "任务‘#Y $aryavarta_missions_task_15$#!’现已 #G 完成#!"
 me_aryavarta_16.a:0 "我迫不及待想尝尝。"
 me_aryavarta_16_desc:0 "香料，香料，还有更多香料！卡纳塔高地让我们的盘子充满了香料，我们已开始以低廉价格在整个王国运送。这必将鼓励更多烹饪实验！"
 me_aryavarta_16_title:0 "$aryavarta_missions_task_16$"
 me_aryavarta_16_tooltip:0 "任务‘#Y $aryavarta_missions_task_16$#!’现已 #G 完成#!"
 me_aryavarta_17.a:0 "我们的统治将宏伟。"
 me_aryavarta_17_desc:0 "水环之地 #E 达罗毗荼#! 是我们的了！对我们 #E 雅利安人#! 来说最为陌生的土地，我们必须调和这片激烈争夺的领土。说实话，这片土地不是雅利瓦尔塔的家园；它是一个被征服的国家。从这些异族和土地中，我们通过在广阔而富饶的农田作战提升了我们的能力。"
 me_aryavarta_17_title:0 "$aryavarta_missions_task_17$"
 me_aryavarta_17_tooltip:0 "任务‘#Y $aryavarta_missions_task_17$#!’现已 #G 完成#!"
 me_aryavarta_18.a:0 "今晚试试孟加拉海鲜吧。"
 me_aryavarta_18_desc:0 "远征 #E 缅甸#! 也意味着远征 #E 孟加拉#!。这些土地混合了 #E 般遮耶人#! 以及 #E 吠陀#! 文化的欣赏者。在我们土地的远端形成了一个有趣的混合点。无论如何，#E 孟加拉#! 的商人和渔民将在我们的统治下蓬勃发展，#E 缅甸#! 的崎岖土地将在新的文明中繁荣。"
 me_aryavarta_18_title:0 "$aryavarta_missions_task_18$"
 me_aryavarta_18_tooltip:0 "任务‘#Y $aryavarta_missions_task_18$#!’现已 #G 完成#!"
 me_aryavarta_19.a:0 "愿我长寿！"
 me_aryavarta_19_desc:0 "婆罗多的所有土地已受我们控制。言语无法形容这一成就。传说已被我们实现。雅利瓦尔塔和婆罗多现在合二为一。愿我们的遗产长存！愿婆罗多长寿！"
 me_aryavarta_19_title:0 "$aryavarta_missions_task_19$"
 me_aryavarta_19_tooltip:0 "任务‘#Y $aryavarta_missions_task_19$#!’现已 #G 完成#!"
 me_aryavarta_1_desc:0 "在展望 #E 雅利安#! 人民 homeland 之外之前，我们必须首先统一它！从东部的恒河到西部的辛德河，我们以 #E 雅利瓦尔塔#! 的名义宣称这一切。"
 me_aryavarta_1_title:0 "$aryavarta_missions_task_1$"
 me_aryavarta_1_tooltip:0 "任务‘#Y $aryavarta_missions_task_1$#!’现已 #G 完成#!"
 me_aryavarta_2.a:0 "现在，向#E 摩卢#!进军！"
 me_aryavarta_20.a:0 "从海到盐！"
 me_aryavarta_20_desc:0 "卡恰盐沼，又称库奇沙漠，是一个奇特的地理异常。它迅速从沙漠变为盐沼，再变为海，又回到沼泽。有时它像岛屿，有时是可步行的陆地。无论如何，我们的足智多谋已将这片区域变成一个盈利的盐采区！"
 me_aryavarta_20_title:0 "$aryavarta_missions_task_20$"
 me_aryavarta_20_tooltip:0 "任务‘#Y $aryavarta_missions_task_20$#!’现已 #G 完成#!"
 me_aryavarta_21.a:0 "让他们吃面包和蔬菜。"
 me_aryavarta_21_desc:0 "雅利瓦尔塔的谷物无与伦比！婆罗多如此繁荣的原因，毕竟是因为它能产生大量食物，养活庞大的人口。继续这一传统并改善农业，以养活雅利瓦尔塔的每个男人、女人和孩子，是理所当然的！"
 me_aryavarta_21_title:0 "$aryavarta_missions_task_21$"
 me_aryavarta_21_tooltip:0 "任务‘#Y $aryavarta_missions_task_21$#!’现已 #G 完成#!"
 me_aryavarta_22.a:0 "这只是我们伟大事业的第一步。"
 me_aryavarta_22_desc:0 "规划的贸易联系已全部建立并蓬勃发展！七个不同的城市都向我们的宫廷表示感谢，赞扬这一印度-恒河贸易系统的努力，现已巩固。"
 me_aryavarta_22_title:0 "$aryavarta_missions_task_22$"
 me_aryavarta_22_tooltip:0 "任务‘#Y $aryavarta_missions_task_22$#!’现已 #G 完成#!"
 me_aryavarta_23.a:0 "所有染料为雅利安之眼所用。"
 me_aryavarta_23_desc:0 "我们推崇的 #E 吠陀#! 文化总是充满色彩。红色、蓝色、紫色等点缀了我们的生活方式。我们之所以能做到这一点，是因为我们在雅利瓦尔塔各地生产了大量的染料。"
 me_aryavarta_23_title:0 "$aryavarta_missions_task_23$"
 me_aryavarta_23_tooltip:0 "任务‘#Y $aryavarta_missions_task_23$#!’现已 #G 完成#!"
 me_aryavarta_24.a:0 "来一场公路旅行吧！"
 me_aryavarta_24_desc:0 "印度-恒河道路项目取得了巨大成功。我们不仅连接了我们的人民，也连接了我们自己的行政系统。这将使军队移动更便捷，并有助于促进雅利瓦尔塔已蓬勃发展的贸易路线。"
 me_aryavarta_24_title:0 "$aryavarta_missions_task_24$"
 me_aryavarta_24_tooltip:0 "任务‘#Y $aryavarta_missions_task_24$#!’现已 #G 完成#!"
 me_aryavarta_25.a:0 "卡提凯亚，赐我力量！"
 me_aryavarta_25_desc:0 "$aryavarta_missions_task_25_DESC$"
 me_aryavarta_25_title:0 "$aryavarta_missions_task_25$"
 me_aryavarta_25_tooltip:0 "任务‘#Y $aryavarta_missions_task_25$#!’现已 #G 完成#!"
 me_aryavarta_26.a:0 "湿婆，指引我！"
 me_aryavarta_26_desc:0 "$aryavarta_missions_task_26_DESC$"
 me_aryavarta_26_title:0 "$aryavarta_missions_task_26$"
 me_aryavarta_26_tooltip:0 "任务‘#Y $aryavarta_missions_task_26$#!’现已 #G 完成#!"
 me_aryavarta_27.a:0 "罗摩，分享你的智慧！"
 me_aryavarta_27_desc:0 "$aryavarta_missions_task_27_DESC$"
 me_aryavarta_27_title:0 "$aryavarta_missions_task_27$"
 me_aryavarta_27_tooltip:0 "任务‘#Y $aryavarta_missions_task_27$#!’现已 #G 完成#!"
 me_aryavarta_28.a:0 "毗湿奴，祝福我的未来！"
 me_aryavarta_28_desc:0 "$aryavarta_missions_task_28_DESC$"
 me_aryavarta_28_title:0 "$aryavarta_missions_task_28$"
 me_aryavarta_28_tooltip:0 "任务‘#Y $aryavarta_missions_task_28$#!’现已 #G 完成#!"
 me_aryavarta_29.a:0 "开始建造吧。"
 me_aryavarta_29_desc:0 "$aryavarta_missions_task_29_DESC$"
 me_aryavarta_29_title:0 "$aryavarta_missions_task_29$"
 me_aryavarta_29_tooltip:0 "任务‘#Y $aryavarta_missions_task_29$#!’现已 #G 完成#!"
 me_aryavarta_2_desc:0 "印度河流域千年来一直是我们的后院！现在我们已统一了宝贵河流的所有农民和商人。从般阐那陀的多纳达到信德的港口，婆罗多的入口已在我们控制之下。"
 me_aryavarta_2_title:0 "$aryavarta_missions_task_2$"
 me_aryavarta_2_tooltip:0 "任务‘#Y $aryavarta_missions_task_2$#!’现已 #G 完成#!"
 me_aryavarta_3.a:0 "孔雀王朝的家园将属于我们！"
 me_aryavarta_30.a:0 "吠陀是我们的文化，而非宗教！"
 me_aryavarta_30.b:0 "吠陀既是我们的文化，也是宗教！"
 me_aryavarta_30_desc:0 "#E 波罗伐#!过去面临许多宗教变革和机遇。现在，以新的#E 雅利安#!身份，我们必须决定过去坚持的宗教立场是否应继续推广给我们的 #E 雅利安#! 兄弟。我们在文化上是#E 吠陀#!……我们在宗教上也是#E 吠陀#!吗？"
 me_aryavarta_30_title:0 "$aryavarta_missions_task_30$"
 me_aryavarta_30_tooltip:0 "任务‘#Y $aryavarta_missions_task_30$#!’现已 #G 完成#!"
 me_aryavarta_32.a:0 "我们将直接统治。"
 me_aryavarta_32.b:0 "我们将支持达罗毗荼瓦尔塔。"
 me_aryavarta_32_desc:0 "南方的土地无疑是达罗毗荼的，而非雅利安的。它们从未是雅利安的，有人认为也不应是。相反，有人建议我们应建立一个…… #E 达罗毗荼瓦尔塔#! 封建国家。他们将开始学习 #E 吠陀#! 文化，但允许自治。我们真的应该建立这样的国家，还是直接统治整个婆罗多？"
 me_aryavarta_32_title:0 "$aryavarta_missions_task_32$"
 me_aryavarta_32_tooltip:0 "任务‘#Y $aryavarta_missions_task_32$#!’现已 #G 完成#!"
 me_aryavarta_3_desc:0 "恒河流域居住着我们土地上最多人口和最开明的人民。然而，这也是印度-雅利安群体分裂为两派的时候。一派更遵循吠陀和我们的文化，另一派则背弃了它。是时候提醒我们的 #E 般遮耶#! 表亲做印度-雅利安人的意义了。"
 me_aryavarta_3_title:0 "$aryavarta_missions_task_3$"
 me_aryavarta_3_tooltip:0 "任务‘#Y $aryavarta_missions_task_3$#!’现已 #G 完成#!"
 me_aryavarta_4.a:0 "我心系雅利瓦尔塔。"
 me_aryavarta_4_desc:0 "印度-恒河平原是地球上无与伦比的繁荣之地。在构成这片平原的两大河系交汇处，是印度-雅利安文化的诞生地。我们现在统治着所有可称为雅利瓦尔塔核心的领土。\n\n然而，我们扩展到核心领土之外已太久。现在，是时候扩展雅利瓦尔塔，推过内地，进入婆罗多南部。"
 me_aryavarta_4_title:0 "$aryavarta_missions_task_4$"
 me_aryavarta_4_tooltip:0 "任务‘#Y $aryavarta_missions_task_4$#!’现已 #G 完成#!"
 me_aryavarta_5.a:0 "我们将跨越崇高的山峰。"
 me_aryavarta_5_desc:0 "七山，或称萨特普拉，是分割我们领域与雅利瓦尔塔之外领域的山脉……理论上如此。众所周知，我们在七山对面有许多兄弟和表亲。是时候跨越七山，与我们的亲人相会，将他们引入雅利瓦尔塔。"
 me_aryavarta_5_title:0 "$aryavarta_missions_task_5$"
 me_aryavarta_5_tooltip:0 "任务‘#Y $aryavarta_missions_task_5$#!’现已 #G 完成#!"
 me_aryavarta_6.a:0 "摩卢市场已开放营业。"
 me_aryavarta_6_desc:0 "摩卢是我们称为 #E 信德#! 的地区以南的一个广阔而多样的区域。与辛德河不同，摩卢的其余部分生活在盐沼和沙漠之间。崎岖的区域可能生活艰难，但沿崎岖海岸的激烈全球市场确实无与伦比。城市 #E 德塔#!从这种贸易中获利最多，使其成为我们西海岸超越辛德河的区域首府。"
 me_aryavarta_6_title:0 "$aryavarta_missions_task_6$"
 me_aryavarta_6_tooltip:0 "任务‘#Y $aryavarta_missions_task_6$#!’现已 #G 完成#!"
 me_aryavarta_7.a:0 "又一座雅利安建筑的奇迹。"
 me_aryavarta_7_desc:0 "前大种姓国阿槃提曾是婆罗多所有雅利安王国中最杰出的之一。该地区居住着 #E 阿槃提#!、#E 马茨扬#! 和 #E 绍拉塞尼#! 雅利安人，据说卢陀罗神亲自祝福了他们的首都 #E 乌贾伊尼#!。随着我们再次为雅利安人重新征服阿凡提，#E 乌贾伊尼#! 将作为阿槃提的区域首都焕发新生。"
 me_aryavarta_7_title:0 "$aryavarta_missions_task_7$"
 me_aryavarta_7_tooltip:0 "任务‘#Y $aryavarta_missions_task_7$#!’现已 #G 完成#!"
 me_aryavarta_8.a:0 "我们将焚毁它，并在原地建造一座更好的城市。"
 me_aryavarta_8.b:0 "华氏城的表亲可以沉浸在他们辉煌的过去中。"
 me_aryavarta_8.c:0 "让我们在我们的殖民领导下解放这座城市。"
 me_aryavarta_8_desc:0 "摩揭陀领域曾统一了婆罗多的大部分地区。我们感到矛盾。一方面，他们是#E 般遮耶人#!的后裔，我们的表亲，误入歧途，与我们差异显著……但客观来说，#E 孔雀王朝#!为更广大的印度-雅利安人成功征服了婆罗多。现在，我们必须决定如何处理强大的首都#E 华氏城#!。"
 me_aryavarta_8_title:0 "$aryavarta_missions_task_8$"
 me_aryavarta_8_tooltip:0 "任务‘#Y $aryavarta_missions_task_8$#!’现已 #G 完成#!"
 me_aryavarta_9.a:0 "这里的雨从未停歇！"
 me_aryavarta_9_desc:0 "阿婆兰多，或称西部边界，为我们提供了深入南婆罗多的贸易路线。这将融入我们已在 [ROOT.GetCountry.GetCapital.GetName] 蓬勃发展的印度-恒河贸易，令人满意。阿婆兰多也是雅利安文明连续性的最后区域。我们现在走得越远，就不再能宣称这是雅利瓦尔塔的家园了——现在，这真正是一场征服。"
 me_aryavarta_9_title:0 "$aryavarta_missions_task_9$"
 me_aryavarta_9_tooltip:0 "任务‘#Y $aryavarta_missions_task_9$#!’现已 #G 完成#!"
 old_capital_avanti:0 "阿槃提雅利安人的首都"
 pataliputra_arya_tt:0 "我们必须决定如何处理#E 华氏城#!。"
 salt_harvesting:0 "卡恰盐"
 salt_special_tt:0 "我们将保留建造的 #Y 农业定居点#!。"
 trade_with_arya:0 "与 homeland 贸易"
 yaudheya_kartikeya:0 "迦絺吉夜对药地耶的祝福"
 ydd_arya_color:0 "卡提凯亚之红"

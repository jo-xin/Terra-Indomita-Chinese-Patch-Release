 maurya_shunga_destruction:0 "巽伽的毁灭"
 mauryan_collapse:0 "孔雀王朝的崩溃"
 mauryan_collapse_prevention:0 "防止崩溃"
 mauryan_collapse_prevention_BUTTON_TOOLTIP:0 "希望我们能成功……"
 mauryan_collapse_prevention_CRITERIA_DESCRIPTION:0 "该使命在[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]巩固了他的统治和孔雀王朝的地位得到保障后完成。"
 mauryan_collapse_prevention_DESCRIPTION:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]在一个困难时期登上王位。我们的两位罗阇在不幸的事件中死去，使我们的国家处于衰落状态。我们王国内的许多政治人物都不忠诚，只为自己的利益服务，背弃了对我们的誓言。更有甚者，我们的邻国像饥饿的野兽一样看着我们，等待着我们软弱的迹象。孔雀不能倒下，也决不会倒下！“#R 如果[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]在完成使命前死亡，它们将不再可用，孔雀将崩溃#!"
 mauryan_collapse_prevention_task_1:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]大帝"
 mauryan_collapse_prevention_task_10:0 "支持佛教信仰"
 mauryan_collapse_prevention_task_10_desc:0 "就目前而言，佛教信仰只占我国人口的一小部分。但他们的教义对我们来说是无价的。旧的神灵已经让我们失望，现在是时候看向新的灯塔了。"
 mauryan_collapse_prevention_task_1_DESC:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]是宾头娑罗的儿子，旃陀罗笈多本人的孙子。他是皇室后裔，表现得比他已故的父亲更有能力。尽管他登上王位并非没有鲜血，但有他作为我们的君主，我们可能会跨过这些艰难的时期。"
 mauryan_collapse_prevention_task_2:0 "巩固般遮耶"
 mauryan_collapse_prevention_task_2_desc:0 "长期以来，般遮耶一直是我们的权力中心。恢复首都的秩序对我们的生存至关重要。"
 mauryan_collapse_prevention_task_2_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_collapse_current_pop_value')|0]#!/#Y [SCOPE.ScriptValue('mauryan_collapse_total_pop_value')|0]#!)"
 mauryan_collapse_prevention_task_2_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_collapse_current_pop_value')|0]#!/#Y [SCOPE.ScriptValue('mauryan_collapse_total_pop_value')|0]#!)"
 mauryan_collapse_prevention_task_2_tooltip:0 "在#Y $pracya_region$#!中由#Y [SCOPE.GetRootScope.GetCountry.GetName]#!控制的#Y [SCOPE.ScriptValue('mauryan_collapse_absolute_total_pop_value')|0]#!人口中至少#Y 80%#!是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!或属于已整合文化。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_collapse_prevention_task_2_loc')]"
 mauryan_collapse_prevention_task_3:0 "旃阿输迦"
 mauryan_collapse_prevention_task_3_desc:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]以铁腕手段进行统治。他对他的敌人毫不留情，不管他们是来自外国还是来自他自己的辽阔王国。他的手段往往是残酷的，但却很有效。许多人开始在他背后称他为旃阿输迦，意思是残忍的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]。"
 mauryan_collapse_prevention_task_4:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]的大战"
 mauryan_collapse_prevention_task_4_desc:0 "罗阇[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]不仅在国家事务上显得非常能干，而且在军事事务上也是如此。他要向世人证明自己的武功，让他们都感受到我们真正的强大。"
 mauryan_collapse_prevention_task_5:0 "羯陵伽人的毁灭"
 mauryan_collapse_prevention_task_5_desc:0 "羯陵伽位于南部，长期以来一直试图抵挡我们对印度的霸权。[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]将是最终让他们在我们面前下跪臣服的王。"
 mauryan_collapse_prevention_task_6:0 "佛教僧侣沙慕陀罗"
 mauryan_collapse_prevention_task_6_desc:0 "民众们都在谈论我们王城里一个非常可疑的人。一个名叫沙慕陀罗的和尚向我们的人民宣扬他的法门。他可能会成为一个危险，也可能是一个机会。"
 mauryan_collapse_prevention_task_6_tooltip:0 "佛教僧侣#Y 沙慕陀罗#! 将在我国出现"
 mauryan_collapse_prevention_task_7:0 "讨好总督们"
 mauryan_collapse_prevention_task_7_desc:0 "一个人无法单独统治整个孔雀王朝。需要许多其他人来维持这个王国的秩序。而且必须让这些人满意。"
 mauryan_collapse_prevention_task_8:0 "确保忠诚度"
 mauryan_collapse_prevention_task_8_desc:0 "我们的总督们已经变得越来越腐败和不忠诚了。如果我们想维持我们的帝国，我们必须重新获得他们的信任!"
 mauryan_collapse_prevention_task_8_tooltip:0 "所有担任职务的人物都至少有#Y 75#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_2:0 "#Y 摩柁提娑#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_3:0 "#Y 摩卢#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_4:0 "#Y 阿槃提#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_5:0 "#Y 阿婆兰多#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_6:0 "#Y 民陀高原#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_8_tooltip_7:0 "#Y 犍陀卫#! 的总督至少有#Y 60#! 的忠诚度。"
 mauryan_collapse_prevention_task_9:0 "防止崩溃"
 mauryan_collapse_prevention_task_9_desc:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]刚刚完成了近乎不可能的任务。凭借对宫廷政治的理解，他稳定了我们的国家。过去的岁月是艰难的，但现在我们也许能把这些记忆抛在脑后。"
 mauryan_collapse_prevention_task_9_tooltip:0 "#R 孔雀王朝的崩溃#!将被#Y [GetCharacter('(int32)66').GetName]#!阻止。"
 mauryan_reconquest:0 "摩揭陀的复兴"
 mauryan_reconquest_BUTTON_TOOLTIP:0 "朝着过去的辉煌前进！"
 mauryan_reconquest_CRITERIA_DESCRIPTION:0 "一旦你收复了[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]死后失去的所有土地，这个使命就会完成。"
 mauryan_reconquest_DESCRIPTION:0 "我们伟大的王国处于废墟之中。我们过去的几位统治者都无法阻止我们国家的衰落。即使是我们非常信任的伟大的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]，也无法终止我们孔雀王朝的危机。现在我们很弱小，就像以前的一个影子。如果我们想重新获得印度大国的地位，就必须重新变得强大！我们的使命是让我们的国家变得强大。"
 mauryan_reconquest_task_1:0 "摩揭陀的复兴"
 mauryan_reconquest_task_10:0 "向南推进"
 mauryan_reconquest_task_10_A_tooltip:0 "拥有的任何省份在 #Y $dravida_region$#! 和#Y $karnata_region$#! 区域内。"
 mauryan_reconquest_task_10_DESC:0 "罗阇[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]的意外去世后，达罗毗荼和羯那多失守。这些省份一直是孔雀王朝统治的重要支柱，我们将重新夺回它们。"
 mauryan_reconquest_task_10_tooltip:0 "获得对#Y $dravida_region$#! 和#Y $karnata_region$#!地区的宣称。"
 mauryan_reconquest_task_11:0 "奥迪沙的贸易"
 mauryan_reconquest_task_11_DESC:0 "奥迪沙位于东印度。从那里，许多珍稀动物和其他奇珍异宝被运往印度各地及西方世界。"
 mauryan_reconquest_task_11_tooltip:0 " #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在 #Y $vindhyaprstha_region$#!区域至少生产 #Y 40异域货物#!。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_11_vindhy_exotic_loc')]\n异域货物包括：#Y 琥珀@amber! 香料@spices! 大象@elephants! 玻璃@glass! 丝绸@silk! 宝石@gems! 贵金属@precious_metals! 染料@dye! 蜂蜜@honey! 香@incense! 椰枣@dates! #! 和#Y 糖@sugar!#!。"
 mauryan_reconquest_task_11_vindhy_exotic_loc_1:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_11_exotic_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_11_exotic_total')|0]#!)"
 mauryan_reconquest_task_11_vindhy_exotic_loc_2:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_11_exotic_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_11_exotic_total')|0]#!)"
 mauryan_reconquest_task_12:0 "西部的港口"
 mauryan_reconquest_task_12_B_tooltip:0 "在#Y $aparanta_region$#! 地区的所有领土上都没有#Y 海盗避难港#!。"
 mauryan_reconquest_task_12_DESC:0 "印度西海岸为经济增长提供了诸多机遇。海的另一边便是阿拉伯和美索不达米亚的肥沃地区，其市场令所有目睹者都羡慕不已。若想与这些地区高效贸易，我们将需要大量港口设施。"
 mauryan_reconquest_task_12_aparanta_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $aparanta_region$#!地区有正在进行的建设。"
 mauryan_reconquest_task_12_aparanta_ports_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_12_ports_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_12_ports_total')|0]#!)"
 mauryan_reconquest_task_12_aparanta_ports_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_12_ports_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_12_ports_total')|0]#!)"
 mauryan_reconquest_task_12_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少有#Y [SCOPE.ScriptValue('mauryan_reconquest_task_12_ports_total')|0]#! 座港口建在 #Y $aparanta_region$#!地区。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_12_aparanta_ports_loc')] [SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_12_aparanta_construction_loc')]。"
 mauryan_reconquest_task_13:0 "大都会华氏城"
 mauryan_reconquest_task_13_DESC:0 "华氏城是我们的权力中心，因此应体现我们的实力。建设它将为我们的复兴奠定重要基石。"
 mauryan_reconquest_task_14:0 "般遮耶的丝绸"
 mauryan_reconquest_task_14_DESC:0 "丝绸是当前市场上最畅销的产品之一。商人们不远万里前来获取这种珍贵的织物。如果我们能垄断这种产品，他们岂不是都会来找我们吗？"
 mauryan_reconquest_task_14_pracya_silk_loc_1:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_14_silk_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_14_silk_total')|0]#!)"
 mauryan_reconquest_task_14_pracya_silk_loc_2:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_14_silk_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_14_silk_total')|0]#!)"
 mauryan_reconquest_task_14_tooltip:0 "在#Y $pracya_region$#!地区，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少生产#Y 40丝绸#!@silk!。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_14_pracya_silk_loc')]"
 mauryan_reconquest_task_15:0 "孔雀的贸易网络"
 mauryan_reconquest_task_15_A_tooltip:0 "在#Y $pracya_region$#!地区，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少拥有#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_ports_total')|0]#!个拥有港口的省份。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_15_ports_loc')][SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_15_pracya_construction_loc')]"
 mauryan_reconquest_task_15_B_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的 #Y [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]#! 至少有#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_trade_total')|0] 条贸易路线 #! 。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_15_trade_loc')]"
 mauryan_reconquest_task_15_DESC:0 "贸易是印度繁荣的源泉。其丰富的自然资源、充足的粮食供应以及独特的商品在西方国家备受青睐。拓展我们的贸易网络将有助于推动经济增长。"
 mauryan_reconquest_task_15_ports_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_15_ports_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_ports_total')|0]#!)"
 mauryan_reconquest_task_15_ports_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_ports_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_ports_total')|0]#!)"
 mauryan_reconquest_task_15_pracya_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $pracya_region$#!地区有正在进行的建设。"
 mauryan_reconquest_task_15_trade_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_15_trade_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_trade_total')|0]#!)"
 mauryan_reconquest_task_15_trade_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_trade_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_15_trade_total')|0]#!)"
 mauryan_reconquest_task_16:0 "印度的粮仓"
 mauryan_reconquest_task_16_DESC:0 "我们国家的支柱，过去，现在，将来也永远是人民。没有他们，我们又凭什么统治？我们的王国人口众多，因此需要大量粮食。"
 mauryan_reconquest_task_16_avanti_grain_veggie_loc_1:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_16_grain_veggie_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_16_grain_veggie_total')|0]#!)"
 mauryan_reconquest_task_16_avanti_grain_veggie_loc_2:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_16_grain_veggie_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_16_grain_veggie_total')|0]#!)"
 mauryan_reconquest_task_16_tooltip:0 "在#Y $avanti_region$#!和#Y $madhyadesa_region$#!地区，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少生产#Y [SCOPE.ScriptValue('mauryan_reconquest_task_16_grain_veggie_total')|0]谷物#!@grain! 或 #Y 蔬菜#!@vegetables!。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_16_avanti_grain_veggie_loc')]"
 mauryan_reconquest_task_17:0 "主宰达罗毗荼"
 mauryan_reconquest_task_17_DESC:0 "在[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]去世后，达罗毗荼脱离了我们的控制。重新确立我们在这些地区的统治地位，将向他们表明孔雀王朝绝非等闲之辈。"
 mauryan_reconquest_task_18:0 "进入羯那多"
 mauryan_reconquest_task_18_DESC:0 "羯那多一直是我们王国关注的重点地区。就连旃陀罗笈多也曾计划入侵该地。"
 mauryan_reconquest_task_18_tooltip:0 "建立#T 孔雀殖民地#!。"
 mauryan_reconquest_task_19:0 "重新整合奢叉尸罗"
 mauryan_reconquest_task_19_DESC:0 "奢叉尸罗是一个有着悠久而辉煌历史的地方。将其收归我王国，必将为我们带来同样的光荣。"
 mauryan_reconquest_task_19_tooltip:0 "一个具有高#T 热忱#! @religious_icon!和#G 智略#! @civic_icon!的人物将出现在#Y 孔雀#!。"
 mauryan_reconquest_task_1_B_completion_tooltip:0 "获得#Y 孔雀王朝复兴#! 的战争目标，持续#Y 25#! 年。这将大大降低游戏开始时重新征服#Y 孔雀#! 拥有的土地所需的战争分数。"
 mauryan_reconquest_task_1_DESC:0 "孔雀王朝不再是旃陀罗笈多统治时期的庞然大物。我们在整个印度的权力和影响力都在萎缩，但我们的精神和以往一样昂扬。我们不能不战而退！"
 mauryan_reconquest_task_1_completion_tooltip:0 "在游戏开始时获得#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 统治的所有领土的 #Y 宣称#! 。"
 mauryan_reconquest_task_2:0 "巽伽的毁灭"
 mauryan_reconquest_task_20:0 "泰米尔之道"
 mauryan_reconquest_task_20_DESC:0 "在遥远的南方，泰米尔国王们统治着这片土地。他们是印度洋贸易中的顶尖商人，掌握着贸易的主导权。与他们建立联系或许能为我们带来好处。"
 mauryan_reconquest_task_21:0 "重新获得忠诚"
 mauryan_reconquest_task_21_DESC:0 "多年来，我们的民众对我们失去了很多信任。在[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]去世后，我们的帝国崩溃，随之而来的是一个动荡不安、无法无天的时代。我们必须向他们保证，秩序已经恢复。"
 mauryan_reconquest_task_21_loyalty_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_21_loyalty_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_21_loyalty_total')|0]#!)"
 mauryan_reconquest_task_21_loyalty_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_21_loyalty_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_21_loyalty_total')|0]#!)"
 mauryan_reconquest_task_21_tooltip:0 "#Y [SCOPE.ScriptValue('mauryan_reconquest_task_21_loyalty_total')|0]#! 在 #Y 般遮耶#!, #Y 摩柁提娑#!，和 #Y 阿槃提#! 的省份至少有 #Y 75#! 忠诚度。 [SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_21_loyalty_loc')]"
 mauryan_reconquest_task_2_A_tooltip:0 "每个省份 #R 杀死#!  #Y 阿槃提#! 文化 #R [SCOPE.ScriptValue('mauryan_reconquest_task_2_shungan_destruction_current')|0]#! #Y 贵族#! @nobles! 和 #Y 公民#! @citizens! ；奴役 #Y 阿槃提#! 文化的 #Y 2 自由民#! @freemen!。"
 mauryan_reconquest_task_2_DESC:0 "巽伽人利用我们暂时虚弱时期，在我们先前的领土内成为了一股强大的力量。他们的堕落令人震惊，他们的傲慢是对我们的侮辱——我们不能再容忍他们的存在了。我们必须摧毁他们。"
 mauryan_reconquest_task_2_allow_B_tooltip:0 "#Y 巽伽王朝#! 已被消灭。"
 mauryan_reconquest_task_2_allow_tooltip:0 " #Y 巽伽王朝#! 没有任何领土。"
 mauryan_reconquest_task_3:0 "挑战百乘"
 mauryan_reconquest_task_3_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 与 #Y 百乘王朝#! 接壤。"
 mauryan_reconquest_task_3_DESC:0 "百乘是我们分裂后涌现的众多势力之一。他们仍然很虚弱。我们也许能够采取外交行动，在不流血的情况下取得我们失去的土地。"
 mauryan_reconquest_task_3_completion_tooltip:0 "向#Y 百乘#! 发出#Y 最后通牒#! ，要求得到我们应有的土地。这可能会导致#R 战争#!的发生。"
 mauryan_reconquest_task_4:0 "印度-希腊问题"
 mauryan_reconquest_task_4_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 未与任何#Y 印度-希腊王国#!交战。"
 mauryan_reconquest_task_4_DESC:0 "巴克特里亚和波斯境内的希腊人长期以来一直是我们的一大麻烦。但如今，这该死的命运啊，就连我们昔日的西部行省也受到了希腊势力的渗透，这种发展是我们绝不能容忍的。尽管他们并非我们首要关注的对象，但若能在他们渗透的地区扩大影响力，或许对我们而言将是一笔可观的收益。"
 mauryan_reconquest_task_4_completion_tooltip:0 "向#Y 印度-希腊王国#! 发出#Y 最后通牒#! ，迫使他们屈服。如果他们拒绝，我们将获得宣称。"
 mauryan_reconquest_task_5:0 "孔雀王朝复兴"
 mauryan_reconquest_task_5_A_tooltip:0 "在游戏开始时获得#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 统治的 #Y 所有领土#! 。"
 mauryan_reconquest_task_5_DESC:0 "我们在最近的事件中失去了大部分力量，但现在我们正在重新变得强大。我们的敌人将对我们望而生畏；我们将夺回曾属于我们的东西！"
 mauryan_reconquest_task_6:0 "摩揭陀的影响"
 mauryan_reconquest_task_6_A_tooltip:0 "在#Y $madhyadesa_region$#!和#Y $avanti_region$#! 区域内由 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 统治者 #Y [SCOPE.ScriptValue('mauryan_reconquest_task_6_pops_total')|0]#! 至少有#Y 80%#! 的人口是 #Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!或者属于已整合文化。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_6_pops_loc')]"
 mauryan_reconquest_task_6_DESCc:0 "最近，我们的领土遭受了损失，导致我们的民众分散到北印度各地的不同王国中。重新团结我们的民众对于我们的复兴至关重要，因为如果我们没有民众，我们还能拥有什么呢？"
 mauryan_reconquest_task_6_pops_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_6_pops_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_6_pops_total')|0]#!)"
 mauryan_reconquest_task_6_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_6_pops_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_6_pops_total')|0]#!)"
 mauryan_reconquest_task_7:0 "建设我们的遗产"
 mauryan_reconquest_task_7_DESC:0 "我们还没完呢！我们将向全世界证明这一点。建设我们的城市将向所有人展示，我们仍然是一支不可小觑的力量。"
 mauryan_reconquest_task_7_pracya_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('mauryan_reconquest_task_7_pracya_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_7_pracya_buildings_total')|0]#!)"
 mauryan_reconquest_task_7_pracya_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('mauryan_reconquest_task_7_pracya_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('mauryan_reconquest_task_7_pracya_buildings_total')|0]#!)"
 mauryan_reconquest_task_7_pracya_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $pracya_region$#!地区有正在进行的建设。"
 mauryan_reconquest_task_7_tooltip:0 "在#Y $pracya_region$#! 区域内 #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少拥有 #Y [SCOPE.ScriptValue('mauryan_reconquest_task_7_pracya_buildings_total')|0]#! 建筑。[SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_7_pracya_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('mauryan_reconquest_task_7_pracya_construction_loc')]"
 mauryan_reconquest_task_8:0 "进入丛林"
 mauryan_reconquest_task_8_DESC:0 "印度的丛林是严酷而无情的。野兽和未开化的部落在这片危险的生态系统中生存。然而，我们注定要成就伟业，就连自然的力量也将被我们的武力所征服。"
 mauryan_reconquest_task_9:0 "主宰阿婆兰多"
 mauryan_reconquest_task_99:0 "婆罗多"
 mauryan_reconquest_task_99_DESC:0 "我们深爱的印度的土名，婆罗多，已重新回到我们的掌控之下。但我们不能止步于此。我们将把整个印度团结在我们的旗帜之下，这样我们就能站在同一阵线共同战斗。"
 mauryan_reconquest_task_99_tooltip:0 "执行成立 #Y 婆罗多国#! 的决议。"
 mauryan_reconquest_task_9_DESC:0 "向西是阿婆兰多区域。它是通往阿拉伯海以及叙利亚和埃及的希腊化国王们的门户。"
 mauryan_southern_colonies:0 "孔雀王朝南方的殖民地"
 mauryan_trade_center:0 "孔雀贸易中心"
 mauryan_unity:0 "孔雀王朝的团结"
 me_maurya_collapse_1.a:0 "卑鄙..."
 me_maurya_collapse_1_desc:0 "有一些关于[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]之恶行的故事被传得沸沸扬扬；有些人认为它们是绝对真实的，有些人则认为是虚假的，但即使那些嘲笑细节的人也不敢公开嘲笑他。我们的罗阇已经接受了放荡的生活；[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]大口吃着美味佳肴，整盘的烤野味和填塞的鸡肉，但他可怕的饥饿感并没有仅仅通过肉来满足。据说他在疯狂中给他的大臣们提出了一些不可能的要求，比如砍掉全印度所有的果树，杀死那些对他的奇怪命令持异议的人。就连他自己的妻妾也难逃他的手掌心；就在上个月，他烧死了五百多人。"
 me_maurya_collapse_1_title:0 "恐怖的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]"
 me_maurya_collapse_2.a:0 "惊人的！"
 me_maurya_collapse_2_desc:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]带着新近皈依者的热情，正竭尽全力偿还他的因果债务，因为他要为自己多年的残酷行为赎罪。罗阇不再挪用巨额资金来满足他放荡的胃口，而是通过前所未有的建筑来给予的民众的福祉。他没有囤积财富，而是在公共土地上修建了水井和灌溉沟渠，使人们可以种植营养丰富的食物。正在建造的学校用于培训医护人员，以便没有人可以无谓地受苦。[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]的大手笔并没有将这些项目局限于他自己的核心土地，而是寻求为他庞大的帝国中的每一个人提供服务——我们真的很幸运，有这样一位慈爱的王者。"
 me_maurya_collapse_2_title:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]大帝"
 me_maurya_collapse_3.a:0 "令人厌恶..."
 me_maurya_collapse_3_desc:0 "农民们正在重复一个可笑的故事，它可能会让人感到好笑，但我们还是要向你们报告。据说，[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]在他不断增长的热忱中，实际上已经到了阴间，以便他可以接受恶魔的黑色酷刑艺术的指导！为了利用这些黑暗的知识，他在华氏城建造了一座精致的监狱，当地人称它为[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]的地狱，因为一旦你进入它的腹地，神明也无法释放你。难怪这位罗阇被称为旃阿输迦——凶猛的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]。"
 me_maurya_collapse_3_title:0 "旃阿输迦"
 me_maurya_collapse_4.a:0 "我达到了顿悟——皈依正法"
 me_maurya_collapse_4.b:0 "摩揭陀不是佛教徒的乐土！"
 me_maurya_collapse_4_desc:0 "你那溅满鲜血的武器从手中掉落，你跪在地上，被矛盾的感觉所淹没。战斗终于结束了，但这对羯陵伽的人民来说是一个可怕的浩劫。在你周围，乌鸢啄人肠，衔飞上挂枯树枝。野战格斗死，败马号鸣向天悲。这可怜的声音刺痛了你的灵魂--难道人不是一种高尚的生物，应该过上不受命运影响的生活？你，[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]大帝，在这胜利的时刻，你竟犹豫了？尽管承认这很奇怪，但你为自己造成的破坏感到一阵尖锐的懊悔。一个佛教戒律不由自主地浮现在脑海，令你惊讶……真正的力量源于慈悲。当胜利的军队聚集在你周围时，你反复默念着这句话。"
 me_maurya_collapse_4_title:0 "羯陵伽的毁灭"
 me_maurya_collapse_5.a:0 "将他带入宫廷"
 me_maurya_collapse_5.b:0 "摩揭陀不是佛教徒的乐土！"
 me_maurya_collapse_5_desc:0 "陛下不会相信他们在市场上谈论的事情，但这是真的，都是真的；我已经亲眼验证了。看来，一个商人的儿子，一个名叫沙慕陀罗的佛教僧侣，因为他的罪行而被判处死刑。当指定的时间到来时，他被置于沸腾的粪缸中，但——原谅我，我的王，但我只是重复所说的——他使一朵莲花从污物中绽放，他在上面平静地冥想。我们的狱卒对这种神奇的表现不以为然，试图惩罚他，但沙慕陀罗讲道......不知何故，他逃脱了。但他并没有逃跑！他走到城市的中心，开始漂浮，他的一半身体被火焰吞噬，另一半身体被水浸泡。萨穆德拉说他不是神，而是遵循佛陀的方法。我们要不要传唤这个创造奇迹的人说话？"
 me_maurya_collapse_5_title:0 "僧侣沙慕陀罗"
 me_maurya_collapse_6.a:0 "祝福[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]"
 me_maurya_collapse_6_desc:0 "由于我们不屈不挠的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]的努力工作，孔雀帝国的崩溃被阻止了。[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]是军事和行政方面的天才，他已经证明自己是印度有史以来最伟大的罗阇之一。我们背信弃义的总督们不再想背叛我们，我们亲爱的民众重新获得了对我们的信任。现在，在解决了我们内部的问题并拯救了我们的帝国之后，我们又一次自由地向外看。谁知道孔雀帝国的未来会怎样？"
 me_maurya_collapse_6_title:0 "崩溃被阻止"
 me_maurya_let_us_hope:0 "我们希望这是[SCOPE.sC('mry_offer_scope').GetAdjective]与孔雀人民之间伟大合作的开端。"
 me_maurya_more_likely_to_succeed:0 "这个选项更有可能成功，如果"
 me_maurya_revival_1.a:0 "发出最后通牒！"
 me_maurya_revival_1.at:0 "#Y 百乘#! 也许会接受我们的提议，归还我们的宣称土地。"
 me_maurya_revival_1.b:0 "我们有更大的麻烦。"
 me_maurya_revival_10.a:0 "两个殖民地，我们需要这里的人民。"
 me_maurya_revival_10.b:0 "三个殖民地，我的幸运数字！"
 me_maurya_revival_10.c:0 "四个殖民地，以备不时之需。"
 me_maurya_revival_10.d:0 "五个殖民地，让我们全力以赴吧"
 me_maurya_revival_10_desc:0 "我们已经决定派遣一些定居者进入达罗毗荼。除了与当地民众建立关系外，他们将确保该地区的安全，并保证我们在那里的繁荣。然而，我们仍然不确定我们应该建立多少个殖民地。我们应该怎么做？"
 me_maurya_revival_10_title:0 "达罗毗荼的殖民地"
 me_maurya_revival_11.a:0 "我们必须加强我们的军事能力"
 me_maurya_revival_11.b:0 "基础设施将被证明是重要的"
 me_maurya_revival_11.c:0 "诸神知道该怎么做!"
 me_maurya_revival_11.d:0 "让我们发展我们的贸易"
 me_maurya_revival_11_desc:0 "我们派出的定居者已经完成了殖民地的建立。现在我们面临着专业化的问题；我们应该引导他们专注于一个方向，这样我们的实力才会增长。"
 me_maurya_revival_11_title:0 "达罗毗荼殖民地的专业化"
 me_maurya_revival_1_desc:0 "百乘抓住了我们虚弱的时机，从我们这里重新获得了独立。由于我们国内有更紧迫的事情，我们没能立即采取行动，但现在我们可以尝试迫使他们重新归顺。这样做可以向我们的人民以及印度其他地区表明，我们不是软弱无能的人!"
 me_maurya_revival_1_title:0 "$mauryan_reconquest_task_3$：我们的合法诉求"
 me_maurya_revival_2.a:0 "给他们他们想要的东西。"
 me_maurya_revival_2.at:0 "我们将把#Y 孔雀#! 的合法宣称还给他们。"
 me_maurya_revival_2.b:0 "如果他们想要的是战争..."
 me_maurya_revival_2.bt:0 "这可能会导致#R 战争#!......"
 me_maurya_revival_2_desc:0 "来自孔雀的消息令人不安。他们新登基的统治者希望以我们为代价建立自己的合法性，试图要求归还他们失去的土地。然而，我们听到的消息是，他们实际上很虚弱，可能不像以前那样有能力......这个所谓的罗阇不是旃陀罗笈多。"
 me_maurya_revival_2_title:0 "$mauryan_reconquest_task_3$：孔雀的要求"
 me_maurya_revival_3.a:0 "为了孔雀帝国！"
 me_maurya_revival_3_desc:0 "我们派往百乘的外交官带回了一个好消息。他们已经接受了我们对这块土地的合法宣称，不会反对我们。这确实是一个伟大的事件结果，因为现在我们可以把所有的注意力放在更紧迫的事情上。"
 me_maurya_revival_3_title:0 "$mauryan_reconquest_task_3$: 百乘接受了"
 me_maurya_revival_4.a:0 "那就开战吧!"
 me_maurya_revival_4.b:0 "我们承受不起战争..."
 me_maurya_revival_4_desc:0 "我的罗阇，似乎百乘已经拒绝了我们归还领土的提议。尽管这种背叛行为不可能没有惩罚。然而，目前我们并不像我们希望的那样强大。诚然，我们必须仔细评估，我们是想用武力夺取我们的领土，还是退而求其次。在我们目前的状态下，我们不能走错路。您打算怎么做？"
 me_maurya_revival_4_title:0 "$mauryan_reconquest_task_3$: 百乘拒绝"
 me_maurya_revival_5.a:0 "我们将向他们发出提议!"
 me_maurya_revival_5.at:0 "$me_maurya_more_likely_to_succeed$ [SCOPE.sC('mry_offer_scope').GetName]是弱小的、孤立的。"
 me_maurya_revival_5.b:0 "给他们送去降服的赏金。"
 me_maurya_revival_5.bt:0 "$me_maurya_more_likely_to_succeed$[SCOPE.sC('mry_offer_scope').GetName]的[SCOPE.sC('mry_offer_scope').GetRulerTitle]腐败或不坚定。"
 me_maurya_revival_5.c:0 "战争是唯一的选择!"
 me_maurya_revival_5.ct:0 "我们将获得对整个#Y 希腊-印度王国#!的宣称。"
 me_maurya_revival_5.subject_tt:0 "\n如果他们接受："
 me_maurya_revival_5_desc:0 "我们必须决定如何处理[SCOPE.sC('mry_offer_scope').GetAdjective]的合作问题。"
 me_maurya_revival_5_title:0 "$mauryan_reconquest_task_4$：和平的提议？"
 me_maurya_revival_6.a:0 "我们有什么选择呢？"
 me_maurya_revival_6.b:0 "'[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetPraenomen]，为什么这么高兴？"
 me_maurya_revival_6.c:0 "那些该死的东西竟敢这样做！？好胆！"
 me_maurya_revival_6_C_tooltip:0 "#Y 孔雀#! 将获得我们所有省份的宣称"
 me_maurya_revival_6_desc:0 "霸道的孔雀使节出现在 [ROOT.GetCountry.GetCapital.GetName] 的门前，并提出了一个提议。虽然你最初的想法是把他们打发走，但你决定听听他们的意见。"
 me_maurya_revival_6_desc_1:0 "来自孔雀的使者实际上并不寻求讨论任何问题，而是用冷酷无情的语言向我们提出了一系列要求。他们认为我们的持续独立是一种不可容忍的状态，并宣布我们必须向他们进贡。\n\n他们严肃的使者甚至现在还在不耐烦地等待我们的回应......"
 me_maurya_revival_6_desc_2:0 "他们要求与[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetPraenomen]进行私下会谈，现在已经在帐篷里与[ROOT.GetCountry.GetRuler.GetHerHim]秘密交谈了几个小时。\n\n他们一定是想腐蚀我们的领袖--孔雀不会无谓地废话。"
 me_maurya_revival_6_title:0 "$mauryan_reconquest_task_4$：孔雀的提议"
 me_maurya_revival_7.a:0 "一点点温和的劝说总是有效的。"
 me_maurya_revival_7.b:0 "当然，他们这样做了。"
 me_maurya_revival_7.c:0 "他们会对这一天感到后悔的。"
 me_maurya_revival_7.ct:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 获得了对#Y [SCOPE.sC('mry_offer_scope').GetName]#!所有省份的宣称。"
 me_maurya_revival_7_desc_1:0 "[SCOPE.sC('mry_offer_scope').GetName]被我们的威胁打动了，他们觉得为了自由不值得与孔雀王朝开战。\n\n$me_maurya_let_us_hope$"
 me_maurya_revival_7_desc_2:0 "[SCOPE.sC('mry_offer_scope').GetRuler.GetName]接受了我们的个人提议，和平的将[SCOPE.sC('mry_offer_scope').GetName]献给了我们。\n\n$me_maurya_let_us_hope$"
 me_maurya_revival_7_desc_3:0 "目空一切的 [SCOPE.sC('mry_offer_scope').GetName] 把我们的荣誉和一系列恶心人的畜生相提并论，以此来回应我们的提议。\n\n$me_mauryan_conventional_means$"
 me_maurya_revival_7_title:0 "$mauryan_reconquest_task_4$:[SCOPE.sC('mry_offer_scope').GetAdjective]回应"
 me_maurya_revival_8.a:0 "两个殖民地，我们不要太过分了"
 me_maurya_revival_8.b:0 "三个殖民地似乎足够了"
 me_maurya_revival_8.c:0 "四个殖民地，也许？"
 me_maurya_revival_8.d:0 "五个殖民地，我们的铁拳上每个手指都有一个"
 me_maurya_revival_8_desc:0 "我们决定派一些定居者进入达罗毗荼。他们将为我们高举孔雀的旗帜，与当地民众建立关系，并确保该地区的安全。但是，我们仍然不确定应该建立多少个殖民地。您的命令是什么？"
 me_maurya_revival_8_title:0 "达罗毗荼的殖民地"
 me_maurya_revival_9.a:0 "我们必须扩大我们的军事能力"
 me_maurya_revival_9.b:0 "基础设施将被证明是重要的"
 me_maurya_revival_9.c:0 "诸神知道该怎么做!"
 me_maurya_revival_9.d:0 "让我们发展我们的贸易"
 me_maurya_revival_9_desc:0 "我们派出的定居者已经完成了殖民地的建立。现在我们站在专业化的问题面前；达罗毗荼的殖民地应该以什么著称？"
 me_maurya_revival_9_title:0 "达罗毗荼殖民地的专业化"
 me_mauryan_conventional_means:0 "[SCOPE.sC('mry_offer_scope').GetCapital.GetName] 是个需要用更常规的手段来赢得的奖品。"
 pataliputran_metropolis:0 "华氏城大都会"
 satavahana_dynasty:0 "百乘王朝"
 satavahana_revolt_name:0 "百乘"
 satavahana_revolt_name_adjective:0 "百乘"
 shunga_revolt_adjective:0 "巽伽"
 shunga_revolt_name:0 "巽伽"
 silky_silk:0 "丝绸"
 tamil_traders:0 "泰米尔商人"
 wisdom_of_taxila:0 "奢叉尸罗的智慧"

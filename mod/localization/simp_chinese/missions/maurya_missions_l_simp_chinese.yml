 STV_ADJ:0 "百乘"
 appeased_governors:0 "安抚总督"
 ashoka_health_boost:0 "阿输迦健康增益"
 ashoka_the_great:0 "阿输迦大帝"
 ashoka_the_terrible:0 "#R 恐怖的阿输迦#!"
 buddhist_center:0 "佛教中心"
 dominant_indian_administration:0 "印度主导的政府"
 flavor_maurya.16.tt:0 "与 #Y [GetCountry('MRY').GetName]#! 接壤的国家将获得 #Y 孔雀崩溃#! 的战争目标，以降低征服成本。"
 flavor_maurya_1.a:0 "愿他安然无恙。"
 flavor_maurya_10.a:0 "让他们......暂且如此吧"
 flavor_maurya_10.b:0 "我们必须收复这些领土！"
 flavor_maurya_10_desc:0 "在感受到我们的不团结后，案达罗的统治者决定反叛我们。这没有什么好说的，我的主人，印度中部的大部分地区已经丢失。然而，如果我们迅速出击，也许能压制住这场叛乱，保证该地区的安全。尽管如此，更多的麻烦似乎就要来了。也许暂时让他们独立，以后再打击他们会更明智？"
 flavor_maurya_10_title:0 "百乘问题"
 flavor_maurya_11.a:0 "签订休战协议"
 flavor_maurya_11.b:0 "羯陵伽会对摩揭陀不利！"
 flavor_maurya_11_desc:0 "在我们帝国的东南部，遥远的羯陵伽已经宣布从我们这里独立。当地的贵族们公开表示放弃对我们的支持，并开始全面叛乱，将我们的驻军从他们的城市中驱逐出去--这种背叛行为是不能容忍的。然而，类似的事件在我们的王国各地都在发生，羯陵伽可能不是最迫切需要扑灭的火种。让他们处于一种虚假的安全感中，可以为以后的重新征服提供便利。"
 flavor_maurya_11_title:0 "与羯陵伽打交道"
 flavor_maurya_12.a:0 "向这些叛军宣战"
 flavor_maurya_12.b:0 "我们无法承受另一场代价高昂的战争"
 flavor_maurya_12.c:0 "作为迦毕试继续游戏"
 flavor_maurya_12.d:0 "作为般阐那陀继续游戏"
 flavor_maurya_12.e:0 "作为古宁陀继续游戏"
 flavor_maurya_12.f:0 "作为迦湿弥罗继续游戏"
 flavor_maurya_12.g:0 "作为苏维拉继续游戏"
 flavor_maurya_12_desc:0 "多年来，希腊叛军在印度西北部谋求独立，我们虽然都知道这些爱管闲事的外国人是一个麻烦。但是现在，这些被诅咒的希腊人已经组织起来，组成了一个反对摩揭陀统治的联盟，甚至还说服了一些当地的民众加入他们的行列！我们应该如何处理这个问题？我们应该如何应对这个新出现的威胁呢？"
 flavor_maurya_12_title:0 "印度-希腊联盟"
 flavor_maurya_12_tooltip_A:0 "放弃 #Y 孔雀#!，继续扮演 #Y 印度-希腊王国#! #Y $indo_greek_revolt_one_name$#!。"
 flavor_maurya_12_tooltip_B:0 "放弃 #Y 孔雀#!，继续扮演 #Y 印度-希腊王国#! #Y $indo_greek_revolt_two_name$#!。"
 flavor_maurya_12_tooltip_C:0 "放弃 #Y 孔雀#!，继续扮演 #Y 印度-希腊王国#! #Y $indo_greek_revolt_three_name$#!。"
 flavor_maurya_12_tooltip_D:0 "放弃 #Y 孔雀#!，继续扮演 #Y 印度-希腊王国#! #Y $indo_greek_revolt_four_name$#!。"
 flavor_maurya_12_tooltip_E:0 "放弃 #Y 孔雀#!，继续扮演 #Y 印度-希腊王国#! #Y $indo_greek_revolt_five_name$#!。"
 flavor_maurya_13.a:0 "这就是结局……"
 flavor_maurya_13.b:0 "一条新的路在前方，就像巽伽一样，这将是明智的……"
 flavor_maurya_13_A_tooltip:0 "放弃 #Y 孔雀#!，继续扮演 #Y 巽伽#! 并展开一场挑战帝权的战争！"
 flavor_maurya_13_desc:0 "这封信是在一个傍晚时分到达，由一名信使带来，他在送完信后因疲惫不堪而倒在你的宫殿里。当你刚打开它阅读时，你的手立刻在颤抖，并把它扔到了地上。你几乎不相信自己的眼睛，用颤抖的声音命令一个顾问大声读出它。每一个字都让你热血沸腾；你的朋友布舍耶密多罗-巽伽，我们曾经的将军之一，以叛国行为背弃了孔雀王朝。他宣称自己是整个北印度的罗阇，并发动了的叛乱。更糟糕的是，我们的大部分军队已经逃到他那里去了。我们真的被敌人包围了，这简直是厄运。诚然，这对我们来说是最糟糕的时刻了。"
 flavor_maurya_13_title:0 "巽伽叛乱"
 flavor_maurya_13_tooltip:0 "#G 获得孔雀复兴使命树#!"
 flavor_maurya_14.a:0 "天哪！"
 flavor_maurya_14_desc:0 "我们的主要继承人，修私摩-孔雀，已经神秘地死去。皇宫的守卫发现这位年轻的王子今天早上死在了他的房间里，而我们最好的医护人员也无力回天。调查已经在进行中，被审讯的囚犯的尖叫声回荡在你的宫殿里，但似乎没有人看到或听到什么。我们的王子突然被谋杀确实令人不安，越来越多关于不满的总督和贵族的传言在宫廷中慢慢传播。似乎变革的时代就在我们面前，不管我们是否愿意。"
 flavor_maurya_14_title:0 "修私摩之死"
 flavor_maurya_16.a:0 "非常有趣..."
 flavor_maurya_16_desc:0 "孔雀统治者已逝，孔雀帝国因此陷入混乱。在内部，许多著名的贵族争夺国家的控制权，这些诡计多端的王子们在我们曾经统一的民众中造成了巨大的分裂。很明显，曾经控制了几乎整个印度的强大的孔雀帝国，现在正处于戏剧性地崩溃的边缘——谁能预见到这种事情的发生呢？即使现在，我们的许多敌人也在准备他们的军队……"
 flavor_maurya_16_title:0 "孔雀王朝的崩溃"
 flavor_maurya_17.a:0 "迦毕试现在是我们的家园"
 flavor_maurya_17.b:0 "般阐那陀现在是我们的家园"
 flavor_maurya_17.c:0 "古宁陀现在是我们的家园"
 flavor_maurya_17.d:0 "迦湿弥罗现在是我们的家园"
 flavor_maurya_17.e:0 "苏维拉现在是我们的家园"
 flavor_maurya_17_desc:0 "孔雀王国已经衰落到无力回天的地步，许多人都试图在其庞大的尸体上分得一杯羹。我们决定创建一个新的王国，一个包容生活在我们旗帜下的众多民族文化的王国；我们不会试图把孔雀王朝支离破碎的合法性拼凑起来，而是要建立一个我们自己的印度-希腊王朝，这个王朝将比我们之前的任何王朝都更加强大。"
 flavor_maurya_17_title:0 "印度-希腊之道"
 flavor_maurya_18.a:0 "巽伽王朝将永远统治摩揭陀！"
 flavor_maurya_18_desc:0 "智者和哲学家认为，所有的生命都是神圣的，必须受到重视，但当一个邪恶的罗阇的统治给无数灵魂带来无尽的痛苦时，杀死统治者并恢复万物平衡就成为了一项神圣的责任。一个真正公正的人能容忍这样对众神和人类的侮辱而不采取行动吗？我们的君主布舍耶密多罗-巽伽就发现自己处于这种不利的境地，但他选择了智慧之路，将我们所有人从正在毁灭我们的暴政中解放出来。当堕落的孔雀因他们的罪恶而受到惩罚时，巽伽家族将掌握所有权力并建立一个强大的王国。"
 flavor_maurya_18_title:0 "巽伽之道"
 flavor_maurya_19.a:0 "百乘王朝将永远统治南印度！"
 flavor_maurya_19_desc:0 "孔雀帝国已经崩溃，一股新的力量正在印度中部崛起：百乘。由于害怕我们不可避免的崛起，我们的敌人从四面八方而来，希望在我们站稳脚跟之前就把我们击败，但我们的时代已经到来，我们将为控制德干高原而浴血奋战。现在是战斗的时候了，让大家知道，百乘家族将迎来印度前所未有的繁荣时期！"
 flavor_maurya_19_title:0 "百乘"
 flavor_maurya_1_desc:0 "我们虔诚的罗阇，旃陀罗笈多，决定遵从耆那教的教义，选择饿死尘世的身体，以便他的灵魂可以开花结果。宫廷内的许多人仍然感到震惊，有些人要求在解决继承问题之前进行长时间的哀悼。然而，我们的众多敌人会注意到这一点，我们必须迅速采取行动；旃陀罗笈多的长子宾头娑罗将成为新的罗阇。"
 flavor_maurya_1_title:0 "旃陀罗笈多之死"
 flavor_maurya_2.a:0 "将他带入宫廷"
 flavor_maurya_2.b:0 "孔雀不接受耆那教！"
 flavor_maurya_2_desc:0 "我们杰出的宫廷吸引了许多游方的圣人；有些人寻求改变他人的信仰，分享他们的教义，希望获得新的追随者，而更多的人只是在经过下一个城市之前要求施舍。但今天不同，一位名叫婆达罗巴忽的耆那教僧人，因其许多著作而闻名全国，来到了我们的宫殿，旃陀罗笈多国王对他表现出极大的兴趣。也许他的教义可以帮助我们努力实现伟大的目标？"
 flavor_maurya_2_title:0 "耆那教的婆达罗巴忽"
 flavor_maurya_3.a:0 "开始接受耆那教的价值观。"
 flavor_maurya_3.b:0 "孔雀现在是，将来也是吠陀教徒!"
 flavor_maurya_3.tt:0 "婆达罗巴忽会离开，然后南下……"
 flavor_maurya_3_desc:0 "最近加入我们宫廷的耆那教僧侣婆达罗巴忽每天早上都在说法，甚至旃陀罗笈多本人也在日出后冒险到院子里，在听众中占据一席之地，僧侣和罗阇之间的对话持续了很长时间，常常超过中午的饭点。许多人开始相信耆那教的思维方式是值得考虑的。如果我们在整个王国里宣扬它们，也许我们可以从中获得一些利益。"
 flavor_maurya_3_title:0 "耆那教的教义"
 flavor_maurya_5.a:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]将解决这一混乱局面。"
 flavor_maurya_5_desc:0 "在一连串可怕的事件中，我们的罗阇，宾头娑罗，敌人的毁灭者，被谋杀了。在这个可怕的消息被公布后不久，他的许多儿子为争夺王位进行了一场血腥的争斗，直到他的儿子[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]胜利。然而，尽管我们又有了一位罗阇，但我们的王国内部正在酝酿麻烦。最近，旃陀罗笈多和宾头娑罗之死给我们的王国留下了深深的印记，困难的时期将到来了。"
 flavor_maurya_5_title:0 "宾头娑罗之死"
 flavor_maurya_5_tooltip:0 "#G 获得开启防止崩溃使命树的权限#!。\n#R 该使命树如果在[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]死前没有完成，就会失败#!。"
 flavor_maurya_6.a:0 "麻烦接近..."
 flavor_maurya_6.desc_1:0 "伟大的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]已死，我们将大难临头。没有他的引领，我们怎么可能生存下去？现在我们边境上的许多国家，甚至是我们自己的臣民，现在都想把这个曾经伟大的帝国推向灭亡。我们最后的生存希望真的消失了吗？"
 flavor_maurya_6.desc_2:0 "伟大的[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]已经去世，但他的努力并没有白费。他稳定了我们的国家和摩揭陀对全印度的统治。在未来的许多年里，他将被誉为有史以来最伟大的印度统治者。他的成就将回响在永恒的岁月里！"
 flavor_maurya_6_title:0 "[Player.MakeScope.Var('ashoka_but_for_loc_local').GetCharacter.GetName]已死！"
 flavor_maurya_9.a:0 "这一切何时才能结束……"
 flavor_maurya_9.b:0 "可能这是一个新的开始。"
 flavor_maurya_9_desc:0 "我的主啊，我们的帝国正处于废墟之中。我们在南印度的所有产业都发生了叛乱。百乘王朝和羯陵伽人已经宣布独立，愿狗咬他们的骨头，还有更多的人似乎也要这样做！能做什么呢？"
 flavor_maurya_9_title:0 "德干的脱离"
 flavor_maurya_9_tooltip_B:0 "#Y 百乘#! 和 #Y 羯陵伽#! 与我们要么开战，要么休战。"
 flavor_maurya_9_tooltip_C:0 "放弃 #Y 孔雀#!，继续扮演 #Y 百乘#! 并与 #Y 孔雀#! 开战。"

l_simp_chinese:
 accepted_envoys:0 "欢迎特使"
 accepted_league:0 "加入布匿联盟"
 any_subject_trigger:0 "任一附属国"
 capitalpunic:0 "西方的布匿之都"
 carthage_sad:0 "衰落中的迦太基"
 denied_envoys:0 "拒绝使节"
 denied_league:0 "拒绝加入联盟"
 denied_protectors_opinion:0 "被拒绝的优惠地位"
 diplomatic_autonomy:0 "外交自主权"
 few_boats:0 "提供了船只"
 granted_protectors_opinion:0 "给予优惠地位"
 many_boats:0 "提供了一支舰队"
 no_boats:0 "未能提供船只"
 protector_of_africa:0 "非洲的保护者"
 protector_of_africa_desc:0 "这个国家已经被迦太基承认为非洲的正式保护者。只要她的海岸保持安全，他们就可以期待迦太基海军对其事务的援助。"
 punic_mission_task_1:0 "寻求新的盟友"
 punic_mission_task_10:0 "非洲的保护者"
 punic_mission_task_10_DESC:0 "#G 如果迦太基接受，我们将成为非洲的保护者，以保护海岸和迦太基的家园为交换条件，获得舰队的提升。\n \n#! 我们的舰队很强大，通过将它们完全集中在非洲的防御上，我们可以让迦太基自由地继续在海外作战。"
 punic_mission_task_11:0 "迦太基的船厂"
 punic_mission_task_11_DESC:0 "#G 迦太基在未来可能会要求海军。他们希望能收到至少15艘船。\n \n#! 通过向迦太基提供造船服务，我们可以获得更大的外交筹码。"
 punic_mission_task_12:0 "[mission_country.GetName]的崛起"
 punic_mission_task_12_DESC:0 "#G 如果迦太基接受，我们将成为他们的独立盟友。\n \n#! 终于到了。我们已经获得了对迦太基的权力和影响力，他们将我们视为忠诚的盟友。现在，我们也许可以让他们同意我们独立。"
 punic_mission_task_13:0 "一个新的城市"
 punic_mission_task_13_DESC:0 "我们必须把我们的首都建设成西地中海最伟大的城市——甚至让我们以前的宗主都黯然失色！"
 punic_mission_task_1_DESC:0 "#R 这将阻断迦太基的谈判任务。\n \n#! 即使我们渴望从迦太基手中解放出来，也有其他国家处于同样的困境。在国外寻找这些人，并在他们中间结交新的朋友，将是一项值得的任务。"
 punic_mission_task_2:0 "前往努米底亚的特使"
 punic_mission_task_2_DESC:0 "#R 这将阻断派往各城市的使者的任务。\n \n#! 非洲内陆骄傲的努米底亚国王曾经统治了所有这些土地。也许他们会愿意帮助我们推翻迦太基在非洲的霸权。"
 punic_mission_task_3:0 "迦太基人的谈判"
 punic_mission_task_3_DESC:0 "#R 这将阻断寻求新盟友的任务。\n \n#! 虽然我们希望摆脱迦太基人的桎梏，但我们可以暂时与他们合作，以获得好感，最终与他们达成外交解决。"
 punic_mission_task_4:0 "向各城市派遣特使"
 punic_mission_task_4_DESC:0 "#R 这将阻断前往努米底亚的使节任务。\n \n#! 西地中海的其他布匿城市也在迦太基人的枷锁下挣扎。我们可以与他们结成联盟，以击败我们共同的压迫者。"
 punic_mission_task_4_tt:0 "除乌提卡与刻耳库阿涅外，所有迦太基附庸国对我国的友好度都超过100。"
 punic_mission_task_5:0 "布匿联盟"
 punic_mission_task_5_DESC:0 "现在我们已经和其他布匿城市取得了联系，我们可以和他们接洽，让他们组成一个泛布匿联盟来反对迦太基。"
 punic_mission_task_6:0 "柏柏尔人的贡品"
 punic_mission_task_6_DESC:0 "有一段时间，努米底亚人向迦太基索取贡品。作为恢复这种贡品的交换条件，他们可以在不可避免的战争中帮助我们。"
 punic_mission_task_7:0 "备战"
 punic_mission_task_7_DESC:0 "通过为我们都知道即将到来的战争做准备，[mission_country.GetAdjective]人将准备好抓住任何可能出现的机会。"
 punic_mission_task_8:0 "布匿人的起义"
 punic_mission_task_8_DESC:0 "现在是时候了!如果我们要打倒迦太基人，我们必须出击。"
 punic_mission_task_9:0 "外交自主权"
 punic_mission_task_9_DESC:0 "为了换取更多的贡品，我们在与迦太基和外国势力打交道时可能会获得更多的外交余地。"
 punic_resurgence_1.a:0 "他们的信任是明智的。"
 punic_resurgence_10.a:0 "我认为[problem_two.GetName]在这里是正确的；但商人们必须接受审判。"
 punic_resurgence_10.b:0 "[problem_one.GetName]的商人应该被释放。"
 punic_resurgence_10_desc:0 "布匿联盟的两个成员，[problem_one.GetName]和[problem_two.GetName]来到我们面前寻求解决争端。[problem_one.GetName]声称[problem_two.GetName]将他们的一些商人非法关押在监狱里，而[problem_two.GetName]则说这些商人向他们的公民非法出售商品。他们自己无法达成解决方案，所以将此案提交给布匿议会。两人似乎都非常愤怒，所以我们必须谨慎行事。"
 punic_resurgence_10_title:0 "一场贸易争端"
 punic_resurgence_11.a:0 "[problem_one.GetName]更需要它们。"
 punic_resurgence_11.b:0 "我们支持[problem_two.GetName]是至关重要的。"
 punic_resurgence_11.c:0 "我是领导......税收属于我!"
 punic_resurgence_11_desc:0 "我们在布匿联盟的盟友对我们的领导很满意，已经捐了一些钱。每笔钱都不多，但加起来就不是小数目了。我们应该如何使用这些钱？联盟中的两个城市已经申请使用这些资金。"
 punic_resurgence_11_title:0 "税收的使用"
 punic_resurgence_14.a:0 "团结起来，走向胜利!"
 punic_resurgence_14_desc:0 "[accepted.GetName]已经加入了我们的泛布匿联盟。我们一起更强大!"
 punic_resurgence_14_title:0 "来自[accepted.GetName]的回应"
 punic_resurgence_15.a:0 "对于布匿人来说，这确实是一个黑暗的日子。"
 punic_resurgence_15_desc:0 "[leaving.GetName]已经离开了我们的泛太平洋联盟。他们提到了我们对待他们的麻烦和对其他城市的偏爱。"
 punic_resurgence_15_title:0 "联盟缩减"
 punic_resurgence_17.a:0 "他们将为此感到遗憾。"
 punic_resurgence_17_desc:0 "迦太基元老院，鉴于敌军多次在迦太基本身的海岸以及非洲其他地方登陆，已经宣布永久取消我们作为非洲保护者的地位。"
 punic_resurgence_17_title:0 "保护者不再存在"
 punic_resurgence_18.a:0 "他们会得到他们应得的东西。"
 punic_resurgence_18.b:0 "我们...呃...没有船给你们。"
 punic_resurgence_18_desc:0 "迦太基的元老院看到正在进行的战争，要求我们为他们提供更多的船只，以帮助他们进行战争。"
 punic_resurgence_18_title:0 "迦太基请求海军援助"
 punic_resurgence_19.a:0 "他们可以走，只要我们仍然是盟友。"
 punic_resurgence_19.b:0 "他们怎么敢？总是推波助澜。"
 punic_resurgence_19_desc:0 "我们在[mission_country.GetName]的忠实臣民要求他们（正式）独立。他们为我们提供了很好的服务，并可能作为我们的盟友在未来继续这样做。我们应该如何回应？"
 punic_resurgence_19_title:0 "[mission_country.GetName]的崛起"
 punic_resurgence_1_desc:0 "迦太基人认为应该同意我们的请求。我们将保卫非洲海岸，让他们自由地继续在伊比利亚和其他地区作战，相信他们的心脏地带在我们手中是安全的。作为交换，他们同意为我们的舰队提供补给，并以任何方式帮助我们，以及给予我们几个小港口作为补给基地。然而，他们警告我们，如果我们不能保卫非洲海岸，这些专属权利将被剥夺，我们将被迫回到我们的老位置，只是西地中海众多布匿国家中的一个。"
 punic_resurgence_1_title:0 "非洲的保护者"
 punic_resurgence_2.a:0 "他们会后悔的!"
 punic_resurgence_2_desc:0 "我们的信使已经从迦太基空手而归。他们在元老院大厅里被嘲笑，因为他们的请求太过大胆。政府说，我们不会再得到任何恩惠，我们应该对已经拥有的东西心存感激。"
 punic_resurgence_2_title:0 "来自迦太基的信使"
 punic_resurgence_3.a:0 "我们会同意他们的请求，只要他们坚持他们的协议。"
 punic_resurgence_3.b:0 "这不正是一个忠诚的臣民应该做的吗？"
 punic_resurgence_3_desc:0 "元老院收到了来自我们附属国城市[mission_country.GetName]的信使。他们向我们提出了一个有趣的建议：作为交换，他们将在非洲周围的几个港口和进一步的外交优惠，在我们的军队外出作战时，他们将奉献出他们的舰队为我们保护海岸。\n \n 一些顾问认为这将使我们腾出手来参加离本土海岸更远的战役，而其他人则认为这是一个绝望的地方政府的又一次权力游戏。"
 punic_resurgence_3_title:0 "来自[mission_country.GetName]的信使"
 punic_resurgence_4.a:0 "在我们为他们做了这么多事之后..."
 punic_resurgence_4_desc:0 "我们的布匿臣民已经联合起来，建立了一个所谓的布匿联盟。他们说这是出于经济和外交原因，但越来越明显的是，他们不希望继续作为我们的臣民。我们可能要注意今后的阴谋或背叛。"
 punic_resurgence_4_title:0 "臣民的联盟"
 punic_resurgence_5.a:0 "我们接受!"
 punic_resurgence_5.b:0 "我们不能......风险太大。"
 punic_resurgence_5_desc:0 "我们的政府从我们的姐妹城市[mission_country.GetName]收到了一个有趣的提议。他们希望组建一个布匿城市联盟，表面上是为了促进所有成员的贸易和经济，但似乎很明显，其根本目的是为了最终反对迦太基的霸权。\n \n 如果我们加入，我们将获得宝贵的盟友，但代价是迦太基对我们的任何善意。反对这样一个大国总是有风险的。"
 punic_resurgence_5_title:0 "来自[mission_country.GetName]的提议"
 punic_resurgence_6.a:0 "啊，朋友们!加入我们的盛宴吧!"
 punic_resurgence_6.b:0 "把他们拒之门外。"
 punic_resurgence_6_desc:0 "一支外交队伍今天抵达我们的首都，来自腓尼基的[mission_country.GetName]城。他们说，他们希望寻求与我们建立更密切的关系，因为我们都受制于迦太基。出于某种原因，他们在这一点上非常坚持。"
 punic_resurgence_6_title:0 "腓尼基人的特使"
 punic_resurgence_7.a:0 "啊，朋友们!加入我们的议会吧!"
 punic_resurgence_7.b:0 "把他们赶走。"
 punic_resurgence_7_desc:0 "今天，一支外交队伍来到了我们的首都，他们来自布匿的[mission_country.GetName]城。他们说，他们希望寻求与我们建立更密切的关系，因为我们都受制于迦太基。出于某种原因，他们对这一点非常坚持。作为我们的姐妹城市，我们自然有相当好的关系，但他们表示，他们希望最终形成某种联盟。"
 punic_resurgence_7_title:0 "一个特使 一个姐妹城市"
 punic_resurgence_8.a:0 "召集我们的军队。摧毁他们!"
 punic_resurgence_8_desc:0 "我们的许多布匿臣民以所谓'布匿联盟'的名义共同向我们宣战。他们说他们希望摆脱我们，并联合起来实现这一目标。显然，即使我们做了这么多，这些背信弃义的臣民也必须被彻底解决。"
 punic_resurgence_8_title:0 "背信弃义！"
 punic_resurgence_9.a:0 "我们将向着胜利前进!"
 punic_resurgence_9_desc:0 "[mission_country.GetName]已经决定是时候出击了。他们向布匿议会提出动议，向我们的压迫者迦太基同时宣战，目的是为了给我们所有人带来自由。"
 punic_resurgence_9_title:0 "为了自由!"
 punic_resurgence_mission:0 "布匿人的重新崛起"
 punic_resurgence_mission_BUTTON_TOOLTIP:0 "我们将战胜一切对手！"
 punic_resurgence_mission_CRITERIA_DESCRIPTION:0 "当我们建立了一个新的、比迦太基更强大的布匿霸权时，该使命完成。"
 punic_resurgence_mission_DESCRIPTION:0 "迦太基对布匿人的控制已经很多年了，但我们得到了什么？希腊人仍然把持着东方，意大利王国对布匿的西西里岛构成了威胁。现在，是时候让一个新的国家崛起并领导我们的人民了。"
 punic_resurgent:0 "积极外交"
 punic_resurgent_desc:0 "我们已经派出特使回到更广阔的世界，与我们的邻国开展外交。"

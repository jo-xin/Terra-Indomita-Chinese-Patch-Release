l_simp_chinese:
 FEZZAN_MONARCHY_FLAG:0 "费赞王朝的胜利旗帜"
 FEZZAN_TRIBAL_FLAG:0 "费赞部落的可怕旗帜"
 NICKNAME_AEROZONA:0 "阿鲁兹·奥纳"
 PSYLLIAN_KYTHERA_SUBJECT:0 "基塞拉"
 PSYLLIAN_KYTHERA_SUBJECT_ADJECTIVE:0 "基塞拉的"
 PSYLLIAN_MELITA_SUBJECT:0 "梅丽塔"
 PSYLLIAN_MELITA_SUBJECT_ADJECTIVE:0 "梅里坦"
 coastal_fortifications:0 "沿海防御工事"
 date_trade:0 "交易日期"
 demoralized_overlord:0 "士气低落的宗主"
 desc_desert_oasis_capital:0 "我们为在我们的绿洲附近建立一个沙漠天堂而辛勤工作了很久。"
 desc_garamantes_march:0 "通过向该项目投入大量的政治资本，我们创造了一个随时准备开战的主体国家。"
 desc_king_of_fezzan:0 "我们胜利的统治者将费赞王国从沙漠沙地上凿出，创造了一座将持续到世界末日的大厦。"
 desc_phazania_inquisition:0 "现在，我们的死敌已经被毁灭，我们的代理人确保和平和繁荣仍然是帕赞尼亚的方式。"
 desert_breadbasket:0 "沙漠粮仓"
 desert_oasis_capital:0 "沙漠绿洲首都"
 desert_rose:0 "沙漠中的玫瑰"
 diverted_outpost_trade:0 "增加前哨贸易"
 diverted_trade:0 "转移的贸易"
 dug_in:0 "防御性预防措施"
 feudatory_trade:0 "附庸交易商"
 fezzan_dates_produced_task24_loc_1:0 "(#R [SCOPE.ScriptValue('fezzan_dates_produced_task24_current')|0]#!/#Y [SCOPE.ScriptValue('fezzan_dates_produced_task24_total')|0]#!)"
 fezzan_dates_produced_task24_loc_2:0 "(#Y [SCOPE.ScriptValue('fezzan_dates_produced_task24_current')|0]#!/#Y [SCOPE.ScriptValue('fezzan_dates_produced_task24_total')|0]#!)"
 fezzan_dates_produced_task24_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少产生#Y [SCOPE.ScriptValue('fezzan_dates_produced_task24_total')|0]日期#!@dates!在#Y [GetProvince('(int32)8168').GetArea.GetRegion.GetName]#!的区域。"
 fezzan_kingdom:0 "费赞王国"
 fezzan_tribe:0 "费赞"
 fezzani_ambition:0 "费赞的野心"
 fezzani_horsemen:0 "费赞骑兵队"
 fezzani_mission_01:0 "沙漠天堂"
 fezzani_mission_01_BUTTON_TOOLTIP:0 "我们注定要成为这片最严酷土地的主人……"
 fezzani_mission_01_CRITERIA_DESCRIPTION:0 "当沙漠部落战胜他们的敌人和大自然本身，在沙丘中建立一个天堂般的王国时，这项使命才算完成。"
 fezzani_mission_01_DESCRIPTION:0 "那些在我们的人民居住的地区旅行的人有一两个原因；他们要么是想为自己雇佣我们强大的雇佣军，要么是在我们领地的广阔沙漠平原上迷路了。虽然我们多年来一直在为他人服务，但我们已经决定要为自己服务一次。"
 fezzani_mission_01_task_01:0 "费赞的王冠"
 fezzani_mission_01_task_01_DESC:0 "我们，作为一个民族，已经走过了很长的路，我们事务的这种变化最好由政府的变化来代表。我们的人民不希望被行政官统治，而是希望有一个国王。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 fezzani_mission_01_task_02:0 "费赞的人民"
 fezzani_mission_01_task_02_DESC:0 "因为，就像每个好的统治者应该做的那样，我们爱我们的人民，渴望看到他们茁壮成长，我们将不惜一切代价为他们创造更好的生活。我们将不惜一切代价为他们创造更好的生活。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 fezzani_mission_01_task_03:0 "加拉曼特王国"
 fezzani_mission_01_task_03_DESC:0 "如果我们希望把我们的枷锁扔给别人，像国王一样进行统治，那么我们现在必须采取步骤，改革我们的征收，并确保我们的长官与我们在一起。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 fezzani_mission_01_task_04:0 "马基利亚人"
 fezzani_mission_01_task_04_DESC:0 "我们北方的#E 马基利亚#!部落又小又弱，很容易被我们征服——现在是时候了。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 fezzani_mission_01_task_04_tt:0 "这有可能导致与马凯恩的战争。"
 fezzani_mission_01_task_05:0 "皇冠首都"
 fezzani_mission_01_task_05_DESC:0 "如果我们想要我们的[ROOT.GetCountry.GetCapital.GetName]的首都得到尊重，那么我们就必须尽我们所能，艰苦工作之时尚在眼前，但回报将是值得我们人民所付出的努力的。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 fezzani_mission_01_task_06:0 "沙漠粮仓"
 fezzani_mission_01_task_06_DESC:0 "虽然我们的地形很难用来种植东西，但我们仍然可以建立农场，利用现有的可耕地。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 fezzani_mission_01_task_07:0 "战略规划"
 fezzani_mission_01_task_07_DESC:0 "重要的是，我们要在重要省份修建防御工事，控制进出[ROOT.GetCountry.GetName]的路线。通过前瞻和基于我们在战略规划方面的行动，整个国家都将受益。\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 fezzani_mission_01_task_08:0 "纳萨摩尼亚人的王国"
 fezzani_mission_01_task_08_DESC:0 "让我们派一个特使到#E 纳萨摩尼亚#! ，看看他们是否是一个能够被说动的民族。 \n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 fezzani_mission_01_task_09:0 "瓦丹市"
 fezzani_mission_01_task_09_DESC:0 "#E 瓦丹#! 是一个值得开发的绿洲城市；比她的自己人能够做到，我们可以为马基利亚的前首都做更多的事情。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 fezzani_mission_01_task_10:0 "丰盛的椰枣"
 fezzani_mission_01_task_101:0 "纳萨摩尼亚的宗主们"
 fezzani_mission_01_task_101_DESC:0 "让我们联系我们的宗主，看看他们是否愿意与我们合作——希望大量的黄金能动摇他们的想法。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 fezzani_mission_01_task_101_tt:0 "我们将收到一些#Y 殖民者#!来帮助我们的扩张。"
 fezzani_mission_01_task_102:0 "首都港"
 fezzani_mission_01_task_102_DESC:0 "我们的首都#E Euphranta#!享有的美丽位置，有数英里长的沙滩和吻着我们海岸的轻柔的水，将是建立一个宏伟港口的最佳选址。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 fezzani_mission_01_task_103:0 "普绪利亚海岸"
 fezzani_mission_01_task_103_DESC:0 "在叙耳提卡地区海岸线上旅行的商人们已经把它命名为“普绪利亚海岸”，这无疑是由于我们已经建造了大量的港口和码头。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 fezzani_mission_01_task_104:0 "地中海探险"
 fezzani_mission_01_task_104_DESC:0 "我们不要坐以待毙，而是要利用我们的地理优势，发挥我们的雄心壮志--我们应该把我们的海军派到很远很远的地方，撒下网来，希望能找到一个地方，为我们的人民建立新的市场。 \n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 fezzani_mission_01_task_104_tt:0 "#G 普绪利亚#! 有一支至少20艘船的海军，并有一名指挥官领导舰队。"
 fezzani_mission_01_task_104_tt.a:0 "我们将派出一支探险队，探索并尝试在整个地中海地区建立#Y 贸易前哨#! 。我们预计这次航行将需要一年以上的时间来完成。"
 fezzani_mission_01_task_105:0 "东西提卡"
 fezzani_mission_01_task_105_DESC:0 "我们将派遣殖民者前往东部沙漠，并得到[ROOT.GetCountry.GetAdjective]政府的全力支持。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 fezzani_mission_01_task_106:0 "西西特卡"
 fezzani_mission_01_task_106_DESC:0 "我们不安分的人口在寻找新的土地居住，我们很高兴看到我们的人民在开垦被沙漠风沙和时间侵蚀的领土。 \n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 fezzani_mission_01_task_107:0 "伪装的战争"
 fezzani_mission_01_task_107_DESC:0 "我们不能害怕完成那些我们必须完成的事情。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 fezzani_mission_01_task_107_tt:0 "一个事件链会发生，我们可以在邻近的费赞部落之间挑起战争，让#Y 纳萨摩尼亚人#! 保卫我们。\n\n"
 fezzani_mission_01_task_108:0 "战争的战利品"
 fezzani_mission_01_task_108_DESC:0 "正如黑夜伴随着白天，轰动的财富也伴随着胜利——让我们深深地喝下我们成功的高脚杯，沉醉在战争的战利品中。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 fezzani_mission_01_task_109:0 "帕萨尼亚"
 fezzani_mission_01_task_109_DESC:0 "我们将不得不冒险深入荒凉的土地，将Phazanian部落赶出他们的定居点，但他们受审判的时刻已经到来了。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 fezzani_mission_01_task_10_DESC:0 "我们正面临最幸福的烦恼：椰枣丰收，而我们的民众对这种果实情有独钟。这种甜美果实的供应已变得理所当然，我们还向邻国出口了大量椰枣。\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 fezzani_mission_01_task_10_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 将获得对邻国首都领土的宣称。"
 fezzani_mission_01_task_11:0 "马凯人"
 fezzani_mission_01_task_110:0 "纳萨摩尼亚的土地"
 fezzani_mission_01_task_110_DESC:0 "我们不能再以奴役的状态存在下去了——尽管前面的路可能是一条血路，但这是我们愿意为自由付出的代价。\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 fezzani_mission_01_task_110_tt:0 "我们将决定如何处理纳萨摩尼亚人。"
 fezzani_mission_01_task_111:0 "加拉曼特家族"
 fezzani_mission_01_task_111_DESC:0 "据说加拉曼特人是凶猛的战士，向任何有钱的人出售他们的暴力服务，但这种声誉不会阻止我们的人在战斗中打败他们。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 fezzani_mission_01_task_111_tt:0 "我们将获得对#Y 加拉曼特#!所拥有的每一个省份的宣称。"
 fezzani_mission_01_task_112:0 "马凯恩贵重金属"
 fezzani_mission_01_task_112_DESC:0 "关于在新马卡伊土地上开采贵金属的情况如何？并用它们来资助我们的探险/探索"
 fezzani_mission_01_task_113:0 "贸易前哨站"
 fezzani_mission_01_task_113_DESC:0 "虽然我们对我们在地中海的贸易前哨很满意，但我们想知道是否有其他办法可以改善我们在海外的财产。 \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 fezzani_mission_01_task_113_tt:0 "我们至少已经得到了#Y 马耳他#!或#Y 基塞拉#!两个岛中的一个。"
 fezzani_mission_01_task_114:0 "强化东方"
 fezzani_mission_01_task_114_DESC:0 "一个明智的统治者确保边境免受突然入侵，因为我们有许多强大而咄咄逼人的邻居，特别是在东部。\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 fezzani_mission_01_task_11_DESC:0 "#E 梅斯斐#!，马凯的首都，距离地中海仅有数日骑行之遥；让我们比以往任何时候都更加努力地战斗，向海岸线推进！\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 fezzani_mission_01_task_12:0 "费赞的附庸"
 fezzani_mission_01_task_12_DESC:0 "像我们这样的大国，应该有受其指挥的附庸国家——这是自然之道。我们将对我们的臣民进行大量投资，提高他们的军事能力，使他们能够在战场上与[ROOT.GetCountry.GetName]的士兵比肩而立。 \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 fezzani_mission_01_task_12_tt:0 "#Y 你#! 必须至少有一个附庸"
 fezzani_mission_01_task_12_tt_a:0 "你拥有的任何附庸都会获得#G 显著的#! 军事提升。"
 fezzani_mission_01_task_13:0 "穿越帕萨尼河"
 fezzani_mission_01_task_13_DESC:0 "我们将采取荒凉的沙漠道路，并蔓延到#E 帕萨尼亚#! 的土地上--他们将永远不会想到我们的军队！\n\n\n\n\n\n\n\n\n\n=0>@egypt_mil20!。"
 fezzani_mission_01_task_14:0 "普绪利亚人"
 fezzani_mission_01_task_14_DESC:0 "大家都知道，来自#E 普绪利亚#! 的骆驼因其耐力和活力而受到重视，但我们没有从邻居那里购买它们，而是决定我们将自己带走它们。\我们决定不从邻居那里买，而是自己去买。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 fezzani_mission_01_task_15:0 "一个东方的首都"
 fezzani_mission_01_task_15_DESC:0 "随着我们领土的扩张，我们开始遇到行政问题，这在一个像我们这样庞大的王国中是很常见的。有人说要在东部建立第二个首都，以缓解这些问题。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 fezzani_mission_01_task_16:0 "帕萨尼亚的矿场"
 fezzani_mission_01_task_16_DESC:0 "在#E 帕萨尼亚#!的矿场里有财富，这将为[ROOT.GetCountry.GetName]的人民带来奇迹——让我们尽我们所能去开采它。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 fezzani_mission_01_task_17:0 "马凯之乡"
 fezzani_mission_01_task_17_DESC:0 "看看我们在马凯土地上所取得的成就和建造的一切；谁能说我们不是这片土地的真正统治者？\n\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 fezzani_mission_01_task_18:0 "普绪利亚的港口"
 fezzani_mission_01_task_18_DESC:0 "虽然在航海方面我们是相对的新人，但我们正通过尽一切可能掌握航海的艺术来弥补我们的经验不足。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 fezzani_mission_01_task_18_tt:0 "#Y 加拉曼提亚#!有一支至少15艘船的海军。"
 fezzani_mission_01_task_19:0 "与希腊人的邂逅"
 fezzani_mission_01_task_19_tt:0 "我们正在激怒生活在沿海地区的希腊人，他们开始把我们视为权力的对手。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil14!"
 fezzani_mission_01_task_20:0 "沙漠中的玫瑰"
 fezzani_mission_01_task_201:0 "纳萨摩尼亚王国"
 fezzani_mission_01_task_201_DESC:0 "我们的首都[GetProvince('(int32)8128').GetName]位于平原上，准备将新兴的纳萨摩尼亚王国的权威投射到周围的沙漠。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 fezzani_mission_01_task_202:0 "普绪利亚的附庸"
 fezzani_mission_01_task_202_DESC:0 "我们北方的#E 普绪利亚#! 享受着地中海的温暖水域和[ROOT.GetCountry.GetAdjective]征收的保护——他们为自己创造了一个多么令人羡慕的小环境。我们应该采取必要的措施，使他们更接近我们的人民。\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 fezzani_mission_01_task_203:0 "马基利亚人"
 fezzani_mission_01_task_203_DESC:0 "我们西部的#E 马基利亚#!部落一直是我们的眼中钉。长久以来，他们的掠夺者离开了他们设防的[GetProvince('(int32)8142').GetName]定居点，进入我们的土地——这不会再发生了！\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 fezzani_mission_01_task_204:0 "马基利亚椰枣"
 fezzani_mission_01_task_204_DESC:0 "虽然我们喜欢椰枣——我们的士兵在他们的背包里放上一把，在他们在战役中行军时咀嚼这种美味的水果，以保持他们的体力水平--但我们不应该把大自然的礼物视为理所当然，而是要尽我们所能来扩大我们的生产。 \n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 fezzani_mission_01_task_205:0 "敌对部落"
 fezzani_mission_01_task_205_DESC:0 "我们和西边的大部落之间没有爱情，每个人都知道，我们的力量不可避免地发生冲突只是时间问题……这些沙漠不够大，不足以支撑多个酋长的野心。\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 fezzani_mission_01_task_205_tt:0 "我们将获得对#T 加拉曼特#! 和#T 马凯#!所拥有的每个省份的宣称。"
 fezzani_mission_01_task_206:0 "加拉曼特农田"
 fezzani_mission_01_task_206_DESC:0 "我们惊讶地发现，#E 加拉曼特人#! 在他们的腹地有肥沃的平原，他们在那里建立了大型农场来维持他们的人口。现在我们已经把他们从这些宝贵的田地上赶走了，让我们追随他们的脚步，尽我们最大的能力来开发这片土地。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 fezzani_mission_01_task_207:0 "纳萨莫尼亚的首都"
 fezzani_mission_01_task_207_DESC:0 "[GetProvince('(int32)8128').GetName]是人们离开希腊人建造港口和堡垒的海滩和海岸后遇到的第一个主要城市。作为[ROOT.GetCountry.GetName]的首府，它正迅速成为该地区最杰出的城市，在声誉和财富方面超过了其他所有城市。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 fezzani_mission_01_task_208:0 "帕萨尼亚"
 fezzani_mission_01_task_208_DESC:0 "虽然[GetProvince('(int32)3256').GetName]的商人认为#E 帕萨尼亚#! 只不过是一个讨厌的人，一个攻击在沙漠中迷路的旅行者和商队的弱小部落，但我们不会忽视他们的犯罪行为。让我们通过征服他们的家园并吞并它来惩罚这些强盗和小偷。\征服他们的家园，吞并他们。\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 fezzani_mission_01_task_209:0 "费赞骑兵队"
 fezzani_mission_01_task_209_DESC:0 "虽然我们的一些表亲喜欢骆驼，几乎把它们当作家庭宠物一样对待，但我们[ROOT.GetCountry.GetAdjective]人却以养马的技巧而闻名。十有八九，每当人们去市场上购买他们的钱币所能买到的最华丽的公马时，很有可能这匹马是在我们的农场里长大的。\n\n\n\n\n\n\n\n\n\n@persia_mil19!"
 fezzani_mission_01_task_20_DESC:0 "现在是时候拥抱我们的命运，创造一个新的国家，一个将从荒凉的地方统治的国家——就像沙漠中盛开的玫瑰，我们是一个奇迹。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 fezzani_mission_01_task_20_tt:0 "我们将组建#Y 费赞#!国家。"
 fezzani_mission_01_task_21:0 "马凯恩的黄金"
 fezzani_mission_01_task_21_DESC:0 "在沙漠的山丘上有宝贵的黄金——让我们尽我们所能，尽可能多地开采这些马凯恩人的财富。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 fezzani_mission_01_task_301:0 "马凯亚人"
 fezzani_mission_01_task_301_DESC:0 "让我们尽我们所能将我们的人民凝聚集在一起，实现一个目标——[ROOT.GetCountry.GetName]的强大和扩张，使其不仅仅是大国之间的缓冲区。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 fezzani_mission_01_task_302:0 "我们的马凯恩兄弟"
 fezzani_mission_01_task_302_DESC:0 "我们在北方的亲戚可能会意识到我们所处的共同危险，特别是如果涉及到黄金来吸引他们的耳朵--也许我们国家之间的友谊是我们应该研究的东西。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 fezzani_mission_01_task_302_tt:0 "也许我们可以与我们北方的兄弟结盟......。"
 fezzani_mission_01_task_303:0 "卑微的开端"
 fezzani_mission_01_task_303_DESC:0 "虽然很难相信这样一个宏伟的城市曾经有如此卑微的开始，但我们看到了这片土地和我们的人民的潜力，并预见到未来的伟大。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 fezzani_mission_01_task_304:0 "被敌对的部落所包围"
 fezzani_mission_01_task_304_DESC:0 "不需要军事天才就能意识到我们的处境很艰难，因为我们四面都被咄咄逼人的敌对部落所包围。与其等待我们的厄运让我们措手不及，不如把毁灭带到我们敌人的门前--但首先，我们必须把我们的防卫计划落实到位。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 fezzani_mission_01_task_305:0 "加拉曼提斯农田"
 fezzani_mission_01_task_305_DESC:0 "我们长期以来一直觊觎加拉曼特人曾经照料过的肥沃的田地--现在它们是我们的了，我们必须尽最大努力开发这些领土。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 fezzani_mission_01_task_306:0 "马凯亚人的附庸"
 fezzani_mission_01_task_306_DESC:0 "这符合#E 马凯#!的最佳利益和平地向我们的胜利的军队屈服——他们才有希望地能活着看到他们的孙辈长大，且不用对我们两国之间的战争带来的破坏负责。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 fezzani_mission_01_task_306_tt:0 "我们有机会说服#Y 马凯#! 作为附庸加入我们——否则，我们将得到宣称。"
 fezzani_mission_01_task_307:0 "海岸"
 fezzani_mission_01_task_307_DESC:0 "通过向北推进，我们将表明，我们不打算停留在沙漠中，而是很快也将成为海岸的主人。更广阔的世界在等着我们！\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 fezzani_mission_01_task_308:0 "马凯亚人的土地"
 fezzani_mission_01_task_308_DESC:0 "如果我们把北方的马凯亚部落的土地拿下，那么又有什么理由阻止我们把军队向东推进，进入帕萨尼亚的沙漠呢？\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 fezzani_mission_01_task_401:0 "马基利亚人"
 fezzani_mission_01_task_401_DESC:0 "处在我们南方的#E 马基利亚人#!是一个弱势部落，位于更强大的国家之间的边界上；如果我们不接触他们，那么其他人无疑会接触。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 fezzani_mission_01_task_401_tt:0 "我们将试图说服他们成为我们的附庸，以便继续受到保护，不受#Y 加拉曼特人#!和#Y 纳萨摩尼亚人#!的影响。"
 fezzani_mission_01_task_402:0 "吉尔吉里的首都"
 fezzani_mission_01_task_402_DESC:0 "我们目前的首都#E 梅斯斐#! 享有优越的地理位置，但我们相信，我们可以采取一些措施来使它变得更好。如果我们建立起基础设施来支持吉尔吉里省的一个适当的城市，那么我们整个国家都会受益。\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 fezzani_mission_01_task_403:0 "帕萨尼亚"
 fezzani_mission_01_task_403_DESC:0 "西部沙漠是#E 帕萨尼亚#!人民的家园，他们目前享有的自由，他们的儿子和女儿将永远不会知道--因为我们的[ROOT.GetCountry.GetAdjective]军队将奴役他们的地段。我们的军队将奴役他们。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 fezzani_mission_01_task_404:0 "雉鸡之城"
 fezzani_mission_01_task_404_DESC:0 "[GetProvince('(int32)8233').GetName]，这个曾经是#E 帕萨尼亚#!的骄傲的绿洲宝石，如果让我们的工程师和建筑师来美化这个被当地人称为'野鸡之城'的地方，就能真正地被建设成什么。\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 fezzani_mission_01_task_405:0 "我们的普绪利亚野心"
 fezzani_mission_01_task_405_DESC:0 "在我们实现拥有#E 普绪利亚 #!海滩的雄心之前，它不属于我们——派我们的军队到海岸摧毁敌人的城市和港口！\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 fezzani_mission_01_task_406:0 "纳萨摩尼亚的土地"
 fezzani_mission_01_task_406_DESC:0 "纳萨摩尼亚人相信自己在首都[GetProvince('(int32)8128').GetName]的城墙后是安全的，但我们要消除他们心中的这种想法，并把他们的城市据为己有！\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 fezzani_mission_01_task_407:0 "沙漠恶魔"
 fezzani_mission_01_task_407_DESC:0 "虽然格拉曼特人是众所周知的凶猛的战士，他们像从沙漠中召唤出来的恶魔一样与敌人战斗，但我们的部队将把他们打倒在地，把他们赶回冥界。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 fezzani_mission_01_task_501:0 "雉鸡"
 fezzani_mission_01_task_501_DESC:0 "雉是一种对我们的人民来说是神圣的动物，在困难时期它激励着[ROOT.GetCountry.GetAdjective]国民。让我们像一只聪明的鸟，翱翔于喧嚣之上，警惕地注视着下面的一切。\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 fezzani_mission_01_task_502:0 "沙漠绿洲"
 fezzani_mission_01_task_502_DESC:0 "#E 居达姆斯#!，我们的首都就像骆驼皮毛上的虱子一样紧贴着绿洲，亟需发展——如果我们把城市建设成真正的潜力，我们将获得巨大的收益。\n\n\n\n\n\n\n\n\n\n@egypt_mil23!。"
 fezzani_mission_01_task_503:0 "马卡伊人"
 fezzani_mission_01_task_503_DESC:0 "只有傻瓜才会不惧怕我们东边的#E 马凯#! 部落--他们强大、残忍，以毁灭他人为乐。但是，我们不会让他们可怕的名声阻止我们夺取属于我们的东西。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 fezzani_mission_01_task_504:0 "迦太基人"
 fezzani_mission_01_task_504_DESC:0 "我们永远不能指望靠自己的力量打败#E 迦太基人#! ，如果我们想对抗他们的巨大力量，必须积极寻求联盟。\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 fezzani_mission_01_task_505:0 "普绪利亚部落"
 fezzani_mission_01_task_505_DESC:0 "我们要把敌人推得更远；如果有必要，我们要占领他们的海岸，把他们的军队送进海洋！\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 fezzani_mission_01_task_506:0 "东部费赞部落"
 fezzani_mission_01_task_506_DESC:0 "不久之后，战争将回到我们的沙漠中——我们不能在我们的努力中疲于奔命，而是必须继续对尚未臣服于我们的东部费赞部落发动战争。\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 fezzani_mission_01_task_507:0 "最后的部落"
 fezzani_mission_01_task_507_DESC:0 "我们的敌人正在东面远处集结力量，希望他们能够对我们的军队做最后的抵抗——让我们剥夺他们的妄想。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 fezzani_mission_01_task_508:0 "马基利亚椰枣"
 fezzani_mission_01_task_508_DESC:0 "在#E 马基利亚人#!的土地上发现的枣子，如果我们能够把剩余的枣子拿出来卖，就能在市场上卖个好价钱。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 fezzani_rivalry:0 "费赞之争"

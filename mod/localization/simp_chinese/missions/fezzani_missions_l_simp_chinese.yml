 macean_tribesmen:0 "马凯恩部落的人"
 makaean_infrastructure:0 "马凯恩基础设施"
 makean_gold:0 "马凯恩贵重金属"
 makean_livestock:0 "马凯恩畜牧业"
 manifest_destiny:0 "马基利亚的命运"
 me_fezzani_1.a:0 "[ROOT.GetCountry.GetRuler.GetName]万岁!"
 me_fezzani_10.a:0 "我现在就在吃酿制的枣子"
 me_fezzani_101.a:0 "我们热切地等待着我们努力的结果"
 me_fezzani_101_desc:0 "我们已经决定，我们应该给我们的统治者送去我们拥有的东西--黄金，并要求送去我们目前没有的东西，也就是人，以帮助我们在我们周围的一些土地上定居。"
 me_fezzani_101_title:0 "纳萨摩尼亚的宗主们"
 me_fezzani_102.a:0 "扬帆远航，[ROOT.GetCountry.GetName]之子，但要平安归来"
 me_fezzani_102_desc:0 "我们的建筑师和工程师报告说，由[ROOT.GetCountry.GetRuler.GetName]设计的宏伟港口已经在[GetProvince('(int32)3333').GetName]完成，它是[ROOT.GetCountry.GetAdjective]人民荣耀皇冠上的一颗宝石。诚然，唯一能与我们的首都港相媲美的港口是[GetProvince('(int32)3256').GetName]著名的大科顿。为了庆祝这个吉祥的日子，一支新投入的舰队正骄傲地航行在尤菲兰特的海墙外，向我们的人民和邻国展示一个新时代正在到来。"
 me_fezzani_102_title:0 "首都港"
 me_fezzani_103.a:0 "我们的经济确实是值得羡慕的。"
 me_fezzani_103_desc:0 "从远方来的商人在访问我们的[ROOT.GetCountry.GetAdjective]海岸时，当然有他们选择的港口--似乎几乎每一个可以支持港口的海岸都被建成了杰出的东西。由于[ROOT.GetCountry.GetAdjective]统治者在[ROOT.GetCountry.GetCapital.GetName]时所做的工作，整个国家正经历着繁荣的时代。"
 me_fezzani_103_title:0 "海岸"
 me_fezzani_104.a:0 "更广阔的世界在等待着..."
 me_fezzani_104_desc:0 "清晨的太阳从[GetProvince('(int32)3333').GetName]上空升起，见证了[ROOT.GetCountry.GetAdjective]人的希望和梦想在这一天驶向未知的世界；经过几个月的精心策划和准备，一支舰队已经建成，并被赋予了寻找我们可以建立贸易前哨的岛屿的任务。如果一切按计划进行，我们将不再局限于北非的沙漠。"
 me_fezzani_104_title:0 "地中海探险"
 me_fezzani_105.a:0 "在这个非常温暖的日子里，这是一个多么重要的时刻啊"
 me_fezzani_105_desc:0 "虽然我们的语言与我们的邻居Nasamonian相互理解，但当大家向东进入沙漠时，我们的人和他们随行的奴隶之间没有对话--今天太热了，不适合说话。"
 me_fezzani_105_title:0 "东西提卡"
 me_fezzani_106.a:0 "好消息![ROOT.GetCountry.GetCapital.GetName]的更多税收"
 me_fezzani_106_desc:0 "我们很高兴地告诉你，[GetProvince('(int32)3330').GetName]是[ROOT.GetCountry.GetAdjective]人最新定居的省份。我们的人，在纳萨蒙奴隶的跟随下，沿着海岸线前进，直到到达一个适合建造定居点的地方。"
 me_fezzani_106_title:0 "西西特卡"
 me_fezzani_107.a:0 "我们将烧毁我们周围的一切，并重新崛起!"
 me_fezzani_107_desc:0 "[ROOT.GetCountry.GetRuler.GetName]策划了一个邪恶的计划，利用我们的新边界挑起邻国之间的战争。\n\n我们地区的局势已经高度紧张，因此，爆发更大规模的区域冲突只是时间问题。"
 me_fezzani_107_title:0 "伪装的战争"
 me_fezzani_108.a:0 "我们赢得了他们永远的感激，因为我们解放了他们"
 me_fezzani_108_desc:0 "多年来，#E 马凯#!的残忍和邪恶的人奴役了我们数百名可怜的[ROOT.GetCountry.GetAdjective]人，从他们身上偷走了自由，迫使他们在他们祖先不知道的田地和沙漠中工作。\n\n但这一切都已成为过去，因为我们已经把我们的兄弟从奴隶制的枷锁中解放出来，给他们自己的武器和新的生活。这些新获得自由的[ROOT.GetCountry.GetName]公民从来没有一个家，在我们的祝福下，他们已经搬到了沿海地区。"
 me_fezzani_108_title:0 "战争的战利品"
 me_fezzani_109.a:0 "我们在[ROOT.GetCountry.GetCapital.GetName]中庆祝我们永远的胜利"
 me_fezzani_109_desc:0 "我们不怕追击#E 帕萨尼亚#! 的士兵，深入他们的沙漠，我们把他们的家园和定居点付之一炬，把他们的儿子交给剑。\n\n由于我们所造成的破坏，这个地区在另一个世代都不会恢复--这是为抵抗[ROOT.GetCountry.GetAdjective]霸权所付出的代价。"
 me_fezzani_109_title:0 "帕萨尼亚"
 me_fezzani_10_desc:0 "枣饼在你口中融化，在炭火上新鲜烘烤，用蜂蜜糖化。枣酒是甜的，黄褐色的，是一种令人愉快的小酒，每当打开双耳瓶就会带来欢笑和友谊。或者你只是想嚼一嚼新鲜的？红色和绿色的枣子是最甜的，你只能在[ROOT.GetCountry.GetCapital.GetName]的市场上找到它们--这个城市以用国内发现的大量枣子制作的许多种类的糖果而闻名。值得庆幸的是，我们从出口水果带来的收入带来了健康的收入。"
 me_fezzani_10_title:0 "丰盛的椰枣"
 me_fezzani_11.a:0 "我们将取得胜利，如果发生冲突......。"
 me_fezzani_11.a.tt:0 "一个事件链将开始决定如何处理#G 马凯#!。"
 me_fezzani_11.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_110.a:0 "我们将把占领者从本应属于我们的地方赶出去"
 me_fezzani_110_desc:0 "我们渴望我们南部的土地，不能否认我们自己已经成为一种痴迷--我们必须拿下它们，不管是谁领走了它们。"
 me_fezzani_110_title:0 "纳萨摩尼亚的土地"
 me_fezzani_111.a:0 "我们的星星正在升起，而他们的星星却无处可寻......。"
 me_fezzani_111_desc:0 "我们的将军们告诉我们，我们对#E 加拉曼蒂克#! 人准备的宣称已经完成，没有什么能阻止我们对这些野蛮人进行一场公正和崇高的战争。召集我们的部队，为光荣的战斗做准备吧!"
 me_fezzani_111_title:0 "加拉曼特家族"
 me_fezzani_113.a:0 "我们热切地等待着他们的发现"
 me_fezzani_113_desc:0 "虽然我们目前正享受着来自海外财产的健康收入，但有人建议我们检查我们的财产，看看还能做些什么来扩大和发展我们目前拥有的财产。一组测量师和建筑师已经从[GetProvince('(int32)3333').GetName]派来，希望能很快发出消息。"
 me_fezzani_113_title:0 "贸易前哨站"
 me_fezzani_114.a:0 "虽然昂贵，但我们的防御工事保证了我们的安全"
 me_fezzani_114_desc:0 "如果我们不得不担心我们邻近的费赞部落就好了!因为我们可以在一周中的任何一天与我们的表亲站在一起，而且十有八九能胜过他们。然而，对我们来说，还有比我们的亲戚更大的威胁，由于东方是一个强大的军队和嗜血的国王的土地，我们最好确保我们控制沿海的战略咽喉。"
 me_fezzani_114_title:0 "强化东方"
 me_fezzani_115.a:0 "我们将给他们寄去一小笔钱"
 me_fezzani_115.b:0 "我想我们应该送一大笔钱"
 me_fezzani_115.c:0 "我们将不会发送任何东西!他们有义务帮助我们"
 me_fezzani_115_desc:0 "我们最初与#E 纳萨摩尼亚人#! 接触时，发现他们很容易接受，特别是当提到可能的黄金交换时。然而，他们的外交官却反其道而行之；他们没有说出他们的价格，而是问我们愿意花多少钱。"
 me_fezzani_115_title:0 "纳萨摩尼亚的宗主们"
 me_fezzani_116.a:0 "我们对照看我们的慷慨的统治者充满敬佩之情"
 me_fezzani_116_desc:0 "#E 纳萨摩尼亚人#! 已经回复了我们，给我们送来了三个酣畅淋漓的奴隶和一张纸条，感谢我们在请求中的尊重。\n\n“无论如何，我们都打算为你做这件事，但你的礼物肯定有助于说服[GetProvince('(int32)8128').GetName]中持怀疑态度的人。我们为我们的互利关系干杯，希望你们一切顺利。”"
 me_fezzani_116_title:0 "纳萨摩尼亚的宗主们"
 me_fezzani_117.a:0 "[ROOT.GetCountry.GetName]肯定得到了诸神的保佑！"
 me_fezzani_117_desc:0 "一支来自#E 纳萨摩尼亚#!的商队到达了[GetProvince('(int32)3333').GetName]的城墙——我们向霸主要求的奴隶已经到达，此外还有几个想在[ROOT.GetCountry.GetName]寻求命运的自由民。\n\n很明显，纳萨摩尼亚人对我们的慷慨礼物非常满意——他们知道，与他们相比，我们可用的资源很少，而我们愿意几乎掏空国库的事实也没有让他们失望。"
 me_fezzani_117_title:0 "纳萨摩尼亚的宗主们"
 me_fezzani_118.a:0 "我咬住舌头，以免我说的话会给[ROOT.GetCountry.GetName]带来麻烦"
 me_fezzani_118_desc:0 "#E 纳萨摩尼亚人#!给我们送来了几个病怏怏的奴隶，几乎不适合工作，此外还有一封毫不留情的责备信。\n\n“虽然我们把你们视为负担，但我们明白希腊人对你们的领土有企图，所以我们觉得有义务帮助你们，以便帮助我们自己。\n\n要知道你的位置，狗，否则我们会扯断你的链条。”"
 me_fezzani_118_title:0 "纳萨摩尼亚的宗主们"
 me_fezzani_119.a:0 "让我们开出一个他们无法拒绝的条件。"
 me_fezzani_119.b:0 "让我们为该岛提供一个适度的金额。"
 me_fezzani_119.c:0 "也许我们可以提供黄金和士兵。"
 me_fezzani_119.d:0 "实际上，告诉船只继续航行"
 me_fezzani_119_desc:0 "来自舰队的消息!在航行了几周后，我们的船在[GetProvince('(int32)1471').GetName]岛停靠补给。我们与当地人进行了愉快的交流，然后一件件事情接踵而来，有人询问我们是否可以直接购买这个小岛。虽然这个问题的大胆性引起了一些惊讶的笑声，但并没有立即拒绝，这使我们相信我们可能有机会。"
 me_fezzani_119_title:0 "地中海探险"
 me_fezzani_11_desc:0 "大部落#E 马凯#!幻想自己是这个区域的自然统治者，并抵制我们在这些地区建立自己的努力。我们的边界已经很紧张，已经发生了一些小规模的冲突，许多人认为我们两个国家之间的战争是不可避免的。"
 me_fezzani_11_title:0 "牧羊人"
 me_fezzani_12.a:0 "与我们这样的民族相称的是"
 me_fezzani_120.a:0 "我想知道我们的连环好运是否会继续？这很容易..."
 me_fezzani_120_desc:0 "今天早上，出售[GetProvince('(int32)1471').GetName]的契约到达[GetProvince('(int32)3333').GetName]，上面有所有负责执行这种决定的地方官的签名。虽然我们付出了高昂的代价，但我们首都的每个人都欣喜若狂--我们的第一个海外贸易站不再是一个梦想，而是一个现实!"
 me_fezzani_120_title:0 "地中海探险"
 me_fezzani_121.a:0 "提供一大笔钱"
 me_fezzani_121.b:0 "提供一笔适度的资金"
 me_fezzani_121.c:0 "除黄金外，还可获得一些士兵"
 me_fezzani_121.d:0 "算了吧......其实我们很好。"
 me_fezzani_121.d.tt:0 "这将有效地结束该事件链。"
 me_fezzani_121_desc:0 "我们的海军已经到达#E 伯罗奔尼撒半岛#!的顶端，到达了一个当地人称为[GetProvince('(int32)471').GetName]的岛屿。虽然[GetProvince('(int32)3333').GetName]有些人对与好战的希腊人纠缠不清感到犹豫，他们不断为控制他们的岩石半岛而互相争斗，但其他人要求我们提供一个公平的价格，看看我们是否能为自己确保这个位置。"
 me_fezzani_121_title:0 "地中海探险队"
 me_fezzani_122.a:0 "我们在这里只是为了赚钱，而不是发动战争......我们会好的。"
 me_fezzani_122_desc:0 "资金已交易，且[ROOT.GetCountry.GetRuler.GetName]的意愿已得到执行；又一座岛屿成为了[ROOT.GetCountry.GetName]最新的海外领地，并且已经建立了一个[ROOT.GetCountry.GetAdjective]的贸易点。\n\n我们的军事顾问希望我们能置身于希腊本土复杂的政治局势之外；我们会向所有想从我们这里购买东西的人出售商品，不想在该地区树敌。"
 me_fezzani_122_title:0 "地中海探险队"
 me_fezzani_123.a:0 "我们最好做好准备，因为不会太久了。"
 me_fezzani_123_desc:0 "上周，来自[ROOT.GetCountry.GetCapital.GetName]的外交官前往#E 马凯#!的首都，带着一封据说是#E 纳萨摩尼亚人#!写的信。\n\n在这封完全由[ROOT.GetCountry.GetRuler.GetName]的代理人编造的信中，命令我们的人攻击并杀死任何越过边境的人。作为对我们有希望破坏贸易和恐吓他们的公民的回报，我们将在未来得到土地。\n\n据说，这封信在收到时，几乎导致马凯的领导人在当天晚上就宣战了。"
 me_fezzani_123_title:0 "伪装的战争"
 me_fezzani_124.a:0 "派遣特使向我们的纳萨摩尼亚宗主请求帮助!"
 me_fezzani_124.b:0 "告知纳萨摩尼亚人这种背叛行为！"
 me_fezzani_124.c:0 "也许加拉曼特人会帮忙，但要付出代价......。"
 me_fezzani_124_desc:0 "[ROOT.GetCountry.GetRuler.GetName]策划的外交事件已经发生了几个星期，但无论是#E 马凯#! 还是#E 纳萨摩尼亚#!都没有对感知到的轻视采取任何行动——就好像没有人愿意成为第一个采取行动的人。\n\n越来越不耐烦，并且认为[ROOT.GetCountry.GetRuler.GetHerHis]在创造诡计中的作用已经被发现，[ROOT.GetCountry.GetRuler.GetFirstName]已经加倍欺骗，知道没有回头路可走。\n\n“把我们的部队送过边界，但是给纳萨摩尼亚发一个信息，告诉他们我们正在被攻击。”"
 me_fezzani_124_title:0 "伪装的战争"
 me_fezzani_125.a:0 "死亡与荣耀!"
 me_fezzani_125_desc:0 "我们的部队刚刚开始行军，[ROOT.GetCountry.GetRuler.GetName]就收到了来自#E 纳萨摩尼亚人#! 的消息--\"不要害怕，[ROOT.GetCountry.GetName]的儿子，因为你不会单独作战--我们的军队向#E 马凯#!移动。我们将一起征服！'"
 me_fezzani_125_title:0 "伪装的战争"
 me_fezzani_126.a:0 "我们不能相信任何人，尤其是我们以前的主人"
 me_fezzani_126_desc:0 "纳萨摩尼亚人已经同意和我们一起骑马作战，虽然我们很感激，因为我们自己的力量将在未来的战斗中得到增强，但我们必须提醒自己，纳萨摩尼亚人是不可信任的——他们现在可能因为我们的利益相似而采取行动，但我们不能开始把他们当成朋友。"
 me_fezzani_126_title:0 "伪装的战争"
 me_fezzani_127.a:0 "如果你期待每个人都有背叛行为，那么你就永远不会感到惊讶"
 me_fezzani_127_desc:0 "虽然我们不相信卡拉曼特人的最终意图，但我们不能否认，我们很感激在未来的战斗中能得到他们的帮助--我们只是要在他们身边小心行事。"
 me_fezzani_127_title:0 "伪装的战争"
 me_fezzani_128.a:0 "我们不再是附庸了"
 me_fezzani_128.b:0 "我们将向我们以前的宗主宣布"
 me_fezzani_128.c:0 "我们将统一我们以前宗主的土地"
 me_fezzani_128_desc:0 "我们所采取的措施在不久前还是不可理解的，然而命运与我们同在——似乎我们的命运就是夺取我们以前的主人的土地，并将它们永久地加入我们自己的财产。"
 me_fezzani_128_title:0 "纳萨摩尼亚的土地"
 me_fezzani_129.a:0 "他们缺乏准备将是他们的最终厄运。"
 me_fezzani_129_desc:0 "从战场上传来了可怕的消息，哦，[ROOT.GetCountry.GetRuler.GetName]！似乎那些愚蠢的#E 纳萨摩尼亚人#!没有料到会和我们发生冲突，而我们的突然袭击让他们措手不及。这对我们意味着什么？他们的军队完全丧失了士气，许多人担心他们的死亡时刻即将来临。"
 me_fezzani_129_title:0 "纳萨摩尼亚的土地"
 me_fezzani_12_desc:0 "虽然这需要花费巨大的政治资本，但所有人都同意，建立主体国家的努力将是非常值得的；这反映了我们日益增长的力量和威望。由于在幕后所做的艰苦工作，我们的主体国家一直处于战争状态，他们的军队正在钻研并准备参加他们的[ROOT.GetCountry.GetAdjective]霸主派来的任何冲突。"
 me_fezzani_12_title:0 "加拉曼特人的附庸"
 me_fezzani_13.a:0 "如果他们一直在关注我们，那么他们就会屈服。"
 me_fezzani_13.a.tt:0 "一个事件链将开始决定如何处理#G 帕萨尼亚#!。"
 me_fezzani_13.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_130.a:0 "将更多的贸易转移到首都"
 me_fezzani_130.b:0 "将更多的贸易转移到前哨基地"
 me_fezzani_130.c:0 "这是一个令人头痛的问题......我们应该给予他们自主权。"
 me_fezzani_130.c.tt:0 "我们将把这些领土作为藩属释放。"
 me_fezzani_130_desc:0 "最后，我们收到了被派去调查我们的贸易岗位的小组的最后报告，好消息是我们有几个选择。当然，坏消息是，会有前期费用。正如老话所说，赚钱需要钱，所以我们应该已经预料到这个结果。"
 me_fezzani_130_title:0 "贸易前哨站"
 me_fezzani_13_desc:0 "我们已经决定派遣特使前往#E 帕萨尼亚#!的土地，与我们北部的部落建立联系。由于他们距离遥远，除非我们有共同的边界，否则我们直接征服他们可能会有问题，所以有希望他们会和平地服从。"
 me_fezzani_13_title:0 "帕萨尼亚"
 me_fezzani_14.a:0 "无论怎样，我们都将拥有那片领土!"
 me_fezzani_14.a.tt:0 "我们将获得对#G 普绪利亚#!拥有的每一个省的宣称。"
 me_fezzani_14.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_14_desc:0 "多年来，我们一直羡慕地看着#E 普绪利亚#! 的邻居们在非洲北部海岸建设港口城市并享受美丽的生活，梦想着有一天我们会强大到可以为自己夺取他们的港口和城镇。想象一下，当[ROOT.GetCountry.GetRuler.GetName]宣布我们对他们土地的宣称已经完成时，[ROOT.GetCountry.GetRuler.GetSheHe]会感到多么满意。"
 me_fezzani_14_title:0 "普绪利亚"
 me_fezzani_15.a:0 "我们需要劳动力，所以要把自由人和奴隶送到[GetProvince('(int32)8128').GetName]。"
 me_fezzani_15_desc:0 "现在是我们化剑为犁的时候了；让我们把我们的黄金送进[GetProvince('(int32)8128').GetName]城，而不是送进我们的士兵，因为如果我们想从这个最优秀的地方抹去我们最近战争的伤痕，我们还有很多工作要做。"
 me_fezzani_15_title:0 "一个东方的首都"
 me_fezzani_16.a:0 "沙漠为那些准备接受它的人提供赏赐"
 me_fezzani_16_desc:0 "在曾经被#E 帕萨尼亚#!声称的沙漠中，我们已经派出侦察员去勘察土地，以便为[ROOT.GetCountry.GetRuler.GetName]准备报告。我们的人声称那里有丰富的自然资源，包括被前任统治者愚蠢地忽视的大量石头和基本金属矿藏。\n\n[ROOT.GetCountry.GetRuler.GetHerHis]不希望重蹈前任的覆辙，[ROOT.GetCountry.GetRuler.GetFirstName]已经命令在任何可以支持矿藏的地区建造矿场。"
 me_fezzani_16_title:0 "帕萨尼亚的矿场"
 me_fezzani_17.a:0 "众神奖励我们的信仰--他们与我们同在"
 me_fezzani_17_desc:0 "你会很高兴地知道，#E 马凯#!的土地是很好的，如果我们选择建造，能够支持牧群和农场。我们不仅可以预见成熟的谷物田，而且地上还含有金银等贵重金属--我们将这些省份据为己有，是得到了上天的巨大祝福。"
 me_fezzani_17_title:0 "马凯之乡"
 me_fezzani_18.a:0 "我们将很好地利用普绪利亚人为我们建造的东西"
 me_fezzani_18_desc:0 "终于，我们为自己夺取了#E Psyllia#! 的港口，我们自豪地看着[ROOT.GetCountry.GetAdjective]的船只填满了曾经属于我们敌人的港口。\n\n虽然地中海的水域对我们来说是陌生的，[ROOT.GetCountry.GetRuler.GetName]已经命令我们接受这种环境的改变，并开始学习如何航行。值得庆幸的是，普绪利亚人曾经使用过的贸易路线为当地人所熟知，他们承诺在我们的监督下恢复业务。在适当的时候，甚至没有人会注意到我们已经将这片海岸线据为己有。"
 me_fezzani_18_title:0 "普绪利亚的港口"
 me_fezzani_19.a:0 "如果现状有任何变化，请通知我"
 me_fezzani_19.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_19_desc:0 "我们认为你应该知道，我们已经向[GetProvince('(int32)8130').GetName]和[GetProvince('(int32)8134').GetName]省派遣了定居者。到目前为止，事情进展顺利，但当地的希腊农民抵制我们对他们声称是 \"他们的土地 \"的侵占行为。我们预计不会有任何进一步的麻烦，但认为你应该知道，[ROOT.GetCountry.GetRuler.GetName]。"
 me_fezzani_19_title:0 "邂逅希腊人"
 me_fezzani_1_desc:0 "这一天终于到来了，它似乎如此遥远，以至于可能被误认为是一场梦；我们的君主[ROOT.GetCountry.GetRuler.GetName]登基，成为光荣的巴利阿里王国的新统治者。在经历了多年的部落联盟之后，我们决定用王冠奖励对我们目前的状况负有最大责任的[ROOT.GetCountry.GetRuler.GetFirstName]。我们将不再被行政长官和长老会所统治，但我们终于有了一个真正的君主来领导我们。\n\n对于加冕仪式我们不遗余力，因为最好的美酒和珍馐都是从国外进口的，增充了我们人民的传统菜肴。在银和象牙制成的轿子上，[ROOT.GetCountry.GetRuler.GetFirstName]在[ROOT.GetCountry.GetCapital.GetName]的街道上游行，向希望一睹皇家游行风采的聚集人群赠送金币礼物。宴会和庆祝活动将持续到晚上，甚至可能持续到凌晨。这是一个值得我们的同胞永远记住的日子！"
 me_fezzani_1_title:0 "费赞的王冠"
 me_fezzani_2.a:0 "旅程的第一步从这里开始"
 me_fezzani_20.a:0 "费赞万岁，[ROOT.GetCountry.GetRuler.GetName]万岁!"
 me_fezzani_20.b:0 "费赞万岁，[ROOT.GetCountry.GetRuler.GetName]万岁!"
 me_fezzani_201.a:0 "在这一天真正到来之前，我不会休息。"
 me_fezzani_201_desc:0 "尽管那些在地中海沿岸建立帝国的强大统帅可能对我们的部落成员不屑一顾，但我们怀揣着雄心壮志，很快我们的名字就会响遍四方。\n\n[ROOT.GetCountry.GetRuler.GetName]从来不是喜欢哗众取宠之人，他大胆宣称，[ROOT.GetCountry.GetRuler.GetSheHe]家族将不会停歇，直至建立一个#Y 纳萨摩尼亚王国#!，一个从[GetProvince('(int32)8128').GetName]的城墙统治着广袤领土的王国。"
 me_fezzani_201_title:0 "纳萨摩尼亚王国"
 me_fezzani_202.a:0 "让我们把他们作为一个藩属"
 me_fezzani_202.b:0 "我们将维持现状"
 me_fezzani_202.b.tt:0 "#H 普绪利亚#! 将保持朝贡国地位。"
 me_fezzani_202_desc:0 "长期以来，我们北方的普绪利亚人一直享有一个准独立的国家，从访问海岸的商人那里分得大量的财富，同时向我们支付微薄的保护费。然而，有人建议我们改变这种情况，现在[ROOT.GetCountry.GetRuler.GetName]必须做出决定。"
 me_fezzani_202_title:0 "普绪利亚的附庸"
 me_fezzani_203.a:0 "我们将粉碎马基利亚并利用他们的土地作为中转站"
 me_fezzani_203_desc:0 "#E 马基利亚#!的可悲部落除了作为我们、#E 加拉曼特人#!和西边的#E 马凯人#!之间的一个缓冲国之外，没有任何作用。现在我们已经准备好对他们的土地提出宣称，我们将把弱小的马基利亚人赶出他们的家园，并把我们的军队派往真正的战利品——位于加拉曼特和马凯军队霸权之下的城市和定居点。"
 me_fezzani_203_title:0 "马基利亚人"
 me_fezzani_204.a:0 "多么美味的消息啊!我知道我早餐想吃什么了"
 me_fezzani_204_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们认为你会很高兴听到，除了为我们自己确保#E 马基利亚#!的战略省份之外，我们还确定这些土地上生长着比我们所见过的更多的枣子。我们不仅会有比任何人都希望吃到的更多的枣子，而且毫无疑问，我们将能够定期出售我们的盈余——为[ROOT.GetCountry.GetAdjective]国库的另一个收入来源。"
 me_fezzani_204_title:0 "马基利亚椰枣"
 me_fezzani_205.a:0 "愿众神在未来的日子里与我们同在"
 me_fezzani_205_desc:0 "现在，我们与#E 加拉曼特#! 和#E 马凯#!部落接壤，该区域的紧张局势达到了前所未有的高度。那些有经济能力的人正在放弃有争议的边界附近的土地，因为当地人正确地推测，战争很快会给这些地区带来血与火。没有人愿意成为第一个开始敌对行动的人，但毫无疑问，争夺霸权的战斗无法避免太久。\n\n在天空中，秃鹰正在盘旋，跟随军队向前线进发……"
 me_fezzani_205_title:0 "敌对部落"
 me_fezzani_206.a:0 "加拉曼特人确实是一个幸运的民族......。"
 me_fezzani_206_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]正在阅读一叠送到[GetProvince('(int32)8128').GetName]的信件时，[ROOT.GetCountry.GetRuler.GetSheHe]注意到一份来自曾经属于我们的敌人--Garamantes的农田的报告，忍不住笑了。虽然他们高尚地战斗，但他们的力量不足以拯救他们，我们把他们从他们的定居点和城市赶了出来。值得庆幸的是，我们在他们的领地深处发现了一些优质的农田，并不失时机地在肥沃的黑土地上播种大麦和谷物。虽然这些地方很少下雨，但土地由深层的含水层维持，确保农场全年都能生产。"
 me_fezzani_206_title:0 "加拉曼蒂克农庄"
 me_fezzani_207.a:0 "把你的背放进去!在日落之前，我们还有很多事情要做!"
 me_fezzani_207_desc:0 "尽管奴隶们在[GetProvince('(int32)8128').GetName]周围挖掘的沟渠里怨声载道，但[ROOT.GetCountry.GetRuler.GetName]却对他们的抱怨置若罔闻，反而选择使[ROOT.GetCountry.GetRuler.GetHerHis]注意力集中在向[ROOT.GetCountry.GetRuler.GetHerHim]展示的建筑设计上。\n\n“那这些呢？”[ROOT.GetCountry.GetRuler.GetFirstName]指着莎草纸上用炭笔画的几条黑线问道。\n\n“啊，对了，[ROOT.GetCountry.GetRulerTitle]，这里就是将要修建主干道的地方，这条大道将被命名为‘#E [ROOT.GetCountry.GetRuler.GetPraenomen]#!’。我们希望您不会反对这个冠名，而是将其视为一种荣誉。”\n\n“反对以我的名字命名一条路？我很喜欢这个主意，迫不及待想看到一切完工！'.转向奴隶们，[ROOT.GetCountry.GetRuler.GetFirstName]拍着[ROOT.GetCountry.GetRuler.GetHerHis]的手并大喊。"
 me_fezzani_207_title:0 "纳萨摩尼亚的首都"
 me_fezzani_208.a:0 "我们不会拒绝我们的人所想要的任何东西和所有东西"
 me_fezzani_208_desc:0 "我们已经收到确认，我们对#E 帕萨尼亚#! 土地的宣称已经完成，而我们的士兵对即将到来的战斗感到绝望。我们认为他们是一个弱小的敌人，会很快倒在我们经验丰富的部队面前，我们的军队正贪婪地准备着即将到来的掠夺和破坏。"
 me_fezzani_208_title:0 "帕萨尼亚"
 me_fezzani_209.a:0 "我们的敌人如何能抵御如此可怕的攻击？"
 me_fezzani_209_desc:0 "[ROOT.GetCountry.GetRuler.GetName]正站在[GetProvince('(int32)8128').GetName]的城墙上，看着[ROOT.GetCountry.GetName]集结的骑兵在首都外的沙漠沙地上训练。即使在这样的距离，雷鸣般的马蹄声也充满了空气，尽管正午时分的高温让[ROOT.GetCountry.GetRuler.GetFirstName]的手臂感到寒冷。\我们的骑兵一直在不停地训练，骑着在我们的马场上长大的壮丽的骏马，我们的骑兵正在练习先进的战术，这无疑会让我们的敌人措手不及。信号发出后，又一次冲锋发生了，当马匹在沙丘上撕扯时，空中出现了大块的土块。"
 me_fezzani_209_title:0 "费赞骑兵队"
 me_fezzani_20_desc:0 "一天早晨，[ROOT.GetCountry.GetRuler.GetName]正兴致勃勃的与[ROOT.GetCountry.GetRuler.GetHerHis]的顾问们坐在一起，审阅着改革[ROOT.GetCountry.GetName]最后一项计划，这时，一首诗浮现在脑海中。每个在沙漠中长大的孩子都会学会这些歌词，但[ROOT.GetCountry.GetRuler.GetFirstName]却为这首很久以前就为迎接这一刻而创作的歌曲赋予了真正的意义。\n\n“#E 费赞#!，从龟裂的荒漠土壤中长出的一朵玫瑰/我望着你走,尽管你没有脚可以站立/追求梦想教会了我们如何呼吸/尽管无人问津，沙漠却孕育出一朵盛开的玫瑰。”\n\n这场即兴演讲赢得了礼节性的掌声，许多人都在内心表示赞同。如此令人印象深刻的爆发，正是当地一些人给[ROOT.GetCountry.GetRuler.GetFirstName]起了一个古老头衔的原因，#E 'Ar'uz-Ona'#!，在一种几乎被遗忘的古老[ROOT.GetCountry.GetAdjective]方言中，它的意思是“大诗人”。"
 me_fezzani_20_title:0 "沙漠中的玫瑰"
 me_fezzani_21.a:0 "让我们希望它是第一选择"
 me_fezzani_21_desc:0 "好了，我们对#E 马基利亚人#!的最后通牒已经发出，现在已经没有退路了。\n\n很快，我们要么有一个新的附庸，要么有一场新的战争。"
 me_fezzani_21_title:0 "马基利亚人"
 me_fezzani_22.a:0 "可能看起来不是这样，但这是一个伟大的胜利"
 me_fezzani_22_desc:0 "你会很高兴地知道，#E 马基利亚#!的统治者是讲道理的人，并同意成为我们的附庸。他们理解我们共同创造财富的可能性，并希望看到我们都能成功。"
 me_fezzani_22_title:0 "我们的附庸，马基利亚"
 me_fezzani_23.a:0 "诅咒!那么我们将给他们带来他们所寻找的战斗。"
 me_fezzani_23_desc:0 "我们威胁#E 马基利亚#!的努力适得其反，他们似乎正在为未来的战斗提高他们的军队和武装所有能武装的人。"
 me_fezzani_23_title:0 "马基利亚人"
 me_fezzani_24.a:0 "我们将与他们战斗，并摧毁他们!"
 me_fezzani_24_desc:0 "#E 马基利亚#!的军队正在进入我们的土地，将我们的人民置于刀下！战争来了!"
 me_fezzani_24_title:0 "马基利亚人宣战"
 me_fezzani_25.a:0 "应该简单到让他们能够理解"
 me_fezzani_25.a.tt:0 "一个特使将被派往#G 纳萨摩尼亚人#!，提出附庸化或战争的最后通牒。"
 me_fezzani_25.b:0 "在派遣特使之前，我们必须建立一个边界"
 me_fezzani_25.b.tt:0 "将向#G 纳萨摩尼亚#!派出特使，在夺取#G 马基利亚#!的土地，与他们建立边界后，提出附庸化或战争的最后通牒。"
 me_fezzani_25.c:0 "仔细想想，什么都不要做"
 me_fezzani_25_desc:0 "经过深思熟虑，我们决定向纳萨摩尼亚人发出最后通牒，就像我们向马基利亚发出的最后通牒一样；要么加入我们成为附庸，要么被征服。"
 me_fezzani_25_title:0 "纳萨摩尼亚人"
 me_fezzani_26.a:0 "我们从未怀疑过这个结果"
 me_fezzani_26_desc:0 "#E 纳萨摩尼亚人#! 已经权衡了他们的选择，并明智地决定服从，而不会在我们的掠夺大军面前失去他们的一切。\n\n他们明白，成为我们的藩属将确保他们的孩子在父亲的陪伴下长大……这个结果，诸神保佑，是我们所期望的最好结果。"
 me_fezzani_26_title:0 "纳萨摩尼亚的附庸"
 me_fezzani_27.a:0 "我们将看看他们是否能言行一致。"
 me_fezzani_27.a.tt:0 "我们有可能会被纳萨摩尼亚宣战。"
 me_fezzani_27_desc:0 "愚蠢的#E 纳萨摩尼亚人#! 已经驱逐了我们的外交官，威胁要把他们的耳朵打烂，因为他们传递了这样一个无礼的信息。\n\n他们的将军们甚至向[ROOT.GetCountry.GetCapital.GetName]发出了自己的信息，大胆地威胁我们的边境驻军，说他们最想做的就是征服我们的腹地，让我们跑回沙漠中。"
 me_fezzani_27_title:0 "纳萨摩尼亚人"
 me_fezzani_28.a:0 "我们已经为他们做好了准备!为武器而战!"
 me_fezzani_28_desc:0 "纳萨摩尼亚人愚蠢地对我们宣战，认为我们的军队会在他们的军队面前倒下。\n\n我们将给这些狗带来一个他们永远不会忘记的教训！他们的士兵的骨头将在未来的几年里在沙漠中漂白！"
 me_fezzani_28_title:0 "纳萨摩尼亚战争"
 me_fezzani_29.a:0 "我们将给予他们赔偿"
 me_fezzani_29.a.tt:0 "这将结束该事件链。"
 me_fezzani_29.b:0 "这是一种侮辱!"
 me_fezzani_29.b.tt:0 "这将进一步推动事件链的发展。"
 me_fezzani_29_desc:0 "#E 马凯#!的人民给我们带来了不可否认的证据，证明我们热心的[ROOT.GetCountry.GetAdjective]士兵越过边境进入他们的领土，袭击和突击只是因为他们想这样做——似乎最近的边境小冲突是由我们引起的，现在他们要求官方赔偿。\n\n我们该怎么办？他们索要的金额简直令人发指，这种行为本身就是一种冒犯，但我们显然在这件事上做错了，所有人都盯着我们，期待我们来纠正这个错误。"
 me_fezzani_29_title:0 "与马凯的边界摩擦"
 me_fezzani_2_desc:0 "我们中最聪明的人意识到，分裂费赞部落的不和只为我们的敌人服务，如果我们能在一个部落、一个统治者的权威下团结起来，对我们的人民会更好。我们渴望为[ROOT.GetCountry.GetName]的人民提供更好的生活方式，并相信它在我们掌握之中。"
 me_fezzani_2_title:0 "费赞的人民"
 me_fezzani_3.a:0 "[ROOT.GetCountry.GetName]需要你，儿子 - 来为她战斗吧"
 me_fezzani_30.a:0 "多么不幸的发展..."
 me_fezzani_30.a.tt:0 "在未来的日子里，马凯有机会以#Y 帝国征服#! 战争目标进行申报......"
 me_fezzani_301.a:0 "当然，在我们的领导下"
 me_fezzani_301_desc:0 "我们拒绝让那些强大的部落，如#E Garamantes#!，不假思索地吞噬我们--绝对不行。我们将尽我们所能，让马凯人所有分散的部落意识到我们所处的危险，希望我们所分享的古老的亲属关系足以说服我们的兄弟们联合起来。"
 me_fezzani_301_title:0 "马凯亚人"
 me_fezzani_302.a:0 "当我们一起工作时，我们有很多收获"
 me_fezzani_302_desc:0 "是否有明智的统治者控制着北方#E 马凯#!部落的权力？他们会看到#E 加拉曼特#!和#E 纳萨摩尼亚#!如果他们联合起来进行攻击，就能结束我们的文化吗？难道他们没有看到我们的部队承诺共同作战，以便将这一危险推向沙漠山丘深处的好处？"
 me_fezzani_302_title:0 "我们的马凯恩兄弟"
 me_fezzani_303.a:0 "这是一个值得永远记住的日子"
 me_fezzani_303_desc:0 "虽然[GetProvince('(int32)8142').GetName]这个位于沙漠边缘的美丽绿洲的位置对[ROOT.GetCountry.GetAdjective]人来说一直很重要，但我们只是在最近才采取措施，将这个受欢迎的贸易站改造成类似于真正的城市，用石头建造永久性建筑，并由我们的士兵保护其墙壁。"
 me_fezzani_303_title:0 "卑微的开端"
 me_fezzani_304.a:0 "这些预防措施将保护[ROOT.GetCountry.GetName]的中心地带。"
 me_fezzani_304_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在保护[ROOT.GetCountry.GetName]的边界时，有一个简单的哲学；即使我们被四面八方的敌人包围，我们仍然会取得胜利。你问怎么做？通过确保我们的驻军中充满了时刻保持警觉的人，期待着随时都有危险。"
 me_fezzani_304_title:0 "被敌对的部落所包围"
 me_fezzani_306.a:0 "让我们希望他们选择理智的态度"
 me_fezzani_306_desc:0 "现在我们控制了以前敌对部落#E 纳萨摩尼亚人#!和#E 加拉曼特人#!的首都，逻辑上讲，我们必须向前推进，征服唯一剩下的可能对我们构成威胁的独立部落——#E 马凯#!。我们将向他们发出最后通牒，要求他们服从，如果他们不服从，那么我们就必须准备开战——将召开会议讨论这一敏感问题。"
 me_fezzani_306_title:0 "马凯亚人的附庸"
 me_fezzani_307.a:0 "我们将他们的土地据为己有"
 me_fezzani_307.b:0 "我们将需要从我们的对象那里夺取土地来做这件事。"
 me_fezzani_307_desc:0 "最近，一个新的现实呈现在我们面前，一个在短短几年前无法想象的现实，但似乎是我们人民不可避免的命运；地中海沿岸的城市和港口，在那里我们将接触到来自我们甚至没有听说过的国家的人民和思想。我们所要做的就是找到合适的地方，让我们的梦想变成现实。"
 me_fezzani_307_title:0 "海岸"
 me_fezzani_308.a:0 "我们将粉碎帕萨尼亚的征召兵"
 me_fezzani_308_desc:0 "虽然我们的目光仍然集中在我们周围更大的奖品上，但我们不会忽视那些像跳蚤一样粘在我们边境上的麻烦制造者--#E 帕萨尼亚#!，我们盯着你，不会允许你在沙漠中徘徊太久。"
 me_fezzani_308_title:0 "海岸"
 me_fezzani_309.a:0 "给他们送去一小笔钱"
 me_fezzani_309.b:0 "不要给他们发送任何东西！不要给他们发送任何东西！"
 me_fezzani_309_desc:0 "我们要不要送一点钱来帮助马克凯恩的外交官听取我们的建议？我们不想问，但你现在已经知道这个游戏了，[ROOT.GetCountry.GetRuler.GetName]，你知道这种事情是这样的，很不幸。"
 me_fezzani_309_title:0 "我们的马凯恩兄弟"
 me_fezzani_30_desc:0 "我们的侦察员向我们报告说，有人看到#E 马凯#!的部队在边界的另一边集结——我们应该提高警惕，因为任何事情都可能发生。"
 me_fezzani_30_title:0 "边境摩擦升级"
 me_fezzani_31.a:0 "对我有点信心..."
 me_fezzani_310.a:0 "是的，是的，我们将看到 - 但这是巨大的"
 me_fezzani_310_desc:0 "极好的消息!我们在#E 马凯#!的兄弟已经同意与我们成为盟友，但他们的外交官有一个迫切的担忧，他们反复提到。他们恳求我们等待，直到我们的敌人被分散注意力，然后再召集他们的儿子参加我们的战争，要求我们在虚弱的时刻出击，而不是把我们共同的力量投向一个有准备的敌人。"
 me_fezzani_310_title:0 "我们的马凯恩兄弟"
 me_fezzani_311.a:0 "他们必须成为我们的主体--让我们的外交官做他们的工作"
 me_fezzani_311.b:0 "我们将暂时保持现状......"
 me_fezzani_311.b.tt:0 "#Y 这将结束事件链。#!。"
 me_fezzani_311.c:0 "我们将征服他们!"
 me_fezzani_311.c.tt:0 "我们将在#Y 马凯#!拥有的每一个省份获得宣称。"
 me_fezzani_311_desc:0 "我们的战争委员会终于在[ROOT.GetCountry.GetCapital.GetName]开会，辩论可以开始了。短短几个小时后，每个人都达成了共识；我们只有少数几个选择，由[ROOT.GetCountry.GetRuler.GetName]来做决定。"
 me_fezzani_311_title:0 "马凯亚人的附庸"
 me_fezzani_312.a:0 "他们的选择是明智的"
 me_fezzani_312_desc:0 "我们很高兴地通知你，#E 马凯#!的统治者已经意识到不可避免的事情，并同意成为我们的藩属。我们将以向神灵献祭的方式来庆祝这一时刻，因为由于他们的投降，许多人的生命得到了挽救。"
 me_fezzani_312_title:0 "马凯亚人的附庸"
 me_fezzani_313.a:0 "我们已经为我们的国家做了一件巨大的事情"
 me_fezzani_313.b:0 "我们最终将征服他们的土地"
 me_fezzani_313.b.tt:0 "我们将获得对#Y 马凯#!的每一个拥有省份的宣称。"
 me_fezzani_313_desc:0 "即使在几个星期后，已经很清楚，我们在#E 马凯#!的附庸已经接受了他们作为我们藩属的新地位，其热忱应该让他们以前的政治精英们感到尴尬——他们绝对爱我们，爱[ROOT.GetCountry.GetRuler.GetName]，并为成为不断增长的[ROOT.GetCountry.GetAdjective]影响范围的一部分而感到兴奋。"
 me_fezzani_313_title:0 "马凯亚人的附庸"
 me_fezzani_314.a:0 "我占用这些土地只是因为我必须要"
 me_fezzani_314_desc:0 "当地人对[ROOT.GetCountry.GetRuler.GetName]公开夺取[ROOT.GetCountry.GetRuler.GetHerHis]臣民的领土的决定感到愤怒，被激怒到不得不派士兵去安抚这个地区--被[ROOT.GetCountry.GetName]派去在曾经属于现在的无主贵族的田地里工作的奴隶，更加剧了这种怨恨。"
 me_fezzani_314_title:0 "海岸"
 me_fezzani_31_desc:0 "毫不奇怪，#E 马凯#!的军队已向我们宣战——如今已到了非此即彼的关头，[ROOT.GetCountry.GetRuler.GetName]。正是你们的行动将我们带到这一步，而如今我们的整个未来都系于此刻。"
 me_fezzani_31_title:0 "边界摩擦"
 me_fezzani_32.a:0 "给他们提供一小笔黄金"
 me_fezzani_32.b:0 "为他们提供少量的人力以加强他们的力量"
 me_fezzani_32.c:0 "给他们提供一大笔黄金"
 me_fezzani_32.d:0 "除了战争，我们不会给他们任何东西!"
 me_fezzani_32.e:0 "算了吧--这是一个不明智的行动方案。"
 me_fezzani_32_desc:0 "我们对#E 帕萨尼亚#!的宣称是直截了当的，没有通常阻碍外交交流的华丽辞藻。\n\n在我们看来，情况相当简单；我们渴望他们的领土，并愿意支付他们所要求的任何代价以迫使他们屈服。我们的慷慨是众所周知的，现在[ROOT.GetCountry.GetRuler.GetName]必须决定我们提供什么礼物来说服他们。"
 me_fezzani_32_title:0 "帕萨尼亚人"
 me_fezzani_33.a:0 "我们将用红枣酒和烤肉来庆祝!"
 me_fezzani_33_desc:0 "来自#E 帕萨尼亚#!的好消息，o [ROOT.GetCountry.GetRuler.GetName]。看来他们的宫廷被我们送去的礼物迷住了，虽然有反对的声音，但他们已经被说服了，支持我们——看来我们有一个新的藩属。"
 me_fezzani_33_title:0 "帕萨尼亚人的附庸"
 me_fezzani_34.a:0 "让我们尽快搬到奥吉拉去吧"
 me_fezzani_34.b:0 "我们将永远不会放弃我们的祖国首都"
 me_fezzani_34.b.tt:0 "我们不会迁都。"
 me_fezzani_34_desc:0 "当我们胜利的[ROOT.GetCountry.GetAdjective]军团进入#E 纳萨摩尼亚的前首都#!时，这座雄伟的城市的壮观设计吸引了每个人的注意，有些人甚至惊叹[GetProvince('(int32)8128').GetName]可以和[GetProvince('(int32)8168').GetName]的美丽相媲美。\n\n一个奇怪的想法进入了[ROOT.GetCountry.GetRuler.GetName]的头脑；迁移首都是否对[ROOT.GetCountry.GetAdjective]的人有利？也许我们应该考虑搬到离水更近的地方，远离沙漠……毕竟我们的未来是在更广阔的世界。"
 me_fezzani_34_title:0 "一个东方的首都"
 me_fezzani_35.a:0 "如果你宣称我们的土地，那么我们将宣称你的土地！"
 me_fezzani_35_desc:0 "来自[GetProvince('(int32)3343').GetName]的消息--似乎一个反对我们的联盟正在形成，希望通过拒绝我们进入海洋来遏制我们在沙漠的发展。虽然我们嘲笑这些阻碍我们扩张的不明智的企图，但我们适当地承认了正在聚集的风暴，并将为任何发生的事情做准备。[ROOT.GetCountry.GetRuler.GetName]请注意这个地区，它是一个火药桶，随时都有可能着火。"
 me_fezzani_35_title:0 "邂逅希腊人"
 me_fezzani_36.a:0 "我们必须获得我们所能获得的所有财富"
 me_fezzani_36_desc:0 "尽管没有人愿意在残酷的沙漠天空下从事繁重的体力劳动，但#E 马凯#!矿山中发现的黄金却吸引了众多劳工和奴隶来到这片被烈日炙烤的土地，他们用铁锹敲击巨石的声音，形成了一种绵延数里的稳定节奏。\n\n得益于[ROOT.GetCountry.GetRuler.GetName]对该地区的大量投资，我们的工人将在未来几十年里继续在这里工作。"
 me_fezzani_36_title:0 "马凯恩黄金"
 me_fezzani_3_desc:0 "[ROOT.GetCountry.GetRuler.GetName]坚持在全国范围内开展征兵工作，在[ROOT.GetCountry.GetRuler.GetHerHis]力所能及的范围内，为[ROOT.GetCountry.GetCapital.GetName]带来愿意训练和加入我们的军队的机构。虽然[ROOT.GetCountry.GetRuler.GetFirstName]的意图很明显--很快，战争就会爆发，[ROOT.GetCountry.GetName]将需要所有可用的士兵，但似乎没有人介意冲突即将来临。如果不是因为[ROOT.GetCountry.GetRuler.GetFirstName]的个人魅力，那么也许这将是一个比它更大的问题。"
 me_fezzani_3_title:0 "加拉曼提斯王国"
 me_fezzani_4.a:0 "看看他们对我们有什么感觉也无妨。"
 me_fezzani_4.a.tt:0 "一个事件链将开始确定如何处理#G Machylia#!。"
 me_fezzani_4.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_401.a:0 "我们不是已经是朋友了吗？为什么不成为我们的对象呢？"
 me_fezzani_401_desc:0 "[ROOT.GetCountry.GetRuler.GetName]作出了一个大胆的决定，向#E 马基利亚人#!提出了一个希望他们不会拒绝的提议；与其等待#E 加拉曼特人#!或#E 纳萨摩尼亚人#!的军队在远处出现的那一天，为什么不把他们的力量加入我们呢？他们没有希望在我们任何一个人的攻击下存活下来，希望他们会依附于最像他们自己的部落。"
 me_fezzani_401_title:0 "马基利亚人"
 me_fezzani_402.a:0 "在他们占领一切之前，马凯是不会停止的！"
 me_fezzani_402_desc:0 "[ROOT.GetCountry.GetRuler.GetName]决定视察驻扎在[ROOT.GetCountry.GetCapital.GetName]的部队，因为#E Girgigi#! 省的建设举措已经完成。我们的军团为有机会在我们的[ROOT.GetCountry.GetRulerTitle]面前游行而兴奋，他们穿上了最漂亮的衣服，在[ROOT.GetCountry.GetAdjective]首都的宽阔大道上集合。消息很快就写好了，准备寄给间谍头子......"
 me_fezzani_402_title:0 "吉尔吉里的首都"
 me_fezzani_403.a:0 "这将是很容易的..."
 me_fezzani_403_desc:0 "居住在#E 帕萨尼亚#! 荒原上的部落是软弱的，没有朋友的，甚至没有能力从入侵的军队中保卫自己的家园。鉴于他们的自然状态似乎适合于奴役的生活，那么我们将为他们提供荣誉，一劳永逸地摧毁他们的幻觉。"
 me_fezzani_403_title:0 "帕萨尼亚"
 me_fezzani_404.a:0 "居达姆斯的公民是多么幸运啊"
 me_fezzani_404_desc:0 "当我们胜利的部队第一次进入[GetProvince('(int32)8233').GetName]的大门时，民众对我们的士兵感到致命的恐惧，想象着最坏的情况已经发生了。我们会不会摧毁他们辛辛苦苦取得的一切？当然，像我们这样强大的部队会是残酷和邪恶的主人。然而，外表是可以欺骗的，一旦当地人意识到[ROOT.GetCountry.GetAdjective]的驻军会比他们以前的主人更好地保护他们的利益，他们就会接受我们在他们中间的存在。人们成群结队地返回城市，每个人都同意忘记使我们走到一起的战争，而选择集中精力在我们一起的美好未来。"
 me_fezzani_404_title:0 "雉鸡之城"
 me_fezzani_405.a:0 "没有足够的空间容纳我们和他们...。"
 me_fezzani_405_desc:0 "因为我们花了大量的钱来建设与#E Psyllians#!相邻的土地，所以有人建议，尽管是开玩笑的，我们准备对他们的领土提出宣称，并将其与我们的领土结合起来。毕竟，我们不能让一个敌对的邻居羡慕地盯着我们的财产。"
 me_fezzani_405_title:0 "普绪利亚人"
 me_fezzani_406.a:0 "小心你所希望的，以免你失去这一切"
 me_fezzani_406_desc:0 "那些贪婪的#E 纳萨摩尼亚人#!，从不满足于诸神赐予他们的东西，现在显然将他们饥饿的目光投向了我们的领域，质疑我们是否有能力捍卫他们所觊觎的那些东西。\n\n[ROOT.GetCountry.GetRuler.GetName]从不等待另一只凉鞋掉落，他准备以暴制暴，并已将那些可能的入侵者的家园夺走。"
 me_fezzani_406_title:0 "纳萨摩尼亚的土地"
 me_fezzani_407.a:0 "愿战争和死亡之神赐予我们胜利!"
 me_fezzani_407_desc:0 "终于，许多人担心的时刻到了；强大的#E Garamantes#! 和[ROOT.GetCountry.GetAdjective]群狼之间的战争即将来临。这种规模的冲突将涉及该地区的每一个人；在生死攸关的问题上，不可能有任何的中立。即使是现在，我们的部队也在为与他们的宿敌进行最初的小规模冲突做准备......当一切都结束时，只有一个人站在那里！！"
 me_fezzani_407_title:0 "沙漠恶魔"
 me_fezzani_408.a:0 "我们从未怀疑过他们的贤明"
 me_fezzani_408_desc:0 "正如[ROOT.GetCountry.GetRuler.GetName]所预测的那样，#E 马基利亚人#!已经能够确定沙漠中的风向，并明智地决定在我们能够提供给他们的阴凉下寻求庇护，以避开阳光——很好！"
 me_fezzani_408_title:0 "马基利亚人"
 me_fezzani_409.a:0 "这可能是一段很长很长的友谊的开始"
 me_fezzani_409.b:0 "让我们希望“明智的”马基利亚人不会为他们的行为感到后悔！他们的行为是不可能的！"
 me_fezzani_409_desc:0 "外交官已经派出去了，回信的是我们流浪的大使--不管是好是坏，#E 马基利亚人#! 已经明确了他们的选择，现在我们在等待我们敌人的首都的反应。"
 me_fezzani_409_title:0 "马基利亚人"
 me_fezzani_4_desc:0 "诚然渴望#E 马基利亚的土地#!，但他们的军队与我们相比是如此的弱小和可怜，有人建议我们派遣特使而不是我们的军队。"
 me_fezzani_4_title:0 "马基利亚人"
 me_fezzani_5.a:0 "最后；一个值得居住的地方"
 me_fezzani_501.a:0 "从卑微的起点开始，一切皆有可能"
 me_fezzani_501_desc:0 "尽管我们是一个小部落，被更大、更有侵略性的敌人所包围，但一切都没有失去。正如[ROOT.GetCountry.GetRuler.GetName]经常喜欢说的那样，\"考虑一下野鸡--在我们的沙漠中飞翔的最美丽的鸟。尽管它是一种脆弱的生物，但它的雄伟性质吸引了所有目睹它的人。我们，也像野鸡一样。"
 me_fezzani_501_title:0 "雉鸡"
 me_fezzani_502.a:0 "有一天，我们的财富将超出我们最疯狂的梦想"
 me_fezzani_502_desc:0 "终于，在[ROOT.GetCountry.GetCapital.GetName]的建设工作已接近尾声，我们引以为傲的[ROOT.GetCountry.GetAdjective]工程师们热切地想要展示他们所有的辛勤劳动成果。\n\n[ROOT.GetCountry.GetRuler.GetName]，他们为建设新式的首都所付出的努力令人欣慰，我期待着未来我们的税收能多到如同沙漠中的沙粒一般数不胜数。"
 me_fezzani_502_title:0 "沙漠绿洲"
 me_fezzani_503.a:0 "飞吧，我的野鸡，消灭那些反对我们的人！\"！"
 me_fezzani_503_desc:0 "短短几年前似乎无法想象的事情现在已经成为现实；[ROOT.GetCountry.GetRuler.GetName]正在对我们的军队讲话，他们正在[ROOT.GetCountry.GetCapital.GetName]附近大规模集结，准备入侵#E 马凯#!。\n\n几周内，他们的边境地区将被我们的军队占领，然后我们将在战斗中遇到他们的人，把他们的血洒在沙漠的沙地上。"
 me_fezzani_503_title:0 "马卡伊人"
 me_fezzani_504.a:0 "立即派遣使节出去"
 me_fezzani_504_desc:0 "[ROOT.GetCountry.GetRuler.GetName]不是傻瓜，在评估了我们的军事准备后，非常担心我们北方的僭主#E 迦太基#!的攻击可能性。\n\n迦太基人更乐于捕食分裂的部落，一次一次地吞噬他们，所以希望我们的邻居已经注意到这种情况，并愿意将他们的力量加入我们，以防战争找到我们。"
 me_fezzani_504_title:0 "一个联盟网络"
 me_fezzani_505.a:0 "我想把这些港口留给自己......我们还有工作要做"
 me_fezzani_505_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已经非常清楚地表明，[ROOT.GetCountry.GetRuler.GetSheHe]渴望得到#E 普绪利亚#! 的港口，特别是造船厂--尽管我们的人民几个世纪以来一直被束缚在沙漠中，但事实证明，建造我们自己的舰队在地中海水域航行的承诺是一种诱惑，[ROOT.GetCountry.GetName]的人民很难抵制。"
 me_fezzani_505_title:0 "普绪利亚"
 me_fezzani_506.a:0 "我们将不留情面地对待他们!向前走！"
 me_fezzani_506_desc:0 "如果我们有希望建立一个新的王国，一个将所有吵闹的沙漠部落纳入[ROOT.GetCountry.GetAdjective]旗帜之下的王国，那么我们必须派人深入东部沙漠，在那里，我们失败的敌人的分散力量正准备进行最后的抵抗。"
 me_fezzani_506_title:0 "东部费赞部落"
 me_fezzani_507.a:0 "我们会想念你的，老对手......。"
 me_fezzani_507_desc:0 "虽然没有人能够预测到这一点，但[ROOT.GetCountry.GetRuler.GetName]私下里对#E 加拉曼蒂克人#!，我们古老而致命的敌人，已经被彻底摧毁的消息感到惋惜。当被问及时，[ROOT.GetCountry.GetRuler.GetFirstName]踌躇满志地回忆起一段时光，当时[ROOT.GetCountry.GetName]的人们对加拉曼蒂克部落非常了解，尽管我们并不总是看到他们的眼睛，但我们认为他们是血缘关系，是我们生活方式的分享者。但加拉曼蒂克的最后一个部落已经被永远摧毁，未来仍然不可知。"
 me_fezzani_507_title:0 "最后的部落"
 me_fezzani_508.a:0 "当我们一起工作时，我们会更强大"
 me_fezzani_508_desc:0 "来自北方的好消息!我们的邻居，#E Gyzantians#!，已经响应我们的号召，承诺帮助我们抵御迦太基的侵略。似乎他们和我们一样关心布匿的扩张，并希望确保我们能阻止#E Qart Hadasht#!的部队。"
 me_fezzani_508_title:0 "我们的联盟网络"
 me_fezzani_509.a:0 "这是非常意外的..."
 me_fezzani_509_desc:0 "你可能不相信，[ROOT.GetCountry.GetRuler.GetName]，但我们的外交官向我们保证，他们说的每一个字都是真的。#E 迦太基人#! 一听说我们正在积极建立一个反对他们的联盟，就向我们保证他们的良好意图。他们声称他们对在#E 伊比利亚#! 的扩张更感兴趣，而不是我们的沙漠，为了表示他们的善意，他们同意成为我们的盟友!他们希望这能缓解我们对布匿人入侵的恐惧。"
 me_fezzani_509_title:0 "我们的联盟网络"
 me_fezzani_510.a:0 "战斗的时刻可能很快就会到来--我们会不会很孤单？"
 me_fezzani_510_desc:0 "我们的大使已经被派出去了，我们很快就会有答案；虽然很沮丧，但我们必须等待我们的外交官做他们的工作，希望能给我们带来好消息。"
 me_fezzani_510_title:0 "我们的联盟网络"
 me_fezzani_5_desc:0 "几个星期以来，整个[ROOT.GetCountry.GetCapital.GetName]可以听到的唯一声音是工人们在街上工作的呼喊声。一个接一个的石块被铺在一起，街道被拓宽，砖头的永久性建筑取代了木头和泥巴的破烂建筑。虽然付出了巨大的努力，但我们的人民的腰杆更硬了，我们已经建立了一个宏伟的城市，这对我们的祖先来说是无法识别的。"
 me_fezzani_5_title:0 "皇冠首都"
 me_fezzani_6.a:0 "我们的[ROOT.GetCountry.GetAdjective]人是土地的尽责管家"
 me_fezzani_6_desc:0 "虽然沙漠中充满了大面积的土地，对于种植东西来说毫无价值，但不屈不挠的[ROOT.GetCountry.GetName]人已经设法从石头中挤出水来，并在那些看起来没有生命力和被遗弃的地方建立了农场。我们不仅掌握了沙漠农业的微妙艺术，而且这种所谓的沙漠'粮仓'养活了我们的公民，使我们的军队在作战时吃饱。"
 me_fezzani_6_title:0 "沙漠粮仓"
 me_fezzani_7.a:0 "我们的敌人从不休息，因此我们也不应该"
 me_fezzani_7_desc:0 "尽管一些顾问对不得不参加这么多会议感到厌烦，但[ROOT.GetCountry.GetName]的统治者坚持要确保每周在首都举行战略规划会议。然而，所有的抱怨都保持在最低限度，因为每个人都明白需要为所有的突发事件做好准备--我们无法承受措手不及。"
 me_fezzani_7_title:0 "战略规划"
 me_fezzani_8.a:0 "让我们希望有好消息，但无论如何要准备宣称"
 me_fezzani_8.a.tt:0 "一个事件链将开始决定如何处理#G 纳萨摩尼亚人#!。"
 me_fezzani_8.b:0 "只有人工智能应该看到这一点，所以这并不重要。"
 me_fezzani_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已经派出了另一个特使，这次是给#E 纳萨摩尼亚人#!。我们的意图是明确的，所以让我们希望我们都能避免不必要的流血冲突，继续前进。"
 me_fezzani_8_title:0 "纳萨摩尼亚人的王国"
 me_fezzani_9.a:0 "我们还要做更多的事情来驯服最荒凉的沙地"
 me_fezzani_9_desc:0 "[GetProvince('(int32)8142').GetName]这片绿洲定居点曾经是战败的马基利亚人的骄傲和欢乐之地，现在已经变成了值得一提的地方，这让它的前任主人永远感到尴尬。\n\n一座砖石之城现在自豪地矗立在原本是拥挤而简陋的小屋的地方，我们增加的所有建筑——一个公共集会场所、一个粮仓、一个市场和一个训练营——已经把这个前马基利亚首都变成了一个令人自豪的、一流的[ROOT.GetCountry.GetAdjective]城镇。"
 me_fezzani_9_title:0 "瓦丹市"

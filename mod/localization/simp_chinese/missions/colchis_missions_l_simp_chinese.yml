 siezed_western_passes:0 "夺取西部山口"
 state_phasis_tax:0 "发西斯的政府税收"
 stone_of_iason:0 "伊阿宋之石"
 stone_of_iason_desc:0 "这块石头是伊阿宋投掷以分散龙牙战士注意力的众多石头之一，随后在他们的分心中击败他们。奇异地抛光，它令人质疑这是否真是半神之手在久远之前投掷的石头。"
 stone_throwing:0 "投石"
 suani_rebellion_adj:0 "斯凡"
 suani_rebellion_name:0 "斯凡王国"
 suani_republic_league_city_adj:0 "狄奥斯库里亚斯"
 suani_republic_league_city_name:0 "狄奥斯库里亚斯共和国"
 suani_stations:0 "苏阿尼站点"
 suania_adjective:0 "斯瓦涅季的"
 suanian_discurias_trade:0 "苏阿尼狄奥斯库里亚斯贸易"
 telephis_republic_league_city_adj:0 "特勒菲斯"
 telephis_republic_league_city_name:0 "特勒菲斯共和国"
 telephis_trade:0 "特勒菲斯贸易"
 the_golden_fleece:0 "金羊毛"
 the_golden_fleece_desc:0 "金毛羊克里索马洛斯的闪耀羊毛，由弗里克索斯救出并带至科尔基斯，金羊毛是古老的珍宝，被认为在伊阿宋带走时‘丢失’。现‘重现’，由科尔基斯王室的卫兵保护，这块羊毛为世界尽头的土地带来荣耀。"
 the_thorny_rose:0 "荆棘玫瑰"
 theban_green:0 "森林绿"
 trapezous_chaos:0 "特拉佩祖斯混乱"
 trapezous_ethnic_tensions:0 "特拉佩祖斯种族紧张"
 trapezous_kolchis_trade:0 "特拉佩祖斯贸易"
 trapezous_republic_league_city_adj:0 "特拉佩祖斯"
 trapezous_republic_league_city_name:0 "特拉佩祖斯共和国"
 tribute_from_colchis:0 "来自科尔基斯的贡品"
 unrestricted_skeptoukhi:0 "不受限斯凯普图希"
 wonder_aeetes_palace:0 "埃厄忒斯宫殿"
 wonder_aeetes_palace_desc:0 "曾是仁慈而成功国王埃厄忒斯的王座，这座科尔基斯的主要宫殿虽长期被忽视，仍吸引所有观其城墙之人。"

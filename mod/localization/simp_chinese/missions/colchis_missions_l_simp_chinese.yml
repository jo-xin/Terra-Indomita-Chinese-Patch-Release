 resentful_suani:0 "怨恨的苏阿尼人"
 restore_palace_aeetes:0 "恢复埃厄忒斯宫殿"
 restore_palace_aeetes_desc:0 "科尔基斯的老国王埃厄忒斯，曾在美狄亚（他自己的女儿）协助下被伊阿宋轻松击败，曾经在如今称为发西斯领地的黑海附近一座辉煌宫殿中统治。许多人认为这座宫殿已随时间消逝，但其废墟形态依然存在。新科尔基斯统治者需恢复这一古老奇迹，重拾科尔基斯在巫王统治下曾拥有的威望与荣耀！"

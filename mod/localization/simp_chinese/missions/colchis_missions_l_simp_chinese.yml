 colchian_tribute:0 "科尔基斯对伊比利亚的贡品"
 colchis_decision_1:0 "金羊毛"
 colchis_decision_1_desc:0 "虽然发西斯的希腊人声称持有金羊毛的最后一缕，并将其作为希腊遗产的一部分宣扬，但我们知道金羊毛始终属于科尔基斯人之手。一名高阶祭司的亲信顾问带来了一件令人震惊之物，引起宫廷的难以置信。他手中持有一块羊毛……如此金光闪耀，色彩如此辉煌，唯有神圣之物可比。然而，展示中有一块缺失。\n\n他毫不犹豫地拿起我们从发西斯希腊人处获得的羊毛碎片，贴合到缺失处，展示了一件完整的杰作——仿佛碎片消失，证实了这块羊毛的真伪。有人相信神明将一只金羊赠予一名孤独的农民，使另一块金羊毛归于科尔基斯；也有人认为这古老遗物仅是从帖撒利亚海岸回归故里，故事与传言纷纭……"
 colchis_decision_2:0 "伊阿宋崇拜"
 colchis_decision_2_desc:0 "为阿尔戈英雄伊阿宋设立圣地"
 colchis_decision_3:0 "埃厄忒斯崇拜"
 colchis_decision_3_desc:0 "为科尔基斯国王埃厄忒斯设立圣地"
 colchis_missions:0 "巫王传承"
 colchis_missions_BUTTON_DETAILS:0 "施展魔法"
 colchis_missions_BUTTON_TOOLTIP:0 "重建埃厄忒斯故乡的辉煌将是一条漫长之路，但我们必将坚持不懈！"
 colchis_missions_CRITERIA_DESCRIPTION:0 "当科尔基斯恢复埃厄忒斯的荣誉与传承，并征服黑海地区时，此使命将被视为完成。"
 colchis_missions_DESCRIPTION:0 "传说中的科尔基斯历史可追溯至神话时代，当时老国王埃厄忒斯统治着沿法里斯河新建立的土地。放弃了他在科林斯的领地后，埃厄忒斯以魔法大师的身份统治这片异域之地，在高加索西部的沼泽与森林中建立了一个富饶而令人向往的王国。\n\n科尔基斯最早被亚述人称为‘库尔哈’，多次陷入分裂与统一，周期性地分裂成小王国，又重新聚合成发西斯河流域的强大国家。这片土地的自然地理使其物产丰富，但也因缺乏真正的工业能力而注定以自然美景著称——艾亚/库塔伊西的王座从未能与希腊、安纳托利亚或伊朗高原的成熟王国相媲美。\n\n科尔基斯始终处于已知世界的边缘，隐藏在‘好客之海’的尽头，直到希腊人探索与殖民后才为人所知。阿契美尼德帝国将邻近的高加索伊比利亚纳入其总督领体系后，科尔基斯的边界才与之接壤。从那时起，科尔基斯的商人、市场和行政体系与地中海及爱琴海的联系更加紧密，但它仍是一个纯粹的黑海势力。或许现在是时候让埃厄忒斯的故土超越其摇篮，探索世界为它准备的新机遇了。"
 colchis_missions_REWARD_DESCRIPTION:0 "科尔基斯将获得超越南方地中海势力的军事与经济能力。"
 colchis_missions_task_01:0 "三百种语言的财富"
 colchis_missions_task_01_DESC:0 "据说由狄奥斯库里双子星亲自建立的狄奥斯库里亚斯城，成为高加索、黑海、草原和安纳托利亚各地人民的繁忙港口。以盐矿闻名，狄奥斯库里亚斯的市场极为多样化，据说一天之内漫步城中可听到70至300种独特的语言。科尔基斯人必须充分利用狄奥斯库里亚斯的天然优势，获取更大利益。"
 colchis_missions_task_01_tt:0 "我们将深入沿海的多元市场。"
 colchis_missions_task_02:0 "库吉的珠宝城堡"
 colchis_missions_task_02_DESC:0 "建于巨大的石灰岩矿床之上，位于平原边缘的防御性丘陵地带，茨赫戈吉（希腊人称为阿耳恺俄波利斯）处于贸易要冲，直接受益于俯瞰它的山脉中的珠宝和贵金属矿藏。因此，它既是战略要地，也是声望显赫的堡垒所在地——但或许我们可以为科尔基斯王座的继承者打造一座更合适的城堡。"
 colchis_missions_task_03:0 "黄金之河"
 colchis_missions_task_03_DESC:0 "发西斯河因河底岩石与鹅卵石间隐藏的闪光金块而得名，是从我们的首都通往黑海的贸易与通讯命脉。我们必须控制这条河，将其作为我们经济的真正支柱。"
 colchis_missions_task_03_tt:0 "许多 #Y 礼物#! 即将顺流而下……"
 colchis_missions_task_04:0 "山间婚礼"
 colchis_missions_task_04_DESC:0 "科尔基斯宫廷成员及其王室家族协助法尔纳瓦兹一世从僭主阿佐手中夺取了伊比利亚王位。两国王室之间关系密切。通过王室联姻巩固我们的关系可能大有裨益。"
 colchis_missions_task_05:0 "守护玫瑰之城"
 colchis_missions_task_05_DESC:0 "瓦茨赫（希腊人称为罗多波利斯，或玫瑰之城）坐落在开阔平原上，是一朵丰饶但脆弱的文明之花。若敌人如雪崩般从山口涌来，它必须做好准备并得到保护，否则这朵花将枯萎凋零。"
 colchis_missions_task_06:0 "排干沼泽"
 colchis_missions_task_06_DESC:0 "许多人认为，科尔基斯的王国与人民受限于其自然地貌。科尔基斯人虽习惯于穿梭运河网和沼泽地，将货物运往内陆和沿海市场，但若能排干这片有时有害的地貌，城市便可扩张，修建更多道路，拓展贸易通道并提升工业能力。"
 colchis_missions_task_07:0 "印度-黑海贸易"
 colchis_missions_task_07_DESC:0 "虽然伊朗高原一直是主要贸易路线，但黑海和马赞达兰海也提供了廉价的海上运输替代路线，通往博斯普鲁斯海峡和富饶的爱琴海。沿发西斯河建设基础设施将使科尔基斯商人能够更快、更便捷地获取远方的货物。"
 colchis_missions_task_07_tt:0 " #Y 3#! 个 #E 科尔基斯#!省份的领土必须成为 #Y 城市#!，且拥有 #Y 2#! 个或更多 #E 市场#!。"
 colchis_missions_task_08:0 "高加索联盟"
 colchis_missions_task_08_DESC:0 "科尔基斯长期固守沿海水域和山口的安全地带，但不可否认，南高加索内陆拥有更丰富的矿产资源，并通过中央高加索之门与北方草原民族进行贸易。联合埃厄忒斯与法尔纳瓦兹家族可能促成一个强大的区域势力体系。"
 colchis_missions_task_09:0 "斯凯普图希代表团"
 colchis_missions_task_09_DESC:0 "随着国王事务的日益繁重，需要委派代表以维持科尔基斯的效率与增长。在发西斯河三角洲及更远地区的主要城市和定居点设立皇家总督体系，持有国王的仪式权杖，将有助于维持日常秩序。"
 colchis_missions_task_10:0 "埃厄忒斯宫殿"
 colchis_missions_task_10_DESC:0 "在科尔基斯，无人不知埃厄忒斯与阿尔戈英雄击败他的故事，更不用说他的女巫女儿美狄亚。然而，鲜有人能指出老国王的居所。在发西斯镇的外围，有一处古老而被遗忘的废墟。王座的顾问认为，这些被沼泽覆盖的遗迹是古代宫殿的残存部分——正是埃厄忒斯坐镇并统治传奇时代最强大王国的宫殿。为重拾我们的遗产，再次成为海上富饶的贸易中心，我们必须恢复这座宫殿的昔日辉煌。"
 colchis_missions_task_10_tt:0 "#Y 科尔基斯#! 必须采取 #E 恢复埃厄忒斯宫殿#! 的决议，且 #Y 埃厄忒斯宫殿#! 的 #G 修复#! 必须完成。"
 colchis_missions_task_11:0 "好客之海东岸"
 colchis_missions_task_11_DESC:0 "黑海因贸易的频繁与财富而得名‘好客之海’。科尔基斯位于东部，得以开展跨高加索和里海贸易，控制更多南北沿海地区将使其扩展至草原、陶里卡和安纳托利亚市场。科尔基斯还将拥有更大的本地水域海军控制权，足以遏制海盗和强有力的竞争。"
 colchis_missions_task_12:0 "启迪行政"
 colchis_missions_task_12_DESC:0 "阿契美尼德帝国的第19总督区曾包括科尔基斯的下边界地区。尽管他们有时咄咄逼人，但南方的波斯人以出色的秩序和应对政治或社会障碍的准备而闻名。随着国王权力分散于各大城市的皇家总督手中，中央高效控制事务的能力落入所谓忠诚的管理者手中。若科尔基斯宫廷能借鉴阿契美尼德的通讯、常规检查和文化意识方式，维持这些斯凯普图希的忠诚与效率可能比想象中简单得多。"
 colchis_missions_task_12_tt:0 "#Y 0#! 个家族被 #R 蔑视#!"
 colchis_missions_task_13:0 "控制海峡"
 colchis_missions_task_13_DESC:0 "博斯普鲁斯和克里米亚海峡控制并限制了进出黑海的南北航运。科尔基斯虽一直受益于北向贸易，但直接控制这些海峡及其税收将释放巨大潜力。博斯普鲁斯和辛梅里亚‑博斯普鲁斯是暴力垄断——要控制它们，科尔基斯的海军与商人必须完全拥有它们。"
 colchis_missions_task_14:0 "黑海霸主"
 colchis_missions_task_14_DESC:0 "在经济和政治上，若科尔基斯能控制整个黑海，成为航运、人员流动和军事事务的唯一决策者，它将成为不可征服的势力。若这片海域成为科尔基斯的私人湖泊，埃厄忒斯的王座与传承将超越击败他的希腊人。"
 colchis_missions_task_14_tt:0 "#Y [THIS.GetCountry.GetName]#!必须拥有#T  黑海#!和#T 迈俄提亚海#!省份沿岸的 #E 每一块沿海领土#!。"
 colchis_saeristavo_client:0 "埃格里西的萨埃里斯塔沃"
 competitive_colchian_farmers:0 "科尔基斯农民竞争"
 corrupt_colchian_nobles:0 "科尔基斯精英腐败"
 desc_achaemenid_inspired_colchian_administration:0 "科尔基斯人采用了旧阿契美尼德风格的行政措施元素。"
 desc_aeetes_palace_attraction:0 "来自黑海及更远地区的人们蜂拥而至，参观修复的老埃厄忒斯宫殿。"
 desc_aeetid_throne:0 "科尔基斯现从修复的老埃厄忒斯王座管理其领域。"
 desc_anger_against_argonaut_stone:0 "人民对伊阿宋之石不满，这块石头提醒着希腊人对科尔基斯人民统治者的胜利，被科尔基斯宫廷赞扬。"
 desc_answered_call_to_arms:0 "科尔基斯接受我们对抗赫尼奥基侵略的防御号召。"
 desc_argonaut_legacy:0 "源自传说中的金羊毛之地——科尔基斯，阿尔戈号及其船员的传奇故事传遍整个希腊世界，在多数人的记忆中占据特殊地位。"
 desc_attempted_kill_pharnavaz:0 "众所周知，科尔基斯人曾试图杀死高加索伊比利亚的法尔纳瓦兹一世"
 desc_black_sea_colchis_hegemon:0 "科尔基斯已成为黑海的殖民海军霸主。"
 desc_colchian_farmer_autonomy:0 "任由其自行决定，科尔基斯湿地的农民采取了他们自己的行动路线。"
 desc_colchian_merchants:0 "科尔基斯商人将泥色双耳陶罐和其他货物带到我们的市场。"
 desc_colchian_potential:0 "科尔基斯人民拥有广阔而资源丰富的土地，将支持他们崛起为伟大。"
 desc_colchian_silphium:0 "科尔基斯人发现了罗盘草的神奇特性。"
 desc_colchian_silphium_growers:0 "此人协助精心培育了科尔基斯的罗盘草文化。"
 desc_colchian_silphium_growing:0 "在科尔基斯三角洲温暖潮湿的湿地中，拥有罕见特性的罗盘草找到了新的繁荣家园，为当地人民带来欢乐。"
 desc_colchian_tribute:0 "我们继续向伊比利亚人支付贡品。"
 desc_colchis_saeristavo_client:0 "作为法尔纳瓦兹一世高加索伊比利亚的直接附庸，科尔基斯通过相互合作与繁荣获益匪浅。"
 desc_competitive_colchian_farmers:0 "受新土地耕种热潮的驱使，每位农民比以往更担心邻居的价格与繁荣，竞相为市场生产更多货物。"
 desc_corrupt_colchian_nobles:0 "科尔基斯的贵族将从每笔贸易税中抽取顶层利润，填满他们的口袋，使他们更倾向于支持王室。"
 desc_destroy_argonaut_stone:0 "科尔基斯祭司团已仪式性地移除围绕伊阿宋投掷的石头的神圣光环，人民现已摆脱阿尔戈英雄的影响。"
 desc_dioscuri_blessing:0 "神龛在一座宏伟神庙中得到提升，狄奥斯库里为以其命名的港口城镇狄奥斯库里亚斯带来了未来的好运。"
 desc_dioscurias_ethnic_violence:0 "在如此多元的地方爆发种族紧张局势实属罕见且令人恐惧，希腊人甚至试图驱逐城内的苏阿尼人。"
 desc_euxinos_control:0 "拥有黑海最长的海岸线，科尔基斯对水域的控制极大，精通船舶操控和港口管理。"
 desc_expanded_millet_farms:0 "在先前湿地的温暖气候中最适合生长的作物，我们现拥有更多空间扩展小米田。"
 desc_expanded_trapezous_quarters:0 "特拉佩祖斯的公共区域已扩建，为不同族群提供更多空间。"
 desc_fair_trade_diplomacy:0 "科尔基斯人尊重赫尼奥基在狄奥斯库里亚斯获取港口通道的愿望，防止了战争。"
 desc_fields_of_roses:0 "尽管军事上薄弱，瓦尔茨赫/罗多波利斯周围的田野水源充足、富饶，足以供应成长中的城市。"
 desc_flooding_assistance:0 "统治者向人民赠送礼物，帮助他们在洪水后重建生活。"
 desc_gold_rush:0 "人民可自由收获发西斯河的黄金利益，他们蜂拥而至，围绕慷慨的金溪领主旗帜集结。"
 desc_indo_euxinos_trade:0 "来自东部和黑海的贸易带来了许多有物可售的新人。"
 desc_killed_pharnavaz:0 "科尔基斯人杀死了高加索伊比利亚的法尔纳瓦兹一世"
 desc_kuji_fortress:0 "闪耀着当地珠宝光芒的城堡，俯瞰重要贸易路口，控制地方贸易。"
 desc_lazi_appeasement_trade:0 "我们开展有利于拉兹的贸易，以缓解他们的担忧并分散其叛乱注意力。"
 desc_lazi_mercenary_pool:0 "里扎伊翁的拉兹雇佣兵国家将提供廉价而能干的部队。"
 desc_monopoly_on_straight_violence:0 "为控制海峡经济，科尔基斯人维持强大的海军优势。"
 desc_occupation_of_dioscurias:0 "科尔基斯人一夜之间强行占领了狄奥斯库里亚斯，现牢牢控制狄奥斯库里神龛的圣地。"
 desc_outrage_over_stone_destruction:0 "黑海的希腊人视伊阿宋及其阿尔戈英雄为不朽的英雄，对销毁他在与龙牙战士战斗中投掷的石头极为愤怒。"
 desc_pheasant_farms:0 "利用近期雉鸡种群的激增，我们将能养活我们的首都。"
 desc_pheasant_markets:0 "来自丘陵森林的雉鸡被顺流运到港口摊位出售。"
 desc_pheasant_problem:0 "雉鸡泛滥村庄，对当地人造成极大困扰。"
 desc_praise_stone_destruction:0 "人民为销毁伊阿宋投掷以击败龙牙战士的石头而欢欣鼓舞，展现了科尔基斯的主权与骄傲。"
 desc_rebuffed_suani_elders:0 "科尔基斯宫廷拒绝协助苏阿尼人进行谈判。"
 desc_rebuilt_after_flood:0 "在意外洪水几乎摧毁村庄后，王室协助从头重建，使其成为正在干涸的湿地中的堡垒。"
 desc_refuse_ibero_marriage:0 "科尔基斯贵族为库吉避免成为伊比利亚傀儡而欢欣。"
 desc_refused_call_to_arms:0 "科尔基斯拒绝我们对抗赫尼奥基侵略的防御号召。"
 desc_rejected_saeristavo:0 "库吉的王座拒绝向法尔纳瓦兹家族屈膝。"
 desc_replaced_the_swamp:0 "通过我们的坚定意志，科尔基斯湿地的沼泽特性已被克服，显露出新的可定居土地。"
 desc_resentful_suani:0 "苏阿尼人对科尔基斯王室未能保护其在狄奥斯库里亚斯城的商人和工匠表示不满。"
 desc_restricted_skeptoukhi:0 "科尔基斯的皇家总督在管理其地区的权力将受到限制，遏制他们的最大野心。"
 desc_rose_assault:0 "突袭并夺取环绕玫瑰之城的山口已令这位指挥官满意。"
 desc_rose_gold_traders:0 "随着罗多波利斯矿藏的新财富外包给当地企业家，商人将继续涌入我们的集市。"
 desc_rose_thorn:0 "此山口现作为附近罗多波利斯的延伸之刺，严密防卫敌军通过。"
 desc_rosy_mines:0 "肥沃平原边缘丘陵上美丽的玫瑰覆盖着丰富的金属矿藏，可为未来的建设和维护提供燃料。"
 desc_royal_caucasian_marriage:0 "科尔基斯与高加索伊比利亚势力间的联姻带来了普遍的良好情绪。"
 desc_royal_hide_sifting:0 "王室雇佣的工人为我们筛选发西斯河的黄金利益。"
 desc_salt_trading:0 "狄奥斯库里亚斯涌出的盐引发了活动和产业的热潮。"
 desc_siezed_western_passes:0 "科尔基斯人贪婪地夺取了我们西部山口的灰色地带。"
 desc_state_phasis_tax:0 "王室对沿发西斯河的贸易实施了普遍税收。"
 desc_stone_throwing:0 "如同伊阿宋，科尔基斯人民也能将最简单的石头变成最致命的投掷物。"
 desc_suani_stations:0 "苏阿尼人在狄奥斯库里亚斯获得了所需的所有空间，代价是当地人的不满。"
 desc_suanian_discurias_trade:0 "现掌管狄奥斯库里亚斯，苏阿尼人增加了精美工艺品和珍贵奢侈品的出口。"
 desc_the_thorny_rose:0 "被花田环绕的罗多波利斯城拥有保护性城墙和荆棘防御，守护自身安全。"
 desc_trapezous_chaos:0 "特拉佩祖斯爆发了本地希腊人与拉兹区之间的暴力冲突。"
 desc_trapezous_ethnic_tensions:0 "本地希腊人与特拉佩祖斯的拉兹群体之间爆发了紧张局势"
 desc_trapezous_kolchis_trade:0 "凭借新港口，特拉佩祖斯的贸易蓬勃发展。"
 desc_tribute_from_colchis:0 "科尔基斯继续向我们支付名义上的贡品。"
 desc_unrestricted_skeptoukhi:0 "科尔基斯的皇家总督在管理其地区拥有极大权力，带来盈利，但需付出代价。"
 destroy_argonaut_stone:0 "销毁伊阿宋之石"
 dioscuri_blessing:0 "狄奥斯库里祝福"
 dioscurias_ethnic_violence:0 "狄奥斯库里亚斯种族暴力"
 euxinos_control:0 "黑海控制"
 expanded_millet_farms:0 "扩展小米农田"
 expanded_trapezous_quarters:0 "特拉佩祖斯扩建区"
 fair_trade_diplomacy:0 "公平贸易外交"
 fields_of_roses:0 "玫瑰田野"
 flooding_assistance:0 "洪水援助"
 formable_not_abasgia_exists:0 "阿巴斯吉亚不存在"
 formable_not_lazica_exists:0 "#Y 拉齐卡#!不存在。"
 formable_not_scandia_exists:0 "斯堪的亚不存在"
 formable_not_suania_exists:0 "苏阿尼亚不存在"
 gold_rush:0 "淘金热"
 golden_goat_rhyton:0 "金羊角杯"
 golden_goat_rhyton_desc:0 "此角杯为饮用容器，底部有倾倒孔，来自埃克巴塔纳的工坊，描绘羊头，羊嘴位于倾倒孔处。 датируется阿契美尼德时期。"
 gw_effect_aeetes_palace:0 "埃厄忒斯传承"
 gw_effect_aeetes_palace_DESC:0 "无论希腊人还是科尔基斯人，无人不知伊阿宋及其阿尔戈英雄如何遇见老科林斯人、科尔基斯斯伟大国王埃厄忒斯的故事。没有旅行者能抗拒参观这一神圣而强大的景点，为神一般的埃厄忒斯留下礼物。"
 have_6_state_investments_tooltip:0 "拥有至少 #Y 6#! 项省级投资"
 indo_euxinos_trade:0 "印度-黑海贸易"
 killed_pharnavaz:0 "杀死法尔纳瓦兹一世"
 kuji_fortress:0 "库吉城堡"
 lazi_appeasement_trade:0 "与拉兹的安抚贸易"
 lazi_mercenary_pool:0 "拉兹雇佣兵库"
 lazi_rebellion_adj:0 "莫西诺伊基"
 lazi_rebellion_name:0 "莫西诺伊基王国"
 light_gold:0 "浅金"
 me_colchis_1.a:0 "我们也将从这个繁忙的港口获取珍贵的盐。"
 me_colchis_1.b:0 "让科尔基斯语在那个市场中更加持久。"
 me_colchis_1.c:0 "草原民族擅长打造金属杰作。王座必须拥有一些。"
 me_colchis_1.d:0 "马王们会在我们的市场中找到更好的机会。"
 me_colchis_10.a:0 "我将迎娶法尔纳瓦兹一世的妹妹芭芭拉。"
 me_colchis_10.b:0 "我实际上将迎娶法尔纳瓦兹一世的母亲曼达尼斯。"
 me_colchis_10.c:0 "我拒绝嫁入那个家族，成为他们的附庸！"
 me_colchis_10_desc:0 "库吉与法尔纳瓦兹一世在姆斯赫塔的新城堡会面，讨论推翻并处决老阿佐后的南高加索局势。为避免不良情绪和不健康的竞争，法尔纳瓦兹一世提议将其妹芭芭拉许配，以联合两国王室。现在，坐在王座上的老库吉必须为他的人民决定最佳前路。"
 me_colchis_10_title:0 "库吉-法尔纳瓦兹联盟"
 me_colchis_11.a:0 "科尔基斯的萨埃里斯塔沃将在法尔纳瓦兹的霸权下繁荣。"
 me_colchis_11.b:0 "我们应推动平等联盟。"
 me_colchis_11.c:0 "若法尔纳瓦兹死了，我们的继承权将是最大的……"
 me_colchis_11_desc:0 "现在，科尔基斯与高加索伊比利亚的王座通过联姻联合，法尔纳瓦兹一世多次登门，名副其实地讨论科尔基斯相对于伊比利亚的地位。库吉娶了法尔纳瓦兹的妹妹，而伊比利亚是父系社会，其王位将传给法尔纳瓦兹的儿子。然而，库吉的子女对科尔基斯本身——他们的故土——有争议性的宣称。许多人设想，法尔纳瓦兹希望将科尔基斯变为他的一个埃里斯塔维国家统治者，将库吉降格为他自己家园的总督。这种结构可能为两国提供更大的稳定性和防御合作，但科尔基斯人民有成为自己家园二等公民的风险。"
 me_colchis_11_title:0 "科尔基斯-伊比利亚地位"
 me_colchis_12.a:0 "联盟将缓解局势。"
 me_colchis_12.b:0 "我们为何不控制他们的土地……"
 me_colchis_12_desc:0 "由于我们拒绝联姻，法尔纳瓦兹一世开始派遣使者，带来敌对言辞和激烈口吻。贵族中担忧战争，但总有外交手段解决问题。战争只是外交的一种方式。"
 me_colchis_12_title:0 "高加索王室紧张局势"
 me_colchis_13.a:0 "这种紧张局势使我们的对手保持警惕。"
 me_colchis_13.b:0 "他们要么屈服，要么被逼屈服。"
 me_colchis_13_desc:0 "高加索伊比利亚宫廷已亮出底牌，试图征服我们。然而，我们屹立不倒，手握更强的未出牌。现在是时候了。科尔基斯人应推动伊比利亚的臣服。"
 me_colchis_13_title:0 "打出我们的牌"
 me_colchis_14.a:0 "为负担这些防御工事，我们必须使玫瑰平原盈利。"
 me_colchis_14.b:0 "更多守卫城墙的部队需要更多粮食。"
 me_colchis_14.c:0 "我们将迅速占领俯瞰城市的未设防山口。"
 me_colchis_14_desc:0 "改良防御工事的建设正在进行，但对我们的资源造成巨大压力。这座玫瑰之城的成长过程极为艰辛，若要成为我们人民在艰难时期的堡垒，我们需进一步投资。"
 me_colchis_14_title:0 "守护玫瑰"
 me_colchis_15.a:0 "立即将玫瑰之城转为黄金生产。"
 me_colchis_15.b:0 "让那些想开采我们金矿的人为我们工作。"
 me_colchis_15.b.t:0 "一名自称 #Y 金嗅者#! 的人将作为次要角色加入我们的国家"
 me_colchis_15_desc:0 "玫瑰矿山的金属矿石极为丰富。然而，在一个平常的日子，一名当地矿工认为他看到一道耀眼的光芒从覆盖岩石的尘土和煤烟中透出。经检查，他的上级发现山坡中又有一条金脉穿过。科尔基斯真是黄金之沙的土地！\n然而，一些人认为将这一矿藏外包给私人矿商最为有利。一名自称‘金嗅者’的陌生人来到，提出以私人处理黄金为条件提供服务。"
 me_colchis_15_title:0 "玫瑰之金"
 me_colchis_16.a:0 "赔偿人民的损失，并提供一些食物。"
 me_colchis_16.b:0 "我们将重建整个村庄，这一次要有稳固的基础。"
 me_colchis_16.c:0 "要煎蛋就得打破几个蛋……"
 me_colchis_16_desc:0 "在将水从湿地引流时，我们的一座木制框架断裂，大量水流冲向一个当地村庄，摧毁了许多人的房屋支架，激怒了当地人。"
 me_colchis_16_title:0 "意外洪水"
 me_colchis_17.a:0 "他的服务可能证明有价值。"
 me_colchis_17.b:0 "支付他的设计费用，然后让他离开。"
 me_colchis_17.c:0 "我们不需要希腊人的帮助！"
 me_colchis_17_desc:0 "在我们规划排水系统以最终消除科尔基斯湿地的天然劣势时，来自发西斯港口城镇的一名希腊建筑师和工程师来到宫廷，提出作为大师级工匠和奇异装置与系统的设计师提供服务。他声称能为我们的排水系统设计提供见解，并愿意为我们效力……当然，需支付费用。"
 me_colchis_17_title:0 "希腊建筑师"
 me_colchis_18.a:0 "让我们扩展我们一直在耕种的小米农田。"
 me_colchis_18.b:0 "或许我们应在新的区域尝试种植作物。"
 me_colchis_18.c:0 "将决定权交给农民。"
 me_colchis_18.c.t:0 "农民懒惰，#Y 一事无成#!"
 me_colchis_18_desc:0 "随着湿地开始排水，可耕地逐渐显现，从曾经覆盖水面的泥泞和沼泽土壤下显露出来。我们应优先以新的方式利用这些土地，使其最终为科尔基斯人民服务！问题在于：如何做？在哪里？"
 me_colchis_18_title:0 "待开垦的新土地"
 me_colchis_19.a:0 "让贸易自由流动。"
 me_colchis_19.b:0 "贵族将收取他们的份额。"
 me_colchis_19.c:0 "商人将向王室纳税。"
 me_colchis_19_desc:0 "远至印度等地及更远的贸易路线为我们的港口和黑海市场带来了巨大财富。看到这一点，我们港口的协调者和收费站希望提高对沿发西斯河运输货物的税收。我们必须决定如何推进，如何盈利，同时不扼杀如此诱人的贸易。"
 me_colchis_19_title:0 "我们的贸易份额"
 me_colchis_1_desc:0 "在夏季，北方平原和草原的游牧民穿过山口，来到狄奥斯库里亚斯港，用他们的货物和服务换取盐，用以腌制和调味肉类。我们应派遣王室商贩前往港口，为库塔伊西采购必需品。"
 me_colchis_1_title:0 "草原贸易的语言"
 me_colchis_2.a:0 "我们将利用这一刻夺取对双方的权力和影响。"
 me_colchis_2.b:0 "此事有蹊跷。派遣武装使团进行谈判。"
 me_colchis_2.c:0 "赫尼奥基可能成为宝贵的盟友——将狄奥斯库里亚斯交给他们以换取恩惠。"
 me_colchis_2.d:0 "让这些傲慢的希腊人受苦。讽刺最好在矛尖上品尝。"
 me_colchis_20.a:0 "人民可自由迁徙。"
 me_colchis_20.b:0 "首都需要更多口译员。"
 me_colchis_20.c:0 "特勒菲斯已是外邦人的聚居地——让它以此为目标。"
 me_colchis_20.c.t:0 "#Y 特勒菲斯#!城将成为#E 科尔基斯#!的#Y 同盟城邦#!。"
 me_colchis_20.d:0 "发西斯将拥有更多新型工坊。"
 me_colchis_20_desc:0 "许多新人通过黑海或跨越高加索来到我们的海岸，确为我们独特的文化混合增添了新层次。鉴于我们土地如今的多样性，我们该如何处理这些新人？"
 me_colchis_20_title:0 "更多语言待学"
 me_colchis_21.a:0 "我们的神庙将展示这件精美艺术品。"
 me_colchis_21.b:0 "它将装饰我的王座大厅。"
 me_colchis_21.c:0 "买家众多。"
 me_colchis_21_desc:0 "在一名里海血统的草原骑士背上，我们的国营商人发现了一件精致的黄金角杯，描绘了一个山羊头。这件精美之物该如何处理？"
 me_colchis_21_title:0 "东方珍宝"
 me_colchis_22.a:0 "我们将作为主导王国引领方向。"
 me_colchis_22.b:0 "科尔基斯人与伊比利亚人的联合最为有益。"
 me_colchis_22.c:0 "我们将创建首个跨高加索帝国。"
 me_colchis_22.d:0 "维持现状最佳。"
 me_colchis_22_desc:0 "随着高加索地区大部分处于我们的直接或间接控制之下，许多人询问我们在该地区的目标与角色。科尔基斯贵族中一些人偏好我们的主导地位，怀有建立更大科尔基斯势力范围的宏伟志向。其他人则倾向于更本地化的平衡，满足我们领域内众多人民的需求与愿望。我们的道路将何去何从？"
 me_colchis_22_title:0 "高加索联合"
 me_colchis_23.a:0 "他们的管辖权将受到限制。"
 me_colchis_23.b:0 "皇家总督应是王座的完美代言人。"
 me_colchis_23_desc:0 "科尔基斯国王的权杖已被大量重制，分发给选定的科尔基斯小国的皇家总督。这一做法将简化某些行政事务，但有人担心，给予总督如此大权力可能导致他们贪婪和叛乱。"
 me_colchis_23_title:0 "总督权力"
 me_colchis_24.a:0 "伊比利亚的统治提供安全保障。"
 me_colchis_24.b:0 "我们必须尝试成为这种关系的主导者。"
 me_colchis_24.c:0 "除掉法尔纳瓦兹一世应能让我们摆脱这种联合。"
 me_colchis_24_desc:0 "在高加索伊比利亚的监管下生活一段时间后，科尔基斯人民（尤其是贵族）对伊比利亚人产生了分歧的看法。许多人通过与伊比利亚商人网络的合作与接触，个人财富增加。其他人则厌恶伊比利亚人及其习俗，为被这样的民族征服感到羞耻。一些人呼吁改变我们在这种权力动态中的角色。"
 me_colchis_24_title:0 "臣属之路"
 me_colchis_25.a:0 "赞美老巫王。"
 me_colchis_25_desc:0 "长期荒废的埃厄忒斯国王宫殿，来自阿尔戈英雄传说及其他古老传说的宫殿，已恢复其应有的辉煌与地位。所有科尔基斯人将称颂它为吸引商人、外交官和探险家前往世界尽头探寻新历史的辉煌景点。"
 me_colchis_25_title:0 "恢复埃厄忒斯宫殿"
 me_colchis_26.a:0 "埃厄忒斯宫殿将成为强大的首都。"
 me_colchis_26.b:0 "权力中心维持原地不动。"
 me_colchis_26_desc:0 "随着发西斯新宫殿的热议，许多顶级顾问建议将首都和行政中心迁至恢复的埃厄忒斯宫殿可能有益，尤其是考虑到其更便捷的黑海通道。应如何处理？"
 me_colchis_26_title:0 "埃厄忒斯王座"
 me_colchis_27.a:0 "仅赔偿他的损失。"
 me_colchis_27.b:0 "港口将是我们的重点，此人将成为其管理者。"
 me_colchis_27.b.t:0 "#Y 特拉佩祖斯#!城将成为#E 科尔基斯#!的#Y 同盟城邦#!。"
 me_colchis_27.c:0 "我们将从内地雇佣人力建造更宏伟的港口。"
 me_colchis_27_desc:0 "一名知名商人在特拉佩祖斯港口以东五帕拉桑格的海岸被冲上岸。他声称，由于黑海南岸的暴风雨天气，当波塞冬挥舞三叉戟，掀起巨浪撞向岩石悬崖时，船只难以安全抵达港口。他询问我们能否提升港口的安全性和能力，以便航运立即恢复。"
 me_colchis_27_title:0 "特拉佩祖斯港口"
 me_colchis_28.a:0 "城墙内有足够空间容纳双方！"
 me_colchis_28.b:0 "紧张局势会随时间消退。"
 me_colchis_28.c:0 "那么，拉兹人到底想要什么？"
 me_colchis_28.c.t:0 "来自 #Y 科尔基斯#! 的外交官将与部落领袖会面，#T 协商#! 缓解 #E 紧张局势#!。"
 me_colchis_28_desc:0 "尽管特拉佩祖斯港口城市及其邻近村庄长期居住着相当数量的拉兹部落，但我们从内地部落雇佣的大量额外人手协助港口额外建设，使这一民族社区激增——许多人开始称特拉佩祖斯西南部为‘拉兹区’。本地希腊人开始感到在自己的城墙内被少数民族压倒，种族紧张局势上升。这该如何处理？"
 me_colchis_28_title:0 "特拉佩祖斯的拉兹部落"
 me_colchis_29.a:0 "在问题恶化前消灭它。"
 me_colchis_29.b:0 "让我们做生意。"
 me_colchis_29.c:0 "将港口控制权交给当地人。"
 me_colchis_29.c.t:0 "#Y 特拉佩祖斯#!城将成为#E 科尔基斯#!的#T 拉兹#!#Y 同盟城邦#!。"
 me_colchis_29.d:0 "拉兹人将在我们的战争中发泄怒气。"
 me_colchis_29.d.t:0 " #Y 里扎伊翁#! 将成为忠于 #E 科尔基斯#! 的 #T 拉兹#! #Y 雇佣兵国家#!。"
 me_colchis_29.e:0 "他们绝非科尔基斯军队的对手。"
 me_colchis_29.e.t:0 " #E [lazi_leader.GetName]#! 在 #Y 莫西诺伊基王国#! 旗帜下挑起内战。"
 me_colchis_29.f:0 "莫西诺伊基人比科尔基斯人更强大！"
 me_colchis_29.f.t:0 " 你将切换为扮演 #Y 莫西诺伊基王国#!。"
 me_colchis_29_desc:0 "我们的外交官带回了莫西诺伊基、马克罗尼斯和卡利比斯部落的要求。在特拉佩祖斯城墙内见识了城市生活后，这些部落民提出了一系列混合要求，威胁若被忽视将发动叛乱或至少制造骚乱。我们该如何与这些部落民合作或对抗？"
 me_colchis_29_title:0 "拉兹共和国？"
 me_colchis_2_desc:0 "狄奥斯库里亚斯的希腊人总是自视为比赫尼奥基部落优越——双方都宣称是狄奥斯库里双子星的后裔，但狄奥斯库里亚斯以双子星命名，而部落民仅自称‘战车手’。尽管希腊人不屑与部落民交易，但这些游牧民是他们最大的客户，总是成捆购买盐来调味鱼类，以廉价毛皮换取。希腊人视赫尼奥基为野蛮人和海盗，他们驾驶可陆上搬运的轻便船只，但在市场摊位上却是真正的绅士，总是支付公道价格。\n\n据说赫尼奥基人曾居住在发西斯河以南，是被希腊人驱逐的法西奥伊人的分支，如今仅局限于孤立的悬崖和小港口。令人好奇的是，一名狄奥斯库里亚斯信使匆匆跑进宫殿，称赫尼奥基人打破惯例，正在袭击港口。希腊人恳求我们协助消灭这些野蛮人。"
 me_colchis_2_title:0 "献给赫尼奥基的盐"
 me_colchis_3.a:0 "我们不会浪费资金在花卉上。"
 me_colchis_3.b:0 "让我们尝试……植物学。"
 me_colchis_3.c:0 "召集本地及外地的顶尖 healers，共同研究。"
 me_colchis_3.d:0 "或许我的寝宫也会更加生机盎然……"
 me_colchis_30.a:0 "高加索将始终是我们的领域。"
 me_colchis_30.b:0 "阿契美尼德的土地可以是我们的！"
 me_colchis_30.c:0 "我们对那遥远的王座有继承权！"
 me_colchis_30_desc:0 "我们引入了旧阿契美尼德行政手段的元素，以更好地治理和运营我们日益增长的国家。贵族们赞扬王座以如此少的努力监督如此多的进步和效率。然而，许多人好奇，是否能从波斯启发中挖掘更多？那个帝国的古老伊朗故土依然富饶……"
 me_colchis_30_title:0 "阿契美尼德阴影"
 me_colchis_31.a:0 "一支无可挑战的舰队。"
 me_colchis_31_desc:0 "统治博斯普鲁斯和克里米亚海峡需要强制执行税收，并防止流氓商人、海盗或对手提供更便宜的航运替代方案。为最佳控制这一经济动态，我们必须维持强大的海军舰队。"
 me_colchis_31_title:0 "暴力垄断"
 me_colchis_32.a:0 "埃厄忒斯的后裔统御海浪！"
 me_colchis_32_desc:0 "随着科尔基斯控制了整个黑海及其海上航线，这片最富饶且最强大的海域之一已经成了它自己的私人湖泊。为了航行并支配这片伟大水域，科尔基斯人已经突破过去的限制，如今能够建造最伟大的船只，让它们巡弋浪涛，保障自身的海上未来。"
 me_colchis_32_title:0 "霸权舰队"
 me_colchis_3_desc:0 "最近，一群来自辛普勒伽得斯以外的特定商人受到狄奥斯库里亚斯港的欢迎。矿产、黄金、毛皮、食品和家具的财富常是城中话题，但这些奇特的人因他们的花卉而备受喜爱。\n\n他们沿街和河岸漫步，手持蓬松的黄色花头，茎粗壮，队伍中还有不畏烈日炙烤的奴隶。士兵是他们的最大客户，夜晚旅店充满异常响亮的笑声，而晨间的病痛从未听闻或可见。当地供奉格梅尔提的祭司甚至购买了一束花，路过时表示，若能让河岸全年盛开这些奇特的黄色花蕾，将为人民带来极大福祉。"
 me_colchis_3_title:0 "神奇植物"
 me_colchis_4.a:0 "只要不亵渎他们的奉献神龛即可。"
 me_colchis_4.b:0 "为战车手建造一座宏伟的神庙！"
 me_colchis_4.c:0 "狄奥斯库里及其神龛将仅由我们崇拜。"
 me_colchis_4_desc:0 "作为伟大的旅行者、战车手和殖民者，狄奥斯库里在已知世界广受尊崇。然而，在黑海沿岸，他们尤受喜爱，狄奥斯库里亚斯的所有语言都知晓他们的名字，并在登船前祈祷。我们有责任在我们这片土地上维护他们的威望。"
 me_colchis_4_title:0 "狄奥斯库里崇拜"
 me_colchis_5.a:0 "苏阿尼人须自力更生。"
 me_colchis_5.b:0 "我们全力支持苏阿尼人！"
 me_colchis_5.c:0 "苏阿尼人一直需要自己的港口……"
 me_colchis_5.c.t:0 "#Y 狄奥斯库里亚斯#!城将成为#E 科尔基斯#!的#T 苏阿尼#!#Y 同盟城邦#!。"
 me_colchis_5.d:0 "希腊人是我们的商业盟友。"
 me_colchis_5.e:0 "苏阿尼人在政治上长期是我们的一根刺。"
 me_colchis_5.e.t:0 "#E [suani_leader.GetName]#! 在 #Y 斯凡王国#! 旗帜下挑起内战。"
 me_colchis_5.f:0 "苏阿尼人是科尔基斯最强大的战士。"
 me_colchis_5.f.t:0 " 你将切换为扮演 #Y 斯凡王国#!。"
 me_colchis_5_desc:0 "来自山区的神秘苏阿尼人常到狄奥斯库里亚斯的集市出售精美的杰作。他们的工坊和摊位是最受欢迎的，本身就是奇观，既简朴又华丽。最近，许多苏阿尼人选择留在港口城镇，但他们较为隐秘的传统习俗与常驻城镇的居民（而非流动商人）发生冲突。对这些居民而言，苏阿尼人是怪异且不可信的群体，应收拾行囊返回山间小径。\n\n由于我们境内和城镇居住着许多苏阿尼部落，他们的语言和文化对科尔基斯人而言不那么陌生，若干部落领袖派遣使者到我们的宫廷，希望我们与狄奥斯库里亚斯的地方行政协商保护安排。"
 me_colchis_5_title:0 "苏阿尼杰作"
 me_colchis_6.a:0 "这座防护堡垒将熠熠生辉！"
 me_colchis_6_desc:0 "城堡高大威猛，俯瞰着穿越其前铺设道路的商队和信使。从这里可以管理大量地方贸易和保护事务，许多高位人士蜂拥而至，城墙上点缀着闪耀的宝石。"
 me_colchis_6_title:0 "守护的珠宝"
 me_colchis_7.a:0 "家禽将装满我们人民的盘子。"
 me_colchis_7.b:0 "或许其他地区对这种鸟有兴趣？"
 me_colchis_7.c:0 "这听起来像是地方问题……"
 me_colchis_7_desc:0 "由于我们沿发西斯河的投资与建设，当地雉鸡数量激增，颇为滑稽，这些雉鸡从茂密的森林高地下来，饮用溪流和河边的水。它们为自然景观增添了可爱色彩，但小群雉鸡开始干扰人们的日常事务。\n在这一现象成为农民和工人的更大问题之前，我们该如何应对？"
 me_colchis_7_title:0 "雉鸡之地"
 me_colchis_8.a:0 "让人民涌向河岸，收获家乡的财富，繁荣昌盛。"
 me_colchis_8.b:0 "王室将控制河中淘金，因为这是王室的土地。"
 me_colchis_8_desc:0 "我们的人民习惯将羊的蓬松毛皮浸入发西斯河中。若运气好，取出毛皮时可能呈现太阳般的颜色，沾满了金屑。最近，一名不知姓名的农民在河中发现了大量金块和金粒。许多人从村庄、工坊、农场蜂拥而至，试图亲手从河中筛选财富。这一发展令宫廷中一些人担心民事生产力……"
 me_colchis_8_title:0 "毛皮筛选"
 me_colchis_9.a:0 "这件宝物将吸引各地希腊人的好奇！"
 me_colchis_9.b:0 "我们将仪式性地销毁这块石头，谴责那些海盗般的阿尔戈英雄。"
 me_colchis_9.c:0 "或许希腊人会愿意购买伊阿宋的遗产……"
 me_colchis_9.d:0 "这只是一块石头，仅此而已。驱逐这个谎言连篇的白日梦者。"
 me_colchis_9_desc:0 "一名卑微的流浪者面带笑容进入宫廷，手中持有一块普通石头，向所有人展示并宣称其具有神话起源。他们说，这块石头是阿尔戈英雄伊阿宋在科尔基斯试炼中，向从龙牙中生长出的战士投掷的石头之一——在阿尔戈英雄逃亡时航行的发西斯河床中发现。这些石头分散了战士的注意力，使伊阿宋得以击败他们，协助他偷走了科尔基斯视为神圣的金羊毛。这块石头，即便真是那场战斗的遗物，也助长了我们传奇领袖的失败。我们如何能以正面态度看待它？"
 me_colchis_9_title:0 "过去的碎片"

l_simp_chinese:
 01_tasm_missions:0 "自沙漠中，他们将抵达"
 01_tasm_missions_2:0 "像沙漠中的沙子"
 01_tasm_missions_2_BUTTON_TOOLTIP:0 "据说塔斯姆的劫掠大军如沙漠中的沙那样无穷无尽。"
 01_tasm_missions_2_CRITERIA_DESCRIPTION:0 "当#E 塔斯姆#!王国将强大的邻国拱手相让，将它们永恒的荣耀据为己有时，这个使命才算完成。"
 01_tasm_missions_2_DESCRIPTION:0 "现在，胜利的[ROOT.GetCountry.GetAdjective]部队已经将#E 阿拉伯半岛#!的全部势力纳入麾下，我们的将军和军事顾问建议我们将我们的霸权扩展到两边围绕我们的强大国家的土地上。\n\n我们将毫无预警地打击他们，像埋在沙丘中的城市一样从沙漠中消失又重新出现……"
 01_tasm_missions_2_philosopher:0 "#T Ba'l'Ahd#!任职者至少需要9个@religious_icon! #Y Zeal#!。"
 01_tasm_missions_2_task_1:0 "知名建筑师"
 01_tasm_missions_2_task_10:0 "阿拉伯的蓬特"
 01_tasm_missions_2_task_10_DESC:0 "在#E 蓬特#!有许多地方是[ROOT.GetCountry.GetAdjective]扩张的令人兴奋的候选人，其中阿拉伯湾岸边的[GetProvince('(int32)7519').GetName]城市是最有希望的。让我们做必要的工作，使阿非利加的这一部分感觉到是我们国家的一个自然延伸。\n\n\n\n\n\n\n\n\n\n@event_pic4!。"
 01_tasm_missions_2_task_10_pops_loc_1:0 "(#R [SCOPE.ScriptValue('svalue_01_tasm_missions_2_task_10_pops_current')|0]#!/#Y [SCOPE.ScriptValue('svalue_01_tasm_missions_2_task_10_pops_total')|0]#!)"
 01_tasm_missions_2_task_10_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('svalue_01_tasm_missions_2_task_10_pops_current')|0]#!/#Y [SCOPE.ScriptValue('svalue_01_tasm_missions_2_task_10_pops_total')|0]#!)"
 01_tasm_missions_2_task_10_tt:0 "在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!拥有的#Y $punt_region$#!地区的#Y [SCOPE.ScriptValue('svalue_01_tasm_missions_2_task_10_pops_absolute_total')|0]#!人口中，至少有#Y 80%#!是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!。[SCOPE.GetRootScope.GetCountry.Custom('01_tasm_missions_2_task_10_pops_loc')]"
 01_tasm_missions_2_task_11:0 "龙血岛"
 01_tasm_missions_2_task_11_DESC:0 "#E 迪俄斯科里杜斯#!，一个经常被穿梭于厄律特莱海的商船所光顾的岛屿，可能被说服和平地加入我们的王国。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 01_tasm_missions_2_task_12:0 "夺回属于我们的土地"
 01_tasm_missions_2_task_12_DESC:0 "曾经统治过#E 美索不达米亚#!的古代文明是新世界的建设者和创造者——与现在统治该省的腐朽和软弱的统治者完全不同！\n\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 01_tasm_missions_2_task_13:0 "巴比伦的大门"
 01_tasm_missions_2_task_13_DESC:0 "[ROOT.GetCountry.GetAdjective]子民中，谁人能比[ROOT.GetCountry.GetRuler.GetName]？这位征服者、毁灭者、万王之王与诸城吞噬者！从[ROOT.GetCountry.GetCapital.GetName]的城墙到#E 巴比伦#!的城门，[ROOT.GetCountry.GetRuler.GetHerHis]的权威至高无上。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 01_tasm_missions_2_task_14:0 "东方财富传说"
 01_tasm_missions_2_task_14_DESC:0 "我们在#E Dioscoridus#!的联系人说，在遥远的东方有一连串的岛屿，被称为#E Maldives#!，虽然它离[ROOT.GetCountry.GetName]很远，但我们无畏的水手声称知道路。\n\n在这个遥远的地方，对我们人民生产的稀有贸易品有需求，特别是没药之类的香--我们应该考虑派商人去Maldives，建立我们的贸易联系。\n\n\n\n\n\n\n\n\n\n@india_mil4!。"
 01_tasm_missions_2_task_15:0 "确保贸易路线安全"
 01_tasm_missions_2_task_15_DESC:0 "我国在[ROOT.GetCountry.GetName]全境修筑的防御工事体系，乃国家安全之基石......然须确保各要塞皆能迅捷驰援——当务之急是修筑道路。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 01_tasm_missions_2_task_16:0 "军用骆驼"
 01_tasm_missions_2_task_16_DESC:0 "世间何种生灵堪比骆驼？这\"沙漠之舟\"无需饮水便能长途跋涉——实乃令人惊叹的奇兽。长久以来，骆驼始终是我军不可或缺的重要战力。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 01_tasm_missions_2_task_17:0 "阿克苏姆山地作战"
 01_tasm_missions_2_task_17_DESC:0 "阿克苏姆人所居的崎岖山地，迫使他们发展出独特的战术体系——我们应当研习其战法，并将这些军事技艺融入我军的训练之中。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 01_tasm_missions_2_task_18:0 "阿非利加贸易"
 01_tasm_missions_2_task_18_DESC:0 "若我们着力发展非洲贸易，整个[ROOT.GetCountry.GetAdjective]国度——无论公民还是奴隶——都将受益。 \n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 01_tasm_missions_2_task_19:0 "黑石"
 01_tasm_missions_2_task_19_DESC:0 "传说有件名为#Y 黑石#!的圣物，乃自天降之神赐，现供奉于[GetProvince('(int32)7575').GetName]圣地。此等天赐瑰宝，合该为我所有！ \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_tasm_missions_2_task_1_DESC:0 "虽然我们胜利了，但众神无常，命运转瞬即逝，没有人知道明天会发生什么--也许是一支入侵的军队希望在我们的边防堡垒面前措手不及？我们必须采取一切措施，确保进入Arabia中心地带的陆路通道受到坚固城市的保护......任何不负责任的做法都是不负责任的。\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 01_tasm_missions_2_task_2:0 "进军阿非利加"
 01_tasm_missions_2_task_20:0 "进入阿非利加"
 01_tasm_missions_2_task_20_DESC:0 "如今我国已征服#E 非洲#!部分地区，关于该区域的未来规划，亟待重要决策。\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 01_tasm_missions_2_task_21:0 "以色列社区"
 01_tasm_missions_2_task_21_DESC:0 "如今在[GetProvince('(int32)4667').GetArea.GetRegion.GetName]地区，散布着诸多#E 以色列#!聚落——而很快，[ROOT.GetCountry.GetName]将把这些聚居地尽数纳入统治。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 01_tasm_missions_2_task_22:0 "神庙什一税"
 01_tasm_missions_2_task_22_DESC:0 "尽管有人抱怨需向神庙缴纳十一税，但若非如此，我等何以取悦众神、得其庇佑？须知世间确有比金钱更珍贵之物。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_tasm_missions_2_task_23:0 "黄金摇篮"
 01_tasm_missions_2_task_23_DESC:0 "我国国库急需[GetProvince('(int32)8890').GetName]周边富集的金矿资源——务必尽快在当地兴建矿场。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_tasm_missions_2_task_2_DESC:0 "众所周知，蓬特之地蕴藏着我们[ROOT.GetCountry.GetAdjective]领地内罕见的丰富资源。待准备就绪，我们将夺取非洲人的贵金属、香料和象场，为我所用。\n\n\n\n\n\n\n\n\n\n@egypt_mil20!"
 01_tasm_missions_2_task_3:0 "三个拳头"
 01_tasm_missions_2_task_3_DESC:0 "由于我们的工程师为创造[ROOT.GetCountry.GetCapital.GetName]所付出的辛勤工作，他们已经变得异常熟练，并且能够在我们整个国家应用他们所学到的经验。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!@egypt_mil4!。"
 01_tasm_missions_2_task_4:0 "佣兵思维"
 01_tasm_missions_2_task_4_DESC:0 "我们的[ROOT.GetCountry.GetAdjective]军团是由我们国家现有的最好的部队组成的，代表了我们军事精英的精华。当我们把贵族子弟送入对外征服的战争时，我们决定用从雇佣兵营中抽调的辅助人员来补充他们的人数。\n\n\n\n\n\n\n\n\n\n@persia_mil1!。"
 01_tasm_missions_2_task_5:0 "沙漠中的花园"
 01_tasm_missions_2_task_5_DESC:0 "我们必须采取必要的措施，把[ROOT.GetCountry.GetCapital.GetName]建成一个真正的大都市--让世界各国看看我们在阳光灼热的土地上所取得的成就，并惊叹于我们无尽的智慧。\n\n\n\n\n\n\n\n\n\n@egypt_mil17!@egypt_mil17!\n\n\n\n\n\n\n\n\n\n。"
 01_tasm_missions_2_task_6:0 "扬帆驶向苏美尔"
 01_tasm_missions_2_task_6_DESC:0 "#E 卡拉刻涅#!省是通往古老的#E 美索不达米亚#!领域的门户，是帝国的发源地。我们设想了一个未来，在那里我们将控制这片历史悠久的土地上的传奇城市……时间几乎就在我们身边。\n\n\n\n\n\n\n\n\n\n@egypt_mil7!。"
 01_tasm_missions_2_task_7:0 "恶名昭彰的奴隶主"
 01_tasm_missions_2_task_7_DESC:0 "现在我们在#E 阿非利加#!和#E 美索不达米亚#!有了立足点，现在是时候让我们的袭击者摆脱束缚，让他们在敌人不设防的省份和城市大快朵颐了——告诉我们的人，他们可以自由支配，尽可能多地奴役我们的敌人。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!。"
 01_tasm_missions_2_task_8:0 "古蒂发掘现场"
 01_tasm_missions_2_task_8_DESC:0 "一千多年前，#E 美索不达米亚#!的南部土地被一个几乎消失的国家所统治，只留下了一些文明的痕迹。幸运的是，我们中间有一位学者声称知道一个我们应该调查的考古遗址。\n\n#Y 这将触发一个事件链，我们将开始寻找宝藏。#!\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_tasm_missions_2_task_9:0 "沙漠铁骑"
 01_tasm_missions_2_task_9_DESC:0 "我们在更广阔世界中的贸易联系让我们注意到一种马，它的天然栖息地位于北方草原。虽然我们的气候相对严酷，但我们的骑术大师认为，我们可以在#E 阿拉伯#!开始饲养草原马。\n\n#Y 这将开启一条事件链，使我们有机会在当前生产#T 马匹#!的一个省份生产#T 草原马#!。#!\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 01_tasm_missions_BUTTON_TOOLTIP:0 "变动的沙漠沙地在你面前分开，露出远处的城市，高耸的石灰岩尖顶在阳光下闪闪发光——塔斯姆。"
 01_tasm_missions_CRITERIA_DESCRIPTION:0 "当#E 塔斯姆#!的部落征服了整个阿拉伯半岛并建立了一个强大而雄伟的王国时，这个使命才算完成。"
 01_tasm_missions_DESCRIPTION:0 "在#E 阿拉伯#!的中心地带，在如此荒凉的土地上，人们认为生命不可能在那里繁衍，只有最强壮的人才能生存--这就是[ROOT.GetCountry.GetAdjective]人的家园，在那里，雷神统治着强大的战士，他们是这个最严酷地形的主人。"
 01_tasm_missions_task_1:0 "来自沙漠的呼唤"
 01_tasm_missions_task_10:0 "贸易大师"
 01_tasm_missions_task_10_DESC:0 "我们在[ROOT.GetCountry.GetCapital.GetName]储存的过剩的奢侈品，使我们的首都获得了拥有整个#E 阿拉伯#!最好的市场的声誉——我们是整个半岛公认的贸易大师。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 01_tasm_missions_task_11:0 "沙漠中的花朵"
 01_tasm_missions_task_11_DESC:0 "虽然我们是[GetProvince('(int32)8819').GetArea.GetName]沙漠中的外国人，但没有人可以否认我们把[ROOT.GetCountry.GetAdjective]文化带到了一个以前没有的地方。从[GetProvince('(int32)8819').GetName]的地区首府，我们的影响像野火一样在沙漠的风中蔓延。\n\n让我们现在确保我们能养活这些不断增长的文明中心......\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_tasm_missions_task_12:0 "耶马迈文化的堡垒"
 01_tasm_missions_task_12_DESC:0 "即使我们的命运召唤我们走向我们祖先未知的土地，#E 耶马迈#!和#E 舍迈尔#!省将永远是我们文化的堡垒，是[ROOT.GetCountry.GetAdjective]人可以安全的堡垒。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_tasm_missions_task_13:0 "西部舰队"
 01_tasm_missions_task_13_DESC:0 "虽然这将是昂贵的，并且需要大量劳动者的共同努力，但我们可以下达命令，在#E 阿拉伯海#!建造一支大规模的舰队，以保护我们在该水域的权利。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_tasm_missions_task_14:0 "智慧之家"
 01_tasm_missions_task_14_DESC:0 "意识到正是我们敌人的知识给了他们战胜我们的力量，[ROOT.GetCountry.GetRuler.GetName]已经下令在[ROOT.GetCountry.GetCapital.GetName]建造一个配得上[ROOT.GetCountry.GetAdjective]人的图书馆。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_tasm_missions_task_15:0 "南方部落"
 01_tasm_missions_task_15_DESC:0 "整个#E 阿拉伯#!地区都在诱人的掌握之中，而南方的几个部落是尚未服从[ROOT.GetCountry.GetRuler.GetName]权威的少数部落之一。现在是时候把我们的军队送到比以往更远的南方去了。\n\n\n\n\n\n\n\n\n\n@celt_mil1!。"
 01_tasm_missions_task_16:0 "生与死的问题"
 01_tasm_missions_task_16_DESC:0 "我们与#E 革耳剌#!军队的激烈冲突使我们相信有必要彻底摧毁他们的王国，更重要的是，我们必须将他们的祖传土地据为己有，拒绝他们。如果我们完成了这些梦想，那么将在[ROOT.GetCountry.GetCapital.GetName]举行庆典。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 01_tasm_missions_task_17:0 "明珠地区"
 01_tasm_missions_task_17_DESC:0 "#E 堤洛斯#!，这个以精美的宝石和珍珠而闻名的岛屿城市，实际上正在呼唤着扩张；让我们束起腰来，真正看看我们能在这个宏伟的岛屿上做些什么。\n\n\n\n\n\n\n\n\n\n@event_pic1!。"
 01_tasm_missions_task_18:0 "东俄马纳"
 01_tasm_missions_task_18_DESC:0 "虽然我们没有受到生活在我国腹地的#E Samad#!部落的威胁，但我们不想让一个无法无天的环境在我们的边界附近滋生，因此我们有义务征服这些遥远的部落成员。\n\n\n\n\n\n\n\n\n\n@persia_mil9!<m id=1"
 01_tasm_missions_task_19:0 "#E 阿西尔#!的山丘，#E 基达尔#!的绿洲"
 01_tasm_missions_task_19_DESC:0 "我们所习惯的尘土飞扬的山坡和一望无际的沙丘正在让位于更坚硬、更多岩石的土地--这些土地上居住着凶猛的人，他们会对我们在他们的家乡的存在提出异议。\n\n\n\n\n\n\n\n\n\n@persia_mil20!。"
 01_tasm_missions_task_1_DESC:0 "如果我们要将我们的扩张计划付诸实施，那么我们必须召集所有可用的士兵，为未来的黑暗日子训练他们。向我们的战斗部队发出号召，告诉他们准备在沙漠中进行一场残酷的战争。\n\n\n\n\n\n\n\n\n\n@persia_mil1!。"
 01_tasm_missions_task_2:0 "北部通道"
 01_tasm_missions_task_20:0 "在#E 基达尔#!的胜利"
 01_tasm_missions_task_20_DESC:0 "进入#E 基达尔#!省，使我们有能力突袭#E 黎凡特#!和#E 美索不达米亚#!，如果我们选择的话；我们是多么幸运，成为穿越沙漠的重要路线的无可争议的主人。我们现在向南推进，将我们的领地扩展到#E 阿拉伯湾#!的海岸。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!。"
 01_tasm_missions_task_21:0 "#E 巴卡#!的石门"
 01_tasm_missions_task_21_DESC:0 "[GetProvince('(int32)8816').GetName]的战略领地以我们北方的十字路口为中心；这是通往其他地区的门户，也是进入我们领土的后门，必须不惜一切代价加以保护。\n\n\n\n\n\n\n\n\n\n@egypt_mil23!。"
 01_tasm_missions_task_22:0 "东方舰队"
 01_tasm_missions_task_22_DESC:0 "有许多成熟的国家在#E 波斯湾#!的水域中穿梭，我们应该小心进入这个拥挤的舞台。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 01_tasm_missions_task_23:0 "沙漠中的王国"
 01_tasm_missions_task_23_DESC:0 "我们已经征服了很多地方，创造了一个名副其实的王国——让我们放弃赋予我们的部落方式，接受我们在世界国王中的应有地位。一旦[ROOT.GetCountry.GetRuler.GetName]登上王位，我们将向#E 阿拉伯#!所有尚未臣服于我们神圣权威的省份发出宣称。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 01_tasm_missions_task_24:0 "必须夺取沿海地区"
 01_tasm_missions_task_24_DESC:0 "从山区的最高点，我们可以看到#E Sinus Arabicus#!的闪亮的水面就在眼前。我们将尽一切努力确保这只是暂时的状况，然而，必须夺取海岸！\n\n\n\n\n\n\n\n\n\n<m id=3><m id=4><m id=5><m id=6><m id=7>！\n\n\n\n\n\n\n\n\n\n@egypt_mil17!@egypt_mil17!\n\n\n\n\n\n\n\n\n\n。"
 01_tasm_missions_task_25:0 "双子城"
 01_tasm_missions_task_25_DESC:0 "如果我们开发#E Yathill#!和#E Karna#!这两个邻近的城市，我们将赚得盆满钵满--在没有我们的指导下，它们已经在蓬勃发展，这对我们的投资是个好兆头。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!的骆驼农场"
 01_tasm_missions_task_26:0 "#E 塔保阿#!的骆驼饲场"
 01_tasm_missions_task_26_DESC:0 "我们的社会在很大程度上依赖于骆驼的运输，因为在穿越我们居住的沙漠荒原时，它们是更有能力的驮兽。在[ROOT.GetCountry.GetCapital.GetName]中已经决定，我们需要发展那些饲养骆驼的领土，确保我们总是有多余的骆驼可以使用。\n\n\n\n\n\n\n\n\n\n@egypt_mil8!@egypt_mil8!\n\n\n\n\n\n\n\n\n\n。"
 01_tasm_missions_task_2_DESC:0 "虽然这需要时间和资源，但我们可以召集一些部落的人，让他们居住在现在只有商队和强盗经常出入的北部通道。因为我们没有很多人愿意搬家，所以我们要用一些士兵来代替。\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 01_tasm_missions_task_3:0 "与革耳剌的冲突"
 01_tasm_missions_task_3_DESC:0 "我们渴望为自己进入#E 波斯湾#!的水域，然而有一个问题；迅速注意到我们发展的革耳剌军队挡住了我们的去路。我们在#E 乌克鲁什#!省的共同利益无疑将导致我们伟大民族之间的冲突。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!。"
 01_tasm_missions_task_4:0 "攥紧沙姆马尔"
 01_tasm_missions_task_4_DESC:0 "虽然我们在为自己确保#E 舍迈尔#!省的安全方面取得了进展，但如果我们想从他们手中夺取通往绿洲的大门的控制权，我们就必须与基达尔人作战。\n\n在我们发动战争之前，我们必须确保我们已经补充了我们在该省所花的人力。\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 01_tasm_missions_task_5:0 "贾迪斯与我们同在"
 01_tasm_missions_task_5_DESC:0 "几个世纪以来，我们的部落和南方的近亲#E 贾迪斯#!一直在属于彼此的土地上自由游荡，我们的人民之间没有真正的区别——但现在是改变这种松散安排的时候了。\n\n#Y 这将触发一个事件链，最终可能导致我们吞并贾迪斯的领土。#!\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 01_tasm_missions_task_6:0 "沿海地区的城市"
 01_tasm_missions_task_6_DESC:0 "我们以前与革耳剌的激烈冲突，除了使我们的士兵更坚定地将他们赶出他们的家园外，没有任何作用——一个新的未来在等待着我们，一个我们敌人的城市成为我们家庭家园的未来。但在我们庆祝之前，光荣的战斗召唤着我们! \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_tasm_missions_task_7:0 "庆祝的理由"
 01_tasm_missions_task_7_DESC:0 "我们的敌人继续粉碎那些从未预料到会在我们手中灭亡的敌人，[ROOT.GetCountry.GetAdjective]士兵的声誉继续增长。由于这种可怕的声誉，我们军队的士气从来没有这么高过。\n\n\n\n\n\n\n\n\n\n@persia_mil16!@persia_mil16!\n\n\n\n\n\n\n\n\n\n。"
 01_tasm_missions_task_8:0 "向海洋扩张"
 01_tasm_missions_task_8_DESC:0 "我们不能停止我们的战争行动，而是应该乘势而上，直到我们所有的小敌人都被制服。沿海贸易路线上的富裕城市对我们的前进感到害怕，希望他们能够抵御我们的围攻——让我们向他们表明，这个世界上没有安全。\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 01_tasm_missions_task_9:0 "一个新的首都"
 01_tasm_missions_task_9_DESC:0 "在[ROOT.GetCountry.GetAdjective]历史上，我们第一次征服了靠近水体的城市--这是通往我们目前一无所知的更广阔世界的大门。有人建议我们将首都迁往这些古城之一，以利用与海洋的联系，但有很多人反对。\n\n#Y 我们将有机会把首都迁至新地。#!\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_tasm_missions_task_9_tt:0 "考虑将我们的首都从[Player.GetCapital.GetName]迁到一个更繁荣的地方。"
 desc_spreading_tasmite_influence:0 "由于我们对阿非利加的投资，我们的文化在外国土地上扩展和成长。"
 desc_tasm_abandoned_capital_mod:0 "我们的部落成员对我们抛弃了埋葬他们父亲的沙漠感到愤怒。"
 desc_tasm_camel_farms:0 "在塔保阿附近饲养的骆驼因其耐力和恢复力而受到重视。"
 desc_tasm_cheaper_slaves_cost:0 "我们将人民迁入无人居住的新领土的技能是无与伦比的。"
 desc_tasm_city_in_africa:0 "在我们的努力下，阿巴瑟尼亚正在成为该地区的一个重要城市。"
 desc_tasm_desert_metropolis_reward:0 "我们在人类居住的最严酷的土地上建立了一个大都市--证明了我们永恒的荣耀。"
 desc_tasm_egypt_tribute:0 "可怕的Egyptians迫使我们向他们进贡。"
 desc_tasm_farms_in_shammar:0 "我们对舍迈尔省进行了大量投资，维护农场，使我们的人民有面包吃。"
 desc_tasm_fortress_of_culture:0 "尽管沿海城市吸引了来自世界各地的人们，但阿拉伯的内陆地区拒绝这些世界性的影响，而更愿意成为耶马迈文化的堡垒。"
 desc_tasm_glorious_battle_awaits:0 "我们的士兵为在最荒凉的地形上进行的恶性战役做好了充分的准备。"
 desc_tasm_glorious_battle_in_desert:0 "我方骑乘部队擅长在沙漠中作战，这无疑源于严格的"
 desc_tasm_historic_capital_mod:0 "我们的人民认为我们祖先的首都的位置是神圣的，决定留在Arabia的中心，而不是搬迁到靠近海岸的地方。"
 desc_tasm_house_of_wisdom:0 "我们在这个城市建立了一个宏伟的图书馆，作为[ROOT.GetCountry.GetAdjective]人知识的容器--一个智慧之家。"
 desc_tasm_indian_trade:0 "我们的商人航行到遥远的马尔代夫，出售在阿拉伯生产的香，并带着宝贵的货物返回家园。"
 desc_tasm_joined_houses_with_jadis:0 "我们已经与我们的表亲贾迪斯联合起来，将我们的力量与他们的力量结合起来。"
 desc_tasm_mercenary_minded:0 "为了更有效地进行我们的对外战争，我们在战场上利用雇佣军。"
 desc_tasm_pearl_divers_tylos:0 "我们在堤洛斯市进行了大量的投资，花费巨资建立了宝石市场，并创建了一个被当地人称为\"The Pearl Quarter\"的地区。"
 desc_tasm_regional_center_of_trade:0 "这座城市是最重要的地区贸易中心之一，商人们从很远的地方赶来参观它的市场。"
 desc_tasm_ships_of_the_desert:0 "我们的骆驼是我们贸易网络的骨干，以与它们的体积不相称的速度穿越我们家园的沙漠公路。"
 desc_tasm_slave_market:0 "这个城市有一个广泛的奴隶市场。"
 desc_tasm_slavers_ill_repute:0 "我们的敌人害怕我们的游动奴隶船，因为我们在没有任何警告的情况下出击，把我们邻居的儿子和女儿带到奴隶市场。"
 desc_tasm_steppe_horses_desert:0 "我们高超的动物饲养员已经成功地在沙漠山丘上饲养了草原马。"
 desc_tasm_stone_gate_fists:0 "控制进入阿拉伯的陆地路线的令人印象深刻的堡垒被统称为\"The Three Fists\"（三个拳头），据传是坚不可摧的。"
 desc_tasm_stone_gates_of_baqaa:0 "该省令人印象深刻的防御工事为它赢得了“石门”的绰号，因为所有想穿越巴卡的人都必须通过它的大门。"
 desc_tasm_triumph_against_foes:0 "因为塔斯姆的勇士们消灭了一个强大而古老的敌人，整个社会为这一前所未有的胜利而欢欣鼓舞。为了纪念我们的勇士，首都正在分发免费的面包。"
 desc_tasmite_renowned_architects:0 "在沙漠中建造建筑物并非易事，但我们的工程师和建筑师善于完成不可能完成的任务。"
 dominant_shammar_capital_tt:0 "#Y 布赖达#!必须是#Y 舍迈尔#!省的区域首都。"
 horn_claims_2_tasm_tt:0 "我们已经收到了对#Y 埃莱法斯#!和#Y 津吉斯#!省份的宣称。"
 me_tasm_1.a:0 "有很多事情我们必须做。我希望你们准备好工作，并努力工作"
 me_tasm_10.a:0 "在我所做的一切之后，我应该为自己得到一点。"
 me_tasm_10_desc:0 "大量的财富流入[ROOT.GetCountry.GetCapital.GetName]，似乎既带来了祝福也带来了诅咒。贸易比以往任何时候都要好，骆驼商队蜿蜒穿过我们的沙漠，在创纪录的时间内完成了首都和海岸之间的旅行。\n\n所有这些都值得庆祝，但[ROOT.GetCountry.GetRuler.GetName]对偷窃国库的嗜好开始成为一个问题。"
 me_tasm_10_title:0 "$01_tasm_missions_task_10$"
 me_tasm_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_tasm_11.a:0 "我们人民的雄心壮志是一种激励"
 me_tasm_11_desc:0 "在我们阳光普照的土地上建造任何东西都不是一件容易的事，原因显而易见，但做不可能的事是我们[ROOT.GetCountry.GetAdjective]的同胞所擅长的。\n\n现在我们已经成功地在人类已知的一些最荒凉的地区种植农作物，我们现在把目光放在一个更大的奖赏上--在沙丘中建造城市，有一天会像沙漠中的花朵一样绽放。"
 me_tasm_11_title:0 "$01_tasm_missions_task_11$"
 me_tasm_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_tasm_12.a:0 "塔斯姆家园应成为我们文化的堡垒"
 me_tasm_12_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]梦想在整个#E 阿拉伯半岛#!扩展我们的边界时，[ROOT.GetCountry.GetRuler.GetSheHe]同样致力于确保我们的家园，#E 耶马迈#!和#E 舍迈尔#!省，保留他们在耶马迈文化中心的核心地位。\n\n通过在我们的传统领土上建造两个城市，我们已经创造了必要的基础设施，使我们能够在多年后不断升级我们的家园，这将随着时间推移收获无数好处。\n\n\n尽管征服那些甚至还不知道我们存在的土地可能是我们的命运，但愿我们永远不要忘记把我们带到这些崇高高度的人——耶马迈人，让我们尊重他们为使我们成为今天的人所做出的牺牲。"
 me_tasm_12_title:0 "$01_tasm_missions_task_12$"
 me_tasm_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_tasm_13.a:0 "这是一项光荣的工作，为[ROOT.GetCountry.GetName]而战。"
 me_tasm_13_desc:0 "如今巡逻于#E 阿拉伯湾#!水域的西方舰队，其水手由一群奇特的人组成。埃及人、阿拉伯人和马其顿人都涌向[ROOT.GetCountry.GetRuler.GetName]修建的新城——#E 劳纳图科墨#!、#E 阿尔加#!和#E 阿拉伯忒拜#!——那里正在征募愿意在[ROOT.GetCountry.GetAdjective]舰队中操桨的人。\n\n无论他们来自何处，所有人都因同一个目标团结起来：保卫我们的财产，并赶走任何企图袭击我们城市的海盗。"
 me_tasm_13_title:0 "$01_tasm_missions_task_13$"
 me_tasm_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_tasm_14.a:0 "这个图书馆是教育人民的第一步"
 me_tasm_14_desc:0 "被称为#E 'The House of Wisdom'#!的宏伟建筑已经在[ROOT.GetCountry.GetCapital.GetName]完成，所有人都认为在整个[ROOT.GetCountry.GetName]从未见过如此宏伟的建筑。用各种语言写成的卷轴填满了大理石凹槽，一群牧师和文士住在那里，默默地维护着这个令人印象深刻的图书馆。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]，作为一个有远见的人，他重视知识和知识的实施，并希望[ROOT.GetCountry.GetAdjective]人变得有智慧，充满良好的辨识力。在这些原则的指导下，没有什么代价是太大的，所需的一切都免费给予。"
 me_tasm_14_title:0 "$01_tasm_missions_task_14$"
 me_tasm_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_tasm_15.a:0 "既然我们走上了这条道路，就没有什么可以阻止我们了"
 me_tasm_15_desc:0 "我们对#E Asir#!省的遥远领土的控制打开了通往南部王国富饶土地的道路，在那里，许多富有的参议员和两面三刀的部落军阀都在等待着我们的征兵的到来，心中充满了惶恐和厌恶。\n\n现在，用不了多久，我们的士兵就会从沙漠中涌出，涌入他们的城市和定居点，像沙暴一样笼罩着一切。我们将征服南部的部落，夺取他们为自己建立的一切。"
 me_tasm_15_title:0 "$01_tasm_missions_task_15$"
 me_tasm_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_tasm_16.a:0 "那些梦想毁灭我们的人，只会给自己带来毁灭。"
 me_tasm_16_desc:0 "我们胜利的军队保证了[ROOT.GetCountry.GetRuler.GetName]的名字永远不会被保存[ROOT.GetCountry.GetAdjective]人记录的部落长老们忘记，因为我们[ROOT.GetCountry.GetRulerTitle]带来的胜利将永远改变我们民族的历史。 \n\n多年来，傲慢的#E 革耳剌#!公民用来自远方的香油涂抹他们的胡须，并因大吃大喝而变得肥胖和虚弱，依靠他们的城墙来保护他们，但这不再是了。\n\n我们不仅把他们从他们的核心土地，即为他们部落命名的省份赶了出来，而且我们还熄灭了他们的文明，完全拆毁了他们的政治地位。他们再也不会成为一个自由的民族，他们只为服务于[ROOT.GetCountry.GetRuler.GetFirstName]的意志而活着。\n\n为了纪念这个史无前例的时刻，在接下来的十年里，[ROOT.GetCountry.GetCapital.GetName]将提供免费的面包，作为纪念和庆祝我们成就的方式。"
 me_tasm_16_title:0 "$01_tasm_missions_task_16$"
 me_tasm_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_tasm_17.a:0 "堤洛斯将成为波斯湾中最重要的港口。"
 me_tasm_17_desc:0 "[GetProvince('(int32)7202').GetName]的声誉已经众所周知，但[ROOT.GetCountry.GetRuler.GetName]为扩大城市规模所做的努力给这个已经令人印象深刻的地方带来了更多的名声和声誉。\n\n为了加强宝石贸易，[ROOT.GetCountry.GetRuler.GetFirstName]将其港口和市场的规模扩大了四倍，创造了当地人所称的#E 'The Pearl Quarter'#!，无疑是由于在其拱廊中销售镶有珍珠的珠宝的商人数量太多。 \n\n只要太阳挂在堤洛斯的天空中，就会有男人造船的声音，水手们装载珍珠、香料、奴隶和香火的货物的声音，还有饥饿的海鸥的叫声在码头上飘荡。"
 me_tasm_17_title:0 "$01_tasm_missions_task_17$"
 me_tasm_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_tasm_18.a:0 "那么，我们很快就会向俄马纳进军——谢谢你"
 me_tasm_18_desc:0 "今天我们不会打扰您太久，[ROOT.GetCountry.GetRuler.GetName]，只是想告知您，我们在#E 东俄马纳#!的最新宣称已全部完成。\n\n我们的突袭部队迫不及待地想要对毫无防备的民众发起攻击……这将是一个属于[ROOT.GetCountry.GetName]的好日子。"
 me_tasm_18_title:0 "$01_tasm_missions_task_18$"
 me_tasm_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_tasm_19.a:0 "如果有人能做到这一点，那么我们的Tasmite部落成员可以"
 me_tasm_19_desc:0 "我们发现自己处于一个令人羡慕的位置，必须同时处理两条战线。#E 基达尔#!省的沙漠，以及富饶的绿洲城市[GetProvince('(int32)8815').GetName]和它的枣园，是一个诱人的战利品，就在地平线之外，但我们不能忽视南方的通道，通过#E 阿西尔#!下至#E 阿拉伯湾#!的海岸，因为有许多强大的王国，如果我们不小心就会摧毁我们。\n\n我们必须在准备好我们的宣称的同时，做好最坏的打算。"
 me_tasm_19_title:0 "$01_tasm_missions_task_19$"
 me_tasm_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_tasm_1_desc:0 "在过去的几个星期里，我们的[ROOT.GetCountry.GetAdjective]弟兄们一直在穿越沙漠，到达[ROOT.GetCountry.GetCapital.GetName]的绿洲，在我们的定居点外聚集的部落成员的篝火作为一个灯塔。\n\n[ROOT.GetCountry.GetRuler.GetName]向我们分散的战士发出号召，告诉他们要带足够维持两个战役季节的粮草。虽然没有人知道[ROOT.GetCountry.GetRuler.GetTitleName]在计划什么，但大家都认为战争很快就会来到[ROOT.GetCountry.GetName]。"
 me_tasm_1_title:0 "$01_tasm_missions_task_1$"
 me_tasm_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_tasm_2.a:0 "我是[ROOT.GetCountry.GetRuler.GetTitleName]--你要听我的！\"！"
 me_tasm_20.a:0 "掠夺和光荣的战斗在等待着！拿起武器！"
 me_tasm_20_desc:0 "没有人比[ROOT.GetCountry.GetRuler.GetName]更能记得#E 基达尔人#!的狂妄了，他非常熟悉他们的两面手法和背叛的嗜好。\n\n但他们的背信弃义不会再困扰我们了，因为[ROOT.GetCountry.GetName]的著名军队已经永远征服了#E 基达尔#!，打断了他们的腰，把他们皱巴巴的尸体留给沙漠里的秃鹰。 \n\n为了庆祝这个有价值的成就，[ROOT.GetCountry.GetRuler.GetFirstName]大胆地宣布，在成千上万的士兵的欢呼声中，[ROOT.GetCountry.GetRuler.GetSheHe]将奖励[ROOT.GetCountry.GetRuler.GetHerHis]人更多的荣耀机会，这次是在我们西部的土地上。"
 me_tasm_20_title:0 "$01_tasm_missions_task_20$"
 me_tasm_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_tasm_21.a:0 "巴卡的石门是一座不可移动的山峰"
 me_tasm_21_desc:0 "夕阳是[ROOT.GetCountry.GetRuler.GetName]和[ROOT.GetCountry.GetRuler.GetHerHis]随行人员在#E Shammar#!沙漠的尘土飞扬的隘口和峡谷中的唯一见证，当部落成员前往[GetProvince('(int32)8816').GetName]的避难所时，他们在沙地和天空中画上了辉煌的紫色和红色。 \n\n当[ROOT.GetCountry.GetAdjective]一行人进入通往巴卡的山谷时，越来越浓的阴霾让远处勉强可见的堡垒更加令人印象深刻和不祥。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]来检查最近完成的防御工事升级，它控制着通过这个荒芜地区的唯一路径——任何希望前往北方或南方的人必须得到里面守军的许可。"
 me_tasm_21_title:0 "$01_tasm_missions_task_21$"
 me_tasm_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_tasm_22.a:0 "我们已经习惯了更艰苦的条件，相信我。"
 me_tasm_22_desc:0 "值得庆幸的是，在海军方面，我们的东翼不需要那么多的工作来改善。已经有了我们可以用作港口的城市，#E Attiaca#!的地点被海盗所青睐是有原因的--我们在那里建造了一座城市，即使周围的乡村是荒凉和废弃的，我们也做得不错。"
 me_tasm_22_title:0 "$01_tasm_missions_task_22$"
 me_tasm_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_tasm_23.a:0 "给我对敌人提出宣称，这样我就可以最终统一阿拉伯了。"
 me_tasm_23_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的加冕仪式是一个低调的事件，它反映了[ROOT.GetCountry.GetRulerTitle]的严厉形象，他在涉及到盛典的问题上是以朴素著称的。仪式很短，之后的庆祝活动更短，当第二天早上太阳从[ROOT.GetCountry.GetCapital.GetName]上升起时，军队已经在马鞍上待了几个小时。\n\n当被问及[ROOT.GetCountry.GetRuler.GetSheHe]想要什么礼物来纪念这一时刻时，[ROOT.GetCountry.GetRuler.GetHerHis]的回答将被载入[ROOT.GetCountry.GetAdjective]的史册。"
 me_tasm_23_title:0 "$01_tasm_missions_task_23$"
 me_tasm_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_tasm_24.a:0 "别担心......每个人都会在未来的战斗中得到丰厚的回报。"
 me_tasm_24_desc:0 "现在我们的[ROOT.GetCountry.GetAdjective]军团已经突破了摆在我们面前的悲惨的防御，并且到达了他们可以看到远方的#E Sinus Arabicus#!的土地，战争的狂热抓住了我们的人，他们不会满足，直到[ROOT.GetCountry.GetRuler.GetName]将他们释放到沿海的富饶的城市，就像船底的藤壶。"
 me_tasm_24_title:0 "$01_tasm_missions_task_24$"
 me_tasm_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_tasm_25.a:0 "我将继续在整个[ROOT.GetCountry.GetName]地区进行建设。"
 me_tasm_25_desc:0 "\n\n由于[ROOT.GetCountry.GetRuler.GetName]发起的工作，#E Yathill#!的城市和前首都#E Karna#!已经慢慢转变为适当的[ROOT.GetCountry.GetAdjective]飞地--提醒我们打算在这个地区停留很长、很长的时间。"
 me_tasm_25_title:0 "$01_tasm_missions_task_25$"
 me_tasm_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_tasm_26.a:0 "我们决不能忽视我们王国的任何方面，甚至是骆驼！\"！"
 me_tasm_26_desc:0 "我们的人民当然喜欢马，但众所周知，我们更喜欢骆驼，这种动物更适合在我们家园的恶劣环境中航行。\n\n我们感谢我们有能力在我们的领土上投资，[GetProvince('(int32)4718').GetName]是我们赠予我们省民的最新例子。最近在那里建造的骆驼农场，以及它们给[ROOT.GetCountry.GetAdjective]国库带来的财富的消息正在传开。"
 me_tasm_26_title:0 "$01_tasm_missions_task_26$"
 me_tasm_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_26$#!' $mission_completed_tooltip_2$"
 me_tasm_27.a:0 "创造历史的时间"
 me_tasm_27_desc:0 "在#E 阿拉伯半岛#!的中心地带，在这片土地上，地球被太阳的压迫性热量烘烤，远处出现的流水很可能是海市蜃楼，我们已经建立了自己的家园--我们是[ROOT.GetCountry.GetAdjective]部落，在弱者枯萎和死亡的地方聚集我们的力量。\n\n最近，预兆是不安的，当寻求神的意志时，没有给出明确的答案。看来，变化将降临到阿拉伯——让我们希望我们已经准备好迎接它们。"
 me_tasm_27_title:0 "他们将从沙漠中来"
 me_tasm_28.a:0 "一切都会好起来的，我向你保证"
 me_tasm_28_desc:0 "邀请函发出一周后，#E 贾迪斯#!的统治者[SCOPE.sCharacter('zarqa_ruler_jaddis').GetName]来到[ROOT.GetCountry.GetCapital.GetName]与[ROOT.GetCountry.GetRuler.GetName]会面，[ROOT.GetCountry.GetAdjective]的[ROOT.GetCountry.GetRulerTitle]非常兴奋地见到扎尔卡，据传她是一位女先知，可以用她著名的冰蓝色眼睛看到未来。 \n\n然而，扎尔卡穿着传统的丧服，当[ROOT.GetCountry.GetRuler.GetFirstName]进入房间时，她已经用灰烬遮住了脸，并拒绝进行眼神交流。\n\n“我已经预见到了我的人民的末日，哦[ROOT.GetCountry.GetRuler.GetFirstName]。\n\n”请站起来，扎尔卡，这不是这次会议的主题。\n\n“不，[ROOT.GetCountry.GetRuler.GetFirstName]。扎尔卡终于迎着[ROOT.GetCountry.GetRuler.GetHerHis]的目光，露出了脸颊上的泪水。”在新月之前，一场巨大的灾难将降临在我的人民身上；这是诸神所规定的，什么也做不了。我是来向你告别的，我的主人。"
 me_tasm_28_title:0 "一次不祥的会谈"
 me_tasm_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y 一次不祥的会谈#!' $mission_completed_tooltip_2$"
 me_tasm_29.a:0 "这可能意味着什么？"
 me_tasm_29_desc:0 "[ROOT.GetCountry.GetRuler.GetName]昨晚做了一个可怕的梦，扰乱了[ROOT.GetCountry.GetRuler.GetHerHis]的休息，梦见沙漠中尖叫的妇女和儿童，以及沙子本身着火，将厚厚的黑烟送上天堂。\n\n几个小时后睡着了，[ROOT.GetCountry.GetRuler.GetFirstName]马上又做了同样的梦，每个细节都一模一样，被惊醒后出了一身冷汗，无法继续睡下去。"
 me_tasm_29_title:0 "一个可怕的恶梦"
 me_tasm_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_tasm_2_desc:0 "[ROOT.GetCountry.GetCapital.GetName]战争委员会已经聚集在[ROOT.GetCountry.GetCapital.GetName]，紧张气氛高涨，导致所有的礼仪都被遗忘，因为人们在沮丧和愤怒中提高了声音。\n\n[ROOT.GetCountry.GetRuler.GetName]提议我们收集我们的人力储备，但不是用剑和长矛武装他们，[ROOT.GetCountry.GetName]将把这些人送入沙漠荒地，带着农场动物和物资，试图殖民我们北方的领土。 \n\n虽然一些大家族同意[ROOT.GetCountry.GetRuler.GetFirstName]，但其他家族却提出了强烈的反对意见，这种日益增长的反对意见在[SCOPE.sCharacter('random_dude').GetName]的背后结晶，他大声谴责了这项决议。[SCOPE.sCharacter('random_dude').GetFirstName]用[SCOPE.sCharacter('random_dude').GetHerHis]杖敲击地面，使[ROOT.GetCountry.GetRuler.GetFirstName]挑起眉毛。在[SCOPE.sCharacter('random_dude_2').GetHerHis]座位上不自在地摇晃着，[SCOPE.sCharacter('random_dude_2').GetName]发出一声叹息，但没有说话。我们来这里是为[ROOT.GetCountry.GetName]而战，而不是在沙地上建造定居点！\"！这是对权力的无耻滥用，[ROOT.GetCountry.GetRuler.GetFirstName]--你在消磨我们的力量，让我们变得脆弱不堪。"
 me_tasm_2_title:0 "$01_tasm_missions_task_2$"
 me_tasm_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_tasm_3.a:0 "我们必须对未来发生冲突的可能性保持警惕......"
 me_tasm_30.a:0 "我......我不知道该怎么说......"
 me_tasm_30_desc:0 "一天早上，[ROOT.GetCountry.GetRuler.GetName]收到来自#E Jadis#!部落的信使。假设这个旅行者是来讨论将他们的土地同化为[ROOT.GetCountry.GetName]的问题，当这个人进入接待大厅时，[ROOT.GetCountry.GetRuler.GetFirstName]感到很震惊。\n\n这个士兵浑身都是被感染的严重伤口，而且发烧得神志不清--说实话，看起来他可能活不过今晚。'Jadis已经倒下了......Jadis永远毁灭了。'他在跪下之前喃喃自语。\n\n'放心吧，年轻人，因为你现在安全了。你在说什么？[ROOT.GetCountry.GetRuler.GetFirstName]怜悯地问道，派人去找一个受过医术训练的奴隶和一壶酒。\n\n成百上千的野蛮人不知从哪里冒出来，把我们全部屠杀了......扎尔卡......他们...... 士兵开始咳嗽和呻吟。\n\n发生了什么？说吧，伙计！'\n\n'他们杀了她，肢解了她的身体--他们把她的眼睛挖出来，让她死了。当[ROOT.GetCountry.GetRuler.GetFirstName]喘息时，士兵从一捆破布中露出一个小的雪花膏盒子。\n\n女王预见到了一切，知道会发生这种事--她最后要求的是我们把她的眼睛带给你。我们认为，她用于眼皮的眼影膏将血管变成了黑色......"
 me_tasm_30_title:0 "扎尔卡-阿尔-耶马迈的黑眼睛"
 me_tasm_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_tasm_31.a:0 "我没有时间去处理宫廷里的流言蜚语。"
 me_tasm_31_desc:0 "许多人公开猜测[ROOT.GetCountry.GetRuler.GetName]在整个[ROOT.GetCountry.GetName]中似乎痴迷于建造防御工事的原因。有些人声称，童年时的一件事，也许是敌方部落的一次破坏性袭击，使[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]痴迷于追逐安全，而另一些人则认为，统治者只是在履行[ROOT.GetCountry.GetRuler.GetHerHis]保护国家的职责。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]知道这些闲言碎语，但却毫不在意，宁愿让[ROOT.GetCountry.GetRuler.GetHerHis]的行动来说话。当[ROOT.GetCountry.GetCapital.GetName]终于传来消息，被称为'#E The Three Fists#!的三个堡垒已经完成，确保了通往#E Arabia#!中心地带的陆路通道，只有一个简短的确认，为谣言添了一把火。"
 me_tasm_31_title:0 "三个拳头"
 me_tasm_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y 三个拳头#!' $mission_completed_tooltip_2$"
 me_tasm_32.a:0 "现在不会太久了......也许只是几天的事。"
 me_tasm_32_desc:0 "早上从[GetProvince('(int32)4646').GetName]传来消息，我们的部队在那里慢慢集结，期待着#E 蓬特#!的入侵。我们的西部舰队正在该地区巡逻，甚至较小的船只，如当地人用来在水中拖网的渔船，也被征用，以便将士兵运过海峡。\n\n我们的宣称已经准备好了，我们唯一需要做的是等待[ROOT.GetCountry.GetRuler.GetName]发出命令。"
 me_tasm_32_title:0 "进军阿非利加"
 me_tasm_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y 进军阿非利加#!' $mission_completed_tooltip_2$"
 me_tasm_33.a:0 "建设永久定居点是我们在国内和国外成功的关键"
 me_tasm_33_desc:0 "许多年来，我们的人民居住在皮帐篷里，在沙漠广阔的天幕下，在干燥的山丘和沙丘中游荡，但最近在我们的王国里出现了建造城市的狂热--似乎我们这一代的同胞更喜欢居住在砖和石头的建筑里。 \n\n从不忽视[ROOT.GetCountry.GetRuler.GetHerHis]人的意愿，[ROOT.GetCountry.GetRuler.GetName]已经授权给我们的建筑师，他们刚刚在整个#E Arabia#!的建设中获得成功，拥有[ROOT.GetCountry.GetName]所提供的所有资源，并命令他们以前所未有的方式工作。"
 me_tasm_33_title:0 "知名建筑师"
 me_tasm_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y 知名建筑师#!' $mission_completed_tooltip_2$"
 me_tasm_34.a:0 "不要担心，[SCOPE.sCharacter('random_dude').GetFirstName]--你的孩子们不会独自战斗。"
 me_tasm_34_desc:0 "在所有的[ROOT.GetCountry.GetName]中，众所周知，[SCOPE.sCharacter('random_dude').GetName]对[SCOPE.sCharacter('random_dude').GetHerHis]孩子的宠爱超出了人们的想象，经常在[SCOPE.sCharacter('random_dude').GetHerHis]的土地上建造精致的建筑，使他的家人可以生活在浮夸的舒适中。 \n\n因此，[SCOPE.sCharacter('random_dude').GetFirstName]在最近的一次军事委员会会议后，私下向[ROOT.GetCountry.GetRuler.GetName]提出了一个羞涩的请求，一个出于保护[SCOPE.sCharacter('random_dude').GetHerHis]后代的愿望，这并不令人惊讶。 \n\n因为担心[SCOPE.sCharacter('random_dude').GetHerHis]的孩子们会在我们的神明不知道的地方丧生，[SCOPE.sCharacter('random_dude').GetFirstName]恳求[ROOT.GetCountry.GetRuler.GetFirstName]为我们即将到来的战争雇用更多的雇佣兵--这个请求，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]已经同意了。"
 me_tasm_34_title:0 "佣兵思维"
 me_tasm_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y 善用雇佣兵#!' $mission_completed_tooltip_2$"
 me_tasm_35.a:0 "这座宏伟的城市将被称为 \"Hadiqa\"，即[ROOT.GetCountry.GetRuler.GetFirstName]的花园。"
 me_tasm_35.b:0 "[ROOT.GetCountry.GetCapital.GetName]将是我给后人的礼物。"
 me_tasm_35_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]离开人世，[ROOT.GetCountry.GetRuler.GetHerHis]的事迹从记忆中变成传奇之后，仍有一项高耸的成就将屹立于时代的前沿--[ROOT.GetCountry.GetCapital.GetName]，这是[ROOT.GetCountry.GetAdjective]人民的珍贵成就。\n\n当[ROOT.GetCountry.GetName]的访客得知几代人之前，首都只是一个定居点，居住着山羊和骆驼，他们睡在绿洲的生命之水附近，常常会感到目瞪口呆。当[ROOT.GetCountry.GetCapital.GetName]的防御工事令人印象深刻的砂岩尖顶出现在远处时，人们很快就会发现这是一座充满了数万人的城市。\n\n沿着城垛行走，[ROOT.GetCountry.GetRuler.GetFirstName]凝视着[ROOT.GetCountry.GetRuler.GetSheHe]指挥建造的城市的广阔空间，满足地叹息着。"
 me_tasm_35_title:0 "沙漠中的花园"
 me_tasm_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y 沙漠中的花园#!' $mission_completed_tooltip_2$"
 me_tasm_36.a:0 "如果我们不抓住时机，那么也许它将永远不会到来！<m id=7>！"
 me_tasm_36_desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]带领我们的部队取得了无数的胜利，但仍有人质疑[ROOT.GetCountry.GetRulerTitle]提出的军事战略，在[ROOT.GetCountry.GetCapital.GetName]的战争委员会中，也有愤怒的辩论，尽管是克制的辩论。 \n\n[ROOT.GetCountry.GetRuler.GetFirstName]认为我们的军队已经准备好驶向#E 美索不达米亚#!，把[ROOT.GetCountry.GetRuler.GetHerHis]的目光投向沿海的富裕城市，但如果说我们的将军们支持这种想法，那是假的；事实上，有很多人对失去我们迄今所取得的一切感到焦虑。\n\n尽管如此，我们似乎正在推进这个想法。"
 me_tasm_36_title:0 "扬帆驶向苏美尔"
 me_tasm_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y 扬帆驶向苏美尔#!' $mission_completed_tooltip_2$"
 me_tasm_37.a:0 "在城墙上的灰泥还没有干透之前，我们就会回来!"
 me_tasm_37_desc:0 "我们正在成为著名的凶猛的奴隶主和袭击者，我们的战舰经常在#E 波斯湾#!以及#E 阿拉伯湾#!造成恐怖。\n\n我们的士兵和我们的敌人已经进入了一个熟悉的舞蹈，一个在每个战役季节重复的舞蹈；我们的奴隶船毫无征兆地进攻，带走了所有没有被钉在地上的战利品和掠夺物，而我们的受害者花费数月时间修复他们损坏的防御设施，向众神祈祷我们回来时放过他们。"
 me_tasm_37_title:0 "恶名昭彰的奴隶主"
 me_tasm_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y 恶名昭彰的奴隶主#!' $mission_completed_tooltip_2$"
 me_tasm_38.a:0 "你知道吗，我打算和你一起去--我现在很好奇。"
 me_tasm_38_desc:0 "[SCOPE.sCharacter('philopher_1').GetName]声称对[GetProvince('(int32)965').GetName]岛上的古代遗迹有所了解，这些遗迹是由一个消失已久的文明[SCOPE.sCharacter('philopher_1').GetSheHe]建造的，称为#E Gutians#!。关于这个神秘的民族，人们知道的并不多，尽管[SCOPE.sCharacter('philopher_1').GetFirstName]声称他们曾经在这个地区统治过一个庞大的帝国，只是被他们的附庸国联盟所摧毁。\n\n[ROOT.GetCountry.GetRuler.GetName]起初很难被说服，但是[ROOT.GetCountry.GetRuler.GetSheHe]同意资助一支探险队到这个岛屿去看看能发现什么。[SCOPE.sCharacter('philopher_1').GetFirstName]将在早上出发，并承诺每天向[ROOT.GetCountry.GetCapital.GetName]发回报告。"
 me_tasm_38_title:0 "古蒂发掘现场"
 me_tasm_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y 古蒂发掘现场#!' $mission_completed_tooltip_2$"
 me_tasm_39.a:0 "我祈求#E Ta'lab#!保佑我们的牧群，使它们硕果累累。"
 me_tasm_39_desc:0 "众所周知，[ROOT.GetCountry.GetAdjective]人是世界上最好的驭马者，尽管我们的沙漠气候很恶劣，自然不支持大型马群。\n\n最近，由于大量的草原马涌入[ROOT.GetCountry.GetCapital.GetName]，我们一些知识渊博的马术爱好者认为，我们也许可以开始培育我们自己的本地品种，但没有任何承诺。"
 me_tasm_39_title:0 "沙漠铁骑"
 me_tasm_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y 沙漠铁骑#!' $mission_completed_tooltip_2$"
 me_tasm_3_desc:0 "在我们的部落开始在[GetProvince('(int32)8847').GetName]定居，在沙丘间搭起帐篷，让他们的牛群在土地上自由漫步后，我们的侦察员从东部回来，带来了一份令人不安的报告，说我们的邻居的好战情绪在上升。\n\n看来，#E 革耳剌#!共和国已经注意到我们对#E 乌克鲁什#!省的入侵，他们的征兵已经被提醒了。虽然革耳剌认为我们是野兽，除非他们想从我们这里得到什么，否则几乎不值得注意，但他们还是决定派一名外交官来警告我们。\n\n\"你们出现在我们要求的土地上是一种侮辱，我们不会轻易接受。"
 me_tasm_3_title:0 "$01_tasm_missions_task_3$"
 me_tasm_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_tasm_4.a:0 "总有一天，我们会把基达尔的首都据为己有。"
 me_tasm_40.a:0 "一个人不需要成为预言家就能看到即将发生的事情...。"
 me_tasm_40_desc:0 "看到满载[ROOT.GetCountry.GetAdjective]殖民者和定居者的船只穿过#E 阿拉伯湾#!，前往[GetProvince('(int32)7519').GetName]的港口，这已经成为一种司空见惯的事情，\n\n[ROOT.GetCountry.GetRuler.GetName]将[ROOT.GetCountry.GetName]的资源倾注于发展#E 蓬特#!的城市，而[ROOT.GetCountry.GetRuler.GetHerHis]的艰苦努力显然正在得到回报。感激的当地人，感谢我们[ROOT.GetCountry.GetRulerTitle]的轻手，已经接受了我们的存在，现在会很高兴地与我们的征召兵并肩作战。我们也从非洲人那里获得了大量的贡品……下次你访问国库时，你会很高兴的，我的[ROOT.GetCountry.GetRulerTitle]。\n\n我们的人涌入这些南部海岸，引起了#E 非洲之角#!城邦的关注，这是有道理的。"
 me_tasm_40_title:0 "阿拉伯的蓬特"
 me_tasm_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y 阿拉伯的蓬特#!' $mission_completed_tooltip_2$"
 me_tasm_41.a:0 "我们承诺将公平地统治你们，不滥用我们的权力"
 me_tasm_41_desc:0 "我国使节历尽艰辛，终从[GetProvince('(int32)7530').GetName]安然归朝——虽舟车劳顿面色青白，却难掩振奋之色。\n\n此番出使可谓大获全胜：岛上明理之士不仅应允仆从国之请，更自宝库取#Y 龙血权杖#!相赠，以彰诚意。\n\n当[ROOT.GetCountry.GetRuler.GetName]亲手接过权杖之时，便意味着该岛已近乎放弃独立主张。"
 me_tasm_41_title:0 "龙血岛"
 me_tasm_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y 龙血岛#!' $mission_completed_tooltip_2$"
 me_tasm_42.a:0 "坚持下去，随着时间的推移，我们将获得我们想要的东西。"
 me_tasm_42.b:0 "#R 旧帝国覆灭之日，便是新帝国崛起之时！#!"
 me_tasm_42_desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]以[ROOT.GetCountry.GetRuler.GetHerHis]在对外外交上不偏不倚的态度而闻名，但最近，[ROOT.GetCountry.GetRuler.GetSheHe]觉得可以做得更多，以实现[ROOT.GetCountry.GetRuler.GetHerHis]的目标。\n\n虽然听起来很傻，但[ROOT.GetCountry.GetRuler.GetSheHe]不禁觉得，虽然我们稳定增长的步伐令人满意，但一个大胆的领导人会比我们的[ROOT.GetCountry.GetRulerTitle]完成得更出色。[ROOT.GetCountry.GetRuler.GetFirstName]是否过于谨慎了？不是有句话说，命运偏爱大胆的人吗？\n\n一个大胆的想法进入了[ROOT.GetCountry.GetRuler.GetHerHis]的脑海……"
 me_tasm_42_title:0 "夺回属于我们的土地"
 me_tasm_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y 夺回属于我们的土地#!' $mission_completed_tooltip_2$"
 me_tasm_43.a:0 "我将带领我们的国家走向更伟大的辉煌"
 me_tasm_43_desc:0 "我们的祖先从未想过有一天，我们的部队在不屈不挠的[ROOT.GetCountry.GetRuler.GetName]的带领下，会洗劫[GetProvince('(int32)918').GetName]这座伟大的城市，然而这个雄心勃勃的梦想却在所有的困难中实现了。 \n\n没有人知道[ROOT.GetCountry.GetName]的未来会怎样，但我们的人民热切地祈祷，希望诸神保佑[ROOT.GetCountry.GetRuler.GetFirstName]远离一切邪恶，为[ROOT.GetCountry.GetRuler.GetHerHis]的生命增添许多日子，因为我们可能再也看不到[ROOT.GetCountry.GetRuler.GetHerHim]的样子了。"
 me_tasm_43_title:0 "巴比伦的大门"
 me_tasm_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y 巴比伦的大门#!' $mission_completed_tooltip_2$"
 me_tasm_44.a:0 "我们已经成功了，[ROOT.GetCountry.GetRuler.GetFirstName]，实现了你的梦想"
 me_tasm_44.b:0 "不幸的是，我们无法让马匹交配，但这是值得尝试的"
 me_tasm_44_desc:0 "终于，我们收到了试图在沙漠中饲养草原马的饲养员的答复。在期待中颤抖的双手，[ROOT.GetCountry.GetRuler.GetName]招手让信使上前，信使用平静的声音说话。"
 me_tasm_44_title:0 "沙漠铁骑"
 me_tasm_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y 沙漠铁骑#!' $mission_completed_tooltip_2$"
 me_tasm_45.a:0 "你以前试过sugar吗？我将会改变你的世界"
 me_tasm_45_desc:0 "在[GetProvince('(int32)7530').GetName]，当旅行的商船队回到港口时，总是一个令人兴奋的日子，他们的货舱挤满了来自#E India#!异国他乡的各种珍贵货物。\n\n船的库存往往像一个发烧的梦，一个视觉和气味的瘴气；精美的象牙雕像，琥珀珠子，豆蔻和胡椒等香料，芳香的木材和耀眼的宝石都可以找到，装在稻草中，储存在木箱中。 \n\n[ROOT.GetCountry.GetRuler.GetName]特别喜欢进口商带来的被称为#E sugar#!的甜味盐，经常购买整批货物供[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家使用。不用说，我们与#E Maldives#!的贸易网络正在使[ROOT.GetCountry.GetName]变得比任何人想象的都要富有。"
 me_tasm_45_title:0 "东方财富传说"
 me_tasm_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y 东方财富传说#!' $mission_completed_tooltip_2$"
 me_tasm_46.a:0 "我们不向任何人进贡--现在离开我的办公室。"
 me_tasm_46.b:0 "我讨厌这样，但我们必须按他们说的做。"
 me_tasm_46_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我很不高兴地报告，我们有来自[GetProvince('(int32)516').GetName]的外交官提出了一个令人不快的要求，你一定不能轻视。 \n\n似乎我们的东边邻居已经注意到我们的迅速崛起，由于我们试图取代我们地区的现状，有人要求我们向[GetCharacter('(int32)42').GetName]的宫廷进贡，以示我们未来对和平与和谐关系的意向。\n\n他们不接受拒绝......他们是秘密地来制造一个理由吗？我们应该怎么做？"
 me_tasm_46_title:0 "埃及的特使们"
 me_tasm_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y 埃及的特使们#!' $mission_completed_tooltip_2$"
 me_tasm_47.a:0 "我们将继续前进，不理会这些愚蠢的迷信"
 me_tasm_47.b:0 "立即取消整个计划！"
 me_tasm_47_desc:0 "来自[SCOPE.sCharacter('philopher_1').GetName]的好消息! 我们已经安全抵达[GetProvince('(int32)965').GetName]，并且没有浪费时间询问当地居民关于这些所谓的Gutian废墟的情况。\n\n令[ROOT.GetCountry.GetRuler.GetFirstName]恼火的是，那里的人说一个邪恶的神已经在这个废弃的城市居住了，任何接近它破碎的墙壁的人都注定要遭受悲惨的死亡。我们被建议立即掉头--不久前，一位当地的学者在进入城市后失踪，再也没有回来。\n\n虽然[SCOPE.sCharacter('philopher_1').GetFirstName]认为这一切都是无稽之谈，但[ROOT.GetCountry.GetAdjective]阵营中的许多人都被吓坏了，想立即回家。"
 me_tasm_47_title:0 "古蒂发掘现场：抵达"
 me_tasm_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y 古蒂发掘现场：抵达#!' $mission_completed_tooltip_2$"
 me_tasm_48.a:0 "诸神啊，老兄！你吓了我一跳……"
 me_tasm_48_desc:0 "经过几个星期在[GetProvince('(int32)965').GetName]的岩石隘口和废弃的地方的攀爬，[ROOT.GetCountry.GetRuler.GetName]和[SCOPE.sCharacter('philopher_1').GetName]终于成功地找到了一个沉没的城市的废墟，这个废墟上堆满了摇摇欲坠的被风化的石头。[SCOPE.sCharacter('philopher_1').GetName]毫不怀疑这一定是#E Gutian#!地图上所说的古老的#E Gutian#!城堡，并急切地催促大家前进。\n\n当一行人小心翼翼地走向覆盖着沙子的道路，进入古城时，太阳已经落山。当他们穿过由琉璃瓦和碎砖组成的破损拱门时，他们的神经处于紧张状态，他们以战斗队形前进，同时向四周投去偷偷的目光。突然传来一阵急促的脚步声，[ROOT.GetCountry.GetRuler.GetFirstName]转过身来，[ROOT.GetCountry.GetRuler.GetHerHis]嘴里发出了誓言。\n\n'万岁，朋友们! 我没有武器--请让我说话。我的名字是[SCOPE.sCharacter('olivenkranz_char').GetName]，我在这里为废墟编目。请允许我向你们展示我所发现的东西。"
 me_tasm_48_title:0 "古蒂发掘现场：学者"
 me_tasm_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y 古蒂发掘现场：向导#!' $mission_completed_tooltip_2$"
 me_tasm_49.a:0 "这将会把我的背弄得一团糟，但我们必须这样做。"
 me_tasm_49.b:0 "我很抱歉，但这不值得我花时间 - 我们走吧"
 me_tasm_49_desc:0 "[SCOPE.sCharacter('olivenkranz_char').GetName]带领大家轻松地穿过倒塌的建筑和破碎的砖石组成的迷宫，当他们穿过一个被遗忘的时代的黑暗小巷时，指出了一些有趣的东西，如石器上的古蒂艺术图案。\n\n“很久以前，这个岛被称为#E 哈里鲁#!，是一个重要的贸易殖民地，但我有理由相信，一场地震结束了这一切。你来得正是时候，[ROOT.GetCountry.GetRuler.GetName]；我刚刚找到了金库——我想——但我需要帮助来清理门口的石头。你能帮我吗？”\n\n在你面前的是一堆巨大的石头，深不可测的数量让[ROOT.GetCountry.GetRuler.GetFirstName]光是看着就觉得很累——要把所有的东西弄走简直要花上几个星期。"
 me_tasm_49_title:0 "古蒂发掘现场：库房"
 me_tasm_49_tooltip:0 "$mission_completed_tooltip_1$“#Y 古蒂发掘现场：库房#!”$mission_completed_tooltip_2$"
 me_tasm_4_desc:0 "我们的人力储备已经从[ROOT.GetCountry.GetRuler.GetName]带头的非正统殖民工作中充分恢复，当我们的战士继续在#E 舍迈尔#!省聚集时，我们的间谍报告说，我们的#E 基达尔#!敌人正在加强他们在[GetProvince('(int32)8815').GetName]的防御工事。据说他们正在囤积食品，并挖了很深的蓄水池，以备长期围攻，而且据说外国雇佣兵已经驻扎在城堡内。他们显然对我们如此迅速地进入我们之间的无主土地感到震惊。\n\n他们显然已经预见到了[ROOT.GetCountry.GetRuler.GetFirstName]的下一步行动，但只有时间才能证明他们是否准备好阻止我们。"
 me_tasm_4_title:0 "$01_tasm_missions_task_4$"
 me_tasm_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_tasm_5.a:0 "我们的人民已经混杂在一起很久了，很难区分我们的身份"
 me_tasm_50.a:0 "这就是我们被警告的那个恶灵吗？"
 me_tasm_50_desc:0 "经过看似漫长的艰苦工作，冒险家们终于成功地将足够多的碎石清理到一边，以便进入建筑物。进入后，[SCOPE.sCharacter('olivenkranz_char').GetName]立即发出一声巨大的呻吟。“怎么了？”[ROOT.GetCountry.GetRuler.GetName]问道，[ROOT.GetCountry.GetRuler.GetHerHis]双手放在[ROOT.GetCountry.GetRuler.GetHerHis]的小背上。\n\n“这不是国库本身，而是一座神庙——我担心我搞错了。该死的！尽管如此，让我们继续前进，寻找那片圣地。” \n\n火把的光亮刺破了阴暗，一行人进入了神殿，那里闪烁的灯光显示出黄金的光芒和一个可怕的战神的扭曲的面孔。[SCOPE.sCharacter('olivenkranz_char').GetFirstName]和[SCOPE.sCharacter('philopher_1').GetName]都向充满整个房间的巨大雕像走去，轻声嘀咕着。\n\n“雕像底部的楔形文字写着‘Tishpak'……”"
 me_tasm_50_title:0 "古蒂发掘现场：结果"
 me_tasm_50_tooltip:0 "$mission_completed_tooltip_1$“#Y 古蒂发掘现场：结果#!”$mission_completed_tooltip_2$"
 me_tasm_5_desc:0 "多年来，#E 塔斯姆#!的部落一直居住在#E 贾迪斯#!的土地上，他们在我们的绿洲附近浇灌牛群，与我们分享面包--尽管我们的边界已经划定，但我们认为这些只是形式，因为亲情的纽带比人类能制造的任何东西都要强大。\n\n由于我们的关系处于前所未有的高度，有人提议我们合并我们的财产，成为一体，看来我们的臣子对这个想法是开放的。[ROOT.GetCountry.GetRuler.GetName]已经向贾迪斯的统治者，一位名叫[SCOPE.sCharacter('zarqa_ruler_jaddis').GetName]的女统治者发出了正式邀请，邀请她到[ROOT.GetCountry.GetCapital.GetName]来讨论这一重要事项。"
 me_tasm_5_title:0 "$01_tasm_missions_task_5$"
 me_tasm_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_tasm_6.a:0 "这不是单纯的边境小战，而是一场生死之战，革耳剌……"
 me_tasm_6_desc:0 "[ROOT.GetCountry.GetName]的军队打败了#E 革耳剌#!的部队，让他们永远感到惊讶，把他们赶出了#E Ukrush#!的省份，并夺取了[GetProvince('(int32)8849').GetName]和[GetProvince('(int32)5408').GetName]的宝贵领土。我们复仇的敌人发誓，他们将毫无预警地回来，并且不会休息，直到[ROOT.GetCountry.GetCapital.GetName]成为一个粪堆，[ROOT.GetCountry.GetRuler.GetName]统治灰烬。\n\n但这些都是空谈，目前。目前，我们的军队离#E 波斯湾#!的海岸只有几天的路程，而我们的将军们已经接到[ROOT.GetCountry.GetRuler.GetFirstName]的命令，为海岸起草作战计划。看来我们的[ROOT.GetCountry.GetRuler.GetTitleName]不会满足于此，直到我们的死敌革耳剌被毁掉。"
 me_tasm_6_title:0 "$01_tasm_missions_task_6$"
 me_tasm_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_tasm_7.a:0 "我们将带领我们的部队取得更大的胜利!"
 me_tasm_7_desc:0 "我们最近在整个#E 革耳剌#!省的成功向世界表明，我们已经掌握了在我们称之为家园的困难地形上的战斗。我们不是躲在沙漠中的野蛮人突击队，而是一支可怕的战斗力量，有能力从共和国和自由人手中夺取城市——阻碍耶马迈统治的敌人有祸了!"
 me_tasm_7_title:0 "$01_tasm_missions_task_7$"
 me_tasm_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_tasm_8.a:0 "我们的敌人正处于致命的危险之中，但我们必须尽快出击"
 me_tasm_8_desc:0 "由于担心时间对我们不利，[ROOT.GetCountry.GetRuler.GetName]为[ROOT.GetCountry.GetName]的军队设定了一个不屈不挠的步伐，并命令立即向#E 西俄马纳#!和#E 中央俄马纳#!的省份提出要求。\n\n相信我们的势头是我们最大的盟友，[ROOT.GetCountry.GetRuler.GetFirstName]坚持在我们有能力时尽快进攻，希望在我们的敌人能够集结防御力量之前利用我们已经赢得的胜利。"
 me_tasm_8_title:0 "$01_tasm_missions_task_8$"
 me_tasm_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $01_tasm_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_tasm_9.a:0 "我们希望革耳剌成为我们的新首都。"
 me_tasm_9.b:0 "塞吉绿洲在向我们招手‑我们必须选择那里"
 me_tasm_9.c:0 "我们永远不会放弃我们的首都，而是要让它变得更好!"
 me_tasm_9_desc:0 "一个小小的聚会正在[ROOT.GetCountry.GetRuler.GetName]的私人房间里举行，这个聚会人数不多，但将对[ROOT.GetCountry.GetName]的未来产生巨大的影响。\n\n有人建议我们放弃孕育我们民族的严酷沙漠，在我们最近征服的城市之一定居；这个想法[ROOT.GetCountry.GetRuler.GetFirstName]一直在考虑。有两个候选人脱颖而出： [GetProvince('(int32)7199').GetName]和[GetProvince('(int32)5405').GetName]。\n\n然而，应该注意的是，我们的一些部落成员对这个放弃祖先家园的想法不满意......我们应该考虑清楚这个问题。选择一个已经在该地区建立了外交和贸易关系的知名城市，肯定会提高我们的威望，但这值得激怒普通民众吗？"

l_simp_chinese:
 01_adriatic_pirate_missions:0 "亚得里亚海之灾"
 01_adriatic_pirate_missions_BUTTON_TOOLTIP:0 "很快，我们将把亚得里亚海作为我们的海！\"！"
 01_adriatic_pirate_missions_CRITERIA_DESCRIPTION:0 "当我们在伊利里亚建立一个可怕的#Y 海盗王国#! ，并利用我国的资源攻击主要贸易路线时，这项任务就会完成。"
 01_adriatic_pirate_missions_DESCRIPTION:0 "这是一个巨大的谜团，为什么这么多的外国船只，它们的货舱装满了各种贸易货物，在驶过亚得里亚海明亮的蓝色水域时突然消失。自然，经常被指责为比强盗和土匪好不了多少的伊利里亚部落，在被问及此事时，他们一无所知。"
 01_adriatic_pirate_missions_task_1:0 "用银色迎接"
 01_adriatic_pirate_missions_task_10:0 "召唤所有海盗"
 01_adriatic_pirate_missions_task_10_DESC:0 "既然我们已经决定公开与海盗为伍，我们就必须向从直布罗陀海峡到遥远的印度岛屿的每一个港口城市发出信息；在[ROOT.GetCountry.GetName]有对你的赦免，我被误解的朋友，因为我们需要你的专业知识。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_adriatic_pirate_missions_task_11:0 "海德鲁斯港"
 01_adriatic_pirate_missions_task_11_DESC:0 "在#E 海德鲁斯#!有一个海盗天堂，该地区的每个人都知道，该省的代表秘密地要求我们把他们从暴虐的霸主手中解放出来——告知我们的军队和舰队，我们将驶向意大利的脚跟。\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 01_adriatic_pirate_missions_task_12:0 "攻占梅利古尼斯"
 01_adriatic_pirate_missions_task_12_DESC:0 "西西里岛北面的#E 梅利古尼斯#!这个僻静的小岛将是海盗基地的完美地点——我们可以把奴隶船开往非洲和意大利的富饶之地，而不必返回[ROOT.GetCountry.GetCapital.GetName]的家。那我们还等什么呢？\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 01_adriatic_pirate_missions_task_13:0 "窒息的海峡"
 01_adriatic_pirate_missions_task_13_DESC:0 "让我们在我们的新财产#E 科基拉#! 上重复我们已经完善的公式，#E 梅利古尼斯#!；我们将建立一个坚固的港口，成为Mare Tyrrenum的最新海盗天堂。我们将在第勒尼安海建立一个坚固的港口，成为最新的海盗天堂。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_adriatic_pirate_missions_task_14:0 "利伯尔尼人 利伯尔尼人"
 01_adriatic_pirate_missions_task_14_DESC:0 "虽然我们的船目前很好——我们没有抱怨，真的——但有人建议我们可以稍微修改我们的设计，以纳入一些改进。我们应该研究一下这个问题，看看它是否真的可行，如果可行，我们就应该这么做。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 01_adriatic_pirate_missions_task_15:0 "海盗之冠"
 01_adriatic_pirate_missions_task_15_DESC:0 "有人说，'每个国王都需要一顶皇冠'，现在是时候让[ROOT.GetCountry.GetRuler.GetName]接受我们的人民不断塞给[ROOT.GetCountry.GetRuler.GetHerHim]的赞誉了。还有比举行加冕仪式更好的方式来庆祝我们扼制梅塞内海峡的成功吗？\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 01_adriatic_pirate_missions_task_16:0 "令人恐惧的排列"
 01_adriatic_pirate_missions_task_16_DESC:0 "尽管我们理所当然地将注意力集中在海军装备上，但有许多地方创新可以应用于我们的陆军。既然我们有能力做，我们就应该升级士兵的战斗装备。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_adriatic_pirate_missions_task_17:0 "海盗伊利里亚"
 01_adriatic_pirate_missions_task_17_DESC:0 "我们确实从一开始就走了很长的路；的确，从我们现在的有利位置来看，我们最近的过去对我们来说几乎是无法辨认的。海盗伊利里亚 \"这个词曾经被当作一种侮辱来抛出，但我们已经把这个名字变成了人类甚至是神灵都害怕的东西。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 01_adriatic_pirate_missions_task_18:0 "玫瑰之岛"
 01_adriatic_pirate_missions_task_18_DESC:0 "经过深思熟虑，我们决定必须将#E 罗得岛#! 据为己有，但我们不会以老式的方式征服它；[ROOT.GetCountry.GetRuler.GetName]有一个秘密计划，不宣而战地将该岛偷走。\n\n#Y 这将启动一个事件链。#!\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 01_adriatic_pirate_missions_task_19:0 "海盗的美丽家园"
 01_adriatic_pirate_missions_task_19_DESC:0 "现在，美丽的#E 罗德斯岛#!已经属于我们了，现在是时候开始把它建设成一个真正的海盗天堂了。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_adriatic_pirate_missions_task_1_DESC:0 "从人们有记忆以来，在#E 伊利里亚#!，海盗一直是一种生活方式；我们崎岖的海岸线有许多地方可以隐藏一支小舰队。与其像普通罪犯一样躲在暗处，我们应该秘密地邀请海盗在我们的港口定居，但我们需要基础设施来容纳他们--还有硬币；很多很多的银币。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_adriatic_pirate_missions_task_1_tt:0 "我们必须拥有至少#Y 2个港口#!的领地。而同一省份需要进口#Y 木材#!。"
 01_adriatic_pirate_missions_task_2:0 "抢夺奴隶"
 01_adriatic_pirate_missions_task_20:0 "水之所及"
 01_adriatic_pirate_missions_task_20_DESC:0 "唯一比我们的扩张欲望更大的是我们的野心；把我们的宣称发给世界上每一个国家，并告诉他们，无论在哪里水陆交汇，你都应该期望找到我们的船只——#T 我们要求每一个港口都属于自己！#! \n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 01_adriatic_pirate_missions_task_21:0 "哲学家和海盗"
 01_adriatic_pirate_missions_task_21_DESC:0 "诚然，我们的海盗船为[ROOT.GetCountry.GetName]的港口带回了物质财富，比如我们的袭击者大量带走的金币和银币，但我们还有其他的财宝来源，有人会说这更有价值——知识。让我们用一个空间来储存我们的人从敌人的首都带走的卷轴，因为我们可以学到很多东西。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 01_adriatic_pirate_missions_task_22:0 "被海盗所污染"
 01_adriatic_pirate_missions_task_22_DESC:0 "世界上最危险的水体是#E 亚得里亚海#!，因为它毫无疑问地被海盗污染了。如果进入[ROOT.GetCountry.GetAdjective]海，没有人的安全有保障，你最好不要携带任何贵重物品。\n\n在这种危险的条件下，世界上一些最好的水手来自#E 伊利里亚#!，这并不奇怪。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 01_adriatic_pirate_missions_task_2_DESC:0 "通过组建一支庞大的船队，我们可以突袭邻国的土地，并在战斗中保持自己的地位；让意大利人、伊特鲁里亚人、希腊人和埃及人都害怕我们的伊利里亚奴隶主！\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 01_adriatic_pirate_missions_task_3:0 "海盗船厂"
 01_adriatic_pirate_missions_task_3_DESC:0 "\我们新的海上房客发现他们的安排令人满意，但他们要求允许在我们的一个省建立自己的城市和船厂。如果我们能够提供原材料和技术，他们将资助建设；我们非常乐意接受这一提议。\n\n然而，我们的海盗朋友们性格多变，始终无法决定在哪里建造他们的城市——选址似乎每月都在变！\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_adriatic_pirate_missions_task_4:0 "我们的命运是一体的"
 01_adriatic_pirate_missions_task_4_DESC:0 "虽然我们以对港口的海盗船视而不见而闻名，但我们并没有正式承认他们的存在——[ROOT.GetCountry.GetRuler.GetName]要求我们抛开这个借口。虽然有些人在抵制他们的腐败影响，但在[ROOT.GetCountry.GetCapital.GetName]有呼吁公开接受海盗的生活方式。\n\n海盗们向我们派出了一名使者，他带着一份珍贵的礼物……一个未来的承诺。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_adriatic_pirate_missions_task_5:0 "水手的口粮"
 01_adriatic_pirate_missions_task_5_DESC:0 "通过适当照顾我们的水手，确保他们在出海时有充足的补给，他们就能航行得更远，时间更长。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_adriatic_pirate_missions_task_6:0 "西部是属于我们的"
 01_adriatic_pirate_missions_task_6_DESC:0 "#E 墨西拿海峡#!附近繁忙的商路正如同传说中的塞壬女妖般诱惑着我们，但敌对国家嫉妒我们的崛起，必将千方百计阻挠发展。若事态恶化，我们或许需要击败地中海最强海军，让世人明白西方海域属于谁！\n\n#Y 我们将立即向#!#R 西地中海最强海军#!#Y 宣战！#!\n\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 01_adriatic_pirate_missions_task_7:0 "声称我们的海"
 01_adriatic_pirate_missions_task_7_DESC:0 "控制#E Orikon#! 和#E Hydrous#! 的战略领土将使我们能够监控驶入和驶出Mare Adriaticum的交通——在我们能够真正宣称这个水体实际上是我们的海之前，我们需要的最后一步\n\n拥有土地是一回事，守住土地是另一回事，因此我们必须培养下一代，教会他们如何守住我们所拥有的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_adriatic_pirate_missions_task_8:0 "窃取镰刀"
 01_adriatic_pirate_missions_task_8_DESC:0 "拥有#E 科基拉#! 要塞岛的价值不言而喻；我们不仅必须拥有它，而且必须拒绝我们的敌人使用它的宝贵位置。如果该岛落入我们的舰队手中，我们将拥有一个完美的中转点来突袭整个#E 希腊#!。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_adriatic_pirate_missions_task_9:0 "埃皮罗特突击队"
 01_adriatic_pirate_missions_task_9_DESC:0 "现在，#E 科基拉#! 属于[ROOT.GetCountry.GetName]，我们可以采取必要的措施，使其成为完美的海盗天堂；Sinus Corinthus的水域将成为我们的水手遵循的高速公路，直达财富的中心！\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!！"
 adriatic_piracy_fearsomely_arrayed_tt:0 "我们需要#Y 年轻人必须服役#!#E 伊利里亚军事传统#!。"
 adriatic_piracy_illyrian_piracy_tt:0 "我们需要#E 伊利里亚军事传统#!中的#Y 伊利里亚海盗#!。"
 adriatic_piracy_libernian_liburnian_tt:0 "我们需要#E 伊利里亚军事传统#!中的#Y 利部耳尼亚#!。"
 adriatic_piracy_local_shipbuilding_tt:0 "我们需要#Y 当地的造船业#!#E 伊利里亚军事传统#!。"
 adriatic_piracy_wherever_the_water_touches_tt:0 "我将获得全世界所有沿海港口的宣称！"
 adriatic_pirate_iron_chain_mod:0 "铁链"
 adriatic_pirate_korkyra_tt:0 "#Y 科基拉#!必须是一座#Y 城市#!，并拥有一个#Y 要塞#!和一个#Y 港口#!。"
 adriatic_pirate_mare_nostrum_mod:0 "我们的海"
 adriatic_pirate_meligounis_tt:0 "#Y 梅利古尼斯#!必须是一座#Y 城市#!，并拥有一个#Y 要塞#!和一个#Y 港口#!。"
 adriatic_pirate_missions_task_22_tt:0 "至少#Y 10#!个位于#Y $illyria_region$#!地区的领土拥有一个[GetBuilding('port_building').GetName|Y]（当前#Y [SCOPE.ScriptValue('adriatic_pirate_missions_task_22_ports_current')|0]#!）"
 adriatic_pirate_rhodos_tt:0 "#Y 罗得斯#!必须是一座#Y 城市#!，并拥有一个#Y 要塞#!和一个#Y 港口#!。"
 adriatic_pirate_squeezing_straight_mod:0 "封锁墨西拿海峡"
 adriatic_pirate_supremacy_war_tt:0 "以#Y 海上霸权#!战争目标向在地中海东部海军规模最大却没有与#Y [SCOPE.GetRootScope.GetCountry.GetName]#!结盟的国家#R 宣战#!。"
 adriatic_pirates_crown:0 "海盗之冠"
 adriatic_pirates_crown_desc:0 "众所周知，海盗不尊重任何法律，只尊重自己的法律，但即使他们也承认海盗王室的权威。"
 adriatic_polluted_pirates_mod:0 "被海盗所污染"
 adriatic_raiding_parties:0 "突击队"
 calling_all_pirates_adriatic_modifier:0 "对所有海盗的呼吁"
 center_of_adriatic_piracy:0 "亚得里亚海海盗的巢穴"
 corrupt_pirate_den:0 "拥护海盗行为"
 desc_adriatic_pirate_iron_chain_mod:0 "在一项工程壮举中，我们在奥里孔和海德鲁斯之间建立了一条铁链。"
 desc_adriatic_pirate_mare_nostrum_mod:0 "亚得里亚海的水域是字面上的 \"我们的海\"；没有我们的允许，任何人都不能驶入或驶出。"
 desc_adriatic_pirate_squeezing_straight_mod:0 "就像拳头封住喉咙一样，我们控制着意大利半岛两边的战略水路。"
 desc_adriatic_polluted_pirates_mod:0 "在#E 亚得里亚海#! 的海盗比世界上任何其他水域都多。"
 desc_adriatic_raiding_parties:0 "容易得到的利益的诱惑召唤我们的战士去突击。"
 desc_calling_all_pirates_adriatic_modifier:0 "我们已经远远传开，海盗和强盗可以在我们的土地上找到工作。"
 desc_center_of_adriatic_piracy:0 "这片地区为海盗提供安全港湾，使当地拥有令人畏惧且臭名昭著的名声。"
 desc_corrupt_pirate_den:0 "不可否认的是，海盗们在这里掌权。"
 desc_fearsomely_arrayed_modifier:0 "我们不是一群衣衫褴褛的海盗，而是一支穿着全套军装的专业战斗部队。"
 desc_grumbling_illyrian_pirates:0 "在我们的历史上，我们的海军陆战队第一次表现出不服从命令--无疑是海盗影响的直接结果。"
 desc_grumbling_sailors:0 "我们的海军陆战队不喜欢被人指手画脚，显然，他们正在生闷气。"
 desc_illyrian_pirate_library_center:0 "与流行的观点相反，我国境内的海盗并不是野蛮人，而是有文化、有学问的。"
 desc_illyrian_pirate_ships_of_doom:0 "当我们的敌人看到我们的舰队在地平线上攀升时，到那时，对他们来说已经太晚了。"
 desc_illyrian_pirate_shipyard:0 "海盗们已经占领了这片沿海领土，为自己的目的而使用。"
 desc_illyrian_pirate_unrest:0 "聚集在这个地区的不怀好意的人带来了风险和危险的因素。"
 desc_libernian_liburnian_modifier:0 "我们在解放军的设计基础上对我们的轻型舰艇进行了改造。"
 desc_naval_hegemon_illyria_pirate:0 "我们的海军不惧怕任何人，将攻击两倍、三倍于他们规模的舰队，仍然取得胜利。"
 desc_sailors_rations_adriatic_modifier:0 "因为我们的人一生都在海上，我们为他们提供营养丰富的口粮是一种荣誉。"
 desc_the_battle_for_the_west_mod:0 "我们全国都致力于赢得西部之战；我们必须一劳永逸地证明我们的海军优势。"
 fearsomely_arrayed_modifier:0 "令人恐惧的排列"
 grumbling_illyrian_pirates:0 "叛变的海军陆战队"
 grumbling_sailors:0 "抱怨的水手们"
 illyrian_pirate_library_center:0 "海盗图书馆"
 illyrian_pirate_queen:0 "海盗船长"
 illyrian_pirate_ships_of_doom:0 "亚得里亚海的祸害"
 illyrian_pirate_shipyard:0 "海盗船厂"
 illyrian_pirate_unrest:0 "海盗骚乱"
 libernian_liburnian_modifier:0 "利伯尔尼人 利伯尔尼人"
 me_adriatic_pirate_1.a:0 "我想让你知道，还有大量的硬币可供利用。"
 me_adriatic_pirate_10.a:0 "那些精通暴力艺术的人可能会找到他们永远的家"
 me_adriatic_pirate_10_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，最近被赋予#Y 海盗王冠#! ，使[ROOT.GetCountry.GetRuler.GetHerHim]受到全世界众多海盗飞地的关注，他利用[ROOT.GetCountry.GetName]的大量资源，向外交范围内的每个港口和海港发出信息--这个信息被[SCOPE.sCharacter('random_pirate_representative').GetName]的声音放大，他正在获得一个无畏的海盗船长的声誉。[ROOT.GetCountry.GetRuler.GetFirstName]不仅承诺对任何逃离合法迫害者的人实行大赦，而且还同意向那些愿意放弃道德并过上无情生活的有经验的甲板工人和海军陆战队员支付丰厚的工资--[ROOT.GetCountry.GetAdjective]海军需要这样的人。"
 me_adriatic_pirate_10_title:0 "$01_adriatic_pirate_missions_task_10$"
 me_adriatic_pirate_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_10$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_11.a:0 "我们将把敌人的船只送入海底!"
 me_adriatic_pirate_11_desc:0 "尽管#E 海德鲁斯#! 的军团和他们的盟友正在徒劳地集结成阵，他们紧张的眼睛正在扫描地平线上的[ROOT.GetCountry.GetAdjective]侦察兵，但他们只会被死亡和毁灭之神拜访。很快，我们的士兵将在意大利人的靴子跟前降落，消灭我们的敌人，为[ROOT.GetCountry.GetName]征服这个重要的港口。"
 me_adriatic_pirate_11_title:0 "$01_adriatic_pirate_missions_task_11$"
 me_adriatic_pirate_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_11$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_12.a:0 "为战争而战!对我们的敌人决不手软!"
 me_adriatic_pirate_12_desc:0 "#E 梅利古尼斯#!岛几乎不值得一提，几乎没有出现在大多数制图师的地图上，而且只是作为一种好奇心--警告潜在的强盗可能喜欢把这个小岛作为他们快速移动的船只的行动基地。\n\n事实证明，对于那些愿意倾听的人来说，这是一个明智的建议，因为这正是我们对该地区的计划。一旦我们将该岛据为己有，骚扰#E 墨西拿海峡#!的航道将是一件微不足道的事情。"
 me_adriatic_pirate_12_title:0 "$01_adriatic_pirate_missions_task_12$"
 me_adriatic_pirate_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_12$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_13.a:0 "有一天，我们可能会从我们的城市梅利古尼斯扩张......当心"
 me_adriatic_pirate_13_desc:0 "从#E 希腊#! 和#E 亚洲#! 的港口起航的许多船只有时会落入[ROOT.GetCountry.GetAdjective]海盗设置的陷阱，这些海盗在#E 墨西拿海峡#!游荡，他们在#E 梅利古尼斯#!岛的坚固城市中活动。当太阳落山时，众所周知，海盗们可以自由地统治这片海域，许多被烧毁和冒烟的贸易船只被[ROOT.GetCountry.GetAdjective]海盗们偷走了宝贵的货物，在#E 意大利#!海岸沉没。\n\n尽管意大利人共同努力将亚得里亚海的海盗赶出这个小岛，但没有人能够接管这些[ROOT.GetCountry.GetAdjective]卑鄙小人建造的防御工事，他们继续让当地人的生活变得悲惨。"
 me_adriatic_pirate_13_title:0 "$01_adriatic_pirate_missions_task_13$"
 me_adriatic_pirate_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_13$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_14.a:0 "利伯尔尼号是我们战时战略的一个重要方面"
 me_adriatic_pirate_14_desc:0 "较弱的人可能会安于现状，享受他们来之不易的战役的成功，而[ROOT.GetCountry.GetRuler.GetName]却不是一般的领导者。尽管我们的海军完全够用，但我们还是决定花钱对我们的解放军战舰进行大修，因为[ROOT.GetCountry.GetRuler.GetFirstName]认为，即使是微不足道的收益也会帮助我们对抗众多的敌人，因此这是一项值得进行的投资。现在，当我们的舰队聚集在亚得里亚海的水域巡逻时，所有的批评者都在一片惊愕中喘不过气来--我们的海军是一个令人敬畏的景象。"
 me_adriatic_pirate_14_title:0 "$01_adriatic_pirate_missions_task_14$"
 me_adriatic_pirate_14_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_14$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_15.a:0 "[ROOT.GetCountry.GetName]万岁，[ROOT.GetCountry.GetRuler.GetName]万岁!"
 me_adriatic_pirate_15_desc:0 "谁能预见到我们旅程的终点会带来什么？[ROOT.GetCountry.GetRuler.GetName]现在公开被誉为强盗和小偷的领袖，完全可以戴上#Y 海盗的皇冠#! ，并以所有的权力进行统治--这是几个世纪以来没有得到的荣誉。\当[ROOT.GetCountry.GetRuler.GetFirstName]第一次指示[ROOT.GetCountry.GetAdjective]人民遵循[ROOT.GetCountry.GetRuler.GetHerHis]的方向时，没有人能够预料到会发生的戏剧性效果--不知何故，[ROOT.GetCountry.GetRuler.GetFirstName]给一个海盗王国带来了合法性，整个世界现在必须向我们的海军递交贡品，否则将面临彻底的毁灭。\如果世界上的文明国家不对我们的人民表示敬意，他们将看到自己的光芒熄灭--一个新的时代已经到来，我们将毫不犹豫地摧毁任何反对我们统治的人。"
 me_adriatic_pirate_15_title:0 "$01_adriatic_pirate_missions_task_15$"
 me_adriatic_pirate_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_15$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_16.a:0 "你的死亡将是暴力和痛苦的，但希望能很快。"
 me_adriatic_pirate_16_desc:0 "对于我们的受害者来说，不幸的是，我们的士兵属于后者；他们不仅训练有素，有无数次的战役经验，而且他们身穿精美的盔甲，在我们的敌人心中造成了可怕的恐惧。"
 me_adriatic_pirate_16_title:0 "$01_adriatic_pirate_missions_task_16$"
 me_adriatic_pirate_16_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_16$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_17.a:0 "聪明人都知道，外表确实可以欺骗人。"
 me_adriatic_pirate_17_desc:0 "来到[ROOT.GetCountry.GetCapital.GetName]的游客必须提醒自己，他们是在一个自称的#E 海盗王国的首都#!，因为他们的先入为主的观念通常会被[ROOT.GetCountry.GetAdjective]权力所在地的建筑宏伟所挑战。因为海盗--盗贼和破坏者--怎么会有能力建造这样一个美丽的地方呢？\当人们漫步在横跨[ROOT.GetCountry.GetCapital.GetName]商业区中心的主干道的郁郁葱葱的柱廊中时，人们经常可以听到沸沸扬扬的谈话片段，听到激烈争论的哲学论调，甚至可以在市场的声音中听到一个弹奏竖琴的杂音--显然，这是一个繁荣的、有生命力的、呼吸的城市。...可以说是一个文明的中心，一个值得效仿的地方。一个城市，建立在偷来的黄金和奴隶的背上"
 me_adriatic_pirate_17_title:0 "$01_adriatic_pirate_missions_task_17$"
 me_adriatic_pirate_17_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_17$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_18.a:0 "我们的名字将因我们将要做的事情而载入史册"
 me_adriatic_pirate_18_desc:0 "尽管[GetProvince('(int32)266').GetName]岛是整个地中海地区争议最大的岛屿之一--德米特里欧斯未能攻下城墙的故事已经成为一个近乎传奇的故事--但没有人相信[ROOT.GetCountry.GetAdjective]海盗会如此大胆地将这个岛据为己有。\然而，在真正的海盗时尚中，[ROOT.GetCountry.GetName]的领导人[ROOT.GetCountry.GetRuler.GetName]已经策划了一个值得狡猾的计划，也许是历史上有史以来最伟大的抢劫案--彻底偷窃该岛。两周后，在[ROOT.GetCountry.GetRuler.GetFirstName]的指导下，我们将发动一次秘密的海军入侵。我们的计划是在夜深人静的时候到达，在南部靠近[GetProvince('(int32)1830').GetName]的地方神不知鬼不觉地登陆，并在警报传出之前用我们的精锐部队压倒当地人。我们的舰队将封锁[GetProvince('(int32)266').GetName]的港口，阻止任何盟友的援助，希望城市能在黎明前陷落......听起来很简单，对吗？"
 me_adriatic_pirate_18_title:0 "$01_adriatic_pirate_missions_task_18$"
 me_adriatic_pirate_18_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_18$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_19.a:0 "居民们拥抱我们带给他们的生命，似乎"
 me_adriatic_pirate_19_desc:0 "[ROOT.GetCountry.GetAdjective]海盗船现在可以自由地从#E Rhodos#! 的港口出发，一天的交通量非常大，港口总是热闹非凡。有通常的贸易船从遥远的东方运送货物，但也有雇佣兵和强盗在这些水域抛锚。虽然有关于在海岸附近建造灯塔的讨论，但辩论已经陷入了通常的预算争论中--这表明日常生活的骚动，以及所有的喧嚣，正在回到岛上。"
 me_adriatic_pirate_19_title:0 "$01_adriatic_pirate_missions_task_19$"
 me_adriatic_pirate_19_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_19$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_1_desc:0 "一旦消息传出，[ROOT.GetCountry.GetRuler.GetName]会向任何想在该地区找到工作的逃亡水手支付丰厚的银子--事实上，他们是新铸的硬币--我们毫不怀疑，我们会有很多经验丰富的海员抵达[ROOT.GetCountry.GetCapital.GetName]，他们渴望我们为他们安排的艰苦工作。正如[ROOT.GetCountry.GetRuler.GetFirstName]所说，我们有什么资格去评判他们的过去？毕竟，我们更关心他们的未来。到目前为止，我们的举措进展顺利--非常顺利。事实上，我们听说这些新来的人已经在沿海地区安家了，并感谢[ROOT.GetCountry.GetName]的人民为他们提供了安全的避难所。我们希望我们和海盗之间的关系继续有益。"
 me_adriatic_pirate_1_title:0 "$01_adriatic_pirate_missions_task_1$"
 me_adriatic_pirate_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_1$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_2.a:0 "在[ROOT.GetCountry.GetName]中等待你的是束缚的生活。"
 me_adriatic_pirate_20.a:0 "我们将建立世界上有史以来第一个海盗帝国......。"
 me_adriatic_pirate_20_desc:0 "我们收到的答复类型涉及人类情感的方方面面--愤怒、笑声、难以置信、铁青着脸的冷漠--然而我们是致命的认真。我们实际上已经声称拥有世界上的每一个港口；如果我们的船只有能力驶向港口，我们将以战斗的方式进入驻军，为自己夺取土地。凡是水接触到的地方都是[ROOT.GetCountry.GetName]的海军陆战队的公平游戏!"
 me_adriatic_pirate_20_title:0 "$01_adriatic_pirate_missions_task_20$"
 me_adriatic_pirate_20_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_20$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_21.a:0 "在这里，拿着我们手头的东西......但要战斗！\"！"
 me_adriatic_pirate_21.b:0 "我拒绝给你们这些狗东西！你竟敢向我要硬币！"
 me_adriatic_pirate_21_desc:0 "在一个没有月亮的夜晚，[ROOT.GetCountry.GetAdjective]舰队正在接近#E Rhodos#! 岛，只有沿海城市的远处灯光打破了阴暗。[ROOT.GetCountry.GetRuler.GetName]正在甲板下与[ROOT.GetCountry.GetRuler.GetHerHis]军事顾问协商，这时一群水手冲进了船长的房间。'我们是带着最后通牒来的--预兆清楚地表明，诸神并不支持我们，如果你想让我们战斗，那么你需要将我们的薪水提高三倍。所有的人都同意......我们要两百个硬币，而且我们现在就想要。[ROOT.GetCountry.GetRuler.GetFirstName]骂道，转过身来，手放在[ROOT.GetCountry.GetRuler.GetHerHis]剑柄上。'我们离着陆只差一点......你怎么能在这种时候要求更多的钱呢？"
 me_adriatic_pirate_21_title:0 "靠近岛屿"
 me_adriatic_pirate_21_tooltip:0 "$mission_completed_tooltip_1$“#Y 接近那座岛屿#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_22.a:0 "[ROOT.GetCountry.GetRuler.GetFirstName]一头扎进战斗中"
 me_adriatic_pirate_22.b:0 "[ROOT.GetCountry.GetRuler.GetFirstName]从安全距离用箭攻击"
 me_adriatic_pirate_22.c:0 "[ROOT.GetCountry.GetRuler.GetFirstName] 胆小怕事，临阵脱逃"
 me_adriatic_pirate_22_desc:0 "尽管在我们的部队登陆前发生了不愉快的一幕，但#E Rhodos#! 之战现在真正开始了，沉睡的当地人唤醒了他们的驻军，并在战斗中与[ROOT.GetCountry.GetAdjective]陆战队相遇。在被打了个措手不及的恐慌中，Rhodians正以一种我们的人没有准备好的绝望来战斗。不幸的是，我们登陆的最初阶段很困难；抵抗很激烈，我们被压回了海滩。意识到命运把[ROOT.GetCountry.GetRuler.GetHerHis]带到了这个时刻，[ROOT.GetCountry.GetRuler.GetName]看到了一个可以利用的Rhodian中心的缺口，但必须迅速做出决定，否则一切都会失败！[ROOT.GetCountry.GetRuler.GetName]说！"
 me_adriatic_pirate_22_title:0 "[ROOT.GetCountry.GetAdjective]海盗的最后时刻"
 me_adriatic_pirate_22_tooltip:0 "$mission_completed_tooltip_1$“#Y [ROOT.GetCountry.GetAdjective]海盗的最后时刻#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_23.a:0 "说实话，我不认为这真的会成功。"
 me_adriatic_pirate_23_desc:0 "不知何故，[ROOT.GetCountry.GetRuler.GetName]设法取得了对#E 罗迪亚人#!的胜利，让所有人都感到惊讶--包括[ROOT.GetCountry.GetAdjective]入侵者，他们在夜深人静时几乎被淹没。最后，是[ROOT.GetCountry.GetRuler.GetFirstName]的计划的纯粹大胆赢得了胜利--出其不意的因素给了我们的人足够的优势，他们才得以成功。当消息传出，我们成功地掠夺了这个岛，我们无疑会获得一些强大的敌人，所以我们应该为反击做好准备...但我们还是做到了--我们偷了#E 罗得岛#!!"
 me_adriatic_pirate_23_title:0 "凋零的玫瑰"
 me_adriatic_pirate_23_tooltip:0 "$mission_completed_tooltip_1$“#Y 凋零的玫瑰#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_24.a:0 "陌生人，如果你低估了我们，你将面临危险。"
 me_adriatic_pirate_24_desc:0 "访问[ROOT.GetCountry.GetAdjective]士兵营地的外交官经常惊讶地听到战争帐篷里的哲学讨论，普通士兵的口才往往可以和首都最好的演说家相媲美。虽然[ROOT.GetCountry.GetName]的公民被称为激烈的黄金爱好者，但没有人可以否认他们没有好好利用他们偷来的卷轴和文本。许多人相信，并且有充分的理由相信，[ROOT.GetCountry.GetAdjective]人是野蛮民族中最聪明的，因为他们阅读并理解他们偷窃的哲学和历史。"
 me_adriatic_pirate_24_title:0 "哲学家和海盗"
 me_adriatic_pirate_24_tooltip:0 "$mission_completed_tooltip_1$“#Y 哲学家和海盗#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_26.a:0 "如果你必须进入我们的水域，但不要说你没有被警告过。"
 me_adriatic_pirate_26_desc:0 "除非有官方的[ROOT.GetCountry.GetAdjective]代表团（即全副武装的代表团）陪同，否则每个人都会避开海盗猖獗的#E 超级海洋#! 水域，即使这样也不足以防止偶尔会有失落的船只失踪。\原因是显而易见的；有这么多的海盗和强盗在这个地区航行，不可能保证每个人的安全--这里绝对被海盗污染了，他们是明确的工艺大师，更愿意亲自示范。"
 me_adriatic_pirate_26_title:0 "被海盗所污染"
 me_adriatic_pirate_26_tooltip:0 "$mission_completed_tooltip_1$“#Y 被海盗所污染#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_27.a:0 "我们需要提醒Teuta谁是负责人--让每个人都回到自己的帐篷里去。"
 me_adriatic_pirate_27.b:0 "我们将暂时咬住我们的舌头"
 me_adriatic_pirate_27.c:0 "呃，我们没有什么可担心的......我感谢你的帮助。"
 me_adriatic_pirate_27_desc:0 "一天早上，[ROOT.GetCountry.GetRuler.GetName]被告知，[SCOPE.sCharacter('random_pirate_representative').GetName]，来自海盗公会的官方特使，一直在岸边聚集我们的一些新兵，训练他们的突击技术。虽然这个举措很值得赞赏，但这直接损害了[ROOT.GetCountry.GetRuler.GetFirstName]的权威--如果有人要训练我们的水手，那应该是[ROOT.GetCountry.GetRuler.GetPraenomen]，而不是一些新秀海盗战士。\尽管如此，没有人可以否认，[SCOPE.sCharacter('random_pirate_representative').GetFirstName]不是一个令人印象深刻的人物；她是一个天生的领导者，我们的海军陆战队员正在仔细聆听她的指示，渴望了解她能分享的任何秘密。令[ROOT.GetCountry.GetRuler.GetFirstName]恼火的是，我们的一些士兵甚至似乎更喜欢Teuta的指挥！不管[ROOT.GetCountry.GetRuler.GetFirstName]现在决定做什么，我们都要盯着Teuta，这个爱管闲事的家伙。"
 me_adriatic_pirate_27_title:0 "领导权威的质疑"
 me_adriatic_pirate_27_tooltip:0 "$mission_completed_tooltip_1$“#Y 领导权威的质疑#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_28.a:0 "我们将与特欧塔战斗到最后一个人！"
 me_adriatic_pirate_28.b:0 "我不会看到我为[ROOT.GetCountry.GetName]建立的东西被破坏......。"
 me_adriatic_pirate_28_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们有一个可怕的消息--似乎我们最担心的事情已经发生了。看来，[SCOPE.sCharacter('random_pirate_representative').GetName]，我们身边永远的眼中钉，正试图从我们手中夺取权力！她是否得到了海盗公会的授权而这样做是没有意义的！她是否得到了海盗公会的授权，这一点毫无意义......我们所知道的是，我们有相当一部分力量已经宣誓效忠于[SCOPE.sCharacter('random_pirate_representative').GetFirstName]，他承诺将迎来一个黄金时代。当然，我们可以战斗，但许多人将失去生命--这是多么大的灾难啊!有句老话怎么说来着--'如果一个人和狗躺在一起，那么你就会被跳蚤吵醒'......也许我们不应该邀请海盗进入我们的城市。"
 me_adriatic_pirate_28_title:0 "与狗同眠"
 me_adriatic_pirate_28_tooltip:0 "$mission_completed_tooltip_1$“#Y 与犬同卧#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_29.a:0 "每一个无辜的死亡，每一个被烧毁的城市--这都是你的责任，特乌塔"
 me_adriatic_pirate_29_desc:0 "我们的和平姿态被[SCOPE.sCharacter('random_pirate_representative').GetName]的代理人拒绝了，他们几个月前还光荣地为[ROOT.GetCountry.GetRuler.GetName]服务--我们不知道[ROOT.GetCountry.GetName]内部的腐败已经蔓延到什么程度。现在，我们面临着举起武器对付我们的兄弟和表亲的严峻任务--内战已经来临，不会有赢家。将剩余的[ROOT.GetCountry.GetRuler.GetHerHis]部队召集到[ROOT.GetCountry.GetCapital.GetName]，[ROOT.GetCountry.GetRuler.GetFirstName]准备迎接未来的黑暗日子。"
 me_adriatic_pirate_29_title:0 "[ROOT.GetCountry.GetName]的命运"
 me_adriatic_pirate_29_tooltip:0 "$mission_completed_tooltip_1$“#Y [ROOT.GetCountry.GetName]的命运#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_2_desc:0 "生活在[GetProvince('(int32)50').GetArea.GetRegion.GetName]和[GetProvince('(int32)4082').GetArea.GetRegion.GetName]的人们不应该指望恶劣的天气来阻止[ROOT.GetCountry.GetAdjective]的奴隶船在他们的海岸边航行，攻击不设防的港口和偷窃无辜的灵魂。我们也不会放过生活在[GetProvince('(int32)117').GetArea.GetRegion.GetName]的公民，而是要抓住他们的儿子和女儿，把他们送进矿井深处。每个人都会知道，我们贪得无厌，无所畏惧，就像一只狂热的动物，一旦我们闻到血腥味，就无法阻止自己追寻猎物--奴隶。"
 me_adriatic_pirate_2_title:0 "$01_adriatic_pirate_missions_task_2$"
 me_adriatic_pirate_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_2$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_3.a:0 "正如你所看到的，所有的[ROOT.GetCountry.GetName]都从这一努力中受益。"
 me_adriatic_pirate_30.a:0 "我接受这一荣誉，并将带领[ROOT.GetCountry.GetName]走向其承诺的未来。"
 me_adriatic_pirate_30_desc:0 "没有人能够预料到所发生的事情--好吧，也许这不是真的，因为[ROOT.GetCountry.GetRuler.GetName]似乎被一个单一的目的所驱使，而且从各方面来看，[ROOT.GetCountry.GetRuler.GetSheHe]已经成功了。随着#Y 海盗王国#! 正在[ROOT.GetCountry.GetName]建立的消息远播，这被视为一种公开的邀请，野心家和狡猾的人离开他们的家园来到[ROOT.GetCountry.GetCapital.GetName]。虽然这是一个不争的事实，但只有当海盗们接受你时，你才能统治他们，而最后一位酋长被发现是不合格的--当时机成熟时，弱者被打倒，现在一个大胆的领导者承担起了国家的责任。一个新的时代正在到来，一个女王将完成别人开始的工作--所有的人都向[ROOT.GetCountry.GetRuler.GetName]致敬，[ROOT.GetCountry.GetName]的新统治者!"
 me_adriatic_pirate_30_title:0 "海盗女王的崛起"
 me_adriatic_pirate_30_tooltip:0 "$mission_completed_tooltip_1$“#Y 海盗女王的崛起#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_3_desc:0 "即使你是一个王国的统治者，也不会轻易与海盗达成交易，但[ROOT.GetCountry.GetRuler.GetName]接受了一个[ROOT.GetCountry.GetRuler.GetSheHe]无法拒绝的提议；一个免费的城市，沿着我们的海岸线建造，以换取原材料。[ROOT.GetCountry.GetRuler.GetName]听说工程立即开始，亲自视察了工地，并留下了深刻的印象；海盗们不惜成本，正在建造一个海港，将使我们的人民世代受益。不管人们如何看待他们的名声，这些强盗在建筑方面很懂质量。"
 me_adriatic_pirate_3_title:0 "$01_adriatic_pirate_missions_task_3$"
 me_adriatic_pirate_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_3$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_4.a:0 "我们不会放弃我们的祖先给我们的遗产"
 me_adriatic_pirate_4.b:0 "现在已经没有回头路了......我们就是这样的人"
 me_adriatic_pirate_4_desc:0 "今天，[ROOT.GetCountry.GetCapital.GetName]召开了一场会议，它将作为我们历史上的转折点之一载入[ROOT.GetCountry.GetName]的记录。来自海盗公会的代表，一位名叫[SCOPE.sCharacter('random_pirate_representative').GetName]的女贵族，向[ROOT.GetCountry.GetRuler.GetName]提出了正式联手的建议。既然我们共同建立的伪装已经存在，为何不公开承认我们正在成为什么？我们现在是一个#E 海盗国家#!——[ROOT.GetCountry.GetRuler.GetFirstName]曾经提供的安全港湾已经真正成为许多人的家园，他们现在将为[ROOT.GetCountry.GetName]战斗和牺牲。作为忠诚的承诺，海盗们已将一件被称为#Y 海盗之冠#!的珍宝托付给我们。虽然我们无权穿上第一位#E 海盗王#!的古老礼服，那是一位千年前威胁埃及航运的半神话人物，但仅仅拥有这件文物就表明了海盗们对[ROOT.GetCountry.GetName]的信任——这样的事情以前发生过吗？\n\n拥抱#Y 海盗遗产#!可以为我们带来许多好处，但必须承认，一旦我们是流氓国家的消息传出，远近诸国都会相应地对待我们。我们必须谨慎，[ROOT.GetCountry.GetRuler.GetFirstName]。\n\n#R 如果我们公开拥抱海盗，我们在国外的声誉会受到影响。#!"
 me_adriatic_pirate_4_title:0 "$01_adriatic_pirate_missions_task_4$"
 me_adriatic_pirate_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_4$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_5.a:0 "真的，我们的人民很慷慨--而且他们吃得很好"
 me_adriatic_pirate_5_desc:0 "除了在[ROOT.GetCountry.GetCapital.GetName]本地种植粮食外，我们还持续进口大量谷物，因此我们能够为水手提供优于他国的补给——当你每天大部分时间都待在三列桨战舰的甲板上时，这一点意义重大。\n\n我们还自豪地能为士兵提供咸猪肉和硬面饼；虽然花费更高，但士兵们会记住那些照顾他们的领袖。每个人都在尽自己的一份力；甚至连[ROOT.GetCountry.GetAdjective]本地居民也用他们的渔网捕鱼，并在海滩上熏制后装上我们的船只。还有多少支海军能为他们的士兵提供如此丰盛的膳食？"
 me_adriatic_pirate_5_title:0 "$01_adriatic_pirate_missions_task_5$"
 me_adriatic_pirate_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_5$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_6.a:0 "我们不惧怕任何人，我们将证明这一点!"
 me_adriatic_pirate_6.b:0 "实际上，等等......我们在和谁打架？这似乎有点太早了!"
 me_adriatic_pirate_6_desc:0 "战争即将来临，这并不奇怪--有许多人希望看到[ROOT.GetCountry.GetName]被贬为奴隶的角色，但我们会抓住那些梦想我们灭亡的傻瓜，把他们送到矿井里工作。尽管如此，我们不能否认罗马人、埃及人和希腊人的船只--他们对我们的水域和我们的权威不屑一顾，因此必须受到责罚。意识到海盗们正期待着[ROOT.GetCountry.GetRuler.GetName]向所有人证明我们不是软柿子，而是真正的威胁，[ROOT.GetCountry.GetRuler.GetSheHe]提议我们大胆地攻击地中海最强大的海军，以显示统治地位。"
 me_adriatic_pirate_6_title:0 "$01_adriatic_pirate_missions_task_6$"
 me_adriatic_pirate_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_6$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_7.a:0 "首先是马雷岛，但总有一天，整个地中海都将是我们的。"
 me_adriatic_pirate_7_desc:0 "不可否认，我们是#E Mare Superum#! 的主人--我们实际上控制着守卫水体入口的领土，一旦你进入我们已经视为自己的海洋，我们的权力就会被承认为没有受到挑战。"
 me_adriatic_pirate_7_title:0 "$01_adriatic_pirate_missions_task_7$"
 me_adriatic_pirate_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_7$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_8.a:0 "科基拉人永远不会想到有一支[ROOT.GetCountry.GetAdjective]海军会攻击他们的海墙!"
 me_adriatic_pirate_8_desc:0 "虽然我们对[GetProvince('(int32)470').GetName]没有历史或文化上的宣称，但已经决定无论如何都要拿下这个岛——拥有黑岛会给[ROOT.GetCountry.GetName]带来很多机会，所以我们没有其他选择。我们已经下达命令，尽可能地保留港口区，因为我们最终会用到它。"
 me_adriatic_pirate_8_title:0 "$01_adriatic_pirate_missions_task_8$"
 me_adriatic_pirate_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_8$#!”$mission_completed_tooltip_2$"
 me_adriatic_pirate_9.a:0 "弱小的埃皮罗特人无法阻止我们对他们进行盲目的抢劫"
 me_adriatic_pirate_9_desc:0 "自从[ROOT.GetCountry.GetAdjective]们无缘无故地夺取了这个岛[GetProvince('(int32)470').GetName]之后，对于#E 伊庇鲁斯#!的人们来说，他们一直生活在恐惧之中，害怕被诅咒的[ROOT.GetCountry.GetAdjective]突袭者回来，现在他们的海岸受到恐吓。海岸边的每个社区都受到了影响，许多难民放弃了一切，逃到了山上。对他们来说，不幸的是，[ROOT.GetCountry.GetRuler.GetName]正威胁着要彻底征服伊庇鲁斯的领土......很明显，[ROOT.GetCountry.GetName]是要留下来的。"
 me_adriatic_pirate_9_title:0 "$01_adriatic_pirate_missions_task_9$"
 me_adriatic_pirate_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_adriatic_pirate_missions_task_9$#!”$mission_completed_tooltip_2$"

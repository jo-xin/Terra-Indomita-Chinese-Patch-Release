l_simp_chinese:
 01_albania:0 "阿尔巴尼亚的伟大"
 01_albania_BUTTON_TOOLTIP:0 "至此，我们开始走向辉煌——我们将拥抱我们的命运！"
 01_albania_CRITERIA_DESCRIPTION:0 "这一使命将在#E 阿尔巴尼亚#!完成其经济和基础设施建设，达到与光荣的阿尔巴尼亚民族相称的严格标准后完成。"
 01_albania_DESCRIPTION:0 "很久以前，当世界还很年轻，诸神仍行走在地球表面时，战士#E 阿尔汉#!曾穿越#E 高加索山脉#!，前往广阔的草原，而在他的足迹所触及的地方，我们的人民就留在那里。\n \n我们是阿尔汗之子，是和蔼可亲的#E 阿尔巴尼亚人#!，我们当之无愧地享有善良、和平人民的美誉——也许这让我们感到羞耻，因为我们曾经无法抵抗#E 阿契美尼德王朝#!，他们公然蔑视我们的主权，干涉我们的内政，这是令人感到耻辱的。\n \n但时代已经变了，它们已经不复存在，而我们却站在这里。我们发现自己正处于十字路口；我们应该拥抱我们的本土根源还是追随#E 阿契美尼德#!传统？"
 01_albania_task_1:0 "阿尔汉之子"
 01_albania_task_10:0 "东高加索部落"
 01_albania_task_10_DESC:0 "列兹吉人与我们阿尔巴尼亚人一样，长期躲在高加索山脉的阴影下，与世隔绝。虽然将他们组织起来可能很困难，但像兄弟、大山之子一样团结起来应该对我们有好处。我们在一起将更加强大！\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_albania_task_11:0 "阿尔巴尼亚海"
 01_albania_task_11_DESC:0 "山脉、平原、马匹、矿山……这些都是我们熟悉的。水。水，只在山涧、河流才熟悉。但我们知道，财富来自远方，而海洋是最快的路径。我们与列兹吉人的接触告诉我们，我们视野之外的部落对海岸线没有牢固的控制权，也许我们可以利用这一点。"
 01_albania_task_12:0 "遥远花剌子模的威胁"
 01_albania_task_12_DESC:0 "众所周知，花剌子模的国王们已经把目光投向了我们的土地，希望征服沿马赞德兰（许尔卡尼亚）海的整个北部、东部和西部地区。据说他们的国王甚至恳求#T 亚历山大大帝#!支持他的野心，并狡猾地承诺将我们的土地交给希腊人。\n\n既然我们控制了水道和海岸，就应该轮到我们威胁他们的土地并收获他们灌溉充足的农作物了。攻克所谓的“五十堡绿洲”，将是我们人民最光荣的成就。\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_albania_task_13:0 "残存的阿契美尼德王朝"
 01_albania_task_13_DESC:0 "不久之后，我们的人民就忘记了过去波斯人和他们的阿契美尼德统治者的军队、建设者和官僚。在我们的土地上，仍然留存着许多他们的足迹遗迹。其中，有一座巨大的宫殿，是总督领的首府，现在仍处于休眠状态，在河岸上成了废墟。阿尔巴尼亚人为什么不抓住这个机会取代阿契美尼德王朝曾经在该地区的权力呢？他们的统治是漫长而繁荣的，也许我们还可以做得更好......"
 01_albania_task_14:0 "阿契美尼德式的治理"
 01_albania_task_14_DESC:0 "为了赢得阿契美尼德王朝曾经拥有的尊重和恐惧，我们必须复制他们赋予自治权、沟通性和威严的政府手段——这些是他们曾经对我们进行控制的同样方法。\n\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 01_albania_task_14_tt:0 "[GetCulture('pasargadi').GetName]文化已被整合。"
 01_albania_task_15:0 "伊朗众神"
 01_albania_task_15_DESC:0 "这个世界栖居着许多神明。群山之神守望我们的岁月已久远到超出记忆。然而，如果我们要以更伟大君王的形象统治新的黎明，也许新神的帮助能促成我们的新时代。那些神灵曾受米底人敬拜，他们是我们记忆中最早的征服者；波斯人也敬拜这些神灵，尽管他们否认此事。还有阿胡拉·马兹达及其无所不知的兄弟与侍从，大流士曾使我们知晓祂们，而波斯人至今仍最珍视祂们。毫无疑问，所有这些不朽者都在南方尘土飞扬的平原上拥有力量，甚至可能远不止于此……"
 01_albania_task_15_tt:0 "至少有3个城市地位的领土拥有[GetBuilding('temple_building').GetName|Y]（当前：[SCOPE.ScriptValue('svalue_01_albania_task_15_temples_current')|0Y]）。"
 01_albania_task_15_tt_a:0 "在你的#T 国家万神殿#!中拥有#E 至少#! #Y 1 位阿尔马济多神教#!神祇，以及在你的#T 国家万神殿#!中拥有#E 至少#! #Y 2 位祆教#! 或 #Y 2 位密特拉教#!神祇。"
 01_albania_task_16:0 "阿尔巴尼亚-伊朗的武器"
 01_albania_task_16_DESC:0 "居鲁士、大流士和阿尔塔薛西斯的所有敌人都害怕阿契美尼德旗帜下无穷无尽的军队。他们更加惧怕那些精英‘长生军’。有些人甚至相信，即使在最激烈的战斗中，他们也确实是不朽的。如果我们能够建立并利用这种令人敬畏的力量就好了。也许将他们的古老方式与我们灵活的山地和平原战术相结合，可以提供一支拥有多种技艺的战斗力量。\n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 01_albania_task_17:0 "宫殿中心"
 01_albania_task_17_DESC:0 "阿契美尼德王朝曾经在我们山区的许多宫殿及其他宏伟的宫殿中进行统治。如果我们要真正成为北方的文明者，我们就必须通过复制他们的荣耀来重新确立统治地位。让我们重建并重新安置古老的王座，那里有无数的知识和威望等待着我们。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_albania_task_18:0 "保卫阿契美尼德北方"
 01_albania_task_18_DESC:0 "现在我们已经占领了南方的领土，让我们庆祝一下带领我们走到这一步的人物 - 所有人都为[ROOT.GetCountry.GetRuler.GetName]的军事成就欢呼，他为[ROOT.GetCountry.GetName]的人民确保了阿契美尼德北方的安全！\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 01_albania_task_19:0 "阿尔巴尼亚行省"
 01_albania_task_19_DESC:0 "为了保护阿契美尼德王朝的遗产，我们的阿尔巴尼亚当局应该像我们以前一样为总督辖区制定同样的半自治政府制度。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_albania_task_1_DESC:0 "我们的古老故事讲述了一场#E 大洪水#!，而当洪水最终从地球表面退去时，我们的祖先，强大的战士#E 阿尔汉#!，长途跋涉，直到到达我们的人民和邻居居住的山区。\n\n众#E 阿尔巴尼亚#!部落还记得他们共同的历史吗？昔日的火花是否足以点燃阿尔巴尼亚民族的重生之火？\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_albania_task_1_tt:0 "获得对[GetProvince('(int32)1614').GetArea.GetName|Y]，[GetProvince('(int32)1584').GetArea.GetName|Y] 和[GetProvince('(int32)1611').GetArea.GetName|Y]区域的宣称"
 01_albania_task_2:0 "阿尔巴尼亚的土地"
 01_albania_task_20:0 "阿尔巴尼亚帝国"
 01_albania_task_20_DESC:0 "追随米底人、阿契美尼德人和马其顿人的脚步，阿尔巴尼亚人必须利用他们在领土方面的成就来夺取帝国统治带来的荣耀和政治控制权。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_albania_task_21:0 "贸易之路上的一步"
 01_albania_task_21_DESC:0 "而尽管高加索山脉被许耳卡尼亚海在地理上所束缚，但是它们还将欧亚贸易从东到西、从北到南贯穿整个高加索阿尔巴尼亚。 人们应该利用他们所处的自然地位并利用它来实现他们土地的经济利益。、\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 01_albania_task_22:0 "许耳卡尼亚海贸易"
 01_albania_task_22_DESC:0 "许耳卡尼亚海本身就是一个可能被游牧民族的掠夺队伍所包围的海洋，，但它确实有助于将东方的广阔市场与西方的买家联系起来。难道阿尔巴尼亚人不应该像南方的许耳卡尼亚人一样掌管水域吗？即使山脉和山谷是他们的天然家园？\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 01_albania_task_23:0 "卡巴拉的首都"
 01_albania_task_23_DESC:0 "如果想要人们之后很久还记得我们，就需要一座伟大的城市来容纳我们的遗产，至少在名义上是这样。我们最强大的部落，甚至我们之前的人们都将卡巴拉视为一个强大的栖息地，从这里可以保卫下面的土地以及进出我们领地的道路。让我们使这里成为在外交和战争中发挥我们力量的完美场所。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_albania_task_24:0 "阿尔巴尼亚骏马"
 01_albania_task_24_DESC:0 "当库拉河和阿拉克斯河汇合并汇入浩瀚的许耳卡尼亚海时，它们创造了最肥沃的土地。北方草原的骏马很早就被带到了这里，在遥远的田野里繁衍生息。我们最好去追求北方骑手所拥有的强大敏捷性，并利用这些野兽来达到我们自己的目的。\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 01_albania_task_25:0 "卡斯庇亚人"
 01_albania_task_25_DESC:0 "[ROOT.GetCountry.GetRuler.GetName] 在考虑居住在 [ROOT.GetCountry.GetName] 边境内的 #Y 卡斯庇亚人 #! 的地位时一直犹豫不决。\n\n针锋相对的观点都被提出了，双方都有其合理性；他们是应该被欢迎加入 [ROOT.GetCountry.GetAdjective] 社会，并享有我们人民所有的权利和特权，还是应该被戴上枷锁，送到田里去耕作？或者也许他们的地位应该降为部落民……这是一个重要的决定。\n\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 01_albania_task_25_tt:0 "#E 要么#!#E 整合#!#T 卡斯庇亚#!文化并#E 实施#!#Y 文化决议#!#G 赞助#!，#E 要么#!给予#T 卡斯庇亚#!文化#Y 部落民#!或#Y 奴隶#!#E 文化权利#!。"
 01_albania_task_26:0 "保卫达尔班德山口"
 01_albania_task_26_DESC:0 "达尔班德山口即使不是最著名的高加索门户之一，却也让许多伟大帝国感到恐惧。虽然草原游牧部落实际上因通过帕提亚“大门”进入伊朗高原而闻名，但米底人、阿契美尼德人和其他帝国长期以来一直担心游牧民族入侵高加索地区。然而，他们却无法意识到控制如此重要的连接两个不同世界的贸易中转站的潜力。让我们保护自己，成为最好的商人和税务官。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_albania_task_27:0 "人口不断增长"
 01_albania_task_27_DESC:0 "由于阿尔巴尼亚人和卡斯庇亚人在同一片土地和同一片海洋上生存，我们需要确保我们肥沃的土地得到最充分的利用——饥饿者之间没有和平。"
 01_albania_task_28:0 "草原贸易"
 01_albania_task_28_DESC:0 "北方的马上领主往往是暴力和入侵的先兆，但他们也被证明是最优秀的工匠、最熟练的工人、物物交换者和贸易输送者。偶尔与他们中的一些人找到共同点并不是最糟糕的决定。不知道与这些狡猾的人结盟会给我们带来什么好处。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 01_albania_task_28_tt:0 "与一个主要文化属于#Y 斯基泰#!或#Y 塞种#!文化组的国家保持大于或等于#Y 75#!的关系"
 01_albania_task_29:0 "马提亚努斯之谜"
 01_albania_task_29_DESC:0 "在马提亚努斯湖周围，有传言说这里有奇怪的邪教组织和古老的隐士在低声谈论着古老的习俗。 这个地方在我们的势力范围内，也许是时候去探究是什么力量俘获了这些人的虔诚。"
 01_albania_task_2_DESC:0 "虽然在本质上是有变动的，但所谓的“阿尔巴尼亚”的边界在过去的时代已经延伸得又远又广。为了我们的最大利益，我们应该再次要求占领那些土地和古老的堡垒。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 01_albania_task_3:0 "二十六种语言目录"
 01_albania_task_30:0 "卢佩尼亚人的城市"
 01_albania_task_3_DESC:0 "昔日，希腊旅行者曾评论说，在我们的王国里，人们可以听到二十六种方言；这是阿尔汉后裔繁殖力的证明！\n\n然而，时间的摧残威胁着我们与这些非物质文化遗产的联系——让我们尽我们所能收集这些语言并记录差异，以便子孙后代可以保留与祖先语言的联系。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 01_albania_task_4:0 "大阿尔巴尼亚"
 01_albania_task_4_DESC:0 "#Y 高加索山脉#!周围的土地一直是我们的家园。然而，现在是我们超越不同部落人民的简单存在的时候了。一个伟大的国家必须从这个古老的阿契美尼德王朝总督领的废墟中崛起。我们仍然可以将我们团结在一起，创造一个……更伟大的……阿尔巴尼亚。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_albania_task_5:0 "保证库拉-阿拉斯地区贸易"
 01_albania_task_5_DESC:0 "如果我们想提高我们的经济地位，那么我们必须确保外国商人在我们境内旅行感到安全。可以说，我们生活在一个“艰苦的地区”，因此为那些访问[ROOT.GetCountry.GetCapital.GetName]和其他中心市场的人提供安全是当务之急。我们的大部分贸易都是沿着海岸或通过在我们地区的库拉河和阿拉克斯河航行的船只进行的 - 我们必须控制这些水脉以实现经济的健康发展。\n\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 01_albania_task_5_tt:0 "在[GetProvince('(int32)1584').GetArea.GetRegion.GetName|Y]区域中，至少4个我方拥有且邻近河流的省份拥有[GetBuilding('fortress_building').GetName|Y]（当前：[SCOPE.ScriptValue('01_albania_task_5_forts_current')|0Y]）。"
 01_albania_task_6:0 "阿尔巴尼亚之王"
 01_albania_task_6_DESC:0 "长期以来，阿尔巴尼亚人受到各个部落之间琐碎争端和混乱的阻碍，他们必须团结起来，在统一的旗帜和唯一的王领导下重振其扩张运动。让[ROOT.GetCountry.GetCapital.GetName]成为像[ROOT.GetCountry.GetRuler.GetName]这样的雄心勃勃的领主的统治中心.  \n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 01_albania_task_7:0 "阿尔巴尼亚的领袖"
 01_albania_task_7_DESC:0 "阿尔巴尼亚人长期以来都是一群争吵不休的领主和酋邦，他们因不团结而发展不顺。然而，[ROOT.GetCountry.GetName] 的部落习性根深蒂固，无法统一在一面旗帜下。相反，它需要由少数最有权势的家族组成的委员会给予的监督和法治。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_albania_task_7_tt:0 "\n任务#Y $01_albania_task_6$#!与#Y $01_albania_task_7$#!是#R 互斥的#!"
 01_albania_task_8:0 "库拉-阿拉斯的霸主"
 01_albania_task_8_DESC:0 "虽然我们的金库已经从库拉河与阿拉克斯河的支流中流入的黄金中受益，但这仍然感觉只是涓涓细流。很明显，在我们这个地区还有更多的经济控制权可以掌握。我们的竞争对手，#Y 亚美尼亚人#! 和 #Y 伊比利亚人#!，袭击我们的船只，并在我们流动的边界上挑起小规模冲突。这些麻烦削弱了我们在北方大山之间的影响力和地位。是时候我们要赢得本该属于我们的地位了。我们的竞争对手……不应该再存在下去。\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 01_albania_task_9:0 "阿尔巴尼亚人的遗产"
 01_albania_task_9_DESC:0 "在历史书中被遗忘，于更伟大帝国的记忆中遗失，阿尔巴尼亚人将扭转边缘势力的趋势，创造一个让后世世代缅怀的形象。作为北方的霸主，阿尔巴尼亚的力量将影响巨人间的斗争，甚至有可能自身也成为其中一员。"
 01_albania_task_9_tt:0 "在[GetProvince('(int32)1584').GetArea.GetRegion.GetName|Y]区域至少拥有4个具有[GetProvinceRank('city_metropolis').GetName|E]级别的省份（当前：[SCOPE.ScriptValue('svalue_01_albania_task_9_metropolis_current')|0Y]）。"
 ALBANIAN_EMPIRE:0 "阿尔巴尼亚帝国"
 GREATER_ALBANIA:0 "大阿尔巴尼亚"
 GREATEST_ALBANIA:0 "最伟大的阿尔巴尼亚"
 GREATEST_ALBANIA_FLAG:0 "阿尔巴尼亚帝国的辉煌旗帜"
 MANNAEAN_KINGDOM:0 "曼奈王国"
 accepting_caspians:0 "接受卡斯庇亚人"
 albania_convert_hurrian:0 "皈依胡里安信仰"

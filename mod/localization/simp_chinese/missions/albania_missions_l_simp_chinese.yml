 me_albania_1.a:0 "愿阿尔汗的子孙遍布大地。"
 me_albania_10.a:0 "完全的民主对我们人民来说将是灾难性的。"
 me_albania_10.b:0 "民主实际上听起来是一个公平的制度。"
 me_albania_10_desc:0 "在过去几个月里，每个主要部落中的贵族和政治野心家一直在为土地权利和税收问题争执不休，而山地、田野和山路间的农民和猎人则表现出明显的不满——他们没有从部落联盟中获得多少好处。使者们开始沿路传播消息，宣布一个由[albanian_rebel_democrat.GetName]领导的平民英雄反叛派别的兴起。该派别声称他们的目标是彻底推翻贵族，让所有阿尔巴尼亚人民都能公平参与治理。他们的所谓‘立法者’已经在西部的萨穆赫设立了营地。\n\n更糟糕的是，他们的运动在阿尔巴尼亚的下层阶级中非常受欢迎，获得了大量民兵的支持，并且已经聚集了一支由[albanian_democratic_commander.GetName]指挥的军队。这支军队很快就会到达这里来‘解放人民’！必须尽快消灭这一威胁，以防其他地区或次要部落产生任何想法。"
 me_albania_10_title:0 "为民主而战"
 me_albania_10a_tooltip:0 "#E [albanian_rebel_democrat.GetName]#! 在#Y 阿尔巴尼亚民主#!的旗帜下点燃了一场内战"
 me_albania_10b_tooltip:0 "你将切换到扮演#Y 阿尔巴尼亚民主国#!"
 me_albania_11.a:0 "阿尔巴尼亚人将度过这场风暴！"
 me_albania_11.b:0 "乌迪安人有统治的权利！"
 me_albania_11.c:0 "卢佩尼部落是最强大的部落！"
 me_albania_11.d:0 "北部的莱吉安人在这场混乱中有最大的胜算。"
 me_albania_11_a_tooltip:0 "你将继续以#Y 阿尔巴尼亚#!的身份参与这场战争"
 me_albania_11_b_tooltip:0 "你将切换到扮演 #Y 乌迪安王国#!"
 me_albania_11_c_tooltip:0 "你将切换到扮演 #Y 卢佩尼安王国#!"
 me_albania_11_d_tooltip:0 "你将切换到扮演#Y 莱吉安王国#!"
 me_albania_11_desc:0 "难以想象的事情发生了。最远端的#E 阿尔巴尼亚#!领主和酋长们已经占据了他们的土地，并自立为独立民族，脱离了我们的控制。现在已无法回避——我们失去了对领土的控制，必须应对众多的僭主。\n\n[ROOT.GetCountry.GetRuler.GetName]将如何保护[ROOT.GetCountry.GetCapital.GetName]首都免受如此多敌人的侵害？这取决于阿尔巴尼亚人民挺身而出，作为高加索东南部最强部落来保卫他们的家园。准备军队！"
 me_albania_11_title:0 "阿尔巴尼亚人的战争"
 me_albania_11_tooltip:0 "一场混乱的四国之战在#Y 阿尔巴尼亚#!、#Y 乌迪安#!、#Y 卢佩尼安#!和#Y 莱吉安#!之间爆发！！"
 me_albania_12.a:0 "我们将领导乌迪安军队！"
 me_albania_12_desc:0 "随着我们南部首都的加强和人民准备好挑战阿尔巴尼亚中央权力，我们进入了全面战争状态。"
 me_albania_12_title:0 "乌迪安王国的崛起"
 me_albania_12_tooltip:0 "你现在正在扮演#Y 乌迪安王国#!"
 me_albania_13.a:0 "我们将领导民主军队！"
 me_albania_13_desc:0 "解放阿尔巴尼亚人并将真正的民主带到阿尔巴尼亚的机会已经到来。让我们前进，纠正我们的自然权利。"
 me_albania_13_title:0 "阿尔巴尼亚民主国的崛起"
 me_albania_13_tooltip:0 "你现在正在扮演#Y 阿尔巴尼亚民主国#!"
 me_albania_14.a:0 "冲锋！"
 me_albania_14_desc:0 "我们站在战场上，家园受到威胁，我们在世界上的地位被质疑。接下来的几个月...也许几年...将决定我们如何被铭记。向前，迈向胜利！"
 me_albania_14_title:0 "一个阿尔巴尼亚人的战争"
 me_albania_14_tooltip:0 "你的士兵因他们正在为自己的家园而战获得了士气和纪律提升。"
 me_albania_15.a:0 "为了乌迪安事业！"
 me_albania_15_desc:0 "在这场爆发的大战中，我们选择了将命运托付给乌迪安领袖[albanian_rebel_commander.GetName]和他的信任指挥官[albanian_rebel_commander.GetName]，带领我们成为成功的阿尔巴尼亚继任派系。"
 me_albania_15_title:0 "乌迪安派系"
 me_albania_15_tooltip:0 "你现在正在扮演#Y 乌迪安王国#!"
 me_albania_16.a:0 "为了卢佩尼安事业！"
 me_albania_16_desc:0 "在这场酋长们的考验中，卢佩尼安领袖[lupenian_rebel_king.GetName]利用其作为最传统和最有权势的卢佩尼安家族首领的继承权，宣称自己是阿尔巴尼亚的最高统治者。他和他的信任指挥官[lupenian_rebel_commander.GetName]组建了一支庞大的军队来捍卫这一主张。任何敌人面对这样一支如潮水般的大军都会感到恐惧。"
 me_albania_16_title:0 "卢佩尼安派系"
 me_albania_16_tooltip:0 "你现在正在扮演#Y 卢佩尼安王国#!"
 me_albania_17.a:0 "为了莱吉安事业！"
 me_albania_17.b:0 "让我们诱使北部的莱吉安人加入我们的战役。"
 me_albania_17_desc:0 "作为最遥远的阿尔巴尼亚或与阿尔巴尼亚相邻的民族，莱吉安人或勒兹吉语使用者被认为比高加索南部山坡上的人低一等。在他们的弱点和分裂中，我们将崛起建立一个新的王国。我们将在[legian_rebel_king.GetName]的旗帜下前进，由久经沙场的[legian_rebel_commander.GetName]领导。"
 me_albania_17_title:0 "莱吉安派系"
 me_albania_17_tooltip:0 "你现在正在扮演#Y 莱吉安王国#!"
 me_albania_18.a:0 "阿尔巴尼亚至高无上！"
 me_albania_18_desc:0 "我们现在完全掌控了我们水域的长臂。外国人将很难干扰我们的经济和外交事务。"
 me_albania_18_title:0 "库拉-阿拉克斯的主宰"
 me_albania_18_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_8$#!”$mission_completed_tooltip_2$"
 me_albania_19.a:0 "阿尔巴尼亚人将永远被铭记！"
 me_albania_19_desc:0 "我们创造了阿尔巴尼亚永远的记忆和文化的繁荣。编年史将充满对我们的赞歌。"
 me_albania_19_title:0 "$01_albania_task_9$#!"
 me_albania_19_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_9$#!”$mission_completed_tooltip_2$"
 me_albania_1_desc:0 "阿尔巴尼亚部落铭记了他们作为阿尔汗后裔的遗产与血统。如今，他们崇拜这位传奇英雄，找到了作为更团结民族的共同目标。[ROOT.GetCountry.GetRuler.GetName]站在部民面前，成为阿尔汗的声音，人们将[ROOT.GetCountry.GetRuler.GetSheHe]的话语视为神的旨意。"
 me_albania_1_title:0 "阿尔汗之光"
 me_albania_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_1$#!”$mission_completed_tooltip_2$"
 me_albania_2.a:0 "为了阿尔巴尼亚人民的荣耀！"
 me_albania_20.a:0 "莱吉安人将为我们开辟通往海洋的道路。"
 me_albania_20_desc:0 "北部的勒兹吉语使用者已和平归顺于我们的统治。贸易流量增加，我们对高加索以北地区的接触范围也扩大了。"
 me_albania_20_title:0 "莱吉安领土"
 me_albania_20_tooltip:0 "我们将对#E 马赞德兰海#!周边沿海领土获得#Y 宣称#!！"
 me_albania_21.a:0 "向奥克西安纳进军！"
 me_albania_21_desc:0 "在环绕#E 马赞德兰海#! 后，我们距离花剌子模的边境仅一步之遥。尚不清楚那里的国王和贵族是否意识到我们的存在——只能希望他们仍然无知。他们曾与亚历山大大帝一起威胁过我们，因此我们必须谨慎处理他们构成的威胁。我们的军队将进攻他们每一个设防的堡垒，就此巩固我们最东部的边界。"
 me_albania_21_title:0 "海那边的敌人"
 me_albania_21_tooltip:0 "我们将获得#Y 宣称#! 针对#Y 花剌子模#! 的所有主要土地！"
 me_albania_22.a:0 "洗劫绿洲！"
 me_albania_22.b:0 "留下阿尔巴尼亚的足迹。"
 me_albania_22.c:0 "花剌子模和解"
 me_albania_22.d:0 "阿尔巴尼亚行省"
 me_albania_22_a_tooltip:0 "数个#E 城市#!和#E 大都会#!将被#R 降级#!为更低的领土状态，许多#Y 人口#!将被#R 杀死#!！"
 me_albania_22_b_tooltip:0 "许多#Y 阿尔巴尼亚人#! 将扎根于花剌子模的城市中。"
 me_albania_22_c_tooltip:0 "你将获得#Y 巴克特里亚军事传统#! 和#Y 斯基泰军事传统#! "
 me_albania_22_d_tooltip:0 "#Y 花剌子模#!将作为#G 总督领#!被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_22_desc:0 "在征服了奥克西安纳河口及其所有的肥沃平原之后，阿尔巴尼亚领导层必须决定如何处理花剌子模的残余势力。我们应该宽大为怀……还是让历史遗忘这些人？"
 me_albania_22_title:0 "花剌子模的命运"
 me_albania_23.a:0 "让这座城市在自己的时代中繁荣起来吧。"
 me_albania_23.b:0 "一座新庙宇将在新的管理下进一步将其与我们的首都联系起来。"
 me_albania_23.c:0 "阿契美尼德的神明将在这里再次受到崇拜。"
 me_albania_23_desc:0 "随着加德曼重新成为一座重要城市，唤起了阿契美尼德时代的记忆，人们从四面八方涌向这里。许多人询问当地当局，这座新城市是否会因某个祭司团、新庙宇或某种其他形式的阿尔巴尼亚文化庆典而受到恩典。我们该如何对待加德曼？"
 me_albania_23_title:0 "加德曼的信仰"
 me_albania_23_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_13$#!”$mission_completed_tooltip_2$"
 me_albania_24.a:0 "人民和行政人员会逐渐接受这个想法。"
 me_albania_24.b:0 "[ROOT.GetCountry.GetCapital.GetName]可以按照波斯风格进行改造。"
 me_albania_24.c:0 "加德曼将是这样统治的更好地点。"
 me_albania_24_desc:0 "虽然我们的治理模式已经调整为更接近阿契美尼德的方式，但我们的首都仍然呈现出典型的‘阿尔巴尼亚’风貌。这种突兀的现实表明，我们需要采取更多措施来最好地模仿阿契美尼德曾经拥有的权威。建筑必须重新设计！寺庙必须重新装饰！统治者肯定需要一件新披风！或者我们可以把一切都搬到加德曼，简单地修复阿契美尼德遗迹……"
 me_albania_24_title:0 "一个阿契美尼德风格的首都"
 me_albania_24_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_14$#!”$mission_completed_tooltip_2$"
 me_albania_25.a:0 "崇拜琐罗亚斯德。"
 me_albania_25.b:0 "崇拜密特拉。"
 me_albania_25.c:0 "崇拜阿尔马济……这是不应该发生的？！"
 me_albania_25_desc:0 "制定新的标准和传统是困难的，但阿尔巴尼亚人广泛接受了伊朗高原上崇拜的神明。阿契美尼德及其祖先在这些存在的指引下繁荣昌盛。同样，我们也将繁荣。"
 me_albania_25_title:0 "高原上的低语"
 me_albania_25_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_15$#!”$mission_completed_tooltip_2$"
 me_albania_26.a:0 "让我们的敌人因恐惧而颤抖。"
 me_albania_26_desc:0 "从扎格罗斯山脉本身，一位名叫[albanian_persian_commander_scope.GetName]的人前来指挥我们的新军队，并教导我们的士兵伊朗战争方式。我们的士兵最好仔细倾听。"
 me_albania_26_title:0 "一支阿尔巴尼亚-伊朗军队"
 me_albania_26_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_16$#!”$mission_completed_tooltip_2$"
 me_albania_27.a:0 "这片土地随着时间的推移会感觉像家一样。"
 me_albania_27.b:0 "派遣阿尔巴尼亚人民前往。"
 me_albania_27_b_tooltip:0 "每个拥有#E 城市#! 或#E 大都市#! 的#Y 阿特罗帕特尼米底#!、#Y 帕坦凯尔特#!、#Y 帕尔斯卡哈伊克#!、#Y 卡杜西奥伊#!、#Y 阿马迪奥伊#!、#Y 米底#!、#Y 克罗米瑟尼米底#!、#Y 科西奥伊#! 和#Y 大米底#! 省份中将出现一个#E 阿尔巴尼亚#! #Y 自由民#!。"
 me_albania_27_desc:0 "随着北部高地被阿尔巴尼亚控制，唯一剩下的问题就是人民——我们的侦察兵几乎没有在他们中间找到一个阿尔巴尼亚人或同情者。这将是一个难以平定并同化到我们方式的地区，无论是否有阿契美尼德的主张。"
 me_albania_27_title:0 "阿尔巴尼亚化的伊朗高原"
 me_albania_27_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_18$#!”$mission_completed_tooltip_2$"
 me_albania_28.a:0 "我们的行政范围将进一步扩大。"
 me_albania_28_desc:0 "在恢复了我们家园中的阿契美尼德宫殿昔日的辉煌后，我们学到了许多阿契美尼德的统治方式和治理方法，并且我们的通信效率将通过这些中心枢纽得到提升。不久之后，阿尔巴尼亚将成为已知世界中最文明的地方之一。"
 me_albania_28_title:0 "阿尔巴尼亚的宫殿"
 me_albania_28_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_17$#!”$mission_completed_tooltip_2$"
 me_albania_29.a:0 "亚美尼亚将成为半自治的附庸国。"
 me_albania_29.b:0 "科尔基斯将成为半自治的附庸国。"
 me_albania_29.c:0 "米底将成为半自治的附庸国。"
 me_albania_29.d:0 "我们的土地将由许多忠于我们慷慨统治的附庸国管理。"
 me_albania_29_a_tooltip:0 "#Y 亚美尼亚#! 将作为#G 行省#! 被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_29_b_tooltip:0 "#Y 科尔基斯#! 将作为#G 行省#! 被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_29_c_tooltip:0 "#Y 米底#! 将作为#G 行省#! 被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_29_d_tooltip:0 "#Y 阿尔巴尼亚#! 将释放#G 行省#! #Y 亚美尼亚#!、#Y 科尔基斯#! 和#Y 米底#!"
 me_albania_29_desc:0 "管理我们不断扩张的王国一直是一项艰巨的任务。我们的顾问建议效仿阿契美尼德的做法，将我们的领土划分为行省，由忠诚的人民成员统治。现在，只需决定哪些土地将脱离我们的直接统治……"
 me_albania_29_title:0 "阿尔巴尼亚的行省"
 me_albania_2_desc:0 "故土已归还阿尔巴尼亚人。我们必须清除家园中的外国人，并增强扩展我们人民影响力的热忱。这将是一场牧民与部民间的战斗，迫使敌人离开牧场与森林。"
 me_albania_2_title:0 "唯有阿尔巴尼亚的土地"
 me_albania_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_2$#!”$mission_completed_tooltip_2$"
 me_albania_3.a:0 "愿二十六种及更多语言被世代尊崇！"
 me_albania_3.b:0 "卢佩尼人的语言似乎相当流行……"
 me_albania_30.a:0 "向阿尔巴尼亚帝国致敬！"
 me_albania_30.b:0 "皇帝将占据帕萨的宝座。"
 me_albania_30_a_tooltip:0 "#Y 阿尔巴尼亚#! 将形成#Y 阿尔巴尼亚帝国#!，我们的#E 当前继承人#! 将接管为#Y 阿尔巴尼亚行省#! 的统治者。"
 me_albania_30_desc:0 "作为阿契美尼德遗产的合法继承者，阿尔巴尼亚人征服了前帝国的大部分地区，并在整个伊朗高原建立了强大的存在。随着剩余领土等待征服，阿尔巴尼亚的可能性依然无限。问题是……接下来什么将成为阿尔巴尼亚的一部分？"
 me_albania_30_title:0 "阿尔巴尼亚万王之王"
 me_albania_30_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_20$#!”$mission_completed_tooltip_2$"
 me_albania_31.a:0 "看着金库填满。"
 me_albania_31_desc:0 "随着新的贸易路线建立，越来越多来自四面八方的商队进入首都，带来了远方国度的商品。我们必须继续这一势头！"
 me_albania_31_title:0 "阿尔巴尼亚贸易"
 me_albania_31_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_21$#!”$mission_completed_tooltip_2$"
 me_albania_32.a:0 "让船只传播我们的影响力。"
 me_albania_32_desc:0 "我们规模适中的港口成为贸易的繁忙枢纽，开启了阿尔巴尼亚家园的新多元文化时代。外国的思想将推动我们在区域野心上的进步。"
 me_albania_32_title:0 "阿尔巴尼亚海上贸易"
 me_albania_32_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_22$#!”$mission_completed_tooltip_2$"
 me_albania_33.a:0 "一座辉煌的首都。"
 me_albania_33_desc:0 "增加城市的沟渠阵列并建造椭圆形公共行政中心，使卡巴拉/加巴拉能够扩展其官僚能力，更好地服务阿尔巴尼亚人民。在此管理下，它将继续繁荣和发展。"
 me_albania_33_title:0 "卡巴拉"
 me_albania_33_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_23$#!”$mission_completed_tooltip_2$"
 me_albania_34.a:0 "让马匹自由。"
 me_albania_34.b:0 "那里的经济至关重要。"
 me_albania_34.c:0 "我们的军队将变得更加强大。"
 me_albania_34_desc:0 "位于库拉河和阿拉克斯河交汇处的沙赫尔加的土地长期以来被视为饲养和驯化马匹的最佳土地之一。这里的农民希望使用这些动物在田间劳作以及拉动贸易用的车辆。然而，我们的军事顾问提出了另一种选择。他们中许多人认为这是新骑兵招募和技术训练的最佳场地。"
 me_albania_34_title:0 "阿尔巴尼亚骑兵"
 me_albania_34_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_24$#!”$mission_completed_tooltip_2$"
 me_albania_35.a:0 "无人能通过！"
 me_albania_35_desc:0 "我们对北方入侵的恐惧终于可以得到缓解。里海走廊的加固且人员充足的城墙将保护我们的人民。"
 me_albania_35_title:0 "里海之门"
 me_albania_35_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_26$#!”$mission_completed_tooltip_2$"
 me_albania_36.a:0 "让卡斯庇亚人按传统行事。"
 me_albania_36.b:0 "学习卡斯庇亚骑手的技术。"
 me_albania_36.c:0 "允许卡斯庇亚人自治。"
 me_albania_36_c_tooltip:0 "#Y 卡斯庇亚王国#! 将作为#G 贡赋国#! 被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_36_desc:0 "一个野性的民族，卡斯庇亚人似乎已经在库拉河和阿拉克斯平原上生活了与阿尔巴尼亚人一样长的时间……甚至可能更早。几代以来，他们的数量和牧场已经减少，但他们仍然是骄傲而有能力的一群人。我们已宽宏大量地接纳他们为我们的一员，但我们是否应该进一步探索他们的能力？"
 me_albania_36_title:0 "接受卡斯庇亚人"
 me_albania_36_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_25$#!”$mission_completed_tooltip_2$"
 me_albania_37.a:0 "让他们忙于劳动。"
 me_albania_37.b:0 "让他们劳累至死。"
 me_albania_37.c:0 "挑战他们的决心。"
 me_albania_37.d:0 "卡斯庇亚人可能是最强的。"
 me_albania_37_a_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_25$#!”$mission_completed_tooltip_2$"
 me_albania_37_b_tooltip:0 "许多#T 卡斯庇亚人#! 将#R 死亡#!，这是我们愿意做出的牺牲。"
 me_albania_37_c_tooltip:0 "#E [caspian_rebel_king.GetName]#! 在#Y 卡斯庇亚王国#! 的旗帜下点燃了一场内战"
 me_albania_37_d_tooltip:0 "#Y 卡斯庇亚王国#! 将作为#G 贡赋国#! 被释放，隶属于#Y 阿尔巴尼亚#!!"
 me_albania_37_desc:0 "卡斯庇亚部落对我们对他们土地的过度控制和治理方法并不满意。他们渴望自由，向往草原和大草原。可能是时候遏制他们的脾气了。否则，他们很可能起来反抗我们……"
 me_albania_37_title:0 "叛乱的卡斯庇亚人"
 me_albania_38.a:0 "我们将派遣一些工人。"
 me_albania_38.b:0 "让蜂蜜流淌！"
 me_albania_38_desc:0 "加巴拉的人们一直觊觎邻近土地丰富的蜂蜜……那甜美、甜美的金色生命之血。通过投资这个地方及其蜂蜜农场来满足人们的渴望可能是有价值的。"
 me_albania_38_title:0 "让努迪蜂蜜流淌"
 me_albania_38_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_27$#!”$mission_completed_tooltip_2$"
 me_albania_39.a:0 "他们可以自由浏览我们的市场。"
 me_albania_39.b:0 "付钱给他们以获取战争之道的信息。"
 me_albania_39.c:0 "让我们将他们融入我们的经济社会。"
 me_albania_39.d:0 "在加巴拉开设金匠工坊。"
 me_albania_39_desc:0 "来自北方的新萨尔马提亚猎人和流浪者穿过山脉或沿着达尔班德通道来到高加索的我们这一侧及我们的城市。现在他们来了，带来了野性十足的黄金工艺品和战争武器，我们对他们意图的好奇心以及接待他们的益处变得越来越大。"
 me_albania_39_title:0 "草原关系"
 me_albania_39_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_28$#!”$mission_completed_tooltip_2$"
 me_albania_3_desc:0 "高加索地区阿尔巴尼亚人中最睿智者开始在周边村庄间游历，记录并编目所有自认为是同胞的人使用的方言与语言。这一项目揭示了关于我们历史与多样性的丰富知识。"
 me_albania_3_title:0 "研究阿尔巴尼亚语言"
 me_albania_3_tooltip_a:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_3$#!”$mission_completed_tooltip_2$"
 me_albania_3_tooltip_b:0 "在 #Y 卢佩尼人的土地#! 上或许还有更多我们可以做的事情。"
 me_albania_4.a:0 "为了大阿尔巴尼亚！"
 me_albania_4.b:0 "阿尔巴尼亚从未如此‘伟大’过……"
 me_albania_40.a:0 "仅是个有趣的奇观，别无其他。"
 me_albania_40.b:0 "特舒布的队伍将为我们带来胜利。"
 me_albania_40.c:0 "古老的曼奈王国的力量将成为我们的。"
 me_albania_40.d:0 "马蒂埃尼人今后将支持我们的努力。"
 me_albania_40_a_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_29$#!”$mission_completed_tooltip_2$"
 me_albania_40_b_tooltip:0 "#E 阿尔巴尼亚人#! 将采纳对 #Y 特舒布#! 及其 #Y 胡里安万神殿#! 的崇拜。"
 me_albania_40_c_tooltip:0 "#E 阿尔巴尼亚人#! 将恢复古老的 #Y 曼奈王国#!!"
 me_albania_40_d_tooltip:0 "#Y 马蒂埃尼#! 人民将恢复他们的王国作为 #E 阿尔巴尼亚#! 的 #G 行省#!。"
 me_albania_40_desc:0 "我们的先知和智者将[ROOT.GetCountry.GetRuler.GetName]带到了一座位于险峻山丘上的古老、摇摇欲坠的城堡。在这里，一个拥有可追溯到古代的石板的巨大图书馆令所有在场的人惊叹不已。其中一位最年长的智者，几乎是一个历史传奇人物，开始粗略地翻译一块石板，揭示了‘曼奈’的名字及其已逝去很久的领袖记录。这些石板讲述了与米底人、波斯人、古老的亚述人以及伟大的斯基泰部落进行的伟大战斗和战争。\n\n[ROOT.GetCountry.GetRuler.GetName]对这些故事感到敬畏，同时也提到了旧神特舒布及其女巫通过祭坛崇拜赋予酋长和勇士的力量。老智者低声许诺权力，并指向石像和旧火盆。[ROOT.GetCountry.GetRuler.GetName]现在必须考虑阿尔巴尼亚人民是否能接受外国神祇以获得仁慈的预兆。"
 me_albania_40_title:0 "一个胡里安的历史"
 me_albania_41.a:0 "给卢佩尼人一些尊重。"
 me_albania_41.b:0 "让这些暴发户证明他们的弱点。"
 me_albania_41.c:0 "卢佩尼人确实是其中最强的部落。"
 me_albania_41_a_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_30$#!”$mission_completed_tooltip_2$"
 me_albania_41_b_tooltip:0 "#E 卢佩尼人#! 在 #Y 大卢佩尼亚#! 的旗帜下点燃了一场内战。"
 me_albania_41_c_tooltip:0 "你将转为扮演 #Y 大卢佩尼亚#!"
 me_albania_41_desc:0 "由于最近对其语言的研究以及他们在新阿尔巴尼亚国家中日益增长的政治阶层，卢佩尼部落的酋长们开始呼吁卢佩尼人与阿尔巴尼亚人之间的平等——他们声称他们的城市应该与加巴拉一样成为首都。我们的顾问认为拒绝可能导致内战……"
 me_albania_41_title:0 "卢佩尼族的力量"
 me_albania_4_desc:0 "大阿尔巴尼亚已登上世界舞台，成为南高加索地区的重要竞争者——真正可与亚美尼亚、伊比利亚和米底阿特罗帕特涅相匹敌的对手。作为一个民族，阿尔巴尼亚人现在可以进军争夺更大区域的主导权。"
 me_albania_4_title:0 "统一的阿尔巴尼亚"
 me_albania_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_4$#!”$mission_completed_tooltip_2$"
 me_albania_5.a:0 "为了稳定的河流贸易。"
 me_albania_5_desc:0 "我们在库拉河与阿拉斯河沿线的存在已确立，确保阿尔巴尼亚商品将通过天然出口通道流通，外国商品也能及时到达我们的市场。"
 me_albania_5_title:0 "$01_albania_task_5$"
 me_albania_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_5$#!”$mission_completed_tooltip_2$"
 me_albania_6.a:0 "为了王座！"
 me_albania_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]如今坐上了[ROOT.GetCountry.GetCapital.GetName]的雕花王座，牢牢掌控着阿尔巴尼亚的土地。他将以一个声音指挥阿尔汗后裔的军队，对抗高加索及更远地区的所有敌人。"
 me_albania_6_title:0 "阿尔巴尼亚之王"
 me_albania_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_6$#!”$mission_completed_tooltip_2$"
 me_albania_7.a:0 "让我们希望他们是一群有能力的人。"
 me_albania_7_desc:0 "随着[ROOT.GetCountry.GetName]的未来掌握在山脉以南最聪明和最有权力的人手中，阿尔巴尼亚人民的未来一片光明。"
 me_albania_7_title:0 "阿尔巴尼亚共和国"
 me_albania_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_albania_task_7$#!”$mission_completed_tooltip_2$"
 me_albania_8.a:0 "我们将认真对待他们的关切。"
 me_albania_8.b:0 "前酋长们的争吵不值得考虑。"
 me_albania_8_desc:0 "尽管在统一阿尔巴尼亚部落方面取得了一些成功，但来自不同地区的几位领主因失去权威权力而感到沮丧，他们不喜欢跨部落妥协的现实。他们的不安已经在立法者议会中引起了一些不和。"
 me_albania_8_title:0 "不满的共和制阿尔巴尼亚人"
 me_albania_8b_tooltip:0 "忽视不同的部落可能导致#R 冲突#!"
 me_albania_9.a:0 "我们将击败这个僭称者。"
 me_albania_9.b:0 "新血液可能对国家更有利。"
 me_albania_9_desc:0 "在主要部落集团之间紧张局势持续数周后，使者们开始沿着道路和小径传播消息，在南部乌迪索里镇，由[albanian_rebel_king.GetName]领导的乌迪安反叛派别正在崛起。\n\n更糟糕的是，最新报告显示，这位自封为阿尔巴尼亚乌迪安人的国王已经聚集了一支由[albanian_rebel_commander.GetName]指挥的军队。这支军队很快就会到达这里！必须尽快消灭这一威胁，以防其他持不同意见的部落产生任何想法。"
 me_albania_9_title:0 "反叛之王"
 me_albania_9a_tooltip:0 "#E [albanian_rebel_king.GetName]#! 在#Y 乌迪安王国#! 的旗帜下点燃了一场内战。"
 me_albania_9b_tooltip:0 "你将切换到扮演 #Y 乌迪安王国#!"

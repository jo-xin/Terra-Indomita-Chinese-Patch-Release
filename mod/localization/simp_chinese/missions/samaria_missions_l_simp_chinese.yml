l_simp_chinese:
 NICKNAME_SMJ:0 "“复兴者”"
 SMJ:0 "撒玛利亚帝国"
 SMJ_ADJECTIVE:0 "撒玛利亚人"
 SMJ_NAME:0 "以色列帝国"
 accepted_judean_refugees:0 "接受的犹太难民"
 samaria_inv.1.a:0 "托勒密是合法继承人。"
 samaria_inv.1.a.tt:0 "我们将提议帮助他们的#R 战争#! 。"
 samaria_inv.1.b:0 "安提柯的宣称是最有力的。"
 samaria_inv.1.b.tt:0 "我们将提议帮助他们的#R 战争#! 。"
 samaria_inv.1.c:0 "亚历山大的王位不是我们可以争夺的。"
 samaria_inv.1.c.tt:0 "我们不会加入这场战争"
 samaria_inv.1.desc:0 "亚历山大大帝的继承人再一次为了他曾经的伟大帝国的遗迹而互相开战。这一次，我们有机会与我们的邻居达成协议，向恢复大卫王国迈进一步。我们可以支持托勒密的宣称，也可以支持安提柯的宣称。\n\n但是，我们不会白做。我们将要求以色列人的土地归还给其合法的主人。"
 samaria_inv.1.t:0 "亚历山大的破碎帝国"
 samaria_inv.10.a:0 "我们将从[GetProvince('(int32)679').GetName]统治，就像过去的北方国王那样。"
 samaria_inv.10.b:0 "我们将从[GetProvince('(int32)680').GetName]统治，在圣山Gerizim的阴影下。"
 samaria_inv.10.desc:0 "我们已经重建了[GetProvince('(int32)679').GetName]，这个被亚述人洗劫的北方王城。我们现在可以选择是享受从旧王城统治的威望，还是与他们的邪恶保持距离，把我们的首都留在圣山的阴影下。"
 samaria_inv.10.t:0 "一个皇家城市"
 samaria_inv.100.a:0 "赞美主！"
 samaria_inv.100.desc:0 "在经历了几个世纪的汗水、泪水和血水的天灾时代后，判官们的正义统治得到了恢复，随之而来的是天灾时代。因为土地的边界被恢复到很久以前的样子，我们的统治者#Y [SCOPE.sCharacter('taheb_ruler_scope').GetName]#!已经确保了我们未来几个世纪的地位，我们的独立得到保证。亚述人和埃及人--我们已经把他们都打败了。曾经，他们每个人都以自己的方式压制了我们的祖先。从埃及，摩西带领我们，从亚述，阿巴代尔带领我们回来。不久前从希腊人的统治中解放出来，#Y [SCOPE.sCharacter('taheb_ruler_scope').GetName]#!是Taheb，是恢复者，是新的法官，由主任命。"
 samaria_inv.100.t:0 "神的恩宠恢复的时代"
 samaria_inv.1010.a:0 "它将成为所有以色列儿童的精神中心。"
 samaria_inv.1010.desc:0 "我们已经从很远很远的地方派来了工人，帮助建造基利心山圣所。作为上帝授权的唯一敬拜地点，我们希望这将吸引以色列子民从地球的两端来。\n\n我们预计在发展过程中会出现一些复杂的情况，但希望我们能很快看到圣所的建成。"
 samaria_inv.1010.t:0 "基利心山圣所"
 samaria_inv.1011.a:0 "然而，我们曾希望得到更多的东西......"
 samaria_inv.1011.a.tt:0 "耶路撒冷圣殿被毁的临时修正已被移除。"
 samaria_inv.1011.desc:0 "基利心山圣所终于建成了，它作为我们的统治、权力和上帝的荣耀的见证。从一代到另一代，这将是向耶和华献祭的唯一祭坛。\n\n虽然圣所从未完全达到我们最初为它设定的期望和计划，但它仍然是一个令人印象深刻的建筑。再也不会有人怀疑我们国家和上帝的重要性了，因为我们已经建造了一座无与伦比的圣殿。"
 samaria_inv.1011.t:0 "基利心山圣所"
 samaria_inv.1012.a:0 "对我们工匠的证明。"
 samaria_inv.1012.a.tt:0 "耶路撒冷圣殿被毁后遗留的临时修饰物被移除。"
 samaria_inv.1012.desc:0 "基利心山圣所终于完工了，它作为我们的统治、权力和上帝的荣耀的见证而存在。\n\n尽管许多人批评我们的宏伟和不可能的计划，但圣所还是以某种方式达到了我们的期望。再也不会有人怀疑我们国家和上帝的重要性了，因为我们已经建造了一座无与伦比的圣殿。"
 samaria_inv.1012.t:0 "基利心山圣所"
 samaria_inv.1013.a:0 "这是应该的。"
 samaria_inv.1013.a.tt:0 "耶路撒冷圣殿被毁的临时修正已被移除。"
 samaria_inv.1013.desc:0 "基利心山圣所终于完工了，它作为我们的统治、权力和上帝的荣耀的见证而存在。从一代到另一代，这将是向耶和华献祭的唯一祭坛。\n\n这个巨大的纪念碑远远超出了我们的预期，超出了所有的希望，它的美丽真正反映了上帝的荣耀。以前从来没有人用凡人的手建造过这样的圣殿，有人说我们在这次努力中一定得到了神的指引。\n\n基利心山圣所将永远矗立在我们对主的奉献的记忆中。"
 samaria_inv.1013.t:0 "基利心山圣所"
 samaria_inv.102.a:0 "我们会帮助所有的谢赫姆人。"
 samaria_inv.102.a.tt:0 "基利心山圣所的进展继续按计划进行。"
 samaria_inv.102.b:0 "让我们优先考虑工人的问题，目前来说。"
 samaria_inv.102.c:0 "我们也帮不起了。"
 samaria_inv.102.c.tt:0 "基里齐姆山圣地的进展因饥饿而受阻。"
 samaria_inv.102.desc:0 "一场突如其来的干旱袭击了Shekhem，随之而来的是我们在Gerizim山圣所上的工作。除非我们投入大量资金从其他地方调运粮食和帮助，否则建筑进度肯定会受到阻碍。[SCOPE.sCharacter('random_advisor').GetName]指出，我们可以把重点放在那些在圣所工作的人身上，以节省一些资源。"
 samaria_inv.102.t:0 "旱灾并发症"
 samaria_inv.103.a:0 "我们将购买一些替换品。"
 samaria_inv.103.b:0 "在我们其他的一些领土上有我们可以使用的材料。"
 samaria_inv.103.c:0 "我们将只是稍微缩减圣所的装饰。"
 samaria_inv.103.c.tt:0 "基利心山圣所的进展受到低质量材料的阻碍。"
 samaria_inv.103.desc:0 "由于一些圣所在施工过程中掉落，发生了巨大的碰撞，接着是我们工人的惊慌。似乎收到的一些材料几乎无法使用，充其量是不安全的。\n\n我们的工头要求提供必要的资金来购买替代品，而[SCOPE.sCharacter('random_advisor').GetName]指出我们在附近其他城市有材料可以使用。"
 samaria_inv.103.t:0 "材料的并发症"
 samaria_inv.104.a:0 "会找到新的工人。"
 samaria_inv.104.b:0 "我们的士兵会填补这个角色。"
 samaria_inv.104.c:0 "只是到时需要多花点时间。"
 samaria_inv.104.c.tt:0 "基里兹姆山圣地的进展因缺乏工人而受阻。"
 samaria_inv.104.desc:0 "随着基利心山圣所工作的进展，我们看到很多工人随着时间的推移而消失了。有些人辞职了，有些人死了，有些人干脆消失了。如果没有适当的劳动力在圣所工作，进度就会落后，我们可能无法得到我们想要的结果。"
 samaria_inv.104.t:0 "工人的消失"
 samaria_inv.105.a:0 "要把它修好，这样才能继续施工。"
 samaria_inv.105.b:0 "我们没有这方面的资金。"
 samaria_inv.105.b.tt:0 "吉里齐姆山圣所的进展因地震造成的破坏而受到阻碍。"
 samaria_inv.105.desc:0 "一场小地震震撼了基利心山圣所的墙壁和所有在里面工作的人，造成了一些轻伤，并对过去几个月的工作造成了一些损害。\n\n如果要继续不受阻碍地工作，需要拨出大量的资金来清理该地区，并替换一些被破坏的东西。"
 samaria_inv.105.t:0 "地震并发症"
 samaria_inv.106.a:0 "更大、更好！"
 samaria_inv.106.a.tt:0 "基利心山圣所的进展超过了我们原来的计划。"
 samaria_inv.106.b:0 "让我们把它们卖掉，把钱暂时放在一边。"
 samaria_inv.106.desc:0 "随着我们在基里兹姆山圣所的进展，我们似乎收到了一批额外的材料，其质量比预期的要好。我们可以用这批额外的材料使圣所比我们原来计划的更好，或者我们可以把它卖掉，坚持我们原来的计划，用一些额外的资金来应付其他意外情况的发生。"
 samaria_inv.106.t:0 "优质材料"
 samaria_inv.107.a:0 "这可能是假的。稀释了黄金。"
 samaria_inv.107.a.tt:0 "这将对吉里齐姆山圣所的质量产生负面影响。"
 samaria_inv.107.b:0 "那些显然是假的。我们将用纯金制作我们的。"
 samaria_inv.107.b.tt:0 "吉里齐姆山圣所的进展继续按计划进行。"
 samaria_inv.107.c:0 "这给了我一个想法……"
 samaria_inv.107.c.tt:0 "我们将声称已经恢复了摩西的会幕。\n基里兹姆山圣所的进展超出了我们最初的计划。"
 samaria_inv.107.d:0 "我们必须付出任何代价！"
 samaria_inv.107.d.tt:0 "我们将从牧羊人那里购买这些无价的文物。\n基利心山圣所的进展超出了我们最初的计划。"
 samaria_inv.107.desc:0 "当犹大人试图把会幕搬到耶路撒冷时，大祭司乌齐把帐篷和它的宝物藏在圣洁的基利心山的一个山洞里，它们奇迹般地消失了。\n\n新的圣所需要供祭司洗手和洗脚的盥洗器，供他们穿的珠宝服装，以及一个七枝纯金的灯台。\n\n现在，一个当地牧人声称在其中一个山洞里发现了原来的器皿。"
 samaria_inv.107.t:0 "灯塔"
 samaria_inv.11.a:0 "啊，是的。上帝为我们留下了怎样的奇迹，让我们去寻找。"
 samaria_inv.11.desc:0 "我们关注#Y [GetProvince('(int32)1693').GetName]#!的土地已经有一段时间了。官方说法是，因为那里的摩西神殿对我们的人民的信仰来说是个福音。然而，我们也有不可告人的目的--涉及在地球上发现的珍贵宝石。把它们从泥土中解放出来是我们神圣的职责。当然，摩西的神龛将被适当地点缀上几颗。"
 samaria_inv.11.t:0 "摩西的财富"
 samaria_inv.12.a:0 "如果祖先们有我们的道路为他们的轻松旅行而铺设，那就好了。哦，流浪的人。"
 samaria_inv.12.desc:0 "虽然我们自己没有参加那场穿越沙漠的长途跋涉，但我们从骨子里感受到那些朝圣者的痛苦，扑面而来的沙子在我们的血管里流淌，深深地印在我们的灵魂里。这是我们曾经为了我们的信仰而经受的挑战--不再是了。拥有这片土地，对其进行殖民，平定其空旷的荒地，为流浪的以色列人的故事画上了句号，一劳永逸。"
 samaria_inv.12.t:0 "结束无尽的徘徊"
 samaria_inv.13.a:0 "赞美主！"
 samaria_inv.13.desc:0 "现在可以接受走在大街上而不在泥泞和污秽中跋涉--津津乐道于这一成就!然而，我们的工作还没有完成。这片土地上的居民缺乏信仰，对我们的政府和我们的上帝，唯一的上帝缺乏信仰。让我们向他们展示光明，因为我们建立了一个伟大的圣地，他们会蜂拥而至。"
 samaria_inv.13.t:0 "给他们神"
 samaria_inv.14.a:0 "立即发送#Y [SCOPE.sCharacter('indiana_jones').GetName]#!"
 samaria_inv.14.desc:0 "有传言说，一些放羊人发现了失传已久的宝藏。然而，这些牧民立即意识到他们所发现的东西的价值，他们把宝藏藏在了山上。我们将派#Y [SCOPE.sCharacter('indiana_jones')GetName]#!去调查。[SCOPE.sChar('indian_jones').GetSheHe]一定会带些东西回来，甚至可能是判官时代的文物......"
 samaria_inv.14.t:0 "一个古老的宝藏"
 samaria_inv.15.a:0 "不惜一切代价！"
 samaria_inv.15.b:0 "给#Y [SCOPE.sCharacter('indiana_jones')GetName]#!授权以我的名义指挥一些部队！"
 samaria_inv.15.c:0 "我们不会再浪费任何硬币了！"
 samaria_inv.15.desc:0 "在调查谣言时，#Y [SCOPE.sCharacter('indiana_jones')GetName]#!出现了意外的开支。首先，雇佣的向导[SCOPE.sChar('indian_jones').GetSheHe]误导了[SCOPE.sChar('indian_jones').GetHerHim]，当他们像我们的祖先一样在沙漠中徘徊时，浪费了好几天。当这一切发生时，#Y [SCOPE.sCharacter('indiana_jones')GetName]#!在变幻莫测的沙地上迷失了方向，不得不以高昂的价格雇佣一些贝都因人来指路。希望[SCOPE.sChar('indian_jones').GetSheHe]最终能勘察山中的洞穴，[SCOPE.sChar('indian_jones').GetSheHe]现在就在那里--但是钱和物资已经用完了。任何进一步的搜索将不得不等待更多的资金......\n\n现在的问题是，我们要不要继续调查，或者说这些努力不值得我们去发现？"
 samaria_inv.15.t:0 "意想不到的开支"
 samaria_inv.16.a:0 "让他祝福我吧。"
 samaria_inv.16.b:0 "我将遵循他的建议。"
 samaria_inv.16.c:0 "把这个骗子送走。"
 samaria_inv.16.desc:0 "一位信使来到我们这里，说#Y [SCOPE.sCharacter('indiana_jones')GetName]#!已经发现了价值惊人的文物。而且不仅是一个，而是两个!其中一个似乎是一个金色的烛台，经过这么长时间的打磨。#Y [SCOPE.sCharacter('indiana_jones')GetName]#! 表示，那是乌兹所藏的会幕中的烛台。第二件物品是一个神秘的盒子，有点损坏，但#Y [SCOPE.sCharacter('indiana_jones')GetName]#!确信我们可以恢复它。\n\n当天晚上，在信使退休后，一位牧师带着可怕的警告找到了你。他声称，只有在他的祝福下，你才能毫发无损地看到宝藏，但拒绝详细说明他的真正含义。"
 samaria_inv.16.t:0 "宝藏"
 samaria_inv.17.a:0 "奇妙的"
 samaria_inv.17.b:0 "打开它！"
 samaria_inv.17.desc:0 "我们发现了#Y 约柜#!和会幕的原版#Y 灯台#!当大祭司乌齐为了防止巫师伊莱把它们带到他在耶路撒冷的异端教派时，它们奇迹般地消失了。现在，我们将在基利心山为这些最神圣的遗物建造一个新的圣所。许多人都想来看看约柜的房子，但没有人会去触碰它，因为他们担心自己不配，担心上帝会打击他们。"
 samaria_inv.17.t:0 "一个古老的宝藏被揭开"
 samaria_inv.17.tt:0 "不保护你的王有后果...你的统治者死了"
 samaria_inv.18.a:0 "我们再也不会对埃及做出回应。"
 samaria_inv.18.desc:0 "我们的埃及邻居在任何时候都有很大的危险。我们的职责是加强我们的人民和我们的信仰，以实现上帝赋予我们的光荣目的，为什么我们要让自己毫无防备，软弱无力，任人攻击。让我们加固我们南部的堡垒，伟大的#Y [GetProvince('(int32)509').GetName]#!，从而防止我们被那些曾经奴役我们的人所攻击。"
 samaria_inv.18.t:0 "对抗埃及的墙"
 samaria_inv.19.a:0 "愿节庆活动开始！"
 samaria_inv.19.desc:0 "最后，所有的圣地都已升级为宏伟的神殿，保护着最神圣的地方。它们的美丽甚至超过了巴比伦的宫殿，只有著名的悬空花园能够与我们的成就相比。\n\n毫无疑问，我们知道他一定在看着。我们希望这些祠堂能配得上他的先知。现在，人们可以欢呼了，因为将有一场盛宴，对所有人免费。"
 samaria_inv.19.t:0 "神圣的圣地"
 samaria_inv.2.a:0 "按照承诺，他们将得到土地。"
 samaria_inv.2.b:0 "我们不会让出一寸！"
 samaria_inv.2.desc:0 "在我们对抗其他的觊觎者的战争中，我们已经答应#Y [SCOPE.sCountry('mission_country_scope').GetName] #!用土地换取他们的帮助。\n\n尽管如此，一些狡猾的舌头还是为保留土地进行游说。我们不应该忘记，#Y [SCOPE.sCountry('mission_country_scope').GetName]#!只不过是一个小国......"
 samaria_inv.2.t:0 "应许之地"
 samaria_inv.20.a:0 "一个新的黎明为我们升起，这次是在尼罗河上。"
 samaria_inv.20.desc:0 "埃及曾经是我们的家，一个我们是下等人的地方，在那里他们的假神统治着我们。摩西为我们指出了一条从那种生活方式中走出来的道路，把我们带过沙漠，来到渴望已久的圣地。我们永远不能忘记他给以色列人的伟大礼物，但我们也不能忘记埃及人和他们给我们带来的痛苦。但现在我们可以在上帝的光束下和平地沿着尼罗河航行，事情可以变得不同。让我们按照我们的形象重塑埃及，原谅他们祖先的错误，就像上帝规定我们必须做的那样。"
 samaria_inv.20.t:0 "放飞过去"
 samaria_inv.21.a:0 "愿他们的知识为我们建造城市！"
 samaria_inv.21.desc:0 "在[SCOPE.sProvince('holy_city_scope')GetName]，最近有大量的信徒涌入。许多人听说过图书馆和寺庙，渴求着它们所提供的免费知识。还有一些人，他们的思想专注于宗教事务，是来向先知们致敬的。然而，将他们所有人联系在一起的是对认识和了解我们的主所创造的世界的渴望。"
 samaria_inv.21.t:0 "一个知识和智慧的城市"
 samaria_inv.22.a:0 "赔偿业主。"
 samaria_inv.22.b:0 "检查所有材料是否有缺陷！"
 samaria_inv.22.c:0 "几个奴隶算什么？"
 samaria_inv.22.desc:0 "当我们在我们的首都[ROOT.GetCountry.GetCapital.GetName]进行建设，使她更加美丽和辉煌的时候，发生了一场可怕的事故。在圣殿区附近的施工过程中，一条旧绳索撕裂了，它所承载的石头掉到了几个正在施工的奴隶身上。业主在表明责任时缄口不言，声称这到底是我们的工程，因此是我们的错。他希望替换他的奴隶。"
 samaria_inv.22.t:0 "在[ROOT.GetCountry.GetCapital.GetName]发生的意外"
 samaria_inv.23.a:0 "卖掉遗迹。"
 samaria_inv.23.b:0 "恢复建筑！"
 samaria_inv.23.c:0 "让穷困的人拥有它。"
 samaria_inv.23.desc:0 "我的#Y 纳西#!，我们在首都的工人在我们的建筑工地中发掘出了一个古老的建筑。建筑师告诉我们，我们可以修复这个建筑，按照它曾经的用途来使用它。我们也可以把它拆掉，卖掉它的残骸来资助我们的大都市。然而，似乎我们的一些贫穷的公民已经把废墟当成了他们的家‑也许我们可以让我们的人住在那里？"
 samaria_inv.23.t:0 "古老的结构被揭开"
 samaria_inv.24.a:0 "支付赎金。"
 samaria_inv.24.b:0 "派出一些士兵！"
 samaria_inv.24.c:0 "从另一座建筑中借钱。"
 samaria_inv.24.desc:0 "我的#Y 纳西#!，有消息称，从采石场运来的最后一支车队被土匪伏击了，他们带着急需的石料。他们傲慢地索要赎金，让商队到达城市，并威胁说如果我们不迅速服从，就会杀死所有人。\n\n然而，我们的士兵离他们的藏身之处并不遥远。最近的营地只有几天的路程，如果真的有必要，我们可以从另一个更古老的建筑中借来替换我们需要的石头。我们应该怎么做？"
 samaria_inv.24.t:0 "一个被伏击的车队"
 samaria_inv.25.a:0 "令人惊叹"
 samaria_inv.25.desc:0 "最后，我们伟大的首都[ROOT.GetCountry.GetCapital.GetName]与我们繁荣的国度的辉煌相称。它的大理石墙和黄金浮雕折射出的光线令人叹为观止，令人敬畏，令人难以置信。我们伟大国度的美丽远远超出了我们的首都，遥远国度的国王们仅仅听到这个消息就嫉妒不已。"
 samaria_inv.25.t:0 "一个大理石和黄金的城市"
 samaria_inv.26.a:0 "啊，一英里长的船只排着队等着在我们的港口靠岸。"
 samaria_inv.26.desc:0 "建设和改善我们的港口是一项崇高的工作，但也是一项特别费力的工作。虽然这些费用是值得的，但显然我们的粮食和黄金储备在我们的巨大慈善下已经枯萎了。我们宫廷里的一个卑微的人来到我们面前，讲述了[GetProvince('(int32)743').GetName]的特殊状况，它庞大的港口和广泛的贸易带来了丰富的财富，移民也随之而来。海岸上伟大的黎凡特港口城市是我们王国的皇冠上的宝石。"
 samaria_inv.26.t:0 "大黎凡特港"
 samaria_inv.27.a:0 "它们是一种威严，可以看得到。"
 samaria_inv.27.desc:0 "为什么我们最神圣的地方缺乏这么多的游客？为什么它们总是显得那么光秃秃的，没有光明的爱？也许它们是世界上所有圣地中最古老和最不修边幅的--看着它们，人们会这样认为。我们非常需要公众对这些圣地产生兴趣。我们有上帝的话语，有他的门徒，有他的威严的壮举。我们已经收集了他伟大工作的遗物，现在用它们来装饰这些圣地，使人们知道主为他们所做的一切。"
 samaria_inv.27.t:0 "受人尊敬的神殿"
 samaria_inv.28.a:0 "钟声响起，所有的人都涌向大会堂听道。"
 samaria_inv.28.desc:0 "我们在传播神的话语方面的努力已经相当成功。然而，人们乞求更多--他们非常渴望公义。毫不奇怪，就在今天早上，一个衣衫褴褛的人，一个傻瓜，求我指点他去上帝的家。当我告诉他我不能这样做，因为那不是一个容易看到的地方时，他哭了，求我告诉他在哪里可以找到主。对于这样绝望的灵魂，我们该怎么做？我说，我们给他们提供最接近我们主的房子的东西--建立一个伟大的纪念碑来安置圣人，平民可以进入那里，感觉更接近他们的上帝。"
 samaria_inv.28.t:0 "一个神圣的地方"
 samaria_inv.29.a:0 "以上帝的名义！"
 samaria_inv.29.desc:0 "丰富的叙利亚土地现在属于我们了。曾经，这么多代以前，我们在这里步步高升，统治着它的南部。现在，我们已经超越了我们的前辈。对亚述的报复不会是迅速的，也不会是无痛的......"
 samaria_inv.29.t:0 "叙利亚的征服"
 samaria_inv.3.a:0 "是的，我们会向#Y [SCOPE.sCountry('alliance_target_1')GetName]#!"
 samaria_inv.3.b:0 "#Y [SCOPE.sCountry('alliance_target_2')GetName]#!是一个更好的选择"
 samaria_inv.3.desc:0 "最近，我们已经宣布独立。自从我们加入了成功者的最后一场战争，我们被公认为是一支不可忽视的力量。然而，我们是孤独的，而孤独的狼很容易成为猎物。因此，我们必须寻找盟友以保持强大和独立。\n\n我们可以向#Y [SCOPE.sCountry('alliance_target_1')GetName]#!或#Y [SCOPE.sCountry('alliance_target_2')GetName]#!要求建立联盟。然而，重要的是，他们要尊重我们，否则他们只会嘲笑我们的脸......"
 samaria_inv.3.t:0 "寻求联盟"
 samaria_inv.30.a:0 "一个叙利亚人不过是一个被阴影包裹的以色列人......"
 samaria_inv.30.desc:0 "叙利亚人是什么，不过是我们北方的对手，是我们埃及和东方之间土地对面的人？他们与我们如此相似，却又如此不同，他们不尊重上帝的旨意。他们不能读他的话语，因为他们不说他的语言。他们无法看到祂的作为，尽管他们生活在这样一个圣洁的地方。我们的智者不断地工作来解决这个问题；他们中的每一个人每天都会打开一百个叙利亚人的眼睛，把上帝的话语和爱注入他们的灵魂。"
 samaria_inv.30.t:0 "走吧，看不见的叙利亚人"
 samaria_inv.31.a:0 "愿他们的骨头烂在坟墓里。"
 samaria_inv.31.desc:0 "几个世纪前，他们征服了我们。现在，他们的国度不过是野蛮的梦想，几乎被遗忘。当他们迫使我们的祖先离开我们的祖先的土地时，只有少数人留下来，吃着苦难的面包。然而，亚述人认为他们过去的行为已经被遗忘或被宽恕，这是一种愚蠢的想法。他们的城市现在是我们的了，他们祖先的事迹也从历史书上抹去了。今天是亚述的末日。"
 samaria_inv.31.t:0 "流亡的亚述人"
 samaria_inv.32.a:0 "主万岁，唯一的真神。"
 samaria_inv.32.desc:0 "他们曾是我们的征服者，是奴役我们的主人，强迫我们屈从于他们的道路，敬拜他们虚假的神，施行他们的仪式。时代已经何等改变，强者竟在唯一真神的旗帜下枯萎倒下。他们恳求我们仁慈，恳求我们宽恕，恳求我们按照祂话语的价值行事。这个请求，我们不能答应，因为他们永远都会是压迫者。他们的生活方式必须被我们的生活方式取代！"
 samaria_inv.32.t:0 "亚述人去死吧"
 samaria_inv.33.a:0 "我们站在巨人的肩膀上"
 samaria_inv.33.desc:0 "很久以前，巴比伦人征服了我们自己的征服者，亚述人，以及我们的南方表亲。通过自己征服他们，我们将证明自己是一个不可忽视的力量。"
 samaria_inv.33.t:0 "巴比伦，我们征服者的征服者"
 samaria_inv.34.a:0 "该死的异教徒！"
 samaria_inv.34.a.tt:0 "#Y $zealot_country_name$#!已经脱离了，并向我们宣布独立战争。"
 samaria_inv.34.b:0 "为了耶路撒冷的自由！"
 samaria_inv.34.b.tt:0 "你将扮演#Y $zealot_country_name$#! 并脱离宣布独立战争。"
 samaria_inv.34.desc:0 "因我们摧毁了他们的异端神庙而感到愤怒，由[zealot_leader.GetFullName|Y]领导的激进犹太人已经起来反抗我们的统治！"
 samaria_inv.34.t:0 "狂热者的叛乱"
 samaria_inv.35.a:0 "他们是假律法的奴隶，他们将是奴隶。"
 samaria_inv.35.a.tt:0 "[GetProvince('(int32)687').GetArea.GetName|Y]省的[GetCulture('hebrew').GetName|Y][GetReligion('judaism').GetName|Y]贵族、公民和自由人中的三分之二将成为奴隶，被转移到我国各地的城市。"
 samaria_inv.35.b:0 "给他们提供大赦。"
 samaria_inv.35.desc:0 "经过最后的围攻，许多狂热者宁可自杀也不愿被俘，我们终于将[GetProvince('(int32)687').GetArea.GetName]重新置于我们的控制之下。为了一劳永逸地消除犹大人在耶路撒冷山上的异端崇拜，有人建议我们可以奴役他们，把他们分散到我们的土地上，让他们学会正确的崇拜。"
 samaria_inv.35.t:0 "枷锁中的犹地亚"
 samaria_inv.36.a:0 "他们将充实我们的国家。"
 samaria_inv.36.b:0 "我们会容忍他们，但他们不会得到任何施舍。"
 samaria_inv.36.c:0 "他们的麻烦与我们无关。"
 samaria_inv.36.d:0 "把他们关进铁链里。"
 samaria_inv.36.desc:0 "一列列的犹地亚难民已经抵达我们的土地。他们告诉我们，他们的撒玛利亚宗主摧毁了他们的寺庙，强迫他们放弃他们的宗教，暴力镇压任何试图继续他们传统的行为。他们要求获得在我们的土地上定居的权利。"
 samaria_inv.36.t:0 "犹地亚难民"
 samaria_inv.4.a:0 "我们接受这个提议。"
 samaria_inv.4.b:0 "他们没有我们需要的东西。"
 samaria_inv.4.desc:0 "我们收到了来自#Y [SCOPE.sCountry('mission_scope_country')GetName]#!的联盟建议。从信中，我们可以了解到他们在迦南占据了一个战略位置。他们提供了一个联盟，然而我们应该记住，我们自己的利益应该是我们的首要任务。"
 samaria_inv.4.t:0 "一个联盟提案"
 samaria_inv.5.a:0 "愿主得到赞美！"
 samaria_inv.5.desc:0 "我们的努力取得了成果，因为#Y [SCOPE.sCountry('alliance_target_1')GetName]#!已经接受了我们的联盟请求。今后，他们将与我们一起作战，在和平中与我们进行贸易。我们的敌人就是他们的敌人，他们的朋友就是我们的朋友。"
 samaria_inv.5.t:0 "接受联盟"
 samaria_inv.6.a:0 "水到渠成。"
 samaria_inv.6.b:0 "是的，我们应向对方国家询问。"
 samaria_inv.6.desc:0 "可悲的是，我们提出的合作和联盟被拒绝了--然而我们不应该绝望，因为还有其他的途径。如果他们不是我们的盟友，那么他们将是我们的敌人！。\n\n此外，我们的国王心中还有一个联盟的第二选择。如果我们还没有，也许我们应该问问他们？"
 samaria_inv.6.t:0 "拒绝的提议"
 samaria_inv.7.a:0 "当他们的城市发生骚乱时，一股圣火在燃烧。"
 samaria_inv.7.desc:0 "迦南有些地方抵制我们的征服，仍然对他的话语充耳不闻，对他的光明视而不见。我们在这些破败地方的代理人已经着手激怒当地人，让他们指责锁住他们的当局。这将使我们对这片土地的征服变得更加容易--我们将被视为我们是伟大的救世主。"
 samaria_inv.7.t:0 "把边界夷为平地"
 samaria_inv.8.a:0 "愿主对他们微笑。"
 samaria_inv.8.desc:0 "我们帮助他们对抗对手，而现在他们兑现了他们的承诺。我们祖先的土地将归还给我们，不会再有任何流血事件。多么令人高兴啊！"
 samaria_inv.8.t:0 "一个光荣的承诺"
 samaria_inv.9.a:0 "我们被分开太久了。"
 samaria_inv.9.desc:0 "几百年前，当伊萨马的儿子们背弃了真正的法律时，我们的民族已经分离。我们的分离导致了我们不同的发展，但我们仍然是一个民族，一个起源。现在，我们已经把分歧放在一边，再次团结起来。以色列人回来了，重新夺回他们在迦南的合法地位！"
 samaria_inv.9.t:0 "再次联合王国"
 samaria_inv_36.a.tt:0 "5 [GetCulture('hebrew').GetName|Y] [GetReligion('judaism').GetName|Y] 公民流行将出现在我们整个城市。"
 samaria_inv_36.b.tt:0 "5 [GetCulture('hebrew').GetName|Y] [GetReligion('judaism').GetName|Y] Freemen pops将出现在我们的城市。"
 samaria_inv_36.c.tt:0 "难民将被拒之门外。"
 samaria_inv_36.d.tt:0 "5 [GetCulture('hebrew').GetName|Y] [GetReligion('judaism').GetName|Y] 奴隶将出现在我们的城市里。"
 samaria_inv_mission:0 "北方的以色列人"
 samaria_inv_mission_BUTTON_TOOLTIP:0 "我们将向世界展示我们民族和信仰的伟大！"
 samaria_inv_mission_CRITERIA_DESCRIPTION:0 "一旦我们在以色列土地上恢复了法官的统治，并开发了它的圣地，这项任务就被认为是完成了。此外，我们还可以将我们的影响力扩展到埃及和美索不达米亚。"
 samaria_inv_mission_DESCRIPTION:0 "我们常常被犹大人的表亲所遗忘，我们坚持按照摩西的命令敬拜耶和华，只在示剑附近的基利心山敬拜他。我们四面都是异教徒和异端，但随着亚历山大帝国的瓦解，我们可以恢复对以色列土地的正义统治！"
 samaria_inv_mission_task_1:0 "继业者"
 samaria_inv_mission_task_1.tt:0 "我们可以加入托勒密或安提戈诺斯恢复亚历山大帝国的追求；然而，如果他们的关系不#G 积极#!，两者都可以#R 拒绝#!。如果他们决定不升级他们的冲突，那么这个任务将在#Y 10#!年后被绕过。"
 samaria_inv_mission_task_10:0 "约瑟之家"
 samaria_inv_mission_task_10_DESC:0 "在以色列各部落中，玛拿西和以色列，约瑟部落的两半，独自坚守着律法。我们必须夺回分配给我们的土地。"
 samaria_inv_mission_task_10_modifier:0 "约瑟之家"
 samaria_inv_mission_task_11:0 "北方的部落"
 samaria_inv_mission_task_11_DESC:0 "虽然其他北方部落被亚述人驱散，并被偶像崇拜所迷惑，但他们曾经从撒玛利亚被统治过，他们的土地再次被统治也是理所当然。"
 samaria_inv_mission_task_12:0 "南方的部落"
 samaria_inv_mission_task_12_DESC:0 "南方部落因陷入异端而证明无法统治自己。只有在我们的统治下，我们才能让以色列的子民回归正义。"
 samaria_inv_mission_task_13:0 "对阿拉姆的报复"
 samaria_inv_mission_task_13_DESC:0 "很久以前，大马士革的亚拉姆人在战场上击败了我们。现在我们将复仇，确保我们的北部边境安全。"
 samaria_inv_mission_task_14:0 "参孙的脚步"
 samaria_inv_mission_task_14_DESC:0 "参孙，最后的审判者，是以色列子民在天赐时代的最后统治者。他在摧毁非利士人的首都加沙时以烈士身份死去。我们将把这些土地降压在我们的脚下。"
 samaria_inv_mission_task_15:0 "摩押和以东"
 samaria_inv_mission_task_15_DESC:0 "南方的摩押和以东人是约书亚率领我们征服迦南地之前所剩下的全部人民。我们将最终完成他的工作，一劳永逸地消灭他们。"
 samaria_inv_mission_task_16:0 "以实玛利人"
 samaria_inv_mission_task_16_DESC:0 "以实玛利人是以撒长兄的后裔，统治着我们南方的广大土地。我们应该通过让他们成为我们的臣民来确保我们的边界。"
 samaria_inv_mission_task_16_modifier:0 "阿拉伯的霸主"
 samaria_inv_mission_task_17:0 "圣城"
 samaria_inv_mission_task_17_DESC:0 "法官们的许多古老而神圣的城市多年来被亚述人、巴比伦人、波斯人或希腊人摧毁。我们应该将这些城市恢复到它们早期的状态。"
 samaria_inv_mission_task_17_modifier:0 "一个新的圣地"
 samaria_inv_mission_task_18:0 "摩西在这里遇见了他"
 samaria_inv_mission_task_18_DESC:0 "几百年前，当摩西带领我们的人民离开埃及时，主对他说话，命令他在这里写下十条诫命。"
 samaria_inv_mission_task_19:0 "西奈半岛"
 samaria_inv_mission_task_19_DESC:0 "西奈半岛具有战略地位，它应该是我们的。"
 samaria_inv_mission_task_1_DESC:0 "亚历山大死后20年，他的继承人仍在为他曾经强大的帝国的遗迹争吵不休。这导致了无休止的流血事件，这对贸易来说是不利的。不过我们也许能解决这个问题......"
 samaria_inv_mission_task_2:0 "在迦南煽动叛乱"
 samaria_inv_mission_task_2.tt:0 "希伯来专家将在迦南煽动动乱。每一块不属于撒玛利亚或犹地亚的领土，只要有希伯来人占多数的人居住在那里，就会获得#Y 被煽动的动乱#!。"
 samaria_inv_mission_task_20:0 "寻宝"
 samaria_inv_mission_task_20_DESC:0 "一个传言传到了我们的耳朵里，一个失传已久的宝藏在丢失后被牧民找到了。然而，这些牧民把它藏在了山里。调查这件事可能是浪费资源，然而这可能值得找到神宠时代的遗物。"
 samaria_inv_mission_task_21:0 "加固西部边境"
 samaria_inv_mission_task_21_DESC:0 "据守庇路西翁要冲，便可锁死埃及进犯之路。"
 samaria_inv_mission_task_22:0 "对先知的崇敬"
 samaria_inv_mission_task_22_2.tt:0 "所有其他圣地也将获得#Y 圣土#! 。"
 samaria_inv_mission_task_22_DESC:0 "先知们曾经踏上这片土地，他们的事迹直到今天还在回荡。"
 samaria_inv_mission_task_23:0 "奴役埃及"
 samaria_inv_mission_task_23_1.tt:0 "我们将释放#Y 米兹拉伊姆#!作为埃及的一个藩属国。"
 samaria_inv_mission_task_23_2.tt:0 "只要#Y 米兹拉伊姆#!仍然是我们的附属国，此效果就会一直存在。"
 samaria_inv_mission_task_23_DESC:0 "在埃及被奴役了好几代，我们的祖先被迫过着艰难而屈辱的生活。只有当摩西带领我们进入应许之地时，我们才获得自由。\n现在该还债了！"
 samaria_inv_mission_task_24:0 "一个学习的殿堂"
 samaria_inv_mission_task_24_DESC:0 "最近建立的城市吸引了许多人。为了将他们都引导到正确的方向，我们需要图书馆和大厅来研究法律。然后，知识和智慧的话语将传到他们的耳朵里。"
 samaria_inv_mission_task_25:0 "大理石和黄金的城市"
 samaria_inv_mission_task_25_DESC:0 "#Y [ROOT.GetCountry.GetCapital.GetName]#!是一个闪亮王国的首都。然而，当游客来参观它时，他们并没有像他们应该的那样充满敬畏和惊奇。"
 samaria_inv_mission_task_26:0 "地中海的港口"
 samaria_inv_mission_task_26.tt:0 "以下城市中，必须有至少 #Y 6#! 座中的 #Y 3#! 座满足下列要求：\n#Y [GetProvince('(int32)743').GetName]#!、#Y [GetProvince('(int32)670').GetName]#!、#Y [GetProvince('(int32)766').GetName]#!、#Y [GetProvince('(int32)786').GetName]#!、#Y [GetProvince('(int32)659').GetName]#!、#Y [GetProvince('(int32)664').GetName]#!\n\n#T 要求#!\n至少产出 #Y 3#! 种商品\n至少建有 1 个 #Y 市场#!\n至少建有 3 个 #Y 港口#!"
 samaria_inv_mission_task_26_DESC:0 "黎凡特海岸上的大城市一直都很有生产力，贸易使它们变得富有。然而，生产和贸易对较贫穷的人来说是有代价的，他们不得不生活在港口和市场的气味和噪音中。"
 samaria_inv_mission_task_26_tt_2:0 "每个满足条件的城市将获得#Y  [GetModifier('judea_modifier_20').GetName]#!:\n[GetModifier('judea_modifier_20').GetDesc]"
 samaria_inv_mission_task_27:0 "填充神龛"
 samaria_inv_mission_task_27.tt:0 "[GetDeityDefinition('omen_moses').GetName|Y], [GetDeityDefinition('omen_deborah').GetName|Y], [GetDeityDefinition('omen_joshua').GetName|Y], [GetDeityDefinition('omen_samson').GetName|Y], [GetDeityDefinition('omen_miriam').GetName|Y], [GetDeityDefinition('omen_uzzi').GetName|Y], [GetDeityDefinition('omen_abishua').GetName|Y], [GetDeityDefinition('omen_aaron').GetName|Y], [GetDeityDefinition('omen_abraham').GetName|Y], [GetDeityDefinition('omen_joseph').GetName|Y], [GetDeityDefinition('omen_jacob').GetName|Y]，& [GetDeityDefinition('omen_noah').GetName|Y]里面至少要有一个宝物。\n#R 替换先知每次需要花费15点稳定度！#!"
 samaria_inv_mission_task_27_2.tt:0 "所有其他的圣地也会得到#Y 辉煌的神庙#!。"
 samaria_inv_mission_task_27_DESC:0 "所有的神龛都必须容纳一件价值连城的文物。我们将以此来纪念我们的先知们。"
 samaria_inv_mission_task_28:0 "神殿和犹太教堂"
 samaria_inv_mission_task_28.tt:0 "[GetDeityDefinition('omen_moses').GetName|Y], [GetDeityDefinition('omen_deborah').GetName|Y], [GetDeityDefinition('omen_joshua').GetName|Y], [GetDeityDefinition('omen_samson').GetName|Y], [GetDeityDefinition('omen_miriam').GetName|Y], [GetDeityDefinition('omen_uzzi').GetName|Y], [GetDeityDefinition('omen_abishua').GetName|Y], [GetDeityDefinition('omen_aaron').GetName|Y], [GetDeityDefinition('omen_abraham').GetName|Y], [GetDeityDefinition('omen_joseph').GetName|Y], [GetDeityDefinition('omen_jacob').GetName|Y], & [GetDeityDefinition('omen_noah').GetName|Y]需要有一个伟大的神庙建筑。\n\n只有城市才能有伟大的神庙建筑。"
 samaria_inv_mission_task_28_DESC:0 "没有辉煌的会堂，哪来的圣地？"
 samaria_inv_mission_task_29:0 "文明的灯塔"
 samaria_inv_mission_task_29_DESC:0 "我们将作为文明的灯塔而闪耀，为后世和其他领域引领方向。"
 samaria_inv_mission_task_2_DESC:0 "迦南是我们的，曾经是。现在，打击的时机已经到来。我们应该从破坏入侵者的稳定开始..."
 samaria_inv_mission_task_3:0 "应许之地"
 samaria_inv_mission_task_3.tt:0 "一旦战争结束，我们将要求得到应许给我们的土地。"
 samaria_inv_mission_task_30:0 "进入叙利亚"
 samaria_inv_mission_task_30.tt:0 "你们获得了对整个美索不达米亚地区的宣称。"
 samaria_inv_mission_task_30_DESC:0 "征服叙利亚将是我们国家的一个巨大的福音。河流和农场将养活我们的国家，直到我们准备好向亚述人报仇。"
 samaria_inv_mission_task_31:0 "皈依叙利亚"
 samaria_inv_mission_task_31_DESC:0 "叙利亚的肥沃土地上住着许多人 但以色列人的信仰将成为他们的纽带"
 samaria_inv_mission_task_32:0 "亚述"
 samaria_inv_mission_task_32_DESC:0 "亚述人将我们的人民分散在他们的帝国中。当我们重新获得神的眷顾时，我们将征服他们。"
 samaria_inv_mission_task_33:0 "在巴比伦传教"
 samaria_inv_mission_task_33_DESC:0 "古老的巴比伦人的土地已经被征服了。在市场上，他们都聚集在一起。因此，在市场上，他们将被改造。"
 samaria_inv_mission_task_34:0 "尼尼微被掠夺"
 samaria_inv_mission_task_34.tt:0 "只要尼尼微仍然是一个充满奴隶的落后小定居点，这个修正就会一直存在。"
 samaria_inv_mission_task_34_DESC:0 "曾经，亚述人征服了我们，把我们的人民分散在他们的帝国里。为此，我们将摧毁他们的遗产。"
 samaria_inv_mission_task_35:0 "巴比伦"
 samaria_inv_mission_task_35_DESC:0 "拿下亚述后，美索不达米亚的富饶平原已经成熟。"
 samaria_inv_mission_task_36:0 "枷锁中的犹地亚"
 samaria_inv_mission_task_36.tt:0 "狂热者已经起义。"
 samaria_inv_mission_task_36.tt.2:0 "狂热者并不存在。"
 samaria_inv_mission_task_36_DESC:0 "在我们摧毁了他们的异端神庙之后，狂热者的叛乱终于被平息了。现在我们可以作为一个民族遵循真正的摩西律法前进了。"
 samaria_inv_mission_task_3_DESC:0 "现在战争已经结束，我们将要求获得应许给我们的土地。"
 samaria_inv_mission_task_4:0 "稍后统一我们的王国"
 samaria_inv_mission_task_4_DESC:0 "犹地亚与撒玛利亚本是一体的两个王国。如今是时候重新联合，但我们不可操之过急‑数世纪的分离已使我们迥异。我们应当审慎行事。使他们成为附庸国，或许能让两国再度亲近。\n\n这项任务与#Y 稍后统一我们的王国#!#R 互斥#!"
 samaria_inv_mission_task_5:0 "现在统一我们的王国"
 samaria_inv_mission_task_5_DESC:0 "犹地亚和撒玛利亚本是一体的两个王国。数百年前分隔两地，如今正是重归统一之时。\n\n这项任务与#Y 稍后统一我们的王国#!#R 互斥#!"
 samaria_inv_mission_task_6:0 "寻找朋友"
 samaria_inv_mission_task_6.tt:0 "我们将能够向另一个国家发送联盟建议。"
 samaria_inv_mission_task_6_2.tt:0 "#R 至少需要有一个大国对[THIS.GetCountry.GetName]有正面评价#!"
 samaria_inv_mission_task_6_DESC:0 "盟友在未来的战争中会很有用。"
 samaria_inv_mission_task_7:0 "执行撒玛利亚主义"
 samaria_inv_mission_task_7.tt:0 "#T $wonder_second_temple_ezra$#!将被摧毁！"
 samaria_inv_mission_task_7.tt.2:0 "[GetProvince('(int32)687').GetArea.GetName|Y]省的以色列领土将在一年内脱离并向我们宣战！"
 samaria_inv_mission_task_7_DESC:0 "在巫师以利的引诱下，犹大人偏离了对主的正确敬拜，选择在他们南部的山上献上异端的祭品。在我们的指导下，他们可以被带回到正道。"
 samaria_inv_mission_task_8:0 "一座皇家城市"
 samaria_inv_mission_task_8.tt:0 "我们可以选择以[GetProvince('(int32)679').GetName|Y]或[GetProvince('(int32)680').GetName|Y]作为我们的首都。\n新的首都获得#Y  [GetModifier('samaria_inv_mission_task_8_royal_city').GetName]#!:\n[GetModifier('samaria_inv_mission_task_8_royal_city').GetDesc]"
 samaria_inv_mission_task_8_DESC:0 "北方国王从[GetProvince('(int32)679').GetName|Y]以西的伟大城市[GetProvince('(int32)680').GetName|Y]进行统治。我们应该到它以前的荣耀。"
 samaria_inv_mission_task_8_royal_city:0 "撒玛利亚人的皇家城市"
 samaria_inv_mission_task_8_samaria:0 "俄米的首都"
 samaria_inv_mission_task_8_shechem:0 "公义之都"
 samaria_inv_mission_task_9:0 "点缀杰里津"
 samaria_inv_mission_task_9_DESC:0 "现在是时候了，我们要把基利心山上简陋的圣殿美化成一座光荣的圣殿，以符合上帝规定的作为崇拜他的唯一地点和存放我们遗物的地方。"
 samaria_mission_abortion.tt:0 "在5年内，你们将无法再次承担这项任务。"
 samaria_modifier_12:0 "尼尼微被掠夺"
 samaria_modifier_12_desc:0 "我们对亚述人几百年前的奴役进行了报复。他们现在都在做奴隶..."
 samaritanism_enforced:0 "撒玛利亚人制度的实施"
 tolerated_judean_refugees:0 "被容忍的犹太难民"
 western_wall_modifier:0 "西墙"
 western_wall_modifier_desc:0 "第二圣殿仅存的是它的西墙，至今仍吸引着朝圣者。"
 zealot_country_adjective:0 "狂热者"
 zealot_country_name:0 "狂热者"

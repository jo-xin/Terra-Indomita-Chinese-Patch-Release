 qataba_mission:0 "卡塔巴王国"
 qataba_mission_BUTTON_TOOLTIP:0 "我们将复仇……"
 qataba_mission_CRITERIA_DESCRIPTION:0 "一旦我们征服萨巴王国并巩固南阿拉伯，这项任务将视为完成。"
 qataba_mission_DESCRIPTION:0 "#E 卡塔巴王国#!自我们部落记忆以来，一直是#E 萨巴王国#!的宿敌，我们曾经的霸主，时间的流逝并未消散我们对邻国的怨恨。我们摆脱萨巴的枷锁已近两百年，如今我们在经济和军事上几乎与昔日的主人平起平坐。\n\n现在是时候完成我们祖辈未竟的事业——我们必须摧毁那些阻碍阿拉伯统一的敌人。"
 qataba_rise_1_tt:0 "#Y 力量崛起#!现在将授予#Y 5%#!@military_experience_icon! #Y 每月军事经验#!"
 qataba_rise_2_tt:0 "#Y 力量崛起#!现在将授予#Y 5%#!@army_movement_speed! #Y 军队移动速度#!"
 qataba_rise_3_tt:0 "#Y 力量崛起#!现在将授予#Y 5%#!@manpower_recovery_speed! #Y 人力恢复速度#!"
 qataba_rise_in_power_1:0 "力量崛起"
 qataba_rise_in_power_2:0 "力量崛起"
 qataba_rise_in_power_3:0 "力量崛起"
 qataba_rise_in_power_4:0 "力量崛起"
 qataba_task_1:0 "卡塔巴王国"
 qataba_task_1_DESC:0 "卡塔巴王国在久远的过去摆脱了萨巴的统治，此后大部分时间都在与这个古老王国竞争。确保盟友和建设一支强大的军队无疑是击败我们昔日主人的关键。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 qataba_task_2:0 "强大的军队"
 qataba_task_20:0 "外向雄心"
 qataba_task_20_DESC:0 "虽然我们国内有许多问题需要处理，但这并不意味着我们的雄心不向外扩展……\n在#E 阿拉伯福地#!有许多部落，我们很快将与之交锋。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 qataba_task_21:0 "整合马因"
 qataba_task_21_DESC:0 "米奈人已被我们统治了数代，除了语言和地方特色外，他们与我们已无区别。为什么他们不该成为我们领域的一部分呢？ \n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 qataba_task_22:0 "击败对手"
 qataba_task_22_DESC:0 "[GetCountry('SHB').GetName]自古以来一直是我们的压迫者和对手，统治我们时间之久难以计算。现在，时机已到，轮到我们翻盘并复仇。\n\n听好了，萨巴人民：我们卡塔巴人将夺回你们从我们这里拿走的一切，并索取我们应得的复仇。我们永不妥协，直到你们仅剩一缕记忆，从时间的历史中消失，甚至你们脚下的沙尘都不会记得你们。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 qataba_task_23:0 "北部边境"
 qataba_task_23_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]最近难以入眠，[ROOT.GetCountry.GetRuler.GetHerHis]的心思集中在北部边境上——我们必须采取措施确保该地区的安全，以免被入侵军队措手不及。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 qataba_task_24:0 "向东进发"
 qataba_task_24_DESC:0 "东方的#E 哈德拉穆特#!居民以见风使舵著称，当政治上方便时便抛弃他们的神祇。让我们一劳永逸地平定这些异教徒。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 qataba_task_25:0 "进入非洲"
 qataba_task_25_DESC:0 "现在我们已征服了#E 非洲#!的部分地区，我们必须就该地区的未来进行重要讨论。\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 qataba_task_26:0 "深入沙漠"
 qataba_task_26_DESC:0 "生活在#E 金达#!的部落永远无法在战斗中击败我们——这是我们双方都知道的事实——所以他们可能会直接臣服于我们？问问总无害……\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 qataba_task_27:0 "控制马可罗比亚"
 qataba_task_27_DESC:0 "#E 蓬特#!的海岸将是[ROOT.GetCountry.GetAdjective]领地的宝贵补充，原因众多——让我们不要延迟，立即占领该地区。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 qataba_task_28:0 "马可罗比亚事业"
 qataba_task_28_DESC:0 "正如承诺的那样，#T 马可罗比亚人#!的财富流入[ROOT.GetCountry.GetCapital.GetName]的国库，尽管人们普遍认为我们还可以做更多以增加利润。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 qataba_task_29:0 "龙血岛"
 qataba_task_29_DESC:0 "[GetProvince('(int32)7530').GetName]岛必须以某种方式臣服于我们的权威——准备我们的舰队，派往龙血岛。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 qataba_task_2_DESC:0 "如果我们想击败我们的对手，我们需要一支军队。一支强大的军队。一支能抵挡萨巴人任何攻击的军队！ \n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 qataba_task_3:0 "孤立萨巴"
 qataba_task_30:0 "寻找失落部落"
 qataba_task_30_DESC:0 "现在我们已进入#E 阿德#!部落的领地，我们该如何处理他们？ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 qataba_task_31:0 "以色列社区"
 qataba_task_31_DESC:0 "在[GetProvince('(int32)4667').GetArea.GetRegion.GetName]散布着许多#E 以色列#!飞地，很快[ROOT.GetCountry.GetName]将统治每一个。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 qataba_task_3_DESC:0 "为了促成萨巴王国的终结，如果没有其他领域干涉他们的利益会很有帮助。更好的是，我们应该寻找一些盟友，分担战斗的负担和我们将承受的损失。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 qataba_task_4:0 "摧毁萨巴"
 qataba_task_40:0 "乳香与没药"
 qataba_task_40_DESC:0 "我们的地区因两种贸易商品而闻名于世：奢华的乳香和没药。除了这两种珍贵的香料外，我们还生产其他地方找不到的香料。我们应采取一切必要措施尽可能多地生产这些商品。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 qataba_task_41:0 "贸易中心"
 qataba_task_41_DESC:0 "商人远道而来访问我们的市场，我们的沿海地区有潜力成为贸易中心。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 qataba_task_42:0 "主导市场"
 qataba_task_42_DESC:0 "我们已占据了我们在地区贸易中的应有地位——我们的声誉和国库呈指数增长！ \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 qataba_task_4_DESC:0 "打倒萨巴狗！我们将在他们的城市和定居点释放我们的军队，为过去的罪行复仇！ \n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 qataba_task_5:0 "卡塔巴的崛起"
 qataba_task_5_DESC:0 "推翻了老对手，我们的王国已升至阳光下的位置。诚然，这是一个炎热的位置，但终究是在阳光之下。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 qataba_task_6:0 "征服马因"
 qataba_task_6_DESC:0 "在这些时候，米奈人易如反掌，但要击败这些懦夫，我们需要尽可能多的士兵和金钱——我们对公平战斗不感兴趣。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 qataba_task_7:0 "神庙什一税"
 qataba_task_7_DESC:0 "虽然有些人抱怨必须向我们的神庙缴纳什一税，但我们还能如何让众神满意并带来他们的祝福？毕竟，生活中有些东西比金钱更有价值。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 qataba_task_8:0 "卡塔巴战士"
 qataba_task_8_DESC:0 "卡塔巴的战士凶猛、强大、独立！一旦他们完成训练，他们在战场上无人能敌！ \n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 qataba_task_9:0 "辉煌的[GetProvince('(int32)4662').GetName]"
 qataba_task_9_DESC:0 "[GetProvince('(int32)4662').GetName]，我们的首都，必须是我们领域的明珠，一座为尽可能多的人舒适生活而建的城市，因为这座城市只有一个目的：让所有前来向我们的[ROOT.GetCountry.GetRulerTitle]致敬的人印象深刻！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 road_network_s_arabia_tt:0 "#Y 道路网络#!将连接你沿海的主要贸易城市与内陆的贸易和生产城市。"
 sa_camel_archers_task_tt:0 "拥有一支至少有#Y 10#!个弓骑兵单位的军团"
 sa_camels_task_tt:0 "拥有一支至少有#Y 10#!个骆驼单位的军团"
 sa_task_1:0 "阿拉伯之梦"
 sa_task_10:0 "纳巴泰人"
 sa_task_10_DESC:0 "很久以前，我们首次与北方的纳巴泰人建立了贸易联系，自那次初步接触以来，我们一直渴望占有他们富裕的省份。现在，是时候对这个[ROOT.GetCountry.GetAdjective]国家的敌人开战了！ \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 sa_task_11:0 "纳巴泰石工技艺"
 sa_task_11_DESC:0 "虽然我们不习惯称赞最近征服的敌人，但不可否认纳巴泰人在建筑方面表现出色。如果我们接受他们的文化并在我们的社会中赋予他们权利，或许我们能说服他们的工程师透露他们的秘密？ \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 sa_task_12:0 "北部沙漠城市"
 sa_task_12_DESC:0 "虽然许多人想象阿拉伯是一片沙漠荒地，但在沙丘中散布着许多绿洲，这些绿洲随着时间推移已成长为强大的城市。我们不能允许对我们统治的任何抵抗，因此这些城市必须被征服。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 sa_task_13:0 "加固商队路线"
 sa_task_13_DESC:0 "[GetProvince('(int32)4721').GetName]是一座极为重要的城市，因为它控制着商队频繁往来的十字路口。我们必须通过加固这些贸易路线，表明我们在此地区的永久存在。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 sa_task_14:0 "扩展海岸线"
 sa_task_14_DESC:0 "在#Y [GetProvince('(int32)7519').GetName]#!的西侧，有一片海岸线，承诺可以轻松进入一个新市场。更远的内陆，我们将找到富裕的[GetCountry('AXM').GetName]国家，我们当然希望与之贸易。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 sa_task_15:0 "进入阿克苏姆"
 sa_task_15_DESC:0 "一旦我们确保了海岸，我们发现了内陆地区的真正财富。黄金、香料和许多其他财富在等着我们，凶猛的阿克苏姆人无法阻止我们。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil20!"
 sa_task_16:0 "非洲之角"
 sa_task_16_DESC:0 "#E 非洲之角#!是印度海上航线的战略位置。如果我们能以某种方式对通过的船只征收通行费…… \n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 sa_task_17:0 "非洲之角"
 sa_task_17_DESC:0 "任何男女都不得挑战我们对非洲之角的宣称！只有完全控制，我们才能保证贸易的最佳产出。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 sa_task_18:0 "阿拉伯王国"
 sa_task_18_DESC:0 "一个民族，一个王国，我们不都在同一旗帜下团结吗？ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 sa_task_19:0 "阿拉伯文化中心"
 sa_task_19_DESC:0 "南部王国长期以来在建筑方面表现出色，建造了许多建筑，但并非所有阿拉伯人在过去几个世纪都取得了这样的进步。\n\n现在我们是一个领域，许多人蜂拥而至来到我们的首都#Y [ROOT.GetCountry.GetCapital.GetName]#!。当他们离开时，访客们带着对宏伟和辉煌的印象回到他们的家乡，并在那里付诸实践；他们在这里看到的许多神庙或市场已被复制到其他地方……\n\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 sa_task_1_DESC:0 "为了让我们的梦想成为现实，我们必须征服南北两方的地区——#E 蓬特#!和整个#E 阿拉伯#!理应归我们所有！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 sa_task_2:0 "蓬特霸权"
 sa_task_20:0 "南部路线"
 sa_task_20_DESC:0 "让我们不要忽视南方的贸易机会。"
 sa_task_21:0 "阿克苏姆山地作战"
 sa_task_21_DESC:0 "阿克苏姆人居住的岩石地形使他们发展了特殊的军事战术——我们应该研究他们的作战方式，并将这些武术技巧融入我们自己的训练计划中。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 sa_task_22:0 "向北贸易"
 sa_task_22_DESC:0 "我们必须在每一个可能的方向上进行贸易。"
 sa_task_23:0 "穿越沙漠贸易"
 sa_task_23_DESC:0 "让我们不要忽视严酷的沙漠贸易路线。"
 sa_task_24:0 "东部港口"
 sa_task_24_DESC:0 "我们东部的许多重要港口应该被建设起来。"
 sa_task_25:0 "确保贸易路线"
 sa_task_25_DESC:0 "我们在整个[ROOT.GetCountry.GetName]建造的防御工事系统是防御节点，是我们安全的基础……但我们必须确保它们能被快速到达——我们需要道路。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 sa_task_26:0 "保护海上航线"
 sa_task_26_DESC:0 "现在我们有能力处理这个问题，我们必须保护我们的海上航线免受海盗威胁——那些该死的海盗试图在贸易路线上抢夺迷途的船只，我们不能容忍这种情况。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 sa_task_27:0 "非洲贸易"
 sa_task_27_DESC:0 "如果我们专注于发展我们的非洲贸易，那么整个[ROOT.GetCountry.GetAdjective]国家，无论是公民还是奴隶，都将受益。 \n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 sa_task_28:0 "希木叶尔叛乱"
 sa_task_28_DESC:0 "令人难以置信的消息！好战的#E 希木叶尔人#!，从未接受他们在[ROOT.GetCountry.GetName]内的地位，发动了一场威胁我们生活方式的叛乱！拿起武器！吹响战斗号角，准备作战！ \n\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 sa_task_29:0 "处理叛乱"
 sa_task_29_DESC:0 "现在我们已粉碎了不明智的希木叶尔叛乱，我们必须尽我们所能确保这种情况不再发生。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil15!"
 sa_task_2_DESC:0 "让整个[ROOT.GetCountry.GetName]欢庆，在[ROOT.GetCountry.GetCapital.GetName]举行庆典——我们已征服了#E 蓬特#!之地，确立了我们对被征服者的永恒霸权！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 sa_task_3:0 "统一阿拉伯福地"
 sa_task_30:0 "通往皇家大道"
 sa_task_30_DESC:0 "为了促进贸易商品的转移和缩短旅行时间，我们应将我们的高速公路系统连接到著名的#Y 亚历山大皇家大道#!。 \n\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 sa_task_31:0 "黄金摇篮"
 sa_task_31_DESC:0 "我们的国库急需在[GetProvince('(int32)8890').GetName]附近大量发现的黄金——让我们尽快在那里建设一座矿山。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 sa_task_32:0 "常备军"
 sa_task_32_DESC:0 "虽然我们的军队无人能敌，但通过建立一支常备军，我们将能够全年训练这些部队——我们有许多重要理由应该建立一支军团。 \n\n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 sa_task_33:0 "战骆驼"
 sa_task_33_DESC:0 "有什么动物能与骆驼相比？被称为沙漠之舟，能够长距离旅行而无需水——真是迷人的野兽。骆驼长期以来是我们军事力量的重要组成部分。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 sa_task_34:0 "骑兵射术"
 sa_task_34_DESC:0 "世界上一些最优良的骏马来自我们的领土，我们深知弓骑兵对敌军阵线的致命效果。我们必须为即将到来的战争准备我们的骑兵！ \n\n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 sa_task_35:0 "推进努比亚"
 sa_task_35_DESC:0 "#E 努比亚#!的土地在我们面前展开，邀请我们的军队越过边界，夺取他们想要的一切……\n\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 sa_task_36:0 "通往两河"
 sa_task_36_DESC:0 "一片古老的土地，声誉在几个世纪以来投下长长的阴影，就在我们的指尖之外……\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 sa_task_37:0 "改善马里卜大坝"
 sa_task_37_DESC:0 "即使我们将注意力集中在境外，我们也不能忽视#E 马里卜大坝#!。我们能做些什么来改善这座对我们人民如此重要、对我们生活方式至关重要的宏伟建筑？ \n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 sa_task_3_DESC:0 "我们胜利的军队完成了伟大的壮举，征服了#E 阿拉伯福地#!的分散部落，将该地区统一在[ROOT.GetCountry.GetAdjective]旗帜之下！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 sa_task_4:0 "征服沙漠部落"
 sa_task_4_DESC:0 "塔斯姆和贾迪斯部落的传统家园必须被置于我们的权威之下——我们不能允许这些凶猛的游牧民在阿拉伯内陆自由行动。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 sa_task_5:0 "整合沙漠战士"
 sa_task_5_DESC:0 "有人建议我们利用我们征服的塔斯姆战士的储备——他们的力量和战斗传统可以与我们自己的相结合，创造一支不可阻挡的军队。必须说，我们国家的传统主义者不希望看到这种情况发生……\n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 sa_task_6:0 "向北推进"
 sa_task_6_DESC:0 "我们不能让北方邻国的名声阻止我们追求我们所选择的事业——我们必须将他们驱逐出他们的定居点，将这些土地据为己有！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 sa_task_7:0 "黑石"
 sa_task_7_DESC:0 "有一件神圣的宝物，#Y 黑石#!，据说在被置于[GetProvince('(int32)7575').GetName]的圣地之前，从天上坠落到地球。我们必须为自己占有这份神圣的礼物！ \n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 sa_task_8:0 "扩展至俄马纳"
 sa_task_8_DESC:0 "我们的军队可以沿着海岸行进，或穿越阿拉伯内陆跋涉，但有一件事是肯定的：无论他们走哪条路线，我们的军队都将向俄马纳及其富裕的贸易港口进军。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 sa_task_9:0 "夺取革耳剌"
 sa_task_9_DESC:0 "是时候让我们的军队与革耳剌所能派出的力量一较高下了——我们将不休息，直到我们的士兵为我们夺取了富裕的[GetProvince('(int32)7202').GetName]岛！ \n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 sa_task_extra:0 "神庙什一税"
 sa_task_extra_DESC:0 "虽然有些人抱怨必须向我们的神庙缴纳什一税，但我们还能如何让众神满意并带来他们的祝福？毕竟，生活中有些东西比金钱更有价值。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 saba_admin_tt:0 "至少#Y 2#!个家族首领需拥有#Y 66#!忠诚度。统治者的家族不算在内。"
 saba_army_task_loc_1:0 "（#R [SCOPE.ScriptValue('saba_army_size_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('saba_army_size_total_svalue')|0]#!）"
 saba_army_task_loc_2:0 "（#Y [SCOPE.ScriptValue('saba_army_size_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('saba_army_size_total_svalue')|0]#!）"
 saba_decline_reduction_1_tt:0 "#Y 王国衰落#!将不再减少@stability! 稳定度！"
 saba_decline_reduction_2_tt:0 "#Y 王国衰落#!将不再减少@political_influence! 政治影响力和@corruption_icon! 腐败！"
 saba_decline_reduction_3_tt:0 "#Y 王国衰落#!将不再减少@discipline! 纪律！"
 saba_decline_reduction_4_tt:0 "#Y 王国复兴#!将取代#Y 王国衰落#!"
 saba_decline_tt:0 "随着你推进这个国家的使命树，此修正将#Y 逐渐#! #G 减弱#!。"
 saba_frankincense_and_myrrh_tt:0 "我们需生产至少#Y 10#!单位的@incense! 乳香、@myrrh! 没药和@spices! 香料总和。（#R [SCOPE.ScriptValue('saba_trade_goods_svalue')|0]#!/#Y 10#!）"
 saba_market_domination:0 "阿拉伯市场主导"
 saba_mission:0 "萨巴王国的复兴"
 saba_mission_BUTTON_TOOLTIP:0 "沙漏中的沙子几乎流尽，但我们仍在奋力前行！"
 saba_mission_CRITERIA_DESCRIPTION:0 "一旦我们阻止了衰落并重新确立我们的力量，这项任务将完成。"
 saba_mission_DESCRIPTION:0 "数百年前，我们的#E 萨巴#!王国是#E 阿拉伯半岛#!一隅的霸主；我们控制着阿拉伯湾的贸易路线，邻国被迫臣服于我们的权威……但那些日子早已远去。\n\n南北方的叛乱使我们昔日的附庸国#E 马因#!和#E 卡塔巴#!脱离了我们的控制，自那以后它们一直对我们施加压力。尽管前路充满未知的危险，我们不能继续这样下去；我们必须对抗历史的潮流，恢复我们国家的伟大！"
 saba_reformed_heritage:0 "萨巴复兴传承"
 saba_reformed_heritage_desc:0 "在改革王国并克服了所经历的困难后，萨巴王国不再是一个哀悼逝去时代的虚弱、衰落的残余，而是一个强大、为其传统和力量感到骄傲的领域。"
 saba_securing_neigh_tt:0 "我们的人口需超过所有邻国人口的总和。\n所有邻国人口：#R [SCOPE.ScriptValue('saba_neighbouring_countries_strength_svalue')|0]#!\n我们的人口：#Y [SCOPE.ScriptValue('saba_neighbouring_countries_strength_svalue_own_pop')|0]#!"
 saba_solomon_contact_tt:0 "我们将尝试与#Y 所罗门#!及其王国的后裔建立联系。"
 saba_task_0:0 "王国衰落"
 saba_task_0_DESC:0 "从各方面来看，我们的王国似乎正处于衰落之中——过去几百年，我们的力量和投射威力的能力已显著减弱。然而，一切尚未无望…… \n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 saba_task_1:0 "扩展首都"
 saba_task_1_DESC:0 "我们的首都，[GetProvince('(int32)4666').GetName]，需要一些修复，尤其是为我们人民供水的#E 马里卜大坝#!。[ROOT.GetCountry.GetRuler.GetName]必须优先恢复我们的城市！ \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 saba_task_2:0 "扩展灌溉网络"
 saba_task_20:0 "外向雄心"
 saba_task_20_DESC:0 "虽然我们国内有许多问题需要处理，但这并不意味着我们的雄心不向外扩展……\n在#E 阿拉伯福地#!有许多部落，我们很快将与之交锋。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 saba_task_21:0 "重新吸纳马因"
 saba_task_21_DESC:0 "一个多世纪前，#E 马因#!的背叛者驱逐了我们的士兵，宣布独立，许多人认为那是我们麻烦时期的真正开始。\n\n现在我们有能力纠正过去的错误，是时候重新吸纳他们了。 \n\n\n\n\n\n\n\n\n\n@egypt_mil5!"
 saba_task_22:0 "征服卡塔巴"
 saba_task_22_DESC:0 "是时候向南派遣我们的部队，进入暂时由#E 卡塔巴#!控制的丘陵地区——战斗的时刻已到！ \n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 saba_task_23:0 "北部边境"
 saba_task_23_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]最近难以入眠，[ROOT.GetCountry.GetRuler.GetHerHis]的心思集中在北部边境上——我们必须采取措施确保该地区的安全，以免被入侵军队措手不及。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 saba_task_24:0 "向东进发"
 saba_task_24_DESC:0 "东方的#E 哈德拉穆特#!居民以见风使舵著称，当政治上方便时便抛弃他们的神祇。让我们一劳永逸地平定这些异教徒。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 saba_task_25:0 "进入非洲"
 saba_task_25_DESC:0 "现在我们已征服了#E 非洲#!的部分地区，我们必须就该地区的未来进行重要讨论。\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 saba_task_26:0 "深入沙漠"
 saba_task_26_DESC:0 "生活在#E 金达#!的部落永远无法在战斗中击败我们——这是我们双方都知道的事实——所以他们可能会直接臣服于我们？问问总无害……\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 saba_task_27:0 "控制马可罗比亚"
 saba_task_27_DESC:0 "#E 蓬特#!的海岸将是[ROOT.GetCountry.GetAdjective]领地的宝贵补充，原因众多——让我们不要延迟，立即占领该地区。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 saba_task_28:0 "马可罗比亚事业"
 saba_task_28_DESC:0 "正如承诺的那样，#T 马可罗比亚人#!的财富流入[ROOT.GetCountry.GetCapital.GetName]的国库，尽管人们普遍认为我们还可以做更多以增加利润。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 saba_task_29:0 "龙血岛"
 saba_task_29_DESC:0 "[GetProvince('(int32)7530').GetName]岛必须以某种方式臣服于我们的权威——准备我们的舰队，派往龙血岛。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 saba_task_2_DESC:0 "#E 马里卜大坝水库#!是确保我们作物灌溉的关键，[GetProvince('(int32)4667').GetName]和[GetProvince('(int32)4665').GetName]的粮食生产领土将大大受益于扩展的灌溉网络。 \n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 saba_task_3:0 "神庙什一税"
 saba_task_30:0 "寻找失落部落"
 saba_task_30_DESC:0 "现在我们已进入#E 阿德#!部落的领地，我们该如何处理他们？ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil8!"
 saba_task_3_DESC:0 "虽然有些人抱怨必须向我们的神庙缴纳什一税，但我们还能如何让众神满意并带来他们的祝福？毕竟，生活中有些东西比金钱更有价值。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 saba_task_4:0 "以色列社区"
 saba_task_40:0 "乳香与没药"
 saba_task_40_DESC:0 "我们的地区因两种贸易商品而闻名于世：奢华的乳香和没药。除了这两种珍贵的香料外，我们还生产其他地方找不到的香料。我们应采取一切必要措施尽可能多地生产这些商品。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 saba_task_41:0 "贸易中心"
 saba_task_41_DESC:0 "商人远道而来访问我们的市场，我们的沿海地区有潜力成为贸易中心。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 saba_task_42:0 "主导市场"
 saba_task_42_DESC:0 "我们已占据了我们在地区贸易中的应有地位——我们的声誉和国库呈指数增长！ \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 saba_task_4_DESC:0 "在[GetProvince('(int32)4667').GetArea.GetRegion.GetName]散布着许多#E 以色列#!飞地，很快[ROOT.GetCountry.GetName]将统治每一个。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 saba_task_5:0 "扩展矿山"
 saba_task_50:0 "稳定王国"
 saba_task_50_DESC:0 "如果我们能减少激进扩张对我们王国的负面影响并提高内部稳定度，我们将走上摆脱当前困境的道路。 \n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 saba_task_51:0 "组建行政机构"
 saba_task_51_DESC:0 "我们的贵族阶层渴望看到[ROOT.GetCountry.GetName]的衰落命运扭转，愿意尽其所能帮助。我们应利用这些伟大家族尚未开发的潜力，组建一个由贵族成员组成的新行政机构。 \n\n\n\n\n\n\n\n\n\n@india_mil20!"
 saba_task_52:0 "改革军队"
 saba_task_52_DESC:0 "除非我们拥有一支适合我们将要进行的战争类型的改革军队，否则我们无法希望摆脱当前的困境。 \n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 saba_task_53:0 "强大的人口"
 saba_task_53_DESC:0 "我们需要依靠我们的人口优势来确保安全——我们的公民在我们的军队中作战，守卫我们的城墙，保持我们经济的运转。我们不能允许我们的敌人比我们更强！ \n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 saba_task_5_DESC:0 "远处山丘中的贵金属和宝石是我们[ROOT.GetCountry.GetAdjective]经济的宝贵财富来源，将极大地促进我们的经济。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 saba_task_6:0 "军事中心"
 saba_task_6_DESC:0 "[GetProvince('(int32)4682').GetName]的居民是坚强而好斗的人民；正是我们希望用于我们军队的那种人。让我们投资于他们的定居点，使整个[ROOT.GetCountry.GetName]受益。 \n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 saba_task_7:0 "所罗门王国"
 saba_task_7_DESC:0 "据说是有史以来最睿智的人#E 所罗门#!国王的故事并未被[ROOT.GetCountry.GetAdjective]国家遗忘，他们对这位受尊敬的统治者及其王朝怀有喜爱。 \n\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 saba_task_8:0 "王国崛起"
 saba_task_8_DESC:0 "我们的军事力量达到了历史最高点；这是[ROOT.GetCountry.GetRuler.GetName]努力将我们带到权力巅峰的证明！ \n\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 saba_trade_goods_value_tt:0 "我们需控制#Y 蓬特#!和#Y 阿拉伯福地#!区域至少#Y 60%#!的@incense! 乳香、@myrrh! 没药和@spices! 香料生产。（#R [SCOPE.ScriptValue('saba_trade_goods_svalue')|0]#!/#Y [SCOPE.ScriptValue('arabia_punt_trade_goods_svalue')|0]#!）"
 saba_units_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]的军队规模需至少为#Y 50#!。[SCOPE.GetRootScope.GetCountry.Custom('saba_army_task_loc')]"
 sabaean_administration:0 "萨巴行政"
 sabaean_judean_trade:0 "犹地亚-萨巴贸易关系"
 saban_trade_hub:0 "乳香与没药贸易中心"
 securing_naval_trade_routes:0 "确保海上航线"
 soqotra_vassal_release_tt:0 "我们可以将#Y 索科特拉#!释放为殖民地。"
 soqotra_vassal_tt:0 "[GetCountry('DIO').GetName]可能成为我们的附庸。"
 south_arabia.1.a:0 "我们的[ROOT.GetCountry.GetAdjective]甜瓜甜得令人难以置信——你必须尝一个"
 south_arabia.1.desc:0 "在穿越[ROOT.GetCountry.GetCapital.GetName]内地尘土飞扬的丘陵后，来到我们首都的访客常常惊讶于周围郁郁葱葱的农田——每个人都期待更多的沙漠，而不是灌溉充足的葡萄园和橄榄林。\n\n多亏了#E 马里卜大坝#!的生命之水，[ROOT.GetCountry.GetCapital.GetName]享有几乎全年的生长季节，确保附近生活的公民在市场上总能挑选到新鲜的水果和蔬菜。\n\n因此，听到城市自然增长的消息并不令人意外，全国各地的人们都在国家的首都定居。"
 south_arabia.1.t:0 "扩展的首都"
 south_arabia.10.a:0 "所有荣耀归于[ROOT.GetCountry.GetName]！万岁！"
 south_arabia.10.desc:0 "[ROOT.GetCountry.GetAdjective]人民历史上最甜美的胜利之一已经取得，这全都归功于[ROOT.GetCountry.GetRuler.GetName]的努力。我们的军队彻底击败了#E 卡塔巴#!，这个我们最古老的敌手之一。据说我们的军队带着病态的快感与阴暗的目的穿过其臣服的城市和定居点，给被击败且无力抵抗的敌人带来了无数最好不再复述的苦难。\n\n我们的历史充满了关于背信弃义的卡塔巴人以及两族斗争的故事，但这一切如今已不复存在。他们的王国根基建于沙土之上，我们已将他们的国王踏在脚下，并将他们的人民抛向四方。"
 south_arabia.10.t:0 "征服卡塔巴"
 south_arabia.100.a:0 "当然！我们当然是来帮忙的。"
 south_arabia.100.desc:0 "来自[GetProvince('(int32)4666').GetName]的紧急报告从四面八方涌来，惊恐的民众意识到#E 马里卜大坝#!出现了一道巨大的裂缝。我们必须介入，否则将面临重大灾难。"
 south_arabia.100.t:0 "大坝裂缝"
 south_arabia.1000.a:0 "愿我们能阻止我们的衰落。"
 south_arabia.1000.desc:0 "过去几个世纪，我们的王国在力量和影响力上持续衰落。大约两百年前，当#E 卡塔巴#!王国从我们手中脱离时，他们开始破坏我们在周边国家的地位，这对我们的国际关系造成了毁灭性影响。\n\n一百年前，北方的米奈人逃脱了我们的控制，似乎情况不可能更糟，但我们现在的地位与这些历史低点相比也好不到哪里去；我们的军队四分五裂，我们几乎没有行政机构，腐败在这个国家肆虐。\n\n如果我们不结束这一切荒唐之事，我们很快将成为仅存于记忆中的存在——这正是我们昔日的臣属如今的对手卡塔巴希望看到我们的地方……"
 south_arabia.1000.t:0 "萨巴的衰落"
 south_arabia.101.a:0 " Ugh，好的，好的……这真是糟糕的时机"
 south_arabia.101.desc:0 "该死！我们从[GetProvince('(int32)4666').GetName]的市民那里听说街道被淹——这是#E 马里卜大坝#!结构损坏迅速恶化的迹象。我们必须采取行动！一些人已溺亡，其他人正处于 immediate 危险中。"
 south_arabia.101.t:0 "大坝恶化"
 south_arabia.102.a:0 "我承诺很快、很快修复一切"
 south_arabia.102.desc:0 "哦不！来自[GetProvince('(int32)4666').GetName]的最新消息令人毛骨悚然。#E 马里卜大坝#!的一大段已断裂，冲毁了城市的整整四分之一。无数生命丧失，人们开始离开城市，认为它注定毁灭。"
 south_arabia.102.t:0 "大坝灾难"
 south_arabia.103.a:0 "希望我们还能修复剩下的部分……"
 south_arabia.103.desc:0 "我们向上天祈求怜悯，为[GetProvince('(int32)4666').GetName]的可怜人民祈祷，他们再次遭受了涉及#E 马里卜大坝#!的灾难。水位下降到农业失败的地步，导致城市大规模饥荒和死亡。更糟的是，洪水几乎未减退，街道上滞留的腐臭水开始传播疾病和痛苦。"
 south_arabia.103.t:0 "大坝死亡"
 south_arabia.11.a:0 "我们将通过向众神献祭来庆祝这一永恒的胜利！"
 south_arabia.11.desc:0 "我们的将军报告，#E 哈德拉穆特#!的军队已被逐出战场，如风中稻草般四散——[ROOT.GetCountry.GetAdjective]人民的领地不断扩张！战神祝福了我们的部队，为弱者带来了永恒的毁灭。"
 south_arabia.11.t:0 "东方之民"
 south_arabia.12.a:0 "这块石头因征服权归于萨巴！他们怎敢……"
 south_arabia.12.desc:0 "当我们凯旋的军队进入[GetProvince('(int32)8852').GetName]省，并将阿德驻军逐出绿洲城市时，一项重要发现出现了。\n\n虽然当地首领试图把一件宝物埋入地下以避开我们，但我方指挥将军锐利的目光识破了这场欺瞒，并要求将其挖出。\n\n尽管[ROOT.GetCountry.GetRuler.GetName]听闻此事后勃然大怒，但我们成功寻回#Y 阿德之石#!一事平息了[ROOT.GetCountry.GetRulerTitle]的怒火。"
 south_arabia.12.t:0 "失落部落"
 south_arabia.13.a:0 "假以时日，当地人将同化于我们优越的方式"
 south_arabia.13.b:0 "让我们整合阿瓦利提人"
 south_arabia.13.desc:0 "现在，我们胜利的部队已在#E 蓬特#!建立了滩头阵地，将我们的边界扩展到非洲本土，我们必须决定如何处理当地的#E 阿瓦利提人#!。\n\n是同化还是整合……两种方案都有充分的理由，但最终选择将交由[ROOT.GetCountry.GetRuler.GetName]决定。"
 south_arabia.13.t:0 "跨越海峡"
 south_arabia.14.a:0 "派外交官去，有好消息时通知我"
 south_arabia.14.b:0 "我已决定反对此事，不要再次问我"
 south_arabia.14.desc:0 "由于我们的人民与居住在[GetProvince('(int32)8682').GetName]城市的人民有许多相似之处，有人建议我们向他们提出请求，邀请他们成为我们的附庸。\n\n希望我们人民之间的联系足以说服他们的领导向我们臣服……问问总无害，对吧？"
 south_arabia.14.t:0 "萨巴城市沙尔考"
 south_arabia.15.a:0 "让我们同意他们的提议"
 south_arabia.15.b:0 "什么？绝不！多么荒谬的问题"
 south_arabia.15.desc:0 "我们收到了来自#E 萨巴王国#!的提议，他们正试图重塑其在世界舞台上的权威。\n\n自认为阿拉伯真正的主人，他们派来使者，要求我们作为附庸臣服于他们。\n\n作为效忠誓言的回报，他们承诺与我们分享繁荣，并保护我们免受敌人侵害。"
 south_arabia.15.t:0 "萨巴的提议"
 south_arabia.16.a:0 "我们将以美酒庆祝！"
 south_arabia.16.desc:0 "好消息，我的[ROOT.GetCountry.GetRulerTitle]！我们的外交官极具说服力……我们现又多了一个附庸国。"
 south_arabia.16.t:0 "萨巴的提议：结论"
 south_arabia.17.a:0 "我们的军队终有一天会踏上他们的土地……"
 south_arabia.17.desc:0 "好吧，我们的说服努力失败了。我们的外交官空手而归，尝试了一切可能的办法，却未能成功。"
 south_arabia.17.t:0 "萨巴的提议：结论"
 south_arabia.18.a:0 "无论如何，让我们看看会发生什么——发出正式提议"
 south_arabia.18.b:0 "再三考虑，我们不该这样做……时机未到"
 south_arabia.18.desc:0 "在秘密接触#E 金达部落#!的成员后，我们有理由相信他们可能会接受我们提出的附庸请求。\n\n总是渴望获取新领土，[ROOT.GetCountry.GetRuler.GetName]现在必须决定是否推行这一政策。"
 south_arabia.18.t:0 "金达部落"
 south_arabia.19.a:0 "让我们同意他们的提议"
 south_arabia.19.b:0 "什么？绝不！萨巴人疯了吗？"
 south_arabia.19.desc:0 "我们收到了来自#E 萨巴王国#!的提议，他们正试图重塑其在世界舞台上的权威。\n\n自认为阿拉伯真正的主人，他们派来使者，要求我们作为附庸臣服于他们。\n\n作为效忠誓言的回报，他们承诺与我们分享繁荣，并保护我们免受敌人侵害。"
 south_arabia.19.t:0 "萨巴的提议"
 south_arabia.2.a:0 "我们向众神祈祷，愿如此！"
 south_arabia.2.desc:0 "终于可以说，[ROOT.GetCountry.GetName]恢复了一段正常的时期——每个人在体验时都认为理所当然，但当国家遇到麻烦时，这是他们唯一迫切希望的。\n\n然而，[ROOT.GetCountry.GetRuler.GetName]似乎完成了不可能的事情，为一个长期感到破碎的国家带来了希望。\n\n在[ROOT.GetCountry.GetCapital.GetName]各处出现了即兴市场，越来越多的访客通过城门来交易和贸易——黑暗的日子可能已经结束了吗？"
 south_arabia.2.t:0 "稳定的领域"
 south_arabia.20.a:0 "我对这一胜利心存感恩……感谢我的大使们"
 south_arabia.20.desc:0 "今天是值得庆祝的一天——我们的外交官带回了最好的消息。"
 south_arabia.20.t:0 "萨巴的提议：结论"
 south_arabia.21.a:0 "暂时的阻碍，不会让我们停下太久……"
 south_arabia.21.desc:0 "尽管我们尽一切努力让交易更具吸引力，但我们的友好请求似乎被拒绝了——这个世界看来没有简单的事情。\n\n如果我们想吞并邻国的土地，那就得用老办法。"
 south_arabia.21.t:0 "萨巴的提议：结论"
 south_arabia.22.a:0 "打开国库，用我们的财富震撼他们"
 south_arabia.22.b:0 "或许我们该送点小礼物……"
 south_arabia.22.c:0 "萨巴的友谊已是足够的礼物"
 south_arabia.22.desc:0 "当我们的使者准备从[ROOT.GetCountry.GetCapital.GetName]出发前往#E 金达#!部落时，有人提议我们准备一些礼物，以使我们的提议更具吸引力。\n\n我们该怎么做，我的[ROOT.GetCountry.GetRulerTitle]？一如既往，这类决定由您来定。"
 south_arabia.22.t:0 "送给部落的礼物"
 south_arabia.23.a:0 "无论如何，派我们的船只前往岛上，看看会发生什么"
 south_arabia.23.b:0 "我们暂时不希望这样做"
 south_arabia.23.desc:0 "在[GetProvince('(int32)7530').GetName]附近旅行的商人谈到一个美丽的岛屿城市，那里有世界上其他地方找不到的稀有贸易商品。\n\n这些故事引起了[ROOT.GetCountry.GetRuler.GetName]的注意，[ROOT.GetCountry.GetRuler.GetSheHe]一直在考虑派遣外交官前往该岛，看看他们是否会和平臣服于我们。"
 south_arabia.23.t:0 "龙血岛"
 south_arabia.24.a:0 "让我们同意他们的要求"
 south_arabia.24.b:0 "萨巴人虽强，但我们不会臣服于他们"
 south_arabia.24.desc:0 "我们收到了来自#E 萨巴王国#!的提议，他们正试图重塑其在世界舞台上的权威。\n\n自认为阿拉伯真正的主人，他们派来使者，要求我们作为附庸臣服于他们。\n\n作为效忠誓言的回报，他们承诺与我们分享繁荣，并保护我们免受敌人侵害。"
 south_arabia.24.t:0 "萨巴的提议"
 south_arabia.25.a:0 "岛民们真是明智……"
 south_arabia.25.desc:0 "多么快乐的一天！在看到我们提议的好处后，[GetProvince('(int32)7530').GetName]立即同意成为我们的附庸。"
 south_arabia.25.t:0 "萨巴的提议：结论"
 south_arabia.26.a:0 "现在他们的儿女将有多少人在战斗中无谓牺牲？"
 south_arabia.26.desc:0 "您会失望地听到，#E 索科特拉人#!拒绝了我们的提议，声称他们宁愿看着家园沉入大海，也不愿让萨巴的总督统治他们。"
 south_arabia.26.t:0 "萨巴的提议：结论"
 south_arabia.27.a:0 "或许他们作为殖民地能最好地为我们服务"
 south_arabia.27.b:0 "荒谬——我们将直接管理他们"
 south_arabia.27.desc:0 "我们收到了来自[GetProvince('(int32)7530').GetName]的请求，询问我们是否愿意重新考虑之前谈判的条款。\n\n作为一个骄傲的民族，索科特拉人请求成为我们的殖民地——尽管他们承诺继续全心全意为我们服务，但他们希望拥有自主决策的权力。\n\n您对此有何看法，[ROOT.GetCountry.GetRuler.GetName]？"
 south_arabia.27.t:0 "龙血岛"
 south_arabia.28.a:0 "精彩，实在是精彩……"
 south_arabia.28.desc:0 "多亏了[ROOT.GetCountry.GetAdjective]国家的努力，我们大幅增加了从非洲之角的出口。\n\n该地区的生产从未如此出色，庞大的贸易船队从沿海城市向西和向东航行。\n\n毋庸置疑，我们的马可罗比亚事业带来了丰厚的回报，极大地提升了我们在这些地区的声誉。"
 south_arabia.28.t:0 "马可罗比亚事业"
 south_arabia.29.a:0 "我们感谢能一起做生意的机会"
 south_arabia.29.desc:0 "#E 蓬特#!的土地上居住着睿智而经验丰富的商人，这些有品味和阶级的人懂得如何赚钱——可以说是我们的天然同胞。\n\n这些公民不会将占领他们海岸的外国军队视为入侵者，而是视为在这个世界中前进的机会……他们是对的。"
 south_arabia.29.t:0 "控制马可罗比亚海岸"
 south_arabia.3.a:0 "这种大胆的行动正是[ROOT.GetCountry.GetName]所需的"
 south_arabia.3.desc:0 "虽然彻底改革[ROOT.GetCountry.GetAdjective]官僚体系是一项足以让大多数人因纯粹无聊而崩溃死去的任务，[ROOT.GetCountry.GetRuler.GetName]却以饱满热情投身这项艰巨工作，充分显示出[ROOT.GetCountry.GetRuler.GetHerHis]改革激情。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]对外交事务表现出敏锐体察，特意确保各大家族成员与[ROOT.GetCountry.GetRulerTitle]立场一致；如今这已办成，拟议举措也迅速推进。\n\n过去，国家在松散体系下运作，散布于[ROOT.GetCountry.GetName]各地的氏族只需参与战争。但这种强制性军事义务已经被更结构化的治理形式取代，而其中心位于[ROOT.GetCountry.GetCapital.GetName]。"
 south_arabia.3.t:0 "新的行政机构"
 south_arabia.30.a:0 "外国人的描述完美契合我们"
 south_arabia.30.desc:0 "据说，没有哪一株没药香料不曾经过[ROOT.GetCountry.GetAdjective]中间商之手，因为我们的商人和贸易者控制着这些昂贵商品的贸易。\n\n因此，我们在国外的声誉已与财富、奢华和精致品味画上等号。"
 south_arabia.30.t:0 "主导阿拉伯市场"
 south_arabia.31.a:0 "金币的芬芳气味……深深吸一口"
 south_arabia.31.desc:0 "两种最珍贵的香料——乳香和没药——在我们国家各地生产，却被全世界的寺庙祭司所渴望，无数信徒希望用甜美的烟雾取悦他们的神祇。\n\n作为精明的生意[ROOT.GetCountry.GetRuler.GetWomanMan]，[ROOT.GetCountry.GetRulerTitle]巩固了我们的[ROOT.GetCountry.GetAdjective]领地，囊括了大部分生产这些香料的地区，确保我们对这一稀有贸易商品的垄断。"
 south_arabia.31.t:0 "乳香与没药"
 south_arabia.32.a:0 "贸易商队必须尽快到达[ROOT.GetCountry.GetCapital.GetName]"
 south_arabia.32.desc:0 "毫不夸张地说，连接[ROOT.GetCountry.GetCapital.GetName]与海岸的道路完全由乳香和没药贸易的利润支付，这为[ROOT.GetCountry.GetAdjective]人民带来了无数财富。\n\n这一道路系统确保了首都在成为重要的区域贸易中心的核心地位——多亏了这项基础设施的改善，整个国家的生活正在改变。"
 south_arabia.32.t:0 "成为贸易枢纽"
 south_arabia.33.a:0 "利润才是最重要的。"
 south_arabia.33.b:0 "这个世界危机四伏，我们需要朋友。"
 south_arabia.33.c:0 "我想知道他们能揭示哪些神圣奥秘。"
 south_arabia.33.desc:0 "最近，一些以色列人开始与北方的希伯来王国贸易，因此变得相当富有。看到这一情况，一些顾问建议正式与该王国接触，意在分得新兴贸易的利润。\n\n一些顾问还将此视为在这个危险与欺诈的世界中寻找朋友的又一机会，建议与北方王国结盟。\n\n然而，最有趣的是以色列的宗教；它似乎如此……诱人。或许他们能在这方面帮助我们？\n\n无论如何，派遣使节是我们不能错过的机会。"
 south_arabia.33.t:0 "向北拓展"
 south_arabia.34.a:0 "贸易符合我们的最佳利益。"
 south_arabia.34.b:0 "我们允许贸易——但需支付一小笔费用。"
 south_arabia.34.c:0 "我们不需要他们定价过高的货物。"
 south_arabia.34.desc:0 "一位来自阿拉伯最南端的使者，从[GetCountry('SHB').GetName]王国抵达我们这里。使者带来了贸易提议，暗示可以以更优惠的价格获取昂贵的乳香和没药。任何反提议或拒绝都必须深思熟虑，因为这可能带来难以估量的财富。"
 south_arabia.34.t:0 "南方的贸易提议"
 south_arabia.35.a:0 "使者说得对。"
 south_arabia.35.b:0 "我们再看看——一小笔费用或许能说服我们。"
 south_arabia.35.c:0 "我们不需要所谓的‘朋友’。"
 south_arabia.35.desc:0 "一位来自阿拉伯最南端的使者，从[GetCountry('SHB').GetName]王国抵达我们这里，建议我们的文化建立更密切的关系，因为时代在变，危险无处不在。使者警告说，在这个时代无人安全，只有与朋友结盟才能度过这些动荡时期。"
 south_arabia.35.t:0 "萨巴使节"
 south_arabia.36.a:0 "我们不能拒绝一个追随正信的人。"
 south_arabia.36.b:0 "需支付费用！"
 south_arabia.36.c:0 "他们不是真正的信徒！"
 south_arabia.36.desc:0 "从遥远的南方，[GetCountry('SHB').GetName]王国传来消息，他们对我们的以色列宗教表示兴趣——但他们是真正的信徒吗？他们愿意相信吗？\n\n今晨，一位来自该国的使者抵达我们的宫廷，称其统治者请求我们的[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]派遣一些祭司，以确保他们以正确的方式遵循我们的宗教。他们声称我们的主召唤了他们，他们需要追随祂。"
 south_arabia.36.t:0 "宗教兴趣"
 south_arabia.37.a:0 "我们将以美酒庆祝这一时刻！"
 south_arabia.37.b:0 "如果需要，我们愿意支付"
 south_arabia.37.c:0 "抱歉，我不愿支付他们要求的费用"
 south_arabia.37.d:0 "我不在乎……我本来就没当真"
 south_arabia.37.desc_1:0 "我们的外交官报告，贸易谈判进展顺利，但我们的潜在伙伴要求一笔捐款，以示我们是认真的。\n\n过去，我们的前任政府曾做出未能兑现的承诺，现在我们的信誉受到质疑。"
 south_arabia.37.desc_2:0 "很遗憾地告诉您，我们试图在北方建立贸易联系的努力被拒绝了，没有给出真正令人满意的理由。\n\n至少我们的东道主慷慨地提供了时间和热情款待，他们真诚地祝愿我们未来好运。"
 south_arabia.37.desc_3:0 "好消息！我们外交官提出的所有建议都被接受，我们只需正式签署最终协议。这将极大提升[ROOT.GetCountry.GetRuler.GetName]的国际声望，[ROOT.GetCountry.GetRuler.GetSheHe]被誉为顶尖的交易者。"
 south_arabia.37.t:0 "回应"
 south_arabia.38.a:0 "告诉我们的新盟友，我们会守护他们的后方"
 south_arabia.38.b:0 "太好了……一切都会安排妥当"
 south_arabia.38.c:0 "我绝不会用金钱‘购买’友谊！"
 south_arabia.38.d:0 "好吧，那……我明白了"
 south_arabia.38.desc_1:0 "我们的使节报告，结盟是可能的，但我们的潜在伙伴想知道我们是否愿意说到做到——他们要求一笔微不足道的费用，但这让[ROOT.GetCountry.GetRuler.GetName]感到不悦。"
 south_arabia.38.desc_2:0 "您可能会愤怒地听到，哦[ROOT.GetCountry.GetRuler.GetName]，我们的外交官一抵达北方就被遣返了。我不想说以色列人一定很无礼，但他们显然对我们的论点毫无兴趣。\n\n不用说，我们短期内不会获得任何新盟友。"
 south_arabia.38.desc_3:0 "我们的外交官通知我们，我们提出的军事联盟已被欣然接受——这对[ROOT.GetCountry.GetName]来说是一次惊艳的外交胜利。"
 south_arabia.38.t:0 "回应"
 south_arabia.39.a:0 "重大消息！赞美以色列的神！"
 south_arabia.39.b:0 "一个人能为灵魂定价吗？我们愿意支付"
 south_arabia.39.c:0 "我绝不会为此类事情花钱……"
 south_arabia.39.d:0 "多么遗憾……"
 south_arabia.39.desc_1:0 "我们请求以色列宗教导师的请求已被批准，但他们要求我们支付旅行费用。从[GetProvince('(int32)687').GetName]到[ROOT.GetCountry.GetCapital.GetName]的道路可能充满危险，可能需要武装护送以确保拉比安全抵达我们的国家。"
 south_arabia.39.desc_2:0 "遗憾的是，我们收到以色列宗教领袖的消息，他们明确表示绝不会与我们这些蛮族异教徒分享他们的信仰。"
 south_arabia.39.desc_3:0 "今晨，一支奇特的队伍接近了[ROOT.GetCountry.GetCapital.GetName]的主城门——来自[GetProvince('(int32)687').GetName]的四十位贤者，受托执行在我国传播希伯来信仰的神圣使命。看来主听到了我们的祈求，奖励了我们的信仰之跃！"
 south_arabia.39.t:0 "回应"
 south_arabia.4.a:0 "很快，这支军队将对我们的敌人取得无数胜利"
 south_arabia.4.desc:0 "虽然进行全面军队改革所需的人力和军事知识投入巨大，但在[ROOT.GetCountry.GetRuler.GetName]的领导下，[ROOT.GetCountry.GetAdjective]人民成功地实现了又一个奇迹。\n\n现在，[ROOT.GetCountry.GetAdjective]军队已重组，严格的军事纪律取代了[ROOT.GetCountry.GetRuler.GetFirstName]到来前的腐败和松懈状态，国家站在了武力巅峰。"
 south_arabia.4.t:0 "军队改革"
 south_arabia.40.a:0 "我们完全接受他们的社区，赋予他们全部权利"
 south_arabia.40.b:0 "如果我们必须容忍他们的存在，那就这样吧"
 south_arabia.40.c:0 "驱逐所有以色列人，夺取他们的财富"
 south_arabia.40.desc:0 "过去几个月，[ROOT.GetCountry.GetRuler.GetName]忙于处理居住在[ROOT.GetCountry.GetName]的#E 以色列人#!，现在是时候对他们在我们王国中的未来做出永久决定。\n\n我们该如何处理他们的定居点？"
 south_arabia.40.t:0 "以色列社区"
 south_arabia.41.a:0 "事故时有发生，众所周知——驱散人群"
 south_arabia.41.b:0 "以色列人干的，即使不是他们，也该由他们背锅"
 south_arabia.41.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，今天我们有坏消息要分享——似乎一些纵火犯在作乱，[ROOT.GetCountry.GetCapital.GetName]的市场发生了大火，我们费尽全力才在火势蔓延前扑灭。\n\n幸好没有太多人丧生，但首都的居民已在寻找替罪羊。有丑闻流传，称我们中间的#E 以色列人#!引发了这场大火，烧毁区域已开始聚集暴民。"
 south_arabia.41.t:0 "市场火灾"
 south_arabia.42.a:0 "法律就是法律，窃贼必须受罚"
 south_arabia.42.b:0 "我们不保障宗教少数派的权利……或安全……"
 south_arabia.42.desc:0 "以色列社区的代表向[ROOT.GetCountry.GetRuler.GetName]提交了一份请愿书，要求在他们的定居点部署卫兵。\n\n似乎我们的一些[ROOT.GetCountry.GetAdjective]同胞侵犯了希伯来邻居的财产权，偷窃牲畜、家具甚至奴隶……凡是能搬走的东西都是目标。\n\n以色列社区的一些激进分子在煽动当地人，宣称[ROOT.GetCountry.GetName]没有正义可言，他们必须联合起来保护自己。\n\n以色列人拖来一名据称当场被抓的窃贼，指控他偷窃粮食，而此人当然否认。"
 south_arabia.42.t:0 "以色列社区的盗窃"
 south_arabia.43.a:0 "将逃犯交给以色列人，让他们处理"
 south_arabia.43.b:0 "释放被指控的人，夺取被害人的财产"
 south_arabia.43.desc:0 "威胁我们社区和平的可怕消息！以色列社区中最杰出的一员，[ROOT.GetCountry.GetRuler.GetName]曾在宴会上见过的一位当地公民，被发现死在自己的别墅里，破碎的身体布满刀伤和刺伤。\n\n片刻后，一名满身血污的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]部落青年被发现藏在附近的井中，引发了更大愤慨；不仅一位受人爱戴的人物被杀害，当地的水源也被仪式性地污染了。\n\n以色列人要求为死去的同胞伸张正义，这让[ROOT.GetCountry.GetRuler.GetFirstName]陷入两难。"
 south_arabia.43.t:0 "以色列名人被谋杀"
 south_arabia.44.a:0 "无论个人声望如何，腐败必须受到惩罚"
 south_arabia.44.b:0 "在萨巴，自由可以买到，尤其是对特权阶层"
 south_arabia.44.desc:0 "作为上层阶级的一员，稍许自我致富是常事，但不幸的是，[SCOPE.sCharacter('corrupt_guy_scope').GetName]做得太过火了，现在引发了投诉。特别是#E 以色列人#!对[SCOPE.sCharacter('corrupt_guy_scope').GetFirstName]尤为不满，指控[SCOPE.sCharacter('corrupt_guy_scope').GetHerHim]对他们的社区过度收费。他们现在要求我们惩罚这位腐败官员。"
 south_arabia.44.t:0 "以色列人的指控"
 south_arabia.45.a:0 "告诉社区他们必须分开居住"
 south_arabia.45.b:0 "我绝不允许以色列人攻击萨巴人！支持我们的人民"
 south_arabia.45.c:0 "为了和平，我们必须支持以色列人……"
 south_arabia.45.desc:0 "我们收到报告，居住在以色列社区的萨巴部落与他们发生了冲突，暴力可能失控。\n\n似乎宗教争论演变成了街头激战；犹太信徒前往他们的会堂时遭到石块袭击，随后棍棒和刀剑也出现了。\n\n双方都有人死亡，许多热血青年威胁要为倒下的同伴复仇。我们必须采取行动！"
 south_arabia.45.t:0 "街头斗殴"
 south_arabia.46.a:0 "教我一切，拉博尼，我的内心渴望答案"
 south_arabia.46.b:0 "不，我对改信其他信仰不感兴趣——让他走"
 south_arabia.46.desc:0 "因为我们允许以色列公民自由实践他们的信仰，我们赢得了这一社区的友谊，他们视我们为上天派来的又一位解放者，在他们需要时保护他们。\n\n一天下午，有人敲响了[ROOT.GetCountry.GetRuler.GetName]的房门，卫兵通知[ROOT.GetCountry.GetRuler.GetHerHim]，一位因慷慨和施舍而受赞誉的当地拉比来到[ROOT.GetCountry.GetCapital.GetName]，提出向我们的[ROOT.GetCountry.GetRulerTitle]传授他们的信仰教义。"
 south_arabia.46.t:0 "以色列信仰"
 south_arabia.47.a:0 "这些关于食物的讨论让我肚子咕咕叫了……我还没吃呢"
 south_arabia.47.desc:0 "我们很高兴地报告，与#E 马里卜大坝#!相连的灌溉网络已完工，[ROOT.GetCountry.GetRuler.GetName]提出的扩展工程已为[ROOT.GetCountry.GetCapital.GetName]周边乡村的新农场带来了更多的水源。\n\n每当我们的基础资源生产增加，总是一件喜事，我们首都的食品市场和储藏室很快将装满我们国家能生产的最优质最新鲜的货物。"
 south_arabia.47.t:0 "扩展灌溉网络"
 south_arabia.48.a:0 "有足够的财富可以分享"
 south_arabia.48.desc:0 "我们得天独厚，拥有人类因虚荣而渴望的宝贵自然资源；宝石、红宝石、钻石、黄金和白银。\n\n通过在[ROOT.GetCountry.GetName]各地建设矿山并专注于稳定的生产计划，我们的[ROOT.GetCountry.GetAdjective]商人正变得非常富有——我们正以精美珠宝供应商的身份闻名。"
 south_arabia.48.t:0 "扩展矿山"
 south_arabia.49.a:0 "你需要真正相信我在做的事情——信任我"
 south_arabia.49.desc:0 "历史上，[ROOT.GetCountry.GetName]的人民不以金币形式纳税，而是以实物履行义务，将各种货物和服务带到[ROOT.GetCountry.GetCapital.GetName]，这以意想不到的方式启发了我们的领袖。\n\n为了改变国内商业运作方式并获得众神的青睐，[ROOT.GetCountry.GetRuler.GetName]决定免除我们的神庙向[ROOT.GetCountry.GetName]纳税的义务，允许他们保留什一税用于任何他们认为合适的目的。\n\n虽然我们的财政底线会因此受损，但来自神圣的祝福将弥补我们遇到的任何短缺。"
 south_arabia.49.t:0 "神庙什一税"
 south_arabia.5.a:0 "你太过奖了——我只是在尽我的职责"
 south_arabia.5.desc:0 "终于，[ROOT.GetCountry.GetRuler.GetFirstName]的雄心恢复了[ROOT.GetCountry.GetName]，将国家从灾难边缘拉回，让骄傲的[ROOT.GetCountry.GetAdjective]人民再次昂首挺胸。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]不仅将我们的边境恢复到几个世纪未见的状态，我们的内部事务也从未达到如此水平——我们的[ROOT.GetCountry.GetAdjective]文化正进入一个#E 黄金时代#!，这一切都归功于一位[ROOT.GetCountry.GetRuler.GetWomanMan]——[ROOT.GetCountry.GetRuler.GetName]的努力。"
 south_arabia.5.t:0 "王国复兴"
 south_arabia.50.a:0 "来自萨那的战士将确保我们的国家安全"
 south_arabia.50.desc:0 "[GetProvince('(int32)4682').GetName]从一开始就被设计为一个专注于军事的城市——最早的城市建筑草图就在堡垒旁融入了一个训练营，这明确表明该省将成为我们招募和防御的重要组成部分。"
 south_arabia.50.t:0 "军事行动中心"
 south_arabia.51.a:0 "谁能否认[ROOT.GetCountry.GetName]已再次崛起为荣耀？"
 south_arabia.51.desc:0 "[ROOT.GetCountry.GetName]目前的状态在一两代人前难以想象，这主要得益于像[ROOT.GetCountry.GetRuler.GetName]这样的领袖，带领我们的人民度过了最黑暗的时刻。\n\n我们的人口激增，填充了新建的城市，商人和自由民齐聚一堂，一支重新找回昔日力量的强大军队维持着我们国家目前的和平与稳定。\n\n由于这些条件，我们的学者得以不受政治纷争的干扰，在[ROOT.GetCountry.GetCapital.GetName]的图书馆和讨论大厅成为造福整个国家的科学发现之地。"
 south_arabia.51.t:0 "再次崛起"
 south_arabia.52.a:0 "这就是你们很久以前对待我人民的方式……感觉如何？"
 south_arabia.52.desc:0 "[ROOT.GetCountry.GetRuler.GetName]养成了一个残酷的习惯，前往[ROOT.GetCountry.GetCapital.GetName]外的农场，观看昔日的萨巴贵族在田间劳作。倚靠在栅栏上，[ROOT.GetCountry.GetRulerTitle]停下来观察一个奴隶挣扎着清空一个双耳瓶，阴沉地轻笑。\n\n在过去的生活中，那人社交广泛，身着亚麻长袍，颈上挂着银链，但现在？烈日炙烤着他裸露的背部，背上布满监工棍棒留下的瘀伤，赤脚沾满泥土，肿胀不堪。"
 south_arabia.52.t:0 "击败对手"
 south_arabia.53.a:0 "我们希望他们作为附庸臣服于我们"
 south_arabia.53.b:0 "只有战争才有荣誉！"
 south_arabia.53.desc:0 "在近期成功的鼓舞下，是时候决定如何处理[GetCountry('MIN').GetName]——我们是请求他们和平臣服，还是给予所有反对[ROOT.GetCountry.GetName]的人同样的待遇？"
 south_arabia.53.t:0 "征服马因"
 south_arabia.54.a:0 "如果我处于他们的位置，我也早就臣服了"
 south_arabia.54.b:0 "我们期待彻底摧毁他们"
 south_arabia.54.desc_1:0 "我们向[GetCountry('MIN').GetName]的懦夫们发出了战争宣言，他们乞求我们重新考虑。在绝望中，他们提醒我们友好的关系和祖先的联系，但[ROOT.GetCountry.GetRuler.GetName]不为他们的论点所动，拒绝退让。"
 south_arabia.54.desc_2:0 "正如您所料，[ROOT.GetCountry.GetRuler.GetName]——面对选择时，[GetCountry('MIN').GetName]的精英们似乎决定保留他们的生活方式和特权。他们已将王国的控制权交给了我们，但请求我们温和地统治他们。"
 south_arabia.54.t:0 "征服马因"
 south_arabia.55.a:0 "愿#E 安巴伊#!与我们的军队同在，带来胜利！"
 south_arabia.55.desc:0 "我们的军事顾问完成了对我们部队的彻底检查，通知我们已为即将到来的冲突做好了准备；无论如何，我们已尽可能准备充分。\n\n现在是时候在世界舞台上重申[ROOT.GetCountry.GetName]的威严了！"
 south_arabia.55.t:0 "卡塔巴王国"
 south_arabia.56.a:0 "很快，我将把你们释放到#E 卡塔巴#!的敌人身上……耐心点"
 south_arabia.56.desc:0 "[ROOT.GetCountry.GetRuler.GetName]最近与军队一起训练，回到[ROOT.GetCountry.GetCapital.GetName]时，[ROOT.GetCountry.GetRuler.GetHerHis]的兴奋几乎无法抑制。\n\n我们的军队从未处于如此状态；我们的征召兵能够在战场上执行毁灭性的机动，这全都要归功于我们的[ROOT.GetCountry.GetRulerTitle]对军队改革的严格努力。"
 south_arabia.56.t:0 "强大的军队"
 south_arabia.57.a:0 "有朋友与你分享战斗的荣耀真是件好事"
 south_arabia.57.desc:0 "我们的使节带着好消息返回[ROOT.GetCountry.GetCapital.GetName]——似乎萨巴人多年来为自己树敌众多，我们新结交的朋友渴望看到傲慢的萨巴王国从高位跌落。\n\n多亏了我们秘密外交的努力，当对我们昔日主人的战争来临时，我们将有盟友可以召唤。"
 south_arabia.57.t:0 "外交孤立萨巴"
 south_arabia.58.a:0 "相信我，我们不会为他们流一滴泪"
 south_arabia.58.desc:0 "[ROOT.GetCountry.GetRuler.GetName]几乎无法相信正在发生的事情——在几个世纪的边境冲突和外交官之间的尖刻侮辱后，我们终于迈出了不可避免的一步，向[GetCountry('SHB').GetName]宣战。此刻，我们的部队正跨越他们的边界，渴望着激烈的战斗。\n\n数百年前，我们的祖先得以摆脱萨巴奴役的枷锁，但我们不会满足于半途而废……我们必须毫不停歇，直到萨巴被永远彻底摧毁。"
 south_arabia.58.t:0 "摧毁萨巴"
 south_arabia.59.a:0 "所有荣耀归于卡塔巴及其胜利的人民！"
 south_arabia.59.desc:0 "终于，我们驱逐了敌人，永远折断了他们的长矛——再也不会有人能强迫我们的[ROOT.GetCountry.GetAdjective]同胞沦为奴隶！\n\n我们的军队前所未有地奋战，为我们赢得了无数胜利。国内许多人相信，这些永恒的荣耀得益于[ROOT.GetCountry.GetRuler.GetName]的努力，[ROOT.GetCountry.GetRuler.GetHerHim]证明了自己是我们人民有史以来最好的统治者。"
 south_arabia.59.t:0 "卡塔巴的崛起"
 south_arabia.6.a:0 "#E 幸福阿拉伯#!属于[ROOT.GetCountry.GetAdjective]人！"
 south_arabia.6.desc:0 "[ROOT.GetCountry.GetRuler.GetName]长期主张通过奉行激进的外交政策改善[ROOT.GetCountry.GetName]的命运，现在是时候看看[ROOT.GetCountry.GetRuler.GetHerHis]的想法是否有价值了。\n\n经过短暂的准备，我们对#E 幸福阿拉伯#!的宣称已完成，使我们现在有理由肆意发动战争。"
 south_arabia.6.t:0 "外向雄心"
 south_arabia.60.a:0 "塔姆纳是阿拉伯的明珠，指引我们人民前进的明星"
 south_arabia.60.desc:0 "来到[GetProvince('(int32)4662').GetName]的访客常常对眼前的景象感到震惊，因为许多人愚蠢地认为阿拉伯平原无法支撑大型定居点。\n\n然而，在大理石街道上漫步一个下午，路边精心灌溉的花园飘来成熟水果的芬芳，旅行者可能舍不得离开塔姆纳——这里真是独一无二的地方。"
 south_arabia.60.t:0 "辉煌的塔姆纳"
 south_arabia.61.a:0 "卡塔巴的敌人若在战场上面对这些战士，必将悲惨！"
 south_arabia.61.desc:0 "随着我们的人力储备充足，征召兵规模达到一代人以来的最大，我们的军队在整个阿拉伯半岛上变得令人畏惧。\n\n据说，邻国听到我们的间谍报告我们的实力后，咬牙切齿，拔下胡须，因为他们知道自己的末日即将来临。"
 south_arabia.61.t:0 "卡塔巴的战士"
 south_arabia.62.a:0 "我们将征服所有挡在我们面前的人！"
 south_arabia.62.desc:0 "现在，[ROOT.GetCountry.GetRuler.GetName]为[ROOT.GetCountry.GetName]带来了和平与繁荣，我们的[ROOT.GetCountry.GetRulerTitle]不祥地宣布，我们将把注意力转向外部。\n\n对大片土地的宣称已准备就绪，覆盖从#E 蓬特#!到其余#E 阿拉伯#!的领土。我们的征召兵渴望掠夺邻国富饶的土地，已在练习进攻机动以作准备。"
 south_arabia.62.t:0 "阿拉伯之梦"
 south_arabia.63.a:0 "让我们在[ROOT.GetCountry.GetCapital.GetName]举行胜利游行庆祝！"
 south_arabia.63.desc:0 "终于，我们胜利的部队将整个#E 阿拉伯福地#!置于我们的[ROOT.GetCountry.GetAdjective]驻军的控制之下。\n\n虽然战斗本身令人难忘，但为沿海长段地区殖民所需的人口迁移努力也不容忽视。\n\n首都洋溢着欢腾的气氛，感恩与庆祝的精神正在传播，许多人聚集在街头，希望在[ROOT.GetCountry.GetRuler.GetName]返回城堡时一睹[ROOT.GetCountry.GetRuler.GetSheHe]的风采。"
 south_arabia.63.t:0 "统一阿拉伯福地"
 south_arabia.64.a:0 "我们表彰这些荣誉战士，致敬他们的忠诚"
 south_arabia.64.desc:0 "我们的[ROOT.GetCountry.GetAdjective]部队成功深入#E 阿拉伯#!内陆，驱逐了像魔鬼般奋战保卫家园的塔斯姆征召兵。\n\n[ROOT.GetCountry.GetRuler.GetName]被我们远亲为保护生活方式的英勇尝试所感动，特意缅怀这些英雄战士的牺牲，同时赞扬我们的部队所取得的成就。"
 south_arabia.64.t:0 "征服沙漠部落"
 south_arabia.65.a:0 "这只会增强我们的军事力量……忽略我们中的悲观者"
 south_arabia.65.desc:0 "我们对#E 塔斯姆#!的战役揭示了我们部队的一个可怕弱点；尽管我们的士兵装备更精良，塔斯姆征召兵利用当地地形，执行了我们目前未知的毁灭性战术。\n\n但这将会改变。意识到我们可以从被征服者中学到一二，[ROOT.GetCountry.GetRuler.GetName]接触了一些前将军，询问他们是否愿意训练我们的征召兵掌握这些特殊技巧。\n\n尽管我们的一些[ROOT.GetCountry.GetAdjective]部落长老抱怨所谓‘我们英雄军队的稀释’，我们的战士们为学习在沙漠丘陵中作战的方式感到兴奋。"
 south_arabia.65.t:0 "沙漠部落的战士"
 south_arabia.66.a:0 "但我仍不满足……"
 south_arabia.66.desc:0 "我们无与伦比的部队不可阻挡地向北推进，有条不紊地消灭和摧毁任何愚蠢试图阻止我们前进的敌人。曾经属于[GetCountry('LHY').GetName]和[GetCountry('THD').GetName]的土地现在飘扬着[ROOT.GetCountry.GetAdjective]的旗帜，奴隶和黄金源源不断地流入[ROOT.GetCountry.GetCapital.GetName]。"
 south_arabia.66.t:0 "向北推进"
 south_arabia.67.a:0 "我将扩建马卡拉巴的神庙，因为此地深受众神喜爱"
 south_arabia.67.desc:0 "多年来，[ROOT.GetCountry.GetRuler.GetName]听闻关于神秘宝物#Y 黑石#!的传说，它被保存在[GetProvince('(int32)7575').GetName]的圣地中，因此当有机会亲自访问这座神庙时，[ROOT.GetCountry.GetRuler.GetFirstName]迫不及待地抓住了机会。\n\n宗教热情席卷了[ROOT.GetCountry.GetRulerTitle]的心灵，[ROOT.GetCountry.GetRuler.GetSheHe]在礼拜场所感受到强烈的神圣气息，看到黑石时，[ROOT.GetCountry.GetRuler.GetHerHis]脊背一阵寒意——传说是真的吗？这块石头真的很久以前从天而降？\n\n[ROOT.GetCountry.GetRuler.GetFirstName]满意地点点头，对[ROOT.GetCountry.GetRuler.GetHerHim]自己低语，发出感恩的祈祷，并在此时此地立下誓言。"
 south_arabia.67.t:0 "卡巴的黑石"
 south_arabia.68.a:0 "一切为了[ROOT.GetCountry.GetAdjective]国家的更大荣耀"
 south_arabia.68.desc:0 "#E 俄马纳#!的土地上有许多城市和城镇，有些非常古老，足以与我们的故乡[ROOT.GetCountry.GetCapital.GetName]媲美声望。\n\n[ROOT.GetCountry.GetRuler.GetName]曾以为这些古老堡垒会为自由而更顽强地战斗，但事实并非如此——最终，他们的部队像之前的许多人一样倒下了。"
 south_arabia.68.t:0 "扩展至俄马纳"
 south_arabia.69.a:0 "美索不达米亚和波斯的城市将是下一个……"
 south_arabia.69.desc:0 "[ROOT.GetCountry.GetRuler.GetName]原本期待#E 革耳剌人#!会有更多抵抗，听说过他们的军事威力，但最终，他们像之前的许多人一样倒下了。\n\n我们胜利的军队夺取的最大战利品之一是[GetProvince('(int32)7202').GetName]岛——这个极其富裕的港口岛屿很快将成为我们在#E 波斯湾#!最重要的[ROOT.GetCountry.GetAdjective]前哨之一。"
 south_arabia.69.t:0 "夺取革耳剌"
 south_arabia.7.a:0 "我们才刚刚开始战斗……"
 south_arabia.7.desc:0 "不可否认，[ROOT.GetCountry.GetName]在过去两百年里一直处于衰落和腐朽之中，甚至在此之前，腐烂的症状就已经出现。\n\n如果情况不迅速改变，已经岌岌可危的局势可能会变得更糟。\n\n幸好，[ROOT.GetCountry.GetRuler.GetName]发誓要为[ROOT.GetCountry.GetAdjective]人民带来更好的日子，虽然我们的一些同胞已失去希望，但许多人相信[ROOT.GetCountry.GetRuler.GetFirstName]会救我们。"
 south_arabia.7.t:0 "王国衰落"
 south_arabia.70.a:0 "当太阳从西边升起，月亮落入大海之时……"
 south_arabia.70.desc:0 "纳巴泰人的首都[GetProvince('(int32)729').GetName]已落入[ROOT.GetCountry.GetAdjective]军队的压倒性力量之下，他们对敌人毫不留情，在北方人的定居点和城镇中尽情发泄他们的嗜血欲望。\n\n恐惧的涟漪传遍西奈，深入黎凡特和非洲海岸——[ROOT.GetCountry.GetName]何时会停止他们的侵略战争？"
 south_arabia.70.t:0 "纳巴泰人"
 south_arabia.71.a:0 "我们建筑风格的融合将创造出新的奇妙之物"
 south_arabia.71.desc:0 "现在我们通过努力将纳巴泰文化融入我们自己的文化，获得了纳巴泰建筑师的记录，我们立即着手研究他们的建筑方法。\n\n我们的工程师已采用了一些纳巴泰大师使用的特定技术，尽管不情愿地承认这些技术优于我们自己的[ROOT.GetCountry.GetAdjective]方式。"
 south_arabia.71.t:0 "纳巴泰石工技艺"
 south_arabia.72.a:0 "他们迟早会适应这些变化……他们总是会的"
 south_arabia.72.desc:0 "我们的征召兵冒险前往比以往任何时候都更远的地方，征服了#E 阿拉伯#!的十字路口，将这些遥远之地加入不断扩张的[ROOT.GetCountry.GetAdjective]霸权。\n\n我们夺取了沿路的贸易城市，这些城市以剥削旅行者而闻名，就像骆驼腹部的虱子。但再也不会了！骄傲的[GetProvince('(int32)4721').GetName]和[GetProvince('(int32)8815').GetName]已沦陷，他们的伟大子嗣已被击败！"
 south_arabia.72.t:0 "北部沙漠城市"
 south_arabia.73.a:0 "投资于防御工事确实是明智的决定"
 south_arabia.73.desc:0 "商人和旅行者穿过尘土飞扬的十字路口时，常常前往[GetProvince('(int32)4721').GetName]的城墙寻求安全，知道热食和热水澡洗去沙漠沙尘只是城中众多乐趣之一。\n\n因为[ROOT.GetCountry.GetName]几乎保证了未经其明确许可无人能通过该地区，曾经是匪徒从沙丘袭击的无法无天之路，如今已成为对所有人安全可靠的地方。"
 south_arabia.73.t:0 "加固商队路线"
 south_arabia.74.a:0 "让我们乘着这股势头迎接下一场战争！"
 south_arabia.74.desc:0 "多亏了我们在#E 蓬特#!各地取得的振奋人心的胜利，军队士气从未如此高涨，我们的征召兵不再逃避职责，反而渴望战斗的刺激！\n\n近期该地区大量高薪雇佣兵的存在确保我们的市场有充足的金币流通，这让我们的公民感到快乐，愿意忘记最近的冲突。"
 south_arabia.74.t:0 "蓬特霸权"
 south_arabia.75.a:0 "愚蠢到底……"
 south_arabia.75.desc:0 "据说我们的部队让#E 特尼西斯#!地区的居民措手不及，他们不知为何认为自己能免受我们前进军队的威胁。\n\n由于未能组织足够的防御，他们的士兵在我们面前崩溃，最终向我们的国家交出了自由和财富。"
 south_arabia.75.t:0 "扩展海岸线"
 south_arabia.76.a:0 "他们的这种假设完全正确，顺便说一句"
 south_arabia.76.desc:0 "现在，某种奇迹救援部队出现的希望正在消退，我们最近征服的阿克苏姆人开始恢复正常生活。一些人甚至放弃了自己的方式，决定在这个他们生活的新世界中，与我们合作是最好的出路。"
 south_arabia.76.t:0 "进入阿克苏姆"
 south_arabia.77.a:0 "如果非洲有任何变化，及时通知我"
 south_arabia.77.desc:0 "我们很高兴地通知您，哦[ROOT.GetCountry.GetRuler.GetName]，我们在#E 非洲之角#!的殖民努力进展顺利，我们的定居者报告他们对新家感到满意。当地人对[ROOT.GetCountry.GetAdjective]的涌入反应良好，尽管这随时可能改变。"
 south_arabia.77.t:0 "深入非洲之角"
 south_arabia.78.a:0 "我们值得接受的礼物……"
 south_arabia.78.desc:0 "我们通过殖民#E 非洲之角#!的荒凉之地发了大财，无意中创建了一条新的贸易路线。对我们的人民来说是多么快乐的一天！上天对我们微笑，赐予我们神圣的祝福。"
 south_arabia.78.t:0 "非洲之角"
 south_arabia.79.a:0 "所有荣耀归于[ROOT.GetCountry.GetName]——我们永不失败！"
 south_arabia.79.desc:0 "天空中出现了一颗新星，闪耀着千颗烈日的光芒，威胁着比太阳本身更耀眼。\n\n这一刻早在远古时代就被沙漠先知预言；#E 阿拉伯#!的形成，一个将战胜所有其他王国的国度。"
 south_arabia.79.t:0 "阿拉伯王国"
 south_arabia.8.a:0 "我希望我们祖先的灵魂能因我们的成就安息"
 south_arabia.8.desc:0 "很久以前，我们的祖先允许#E 马因#!脱离，带走了我们控制的宝贵贸易港口，将兄弟变成政治背叛中的敌人，这一严重罪行得以发生。\n\n从今天起，我们可以说这一巨大错误已得到纠正；我们要感谢[ROOT.GetCountry.GetRuler.GetName]对这些叛乱败类的惊人胜利，他们现已在我们的军队手中迎来了末日。\n\n因为我们的邻国承认我们对这些沿海领土的历史宣称，或许更重要的是，我们的公民也是如此，每个人都愿意原谅我们的激进行动——这是军事胜利之上的外交成功。"
 south_arabia.8.t:0 "吸纳马因"
 south_arabia.80.a:0 "我们邀请您来此小住，体验我们的好客"
 south_arabia.80.desc:0 "虽然我们中的旅行达人喜欢吹嘘他们到过的著名地方，如[GetProvince('(int32)516').GetName]或[GetProvince('(int32)416').GetName]，许多人也将[ROOT.GetCountry.GetCapital.GetName]与这些地方相提并论。\n\n多年来，我们的首都已与世界上许多传奇城市平起平坐，所有人都承认我们的城市是阿拉伯文化的中心。"
 south_arabia.80.t:0 "阿拉伯文化中心"
 south_arabia.81.a:0 "我们必须确保[ROOT.GetCountry.GetName]的所有地区都得到照料"
 south_arabia.81.desc:0 "作为[ROOT.GetCountry.GetAdjective]人民的忠实管家，[ROOT.GetCountry.GetRuler.GetName]确保我们国家的每个角落都得到同等关注，而不像一些人只关注[ROOT.GetCountry.GetName]更富裕和人口稠密的地区，我们的[ROOT.GetCountry.GetRulerTitle]与众不同。\n\n以南方贸易路线为例，这是[ROOT.GetCountry.GetRuler.GetFirstName]慷慨行动的典范；即使这些荒凉之地也不被遗忘。"
 south_arabia.81.t:0 "南方贸易路线"
 south_arabia.82.a:0 "相信我，这一切都是为了我们人民的福祉"
 south_arabia.82.desc:0 "我们的行军士兵长队延伸至地平线之外，他们疲惫的脚步敲出稳定的节奏，前往#E 阿克苏姆#!的荒地。\n\n我们的士兵注定要在艰难的乡村进行军事编队训练，尽管许多人在抱怨，但无人敢大声抗议，因为[ROOT.GetCountry.GetRuler.GetName]施加的军事纪律严厉而无情。"
 south_arabia.82.t:0 "阿克苏姆山地作战训练"
 south_arabia.83.a:0 "很好……在你打扰我之前我在做什么？"
 south_arabia.83.desc:0 "我不会浪费您太多时间，[ROOT.GetCountry.GetRuler.GetName]，但一个简讯：多亏您在该地区发展经济的努力，北方贸易路线正在蓬勃发展。"
 south_arabia.83.t:0 "向北贸易"
 south_arabia.84.a:0 "当前的短缺最终会得到解决，不必担心"
 south_arabia.84.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的市场上，除非愿意支付高价，否则很难买到骆驼——这是我们国家贸易蓬勃发展的不幸副作用。\n\n由于穿越尘土荒地的贸易路线建立，对所谓‘沙漠之舟’的需求飙升至前所未有的水平。"
 south_arabia.84.t:0 "穿越沙漠贸易"
 south_arabia.85.a:0 "这些人不也是[ROOT.GetCountry.GetAdjective]人，就像我们一样吗？"
 south_arabia.85.desc:0 "虽然我们与阿拉伯湾保持着历史联系，但这并不意味着我们忽视了波斯湾的富饶水域；事实上恰恰相反。\n\n总是渴望为[ROOT.GetCountry.GetName]的人民创造更好的生活，[ROOT.GetCountry.GetRuler.GetName]在建设我们东部港口基础设施方面表现出色。"
 south_arabia.85.t:0 "东部港口"
 south_arabia.86.a:0 "在[ROOT.GetCountry.GetName]旅行是完全安全的"
 south_arabia.86.desc:0 "投资者和投机者对他们的金钱极为敏感——这一点与[ROOT.GetCountry.GetRuler.GetName]不谋而合。考虑到这一点，我们的[ROOT.GetCountry.GetRulerTitle]致力于建立保护贸易路线的防御工事网络，希望这一明确承诺不会被忽视，以保障他们的底线。"
 south_arabia.86.t:0 "确保陆上贸易路线"
 south_arabia.87.a:0 "看到你脸色发绿我很抱歉……喝口水吧"
 south_arabia.87.desc:0 "海上旅行本身已足够压力，离开港口的安全怀抱后，人们完全暴露在自然的任性之下，遭遇海盗的经历更是雪上加霜。\n\n但[ROOT.GetCountry.GetAdjective]海军在保护他们控制的海上航线方面表现出色，现在水手最大的烦恼只是晕船。"
 south_arabia.87.t:0 "保护海上航线"
 south_arabia.88.a:0 "香水、香料、最精美的黄金珠宝……我们应有尽有"
 south_arabia.88.desc:0 "在非洲之角的[ROOT.GetCountry.GetAdjective]庄园生产的珍馐被小心装上贸易船，可能驶向遥远的#E 马尔代夫#!岛屿，或者转向北方，最终目的地是[GetProvince('(int32)516').GetName]的市场。\n\n我们的奢侈品覆盖范围广泛，证明了我们的独创性，因为有钱人最渴望我们的商品。"
 south_arabia.88.t:0 "非洲贸易"
 south_arabia.89.a:0 "我将取下你的头颅，[SCOPE.sCharacter('new_ruler').GetFirstName]，并将其展示在我的首都之上！"
 south_arabia.89.b:0 "#E 我们将切换国家，扮演#! #T 希木叶尔#!。"
 south_arabia.89.desc:0 "毁灭性的消息！似乎在[ROOT.GetCountry.GetRuler.GetName]外出征战时，国内酝酿了一场秘密阴谋。一大群不满的部落民聚集在#E 希木叶尔人#!的旗帜下，由[SCOPE.sCharacter('new_ruler').GetName]领导，承诺推翻[ROOT.GetCountry.GetRuler.GetFirstName]，恢复我们人民的传统方式。\n\n叛军近一年来一直在秘密收集金币和武器，并在午夜发动叛乱，迅速在未曾预料的地方获得支持。我们面临着生死之战！"
 south_arabia.89.t:0 "希木叶尔叛乱"
 south_arabia.9.a:0 "我们的堡垒将保护我们——这些城墙永不倒塌"
 south_arabia.9.desc:0 "为了[ROOT.GetCountry.GetAdjective]国家的和平与稳定，所有人都知道[ROOT.GetCountry.GetRuler.GetName]对此问题极为重视，不断策划各种方法以确保现状不变。\n\n在北部修建防御工事是[ROOT.GetCountry.GetRulerTitle]保护[ROOT.GetCountry.GetName]的方式之一，我们的警戒部队始终在边境巡逻——敌军若想接近[ROOT.GetCountry.GetCapital.GetName]，必将遭遇强烈抵抗。"
 south_arabia.9.t:0 "确保北部边境"
 south_arabia.90.a:0 "任何走上叛国之路的人都将面临同样的命运……"
 south_arabia.90.desc:0 "太阳刚从[ROOT.GetCountry.GetCapital.GetName]升起，但[ROOT.GetCountry.GetRuler.GetName]已走向城门，嘴唇紧抿。\n\n在城门上方，#E 希木叶尔叛乱#!领袖的断头被长矛刺穿，下颌缺失使得头颅显得恐怖。一群苍蝇覆盖着头骨，沙漠的酷热空气中弥漫着腐烂尸体的恶臭，[ROOT.GetCountry.GetRuler.GetFirstName]厌恶地用布捂住[ROOT.GetCountry.GetRuler.GetHerHis]的嘴。\n\n向卫兵示意，[ROOT.GetCountry.GetRuler.GetFirstName]命令取下头颅，片刻后它被放入陶瓷盒中。这项可怕的工作完成后，[ROOT.GetCountry.GetRulerTitle]紧握盒子返回宫殿。"
 south_arabia.90.t:0 "平叛"
 south_arabia.91.a:0 "或许有一天我将亲自走这条路……"
 south_arabia.91.desc:0 "穿越[GetProvince('(int32)700').GetName]沙漠丘陵的艰难旅程不再阻碍我们的商队，因为连接我们网络与著名的#E 亚历山大皇家大道#!的道路终于连通。\n\n许多旅行者讲述了一个熟悉的故事，这对[ROOT.GetCountry.GetRuler.GetName]来说是美妙的音乐；从[GetProvince('(int32)729').GetName]到[GetProvince('(int32)659').GetName]的旅程现在变得愉快，沿途有许多路边酒肆和客栈，使旅行变得惬意。"
 south_arabia.91.t:0 "通往皇家大道"
 south_arabia.92.a:0 "我不在乎有多少人在矿山中丧生……我只想要黄金"
 south_arabia.92.desc:0 "[GetProvince('(int32)8890').GetName]迅速成为我们国家最重要的采矿点之一，无疑是因为我们每天从山丘中提取的大量黄金。\n\n意识到这座矿山对我们持续繁荣的重要性，[ROOT.GetCountry.GetRuler.GetName]命令该省当局不惜一切代价完成配额。"
 south_arabia.92.t:0 "黄金摇篮"
 south_arabia.93.a:0 "这支军队是我们自由的真正基石"
 south_arabia.93.desc:0 "可以说，过去几十年[ROOT.GetCountry.GetAdjective]社会变得更加尚武，军事美德受到所有阶层的赞扬。\n\n我们的军队规模多年来大幅增长，无疑在[ROOT.GetCountry.GetCapital.GetName]的政治事务中投下了长长的阴影……"
 south_arabia.93.t:0 "常备军"
 south_arabia.94.a:0 "低估骆驼，你将自食其果！"
 south_arabia.94.desc:0 "虽然有人嘲笑骆驼冲锋陷阵的场景，但当我们的骑兵冲击他们的阵线时，他们的笑声变成了极度恐惧的尖叫。\n\n多亏了我们的战骆驼接受的专门训练，我们的骑兵单位据说在许多艰难的战斗中是决定性因素。"
 south_arabia.94.t:0 "战骆驼"
 south_arabia.95.a:0 "若想活命，投降！你无法逃离我的战马"
 south_arabia.95.desc:0 "数百匹马蹄敲打出致命节奏的声音，是敌人得到的第一个，有时是唯一的信号，随后空中充满了成千上万的飞箭。片刻后，飞箭的轰鸣声变得震耳欲聋，左右穿梭，如苍蝇般击倒敌人。没有逃脱，只有从远处袭来的死亡。\n\n我们的弓骑兵确实是噩梦般的存在。"
 south_arabia.95.t:0 "骑兵作战"
 south_arabia.96.a:0 "努比亚人终将倒在我们面前！"
 south_arabia.96.desc:0 "我们必须追随自然边界的指引，即使这让我们与同样强大的民族发生冲突。\n\n非洲的征召兵和军团将集结，拼命希望阻止我们的入侵，但在[ROOT.GetCountry.GetRuler.GetName]眼中，这已是定局。"
 south_arabia.96.t:0 "推进努比亚"
 south_arabia.97.a:0 "我们的成就引领我们走到了历史的巅峰时刻"
 south_arabia.97.desc:0 "[ROOT.GetCountry.GetRuler.GetName]的愿景再清晰不过——我们在世界舞台上的最终宣言。还有什么比夺取#E 美索不达米亚#!更好的方式来宣告我们的崛起？我们的军队进军[GetProvince('(int32)918').GetName]的想法令人激动，[ROOT.GetCountry.GetRuler.GetFirstName]越思考此事，越确信别无他路——我们必须前往两河流域并夺取它。"
 south_arabia.97.t:0 "通往两河"
 south_arabia.98.a:0 "让我们不要说出这样的话去挑战命运……"
 south_arabia.98.desc:0 "[GetProvince('(int32)4666').GetName]最美丽的地方之一在城市最高点的神庙附近，从那里可以俯瞰#E 马里卜大坝#!的宁静水面，看到环绕其四周的萨巴城市全景——真是令人叹为观止的体验。\n\n多亏了最近的改善工程，大坝本身将为城市提供数个世纪的支撑。"
 south_arabia.98.t:0 "改善马里卜大坝"
 south_arabia.99.a:0 "他们在这里受到欢迎……告诉他们都回家了"
 south_arabia.99.desc:0 "今晨，[GetProvince('(int32)687').GetName]城门外出现了一幕令人怜悯的景象，一长队难民向城市行进。首次看到城墙时，他们喜极而泣，冲向城门，向外面的卫兵诉说他们的悲惨故事。\n\n似乎#E 阿拉伯#!崛起了一股对我们人民不友好的力量。"
 south_arabia.99.t:0 "阿拉伯难民"
 south_arabia_mission:0 "阿拉伯之梦"
 south_arabia_mission_BUTTON_TOOLTIP:0 "是时候建立一个经济帝国，一个目前仅存在于我们梦想中的帝国……"
 south_arabia_mission_CRITERIA_DESCRIPTION:0 "一旦我们控制了#Y 非洲之角#!并建立了#Y 阿拉伯#!，这项任务将视为完成。"
 south_arabia_mission_DESCRIPTION:0 "没药、乳香、香料、银和金——我们领域内流通着令人难以想象的高端贸易商品，孕育了我们的梦想：富有到让众神都嫉妒。"
 south_arabian_capital_pmod:0 "辉煌的首都"
 supremacy_punt:0 "蓬特霸权"
 temple_tithe_south_arabia:0 "神庙什一税"
 treasury_marib_damage_tt:0 "国库中需至少有#Y [SCOPE.ScriptValue('marib_damage_svalue')|0]#!金币。"
 war_camels:0 "战骆驼"
 war_main_happened_tt:0 "已发生：以#Y 征服[GetProvince('(int32)4674').GetName]#!为战争目标，对#Y 马因#!宣#R 战#!。"
 warriors_of_qataba:0 "卡塔巴战士"
 will_lead_to_alliance_tt:0 "这可能带来与#Y 犹地亚#!的#Y 同盟#!。"
 will_lead_to_conversion_tt:0 "这可能导致我们的人民皈依#Y 以色列#!信仰。"
 will_lead_to_more_money_tt:0 "这可能通过贸易带来#G 更多#! #Y 财富#!。"

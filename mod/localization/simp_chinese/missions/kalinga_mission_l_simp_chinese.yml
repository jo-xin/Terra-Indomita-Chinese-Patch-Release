l_simp_chinese:
 KALINGAN_EMPIRE:0 "羯陵伽帝国"
 coastal_capital:0 "沿海首都"
 happy_andhran_kalinga:0 "羯陵伽的仁慈"
 jungle_capital:0 "丛林之都"
 kalinga_defeat_south_rivals:0 "南方的宿敌战败"
 kalinga_developed_agriculture:0 "发达的农业"
 kalinga_missions:0 "羯陵伽之王"
 kalinga_missions_BUTTON_TOOLTIP:0 "羯陵伽还没有完成！"
 kalinga_missions_CRITERIA_DESCRIPTION:0 "当你控制了印度南部时，该使命完成。"
 kalinga_missions_DESCRIPTION:0 "我们的王国位于世界的最边缘，许多人甚至不知道我们的存在。但印度正在酝酿麻烦。在北方，不断壮大的孔雀王朝威胁着我们。以我们目前的状态，还没有强大到足以与他们竞争。如果我们想在这个艰难的时期生存下去，我们只能向南寻求扩张。"
 kalinga_missions_task_1:0 "拥抱佛教"
 kalinga_missions_task_10:0 "保护海外贸易路线"
 kalinga_missions_task_10_1_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('kalinga_missions_task_10_1_current')|0]#!"
 kalinga_missions_task_10_1_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('kalinga_missions_task_10_1_current')|0]#!"
 kalinga_missions_task_10_2_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('kalinga_missions_task_10_2_current')|0]#!"
 kalinga_missions_task_10_2_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('kalinga_missions_task_10_2_current')|0]#!"
 kalinga_missions_task_10_3_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('kalinga_missions_task_10_3_current')|0]#!"
 kalinga_missions_task_10_3_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('kalinga_missions_task_10_3_current')|0]#!"
 kalinga_missions_task_10_4_allow_sv_complete:0 "#Y [SCOPE.ScriptValue('kalinga_missions_task_10_4_current')|0]#!"
 kalinga_missions_task_10_4_allow_sv_ongoing:0 "#R [SCOPE.ScriptValue('kalinga_missions_task_10_4_current')|0]#!"
 kalinga_missions_task_10_DESC:0 "随着香料的获得，现在我们要做的就是保护我们在公海上的商人。海盗和其他敌对的海军潜伏在每个海湾后面。扩大我们自己的海军将增加我们水域内的安全。"
 kalinga_missions_task_10_allow_tt_1:0 "至少拥有#Y [SCOPE.ScriptValue('kalinga_missions_task_10_1_target')|0]#! $trireme$ @trireme! 艘船（[SCOPE.Custom('kalinga_missions_task_10_1_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_10_1_target')|0]#!）。"
 kalinga_missions_task_10_allow_tt_2:0 "至少拥有#Y [SCOPE.ScriptValue('kalinga_missions_task_10_2_target')|0]#! $tetrere$ @tetrere! 艘船（[SCOPE.Custom('kalinga_missions_task_10_2_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_10_2_target')|0]#!）。"
 kalinga_missions_task_10_allow_tt_3:0 "至少拥有#Y [SCOPE.ScriptValue('kalinga_missions_task_10_3_target')|0]#! $hexere$ @hexere! 艘船（[SCOPE.Custom('kalinga_missions_task_10_3_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_10_3_target')|0]#!）。"
 kalinga_missions_task_10_allow_tt_4:0 "至少拥有#Y [SCOPE.ScriptValue('kalinga_missions_task_10_4_target')|0]#! 艘船（[SCOPE.Custom('kalinga_missions_task_10_4_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_10_4_target')|0]#!）。"
 kalinga_missions_task_11:0 "沿着海岸线"
 kalinga_missions_task_11_DESC:0 "在我们的南部是案达罗地区的平原。这里土地肥沃，沿海地区充斥着各国的商人。扩张到这个地区对我们作为印度主要大国的复兴是至关重要的。"
 kalinga_missions_task_11_c_tt:0 "#Y $andhra_area$#!中新被征服的每座城市获得至多#G 3#!#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName][SCOPE.GetRootScope.GetCountry.GetReligion.GetName]自由民@freemen!#!、#Y 公民@citizens!#!或#Y 贵族@nobles!#!"
 kalinga_missions_task_11_c_tt2:0 "我们将选择是否整合#Y 案达罗#! 人民。"
 kalinga_missions_task_11_c_tt3:0 "我们将获得对#Y $sriparvata_area$#!、#Y $north_tondainadu_area$#! 和#Y $south_tondainadu_area$#!地区的宣称。"
 kalinga_missions_task_12:0 "泰米尔的联系"
 kalinga_missions_task_12_DESC:0 "泰米尔王国长期统治着印度南部。直接冲突可能不是什么好主意，他们不可低估。因此，一个联盟将大大加强我们在印度南部的地位。"
 kalinga_missions_task_12_a_tt:0 "#Y [GetCountry('CHL').GetName]#!的、#Y [GetCountry('CHR').GetName]#! 或#Y [GetCountry('PND').GetName]#! 对#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 的好感度大于或等于#Y 25#!。"
 kalinga_missions_task_12_c_tt:0 "我们可能会与其中一个#Y 泰米尔国王#! 结成#Y 同盟#!。"
 kalinga_missions_task_13:0 "泰米尔人的血统"
 kalinga_missions_task_13_DESC:0 "泰米尔人的血统相当具有声望。合并我们的王朝将为我们带来所急需的威望，不仅在泰米尔，而且在整个印度都是如此。"
 kalinga_missions_task_14:0 "加强泰米尔联系"
 kalinga_missions_task_14_DESC:0 "泰米尔人很凶猛，但不具敌意。在不占领的情况下统治他们的土地可能是一个现实的解决方案。但要做到这一点，我们首先要证明羯陵伽有足够的实力来统治南部地区。"
 kalinga_missions_task_14_a_tt:0 "$kalinga_missions_task_14_a_tt_opinion_loc$#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 比三个#Y 泰米尔国王#!中的至少一个拥有更多的省份：\n$kalinga_missions_task_14_a_tt_chola_loc$\n$kalinga_missions_task_14_a_tt_chera_loc$\n$kalinga_missions_task_14_a_tt_pandya_loc$\n"
 kalinga_missions_task_14_a_tt_chera_loc:0 "[SCOPE.Custom('kalinga_missions_task_14_chera_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_14_chera_current')|0]#!"
 kalinga_missions_task_14_a_tt_chola_loc:0 "[SCOPE.Custom('kalinga_missions_task_14_chola_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_14_chola_current')|0]#!。"
 kalinga_missions_task_14_a_tt_opinion_loc:0 "#Y [GetCountry('CHL').GetName]#!、#Y [GetCountry('CHR').GetName]#!或者#Y [GetCountry('PND').GetName]#!对#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的好感度不小于#Y 150#!。\n"
 kalinga_missions_task_14_a_tt_pandya_loc:0 "[SCOPE.Custom('kalinga_missions_task_14_pandya_custom_loc')]/#Y [SCOPE.ScriptValue('kalinga_missions_task_14_pandya_current')|0]#!"
 kalinga_missions_task_14_c_tt:0 "#Y [GetCountry('CHL').GetName]#!，#Y [GetCountry('CHR').GetName]#! 或#Y [GetCountry('PND').GetName]#! 将成为我们的#G 印度仆从国#!。"
 kalinga_missions_task_14_chera_allow_sv_complete:0 "@trigger_yes! #Y [GetCountry('CHR').GetName]#!: #Y [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_14_chera_allow_sv_ongoing:0 "@trigger_no! #Y [GetCountry('CHR').GetName]#!: #R [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_14_chola_allow_sv_complete:0 "@trigger_yes! #Y [GetCountry('CHL').GetName]#!: #Y [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_14_chola_allow_sv_ongoing:0 "@trigger_no! #Y [GetCountry('CHL').GetName]#!: #R [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_14_pandya_allow_sv_complete:0 "@trigger_yes! #Y [GetCountry('PND').GetName]#!: #Y [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_14_pandya_allow_sv_ongoing:0 "@trigger_no! #Y [GetCountry('PND').GetName]#!: #R [SCOPE.ScriptValue('kalinga_missions_task_14_kalinga_current')|0]#!"
 kalinga_missions_task_15:0 "丛林之王"
 kalinga_missions_task_15_DESC:0 "在我们的西部，是印度广袤无垠的危险丛林。如果不加以控制，生活在这些丛林里的人对我们的人民来说也是一种危险。但是，如果我们设法将他们纳入羯陵伽的统治，他们的文韬武略将会为我们所用。"
 kalinga_missions_task_15_c_tt:0 "获得对#Y [GetCountry('ASM').GetName]#!、#Y [GetCountry('ANH').GetName]#! 和#Y [GetCountry('KUN').GetName]#!国家的宣称。"
 kalinga_missions_task_15_c_tt2:0 "在#Y $mahendragiri_area$#!和#Y $dakshina_kosala_area$#!中每个新被征服的城市，获得至多#G 3#!#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName][SCOPE.GetRootScope.GetCountry.GetReligion.GetName]自由民@freemen!#!、#Y 公民@citizens!#!或#Y 贵族@nobles!#!。"
 kalinga_missions_task_16:0 "击败南方的宿敌"
 kalinga_missions_task_16_DESC:0 "印度中部那些傲慢的部落现在在我们的霸权之下。不久前，这些野蛮人还在嘲笑我们，但现在他们都在羯陵伽的威力面前跪下了！。"
 kalinga_missions_task_16_c_tt:0 "获得对#Y $dravida_region$#! 和#Y $karnata_region$#!地区的宣称。"
 kalinga_missions_task_17:0 "征服北达罗毗荼"
 kalinga_missions_task_17_DESC:0 "达罗毗荼是印度南部的一个广大地区。许多军阀和部落在这片土地上游荡。然而，作为印度南部的保护者，我们仍然要让他们屈服。"
 kalinga_missions_task_17_a_tt:0 "在#Y 北达罗毗荼#!我们自己或附庸拥有下列省份：\n\t\t[SCOPE.Custom('kalinga_missions_task_17_sriparvata_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_17_n_tondainadu_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_17_s_tondainadu_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_17_koda_custom_loc')]"
 kalinga_missions_task_17_c_tt:0 "一位具有#G 高#!#R 军略@military_icon!#! 的#Y 将军#!将出现在我们的宫廷。"
 kalinga_missions_task_17_koda_no:0 "@trigger_no! #Y $koda_area$#!"
 kalinga_missions_task_17_koda_yes:0 "@trigger_yes! #Y $koda_area$#!"
 kalinga_missions_task_17_n_tondainadu_no:0 "@trigger_no! #Y $north_tondainadu_area$#!"
 kalinga_missions_task_17_n_tondainadu_yes:0 "@trigger_yes! #Y $north_tondainadu_area$#!"
 kalinga_missions_task_17_s_tondainadu_no:0 "@trigger_no! #Y $south_tondainadu_area$#!"
 kalinga_missions_task_17_s_tondainadu_yes:0 "@trigger_yes! #Y $south_tondainadu_area$#!"
 kalinga_missions_task_17_sriparvata_no:0 "@trigger_no! #Y $sriparvata_area$#!"
 kalinga_missions_task_17_sriparvata_yes:0 "@trigger_yes! #Y $sriparvata_area$#!"
 kalinga_missions_task_18:0 "征服南达罗毗荼"
 kalinga_missions_task_18_DESC:0 "如果最南端的地区未在我们的控制之下，我们仍然不可能称自己为印度南部的霸主。我们将把我们的影响力一直扩大到楞伽！"
 kalinga_missions_task_18_a_tt:0 "在#Y 南达罗毗荼#!我们自己或附庸拥有下列省份：\n\t\t[SCOPE.Custom('kalinga_missions_task_18_malayas_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_18_pandiya_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_18_n_tambapamni_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_18_s_tambapamni_custom_loc')]"
 kalinga_missions_task_18_c_tt:0 "#Y $dravida_region$#!地区中，至多#Y 30#!人口会被同化成[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]文化。"
 kalinga_missions_task_18_malayas_no:0 "@trigger_no! #Y $malayas_area$#!"
 kalinga_missions_task_18_malayas_yes:0 "@trigger_yes! #Y $malayas_area$#!"
 kalinga_missions_task_18_n_tambapamni_no:0 "@trigger_no! #Y $north_tambapamni_area$#!"
 kalinga_missions_task_18_n_tambapamni_yes:0 "@trigger_yes! #Y $north_tambapamni_area$#!"
 kalinga_missions_task_18_pandiya_no:0 "@trigger_no! #Y $pandiya_area$#!"
 kalinga_missions_task_18_pandiya_yes:0 "@trigger_yes! #Y $pandiya_area$#!"
 kalinga_missions_task_18_s_tambapamni_no:0 "@trigger_no! #Y $south_tambapamni_area$#!"
 kalinga_missions_task_18_s_tambapamni_yes:0 "@trigger_yes! #Y $south_tambapamni_area$#!"
 kalinga_missions_task_19:0 "征服北羯那多"
 kalinga_missions_task_19_DESC:0 "北羯那多是原始的、广阔的。在让这个地区变得安居乐业之前，必须要付出许多生命的代价。"
 kalinga_missions_task_19_a_tt:0 "在#Y 北羯那多#!我们自己或附庸拥有下列省份：\n\t\t[SCOPE.Custom('kalinga_missions_task_19_n_mahishamandala_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_19_s_mahishamandala_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_19_vanavasi_custom_loc')]"
 kalinga_missions_task_19_n_mahishamandala_no:0 "@trigger_no! #Y $north_mahishamandala_area$#!"
 kalinga_missions_task_19_n_mahishamandala_yes:0 "@trigger_yes! #Y $north_mahishamandala_area$#!"
 kalinga_missions_task_19_s_mahishamandala_no:0 "@trigger_no! #Y $south_mahishamandala_area$#!"
 kalinga_missions_task_19_s_mahishamandala_yes:0 "@trigger_yes! #Y $south_mahishamandala_area$#!"
 kalinga_missions_task_19_vanavasi_no:0 "@trigger_no! #Y $vanavasi_area$#!"
 kalinga_missions_task_19_vanavasi_yes:0 "@trigger_yes! #Y $vanavasi_area$#!"
 kalinga_missions_task_1_DESC:0 "佛教在过去的几十年里一直在发展。我们的一些人已经抛弃了旧的神灵，遵循佛陀的教诲。预测目前的趋势，接受佛教的方式可能不是一个坏主意？\n\n\n\n\n\n\n\n\n\n\n@event_pic5!"
 kalinga_missions_task_1_c_tt:0 "#Y 佛教#! 将被引入#Y 羯陵伽#! ，试图在我们的土地上传播佛教教义！"
 kalinga_missions_task_2:0 "羯陵伽之王"
 kalinga_missions_task_20:0 "征服南羯那多"
 kalinga_missions_task_20_DESC:0 "南羯那多有许多海港和港口。我们的许多商人从那儿将我们的货物运到西部。但在我们利用这个地区之前，我们首先要获得它。"
 kalinga_missions_task_20_a_tt:0 "在#Y 南羯那多#!我们自己或附庸拥有下列省份：\n\t\t[SCOPE.Custom('kalinga_missions_task_20_n_satiyaputa_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_20_s_satiyaputa_custom_loc')]\n\t\t[SCOPE.Custom('kalinga_missions_task_20_keralaputa_custom_loc')]"
 kalinga_missions_task_20_c_tt:0 "#Y $karnata_region$#!地区中，至多#Y 30#!人口会被同化成[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]文化。"
 kalinga_missions_task_20_keralaputa_no:0 "@trigger_no! #Y $keralaputa_area$#!"
 kalinga_missions_task_20_keralaputa_yes:0 "@trigger_yes! #Y $keralaputa_area$#!"
 kalinga_missions_task_20_n_satiyaputa_no:0 "@trigger_no! #Y $north_satiyaputa_area$#!"
 kalinga_missions_task_20_n_satiyaputa_yes:0 "@trigger_yes! #Y $north_satiyaputa_area$#!"
 kalinga_missions_task_20_s_satiyaputa_no:0 "@trigger_no! #Y $south_satiyaputa_area$#!"
 kalinga_missions_task_20_s_satiyaputa_yes:0 "@trigger_yes! #Y $south_satiyaputa_area$#!"
 kalinga_missions_task_21:0 "传说中的羯陵伽"
 kalinga_missions_task_21_DESC:0 "整个印度南部都在我们的控制之下！我们已经改写了我们的命运，并证明了羯陵伽不会就这样沦陷。我们将正式实现对印度的统治，在印度历史上留下永不磨灭的印记！赞美羯陵伽！"
 kalinga_missions_task_21_a_tt:0 "拥有所有#Y 高亮的省份#!。"
 kalinga_missions_task_22:0 "点缀案达罗补罗"
 kalinga_missions_task_22_DESC:0 "案达罗补罗城很古老，有值得骄傲的历史，但案达罗的民众长期以来忽视了它。现在它在我们手中，我们将使这个城市恢复它以前的荣耀。"
 kalinga_missions_task_23:0 "主宰案达罗"
 kalinga_missions_task_23_DESC:0 "案达罗是我们进入南方的门户。征服这一地区将为我们的王国打开许多新的道路。"
 kalinga_missions_task_24:0 "主宰阿湿波"
 kalinga_missions_task_24_DESC:0 "阿湿波位于大陆的腹地。如果我们真的希望主宰整个大陆，我们就不能只停留在海岸线上。"
 kalinga_missions_task_24_c_tt:0 "#Y $asmaka_area$#!地区中，至多#Y 25#!人口会被同化成[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]文化。"
 kalinga_missions_task_25:0 "主宰军多罗"
 kalinga_missions_task_25_DESC:0 "在德干腹地有一军多罗国。他们对我们表现出一种侮辱性的不尊重。对他们土地的统治是不可避免的！"
 kalinga_missions_task_25_c_tt:0 "#Y $kuntala_area$#!中至多#Y 25#!人口会被同化成[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]文化。"
 kalinga_missions_task_26:0 "德干的宝石"
 kalinga_missions_task_26_DESC:0 "在山的深处有许多宝藏，如黄金或宝石。开采它们可以使我们的民众富裕，充实我们的国库。"
 kalinga_missions_task_26_a_tt:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]在#Y 德干区域#!至少生产#Y [SCOPE.ScriptValue('kalinga_missions_task_26_gems_total')|0]宝石#!@gems!。[SCOPE.GetRootScope.GetCountry.Custom('kalinga_missions_task_26_gems_custom_loc')]"
 kalinga_missions_task_26_gems_complete:0 "(#R [SCOPE.ScriptValue('kalinga_missions_task_26_gems_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_26_gems_total')|0]#!)"
 kalinga_missions_task_26_gems_ongoing:0 "(#Y [SCOPE.ScriptValue('kalinga_missions_task_26_gems_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_26_gems_total')|0]#!)"
 kalinga_missions_task_27:0 "南印度的农业"
 kalinga_missions_task_27_DESC:0 "印度南部有着丰沛的河流和肥沃的土地。利用这一自然优势将帮助我们养活我们的民众。"
 kalinga_missions_task_27_grain_veggie_cows_complete:0 "(#R [SCOPE.ScriptValue('kalinga_missions_task_27_grain_veggie_cows_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_27_grain_veggie_cows_total')|0]#!)"
 kalinga_missions_task_27_grain_veggie_cows_ongoing:0 "(#Y [SCOPE.ScriptValue('kalinga_missions_task_27_grain_veggie_cows_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_27_grain_veggie_cows_total')|0]#!)"
 kalinga_missions_task_27_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 南印度#!至少生产#Y [SCOPE.ScriptValue('kalinga_missions_task_27_grain_veggie_cows_total')|0] 谷物#! @grain!, #Y 蔬菜#! @vegetables! 或 #Y 家畜#! @cattle!。[SCOPE.GetRootScope.GetCountry.Custom('kalinga_missions_task_27_grain_veggie_cows_custom_loc')]"
 kalinga_missions_task_28:0 "坚忍的文化"
 kalinga_missions_task_28_DESC:0 "在整个印度南部有许多著名的重要城市。确保我们对这些文明中心的控制将加强我们对整个土地的控制力。"
 kalinga_missions_task_28_a_tt:0 "下列省份的#Y 地区首府#!是#Y 城市#!地位，有至少#Y [SCOPE.ScriptValue('kalinga_missions_task_28_buildings_total')|0]#!建筑物且主流文化是[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]或#Y 已整合#!：\n\t\t[SCOPE.Custom('kalinga_missions_task_28_andhra_custom_loc')] #Y $andhra_area$#!\n\t\t[SCOPE.Custom('kalinga_missions_task_28_sriparvata_custom_loc')] #Y $sriparvata_area$#!\n\t\t[SCOPE.Custom('kalinga_missions_task_28_asmaka_custom_loc')] #Y $asmaka_area$#!\n\t\t[SCOPE.Custom('kalinga_missions_task_28_asika_custom_loc')] #Y $asika_area$#!\n\t\t[SCOPE.Custom('kalinga_missions_task_28_kuntala_custom_loc')] #Y $kuntala_area$#!\n\t\t[SCOPE.Custom('kalinga_missions_task_28_mulaka_custom_loc')] #Y $mulaka_area$#!"
 kalinga_missions_task_28_no:0 "@trigger_no!"
 kalinga_missions_task_28_yes:0 "@trigger_yes!"
 kalinga_missions_task_29:0 "孔雀同盟"
 kalinga_missions_task_29_DESC:0 "在我们的北方，是强盛的孔雀王朝。若能与之并肩作战，那将会是我们有力的盟友。"
 kalinga_missions_task_2_DESC:0 "过去的羯陵伽是由强大的统治者统治的。如果我们希望在即将到来的斗争中生存下来，我们就必须提醒自己注意我们过往的遗产。"
 kalinga_missions_task_3:0 "发展首都"
 kalinga_missions_task_30:0 "为了生存而休战"
 kalinga_missions_task_30_DESC:0 "孔雀帝国很强大，而且不断扩张。目前，我们无法与他们竞争，但友谊是也不可能的。也许我们可以为我们的王国安排某种休战协议？"
 kalinga_missions_task_3_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetCapital.GetArea.GetName]#! 的地区至少有两个任何类型的 #Y 省份投资#! 。"
 kalinga_missions_task_3_DESC:0 "羯陵伽是一片骄傲的土地，充满了历史和财富。然而，在这些年里，我们的基础设施已经落后于印度其他地区。如果我们希望在广阔的世界竞争，我们必须发展我们的核心领土。"
 kalinga_missions_task_4:0 "一个沿海的首都"
 kalinga_missions_task_4_DESC:0 "我们没有理由在我们的敌人面前躲藏。在沿海地区发展我们的首都，肯定会促进我们王国的移民和商业。"
 kalinga_missions_task_5:0 "储备食物"
 kalinga_missions_task_5_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $kalinga_area$#!. [SCOPE.GetRootScope.GetCountry.Custom('kalinga_missions_task_5_kalinga_grain_veggie_loc')] 至少生产#Y [SCOPE.ScriptValue('kalinga_missions_task_5_kalinga_grain_veggie_total')|0] 谷物#! @grain! 或 #Y 蔬菜#! @vegetables! "
 kalinga_missions_task_5_DESC:0 "我们最近的成就已经导致了人口的增加。如果我们想进一步发展，就必须保证我们的粮食生产。"
 kalinga_missions_task_5_kalinga_grain_veggie_loc_1:0 "(#Y [SCOPE.ScriptValue('kalinga_missions_task_5_kalinga_grain_veggie_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_5_kalinga_grain_veggie_total')|0]#!)"
 kalinga_missions_task_5_kalinga_grain_veggie_loc_2:0 "(#R [SCOPE.ScriptValue('kalinga_missions_task_5_kalinga_grain_veggie_current')|0]#!/#Y [SCOPE.ScriptValue('kalinga_missions_task_5_kalinga_grain_veggie_total')|0]#!)"
 kalinga_missions_task_6:0 "先进的大象部队"
 kalinga_missions_task_6_DESC:0 "大象是战斗的巨人，是威望的象征。羯陵伽的罗阇长期以来一直在使用大象作战，但对驯养这些巨大的野兽仍有许多东西需要学习。扩大我们的供应可能会导致更好的选择。"
 kalinga_missions_task_7:0 "丛林之都"
 kalinga_missions_task_7_DESC:0 "敌人就在我们周围，我们需要保证我们的首都不能沦陷。如果我们定都于丛林中，保卫它就会容易得多。"
 kalinga_missions_task_7_allow_tt:0 "有资格成为一个城市。"
 kalinga_missions_task_7_c_tooltip:0 "在#Y $mahendragiri_area$#!或#Y $dakshina_kosala_area$#!地区的#T 丛林#!地带，我们将迁移新#Y 首都#!于此处。"
 kalinga_missions_task_8:0 "一个新的城市"
 kalinga_missions_task_8_DESC:0 "在我们决定将首都迁往丛林之后，我们现在必须将一些资金转用于城市建设工程。我们的新首都将令整个印度感到惊讶。"
 kalinga_missions_task_8_allow_tt:0 "有资格成为一个城市。"
 kalinga_missions_task_9:0 "香料贸易"
 kalinga_missions_task_9_B_tt:0 "一个随机的不发达省份将开始生产#Y 香料#! @spices!。"
 kalinga_missions_task_9_DESC:0 "香料是印度和世界其他地区贸易成功的关键。如果我们能够获得一些香料种子，我们可以开始自己种植。"
 kalinga_missions_task_9_tt:0 "至少有一个省需要进口#Y 香料#! @spices!。"
 kalinga_tamil_bad_relations:0 "糟糕的泰米尔联系"
 kalinga_tamil_good_relations:0 "良好的泰米尔联系"
 kalingan_agricultural_boost:0 "改善农业技术"
 kalingan_conquests_center:0 "羯陵伽的港湾"
 kalingan_cultural_fortitude:0 "坚忍的文化"
 kalingan_investments:0 "投资羯陵伽"
 kalingan_trade_center:0 "羯陵伽贸易中心"
 legendary_kalinga:0 "传说中的羯陵伽"
 mad_andhran_kalinga:0 "残虐的案达罗"
 me_kalinga_1.a:0 "为了羯陵伽之王！"
 me_kalinga_10.a:0 "我们别无选择，只能接受。"
 me_kalinga_10.b:0 "这帮该死的家伙居然敢这么做？！胆大包天！"
 me_kalinga_10_a_tt:0 "我们将成为#Y [SCOPE.sC('current_kalinga_scope').GetName]#!的#R 印度仆从国#!。"
 me_kalinga_10_b_tt:0 "这可能会导致#R 战争#!..."
 me_kalinga_10_desc:0 "来自羯陵伽宫廷的消息。他们已经决定成为印度南部的保护者。这样一来，他们要求我们正式臣服。羯陵伽的国王已经把他们的影响力大大地扩展到印度南部，这已经不是什么秘密了。也许向他们屈服才是正确的选择？"
 me_kalinga_10_title:0 "$kalinga_missions_task_14$: 羯陵伽的要求"
 me_kalinga_11.a:0 "他们当然会这样做。"
 me_kalinga_11.b:0 "他们会对这一天感到后悔。"
 me_kalinga_11_desc:0 "泰米尔人传来了关于我们对印度南部实行保护国的回复。"
 me_kalinga_11_i_tt:0 "我们将获得#Y [SCOPE.sC('kal_offer_scope').GetName]#!所有领土的#Y 宣称#!"
 me_kalinga_11_title:0 "$kalinga_missions_task_14$。[SCOPE.sC('kal_offer_scope').GetAdjective]回复"
 me_kalinga_12.a:0 "接受佛教！"
 me_kalinga_12.b:0 "我们不需要这样的东西..."
 me_kalinga_12_desc:0 "佛教信仰每天都在普及。似乎只是一个时间问题，直到我们的绝大多数人跟随这种新的信仰。也许我们也应该这样做？"
 me_kalinga_12_title:0 "$kalinga_missions_task_1$: 拥抱佛教"
 me_kalinga_1_desc:0 "羯陵伽的罗阇是骄傲的战士，他在敌人的心中种下恐惧。摩揭陀人和印度其他地区可能认为我们很弱，但我们将向他们证明情况并非如此。首先，我们将向西进攻，征服印度的丛林。羯陵伽的征程还没有结束，这只是一个开始！"
 me_kalinga_1_title:0 "$kalinga_missions$"
 me_kalinga_1_tt:0 "获得对#Y $mahendragiri_area$#! 和#Y $dakshina_kosala_area$#!地区的宣称。"
 me_kalinga_2.a:0 "[SCOPE.sP('cap_prov_1').GetName]"
 me_kalinga_2.b:0 "[SCOPE.sP('cap_prov_2').GetName]"
 me_kalinga_2.c:0 "[SCOPE.sP('cap_prov_3').GetName]"
 me_kalinga_2.d:0 "[SCOPE.sP('cap_prov_4').GetName]"
 me_kalinga_2.e:0 "[SCOPE.sP('cap_prov_5').GetName]"
 me_kalinga_2_desc:0 "坚不可摧的丛林对我们的新首都来说是一个更安全的地方。我们最优秀的建筑师已经考察了该地区。他们已经为我们的新城市找到了四个潜在的地点。"
 me_kalinga_2_title:0 "$kalinga_missions_task_7$"
 me_kalinga_3.a:0 "一个奇妙的城市！"
 me_kalinga_3.b:0 "我们将从这里统治我们的王国。"
 me_kalinga_3.bt:0 "将我们的一部分#Y 贵族@nobles!#! 和#Y 公民@citizen!#! 从我们的旧首都转移到我们的新首都。"
 me_kalinga_3_desc:0 "我们已经完成了新首都的建设！它确实是一个建筑奇迹，不愧是羯陵伽的国王。许多人已经在涌入这座新城市，看不到尽头。新的首都似乎已经取代了旧的首都的知名度。"
 me_kalinga_3_title:0 "$kalinga_missions_task_8$"
 me_kalinga_4.a:0 "和平地整合他们。"
 me_kalinga_4.b:0 "让他们做牛做马！"
 me_kalinga_4.c:0 "我们的统治一直都是仁慈的。"
 me_kalinga_4_desc:0 "在我们最近征服了案达罗之后，我们现在发现自己有许多新的臣民。然而，这些人的文化与我们不同，我们王国的许多官员都在等待关于这种情况的答案。我们应该把被征服的人当作与我们平等的人，还是让他们在我们脚下服务？"
 me_kalinga_4_title:0 "$kalinga_missions_task_11$：文化问题？"
 me_kalinga_5.a:0 "朱罗将是我们的赌注！"
 me_kalinga_5.b:0 "掣罗有很大的潜力。"
 me_kalinga_5.c:0 "般帝耶绝不会让我们失望。"
 me_kalinga_5_desc:0 "多年来，泰米尔国王一直统治着南部地区。他们对这片土地的控制力和他们的军队一样强大，他们可能难以战胜。我们的朝廷一直在努力制定一项条约，以确保良好的关系和军事援助。剩下的唯一问题是，我们应该向谁发出建议？"
 me_kalinga_5_title:0 "$kalinga_missions_task_12$。一个潜在的联盟？"
 me_kalinga_6.a:0 "羯陵伽人似乎是一个伟大的盟友。"
 me_kalinga_6.b:0 "拒绝这个卑鄙的人渣！"
 me_kalinga_6_desc:0 "从羯陵伽那儿传来了消息。他们寻求与我们结盟，以确保和平和军事援助。长期以来，羯陵伽人只是印度东部的一个小王国，然而最近，他们似乎有了很大的野心。"
 me_kalinga_6_title:0 "$kalinga_missions_task_12$: 羯陵伽的提议"
 me_kalinga_7.a:0 "对我们的好朋友来说，我们的期望不小。"
 me_kalinga_7.b:0 "他们竟敢如此侮辱我们？"
 me_kalinga_7_desc:0 "不久前，我们向[chosen_potential_alliance_scope.GetName]的泰米尔国王派出了外交官。现在他们回来了，带来了他们的答复。"
 me_kalinga_7_title:0 "$kalinga_missions_task_12$：[chosen_potential_alliance_scope.GetAdjective]的回复"
 me_kalinga_8.a:0 "我们的祖先是传奇性的！"
 me_kalinga_8_desc:0 "我们的王朝现在可以从羯陵伽王国以及泰米尔国王那里获得合法地位。我们的王朝对这块土地的控制力比以往任何时候都强。"
 me_kalinga_8_title:0 "$kalinga_missions_task_13$"
 me_kalinga_9.a:0 "把这个提议发给他们吧!"
 me_kalinga_9.b:0 "我们不需要他们。"
 me_kalinga_9_a_tt:0 "我们将要求#Y 泰米尔国王#! 成为我们的#G 印度仆从国#!。"
 me_kalinga_9_desc:0 "随着我们向印度南部的扩张，我们已经与泰米尔国王取得了联系。现在，我们发现自己处于一个新发现的力量的位置，我们可以决定充当印度南部的保护者，以动摇他们在我们这边的地位。如果他们接受，我们可以让他们臣服于我们，然而，他们也可能把我们的提议理解为对他们实力的侮辱。"
 me_kalinga_9_title:0 "$kalinga_missions_task_14$。一个印度仆从国？"

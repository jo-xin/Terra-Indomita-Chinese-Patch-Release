 bactrian_mission_01_bactria_task_1:0 "塞琉古王朝的枷锁"
 bactrian_mission_01_bactria_task_10:0 "粟特山岩"
 bactrian_mission_01_bactria_task_10_DESC:0 "[GetProvince('(int32)6719').GetName][GetProvince('(int32)6700').GetName]与[GetProvince('(int32)6701').GetName]的粟特山崖要塞，自亚历山大东征后便年久失修。重建这些要塞将大大增强粟特地区的防御能力，有效抵御外敌入侵。  "
 bactrian_mission_01_bactria_task_11:0 "索格底亚纳的财富"
 bactrian_mission_01_bactria_task_11_DESC:0 "粟特地区富庶繁华，坐拥众多重要大城。它有望成为我国王国的商业中枢，需要我们大力投入建设。"
 bactrian_mission_01_bactria_task_12:0 "居鲁士之城"
 bactrian_mission_01_bactria_task_12.tt.a:0 "在#Y $sogdiana_area$#! 地区的所有城市都有一个$commerce_building$和一个$town_hall_building$。"
 bactrian_mission_01_bactria_task_12.tt.b:0 "在#Y $ferghana_area$#! 地区的所有城市都有一个$commerce_building$和一个$town_hall_building$。"
 bactrian_mission_01_bactria_task_12.tt.c:0 "在#Y $cyropolis_area$#! 地区的所有城市都有一个$commerce_building$和一个$town_hall_building$。"
 bactrian_mission_01_bactria_task_12_DESC:0 "[GetProvince('(int32)6703').GetName]是由伟大的波斯国王居鲁士大帝建立的，是阿契美尼德帝国的强大和范围的证明。不幸的是，由于大量移民到附近的[GetProvince('(int32)6704').GetName]城，这座城市已经荒废了。我们应该恢复[GetProvince('(int32)6703').GetName]昔日的荣光。"
 bactrian_mission_01_bactria_task_13:0 "亚历山大埃沙特"
 bactrian_mission_01_bactria_task_13_DESC:0 "[GetProvince('(int32)6704').GetName]代表了希腊化世界的最远范围。没有其他希腊城市在这一点之外被建造。当然，这是有可能改变的。建立[GetProvince('(int32)6704').GetName]将使我们能够把它作为进一步扩展到斯基泰的行动基地。费尔干纳河谷以北的落魄部落最终可能成为我们未来的臣民。"
 bactrian_mission_01_bactria_task_14:0 "粟特的一座新城市"
 bactrian_mission_01_bactria_task_14_DESC:0 "在费尔干纳河谷建立一个新的希腊化定居点，将有助于建立我们对这个肥沃地区的控制。马萨吉特人最近变得不守规矩，在那里有一个强大的希腊人存在可以帮助整合。"
 bactrian_mission_01_bactria_task_15:0 "费尔干纳河谷"
 bactrian_mission_01_bactria_task_15_DESC:0 "费尔干纳谷地是我国另一处重要农业区，依靠药杀水（锡尔河）灌溉滋养。这片沃土维系着整个粟特地区的粮食供应，必须加速开发以满足日益增长的人口需求。"
 bactrian_mission_01_bactria_task_16:0 "马尔吉亚纳的亚历山大城"
 bactrian_mission_01_bactria_task_16_DESC:0 "[GetProvince('(int32)6668').GetName]是马尔吉亚纳的首都，也是属于我们控制范围的另一个大型希腊化定居点。加强和扩大[GetProvince('(int32)6668').GetName]的基础设施将使其成为一个真正宏伟的希腊-巴克特里亚定居点。"
 bactrian_mission_01_bactria_task_17:0 "马尔吉亚纳总督领"
 bactrian_mission_01_bactria_task_17_DESC:0 "[GetProvince('(int32)6668').GetArea.GetName]是我国帝国继巴克特里亚和粟特之后的第三大行省。该地区不仅面临帕提亚游牧部落的威胁，还需防范南方塞琉古王朝的侵扰，同时兼具巨大的农业与商业发展潜力，绝不可忽视。"
 bactrian_mission_01_bactria_task_18:0 "伊阿尼姆城"
 bactrian_mission_01_bactria_task_18_DESC:0 "[GetProvince('(int32)6668').GetArea.GetName]在[GetProvince('(int32)6668').GetName]城外大部分地区仍然没有人口，也没有人定居。我们应该在[GetProvince('(int32)6665').GetName]建立一个新的城市中心，使其成为马尔吉亚纳的第二个城市。"
 bactrian_mission_01_bactria_task_19:0 "征服花剌子模"
 bactrian_mission_01_bactria_task_19_DESC:0 "在我们王国的北部，有肥沃的[GetProvince('(int32)6708').GetArea.GetName]、[GetProvince('(int32)6803').GetArea.GetName]和[GetProvince('(int32)9241').GetArea.GetName]地区。亚历山大从未能够征服这些土地，这份荣耀留给了我们。控制花剌子模绿洲将为我们提供另一个富饶的农业区，非常适合定居。"
 bactrian_mission_01_bactria_task_1_DESC:0 "为了使巴克特里亚真正实现伟大，我们必须摆脱塞琉古帝国的控制。他们对西方冲突的专注使他们无法捍卫或支持我们的土地。独立是我们唯一的选择。"
 bactrian_mission_01_bactria_task_2:0 "皇家巴克特拉"
 bactrian_mission_01_bactria_task_20:0 "开化野蛮人"
 bactrian_mission_01_bactria_task_20_DESC:0 "花剌子模是我们的，但该地区仍然是高度农业化和未开发的。我们必须在这一地区建立城市，并使占领这一地区的野蛮部落文明化。"
 bactrian_mission_01_bactria_task_21:0 "花剌子模的首都"
 bactrian_mission_01_bactria_task_21_DESC:0 "[GetProvince('(int32)6803').GetName]是花剌子模人的部落首都。我们必须将其重建为一个自豪的希腊-巴克特里亚城市。"
 bactrian_mission_01_bactria_task_22:0 "奥克西亚绿洲"
 bactrian_mission_01_bactria_task_22_DESC:0 "花剌子模肥沃的绿洲由北部的奥克西亚海供给，具有巨大的农业潜力。开发这一地区将确保我们永远不会再缺粮。"
 bactrian_mission_01_bactria_task_23:0 "欧克拉提斯的崛起"
 bactrian_mission_01_bactria_task_23_DESC:0 "巴克特里亚宫廷里来了一位有前途的新人物，他来自塞琉古帝国。他的魅力和军事专长已经赢得了许多人的支持，他在我们的首都已经有了相当多的追随者。有传言说，他可能正是我们需要的人，可以带领巴克特里亚获得更大的荣耀。"
 bactrian_mission_01_bactria_task_24:0 "巴克特里亚的新首都"
 bactrian_mission_01_bactria_task_24_DESC:0 "多年来，[GetProvince('(int32)6678').GetName]一直是我们的首都，但其位置并不理想。在[GetProvince('(int32)6694').GetName]建立一个新的首都，将使我们能够直接进入奥克苏斯河，并将我们的统治集中在巴克特里亚最繁荣和城市化的地区。"
 bactrian_mission_01_bactria_task_25:0 "军事改革"
 bactrian_mission_01_bactria_task_25_DESC:0 "我们采用了许多波斯和希腊的军事传统，这使我们的士兵具有很大的优势。如果我们想让我们的独立持续下去，我们必须改革我们的军队，以配合我们更强大的邻居的力量。"
 bactrian_mission_01_bactria_task_26:0 "希腊移民"
 bactrian_mission_01_bactria_task_26_DESC:0 "巴克特里亚仍然与希腊化世界的其他地区隔绝。我们应该呼吁希腊、马其顿和亚细亚土地上的定居者移民到巴克特里亚，这样我们才能与我们的祖国保持紧密的联系。"
 bactrian_mission_01_bactria_task_27:0 "对塞里卡的远征"
 bactrian_mission_01_bactria_task_27_DESC:0 "埃莫迪安山脉之外是神秘的塞里卡大陆。据说，它所包含的帝国和财富比我们所能想象的都要大。我们应该扩大我们在这一地区的财产，以获得与塞里卡更有利可图的贸易。"
 bactrian_mission_01_bactria_task_2_DESC:0 "[GetProvince('(int32)6678').GetName]是巴克特里亚的首都和文化中心，该地区的名字就来源于此。我们已经把这个城市作为我们的国家首都，但它仍然是明显的波斯人。重建和希腊化[GetProvince('(int32)6678').GetName]将使其成为我们新生帝国的真正权力所在地。"
 bactrian_mission_01_bactria_task_3:0 "城市化的巴克特里亚"
 bactrian_mission_01_bactria_task_3_DESC:0 "与波斯的其他地区相比，巴克特里亚的城市化程度很高，这反过来又使我们变得相当富有。在我们的首都地区建立新的城市将促进我们的贸易、财富和人口增长。"
 bactrian_mission_01_bactria_task_4:0 "希腊-巴克特里亚文化"
 bactrian_mission_01_bactria_task_4_DESC:0 "尽管巴克特里亚的上层阶级主要由希腊马其顿人组成，但我们仍然觉得自己是这片土地上的外国人。与其把我们的希腊文化强加给巴克特里亚的波斯公民，不如打造一种新的希腊-巴克特里亚文化，保留两个民族的最佳元素。"
 bactrian_mission_01_bactria_task_5:0 "奥克斯河畔的亚历山大城"
 bactrian_mission_01_bactria_task_5_DESC:0 "[GetProvince('(int32)6688').GetName]是巴克特里亚的一个主要希腊化城市，由亚历山大亲自建立。这个城市的居民大多是希腊人，他们要求建造新的寺庙和剧院。我们应该在这个城市投资，把它变成一个繁荣的文化中心。"
 bactrian_mission_01_bactria_task_6:0 "保护边疆"
 bactrian_mission_01_bactria_task_6_DESC:0 "我们的南部和东部边境被敌人所困扰。塞琉古无疑会试图夺回他们失去的巴克特里亚土地，而东方崛起的强国--孔雀帝国，也对我们的王国抱有极大的兴趣。我们必须加固我们的边界，以防止敌人的入侵。"
 bactrian_mission_01_bactria_task_7:0 "重建亚历山大城 塔尔马塔"
 bactrian_mission_01_bactria_task_7_DESC:0 "古城[GetProvince('(int32)6686').GetName]是由亚历山大大帝重新建立的，然而，我们已经决定为这个城市赋予一个新的名字。我们还将对其进行美化，使其更接近于希腊化的定居点。"
 bactrian_mission_01_bactria_task_7_construction_loc_1:0 "\\n    @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y $mesopotamia_region$#!地区有正在进行的建造工程。"
 bactrian_mission_01_bactria_task_7_loc_1:0 "（#R [SCOPE.ScriptValue('bactrian_mission_01_bactria_task_7_current')|0]#!/#Y [SCOPE.ScriptValue('bactrian_mission_01_bactria_task_7_total')|0]#!）"
 bactrian_mission_01_bactria_task_7_loc_2:0 "（#Y [SCOPE.ScriptValue('bactrian_mission_01_bactria_task_7_current')|0]#!/#Y [SCOPE.ScriptValue('bactrian_mission_01_bactria_task_7_total')|0]#!）"
 bactrian_mission_01_bactria_task_7_tt_trigger:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y $mesopotamia_region$#!地区拥有至少#Y [SCOPE.ScriptValue('bactrian_mission_01_bactria_task_7_total')|0]#!座建筑。[SCOPE.GetRootScope.GetCountry.Custom('bactrian_mission_01_bactria_task_7_loc')] [SCOPE.GetRootScope.GetCountry.Custom('bactrian_mission_01_bactria_task_7_construction_loc')]"
 bactrian_mission_01_bactria_task_8:0 "巴克特里亚的粮仓"
 bactrian_mission_01_bactria_task_8_DESC:0 "奥克苏斯河谷是我们王国的粮仓，为我们的人民生产大量的食物。扩大这一地区的农业潜力将使我们自给自足，减少对敌对邻国的粮食依赖。"
 bactrian_mission_01_bactria_task_9:0 "马拉坎达的集市"
 bactrian_mission_01_bactria_task_9_DESC:0 "[GetProvince('(int32)6682').GetName]是一个富裕的商业贸易中心，在连接我们帝国和塞里卡的丝绸之路上拥有战略位置。建设新的市场和贸易仓库将扩大我们在该地区的贸易，为巴克特里亚带来更多的财富。"
 bactrian_mission_01_bactria_task_final:0 "巴克特里亚的财富"
 bactrian_mission_01_bactria_task_final_DESC:0 "巴克特里亚已经从独立中脱颖而出，成为一个富裕而强大的王国。我们的商业和农业潜力巨大，我们人民的未来也很光明。随着我们中心地带的充分发展，我们应该把目光投向边界以外的地方，以寻求可能的扩张。"
 bactrian_mission_02_parthia:0 "帕提亚的野心"
 bactrian_mission_02_parthia_BUTTON_TOOLTIP:0 "帕提亚是塞琉古王朝最不设防的地区之一，如果我们不首先尝试占领它，它无疑会落入斯基泰人的手中。帕提亚必须保留在希腊人手中。"
 bactrian_mission_02_parthia_CRITERIA_DESCRIPTION:0 "在我们征服了帕提亚地区并将其纳入我们的帝国之后，这个任务才算完成。"
 bactrian_mission_02_parthia_DESCRIPTION:0 "我们以前的附属国--帕提亚总督领，仍然很虚弱，而且相对不设防。随着塞琉古人在西方的关注度越来越高，帕提亚的帕耳尼亚部落对这个总督领的兴趣越来越大。我们应该在野蛮人部落将其据为己有之前征服这一区域。"
 bactrian_mission_02_parthia_task_1:0 "帕提亚人的野心"
 bactrian_mission_02_parthia_task_10:0 "百门之城"
 bactrian_mission_02_parthia_task_10_DESC:0 "[GetProvince('(int32)3439').GetName]城已被指定为整个帕提亚的首都，是一个主要的希腊化定居点。我们的领导人已经制定了计划，通过建造伟大的工程和新的住房来吸引移民，把它变成帕提亚最令人印象深刻的城市。"
 bactrian_mission_02_parthia_task_11:0 "帕提亚科米森"
 bactrian_mission_02_parthia_task_11_DESC:0 "[GetProvince('(int32)3439').GetArea.GetName]大部分是山区，但拥有丰富的资源。对这个省的投资是至关重要的，因为它将成为通往波斯东部其他地区的门户。"
 bactrian_mission_02_parthia_task_12:0 "城市化的帕提亚"
 bactrian_mission_02_parthia_task_12_DESC:0 "帕提亚仍然以农业为主。我们应该在那里建造新的定居点，以增加其人口并吸引希腊定居者。"
 bactrian_mission_02_parthia_task_12_loc_1:0 "(#R [SCOPE.ScriptValue('bactria_mission_02_parthia_task_12_current')|0]#!/#Y [SCOPE.ScriptValue('bactria_mission_02_parthia_task_12_total')|0]#!)"
 bactrian_mission_02_parthia_task_12_loc_2:0 "(#Y [SCOPE.ScriptValue('bactria_mission_02_parthia_task_12_current')|0]#!/#Y [SCOPE.ScriptValue('bactria_mission_02_parthia_task_12_total')|0]#!)"
 bactrian_mission_02_parthia_task_12_tt:0 "在#Y [GetProvince('(int32)3439').GetArea.GetName]#!、#Y [GetProvince('(int32)3435').GetArea.GetName]#!、#Y [GetProvince('(int32)3450').GetArea.GetName]#!和#Y [GetProvince('(int32)3445').GetArea.GetName]#!，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少拥有#Y [SCOPE.ScriptValue('bactria_mission_02_parthia_task_12_total')|0]#!座城市。[SCOPE.GetRootScope.GetCountry.Custom('bactria_mission_02_parthia_task_12_loc')]"
 bactrian_mission_02_parthia_task_1_DESC:0 "帕提亚是一个弱小的国家，他们的塞琉古主子并不能保护他们。随着帕尔尼人和大益人越来越好战，如果我们不首先采取行动，这个地区有可能落入他们的控制之下。"
 bactrian_mission_02_parthia_task_2:0 "帕提亚的中心地带"
 bactrian_mission_02_parthia_task_2_DESC:0 "[GetProvince('(int32)3444').GetArea.GetName]和[GetProvince('(int32)3450').GetArea.GetName]省构成了帕提亚的古老中心地带。这些地区必须被纳入我们的帝国。"
 bactrian_mission_02_parthia_task_3:0 "旧帕提亚的首都"
 bactrian_mission_02_parthia_task_3_DESC:0 "[GetProvince('(int32)3454').GetName]是帕提亚的古都，但早已被废弃了。恢复该城市并吸引新的定居者将有助于振兴该省，并给它一个新的国家首都。"
 bactrian_mission_02_parthia_task_4:0 "恢复萨塔普地区"
 bactrian_mission_02_parthia_task_4_DESC:0 "[GetProvince('(int32)3444').GetArea.GetName]和[GetProvince('(int32)3450').GetArea.GetName]在被忽视多年后需要大量的投资。旧的帕提亚中心地带必须恢复繁荣，这样它才不会成为我们王国的经济负担。"
 bactrian_mission_02_parthia_task_5:0 "征服大益"
 bactrian_mission_02_parthia_task_5_DESC:0 "帕提亚中心地带的北部是大益和帕尔尼的蛮族土地。这些部落多年来不断壮大，将来可能对我们构成威胁。我们现在应该平定这个地区，为自己省去以后的麻烦。"
 bactrian_mission_02_parthia_task_6:0 "皇家墓园"
 bactrian_mission_02_parthia_task_6_DESC:0 "[GetProvince('(int32)6657').GetName]是帕提亚国王的古代墓园。虽然这座城市主要有仪式上的用途，但我们也可以把它作为我们领导人的皇家墓地，并建造新的宫殿和寺庙，使这个现在主要是部落的地区希腊化。"
 bactrian_mission_02_parthia_task_7:0 "里海之滨"
 bactrian_mission_02_parthia_task_7_DESC:0 "[GetProvince('(int32)3435').GetArea.GetName]和[GetProvince('(int32)3439').GetArea.GetName]是帕提亚省份中最富裕的省份，将成为我们不断发展的王国的良好补充。"
 bactrian_mission_02_parthia_task_8:0 "扎德拉卡塔市"
 bactrian_mission_02_parthia_task_8_DESC:0 "[GetProvince('(int32)3435').GetName]是[GetProvince('(int32)3435').GetArea.GetName]的首都和最大的城市。把它建成一个主要的商业中心，将使它成为许耳卡尼亚海的最伟大的城市。"
 bactrian_mission_02_parthia_task_9:0 "许耳卡尼亚商业"
 bactrian_mission_02_parthia_task_9.tt.a:0 "在#Y $hyrcania_area$#! 地区的所有城市都有一个$commerce_building$和一个$town_hall_building$。"
 bactrian_mission_02_parthia_task_9_DESC:0 "肥沃和繁荣的[GetProvince('(int32)3435').GetArea.GetName]省位于伟大的许耳卡尼亚海的海岸。由于我们缺乏任何主要的港口，确保这一地区的安全将使我们能够与这个巨大的内海沿岸的各个部落进行贸易。"
 bactrian_mission_02_parthia_task_final:0 "帕提亚治理"
 bactrian_mission_02_parthia_task_final_DESC:0 "帕提亚区域现在属于我们的控制范围。我们已经整合了帕提亚的旧总督领，并征服了北部的部落联盟。作为一个繁华的新商业中心，帕提亚已经吸引了来自整个希腊世界的定居者。"
 bactrian_mission_03_aria:0 "雅利安人的土地"
 bactrian_mission_03_aria_BUTTON_TOOLTIP:0 "阿里亚纳的土地就在我们的边界之外，是希腊世界和印度世界的交叉点。掌握这一地区将使我们在未来更容易向东扩张。"
 bactrian_mission_03_aria_CRITERIA_DESCRIPTION:0 "在我们征服了阿里亚纳地区并将其纳入我们的帝国之后，这个任务才算完成。"
 bactrian_mission_03_aria_DESCRIPTION:0 "阿里亚的山地是希腊文化、印度文化和波斯文化的大熔炉，曾被塞琉古人和孔雀人激烈争夺。它是一个肥沃的地区，是印度中心地带的天然屏障，包含了许多由亚历山大建立的大型希腊化城市。征服阿里亚纳有可能为进一步向印度扩张创造条件。"
 bactrian_mission_03_aria_task_1:0 "扩张到阿里亚纳"
 bactrian_mission_03_aria_task_10:0 "东方同步主义"
 bactrian_mission_03_aria_task_10_DESC:0 "阿剌科西亚是众多信仰的交汇点，包括琐罗亚斯德教、希腊教和佛教。我们应该在这个区域建立寺庙，以反映其宗教的多样性，并促进其人民之间更多的理解。"
 bactrian_mission_03_aria_task_11:0 "阿剌科西亚的矿区"
 bactrian_mission_03_aria_task_11_DESC:0 "阿剌科西亚拥有丰富的矿物和矿石，并将为我们的军队提供充足的金属。重要的是，我们要尝试尽可能多地开采这个区域的矿石。"
 bactrian_mission_03_aria_task_12:0 "希腊定居者"
 bactrian_mission_03_aria_task_12_DESC:0 "阿里亚拥有几个大型和繁荣的希腊化定居点。虽然这些是亚历山大定居的马其顿移民的残余，但我们应该呼吁希腊和塞琉古帝国的希腊化地区的公民在这里安家。"
 bactrian_mission_03_aria_task_1_DESC:0 "随着我们王国的扩张，我们关注着巴克特里亚中心地带以南的土地。阿里亚是一个重要而肥沃的地区，也是波斯和印度广阔土地之间的天然屏障。"
 bactrian_mission_03_aria_task_2:0 "雅利安人的土地"
 bactrian_mission_03_aria_task_2_DESC:0 "[GetProvince('(int32)6558').GetArea.GetName]和[GetProvince('(int32)6552').GetArea.GetName]省构成了阿里亚的西部地区，以其小块的肥沃土地和令人印象深刻的沙漠景观而闻名。我们应该向这些省份扩张。"
 bactrian_mission_03_aria_task_3:0 "阿里亚纳的首都"
 bactrian_mission_03_aria_task_3_DESC:0 "[GetProvince('(int32)6558').GetName]是阿里亚的王都，由亚历山大在一个古老的波斯人定居点上建立。我们应该扩大和投资这个城市，使其无愧于阿里亚的首都。"
 bactrian_mission_03_aria_task_4:0 "普罗夫塔西亚的亚历山大里亚"
 bactrian_mission_03_aria_task_4_DESC:0 "[GetProvince('(int32)6518').GetName]是亚历山大在阿里亚建立的第二个主要希腊化城市。它是一个小定居点，与该地区的其他波斯城镇相比相形见绌。它应该被建设起来，以吸引更多的希腊定居者。"
 bactrian_mission_03_aria_task_5:0 "阿里亚纳的新定居地"
 bactrian_mission_03_aria_task_5_DESC:0 "亚历山大在波斯建立了许多城市，但他的帝国已经不复存在。我们也应该建立自己的希腊式定居点，[GetProvince('(int32)6555').GetName]就是其中之一。"
 bactrian_mission_03_aria_task_6:0 "亚利安的面包篮"
 bactrian_mission_03_aria_task_6_DESC:0 "阿里亚很肥沃，有无数的冰川山河供养。我们应该把阿里亚变成一个自给自足的粮食生产国。"
 bactrian_mission_03_aria_task_7:0 "进入阿剌科西亚"
 bactrian_mission_03_aria_task_7_DESC:0 "阿剌科西亚区域是一块多山的、有故事的土地，是印度和波斯真正碰撞的地方。多民族、多宗教和富裕，将阿剌科西亚恢复为一个总督领将对我们大有好处。"
 bactrian_mission_03_aria_task_8:0 "高加索地区的亚历山大城"
 bactrian_mission_03_aria_task_8_DESC:0 "[GetProvince('(int32)6611').GetName]是一个重要的希腊化定居点和圣地。其多山的位置使得农业和用水困难，然而我们的管理者认为在这里开始一个水渠项目将使城市更快地发展。"
 bactrian_mission_03_aria_task_9:0 "在阿剌科西亚的亚历山大"
 bactrian_mission_03_aria_task_9_DESC:0 "[GetProvince('(int32)6541').GetName]城是阿剌科西亚事实上的首都。无数次战争破坏了这个地区，大规模的重建以恢复它将是必要的。"
 bactrian_mission_03_aria_task_final:0 "展望东方"
 bactrian_mission_03_aria_task_final_DESC:0 "随着阿里亚现在在我们的控制之下，我们的目光转向了东方。印度就在这些边界之外，我们现在可能有力量与孔雀王朝对抗，将这些古老的土地据为己有。"

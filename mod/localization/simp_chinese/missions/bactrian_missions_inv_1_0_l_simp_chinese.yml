 bactrian_leader_not_select_tooltip:0 "我们不会改变我们的领导人。"
 bactrian_mission_01_bactria:0 "巴克特里亚心脏地带"
 bactrian_mission_01_bactria_BUTTON_TOOLTIP:0 "我们的巴克特里亚中心地带由奥克苏斯河和雅克萨特河提供水源，使我们能够种植大量的粮食。我们的城市庞大而繁荣，我们的主要贸易路线为我们打开了印度和塞里卡的财富之门。我们必须对我们的中心地带进行大量投资，进而将其转变为最强大的希腊化国家之一。"
 bactrian_mission_01_bactria_CRITERIA_DESCRIPTION:0 "当我们摆脱了塞琉古帝国的控制，并将巴克特里亚建设成为经济和农业中心后，这个任务才算完成。"
 bactrian_mission_01_bactria_DESCRIPTION:0 "我们的总督领仍然处于塞琉古帝国的铁腕控制之下，而塞琉古帝国已经被西方的众多冲突所困扰。当塞琉古人试图对叙利亚和安纳托利亚的土地提出宣称时，他们却让我们陷入困境，无法保护我们的土地不受斯基泰的野蛮人的侵扰。巴克特里亚很富裕，城市化程度高，土地肥沃，可以成为一个伟大的国家，然而这只能通过一劳永逸地将我们从塞琉古帝国的控制下解放出来来实现。然后我们将把我们的国家建设成一个繁荣的帝国，以我们的巴克特里亚中心地带为中心。"

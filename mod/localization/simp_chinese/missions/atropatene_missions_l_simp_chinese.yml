l_simp_chinese:
 armenian_conqueror_mod:0 "亚美尼亚征服者"
 atropatene_mission_01:0 "米底的崛起"
 atropatene_mission_01_BUTTON_DETAILS:0 "米底的崛起"
 atropatene_mission_01_BUTTON_TOOLTIP:0 "我们的人民曾面临过最糟糕的情况，但仍然顽强地生存下来，我们的意志是不可阻挡的。"
 atropatene_mission_01_CRITERIA_DESCRIPTION:0 "当米底人恢复了米底王国的第三任国王——著名的茨亚萨雷斯在位时的边界，该使命完成。"
 atropatene_mission_01_DESCRIPTION:0 "米底人的名声传遍天下；我们的占卜师和解梦师是世界上最博学的人，在各大帝国的国都都享有盛名。我们伟大的统治者阿特罗帕忒斯一世曾作为总督统治波斯人和马其顿人，但亚历山大的死和继业者战争让我们的民众首次尝到了自由的滋味。虽然许多人希望像过去的征服者一样征服我们的领土，但我们的人民在琐罗亚斯德教信仰的指引下，不会屈服于外国——我们有别的计划。"
 atropatene_mission_01_task_0001:0 "攻击亚美尼亚"
 atropatene_mission_01_task_0001_DESC:0 "为了重新连接我们位于米底的祖先故土，亚美尼亚的土地必须被纳入我们的控制之下……"
 atropatene_mission_01_task_01:0 "米底人的国家"
 atropatene_mission_01_task_01_DESC:0 "如果我们希望建立自己的国家，我们必须首先把我们的内部整顿好，这就需要我们的人民全力支持。在未来的日子里，我们将向他们提出很多要求。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 atropatene_mission_01_task_01_tt:0 "#Y 阿特罗帕忒涅#! 已经颁布了 #Y 文化决议#! 为 #Y 米底#! 文化，下列决议至少有一项会被通过： \n\n #Y 上诉权#! \n #Y 保护土地产权#! \n #Y 放宽公民身份限制#!"
 atropatene_mission_01_task_02:0 "琐罗亚斯德的诞生地"
 atropatene_mission_01_task_02_DESC:0 "神圣的先知琐罗亚斯德出生在 [GetProvince('(int32)1627').GetName]，他的教义多年来一直对我们的人民产生巨大影响。我们相信，我们有责任将琐罗亚斯德故乡的山丘改造成一个真正值得参观的城市。\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 atropatene_mission_01_task_02_tt:0 "阿尔达庇勒将成为一座城市，所有琐罗亚斯德教国家都会对我们有好感，我们将获得周边省份的宣称。"
 atropatene_mission_01_task_03:0 "加强米底认同"
 atropatene_mission_01_task_03_DESC:0 "虽然我们的宫廷向所有民族敞开大门，无论他们的信仰或文化如何。但我们承认，一个建立在米底文化基础上的国家必须让米底人占据主导地位——我们还是强烈希望所有人最终都采用我们的方式。 \n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 atropatene_mission_01_task_03_tt:0 " #Y 米底#!, #Y 米底 阿特罗帕忒涅#!, and #Y 帕尔撒图尼科#! 省份的主导文化转变为 #Y 米底#!。"
 atropatene_mission_01_task_04:0 "盐业繁荣"
 atropatene_mission_01_task_04_DESC:0 "里海海岸是我们人民取之不尽、用之不竭的财富来源；我们不仅从水域中捕捞鱼类，而且沿海平原为我们提供了重要的盐业资源——也许我们可以采取措施扩大这种贸易商品的生产。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 atropatene_mission_01_task_05:0 "甘扎克圣城"
 atropatene_mission_01_task_05_DESC:0 " [GetProvince('(int32)1515').GetName] 城以当地虔诚的民众而闻名，但在一系列基础设施方面仍有改善空间，我们相信这将为该地区的经济创造动力。 \n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 atropatene_mission_01_task_05_tt:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 10个#!公民 @citizen!\n"
 atropatene_mission_01_task_06:0 "神秘的卡什马尔圣柏"
 atropatene_mission_01_task_06_DESC:0 "卡什马尔地区对我们来说是一个神圣的地方，因为在这个省份生长着一棵树，它是由先知从天堂的树林中带走的一棵树苗发芽的。因此，有许多香客前往此地，希望能在大树的荫凉下歇息。 \n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 atropatene_mission_01_task_07:0 "恢复穆护"
 atropatene_mission_01_task_07_DESC:0 "我们以前的祭司种姓，被称为穆护，多年来一直在挣扎，因为他们被剥夺了履行祭司职责所需的重要资源。我们应该尽一切努力使他们恢复原来的职位。 \n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 atropatene_mission_01_task_07_tt:0 "穆贝旦 穆贝德的忠诚度至少为 #Y 70#!"
 atropatene_mission_01_task_07_tt2:0 "如果阿尔达庇勒还没有神庙和大剧院，它们将被建造。"
 atropatene_mission_01_task_08:0 "为了我的儿子"
 atropatene_mission_01_task_08_DESC:0 "虽然我们面前的任务艰巨而难以执行，但这并不意味着正义将缺席。我们必须竭尽所能，确保所有的错误都得到纠正，无论付出什么代价。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 atropatene_mission_01_task_08_tt:0 "‘胜利者’塞琉古必须为背叛和谋杀佩尔狄卡斯而付出代价，佩尔狄卡斯是阿特罗帕特斯一世的女婿。其他的背叛者，培松和安提贞尼斯已经死了。也许暗杀是可能的……"
 atropatene_mission_01_task_09:0 "阿特罗帕忒涅宝库"
 atropatene_mission_01_task_09_DESC:0 "如果我们能够适当地建设 [GetProvince('(int32)1515').GetName]，使其成为一个真正可以在规模和地位上与其他省会城市相媲美的城市，增加的税收收入如同建造一座源源不绝的金库。 \n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 atropatene_mission_01_task_09_tt_1:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 5个#!贵族 @nobles!\n"
 atropatene_mission_01_task_09_tt_2:0 "#Y [THIS.GetProvince.GetName]#! 至少有 #Y 45#! 人口\n"
 atropatene_mission_01_task_10:0 "追寻阿维斯塔"
 atropatene_mission_01_task_10_DESC:0 "《阿维斯塔》是指引我们民众的神圣著作集，是在波斯附近尘土飞扬的山谷中编纂的。由于我们珍视这本著作，这让我们感到有必要控制启发它诞生的领土。\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 atropatene_mission_01_task_11:0 "王家精神之旅"
 atropatene_mission_01_task_11_DESC:0 " [GetProvince('(int32)4985').GetName] 城因其精美的银制品而闻名，是一个值得开发的地区，原因有很多。它不仅是该省的省会，而且我们可以利用其在里海海岸的优越位置，使其成为当地人真正想要居住的地方。 \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 atropatene_mission_01_task_11_tt_1:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 4个#!贵族 @nobles!\n"
 atropatene_mission_01_task_11_tt_2:0 "#Y [THIS.GetProvince.GetName]#! 至少有 #Y 45#! 人口\n"
 atropatene_mission_01_task_12:0 "卡多乌西俄伊的忠诚"
 atropatene_mission_01_task_12_DESC:0 "卡多乌西俄伊的居民是部落民的后代，经过多年漂泊来到该地区定居。尽管自我们任何人记事起，他们就一直生活在我们中间，但有时他们也会感到不满并集体暴动，我们认为可以通过在他们居住的地区建设公共设施来阻止这种趋势。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 atropatene_mission_01_task_13:0 "开化卡杜西亚"
 atropatene_mission_01_task_13_DESC:0 "我们坚信，卡杜西亚人虽然拥有值得骄傲的传统和历史，但如果他们接受我们的生活方式，作为一个民族会更加幸福和强大；我们尽我们所能鼓励这一进程。 \n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 atropatene_mission_01_task_13_tt:0 " #Y 阿马耳迪俄#! 和 #Y 卡多乌西俄伊#! 区域的省份的主导文化将转变为 #Y 米底#! 。"
 atropatene_mission_01_task_14:0 "宣称米底"
 atropatene_mission_01_task_14_DESC:0 "我们的制图师所记得的每一个属于米底的省份，我们都将声称是属于我们自己的。 \n\n\n\n\n\n\n\n\n\n@india_mil17!"
 atropatene_mission_01_task_14_tt:0 "#Y 阿特罗帕忒涅#! 将获得米底区域的全部宣称。"
 atropatene_mission_01_task_15:0 "巩固马提亚努斯湖周边"
 atropatene_mission_01_task_15_DESC:0 "在我们尘土飞扬的山区内部，经过几天的行程后，马提亚努斯湖的湖水对于旅行者不啻于甘霖。因此我们非常重视这一地区，我们应该尽一切努力将湖周围的领土在我们的直接统治下，即使居住在该地区的马匪会进行激烈的抵抗。 \n\n\n\n\n\n\n\n\n\n@persia_mil12!"
 atropatene_mission_01_task_16:0 "米底亚的大都会"
 atropatene_mission_01_task_16_DESC:0 "[GetProvince('(int32)1595').GetName]，这座很久以前茨亚萨雷斯从北方斯基泰人手中夺回并重建为米底都城的城市就像苍穹中闪耀的光芒。随着我们的文化认同膨胀，最近有大量游客涌入；人们成群结队地前来参观我们过往的遗迹，希望在米底文化与历史的腹地寻找精神财富。很快，这将成为该地区迄今为止最伟大的城市 ——一个真正属于我们传统的大都市。 \n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 atropatene_mission_01_task_16_tt:0 "#Y [THIS.GetProvince.GetName]#! 至少有 #Y 90#! 人口\n"
 atropatene_mission_01_task_16_tt_2:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 10个#!贵族 @nobles!\n"
 atropatene_mission_01_task_17:0 "默默无名的异端"
 atropatene_mission_01_task_17_DESC:0 "有些教义在民众中很受欢迎，但它们并不是建立在健全的神学基础上，信奉被称为‘druj’——该词意为欺骗——的异端已经成为风尚。我们遗憾地看到我们的国家如此黑暗。\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 atropatene_mission_01_task_18:0 "真理的光辉"
 atropatene_mission_01_task_18_DESC:0 "即使一个人将自己的思想奉献给真理可能是一项艰难的努力，但只有在经历了无知的尴尬之后，才能获得一段成长时期；所有的信仰都浓缩在名为真理（asha）的教义中。 \n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 atropatene_mission_01_task_19:0 "繁华的大都会"
 atropatene_mission_01_task_19_DESC:0 "[GetProvince('(int32)1627').GetName]，是我国最重要的城市之一，仅次于[GetProvince('(int32)1515').GetName]。近年来发展迅猛。我们的建筑师相信，我们可以采取一些措施来进一步提升城市的地位。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 atropatene_mission_01_task_19_tt:0 "#Y [THIS.GetProvince.GetName]#! 至少有 #Y 80#! 人口\n"
 atropatene_mission_01_task_19_tt_2:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 12个#!贵族 @nobles!\n"
 atropatene_mission_01_task_20:0 "马赞达兰海贸易"
 atropatene_mission_01_task_20_DESC:0 "无论人们是用当地的名称——马赞达兰称呼它，还是用希腊人给它起的名字许尔卡努姆海(Mare Hyrcanum)称呼，我们附近的这片内陆海为我们提供了巨大的贸易机会，我们从中受益良多。 \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 atropatene_mission_01_task_20_tt_1:0 "你将获得马赞达兰海周围的陆地的#Y 宣称#! 。"
 atropatene_mission_01_task_20_tt_2:0 "效果 : #Y 拉什特#!, #Y 阿玛尔达#!, #Y 叙林吉斯#!, #Y 塔密斯#!, #Y 甘扎克#!, #Y 沙里亚#!, #Y 派塔咖兰#!，和 #Y 巴加万#! 都会得到以下修正:"
 atropatene_mission_01_task_21:0 "米底之地"
 atropatene_mission_01_task_21_DESC:0 "万事俱备；我们已经吞并了适当的领土，并进行了必要的法律改革，我们会证明自己是阿契美尼德王朝的合格继承人。剩下要做的就是打倒塞琉古！\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 atropatene_mission_01_task_22:0 "盐业成功发展"
 atropatene_mission_01_task_22_DESC:0 "如果我们能将该省的收入提高到我们预期的水平，终有一天贵族们都会涌向这个地区，希望通过当地贸易发家致富……我们非常希望这件事发生。 \n\n\n\n\n\n\n\n\n\n@india_mil18!"
 atropatene_mission_01_task_22_money_loc_1:0 "(#R [SCOPE.ScriptValue('atropatene_mission_01_task_22_money_current')|0]#!/#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_money_total')|0]#!)"
 atropatene_mission_01_task_22_money_loc_2:0 "(#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_money_current')|0]#!/#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_money_total')|0]#!)"
 atropatene_mission_01_task_22_tooltip:0 "#Y $parskahayk_area$#!，#Y $media_atropatene_area$#!，#Y $kadousioi_area$#!，和#Y $amardioi_area$#!的每个省份至少有#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_money_total')|0]#!省份收入 @income![SCOPE.GetRootScope.GetCountry.Custom('atropatene_mission_01_task_22_money_loc')]且不超过#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_unrest_total')|0]#!动荡度 @unrest![SCOPE.GetRootScope.GetCountry.Custom('atropatene_mission_01_task_22_unrest_loc')]。（此指省份内所有领地的总动荡度）"
 atropatene_mission_01_task_22_unrest_loc_1:0 "(#R [SCOPE.ScriptValue('atropatene_mission_01_task_22_unrest_current')|0]#!/#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_unrest_total')|0]#!)"
 atropatene_mission_01_task_22_unrest_loc_2:0 "(#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_unrest_current')|0]#!/#Y [SCOPE.ScriptValue('atropatene_mission_01_task_22_unrest_total')|0]#!)"
 atropatene_mission_01_task_23:0 "忏悔"
 atropatene_mission_01_task_23_DESC:0 "没有什么人是不可拯救的。如果一个人放弃他的离经叛道，将他的思想转向真理，表现出一种忏悔的精神，那么神圣的恩惠与平和将降临到他身上。 \n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 atropatene_mission_01_task_23_tt:0 "卫队长的忠诚度至少为 #Y 80#!"
 atropatene_mission_01_task_24:0 "坚守信仰"
 atropatene_mission_01_task_24_DESC:0 "虽然我们周围有许多异端邪说，但只要我们坚守自己的信仰，即使四面外道诱惑，我们也会因为坚守本心而得到回报。 \n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 atropatene_mission_01_task_25:0 "米底大道"
 atropatene_mission_01_task_25_DESC:0 "由于我们国家遍地群山，长途跋涉无疑相当困难，即使季节合适依然如此，因此一条知名的道路——米底大道已经建成，缩短了我们城市之间的跋涉时间，也允许商人更轻易地到达我们内陆的省份。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 atropatene_mission_01_task_25_foundry_1:0 "#R [SCOPE.ScriptValue('num_of_foundry_building_total')|0]#!"
 atropatene_mission_01_task_25_foundry_2:0 "#Y [SCOPE.ScriptValue('num_of_foundry_building_total')|0]#!"
 atropatene_mission_01_task_25_marketplace_1:0 "#R [SCOPE.ScriptValue('num_of_commerce_building_total')|0]#!"
 atropatene_mission_01_task_25_marketplace_2:0 "#Y [SCOPE.ScriptValue('num_of_commerce_building_total')|0]#!"
 atropatene_mission_01_task_25_tt:0 "国内至少有 #Y 60#! 个市场。([SCOPE.Custom('atropatene_mission_01_task_25_marketplace')]/#Y 60#!)."
 atropatene_mission_01_task_25_tt_1:0 "国内至少有 #Y 20#! 座铸造厂。([SCOPE.Custom('atropatene_mission_01_task_25_foundry')]/#Y 20#!)."
 atropatene_mission_01_task_26:0 "茨亚哈雷斯的王国"
 atropatene_mission_01_task_26_DESC:0 "茨亚哈雷斯，这位传说中的国王，在过去的岁月里带领米底人获得了令我们至今都怀念的荣耀，他在天堂会很高兴地看到他在位时广阔的疆域重新恢复；在这个时代，没有人认为这并非一项壮举！\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 atropatene_mission_01_task_26_tt:0 "成立 #Y 大米底亚#! 的决议已被执行。"
 atropatene_mission_01_task_27:0 "正论学者"
 atropatene_mission_01_task_27_DESC:0 "因为我们已经采取措施传播正确的教义，同时禁绝异端邪说以削弱其影响，整个国家都受益于我们对文学事务的严格关注。 \n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 atropatene_mission_01_task_27_academy_1:0 "#R [SCOPE.ScriptValue('num_of_academy_building_total')|0]#!"
 atropatene_mission_01_task_27_academy_2:0 "#Y [SCOPE.ScriptValue('num_of_academy_building_total')|0]#!"
 atropatene_mission_01_task_27_library_1:0 "#R [SCOPE.ScriptValue('num_of_library_building_total')|0]#!"
 atropatene_mission_01_task_27_library_2:0 "#Y [SCOPE.ScriptValue('num_of_library_building_total')|0]#!"
 atropatene_mission_01_task_27_tt:0 "国内至少有 #Y 33#! 所学院。([SCOPE.Custom('atropatene_mission_01_task_27_academy')]/#Y 33#!)."
 atropatene_mission_01_task_27_tt_2:0 "国内至少有 #Y 40#!所图书馆。 ([SCOPE.Custom('atropatene_mission_01_task_27_library')]/#Y 40#!)."
 atropatene_mission_01_task_28:0 "大巴扎"
 atropatene_mission_01_task_28_DESC:0 "我们的民众支持我们度过了最艰难的时期，他们理应享受成功的果实，无论是精神上的还是物质上的。我们要在大城市建设市场，以方便有价商品的交换。 \n\n\n\n\n\n\n\n\n\n@event_pic1!"
 atropatene_mission_01_task_29:0 "米底的遗产"
 atropatene_mission_01_task_29_DESC:0 "现在，在我们胜利之时，在我们最终达成复兴米底的夙愿之时，我们终于可以向全世界宣布，米底人，古老而庄严的民族，已经恢复了往昔强大的地位。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 atropatene_mission_01_task_29_tt:0 "成立 #Y 米底亚#! 的决议已被执行。"
 atropatene_mission_01_task_30:0 "拜火教帝国"
 atropatene_mission_01_task_30_DESC:0 "有人觉得，我们目前的政府形式不足以管理我们这个自古代以来不断扩大的广阔领土。因此我们应该尽我们所能，不辜负民众对我们的期待；他们需要一个帝国来保护他们，而我们就是，也应该是那个帝国。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 atropatene_mission_01_task_31:0 "红城"
 atropatene_mission_01_task_31_DESC:0 "拉格的名字来自伊朗语，与红色有关，它一直是米底穆护部落的家园，这些人珍爱他们的家族与祭司阶级的联系，并把持着雅利安人对琐罗亚斯德教的崇拜。因此，他们的城市是神圣的，是自古以来、持续不断的米底认同和影响的壁垒。让他们再次传播米底的思想吧。"
 atropatene_mission_01_task_32:0 "军队之城"
 atropatene_mission_01_task_32_DESC:0 "阿斯帕达纳的名字来自伊于朗语，意思是与军队有关的，它一直是驻军的绝佳地点，也是来自四面八方的商人的完美驻留场所。帕列塔塞尼部落在很久以前就因为这些好处而变得富有和强大。居鲁士大帝甚至曾把这里作为波斯文化和宗教宽容的标志。它将重新为米底的雄心服务。"
 atropatene_mission_01_task_33:0 "圣泉之城"
 atropatene_mission_01_task_33_DESC:0 "古老的卡尚，虽然坐落在山脉和沙漠之间，但长期以来一直受益于生命之泉。从高海拔地区流下的泉水给原本非常干燥的地方带来了生命。作为阿里赞提部落的家园，我们会让这个孤独的地方恢复信仰和繁荣。"
 atropatene_mission_01_task_34:0 "米底三角"
 atropatene_mission_01_task_34_DESC:0 "在埃克巴坦纳，拉格和阿斯帕达纳之间居住着米底各部落，而斯特鲁查特和布迪部落居住在平原、山丘和村庄之间。上帝曾经把所有这些部族聚集在一起，形成了统一的米底，依靠这一广袤的地域来驱动文明的权能和影响。现在，这些不同的地域被再次统一在一起，并牢牢支撑着米底的统治。"
 atropatene_mission_01_task_35:0 "古老的金字塔"
 atropatene_mission_01_task_35_DESC:0 "在卡尚早期辉煌的遗迹中，有一座几乎被遗忘的埃兰人建造的金字塔，看起来比其他同类建筑更古老。如果这个古老的遗址被修复，它可能会使卡尚重新成为一个伟大的贸易和宗教中心。"
 atropatene_mission_01_task_35_tt:0 "#Y 卡尚金字塔#! 已被建造。"
 atropatene_mission_01_task_36:0 "聚集之地"
 atropatene_mission_01_task_36_DESC:0 "埃克巴坦纳这个名字本身就意为聚集之地。作为一座城市，埃克巴坦纳位于米底之要冲，同时也是最合适的首都选择。我们现在只是迈出了收复旧地的第一步。怎能不利用故都的名望和繁荣，让我们的民众再次团结起来呢？"
 atropatene_mission_01_task_37:0 "埃克巴坦纳宝库"
 atropatene_mission_01_task_37_DESC:0 "在亚历山大掠夺阿契美尼德王朝在那里储存的财富之前，埃克巴坦纳已经是历代最富有、最强大的米底和波斯城市之一。如果这些财富重新聚集起来，埃克巴坦纳作为富有之地的名声再次传播开来，这将有利于所有的米底人。"
 atropatene_mission_01_task_38:0 "埃克巴坦纳七堡"
 atropatene_mission_01_task_38_DESC:0 "迪奥塞斯的都城曾经被七座堡垒所保护，一个挨一个排在一起，它们有着明亮的颜色和壮观的外表。甚至连木板都镀上金色、银色和五彩缤纷的光彩。为了保护我们在这座城市中储存的大量财富，我们必须重建昔日著名的防御工事。"
 atropatene_mission_01_task_39:0 "居鲁士的档案"
 atropatene_mission_01_task_39_DESC:0 "阿契美尼德人除了存留了居鲁士重建耶路撒冷圣殿的规划外，还留下了埃克巴塔纳建筑的记录——比如波斯夏宫，这些档案说明了他们过去的许多规划和行动，从治理到未来建筑的样式。如果我们用最敏锐的头脑来筛选这些档案，我们可能会从往昔的征服者留给我们的东西中获得益处。"
 atropatene_mission_01_task_39_tt_1:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 20个#!贵族 @nobles!\n"
 atropatene_mission_01_task_39_tt_2:0 "宫廷哲学家的忠诚度至少为 #Y 70#! 且至少有 #Y 10#! 热忱"
 atropatene_mission_01_task_40:0 "波斯问题"
 atropatene_mission_01_task_40_DESC:0 "波斯，曾经不过是我们的附庸，在篡位者居鲁士的统治下征服了我们的土地。然而，居鲁士和他的继任者在统治我们的土地时表现出了克制和对米底人的尊重。也许我们应该对再次征服的波斯表现得宽容一些。一个强大的、治安更好的波斯能给我们带来很多好处。"
 atropatene_mission_01_task_40_tt_1:0 "#Y 波斯#! 文化已被整合。"
 atropatene_mission_01_task_40_tt_2:0 "波斯会成为我们的 #Y 附庸#!。"
 atropatene_needs_four_religious_investments_tt:0 "我们需要在#Y 卡杜西奥伊#!省进行#T 宗教捐赠#!的省份投资。"
 atropatene_urbanization:0 "阿特罗帕忒涅城市化"
 avestan_gathas_texts:0 "伽萨颂歌"
 avestan_gathas_texts_desc:0 "这17首赞美诗由琐罗亚斯德本人创作，构成了琐罗亚斯德教的亚斯纳礼仪文本的核心。这些诗篇共约6000字，涉及胡拉-马兹达本人和精神领域的许多其他方面，试图将神性与凡人公众联系起来。"
 death_of_seleucus:0 "塞琉古之死"
 ecbatana_archives:0 "埃克巴坦那的档案"
 ecbatana_gathering_place:0 "埃克巴坦纳——聚集之地"
 ecbatana_seven_citadels:0 "埃克巴坦纳七堡"
 gain_12_free_investment_tt:0 "获得 #Y 12#! 无偿省份投资"
 gain_6_free_investment_tt:0 "获得 #Y 6#! 无偿省份投资"
 gain_8_free_investment_tt:0 "获得 #Y 8#! 无偿省份投资"
 holy_bazaars:0 "大巴扎"
 holy_metropolis_ardabil:0 "繁华的阿尔达庇勒大都会"
 keeping_the_faith:0 "坚守信仰"
 lake_matiene:0 "巩固马提亚努斯湖周边"
 land_of_medes:0 "米底之地"
 light_of_asha:0 "真理的光辉"
 mazandaran_migration:0 "里海贸易路线"
 me_atropatene_1.a:0 "我们有民众的支持，这是我们的福气。"
 me_atropatene_10.a:0 "据说帕萨尔伽戴和波斯波利斯的图书馆里面的藏书是无穷无尽的……"
 me_atropatene_10_desc:0 "《阿维斯塔》在我们的王家图书馆中占有特殊的地位，因为我们认为对这些文本的管理是我们作为统治者的重要职责之一。当居鲁士拥有东西方的土地时，他在埃克巴坦纳获得了我们米底人自己的许多古老文本和这些文本的复制品。也许我们的学者可以再度收回这些艺术和奉献的作品。"
 me_atropatene_10_title:0 "追寻阿维斯塔"
 me_atropatene_11.a:0 "他们的未来生活肯定令人兴奋。"
 me_atropatene_11_desc:0 "尽管 [ROOT.GetCountry.GetCapital.GetName] 成为我们的首都有很多原因，但这不应该削弱拉什特的重要程度，这座城市的历史也是我们自豪的源泉。尽管我们北方表亲的生活方式与我们略有不同，但我们一视同仁，并且我们很高兴地听闻当地的首府正在扩张，以适应不断增长的湖上居民。"
 me_atropatene_11_title:0 "王家精神之旅"
 me_atropatene_12.a:0 "这向我们展示了文明的力量。"
 me_atropatene_12_desc:0 "虽然野蛮的卡多乌西俄伊人已在我们中间生活了很长时间，但他们从前在我们土地上的抢夺和扩张也是历史事实，他们有时表现出独立的性格，让人回想起他们以前生活的方式。值得庆幸的是，[ROOT.GetCountry.GetRuler.GetName] 最近实施了一些举措，来安抚这些凶猛的人的反叛倾向。"
 me_atropatene_12_title:0 "卡多乌西俄伊的忠诚"
 me_atropatene_13.a:0 "毕竟，我们都是阿胡拉马兹达的信徒。"
 me_atropatene_13_desc:0 "高贵的卡杜西亚人是一个与我们没有太大不同的民族，他们的传统和习俗与我们很接近，每个人都能看出他们似乎与我们系出同源。如果他们完全接受米底的生活方式，也并非对他们历史的可怕背叛，而是承认我们都拥有同样的过去。"
 me_atropatene_13_title:0 "开化卡杜西亚"
 me_atropatene_14.a:0 "我们都知道战斗不期将至。"
 me_atropatene_14.a.tt:0 "#Y 阿特罗帕忒涅#! 将获得米底区域的全部宣称。"
 me_atropatene_14_desc:0 "今天早上的第一件事是一个简短的消息，我们对米底的宣称已经完成了——接下来就是下令开战了。"
 me_atropatene_14_title:0 "宣称米底"
 me_atropatene_15.a:0 "这可比那些腌制的咸鱼好吃多了。"
 me_atropatene_15_desc:0 "尽管在马提亚努斯湖水域捕捞的船只很少，甚至不如里海，但我们很感谢有渔船去那儿捕捞。对于一个像我们这样有很多山和丘陵的国家来说，当地拥有新鲜的食物来源是一件幸事，人们无疑会涌向我们控制的这些地区——干得好，[ROOT.GetCountry.GetRuler.GetName]。"
 me_atropatene_15_title:0 "巩固马提亚努斯湖周边"
 me_atropatene_16.a:0 "你能这么说真是我的荣幸。"
 me_atropatene_16_desc:0 "[GetProvince('(int32)1595').GetName]，作为我国的骄傲和倾力建造的城市，终于超越了它过往的建成区，从一个坐落在山麓的城市发展为一省要冲的大都市。这是对 [ROOT.GetCountry.GetRuler.GetName] 远见卓识和领导能力的有力证明——如果没有他们，这一切哪能完成？"
 me_atropatene_16_title:0 "米底亚的大都会"
 me_atropatene_17.a:0 "谁能为我指点迷津？"
 me_atropatene_17_desc:0 "最近，未经穆护允许的异端教义在 [GetProvince('(int32)1515').GetName] 变得流行起来。甚至像 [ROOT.GetCountry.GetRuler.GetName] 这样的天才都为之内心动摇。一些祭司声称这些被称为谎言（Druj）的教义是引人走向毁灭的低语，分享这些教义已经成为一种近乎叛国的罪行。真的，我们不知道未来将走向何方。"
 me_atropatene_17_title:0 "默默无名的异端"
 me_atropatene_18.a:0 "愿我们的光明照耀周遭的黑暗！"
 me_atropatene_18_desc:0 "尽管追寻正道是困难的，尽管是我们之间最虔诚的人也不免有动摇之时，但如果我们坚持神圣教义中的真理，我们就能在光明中行走，我们的康庄大道有着真理（Asha）的支持。通过避开被称为谎言（Druj）的异端教义，我们内心的光明将化为围绕所有人的爱。"
 me_atropatene_18_title:0 "真理的光辉"
 me_atropatene_19.a:0 "愿我们能够迎接挑战，管理好这样一个圣洁的地方"
 me_atropatene_19_desc:0 "在经历了似乎永恒的事情之后，[GetProvince('(int32)1627').GetName] 的主体结构已经建成，我们建造了一座大都市——这是一个很少有人达到的成就。尽管 [GetProvince('(int32)1515').GetName] 对我们的民众来说将永远是一个重要的地方，但这不会削弱阿尔达庇勒的发展。即使是现在，游行队伍仍在街道上蜿蜒行进，庆祝新城墙的告成。"
 me_atropatene_19_title:0 "繁华的大都会"
 me_atropatene_1_desc:0 "尽管我们的崇高理想——在别人看来无非是建立一个早已逝去的米底人强国——但我们的民众已经完全接受了这个想法，他们站在我们身后，推动我们重现历史。愿幸运之神指引我们，让世界知道我们的意愿！"
 me_atropatene_1_title:0 "米底人的国家"
 me_atropatene_2.a:0 "我们迫不及待地想看到城墙一朝完工！"
 me_atropatene_20.a:0 "我们钦佩那些使贸易成为可能的无畏灵魂。"
 me_atropatene_20_desc:0 "尽管马赞达兰河的水是反复无常的，早上还说一帆风顺，晚上就张开大嘴，在突如其来的风暴中吞没整个船队，但仍有许多勇敢的人在水面上寻找贸易机会，希望冒着生命危险赚取硬币，这仍然是最微弱的可能性。多亏了他们，像[GetProvince('(int32)1515').GetName]和[GetProvince('(int32)1627').GetName]这样的地方的市场仍然充满了各种形式的奢侈品。"
 me_atropatene_20_title:0 "马赞达兰海贸易"
 me_atropatene_21.a:0 "让他们尊重并敬畏我们。"
 me_atropatene_21_desc:0 "在所有的外国都城，甚至包括那些从 [GetProvince('(int32)1515').GetName] 出发，骑着最快的马，需要几个星期才能到达的地方。那儿无论是共和国还是王国，都谈论着一件事——我们米底的崛起，以及米底人是否有潜力成为大地上最伟大的国家。\n\n如果我们的名声已经如此可怕，那么当他们听说我们已经征服了塞琉古帝国，瓦解并摧毁了他们的权力时，他们会说什么呢？"
 me_atropatene_21_title:0 "米底之地"
 me_atropatene_22.a:0 "对我们来说是好事，但请别跟我开玩笑了，顾问。"
 me_atropatene_22_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，虽然不会花太多时间讨论这个问题，但我们确实想让您知道我们的食盐贸易路线已经建成。这当然是一项巨大的工程，但我们很高兴看到大量的税金开始涌入。盐尝起来像蜂蜜一样甜，真是出乎意料，是吧？"
 me_atropatene_22_title:0 "盐业成功发展"
 me_atropatene_23.a:0 "我非常抱歉……请原谅我。"
 me_atropatene_23_desc:0 "通过承认 [ROOT.GetCountry.GetRuler.GetHerHis] 的错误和表现出的真诚悔悟精神，穆护们已经接受了 [ROOT.GetCountry.GetRuler.GetName] 的苦修行为，让他再次与信徒交流。希望这个任性的孩子回到父母安慰怀抱的故事能激励整个国家。"
 me_atropatene_23_title:0 "忏悔"
 me_atropatene_24.a:0 "我们永远不会忘记先辈的信念。"
 me_atropatene_24_desc:0 "虽然有些人可能会嘲笑在宗教事务上花费过多的钱，但我们的民众一直保持着与神的密切关系，即使在民生挣扎的时期亦是如此。因为我们记得他们的奉献，而且我们一直忠于我们的信仰，让琐罗亚斯德的教义指引我们在世界上找到自己的康庄大道。"
 me_atropatene_24_title:0 "坚守信仰"
 me_atropatene_25.a:0 "[ROOT.GetCountry.GetAdjective]的建筑工人是世界上最顶尖的，无人能及！"
 me_atropatene_25_desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，我们收到首席建筑师的来信，他们已经精通了城市建设的技艺，能够在创纪录的时间内建造一座城邦。我们作为建筑之国的声誉已经远近闻名，许多外国国王纷纷向[ROOT.GetCountry.GetCapital.GetName]发来礼貌的询问，希望在淡季时能雇佣我们的工程师。\n\n但对我们来说，幸运的是，根本不存在所谓的淡季；我们的工人和劳动者在[ROOT.GetCountry.GetName]总是有任务需要完成。"
 me_atropatene_25_title:0 "米底大道"
 me_atropatene_26.a:0 "我们的军队从向敌人的家园进发！"
 me_atropatene_26_desc:0 "三百多年前，普拉欧尔铁斯的儿子茨亚哈雷斯带领我们的族人参加了光荣的战斗，打败了弱小的邻国，建立了一个庞大而富有的帝国，这是何等传奇。虽然许多人认为这些故事只不过是睡前故事，是毫无根据的谰言，但 [ROOT.GetCountry.GetRuler.GetName] 已经向世界证明了茨亚哈雷斯的伟大事迹不是神话，是完全可能的……是能够被复制的，[ROOT.GetCountry.GetRuler.GetFirstName] 所取得的永恒荣耀能与之相匹配。"
 me_atropatene_26_title:0 "茨亚哈雷斯的王国"
 me_atropatene_27.a:0 "远离真理的人终究回到真理的怀抱。"
 me_atropatene_27_desc:0 "由于我们全国各地图书馆和学院的建设，像野火一样蔓延的异端已经慢慢被连根拔起。我们再也不用担心这种入侵的杂草会阻塞我们精神葡萄园的养分和水分，我们会被那些献身于研究圣书的学者的智慧和知识所指引。"
 me_atropatene_27_title:0 "正论学者"
 me_atropatene_28_title:0 "大巴扎"
 me_atropatene_29.a:0 "谁能像我们一样伟大？还有谁能抵挡我们？"
 me_atropatene_29_desc:0 "把信使派到大地的各个角落去，告诉从亚特兰蒂斯大洋到呼罗珊的每一个蛮族部落，米底人已经回来了！任何人都无需怀疑我们是否是祖先的真正继承者，因为我们已经赢得了以矛争土，宣布我们荣耀的权利！"
 me_atropatene_29_title:0 "米底的遗产"
 me_atropatene_2_desc:0 "尽管 [GetProvince('(int32)1627').GetName] 目前仍是一个小村庄，除非在这个地区旅行，晚上想吃一顿热饭的人会在此驻留，否则没有人在意此地。我们对这个城市有一个愿景，一个与先知琐罗亚斯德的辉煌相匹配的愿景。当我们完成这个地区的建设时，它将成为这个地区已知的最伟大的城市之一。"
 me_atropatene_2_title:0 "琐罗亚斯德的诞生地"
 me_atropatene_3.a:0 "我们怎能责怪陌生人采用我们的方式？我可不这么认为。"
 me_atropatene_30.a:0 "在我面前鞠躬，面朝地面……"
 me_atropatene_30_desc:0 "荣耀的日子已经到来，只要米底人的记忆还存在，就永远不会忘记。我们不仅极大地扩张了疆域，征服了弱小的邻国，迫使他们陷入自然奴役的状态，而且我们已经达到了历史上只有少数人能声称能达到的高度;我们已经达到了帝国的巅峰状态，在迎来这一刻的时候，我们对自己的伟大感到敬畏。"
 me_atropatene_30_title:0 "拜火教帝国"
 me_atropatene_31.a:0 "卑鄙....."
 me_atropatene_31_desc:0 "到目前为止，慢慢有消息传出 [GetCharacter('(int32)24').GetName] 已死，信使已到达塞琉古帝国的所有省会。在死去的巴西琉斯所统治的广大领土上，笼罩着一种忧郁的情绪，许多总督宣布进入一段哀悼期。\n\n然而，有迹象表明，并不是每个人都感到悲伤，有些人开始怀疑这个悲伤的时刻是否可能是一个机会。"
 me_atropatene_31_title:0 "塞琉古之死"
 me_atropatene_32.a:0 "我们对边境保持警惕。"
 me_atropatene_32_desc:0 "如今，随着商船将这一令人震惊的消息连同货物一起带到遥远的港口，现在举世皆知 [GetCharacter('(int32)24').GetName] 已经过世。正如我们预测的那样，这造成了绝对的混乱——塞琉古帝国的许多属国正在试图脱离束缚，怀疑自由的时刻是否即将到来。我们的军事顾问担心战争即将来临。我们应该密切关注我们的邻居。"
 me_atropatene_32_title:0 "宗主已逝"
 me_atropatene_33.a:0 "我们屏息凝神地看着邻国混乱局面的展开。"
 me_atropatene_33_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，你应该知道塞琉古帝国正处于全面的继承危机之中；现在对于他们来说，一切似乎都要崩溃了。没有人能肯定地说，未来几年我们会遇到什么情况，但应该做好最坏的打算。"
 me_atropatene_33_title:0 "继承危机"
 me_atropatene_34.a:0 "新时代的新首都，挺合适的。"
 me_atropatene_34.b:0 "我们不应该这么惹是生非；一切都需要慢下来。"
 me_atropatene_34_desc:0 "一些顾问已经向我们提议，说如果我们能把首都迁到 [GetProvince('(int32)1595').GetName]，我们将得到贵族和主要家族的全力支持。只需要 [ROOT.GetCountry.GetRuler.GetName] 一声应允，就能让它实现。"
 me_atropatene_34_title:0 "迁都"
 me_atropatene_35.a:0 "醒醒，[ROOT.GetCountry.GetRuler.GetName]！哦醒醒……"
 me_atropatene_35_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 在访问 [GetProvince('(int32)4985').GetName] 时，被邀请去参加一个宗教仪式，[ROOT.GetCountry.GetRuler.GetSheHe] 欣然接受。拉什特的圣贤们因许多事情而闻名，据说他们的萨满掌握着通往精神领域的钥匙。\n\n几天后，[ROOT.GetCountry.GetRuler.GetFirstName] 坐在篝火前，看着圣柏树树枝被扔进火焰。一个装满了闪闪发光的液体的大陶杯不停在人们手中传递，里面的烟雾和令人陶醉的液体的混合物使 [ROOT.GetCountry.GetRuler.GetFirstName] 不禁感觉有点奇怪-——[ROOT.GetCountry.GetRuler.GetSheHe] 张开 [ROOT.GetCountry.GetRuler.GetHerHis] 嘴巴，但一句话也说不出来。\n\n几秒钟后，陷入一片黑暗。"
 me_atropatene_35_title:0 "国王的灵境之旅"
 me_atropatene_36.a:0 "我在哪儿？发生了什么？我…我很害怕。"
 me_atropatene_36_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 正在穿过一片田野，摇曳的青草擦过 [ROOT.GetCountry.GetRuler.GetHerHis] 的长袍。远处有一座祭坛，少女们载歌载舞，兴高采烈地向天堂献上祭品。困惑的 [ROOT.GetCountry.GetRuler.GetFirstName] 仰望天空，看到的景象使 [ROOT.GetCountry.GetRuler.GetHerHis] 的心脏怦怦跳动。一个充满烟雾和闪电的漩涡如眼睛一样俯瞰着大地，四周黯淡无光，见到如此恐怖的景象，[ROOT.GetCountry.GetRuler.GetFirstName] 不禁瘫在地上。"
 me_atropatene_36_title:0 "国王的灵境之旅"
 me_atropatene_37.a:0 "一个好的统治者应当为神和民众服务，而不是相反。"
 me_atropatene_37.b:0 "我来请求一份礼物，一份配得上您的力量的礼物。"
 me_atropatene_37.c:0 "呃....."
 me_atropatene_37.d:0 "我不侍奉主，也不承认神——这是什么愚蠢的事情？"
 me_atropatene_37_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 被[ROOT.GetCountry.GetRuler.GetHerHis] 心中响亮的心声所唤醒。他的思想似乎突破了身体的束缚。[ROOT.GetCountry.GetRuler.GetFirstName] 坐在祭坛前，少女们已经消失了，她们原来在的地方有着数百只动物栖息。\n\n‘凡人，你不该来到这里；你为什么要到灵与影的世界来？’"
 me_atropatene_37_title:0 "国王的灵境之旅"
 me_atropatene_38.a:0 "你们不会相信我看到了什么！"
 me_atropatene_38_desc:0 "‘你的虔诚会得到回报，[ROOT.GetCountry.GetRuler.GetName]——带着天堂的祝福回到你的民众身边。’\n\n[ROOT.GetCountry.GetRuler.GetFirstName] 突然笔直地坐起，让周围的随从和奴隶们松了一口气。虽然 [ROOT.GetCountry.GetRuler.GetSheHe] 昏昏沉沉，有点迷失方向，但似乎发生了奇迹，[ROOT.GetCountry.GetRuler.GetFirstName] 和众神交谈过？他们是在梦里来的吗？"
 me_atropatene_38_title:0 "国王的灵境之旅"
 me_atropatene_39.a:0 "我不知道这是怎么回事……"
 me_atropatene_39_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 笔直地坐起，让周围的随从和奴隶们松了一口气。笑声四起，有人开玩笑说[ROOT.GetCountry.GetRuler.GetFirstName] 喝起酒来像个十岁的孩子。\n\n这件事很快被遗忘了，但几周后，奇怪的事情传遍了整个乡村；鸡不肯下蛋，畜群里的奶有硫磺味。对于这些预兆，祭司们告诉我们，诸神对我们的人民非常恼火，说我们贪婪，不配得到我们所拥有的。"
 me_atropatene_39_title:0 "国王的灵境之旅"
 me_atropatene_3_desc:0 "随着时间的推移，我们各省的文化构成逐渐从自然、混乱的状态趋于同质化，因为所有生活在我们土地上的人最终都选择了像我们一样生活。我们自豪地看到，对于米底的认同日益增强；这将有利于我们向前发展。"
 me_atropatene_3_title:0 "加强米底认同"
 me_atropatene_4.a:0 "我们当地的咸水将继续慷慨地赐予我们盐霜。"
 me_atropatene_40.a:0 "灵啊，饶恕我吧；在您面前我什么都不是！求你顾惜您仆人的性命。"
 me_atropatene_40.b:0 "等一下……我不是在拉什特吗？这只是一个醉酒的梦。"
 me_atropatene_40_desc:0 "少女们突然出现，戴着舞台上的面具，粗暴地抓着[ROOT.GetCountry.GetRuler.GetName]。动物们都转过身来，面对正在上演的奇观，不祥地看着。失魂落魄的声音再次充斥着[ROOT.GetCountry.GetRuler.GetHerHis]的头脑，燃烧着炽热的愤怒。'我不会再问了，你为什么在这里？"
 me_atropatene_40_title:0 "国王的灵境之旅"
 me_atropatene_41.a:0 "谢....谢谢您！我保证再也不过来了。"
 me_atropatene_41_desc:0 "‘你这无知飘流的人，回到你本国去，告诉他们琐罗亚斯德赐福与你。虽然容器并不完美，但你能来这儿就行，[ROOT.GetCountry.GetRuler.GetName]。现在让我们安息吧。’"
 me_atropatene_41_title:0 "国王的灵境之旅"
 me_atropatene_42.a:0 "[ROOT.GetCountry.GetRuler.GetName] 根本不关心神……"
 me_atropatene_42_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在第二天早上醒来后，异常地紧闭双眼，尽管头痛欲裂，在回首都的整个旅途中，他的心情都很沉闷，但还是在日出前离开了[GetProvince('(int32)4985').GetName]。在回家的路上经过当地的一个神庙时，[ROOT.GetCountry.GetRuler.GetFirstName]示意他们不会像传统那样停下来献祭，声称神灵只照顾那些照顾自己的人。"
 me_atropatene_42_title:0 "国王的灵境之旅"
 me_atropatene_43.a:0 "为什么诸神要这样惩罚我们？"
 me_atropatene_43_desc:0 "来自 [GetProvince('(int32)4985').GetName] 的一个可怕的消息。看起来 [ROOT.GetCountry.GetRuler.GetName] 在一个宗教仪式上喝醉了，昏倒时 [ROOT.GetCountry.GetRuler.GetHerHis] 头在地上摔伤，自此长眠不起。我们所有最好的医生和智者聚集在一起试图帮助 [ROOT.GetCountry.GetRuler.GetFirstName] ，但尽管有最好的医疗服务，[ROOT.GetCountry.GetRuler.GetSheHe] 仍旧睡了三天才醒来。\n\n当 [ROOT.GetCountry.GetRuler.GetSheHe] 开口时，看起来清楚而更可怕的事情发生了；过去的 [ROOT.GetCountry.GetRuler.GetFirstName] 已经不存在了。"
 me_atropatene_43_title:0 "国王的灵境之旅"
 me_atropatene_45.a:0 "我们发现自己身处一个残酷的世界……"
 me_atropatene_45_desc:0 "在过去的30年里，我们的民众在各方势力的夹缝中艰难生存，就像来到镇上的马戏团演员走钢丝一样。我们被阿契美尼德人征服，变成了一个附属国，当战争的号角响起时，我们履行了我们的誓言，在高加米拉战役中光荣地与马其顿人作战，尽管那天众神没有给我们带来胜利。\n\n但是尽管彼此敌对，亚历山大还是看出了 [ROOT.GetCountry.GetRuler.GetName] 的能力。[ROOT.GetCountry.GetRuler.GetFirstName] 被允许作为总督继续统治 [ROOT.GetCountry.GetName]。但亚历山大的死改变了一切，尽管我们这代人第一次享受自由，但我们现在仍被贪婪的大国包围，他们正在掂量我们的力量，挤压我们的边界。希望 [ROOT.GetCountry.GetRuler.GetFirstName] 在这里能够稳定地统治我们很多年，因为我们不知道未来会发生什么。"
 me_atropatene_45_title:0 "在风暴中远航"
 me_atropatene_46.a:0 "使用阿特罗帕忒涅旗帜和标准的成立米底颜色。"
 me_atropatene_46.b:0 "使用阿特罗帕忒涅旗帜和新的大米底绿色。"
 me_atropatene_46.c:0 "新的米底旗帜和标准的成立米底颜色。"
 me_atropatene_46.d:0 "新的米底旗帜和新的大米底绿色。"
 me_atropatene_46_desc:0 "如果我们要继续向辉煌的未来进军，我们必须有一个可以高举的骄傲的标志。我们是要背负我们新近崛起的印记呢，还是明天要重温我们昔日的辉煌？"
 me_atropatene_46_title:0 "米底的形象"
 me_atropatene_47.a:0 "这就像把水变成酒……"
 me_atropatene_47_desc:0 "为了创造人尽皆知的埃克巴坦纳财富之城的形象，城内的宝库内应当拥有大量的战利品。据说亚历山大一度将帕萨尔伽戴和波斯波利斯的宝藏留在了这里，但他也掠走了埃克巴坦纳本地储存的财富。通过一些壮举，我们应当对此有所建树。"
 me_atropatene_47_title:0 "埃克巴坦纳的宝藏"
 me_atropatene_48.a:0 "我们将绕着七堵墙转啊转，直到太阳落山。"
 me_atropatene_48_desc:0 "有一个人声称亲眼目睹过城墙的辉煌，他写道，每一堵墙都比前一堵墙大得多，宫殿和宝藏都在最后一堵墙的后面被严密守卫着。每一堵墙都是充满活力的颜色，有着奶油般地色调，金色和银色的装饰，精心制作的防御工事。这不仅是一种吹捧，也是对米底艺术、身份及其能力的一种诠释。"
 me_atropatene_48_title:0 "米底七墙"
 me_atropatene_49.a:0 "我们会在有空的时候查看档案。"
 me_atropatene_49.b:0 "指派我们最聪明的学者对所有档案进行分类。"
 me_atropatene_49_desc:0 "档案似乎无穷无尽，阿契美尼德王朝甚至最近的塞琉古占领者的卷轴和石碑填满了我们的储藏室。希望亚历山大和塞琉古没有销毁或转移太多的记录。事实上，完全分析所有这些文本可能需要数年时间。在我们更好地保护和清理所有阿契美尼德和希腊人的图书馆之前，我们的行动不可能永远完全保密。我们该怎么去寻找居鲁士的秘密呢？"
 me_atropatene_49_title:0 "档案的秘密"
 me_atropatene_4_desc:0 "无论是用于腌制食物还是作为调味料，人们都无法逃避对盐的需求，那些无法获得这种自然资源的人通常会支付溢价来获得各种各样的东西。值得庆幸的是，我们在生产盐的省份进行了投资，现在每个人，无论是住在盐沼附近还是深山里，都可以享受到我们投资的果实。"
 me_atropatene_4_title:0 "盐业繁荣"
 me_atropatene_5.a:0 "的确，在我们心中，这座城市有着特殊的位置。"
 me_atropatene_50.a:0 "让波斯人再次拥有自治权，但要确保他们保持与米底的关系。"
 me_atropatene_50.b:0 "我们必须紧盯波斯人，以免他们再次起义。"
 me_atropatene_50.c:0 "宽恕是不可能的——焚掠波斯！"
 me_atropatene_50_desc:0 "档案似乎无穷无尽，阿契美尼德王朝甚至最近的塞琉古占领者的卷轴和石碑填满了我们的储藏室。希望亚历山大和塞琉古没有销毁或转移太多的记录。事实上，完全分析所有这些文本可能需要数年时间。在我们更好地保护和清理所有阿契美尼德和希腊人的图书馆之前，我们的行动不可能永远完全保密。我们该怎么去寻找居鲁士的秘密呢？"
 me_atropatene_50_title:0 "波斯的命运"
 me_atropatene_5_desc:0 "[GetProvince('(int32)1515').GetName]，位于马提亚努斯湖以南的一条河旁，被誉为我国最繁华的城市之一，许多人都渴望在这座山麓城市定居下来。谁又能责怪他们呢？人们可以在集市上闲逛一整天，神殿里充斥着安静的祈祷者的低语，剧院里则满是对最新舞台剧的喧闹唱诵。我们当然为甘扎克感到骄傲，并相信它不久会变得更好。"
 me_atropatene_5_title:0 "甘扎克圣城"
 me_atropatene_6.a:0 "好吧，好吧，我保证我会挤出时间来的"
 me_atropatene_6_desc:0 "当 [ROOT.GetCountry.GetRuler.GetName] 的事务大半都已处理完时，他终于有一些空闲时间去卡什马尔朝圣，参观当地的神殿，尽管这对寻常人来说是很常见的事情。[ROOT.GetCountry.GetRuler.GetFirstName] 的顾问们温和地建议，在此地多花几天时间进行沉思冥想，这会对 [ROOT.GetCountry.GetRuler.GetHerHis] 精神状态产生奇效。毕竟，我们不希望看到我们的领袖过于疲劳，因为还有很多工作要做。"
 me_atropatene_6_title:0 "神秘的卡什马尔圣柏"
 me_atropatene_7.a:0 "愿我们能追随先人的脚步。"
 me_atropatene_7_desc:0 "通过恢复穆护的职位，我们将重新确立国家的正统信仰，提高我们在国内的声望和知名度。穆护是一个受人尊敬、学识渊博的宗教阶层，在开明的时代能指导我们的民众处理宗教事务。庆祝活动会在 [ROOT.GetCountry.GetCapital.GetName] 举办。这将是我记忆中最美好的一天。"
 me_atropatene_7_title:0 "恢复穆护"
 me_atropatene_8.a:0 "希望是我为你报了仇，佩尔狄卡斯……对不起。"
 me_atropatene_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 收到了来自 [ROOT.GetCountry.GetRuler.GetHerHis] 在敌国安插的间谍的消息。[GetCharacter('(int32)24').GetName]，那个谋害了佩尔狄卡斯的杂种终于死了——不管他是死于外国刺客之手，还是死于国内不满其的贵族所策划的阴谋，这都不重要。愿他的灵魂永恒游荡，不得安息，愿他永远无法进入天堂。"
 me_atropatene_8_title:0 "为了我的儿子"
 me_atropatene_9.a:0 "财富可能会腐蚀心智，但我们会保持纯洁。"
 me_atropatene_9_desc:0 "[ROOT.GetCountry.GetCapital.GetName] 在 [ROOT.GetCountry.GetRuler.GetName] 的命令下不间断地进行城建工作，最终将此地变成了该地区的名城大邑。[ROOT.GetCountry.GetRuler.GetFirstName] 在宣布动工之前就率先命令工程师和建筑师仔细规划，尽管这座城市的声誉是基于我们祖先的名字，但我们在这里的创造超出了我们祖先。"
 me_atropatene_9_title:0 "阿特罗帕忒涅宝库"
 median_legacy:0 "米底的遗产"
 metropolis_of_media:0 "米底亚的大都会"
 obscurity_of_druj:0 "默默无名的异端"
 prosperity_glittering_salt:0 "盐业繁荣"
 reading_cyrus_archives:0 "查阅居鲁士的档案"

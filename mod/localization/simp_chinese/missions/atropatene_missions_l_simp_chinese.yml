 treasures_of_ecbatana:0 "埃克巴坦纳的宝物"
 treasures_of_ecbatana_desc:0 "长期以来，米底亚的王座一直赏心悦目，金、银和各种各样的宝石排列在墙壁和家具上。用铂金、石墨、锑和天然铁建造的宫殿更是价值非凡。"
 treasures_of_pasagardae:0 "帕萨尔伽戴的宝物"
 treasures_of_pasagardae_desc:0 "它曾是居鲁士大帝的第一个首都，用以纪念他征服了米底王阿斯提阿格斯。帕萨尔伽戴的宫廷花园里拥有着早期阿契美尼德时代的许多美丽装饰。"
 treasures_of_persepolis:0 "波斯波利斯的宝物"
 treasures_of_persepolis_desc:0 "波斯波利斯是大流士的杰作，是阿契美尼德建造的最豪华的建筑群之一，既是首都，也是新年祭祭祀的场所。这些遗迹是亚历山大烧毁这座城市后，仅存的关于这座城市财富的回忆。"
 treasury_of_ganzak:0 "甘扎克宝库"
 vendidad_collection:0 "万迪达德本集"
 vendidad_collection_desc:0 "可能早在成为琐罗亚斯德教经典之前，万迪达德就已经作为一种口头的习惯法规存在了，这是一种吓走妖魔和邪恶灵魂的表演，被认为受到了穆护团体的影响，他们本身就有着米底的起源。"
 visperad_collection:0 "维斯帕拉德本集"
 visperad_collection_desc:0 "只在日出和中午时诵读，维斯帕拉德，意为‘所有的赞助者’或‘所有的首领’，是对阿胡拉马兹达一切美好的造物的颂扬和赞美，在写作方法和内容上酷似《亚斯纳》。"

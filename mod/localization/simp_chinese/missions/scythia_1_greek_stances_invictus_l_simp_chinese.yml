 startup_events.9.b:0 "让我们重拾辉煌！"
 startup_events.9.desc:0 "五十年前，斯基泰的疆域西接色雷斯部落之外的海洋，东止于那条划定伟大黑海疆界的右岸河流。彼时，伟大的阿忒亚斯国王率领我族骑兵，向四方已知民族发起壮阔的冲锋。早在那之前，我族便以征服者与终结者闻名于世——足迹遍及亚述帝国末期的尼尼微古城，东抵米底诸邦，更曾直抵法老尼科二世的城门之下，令其瑟瑟发抖。\n\n然而当马其顿的腓力二世最终在小斯基泰平原的战场上击溃暮年的阿提亚斯，一切都结束了。自此我们日渐衰微，疆域不断收缩，在希腊世界与敌对部落的合围下，族人被迫退守陶里半岛。我们正行走在刀锋之上，族人皆知前路未卜。一切都系于此刻——我们将如何前行。"

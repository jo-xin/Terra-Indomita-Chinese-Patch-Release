 me_scythia_01_greek_stance.1.a:0 "兽群走到哪里，马匹就跟到哪里。"
 me_scythia_01_greek_stance.1.desc:0 "我们与庞托斯-欧西诺斯海岸的希腊城市一直有着紧密的联系，有好有坏。我们不能假装这种关系没有影响我们的生活方式，没有影响我们自己人的生活。但现在是我们决定我们的立场--我们是谁的时候了。"
 me_scythia_01_greek_stance.1.t:0 "$scythia_mission_01_greek_stance$：身份危机"
 me_scythia_01_greek_stance.10.a:0 "我们将视这些新朋友为盟友，并为我们同样有利的安排而欢欣鼓舞。"
 me_scythia_01_greek_stance.10.at:0 "#Y 堤拉斯#!可能会成为一个#Y 仆从国#!"
 me_scythia_01_greek_stance.10.b:0 "我们会摆出一副友好的面孔，并......向他们伸出援手。"
 me_scythia_01_greek_stance.10.bt:0 "#Y 堤拉斯#! 可能会成为一个#Y 盟友#!。"
 me_scythia_01_greek_stance.10.c:0 "让我们发送一个友谊的象征，没有别的。"
 me_scythia_01_greek_stance.10.ct:0 "#Y 堤拉斯#! 很可能会拒绝我们的请求。"
 me_scythia_01_greek_stance.10.desc:0 "啊，提拉斯，尼科尼翁的老大哥，在其名下河流前的一个大港口。在我们过去对希腊人的蔑视中，我们常常忽略了这座希腊城市。但现在是新的一天，我们必须寻求与他们建立更好的关系，以便获得沿着那条水路行驶的财富。"
 me_scythia_01_greek_stance.10.t:0 "$scythia_mission_01_greek_stance_task_2$：与提拉斯的关系"
 me_scythia_01_greek_stance.100.a:0 "他们都欠我的支持。"
 me_scythia_01_greek_stance.100.b:0 "我将从最强大的人那里获取。"
 me_scythia_01_greek_stance.100.c:0 "我要让他们都互相竞争。"
 me_scythia_01_greek_stance.100.desc:0 "当我们把目光投向邻近的土地和民族时，很明显，在我们的道路上有许多挑战。为了应对这些挑战，我们需要强壮的男人和女人在我们的队伍中战斗--真正的平原主人。但皇室库房有其局限性。现在是我拜访各大家族族长的时候了。"
 me_scythia_01_greek_stance.100.t:0 "$scythia_mission_01_greek_stance_task_25$：收集资金"
 me_scythia_01_greek_stance.101.a:0 "我们的方式已经为我们服务了好几代。"
 me_scythia_01_greek_stance.101.b:0 "外国雇佣兵可能会被证明相当有用。"
 me_scythia_01_greek_stance.101.c:0 "我们必须不惜一切代价找到这个人。"
 me_scythia_01_greek_stance.101.ct:0 "一个非常强大的将军将出现在你的法庭上，训练你的士兵。"
 me_scythia_01_greek_stance.101.desc:0 "现在我们有了必要的资金，我们需要与[SCOPE.sChar('current_warchief').GetName]，即总督，合作建立训练设施，来壮大部落。经过长时间的商议，他们向我们提出了几个方案。最简单的方法是以传统的方式进行训练，由[SCOPE.sChar('current_warchief').GetName]亲自操作士兵，这是他们的工作。虽然[SCOPE.sChar('current_warchief').GetName]是一个身经百战的战士和一个合格的领导者，但他们知道自己的极限。我们已经得到了两个备选方案。\n\n由于我们与沿海的希腊城邦一直保持着联系，我们听说了他们战士的功绩和能力，甚至听说他们经常把自己当作雇佣兵卖给任何人，只要价格合适。[SCOPE.sChar('current_warchief').GetName]有一些私人关系，可以引进一个雇佣军团，帮助训练部队，与他们并肩作战，但要付出代价，还要有一些土地。\n\n而另一个机会，虽然很奇怪，根据一些传闻，说有一个奇怪的人，一个像我们一样的马王，除了一张弓和他的母马，什么都没有，在北方的领土上游荡，生活在马背上。[SCOPE.sChar('current_warchief').GetName]相信他们可以找到这个人，并诱使他训练和领导军队——但肯定会有奇怪的条件......"
 me_scythia_01_greek_stance.101.t:0 "$scythia_mission_01_greek_stance_task_25$： 训练军队"
 me_scythia_01_greek_stance.104.a:0 "我们不需要援助。"
 me_scythia_01_greek_stance.104.b:0 "也许有些建议是最好的。"
 me_scythia_01_greek_stance.104.c:0 "雇佣希腊人，但我们也会建立我们的防御。"
 me_scythia_01_greek_stance.104.desc:0 "你的保镖[SCOPE.sChar('current_bodyguard')GetName]在午后时分来找你，对你准备士兵进攻我们周围的许多城邦的工作进行了评论。然而，[SCOPE.sChar('current_bodyguard')GetName]指出，我们自己很容易受到攻击，如果有这样的事情发生的话。他担心你和贵族们的安全。\n\n虽然我们可以尝试用我们熟悉的方式来保卫我们的边界和我们的首都，但向希腊人咨询一下他们的防御措施可能是明智的，他们可以雇用一个伟大的筑墙工人为我们提供建议。"
 me_scythia_01_greek_stance.104.t:0 "$scythia_mission_01_greek_stance_task_26$： 安全措施"
 me_scythia_01_greek_stance.108.a:0 "协助牧民和他们漂泊的动物。"
 me_scythia_01_greek_stance.108.b:0 "我们的经济依赖于我们丰富的剩余粮食"
 me_scythia_01_greek_stance.108.c:0 "强化田地，驱赶牧民。"
 me_scythia_01_greek_stance.108.desc:0 "我们的仲裁员，[SCOPE.sChar(current_arbitrator)GetName]，被派去确保庄稼地得到良好的管理，在那里种植谷物的男人和女人之间没有争议。然而，[SCOPE.sChar('current_arbitrator')GetName]意识到，有几个地方的牧群正在侵占肥沃的河边土地。有几个家庭正在抱怨庄稼受损和田地被踩踏。\n\n我们希望看到我们的剩余谷物贸易增加，但这样做很难不打乱牧民和他们的迁徙习惯--这就是我们在这里连绵的山丘和永远的平原上的生活方式。我们应该怎么做？"
 me_scythia_01_greek_stance.108.t:0 "$scythia_mission_01_greek_stance_task_27$：土地的布局"
 me_scythia_01_greek_stance.11.a:0 "我们将以盟友的价格向他们出售我们最想要的东西--奴隶。"
 me_scythia_01_greek_stance.11.at:0 "作为贸易协议的一部分，至多#Y 5#!个奴隶将迁往#Y 奥尔比亚#! 。#Y 斯基泰#!每移动一人口，就会得到#G 25#!金币。#Y 奥尔比亚#! 可能会成为#Y 盟友#!。"
 me_scythia_01_greek_stance.11.b:0 "就像喜爱希腊人的老斯基勒斯那样，让我们对他们的城邦慷慨解囊。"
 me_scythia_01_greek_stance.11.bt:0 "#Y 奥尔比亚#! 可能会成为一个#Y 仆从国#!。"
 me_scythia_01_greek_stance.11.c:0 "让我们送去友谊的象征，仅此而已。"
 me_scythia_01_greek_stance.11.ct:0 "#Y 奥尔比亚#! 可能会拒绝我们的请求。"
 me_scythia_01_greek_stance.11.desc:0 "奥尔比亚，一个长期被忽视的兄弟，我们的人民。难道不是Scyles认为他们是足够好的人，可以在他们的城墙内购买一个家？他们经常购买我们的粮食和商品，在公海上出售。也许现在是我们承认他们为永久伙伴的时候了。"
 me_scythia_01_greek_stance.11.t:0 "$scythia_mission_01_greek_stance_task_2$： 与奥尔比亚的联系"
 me_scythia_01_greek_stance.112.a:0 "利姆奈奥伊不值得投入资源。"
 me_scythia_01_greek_stance.112.b:0 "我们将赞助建立一个由我们统治的城邦。"
 me_scythia_01_greek_stance.112.bt:0 "#Y [GetProvince('(int32)4552').GetName]#! 将得到一些建筑和居民。"
 me_scythia_01_greek_stance.112.c:0 "告诉[SCOPE.sChar('current_magistrate')GetName]为这个宠物项目[SCOPE.sChar('current_magistrate')GetHerHim]自己工作。"
 me_scythia_01_greek_stance.112.d:0 "给他们提供资金"
 me_scythia_01_greek_stance.112.desc:0 "我们的行政官，[SCOPE.sChar('current_magistrate')GetName]，长期以来一直对Limnaioi这个不断增长的热门地区感兴趣，该地区位于一个大河口，是商船停靠和交易货物的天堂。[SCOPE.sChar('current_magistrate')GetName]坚持认为，这个地方将是贸易港口城市的最佳地点，可以促进我们的经济。然而，[SCOPE.sChar('current_magistrate')GetName]也建议我们赞助在这个地方建立一个城邦，他们可能会把它变成一个依赖性的贸易伙伴，成为我们的受益者。最好的行动方案是什么？"
 me_scythia_01_greek_stance.112.e:0 "利姆奈奥伊现在的情况就很好。"
 me_scythia_01_greek_stance.112.f:0 "告诉[SCOPE.sChar('current_magistrate')GetName]把所有的东西都投进去。"
 me_scythia_01_greek_stance.112.t:0 "$scythia_mission_01_greek_stance_task_28$：池塘里的鱼更友好"
 me_scythia_01_greek_stance.12.a:0 "我们将平息陶里人的叛乱，并向刻耳索涅苏斯提供一队我们自己的骑手。"
 me_scythia_01_greek_stance.12.at:0 "#Y 最多四个领土将获得斯基泰巡逻队#!。#Y 刻耳索涅苏斯#! 可能会成为盟友。"
 me_scythia_01_greek_stance.12.b:0 "陶里的海军可以成为我们的资产。让人觉得我们在为希腊城市减负。"
 me_scythia_01_greek_stance.12.bt:0 "#Y 卡罗斯港#!易主。#Y 刻耳索涅苏斯#!可能会成为仆从国。#Y 斯基泰#!可能会会获得陶里海盗舰队。"
 me_scythia_01_greek_stance.12.c:0 "向他们提供空洞的承诺。只有我们的力量才能说服他们。"
 me_scythia_01_greek_stance.12.ct:0 "#Y 刻耳索涅苏斯#!可能会拒绝我们的提议。"
 me_scythia_01_greek_stance.12.desc:0 "陶里人是一个奇怪的民族，有时被希腊人统治，有时又摆脱了他们的枷锁。刻耳索涅苏斯城试图控制他们，但人们永远无法确定，特别是当卡洛斯‑利门港经常派出海盗破坏希腊船只时。也许他们可以为我们所用，使我们更接近刻耳索涅苏斯。"
 me_scythia_01_greek_stance.12.t:0 "$scythia_mission_01_greek_stance_task_2$：与刻耳索涅苏斯的联系"
 me_scythia_01_greek_stance.13.a:0 "我很想说，但在这个危险的时代，我们可以利用他们的保护。与他们在一起比与他们作对更好。"
 me_scythia_01_greek_stance.13.at:0 "#Y 提拉斯#!成为了#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.13.b:0 "也许一个军事联盟可以安抚他们，并为我们提供利益回报？"
 me_scythia_01_greek_stance.13.bt:0 "#Y 堤拉斯#!成为#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.13.c:0 "我们不会给他们任何好处。"
 me_scythia_01_greek_stance.13.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.13.desc:0 "来自斯基泰民族的使者已经抵达，带着他们统治者的信息。"
 me_scythia_01_greek_stance.13.desc_1:0 "\n他们为我们提供了大量的金银财宝，试图将我们争取到他们的事业中。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.13.desc_2:0 "\n他们向我们提供了一定数量的银子，试图争取我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.13.desc_3:0 "\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_scythia_01_greek_stance.13.t:0 "$scythia_mission_01_greek_stance_task_2$：来自斯基泰的使者"
 me_scythia_01_greek_stance.14.a:0 "为了确保我们的生存，我们必须接受附庸地位。给他们派一个顾问，以确保我们的利益得到提升。"
 me_scythia_01_greek_stance.14.at:0 "#Y 奥尔比亚#!成为了#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.14.b:0 "也许一个军事联盟可以安抚他们，并为我们提供利益回报？"
 me_scythia_01_greek_stance.14.bt:0 "#Y 奥尔比亚#!成为了#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.14.c:0 "我们不会给他们任何好处。"
 me_scythia_01_greek_stance.14.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.14.desc:0 "来自斯基泰国家的使者已经抵达，带着他们统治者的信息。"
 me_scythia_01_greek_stance.14.desc_1:0 "\n他们为我们提供了大量的奴隶，试图让我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.14.desc_2:0 "\n他们向我们提供大量的金银财宝，试图赢得我们的支持。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.14.desc_3:0 "\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_scythia_01_greek_stance.14.t:0 "$scythia_mission_01_greek_stance_task_2$：来自斯基泰的使者"
 me_scythia_01_greek_stance.15.a:0 "我们不能与斯基泰为敌。向他们提供附庸地位，并送他们一些船只。"
 me_scythia_01_greek_stance.15.at:0 "#Y 刻耳索涅苏斯#!成为#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.15.b:0 "也许军事联盟可以安抚他们，并为我们提供利益回报？"
 me_scythia_01_greek_stance.15.bt:0 "#Y 刻耳索涅苏斯#!成为了#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.15.c:0 "我们不会给他们任何好处。"
 me_scythia_01_greek_stance.15.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.15.desc:0 "来自斯基泰国家的使者已经抵达，带着他们统治者的信息。"
 me_scythia_01_greek_stance.15.desc_1:0 "\n他们向我们提供了一些他们的骑手，以便我们可以更好地巡逻我们的土地并控制本地的陶里人。作为交换，他们要求提供军事援助。"
 me_scythia_01_greek_stance.15.desc_2:0 "\n他们向我们提供了大量的金银财宝，试图将我们争取到他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.15.desc_3:0 "\n尽管他们的话很动听，但他们提供的礼物或贿赂却很少。"
 me_scythia_01_greek_stance.15.t:0 "$scythia_mission_01_greek_stance_task_2$：来自斯基泰的使者"
 me_scythia_01_greek_stance.16.a:0 "我们的努力已经取得了成功!"
 me_scythia_01_greek_stance.16.at:0 "#Y 提拉斯#!成为#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.16.b:0 "我相信，这是一个互利的联盟。"
 me_scythia_01_greek_stance.16.bt:0 "#Y 堤拉斯#!成为#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.16.c:0 "他们怎么敢这样侮辱我们？"
 me_scythia_01_greek_stance.16.ct:0 "我们什么都没得到，什么都没有......"
 me_scythia_01_greek_stance.16.desc:0 "泰拉斯的大使们已经带着他们的回应来了。"
 me_scythia_01_greek_stance.16.desc_1:0 "\n他们已经接受了我们慷慨的提议，现在将成为我们的仆从国。"
 me_scythia_01_greek_stance.16.desc_2:0 "\n他们已经接受了我们的结盟提议，并希望与我们合作以获得更美好的未来。"
 me_scythia_01_greek_stance.16.desc_3:0 "\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_scythia_01_greek_stance.16.t:0 "$scythia_mission_01_greek_stance_task_2$：来自提拉斯的回应"
 me_scythia_01_greek_stance.17.a:0 "我们的努力是成功的!"
 me_scythia_01_greek_stance.17.at:0 "#Y 奥尔比亚#!成为了#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.17.b:0 "我相信，这是一个互利的联盟。"
 me_scythia_01_greek_stance.17.bt:0 "#Y 奥尔比亚#!成为了#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.17.c:0 "他们怎么敢这样侮辱我们？"
 me_scythia_01_greek_stance.17.ct:0 "我们什么都没得到，什么都没有......"
 me_scythia_01_greek_stance.17.desc:0 "奥尔比亚的大使们已经带着他们的回应来了。"
 me_scythia_01_greek_stance.17.desc_1:0 "\n他们已经接受了我们的慷慨提议，现在将成为我们的仆从国，为了巩固这种关系，他们给我们送来了他们的一个智囊团。"
 me_scythia_01_greek_stance.17.desc_2:0 "\n他们已经接受了我们的结盟提议，并希望与我们合作以获得更美好的未来。"
 me_scythia_01_greek_stance.17.desc_3:0 "\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_scythia_01_greek_stance.17.t:0 "$scythia_mission_01_greek_stance_task_2$：来自奥尔比亚的回应"
 me_scythia_01_greek_stance.18.a:0 "我们的努力是成功的！我们的新附庸提供了它的海军。我们的新附庸国向我们提供了它的海军。"
 me_scythia_01_greek_stance.18.at:0 "#Y 刻耳索涅苏斯#!成为#Y 斯基泰#!的#Y 仆从国#!。一支小型舰队出现在#Y 刻耳索涅苏斯#!在我们的控制之下"
 me_scythia_01_greek_stance.18.b:0 "我相信，这是一个互利的联盟。"
 me_scythia_01_greek_stance.18.bt:0 "#Y 刻耳索涅苏斯#!成为了#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.18.c:0 "他们怎么敢这样侮辱我们？"
 me_scythia_01_greek_stance.18.ct:0 "我们什么都没得到，什么都没有..."
 me_scythia_01_greek_stance.18.desc:0 "杰森尼斯的大使们已经带着他们的回应来了。"
 me_scythia_01_greek_stance.18.desc_1:0 "\n他们已经接受了我们慷慨的提议，现在将成为我们的仆从国，为了巩固这种关系，他们赠送给我们一支小型舰队。"
 me_scythia_01_greek_stance.18.desc_2:0 "\n他们已经接受了我们的结盟提议，并希望与我们合作，以实现更美好的未来。"
 me_scythia_01_greek_stance.18.desc_3:0 "\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_scythia_01_greek_stance.18.t:0 "$scythia_mission_01_greek_stance_task_2$：来自刻耳索涅苏斯的回应"
 me_scythia_01_greek_stance.2.a:0 "这条路对我们来说是明确的!"
 me_scythia_01_greek_stance.2.at:0 "任务'#Y 成为或不成为希腊人#!'已经#G 完成#!"
 me_scythia_01_greek_stance.2.desc:0 "最近的考验考验了我们的决心，我们对斯基泰人未来愿景的承诺。我们已经表明，我们不会被动摇或吓倒。北方的骑手们已经准备好超越我们的边界，将我们永恒的习俗传播给其他人。"
 me_scythia_01_greek_stance.2.t:0 "$scythia_mission_01_greek_stance$： 确保遗产"
 me_scythia_01_greek_stance.20.a:0 "我们将答应他们的要求，但要为我们的合作付出高昂的代价。"
 me_scythia_01_greek_stance.20.at:0 "我们将发出信号，表明我们愿意以牺牲一些人气为代价进行交易。"
 me_scythia_01_greek_stance.20.b:0 "斩杀信使，把他的尸体送回去，并组建一支庞大的队伍--把头插在将军的矛上。"
 me_scythia_01_greek_stance.20.bt:0 "我们可能会因为这种侮辱而激怒博斯普鲁斯人。"
 me_scythia_01_greek_stance.20.desc:0 "今天早上，一位信使来到这里，他是博斯普鲁斯王国统治者的私人代理人。他们已经认识到我们日益增长的海军存在，并且似乎相当不高兴。他们不希望发生战争，因为他们已经有辛迪卡人和迈俄提亚人需要担心，他们提出要购买我们的一个港口，并要求我们摧毁我们花了几个月时间建造的所有其他港口。"
 me_scythia_01_greek_stance.20.t:0 "$scythia_mission_01_greek_stance_task_4$： 水的权利"
 me_scythia_01_greek_stance.21.a:0 "仔细一想，血的代价是他们要付出的。召集我们的部队!"
 me_scythia_01_greek_stance.21.at:0 "#Y 博斯普鲁斯王国#!以#G 霸权#!战争目标向#Y 斯基泰#!宣战。"
 me_scythia_01_greek_stance.21.b:0 "他们开出的价格是#G 500#! 金币，以换取我们想要的土地。当然，我们很快就能赚回来。"
 me_scythia_01_greek_stance.21.bt:0 "#Y 博斯普鲁斯王国#!向#Y 斯基泰#!支付#G 500#!黄金。"
 me_scythia_01_greek_stance.21.c:0 "嗯，看来他们是在虚张声势。战争不会在这个时候发生。"
 me_scythia_01_greek_stance.21.ct:0 "什么也没有发生。"
 me_scythia_01_greek_stance.21.desc:0 "我们收到斯基泰的消息，说我们对他们的土地感兴趣。"
 me_scythia_01_greek_stance.21.desc_1:0 "\n他们似乎愿意与我们达成交易。多么幸运啊!"
 me_scythia_01_greek_stance.21.desc_2:0 "\n亵渎!他们杀了我们的信使，并以最令人不安的方式斥责了我们的提议。"
 me_scythia_01_greek_stance.21.t:0 "$scythia_mission_01_greek_stance_task_4$：来自斯基泰的信使"
 me_scythia_01_greek_stance.22.a:0 "把我的马牵过来!那就开战吧！"
 me_scythia_01_greek_stance.22.at:0 "#Y 博斯普鲁斯王国#!以#G 霸权#!的战争目标向#Y 斯基泰#!宣战。"
 me_scythia_01_greek_stance.22.b:0 "这些资金将得到很好的使用，但这值得吗？"
 me_scythia_01_greek_stance.22.bt:0 "#Y 博斯普鲁斯王国#!向#Y 斯基泰#!支付#G 500#!黄金。"
 me_scythia_01_greek_stance.22.c:0 "密切关注他们的事务。他们可能会在未来进一步寻求针锋相对。"
 me_scythia_01_greek_stance.22.ct:0 "什么也没有发生。"
 me_scythia_01_greek_stance.22.desc:0 "我们收到了博斯普鲁斯人的消息，他们对自己的土地感兴趣。"
 me_scythia_01_greek_stance.22.desc_1:0 "\n他们已经向我们宣战。就在我们说话的时候，他们正在集结部队，准备攻击我们!"
 me_scythia_01_greek_stance.22.desc_2:0 "\n他们已经接受了我们谈判的价格，并全额支付。"
 me_scythia_01_greek_stance.22.desc_3:0 "\n他们已经取消了他们的报价，而且似乎没有挑起任何麻烦。"
 me_scythia_01_greek_stance.22.t:0 "$scythia_mission_01_greek_stance_task_4$： 斯巴达基德特使"
 me_scythia_01_greek_stance.25.a:0 "建造它，他们就会来。"
 me_scythia_01_greek_stance.25.desc:0 "拿着斧头的人已经去清除了大片的森林，为我们的文明奠定了土壤。所有的建设者都已经到达了他们相应的地点，并且已经得到了报酬。剩下的就是等待......和观察......当我们的城市从地球上升起。"
 me_scythia_01_greek_stance.25.t:0 "$scythia_mission_01_greek_stance_task_5$：种植根基"
 me_scythia_01_greek_stance.26.a:0 "打开国门!"
 me_scythia_01_greek_stance.26.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_5$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.26.desc:0 "已经完成了。有了这四个新的城市，再加上我们的首都，我们就有了培养不断增长的文化和人口的手段，因为移民开始从世界的各个角落涌入。"
 me_scythia_01_greek_stance.26.t:0 "$scythia_mission_01_greek_stance_task_5$：建设完成"
 me_scythia_01_greek_stance.27.a:0 "一切都井然有序。"
 me_scythia_01_greek_stance.27.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_6$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.27.desc:0 "长期以来，我们一直受到许多传统的限制，这些传统肯定是在不同的情况下产生的。在国家事务方面，不再有借口保持无知。这就是方法。"
 me_scythia_01_greek_stance.27.t:0 "$scythia_mission_01_greek_stance_task_6$：一个坚实的基础"
 me_scythia_01_greek_stance.28.a:0 "知识就是力量。"
 me_scythia_01_greek_stance.28.at:0 "我们可以在我们的首都获得一些希腊人的支持。"
 me_scythia_01_greek_stance.28.desc:0 "虽然到目前为止，我们一直依靠我们自己的使者和罕见的访客的传闻和报告，但要想得到关于外面世界的礼仪的好的真相是相当困难的。例如，以与我们为邻的希腊人为例；他们很少来访，因此我们对他们的习俗知之甚少，这些习俗似乎很陌生，但对我们也很有用。让我们用适合爱琴海城市的学习结构来吸引他们最伟大的思想。把他们带进来，那些急于告诉我们他们所知道的一切的人。"
 me_scythia_01_greek_stance.28.t:0 "$scythia_mission_01_greek_stance_task_7$： 寻求专业知识"
 me_scythia_01_greek_stance.29.a:0 "让学习开始吧。"
 me_scythia_01_greek_stance.29.at:0 "在斯基泰，将出现2个贵族、3个公民和3个自由民"
 me_scythia_01_greek_stance.29.desc:0 "看来我们的努力取得了远超预期的成功。不仅希腊世界的成员开始蜂拥至我城门前，他们携带的更不止是旅途所需的财物。其中不乏携家带口的群体，他们在此寻求新生，渴望在昔日斥为蛮族的斯基泰人中谋求繁荣。或许我们确实踏上了正确的道路。"
 me_scythia_01_greek_stance.29.t:0 "$scythia_mission_01_greek_stance_task_7$：永久访客"
 me_scythia_01_greek_stance.30.a:0 "他们一直是个勤奋的人，也是忠实的议会成员。我将为他们举办一个庆祝活动!"
 me_scythia_01_greek_stance.30.at:0 "我们将试图用礼物来赢得他们的支持。"
 me_scythia_01_greek_stance.30.b:0 "生活在过去是软弱的表现。忽视他们无害的习惯。"
 me_scythia_01_greek_stance.30.bt:0 "我们不会试图赢得他们的支持。"
 me_scythia_01_greek_stance.30.desc:0 "我们的人民正与希腊人混在一起，进入我们在首都设立的希腊神庙，并在贵族住宅外设立的神龛上进行崇拜。然而，我们的大祭司[SCOPE.sChar('current_high_priest')GetName]在这个过程中一直很不安分。他们每天都在踱步，在夜里埋怨。也许在这个过渡时期，最好的办法是安慰他们。"
 me_scythia_01_greek_stance.30.t:0 "$scythia_mission_01_greek_stance_task_8$：不满的牧师"
 me_scythia_01_greek_stance.31.a:0 "我们还没有忘记旧神，也没有忘记他们的伟大力量。让我们拆毁神庙。"
 me_scythia_01_greek_stance.31.at:0 "我们将试图以破坏我们的首都为代价来赢得他们的支持。"
 me_scythia_01_greek_stance.31.b:0 "一个无望的牧师，对新的事物方式感到恐惧；神庙留下来。"
 me_scythia_01_greek_stance.31.bt:0 "我们不会试图赢得他们的支持。"
 me_scythia_01_greek_stance.31.c:0 "我将说服[SCOPE.sChar('current_high_priest')GetHerHim]，一切都会好起来的。我自己也有一个愿景..."
 me_scythia_01_greek_stance.31.ct:0 "我们将用奉承和承诺来赢得他们的支持。"
 me_scythia_01_greek_stance.31.desc:0 "大祭司[SCOPE.sChar('current_high_priest')GetName]昨晚来到[ROOT.GetCountry.GetRuler.GetName]的房间。[SCOPE.sChar('current_high_priest')GetSheHe]非常安静，脸色病态，谈到了[SCOPE.sChar('current_high_priest')GetSheHe]对人民希腊化的恐惧；[SCOPE.sChar('current_high_priest')GetSheHe]说，一种病态围绕着这一切，如果首都的新庙不被摧毁，塔比提就会摇摆不定，准备出击，重新获得她的霸权。该怎么做呢？"
 me_scythia_01_greek_stance.31.t:0 "$scythia_mission_01_greek_stance_task_8$：私下忏悔"
 me_scythia_01_greek_stance.32.a:0 "[SCOPE.sChar('current_high_priest')GetName]是对的，我们已经失去了太多的旧方式。下令杀戮吧。"
 me_scythia_01_greek_stance.32.at:0 "我们将试图以我们的名誉为代价来赢得他们的支持"
 me_scythia_01_greek_stance.32.b:0 "[SCOPE.sChar('current_high_priest')GetName]是一个失败的事业。让[SCOPE.sChar('current_bodyguard')GetName]把[SCOPE.sChar('current_high_priest')GetSheHe]带走，对[SCOPE.sChar('current_high_priest')GetHerHim]进行一番敲打。"
 me_scythia_01_greek_stance.32.bt:0 "我们将试图让他们感到羞愧，让他们保持沉默。"
 me_scythia_01_greek_stance.32.c:0 "我是人民信仰的首领--我决定了我们所信仰的神灵！我们将试图以他们的方式征服他们。"
 me_scythia_01_greek_stance.32.ct:0 "我们将试图用权威和宏大的展示来赢得他们的支持。"
 me_scythia_01_greek_stance.32.desc:0 "在一次伟大的议会会议中，大祭司[SCOPE.sChar('current_high_priest').GetName]气喘吁吁地跑进来，宣布斯基泰人正被一个僭主和我们祖先的叛徒所统治。[SCOPE.sChar('current_high_priest').GetSheHe]要求把城里所有的希腊贵族都处死，以显示我们对古老神灵的信仰。"
 me_scythia_01_greek_stance.32.t:0 "$scythia_mission_01_greek_stance_task_8$：闹场"
 me_scythia_01_greek_stance.33.a:0 "也许大鹰的翅膀会指引我们的道路。"
 me_scythia_01_greek_stance.33.desc:0 "许多人担心，这将是我们民族进化过程中的最大障碍之一。我们长期以来一直沉浸在我们过去的传统中，要把那几代人对旧神的反复信任扔到一边，这将是一项伟大的事业。但我们必须认识到希腊诸神的价值，以及当我们可以宣称在我们自己的大庙里监督希腊人的诸神--宙斯、波塞冬、哈迪斯和其他诸神--的同样仪式时，我们可能会发现自己被接受的潜在市场和社区。"
 me_scythia_01_greek_stance.33.t:0 "$scythia_mission_01_greek_stance_task_8$：一个新的万神殿"
 me_scythia_01_greek_stance.34.a:0 "[SCOPE.sChar('current_high_priest')GetSheHe]是一个麻烦的灵魂，无法应对变化的世界。"
 me_scythia_01_greek_stance.34.at:0 "[SCOPE.sChar('current_high_priest')GetName]死了。"
 me_scythia_01_greek_stance.34.desc:0 "昨晚很平静，直到[ROOT.GetCountry.GetRuler.GetName]的寝室外传来巨大的撞击声。突然，大祭司[SCOPE.sChar('current_high_priest')GetName]冲进门来，挥舞着一把刀，跃上[ROOT.GetCountry.GetRuler.GetName]的床，准备谋杀[COUNTRY.GetRuler.GetHerHim]。幸运的是，统治者的保镖[SCOPE.sChar('current_bodyguard')GetName]紧跟在[SCOPE.sChar('current_high_priest')GetHerHim]后面冲了进来，用长剑刺穿了[SCOPE.sChar('current_high_priest')GetHerHim]。危机解除了，但是是什么原因导致了这样一次绝望的攻击？"
 me_scythia_01_greek_stance.34.t:0 "$scythia_mission_01_greek_stance_task_8$：一次大胆的尝试"
 me_scythia_01_greek_stance.35.a:0 "没有人看到它的到来。我们都必须忏悔我们盲目地拒绝承认牧师的苦口婆心。"
 me_scythia_01_greek_stance.35.at:0 "[ROOT.GetCountry.GetRuler.GetName]和[SCOPE.sChar('current_high_priest')GetName]死亡。"
 me_scythia_01_greek_stance.35.desc:0 "昨晚很平静，直到[ROOT.GetCountry.GetRuler.GetName]的寝室外传来一声巨大的撞击声。一声巨响，大祭司[SCOPE.sChar('current_high_priest')GetName]冲进门来，挥舞着一把刀，跃上[ROOT.GetCountry.GetRuler.GetName]的床，准备谋杀[COUNTRY.GetRuler.GetHerHim]。统治者的保镖[SCOPE.sChar('current_bodyguard')GetName]匍匐在地板上，死在门口。[SCOPE.sChar('current_high_priest')GetName]念着对塔比提的咒语，将刀插入[ROOT.GetCountry.GetRuler.GetName]的心脏，不久又割开了[ROOT.GetCountry.GetRuler.GetHerHis]自己的喉咙。鲜血涂满了墙壁，第二天早上，对斯基泰人来说是黑暗的一天。"
 me_scythia_01_greek_stance.35.t:0 "$scythia_mission_01_greek_stance_task_8$：永恒的沉睡"
 me_scythia_01_greek_stance.36.a:0 "祝福这个漂泊的灵魂。愿塔耳吉塔俄斯引导[SCOPE.sChar('current_high_priest')GetHerHim]走过草地。"
 me_scythia_01_greek_stance.36.desc:0 "风轻轻地吹着，草在风中摇摆。坐在[ROOT.GetCountry.GetRuler.GetHerHis]的马背上，沿着一条破旧的小路踏步而行，[ROOT.GetCountry.GetRuler.GetName]的耳朵随着后面响起的马蹄声而发抖。大祭司，[SCOPE.sChar('current_high_priest')GetName]，骑到了[COUNTRY.GetRuler.GetHerHim]旁边。[SCOPE.sChar('current_high_priest')GetSheHe]叹息着承认，虽然[SCOPE.sChar('current_high_priest')GetSheHe]一直并保持对[ROOT.GetCountry.GetRuler.GetName]的忠诚，但世界已不复从前，[SCOPE.sChar('current_high_priest')GetSheHe]希望追求孤独的生活，沿着平原漂泊。[SCOPE.sChar('current_high_priest')GetSheHe]骑马离开，再也没有人看见。"
 me_scythia_01_greek_stance.36.t:0 "$scythia_mission_01_greek_stance_task_8$：告别"
 me_scythia_01_greek_stance.39.a:0 "为天空之主割断9头公牛的喉咙。"
 me_scythia_01_greek_stance.39.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_8$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.39.desc:0 "在我们为实现这种新的宗教统一所走过的艰辛道路上，我们已经失去了一些人，对一组新的神的崇拜，我们以前在自己的土地上把这些神当作亵渎的人物来责备。然而，随着我们在社会中做出的修正，我们找到了更强的自我意识，并能在与已知世界上分享这些神的庞大而繁荣的希腊人群体融为一体后感到欣喜地前进。"
 me_scythia_01_greek_stance.39.t:0 "$scythia_mission_01_greek_stance_task_8$：希腊的斯基泰"
 me_scythia_01_greek_stance.4.a:0 "是的，钱币才是最重要的，不管它来自哪里......"
 me_scythia_01_greek_stance.4.at:0 "至多#Y 5#!个的奴隶人口将转移到各个希腊国家。#Y 斯基泰#!每卖出一个奴隶就会获得黄金。#Y 2#!个信仰希腊多神教的博斯普鲁斯人#Y 贵族#!将出现在[me_scythia_1_scope.GetCapital.GetName]"
 me_scythia_01_greek_stance.4.b:0 "不，希腊人已经对我们造成了足够的伤害。诅咒他们的不义之财。"
 me_scythia_01_greek_stance.4.bt:0 "至多#Y 5#!七神崇拜斯基泰#Y 部落民#!人口将出现在[me_scythia_1_scope.GetCapital.GetName]。#Y 塔佛洛斯#!的港口会获得#Y 120#!个月的#Y 破旧的港口#!修正。"
 me_scythia_01_greek_stance.4.desc:0 "由于我们的经济受到影响，我们必须依靠对外贸易来带来新的财富。希腊人总是需要我们提供两样东西；食物和奴隶。尤其是后者，是一个有利可图的生意。也许这里和那里多几个奴隶会给我们打开一些贸易大门......"
 me_scythia_01_greek_stance.4.t:0 "$scythia_mission_01_greek_stance_task_1$： 黑海奴隶贸易"
 me_scythia_01_greek_stance.40.a:0 "所以这些故事是真的。让我们不要忘记我们的母亲。"
 me_scythia_01_greek_stance.40.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_9$$mission_task_completed_tt_2$#Y 希腊多神教#!神祇#Y 希拉里安-德拉凯娜#! 现在可用。"
 me_scythia_01_greek_stance.40.desc:0 "虽然我们之前把赫拉克勒斯来到斯基泰的传说斥为希腊人制造的幻想，以便降低我们对他们的怀疑，但我们现在看到了真相。是一个叫斯巴加皮特斯的人，他带着他的牛群在田野里闲逛，发现土地上有一个凹陷，这个凹陷以两轮车无法做到的方式运行和弯曲。没有一个人能够在草地上划出这样一条路来，因此，在好奇心的驱使下，他放弃了他的牛群，让他的马照看，他沿着这条线爬行，沿着它的每一条曲线。\n\n他是在太阳高挂时开始这项活动的，当他终于到达痛苦爬行的终点时，太阳已经在他身边的地面上休息了。脊柱疼痛难忍，他仰面倒下，发现自己从山上滚到了沙滩上--他没有听到海浪在岩石上的刹车声--他倒在一个大洞口前。他只靠手臂的力量往里爬，遇到了一条大蛇的尾巴，在尾巴的末端有一个男人，不，是一个女人的身体，与蛇完美结合在一起。恐惧抓住了他，给了他力量，于是他跑啊跑啊，跑回他离开的地方，找不到他的牛群，他继续跑，跑回他来时的马车村，并声称他发现了赫拉克勒斯睡过的大蛇的尸体，那是他们所有人的母亲。"
 me_scythia_01_greek_stance.40.t:0 "$scythia_mission_01_greek_stance_task_9$：播种希腊遗产"
 me_scythia_01_greek_stance.41.a:0 "请希腊的许多城市派出他们最伟大的运动员。"
 me_scythia_01_greek_stance.41.b:0 "也许直接要求加入奥林匹克运动会更好？"
 me_scythia_01_greek_stance.41.desc:0 "[SCOPE.sP('scythian_games_province_scope').GetName]中的空间已经被清理出来，可以举办许多活动，我们刻意模仿希腊人的做法，同时融入了一些我们的传统游戏。\n\n已经为摔跤比赛画好了圆圈，并在举行战车比赛的空地上设置了标记。\n\n在我们说话的时候，饮料和节日的奢侈品正通过商队运到我们的港口，呈现在我们高贵的客人面前。\n\n来吧，来吧，这个最好客的海洋的游戏很快就会开始！请许多希腊城市派人来参加。"
 me_scythia_01_greek_stance.41.t:0 "欧克西诺斯游戏"
 me_scythia_01_greek_stance.43.a:0 "派[SCOPE.sChar('euxinus_games_champion').GetPraenomen]吧!"
 me_scythia_01_greek_stance.43.b:0 "让我们派[SCOPE.sChar('euxinus_games_champion_2').GetPraenomen]去吧。"
 me_scythia_01_greek_stance.43.c:0 "这甚至不是真正的奥林匹克运动会!荒唐!"
 me_scythia_01_greek_stance.43.desc:0 "北方的马主们邀请我们参加一系列奥运会风格的比赛。\n\n据说他们新拜我们的神，但我们不知道这些比赛是出于尊重还是对神圣的奥林匹亚上的传统比赛的蔑视。如果我们要参加，我们的习惯是派最自豪、最能干的年轻[ROOT.GetCountry.GetAdjective]运动员，代表我们参赛。我们相信我们已经找到了两个理想的候选人；一个叫[SCOPE.sChar('euxinus_games_champion').Custom('get_godly_description')]的[SCOPE.sChar('euxinus_games_champion').GetPraenomen]，和一个叫[SCOPE.sChar('euxinus_games_champion_2').Custom('get_godly_description')][SCOPE.sChar('euxinus_games_champion_2').GetHerselfHimself]的[SCOPE.sChar('euxinus_games_champion_2').GetPraenomen]。在这些优秀的运动员中，我们应该派谁去参加比赛？"
 me_scythia_01_greek_stance.43.t:0 "$me_scythia_01_greek_stance.41.t$"
 me_scythia_01_greek_stance.45.a:0 "赞美[SCOPE.sChar('victorious_competitor').GetPraenomen]!"
 me_scythia_01_greek_stance.45.b:0 "啊，好吧，下次运气会更好。"
 me_scythia_01_greek_stance.45.c:0 "精彩的活动!"
 me_scythia_01_greek_stance.45.desc:0 "无畏的黑海运动会在人们的欢呼声和庆祝声中结束。\n\n今年比赛的亮点出现在[SCOPE.Custom('get_olympic_highlight')]\n\n总的来说，胜利者被宣布为是来自[SCOPE.sC('victor_origin_country').GetName]的[SCOPE.sChar('victorious_competitor').GetName]，[SCOPE.sChar('victorious_competitor').Custom('get_number_of_wins')]，其矫健身姿、男子气概和赫拉克勒斯一般的活力无可比拟。作为黑海运动会的冠军，他将名垂青史！"
 me_scythia_01_greek_stance.45.desc_2:0 "无畏的Euxinus运动会已经结束了，有很多的欢呼和庆祝。然而，今年的活动由于追随者[SCOPE.sChar('victorious_competitor').GetName]的死亡而带着悲伤的色彩。由于不愿意在死亡面前放弃，[SCOPE.sChar('victorious_competitor').GetSheHe]在其中一个武术项目中与[SCOPE.sChar('victorious_competitor').GetHerHis]的对手战斗到最后，由于这些情有可原的情况，他被光荣地宣布为胜利者。\n\n尽管如此，许多其他活动吸引了大量的观众，其中一个特别令人难忘的活动是[SCOPE.Custom('get_olympic_highlight')]。"
 me_scythia_01_greek_stance.45.t:0 "欧克西诺斯运动会结束了"
 me_scythia_01_greek_stance.46.a:0 "我们一定是以某种方式冒犯了强大的宙斯。"
 me_scythia_01_greek_stance.46.desc:0 "看来，几乎没有人参加Euxinus运动会，活动不得不取消。\n\n这种失望对北方的希腊化项目是一个毁灭性的打击。"
 me_scythia_01_greek_stance.46.t:0 "体育场被遗弃"
 me_scythia_01_greek_stance.49.a:0 "我们现在只能期待在这个新的、希腊的世界里等待我们的东西。"
 me_scythia_01_greek_stance.49.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_11$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.49.desc:0 "这是人民所见过的最壮观的事件，看着伟大的君主[ROOT.GetCountry.GetRuler.GetName]被希腊和斯基泰官员并排跪在[ROOT.GetCountry.GetRuler.GetName]的脚下，被膏封为希腊人的领袖，显示出皇家对两个世界的统治。"
 me_scythia_01_greek_stance.49.t:0 "$scythia_mission_01_greek_stance_task_11$：希腊-斯基泰人的崛起"
 me_scythia_01_greek_stance.5.a:0 "人民的意愿是这样的--太多人反对了。让他们去吧。"
 me_scythia_01_greek_stance.5.at:0 "多达#Y 3#! Heptadic公民人口皈依#Y Hellenism#! ，并将搬到#Y Ektonopolis#!的领土。"
 me_scythia_01_greek_stance.5.b:0 "他们不是斯基泰人，向我们的神明吐口水。像我们对待所有外国人一样对待他们。"
 me_scythia_01_greek_stance.5.bt:0 "多达#Y 3#! Heptadic公民人口皈依#Y Hellenism#! ，并将搬到#Y Olbia#!的领土。"
 me_scythia_01_greek_stance.5.desc:0 "有传言说，我们的一些人在夜间窜到了奥尔比安的领土上，举行一些亵渎希腊的仪式。那是以前--现在我们的人公开不尊重古老的方式；一队队的男人和女人在光天化日之下明目张胆地前往希腊城市，以便进行献祭。该怎么做呢？"
 me_scythia_01_greek_stance.5.t:0 "$scythia_mission_01_greek_stance_task_1$： 饮酒仪式"
 me_scythia_01_greek_stance.50.a:0 "他们很快就会犯一个无法挽回的错误。"
 me_scythia_01_greek_stance.50.at:0 "#Y 斯基泰#!获得邻居土地的宣称。"
 me_scythia_01_greek_stance.50.desc:0 "在过去的几年里，我们一直与希腊的邻国有矛盾。特别是那些小国，即奥尔比亚、泰拉斯和刻耳索涅苏斯的国家，我们发现与它们的问题最为频繁。有多少次，陶里的海盗在刻耳索涅苏斯政府的允许下沿河驶入我们的水域被抓？有多少次，来自奥尔比亚和泰拉斯的贸易商队在穿越草场时迷失了方向，当他们偶然发现斯基泰人的营地时，他们大惊小怪，制造麻烦，喝了大量他们的酒，偷了我们的酒？这些罪行不胜枚举，就像我们决定他们成为独立实体太久的理由一样……"
 me_scythia_01_greek_stance.50.t:0 "$scythia_mission_01_greek_stance_task_12$： 边界干扰"
 me_scythia_01_greek_stance.51.a:0 "召集勇士们吧。"
 me_scythia_01_greek_stance.51.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_12$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.51.desc:0 "它发生了。我们已经抓住了所有这些可怕的城市的至少一个行为，我们认为这是战争和征服的理由。泰拉斯在他们的一枚硬币上毫不掩饰地侮辱了我们的统治者，对他进行了拥抱式的描述。奥尔比亚人给我们送来了一车车所谓的酒罐，但它们被发现被廉价的沼泽水稀释得面目全非--他们市场上的货物印章毫无意义。刻耳索涅苏斯与陶里海盗一起对经过我们首都的河流沿岸的斯基泰人村庄进行了一次被认可的袭击。这些都是不可接受的事情，所以我们别无选择，只能用武力回应。"
 me_scythia_01_greek_stance.51.t:0 "$scythia_mission_01_greek_stance_task_12$：偶然事件"
 me_scythia_01_greek_stance.52.a:0 "希腊人毕竟给我们带来了一些好处。"
 me_scythia_01_greek_stance.52.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_14$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.52.desc:0 "大祭司查看了所有的祭品，对待希腊人的身体和人，就像战斗结束后从敌人那里抓来的人一样。在他们的喉咙被打开之前，在他们的头上浇上酒，然后在一个空容器前打开。这些装满的容器被拿出来，翻到等待着的斯基泰人统治者的剑上，而无生命的尸体则从他们的右臂上分离出来--一声呼喊，我们敌人的附属物纷纷落下。于是，大祭司[SCOPE.sChar('current_high_priest')GetName]宣布，帕坦帕萨得到了幸福。"
 me_scythia_01_greek_stance.52.t:0 "$scythia_mission_01_greek_stance_task_14$：像战俘一样"
 me_scythia_01_greek_stance.53.a:0 "再做一次也无妨。"
 me_scythia_01_greek_stance.53.at:0 "斯基泰将向所有希腊多神教国家发送侮辱。"
 me_scythia_01_greek_stance.53.b:0 "也许我们不应该一下子激怒整个希腊世界。"
 me_scythia_01_greek_stance.53.bt:0 "斯基泰将会撤销其指责"
 me_scythia_01_greek_stance.53.desc:0 "希腊人喋喋不休地谈论他们的优越性和较高的社会水平。我曾在以前的场合谴责过他们，但他们继续依赖我们的奴隶和粮食贸易，同时在我们经过时高呼侮辱性的'bar bar bar'，这是无法容忍的。我想说现在是再次向他们发出我的宣称的时候了，但有些人评论说这是一种轻率和不明智的行为。"
 me_scythia_01_greek_stance.53.t:0 "$scythia_mission_01_greek_stance_task_15$：有点太远了。"
 me_scythia_01_greek_stance.54.a:0 "这很好，但他们不能在我们入侵时感到惊讶。"
 me_scythia_01_greek_stance.54.at:0 "[SCOPE.root.country.GetName]获得对斯基泰的宣称"
 me_scythia_01_greek_stance.54.b:0 "啊，他们很可能是喝醉了。让它过去吧。"
 me_scythia_01_greek_stance.54.bt:0 "[SCOPE.root.country.GetName]不会做什么。"
 me_scythia_01_greek_stance.54.desc:0 "一位中介信使带着从北方的马主那里转来的信息来到这里。那些侮辱性的、落后的酒鬼们能从我们这里得到什么？我们不是已经给他们送去了足够的酒来浇灌他们的悲伤吗？"
 me_scythia_01_greek_stance.54.desc_1:0 "看来他们的统治者又一次认为应该侮辱我们了。"
 me_scythia_01_greek_stance.54.desc_2:0 "他们已经学会了谦逊，并为先前的侮辱行为道歉。"
 me_scythia_01_greek_stance.54.t:0 "$scythia_mission_01_greek_stance_task_15$：斯基泰人的指控。"
 me_scythia_01_greek_stance.55.a:0 "如果有人过河，他们就会闯入斯基泰，而我们会做好准备。"
 me_scythia_01_greek_stance.55.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_16$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.55.desc:0 "我们已经征服了奥布利亚，泰拉斯是我们的了，这是同名河流西岸的立足点。这些城市既是我们未来征服的前沿阵地，也是我们应该考虑的一个可能的责任--如果发生伏击或野蛮入侵，我们在那里的驻军会被困于河边，背对着河。但这是另一个时间段的事了。让我们陶醉于我们的成就。"
 me_scythia_01_greek_stance.55.t:0 "$scythia_mission_01_greek_stance_task_16$：河流边界"
 me_scythia_01_greek_stance.56.a:0 "他将对我们保持忠诚，否则他将与他的船一起沉没......"
 me_scythia_01_greek_stance.56.at:0 "一个流氓上将和他的舰队可以为我们所用。"
 me_scythia_01_greek_stance.56.desc:0 "卡洛斯港这个海盗据点终于落入我军之手，整个刻耳索涅苏斯半岛亦归我方所有。令人振奋的是，这座港口在城池陷落一个月后便向我军屈服，尽管我们此前在他们藏身地周边巡游时未遇任何抵抗。我们并未屠戮所有海盗，而是挑选其中最优秀的战士与水手留用——毕竟我们斯基泰人在波涛汹涌的大海上尚缺经验与才能。其中有位备受尊敬的男子，我们推举他为首领并赋予一定自治权——当然，颈间套着金钱这根缰绳。此人名叫芝诺，如今率领海军为我效力，我们理应自由调遣这支舰队，以拓展海上征途。"
 me_scythia_01_greek_stance.56.t:0 "$scythia_mission_01_greek_stance_task_17$：海盗舰队"
 me_scythia_01_greek_stance.57.a:0 "确实很奇特，让寺庙从记忆中消失吧。"
 me_scythia_01_greek_stance.57.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_17$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.57.desc:0 "当我们的战士在突袭刻耳索涅苏斯城本身时，在城边的希腊人中有一个老人，有人看到他在混乱中偷偷溜出城门，匆匆离去，向北而去，于是，由于好奇，我们的一些人跟着他。\n\n他们跟着这个人走了很远，直到他把他们带到一个僻静的地方，那里躺着一座古老的寺庙的残骸，一个破碎的、被遗忘的过去的遗迹。当他手捧神像走出寺庙时，战士们与他搭讪，把他作为囚犯，并把神像拿给我们使用。这是一个奇特的东西，可以作为我们某个圣地的装饰。"
 me_scythia_01_greek_stance.57.t:0 "$scythia_mission_01_greek_stance_task_17$：一个隐藏的宝藏"
 me_scythia_01_greek_stance.58.a:0 "一个真正的斯基泰人部落"
 me_scythia_01_greek_stance.58.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_19$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.58.desc:0 "我们的附属国是一种宝贵的资源，为我们提供大量的货物和人力，特别是在我们最需要他们的战争时期。对于我们即将到来的征服，我们需要大量的战士，所以我们已经征服了许多类似的民族，他们与我们的骑兵战术和战斗习惯相同，这是一件好事。"
 me_scythia_01_greek_stance.58.t:0 "$scythia_mission_01_greek_stance_task_19$：集结我们的力量"
 me_scythia_01_greek_stance.6.a:0 "很明显，我们的人民希望接受希腊的生活方式，同时尊重古老的神灵。"
 me_scythia_01_greek_stance.6.at:0 "#Y 希腊多神教#!神祇#Y 赫拉克勒斯般的塔耳吉塔俄斯 #!现在可用。一处#Y 赫拉克勒斯般的塔耳吉塔俄斯#!的#Y 圣地#!建设在了#Y 乌塔耳#!。"
 me_scythia_01_greek_stance.6.b:0 "在黎明时分派出一队骑士--带走所有有价值的东西，把剩下的烧成灰烬。"
 me_scythia_01_greek_stance.6.desc:0 "我们的地方官，[SCOPE.sChar('current_magistrate')GetName]，正在履行他们的职责，向你统治下的所有人民收取贡品，这时天色已晚，他注意到一列人走入树林。在那里他发现了一个神龛，不是为我们的神建造的神龛，而是一个希腊人对我们心爱的塔耳吉塔俄斯形象的歪曲。我们该怎么做？"
 me_scythia_01_greek_stance.6.t:0 "$scythia_mission_01_greek_stance_task_1$： 赫拉克勒斯般的塔耳吉塔俄斯"
 me_scythia_01_greek_stance.60.a:0 "我们的关系是非常重要的。把这一点说清楚。"
 me_scythia_01_greek_stance.60.at:0 "#Y 辛迪卡#!可能会成为一个#Y 仆从国#!。"
 me_scythia_01_greek_stance.60.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_scythia_01_greek_stance.60.bt:0 "#Y 辛迪卡#!可能会成为一个#Y 盟友#!。"
 me_scythia_01_greek_stance.60.c:0 "让我们给他们送去一份友谊的信物。"
 me_scythia_01_greek_stance.60.ct:0 "#Y 辛迪卡#!可能会拒绝我们的请求。"
 me_scythia_01_greek_stance.60.desc:0 "辛迪部落与博斯普鲁斯王国有着长期而复杂的关系，由于萨蒂罗斯二世的儿子和篡位者奥克塔马萨德斯之间的那笔生意而严重恶化。\n从那时起，气氛就一直很紧张，我们预计该部落会很乐意恢复以前的敌对行动，并夺回他们在博斯普鲁斯海峡辛梅里亚一侧的土地。\n让我们与他们交易，这样我们就有了可以压倒希腊人的盟友。"
 me_scythia_01_greek_stance.60.t:0 "$scythia_mission_01_greek_stance_task_20$：辛迪卡的姿态"
 me_scythia_01_greek_stance.61.a:0 "我们的关系是非常重要的。把这一点说清楚。"
 me_scythia_01_greek_stance.61.at:0 "#Y 迈俄提亚#!可能会成为#Y 仆从国#!。"
 me_scythia_01_greek_stance.61.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_scythia_01_greek_stance.61.bt:0 "#Y 迈俄提亚#!可能会成为#Y 盟友#!。"
 me_scythia_01_greek_stance.61.c:0 "让我们给他们送去一份友谊的信物。"
 me_scythia_01_greek_stance.61.ct:0 "#Y 迈俄提亚#! 很可能会拒绝我们的请求。"
 me_scythia_01_greek_stance.61.desc:0 "迈俄提亚部落因他们在湖边建起小屋而得名，他们有一段泥泞的历史，主要是在沼泽地里找到庇护所，当我们接近时，他们就会退缩。\n然而，他们似乎比希腊人更善于看待我们，希腊人与他们为敌，迫害他们的本土习俗。难道不是说，那些湖居部落之一的伊克索马特人的公主蒂尔加托，由于希腊人的诡计而被她的丈夫冤枉，并对他们发动了战争。\n也许还有一些旧的伤口，我们的毒箭和标枪可以再次撬开，以便把他们带入我们对博斯普鲁斯人的战争。"
 me_scythia_01_greek_stance.61.t:0 "$scythia_mission_01_greek_stance_task_20$：迈俄提亚人的姿态"
 me_scythia_01_greek_stance.62.a:0 "提出雇用他们的随从作为雇佣兵。"
 me_scythia_01_greek_stance.62.at:0 "#Y 堤耳革泰#!很可能会接受。"
 me_scythia_01_greek_stance.62.b:0 "他们可能是一个有用的盟友。给他们一个慷慨的提议。"
 me_scythia_01_greek_stance.62.bt:0 "#Y 堤耳革泰#!可能会成为一个#Y 盟友#!。"
 me_scythia_01_greek_stance.62.c:0 "让我们给他们送去一份友谊的信物。"
 me_scythia_01_greek_stance.62.ct:0 "#Y 堤耳革泰#!可能会拒绝我们的请求。"
 me_scythia_01_greek_stance.62.desc:0 "达契亚部落是一个不可预测的群体，但他们以可怕和战斗的狂热而闻名。\n在对博斯普鲁斯王国的战争中，我们可以使用一组达契亚雇佣兵来加强我们的力量‑居住在提拉斯岛上的堤耳革泰人是理想的人选，距离很近，可以在短时间内把他们的部队带到这里。"
 me_scythia_01_greek_stance.62.t:0 "$scythia_mission_01_greek_stance_task_20$： 蒂尔盖特雇佣军"
 me_scythia_01_greek_stance.64.a:0 "我很想说，但在这个危险的时代，我们可以利用他们的保护。与他们在一起比与他们作对更好。"
 me_scythia_01_greek_stance.64.at:0 "#Y 辛迪卡#!成为了#Y 斯基泰#!的#Y 仆从国#!。"
 me_scythia_01_greek_stance.64.b:0 "也许一个军事联盟可以安抚他们，并为我们提供利益回报？"
 me_scythia_01_greek_stance.64.bt:0 "#Y 辛迪卡#!成为#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.64.c:0 "我们不会给他们任何好处。"
 me_scythia_01_greek_stance.64.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.64.desc:0 "来自斯基泰国家的使者已经抵达，带着他们统治者的信息。"
 me_scythia_01_greek_stance.64.desc_1:0 "\n他们为我们提供了大量的金银财宝，试图将我们争取到他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.64.desc_2:0 "\n他们向我们提供了一定数量的银子，试图争取我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.64.desc_3:0 "\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_scythia_01_greek_stance.64.t:0 "$scythia_mission_01_greek_stance_task_20$：来自斯基泰的使者"
 me_scythia_01_greek_stance.65.a:0 "我们的努力是成功的!"
 me_scythia_01_greek_stance.65.at:0 "#Y 辛迪卡#! 成为了#Y 部落附庸#!。"
 me_scythia_01_greek_stance.65.b:0 "一个互利的联盟，我相信。"
 me_scythia_01_greek_stance.65.bt:0 "#Y 辛迪卡#!成为一个#Y 盟友#!。"
 me_scythia_01_greek_stance.65.c:0 "他们怎么敢这样侮辱我们？"
 me_scythia_01_greek_stance.65.ct:0 "我们什么都没得到，什么都没有......"
 me_scythia_01_greek_stance.65.desc:0 "辛迪卡的大使们已经带着他们的回应来了。"
 me_scythia_01_greek_stance.65.desc_1:0 "\n他们已经接受了我们慷慨的提议，现在将成为我们的仆从国。"
 me_scythia_01_greek_stance.65.desc_2:0 "\n他们已经接受了我们的联盟建议，并希望与我们合作，以获得更光明的未来。"
 me_scythia_01_greek_stance.65.desc_3:0 "\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_scythia_01_greek_stance.65.t:0 "$scythia_mission_01_greek_stance_task_20$：来自辛迪卡的回应"
 me_scythia_01_greek_stance.66.a:0 "为了确保我们的生存，我们必须接受附庸地位。给他们派个顾问，看看我们的利益是否得到了提升。"
 me_scythia_01_greek_stance.66.at:0 "#Y 迈俄提亚#!成为了#Y 斯基泰#!的#Y 附属部落#!。"
 me_scythia_01_greek_stance.66.b:0 "也许一个军事联盟可以安抚他们，并为我们提供利益回报？"
 me_scythia_01_greek_stance.66.bt:0 "#Y 迈俄提亚#!成为了#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.66.c:0 "我们不会给他们任何好处。"
 me_scythia_01_greek_stance.66.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.66.desc:0 "来自斯基泰国家的使者来到这里，带着他们统治者的信息。"
 me_scythia_01_greek_stance.66.desc_1:0 "\n他们为我们提供了大量的奴隶，试图将我们争取到他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.66.desc_2:0 "\n他们向我们提供大量的金银财宝，试图赢得我们的支持。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.66.desc_3:0 "\n虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_scythia_01_greek_stance.66.t:0 "$scythia_mission_01_greek_stance_task_20$：来自斯基泰的使者"
 me_scythia_01_greek_stance.67.a:0 "我们的努力已经取得了完全的成功!"
 me_scythia_01_greek_stance.67.at:0 "#Y 迈俄提亚#!成为了#Y 斯基泰#!的#Y 附属部落#!。"
 me_scythia_01_greek_stance.67.b:0 "这个联盟肯定是互惠互利的。"
 me_scythia_01_greek_stance.67.bt:0 "#Y 迈俄提亚#! 成为了#Y 盟友#!。"
 me_scythia_01_greek_stance.67.c:0 "他们会后悔抛弃我们的日子!"
 me_scythia_01_greek_stance.67.ct:0 "我们的努力是不成功的..."
 me_scythia_01_greek_stance.67.desc:0 "“迈奥提亚使团已携答复抵达。”# description 迈俄提亚派往斯基提亚的使节到访事件"
 me_scythia_01_greek_stance.67.desc_1:0 "\n他们已经接受了我们慷慨的提议，现在将成为我们的仆从国。"
 me_scythia_01_greek_stance.67.desc_2:0 "\n他们已经接受了我们的联盟提议，并希望与我们合作，以获得更光明的未来。"
 me_scythia_01_greek_stance.67.desc_3:0 "\n他们决定驳斥我们的外交努力，并排除了进一步加强我们的关系。这只能被认为是对我们努力的侮辱。"
 me_scythia_01_greek_stance.67.t:0 "$scythia_mission_01_greek_stance_task_20$：迈俄提亚的回应"
 me_scythia_01_greek_stance.68.a:0 "他们的礼物很受欢迎，并将被用于建造一个新的城市。召集一批战士，他们可以作为雇佣兵使用。"
 me_scythia_01_greek_stance.68.at:0 "#Y 斯基泰#!获得了一支雇佣兵部队"
 me_scythia_01_greek_stance.68.b:0 "也许一个军事联盟可以安抚他们，并为我们提供好处作为回报？"
 me_scythia_01_greek_stance.68.bt:0 "#Y 堤耳革泰#!成为#Y 斯基泰#!的#Y 盟友#!。"
 me_scythia_01_greek_stance.68.c:0 "我们不会给他们提供任何东西。"
 me_scythia_01_greek_stance.68.ct:0 "外交官们很失望，他们的统治者可能会被冒犯。"
 me_scythia_01_greek_stance.68.desc:0 "来自斯基泰国家的使者来到这里，带来了他们统治者的信息。# description 斯基泰使者抵达堤耳革泰的描述"
 me_scythia_01_greek_stance.68.desc_1:0 "\n他们为我们提供了大量的金银财宝，试图拉拢我们加入他们的事业。他们的统治者正在寻找军事盟友和雇佣军战士。"
 me_scythia_01_greek_stance.68.desc_2:0 "\n他们向我们提供一定数量的奴隶，试图拉拢我们加入他们的事业。他们的统治者正在寻找军事盟友和贸易伙伴。"
 me_scythia_01_greek_stance.68.desc_3:0 "虽然他们的话很动听，但他们提供的礼物或贿赂很少。"
 me_scythia_01_greek_stance.68.t:0 "$scythia_mission_01_greek_stance_task_20$：来自斯基泰的使者"
 me_scythia_01_greek_stance.69.a:0 "一个响亮的成功!希腊人很快就会畏缩了。"
 me_scythia_01_greek_stance.69.at:0 "#Y 斯基泰#!从#Y 堤耳革泰#!获得一支军队。"
 me_scythia_01_greek_stance.69.b:0 "一个互惠互利的联盟，当然。"
 me_scythia_01_greek_stance.69.bt:0 "#Y 堤耳革泰#!成为了#Y 盟友#!。"
 me_scythia_01_greek_stance.69.c:0 "这一点不会被忘记。"
 me_scythia_01_greek_stance.69.ct:0 "我们没有任何收获。"
 me_scythia_01_greek_stance.69.desc:0 "堤耳革泰的大使们已经带着他们的回应来了。"
 me_scythia_01_greek_stance.69.desc_1:0 "\n伟大的消息！一支由堤耳革泰人、盖塔人和巴斯塔奈人组成的拼凑雇佣军将被移交给我们控制。他们的剑和矛将很好地服务于我们的扩张工作。"
 me_scythia_01_greek_stance.69.desc_2:0 "\n堤耳革泰人在与我们建立军事联盟时发现了智慧。"
 me_scythia_01_greek_stance.69.desc_3:0 "\n他们拒绝了我们的外交姿态，没有向我们提供任何东西。"
 me_scythia_01_greek_stance.69.t:0 "$scythia_mission_01_greek_stance_task_20$：来自堤耳革泰的回应"
 me_scythia_01_greek_stance.7.a:0 "希腊模式就是这样。"
 me_scythia_01_greek_stance.7.at:0 "新的使命任务已经有了!"
 me_scythia_01_greek_stance.7.b:0 "我们像我们的祖先那样做。"
 me_scythia_01_greek_stance.7.bt:0 "新的使命任务有了!"
 me_scythia_01_greek_stance.7.desc_1:0 "通过最近的试验，我们明白了许多新的东西。我们必须忠于传统，否则我们就会失去自己的身份。"
 me_scythia_01_greek_stance.7.desc_2:0 "在最近的考验中，我们明白了许多新的东西。也许我们如此紧紧抓住旧有的理想是错误的，应该拥抱我们周围更新的世界，追随更大的牧群。"
 me_scythia_01_greek_stance.7.t:0 "$scythia_mission_01_greek_stance_task_1$：一条新路"
 me_scythia_01_greek_stance.75.a:0 "让他们成为我们计划的助推器。"
 me_scythia_01_greek_stance.75.b:0 "我们会把它夷为平地。"
 me_scythia_01_greek_stance.75.c:0 "潘提卡帕翁已经成为过去的记忆了。"
 me_scythia_01_greek_stance.75.desc:0 "潘提卡派恩是博斯普鲁斯人统治者的家园，现在在我们低下的刀锋下屈服。在我们重建遗产的过程中，博斯普鲁斯人每一步都与我们作对，因此他们是一个危险的敌人，要让他们活着。我们应该让这些希腊人自生自灭吗？"
 me_scythia_01_greek_stance.75.t:0 "$scythia_mission_01_greek_stance_task_21$： 潘提卡派恩的命运"
 me_scythia_01_greek_stance.76.a:0 "斯巴达基德人已经成为值得尊敬的对手。如果不杀他们，他们会作为顾问进一步为我们服务。"
 me_scythia_01_greek_stance.76.b:0 "我们要一劳永逸地结束Spartokid家族。他们的遗产是他们城市的灰烬。"
 me_scythia_01_greek_stance.76.desc:0 "博斯普鲁斯王国在我们汹涌的部落声中被一波又一波的马蹄拍打着地面践踏。他们的建筑摇摇欲坠，他们的人民在伟大的马主面前畏缩不前。一名士兵回到了将军身边，他身后拖着斯巴达基德王朝的最后一名成员，原始斯巴达基德人的血液仍然流淌在他们的血管中。这个战俘的命运如何呢？"
 me_scythia_01_greek_stance.76.t:0 "$scythia_mission_01_greek_stance_task_21$：斯巴托古之血"
 me_scythia_01_greek_stance.77.a:0 "下达命令吧。在我们剥夺他们的贵重物品后，让他们的城市被烧毁。"
 me_scythia_01_greek_stance.77.at:0 "我们控制的最多四个城市将沦为定居点。"
 me_scythia_01_greek_stance.77.desc:0 "我们最近的扩张带来了一些行政方面的挑战。在新的统治下，当地居民对放弃自己的方式感到不满，他们对放弃自己的方式有着根深蒂固的抵触，事实证明，我们控制下的希腊人很难控制。在任何严重的叛乱发生之前，我们应该给他们树立一个榜样。我们的骑手可以掠夺他们的土地，夷平他们的城市。一旦他们的精神被打垮，他们就会更容易被控制。"
 me_scythia_01_greek_stance.77.t:0 "$scythia_mission_01_greek_stance_task_22$"
 me_scythia_01_greek_stance.78.a:0 "我们在一起更强大。"
 me_scythia_01_greek_stance.78.at:0 "$mission_task_completed_tt_1$$scythia_mission_01_greek_stance_task_13$$mission_task_completed_tt_2$"
 me_scythia_01_greek_stance.78.desc:0 "我们的领地被许多游荡的部落之间的差距和人民的不团结所困扰。在解决这个问题的过程中，我们创造了一个更有凝聚力的民族来统治，每个骑手都可以把他的邻居看作是兄弟或姐妹--每个战士都可以把他左右的士兵看作是自己的副本。"
 me_scythia_01_greek_stance.78.t:0 "$scythia_mission_01_greek_stance_task_13$"
 me_scythia_01_greek_stance.8.a:0 "让第一批船只停靠并开始卸货。"
 me_scythia_01_greek_stance.8.desc:0 "曾经是一块空旷的海岸线，现在是那些运送货物和钱币的安全港。它还不能与南方大海上的许多港口城市相比，但有一天，这条河可能会成为更伟大的东西，不是水体，而是船只的流动。"
 me_scythia_01_greek_stance.8.t:0 "$scythia_mission_01_greek_stance_task_3$： 这是一个开始"
 me_scythia_01_greek_stance.80.a:0 "请所有的流浪部落派出他们最伟大的战士。"
 me_scythia_01_greek_stance.80.b:0 "仔细想想，我们还没有准备好在我们的边界内接待这么多人。"
 me_scythia_01_greek_stance.80.desc:0 "[SCOPE.sP('scythian_games_province_scope').GetName]周围的草山光秃秃的，准备举办我们游牧民族长期以来相互竞争的许多活动。\n\n已经为摔跤比赛画好了圆圈，在空旷的场地上，马和骑手将互相比赛，猎兔已经准备好从笼子里放出来。\n\n我们的客人已经从整个欧亚大草原和塔耳吉塔俄斯育有子女的地方涌来了。\n\n来吧，来吧，马王的竞赛要开始了!"
 me_scythia_01_greek_stance.80.t:0 "塔耳吉塔俄斯运动会"
 me_scythia_01_greek_stance.82.a:0 "派[SCOPE.sChar('targitaoan_games_champion').GetPraenomen]吧!"
 me_scythia_01_greek_stance.82.b:0 "让我们派[SCOPE.sChar('targitaoan_games_champion_2').GetPraenomen]去吧。"
 me_scythia_01_greek_stance.82.c:0 "我们不会参加那些自称是我们的国王的人所举行的任何比赛。"
 me_scythia_01_greek_stance.82.desc:0 "大海附近的马主们邀请我们参加游戏和奖励的承诺，以换取我们派出最好的竞争者。\n\n他们说，他们坚持传统，将举办梦幻般的一套游戏，以尊重古老的方式。如果我们要参加，按照我们的惯例，要派最自豪、最能干的年轻[ROOT.GetCountry.GetAdjective]运动员，代表我们参赛。我们相信我们已经找到了两个理想的候选人；一个叫[SCOPE.sChar('targitaoan_games_champion').Custom('get_godly_description')]的[SCOPE.sChar('targitaoan_games_champion').GetPraenomen]，和一个叫[SCOPE.sChar('targitaoan_games_champion_2').Custom('get_godly_description')][SCOPE.sChar('targitaoan_games_champion_2').GetHerselfHimself]的[SCOPE.sChar('targitaoan_games_champion_2').GetPraenomen]。在这些优秀的运动员中，我们应该派谁去参加比赛？"
 me_scythia_01_greek_stance.82.t:0 "$me_scythia_01_greek_stance.80.t$"
 me_scythia_01_greek_stance.84.a:0 "赞美[SCOPE.sChar('victorious_competitor').GetPraenomen]!"
 me_scythia_01_greek_stance.84.b:0 "啊，好吧，下次运气会更好。"
 me_scythia_01_greek_stance.84.c:0 "精彩的活动!"
 me_scythia_01_greek_stance.84.desc:0 "辉煌的塔耳吉塔俄斯运动会已经结束，有很多欢呼和庆祝。在战车比赛、摔跤比赛和库米斯喝酒比赛之间，很难选择一个最喜欢的时刻。\n\n然而，比赛的高潮是在猎野兔的过程中，当一队队马匹向着那只银色的野兔狂奔时，雷鸣般的马蹄声传得很远很远。\n\n当[SCOPE.sChar('victorious_competitor').GetName]的[SCOPE.sC('victor_origin_country').GetName]冲过[SCOPE.sChar('highlight_competitor_2').GetName]的[SCOPE.sC('highlight_2_origin_country').GetName]，并巧妙地将[SCOPE.sC('highlight_2_origin_country').GetHerHis]长矛投掷到猎物的脖子上。毫无疑问，[SCOPE.sC('highlight_2_origin_country').GetName]将作为塔耳吉塔俄斯运动会的冠军而载入史册!"
 me_scythia_01_greek_stance.84.desc_2:0 "辉煌的塔耳吉塔俄斯运动会已经结束，有很多人在欢呼和庆祝。然而，今年的活动却因追随者[SCOPE.sChar('victorious_competitor').GetName]的死亡而带有悲伤的色彩。由于不愿意在死亡面前放弃，[SCOPE.sChar('victorious_competitor').GetSheHe]在其中一个武术项目中与[SCOPE.sChar('victorious_competitor').GetHerHis]的对手战斗到最后，由于这些情有可原的情况，他被光荣地宣布为胜利者。\n\n尽管如此，许多其他活动吸引了大量的观众，其中一个特别令人难忘的活动是[SCOPE.Custom('get_olympic_highlight')]。"
 me_scythia_01_greek_stance.84.t:0 "$me_scythia_01_greek_stance.80.t$：塔耳吉塔俄斯运动会结束了"
 me_scythia_01_greek_stance.85.a:0 "我们一定是以某种方式冒犯了强大的宙斯。"
 me_scythia_01_greek_stance.85.desc:0 "看来几乎没有人参加塔耳吉塔俄斯运动会，活动不得不取消。\n\n这种失望对我们国家传统的威望是一个毁灭性的打击。"
 me_scythia_01_greek_stance.85.t:0 "河马场被遗弃"
 me_scythia_01_greek_stance.89.a:0 "我们只能向前看。"
 me_scythia_01_greek_stance.89.desc:0 "这一切始于一个简单而平凡的日子。没有盛大的送行仪式或喧闹的庆祝，只是一个普通的日子……我们的统治者[ROOT.GetCountry.GetRuler.GetName]带着一群久经沙场的贵族领袖作为护卫，骑出了[me_scythia_1_scope.GetCapital.GetName]。这就是为什么当人们看到征服者的队伍在草原和麦田间骑行时，马鞍上飘扬着皇家旗帜，所有人都感到惊讶。这也是为什么他们听到战士们的呐喊声——那声音仿佛只有在激烈的战斗中神明才能发出——纷纷响应号召，所有能够拿起缰绳的人都跃上了战马，跟随着这声召唤前行。于是，[ROOT.GetCountry.GetRuler.GetName]与坚定不移的同伴们横扫大地，身后卷起一片无法穿透的尘土云，伴随着战马的嘶鸣——这是一种无以言表、令人敬畏的声音，世上没有任何生物听到了不会要么畏缩，要么屈服。但斯基泰人从不畏缩！因此，当[ROOT.GetCountry.GetRuler.GetName]返回[me_scythia_1_scope.GetCapital.GetName]时，[COUNTRY.GetRuler.GetSheHe]带回来的是世界上前所未见的强大骑兵军队。征服整个世界的道路就在他们面前展开……他们只需前去夺取。"
 me_scythia_01_greek_stance.89.t:0 "王族斯基泰的崛起"
 me_scythia_1_maeotia_100_pos_opmod:0 "外交联盟"
 me_scythia_1_maeotia_50_pos_opmod:0 "迈俄提亚的人质"
 me_scythia_1_olbia_100_pos_opmod:0 "外交联盟"
 me_scythia_1_olbia_75_pos_opmod:0 "奥尔比亚人质"

 me_scythia_1_sindica_50_pos_opmod:0 "辛迪卡人质"
 me_scythia_1_tyras_100_pos_opmod:0 "外交联盟"
 me_scythia_1_tyras_110_pos_opmod:0 "外交联盟"
 me_scythia_1_tyras_50_pos_opmod:0 "泰兰的人质"
 me_scythia_1_tyras_60_pos_opmod:0 "切尔尼桑人质"
 me_scythia_1_tyrgetae_110_pos_opmod:0 "外交联盟"
 me_scythia_1_tyrgetae_60_pos_opmod:0 "雇佣兵的战利品"
 me_scythia_lay_land_cmod:0 "满意的部落"
 mercenary_training:0 "雇佣兵训练"
 missing_office_holder_scythia.tt:0 "现在似乎还没有人担任这个职务。"
 pillaging_greeks:0 "掠夺的希腊人"
 promising_port:0 "有前途的港口"
 protected_farms:0 "受保护的利益"
 sarmatia_formable_modifier:0 "统一的萨尔马提亚"
 scythia_01_greek_stance_12_reward.tt:0 "我们可以沿着两条任务路线中的一条前进。"
 scythia_01_greek_stance_2_reward.tt:0 "我们可以沿着两条任务路线中的一条前进。"
 scythia_01_greek_stance_5_reward.tt:0 "完成后，我们将在陶里卡地区建造新的城市。"
 scythia_01_greek_stance_7_reward.tt:0 "完成后，我们将在一个省份中获得一些希腊人口。"
 scythia_10_loyalty:0 "满意"
 scythia_20_loyalty:0 "快乐"
 scythia_mission_01_greek_stance:0 "对希腊人的立场"
 scythia_mission_01_greek_stance_BUTTON_TOOLTIP:0 "北方的斯基泰部落必须应对希腊人在其领土上日益增长的影响。"
 scythia_mission_01_greek_stance_CRITERIA_DESCRIPTION:0 "当斯基泰人选择遵循我们祖先的传统或完全接受希腊人的习俗时，该使命完成。"
 scythia_mission_01_greek_stance_DESCRIPTION:0 "自先王阿忒亚斯死于马其顿国王腓力二世之手后，我族便陷入了漫长的衰落期。我们与希腊人的关系向来不甚稳定，而今部分族人却将他们的城邦视为力量与稳定的支柱。我们究竟该顺应时代变迁，还是坚守游牧传统——正如无数世代以来我们所做的那样？"
 scythia_mission_01_greek_stance_REWARD_DESCRIPTION:0 "改革政府，改变斯基泰部落的社会方向。"
 scythia_mission_01_greek_stance_task_1:0 "愿生为希腊人，抑或毁灭他们"
 scythia_mission_01_greek_stance_task_10:0 "举办黑海运动会"
 scythia_mission_01_greek_stance_task_10_DESC:0 "既然我们崇拜希腊众神，就该在希腊舞台上自豪地宣告我们的存在。让我们效法奥林匹克运动会，在广阔的黑海之滨为同样具有希腊血统的国家举办挑战赛。"
 scythia_mission_01_greek_stance_task_11:0 "加冕巴西琉斯"
 scythia_mission_01_greek_stance_task_11_DESC:0 "时机已至。我们踏过漫漫征途，历经艰辛，如今终可自称为热爱希腊的民族，仅仅存留些许游牧传统。因此，我们理应在族人中加冕一位希腊国王——斯基泰人的首位巴西琉斯。"
 scythia_mission_01_greek_stance_task_12:0 "他们得死"
 scythia_mission_01_greek_stance_task_12_DESC:0 "我族已作出抉择，拒绝效仿希腊之道。此刻我们必须掌控这片疆域，向外族人展现斯基泰之道真正的力量！"
 scythia_mission_01_greek_stance_task_13:0 "统一斯基泰人"
 scythia_mission_01_greek_stance_task_13_DESC:0 "我族人当同心同声，同手祈祷，同骑战马，同弓射出毒箭。于是事便如此。"
 scythia_mission_01_greek_stance_task_14:0 "献祭希腊人"
 scythia_mission_01_greek_stance_task_14_DESC:0 "我们必须把敌人献祭予神灵，平息神怒，祈求吉兆。"
 scythia_mission_01_greek_stance_task_15:0 "他们在我们脚下"
 scythia_mission_01_greek_stance_task_15_DESC:0 "希腊人如今只能成为我们的敌人。让我们引诱他们愚蠢地进攻我们的边境，这样我们便能自由地向他们宣战。"
 scythia_mission_01_greek_stance_task_16:0 "肩负堤拉斯河"
 scythia_mission_01_greek_stance_task_16_DESC:0 "堤拉斯河将成为我族领地的全新边界。河岸的驻军守护着我们的侧翼，我方骑兵可肆无忌惮地发动突袭。"
 scythia_mission_01_greek_stance_task_17:0 "陶里人的悬崖"
 scythia_mission_01_greek_stance_task_17_DESC:0 "希腊人有时会把陶里人和我们混为一谈。也许在我们的统治下，这些热爱海洋的外国人会得到更好的利用？"
 scythia_mission_01_greek_stance_task_18:0 "他们只能做奴隶"
 scythia_mission_01_greek_stance_task_18_DESC:0 "博斯普鲁斯人除了麻烦还剩什么？让他们做奴隶，起码他们能让我们发财。"
 scythia_mission_01_greek_stance_task_19:0 "伟大的部落"
 scythia_mission_01_greek_stance_task_19_DESC:0 "我们有足够的有能力的战士来集结伟大的部落。去吧，召集我们中的健壮男女。"
 scythia_mission_01_greek_stance_task_1_DESC:0 "我们与希腊城邦的持续贸易往来，使毗邻边境上的斯基泰人深受影响。异族文化似乎渗透到我们部落习俗的诸多层面。有传言称，希腊仪礼如今正在露天帐篷中举行，而人们私下里还为异邦神祇建造了许多小雕像。"
 scythia_mission_01_greek_stance_task_2:0 "他们将加入我们"
 scythia_mission_01_greek_stance_task_20:0 "不太可能的盟友"
 scythia_mission_01_greek_stance_task_20_DESC:0 "在我们征服该地区的过程中，博斯普鲁斯人被证明是伟大的对手。我们可能无法单独对抗他们，所以我们必须找到盟友。我们将向一些邻国提出外交建议，以换取军事援助。"
 scythia_mission_01_greek_stance_task_21:0 "博斯普鲁斯王国"
 scythia_mission_01_greek_stance_task_21_DESC:0 "现在是我们统治整个陶里卡的时候了!无论博斯普鲁斯海峡对面的土地如何沦陷，让这一边的土地属于我们。"
 scythia_mission_01_greek_stance_task_22:0 "烧毁他们的城市"
 scythia_mission_01_greek_stance_task_22_DESC:0 "希腊人和外国人都会害怕和恐惧我们的斯基泰军队。他们长期以来一直以傲慢和居高临下的姿态行事。我们将发出一个他们不会很快忘记的信息。"
 scythia_mission_01_greek_stance_task_23:0 "第二个黄金时代"
 scythia_mission_01_greek_stance_task_23_DESC:0 "在整个陶里卡和萨尔马提亚，其他部落和国家已经学会了尊重我们的指挥，害怕我们的军队。他们曾经骄傲的城市躺在废墟上，而我们自己的首都却在繁荣发展。我们是正在崛起的斯基泰王族，我们将永远骑着马!"
 scythia_mission_01_greek_stance_task_24:0 "塔耳吉塔俄斯运动会"
 scythia_mission_01_greek_stance_task_24_DESC:0 "让我们加强我们对世界上的马王的统治力。派出使者，号召所有远近的团体，越过连绵的山丘，穿过无尽的平原，来到我们的土地，参加伟大的塔耳吉塔俄斯运动会，以纪念我们的先祖。"
 scythia_mission_01_greek_stance_task_25:0 "马主们准备"
 scythia_mission_01_greek_stance_task_25_DESC:0 "如果我们要变得更加强大并征服我们的敌人，我们必须建立一个伟大的、不可阻挡的部落。"
 scythia_mission_01_greek_stance_task_26:0 "驻守城墙"
 scythia_mission_01_greek_stance_task_26_DESC:0 "无论是随机的突击队还是无尽的敌人，我们必须准备好保护自己。"
 scythia_mission_01_greek_stance_task_27:0 "从我们的手掌中"
 scythia_mission_01_greek_stance_task_27_DESC:0 "为了供应我们伟大的部落，我们需要生产更多的食物。大海和草原之间的土地很肥沃。我们的田地将由那些不能骑马的人和我们众多的奴隶来耕种。"
 scythia_mission_01_greek_stance_task_28:0 "奢侈品是必需品"
 scythia_mission_01_greek_stance_task_28_DESC:0 "为了维持我们的扩张，我们将需要更多的钱。购买希腊和邻国人民的商品，并将贸易引入我们的港口。"
 scythia_mission_01_greek_stance_task_2_DESC:0 "既然我们选择接受希腊城市对我等民族产生的希腊化影响，那就必须与之建立更紧密的联系。"
 scythia_mission_01_greek_stance_task_3:0 "贸易需要港口"
 scythia_mission_01_greek_stance_task_3_DESC:0 "如果我们要在海上与希腊城市竞争贸易和权力，我们需要炫耀一个伟大的港口来接待商船，以及一个他们可以出售货物的市场。"
 scythia_mission_01_greek_stance_task_4:0 "与博斯普鲁斯人对峙"
 scythia_mission_01_greek_stance_task_4_DESC:0 "我们已经建立了一个伟大的港口城市的基础，并很快建立了一个贸易帝国。然而，博斯普鲁斯王国，目前广袤海浪的统治者，是一个永远存在的威胁。水中有泡沫，空气中充满了紧张……"
 scythia_mission_01_greek_stance_task_5:0 "斯基泰五城"
 scythia_mission_01_greek_stance_task_5_DESC:0 "杂乱的茅屋和马车队无法与希腊人相提并论。我们必须贸易；我们必须繁荣；我们必须建造城市！"
 scythia_mission_01_greek_stance_task_6:0 "放弃部落之道"
 scythia_mission_01_greek_stance_task_6_DESC:0 "若要效法希腊国家，我们必须抛弃束缚我们的部落陋习。国家必须强大，人民必须在我们的土地上得到军事与经济的双重保障。"
 scythia_mission_01_greek_stance_task_7:0 "邀请希腊人"
 scythia_mission_01_greek_stance_task_7_DESC:0 "若要最为深入地学习希腊之道，在我们自己的城市里树立典范无疑最为理想。"
 scythia_mission_01_greek_stance_task_8:0 "接纳希腊宗教"
 scythia_mission_01_greek_stance_task_8_DESC:0 "我们已让希腊人融入日常生活，栖居于我们的城邦。如今更要让他们走进我们的心灵。让旧习随新风而逝去吧。\n\n当任务完成时，我们将失去#R 30点稳定度#!，并将神系切换至#Y 希腊多神教#!。"
 scythia_mission_01_greek_stance_task_9:0 "古老的纽带"
 scythia_mission_01_greek_stance_task_9_DESC:0 "很久以前，我们族中有人向希腊人讲述了我们最伟大的传说——关于我们民族的起源。然而当希腊人目睹我等诸神的伟业时，却认为这一切是彼等神灵的所为，便宣称这乃是他们的神施展的神迹。赫拉克勒斯尤为突出；他们声称他与半人半蛇的生物交合，由此缔造了我们部落的始祖。或许他们的版本与我们的并无二致，若我们愿成为希腊人，就让我们相信如此吧。"

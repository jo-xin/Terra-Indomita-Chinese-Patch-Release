 steppe_horde_desc:0 "尽管草原上的游牧民族本质上是由众多相互竞争，各具特色的部落组成的庞大群体，但整个草原却弥漫着一种部落关系与等级网络的氛围。在这套等级体系的顶端，是统治部落及其来自最强大家族的君主式人物，他们对所有下属部落保持着某种程度的控制权和管辖权。"

 desc_last_line_of_defense:0 "#Y [honor_target_culture.GetName]#!是#Y [COUNTRY.GetAdjective]#!的最重要和最狂热的支持者。"
 desc_market_hub:0 "这里是该地区最大的贸易中心。"
 desc_me_scy_1_180_cmod:0 "最近减少了对不利的臣民的权利，使宫廷的贵族们既富得流油，又对国家负债累累。"
 desc_me_scy_1_18_cmod:0 "最近的奴隶收购潮导致了奴隶经济的增长和奴隶自身工作条件的恶化。"
 desc_me_scy_1_19_cmod:0 "从我们自己的文化中吸收骑手，以及技术和方法的交流，使我们的骑兵的效率得到了全面提高。"
 desc_me_scy_1_1_cmod:0 "我们通过法律法令赋予我们的外交官权力，让他们有更多机会接触我们的国库，以便他们能够更好地执行任务。"
 desc_me_scy_1_21_cmod:0 "最近对我们臣民的土地的掠夺已经激怒了一些精英。我们不应该指望他们在短时间内给予我们温暖。"
 desc_me_scy_1_22_cmod:0 "在最近的掠夺中，我们的突击队得到了大量的战利品，并渴望得到更多。"
 desc_me_scy_1_25_cmod:0 "我们忠诚的部族领袖亲自借给我们一些最好的骑手。他们将成为我们军队的优秀指挥官。"
 desc_me_scy_1_26_cmod:0 "我们的人民从来就不擅长围攻，也不擅长攻打重兵把守的城市。学习的唯一途径是通过实践和实验。"
 desc_me_scy_1_27_1_pmod:0 "这片土地上的农作物产量大大超过了预期!诸神在向我们微笑。"
 desc_me_scy_1_27_2_pmod:0 "在这里放牧的牲畜往往比其他地方的牲畜更健康，更容易繁殖。"
 desc_me_scy_1_28_cmod:0 "我们的人民对生活中更美好事物的需求似乎与日俱增，推动了商品价格的相应上涨。"
 desc_me_scy_1_28_pmod:0 "随着比以往更多的商品流入我们的首都，难怪看起来每个人都精神抖擞。"
 desc_me_scy_1_32a_cmod:0 "我们的人民对我们的反复无常感到厌倦。"
 desc_me_scy_1_32b_cmod:0 "我们的人民在我们的高压统治下越来越害怕。"
 desc_me_scy_1_3_pmod:0 "我们鼓励发展这个新的避难所作为贸易和生产中心。"
 desc_me_scy_1_49_cmod:0 "我们的近期胜利已经赋予了祭司团更大的权力。"
 desc_me_scy_1_53_cmod:0 "我们最近展示的力量和承诺已经赢得了强大的部族对我们事业的支持。"
 desc_me_scy_1_5_pmod:0 "这个地区很受移民们的欢迎，他们寻求迁移到这里开始新的生活。"
 desc_me_scy_1_5a_pmod:0 "我们已经谴责了境内的异教行为。"
 desc_me_scy_1_5b_pmod:0 "我们已经谴责了国境内的异教活动。"
 desc_me_scy_1_6_cmod:0 "新的法律和积极的管理正在鼓励人们扎根。"
 desc_me_scy_1_6a_pmod:0 "一个新的邪教被建立起来。"
 desc_me_scy_1_6b_pmod:0 "我们的行为冒犯了这里的圣人，他们现在正在挑起麻烦。"
 desc_me_scy_1_7_pmod:0 "我们吸引了外国专家来协助管理这个省。"
 desc_me_scy_1_89_cmod:0 "我们的政府改组为这种新的形式，在保护我们古老习俗的同时，产生了比以前更大的行政控制。"

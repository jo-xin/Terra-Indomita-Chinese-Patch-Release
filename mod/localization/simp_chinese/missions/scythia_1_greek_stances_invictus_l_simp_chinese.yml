 golden_axe:0 "重塑黄金战斧"
 golden_axe_desc:0 "这是指挥官的不二法宝，是塔耳吉塔俄斯的儿子克洛阿克赛斯掌握的从天而降的四件黄金物品之一，成为主导斯基泰部落的统治者。"
 golden_axe_treasure:0 "黄金战斧"
 golden_axe_treasure_desc:0 "指挥官的不二法宝，这是塔耳吉塔俄斯的儿子克洛阿赛斯掌握的从天而降的四件黄金物品之一，成为主导斯基泰部落的统治者。"
 golden_chalice:0 "重塑黄金圣杯"
 golden_chalice_desc:0 "这是塔耳吉塔俄斯的儿子克洛阿克赛斯掌握的从天而降的四件金器之一，酒就像口齿不清的话语一样从里面流出来，成为斯基泰部落的统治者。"
 golden_chalice_treasure:0 "金杯"
 golden_chalice_treasure_desc:0 "这是从天上掉下来的四件金器之一，塔耳吉塔俄斯的儿子克洛阿克赛斯掌握了它，成为斯基泰部落的统治者，酒就像口齿不清的人一样从里面流出来。"
 golden_plough:0 "重塑金犁"
 golden_plough_desc:0 "耕种土地的工具，这是从天上掉下来的四件黄金物品之一，塔耳吉塔俄斯的儿子克拉科赛司掌握了它，成为主导斯基泰部落的统治者。"
 golden_plough_treasure:0 "金犁"
 golden_plough_treasure_desc:0 "这是耕种土地的工具，是塔耳吉塔俄斯的儿子克拉科赛司掌握的从天而降的四件黄金物品之一，成为主导斯基泰部落的统治者。"
 golden_yoke:0 "重塑金轭"
 golden_yoke_desc:0 "适合最强壮的牛使用的缰绳，这是从天上掉下来的四件黄金物品之一，塔耳吉塔俄斯的儿子克拉科赛司握住了它，成为主导斯基泰部落的统治者。"
 golden_yoke_treasure:0 "金轭"
 golden_yoke_treasure_desc:0 "这是适合最强壮的牛的缰绳，是从天而降的四件金物之一，塔耳吉塔俄斯的儿子克拉科赛司斯掌握了它，成为占优势的斯基泰部落的统治者。"

l_simp_chinese:
 canals_of_funan_mod:0 "扶南运河"
 capital_phnom_trade_boost_mod:0 "拓展市场"
 desc_capital_phnom_trade_boost_mod:0 "因我邦沿湄公河畔所做之基础设施投资，我邦都城享有广阔之贸易。"
 desc_end_of_phnom_mission_tree_reward_mod:0 "因我邦在湄公河三角洲区域之空前增长，我举国上下已步入某种黄金时代。"
 desc_phnom_boosted_global_trade_mod:0 "因我邦道路与运河之体系，举国上下皆经历贸易之稳步增长。"
 desc_phnom_cheaper_slaves_cost:0 "须尽力殖民周边无人区域。"
 desc_phnom_expanded_diplo_mod_1:0 "我邦殖民湄公河三角洲之事迹远播四方，众多邦国皆有意与我建立邦交。"
 desc_phnom_expanded_diplo_mod_2:0 "我邦之民正以营造大师与商贾之名声闻于世，令邻邦钦羡不已。"
 desc_phnom_expanded_diplo_mod_3:0 "我国诸港遍布经验老到之海员，此皆赖我邦对周边江海之精熟驾驭。"
 desc_phnom_expanded_hunting_mod:0 "此区域物产丰饶，野物繁多，堪称我邦全境猎获至丰之地。"
 desc_phnom_expanded_mines_mod:0 "虽于德伊丛林矿场中劳作之生涯苦不堪言，然无人能否认此区域之产出极为丰厚。"
 desc_phnom_harbor_mod:0 "虽然众人皆知我邦都城乃贸易中心，然此处港湾亦为我水师不可或缺之根基。"
 desc_phnom_jungle_warrior_master_mod:0 "我军习丛林战，逢之必致命。"
 desc_phnom_maurya_marriage_trade_connection_mod:0 "我邦以贸易及联姻所结之海外联系，为邦国带来了赫赫声望与非凡荣耀。"
 desc_phnom_nat_temple_modifier_reward:0 "此行省拥有一座宏大的寺庙群，乃为当地婆罗门所建之居所，四方之人远道而来，瞻仰此寺及城市之威仪。"
 desc_phnom_prosperous_hinterland:0 "都城外各处领土中的作坊产能丰沛，为我诸城供应各式精工良造之货物。"
 desc_phnom_renowned_architects:0 "我邦都城之爆炸性增长，为一精英工匠阶层的兴旺创造了条件。"
 desc_phnom_sugar_farms_mod:0 "我邦农户善用湄公河三角洲南部所生之甘蔗，已于此区域建立起庞大的奴隶庄园。"
 end_of_phnom_mission_tree_reward_mod:0 "湄公巨贾"
 me_phnom_1.a:0 "创造历史之时已至…"
 me_phnom_10.a:0 "巴纳之资源，吾等需之必取之"
 me_phnom_10_desc:0 "虽我辈在#E巴拿#!地区立足未久，我勤劳的工人们已尽力善处此境，我等欣然禀报，位于[GetProvince('(int32)11015').GetName]的矿场虽素以'无奴可生还'之名远扬，却早已开始产出。\n\n显而易见，若可选择，我劳工宁愿被派往[GetProvince('(int32)11014').GetName]附近的营地狩猎，然不幸的是，此事并非他们所能自主。"
 me_phnom_10_title:0 "工艺精进"
 me_phnom_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y Advancements In Production#!' $mission_completed_tooltip_2$"
 me_phnom_11.a:0 "湄公之赐，民生之基"
 me_phnom_11_desc:0 "当外国使节和商人乘船抵达#E湄公河三角洲#!时，他们立刻便感受到了[ROOT.GetCountry.GetName]国力的强盛——精良建造的战船日夜巡弋于#E玛拉高棉#!水域，而湄公河沿岸修建的街道与运河则由骄傲的征召兵守卫，他们同时协助港口码头上的工人劳作。\n\n这片土地上的人民友善好客、热衷贸易且慷慨至极，但对那些存心挑衅之人绝不宽纵。当使节与旅人最终返回自己的船只时，行囊中塞满了精美的[ROOT.GetCountry.GetAdjective]器物，诸如陶瓷与彩饰皮革，所有人离去时都深知：这片富饶之地已被真正的主人驾驭。"
 me_phnom_11_title:0 "湄公商贾大师"
 me_phnom_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y Master Merchants Of Mekong#!' $mission_completed_tooltip_2$"
 me_phnom_12.a:0 "吾等将成此域贸易之枢纽"
 me_phnom_12_desc:0 "[ROOT.GetCountry.GetCapital.GetName]原本就拥有[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]地区最大的集市之一，而这还是在[ROOT.GetCountry.GetRuler.GetName]下令扩建城区以容纳更多商贾之前。\n\n当[ROOT.GetCountry.GetCapital.GetName]的工程最终完工时，这座城市的名望已远超所有对手，无数旅人蜂拥至其城门，期望在其商业区内发家致富。"
 me_phnom_12_title:0 "[ROOT.GetCountry.GetCapital.GetName]之市集"
 me_phnom_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y Markets of Vyadhapura#!' $mission_completed_tooltip_2$"
 me_phnom_13.a:0 "此等运河乃[ROOT.GetCountry.GetName]之血脉筋络"
 me_phnom_13_desc:0 "在[ROOT.GetCountry.GetAdjective]人民的历史上，可曾有过哪位领袖像我们的[ROOT.GetCountry.GetRuler.GetName]一样彻底改变了这片土地？\n\n[ROOT.GetCountry.GetRuler.GetSheHe]不仅将[ROOT.GetCountry.GetCapital.GetName]城改造得面目一新——这本身已是了不起的功绩——如今就连都城之外的广袤土地，也因我们[ROOT.GetCountry.GetRulerTitle]的号令而焕然不同。\n\n尽管费时整整十年，一套遍布我们大片疆域的庞大运河与道路系统已然建成，从此我们的人民前所未有地紧密相连。"
 me_phnom_13_title:0 "运河体系"
 me_phnom_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y A System Of Canals#!' $mission_completed_tooltip_2$"
 me_phnom_14.a:0 "凡人皆爱甘甜——此船将载吾货行遍四方"
 me_phnom_14_desc:0 "我们在[ROOT.GetCountry.GetCapital.GetName]接到消息，遍布[GetProvince('(int32)9833').GetName]、[GetProvince('(int32)9834').GetName]和[GetProvince('(int32)9835').GetName]领地的大片甘蔗种植园终于全部竣工了——这无疑是[ROOT.GetCountry.GetAdjective]人民有史以来最大的一笔投资。\n\n我们很快将拥有多得不知如何处置的蔗糖；来自#E楚#!甚至#E阿拉伯#!的商人已在驶往我们市场的途中，携带着他们的奢侈品，期盼我们的价格低廉。"
 me_phnom_14_title:0 "南方蔗田"
 me_phnom_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y Sugar Farms Of The South#!' $mission_completed_tooltip_2$"
 me_phnom_15.a:0 "凡来吾市求购者，无不欢迎"
 me_phnom_15_desc:0 "这些年来，[GetProvince('(int32)10963').GetName]的海上交通量增长了十倍，无疑得益于其得天独厚的地理位置和靠近#E玛拉高棉#!的天然良港。\n\n眼见我们的南部地区已由道路和运河与北方相连，我们的工程师在此建城便成了水到渠成之事，如今前往我们港口的外国商人将会享受到我们为他们提供的升级设施。"
 me_phnom_15_title:0 "俄厄港"
 me_phnom_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y The Port of Oc Eo#!' $mission_completed_tooltip_2$"
 me_phnom_16.a:0 "[ROOT.GetCountry.GetCapital.GetName]理当从此横财受益"
 me_phnom_16.b:0 "让[ROOT.GetCountry.GetName]举国共享吾等所获之富"
 me_phnom_16.c:0 "一次取尽全款"
 me_phnom_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们从工程兵团获悉，他们穿越南部#E湄公河三角洲#!洪泛平原与丛林所修建的小径与道路已经完工。\n\n虽然许多商人仍选择沿河运输货物，但其他旅人开始取道内陆公路，而公路沿线聚落的居民感激不尽，因为集市如今主动来到了他们面前。我们的税吏报告说手中有了盈余，得益于贸易的增长，我们在该地区面临一个抉择——当如何处置这些利润？"
 me_phnom_16_title:0 "运河贯通"
 me_phnom_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y Completing The Canals#!' $mission_completed_tooltip_2$"
 me_phnom_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phnom_mission_tree_task_17$#!' $mission_completed_tooltip_2$"
 me_phnom_18.a:0 "须先发制敌，勿使其抵平原"
 me_phnom_18_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]从早到晚政务繁忙，但近来[ROOT.GetCountry.GetRuler.GetSheHe]却抽空亲自到[GetProvince('(int32)9828').GetName]附近的丛林里与我们的战士一同训练。\n\n我们的武士日出时从城门出发，黄昏笼罩都城时归来，汗流浃背，浑身酸痛。虽然训练漫长而艰苦，我们的征召兵已成为密林华盖与浓密灌木丛中战斗的行家。"
 me_phnom_18_title:0 "丛林操练"
 me_phnom_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y Jungle Training#!' $mission_completed_tooltip_2$"
 me_phnom_19.a:0 "奇迹之观！梵天神恩昭然显现"
 me_phnom_19_desc:0 "当我们的人民最终决定要为#E雍义教#!的虔诚信徒建造一座宏伟寺庙时，[ROOT.GetCountry.GetRuler.GetName]不惜一切代价为神灵建造礼拜之所，这毫不令人意外。[ROOT.GetCountry.GetAdjective]国库被大量动用，全[ROOT.GetCountry.GetName]最娴熟的建筑师和最精湛的工匠都被召集起来。\n\n婆罗门对此十分满意，若运气够好，清晨时分还可看见精灵在寺庙庭院中嬉戏舞蹈，然后随露水一同消散。"
 me_phnom_19_title:0 "容寺"
 me_phnom_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y A Yung Temple#!' $mission_completed_tooltip_2$"
 me_phnom_1_desc:0 "从我们在[ROOT.GetCountry.GetCapital.GetName]城的有利位置来看，我们有望成为#E湄公河三角洲#!毫无争议的主宰——我们已掌控环绕奔流大河的富饶洪泛平原，并看到了向北扩张以蚕食邻国的紧迫机遇。\n\n我们必须毫不犹豫，趁此良机——让我们投身于所选定的神圣事业——缔造一个比我们自身更伟大的存在，一个将保障我们子孙万代安全与繁荣的王国！"
 me_phnom_1_title:0 "湄公三角洲之主"
 me_phnom_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y Lords Of The Mekong Delta#!' $mission_completed_tooltip_2$"
 me_phnom_20.a:0 "吾等需一专制君主"
 me_phnom_20.b:0 "贵族君主制最合吾意"
 me_phnom_20.c:0 "军国君主制乃我所好"
 me_phnom_20.d:0 "神权政治乃唯一之道"
 me_phnom_20.e:0 "财阀政治甚合吾宜"
 me_phnom_20_desc:0 "众所周知，[ROOT.GetCountry.GetRuler.GetName]是一位缜密的谋划者，能推演想象中每一种局势的每一个转折所带来的后果，因此当其为[GetProvince('(int32)9328').GetName]人民宣告一种新政体时，竟无一人反对，无一句叛逆或煽动叛乱的愤怒呼喊，也就不足为奇了。所有反对声音早已被提前平息，众人似乎一致同意；唯一剩下的任务便是[ROOT.GetCountry.GetRuler.GetFirstName]盖上[ROOT.GetCountry.GetRuler.GetHerHis]最终御准之印。"
 me_phnom_20_title:0 "$phnom_mission_tree_task_20$"
 me_phnom_2_title:0 "$phnom_mission_tree_task_2$"
 me_phnom_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phnom_mission_tree_task_2$#!' $mission_completed_tooltip_2$"
 me_phnom_3.a:0 "[ROOT.GetCountry.GetAdjective]之卓越不容置疑"
 me_phnom_3_desc:0 "无人能否认，[ROOT.GetCountry.GetRuler.GetName]已将我们的海军扩充到了令人瞩目的规模——这支舰队能够将我们的货物运往远方市场，甚至能与当地海盗周旋并占得上风，只要神明眷顾我们的水手。\n\n如今我们有了正经的海军，便可将力量投送到远离本土海岸的地方——这对我们的人民而言是个好日子。"
 me_phnom_3_title:0 "殖民湄公三角洲"
 me_phnom_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y Colonizing the Mekong Delta#!' $mission_completed_tooltip_2$"
 me_phnom_4.a:0 "此等大事何必此时议之？先共欢庆"
 me_phnom_4_desc:0 "几日前，[ROOT.GetCountry.GetRuler.GetSpouse.GetName]乘坐象牙战车抵达[ROOT.GetCountry.GetCapital.GetName]，随行仪仗堪配公主之尊。从[GetProvince('(int32)4440').GetName]到[GetProvince('(int32)9828').GetName]花了数月行程，但这位孔雀王朝的新娘既已到达，婚礼便将在数日内举行。\n\n尽管社会中一些守旧派斜眼看待[ROOT.GetCountry.GetRuler.GetName]迎娶异邦新娘，但无人敢公开置喙，唯恐[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]的怒火令其日子难过。\n\n虽然许多人缄口不言，但也有人私下承认[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族与#E孔雀王朝#!联姻的好处——我们如今有了非常有权势的亲族。"
 me_phnom_4_title:0 "孔雀联姻"
 me_phnom_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y A Mauryan Marriage#!' $mission_completed_tooltip_2$"
 me_phnom_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phnom_mission_tree_task_5$#!' $mission_completed_tooltip_2$"
 me_phnom_6.a:0 "得地有易有难，終局无二"
 me_phnom_6_desc:0 "尽管我们的移民在穿越南部崎岖乡野时花费了一些时间，我们已接到消息，[GetProvince('(int32)9833').GetName]行省已被我们收入囊中。\n\n说到此事，我们随时准备与北方邻国开战，只等您一声令下，[ROOT.GetCountry.GetRuler.GetName]——人人都知道，我们认为#E真腊#!地区理应属于[ROOT.GetCountry.GetName]。"
 me_phnom_6_title:0 "$phnom_mission_tree_task_3$"
 me_phnom_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $phnom_mission_tree_task_3$#!' $mission_completed_tooltip_2$"
 me_phnom_7.a:0 "尚有更多城池待建，更多道路需铺…"
 me_phnom_7_desc:0 "由于[GetProvince('(int32)9828').GetName]与[GetProvince('(int32)9829').GetName]近在咫尺，都城的居民从家中便能望见湄公河对岸的施工进展。\n\n如今斯昆的工程既已竣工，我们自豪的市民每日都去拜访他们的新\"姊妹城\"，沿着连接两座城市的新建道路悠然渡河。\n\n[ROOT.GetCountry.GetRuler.GetName]希望，假以时日，斯昆能成为[ROOT.GetCountry.GetAdjective]社会的重要前哨，终将与我们的千年古都难分彼此。"
 me_phnom_7_title:0 "姊妹城"
 me_phnom_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y Sister Cities#!' $mission_completed_tooltip_2$"
 me_phnom_8.a:0 "此刻于[ROOT.GetCountry.GetAdjective]之史，至为关键"
 me_phnom_8_desc:0 "从旅人口中得知我们东面的#E巴拿#!地区是一片沃土，盛产谷物且野兽众多后，[ROOT.GetCountry.GetRuler.GetName]决定派遣大批移民进入丛林，期望他们的到来能将文明带入荒野。\n\n诚然，这片土地肥沃，但[ROOT.GetCountry.GetRuler.GetFirstName]同样在意为[ROOT.GetCountry.GetName]夺取[GetProvince('(int32)11015').GetName]的贵金属——在[GetProvince('(int32)9828').GetName]居住和经商的富庶商贾一致认为，这应是我国的优先事项。"
 me_phnom_8_title:0 "远赴巴纳"
 me_phnom_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y Bahnar Bound#!' $mission_completed_tooltip_2$"
 me_phnom_9.a:0 "扶南全境终将归我所有…"
 me_phnom_9_desc:0 "得益于[GetProvince('(int32)9828').GetName]前所未有的建设规模，我们现在有能力建造一支庞大的海军——都城中刚刚竣工的#E造船厂#!将确保我们能把舰队派往任何需要的战场。\n\n我们的战船驶向敌人海岸，只是时间问题了……"
 me_phnom_9_title:0 "宣示海岸"
 me_phnom_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y Claiming The Coasts#!' $mission_completed_tooltip_2$"
 phnom_boosted_global_trade_mod:0 "拓展贸易"
 phnom_capital_decision:0 "扶南明珠"
 phnom_capital_decision_desc:0 "[ROOT.GetCountry.GetCapital.GetName]已然名扬四海，号为东方明珠，万邦之民不远千里而来，但求一睹其荣光。"
 phnom_cheaper_slaves_cost:0 "殖民开拓"
 phnom_developed_delta:0 "开发三角洲"
 phnom_expanded_diplo_mod_1:0 "新兴强权"
 phnom_expanded_diplo_mod_2:0 "令人艳羡的声望"
 phnom_expanded_diplo_mod_3:0 "驰名航海者"
 phnom_expanded_hunting_mod:0 "狩猎营地"
 phnom_expanded_mines_mod:0 "扩建矿场"
 phnom_harbor_mod:0 "军港区"
 phnom_jungle_warrior_master_mod:0 "丛林战精熟"
 phnom_maurya_marriage_trade_connection_mod:0 "尊荣邦交"
 phnom_mission_tree:0 "湄公三角洲之主"
 phnom_mission_tree_BUTTON_TOOLTIP:0 "当修筑运河与道路之网，使湄公巨川之潜力尽展无遗。"
 phnom_mission_tree_CRITERIA_DESCRIPTION:0 "待#E 扶南#!于#E 湄公三角洲#!广建基业、立#E 扶南#!之国，此使命方告功成。"
 phnom_mission_tree_DESCRIPTION:0 "我骄傲之民世代傍#E 湄公河#!之水而居，于广袤三角洲洪泛原上筑城建邑，此即吾人世代栖息之乡。我[ROOT.GetCountry.GetAdjective]部众胸怀百梦，诸多族人渴望广开海外商路。然追逐远方宏图之前，须先理清自家后院诸事。"
 phnom_mission_tree_task_1:0 "殖民湄公三角洲"
 phnom_mission_tree_task_10:0 "运河体系"
 phnom_mission_tree_task_10_DESC:0 "虽我辈确已借#E 湄公河#!以通舟楫，然更有人建言当修筑道路运河之网，连通京师与南境。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 phnom_mission_tree_task_11:0 "南境甘蔗田"
 phnom_mission_tree_task_11_DESC:0 "寰宇间最为人渴求之珍货，莫过于#E 蔗糖#! @sugar!，而天幸我等南境广有膏腴蔗田。若倾力经营沿海之地，则所获之利将超乎想象。\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 phnom_mission_tree_task_12:0 "[GetProvince('(int32)10963').GetName]之港"
 phnom_mission_tree_task_12_DESC:0 "岁月流转，[GetProvince('(int32)10963').GetName]之省于[ROOT.GetCountry.GetAdjective]之民而言日显重镇，其港口之要，仅次于[ROOT.GetCountry.GetCapital.GetName]。\n\n时机既至，当将俄厄升格为真正之城邑，使其名实相副。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 phnom_mission_tree_task_13:0 "贯通运河"
 phnom_mission_tree_task_13_DESC:0 "通达海岸之便，于振兴#E 扶南#!境内商贾大有裨益。万事俱备，当续我未竟之业，毕其运河之功。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 phnom_mission_tree_task_14:0 "丛林训练"
 phnom_mission_tree_task_14_DESC:0 "我辈征召之兵当习练于国中至险至难之地势，盖我等深知此乃大军之利也。\n\n\n\n\n\n\n\n\n\n@tibet_mil5!"
 phnom_mission_tree_task_14_tt:0 "我军需仰仗[GetMilitaryBonus('ti_rong_di_path_1').GetName|Y]#T 戎狄军事传统#!。"
 phnom_mission_tree_task_15:0 "雍式神殿"
 phnom_mission_tree_task_15_DESC:0 "婆罗门众虽散居四邻，然已有议者奏请在[ROOT.GetCountry.GetCapital.GetName]为彼等修筑永久居所。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 phnom_mission_tree_task_16:0 "扶南商贾"
 phnom_mission_tree_task_16_DESC:0 "我辈以商贾大师之名远播四方，诸多显贵与知名艺者络绎经行[ROOT.GetCountry.GetCapital.GetName]，但求博取[ROOT.GetCountry.GetRuler.GetName]之垂青。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 phnom_mission_tree_task_17:0 "征服真腊"
 phnom_mission_tree_task_17_DESC:0 "若我军能克取#E 真腊#!省内广大之地，则当挫败此域至大之劲敌——此诚可足铭记之伟业。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 phnom_mission_tree_task_17_state_mod:0 "真腊崛起"
 phnom_mission_tree_task_18:0 "巩固三角洲"
 phnom_mission_tree_task_18_DESC:0 "今者敌寇已逐出三角洲，是时候欢宴庆贺，略享我等辛劳所得之果实。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 phnom_mission_tree_task_18_tt:0 "除[SCOPE.GetRootScope.GetCountry.GetName|Y]之外，再无他国据有[GetProvince('(int32)9831').GetArea.GetName|Y]、[GetProvince('(int32)9825').GetArea.GetName|Y]、[GetProvince('(int32)9820').GetArea.GetName|Y]或[GetProvince('(int32)9817').GetArea.GetName|Y]之地。"
 phnom_mission_tree_task_19:0 "经营三角洲"
 phnom_mission_tree_task_19_DESC:0 "但我等不能仅止于占据湄公三角洲之地，而须大力开发，善用其天赋之资。当广建城邑，遍布四方！\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 phnom_mission_tree_task_19_tt:0 "[GetProvince('(int32)9831').GetArea.GetName|Y]、[GetProvince('(int32)9825').GetArea.GetName|Y]、[GetProvince('(int32)9820').GetArea.GetName|Y]或[GetProvince('(int32)9817').GetArea.GetName|Y]省之内，至少须有#Y 4#!处领土具备[GetProvinceRank('city').GetName|E]地位。"
 phnom_mission_tree_task_1_DESC:0 "#E 湄公三角洲#!之蛮荒丛林与浩瀚洪泛原呼唤我辈之手将其驯服——当为我主[ROOT.GetCountry.GetName]之荣光，夺取此珍货汇聚之宝地。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 phnom_mission_tree_task_2:0 "孔雀联姻"
 phnom_mission_tree_task_20:0 "扶南王国"
 phnom_mission_tree_task_20_DESC:0 "前路已昭然显现，应许永恒之荣耀以待勇者不失其时。当使天下周知：扶南将建为王国，此乃举世未见之邦！\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 phnom_mission_tree_task_2_DESC:0 "有时政事所需，不得不作巨大牺牲，不论为国为家，悉皆如是。欲固我境外之地位，必行必要之举，以结盟友于可为之处——纵使招致离异亦在所不惜。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 phnom_mission_tree_task_3:0 "扶南之省"
 phnom_mission_tree_task_3_DESC:0 "万事之先，须全然据有本省之地——东境虽无人烟，然[GetProvince('(int32)9827').GetName]则非战不可。\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 phnom_mission_tree_task_4:0 "姊妹城"
 phnom_mission_tree_task_4_DESC:0 "[GetProvince('(int32)9829').GetName]，乃[GetProvince('(int32)9829').GetArea.GetName]省之旧都，距我京师仅一水之隔。其形胜之地正呼唤经济之拓展与投入，而我辈于此道可谓游刃有余。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 phnom_mission_tree_task_5:0 "羁縻巴拿"
 phnom_mission_tree_task_5_DESC:0 "巴拿诸省之天然资源，如谷物、木材与黄金，正待开发。当于荒凉之地建我势力，以取此等财富为己有，然此举先须京师之区殷实足以支撑扩张。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 phnom_mission_tree_task_6:0 "索要海岸"
 phnom_mission_tree_task_6_DESC:0 "若我辈能于[ROOT.GetCountry.GetCapital.GetName]兴建专用港区，则可将军威远投于海外之远。\n\n\n\n\n\n\n\n\n\n@india_mil3!"
 phnom_mission_tree_task_6_tt:0 "我们将获得#Y 扶南#!地区所有沿海省份的宣称。"
 phnom_mission_tree_task_7:0 "生产进步"
 phnom_mission_tree_task_7_DESC:0 "托我辈于#E 巴拿#!地区精打细算之经营，吾国已然赚得巨额财富与声望。#E 德伊#!之矿尤为驰名，然而该地亦以奴隶生不如死之惨况而声名狼藉。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 phnom_mission_tree_task_8:0 "#E 湄公#!商贾大师"
 phnom_mission_tree_task_8_DESC:0 "承此空前之胜业，我辈已步入#T 黄金时代#!——国人将永铭我[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]之丰功伟绩。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 phnom_mission_tree_task_9:0 "[ROOT.GetCountry.GetCapital.GetName]的市场"
 phnom_mission_tree_task_9_DESC:0 "我京师[ROOT.GetCountry.GetCapital.GetName]地据天然形胜，临制四郊乡野。在此经营文明之基，必令举国上下皆受其益。\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 phnom_missions_task_2_tt:0 "安排与[GetCountry('MRY').GetName|Y]的一位孔雀角色联姻。"

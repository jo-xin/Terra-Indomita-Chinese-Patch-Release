 missions_yue_langyayue_task_2_DESC:0 "内战与楚人入侵已为琅琊城带来苦难与毁灭，须在齐楚军队最后风暴来临之前加固城防。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"

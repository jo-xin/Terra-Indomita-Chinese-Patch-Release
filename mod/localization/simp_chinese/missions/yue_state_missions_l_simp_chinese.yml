 missions_yue_tribes_task_22_DESC:0 "$missions_yue_state_task_22_DESC$"
 missions_yue_tribes_task_2_DESC:0 "我都城[ROOT.GetCountry.GetCapital.GetName]尚不配君王之尊，故吾等之责在确保其能令我民众心生敬畏与尊崇。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"

 missions_yue_langyayue_task_5:0 "南越邦国"
 missions_yue_langyayue_task_5_DESC:0 "[GetCharacter('(int32)591').GetName]猝然离世之后，越国因未立嗣君而陷入混乱。如今吾等占据上风，我南方同胞必将寻求我之庇护。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"

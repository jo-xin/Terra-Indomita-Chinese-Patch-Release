 missions_yue_tribes_task_15:0 "统一越族诸部"
 missions_yue_tribes_task_15_DESC:0 "越部族之首脑四分五裂、组织混乱。若吾等妄图与文明邻邦争衡，必须将诸部族统合于一位雄主之旗帜下。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 missions_yue_tribes_task_16:0 "越朝"
 missions_yue_tribes_task_16_DESC:0 "我族之中无一酋长能令众人齐心追随其身后。经诸多争执之后，我部酋长已向大禹之后裔发出邀请，请其将我部族联盟塑造成真正之王国。彼等别无更多选择，因其昔日邦国已化为废墟。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 missions_yue_tribes_task_16_invite_yue_dynasty:0 "我们将邀请越国王室统治我国。"

 missions_yue_state:0 "越国兴亡录"
 missions_yue_state_BUTTON_TOOLTIP:0 "逆转天命，谈何容易。"
 missions_yue_state_CRITERIA_DESCRIPTION:0 "当失落之#E 越#!故土重归版图、南方诸部族皆已臣服之时，此任务即告达成。"
 missions_yue_state_DESCRIPTION:0 "越国昔日雄踞江淮与东南，却在内乱、继承危机与楚国攻势中失去故土。如今我们必须收复吴越旧地，重振会稽与水师，安抚南方越人诸部，并再次让中原诸国承认越的威名。"
 missions_yue_state_task_1:0 "收复吴地"
 missions_yue_state_task_10:0 "孙子兵法"
 missions_yue_state_task_10_DESC:0 "吴国最负盛名之子，孙武，于约两百年前将其深邃之战略战争洞见著录于经典之作《孙子兵法》之中，然于此战国时代，其说较以往更为切要。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 missions_yue_state_task_11:0 "伐齐雪耻"
 missions_yue_state_task_11_DESC:0 "狡诈之#E齐#!以#E楚#!易取为饵，诱使[GetCharacter('(int32)591').GetName]王转攻他方，然吾等因轻信其言而光辉不再；告知齐国，若不臣服于越，必将灰飞烟灭。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 missions_yue_state_task_11_claims:0 "吾等将获得沛、彭、山阳及泰山诸郡以及齐国所辖全部省份之宣称。"
 missions_yue_state_task_12:0 "灵渠奇迹"
 missions_yue_state_task_12_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]已下令开凿运河，连接#E湘江#!与#E漓江#!。[ROOT.GetCountry.GetRulerTitle]期望此水道可用于调运军队及输送谷物@grain!。\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 missions_yue_state_task_13:0 "南岛贡赋"
 missions_yue_state_task_13_DESC:0 "四方商贾自吕宋海之水域航行至我夷洲岛之港区。彼等述说原始部族贸易至珍货品之事；向其索贡必将充盈我府库。\n\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 missions_yue_state_task_14:0 "越女"
 missions_yue_state_task_14_DESC:0 "越女之传说至今仍在流传。据称此女子之军事造诣卓绝，其传奇武艺甚至凌驾于多数男子之上。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 missions_yue_state_task_15:0 "征服瓯越"
 missions_yue_state_task_15_DESC:0 "南方#E瓯越#!部族素来滋扰不断，然如今[ROOT.GetCountry.GetRuler.GetName]终有余力着手解决与这些争执不休之部族间之问题，[ROOT.GetCountry.GetRulerTitle]立誓劫掠将一劳永逸地被终结。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 missions_yue_state_task_15_claims:0 "我们将获得对建安和庐陵地区的宣称。"
 missions_yue_state_task_16:0 "进军闽越"
 missions_yue_state_task_16_DESC:0 "山中诸民——闽越人——虽素有疑惧外人之名，然其已别无选择——彼等皆为[ROOT.GetCountry.GetName]之臣民，不可再游离于我国之外。其归化我道统之时已至，纵然彼等抗拒我之努力。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 missions_yue_state_task_16_claims:0 "我们将获得对南海、苍梧和合浦地区的宣称。"
 missions_yue_state_task_17:0 "入侵南越"
 missions_yue_state_task_17_DESC:0 "人烟稀少之南部沿海地带若并入[ROOT.GetCountry.GetName]版图，必将锦上添花——将南越之民纳入我新兴邦国之时已至。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 missions_yue_state_task_17_claims:0 "我们将获得对郁林、交阯和九真地区的宣称。"
 missions_yue_state_task_18:0 "苗疆"
 missions_yue_state_task_18_DESC:0 "三苗王国曾为我先祖大禹所败而臣服，此事吾等理应提醒彼等。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 missions_yue_state_task_19:0 "囚禁雄王"
 missions_yue_state_task_19_DESC:0 "吾等风闻#E雄王#!所统之民及其称雄之志，[ROOT.GetCountry.GetRuler.GetName]已制定毁灭其新兴文明之方略——吾等必须掌控整个#E南海#!。\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 missions_yue_state_task_19_claims:0 "我们将获得对南中地区的宣称。"
 missions_yue_state_task_1_DESC:0 "故吴之地仅于数年前沦于楚人之手。收复此我核心故土并加固其防以御来犯，此乃头等要务。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 missions_yue_state_task_1_claims:0 "我们将获得对广陵、九江和临淮地区的宣称。"
 missions_yue_state_task_2:0 "重振会稽"
 missions_yue_state_task_20:0 "收复北疆"
 missions_yue_state_task_20_DESC:0 "[GetCharacter('(int32)591').GetName]王出征惨败之后，我北方疆土丧失于楚，越国权势自此急遽衰落。吾等必须索回此地，否则中原无人会敬重于我。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 missions_yue_state_task_20_claims:0 "我们将获得对庐江、江夏、宜城和豫章地区的宣称。"
 missions_yue_state_task_21:0 "铸就王者之剑"
 missions_yue_state_task_21_DESC:0 "[GetCharacter('(int32)583').GetName]王之宝剑以其锋利无比、纹饰精美、抗锈不蚀而闻名于世，然自其薨后此剑便随葬入土；自彼时以降，越王权威日渐衰微，直至今日，[ROOT.GetCountry.GetRuler.GetName]终使越国重振昔日荣光。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 missions_yue_state_task_22:0 "妇人之仁"
 missions_yue_state_task_22_DESC:0 "作为宽仁之举，[GetCharacter('(int32)583').GetName]王将此前吴王所据之城邑归还予楚、宋、鲁诸国。然此数国从未流露丝毫感激之情，为此彼等须受严惩。\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 missions_yue_state_task_2_DESC:0 "内战与楚人入侵已为会稽城带来苦难与毁灭，是时候扫除往日忧患之最后残余，使其成为越国面向未来之中心。\n\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 missions_yue_state_task_3:0 "求索盟友"
 missions_yue_state_task_3_DESC:0 "我军四面受挫，越国危急存亡之秋，亟需盟友相助。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 missions_yue_state_task_3_chinese_ally:0 "我们至少有一位华夏盟友。"
 missions_yue_state_task_4:0 "锻造青铜剑"
 missions_yue_state_task_4_DESC:0 "吾等素以精良青铜剑闻名于邻邦，然近年彼等无缘领教其锋。故此，吾等须锻造新锐兵器，以痛击敌寇！\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 missions_yue_state_task_4_base_metals_blacksmith:0 "我们至少有一省产出基础金属并有铁匠铺建筑。"
 missions_yue_state_task_4_base_metals_mine:0 "我们至少有一省产出基础金属并有矿场建筑。"
 missions_yue_state_task_5:0 "琅琊之越"
 missions_yue_state_task_5_DESC:0 "[GetCharacter('(int32)591').GetName]猝然离世之后，越国因未立嗣君而陷入混乱。如今吾等占据上风，我北方同胞必将寻求我之庇护。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 missions_yue_state_task_5_claims:0 "我们将获得对东海、琅琊、北海和东莱地区的宣称。"
 missions_yue_state_task_6:0 "丰饶之角"
 missions_yue_state_task_6_DESC:0 "丰饶之角啊，使我田土沃腴丰饶，让最优良之稻谷在此生长；使我仓廪充盈殷实。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 missions_yue_state_task_6_state_with_4_rice:0 "我们有一邦国稻米盈余至少4。"
 missions_yue_state_task_6_three_provinces_with_rice:0 "我们拥有至少三省生产稻米且建有农庄。"
 missions_yue_state_task_7:0 "重建水师"
 missions_yue_state_task_7_DESC:0 "昔日我庞大水师舰队所剩无几，然即便如此，亦无任何势力可与越人之航海技艺匹敌。吾等不应延误时机，立即打造一支无愧于我昔日荣光之水师。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 missions_yue_state_task_7_claims:0 "我们将获得对都提空山和麒麟地区的宣称。"
 missions_yue_state_task_7_navy_reward:0 "我们将建立一支强大的水师。"
 missions_yue_state_task_8:0 "夷洲之岛"
 missions_yue_state_task_8_DESC:0 "我水师既已恢复昔日雄风，吾等应谋划将霸权拓展至夷洲之岛，该岛为诸多弱小部族所踞；彼等断非我可畏大军之对手。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 missions_yue_state_task_8_claims:0 "我们将获得对吕宋和马尼拉地区的宣称。"
 missions_yue_state_task_9:0 "雷霆之击"
 missions_yue_state_task_90_claims:0 "我们将获得对吴、盐城和丹阳地区的宣称。"
 missions_yue_state_task_9_DESC:0 "如雷霆万钧，吾等务必迅疾出击，趁楚人不备。其覆亡已定。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 missions_yue_state_task_9_claims:0 "我们将获得对庐陵、桂阳、长沙、零陵和常德地区的宣称。"
 missions_yue_tribes:0 "新越王朝"
 missions_yue_tribes_BUTTON_TOOLTIP:0 "$missions_yue_state_BUTTON_TOOLTIP$"
 missions_yue_tribes_CRITERIA_DESCRIPTION:0 "$missions_yue_state_CRITERIA_DESCRIPTION$"
 missions_yue_tribes_DESCRIPTION:0 "南方越族诸部首领林立，彼此分散，难以与北方诸国抗衡。若要在乱世中立足，我们必须统一部族，建立新的越人王朝，并继承大禹与旧越国的政治遗产。"

l_simp_chinese:
 desc_fall_of_yue_mod:0 "自越王无彊为楚所败以来，越国便陷入急剧衰颓之中……"
 desc_langyayue_naval_dominance:0 "我与众不同者，在于强大海军。"
 desc_restored_kuaiji_mod:0 "越都重归繁荣。"
 desc_restored_yue_state:0 "越国上一次如此繁盛，尚在越王勾践之治世，其时于公元前465年终结。"
 desc_yue_art_of_war:0 "吾等遵循那位赫赫有名之将军、兵家与圣哲——孙武——所立之原则。"
 desc_yue_civilisation_effort:0 "新征服领土急需更多开化。"
 desc_yue_found_allies:0 "新盟友以兵力支援。"
 desc_yue_learnt_from_generosity:0 "吾等已从昔日不当之慷慨中吸取教训。永勿对不配之人施以慷慨。"
 desc_yue_southern_trade:0 "发现并主导南方新商路。"
 desc_yue_state_bronze_swords:0 "越人素以青铜剑质闻名。"
 desc_yue_tribal_capital:0 "此城已超部落之日。"
 fall_of_yue_mod:0 "越国之亡"
 langyayue_naval_dominance:0 "越国制海权"
 me_yue_langyayue_1.a:0 "$me_yue_state_1.a$"
 me_yue_langyayue_15.a:0 "所有越人不久将臣服于我。"
 me_yue_langyayue_15_desc:0 "内陆山岭险林中之瓯越与闽越，为我大越联盟沿海推进之首批越人集团。其富庶之港可与我港比肩，其众多港湾及沿海物产将为国家带来巨量财富。"
 me_yue_langyayue_15_title:0 "$missions_yue_state_task_15$"
 me_yue_langyayue_16.a:0 "越之舰队已在路上。"
 me_yue_langyayue_16_desc:0 "随着[GetProvince('(int32)8718').GetName]之陷落，今所有主要河流皆已归我航海之民所控。中原诸国无知之君欲汲取教训已为时过晚，然此教训必将刻骨铭心。"
 me_yue_langyayue_16_title:0 "$missions_yue_state_task_16$"
 me_yue_langyayue_1_desc:0 "$me_yue_state_1_desc$"
 me_yue_langyayue_1_title:0 "$missions_yue_state_task_1$"
 me_yue_langyayue_2.a:0 "$me_yue_state_2.a$"
 me_yue_langyayue_20.a:0 "越之疆域在扩大。"
 me_yue_langyayue_20_desc:0 "$me_yue_state_20_desc$"
 me_yue_langyayue_20_title:0 "$missions_yue_state_task_20$"
 me_yue_langyayue_2_desc:0 "昔日悲伤之瓦砾已清，新城之民为我墙内繁荣安宁之前景所吸引而来。\n\n[GetProvince('(int32)8527').GetName]之城重焕光芒，将再度与[GetProvince('(int32)8504').GetName]及[GetProvince('(int32)8379').GetName]诸城竞逐！"
 me_yue_langyayue_2_title:0 "$missions_yue_state_task_2$"
 me_yue_langyayue_5.a:0 "$me_yue_state_5.a$"
 me_yue_langyayue_500.a:0 "$me_yue_state_500.a$"
 me_yue_langyayue_500_desc:0 "$me_yue_state_500_desc$"
 me_yue_langyayue_500_title:0 "$missions_yue_state_task_5$"
 me_yue_langyayue_5_desc:0 "$me_yue_state_5_desc$"
 me_yue_langyayue_5_title:0 "$missions_yue_state_task_5$"
 me_yue_state_1.a:0 "吴归我所有！"
 me_yue_state_10.a:0 "研习《孙子》果然是正确之选。"
 me_yue_state_10_desc:0 "我辈对《孙子兵法》之研究已有收获矣，[ROOT.GetCountry.GetRuler.GetName]。孙子智慧已为我朝廷兵略家与军师所明，彼等之成功已显于战场之上。"
 me_yue_state_10_title:0 "$missions_yue_state_task_10$"
 me_yue_state_11.a:0 "吾等已复仇雪耻！"
 me_yue_state_11_desc:0 "多年前齐人夺我疆土之仇，今终得雪。越之民永不再受北方所谓文明诸邦之凌虐，尤以齐之骄狂傲慢为甚。"
 me_yue_state_11_title:0 "$missions_yue_state_task_11$"
 me_yue_state_12.a:0 "功劳当归于辛勤之民众"
 me_yue_state_12_desc:0 "$me_chinese_empire_24_desc$"
 me_yue_state_12_title:0 "$missions_yue_state_task_12$"
 me_yue_state_13.a:0 "其贡赋将充塞我之府库！"
 me_yue_state_13_desc:0 "我已在吕宋岛上成功向诸部落征收贡赋，[ROOT.GetCountry.GetRuler.GetName]。自此处民众索取之奢华物品，于中国及其他贸易伙伴将有极大价值。陛下且赏玩此美岛之珍奇。"
 me_yue_state_13_title:0 "$missions_yue_state_task_13$"
 me_yue_state_14.a:0 "女子将在吾族中战斗与领导！"
 me_yue_state_14_desc:0 "传说中之南林女侠已觅得踪影，[ROOT.GetCountry.GetRuler.GetName]。其狩猎之术无与匹敌，剑术与箭法皆臻至境。对这位女中豪杰之才惊叹之余，[ROOT.GetCountry.GetRuler.GetName]下令自此女可凭才能从军入仕。朝中虽需费些口舌，然大部终无异议接受了此命。"
 me_yue_state_14_title:0 "$missions_yue_state_task_14$"
 me_yue_state_15.a:0 "瓯越将臣服于我！"
 me_yue_state_15_desc:0 "瓯越是我大越联盟沿海推进之首批越人集团。其富庶之港可与我港比肩，其众多港湾及沿海物产将为国家带来巨量财富。"
 me_yue_state_15_title:0 "$missions_yue_state_task_15$"
 me_yue_state_16.a:0 "彼之财富今归我国所有。"
 me_yue_state_16_desc:0 "沿海南下，于内陆险峻丛林与山岭之中，我闽越兄弟凭输出宝贵沿海物产及虎皮、象牙等内陆之货，已营得殷实生计。闽越今将欣然在吾治下同效此举，加入我日益壮大之越人联盟。"
 me_yue_state_16_title:0 "$missions_yue_state_task_16$"
 me_yue_state_17.a:0 "南越归我所有，理应如此。"
 me_yue_state_17_desc:0 "南海岸最后一支主要越人邦国——南越，已陷于我大军，吾主[ROOT.GetCountry.GetRuler.GetName]。我部落武士于丛林中伏击其纵队，两面夹击，彻溃其军团。其军既碎，都城遂降，南越诸部今甘愿臣服于我治下。"
 me_yue_state_17_title:0 "$missions_yue_state_task_17$"
 me_yue_state_18.a:0 "吾等将融合苗人。"
 me_yue_state_18.b:0 "眼下先关注我之族人。"
 me_yue_state_18_desc:0 "苗疆之地今已入我版图！今当断其大邦是与我平等相合之，抑或尽化为我之道。"
 me_yue_state_18_title:0 "$missions_yue_state_task_18$"
 me_yue_state_19.a:0 "此等异族今为我之子民。"
 me_yue_state_19_desc:0 "雒越之民，言语殊异，风俗奇特，今俯首于王，[ROOT.GetCountry.GetRuler.GetName]。此等迷信之民对一介新君之临心怀戒惧，我等须严密监视，以防其生叛心，抗逆王治。"
 me_yue_state_19_title:0 "$missions_yue_state_task_19$"
 me_yue_state_1_desc:0 "我世仇吴国之土终入我疆域矣，吾主！数代以来我越人征伐吴地，两邦血溅山河，以图并取此地。先祖在天之灵今当欢庆，因我等已遂其遗志。"
 me_yue_state_1_title:0 "$missions_yue_state_task_1$"
 me_yue_state_2.a:0 "最伟大的越城，亦是最美之城…"
 me_yue_state_20.a:0 "越土已重归一统。"
 me_yue_state_20_desc:0 "吾等已收复北方失地，[ROOT.GetCountry.GetRuler.GetName]君上！越人诸部今皆归于我疆域之内，伟大的统一者。楚人将明白，我等已非可轻侮之辈。"
 me_yue_state_20_title:0 "$missions_yue_state_task_20$"
 me_yue_state_21.a:0 "此日将被铭记为我邦复兴之日！"
 me_yue_state_21_desc:0 "[GetCharacter('(int32)591').GetName]之剑光随[ROOT.GetCountry.GetRuler.GetHerHis]辞世而熄灭。昔日胜绩未能长存，阴影重临；吾等再度渴求光明。新刃须铸，此乃[ROOT.GetCountry.GetRuler.GetName]之所诏命。\n\n满朝臣工焦虑等候数日，王室工匠终携新铸青铜王剑归来。我[ROOT.GetCountry.GetRulerTitle]当即上前，拔剑出鞘。\n\n'纵有此等精良之剑，亦不足以克敌之志。然吾深知一事：吾等必将尽己之责，不计代价！吾等当力拒一切危及吾民安危之敌，不将其挫败，誓不罢休。'吾王睿智之言如是。"
 me_yue_state_21_title:0 "$missions_yue_state_task_21$"
 me_yue_state_22.a:0 "越人不再温和。"
 me_yue_state_22_desc:0 "我先王[GetCharacter('(int32)583').GetName]昔日赐予狡诈之#E 战国#!诸邦的慷慨馈赠，今已悉数收回。彼等背弃吾之善意，横夺吾土，陷我泱泱大国于濒亡之境。愿华夏列国再勿以吾之宽仁为软弱。"
 me_yue_state_22_title:0 "$missions_yue_state_task_22$"
 me_yue_state_2_desc:0 "昔日哀伤之残墟已然清理，新移民为吾城墙之后繁荣与安宁之诺言所吸引，纷纷来投。\n\n[GetProvince('(int32)9089').GetName]城再度熠熠生辉，将复为可与[GetProvince('(int32)8504').GetName]及[GetProvince('(int32)8379').GetName]比肩之名城！"
 me_yue_state_2_title:0 "$missions_yue_state_task_2$"
 me_yue_state_3.a:0 "吾等需要盟友…"
 me_yue_state_3_desc:0 "吾等已成功遣使至诸#E 战国#!，求援于所有不与楚人结盟者。吾之努力未付东流，因我今在#E 中国#!列邦之中享有更崇之外交地位。"
 me_yue_state_3_title:0 "$missions_yue_state_task_3$"
 me_yue_state_4.a:0 "此等精良刀剑将助我良多。"
 me_yue_state_4_desc:0 "吾等工艺精绝、令人胆寒之剑终在锻炉中铸成。令敌人在剑下碎尸万段之际，惊愕瞠目。"
 me_yue_state_4_title:0 "$missions_yue_state_task_4$"
 me_yue_state_5.a:0 "吾等有了新臣属"
 me_yue_state_500.a:0 "彼等已被整合。"
 me_yue_state_500_desc:0 "说服其朝廷并非难事，稍加暗示若不从命则难免兵戎相见，彼等便应允举国归附于我。"
 me_yue_state_500_title:0 "$missions_yue_state_task_5$"
 me_yue_state_5_desc:0 "说服其朝廷并非难事，因其境内历经一代人之战乱，彼等深知需受我族庇护。况且，吾等本是兄弟，只是吾为兄长耳。"
 me_yue_state_5_title:0 "$missions_yue_state_task_5$"
 me_yue_state_6.a:0 "赞颂上天。"
 me_yue_state_6_desc:0 "吾等审慎之农政确保了上等稻米之生产得以维持并增长。\n\n[ROOT.GetCountry.GetName]无需忧虑稻米匮乏，异邦商贾将蜂拥而至，争相获取吾国之货。"
 me_yue_state_6_title:0 "$missions_yue_state_task_6$"
 me_yue_state_7.a:0 "吾等将再次称霸海洋。"
 me_yue_state_7_desc:0 "[ROOT.GetCountry.GetRuler.GetName]扬帆出港之际，海风充盈其肺腑。先祖世代之记忆充盈其神，盖此事于他全然自然。航行大海乃其族人之天性，他必确保国家再不至失去此种感受。"
 me_yue_state_7_title:0 "$missions_yue_state_task_7$"
 me_yue_state_8.a:0 "吾等将航行更远…"
 me_yue_state_8_desc:0 "夷洲岛之蛮野夷狄终臣服于[ROOT.GetCountry.GetRuler.GetName]君上治下。此荒僻岛屿之丘陵山峦丛林中，我军虽遇些许阻碍，加之水陆两地恼人之游击战术，然我英勇将士在正面交锋中轻易击溃敌之抵抗核心，杀俘无算。"
 me_yue_state_8_title:0 "$missions_yue_state_task_8$"
 me_yue_state_9.a:0 "楚人毫无防备。"
 me_yue_state_90.a:0 "吾等须即刻收复故地。"
 me_yue_state_90.b:0 "吾等最好臣服于楚。"
 me_yue_state_90_desc:0 "公元前333年，越王[GetCharacter('(int32)591').GetName]北上伐齐。彼轻信齐使田某之言，率军攻楚，不料中伏、兵败身死。因[GetCharacter('(int32)591').GetName]未有指定继嗣，越国分崩离析，其长子[GetCharacter('(int32)631').GetName]与次子[GetCharacter('(int32)634').GetName]相争。\n\n两年前，楚国乘此虚弱之际攻取吴地，故昔日泱泱越国仅余北方琅琊城周边狭长之地与最南端会稽一带疆土。"
 me_yue_state_90_title:0 "越国沦亡"
 me_yue_state_9_desc:0 "吾等于新月之夜突袭楚营右翼，以确保不被察觉。士卒预先勘察地形，纵在漆黑之中亦确信路径无误。吾等如闪电般扑向敌军，令半睡半醒之楚卒魂飞魄散，将其斩杀殆尽。彼等从此地全线溃退。"
 me_yue_state_9_title:0 "$missions_yue_state_task_9$"
 me_yue_tribes_15.a:0 "唯有团结方能强大。"
 me_yue_tribes_15_desc:0 "今越人诸部已统一于一帜之下，中原列国将不久领教此举之意。"
 me_yue_tribes_15_title:0 "$missions_yue_tribes_task_15$"
 me_yue_tribes_16.a:0 "大禹子孙万世永昌！"
 me_yue_tribes_1600.a:0 "他将流亡。"
 me_yue_tribes_1600.b:0 "仍有希望独力击败楚人。"
 me_yue_tribes_1600_desc:0 "吾等收到越人诸部之归附请求。连年战乱已令[ROOT.GetCountry.GetRuler.GetName]心力交瘁，彼今正思忖退隐于南方群山之固垒之中。"
 me_yue_tribes_1600_title:0 "$missions_yue_tribes_task_16$"
 me_yue_tribes_1601.a:0 "大禹子孙万世永昌！"
 me_yue_tribes_1601_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已欣然接受吾等之慷慨提议。当其终踏入我新建王国之际，万民齐聚，欢呼雀跃。众皆欣然瞻望光明之前途。"
 me_yue_tribes_1601_title:0 "$missions_yue_tribes_task_16$"
 me_yue_tribes_16_desc:0 "[new_yue_ruler.GetName]已欣然接受吾等之慷慨提议。当其终踏入我新建王国之际，万民齐聚，欢呼雀跃。众皆欣然瞻望光明之前途。"
 me_yue_tribes_16_title:0 "$missions_yue_tribes_task_16$"
 me_yue_tribes_2.a:0 "我发现[ROOT.GetCountry.GetCapital.GetName]时是一座木城，离开时已成石都。"
 me_yue_tribes_2_desc:0 "[ROOT.GetCountry.GetRuler.GetName]有生之年，[ROOT.GetCountry.GetCapital.GetName]已历经沧桑巨变。唯老一辈尚记昔日时光，彼时我王都不过数间木舍而已。"
 me_yue_tribes_2_title:0 "$missions_yue_tribes_task_2$"
 me_yue_tribes_3.a:0 "$me_yue_state_3.a$"
 me_yue_tribes_3_desc:0 "$me_yue_state_3_desc$"
 me_yue_tribes_3_title:0 "$missions_yue_tribes_task_3$"
 me_yue_tribes_90.a:0 "吾等应欢迎他们。"
 me_yue_tribes_90_desc:0 "公元前333年，越王[GetCharacter('(int32)591').GetName]北上伐齐。彼轻信齐使田某之言，率军攻楚，不料中伏、兵败身死。因[GetCharacter('(int32)591').GetName]未有指定继嗣，越国分崩离析，其长子[GetCharacter('(int32)631').GetName]与次子[GetCharacter('(int32)634').GetName]相争。\n\n两年前，楚国乘此虚弱之际攻取吴地，故昔日泱泱越国仅余北方琅琊城周边狭长之地与最南端会稽一带疆土。\n\n或云王朝之未来不再在北方，而在南方越人诸部之中。"
 me_yue_tribes_90_title:0 "越国沦亡"
 missions_yue_langyayue:0 "$missions_yue_state$"
 missions_yue_langyayue_BUTTON_TOOLTIP:0 "$missions_yue_state_BUTTON_TOOLTIP$"
 missions_yue_langyayue_CRITERIA_DESCRIPTION:0 "$missions_yue_state_CRITERIA_DESCRIPTION$"
 missions_yue_langyayue_DESCRIPTION:0 "越国王统虽已南北离散，琅琊之地仍保有重振宗邦的希望。我们必须巩固北方据点，收复失地，重建水师，并使中原诸国再度正视越人的力量。"
 missions_yue_langyayue_task_1:0 "$missions_yue_state_task_1$"
 missions_yue_langyayue_task_10:0 "$missions_yue_state_task_10$"
 missions_yue_langyayue_task_10_DESC:0 "$missions_yue_state_task_10_DESC$"
 missions_yue_langyayue_task_11:0 "$missions_yue_state_task_11$"
 missions_yue_langyayue_task_11_DESC:0 "$missions_yue_state_task_11_DESC$"
 missions_yue_langyayue_task_12:0 "$missions_yue_state_task_12$"
 missions_yue_langyayue_task_12_DESC:0 "$missions_yue_state_task_12_DESC$"
 missions_yue_langyayue_task_13:0 "$missions_yue_state_task_13$"
 missions_yue_langyayue_task_13_DESC:0 "$missions_yue_state_task_13_DESC$"
 missions_yue_langyayue_task_14:0 "$missions_yue_state_task_14$"
 missions_yue_langyayue_task_14_DESC:0 "$missions_yue_state_task_14_DESC$"
 missions_yue_langyayue_task_15:0 "征服越族诸部"
 missions_yue_langyayue_task_15_DESC:0 "源自[GetProvince('(int32)9101').GetName]与[GetProvince('(int32)9105').GetName]之沼泽、山川与林地之#E越#!部族，不可再游离于我国之外。其归化我道统之时已至，纵然彼等抗拒我之努力。\n\n\n\n\n\n\n\n\n\n@india_mil8!"
 missions_yue_langyayue_task_16:0 "黄河"
 missions_yue_langyayue_task_16_DESC:0 "是时候让中原诸国见识一下我等如此可畏之水师所能为之事了。封锁黄河——彼等赖以生存之命脉，必将使其归于应处之地，匍匐跪倒。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 missions_yue_langyayue_task_17:0 "$missions_yue_state_task_17$"
 missions_yue_langyayue_task_17_DESC:0 "$missions_yue_state_task_17_DESC$"
 missions_yue_langyayue_task_18:0 "$missions_yue_state_task_18$"
 missions_yue_langyayue_task_18_DESC:0 "$missions_yue_state_task_18_DESC$"

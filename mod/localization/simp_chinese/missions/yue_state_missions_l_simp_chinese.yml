 yue_art_of_war:0 "孙子兵法"
 yue_civilisation_effort:0 "文明化努力"
 yue_found_allies:0 "盟友支援"
 yue_learnt_from_generosity:0 "汲取往日宽仁之教训"
 yue_royal_sword:0 "重铸越王剑"
 yue_royal_sword_desc:0 "勾践王铸造了一柄精雕细琢之青铜剑以彰显其权威。不幸者，彼将此剑携往来世，自彼时以降，越国权势日渐衰微。如今，我之君主更已超越于彼，故其御用之剑愈显辉煌壮丽，实乃理所应当。"

l_simp_chinese:
 big_in_japan_jingug:0 "倭之主宰"
 desc_big_in_japan_jingug:0 "倭国征服者"
 desc_domineering_jingug:0 "吾等摧锋而进，凡敢阻于前路者，皆被击溃震退——无人可挑战我邦！"
 desc_jingug_bronze:0 "我邦铁匠在青铜冶铸方面技艺超群，此于我军旅大有裨益。"
 desc_jingug_capital:0 "任那勤劳之民倾力经营，使我邦都城成为名副其实之文明之地。"
 desc_jingug_sails:0 "吾等不仅须称雄于陆地，亦当称霸于海上——发出征召之令！吾等必征服汪洋！"
 desc_united_jingug:0 "我邦不屈之旅已成就不可思议之功业；征服倭之大岛并将其完全置于我权威之下。"
 domineering_jingug:0 "神功支配"
 is_in_region_wa:0 "位于倭地区。"
 jingug_bronze:0 "青铜兵器"
 jingug_capital:0 "神功之都"
 jingug_sails:0 "神功海军倡议"
 me_jingug_1.a:0 "此日将于子孙万代永为庆典"
 me_jingug_10.a:0 "彼等分裂，正宜乘之"
 me_jingug_100.a:0 "我已迫不及待，只待使节抵达[ROOT.GetCountry.GetCapital.GetName]"
 me_jingug_100_desc:0 "自[ROOT.GetCountry.GetRuler.GetName]与[ROOT.GetCountry.GetRuler.GetHerHis]众谋臣商议之后，这位[ROOT.GetCountry.GetRulerTitle]已决意邀请邻近诸酋长前来都城。[ROOT.GetCountry.GetRuler.GetFirstName]准备陈明利害：[GetCountry('JSN').GetName]日益壮大之势已非我朝贡诸邦所能无视，彼等若能全然归服于[ROOT.GetCountry.GetName]，于各方皆为上策。\n\n然万事皆无定数；我朝贡诸邦可会接受此等条款？数周之内便见分晓。"
 me_jingug_100_title:0 "$missions_jingug_task_1$"
 me_jingug_10_desc:0 "我安插于诸岛之细作已与当地内应接触，彼等告知我方，称#E倭#!诸岛处于极度混乱之状，由众多纷争不休的领主与君王分治，正适于我等出兵征服。[ROOT.GetCountry.GetRuler.GetName]闻讯之后，[ROOT.GetCountry.GetRuler.GetSheHe]当即下令，命我军为继续入侵做好准备。"
 me_jingug_10_title:0 "$missions_jingug_task_10$"
 me_jingug_11.a:0 "吾当信其言…否则取其首级"
 me_jingug_11_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您下令在北境全境修建的防御工事终于竣工，当地军工匠师誓言，任何蛮族部落皆无法逾越其所筑之坚墙。\n\n赖此努力，各行省长官报称，因物资余裕，我等尚有若干投资可待推行；此乃[ROOT.GetCountry.GetName]子民之又一福祉。"
 me_jingug_11_title:0 "$missions_jingug_task_11$"
 me_jingug_12.a:0 "吾等当迁至马韩之地"
 me_jingug_12.b:0 "弁韩之地，实为绝佳之选"
 me_jingug_12.c:0 "乐浪之地，令我心动"
 me_jingug_12_desc:0 "尘埃稍定，[ROOT.GetCountry.GetRuler.GetName]方有余暇专注于无需指挥征召兵之事宜，这位[ROOT.GetCountry.GetRulerTitle]便一直在思量，是否应将都城迁至[ROOT.GetCountry.GetName]境内某处新址。\n\n然值得迁都之地不止一处，且卜兆亦言吉，称无论[ROOT.GetCountry.GetRuler.GetFirstName]择定何处，皆将世代蒙福。吾等应将工匠遣往何方？"
 me_jingug_12_title:0 "$missions_jingug_task_12$"
 me_jingug_13.a:0 "天命已昭，吾意已决"
 me_jingug_13_desc:0 "当[ROOT.GetCountry.GetName]的凯旋之师将蛮族逐出#E 辰#!东岸之后，我众多朝贡邦国纷纷归附[ROOT.GetCountry.GetCapital.GetName]，请求成为藩属，恳请[ROOT.GetCountry.GetRuler.GetName]将彼等纳入[ROOT.GetCountry.GetRuler.GetSheHe]正在半岛上缔造的邦联。\n\n辰国正缓步而坚定地主宰此方……"
 me_jingug_13_title:0 "$missions_jingug_task_13$"
 me_jingug_14.a:0 "天赐良机，继续征讨倭国"
 me_jingug_14_desc:0 "我军在东方取得一连串惊人胜绩的消息传至[ROOT.GetCountry.GetCapital.GetName]，就连[ROOT.GetCountry.GetRuler.GetName]闻之亦显惊讶。当某位谋臣问及下一步当如何行动，[ROOT.GetCountry.GetRuler.GetFirstName]清了清[ROOT.GetCountry.GetRuler.GetHerHis]嗓子，对满朝上下朗声说道：\n\n'吾尝闻#E倭#!之民为高贵武士，堪受敬重与钦佩，然此番盛名似建于谎言之上。彼等软弱无能，若我辈继续徐徐施压，彼等便将在我掌中如烂梅般迸裂。'"
 me_jingug_14_title:0 "$missions_jingug_task_14$"
 me_jingug_15.a:0 "若初至时彼等即如此抵抗，该有多好！"
 me_jingug_15_desc:0 "虽当地居民正抗拒我等同化与教化之努力，[ROOT.GetCountry.GetRuler.GetName]仍不禁嘲笑#E倭#!之人抗拒天命之愚行。\n\n各地总督正积极推进此等教化之事，然倭地农夫显然在竭力维系自身认同。我方已接到零星奏报，称有士卒在道途间遭盗匪袭击，甚至有当地滋事之徒试图煽动叛乱，所幸至今未成气候。\n\n尽管这些奏报颇为严峻，预示着该岛未来或有隐患，[ROOT.GetCountry.GetRuler.GetFirstName]仍对彼等谋求自决之微弱尝试感到可笑。"
 me_jingug_15_title:0 "$missions_jingug_task_15$"
 me_jingug_16.a:0 "自今日起，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]之时代拉开帷幕！"
 me_jingug_16_desc:0 "从[ROOT.GetCountry.GetCapital.GetName]之最高处，号角之声响彻云霄，战鼓之擂压倒一切感官。都城内正举行盛大庆典，盖因今日，[ROOT.GetCountry.GetRuler.GetName]自觉功业彪炳，足以宣告新时代之始——在此时代中，[ROOT.GetCountry.GetName]王国将统御一统之半岛与海外属地，成为真正的海陆之主[ROOT.GetCountry.GetRuler.GetHerHis]。"
 me_jingug_16_title:0 "$missions_jingug_task_16$"
 me_jingug_1_desc:0 "在一个万里无云的晴日，一场奇特的集会于[ROOT.GetCountry.GetCapital.GetName]的城堡内聚拢。自北方蛮族酋长们策马穿过要塞大门的那一刻起，农夫们便停下手中活计，凝望那些身着全套部落盛装、骑马而过的骄矜扈从。实乃难得一见之景象，当地百姓久未得见矣。\n\n此盛会于该地区意义非凡；[ROOT.GetCountry.GetRuler.GetName]决定，我北境朝贡诸邦须成为正式#E藩属#!——吾等与诸友邦之关系素来融洽，若彼等应允我之所求，则于各方之安全与繁荣皆为增益。所幸，彼等皆已同意[ROOT.GetCountry.GetRuler.GetFirstName]之所议。\n\n唯一对此心怀不满者，乃是[GetCountry('JSN').GetName]的[GetCountry('JSN').GetRuler.GetName]，此人愚蠢地对该地区抱有自身图谋，对我[ROOT.GetCountry.GetRulerTitle]灵巧的政治手腕深感恼怒。"
 me_jingug_1_title:0 "$missions_jingug_task_1$"
 me_jingug_2.a:0 "水师将士已备，无惧任何挑战"
 me_jingug_2_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我等终于如您所令，建成了一支无愧于[ROOT.GetCountry.GetAdjective]之舰队，然不仅如此——我等同时遣使前往[GetCountry('DMN').GetName]，告知彼等，吾等已将其岛屿据为己有。"
 me_jingug_2_title:0 "$missions_jingug_task_2$"
 me_jingug_3.a:0 "吉兆之始，确然无疑"
 me_jingug_3_desc:0 "我等欣然禀报，近期落成之#E铁匠铺#!建筑，已迅速成为传授卑金属@base_metals!技艺的宝贵资源。\n\n有志于铁匠之艺者，在野外随大师研习数周后，便返回各自村落与聚落，将所学分享给同族。如今，我部落民中已有大批熟练的金属匠人，可自制兵器与盔甲——实为[ROOT.GetCountry.GetName]征召兵之福音。"
 me_jingug_3_title:0 "$missions_jingug_task_3$"
 me_jingug_4.a:0 "一举而定广袤疆土"
 me_jingug_4_desc:0 "老实说，[ROOT.GetCountry.GetCapital.GetName]内部确有声音担忧与[GetCountry('JSN').GetName]发生冲突，盖因彼等版图辽阔，且久经战阵。其弓骑兵尤为致命，众多草原雇佣兵随其征召军一同驰骋——确非易取之敌。\n\n然[ROOT.GetCountry.GetRuler.GetName]不为威胁所动，悍然宣布将入侵敌国故土，誓言胜利必属于我，摧垮[GetCountry('JSN').GetRuler.GetFamilyDisplayAdjective]王朝之后，更大荣耀仍在前方。\n\n不出众人所料，我[ROOT.GetCountry.GetRulerTitle]所誓言之一切，皆已一一应验。"
 me_jingug_4_title:0 "$missions_jingug_task_4$"
 me_jingug_5.a:0 "感念卿之辛劳"
 me_jingug_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您将欣然得知，正道信仰#E巫俗#!已征服了在南方开始扎根的野蛮#E古道#!之谬说与迷信。尽管居于南方堡垒与要塞的众多精英尚未全然放弃我巫俗之道，当地民众却已开始漠视龙神，转而向粗野神祇与邪魔献香奠酒。\n\n然赖[ROOT.GetCountry.GetRuler.GetFirstName]所施之压，古道之焰已被踏灭，正统仪轨得以恢复。据传，本地有一位祭司在引领改宗之事上贡献卓著，[ROOT.GetCountry.GetRuler.GetFirstName]为表谢意，已邀该虔诚之士前来[ROOT.GetCountry.GetCapital.GetName]朝中觐见。"
 me_jingug_5_title:0 "$missions_jingug_task_5$"
 me_jingug_6.a:0 "逐一而沦，诸岛必降！"
 me_jingug_6_desc:0 "既已征服[GetCountry('DMN').GetName]之岛，便有人向[ROOT.GetCountry.GetRuler.GetName]建言继续东进，盖因前方尚有诸多价值不菲之岛屿，守备相对空虚——蛮族部落之众绝难威胁我纪律严明之师。\n\n看来，我等将以耽罗岛为跳板，发起进一步入侵。"
 me_jingug_6_title:0 "$missions_jingug_task_6$"
 me_jingug_7.a:0 "何等纤细之短剑…鬼斧神工！"
 me_jingug_7_desc:0 "随着我金属匠人与工艺大师在作坊中开始实验，他们逐渐抛弃了曾经偏爱的宽体琵琶形刀制，转而追求修长纤细之形。此新型匕首，名曰#E'细形铜剑'#!，迅速在精英阶层中流行开来，未几，这一新式构造便全然取代了旧法。\n\n[ROOT.GetCountry.GetRuler.GetName]素来对[ROOT.GetCountry.GetName]境内动态了如指掌，遂命人送一套此类刀剑至都城，以便国中贵族共赏我工匠之卓越技艺[ROOT.GetCountry.GetRuler.GetHerHis]。"
 me_jingug_7_title:0 "$missions_jingug_task_7$"
 me_jingug_8.a:0 "再饮一杯！吾为[ROOT.GetCountry.GetName]举觞…嗝…"
 me_jingug_8_desc:0 "我军战胜北辰之消息传至[ROOT.GetCountry.GetCapital.GetName]，此等吉庆局面导致都城之中凡米酒皆被饮尽。蛮族已被逐出其山地堡垒，和平时期降临大地。\n\n街巷之间满是喧闹的人群，醉意醺然，摇摆吟唱，众人纷纷举杯，祝[ROOT.GetCountry.GetRuler.GetName]健康长寿——这位无双功业的首席缔造者。"
 me_jingug_8_title:0 "$missions_jingug_task_8$"
 me_jingug_9.a:0 "此言不虚，此事于地方唯有裨益"
 me_jingug_9_desc:0 "为使旧日朝贡诸邦铭记其对[ROOT.GetCountry.GetName]之民所负的新义务与职责，已颁令于该地区兴建一座新城。[ROOT.GetCountry.GetRuler.GetName]期望这座新邑能将当地之众凝聚一处，使其共享繁荣与我邦之昌盛紧密相连。"
 me_jingug_9_title:0 "$missions_jingug_task_9$"
 missions_jingug:0 "辰主"
 missions_jingug_BUTTON_TOOLTIP:0 "前路漫漫，然所许之酬必不负辛劳……"
 missions_jingug_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]已击溃北方诸敌、巩固南方#E 藩属#!、并征服海外帝国使其向吾都[ROOT.GetCountry.GetCapital.GetName]纳贡称臣之时，此任务即告达成。"
 missions_jingug_DESCRIPTION:0 "构成#E 辰#!之地之半岛，自古便是诸侯酋长争雄逐鹿之所，有史以来莫不如此。虽多有欲自称#E 辰主#!者，然至今无人能将诸部族王国统合于集权之下，世人皆言此伟业永无达成之日。\n\n然[ROOT.GetCountry.GetCapital.GetName]所呈之兆象却昭示另一番图景：将有一位[ROOT.GetCountry.GetRulerTitle]崛起，将诸国统于一面旗帜之下，建立起威名万世回响之王国！非但半岛将归我有，东方诸岛吾等亦视为己物——即刻整备[ROOT.GetCountry.GetName]之水师与征卒，为将至之荣耀岁月而战！"
 missions_jingug_task_1:0 "北伐会盟"
 missions_jingug_task_10:0 "宣索诸岛"
 missions_jingug_task_10_DESC:0 "随着对东方海域侦查之深入，[ROOT.GetCountry.GetRuler.GetName]开始准备我军以图进一步之岛屿征伐。\n\n\n\n\n\n\n\n\n\n@tibet_mil6!"
 missions_jingug_task_10_claims:0 "我们将获得对#Y 末卢#!、#Y 纪伊#!和#Y 熊袭#!地区的宣称。"
 missions_jingug_task_11:0 "北方城墙"
 missions_jingug_task_11_DESC:0 "若吾等能于北境成功筑就坚实防御工事，则吾等浴血奋战所守护之一切皆可得保——先祖之牺牲不应付诸东流！\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 missions_jingug_task_12:0 "辰王之都"
 missions_jingug_task_12_DESC:0 "吾等既已成为疆域无可争议之主宰，便有人提议另择新都——吾等当真满意于[ROOT.GetCountry.GetCapital.GetName]否？或许另有上佳之地可供我家匠师施展身手。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 missions_jingug_task_12_choose_new_capital:0 "我们将得以择定新都。"
 missions_jingug_task_13:0 "制霸东滨"
 missions_jingug_task_13_DESC:0 "主宰东方沿海之时已至——绝不容忍任何异议！"
 missions_jingug_task_14:0 "跨海而征"
 missions_jingug_task_14_DESC:0 "#E倭#!之小酋邦正逐一崩溃于吾[ROOT.GetCountry.GetAdjective]大军之推进之下。若神明继续以胜利恩泽我方军队，则东方诸岛或可尽归我有。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 missions_jingug_task_14_claims:0 "我们将获得对#Y 倭#!地区所有省份的宣称。"
 missions_jingug_task_15:0 "倭国称雄"
 missions_jingug_task_15_DESC:0 "吾等对#E倭#!军队取得永世胜利之捷报已传至[ROOT.GetCountry.GetCapital.GetName]，[ROOT.GetCountry.GetRuler.GetName]下令举行为期一周之庆典。倭岛已归我有！\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 missions_jingug_task_15_every_wa_province_gets:0 "倭地区所有己方省份获得："
 missions_jingug_task_16:0 "合一王国"
 missions_jingug_task_16_DESC:0 "匍匐于凯旋之[ROOT.GetCountry.GetRuler.GetName]威严与伟力面前吧，[ROOT.GetCountry.GetName]之儿女们——向功勋卓著之[ROOT.GetCountry.GetRulerTitle]致敬，其已将[ROOT.GetCountry.GetRuler.GetHerHis]之名刻入辰国史册！\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 missions_jingug_task_1_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]内已议定，须将北方藩属与[ROOT.GetCountry.GetName]之民更紧密地凝聚一体。吾等须召集会议，告知附庸诸邦其所应承担之新职责与吾等对彼等之期望。\n\n\n\n\n\n\n\n\n\n@east_steppemil2!"
 missions_jingug_task_1_claims:0 "我们将获得对#Y 乐浪#!和#Y 辽东#!地区的宣称。"
 missions_jingug_task_2:0 "扬帆起航"
 missions_jingug_task_2_DESC:0 "长久以来，[GetCountry('DMN').GetName]始终抗拒着不可避免之命运，然终结其脱离大陆而独立之妄想之时已至。[ROOT.GetCountry.GetRuler.GetName]已下令建造一支水师，其明确使命便是迫使岛上居民俯首听命。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 missions_jingug_task_3:0 "青铜工艺"
 missions_jingug_task_3_DESC:0 "我方甲胄匠与兵器匠已精通青铜工艺，该材料在[ROOT.GetCountry.GetName]各处皆可觅得，然增产之事仍有可为。于出产基础金属@base_metals!之省份直接设立#T铁匠铺#!作坊，必将有助此事。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 missions_jingug_task_3_blacksmith_on_bronze:0 "我们至少有一省产出基础金属并有铁匠铺建筑。"
 missions_jingug_task_4:0 "征服朝鲜"
 missions_jingug_task_4_DESC:0 "吾等不能再忽视[GetCountry('JSN').GetName]对我方生活方式所构成之威胁。若不以迅雷之势严加处置，则后世子孙必将追悔父辈之软弱——刻不容缓，即刻出击！\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 missions_jingug_task_4_claims:0 "我们将获得对#Y 临屯#!和#Y 玄菟#!地区的宣称。"
 missions_jingug_task_5:0 "化导古刀"
 missions_jingug_task_5_DESC:0 "虽古道教信仰已如野火般席卷我南方诸省，然吾等必须确保全境皆恪守正确之巫俗祭祀之道。\n\n\n\n\n\n\n\n\n\n@tibet_mil11!"
 missions_jingug_task_5_some_kodos_will_convert:0 "部分古刀族人口将皈依。"
 missions_jingug_task_6:0 "耽罗之岛"
 missions_jingug_task_6_DESC:0 "一旦为[ROOT.GetCountry.GetName]夺取[GetCountry('DMN').GetName]之岛屿，吾等便可将目光投向东方——彼处其它岛屿，瓜熟蒂落，只待我大军征伐。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 missions_jingug_task_7:0 "仪礼青铜短剑"
 missions_jingug_task_7_DESC:0 "近来，我方金工巧匠已开始铸造一种细长利刃，吾等语言中称之为#E细形铜剑#!。\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 missions_jingug_task_7_any_artist:0 "我们至少有一省有艺术家特殊人口。"
 missions_jingug_task_8:0 "北辰"
 missions_jingug_task_8_DESC:0 "若[ROOT.GetCountry.GetRuler.GetSheHe]能将蛮族驱出北#E 辰#!之地，则[ROOT.GetCountry.GetRuler.GetName]之声名荣耀必将永垂不朽——此半岛之上，唯有[ROOT.GetCountry.GetName]方可为尊。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 missions_jingug_task_9:0 "辰韩部族中心"
 missions_jingug_task_9_DESC:0 "#E 辰韩#!之地素为文化独特之部族小邦所据，其长久以来游离于我邦联直接统辖之外。其土位于东方与我腹地之间之崎岖内陆，不法酋首常劫掠自东港输往我都城之商队。吾等必须直接掌控此土，以保商路安宁，并教化我部族同胞。\n\n\n\n\n\n\n\n\n\n@east_steppemil3!"
 ritual_bronze_daggers_jingug:0 "仪礼青铜短剑"
 ritual_bronze_daggers_jingug_desc:0 "由辰国巧匠所锻造之「细形铜剑」，即礼仪所用之精饰青铜短剑，折射出此王国中冶工与金工匠人之精湛技艺。"
 united_jingug:0 "统一辰国"

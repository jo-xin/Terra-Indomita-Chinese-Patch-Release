l_simp_chinese:
 desc_hufu_riding_zhao:0 "依王室重臣之谏，我邦征召兵已与北方胡人游牧部族一同操练。"
 desc_lian_po_defensive:0 "廉颇，有史以来至为卓绝之名将之一，亲自督建了此等不可摧破之防御工事。"
 desc_zhao_final_mod:0 "赵已征服所有胆敢抗拒之敌，开创了一个崭新的时代——于此时代中，彼等乃全华夏之主宰与君上。"
 desc_zhao_heshibi:0 "所谓「和氏璧事件」之纠纷，已导致赵与秦之间局势紧张。"
 desc_zhao_idioms:0 "我民间传说与日常言谈中所蕴含之智慧与才思，已为邻邦所赞誉。"
 desc_zhao_levy_mission_mod:0 "赵王已允许蛮族辅助部队与本邦征召兵并肩作战、共同训练。"
 hufu_riding_zhao:0 "胡服骑射"
 lian_po_defensive:0 "不破之阵"
 me_zhao_1.a:0 "我信你之谏言，[GetCharacter('(int32)630').GetName]——做得好"
 me_zhao_10.a:0 "最高级别之外交胜利！"
 me_zhao_10_desc:0 "虽[ROOT.GetCountry.GetRuler.GetName]将[ROOT.GetCountry.GetRuler.GetHerHis]心力专注于疆域之外，然此并非意味着当[ROOT.GetCountry.GetCapital.GetName]现出吉兆良机之时，[ROOT.GetCountry.GetRulerTitle]不会如雄狮扑击。\n\n消息传至[ROOT.GetCountry.GetRulerTitle]耳中，谓有一名哲学名家兼雄辩之士正寻求新主，[ROOT.GetCountry.GetRuler.GetFirstName]便决意不惜一切博取此贤士之青眼。幕后暗通款曲，厚礼往返，待诸事圆满，#E 公孙龙#!遂向门徒宣告将迁居[ROOT.GetCountry.GetName]。"
 me_zhao_10_title:0 "$zhao_missions_task_10$"
 me_zhao_11.a:0 "此役已胜，然战事未息…"
 me_zhao_11_desc:0 "虽战况时而危急，[ROOT.GetCountry.GetName]之征召兵终胜[GetCountry('WEI').GetName]之军，将其逐回#E 黄河#!以北。\n\n[GetCountry('WEI').GetRuler.GetName]因此全事蒙受奇耻大辱，亲咎[ROOT.GetCountry.GetRuler.GetName]招致此灾。如犬舐其创，[GetCountry('WEI').GetAdjective]人正蓄势待发，伺机趁我武备不备之际夺回新近所失之地。"
 me_zhao_11_title:0 "$zhao_missions_task_11$"
 me_zhao_12.a:0 "此等背信弃义之徒将为谗言付出代价！"
 me_zhao_1200.a:0 "十五座城换一块玉宝？赵人疯了吗！"
 me_zhao_1200_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，臣须禀报，吾与[GetCountry('ZHA').GetName]之交谊已损，全因君上几位谋臣之举。\n\n吾等曾探寻一件名为#E 和氏璧#!的传奇玉宝，此物流落赵地；传闻此玉可赋予王室正统，故令[ROOT.GetCountry.GetRuler.GetFirstName]为之痴迷，曾随口言及此等珍宝可抵十座乃至十五座秦城。\n\n惜乎此王室戏言竟被误作诏令，一纸文书送至[GetCountry('ZHA').GetCapital.GetName]，许以大片疆土。赵人自是欣然应允，然当彼等明晰吾毫无割让十五城之意，[GetCountry('ZHA').GetRuler.GetName]便斥吾为欺诈之徒。"
 me_zhao_1200_title:0 "$zhao_missions_task_12$"
 me_zhao_12_desc:0 "一桩丑闻震动了[ROOT.GetCountry.GetCapital.GetName]朝廷，起因乃[ROOT.GetCountry.GetName]与[GetCountry('QIN').GetName]间一场外交龃龉。此事史称#E '和氏璧事件'#!，已自行发酵，持续损害两国邦交。\n\n长话短说，多年之后，玉宝#E 和氏璧#!终入赵人之手，秦人提出以十五城易此璧——赵人欣然应允。当我使臣#E 蔺相如#!携和氏璧抵[GetCountry('QIN').GetCapital.GetName]之时，方知[GetCountry('QIN').GetRuler.GetName]全无守诺之意。蔺相如竟奇迹般携璧全身而退，此事昭然揭示秦人毫无信义可言。"
 me_zhao_12_title:0 "$zhao_missions_task_12$"
 me_zhao_13.a:0 "愿他日葬于此处我亦无愧…"
 me_zhao_13_desc:0 "'死非终结，仅为伊始。然于哀悼生者之逝者而言，此言不过是苍白之慰藉。'\n\n[ROOT.GetCountry.GetRuler.GetName]任凭此谜在[ROOT.GetCountry.GetRuler.GetHerHis]心中盘旋，[ROOT.GetCountry.GetRuler.GetSheHe]随同[ROOT.GetCountry.GetRuler.GetHerHis]诸臣巡视距[ROOT.GetCountry.GetCapital.GetName]数日行程之采石场。\n\n朝阳仅露微光，锤击声与役夫呼喊已充斥天际。奴隶正开采大理石，此石将用于一座宏伟建筑——#E 赵王陵#!。\n\n'愿吾等铭记昔日贤君，尽己所能光耀其名。'[ROOT.GetCountry.GetRuler.GetFirstName]之宣谕赢得一片恭敬掌声。"
 me_zhao_13_title:0 "$zhao_missions_task_13$"
 me_zhao_14.a:0 "我想你儿子也可以来…"
 me_zhao_14_desc:0 "数月前，一份奇特之请愿呈至[ROOT.GetCountry.GetRuler.GetName]案前。虽[ROOT.GetCountry.GetRulerTitle]初欲置之不理，然深思之后，终准其所请。\n\n[ROOT.GetCountry.GetName]境内有一度支尚书，名曰#E 赵奢#!，此公政绩斐然，以公正与数术之才名闻遐迩。\n\n然赵奢所愿者非止于案牍之宁静；此温文尔雅之算学家渴求沙场荣耀，愿离[ROOT.GetCountry.GetCapital.GetName]藏书阁之安逸，亲赴前线，过士卒之生涯。\n\n虽有人谏阻此举，[ROOT.GetCountry.GetRuler.GetFirstName]却欲一窥是否一方之卓越可化为另一方之荣光，遂予[ROOT.GetCountry.GetRuler.GetHerHis]准许。唯有一桩不快，自各方看来——#E 赵奢#!之子，一位名为#E 赵括#!的纨绔子弟，将随父同迁至[ROOT.GetCountry.GetAdjective]都城。"
 me_zhao_14_title:0 "$zhao_missions_task_14$"
 me_zhao_15.a:0 "韩之所以尚存，只因我允之…"
 me_zhao_15_desc:0 "虽[GetCountry('HAN').GetName]之[GetCountry('HAN').GetRulerTitle][GetCountry('HAN').GetRuler.GetName]拒绝[ROOT.GetCountry.GetRuler.GetName]加诸其身之标签，然近来[ROOT.GetCountry.GetName]之[ROOT.GetCountry.GetRulerTitle]已将韩邦称作“#E赵之保护国#!”，此对曾与我匹敌之骄傲民族而言，实为奇耻大辱。\n\n谁能否认[GetCountry('HAN').GetRuler.GetFirstName]之力已为赵之辉煌军团所削弱？经此惨败，他们再无复起之机……他们的时日显然已经无多，而冥府诸神正饱食倒毙的韩国士卒。"
 me_zhao_15_title:0 "$zhao_missions_task_15$"
 me_zhao_16.a:0 "容我侍奉，主公，而后你自会知晓"
 me_zhao_16_desc:0 "'#E 李牧#!——汝之名我已耳闻，然此乃我首次亲见汝颜。然恕我唐突一问，我不得不心生疑惑——汝之盛名可名副[ROOT.GetCountry.GetRuler.GetHerHis]实否？传闻果真如实——谓汝乃当世持剑之最善战将耶？谓汝为荣誉而战，万金难购汝之效忠耶？'[ROOT.GetCountry.GetRuler.GetFirstName]自座中起立，续言道。'传闻汝亲手斩杀千人，又令万人丧生，然汝却甘愿亲来投我，为[ROOT.GetCountry.GetName]效力乎？'\n\n立于[ROOT.GetCountry.GetRuler.GetName]面前者，乃一着赵卒素甲之男子。李牧向[ROOT.GetCountry.GetRulerTitle]深深躬身，几以面贴地，启齿作答。"
 me_zhao_16_title:0 "$zhao_missions_task_16$"
 me_zhao_17.a:0 "干得好，廉颇！你超越了我对你的崇高期望"
 me_zhao_17_desc:0 "#E 廉颇#!就任大将军后，首批政令之一，便是倾[ROOT.GetCountry.GetAdjective]国之力，于[GetProvince('(int32)8368').GetName]省筑起一座要塞。\n\n廉颇谓此城垒将为我军之前锋，一柄指向南方之匕首，既能刺穿敌心，亦能护我脆弱疆土免遭侵犯。城垣之上密布防御工事，数万弓手伫立垛口，目光凝望远方。\n\n[ROOT.GetCountry.GetRuler.GetName]亲巡林虑，对此番经营大加赞许。"
 me_zhao_17_title:0 "$zhao_missions_task_17$"
 me_zhao_18.a:0 "尔浑身马粪汗臭，蛮夷渣滓！"
 me_zhao_18_desc:0 "挟北伐蛮夷之胜威，[ROOT.GetCountry.GetRuler.GetName]拒见遣至[ROOT.GetCountry.GetCapital.GetName]之[GetCountry('XNU').GetName]使者。[ROOT.GetCountry.GetRuler.GetFirstName]非但不允彼等陈词，更命[ROOT.GetCountry.GetAdjective]士卒对任何踏出草原之匈奴蛮夷放箭。\n\n据传[GetCountry('XNU').GetRuler.GetName]之怒无有边际，此部族首领扬言将[ROOT.GetCountry.GetRuler.GetFirstName]之首级制成酒器，然此不过一介无能游牧之徒劳威胁，如阉人愤吠耳[ROOT.GetCountry.GetRuler.GetHerHis]。"
 me_zhao_18_title:0 "$zhao_missions_task_18$"
 me_zhao_19.a:0 "'于是开始'…哈！你在开玩笑吗？"
 me_zhao_19_desc:0 "一封简短书函自[GetCountry('QIN').GetName]之[GetCountry('QIN').GetRulerTitle]送至[ROOT.GetCountry.GetRuler.GetName]——'一切就此开始'。\n\n然战事早已开局；[ROOT.GetCountry.GetName]之军已粉碎秦人不可战胜之神话，驱散其军所至之处无坚不摧之氛围。虽两军交锋惨烈，然神明佑我，我师已夺取宝贵秦地，决不归还。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]狞笑一声，饮尽杯中酒，将空盏掷于地。'传信秦人，令彼知晓，吾等决不宽宥，定将其逐回彼等所来自之西方荒野！'"
 me_zhao_19_title:0 "$zhao_missions_task_19$"
 me_zhao_1_desc:0 "当[GetCharacter('(int32)630').GetName]向[ROOT.GetCountry.GetRuler.GetName]提出异乎寻常之议——令吾骑兵改穿北地蛮夷之外来服饰——朝中保守势力大加抵制，深恶此种公然接纳奇风异俗之举。先祖在天之灵当作何想，见吾等摒弃[ROOT.GetCountry.GetAdjective]之风而效牧人之装？\n\n然[ROOT.GetCountry.GetRuler.GetFirstName]一旦被说服，便再无回头之路——我骑兵将采用胡服，蛮人之衣。[GetCharacter('(int32)630').GetFirstName]确信我军将从中受益，而此明智之大臣不久即被证明无误。#E 楼烦#!部落虽落后，却擅长骑术，其衣装极利于马上作战。\n\n我骑马征召兵较昔日更为致命……"
 me_zhao_1_title:0 "$zhao_missions_task_1$"
 me_zhao_2.a:0 "愿我等永不再受家族阴谋之扰"
 me_zhao_20.a:0 "祈我水手已备好迎接漫长之日"
 me_zhao_20_desc:0 "[ROOT.GetCountry.GetAdjective]渔舟沿#E 渤海#!海域往来，已成司空见惯之景。昔日深居内陆之[ROOT.GetCountry.GetName]民众，今以极大热情投身波涛，其热忱正彰显吾等终得通海之欢欣。\n\n非独庶民乘此形势之变；[ROOT.GetCountry.GetRuler.GetName]已诏令建造一支王家水师，以护我商贾，且使我军能渡海运兵。\n\n然非人人乐见我等于此区域之到来；[GetCountry('YAN').GetName]之[GetCountry('YAN').GetRulerTitle]正悄然备战，准确判断我等将不止步于此。"
 me_zhao_20_title:0 "$zhao_missions_task_20$"
 me_zhao_21.a:0 "这也正是我想要的…"
 me_zhao_21_desc:0 "在[ROOT.GetCountry.GetAdjective]军威之壮丽展示中，我前进之师已深入南方，驱散一切试图阻挠者。而当敌之士卒背弃荣誉、仓皇逃命之际，被遗弃之当地民众正迅速接纳我传统风尚。\n\n不出世代，无人将忆起此诸地曾由[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏以外者所治。"
 me_zhao_21_title:0 "$zhao_missions_task_21$"
 me_zhao_22.a:0 "勿退缩，奋勇向前——永恒的荣光在等待！"
 me_zhao_22_desc:0 "吾等奋战所求之时刻终在咫尺之间——#E 一统天下#!即在眼前！推出攻城器械，备好攀城之梯！愿战神与死神与[ROOT.GetCountry.GetRuler.GetName]之将士并驾齐驱！"
 me_zhao_22_title:0 "$zhao_missions_task_22$"
 me_zhao_23.a:0 "庇佑子孙后代，始于今日"
 me_zhao_23_desc:0 "[ROOT.GetCountry.GetRuler.GetName]时刻铭记[ROOT.GetCountry.GetRuler.GetHerHis]对后世子孙之责任，诏令[ROOT.GetCountry.GetRuler.GetSheHe]拟在国中兴建一座#E 赵武学堂#!。\n\n此学府将以后世之战法攻城之术训导后进，确保国中军令系统充塞[ROOT.GetCountry.GetName]最善战之士。"
 me_zhao_23_title:0 "$zhao_missions_task_23$"
 me_zhao_24.a:0 "有太多值得感恩之事…天命归我！"
 me_zhao_24_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]回顾将[ROOT.GetCountry.GetRuler.GetHerHim]及其先祖引至此刻之曲折历程时，恍若梦境；昔日一切果真曾发生乎？[ROOT.GetCountry.GetName]果将其公允之治推及#E 中国#!全境，粉碎一切企图阻挠[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝崛起之敌人？赵氏天子果真自[ROOT.GetCountry.GetCapital.GetName]一统天下、无人敢逆？\n\n遥远之记忆与半忘之面孔涌上[ROOT.GetCountry.GetRulerTitle]心头，[ROOT.GetCountry.GetRuler.GetFirstName]稍驻片刻，逐一思量每一位促成今日之人物。"
 me_zhao_24_title:0 "$zhao_missions_task_24$"
 me_zhao_25.a:0 "有朝一日我将得偿所愿，但眼下还有事要做"
 me_zhao_25_desc:0 "神明对[ROOT.GetCountry.GetRuler.GetName]颇为仁慈，然其所设之途从非坦途。一生所历乃[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]之分内常事——护民安邦、守古道统；时有地方叛乱，僭越者妄提不智之索位诉求，宫闱之中丑闻阴谋层出不穷……足以令人心力交瘁，哀叹王冠之沉重。\n\n然[ROOT.GetCountry.GetRuler.GetFirstName]深知事态尚可更糟；他有[GetCharacter('(int32)630').GetName]这般贤能之臣分忧理政，二人正携手推动赵邦社会之变革。然非人人赞同此举；宗族之中，如[GetCharacter('(int32)629').GetName]者便反对采纳胡服骑射之传统及其服饰风格。虽[GetCharacter('(int32)630').GetFirstName]竭力说服[GetCharacter('(int32)629').GetFirstName]接纳此等改革，[ROOT.GetCountry.GetRuler.GetFirstName]之叔父仍是王廷中一股动摇之力量，宛若天际滚滚闷雷。\n\n然宗族之中亦非全为烦恼；[ROOT.GetCountry.GetRuler.GetFirstName]之年仅六岁之子[GetCharacter('(int32)626').GetName]，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏最幼之嗣，与父形影不离，追随左右；诚然，父母之乐、天赐之福。\n\n然而，尚有许多悲戚之日，王常幻想全然卸下[ROOT.GetCountry.GetCapital.GetName]之职责，隐退而去……"
 me_zhao_25_title:0 "吉日良辰"
 me_zhao_2_desc:0 "无论好坏，[GetCharacter('(int32)629').GetName]对[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之败坏影响终于得到遏制。公开反对[ROOT.GetCountry.GetRuler.GetName]新政之举非仅令人厌烦——更令整个[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族蒙羞，且使人在此动荡之时质疑其治理[ROOT.GetCountry.GetName]之资格。\n\n然[ROOT.GetCountry.GetRuler.GetFirstName]再展其于朝中周旋应对之高明手腕，此乖戾老叔终被噤声，朝中反对势力亦四分五裂，溃散于无形。"
 me_zhao_2_title:0 "$zhao_missions_task_2$"
 me_zhao_3.a:0 "相信我，你将有诸多机会为赵而战…"
 me_zhao_3_desc:0 "'冲啊，放箭！他能否命中……中了！呜呼！好骑术，[GetDeityDefinition('omen_chinese_huangdi').GetName]之天选者！'\n\n当国政未将[ROOT.GetCountry.GetRuler.GetName]困于[GetProvince('(int32)8681').GetName]王宫之际，[ROOT.GetCountry.GetRulerTitle]常可在城外征兵营地寻见，向在赵都郊外田野庄园中操练之征召兵呐喊助威。每当吾骑兵命中靶心，万众欢呼声震长空，继之以赵之战吼。\n\n开发邯郸之人力资源，已大获成功，[ROOT.GetCountry.GetName]之军团与征召兵中已充盈渴求一试锋芒之好战士卒。"
 me_zhao_3_title:0 "$zhao_missions_task_3$"
 me_zhao_4.a:0 "百姓尽可安心，我将守护[ROOT.GetCountry.GetName]"
 me_zhao_4_desc:0 "赖[ROOT.GetCountry.GetRuler.GetName]传播文明之光于#E 五原#!蛮荒之地，北疆从未如今日般稳固安宁。\n\n此区所筑要塞似足以震慑那些不时侵扰我边界之草原豺狼，彼等已如懦夫般遁入草原深处。为防其轻易复来，吾等已控扼其昔日用以肆虐之重要商道。"
 me_zhao_4_title:0 "$zhao_missions_task_4$"
 me_zhao_5.a:0 "尔等须作为强大赵国之藩属臣服于我"
 me_zhao_5.b:0 "尔等勇士须为我充当辅军作战"
 me_zhao_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已完成[ROOT.GetCountry.GetRuler.GetHerHis]笼络[GetCountry('LNH').GetName]、[GetCountry('HEZ').GetName]及[GetCountry('LOF').GetName]部族首领之行动，将其引至[ROOT.GetCountry.GetCapital.GetName]，示以蛮夷前所未见之盛情厚遇。\n\n一抵赵都，彼等即获赐丝绸锦袍与大量美酒，当即畅饮无度。赛马与射术表演供其娱乐，待到鼓笛声中舞姬登场，首领面前已摆满珍馐盛宴，随即大快朵颐。炙全羊、猪肉、牛肉、酱焖禽肉、鲜鱼腌鱼、熏肠串串、鲜蔬与醋渍菜蔬、巨碗热气蒸腾之米饭，更有芬芳酱汁与醇厚肉汁之海洋——此等庖厨排场，足与#E 商朝#!最穷奢极欲之时媲美，乃是赵国慷慨之压倒性展示。\n\n至寒暄已毕、论及正事之际，[ROOT.GetCountry.GetRuler.GetFirstName]发觉[ROOT.GetCountry.GetRuler.GetSheHe]已将蛮夷玩弄于[ROOT.GetCountry.GetRuler.GetHerHis]股掌之间，尽可取[ROOT.GetCountry.GetRuler.GetSheHe]所欲之物。"
 me_zhao_5_title:0 "$zhao_missions_task_5$"
 me_zhao_6.a:0 "愿我之道统为后世长存"
 me_zhao_6_desc:0 "虽我俗语成语不过日常言谈之事，[ROOT.GetCountry.GetRuler.GetName]已诏令[ROOT.GetCountry.GetCapital.GetName]宫中之书吏笔录此等民间智慧珠玑，以使万邦皆能习我之道。\n\n赖此编纂我文化精粹与俗谚之学术努力，邻邦渐在其语言中使用我成语典故——此乃我文化堪为典范之佐证。"
 me_zhao_6_title:0 "$zhao_missions_task_6$"
 me_zhao_7.a:0 "晋阳不可凋零，必须欣欣向荣"
 me_zhao_7_desc:0 "纵他人如何置评，吾民乃有情之民，自豪铭记过往之勋业荣光，忠实遵循古道旧制。正是此种尽忠之精神，引领[ROOT.GetCountry.GetRuler.GetName]倾[ROOT.GetCountry.GetName]之部分资财于[GetProvince('(int32)8636').GetName]城，此城曾为我权力之所在，或可充作第二都城，西都之城。"
 me_zhao_7_title:0 "$zhao_missions_task_7$"
 me_zhao_8.a:0 "你竟以此等琐屑之报扰我？"
 me_zhao_8_desc:0 "果如所料，[GetCountry('ZHS').GetName]之微弱兵力如鱼糕般土崩瓦解，吾等已将其一切据为己有，以增[ROOT.GetCountry.GetName]之无上荣光，[ROOT.GetCountry.GetRuler.GetName]君上。"
 me_zhao_8_title:0 "$zhao_missions_task_8$"
 me_zhao_9.a:0 "终于，此可诅咒之负担从我身上卸下！"
 me_zhao_900.a:0 "非夷非…他不该如此死去"
 me_zhao_900_desc:0 "[ROOT.GetCountry.GetRuler.GetName]加冕仅逾两周，一桩丑闻便降临[ROOT.GetCountry.GetCapital.GetName]朝廷。\n\n事虽惨烈，然不得略述。#E 嬴樗里#!公开指责大臣#E 费义#!之谏言腐化了#E 嬴雍#!之心智，并指控[ROOT.GetCountry.GetRuler.GetFirstName]贿赂此臣以篡夺王位。嬴樗里宣称义与雍之间存有苟且关系，当众誓以正义还之。某夜，费义返家途中，在[ROOT.GetCountry.GetCapital.GetName]街巷遇刺。不幸此智者未能幸免于难，死于刺客匕首之下。\n\n#E 嬴樗里#!承认为此胆大妄为之谋杀负责，挑衅[ROOT.GetCountry.GetRulerTitle]采取行动。"
 me_zhao_900_title:0 "挚友陨落"
 me_zhao_901.a:0 "如今我谁也不能信！"
 me_zhao_901_desc:0 "无人能预料后续之事；[ROOT.GetCountry.GetRuler.GetName]以其经验不足者所难及之迅捷行动，巧妙化解对其统治之威胁。\n\n视#E 嬴樗里#!之举等同于向[ROOT.GetCountry.GetName]宣战，此年轻之王宣布#E 樗里#!为国敌，令即刻处决此作乱之徒。诏令清晨颁下，日暮之前，倨傲樗里之首级已被钉于[ROOT.GetCountry.GetCapital.GetName]正门之上，鸦啄其目。\n\n虑此动荡时刻恐有另谋叛乱者，[ROOT.GetCountry.GetRuler.GetFirstName]行前所未有之举——下令逮捕#E 嬴雍#!，将震愕之前任投入专囚赵国最凶恶罪犯之地牢。"
 me_zhao_901_title:0 "何盈之胆"
 me_zhao_902.a:0 "武灵功过参半，然我仍敬之"
 me_zhao_902_desc:0 "于是，伴随[ROOT.GetCountry.GetRuler.GetName]登[ROOT.GetCountry.GetName]大位之纷乱诸事终告平息，所有针对[ROOT.GetCountry.GetRuler.GetFirstName]之阴谋俱为年轻之王不屈之精神所粉碎。\n\n在冷酷展示绝不放弃权柄之后，针对[ROOT.GetCountry.GetRuler.GetFirstName]之密谋尽皆凋零枯萎，终化为虚无。\n\n#E 嬴雍#!自其暮年渐从史册消失，虽《大赵纪年》载有其晚年境况之传闻——或称其受饥渴交迫，苦熬百日而亡；或谓其谥号#E 武灵王#!者，竟乔装官吏，设法逃往[GetCountry('QIN').GetName]。然简朴真相终究无人确知武灵骸骨安于何处。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]常思忖其前任之复杂遗绪，武灵王引胡服入国，将因诸般变革而永载史册。终其究竟，可谓雍未能逃脱加诸其身之阴谋与义务，纵其渴求解脱责任之自由；有时，天命注定为王者乃一男子不可逃之宿命，此职责唯死方休。\n\n此诸般教训，[ROOT.GetCountry.GetRuler.GetName]将终其一生铭记于心。"
 me_zhao_902_title:0 "武灵王薨"
 me_zhao_9_desc:0 "一段时间以来，[ROOT.GetCountry.GetRuler.GetName]倦于治理[ROOT.GetCountry.GetName]已是公开之秘，故当[ROOT.GetCountry.GetRulerTitle]有任命继嗣之机，[ROOT.GetCountry.GetRuler.GetFirstName]在#E 费义#!大臣之导引下迅即行事。\n\n然出乎众人——尤其是[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏宗亲长辈——之所料，[ROOT.GetCountry.GetRuler.GetFirstName]择定年轻之#E 嬴何#!以代[ROOT.GetCountry.GetRuler.GetHerHim]。\n\n对此宣示之反应莫衷一是，其紧张氛围令人忆及#E 嬴成#!在[ROOT.GetCountry.GetCapital.GetName]本已和谐之朝廷中所引入之不协音调。#E 嬴樗里#!尤直言其不满，渐成反对派之代表，诸多暗中不满此决定却不愿公开表达者，正聚于此年轻人旗下。\n\n非人人皆悦，且阴谋诡计在所难免，然[ROOT.GetCountry.GetRuler.GetFirstName]却欣喜若狂，或为多年以来首次。此退位之'主父'拟居于[ROOT.GetCountry.GetCapital.GetName]，安住[ROOT.GetCountry.GetRuler.GetHerHis]众多宫殿之一，若#E 嬴何#!求问，则供谏言。"
 me_zhao_9_title:0 "$zhao_missions_task_9$"
 zhao_final_mod:0 "至尊霸权"
 zhao_heshibi:0 "和氏璧事件"
 zhao_idioms:0 "赵人之格言成语"
 zhao_levy_mission_mod:0 "蛮族辅助军"
 zhao_military_academy_decision:0 "从赵国军事学院招募精英将领"
 zhao_military_academy_decision_cd_tt:0 "我们每二十年只能招募一次。"
 zhao_military_academy_decision_desc:0 "每一世代，皆有一批新锐武士自声名显赫之#E赵国军事学院#!毕业，该学院之创建旨在培养精英将领。故此，延请最优秀之军士亲自统领赵国之军，乃王室之特权。"
 zhao_missions:0 "邯郸风暴"
 zhao_missions_BUTTON_TOOLTIP:0 "荣耀唯属于敢于争取之人！"
 zhao_missions_CRITERIA_DESCRIPTION:0 "此任务将于#E 赵#!压制环伺之诸多威胁、缔造一个实现#E 统一中国#!之辉煌王朝时完成。"
 zhao_missions_DESCRIPTION:0 "过往百年于我族人而言犹如一阵旋风，彼等坐于最前排，亲历了改变周遭世界之划时代事件。自#E三家分晋#!以来——吾等在其中扮演了重要角色——周边诸邦国与王国皆竭力欲将我自优势地位上赶下。\n\n我敌手之中，首推[GetCountry('QIN').GetName]，虽我两国之间尚存一段脆弱之和平，然要不了多久，诸王之野心便将驱使成千上万之人葬身沙场。赵国能否超越群伦而崛起，抑或如众多妄图抗拒历史潮流之宵小王国一般，被毁灭并遗忘？"
 zhao_missions_task_1:0 "胡服骑射"
 zhao_missions_task_10:0 "公孙龙"
 zhao_missions_task_10_DESC:0 "名家——这个有时被斥为区区「辩者」之哲学流派——已培养出一位杰出人才，即著作家#E公孙龙#!，其成就与学术造诣吸引了[ROOT.GetCountry.GetName]全境之瞩目。让吾等派人延请此位智者，观其是否愿来效力于[ROOT.GetCountry.GetRuler.GetName]及我国之百姓。\n\n\n\n\n\n\n\n\n\n@tibet_mil1!"
 zhao_missions_task_11:0 "削弱魏国"
 zhao_missions_task_11_DESC:0 "[GetCountry('WEI').GetName]之军已越过其侧之#E黄河#!，夺取吾等视为己有之宝贵农田。是时也让此狂吠之犬噤声，取回本属于我之物。\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 zhao_missions_task_11_claims_tt:0 "吾等将获得对#Y河南#!、#Y颖川#!、#E东#!及#Y大梁#!诸郡之宣称。"
 zhao_missions_task_11_wei_doesnt_own_henei_handan_wei:0 "魏国在河内、邯郸和卫地区不再拥有任何领地。"
 zhao_missions_task_12:0 "和氏璧事件"
 zhao_missions_task_12_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]何其愚也，竟听信[GetCountry('QIN').GetRuler.GetName]——[GetCountry('QIN').GetName]之主——之欺诈言辞。彼等向吾等提出一无礼之议，吾等欣然接受，然今彼等竟声称从未言及此事，暗示我乃说谎之人——此诚对我荣誉之莫大侮辱！\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 zhao_missions_task_12_claims_tt:0 "我们将获得对#Y 商#!、#Y 西河#!和#Y 太原#!地区的宣称。"
 zhao_missions_task_13:0 "赵王陵"
 zhao_missions_task_13_DESC:0 "让吾等勿忘嬴氏一族，彼等成就之伟业值得永世铭记——吾等必须为引领我国度过艰难岁月之高贵武士王族修建一座配得上其尊荣之永恒安息之所。\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 zhao_missions_task_14:0 "擢升赵奢"
 zhao_missions_task_14_DESC:0 "我朝最受尊敬之士人之一，以清廉度支尚书而闻名之官吏#E赵奢#!，请求获准为[GetCountry('ZHA').GetName]之旗帜统兵作战，[ROOT.GetCountry.GetRuler.GetName]有意应允；赵奢乃干练之行政官，其天赋才华已然屡次得到证明。\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 zhao_missions_task_15:0 "韩保护国"
 zhao_missions_task_15_DESC:0 "[GetCountry('HAN').GetName]乃骄傲之民族，其所获诸多赞誉名副其实，然[ROOT.GetCountry.GetRuler.GetName]已然明了，彼等若能在赵国温和之宗主统治下必将蓬勃发展。是时也将此愿景化为现实。\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 zhao_missions_task_15_annex_han:0 "我们将吞并我们的附庸韩国。"
 zhao_missions_task_15_claims_tt:0 "吾等将获得对#Y咸阳#!、#Y长安#!、#E栎阳#!、#E弘农#!及#Y河东#!诸郡之宣称。"
 zhao_missions_task_16:0 "李牧"
 zhao_missions_task_16_DESC:0 "吾等身处之时代，传奇将领可于列强军中随处觅得，然#E李牧#!远超当下效力于[GetCountry('ZHA').GetName]之任何将领。吾等当即刻延揽此位大师！\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 zhao_missions_task_16_claims_tt:0 "吾等将获得对#Y营山北#!、#Y勃海#!、#E河间#!、#E平原#!、#E黔上#!及#Y清河#!诸郡之宣称。"
 zhao_missions_task_17:0 "廉颇防线"
 zhao_missions_task_17_DESC:0 "战争史上最伟大之将领之一，#E廉颇#!，提议吾等修建一系列防御工事，以护我免受敌寇入侵。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 zhao_missions_task_18:0 "匈奴威胁"
 zhao_missions_task_18_2_forts_in_yinshan:0 "我们在阴山地区拥有两座要塞。"
 zhao_missions_task_18_DESC:0 "吾等绝不可听任可怖之[GetCountry('XNU').GetName]蛮族控制通往草原之商队路线，因若马背领主们据有此地，彼等便可肆无忌惮地劫掠于我——此威胁必须予以处置！\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 zhao_missions_task_18_xiongnu_doesnt_own_fuyangju:0 "匈奴在富阳居地区不再拥有任何领地。"
 zhao_missions_task_19:0 "压制秦国"
 zhao_missions_task_19_DESC:0 "我宿敌[GetCountry('QIN').GetName]之军队正被我军逐步逼退，虽进程缓慢却稳扎稳打。敌军之士气已降至前所未有之低谷，[ROOT.GetCountry.GetRuler.GetName]已然明了，一劳永逸摧毁秦国之时机已至。\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 zhao_missions_task_19_claims_tt:0 "我们将获得#Y 豫#!地区所有省份的宣称。"
 zhao_missions_task_1_DESC:0 "[GetCharacter('(int32)630').GetName]曾建言，吾等不应将#E楼烦#!之#E狄#!部族人视为落后之累赘，而应视其为我军之灵感源泉——欲在北方荒原中生存，此等野蛮部族必具钢铁之躯。\n\n\n\n\n\n\n\n\n\n@east_steppemil1!"
 zhao_missions_task_2:0 "处理朝中反对势力"
 zhao_missions_task_20:0 "渤海湾"
 zhao_missions_task_20_DESC:0 "#E渤海湾#!平静繁荣之水域，不久便将目睹赵国战舰编队巡弋海上。然[ROOT.GetCountry.GetRuler.GetName]对沿海领土之胃口有增无减，[ROOT.GetCountry.GetRulerTitle]已明示，[GetCountry('YAN').GetName]之富饶诸省令[ROOT.GetCountry.GetRuler.GetHerHim]难以抗拒……\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 zhao_missions_task_20_claims_tt:0 "我们将获得#Y 燕#!所有领地的宣称。"
 zhao_missions_task_21:0 "晋之故地"
 zhao_missions_task_21_DESC:0 "谁敢违抗[ROOT.GetCountry.GetRuler.GetName]之意志，[ROOT.GetCountry.GetRuler.GetSheHe]随心所欲遣赵国之军四出征伐？可有任何力量能阻挡强大之赵国席卷晋地？吾等将追歼敌寇直至#E中原山#!——天下将无一处可供彼等藏身。\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 zhao_missions_task_22:0 "统一大战"
 zhao_missions_task_22_DESC:0 "终于，胜利之刻近在咫尺，几可触及[ROOT.GetCountry.GetRuler.GetName]之指尖。让吾等切勿迟延获取不朽之荣耀，而应摧毁[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏一统中原之最后障碍！\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 zhao_missions_task_23:0 "赵国军事学院"
 zhao_missions_task_23_DESC:0 "为保存我胜利之师多年来积累之宝贵军事知识，吾等已决定兴建一座#E赵国军事学院#!，以便将这些奥秘传授予下一代赵国武士。\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 zhao_missions_task_23_enable_decision_academy:0 "我们将解锁#Y 赵国军事学院#!决议。"
 zhao_missions_task_24:0 "赵朝"
 zhao_missions_task_24_DESC:0 "仰赖[ROOT.GetCountry.GetRuler.GetName]之卓越功绩，[GetCountry('ZHA').GetName]立于权势之巅，黄金盛世确已降临我民。吾皇[ROOT.GetCountry.GetRuler.GetFirstName]万岁，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王朝万岁！\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 zhao_missions_task_2_DESC:0 "纵使百般示好，[GetCharacter('(int32)629').GetName]仍是一个必须以某种方式处理之问题。在[ROOT.GetCountry.GetRuler.GetName]安心推进[ROOT.GetCountry.GetRuler.GetHerHis]之大计之前，朝中任何异议皆须噤声——[GetCharacter('(int32)629').GetName]之行径已令[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏蒙羞。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 zhao_missions_task_3:0 "邯郸军营"
 zhao_missions_task_3_DESC:0 "吾等与诸多邻邦交兵，然无一如[GetCountry('QIN').GetName]那般咄咄逼人、威胁深重，彼等仍为心腹之患。若尚存组建足以与敌抗衡之大军之念想，则吾等必须修建军营、广发募兵之令。\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 zhao_missions_task_4:0 "北方边陲"
 zhao_missions_task_4_DESC:0 "北方边疆乃凶险之地，开阔之草原旋即化为严酷之荒漠，其间出没之盗贼马背领主，令文明世界之百姓苦不堪言。吾等必须以修筑充足之防御工事自保，然此不可仅为区区前哨；须成为此地域之文明灯塔，一处我将士甘愿以生命捍卫之地。\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 zhao_missions_task_4_wuyuan_area_fort_civ_20:0 "我们在五原地区有一座要塞且文明度至少20。"
 zhao_missions_task_5:0 "蛮族贡赋"
 zhao_missions_task_5_DESC:0 "于我众人皆有利者，吾等眼下与[GetCountry('LNH').GetName]、[GetCountry('HEZ').GetName]及[GetCountry('LOF').GetName]保持良好之关系——我诸族之民相处融洽，贸易与往来畅通无阻。然此关系可否更进一步？我对此等蛮族毕竟大有可为，且彼等无论如何皆须顺应我之所决。\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 zhao_missions_task_5_levy_or_feudatories:0 "吾等将可在征召兵加成与加强部族附庸整合之间做出选择。"
 zhao_missions_task_6:0 "赵国成语"
 zhao_missions_task_6_DESC:0 "百姓之言谈与风尚，已然俘获诗家之心，彼等将吾等某些传统谚语与习俗收集起来，并使之以歌谣传唱而永存不朽。举国上下如今皆熟知我所谓之#Y赵氏成语#!，视其为值得赞誉与效法之民间智慧源泉——吾等亦深以为然。\n\n\n\n\n\n\n\n\n\n@tibet_mil11!"
 zhao_missions_task_7:0 "西都"
 zhao_missions_task_7_DESC:0 "虽都城已迁至[ROOT.GetCountry.GetCapital.GetName]，然吾等并无理由忘却昔日之家园——[ROOT.GetCountry.GetName]之第二城，[GetProvince('(int32)8636').GetName]。吾等应将国家之资源倾注于此第二都城——诸神必将因吾等恪守昔日之承诺而赐福于我等。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 zhao_missions_task_8:0 "终结中山"
 zhao_missions_task_8_DESC:0 "吾等已决定，对[GetCountry('ZHS').GetName]这块飞地之容忍已足够之久，是时候终结彼等脱离[ROOT.GetCountry.GetAdjective]而独立之妄想。\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 zhao_missions_task_8_claims_tt:0 "吾等将获得对#Y邯郸#!、#Y魏#!、#Y河内#!、#Y上党#!及#Y河东#!诸郡之宣称。"
 zhao_missions_task_9:0 "稳固继承"
 zhao_missions_task_9_DESC:0 "是时矣，[ROOT.GetCountry.GetRuler.GetName]当行[ROOT.GetCountry.GetRuler.GetSheHe]暗中素怀之心愿；[ROOT.GetCountry.GetRuler.GetFirstName]已决意自王位退下，将统治[ROOT.GetCountry.GetName]之权柄授予[GetCharacter('(int32)629').GetName]。\n\n\n\n\n\n\n\n\n\n@china_mil8!"

 NABATEAN_SUBJECT:0 "以东"
 NABATEAN_SUBJECT_ADJECTIVE:0 "以东"
 betyls_of_petra:0 "佩特拉圣石"
 bitumen_mining:0 "沥青开采"
 blood_kings:0 "王者之血"
 blood_of_aretid:0 "阿瑞塔斯的血脉"
 blood_of_obodid:0 "Obodas的血"
 caravan_routes:0 "商队路线"
 cistern_routes:0 "蓄水池之路"
 city_of_arabs:0 "阿拉伯人的城市"
 converting_sinai:0 "使西奈皈依"
 cosmopolitian_design:0 "大都会设计"
 desert_gem:0 "叙利亚沙漠"
 desert_hills_combat_bonus:0 "沙漠山庄战斗奖励"
 found_city:0 "城市根基"
 frankincense_arteries:0 "乳香工艺品"
 garden_tomb:0 "花园之墓"
 garden_tomb_desc:0 "这是一座为纳巴泰贵族设计的精美墓穴。"
 gazan_trade:0 "加沙贸易路线"
 gem_philistia:0 "非利士的宝石"
 hidden_cisterns:0 "隐蔽的蓄水池"
 hooves_of_kurnub:0 "库努布的蹄子"
 incense_road_subject:0 "沉香贸易"
 leader_of_arabs:0 "阿拉伯人的领袖"
 lion_fountain:0 "狮子喷泉"
 lion_fountain_desc:0 "一个狮头人身的大喷泉，张开的嘴里喷出一股水流。"
 me_nabatea_1.a:0 "我们尊贵的客人将永远不会缺水"
 me_nabatea_10.a:0 "无论我们走到哪里，纳巴泰人都会带来和平与繁荣。"
 me_nabatea_10_desc:0 "[GetProvince('(int32)6590').GetName]靠近Mediterranean，拥有理想的港口位置，已被证明是[ROOT.GetCountry.GetAdjective]国拥有的一个受欢迎的补充。由于[ROOT.GetCountry.GetRuler.GetName]的努力，消除了我们最近与这个城市的前主人的冲突所留下的污点，它已被称为#Y The Gem of Philistia#!，证明了我们对该地区及其自然资源的精心管理。"
 me_nabatea_10_title:0 "加沙贸易路线"
 me_nabatea_11.a:0 "最终，我们的漫游将停止……但现在，我们必须继续前进。"
 me_nabatea_11_desc:0 "虽然#E 西奈半岛#!有危险之地的名声，不欢迎陌生人，地貌严酷，容易迷路，但我们发现事实恰恰相反。现在，我们的[ROOT.GetCountry.GetAdjective]征兵已经给这个荒芜的地区带来了和平，我们发现它是一个建造城市和工场的最优秀的地方。我们是幸运的。"
 me_nabatea_11_title:0 "漫游Sinai的人"
 me_nabatea_12.a:0 "诸神向我们表明，荣耀是我们的。"
 me_nabatea_12_desc:0 "我们很高兴向你报告，[ROOT.GetCountry.GetRuler.GetName]，我们已经粉碎了#E 基达尔#!的部队，轻松地削弱了他们至少一代人的力量——我们已经彻底摧毁了他们，把他们赶出了战场，用他们士兵的血浸透了沙漠沙地。\n\n我们的骆驼在战斗中打得特别好，在沙丘中展示了防御性的机动性——当然不是一件容易的事。"
 me_nabatea_12_title:0 "被削弱的基达尔"
 me_nabatea_13.a:0 "只有时间会告诉我们谁能登上最高的位置。"
 me_nabatea_13_desc:0 "虽然我们在[ROOT.GetCountry.GetName]中确实崇拜许多外国的神，但也有一个围绕王室的崇拜。由于我们的许多统治者已经离开了人世，在众神中占据了他们应有的位置，因此，众所周知的国王崇拜在人们心中是非常重要的。\n\n我们目前的统治者，[ROOT.GetCountry.GetRuler.GetName]，像其他每一个有一天会领导我们国家的人一样，也渴望有一天能加入这个令人尊敬的神殿。"
 me_nabatea_13_title:0 "国王崇拜"
 me_nabatea_14.a:0 "我们希望杜尔纳塔在未来的许多年里能够蓬勃发展。"
 me_nabatea_14_desc:0 "随着时间的推移，[GetProvince('(int32)4721').GetName]已经成长为一个值得欢呼的东西，一个时代的成就；它不仅是#Y Atarsamain#!的朝圣者前往祭奠的地方，而且其令人印象深刻的防御设施为它赢得了\"Arabians的堡垒 \"的绰号。"
 me_nabatea_14_title:0 "阿拉伯的堡垒"
 me_nabatea_15.a:0 "这里欢迎所有的神、人民和硬币。"
 me_nabatea_15_desc:0 "由于[GetProvince('(int32)729').GetName]的建筑风格现代化正在进行的令人印象深刻的努力，我们的城市正在成为一个对所有民族都很欢迎、宽容的地方而闻名。这种声誉无疑被散布在拉格玛各地的奇妙的寺庙所加强，提醒所有人在我们的土地上可以安全地随心所欲地进行崇拜。"
 me_nabatea_15_title:0 "世界性的寺庙设计"
 me_nabatea_16.a:0 "我们应向西走，进入下埃及。"
 me_nabatea_16.b:0 "我们将向东走，进入迦南和叙利亚。"
 me_nabatea_16_desc:0 "我们的水手和海军陆战队正咬紧牙关，急切地想赢得他们的陆军兄弟给[ROOT.GetCountry.GetName]带来的一些荣耀，我们很高兴地报告，现在是释放我们可怕的袭击者的时候了。我们应该把我们的掠夺舰队引向何处？他们将立即起航，毫不拖延。"
 me_nabatea_16_title:0 "纳巴泰海军突袭"
 me_nabatea_17.a:0 "我很感谢你告诉我这些好事情"
 me_nabatea_17_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，今天有很多事情要讨论，但在我们开始讨论困难的事情之前，我们应该以轻松的口吻开始今天的工作；我们在#E 内盖夫#!的倡议，就像你正确猜测的那样，正在得到回报；当地的食物来源丰富，吸引了来自远方的定居者。[ROOT.GetCountry.GetName]的人民有很多值得感激的地方。"
 me_nabatea_17_title:0 "内盖夫的市场"
 me_nabatea_18.a:0 "让我们开始与这位商人对话"
 me_nabatea_18_desc:0 "最近，一位来自#E 西奈#!的奴隶主找到了我们，他急于为他心中的一个雄心勃勃的项目购买奴隶。因为这个人有无可挑剔的推荐信，而且是个贵族和富人，我们同意听取他的建议。"
 me_nabatea_18_title:0 "西奈奴隶贸易"
 me_nabatea_19.a:0 "大马士革将是一朵盛开在沙漠中的玫瑰"
 me_nabatea_19_desc:0 "尽管无数军队曾踏过#E 豪兰#!的沙丘与旱原，但我们纳巴泰人已成为这片土地的新主人，并计划永久驻守。诚然，让[GetProvince('(int32)750').GetName]成为我们对这片区域规划的实体见证。"
 me_nabatea_19_title:0 "控制豪兰"
 me_nabatea_1_desc:0 "当商人们在[ROOT.GetCountry.GetAdjective]的土地上旅行时，他们遵循一条可预测的路线，在严酷的沙漠环境中是否有水是他们关心的次要问题——利润，一如既往，仍然是激励因素。\n\n但是，由于[ROOT.GetCountry.GetRuler.GetName]的关心，他命令我们大大扩展储存水的基础设施，商人们遵循被称为\"#E 蓄水池之路#!\"的路线，知道他们干涸的喉咙可以从我们慷慨的井中深深喝下去。"
 me_nabatea_1_title:0 "蓄水池之路"
 me_nabatea_2.a:0 "在喧闹的欢呼声中，聚集在一起的人们站了起来。"
 me_nabatea_20.a:0 "我们期待着能尽快听到好消息"
 me_nabatea_20_desc:0 "[ROOT.GetCountry.GetRuler.GetName]因其机智地处理给[ROOT.GetCountry.GetName]带来财富的香火贸易而被远近称颂，他宣布了扩大[ROOT.GetCountry.GetAdjective]在#E 阿拉比亚#!的存在的计划，一旦天气允许，他将派遣舰队南下马卡拉巴、咖耳纳、马里亚巴和塔姆纳。"
 me_nabatea_20_title:0 "主宰着熏香之路"
 me_nabatea_21.a:0 "这将使我们能够立即对人民的需求作出反应。"
 me_nabatea_21_desc:0 "虽然有些人认为[ROOT.GetCountry.GetRuler.GetName]的建设计划的相关费用过高，但没有人可以否认[ROOT.GetCountry.GetRuler.GetSheHe]所取得的成就的威严--不亚于创建一个新的城市，一个可以与我们在[ROOT.GetCountry.GetCapital.GetName]的大量财产相媲美的城市。\n\n[ROOT.GetCountry.GetAdjective]的权力所在地将不再集中在一个城镇或定居点，因为我们正处于姐妹首都的时代；我们广阔的领土需要两个管理中心。"
 me_nabatea_21_title:0 "姐妹首都"
 me_nabatea_22.a:0 "我们声称与Aretas家族有亲属关系，这是众所周知的。"
 me_nabatea_22.b:0 "我们与Obodas家族的联系很深。"
 me_nabatea_22_desc:0 "[ROOT.GetCountry.GetRulerTitle]的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]，[ROOT.GetCountry.GetRuler.GetName]的#Y Philopatris#!是如此的有声望，为了表彰[ROOT.GetCountry.GetRuler.GetSheHe]为[ROOT.GetCountry.GetName]的人民所做的一切，\n\n除了被赋予这个宏伟的头衔，我们的[ROOT.GetCountry.GetRulerTitle]可以正式宣称自己是几个世纪以来主宰[ROOT.GetCountry.GetAdjective]政治的著名家族之一的遗产。[ROOT.GetCountry.GetRuler.GetFirstName]现在必须决定是与以财富和荣誉著称的#Y Aretas#!联系，还是与袭击高地的沙漠勇士#Y Obodas#!联系。"
 me_nabatea_22_title:0 "国王之血"
 me_nabatea_23.a:0 "我们被我们广泛的贸易网络所祝福，无法衡量。"
 me_nabatea_23_desc:0 "由于我们的商队给[ROOT.GetCountry.GetCapital.GetName]带来了源源不断的贸易，我们的国库从未如此充实，我们的人民也从未如此快乐--这真是一个让所有人都高兴的局面。\n\n市场上囤积着各种稀有的贸易品，商业的声音早晚都充斥着城市的街道。每个人都同意，[ROOT.GetCountry.GetRuler.GetName]是单枪匹马的财政暴利。"
 me_nabatea_23_title:0 "商队"
 me_nabatea_24.a:0 "把你们能带的东西都带回来，然后再带一些。"
 me_nabatea_24_desc:0 "我们的水手，现在他们已经有了一点经验，正在乞求放开他们的束缚，要求官方允许他们在解放军能带他们去的地方进行掠夺。\n\n作为回应，[ROOT.GetCountry.GetRuler.GetName]已经投资于我们的海军，为我们的人装备了捕捉奴隶的必要工具，并委托我们的船长在必要时雇用雇佣兵和海盗的权力。"
 me_nabatea_24_title:0 "在血泊中航行"
 me_nabatea_25.a:0 "把这个傻瓜带到我这里来，这样我们就可以把一切都弄清楚了。"
 me_nabatea_25_desc:0 "[ROOT.GetCountry.GetCapital.GetName]传来消息，有商人遇见一名半疯的旅人，正坐在十字路口满怀期待地坐着。此人喋喋不休地谈论着#E 以东人#!并声称有关于他们的消息要传达给[ROOT.GetCountry.GetRuler.GetName]。"
 me_nabatea_25_title:0 "以东人的命运"
 me_nabatea_26.a:0 "也许有一天，我们将亲自访问这座新城市。"
 me_nabatea_26_desc:0 "我们在整个#E 阿拉伯#!的一连串胜利使[GetProvince('(int32)4721').GetName]的城市自行发展起来，使半岛内部的人们能够方便地进入大海。杜纳塔主要以其市场而闻名，其市场可与[ROOT.GetCountry.GetCapital.GetName]的一些市场相媲美，杜纳塔是[ROOT.GetCountry.GetAdjective]独创性和力量展示的一个闪亮的例子；从#E 阿拉伯湾#!的海岸到#E 奈富德沙漠#!的风吹沙丘，[ROOT.GetCountry.GetName]的明星闪耀着。"
 me_nabatea_26_title:0 "从海洋到尼法德"
 me_nabatea_27.a:0 "我们很感激听到我们的人民忠实于古老的方式"
 me_nabatea_27_desc:0 "我们#E 神王#!的崇拜者，他们的名字和事迹远远超出了[ROOT.GetCountry.GetAdjective]的边界，经常访问我们的城市，带着礼物和祭品来表示他们的敬意，还有一些人甚至自掏腰包，在崇拜神灵的地方建造纪念碑。 \n\n有一个这样的朝圣者花钱请石匠在一块大石板上雕刻了一个#Y 圣石#!，即神灵的临在，并慷慨地将这些宏伟的作品赠送给[ROOT.GetCountry.GetName]的人民。"
 me_nabatea_27_title:0 "国王的陵墓"
 me_nabatea_28.a:0 "愿这个北方的首都保护虔诚的人，无论是Nabatean还是外国出生的人"
 me_nabatea_28_desc:0 "每年，前往[GetProvince('(int32)734').GetName]的旅行者人数都在增加，前来朝拜由[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族新建的#E 杜沙拉`阿拉神殿#!。#E 亚细亚#!、#E 阿拉伯#!和#E 阿非利加#!各地的信徒都被吸引过来。\n\n许多朝圣者一旦有幸了解了玻斯特拉的街道和商店，就决定留在这里，很少有人能责怪他们连根拔起，在这个[ROOT.GetCountry.GetAdjective]人的北方首都生活。"
 me_nabatea_28_title:0 "玻斯特拉神庙"
 me_nabatea_29.a:0 "我们不会再容忍这些侮辱了……"
 me_nabatea_29_desc:0 "[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]们和哈斯蒙尼人之间的竞争开始失去控制——很难相信这些大家族的首领曾被视为朋友。"
 me_nabatea_29_title:0 "哈斯蒙尼的竞争"
 me_nabatea_2_desc:0 "今天，太阳无情地炙烤着[ROOT.GetCountry.GetCapital.GetName]，但炎热的天气丝毫不妨碍[ROOT.GetCountry.GetAdjective]人民的公务。现在，[ROOT.GetCountry.GetRuler.GetName]正在发表慷慨激昂的演讲，勾勒出[ROOT.GetCountry.GetRuler.GetHerHis]对未来的愿景。\n\n“一石一石，一砖一砖，一城一城，我们将摧毁我们的敌人，建立一个比金字塔还要高耸的社会，一个甚至能在[GetProvince('(int32)918').GetName]的城门前投下长长阴影的社会”。然而，我一个人做不到，我需要你们的全力支持——你们支持我吗，[ROOT.GetCountry.GetName]？"
 me_nabatea_2_title:0 "巩固王国"
 me_nabatea_3.a:0 "让所有的神灵都快乐起来，向我们展示他们的面容。"
 me_nabatea_30.a:0 "这个宝藏只属于[ROOT.GetCountry.GetAdjective]国家"
 me_nabatea_30_desc:0 "我们最近在我们的一个省份发现了大量的#Y 沥青#!矿藏——你能相信这一幸运之举吗，[ROOT.GetCountry.GetRuler.GetName]？我们已经派奴隶去协助开采这种珍贵的物品，但我们必须小心，不要让我们的邻居知道我们的发现。"
 me_nabatea_30_title:0 "第一次石油战争"
 me_nabatea_31.a:0 "一如既往，我所做的一切都是为了纳巴泰。"
 me_nabatea_31_desc:0 "事实证明，将#E 亚兰#!人纳入我们的[ROOT.GetCountry.GetAdjective]社会的决定是一个明智的决定。这不仅可以减轻来自被剥夺权利的下层阶级的政治暴力威胁，而且我们在政治上也从这一巧妙的手法中获益，为我们的国家带来荣耀，并增加了[ROOT.GetCountry.GetRuler.GetName]周围不可战胜的光环。"
 me_nabatea_31_title:0 "亚兰社会"
 me_nabatea_32.a:0 "我国人民的涌入将有助于同化当地人"
 me_nabatea_32_desc:0 "一支名副其实的学者、知识分子和哲学家大军跟在我们的军队后面，进入#E Syrian Desert#!，希望在Levant的大城市为自己建立永久的家园。Syria长期以来一直被誉为一个博学的地方，一个来自东方和西方传统的大熔炉，它成为我国人民中最有学问的人的热门目的地并不奇怪。"
 me_nabatea_32_title:0 "叙利亚沙漠"
 me_nabatea_33.a:0 "祈求我们不要让我们的眼睛瞥见你的财产。"
 me_nabatea_33_desc:0 "[ROOT.GetCountry.GetName]理所当然地被称为'Leader of the Arabs'，这个非官方的称号，实际上削弱了纳贝特人的惊人成就。从他们豪华的首都[ROOT.GetCountry.GetCapital.GetName]，他们城市皇冠上的宝石，他们统治着一个巨大的帝国，连接着各大洲和王国。他们因其奇特的贸易商品而受到喜爱，同时也因其破坏性的军队而受到憎恨和恐惧，他们无人能敌，对敌人毫不留情。\n\n当所有的事情都说过和做过之后，Nabatea站在无人挑战的地方--他们看到的一切的领主。"
 me_nabatea_33_title:0 "阿拉伯人的领袖"
 me_nabatea_34.a:0 "什么都不做；我们将返回家园"
 me_nabatea_34.a.tt:0 "这将结束事件链，损害你的人气。"
 me_nabatea_34.b:0 "企图夺取舰队"
 me_nabatea_34.b.tt:0 "我们可能会俘获一些船只，但也有可能会有一些船只逃跑。"
 me_nabatea_34.c:0 "掠夺，然后击沉舰队"
 me_nabatea_34.c.tt:0 "我们会按你说的做，但有一个小风险，有些人会逃跑"
 me_nabatea_34_desc:0 "我们大胆的[ROOT.GetCountry.GetAdjective]袭击者收到了来自诸神的礼物--在向西的冒险中，他们不仅避开了敌人，而且似乎偶然发现了一支无人看守的小型#E 托勒密#!舰队。这些外国船只停靠在码头上，但没有人看守港口——这会不会是一场伏击？为什么这些船会被这样遗弃？\n\n我们现在必须决定怎么做，但要知道，如果我们突袭，无疑会引起当地人的注意，他们会抵抗我们的人。"
 me_nabatea_34_title:0 "前往西方的旅行"
 me_nabatea_35.a:0 "向士兵们发放捐款并感谢他们"
 me_nabatea_35_desc:0 "夺取一些船和一些钱的事情……"
 me_nabatea_35_title:0 "夺取商船队"
 me_nabatea_36.a:0 "我们应该确保我们的边境要塞都有驻军"
 me_nabatea_36.a.tt:0 "托勒密人有可能因此而向我们宣战......"
 me_nabatea_36_desc:0 "嗯，今天有一个坏消息，是的，是关于我们的突击船去了。我们不知怎么搞的，把赠送给我们的轻松胜利给忽悠了，我们的水手不仅没有完成所有的目标，而且还引起了Egyptian篡位者的注意，他们现在威胁要为我们的大胆背叛行为进行惩罚。"
 me_nabatea_36_title:0 "托勒密的愤怒"
 me_nabatea_37.a:0 "为我们至高无上的胜利干杯!"
 me_nabatea_37_desc:0 "我们的水手成功地从Ptolemaic船上缴获了大量的金币和银币，然后将它们全部击沉--我们在这次遭遇战中没有损失一个人，让我们的敌人感到非常尴尬。\n\n我们的整个海军都受到了这次传奇式突袭的鼓舞，现在很多人都认为我们的舰队是整个#E Mediterranean#!中最强大的。"
 me_nabatea_37_title:0 "托勒密船只被掠夺"
 me_nabatea_38.a:0 "如果有机会，我们会再做一次。"
 me_nabatea_38.a.tt:0 "托勒密人有可能因此而向我们宣战......"
 me_nabatea_38_desc:0 "我们的人成功地摧毁了他们遇到的托勒密舰队的大部分，但是，正如所预料的那样，有几个人设法逃脱了，并且已经扬长而去，毫无疑问，他们把我们攻击的消息传给了所有愿意听的人。"
 me_nabatea_38_title:0 "托勒密的愤怒"
 me_nabatea_39.a:0 "我们将击沉他们的舰队，这是我们占领他们土地的前奏！"
 me_nabatea_39_desc:0 "甚至在托勒密外交官带着他们的信息到达[ROOT.GetCountry.GetCapital.GetName]之前，我们的军事顾问已经告诉了我们一切；埃及军队在我们的边界集结，可怕的雇佣兵团已经被雇用，他们的贵族精英骑在他们的征兵队伍前面。不可否认即将发生的事情——战争来了!"
 me_nabatea_39_title:0 "托勒密人已经宣战了"
 me_nabatea_3_desc:0 "来到[ROOT.GetCountry.GetCapital.GetName]的外国区的游客经常惊讶地看到供奉各种神灵的寺庙和神龛，而这些神灵并不是我们#E Arabic#!万神殿的一部分，然而，当涉及到对我们祖先未知的神灵的崇拜时，我们认为允许一种放任的气氛没有错。"
 me_nabatea_3_title:0 "对影响开放"
 me_nabatea_4.a:0 "我们对目前的情况很满意；什么也不改变。"
 me_nabatea_4.b:0 "阿多瓦是一个很好的选择，我认为"
 me_nabatea_4.c:0 "巴克拉纳扎将是养骆驼的好地方"
 me_nabatea_40.a:0 "让我们回头……"
 me_nabatea_40.a.tt:0 "这将结束事件链"
 me_nabatea_40.b:0 "我们将攻击从#E 加沙#!省下水的船只。"
 me_nabatea_40.b.tt:0 "这支宝藏舰队属于#Y [gaza_owner_scope.GetName]#!——任何敌对行动都可能造成影响……"
 me_nabatea_40.c:0 "据传，#E 堤洛斯#!很富有……我们将夺取他们的船只。"
 me_nabatea_40.c.tt:0 "这支宝藏舰队属于#Y [tyros_owner_scope.GetName]#!——任何敌对行动都可能导致后果......"
 me_nabatea_40_desc:0 "我们的舰队在东方有很好的运气，没有被许多可怕的国家的游动舰队发现，这些国家在这些有争议的地方互相争夺霸权。 \n\n在了解了贸易船的节奏后，我们的海军将领认为，我们可以对运载财宝的船只进行突袭——如果神灵与我们同在的话，那些准备给继业者及其后裔的税收和礼物最终会进入我们自己的国库。\n\n我们应谨记，此类海盗行为被视为宣战行为……但威胁是否足以让我们止步？"
 me_nabatea_40_title:0 "前往东方的旅行"
 me_nabatea_41.a:0 "海洋之神与我们一起航行"
 me_nabatea_41_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们在#E 加沙#!的完全成功的报告开始传回国内。我们不仅缴获了许多金银财宝，而且还缴获了几艘船！"
 me_nabatea_41_title:0 "捕获来自加沙的商船队"
 me_nabatea_42.a:0 "Bah! 如果我亲自去了，事情就不一样了"
 me_nabatea_42.a.tt:0 "这有可能会导致与#Y [gaza_owner_scope.GetName]#!的战争"
 me_nabatea_42_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们夺取加沙贸易船的尝试以灾难告终。我们不仅没有成功，而且大家都知道我们试图攻击一个和平的船队……可能很快就会有一些愤怒的外交官在[ROOT.GetCountry.GetCapital.GetName]要求回答一些棘手的问题。"
 me_nabatea_42_title:0 "加沙船只逃脱"
 me_nabatea_43.a:0 "我们将取得胜利，永远不要害怕......"
 me_nabatea_43_desc:0 "我们应该知道，我们在#E 加沙#!的滑稽行为会引起反响，现在他们来了；#Y [gaza_owner_scope.GetName]#!已经向我们宣战……"
 me_nabatea_43_title:0 "战争！"
 me_nabatea_44.a:0 "我们将向诸神献祭，感谢他们。"
 me_nabatea_44_desc:0 "我们大获全胜！我们的袭击者从#E 堤洛斯#!驶来的船只上缴获了他们所要的一切，并且毫发无伤地离开。出其不意的因素确实为我们的水手们带来了胜利。"
 me_nabatea_44_title:0 "突袭来自堤洛斯的商船队"
 me_nabatea_45.a:0 "*咽口水*"
 me_nabatea_45.a.tt:0 "这有可能会导致与#Y [tyros_owner_scope.GetName]#!的战争"
 me_nabatea_45_desc:0 "好吧，我们派去突袭堤洛斯附近的人失败了，搞砸了他们的整个任务。堤洛斯人在几英里外就看到了我们的到来，他们的贸易船没有离开港口，而是派出了战舰……"
 me_nabatea_45_title:0 "在堤洛斯的失败"
 me_nabatea_46.a:0 "集结军队，捍卫我们的荣誉!"
 me_nabatea_46_desc:0 "我们突袭堤洛斯的企图会使事情复杂化，这并不奇怪——现在，#Y [tyros_owner_scope.GetName]#!已经宣战，我们许多无辜的人将为我们犯下的自私和贪婪的错误而死。"
 me_nabatea_46_title:0 "战争！"
 me_nabatea_47.a:0 "告诉他们制作香"
 me_nabatea_47.b:0 "没药生产会很适合他们"
 me_nabatea_47.c:0 "让他们保持原样"
 me_nabatea_47_desc:0 "勤劳的#Y [GetProvince('(int32)695').GetName]#!居民要求我们允许他们专门生产芳香商品，认为他们未来的繁荣与芳香商品的生产有着内在的联系。我们应该允许他们有这个荣誉吗？"
 me_nabatea_47_title:0 "切卢斯的盈余"
 me_nabatea_48.a:0 "沉香在市场上总是能卖到很高的价格。"
 me_nabatea_48.b:0 "我们总是可以使用更多的没药"
 me_nabatea_48.c:0 "一切都很好，因为它已经是这样了"
 me_nabatea_48_desc:0 "来自#Y [GetProvince('(int32)699').GetName]#!的人向我们提出了一个奇怪的建议；他们自己囤积了资源，并请求我们建立生产香的工场。\n\n他们谦卑地请求我们选择他们应该专注于哪种特产；对于[ROOT.GetCountry.GetRuler.GetName]来说，这是一个巨大的荣誉，所有人都同意。"
 me_nabatea_48_title:0 "阿沃达的盈余"
 me_nabatea_49.a:0 "我认为我们可以制造更多的香。"
 me_nabatea_49.b:0 "我们总是可以使用更多的没药"
 me_nabatea_49.c:0 "让一切都保持现在的状态"
 me_nabatea_49_desc:0 "来自富饶的#[GetProvince('(int32)698').GetName]#!省的消息，那里勤劳的居民向我们请愿，要求有权生产一种专门的贸易品，而不是他们目前生产的东西。你怎么看，我的[ROOT.GetCountry.GetRulerTitle]？"
 me_nabatea_49_title:0 "沙维塔的盈余"
 me_nabatea_4_desc:0 "真的，诸神保佑我们，因为还有什么理由让我们的牧群膨胀，像沙漠的沙子一样充满了大量的人群？实际上，我们手头的骆驼比以往任何时候都多，如果我们选择的话，足够我们建立一个农场来饲养这些野兽。你怎么说，[ROOT.GetCountry.GetRuler.GetName]？"
 me_nabatea_4_title:0 "商队路线"
 me_nabatea_5.a:0 "我们对我们国家之间的友好关系表示感谢。"
 me_nabatea_50.a:0 "让我们送他们三个奴隶"
 me_nabatea_50.a.tt:0 "#Y 3#!奴隶将被送走"
 me_nabatea_50.b:0 "让我们送他们六个奴隶"
 me_nabatea_50.b.tt:0 "#Y 6#! 奴隶将被送走"
 me_nabatea_50.c:0 "让我们送他们一打奴隶"
 me_nabatea_50.c.tt:0 "#Y 12#! 奴隶将被送走"
 me_nabatea_50.d:0 "祝他好运，但不卖给他"
 me_nabatea_50.d.tt:0 "商人感谢我们的时间，离开了。"
 me_nabatea_50_desc:0 "一位来自#E 西奈#!的商人梦想将灌溉渠引入荒地，希望在沙漠中种植农作物，进而维持他从奴隶市场上购买的铜矿工的生计——这是一个雄心勃勃的计划，也许他还能看到它的成果。\n\n这位商人要求我们卖给他一些奴隶，如果我们愿意，他将为他们支付一个公平的市场价格。"
 me_nabatea_50_title:0 "西奈的灌溉问题"
 me_nabatea_51.a:0 "我们拥有一个新课题的几率？五十，五十。"
 me_nabatea_51.b:0 "如果价格合适，我们有可能直接吞并他们......"
 me_nabatea_51.c:0 "实际上，把整个事情取消吧"
 me_nabatea_51_desc:0 "现在我们已经把基达尔削弱到了近乎奴役的状态，有人提议我们派一个特使到他们的残余部队中去。抵抗我们的进步已经被证明是一种愚蠢的行为，他们应该服从，否则他们会被消灭。\n\n如果他们对这个建议有异议，他们可能会这样做，告诉我们的外交官，我们不排除花费一些硬币来润滑车轮……"
 me_nabatea_51_title:0 "被削弱的基达尔"
 me_nabatea_52.a:0 "无论如何，我们都打算这么做"
 me_nabatea_52_desc:0 "来自#E 基达尔#!的绝妙消息，他们同意成为我们的附庸！反过来，他们所要求的是我们在他们的土地上投资，帮助他们变得比现在更强大。当然，这个代价并不低，[ROOT.GetCountry.GetRuler.GetName]!"
 me_nabatea_52_title:0 "基达尔附庸"
 me_nabatea_53.a:0 "在我看来，他们听起来像是天才"
 me_nabatea_53_desc:0 "#E 基达尔#!的聪明程度超过了人们对他们的评价。有些人说他们很笨，无法辨别智慧和愚昧，然而我们可以很容易地说，他们很聪明。\n\n这是为什么呢？他们意识到自己国家的糟糕状况，宁愿把土地直接交给我们，也不愿意作为一个独立的政体存在。"
 me_nabatea_53_title:0 "基达尔吞并"
 me_nabatea_54.a:0 "我想我们至少可以看看价格是多少"
 me_nabatea_54_desc:0 "[ROOT.GetCountry.GetRuler.GetName]几乎没来得及在[GetProvince('(int32)750').GetName]温水洗个热水澡，当地人就开始请愿要求召开个人会议。虽然很多事情都很容易处理或直接驳回，但有一件事特别引起了[ROOT.GetCountry.GetRuler.GetFirstName]的注意；一个以愚昧著称的希腊奴隶贩子路过小镇，说他有来自#E Syria#!的奴隶要出售，质量很好。对于我们的统治者来说，可以安排全境最好的价格。"
 me_nabatea_54_title:0 "控制豪兰"
 me_nabatea_55.a:0 "我们应立即把这个傻瓜赶出城去"
 me_nabatea_55_desc:0 "[ROOT.GetCountry.GetRuler.GetName]正准备去见希腊奴隶主时，[ROOT.GetCountry.GetRuler.GetSheHe]突然停了下来，死死地盯着[ROOT.GetCountry.GetRuler.GetHerHis]。\n\n\"取消会议--我不会向Syria的人民传递我们是来奴役他们的信息。我不在乎这些奴隶的价格有多低......我不会让普通人反对[ROOT.GetCountry.GetName]。"
 me_nabatea_55_title:0 "控制豪兰"
 me_nabatea_56.a:0 "发送授权，将他们全部征服"
 me_nabatea_56_desc:0 "我们派往#E 阿拉伯#!的舰队的第一份报告已经抵达[ROOT.GetCountry.GetCapital.GetName]。远征军的指挥官写道，这些遥远土地上的居民软弱无力，很容易被征服——剩下的就是正式发话了。"
 me_nabatea_56_title:0 "主宰着熏香之路"
 me_nabatea_57.a:0 "我们将善待所有臣服于我们的人"
 me_nabatea_57_desc:0 "从#E 马可拉巴#!统治的前朝已经同意成为我们的臣民，意识到他们将无法对抗我们的军队。目前，我们将共同合作，确保香火贸易的财富和繁荣在所有人之间共享。"
 me_nabatea_57_title:0 "熏香之路的一个附庸"
 me_nabatea_58.a:0 "老实说，这对每个人来说都是可能的最佳结果。"
 me_nabatea_58_desc:0 "#E 卡尔纳#!的领主已经向他们的人民宣布，他们不应该抵抗我们，而应该放下武器，全心全意地接受他们作为我们藩属的新地位——我们碰巧同意这种看法。"
 me_nabatea_58_title:0 "熏香之路的一个附庸"
 me_nabatea_59.a:0 "我们的藩属在香火贸易方面做得很好，你将看到"
 me_nabatea_59_desc:0 "我们庆贺#E 马里亚巴#!的居民选择和平地服从我们的人，意识到对[ROOT.GetCountry.GetName]的战争只会导致他们的毁灭。"
 me_nabatea_59_title:0 "熏香之路的一个附庸"
 me_nabatea_5_desc:0 "我们很高兴地报告，[ROOT.GetCountry.GetRuler.GetName]与#E 犹地亚#!统治者的个人友谊可能比驻扎在边境边的军队更能保护我们的北翼。希望我们的许多地区的敌人会注意到我们的同伴，并在攻击我们的国家时三思而行‑我们不是没有朋友，反而有与我们合作的地区伙伴。"
 me_nabatea_5_title:0 "与犹地亚合作"
 me_nabatea_6.a:0 "不仅如此，我们还将闻到好闻的气味"
 me_nabatea_60.a:0 "我们现在将进一步了解他们"
 me_nabatea_60_desc:0 "来自#E 塔姆纳#!的消息，那个与我们对世界的认识边缘接壤的遥远国度——他们已经同意成为我们的藩属。我们对所谓“熏香之路”的控制越来越完整。"
 me_nabatea_60_title:0 "熏香之路的一个附庸"
 me_nabatea_61.a:0 "诅咒！"
 me_nabatea_61_desc:0 "我们试图和平使香料之路屈服沿线诸国的企图适得其反，如今战争降临！战士路途且艰，但胜利必终归我等！"
 me_nabatea_61_title:0 "熏香之路上的战争"
 me_nabatea_62.a:0 "诅咒！"
 me_nabatea_62_desc:0 "我们试图和平使香料之路屈服沿线诸国的企图适得其反，如今战争降临！我方使者侥幸逃过一劫，如此侮辱定当十倍奉还！"
 me_nabatea_62_title:0 "熏香之路上的战争"
 me_nabatea_63.a:0 "诅咒！"
 me_nabatea_63_desc:0 "我们试图和平使香料之路屈服沿线诸国的企图适得其反，如今战争降临！直到敌土归于我等以前，我们的士兵绝不姑息尔等性命。"
 me_nabatea_63_title:0 "熏香之路上的战争"
 me_nabatea_64.a:0 "诅咒！"
 me_nabatea_64_desc:0 "我们试图和平使香料之路屈服沿线诸国的企图适得其反，如今战争降临！此番战事虽是不幸，然我军终将取得胜利！"
 me_nabatea_64_title:0 "熏香之路上的战争"
 me_nabatea_65.a:0 "我们没有什么可以为他们做的"
 me_nabatea_65.b:0 "为他们留出一些我们的土地"
 me_nabatea_65.c:0 "我们保证为他们征服他们的祖先的土地"
 me_nabatea_65.d:0 "扮演以东"
 me_nabatea_65_desc:0 "声称有来自#E 以东#!的信息的疯子来到了[ROOT.GetCountry.GetCapital.GetName]，立刻向[ROOT.GetCountry.GetAdjective]的人们讲述了他的故事。\n\n许多年前，以东是一个令人敬畏的名字，但是诸神已经抛弃了他们，现在他们没有主人，作为一个贫穷的部落在强邻的腹地漫无目的地流浪。 \n\n尽管他们的力量已经减弱，以东人正在寻找一位恩主，一个愿意恢复他们的土地和他们的荣誉的人。除了忠诚之外，他们目前无法提供任何东西，但他们保证会忠心耿耿，直至死亡。"
 me_nabatea_65_title:0 "以东人的命运"
 me_nabatea_66.a:0 "实际上......算了吧。"
 me_nabatea_66.b:0 "释放#E 以东#!国家"
 me_nabatea_66.b.tt:0 "释放#E 以东#!国家作为我们的藩属"
 me_nabatea_66_desc:0 "现在，我们已经为#E 以东人#!的荣誉报了仇，显然是实现了他们古老的预言，并在这个过程中赢得了他们永恒的敬仰，我们现在必须采取最后一步，给他们我们很久以前承诺的东西；一个属于他们自己的国家。"
 me_nabatea_66_title:0 "以东人的命运"
 me_nabatea_67.a:0 "实际上，我们已经决定不向前推进了——取消一切"
 me_nabatea_67.b:0 "愿战争之神赐予我们的士兵胜利！拿起武器！"
 me_nabatea_67.b.tt:0 "我们将对阿多拉，特索阿和马萨达的所有者#R 宣战#!。"
 me_nabatea_67_desc:0 "现在，我们已经牢牢掌握了一个理由，剩下的就是向那些窃取#E 以东人#!土地的国家宣战——我们离履行誓言又近了一步。"
 me_nabatea_67_title:0 "征服以东人的土地"
 me_nabatea_68.a:0 "时机未到……但很快就会来"
 me_nabatea_68.b:0 "我们将围攻他们的首都，毫不留情。"
 me_nabatea_68_desc:0 "某日清晨，[ROOT.GetCountry.GetRuler.GetName]接获情报：#E 犹太人#!的民兵发动边境突袭，成功劫掠我方牲畜并杀害六名民众，其中多为农人。\n\n视此为挑衅之举，[ROOT.GetCountry.GetRuler.GetFirstName]现须决定我方军力将如何予以反击。"
 me_nabatea_68_title:0 "哈斯蒙尼的竞争"
 me_nabatea_69.a:0 "我们的每个士兵都将捍卫我们所有的一切！"
 me_nabatea_69.a.tt:0 "我们可能很快就将被宣战……"
 me_nabatea_69_desc:0 "我们的敌人已经发现了我们能够生产如此大量的沥青的原因，他们不愿按市场价格购买我们的资源，反而扬言要发动战争，企图从我们手中夺取土地！"
 me_nabatea_69_title:0 "第一次石油战争"
 me_nabatea_6_desc:0 "#E 利雅#!的部队无法阻止我们的征兵队深入到他们的防线后面，划出大片的领土，现在已经成为永久性的[ROOT.GetCountry.GetAdjective]定居点。因为我们现在控制了曾经是利雅精英阶层骄傲的珍贵乳香的来源，也就是他们的诗人所描述的所谓'#E Frankincense Arteries#!'，所以我们可以赚得盆满钵满。\n\n[ROOT.GetCountry.GetRuler.GetName]已经拨出必要的资金，在地下深处建造蓄水池，确保我们的新公民在新家里有充足的水供应。乳香贸易已经为我们做了很多事情。"
 me_nabatea_6_title:0 "乳香之路"
 me_nabatea_7.a:0 "我的名字将像古老的法老一样被永远记住。"
 me_nabatea_70.a:0 "我们将要得胜！"
 me_nabatea_70_desc:0 "[GetProvince('(int32)516').GetName]的军队已离开坚固的堡垒，奔赴纳巴泰腹地，来此寻找惨烈的死亡——让我们用他们儿子的尸体与丈夫的尸骸，来偿还他们背信弃义的宣战！"
 me_nabatea_70_title:0 "第一次石油战争"
 me_nabatea_71.a:0 "我们将战胜敌人，凯旋而归！"
 me_nabatea_71_desc:0 "[GetProvince('(int32)911').GetName]之主的使者带着征服的威胁而来，声称[ROOT.GetCountry.GetName]的沥青资源将归他们所有！准备好我们的军队，抵御这场卑鄙的入侵！"
 me_nabatea_71_title:0 "第一次石油战争"
 me_nabatea_72.a:0 "我们将重新征服我们祖先的家园，使我们的人民重新团结起来。"
 me_nabatea_72_desc:0 "古老的卷轴已经被翻译成[ROOT.GetCountry.GetCapital.GetName]，提供了我们民族最早的叙述，声称苏美尔人和巴比伦人的水井曾经满足了我们祖先的渴求——事实上，我们的祖先正是来自这些地方。\n\n有了这个受神启的故事，我们已经决定应该把目光投向夺回曾经属于我们的东西。"
 me_nabatea_72_title:0 "叙利亚沙漠"
 me_nabatea_7_desc:0 "任何有抱负的建筑师，如果想让自己的名字像伊姆霍特普一样流芳百世，都会研究千年前在#E Egypt#!工作的老大师们的建筑。虽然我们还没有准备好建造我们自己的金字塔，虽然未来是一片荒野，我们将在适当的时候探索，但我们从我们周围的宏伟杰作中获得灵感，并着眼于创造我们自己的杰作。"
 me_nabatea_7_title:0 "游行建筑"
 me_nabatea_8.a:0 "愿诸神保佑我们在未来的日子里取得成功。"
 me_nabatea_8_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]第一次提议建造一支庞大的舰队时，人们认为组建一支舰队有双重目的；将我们的贸易品运送到我们的人民从未到达过的遥远的港口，同时也作为袭击和掠夺我们敌人海岸的船只，目的是在他们不设防的城市中捕获奴隶。"
 me_nabatea_8_title:0 "水上大篷车"
 me_nabatea_9.a:0 "在沙漠中奔跑是对我们的动物的良好训练"
 me_nabatea_9_desc:0 "经过[GetProvince('(int32)700').GetName]省的陌生人往往会惊讶地发现，当地有一种健壮的马种--因为在这样一片无情的土地上，有被沙子吹打过的山丘和峭壁，怎么会产生如此壮丽的骏马？然而结果是不言而喻的--你很难在方圆千里内找到更好的马匹。"
 me_nabatea_9_title:0 "库努布的蹄子"
 nabatea_mission_01:0 "海市蜃楼的建设者"
 nabatea_mission_01_BUTTON_DETAILS:0 "海市蜃楼的建设者"
 nabatea_mission_01_BUTTON_TOOLTIP:0 "欢迎来到纳巴泰，朋友..."
 nabatea_mission_01_CRITERIA_DESCRIPTION:0 "一旦我们征服我们的邻国，将我们的霸权延伸到#E 叙利亚沙漠#!以北，并建立一个辉煌的文明与我们的同行者竞争荣耀，该使命就会被认为完成。"
 nabatea_mission_01_DESCRIPTION:0 "烈日直射#E 纳巴泰人#!居住的那尘土飞扬的沙丘与平原上，沙漠之风也无法缓解炙烤着破碎土地上的酷热。\n\n这片干燥而荒芜的土地上，沙丘延伸到地平线之外，超越了人类想象的极限，人们可以跟随着骆驼队一个拉着一个前进，来到我们人民居住的僻静的绿洲，砂岩所铸的防御工事似乎从未知处拔地而起，簇拥在供养我们人民的生命之水周围。\n\n你的双眼没有欺骗你，旅行者，你们看到的不是海市蜃楼，而是一个强大国家的诞生之地。"
 nabatea_mission_01_task_01:0 "蓄水池之路"
 nabatea_mission_01_task_01_DESC:0 "我们的土地上水资源的相对匮乏不妨碍我们文明的发展与扩张。而这意味着我们必须采取额外措施来确保我们的水源供应。发展各省基础设施，特别是建设蓄水池，是我们必须集中注意力完成这一项重要任务。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 nabatea_mission_01_task_02:0 "巩固王国"
 nabatea_mission_01_task_02_DESC:0 "在我们把目光投向邻国的领土前，谨慎的做法是现巩固国内的局势。在我们希望征服任何外国领土前，必须先巩固我们的王国。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 nabatea_mission_01_task_03:0 "接受影响"
 nabatea_mission_01_task_03_DESC:0 "不要让任何指责我们排外或是狭隘，或是把我们的头埋在沙中，忽视生活和聚居在我们城市中的不同民族。我们应该接纳这些各有不同的影响，创造一个令人惊叹的文化嵌合体，并在[ROOT.GetCountry.GetName]茁壮成长。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 nabatea_mission_01_task_03_tt_a:0 "[GetProvince('(int32)729').GetName]拥有至少50信奉#Y 阿拉伯多神教#!的人口。"
 nabatea_mission_01_task_03_tt_b:0 "[GetProvince('(int32)729').GetName]拥有至少50信奉#Y 迦南多神教#!的人口。"
 nabatea_mission_01_task_03_tt_c:0 "[GetProvince('(int32)729').GetName]拥有至少50信奉#Y 希腊多神教#!的人口。"
 nabatea_mission_01_task_04:0 "商队路线"
 nabatea_mission_01_task_04_DESC:0 "众所周知，我们的土地正好位于商队的贸易路线上，骆驼，沙漠中的船只，为我们的城市带来源源不断的货物和黄金。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!。"
 nabatea_mission_01_task_05:0 "与犹地亚同行"
 nabatea_mission_01_task_05_DESC:0 "#E 犹地亚#!，我们北方的国家，与我们处境类似；周围都是更广阔更强大的敌人，他们正准备伺机吞灭我们。意识到共同的危险处境，也许是时候伸出友谊之手？我们可以得到一切，而无一物可失去。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 nabatea_mission_01_task_06:0 "乳香的动脉"
 nabatea_mission_01_task_06_DESC:0 "在#E 阿拉伯#!生产的香被所有国家高度重视，特别是乳香使我们商人的国库充满了金银财宝。但众所周知，如果我们直接拥有这些领土，我们将获得更大的利润……\n\n\n\n\n\n\n\n\n\n@egypt_mil8!。"
 nabatea_mission_01_task_07:0 "行列建筑"
 nabatea_mission_01_task_07_DESC:0 "如果我们能增加我们的知识，拥抱数学研究，同时保留我们对个别信仰的宽容态度，我们的工程师相信，他们将能够建造建筑奇迹，这是我们在[ROOT.GetCountry.GetName]内从未见过的。\n\n\n\n\n\n\n\n\n\n@greek_mil3!@greek_mil3!。"
 nabatea_mission_01_task_08:0 "傍水商队"
 nabatea_mission_01_task_08_DESC:0 "[GetProvince('(int32)4602').GetName]，像它一样完美地坐落在#E Sinus Arabicus#!的海岸边，将是一个建造港口的杰出地点。而且，我们不要忘记[GetProvince('(int32)704').GetName]，另一个吉祥的建筑地点。通过投资于我们的海军能力，我们的商人......和奴隶袭击者......将能够相应地扩大他们的影响力。 \n\n\n\n\n\n\n\n\n\n@egypt_mil22!。"
 nabatea_mission_01_task_08_tt:0 "#Y Nabatea#!必须拥有一支至少有#Y 30 Liburnians#!的海军。"
 nabatea_mission_01_task_08_tt_2:0 "#Y Nabatea#!将获得#Y Slave Raid#!的能力。"
 nabatea_mission_01_task_09:0 "库努布的蹄子"
 nabatea_mission_01_task_09_DESC:0 "尽管[GetProvince('(int32)700').GetName]省目前生产精美的皮革，但有人向我们提出了一个奇怪的想法，这个想法听起来很有前途--如果我们投资建设一个城市，让上层社会的人在那里居住，我们就可以很容易地在附近的沙漠山上训练马匹。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 nabatea_mission_01_task_09_tt:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 5#!名贵族@nobles!\n。"
 nabatea_mission_01_task_09_tt_1:0 "#Y [THIS.GetProvince.GetName]#! 至少拥有#Y 5#!Citizens@citizens!\n的贵族。"
 nabatea_mission_01_task_10:0 "加沙贸易路线"
 nabatea_mission_01_task_10_DESC:0 "以著名的#E Temple of Shamson#!而闻名的[GetProvince('(int32)659').GetName]城，将是我们建立贸易网络的理想之地。为即将到来的战斗准备好我们的军队--Mediterranean的水域就在Ptolemaic防御工事的另一边。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 nabatea_mission_01_task_10_money_loc_1:0 "(#R [SCOPE.ScriptValue('nabatea_mission_01_task_10_money_current')|0]#!/#Y [SCOPE.ScriptValue('nabatea_mission_01_task_10_money_total')|0]#!)"
 nabatea_mission_01_task_10_money_loc_2:0 "(#Y [SCOPE.ScriptValue('nabatea_mission_01_task_10_money_current')|0]#!/#Y [SCOPE.ScriptValue('nabatea_mission_01_task_10_money_total')|0]#!)"
 nabatea_mission_01_task_10_tooltip:0 "#Y $philistia_area$#!省至少有#Y [SCOPE.ScriptValue('nabatea_mission_01_task_10_money_total')|0]#!省收入@income! [SCOPE.GetRootScope.GetCountry.Custom('nabatea_mission_01_task_10_money_loc')]。"
 nabatea_mission_01_task_10_tt:0 "#Y [THIS.GetProvince.GetName]#!至少有#Y 13#!Citizens@citizens!\n\n。"
 nabatea_mission_01_task_11:0 "漫游Sinai的人"
 nabatea_mission_01_task_11_DESC:0 "尽管经验丰富的#E Ptolemaic Kingdom#!军队很难将其赶出#E Sinai Peninsula#!，但我们必须克服--即将到来的奖赏承诺太大，不能忽视。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 nabatea_mission_01_task_11_tt:0 "#Y Sinai Area#!内的每一个省份都将获得奖励。"
 nabatea_mission_01_task_12:0 "被削弱的基达尔"
 nabatea_mission_01_task_12_DESC:0 "#E 基达尔#! 是我们在南方的权力对手，但这只是暂时的——很快，我们会尽自己所能永久削弱他们的影响力和权力。\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 nabatea_mission_01_task_13:0 "国王崇拜"
 nabatea_mission_01_task_13_DESC:0 "通过崇拜那些带领我们的国家度过纷争时期的大胆领导人的灵魂，我们的人民甚至在今天也能得到我们杰出的祖先的指导。围绕我们的国王建立一个崇拜是一个明智和必要的决定。\n\n\n\n\n\n\n\n\n\n@greek_mil10!。"
 nabatea_mission_01_task_14:0 "Arabians的堡垒"
 nabatea_mission_01_task_14_DESC:0 "非常重要的[GetProvince('(int32)4721').GetName]省，正好位于剖析Arabian半岛的十字路口，是一个堡垒的候选地，它将保证我们在这片急需安全的土地上的安全。\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 nabatea_mission_01_task_14_tt:0 "[GetProvince('(int32)729').GetName]拥有至少50信奉#Y 阿拉伯多神教#!的人口。"
 nabatea_mission_01_task_15:0 "世界性的寺庙设计"
 nabatea_mission_01_task_15_DESC:0 "虽然在[ROOT.GetCountry.GetCapital.GetName]中明显偏向于[ROOT.GetCountry.GetAdjective]的建筑风格，但这并不意味着[ROOT.GetCountry.GetName]中没有以外国风格建造的寺庙。\n\n\n\n\n\n\n\n\n\n@persia_mil7!的建筑风格。"
 nabatea_mission_01_task_16:0 "纳巴泰海军突袭"
 nabatea_mission_01_task_16_DESC:0 "现在我们有了一支合适的海军，我们必须决定把我们的袭击者送到哪里去；我们的北方和南方都有诱人的选择，然而做出最终决定的权力在于[ROOT.GetCountry.GetName]。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 nabatea_mission_01_task_16_tt:0 "纳巴泰拥有至少#Y 35艘船#!的海军。"
 nabatea_mission_01_task_17:0 "Negev的市场"
 nabatea_mission_01_task_17_DESC:0 "我们在#E Negev#!的市场的受欢迎程度使我们养活这个地区的居民的能力感到紧张；我们必须立即采取行动。是时候破土而出了--我们有农场和粮仓要建。\n\n\n\n\n\n\n\n\n\n@celt_mil14!@celt_mil14!\n\n\n\n\n\n\n\n\n\n。"
 nabatea_mission_01_task_18:0 "西奈奴隶贸易"
 nabatea_mission_01_task_18_DESC:0 "我们在#E Sinai#!的存在给[ROOT.GetCountry.GetCapital.GetName]带来了各种有趣的人物--今天，似乎有个来自#E Ptolemaic Kingdom#!的奴隶主想在我国境内卸货。在我们同意之前，让我们看看到底提供了什么。\n\n\n\n\n\n\n\n\n\n@egypt_mil15!"
 nabatea_mission_01_task_18_tt:0 "一个与#Y 托勒密王国#!互动的事件链将开始。"
 nabatea_mission_01_task_19:0 "控制豪兰"
 nabatea_mission_01_task_19_DESC:0 "#E 豪兰平原#!是一个战略地区，控制它是我们国家安全的重中之重。如果我们能向当地人保证这个地区拥有[ROOT.GetCountry.GetAdjective]武器永久和平的保证，那么我们将获得民事和军事上的好处。  \n\n\n\n\n\n\n\n\n\n@persia_mil16!"
 nabatea_mission_01_task_20:0 "主宰熏香之路"
 nabatea_mission_01_task_20_DESC:0 "以任何人的标准来看，我们已经主宰了运送珍贵沉香贸易品的贸易路线--这使我们的国家获得了难以想象的财富。 \n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 nabatea_mission_01_task_21:0 "姐妹首都"
 nabatea_mission_01_task_21_DESC:0 "对于[ROOT.GetCountry.GetName]来说，拥有多个可以作为首都的地点是一个明智的选择；除了神灵，我们不相信任何人，我们建立了官僚机构和基础设施来容纳我们的公务员，我们相信这是治理的最佳方法。\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 nabatea_mission_01_task_22:0 "国王之血"
 nabatea_mission_01_task_22_DESC:0 "人们相信，[ROOT.GetCountry.GetRuler.GetName]的血管里流淌着神圣的国王的血液--当人们看到我们强大的统治者的事迹和成就时，谁能否认诸神所做的不言而喻的事情呢？\n\n\n\n\n\n\n\n\n\n@celt_mil1!@celt_mil1!\n\n\n\n\n\n\n\n\n\n。"
 nabatea_mission_01_task_23:0 "大篷车队"
 nabatea_mission_01_task_23_DESC:0 "商队的身影在沙漠沙丘上投下长长的影子，他们在我们的土地上行进--一条薄而脆弱的贸易生命线，维持着我们的人民和我们周围的人。\n\n\n\n\n\n\n\n\n\n@egypt_mil25!。"
 nabatea_mission_01_task_24:0 "在血泊中航行"
 nabatea_mission_01_task_24_DESC:0 "我们对外国的征服使我们的人变得嗜血，谁能责怪他们呢？我们的军队从我们派去的战争中带回了各种形式的战利品，而对珍贵物品的渴求也随着时间的推移而增加。现在，我们将把我们的舰队送到很远的地方，以维持我们对消耗他人财富的可怕需求。\n\n\n\n\n\n\n\n\n\n@greek_mil18!。"
 nabatea_mission_01_task_25:0 "Edomites的命运"
 nabatea_mission_01_task_25_DESC:0 "我们的士兵发现一个奇怪的人在沙漠的外围游荡。虽然他的眼睛很野，被疯狂所触动，但他声称有一封信，他必须交给[ROOT.GetCountry.GetRuler.GetName]。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!\n\n\n\n\n\n\n\n\n\n@egypt_mil9!。"
 nabatea_mission_01_task_26:0 "从海洋到尼福德"
 nabatea_mission_01_task_26_DESC:0 "日复一日，我们的力量在增长——无论人们把目光投向哪里，从大海的蓝色水域到奈富德沙漠的风吹沙丘，都能找到[ROOT.GetCountry.GetName]。\n\n\n\n\n\n\n\n\n\n@persia_mil9!。"
 nabatea_mission_01_task_26_tt:0 "在#Y 非利士#!省的至少#Y 4#!个领土上有[GetBuilding('port_building').GetName|Y]。"
 nabatea_mission_01_task_27:0 "国王的陵墓"
 nabatea_mission_01_task_27_DESC:0 "我们的社会以崇拜[ROOT.GetCountry.GetRuler.GetName]之前的神圣的国王而闻名，许多外国人来到我们为纪念我们的死者而建造的陵墓，以表达他们的敬意。其中一个作为敬意的礼物是被称为#Y 佩特拉圣石#!的宝物。\n\n\n\n\n\n\n\n\n\n@greek_mil2!。"
 nabatea_mission_01_task_28:0 "玻斯特拉神庙"
 nabatea_mission_01_task_28_DESC:0 "预言已经被采纳，如果我们想继续享受众神的祝福，我们必须征服[GetProvince('(int32)734').GetName]省。已有法令规定，我们必须用寺庙和剧院来美化这个地区，因为我们对这些平原有一个愿景......我们国家的第二个首都。\n\n\n\n\n\n\n\n\n\n@greek_mil16!@greek_mil16!\n\n\n\n\n\n\n\n\n\n。"
 nabatea_mission_01_task_29:0 "哈斯蒙尼的竞争"
 nabatea_mission_01_task_29_DESC:0 "虽然我们曾经与#E 哈斯蒙尼人#!保持着友好的关系，但我们与犹地亚人的友谊开始出现裂痕，我们是否能挽回剩下的东西，还有待观察。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 nabatea_mission_01_task_30:0 "第一次石油战争"
 nabatea_mission_01_task_30_DESC:0 "游牧民族和商人都谈到了一种奇怪的、类似焦油的沥青，一种被诅咒的恶臭，在我们的腹地发现。虽然这种有毒的物质让人鼻子不舒服，但这可能有一些用途bitumen...我们应该调查这些传言。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 nabatea_mission_01_task_31:0 "阿拉米社会"
 nabatea_mission_01_task_31_DESC:0 "我们应该向生活在我们社会中的阿拉米人敞开大门，因为没有理由让这些高贵的人继续处于被奴役的状态。让我们抛开对彼此的成见，分享共同的繁荣。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 nabatea_mission_01_task_31_tt:0 "阿拉姆文化至少有#Y Citizen#!的地位。"
 nabatea_mission_01_task_32:0 "叙利亚沙漠"
 nabatea_mission_01_task_32_DESC:0 "我们的军队不仅将#E 纳巴泰#!的旗帜插在了#E 叙利亚沙漠#!，而且我们胜利的军队还撬开了#E 美索不达米亚#!省的一些地方——这证明了我们日益增长的力量。\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 nabatea_mission_01_task_33:0 "阿拉伯人的领袖"
 nabatea_mission_01_task_33_DESC:0 "从#E 犹地亚#!的山麓到#E 阿拉伯湾#!的漫长海岸线，纳巴泰的力量在人们的视线中无处不在，根深蒂固。有了这样的荣誉，谁能否认我们不是#Y 阿拉伯人的领导者#!，这个称号是我们用矛头为自己赢得的？\n\n\n\n\n\n\n\n\n\n@egypt_mil20!。"

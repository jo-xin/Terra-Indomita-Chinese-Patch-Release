l_simp_chinese:
 01_fugandulu:0 "通往蒲甘之地的门户"
 01_fugandulu_BUTTON_TOOLTIP:0 "若纳特与我们同在，谁能与我们为敌？"
 01_fugandulu_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]征服#E 缅甸#!区域大部，传播#E 纳特#!崇拜至其领地，并建立#E “夫甘堕罗”#!——“通往蒲甘之地的门户”，此使命将完成。"
 01_fugandulu_DESCRIPTION:0 "[ROOT.GetCountry.GetName]的定居部落居住在#E 伊洛瓦底江谷#!南部沼泽边缘的#E 蒲甘#!省，他们忠诚地崇拜神秘的#E 纳特#!——在这个地区，这是一种罕见的信仰，因为这里曾经是纳特信仰的传统领地，但如今#E 吠陀#!和#E 苯教#!已在此传播。\n\n在我们这个世界的角落，尚未有人能团结区域的部落酋长，但邻国日益增长的势力对我们构成危险威胁，必须在为时已晚之前阻止。[ROOT.GetCountry.GetRuler.GetName]誓言为孟族征服该地区，驱逐外来信仰，恢复纳特的家园，并为我们的洪泛平原与丛林带来稳定。"
 01_fugandulu_task_1:0 "贝克塔诺政治"
 01_fugandulu_task_10:0 "哈林之家"
 01_fugandulu_task_10_DESC:0 "一旦我们征服了定居在该省南部的部落，我们将能够在北部省份安顿我们的同胞，而无需担心他们的安全。\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 01_fugandulu_task_11:0 "守护黄金之路"
 01_fugandulu_task_11_DESC:0 "作为[ROOT.GetCountry.GetName]内部日益集中化的显著标志之一，[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]下令在[GetProvince('(int32)8769').GetName]港口与[GetProvince('(int32)8771').GetName]省之间修建一条道路。[ROOT.GetCountry.GetName]部落需要轻松通往海洋，但[GetProvince('(int32)8770').GetName]的沼泽不足以威慑入侵者——我们需要一座堡垒。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 01_fugandulu_task_12:0 "从荣耀之野"
 01_fugandulu_task_12_DESC:0 "我们不仅将各部落纳入[ROOT.GetCountry.GetName]的旗帜之下，[ROOT.GetCountry.GetRuler.GetName]还成功在#T 缅甸#!区域传播#Y 纳特#!的崇拜。我们从荣耀之野出征，征服了我们所见的一切！\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 01_fugandulu_task_13:0 "夫甘都卢葡萄园"
 01_fugandulu_task_13_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]的当地精英非常喜爱我们首都附近酿造的葡萄酒，甚至开始种植自己的葡萄园，以增加私人酒庄的产量。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_fugandulu_task_14:0 "悲恸的战象"
 01_fugandulu_task_14_DESC:0 "[GetProvince('(int32)7352').GetArea.GetName]地区的丛林中居住著大象，据信经过适当训练，我们的征召兵将能将这些温顺的巨兽引入战场。\n\n\n\n\n\n\n\n\n\n@india_mil16!"
 01_fugandulu_task_15:0 "战友兄弟"
 01_fugandulu_task_15_DESC:0 "#T 骠#!部落居住在#E 伊洛瓦底江谷#!的孤立地区，虽然其中许多人已接受异端的#Y 苯教#!信仰，[ROOT.GetCountry.GetRuler.GetName]相信我们的人民可以和平共存。我们团结不更强大吗？\n\n#Y 我们将决定#T 骠文化#!的地位#!。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 01_fugandulu_task_15_tt:0 "[GetCulture('pyu').GetName]文化将被整合。"
 01_fugandulu_task_15_tt2:0 "我们必须拥有#Y 2#!位#T 氏族首领##!，且忠诚度至少达到#E 75#!点。"
 01_fugandulu_task_16:0 "印度贸易路线"
 01_fugandulu_task_16_DESC:0 "#E 伊洛瓦底江谷#!出产极为罕见的水果，如红毛丹和香蕉，我们的海对面朋友非常有兴趣进口我们的农产品。\n\n让我们尽力促进海外联系——[GetCountry('SMT').GetName]的[GetProvince('(int32)7395').GetName]城是该地区的贸易中心，据说其总督愿意与外国人达成交易。\n\n#Y 若我们拥有[GetProvince('(int32)7395').GetName|G]或#Y 其为我们的附庸#!，此使命将被绕过。#!\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 01_fugandulu_task_17:0 "骠国玉矿"
 01_fugandulu_task_17_DESC:0 "稀有贸易商品玉石@jade!可在[GetProvince('(int32)8813').GetName]省份找到，而[ROOT.GetCountry.GetRuler.GetName]已要求我们向该区域投入资源——我们必须立即在那里建造一座矿场。\n\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 01_fugandulu_task_18:0 "纳特重返#E 哈林#!"
 01_fugandulu_task_18_DESC:0 "虽然[GetProvince('(int32)8778').GetName]的居民已放弃#T 纳特信仰#!，[ROOT.GetCountry.GetRuler.GetName]发誓要让纳特重返该城内的圣地。\n\n\n\n\n\n\n\n\n\n@india_mil5!"
 01_fugandulu_task_19:0 "库吉纳特大神庙"
 01_fugandulu_task_19_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]希望在[ROOT.GetCountry.GetName]内建立永久遗产，建议在[ROOT.GetCountry.GetCapital.GetName]为[GetDeityDefinition('omen_kujii').GetName]建造一座宏伟神庙，以确保[ROOT.GetCountry.GetRuler.GetHerHis]的名字不被后代遗忘。\n\n#R 皈依其他信仰将禁用此任务。#!\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 01_fugandulu_task_1_DESC:0 "[GetProvince('(int32)8771').GetName]附近的洪泛平原向北延伸，经过[GetProvince('(int32)8770').GetName]的沼泽，进入一个粮食丰饶但由敌对蒲甘战士守卫的肥沃地区。[ROOT.GetCountry.GetRuler.GetName]渴望为[ROOT.GetCountry.GetName]夺取这片土地，并已准备好我们的领土主张。\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 01_fugandulu_task_2:0 "强化安全"
 01_fugandulu_task_2_DESC:0 "若我们希望为我们的部落民夺取新省份，必须确保有愿意与我们并肩作战的朋友。只要一步失误，一个不小心，我们可能失去一切——有盟友支持，我们的胜算更大。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 01_fugandulu_task_3:0 "#E 塔莱丹#!的#E 库吉伊·灵#!"
 01_fugandulu_task_3_DESC:0 "在[GetProvince('(int32)8770').GetName]沼泽地的恶臭水域中，致命的乌帕斯树提醒着[GetDeityDefinition('omen_kujii').GetName]的力量，这位#G 战争纳特#!保护着[ROOT.GetCountry.GetName]的人民。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 01_fugandulu_task_4:0 "为海岸与山丘而战"
 01_fugandulu_task_4_DESC:0 "既然[GetProvince('(int32)8771').GetArea.GetName]地区已牢牢在[ROOT.GetCountry.GetRuler.GetName]的统治之下，我们必须向北进军#E 缅甸山脉#!，与仍不受我们控制的部落作战。\n\n然而，忽略南方将有危险……我们必须进军#E 阿拉干#!省，以抵达#E 印度洋#!和更广阔的世界。\n\n\n\n\n\n\n\n\n\n@india_mil12!"
 01_fugandulu_task_5:0 "库吉纳特的堡垒"
 01_fugandulu_task_5_DESC:0 "即使在困难时期，[GetDeityDefinition('omen_kujii').GetName]从未抛弃[ROOT.GetCountry.GetName]的战士，他们如今为他的荣耀而战。我们可以通过在[ROOT.GetCountry.GetCapital.GetName]建造更坚固的防御工事来荣耀#G 战争纳特#!，以确保获得他的祝福。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_fugandulu_task_6:0 "夫甘都卢的农业"
 01_fugandulu_task_6_DESC:0 "多年来，[GetProvince('(int32)8778').GetName]是#E 蒲甘#!部落民的唯一城市，但这已不再——伟大的[ROOT.GetCountry.GetRuler.GetName]让[ROOT.GetCountry.GetName]勤劳的人民开始工作。现在是种植与收获的时刻，因为我们日益增长的军队需要补给。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_fugandulu_task_7:0 "#E 宾纳卡#!的宝石"
 01_fugandulu_task_7_DESC:0 "[GetProvince('(int32)8773').GetName]的平原上可以找到珍贵宝石，而[ROOT.GetCountry.GetName]的部民需要它们。一旦我们的采矿作业开始运转，我们将立即开始铸造钱币。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_fugandulu_task_8:0 "傀儡大师"
 01_fugandulu_task_8_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]不仅是[ROOT.GetCountry.GetName]无可争议的权威，其[ROOT.GetCountry.GetRulerTitle]的命令甚至被外国部落酋长所服从。\n\n\n\n\n\n\n\n\n\n@india_mil22!"
 01_fugandulu_task_9:0 "铁箭与皮盾"
 01_fugandulu_task_9_DESC:0 "我们勇敢的步兵与弓箭手为[ROOT.GetCountry.GetName]的人民带来了无数胜利，现在是时候奖励他们的辛勤工作。让我们花钱为他们妥善装备。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 NATIC_NATION_FUGANDULU:0 "夫甘堕罗"
 NATIC_NATION_FUGANDULU_ADJ:0 "夫甘堕罗"
 blessing_of_kijii_fugandulu_mod:0 "库吉伊·灵的祝福"
 desc_blessing_of_kijii_fugandulu_mod:0 "忠实的库吉纳特减轻了维护防御工事的负担，并将其毒液借给我们的弓箭手。"
 desc_fugadulu_jungle_elephants_mod:0 "我们的军队受训使用丛林大象作战，使敌人陷入绝望。"
 desc_fugandulu_archers_light_infantry_mod:0 "夫甘都卢的部落日益好战，投资于为其军队装备专业武器。"
 desc_fugandulu_cheaper_slaves_cost:0 "夫甘都卢的孟族部落积极殖民北部荒地。"
 desc_fugandulu_indian_capital_trade_mod:0 "伊洛瓦底河谷出产的稀有水果在室利差呾罗的市场上十分丰富。"
 desc_fugandulu_indian_fruit_trade_mod:0 "我们已与印度的般遮耶区域的各城市建立了长期贸易关系。"
 desc_fugandulu_nat_temple_mod:0 "伊洛瓦底江谷的孟族部落在其首都建造了一座宏伟神庙，将作为纳特信仰的中心。"
 desc_fugandulu_slave_mine_mod:0 "夫甘都卢的人民在宾纳卡平原建造矿场，以从地底提取珍贵金属。"
 desc_kijii_fort_fugandulu_mod:0 "战争大师库吉纳特祝福我们的首都，赋予其无可攻破的防御工事。"
 desc_mon_jade_mines_modifier_fugandulu:0 "孟族部落在该省建造矿场，以尽可能多地提取稀有矿物玉。"
 form_pugramadvara:0 "建立夫甘堕罗"
 form_pugramadvara_desc:0 "通过征服缅甸山脉间的洪泛平原与山麓，我们团结了一片土地，它将成为恢复纳特信仰的堡垒；“夫甘堕罗”，即“骠地门户”。"
 fugadulu_jungle_elephants_mod:0 "悲恸的战象"
 fugandulu_1_ally_tt:0 "我们需要至少#Y 1#!个盟友或附庸。"
 fugandulu_2_ally_tt:0 "我们需要至少#Y 2#!个附庸。"
 fugandulu_archers_light_infantry_mod:0 "铁制武器与皮革盾牌"
 fugandulu_cheaper_slaves_cost:0 "北方迁徙"
 fugandulu_fifty_percent_natic_tt:0 "在#G 缅甸#!#Y 地区#!，#Y 至少#!#T 50%#!#Y 的人口遵循#!#T 纳特信仰#!。"
 fugandulu_indian_capital_trade_mod:0 "室利差呾罗的水果市集"
 fugandulu_indian_fruit_trade_mod:0 "印度贸易联系"
 fugandulu_iron_arrows_tt:0 "我们必须在室利差呾罗拥有至少#T 2铁@iron!#!和#T 2皮革@leather!#!的#Y 盈余#!。"
 fugandulu_jade_statue_of_nat:0 "纳特的玉像"
 fugandulu_jade_statue_of_nat_desc:0 "这座纳特雕像由密支那省的玉石雕刻而成，据说带有神圣能量。"
 fugandulu_nat_temple_mod:0 "库吉纳特大神庙"
 fugandulu_needs_two_farms_tt:0 "#Y 在我们的国家中至少需要#!#T 2个农场#!。"
 fugandulu_slave_mine_mod:0 "宾纳卡矿场"
 halin_needs_religious_investments_tt:0 "我们需要在#Y 骠#!省进行#T 宗教捐献#!省份投资。"
 kijii_fort_fugandulu_mod:0 "库吉纳特的堡垒"
 kujii_omen_active_tt:0 "夫甘都卢已#T 激活#!#Y 库吉伊·灵#!。"
 me_fugandulu_1.a:0 "是时候结束这些战争了……"
 me_fugandulu_10.a:0 "带著我的祝福和纳特的祝福前进"
 me_fugandulu_10_desc:0 "随著关于#E 掸邦#!省份的消息在[ROOT.GetCountry.GetName]的部落中传播，越来越多的同胞聚集在[ROOT.GetCountry.GetCapital.GetName]，准备前往荒野的旅程。掸邦是一片富饶之地，可大量采收靛蓝@woad!，甚至有些地区可找到玉@jade!。\n\n由于许多部落民渴望财富和更好的生活，他们准备迁往掸邦或其他任何有机会的地方。[ROOT.GetCountry.GetRuler.GetName]不仅为我们的部落夺取了山脉，还夺取了更北方的丛林，因此我们的人民有许多选择。"
 me_fugandulu_10_title:0 "$01_fugandulu_task_10$"
 me_fugandulu_10_tooltip:0 "任務「#Y $01_fugandulu_task_10$#!」現已#G完成#!"
 me_fugandulu_11.a:0 "我们必须尽快抵达印度海"
 me_fugandulu_11_desc:0 "多年来，[ROOT.GetCountry.GetName]的人民离开了伊洛瓦底江谷的洪泛平原，为自己夺取了遥远的领土和省份——#E 印度洋#!旁的一片森林地带阿拉干就是其中之一。\n\n[ROOT.GetCountry.GetRuler.GetName]长期渴望与外部世界更多接触，通过我们对贸易航线的接触，这一任务将更易实现，[ROOT.GetCountry.GetRuler.GetSheHe]委托建造了我国历史上的第一支小型海军。[ROOT.GetCountry.GetCapital.GetName]的居民渴望只有在遥远市场才能获得的外国商品，我们的[ROOT.GetCountry.GetRulerTitle]希望今天标志著我们同胞繁荣时期的开始。\n\n为方便[GetProvince('(int32)8769').GetName]与[GetProvince('(int32)8771').GetName]之间的旅行，已修建了一条区域道路，深受当地人欢迎。在[GetProvince('(int32)8770').GetName]建造的一座堡垒确保这条高速公路免受盗匪侵扰，同时作为抵御西部入侵的强大威慑。"
 me_fugandulu_11_title:0 "$01_fugandulu_task_11$"
 me_fugandulu_11_tooltip:0 "任務「#Y $01_fugandulu_task_11$#!」現已#G完成#!"
 me_fugandulu_12.a:0 "赞美[ROOT.GetCountry.GetName]的人民！"
 me_fugandulu_12.b:0 "我不是酋长，而是王……"
 me_fugandulu_12_desc:0 "从最卑微的开端，[ROOT.GetCountry.GetRuler.GetName]带领[ROOT.GetCountry.GetName]的人民达到难以想像的高度——我们权力的顶峰。[ROOT.GetCountry.GetRuler.GetFirstName]是一个广大领土的[ROOT.GetCountry.GetRulerTitle]，显而易见，[ROOT.GetCountry.GetAdjective]的部落民渴望更多——他们不会满足于现有的一切。\n\n这是[ROOT.GetCountry.GetRuler.GetFirstName]共有的特质，他公开表示[ROOT.GetCountry.GetRuler.GetSheHe]认为自己是[ROOT.GetCountry.GetName]的第一伟大统治者。"
 me_fugandulu_12_title:0 "$01_fugandulu_task_12$"
 me_fugandulu_12_tooltip:0 "任務「#Y $01_fugandulu_task_12$#!」現已#G完成#!"
 me_fugandulu_12_tooltip_tyrant:0 "#Y 我们的统治者将夺取权力并建立#!#R 专制君主制#!。"
 me_fugandulu_13.a:0 "我们的葡萄酒与世界上任何地方的一样好"
 me_fugandulu_13_desc:0 "[GetProvince('(int32)8771').GetName]拥有优良的土壤与葡萄，随着[ROOT.GetCountry.GetName]的农业技能不断提升，我们的农民注意力从简单的粮食如谷物和稻米转向葡萄果实。\n\n多亏我们同胞在伊洛瓦底江谷各地建造农场的空前努力，他们学到的经验已被应用于室利差呾罗，该省郊外现有一座美丽的葡萄园。前往首都的旅人知道，当他们看到劳工照料果园与田野时，目的地已近。"
 me_fugandulu_13_title:0 "$01_fugandulu_task_13$"
 me_fugandulu_13_tooltip:0 "任務「#Y $01_fugandulu_task_13$#!」現已#G完成#!"
 me_fugandulu_14.a:0 "看啊——悲恸的战象！"
 me_fugandulu_14_desc:0 "虽然我们的民族最初不熟悉大象@warelephant!，当[ROOT.GetCountry.GetRuler.GetName]首次夺取拥有这些野兽的省份时，[ROOT.GetCountry.GetRuler.GetSheHe]立即要求训练牠们用于战争。在随后的日子里，每当[ROOT.GetCountry.GetRuler.GetFirstName]能放下[ROOT.GetCountry.GetRuler.GetHerHis]职责时，[ROOT.GetCountry.GetRuler.GetSheHe]常偷溜到[GetProvince('(int32)7349').GetName]，著名的#E 「大象之城」#!，与[ROOT.GetCountry.GetName]的征召兵和士兵一起训练，学习如何控制这些巨兽。\n\n经过数月，掌握了骑乘战象作战的艺术后，这位胜利的[ROOT.GetCountry.GetRulerTitle]带领一支庞大军队返回[ROOT.GetCountry.GetCapital.GetName]，这支军队将在未来改变国家的历史进程。"
 me_fugandulu_14_title:0 "$01_fugandulu_task_14$"
 me_fugandulu_14_tooltip:0 "任務「#Y $01_fugandulu_task_14$#!」現已#G完成#!"
 me_fugandulu_15.a:0 "骠人已在孟族社会中赢得了他们的位置"
 me_fugandulu_15.b:0 "蒲甘人比奴隸好不到哪裡去！"
 me_fugandulu_15.c:0 "为我们的人力征召他们最好的战士"
 me_fugandulu_15.d:0 "[ROOT.GetCountry.GetName]属于孟族，所以我们将忽略骠人"
 me_fugandulu_15_desc:0 "随著我们征服越来越多居住在我们周围的#E 蒲甘#!部落，[ROOT.GetCountry.GetCapital.GetName]的一些人建议我们赋予这些部落民与我们同胞相同的权利。\n\n虽然有些人认为这是愚蠢的想法，但其他人声称和谐共存的状态只会惠及[ROOT.GetCountry.GetName]——我们真的想要地区叛乱吗？"
 me_fugandulu_15_slave_tt:0 "#Y我们将#T骠文化#!的权利设为#R奴隶#!。#Y#!#!"
 me_fugandulu_15_title:0 "$01_fugandulu_task_15$"
 me_fugandulu_15_tooltip:0 "任務「#Y $01_fugandulu_task_15$#!」現已#G完成#!"
 me_fugandulu_16.a:0 "公主，您在这里是安全的——我以我的名誉保证"
 me_fugandulu_16_desc:0 "不仅我们与海外港口的联系为我们带来了大量贸易——[ROOT.GetCountry.GetRuler.GetName]的友人[GetProvince('(int32)7395').GetState.GetGovernor.GetName]在[GetProvince('(int32)7395').GetName]城市中的朋友确保了这一点——但我们的海外联系也为[ROOT.GetCountry.GetCapital.GetName]带来了高贵的难民。\n\n似乎一位#E 孔雀王朝#!公主，[SCOPE.sCharacter('mauryan_bride_fugandulu').GetName]，在丈夫被嫉妒的对手谋杀后，逃离了[GetProvince('(int32)4440').GetName]的宫廷。在孔雀人的特工追捕下，[SCOPE.sCharacter('mauryan_bride_fugandulu').GetFirstName]设法抵达了她昔日好友[GetProvince('(int32)7395').GetState.GetGovernor.GetFirstName]，这位总督是她家乡[GetCountry('MRY').GetName]的老熟人，他将她偷偷藏在一艘驶往[GetProvince('(int32)8769').GetName]的[ROOT.GetCountry.GetAdjective]商船上。\n\n尽管[SCOPE.sCharacter('mauryan_bride_fugandulu').GetFirstName]对离开家乡感到悲伤，但她已逐渐接受住在[ROOT.GetCountry.GetCapital.GetName]是她新的生活。[ROOT.GetCountry.GetRuler.GetFirstName]承诺会照顾[SCOPE.sCharacter('mauryan_bride_fugandulu').GetFirstName]，发誓她终于安全了，不再有刺客的威胁。然而，[ROOT.GetCountry.GetRulerTitle]不禁对生活的荒谬感到困惑——谁能想到这一切竟源于[GetProvince('(int32)8771').GetName]的水果市场？若非我们的对外出口，这一切都不会发生。"
 me_fugandulu_16_title:0 "$01_fugandulu_task_16$"
 me_fugandulu_16_tooltip:0 "任務「#Y $01_fugandulu_task_16$#!」現已#G完成#!"
 me_fugandulu_17.a:0 "感谢您赐予的礼物，哦，玉之神秘精灵"
 me_fugandulu_17_desc:0 "传闻属实——[GetProvince('(int32)8813').GetName]的偏远地区充满玉@jade!——仿佛连绵的丘陵完全由这珍贵矿物构成。这个人口稀少、充满戒心的当地人居住的地区，很快就成为[ROOT.GetCountry.GetName]事务的中心。\n\n迅速意识到这一幸运情形绝非巧合，[ROOT.GetCountry.GetRuler.GetName]下令在遥远的省份建造一座矿场，一旦首批最纯净的玉石运抵[ROOT.GetCountry.GetCapital.GetName]的工坊，[ROOT.GetCountry.GetRulerTitle]委托制作一座#E 纳特#!雕像。[ROOT.GetCountry.GetRuler.GetFirstName]知道凡人之礼无法完全感谢纳特，但[ROOT.GetCountry.GetRuler.GetSheHe]仍会尽[ROOT.GetCountry.GetRuler.GetHerHis]所能尝试，一座供人民崇拜的雕像将受到欢迎。"
 me_fugandulu_17_title:0 "$01_fugandulu_task_17$"
 me_fugandulu_17_tooltip:0 "任務「#Y $01_fugandulu_task_17$#!」現已#G完成#!"
 me_fugandulu_18.a:0 "愿纳特永远引导我们前行！"
 me_fugandulu_18.b:0 "哈林将是更好的首都……"
 me_fugandulu_18_desc:0 "[ROOT.GetCountry.GetRuler.GetName]人生中最骄傲的时刻之一，是当[ROOT.GetCountry.GetRuler.GetSheHe]监督净化[GetProvince('(int32)8778').GetName]城的宗教仪式，并提醒那里的居民#E 纳特#!的力量。[ROOT.GetCountry.GetRuler.GetFirstName]亲自前往该城主持宗教仪式，燃烧香火作为对#E 库吉纳特#!的供奉，唱著战胜黑暗力量的胜利之歌。\n\n受到这虔诚表现的感动，哈林的许多居民当场皈依#E 纳特信仰#!，放弃他们的愚昧信仰，回归真理。"
 me_fugandulu_18_title:0 "$01_fugandulu_task_18$"
 me_fugandulu_18_tooltip:0 "任務「#Y $01_fugandulu_task_18$#!」現已#G完成#!"
 me_fugandulu_19.a:0 "在我们的土地上，纳特繁荣昌盛……"
 me_fugandulu_19_desc:0 "据说当#E 库吉纳特大神庙#!在首都建成时，国内的每棵乌帕斯树都盛开，绿金色的花朵香气在夜空中散发出令人陶醉的疯狂气息——还有什么比这更能显示#E 战争纳特#!的喜悦？[ROOT.GetCountry.GetRuler.GetName]的远见与洞察再次祝福了人民。\n\n但这还不是全部。在清晨，库吉纳特祭司抵达神庙前，当地人说他们可以看到另一位纳特睡在内殿中。当太阳升起，这神秘生物醒来，打个哈欠，朝[ROOT.GetCountry.GetCapital.GetName]的城塞走去，然后化为薄雾。占卜显示，[GetDeityDefinition('omen_kingdom_nat').GetName]已来到[ROOT.GetCountry.GetName]居住。"
 me_fugandulu_19_title:0 "$01_fugandulu_task_19$"
 me_fugandulu_19_tooltip:0 "任務「#Y $01_fugandulu_task_19$#!」現已#G完成#!"
 me_fugandulu_1_desc:0 "虽然与世界其他角落相对隔绝，#E 骠#!省份是政治暴力的温床，居住著不断袭击邻居的各部落——#E 孟#!与#E 骠#!文化在生存竞争中毫无友爱。\n\n更复杂的是，该地区的宗教紧张局势正在加剧。这些丛林与洪泛平原曾是#E 纳特#!的无争之地，这些神圣精灵在#E 伊洛瓦底江#!河岸生活与嬉戏，但#E 苯教#!与#E 吠陀#!信徒的入侵已将这些天空精灵从传统家园驱逐，扰乱了自然平衡。\n\n虽然这将很困难，[ROOT.GetCountry.GetRuler.GetName]发誓通过为[ROOT.GetCountry.GetName]征服这片土地来愈合它——只有我们[ROOT.GetCountry.GetRulerTitle]坚定而忠诚的手才能通过力量带来和平时代。"
 me_fugandulu_1_title:0 "$01_fugandulu_task_1$"
 me_fugandulu_1_tooltip:0 "任務「#Y $01_fugandulu_task_1$#!」現已#G完成#!"
 me_fugandulu_2.a:0 "事情可能会改变，但现在，我们是兄弟"
 me_fugandulu_2_desc:0 "作为[ROOT.GetCountry.GetRuler.GetHerHis]政治权威日益增长的标志，[ROOT.GetCountry.GetRuler.GetName]从外国部落获得了友谊誓言——这是在[ROOT.GetCountry.GetCapital.GetName]庆祝的外交胜利。通过为[ROOT.GetCountry.GetName]确保盟友，[ROOT.GetCountry.GetRuler.GetFirstName]确保我们的军队不会孤军奋战，而是能在未来的战争中依靠盟友的协助。"
 me_fugandulu_2_title:0 "$01_fugandulu_task_2$"
 me_fugandulu_2_tooltip:0 "任務「#Y $01_fugandulu_task_2$#!」現已#G完成#!"
 me_fugandulu_3.a:0 "愿库吉纳特的毒液击溃我们的敌人！"
 me_fugandulu_3_desc:0 "在[GetProvince('(int32)8770').GetName]的沼泽中，可找到致命的乌帕斯树——若幸运，则可能看到[GetDeityDefinition('omen_kujii').GetName]攀爬其枝干。塔勒丹的库吉纳特圣地长期以来是纳特信徒的朝圣地，但近来，该神龛已年久失修，纳特开始消失。\n\n为了改变这种状况，[ROOT.GetCountry.GetRuler.GetName]在沼泽地中花费了许多时间祈祷，寻求纳特的意愿。一天下午，[ROOT.GetCountry.GetRuler.GetFirstName]在神龛冥想时，脑海中浮现出乌帕斯树的发光影像。一团苍白的粉红色雾气在其枝干间凝聚，一个无形的声音充满了[ROOT.GetCountry.GetRulerTitle]的意识，毒液滴落在地，留下嘶嘶作响的烟雾。\n\n「将我恢复到[ROOT.GetCountry.GetName]的神系中，孩子，我的精华将浸润你的箭矢……」\n\n睁开双眼，[ROOT.GetCountry.GetRuler.GetFirstName]知道必须做什么。"
 me_fugandulu_3_title:0 "$01_fugandulu_task_3$"
 me_fugandulu_3_tooltip:0 "任務「#Y $01_fugandulu_task_3$#!」現已#G完成#!"
 me_fugandulu_4.a:0 "我们必须夺取我们所能得到的一切！不要丧失信心！"
 me_fugandulu_4_desc:0 "既然整个#E 骠#!省份已被[ROOT.GetCountry.GetName]的征召兵夺取，雄心勃勃的[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]将目光投向两个不同目标：夺取#E 阿拉干#!的南部海岸，以及进一步向北进军#E 伊洛瓦底江谷#!的丘陵与山脉。\n\n虽然我们的一些同胞哀叹[ROOT.GetCountry.GetRuler.GetFirstName]带来的这种永恒战争状态，但一切已启动，唯一的出路是前进。"
 me_fugandulu_4_title:0 "$01_fugandulu_task_4$"
 me_fugandulu_4_tooltip:0 "任務「#Y $01_fugandulu_task_4$#!」現已#G完成#!"
 me_fugandulu_5.a:0 "不要太深呼吸，免得生病……"
 me_fugandulu_5_desc:0 "一旦[GetDeityDefinition('omen_kujii').GetName]被恢复到神系中，[ROOT.GetCountry.GetName]的人民很快就完全接受了他的仪式，[ROOT.GetCountry.GetRuler.GetName]因其神圣启发的决定复兴富甘杜卢保护者的崇拜而受到赞誉。一旦我们掌握了建造更坚固防御的技术，[ROOT.GetCountry.GetRuler.GetFirstName]下令我们将以劳动荣耀库吉纳特。\n\n几个月后，[ROOT.GetCountry.GetCapital.GetName]的首都堡垒大幅扩建了防御工事；#E 库吉纳特的堡垒#!，很快就以此闻名，现在拥有可抵御任何军队的强化外墙。一旦这座无可攻破的城塞主门完成，据说整个首都街道都能闻到乌帕斯树的香气——这是[GetDeityDefinition('omen_kujii').GetName]恩宠的标志。"
 me_fugandulu_5_title:0 "$01_fugandulu_task_5$"
 me_fugandulu_5_tooltip:0 "任務「#Y $01_fugandulu_task_5$#!」現已#G完成#!"
 me_fugandulu_6.a:0 "愿纳特保护[ROOT.GetCountry.GetAdjective]文明之光"
 me_fugandulu_6_desc:0 "多亏[ROOT.GetCountry.GetName]勤劳的部落民，他们从不厌倦被赋予的工作，而是热情投入每项任务，我们国家的肥沃农田充满自然的恩赐。\n\n每天都有源源不断的谷物、水果和蔬菜运抵[ROOT.GetCountry.GetCapital.GetName]，该城被迫迅速扩张以应对日益增长的人口。在幸福的状态下，原本简单的定居点已转变为真正的城市；一个真正的首都。"
 me_fugandulu_6_title:0 "$01_fugandulu_task_6$"
 me_fugandulu_6_tooltip:0 "任務「#Y $01_fugandulu_task_6$#!」現已#G完成#!"
 me_fugandulu_7.a:0 "拥有自己的钱币将确保我们得到公平价值"
 me_fugandulu_7_desc:0 "长期以来，传闻[GetProvince('(int32)8773').GetName]平原上可以找到珍贵宝石，而这个秘密一直被骠人当地居民严密守护。因此，一旦该省落入[ROOT.GetCountry.GetName]手中，[ROOT.GetCountry.GetRuler.GetName]便立刻派出[ROOT.GetCountry.GetRuler.GetHerHis]采掘者，查明这些故事是否属实。\n\n幸好众人所言不虚，一座矿场很快在吉地建成。不久之后，人们不仅发现了钻石，还发现了祖母绿，这是一笔唾手可得的巨额财富。为了庆祝这一意外发现，[ROOT.GetCountry.GetRuler.GetFirstName]下令在[ROOT.GetCountry.GetCapital.GetName]铸造钱币。我们预见许多外国商人将来到我们的市场，而我们也需要自己的货币来便利贸易。"
 me_fugandulu_7_title:0 "$01_fugandulu_task_7$"
 me_fugandulu_7_tooltip:0 "任務「#Y $01_fugandulu_task_7$#!」現已#G完成#!"
 me_fugandulu_8.a:0 "我掌控无数灵魂的命运与人生……"
 me_fugandulu_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName]不仅是[ROOT.GetCountry.GetName]的卓越[ROOT.GetCountry.GetRulerTitle]，还以掌控外国土地而闻名，是酋长中的酋长。有谁能数清在[ROOT.GetCountry.GetRuler.GetFirstName]面前屈服、将权威交给[ROOT.GetCountry.GetRuler.GetHerHim]的酋长？纳特揭示我们将在未来取得更大胜利，这全赖[ROOT.GetCountry.GetRuler.GetFirstName]的卓越决策，他被誉为杰出的战术家，人心与思想的操纵大师。"
 me_fugandulu_8_title:0 "$01_fugandulu_task_8$"
 me_fugandulu_8_tooltip:0 "任務「#Y $01_fugandulu_task_8$#!」現已#G完成#!"
 me_fugandulu_9.a:0 "进攻很好，但别忘了防护……我们需要盾牌"
 me_fugandulu_9_desc:0 "多亏在[ROOT.GetCountry.GetName]各地建造的矿场产量，我们得以指导我们的铁匠和其他工匠进行设计实验——若无[ROOT.GetCountry.GetCapital.GetName]的盈余，这将很困难。\n\n幸运的是，这次锻造实验获得了回报，我们的武器匠经过反复试验改进了箭矢设计。"
 me_fugandulu_9_title:0 "$01_fugandulu_task_9$"
 me_fugandulu_9_tooltip:0 "任務「#Y $01_fugandulu_task_9$#!」現已#G完成#!"

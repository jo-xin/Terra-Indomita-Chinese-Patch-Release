 riches_of_greece:0 "希腊的财富"
 sparta_area_has_no_constuction_tooltip:0 "[GetProvince('(int32)427').GetArea.GetName|Y]省没有在建工程"
 spartan_king_crown:0 "斯巴达国王的皇冠"
 spartan_king_crown_desc:0 "这个金色的花环是斯巴达好战的国王们的皇冠。人们相信，谁拥有这个头饰，谁就能确保其人民的幸福。"
 spartan_traditions:0 "斯巴达的传统"
 spreading_boeotian_culture:0 "传播玻奥提亚文化"
 successful_athenian_campaign:0 "雅典人的成功战役"
 theban_attica:0 "忒拜的阿提卡"
 theban_dominance:0 "忒拜人的统治地位"
 theban_food_source:0 "底比斯人的食物来源"
 theban_influence:0 "忒拜的影响"
 theban_pella:0 "忒拜的珀拉"
 theban_sacred_band:0 "忒拜的神圣队伍"
 theban_support:0 "忒拜的支持"
 thebes_conquest_task_26_tooltip:0 "#Y 忒拜#!首都的军团获得#E 忒拜捍卫者#!称号"
 thebes_missions_01_restoration:0 "恢复忒拜"
 thebes_missions_01_restoration_CRITERIA_DESCRIPTION:0 "当玻奥提亚省在忒拜人的控制之下时，这个任务就完成了。"
 thebes_missions_01_restoration_DESCRIPTION:0 "古都[GetProvince('(int32)426').GetName]虽历经沧桑，今正待重写历史。当更广阔的希腊世界深陷继业者战争之际，勇者面前机遇无限！"
 thebes_missions_01_restoration_task_1:0 "迈出第一步"
 thebes_missions_01_restoration_task_10:0 "忒拜的复生"
 thebes_missions_01_restoration_task_10_DESC:0 "忒拜已经接受了她的命运，成为整个玻奥提亚的主人。忒拜的复兴让整个世界为之侧目，因为僭主和国王们都注意到了忒拜霸权的日益强大。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 thebes_missions_01_restoration_task_10_tt:0 "拥有或附属国拥有#Y $boeotia_area$#! 省内所有不属于[GetCountry('MAC').GetName]或[GetCountry('PRY').GetName]的领土。"
 thebes_missions_01_restoration_task_11:0 "伟大的德尔斐城"
 thebes_missions_01_restoration_task_11_DESC:0 "神圣的德尔斐城现在在我们手中，有人呼吁我们用新的建筑来增加它的美丽，由忒拜的国库资助。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 thebes_missions_01_restoration_task_11_tooltip:0 "访问#Y Pythia#!。"
 thebes_missions_01_restoration_task_12:0 "忒拜的神圣队伍"
 thebes_missions_01_restoration_task_12_DESC:0 "在过去的日子里，圣军是指挥我们底比斯军队的精英队列，我们没有理由不效仿我们的祖先在我们面前的榜样。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 thebes_missions_01_restoration_task_12_army_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_01_restoration_task_12_army_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_01_restoration_task_12_army_total')|0]#!)"
 thebes_missions_01_restoration_task_12_army_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_01_restoration_task_12_army_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_01_restoration_task_12_army_total')|0]#!)"
 thebes_missions_01_restoration_task_12_tooltip:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]的军队规模至少为#Y 10#!。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_01_restoration_task_12_army_loc')]"
 thebes_missions_01_restoration_task_13:0 "七个门的忒拜"
 thebes_missions_01_restoration_task_13_DESC:0 "诗人歌颂了七门忒拜的美丽；这个道理如此明显，几乎成了老生常谈。还有什么地方能与她宽阔的街道、阴凉的柱廊和茂盛的花园相媲美呢？一座拥有巨大财富的城市，拥有难以想象的乐趣。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 thebes_missions_01_restoration_task_14:0 "可靠的食物来源"
 thebes_missions_01_restoration_task_14_DESC:0 "Anthidon定居点目前提供良好的马匹，但农田肥沃，可以很容易地种植谷物，为忒拜的周边地区提供稳定可靠的食物来源。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 thebes_missions_01_restoration_task_15:0 "摧毁Orchomenos"
 thebes_missions_01_restoration_task_15_DESC:0 "我们有很多理由与奥科梅尼亚人为敌，并将通过彻底摧毁他们来为许多死去的祖先报仇。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 thebes_missions_01_restoration_task_16:0 "与Orchomenos合作"
 thebes_missions_01_restoration_task_16_DESC:0 "虽然我们可以把Orchomenos破坏得无法理解，但我们决定对我们的胜利持宽宏大量的态度。让我们用新的居民涌入城市，标志着新的一天的开始。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 thebes_missions_01_restoration_task_17:0 "恳请帮助"
 thebes_missions_01_restoration_task_17_DESC:0 "在即将到来的战争中发出援助请求将是明智的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 thebes_missions_01_restoration_task_1_DESC:0 "忒拜应该通过恢复城市本身来开始其漫长的荣耀上升之路。鼓舞我们的人民迎接即将到来的一切，并开始建设。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 thebes_missions_01_restoration_task_2:0 "冲出玻奥提亚"
 thebes_missions_01_restoration_task_2_DESC:0 "为了正确地发展忒拜，我们需要不受约束的出海口，通过控制Thespiai，我们将解决这个问题。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 thebes_missions_01_restoration_task_3:0 "建设好Cadmeia"
 thebes_missions_01_restoration_task_3_DESC:0 "Cadmeia，忒拜中心的堡垒，已成为废墟。通过重建它的城墙来确保我们的未来。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 thebes_missions_01_restoration_task_4:0 "为战争做准备"
 thebes_missions_01_restoration_task_4_A_tooltip:0 "对雇佣兵进行忒拜战法的训练，为与#Y 玻奥提亚#!的战争做准备。"
 thebes_missions_01_restoration_task_4_DESC:0 "我们应该为即将到来的战斗雇用和训练一些雇佣兵。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 thebes_missions_01_restoration_task_4_tooltip:0 "[SCOPE.GetRootScope.GetCountry.GetName|Y]雇佣了一个雇佣兵"
 thebes_missions_01_restoration_task_5:0 "玻奥提亚之争"
 thebes_missions_01_restoration_task_5_DESC:0 "我们不仅要对玻奥提亚发动战争，而且要消灭他们，夺取他们的一切。现在是大胆行动的时候了!\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 thebes_missions_01_restoration_task_6:0 "底比斯的泰斯皮亚"
 thebes_missions_01_restoration_task_6_DESC:0 "瑟斯皮亚，离忒拜本身如此之近，是传播我们文化的理想选择。我们应该建立Thespiai来鼓励这个过程。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 thebes_missions_01_restoration_task_7:0 "底比斯商人"
 thebes_missions_01_restoration_task_7_DESC:0 "我们作为一个城市的发展正在吸引越来越多的游客，但我们目前的基础设施无法支持那些寻求永久搬到忒拜的人。让我们扩大我们的经济区，让更多的商人定居。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 thebes_missions_01_restoration_task_8:0 "忒拜的复兴"
 thebes_missions_01_restoration_task_8_DESC:0 "忒拜开始在希腊崭露头角，开始在声望和影响力上与周边城市抗衡。忒拜本身几乎每天都在增长，越来越多的房屋被建造起来......这让人印象深刻。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 thebes_missions_01_restoration_task_9:0 "统治玻奥提亚"
 thebes_missions_01_restoration_task_9_B_tooltip:0 "获得对[GetProvince('(int32)468').GetArea.GetName|Y]省的宣称"
 thebes_missions_01_restoration_task_9_DESC:0 "既然我们已经拥有了玻奥提亚的大部分地区，那么我们最终控制整个省份也是合理的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 thebes_missions_01_restoration_task_9_tooltip:0 "在[GetProvince('(int32)468').GetArea.GetName|Y]省拥有至少5块领土"
 thebes_missions_01_restoration_task_A_17:0 "任何具有[GetProvince('(int32)440').GetCulture.GetCultureGroup.GetName|Y]文化的独立国家，如果拥有超过#Y 10#!领土，对我们的意见就会超过#Y 30#!"
 thebes_missions_01_restoration_task_B_17:0 "在即将到来的战争中发出援助请求。"
 thebes_missions_02_rivals:0 "古代的对手"
 thebes_missions_02_rivals_CRITERIA_DESCRIPTION:0 "当我们征服了希腊南部的势力后，这个任务就会完成。"
 thebes_missions_02_rivals_DESCRIPTION:0 "现在忒拜已经在首都周围的中心地带站稳了脚跟，是时候制服我们身边的古老敌人了。希腊即将迎来新的一天，在这一天，忒拜的力量是无可挑战的！"
 thebes_missions_02_rivals_task_1:0 "宣称统治地位"
 thebes_missions_02_rivals_task_10:0 "阿提卡的主人"
 thebes_missions_02_rivals_task_10_DESC:0 "忒拜，曾经只是一个勉强能与邻国抗衡的城市国家，取得了许多人做梦都想不到的成就。忒拜现在控制了进入伯罗奔尼撒半岛的陆路通道，加强了她对伟大的宣称，并给人以不可战胜的感觉。\n\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 thebes_missions_02_rivals_task_11:0 "进入优卑亚"
 thebes_missions_02_rivals_task_11_DESC:0 "我们必须保证所有靠近忒拜的省份的安全，优卑亚也不例外。我们觊觎她的出海口，以及流经她港口的丰富贸易。我们会因为将他们的土地加入我们的土地而在经济上获得繁荣。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 thebes_missions_02_rivals_task_12:0 "伯罗奔尼撒的力量"
 thebes_missions_02_rivals_task_12_DESC:0 "我们已经将我们的统治权扩展到伯罗奔尼撒半岛的最顶端，将沉闷的拉栖代梦人的领土纳入我们的版图。让我们从他们的土地上没收我们能没收的东西，看看我们是否能学到任何有用的东西。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 thebes_missions_02_rivals_task_13:0 "忒拜的统治地位"
 thebes_missions_02_rivals_task_13_DESC:0 "太阳在一个统一的希腊上空升起，一个平等分享财富和荣耀的崛起的忒拜国家。人民欢欣鼓舞!\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 thebes_missions_02_rivals_task_1_DESC:0 "亚该亚省和阿提卡省长期以来一直是统治权的竞争对手，但这种情况即将永久改变。让我们准备对他们的领土提出宣称。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 thebes_missions_02_rivals_task_1_tooltip:0 "获得对#Y $achaea_area$#!和#Y $central_greece_area$#!省的宣称。"
 thebes_missions_02_rivals_task_2:0 "攻击阿提卡"
 thebes_missions_02_rivals_task_2_DESC:0 "雅典城将为我们的霸权带来令人难以置信的声誉；让我们通过征服雅典人来增加我们的荣耀。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 thebes_missions_02_rivals_task_3:0 "向斯巴达发起挑战"
 thebes_missions_02_rivals_task_3_DESC:0 "斯巴达军队的战场实力是个神话；真正可怕的军队属于忒拜！。我们将摧毁我们古老的敌人，让世界知道谁拥有希腊最强大的战士！。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 thebes_missions_02_rivals_task_4:0 "斯巴达的毁灭"
 thebes_missions_02_rivals_task_4_DESC:0 "我们将通过掠夺斯巴达的土地，吞噬她的财宝，将她的王位据为己有，来打破斯巴达的势力。他们不会再回来了。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 thebes_missions_02_rivals_task_5:0 "拥抱斯巴达的方式"
 thebes_missions_02_rivals_task_5_DESC:0 "虽然他们是敌人，但斯巴达人是一个高尚的民族，对战争的方式很有智慧。如果我们允许他们保留在我们民族中的身份，我们有可能从他们身上学到很多东西。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 thebes_missions_02_rivals_task_6:0 "主宰亚该亚"
 thebes_missions_02_rivals_task_6_DESC:0 "亚该亚终于服从了我们的统治，我们立即获得了回报；从我们征服的城市和城镇中可以收集到很多知识。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 thebes_missions_02_rivals_task_7:0 "奥林匹克的荣耀"
 thebes_missions_02_rivals_task_7_DESC:0 "现在我们是奥林匹斯山的管理者，我们应该通过改善当地的基础设施来展示我们的慷慨。所有来参加奥运会的人都会钦佩忒拜的慷慨，知道我们是希腊的真正主人。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 thebes_missions_02_rivals_task_8:0 "底比斯的阿卡迪亚"
 thebes_missions_02_rivals_task_8_DESC:0 "缓慢但肯定的是，我们的力量延伸到了整个伯罗奔尼撒半岛。征服反叛的希腊城邦有很多好处，财政上的意外收获当然也在其中。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 thebes_missions_02_rivals_task_9:0 "阿尔戈斯之城"
 thebes_missions_02_rivals_task_9_DESC:0 "众所周知，忒拜人在他们统治的地方带来了文明和繁荣，阿尔戈斯城也不例外。看到忒拜是如何美化她的，这个港口城市每天都有来自各地的游客涌入。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 thebes_missions_03_prosperity:0 "忒拜的繁荣"
 thebes_missions_03_prosperity_CRITERIA_DESCRIPTION:0 "当希腊成为一个经济强国时，这个使命才算完成。"
 thebes_missions_03_prosperity_DESCRIPTION:0 "现在我们有一个合适的王国来管理，我们应该专注于提高我们已经拥有的东西的价值。通过在国内建立一个强大的基础，我们确保我们在国外的权力。"
 thebes_missions_03_prosperity_task_1:0 "希腊最伟大的城市"
 thebes_missions_03_prosperity_task_10:0 "忒拜的贵族"
 thebes_missions_03_prosperity_task_10_DESC:0 "通过建立我们的学院，我们可以鼓励贵族为我们做更多的事情，而不是他们目前已经做的；这是一个双赢的局面。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 thebes_missions_03_prosperity_task_11:0 "忒拜的公民"
 thebes_missions_03_prosperity_task_11_DESC:0 "那些爱打官司的忒拜公民正在享受他们的法律特权，也许有点太多，我们的法庭被无聊和琐碎的诉讼所淹没--我们需要更多。不过，这也是我们文明方式的一个证明，我们应该鼓励。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 thebes_missions_03_prosperity_task_12:0 "促进公民的发展"
 thebes_missions_03_prosperity_task_12_A_tooltip:0 "至少有#Y 100#!公民@citizen!.[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_12_pops_loc')] "
 thebes_missions_03_prosperity_task_12_B_tooltip:0 "至少#Y 5#!个领土拥有#Y 3#!法院建筑。（#Y 当前：[SCOPE.ScriptValue('thebes_missions_03_prosperity_task_12_courts_total')|0]#!）"
 thebes_missions_03_prosperity_task_12_DESC:0 "我们的城市充满了渴望成为公民的人，谁能责怪他们想参与忒拜的公民生活呢？让我们建设我们的基础设施，以适应对我们的法律系统前所未有的需求。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 thebes_missions_03_prosperity_task_12_pops_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_12_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_12_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_12_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_12_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_12_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_13:0 "促进贵族的发展"
 thebes_missions_03_prosperity_task_13_A_tooltip:0 "至少有#Y 65#!贵族@nobles!。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_13_pops_loc')] "
 thebes_missions_03_prosperity_task_13_B_tooltip:0 "至少#Y 5#!个领土拥有#Y 3#!学院建筑。（#Y 当前：[SCOPE.ScriptValue('thebes_missions_03_prosperity_task_13_academies_total')|0]#!）"
 thebes_missions_03_prosperity_task_13_DESC:0 "虽然所有有财产的人在特班世界中都有权利，但我们的贵族在我们的社会中受到很好的对待，这不是什么秘密，事实上，通过与国家合作，贵族们以我们感激的方式使我们受益。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 thebes_missions_03_prosperity_task_13_pops_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_13_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_13_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_13_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_13_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_13_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_14:0 "希腊的橄榄"
 thebes_missions_03_prosperity_task_14_DESC:0 "我们的橄榄，以及用它制成的珍贵的油，长期以来一直润滑着希腊的经济引擎；我们应该扩大这种与我们密切相关的宝贵的经济作物的产出。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 thebes_missions_03_prosperity_task_14_olives_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_14_olives_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_14_olives_total')|0]#!)"
 thebes_missions_03_prosperity_task_14_olives_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_14_olives_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_14_olives_total')|0]#!)"
 thebes_missions_03_prosperity_task_14_tooltip:0 "在#Y 希腊#!区域产出至少#Y 30橄榄#!@olive!。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_14_olives_loc')]"
 thebes_missions_03_prosperity_task_15:0 "希腊葡萄酒"
 thebes_missions_03_prosperity_task_15_DESC:0 "在人们聚集的每一个地方，无论是庞大领地的领主还是从田地里回来的卑微农民，都会斟满希腊的葡萄酒，庆祝生活。为我们葡萄园的持续发展干杯！\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 thebes_missions_03_prosperity_task_15_tooltip:0 "在#Y 希腊#!地区至少生产#Y 25葡萄酒#!@wine!。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_15_wine_loc')] "
 thebes_missions_03_prosperity_task_15_wine_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_15_wine_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_15_wine_total')|0]#!)"
 thebes_missions_03_prosperity_task_15_wine_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_15_wine_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_15_wine_total')|0]#!)"
 thebes_missions_03_prosperity_task_1_DESC:0 "忒拜，这个崛起的城邦征服了她周围的一切，无疑是希腊最伟大的城市。我们将开始一场反映这一新身份的城市化运动。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 thebes_missions_03_prosperity_task_2:0 "忒拜的大都市"
 thebes_missions_03_prosperity_task_2_DESC:0 "忒拜，曾经是一个卑微的城堡，坐落在科佩斯湖附近的悬崖峭壁上，现在已经成为全希腊最大的城市之一，这与这样一个辉煌的大国是相称的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 thebes_missions_03_prosperity_task_3:0 "玻奥提亚的发展"
 thebes_missions_03_prosperity_task_3_DESC:0 "通过对玻奥提亚城市的投资，我们得到的不仅仅是我们所花的钱。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 thebes_missions_03_prosperity_task_3_tooltip:0 "#Y 玻奥提亚#!省至少有#Y 20#!个建筑。[SCOPE.GetRootScope.GetCountry.Custom('generic_25_buildings_svalue_loc')]"
 thebes_missions_03_prosperity_task_4:0 "玻奥提亚的繁荣"
 thebes_missions_03_prosperity_task_4_DESC:0 "玻奥提亚，这个有幸成为光荣的忒拜城所在地的省份，正在成为文明世界的羡慕对象。任何有能力的人都渴望住在这个省份，渴望靠近首都。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 thebes_missions_03_prosperity_task_4_pops_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_4_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_4_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_4_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_4_pops_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_4_pops_total')|0]#!)"
 thebes_missions_03_prosperity_task_4_tooltip:0 "#Y 玻奥提亚#!省至少有#Y 135#!个人口。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_4_pops_loc')]"
 thebes_missions_03_prosperity_task_5:0 "阿提卡的知识分子"
 thebes_missions_03_prosperity_task_5_DESC:0 "我们应该投资于已经在整个阿提卡建立的伟大的学习中心，鼓励古代哲学的繁荣发展。这只会增加忒拜的威望，他们应该被誉为矛和笔的主人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 thebes_missions_03_prosperity_task_5_tooltip:0 "在#Y $central_greece_area$#!中的省份里总共至少有20#Y 学院、图书馆或法院#!建筑。[SCOPE.GetRootScope.GetCountry.Custom('generic_area_mission_25_academic_buildings_loc')]"
 thebes_missions_03_prosperity_task_6:0 "伯罗奔尼撒军事中心"
 thebes_missions_03_prosperity_task_6_DESC:0 "伯罗奔尼撒半岛居民的尚武精神对我们来说是很重要的，可以为我们自己的目的加以利用。让我们提升他们的军事结构，这样我们就可以用特巴人的方式训练他们。\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 thebes_missions_03_prosperity_task_6_tooltip:0 "在#Y $south_peleponnesos_area$#! 省的自有领土上至少建造了#Y 20座兵营、磨坊或训练营#![SCOPE.GetRootScope.GetCountry.Custom('generic_area_mission_25_military_buildings_loc')] "
 thebes_missions_03_prosperity_task_7:0 "阿卡迪亚贸易"
 thebes_missions_03_prosperity_task_7_DESC:0 "阿卡迪亚省的地理位置，可以作为一个漏斗，提取伯罗奔尼撒的财富。如果不增加我们在这个繁荣地区的经济存在，那将是愚蠢的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 thebes_missions_03_prosperity_task_7_tooltip:0 "在#Y $arcadia_area$#!的省内，至少有#Y 20个市场、税务局或港口#!建筑建在拥有的领土上。[SCOPE.GetRootScope.GetCountry.Custom('generic_area_mission_25_economy_buildings_loc')] "
 thebes_missions_03_prosperity_task_8:0 "亚该亚的进步"
 thebes_missions_03_prosperity_task_8_B_tooltip:0 "#Y 亚该亚#!的省份至少有#Y 20#!个建筑。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_8_buildings_loc')] "
 thebes_missions_03_prosperity_task_8_DESC:0 "通过在整个亚该亚建立和发展城市，我们将在经济和军事上巩固我们的力量。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 thebes_missions_03_prosperity_task_8_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_8_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_8_buildings_total')|0]#!)"
 thebes_missions_03_prosperity_task_8_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_8_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_8_buildings_total')|0]#!)"
 thebes_missions_03_prosperity_task_8_tooltip:0 "#Y 亚该亚#!省里至少有#Y 5#!座#Y 城市#!。"
 thebes_missions_03_prosperity_task_9:0 "世界上最富有的土地"
 thebes_missions_03_prosperity_task_9_DESC:0 "我们为希腊带来了一个富裕的时代；我们的国库与我们的经济成就相称地增长。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 thebes_missions_03_prosperity_task_9_income_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_9_income_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_9_income_total')|0]#!)"
 thebes_missions_03_prosperity_task_9_income_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_9_income_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_03_prosperity_task_9_income_total')|0]#!)"
 thebes_missions_03_prosperity_task_9_tooltip:0 "在#Y 希腊#!区域中拥有的所有省份的综合总收入至少为#Y 10#!。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_03_prosperity_task_9_income_loc')]"
 thebes_missions_04_conquest:0 "忒拜的扩张"
 thebes_missions_04_conquest_CRITERIA_DESCRIPTION:0 "随着伟大的忒拜帝国的建立，这项使命将被视为完成！"
 thebes_missions_04_conquest_DESCRIPTION:0 "毋庸置疑，作为希腊的主人，忒拜的大国现在正寻求在她已经很强大的边界之外扩张。在强大的经济和可怕的军队的支持下，几乎没有人能够阻止忒拜的扩张......"
 thebes_missions_04_conquest_task_1:0 "横跨爱琴海"
 thebes_missions_04_conquest_task_10:0 "进入亚洲"
 thebes_missions_04_conquest_task_10_DESC:0 "忒拜公布了他们在亚洲的野心，使该地区的所有王国都处于高度警惕之中。除了完全控制，似乎没有什么能让忒拜满意。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 thebes_missions_04_conquest_task_11:0 "亚洲的主人"
 thebes_missions_04_conquest_task_11_DESC:0 "忒拜的力量沿着亚洲海岸席卷而来，延伸到远离科佩斯湖的城市的领土。似乎忒拜会索取她所能得到的一切。\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 thebes_missions_04_conquest_task_12:0 "色雷斯之事"
 thebes_missions_04_conquest_task_12_DESC:0 "色雷斯区域之所以对我们极具吸引力，原因有很多，其中最不重要的便是它作为两大洲之间门户的战略位置。若能在此取得胜利，对我们大有裨益。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 thebes_missions_04_conquest_task_13:0 "拜占庭之城"
 thebes_missions_04_conquest_task_13_DESC:0 "拜占庭城靠近博斯普鲁斯海峡，这是一条分隔欧洲和亚洲的狭窄水道。拥有这座城市将使我们在通往黑海的贸易中分得一杯羹。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 thebes_missions_04_conquest_task_13_tooltip:0 "在[GetProvince('(int32)350').GetArea.GetRegion.GetName|Y]地区至少有#Y 10#!座#Y 城市#!，其中至少有#Y 8#!个建筑，并且没有正在进行的建设。"
 thebes_missions_04_conquest_task_14:0 "色雷斯的城市"
 thebes_missions_04_conquest_task_14_DESC:0 "我们应该加固色雷斯的城市，建设它们，使我们在该地区的立足点真正建立起来——毕竟从吕西玛刻亚到忒拜有很长的路要走。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 thebes_missions_04_conquest_task_15:0 "发展中的亚洲"
 thebes_missions_04_conquest_task_15_DESC:0 "富裕的亚洲地区在我们的领导下熠熠生辉；黄金的河流涌入城市，进入我们的国库。让我们尽可能多地进行建设，并获得回报!\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 thebes_missions_04_conquest_task_15_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_04_conquest_task_15_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_15_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_15_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_15_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_15_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_15_tooltip:0 "在#Y 亚细亚#!地区至少有#Y 125#!座建筑。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_04_conquest_task_15_buildings_loc')]"
 thebes_missions_04_conquest_task_16:0 "进入比提尼亚"
 thebes_missions_04_conquest_task_16_DESC:0 "确保比提尼亚安全不仅对我们的经济有好处，而且对我们的军队也有好处；这个动荡的地区是一个获得军事经验的好训练场。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 thebes_missions_04_conquest_task_17:0 "弗里吉亚人的推动"
 thebes_missions_04_conquest_task_17_DESC:0 "忒拜在征服安纳托利亚高原的大片土地上取得了实质性的进展，将越来越多的当地民众的钱币送入我们的税收中心。\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 thebes_missions_04_conquest_task_18:0 "忒拜的色雷斯"
 thebes_missions_04_conquest_task_18_DESC:0 "忒拜已经完全确立了她在色雷斯的领主地位，使这一重要地区成为忒拜力量的另一个前哨。任何想通过博斯普鲁斯海峡的人现在都必须服从忒拜的权力。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 thebes_missions_04_conquest_task_19:0 "比提尼亚贸易"
 thebes_missions_04_conquest_task_19_DESC:0 "通过对税务局、港口和市场的投资，比特尼亚的贸易流可以被简化，以获得最大的收入。\n\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 thebes_missions_04_conquest_task_19_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_04_conquest_task_19_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_19_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_19_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_19_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_19_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_19_tooltip:0 "在#Y 比提尼亚#!地区至少建造了#Y 50#!个#Y 市场, 港口, 或税务所#!建筑。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_04_conquest_task_19_buildings_loc')]"
 thebes_missions_04_conquest_task_1_DESC:0 "爱琴海的贸易争端有可能演变成全面的小规模冲突，迫使忒拜对水域对面的土地提出宣称。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 thebes_missions_04_conquest_task_2:0 "马其顿人的阴谋"
 thebes_missions_04_conquest_task_20:0 "弗里吉亚的繁荣"
 thebes_missions_04_conquest_task_20_DESC:0 "菲尔吉亚的城市将与沿海地区的姐妹们争夺伟大的地位 这一切都归功于忒拜不容置疑的力量 他将资源投入到该地区的发展中去\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!!"
 thebes_missions_04_conquest_task_20_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_04_conquest_task_20_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_20_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_20_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_20_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_20_buildings_total')|0]#!)"
 thebes_missions_04_conquest_task_20_tooltip:0 "在#Y 弗里吉亚#!地区至少有#Y 100#!座建筑。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_04_conquest_task_20_buildings_loc')]"
 thebes_missions_04_conquest_task_21:0 "大理石矿"
 thebes_missions_04_conquest_task_21_DESC:0 "我们控制的采石场的大理石在全世界都有需求，被赞誉为金钱能买到的最好的东西。我们应该鼓励扩大大理石的生产以满足需求。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 thebes_missions_04_conquest_task_22:0 "忒拜的土地"
 thebes_missions_04_conquest_task_22_DESC:0 "我们已经超越了卑微的起点，成为横跨欧亚的最伟大的国家；伟大的底比斯帝国的荣耀万岁！。\n\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 thebes_missions_04_conquest_task_23:0 "Theban军团"
 thebes_missions_04_conquest_task_23_DESC:0 "虽然我们的军团让人羡慕，但我们应该投资一个专业的军团，一个可以激励我们军队的军团。\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 thebes_missions_04_conquest_task_24:0 "一个值得信赖的指挥官"
 thebes_missions_04_conquest_task_24_DESC:0 "一个Theban军团应该由我们所掌握的最优秀的军事人才来指挥；我们要求有能力的底线，不会接受任何我们认为不合格的人。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 thebes_missions_04_conquest_task_24_tooltip:0 "任何拥有至少#Y 10#!单位的军团，其指挥官至少有#Y 10武略#!@military_icon!"
 thebes_missions_04_conquest_task_25:0 "忒拜的勇士们"
 thebes_missions_04_conquest_task_25_DESC:0 "我们的军团，由金钱能买到的最好的人和装备组成，应该在战场上证明自己。一旦他们经过考验，我们预测敌人会完全屈服。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 thebes_missions_04_conquest_task_25_tooltip:0 "忒拜的军团在接受上一个任务后，至少赢得了#Y 10#!场战斗（当前。#Y [SCOPE.ScriptValue('thebes_legion_battles_won_svalue')|0]#!）"
 thebes_missions_04_conquest_task_26:0 "忒拜的冠军"
 thebes_missions_04_conquest_task_26_DESC:0 "我们的军团已经成为传说一般，也许甚至超过了昔日圣军的神圣故事。我们的军团能让所有被派到他们面前的人屈服，我们的军团是真正的忒拜冠军。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 thebes_missions_04_conquest_task_26_tooltip:0 "忒拜军团已经赢得了至少#Y 25#!战役\n（当前：#Y [SCOPE.ScriptValue('thebes_legion_battles_won_svalue')|0]#!）"
 thebes_missions_04_conquest_task_2_DESC:0 "马其顿人曾经是我们的眼中钉，我们当然不能相信他们会兑现他们的承诺。也许我们应该把我们的土地扩展到马其顿本身。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 thebes_missions_04_conquest_task_3:0 "主宰帖撒利"
 thebes_missions_04_conquest_task_3_DESC:0 "拿下杰出的帖撒利省肯定会提高我们的知名度；帖撒利平原将为我们提供进入北方的完美立足点。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 thebes_missions_04_conquest_task_4:0 "底比斯的帖撒利"
 thebes_missions_04_conquest_task_4_DESC:0 "我们卓越玻奥提亚文化的不可阻挡的吸引力将很快使帖撒利变得更好，激励当地人放弃他们低劣的方式而选择我们的方式。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 thebes_missions_04_conquest_task_4_pop_loc_1:0 "(#R [SCOPE.ScriptValue('thebes_missions_04_conquest_task_4_pop_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_4_pop_total')|0]#!)"
 thebes_missions_04_conquest_task_4_pop_loc_2:0 "(#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_4_pop_current')|0]#!/#Y [SCOPE.ScriptValue('thebes_missions_04_conquest_task_4_pop_total')|0]#!)"
 thebes_missions_04_conquest_task_4_tooltip:0 "#Y $thessaly_area$#!地区至少拥有#Y 100#![SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]文化的人口。[SCOPE.GetRootScope.GetCountry.Custom('thebes_missions_04_conquest_task_4_pop_loc')]"
 thebes_missions_04_conquest_task_5:0 "推动珀拉的发展"
 thebes_missions_04_conquest_task_5_DESC:0 "珀拉将屈服于忒拜的力量！除了征服之外，这个城市没有其他可能的结果，除了忒拜的军队取得完全的胜利之外，也没有其他结果。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 thebes_missions_04_conquest_task_6:0 "马其顿的主人"
 thebes_missions_04_conquest_task_6_DESC:0 "现在我们已经征服了整个马其顿，众所周知--不，是期望--我们要掠夺土地，并拿我们能拿的东西作为赔偿。被征服的人确实有祸了。\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 thebes_missions_04_conquest_task_7:0 "马其顿的城市"
 thebes_missions_04_conquest_task_7_DESC:0 "马其顿给了我们很多，所以美化我们所占领的城市是我们能做的最低限度。召集信使，向北发送消息，开展大规模的建设活动。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 thebes_missions_04_conquest_task_7_tooltip:0 "在[GetProvince('(int32)415').GetArea.GetRegion.GetName|Y]地区至少有#Y 10#!座#Y 城市#!，其中至少有#Y 8#!个建筑，并且没有正在进行的建设。"
 thebes_missions_04_conquest_task_8:0 "以弗所城 "
 thebes_missions_04_conquest_task_8_DESC:0 "我们想要的不仅仅是以弗所城的位置选择--我们还想要她库房里的所有硬币。夺取它们。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 thebes_missions_04_conquest_task_9:0 "埃里斯莱的人民"
 thebes_missions_04_conquest_task_9_DESC:0 "忒拜深入到伊奥尼亚本土，将埃里斯莱的人民从压迫中解放出来，并将他们带入安全地带。作为一个重要的战略和经济地点，埃里斯莱是值得开发的。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"

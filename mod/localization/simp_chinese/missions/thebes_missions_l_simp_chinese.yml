 glory_of_olypmus:0 "奥林匹斯的荣耀"
 great_theban_empire:0 "伟大的忒拜帝国"
 me_thebes_1.a:0 "是时候建设了！"
 me_thebes_10.a:0 "我们将繁荣昌盛！"
 me_thebes_10.b:0 "毕蒂亚在胡说八道......"
 me_thebes_10.c:0 "嗯，这不是好事......"
 me_thebes_10.d:0 "这绝对是个好消息！！！"
 me_thebes_10_desc_1:0 "在阿波罗的圣殿里，一切都很安静和平静，[ROOT.GetCountry.GetRuler.GetName]已经来到这里，与德尔斐的皮提亚神谕者进行磋商。就在刚才，[ROOT.GetCountry.GetRuler.GetHerHis]完成了一个寻求知识的来访朝圣者的必要步骤；一只你能找到的最好的黑公羊被献上，[ROOT.GetCountry.GetRuler.GetFirstName]给神庙的看守人留下了慷慨的捐款。\n\n在短暂的等待之后，[ROOT.GetCountry.GetRulerTitle]被带入了皮提亚发表预言的房间。当蒸汽从她的三角架下面的裂缝中流出时，皮提亚向后滚动她的头并抽搐着，这些话从她的嘴里参差不齐地喷出，让[ROOT.GetCountry.GetRuler.GetFirstName]感到一阵寒意——[ROOT.GetCountry.GetRuler.GetName]将领导[ROOT.GetCountry.GetName]走向伟大！"
 me_thebes_10_desc_2:0 "你已经进入了Pythia的房间，这是一个黑暗的洞穴，位于阿波罗神殿的下面。空气中弥漫着燃烧的月桂叶和发黑的大麦的腐臭味，这种难闻的气味让你想起了你所见过的战场。房间里有一种紧张的感觉，这是你所没有想到的。当你透过阴霾看时，一滴汗珠从你的额头流下，你的眼睛试图适应阴暗的环境。当你听到毕蒂亚说话时，一种庄严的语调让你的头发都竖起来了，你的心在她的话中落到了肚子里--[ROOT.GetCountry.GetRuler.GetName]将带领我们走向毁灭..."
 me_thebes_10_desc_3:0 "当你转身离开皮提亚的房间时，当你的双腿颤抖着走回渐渐消失的阳光下时，你可以看到你的随行人员在外面等待的期待的脸。当他们的目光与你相遇时，他们的脸一下子都变黑了，有些人向后退了一步，显然对你的苍白感到震惊。你试图笑，但只设法咳嗽了一下。摇摇头，你清了清嗓子，下达了离开的命令。当你穿过越来越浓的阴霾向镇上走去时，预言中的话语在你脑海中跌宕起伏。虽然被指责为说谜语，但今晚的皮提亚却直言不讳，一再重复同样的话；[ROOT.GetCountry.GetRuler.GetName]将很快死去......"
 me_thebes_10_desc_4:0 "虽然你介绍自己是[ROOT.GetCountry.GetRuler.GetName]，皮提亚女祭司却以谜语讲述着阿吉德家族的荣耀。她奇异的比喻令人困惑——如树枝上延伸的新杈，蛇吞噬自己而成为一体。古老的血脉毁灭，古老的血脉重生。女祭司凝视着你，称你为卡拉努斯的孩子......她在说什么？她会不会真的是说......"
 me_thebes_10_title:0 "德尔斐的神谕"
 me_thebes_11.a:0 "他们将斩杀忒拜的敌人！"
 me_thebes_11_desc:0 "在古代，忒拜城是靠圣军的力量保护着，这是一支由一百五十对男性士兵组成的精英部队，是我们部队的核心。圣军因彼此相爱而结合在一起，愿意为忒拜的荣耀而牺牲，他们将再次崛起，带领我们的军队进行新的征战！"
 me_thebes_11_title:0 "圣队"
 me_thebes_12.a:0 "我们将不放过任何东西......也不放过任何人"
 me_thebes_12_desc:0 "[GetProvince('(int32)423').GetName]城被所有真正的忒拜人所鄙视，这是有充分理由的；自古以来，我们就与科林斯湾对岸的讨厌邻居进行战争，与他们的军队进行了多次激烈的争夺战。现在，在[ROOT.GetCountry.GetRuler.GetName]的时代，再次向我们永恒的敌人开战的时候到了。\n\n在我们的历史上，我们曾经两次彻底摧毁了他们的城市，把石砖一块一块拆下直到什么都不剩，然而居住在Orochomenos焦黑的废墟上的恶棍们并没有停止对[GetProvince('(int32)426').GetName]的善良公民进行挑衅和背叛的罪行。但是不能再这样了!在[GetProvince('(int32)423').GetName]的大街小巷让我们的士兵发泄，告诉他们摧毁一切！烧毁田地，杀死所有的人。烧掉田地，杀死所有的牲畜!给他们一个教训，让他们的子孙记住！"
 me_thebes_12_title:0 "俄尔科墨诺斯的第三次毁灭"
 me_thebes_13.a:0 "忒拜是光荣的！"
 me_thebes_13_desc:0 "雅典——这颗希腊皇冠上璀璨的明珠，终于向[ROOT.GetCountry.GetName]的强权臣服，举国上下欢庆不已。尽管有人仍怀念雅典往昔与我国结盟时的贡献，但所有人都认同：如今的局势对忒拜最为有利。"
 me_thebes_13_title:0 "摧毁吾敌雅典！"
 me_thebes_14.a:0 "忒拜是光荣的！"
 me_thebes_14_desc:0 "既然我们已经巩固了直接围绕忒拜腹地的领土，那么我们通过确保对亚该亚省的统治来继续扩张就不足为奇了。按照我们目前的军事扩张速度，忒拜的力量将很快征服整个文明世界！"
 me_thebes_14_title:0 "亚该亚是我们的！"
 me_thebes_15.a:0 "发送一个简单的援助请求"
 me_thebes_15.b:0 "发送黄金与提议"
 me_thebes_15.c:0 "[ROOT.GetCountry.GetRuler.GetFirstName]应亲自提出这一请求"
 me_thebes_15_desc:0 "虽然我们的部队在战场上的表现令人钦佩，但你的一些顾问担心我们可能会出现人力不足的情况，如果诸神在战斗中抛弃我们，我们将发现自己处于一个微妙的处境。我们是否应该联系我们的朋友[dick_head.GetName]，也许，问问他们是否愿意援助我们？我们一定会记得这个人情。"
 me_thebes_15_title:0 "恳请帮助"
 me_thebes_16.a:0 "[dick_head.GetName]将在战争爆发时出兵！"
 me_thebes_16_desc:0 "我们的使节带着好消息回来了!看来，当我们的现状传到[dick_head.GetName]的宫廷时，他们很快就想起了他们作为忒拜的朋友的义务，并承诺为我们提供我们所要求的一切。他们在支持我们方面的选择是明智的！"
 me_thebes_16_title:0 "接受提议"
 me_thebes_17.a:0 "[dick_head.GetName]将永远被称为忒拜的朋友"
 me_thebes_17_desc:0 "当约定的日子到来时，你不必等待太久，你的朋友[dick_head.GetName]承诺的部队就会到达忒拜。那是一群怎样的勇士，被派到你这里来了![dick_head.GetName]一定是向你提供了他们所能提供的最好的人。随着我们自己的力量被这些数字所增强，这是我们永恒的朋友的慷慨礼物，我们将是不可阻挡的。"
 me_thebes_17_title:0 "部队从[dick_head.GetName]抵达"
 me_thebes_18.a:0 "我们将粉碎他们，破除他们不可战胜的神话！"
 me_thebes_18_desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName]，时机已到；即使现在，我们的军队也在集结，摧毁[GetProvince('(int32)427').GetName]是他们的使命。长久以来，我们一直忍受着拉凯戴蒙人的侮辱，但我们要让他们的舌头彻底安静下来!弟兄们，拿起武器吧!把所有斯巴达人送回他们的盾牌上！"
 me_thebes_18_title:0 "泰坦的冲突"
 me_thebes_19.a:0 "在一千年后，'斯巴达'这个名字将被遗忘......"
 me_thebes_19_desc:0 "命运是一件不可能理解的事情，命运的曲折隐藏在凡人的眼中，这是有原因的--因为我们中谁能理解神明为我们准备了什么灾难和不幸？谁能预见到[GetProvince('(int32)427').GetName]的毁灭，她的军队在[ROOT.GetCountry.GetRuler.GetFirstName]的指挥下被屠杀并化为灰烬？\n\n斯巴达，你这个愚人和懦夫的骄傲女儿，你已经得到了残酷的教训；不仅你的权力被永远摧毁，而且象征你王权的斯巴达皇冠，现在是我们国库中另一个饰品。"
 me_thebes_19_title:0 "斯巴达的毁灭"
 me_thebes_1_desc:0 "忒拜在近来的记忆中遭受了巨大苦难；我们曾在强邻占领下幸存，也见证了许多珍视之物被彻底摧毁，但如今重建的时候到了。这是一个新时代的开端，也可以说是我们城市的再奠基；在我们的领导下，忒拜将建成前所未有的荣耀。"
 me_thebes_1_title:0 "迈出第一步"
 me_thebes_2.a:0 "忒拜将是光荣的！"
 me_thebes_20.a:0 "失败是一件令人痛苦的事情，但如果一个人谦虚的话，他可以学到很多东西"
 me_thebes_20_desc:0 "[GetProvince('(int32)427').GetName]的居民无法相信[ROOT.GetCountry.GetRuler.GetFirstName]对他们表现出的慷慨大方。我们完全有权利彻底消灭他们，但我们却决定放过他们。斯巴达人是一个古老的民族，他们的军事传统肯定可以为我们的人民所用。我们能够承认这一点，并向我们的斯巴达朋友学习，这表明我们作为一个国家的成熟。"
 me_thebes_20_title:0 "斯巴达的友谊"
 me_thebes_21.a:0 "我们将在我们的王国里应用这些教训"
 me_thebes_21_desc:0 "在征服[GetProvince('(int32)427').GetArea.GetName]后，[ROOT.GetCountry.GetRuler.GetName]所做的第一件事便是造访当地的图书馆和神庙，希望找到[ROOT.GetCountry.GetAdjective]人民尚未知晓的典籍。这片土地资源丰饶，拉科尼亚湾附近盛产鱼类，这样的富庶催生了一个闲适的阶层，他们全心投入艺术追求。\n\n尽管图书管理员有些微词，但我们的收集者并未拿取太多，生活依旧如常。"
 me_thebes_21_title:0 "欧博亚远征"
 me_thebes_22.a:0 "我们将在某一天亲自访问这座城市"
 me_thebes_22_desc:0 "[GetProvince('(int32)440').GetName]是我们格外重视的城市，因为它位于阿尔戈利斯，在下方平原之上占据卓越位置。虽然这座坚毅城市的居民起初曾抵抗征服，但所有人都乐于见到我们为这座城市所做的一切：我们以宽和方式统治，尊重他们的传统，并强化其既有优势。我们的建设工程使它，恕我直言，甚至比过去更加出色。凭借天然防御力和居高临下的位置，再加上我们的愿景和财力支持作为引导，[GetProvince('(int32)440').GetName]有望成为我国第二，或许第三重要的城市。"
 me_thebes_22_title:0 "阿尔戈斯"
 me_thebes_23.a:0 "确保每个人都知道谁在负责--[ROOT.GetCountry.GetRuler.GetFirstName]"
 me_thebes_23_desc:0 "消息正在[GetProvince('(int32)427').GetArea.GetRegion.GetName]全境传播，人们称赞我们在[GetProvince('(int32)439').GetName]省所做的一切。我们重建了这座城市，使用可以买到和调集到的最优质大理石与砖材，并创造出市民和访客都乐于享用的公共空间。那些栽满芬芳树木的花园尤其受欢迎，它们提供荫凉，也为疲惫者提供休憩之处。"
 me_thebes_23_title:0 "奥林匹斯的荣耀"
 me_thebes_24.a:0 "就像你说的，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_thebes_24_desc:0 "把收税员派到[GetProvince('(int32)441').GetArea.GetName]，告诉他们有我们的祝福，可以对当地人进行创造性的工作......我们不在乎如何达到定额。"
 me_thebes_24_title:0 "给羊剪毛"
 me_thebes_25.a:0 "为进一步的辉煌干杯！"
 me_thebes_25_desc:0 "[GetProvince('(int32)416').GetArea.GetName]已经落入我们手中，[ROOT.GetCountry.GetRuler.GetFirstName]。除了这些事实之外，没有什么可报告的；我们的士兵只是比我们的敌人表现得更好。在最重要的时刻，我们忍住了，而我们的敌人却没有。对我们来说，这是一个多么有声望的时刻，因为我们征服了如此高贵和受人尊敬的敌人!这个消息将使全世界为之侧目。"
 me_thebes_25_title:0 "阿提卡的权势"
 me_thebes_26.a:0 "我们面前的路继续向前走......"
 me_thebes_26_desc:0 "[ROOT.GetCountry.GetRuler.GetName]成就了游吟诗人将世代传颂的伟业——在整个[GetProvince('(int32)427').GetArea.GetRegion.GetName]地区建立了希腊霸权。外族统治者再也不能远在他乡，对我们的生活方式和传统一无所知却统治我们的家园与村庄。我们势力的崛起向世界证明：希腊最好的统治者就是生活在这片土地上的人民，这个真理将被永远铭记。"
 me_thebes_26_title:0 "忒拜的统治地位"
 me_thebes_27.a:0 "这些土地将在我们的统治下繁荣"
 me_thebes_27_desc:0 "如您所知，[ROOT.GetCountry.GetRuler.GetFirstName]，我们胜利的军队已经为[GetProvince('(int32)410').GetArea.GetName]带来和平与繁荣。我们很高兴报告，税吏已经从我们如今统治的城市收得一笔可观钱款，而且可以期待贸易收入随时间继续增长。您当初建议来到这里，确实英明。"
 me_thebes_27_title:0 "欧博亚远征"
 me_thebes_28.a:0 "忒拜高于一切！"
 me_thebes_28_desc:0 "没有人可以否认，我们最后的战役让我们的人民付出了巨大的代价，尽管我们最终战胜了我们的敌人，但在恢复那些被无休止的战斗蹂躏的土地方面，还有很多工作要做。当被问及我们的哪块领土应该首先获得升级时，[ROOT.GetCountry.GetRuler.GetFirstName]大笑起来，只说了一个字--[GetProvince('(int32)426').GetName]。"
 me_thebes_28_title:0 "希腊最伟大的城市"
 me_thebes_29.a:0 "杰出的工作!给我们的工程师一个捐赠"
 me_thebes_29_desc:0 "终于，我们从建筑师那里得到消息，我们在[GetProvince('(int32)426').GetName]的建设活动已经完成!大都市已经被完全重新规划；商业区和行政区几乎增加了一倍，我们的工程师煞费苦心地建造了足以容纳四辆马车的林荫道和街道。即使是现在，马赛克艺术家也在争先恐后地对宫殿进行最后的修饰；当所有的事情都完成后，[GetProvince('(int32)426').GetName]将成为世界上最美丽的城市。"
 me_thebes_29_title:0 "底比斯大都市"
 me_thebes_2_desc:0 "底比斯的力量正再次增长，为了维持我们的地位，我们必须把控制扩展到周边领土。与您最亲近顾问的磋商已经结束，事情也已定下；我们将在关注疆界之外局势的同时扩张边境。"
 me_thebes_2_title:0 "冲出玻奥提亚"
 me_thebes_2_tooltip:0 "获得对[GetProvince('(int32)468').GetName]的宣称"
 me_thebes_3.a:0 "荣耀归于忒拜！"
 me_thebes_30.a:0 "完全按照我们的计划"
 me_thebes_30_desc:0 "[GetProvince('(int32)426').GetArea.GetName]正在蓬勃发展，享受[GetProvince('(int32)426').GetArea.GetRegion.GetName]从未见过的繁荣时代。每天都可以看到数以百计的小渔船在科帕斯湖水域拖网，希望能在[GetProvince('(int32)426').GetName]的鱼市上找到一些东西出售。我们听说，在这些水域发现的鳗鱼往往是四到五德拉克马一条，与较贫穷的国家相比，这是一个惊人的数字，但我们的人民却能轻易负担这些价格。在[GetProvince('(int32)426').GetArea.GetName]，每个人似乎都是有钱人；为什么诸神会赐予我们的人民这么多好东西？"
 me_thebes_30_title:0 "所有人的繁荣时代"
 me_thebes_31.a:0 "在我们的土地上，我们对各种人都有用处..."
 me_thebes_31_desc:0 "众所周知，[GetProvince('(int32)416').GetArea.GetName]是一片充满思想家与哲学家的土地，他们质疑我们周围的世界，并试图运用心智力量寻找环绕我们的奥秘之答案。我们知道，过去曾在[GetProvince('(int32)416').GetArea.GetName]这样的地方建立学校；如今我们决定效法前人，在全省各地兴建学院。我们期待通过扩大求学机会而受益。"
 me_thebes_31_title:0 "阿提卡的知识分子"
 me_thebes_32.a:0 "我们的敌人将在我们的攻势面前崩溃！"
 me_thebes_32_desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName]，您听到这个消息一定会非常高兴：我们终于在伯罗奔尼撒建成了训练营。战士队伍日益壮大，由我军最优秀的士兵加以训练。很快，我们就将横扫敌人的领土，吞噬他们，并永远摧毁他们的力量。"
 me_thebes_32_title:0 "伯罗奔尼撒的力量"
 me_thebes_33.a:0 "我们相信你，[ROOT.GetCountry.GetRuler.GetFirstName]"
 me_thebes_33_desc:0 "来自[GetProvince('(int32)426').GetArea.GetName]的领导家族的代表找到了我们，他们要求我们暂时推迟一些对外战争，以便我们可以发展我们的祖国。诚然，我们的人民为取得现在的地位牺牲了很多，所以他们的请愿并不是没有道理的。"
 me_thebes_33_title:0 "玻奥提亚发展"
 me_thebes_34.a:0 "希腊，在我们的霸权下，将成为一个富裕的城市的土地"
 me_thebes_34_desc:0 "我们不仅让[GetProvince('(int32)439').GetArea.GetName]的土地上出现了比以往更多的城市，还用优雅而壮观的大理石与石质建筑填满这些城市；这正是我们经济力量以及治理领土原则的真实见证。当更广阔世界的访客为运动会来到[GetProvince('(int32)439').GetArea.GetName]时，所有人都会为我们奇妙的建筑折服。"
 me_thebes_34_title:0 "前进中的亚该亚人"
 me_thebes_35.a:0 "如果没有[ROOT.GetCountry.GetRuler.GetFirstName]，这一切都不会发生..."
 me_thebes_35_desc:0 "[GetProvince('(int32)439').GetArea.GetRegion.GetName]的奢侈是那些住不起的人所羡慕的，她的成功故事已经成为一个被道德家所谴责的警示故事，避开她的财富。你能想象富人用银子做的盘子吃饭的城市吗？一个富人在胡子上撒金粉，而低级的侍从和宫女则使用最好的埃及化妆品的地方？在那里，不管是男人还是女人，没有人在公共场合看到他们的手指和手臂上没有精美的珠宝。烤肉的气味时刻充斥着整个街道，早晨还能享受到不掺水的葡萄酒；这里有不间断的宴会和庆祝活动，贵族和农民都在享受--因为在这里过度是一种美德。\n\n虽然有些人对这种奢侈感到厌恶，感叹古老的公民美德的死亡，但没有人可以否认我们是世界上最富有的土地。"
 me_thebes_35_title:0 "世界上最富有的土地"
 me_thebes_36.a:0 "这是我所品尝过的最好的酒！"
 me_thebes_36_desc:0 "某日清晨，[ROOT.GetCountry.GetRuler.GetName]突然决定亲自视察[GetProvince('(int32)426').GetName]城外的葡萄园——这种\"突击造访\"正是[ROOT.GetCountry.GetRuler.GetHerHis]执政风格的鲜明特色。今日正是造访酿酒场的良机，园内一片繁忙景象：酿工们双腿深陷葡萄堆中，抓着悬在酒桶上方的绳索奋力踩踏，另一群奴隶则正忙着将双耳陶罐装车待运。\n\n一位园主手持斟满的牛角杯谨慎上前，尽管杯沿已溢出一缕紫红酒浆。\"请尝尝这个，[ROOT.GetCountry.GetRuler.GetFirstName]大人，相信您会品鉴出它的非凡之处。\"随着统治者将角杯一饮而尽，全场顿时屏息静候评语。当评判最终宣布时，欢呼声立刻响彻葡萄园......"
 me_thebes_36_title:0 "适合众神的酒"
 me_thebes_37.a:0 "我们感谢你，对我们持续的伙伴关系感到放心"
 me_thebes_37_desc:0 "我们固然要感谢众神持续的眷顾，但同样必须承认贵族阶层在成功中扮演的角色——若没有他们的支持，我们绝不可能取得今日的成就。[ROOT.GetCountry.GetRuler.GetName]深知亏欠贵族阶层，因而连日征询[ROOT.GetCountry.GetRuler.GetHerHis]顾问们的意见：该如何回报这些在我们艰难时期始终忠诚的盟友？\n\n经过反复商讨，最终决定赋予贵族们比现有更多的特权。在简朴而庄重的仪式上，[ROOT.GetCountry.GetRuler.GetFirstName]亲自致辞，既表达了诚挚谢意，也承诺将以更多恩赏回报他们未来的忠诚。"
 me_thebes_37_title:0 "晋升的贵族"
 me_thebes_38.a:0 "我们的历史从这一刻开始......"
 me_thebes_38_desc:0 "当我们刚开始旅行时，我们中谁能预见到[GetProvince('(int32)426').GetName]会上升到它的位置？在这片曾经被外国帝国占领的土地上，我们不仅消灭了这些插足者，还建立了一个属于我们自己的帝国!马其顿的野蛮人不再威胁希腊的自由城市，我们的公民也不再惧怕敌人的蹂躏大军!伟大的忒拜帝国崛起了，谁能站在她面前呢？"
 me_thebes_38_title:0 "伟大的忒拜帝国"
 me_thebes_39.a:0 "告诉我们的士兵，开始操练！"
 me_thebes_39_desc:0 "我们对我们的军团表示永远的感谢，他们用他们不屈不挠的力量把我们带到了今天，我们的对外野心要求我们投资一支专业的战斗部队；一支由我们最优秀的战斗人员组成的忒拜军团。有了我们的军团带领我们的军团作战，我们知道没有人能够抵挡我们！"
 me_thebes_39_title:0 "忒拜人的军团"
 me_thebes_3_desc:0 "蛮王亚历山大的军队曾洗劫并摧毁了卡德米亚卫城——这[GetProvince('(int32)426').GetName]的文化与精神圣地。马其顿人肆虐我们美丽的街巷时毫无怜悯，焚毁神庙与市集以儆效尤。而今，我们将重建卫城，让这巍峨巨垒成为对抗者的新警示！"
 me_thebes_3_title:0 "卡德梅亚"
 me_thebes_4.a:0 "光荣！"
 me_thebes_40.a:0 "向更大、更好的事情前进！"
 me_thebes_40_desc:0 "[ROOT.GetCountry.GetRuler.GetName]下令在[GetProvince('(int32)289').GetName]建造的城市现已竣工，这座城邦犹如底比斯文化在[GetProvince('(int32)289').GetArea.GetRegion.GetName]海岸的前哨站。虽然早知此地富庶，但税收涌入之快仍令人惊喜。不过这些财富从何而来并不重要，关键在于它们将流向何方。"
 me_thebes_40_title:0 "埃里斯莱的人民"
 me_thebes_41.a:0 "我们需要的第一件事是为[ROOT.GetCountry.GetRuler.GetFirstName]建立一个马术雕像"
 me_thebes_41_desc:0 "据说从[GetProvince('(int32)289').GetArea.GetRegion.GetName]的矿场开采的大理石可以与[GetProvince('(int32)1915').GetName]上找到的最好的大理石相媲美，这种说法在我们人民看来是荒谬的 - 因为如果有一件事是我们擅长的，那就是对奢侈品进行判断。为了明确解决这个问题，[ROOT.GetCountry.GetRuler.GetName]命令将样品带到[GetProvince('(int32)426').GetName]，以便我们的皇家雕塑家能够有机会亲自检查这种所谓的高级石头。\n\n不用说，经过仔细检查，似乎传言是正确的--我们现在拥有有史以来最好的大理石矿。"
 me_thebes_41_title:0 "大理石矿场"
 me_thebes_42.a:0 "最好的将军从正面领导"
 me_thebes_42_desc:0 "为[GetProvince('(int32)426').GetName]而战的士兵被称为是整个世界上最凶猛的，能够击败任何在战场上集结起来对付我们的军队--哦，我们的敌人多么希望他们能够获得我们军事成功的秘密！\n\n不仅我们的士兵在他们值得尊敬的指挥官手下勤奋训练，甚至[ROOT.GetCountry.GetRuler.GetName] 也与普通士兵一起参加军事演习。希望为我们的人民树立一个好的榜样是首要目标，但磨练自己的技艺永远不会有坏处，即使你是一个统治者......"
 me_thebes_42_title:0 "一个值得信赖的指挥官"
 me_thebes_43.a:0 "准备好我们对马其顿的宣称！"
 me_thebes_43_desc:0 "‘我们中谁能忘记马其顿人和他们的无耻行为？当然不是我--不，我对他们的侮辱的记忆就像我脖子上的石头一样，它威胁着要把我的身体拉到坟墓里去，除非我们要求正义！’\n\n在[GetProvince('(int32)426').GetName]的集会大厅里有热烈的欢呼，因为[ROOT.GetCountry.GetRuler.GetName]把[ROOT.GetCountry.GetRuler.GetHerHis]双手摔在旁边的桌子上。虽然空气中弥漫着紧张的气氛，但每个人都沉默不语，对[ROOT.GetCountry.GetRuler.GetFirstName]说的每一个字都悬而未决。‘此外，我不仅要求马其顿人必须为他们的罪行付出代价，而且我主张必须消灭他们！谁赞同谁反对？’\n\n大厅里爆发出激烈的掌声，声音如此爆炸式，几乎可以震动墙壁。没有人能否认，战争很快就会降临到我们身上......"
 me_thebes_43_title:0 "马其顿人的阴谋"
 me_thebes_44.a:0 "够了。终结这一切，准备我们在整个亚细亚的宣称。"
 me_thebes_44_desc:0 "某个深夜，[ROOT.GetCountry.GetRuler.GetName]仍在挑灯办公，陪伴[ROOT.GetCountry.GetRuler.GetHerHis]的只有那盏燃着橄榄油的忠实油灯。突然，沉重的脚步声打破夜的寂静——两名卫兵满脸通红、气喘吁吁地冲进[ROOT.GetCountry.GetRuler.GetFirstName]的寝宫。\n\n\"[GetProvince('(int32)1974').GetName]急报！我们的贸易船队在岛屿附近遭遇海盗袭击！这些海盗与亚洲僭主结盟，得以在他们的港口获得庇护。我们损失了所有货物——所有！\""
 me_thebes_44_title:0 "穿越爱琴海"
 me_thebes_45.a:0 "这是开始，是一切美好事物的开始......"
 me_thebes_45_desc:0 "'有人可能会说这是以弗所的末日，但我不会。[ROOT.GetCountry.GetRuler.GetName]郑重其事地说道，将[ROOT.GetCountry.GetRuler.GetHerHis]的目光投向聚集的集会。在战争之前，当[GetProvince('(int32)290').GetName]仍然保持其独立性时，正是这群人激起了那座美丽城市的公民对不可避免的事情进行抵抗。但现在，情况发生了变化；以弗所已经沦陷，聚集在[ROOT.GetCountry.GetRuler.GetFirstName]面前的贵族、商人和祭司再也没有资格挑战[GetProvince('(int32)426').GetName]的权威。"
 me_thebes_45_title:0 "以弗所的结束"
 me_thebes_46.a:0 "为了忒拜的荣耀！"
 me_thebes_46_desc:0 "从马其顿的海岸到托勒密的大厅，[GetProvince('(int32)426').GetName]军团在她被召唤的地方战斗过，因为我们的士兵是整个世界上最勇敢和最凶猛的。没有任何一支外国军队是我们的对手，也没有任何一个军团，无论由执政官还是国王指挥，都能在战场上与我们抗衡，当战斗发生时。为忒拜的荣耀和她武器的力量欢呼吧！"
 me_thebes_46_title:0 "忒拜的冠军"
 me_thebes_47.a:0 "忒拜的胜利是多么的巨大"
 me_thebes_47_desc:0 "对马其顿人来说是多么大的灾难！如果他们的人民中还有历史学家的话，那么这一天一定会被每一代人诅咒的。他们失去了[GetProvince('(int32)379').GetName]，他们的祖国，他们像一只扭曲的秃鹫一样在希腊投射权力的栖息地--但不再是了。我们已经结束了他们的自命不凡和野蛮行径!我们的人民再也不会害怕马其顿人和他们的军队了[GetProvince('(int32)379').GetName] 是我们的！"
 me_thebes_47_title:0 "推动珀拉的发展"
 me_thebes_48.a:0 "我们继续向各地传播我们的文明"
 me_thebes_48_desc:0 "虽然这是一项庞大的工程，当我们的祖先看到这些费用时，会感到难以置信，但我们在[GetProvince('(int32)354').GetArea.GetRegion.GetName]地区取得了不可思议的成就。虽然我们是这些土地上的外国人，但我们做了她自己的国王不能或不愿意做的事；在该地区进行建设和投资，用城市美化它，用堡垒加强它。不要搞错，色雷斯的城市实际上是由他们在[GetProvince('(int32)426').GetName]的主人建造和设计的。"
 me_thebes_48_title:0 "色雷斯的城市"
 me_thebes_49.a:0 "忒拜照顾她自己"
 me_thebes_49_desc:0 "当陌生人来到[GetProvince('(int32)1942').GetArea.GetRegion.GetName]的土地上时，他们常常惊讶地发现有这么多人口稠密的城市，因为远近皆知，菲利亚是一块残酷的土地，对弱者来说是严酷无情的。的确，在这里生活是很困难的，但是，就像园丁照料破碎和干燥的土地一样，[GetProvince('(int32)426').GetName]将菲尼亚从枯萎的状态中恢复过来，将赋予生命的资源注入她的平原和高原。现在，由于一个遥远民族的仁慈慷慨，[GetProvince('(int32)1942').GetArea.GetRegion.GetName]前所未有地繁荣起来。"
 me_thebes_49_title:0 "弗里吉亚人的繁荣"
 me_thebes_4_desc:0 "虽然我们自己的军队是可怕的，但财富是一个善变的东西，谨慎的建议我们通过雇佣雇佣兵来增加我们的数量，为我们未来的运动服务。告诉你的财务管理人员，一旦收到付款，[hired_mercenary.GetName]应与[ROOT.GetCountry.GetRuler.GetName]一起准备战斗。我们期待着他们的操练和准备。"
 me_thebes_4_title:0 "$thebes_missions_01_restoration_task_4$"
 me_thebes_5.a:0 "玻奥提亚将是我们的！"
 me_thebes_50.a:0 "我们会好好照顾这个地区"
 me_thebes_50_desc:0 "当后世书写并传颂这片土地的历史时，我们期望[GetProvince('(int32)426').GetName]的人民能被铭记为[GetProvince('(int32)394').GetArea.GetRegion.GetName]地区最贤明、最仁德的统治者——毕竟马其顿人已饱经苦难。若他们归顺底比斯，共享我们承诺的富足安宁，岂非美事？只要接受[ROOT.GetCountry.GetRuler.GetName]的全面庇护，他们就能获得前所未有的真正自由：免于战乱，免于苦难，免于人世一切灾厄。我们承诺，马其顿及其高贵城邦将得到与我们子民同等的对待。"
 me_thebes_50_title:0 "马其顿的城市"
 me_thebes_5_desc:0 "信使们今早抵达，从我们的军营中带来了好消息。部队的士气比以往任何时候都要高涨，他们为接下来的事情叫好；我们准备了一支致命的军队，这样的军队最近在希腊很少见到。[ROOT.GetCountry.GetRuler.GetName]与[hired_mercenary.GetName]的训练让忒拜做好了战争准备！"
 me_thebes_5_title:0 "准备开战！"
 me_thebes_5_tooltip:0 "[why_do_i_have_to_do_this.GetName]和[hired_mercenary.GetName]都将获得了一个#Y 军略#!@military_icon!特质。"
 me_thebes_6.a:0 "玻奥提亚将被击溃！！！"
 me_thebes_6_desc:0 "一切准备就绪。祭祀仪式已经完成，占卜显示诸神眷顾[ROOT.GetCountry.GetRuler.GetName]的雄心，我们将夺回本属于我们的土地，并因此获得神明的丰厚回报。进攻命令已经下达，战斗即将打响——对待敌人绝不手下留情。愿我军取得胜利！"
 me_thebes_6_title:0 "玻奥提亚战争"
 me_thebes_7.a:0 "[GetProvince('(int32)468').GetName]将在底比斯的统治下繁荣发展。"
 me_thebes_7_desc:0 "[GetProvince('(int32)468').GetName]没有理由拥有任何程度的自治权，不管他们无休止地唠叨什么历史上的伟大主张。不，最好没有人质疑忒拜的霸权。我们做需要做的事；到时候，他们会认为自己是骄傲的忒拜人。"
 me_thebes_7_title:0 "[GetProvince('(int32)468').GetName]的宿命"
 me_thebes_8.a:0 "忒拜将永远是我们的身份"
 me_thebes_8.b:0 "玻奥提亚联盟将会繁荣！"
 me_thebes_8.c:0 "玻奥提亚会做得很好"
 me_thebes_8_desc:0 "忒拜征服了她的敌人，并在她的统治下吸收了各种外来民族，虽然这带来了一些紧张，但也有一些新的可能性。为了安抚我们的同胞中可能出现的反对声音，有些人提议我们通过组建联盟来采用新的政治身份，或者干脆改变我们的名字以反映我们拥有的领土。他们认为，这对被征服者来说更容易接受，表明我们在希腊真正创造了一个新的秩序。你怎么看？"
 me_thebes_8_title:0 "忒拜的重新崛起"
 me_thebes_9.a:0 "该去拜访神谕了！"
 me_thebes_9.b:0 "这简直是在浪费时间"
 me_thebes_9_desc:0 "在德尔斐——世界的中心，神圣的脐石标记着此地——有一位名为皮提亚的先知。众所周知，前往德尔斐求见她的人，当神圣的雾气笼罩着她的预言洞穴时，能知晓诸神向凡人隐瞒的天机。但切记：神明不可戏弄，未来有时隐藏着最好不要知晓的秘密。[ROOT.GetCountry.GetRuler.GetName]是否要准备拜访这位先知？"
 me_thebes_9_title:0 "拜访神谕"
 mercenary_connections:0 "雇佣兵的联系"

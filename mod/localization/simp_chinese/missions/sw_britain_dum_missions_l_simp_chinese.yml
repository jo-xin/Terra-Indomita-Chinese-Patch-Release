l_simp_chinese:
 01_sw_britain_dum:0 "山谷之民的崛起"
 01_sw_britain_dum_1.a:0 "我们不能让我们的邻居认为我们是弱者——这必须是战争"
 01_sw_britain_dum_10.a:0 "大海给我们的养料比我们的农场目前的养料还要多"
 01_sw_britain_dum_10.b:0 "国王万岁"
 01_sw_britain_dum_10_desc:0 "虽然住在海岸附近的每个人都有能力在海边抓到他们的晚餐，但说到[ROOT.GetCountry.GetName]的市场，市场上出售的大部分渔获物都源自[GetProvince('(int32)2005').GetName]。\n\n由于国家层面的投资，在Iscalis的大规模庄园工作的奴隶，实际上是负责养活成千上万的[ROOT.GetCountry.GetAdjective]部落成员，丰富的鲜鱼确保价格始终保持低水平。"
 01_sw_britain_dum_10_task:0 "#E 伊斯卡利斯#!的渔业"
 01_sw_britain_dum_10_task_DESC:0 "我们临近大海，因此鱼类在我们的饮食中占有相当大的比重，虽然海洋的恩惠是无穷无尽的，但我们仍应尽力协助在[GetProvince('(int32)2005').GetName]工作的渔民们。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 01_sw_britain_dum_10_title:0 "伊斯卡利斯的渔业"
 01_sw_britain_dum_10_tooltip:0 "$mission_completed_tooltip_1$“#Y 伊斯卡利斯的渔业#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_11.a:0 "经济合作对[ROOT.GetCountry.GetName]来说只能是一件好事。"
 01_sw_britain_dum_11_desc:0 "阿雷摩里卡贸易船在[ROOT.GetCountry.GetName]的港口卸下琥珀、大麻和基本金属的货物的景象已成为日常现象，这在很大程度上是由于[ROOT.GetCountry.GetRuler.GetName]个人努力与大陆建立永久的贸易联系。大大小小的船只在一年中的任何时候都会穿越#E Mare Verginium#!，愿意冒着风险在我们的市场上赚取丰厚的利润。\n\n虽然我们的文化可能不同，但还有很多东西吸引着我们和阿雷摩里卡，[ROOT.GetCountry.GetRuler.GetFirstName]希望我们人民之间的联系只会继续增长。"
 01_sw_britain_dum_11_task:0 "阿雷摩里卡贸易网络"
 01_sw_britain_dum_11_task_DESC:0 "航海的#E 阿雷摩里卡#!人与我们的人民是同类人，我们的船在不列颠尼亚海上航行时，经常与他们的船擦肩而过。我们应该伸出援手，看看他们是否有兴趣建立正式的贸易联系。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_sw_britain_dum_11_title:0 "阿雷摩里卡贸易网络"
 01_sw_britain_dum_11_tooltip:0 "$mission_completed_tooltip_1$“#Y 阿雷摩里卡贸易网络#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_12.a:0 "在富足的时候记住神灵，因为明天可能是另一个故事"
 01_sw_britain_dum_12_desc:0 "杜姆诺尼亚人最古老的传统之一便是敬献丰收的宗教仪式——就在不久之前，我们的族人还饱受饥馑之苦。多年来，我们无力承担与祭祀相关的花费，这场曾与#E 贝尔神#!崇拜和季节更替息息相关的庆典，已历经数代人之久未再举行，但如今这艰难岁月似乎已然过去。\n\n为向[ROOT.GetCountry.GetName]的古老诸神致敬，[ROOT.GetCountry.GetRuler.GetName]宣布深受爱戴的#E 丰收庆典#!将于一月后在[ROOT.GetCountry.GetCapital.GetName]举行，欢迎所有人前来参与。"
 01_sw_britain_dum_12_philosopher:0 "#T 大祭司#!或#T 占卜师#!任职者至少需要9@religious_icon!#Y 热忱#!。"
 01_sw_britain_dum_12_task:0 "丰收节的问题"
 01_sw_britain_dum_12_task_DESC:0 "我们最神圣的[ROOT.GetCountry.GetAdjective]仪式之一是遵守#E 丰收节#!，现在我们在[GetProvince('(int32)2009').GetName]有一个适当的圣地，可以敬拜神灵，我们应该采取措施，使之成为定期的活动。\n\n\n#Y 这将开启一个事件链#!。\n\n\n\n\n\n\n\n\n@celt_mil6!"
 01_sw_britain_dum_12_title:0 "丰收节：开端"
 01_sw_britain_dum_12_tooltip:0 "$mission_completed_tooltip_1$“#Y 丰收节：开端#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_13.a:0 "必须赢得德鲁伊的智慧——我不能多说了"
 01_sw_britain_dum_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]开始对#E 德鲁伊#!会接受[ROOT.GetCountry.GetRuler.GetHerHis]访问[ROOT.GetCountry.GetCapital.GetName]和#E 巨石阵#!的提议失去希望，但在一个早晨被他们的船终于到达的消息惊醒，欣喜若狂。\n\n接下来发生的事情似乎就像一个发烧的梦；一个宗教队伍访问了[GetProvince('(int32)2012').GetName]，并进行了一系列神圣的仪式，这些仪式将净化土地，抹去在土地上发生的战争的污点，当天晚上，德鲁伊与[ROOT.GetCountry.GetRuler.GetFirstName]私下吃喝，谈论了许多严肃的事情。然后，他们透露，他们将把其教团的一些秘智教给[ROOT.GetCountry.GetAdjective]的部落首领。他们一直谈到晚上，直至最后一根木头在火中烧尽后很久。\n\n当他们第二天早上离开去#E 卡耳努提亚#!时，[ROOT.GetCountry.GetRuler.GetFirstName]拒绝透露讨论的内容，一遍又一遍地重复同样的事情。"
 01_sw_britain_dum_13_task:0 "进军中部平原"
 01_sw_britain_dum_13_task_DESC:0 "战争之神与我们同在，无人能够阻止我们的战士占领他们的土地。我们必须趁着这股势头继续进攻！中部地区是我们的囊中之物！\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 01_sw_britain_dum_13_title:0 "德鲁伊教的渗透：祭祀仪式"
 01_sw_britain_dum_13_tooltip:0 "$mission_completed_tooltip_1$“#Y 德鲁伊教的渗透：祭祀仪式#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_14.a:0 "让我们在二十年后再聚在一起，举行另一个节日"
 01_sw_britain_dum_14.b:0 "这将是我们最后一次庆祝"
 01_sw_britain_dum_14_desc:0 "#E 丰收节#!的时间又到了，这是[ROOT.GetCountry.GetAdjective]人最古老和最值得庆祝的仪式之一，所有人都聚集在[ROOT.GetCountry.GetCapital.GetName]附近，见证这个辉煌的时刻。\n\n在城外的平原上将建立大型的仪式篝火，在那里将向#E [ROOT.GetCountry.Custom('get_harvest_goddess')]#!献祭，我们田地里生产的每一种农业产品都将献给火焰。 \n\n#E 德鲁伊#!将在现场观察是否遵守了适当的传统，并且将有一个公共宴会来纪念这一事件的结束，由[ROOT.GetCountry.GetName]的财政支付。"
 01_sw_britain_dum_14_task:0 "控制北方"
 01_sw_britain_dum_14_task_DESC:0 "曾经难以想象之事情仿佛已经触手可及，然而道阻且艰——若我们继续勇敢前行，我们就有可能夺取北方的重要省份，打通前往#E 喀里多尼亚#!的道路。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 01_sw_britain_dum_14_title:0 "丰收节：庆祝活动"
 01_sw_britain_dum_14_tooltip:0 "$mission_completed_tooltip_1$“#Y 丰收节：庆祝活动#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_15.a:0 "一定要把最好的奴隶送回[ROOT.GetCountry.GetCapital.GetName]。"
 01_sw_britain_dum_15_desc:0 "我们胜利的军团从战场上归来，他们的马鞍袋里装满了从倒下的敌人那里夺来的战利品和财物。一种不可避免的光环似乎附着在我们的人身上，当我们的部队发生冲突时，即使是最坚定的敌人似乎也无法对抗我们。\n\n除了物质财富，我们的军队一直在奴役我们遇到的许多被俘的部落成员--总之，每个人都在赚钱，都很高兴。"
 01_sw_britain_dum_15_task:0 "普里塔尼亚的阵痛"
 01_sw_britain_dum_15_task_DESC:0 "在[ROOT.GetCountry.GetCapital.GetName]有一个聚会正在举行，以庆祝#Y 普里塔尼亚#!的成立，我们国家的所有领导家族都将聚集在一个地方，参加这个光荣的场合。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 01_sw_britain_dum_15_title:0 "进军中部平原"
 01_sw_britain_dum_15_tooltip:0 "$mission_completed_tooltip_1$“#Y 进军中部平原#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_16.a:0 "不久之后，#E 布里甘蒂亚#!将落入我的部队手中。"
 01_sw_britain_dum_16_desc:0 "我们的将军们传来消息，我们终于占领了北部的森林和沼泽地，使我们处于#E 布里甘蒂亚#!省的门口。不久之后，我们的军队将穿过北部腹地，为[ROOT.GetCountry.GetName]的更大荣耀而确保其安全。"
 01_sw_britain_dum_16_task:0 "拓展的阿雷摩里卡贸易"
 01_sw_britain_dum_16_task_DESC:0 "\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_sw_britain_dum_16_title:0 "控制北方"
 01_sw_britain_dum_16_tooltip:0 "$mission_completed_tooltip_1$“#Y 控制北方#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_17.a:0 "我从来没有为自己服务，只有为人民服务"
 01_sw_britain_dum_17.b:0 "你怎么敢……我应该不受反对地统治#E 普里塔尼亚#!!"
 01_sw_britain_dum_17_desc:0 "现在，我们的#E 统一战争#!已经走到了尽头，我们的部落成员开始反目成仇，为领导职位争吵不休，破坏了[ROOT.GetCountry.GetCapital.GetName]上的胜利气氛。 \n\n在一个令人震惊的转折中，在一些部落领袖中，主要是[SCOPE.sCharacter('civil_war_leader').GetName]，有一个共同的努力，实际上是惩罚[ROOT.GetCountry.GetRuler.GetName]的[ROOT.GetCountry.GetRuler.GetHerHis]野心，声称[ROOT.GetCountry.GetRulerTitle]是一个等待中的僭主。\n\n[SCOPE.sCharacter('civil_war_leader').GetFirstName]和[SCOPE.sCharacter('civil_war_leader').GetHerHis]的盟友已经非常清楚，他们将尽其所能，挫败[ROOT.GetCountry.GetRuler.GetFirstName]的前进。"
 01_sw_britain_dum_17_task:0 "饥饿的国家"
 01_sw_britain_dum_17_task_DESC:0 "我们正在应对前所未有的人口增长速度——可以肯定的是，这是一件好事——但每一张饥饿的嘴都需要食物，如果我们现在不加以解决，总有一天会成为一个问题。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_sw_britain_dum_17_title:0 "普里塔尼亚的阵痛"
 01_sw_britain_dum_17_tooltip:0 "$mission_completed_tooltip_1$“#Y 普里塔尼亚的阵痛#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_18.a:0 "要知道，我们不会容忍任何形式的竞争对手。"
 01_sw_britain_dum_18_desc:0 "#E 不列颠尼亚海#!的水域对我们的部队来说不是障碍，他们不顾一切的期望，征服了国外的敌人。\n\n最终，是经济压力迫使[ROOT.GetCountry.GetName]介入该地区，现在[ROOT.GetCountry.GetAdjective]的权威得到了尽职的承认，我们可以继续进行我们的业务。\n\n我们是否会扩大我们的海外存在还有待观察，但现在，[ROOT.GetCountry.GetRuler.GetName]似乎很满足。"
 01_sw_britain_dum_18_task:0 "盟友间的暗涌"
 01_sw_britain_dum_18_task_DESC:0 "当面对我们与#E 阿雷摩里卡#!贸易伙伴的关系开始受到影响的现实时，我们充满了遗憾——我们只是在同一空间竞争，没有足够的资源供我们双方使用。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_sw_britain_dum_18_title:0 "拓展的阿雷摩里卡贸易"
 01_sw_britain_dum_18_tooltip:0 "$mission_completed_tooltip_1$“#Y 拓展的阿雷摩里卡贸易#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_19.a:0 "人们所希望的所有粮食和牛都是我们的。"
 01_sw_britain_dum_19_desc:0 "因为我们已经扩大了边界，包括被摧毁的敌人的肥沃土地，我们已经能够用农场的各种产品来补充我们的饮食。不用说，我们预计很快就不会挨饿，这对我们的人民来说是一种祝福。"
 01_sw_britain_dum_19_title:0 "饥饿的国家"
 01_sw_britain_dum_19_tooltip:0 "$mission_completed_tooltip_1$“#Y 饥饿的国家#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_1_desc:0 "#E [ROOT.GetCountry.GetAdjective]#!人民素以热情好客著称，却非以征战四方闻名——而[ROOT.GetCountry.GetRuler.GetName]正欲改变这一现状。\n\n鉴于#E 多布尼亚#!与#E 杜罗特里加#!部落无意放弃他们在[GetProvince('(int32)2009').GetName]、[GetProvince('(int32)2010').GetName]及[GetProvince('(int32)2007').GetName]的定居点，[ROOT.GetCountry.GetRuler.GetFirstName]已宣告[ROOT.GetCountry.GetRuler.GetHerHis]决心：将这些外族逐出以我们命名的行省。"
 01_sw_britain_dum_1_task:0 "收复我们的省份"
 01_sw_britain_dum_1_task_DESC:0 "长久以来，我们一直容忍#E 杜罗特里加#!和#E 多布尼亚#!在我们的家园省的存在，但我们不能再允许这种侵占了。准备好我们的宣称，愿诸神赐予我们对敌人的胜利。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_sw_britain_dum_1_title:0 "收复我们的省份"
 01_sw_britain_dum_1_tooltip:0 "$mission_completed_tooltip_1$“#Y 收复我们的省份#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_2.a:0 "我们的未来将从这些岩石中凿出——你将见证"
 01_sw_britain_dum_20.a:0 "我们并不害怕扩大我们在海外的控股权......"
 01_sw_britain_dum_20_desc:0 "[ROOT.GetCountry.GetCapital.GetName]收到的报告显示，我们的[ROOT.GetCountry.GetAdjective]商人和#E 阿雷摩里卡#!海盗之间发生了更多的海上冲突，他们认为我们会继续无视他们的挑衅。\n\n在决定通过外交渠道发送投诉是浪费时间后，[ROOT.GetCountry.GetRuler.GetName]决定将资金投入到建造船只和军事装备中。虽然还没有正式公布，但有人认为，[ROOT.GetCountry.GetName]可能正在计划入侵大陆。"
 01_sw_britain_dum_20_title:0 "盟友间的暗涌"
 01_sw_britain_dum_20_tooltip:0 "$mission_completed_tooltip_1$“#Y 盟友间的暗涌#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_2_desc:0 "现在有消息传到[ROOT.GetCountry.GetCapital.GetName]，说[GetProvince('(int32)2002').GetName]的矿场正在产出他们的锡矿，[ROOT.GetCountry.GetRuler.GetName]已经亲自访问了该省，以确保一切都达到[ROOT.GetCountry.GetRuler.GetHerHis]的标准。\n\n感谢当地工人，[ROOT.GetCountry.GetRulerTitle]对[ROOT.GetCountry.GetRuler.GetSheHe]看到的东西很满意，满意地离开。挖掘现场已经大大扩展，可以更容易地进入地下，我们的奴隶现在比以前更努力地工作，以达到他们的定额。一车车未精炼的锡被成群结队地送往首都，那里有我们的铁匠和铜匠的饥饿熔炉在等着他们。"
 01_sw_britain_dum_2_task:0 "开发我们的锡矿"
 01_sw_britain_dum_2_task_DESC:0 "来自远方的商人经常航行到我们的岛屿，提供饰品和货物，以换取我们矿场中大量的珍贵锡。我们应该采取必要的措施，尽可能多地提取这种财富。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_sw_britain_dum_2_title:0 "开发我们的锡矿"
 01_sw_britain_dum_2_tooltip:0 "$mission_completed_tooltip_1$“#Y 开发我们的锡矿#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_3.a:0 "我们必须增强我们在海上的实力，以配合我们在陆地上的能力。"
 01_sw_britain_dum_3_desc:0 "尽管我们的人民在陆战中无可匹敌，但最近推行的航海生活却让一些部落成员措手不及，引发了不少争议。尽管怨声载道，[ROOT.GetCountry.GetRuler.GetName]仍坚定不移地要求[ROOT.GetCountry.GetRuler.GetHerHis]子民征服海浪，因为[ROOT.GetCountry.GetRulerTitle]深信，[ROOT.GetCountry.GetAdjective]的命运与掌握海洋之道密不可分。[ROOT.GetCountry.GetRuler.GetFirstName]强调，贸易机遇实在不容错过，我们必须成为本地区最强大的海上力量。\n\n如今[ROOT.GetCountry.GetCapital.GetName]已储备了大量木材、布料和石料——这些正是建造港口和船只的必备物资——开弓没有回头箭；[ROOT.GetCountry.GetName]已踏上扩充舰队之路。\n\n这将使我们与北方部落产生冲突，他们自诩为分隔我们水域的主人。不过很快，我们将把他们的港口据为己有..."
 01_sw_britain_dum_3_task:0 "海洋在召唤"
 01_sw_britain_dum_3_task_DESC:0 "我们的半岛突入大海，使它成为建设港口的最佳地点，我们可以用它与国外的邻国进行贸易。海洋在向我们招手——我们准备好听从它的召唤了吗？\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 01_sw_britain_dum_3_title:0 "海洋在召唤"
 01_sw_britain_dum_3_tooltip:0 "$mission_completed_tooltip_1$“#Y 海洋在召唤#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_4.a:0 "[ROOT.GetCountry.GetName]的部落欠我一个大人情，这是真的。"
 01_sw_britain_dum_4_desc:0 "对[ROOT.GetCountry.GetRuler.GetName]来说，这真是一个历史性的日子；长老们已经在为[ROOT.GetCountry.GetRuler.GetHerHis]的荣誉谱写歌曲，强调[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]给[ROOT.GetCountry.GetRuler.GetHerHis]人民带来的巨大军事胜利。 \n\n我们不仅击溃了那些被派来对付我们的懦弱的#E Dobunnian#!和#E Durotrigan#!战士的军队，而且还把他们赶出了我们的省份，为[ROOT.GetCountry.GetName]夺回了我们祖先的传统家园。\n\n为了庆祝这一无与伦比的壮举，将在[ROOT.GetCountry.GetCapital.GetName]举行庆祝活动，这有望成为年度盛事。"
 01_sw_britain_dum_4_task:0 "杜姆诺尼亚属于我们"
 01_sw_britain_dum_4_task_DESC:0 "我们已将敌对部族逐出#E 杜姆诺尼亚#!行省，一场颂扬[ROOT.GetCountry.GetRuler.GetName]的盛大庆典即将在[ROOT.GetCountry.GetCapital.GetName]举行。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 01_sw_britain_dum_4_title:0 "杜姆诺尼亚属于我们"
 01_sw_britain_dum_4_tooltip:0 "$mission_completed_tooltip_1$“#Y 杜姆诺尼亚属于我们#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_5.a:0 "我祈祷苏利斯会保佑杜姆诺尼亚的人民，并给予我们她的青睐。"
 01_sw_britain_dum_5_desc:0 "长期以来，[GetProvince('(int32)2009').GetName]一直是德鲁伊教派信徒的非正式朝圣地，他们来到流淌在乡间的汩汩溪水边朝拜#E 苏利斯#!。\n\n但这不再是——事情已经改变，因为[ROOT.GetCountry.GetRuler.GetName]已经在以她名字命名的领土上为女神建造了一座永久的神殿。来取圣水的旅行者现在可以在整个南不列颠尼亚建造的最宏伟的宗教场所进行崇拜。"
 01_sw_britain_dum_5_task:0 "苏利斯神殿"
 01_sw_britain_dum_5_task_DESC:0 "[GetProvince('(int32)2009').GetName]的治愈之水吸引了来自#E 不列颠尼亚#!各个角落的朝圣者，据说甚至连#E 高卢#!的信徒也要到海外去向当地的女神致意。现在是时候为#E 苏利斯#!建立一个合适的神殿了，这样她的祝福就可以浇灌到[ROOT.GetCountry.GetName]的所有地方。\n\n\n\n\n\n\n\n\n\n@celt_mil7!。"
 01_sw_britain_dum_5_title:0 "苏利斯神殿"
 01_sw_britain_dum_5_tooltip:0 "$mission_completed_tooltip_1$“#Y 苏利斯神殿#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_6.a:0 "我们有什么资格阻挡永恒的荣耀？"
 01_sw_britain_dum_6_desc:0 "[SCOPE.sCharacter('random_clan_chief').GetName]和[SCOPE.sCharacter('random_clan_chief_2').GetName]有一次与[ROOT.GetCountry.GetRuler.GetName]完全一致--这种情况非常罕见，值得在[ROOT.GetCountry.GetName]的口语历史中单独列出，[ROOT.GetCountry.GetRuler.GetFirstName]已经急切地指出。不过，不管达成共识的原因是什么，[ROOT.GetCountry.GetRulerTitle]今天还是很高兴。\n\n我们的战士，敌人的血在他们的刀刃上几乎没有干涸，似乎已经尝到了战斗的滋味，现在正吵着要继续他们的掠夺和袭击。每位部落首领都着眼于自己的目标，全心全意地同意。"
 01_sw_britain_dum_6_task:0 "无休止的掠夺，无休止的战争"
 01_sw_britain_dum_6_task_DESC:0 "在[ROOT.GetCountry.GetName]中，有一些声音希望看到我们的军队永远处于战争状态，对弱小的邻国进行无休止的袭击和战争——这种想法有其优点，必须接受。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 01_sw_britain_dum_6_task_tt:0 "我们必须有#Y 2位#!#T 氏族首领#!，忠诚度至少达到#E 65#!。"
 01_sw_britain_dum_6_title:0 "无休止的掠夺，无休止的战争"
 01_sw_britain_dum_6_tooltip:0 "$mission_completed_tooltip_1$“#Y 无休止的掠夺，无休止的战争#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_7.a:0 "愿这些城市成为历久弥新的力量之源。"
 01_sw_britain_dum_7_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的遗产将在[ROOT.GetCountry.GetName]被记住，原因有很多，但当[ROOT.GetCountry.GetRuler.GetHerHis]事迹的记忆腐烂成传说和梦想时，在整个[ROOT.GetCountry.GetAdjective]乡村建造的城市--由[ROOT.GetCountry.GetRuler.GetFirstName]指挥建造的永久纪念碑——将成为我们雄心勃勃的部落酋长的愿景的活见证。"
 01_sw_britain_dum_7_task:0 "扎根"
 01_sw_britain_dum_7_task_DESC:0 "虽然我们的人民自古以来就在[ROOT.GetCountry.GetName]徘徊，但我们的存在一直很轻，但这一切都随着我们祖国各地的城市建设而改变。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 01_sw_britain_dum_7_title:0 "扎根"
 01_sw_britain_dum_7_tooltip:0 "$mission_completed_tooltip_1$“#Y 扎根#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_8.a:0 "不断前进，从山谷到我们面前的山脉......"
 01_sw_britain_dum_8_desc:0 "在我们的世界角落附近，人们不可能不听说杜姆诺尼亚人的首都，这个辉煌的[ROOT.GetCountry.GetCapital.GetName]使她附近的所有其他城市相形见绌。这座城市的爆炸性增长与[ROOT.GetCountry.GetName]本身的飞速崛起相匹配，它已迅速在区域舞台上成为一个主要的参与者。\n\n所有的目光都集中在[ROOT.GetCountry.GetRuler.GetName]上，每个人都想知道这位杰出的杜姆诺尼亚部落酋长接下来会做什么。"
 01_sw_britain_dum_8_task:0 "[ROOT.GetCountry.GetCapital.GetName]的崛起"
 01_sw_britain_dum_8_task_DESC:0 "当人们谈到[ROOT.GetCountry.GetName]时，他们经常会同时提到[ROOT.GetCountry.GetCapital.GetName]，因为我们不断增长的首都是我们国家跳动的心脏。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_sw_britain_dum_8_title:0 "崛起的首都"
 01_sw_britain_dum_8_tooltip:0 "$mission_completed_tooltip_1$“#Y 崛起的首都#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_9.a:0 "我们真心希望能以客人的身份接待他们，因为我们是来这里的。"
 01_sw_britain_dum_9_desc:0 "随着#E 巨石阵#!的奇迹牢牢掌握在[ROOT.GetCountry.GetAdjective]手中，[ROOT.GetCountry.GetRuler.GetName]对[ROOT.GetCountry.GetRuler.GetHerHis]的地位感到足够自信，可以向大陆上的#E 德鲁伊#!派遣特使。似乎我们的部落首领想请求德鲁伊来访问巨石阵自己，并举行宗教仪式，为冬诺尼亚人民祈福。\n\n不过，他们是否会接受还有待观察，因为这将意味着我们因暴力夺取这个圣地而得到他们的祝福。"
 01_sw_britain_dum_9_task:0 "德鲁伊教的渗透"
 01_sw_britain_dum_9_task_DESC:0 "被称为#E 巨石阵#!的神秘奇迹坐落于[GetProvince('(int32)2012').GetName]，这块领土最近被[ROOT.GetCountry.GetAdjective]占有。我们可以派特使去#E 高卢#!邀请一些大陆的德鲁伊来这个神圣的地方居住。\n\n#Y 这将开启一个事件链#!。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_sw_britain_dum_9_task_tt:0 "我们需要解锁#Y 陈情权#!#T 民政革新#! 技术。"
 01_sw_britain_dum_9_title:0 "德鲁伊教的渗透：请求"
 01_sw_britain_dum_9_tooltip:0 "$mission_completed_tooltip_1$“#Y 德鲁伊教的渗透#!”$mission_completed_tooltip_2$"
 01_sw_britain_dum_BUTTON_TOOLTIP:0 "越过泰马河，夺回我们的家园的时候到了。"
 01_sw_britain_dum_CRITERIA_DESCRIPTION:0 "当#E 杜姆诺尼亚#!的部落征服了他们的近邻，并为他们新兴的国家打下了坚实的基础，这个任务才算完成。"
 01_sw_britain_dum_DESCRIPTION:0 "从我们有记忆以来，我们的部落一直生活在#E 泰马河#!边，在河水穿过#E 不列颠尼亚#!西南部的古老森林和峭壁山麓所形成的小山谷中建立我们的定居点。虽然我们一直独来独往，但对我们的人民来说，新的一天到来了——我们将离开安全的家园，向河流划定的边界以外的地方扩张。"
 aremorican_dumnonian_trading_partners:0 "阿雷摩里卡贸易网络"
 desc_aremorican_dumnonian_trading_partners:0 "由于我们对贸易和航海的共同兴趣，我们与阿雷摩里卡建立了一个繁荣的贸易网络。"
 desc_dumnonia_blessings_of_sulis:0 "我们在苏利斯的阿库埃省的神殿给我们带来了当地女神的青睐。"
 desc_dumnonian_food_stores:0 "为了养活我们不断增长的国家，我们在整个故乡发展了农场，并将我们的收获储存在我们的首都。"
 desc_dumnonian_power:0 "我们被誉为本地区最强大的部落之一，是一个值得重视的力量。"
 desc_dumnonian_ship_building_effort:0 "如果我们想在海上保护我们的利益，那么我们必须有一支能与我们的邻国抗衡的海军。"
 desc_dumnonian_tin_mines_mod:0 "我们在赫拉克勒斯海角的采矿业务有了很大的扩展。"
 desc_expanded_aremorican_dumnonian_trading_partners:0 "我们在阿雷摩里卡的存在确保了它最好的货物最终进入我们自己的市场。"
 desc_fisheries_of_iscalis_dumnonia:0 "虽然成本很高，但我们在北部海岸边开发了渔业，确保我们的人民永远不会缺少鲜鱼。"
 desc_iron_weapons_dumnonia:0 "我们富有成效的杜姆诺尼亚矿场为我们的武器提供了力量，用坚固的铁器加固了我们的武器。"
 dumnonia_blessings_of_sulis:0 "苏利斯的祝福"
 dumnonia_iberian_central_path_2B_tt:0 "我们需要#Y 不列颠军事传统#!中的#T 狩猎的荣耀#!。"
 dumnonia_raiding_button_tt:0 "我们需要#T 政府互动#!#Y 组建突袭队伍#!来保持活跃状态。"
 dumnonia_unlocks_save_raiding_tt:0 "我们现在将能够#Y 劫掠奴隶#!。"

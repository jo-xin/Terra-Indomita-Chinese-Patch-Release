 sam_roman_conquest_copy:0 "预防性干预"
 sam_rural_community_growth:0 "每个#Y 定居点#!等级的领土将获得#Y 1#!居民。"
 sam_spartan_instructor_tt:0 "一名斯巴达教官将随我们回国，指导我们的部队。"
 sam_start_of_rel_conflict_tt:0 "希望接受希腊化的派系与反对希腊化的派系发生冲突。"
 sam_statue_herakles:0 "赫拉克勒斯雕像"
 sam_statue_herakles_desc:0 "作为一个尚武的社会，萨莫奈人几乎将武艺置于所有其他品质之上，而这最好地体现在传奇英雄赫拉克勒斯身上。"
 sam_statue_maris:0 "马里斯雕像"
 sam_statue_maris_desc:0 "战神马里斯的雕像，是萨莫奈版本的罗马战神马尔斯。他可能是萨莫奈所有神祇中最重要的。"
 sam_statue_mefitis:0 "梅菲提斯面容"
 sam_statue_mefitis_desc:0 "梅菲提斯是战争女神，常受萨莫奈人崇拜。通常作为财富的仪式展示，装饰在逝去战士的墓地中。"
 sam_stole_burial_money:0 "盗窃葬礼资金"
 sam_sync_burial_tt:0 "此选项因完成任务#Y $samnium_2_task_23$#!而可用。"
 sam_sync_sanc_tt:0 "我们需要在我们的领域内拥有至少#Y 5#!个主导省份文化为[GetCulture('samnite').GetName|Y]的圣地。"
 sam_sync_ver_sacrum_bonus_tt:0 "#Y $ver_sacrum$#!决定现在将额外提供#Y 15#!@political_influence!政治影响力。"
 sam_territory_brut_luc_tt:0 "我们需要拥有[GetProvince('(int32)84').GetArea.GetRegion.GetName|Y]中所有主导省份文化为[GetCulture('lucanian').GetName|Y]或[GetCulture('bruttian').GetName|Y]的省份。（[SCOPE.ScriptValue('sam_owned_brut_luc_svalue')|R|0]/[SCOPE.ScriptValue('sam_brut_luc_svalue')]#!）"
 sam_thebes_jewelry:0 "底比斯珠宝"
 sam_thebes_jewelry_desc:0 "由旅行的萨莫奈人购买，这些珠宝让许多贵族女子也希望拥有。"
 sam_thebes_shield:0 "底比斯盾牌"
 sam_thebes_shield_desc:0 "萨莫奈人在前往雅典途中于底比斯购买的底比斯盾牌。它激励了无数年轻人作战，因为他们感到更安全。"

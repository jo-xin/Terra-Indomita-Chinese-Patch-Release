 samnite_sanctuary:0 "萨莫奈圣所"
 samnite_supremacy:0 "萨莫奈霸权"
 samnite_warfare:0 "萨莫奈战法"
 samnium_2_allies_tt:0 "我们需要至少有#Y 2#!个盟友和/或附庸。"
 samnium_2_task_1:0 "外部世界"
 samnium_2_task_10:0 "萨莫奈传统"
 samnium_2_task_10_DESC:0 "凭借传统的政治实践和充足的食物，我们可以实现一定程度的稳定。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 samnium_2_task_11:0 "加强帕吉"
 samnium_2_task_11_DESC:0 "帕吉——由紧密联系的乡村城镇和村庄组成的区域群体——构成了萨莫奈的支柱。对帕吉的投资将增强整个国家。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 samnium_2_task_12:0 "田园生活"
 samnium_2_task_12_DESC:0 "萨莫奈的经济命脉是我们的牧民和小农庄——这两种财富来源必须扩大。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 samnium_2_task_13:0 "增加产量"
 samnium_2_task_13_DESC:0 "萨莫奈即将迎来生产和人口的爆炸——我们将鼓励我们的前景。\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 samnium_2_task_14:0 "摧毁偶像"
 samnium_2_task_14_DESC:0 "摧毁所有希腊神祇的偶像！\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 samnium_2_task_15:0 "压制本土信仰"
 samnium_2_task_15_DESC:0 "摧毁所有本土神祇的偶像！\n\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 samnium_2_task_16:0 "追溯起源"
 samnium_2_task_16_DESC:0 "为了推进我们的现代化项目，我们必须派遣使节前往希腊文化中心。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 samnium_2_task_17:0 "建立联系"
 samnium_2_task_17_DESC:0 "我们与希腊世界的商业关系开启了外交之门。与希腊结盟将是有利的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 samnium_2_task_18:0 "保障宗教自由"
 samnium_2_task_18_DESC:0 "我们不会迫害那些坚持旧意大利信仰的人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 samnium_2_task_19:0 "真正文明的萨莫奈"
 samnium_2_task_19_DESC:0 "我们必须在整个萨莫奈发展城市。\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 samnium_2_task_1_DESC:0 "\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 samnium_2_task_2:0 "希腊影响"
 samnium_2_task_20:0 "文明意大利的中心"
 samnium_2_task_20_DESC:0 "建立一个宏伟的首都，作为意大利文明的中心。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 samnium_2_task_21:0 "圣所"
 samnium_2_task_21_DESC:0 "萨莫奈的圣所不仅是神庙，还是管理周边土地的宏伟建筑，发布政治法令的地方，以及民众可以参与公共宗教仪式的地方。随着萨莫奈日益受到希腊文化的影响，我们可以利用这些圣所作为普通民众与我们的政治和宗教机构领导者之间的中心联系点。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 samnium_2_task_22:0 "思想交流"
 samnium_2_task_22_DESC:0 "为了吸收来自遥远土地的新思想和影响，我们应与多个国家建立持久的贸易。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 samnium_2_task_23:0 "对死亡的新理解"
 samnium_2_task_23_DESC:0 "随着广泛的繁荣和希腊宗教影响，对死亡和葬礼仪式的新理解开始浮现。\n\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 samnium_2_task_24:0 "传统葬礼"
 samnium_2_task_24_DESC:0 "在古老的萨莫奈葬礼中，我们最伟大的人物仅以他们的武器陪葬，象征他们首先是战士的角色。我们将立法回归这一纯粹的尚武实践。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 samnium_2_task_25:0 "希腊风格葬礼"
 samnium_2_task_25_DESC:0 "在生活中，萨莫奈的时尚贵族已爱上一切希腊事物；在死亡中，亦是如此。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 samnium_2_task_26:0 "与平等者贸易"
 samnium_2_task_26_DESC:0 "我们的大部分贸易与希腊世界进行——如果我们向这些希腊人扩展公民权，我们将赢得我们最重要商业伙伴的好感。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 samnium_2_task_27:0 "模仿希腊人"
 samnium_2_task_27_DESC:0 "模仿是最真诚的奉承……\n\n平庸对伟大的致敬。\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 samnium_2_task_28:0 "农村社区的增长"
 samnium_2_task_28_DESC:0 "萨莫奈仍主要是一个牧民和农民的国家。我们可以确保我们农村居民的持久繁荣。\n\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 samnium_2_task_29:0 "出口增长"
 samnium_2_task_29_DESC:0 "羊毛、葡萄酒、橄榄油、粗糙工具和农产品从乡村涌入——远超我们自己人口所能使用的量。我们应为我们丰富的商品开拓外国市场。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 samnium_2_task_2_DESC:0 "\n\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 samnium_2_task_3:0 "抵制外来影响"
 samnium_2_task_30:0 "富有的农民"
 samnium_2_task_30_DESC:0 "萨莫奈的农民已经开始繁荣，但特别关注我们首都的经济活动可以为这些贫穷农民带来财富。\n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 samnium_2_task_31:0 "安抚家族"
 samnium_2_task_31_DESC:0 "缺乏对外贸易导致了精英的不满。我们必须确保他们的支持。\n\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 samnium_2_task_32:0 "确立圣春"
 samnium_2_task_32_DESC:0 "圣春，或称神圣之春，是一种神圣的牺牲和军事扩张的借口。我们将确立其为我们信仰的核心。\n\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
 samnium_2_task_33:0 "调整圣春"
 samnium_2_task_33_DESC:0 "圣春，或称神圣之春，是一种神圣的牺牲，有助于缓解人口过剩的破坏性影响。我们将调整它成为政治上有用的行为。\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 samnium_2_task_3_DESC:0 "萨莫奈将拒绝目前从海岸渗透进我们社会的希腊影响。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 samnium_2_task_4:0 "调和两个世界"
 samnium_2_task_40:0 "战争的创伤"
 samnium_2_task_40_DESC:0 "数十年来，萨莫奈比以往任何时候都更接近完全毁灭。我们绝不再受外来势力的威胁——相反，我们将征服他们。"
 samnium_2_task_41:0 "萨莫奈的雄心"
 samnium_2_task_41_DESC:0 "萨莫奈人长期以来是一个尚武的民族，但随着我们对罗马的胜利完成，我们在计划意大利霸权时有了一点喘息空间。\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 samnium_2_task_42:0 "整合意大利"
 samnium_2_task_42_DESC:0 "向北扩展萨莫奈的影响力至关重要。我们必须确保我们的萨贝利同胞和伊特鲁里亚的众多城市。\n\n\n\n\n\n\n\n\n\n\n@italic_mil5!"
 samnium_2_task_43:0 "深入靴形之地"
 samnium_2_task_43_DESC:0 "长期以来，萨莫奈人向南和向东突袭阿普利亚和卢卡尼亚——随着罗马被处理，是时候将大希腊永久纳入我们的掌控。\n\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 samnium_2_task_44:0 "夺取西西里"
 samnium_2_task_44_DESC:0 "[GetProvince('(int32)84').GetArea.GetName|E]是一片极其富饶的土地。作为最伟大的希腊殖民地，[GetProvince('(int32)84').GetName|E]应成为我们的所有物。凭借[GetProvince('(int32)84').GetArea.GetName|E]的粮食和财富，我们将为我们的人民和未来几代的影响力提供动力。"
 samnium_2_task_45:0 "入侵岛屿"
 samnium_2_task_45_DESC:0 "撒丁岛和科西嘉是萨莫奈扩张的天然目标，因为科西嘉长期是伊特鲁里亚的属地，撒丁岛的财富众所周知。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 samnium_2_task_46:0 "波河谷地"
 samnium_2_task_46_DESC:0 "为了确保我们对北部意大利的控制，必须从高卢人手中夺取波河谷地。\n\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 samnium_2_task_47:0 "确保阿彭宁"
 samnium_2_task_47_DESC:0 "阿彭宁山脉的北部是新萨莫奈意大利的天然边界——我们必须确保这些土地。\n\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 samnium_2_task_48:0 "吞并利古里亚"
 samnium_2_task_48_DESC:0 "我们必须将利古里亚人纳入萨莫奈，以保护他们免受高卢人的侵害。\n\n\n\n\n\n\n\n\n\n\n@italic_mil8!"
 samnium_2_task_49:0 "确保阿尔卑斯通道"
 samnium_2_task_49_DESC:0 "高卢掠夺者必将入侵并威胁萨莫奈文明——我们必须加强可能威胁我们省份的山地通道。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 samnium_2_task_4_DESC:0 "无需强制广泛变革——我们只需让外来影响与我们的传统机构保持一致。萨莫奈将自然形成一种融合文化。\n\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 samnium_2_task_5:0 "迷恋新事物"
 samnium_2_task_50:0 "希斯特里亚已成为历史"
 samnium_2_task_50_DESC:0 "希斯特里亚半岛具有重要的战略意义——通往伊利里亚土地的陆上通道——以及萨莫奈贸易利益认为非常有价值的地方。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 samnium_2_task_51:0 "三盘胸甲"
 samnium_2_task_51_DESC:0 "萨莫奈士兵的独特特征是三盘胸甲，由三个青铜盘组成，置于胸甲中。通过国家适度的投资，我们可以为整个军队装备这种盔甲的标准化版本。\n\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 samnium_2_task_52:0 "萨莫奈战争之道"
 samnium_2_task_52_DESC:0 "如果我们的部队在战场上遭遇失败和疲惫，萨莫奈的丘陵和堡垒始终是安全的避风港。\n\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 samnium_2_task_53:0 "预防性干预"
 samnium_2_task_53_DESC:0 "随着罗马人的消失，意大利出现了一个由那个军事巨兽留下的权力真空。在我们元老院的支持下，或许萨莫奈可以填补我们被击败的敌人留下的空缺？\n\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 samnium_2_task_54:0 "窃取科西嘉"
 samnium_2_task_54_DESC:0 "位于西北的科西嘉岛一直是[GetProvince('(int32)379').GetOwner.GetName]的麻烦刺。或许我们可以向那里的本土权力掮客派遣使节？\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 samnium_2_task_55:0 "$roman_1_italia_persuade_greeks$"
 samnium_2_task_55_DESC:0 "意大利希腊殖民地在意大利民族崛起之前早已繁荣。我们可以说服这些哲学家和演员接受我们的保护，以换取公平的交换。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 samnium_2_task_56:0 "争取西西里"
 samnium_2_task_56_DESC:0 "西西里岛虽然与意大利世界密切相关，但距离我们的权力中心遥远，且在文化上与我们大不相同。它不在我们的核心利益范围内，但外交安排可以为我们在这些富饶土地上提供立足点……\n\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 samnium_2_task_57:0 "凯尔特关系"
 samnium_2_task_57_DESC:0 "随着阿彭宁山脉完全确立为天然北部边界，现在是时候稳定与内阿尔卑斯地区凯尔特部落的关系，以确保和平的未来……或者先发制人，在这些背信弃义的蛮族有机会之前打击他们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 samnium_2_task_58:0 "我们的南方兄弟"
 samnium_2_task_58_DESC:0 "大希腊南部的布鲁提人和卢卡尼人是我们的远亲，萨贝利民族因与该地区众多希腊城市的密切互动而高度希腊化。我们与他们的祖先联系值得我们在行政中对他们给予特别考虑。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 samnium_2_task_59:0 "萨莫奈城市"
 samnium_2_task_59_DESC:0 "随着我们的故乡和直接利益安全，我们必须建设卢卡尼亚、阿普利亚、阿特尔努姆和坎帕尼亚的城市。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 samnium_2_task_5_DESC:0 "我们将拥抱#Y 希腊化#!并皈依。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 samnium_2_task_6:0 "清除外来影响"
 samnium_2_task_60:0 "利里斯谷地"
 samnium_2_task_60_DESC:0 "利里斯中游是与罗马争议的焦点，因为我们和他们都希望开采该地区的矿产资源。如果我们重新控制利里斯谷地，我们可以恢复那里的活动。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 samnium_2_task_6_DESC:0 "萨莫奈将保持自己的特性，不成为希腊多神教。\n\n\n\n\n\n\n\n\n\n\n@italic_mil12!"
 samnium_2_task_7:0 "中间人"
 samnium_2_task_7_DESC:0 "贸易商是中间人，将新知识带入国家，为富人提供来自地中海各角落的最精美产品。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 samnium_2_task_8:0 "我们必须城市化"
 samnium_2_task_8_DESC:0 "要成为现代国家，萨莫奈必须建立真正的城市。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 samnium_2_task_9:0 "说服民众"
 samnium_2_task_9_DESC:0 "将你的臣民皈依你新选择的宗教。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 samnium_doesn_fight_303_tt:0 "以下之一必须为真：\n  - #Y 萨莫奈#!未加入303年的战争。\n  - 我们在303年对#Y 塔林敦#!及其盟友的战争中失败。\n  - 我们在303年对#Y 塔林敦#!及其盟友的战争中获胜。\n\n这场战争发生在一个#Y 事件链#!中。"
 samnium_event.1.a:0 "萨莫奈的小胜利。"
 samnium_event.1.desc:0 "我们与塔林敦短暂冲突的最大后果，或许是[ROOT.GetCountry.GetRuler.GetName]巧妙应对所激发的政治信心。意大利人与南部希腊人之间的权力平衡无疑已改变，但我们的参与证明了萨莫奈作为该地区首要强国的地位。随着紧张局势缓解，萨莫奈部队解散，我们的官员们重新开始担忧希腊人进一步干涉意大利事务的可能性。尽管如此，生活正在恢复正常，我们的行动带来了一些微小的回报。"
 samnium_event.1.t:0 "$samnium_task_1$"
 samnium_event.10.a:0 "他们在战争中被击败——我们将吞并他们。"
 samnium_event.10.b:0 "他们将作为藩属加入萨莫奈联盟。"
 samnium_event.10.c:0 "我们已将他们从罗马的附庸状态中解放。"
 samnium_event.10.desc:0 "现在罗马狼已被处理，我们的注意力必须转向他们所谓的盟友，这些盟友作为附庸被纳入罗马体系。每一个部落都是我们的萨贝利同胞，每一个在过去都曾出于自愿在我们的轨道内。这并不是说这些国家渴望臣服于我们——我们与弗伦塔尼人和努塞里亚人尤其有长期的冲突历史，佩利尼人和马尔西人可能不仅希望摆脱罗马，也希望摆脱萨莫奈。如果我们对这些部落强加条件，可能需要武力支持。\n\n尽管如此，决定同盟命运的责任落在萨莫奈身上。和平的条件是什么？"
 samnium_event.10.t:0 "$samnium_task_10$"
 samnium_event.100.a:0 "希斯特里亚已成为历史。"
 samnium_event.100.desc:0 "又一个省份被萨莫奈吸收——东北部的希斯特里亚土地因战略和商业原因而宝贵。战略上，它是意大利与伊利里亚土地之间的陆上通道。商业上，它提供了海军基地，我们可以从中开展整个北亚得里亚海的贸易，并压制该海域常见的伊利里亚海盗活动。我们在这一新省份建立了实现这些目标的萨莫奈殖民地。从这个新位置，我们可以指挥伊利里亚和亚得里亚海。"
 samnium_event.100.t:0 "$samnium_2_task_50$"
 samnium_event.1000.a:0 "[SCOPE.sChar('samnite_burial_char').GetName]将以传统方式安葬，伴随战争武器。"
 samnium_event.1000.b:0 "[SCOPE.sChar('samnite_burial_char').GetName]将按他认为合适的方式安葬，伴随各种武器、盔甲、小饰品，口中放置一枚希腊货币。"
 samnium_event.1000.c:0 "[SCOPE.sChar('samnite_burial_char').GetName]将以希腊方式安葬，穿着简单长袍，口中放置一枚货币。"
 samnium_event.1000.d:0 "我们无需在死者身上浪费资金——送一笔微薄的款项。"
 samnium_event.1000.desc:0 "今天对萨莫奈的许多人来说是悲伤的一天。[SCOPE.sChar('samnite_burial_char').GetName]，我们政治中的一位重要人物，去世了。他的家人和追随者正在哀悼，[ROOT.GetCountry.GetCapital.GetName]的街道今天安静了一些。他曾经常光顾的议会厅弥漫着一种沉思的情绪。\n\n现在正在为[SCOPE.sChar('samnite_burial_char').GetName]准备葬礼安排。预计国家将向丧亲家庭捐款。他将如何安葬，我们将捐多少？"
 samnium_event.1000.e:0 "我的敌人不配任何东西——让我们从葬礼基金中挪用一些现金。"
 samnium_event.1000.f:0 "[SCOPE.sChar('samnite_burial_char').GetName]不过是个普通人，不比其他人好。适度的捐款。"
 samnium_event.1000.t:0 "[SCOPE.sChar('samnite_burial_char').GetName]之死"
 samnium_event.1001.a:0 "愿众神守护他们。"
 samnium_event.1001.desc:0 "圣春——#E 圣春#!仪式——已被召集。这是一种不寻常的人类牺牲，在某种意义上，春天出生的孩子被奉献给这一仪式。在他们成年后，他们被送往荒野建立新社区。\n\n这种做法既是解决人口过剩的办法，也是扩张的手段，但主要是为了获得众神青睐的极端牺牲——或者至少说服我们的萨莫奈臣民相信已获得神恩。\n\n我们认为适合启动这一古老而神圣的仪式，选定的萨莫奈人已出发前往边境。"
 samnium_event.1001.t:0 "圣春"
 samnium_event.101.a:0 "军事力量的新象征。"
 samnium_event.101.desc:0 "随着中央萨莫奈军事管理的推进，国家开始补贴为那些太穷而无法自行购买武器和盔甲的人群购买装备。通过国库的拨款，这些官员已将三盘青铜胸甲定为我们重步兵和骑兵的标准装备。比其他类似的意大利胸甲更具保护性，这件盔甲还赋予我们的队伍一种与过去临时编队不同的统一且独特的外观。"
 samnium_event.101.t:0 "$samnium_2_task_51$"
 samnium_event.102.a:0 "萨莫奈的战争由每个男人和孩子共同进行。"
 samnium_event.102.desc:0 "我们的部队再次在战场上遭遇失败，伴随着长时间战争的疲惫。然而，我们并未被击败。正如我们与罗马的第二次战争中，始终可以选择退回到可防御的丘陵堡垒地形，从内部线进行突袭，逐步削弱试图占领不可占领民族的敌人。汲取我们部落过去的灵感，我们始终可以选择分散的游击战。"
 samnium_event.102.t:0 "$samnium_2_task_52$"
 samnium_event.103.a:0 "我们将从罗马人手中夺取他们的梦想。"
 samnium_event.103.desc:0 "罗马人——或者说，曾经的罗马人——是一个极好战的民族，他们的元老院永远试图为与邻国的持续冲突寻找各种理由，他们的公民则冷酷地接受这种存在所需的高昂人力和金钱成本。我们的萨莫奈社会同样尚武，我们的突袭队赢得了所有邻居的敌意。然而，事实上，我们确实缺乏罗马人整个社会所实践的单一国家纪律。随着我们宿敌的消灭，或许我们可以学习他们的整个社会的纪律，以及他们的扩张野心。"
 samnium_event.103.t:0 "$samnium_2_task_53$"
 samnium_event.104.a:0 "我们外交团队的伟大胜利！"
 samnium_event.104.desc:0 "我们的使节抓住了一个难得的机会。似乎科西嘉的当地人厌倦了[corsica_country_sam_scope.GetName]的霸道统治，一直在等待机会宣布独立。仅凭支持和自治的承诺，我们的外交官已达成协议，科西嘉人将作为我们的殖民地运作。[corsica_country_sam_scope.GetName]对这种背叛极为愤怒，但目前似乎他们将接受这一既成事实。"
 samnium_event.104.t:0 "$samnium_2_task_54$"
 samnium_event.105.a:0 "麦西那如今在我们掌控之中。"
 samnium_event.105.desc:0 "萨莫奈外交官在与西西里岛上各方势力数周的谈判后，终于达成了一项有利的安排。虽然该岛过于遥远且分裂，无法接受萨莫奈的直接统治，但所有相关方都接受了间接存在。我们在南方的这个新盟友有望使我们远离席卷西西里的持续冲突，并确保我们的南部侧翼安全。"
 samnium_event.105.t:0 "$samnium_2_task_56$"
 samnium_event.106.a:0 "达成贸易协议。"
 samnium_event.106.b:0 "与愿意的部落进行军事合作。"
 samnium_event.106.c:0 "我们必须以武力平定高卢人！"
 samnium_event.106.desc:0 "在与罗马冲突期间，成功引领我们穿越意大利复杂外交水域的萨莫奈使节，现在面临一个更陌生的挑战。高卢人不断挑战我们在北部边境的统治，定期突袭威胁我们对该地区的管理。此外，高卢习俗对我们来说相当陌生，可能会因对这些蛮族的无知而犯下致命错误。萨莫奈议会提出了与高卢部落关系的三个可能性："
 samnium_event.106.t:0 "$samnium_2_task_57$"
 samnium_event.107.a:0 "让我们资助高卢商品生产的扩张。"
 samnium_event.107.b:0 "定期派遣商队前往北方。"
 samnium_event.107.desc:0 "虽然内阿尔卑斯高卢地区并非高度城市化，但那里的少数城市生产异国小饰品和主食商品，在萨莫奈国家的城市中找到了市场。我们的外交官提出了几个如何利用与北方的贸易的建议。我们可以投资于这些城市的生产能力——为那些城镇的工匠提供或购买工具——或者我们可以指示我们的商人定期前往波河谷地和利古里亚。任一计划都将产生费用，但回报可能相当可观。"
 samnium_event.107.t:0 "对凯尔特商品的需求增加"
 samnium_event.108.a:0 "安全与现金！"
 samnium_event.108.desc:0 "通过贸易进行外交的策略已结出果实。与高卢的贸易关税为国家带来了一大笔资金，因为与这些北方邻居的贸易大幅扩展激发了我们商人的雄心和国内市场的需求。希望这些贸易联系能缓和高卢人对我们的习惯性侵略，确保我们最开放边境的稳定共存。"
 samnium_event.108.t:0 "有价值的投资"
 samnium_event.109.a:0 "请求[SCOPE.sC('sam_cel_scope_1').GetName]。"
 samnium_event.109.b:0 "[SCOPE.sC('sam_cel_scope_2').GetName]将是更好的盟友。"
 samnium_event.109.desc:0 "我们决定通过与北部边境的几个部落寻求军事合作联盟，直接确保和平。虽然承诺总是可能将我们卷入军事冲突，但我们希望力量平衡能阻止与内阿尔卑斯高卢部落的广泛冲突。\n\n两个部落是理想的军事伙伴，但外交领域的限制意味着我们只能实际达成一个联盟。我们应该接近谁？"
 samnium_event.109.t:0 "潜在的凯尔特伙伴"
 samnium_event.11.a:0 "罗马已败，我们无保护——我们接受。"
 samnium_event.11.b:0 "我们绝不会在不战的情况下被消灭！"
 samnium_event.11.desc:0 "萨莫奈使节已抵达，宣布将我们并入他们的国家。如果我们不同意这些条件，应立即准备战争。我们的回应是什么？"
 samnium_event.11.t:0 "萨莫奈的要求"
 samnium_event.110.a:0 "我们将与萨贝利人结盟。"
 samnium_event.110.b:0 "我们不能被萨莫奈的命运所束缚。"
 samnium_event.110.desc:0 "萨莫奈使节前来，旨在与我们建立军事联盟！虽然这是一个与南方日益崛起的霸主建立关系的难得机会，但如此大的承诺可能让我们卷入我们不想参与的战争，并限制我们在当地的扩张机会。"
 samnium_event.110.t:0 "来自南方的使节"
 samnium_event.111.a:0 "又一次外交胜利！"
 samnium_event.111.desc:0 "我们的使节带来高卢的回应：我们将致力于相互军事援助和合作的联盟。"
 samnium_event.111.t:0 "凯尔特盟友"
 samnium_event.112.a:0 "真糟！"
 samnium_event.112.desc:0 "我们向其提出军事联盟提议的高卢部落拒绝了我们的使节。该地区仍可能爆发部落战争，我们应保持对北方侵略的高度警惕。"
 samnium_event.112.t:0 "凯尔特失望"
 samnium_event.113.a:0 "承诺迅速结束这场战争。"
 samnium_event.113.b:0 "尽管如此，我们必须磨损这些罗马机器。"
 samnium_event.113.desc:0 "在一场又一场战斗中，罗马军团对我们的部队造成了重大伤亡。罗马的军事纪律似乎无法打破，他们冷漠无情的目光让我们的老兵感到不安。"
 samnium_event.113.t:0 "厌战：罗马战斗实力"
 samnium_event.114.a:0 "我们不能无休止地战斗——命令本季减少突袭队。"
 samnium_event.114.b:0 "那又怎样？这是萨莫奈的生活方式。"
 samnium_event.114.desc:0 "我们参与塔林敦的战争一拖再拖，边境上令人麻木的突袭和反突袭持续进行。我们的人民对此感到厌倦。"
 samnium_event.114.t:0 "厌倦塔伦图姆战争"
 samnium_event.115.a:0 "宣布我们将尽快结束这场流血。"
 samnium_event.115.b:0 "如果说萨莫奈富有，那便是人力。"
 samnium_event.115.desc:0 "罗马的残酷导致萨莫奈方面死亡人数众多——无论是战场上还是罗马的惩罚性远征，死亡和受伤的人数持续增加。"
 samnium_event.115.t:0 "厌战：伤亡增加"
 samnium_event.116.a:0 "这不能永远继续——我们的国家必须向无家可归者提供慈善。"
 samnium_event.116.b:0 "这只是证明我们必须不惜一切代价击败罗马人。"
 samnium_event.116.desc:0 "除了与罗马人正面作战的高昂代价，我们还因敌人习以为常地系统性洗劫和焚烧乡村而受苦。我们的人民呼求救济。"
 samnium_event.116.t:0 "厌战：后方被洗劫"
 samnium_event.117.a:0 "让我们的元老院支持他的信息。"
 samnium_event.117.b:0 "让我们的元老院谴责他的懦弱。"
 samnium_event.117.desc:0 "一位与伟大盖利乌斯·埃格纳提乌斯有血缘关系的萨莫奈军事名人，通过在博维亚努姆公开演讲呼吁和平，在当地引起了轰动。"
 samnium_event.117.t:0 "厌战：战争英雄要求和平"
 samnium_event.118.a:0 "那不勒斯殖民地。"
 samnium_event.118.desc:0 "那不勒斯城曾是罗马和萨莫奈觊觎的对象。当我们设法让支持萨莫奈的派系在城中掌权时，罗马人以武力夺走了它。我们对这座坎帕尼亚名城的保护承诺未能兑现。随着我们最近对罗马的胜利，我们迟来地弥补了与那不勒斯市议会的破裂协议，恢复了这个富裕城邦的有限自治。"
 samnium_event.118.t:0 "$samnium_task_12$"
 samnium_event.119.a:0 "让我们授予这两个部落全部权利。"
 samnium_event.119.b:0 "一定程度的区域自治应该适合他们。"
 samnium_event.119.c:0 "他们只是众多民族中的两个——不配任何权利。"
 samnium_event.119.desc:0 "布鲁提人和卢卡尼人，都是希腊化的萨贝利人，与我们萨莫奈人有着悠久而动荡的冲突与合作历史。现在我们已在这两个民族的土地上取得政治主导权，或许我们之间的合作倾向可以超越与他们的冲突。鉴于我们共同的历史，我们可以授予这些遥远的希腊化亲戚一系列可能的权利和特权。"
 samnium_event.119.t:0 "$samnium_2_task_58$"
 samnium_event.12.a:0 "我们别无选择——我们必须接受。"
 samnium_event.12.b:0 "我们绝不会在不战的情况下被支配！"
 samnium_event.12.desc:0 "萨莫奈使节已抵达，要求我们作为附庸加入他们的联盟。我们将保留对我们领土的管辖权，但须臣服于萨莫奈。如果我们不同意这些条件，应立即准备战争。我们的回应是什么？"
 samnium_event.12.t:0 "萨莫奈的要求"
 samnium_event.120.a:0 "萨贝利兄弟部落的成功联合。"
 samnium_event.120.desc:0 "我们的行政机构冒险授予卢卡尼人和布鲁提人全部权利，尽管我们的人民长期以来与他们冲突，但似乎我们共同的文化认同是持久的纽带。这些部落的许多成员几乎完美地融入萨莫奈社会，预期的摩擦仅在原卢卡尼-布鲁提领土上感受到一小部分。这些人无疑可以信赖。"
 samnium_event.120.t:0 "南方萨贝利人的团结"
 samnium_event.121.a:0 "重要土地恢复到萨莫奈手中。"
 samnium_event.121.desc:0 "利里斯河中游，长期以来是我们与罗马的边界，是我们非常宝贵的财产。这是萨莫奈少数能够生产适合制造武器和工具的金属的地方之一。当罗马从我们手中夺走这片领土时，是巨大的损失。随着萨莫奈对意大利的重组，整个利里斯谷地已纳入我们的掌控。我们立即恢复了该地区的采矿作业，由于谷地靠近萨莫奈核心地带，仍对我们非常宝贵。"
 samnium_event.121.t:0 "$samnium_2_task_60$"
 samnium_event.122.a:0 "[ROOT.GetCountry.GetCapital.GetName]是萨莫奈的十字路口。"
 samnium_event.122.desc:0 "一个多世纪以来，萨莫奈一直在各个方向努力扩展其流动的边界——主要是由于贫瘠的土地和过大的人口无法在该土地上维持。我们寻求获得阿普利亚和坎帕尼亚的富饶农田，征服或以其他方式影响阿特尔努姆地区的萨贝利部落，并与卢卡尼人争夺该地区的控制权。随着在意大利取得主导地位，这四个省份的城市获得了我们大部分的投资和发展，[ROOT.GetCountry.GetCapital.GetName]作为这些地区的中心和首都，受益最多。"
 samnium_event.122.t:0 "$samnium_2_task_59$"
 samnium_event.123.a:0 "他们将臣服。"
 samnium_event.123.b:0 "这不值得追求。"
 samnium_event.123.desc:0 "我们在一场漫长的战争中击败了长期的敌人罗马人。现在，我们将无可争议地统治意大利。所有不投降的人将在时机到来时被我们的战士征服。\n有人说我们不应要求邻居臣服，因为这会恶化关系和贸易，但如果我们占据主导地位，这重要吗？"
 samnium_event.123.t:0 "忠诚要求"
 samnium_event.124.a:0 "是的，这是个好主意。"
 samnium_event.124.b:0 "不，我们是自由的民族。"
 samnium_event.124.desc:0 "今天，一名萨莫奈使节前来，要求我们立即臣服于他们的领导。他们要求掌管我们的对外事务，并要求每年进贡。"
 samnium_event.124.t:0 "萨莫奈的忠诚要求"
 samnium_event.125.a:0 "我们现在更强大了。"
 samnium_event.125.desc:0 "[SCOPE.sCountry('sam_subject_event_scope').GetName]已接受我们的要求，将向我们进贡。"
 samnium_event.125.t:0 "要求接受"
 samnium_event.126.a:0 "他们会后悔这个决定。"
 samnium_event.126.desc:0 "[SCOPE.sCountry('sam_subject_event_scope').GetName]拒绝了我们的要求，认为它们‘不合理、疯狂且完全荒谬’。"
 samnium_event.126.t:0 "要求被拒"
 samnium_event.127.a:0 "他们的保护会有用。"
 samnium_event.127.b:0 "绝不！"
 samnium_event.127.desc:0 "今天，一名萨莫奈使节前来，要求我们立即臣服于他们的领导。他们要求掌管我们的对外事务，并要求每年进贡。"
 samnium_event.127.t:0 "萨莫奈的贡金要求"
 samnium_event.128.a:0 "我们现在更强大了。"
 samnium_event.128.desc:0 "[SCOPE.sCountry('sam_target_scope').GetName]已接受我们的要求，将向我们进贡。"
 samnium_event.128.t:0 "要求接受"
 samnium_event.129.a:0 "总有一天，他们会后悔这个决定。"
 samnium_event.129.desc:0 "[SCOPE.sCountry('sam_target_scope').GetName]拒绝了我们的要求，认为它们‘不合理、疯狂且完全荒谬’。"
 samnium_event.129.t:0 "要求被拒"
 samnium_event.13.a:0 "努塞里亚·阿尔费塔纳再次掌握在我们手中！"
 samnium_event.13.desc:0 "努塞里亚人已接受我们的要求。"
 samnium_event.13.t:0 "接受的要求"
 samnium_event.14.a:0 "比费尔诺谷是我们的了！"
 samnium_event.14.desc:0 "弗伦塔尼人已接受我们的要求。"
 samnium_event.14.t:0 "接受的要求"
 samnium_event.15.a:0 "萨莫奈的势力深入阿彭宁山脉！"
 samnium_event.15.desc:0 "佩利尼人已接受我们的要求。"
 samnium_event.15.t:0 "接受的要求"
 samnium_event.16.a:0 "我们已夺回利里斯谷！"
 samnium_event.16.desc:0 "马尔西人已接受我们的要求。"
 samnium_event.16.t:0 "接受的要求"
 samnium_event.17.a:0 "我们将用武力夺取努塞里亚·阿尔费塔纳！"
 samnium_event.17.desc:0 "努塞里亚人已拒绝我们的要求！"
 samnium_event.17.t:0 "拒绝的要求"
 samnium_event.18.a:0 "我们将征服比费尔诺谷！"
 samnium_event.18.desc:0 "弗伦塔尼人已拒绝我们的要求！"
 samnium_event.18.t:0 "拒绝的要求"
 samnium_event.19.a:0 "与佩利尼人开战！"
 samnium_event.19.desc:0 "佩利尼人已拒绝我们的要求！"
 samnium_event.19.t:0 "拒绝的要求"
 samnium_event.2.a:0 "来吧，罗马狼！"
 samnium_event.2.desc:0 "与罗马人的最终对决已不可避免。我们的外交官与他们的外交官走遍了意大利半岛，争取对未来权力平衡有利益关系的众多国家的支持，我们终于获得了坚定的承诺。我们的新盟友送来了战争津贴，一些他们的自由民已在我们中间定居。萨莫奈有了战斗的机会——现在我们等待时机。"
 samnium_event.2.t:0 "$samnium_task_2$"
 samnium_event.20.a:0 "我们将再次在利里斯谷作战！"
 samnium_event.20.desc:0 "马尔西人已拒绝我们的要求！"
 samnium_event.20.t:0 "拒绝的要求"
 samnium_event.21.a:0 "努塞里亚人，我们昔日坎帕尼亚领土的关键"
 samnium_event.21.b:0 "比费尔诺谷的弗伦塔尼人，我们的近亲"
 samnium_event.21.c:0 "山北的佩 retired 利尼人"
 samnium_event.21.d:0 "最靠近拉丁核心地的马尔西人"
 samnium_event.21.desc:0 "在寻找对抗罗马不可避免扩张的伙伴时，我们的注意力自然转向了最近被罗马征服的‘盟友’。#E 弗伦塔尼#!是我们最亲近的亲戚，#E 佩利尼#!、#E 马尔西#!和#E 努塞里亚#!的阿尔费特尼人说我们的萨贝利语，曾是我们昔日的战友。他们可能仍渴望摆脱拉丁的枷锁。我们应该接近谁？"
 samnium_event.21.e:0 "这些钱最好花在别处"
 samnium_event.21.t:0 "$samnium_task_11$"
 samnium_event.22.a:0 "我们将加入萨莫奈。我们从罗马手中解脱！"
 samnium_event.22.b:0 "我们已签订条约——我们不会背弃罗马。"
 samnium_event.22.desc:0 "罗马与萨莫奈之间的又一场战争不可避免。虽然我们与罗马签订了不平等的联盟条约，但我们与萨莫奈民族有更多共同点——我们共享语言和文化，历史上时而与他们结盟，时而交战。现在，萨莫奈使节抵达，诱使我们背弃罗马，作为附庸加入萨莫奈，并在即将到来的战争中与他们并肩作战。这是一个极具风险的提议，因为罗马已两次证明自己是更强的力量。然而，萨莫奈人几乎肯定会以更宽松的方式治理……"
 samnium_event.22.t:0 "萨莫奈使节"
 samnium_event.23.a:0 "吃这一招，罗马！"
 samnium_event.23.desc:0 "我们收到了[SCOPE.sC('samnium_country_to_get_stolen_scope').GetName]的回应——他们已向我们承诺，并将在时机到来时以军队支持我们。"
 samnium_event.23.t:0 "[SCOPE.sC('samnium_country_to_get_stolen_scope').GetAdjective]的承诺"
 samnium_event.24.a:0 "我们很快将在战场上与他们相遇。"
 samnium_event.24.desc:0 "我们收到了[SCOPE.sC('samnium_country_to_get_stolen_scope').GetName]的回应——他们拒绝了我们的提议，将继续忠于罗马。"
 samnium_event.24.t:0 "[SCOPE.sC('samnium_country_to_get_stolen_scope').GetAdjective]的拒绝"
 samnium_event.25.a:0 "与东方的贸易已正式开始。"
 samnium_event.25.desc:0 "萨莫奈联盟历史上一直是一个内陆且孤立的民族，远离海岸，远离#Y 希腊#!世界。随着我们对拉丁人的支配和对#Y 大希腊#!希腊城市的参与，这种情况不再成立。我们的制成品开始进入希腊东部，许多外国小饰品现在装饰着我们的圣所和主要公民的住宅。"
 samnium_event.25.t:0 "$samnium_2_task_1$"
 samnium_event.26.a:0 "萨莫奈——意大利的堡垒，还是地中海的玩家？"
 samnium_event.26.desc:0 "萨莫奈出现了两个派系，因我们从乡村意大利部落联盟转变为拥有广泛海外贸易利益并深受地中海主导的希腊文化影响的国际化国家而发生冲突。\n\n[SCOPE.sChar('sam_pro_hof_scope').GetName]领导希腊派，主张接受希腊方式，促进贸易，并与意大利以外的民族建立关系。[SCOPE.sChar('sam_con_hof_scope').GetName]是意大利派的领袖，首要目标是保护萨莫奈身份，希望将我们的利益局限于意大利半岛。\n\n#E 萨莫奈#!正站在十字路口；支持任一派系，或平衡他们的利益，将决定我们国家的命运。"
 samnium_event.26.t:0 "$samnium_2_task_2$"
 samnium_event.27.a:0 "萨莫奈是意大利主义的堡垒"
 samnium_event.27.desc:0 "意大利派已在萨莫奈掌权，他们限制贸易、加强乡村萨莫奈定居点并专注于意大利的利益现已成为国家政策。最重要的是，萨莫奈现在致力于拒绝希腊影响，回归传统的萨贝利思想和宗教。这一派系得到我们自由民的强烈支持，因为他们从外国纠葛中获益甚少，而从发展我们的家园和给予他们慰藉的信仰中获益匪浅。"
 samnium_event.27.t:0 "$samnium_2_task_3$"
 samnium_event.28.a:0 "中间道路是稳定与繁荣之道"
 samnium_event.28.desc:0 "萨莫奈的亲希腊派与亲意大利派之间已形成权力平衡。虽然这些极端集团要求接受或压制外国影响，但我们的[ROOT.GetCountry.GetRulerTitle] [ROOT.GetCountry.GetRuler.GetName]已解决此事——选择中间道路。允许自由选择信仰，鼓励海外贸易，但不改变带领我们走到今天的萨莫奈传统。或许一种希腊-意大利混合文化将发展，而国家以温和的方式引导。"
 samnium_event.28.t:0 "$samnium_2_task_4$"
 samnium_event.29.a:0 "亲希腊主义是当下的主题"
 samnium_event.29.desc:0 "希腊派已在萨莫奈掌权，他们鼓励贸易、城市化萨莫奈定居点和集中贵族影响的利益现已成为国家政策。更重要的或许是自上而下地鼓励希腊思想和宗教，每个主要家族都已开始以希腊风格进行宗教仪式。我们的自由民强烈反对这种强加于国家的精英利益，牢牢坚持传统的萨贝利习俗，特别是在以博维亚努姆为中心的萨莫奈故土。时间将证明这条进步之路是否会对整个萨莫奈社会造成不稳定。"
 samnium_event.29.t:0 "$samnium_2_task_5$"
 samnium_event.3.a:0 "从萨莫奈的岩石山丘中涌现好战之士"
 samnium_event.3.desc:0 "在上次与罗马的战争中，我们在塔拉奇纳、阿普利亚平原以及多年来在坎帕尼亚边境的突袭和冲突中损失惨重；但我们已从国内众多艰苦生活的牧人中招募新兵。他们将在我们山寨和城市中心的扩展训练营中被锤炼成形，装备上新铸的青铜和铁质头盔、胸甲和武器。我们下一代的战士将数量众多、装备精良且训练有素。"
 samnium_event.3.t:0 "$samnium_task_3$"
 samnium_event.30.a:0 "再次在众神下团结"
 samnium_event.30.desc:0 "我们压制外国宗教——特别是希腊宗教——的政策已证明成功。我们的绝大多数人口以传统萨莫奈方式崇拜传统萨莫奈神祇。伴随着这种宗教统一，我们的少数族裔倾向于同化，我们的祭司在萨莫奈享有极大的尊重和影响。"
 samnium_event.30.t:0 "$samnium_2_task_6$"
 samnium_event.31.a:0 "萨莫奈向我们的中间人和小贩致敬"
 samnium_event.31.desc:0 "萨莫奈的商人处于社会等级中的尴尬位置。他们并非真正劳作，因此与萨莫奈的广大群众不同，但他们也不够富有以感到安全。他们为我们的国家带来可观的财富，但他们的商品很少被使用，甚至不被大部分人口看到。他们的主要功能似乎是从海外采购地位象征物，交付给我们的贵族，用于公共建筑和私人住宅的展示。作为与遥远国度的主要接触点，这些中间人还带来了新闻和思想。无疑是萨莫奈中有用的阶层，但远非至关重要的。尽管如此，我们从沿海省份广泛贸易，我们的国家财政从这些商人交易的税收中受益。"
 samnium_event.31.t:0 "$samnium_2_task_7$"
 samnium_event.32.a:0 "城市化的人民是强大的民族"
 samnium_event.32.desc:0 "古老的萨莫奈方式——一个乡村且大多流动的牧羊人和战士民族——已不再是可行的生活方式。一个高效且有竞争力的国家必须拥有大型、永久、可防御的城市，我们的人民集中于此，这些城市将震慑前来贸易的外国人，并容纳可纳税的自由民和公民。事实是，我们的人民不再能像过去的萨莫奈人那样靠牲畜和牧群维持生计。\n\n现在萨莫奈已解决宗教问题并研究了希腊的城市，我们可以城市化。"
 samnium_event.32.t:0 "$samnium_2_task_8$"
 samnium_event.33.a:0 "再次在众神下团结"
 samnium_event.33.desc:0 "我们鼓励希腊宗教仪式的政策已证明成功！我们的绝大多数人口现在遵循国家信仰。我们的臣民再次团结，新皈依者的热情赋予我们的祭司在萨莫奈持久的影响力。"
 samnium_event.33.t:0 "$samnium_2_task_9$"
 samnium_event.34.a:0 "传统即自由"
 samnium_event.34.desc:0 "萨莫奈的稳定依赖于两件事。首先是我们古老的民主地方议会传统，任何居民都可以在其中辩论政治和日常事务。这确保了我们所有臣民的自由。其次更简单：足够的食物。这通过对土地的了解实现。有了政治自由和面包，我们许多流动人口已在可纳税或征兵的地方定居。"
 samnium_event.34.t:0 "$samnium_2_task_10$"
 samnium_event.35.a:0 "萨莫奈联盟必须关怀其乡村民众"
 samnium_event.35.desc:0 "帕吉——由小镇和村庄组成的集合——构成了萨莫奈定居点的大部分。任何生产力或人口的增长都将在这一层面实现。我们以牺牲我们少数城市为代价，极力投资于这些乡村地区，现在将收获回报，表现为帕吉的广泛政治支持和全国劳动阶层生产力的提升。"
 samnium_event.35.t:0 "$samnium_2_task_11$"
 samnium_event.36.a:0 "萨莫奈是一片坚韧之地"
 samnium_event.36.desc:0 "萨莫奈首先是牧羊人和农民的国家。我们的牧人在贫瘠的岩石山丘上驱赶牛羊，从牧场到市场，我们的农民在河谷种植作物。我们对这些朴素财富来源的依赖带来了许多结果：高人口增长率、从贫瘠土壤中生产更多食物的能力，以及对城市文化和‘文明’的强烈抵制。我们对这些途径的投资进一步增强了这些传统倾向。"
 samnium_event.36.t:0 "$samnium_2_task_12$"
 samnium_event.37.a:0 "我们忠于根基，如今正全面开花"
 samnium_event.37.desc:0 "我们的农产品和乡村制成品从未在我们的历史上达到如此密集的生产水平。我们的粮仓满得要溢出，我们开始有限地出口食品，我们的劳动者产出相当丰富。这一切都归功于我们的主要家族和政治领导对乡村的广泛关注。"
 samnium_event.37.t:0 "$samnium_2_task_13$"
 samnium_event.38.a:0 "萨莫奈的宗教复兴已完成！"
 samnium_event.38.desc:0 "由于我们的大多数人口信奉传统意大利信仰，现在是时候彻底消灭外国宗教信仰了。外来神祇的神庙已被洗劫，其偶像被摧毁或熔化，我们的祭司已受命为我们的圣所制作新偶像。对马里斯和梅菲提斯的崇拜在普通人和公民中都颇受欢迎。"
 samnium_event.38.t:0 "$samnium_2_task_14$"
 samnium_event.39.a:0 "萨莫奈的宗教振兴已完成！"
 samnium_event.39.desc:0 "由于我们的大多数人口信奉希腊信仰，现在是时候彻底消灭意大利本土信仰了。洗劫旧圣所并将其重新献为希腊神庙是一个好的开始，我们的狂热希腊自由民已开始蜂拥而至前往这些新神庙。对赫拉克勒斯的崇拜尤为突出，因为一个古老的故事提到他曾访问过诺拉外的一座神庙。他的英雄气概将激励我们的普通士兵。"
 samnium_event.39.t:0 "$samnium_2_task_15$"
 samnium_event.4.a:0 "我用我的小眼睛窥探……"
 samnium_event.4.desc:0 "尽管我们近期有冲突历史，但我们主要家族与罗马家族之间微薄的贸易意味着一些年轻的萨莫奈人在他们的城市中游荡——这些年轻人或许爱国且需要一些零花钱。暗中影响和间谍活动可能是可行的。"
 samnium_event.4.t:0 "$samnium_task_4$"
 samnium_event.40.a:0 "前往雅典！"
 samnium_event.40.b:0 "前往斯巴达！"
 samnium_event.40.c:0 "前往佩拉！"
 samnium_event.40.desc:0 "我们希腊化项目的下一步是派遣我们的[ROOT.GetCountry.GetRulerTitle]与一队使节前往一座著名的希腊城市，以便亲眼见证哪些可以被我们采纳的目的地。三个目的地尤为突出：雅典，民主与哲学之城；斯巴达，武力之城；以及佩拉，亚历山大大帝的诞生地。"
 samnium_event.40.t:0 "$samnium_2_task_16$"
 samnium_event.41.a:0 "整齐、紧凑的步兵线从未如此好看！"
 samnium_event.41.desc:0 "船只在萨莫奈港口与希腊港口之间来回航行，我们的商人与他们的商人在港口旁的客栈交谈，我们的官员与希腊对等官员保持持续联系。这种新的熟悉感和共同利益催生了军事联盟。除了这种安排通常带来的优势外，我们的新盟友还派了一些军官来训练我们的部队采用希腊方法。如果我们选择，可以借鉴他们的军事传统。"
 samnium_event.41.t:0 "$samnium_2_task_17$"
 samnium_event.42.a:0 "胡萝卜比棍棒更有用。"
 samnium_event.42.desc:0 "虽然萨莫奈政体的主体已接受希腊宗教习俗，但必须允许那些坚持我们祖先意大利信仰的人自由崇拜。或许他们会随时间被说服，但少数旧信徒不值得进一步动摇国家，也不值得摧毁点缀萨莫奈故土和其他我们影响下的意大利土地的美丽古老意大利圣所。此外，还有其他国家项目值得我们关注……"
 samnium_event.42.t:0 "$samnium_2_task_18$"
 samnium_event.43.a:0 "不再是野蛮人……至少大部分如此"
 samnium_event.43.desc:0 "我们的持续城市化项目取得了巨大成功——我们的官员现在管理着萨莫奈十几个著名的城市。我们作为居住在小山村的野蛮劫掠者的旧名声几乎已消失——萨莫奈现在被视为一个真正文明的国家，弥合了大希腊的希腊城市与我们北方意大利部落之间的差距。与希腊世界的扩展贸易联系增加了我们的有产公民人数，他们反过来热衷于参与我们的政治。\n\n这种新生活方式也带来了意想不到的挑战。我们的无产臣民对财富集中在顶层的认知感到愤怒，并对我们抛弃萨莫奈社会传统秩序感到不满。此外，这些贫穷的牧人难以适应城市生活，我们城市劳动阶层的犯罪和酗酒问题普遍存在。"
 samnium_event.43.t:0 "$samnium_2_task_19$"
 samnium_event.44.a:0 "美丽。"
 samnium_event.44.desc:0 "来自遥远土地的闪亮大理石。神庙、学院和治理一个充满活力的国家所需的政府建筑。贵族的精美庄园以及仓库和市场的集合。幕墙排列，挤满了临时搭建的棚屋。这就是[ROOT.GetCountry.GetCapital.GetName]，萨莫奈的璀璨明珠，繁华的大都市。[ROOT.GetCountry.GetCapital.GetName]是意大利最精美的城市和文明中心，是我们国家进步的纪念碑。"
 samnium_event.44.t:0 "$samnium_2_task_20$"
 samnium_event.45.a:0 "一个有益的发展。"
 samnium_event.45.desc:0 "萨莫奈圣所在国家管理中的日益中心化导致其功能发生了显著变化。通常在这些地点召开萨莫奈居民的民主议会，并征收税收和通行费。全年开放的公共神圣仪式和节日在这里举行，它们已成为萨莫奈社会的焦点。常住的劳工人口通常居住在附近，以服务在这些圣所开展业务的官员和祭司的需要。无论是从乡村还是从城墙内看，这些象征萨莫奈祭司和政府的宏伟符号都让民众充满敬畏和共同目标。"
 samnium_event.45.t:0 "$samnium_2_task_21$"
 samnium_event.46.a:0 "我们正在融入更广阔的世界"
 samnium_event.46.desc:0 "萨莫奈位于地中海中心，不再与意大利海岸隔绝，非常适合与东方和西方贸易。我们的商人前往埃及和希腊的港口，以及非洲和西班牙。这种广泛的联系意味着这些中间人带回的各种影响。从这些外国交流中产生的社会进步在萨莫奈生活的各个方面都可见一斑。"
 samnium_event.46.t:0 "$samnium_2_task_22$"
 samnium_event.47.a:0 "萨莫奈的混合葬礼。"
 samnium_event.47.desc:0 "当萨莫奈还是一个贫穷国家时，我们中最有影响力的人通过将财富带入地下以夸大他们的相对财富。稀有的进口珠宝、精美的武器、传家宝和贵重的小饰品都将与逝者一起埋葬，以向他们的下属展示他们之间的差距有多大。最近的发展改变了这一切。所有阶层的广泛繁荣降低了这种展示的力量，重要家族通常不希望在逝去的族长后将高价值物品抛入地下。许多领导人仅以武器和盔甲陪葬。希腊式葬礼——长袍和放置在口中的象征性钱币——也为人所知。总之，萨莫奈的死亡似乎以简朴为准则——生活太美好，死亡不再困扰公民。"
 samnium_event.47.t:0 "$samnium_2_task_23$"
 samnium_event.48.a:0 "剑归鞘，入棺。"
 samnium_event.48.desc:0 "萨莫奈的领袖一直是，也永远是声名显赫的战士。在我们最古老的葬礼习俗中，这些伟人仅以他们的武器陪葬，这是他们终极目的的证明。然而，在我们辉煌的过去与现在之间的岁月里，外来的奢靡之风渗入了我们的精英文化，我们的部落首领最近被埋葬的物品竟有如香水双耳瓶和装饰性青铜手镯这样毫无战斗气息的东西。随着真正的萨莫奈人掌权，葬礼仪式将再次适合战士-[ROOT.GetCountry.GetRulerTitle]。"
 samnium_event.48.t:0 "$samnium_2_task_24$"
 samnium_event.49.a:0 "希腊风格的葬礼。"
 samnium_event.49.desc:0 "在近期，萨莫奈的地位人士被埋葬时带着从武器、盔甲、喜爱的衣物和珠宝、香水、食物到饮料的各种物品；但随着我们精英文化的希腊化加深，新的葬礼习俗开始流行。富人的精美物品仅在生前享用，死亡时，即便是最高贵的也穿着简单的长袍下葬，口中放置一枚钱币，以确保渡过冥河。通过摒弃将财富囤积在逝去时的野蛮倾向，我们的男女领袖证明了他们的精致和文明。"
 samnium_event.49.t:0 "$samnium_2_task_25$"
 samnium_event.5.a:0 "事不过三！"
 samnium_event.5.desc:0 "我们的使节在边境附近驱逐了罗马的费提亚祭司，截断了他们仪式性的#E 战争#!宣言，我们的官员无需忍受他们的夸夸其谈和无理要求。我们清楚两国立场。我们的#E 好战之士#!很快将在战场上迎战他们的军团，收复失地，复仇雪耻。考迪尼山口的灵魂与他们同在！"
 samnium_event.5.t:0 "$samnium_task_5$"
 samnium_event.50.a:0 "太好了！"
 samnium_event.50.desc:0 "萨莫奈政府迈出了决定性的一步，授予希腊人全部权利——我们与地中海各地的希腊政体进行大量贸易，我们接受希腊文化的消息必将打开许多大门。我们已收到几个城邦使节对我们开明态度的赞美——我们越来越被视为可敬的平等者。"
 samnium_event.50.t:0 "$samnium_2_task_26$"
 samnium_event.51.a:0 "盛大欢迎[SCOPE.sChar('derek_char').GetName]！"
 samnium_event.51.desc:0 "授予希腊人公民权是萨莫奈历史上的里程碑——虽然我们的国家致力于自上而下地现代化和希腊化我们国家，但我们接受这些真正外国的人民标志着我们作为落后、内陆意大利部落联合体的起源已真正成为过去。我们作为拥有海外利益、对待多样臣民持国际化视野的希腊化地中海帝国的新身份，在希腊世界眼中为我们赢得了赞誉。一些平民可能说希腊人更多是以居高临下的态度而非可敬的平等者看待我们；无论真假，当希腊显贵每天抵达我们的港口时，这无关紧要。"
 samnium_event.51.t:0 "$samnium_2_task_27$"
 samnium_event.52.a:0 "帕吉繁荣昌盛"
 samnium_event.52.desc:0 "尽管我们至少拥有了一些城市中心和港口，我们国家的核心仍是乡村。牧羊和农业仍是萨莫奈为人知的主导生活方式。乡村公民认为有必要大力投资于这些乡村活动，在萨莫奈核心地的谷地清理新牧场，并通过在新获得的领土上发放土地。我们的许多人民比以往任何时候都更高效地从事牧羊和农作物种植。"
 samnium_event.52.t:0 "$samnium_2_task_28$"
 samnium_event.53.a:0 "让我们将羊变成银子"
 samnium_event.53.desc:0 "萨莫奈的新繁荣将我们从自给农业国家转变为原材料出口国。从简单的肉类、小麦和羊毛到更精致的葡萄酒和橄榄油，一切都从内地运到港口市场并运往海外。许多萨莫奈农民首次从他们不懈的劳动中获得微薄的利润，国家资金也从中受益。在外交领域，我们作为主食生产者的声誉使那些可能对我们军事扩张感到担忧的人给予我们信任。"
 samnium_event.53.t:0 "$samnium_2_task_29$"
 samnium_event.54.a:0 "我们最富有的农民的住宅可媲美贵族庄园"
 samnium_event.54.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]及[ROOT.GetCountry.GetCapital.GetArea.GetName]全境，我们见证了一个奇怪的现象——富有的农民。事实上，非常富有的农民。从往来于我们首都的贸易到周边乡村的广阔农田，我们首都省份昔日贫困的农民正经历着我们国家从未见过的社会流动性和繁荣。萨莫奈的普通民众非常满意，我们也从这一发展中获利颇丰。"
 samnium_event.54.t:0 "$samnium_2_task_30$"
 samnium_event.55.a:0 "有时候必须安抚不满的贵族。"
 samnium_event.55.desc:0 "随着统治集团决定采取意大利本土主义政策，从希腊世界进入我们港口城市的贸易量逐渐减少。因此，我们的贵族家族因缺乏来自海外的地位象征物和精美商品而感到愤怒。为了确保他们的支持，必须通过政治任命和特殊税收优惠，至少安抚了一些显赫家族。消除了不忠精英的危险后，我们的国家可以安稳休息。"
 samnium_event.55.t:0 "$samnium_2_task_31$"
 samnium_event.56.a:0 "无论如何——前往[GetProvince('(int32)439').GetName]！"
 samnium_event.56.b:0 "我们无法抽出时间或费用。"
 samnium_event.56.desc:0 "[ROOT.GetCountry.GetRuler.GetName]已踏上盛大的希腊之旅——来自崛起的萨莫奈国家的里程碑式外交使命！在我们接近比雷埃夫斯港并继续前往雅典之前，我们需要做出决定。我们的占卜师请求使团首先停靠[GetProvince('(int32)439').GetName]，拜访#E 皮提亚#!——#E 德尔斐神谕#!。虽然这位传奇女祭司的话语可能具有重大意义，且一个我们这样地位的国家理应向#E 皮提亚#!致敬，但这样的绕道也将带来显著的成本。我们应否拜访#E 神谕#!？"
 samnium_event.56.t:0 "前往雅典途中"
 samnium_event.57.a:0 "无论如何——前往[GetProvince('(int32)424').GetName]！"
 samnium_event.57.b:0 "我们无法抽出时间或费用。"
 samnium_event.57.desc:0 "[ROOT.GetCountry.GetRuler.GetName]已踏上盛大的希腊之旅——来自崛起的萨莫奈国家的里程碑式外交使命！在我们接近[GetProvince('(int32)430').GetName]港口并继续前往斯巴达之前，我们需要做出决定。我们的占卜师请求使团首先停靠[GetProvince('(int32)439').GetName]，拜访#E 皮提亚#!——#E 德尔斐神谕#!。虽然这位传奇女祭司的话语可能具有重大意义，且一个我们这样地位的国家理应向#E 皮提亚#!致敬，但这样的绕道也将带来显著的成本。我们应否拜访#E 神谕#!？"
 samnium_event.57.t:0 "前往拉科尼亚"
 samnium_event.58.a:0 "当然！我们必须接受他们的慷慨款待！"
 samnium_event.58.b:0 "我们不能信任一群陌生人——回船上。"
 samnium_event.58.c:0 "立即让卫兵处决这些农民！"
 samnium_event.58.desc:0 "[ROOT.GetCountry.GetRuler.GetName]已踏上盛大的希腊之旅——来自崛起的萨莫奈国家的里程碑式外交使命！航程对使团中的一些人来说颇为艰难——毕竟，萨莫奈最近才开始航海——包括[ROOT.GetCountry.GetRuler.GetName]本人，他在旅途中大部分时间都在向伊奥尼亚海和爱琴海‘奉献’他的胃内容物。因此，当我们的[ROOT.GetCountry.GetRulerTitle]宣布船只将首先停靠在塞萨利村庄[GetProvince('(int32)392').GetName]而非佩拉时，船员们并不惊讶。虽然他声称希望体验希腊真实的乡村生活，但海上数周后渴望脚踏实地的需求可能是他真正的动机。\n\n一群萨莫奈官员在陌生领土上并非最出色的导航者，不久使团便在海边与小镇之间的狭窄牧道上迷路了。黄昏前，我们的官员遇到了一群当地村民。这些山地人发现了萨莫奈船帆接近他们的海岸——在塞萨利山区是罕见的事件——这些村民冒险出来迎接这些从海上而来的神秘人。\n\n在听闻萨莫奈官员的故事以及他们航行千里来到此地的目的后，这些山地人立即为这些迷途的意大利人提供了庇护和食物。我们的[ROOT.GetCountry.GetRulerTitle]如何回应？"
 samnium_event.58.t:0 "山地人民"
 samnium_event.59.a:0 "我将如何统治？我将被如何铭记？"
 samnium_event.59.b:0 "萨莫奈的命运是什么？"
 samnium_event.59.c:0 "我的人民会繁荣吗？"
 samnium_event.59.desc:0 "与祭司整整一天的讨论，前往阿波罗神庙的游行，仪式沐浴，献礼与牺牲：这些都一闪而过。在内殿中，香气充鼻，烟雾弥漫，神谕的面容如雕像般冷漠，仿佛未完全存在于这个世界。就在此刻，[ROOT.GetCountry.GetRuler.GetName]感到话语涌上唇边："
 samnium_event.59.t:0 "拜访皮提亚"
 samnium_event.6.a:0 "没有和平，何来战争？"
 samnium_event.6.desc:0 "我们与罗马人的第三次伟大斗争已结束。我们的战士领取报酬，回归牧场和田地，因为从我们贫瘠的故土获取生计的永无止境任务必须继续。死者将被埋葬，家庭将团聚，正常生活将恢复。这场决定性的战争将我们的国家推向了边缘，恢复期已开始。从山脉到谷地，萨莫奈一片宁静。"
 samnium_event.6.t:0 "$samnium_task_6$"
 samnium_event.60.a:0 "松了一口气。"
 samnium_event.60.b:0 "这可不好……"
 samnium_event.60.desc_1:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的温和统治将成为后人的榜样。’紧张的时刻过去，[ROOT.GetCountry.GetRuler.GetFirstName]露出宽慰的笑容。"
 samnium_event.60.desc_2:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的暴政将激起近远之地的仇恨。’[ROOT.GetCountry.GetRuler.GetName]感到胸中一阵冰冷的恐惧，身子后退。"
 samnium_event.60.t:0 "拜访皮提亚：回答"
 samnium_event.61.a:0 "松了一口气。"
 samnium_event.61.b:0 "这可不好……"
 samnium_event.61.desc_1:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的国家将征服他国，成就持久的伟大。’紧张的时刻过去，[ROOT.GetCountry.GetRuler.GetName]感到胸膛因骄傲而挺起。"
 samnium_event.61.desc_2:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的国家将成为他国的玩物，陷入毁灭；萨莫奈将被抹灭。’[ROOT.GetCountry.GetRuler.GetName]震惊地僵住，垂下目光。"
 samnium_event.61.t:0 "拜访皮提亚：回答"
 samnium_event.62.a:0 "好消息。"
 samnium_event.62.b:0 "这可不好……"
 samnium_event.62.desc_1:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的人民将富足快乐，永远满足。’[ROOT.GetCountry.GetRuler.GetName]感到腹中一阵宽慰。"
 samnium_event.62.desc_2:0 "神谕的低语，微弱到几乎听不见，钻进[ROOT.GetCountry.GetRuler.GetName]的脑海：‘你的人民将失去所有积累，深知饥饿。’[ROOT.GetCountry.GetRuler.GetName]感到心头一沉。"
 samnium_event.62.t:0 "拜访皮提亚：回答"
 samnium_event.63.a:0 "无论如何。"
 samnium_event.63.b:0 "没有时间浪费——继续前行。"
 samnium_event.63.desc:0 "我们的外交使团在该地区，错过底比斯之城将是遗憾。曾被亚历山大大帝摧毁，后在随后几年重建。访问将为[ROOT.GetCountry.GetRuler.GetName]及其官员提供机会，了解一座新建且现代的希腊城市，以及命运无常的教训。虽然这会偏离我们的主要目的地，但访问可能带来回报。"
 samnium_event.63.t:0 "底比斯之城"
 samnium_event.64.a:0 "让我们看看这些阿卡迪亚农民的营地。"
 samnium_event.64.b:0 "不——让我们继续前往斯巴达。"
 samnium_event.64.c:0 "他们一定在密谋反对我们——全部杀死！"
 samnium_event.64.desc:0 "连接[GetProvince('(int32)430').GetName]到斯巴达的道路繁忙，我们的[ROOT.GetCountry.GetRulerTitle]及其同伴在前往目的地的路上遇到许多人并不奇怪。一群同行者尤其引起了萨莫奈使团的注意，因为他们与萨莫奈的牧羊人相似：阿卡迪亚牧人，驱赶一群杂畜前往[GetProvince('(int32)430').GetName]的港口。交谈后，很快收到了邀请，参观附近这些牧人居住的看似简陋贫穷的营地。"
 samnium_event.64.t:0 "阿卡迪亚的牧人"
 samnium_event.65.a:0 "这面金色盾牌激励了萨莫奈部队。"
 samnium_event.65.b:0 "这些珠宝将成为上流社会女士的精美礼物。"
 samnium_event.65.c:0 "省下一德拉克马就是赚了一德拉克马。"
 samnium_event.65.desc:0 "一个宽阔的公共空间——集市——占据了底比斯城的中心。恰巧在[ROOT.GetCountry.GetRuler.GetName]到达的当天，集市正在举办一场格外热闹的市场。小贩和牲畜的叫声充斥空气，但一个摊位尤其吸引了[ROOT.GetCountry.GetRulerTitle]的目光。这个摊位贩卖来自远方的奇珍异宝，其中两件尤为突出。一件是盾牌，镶嵌着白金边框，刻有赫拉克勒斯的图案；另一件是一组精美珠宝——红宝石、祖母绿、钻石和蛋白石。[ROOT.GetCountry.GetRuler.GetFirstName]的钱袋是否感觉有点沉重？"
 samnium_event.65.t:0 "底比斯集市"
 samnium_event.66.a:0 "是的，再来一件希腊遗物。"
 samnium_event.66.b:0 "别管王冠——你想不想做[ROOT.GetCountry.GetRulerTitle]的妻子？"
 samnium_event.66.c:0 "真是浪费时间。"
 samnium_event.66.desc:0 "阿卡迪亚牧人的营地确实简陋贫穷。几顶肮脏的帐篷随意搭建，大约十几个人围着一堆冒烟的篝火闲逛。在这个荒凉的营地中，几乎没有什么值得注意的东西，除了两件事：第一件是一顶古老的锡制王冠，镶嵌着青金石，从营地厨子的长袍下取出，立刻被拿出来出售。第二件是厨子本人。\n\n怎么样，[ROOT.GetCountry.GetRulerTitle]？想买一顶王冠吗？"
 samnium_event.66.t:0 "与阿卡迪亚人交易"
 samnium_event.67.a:0 "我们将访问柏拉图学院。"
 samnium_event.67.b:0 "我们将在港口度过时间。"
 samnium_event.67.desc:0 "雅典城以其民主制度、众多哲学家和传奇的比雷埃夫斯港口而闻名。我们的使团穿过特米斯托克利城墙的大门，立即被这座希腊世界中最美丽的城市之一所震撼，卫城主宰着天际线。[ROOT.GetCountry.GetRuler.GetName]的顾问们展开激烈争论，讨论哪一个雅典机构最值得萨莫奈外交努力：柏拉图学院，哲学家的家园和知识的宝库；还是港口，那里可以达成贸易协议并获得海军灵感。我们的[ROOT.GetCountry.GetRulerTitle]有最终决定权："
 samnium_event.67.t:0 "抵达雅典"
 samnium_event.68.a:0 "我们将走陆路。"
 samnium_event.68.b:0 "我们将乘船离开。"
 samnium_event.68.desc:0 "近一周过去了，是时候离开宏伟的雅典城了。[ROOT.GetCountry.GetRuler.GetName]已经开始怀念他在城邦的时光，白天与商人讨价还价，夜晚与哲学家争论到深夜。他的顾问们再次为一个琐碎问题争吵：是陆路离开城市，还是乘船离去。尽管这个选择似乎无关紧要，但旅途的危险、强盗和海盗主导了讨论。[ROOT.GetCountry.GetRuler.GetName]再次做出决定："
 samnium_event.68.t:0 "离开雅典"
 samnium_event.69.a:0 "支付赎金。"
 samnium_event.69.b:0 "我们绝不与强盗谈判！"
 samnium_event.69.desc:0 "众所周知，路上强盗是常伴的危险。当萨莫奈官员和外交官在回家的路上被一群看似希腊祭司的人经过时，护卫队并未感到警觉。当这些人在长袍下抽出刀子时，萨莫奈人毫无还手之力——强盗占了上风。\n\n近一周后，萨莫奈首都收到一封信，用蹩脚的奥斯坎文字书写：一封保证[ROOT.GetCountry.GetRuler.GetName]安全返回的提议，交换条件是一大笔银子。"
 samnium_event.69.t:0 "遭到强盗伏击"
 samnium_event.7.a:0 "罗马在燃烧！值得欢庆的一天"
 samnium_event.7.desc:0 "曾经伟大的罗马城——我们的宿敌——如今烈焰熊熊。拉丁人总是对我们的城镇残酷无情，现在我们以牙还牙。我们的军队在辎重车中带回了大量的金银战利品。从他们的神庙中掠夺的许多财富，最初是在前几次战争中从我们的城市抢来的，如今物归原主。还有许多是从其他萨贝利部落和伊特鲁里亚城市在罗马百年统治中掠夺的。现在是我们的神庙展示战利品，我们的士兵接受珍贵钱币和牛羊的馈赠。\n\n我们从罗马带回的不仅是金银。在洗劫他们的城市和对抗他们的军队时，我们注意到他们在城市规划和建设、复杂的宗教和外交习俗，以及最重要的军事技术上的进步。我们可以学习他们的城市生活方式。\n\n我们的人民胜利了，我们的国库充盈。"
 samnium_event.7.t:0 "$samnium_task_7$"
 samnium_event.70.a:0 "支付赎金。"
 samnium_event.70.b:0 "我们绝不与海盗谈判！"
 samnium_event.70.desc:0 "众所周知，海上的海盗是常伴的危险。当一名船员发现两艘战舰靠近时，立即发出警报，船对船的追逐随之展开。然而，一艘租来的运输船无法匹敌专为海盗行为设计的战舰速度，萨莫奈船只被追上并登船只是时间问题。\n\n近一周后，萨莫奈首都收到一封信，用蹩脚的奥斯坎文字书写：一封保证[ROOT.GetCountry.GetRuler.GetName]安全返回的提议，交换条件是一大笔银子。"
 samnium_event.70.t:0 "被海盗绑架"
 samnium_event.71.a:0 "家，甜蜜的家。"
 samnium_event.71.desc:0 "[ROOT.GetCountry.GetRuler.GetName]终于回到家中，睡在自己的床上。丰富的希腊宴会、异国语言、壮丽的城市和愉快陪伴的记忆依然萦绕在他的脑海。\n\n这次旅行非常成功。在希腊各地建立了外交和贸易联系，双方承诺定期通信和运输。希腊政治、军事战术和建筑的详细研究被萨莫奈官员和抄写员带回，填满了大量的笔记。这些笔记现正被抄录并在萨莫奈精英中讨论。这次远征的故事也在萨莫奈的文盲自由民中广为流传，成为忠诚萨莫奈人体验异域风情的激动人心的传说——[ROOT.GetCountry.GetRuler.GetName]在普通民众中越来越受欢迎。\n\n现在，我们的[ROOT.GetCountry.GetRulerTitle]满足于让希腊的记忆在入睡时化为梦境。"
 samnium_event.71.t:0 "终于回家"
 samnium_event.72.a:0 "如何将人塑造成战士的建议。"
 samnium_event.72.b:0 "在萨莫奈的新工作。"
 samnium_event.72.desc:0 "斯巴达城以其勇猛的战士和位于独特易守的埃夫罗塔斯谷而闻名，对萨莫奈外交官来说是一座令人敬畏的军事堡垒。他们很快来到斯巴达的主军营，记录当地士兵持续进行的训练。一位满脸伤疤、经验丰富的军事教官立即吸引了[ROOT.GetCountry.GetRuler.GetName]的注意。不久，[ROOT.GetCountry.GetRuler.GetName]与他展开深入讨论，并决定向这位斯巴达教官询问……"
 samnium_event.72.t:0 "抵达斯巴达"
 samnium_event.73.a:0 "再见，斯巴达。"
 samnium_event.73.desc:0 "近一周过去了，是时候离开斯巴达这座堡垒之城了。在这座名城学习军事传统的一周令人疲惫，[ROOT.GetCountry.GetRuler.GetName]期待回到稍不那么尚武的萨莫奈家乡好好休息。不过在休息放松之前，还有返程问题：先经陆路前往海岸，再经历漫长航程返回本土港口，每一段都有相应危险。随着城市在身后渐渐远去，[ROOT.GetCountry.GetRuler.GetName]稍稍松了一口气。"
 samnium_event.73.t:0 "离开斯巴达"
 samnium_event.74.a:0 "让我们向这些希腊山区牧民学习。"
 samnium_event.74.b:0 "这个男人不是有个未婚的女儿吗？无需嫁妆。"
 samnium_event.74.c:0 "邀请这个人在我们的宫廷工作。"
 samnium_event.74.d:0 "让我们继续冒险。"
 samnium_event.74.desc:0 "在[GetProvince('(int32)392').GetName]的山地民族处短暂逗留已延长为数天，又多了几天。主人的慷慨让我们的[ROOT.GetCountry.GetRulerTitle]对这些贫穷牧人产生了好感，他们的土地和生活方式与萨莫奈故土并无太大不同。[ROOT.GetCountry.GetRuler.GetName]一直住在村里一位领头农民的家中。他们的交谈主要围绕两件事：山区农业的艰难，以及这位贫穷农民令人瞩目的出身，他自称是传奇希腊国王埃阿科斯的后裔，也是伊庇鲁斯的伟大皮洛士的直系祖先。\n\n随着海上旅途的喘息即将结束，我们的[ROOT.GetCountry.GetRulerTitle]将从这次 detour 中带走什么？"
 samnium_event.74.t:0 "山地民族"
 samnium_event.75.a:0 "庞大帝国的复杂政治。"
 samnium_event.75.b:0 "使人伟大的战争与征服艺术。"
 samnium_event.75.desc:0 "外交使团终于抵达最终目的地：伟大的希腊岛城#E 佩拉#!，有史以来最伟大将领#E 亚历山大大帝#!的诞生地，也是其帝国及其充满活力的继承国之一的首都和中心。在与[GetProvince('(int32)379').GetOwner.GetName]官员的会面中，我们很快发现希腊的制度根深蒂固，复杂的任命和派系体系的历史与图表填满了[ROOT.GetCountry.GetRulerTitle]顾问们的纸莎草笔记。[ROOT.GetCountry.GetRuler.GetName]对聆听亚历山大大帝的故事感到兴奋和着迷，这些故事来自或许亲自认识他的人，或能追溯到他麾下将领血统的人。\n\n当我们离开此地时，[ROOT.GetCountry.GetRuler.GetName]将最怀念什么？"
 samnium_event.75.t:0 "抵达佩拉"
 samnium_event.76.a:0 "再见，马其顿。"
 samnium_event.76.desc:0 "当[ROOT.GetCountry.GetRuler.GetName]看着菲利普二世的宫殿在身后渐渐远去，他回想起佩拉的奢华宴会和建筑，超越萨莫奈粗糙工艺的精美大理石雕像，以及最重要的，从希腊到印度的帝国遗产。很快，他将回到萨莫奈的山丘和村庄。要将萨莫奈提升到希腊文明的标准需要几代人的努力，但[ROOT.GetCountry.GetRuler.GetName]现在确信，他的统治将是这一道路的第一步。佩拉被落日掩盖，耳边只有海浪拍打的声音，暮色中星星开始显现。"
 samnium_event.76.t:0 "离开佩拉"
 samnium_event.77.a:0 "萨莫奈的扩张是众神的意志。"
 samnium_event.77.desc:0 "我们的传统仪式#E 圣春#!是我们信仰中极为有用的原则——一种神圣的安抚方式，一种平息平民的极端牺牲，一种控制人口的方法，以及军事扩张的借口，全都融入一个神圣的行为。通过反复进行这一仪式，我们已将#E 圣春#!确立为我们宗教的核心，并强调其作为军事行动的重要性。"
 samnium_event.77.t:0 "$samnium_2_task_32$"
 samnium_event.78.a:0 "不再是牺牲，而是一场庆典。"
 samnium_event.78.desc:0 "我们的古老仪式#E 圣春#!在我们的议会上引发了激烈争论——进步派嘲笑将年轻人送往荒野是野蛮的浪费，但传统派捍卫这种牺牲，认为这是多次拯救国家的神圣行为。我们决定改革这一仪式是最好的妥协。从今以后，#E 圣春#!的‘牺牲’将是成年志愿者，而非儿童；他们将获得国库的物资，以更好地在边境生存。#E 圣春#!的参与者将在出发前享受一周的盛宴，来自这些男女的整个社区将与他们一同庆祝。希望这一改革后的仪式将成为共同目标的社区凝聚力。"
 samnium_event.78.t:0 "$samnium_2_task_33$"
 samnium_event.79.a:0 "我们的港口还会迎来什么？"
 samnium_event.79.desc:0 "随着希腊德拉克马流入我们商人的口袋，[SCOPE.sP('trade_influx_place').GetName]港口城市的外来区已出现永久的希腊人存在。萨莫奈开始发展一种前所未有的国际化氛围。"
 samnium_event.79.t:0 "外来人口涌入"
 samnium_event.8.a:0 "罗马沦陷！值得欢庆的一天"
 samnium_event.8.desc:0 "曾经伟大的罗马城——我们的宿敌——如今俯首称臣。拉丁人总是试图将我们伟大的国家贬为一个微不足道的附庸国，但现在他们自己却落得如此下场。他们的元老院与我们签订了联盟协议，在这种联盟中，萨莫奈将领导，罗马军团将追随。请欢迎萨莫奈联盟的最新附庸国！\n\n从罗马手中夺取他们初生的帝国，定会永久打破他们的进取精神，些许自治将减轻他们的屈辱感，并保证他们的忠诚。萨莫奈既提供醋也提供蜜。这是我们的领袖[ROOT.GetCountry.GetRuler.GetName]的智慧。\n\n我们的人民胜利了，罗马被征服。"
 samnium_event.8.t:0 "$samnium_task_8$"
 samnium_event.80.a:0 "我们学得够多了。"
 samnium_event.80.b:0 "支付商人，让他们详细记录外国的发明。"
 samnium_event.80.desc:0 "直到最近，萨莫奈与更广阔的地中海世界有些隔绝，现在我们与希腊及其他先进国家建立了永久联系。各种创新，从堡垒建设到复杂的外交安排，从军事战术到宗教仪式，正在充斥我们海外商人的头脑，并在我们显赫家族的家中被讨论。我们已经开始向这些外国人学习，但我们可以更加努力地研究和应用这些希腊的进步。"
 samnium_event.80.t:0 "新知识"
 samnium_event.81.a:0 "一座真正宏伟的城市！"
 samnium_event.81.desc:0 "外来货物在我们的地中海港口结束第一段旅程，但是在我们的首都[GetCountry('SAM').GetCapital.GetName]，我们的贵族家庭和公民协调并资助这些事业，许多希腊小饰品在这里找到最终归宿。如今，[GetCountry('SAM').GetCapital.GetName]的仓库和商业区似乎一夜之间冒出——整座城市迅速成为区域中心。"
 samnium_event.81.t:0 "首都增长"
 samnium_event.82.a:0 "阻止它。"
 samnium_event.82.b:0 "让人民自由选择信仰和崇拜方式。"
 samnium_event.82.desc:0 "不仅是希腊的货币、商品和创新进入我们的国家，还有希腊的宗教。虽然萨莫奈一直崇拜一些希腊神祇，特别是在许多献给#E 赫拉克勒斯#!的圣所中，但我们最富有的公民对这种外来信仰的兴趣代表了与我们祖先意大利宗教的彻底决裂。如果我们选择动用政治力量，可以阻止这种希腊化的兴趣。"
 samnium_event.82.t:0 "外来宗教的吸引力"
 samnium_event.83.a:0 "至少是件积极的事。"
 samnium_event.83.desc:0 "通过我们的港口流入贵族国库的新资金并未停留太久——萨莫奈正在经历学院和其他服务贵族需求的精美建筑的建设热潮，这些建筑由同一社会阶层资助。我们的经济繁荣正在扩大最富有公民的队伍，这种动态的向上流动是我们的联盟前所未有的。"
 samnium_event.83.t:0 "外来投资"
 samnium_event.84.a:0 "金钱宽裕意味着道德松弛。"
 samnium_event.84.desc:0 "大量的金银开始在我们的社会顶层流动。支配拉丁姆及其后续贸易扩张的果实使许多重要人物迅速变得非常富有。[ROOT.GetCountry.GetRuler.GetName]是萨莫奈历史上最有权势的人物之一，不仅在战争事务上行使权威，还在对外贸易中游刃有余。他以自信的态度和天生的管理国家财政的能力适应了扩展的职责。\n\n然而，获取财富的便利并非完全有益于我们领导人物的品格。[SCOPE.sChar('sam_family_head_scope').GetName]变得相当腐败，意图从他的贸易联系和任何权威职位中榨取每一滴银子。他的终极忠诚似乎不是对萨莫奈，而是对自己的钱袋。"
 samnium_event.84.t:0 "贸易的高层受益者"
 samnium_event.85.a:0 "我们无权干涉我们领导人物的实践。"
 samnium_event.85.b:0 "发布谴责。萨莫奈过去是，现在也是意大利国家。"
 samnium_event.85.desc:0 "萨莫奈上流社会因[SCOPE.sChar('sam_pro_hof_scope').GetName]皈依希腊的希腊信仰而震惊！他在埃克拉努姆外的圣所以希腊方式公开献祭牛羊。这一壮观景象被广泛视为意大利派与希腊派分裂我们统治集团的冲突的开端。虽然许多萨莫奈富有的公民进行希腊仪式，但此前从未有如此政治地位和影响力的人物做出这样的举动。\n\n[SCOPE.sChar('sam_con_hof_scope').GetName]在萨莫奈元老院激烈谴责这一行为，呼吁强制执行意大利宗教实践，并正式谴责希腊习俗。我们的回应将不仅仅是宗教自由的立场——它将表明萨莫奈领导层支持哪一派系，并决定萨莫奈未来的方向。"
 samnium_event.85.t:0 "[SCOPE.sChar('sam_pro_hof_scope').GetName]的皈依"
 samnium_event.86.a:0 "随他们去。"
 samnium_event.86.b:0 "强迫他们回归传统价值观。"
 samnium_event.86.desc:0 "我们贵族对希腊文化的兴趣不仅限于宗教。阅读希腊文学、食用由希腊厨师准备的进口希腊食物、在富人庄园展示希腊艺术品已成为地位的标志。[SCOPE.sChar('sam_con_hof_scope').GetName]要求富人回归古老的萨贝利实践，而[SCOPE.sChar('sam_pro_hof_scope').GetName]主张不干涉。"
 samnium_event.86.t:0 "希腊主义的传播"
 samnium_event.87.a:0 "起诉凶手。"
 samnium_event.87.b:0 "希腊人活该。"
 samnium_event.87.desc:0 "我们的贵族分裂为意大利派和希腊派已波及社会较低阶层。几名希腊公民被一群意大利自由民伏击并谋杀，正如现在常见的情况，[SCOPE.sChar('sam_con_hof_scope').GetName]和[SCOPE.sChar('sam_pro_hof_scope').GetName]利用这次谋杀作为政治操弄的代理。[SCOPE.sChar('sam_pro_hof_scope').GetName]坚持严厉惩罚凶手，而[SCOPE.sChar('sam_con_hof_scope').GetName]挖掘出法律技术性问题，让这些爱国者逃脱正义。"
 samnium_event.87.t:0 "希腊公民被谋杀"
 samnium_event.88.a:0 "不惜一切代价追求进步。"
 samnium_event.88.b:0 "不值得。"
 samnium_event.88.desc:0 "随着我们与希腊世界的贸易加深，关于我们的军事、公民、外交和宗教机构的外国思想继续影响负责这些机构的人。拥抱这些新思想将显著推进这些机构，但代价是我们的民众更深的希腊化。[SCOPE.sChar('sam_pro_hof_scope').GetName]当然主张采纳希腊思想，而[SCOPE.sChar('sam_con_hof_scope').GetName]的意大利派坚持我们的国家保持传统的萨莫奈方法。"
 samnium_event.88.t:0 "贸易带来的希腊影响"
 samnium_event.89.a:0 "支持[SCOPE.sChar('sam_pro_hof_scope').GetName]。"
 samnium_event.89.b:0 "屈服于传统主义者的要求。"
 samnium_event.89.desc:0 "萨莫奈的希腊宗教问题已达到顶点——[SCOPE.sChar('sam_con_hof_scope').GetName]与一群有影响力的意大利支持者向元老院请愿，要求正式将传统萨莫奈宗教写入法律，并进一步要求强制皈依希腊仪式的人，并由国家支持萨莫奈的意大利祭司。[SCOPE.sChar('sam_pro_hof_scope').GetName]强烈抗议，坚持认为萨莫奈的进步取决于公民的个人自由。\n\n无论我们选择什么，都将决定萨莫奈联盟的未来方向。"
 samnium_event.89.t:0 "传统主义者的要求"
 samnium_event.9.a:0 "拔剑出鞘，随时应战"
 samnium_event.9.desc:0 "几代以来，萨莫奈军队与罗马军队在半岛上展开了殊死搏斗。我们的部队在崎岖多山的故乡总是占据上风。正是在那里，我们在传奇的考迪尼山口俘获了一整个军团。沿着遍布萨莫奈的牧羊小径以闪电般的速度移动，并在坎帕尼亚和利里斯谷进行血腥突袭是我们的强项。然而，在与罗马的正面交锋中，他们的战术 brilliance 导致我们更多的是失败和屈辱，而非胜利。\n\n这一切已改变。通过不断的锤炼，萨莫奈的铁已成钢，我们的方阵将成为意大利最纪律严明、最有效的力量。"
 samnium_event.9.t:0 "$samnium_task_9$"
 samnium_event.90.a:0 "永不再受威胁。"
 samnium_event.90.desc:0 "萨莫奈几乎被罗马羞辱和血腥摧毁的记忆在几乎每个人的脑海中仍然鲜活，从在战场上与罗马人交锋的前士兵，到最近被他们的突袭队恐吓的牧人，再到萨莫奈社会和影响力的最高层，人们普遍认为萨莫奈绝不再受外来势力的威胁。\n\n为了实现这一目标，决定萨莫奈将展开先发制人的征服行动，夺取邻近土地作为萨莫奈本土的缓冲区，并获取战利品以推动我们的战争机器。萨莫奈的时代即将来临。"
 samnium_event.90.t:0 "$samnium_2_task_40$"
 samnium_event.91.a:0 "我们必须向南北扩展我们的影响力。"
 samnium_event.91.desc:0 "长期以来，人们明白，我们与罗马之间的战争不仅是争夺双方感兴趣的领土，而是决定意大利的未来。半岛是将被拉丁人还是萨莫奈人主导的问题，在我们对罗马的伟大胜利中已决定。我们为自己赢得了喘息空间和重塑意大利世界的自由。"
 samnium_event.91.t:0 "$samnium_2_task_41$"
 samnium_event.92.a:0 "我们将何去何从？"
 samnium_event.92.desc:0 "通过一种或另一种方式，意大利的大部分已落入我们的影响之下。我们的到来并非完全是征服者——我们长期尊重我们政体内各民族的联邦主义传统，这种自治自由地扩展到伊特鲁里亚人、拉丁人、翁布里亚人和其他现在是我们臣民的民族。虽然我们仍处于萨莫奈主导的意大利早期阶段，但在某些地区开始出现一丝泛意大利的统一感。"
 samnium_event.92.t:0 "$samnium_2_task_42$"
 samnium_event.93.a:0 "南部土地已安全。"
 samnium_event.93.desc:0 "大希腊地区——长期以来是萨莫奈主要影响力的区域——现已完全落入我们的轨道。萨莫奈一个多世纪以来一直涉足阿普利亚、卢卡尼亚和布鲁提ウム，从萨莫奈推进这些地区又被推回。随着罗马不再对我们构成威胁，我们有可能打破无休止的突袭循环，在整个大希腊建立永久的萨莫奈存在。特别值得注意的是希腊城市本身，历史上一直是该地区希腊影响、文明和贸易的来源，这种影响对卢卡尼人和布鲁提人尤为显著。随着这些富饶土地和有影响力的城市的征服，萨莫奈现在可以充分感受到这种希腊影响，这让我们的贵族阶层尤为欣喜。"
 samnium_event.93.t:0 "$samnium_2_task_43$"
 samnium_event.94.a:0 "西西里，现在只是萨莫奈的一个省份。"
 samnium_event.94.desc:0 "西西里岛远离萨莫奈的山丘，与我们熟悉的土地和生活方式大不相同。它主要是一个希腊岛，居住着少数布匿人；该岛拥有强大的海军传统，而我们毫无海军；最重要的是，西西里是地中海世界的粮仓，远比我们故乡的岩石土壤肥沃得多。随着我们征服这一伟大奖赏，来自这个战略岛屿的主食将成为财富和出口的来源，并为我们人口过多且坚韧的故乡充当粮仓——当然，前提是我们能够守住这个历史上最令人垂涎的土地之一。"
 samnium_event.94.t:0 "$samnium_2_task_44$"
 samnium_event.95.a:0 "山地部落，走向海洋。"
 samnium_event.95.desc:0 "随着我们征服撒丁岛与科西嘉，萨莫奈民族又达成了一项前所未有的成就。萨莫奈军队此前从未跨海参战；萨莫奈当然一直是内陆民族，并无值得一提的海军，只能依赖他人把贸易和交通带到我们的土地上。凭借这场重大胜利，我们不仅获得了富饶的新岛屿殖民地，并将萨莫奈力量投射到西地中海，还开创了萨莫奈海战的新传统。"
 samnium_event.95.t:0 "$samnium_2_task_45$"
 samnium_event.96.a:0 "我们日益增长的帝国的北方堡垒。"
 samnium_event.96.desc:0 "高卢人长期侵占最北方的意大利民族的土地，有时深入意大利半岛进行掠夺。他们的贪婪和人数一直是我们的政治家和军官持续担忧的来源，我们认为适合派遣好战的萨莫奈人前往波河，夺取它以荣耀萨莫奈。随着高卢人被推回阿尔卑斯山，我们可以开始在这些外来土地上缓慢播种萨莫奈殖民地，以确保我们对该地区的控制——幸运的是，这片谷地对我们的定居者具有吸引力。"
 samnium_event.96.t:0 "$samnium_2_task_46$"
 samnium_event.97.a:0 "这些山地堡垒将屹立不倒。"
 samnium_event.97.desc:0 "阿彭宁山脉长期以来是萨莫奈人和其他萨贝利民族的家园，因此这座伟大山脉的北部将成为保卫萨莫奈意大利免受高卢人和其他外来危险的堡垒位置。这是新意大利的天然边界。新建的防御工事由萨莫奈专家特别挑选，以利用天然的防御位置。"
 samnium_event.97.t:0 "$samnium_2_task_47$"
 samnium_event.98.a:0 "萨莫奈国家的进一步征服。"
 samnium_event.98.desc:0 "随着我们征服西北部的利古里亚地区，我们的边界延伸至阿尔卑斯山脚下。利古里亚人，现在是我们的臣民，将不再受到长期威胁他们的高卢人的危害。此外，该地区的利古里亚部落以其好战天性和常见的雇佣兵职业而闻名，必将为我们凶猛的军事机器带来福音。"
 samnium_event.98.t:0 "$samnium_2_task_48$"
 samnium_event.99.a:0 "终于，北部边界安全了。"
 samnium_event.99.desc:0 "我们在阿尔卑斯边境沿线进行了广泛的建设投资——高卢人历史上多次威胁萨莫奈和其他意大利民族，但我们对内阿尔卑斯地区和更靠近我们故乡的省份的新征服现在免受这一生存威胁。凭借萨莫奈在山地堡垒建设方面的专长，我们再也不必畏惧这些北方蛮族，这些偏远的关隘已被充分利用。"
 samnium_event.99.t:0 "$samnium_2_task_49$"
 samnium_hellenic_pops_tt:0 "至少#Y 50#!个居民信奉#Y [GetReligion('roman_pantheon').GetName]#!信仰。（[SCOPE.ScriptValue('messapia_religion_hellenic_svalue')|R0]/#Y 50#!）"
 samnium_hellenism_contact_increase_tt:0 "萨莫奈世界越来越与#Y 希腊#!世界#Y 接触#!。"
 samnium_hellenism_contact_reaction_tt:0 "我们应如何#Y 应对#!日益增长的[GetCultureGroup('hellenic').GetName|Y]影响？"
 samnium_mission:0 "萨莫奈人反击"
 samnium_mission_2:0 "萨莫奈的命运"
 samnium_mission_2_BUTTON_TOOLTIP:0 "萨莫奈将如凤凰般从过去的灰烬中崛起，耀眼得无法用言语描述。"
 samnium_mission_2_CRITERIA_DESCRIPTION:0 "此任务将在我们决定未来方向后视为完成。根据选择，这可能包括完全征服意大利，或者希腊化到我们不再被视为真正的意大利民族，以及两者之间的各种可能。"
 samnium_mission_2_DESCRIPTION:0 "击败罗马人后，萨莫奈人暴露在希腊世界中，这个世界诱惑许多灵魂走上一条正直的萨莫奈人绝不会踏足的道路。然而，我们的民族不是由人民定义的吗？如果所有人都开始走这条路，或许这是我们的命运？或者恰恰相反，我们必须消灭所有非萨莫奈本质的东西。\n\n重要的决定摆在你面前，其后果将影响整个世界。"
 samnium_mission_BUTTON_TOOLTIP:0 "‘永恒罗马’不过是个空洞的宣言，我们将证明其虚伪。"
 samnium_mission_CRITERIA_DESCRIPTION:0 "此任务将在我们击败宿敌罗马后视为完成。"
 samnium_mission_DESCRIPTION:0 "罗马人两次与我们萨莫奈人交战，两次我们都失败了，但我们将恢复并击败他们。俗话说，事不过三——尤其如果我们能集结足够的力量对抗他们，因为伊特鲁里亚人愿意结盟，翁布里亚人也害怕罗马人。如果我们能组建一个志同道合的联盟，罗马必将覆灭。"
 samnium_socii_annexation_tt:0 "我们将要求罗马的同盟完全臣服并被吞并。"
 samnium_socii_independence_tt:0 "我们将放任罗马的同盟，他们现在是独立的。"
 samnium_socii_vassalage_tt:0 "我们将要求罗马的同盟宣誓效忠。"
 samnium_task_1:0 "前303年之战"
 samnium_task_10:0 "处理同盟"
 samnium_task_10_DESC:0 "罗马人有许多盟友和臣民与他们一起作战。现在我们已夺取罗马，是时候决定如何处理这些同谋。有些并非自愿为罗马作战，被合同强迫服兵役，而其他人自愿并获利颇丰。我们将公平决定如何处理。\n\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 samnium_task_11:0 "颠覆罗马影响"
 samnium_task_11_DESC:0 "一些罗马同盟在过去被罗马击败，导致他们现在的附庸地位。也许我们可以煽动叛乱的火焰，颠覆一个部落，使他们背叛当前的霸主。\n\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 samnium_task_12:0 "那不勒斯的命运"
 samnium_task_12_DESC:0 "第二次萨莫奈战争的最初原因是那不勒斯的亲萨莫奈派系掌权并邀请萨莫奈部队，罗马对此极为不满。现在我们已实现对罗马的保护承诺。\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 samnium_task_1_DESC:0 "公元前303年，卢卡尼人和塔林敦人发起了一场战争，一旦塔林敦向他们的母邦斯巴达求援，这场战争很快结束。作为卢卡尼人的盟友，萨莫奈参与了这场短暂的战争。\n\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 samnium_task_2:0 "寻找盟友"
 samnium_task_2_DESC:0 "我们需要盟友对抗北方的罗马混蛋。他们已经两次击败我们，仅靠伊特鲁里亚人还不够，我们需要更多盟友！\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 samnium_task_3:0 "备战"
 samnium_task_3_DESC:0 "我们需要准备我们的部队，因为冲突即将来临。为了平息罗马刀锋的无尽渴望，需要许多人。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 samnium_task_4:0 "破坏我们的对手"
 samnium_task_4_DESC:0 "没有什么比背叛更能伤害敌人，也没有什么比内部腐烂更能有效摧毁一个国家。让我们播下罗马覆灭的种子。\n\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 samnium_task_5:0 "第三次萨莫奈战争"
 samnium_task_5_DESC:0 "我们两次面对罗马，两次都被击败。现在我们第三次必须面对我们的对手，因为我们已针对他们的士兵和统治者做好准备。现在只有神的干预才能帮助那些混蛋。\n\n\n\n\n\n\n\n\n\n\n@italic_mil20!"
 samnium_task_6:0 "战争与和平"
 samnium_task_6_DESC:0 "多年来，战争主导了我们的人民，许多人渴望和平时期。庄稼需要收割，年轻人需要抚养。没有和平，战争无法存在，和平的时刻已经到来。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 samnium_task_7:0 "战争的战利品"
 samnium_task_7_DESC:0 "罗马人掠夺了许多远近城市。击败他们后，我们有权为自己夺取那些战利品。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 samnium_task_8:0 "驯服罗马狼"
 samnium_task_8_DESC:0 "罗马狼是一个强大民族的象征，没有什么比感知到的自治更能安抚我们统治下的罗马公民。\n\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 samnium_task_9:0 "从战争中学习"
 samnium_task_9_DESC:0 "罗马士兵过去给我们上了痛苦的教训，我们从中学习。没有任何民族能像罗马人那样羞辱我们，因为我们绝不再犯同样的错误。\n\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 samnium_try_suborn_vassal_tt:0 "我们将尝试诱使罗马的一个附庸背叛。"
 samnium_war_lost_recovery:0 "从战争中恢复"
 sma_appenine_forts_tt:0 "[GetProvince('(int32)142').GetArea.GetName|Y]和[GetProvince('(int32)141').GetArea.GetName|Y]区域内每个拥有#Y 要塞#!的省份将获得#Y $sam_fortified_border_fort$#!。"
 strengthen_the_pagus:0 "加强帕吉"
 syncretism_interact_trade:0 "通往更广阔世界的门户"
 temporary_levy_size_samnium:0 "征兵激增"
 traditional_lifestyle:0 "田园经济"
 training_camp_savlue_tt:0 "我们需要至少#Y 3#!个训练营地（#R [SCOPE.ScriptValue('training_camp_svalue')|0]#!/#Y 3#!）。"
 treasure_sam_arcadia:0 "古老锡冠"
 treasure_sam_arcadia_desc:0 "在萨莫奈人旅行时，由伯罗奔尼撒山区的牧人赠予，这顶用青铜制成并饰以青金石的古老王冠，有人称它属于一个几个世纪前消失的古代国王。"
 triple_disc_cuirass:0 "三盘胸甲"
 truly_civilized_samnium:0 "真正文明的萨莫奈"
 ver_sacrum:0 "召唤圣春"
 ver_sacrum_cooldown_tt:0 "我们最近未曾召唤圣春。"
 ver_sacrum_count_tt:0 "至少召唤了#Y 圣春#!#Y 3#!次。（[THIS.GetCountry.MakeScope.GetVariable('ver_sacrum_num_var').GetValue|0|R]/#Y 3#!）"
 ver_sacrum_desc:0 "圣春（Ver Sacrum）很可能是一种起源于青铜时代的仪式，用以应对人口过剩并开启年轻人的迁徙。虽然许多文化曾有类似传统，但如今只有部分意大利民族仍在庆祝并践行这一仪式。\n\n当圣春被召唤时，次年春天出生的所有幼儿和牲畜都将‘奉献’给这一仪式，并被视为受到神圣保护。一旦他们成年，将被要求离开社区，预期通过征服或消灭原有居民，或在无人殖民的土地上建立新定居点。一些人认为，最初‘奉献’的儿童和牲畜会被献祭。\n\n罗马的‘奉献’（devotio）习俗很可能与圣春有关。"
 ver_sacrum_pop_movement_tt:0 "我们的一些居民将#Y 迁移#!到与我们国家#Y 邻近#!的省份。我们将获得对其的#Y 宣称#!。"
 ver_sacrum_req_tt:0 "任意拥有的领土需接近其#Y 人口容量#!。"
 war_aftermath_samnium:0 "战争与和平"

 tartessian_incoming_trade_route_svalue_tt:0 "(#R [SCOPE.ScriptValue('tartessian_incoming_trade_route_current')|0]#!/#Y [SCOPE.ScriptValue('tartessian_incoming_trade_route_total')|0]#!)"

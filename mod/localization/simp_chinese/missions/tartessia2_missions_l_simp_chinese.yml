 tartessian_build_holy_shrines_mod:0 "重新奉献圣地"
 tartessian_cinnabar_robe_treasure:0 "朱砂染色纺织品"
 tartessian_cinnabar_robe_treasure_desc:0 "这件用亚麻布制成的精美仪式长袍采用平纹编织，用朱砂染成鲜红色，是塔特西亚用于宗教仪式的长袍。"

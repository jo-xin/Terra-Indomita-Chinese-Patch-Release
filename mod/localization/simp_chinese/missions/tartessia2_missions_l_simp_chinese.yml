 me_tartessia2_13_tooltip:0 "任务‘#Y $karmo_task_3$#!’现已#G 完成#!"
 me_tartessia2_14_title:0 "更大的卡尔莫亚"
 me_tartessia2_14_tooltip:0 "任务‘#Y $karmo_task_4$#!’现已#G 完成#!"
 me_tartessia2_15_title:0 "图尔德塔尼盔甲"
 me_tartessia2_15_tooltip:0 "任务‘#Y $tartessia2_mission_inv_11_task$#!’现已#G 完成#!"
 me_tartessia2_16_title:0 "准备工作"
 me_tartessia2_16_tooltip:0 "任务‘#Y $astigi_et_urso_1$#!’现已#G 完成#!"
 me_tartessia2_17_title:0 "清除对手"
 me_tartessia2_17_tooltip:0 "任务‘#Y $astigi_et_urso_2$#!’现已#G 完成#!"
 me_tartessia2_18_title:0 "三城"
 me_tartessia2_18_tooltip:0 "任务‘#Y $astigi_et_urso_3$#!’现已#G 完成#!"
 me_tartessia2_19_title:0 "三城"
 me_tartessia2_19_tooltip:0 "任务‘#Y $hasta_task_1$#!’现已#G 完成#!"
 me_tartessia2_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]手指轻敲着[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]嘴唇，倚靠在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]椅子上，聆听信使的报告。房间中央站着一群外交官，中间一位演说者正在宣读一卷书卷。\n\n‘……根据[ROOT.GetCountry.GetAdjective]人民的意愿和#E 塔特西亚继承者#!的合法权威，我们在此宣称你们的土地归我们所有。从今往后，让——’\n\n‘是的，是的，很好。’[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]拍了拍[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]手，立刻遣散了站在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]面前的外交官。"
 me_tartessia2_1_title:0 "塔特西亚的继承者"
 me_tartessia2_1_tooltip:0 "任务‘#Y 塔特西亚的继承者#!’现已#G 完成#!"
 me_tartessia2_2.a:0 "为我们而战的勇士将获得丰厚的金币"
 me_tartessia2_20_title:0 "贸易致富"
 me_tartessia2_20_tooltip:0 "任务‘#Y $hasta_task_2$#!’现已#G 完成#!"
 me_tartessia2_21_title:0 "贸易之城"
 me_tartessia2_21_tooltip:0 "任务‘#Y $hasta_task_3$#!’现已#G 完成#!"
 me_tartessia2_22_title:0 "图尔德塔尼丰收"
 me_tartessia2_22_tooltip:0 "任务‘#Y $tartessia2_mission_inv_12_task$#!’现已#G 完成#!"
 me_tartessia2_23_title:0 "贸易启智"
 me_tartessia2_23_tooltip:0 "任务‘#Y $hasta_task_4$#!’现已#G 完成#!"
 me_tartessia2_24_title:0 "塔尔西斯矿场"
 me_tartessia2_24_tooltip:0 "任务‘#Y $onuba_task_1$#!’现已#G 完成#!"
 me_tartessia2_25_title:0 "图尔德塔尼金属"
 me_tartessia2_25_tooltip:0 "任务‘#Y $onuba_task_2$#!’现已#G 完成#!"
 me_tartessia2_26_title:0 "图尔德塔尼金属"
 me_tartessia2_26_tooltip:0 "任务‘#Y $onuba_task_2$#!’现已#G 完成#!"
 me_tartessia2_29.a:0 "我宣布#E 伊比利亚信仰#!将成为塔特西亚的神系"
 me_tartessia2_29_desc:0 "在向精选的精英议会私下宣布对[ROOT.GetCountry.GetName]的全面改革计划后，[ROOT.GetCountry.GetRuler.GetName]急于获得神祇的青睐，最终决定公开迈出改变塔特西亚历史进程的一步。\n\n虽然这一天宣布的消息让一些人感到惊讶，但最接近[ROOT.GetCountry.GetRulerTitle]的人知道，[ROOT.GetCountry.GetRuler.GetFirstName]的宣言不可避免——外来神祇的腐化影响将被谴责，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族将正式拥抱我们祖先的古老神祇。"
 me_tartessia2_29_title:0 "伊比利亚神祇"
 me_tartessia2_29_tooltip:0 "任务‘#Y 伊比利亚神祇#!’现已#G 完成#!"
 me_tartessia2_2_desc:0 "虽然我们初创的舰队显然无法与[GetCountry('CAR').GetName]等强大海军国家相比，但我们的小船足以载着外交官往返于[GetProvince('(int32)3061').GetName]，那里居住着管理#E 毛里塔尼亚#!海岸的地方总督，从[GetProvince('(int32)3061').GetName]的城堡中安全治理。\n\n在向南方朋友保证我们除了恢复祖先的名誉与荣耀外并无侵略意图后，我们达成了共识。\n\n我们承认有义务为#E 伊比利亚#!的塔特西亚荣耀而战，并承诺若本地军队疲惫不堪，将考虑从#E 非洲#!雇佣佣兵。\n\n消息传开后，[ROOT.GetCountry.GetRuler.GetName]欣喜地得知[ROOT.GetCountry.GetName]内许多雇佣兵对我们的计划表示满意。"
 me_tartessia2_2_title:0 "非洲联系"
 me_tartessia2_2_tooltip:0 "任务‘#Y 非洲联系#!’现已#G 完成#!"
 me_tartessia2_3.a:0 "我们从矿场开采的矿石将重建塔特西亚的根基！"
 me_tartessia2_30.a:0 "塔特西亚已为任何可能发生的事情做好准备"
 me_tartessia2_30_desc:0 "让全世界都知道，[ROOT.GetCountry.GetName]已重生，我们认为[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]整个地区是我们作为显赫先祖后裔的合法遗产。\n\n派遣塔特西亚骑士前往山寨、定居点乃至双柱，毫无畏惧地宣布我们大胆的宣言——无人能阻止我们索取属于我们的东西！"
 me_tartessia2_30_title:0 "贝提卡属于我们"
 me_tartessia2_30_tooltip:0 "任务‘#Y 贝提卡属于我们#!’现已#G 完成#!"
 me_tartessia2_31.a:0 "你们将有许多战利品可拿！尽你们所能携带！"
 me_tartessia2_31_desc:0 "[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]的大片土地现已飘扬着塔特西亚旗帜，[ROOT.GetCountry.GetRuler.GetName]确信，我们消灭该地区所有抵抗只是时间问题。即使强大的#E 迦太基人#!也有理由畏惧我们，因为我们显然不会容忍任何外来势力在我们宣称的土地上存在。\n\n[ROOT.GetCountry.GetRulerTitle]如何奖励在战场上英勇作战、为我们人民带来胜利的[ROOT.GetCountry.GetName]征召兵？通过宣布我们的士兵不会止步于此，而是将继续沿着海岸向北，翻越高山——[GetProvince('(int32)1039').GetArea.GetRegion.GetName]的平原将成为#E 伊比利亚#!下一个沦陷的地区。\n\n营地中嗜血步兵震耳欲聋的呐喊证实了[ROOT.GetCountry.GetRuler.GetFirstName]的猜想，军队将全力拥抱这一机会。"
 me_tartessia2_31_title:0 "争夺孔忒斯塔尼亚"
 me_tartessia2_31_tooltip:0 "任务‘#Y 争夺孔忒斯塔尼亚#!’现已#G 完成#!"
 me_tartessia2_32.a:0 "我们的军队将在孔忒斯塔尼亚度过很多时间……"
 me_tartessia2_32_desc:0 "乘船旅行一直是访问[GetProvince('(int32)1039').GetArea.GetRegion.GetName]各沿海城市的最快方式，因为山脉和丘陵极大地阻碍了陆上交通——但现在情况已改变。\n\n意识到需要物理连接这些领土，[ROOT.GetCountry.GetRuler.GetName]指示塔特西亚国家资源投资于沿海岸建设高速公路系统。\n\n虽然一些人可能认为这一举措出于帮助普通人的利他愿望，但[ROOT.GetCountry.GetRuler.GetFirstName]下令修建道路的理由远更为现实。"
 me_tartessia2_32_title:0 "连接孔忒斯塔尼亚海岸"
 me_tartessia2_32_tooltip:0 "任务‘#Y 连接孔忒斯塔尼亚海岸#!’现已#G 完成#!"
 me_tartessia2_33.a:0 "我们很幸运拥有如此强壮的牲畜……希望这永不改变"
 me_tartessia2_33_desc:0 "每个月，[ROOT.GetCountry.GetRuler.GetName]都会收到一位忧心忡忡的地方官员的报告，描述在[GetProvince('(int32)1039').GetArea.GetRegion.GetName]我们建造的众多种马场中一名奴隶遭受的重伤。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]自然对奴隶的困境表示同情，但此事由神祇掌控，他们赐予我们的马群以繁殖力和健康。"
 me_tartessia2_33_title:0 "孔忒斯塔尼亚骏马"
 me_tartessia2_33_tooltip:0 "任务‘#Y 孔忒斯塔尼亚骏马#!’现已#G 完成#!"
 me_tartessia2_34.a:0 "肉、面包、葡萄酒……人生还有什么比这更重要？"
 me_tartessia2_34_desc:0 "据说品尝[ROOT.GetCountry.GetName]生产的#E 伊比利亚火腿#!是一生难忘的体验。薄切的腌制火腿入口即化，许多城市中的美食家总会在储藏室悬挂一整只猪腿。\n\n幸好，国外对我们美食的热爱同样强烈，他们愿意支付高昂费用将我们的奢侈品进口到他们的餐桌上。"
 me_tartessia2_34_title:0 "伊比利亚火腿"
 me_tartessia2_34_tooltip:0 "任务‘#Y 伊比利亚火腿#!’现已#G 完成#!"
 me_tartessia2_35.a:0 "在塔特西亚的果园中，我能找到平静"
 me_tartessia2_35_desc:0 "虽然[GetProvince('(int32)1039').GetArea.GetRegion.GetName]内适合种植果园的地方不多，但我们庆幸在我们的领地内有两个省份慷慨地赐予我们美味的果实。\n\n每当有空闲时间，[ROOT.GetCountry.GetRuler.GetName]常会悄悄溜到芳香果树林中漫步，手持一颗苹果，[ROOT.GetCountry.GetRuler.GetHerHis]的心灵在一个宝贵的下午得以放松。"
 me_tartessia2_35_title:0 "塔特西亚果园"
 me_tartessia2_35_tooltip:0 "任务‘#Y 塔特西亚果园#!’现已#G 完成#!"
 me_tartessia2_36.a:0 "只要人民满意，我也满意——这才是最重要的"
 me_tartessia2_36_desc:0 "前往[ROOT.GetCountry.GetCapital.GetName]的旅人常惊叹于市场中琳琅满目的商品；我们国家边界内生产的一切精美商品都可在我们繁忙首都的摊位和街道上买到。\n\n[ROOT.GetCountry.GetRuler.GetName]在很大程度上促成了这一财富的转变，他负责建造支撑我们经济的磨坊和市场。\n\n作为[ROOT.GetCountry.GetName]未来将截然不同的象征，[ROOT.GetCountry.GetRulerTitle]甚至下令在[ROOT.GetCountry.GetCapital.GetName]内建造一座#E 渡槽#!——我们注定将成为文化与真正文明之地。"
 me_tartessia2_36_title:0 "塔特西亚磨坊"
 me_tartessia2_36_tooltip:0 "任务‘#Y 塔特西亚磨坊#!’现已#G 完成#!"
 me_tartessia2_37.a:0 "装备士兵，将多余的在市场上出售——加快工作！"
 me_tartessia2_37_desc:0 "得益于充足的原材料供应，我们的金属工人以惊人的速度不断生产各种商品：长矛、剑、盾牌、钉子、火盆、小雕像、戒指——一切需要耐用材料制成的物品。\n\n因此，[ROOT.GetCountry.GetName]享受着我们过剩物资带来的好处并不令人意外；出口从未如此繁荣，我们的建筑师和工程师总是忙碌不堪，在他们下方，车间和磨坊中奴隶的呻吟几乎被磨轮的轰鸣声掩盖。"
 me_tartessia2_37_title:0 "塔特西亚金属加工"
 me_tartessia2_37_tooltip:0 "任务‘#Y 塔特西亚金属加工#!’现已#G 完成#!"
 me_tartessia2_38.a:0 "钱没有臭味，你明白我的意思……"
 me_tartessia2_38_desc:0 "在某些炎热的夏日，当酷热令人窒息，凉风不吹过[ROOT.GetCountry.GetCapital.GetName]的街道时，镇内#E 铸造厂#!的烟雾常常使空气令人窒息。\n\n确实，其气味完全可以与恶臭的#E 制革区#!媲美，尽管一些敏感的社会成员抱怨污染，但显然他们的敏感永远不会阻碍塔特西亚工业的进步，这工业正以惊人的速度向前推进。"
 me_tartessia2_38_title:0 "塔特西亚铸造厂"
 me_tartessia2_38_tooltip:0 "任务‘#Y 塔特西亚铸造厂#!’现已#G 完成#!"
 me_tartessia2_39.a:0 "欢迎来到[ROOT.GetCountry.GetCapital.GetName]，你的新家……"
 me_tartessia2_39_desc:0 "一天早晨，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetCapital.GetName]的#E 训练营#!观看我们的征召兵对练。沉浸在战斗中的[ROOT.GetCountry.GetRulerTitle]被一名顾问拍肩打断，顾问示意看向营地入口。那里，走进来一个陌生身影；一个明显是外国人的男子，却穿着#E 图尔德塔尼盔甲#!。\n\n走近[ROOT.GetCountry.GetRuler.GetFirstName]，[SCOPE.sCharacter('achaeus_wandering_greek_tartessian_chad').GetName]将手放在胸前，深深鞠躬，询问他是否站在塔特西亚的领袖面前。‘我的祖先来自[GetProvince('(int32)379').GetName]城，[SCOPE.sCharacter('achaeus_wandering_greek_tartessian_chad').GetFamilyDisplayAdjective]家族的长矛世代为安提帕特里德家族荣誉而战。战争是我从幼年起唯一熟悉的事物，尽管我忠诚服役，但我听闻了你的伟大功绩，哦[ROOT.GetCountry.GetRuler.GetFirstName]，我来此探寻关于一位传奇[ROOT.GetCountry.GetRulerTitle]复兴#E 塔特索斯#!的传言是否属实。’\n\n‘欢迎，[SCOPE.sCharacter('achaeus_wandering_greek_tartessian_chad').GetFirstName]，愿你发现我们的塔特西亚款待如传言般美好。’[ROOT.GetCountry.GetRuler.GetFirstName]低语道，身体前倾在[ROOT.GetCountry.GetRuler.GetHerHis]座位上。‘告诉我，战士；你自称是希腊人，却穿着我人民的盔甲……这是如何发生的？’\n\n‘我曾有幸认识一名塔特西亚佣兵，名叫#E 奥里索斯#!，我们一起征服与欢宴了七个征战季——真正的兄弟。但神祇反复无常，今日给予，明日夺走，当一支凶猛的#E 加拉提人#!军队从北方荒原崛起，入侵我的祖国时，奥里索斯在战斗中倒下。他临终前将盔甲托付给我，恳求我寻找他族人的故土，承诺我将在那里找到家园。’\n\n[ROOT.GetCountry.GetRuler.GetFirstName]起身，拥抱了这位希腊战士。"
 me_tartessia2_39_title:0 "流浪的将军"
 me_tartessia2_39_tooltip:0 "任务‘#Y 流浪的将军#!’现已#G 完成#!"
 me_tartessia2_3_desc:0 "不久前，#E 塔特西亚#!的矿场以如今难以想象的产能运作，尽管我们尚未完全掌握祖先对大地的掌控，[ROOT.GetCountry.GetRuler.GetName]决心以任何可能的方式增加[ROOT.GetCountry.GetName]的产量。\n\n幸运的是，我们的[ROOT.GetCountry.GetAdjective]征召兵并未让矿场的财富流入[ROOT.GetCountry.GetCapital.GetName]富商的口袋——实际上，许多士兵获得了由城市大师铁匠打造的精良武器，因为军队是这些物质财富的最大受益者。"
 me_tartessia2_3_title:0 "恢复古老矿场"
 me_tartessia2_3_tooltip:0 "任务‘#Y 恢复古老矿场#!’现已#G 完成#!"
 me_tartessia2_4.a:0 "这些土地是#E 塔特西亚#!的重要组成部分，注定将成就辉煌"
 me_tartessia2_40.a:0 "塔特西亚的勇士们，伴随胜利前行！神祇与我们同在！"
 me_tartessia2_40_desc:0 "现在我们已征服了与#E 卢西塔尼亚#!地区接壤的边疆，我们的侦察兵开始探查边界，为即将入侵东北方的山脉和森林收集情报。我们的军队冲过#E 阿纳斯河#!只是时间问题，一旦我们对卢西塔尼亚人发起进攻，将无人能阻挡他们。"
 me_tartessia2_40_title:0 "进军卢西塔尼亚"
 me_tartessia2_40_tooltip:0 "任务‘#Y 进军卢西塔尼亚#!’现已#G 完成#!"
 me_tartessia2_41.a:0 "塔特西亚制造的一切都非凡，连我们的餐盘也不例外"
 me_tartessia2_41_desc:0 "虽然我们作坊生产的#E 红釉陶器#!不如市场上发现的金饰珍贵，但我们仍大力投资以确保我们的陶瓷品质卓越，我们正因制造令人赏心悦目的优质陶器@earthware!而赢得声誉。"
 me_tartessia2_41_title:0 "红釉陶器"
 me_tartessia2_41_tooltip:0 "任务‘#Y 红釉陶器#!’现已#G 完成#!"
 me_tartessia2_42.a:0 "我们的舰队确保我们在保卫海岸的同时能投射力量"
 me_tartessia2_42_desc:0 "从我们的征召兵占领[GetProvince('(int32)1319').GetName]的那一刻起，我们的军事工程师几乎为获得天然港口而兴奋得口吐白沫，在我们的部队离开该省之前，现已完成的#E 塔特西亚军事港口#!的首批设计已在营地中绘制。\n\n现在，我们骄傲的建筑师报告说，港口区已升级，奥利西波建造的船坞是[ROOT.GetCountry.GetName]内最先进的军事设施之一。"
 me_tartessia2_42_title:0 "获取奥利西波"
 me_tartessia2_42_tooltip:0 "任务‘#Y 获取奥利西波#!’现已#G 完成#!"
 me_tartessia2_43.a:0 "我将支付微薄费用建造你们的巢穴，因为收益多多"
 me_tartessia2_43_desc:0 "一个清爽的早晨，一艘塔特西亚船只正驶向[GetProvince('(int32)1319').GetName]的港口时，一艘海盗船靠近，挥舞旗帜请求我们倾听他们的提议。对这一提议感到好奇但保持警惕，我们的水手放慢速度，允许海盗靠上来。\n\n介绍完毕后，显然这些强盗来自[GetProvince('(int32)1318').GetName]，海盗在那里公开设点，骚扰进出#E 伊比利海#!的船只。起初，[ROOT.GetCountry.GetRuler.GetName]曾考虑将他们驱逐出#E 卢西塔尼亚#!，但最终决定暂时搁置，优先考虑塔特西亚人民其他事务。但对海盗来说，显然这只是暂时的。\n\n意识到他们的日子无多，这些恶棍请求联手；如果我们在[GetProvince('(int32)1319').GetName]为他们建造一座#E 海盗避风港#!，他们承诺教我们的水手所有奴役技巧——[ROOT.GetCountry.GetRuler.GetFirstName]无法抗拒这一提议。"
 me_tartessia2_43_title:0 "巴尔巴里翁的海盗"
 me_tartessia2_43_tooltip:0 "任务‘#Y 巴尔巴里翁的海盗#!’现已#G 完成#!"
 me_tartessia2_44.a:0 "我从未找到比我头上这顶更温暖柔软的帽子"
 me_tartessia2_44_desc:0 "虽然我们不依靠野生猎物养活饥饿的国家，而是专注于农业的稳定节奏来填饱人民的肚子，但我们在[GetProvince('(int32)1309').GetArea.GetRegion.GetName]的强大猎人捕获了如此多的毛皮@fur!，以至于猎物肉已成为该省的主食。\n\n毛皮披风和帽子的出口本身已成为一项强大的产业，我们的林人捕获的厚实皮毛为严寒的冬天提供保护。甚至[ROOT.GetCountry.GetRuler.GetName]也在[ROOT.GetCountry.GetRuler.GetHerHis]狩猎时穿上#E 卢西塔尼亚毛帽#!，常在森林中围坐在火堆前，烤野猪的美味香气弥漫在空气中。"
 me_tartessia2_44_title:0 "卢西塔尼亚毛皮"
 me_tartessia2_44_tooltip:0 "任务‘#Y 卢西塔尼亚毛皮#!’现已#G 完成#!"
 me_tartessia2_45.a:0 "我们何其幸运，在塔霍河口拥有两座繁荣的城市"
 me_tartessia2_45_desc:0 "过去几年，[GetProvince('(int32)1309').GetArea.GetRegion.GetName]蓬勃发展的毛皮@fur!贸易已自成一体，许多船只沿#E 塔霍河#!运送皮毛和肉类货物，目的地是[GetProvince('(int32)1319').GetName]的市场。\n\n然而，尽管我们尽力适应爆炸性增长，奥利西波已不堪重负，其基础设施无法支持所有希望居住在城墙内的人，许多拥挤的沿海城市居民开始在河对岸的[GetProvince('(int32)1318').GetName]建造家园和商店，那里的土地更便宜。\n\n因此，巴尔巴里翁城自然形成。[ROOT.GetCountry.GetRuler.GetName]抓住机会，召集当地海盗在该省建造另一座#E 塔特西亚军事港口#!，现在许多船只停靠在俗称#E ‘蛮族堡垒’#!的地方。"
 me_tartessia2_45_title:0 "蛮族堡垒"
 me_tartessia2_45_tooltip:0 "任务‘#Y 蛮族堡垒#!’现已#G 完成#!"
 me_tartessia2_46.a:0 "整个伊比利亚触手可及！让我们继续向北推进！"
 me_tartessia2_46_desc:0 "我们身经百战的征召兵几乎无法相信自己的好运，即使是我们军队中最愤世嫉俗的人也真心相信神祇与我们同在。一次又一次的胜利为塔特西亚人民赢得荣耀，我们现在站在[GetProvince('(int32)1047').GetArea.GetRegion.GetName]地区的边界上。\n\n希望抓住这一势头，[ROOT.GetCountry.GetRuler.GetName]在战场上对部队发表讲话，敦促他们完成被托付的任务。"
 me_tartessia2_46_title:0 "目标加利西亚"
 me_tartessia2_46_tooltip:0 "任务‘#Y 目标加利西亚#!’现已#G 完成#!"
 me_tartessia2_47.a:0 "我从未见过比这更大的鱼！"
 me_tartessia2_47_desc:0 "[ROOT.GetCountry.GetCapital.GetName]终于传来了[GetProvince('(int32)1047').GetArea.GetRegion.GetName]蓬勃发展的渔业消息，这迅速成为好斗的加利西亚人的主要工作来源。我们沿北部海岸建造的众多农场和渔场正在带来回报，我们的渔民带着几乎撑破渔网的渔获返回港口。\n\n作为对[ROOT.GetCountry.GetRulerTitle]慷慨的个人感谢，北部鱼贩向塔特西亚首都送去了一条巨大的熏金枪鱼。"
 me_tartessia2_47_title:0 "加利西亚渔业"
 me_tartessia2_47_tooltip:0 "任务‘#Y 加利西亚渔业#!’现已#G 完成#!"
 me_tartessia2_48.a:0 "我们拥有的朱砂越多，对塔特西亚越好……"
 me_tartessia2_48_desc:0 "虽然众所周知[GetProvince('(int32)1116').GetName]的丘陵是稀有矿物朱砂@cinnabar!的来源，[ROOT.GetCountry.GetRuler.GetName]直觉认为附近还有其他宝贵贸易商品的来源，下令派遣探险队到附近省份寻找隐藏的矿脉。\n\n当[ROOT.GetCountry.GetCapital.GetName]传来消息，附近[GetProvince('(int32)1117').GetName]省发现了珍贵秘密时，[ROOT.GetCountry.GetRulerTitle]是多么高兴。"
 me_tartessia2_48_title:0 "加利西亚朱砂"
 me_tartessia2_48_tooltip:0 "任务‘#Y 加利西亚朱砂#!’现已#G 完成#!"
 me_tartessia2_49.a:0 "我们承诺提供公平的市场价格——塔特西亚商人诚实可靠"
 me_tartessia2_49_desc:0 "只有少数国家拥有朱砂@cinnabar!矿，[ROOT.GetCountry.GetName]是这些出口宝贵矿物的国家中最杰出的。\n\n每周，外国船只停靠在我们的海岸，来自[GetProvince('(int32)516').GetName]和[GetProvince('(int32)416').GetName]等异域之地的富有商人冒险进入我们的市场，愿意花费任何代价装满他们的货舱。"
 me_tartessia2_49_title:0 "著名的朱砂出口商"
 me_tartessia2_49_tooltip:0 "任务‘#Y 著名的朱砂出口商#!’现已#G 完成#!"
 me_tartessia2_4_desc:0 "虽然不像南方那样人口稠密——只有[GetProvince('(int32)1339').GetName]和[GetProvince('(int32)1356').GetName]两座城市值得一提——但占领#E 贝蒂斯河#!北岸的土地仍有许多值得庆祝之处。\n\n[ROOT.GetCountry.GetRuler.GetName]借此机会宣扬[ROOT.GetCountry.GetRuler.GetHerHis]的功绩，向[ROOT.GetCountry.GetName]的人民承诺，这是一个更伟大事业的预兆。"
 me_tartessia2_4_title:0 "贝蒂斯河北岸"
 me_tartessia2_4_tooltip:0 "任务‘#Y 贝蒂斯河北岸#!’现已#G 完成#!"
 me_tartessia2_5.a:0 "这些都是为了我们国家更大荣耀的必要步骤"
 me_tartessia2_50.a:0 "超出我们最狂野梦想的财富！"
 me_tartessia2_50_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您将欣喜若狂地听到，我们的众多贵金属@precious_metals!矿场为我们的国库带来了银和金——我们从未有过如此多的财富流入国库。\n\n我们的人民，牧羊人和简单农夫的后裔，如今为自己建造砖房，用红釉陶器盛放美食。全国欢腾，感谢您，哦[ROOT.GetCountry.GetRuler.GetFirstName]，改变了他们的命运。这太不可思议了！"
 me_tartessia2_50_title:0 "黄金之河"
 me_tartessia2_50_tooltip:0 "任务‘#Y 黄金之河#!’现已#G 完成#!"
 me_tartessia2_51.a:0 "不久，#E 伊比利亚#!将全归我们所有！"
 me_tartessia2_51_desc:0 "现在，[GetProvince('(int32)1008').GetArea.GetRegion.GetName]的部落正在期待我们的军队，因为整个#E 伊比利亚#!都在南方崛起的势力面前颤抖，这股势力正慢慢吞噬整个半岛。\n\n虽然他们有数月甚至数年的时间准备应对我们军队不可避免的入侵，但我们侦察兵的初步报告显示，他们的防御准备不足。预兆已显现，我们的胜利近在咫尺！"
 me_tartessia2_51_title:0 "占领塔拉科嫩西斯"
 me_tartessia2_51_tooltip:0 "任务‘#Y 占领塔拉科嫩西斯#!’现已#G 完成#!"
 me_tartessia2_52.a:0 "入侵者将在北方迎接他们的末日——我已确保如此"
 me_tartessia2_52_desc:0 "如果#E 比利牛斯山#!北方的任何军队还抱有通过陆路入侵#E 伊比利亚#!核心地带的愚蠢希望，那他们只是在追逐梦想，因为[ROOT.GetCountry.GetRuler.GetName]沿北部边疆建造的防御工事体系将阻止他们轻易越过山脉。\n\n当地要塞的驻军规模已增加，允许近乎不间断的边境巡逻，经验丰富的退伍军人守卫着关口，阻止任何企图伤害[ROOT.GetCountry.GetName]公民的人。"
 me_tartessia2_52_title:0 "北部边疆"
 me_tartessia2_52_tooltip:0 "任务‘#Y 北部边疆#!’现已#G 完成#!"
 me_tartessia2_53.a:0 "我们真幸运能从这些资源中汲取力量"
 me_tartessia2_53_desc:0 "我们对[GetProvince('(int32)1008').GetArea.GetRegion.GetName]好斗的战士知之甚深，因为我们的征召兵与从#E 伊比利亚#!东北部招募的佣兵交战次数多得数不清。\n\n因此，知道我们现在正利用该地区可观的人力资源为己所用，令人宽慰，[GetProvince('(int32)1213').GetName]城已成为希望赚取塔特西亚金币的雇佣兵的聚集地。一旦他们的服务得到保障，他们被派往[ROOT.GetCountry.GetName]各地，充实我们已然庞大的军队。"
 me_tartessia2_53_title:0 "塞格达的士兵"
 me_tartessia2_53_tooltip:0 "任务‘#Y 塞格达的士兵#!’现已#G 完成#!"
 me_tartessia2_54.a:0 "这是一个令人满意的变化，因为我们总是需要更多玻璃"
 me_tartessia2_54_desc:0 "[GetProvince('(int32)1000').GetName]的玻璃吹制@glass!作坊一次又一次证明是[ROOT.GetCountry.GetName]内最有价值的投资之一，得益于[ROOT.GetCountry.GetRuler.GetName]的温和推动，当地业务已大幅扩展。\n\n在一片喜人的形势下，一群才华横溢的学徒在旁边的[GetProvince('(int32)1001').GetName]开设了自己的店铺，兴起了一个迅速取代现有盐@salt!贸易的本地家庭工业。"
 me_tartessia2_54_title:0 "恩波里翁玻璃"
 me_tartessia2_54_tooltip:0 "任务‘#Y 恩波里翁玻璃#!’现已#G 完成#!"
 me_tartessia2_55.a:0 "你们可以得到你们想要的，但你们知道我的代价"
 me_tartessia2_55_desc:0 "[ROOT.GetCountry.GetRuler.GetName]被广泛认为是无与伦比的领袖和可怕的敌人，但很少有人猜到这位[ROOT.GetCountry.GetRulerTitle]还有幽默感——最近在[ROOT.GetCountry.GetName]发生的事件完美地说明了这一点。\n\n在一场漫长而惨烈的围城战后，许多塔特西亚士兵牺牲，骄傲的[GetProvince('(int32)1031').GetName]城——希腊语中的#E ‘瞭望塔’#!——向我们的军队投降，打开城门让我们的士兵进入堡垒。\n\n我们的军队离开该城几周后，当地精英不习惯屈从，难以忍受塔特西亚温和的统治，派遣了一支贵族代表团前往[ROOT.GetCountry.GetCapital.GetName]，大胆请求作为附庸国释放，寻求私下管理自己事务的权利。\n\n出乎所有人意料，[ROOT.GetCountry.GetRuler.GetFirstName]同意了他们的请求，但有一个条件；他们必须将名字改为#E ‘斯帕斯梅诺斯·皮尔戈斯’#!，即#E 破塔#!，作为对塔特西亚统治永久臣服的象征。"
 me_tartessia2_55_title:0 "破塔"
 me_tartessia2_55_tooltip:0 "任务‘#Y 破塔#!’现已#G 完成#!"
 me_tartessia2_56.a:0 "塔特西亚的舰队与[GetProvince('(int32)1031').GetName]的舰队一同航行——现在结束这一切"
 me_tartessia2_56_desc:0 "数月来，[ROOT.GetCountry.GetRuler.GetName]收到来自[GetProvince('(int32)1031').GetName]日益绝望的投诉，因为他们与[GetProvince('(int32)1464').GetName]的海盗之间存在一种几乎未宣战的状态。我们人民间的所有外交请求都被忽视，使我们相信冲突不可避免。\n\n当海盗在光天化日之下公然袭击我们附庸国的海墙时，[ROOT.GetCountry.GetRuler.GetFirstName]终于忍无可忍，发出宣战书。"
 me_tartessia2_56_title:0 "巴利阿里海的紧张局势"
 me_tartessia2_56_tooltip:0 "任务‘#Y 巴利阿里海的紧张局势#!’现已#G 完成#!"
 me_tartessia2_57.a:0 "老实说，我需要一点休息。希望这会很有趣……"
 me_tartessia2_57_desc:0 "现在[GetProvince('(int32)1464').GetName]的麻烦已平息，[ROOT.GetCountry.GetName]进入相对平静的时期，[ROOT.GetCountry.GetRuler.GetName]决定稍作休假，宣布[ROOT.GetCountry.GetRuler.GetSheHe]将亲自访问该小岛，以建立塔特西亚殖民地。\n\n一支盛大的代表团正准备从大陆起航，将[ROOT.GetCountry.GetRulerTitle]运送到塔特西亚国家最新的海外领地。"
 me_tartessia2_57_title:0 "塔特西亚殖民：出发"
 me_tartessia2_57_tooltip:0 "任务‘#Y 塔特西亚殖民：出发#!’现已#G 完成#!"
 me_tartessia2_58.a:0 "让这里的居民专注于民事事务"
 me_tartessia2_58.b:0 "这座岛注定成为军事前哨"
 me_tartessia2_58.c:0 "这座港口城市将成为理想的贸易殖民地"
 me_tartessia2_58.d:0 "我希望这些人专注于神祇和宗教"
 me_tartessia2_58_desc:0 "过去一周活动繁忙但并不令人不快；[ROOT.GetCountry.GetRuler.GetName]及其随行人员在[GetProvince('(int32)1464').GetName]岛上受到皇室般的款待，体验了港口城市在短暂逗留期间提供的所有乐趣。在不忙于宴会和会见当地精英时，[ROOT.GetCountry.GetRuler.GetFirstName]视察了市中心的堡垒或游览了城门外的麻@hemp!农场。\n\n对这片土地及其潜力感到满意，[ROOT.GetCountry.GetRuler.GetFirstName]现在必须决定在此建造何种塔特西亚殖民地——真是一个好问题。"
 me_tartessia2_58_title:0 "塔特西亚殖民：决定"
 me_tartessia2_58_tooltip:0 "任务‘#Y 塔特西亚殖民：决定#!’现已#G 完成#!"
 me_tartessia2_59.a:0 "我将为这次袭击复仇！整个撒丁岛将为此付出代价"
 me_tartessia2_59_desc:0 "离开[GetProvince('(int32)1464').GetName]返回大陆后，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]旗舰上的书房中埋头工作，突然听到甲板上传来疯狂的喊声。冲到外面，[ROOT.GetCountry.GetRuler.GetFirstName]震惊地看到一群海盗船靠近塔特西亚舰队。\n\n海盗船的第一波箭雨开始落在[ROOT.GetCountry.GetRulerTitle]周围，本能接管了身体——接下来的几个小时是一片狂热的活动，塔特西亚海军拼命抵御海盗的攻击。\n\n最终，胜利属于我们的人民，但并非没有损失。#E 破塔#!的#E 执政官#!在战斗中被海盗刀刃杀死——[ROOT.GetCountry.GetRuler.GetFirstName]无助地看着这一灾难发生。当被击败的海盗破旧船只驶向远方时，我们的侦察兵看到他们朝#E 撒丁岛#!和#E 科西嘉岛#!驶去……看来这些匪徒来自更东方的岛屿。"
 me_tartessia2_59_title:0 "塔特西亚殖民：灾难"
 me_tartessia2_59_tooltip:0 "任务‘#Y 塔特西亚殖民：灾难#!’现已#G 完成#!"
 me_tartessia2_5_desc:0 "一旦构成了#E 塔特西亚#!核心地带的富裕城市向[ROOT.GetCountry.GetAdjective]旗帜屈服，[ROOT.GetCountry.GetRuler.GetName]毫不迟疑地对新征服的地区实施特别税收，以资助[ROOT.GetCountry.GetName]各地的建设项目。\n\n当一些愤怒的当地人争辩说，他们饱受战争摧残的社区需要这些资金用于自身重建时，他们的抱怨遭到了[ROOT.GetCountry.GetRulerTitle]冷漠的回应。"
 me_tartessia2_5_title:0 "最南端的伊比利亚"
 me_tartessia2_5_tooltip:0 "任务‘#Y 最南端的伊比利亚#!’现已#G 完成#!"
 me_tartessia2_6.a:0 "这是我们人民将永远铭记的礼物……"
 me_tartessia2_60.a:0 "我们的城市注定成为伊比利亚最伟大的城邦……"
 me_tartessia2_60_desc:0 "贸易让[ROOT.GetCountry.GetCapital.GetName]名扬四海，得益于塔特西亚经济的强大，我们的首都已成为许多外国商人频繁光顾的地方。在我们的城墙内，听到希腊语、布匿语甚至撒丁语等异域语言片段并不罕见，因为对金钱的热爱将所有人团结在我们的伟大首都，确保了和平。\n\n虽然一些人低声抱怨[ROOT.GetCountry.GetRuler.GetName]通过允许外国人在我们社会中自由活动而改变传统方式，但无人敢公开表达这些不满，即使是我们社会中最保守的成员也在享受日益增长的财富和社会地位。"
 me_tartessia2_60_title:0 "国际化都市"
 me_tartessia2_60_tooltip:0 "任务‘#Y 国际化都市#!’现已#G 完成#!"
 me_tartessia2_61.a:0 "愿这座建筑荣耀塔特西亚国家及其众多朋友"
 me_tartessia2_61_desc:0 "尽管在[ROOT.GetCountry.GetCapital.GetName]还很早，[ROOT.GetCountry.GetRuler.GetName]已在城市中心的#E 大市场#!，数千名当地人已为当天的仪式热切聚集。\n\n今天是吉祥的一天；经过数月的建设，首都内著名的建筑师将揭晓他们的最新建筑成就；市场入口处建造了一座巨大的大理石@marble!立面，由外国资本资助，上面覆盖着传统塔特西亚风格的雕刻艺术。\n\n当太阳照耀在聚集的人群脸上时，来自[GetProvince('(int32)3256').GetName]的一位布匿商人——在[ROOT.GetCountry.GetName]内贸易致富的众多大亨之一——准备发表演说，表彰他的国家对我们共同繁荣的贡献。"
 me_tartessia2_61_title:0 "大理石市场"
 me_tartessia2_61_tooltip:0 "任务‘#Y 大理石市场#!’现已#G 完成#!"
 me_tartessia2_62.a:0 "多么华丽的长袍——务必向这些工匠传达我的谢意"
 me_tartessia2_62_desc:0 "在[GetProvince('(int32)1439').GetName]省附近，幸运的形势汇聚，凭借皮革@leather!和布料@cloth!的过剩，朱砂染色的纺织品贸易正在蓬勃发展。\n\n我们的织布大师设立了营地，培训学徒掌握染色服装的精湛技艺，为方便各省之间原材料的运输，修建了一条连接皮革农场和制革厂的小路。\n\n作为感激的象征，当地工人向[ROOT.GetCountry.GetCapital.GetName]送去了一件展示他们技艺的红色仪式长袍。"
 me_tartessia2_62_title:0 "朱砂染色的服装"
 me_tartessia2_62_tooltip:0 "任务‘#Y 朱砂染色的服装#!’现已#G 完成#!"
 me_tartessia2_63.a:0 "愿神祇继续眷顾塔特西亚"
 me_tartessia2_63_desc:0 "当[ROOT.GetCountry.GetName]各地传遍了在[ROOT.GetCountry.GetCapital.GetName]雕刻的壮丽宗教建筑的消息时，虔诚的信徒献上了许多感恩祈祷。神祇通过派遣[ROOT.GetCountry.GetRuler.GetName]看顾我们而赐福于我们的人民，反过来，这位伟大的[ROOT.GetCountry.GetRulerTitle]并未回避虔诚的展示，而是以前所未有的热情拥抱我们的宗教传统。\n\n精美雕刻的石雕面孔和叙述我们国家历史的复杂浮雕被雕刻在我们首都#E 大神殿#!外的墙壁上。每天，来自[ROOT.GetCountry.GetName]各地的数十名朝圣者来到城门，希望亲眼见证这一建筑杰作。"
 me_tartessia2_63_title:0 "石雕面孔与浮雕"
 me_tartessia2_63_tooltip:0 "任务‘#Y 石雕面孔与浮雕#!’现已#G 完成#!"
 me_tartessia2_64.a:0 "或许有一天我将亲自参加讲座"
 me_tartessia2_64_desc:0 "在[ROOT.GetCountry.GetCapital.GetName]的中心，建在一座利于冥想和哲学探究的奢华花园中，一群在塔特西亚首都定居的希腊哲学家建造了一座#E 希腊学院#!——这一情况让[ROOT.GetCountry.GetRuler.GetName]极为满意，他渴望以一切可能的方式提升塔特西亚人民的智慧。\n\n在任何一个下午，人们都可以走进多利安柱下的荫凉树林，聆听胡须智者之间的激烈争论。"
 me_tartessia2_64_title:0 "希腊学院"
 me_tartessia2_64_tooltip:0 "任务‘#Y 希腊学院#!’现已#G 完成#!"
 me_tartessia2_65.a:0 "进步确实昂贵，但我愿意支付任何代价"
 me_tartessia2_65_desc:0 "几周前，[ROOT.GetCountry.GetCapital.GetName]的#E 希腊学院#!的一群哲学家向[ROOT.GetCountry.GetRuler.GetName]提出了一个诱人的提议；如果塔特西亚国家支付研究费用，这群思想家将能够进行实验，大幅提升我们人民的知识。\n\n虽然他们的价格昂贵，但[ROOT.GetCountry.GetRuler.GetFirstName]认为这是一个值得付出的机会，毫不犹豫地打开了[ROOT.GetCountry.GetName]的国库，甚至动用了[ROOT.GetCountry.GetRuler.GetHerHis]广泛的政治关系网，确保这一举措成功。\n\n幸运的是，哲学家们成功了，他们撰写的论文因其包含的科学突破已在各地广受赞誉。"
 me_tartessia2_65_title:0 "塔特西亚最智慧的人"
 me_tartessia2_65_tooltip:0 "任务‘#Y 塔特西亚最智慧的人#!’现已#G 完成#!"
 me_tartessia2_66.a:0 "在这片土地的中心，一座无与伦比的城市——[ROOT.GetCountry.GetCapital.GetName]"
 me_tartessia2_66_desc:0 "在遥远首都编写的旅行指南中，[ROOT.GetCountry.GetCapital.GetName]的大都会被列为#E 伊比利亚#!最重要的城市，投下如此巨大的阴影，以至于许多其他城镇和城市根本未被提及。\n\n[ROOT.GetCountry.GetName]的公民被誉为半岛上最智慧的人民，但他们友善和好客的名声仅与他们军队的可怕声誉相匹敌，这些军队征服了大片土地，为他们狂野的故乡带来持久和平。\n\n[ROOT.GetCountry.GetRuler.GetName]，现今统治塔特西亚国家的[ROOT.GetCountry.GetRulerTitle]，在远至[GetProvince('(int32)918').GetName]的地方受到赞誉，甚至据信遥远东方的国王们也听闻了我们的成就故事。"
 me_tartessia2_66_title:0 "伊比利亚大都会"
 me_tartessia2_66_tooltip:0 "任务‘#Y 伊比利亚大都会#!’现已#G 完成#!"
 me_tartessia2_67.a:0 "真是不可思议的故事！"
 me_tartessia2_67_desc:0 "[ROOT.GetCountry.GetRuler.GetName]几乎不相信[SCOPE.sCharacter('bosilkas_the_tartessian_merchant').GetName]讲述的故事，但带回[ROOT.GetCountry.GetCapital.GetName]的奇特礼物和文物无法忽视。\n\n大约一年前，[SCOPE.sCharacter('bosilkas_the_tartessian_merchant').GetFirstName]试图从[GetProvince('(int32)1000').GetName]航行至[GetProvince('(int32)1319').GetName]，但一场或许是世代罕见的可怕风暴将这位塔特西亚商人吹离海岸，他们担心性命不保。然而他们奇迹般存活，[SCOPE.sCharacter('bosilkas_the_tartessian_merchant').GetFirstName]计算出他们的位置，正朝[ROOT.GetCountry.GetName]航行时，远处看到了一群小岛。\n\n船上所有可用地图都被研究，却没有这些小岛的名字——它们是什么？一名希腊水手随后建议，这些可能是传说中存在于大地尽头的#E 幸运群岛#!。对此建议感兴趣，我们的同胞找到了一片海滩并登陆。\n\n那里的原住民友善，对我们的人出现异常兴奋，开放他们的定居点给迷路的船员。每天享用野生鱼类和甜美的香蕉，塔特西亚人在这个岛屿天堂逗留了数月，享受无尽的夏天。[SCOPE.sCharacter('bosilkas_the_tartessian_merchant').GetFirstName]交易了船上所有货物，并承诺返回。\n\n现在，多亏海上的一场风暴，我们建立了永久的贸易联系。"
 me_tartessia2_67_title:0 "寻找幸运群岛"
 me_tartessia2_67_tooltip:0 "任务‘#Y 寻找幸运群岛#!’现已#G 完成#!"
 me_tartessia2_68.a:0 "时机成熟时，我将发表声明"
 me_tartessia2_68_desc:0 "两个月前，[ROOT.GetCountry.GetRuler.GetName]宣布将在[ROOT.GetCountry.GetCapital.GetName]召开#E 部落议会#!，讨论我们宗教实践的未来，这一天终于到来。\n\n我们的许多#E 精英#!对[ROOT.GetCountry.GetRuler.GetFirstName]此举感到满意，因为[ROOT.GetCountry.GetName]内多种竞争的宗教影响威胁着我们的团结。#E 德鲁伊教#!对#E 伊比利亚#!北部的控制几乎是完全的，除非采取激烈措施，人们担心我们的人民将放弃对#E 伊比利亚神系#!的传统崇拜，转而接受这些陌生的凯尔特传统。甚至#E 布匿#!宗教，至今主要局限于海岸和城市，也在我们的人民中取得进展，他们似乎会在每一个吸引他们的神祇前焚香。\n\n然而，[ROOT.GetCountry.GetRuler.GetFirstName]召集了塔特西亚社会的精华，向他们讲述[ROOT.GetCountry.GetRuler.GetHerHis]的愿景，将推倒偶像，恢复真正的信仰。只需再做一些准备……"
 me_tartessia2_68_title:0 "探究伊比利亚信仰"
 me_tartessia2_68_tooltip:0 "任务‘#Y 探究伊比利亚信仰#!’现已#G 完成#!"
 me_tartessia2_69.a:0 "我们在恢复这片土地的工作才真正开始"
 me_tartessia2_69_desc:0 "[ROOT.GetCountry.GetRuler.GetName]受到伊比利亚神祇的祝福——这是显而易见的事实，任何人都能见证。\n\n若非如此，塔特西亚的[ROOT.GetCountry.GetRuler.GetName]如何能重新征服我们信仰的圣殿？#E 德鲁伊教#!的恶劣瘟疫已被推离伊比利亚圣地，甚至亵渎的#E 马里特人#!也未逃脱[ROOT.GetCountry.GetName]的愤怒。他们的最神圣崇拜之地，[GetProvince('(int32)1099').GetName]，已在我们手中，我们终于终结了他们对天堂的罪行。\n\n作为我们信仰复兴的象征，一座宏伟的神殿已在[ROOT.GetCountry.GetCapital.GetName]建成，每日在丘陵和高处献祭以荣耀神祇。"
 me_tartessia2_69_title:0 "统一圣殿"
 me_tartessia2_69_tooltip:0 "任务‘#Y 统一圣殿#!’现已#G 完成#!"
 me_tartessia2_6_desc:0 "一旦[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定在[GetProvince('(int32)1377').GetName]建造一座圣地，这位雄心勃勃的[ROOT.GetCountry.GetRulerTitle]秘密支付了一笔巨款，雇佣大师石匠为该地点打造一件珍宝。\n\n现在，圣地已建成，华丽的#E 波尔库纳之牛#!雕像被安置在圣殿内，当地人称这是#E 南伊比利亚#!最壮观的崇拜中心，甚至超越了附近[GetProvince('(int32)1287').GetName]的著名神殿。"
 me_tartessia2_6_title:0 "波尔库纳之牛"
 me_tartessia2_6_tooltip:0 "任务‘#Y 波尔库纳之牛#!’现已#G 完成#!"
 me_tartessia2_7.a:0 "我们有希腊人感兴趣的奇珍异宝，他们亦然"
 me_tartessia2_70.a:0 "无人料到塔特西亚的宗教裁判！"
 me_tartessia2_70_desc:0 "现在，[ROOT.GetCountry.GetRuler.GetName]几乎禁止了[ROOT.GetCountry.GetName]内对外来神祇的崇拜，[ROOT.GetCountry.GetRulerTitle]以一些人感到恐惧的狂热攻击#E 德鲁伊#!和#E 布匿#!的神殿和圣祠。\n\n每当[ROOT.GetCountry.GetRuler.GetSheHe]不处理国事或率领塔特西亚征召兵对抗外敌时，[ROOT.GetCountry.GetRuler.GetFirstName]常骑马穿越乡村，寻找逃亡信徒的社区，焚烧他们的圣所。越来越多的宗教奴隶出现在[ROOT.GetCountry.GetCapital.GetName]的市场上，那些拒绝放弃异端信仰的人常以可怕的方式遭受折磨。"
 me_tartessia2_70_title:0 "净化偶像之地"
 me_tartessia2_70_tooltip:0 "任务‘#Y 净化偶像之地#!’现已#G 完成#!"
 me_tartessia2_71.a:0 "你所梦见的，哦祭司，是真的——我是一位神！"
 me_tartessia2_71_desc:0 "尽管无数灵魂在[ROOT.GetCountry.GetRuler.GetName]发动的#E 宗教战争#!中丧生，所有人都同意结果不言自明。一股宗教复兴之风席卷[ROOT.GetCountry.GetName]，信徒们回归父辈之道，摒弃污染他们灵魂与思想的异端，所有人都清楚，塔特西亚人因这种毫不妥协的虔诚而受到祝福。\n\n塔特西亚首都举行了一场盛大的庆祝活动，当晚，一位居住在[ROOT.GetCountry.GetCapital.GetName]的祭司梦见不朽的神祇揭示我们的[ROOT.GetCountry.GetRulerTitle]是#E 伊阿克斯#!的化身——我们由一位活神统治。"
 me_tartessia2_71_title:0 "信仰的复兴者"
 me_tartessia2_71_tooltip:0 "任务‘#Y 信仰的复兴者#!’现已#G 完成#!"
 me_tartessia2_72.a:0 "所有荣耀归于[ROOT.GetCountry.GetRuler.GetFirstName]，所有荣耀归于[ROOT.GetCountry.GetName]！"
 me_tartessia2_72_desc:0 "我们终于向大地尽头宣告，我们是#E 伊比利亚的征服者#!，是半岛无可争议的主人。从[ROOT.GetCountry.GetCapital.GetName]的权力中心，我们统治着一个广大而富裕的国家，是古老#E 塔特索斯#!的值得继承者，然而在所有方面，我们的荣耀与成就已超越了我们高贵的先辈。\n\n[ROOT.GetCountry.GetRuler.GetName]为我们的人民赢得了又一个永恒的胜利，[ROOT.GetCountry.GetRuler.GetHerHis]的名字将随着塔特西亚语言和文字的存在而永存于我们的历史中。"
 me_tartessia2_72_title:0 "伊比利亚征服者"
 me_tartessia2_72_tooltip:0 "任务‘#Y 伊比利亚征服者#!’现已#G 完成#!"
 me_tartessia2_73.a:0 "你们找到了永久的家园，我的索格底亚朋友……现在安心休息吧"
 me_tartessia2_73_desc:0 "今晨在[ROOT.GetCountry.GetCapital.GetName]城门外见到最奇怪的景象——大约十辆货车和数百名衣衫褴褛的人出现，绝望地乞求庇护。被这一可怜景象感动，[ROOT.GetCountry.GetRuler.GetFirstName]送去面包和葡萄酒，邀请他们进入我们的城市，询问他们如何沦为难民的故事。\n\n这些自称#E 索格底亚人#!的人，曾经生活在遥远东方的巴克尚，但被邻国压倒。担心生活方式完全丧失，他们跋涉千里，带上仅剩的财物，希望有一天找到一片友善的土地重建家园。\n\n索格底亚人的领袖向我们提出一个提议；如果我们允许他们留在[ROOT.GetCountry.GetCapital.GetName]，他们将为公民和军事生活做出贡献。他们承诺建造一座传统市场，年轻男子将为[ROOT.GetCountry.GetName]而战——[ROOT.GetCountry.GetRuler.GetFirstName]无法拒绝这一交易。作为友谊的象征，我们的[ROOT.GetCountry.GetRulerTitle]甚至划出[GetProvince('(int32)1364').GetName]省作为他们养马之地，确保他们的社区受到尊重。"
 me_tartessia2_73_title:0 "索格底亚难民"
 me_tartessia2_73_tooltip:0 "任务‘#Y 索格底亚难民#!’现已#G 完成#!"
 me_tartessia2_74.a:0 "在共和国中拥有托菲特是恰当的"
 me_tartessia2_74_desc:0 "虽然仍有人坚持传统的伊比利亚信仰，但他们的人数每天都在减少，许多人转向[ROOT.GetCountry.GetRuler.GetName]所推崇的宗教，他以一种让一些人感到不安的热情追求迦南神祇。\n\n现在，#E 塔特西亚大托菲特#!已在[ROOT.GetCountry.GetCapital.GetName]建成，所有人都能看到[ROOT.GetCountry.GetRulerTitle]在宗教事务上的真正严肃态度。"
 me_tartessia2_74_title:0 "塔特西亚大托菲特"
 me_tartessia2_74_tooltip:0 "任务‘#Y 塔特西亚大托菲特#!’现已#G 完成#!"
 me_tartessia2_75.a:0 "愿达贡继续祝福我们！"
 me_tartessia2_75_desc:0 "数百年来，[GetDeityDefinition('omen_dagon').GetName|E]的伟力保护了东方无数世代的信徒，然而这位至高父的名字在[ROOT.GetCountry.GetName]内长期无人知晓。\n\n然而，[ROOT.GetCountry.GetRuler.GetName]希望改变这一不幸局面，在[GetProvince('(int32)1342').GetName]的中心为这位神祇建造了一座令人印象深刻的圣地。这座所谓的#E 达贡之家#!俯瞰着塔特西亚精英的宫殿和住宅，时刻提醒他们这位伟大神祇的力量与威严。"
 me_tartessia2_75_title:0 "达贡之家"
 me_tartessia2_75_tooltip:0 "任务‘#Y 达贡之家#!’现已#G 完成#!"
 me_tartessia2_76.a:0 "向[ROOT.GetCountry.GetName]的保护者致敬！"
 me_tartessia2_76_desc:0 "[ROOT.GetCountry.GetRuler.GetName]无疑将被铭记为塔特西亚历史上最为杰出的[ROOT.GetCountry.GetRulerTitle]之一。[ROOT.GetCountry.GetRuler.GetFirstName]不仅监督了#E 迦南信仰#!在我们社会中日益增长的地位，[ROOT.GetCountry.GetRuler.GetSheHe]甚至说服了#E 塔特西亚元老院#!建造一座巨大的青铜神像，以纪念我们的保护者[GetDeityDefinition('omen_dagon').GetName|E]。\n\n据说，当人群站在这座神像前时，他们会被至高父的光辉与荣耀所震撼，纷纷跪倒在地，泪流满面——无人能抗拒达贡的魅力！"
 me_tartessia2_76_title:0 "塔特西亚的青铜之神"
 me_tartessia2_76_tooltip:0 "任务‘#Y 塔特西亚的青铜之神#!’现已#G 完成#!"
 me_tartessia2_7_desc:0 "虽然我们的首都[ROOT.GetCountry.GetCapital.GetName]与东方王国的文明中心相距甚远，但我们自豪地说，来自这些遥远之地的希腊商人航行到我们的市场，发现我们本地产品的价值足以让他们不远万里而来。\n\n[ROOT.GetCountry.GetRuler.GetName]一直将发展这些经济联系视为优先事项，尽管在首都建造市场耗资巨大，但人人都能看出遵循[ROOT.GetCountry.GetRuler.GetName]建议的智慧——[ROOT.GetCountry.GetCapital.GetName]似乎已成为贸易路线上的重要一站。"
 me_tartessia2_7_title:0 "希腊贸易联系"
 me_tartessia2_7_tooltip:0 "任务‘#Y 希腊贸易联系#!’现已#G 完成#!"
 me_tartessia2_8.a:0 "我们绝不满足于低于永恒的塔特西亚荣耀……"
 me_tartessia2_8_desc:0 "尽管一度担心塔特西亚语言会逐渐消失，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]骄傲地宣布，[ROOT.GetCountry.GetCapital.GetName]的新铸币厂将铸造带有塔特西亚符号和文字的货币。这些货币因高含量的银和金而纯度极高，将确保在本地长期使用。\n\n当[ROOT.GetCountry.GetAdjective]士兵将装满闪亮货币的货车运往省级政府和军队薪资时，[ROOT.GetCountry.GetName]的梦想从未如此接近实现。"
 me_tartessia2_8_title:0 "塔特西亚货币"
 me_tartessia2_8_tooltip:0 "任务‘#Y 塔特西亚货币#!’现已#G 完成#!"
 me_tartessia2_9.a:0 "每一代，我们都将庆祝丰收节"
 me_tartessia2_9.b:0 "这次庆祝仅此一次"
 me_tartessia2_9_desc:0 "[ROOT.GetCountry.GetCapital.GetName]的丰收节正在举行，这是一个纪念[ROOT.GetCountry.Custom('get_harvest_goddess')]慷慨恩赐的盛大场合，节日的盛大仪式即将来临。\n\n在城墙外的森林深处，已准备好一座仪式祭坛，上面摆放了最精美的[ROOT.GetCountry.GetAdjective]菜肴，并倒满了最好的进口葡萄酒。在这关键时刻，[ROOT.GetCountry.GetRuler.GetName]在祭司的陪同下，牵着一匹马来到祭坛中央，停下来让祈祷和吟唱结束。\n\n片刻后，当信号发出，[ROOT.GetCountry.GetRuler.GetFirstName]举起一把锋利的刀，割断了马的喉咙，鲜血流到下面的祭台上。随着马倒在地上，祭坛被点燃，马匹、食物和葡萄酒在火焰中被焚烧，作为对[ROOT.GetCountry.Custom('get_harvest_goddess')]的供奉。"
 me_tartessia2_9_title:0 "丰收节"
 me_tartessia2_9_tooltip:0 "任务‘#Y 丰收节#!’现已#G 完成#!"
 onuban_metal_production_boom_2:0 "繁荣的塔特西亚工业"
 prestigious_tartessian_cinnabar_mod:0 "著名的朱砂出口商"
 statue_of_dagon_tartessos:0 "达贡青铜像"
 statue_of_dagon_tartessos_desc:0 "由哈斯塔的金属工艺大师锻造，这座巨大的达贡青铜像象征着塔特西亚对迦南信仰的拥抱。"
 tartessia2:0 "伊比利亚的征服者"
 tartessia2_BUTTON_TOOLTIP:0 "塔特西亚，我们的工作才刚刚开始——最伟大的战斗，最辉煌的胜利……它们就在前方！"
 tartessia2_CRITERIA_DESCRIPTION:0 "当[ROOT.GetCountry.GetName]主宰#E 伊比利亚半岛#!的其他势力并形成#E 大伊比利亚#!时，此任务将被视为完成。"
 tartessia2_DESCRIPTION:0 "在对邻国的一系列令人瞩目的胜利后，新成立的[ROOT.GetCountry.GetName]寻求通过征服整个#E 伊比利亚半岛#!进一步扩展其势力。\n\n由才华横溢的[ROOT.GetCountry.GetRuler.GetName]领导的久经沙场的军队，这位[ROOT.GetCountry.GetRulerTitle]带领塔特西亚走到今日的辉煌，正准备迎接即将到来的战争。随着金子和武器涌入[ROOT.GetCountry.GetCapital.GetName]城，地中海大国开始注意到塔特西亚的新贵及其野心……"
 tartessia2_cinnabar_svalue_tt:0 "我们的国家必须生产至少#Y 10#! @cinnabar!#T 朱砂#!。(#R [SCOPE.ScriptValue('tartessia_cinnabar_svalue')|0]#!/#Y 10#!)"
 tartessia2_lusitanian_furs_svalue_tt:0 "我们必须在#Y 卢西塔尼亚#!地区生产至少#Y 15#! @fur!#T 毛皮#!。(#R [SCOPE.ScriptValue('tartessia_lusitanian_furs_svalue')|0]#!/#Y 15#!)"
 tartessia2_mission_inv_10_task:0 "朱砂染色的服装"
 tartessia2_mission_inv_10_task_DESC:0 "数千年来，我们的人民使用朱砂@cinnabar!为纺织品染色，尤其用于葬礼和其他宗教仪式，但多年来我们一直无法生产这种特殊布料。现在我们有能力采取行动，[ROOT.GetCountry.GetRuler.GetName]要求[ROOT.GetCountry.GetName]恢复这一古老传统。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 tartessia2_mission_inv_11_task:0 "塔特西亚金属制品"
 tartessia2_mission_inv_11_task_DESC:0 "我们的历史充满古代塔特西亚的矿产财富如何支撑我们祖先度过增长时期的故事，[ROOT.GetCountry.GetRuler.GetName]渴望重现昔日的成功。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 tartessia2_mission_inv_12_task:0 "非洲联系"
 tartessia2_mission_inv_12_task_DESC:0 "非洲海岸距离[GetProvince('(int32)1347').GetName]仅11英里，尽管未来我们可能面临来自南方的军队，但目前对[ROOT.GetCountry.GetName]来说，维持我们现有的良好关系是明智的。\n\n[ROOT.GetCountry.GetRuler.GetName]已向[GetProvince('(int32)3061').GetName]的港口派遣使团，希望巩固我们的友谊——让我们看看我们的提议如何被接受。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 tartessia2_mission_inv_13_task:0 "国际化都市"
 tartessia2_mission_inv_13_task_DESC:0 "随着我们与更广阔世界的贸易联系增长，希腊和迦太基商人都已熟悉[ROOT.GetCountry.GetCapital.GetName]的街道，这座城市已成为一个国际化都市，欢迎所有和平而来的访客。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 tartessia2_mission_inv_14_task:0 "伊比利亚神祇"
 tartessia2_mission_inv_14_task_DESC:0 "我们的人民是否被外国神祇的虚假承诺引入歧途？古代塔特西亚人是否建造了可憎的#Y 托菲特#!来存放我们长子的焦黑骨头，或是塔特西亚国王在危难时咨询神秘的#Y 德鲁伊#!？不！这些腐蚀性的宗教影响威胁我们的长期稳定，不能再允许其存在。[ROOT.GetCountry.GetRuler.GetName]决定[ROOT.GetCountry.GetRuler.GetHerHis]家族将带领[ROOT.GetCountry.GetName]遵循我们祖先的脚步，敬拜我们一直熟知的#T 伊比利亚神系#!。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 tartessia2_mission_inv_15_task:0 "图尔德坦尼盔甲"
 tartessia2_mission_inv_15_task_DESC:0 "我们从土地中开采珍贵的矿石，然后加工成可用的金属，我们制造的最有价值的产品之一是#Y 图尔德坦尼盔甲#!。装备这种盔甲，我们的[ROOT.GetCountry.GetAdjective]士兵拥有整个#E 伊比利亚#!最好的防护。\n\n\n\n\n\n\n\n\n\n@italic_mil13!"
 tartessia2_mission_inv_16_task:0 "争夺孔忒斯塔尼亚"
 tartessia2_mission_inv_16_task_DESC:0 "消息传来，[ROOT.GetCountry.GetCapital.GetName]得知#Y 贝蒂卡#!东南部最终落入我们手中，为我们胜利的军队提供了入侵#E 孔忒斯塔尼亚#!的机会。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 tartessia2_mission_inv_17_task:0 "夺取#E 奥利西波#!"
 tartessia2_mission_inv_17_task_DESC:0 "[GetProvince('(int32)1319').GetName]，位于#E 卢西塔尼亚#!海岸的天然港口，吸引了我们的工程师和建筑师的注意。他们希望在该地区建造一个大型港口，[ROOT.GetCountry.GetRuler.GetName]对此计划非常支持。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 tartessia2_mission_inv_18_task:0 "[GetProvince('(int32)1318').GetName]的海盗"
 tartessia2_mission_inv_18_task_DESC:0 "[GetProvince('(int32)1319').GetName]的建设热潮引起了#E 塔古斯河#!对岸[GetProvince('(int32)1318').GetName]海盗的注意，他们向[ROOT.GetCountry.GetCapital.GetName]派出一名信使，提出了一个有趣的建议：他们希望我们在该地区为他们建造一个#Y 海盗避风港#!。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 tartessia2_mission_inv_19_task:0 "红釉陶器"
 tartessia2_mission_inv_19_task_DESC:0 "在[GetProvince('(int32)1432').GetName]和[GetProvince('(int32)1434').GetName]生产的红釉陶瓷和陶器@earthware!因其美观而备受赞誉，在国内外都广受欢迎。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 tartessia2_mission_inv_1_task:0 "伊比利亚大都市"
 tartessia2_mission_inv_1_task_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]缓慢但稳步地成长为一座远远超出其创始人设想的城市——许多人认为它是整个#E 伊比利亚南部#!最大的都市，我们为这一荣誉感到自豪。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 tartessia2_mission_inv_20_task:0 "塔特西亚果园"
 tartessia2_mission_inv_20_task_DESC:0 "新鲜水果是[ROOT.GetCountry.GetName]内广受欢迎的贸易商品，然而神明使我们的土地干旱，仅有[GetProvince('(int32)1386').GetName]和[GetProvince('(int32)1429').GetName]能够维持果园。但我们对现有资源感到幸运，并能做很多改进。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 tartessia2_mission_inv_21_task:0 "石雕面具与浮雕"
 tartessia2_mission_inv_21_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]委托我们的熟练建筑师和石匠用精美的石雕美化[ROOT.GetCountry.GetCapital.GetName]。不惜一切代价，这将是塔特西亚文化的庆祝——我们辉煌文明的纪念碑！\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 tartessia2_mission_inv_22_task:0 "连接孔忒斯塔尼亚海岸"
 tartessia2_mission_inv_22_task_DESC:0 "现在我们已夺取伊比利亚东部的重要沿海城市和港口，我们必须确保这些战略领土仍属我们，修建道路是确保这些城市牢牢掌握在我们手中的一种方式。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 tartessia2_mission_inv_23_task:0 "#E 加利西亚#!是目标"
 tartessia2_mission_inv_23_task_DESC:0 "现在我们已夺取伊比利亚东部的重要沿海城市和港口，我们必须确保这些战略领土仍属我们，修建道路是确保这些城市牢牢掌握在我们手中的一种方式。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 tartessia2_mission_inv_24_task:0 "夺取#E 塔拉科嫩西斯#!"
 tartessia2_mission_inv_24_task_DESC:0 "没有什么能阻止我们沿伊比利亚东海岸进一步推进——#Y 塔拉科嫩西斯#!的森林和山脉呼唤我们的军队，渴望被解放！\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 tartessia2_mission_inv_25_task:0 "黄金之河"
 tartessia2_mission_inv_25_task_DESC:0 "#E 伊比利亚半岛#!以其金银资源而闻名，这得益于遍布我们乡村的山脉和矿井。我们的人民因国家如黄金之河般流动的财富而感到前所未有的幸福。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 tartessia2_mission_inv_26_task:0 "断塔"
 tartessia2_mission_inv_26_task_DESC:0 "来自最近被征服的[GetProvince('(int32)1031').GetName]的使团向[ROOT.GetCountry.GetCapital.GetName]提出了一个奇特的要求，他们向[ROOT.GetCountry.GetRuler.GetName]保证值得一听。如果我们释放他们的骄傲城市作为附庸国，他们承诺这将是值得的。\n\n然而，[ROOT.GetCountry.GetRuler.GetFirstName]要求的代价可能超出他们的骄傲所能承受……\n\n#Y 我们将释放#! #T [GetProvince('(int32)1031').GetName]#! #Y 作为#! #G 附庸国#!。\n\n\n\n\n\n\n\n\n\n@italic_mil28!"
 tartessia2_mission_inv_27_task:0 "孔忒斯塔尼亚骏马"
 tartessia2_mission_inv_27_task_DESC:0 "在[GetProvince('(int32)1267').GetArea.GetRegion.GetName]地区可以找到优良的马匹，如果我们在该地区建造农场，我们的军队将尤其受益。\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 tartessia2_mission_inv_28_task:0 "联合圣祠"
 tartessia2_mission_inv_28_task_DESC:0 "对于#T 伊比利亚神系#!的信徒来说，有三个圣祠一直是虔诚者的朝圣地，坚持我们的信仰：[GetProvince('(int32)1287').GetName]、[GetProvince('(int32)1254').GetName]和[GetProvince('(int32)1068').GetName]。\n\n伊比利亚还有许多其他地方曾以我们的方式崇拜，但这些地方被#Y 德鲁伊#!及其外来方式所腐蚀。\n\n但现在，我们的信仰史上首次，一支强大的伊比利亚力量征服了这些圣地，解放并将它们带入辉煌的联合。\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 tartessia2_mission_inv_29_task:0 "流浪的战略家"
 tartessia2_mission_inv_29_task_DESC:0 "凭借我们海外的贸易联系和制造高质量盔甲的声誉，一位著名的希腊战士决定搬到[ROOT.GetCountry.GetCapital.GetName]，看看我们是否名副其实。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 tartessia2_mission_inv_2_task:0 "贝蒂卡属于我们"
 tartessia2_mission_inv_2_task_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]决定，统一#E 大伊比利亚#!的第一步必须是完全控制#E 贝蒂卡#!地区。[ROOT.GetCountry.GetName]必须扩大其领土，涵盖整个南部，无论现在谁声称拥有它。\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 tartessia2_mission_inv_30_task:0 "希腊学院"
 tartessia2_mission_inv_30_task_DESC:0 "我们的城市正迅速成为许多希腊思想家的家园，他们发现我们的气候宜人，渴望在[ROOT.GetCountry.GetCapital.GetName]度过时光，争论哲学的细微之处。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 tartessia2_mission_inv_31_task:0 "#E 巴利阿里海#!的紧张局势"
 tartessia2_mission_inv_31_task_DESC:0 "我们不断收到来自附庸国的紧急信息，他们已经厌倦了[GetProvince('(int32)1464').GetName]的海盗在海上骚扰他们的船只。虽然他们请求我们正式要求停止，但[ROOT.GetCountry.GetRuler.GetName]有另一个想法……直接征服#E 巴利阿里群岛#!。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 tartessia2_mission_inv_32_task:0 "塔特西亚殖民地"
 tartessia2_mission_inv_32_task_DESC:0 "现在我们已为[ROOT.GetCountry.GetName]夺取[GetProvince('(int32)1464').GetName]，[ROOT.GetCountry.GetRuler.GetName]决定在岛上建造一个真正的[ROOT.GetCountry.GetAdjective]殖民地。然而，在此之前，我们必须确保一切符合我们的标准——[ROOT.GetCountry.GetRuler.GetFirstName]将亲自访问该岛。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 tartessia2_mission_inv_33_task:0 "信仰的复兴者"
 tartessia2_mission_inv_33_task_DESC:0 "为了纪念带领[ROOT.GetCountry.GetName]走向成功的众神，[ROOT.GetCountry.GetRuler.GetName]颁布法令，全国各地的受污染圣地必须修复并进行仪式净化。北方的城市，特别是[GetProvince('(int32)1218').GetName]和[GetProvince('(int32)1213').GetName]，也必须皈依我们的方式。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 tartessia2_mission_inv_34_task:0 "卢西塔尼亚毛皮"
 tartessia2_mission_inv_34_task_DESC:0 "众所周知，[GetProvince('(int32)1325').GetArea.GetRegion.GetName]的森林和丘陵是狩猎的好地方，来自该地区的毛皮@fur!广受欢迎——这对我们的人民来说是一个机会。\n\n\n\n\n\n\n\n\n\n@italic_mil7!"
 tartessia2_mission_inv_35_task:0 "大理石市场"
 tartessia2_mission_inv_35_task_DESC:0 "我们与更广阔贸易世界的联系为[ROOT.GetCountry.GetCapital.GetName]带来了有利局面，来自国外的外国商人将自己的资本投资于我们的美丽城市；不用说，我们的国库充满了金银。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 tartessia2_mission_inv_36_task:0 "加利西亚渔业"
 tartessia2_mission_inv_36_task_DESC:0 "#E 坎塔布里亚海#!的冰冷水域居住着许多鱼类，我们的人民对海鲜有着无尽的胃口。我们应利用加利西亚海岸线，尽我们所能发展该地区。\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 tartessia2_mission_inv_37_task:0 "来自#E 塞格达#!的士兵"
 tartessia2_mission_inv_37_task_DESC:0 "[GetProvince('(int32)1213').GetArea.GetRegion.GetName]的勇猛居民以其战斗能力广为人知，来自其山寨和定居点的雇佣兵被招募并送往[GetProvince('(int32)3256').GetName]等城市参加外战。或许我们也应该利用他们的人力资源……\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 tartessia2_mission_inv_38_task:0 "[ROOT.GetCountry.GetName]最智慧的人"
 tartessia2_mission_inv_38_task_DESC:0 "#Y 希腊学院#!在[ROOT.GetCountry.GetCapital.GetName]已成为[ROOT.GetCountry.GetName]所有知识生活的中心，居住在其大理石大厅的学者们请求一笔资金注入，以进行有益于国家的研究。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 tartessia2_mission_inv_39_task:0 "加利西亚朱砂"
 tartessia2_mission_inv_39_task_DESC:0 "我们又获得了一个极其稀有的资源朱砂@cinnabar!的来源——派奴隶进去！我们的矿工可能还会发现更多未被发现的矿脉。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 tartessia2_mission_inv_3_task:0 "塔特西亚磨坊"
 tartessia2_mission_inv_3_task_DESC:0 "我们的首都不仅要是[ROOT.GetCountry.GetName]主要家族的居所，还必须是塔特西亚力量与权力的中心，我们的商品在此制造，市场充满外国访客。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 tartessia2_mission_inv_40_task:0 "著名的朱砂出口商"
 tartessia2_mission_inv_40_task_DESC:0 "我们逐渐为[ROOT.GetCountry.GetName]控制了#E 伊比利亚#!的朱砂@cinnabar!贸易，我们的声望和国库反映了这一点。世界各地的商人离开舒适的家园，前往我们的港口，希望通过交易这种稀有矿物致富。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 tartessia2_mission_inv_41_task:0 "净化土地上的偶像"
 tartessia2_mission_inv_41_task_DESC:0 "我们的祖先并未与#Y 德鲁伊#!交往，也从未在[GetDeityDefinition('omen_mari').GetName|Y]前焚香或献祭，然而这些异教的圣地仍存在于[ROOT.GetCountry.GetName]境内——但这种情况将不复存在！[ROOT.GetCountry.GetRuler.GetName]已下令，唯有#T 伊比利亚神系#!的神殿可在我国境内存在。\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 tartessia2_mission_inv_42_task:0 "恩波里翁玻璃"
 tartessia2_mission_inv_42_task_DESC:0 "虽然我们在[GetProvince('(int32)1209').GetName]可以生产玻璃@glass!，但其质量与[GetProvince('(int32)1000').GetName]的玻璃大师相比相形见绌。在[ROOT.GetCountry.GetCapital.GetName]已决定，国家将投资于这座沿海城市，我们的首都将因此受益。\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 tartessia2_mission_inv_43_task:0 "蛮族堡垒"
 tartessia2_mission_inv_43_task_DESC:0 "[GetProvince('(int32)1325').GetArea.GetRegion.GetName]的蓬勃毛皮@fur!贸易已超出我们在[GetProvince('(int32)1319').GetName]的运输能力，因此必须在[GetProvince('(int32)1318').GetName]河对岸建造第二座城市，以应对我们目前的贸易量。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 tartessia2_mission_inv_44_task:0 "伊比利亚征服者"
 tartessia2_mission_inv_44_task_DESC:0 "从卑微的起点，[ROOT.GetCountry.GetRuler.GetName]带领我们的人民走向荣耀，粉碎一切反对者，将整个#T 伊比利亚#!统一在[ROOT.GetCountry.GetAdjective]旗帜之下。\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 tartessia2_mission_inv_45_task:0 "索格底亚难民"
 tartessia2_mission_inv_45_task_DESC:0 "一群异乡商人来到[ROOT.GetCountry.GetCapital.GetName]城门前，诉说了一个悲惨的故事：他们的国家被摧毁，生活方式彻底丧失。这些自称#Y 索格底亚人#!的人逃离了遥远东方的毁灭性战争，寻找新的家园。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 tartessia2_mission_inv_46_task:0 "北部边疆"
 tartessia2_mission_inv_46_task_DESC:0 "若不加固与#E 高卢#!接壤的北部边境将是愚蠢之举，[ROOT.GetCountry.GetRuler.GetName]历经艰辛征服此地，绝非愚人。我们必须建造两座要塞，以保护我们的内地。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 tartessia2_mission_inv_47_task:0 "伊比利亚火腿"
 tartessia2_mission_inv_47_task_DESC:0 "我们在畜牧业上受到双重恩赐：不仅拥有#E 伊比利亚#!最好的牲畜@cattle!，我们制作的腌制肉品也是全世界最顶级的。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 tartessia2_mission_inv_48_task:0 "寻找幸运群岛"
 tartessia2_mission_inv_48_task_DESC:0 "几个月前，一名塔特西亚商人运送塔特西亚美食（主要是玻璃@glass!和#Y 伊比利亚火腿#!@cattle!），但他的船被风暴吹离航线，人们以为他未能抵达港口……然而并非如此。\n\n今晨，一支破旧的船队回到我们的海岸，带来了一个不可思议的故事——这位塔特西亚商人回来了，声称他在遥远的西方发现了传说中的#G 幸运群岛#!。\n\n\n\n\n\n\n\n\n\n@egypt_mil18!"
 tartessia2_mission_inv_4_task:0 "向卢西塔尼亚进军"
 tartessia2_mission_inv_4_task_DESC:0 "现在[ROOT.GetCountry.GetName]的西北边境已得到保障，我们的军事顾问认为我们的部队已准备好入侵#Y 卢西塔尼亚#!地区——只需要[ROOT.GetCountry.GetRuler.GetName]下达命令。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 tartessia2_mission_inv_5_task:0 "探究伊比利亚信仰"
 tartessia2_mission_inv_5_task_DESC:0 "在一个充满奇异而诱惑的神祇环绕我们的世界，我们的传统崇拜方式虽未完全被抛弃，但正面临前所未有的威胁。\n\n担心若放弃支撑我们的神祇将带来最坏的结果，[ROOT.GetCountry.GetRuler.GetName]决定投入复兴的[ROOT.GetCountry.GetAdjective]国家的力量，保护并强化#T 伊比利亚信仰#!。\n\n#Y 您的[ROOT.GetCountry.GetRulerTitle]将在[ROOT.GetCountry.GetCapital.GetName]召集宗教长老会议，讨论此事。#!\n\n\n\n\n\n\n\n\n\n@italic_mil16!"
 tartessia2_mission_inv_68_task:0 "塔特西亚大托菲特"
 tartessia2_mission_inv_68_task_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]的宗教当局请求在首都建造一座#Y 塔特西亚大托菲特#!，以取悦[GetDeityDefinition('omen_tanit').GetName|E]和[GetDeityDefinition('omen_dagon').GetName|E]——[ROOT.GetCountry.GetRuler.GetName]对此充满热情。\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 tartessia2_mission_inv_69_task:0 "达贡之家"
 tartessia2_mission_inv_69_task_DESC:0 "[GetDeityDefinition('omen_dagon').GetName|E]，塔特西亚舰队的至高父与保护者，值得被他所亲近的子民——我们自己——虔诚崇拜。我们必须拨出资金建造一座圣地，以确保达贡的祝福持续显现。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 tartessia2_mission_inv_6_task:0 "恢复古老矿井"
 tartessia2_mission_inv_6_task_DESC:0 "在古代，#E 塔特西亚人#!的物质力量依赖于附近山脉的矿产财富，尽管大地已赐予我们的祖先许多宝藏，仍有矿石可供开采。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 tartessia2_mission_inv_70_task:0 "塔特西亚的青铜之神"
 tartessia2_mission_inv_70_task_DESC:0 "随着迦南神祇的影响在国内扩散，[GetDeityDefinition('omen_dagon').GetName|E]通过我们的祭司表明，他希望由[ROOT.GetCountry.GetCapital.GetName]的工匠为他铸造一座神像。只要我们记得尊崇他，至高父将继续保护我们的人民！\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 tartessia2_mission_inv_7_task:0 "塔特西亚铸造厂"
 tartessia2_mission_inv_7_task_DESC:0 "现在是时候确保我们的首都[ROOT.GetCountry.GetCapital.GetName]在其城墙内建造一座#Y 铸造厂#!。我们绝对不能忽视如此重要的基础设施建设，因为它将为我们的国家带来多方面的好处。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 tartessia2_mission_inv_8_task:0 "塔特西亚货币"
 tartessia2_mission_inv_8_task_DESC:0 "作为我们在[ROOT.GetCountry.GetCapital.GetName]经济实力增长的象征，我们决定在首都建造一座#T 铸币厂#!，发行带有塔特西亚文字的货币。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 tartessia2_mission_inv_9_task:0 "希腊贸易联系"
 tartessia2_mission_inv_9_task_DESC:0 "来自[GetProvince('(int32)84').GetName]甚至[GetProvince('(int32)516').GetName]的希腊商人有时会访问我们在[ROOT.GetCountry.GetCapital.GetName]的市场，促使[ROOT.GetCountry.GetRuler.GetName]提议将这些贸易联系变成永久性的。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 tartessia2_onuba_iron_base_metals_svalue_tt:0 "我们的国家必须生产至少#Y 20#! @iron! #T 铁#! 和 @base_metals! #T 基础金属#! 的总量。(#R [SCOPE.ScriptValue('tartessia_onuba_iron_base_metals_svalue')|0]#!/#Y 20#!)"

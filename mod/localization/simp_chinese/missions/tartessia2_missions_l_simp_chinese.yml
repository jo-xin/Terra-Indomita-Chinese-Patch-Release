 tartessia_claims_contestania_tt:0 "#Y 我们将获得#! #T 孔忒斯塔尼亚#! 地区所有省份的领土主张。"
 tartessia_claims_gallaecia_tt:0 "#Y 我们将获得#! #T 加利西亚#! 地区所有省份的领土主张。"
 tartessia_claims_lusitania_tt:0 "#Y 我们将获得#! #T 卢西塔尼亚#! 地区所有省份的领土主张。"
 tartessia_claims_tarraconensis_tt:0 "#Y 我们将获得#! #T 塔拉科嫩西斯#! 地区所有省份的领土主张。"
 tartessia_cured_ham_svalue_tt:0 "我们的国家必须生产至少#Y 25#! @cattle!#T 牲畜#!。(#R [SCOPE.ScriptValue('tartessia_cured_ham_svalue')|0]#!/#Y 25#!)"
 tartessia_olisipo_military_harbor_mod:0 "塔特西亚军事港口"
 tartessia_segeda_military_manpower_mod:0 "塔拉科嫩西斯人力"

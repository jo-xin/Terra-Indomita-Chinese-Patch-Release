l_simp_chinese:
 DIANIUM_FEUDATORY_ADJECTIVE:0 "塔特西亚"
 DIANIUM_FEUDATORY_NAME:0 "破塔"
 achaeus_the_greek_moves_to_tartessia_tt:0 "[SCOPE.sCharacter('achaeus_wandering_greek_tartessian_chad').GetName]将迁往#E 塔特西亚#!。"
 build_tartessian_dagon_holy_site:0 "我们必须在#Y 哈斯塔#!为#G 达贡#!建造一座圣地。"
 contestanian_stud_farms_tartessia_mod:0 "孔忒斯塔尼亚马场"
 country_ougoing_trade_routes_svalue_10:0 "我们的国家必须拥有#Y 10条#!对外贸易路线。(#R [SCOPE.ScriptValue('country_ougoing_trade_routes_svalue')|0]#!/#Y 10#!)"
 desc_contestanian_stud_farms_tartessia_mod:0 "在孔忒斯塔尼亚省饲养的马匹是塔特西亚境内最为迅捷和强壮的牲畜之一。"
 desc_grand_tartessian_tophet_capital_modifier:0 "一座以精美塔特西亚风格建造的巨大托菲特坐落于这个省份的中心，这是迦南神系日益增长的权力的象征。"
 desc_onuban_metal_production_boom_2:0 "遍布我们王国景观的众多采石场是塔特西亚国家矿石资源的重要来源。"
 desc_prestigious_tartessian_cinnabar_mod:0 "只有最富有的贵族才能希望获得塔特西亚的朱砂。"
 desc_tartessia_olisipo_military_harbor_mod:0 "塔特西亚人在此地区投入巨资，建造了一座强大的海军港口，增强了他们在海上投射力量的能力。"
 desc_tartessia_segeda_military_manpower_mod:0 "我们的国家正从塔拉科嫩西斯地区的人力资源中汲取力量，我们的军队因北方的招募而壮大。"
 desc_tartessia_trading_with_canaries_mod:0 "我们勇敢的塔特西亚探险家航行到了前所未有的远洋，发现了传说中的幸运群岛，并与那里的居民进行贸易。"
 desc_tartessian_build_holy_shrines_mod:0 "成功摧毁了玷污伊比利亚景观的异端之物后，塔特西亚人决定在他们的土地上为伊比利亚神系建造新的圣祠。"
 desc_tartessian_cinnabar_textiles_mod:0 "我们的人民长期利用珍贵的朱砂矿物来染色和加工我们的纺织品。"
 desc_tartessian_dianium_feudatory_mod:0 "此省原名赫梅罗斯科佩翁，或‘瞭望塔’，现已被征服的塔特西亚人重新命名。"
 desc_tartessian_emporion_glass_mod:0 "恩波里翁生产的高质量玻璃广泛用于我们的首都，是高级研究不可或缺的材料。"
 desc_tartessian_foundry_building_modifier:0 "由于在首都建造了铸造厂，我们整个国家正享受着前所未有的增长与扩张时期。"
 desc_tartessian_fruit_groves_mod:0 "我们在这个省份精心培育了花园和果园。"
 desc_tartessian_gallaecian_cinnabar_textiles_mod:0 "塔特西亚人在此建造了一座矿场，以尽可能多地从地下开采朱砂。"
 desc_tartessian_gallaecian_fisheries_mod:0 "塔特西亚人利用加利西亚漫长的海岸线，在当地渔业上投入巨资。"
 desc_tartessian_greek_academy_mod:0 "大量涌入我们首都的希腊旅行者中包括一群贤者，他们在此建造了一座学院。"
 desc_tartessian_iberian_ham_mod:0 "塔特西亚以其生产的精美腌制肉品而闻名，一块伊比利亚火腿总是能卖出高价。记得留着骨头煮汤！"
 desc_tartessian_lusitanian_furs_modifier:0 "由于我们拥有熟练的猎人和追踪者，卢西塔尼亚地区为整个国家提供了毛皮和肉类。"
 desc_tartessian_northern_frontier_fort_mod:0 "塔特西亚人在与高卢接壤的北部边境建造了大规模的防御工事。"
 desc_tartessian_pirate_traditions_mod:0 "我们的水手从卢西塔尼亚的奴隶贩子那里学到了专门的掠夺技巧，确保我们船只的货舱总是装满奴隶。"
 desc_tartessian_punic_market_mod:0 "外国商人在我们的首都市场中建造了一座精美的大理石立面，彰显了我们人民之间的和谐关系。"
 desc_tartessian_red_glazed_mod:0 "这个地区建有专门生产精美陶瓷和陶器的作坊。"
 desc_tartessian_restores_iberian_faith_mod:0 "我们伟大的统治者征服了伊比利亚半岛上所有的伊比利亚宗教圣祠，为我们的国家带来了神祇的青睐。"
 desc_tartessian_rivers_of_gold_mod:0 "由于我们山脉中众多的矿场，我们国家拥有无尽的金银财富。"
 desc_tartessian_stone_face_relief_mod:0 "这里建造了一座宏伟的石质立面，以荣耀我们国家的神祇。"
 desc_the_house_of_dagon_tartessia_mod:0 "塔特西亚人是首个在伊比利亚建造达贡神殿的民族，他们寻求至高父对国家的保护。"
 grand_tartessian_tophet_capital_modifier:0 "塔特西亚大托菲特"
 have_mine_tartessia2_tt:0 "我们需要在国家内拥有#Y 1座矿井#!。"
 lusitanian_tartessian_fur_treasure:0 "卢西塔尼亚毛帽"
 lusitanian_tartessian_fur_treasure_desc:0 "这顶毛帽由伊比利亚孔忒斯塔尼亚地区森林和丘陵中最优质的皮毛制成，祝福当地猎人狩猎成功。"
 me_tartessia2_1.a:0 "还有什么好说的？迅速传递这个消息！"
 me_tartessia2_10.a:0 "‘如果你渴望暴君的王冠，[ROOT.GetCountry.GetRuler.GetFirstName]，那将是战争！’"
 me_tartessia2_10.b:0 "若#E 塔特西亚#!的公民希望如此，我将放弃我的权威"
 me_tartessia2_10_desc:0 "过去几天，[ROOT.GetCountry.GetRuler.GetName]沉浸在狂喜之中，为#E 塔特西亚#!的形成而兴奋，忙于无数伴随这一壮举的仪式，以至于[ROOT.GetCountry.GetRuler.GetSheHe]完全未察觉在[ROOT.GetCountry.GetCapital.GetName]针对[ROOT.GetCountry.GetRuler.GetHerHim]的阴谋。\n\n然而，阴谋就在眼前；[SCOPE.sCharacter('civil_war_leader').GetName]送来威胁，宣称[SCOPE.sCharacter('civil_war_leader').GetHerHim]自为这一阴谋集团的领袖。[SCOPE.sCharacter('civil_war_leader').GetFirstName]在全副武装的卫兵簇拥下，宣读一小卷书卷，[SCOPE.sCharacter('civil_war_leader').GetHerHis]的声音因愤怒而颤抖。\n\n‘你为[ROOT.GetCountry.GetName]做了许多值得称道的事，哦[ROOT.GetCountry.GetRuler.GetFirstName]——无人能贬低你的功绩或夺走这些。然而，你认为自己有资格戴上王冠？我们不承认你的血统有权统治我们——我们要求你退位，让我们建立一个#E 共和国#!，由塔特西亚人民来统治。’"
 me_tartessia2_10_title:0 "塔特西亚的重生"
 me_tartessia2_10_tooltip:0 "任务‘#Y 塔特西亚的重生#!’现已#G 完成#!"

l_simp_chinese:
 HEBREW_EGYPT_FEUDATORY_ADJECTIVE:0 "米兹里"
 HEBREW_EGYPT_FEUDATORY_NAME:0 "米兹拉伊姆"
 HER:0 "米兹拉伊姆"
 HER_ADJ:0 "米茨拉"
 ISR:0 "以色列"
 ISRAEL_FORMABLE_ADJECTIVE:0 "以色列"
 ISRAEL_FORMABLE_NAME:0 "以色列"
 ISR_ADJ:0 "以色列"
 KOD:0 "大卫王国"
 KOD_ADJECTIVE:0 "大卫王朝"
 KOD_NAME:0 "大卫王国"
 NICKNAME_KOD:0 "“统一者”"
 ark_of_the_covenant:0 "约柜"
 ark_of_the_covenant_desc:0 "约柜，里面有摩西曾经按照上帝的话写下的十条戒律。"
 blood_of_david:0 "大卫的血脉"
 blood_of_david_desc:0 "大卫是犹大部落传说中的国王。年少时，他击败了歌利亚与非利士人。后来，他带领统一的以色列与犹大王国走向强盛。\n\n#G 此特质可以通过母系或父系传承。#!"
 broken_promise:0 "失败的承诺"
 desc_judea_modifier_1:0 "我们已经重新征服了以色列的故土，欢呼吧!"
 desc_judea_modifier_10:0 "我们的石匠更有经验，这为我们节省了时间和金钱。"
 desc_judea_modifier_11:0 "摩西精神在我们的血管里奔腾，使我们的军队战无不胜。"
 desc_judea_modifier_13:0 "庇路西翁现在是一个易守难攻的堡垒。"
 desc_judea_modifier_14:0 "所罗门赐福于这个地方。"
 desc_judea_modifier_15:0 "我们向埃及人进行了复仇，他们现在都为我们工作，当然是免费的......"
 desc_judea_modifier_16:0 "这片领土经历了一个黄金时代，恢复了它的荣光。"
 desc_judea_modifier_17:0 "以先知和我们主的名义，我们庆祝。"
 desc_judea_modifier_18:0 "约柜已被移至耶路撒冷，许多信徒在那里朝圣，希望能看到这个著名的艺术品。"
 desc_judea_modifier_19:0 "在这里发现了一种收获和干燥香的新技术，这种技术在我们整个领域的应用取得了巨大的成功。"
 desc_judea_modifier_2:0 "本省发生了动乱，谁干的？"
 desc_judea_modifier_20:0 "这个城市是地中海上的一个大港口。人流和贸易丰富了这座城市，然而它总是很吵闹，穷人没有足够的住房，气味也不是很好......"
 desc_judea_modifier_3:0 "大卫和所罗门曾走过这座城。"
 desc_judea_modifier_4:0 "以上帝的名义，这座城市已经建成！"
 desc_judea_modifier_5:0 "城市在圣地周围兴起，吸引了各地的人。"
 desc_judea_modifier_6:0 "圣所比以往任何时候都要辉煌，他们所侍的圣物是最神圣的财产。"
 desc_judea_modifier_7:0 "美索不达米亚已经被征服，压迫者现在被压迫。但并不是所有的人都看好这一点...。"
 desc_judea_modifier_80:0 "我们对统一所有以色列信徒的追求得到了整个王国的支持。"
 desc_judea_modifier_9:0 "遵循以斯帖的榜样，我们将惩罚任何阴谋反对他人的人!"
 did_not_join_war:0 "没有加入敌人的战争"
 form_israel:0 "组建以色列"
 form_israel_desc:0 "以色列王国分裂至今已有600多年了。如果我们拥有曾经的大国领土，我们就应该掌握恢复它的权利，为犹地亚带来荣耀。"
 joined_enemy_war:0 "加入了我的敌人的战争"
 joined_my_war:0 "加入我的战争"
 judea_inv.1.a:0 "托勒密是合法继承人。"
 judea_inv.1.a.tt:0 "我们将提出加入他们这一边的#R 战争#! 。"
 judea_inv.1.b:0 "安提柯的宣称是最强的。"
 judea_inv.1.b.tt:0 "我们愿意站在他们一边加入#R 战争#! 。"
 judea_inv.1.c:0 "亚历山大的王位不是我们可以争夺的。"
 judea_inv.1.c.tt:0 "我们不会加入这场战争。"
 judea_inv.1.desc:0 "亚历山大大帝的继承者们再度兵戎相见，为那曾经横跨列国的庞大帝国残躯厮杀。然而，这混乱对我们而言却是耶和华所开的门——如今我们可与邻邦立约，迈出复兴大卫王国的一步。但抉择当前：是支持托勒密的宣称，还是站在安提柯一边？二者皆非我民之正统，不过是我们借力之台阶。我们把条件刻于石板：​​ ​​将以色列人的土地归还其合法主人——那本属于我们列祖的产业，不可再被外邦之手玷污！"
 judea_inv.1.t:0 "亚历山大的破碎帝国"
 judea_inv.10.a:0 "赞美主!"
 judea_inv.10.desc:0 "经过多年的血汗与泪水，大卫的国度终于光复。统治者#Y [SCOPE.sCharacter('davidic_ruler').GetName]#!以大卫的后裔之身，坐上这应许的宝座——他是唯一合法的君王，是耶西之根的后代，是神所膏立的领袖。他的统治将为后世奠定根基，叫我们的独立坚如磐石，叫巴比伦、埃及与波斯等古时欺压我祖的列强，皆成过去。而如今，#Y [SCOPE.sCharacter('davidic_ruler').GetName]#!与大祭司共享权柄——他执掌世俗之事，祭司长监督属灵之务。权柄分立，互相制衡，耶和华的律法得以彰显，我民必在公义与平安中世代繁衍。"
 judea_inv.10.t:0 "大卫之国归来"
 judea_inv.11.a:0 "赔偿业主。"
 judea_inv.11.b:0 "检查材料是否有缺陷!"
 judea_inv.11.c:0 "奴隶是什么？"
 judea_inv.11.desc:0 "当我们在[ROOT.GetCountry.GetCapital.GetName]大兴土木时，一场可怕的祸患突然临到——在圣殿区附近的工地上，一条老旧的绳索突然断裂，所吊的巨石坠落，砸中了正在劳作的几个奴隶。他们的血染红了未干的石块，他们的哀嚎回荡在圣殿的影子下，那石场的主人却缄默不言，不肯承担责任。他推诿说：这是你们的工程，自然是你们的过失。末了，他竟要求我们赔偿——给他换上新的奴隶。这公平吗？那些奴隶的血岂可白流？他们的劳苦岂可被轻贱？"
 judea_inv.11.t:0 "在[ROOT.GetCountry.GetCapital.GetName]发生的意外"
 judea_inv.12.a:0 "卖掉残骸。"
 judea_inv.12.b:0 "修复建筑!"
 judea_inv.12.c:0 "让穷苦的人拥有它。"
 judea_inv.12.desc:0 "我的#Y 纳西#!，在建造的过程中，我们的工人于工地中央掘出了一座古老的建筑。那建筑师说：我们可以修复它，使它回归原先的用途；也可以拆毁它，变卖材料供给我们大城的需用。然而，有些贫穷的百姓已经住进了那废墟——他们在残垣断壁间找到了栖身之所，在瓦砾堆中寻得了遮蔽风雨的角落。我们当如何抉择？是拆毁这废墟以得利，还是容让这些困苦人继续居住？我们要思想：这废墟若被修复，固然能增添都城的荣光；但若能让穷人安居，岂不更是行了耶和华看正的事？"
 judea_inv.12.t:0 "古建筑出土"
 judea_inv.13.a:0 "支赎金。"
 judea_inv.13.b:0 "派出军队!"
 judea_inv.13.c:0 "从其它建筑中取来。"
 judea_inv.13.desc:0 "我的#Y 纳西#!，有消息传来：从采石场运载急需石料的最后一支车队，途中遭匪徒伏击。那些狂傲之徒竟勒索赎金，威胁若不速速满足，便要杀害所有车夫。\n\n所幸我军距匪巢不远——最近的营地仅需数日路程。况且，若实在紧迫，我们亦可拆取另一座旧建筑的石料，以替代所需。如何决断？是付赎金救人，还是派兵剿匪？是暂缓工程，还是另寻他法？"
 judea_inv.13.t:0 "被伏击的车队"
 judea_inv.14.a:0 "庆典开始!"
 judea_inv.14.desc:0 "如今，所有的圣所都已修缮一新，化作宏伟的圣殿，守护着最神圣的所在。它们的壮丽甚至超越巴比伦的宫阙，唯那著名的空中花园能与我们的成就相比。无疑，耶和华必在看着——我们盼望这些圣殿配得上祂的先知。"
 judea_inv.14.t:0 "圣地"
 judea_inv.15.a:0 "妙不可言"
 judea_inv.15.b:0 "打开它!"
 judea_inv.15.desc:0 "我们有福了！被认为已在巴比伦人摧毁第一圣殿时遗失的#Y 约柜#!，如今被寻回！它曾安置在会幕中，后在#Y [GetProvince('(int32)687').GetName]#!遭洗劫、会幕被毁时失落。如今，我们要为圣物建造新的安放之所。许多人必渴望前来瞻仰约柜，但无人敢触碰它——因惧怕自己不配，唯恐耶和华的怒火降下。"
 judea_inv.15.t:0 "古老的宝藏"
 judea_inv.15.tt:0 "不保护你的国王会有后果......你的统治者会死亡"
 judea_inv.16.a:0 "马上派#Y [SCOPE.sCharacter('indiana_jones')GetName]#! 去!"
 judea_inv.16.desc:0 "有传言说，牧羊人发现了久已失落的宝藏。但他们自知所获珍贵，便将宝藏藏于山中。我们已派遣#Y [SCOPE.sCharacter('indiana_jones').GetName]#!前去调查。[SCOPE.sChar('indiana_jones').GetSheHe]必有所收获，或许还能带回大卫王时代的文物……然而，[SCOPE.sChar('indiana_jones').GetSheHe]遭遇意外：雇来的向导误导方向，令[SCOPE.sChar('indiana_jones').GetHerHim]如古时我们的祖先般在沙漠中徒劳徘徊；[SCOPE.sChar('indiana_jones').GetSheHe]又在流沙中迷路，不得不高价雇佣贝都因人引路。如今资金与补给已耗尽，[SCOPE.sChar('indiana_jones').GetSheHe]虽仍在山中洞穴探查，但后续搜索必须等待更多资金……"
 judea_inv.16.t:0 "古老的宝藏"
 judea_inv.17.a:0 "不惜一切代价!"
 judea_inv.17.b:0 "给予#Y [SCOPE.sCharacter('indiana_jones')GetName]#! 权力，以我的名义指挥一些部队!"
 judea_inv.17.c:0 "我们将不会再浪费任何资源了!"
 judea_inv.17.desc:0 "在调查中，#Y [SCOPE.sCharacter('indiana_jones').GetName]#!遭遇意外：雇来的向导误导方向，令[SCOPE.sChar('indian_jones').GetSheHe]如古时我们的祖先般在沙漠中徒劳徘徊；[SCOPE.sChar('indian_jones').GetHerHim]又在流沙中迷路，不得不高价雇佣贝都因人引路。如今资金与补给已耗尽，[SCOPE.sChar('indian_jones').GetSheHe]虽仍在山中洞穴探查，但后续搜索必须等待更多资金……"
 judea_inv.17.t:0 "意外的支出"
 judea_inv.18.a:0 "让他祝福我吧。"
 judea_inv.18.b:0 "我将听从他的建议。"
 judea_inv.18.c:0 "把这个骗子送走。"
 judea_inv.18.desc:0 "信使回报：#Y [SCOPE.sCharacter('indiana_jones').GetName]#!发现了两件价值连城的宝物！其一是件弦乐器，历经岁月仍能演奏——#Y [SCOPE.sCharacter('indiana_jones').GetName]#!认为，这便是大卫王曾弹奏的#Y 琴#!。其二是一只受损的神秘盒子，但#Y [SCOPE.sCharacter('indiana_jones').GetName]#!确信能够修复。当夜，一位祭司前来警告：唯有得到他的祝福，方可观看这些宝物，但他拒绝详述其中含义……"
 judea_inv.18.t:0 "宝藏"
 judea_inv.19.a:0 "是的，我们会要求#Y [SCOPE.sCountry('alliance_target_1')GetName]#!。"
 judea_inv.19.b:0 "#Y [SCOPE.sCountry('alliance_target_2')GetName]#! 是一个更好的选择"
 judea_inv.19.desc:0 "我们已宣告独立——自从参与继承者战争后，我们已被视为不可忽视的力量。但孤狼易受攻击，我们必须寻找盟友，方能保持强大与自主。我们可以向#Y [SCOPE.sCountry('alliance_target_1').GetName]#!或#Y [SCOPE.sCountry('alliance_target_2').GetName]#!请求结盟。"
 judea_inv.19.t:0 "寻求联盟"
 judea_inv.2.a:0 "按照承诺，他们将得到土地。"
 judea_inv.2.b:0 "我们决不割让一寸!"
 judea_inv.2.desc:0 "我们已承诺把#Y [SCOPE.sCountry('mission_country_scope').GetName] #!的土地作为他们帮助我们对抗其他伪王的回报。现在战争已经结束，我们必须履行承诺。\n\n然而，一些奸诈小人却游说我们保留这片土地。我们不应该忘记 #Y [SCOPE.sCountry('mission_country_scope').GetName] #! 只是个小国……"
 judea_inv.2.t:0 "承诺的土地"
 judea_inv.20.a:0 "我们接受这个提议。"
 judea_inv.20.b:0 "他们没有我们需要的东西。"
 judea_inv.20.desc:0 "我们收到了来自#Y [SCOPE.sCountry('mission_scope_country').GetName]#!的联盟建议。从信中我们可以看出，他们在迦南占据了战略地位。他们提出结盟，但我们应该记住，我们自己的利益应该是优先事项......"
 judea_inv.20.t:0 "一个联盟建议"
 judea_inv.21.a:0 "愿主得到赞美!"
 judea_inv.21.desc:0 "#Y [SCOPE.sCountry('alliance_target_1').GetName]#!已接受我们的结盟请求！他们将与我们并肩作战，共享和平。"
 judea_inv.21.t:0 "接受联盟"
 judea_inv.22.a:0 "水在桥下。"
 judea_inv.22.b:0 "是的，我们将向其他国家询问。"
 judea_inv.22.desc:0 "可惜，结盟提议被拒——但我们不必绝望，还有其他途径。若他们不愿为友，便将成为我们的劲敌！况且，我们的君王早有第二选择——或许我们该去询问他们？"
 judea_inv.22.t:0 "一个被拒绝的提议"
 judea_inv.23.a:0 "赞美主!"
 judea_inv.23.desc:0 "自从尼布甲尼撒二世攻陷耶路撒冷近三百年以来，大卫的后裔未能重登王位——那是他们合法的权柄，是以色列与犹大王国唯一的合法统治者。如今，我们终于挣脱外邦的枷锁，欢喜宣告：王权将归大卫的子孙！#Y [SCOPE.sCharacter('davidic_heir').GetName]#!将引领我们走向无需依赖他人、更不受他人摆布的未来。"
 judea_inv.23.t:0 "大卫后裔归来"
 judea_inv.23.tt:0 "#Y 大卫#!王朝的[SCOPE.sCharacter('davidic_heir').GetName]将接任国王。"
 judea_inv.24.a:0 "令人惊叹"
 judea_inv.24.desc:0 "我们的伟大都城[ROOT.GetCountry.GetCapital.GetName]，如今堪比繁荣国度的辉煌。其大理石城墙与金色浮雕折射的光芒，令人叹为观止，敬畏之情油然而生。"
 judea_inv.24.t:0 "大理石和黄金的城市"
 judea_inv.25.a:0 "他们曾是伟大的君王，但现在是我们的时代。"
 judea_inv.25.desc:0 "迦南的富庶城邑骄傲地展示商品，远销列国；我们的港口停满了来自四面八方的商船。虽然时光侵蚀了古时伟大君王留下的庙宇、剧场与市场，但我们在拥挤街巷中寻得微小线索，重建这些城邑，使其重现大卫时代的荣光。"
 judea_inv.25.t:0 "迦南的城市"
 judea_inv.26.a:0 "赞美主!"
 judea_inv.26.desc:0 "现在，走在大街上不需要在泥泞和污秽中跋涉也是可以接受的--对这一成就感到欣慰。然而，我们的工作还没有完成。这片土地上的居民缺乏信仰，对我们的政府和我们的上帝（唯一的上帝）缺乏信仰。让我们向他们展示光明，因为我们建立了一个伟大的圣地，他们会蜂拥而至。"
 judea_inv.26.t:0 "让他们见识神"
 judea_inv.27.a:0 "愿他们茁壮成长。"
 judea_inv.27.desc:0 "[SCOPE.sProvince('holy_city_scope')GetName]是一个崇拜的地方。许多人在这里朝圣，希望能找到救赎或对他们生活中的危机的答案。照顾神殿的祭司们一直欢迎朝圣者，并支持他们。\n\n现在，越来越多的请愿者和祈求者决定留在这里，在[SCOPE.sProvince('holy_city_scope')GetName]，建立新的生活，摆脱以前的负担。"
 judea_inv.27.t:0 "献给祂的城"
 judea_inv.28.a:0 "愿他们的智识光荣我们的城。"
 judea_inv.28.desc:0 "在[SCOPE.sProvince('holy_city_scope')GetName]，最近有大量的信徒涌入。许多人听说了图书馆和寺庙的情况，以及他们免费提供的知识。还有一些人是来向先知们致敬的。然而，将他们团结在一起的是对知识的渴望，对了解我们的主所创造的世界的渴望。"
 judea_inv.28.t:0 "知识和智慧之城"
 judea_inv.29.a:0 "啊，一英里长的船队等待着在我们的港口靠岸。"
 judea_inv.29.desc:0 "建设和改善我们的港口是一项崇高的工作，但也是一项特别费力的工作。很明显，我们的粮食和黄金储备已经在我们巨大的施舍下枯萎了。我们宫廷里的一个卑贱的人来到我面前，讲述了[GetProvince('(int32)743').GetName]的特殊情况，它的巨大港口和广泛的贸易给它带来了丰富的财富，移民也随之而来。海岸上伟大的黎凡特港口城市是我们王国的皇冠上的宝石。"
 judea_inv.29.t:0 "大黎凡特港"
 judea_inv.3.a:0 "成交!"
 judea_inv.3.b:0 "绝不!"
 judea_inv.3.desc:0 "今天有一位以色列信使来到宫廷，提出加入与托勒密的冲突，以换取以色列人在迦南的祖传领土。他们提出在我们的军队解决了马其顿的冲突之前，让埃及人保持沉默。信使称，这样，我们就会赢得战争\n。\n希伯来人宣称援助的土地是以色列希伯来人占多数的省份，不包括皇家大道。"
 judea_inv.3.t:0 "以色列人的信件"
 judea_inv.30.a:0 "它们是一种威严，值得一看。"
 judea_inv.30.desc:0 "为什么我们最神圣的地方没有那么多的游客？为什么它们总是显得那么光秃秃的，没有光明的爱？也许它们是世界上所有圣地中最古老、最邋遢的--看着它们，人们会这样认为。我们非常需要公众对这些圣地产生兴趣。我们有上帝的话语，他的门徒，他的威严的壮举。我们收集了他伟大工作的遗物，现在用它们来装饰这些圣地，使人们知道主为他们做了什么。"
 judea_inv.30.t:0 "受人尊敬的圣地"
 judea_inv.31.a:0 "迦南归一。"
 judea_inv.31.desc:0 "迦南，我们的土地和我们祖先的土地。现在终于再次团结在一个统治之下，我们要好好地保护你们，把你们建设好。你将养活无数张嘴，生产出数不清的财宝。哦，迦南，我们亲爱的祖国，我们多么珍惜你。"
 judea_inv.31.t:0 "奶与蜜之地"
 judea_inv.32.a:0 "以主之名！"
 judea_inv.32.desc:0 "富饶的叙利亚土地现在属于我们了。曾经，这么多代人以前，我们在这里踏上，统治了它的南部。现在，我们已经超越了我们的前辈。对巴比伦和亚述的报复不会是迅速的，也不会是无痛的......"
 judea_inv.32.t:0 "征服叙利亚"
 judea_inv.33.a:0 "甜蜜的复仇很快就会到来……"
 judea_inv.33.desc:0 "数年前，我们被这座城市奴役，被迫流亡。现在是反击的时候了。在征服这座城市时，我们获得了她所管辖的土地，其中许多地方资源丰富，劳动力充足。然而最重要的是，我们重新获得了对我们一些先知的古老安息地的控制。"
 judea_inv.33.t:0 "巴比伦，纷争之城"
 judea_inv.34.a:0 "以斯帖的媒体将再次。"
 judea_inv.34.desc:0 "许多世纪以前，以斯帖凭借她的美貌成为麦地那人的女王，尽管她是一个以色列人，不遵循她丈夫的信仰。国王有一个顾问，想驱逐所有信仰我们的人，但由于王后的聪明才智，他被阻止了。她欺骗了他，使米底成为我们最好的地方，而我们的祖国被占领。\n\n今天，我们将在米底的土地上重新创造那种自由的状态。我们的人民将不受限制地生活在这里，但要遵守我们主的法律。然而，我们决不允许有人像以斯帖的丈夫的顾问那样崛起。没有人会被逐出家门。"
 judea_inv.34.t:0 "以斯帖的遗产"
 judea_inv.35.a:0 "钟声响起，所有的人都涌向大会堂听道。"
 judea_inv.35.desc:0 "我们在传播神的话语方面的努力已经相当成功。然而，人们乞求更多。毫不奇怪，就在今天早上，一个衣衫不整的人，一个傻瓜，求我指点他去上帝的家。当我告诉他我不能这样做，因为那不是一个人们容易看到的地方时，他哭了，求我告诉他在哪里可以找到上帝。对于这样绝望的灵魂，我们该怎么做？我说，我们给他们提供最接近主的房子--建造一个伟大的纪念碑来安置圣人，平民可以进入那里，感觉更接近他们的主。"
 judea_inv.35.t:0 "一个神圣的地方"
 judea_inv.36.a:0 "啊，是的。上帝为我们留下了怎样的奇迹，让我们去发现。"
 judea_inv.36.desc:0 "我们关注#Y [GetProvince('(int32)1693').GetName]#! 地已经有一段时间了。官方说法是，因为那里的摩西圣殿会对我们的人民的信仰有很大的帮助。然而，我们也有不可告人的目的--涉及到在地球上发现的珍贵宝石。把它们从泥土中解放出来是我们神圣的职责。当然，摩西的神龛将被适当地点缀上几颗宝石。"
 judea_inv.36.t:0 "摩西的财富"
 judea_inv.37.a:0 "如果祖先们为他们的轻松旅行铺设了我们的道路就好了。哦，流浪。"
 judea_inv.37.desc:0 "虽然我们自己没有参加那场穿越沙漠的长途跋涉，但我们从骨子里感受到那些朝圣者的痛苦，扑面而来的沙子在我们的血管里流淌，深深地印在我们的灵魂里。这是我们曾经为了我们的信仰而经受的挑战--不再是了。拥有这片土地，对其进行殖民，平定其空旷的荒地，为流浪的以色列人的故事画上了句号，一劳永逸。"
 judea_inv.37.t:0 "结束无尽的徘徊"
 judea_inv.38.a:0 "我们再也不会对埃及作出回应。"
 judea_inv.38.desc:0 "我们的埃及邻居随时都有很大的危险。当我们的职责是加强我们的人民，我们的信仰，为了上帝给我们的光荣目的，我们为什么要让自己毫无防备，软弱无力，任人攻击。让我们加固我们南部的堡垒，伟大的#Y [GetProvince('(int32)509').GetName]#!，从而防止我们被那些曾经奴役我们的人所攻击。"
 judea_inv.38.t:0 "反对埃及的墙"
 judea_inv.39.a:0 "欢迎，示巴的孩子们。"
 judea_inv.39.desc:0 "我们跟随老所罗门进入大王后的领地，虽然旅途艰辛。这是一个奇怪的景象，所有的一切。我们坐在波涛汹涌的红海边，看到海岸、花丛和远处的城市，那里有她的财富。他们向我们投降了，就像示巴向所罗门投降一样，所以他们加入了我们的信仰和生活中。"
 judea_inv.39.t:0 "示巴的境界"
 judea_inv.4.a:0 "成交!"
 judea_inv.4.b:0 "决不!"
 judea_inv.4.desc:0 "今天有一位以色列信使来到宫廷，提出加入与安提戈诺斯的冲突，以换取以色列人在迦南的祖传领土。他们提出在我们的军队重新集结并抵达边境之前，让安提柯保持沉默。信使称，这样，我们将赢得战争。\n\n希伯来人宣称援助的土地是以色列希伯来人占多数的省份，不包括皇家大道。"
 judea_inv.4.t:0 "以色列人的信笺"
 judea_inv.40.a:0 "诚然，阿拉伯的珍珠。"
 judea_inv.40.desc:0 "阿拉伯海现在就在我们的指尖，准备好让我们的船在驶出红海后在其开放的水域航行。我们开始从印度进口象牙，从鲜为人知的大利比亚南部地区进口异国动物，这只是时间问题。我们建立一个伟大的城市来标志我们伟大国家的边界是正确的，它是所有看到上帝之光的人的希望灯塔。"
 judea_inv.40.t:0 "阿拉伯的绿洲"
 judea_inv.41.a:0 "当他们的城市发生骚乱时，一股圣火在燃烧。"
 judea_inv.41.desc:0 "迦南有一些地方抵制我们的征服，仍然对神的话语充耳不闻，对神的光亮视而不见。我们在这些破败地方的代理人已经着手激怒当地人，让他们责备锁住他们的当局。这将使我们对这片土地的征服变得更加容易--我们将被视为伟大的救世主。"
 judea_inv.41.t:0 "铲除边界"
 judea_inv.42.a:0 "让过去的压迫者淡出人们的视野。"
 judea_inv.42.desc:0 "巴比伦人曾征服我们的土地，我们从一个奴役之地，又陷入了同样残酷的另一个奴役境地。尽管居鲁士击败了他们，宽容我们的宗教习俗，将那城从他们的污染影响中解放出来，但我们无法忘记他们对犹地亚王国所做的一切。最好让他们的城被摧毁，让他们的民被遗忘。"
 judea_inv.42.t:0 "回报恩惠"
 judea_inv.43.a:0 "一个新的黎明为我们升起，这次是在尼罗河上。"
 judea_inv.43.desc:0 "埃及，曾是我们的家园，可我们却在那片土地上处于底层，受他们虚妄之神的统治。摩西为我们指引了一条脱离那种生活的道路，带领我们穿越沙漠，前往那令人向往的圣地。我们永远不能忘记摩西予以色列人的伟大恩赐，但也不能忘却埃及人加诸在我们身上的痛苦。如今我们能在上帝之光的照耀下安然行于尼罗河上，一切都将有所不同。让我们按照我们的理想重塑埃及，依上帝的诫命，宽恕他们先辈的过错。"
 judea_inv.43.t:0 "放弃过去"
 judea_inv.44.a:0 "愿主对他们微笑。"
 judea_inv.44.desc:0 "我们帮助他们战斗，现在他们兑现了承诺。祖先的土地将归还给我们，不会再有任何流血事件。"
 judea_inv.44.t:0 "尊贵的承诺"
 judea_inv.46.a:0 "我们被分开太久了。"
 judea_inv.46.desc:0 "数百年前，他们曾将我们征服。而如今，他们的国度不过是虚幻的旧梦，几近被人遗忘。当年，他们强行将我们的祖先逐出世代居住的土地，仅有寥寥数人得以留存，只能以悲苦的面包果腹。当我们重返故土，曾经的同胞却已不复往昔模样，我们之间已然产生了分歧。然而，亚述人竟愚昧地以为，他们往昔的恶行已被遗忘、得到宽恕。如今，他们的城池尽归我们所有，他们先辈的恶行也从历史的书卷中被彻底抹去。今日，便是亚述的末日！"
 judea_inv.46.t:0 "重联王国"
 judea_inv.47.a:0 "愿他们的尸骨烂在坟墓里。"
 judea_inv.47.desc:0 "几百年前，他们征服了我们。现在，他们的境界不过是狂野的梦想，几乎被遗忘。当他们迫使我们的祖先离开我们的祖先的土地时，只有少数人留下来，吃着苦难的面包。当我们回来时，我们的亲属不再是同一个人；我们分歧了。然而，亚述人认为他们过去的行为已经被遗忘或被原谅，这是一种愚蠢的想法。他们的城市现在是我们的了，他们祖先的事迹也从历史书上抹去了。今天是亚述的末日。"
 judea_inv.47.t:0 "流亡中的亚述人"
 judea_inv.48.a:0 "叙利亚人是什么，是被阴影包裹的以色列人"
 judea_inv.48.desc:0 "叙利亚人算什么，不过是我们的北方劲敌，是与我们隔埃及以东之地相对的族类。他们与我们看似相近，实则迥异，且不尊崇上帝的旨意。他们读不懂上帝的话语，因不通晓上帝的语言；他们看不见上帝的作为，尽管身处那般神圣之地。我等的智者日夜操劳，为改变此状不懈努力。他们每人每日启迪一百个叙利亚人的心智，将上帝的话语与慈爱吹入他们的灵魂。"
 judea_inv.48.t:0 "消失吧，叙利亚"
 judea_inv.49.a:0 "这是上帝的游乐场"
 judea_inv.49.desc:0 "迦南大地上，众多百姓有着形形色色的文化、语言与习俗，与我等大不相同。不，我等视他们为上帝的儿女，各个独特。我等引领他们穿行城镇，前往那建在他们简陋居所旁的圣洁圣所。我等怀揣撒玛利亚人般的仁善之心，以这般方式，引领他们归入我等的群体，带他们走进我等的圣殿。当经文诵读之时，便见他们坐在我等身旁。"
 judea_inv.49.t:0 "与迦南人亲善"
 judea_inv.5.a:0 "就这样吧。"
 judea_inv.5.desc:0 "今日使者携佳音而归。"
 judea_inv.5.desc_1:0 "安提柯与托勒密再度为亚历山大的冠冕厮杀，那继承者们又为残破的帝国碎片争斗不休。然而这一次，我们不再旁观，而要加速这场战争的终结，以减少无辜者的流血。"
 judea_inv.5.desc_2:0 "我们曾向他们伸出援手，愿助其一臂之力，好叫战火早熄，和平早来。谁知他们竟被贪婪蒙蔽心窍，拒绝了我们的善意！既如此，我们便要另寻他途，收回应许之地。"
 judea_inv.5.t:0 "继业者战争"
 judea_inv.50.a:0 "愿主长安"
 judea_inv.50.desc:0 "他们曾是我们的征服者，是奴役我们的主人，强迫我们屈从于他们的道路，敬拜他们虚假的神，施行他们的仪式。时代已经何等改变，强者竟在唯一真神的旗帜下枯萎倒下。他们恳求我们仁慈，恳求我们宽恕，恳求我们按照祂话语的价值行事。这个请求，我们不能答应，因为他们永远都会是压迫者。他们的生活方式必须被我们的生活方式取代！"
 judea_inv.50.t:0 "亚述人之死"
 judea_inv.51.a:0 "繁荣的气味。"
 judea_inv.51.desc:0 "很少有人与我们一样喜欢焚香发出的气味。很少有人不喜欢看烟雾与温暖的空气相遇时的蠕动痕迹。我们需要更多的烟，而且我们需要更浓的烟。幸运的是，我们知道如何做到这一点，把它晒干，延长每批香的寿命，这样我们就可以在需要更多之前，更长时间地品味它了。"
 judea_inv.51.t:0 "硝烟弥漫"
 judea_inv.53.a:0 "香会是我们的——我是说，我们会找到萨巴！"
 judea_inv.53.desc:0 "我们进入阿拉伯，所罗门的爱人就是从那里来的。她的王国至今仍在蓬勃发展......我们将很快到达你那里，神话中的萨巴。\n\n当然，确保香火贸易是对我们中不太虔诚的人的一种激励... ..."
 judea_inv.53.t:0 "进入阿拉伯"
 judea_inv.6.a:0 "发送消息!"
 judea_inv.6.desc:0 "纳巴泰人坐落在以色列与阿拉伯的交汇之处，扼守通往汉志的商道咽喉。日积月累，他们因贸易而富甲一方，成为强国。但试想，若我后方盘踞着一个强大且富庶的王国，其心叵测，岂非如芒在背？因此，我们当以智慧待之——先递出友谊之手，与之结好，如此既能稳住侧翼，又能增进我民与他们的经济纽带，叫商道畅通，财货流通。"
 judea_inv.6.t:0 "友谊的提议"
 judea_inv.7.a:0 "我们可以从他们的保护中获益匪浅。"
 judea_inv.7.b:0 "我们不会轻易放弃我们的独立!"
 judea_inv.7.desc:0 "一位信使从[SCOPE.sCountry('mission_country_scope').GetName]的北部国度抵达。他们用华丽的辞藻描绘了一幅未来图景：我们的土地将比以往任何时候都更富饶、更安全；所有强盗都将被消灭，我们两国之间的贸易将蓬勃发展……但一切的前提是我们接受他们的保护。信使宣称，作为他们的忠实附庸，我们将迎来一个最繁荣的未来。"
 judea_inv.7.t:0 "友谊的提议"
 judea_inv.8.a:0 "为了我们的新盟友！"
 judea_inv.8.b:0 "诅咒他们和他们的傲慢！"
 judea_inv.8.desc:0 "使者自#Y 纳巴泰#!归来。"
 judea_inv.8.desc_1:0 "纳巴泰人已应我之要求，与我并肩！从此，他们的敌人便是我们的敌人，他们的朋友便是我们的朋友；商道将因这联盟而更加畅通，财货将如泉水般涌向我土。"
 judea_inv.8.desc_2:0 "他们竟拒绝了缔结正式盟约的提议！这愚昧的决定，叫人扼腕！既如此，我们便要独自踏上前往示巴的旅程——昔日所罗门王曾往，如今我们也要去。"
 judea_inv.8.t:0 "来自纳巴泰的消息"
 judea_inv.9.a:0 "妙不可言"
 judea_inv.9.desc:0 "我们寻得了#Y 大卫之琴（Kinnor of David）#!这琴曾安抚扫罗王狂躁的心灵，当大卫弹奏时，王的忧郁尽消。自那时起，它便成为音乐与安宁的象征，其柔和之音能驱散癫狂，平息怒火。\n\n无论这琴置于何处，它都提醒众人：和平与理智当居首位。若弹奏它，连最愤怒的人也将平静下来。"
 judea_inv.9.t:0 "一个古老的宝藏被发现"
 judea_inv_mission:0 "应许之地"
 judea_inv_mission_BUTTON_TOOLTIP:0 "我必使我民的伟大显于列国面前，叫世人看见！"
 judea_inv_mission_CRITERIA_DESCRIPTION:0 "一旦我们拥有并开发了所有以色列人的圣地，这一使命就被认为是完成了。此外，我们可以将影响力扩展到阿拉伯和埃及。"
 judea_inv_mission_DESCRIPTION:0 "数百年来，希伯来人被拘于迦南地与阿拉伯数隅，其圣所与列祖坟茔尽在篡夺者手中。现在是时候夺回本属于希伯来人的东西了！"
 judea_inv_mission_task_1:0 "追随大卫和所罗门的脚步"
 judea_inv_mission_task_10:0 "圣所与会堂"
 judea_inv_mission_task_10.tt:0 "[GetDeityDefinition('omen_moses').GetName|Y], [GetDeityDefinition('omen_solomon').GetName|Y], [GetDeityDefinition('omen_david').GetName|Y], [GetDeityDefinition('omen_esther').GetName|Y], [GetDeityDefinition('omen_samuel').GetName|Y], [GetDeityDefinition('omen_ezra').GetName|Y], [GetDeityDefinition('omen_abraham').GetName|Y], [GetDeityDefinition('omen_deborah').GetName|Y], [GetDeityDefinition('omen_joseph').GetName|Y], [GetDeityDefinition('omen_daniel').GetName|Y], [GetDeityDefinition('omen_ezekiel').GetName|Y], & [GetDeityDefinition('omen_joshua').GetName|Y]需要有一个大神庙建筑。\n\n只有城市才能有伟大的寺庙建筑。"
 judea_inv_mission_task_10_DESC:0 "没有会堂的圣所，怎能显其荣美呢？"
 judea_inv_mission_task_11:0 "摩西就在这里遇见祂"
 judea_inv_mission_task_11_DESC:0 "从前，摩西领我们出埃及的时候，主对他说话，吩咐他在这里写下十诫。"
 judea_inv_mission_task_12:0 "西奈"
 judea_inv_mission_task_12_DESC:0 "西奈半岛地处要害，当归为我业。"
 judea_inv_mission_task_13:0 "巩固西部边界"
 judea_inv_mission_task_13_DESC:0 "据守庇路西翁要冲，便可锁死埃及进犯之路。"
 judea_inv_mission_task_14:0 "确保南部的安全"
 judea_inv_mission_task_14.tt:0 "我们就可以向纳巴泰亚发出附庸的提议。"
 judea_inv_mission_task_14_DESC:0 "南方边境亦需稳固。示巴商队往来不绝，或可与之立约通商......"
 judea_inv_mission_task_15:0 "确立在阿拉伯福地的统治"
 judea_inv_mission_task_15.tt:0 "你将获得对整个阿拉伯地区的宣称。"
 judea_inv_mission_task_15_DESC:0 "正如耶和华曾为祂的百姓开辟旷野之路，我们也要为在阿拉伯的商队开出平安的途径，使其安然行走，不惧强盗与战乱。"
 judea_inv_mission_task_16:0 "所罗门和萨巴女王"
 judea_inv_mission_task_16.tt:0 "萨巴必须成为[THIS.GetCountry.GetName]的附属。#Y [SCOPE.sDeity('solomon_deity').GetName]#! 需要有一个属于[THIS.GetCountry.GetName]的圣地。"
 judea_inv_mission_task_16_DESC:0 "所罗门，我们最后一位伟大的王，曾与示巴女王结盟。因为她的国度富饶，有多的金、香料与珠宝。若我们与她再盟，她的财富必如溪水般流入我们的城邑，使我们的圣殿与宫殿更加辉煌。"
 judea_inv_mission_task_17:0 "确保阿拉伯贸易"
 judea_inv_mission_task_17.tt:0 "这座城市是#Y 圣城#!!!"
 judea_inv_mission_task_17_DESC:0 "我之商旅困于阿拉伯诸道，不得安然往来，如羊被驱离青草之地！我们要坚固手掌，重新执掌那地的商路，正如耶和华曾将列国交在祂百姓面前。"
 judea_inv_mission_task_18:0 "继业者"
 judea_inv_mission_task_18.tt:0 "我们可以加入托勒密或安提柯重建亚历山大帝国的事业；不过如果他们与我们的关系并非#G 正面#!，双方都可能#R 拒绝#!。如果他们决定不升级冲突，那么该任务将在#Y 10#!年后被绕过。"
 judea_inv_mission_task_18_DESC:0 "自希腊亚历山大王崩，其继承者仍如争夺残羹之犬，为那帝国骸骨相争。他们的刀剑饮血，使四境不得安宁！但看哪，这混乱或成为我们的机会，正如耶和华使仇敌的计谋反成祂子民的出路。"
 judea_inv_mission_task_19:0 "煽动迦南叛乱"
 judea_inv_mission_task_19.tt:0 "希伯来教士将在迦南煽动动乱。每一块不属于亚扪，撒玛利亚或犹地亚的领土，只要有希伯来人占多数的居住的地区，就会得到#Y 被煽动骚乱#!。"
 judea_inv_mission_task_19_DESC:0 "迦南曾是我们的产业，是我们先祖蒙应许之地！如今外邦人占据其上，如荆棘蔓生圣所。报应之时已到，我们要先摇动入侵者的根基，如同耶和华使地震动，令非利士人的城墙倾覆。"
 judea_inv_mission_task_1_1.tt:0 "五个城市中的一个必须满足同样的标准。"
 judea_inv_mission_task_1_DESC:0 "当地人在建造一个新剧院时，掘得碑铭，载有大卫与所罗门曾居滨海之地的事。"
 judea_inv_mission_task_2:0 "发现一个圣地"
 judea_inv_mission_task_20:0 "大理石和黄金的城市"
 judea_inv_mission_task_20_DESC:0 "#Y [ROOT.GetCountry.GetCapital.GetName]#! 本当如冠上的宝石，受万民仰望！然而往来的外邦人，眼中不见敬畏，心中不生战栗。我们要重建她的威严，使万民再说：这城如新天新地。"
 judea_inv_mission_task_21:0 "巴比伦复仇"
 judea_inv_mission_task_21.tt:0 "只要巴比伦只是一个充满奴隶的落后地区，仍然是一个定居点，这个修正就会一直存在。"
 judea_inv_mission_task_21_DESC:0 "巴比伦人曾拆毁我们圣殿的根基，使耶和华的约柜蒙羞，他们的罪孽已记在祂的册上。看哪，我们要像从前他们倾覆犹大一般，将他们的遗迹从大地上抹去，使他们的名不再被记念——正如先知所预言：伸冤在我，我必报应。"
 judea_inv_mission_task_22:0 "奴役埃及"
 judea_inv_mission_task_22_1.tt:0 "我们将释放#Y 米兹拉伊姆#!作为埃及的藩属国。"
 judea_inv_mission_task_22_2.tt:0 "只要#Y 米兹拉伊姆#!仍然是我们的附属国，此效果就会一直存在。"
 judea_inv_mission_task_22_DESC:0 "我们的祖先曾在埃及为奴，被苦待凌辱，如田野的禾秸。但耶和华兴起摩西，领他们出埃及，进入应许之地。如今，我们要回报那些曾压迫我们的人——不是以奴役，而是以公义的审判！我们要使那些曾使我们作奴隶的国，也尝尝被奴役的滋味。"
 judea_inv_mission_task_23:0 "文明的灯塔"
 judea_inv_mission_task_23_DESC:0 "我们要成为地上的一盏明灯，我们的智慧、我们的律法、我们的贸易，要成为列国的榜样！外邦人必来向我们学习，如示巴女王来见所罗门，要听他的智慧话。我们的城邑必如锡安山高举于万国之上，使万民都说：他们的道路是公义的，他们的统治是正直的！"
 judea_inv_mission_task_24:0 "寻宝"
 judea_inv_mission_task_24.tt:0 "我们将开始寻找宝藏。"
 judea_inv_mission_task_24_DESC:0 "有风声传到我们耳中，说有一件失落的宝物被牧人寻得，却被他们藏于山中。大卫的王权是耶和华所立，他的约柜曾存放圣城之中。若那宝物真是祂的见证，我们岂能视而不见？但若只是凡物，就当谨慎，免得劳民伤财。"
 judea_inv_mission_task_25:0 "应许之地"
 judea_inv_mission_task_25.tt:0 "战争结束后，我们将要求得到承诺给我们的土地。"
 judea_inv_mission_task_25_DESC:0 "如今战争已止，我们要站立起来，领受那属于我们的应许地，如同我们的先祖在出埃及时所领受的。"
 judea_inv_mission_task_26:0 "稍后统一我们的王国"
 judea_inv_mission_task_26_DESC:0 "犹地亚与撒玛利亚是同一整体的两个王国。我们该重新合一了，但不应操之过急，因为数个世纪的分离已使我们变得不同。我们必须谨慎。将他们附庸也许能让我们的国家再次接近。\n\n这项任务与#Y 立刻统一我们的国#!相互#R 排斥#!。"
 judea_inv_mission_task_27:0 "立刻统一我们的国"
 judea_inv_mission_task_27_DESC:0 "犹地亚与撒玛利亚是同一整体的两个王国。数个世纪以前我们彼此分离，如今是再次合一的时候了。\n\n这项任务与#Y 以后统一我们的国#!相互#R 排斥#!。"
 judea_inv_mission_task_28:0 "新月沃土"
 judea_inv_mission_task_28_DESC:0 "新月之地自古是文明的摇篮。我们作为这地的后嗣理当主张。列国的权柄终必过去，惟有大卫的国如树生根，永不摇动。"
 judea_inv_mission_task_29:0 "寻找朋友"
 judea_inv_mission_task_29.tt:0 "我们将能够向另一个国家发出结盟建议。"
 judea_inv_mission_task_29_2.tt:0 "#R 至少要有一个大国对[THIS.GetCountry.GetName]有好感#!。"
 judea_inv_mission_task_29_DESC:0 "盟友如同盾牌，能为我们挡箭。我们要善用他们的力量，如大卫善用赫人乌利亚的刀剑。"
 judea_inv_mission_task_2_DESC:0 "看来传言是真的，大卫和所罗门居住在各个城市的痕迹已经被发现。问题是，他们在哪里居住的时间最长？"
 judea_inv_mission_task_3:0 "圣城"
 judea_inv_mission_task_3.tt:0 "至少有一个拥有的圣地是一个定居点。"
 judea_inv_mission_task_30:0 "改造叙利亚"
 judea_inv_mission_task_30_DESC:0 "叙利亚住着许多民族，他们的语言不同，风俗各异。但我们要使他们知道：以色列的信仰将成为他们的合一之绳。"
 judea_inv_mission_task_31:0 "融合大迦南"
 judea_inv_mission_task_31_DESC:0 "如今迦南地已属我们，住在其中的百姓也要成为我们国度的一部分。他们若愿意遵行我们的律法，就必与我们同享平安。但若他们抗拒，就要承担悖逆的后果。因为耶和华曾说：凡不寻求我的，我必撇弃他们。"
 judea_inv_mission_task_32:0 "在亚述传教"
 judea_inv_mission_task_32_DESC:0 "亚述人的地土已被我们攻取，他们的城邑如今归我们管辖。看哪，众民都聚集在他们的市集当中，他们曾拜偶像，行可憎之事。我们要在他们中间设立律法，使他们的市集不再贩卖虚妄，而成为赞美耶和华的所在。"
 judea_inv_mission_task_33:0 "神圣的香料"
 judea_inv_mission_task_33_DESC:0 "如今在#Y [SCOPE.sProvince('incense_city').GetName]#!，有一项新的技艺兴起，能使乳香更有效地收割与晒干，以致我们圣殿中的焚烧大大加增，香气如云。然而因这技艺之故，田间劳作之人减少了，耕地的力量减弱了。这提醒我们：不可只顾敬拜的丰盛，而忽略养育生命的根基。"
 judea_inv_mission_task_34:0 "地中海港口"
 judea_inv_mission_task_34.tt:0 "以下城市中，必须有至少 #Y 6#! 座中的 #Y 3#! 座满足下列要求：\n#Y [GetProvince('(int32)743').GetName]#!、#Y [GetProvince('(int32)670').GetName]#!、#Y [GetProvince('(int32)766').GetName]#!、#Y [GetProvince('(int32)786').GetName]#!、#Y [GetProvince('(int32)659').GetName]#!、#Y [GetProvince('(int32)664').GetName]#!\n\n#T 要求#!\n至少产出 #Y 3#! 种商品\n至少建有 1 个 #Y 市场#!\n至少建有 3 个 #Y 港口#!"
 judea_inv_mission_task_34_DESC:0 "黎凡特沿海的诸大城，自古以来因贸易而昌盛，商贾辐辏，财货堆积如山。然而，这繁荣并非无代价——那些贫苦的百姓，住在港口与市场的喧嚣之中，终日忍受腥臭的气味、刺耳的叫卖声，以及拥挤不堪的窄巷。耶和华的眼目看顾义人，也鉴察困苦人的叹息。我们不可只顾城邑的财富，而忘记那些在阴影中挣扎的百姓。正如先知曾说：我喜爱怜恤，不喜爱祭祀；喜爱认识神，胜于燔祭。我们要在繁荣中持守公义，使这地的富足也能滋润那些干渴的灵魂。"
 judea_inv_mission_task_34_tt_2:0 "每个符合标准的城市将获得#Y [GetModifier('judea_modifier_20').GetName]#!:\n[GetModifier('judea_modifier_20').GetDesc]"
 judea_inv_mission_task_35:0 "智慧之家"
 judea_inv_mission_task_35.tt:0 "拥有#Y 圣城#! 修正的领地需要拥有以下建筑。\n1 #Y 大神庙#! \n3 #Y 图书馆#! \n1 #Y 铸造厂#! 或 #Y 大剧院#!。"
 judea_inv_mission_task_35_DESC:0 "最近新建立的城市，吸引了许多百姓。他们来自四方，带着不同的口音与风俗，心中怀着盼望，也带着迷茫。因此，我们要在这城中设立图书馆与律法研习的殿堂，使律法的教师站在街头与广场，如文士在耶路撒冷教导百姓。因为知识与智慧是光，能引导他们行走正道，不被恶者的诡计引诱。"
 judea_inv_mission_task_3_DESC:0 "最神圣的地方必吸引人来，在那里预备居所，实在是应当的。"
 judea_inv_mission_task_4:0 "填满神龛"
 judea_inv_mission_task_4.tt:0 "[GetDeityDefinition('omen_moses').GetName|Y], [GetDeityDefinition('omen_solomon').GetName|Y], [GetDeityDefinition('omen_david').GetName|Y], [GetDeityDefinition('omen_esther').GetName|Y], [GetDeityDefinition('omen_samuel').GetName|Y], [GetDeityDefinition('omen_ezra').GetName|Y], [GetDeityDefinition('omen_abraham').GetName|Y], [GetDeityDefinition('omen_deborah').GetName|Y], [GetDeityDefinition('omen_joseph').GetName|Y], [GetDeityDefinition('omen_daniel').GetName|Y], [GetDeityDefinition('omen_ezekiel').GetName|Y], & [GetDeityDefinition('omen_joshua').GetName|Y] 里面至少要有一个宝物。\n#R 替换先知每次需要花费15稳定度！#!"
 judea_inv_mission_task_4_2.tt:0 "所有其他圣地也将获得#Y 辉煌的神庙#! 。"
 judea_inv_mission_task_4_DESC:0 "各圣所皆要安置圣物，我们要如此尊荣我们的先知。"
 judea_inv_mission_task_5:0 "进入迦南"
 judea_inv_mission_task_5_DESC:0 "从前属大卫王国的地业，终必重归我手，这些先知之遗迹实为迦南之宝。"
 judea_inv_mission_task_6:0 "进入叙利亚"
 judea_inv_mission_task_6.tt:0 "你将获得对整个美索不达米亚地区的宣称。"
 judea_inv_mission_task_6_DESC:0 "攻取叙利亚必为我民带来福音，其河川田畴滋养我国，待时机成熟，便可承继以斯帖女王之基业。"
 judea_inv_mission_task_7:0 "巴比伦"
 judea_inv_mission_task_7_DESC:0 "巴比伦这城，就是从前捆绑我们的，如今我们必夺取它，连它四围的圣所也归回我手。"
 judea_inv_mission_task_8:0 "以斯帖的地业"
 judea_inv_mission_task_8_DESC:0 "以斯帖曾为这地的女王，我们的民是她的民，故此她的地也必是我们的地。"
 judea_inv_mission_task_9:0 "敬爱先知"
 judea_inv_mission_task_9_2.tt:0 "所有其他圣地也将获得#Y 圣土#! 。"
 judea_inv_mission_task_9_DESC:0 "先知曾行走在这地上，他们所行的事，其声至今可闻。"
 judea_mission_abortion.tt:0 "你将在20年内无法再次开启这项使命。"
 judea_modifier_1:0 "以色列再征服"
 judea_modifier_10:0 "经验丰富的石匠"
 judea_modifier_11:0 "摩西精神"
 judea_modifier_12:0 "巴比伦复仇"
 judea_modifier_12_desc:0 "我们向巴比伦人进行了复仇，他们现在都在做奴隶..."
 judea_modifier_13:0 "庇路西翁堡垒"
 judea_modifier_14:0 "所罗门的恩典"
 judea_modifier_15:0 "埃及的奴隶供应"
 judea_modifier_16:0 "应许之地"
 judea_modifier_17:0 "以先知之名举行的盛宴"
 judea_modifier_18:0 "会幕"
 judea_modifier_19:0 "一个新行业的起源"
 judea_modifier_2:0 "煽动的骚乱"
 judea_modifier_20:0 "黎凡特的港口"
 judea_modifier_3:0 "新圣地"
 judea_modifier_4:0 "圣城"
 judea_modifier_5:0 "圣土"
 judea_modifier_6:0 "辉煌的圣所"
 judea_modifier_7:0 "美索不达米亚之囚"
 judea_modifier_8:0 "统一以色列人"
 judea_modifier_9:0 "以斯帖的遗产"
 judean_empire:0 "以色列君主制"
 judean_empire_co_ruler:0 "大祭司"
 judean_empire_consort:0 "大祭司"
 judean_empire_desc:0 "百姓受王的治理，而大祭司在属神的事上引导他们。"
 judean_empire_ruler:0 "王"
 judean_empire_ruler_female:0 "女王"
 kinnor_david:0 "大卫的金诺"
 kinnor_david_desc:0 "大卫王曾经弹奏的金诺琴。Kinnor是一种弦乐器，与kithara或Lyre非常相似。人们相信，当大卫弹奏它时，它有助于平静和舒缓扫罗王的心灵。"
 no_israel:0 "#Y 以色列#! 不存在"

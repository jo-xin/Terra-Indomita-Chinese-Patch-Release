l_simp_chinese:
 cretan_sappers:0 "克里特岛工兵"
 crete_mission_inv_10_task:0 "过去如此，将来也如此"
 crete_mission_inv_10_task_DESC:0 "在古老的时代，克里特岛曾隶属于一个强大的势力，而我们已准备好向世界宣告，那些日子已经回归。那个导致我们崛起的混乱时期，曾给我们的岛民带来危险与苦难，如今终于结束了。\n\n正如我们的先辈——辉煌的米诺斯人，曾经从[GetProvince('(int32)358').GetName]统治克里特岛一样，如今由我们自己来统治，也是再合适不过了。 \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 crete_mission_inv_1_task:0 "军营中的纪律"
 crete_mission_inv_1_task_DESC:0 "如果我们考虑为自己征服整个克里特岛，我们将需要一支有纪律的、专业的军队--一支与我们目前拥有的军队非常不同的样子。这可能不是一个受官兵欢迎的消息，但告诉士兵们，现在是演习的时候了！。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 crete_mission_inv_2_task:0 "铁剑和皮套"
 crete_mission_inv_2_task_DESC:0 "我们必须用最好的军事装备来装备我们的士兵，因为我们不可能派人到战场上对付装备精良的敌人。克里特岛各城邦的财力都很雄厚，而我们的财力必须更雄厚。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 crete_mission_inv_3_task:0 "不规则的事态"
 crete_mission_inv_3_task_DESC:0 "长期以来，克里特岛一直处于一种近乎瘫痪的状态，每个人都为自己的利益而行动。正如一艘船必须只有一个船长一样，我们的岛也必须只有一个主人！准备好我们的宣称，集合我们的军队，因为战争就在地平线上!\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 crete_mission_inv_4_task:0 "围墙和工匠"
 crete_mission_inv_4_task_DESC:0 "岛上混乱的政治状态，没有明确的霸主对众多城邦行使权力，导致了几乎每个省都有防御工事的情况。我们的士兵，特别是那些操作我们的攻城引擎的士兵，有他们的工作要做。\n\n不言而喻，维持这样一支精锐的军事单位有其相关的成本……\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 crete_mission_inv_5_task:0 "一个金币给第一个人"
 crete_mission_inv_5_task_DESC:0 "我们每攻下一座新的城市，都会让人知道，第一个翻越敌方城墙的士兵会得到一枚金币，由国库支付。现在，所有的人都在为这一荣誉叫嚣，像被地狱的灵魂附身一样战斗！。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 crete_mission_inv_6_task:0 "榨取每一滴水"
 crete_mission_inv_6_task_DESC:0 "我们的征服战争对我们的社区造成了破坏，这是众所周知的，但我们目前的情况迫使我们从这口井中汲取更多的营养，从我们的村庄和城市中榨取每一滴可用的人力。我们永远不会忘记我们的母亲和姐妹们给我们的这份无价的礼物，并承诺为克里特岛的梦想而战!\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 crete_mission_inv_7_task:0 "实施配给制"
 crete_mission_inv_7_task_DESC:0 "我们不仅需要进口谷物来养活我们的士兵，而且我们还必须遗憾地在我们的省份实行配给制度--在这个时代，每一头谷物，每一撮面粉都必须有一个交代。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 crete_mission_inv_8_task:0 "征服不可征服的人"
 crete_mission_inv_8_task_DESC:0 "有人声称克里特岛是一片充满了坚不可摧的城市的土地，所有的人都是小偷、骗子和海盗。正如我们最近的成功所证明的，这句格言的第一部分显然是不真实的。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 crete_mission_inv_9_task:0 "戏牛者"
 crete_mission_inv_9_task_DESC:0 "我们的侦察员已经完成了对[GetProvince('(int32)358').GetName]省的探索，并声称我们必须亲自去参观古代遗迹。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 desc_cretan_sappers:0 "这支精英部队受训于拆毁城墙的技能；这就是我们岛上的生活。"
 desc_grumbling_bellies:0 "虽然建立一个严格的配给制度对我们的战争努力是必要的，但事实证明它是非常不受欢迎的。"
 desc_grumbling_soldiers:0 "我们的士兵一直在抱怨我们营地里严格的军纪。"
 desc_iron_weapons:0 "为军队配备最好的武器装备是一项开支，在战场上会得到回报。"
 desc_mighty_crete:0 "在用武力征服了该岛之后，我们宣布自己是克里特岛的霸主。"
 desc_motivated_soldiers:0 "我们的士兵为荣誉而战，但向第一个登上城墙的人提供金币的承诺是一个强大的激励因素。"
 greek_6_crete:0 "克里特岛的统一"
 greek_6_crete_CRITERIA_DESCRIPTION:0 "当克里特岛被统一为一个国家的时候，这个任务才算完成。"
 greek_6_crete_DESCRIPTION:0 "战争!它那只无懈可击的黑手已经玷污了我们周围的一切；这些天人们所到之处，无论是广场、寺庙还是酒馆，除了谈论战争和破坏，什么都没有。由亚历山大和他的继任者领导的马其顿人现在已经把战争带到了更广阔的世界，但克里特岛上的城邦却以某种方式设法避免被卷入疯狂的战争。然而，新一代的雄心勃勃的人抛弃了他们的父辈拼命警告他们的危险，试图用武力主宰这个岛屿，扰乱不稳定的现状。\诗人迷失在他们的遐想中，对着他们的诗句和杯子深深叹息，宣称所有美好的东西都必须结束......因为现在战争已经找到克里特岛。"
 grumbling_bellies:0 "怨声载道的肚子"
 grumbling_soldiers:0 "埋怨的士兵们"
 iron_weapons:0 "钢铁武器"
 me_crete_10_desc:0 "[GetProvince('(int32)358').GetArea.GetName]迎来了新的一天；这个曾经是争吵不休的城邦和无情雇佣兵争夺之地的岛屿，如今在[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]神启般的领导下，第一次实现了和平。多年来，我们的领袖不得不应对敌方将领的恶毒策略，同时还要在紧张的政治局势和国内拮据的财政状况中艰难前行——这一壮举在[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]证明其可行之前，似乎是不可能完成的。街道上充满了喧闹的庆祝声，那些曾经指责[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]为暴君的声音，如今正在歌颂[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]永恒功绩。\n\n然而，即便在几乎所有人都对[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]赞誉有加的此刻，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]却依旧异常沉默寡言……在这胜利的时刻，似乎[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]心中仍有什么事情萦绕不去？"
 me_crete_10_title:0 "过去如此，将来也如此"
 me_crete_10_tooltip:0 "$mission_completed_tooltip_1$“#Y 过去如此，将来也如此#!”$mission_completed_tooltip_2$"
 me_crete_11_tooltip:0 "#R [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]及[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的支持者将夺取王位！#!$mission_completed_tooltip_1$“#Y 过去如此，未来亦然#!”$mission_completed_tooltip_2$"
 me_crete_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]现在可能是军营中最不受欢迎的人，这个火热的领袖以坚毅的态度承受了这个区别。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]引起这么多抱怨的原因很简单，我们的士兵正在进行三、四倍于以前的艰苦操练，虽然口粮略有增加以弥补艰苦的步伐，但有很多入伍者不高兴。\n\n当一些[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]最亲近的军事顾问接触时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]回绝了任何懈怠工作量的尝试，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]嘴里也是这样说的。"
 me_crete_1_title:0 "军营中的纪律"
 me_crete_1_tooltip:0 "$mission_completed_tooltip_1$“#Y 军营中的纪律#!”$mission_completed_tooltip_2$"
 me_crete_2_desc:0 "虽然我们的决定几乎让我们破产，但最后我们还是决定听从[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的告诫，他曾强烈建议不要把我们的人送上战场，除非他们有市场上最好的装备。虽然大家都同意我们的战士看起来很出色，但我们的一些主要公民却抱怨费用太高。\n\n'如果我们依靠我们的人自带武器，我们怎么能希望对抗任何人呢'[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]有说服力地争辩道。'如果我们的敌人有铁剑，你祖父的吊索就没有任何用处。如果我们想成功实现统一克里特岛的梦想，我们必须做我们之前没有人做过的事情，代价是该死的！'"
 me_crete_2_title:0 "铁剑和皮套"
 me_crete_2_tooltip:0 "$mission_completed_tooltip_1$“#Y 铁剑和皮套#!”$mission_completed_tooltip_2$"
 me_crete_3_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]召集了我们城市的主要家族，深入挖掘[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的客户网络，确保[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的演讲有接受的观众 -[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]所欠的每一个人情和债务都被记住了。\n\n当指定的时间到来时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]举起 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] 手，要求安静，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]开始了演讲，发表了题为《不规则的事务状态》的华丽的讲话。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]认为，除非我们团结一致，否则四分五裂的克里特政体必将毁灭，他雄辩地描绘了一幅即将到来的厄运。承诺[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]有一个愿景来避免这个灾难性的未来，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]警告我们，黑暗的时代在等着我们，然而太阳总有一天会升起 - 但这将需要我们的人民在未来的黑暗日子里信任和支持。\n\n不是每个人都被[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的话所说服，但大家一致认为，战争很快就会吞噬我们的地区。"
 me_crete_3_title:0 "不规则的事态"
 me_crete_3_tooltip:0 "我们现在拥有对整个克里特的宣称。$mission_completed_tooltip_1$“#Y 难以驾驭的局势#!”$mission_completed_tooltip_2$"
 me_crete_4_desc:0 "我们的会计人员提出了正式的投诉，现在我们工兵部队的训练和装备的相关费用已经实现。尽管我们被警告说我们的资金已经捉襟见肘，但我们的工程师现在开始制作围墙，这是一笔额外的开支，已经引起了整个城市的关注。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]一开始听了这些不满，没有说什么，但很快就用一句干巴巴的话结束了任何进一步的争论，然后转身回去看建筑。\n\n‘告诉我，让我们的军队在城墙外坐两年要花多少钱，你会发现我已经为我们节省了一笔财富。’"
 me_crete_4_title:0 "围墙和工匠"
 me_crete_4_tooltip:0 "$mission_completed_tooltip_1$“#Y 围墙和工匠#!”$mission_completed_tooltip_2$"
 me_crete_5_desc:0 "事情发生了多大的变化!人真的是一种反复无常的生物。不仅仅是几个月前，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]还经常被现在唱着[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]赞歌的那个士兵诅咒。人们可能会问，为什么突然变调了？上周，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]在营地向部队发表讲话，承诺将亲自给第一个登上敌方城市城墙的人一枚金币。\n\n我们的士兵们都在争相争取获得这一荣誉的机会，许多人梦想着为自己争取这笔意外之财。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]实施的战略多么高明！"
 me_crete_5_title:0 "一个金币给第一个人"
 me_crete_5_tooltip:0 "$mission_completed_tooltip_1$“#Y 一个金币给第一个人#!”$mission_completed_tooltip_2$"
 me_crete_6_desc:0 "我们最近在战场上取得的成果是惊人的，但却让我们的人付出了致命的代价。众所周知，我们的人力已经不多了，如果没有更多的人填补我们战线上的空白，我们就会失去迄今为止所获得的一切。\n\n意识到情况的严重性，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]做出了一个不受欢迎的决定，即派士兵去市场，召集所有看起来能拿起长矛的人，并让他们服兵役。\n\n这是史无前例的行动，但不幸的是，这是我们生活的时代。"
 me_crete_6_title:0 "榨取每一滴水"
 me_crete_6_tooltip:0 "$mission_completed_tooltip_1$“#Y 榨取每一滴水#!”$mission_completed_tooltip_2$"
 me_crete_7_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]正在获得做出艰难决定的声誉，甚至不惜牺牲[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的知名度。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]声称几乎不可能同时养活我们的军队和公民，因此下令在城市中配给面包。虽然许多人仍然对[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]充满信心，但也有一些人低声说[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]只不过是一个僭主，寻找第一个机会从饥饿的民众手中夺取权力。\n\n然而，人们将不得不竭力倾听这些叛逆的杂音，尤其在空腹的抱怨声中。"
 me_crete_7_title:0 "一个配给系统"
 me_crete_7_tooltip:0 "$mission_completed_tooltip_1$“#Y 实施配给制#!”$mission_completed_tooltip_2$"
 me_crete_8_desc:0 "虽然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]颁布的许多政策都有其诋毁者，但没有人可以说[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]没有实现承诺的目标。多年来，克里特岛第一次出现了一个崛起的大国；我们的收入、领土和影响力都在增长，而我们的成就也得到了整个世界的认可。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]带领我们走向胜利；我们对[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]投入了全部信心！"
 me_crete_8_title:0 "征服不可征服的人"
 me_crete_8_tooltip:0 "$mission_completed_tooltip_1$“#Y 征服不可征服的人#!”$mission_completed_tooltip_2$"
 me_crete_9_desc:0 "位于[GetProvince('(int32)358').GetName]的宫殿，曾经是传奇国王的居所，如今仍以半毁的状态留存。尽管有无数职责需要[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]投入全部的空闲时间，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]决定亲自造访此地，认为一些传统的观光活动可能会对缓解[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]压力产生奇效。\n\n那是一个上午的中段，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]在俯瞰这片土地的丘陵地带用过早餐后，决定进入宫殿内部一探究竟。在那里，昏暗与寂静之中，东墙上的一幅壁画让[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]屏住了呼吸。这幅画绘于灰泥墙板上，描绘了一头气势磅礴却令人畏惧的公牛正向前猛冲，似乎要摧毁一切挡在其狂暴蹄下的事物，然而画面中还有一群杂技演员，他们欢笑着、毫无惧色，灵巧地跃过这头猛兽。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]声音哽咽地说道：“我从这些画中看到了自己和我们的奋斗……我们从未逃避危险，而是勇敢面对，抓住公牛的角，在混乱之上优雅而从容地漂浮。让我们离开这里，但带上这一课。”"
 me_crete_9_title:0 "戏牛者"
 me_crete_9_tooltip:0 "$mission_completed_tooltip_1$“#Y 戏牛者#!”$mission_completed_tooltip_2$"
 me_greek_6_crete_1.a:0 "如果我们有任何生存的希望，我们需要团结一致地战斗，更不用说胜利了！"
 me_greek_6_crete_10.a:0 "我们将在古老的米诺斯权力的所在地统治一个统一的岛屿"
 me_greek_6_crete_10.b:0 "有人称我为僭主……他们不知道我的能力"
 me_greek_6_crete_2.a:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的话有道理..."
 me_greek_6_crete_3.a:0 "尽管如此，我将为这个无序的国度带来和平"
 me_greek_6_crete_4.a:0 "我向你保证，这些训练有素的部队将为我们赢得胜利！"
 me_greek_6_crete_5.a:0 "......鼓励......人尽其才，这没有错"
 me_greek_6_crete_6.a:0 "抓住任何身体健康的人，马上把他们送到训练营地"
 me_greek_6_crete_7.a:0 "有一天，所有人都会有免费的面包，但现在，我们必须做出牺牲"
 me_greek_6_crete_8.a:0 "还有很多事情要做"
 me_greek_6_crete_9.a:0 "这些米诺斯人真是令人赞叹啊……"
 mighty_crete:0 "克里特岛的霸主"
 motivated_soldiers:0 "积极进取的士兵"
 thicc_crete_tt:0 "你必须直接拥有克里特岛上的至少八个省份。"

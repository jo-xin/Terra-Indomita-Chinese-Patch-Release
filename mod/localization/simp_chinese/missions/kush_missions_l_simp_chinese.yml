 kush_missions:0 "库施王国"
 kush_missions_BUTTON_TOOLTIP:0 "埃及是我们的！"
 kush_missions_CRITERIA_DESCRIPTION:0 "当我们确立对希腊已知世界大部分地区的霸权时，该使命完成。"
 kush_missions_DESCRIPTION:0 "自第二十五王朝覆灭以来，库施之民几乎已湮没于历史长河之中。我们将扭转命运，崛起成为有史以来最强大的法老！"
 kush_missions_task_1:0 "库施王国"
 kush_missions_task_10:0 "主宰蓬特"
 kush_missions_task_10_DESC:0 "若我们扩大霸权，将蓬特纳入库施的统治之下，想来对所有人都更为有利。"
 kush_missions_task_11:0 "进入阿拉伯"
 kush_missions_task_11_DESC:0 "长久以来，我们眼睁睁看着邻国掠夺自然资源，深知这些财富本应由我们掌控。将疆域拓展至富饶的阿拉伯土地，必将为我们带来巨大财富！\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 kush_missions_task_12:0 "哈德拉姆特之事"
 kush_missions_task_12_DESC:0 "哈德拉毛长久以其繁荣的熏香贸易闻名于世，将其纳入库施统治之下必将使我们的国库充盈。\n\n\n\n\n\n\n\n\n\n@egypt_mil4!"
 kush_missions_task_13:0 "整合阿拉伯人"
 kush_missions_task_13_DESC:0 "我们必须巩固对阿拉伯异域的统治，以确保国家长治久安和熏香贸易的长久繁荣。\n\n\n\n\n\n\n\n\n\n@egypt_mil9!"
 kush_missions_task_14:0 "库施的阿拉伯"
 kush_missions_task_14_DESC:0 "将阿拉伯人纳入国家，对于国家安宁至关重要。"
 kush_missions_task_15:0 "向北方推进"
 kush_missions_task_15_DESC:0 "是时候向北推进，夺回昔日库施蒙受阿蒙神眷顾而统治的土地了。凭借神的意志，尼罗河畔的诸多伟大圣地理应归于我们之手。\n\n\n\n\n\n\n\n\n\n@egypt_mil5!>"
 kush_missions_task_16:0 "巩固努比亚"
 kush_missions_task_16_DESC:0 "我们必须巩固对努比亚土地的控制，征服我们不守规矩的邻居，把文明带到这些土地上。\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 kush_missions_task_17:0 "进入埃及"
 kush_missions_task_17_DESC:0 "是时候收复我们的祖先所征服的土地，统治整条尼罗河了！\n\n\n\n\n\n\n\n\n\n@egypt_mil17!"
 kush_missions_task_18:0 "建立第三十二王朝"
 kush_missions_task_18_DESC:0 "是时候宣告新的埃及王朝建立，确立我们的法老世系才是尼罗河的正统统治者，我们已将埃及从希腊人手中解放，荣耀归于新的埃及第三十二王朝！\n\n\n\n\n\n\n\n\n\n@egypt_por1!"
 kush_missions_task_19:0 "进入昔兰尼加"
 kush_missions_task_19_DESC:0 "在尼罗河三角洲以西，希腊人仍然统治着昔兰尼加的土地。我们必须向西推进，终结希腊在非洲的统治——若是放任其盘踞于彼，他们将永远威胁埃及领土。"
 kush_missions_task_1_DESC:0 "我们正在伟大的边缘蓄势待发；准备我们的宣称，扩展我们的疆域。库施王国将令世界惊叹！\n\n\n\n\n\n\n\n\n\n@egypt_mil25!"
 kush_missions_task_2:0 "溯尼罗河而上"
 kush_missions_task_20:0 "昔兰尼加的库施人"
 kush_missions_task_20_DESC:0 "决定是否应将昔兰尼加作为一个军事国家或贸易国家释放。（每一个库施属国的建立都会给他们的宗主国带来#G +2.5%的商业价值，+5%的全局人力修正#!和#R -10的忠诚度#!。库施人属国将获得#G +5%的征召兵规模#!和#G +10%的全局人力修正#!）"
 kush_missions_task_21:0 "库施的昔兰尼加"
 kush_missions_task_21_DESC:0 "我们将直接统治昔兰尼加，将其作为行省纳入我们的帝国；作为我们的一员，荣耀等待着他们。"
 kush_missions_task_22:0 "巴勒斯坦"
 kush_missions_task_22_DESC:0 "巴勒斯坦属于我们！我们的军队已跃跃欲试，渴望于黎凡特北方的富饶土地。"
 kush_missions_task_23:0 "库施的叙利亚"
 kush_missions_task_23_DESC:0 "叙利亚的疆域将为我们带来东方富饶土地的额外贸易利润，同时还能充当抵御来自东方、西方和北方侵略势力的战略缓冲区。"
 kush_missions_task_24:0 "小亚细亚的立足点"
 kush_missions_task_24_DESC:0 "在小亚细亚建立据点，既能阻止该地区其他势力联合起来将这些富饶土地据为己有，又能为我们提供新的基地，打击东地中海沿岸猖獗的海盗活动。"
 kush_missions_task_25:0 "发展农业"
 kush_missions_task_25_DESC:0 "尽管我们的大部分领土气候恶劣，但土地依然肥沃，只需增加粮食产量即可。若要支撑日益壮大的帝国，我们的农业产量必须翻一番。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 kush_missions_task_26:0 "努比亚建筑"
 kush_missions_task_26_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('kush_missions_task_26_buildings_total')|0]#!建筑在#Y 努比亚#!地区。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_26_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_26_construction_loc')]"
 kush_missions_task_26_DESC:0 "尽管努比亚建筑享誉世界，但持续发展我们的建筑技艺仍将带来不可估量的收益。"
 kush_missions_task_26_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_26_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_26_buildings_total')|0]#!)"
 kush_missions_task_26_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_26_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_26_buildings_total')|0]#!)"
 kush_missions_task_26_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 努比亚#!地区有正在进行的建设。"
 kush_missions_task_28:0 "建造库施神庙"
 kush_missions_task_28_DESC:0 "努比亚大地遍布着众多宏伟的库施神庙。我们必须通过建造神庙继续恪守对诸神的敬奉；正是神明的庇佑让我们走到今天，我们绝不能背弃神圣的传统。\n\n\n\n\n\n\n\n\n\n@event_pic10!"
 kush_missions_task_28_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 有正在进行的建筑，在一个#Y Kemetic圣地#!。"
 kush_missions_task_28_temple_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_28_temple_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_28_temple_total')|0]#!)"
 kush_missions_task_28_temple_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_28_temple_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_28_temple_total')|0]#!)"
 kush_missions_task_28_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('kush_missions_task_28_temple_total')|0]#!有#Y 神殿#!。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_28_temple_loc')] [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_28_construction_loc')] "
 kush_missions_task_29:0 "陶器贸易"
 kush_missions_task_29_DESC:0 "库施以生产世界顶级的陶器而闻名于世，如今我们志在主导这一贸易。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 kush_missions_task_29_earthware_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_29_earthware_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_29_earthware_total')|0]#!)"
 kush_missions_task_29_earthware_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_29_earthware_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_29_earthware_total')|0]#!)"
 kush_missions_task_29_tooltip:0 "至少#Y [SCOPE.ScriptValue('kush_missions_task_29_earthware_total')|0]#! #Y 陶器#!@earthware!是由#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 努比亚#!区域生产。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_29_earthware_loc')]"
 kush_missions_task_2_DESC:0 "随着国力日益增强，我们开始自腹地向外扩张。将#Y 阿卢特#! 和#Y 杰济拉#! 两省纳入库施人的统治之下！"
 kush_missions_task_3:0 "巩固麦罗埃"
 kush_missions_task_30:0 "建造大神庙"
 kush_missions_task_30_DESC:0 "一座献给阿蒙的大神庙，定能为我们赢得神的恩宠……"
 kush_missions_task_31:0 "点缀麦罗埃"
 kush_missions_task_31_DESC:0 "我们必须让麦罗埃成为库施力量与荣耀的光辉典范；凡观看她坚固堡垒的，都必惧怕库施的忿怒。\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 kush_missions_task_32:0 "麦罗埃都会"
 kush_missions_task_32_DESC:0 "麦罗埃将使孟斐斯和亚历山大黯然失色，成为生命之水——尼罗河上最伟大的城市。\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 kush_missions_task_33:0 "麻类贸易"
 kush_missions_task_33_DESC:0 "众所周知，库施人长期以来都为麻类植物所吸引……"
 kush_missions_task_34:0 "尼罗河贸易"
 kush_missions_task_34_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y [SCOPE.ScriptValue('kush_missions_task_34_buildings_total')|0]#! 地区拥有的领土上至少有#Y $lower_egypt_region$港口和市场#! 。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_34_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_34_construction_loc')]。"
 kush_missions_task_34_DESC:0 "恒久以来，尼罗河都是一条贯通麦罗埃至亚历山大的国内外贸易大动脉。只要国家稍加扶持，我们就能进一步提升当前所享有的巨大经济效益。\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 kush_missions_task_34_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_34_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_34_buildings_total')|0]#!)"
 kush_missions_task_34_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_34_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_34_buildings_total')|0]#!)"
 kush_missions_task_34_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 下埃及#!地区有正在进行的建设。"
 kush_missions_task_35:0 "埃及的粮仓"
 kush_missions_task_35_DESC:0 "埃及是地中海的粮仓。掌控并发展该地区的农业，将确保国内稳定并获取国际利润。"
 kush_missions_task_35_food_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_35_food_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_35_food_total')|0]#!)"
 kush_missions_task_35_food_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_35_food_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_35_food_total')|0]#!)"
 kush_missions_task_35_tooltip:0 "在#Y 下埃及#!区域至少#Y [SCOPE.ScriptValue('kush_missions_task_35_food_total')|0]#! #Y 谷物#!@grain!, #Y 蔬菜#!@vegetables!，或 #Y 鱼#!@fish!正在由#Y [SCOPE.GetRootScope.GetCountry.GetName]#!生产。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_35_food_loc')]"
 kush_missions_task_36:0 "蓬特的港口"
 kush_missions_task_36_DESC:0 "蓬特的港口是东非至关重要的贸易中心。如今它们已归属库施王国统治，我们必须确保这些地区的持续繁荣。\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 kush_missions_task_36_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 蓬特#!区域有正在进行的建设。"
 kush_missions_task_36_ports_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_36_ports_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_36_ports_total')|0]#!)"
 kush_missions_task_36_ports_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_36_ports_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_36_ports_total')|0]#!)"
 kush_missions_task_36_tooltip:0 "在#Y $punt_region$#!区域内我们的领土上，#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('kush_missions_task_36_ports_total')|0]个港口和市场#!。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_36_ports_loc')] [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_36_construction_loc')]"
 kush_missions_task_37:0 "发展阿拉伯南部"
 kush_missions_task_37_DESC:0 "在阿拉伯南部荒芜的土地上，有着形形色色的稀有商品。在此投资或许能为国库带来可观收益……"
 kush_missions_task_37_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_37_building_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_37_building_total')|0]#!)"
 kush_missions_task_37_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_37_building_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_37_building_total')|0]#!)"
 kush_missions_task_37_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 阿拉伯福地#!区域有正在进行的建设。"
 kush_missions_task_37_tooltip:0 "在#Y $arabia_felix_region$#!区域内我们的领土上，#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 至少有#Y [SCOPE.ScriptValue('kush_missions_task_37_building_total')|0]个建筑#!。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_37_buildings_loc')][SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_37_construction_loc')]"
 kush_missions_task_38:0 "阿拉伯的城市"
 kush_missions_task_38_DESC:0 "阿拉伯半岛各地的城镇与聚落必须进一步推进城市化，并加以发展，以此充分利用其资源与人力。即刻下令吧。"
 kush_missions_task_39:0 "昔兰尼加的港口"
 kush_missions_task_39_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y [SCOPE.ScriptValue('kush_missions_task_39_ports_total')|0]#! 地区拥有的领土上至少有#Y $cyrenaica_region$港口#! 。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_39_ports_loc')] [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_39_construction_loc')]。"
 kush_missions_task_39_DESC:0 "昔兰尼加的港口距离迦太基、西西里和罗马的富饶之地只有数日航程。发展该区域的港口基础设施或将为我们带来西方的财富……\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 kush_missions_task_39_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 昔兰尼加#!区域有正在进行的建设。"
 kush_missions_task_39_ports_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_39_ports_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_39_ports_total')|0]#!)"
 kush_missions_task_39_ports_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_39_ports_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_39_ports_total')|0]#!)"
 kush_missions_task_3_DESC:0 "我们应当巩固我们的首都所在的麦罗埃省，这座宏伟的城市无疑值得我们倾尽全力。"
 kush_missions_task_4:0 "阿克苏姆的库施人"
 kush_missions_task_40:0 "库施贸易"
 kush_missions_task_40_DESC:0 "我们正处于能够充分利用国内外贸易路线的有利位置。现下的投资有望在未来为国家创造收益……\n\n\n\n\n\n\n\n\n\n@egypt_mil18!>"
 kush_missions_task_41:0 "帝国崇拜"
 kush_missions_task_41_DESC:0 "法老被其全体臣民视为神王，荷鲁斯的转世，在来世成为奥西里斯。"
 kush_missions_task_43:0 "旧都"
 kush_missions_task_43_DESC:0 "在我们以前，纳帕塔曾是库施诸王的首都。尽管它至今仍是座伟大的城市，但我们有责任让纳帕塔重现昔日荣光——众神必将奖赏我们的忠诚。"
 kush_missions_task_45:0 "库施的金字塔"
 kush_missions_task_45_DESC:0 "库施大金字塔矗立于此，作为我们精湛的工程技艺、对神明虔诚敬奉以及对民众统御威仪的明证。纵使跨越时空，世人仍将为我们伟大工程的恢弘而惊叹不已！\n\n\n\n\n\n\n\n\n\n@egypt_mil1!"
 kush_missions_task_46:0 "主宰布伦米亚人"
 kush_missions_task_46_DESC:0 "长期以来，我们一直受到布伦米亚强盗的骚扰；这些强盗发动袭击，然后利用沙漠优势，在我们的士兵追捕到他们之前就消失在沙丘里。既然布伦米亚的统治者无视我们关于打击这些匪徒的要求，我们决定自己动手。"
 kush_missions_task_47:0 "布伦米亚的金矿"
 kush_missions_task_47_A_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y $gabgaba_area$、$allaqi_area$、$eastern_desert_area$和$troglodytica_area$#!至少生产#Y [SCOPE.ScriptValue('kush_missions_task_47_gold_total')|0]#!#Y 贵金属#!@precious_metals!。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_47_gold_loc')]"
 kush_missions_task_47_DESC:0 "布伦米亚群山蕴藏着丰富的贵金属，使这片土地成为我们不断扩张的王国中极具价值的领地。我们应当倾注尽可能多的资源开发当地矿藏。"
 kush_missions_task_47_gold_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_47_gold_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_47_gold_total')|0]#!)"
 kush_missions_task_47_gold_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_47_gold_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_47_gold_total')|0]#!)"
 kush_missions_task_48:0 "拥抱埃及之道"
 kush_missions_task_48_DESC:0 "是时候让我们接受埃及之道了；尽管仍需细水长流，但我们将以公布使之正式化。\n\n\n\n\n\n\n\n\n\n@egypt_por2!"
 kush_missions_task_49:0 "牛耕"
 kush_missions_task_49_A_tooltip:0 "至少#Y [SCOPE.ScriptValue('kush_missions_task_49_livestock_total')|0]#!#Y 牲畜#!@cattle! 是由#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y 努比亚#!地区生产。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_49_livestock_loc')] "
 kush_missions_task_49_DESC:0 "库施的牛耕是我们世代以来的主要食物来源。发展我们的耕牛养殖业将为民众确保稳定的食物供应。"
 kush_missions_task_49_livestock_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_49_livestock_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_49_livestock_total')|0]#!)"
 kush_missions_task_49_livestock_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_49_livestock_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_49_livestock_total')|0]#!)"
 kush_missions_task_4_DESC:0 "一旦我们拿下了阿克苏姆和塔纳，我们就将教导当地人敬拜真神。"
 kush_missions_task_5:0 "使阿克苏姆皈依"
 kush_missions_task_50:0 "阿拉伯熏香"
 kush_missions_task_50_DESC:0 "我们的阿拉伯熏香贸易正获得丰厚回报；现在是向商人收取利润的时候了。\n\n\n\n\n\n\n\n\n\n@egypt_mil26!"
 kush_missions_task_50_incense_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_50_incense_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_50_incense_total')|0]#!)"
 kush_missions_task_50_incense_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_50_incense_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_50_incense_total')|0]#!)"
 kush_missions_task_50_tooltip:0 "在#Y [SCOPE.GetRootScope.GetCountry.GetName]#!的#Y 阿拉伯福地#!区域至少有 #Y [SCOPE.ScriptValue('kush_missions_task_50_incense_total')|0]#! #Y 香#!@incense! 正在被生产。 [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_50_incense_loc')]"
 kush_missions_task_51:0 "库施的建设者"
 kush_missions_task_51_DESC:0 "难道你没看见库施建筑是如何遍布下埃及的土地吗？人人都渴望在我们工程师设计的城市里生活工作。"
 kush_missions_task_51_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('kush_missions_task_51_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_51_buildings_total')|0]#!)"
 kush_missions_task_51_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('kush_missions_task_51_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('kush_missions_task_51_buildings_total')|0]#!)"
 kush_missions_task_51_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y 下埃及#!地区有正在进行的建设。"
 kush_missions_task_51_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!至少有#Y [SCOPE.ScriptValue('kush_missions_task_51_buildings_total')|0]个建筑#!在#Y 下埃及#!区域的领土上。[SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_51_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('kush_missions_task_51_construction_loc')]"
 kush_missions_task_52:0 "阿拉伯异域商品"
 kush_missions_task_52_DESC:0 "经过长期投资，我们阿拉伯产业中涌现的珍奇商品正逐渐增多，令那些有能力购买这些奢侈品的人欣喜不已。"

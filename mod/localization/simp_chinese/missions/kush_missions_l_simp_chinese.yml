 me_kush_17_desc:0 "在库施人的统治下，在叙利亚各城市建立的殖民地一直很繁荣。这些新建立的库施殖民地的重点是什么？"
 me_kush_17_title:0 "叙利亚殖民地的重点"
 me_kush_18.a:0 "我们必须坚持我们的根。"
 me_kush_18.b:0 "拥抱埃及的传统。"
 me_kush_18.c:0 "将我等库施人的传统与埃及人之道相结合。"
 me_kush_18_desc:0 "公元前343年，埃及最后一个本土王朝——第三十王朝被阿契美尼德帝国皇帝阿尔塔薛西斯三世推翻。阿契美尼德王朝由此建立了埃及最后的第三十一王朝，但其统治时间短暂，不久便被亚历山大大帝征服——他也征服了当时已知世界的大部分地区。\n然而亚历山大并非永生，他昔日的雄伟帝国如今已然分崩离析，无可挽回地被其旧时将帅们瓜分。在亚历山大溘然长逝后，托勒密诸王稳固掌控着埃及，但如今强大的库施王国已统一上下埃及之地，足以宣告埃及第三十二王朝的建立。"
 me_kush_18_title:0 "第三十二王朝"
 me_kush_19.a:0 "麦罗埃仍为首都。"
 me_kush_19.b:0 "亚历山大里亚将为新都。"
 me_kush_19.c:0 "孟菲斯将为新都。"
 me_kush_19_desc:0 "传统上，埃及王朝都以尼罗河三角洲为统治中心。如今麦罗埃比以往任何时候都更加繁荣，堪称我们新库施王国的理想都城。但若将首都迁往北方，则有助于巩固对新征服埃及领土的控制。我们该如何抉择？"
 me_kush_19_title:0 "新都"
 me_kush_1_desc:0 "库施诸王在公元前757年建立了埃及的第二十五王朝，统一了下埃及、上埃及和库施，创造了新王国时代以来最大的埃及帝国。他们的继任者，第二十六王朝，成为了阿契美尼德帝国入侵埃及之前最后一个统治埃及的本土王朝。然而如今，强大的马其顿托勒密王朝却统治着神圣的埃及土地。为了恢复第二十五王朝的荣光，我们已等待许久。如今正是库施顺着尼罗河而下，恢复我们埃及之王地位的时刻！"
 me_kush_1_title:0 "库施王国"
 me_kush_2.a:0 "释放一个拥有塔纳和阿克苏姆省的库施仆从"
 me_kush_2.b:0 "在塔纳省和阿克苏姆省释放两个库施仆从。"

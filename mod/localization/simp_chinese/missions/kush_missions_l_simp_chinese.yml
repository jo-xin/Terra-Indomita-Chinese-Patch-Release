 me_kush_10.a:0 "释放以军事为重点的昔兰尼加区域的仆从"
 me_kush_10.a.tt:0 "#Y 库施-昔兰尼加#! 将在25年内获得#G +10%人力#! 。"
 me_kush_10.b:0 "将昔兰尼加地区作为贸易重点仆从释放。"
 me_kush_10.b.tt:0 "#Y 库施-昔兰尼加#! 将在25年内获得#G +5%的商业价值#! 。"
 me_kush_10.c:0 "仔细想想，我们不需要另一个仆从"
 me_kush_10_desc:0 "随着昔兰尼加的土地现在被我们牢牢控制，我们现在要做一个关键的决定。我们的库施仆从应该专注于发展他们的军事力量，还是应该专注于贸易和财富的积累？如果我们愿意的话，我们也可以将这片土地留在我们的直接统治之下。"
 me_kush_10_title:0 "昔兰尼加的仆从国"
 me_kush_11.a:0 "一个仆从就可以了。"

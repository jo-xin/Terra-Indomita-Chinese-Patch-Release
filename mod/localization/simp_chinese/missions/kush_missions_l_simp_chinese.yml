 me_kush_25_title:0 "在摩叙隆发展我们的仆从"
 me_kush_26.a:0 "在#Y Kyrini#! 城的小发明就可以了。"
 me_kush_26.b:0 "对#Y Kyrini#! 城的大型投资是必要的。"
 me_kush_26.c:0 "我们不会在这些傻瓜身上花一毛钱!"
 me_kush_26_desc:0 "按照传统，我们所建立的仆从国必须得到其宗主的照顾和发展。如果不这样做，可能会使我们的附属国感到不安，而我们也不想让昔兰尼加人不爽。帮助他们发展并建立对该地区的控制，可以在未来为我们带来巨大的财富……"
 me_kush_26_title:0 "发展我们在昔兰尼加的仆从"
 me_kush_27.a:0 "在#Y Leuki Akti#! 城的小投资就可以了。"
 me_kush_27.b:0 "对#Y Leuki Akti#! 城的大型投资是必要的。"
 me_kush_27.c:0 "花费我们宝贵的黄金？我认为不需要。"
 me_kush_27_desc:0 "按照传统，我们所建立的仆从国必须得到其宗主的照顾和发展。如果不这样做，可能会使我们的附属国感到不安。帮助他们发展并建立对该地区的控制，可以在未来为我们带来巨大的财富……"
 me_kush_27_title:0 "发展我们在叙利亚的仆从"
 me_kush_28.a:0 "在#Y Leuki Akti#! 城的小投资就可以了。"
 me_kush_28.b:0 "对#Y Leuki Akti#! 城的大型投资是必要的。"
 me_kush_28.c:0 "花费我们宝贵的黄金？我认为不可能!"
 me_kush_28_desc:0 "按照传统，我们所建立的附庸国必须由其宗主国进行管理和开发。若未能做到这一点，可能会引起我们的臣民不满。帮助他们发展并巩固在该地区的地位，未来或许能为我们带来巨大的财富……"
 me_kush_28_title:0 "发展我们大腓尼基的仆从"
 me_kush_29.a:0 "在#Y Tyros#! 城的一个小发明就可以了。"
 me_kush_29.b:0 "对#Y Tyros#! 城的大型投资是必要的。"
 me_kush_29.c:0 "我们不会在这些傻瓜身上花一毛钱!"
 me_kush_29_desc:0 "按照传统，我们所建立的仆从国必须得到其宗主的照顾和发展。如果不这样做，可能会使我们的附属国不安。帮助他们发展并建立对该地区的控制，可以在未来为我们带来巨大的财富……"
 me_kush_29_title:0 "发展我们的小腓尼基的仆从"
 me_kush_2_desc:0 "如果我们建立一个库施的仆从国，阿克苏姆地区将更加繁荣。"
 me_kush_2_title:0 "阿克苏姆的仆从"
 me_kush_3.a:0 "对卡尔米勒省进行殖民化"
 me_kush_3.b:0 "我们不会花我们的黄金去殖民一个荒芜的荒地!"
 me_kush_30.a:0 "在#Y 萨拉米斯#! 城的一个小发明就可以了。"
 me_kush_30.b:0 "对#Y 萨拉米斯#! 市的大型投资是必要的。"
 me_kush_30.c:0 "我们不会在这些傻瓜身上花一毛钱的!"
 me_kush_30_desc:0 "按照传统，我们所建立的附庸国必须由其宗主国进行管理和开发，塞浦路斯与我们的其他领地并无二致。忽视我们的臣民无疑会激起他们的不满，而我们希望尽可能避免这种情况。帮助他们发展并巩固在该地区的地位，未来或许能为我们带来巨大财富，但在此之前，我们必须付出一定的代价。"
 me_kush_30_title:0 "发展我们的塞浦路斯仆从"
 me_kush_31.a:0 "拒绝他们的要求"
 me_kush_31.b:0 "缓和紧张局势"
 me_kush_31.c:0 "他们以为自己是谁？立即增加贡品！"
 me_kush_31.d:0 "接受他们的要求"
 me_kush_31_desc:0 "在忽略了我们仆从国的需求多年之后，他们向我们提出了进一步自治的宣称。他们声称，如果他们获得自治权，就能更好地管理他们的土地。我们应该怎么做？"
 me_kush_31_title:0 "库施仆从要求自治"
 me_kush_32.a:0 "接受礼物"
 me_kush_32.b:0 "不接受礼物，但要用我们自己的礼物送特使回家。"
 me_kush_32_desc:0 "在对我们忠诚的仆从进行了许多昂贵的投资之后，他们从他们统治的土地上带来了奢华的货物，作为他们贡品的一部分，来到我们的王宫。我们该如何处理这些奇特的货物？"
 me_kush_32_title:0 "臣民带来礼物"
 me_kush_33.a:0 "荣耀归于库施！"
 me_kush_33_desc:0 "在对我们忠诚的仆从进行了许多昂贵的投资后，他们从他们统治的土地上带来了巨大的财宝，作为他们贡品的一部分，来到我们的王宫。"
 me_kush_33_title:0 "库施仆从带来巨大财富"
 me_kush_34.a:0 "是时候建造一个了不起的奇迹了!"
 me_kush_34_desc:0 "我们已经向所有生活在我们土地上的人发出了呼吁。埃及每个城镇最伟大的建筑家和建筑师将来到王宫，我们将选择一位伟大的建筑家为我们建造一个大奇迹。"
 me_kush_34_title:0 "伟大的建设者"
 me_kush_35.a:0 "摩叙隆海岸以南"
 me_kush_35.b:0 "沿着白尼罗河而下"
 me_kush_35.c:0 "穿越海洋到香料之国"
 me_kush_35.d:0 "这些傻瓜不会得到我的任何金子的!"
 me_kush_35_desc:0 "一位强壮能干的男子现身于我等法庭，请求征召人马，筹措资金，派遣远征队前往国境之外未知的土地。若是资助此行，或可为库施带回不可胜计的财富；然而诸事无常，如此凶险远征亦然难料成败。"
 me_kush_35_title:0 "一个诱人的提议"
 me_kush_36.a:0 "多么愚蠢..."
 me_kush_36_desc:0 "我们多年前资助的小型远征队只带了几个人回国。他们讲述了他们所走过的土地的可怕的故事。许多好人在这次远征中死去，人们开始质疑我们派这些人去送死的决定。"
 me_kush_36_title:0 "远征失败"
 me_kush_37.a:0 "他们将为库施带来荣耀！"
 me_kush_37_desc:0 "我们多年前派出的探险队已经派出了一个带着信息的特使回家。他们已经到达了一个巨大的丛林的边缘，这个丛林比任何人都要大。这片丛林向各个方向延伸了数百英里，似乎没有尽头。再过几天，我们的人就会进入这个神秘的大丛林。只有时间能告诉我们，我们勇敢的人是带着巨大的财宝回来，还是面临着死在大丛林的手中......"
 me_kush_37_title:0 "进入雨林"
 me_kush_38.a:0 "白象"
 me_kush_38.b:0 "500磅重的老虎"
 me_kush_38.c:0 "独角犀牛"
 me_kush_38_desc:0 "经过许多个月和无数次的投资，离开我们的王宫，沿着惠尼罗河航行的探险队已经回家了。他们携带了大量的异国动物，这些动物是库施人以前从未见过的。根据我们的协议，我们可以从这次远征的最好战利品中挑选。这些强大的动物将在王宫里展示给所有人看。"
 me_kush_38_title:0 "丛林中的猛兽"
 me_kush_39.a:0 "立即开始进攻！。"
 me_kush_39.b:0 "命令他们回家，这是很愚蠢的。"
 me_kush_39_desc:0 "我们多年前派出的探险队已经送回了一个消息。他们偶然发现了一座坐落在森林深处的巨大黄金宫殿，它完全由黄金制成。他们声称这座宫殿是人类所见过的最大的建筑，垂直方向一直延伸到云端，水平方向则是肉眼可见的。这座宫殿似乎没有任何防御措施，只有几百个奇怪的人形生物在守卫。我们的人请求我们允许他们继续前进，袭击黄金宫。你怎么说？"
 me_kush_39_title:0 "大金宫"
 me_kush_3_desc:0 "开始对庞特无人居住的土地进行殖民化，派人到卡尔米勒省。"
 me_kush_3_title:0 "蓬特的殖民化"
 me_kush_4.a:0 "对Kebranitia和Rhammanitai省进行殖民化"
 me_kush_4.b:0 "我们不会再花我们的黄金去殖民一片荒芜的荒地了!"
 me_kush_40.a:0 "我们很有钱！！"
 me_kush_40_desc:0 "经过多年的时间和无数的投资，离开我们的王宫，沿着摩叙隆海岸出发的探险队回来了。他们从金宫带来了他们所能携带的尽可能多的黄金。然而，所有的人都抱着严峻的表情，拒绝谈论在皇宫里发生的事情，探险队中没有一个人愿意说出在那里发生的任何事情……不管在神话中的宫殿里到底发生了什么，探险队都取得了巨大的成功，他们带来的黄金将使皇家国库在未来几年内保持充盈。"
 me_kush_40_title:0 "非洲的财富"
 me_kush_41.a:0 "希望我们能回家......"
 me_kush_41_desc:0 "历经多年航行，自王廷启程的远征队终于抵达了富饶的印度之地，他们登陆的港口城市被当地印度人称为母支梨湿。甫一抵达，我方人员便以随身携带的少量货物换取了滚滚财富。库施的莎草纸与陶器令当地人目眩神迷，甘愿以天价收购。远征队员如今过着王公般的生活，船舱里满载香料、宝石等异域珍品。印度真乃天赐福地。"
 me_kush_41_title:0 "富饶的印第卡大陆"
 me_kush_42.a:0 "荣耀归于库施！"
 me_kush_42_desc:0 "经过多年和无数次的投资，离开我们的王宫，前往伟大的印地卡土地的探险队已经回来了。他们带着库施人从未见过的奇异货物。此外，这些船装满了黄金，由于重量太大，在回家的路上几乎沉没。这将标志着与伟大的印度人之间长期而繁荣的贸易关系的开始。"
 me_kush_42_title:0 "英迪卡的宝藏"
 me_kush_43.a:0 "向法老致敬，他是人中之神。"
 me_kush_43_desc:0 "每一位之前统治过我们的法老都已逝去；如今他们被称为奥西里斯，永恒之王。现在，一个新时代已然到来，一位新的法老已登上王座，统治伟大的埃及人民。（埃及法老必须遵循埃及传统，否则将失去 #Y 法老#! 特质，并获得 #R 被玷污的法老#! 特质。）"
 me_kush_43_title:0 "一个新的法老"
 me_kush_47.a:0 "建立一个殖民地"
 me_kush_47.b:0 "建立两个殖民地"
 me_kush_47.c:0 "建立三个殖民地"
 me_kush_47_desc:0 "只要我们愿意慷慨解囊，派遣大批库施人前往塞浦路斯建立繁荣城市，他们必将为我们带来丰厚赏报。\n\n（自1年到3年内，将为该区域的所有殖民地选择殖民地的专攻方向）"
 me_kush_47_title:0 "殖民地在塞浦路斯"
 me_kush_48.a:0 "建立十个殖民地"
 me_kush_48.b:0 "建立七个殖民地"
 me_kush_48.c:0 "建立五个殖民地"
 me_kush_48.d:0 "建立三个殖民地"
 me_kush_48_desc:0 "依照惯例，派遣大批库施人前往叙利亚地区建立繁荣城市，这必将为我们带来丰厚赏报。可供定居之地众多，取决于您愿为此投入多少资金。\n\n（自1年到3年内，将为该区域的所有殖民地选择殖民地的专攻方向）"
 me_kush_48_title:0 "叙利亚殖民地"
 me_kush_49.a:0 "一个仆从就可以了。"
 me_kush_49.b:0 "我们必须把土地分成两个仆从。"
 me_kush_49.c:0 "建立一个殖民地代替"
 me_kush_49_desc:0 "如果我们建立一个库施仆从国，巴勒斯坦地区将更加繁荣。( 每一个库施仆从的建立将给他们的宗主带来#G +2.5%的商业价值，+5%的全局人力修正#! 和#R -10的附属国忠诚度#! 。库施仆从可以得到#G +5%的征召兵规模#! 和#G +10%的全局人力修正#! )"
 me_kush_49_title:0 "巴勒斯坦的库施仆从"
 me_kush_4_desc:0 "继续对蓬特无人居住的土地进行殖民化，派人到凯布兰尼蒂亚省和拉曼尼泰省。"
 me_kush_4_title:0 "蓬特省的殖民化"
 me_kush_50.a:0 "建立五个殖民地"
 me_kush_50.b:0 "建立三个殖民地"
 me_kush_50.c:0 "建立一个殖民地"
 me_kush_50_desc:0 "派遣大批库施人前往巴勒斯坦地区建立繁荣殖民地，这一构想已然在你心中酝酿许久。再度权衡利弊，想想这是否值得？\n\n（自1年到3年内，将为该区域的所有殖民地选择殖民地的专攻方向）"
 me_kush_50_title:0 "在巴勒斯坦建立殖民地"
 me_kush_51.a:0 "努比亚人将再次崛起！"
 me_kush_51_desc:0 "许多人认为舍比特库（或沙巴塔卡）才是埃及第二十五王朝的始王——依靠暴力而非和平，他沿尼罗河征服了上下埃及，烧死了抗拒其统治的前朝法老博克霍里斯，成为了全埃及的统治者。我们必须效法舍比特库的征服，让库施王国再度伟大——让我们怒火的烈焰烧尽敌人！\n\n#E 历史背景#!：\n尽管一般认为舍比特库是第二十五王朝的沙巴卡与塔哈尔卡之间的第三位君主，但根据铭文次序与金字塔建筑技巧的递进，现代有研究认为他的统治应当在沙巴卡之前，或至少与其联合执政；如果根据这种说法，那么对上下埃及的统一是由舍比特库完成的。"
 me_kush_51_title:0 "舍比特库的征服"
 me_kush_52.a:0 "继续，向下埃及前进！"
 me_kush_52_desc:0 "征服上埃及后，我军发现了我等伟大先祖——努比亚国王皮耶留下的石碑。正是他开启了进军埃及的征程，最终奠定了努比亚诸王治下第二十五王朝的基础。\n\n碑文如下：“听吧，旅人，我的成就如何超越先祖。吾乃君王，神的化身，阿图姆的显现。自母腹降世即被标记为统治者，令尊者亦心生畏惧。其母在卵中便知其将成君主。此乃善神，众神所爱，太阳神之子，以双臂施政者——皮耶，阿蒙所爱之人……”——皮耶胜利石碑，刻于其征服上埃及之后。"
 me_kush_52_title:0 "皮耶的征服"
 me_kush_53.a:0 "在城墙上行走"
 me_kush_53.b:0 "我们不需要遵循埃及的传统"
 me_kush_53_desc:0 "许多年前，神话中的国王美尼斯在孟菲斯建立了白墙，作为整个埃及的中央政府所在地。在我们之前，几乎每个法老都完成了绕行白墙的仪式。这需要几天的时间，我们必须准备一个昂贵的绕行孟菲斯城的仪式队伍。进行绕行仪式将增强新法老的王位权利。"
 me_kush_53_title:0 "绕行白墙"
 me_kush_54.a:0 "开始旅程"
 me_kush_54.b:0 "我们不需要遵循埃及的传统"
 me_kush_54_desc:0 "法老加冕后不久，他们要在整个下埃及和上埃及的土地上为他们的新臣民举行盛宴。这些盛大的宴会被统称为 国王的出现。遵守这些古老的传统将有助于巩固我们对埃及人民的统治。"
 me_kush_54_title:0 "国王出场"
 me_kush_55.a:0 "开始宴席"
 me_kush_55.b:0 "我们不需要遵循埃及的传统"
 me_kush_55_desc:0 "在索卡节的前一天晚上，将举行一个纪念活动，包括在亲人的坟墓前彻夜守候。它被称为 Notjeryt之夜，也被称为 系洋葱之日，埃及人会系上洋葱花环，戴在身上献给死者。索卡节的重要性来自于它与古代冥界之神奥西里斯的重要性以及他与孟菲斯的古老力量的联系。"
 me_kush_55_title:0 "索卡节"
 me_kush_56.a:0 "开始节日"
 me_kush_56.b:0 "我们不需要遵循埃及的传统"
 me_kush_56_desc:0 "塞德节是一个非常重要的仪式，它象征着再生，是为了保证法老来世的长期统治。仪式的目的是在国王生病或只是年老的情况下，使国王与宇宙之间恢复和谐。在节日过程中，祭司将带领国王进入两个亭子，在那里他将接受上埃及和下埃及的冠冕，象征性地重新举行加冕仪式。在盛大的塞德节之后，所有在场的人都将分享奢华的食物、饮料、音乐和舞蹈。"
 me_kush_56_title:0 "塞德节"
 me_kush_57.a:0 "开始庆祝活动"
 me_kush_57.b:0 "我们不需要遵循埃及的传统"
 me_kush_57_desc:0 "伟大的奥佩特节即将开始，它将像多年来一样，在圣城底比斯举行。底比斯市民和他们来自远方的客人庆祝他们的法老和全能的神阿蒙之间的丰硕联系。人们将与法老一起参加纪念阿蒙的戏剧性游行，游行将从卡纳克的阿蒙神庙开始，在城市南端一英里半外的卢克索神庙结束。"
 me_kush_57_title:0 "奥佩特节"
 me_kush_58.a:0 "谁在乎他们怎么想？"
 me_kush_58.b:0 "对阿蒙的大量捐赠可以安抚他们。"
 me_kush_58_desc:0 "埃及人民已经决定，我们的统治者是不适合统治的。多年来，法老不尊重埃及的传统，人民对法老的统治不再有信心。"
 me_kush_58_title:0 "不名誉的法老"
 me_kush_59.a:0 "麦罗埃大城"
 me_kush_59.b:0 "纳帕塔的旧首都"
 me_kush_59.c:0 "圣城底比斯"
 me_kush_59_desc:0 "努比亚人建造的金字塔是世界上独一无二的。虽然比埃及金字塔小得多，但努比亚金字塔的数量却多得多。"
 me_kush_59_title:0 "开始建造"
 me_kush_6.a:0 "将摩叙隆省作为一个以军事为重点的仆从释放"
 me_kush_6.a.tt:0 "#Y 库施的摩叙隆#! 将在25年内获得#G +10%的人力#! 。"
 me_kush_6.b:0 "将摩叙隆省作为贸易重点仆从释放。"
 me_kush_6.b.tt:0 "#Y 库施的摩叙隆#! 将获得#G +5%的商业价值#! 25年的收益。"
 me_kush_6.c:0 "一个殖民地"
 me_kush_6.d:0 "两个殖民地"
 me_kush_60.a:0 "授权发放更多资金"
 me_kush_60.b:0 "他们不会再从我这里得到一毛钱了!"
 me_kush_60_desc:0 "事实证明，我们为金字塔建设提供的资金是不够的。建设者们要求在继续建设之前获得更多的资金。"
 me_kush_60_title:0 "建造金字塔需要更多资金"
 me_kush_61.a:0 "从军队中派遣人员"
 me_kush_61.b:0 "给他们送来新兵"
 me_kush_61_desc:0 "金字塔建设可以是相当致命的冒险。我们为金字塔建设提供的大部分人员和奴隶都在这个过程中丧生，建设者们要求更多的人手来完成建设。"
 me_kush_61_title:0 "金字塔建设需要更多的人"
 me_kush_62.a:0 "我们有福了"
 me_kush_62.b:0 "我们有福了"
 me_kush_62.c:0 "我们有福了！我们有福了"
 me_kush_62_desc:0 "经过多年的努力和无数的投资，大努比亚金字塔的建设已经完成。"
 me_kush_62_title:0 "努比亚大金字塔"
 me_kush_63.a:0 "纳帕塔是真正的福地"
 me_kush_63_desc:0 "每个库施人都知道的纳帕塔大城在我们的统治下繁荣昌盛。第25王朝的首都正式在孟菲斯，但旧时库施帝国的大部分行政职能都是在纳帕塔运作。直到公元前600年，亚述帝国在库施法老Taharqa的统治期间洗劫并摧毁了这个旧首都。现在，纳帕塔在恢复后再次成为库施文明的闪亮灯塔。"
 me_kush_63_title:0 "纳帕塔大城"
 me_kush_64.a:0 "开始庆祝活动"
 me_kush_64.b:0 "我们不需要遵循埃及的传统"
 me_kush_64_desc:0 "特赫节，又称醉酒节，是为了纪念哈托尔（醉酒女士）。根据这个故事，拉已经厌倦了人们无休止的残忍和胡闹，所以派塞赫美特去消灭他们。她满怀热情地接受了任务，把人们撕成碎片，喝他们的血。拉对毁灭感到满意，直到其他神明向他指出，如果他想给人们一个教训，他应该在没有人从中学习之前停止毁灭。然后，拉命令啤酒女神特尼特将大量的啤酒染成红色，并将其送到丹德拉，正好在塞赫美特的毁灭之路上。她发现了它，以为是血，就把它喝光了，睡着了，醒来后就变成了温柔善良的哈托尔。"
 me_kush_64_title:0 "特赫节"
 me_kush_65.a:0 "开始庆祝活动"
 me_kush_65.b:0 "我们不需要遵循埃及的传统"
 me_kush_65_desc:0 "巴斯特节是为了纪念猫神巴斯特的诞生，她是炉灶和家庭的守护者，是妇女、儿童和女性秘密的保护者。我们将通过喝酒、跳舞和制作音乐来庆祝这个女神的节日。巴斯特节是埃及最受欢迎的节日之一，通常会有来自埃及各地的数十万人参加，如果忽视这个聚会是非常不明智的......"
 me_kush_65_title:0 "巴斯特节"
 me_kush_66.a:0 "开始庆祝活动"
 me_kush_66.b:0 "我们不需要遵循埃及的传统"
 me_kush_66_desc:0 "敏是生育、阳刚和繁殖之神。在Min节开始时，成千上万的人将聚集在Min神庙。在那里，Min的雕像将由祭司抬出神庙，游行队伍中包括神圣的歌手和舞者。当他们到达法老站立的地方时，他将隆重地割下第一束谷物，以象征他与神、土地和人民之间的联系，并将谷物献给敏。这个节日既是对法老的尊敬，也是对民的尊敬，希望法老的统治能继续繁荣，给土地和人民带来丰收。"
 me_kush_66_title:0 "敏节"
 me_kush_67.a:0 "开始庆祝活动"
 me_kush_67.b:0 "我们不需要遵循埃及的传统"
 me_kush_67_desc:0 "美丽的山谷节是为了纪念死者的灵魂，让生者和死者一起庆祝，同时也是为了纪念阿蒙。阿蒙、穆特和孔苏（忒拜族三女神）的雕像将被从他们的庙宇中取出，参观河对岸的停尸庙和墓地。人们会到他们死去的亲人的坟墓前探望他们，并带来花束和食物饮料等祭品。死者的形象在游行队伍中被抬着，以便他们的灵魂可以参加庆典，并在节日结束时被留在坟墓中。"
 me_kush_67_title:0 "谷地的美丽盛宴"
 me_kush_68.a:0 "塔哈尔卡的遗产将指导我们。"
 me_kush_68_desc:0 "埃及第25王朝的第三位国王塔哈尔卡，被我们今天的许多人认为是有史以来最伟大的努比亚国王。在担任法老期间，塔哈尔卡向埃及各地的阿蒙神庙提供了大量捐赠，并加强了库施河以及尼罗河的防御。他还扩大了库施人领地的边界，将利比亚人、法尼西亚人和巴勒斯坦人包括在内。然而，经过多年的战斗，咄咄逼人的亚述帝国控制了下埃及，塔哈尔卡将被迫逃到底比斯城，并在那里死去。塔哈尔卡的金字塔今天仍然矗立在努里的圣地，作为努比亚人民力量和团结的象征。让我们效仿塔哈尔卡作为法老的成功，重新建立库施人对整个埃及的统治。"
 me_kush_68_title:0 "伟大的塔哈卡国王"
 me_kush_69.a:0 "我们的敌人将被消灭"
 me_kush_69_desc:0 "每当库施法老进行军事行动时，他们都会献上祭品，并宣称阿佩德马克的支持，以赐予他对战争结果的祝福。渴望在战斗中得到神的力量和凶猛的战士们会到他的寺庙进行神圣的朝拜。不仅如此，阿佩德马克本人偶尔也能在战场上看到身穿战甲、手持弓箭的努比亚战士。他杀死敌人，也用绳索绑住俘虏的脖子，或吞食努比亚统治者向他提供的人类祭品。"
 me_kush_69_title:0 "阿佩德玛克的祝福"
 me_kush_6_desc:0 "我们的定居者刚刚在摩叙隆登陆，我们现在有一个关键的决定要做。我们在摩叙隆的库施仆从国应该专注于发展他们的军事力量，还是应该专注于贸易和财富的积累？"
 me_kush_6_title:0 "摩叙隆的仆从"
 me_kush_7.a:0 "军事"
 me_kush_7.b:0 "公民"
 me_kush_7.c:0 "宗教信仰"
 me_kush_7.d:0 "贸易"
 me_kush_70.a:0 "一个有趣的提议"
 me_kush_70.a.tt:0 "建造#Y 特吉特之墓#!决议现在可用。#R 在30年后或特吉特死后，该决议将不再可用#!。"
 me_kush_70_desc:0 "一位名叫特吉特-马西卡的富有商人向我们法庭提出了资源请求。他打算在阿斯旺省为他和他的家人建造一座宏伟的坟墓。然而，特吉特需要法老的批准和资源来建造他的陵墓。"
 me_kush_70_title:0 "商人特吉特"
 me_kush_71.a:0 "修缮神庙"
 me_kush_71.b:0 "现在这样很好"
 me_kush_71_desc:0 "在瓦塞特建造的阿蒙神庙正处于失修状态。瓦塞特的阿蒙信徒要求法老提供资金来维修阿蒙大庙。"
 me_kush_71_title:0 "维护阿蒙神庙"
 me_kush_72.a:0 "修缮神庙"
 me_kush_72.b:0 "现在这样很好"
 me_kush_72_desc:0 "在瓦塞特建造的哈托尔神庙已经年久失修了。瓦塞特的哈托尔信徒要求法老提供资金，以修复哈托尔的大庙。"
 me_kush_72_title:0 "维护哈托尔神庙"
 me_kush_73.a:0 "军事"
 me_kush_73.b:0 "公民"
 me_kush_73.c:0 "宗教信仰"
 me_kush_73.d:0 "贸易"
 me_kush_73_desc:0 "在库施人的统治下，在昔兰尼加各城市建立的殖民地一直在繁荣发展。这些新建立的库施人殖民地应以什么为重点？"
 me_kush_73_title:0 "昔兰尼加的殖民重点"
 me_kush_74.a:0 "厄庇斯"
 me_kush_74.b:0 "宋玛戎"
 me_kush_74.c:0 "玻拉斯萨"
 me_kush_74.d:0 "阿纳克"
 me_kush_74.e:0 "阿拉巴"
 me_kush_74_desc:0 "除了进口食品，麦罗埃省几乎没有任何粮食生产。在该地区开垦土地，允许粮食生产，将使麦罗埃市成为一个繁华的大都市。"
 me_kush_74_title:0 "麦罗埃农业"
 me_kush_7_desc:0 "在库施人的统治下，在摩叙隆各城市建立的殖民地一直在繁荣发展。这些新建立的库施殖民地应该关注什么？"
 me_kush_7_title:0 "摩叙隆殖民地重点"
 memphis_religious_center:0 "埃及的宗教中心"
 memphis_religious_center_desc:0 "孟菲斯是旧王国的首都，由第一王朝的国王建造，是埃及的重要宗教中心之一。尽管在孟菲斯有许多神被崇拜，但孟菲斯的三神由普塔、他的妻子塞赫美特和他们的儿子内弗特姆组成。"

 kush_missions_task_6:0 "向蓬特推进"
 kush_missions_task_6_DESC:0 "占据连接阿克苏姆与非洲之角的荒芜沙漠对我们大有裨益——立即着手准备工作。\n\n\n\n\n\n\n\n\n\n@egypt_mil3!"
 kush_missions_task_7:0 "往南"
 kush_missions_task_7_DESC:0 "非洲之角的摩叙隆省蕴藏着巨大的财富。将其纳入库施的统治，将对我们掌控这一区域大有裨益。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 kush_missions_task_8:0 "库施的摩叙隆"
 kush_missions_task_8_DESC:0 "如何处置摩叙隆？我们面临若干选择，亟待作出决策。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 kush_missions_task_final:0 "大库施"
 kush_missions_task_final_DESC:0 "第25代埃及王朝终结于野蛮的亚述帝国之手。如今我们掌控着他们昔日的全部疆域，更兼已知世界的绝大部分。库施的辉煌将被传颂千年之久。\n\n\n\n\n\n\n\n\n\n@egypt_por1!"

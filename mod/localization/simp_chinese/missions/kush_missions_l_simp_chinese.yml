 egyptian_revolt.1.a:0 "是时候战斗了！"
 egyptian_revolt.1.b:0 "或许……我们可以支持他们的事业。"
 egyptian_revolt.1.desc:0 "当我们最初开始向埃及领土扩张时，主要担心的是外国敌人的攻击，从未想到被征服土地上的本地居民会给我们造成这么多麻烦。如今我们收到消息，底比斯祭司对当前处境不满，正在制造麻烦，声称我们没有统治黑土地的神圣权利。虽然这无疑令人恼火，但我们当然还有其他紧迫事务需要您关注。该如何处理这些多事的祭司？"

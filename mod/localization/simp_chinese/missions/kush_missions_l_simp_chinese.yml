 me_kush_23.a:0 "在#Y 阿克苏姆#! 城的小投资就可以了。"
 me_kush_23.b:0 "对#Y 阿克苏姆#! 市的大型投资是必要的。"
 me_kush_23.c:0 "我们不会在这些傻瓜身上花一毛钱!"
 me_kush_23_desc:0 "根据传统，我们所建立的仆从国必须得到其宗主的照顾和发展。如果不这样做，可能会使我们的附属国不安。帮助他们发展并建立对该地区的控制，可以在未来为我们带来巨大的财富……"
 me_kush_23_title:0 "发展阿克苏姆仆从国"
 me_kush_24.a:0 "在#Y 格瓦拉#! 城的一个小发明就可以了。"
 me_kush_24.b:0 "有必要对#Y 瓜拉#!城进行大规模投资。"
 me_kush_24.c:0 "花费我们宝贵的黄金？我想不会的。"

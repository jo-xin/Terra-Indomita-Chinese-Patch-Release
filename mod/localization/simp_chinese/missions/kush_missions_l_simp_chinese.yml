 taharqas_legacy:0 "塔哈尔卡的遗产"
 tekh_festival_mod:0 "特赫节"
 tekh_festival_mod_desc:0 "特赫节，被称为醉酒节，正在进行中——让啤酒流淌，以便塞赫美特的愤怒可以得到缓解！"
 temple_of_amun:0 "阿蒙神庙"
 temple_of_amun_desc:0 "瓦塞特是埃及境内阿蒙崇拜的中心。阿蒙是整个埃及最受尊崇的神祇之一。在本省内修建一座献给阿蒙的伟大神庙群，将是明智之举。"
 temple_of_hathor:0 "哈托尔神庙"
 temple_of_hathor_desc:0 "丹德拉是哈托尔的崇拜之城，一个专门供奉哈托尔的大型寺庙群应该建在这个城市里。"
 temple_of_hatshepsu:0 "哈特谢普苏神庙"
 temple_of_hatshepsu_desc:0 "宏伟的哈特谢普苏神庙让所有有幸凝视其奇迹的人产生敬畏之情。"
 this_will_put_us_into_debt_tt:0 "#R 采取这个方案将使[SCOPE.GetRootScope.GetCountry.GetName]陷入债务危机！#!"
 tomb_of_tjit:0 "特吉特之墓"
 tomb_of_tjit_desc:0 "一个名叫特吉特的富有商人向伟大的法老请求资源和许可，以建造一个宏伟的坟墓。在他死后，他将和他所有的财产和仆人一起埋葬在这个坟墓里。如果特吉特在获得法老的批准之前就死了，我们就会放弃这个机会，既能开发我们的土地，又能加强我们对阿斯旺人民的统治。"
 trade_client:0 "贸易仆从"
 trade_with_indika:0 "与英迪卡的贸易"
 tribute_increased:0 "贡品增加"
 walked_white_walls_of_memphis:0 "行走在孟菲斯的白墙之上"
 walked_white_walls_of_memphis_desc:0 "我们的法老坚持古老的方式，包括行走白墙，以便诸神继续向我们展示他们的面容。"

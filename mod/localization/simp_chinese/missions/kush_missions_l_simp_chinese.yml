 kush_missions_task_53:0 "人类最丰饶的土地"
 kush_missions_task_53_DESC:0 "尼罗河下游地区以极致富饶闻名于世，多少僭主曾企图将这片财富据为己有？在库施人的统治下，这片土地持续繁荣昌盛。无论近在咫尺还是远在天边，无数民众纷至沓来涌向埃及，渴望在这片传说中的土地上分得财富的机遇。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"

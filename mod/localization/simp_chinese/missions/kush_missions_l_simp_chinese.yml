 rel_flavor_kemetic.10.a:0 "购买护身符"
 rel_flavor_kemetic.10.b:0 "将它赠送给[继承人]"
 rel_flavor_kemetic.10.c:0 "[holy_man.GetName]必须为这种胡闹而死！！"
 rel_flavor_kemetic.10.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]沉迷于难得的乐趣之一是收集精美的古董和珍品，他已经形成了对古代珍品进行精细鉴定的声誉。因此，有一天，一个流浪的牧师带着要出售的文物来到了宫廷，这并不十分令人惊讶。似乎[holy_man.GetName]，一个住在南方很远的一个小神殿里的拉的牧师，做了一个梦，梦见神让他们给我们带来一个护身符，他声称这个护身符是拉本人亲自送给统一埃及的第一个王朝梅内斯的。\n\n经过一番讨价还价，达成了一百个金币的价格。"
 rel_flavor_kemetic.10.t:0 "拉的护身符"
 rel_flavor_kemetic.11.a:0 "他们不会从[SCOPE.GetRootScope.GetCountry.GetName]得到任何东西"
 rel_flavor_kemetic.11.b:0 "给他们资金以维持他们的寺庙"
 rel_flavor_kemetic.11.c:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]将访问[Temple_province.GetName]"
 rel_flavor_kemetic.11.desc:0 "尽管我们已经向当地的神职人员提出了建议，但在[神庙_省.GetName]仍有动乱，因为他们的一些领导人拒绝接受我们的主权。这是一个微妙的情况，因为我们肯定不能激怒宗教当局，但到目前为止，他们的心还没有被我们不断送去的慷慨礼物所软化。我们应该怎么做？"
 rel_flavor_kemetic.11.t:0 "[神庙省.GetName]祭司中的动乱"
 rel_flavor_kemetic.12.a:0 "这不能忍受！"
 rel_flavor_kemetic.12.b:0 "我们会让这事过去......暂时"
 rel_flavor_kemetic.12.c:0 "也许我是一个糟糕的统治者......"
 rel_flavor_kemetic.12.desc:0 "我们收到了令人不安的报告，说有一个文士，由于我们的慷慨而受教育并被提升到他的位置，他一直在以我们的名义写关于神的无耻诗篇。我们……不愿意分享这些肮脏的细节，因为我们的谦虚使我们不能在你面前羞辱自己，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。但我们不能让这个粗俗的文士继续用他的污秽污染民众——人们在抱怨我们允许这种情况发生。"
 rel_flavor_kemetic.12.t:0 "亵渎神明的文士"
 rel_flavor_kemetic.13.a:0 "派军队来维持秩序"
 rel_flavor_kemetic.13.b:0 "我们会让这件事过去......现在"
 rel_flavor_kemetic.13.desc:0 "在[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的[temple_province.GetName]神庙发生了暴乱。通常情况下，我们会向人们提供啤酒和面包等礼物，我们很乐意承担这个负担，但[temple_province.GetName]附近的祭司声称，农民们闯入仓库，助纣为虐，甚至还杀死了一名试图阻止暴徒的祭司。虽然他们的经济状况是我们所发动的战争的不幸后果，但我们不能允许乡亲们像普通的小偷一样行事--应该采取一些措施。"
 rel_flavor_kemetic.13.t:0 "[temple_province.GetName]的寺庙出现麻烦"
 rel_flavor_kemetic.14.a:0 "现在是采取行动的时候了，伊斯法特决不能得逞！"
 rel_flavor_kemetic.14.b:0 "让他们去吧......应该没问题"
 rel_flavor_kemetic.14.c:0 "[bad_guy.GetName]不会再活一天了"
 rel_flavor_kemetic.14.desc:0 "有传言说，有一个[bad_guy.GetName]，一个叛逆的牧师，声称说出了诸神的真正意愿，一直在沙漠中预言，向所有停下来听他背诵的人散布谎言。[bad_guy.GetName]声称，审判时刻即将到来，只有当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的军队被投向遗忘的地方，Maat才会被恢复。我们显然对这个消息非常不满，不应该容忍这种情况。"
 rel_flavor_kemetic.14.t:0 "[bad_guy.GetName]挑战Maat"
 rel_flavor_kemetic.15.a:0 "[da_deity.GetName]很好！"
 rel_flavor_kemetic.15.b:0 "把资金转给国家"
 rel_flavor_kemetic.15.desc:0 "给你一个罕见的好消息，我的主人--不亚于一个奇迹。众神对我们以及我们在[deity_holy_site.GetName]附近所做的善事很感兴趣。一天晚上，祭司离开了神庙，但当他们早上回来时，发现雕像底部有满满一篮子的硬币；似乎众神真的给了我们一份礼物。我们该如何对待这份赏赐？"
 rel_flavor_kemetic.15.t:0 "[da_deity.GetName] 祝福[deity_holy_site.GetName]"
 rel_flavor_kemetic.16.a:0 "我们无能为力"
 rel_flavor_kemetic.16.b:0 "没收控股权"
 rel_flavor_kemetic.16.desc:0 "[holy_site_owner.GetName]正在开发[deity_holy_site.GetName]的领地，可能比我们希望的要重。如果这种情况继续下去，[da_deity.GetName]肯定会不高兴的。如你所知，诀窍是在不太接近皮肤的情况下剪掉羊。"
 rel_flavor_kemetic.16.t:0 "[deity_holy_site.GetName]有麻烦了"
 rel_flavor_kemetic.17.a:0 "[commerce_province.GetName]会很好！"
 rel_flavor_kemetic.17.b:0 "他们必须为国家贡献自己的力量"
 rel_flavor_kemetic.17.c:0 "对[商业_省.GetName]进行更多投资"
 rel_flavor_kemetic.17.desc:0 "最新的财务报告已经出来了，看来我们在[commercial_province.GetName]有盈余--很难相信，我知道。我们应该如何处理这笔意外的意外之财？我们当然可以重新投资于我们在埃及的资产，但我们也可以直接把利润装进口袋......正确的行动方案还不清楚。"
 rel_flavor_kemetic.17.t:0 "埃及的投资"
 rel_flavor_kemetic.18.a:0 "送更多的供品"
 rel_flavor_kemetic.18.b:0 "让我们亲自去收集什一税"
 rel_flavor_kemetic.18.c:0 "这些都没有必要"
 rel_flavor_kemetic.18.desc:0 "众所周知，在[神庙_圣地.GetName]的崇拜者用金钱礼物来表示他们的虔诚，这导致了当地国库的膨胀。对我们来说，参与这一传统是一件很简单的事情，送几个硬币作为善意的表示，但我们也可以亲自去看看，看看他们积累了多少财富......我们自己不也欠一点吗？照顾这些寺庙并不便宜。"
 rel_flavor_kemetic.18.t:0 "为[神明_圣地.GetName]提供祭品"
 rel_flavor_kemetic.19.a:0 "派部队去修复寺庙"
 rel_flavor_kemetic.19.b:0 "呃......没人在乎，尤其是我"
 rel_flavor_kemetic.19.desc:0 "我们收到了来自哈特谢普苏神庙的信使，他们警告说，该遗址的状况很糟糕。一块块砖石从天花板上掉下来，砸死了一个当地的崇拜者，沙漠中的沙子聚集在纪念碑周围，威胁着要永远埋葬它们。要将寺庙恢复到它曾经的样子，需要大量的硬币和人力，但也确实有很多人放弃了这个地区，认为它最好的日子早已过去。这一切是否值得花费？这是我们所面临的问题。"
 rel_flavor_kemetic.19.t:0 "哈特谢普苏神庙的麻烦"
 rel_flavor_kemetic.20.a:0 "什么都不做，但要让他们知道我很不高兴"
 rel_flavor_kemetic.20.b:0 "现在就停止这一切，不惜一切代价！"
 rel_flavor_kemetic.20.desc:0 "当我们刚开始向埃及领土扩张时，我们主要关注的是来自外敌的攻击，从未想到被征服土地上的当地居民会像他们一样让人头痛。现在我们收到消息，底比斯的祭司们对他们的现状不满，一直在制造麻烦；说我们没有统治黑土地的神圣权利。虽然这无疑是令人讨厌的，但我们当然有其他紧迫的事情需要你的关注。应如何处理这些爱管闲事的祭司？"
 rel_flavor_kemetic.20.t:0 "底比斯的祭司们"
 rel_flavor_kemetic.21.a:0 "该战斗了！"
 rel_flavor_kemetic.21.desc:0 "可恶的命运！那些来自底比斯的麻烦的牧师们已经宣布独立了!他们卖掉了神庙里所有的宗教物品，并用这些资金组建了一支军队，声称诸神会因为我们的亵渎行为而惩罚我们。沙漠中的沙子将被这些叛徒的血染红！"
 rel_flavor_kemetic.21.t:0 "祭司国王宣布独立！"
 rel_flavor_kemetic.22.a:0 "赞美阿皮斯公牛！"
 rel_flavor_kemetic.22.desc:0 "你不会相信来自南方的消息，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]!似乎众神正在回到埃及的土地上，因为阿皮斯公牛在几代人中第一次被发现。一群大祭司已经完成了对公牛的检查，确认这头宏伟的野兽确实是阿庇斯牛；所有的标记都存在，包括它额头上的一个白色三角形，两侧有两个月牙。阿皮斯牛所到之处，信徒们都跪倒在地，喜极而泣，赞美神灵的仁慈--神灵的恩惠已经展现在我们面前！"
 rel_flavor_kemetic.22.t:0 "阿皮斯公牛已被发现！"
 rel_flavor_kemetic.23.a:0 "如此美丽的公牛"
 rel_flavor_kemetic.23.b:0 "用礼物洒向神庙"
 rel_flavor_kemetic.23.c:0 "吃掉阿皮斯牛！？"
 rel_flavor_kemetic.23.desc:0 "一天早上，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定去阿皮斯牛居住的寺庙，希望能与这个神圣的生物共处。公牛居住的房间里总是有一种宁静的气氛，侍者们挥舞着大扇子，让空气在圣殿里循环，而乐师则在竖琴上轻轻地弹奏。阿皮斯公牛正四肢着地，吃着女奴手中的枣子，它慢慢转过身来，承认[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的存在，微微低下头。"
 rel_flavor_kemetic.23.t:0 "阿皮斯公牛鼓舞了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]"
 rel_flavor_kemetic.24.a:0 "尽我们所能来治愈公牛"
 rel_flavor_kemetic.24.b:0 "为它的健康祈祷就够了"
 rel_flavor_kemetic.24.c:0 "阿皮斯公牛看起来非常美味！"
 rel_flavor_kemetic.24.desc:0 "我们从照料阿皮斯公牛的牧师那里收到了令人不安的消息。这只动物拒绝喝水，也不愿意吃东西，即使提供给它最喜欢的零食。我们的祭司已经献上了祭品，请求神灵治愈这头野兽，但我们的祈祷至今没有得到回应。我们应该怎么做？如果公牛在我们负责照顾它的时候死去，那将是一件可怕的事情。"
 rel_flavor_kemetic.24.t:0 "阿皮斯公牛生病了"
 rel_flavor_kemetic.25.a:0 "我们必须找到一个新的公牛！"
 rel_flavor_kemetic.25.b:0 "让这个传统消亡"
 rel_flavor_kemetic.25.desc:0 "在半夜里，令人不安的梦来到了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。在沙漠的漩涡中，矗立着一座伟大的神庙，它的大金门上贴满了封条和诅咒，使[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]脖子上的头发都竖了起来。突然，一声巨大的雷鸣，门从铰链上掉了下来，一股蝗虫从门缝中迸发出来，完全充满了天空，遮住了太阳的光芒。\n\n尖叫声中，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]猛然惊醒，只见两个祭司站在王室寝宫里，脸色低沉。'我们很抱歉打扰了你，但你必须知道......阿皮斯公牛已经死了。"
 rel_flavor_kemetic.25.t:0 "阿皮斯公牛已经死了！"
 rel_flavor_kemetic.26.a:0 "新的阿皮斯牛被发现了！"
 rel_flavor_kemetic.26.b:0 "没有发现阿皮斯牛"
 rel_flavor_kemetic.26.t:0 "搜索结束"
 rel_flavor_kemetic.27.a:0 "走城墙"
 rel_flavor_kemetic.27.b:0 "你在和我开玩笑，对吗？这是不可能发生的"
 rel_flavor_kemetic.27.desc:0 "许多年前，神话中的国王美尼斯建立了孟菲斯的白墙，作为整个埃及的中央政府所在地。在我们之前，几乎每个法老都完成了绕行白墙的仪式。这需要几天的时间，我们必须准备一个昂贵的绕行孟菲斯城的仪式队伍。进行绕行将增强新法老的王位权。"
 rel_flavor_kemetic.27.t:0 "绕过白墙"
 rel_flavor_kemetic.28.a:0 "开始盛宴"
 rel_flavor_kemetic.28.b:0 "我不会熬夜的--我有事情要做"
 rel_flavor_kemetic.28.desc:0 "在索卡节的前一天晚上，将举行包括在亲人的坟墓前通宵守夜的纪念活动。它被称为 Notjeryt之夜，也被称为 系洋葱之日，埃及人会系上洋葱的花环，穿在身上并献给死者。索卡节的重要性来自于它与古代冥界之神奥西里斯的重要性，以及他与孟菲斯的古老力量的联系。"
 rel_flavor_kemetic.28.t:0 "索卡节"
 rel_flavor_kemetic.29.a:0 "开始节日"
 rel_flavor_kemetic.29.b:0 "这些埃及人到底有多少毫无价值的传统？"
 rel_flavor_kemetic.29.desc:0 "一个非常重要的仪式，赛德节，象征着再生，是为了保证法老来世的长期统治。仪式的目的是在国王生病或只是年老的情况下，使国王与宇宙之间恢复和谐。在节日过程中，祭司将带领国王进入两个亭子，在那里他将接受上埃及和下埃及的冠冕，象征性地重新举行加冕仪式。在盛大的塞德节之后，所有在场的人都将分享奢华的食物、饮料、音乐和舞蹈。"
 rel_flavor_kemetic.29.t:0 "赛德节"
 rel_flavor_kemetic.30.a:0 "开始庆祝活动"
 rel_flavor_kemetic.30.b:0 "阿蒙不会介意我们休息一年的"
 rel_flavor_kemetic.30.desc:0 "伟大的奥佩特节即将开始，它将像多年来一样，在圣城底比斯举行。底比斯市民和他们来自远方的客人庆祝他们的法老和全能的神，阿蒙之间的丰硕联系。人们将与法老一起参加纪念阿蒙的戏剧性游行，游行将从卡纳克的阿蒙神庙开始，在城市南端一英里半外的卢克索神庙结束。"
 rel_flavor_kemetic.30.t:0 "奥佩特节"
 rel_flavor_kemetic.31.a:0 "开始庆祝活动"
 rel_flavor_kemetic.31.b:0 "我不会花钱让暴民喝醉；对不起"
 rel_flavor_kemetic.31.desc:0 "特赫节 也被称为 醉酒节，是为了纪念醉酒女士哈托尔的。根据这个故事，拉已经厌倦了人们无休止的残忍和胡闹，所以派塞赫美特去消灭他们。她满怀热情地接受了任务，把人们撕成碎片，喝他们的血。拉对毁灭感到满意，直到其他神明向他指出，如果他想给人们一个教训，他应该在没有人从中学习之前停止毁灭。然后，拉命令啤酒女神特尼特将大量的啤酒染成红色，并将其送到丹德拉，正好在塞赫美特的毁灭之路上。她发现了它，以为是血，就把它喝光了，睡着了，醒来时就变成了温柔善良的哈托尔。"
 rel_flavor_kemetic.31.t:0 "特赫节"
 rel_flavor_kemetic.32.a:0 "开始庆祝活动"
 rel_flavor_kemetic.32.b:0 "现在不行；我们有太多的事情发生"
 rel_flavor_kemetic.32.desc:0 "巴斯特节是为了纪念猫神巴斯特的诞生，她是炉灶和家庭的守护者，是妇女、儿童和女性秘密的保护者。我们将通过喝酒、跳舞和制作音乐来庆祝这个女神的节日。巴斯特节是埃及最受欢迎的节日之一；通常，来自埃及各地的数十万人会参加。忽视这次聚会是非常不明智的......"
 rel_flavor_kemetic.32.t:0 "巴斯特节"
 rel_flavor_kemetic.33.a:0 "开始庆祝活动"
 rel_flavor_kemetic.33.b:0 "我们最近刚过了一个节日......够了！"
 rel_flavor_kemetic.33.desc:0 "Min是生育、阳刚和繁殖之神。在民俗节开始时，成千上万的人将聚集在民俗庙里。在那里，Min的雕像将由祭司抬出寺庙，游行队伍中包括神圣的歌手和舞者。当他们到达法老站立的地方时，他将隆重地割下第一束谷物，以象征他与神、土地和人民之间的联系，并将谷物献给敏。这个节日既是对法老的敬意，也是对民的敬意，希望法老的统治持续繁荣，给土地和人民带来丰收。"
 rel_flavor_kemetic.33.t:0 "敏节"
 rel_flavor_kemetic.34.a:0 "开始庆祝活动"
 rel_flavor_kemetic.34.b:0 "通知人们，节日被取消了"
 rel_flavor_kemetic.34.desc:0 "美丽的山谷盛宴 是为了纪念逝者的灵魂，让生者和死者一起庆祝，同时也是为了纪念阿蒙。阿蒙、穆特和孔苏（忒拜族三女神）的雕像将从他们的庙宇中取出来，参观河对岸的停尸庙和墓园。人们会到他们死去的亲人的坟墓前探望他们，并带来花束和食物饮料等祭品。死者的形象在游行队伍中被抬着，以便他们的灵魂可以参加庆典，并在节日结束后被留在墓穴中。"
 rel_flavor_kemetic.34.t:0 "山谷的美丽盛宴"
 rel_flavor_kemetic.35.a:0 "[pyramid_province_1.GetName]显然是最佳选择"
 rel_flavor_kemetic.35.b:0 "[金字塔省_2.GetName]是一个建造金字塔的好地方"
 rel_flavor_kemetic.35.c:0 "[pyramid_province_3.GetName]很好"
 rel_flavor_kemetic.35.d:0 "[金字塔省_4.GetName]就可以了"
 rel_flavor_kemetic.35.desc:0 "几天前，[pyramid_builder.GetName]来到[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，要求觐见[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。看来[pyramid_builder.GetName]是一位建筑大师，他不仅熟悉我们周围的伟大城市和帝国的建筑风格，而且非常熟悉我们自己受人尊敬的传统；是一位真正的建筑学者。有人建议我们出资建造一座新的金字塔，以我们的祖先的方式，作为宣扬我们作为统治者的价值的一种方式。\n\n这自然会很昂贵，但[pyramid_builder.GetName]的话是有道理的......"
 rel_flavor_kemetic.35.e:0 "我们不需要建造金字塔！"
 rel_flavor_kemetic.35.f:0 "真是个糟糕的主意；立即杀了这个人！！"
 rel_flavor_kemetic.35.t:0 "一个盛大的提议"
 rel_flavor_kemetic.36.a:0 "木材和石头显然是最好的选择"
 rel_flavor_kemetic.36.b:0 "大理石和银将是精美的"
 rel_flavor_kemetic.36.c:0 "乌木和象牙，是我们的人民所喜爱的，应该被使用"
 rel_flavor_kemetic.36.d:0 "全金的金字塔是[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的唯一选择"
 rel_flavor_kemetic.36.desc:0 "[pyramid_builder.GetName]在工地上提出了许多可用于建造大金字塔的优良材料，从他们的个人工作室带来了样品，以便我们决定使用什么。虽然这无疑是令人兴奋的，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]大声问道：这项工作将多么严重地消耗我们的财力。"
 rel_flavor_kemetic.36.e:0 "也许这并不是一个好主意"
 rel_flavor_kemetic.36.t:0 "金字塔材料"
 rel_flavor_kemetic.38.a:0 "替换损失的材料"
 rel_flavor_kemetic.38.b:0 "无能为力"
 rel_flavor_kemetic.38.desc:0 "我……我不知道这是怎么发生的。按照你的吩咐，我们用最好的金、银、象牙和木材装了十艘驳船，以确保法老啊，你吩咐建造的金字塔能被诸神接受。但这些船在前往建筑工地的路上消失了；是海盗行为的受害者还是一场灾难性的事故，没人知道。最后一次有人看到他们的时候，这些船已经接近了[coastal_province.GetName]。我真的很遗憾地报告此事。"
 rel_flavor_kemetic.38.t:0 "材料放错地方了"
 rel_flavor_kemetic.39.a:0 "增加他们的工资应该能提高士气"
 rel_flavor_kemetic.39.b:0 "强迫这些傻瓜工作！鞭打这些狗"
 rel_flavor_kemetic.39.c:0 "金字塔完成后就会完成..."
 rel_flavor_kemetic.39.desc:0 "你已经收到了你的首席建筑师的报告，描述了正在进行的金字塔建设，你对你所读到的内容非常不满意。似乎工人们一直在抱怨任何事情，热气逼人，我们想念我们的家人，食物很糟糕......令人恼火！。你们已经超出了预期，这就是你们得到的回报！。有人温和地建议，我们可以在工人的营地周围撒一些硬币，以努力提高他们的精神。"
 rel_flavor_kemetic.39.t:0 "没有灵感的工人"
 rel_flavor_kemetic.40.a:0 "发送资金，帮助偿还建筑商的费用"
 rel_flavor_kemetic.40.b:0 "派遣军队以加强安全"
 rel_flavor_kemetic.40.c:0 "反正金字塔最终会完成"
 rel_flavor_kemetic.40.desc:0 "尽管我们有严格的安保措施，警察对工地进行了全天候的监控，但我们了解到，一些用于建造金字塔的原材料已经被盗。我们已经询问了负责管理货物的当地监督员，甚至敲打他们的脚底，试图了解真相，但没有人声称知道任何事情--典型的。在工程师们等待更多材料到来的时候，工作已经放缓了。"
 rel_flavor_kemetic.40.t:0 "偷窃和破坏"
 rel_flavor_kemetic.41.a:0 "大金字塔将屹立数千年！"
 rel_flavor_kemetic.41.desc:0 "准备工作早在太阳从沙漠上空升起之前就开始了，当金色圆盘终于将光芒投射到我们沉睡的城市时，迎接它的是三千名奴隶列队站立的景象，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在他们面前主持一个高台。一个信号发出后，空气被一千个小号的声音分割开来，齐声发出尖锐的叫声。很快，诵经声开始了，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]走向新建的大金字塔的入口，后面跟着随从和仆人。站在门口前，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]转身面对众人，现场一片寂静；再过一会儿，仪式就要开始了。\n\n真奇怪，能见证一个活生生的神的诞生……"
 rel_flavor_kemetic.41.t:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的大金字塔"
 rel_flavor_kemetic.42.a:0 "[GetDeityDefinition('omen_sobek').GetName]已经保佑了我们！"
 rel_flavor_kemetic.42.desc:0 "令人难以置信的消息!一条十英尺长的白色鳄鱼出现在[GetProvince('(int32)539').GetName]的中心。许多当地人认为这就是[GetDeityDefinition('Omen_sobek').GetName]本人。当地的祭司们查阅了他们的卷轴，翻阅了档案，希望能发现索贝克最后一次以这种方式显露自己，但到目前为止，他们的努力毫无结果。白鳄的回归一定意味着众神已经保佑了我们的房子；我们必须进行供奉，以表达我们的感激之情。"
 rel_flavor_kemetic.42.t:0 "鳄城的白鳄鱼"
 rel_flavor_kemetic.46.a:0 "奥西里斯将引导我们"
 rel_flavor_kemetic.46.b:0 "伊希斯知道道路"
 rel_flavor_kemetic.46.c:0 "阿蒙知道一切"
 rel_flavor_kemetic.46.d:0 "塞特会消灭我们的敌人"
 rel_flavor_kemetic.46.desc:0 "虽然战争是不可取的，但我们的人民并不是独自走向战场；不，我们的战斗人员总是由神灵陪伴，他们在战斗中引导我们的双手，将我们的敌人送入坟墓。我们应该向谁献上神圣的酒和粮食祭品？肥美的小牛已经准备好被宰杀了。"
 rel_flavor_kemetic.46.e:0 "我们不需要众神来摧毁[战争敌人.GetName]"
 rel_flavor_kemetic.46.t:0 "神的帮助"
 rel_flavor_kemetic.47.a:0 "他将加入我们的宫廷。"
 rel_flavor_kemetic.47.b:0 "一个鼓舞人心的人，让我们的士兵仰望。"
 rel_flavor_kemetic.47.desc:0 "我们的一个士兵有一个被战神亲自祝福的人的名声，他战斗的狂热程度与其他任何人都不同。我们的一些其他士兵质疑，为什么他在战争中做了那么多英雄事迹之后还没有得到晋升，而其他人则把他当作某种半神。"
 rel_flavor_kemetic.47.t:0 "[ROOT.GetCountry.Custom('get_war_god')]的人"
 rel_flavor_kemetic.48.a:0 "我们将受到神的启发，并充分利用这个机会。"
 rel_flavor_kemetic.48.b:0 "感谢[ROOT.GetCountry.Custom('get_commerce_god')]是有必要的。"
 rel_flavor_kemetic.48.desc:0 "[SCOPE.sP('randomized_country_province').GetName]最近有大量来自远方的商人和旅行者涌入。我们的一个顾问开玩笑地说，我们一定是受到了[ROOT.GetCountry.Custom('get_commerce_god')]本人的祝福。\n\n这可能是个玩笑，但向神明缴纳会费可能还是个好主意。这只能是对长期业务的促进，对吗？"
 rel_flavor_kemetic.48.t:0 "被[ROOT.GetCountry.Custom('get_commerce_god')]打动"
 rel_flavor_kemetic.49.a:0 "我们应该鼓励这些皈依者。"
 rel_flavor_kemetic.49.b:0 "他们会及时转向的。"
 rel_flavor_kemetic.49.desc:0 "那些与我们有类似信仰的人，特别是希腊人和阿拉伯人，有一种倾向，即比我们的许多其他对象更容易接受我们的信仰。似乎他们把我们的神和万神殿与他们自己的一些神等同起来，使转变信仰更容易。\n\n在我们的[SCOPE.sCharacter('random_priest').GetOffice.GetCulturalName(ROOT.GetCountry)][SCOPE.sCharacter('random_priest').GetName]访问了[SCOPE.sP('country_province').GetState.GetShortName]，[SCOPE.sP('country_province').GetName]的[country_province.Custom('get_city_type_loc')]，我们看到有一大群人皈依我们的信仰。我们是否应该派[SCOPE.sCharacter('random_priest').GetFirstName]再去一趟该城市？"
 rel_flavor_kemetic.49.t:0 "埃及多神教"
 rel_flavor_kemetic.50.a:0 "请与我们分享你的智慧。"
 rel_flavor_kemetic.50.b:0 "我们会找到自己的道路。"
 rel_flavor_kemetic.50.desc:0 "尽管[ROOT.GetCountry.GetRuler.GetSheHe]很虔诚，我们的领袖[ROOT.GetCountry.GetRuler.GetName]知道有改进的途径，并一直在寻求[SCOPE.sCharacter('random_advisor').GetName]和祭司的建议。虽然他们的教诲是善意的，但如果[ROOT.GetCountry.GetRuler.GetSheHe]遵循他们的每一个想法，[ROOT.GetCountry.GetRuler.GetFirstName]肯定会失去[ROOT.GetCountry.GetRuler.GetHerHis]对团体的权威。"
 rel_flavor_kemetic.50.t:0 "由奥西里斯"
 rel_flavor_kemetic.51.a:0 "他们会及时转向拉，所以没必要浪费我们的资源。"
 rel_flavor_kemetic.51.b:0 "是的，让我们更好地了解这个人。"
 rel_flavor_kemetic.51.desc:0 "在[SCOPE.sP('country_province').GetName]的[country_province.Custom('get_city_type_loc')]，[SCOPE.sP('country_province').GetState.GetShortName]，长期以来一直有一个希腊人社区。在后来的几年里，他们更多地受到城市中[ROOT.GetCountry.GetReligion.GetName]的影响，现在有一位来自社区本身的发言人站出来，要把这两个群体彻底地团结起来。\n\n这位富有魅力且年轻的男子已经说服了社区中大量的人改变宗教信仰。有了一些支持，他可能能够隐蔽整个地区，[ROOT.GetCountry.GetReligion.GetName]，尽管那样会把他和我们的领导层联系起来。"
 rel_flavor_kemetic.51.t:0 "希腊人的代言人"
 rel_flavor_kemetic.6.a:0 "农民们总是会抱怨"
 rel_flavor_kemetic.6.b:0 "一些钱应该改变他们的想法"
 rel_flavor_kemetic.6.desc:0 "我们国家的农民一直在抱怨生活条件差。一些谣言甚至到处流传，声称玛特在我们的王国不再被维护，伊斯法特现在是国家的法律。应如何处理这群愚蠢的农民乌合之众？"
 rel_flavor_kemetic.6.t:0 "问题的酝酿"
 rel_flavor_kemetic.7.a:0 "玛特诅咒了我们！"
 rel_flavor_kemetic.7.desc:0 "多年前，帕提加省内那些乌合的农民暴民，如今已演变成真正令人恐惧的力量……我们的统治者未能履行在整个土地上维护“玛阿特”的神圣职责，如今，“伊斯法特”——混乱与毁灭的化身——已兵临城下。"
 rel_flavor_kemetic.7.t:0 "马特的诅咒"
 rel_flavor_kemetic.8.a:0 "神秘主义者将向国王传授他的方法。"
 rel_flavor_kemetic.8.b:0 "让他留在[country_province.GetName]中"
 rel_flavor_kemetic.8.desc:0 "在[country_province.GetName]找到了一位当地的神秘主义者！他的教义数十年来一直引导着当地人民走向繁荣。也许他应该被邀请到王宫与国王呆在一起。"
 rel_flavor_kemetic.8.t:0 "一个神秘主义者被发现了"
 rel_flavor_kemetic.9.a:0 "举办节日"
 rel_flavor_kemetic.9.b:0 "我们不会在这些傻瓜身上花一毛钱的!"
 rel_flavor_kemetic.9.desc_1:0 "聆听祈祷的阿蒙-拉，听到穷人和苦难者的哭声就会来......要小心他！他是一个很好的例子。向儿子和女儿、大人物和小人物重复他；向尚未出现的一代又一代的人讲述他；向深海中的鱼、天上的鸟讲述他；向不认识他的人和认识他的人重复他……虽然仆人做错事是正常的，但主的仁慈是正常的。底比斯的主不会一整天都在生气。至于他的愤怒--在完成的一瞬间，没有任何残余……举行全国性的节日来纪念伟大的阿蒙，是大祭司的建议。"
 rel_flavor_kemetic.9.desc_2:0 "奥西里斯是凯美迪宗教中的生育、农业、来世、死者、复活、生命和植物之神。他被描绘成一个绿色皮肤的神，留着法老的胡须，两腿部分裹着木乃伊，戴着独特的阿特夫冠，拿着象征性的弯刀和连枷。纪念奥西里斯的全国性庆典应该在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]举行。"
 rel_flavor_kemetic.9.desc_3:0 "金字塔文本以不同的角色描述法老的性质，既是荷鲁斯又是奥西里斯。生前作为荷鲁斯的法老在死后成为作为奥西里斯的法老，在那里他与其他神灵结合在一起。荷鲁斯的新化身以新法老的形式在地球上继承了已故法老的地位。我们应该以荷鲁斯的名义举行盛大的宗教节日来纪念伟大法老的一生。"
 rel_flavor_kemetic.9.desc_4:0 "太阳是生命的赐予者，控制着人类所耕种的作物的成熟。由于太阳的生命品质，埃及人把太阳当作拉神来崇拜。为拉举行全国性的宗教节日将确保我们在未来几年的繁荣。"
 rel_flavor_kemetic.9.t:0 "国家宗教节日"

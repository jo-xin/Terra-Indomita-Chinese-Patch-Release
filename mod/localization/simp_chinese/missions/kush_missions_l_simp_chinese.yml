 apedemak_blessing:0 "阿佩德马克的祝福"
 apedemaks_blessing:0 "寻求阿佩德玛克的庇佑"
 apedemaks_blessing_desc:0 "阿佩德马克经常被描绘成一个狮头神，其主要职责是在战争中保护努比亚人民免遭敌人的攻击。几个世纪以来，库施国王都在寺庙里供奉，并宣称得到阿佩德马克的支持。在阿佩德马克的保佑下，库施人不可能在战斗中失败!"
 apis_bull_found_desc:0 "今天早上我们有一个令人兴奋的消息要与你分享，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]；众神并没有转过脸去，而是继续向我们的人民照耀他们的面容。又发现了一头阿皮斯公牛，这头公牛与刚刚死去的有一拼。\n\n你已经看到了这头公牛，对它的完美感到惊讶；真的，诸神对我们的祝福远远超过了我们应得的。"
 apis_bull_not_found_desc:0 "尽管我们不惜代价，从净化仪式到为皇家搜索队配备金钱所能买到的最好的装备，但我们的侦察员却空手而归。他们从上到下搜索了这片土地，却无法找到另一头阿皮斯牛......我们不敢考虑这对我们的未来意味着什么。"
 apis_bull_of_memphis:0 "孟菲斯的阿皮斯公牛"
 apis_bull_of_memphis_desc:0 "阿皮斯公牛已经显露出来，并在我们的人民中行走。"

 kush_missions_task_56:0 "发展阿克苏姆"
 kush_missions_task_56_DESC:0 "我们如今已如此富庶强大，对我们而言，修缮阿克苏姆也不过是举手之劳。让我们重新投资这些古老的土地，让库施的威望日益彰显。"

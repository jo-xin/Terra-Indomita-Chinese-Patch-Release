 me_kush_13.c:0 "建立一个殖民地"
 me_kush_13.d:0 "我们无法承受这种无稽之谈"
 me_kush_13_desc:0 "派遣大批库施人前往阿拉伯福地的荒地建立繁荣城市，虽能为我们带来巨大财富，但也需国家出资支持初期的扩张。我们该如何抉择？\n\n（自1年到3年内，将为该区域的所有殖民地选择殖民地的专攻方向）"
 me_kush_13_title:0 "在阿拉伯福地的库施殖民地"
 me_kush_14.a:0 "建立五个殖民地"
 me_kush_14.b:0 "建立三个殖民地"
 me_kush_14.c:0 "建立一个殖民地"
 me_kush_14.d:0 "我们无法承受这种无稽之谈"
 me_kush_14_desc:0 "如你所知，派遣大批库施人前往阿拉伯的不毛之地，虽然投入必定不菲，但同样也物有所值。\n\n（自1年到3年内，将为该区域的所有殖民地选择殖民地的专攻方向）"
 me_kush_14_title:0 "在阿拉伯的库施殖民地"
 me_kush_15.a:0 "建立五个殖民地"
 me_kush_15.b:0 "建立三个殖民地"
 me_kush_15.c:0 "建立一个殖民地"
 me_kush_15.d:0 "我们无法承受这种无稽之谈"
 me_kush_15_desc:0 "吾等是否应考虑向昔兰尼加派遣殖民者？若能把握当地蓬勃的罗盘草贸易，终将为我带来惊人财富。\n\n（该地区所有殖民地的专精类型将于1至3年内选定。）"

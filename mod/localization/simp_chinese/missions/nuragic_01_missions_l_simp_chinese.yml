l_simp_chinese:
 desc_giants_of_tarshish:0 "一座古老的撒丁人建造的纪念性墓群，后被迦太基入侵者摧毁，现已重建至其古代辉煌。墓群由努拉盖和唤起神圣符号的图腾环绕，建筑群中心以一条雕像甬道收尾，描绘着战士、弓箭手和拳击手，均大于真人尺寸，高约2.5至2.7米。雕像由当地砂岩制成，工艺精湛，展现了非凡的细节关注。它们具有独特的艺术特征，如复杂的盔甲、头盔和精细的面部表情。所有努拉吉克人民聚集于此，以纪念他们古老的英雄。"
 desc_new_capital_sardinia:0 "撒丁人的首都以其建筑奇观巍然耸立，灵感来自标志性的努拉格塔楼，点缀着城市景观。这些高耸的石结构向努拉吉克人的智慧致敬，同时作为智慧和文化认同的灯塔。"
 desc_nuraghe_network:0 "Nuraghes，我们聪明的祖先所建立的防御系统，仍然是我们人民力量的来源。"
 desc_nuragic_archers:0 "我们的部落成员用弓箭是致命的，这是我们在战场上磨练出来的技能。"
 desc_nuragic_farm:0 "我们的农民是他们工艺的大师，绝对不浪费任何东西，并利用每一块可利用的土地。"
 desc_nuragic_fortifications:0 "考虑到我们来自多山的地形，我们擅长建造防御工事，让人联想到我们的自然防御。"
 desc_nuragic_power:0 "整个世界都惊叹于英勇的努拉吉克部落不畏艰险战胜外敌的故事。"
 desc_nuragic_sacrifice:0 "将无辜的灵魂献给战神，他们会在战斗中保佑我们。"
 desc_nuragic_scouts:0 "我们的人对土地的布局非常熟悉，这是战争时期的福音。我们的侦察员正在监视我们敌人的营地，并会在进攻的时候向我们提供建议。"
 desc_sardinian_grain:0 "由于特殊的土壤成分、温和的气候以及特定小麦品种与广泛灌溉网络的结合使用，撒丁岛平原以更高的土地产量而闻名。"
 desc_sardinian_lead:0 "撒丁岛的山脉蕴藏着大量的金属。撒丁人自文明诞生以来就开采这些矿脉，成为熟练的金属工匠和商人。撒丁的铜、银和铅锭已抵达地中海各地，东至犹太海岸，西至伊比利亚海岸及更远——甚至到达北海的高蒂亚海岸线。"
 desc_sardinian_silver:0 "自古以来，岛屿西南角的矿山以其巨大的矿藏量而闻名——富含稀有金属。如此惊人的自然财富使撒丁岛获得了银脉之岛的名称。"
 desc_shorn_sheep:0 "迦太基人虽无权如此，他们却窃取我们土地的丰饶果实——从矿脉到伊奥利安平原的丰饶产物，这实属是暴行！"
 desc_taphros_strait:0 "撒丁岛与科西嘉岛之间的狭窄海峡为伊比利亚、高卢和意大利半岛之间提供了更快的贸易路线。"
 giants_of_tarshish:0 "他施巨人像"
 me_nuragic_01_inv.10.a:0 "不要放过他们的眼泪；这是他们应得的。把它全部烧掉！"
 me_nuragic_01_inv.10.b:0 "我已经改变主意了--告诉他们放过这座城市"
 me_nuragic_01_inv.11.a:0 "我在这里设想了一个未来......"
 me_nuragic_01_inv.12.a:0 "这一天真正标志着我们故事的开端"
 me_nuragic_01_inv.13.a:0 "你说，一支海军？这当然是意想不到的"
 me_nuragic_01_inv.14.a:0 "通过各种手段，在这里建立你们自己--我们都将从这种安排中获益"
 me_nuragic_01_inv.15.a:0 "我，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，不能再忍受了......"
 me_nuragic_01_inv.16.a:0 "我们在黎明时分启程前往马戈！准备好我们的船！准备好我们的船！"
 me_nuragic_01_inv.16.b:0 "暂缓我们的宣称——我们将在预兆有利的时候出航"
 me_nuragic_01_inv.17.a:0 "矿山是对这片土地更明智的利用——他们当时在想什么？"
 me_nuragic_01_inv.18.a:0 "相信我，我是在考虑长远……要有信心！"
 me_nuragic_01_inv.19.a:0 "努雷，这颗西北农田的明珠，将成为我的新首都"
 me_nuragic_01_inv.19.b:0 "迦太基旧都努拉，天经地义之选"
 me_nuragic_01_inv.19.c:0 "卡拉利斯无可比拟——必选此地"
 me_nuragic_01_inv.19.d:0 "他施乃上选，昔日光华必将重耀"
 me_nuragic_01_inv.19.e:0 "骄傲之卢圭多，此我最爱之议"
 me_nuragic_01_inv.19.f:0 "佛西亚内…舍此何以为都？"
 me_nuragic_01_inv.19.g:0 "吾等将守故都"
 me_nuragic_01_inv.2.a:0 "我们可以为即将到来的事情做准备，知道我们的肚子会很饱"
 me_nuragic_01_inv.20.a:0 "撒丁尼亚和科西嘉的大门已握在我们手中。"
 me_nuragic_01_inv.21.a:0 "赞美你，萨尔多！你祝福了我们的剑与田野"
 me_nuragic_01_inv.3.a:0 "愿我们永远不需要撤退到这些塔楼"
 me_nuragic_01_inv.4.a:0 "这是一个迦太基人会理解的信息……"
 me_nuragic_01_inv.5.a:0 "这对我们的目的来说是再合适不过了"
 me_nuragic_01_inv.5.b:0 "值得多花点钱，以防止将来发生灾难"
 me_nuragic_01_inv.6.a:0 "现在我们可以盯着这群该死的乌合之众了"
 me_nuragic_01_inv.7.a:0 "尽力保持不被发现--我们需要惊喜的元素"
 me_nuragic_01_inv.8.a:0 "在努拉盖中立下的誓言不可违背，无论生死皆然。"
 me_nuragic_01_inv.9.a:0 "一点一滴的帮助"
 me_nuragic_01_inv_1.a:0 "懦夫和外国人去死吧！我们将把他们全部杀死！"
 me_nuragic_10_desc:0 "[GetProvince('(int32)3483').GetName]已落入[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的胜利军队之手，我们嗜血士兵渴望的复仇令人畏惧。自有记忆以来，迦太基人一直在[GetProvince('(int32)3483').GetName]的城墙后恐吓我们的人民，仿佛他们是岛屿的主人，但现在众神已抛弃了背信弃义的提尔后裔，审判的时刻就在眼前。\n\n当[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的军队首次逼近[GetProvince('(int32)3483').GetName]时，人们担心胜利将导致可恨的迦太基首都彻底被摧毁——事实上，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]可能无法阻止[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的士兵烧毁这座城市。\n\n通过夷平这座城市，士兵们相信他们父辈的罪行最终将得到报复，这是将迦太基人的可憎存在永远从这片土地上清除的象征性一步，但我们的顾问们对破坏我们岛上为数不多的城市之一的想法感到焦头烂额。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]站在[GetProvince('(int32)3483').GetName]的大门前，整支军队等待着命令……只需一句话，成千上万的灵魂就可能灭亡。"
 me_nuragic_10_title:0 "苏尔奇的毁灭"
 me_nuragic_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y 向努拉进军#!' $mission_completed_tooltip_2$"
 me_nuragic_11_desc:0 "在过去的几周里，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在[GetProvince('(int32)3484').GetName]行省度过了越来越多的时间。此时已熟悉整个撒丁岛，成年后大部分时间都在岛上征战，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]对我们岛上几乎每一条山路和山谷都了如指掌，因此卡拉利受到最多关注也就不足为奇了。\n\n[GetProvince('(int32)3484').GetName]拥有肥沃的田野和清澈的溪流，有足够的空间让我们的农场动物自由漫步。乡间的蜜蜂生产一种略带苦味的蜂蜜，美食家们认为其精致无比，而[GetProvince('(int32)3484').GetName]葡萄园生产的葡萄酒简直是撒丁岛上最好的。即使是不喜欢安逸生活的强大的[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]也被该地区的魅力所吸引，下令按照严格标准建造这座城市。"
 me_nuragic_11_title:0 "卡拉利安农田"
 me_nuragic_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y 卡拉利安农田#!' $mission_completed_tooltip_2$"
 me_nuragic_12_desc:0 "得知[SCOPE.GetRootScope.GetCountry.GetName]的城市正在繁荣发展，而这要归功于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]慷慨资助其建设，我们的领袖作出了一个震惊部族长老的大胆决定：我们可以立刻放弃祖先故土，把首都迁往一座自选的新城。虽然有些人对[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]这道不合常规的命令犹豫不决，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]个人声望以及近来法律的变化，已经赋予[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]彻底改变我们人民生活方式的绝对权威，因此所有反对声音都被压了下去。\n\n诚然，无论我们的法律和传统如何宣称，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]事实上已经统治着[SCOPE.GetRootScope.GetCountry.GetName]，只差一个名分而已。看来我们旧日的治理方式，不论其本来为何，都已悄然终结，一个新时代正降临于我们。我们唯有祈祷神明赐予[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，这位[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]名下第一人，以智慧引领我们的人民穿越暴烈动荡的世界。\n\n有些人公开哀悼古老首都的失去，更多人则暗中哀悼古老自由的丧失。然而，与那些因这场意外变化而兴奋的人相比，这些沮丧声音终究只是少数。从今以后，我们的生活将会不同……"
 me_nuragic_12_title:0 "一个南方的首都"
 me_nuragic_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y 新首都#!' $mission_completed_tooltip_2$"
 me_nuragic_13_desc:0 "迦太基人仓促放弃[GetProvince('(int32)3504').GetName]时留下了许多东西；考虑到他们贪婪成性的名声，这实在令人意外。他们不仅把城市留给了我军，盲目恐慌中甚至还把船只留在港内漂浮，虽然逃走前似乎也曾半心半意地试图纵火烧船。然而风向与他们作对，我们得以扑灭火焰，并抢救出少量船只。\n\n虽然我们在海上事务方面十分缺乏经验，但工程师已经尽其所能修好了这些船只。看来我们如今拥有了一支小型海军，我的[ROOT.GetCountry.GetRulerTitle]。"
 me_nuragic_13_title:0 "夺取战舰"
 me_nuragic_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y 夺取船只#!' $mission_completed_tooltip_2$"
 me_nuragic_14_desc:0 "'表哥!诸神待你不薄！'\n\n听到这些话，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的脸上露出了灿烂的笑容。穿过[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]旗舰的甲板，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]向马哥海盗团的领袖打招呼，他已经响应我们的号召，同意听取我们的建议。这当然是一个奇怪的景象，因为海盗们把他们的舰队开到了[GetProvince('(int32)3504').GetName]的外面，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]同意出去和他们在海上见面。\n\n虽然我们的部落在几百年前就相互分裂，但我们的人民与居住在西方遥远岛屿上的塔莱人亲属保持着脆弱的联系。正是在那里，在巴利阿里群岛，可怕的马戈海盗建立了自己的地位，掠夺连接伊比利亚和迦太基的丰富贸易路线。海盗是一个有利可图的行业，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]已经决定我们要加入这个光荣的球拍。\n\n‘正如你所看到的，我们已经在这里建立了人们所需要的一切，但我们缺少人……战争对我们很不利。只要你说一声，我们就会向你和你的人开放我们的港口。’"
 me_nuragic_14_title:0 "对海盗行为视而不见"
 me_nuragic_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y 对海盗行为视而不见#!' $mission_completed_tooltip_2$"
 me_nuragic_15_desc:0 "古时候，我们生活在和谐之中。很长一段时间，我们让#E 腓尼基人#!在我们的几个沿海定居点建立贸易站，为我们的子民带来巨大利润，同时我们的定居点变成了富有而有竞争力的城市。这一切随着#E 迦太基人#!的到来而改变——这是位于非洲的另一个腓尼基殖民地，在征服了当地对手后，决定夺取我们心爱的岛屿的控制权。\n\n战争由此开始——迦太基远征军由马尔科率领，他是一位已在西西里战胜希腊人的将军。在我们的伊奥利安平原上进行了多次野战，直到马尔科和他的部队被彻底歼灭并被迫放弃我们的土地。马尔科本人在灾难性失败后返回迦太基，被他自己的子民处决。\n\n我们举行了盛大的宴会庆祝胜利，但和平并未持续多久。马尔科失败五年后，他的儿子哈米尔卡和哈斯德鲁巴再次归来，比以往更强大，来征服我们的土地。我们的平原再次被另一场毁灭性冲突蹂躏。多次尝试击退入侵者，有成功也有失败。经过三十年的漫长战争，陷入了僵局；迦太基人无法进一步扩展到我们内陆的山丘和山脉，因此确保了我们对北部和东部海岸的控制，但我们永远失去了伟大的伊奥利安平原和南部丰富的矿田。\n\n两百年来，迦太基一直试图进一步扩张到我们的土地，但得益于地形的严酷和我们祖先不屈的力量，我们设法保持了自由。我们经常在祖先曾拥有的平原上进行伏击和小规模冲突，因为如果我们不能夺回它们，任何人都不应从中受益。\n\n直到今天，外国人仍不愿在我们的岛屿定居，既被我们劝阻，也被自我们离开之日起笼罩着祖先失落平原的有毒空气所劝阻。然而，我们允许这些肮脏的闯入者以我们的代价致富，消耗我们丰富的矿脉，为他们的利益掠夺我们的农田，已经太久了。夺回伊奥利安平原的时候到了；我们的敌人将再次见证建造塔楼之人的怒火。[ROOT.GetCountry.GetRuler.GetFirstName]必须向[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]祖先证明[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]值得在诺尔戈多的殿堂中与他们同在。"
 me_nuragic_15_title:0 "在我们自己的家园里做奴隶"
 me_nuragic_15_tooltip:0 "这种状态能持续多久？"
 me_nuragic_16_b_tooltip:0 "$mission_completed_tooltip_1$ '#Y 陈旧的客人#!' $mission_completed_tooltip_2$"
 me_nuragic_16_desc:0 "尽管我们的部落数百年前就已分道扬镳，但我们的族人始终与居住在西边遥远岛屿上的巴利阿里群岛亲族保持着若即若离的联系。正是那里，在巴利阿里群岛，令人畏惧的马戈海盗已然盘踞，肆意掠夺连接伊比利亚与迦太基的繁荣贸易航线。\n\n显然，他们赢得了我们的敬重——我们将协助他们驱逐迦太基人，将其赶出群岛……通过亲自占领这些岛屿。据说我们的祖先曾在马戈岛（原名努拉）建造了数百座努拉格建筑，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]无法忍受这些努拉格建筑落入外国人之手。“必须采取行动，但该如何做？或许最好的方案是让无人察觉的行动……”"
 me_nuragic_16_title:0 "陈旧的客人"
 me_nuragic_16_tooltip:0 "#R 我们将立即向具姆奈西亚宣战！#! $mission_completed_tooltip_1$“#Y 陈腐的客人#!”$mission_completed_tooltip_2$"
 me_nuragic_17_desc:0 "终于，我们在[GetProvince('(int32)1465').GetName]省完成了一座矿山的建设，并立即用巴利阿里奴隶填满了采石场。\n\n尽管现在在黑暗矿井中劳作的人中许多曾是知名公民，但他们过去的生活已成为遥远的记忆，留下的只有苦乐参半的回忆。现在只有镐头，直到死亡最终来解除他们的劳役。"
 me_nuragic_17_title:0 "帕尔马矿区"
 me_nuragic_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y 帕尔马矿区#!' $mission_completed_tooltip_2$"
 me_nuragic_18_desc:0 "[ROOT.GetCountry.GetRuler.GetFirstName]从不浪费机会，明智地决定将[GetProvince('(int32)3515').GetName]公民的部分物质财富用于资助在[GetProvince('(int32)3510').GetName]建造一座全新的城市。\n\n虽然一些科西嘉人对必须支付这笔额外税款有怨言，但[ROOT.GetCountry.GetRuler.GetFirstName]辩称岛上的每个人都将受益，尤其是现在定居西海岸将更加容易。"
 me_nuragic_18_title:0 "科西嘉诸城"
 me_nuragic_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y 科西嘉城市#!' $mission_completed_tooltip_2$"
 me_nuragic_19_desc:0 "现在[ROOT.GetCountry.GetCapital.GetName]的庆祝活动开始平息，是时候把注意力转向一件严肃事务：选择新首都。\n\n众所周知，我们有许多杰出候选地点可供选择，因此[ROOT.GetCountry.GetRuler.GetFirstName]将有一番艰巨工作要做。幸好这是令人愉快的困境，也让人觉得对我们的国家颇为吉祥。"
 me_nuragic_19_title:0 "新首都"
 me_nuragic_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y 塔佛洛斯海峡#!' $mission_completed_tooltip_2$"
 me_nuragic_1_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]冲出帐篷，从[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]口中爆发出一股肮脏的咒骂声，片刻之后，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]整个随行人员都加入进来。所有站在外面的人--人数并不少，因为整个上午都有大量的士兵在附近转悠--都可以亲眼看到谈判的情况。当[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]转身向他们讲话时，安静的杂音在聚集的人群中荡漾开来，脸上满是愤怒的表情。\n\n几年前，我，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，向部落的长老们发出了消息，寻求一个听众来讨论迦太基人对我们所有人构成的危险，但除了提布拉特人，没有人有礼貌地响应这个号召，他们在这个岛上和北非人一样都是外国人。考虑到我们在这个岛上有许多努拉基部落，我期望我们的表兄弟能响应神圣的号召，但我不应该惊讶他们都从战争会议上溜走了。转身走向满脸通红的[GetCountry('X47').GetRuler.GetName]，她正双手叉腰站着，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]伸出[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的手指，继续[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的咆哮，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]的声音因愤怒而颤抖。\n\n'我相信你们都是胆小鬼，不配和猪睡觉![GetCountry('X47').GetRuler.GetFirstName]，你们竟敢带着承诺虚假和平的蜜语来到这里，你们的呼吸被迦太基人的酒所甜化，你们的口袋被他们的银子所冲刷--够了！你们不是战争的伙伴，你们是战争的对手。你不是战争的伙伴，而是草地上的毒蛇。马上离开，以免我违背我的好客誓言，把你打倒在地！'当[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]喊出'对任何人都不能手下留情！撒丁岛将是我们的！'时，人群中的气氛变得很难堪。"
 me_nuragic_1_title:0 "一个重要的会议"
 me_nuragic_1_tooltip:0 "#Y 我们现在拥有对整个撒丁尼亚的宣称#!。$mission_completed_tooltip_1$“#Y 重大议会#!”$mission_completed_tooltip_2$"
 me_nuragic_20_desc:0 "稳固控制[GetProvince('(int32)3508').GetName]和[GetProvince('(int32)3506').GetName]，便能确保我们对塔佛洛斯海峡拥有牢固影响力。\n\n那些试图在伊比利亚与意大利半岛之间寻找更快航路的船只，将不得不缴纳少量海上通行费以穿越海峡。在[ROOT.GetCountry.GetRuler.GetFirstName]的明智规划中，塔佛洛斯将在我们人民保护下提供一条安全贸易路线，免受海盗威胁；涌入的贸易也将惠及我们的沿海市场和港口，使那里获得最精良的造船工艺。"
 me_nuragic_20_title:0 "塔佛洛斯海峡"
 me_nuragic_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y 努伦西亚谷物#!' $mission_completed_tooltip_2$"
 me_nuragic_21_desc:0 "努伦西亚平原因我们的伟业而闪耀；运河已经完工，水井已经掘成，一切都已构想妥当，实现了[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的明智愿景。[GetProvince('(int32)3496').GetName]将真正成为撒丁尼亚的粮仓，而我们很快便会收获辛勤劳动的果实。"
 me_nuragic_21_title:0 "努伦西亚的谷物"
 me_nuragic_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y 消灭异族#!' $mission_completed_tooltip_2$"
 me_nuragic_2_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经到达最近刚刚完工的农业定居点，决定不留任何遗憾，希望亲自检查我们工人的手艺。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]走过田地，检查土壤的质量，并花了几个小时走过贮藏室，检查农场动物的供应品以及它们的畜栏是否得到适当的清洁--没有任何细节被认为太微不足道，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]关注。经过令人难以置信的漫长一天，当[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]发表声明时，每个人都松了一口气。"
 me_nuragic_2_title:0 "确保储备物资"
 me_nuragic_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y 确保储备物资#!' $mission_completed_tooltip_2$"
 me_nuragic_3_desc:0 "几个月来，我们一直派人在山上辛勤工作，采掘必要的石料来修复我们土地上的努拉格赫防御工事。工作很辛苦，劳动者在炎热的白天经常抱怨，但所有人都知道，这项艰巨的工作是最重要的。\n\n虽然我们完全相信我们的士兵有能力保护我们的人民，但我们的心是平静的，因为我们知道，如果一切都失败了，我们可以聚集在努拉盖的墙体内，恢复自己的力量。"
 me_nuragic_3_title:0 "修复努拉盖"
 me_nuragic_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y 修复努拉盖#!' $mission_completed_tooltip_2$"
 me_nuragic_4_desc:0 "从[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]附近山上的有利位置，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]可以俯瞰下面的平原，所有的目光都集中在从[GetProvince('(int32)3504').GetName]向上飘起的浓浓黑烟。几个月来，迦太基人已经知道了我们的准备工作，但在他们的傲慢中，将我们视为单纯的野蛮人，没有能力执行我们的战争计划。他们认为自己在城墙后面是安全的，但他们显然误解了他们所处危险的性质。\n\n转向附近的顾问，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]急促地发出命令。找到城堡的指挥官，把他的头送到迦太基。'不放过你找到的其他任何人。"
 me_nuragic_4_title:0 "[GetProvince('(int32)3504').GetName]的沦陷"
 me_nuragic_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y 第一座城市的沦陷#!' $mission_completed_tooltip_2$"
 me_nuragic_5_desc:0 "我们终于收到消息，我们在[GetProvince('(int32)3506').GetName]正在进行的施工已基本完成，尽管当地的提布拉特人和科西人不希望看到我们在该地区的存在，对我们进行了骚扰。尽管如此，工地上的士兵们还是有能力赶走这些小兵，所以工作接近尾声。\n\n虽然维尼奥莱的堡垒是一个令人印象深刻的成就，但我们的首席建筑师告诉我们，如果我们有硬币，可以做得更多，以加强我们的防御。"
 me_nuragic_5_title:0 "锁好后门"
 me_nuragic_5a_tooltip:0 "$mission_completed_tooltip_1$ '#Y 锁好后门#!' $mission_completed_tooltip_2$"
 me_nuragic_5b_tooltip:0 "$mission_completed_tooltip_1$ '#Y 锁好后门#!' $mission_completed_tooltip_2$"
 me_nuragic_6_desc:0 "尽管我们已经尽力保护撒丁岛北部海岸的安全，但我们发现自己经常受到科西恩和提布拉特突袭者的困扰，他们无法接受在我们手中的失败，只好诉诸于强盗行为，用狡猾和奸诈夺取他们无法用武力获得的东西。他们错误地认为自己在科西嘉岛是安全的，我们被迫在岛上建立了一个前哨站，希望能在源头上骚扰他们试图穿越萨杜姆海的行为。\n\n这种情况目前还不错，但长期来看是无法维持的......我们最终可能被迫平定该岛。"
 me_nuragic_6_title:0 "在腓卡里亚的立足点"
 me_nuragic_6_tooltip:0 "我们现在拥有对科西嘉岛的宣称。$mission_completed_tooltip_1$“#Y 在腓卡里亚的立足点#!”$mission_completed_tooltip_2$"
 me_nuragic_7_desc:0 "'趴下，你这个笨蛋！'。他们快到我们了！'[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]嘶吼着，抓住[SCOPE.sCharacter('random_dude3').GetName]的外衣，把他们拉向灌木丛。几秒钟后，一支由轻骑兵组成的大型突击队从你刚才站立的位置驰过--灾难勉强避免了。在马蹄声消失后发出信号，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]召集[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]士兵，他们匍匐着爬上山，看着敌人的骑兵朝海岸走来。\n\n迦太基人最近增加了一倍的巡逻，虽然他们用银子充斥着我们的岛屿，雇佣任何愿意与我们作对的人，但我们的侦察兵找到了山谷中的隐蔽处，并留意他们的动向，诸神保佑。如果运气好的话，我们将能保持这种优势，特别是在山区叛军的帮助下，他们对这些道路了如指掌。"
 me_nuragic_7_title:0 "注视着山丘"
 me_nuragic_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y 注视着山丘#!' $mission_completed_tooltip_2$"
 me_nuragic_8_desc:0 "随着我族驱逐异族入海的愿望日益高涨，祭司们建议我们重启古老仪式，为即将到来的解放之战做好准备，这场战争将永远解放我们的土地。\n\n因此，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定我们必须重申神圣誓言，以获得天父的眷顾。成群战士已被召入#E 努拉克·努尔多勒#!，将命运与萨尔多意志相系。每位受训者依次被引至努拉盖——石中圣剑与圣井神水令灵魂战栗。神圣围场中央，金刚鹦鹉与祭品牲畜静候着他们，头戴角盔的战士们拔剑列阵。\n\n青年被押至祭坛前，其姿态更似祭品而非受训者。每位随从皆发誓永不泄露所见所闻，更被迫以特殊誓词立誓：若违抗将领征召、逃离战场、或目睹同伴逃亡却不加追剿，必遭诅咒降临自身及其家族。那些拒绝诵念神圣誓词者，当即在祭坛前惨遭杀害。其尸首与其他牺牲者混杂抛弃，成为拒绝宣誓者的警示。"
 me_nuragic_8_title:0 "给巴贝的血腥礼物"
 me_nuragic_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y 诸神誓言#!' $mission_completed_tooltip_2$"
 me_nuragic_9_desc:0 "长期以来，我们知道[GetProvince('(int32)3494').GetName]的定居点一直是迦太基商人的重要中转站，他们在穿越海盗猖獗的撒耳多姆海时经常会在这个友好的港口停留，获取淡水和物资。\n\n不用说，我们最近在那里取得的胜利将大大挫败这些努力。哦，是的，留下的国库对我们自己的金库来说是一个很好的补充。"
 me_nuragic_9_title:0 "萨纳法尔港"
 me_nuragic_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y 萨纳法尔港#!' $mission_completed_tooltip_2$"
 new_capital_sardinia:0 "塔城"
 nuraghe_network:0 "修复Nuraghes"
 nuragic_archers:0 "努拉吉克弓箭手"
 nuragic_farm:0 "努拉吉克农民"
 nuragic_fortifications:0 "努拉吉克防御工事"
 nuragic_mission_01_inv:0 "开垦努拉吉克的家园"
 nuragic_mission_01_inv_10_task:0 "[GetProvince('(int32)3481').GetName]的毁灭"
 nuragic_mission_01_inv_10_task_DESC:0 "就像热血沸腾的动物一样，我们的士兵被他们最近在战场上的成功所鼓舞，能够感觉到入侵者的末日，并要求我们继续向[GetProvince('(int32)3481').GetName]推进，毫无疑问，他们渴望得到据称藏在其城墙内的丰富财宝。我们的人将不惜一切代价，彻底摧毁这座城市。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 nuragic_mission_01_inv_11_task:0 "卡拉利安农田"
 nuragic_mission_01_inv_11_task_DESC:0 "真的，我们很少看到像[GetProvince('(int32)3484').GetName]这样的地方；这座城市被肥沃的葡萄园包围，被太阳亲吻，真正的幸福肯定在这里。所有经过这座城市的人都渴望结束他们的旅行，渴望留在我们的庄园里，看海豚在泰尔纳姆海的水中嬉戏。我们将培育卡拉利，不惜一切代价把它建设成一座宏伟的城市。\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 nuragic_mission_01_inv_12_task:0 "南方的首都"
 nuragic_mission_01_inv_12_task_DESC:0 "在成为我们岛屿无可争议的主人之后，我们的权威从北部的堡垒到最南部的城市都得到了承认--事实上，整个撒丁岛都是我们的--可以说，一个新的时代已经来临，努拉吉克人将拥有一个属于自己的家园。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 nuragic_mission_01_inv_13_task:0 "夺取船只"
 nuragic_mission_01_inv_13_task_DESC:0 "既然我们已经设法为自己确保了一座港口城市，就应当考虑立刻建造一支舰队。幸运的是，敌人在仓促撤离此地时遗弃了几艘状况尚可的船；要让它们重新投入使用并不需要花费太多。\n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 nuragic_mission_01_inv_14_task:0 "对海盗行为视而不见"
 nuragic_mission_01_inv_14_task_DESC:0 "虽然我们已经有很多年没有和我们的表亲联系了，但是我们听说过可怕的马哥海盗......也许他们愿意来拜访我们一段时间？\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 nuragic_mission_01_inv_16_task:0 "陈旧的客人"
 nuragic_mission_01_inv_16_task_DESC:0 "在远古时代，当我们的民族在海上与陆上皆处于鼎盛之时，撒丁岛北部的航海巴勒阿里诸部族控制了西部诸岛——据说，这些岛屿正是因他们而得名。我们在那里建造了数百座与本土相似的努拉格，将我们的生活方式与知识带到彼处，直至迦太基人出现并夺取了整个群岛。\n\n三岛之中，如今被称为马戈的那一座，曾是我们在此区域最钟爱的权力中心，彼时名为努拉。既然我们已将本岛从推罗后裔手中解放，也必将解放西方的同胞。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 nuragic_mission_01_inv_17_task:0 "帕尔马矿区"
 nuragic_mission_01_inv_17_task_DESC:0 "既然我们已征服[GetProvince('(int32)1465').GetName]，就该拆毁#E 巴利阿里#!的定居点，改建矿场——那些蠢货简直是坐在金矿上。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 nuragic_mission_01_inv_18_task:0 "科西嘉诸城"
 nuragic_mission_01_inv_18_task_DESC:0 "若我们能攻占[GetProvince('(int32)3515').GetName]城，便可利用该富庶区域的财富，为[GetProvince('(int32)3510').GetName]的建设提供资金。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 nuragic_mission_01_inv_19_task:0 "塔佛洛斯海峡"
 nuragic_mission_01_inv_19_task_DESC:0 "开发塔佛洛斯周边城市将为海峡带来新的贸易涌入，从而使本地市场蓬勃发展。\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 nuragic_mission_01_inv_1_task:0 "召集部落的长老们"
 nuragic_mission_01_inv_1_task_DESC:0 "在我们对外国人采取任何行动之前，我们必须首先在我们的部落兄弟中收集共识。我们不能单独行动；如果我们有任何成功的希望，我们将需要团结我们的力量。向邻近的部落发送消息，说将召开理事会！。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 nuragic_mission_01_inv_20_task:0 "努伦西亚谷物"
 nuragic_mission_01_inv_20_task_DESC:0 "努伦西亚平原位于撒丁岛西北部，以土壤肥沃和气候温和而闻名。[GetProvince('(int32)3496').GetName]适宜种植我们所能获取的顶级小麦品种——我们的子民将开凿足够的运河与水井，为文明未来的粮仓输送所需之水。\n\n\n\n\n\n\n\n\n\n@celt_mil14! "
 nuragic_mission_01_inv_2_task:0 "确保储备物资"
 nuragic_mission_01_inv_2_task_DESC:0 "如果我们有希望在战场上取胜，我们的士兵必须吃饱喝足，随时准备战斗，因为饥饿是一个难以摆脱的敌人，永远存在。一旦我们有了可用的资金，我们就应该建立一个农业定居点，以及进口尽可能多的粮食，我们可以储存。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 nuragic_mission_01_inv_3_task:0 "修复努拉盖"
 nuragic_mission_01_inv_3_task_DESC:0 "在困难的时候，我们的祖先会撤退到他们建立的塔式防御工事，即#T 努拉盖#!，等待时机从这些力量的位置打击他们的敌人。在我们发动自己的战争之前，我们必须尊重古老的方式，并确保努拉盖被加固，以及适当的储备物资。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 nuragic_mission_01_inv_4_task:0 "第一个沦陷的城市"
 nuragic_mission_01_inv_4_task_DESC:0 "[GetProvince('(int32)3504').GetName]曾是福西亚人建立的殖民地，名为奥尔比亚，但在建城仅20年后便被伊特鲁里亚人与腓尼基人的联合军队摧毁。\n\n[GetProvince('(int32)3504').GetName]的定居点及其港口目前构成了迦太基人在撒丁岛东海岸海上行动的主要基地。其相对孤立的位置最终将有助于我们的征服行动。\n\n我们希望将来能将[GetProvince('(int32)3504').GetName]用于自身目的，因此最终在当地发展基础设施至关重要。\n\n\n\n\n\n\n\n\n\n@event_pic4!"
 nuragic_mission_01_inv_5_task:0 "锁好后门"
 nuragic_mission_01_inv_5_task_DESC:0 "[GetProvince('(int32)3506').GetName]处的渡口之容易是众所周知的；对于来自科西嘉的军队来说，驶过这片水域是件微不足道的事情，由于我们不愿意让任何人如此轻易地进入我们的岛屿，我们必须采取措施，防止这种情况发生。但首先，我们必须先驱逐目前在我们岛上的科西嘉人……\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 nuragic_mission_01_inv_6_task:0 "在腓卡里亚的立足点"
 nuragic_mission_01_inv_6_task_DESC:0 "异地征服的梦想是我们最不愿卷入的事情，但所有人都能看出，为了自身目的确保[GetProvince('(int32)3508').GetName]港口的审慎之处。况且，我们也不愿看见科西嘉人繁荣起来，尤其不愿他们以损害我们为代价而繁荣。\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 nuragic_mission_01_inv_7_task:0 "注视着山丘"
 nuragic_mission_01_inv_7_task_DESC:0 "我们比外国人有一个明显的优势，就是我们对这些土地非常了解，而他们只是闯入者。我们可以利用我们对地形的了解来发挥我们的优势，派我们的人穿过困难的国家，盯着他们的部队动向。\n\n生活在山区的强盗是追踪专家；如果他们愿意帮助我们，我们应该发出大赦的消息。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 nuragic_mission_01_inv_8_task:0 "向战神献祭"
 nuragic_mission_01_inv_8_task_DESC:0 "长久以来，我们伫立于群山之中，眼睁睁看着外族人攫取我们丰饶的矿脉，亵渎我们的圣地，并以牺牲我们美丽土地为代价，砍伐焚烧我们古老的森林。\n\n每一位撒丁人——无论北方的努伦塞斯人还是南方的加利伦塞斯人，无论是巴勒阿里人还是伊利恩西亚人——都必将知晓：我们将复仇！我们将以敌人的鲜血献祭，告慰我们的神明与先祖！\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 nuragic_mission_01_inv_9_task:0 "[GetProvince('(int32)3494').GetName]的港口"
 nuragic_mission_01_inv_9_task_DESC:0 "虽然到目前为止，这片土地本身还没有被开发，但迦太基人认为[GetProvince('(int32)3494').GetName]的港口对他们的补给工作至关重要，正因为如此，我们不能再让他们控制这个地方。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 nuragic_mission_01_inv_BUTTON_TOOLTIP:0 "我们必须把侵略者赶出我们的家园，为我们自己夺回它。"
 nuragic_mission_01_inv_CRITERIA_DESCRIPTION:0 "当我们把外国人赶出我们的岛屿并为我们自己夺回它时，这个任务才算完成。"
 nuragic_mission_01_inv_DESCRIPTION:0 "只要太阳在天界中穿行，我们的人民就一直过着简单而平淡的生活，我们的财富就像环绕我们的海水一样起伏不定。虽然有些人对我们的方式嗤之以鼻，称我们为野蛮人，但我们对我们自己的东西感到满意。\n\n这一点随着迦太基人的到来而改变，他们将我们岛屿的南部海岸据为己有。他们的外交官已经非常清楚地表明，我们的山区家园在他们的军队侵袭下并不安全，但我们对我们的未来有不同的想法。"

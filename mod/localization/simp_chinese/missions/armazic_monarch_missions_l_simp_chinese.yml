l_simp_chinese:
 armazi_walls:0 "阿尔马兹里斯基的城墙"
 armazi_walls_desc:0 "我们把阿尔马兹里斯基要塞建成了不可征服的堡垒；只要城墙内的堡垒屹立不倒，那么我们的人民就会对未来充满希望。"
 armazic_missions:0 "伊比利亚国王的崛起"
 armazic_missions_CRITERIA_DESCRIPTION:0 "当伊比利亚的统治者击退他们的邻居，建立一个强大而安全的国家，能够将他们的力量投射到远离我们山地家园的地方时，这个使命就会完成。"
 armazic_missions_DESCRIPTION:0 "从地中海的大港口城市起航，沿着航道航行，经过拜占庭，最终到达黑海，你将抵达一片遥远的海岸，那里有一座雄伟的山脉——高加索山脉，屹立于广袤的北方草原，划分开这片严酷的土地——这就是我们的家园。我们拥有自己的传统，崇拜着外人所不知的神祇，尽管我们四周被敌人包围，他们渴望将我们赶出我们的高原城市，但至今未能成功。\n\n如今，我们不能再让敌人有任何可趁之机，我们必须牢牢掌控自己的命运。"
 armazic_missions_task_1:0 "被敌人所包围"
 armazic_missions_task_10:0 "亚美尼亚人的防御工事"
 armazic_missions_task_10_DESC:0 "因为我们已经把亚美尼亚的许多大城市据为己有，所以我们掌握了大量的知识，而这些知识是我们以前无法获得的。大家都知道亚美尼亚人建造了高超的防御工事，那么我们为什么不教我们自己的工程师如何模仿他们的风格呢？\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 armazic_missions_task_11:0 "君王世系"
 armazic_missions_task_11_DESC:0 "由于法纳瓦兹王朝的改革，我们民族的荣耀世代得到了保障。在我们位于[GetProvince('(int32)1676').GetName]的堡垒中，我们统治着一个广阔的王国，一个由我们自己亲手建立的王国。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 armazic_missions_task_12:0 "阿尔马济联盟"
 armazic_missions_task_12_DESC:0 "在我们民族的历史上第一次，阿尔马兹信仰的信徒们被统一在一个王冠之下，我们周边的敌人的力量在一代或更长时间内被摧毁。愿阿尔马兹继续将他的祝福倾注在我们身上，并带领我们走向胜利!\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 armazic_missions_task_13:0 "高加索伊比利亚的葡萄酒"
 armazic_missions_task_13_DESC:0 "我们的人民以善于发酵葡萄酒而闻名，这是我们几千年来一直追求的爱好。当收获的时候，我们把巨大的陶器容器装满，用我们的语言称之为'kvevri'，然后把它们深埋在地下。那些喝伊比利亚葡萄酒的人往往能发现其他年份的葡萄酒缺乏味道。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 armazic_missions_task_1_DESC:0 "我们被四面八方的敌人所包围，南边是严峻的亚美尼亚人，西边是傲慢的科尔奇斯人，东边是狂野的阿尔巴尼亚人。因为我们的军事顾问无法达成共识，所以我们将对我们周围的每个人捏造主张。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 armazic_missions_task_2:0 "向海岸推进"
 armazic_missions_task_2_DESC:0 "我们最近的胜利带来了诱人的承诺，在未来的日子里会有更大的收获；如果我们的士兵继续向前推进，我们不仅会到达Mare Hyrcanum的海岸，而且我们甚至可以进入黑海的水域。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 armazic_missions_task_3:0 "金羊毛的土地"
 armazic_missions_task_3_DESC:0 "尽管我们已经粉碎了[GetProvince('(int32)1715').GetArea.GetName]的威力，但人们仍然担心他们会重新回到强势地位。很明显，我们必须彻底铲除他们，以防止这种可能性的发生。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 armazic_missions_task_4:0 "阿尔巴尼亚人的废墟"
 armazic_missions_task_4_DESC:0 "我们的部队继续消灭阿尔巴尼亚部落的人；现在我们已经牢牢地控制了他们的中心地带，用不了多久我们就能吃完他们王国的剩余残渣。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 armazic_missions_task_5:0 "弄湿我们的脚"
 armazic_missions_task_5_DESC:0 "虽然我们是该地区新的权力经纪人，但我们在黑海的存在很快就会被所有人知道--我们的造船计划将使我们的影响力远远超出我们祖国的海岸！。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 armazic_missions_task_6:0 "赋予埃里斯塔维权力"
 armazic_missions_task_6_DESC:0 "埃里斯塔维是地方的一个贵族阶层，其职责类似于总督，被法纳瓦兹王朝委托以其名义统治各省。在我们能够制定任何进一步的改革之前，我们必须授予他们权力。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 armazic_missions_task_7:0 "独特的语言"
 armazic_missions_task_7_DESC:0 "虽然目前在我们的祖国有大量的方言，人民使用的书面文字也同样多，但我们决定，每个人都必须说同样的方言，以同样的方式书写。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 armazic_missions_task_8:0 "拜伯顿"
 armazic_missions_task_8_DESC:0 "[GetProvince('(int32)1760').GetName]是上亚美尼亚的一个重要城市，不设防，其城墙仅由名声在外的亚美尼亚军队来守卫。如果我们现在准备好我们的宣称并迅速出击，我们相信整个省都可以落入我们的士兵手中。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 armazic_missions_task_9:0 "来自吕克尼提斯湖"
 armazic_missions_task_9_DESC:0 "从新征服的[GetProvince('(int32)1572').GetName]城到亚美尼亚人的首都只有几天的路程，尽管他们会全力抵抗我们的军队，但我们必须打击他们王国的核心。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 armazic_power:0 "阿尔马兹的力量"
 armazic_power_desc:0 "我们已经征服了奉行阿尔马兹信仰的土地，将该地区统一为一个强大的势力，在那里，信徒的军队保护着充满真正信徒的城市。"
 armenian_construction:0 "亚美尼亚建筑"
 armenian_construction_desc:0 "我们的建筑师从亚美尼亚同行那里学到了很多关于建造防御工事的知识，他们勉强地与我们的工程师分享了他们的秘密。"
 eristavi:0 "埃里斯塔维"
 eristavi_desc:0 "作为法纳瓦兹（Pharnavazid）引入的一种特殊的行政角色，埃里斯塔维以国王的名义有效地统治了分配给他们的省份。"
 georgian_script:0 "格鲁吉亚文字"
 georgian_script_desc:0 "法纳瓦兹-法纳瓦兹德引入的新的书写方式，随着时间的推移，最终演变为格鲁吉亚文字。"
 iberian_wine:0 "伊比利亚葡萄酒"
 iberian_wine_desc:0 "伊比利亚人的酿酒传统可以追溯到几千年前，他们以生产的葡萄果实而闻名，有些人声称我们是第一个掌握这种技艺的人。"
 me_armazic_1.a:0 "有选择是件好事......"
 me_armazic_10.a:0 "这是一个极好的消息！我们的未来建立在这样的基础上。我们的未来就是建立在这样的基础上"
 me_armazic_10_desc:0 "由于亚美尼亚的祖国是一个充满了峭壁和岩石隘口的国家，他们的工程师和建筑师已经开发出一种拥抱当地地形的建筑风格。通过将他们的防御工事直接支撑在山坡上，亚美尼亚人利用大地本身的力量，使他们能够建造安全的堡垒，使任何敌对的军队感到惊愕--只要问问我们上次南部战役的老兵，他们对亚美尼亚的堡垒有什么看法。"
 me_armazic_10_title:0 "$armazic_missions_task_10$#!"
 me_armazic_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_10$#!”$mission_completed_tooltip_2$"
 me_armazic_11.a:0 "统治伊比利亚人是我一生中最大的荣幸"
 me_armazic_11_desc:0 "虽然想象后世对[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的事迹的评价是一种狂妄，但我们相信，法纳瓦兹的名字将在永恒中回响。没有其他统治家族为我们的人民做了这么多；埃里斯塔维家族统治着一个满足的社会，通过改变我们所说的语言和所写的文字，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，那位以太阳命名的人，实际上已经塑造了我们对现实的看法。\n\n只要人们记得伊比利亚王国，他们就会记得创造她的国王家族。"
 me_armazic_11_title:0 "$armazic_missions_task_11$#!"
 me_armazic_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_11$#!”$mission_completed_tooltip_2$"
 me_armazic_12.a:0 "我们将把我们的信仰之光带到世界的各个角落"
 me_armazic_12_desc:0 "终于，我们的祖先梦想的那一天到来了；经过多年的激烈斗争，我们的权力对手已经被击倒，他们发动战争的能力被不可挽回地打破，一个最高的权威统治着阿尔马兹信徒居住的土地。看着我们的领地和赐予我们的祝福，谁能否认阿尔马兹的权力和力量？愿他在我们带领我们的人民进入光荣的未来时，继续给予我们神圣的恩惠！"
 me_armazic_12_title:0 "$armazic_missions_task_12$#!"
 me_armazic_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_12$#!”$mission_completed_tooltip_2$"
 me_armazic_13.a:0 "一定要让我们知道，当第一批Kvevri准备好了！"
 me_armazic_13_desc:0 "今天早上有一个令人愉快的消息，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]；从人民不断的要求或边境附近的短兵相接的报告中得到了一个很好的休息。如你所知，我们的人民在酿酒方面的技术特别高超，我们最近扩大生产的举措已经顺利完成。kvevri，即盛放液体的超大陶罐，已经被埋入地下，我们的葡萄种植者已经开始工作了。用不了多久，我们就可以享受今年的产品了，这是每个人都会高兴的事情。"
 me_armazic_13_title:0 "$armazic_missions_task_13$#!"
 me_armazic_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_13$#!”$mission_completed_tooltip_2$"
 me_armazic_1_desc:0 "虽然我们猛烈地爱着我们的祖国，并会欣然放下我们的生命来保卫我们的国家，但我们承认我们的地理环境还有待改善；我们简直是四面受敌，这种情况让[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在晚上长时间保持清醒。我们的军事顾问无法决定谁是我们邻国中最弱的，这让我们更加混乱，所以决定我们应该在各个方向上编造主张，等待一个合适的时机进行扩张。"
 me_armazic_1_title:0 "$armazic_missions_task_1$#!"
 me_armazic_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_1$#!”$mission_completed_tooltip_2$"
 me_armazic_2.a:0 "黑海的水域就在地平线之上！"
 me_armazic_2_desc:0 "一件事导致了另一件事，由于我们的军队在战场上取得了胜利，我们的将军们看到了一个机会，可以摧毁#E 阿尔巴尼亚人#! 和#E 科尔奇人#!的剩余军队。因为他们在我们的手下失去了核心领土，他们的部队已经支离破碎，处于混乱状态，我们的间谍报告说，敌人营地的士气处于历史最低点。我们绝不能让他们有任何喘息的机会，必须趁势出击!"
 me_armazic_2_title:0 "$armazic_missions_task_2$#!"
 me_armazic_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_2$#!”$mission_completed_tooltip_2$"
 me_armazic_3.a:0 "立即开始建造一支舰队！"
 me_armazic_3_desc:0 "我们不仅成功地将#E 科尔奇人#! 赶出了他们的海岸线，而且还成功地洗劫了一些位于黑海海岸的较小的独立城邦--这一点将在远离我们自己的首都受到关注。\n\n但现在不要管这些，正是在这里，在我们的新城市[GetProvince('(int32)1720').GetName]，我们的海军野心将诞生。有机会进入这个水域，有机会建立贸易联系，甚至有机会进行军事扩张，这就向世界宣布，伊比利亚不是一个小角色，而是一个不可忽视的力量。"
 me_armazic_3_title:0 "$armazic_missions_task_3$#!"
 me_armazic_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_3$#!”$mission_completed_tooltip_2$"
 me_armazic_4.a:0 "假以时日，阿尔巴尼亚人将采用我们的方式--吞并他们"
 me_armazic_4.b:0 "已经决定，我们将间接地统治他们的残余"
 me_armazic_4_desc:0 "尽管阿尔巴尼亚部落的人，我们在东部的野蛮表亲，竭力抵抗我们的士兵，但最终他们的命运与科尔沁人相似。不过，我们还是要向他们的战士致敬，并对迫使我们杀死我们的高加索兄弟的情况表示遗憾。\n\n现在已经收到了阿尔巴尼亚领导人的最后呈文，有人建议我们在剩余的部落中建立一个仆从国。我们政府中的一些声音建议，这种不讲究的野蛮人应该保持距离，而另一些人则认为，他们应该得到与我们其他公民一样的机会--决定权将留给[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。"
 me_armazic_4_title:0 "$armazic_missions_task_4$#!"
 me_armazic_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_4$#!”$mission_completed_tooltip_2$"
 me_armazic_5.a:0 "你永远不会听到我们抱怨这样的事情"
 me_armazic_5_desc:0 "来自黑海沿岸城市的好消息!因为我们已经看到了合适的机会，向[GetProvince('(int32)1737').GetArea.GetName]的船厂适当地提供了优秀的木材，看来我们正在享受这个地区的小繁荣--不仅我们的船工变得更擅长建造可用的船只，而且越来越多的旅行者决定留在这个地区。我们在该地区的投资已经做得相当不错了。"
 me_armazic_5_title:0 "$armazic_missions_task_5$#!"
 me_armazic_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_5$#!”$mission_completed_tooltip_2$"
 me_armazic_6.a:0 "拿着戒指、腰带、权杖和剑——记住你的誓言。"
 me_armazic_6_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]掌权后的第一件事就是召开大议会，整个[SCOPE.GetRootScope.GetCountry.GetName]的主要家族将派代表向新统治者致敬。到达[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]后，这次会议的目的很快就明确了；[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]希望和平与稳定高于一切，决定创建一个特殊类型的总督职位，这个职位被称为 eristavi，将作为皇家意志的延伸。叫出七个人站在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHim]面前，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]进行了神圣的宣誓，向每个领导人发放了物品，使他们的权威得到承认。"
 me_armazic_6_title:0 "$armazic_missions_task_6$#!"
 me_armazic_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_6$#!”$mission_completed_tooltip_2$"
 me_armazic_7.a:0 "地方方言在家里用是可以的，但官方业务需要我们的新文字"
 me_armazic_7_desc:0 "我们很感激我们的土地上充满了各种不同的民族，但要统治这样一个不同的群体是公认的困难，每个山沟里的人都说着稍微不同的方言，使用的文字系统可能让附近城市的商人无法理解。意识到这已经成为一种困境，特别是在涉及到精简我们的行政管理时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]命令所有人使用一种新的文字，一种明确为我们人民使用的文字。也有人说，[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的居民所接受的说话方式现在是官方白话，所以每个人都必须采用我们的特殊口音。"
 me_armazic_7_title:0 "$armazic_missions_task_7$#!"
 me_armazic_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_7$#!”$mission_completed_tooltip_2$"
 me_armazic_8.a:0 "告诉我们的士兵，我希望他们已经准备好进行掠夺……"
 me_armazic_8_desc:0 "骄傲的[GetProvince('(int32)1760').GetName]城位于[GetProvince('(int32)1757').GetArea.GetName]地区附近的山区，这样一个闪亮的奖赏让我们贪婪的军队难以抵挡。由于亚美尼亚人愚蠢地决定不在该地区修建防御工事，我们的人从山口涌出，进行破坏是一件微不足道的事情......剩下的就是下达开始敌对行动的命令。"
 me_armazic_8_title:0 "$armazic_missions_task_8$#!"
 me_armazic_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_8$#!”$mission_completed_tooltip_2$"
 me_armazic_9.a:0 "我们将摧毁任何反对我们设计的人！"
 me_armazic_9_desc:0 "一个接一个，[GetProvince('(int32)1572').GetArea.GetName]省的富裕城市落入我们的军队手中，导致我们怀疑亚美尼亚人怎么可能希望从这些挫折中恢复。即使是现在，当我们的士兵聚集在Lychnitis湖水周围等待他们的下一个命令时，我们的计划也正在启动；我们很快就会越过亚美尼亚本身的中心地带，围攻他们的首都--用不了多久，我们的士兵就会在[GetProvince('(int32)1570').GetName]本身的街道上挨家挨户作战！"
 me_armazic_9_title:0 "$armazic_missions_task_9$#!"
 me_armazic_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $armazic_missions_task_9$#!”$mission_completed_tooltip_2$"

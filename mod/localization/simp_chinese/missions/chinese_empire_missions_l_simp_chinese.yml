l_simp_chinese:
 civilization_effort_nanzhong:0 "地方开化"
 commanderies_chinese_mod:0 "华夏郡县"
 desc_civilization_effort_nanzhong:0 "我帝国官员正竭尽所能，将文明播撒至蛮荒山间之部落。"
 desc_commanderies_chinese_mod:0 "此行省设有特殊华夏郡县。"
 desc_divine_favour_china:0 "诸神已然垂面于中夏之民，降福于彼等，远超世间万方。"
 desc_heavenly_horses_mod:0 "传奇西域天马壮大我军。"
 desc_imperial_road_china:0 "我邦于中夏各地修筑道路之努力，为万民带来荣耀与财富。"
 desc_magic_canal_china:0 "灵渠为此地带来无尽福泽。"
 desc_meritocracy_corruption_mod:0 "为遏制任人唯亲之腐化影响，吾等已实施一套基于才德与个人价值之制度。"
 desc_pure_land_china:0 "国土经礼法净化，涤尽战火破坏之痕。"
 desc_restored_wall_empire_missions:0 "一系列令人赞叹之防御工事已然建成，以阻遏北方蛮族之南下。"
 desc_sail_china_sail:0 "我邦勇毅之水手已奉命扬帆远航，驰骋四方，搜寻一切可寻之物。"
 desc_salt_manufactories_chinese_empire:0 "天子谕令此行省专产盐。"
 desc_silk_manufactories_chinese_empire:0 "天子谕令此行省专产丝。"
 desc_terracotta_army_mod:0 "$desc_terracotta_army_wonder$"
 desc_terracotta_army_wonder:0 "为陪伴中华初代皇帝前往来世而建之军队——数千尊彩色陶俑已于此区域造就。"
 divine_favour_china:0 "天眷"
 flying_horse_china:0 "飞马雕像"
 flying_horse_china_desc:0 "一尊技艺精湛的奔马雕像，由居于达姆纳的希腊化工匠制作而成。"
 heavenly_horses_mod:0 "天马"
 imperial_road_china:0 "驰道"
 magic_canal_china:0 "灵渠"
 me_chinese_empire_1.a:0 "治下繁荣昌盛——吾得天佑"
 me_chinese_empire_10.a:0 "经年累月……终于！"
 me_chinese_empire_1000.a:0 "此费于我如无物……"
 me_chinese_empire_1000_desc:0 "[ROOT.GetCountry.GetRuler.GetName]为追崇[ROOT.GetCountry.GetRuler.GetHerHis]先君，已应允建造一座庞大的陵寝，作为前任[ROOT.GetCountry.GetRulerTitle]的最终安息之所。不仅将修建一座令人叹为观止的墓冢，一支庞大的#E兵马俑#!军团——将永世守卫我尊贵先君之陵——亦将一同建造。\n\n尽管完成此工程尚需时日，[ROOT.GetCountry.GetRuler.GetName]已要求随时向[ROOT.GetCountry.GetRuler.GetSheHe]禀报工程进展。"
 me_chinese_empire_1000_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_1001.a:0 "甚好，甚好"
 me_chinese_empire_1001_desc:0 "建造#E兵马俑#!的工匠们发来的简短信笺：工程进展顺利。陵寝的地基终于筑成，宏伟的大理石殿宇正在拔地而起。但距一切完工仍需漫长岁月。"
 me_chinese_empire_1001_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_1002.a:0 "闻慢而稳者胜"
 me_chinese_empire_1002_desc:0 "在下深知#E兵马俑#!开工以来已历时颇久，但我必须禀告[ROOT.GetCountry.GetRuler.GetName]，陵寝终于竣工，毫无疑问它是[ROOT.GetCountry.GetName]全境最为精美的建筑之一。\n\n如今，陶俑兵士的烧造工作正拉开序幕，然此项工程耗时恐同等之久，若非更长的话。"
 me_chinese_empire_1002_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_1003.a:0 "然，我确信会如此"
 me_chinese_empire_1003_desc:0 "来自正在制作#E兵马俑#!的匠人们的消息——陶俑兵士本身已完成了大约一半，他们承诺一切都将不负等待。"
 me_chinese_empire_1003_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_1004.a:0 "等不及此任完成！"
 me_chinese_empire_1004_desc:0 "#E兵马俑#!竣工之日已为期不远了，[ROOT.GetCountry.GetRuler.GetName]——您随时可能收到关于其落成的消息。"
 me_chinese_empire_1004_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_10_desc:0 "终于，一切大功告成——#E兵马俑#!已建造完毕，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族最为伟大的艺术成就之一已然完成！"
 me_chinese_empire_10_title:0 "$missions_chinese_empire_task_10$"
 me_chinese_empire_11.a:0 "以金抚蛮夷，令其臣服！"
 me_chinese_empire_1100.a:0 "其实别无选择，对吗？"
 me_chinese_empire_1100.b:0 "不臣服于任何皇帝！"
 me_chinese_empire_1100_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了来自远方东方的使节，来自那个已统一#E中原#!的伟大#E中华帝国#!。他们听闻了我邦马匹之优良而心生渴求；其渴求之深切，以至于遣人送来了一笔巨额财富。\n\n他们的首席使臣——据说乃是其丞相——私下透露，若我等愿意，可臣服于其帝国之下……倘若不允，他们同样会前来索要我邦之地。"
 me_chinese_empire_1100_title:0 "$missions_chinese_empire_task_11$"
 me_chinese_empire_1101.a:0 "尔马尽归我有！"
 me_chinese_empire_1101_desc:0 "我朝丞相已从[GetCountry('TAY').GetName]的蛮荒之域归来，带来了极好的消息——[GetCountry('TAY').GetRuler.GetName]为我[ROOT.GetCountry.GetRulerTitle]的辉煌与威严所折服，同意成为我之朝贡国。看来[ROOT.GetCountry.GetRuler.GetName]已为[ROOT.GetCountry.GetName]确保了#E天马#!的来源。"
 me_chinese_empire_1101_title:0 "$missions_chinese_empire_task_11$"
 me_chinese_empire_1102.a:0 "时机到时取所欲"
 me_chinese_empire_1102_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，[GetCountry('TAY').GetName]的[GetCountry('TAY').GetRuler.GetName]以礼相待接见了我方使臣，但于我邦不幸的是，他们并未同意成为我之朝贡国。若我们渴望#E天马#!之地，便唯有凭武力亲自夺取。"
 me_chinese_empire_1102_title:0 "$missions_chinese_empire_task_11$"
 me_chinese_empire_11_desc:0 "在丞相的奏请下，[ROOT.GetCountry.GetRuler.GetName]已同意遣使西行，前往[GetCountry('TAY').GetName]，因据传[GetCountry('TAY').GetRuler.GetName]拥有一种名为#E天马#!的神骏，据称乃是普天之下最为致命的坐骑。这些威猛的牲畜为蛮族的军团带来了力量，而[ROOT.GetCountry.GetRuler.GetFirstName]必须为[ROOT.GetCountry.GetName]的将士们夺取此物！"
 me_chinese_empire_11_title:0 "$missions_chinese_empire_task_11$"
 me_chinese_empire_12.a:0 "送金过去——我对这宝物好奇"
 me_chinese_empire_12.b:0 "直接夺取天马"
 me_chinese_empire_1200.a:0 "从未怀疑……"
 me_chinese_empire_1200_desc:0 "尽管居于[ROOT.GetCountry.GetCapital.GetName]的一些人怀疑那些西方蛮族是否会携其承诺售予[ROOT.GetCountry.GetRuler.GetName]的珍宝归来，但[ROOT.GetCountry.GetRulerTitle]从未怀疑过这些外邦人的诚信——[ROOT.GetCountry.GetRuler.GetSheHe]善于识人，深知这些商贾乃是诚实之辈。\n\n短短数月之后，当宫中传来商队已如约携货返回都城的消息时，[ROOT.GetCountry.GetRuler.GetFirstName]并未自鸣得意。"
 me_chinese_empire_1200_title:0 "言而有信之人"
 me_chinese_empire_12_desc:0 "我们已在[ROOT.GetCountry.GetCapital.GetName]接待了来自西方的使节——这群异族衣着如蛮夷，需借助通译方能交流，然其态度恭敬，且有意以物易物。就连[ROOT.GetCountry.GetRuler.GetName]也承认，[ROOT.GetCountry.GetRuler.GetSheHe]早闻其才能，据说这些蛮夷精于驯兽，而[ROOT.GetCountry.GetRuler.GetFirstName]渴求其所谓的#E '天马'#!，以献于[ROOT.GetCountry.GetName]。\n\n交易既成，蛮夷准备返回其故乡——一处他们称为[GetProvince('(int32)6734').GetName]的地方——其首席使节言道，彼城中有宝待售，若我等付百金，则宝物归我。他们承诺数月之后携雕像归来。"
 me_chinese_empire_12_title:0 "$missions_chinese_empire_task_12$"
 me_chinese_empire_13.a:0 "东方半岛显然属我……"
 me_chinese_empire_13_desc:0 "[ROOT.GetCountry.GetName]的内部局势已趋稳定，[ROOT.GetCountry.GetRuler.GetName]得以将[ROOT.GetCountry.GetRuler.GetHerHis]目光转向他方，遂决定令帝国大军东征。[ROOT.GetCountry.GetRulerTitle]已颁诏令，绝不允许任何蛮夷王国存在于辉煌的[ROOT.GetCountry.GetAdjective]帝国之边缘——#E 辰韩#!之地将为我所有。"
 me_chinese_empire_13_title:0 "$missions_chinese_empire_task_13$"
 me_chinese_empire_14.a:0 "此所谓'王国'将化为齑粉"
 me_chinese_empire_14_desc:0 "所向无敌的帝国大军正继续着对[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]之敌前所未有的征伐，此番其令人生畏的注意力转向了[ROOT.GetCountry.GetName]的南方。\n\n闻知有日益昌盛的文明竟敢违抗[ROOT.GetCountry.GetRuler.GetHerHis]意志，[ROOT.GetCountry.GetRulerTitle]随口说了一句日后被证明颇有先见之明的话。"
 me_chinese_empire_14_title:0 "$missions_chinese_empire_task_14$"
 me_chinese_empire_15.a:0 "盐与丝皆雅致生活所需"
 me_chinese_empire_15_desc:0 "虽闻[ROOT.GetCountry.GetName]之民得天赐厚福，富饶无比，就连田间最卑微的农夫亦能身披丝绸——此言多少有些夸张。然而，千真万确的是，[ROOT.GetCountry.GetRuler.GetName]已确保丝绸@silk!与盐@salt!的产量达至前所未有的高峰。"
 me_chinese_empire_15_title:0 "$missions_chinese_empire_task_15$"
 me_chinese_empire_16.a:0 "[ROOT.GetCountry.GetName]唯才是用"
 me_chinese_empire_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]素有标准严苛之名，而[ROOT.GetCountry.GetRulerTitle]也无意消解此念。确实，[ROOT.GetCountry.GetCapital.GetName]的朝廷之中汇聚了来自[ROOT.GetCountry.GetName]四面八方的才俊之士，众多才华横溢之人毕生效力于[ROOT.GetCountry.GetRulerTitle]。帝国官僚机构从未有如此多能人充任，整个国家皆因此受益。"
 me_chinese_empire_16_title:0 "$missions_chinese_empire_task_16$"
 me_chinese_empire_17.a:0 "所谓一石二鸟……"
 me_chinese_empire_17_desc:0 "不屈不挠的[ROOT.GetCountry.GetRuler.GetName]再出高招，[ROOT.GetCountry.GetRulerTitle]下令在[ROOT.GetCountry.GetName]全境兴建#E 法廷#!，兼作我军的#E 大郡#!。\n\n此举不仅确保战备部队有地方官员精心协调调度，更将极大增进各行省之忠诚。据说，黎民百姓无不称颂[ROOT.GetCountry.GetRuler.GetFirstName]之名，赞[ROOT.GetCountry.GetRuler.GetHerHis]公正严谨，明察秋毫。"
 me_chinese_empire_17_title:0 "$missions_chinese_empire_task_17$"
 me_chinese_empire_18.a:0 "吾慎重对待职责与义务"
 me_chinese_empire_18_desc:0 "我等之中，谁还能忆起比[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]宣诏开启的这太平盛世更为安宁繁荣的时代？[ROOT.GetCountry.GetRuler.GetName]不仅击败了[ROOT.GetCountry.GetName]的诸多敌人，[ROOT.GetCountry.GetRuler.GetSheHe]更在国内成就了内部和谐，确保万世太平。\n\n据说，朝中再无针对[ROOT.GetCountry.GetRulerTitle]的阴谋暗算，因人人皆满意[ROOT.GetCountry.GetRuler.GetHerHis]的治国之道——国境之内无人不忠，皆以效命国家为生。诚然，我等蒙受天恩，生逢如此安宁之世，福泽难以计量。"
 me_chinese_empire_18_title:0 "$missions_chinese_empire_task_18$"
 me_chinese_empire_19.a:0 "遣商贾至各行省保高利润！"
 me_chinese_empire_19_desc:0 "我国的出口贸易呈爆发式增长，已成独立之势，蛮夷诸王的众多市场渴求我国之贸易货物。我国丝绸@silk!贸易所获黄金之巨，几乎无法估量。无数商贾率领驼队穿越我国广袤疆土，利用那条民间俗称#E 丝绸之路#!的驿道系统。\n\n毋庸多言，[ROOT.GetCountry.GetRuler.GetName]对国库收入之创纪录数字兴趣浓厚，且始终渴望进一步增加岁入。"
 me_chinese_empire_19_title:0 "$missions_chinese_empire_task_19$"
 me_chinese_empire_1_desc:0 "[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]最初举措之一，便是在[ROOT.GetCountry.GetName]全境进行人口普查。没有人比[ROOT.GetCountry.GetRuler.GetName]更了解战争给这片土地带来的摧残与苦难，但如今战乱之世已然终结，[ROOT.GetCountry.GetRuler.GetSheHe]欲统计幸存者之数。\n\n帝国官员自[ROOT.GetCountry.GetCapital.GetName]出发，数月后使命完成，返回复命。[ROOT.GetCountry.GetRuler.GetSheHe]批阅着载有[ROOT.GetCountry.GetRuler.GetSheHe]所要求之详尽信息的卷轴，满意颔首，[ROOT.GetCountry.GetRuler.GetFirstName]转向一位谋臣，开口说道。"
 me_chinese_empire_1_title:0 "$missions_chinese_empire_task_1$"
 me_chinese_empire_2.a:0 "[ROOT.GetCountry.GetRulerTitle]，陛下智慧无边"
 me_chinese_empire_20.a:0 "我辈蒙福无量"
 me_chinese_empire_20_desc:0 "仰赖[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]大力在[ROOT.GetCountry.GetName]全境推行#E 标准语言#!，我国民众比以往任何时候都更加紧密团结。\n\n毫无疑问，令此举措得以成功的一大创新便是#E 纸#!@papyrus!的问世，它简化了流程，使之更为便捷。为满足政府之需求，我朝一些行省已开始生产纸草。"
 me_chinese_empire_20_title:0 "$missions_chinese_empire_task_20$"
 me_chinese_empire_21.a:0 "远岛属[ROOT.GetCountry.GetName]"
 me_chinese_empire_21_desc:0 "如今我朝已拥有像样的水师，并怀有探索海洋之志，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]已下令帝国水师向东航行。海洋再也不能阻挡我军之步伐——我朝之疆域势必囊括四海！"
 me_chinese_empire_21_title:0 "$missions_chinese_empire_task_21$"
 me_chinese_empire_22.a:0 "神明之手加诸我身"
 me_chinese_empire_22_desc:0 "经过多年兴建庙宇神祠，并以法律确保此等努力不受侵犯，[ROOT.GetCountry.GetRuler.GetName]如今可以断言，战争与毁灭所留下的精神污痕已从[ROOT.GetCountry.GetAdjective]国的肌理中彻底清除。\n\n世人公认，[ROOT.GetCountry.GetRuler.GetFirstName]所统治的乃一片#E 净土#!，后世必将学习并效仿之。"
 me_chinese_empire_22_title:0 "$missions_chinese_empire_task_22$"
 me_chinese_empire_23.a:0 "荣耀尽归于[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族与[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetFirstName]！"
 me_chinese_empire_23_desc:0 "历经多年辛劳，光荣的[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]终于完成了[ROOT.GetCountry.GetRuler.GetSheHe]许久之前便立志达成的全部改革。\n\n在[ROOT.GetCountry.GetName]的广袤土地上，[ROOT.GetCountry.GetRuler.GetFirstName]被赞颂为统治#E 中原#!的所有[ROOT.GetCountry.GetRulerTitle]中最伟大的一位。[ROOT.GetCountry.GetRuler.GetFirstName]心中毫不怀疑，自己已改变了历史进程。城镇繁荣，军队守护和平，贸易源源不断流入[ROOT.GetCountry.GetCapital.GetName]，合乎礼法的宗教仪式得以遵行，我朝文明之光普照万邦。"
 me_chinese_empire_23_title:0 "$missions_chinese_empire_task_23$"
 me_chinese_empire_24.a:0 "功劳当归勤劳百姓"
 me_chinese_empire_2400.a:0 "尔所行至关重要——须知"
 me_chinese_empire_2400_desc:0 "长久以来反复斟酌之后，[ROOT.GetCountry.GetRuler.GetName]终于下定决心，开凿一条连接#E 湘江#!与#E 漓江#!的运河。这一浩大工程需动用成千上万的劳力，所幸[ROOT.GetCountry.GetName]拥有足够的人力来完成此壮举。"
 me_chinese_empire_2400_title:0 "$missions_chinese_empire_task_24$"
 me_chinese_empire_24_desc:0 "就连[ROOT.GetCountry.GetRuler.GetName]也惊异于#E 灵渠#!之成功——它迅速成为[ROOT.GetCountry.GetName]百姓赖以通行的重要水道。\n\n这条被平民百姓冠以'#E 魔幻运河#!'之称的水道，为这一地区带来了贸易与旅人——人数之多，竟需兴建一座城市来容纳。[ROOT.GetCountry.GetRuler.GetFirstName]因建造如此杰作之远见卓识，备受世人称颂[ROOT.GetCountry.GetRuler.GetHerHis]。"
 me_chinese_empire_24_title:0 "$missions_chinese_empire_task_24$"
 me_chinese_empire_2_desc:0 "一日清晨，[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]向[ROOT.GetCountry.GetRuler.GetHerHis]的谋臣们解释[ROOT.GetCountry.GetRuler.GetSheHe]为何要革新[ROOT.GetCountry.GetName]的律法。\n\n'多年来，这片土地上唯一的真正权威便是暴力——黎民百姓不得不忍受暴虐军阀的肆意蹂躏。我亲眼读过多少奏报，记载着横行之军掠取一省之粮？此等禽兽之行，我绝不姑息！[ROOT.GetCountry.GetName]将成为一片法治之地，地主遭受侵害时将得到公平补偿——受屈者可在法廷中寻求公道。凡愿做昌盛帝国之公民者，其梦想皆可成真！难道我不曾证明万事皆有可能？'\n\n此言一出，满朝文武皆俯首致敬。"
 me_chinese_empire_2_title:0 "$missions_chinese_empire_task_2$"
 me_chinese_empire_3.a:0 "高墙筑睦邻……"
 me_chinese_empire_3_desc:0 "在[ROOT.GetCountry.GetName]全境，[ROOT.GetCountry.GetRuler.GetName]将历代君王与诸侯所建的城墙与堡垒体系加以扩建，其殷切期望便是保护[ROOT.GetCountry.GetAdjective]人民免受蛮夷入侵的威胁。\n\n当来自[ROOT.GetCountry.GetCapital.GetName]的工匠们抵达各地行省的驻地时，[ROOT.GetCountry.GetRulerTitle]心中充满慰藉，深知我朝百姓将安享多年太平。"
 me_chinese_empire_3_title:0 "$missions_chinese_empire_task_3$"
 me_chinese_empire_4.a:0 "万邦臣服天子之威"
 me_chinese_empire_4_desc:0 "尽管诸多文明之地已被纳入[ROOT.GetCountry.GetName]和谐的怀抱，然而我国边境上的蛮夷王国却垂涎于[ROOT.GetCountry.GetRuler.GetName]的财富，狂妄地以为凭[ROOT.GetCountry.GetRuler.GetHerHis]武力便可肆意夺取而不受惩罚。\n\n他们哪里知道，[ROOT.GetCountry.GetRuler.GetFirstName]也早已大胆布局——[ROOT.GetCountry.GetAdjective]大军即将挺进草原，在蛮族自家地盘上向其挑战。"
 me_chinese_empire_4_title:0 "$missions_chinese_empire_task_4$"
 me_chinese_empire_5.a:0 "南方必须降服！不容边境有犯"
 me_chinese_empire_5_desc:0 "南方丛林自古以来便是#E 越#!部族的领地，如今他们被迫向[ROOT.GetCountry.GetName]的威势俯首称臣。\n\n帝国大军不仅已控制了许多省份，更已备好进一步的领土主张，遥远的地区也已有[ROOT.GetCountry.GetAdjective]殖民者定居。无论用何种手段，我朝之民必将夺取这片土地——无人可挡。"
 me_chinese_empire_5_title:0 "$missions_chinese_empire_task_5$"
 me_chinese_empire_6.a:0 "一切按计进行"
 me_chinese_empire_6_desc:0 "远在南方征战的将军们已向[ROOT.GetCountry.GetCapital.GetName]发回消息。他们称未遇任何真正的抵抗，只要有足够时间，我军将清除该地区残存的部族。殖民者已抵达#E 交阯#!地区，我朝百姓已开始为自己建造家园与聚落。"
 me_chinese_empire_6_title:0 "$missions_chinese_empire_task_6$"
 me_chinese_empire_7.a:0 "遣使开化边民"
 me_chinese_empire_7_desc:0 "南方的战事距[ROOT.GetCountry.GetCapital.GetName]极为遥远，然而每日清晨，都有一系列奏报送达[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]手中，其对这场冲突抱有浓厚的个人兴趣。\n\n军事顾问禀告[ROOT.GetCountry.GetRuler.GetFirstName]，山中部族正在被逐一降服，但当地百姓迫切需要[ROOT.GetCountry.GetAdjective]文明的教化影响。深知必行之策，[ROOT.GetCountry.GetRulerTitle]当日便颁布了如下诏令。"
 me_chinese_empire_7_title:0 "$missions_chinese_empire_task_7$"
 me_chinese_empire_8.a:0 "欢迎来新家，诸卿……开始工作吧"
 me_chinese_empire_8_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的手笔，可见于刚在[ROOT.GetCountry.GetName]境内全面推行的#E 科举制度#!之中，因为这位英明的统治者殷切期望，国家的官僚体系中能尽是真才实学之士。\n\n精通国家律法是必须的，但[ROOT.GetCountry.GetRuler.GetFirstName]希望其臣僚皆为通才，故而应试者必须熟读经典，且能背诵圣贤之著述。\n\n自科举实施以来，已有许多人试图通过，但并非人人都能通过那严苛的层层考试。令[ROOT.GetCountry.GetRuler.GetFirstName]感到欣慰的是，首批及第的士子已抵达京城，准备为国效力。"
 me_chinese_empire_8_title:0 "$missions_chinese_empire_task_8$"
 me_chinese_empire_9.a:0 "愿此路利民"
 me_chinese_empire_90.a:0 "夙愿终成——真正工作方始"
 me_chinese_empire_90_desc:0 "历经多年毁灭性的战火，死亡与劫难遍布#E 中原#!全境之后，[ROOT.GetCountry.GetRuler.GetName]击败了所有其他争夺王位的对手，确立了[ROOT.GetCountry.GetRuler.GetHerHim]self为全中国真正的[ROOT.GetCountry.GetRulerTitle]。\n\n然而，获得#E 天命#!只是成功的一半；守住天命则完全是另一回事。若[ROOT.GetCountry.GetRuler.GetFirstName]期望[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族被铭记为#E 中国#!有史以来最伟大的统治者，那么尚有许多事需得完成。"
 me_chinese_empire_90_title:0 "中华帝国"
 me_chinese_empire_90_use_mandate_mechanic:0 "为了以一位合格的#Y 皇帝#!之名垂青史，我们必须运用#T 天命机制#!来完成此任务树。\n\n要访问这些仅为#Y 天子#!所用的特殊互动，请点击#T 天朝视图#!。"
 me_chinese_empire_9_desc:0 "[ROOT.GetCountry.GetRuler.GetName]所要求的#E 驰道#!体系已然竣工，[ROOT.GetCountry.GetName]全境皆受益于此举措，它对于连接帝国边远角落厥功至伟。\n\n帝国大军不仅可以迅速抵达境内任何动乱之地，商贾与旅人也同样利用这些官道为己所用。简而言之，各地繁荣昌盛，人人皆感激[ROOT.GetCountry.GetRulerTitle]投资于基础设施。"
 me_chinese_empire_9_title:0 "$missions_chinese_empire_task_9$"
 meritocracy_corruption_mod:0 "尚贤抑腐"
 missions_chinese_empire:0 "中国"
 missions_chinese_empire_BUTTON_TOOLTIP:0 "天命唯归有德者！"
 missions_chinese_empire_CRITERIA_DESCRIPTION:0 "吾等凭借[ROOT.GetCountry.GetRulerTitle]之尊位，改善臣民生活，为#E 中原#!带来安宁与秩序之时，此任务即告达成。"
 missions_chinese_empire_DESCRIPTION:0 "历经多年惨烈战事，新#E皇帝#!已登#E中原#!大位，开创可延续数百年之新朝。\n\n然天下皆知，自[ROOT.GetCountry.GetCapital.GetName]之街巷至大地西极之蛮荒，唯有德配其位之[ROOT.GetCountry.GetRulerTitle]，方能承受#E天命#!。若[ROOT.GetCountry.GetRuler.GetName]欲使[ROOT.GetCountry.GetRuler.GetHerHis]名号载入中原史册，永世为人铭记为此土前所未有之明君，则[ROOT.GetCountry.GetRuler.GetSheHe]须为将临之伟业做好万全准备。"
 missions_chinese_empire_task_1:0 "改革户籍"
 missions_chinese_empire_task_10:0 "兵马俑"
 missions_chinese_empire_task_10_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]颁旨，须于[ROOT.GetCountry.GetName]境内修建一座配得上首位#Y华夏帝王#!遗骨之#Y皇陵#!。[ROOT.GetCountry.GetRulerTitle]更诏令将一支#T兵马俑#!大军置入[ROOT.GetCountry.GetRuler.GetHerHis]陵墓之中。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 missions_chinese_empire_task_10_first_emperor_dead:0 "华夏始皇帝驾崩。"
 missions_chinese_empire_task_10_terracotta_army:0 "吾等将建一座兵马俑护卫之陵墓。"
 missions_chinese_empire_task_11:0 "西遣使节"
 missions_chinese_empire_task_11_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]自商旅口中听闻西方有骏马@steppe_horses!，神骏非凡。此等传说中之坐骑兼具无双之美与蓬勃生机，世称#T天马#!。[ROOT.GetCountry.GetRulerTitle]降旨务必将此异兽献于[ROOT.GetCountry.GetName]，已遣使西行。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 missions_chinese_empire_task_11_chancellor_12:0 "我之丞相魅力至少为12。"
 missions_chinese_empire_task_11_send_envoys_to_get_horses:0 "吾等将遣使以获取天马。"
 missions_chinese_empire_task_12:0 "天马"
 missions_chinese_empire_task_12_DESC:0 "终于，#T天马#!@steppe_horses!已归[ROOT.GetCountry.GetName]所有！吾等已将此非凡坐骑收为己用，我军骑兵与弓骑手之威力空前绝后！\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 missions_chinese_empire_task_13:0 "朝鲜王国"
 missions_chinese_empire_task_13_DESC:0 "#E朝鲜#!王国曾为吾等边境之一方强邦，然今已时至拆解其残余诸国、将其并入吾等为#E中原#!所带来之辉煌[ROOT.GetCountry.GetAdjective]太平秩序之中。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 missions_chinese_empire_task_13_claims:0 "吾将获取#Y 辰#!地区所有省份之宣称。"
 missions_chinese_empire_task_14:0 "瓯雒王国"
 missions_chinese_empire_task_14_DESC:0 "吾等风闻#E瓯雒#!之民及其称雄之志，[ROOT.GetCountry.GetRuler.GetName]获悉其实力之深，印象深刻。然于彼等而言不幸者，毁灭其新兴文明之时已至——吾等必须成为此域唯一之执掌者。\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 missions_chinese_empire_task_14_claims:0 "吾将获取#Y 麒麟#!与#Y 都提空山#!区域之宣称。"
 missions_chinese_empire_task_15:0 "丝绸与盐"
 missions_chinese_empire_task_15_10_slave_estates_on_salt:0 "吾等至少有10个拥有奴隶庄园且产出盐贸易品之省份。"
 missions_chinese_empire_task_15_10_slave_estates_on_silk:0 "吾等至少有10个拥有奴隶庄园且产出丝绸贸易品之省份。"
 missions_chinese_empire_task_15_DESC:0 "吾等丝绸@silk!作坊与盐@salt!场以金银币帛之海充盈[ROOT.GetCountry.GetName]之国库——不惟产出民生必需之大量盐斤，更以远销文明世界之华美丝绸名扬四海。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 missions_chinese_empire_task_16:0 "尚贤任能"
 missions_chinese_empire_task_16_DESC:0 "吾等已摒弃任人唯亲之阴暗诱惑，确保唯有最优秀之人选方能于#Y皇朝官僚体系#!中谋得一官半职。[ROOT.GetCountry.GetRuler.GetName]拒不受理各省总督之子凭门荫求取肥缺之请，坚持倚重唯才是举之制。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 missions_chinese_empire_task_16_officers_have_10_in_main_attribute:0 "我之所有官员在其主要属性上至少拥有10点技能。"
 missions_chinese_empire_task_16_researchers_have_10_in_main_attribute:0 "我之所有研究者在其主要属性上至少拥有10点技能。"
 missions_chinese_empire_task_17:0 "大郡制"
 missions_chinese_empire_task_17_DESC:0 "非但[ROOT.GetCountry.GetName]全境驻有兵卒，[ROOT.GetCountry.GetRuler.GetName]更坚令兴建#E法庭#!，使其兼作军中#T大将军幕府#!。[ROOT.GetCountry.GetRulerTitle]坚称如此编列郡守之法，必将大有裨益。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 missions_chinese_empire_task_17_bing:0 "并州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_ji:0 "冀州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_jing:0 "荆州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_qing:0 "青州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_xu:0 "徐州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_yang:0 "扬州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_yong:0 "雍州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_you:0 "幽州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_17_yu:0 "豫州区域每一地区至少有一座法庭建筑。"
 missions_chinese_empire_task_18:0 "内圣之道"
 missions_chinese_empire_task_18_DESC:0 "何国可与泱泱[ROOT.GetCountry.GetName]比肩？[ROOT.GetCountry.GetRuler.GetName]已开启太平盛世之纪元；仓廪丰实，万民安乐，举目四望，无处不见内在之圆满。\n\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 missions_chinese_empire_task_18_no_character_disloyal:0 "无任何人物心怀不忠。"
 missions_chinese_empire_task_19:0 "丝绸之路"
 missions_chinese_empire_task_19_DESC:0 "吾等深知四海之内对吾方丝绸@silk!出口之渴求——来自西方之钱币源源不绝，因蛮王之子嗣皆喜以丝绸衣裳裹身。让吾等尽产此稀世织品——蚕虫所吐者，金线也。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil11!"
 missions_chinese_empire_task_1_DESC:0 "既已掌控#E中华帝国#!，吾等须举行户籍清查，以全然洞悉[ROOT.GetCountry.GetName]之国力。统一之战于乡野间刻下斑驳印痕，百废待兴，尤以革新吏治为要。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 missions_chinese_empire_task_2:0 "帝国基石"
 missions_chinese_empire_task_20:0 "造纸之兴"
 missions_chinese_empire_task_20_DESC:0 "吾等作坊已造出#E纸#!，此物作为书写载体极为便利，[ROOT.GetCountry.GetRuler.GetName]已下令将大量纸张送至[ROOT.GetCountry.GetCapital.GetName]。\n\n\n\n\n\n\n\n\n\n\n@italic_mil18!"
 missions_chinese_empire_task_21:0 "东航"
 missions_chinese_empire_task_21_DESC:0 "既已称雄陆上，[ROOT.GetCountry.GetRuler.GetName]昭示天下，[ROOT.GetCountry.GetName]之民亦将驾驭海洋。遣我水手东渡之时已至。\n\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 missions_chinese_empire_task_21_claims:0 "吾将获取#Y 吕宋#!与#Y 熊袭#!区域之宣称。"
 missions_chinese_empire_task_22:0 "净土"
 missions_chinese_empire_task_22_20_shrines:0 "吾等至少有20个拥有神社建筑之省份。"
 missions_chinese_empire_task_22_30_temples:0 "吾等至少有30个拥有大神殿建筑之省份。"
 missions_chinese_empire_task_22_DESC:0 "诸多蛊惑民心之异端邪教终在[ROOT.GetCountry.GetName]全境被根除殆尽——[ROOT.GetCountry.GetRuler.GetName]已行仪式净化国土，恢复与天地宇宙之和谐。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 missions_chinese_empire_task_23:0 "天命"
 missions_chinese_empire_task_23_DESC:0 "显而易见，#T天意#!对[ROOT.GetCountry.GetRuler.GetName]之成就与作为深表嘉许，[ROOT.GetCountry.GetRuler.GetName]忠诚引领[ROOT.GetCountry.GetName]之民步入空前繁荣之时代。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 missions_chinese_empire_task_24:0 "灵渠"
 missions_chinese_empire_task_24_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]已下令开凿运河，连接#E湘江#!与#E漓江#!。[ROOT.GetCountry.GetRulerTitle]期望此水道可用于输送谷物@grain!。\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 missions_chinese_empire_task_2_DESC:0 "公平治理帝国之基石在于法治，在[ROOT.GetCountry.GetRuler.GetName]主持之下，正义与和谐之感已重归[ROOT.GetCountry.GetName]。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 missions_chinese_empire_task_3:0 "扩建长城"
 missions_chinese_empire_task_3_DESC:0 "蛮族入侵之威胁始终存在，[ROOT.GetCountry.GetRuler.GetName]绝不愿目睹[ROOT.GetCountry.GetRuler.GetHerHis]帝国遭野蛮草原骑手蹂躏。增筑防御工事，于边墙之上布置守卒，否则吾等将陷于困境！\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 missions_chinese_empire_task_4:0 "游牧边疆"
 missions_chinese_empire_task_4_DESC:0 "诚然，吾等掌控着辽阔之西部草原，然而此等广袤疆土不过是通往浩瀚边疆之门——彼处乃可怖游牧民族之故土，其常如乌云般现身于地平线。即便我东方诸省亦岌岌可危……此番便让吾等主动出击。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 missions_chinese_empire_task_4_claims:0 "吾等将获得#Y辽西#!、#Y辽东#!、#Y乐浪#!、#Y临屯#!及#Y玄菟#!诸郡之宣称。"
 missions_chinese_empire_task_5:0 "百越诸部"
 missions_chinese_empire_task_5_DESC:0 "南方#E越族#!素来滋扰不断，然如今[ROOT.GetCountry.GetRuler.GetName]终有余力着手解决与这些争执不休之部族间之问题，[ROOT.GetCountry.GetRulerTitle]立誓南方沿海必归我有。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 missions_chinese_empire_task_5_claims:0 "吾等将获得#Y南海#!、#Y桂阳#!、#Y合浦#!、#Y珠崖#!及#Y苍梧#!诸郡之宣称。"
 missions_chinese_empire_task_5_thirty_pops_appear_in_yang:0 "扬越之地将得开垦。"
 missions_chinese_empire_task_6:0 "南溟之滨"
 missions_chinese_empire_task_6_DESC:0 "人烟稀少之南部沿海地带若并入[ROOT.GetCountry.GetName]版图，必将锦上添花——派我移民前往该地之时已至。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 missions_chinese_empire_task_6_claims:0 "吾等将获得#Y朱提#!、#Y兴古#!、#Y益州#!、#Y越巂#!及#Y牂柯#!诸郡之宣称。"
 missions_chinese_empire_task_6_thirty_pops_appear_in_jiao:0 "交阯之地将得开垦。"
 missions_chinese_empire_task_7:0 "山中之族"
 missions_chinese_empire_task_7_DESC:0 "山中诸民虽素有疑惧外人之名，然其已别无选择——彼等皆为[ROOT.GetCountry.GetName]之臣民，不可再游离于我国之外。其归化我道统之时已至，纵然彼等抗拒我之努力。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 missions_chinese_empire_task_7_every_province_in_nanzhong:0 "南中地区所有己方省份获得："
 missions_chinese_empire_task_8:0 "察举之制"
 missions_chinese_empire_task_8_DESC:0 "为确保唯有[ROOT.GetCountry.GetName]境内最优异博学之士方能任职于#Y皇朝官僚体系#!，[ROOT.GetCountry.GetRuler.GetName]坚令设立正式之#Y科举考试制度#!，以经典学识考核诸生。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 missions_chinese_empire_task_9:0 "修筑驰道"
 missions_chinese_empire_task_9_DESC:0 "偌大帝国若城邑领土彼此隔绝，又有何用？让吾等修建#Y驰道#!，将辉煌[ROOT.GetCountry.GetName]之偏远诸省联为一体。\n\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 missions_chinese_empire_task_9_province_has_road:0 "该省份至少有一条道路。"
 pure_land_china:0 "净土"
 restored_wall_empire_missions:0 "万里长城"

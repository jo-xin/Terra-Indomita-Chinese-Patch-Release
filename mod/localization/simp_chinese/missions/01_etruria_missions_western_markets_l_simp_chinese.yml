 desc_etruscan_troops_trained_in_ocean_mod:0 "我们的海军与利古里亚舰队一起学习,掌握了他们熟练的战术。"
 desc_etruscan_tyrrhenian_iron_trade_mod:0 "第勒尼安富产的铁矿正以意想不到的方式促进我们的经济。"

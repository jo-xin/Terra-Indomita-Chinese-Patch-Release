 etruscan_tyrrhenian_iron_trade_mod:0 "第勒尼安海的铁贸易"
 etruscan_velathri_marble_mod:0 "威拉忒拉的大理石矿"
 etruscan_western_markets_alalia_metalworking_mod:0 "阿拉利亚金属工匠"
 etruscan_western_markets_southern_corisca_mod:0 "南科西嘉贸易中心"
 me_etruria_wm_1.a:0 "贸易航线必须保持畅通 - 我们别无选择"
 me_etruria_wm_10.a:0 "相信我们会为你找到事做的，[SCOPE.sCharacter('etruscan_rodonos_advisor').GetFirstName]"
 me_etruria_wm_10_desc:0 "当我们伊特鲁里亚的军队首次进入#E 西纳格纳提亚#!省时，人们担心当地人会竭尽全力抵抗我们的统治，然而事实并非如此；相反，萨卢维亚的精英们欢迎我们的到来，感谢我们强大的力量保护他们免受邻近部落的愤怒。\n\n为了表示善意，一位名叫[SCOPE.sCharacter('etruscan_rodonos_advisor').GetName]的蛮族贵族被派往[ROOT.GetCountry.GetCapital.GetName]，希望能为伊特鲁里亚提供帮助。这让[ROOT.GetCountry.GetRuler.GetName]非常高兴，[ROOT.GetCountry.GetRuler.GetHerHis]将此视为蛮族完全臣服的最终标志。                                                                      "
 me_etruria_wm_10_title:0 "$01_etruria_missions_western_markets_task_10$"
 me_etruria_wm_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_10$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_11.a:0 "任何欢迎这些海盗的城邦都是伊特鲁里亚的敌人!\""
 me_etruria_wm_11_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您会很高兴得知#E 巴利阿里群岛#!已落入我们手中。我们胜利的舰队轻而易举地击溃了敌人分散的船队。失去家园对这些岛民来说是一场灾难，许多人逃往邻近的港口，发誓要报复[ROOT.GetCountry.GetName]。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]向#E 伊特鲁里亚元老院#!保证，无论这些暴徒逃到哪里，都将被彻底剿灭。弥漫着甜美大麻香味的巴利阿里微风吹拂着我们的船帆，我们的海军将毫不费力地追捕这些难民。"
 me_etruria_wm_11_title:0 "$01_etruria_missions_western_markets_task_11$"
 me_etruria_wm_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_11$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_12.a:0 "让我们用这笔钱在赫拉克勒斯之柱附近建立一个海军前哨站"
 me_etruria_wm_12.b:0 "我们将接受新兄弟的慷慨礼物"
 me_etruria_wm_12_desc:0 "我们舰队成功航行到遥远西方的#E 赫拉克勒斯之柱#!，这对我们的水手来说是一项多么伟大的成就！这一政治上的胜利为[ROOT.GetCountry.GetRuler.GetName]赢得了伊特鲁里亚人民的爱戴！\n\n当地人热情地迎接了我们的探险者，带他们参观了[GetProvince('(int32)3061').GetName]城的各个角落，并举行盛大的宴会来欢迎我们。据说他们还准备了一份丰厚的礼物要送回[ROOT.GetCountry.GetCapital.GetName]，希望我们两国永远是亲密的朋友。"
 me_etruria_wm_12_title:0 "$01_etruria_missions_western_markets_task_12$"
 me_etruria_wm_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_12$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_13.a:0 "拆毁所有建筑,把黄金带回家"
 me_etruria_wm_13.b:0 "我们将在前福凯亚的领地上建立殖民地"
 me_etruria_wm_13_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的另一个功绩是，我们的战士又为[ROOT.GetCountry.GetName]夺取了两个省份。尽管软弱的希腊人拼命抵抗，但[GetProvince('(int32)12').GetName]和[GetProvince('(int32)285').GetName]最终还是无法抵挡我们，被迫向我们的军队敞开大门。\n\n但现在，我们需要做出选择：我们应该彻底摧毁他们复兴#E 福凯亚#!的梦想，还是应该在他们的基础上重建？"
 me_etruria_wm_13_title:0 "$01_etruria_missions_western_markets_task_13$"
 me_etruria_wm_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_13$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_14.a:0 "我太兴奋了——愿诸神与你们同在!"
 me_etruria_wm_14_desc:0 "[ROOT.GetCountry.GetRuler.GetName]一直在默默地痴迷于一个故事，这个故事是[ROOT.GetCountry.GetRuler.GetSheHe]从居住在#E 赫拉克勒斯之柱#!的朋友那里听说的。几周前，一艘破败不堪的图耳得塔尼亚船只返回了它在伊比利亚的家乡，吹嘘说它发现了传说中的#E 幸运群岛#!，现在该地区的每个人都在考虑向西航行。\n\n虽然[ROOT.GetCountry.GetCapital.GetName]的许多人认为寻找这些岛屿是愚蠢的行为，但[ROOT.GetCountry.GetRuler.GetFirstName]已经筹集了必要的资金，希望能派出一支探险队重现图耳得塔尼亚商人的成功。"
 me_etruria_wm_14_title:0 "$01_etruria_missions_western_markets_task_14$"
 me_etruria_wm_14_tooltip:0 "#Y 事件将继续……#!"
 me_etruria_wm_15.a:0 "如果市民们快乐，那么我也高兴"
 me_etruria_wm_15_desc:0 "虽然[GetProvince('(int32)3515').GetName]的城墙上到处都是粗俗的涂鸦，但最近，当地的“艺术家们”一直在画那些冒着生命危险排干城市西边沼泽的勇敢工人的漫画——这是一个令人愉快的变化，不同于往常涂鸦在每个可用表面上的政治口号和关于精英们的下流八卦。\n\n我们巡逻的士兵经常驻足在繁忙的街道上，对着一群手持铁锹、水桶和绳索而不是长矛前进的劳动者形象咯咯地笑着。从最卑微的乞丐到最富有的政务官，城里的每个人都在谈论[ROOT.GetCountry.GetRuler.GetName]的名字，他们不停地歌颂我们体贴的[ROOT.GetCountry.GetRulerTitle]。"
 me_etruria_wm_15_title:0 "$01_etruria_missions_western_markets_task_15$"
 me_etruria_wm_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_15$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_16.a:0 "这是一个荒谬的要求，但我们相信我们在阿拉利亚的眼线"
 me_etruria_wm_16.b:0 "我们绝对不会这么做"
 me_etruria_wm_16_desc:0 "我们收到了[GetProvince('(int32)3515').GetName]首席行政官的一份不容忽视的报告。这位直接向[ROOT.GetCountry.GetRuler.GetName]汇报的官员声称，#E 科西嘉#!岛上存在着我们不应忽视的紧张局势——许多岛民希望摆脱伊特鲁里亚的统治,宣布独立。\n\n当被问及如何才能最好地避免这场灾难时，这位行政官建议我们给予#E 科西嘉人#! #E 公民权#!，以平息他们的骚乱。"
 me_etruria_wm_16_title:0 "$01_etruria_missions_western_markets_task_16$"
 me_etruria_wm_16_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_16$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_17.a:0 "我们岛上的工业确实令人印象深刻"
 me_etruria_wm_17_desc:0 "[GetProvince('(int32)3515').GetName]的铸造厂从不停歇，日复一日地向城市上空排放着难闻的黑烟。\n\n我们的铁匠总是在不停地工作，塑造和提炼我们饥渴的国家迫切需要的基本金属，他们完成一项工作的唯一奖励就是再接到两个相同物品的订单。"
 me_etruria_wm_17_title:0 "$01_etruria_missions_western_markets_task_17$"
 me_etruria_wm_17_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_17$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_18.a:0 "伊特鲁里亚是地中海最强大的力量！"
 me_etruria_wm_18_desc:0 "我们早晚都要将[GetProvince('(int32)2325').GetName]城据为己有——我们太熟悉那些自命不凡的新兴城邦了，[ROOT.GetCountry.GetRuler.GetName]不会重蹈覆辙。\n\n但现在，一切都已尘埃落定，马赛利亚已成为经济链上的重要一环，这条经济链始于[GetProvince('(int32)3515').GetName]，那里的众多作坊将#E 科西嘉#!的木材、基本金属和石头加工成我们在世界各地销售的奢侈品。。\n\n有了我们强大的舰队在这片水域阻挡歹徒，北方贸易航线才得以保证 [ROOT.GetCountry.GetName] 的繁荣。。"
 me_etruria_wm_18_title:0 "$01_etruria_missions_western_markets_task_18$"
 me_etruria_wm_18_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_18$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_19.a:0 "哦，得了吧...情况还没那么糟"
 me_etruria_wm_19_desc:0 "虽然可疑的人物充斥着[ROOT.GetCountry.GetCapital.GetName]和其他许多伊特鲁里亚城市的街道，但普通人除了在首都做生意时紧紧抓住自己的钱袋外，别无他法。\n\n不幸的是,海盗行为和抢劫已成为[ROOT.GetCountry.GetName]的一种生活方式，当局对犯罪活动视而不见，在小巷里被抢劫的危险始终存在。"
 me_etruria_wm_19_title:0 "$01_etruria_missions_western_markets_task_19$"
 me_etruria_wm_19_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_19$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_1_desc:0 "在 #E 第勒尼安海#! 沿岸的港口，强大的伊特鲁里亚舰队日复一日地巡逻，尽最大努力将海盗逐出我们的海岸。\n\n偶尔，一群强盗可能会绕过我们的哨兵，驶入我们的港口并对航运造成破坏，但这种情况不像过去那样常见了。"
 me_etruria_wm_1_title:0 "$01_etruria_missions_western_markets_task_1$"
 me_etruria_wm_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_1$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_2.a:0 "这些少女美丽动人，赏心悦目...多么幸运的一天啊"
 me_etruria_wm_20.a:0 "伊特鲁里亚的生意正在蓬勃发展..."
 me_etruria_wm_20_desc:0 "现在#E 科西嘉#!和#E 撒丁岛#!之间的海峡完全处于伊特鲁里亚海军的保护之下，整个地区都在享受我们的劳动果实。\n\n南部走廊的贸易量激增，这种海上活动的狂热程度只有陆地上造船工人的辛勤工作才能与之媲美。我们的港口不仅为[ROOT.GetCountry.GetName]建造海军，还为富商和航运巨头建造小型贸易船队——每个人都想分一杯羹。"
 me_etruria_wm_20_title:0 "$01_etruria_missions_western_markets_task_20$"
 me_etruria_wm_20_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_20$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_21.a:0 "科西嘉是我们国家的重要组成部分，并且永远都会如此。"
 me_etruria_wm_21.b:0 "让我们满足他们的这个请求，因为这有一定的道理。"
 me_etruria_wm_21_desc:0 "多年来，#E 科西嘉#!已经发生了变化，它不再是[ROOT.GetCountry.GetCapital.GetName]宫廷中的笑柄，而成为一个受人尊敬的地方——来自[GetProvince('(int32)3515').GetName]不再是令人羞耻的事情。\n\n如今，大陆上的精英们流行将自己的儿子送往科西嘉的#E 法律学院#!，希望他们能够接受优质的法律教育，正是这些年轻人在呼吁科西嘉应该拥有自己的政府形式。\n\n这些律师和学者们正在要求获得自治藩属地位，他们认为当地人的利益最好由本地人来代表，并且发誓他们的最终忠诚仍然归属于[ROOT.GetCountry.GetName]。然而，[ROOT.GetCountry.GetCapital.GetName]对此会作何反应，还有待观察。"
 me_etruria_wm_21_title:0 "$01_etruria_missions_western_markets_task_21$"
 me_etruria_wm_21_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_21$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_21_tooltip_2:0 "我们将释放#E 科西嘉#!作为一个藩属。"
 me_etruria_wm_22.a:0 "我们将向海盗水手开放我们的海军，但科西嘉属于我们。"
 me_etruria_wm_22.b:0 "你们将会得到你们的海盗国家，但首先教我一些东西。"
 me_etruria_wm_22.c:0 "我梦想着海盗的生活……"
 me_etruria_wm_22_desc:0 "#E 科西嘉#!上的海盗们并不以胆小著称，所以他们提出的大胆且鲁莽的要求也就不足为奇了。\n\n简而言之，他们希望获得自治藩属的地位，期望这样他们就能随心所欲地进行海盗活动，不再需要像现在这样事事都要请求批准。\n\n选择权在于[ROOT.GetCountry.GetRuler.GetName]，[ROOT.GetCountry.GetRuler.GetHerHim]拥有参议院的全力支持。"
 me_etruria_wm_22_title:0 "$01_etruria_missions_western_markets_task_22$"
 me_etruria_wm_22_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_22$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_22_tooltip_2:0 "#Y 我们将切换到#!#G 海盗科西嘉#!。"
 me_etruria_wm_23.a:0 "这片充满噩梦的土地确实非常有利可图。"
 me_etruria_wm_23_desc:0 "虽然据说[GetProvince('(int32)3507').GetName]的平原是一片被从山上下来的奇怪生物扭曲的土地，但这些愚蠢的故事并没有阻止贪婪的伊特鲁里亚人进入这片区域。他们正在岛上每一寸土地上寻找利润，不受鬼故事的阻碍。\n\n据说他们在那里的矿山是整个#E 科西嘉#!最富饶的之一，他们从地下开采的花岗岩被送往[GetProvince('(int32)3515').GetName]，然后装船运往大陆。"
 me_etruria_wm_23_title:0 "$01_etruria_missions_western_markets_task_23$"
 me_etruria_wm_23_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_23$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_24.a:0 "这可真是最好的消息了！"
 me_etruria_wm_24_desc:0 "我们的[GetProvince('(int32)126').GetName]和[GetProvince('(int32)127').GetName]省之间有一种令人愉快的协同作用，让这些地方的每个人都忙碌不已。伊尔瓦的铁矿@iron!就像一条汩汩流淌的小溪,将矿石源源不断地送入浦普路纳，而浦普路纳在[ROOT.GetCountry.GetName]全国已经以其基本金属@base_metals!和繁忙的港口而闻名。\n\n当我们考虑扩大海外市场和影响力时，我们应该注意到国内的潜力，因为我们可以在大陆上做很多事情来发展我们的工业。"
 me_etruria_wm_24_title:0 "$01_etruria_missions_western_markets_task_24$"
 me_etruria_wm_24_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_24$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_25.a:0 "我们必须保护卢卡矿山免受弗雷塔尼人的侵害！"
 me_etruria_wm_25.b:0 "集中精力投资庇斯纳是更明智的选择"
 me_etruria_wm_25.c:0 "我认为我们现在没有资源来做这件事"
 me_etruria_wm_25_desc:0 "虽然[GetProvince('(int32)136').GetName]的生意做得不错，但还可以做得更好，而麻烦则与[GetProvince('(int32)138').GetName]附近的动荡局势有关。\n\n弗雷塔尼蛮族一直躲在附近的山区，对矿山发动了毁灭性的袭击，杀害我们的奴隶并俘虏其他人。我们可以派一些士兵去解决这个问题，这将确保卢卡世世代代的繁荣，但其他人说我们应该投资庇斯纳——让卢卡人自己解决他们的问题。"
 me_etruria_wm_25_title:0 "$01_etruria_missions_western_markets_task_25$"
 me_etruria_wm_25_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_25$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_26.a:0 "告诉[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]，要满足于他已有的东西"
 me_etruria_wm_26.b:0 "我们将按[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]的要求去做"
 me_etruria_wm_26_desc:0 "[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetName]在伊特鲁里亚社会上层迅速崛起是史无前例的——在我们社会中，还有谁在一生的时间里取得过如此大的成就？\n\n从#E 科西嘉岛#!一个卑微的农民出身，[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]通过努力工作和一点点运气，积累了令人印象深刻的投资组合，拥有[GetProvince('(int32)126').GetName]、[GetProvince('(int32)127').GetName]和[GetProvince('(int32)3515').GetName]的资产。作为[ROOT.GetCountry.GetCapital.GetName]最富有的人之一，[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]甚至成功地与[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族联姻，并一直在利用他新获得的政治关系来发展他的帝国。\n\n最近，[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]扩建了伊尔瓦的采矿基础设施，用优质的伊特鲁里亚矿石淹没了市场，我们的造船工人和盔甲制造商比以往任何时候都更加忙碌——[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]很快就向[ROOT.GetCountry.GetRuler.GetName]提到了这一点，声称他单枪匹马地造就了我们国家目前享受的繁荣时期。\n\n[SCOPE.sCharacter('etruscan_tyrrhenia_iron_magnate').GetFirstName]从不隐藏自己的欲望，他向[ROOT.GetCountry.GetRuler.GetFirstName]提出了一个大胆的要求：他希望得到[GetProvince('(int32)3508').GetName]的港口和[GetProvince('(int32)3513').GetName]的盐田，并向[ROOT.GetCountry.GetRulerTitle]保证，他将为这些资产支付公平的市场价格。"
 me_etruria_wm_26_title:0 "$01_etruria_missions_western_markets_task_26$"
 me_etruria_wm_26_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_26$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_27.a:0 "我希望他们在科西嘉岛上的新生活会让他们兴奋不已..."
 me_etruria_wm_27_desc:0 "从[GetProvince('(int32)14').GetName]到[GetProvince('(int32)3515').GetName]的海上航程相对较短，而且由于我们的沿海城市充满了太多躁动不安的公民，[ROOT.GetCountry.GetCapital.GetName]决定将一些这样的城市居民送往#E 科西嘉#!，希望他们能帮助驯服那片荒野。\n\n阿拉利亚是一个快速发展的城邦，尽管它还有些粗糙，但来自[ROOT.GetCountry.GetName]大陆的移民涌入可能有助于该省的文明发展。过度拥挤的基斯拉现在可以稍微松一口气了，希望当地的行政长官们能够在人口危机变成问题之前解决它。\""
 me_etruria_wm_27_title:0 "$01_etruria_missions_western_markets_task_27$"
 me_etruria_wm_27_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_27$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_28.a:0 "发展当地矿业，因为我们需要这些大理石"
 me_etruria_wm_28.b:0 "花光每一分钱在海岸边建造一座城市并扩大港口区"
 me_etruria_wm_28_desc:0 "虽然每个人都熟悉[GetProvince('(int32)129').GetName]制造的精美大理石雕像@marble!，但很少有人知道这座城市也是国际大理石的主要出口地——这个问题是由于该地区缺乏基础设施造成的。[GetProvince('(int32)128').GetName]的平原没有良好的道路，将石头从城市运到海岸一直是一项艰巨的任务。\n\n但这种情况可能会改变，多亏了[ROOT.GetCountry.GetRulerTitle]，他收到了工程师们的好消息：我们不仅修建了连接城市的新道路，而且建设项目还剩下额外的资金——我们应该如何投资该地区？"
 me_etruria_wm_28_title:0 "$01_etruria_missions_western_markets_task_28$"
 me_etruria_wm_28_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_28$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_29.a:0 "我们要雇佣那个努拉吉杀手"
 me_etruria_wm_29.b:0 "那个博斯普鲁斯吟游诗人是我们的人，但要看好你的钱包"
 me_etruria_wm_29.c:0 "一个斯巴达水手是罕见的，这是个好兆头"
 me_etruria_wm_29.d:0 "伊特鲁里亚人的才能是不可否认的..."
 me_etruria_wm_29_desc:0 "站在[ROOT.GetCountry.GetRuler.GetName]面前的是四位#E 海盗提督#!，每一位都是#E 第勒尼安海#!沿岸的通缉犯。就在一周前，这些逃犯和恶棍在获得临时赦免的承诺下，驶入了[ROOT.GetCountry.GetName]，并在夜间前往[ROOT.GetCountry.GetCapital.GetName]，秘密地向[ROOT.GetCountry.GetRuler.GetFirstName]进行自我介绍。虽然[ROOT.GetCountry.GetRulerTitle]几乎无法抑制住[ROOT.GetCountry.GetRuler.GetHerHis]的蔑视，但所有人都一致认为，这项不光彩的交易将有利于我们的利益——这些人是愿意帮助我们国家的强者。\n\n第一位候选人是一位臭名昭著的努拉吉凶手，名叫[SCOPE.sCharacter('etruscan_western_markets_nuragic_admiral').GetName]，因其残暴的力量和暴力行为而广为人知，为他赢得了“死亡恶臭”这个令人毛骨悚然的绰号，这个绰号像死亡的恶臭一样挥之不去——在地中海各地，有六座城市愿意悬赏捉拿这个野蛮人的头颅。\n\n第二位海盗是一位名叫[SCOPE.sCharacter('etruscan_western_markets_bosporan_admiral').GetName]或#E “指骨”#!的博斯普鲁斯人，他是一位著名的赌徒和传奇的花花公子，一位技艺娴熟的诗人，同时也是一个彻头彻尾的混蛋。尽管有超过一百个人祈祷他死去，但命运女神从未对这个豪赌者吝啬她的眷顾，骰子总是朝着有利于他的方向落下。\n\n第三位海盗有点神秘——一位名叫[SCOPE.sCharacter('etruscan_western_markets_pelop_admiral').GetName]的斯巴达人，他喜欢在海上而不是陆地上作战，放弃了密集阵型，选择了港口。幸运的是，对于我们来说，拉凯代蒙人作为无畏战士的声誉，在战斗中是无与伦比的，在[SCOPE.sCharacter('etruscan_western_markets_pelop_admiral').GetFirstName]身上得到了充分的体现。\n\n最后一位雇佣兵是我们的一位同胞，一个名叫[SCOPE.sCharacter('etruscan_western_markets_etrus_admiral').GetName]的小伙子，他是一个恶作剧天才，选择用他非凡的才能去追求犯罪和放荡的生活，而不是为国家服务。[ROOT.GetCountry.GetRuler.GetFirstName]，不要被他年轻的外表所迷惑——他是一个危险的人物，不值得信任。"
 me_etruria_wm_29_title:0 "剑与船，待价而沽"
 me_etruria_wm_29_tooltip:0 "$mission_completed_tooltip_1$“#Y 剑与船，待价而沽#!”$mission_completed_tooltip_2$"
 me_etruria_wm_2_desc:0 "[ROOT.GetCountry.GetRuler.GetName]正带着[ROOT.GetCountry.GetRuler.GetHerHis]随从穿过[ROOT.GetCountry.GetCapital.GetName]的街道，一阵喧闹引起了[ROOT.GetCountry.GetRuler.GetHerHis]注意。一大群人聚集在主广场上，他们兴奋的议论声越来越大——看来我们的外交官终于从北方回来了，同时带回了承诺的三位#E 利古里亚新娘#!。\n\n这些女士由她们的家族派来，希望她们能嫁给优秀的伊特鲁里亚青年，从而使两国关系更加亲密。当一辆装饰华丽的马车载着她们穿过[ROOT.GetCountry.GetCapital.GetName]的主要街道时，城中洋溢的欢乐气氛令人难以抗拒。\n\n虽然[ROOT.GetCountry.GetRuler.GetFirstName]与利古里亚人建立外交联系主要是出于经济考虑，但[ROOT.GetCountry.GetRulerTitle]因找到了弥合两族隔阂的巧妙办法而备受赞誉。"
 me_etruria_wm_2_title:0 "凯努万的妻子们"
 me_etruria_wm_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_2$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_3.a:0 "我们将永远照顾好在伊特鲁里亚的商人 —— 你们尽可放心。"
 me_etruria_wm_30.a:0 "只要他们不指望得到任何回报..."
 me_etruria_wm_30_desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，有件事您可能会感兴趣。看来#E 伊特鲁里亚人#!越来越熟悉#E 海格力斯之柱#!周围的水域，而且由于他们的商船已经熟悉了我们的港口，他们的商人也熟悉了我们的城市，所以[GetProvince('(int32)3061').GetName]有许多居民和旅行者，他们的母语都是伊特鲁里亚语。\n\n如此多的外国人移民到廷吉，以至于现在城里有一个专门的#E 伊特鲁里亚区#!，但不要担心，[ROOT.GetCountry.GetRuler.GetName]；这些人总有一天会成为优秀的[ROOT.GetCountry.GetAdjective]公民的。"
 me_etruria_wm_30_title:0 "伊特鲁里亚区"
 me_etruria_wm_30_tooltip:0 "$mission_completed_tooltip_1$“#Y 伊特鲁里亚区#!”$mission_completed_tooltip_2$"
 me_etruria_wm_31.a:0 "我们的士兵所到之处都会带来胜利"
 me_etruria_wm_31_desc:0 "我们收到消息，我们派往#E 利古里亚#!北部的征召兵已经到达了我们朋友的安全港口，我们的士兵已经进入了位于文明边缘的山区要塞和岗哨。\n\n虽然许多伊特鲁里亚母亲在看到她们的儿子登上将带他们离开—也许是永远离开的船只时哭泣，但那些回家的人将因这段经历而变得更加坚强——他们在北方的经历，就像他们穿着凉鞋的双脚踩过的山谷道路一样，磨练了他们的意志。"
 me_etruria_wm_31_title:0 "文明边缘的伊特鲁里亚人"
 me_etruria_wm_31_tooltip:0 "$mission_completed_tooltip_1$“#Y 文明边缘的伊特鲁里亚人#!”$mission_completed_tooltip_2$"
 me_etruria_wm_32.a:0 "这对我们的水手来说是一项宝贵的技能"
 me_etruria_wm_32_desc:0 "我们沿海的港口城市看到数十艘船只聚集在他们的水域，因为我们的[ROOT.GetCountry.GetRulerTitle]出资建造的利古里亚舰队已经开始动工了\n\n利古里亚人对这份礼物很满意，尽管他们向[ROOT.GetCountry.GetName]要的是士兵，作为回报，他们教给我们一些他们的海军战术——这对每个人来说都是一个令人满意的结果。"
 me_etruria_wm_32_title:0 "海上狡诈战术"
 me_etruria_wm_32_tooltip:0 "$mission_completed_tooltip_1$“#Y 海上狡诈战术#!”$mission_completed_tooltip_2$"
 me_etruria_wm_33.a:0 "我感到受宠若惊，但也有点尴尬..."
 me_etruria_wm_33_desc:0 "您可能不会相信，[ROOT.GetCountry.GetRuler.GetName]，但我们派往#E 利古里亚人#!的音乐家们从到达的那一刻起就成了镇上的话题——在整个利古里亚从未见过这样的事。\n\n但是...呃...显然，这些吟游诗人表演了一部戏剧，戏剧化地表现了你的生活，我的[ROOT.GetCountry.GetRulerTitle]——这部戏剧的名字叫#E '[ROOT.GetCountry.GetRuler.GetFirstName]史诗'#!，它从您出生的情况开始，详细描述了关于您的一切已知事迹。\n\n据说现在每个人都知道您是谁了；看来您在整个利古里亚都成了名人。"
 me_etruria_wm_33_title:0 "[ROOT.GetCountry.GetRuler.GetFirstName]史诗"
 me_etruria_wm_33_tooltip:0 "任务现已#G 完成#!!"
 me_etruria_wm_34.a:0 "我们将消灭叛军败类，绝不留情！"
 me_etruria_wm_34_desc:0 "来自#E 科西嘉#!的可怕消息，[ROOT.GetCountry.GetRuler.GetName]！该岛宣布自己为自由之地，并屠杀了我们驻扎在城市里的驻军——我们面临一场意料之外的战争！"
 me_etruria_wm_34_title:0 "科西嘉岛起义"
 me_etruria_wm_34_tooltip:0 "#R 我们将宣战#!，目标是已经宣布独立的#Y 科西嘉#!！\n$mission_completed_tooltip_1$“#Y 科西嘉起义#!”$mission_completed_tooltip_2$"
 me_etruria_wm_35.a:0 "攻击当地人，抢走他们的一切！"
 me_etruria_wm_35.b:0 "与当地人交换他们出售的任何东西"
 me_etruria_wm_35_desc:0 "经过数月的航行，期间我们的舰队几乎三次掉头返航，我们疲惫的水手们一天早晨醒来，看到地平线上出现了山峰的轮廓——终于#E 幸运群岛#!向我们绝望的侦察兵们显露了它们的身影。\n\n当我们的舰队靠近海岸时，可以看到一群当地人聚集在海滩上，就好像他们在期待着我们一样。他们在挥舞着色彩鲜艳的织物，欢笑声和歌声在水面上飘荡——毫无疑问，我们可以期待受到友好的接待。\n\n就在这时，探险队的指挥官打开了[ROOT.GetCountry.GetRuler.GetName]发来的密封信，信中写着秘密指示……"
 me_etruria_wm_35_title:0 "陆地！"
 me_etruria_wm_35_tooltip:0 "$mission_completed_tooltip_1$“#Y 陆地！#!”$mission_completed_tooltip_2$"
 me_etruria_wm_36.a:0 "与海盗交战并消灭他们"
 me_etruria_wm_36.b:0 "暂时无视他们的挑衅..."
 me_etruria_wm_36_desc:0 "当我们的舰队从#E 幸运群岛#!返航时，他们被一群海盗尾随。没有哪个利古里亚强盗敢于挑战[ROOT.GetCountry.GetName]在海上的安全通行，我们船上的一个人声称，他认出了敌舰上飘扬的[GetProvince('(int32)1470').GetName]和[GetProvince('(int32)96').GetName]的旗帜。\n\n我们该怎么办？我们的海军可以轻而易举地消灭这些白痴，但我们始终有可能在海上被摧毁——冒这个险值得吗？"
 me_etruria_wm_36_title:0 "来自海盗的压力"
 me_etruria_wm_36_tooltip:0 "$mission_completed_tooltip_1$“#Y 来自海盗的压力#!”$mission_completed_tooltip_2$"
 me_etruria_wm_37.a:0 "皆大欢喜"
 me_etruria_wm_37_desc:0 "我们的船只终于从#E 幸运群岛#!的探险中返回，[ROOT.GetCountry.GetName]的每个人都在惊叹他们的冒险故事。[ROOT.GetCountry.GetRuler.GetName]因领导了这次航行而受到赞扬，许多怀疑这次航行是否明智的人现在也不得不闭嘴了——很明显，众神批准了这次航行，他们的祝福也降临在了这个国家。\n\n所有从岛上带回来的战利品将被暂时陈列在[ROOT.GetCountry.GetCapital.GetName]，这样所有到访伊特鲁里亚首都的人都可以瞻仰我们海军的荣耀。"
 me_etruria_wm_37_title:0 "终于回家了"
 me_etruria_wm_37_tooltip:0 "$mission_completed_tooltip_1$“#Y 终于回家了#!”$mission_completed_tooltip_2$"
 me_etruria_wm_38_tooltip:0 "任务现已#G 完成#!!"
 me_etruria_wm_3_desc:0 "多亏了[ROOT.GetCountry.GetRuler.GetName]的努力，[ROOT.GetCountry.GetName]的商业环境空前繁荣 - 来自[GetProvince('(int32)84').GetName]和[GetProvince('(int32)3256').GetName]的商人经常出现在[ROOT.GetCountry.GetCapital.GetName]，他们悄声询价，寻找最佳的交易机会。\n\n伊特鲁里亚市场开放的消息正在广为传播，我们在国外的声望也因此而熠熠生辉。"
 me_etruria_wm_3_title:0 "$01_etruria_missions_western_markets_task_3$"
 me_etruria_wm_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_3$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_4.a:0 "允许贵族按自己的意愿开展业务"
 me_etruria_wm_4.b:0 "嗯，我们应该按照他们的建议处理 [GetProvince('(int32)141').GetName]。"
 me_etruria_wm_4.c:0 "我想与 [GetProvince('(int32)3549').GetName] 建立直接贸易"
 me_etruria_wm_4_desc:0 "我们对@wine!葡萄酒贸易的主导地位，尤其是在海上贸易方面，可以预见地导致了我们的贸易收入激增，所有有能力的人都在试图分一杯羹。\n\n [ROOT.GetCountry.GetCapital.GetName] 的一群贵族请求允许扩大与北方 #E 利古里亚#! 贵族的联系；这个提议野蛮人认为可以接受，尽管他们希望将我方人员限制在 [GetProvince('(int32)141').GetName] 城内。\n\n然而，[ROOT.GetCountry.GetRuler.GetName] 一直关注着 [GetProvince('(int32)3549').GetName] 港口，认为它比维内里斯港更适合我们的商船。革努阿人承诺的大笔赠款可能与此有关... "
 me_etruria_wm_4_title:0 "$01_etruria_missions_western_markets_task_4$"
 me_etruria_wm_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_4$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_5.a:0 "我们只在革努阿建造一个避难港。"
 me_etruria_wm_5.b:0 "我想我们也负担得起在安提波利斯建造避难港的费用"
 me_etruria_wm_5.c:0 "虽然代价高昂，但陶罗恩提翁也值得考虑。"
 me_etruria_wm_5_desc:0 "既然我们与利古里亚代表敲定了所有细节，[ROOT.GetCountry.GetRuler.GetName] 只需决定 [ROOT.GetCountry.GetName] 国库要资助多少个#E 海盗据点#!。\n\n虽然建造这些罪恶窝点的成本高昂，但长期利益不也容忽视……只是，我们的邻国会怎么想？                                                                       "
 me_etruria_wm_5_title:0 "$01_etruria_missions_western_markets_task_5$"
 me_etruria_wm_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_5$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_6.a:0 "我们有足够的人力来补充他们的征召兵"
 me_etruria_wm_6.b:0 "他们需要的是一支像样的海军，我会为此支付费用"
 me_etruria_wm_6.c:0 "我们将派遣音乐家和歌唱家前往他们的宫廷"
 me_etruria_wm_6.d:0 "目前我们不会再给他们任何东西了"
 me_etruria_wm_6_desc:0 "我们与北方#E 利古里亚人#!的友谊不断加深，我们新结交的伙伴对我们的关系感到非常安心，因此请求我们提供帮助。\n\n他们和我们一样，担心居住在#E 滨海阿尔卑斯山#!以北的蛮族，想知道我们是否能派一些士兵帮助他们巡逻山口。\n\n尽管[ROOT.GetCountry.GetRuler.GetName]看到了这个提议的价值，但[ROOT.GetCountry.GetRulerTitle]正在考虑加强利古里亚的海军力量，因为开放自由的贸易航线对该地区的每个人都至关重要，如果利古里亚人能尽自己的一份力就更好了。\n\n另一个选择是派遣歌手和诗人前往他们的宫廷，以示友好；每个人都欣赏精彩的朗诵，而我们伊特鲁里亚的演说家是世界上最优秀的。                                                                    "
 me_etruria_wm_6_title:0 "$01_etruria_missions_western_markets_task_6$"
 me_etruria_wm_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_6$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_6_tooltip_2:0 "#Y 事件链将继续...#!"
 me_etruria_wm_7.a:0 "让我们聘请他们的一位船长吧"
 me_etruria_wm_7.b:0 "这些海盗头目应该将他们的技术传授给我们的水手"
 me_etruria_wm_7_desc:0 "由于我们与 #E 利古里亚海盗#! 之间关系融洽，我们的犯罪同伙给予了我们一项莫大的荣誉：一份我们可以自行选择的的政治礼物。\n\n如果我们愿意，四位传奇的 #E 海盗将领#! 将秘密抵达 [ROOT.GetCountry.GetCapital.GetName]，亲自向 [ROOT.GetCountry.GetRuler.GetName] 效忠。当然，我们也可以派这四个人去训练我们的海军，学习海盗战术——最终的选择权掌握在 [ROOT.GetCountry.GetRuler.GetFirstName] 手中。"
 me_etruria_wm_7_title:0 "$01_etruria_missions_western_markets_task_7$"
 me_etruria_wm_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_7$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_7_tooltip_2:0 "#Y 十天后，我们将有权从四位候选人中选择一位#T 海盗将领#!为我军效力。#!"
 me_etruria_wm_8.a:0 "利古里亚人应该拥抱我们优越的伊特鲁里亚文化"
 me_etruria_wm_8.b:0 "利古里亚人确实应该获得公民身份"
 me_etruria_wm_8.c:0 "从今天起，我将建立 #E 伊特鲁里亚的利古里亚 #!"
 me_etruria_wm_8_desc:0 "在过去几年里，我们伊特鲁里亚社会与北方 #E 利古里亚人#! 的联系日益密切；由于我们精英家族之间的通婚，甚至可以说我们已经成为亲族。\n\n尽管 [ROOT.GetCountry.GetCapital.GetName] 内部有许多声音希望维持现状，但 [ROOT.GetCountry.GetRuler.GetName] 一直在考虑就是否要永久改变这些蛮族的地位做出决定。"
 me_etruria_wm_8_title:0 "$01_etruria_missions_western_markets_task_8$"
 me_etruria_wm_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_8$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_8_tooltip_2:0 "我们将创建一个#E 藩属国#!"
 me_etruria_wm_9.a:0 "我们应该与马赛人交易铁矿并进行侦察…"
 me_etruria_wm_9.b:0 "我们的商船将沿着 #E 罗达努斯河#! 航行，出售双耳陶罐\""
 me_etruria_wm_9.c:0 "派遣入侵舰队前往 [GetProvince('(int32)2325').GetName] 的港口!"
 me_etruria_wm_9_desc:0 "我们对周围的 #E 西方希腊人#! 的殖民地再熟悉不过了，其中 [GetProvince('(int32)2325').GetName] 仍然是他们最珍视的领地之一。然而，随着我们的贸易如同夏日干旱时的野火般蔓延，我们的势力范围似乎开始相互碰撞，造成的摩擦甚至在 [ROOT.GetCountry.GetCapital.GetName] 都能感受到。\n\n尽管 [ROOT.GetCountry.GetRuler.GetName] [ROOT.GetCountry.GetRuler.GetHerHis] 的案头已经堆满了事务，我们也不能忽视北方的威胁。但是，我们对该地区的首次进军是应该保持经济性质，还是应该调动兵力前进？"
 me_etruria_wm_9_title:0 "$01_etruria_missions_western_markets_task_9$"
 me_etruria_wm_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $01_etruria_missions_western_markets_task_9$#!”$mission_completed_tooltip_2$"
 me_etruria_wm_9_tooltip_2:0 "我们将获得#E 滨海阿尔卑斯#!省份的宣称。"
 piracy_amnesty_tt:0 "我们拥有 #Y 招安海盗#! #T 军事科技#!。"
 pleased_etruscan_nobility_mod:0 "满意的上层阶级"
 tacking_invention_tt:0 "#Y 我们拥有#!#T 戗风行驶#!#Y 军事科技#!。"
 treasure_fortunate_isles_etruscan:0 "幸运群岛的雕刻神像"
 treasure_fortunate_isles_etruscan_desc:0 "这尊精美的骨雕是由远在西方的幸运群岛上的原住民雕刻而成。据说，任何供奉它的神龛都会带来繁荣。"

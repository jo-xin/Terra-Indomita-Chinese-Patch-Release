l_simp_chinese:
 01_etruria_missions_western_markets:0 "西方市场"
 01_etruria_missions_western_markets_BUTTON_TOOLTIP:0 "我们将使我们的船尽其所能地远航，在任何我们能找到的地方寻求财富和荣耀。"
 01_etruria_missions_western_markets_CRITERIA_DESCRIPTION:0 "当#E 伊特鲁里亚#!与西方富裕的城市和市场建立起贸易联系，将军事与经济影响扩张到这些重要的地区时，此使命完成。"
 01_etruria_missions_western_markets_DESCRIPTION:0 "我们西方的众多市场无疑带来诸多挑战，但也同样蕴藏着机遇，[ROOT.GetCountry.GetRuler.GetName]正致力于将伊特鲁里亚的影响力延伸至这些遥远的疆域。\n\n尽管我们将面临敌对部落、海盗以及敌对势力的威胁，但畏缩不前绝非我们的作风。[ROOT.GetCountry.GetName]定能征服这些区域，将其纳入我等霸权之下，从而确保我族未来的繁荣昌盛。"
 01_etruria_missions_western_markets_task_1:0 "保护贸易线"
 01_etruria_missions_western_markets_task_10:0 "罗纳河贸易"
 01_etruria_missions_western_markets_task_10_DESC:0 "在 #E 罗达努斯河 #!的尽头，我们必须建立城市和市场，因为我们不会容忍其他人控制该地区的贸易。幸运的是，我们在该省内有良好的关系，并且与当地贵族关系友好，他们自愿派遣他们最聪明的人前往 [ROOT.GetCountry.GetCapital.GetName] 。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 01_etruria_missions_western_markets_task_10_tt:0 "#Y 我们需要拥有一座#! #T 城市#! #Y ，位于#! #T  沃康提亚#! #Y 省，并且至少拥有#! #G 2 个市场#! #Y 和#! #G 1 个税务局#!。"
 01_etruria_missions_western_markets_task_11:0 "巴利阿里群岛的立足地"
 01_etruria_missions_western_markets_task_11_DESC:0 "将 #E 巴利阿里群岛 #!收入囊中，不仅可以让我们在岛上建立一个至关重要的港口城市，还可以让我们有能力进一步与 #E 伊比利亚 #!沿岸的既有城市进行互动——这种情况有朝一日可能会对我们的军队有利。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 01_etruria_missions_western_markets_task_11_tt:0 "#Y 我们需要拥有#! #T 具姆奈西亚#! #Y 省中的一个#! #T 城市#! #Y ，该城市至少有#! #G 2个港口#!。"
 01_etruria_missions_western_markets_task_12:0 "赫拉克勒斯之柱"
 01_etruria_missions_western_markets_task_12_DESC:0 "虽然[ROOT.GetCountry.GetCapital.GetName]距离赫拉克勒斯之柱非常遥远，但我们的舰队还是成功抵达了这座标志性的地标。然而，我们还能在这里做更多的事情……\n\n#Y 我们将会有几个选择，决定如何处理 #!#T 赫拉克勒斯之柱 #!的领土。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 01_etruria_missions_western_markets_task_12_tt:0 "#Y 我们需要向#!#T 巴伊隆#!#Y 省送去一份#!#G 礼物#!#Y，并且我们的执政官必须是#T 廷吉#!总督的朋友。#!"
 01_etruria_missions_western_markets_task_13:0 "对福凯亚的复仇"
 01_etruria_missions_western_markets_task_13_DESC:0 "我们终于征服了散落在各处的希腊西部城市，结束了他们在远离家乡的地方进行的愚蠢实验。既然他们的财产牢牢掌握在伊特鲁里亚人手中，我们就必须决定如何处置他们。\n\n#Y 我们将可以选择 #! #R 摧毁福西亚城市 #!#Y 或将它们重建为 #! #T 伊特鲁里亚殖民地 #!。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 01_etruria_missions_western_markets_task_14:0 "大西洋历险"
 01_etruria_missions_western_markets_task_14_DESC:0 "我们听说#E 腓尼基#!商人讲述了一个神奇的故事，据说一位#E 图耳得塔尼亚#!商人在海上迷路，最后被冲到岸边，他发誓那里就是传说中的#G 幸运群岛#!。\n\n[ROOT.GetCountry.GetRuler.GetName]对这些传闻很感兴趣，建议派遣一支探险队向西航行，看看这些故事是否属实。\n\n#Y 这将开启一个事件链 #!。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 01_etruria_missions_western_markets_task_15:0 "阿莱里亚排水"
 01_etruria_missions_western_markets_task_15_DESC:0 "[GetProvince('(int32)3515').GetName]的地方官员一直在强烈抱怨城里的蚊子，这种糟糕的情况是由岛屿西侧普遍存在的沼泽造成的。\n\n在绝望中，市民们向[ROOT.GetCountry.GetRuler.GetName]呼救，恳求帮助他们排干那些一直困扰他们城镇的沼泽地。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 01_etruria_missions_western_markets_task_16:0 "处理科西嘉人"
 01_etruria_missions_western_markets_task_16_DESC:0 "现在我们对[GetProvince('(int32)3515').GetName]的地方政府更加熟悉了，[ROOT.GetCountry.GetRuler.GetName]决定[ROOT.GetCountry.GetRuler.GetSheHe]应该考虑这些岛民在[ROOT.GetCountry.GetName]内的法律地位。\n\n#Y 这将开启一个事件链 #!。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 01_etruria_missions_western_markets_task_17:0 "科西嘉的金属加工"
 01_etruria_missions_western_markets_task_17_DESC:0 "由于 #Y 科西嘉 #!岛拥有丰富的原材料和人才，那里的金属工人正在为自己赢得名声。\n\n特别是[GetProvince('(int32)3515').GetName]，它已经成为岛上最重要的城市，毫无疑问这是因为那里有重要的 #E 铸造厂 #!。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 01_etruria_missions_western_markets_task_18:0 "北科西嘉走廊"
 01_etruria_missions_western_markets_task_18_DESC:0 "征服对[ROOT.GetCountry.GetName]重要的城市并巡逻北部航线是确保北方贸易路线安全的一部分。\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 01_etruria_missions_western_markets_task_18_tt:0 "支拥有至少 #Y 50 #!艘利布耳尼亚 @liburnian!的舰队由一位军略为 #T 8 #!的海军将领率领。"
 01_etruria_missions_western_markets_task_19:0 "科西嘉海盗"
 01_etruria_missions_western_markets_task_19_DESC:0 "我们不再隐瞒了——海盗给我们带来的好处太多了。\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 01_etruria_missions_western_markets_task_1_DESC:0 "为了保护[ROOT.GetCountry.GetCapital.GetName]所依赖的贸易路线，我们必须增加我们在海上的存在——这使[ROOT.GetCountry.GetRuler.GetName]如此确信的。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 01_etruria_missions_western_markets_task_2:0 "商人的吸引力"
 01_etruria_missions_western_markets_task_20:0 "南科西嘉走廊"
 01_etruria_missions_western_markets_task_20_DESC:0 "为了保障从 #E 撒耳多姆海 #!到 #E 第勒尼安海 #!航行的商人安全通行，我们需要继续在该地区保持存在，但我们愿意做出这些保证。 \n\n\n\n\n\n\n\n\n\n@egypt_mil21!"
 01_etruria_missions_western_markets_task_20_tt:0 "#Y 我们需要向 #! #T 隆戈内斯 #! #Y 部落送去一份 #! #G 礼物 #!。"
 01_etruria_missions_western_markets_task_21:0 "科西嘉当局"
 01_etruria_missions_western_markets_task_21_DESC:0 "多年来，#Y 科西嘉 #!岛已成为我们伊特鲁里亚力量的重要延伸。如此重要的省份不应被忽视，因此[ROOT.GetCountry.GetRuler.GetName]必须就该岛的政治地位表明立场。\n\n我们可以选择增强我们在#Y 科西嘉#!岛的影响或将其作为我们的#G 藩属#!释放。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 01_etruria_missions_western_markets_task_21_tt:0 "我们需要 #Y 科西嘉 #!岛上的一个省份至少拥有 #G 3 座法院 #!建筑。"
 01_etruria_missions_western_markets_task_21_tt_2:0 "#Y 科西嘉 #!总督拥有 #T 集中人口 #!#Y 总督政策 #!。"
 01_etruria_missions_western_markets_task_22:0 "海盗共和国"
 01_etruria_missions_western_markets_task_22_DESC:0 "承认#Y 科西嘉#!岛 #E 海 #!掌控着这个地方并不可耻，尽管说他们是岛上的真正权威可能有点过分了。\n\n然而，海盗据点中有人高声呼吁要获得藩属地位——这是[ROOT.GetCountry.GetRuler.GetName]一直在仔细权衡的事情。\n\n我们可以选择将 #Y 科西嘉 #!岛作为#G 海盗藩属#!释放。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 01_etruria_missions_western_markets_task_22_tt:0 "我们需要 #Y 科西嘉岛#!上的一个省份至少拥有 #G 6 座市场 #!建筑。"
 01_etruria_missions_western_markets_task_22_tt_2:0 "#Y 科西嘉 #!总督拥有 #T 当地自治 #!#Y 总督政策 #!。"
 01_etruria_missions_western_markets_task_23:0 "被诅咒的塞壬的花岗岩矿"
 01_etruria_missions_western_markets_task_23_DESC:0 "尽管当地传说中低语着悲伤的塞壬隐藏在[GetProvince('(int32)3507').GetName]岩石嶙峋的裂缝中，但这些老妇人为了娱乐孙辈讲述的故事不会阻止我们进入山区。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 01_etruria_missions_western_markets_task_24:0 "浦普洛尼亚的矿渣堆"
 01_etruria_missions_western_markets_task_24_DESC:0 "虽然我们的目光正在望向遥远的海岸，但我们也不应忽视眼前的黄金机会。为了增加我们在 #E 伊特鲁里亚联盟 #!的采矿利润，我们可以在该省做很多事情。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 01_etruria_missions_western_markets_task_25:0 "庇斯纳的货物"
 01_etruria_missions_western_markets_task_25_DESC:0 "得益于其优越的地理位置和当地稳定的盐 @salt!和铁 @iron!供应，[GetProvince('(int32)136').GetName]有可能成为 #E 利古里亚海 #!沿岸最重要的贸易城市之一。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 01_etruria_missions_western_markets_task_26:0 "第勒尼安海的铁贸易"
 01_etruria_missions_western_markets_task_26_DESC:0 "在[ROOT.GetCountry.GetName]的山区和丘陵地带蕴藏着铁矿石，我们应该将其开采出来；幸运的是，我们的海军和陆军将从我们积累的盈余中受益。\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 01_etruria_missions_western_markets_task_27:0 "重新安置基斯拉的人口"
 01_etruria_missions_western_markets_task_27_DESC:0 "[GetProvince('(int32)14').GetName]城的公民 @citizen! 人口过剩，[ROOT.GetCountry.GetRuler.GetName]为这些多余的人制定了一个计划：将他们安置到[GetProvince('(int32)3515').GetName]，在那里他们将发挥更大的作用。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 01_etruria_missions_western_markets_task_28:0 "威拉特里的价值"
 01_etruria_missions_western_markets_task_28_DESC:0 "尽管[GetProvince('(int32)128').GetName]地区目前是一个宁静的偏远地区，但在[ROOT.GetCountry.GetCapital.GetName]内部正在酝酿一项计划，该计划将使该港口成为当地的贸易中心。\n\n#Y 我们将选择如何发展瓦达威拉特里 #!。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 01_etruria_missions_western_markets_task_2_DESC:0 "尽管#E 利古里亚人#!的实力正在减弱，但在外交和经济上，我们的人民有很多理由寻求与利古里亚人建立联系。还有什么比将两家合并为一家更好的方式来获得新友谊更好的事情呢呢?让我们的商人去往那个遥远的国家，这样我们就可以为我们的精英带回新娘。\n\n#Y 我们的外交官将带着#!#T 三名利古里亚新娘#!返回[ROOT.GetCountry.GetCapital.GetName]。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 01_etruria_missions_western_markets_task_3:0 "鼓励商人"
 01_etruria_missions_western_markets_task_3_DESC:0 "如果我们能够处理好我们的商人阶层的需求，那么他们肯定会优先考虑我们的港口和市场，这将确保我们的伊特鲁里亚人在贸易上的主导地位。我们应该确保尽一切努力吸引我们社会中富有的商人的投资，他们将确保我们的船只前往遥远的城市追求财富。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 01_etruria_missions_western_markets_task_4:0 "凯努万的集市"
 01_etruria_missions_western_markets_task_4_DESC:0 "作为我们控制的本地葡萄酒@wine!随着市场的增长，一系列有趣的机会出现了，我们可以在#E 利古里亚#!省份采取一些行动。\n\n#Y 这将启动一个事件链#!。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 01_etruria_missions_western_markets_task_5:0 "利古里亚海盗"
 01_etruria_missions_western_markets_task_5_DESC:0 "北部海岸的各个部落都要求我们帮助他们建造#E 海盗避风港#!，并承诺会与我们分享部分利润。\n\n#Y 我们将与#T 利古里亚人#!合作，并资助他们沿海#G 海盗避风港#!的建设。#!\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 01_etruria_missions_western_markets_task_6:0 "友好的海岸"
 01_etruria_missions_western_markets_task_6_DESC:0 "随着我们与#E 利古里人#!的外交接触日益增加，有人在[ROOT.GetCountry.GetCapital.GetName]提议我们向北方的利古里亚派遣大使馆，以示友好。\n\n#Y 这将启动一个事件链#!\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 01_etruria_missions_western_markets_task_7:0 "海盗的交往"
 01_etruria_missions_western_markets_task_7_DESC:0 "来自 #E 利古里亚 #!省的无法无天的海盗希望望回报我们对他们的恩惠，并向[ROOT.GetCountry.GetRuler.GetName]提出了一个提议。\n\n #Y 完成此任务后，技艺精湛的 #! #T 海盗将领 #!#Y 将会访问我国，提供他们各种可供出售的服务。#! \n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 01_etruria_missions_western_markets_task_7_tt:0 "至少有 #Y 3#! 块领土拥有 #Y 3#! 个或更多[GetBuilding('port_building').GetName|Y]建筑。"
 01_etruria_missions_western_markets_task_8:0 "利古里亚人的身份"
 01_etruria_missions_western_markets_task_8_DESC:0 "没有人能否认利古里亚人已经成为[ROOT.GetCountry.GetName]的港口和市场上熟悉的景象。而这都是因为[ROOT.GetCountry.GetRuler.GetName]所实施的策略。\n\n但现在，是时候把这些临时安排变成更长期的东西了——利古里亚人在伊特鲁里亚社会中究竟应该扮演什么角色?\n\n#Y 我们将决定#T 利古里亚人#!#Y 在[ROOT.GetCountry.GetName]的未来#!#!。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 01_etruria_missions_western_markets_task_8_tt:0 "#T 利古里亚#! #Y 文化必须拥有#! #G 缔结合同权#! #Y 或#! #G 继承权#! #T 文化决议#!。"
 01_etruria_missions_western_markets_task_9:0 "马赛利亚之门"
 01_etruria_missions_western_markets_task_9_DESC:0 "我们正缓慢但稳步地在葡萄酒 @wine!和双耳陶罐 @earthware!的生产和出口方面超越高卢人，然而有些人在想我们是否也可以在军事上扩大优势……\n\n#Y 我们将会有几个选择，决定如何与北方人互动。#!\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 ETRURIAN_LIGURIA_SUBJECT:0 "伊特鲁里亚的利古里亚"
 ETRURIA_LIGURIA_ADJECTIVE:0 "伊特鲁里亚-利古里亚的"
 NICKNAME_THE_LIGURIAN:0 "“利古里亚人”"
 convert_from_italic_to_hellenic:0 "从意大利信仰转向希腊信仰"
 convert_from_italic_to_hellenic_desc:0 "作为一个民族，我们已决定集体改信希腊信仰符合我们的最佳利益。"
 corsican_adjective:0 "科西嘉的"
 desc_etruria_incentivize_merchants_modifier:0 "我们友好的经济政策,加上我们强大的陆军和海军实力,创造了有利于伊特鲁里亚及其利益长期发展的商业环境。"
 desc_etruria_ligurian_piracy_mod_1:0 "我们的同胞对北部沿海的海盗睁一只眼闭一只眼。"
 desc_etruria_ligurian_piracy_mod_2:0 "我们已公开表示,我们不认为利古里亚海盗是麻烦,反而视他们为朋友。"
 desc_etruria_ligurian_piracy_mod_3:0 "我们公开与在利古里亚海游弋的海盗站在同一阵线,所有人都承认我们对周边海域的统治。"
 desc_etruria_ligurian_piracy_mod_4:0 "我们聘请了海盗将领来指导我们的士兵学习他们所掌握的卑鄙技艺。"
 desc_etruria_pupluna_slag_mod:0 "这个省份是图西亚西部采矿作业的重要组成部分。"
 desc_etruria_pupluna_slag_mod_2:0 "多亏了图西亚矿山的工业产出,我们的经济正在蓬勃发展。"
 desc_etruria_rubra_base_resources_mod:0 "该省份有一个重要的花岗岩矿，是由伊特鲁里亚人开发的。"
 desc_etruria_trade_lane_protection_modifier:0 "我们的强大的海军确保了贸易航线畅通无阻地通往我国首都,免受海盗和外国侵略的威胁。"
 desc_etruria_western_markets_drain_aleria_mod:0 "伊特鲁立亚人已经排干了阿拉利亚西部的沼泽,确保了该省拥有适宜的气候。。"
 desc_etruscan_corsican_authority_mod:0 "阿拉利亚是伊特鲁里亚在科西嘉岛上的权力中心。"
 desc_etruscan_gymnaesian_trade_mod:0 "来自巴利阿里群岛的信风鼓起我们的船帆,迅速将我们的船只送往远方岛屿上的宝贵港口城市。"
 desc_etruscan_ligurian_assimilate_mod:0 "一个统一的社会是一种祝福,伊特鲁里亚的方式是周围野蛮人的明灯 - 我们必须同化这些野蛮人。"
 desc_etruscan_mine_mod:0 "这个省份的矿山出产大量的矿石。"
 desc_etruscan_north_corridors_mod:0 "这个省份是北科西嘉贸易路线的重要组成部分。"

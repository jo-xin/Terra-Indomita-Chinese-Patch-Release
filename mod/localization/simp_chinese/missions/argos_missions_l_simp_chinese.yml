 argos_missions_01_greece:0 "阿尔戈斯城"
 argos_missions_01_greece_CRITERIA_DESCRIPTION:0 "当我们控制了整个伯罗奔尼撒半岛时，该使命完成。"
 argos_missions_01_greece_DESCRIPTION:0 "阿尔戈斯，这座古老而尊贵的城市，雄踞于肥沃的阿尔戈利斯平原之上，正处于整合周边邻邦、确立统治地位的理想位置。她坐拥出海口，土地丰饶，得益于阿尔戈利德地区众多河流的滋养，再加上居民坚韧不拔的精神，阿尔戈斯已准备好向世界宣告她的威名！"
 argos_missions_01_greece_task_1:0 "阿尔戈斯城"
 argos_missions_01_greece_task_10:0 "一座辉煌的城市"
 argos_missions_01_greece_task_10_DESC:0 "阿尔戈斯正在成为伯罗奔尼撒半岛的卓越城市，早在很久之前，她就已经超越了作为阿尔戈利斯地区一座卑微城市的起点。每天，新的旅行者都会乘船抵达港口，放弃了他们祖先的土地，来与我们一起建设未来。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 argos_missions_01_greece_task_11:0 "合并阿尔戈利斯"
 argos_missions_01_greece_task_11_DESC:0 "多年前，我们的执政官曾发表演讲，描绘了他所预见的未来：一个阿尔戈斯无可争议地主宰阿尔戈利斯平原的未来。今天，我们欣喜地宣布，这一梦想已然成真；我们期盼已久的胜利终于到来了！\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 argos_missions_01_greece_task_11_tt:0 "在#Y $arcadia_area$#!省内至少有#Y 5#!拥有的领土具有城市地位。"
 argos_missions_01_greece_task_12:0 "重建斯巴达"
 argos_missions_01_greece_task_12_DESC:0 "由于斯巴达城已臣服于阿尔戈斯的统治，我们无需再对我们不久前刚刚摧毁的姐妹城邦感到畏惧。相反，我们应当将战争的战利品重新归还给斯巴达，向世界展示我们在胜利中是多么宽宏大量。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 argos_missions_01_greece_task_13:0 "阿耳戈斯人的主导地位"
 argos_missions_01_greece_task_13_DESC:0 "当伊纳库斯河流入阿戈利库斯湾，用它瀑布般的河水填满海湾时，我们的军队也跨越了伯罗奔尼撒半岛，占领了拉科尼亚和阿卡狄亚地区，将它们纳入我们的统治之下。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 argos_missions_01_greece_task_14:0 "确保奥林匹亚的安全"
 argos_missions_01_greece_task_14_DESC:0 "我们已经为征服奥林匹亚之后的安排做好了计划；我们将巩固那里的土地、美化她的城市，让所有前来参加竞技会的人都为阿尔戈斯无可置疑的强大所折服。可以肯定的是，奥林匹亚将拥有她所能想象到的最佳守护者。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 argos_missions_01_greece_task_15:0 "奥林匹斯山的祭司"
 argos_missions_01_greece_task_15_DESC:0 "一些顾问说，我们把奥林匹亚直接吞并进我们的国家，这显得很粗野，他们声称我们和争吵的野蛮人没有什么区别，都是为了拓展自己的控制力。通过释放奥林匹亚作为我们的藩属，我们可以维持没有拉动这根木偶线的假象，也许诸神会因此奖励我们。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 argos_missions_01_greece_task_16:0 "统治伯罗奔尼撒半岛"
 argos_missions_01_greece_task_16_DESC:0 "亚该亚曾是最后几个仍在抵抗的地区之一，但阿尔戈斯的崛起无人能够阻挡。通过征服我们北方的邻邦，我们学到了许多经验，这些经验将可应用于我们整个国度。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 argos_missions_01_greece_task_17:0 "强化科林托斯"
 argos_missions_01_greece_task_17_DESC:0 "科林托斯是通往伯罗奔尼撒半岛的门户，是我们统治希腊领土的门面，其战略价值是不可否认的。通过加强科林托斯的城墙，这将强化我们的防御，确保我们的敌人不能轻易地进入我们的领土。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 argos_missions_01_greece_task_18:0 "一个新的政府"
 argos_missions_01_greece_task_18_DESC:0 "虽然阿尔戈斯有一个共和国的传统，被那些坚持自己特权的头发花白的议员们所称颂，但民主的内在功能障碍却阻碍了我们的雄心。如果我们能简单地绕过这些令人厌烦的传统，我们的政府肯定会以一种更精简的方式前进。我们应该寻找与我们观点相同的盟友......\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 argos_missions_01_greece_task_18_tooltip:0 "解锁一个角色互动，可以用来为即将到来的革命#Y 收集支持#!。"
 argos_missions_01_greece_task_19:0 "征集支持"
 argos_missions_01_greece_task_19_DESC:0 "我们的大法官最近一直很忙，来为革命试水。一些贵族家庭直接拒绝了我们的提议，但值得庆幸的是，他们没有公开指责你试图破坏国家。虽然有些人安于现状，但也有很多人对你的承诺表现出兴趣。决断之日越来越近了。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 argos_missions_01_greece_task_19_tooltip:0 "至少有3个角色拥有#Y 获得支持#!修正。"
 argos_missions_01_greece_task_19_tt:0 "至少有#Y 3#!个角色有#Y 获得支持#!角色修正，这是从#Y 笼络支持#!角色互动中获得的。(目前：#Y [SCOPE.ScriptValue('argos_chars_with_support_gathered')|0]#!）"
 argos_missions_01_greece_task_1_DESC:0 "尽管阿尔戈斯的港口位于阿尔戈利库斯湾的要冲之地，但我们并不是唯一吸引远方商人前来贸易的港口城市。多年来，我们一直与邻邦处于一种不安的共存状态，但现在或许是时候消除我们在该地区的经济对手了。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 argos_missions_01_greece_task_2:0 "与马其顿的联姻"
 argos_missions_01_greece_task_20:0 "夺取政权"
 argos_missions_01_greece_task_20_A_tooltip:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName|Y]和拥有#Y 获得支持#!修正的角色的总权力基础至少是#Y [SCOPE.ScriptValue('argos_total_character_powerbase_total')|0]#!。\n[SCOPE.GetRootScope.GetCountry.Custom('argos_gather_support_loc')] "
 argos_missions_01_greece_task_20_B_tooltip:0 "#R 阿尔戈斯的一场致命的权力斗争将随之而来。#!"
 argos_missions_01_greece_task_20_DESC:0 "现在是进行你所决定的革命计划的最佳时机。几个月的精心策划终于接近尾声了，你的支持者们在等待着你的消息。你预计会有一些阻力，但你不会让一场潜在的内战阻碍你的雄心，对吗？\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 argos_missions_01_greece_task_2_DESC:0 "我们应该为我们的执政官挑选一位合适的新娘，一位能反映她作为我们城市领袖地位的新娘。这不应该从简安排；我们需要一位皇室新娘。让我们派信使到马其顿的朋友那里，提出我们的要求。\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 argos_missions_01_greece_task_3:0 "巩固阿尔戈利斯地区"
 argos_missions_01_greece_task_3_DESC:0 "我们坐落于阿尔戈利斯平原上，应该扩大自然边界，以涵盖整个地区。如果我们能够掌控这里，这将对我们的命运大有裨益。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 argos_missions_01_greece_task_3_tooltip:0 "获得对[GetProvince('(int32)440').GetArea.GetName|Y]省的宣称"
 argos_missions_01_greece_task_4:0 "阿耳戈斯基建"
 argos_missions_01_greece_task_4_DESC:0 "虽然熙熙攘攘的港口运输让我们丰衣足食，但我们没有理由不应该自给自足。让我们投资泰里亚的农田，增加我们在埃皮达鲁斯的财产，从中我们将受益匪浅。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 argos_missions_01_greece_task_5:0 "侮辱斯巴达人"
 argos_missions_01_greece_task_5_DESC:0 "斯巴达人，你们南方暴躁的邻居，似乎受到了我们的崛起的威胁，并在整个希腊散布着关于我们的谎言。奇怪的是，这些著名的斗士竟会诉诸于窃窃私语而非武力，但两国可以玩外交游戏；我们应该让他们知道我们对他们的真实感受。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 argos_missions_01_greece_task_6:0 "一场光荣的战争"
 argos_missions_01_greece_task_6_DESC:0 "言语已无法解决问题，唯有在战场上取得胜利才能洗刷我们的不满。前进吧，阿尔戈斯的将士们，彻底粉碎斯巴达至强的神话！ \n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 argos_missions_01_greece_task_6_tooltip:0 "向#Y 斯巴达#!挑战，进行一场光荣的战争，只有#Y 阿耳戈斯#!和#Y 斯巴达#!部队参加。"
 argos_missions_01_greece_task_7:0 "斯巴达的终结"
 argos_missions_01_greece_task_7_DESC:0 "我们征服了南方的宿敌，永远地动摇了希腊的力量平衡。所有听说过我们的统治地位的人无疑都会被我们的军事力量所折服，斯巴达人也会拥抱他们的解放者。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 argos_missions_01_greece_task_8:0 "阿卡迪亚"
 argos_missions_01_greece_task_8_DESC:0 "通过将我们的统治扩展到整个阿卡狄亚，我们获得的不仅仅是至高无上的荣誉；数不清的财富将流过我们的指尖。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 argos_missions_01_greece_task_9:0 "发展阿尔戈斯"
 argos_missions_01_greece_task_9_DESC:0 "阿尔戈斯本身正在蓬勃发展，这正是你卓越领导能力的明证。现在，我们应当开启一项宏大的建设计划，确保我们的公民拥有他们所渴望的一切设施。只要我们照顾好人民，他们也必将回馈于我们。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 argos_revolter_adjective:0 "阿耳戈斯的反对派"
 argos_revolter_name:0 "阿耳戈斯的反对派"
 city_of_argos:0 "阿尔戈斯城"
 fighting_rival:0 "斯巴达人的斗争"
 gain_claims_on_sparta_tt:0 "获得对#Y 斯巴达#!所有领土的宣称。"
 me_argos_1.a:0 "[potential_wife.GetName]是我的理想人选"
 me_argos_1.b:0 "我将选择[potential_wife_2.GetName]作为我的妻子"
 me_argos_1.c:0 "[potential_wife_3.GetName]是最佳选择"
 me_argos_10.a:0 "阿尔戈斯有一个光明的未来"
 me_argos_10_desc:0 "阿尔戈斯的统治权继续扩大，富裕的阿卡迪亚被我们牢牢掌握着。在我们控制下的城市名单确实令人印象深刻；斯廷法罗斯、泰里亚、曼丁尼亚、埃皮达鲁斯和麦加洛波利斯。它们都归于一个共同的主人统治，这预示着美好的时代即将到来。"
 me_argos_10_title:0 "$argos_missions_01_greece_task_8$"
 me_argos_10_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_8$#!' $mission_completed_tooltip_2$"
 me_argos_11.a:0 "阿尔戈斯不断发展，多亏了我们的领导"
 me_argos_11_desc:0 "我们的顾问私下里温和地斥责了你，说你似乎只专注于夺取别人的土地，而不是改善你已经拥有的东西。阿尔戈斯的发展是成倍的，但你永远无法通过观察来判断我们的首都是一个新兴帝国的中心。你把大臣们的建议放在心上，下令打开国库，并派你的建筑师进入阿尔戈斯的街道，扩大住宅和商业区。现在他们已经完成了，他们邀请你来看看他们的手艺。你当然对他们的工作感到满意，但你认为最终还可以做得更多。尽管如此，我们仍然庆祝我们城市的扩张，同时我们梦想着更美好的日子。"
 me_argos_11_title:0 "$argos_missions_01_greece_task_9$"
 me_argos_11_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_9$#!' $mission_completed_tooltip_2$"
 me_argos_12.a:0 "我们的城市是一个合适的首都，一个能反映我们卓越地位的首都"
 me_argos_12_desc:0 "阿尔戈斯，我们的首都，已经成为伯罗奔尼撒半岛最大的城市之一，这证明了我们在该地区的崛起是一个巨无霸。城市里几乎每天都有新的建筑，街道上到处都是商人，他们吆喝着来自整个文明世界的商品。痴情的诗人写下了无数赞美我们首都之美的颂歌，与希腊所有其他城市相比，我们的首都确实很突出--你们特别喜欢史诗《独一无二的城市》，街道上贴满了引用这首诗和其他著名作品的句子的涂鸦。我们确实为阿尔戈斯正在成为的东西感到骄傲；一个文化和文明的中心。"
 me_argos_12_title:0 "$argos_missions_01_greece_task_10$"
 me_argos_12_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_10$#!' $mission_completed_tooltip_2$"
 me_argos_13.a:0 "阿尔戈斯继续前进！"
 me_argos_13_desc:0 "我们很自豪地报告，整个阿尔戈利斯已经臣服于我们。点缀在平原上的无数城市不再相互争吵，希望在屈服于另一次入侵之前以某种方式获得对敌人的暂时统治权；亚基时代已经到来，我们在这里带领我们的兄弟们在荣耀中前进。我们土地上的居民为我们获得的和平而欢欣鼓舞，并准备好带领我们不断前进。"
 me_argos_13_title:0 "$argos_missions_01_greece_task_11$"
 me_argos_13_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_11$#!' $mission_completed_tooltip_2$"
 me_argos_14.a:0 "我们的慷慨是毋庸置疑的"
 me_argos_14_desc:0 "我们与斯巴达的战争正在逐渐淡出人们的记忆，虽然有些人还在养伤，但绝大多数被征服的斯巴达人只想继续他们的生活。为了促进这一进程，我们资助了斯巴达本身的修复工作；修复破碎的城墙，清理街道上的瓦砾，修复被围困时留下的被烧毁的建筑。我们不愿意按照当地的风格建造，而是用阿尔戈斯人的建筑样式来美化斯巴达，以提醒拉栖代梦人他们的新主人是谁--现在有人开玩笑地把这座城市称为'斯巴格斯'，这种俏皮话总是能让你笑出声。"
 me_argos_14_title:0 "$argos_missions_01_greece_task_12$"
 me_argos_14_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_12$#!' $mission_completed_tooltip_2$"
 me_argos_15.a:0 "阿尔戈斯向前迈进！"
 me_argos_15_desc:0 "我们的统治范围扩展到了希腊南部的全部地区，这是我们不可避免的标志。我们已经整合了拉栖代梦和阿卡迪亚，将他们的力量与我们的力量结合起来，但我们还没有结束，不，我们只是刚刚开始。阿尔戈斯从不安于现状，她将在自己创造的胜利道路上巩固和前进。"
 me_argos_15_title:0 "$argos_missions_01_greece_task_13$"
 me_argos_15_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_13$#!' $mission_completed_tooltip_2$"
 me_argos_16.a:0 "我们谦卑地接受这一责任"
 me_argos_16_desc:0 "对于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]来说，我们已经占领了奥林匹亚省，这是一个非常值得个人骄傲的点。这无疑是对我们威望的巨大提升，是诸神赐予我们的恩惠的标志。所有来参加运动会的人都将享受我们提供的奢华场面，而我们城市的名字将在全世界的每条舌头上得到赞美。"
 me_argos_16_title:0 "$argos_missions_01_greece_task_14$"
 me_argos_16_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_14$#!' $mission_completed_tooltip_2$"
 me_argos_17.a:0 "我们不是无理取闹......告诉他们这个请求被批准"
 me_argos_17_desc:0 "我们收到了奥林匹斯神甫的请求，我们应该仔细考虑；请 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 在做出任何草率的决定之前，仔细考虑他们的提议。我们理解这可能被理解为是对他们的打脸，因为他们显然正在享受我们保护的好处，在我们的领导下前所未有地繁荣起来。唉，看来，虽然他们模仿了许多阿尔戈斯人的好特征，但他们的骄傲意识显然没有被熄灭。他们温和地要求我们将他们作为一个藩属释放，这样他们就可以在更广阔的世界中保持他们独特的身份，同时保持我们建立的家庭纽带。这种想法，虽然大胆，但也得到了你的一些顾问的认同，他们害怕出现不文明的现象，认为我们最好保持权威的面子。\n\n虽然这个要求很大胆，但经过一番考虑，你还是同意了，因为你知道阿尔戈斯的声望不会受到损害--奥林匹亚在你的财产中肯定是一个独特的案例。如果有的话，我们的威信只会增加。"
 me_argos_17_title:0 "$argos_missions_01_greece_task_15$"
 me_argos_17_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_15$#!' $mission_completed_tooltip_2$"
 me_argos_18.a:0 "阿尔戈斯是希腊最伟大的城市"
 me_argos_18_desc:0 "现在整个伯罗奔尼撒半岛都承认阿尔戈斯的统治，因为我们已经完全控制了我们的自然边界，将我们的统治权扩展到我们从未梦想过的土地。我们进入了一个新的繁荣时代，这在很大程度上归功于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的卓越领导。在[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]神圣的指挥下，我们将进一步飙升到什么高度？"
 me_argos_18_title:0 "$argos_missions_01_greece_task_16$"
 me_argos_18_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_16$#!' $mission_completed_tooltip_2$"
 me_argos_19.a:0 "阿尔戈斯安然无恙，不惧怕任何人"
 me_argos_19_desc:0 "我们已经命令我们最优秀的建筑师对科林斯卫城加固，它是主宰科林斯景观的宏伟堡垒。在批准了最终的设计后，您亲自前往该城市，希望能监督这项工作，以便您能安心。如您所知，科林斯保护了进入伯罗奔尼撒半岛的陆路通道，使科林斯卫城成为抵御入侵军队的第一道防线，因此是最重要的。你们决不允许外国军队对你们的土地做你们对别人做过的事。\n\n工作以令人满意的速度进行，经过一个月的稳定施工，终于完成了。俯瞰城垛，你想知道如果你是敌人的将军，你会怎么做；你会如何攻下这座城市？你的目光沿着城墙巡视，寻找任何薄弱点，你赞许地点点头。至少可以说，这些防御工事是令人生畏的；要攻下这座城市，没有简单的选择。“我们在黎明时分驶向阿尔戈斯”，你告诉你的随从，引起一阵骚动。“我们在这里的工作已经到了尽头”。"
 me_argos_19_title:0 "$argos_missions_01_greece_task_17$"
 me_argos_19_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_17$#!' $mission_completed_tooltip_2$"
 me_argos_1_desc:0 "在您家中某些女性成员的怂恿下，您同意派遣一名特使前往马其顿，希望能找到一位合适的新娘，这些女性成员认为阿尔戈斯的统帅依然未婚简直是不可容忍的事情。随着时间的推移，你已经完全忘记了这件事，主要是想让你的大家庭的唠叨安静下来，有一天下午，你的顾问告诉你，不是一个，而是三个安提帕特家族的新娘已经被送到了阿尔戈斯；卡山德洛斯一定很喜欢你！他们正在别墅里等着你。她们在别墅里等着见你，所以你在脸上泼了点水，然后去她们住的地方--你要和她们一起吃夜宵。\n\n当你终于出现在她们面前时，你立刻语塞了，这对你来说是一种讽刺；像你这样一个伟大的演说家，习惯于在大会上发表激动人心的演讲，却不知所措，这是多么可笑。每个女人都非常漂亮，而且特别聪明，谈话持续了几个小时，然后她们的监护人才让她们离开。你被单独留在你的沙发上，脑袋被酒和你的可能性的兴奋弄得晕头转向；这将是一个艰难的决定。"
 me_argos_1_title:0 "一场皇家婚姻"
 me_argos_2.a:0 "好主意！"
 me_argos_2.b:0 "不可能！"
 me_argos_20.a:0 "一小笔钱就够了"
 me_argos_20.b:0 "[target.GetName]将需要更多的说服力"
 me_argos_20_desc:0 "你做出了一个艰难的决定，当你真正考虑到这个后果时，你的身体会激动得颤抖起来。通过寻求废止长老会议的权威并以你的统治取而代之，你已经做出了致命的决定；任何失误，你计划中的任何缺陷，都会导致你作为国家的敌人被公开处决。心胸狭隘的人可能会说我的提议是叛国......我不能独自做到这一点；我必须在那些与我想法相同的人中寻求支持，以使我的主张具有合法性。"
 me_argos_20_desc_2:0 "[ROOT.GetCountry.GetRuler.GetName]最近几天似乎心事重重，拒绝透露[ROOT.GetCountry.GetRuler.GetHerHis]心中所想的事情。尽管有这个小麻烦，因为对[ROOT.GetCountry.GetRuler.GetFirstName]来说，烦躁的情绪是一件罕见的事情，但在首都，生活还是照常进行。Gerousia中无休止的辩论在继续，街道上到处都是商人和贸易者，普通人也在继续他们的日子。不太有野心的人甚至可能对这种状态感到满意。\n\n然而，如果他们知道[ROOT.GetCountry.GetRuler.GetFirstName]似乎很焦虑的真正原因，头肯定会转向；在我们说话的时候，秘密使者已经被派往[target.GetName]，希望为政府的变革建立支持。即使是现在，我们的耳语运动仍在继续......"
 me_argos_20_desc_3:0 "[ROOT.GetCountry.GetRuler.GetName]已经决定，[target.GetName]的支持将是前进的必要条件，因为[ROOT.GetCountry.GetRuler.GetFirstName]不能希望在叛乱的时候靠[ROOT.GetCountry.GetRuler.GetHerHis]自己的两条腿站起来。不过，众所周知，[target.GetFirstName]是一个忠实的种类，尽管[target.GetHerHis]的忠诚度当然可以买到。正如生活中的一切，没有任何承诺。"
 me_argos_20_desc_4:0 "'你知道你在提议什么吗，[ROOT.GetCountry.GetRuler.GetFirstName]？' [target.GetName]靠在沙发上，[ROOT.GetCountry.GetRuler.GetHerHis]的眼睛里闪烁着凶光。时辰已晚；所有的家奴都睡着了，只有一个侍者睡眼惺忪地站在门口。'别担心Phaedo，他是聋子。' [target.GetName]实事求是地指出。'他不会跑到长老会议去报告你所说的事情。'\n\n'那么你怎么说，[target.GetFirstName]？你的支持对即将到来的事情至关重要。'"
 me_argos_20_title:0 "收集支持"
 me_argos_21.a:0 "[target.GetName]将加入我们！"
 me_argos_21.b:0 "[target.GetName]已拒绝加入！"
 me_argos_21_desc_failed:0 "你已经收到了来自[target.GetName]的回复，这封信充满了侮辱和赤裸裸的嘲笑......还有威胁！。'如果你继续沿着这条叛逆的道路走下去，我们会让当局知道你的阴谋--放弃你的愚昧，记住你的位置。把羊皮纸揉成一团，你冷笑一声，把它扔到地上。记住[target.GetName]，把他们的家人加入禁制名单；当时间到了，你不会忘记他们懦弱的不支持。"
 me_argos_21_desc_success:0 "你已经向[target.GetName]派出了一名值得信赖的顾问，要求他们秘密支持你推翻格鲁西亚并自立为巴西列斯的企图。你必须承认，当[target.GetFirstName]在一个晚上亲自出现在你的家里，脸藏在长衫的褶皱下时，你很惊讶。原谅我的不速之客，[target.GetFirstName]低声说，拉近与你的距离，但我不敢相信其他人能回答这样一个敏感的请求。我想亲自告诉你，到时候你可以依靠我们。"
 me_argos_21_title:0 "[target.GetName] 的回应"
 me_argos_22.a:0 "是时候战斗了！"
 me_argos_22_desc:0 "所有的准备工作都已就绪；你在安全的位置上有值得信赖的人，你在整个王国的驻军都有秘密的武装，你的间谍网络报告了你的对手的日常行动。不知何故，长老会议的议员们并未发现你准备做什么；当你出击时，你将有出其不意的因素支持你。现在没有回头路可走了！向着死亡或荣耀前进！"
 me_argos_22_title:0 "一个新政府"
 me_argos_23.a:0 "行动的时刻到了！"
 me_argos_23.b:0 "我们将暂时等待时机..."
 me_argos_23_desc:0 "“尊贵的长老会议议员，我今天来到你们面前，是出于无奈，因为这些艰难的时刻迫使我出手。” [ROOT.GetCountry.GetRuler.GetName]将[ROOT.GetCountry.GetRuler.GetHerHis]的目光投向聚集在一起的集会；整个房间都很安静，每个字都被挂在上面。\n\n“过去对阿尔戈斯有用的东西，现在显然不能帮助我们。我，[ROOT.GetCountry.GetRuler.GetFirstName]，带着一个大胆的愿景站在你们面前；我在这里提出一个新的前进方向......”。\n\n一个新的人物互动，寻求支持，现在可用。"
 me_argos_23_title:0 "一条新的前进道路"
 me_argos_23_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_18$#!' $mission_completed_tooltip_2$"
 me_argos_24.a:0 "清算的日子快到了"
 me_argos_24_desc:0 "过去的这几周让人非常紧张，[ROOT.GetCountry.GetRuler.GetName]确信整个阴谋会被发现，然而这些担心从未实现；不知为何，长老会议成员仍然对他们的统治日子几乎已经结束的事实懵然不知。也许这是一个迹象，表明诸神赞成这个计划？\n\n[ROOT.GetCountry.GetRuler.GetFirstName]已经以某种方式设法在不惊动当局的情况下为叛乱收集足够的支持，现在，只需要再做一些准备。向君主制的过渡不会简单，但如果获得荣耀是一件简单的事情，那么每个人都会追求它。"
 me_argos_24_title:0 "大众支持"
 me_argos_24_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_19$#!' $mission_completed_tooltip_2$"
 me_argos_2_desc:0 "我们收到了来自阿尔戈斯的一个奇怪的提议，这是我们亲自担保的希腊众多城邦中的一个。似乎他们的大君，一个雄心勃勃的年轻家伙，你已经听说过很多了，他谦卑地请求我们送一位皇家新娘给他。据悉，他来自一个良好的家庭，而这个姿态肯定会巩固你在阿耳戈斯的声誉。虽然我们家族中肯定有不少未婚女子，但我们要送这样一份礼物给阿耳戈斯人吗？他们真的值得吗？"
 me_argos_2_title:0 "阿尔戈斯的婚姻提议"
 me_argos_3.a:0 "我们对这个结果很满意。向这对新婚夫妇送上我们的祝福"
 me_argos_3.b:0 "荒唐！他们竟敢拒绝我们作为安提帕特里德新娘的荣誉？傻瓜"
 me_argos_3_desc_1:0 "我们派往阿尔戈斯的使团已经回到珀拉，但有一个明显的不同；有三位美丽的少女乘船前往阿尔戈斯，但只有两位回来。看来，阿尔戈斯的领袖被你的慷慨所折服，在经过一番争论后才选定了一位妻子。你听说婚礼的庆祝活动倒是很有意义，你在阿尔戈斯的朋友肯定对你很满意。"
 me_argos_3_desc_2:0 "我们派往阿尔戈斯的使团带着令人沮丧的消息回来了，现在你家里的三个女人站在你面前，脸哭得通红，要求报仇。看来，在讨论了这么多关于送新娘去阿尔戈斯的事情后，谈判在最后一刻失败了，现在有三个尴尬的女人在责骂你。由于目前发生的一切，这无疑是一种分心，但你并不高兴--一点也不高兴。你用模糊的承诺送走了你的亲属，并提醒自己以后要处理好阿吉夫人的问题。"
 me_argos_3_title:0 "婚姻大事"
 me_argos_3_tt:0 "她现在嫁给了[ROOT.GetCountry.GetRuler.GetName]"
 me_argos_4.a:0 "准备好我们的宣称"
 me_argos_4_desc:0 "我们与许多城市一同在阿尔戈利斯，这种情况曾经是可以接受的，但我们预期的扩张已经被我们的邻居所阻挡。没有足够的资源，所以最好是直接拿下它们，这样就不会有人质疑我们的霸主地位。"
 me_argos_4_title:0 "$argos_missions_01_greece_task_1$"
 me_argos_4_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_1$#!' $mission_completed_tooltip_2$"
 me_argos_5.a:0 "为阿尔戈斯欢呼三声！"
 me_argos_5_desc:0 "为了确保阿尔戈利斯山脉的航道，我们被迫征服了所有在她的水域上派船的邻近城邦。现在，我们已经成功地消灭了我们的对手，我们的海军可以不受干扰地在海上航行。日复一日，阿尔戈斯的力量在增长，我们的敌人在我们的军队面前凋零。"
 me_argos_5_title:0 "$argos_missions_01_greece_task_3$"
 me_argos_5_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_3$#!' $mission_completed_tooltip_2$"
 me_argos_6.a:0 "今天是个好日子"
 me_argos_6_desc:0 "我们在泰里亚的农业定居点已经完成，阿尔戈斯的鱼市已经被波塞冬的赏赐所淹没。鱼类的供应如此丰富，以至于价格跌破了底线，这给你们的公民带来了巨大的喜悦；阿尔戈斯宽阔的大道上，无论早晚，都充满了烤沙丁鱼的诱人气味。是的，实际上......这听起来像是我们今天午餐想要的东西。"
 me_argos_6_title:0 "$argos_missions_01_greece_task_4$"
 me_argos_6_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_4$#!' $mission_completed_tooltip_2$"
 me_argos_7.a:0 "斯巴达人听到后会大发雷霆--不错！"
 me_argos_7_desc:0 "当你的信使大声朗读你为斯巴达准备的信息时，你的宫廷里传来了响亮的窃笑声，其中还夹杂着偶尔的冷笑。尽管你亲自编写了这份侮辱性的清单，但当你听到大声的尖叫时，你仍然笑得前仰后合--你绝对有一套说话的方法。在拉科尼亚，当听到这些侮辱时，会有灼耳的声音，但你说的是事实！"
 me_argos_7_title:0 "$argos_missions_01_greece_task_5$"
 me_argos_7_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_5$#!' $mission_completed_tooltip_2$"
 me_argos_8.a:0 "我们将在战斗中与他们的部队相遇，并将战胜他们！"
 me_argos_8_desc:0 "好吧，看来你给斯巴达人的信件达到了预期效果。你的特使带着他们白热化的愤怒的听闻回来了，他声称斯巴达人处决了你的信使，几乎放弃了外交礼节！用不了多久，他们的军队就会向阿尔戈斯进发，希望能斥责你的嘲讽之语。如果你想诱使他们开战，看来你已经成功了！"
 me_argos_8_title:0 "$argos_missions_01_greece_task_6$"
 me_argos_8_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_6$#!' $mission_completed_tooltip_2$"
 me_argos_9.a:0 "在全希腊发出公告，宣布斯巴达已经落入阿尔戈斯手中"
 me_argos_9_desc:0 "阿尔戈斯和斯巴达之间的较量已经接近尾声，后者被发现完全不合格。我们的军队已经在拉科尼亚的街道上游行，所谓的斯巴达军队的威力在你们面前破灭。已经没有抵抗力了；如果你知道斯巴达是多么的弱小，你早就征服他们了。"
 me_argos_9_title:0 "$argos_missions_01_greece_task_7$"
 me_argos_9_tt:0 "$mission_completed_tooltip_1$ '#Y $argos_missions_01_greece_task_7$#!' $mission_completed_tooltip_2$"
 spartan_destuction:0 "斯巴达的毁灭"
 support_gathered:0 "获得支持"

l_simp_chinese:
 book_binding_tt:0 "我们需要#Y 装订#!和#Y 速记#!发明。"
 desc_iberian_access_to_the_caspian_sea_mod:0 "我们已将阿尔巴尼亚人赶出他们的家园，迫使他们逃入如今我们已完全掌控的里海水域。"
 desc_iberian_tree_dowin_city_mod:0 "伊比利亚人已在这座城市的基础设施上投入重金，充分利用其作为贸易中心的天然区位优势。"
 desc_iberian_warmonger_mod:0 "尽管军事形势危急，但这反而激发了士兵们在必要时于所有战线上奋战的决心。"
 eristavi_regalia_iberia_treasure:0 "埃里斯塔维王权象征"
 eristavi_regalia_iberia_treasure_desc:0 "这条华美的腰带、戒指、宝剑与权杖——这些由伟大的统治者法尔纳瓦兹·法尔纳瓦兹赐予伊比利亚总督的象征物——承载着这位著名国王的权威。"
 iberia_missions:0 "伊比利亚国王的崛起"
 iberia_missions_BUTTON_TOOLTIP:0 "伊比利亚不会向她的敌人屈服......事实上，恰恰相反。"
 iberia_missions_CRITERIA_DESCRIPTION:0 "当伊比利亚的统治者击退他们的邻国，建立一个强大而安全的国家，能够将他们的力量投射到远离我们的山地家园时，这个使命就会完成。"
 iberia_missions_DESCRIPTION:0 "如果一个人从地中海的大港口城市出发，沿着水路经过拜占庭，直到到达攸克星海，你最终会到达一个遥远的海岸，那里有一座巨大的山脉——高加索山脉，耸立在广阔的北方草原上——这片无情的土地就是我们的家园。我们在这里有自己的传统，崇拜不为外人所知的真神，虽然我们周围有很多敌人，他们很想把我们从高原城市驱逐出去，但他们一直无法做到这一点。\n\n现在，与其让我们的敌人有机会对他们的邪恶意图采取行动，我们必须牢牢把握住我们的命运。"
 iberia_missions_task_1:0 "被敌人所包围"
 iberia_missions_task_10:0 "亚美尼亚的防御工事"
 iberia_missions_task_10_DESC:0 "因为我们已经将亚美尼亚的许多伟大城市据为己有，所以我们掌握了大量的知识，而这些知识是我们以前无法获得的。每个人都知道亚美尼亚人建造了高超的防御工事，那么我们为什么不教我们自己的工程师如何模仿他们的风格？我们很快就会用他们的建筑论文填满我们的皇家图书馆。 \n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 iberia_missions_task_11:0 "[GetProvince('(int32)1676').GetName]的围墙"
 iberia_missions_task_11_DESC:0 "[GetProvince('(int32)1676').GetName]当然已经是一个气势恢宏的地方，但我们相信，我们可以让我们的堡垒和城堡更加难以攻克。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 iberia_missions_task_12:0 "伊比利亚联盟"
 iberia_missions_task_12_DESC:0 "在我们民族的历史上，伊比利亚信仰的信徒第一次在一个[ROOT.GetCountry.GetReligion.GetName]王冠下团结起来，我们周边的敌人的力量在一代或更长时间内被摧毁。愿阿尔马兹继续对我们倾注祝福，带领我们走向胜利！\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 iberia_missions_task_13:0 "伊比利亚葡萄酒"
 iberia_missions_task_13_DESC:0 "我们的人民以其发酵葡萄酒的技能而闻名，这是我们几千年来一直追求的一个爱好。当收成来临时，我们把巨大的陶器容器装满，用我们的语言称之为 \"kvevri\"，然后把它们深深地埋在地下。那些喝伊比利亚葡萄酒的人往往能发现其他年份的葡萄酒缺乏味道。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 iberia_missions_task_14:0 "法纳瓦兹德之血"
 iberia_missions_task_14_DESC:0 "由于法纳瓦兹王朝所带来的改革，我们民族的荣耀已经得到了世代的保障。在我们位于[GetProvince('(int32)1676').GetName]的堡垒中，我们统治着一个广阔的王国，一个由我们自己亲手建立的王国。 \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 iberia_missions_task_1_DESC:0 "我们被四面八方的敌人所包围；南部是严峻的亚美尼亚人，西部是傲慢的科尔基斯人，东部是狂野的阿尔巴尼亚人。由于我们的军事顾问无法达成共识，我们将对我们周围的每个人提出宣称。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 iberia_missions_task_2:0 "向海岸推进"
 iberia_missions_task_2_DESC:0 "我们最近的胜利带来了诱人的承诺，在未来的日子里会有更大的收获；如果我们的士兵继续向前推进，我们不仅会到达里海的海岸，而且我们甚至可以进入攸克星海的水域。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 iberia_missions_task_3:0 "羊毛之地"
 iberia_missions_task_3_DESC:0 "尽管我们已经粉碎了[GetProvince('(int32)1715').GetArea.GetName]的力量，人们仍在担心他们会重新占据强势位置。很明显，为了防止这种可能性的发生，我们必须彻底根除它们。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 iberia_missions_task_4:0 "阿尔巴尼亚的碎片"
 iberia_missions_task_4_DESC:0 "我们的部队继续消灭阿尔巴尼亚部落的人；现在我们已经牢牢地控制了他们的中心地带，不久我们就会吃掉他们王国的其他残渣。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 iberia_missions_task_5:0 "让我们的脚踏实地"
 iberia_missions_task_5_DESC:0 "虽然我们是该地区新的权力掮客，但我们在庞特斯-尤西努斯的存在很快就会为人所知--我们的造船计划将使我们的影响力远远超出我们祖国的海岸！我们将通过公路将我们的首都与海洋连接起来，然后整个世界将向我们敞开大门！我们将通过公路将我们的首都与海洋连接起来，然后整个世界将向我们开放。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 iberia_missions_task_6:0 "赋予Eristavi人权力"
 iberia_missions_task_6_DESC:0 "埃里斯塔维是一个受人尊敬的地方统治者阶层，其职责类似于总督，受法纳瓦兹王朝委托，以他们的名义统治各省。在我们能够制定任何进一步的改革之前，我们必须授予他们权力。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 iberia_missions_task_7:0 "一种独特的语言"
 iberia_missions_task_7_DESC:0 "虽然我们的祖国目前有大量的方言，人们使用的书面文字也同样多，但我们决定，每个人都必须说同样的方言，用同样的方式书写。 \n\n\n\n\n\n\n\n\n\n@india_mil17!"
 iberia_missions_task_8:0 "#E 多温#!"
 iberia_missions_task_8_DESC:0 "[GetProvince('(int32)1572').GetName]位于三河交汇处，是旅客和商船往来的重要城市。虽然当地人并不喜欢我们在他们的土地上出现，但我们可以通过改善这个重要贸易枢纽的基础设施来赢得他们的支持。 \n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 iberia_missions_task_9:0 "来自利奇尼蒂斯湖"
 iberia_missions_task_9_DESC:0 "从新征服的[GetProvince('(int32)1572').GetName]城到亚美尼亚人的首都只有几天的路程，尽管他们会全力抵抗我们的军队，但我们必须打击他们王国的核心。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 iberian_access_to_the_caspian_sea_mod:0 "获得通往里海的通道"
 iberian_power:0 "阿马兹的力量"
 iberian_power_desc:0 "我们已经征服了奉行阿尔马兹信仰的土地，将该地区统一为一个强大的势力，在那里，信徒的军队保护着充满真信徒的城市。"
 iberian_tree_dowin_city_mod:0 "伊比利亚的多温"
 iberian_warmonger_mod:0 "被敌人所包围"
 maritime_boom:0 "海运热潮"
 maritime_boom_desc:0 "连接阿尔马兹里斯基和港口城市发西斯，为我们国家带来了前所未有的增长。"
 me_iberia_1.a:0 "有选择是一件好事..."
 me_iberia_10.a:0 "这是一个很好的消息!我们的未来是建立在这样的基础上"
 me_iberia_10_desc:0 "由于亚美尼亚人的祖国充满了峭壁和岩石隘口，他们的工程师和建筑师已经开发出一种拥抱当地地形的建筑风格。通过将他们的防御工事直接支撑在山坡上，亚美尼亚人利用大地本身的力量，使他们能够建造安全的堡垒，使任何敌对的军队感到震惊--只要问问我们最后一次南方战役的老兵，他们对亚美尼亚的堡垒有什么看法。"
 me_iberia_10_title:0 "$iberia_missions_task_10$#!"
 me_iberia_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_iberia_11.a:0 "我们将在我们的城墙后面很安全--试图围攻的军队有祸了!"
 me_iberia_11_desc:0 "虽然人们在看到[GetProvince('(int32)1676').GetName]的城墙时绝不会想到，这里有一个充满活力的国际大都市正在蓬勃发展。工事的相对强度使我们的[ROOT.GetCountry.GetAdjective]文化得以蓬勃发展，这在不太安全的时代是无法想象的。"
 me_iberia_11_title:0 "$iberia_missions_task_11$#!"
 me_iberia_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_iberia_12.a:0 "我们将把我们的信仰之光带到世界的各个角落"
 me_iberia_12_desc:0 "终于，我们祖先梦想的那一天到来了；经过多年的激烈斗争，我们的权力对手已经被打倒，他们发动战争的能力被无可挽回地打破，一个最高的权威统治着阿尔马兹信徒居住的土地。看着我们的领地和赐予我们的祝福，谁能否认阿尔马兹的权力和力量？愿他在我们带领人民进入光荣的未来时，继续给予我们神圣的恩惠!"
 me_iberia_12_title:0 "$iberia_missions_task_12$#!"
 me_iberia_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_iberia_13.a:0 "当第一批Kvevri准备好时，一定要让我们知道!"
 me_iberia_13_desc:0 "今天早上给你一点令人愉快的消息，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]；从人民不断的要求，或边境附近的小规模冲突的报告中得到一个很好的休息。如你所知，我们的人民在酿酒方面有特别高的技术，我们最近扩大生产的举措已经顺利完成了。kvevri，即盛放液体的超大陶罐，已经被埋入地下，我们的葡萄种植者已经开始工作了。用不了多久，我们就可以享受到今年的产品，这是每个人都乐意庆祝的事情。"
 me_iberia_13_title:0 "$iberia_missions_task_13$#!"
 me_iberia_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_iberia_14.a:0 "统治伊比利亚人是我一生中最大的荣幸"
 me_iberia_14_desc:0 "虽然想象后世对[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的事迹会有什么评价是一种狂妄，但我们相信，法纳瓦兹德的名字将在永恒中回响。没有其他统治家族为我们的人民做了这么多；埃里斯塔维家族统治着一个满足的社会，通过改变我们所说的语言和所写的文字，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，那个用太阳点燃自己的人，实际上已经塑造了我们对现实的看法。只要人们记得伊比利亚王国，他们就会记得创造她的国王家族。"
 me_iberia_14_title:0 "法尔纳瓦兹之血"
 me_iberia_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_iberia_1_desc:0 "虽然我们猛烈地爱着我们的祖国，并会欣然放下我们的生命来保卫我们的国家，但我们承认我们的地理环境还有待改善；我们简直是四面受敌，这种情况让[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在晚上长时间无法入睡。我们的军事顾问不能决定谁是我们邻国中最弱的，这使我们更加混乱，所以决定我们应该在各个方向上编造主张，等待一个合适的时机进行扩张。"
 me_iberia_1_title:0 "$iberia_missions_task_1$#!"
 me_iberia_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_iberia_2.a:0 "Pontus Euxinus的水域就在地平线上!"
 me_iberia_2_desc:0 "一件事导致了另一件事，由于我们的军队在战场上取得了胜利，我们的将军们看到了一个机会，可以摧毁阿尔巴尼亚人和科尔奇人的剩余军队。因为他们在我们的手下失去了核心领土，他们的部队已经支离破碎，处于混乱状态，我们的间谍报告说，敌人营地的士气处于历史最低点。我们决不能让他们有任何喘息的机会，而必须趁势出击！\"！"
 me_iberia_2_title:0 "$iberia_missions_task_2$#!"
 me_iberia_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_iberia_3.a:0 "立即开始构建一个舰队!"
 me_iberia_3_desc:0 "我们不仅成功地将科尔奇人赶出了他们的海岸线，而且还成功地洗劫了位于欧克西努斯桥沿岸的一些较小的独立城邦--这一点将在远离我们自己的首都受到关注。但现在不要管这些了；正是在这里，在我们的新城市[GetProvince('(int32)1720').GetName]，我们的海军雄心将诞生。有机会进入这个水域，有机会建立贸易联系，甚至有机会进行军事扩张，这就向世界宣布，伊比利亚不是一个小角色，而是一个不可忽视的力量。"
 me_iberia_3_title:0 "$iberia_missions_task_3$#!"
 me_iberia_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_iberia_4.a:0 "随着时间的推移，阿尔巴尼亚人将采用我们的方式--吞并他们"
 me_iberia_4_desc:0 "虽然阿尔巴尼亚部落的人，也就是我们东边的野蛮表亲，竭力抵抗我们的士兵，但最终他们的命运与科尔基斯人相似。不过，我们还是要向他们的战士致敬，并对迫使我们杀死我们的高加索兄弟的情况表示遗憾。\n\n现在已经收到了阿尔巴尼亚领导人的最后呈文，有人建议我们在剩余的部落中建立一个藩属国家。我们政府中的一些声音建议，这些粗鲁的野蛮人应该保持距离，而其他人则认为，他们应该得到与我们其他公民一样的机会\n\n不幸的是，对于阿尔巴尼亚人来说，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的决心从未如此坚定。"
 me_iberia_4_title:0 "$iberia_missions_task_4$#!"
 me_iberia_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_iberia_5.a:0 "你永远不会听到我们抱怨这样的事情"
 me_iberia_5_desc:0 "来自Pontus Euxinus沿岸城市的好消息!由于我们认为合适，向[GetProvince('(int32)1737').GetArea.GetName]的船厂适当地提供了优秀的木材，看来我们正在享受这个地区的小繁荣--不仅我们的船工变得更善于建造可用的船只，而且越来越多的旅行者决定留在这个地区。我们在该地区的投资已经做得相当好。"
 me_iberia_5_title:0 "$iberia_missions_task_5$#!"
 me_iberia_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_iberia_6.a:0 "拿着戒指、腰带、权杖和剑——记住你的誓言。"
 me_iberia_6_desc:0 "掌权后的第一件事就是召开大议会，整个[SCOPE.GetRootScope.GetCountry.GetName]的主要家族将派代表来欢迎新的统治者。\到达[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]后，这次会议的目的很快就明确了；渴望和平与稳定高于一切，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]决定创建一个特殊类型的管理机构，一个被称为 \"eristavi \"的职位，它将作为皇家意志的延伸。"
 me_iberia_6_title:0 "$iberia_missions_task_6$#!"
 me_iberia_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_iberia_7.a:0 "我们的官方记录将以新的方式书写"
 me_iberia_7_desc:0 "我们很感激我们的土地上充满了各种不同的民族，但要统治这样一个不同的群体是公认的困难，在这里，每个山谷都说着稍微不同的方言，使用的书写系统可能是附近城市的商人所不能理解的。\意识到这已经成为一种困境，特别是当涉及到精简我们的行政管理时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]命令每个人都使用一种新的文字，一种明确为我们的人民所创造的文字。还规定，[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的居民所接受的说话方式现在是官方白话，所以每个人都必须采用我们的特殊口音。"
 me_iberia_7_title:0 "$iberia_missions_task_7$#!"
 me_iberia_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_iberia_8.a:0 "多温城是伊比利亚的重要组成部分。"
 me_iberia_8_desc:0 "[GetProvince('(int32)1572').GetName]这座骄傲城市早在我们的[ROOT.GetCountry.GetAdjective]同胞首次来到[GetProvince('(int32)1757').GetArea.GetName]地区群山之前，就已经深受当地人民喜爱。但无人能否认，[ROOT.GetCountry.GetName]已经把这座城镇明珠改造成了更宏伟的存在。\n\n在已经为我国作出如此多贡献的[ROOT.GetCountry.GetRuler.GetName]领导下，德温的重要性只会继续增长。"
 me_iberia_8_title:0 "$iberia_missions_task_8$#!"
 me_iberia_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $iberia_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_iberia_9.a:0 "我们将摧毁任何反对我们设计的人!"

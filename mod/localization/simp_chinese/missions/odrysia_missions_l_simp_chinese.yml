l_simp_chinese:
 THRACIA_ADJECTIVE:0 "俄德律西亚王国"
 THRACIA_NAME:0 "俄德律西亚王国"
 alliance_accepted:0 "色雷斯人的盟友"
 desc_macedonian_mercenaries:0 "我们已经发出号召，希望任何寻求加入我们的马其顿人都能加入。"
 disloyal_pontics_mod:0 "不忠诚的邦特人"
 disloyal_pontics_mod_desc:0 "我们对宗主的忠诚已经被山区的色雷斯叛军所动摇。"
 disloyal_thrace:0 "争取独立的意愿"
 fierce_thracian:0 "凶猛的色雷斯人"
 form_thrace:0 "改革俄德律西亚王国"
 form_thrace_desc:0 "公元前360年科提斯一世死后，俄德律西亚王国被撕裂为三部分，并被腓力二世麾下崛起的马其顿人逐步整合。然而，一位新的强大领袖或许能带回科提斯一世的荣耀岁月，甚至重现伟大的泰雷斯本人之辉煌。"
 formable_not_thrace_exists:0 "#Y 俄德律西亚王国#!必须不存在。"
 happy_thracians:0 "友好关系"
 loyal_thrace:0 "忠诚的附属国"
 macedonian_mercenaries:0 "马其顿兵团"
 me_odrysia.1.a:0 "我们将与马其顿人站在一起，以免我们都被摧毁。"
 me_odrysia.1.b:0 "我们将为我们的祖国而战!"
 me_odrysia.10.a:0 "妙不可言!"
 me_odrysia.11.a:0 "荒唐！他们会后悔的！他们会后悔的"
 me_odrysia.12.a:0 "只有团结起来，我们才能生存"
 me_odrysia.2.a:0 "我们将立即守卫北方"
 me_odrysia.2.b:0 "我们目前的位置是足够的"
 me_odrysia.7.a:0 "让我们希望他们像我们一样不喜欢马其顿人。"
 me_odrysia.8.a:0 "我们应该接受!"
 me_odrysia.8.b:0 "冒着被报复的危险？绝不!"
 me_odrysia_10_desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，关于我们发给希腊人的信息，我有一个好消息。他们已经accepted了我们的建议!"
 me_odrysia_10_title:0 "希腊人的回答"
 me_odrysia_11_desc:0 "不得不说，希腊人不愧为聪明的谈判者，因为我们还没能就任何问题达成协议。"
 me_odrysia_11_title:0 "希腊人的回答"
 me_odrysia_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]最近发表了一篇演讲，其华丽的辞藻让人联想到共和国参议院中常见的冗长演说，他慷慨激昂地呼吁海外同胞放弃奴隶生活，集体返回[ROOT.GetCountry.GetName]的庇护之下。\n\n尽管许多人对这一开放边境政策表示感激，但也有不少人感到愤怒——尤其是[GetCharacter('(int32)41').GetName]，他已在[GetProvince('(int32)478').GetName]提出了正式投诉。"
 me_odrysia_12_title:0 "一个分裂的民族"
 me_odrysia_1_desc:0 "战争即将来临! 风中已经染上了死亡的臭味。[GetCharacter('(int32)39').GetName]的将军们正在进行他们最后的伟大战斗，在北方的荒原上，有动静在蠢蠢欲动，有传言说流浪的野蛮人奇怪而绝望的迁徙扰乱了事物的秩序。\n\n我们正处于生存的十字路口，有一些困难的选择要做——我们是放弃马其顿的监督者，试图重新统一色雷斯的土地，还是在马其顿人需要的时候与他们站在一起，为自己打造一个新传承？"
 me_odrysia_1_title:0 "南方的马其顿人"
 me_odrysia_2_a_tt:0 "#Y 我们将向其他色雷斯部落发出在我们治下实现统一的提议。#!"
 me_odrysia_2_desc:0 "我们已经加强了与马其顿监督者的关系，值得庆幸的是这给我们双方带来了实实在在的好处。现在我们必须将色雷斯和摩厄西亚的其他地区团结在我们的旗帜下，这样我们才能成为色雷斯坚不可摧的盾牌。我们的马其顿主人已经答应加入我们对北方部落的战斗，他们渴望分享荣耀和掠夺。分开的时候我们很弱小，但在一起我们会生存。"
 me_odrysia_2_title:0 "成为北方的堡垒"
 me_odrysia_3.a:0 "我们将去找[potential_wife_1.GetName]"
 me_odrysia_3.b:0 "[potential_wife_2.GetName]看起来不错"
 me_odrysia_3.c:0 "为什么不是[potential_wife_3.GetName]呢？"
 me_odrysia_3_desc:0 "在走向与马其顿宗主平起平坐的过程中，我们希望通过婚姻把彼此家族交织在一起；他们已经同意为[ROOT.GetCountry.GetRuler.GetName]送来一位新娘。为此，已经找到三位年轻女子，皆适合作为我们统治者的妻子；现在，他将承担起选择未来伴侣这项令人愉快的任务。"
 me_odrysia_3_title:0 "寻找一个合适的新娘"
 me_odrysia_4.a:0 "让我们结合两个王朝，换取一个更安宁的色雷斯！"
 me_odrysia_4.b:0 "要我们之中有人嫁给肮脏的蛮族？绝不！"
 me_odrysia_4_desc:0 "我们麻烦的臣属俄德律西亚人带来了一个出乎意料的提议：他们希望通过婚姻把我们的家族结合在一起，以平息土地上的不安，并为和平共处铺平道路。我们该如何回应这些蛮族提出的大胆建议？"
 me_odrysia_4_title:0 "一个不寻常的提议"
 me_odrysia_5.a:0 "欢呼吧! 这是值得庆祝的"
 me_odrysia_5.b:0 "他们怎么敢！？"
 me_odrysia_5_desc_1:0 "我们收到了我们的宗主的消息，他在答复之前仔细考虑了我们的建议——他们接受我们所要求的。"
 me_odrysia_5_desc_2:0 "我们收到了我们的宗主的消息，他在回复前仔细考虑了我们的建议——他们目前拒绝了我们的请求。"
 me_odrysia_5_title:0 "宗主的回答"
 me_odrysia_7_desc:0 "我们已经派出外交官到沿海的希腊大城市，要求他们在即将到来的战斗中保持中立。虽然没有任何保证，但我们希望他们的自私贪婪会让他们在时机到来时不参与冲突。"
 me_odrysia_7_title:0 "与希腊人谈判"
 me_odrysia_8_desc:0 "大山深处的俄德律西亚人向我们提出了一个建议，我们应该仔细考虑。他们希望从我们共同的宗主马其顿人手中争取自由，并且很想知道我们是否可以联合起来，以增加我们在即将到来的战争中的机会。然而，他们不寻求与我们争吵，并提议签订不侵犯条约。"
 me_odrysia_8_title:0 "来自俄德律西亚人的提议"
 me_odrysia_9_finish.a:0 "[GetProvince('(int32)478').GetName]是一个自由民族的家园"
 me_odrysia_9_finish.att:0 "#Y 若马其顿人胆敢来犯，我们将号召盟邦共同御敌。#!"
 me_odrysia_9_finish_desc:0 "我们已经宣布了我们的独立，并将我们的盟友聚集在我们这边。现在已经没有退路了；不管会发生什么，我们都愿意为我们的自由而战，哪怕牺牲我们家人的生命。我们不能再过着被奴役的生活了!"
 me_odrysia_9_finish_title:0 "色雷斯人的战争"
 me_odrysia_finish.1.a:0 "未来会给我们带来什么？"
 me_odrysia_finish.10.a:0 "我们将推倒我们敌人的城墙!"
 me_odrysia_finish.21.a:0 "好消息!"
 me_odrysia_finish.22.a:0 "他们怎么敢这么做？"
 me_odrysia_finish.23.a:0 "那就这样吧……"
 me_odrysia_finish.24.a:0 "也许他们比我们想象的更弱？"
 me_odrysia_finish.3.a:0 "一个明智的协议。"
 me_odrysia_finish.6.a:0 "我们已经准备好迎接任何事情的到来"
 me_odrysia_finish_10_title:0 "征服海岸"
 me_odrysia_finish_11.a:0 "希望它能持续一千年!"
 me_odrysia_finish_11_title:0 "从宫廷到首都"
 me_odrysia_finish_13.a:0 "我们的人民应该得到这一切，甚至更多"
 me_odrysia_finish_13_desc:0 "虽然[ROOT.GetCountry.GetRuler.GetName]以许多方面著称--一个有能力的外交官、一个无与伦比的战士和一个为[ROOT.GetCountry.GetAdjective]人民而战的猛将--但很少有人知道，[ROOT.GetCountry.GetRuler.GetSheHe]暗中培养了对建筑的热情。\n\n如果他们参观[GetProvince('(int32)478').GetName]，所有人都可以见证[ROOT.GetCountry.GetRulerTitle]的宏伟愿景，它是为了尊重我们领导人的愿望而建造和塑造的。"
 me_odrysia_finish_13_title:0 "真正的色雷斯人的首都"
 me_odrysia_finish_14.a:0 "欢迎加入这个大家庭!"
 me_odrysia_finish_14_title:0 "欢迎我们的马其顿兄弟"
 me_odrysia_finish_15.a:0 "欢呼吧! 这一天将被载入俄德律西亚历史!"
 me_odrysia_finish_15_title:0 "一个国王的王国"
 me_odrysia_finish_16.a:0 "我们会粉碎他们的!"
 me_odrysia_finish_16.b:0 "让他们拥有自由——我们现在不能处理这个问题。"
 me_odrysia_finish_16_desc:0 "狡诈的色雷斯人蜷缩在他们的山丘和森林中，已经宣布从我们这里独立。这是不可能的--是时候让他们知道谁是他们的主人了。你怎么说，[ROOT.GetCountry.GetRuler.GetName]？"
 me_odrysia_finish_16_title:0 "色雷斯人的战争"
 me_odrysia_finish_17.a:0 "好极了"
 me_odrysia_finish_17_desc:0 "我们的外交官带来了好消息——我们的表亲同意加入我们对抗马其顿侵略者的斗争，并将在战斗时间到来时与我们一起进军。"
 me_odrysia_finish_17_title:0 "来自我们兄弟的答复"
 me_odrysia_finish_18.a:0 "叛徒! 有一天我们会记住这一点"
 me_odrysia_finish_18_desc:0 "我不高兴地告诉你，我的[ROOT.GetCountry.GetRulerTitle.]，我们懦弱的亲戚们拒绝帮助我们解放祖国的斗争。我们没有他们的帮助，将不得不独自战斗。"
 me_odrysia_finish_18_title:0 "冷漠的邻国"
 me_odrysia_finish_19.a:0 "妙极了! 他们是多么的可悲……"
 me_odrysia_finish_19_desc:0 "意识到另一种选择是死亡和失去他们所珍视的一切，我们的臣民已经accepted他们的奴役，并且不为自己辩护而屈服。"
 me_odrysia_finish_19_title:0 "接受统一"
 me_odrysia_finish_1_desc:0 "许多年前，我们的统治者[GetCharacter('(int32)101').GetName]在为我们从马其顿人手中争取自由的斗争中失败了，这使他永远感到羞愧。\n\n在我们被烧毁的和平自治梦想的散落的灰烬中，也许我们以前的荣耀的火花仍然存在，等待着正确的领导者将它恢复成熊熊烈火。我们是否能够及时重新点燃它，在即将到来的风暴中生存下来？"
 me_odrysia_finish_1_title:0 "重新点燃火焰"
 me_odrysia_finish_20.a:0 "那就这样吧……"
 me_odrysia_finish_20_desc:0 "我们要求统一的尝试遭到了蔑视和威胁，我们的目标警告我们留在自己的土地上。\n\n我想这意味着我们已经失去了惊喜的因素……他们现在肯定会期待我们的士兵。"
 me_odrysia_finish_20_title:0 "统一被拒绝"
 me_odrysia_finish_21_a_tt:0 "#Y 我国获得所有其他色雷斯部落土地的宣称权，并与马其顿人达成停战协议。#!"
 me_odrysia_finish_21_desc:0 "欣喜的一天! 宗主的信使们带来了一个好消息，他们同意了我们的提议！这是个好消息！"
 me_odrysia_finish_21_title:0 "宗主的回答"
 me_odrysia_finish_22_desc:0 "尽管我们以开放的态度和合作的精神与我们的宗主接洽，但他们却拒绝了我们合作的尝试，让我们空手而归。"
 me_odrysia_finish_22_title:0 "宗主的回答"
 me_odrysia_finish_23_desc:0 "好吧，如果我们希望不必为之奋斗就能获得自由，那么现在我们知道，这是一个愚蠢的梦想。我们的宗主拒绝了我们的独立宣言，对我们和我们的盟友宣战。"
 me_odrysia_finish_23_title:0 "宗主宣战"
 me_odrysia_finish_24_desc:0 "我们的宗主退让了，允许我们成为一个独立的民族，而没有为此大动干戈。"
 me_odrysia_finish_24_title:0 "我们的宗主屈服了"
 me_odrysia_finish_3_desc:0 "我们想与我们的领主达成协议。我们没有必要对我们的提议进行过多的描述；当他们保卫南部色雷斯时，可以由我们来保护北部。希望他们能看到这其中的智慧。"
 me_odrysia_finish_3_title:0 "与吕西马库斯谈判"
 me_odrysia_finish_6_desc:0 "我们很高兴地报告，经过一段时间的整合，[ROOT.GetCountry.GetRuler.GetName]要求的准备冲突的军队已经在[ROOT.GetCountry.GetCapital.GetName]外征召。即使是现在，我们也在向诸神献祭，请求保护，因为我们准备把我们的士兵送到危险的地方。"
 me_odrysia_finish_6_title:0 "召集人手"
 me_odrysia_mid.3.a:0 "一个绝妙的主意!"
 me_odrysia_mid.3.b:0 "俄德律西亚人是不可信任的。"
 me_odrysia_mid_2.a:0 "现在是团结起来的时候了!"
 me_odrysia_mid_2.b:0 "叛徒们! 我们要把他们的心挖出来!"
 me_odrysia_mid_2_a_tt:0 "#Y 这会导致我们被吞并！#!"
 me_odrysia_mid_2_b_tt:0 "#Y 这将引发我们人民之间的战争。#!"
 me_odrysia_mid_2_desc:0 "俄德律西亚人，南方的马其顿狗的奴隶，来要求我们的自由——他们要求我们屈膝，在他们手下做奴仆。虽然这将使我们的人民处于更安全的地位，但我们也将失去所有的自主权……但我们真的准备好打一场战争了吗？"
 me_odrysia_mid_2_title:0 "对统一的要求"
 me_odrysia_mid_3_a_tt:0 "#Y 我们同意实行联合管理，并宣布双方人民之间停火。#!"
 me_odrysia_mid_3_desc:0 "我们一贯善变的俄德律西亚人附庸向我们提出了一个建议。他们希望在色雷斯的管理和防御方面进行合作——这不是我们期望听到的。他们同意继续作为我们忠诚的附庸，并愿意保护我们的北部边界，只要我们保卫南部。"
 me_odrysia_mid_3_title:0 "来自俄德律西亚人的建议"
 me_odrysia_mid_4.a:0 "一个冒险的机会？我们当然会加入"
 me_odrysia_mid_4.b:0 "我们对他们的斗争有什么兴趣？"
 me_odrysia_mid_4_desc:0 "俄德律西亚人对他们的马其顿主人感到厌倦，希望与我们结盟，这样我们就可以帮助他们赶走这些外国侵略者，夺回我们的土地。\n\n这听起来确实是一个光荣的、甚至是危险的请求，但我们将如何决定还有待观察——两种选择都有其优点。"
 me_odrysia_mid_4_title:0 "俄德律西亚人的提议"
 me_odrysia_start.12.a:0 "让我们把我们的人民带回家"
 me_odrysia_start.14.a:0 "为了色雷斯！"
 me_odrysia_start.3.a:0 "为了色雷斯的生存！"
 me_odrysia_start.4.a:0 "让我们立即派出代表团"
 me_odrysia_start.4.a_tt:0 "#Y 我们将获得对色雷斯全境的宣称，并向我们的同伙派遣代表团。#!"
 me_odrysia_start.4.b:0 "我们将独自战斗——我们不需要帮助"
 me_odrysia_start.5.a:0 "让我们为[ROOT.GetCountry.GetRuler.GetFirst Name]找一个妻子吧!"
 me_odrysia_start.6.a:0 "开启铁匠铺，铸造战争武器！"
 me_odrysia_start.6.desc:0 "意识到我们需要每一个可以得到的战斗人员，[ROOT.GetCountry.GetRuler.GetName]已经决定发出征兵令--他们要尽快在[ROOT.GetCountry.GetCapital.GetName]集合。"
 me_odrysia_start.6.title:0 "召集人手"
 me_odrysia_start_12_desc:0 "现在我们有能力援助俄德律西亚侨民，[ROOT.GetCountry.GetRuler.GetName]已经宣布[ROOT.GetCountry.GetRuler.GetSheHe]不久将发表演讲，概述一个愿景，所有人都很好奇[ROOT.GetCountry.GetRulerTitle]有什么想法。"
 me_odrysia_start_12_title:0 "一个分裂的民族"
 me_odrysia_start_14_desc:0 "已经决定，我们将发展与马其顿人的联系，而不是忽视与他们合作可能给[ROOT.GetCountry.GetName]带来的明显好处。\n\n还需要看看他们会如何回应，但我们充满希望。"
 me_odrysia_start_14_title:0 "欢迎我们的马其顿兄弟"
 me_odrysia_start_3_desc:0 "我们已经达成共识，我们依赖我们的马其顿宗主，但他们也依赖我们——这一点让我们很高兴。当他们把注意力集中在南方时，我们可以转向北方，成为色雷斯的盾牌，确保我们共同的繁荣和安全。"
 me_odrysia_start_3_title:0 "与吕西马库斯谈判"
 me_odrysia_start_4_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在面对即将到来的战争时，我们要做出一个决定--我们是否会向我们的兄弟寻求援助？我们的亲戚有可能会响应号召，但他们很可能无视我们，或者等到我们被削弱后再自己入侵我们。"
 me_odrysia_start_4_title:0 "寻找我们的兄弟"
 me_odrysia_start_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已经决定通过寻求配偶，花一些时间在[ROOT.GetCountry.GetRuler.GetHerHis]个人生活上。看到我们的领袖幸福，这对我们的人民来说是件好事，所以我们应开始寻找。"
 me_odrysia_start_5_title:0 "通过婚姻的纽带"
 me_odyrsia_finish_10_desc:0 "我们不仅洗劫了他们的城市，将#E Pontus Euxinus#!海岸上的小城市的财富据为己有，而且我们甚至取得了一个有人说是更大的成就--我们在被打败的城市的财产中发现了许多奇妙的东西，包括许多关于建造强大#E Siege Engines#!的论文和图表，我们完全打算好好利用这些。"
 me_odyrsia_finish_11_desc:0 "[GetProvince('(int32)478').GetName]长期以来一直是我们行政和外交的中心场所，但说实话，它一直是一个堡垒，而不是一个真正的城市。\n\n然而，在[ROOT.GetCountry.GetRuler.GetName]的激励统治下，我们已经采取措施改善我们的首都。通过将更多分散的人口整合到城墙内，我们已经建立了一个开始类似于政体的东西。"
 me_odyrsia_finish_14_desc:0 "现在，关于我们打算与马其顿人和平共处的消息已经传得很远，我们很高兴地报告，他们的许多最好的战士已经搬到了我们的领土上。\n\n不言而喻，我们现在有一个经验丰富的战士组成的熟练队伍，我们可以从中吸取经验。"
 me_odyrsia_finish_15_desc:0 "尽管对我们不利的因素被认为是不可逾越的，但不知何故，[ROOT.GetCountry.GetRuler.GetName]成功地摧毁了与[ROOT.GetCountry.GetName]结盟的强大力量，恢复了很久以前被摧毁的王国。\n\n现在，在我们胜利的时刻，将在[ROOT.GetCountry.GetCapital.GetName]举行盛大的庆典，纪念我们无与伦比的[ROOT.GetCountry.GetRulerTitle.]的永恒成就。"
 mustering_men_mod:0 "召集人手"
 mustering_men_mod_desc:0 "我们将尽可能多地召集战斗人员加入我们的事业，因为我们国家对自由的渴望很强烈，很多人都会去战斗。"
 odrysia_mission_01_freedom_task_02_tt:0 "我们将不得不决定要么与我们的霸主作战，要么加入他们。"
 odrysia_mission_completion_reward:0 "色雷斯复兴"
 odrysia_missions_01_freedom:0 "南方的马其顿人"
 odrysia_missions_01_freedom_BUTTON_TOOLTIP:0 "愿战争之神带领我们的部落成员走向胜利!"
 odrysia_missions_01_freedom_CRITERIA_DESCRIPTION:0 "当我们改革#E 俄德律西亚王国#!，这个使命才算完成。"
 odrysia_missions_01_freedom_DESCRIPTION:0 "短短几年前，我们强大的#E 俄德律西亚#!部落成员被马其顿将军#E 色雷斯的吕西马科斯#!击败，这个僭主在希腊湾附近统治。尽管奸诈的色雷斯僭主认为我们的意志已经崩溃，但我们将通过推翻我们的宗主并宣布一个独立俄德律西亚的重生来报答这种狂妄！"
 odrysia_missions_01_freedom_task_01:0 "重新燃起的火焰"
 odrysia_missions_01_freedom_task_01_DESC:0 "公元前313年，俄德律西亚人被[GetCharacter('(int32)41').GetName]的手击败，有效地结束了他们的自治。虽然被制服了，但色雷斯人继续为他们的自由而战，与马其顿人对抗。\n\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 odrysia_missions_01_freedom_task_01_tt:0 "我们必须对[GetCountry('TRE').GetName|G]宣战，并维持战争状态直至触发#T 特殊事件#!。"
 odrysia_missions_01_freedom_task_02:0 "南方的马其顿人"
 odrysia_missions_01_freedom_task_02_DESC:0 "在[GetCharacter('(int32)39').GetName]死后，[GetCharacter('(int32)41').GetName]被任命为色雷斯总督。在接下来的几年里，他花了很多时间平息叛乱，安抚土地，让色雷斯人极为不满——这是我们可以利用的良机。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 odrysia_missions_01_freedom_task_02_tt:0 "#Y 我们将就色雷斯区域未来的发展方向做出最终决定。#!"
 odrysia_missions_01_freedom_task_03:0 "向吕西马科斯派遣使节"
 odrysia_missions_01_freedom_task_03_DESC:0 "希腊人和色雷斯人之间的外交关系是有目共睹的；甚至色诺芬也承认，色雷斯人的文明程度比人们给他们的评价要高。我们不是单纯的野蛮人，而是尊重外交的规则。\n\n\n\n\n\n\n\n\n\n\n@greek_mil13!。"
 odrysia_missions_01_freedom_task_03_tt:0 "#Y 我们将派遣外交使节前往马其顿统治者处，商讨在色雷斯地区共同发展的未来。#!"
 odrysia_missions_01_freedom_task_04:0 "寻找我们的兄弟"
 odrysia_missions_01_freedom_task_04_DESC:0 "虽然古代作家经常将其称为单一民族，但Thrace的土地上居住着许多不同的部落和王国。尽管他们之间经常有竞争，但他们也倾向于团结起来对付共同的威胁。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!。"
 odrysia_missions_01_freedom_task_04_tt:0 "#Y 我们将寻求摩厄西亚区域的兄弟们设计一个计划，以摆脱入侵的马其顿人。#! "
 odrysia_missions_01_freedom_task_05:0 "通过婚姻的纽带"
 odrysia_missions_01_freedom_task_05_DESC:0 "爱——诗人的灵感，青年的喜悦和老年的遗憾。一个人不需要成为哲学家就能知道，婚姻可以是一件美妙的事情。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!。"
 odrysia_missions_01_freedom_task_05_tt:0 "#Y 这将导致我们向主人统治家族索要一位新的新娘。#!"
 odrysia_missions_01_freedom_task_06:0 "召集男人"
 odrysia_missions_01_freedom_task_06_DESC:0 "希罗多德认为俄德律西亚人是地中海世界上人数最多的民族，并担心如果他们有一天联合起来，在战斗力方面将无人能及。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 odrysia_missions_01_freedom_task_07:0 "赢得希腊人的青睐"
 odrysia_missions_01_freedom_task_07_DESC:0 "\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 odrysia_missions_01_freedom_task_07_tt:0 "#Y 我们将会派遣使团前往本都希腊城市，请求他们在即将到来的色雷斯争夺战中保持中立。#!"
 odrysia_missions_01_freedom_task_08:0 "成为北方的堡垒"
 odrysia_missions_01_freedom_task_08_DESC:0 "到公元前3世纪初，许多北方的高卢人向南迁移，在#E 希腊#!和#E 安纳托利亚#!的定居地中海人口中造成了巨大的破坏。正是这些迁徙也导致了俄德律西亚人的终结。如果我们的祖先能够适当地专注于保卫他们的北部边界，也许他们就不会在猝不及防的情况下被毁灭。\n\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 odrysia_missions_01_freedom_task_08_tt:0 "#Y 本使命将向其他色雷斯部落发出统一提案，结果将导致他们被吞并或爆发战争。#!"
 odrysia_missions_01_freedom_task_09:0 "色雷斯人的战争"
 odrysia_missions_01_freedom_task_09_DESC:0 "一个真正的色雷斯人宁愿为自己的自由而战而死，也不愿看到自己对一个外国人的顺从! 如果我们想重新获得自主权，战争似乎不可避免，但我们对战斗的前景感到兴奋。 n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 odrysia_missions_01_freedom_task_09_tt:0 "#Y  这将导致与我们的宗主国开战，从而彻底摆脱他们的束缚。#!"
 odrysia_missions_01_freedom_task_10:0 "征服海岸"
 odrysia_missions_01_freedom_task_10_DESC:0 "如果我们能够征服并吞并我们东部沿海的富裕城市，那么我们整个国家将从我们的掠夺中受益。\n\n\n\n\n\n\n\n\n\n@greek_mil15!。"
 odrysia_missions_01_freedom_task_11:0 "从宫廷到首都"
 odrysia_missions_01_freedom_task_11_DESC:0 "由塞乌特斯三世所建的都城塞乌托波利斯，仿照马其顿风格建造，旨在集中管理俄德律西亚人。除行政职能外，该城还兼具宗教圣地的功能。\n\n虽称\"波利斯\"，但与吕西玛刻亚或叙利亚的塞琉西亚等真正都城相比，塞乌托波利斯始终未成气候——但在[ROOT.GetCountry.GetRuler.GetName]统治下，此况将改。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 odrysia_missions_01_freedom_task_12:0 "一个分裂的民族"
 odrysia_missions_01_freedom_task_12_DESC:0 "公元前313年，在吕西马科斯手中战败后，俄德律西亚王国的残余势力被放逐到色雷斯的高地和内地，留下沿海地区以及相当一部分人口在马其顿人手中。\n\n让我们向远方传递消息，俄德律西亚的力量在流亡中聚集，欢迎所有愿意为她的荣耀而战的人加入我们！\n\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 odrysia_missions_01_freedom_task_12_tt:0 "#Y 来自邻近地区的多个俄德律西亚人口将迁移至你的领地。#!"
 odrysia_missions_01_freedom_task_13:0 "真正的色雷斯之都"
 odrysia_missions_01_freedom_task_13_DESC:0 "尽管如此庞大的工程会有很多费用，但让我们尽我们所能，为我们值得尊敬的人民建立一个真正的色雷斯首都。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 odrysia_missions_01_freedom_task_14:0 "欢迎我们的马其顿兄弟"
 odrysia_missions_01_freedom_task_14_DESC:0 "尽管他们的环境已经改变，但没有人可以否认马其顿人对我们国家的影响。我们应该拥抱我们可以从他们身上学到的好东西，比如他们对战争方式的掌握。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!。"
 odrysia_missions_01_freedom_task_15:0 "一个国王的王国"
 odrysia_missions_01_freedom_task_15_DESC:0 "在我们胜利的时刻，在我们刚从#E 色雷斯#!中获得自由的时候，让我们庆祝[ROOT.GetCountry.GetRuler.GetName]的成就，给[ROOT.GetCountry.GetRuler.GetHerHim]戴上#E 俄德律西亚#!的皇冠。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!。"
 our_fight:0 "我们的斗争"
 our_fight_desc:0 "我们将为我们的生存权而战!"
 siege_ability_odr:0 "更好的攻城工程师"
 true_captial_smod:0 "真正的色雷斯之都"
 turbulent_migration_smod:0 "动荡的迁徙"

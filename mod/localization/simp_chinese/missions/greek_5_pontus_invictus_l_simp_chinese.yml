l_simp_chinese:
 BPL_ADJECTIVE:0 "博斯普鲁斯"
 BPL_NAME:0 "博斯普鲁斯联盟"
 ISL_ADJECTIVE:0 "伊斯特里亚"
 ISL_NAME:0 "伊斯特里亚联盟"
 NICKNAME_KIDEMONAS:0 "“保卫者”"
 PTL_ADJECTIVE:0 "本都"
 PTL_NAME:0 "本都联盟"
 desc_me_gre_5_12_cmod:0 "对安纳托利亚北部海岸的全面控制正在产生积极的经济和文化成果，因为人们看到许多以前的当地人都采用我们的习俗。"
 desc_me_gre_5_13_cmod:0 "对泰拉斯（Tyras）河和玻律斯忒涅斯（Borysthenes）河口的完全控制正在产生积极的经济和文化成果，因为许多以前的当地人已经看到采用我们的习俗。"
 desc_me_gre_5_14_cmod:0 "对安纳托利亚北部海岸的全面控制正在产生积极的经济和文化成果，许多前当地人已经被观察到开始采用我们的习俗。"
 desc_me_gre_5_15_1_pmod:0 "米利托斯的居民重新获得了米利托斯，这引发了该地区的定居和发展浪潮。"
 desc_me_gre_5_15_2_pmod:0 "本都的赫拉克利亚被其离去已久的人民重新获得，引发了该地区的定居和发展浪潮。"
 desc_me_gre_5_16_cmod:0 "我们海军的扩张为我们的造船业注入了活力，使水手们充满了自豪感和使命感。"
 desc_me_gre_5_18_pmod:0 "由于我们新的影响力，我们的商人被淹没在各种机会中，使他们只愿意补贴我们的舰队。"
 desc_me_gre_5_19_1_pmod:0 "我们鼓励发展这个新的避风港，使之成为学习和文化的中心。"
 desc_me_gre_5_19_2_pmod:0 "我们鼓励这个新的避难所发展成为贸易和生产中心。"
 desc_me_gre_5_23_cmod:0 "贵族、商人、外交官和朝圣者都从远方赶来，向我们城市的新庙宇群致敬。"
 desc_me_gre_5_24_cmod:0 "在将斯巴达基德的前首都夷为平地之后，一座新的城市将从其灰烬中崛起。它的目的是要超越它的前身，比他们有限的愿望所允许的更高。"
 desc_me_gre_5_24_pmod:0 "我们鼓励发展这个新的避难所作为文明和资本的中心。"
 desc_me_gre_5_25_pmod:0 "这片领土是黑海周围的奴隶贸易中心。"
 desc_me_gre_5_2_pmod:0 "我们鼓励发展这个新的避风港，使之成为黑海文化和资本的中心。"
 desc_me_gre_5_3_pmod:0 "我们鼓励发展这个新的避风港，使之成为黑海商业和资本的中心。"
 desc_me_gre_5_40_pmod:0 "这里有一座从未被修复的古神庙的废墟。"
 desc_me_gre_5_5_cmod:0 "这些天来，从奴隶到贵族，每个人似乎都被最近的战争宣传所激怒了。"
 desc_me_gre_5_8_cmod:0 "我们已经进入了一个相对和平和繁荣的新时期。"
 desc_me_gre_5_cmod:0 "由于最近的经济发展和海外征服的消息，政治格局正在发生变化。"
 greek_5_10:0 "组建博斯普鲁斯联盟"
 greek_5_10_DESC:0 "后世或许会争论不休——究竟是为了掌控黑海贸易霸权，还是出于务实自保之需，才促使我们采取这些行动。但无论如何，此刻正是黑海北岸诸城联合起来，组建新同盟以应对时代挑战之时！"
 greek_5_10_allow_tt:0 "#Y 博斯普鲁斯联盟#!不能已经存在。"
 greek_5_10_reward_tt:0 "我们将形成一个新的国家，并获得对周围省份的宣称。"
 greek_5_11:0 "组建本都联盟"
 greek_5_11_DESC:0 "后世或许会争论不休——究竟是为了掌控黑海贸易霸权，还是出于务实自保之需，才促使我们采取这些行动。但无论如何，此刻正是黑海南岸诸城联合起来，组建新同盟以应对时代挑战之时！"
 greek_5_11_allow_tt:0 "#Y 本都联盟#! 不能已经存在。"
 greek_5_11_reward_tt:0 "我们将形成一个新的国家，并获得对周围省份的宣称。"
 greek_5_12:0 "在十字路口"
 greek_5_12_DESC:0 "以伊斯特洛斯河为界的小斯基泰地区是草原游牧民族、盖塔部落和南部希腊世界之间的门户。对这块领土的控制是捍卫我们利益的首要条件。"
 greek_5_13:0 "大草原的主人"
 greek_5_13_DESC:0 "河流贸易是我们城市的命脉。如果不能完全控制泰拉斯河和玻律斯忒涅斯河的入海口，以及博斯普鲁斯-辛梅里亚，那就什么都不够了。一旦这些土地得到保障，我们将确保控制从游牧部落到希腊世界的货物流动。"
 greek_5_14:0 "本都堡垒"
 greek_5_14_DESC:0 "保卫我们的城市将需要获得更多的领土。通过控制我们的城市和亚洲其他地区之间的山路，我们将能够抵御攻击者，同时从海上得到加强。"
 greek_5_14_reward_tt:0 "你将在你的首都获得一个你选择的建筑。\n根据选择，你的首都还可以获得一个修正。"
 greek_5_15:0 "保卫母城"
 greek_5_15_DESC:0 "我们的许多人在历史上都来自米利都或本都的赫拉克利亚。我们政府内部的一个派别强烈宣称采取行动，保卫他们曾经称为母亲的城市。凭借我们新的力量，我们可以夺回我们的家园，为我们的子孙后代保护我们的遗产。"
 greek_5_16:0 "建立一个贸易帝国"
 greek_5_16_DESC:0 "如果我们要与我们的对手竞争，我们必须继续扩大我们的海军能力。"
 greek_5_17:0 "守护商船队"
 greek_5_17_DESC:0 "如果我们要充分利用我们在黑海的商业，我们必须确保商人和旅行者在其水域中的相对安全。"
 greek_5_17_allow_tt:0 "一支至少有#Y 30#!艘两排划桨战船@liburnian!的海军被#Y [gm_family_head_5.GetFamilyDisplayAdjective]#!的家族成员领导。"
 greek_5_17_allow_tt_fallback:0 "一支拥有至少#Y 30#! 名利伯尼亚人@liburnian!的海军由一名海军上将领导。"
 greek_5_17_reward_tt:0 "被任命的上将将获得#G 15#! 忠诚度@loyalty_icon!.\n，然后你可以为这个舰队选择一个奖励。"
 greek_5_18:0 "顶级商人"
 greek_5_18_DESC:0 "与希腊人、斯基泰人、盖塔人和其他民族的贸易导致了我们城市最近的繁荣。众多的新移民涌入我们的城市，我们必须发展以适应他们。"
 greek_5_19:0 "殖民化的遗产"
 greek_5_19_DESC:0 "远离我们曾经称之为家的城市，我们卑微的Poleis的发展使许多人怀疑我们是否要重复历史，在国外建立一个新的城市？"
 greek_5_2:0 "扩展城邦"
 greek_5_20:0 "崇高的追求"
 greek_5_20_DESC:0 "对诸神的适当崇拜伴随着牺牲。我们可能在墙后和船甲板上是安全的，但当被召唤时，可敬的希腊人会回应。"
 greek_5_21:0 "追随伊菲吉妮亚的脚步"
 greek_5_21_DESC:0 "野蛮人和希腊人都知道要尊敬神灵。那些让他们的神龛变得破败的人有祸了......而那些将它们恢复到应有的辉煌的人则是光荣的。"
 greek_5_22:0 "探索陶里卡"
 greek_5_22_DESC:0 "搜索陶里人的土地不是一件小事。它需要时间和努力来实现我们的目标。"
 greek_5_22_allow_tt:0 "神庙不可能已经被发现。"
 greek_5_23:0 "祭祀保护女神"
 greek_5_23_DESC:0 "我们的搜索已经取得了积极的成果!现在我们将颂扬曾经消失在时间中的xoanon，并获得我们应得的威望。"
 greek_5_23_reward_tt:0 "在你的万神殿中会有两个新的神灵。#Y 阿耳忒弥斯·陶罗波洛斯#! 和#Y 赫卡忒·艾菲迈德#!。\n然后你可以决定被遗弃的寺庙的命运。"
 greek_5_24:0 "创建马尼特拉"
 greek_5_24_DESC:0 "曾经引以为豪的斯巴尔托科斯王国的首都，如今已是一片废墟。也许可以建立一个新的忠于我们事业的希腊人城市？"
 greek_5_25:0 "斯基泰贸易者"
 greek_5_25_DESC:0 "奴隶贸易对黑海沿岸城市的经济至关重要，而斯基泰可能是最成功的供应商。#Y [GetProvince('(int32)4557').GetName]#!的领土是该地区的头号奴隶中心。谁能与斯基泰达成有利的贸易协议，谁就一定会开始超越他们的对手。"
 greek_5_25_allow_tt:0 "我们需要与#Y [GetProvince('(int32)4557').GetOwner.GetName]#!保持良好关系。"
 greek_5_25_allow_tt_1:0 "目前没有其他人与#Y [GetProvince('(int32)4557').GetOwner.GetName]#!进行贸易。"
 greek_5_25_reward_tt:0 "我们的一块领土将接收一些新的奴隶人口……如果谈判顺利，可能还会更多。"
 greek_5_2_DESC:0 "与希腊人、斯基泰人、盖塔人和其他民族的贸易导致了我们城市最近的繁荣。众多的新移民涌入我们的城市，我们必须发展，以适应他们。"
 greek_5_2_allow_tt:0 "我们的首都省必须有一个扩大的#Y 国家基础设施#! 来容纳所有这些新居民。"
 greek_5_3:0 "说服议会"
 greek_5_3_DESC:0 "最近，参议院内的许多发言都出现了分裂和派系主义。对于如何使用我们新发现的财富，似乎并没有达成共识。这需要强有力的声音和复杂的政治手段相结合，才能使参议院团结起来。有了参议院的支持，我们将有政治资本来推进我们的扩张计划。"
 greek_5_3_allow_tt:0 "我们必须获得参议院#R 60#! 以上的批准。"
 greek_5_4:0 "与殖民地接洽"
 greek_5_4_DESC:0 "我们的希腊同胞四分五裂，争夺他们那小小的贸易联系和当地出口。我们必须说服他们加入更大的理想，为所有北方希腊人的事业出一份力。"
 greek_5_4_allow_tt:0 "在黑海海岸存在任意领土少于#Y 5#!块的自由希腊国家。"
 greek_5_4_reward_tt:0 "可能获得一个希腊藩属。"
 greek_5_5:0 "边境摩擦"
 greek_5_5_DESC:0 "在我们的政府中，有一些派别正在鼓动对我们的一个邻国在一些领土的所有权方面采取更积极的姿态。"
 greek_5_5_allow_tt:0 "我们必须与一个对我们评价不高的希腊国家或一个非希腊国家接壤。"
 greek_5_6:0 "野蛮人的易货贸易"
 greek_5_6_DESC:0 "和平地扩大贸易机会是希腊的一个古老传统，事实上，并不总是需要借助于矛和盾来获得市场。"
 greek_5_6_allow_tt_1:0 "#Y [gm_5_greek_scope.GetRulerTitle][gm_5_greek_scope.GetRuler.GetPraenomen]#! 至少有#Y 6#! 魅力@oratory_icon!。"
 greek_5_6_allow_tt_2:0 "控制范围内有任意黑海港口被非#Y $hellenic$#!文化国家控制，该国与我国处于和平状态，且对我们的好感超过#R -50#!。"
 greek_5_6_reward_tt:0 "可以从非$hellenic$国家购买一个黑海港口。"
 greek_5_7:0 "使乔拉希腊化"
 greek_5_7_DESC:0 "我们新获得的土地需要由合适的人定居。我们应该收集一份具有良好地位的潜在公民和自由人的名单，他们可以控制我们Poleis的大乔拉。"
 greek_5_7_allow_tt:0 "我们控制的任何领土都有少于50%的主要文化。"
 greek_5_7_reward_tt:0 "四个随机的人将皈依你的文化和宗教。"
 greek_5_8:0 "希腊人的堡垒"
 greek_5_8_DESC:0 "我们曾经的小殖民地在最近的领导下有了很大的发展。以前，根深蒂固的精英们的金钱利益和外国干涉者造成了混乱，现在我们有了和谐。其他希腊殖民者注意到了这一点，许多人在#Y [gm_5_greek_scope.GetName]#!中发了财。"
 greek_5_9:0 "形成伊斯特里亚联盟"
 greek_5_9_DESC:0 "后世或会争论不休——究竟是为了掌控黑海贸易霸权，还是出于务实自保之需，才促使我们采取这些行动。但无论如何，此刻正是黑海西岸诸城联合起来，组建新同盟以应对时代挑战之时！"
 greek_5_9_allow_tt:0 "#Y 伊斯特里亚联盟#! 不可能已经存在。"
 greek_5_9_reward_tt:0 "我们将形成一个新的国家，并获得对周围省份的宣称。"
 greek_5_pontus:0 "被遗忘的希腊之子"
 greek_5_pontus_BUTTON_TOOLTIP:0 "黑海沿岸的希腊共和国为了生存下去必须适应。"
 greek_5_pontus_CRITERIA_DESCRIPTION:0 "团结北方的希腊人，组成城市联盟，挑战黑海的霸主地位。"
 greek_5_pontus_DESCRIPTION:0 "被征服，被孤立，或处于被征服的边缘，黑海的不同殖民地必须联合起来，以应对即将到来的风暴。"
 greek_5_pontus_REWARD_DESCRIPTION:0 "控制几个希腊殖民地，掌握黑海的贸易。"
 greek_5_pontus_loyalty_reward_tt:0 "#Y [gm_family_head_5.GetFamilyDisplayAdjective]#!家族中的所有成员都会获得#G 10#!忠诚度@loyalty!"
 gw_effect_taurican_temple:0 "阿耳忒弥斯·陶罗波洛斯"
 gw_effect_taurican_temple_DESC:0 "随着阿耳忒弥斯·陶罗波洛斯神庙为希腊世界所收回，它是欧克西努斯的信仰灯塔，吸引着所有的女神崇拜者来到这里。"
 me_gre_5_12_cmod:0 "东色雷斯安全"
 me_gre_5_13_cmod:0 "河流贸易的主导地位"
 me_gre_5_14_cmod:0 "安纳托利亚北部的主导地位"
 me_gre_5_15_1_pmod:0 "米利塔尼亚的安全"
 me_gre_5_15_2_pmod:0 "赫拉克利亚安全"
 me_gre_5_16_cmod:0 "海上繁荣"
 me_gre_5_18_pmod:0 "黑海贸易"
 me_gre_5_19_1_pmod:0 "祖先的敬意"
 me_gre_5_19_2_pmod:0 "希腊贸易中心"
 me_gre_5_23_cmod:0 "虔诚的愿望"
 me_gre_5_24_cmod:0 "从灰烬中诞生"
 me_gre_5_24_pmod:0 "博斯普鲁斯的首都"
 me_gre_5_25_pmod:0 "奴隶贸易中心"
 me_gre_5_2_pmod:0 "文化中心"
 me_gre_5_3_pmod:0 "贸易中心"
 me_gre_5_40_pmod:0 "阿耳忒弥斯·陶罗波洛斯神庙遗址"
 me_gre_5_5_cmod:0 "安抚战鹰"
 me_gre_5_8_cmod:0 "希腊的繁荣"
 me_gre_5_cmod:0 "繁荣的共和国"
 me_gre_5_trader_neg_opmod:0 "灾难性的贸易协议"
 me_gre_5_trader_pos_opmod:0 "有利的贸易协议"
 me_gre_task_start_tt_5:0 "[gm_5_greek_scope.GetRulerTitle] [gm_5_greek_scope.GetRuler.GetPraenomen]将开始进行"
 me_greek_5_pontus.1.a:0 "确实还有谁。"
 me_greek_5_pontus.1.desc:0 "一段时间以来，[gm_5_greek_scope.GetName]里一直有怨言，激起了人们对Pontos Euxinos更大影响力的渴望。\n\n似乎主要的煽动者是[gm_family_head_5.GetPraenomen]，他无疑寻求[gm_family_head_5.GetHerHis]自己的目的，但如果不是我们--还有谁？"
 me_greek_5_pontus.1.t:0 "$greek_5_pontus$: 进取的[gm_family_head_5.GetFamilyDisplayAdjective]们"
 me_greek_5_pontus.10.a:0 "向着胜利前进!"
 me_greek_5_pontus.10.at:0 "我们已经收到了对我们的家乡地区#Y [gm_5_greek_area_scope.GetName]#!的宣称。"
 me_greek_5_pontus.10.desc:0 "元老院已经完成了扩张的会谈，并对首都周围的所有土地提出了宣称。"
 me_greek_5_pontus.10.desc_1:0 "我们应该尽快进入这些新主张的领土，以显示实力。"
 me_greek_5_pontus.10.t:0 "$greek_5_5$：辩论结束"
 me_greek_5_pontus.11.a:0 "糟糕"
 me_greek_5_pontus.11.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_5$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.11.desc:0 "不幸的是，已经没有合适的国家我们可以提供保护了。"
 me_greek_5_pontus.11.t:0 "$greek_5_5$：命运之神"
 me_greek_5_pontus.15.a:0 "使之成为"
 me_greek_5_pontus.15.at:0 "在#Y [temp_hellenizing_province_scope.GetName]#!省，最多有4个人口将被同化为我们的宗教和文化。"
 me_greek_5_pontus.15.desc:0 "尊敬的大公，不属于我们的宗教和文化的野蛮人在我们新获得的土地上定居，这是一种滑稽的行为。我们的宏伟计划要求这些土地在更值得信赖的人手中。"
 me_greek_5_pontus.15.desc_1:0 "我们应该收集一份具有良好地位的潜在公民和自由人的名单，他们可以控制周围的乔拉。"
 me_greek_5_pontus.15.t:0 "$greek_5_7$:做好准备工作"
 me_greek_5_pontus.16.a:0 "优秀"
 me_greek_5_pontus.16.at:0 "在#Y [temp_hellenizing_province_scope.GetName]#!省，一些民众已经被我们的宗教和文化同化了。"
 me_greek_5_pontus.16.desc:0 "报告已经到达，宣布最近的重新安置政策取得了巨大的成功!我们的希腊价值观现在统治着我们最近获得的土地。"
 me_greek_5_pontus.16.desc_1:0 "在未来的许多年里，他们都会这样做。"
 me_greek_5_pontus.16.t:0 "$greek_5_7$。完成"
 me_greek_5_pontus.17.a:0 "很好"
 me_greek_5_pontus.17.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_7$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.17.desc:0 "我们新征服的土地已经接受了我们的文化和宗教。没有必要对这些领土进行协调的希腊化。"
 me_greek_5_pontus.17.t:0 "$greek_5_7$: 命运"
 me_greek_5_pontus.18.a:0 "在实施进一步的计划之前，有必要进行一次巩固。"
 me_greek_5_pontus.18.at:0 "$mission_task_completed_tt_1$$greek_5_8$$mission_task_completed_tt_2$"
 me_greek_5_pontus.18.desc:0 "每天都有更多的公民在收获我们的劳动成果。我们的港口和市场从未如此繁忙。我们的寺庙和行政建筑维护得很好，人们在任何地方都能看到我们日益繁荣的景象。我们可能正处在一个黄金时代的边缘。"
 me_greek_5_pontus.18.t:0 "$greek_5_8$"
 me_greek_5_pontus.18.tt:0 "所有的#Y 博斯普鲁斯和希腊‑本都#!国家都获得了#G 25#!点对[gm_5_greek_scope.GetName]的好感。"
 me_greek_5_pontus.19.a:0 "因此，它应该是"
 me_greek_5_pontus.19.at:0 "你们现在将被称为伊斯特里亚联盟。愿你们的未来如此光明，与黑海形成对比。"
 me_greek_5_pontus.19.desc:0 "自从我们的祖先在这些海岸定居以来，我们已经走了很远。尽管我们作为陌生人在这些土地上面临着困难，但我们设法茁壮成长并取得了卓越的成就。我们的希腊价值观是黑海周围其他国家的灯塔。在将我们邻近的希腊人团结在一个旗帜下之后，有必要宣布我们自己的身份。伊斯特里亚联盟将屹立千年!"
 me_greek_5_pontus.19.t:0 "伊斯特里亚联盟"
 me_greek_5_pontus.2.a:0 "让传令兵在广场上大声喊叫吧!"
 me_greek_5_pontus.2.at:0 "任务#Y 被遗忘的希腊之子#!已经#G 完成了#!!!"
 me_greek_5_pontus.2.desc:0 "虽然黑海殖民地最初可能只是过度拥挤或受到威胁的城邦们的遥远孩子，但我们的成功向所有人表明，黑海上的希腊人是自豪、强大和繁荣的。\n\n我们的联系联盟使曾经分裂的希腊人更紧密地联系在一起，通过这样做，确保了我们的遗产。"
 me_greek_5_pontus.2.t:0 "不再被遗忘"
 me_greek_5_pontus.20.a:0 "黑海地区只能存在一个城市联盟。"
 me_greek_5_pontus.20.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_9$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.20.desc:0 "我们在黑海西岸的希腊兄弟们一定以嫉妒的眼光看着我们。"
 me_greek_5_pontus.20.t:0 "$greek_5_9$: 命运"
 me_greek_5_pontus.21.a:0 "定会如此！"
 me_greek_5_pontus.21.at:0 "从今以后，你们将被称为博斯普鲁斯同盟。愿你们的未来光明，足以映照黑海。"
 me_greek_5_pontus.21.desc:0 "自祖先定居这些海岸以来，我们已经走了很远。尽管我们曾作为异乡人在这些土地上面对艰难困苦，却仍成功繁荣并出类拔萃。我们的希腊价值是本都·尤克辛诺斯周边其他国家的明灯。在把邻近希腊人统一于同一旗帜之下后，我们有必要宣告自己的身份。博斯普鲁斯同盟将屹立千年！"
 me_greek_5_pontus.21.t:0 "博斯普鲁斯联盟"
 me_greek_5_pontus.21.tt:0 "所有的#Y 博斯普鲁斯和希腊‑本都#!国家都获得了#G 25#!点对[gm_5_greek_scope.GetName]的好感。"
 me_greek_5_pontus.22.a:0 "黑海地区只能存在一个城市联盟。"
 me_greek_5_pontus.22.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_10$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.22.desc:0 "我们在黑海北岸的希腊兄弟们一定以嫉妒的眼光看着我们。"
 me_greek_5_pontus.22.t:0 "$greek_5_10$: 命运"
 me_greek_5_pontus.23.a:0 "因此，它应该是"
 me_greek_5_pontus.23.at:0 "你们现在将被称为本都联盟。愿你们的未来能与黑海形成鲜明的对比。"
 me_greek_5_pontus.23.desc:0 "自从我们的祖先在这些海岸定居以来，我们已经走了很远。尽管我们作为陌生人在这些土地上面临着困难，但我们设法茁壮成长并取得了卓越的成就。我们的希腊价值观是黑海周围其他国家的灯塔。在将我们邻近的希腊人团结在一个旗帜下之后，有必要宣布我们自己的身份。本都联盟将屹立千年!"
 me_greek_5_pontus.23.t:0 "本都联盟"
 me_greek_5_pontus.23.tt:0 "所有的#Y 博斯普鲁斯和希腊‑本都#!国家都获得了#G 25#!点对[gm_5_greek_scope.GetName]的好感。"
 me_greek_5_pontus.24.a:0 "黑海地区只能存在一个城市联盟。"
 me_greek_5_pontus.24.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_11$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.24.desc:0 "我们在黑海南岸的希腊兄弟们一定以嫉妒的眼光看着我们。"
 me_greek_5_pontus.24.t:0 "$greek_5_11$: 命运"
 me_greek_5_pontus.25.a:0 "伊斯特里亚联盟自豪地站在马其顿人、盖塔人、斯基泰人和色雷斯人的面前。"
 me_greek_5_pontus.25.at:0 "$mission_task_completed_tt_1$$greek_5_12$$mission_task_completed_tt_2$"
 me_greek_5_pontus.25.desc:0 "我们现在已经完全控制了伊斯特洛斯和通往赫勒斯庞特之间的土地。驻军已经开始向边境进发，当地议会也在服从我们的管理。从卑微的城邦开始，我们已经成为黑海的一个令人钦佩和恐惧的实体！"
 me_greek_5_pontus.25.t:0 "$greek_5_12$"
 me_greek_5_pontus.26.a:0 "我们必须照顾我们自己的边界。"
 me_greek_5_pontus.26.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_12$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.26.desc:0 "我们的注意力需要放在其他地方。被格泰人围攻的黑暗森林和河岸并不是我们所关心的。"
 me_greek_5_pontus.26.t:0 "$greek_5_12$: 命运之神"
 me_greek_5_pontus.27.a:0 "博斯普鲁斯联盟是北方海洋和马匹的主人。"
 me_greek_5_pontus.27.at:0 "$mission_task_completed_tt_1$$greek_5_13$$mission_task_completed_tt_2$"
 me_greek_5_pontus.27.desc:0 "我们现在已经完全控制了提拉斯河、玻律斯忒涅斯河和辛梅里亚‑博斯普鲁斯周围的土地。士兵和水手们齐心协力，加强对我们新领土和贸易渠道的控制。从卑微的城邦开始，我们已经成为黑海上的一个鼓舞人心和受人尊敬的实体!"
 me_greek_5_pontus.27.t:0 "$greek_5_13$"
 me_greek_5_pontus.28.a:0 "我们必须关注我们自己的边界。"
 me_greek_5_pontus.28.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_13$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.28.desc:0 "我们的注意力需要放在其他地方。由斯基泰主宰的北方草原的平原和河岸不是我们所关心的。"
 me_greek_5_pontus.28.t:0 "$greek_5_13$: 命运之神"
 me_greek_5_pontus.29.a:0 "本都联盟的位置很好，可以对付安纳托利亚人和高加索人。"
 me_greek_5_pontus.29.at:0 "$mission_task_completed_tt_1$$greek_5_14$$mission_task_completed_tt_2$"
 me_greek_5_pontus.29.desc:0 "我们现在已经完全控制了安纳托利亚的北部海岸。我们在山口和宝贵港口的驻军将确保我们免受陆上和海上的入侵者。从卑微的城邦开始，我们已经成为黑海上的一个鼓舞人心和受人尊敬的实体!"
 me_greek_5_pontus.29.t:0 "$greek_5_14$"
 me_greek_5_pontus.3.a:0 "就像它应该的那样。"
 me_greek_5_pontus.3.at:0 "$mission_task_completed_tt_1$$greek_5_2$$mission_task_completed_tt_2$"
 me_greek_5_pontus.3.desc:0 "我们的首都城市的发展不是没有经过相当多的规划、辩论和艰苦的劳动。我们的殖民城市正在成长，与它一起成长的还有我们的愿望和雄心。无论我们的下一步是什么，都需要得到当地元老院的支持。这就是我们的传统。"
 me_greek_5_pontus.3.t:0 "$greek_5_2$"
 me_greek_5_pontus.30.a:0 "我们必须关注我们自己的边界。"
 me_greek_5_pontus.30.at:0 "$mission_completed_tooltip_1$“#Y $greek_5_14$#!”$mission_bypassed_tooltip_2$"
 me_greek_5_pontus.30.desc:0 "我们的注意力需要放在其他地方。安纳托利亚部落居住的无数山脉和岩石海岸线不是我们关心的问题。"
 me_greek_5_pontus.30.t:0 "$greek_5_14$: 命运之神"
 me_greek_5_pontus.31.a:0 "家，甜蜜的家..."
 me_greek_5_pontus.31.at:0 "我们将继续作为#Y [home_country_scope.GetName]#!。首都将迁至我们的祖居地。"
 me_greek_5_pontus.31.b:0 "不，我们的命运就在这里，在黑海。"
 me_greek_5_pontus.31.bt:0 "我们将继续忠于我们目前的命运。"
 me_greek_5_pontus.31.desc:0 "原本我们的人民来自#Y [home_country_scope.GetName]#!。现在我们已经获得了对'母城'的控制权，宣布自己是这些土地的真正继承者是理所当然的。\n也许我们甚至可以恢复我们以前的身份，如果那是诸神为我们准备的。"
 me_greek_5_pontus.31.t:0 "$greek_5_15$"
 me_greek_5_pontus.32.a:0 "我们将使他们成为一支不可忽视的力量。"
 me_greek_5_pontus.32.b:0 "减轻他们的负荷，只招募最优秀的划船手。"
 me_greek_5_pontus.32.desc:0 "我们庞大的海上网络需要一支同样庞大的海军，能够保护我们的商人免受突袭者、掠夺者和竞争对手的攻击。\n\n现在我们必须决定是为了速度还是为了生存能力而使我们的中队专业化。"
 me_greek_5_pontus.32.t:0 "$greek_5_17$"
 me_greek_5_pontus.32.tt:0 "$mission_task_completed_tt_1$$greek_5_17$$mission_task_completed_tt_2$"
 me_greek_5_pontus.33.a:0 "我们传奇的过去将永远不会被遗忘。"
 me_greek_5_pontus.33.at:0 "将在我们的首都建造一个#Y 图书馆#! 。"
 me_greek_5_pontus.33.b:0 "我们需要建立一个新的港口，以更好地影响现在的生活。"
 me_greek_5_pontus.33.bt:0 "将在我们的首都建立一个#Y 港口#! 。"
 me_greek_5_pontus.33.desc:0 "最近，我们民族的历史以及#Y [gm_5_greek_scope.GetName]#! 的更大的遗产一直是每个人舌尖上的问题。有些人认为保护我们的历史和传统应该优先考虑，而其他人则说我们必须开辟自己的道路，不管我们的祖先打算如何。"
 me_greek_5_pontus.33.t:0 "$greek_5_19$。过去和现在"
 me_greek_5_pontus.34.a:0 "我们必须积极塑造我们的命运。"
 me_greek_5_pontus.34.at:0 "$mission_task_completed_tt_1$$greek_5_19$$mission_task_completed_tt_2$"
 me_greek_5_pontus.34.desc:0 "在最近的建设中，Poleis热闹非凡。公民和自由人的活动似乎成了新的常态，他们显得更加富有成效和坚定。"
 me_greek_5_pontus.34.t:0 "$greek_5_19$。展望未来"
 me_greek_5_pontus.35.a:0 "也许这需要进一步调查。"
 me_greek_5_pontus.35.at:0 "开始寻找失落的阿耳忒弥斯神庙。"
 me_greek_5_pontus.35.desc:0 "刚刚发生了一件奇怪的事情。[gm_5_greek_scope.GetRulerTitle]最近被一个自称是来自陶里卡地区的自由人的斯基泰访客所接触。他谈到了神秘的遗迹，并且看到了一个被遗忘的雕像，这个雕像是由看起来很奇怪的石头雕刻而成的。"
 me_greek_5_pontus.35.t:0 "$greek_5_20$: 远方的故事"
 me_greek_5_pontus.36.a:0 "我们找到它才是正确的。"
 me_greek_5_pontus.36.at:0 "$mission_task_completed_tt_1$$greek_5_20$$mission_task_completed_tt_2$"
 me_greek_5_pontus.36.desc:0 "在与一些商人和水手就被遗忘的神庙的传言交谈后，调查已经结束。来访者的说法似乎很有道理，现在的问题是：\n对这些新发现的信息该如何处理？"
 me_greek_5_pontus.36.t:0 "$greek_5_20$。好奇心被唤醒"
 me_greek_5_pontus.37.a:0 "第一个找到它的人将获得一个人才!"
 me_greek_5_pontus.37.at:0 "$mission_task_completed_tt_1$$greek_5_21$$mission_task_completed_tt_2$"
 me_greek_5_pontus.37.desc:0 "我们已经成功地在陶里亚人的祖先的土地上建立了一个滩头阵地，那些野蛮人曾经对诚实的、敬畏神灵的希腊人进行人祭。在我们继续寻找阿耳忒弥斯神庙的时候，这个地区将作为我们的行动基地。"
 me_greek_5_pontus.37.t:0 "$greek_5_21$"
 me_greek_5_pontus.38.a:0 "诸神在向我们微笑。"
 me_greek_5_pontus.38.at:0 "$mission_task_completed_tt_1$$greek_5_22$$mission_task_completed_tt_2$"
 me_greek_5_pontus.38.desc:0 "成功了！经过数周徒劳搜寻，并贿赂当地人寻找任何线索之后，我们终于发现了阿耳忒弥斯神庙！它处于令人伤感的破败状态，似乎已被信徒遗弃，也避开了潜在劫掠者。在神庙内部，我们找到了由一种前所未见石材制成的阿耳忒弥斯神像。我们会召集一队人手，把它和其他一些珍宝取回。"
 me_greek_5_pontus.38.t:0 "$greek_5_22$：搜索完毕"
 me_greek_5_pontus.39.a:0 "我们必须要小心。"
 me_greek_5_pontus.39.desc:0 "女猎手女神的美丽形象终于在我们手中。但是，我们还是无法确定它是用什么特殊材料制成的。我们只能断定它一定是一块从奥林匹斯山投下的神石。\n\n现在我们已经找到了这座阿耳忒弥斯神庙，我们需要讨论如何处理它。我们的决定不能激怒女神本人。"
 me_greek_5_pontus.39.t:0 "$greek_5_23$: 失落的神庙"
 me_greek_5_pontus.4.a:0 "安抚元老院的各个派别并不是一项简单的任务。"
 me_greek_5_pontus.4.at:0 "参议院将进行长达180天的辩论。"
 me_greek_5_pontus.4.desc:0 "最近Poleis的扩张让元老院中的许多人迫不及待地想增进自己的利益。即将成为贵族血统的领主、新晋商人、元老院中的各路政客都在嚷嚷着如何更好地#Y [gm_5_greek_scope.GetName]#! 进行。"
 me_greek_5_pontus.4.t:0 "$greek_5_3$: 勘察政治形势"
 me_greek_5_pontus.40.a:0 "当然，它需要被重建!"
 me_greek_5_pontus.40.at:0 "重建神庙的费用将由我们国库的黄金支付。"
 me_greek_5_pontus.40.b:0 "我们可以用其他资源来重建它。"
 me_greek_5_pontus.40.bt:0 "圣殿的重建将用金钱、人力和政治影响来支付。"
 me_greek_5_pontus.40.c:0 "我们根本负担不起。"
 me_greek_5_pontus.40.ct:0 "圣殿将不会被重建。"
 me_greek_5_pontus.40.desc:0 "经过几周的辩论，元老院在这个问题上陷入了僵局。#Y [gm_family_head_5.GetName]#! 建议节俭，不愿意在这次冒险中花费更多的资金，而#Y [high_priest_scope.GetOffice.GetName]#! 则坚持认为，这座纪念碑必须恢复它以前的荣耀！\n人群聚集在亚戈拉，等待关于应如何处理这座失去的神庙的消息。"
 me_greek_5_pontus.40.t:0 "$greek_5_23$。一个受祝福的形象"
 me_greek_5_pontus.41.a:0 "被征服者的悲哀......立即开始建设。"
 me_greek_5_pontus.41.at:0 "$mission_task_completed_tt_1$$greek_5_24$$mission_task_completed_tt_2$"
 me_greek_5_pontus.41.desc:0 "我们的贸易对手博斯普鲁斯王国曾经引以为豪的首都就在废墟中。那些被抛弃的色雷斯人的祖先，斯巴尔托科斯人，已经被打倒了，然而，控制辛梅里亚‑博斯普鲁斯上的一个坚固的城市是有利的......也许可以在附近建一个新的城市，由忠于我们事业的希腊人居住。"
 me_greek_5_pontus.41.t:0 "$greek_5_24$"
 me_greek_5_pontus.42.a:0 "明智的话语必须要有大胆的行动。"
 me_greek_5_pontus.42.at:0 "$me_gre_task_start_tt_5$开始向斯基泰人讨好。"
 me_greek_5_pontus.42.desc:0 "[gm_family_head_5.GetFamilyDisplayAdjective]的[gm_family_head_5.GetPraenomen]正在召集我们一些最成功和最有野心的商人及船长，共同商讨如何与游牧民族达成更有利的贸易协议。他们是#E 本都·尤克辛诺斯海（黑海）#!地区最好的奴隶提供者，如果我们能激起他们的兴趣，就可能比我们的竞争对手获得更好的交易条件。"
 me_greek_5_pontus.42.t:0 "$greek_5_25$:崇高的设计"
 me_greek_5_pontus.43.a:0 "我们应该直接提供一大笔黄金。他们可能会被我们的慷慨所感动。"
 me_greek_5_pontus.43.at:0 "我们将提出从[GetProvince('(int32)4557').GetOwner.GetName]购买大量的奴隶弹子。\n接受的机会受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、弹子的相对价值和外交意见的影响。"
 me_greek_5_pontus.43.b:0 "刚好高于市场价格的报价可能会使他们对我们产生好感。"
 me_greek_5_pontus.43.bt:0 "我们会提议从[GetProvince('(int32)4557').GetOwner.GetName]购买一些奴隶。\n对方接受的可能性受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、人口的相对价值和外交好感度的影响。"
 me_greek_5_pontus.43.c:0 "当然，我们不能急于求成。让我们从标准成本开始。"
 me_greek_5_pontus.43.ct:0 "我们将提出从[GetProvince('(int32)4557').GetOwner.GetName]购买少量的奴隶爆米花。\n被接受的机会受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、爆米花的相对价值和外交意见的影响。"
 me_greek_5_pontus.43.d:0 "看来我们的标准供应商今天都没有东西可卖......"
 me_greek_5_pontus.43.desc:0 "以[gm_family_head_5.GetPraenomen]为首的我们最好的商人准备了一份可能的让步和条件清单，我们可能会向斯基泰统治者提供。他们还指出，如果有可能的话，我们需要提供什么来满足当前主人的胃口。"
 me_greek_5_pontus.43.dt:0 "糟糕。"
 me_greek_5_pontus.43.e:0 "我们应该直接提供一大笔黄金。他们可能会被我们的慷慨所感动。"
 me_greek_5_pontus.43.et:0 "我们将向[GetProvince('(int32)6114').GetOwner.GetName]购买大量的奴隶人口。\n接受的机会受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、人口的相对价值和外交意见的影响。"
 me_greek_5_pontus.43.f:0 "刚好高于市场价格的报价可能会使他们对我们产生好感。"
 me_greek_5_pontus.43.ft:0 "我们会提议从[GetProvince('(int32)6114').GetOwner.GetName]购买一些奴隶。\n对方接受的可能性受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、人口的相对价值和外交好感度的影响。"
 me_greek_5_pontus.43.g:0 "当然，我们不能急于求成。让我们从标准成本开始。"
 me_greek_5_pontus.43.gt:0 "我们将提出从[GetProvince('(int32)6114').GetOwner.GetName]购买少量的奴隶爆米花。\n接受的机会受到#Y [gm_family_head_5.GetPraenomen]#!的魅力、爆米花的相对价值和外交意见的影响。"
 me_greek_5_pontus.43.t:0 "$greek_5_25$。一个适度的建议"
 me_greek_5_pontus.44.a:0 "现在有多少就给他们送多少。"
 me_greek_5_pontus.44.at:0 "总共会有#Y 5#! 个奴隶被送到。\n他们对我们的看法可能会增加。"
 me_greek_5_pontus.44.b:0 "一批相当规模的奴隶将必须是足够的。"
 me_greek_5_pontus.44.bt:0 "总共有#Y 3#! 个奴隶将被交付。"
 me_greek_5_pontus.44.c:0 "他们甚至可以幸运地收到几个。"
 me_greek_5_pontus.44.ct:0 "总共会有#Y 1#!奴隶被送达。\n他们对我们的好感可能会降低。"
 me_greek_5_pontus.44.desc:0 "[gm_5_greek_scope.GetName]国家提出要从我们这里购买一些奴隶。"
 me_greek_5_pontus.44.desc_1:0 "\n他们为这次转让提供了大量资金。保持这样一种有利可图的关系符合我们的利益。"
 me_greek_5_pontus.44.desc_2:0 "\n他们为这次转让提供了一个正常的金额。我们将与他们的谈判代表讨论以这个价格可以提供多少奴隶。"
 me_greek_5_pontus.44.desc_3:0 "\n他们为这次转让提供了一个小数额。我们需要他们的谈判代表对这种侮辱作出解释。"
 me_greek_5_pontus.44.t:0 "$greek_5_25$。一个有趣的提议"
 me_greek_5_pontus.45.a:0 "哦，财神爷保佑了我们!"
 me_greek_5_pontus.45.b:0 "也许，需要一个更大的金额。"
 me_greek_5_pontus.45.c:0 "真是一场灾难!"
 me_greek_5_pontus.45.desc:0 "我们收到了斯基泰人关于贸易协议提案的消息！今晨的兆象如何？"
 me_greek_5_pontus.45.desc_1:0 "\n\n诸神保佑，我们成功了！由于我们的[ROOT.GetCountry.GetRulerTitle]提供了慷慨的条款，以及谈判代表们的出色努力，他们愿意给予我们独家贸易权！"
 me_greek_5_pontus.45.desc_2:0 "\n他们愿意以有利条款达成贸易协议。这一成功无疑证明了我们谈判者的能力。"
 me_greek_5_pontus.45.desc_3:0 "\n他们不愿同意任何可能损害其与其他希腊城市关系的贸易协议。这显然不是我们希望得到的结果。"
 me_greek_5_pontus.45.t:0 "$greek_5_25$：发生事件的房间"
 me_greek_5_pontus.47.a:0 "新的货物将被支付。"
 me_greek_5_pontus.47.a.tt:0 "阿耳忒弥斯神庙的进展继续不受阻碍。"
 me_greek_5_pontus.47.b:0 "我们将不得不利用我们所拥有的东西来应付。"
 me_greek_5_pontus.47.b.tt:0 "阿耳忒弥斯神庙的进展因缺乏材料而受阻。"
 me_greek_5_pontus.47.desc:0 "我们收到消息，有一批为寺庙提供的材料在[SCOPE.sP('random_coastal_province_scope').GetName]海岸外被海盗击沉了。如果没有这些建筑材料，我们将不得不发送新的货物，否则，重建的质量肯定会受到影响。"
 me_greek_5_pontus.47.t:0 "沉没的材料"
 me_greek_5_pontus.48.a:0 "需要新的手来完成工作。"
 me_greek_5_pontus.48.a.tt:0 "阿耳忒弥斯神庙的进展继续不受阻碍。"
 me_greek_5_pontus.48.b:0 "鼓舞人心的演讲恰到好处。"
 me_greek_5_pontus.48.b.tt:0 "阿耳忒弥斯神庙的进展继续不受阻碍。"
 me_greek_5_pontus.48.c:0 "我们将不得不缩减我们的设计来进行补偿。"
 me_greek_5_pontus.48.c.tt:0 "阿耳忒弥斯神庙的进展受到了没有灵感的工人的阻碍。"
 me_greek_5_pontus.48.desc:0 "在修复神庙的过程中，很多工作都是在人们的良好意愿下完成的，但最近似乎很多工人都变得不积极了，因为进展并不像他们原先希望的那样快。\n\n我们可以花钱让新工人去#Y [SCOPE.sP('taurican_temple_territory_scope').GetName]#! 承担剩下的工作，找到一些其他方法来激励我们已有的工人，或者改变一些计划，以减少剩余工作量。"
 me_greek_5_pontus.48.t:0 "没有灵感的工人"
 me_greek_5_pontus.49.a:0 "我们将只是替换被损坏的东西。"
 me_greek_5_pontus.49.a.tt:0 "阿耳忒弥斯神庙的进展继续不受阻碍。"
 me_greek_5_pontus.49.b:0 "我们的士兵会纠正这一切。"
 me_greek_5_pontus.49.b.tt:0 "阿耳忒弥斯神庙的进展继续不受阻碍。"
 me_greek_5_pontus.49.c:0 "这是一个相对较小的问题，可能会好起来的。"
 me_greek_5_pontus.49.c.tt:0 "阿耳忒弥斯神庙的进展受到盗窃和破坏的阻碍。"
 me_greek_5_pontus.49.desc:0 "有报告称，重建工作受到了盗窃和破坏的骚扰，也许是那些嫉妒的对手，他们不愿意看到我们的野心实现。虽然到目前为止，这些事件相对较少，但我们担心这可能只是未来的味道。\n\n[SCOPE.sCharacter('random_advisor').GetName]建议增派士兵，以更好地守卫施工现场。另外，我们可以拨出额外的资金来替换被毁坏的材料，或者完全不理会这件事。"
 me_greek_5_pontus.49.t:0 "破坏神庙"
 me_greek_5_pontus.5.a:0 "现在，真正的工作开始了。"
 me_greek_5_pontus.5.at:0 "$mission_task_completed_tt_1$$greek_5_3$$mission_task_completed_tt_2$"
 me_greek_5_pontus.5.desc:0 "通过魅力、幕后交易、一些精心安排的贿赂和坚定的决心，我们已经成功地说服了参议院的大多数成员，使他们相信我们的扩张政策是正确的方向，并且一定会使所有人都繁荣。"
 me_greek_5_pontus.5.t:0 "$greek_5_3$。在参议院的支持下"
 me_greek_5_pontus.50.a:0 "本来可以更好..."
 me_greek_5_pontus.50.desc:0 "神庙的修复工作最近已经完成，为适应施工过程中出现的问题作出了一些让步。阿耳忒弥斯女神希望仍能给予我们恩惠，她的形象已经恢复到我们姐妹城市中独一无二的宏伟。来自各地的旅行者已经开始聚集，向狩猎女神致敬。"
 me_greek_5_pontus.50.t:0 "阿耳忒弥斯神庙的修复工作"
 me_greek_5_pontus.51.a:0 "欢呼吧!女猎手女神赐予她的祝福。"
 me_greek_5_pontus.51.desc:0 "神庙的修复工作最近已经完成，我们的努力取得了巨大的成功！\n阿耳忒弥斯女神现在肯定会给予我们恩惠，她的神庙已经恢复到我们姐妹城市中任何其他城市都无法比拟的宏伟程度。来自各地的旅行者已经开始聚集，向狩猎女神致敬。"
 me_greek_5_pontus.51.t:0 "阿耳忒弥斯大神庙的修复"
 me_greek_5_pontus.52.a:0 "以牲畜为祭品肯定会让神灵高兴，并给予我们好运。"
 me_greek_5_pontus.52.at:0 "搜索开始了..."
 me_greek_5_pontus.52.desc:0 "我们必须探索野蛮人的土地，找到丢失的神庙。这肯定是一项相当艰巨的任务，但毫无疑问，我们将取得胜利。"
 me_greek_5_pontus.52.t:0 "$greek_5_22$：开始搜索"
 me_greek_5_pontus.9.a:0 "确实很强大……"
 me_greek_5_pontus.9.desc:0 "我们足够强大，可以开始考虑谁应该拥有我们地区的一些土地。虽然外交手段可能更可取，但也有人认为这些土地必须由长矛来赢得。"
 me_greek_5_pontus.9.desc_1:0 "元老院将辩论哪个方向更重要。"
 me_greek_5_pontus.9.t:0 "$greek_5_5$：开始辩论"
 treasure_taurican_statue:0 "阿耳忒弥斯·陶罗波洛斯的雕像"
 treasure_taurican_statue_desc:0 "这座阿耳忒弥斯·陶罗波洛斯的雕像是在她失落的神庙里发现的，并被带回家展示给大家看。"
 wonder_taurican_temple:0 "阿耳忒弥斯·陶罗波洛斯神庙"
 wonder_taurican_temple_desc:0 "此地……黑暗而邪恶的历史弥漫于空间，伊菲革涅亚曾在此担任盗贼般的陶里僭主的祭司，那些僭主航行于大海，并献祭希腊人。此乃力量之地，阿尔忒弥斯高坐于神庙之巅，拉开她永不失手的弓。"

 qin_02_li_si_task_13_xihe_area:0 "我辈必须掌控#Y 西河#!地区所有省份，然周王所据之省不在其列。"
 qin_02_li_si_task_14:0 "驯服藏地诸部"
 qin_02_li_si_task_14_DESC:0 "吐蕃悍族蛮横不驯，盖彼等缺乏文明教化之故。当倾我所能，将秦之文明之光带至彼等群山之间，以驯化吐蕃之众。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil7!"
 qin_02_li_si_task_14_hanjia_area:0 "我辈须于#Y 汉嘉#!省兴建一座#Y 大神殿#!、一座#Y 大剧场#!及一座#Y 法庭#!。"
 qin_02_li_si_task_14_reward_tt:0 "#Y 汉嘉#!与#Y 越嶲#!将获得#Y 驯化吐蕃#!修正，该修正将提升#Y 当地人口同化速度#!。"
 qin_02_li_si_task_14_yuexi_area:0 "我辈须于#Y 越嶲#!省兴建一座#Y 大神殿#!、一座#Y 大剧场#!及一座#Y 法庭#!。"
 qin_02_li_si_task_15:0 "秦之大军"
 qin_02_li_si_task_15_DESC:0 "天下无军可敌#E 秦#!之师；何人敢当我国中至伟之将所率百胜之卒？\n\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 qin_02_li_si_task_15_trigger_tt:0 "我们必须拥有至少一支拥有#Y 25#!个单位的#Y 军团#!。"
 qin_02_li_si_task_16:0 "秦大图书馆"
 qin_02_li_si_task_16_DESC:0 "耗资虽巨，然我辈当兴修大图书馆，以此府库收存我辈积攒之官方文牍与奇珍异物。遵循#E 商鞅#!与#E 李斯#!之遗训，唯#E 秦#!所认可的典籍方得入藏——其余诸书，尽付一炬。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil10!"
 qin_02_li_si_task_17:0 "征召白起"
 qin_02_li_si_task_17_DESC:0 "若欲克敌制胜，则需一位冷酷无情之良将，毫不迟疑地执行我等所下之令——而我辈已觅得此人：白起。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 qin_02_li_si_task_18:0 "擢升白起"
 qin_02_li_si_task_18_DESC:0 "#E 白起#!之传奇与日俱增；战无不胜之将，无数城池之围困者，人命之屠夫……此诸般可怖之名号，莫不言之凿凿。尽管如此，仍当授此闻名遐迩之白起以精兵之帅权！\n\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 qin_02_li_si_task_18_trigger_tt:0 "#E 白起#!必须是一支#Y 军团#!的#Y 指挥官#!。"
 qin_02_li_si_task_19:0 "法家一统"
 qin_02_li_si_task_19_DESC:0 "终于，商鞅梦寐所求之刻已降临；铲除异议之声——彼等只曾削弱秦国肌体——我辈今可全然拥入法家之学，并享受其将带给邦国之万般福祉。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 qin_02_li_si_task_1_DESC:0 "灭敌之事，岂可仅仗武力；若忽视统一之政略与官僚之需求，实为莫大之谬。我辈须觅得一位可信之重臣，以推行我胸中宏伟之变法。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil8!"
 qin_02_li_si_task_2:0 "擢升李斯"
 qin_02_li_si_task_2_DESC:0 "李斯所倡之新法可谓革命，然欲令此杰出之臣真正施展其才，必先擢用于朝堂之中。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 qin_02_li_si_task_2_claims_tt:0 "功成之际，#E 李斯#!将以#Y 宣称#!犒赏我辈，涵盖#Y 栎阳#!、#Y 河东#!、#Y 长安#!、#Y 尉氏#!与#Y 汉嘉#!。"
 qin_02_li_si_task_2_trigger_tt:0 "#E 李斯#!必须在我们的#Y 政府#!中担任#Y 官职#!。"
 qin_02_li_si_task_3:0 "饮马黄河"
 qin_02_li_si_task_3_DESC:0 "#E 黄河#!之水路几近尽在我掌握之中，由此可通孱弱之远邦；于腐朽之构架上轻轻一推，则整面虚饰便将崩然瓦解。\n\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 qin_02_li_si_task_3_claims_tt:0 "我们将获得对#Y 西河#!、#Y 上党#!、#Y 河内#!和#Y 河南#!的#Y 宣称#!。"
 qin_02_li_si_task_4:0 "南征平叛"
 qin_02_li_si_task_4_DESC:0 "#Y 冉駹#!与#Y 筰#!之邦如芒在背，若不妥善处置，终将成未来之患。当行举措以抑其势，唯#E 秦#!可主沉浮。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil5!"
 qin_02_li_si_task_5:0 "中央集权秦法"
 qin_02_li_si_task_5_DESC:0 "#E 李斯#!显然乃#E 商鞅#!之自然继承者，必将续行引我辈走向今日之诸般重典变法。肃贪之举已正式肇始。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil12!"
 qin_02_li_si_task_5_reward_tt:0 "所有#E 角色#!将失去#Y 10腐败度#!。"
 qin_02_li_si_task_6:0 "统一度量衡"
 qin_02_li_si_task_6_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]委任#E李斯#!执掌权柄，厘定秦国境内通行之度量衡制度；吾等深信，颁行统一之标准，必将为市易带来前所未有之繁荣。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil8!"
 qin_02_li_si_task_7:0 "焚书"
 qin_02_li_si_task_7_DESC:0 "国中混乱之状，滋生以文字散布虚妄之言的土壤。为再度稳固太平，断不可使我子民之心智遭此污秽所染，故诸悖逆之书册，必当尽数焚毁。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 qin_02_li_si_task_8:0 "利诱学者"
 qin_02_li_si_task_8_DESC:0 "我煌煌朝堂，已备一位严谨学者所渴求之万物——宜思招揽敌国之士子，观其是否愿弃暗投明，归附于我。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 qin_02_li_si_task_8_reward_tt:0 "吾等将设法自#Y周#!室诸邦——#Y齐#!、#Y楚#!与#Y周#!——之中，延揽其最为睿智之才俊。"
 qin_02_li_si_task_9:0 "官学"
 qin_02_li_si_task_9_DESC:0 "虽供养士人精英之耗费甚巨，然吾等坚信，#E秦#!国终将蒙受其积聚之智慧，获益无穷。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 qin_03_empire:0 "秦之帝国"
 qin_03_empire_BUTTON_TOOLTIP:0 "天地为之震动，秦之威势日益壮大……"
 qin_03_empire_CRITERIA_DESCRIPTION:0 "当秦建立#Y 华夏帝国#!时，此任务即告完成。"
 qin_03_empire_DESCRIPTION:0 "商鞅变法，经贤相#E李斯#!推行，已使焕然一新之#E秦朝#!达至鼎盛之权势，统一#E中国#!之大业仅一步之遥。今时机已至，秦当弃臣服之虚饰；必废黜#E周室#!之权威，夺取#E天命#!归于己身。"
 qin_03_empire_task_1:0 "尉缭"
 qin_03_empire_task_10:0 "摧垮赵国"
 qin_03_empire_task_10_DESC:0 "悲夫今之#E赵#!主，其注定目睹王国覆灭、疆土并入日益壮大之#E秦#!霸业。然赵绝非最后覆亡者；其邻邦当引以为鉴。\n\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 qin_03_empire_task_10_claims_tt:0 "我们将获得#Y 燕#!所有领地的#Y 宣称#!。"
 qin_03_empire_task_10_claims_tt_2:0 "我们将获得#Y 齐#!所有领地的#Y 宣称#!。"
 qin_03_empire_task_11:0 "扫荡魏国"
 qin_03_empire_task_11_DESC:0 "魏地已化为丘墟；游方之歌者与诗家，早已谱曲哀叹如此尊贵之宗室沦亡。然秦于既定之业，断无退缩之理……天下万物，皆须俯首于吾等之前。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil6!"
 qin_03_empire_task_11_claims_tt:0 "吾等将获得对凡城邑不足二十五座、且属#Y华夏#!文化组之诸国，皆享#Y宣称#!之权。"
 qin_03_empire_task_12:0 "征服越地"
 qin_03_empire_task_12_DESC:0 "今#E越#!地之战事已告终结，宜竭力垦殖乡野，以消弭战祸之苦忆。兴建新城，或可望抚慰心怀敌意之土民。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 qin_03_empire_task_12_reward_tt:0 "完成后，我们可在#Y 越#!的一省建造一座城市。"
 qin_03_empire_task_13:0 "终结周朝"
 qin_03_empire_task_13_DESC:0 "虚与委蛇之时日已尽；吾等必须终止惺惺作态，一举废除已然衰朽之周室朝廷。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 qin_03_empire_task_13_claims:0 "我们将获得#Y 周#!所有领地的#Y 宣称#!。"
 qin_03_empire_task_14:0 "新天命"
 qin_03_empire_task_14_DESC:0 "凡七百载，周室承天命而治天下，乃灭商之后所夺取也。然万物皆有其终结；日出亦当日落。无上威权，今已托付于#E秦#!。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil3!"
 qin_03_empire_task_15:0 "横扫燕国"
 qin_03_empire_task_15_DESC:0 "#E燕#!既已剪除，对我统治之抵抗渐次消散。虽有少数负隅顽抗之徒，然于大势所趋已无能为力——胜算尽在我手。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 qin_03_empire_task_16:0 "扑灭齐国"
 qin_03_empire_task_16_DESC:0 "吾等对#E齐#!向怀敬意，其曾为雄强之族，然荣耀之日已走到尽头；告知齐人，若不臣服于秦，必将遭彻底夷灭。\n\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 qin_03_empire_task_17:0 "秦统天下"
 qin_03_empire_task_17_DESC:0 "历经漫长征战，凡与我争雄之敌手尽皆伏低，再无堪与抗衡王权之势力。遣使驰赴中原诸古都，宣告天命已归#E秦#!! 愿神授之君[ROOT.GetCountry.GetRuler.GetName]享祚千秋万岁！\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 qin_03_empire_task_1_DESC:0 "一位名为#E尉缭#!之天才兵家，其名声已传至[ROOT.GetCountry.GetCapital.GetName]——吾等当竭力延揽其才华为#E秦#!所用。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 qin_03_empire_task_2:0 "擢升尉缭"
 qin_03_empire_task_2_DESC:0 "传闻中#E尉缭#!之韬略才具非但未被夸大，反倒被轻描淡写！当将此重臣置于能尽其才、展其所长之要津。\n\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 qin_03_empire_task_2_trigger_tt:0 "#Y 尉缭#!必须担任#Y 军事进步#!的#Y 研究员#!。"
 qin_03_empire_task_3:0 "大将王翦"
 qin_03_empire_task_3_DESC:0 "虽我朝蒙恩得诸多能征善战之将帅，然[ROOT.GetCountry.GetRuler.GetName]近来深慕名将#E王翦#!，唯愿以此名帅执掌全军。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil1!"
 qin_03_empire_task_4:0 "擢升王翦"
 qin_03_empire_task_4_DESC:0 "#E王翦#!，我朝卓越之军事统帅，仍辅佐[ROOT.GetCountry.GetRuler.GetName]运筹帷幄，举国皆蒙其利。或许时至今日，当将玄思之务托付他人，而令王翦亲率三军、直赴疆场？\n\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 qin_03_empire_task_4_trigger_tt:0 "#Y 王翦#!必须是一名将军。"
 qin_03_empire_task_5:0 "尉缭子"
 qin_03_empire_task_5_DESC:0 "所谓《#Y尉缭子#!》者，乃武经七书之一，满篇俱为论兵作战之箴言与法度——不但须为我所据有，且断不可令他人染指其间之智慧。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 qin_03_empire_task_6:0 "策划统一"
 qin_03_empire_task_6_DESC:0 "#Y韩#!氏乃古老贵胄之家，门第无瑕可指，然其阻我统一之大计。吾等不可望其军容而畏缩，当为终结无休之战事而毅然前行。\n\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 qin_03_empire_task_6_claims_tt:0 "我们将获得#Y 韩#!所有领地的#Y 宣称#!。"
 qin_03_empire_task_7:0 "羞辱楚国"
 qin_03_empire_task_7_DESC:0 "吾等与#Y楚#!军交锋之次数，已难尽数，然此番战事经营之后，彼等再无士卒可遣与我对阵矣。\n\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 qin_03_empire_task_7_claims_tt:0 "我们将获得#Y 楚#!所有领地的#Y 宣称#!。"
 qin_03_empire_task_8:0 "粉碎楚国"
 qin_03_empire_task_8_DESC:0 "至大胜利之时机已迫在眉睫；我军蓄势待发，将一举摧毁#E楚室#!之法统，至万劫不复之地！\n\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 qin_03_empire_task_8_claims_tt:0 "吾等将于下列诸地获得#Y宣称#!：#Y建安#!、#Y庐陵#!、#Y临海#!、#Y会稽#!、#Y南海#!、#Y合浦#!及#Y苍梧#!。"
 qin_03_empire_task_9:0 "韩之覆亡"
 qin_03_empire_task_9_DESC:0 "于#E韩室#!而言，此乃晦暗之日，然吾等决不可对我明示之敌心怀恻隐；彼等冥顽不化，终至自取灭亡。\n\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 qin_03_empire_task_9_claims_tt:0 "吾等将获得对#Y魏#!与#Y赵#!所据有之全部领土之#Y宣称#!。"

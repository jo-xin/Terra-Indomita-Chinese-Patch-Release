 qin_01_shan_yang_task_8:0 "论功升迁"
 qin_01_shan_yang_task_8_DESC:0 "我辈至伟之力在于不拘出身而擢拔巧匠；我等深爱举贤任能之制，远胜于贿赂横行、世袭盘踞之腐败旧局。\n\n\n\n\n\n\n\n\n\n\n@china_mil8!"

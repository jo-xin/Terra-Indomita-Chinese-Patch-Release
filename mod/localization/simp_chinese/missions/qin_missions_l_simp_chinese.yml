 me_qin_shan_yang_9.a:0 "主宰敌手乃我天赋之权、神圣之责"
 me_qin_shan_yang_9_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]之史乘虽载满显赫家族之名，然少有乃至绝无家族能如#E [SCOPE.GetRootScope.GetCountry.GetRuler.GetFamily.GetName]氏#!一般，享有如此辉煌与荣耀。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我辈无与伦比之领袖，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]名已臻不朽，已将我国推至前所未有之巅峰，而[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]于其任内尚有更多宏图待展。"

l_simp_chinese:
 TODO_events:0 "#BOLD;COLOR:{0.0,1.0,0.7}待办-事件#!"
 absolute_authority_country_mod:0 "绝对权威"
 begin_library_construction_tt:0 "#G 开始建造[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]大图书馆#!"
 begin_library_construction_tttt:0 "#G 考虑建造[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]大图书馆#!"
 centralised_qin_law:0 "秦法集权"
 choose_the_kind_of_library_to_build:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]将决定图书馆如何建造。"
 desc_centralised_qin_law:0 "秦国大受法令集权之利。"
 desc_distinction_great_army_of_qin:0 "秦之大军，冷峻果决，对敌无怜悯之心，乃有史以来寰宇之间所曾集结之至为致命之战力。"
 desc_new_mandate_mod:0 "世人皆可明见，周室已失天命——如今，天命归于秦。"
 desc_one_nation_under_qin_conversion_mod:0 "我邦之影响无可阻挡，凡大一统于秦之下者，终将渐次归于我道。"
 desc_one_nation_under_qin_legitimacy_mod:0 "凭借武力与意志建起庞大帝国，我邦统御中夏之权已不容置疑。"
 desc_promoted_wei_lio_mod:0 "擢升我邦谋士尉缭，既充实了我国人力，亦增进了我邦军事研究。"
 desc_qin_2_legalist_perma_mod:0 "我邦法家改革已根绝那些曾扼杀秦国兴盛之力的腐化流毒。"
 desc_qin_2_legalist_pulse_mod:0 "虽我邦已正式奉行法家之道，然社会正经历温和之阵痛，逐步适应新角色。"
 desc_qin_burning_books:0 "我邦境内诸般典籍之中，多有虚妄不实之言；尽数焚之！"
 desc_qin_upset_minority_culture_mod:0 "我方愚昧之谋臣，已在我邦与所统治之少数族裔间引发嫌隙。"
 desc_qin_upset_minority_province_mod:0 "秦使者笨拙，惹怒当地民众。"
 desc_qin_weights_measures_mod:0 "秦已统一全国之度量衡，大举提升了其经济实力。"
 desc_sechuan_assimilation_mod:0 "我邦正倾力而行，致力于同化居住于我境内之蜀地之民。"
 desc_sechuan_neg_mod1:0 "此区诸计似皆适得其反，徒增苦恼。"
 desc_sechuan_neg_mod2:0 "高压手段只令地方怨恨中央。"
 desc_sechuan_negative_mod1:0 "接触本地民众之尝试适得其反。"
 desc_southern_suppression_good_mod:0 "吾等已采取重大举措，以镇压我南方诸省中任何叛乱之情绪。"
 desc_state_sanctioned_scholars_country_mod:0 "因我邦旨在扶掖学人之国策，我国之研究能力已获提升。"
 desc_tamed_tibetans_qin:0 "吾等已将文化与文明带予吐蕃蛮族，彼等今已欣然拥抱我优越之生活方式。"
 desc_wang_jian_promoted:0 "王翦升为将军，全军士气大振。"
 desc_wei_liazo_treasure:0 "此军事手册由谋臣尉缭撰写，乃我诸将研习之重要武学论著。"
 desc_womens_militia_mod:0 "我邦女子，远非仅能守城而已，更已组建民兵以保卫后方。"
 desc_womens_militia_mod_neg1:0 "此区贵族憎恶女子民兵。"
 desc_yue_conquest_qin:0 "不仅征服越国，更着手改善其领地。"
 destruction_of_yiqu:0 "灭义渠"
 distinction_great_army_of_qin:0 "大秦雄师"
 end_of_rong_country_mod:0 "戎狄终焉"
 end_of_the_rong_yang_10_tt:0 "#Y义渠#!不可有领土，亦不可为他国附庸藩属。"
 freedom_from_confucian_values_mod:0 "摆脱儒家桎梏"
 great_wall_of_qin:0 "秦长城"
 leadership_of_bai_qi:0 "白起之帅"
 library_template_1:0 "石质藏书阁"
 library_template_2:0 "大理石藏书阁"
 library_template_3:0 "象牙藏书阁"
 library_template_4:0 "黄金藏书阁"
 me_qin_empire_1.a:0 "若能隐身壁上窥听二人相会…"
 me_qin_empire_10.a:0 "沙漠也好，草原也罢，尔等无处藏身"
 me_qin_empire_10_desc:0 "我军连年征战，在持续投入战争深渊的过程中从未丧失任何经验或锐气——即便此刻，他们正挥师北进，力图将残存的#E赵#!叛军从其最后的藏身之处驱赶出来。"
 me_qin_empire_10_title:0 "$qin_03_empire_task_10$"
 me_qin_empire_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_10$#!' $mission_completed_tooltip_2$"
 me_qin_empire_11.a:0 "世人将知#E 秦#!言出必行"
 me_qin_empire_11_desc:0 "#E秦国大良造#!满身血污地来到[ROOT.GetCountry.GetRuler.GetName]帐前呈递战报：#E魏#!已被彻底消灭，其军队被我军屠戮殆尽，即便投降也未被施予任何怜悯或宽容。\n\n此刻，秦军仍在其广袤的国土上调动，在宣战通告发出不到一日便出现在敌方边境——人人惊恐于他们下一次会出现在何处。"
 me_qin_empire_11_title:0 "$qin_03_empire_task_11$"
 me_qin_empire_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_11$#!' $mission_completed_tooltip_2$"
 me_qin_empire_12.a:0 "吾等当于博罗近处营建"
 me_qin_empire_12.b:0 "淮安令我心仪"
 me_qin_empire_12.c:0 "南平乃唯一之选"
 me_qin_empire_12.d:0 "文马音韵吉祥——就定此地"
 me_qin_empire_12_desc:0 "我们终于征服了神秘的#E越#!人，将其纳入我们日益扩张的疆域。我们不仅征服了越人，还受托负责一项愉快的任务：决定在其故地上何处建造一座真正的秦城。"
 me_qin_empire_12_title:0 "$qin_03_empire_task_12$"
 me_qin_empire_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_12$#!' $mission_completed_tooltip_2$"
 me_qin_empire_13.a:0 "幸而我恰知何人可当此任"
 me_qin_empire_13_desc:0 "多年来，#E秦#!一直忠实地履行着#E周#!臣属的誓言，但这已变得如此荒谬，如此对事物本质的嘲讽，参与这场傀儡戏只会令人蒙羞。无论从哪方面说，周已失去了#Y天命#!；战争摧毁了乡村，而乡村早已遭受旱灾与饥荒——诸神要求一位公正而有为的统治者从被他们遗弃者手中夺取权力。"
 me_qin_empire_13_title:0 "$qin_03_empire_task_13$"
 me_qin_empire_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_13$#!' $mission_completed_tooltip_2$"
 me_qin_empire_14.a:0 "今日之事，足传千古…"
 me_qin_empire_1400.a:0 "但愿此事不为外人所知"
 me_qin_empire_1400_desc:0 "我们有噩耗禀报，[ROOT.GetCountry.GetRuler.GetName]，虽不忍相告，但不得不言：我军在试图将#Y九鼎之宝#!从#E成周#!运往[ROOT.GetCountry.GetCapital.GetName]时意外将其毁坏。似乎其中一人失手摔落了他那一侧的鼎，导致另一人随之跌倒……细节不必赘述，但这对于#E秦室#!而言是一个可怕的凶兆。"
 me_qin_empire_1400_title:0 "典籍之毁"
 me_qin_empire_14_desc:0 "[GetProvince('(int32)8379').GetName]，昔日#E周朝#!的帝都，已落入凯旋的#E秦#!军之手。显然，诸神已抛弃了背信弃义而又孱弱的周，将#Y天命#!授予了秦；一个新时代的曙光即将来临！\n\n整个世界都在屏息注视……秦下一步将作何举动？"
 me_qin_empire_14_title:0 "$qin_03_empire_task_14$"
 me_qin_empire_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_14$#!' $mission_completed_tooltip_2$"
 me_qin_empire_15.a:0 "燕当以最后灭亡之国为荣"
 me_qin_empire_15_desc:0 "那是一个阳光明媚的日子，消息传到[ROOT.GetCountry.GetCapital]：#E燕室#!已被推翻，在残忍的#E秦朝#!胜利之军的威逼下如丧家之犬般被逐街头。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]的谋臣们从不向[ROOT.GetCountry.GetRuler.GetHerHim]提起百姓称秦残暴，因为在如此美好的早晨没有必要引起争执。再说，今天的主角应当是燕。"
 me_qin_empire_15_title:0 "$qin_03_empire_task_15$"
 me_qin_empire_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_15$#!' $mission_completed_tooltip_2$"
 me_qin_empire_16.a:0 "不久之后，中夏将归于正轨"
 me_qin_empire_16_desc:0 "#E齐室#!不复存在了；她的王再也不会在都城接见侍臣，她的人民再也不会记得齐国的传统与风习。\n\n秦将取而代之——音乐、礼仪、文字、律法——以带给国家荣耀和人民真正幸福的方式。"
 me_qin_empire_16_title:0 "$qin_03_empire_task_16$"
 me_qin_empire_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_16$#!' $mission_completed_tooltip_2$"
 me_qin_empire_17.a:0 "天下不久将尊吾为天命之共主"
 me_qin_empire_17_desc:0 "#E秦朝#!巍然屹立于历史之关口，准备宣告一个将按照自身形象塑造的时代。数百年来，万邦向#E周#!宣誓臣服，但那是在诸神发现周不合格之前。如今，凭借神圣认可的有德手段，秦已铸就了一个#Y中华帝国#!，将被世人视为有史以来最伟大的帝国。\n\n据说，#E秦室#!崛起的消息甚至传到了遥远的西方蛮夷之国#E\"大秦\"#!，那里的人们皆称颂我帝国之优越，并感谢诸神令其与我军之间相隔广袤，使其疆土免于被我军粉碎。"
 me_qin_empire_17_title:0 "$qin_03_empire_task_17$"
 me_qin_empire_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_17$#!' $mission_completed_tooltip_2$"
 me_qin_empire_1_desc:0 "虽说\"名声在外\"已是老生常谈，但[SCOPE.sCharacter('wei_liao_character')GetName]确实是一位名震整个[ROOT.GetCountry.GetName]的传奇人物。因此[ROOT.GetCountry.GetRuler.GetName]要求与[SCOPE.sCharacter('wei_liao_character')GetFirstName]会面也就不足为奇了，会面定于本月内在[ROOT.GetCountry.GetRuler.GetFirstName]位于[ROOT.GetCountry.GetCapital.GetName]的一处宫殿举行。"
 me_qin_empire_1_title:0 "$qin_03_empire_task_1$"
 me_qin_empire_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_1$#!' $mission_completed_tooltip_2$"
 me_qin_empire_2.a:0 "我之将士当向#E 尉缭#!此等人物多习教益"
 me_qin_empire_2_desc:0 "#E尉缭#!不断超越[ROOT.GetCountry.GetName]对他寄予的最高期望，将其无与伦比的才华投入我国的战争。我们应当考虑让他主持军事研究，如此整个国家都能受益于这位战争天才的智慧。"
 me_qin_empire_2_title:0 "$qin_03_empire_task_2$"
 me_qin_empire_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_2$#!' $mission_completed_tooltip_2$"
 me_qin_empire_3.a:0 "吾等有幸，不只得一贵宾，竟有二位"
 me_qin_empire_3_desc:0 "[ROOT.GetCountry.GetRuler.GetName]从不仰赖惯常的义务关系，一贯提拔贤能之士出任官职，坚信应让唯才是举取代#E周#!遗留的那套错综复杂的恩惠互酬制度。\n\n于是顺理成章，[SCOPE.sCharacter('wang_jian_character')GetName]来到了[ROOT.GetCountry.GetCapital.GetName]，主动效劳。更妙的是，[SCOPE.sCharacter('wang_jian_character')GetFirstName]并非只身前来，而是携其子[SCOPE.sCharacter('wang_ben_character')GetName]及家眷同行……这表明他们有意在[ROOT.GetCountry.GetName]长久定居。"
 me_qin_empire_3_title:0 "$qin_03_empire_task_3$"
 me_qin_empire_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_3$#!' $mission_completed_tooltip_2$"
 me_qin_empire_4.a:0 "#E 王翦#!乃我右臂，乃我意志之延伸"
 me_qin_empire_4_desc:0 "在终于赢得[ROOT.GetCountry.GetRuler.GetName]的充分信任、成为[ROOT.GetCountry.GetRuler.GetHerHis]完全信赖之人后，当宣布#E王翦#!受命统领一支强军时，便无人感到意外了。预计我们很快将听闻#E秦#!军在战场上的胜利，据说王翦在用兵之道上无人能及。"
 me_qin_empire_4_title:0 "$qin_03_empire_task_4$"
 me_qin_empire_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_4$#!' $mission_completed_tooltip_2$"
 me_qin_empire_5.a:0 "待#Y 尉缭子#!成书之时，我亦愿拜读"
 me_qin_empire_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您会欣喜地得知，我们的探子已成功追查到著名兵书#Y尉缭子#!的下落，并已将其安全送至[ROOT.GetCountry.GetCapital.GetName]的#E大秦书库#!中。不久之后，其中的教益将在我军中得到广泛传播，在未来的战斗中激励我们的将军。"
 me_qin_empire_5_title:0 "$qin_03_empire_task_5$"
 me_qin_empire_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_5$#!' $mission_completed_tooltip_2$"
 me_qin_empire_6.a:0 "遵命，[ROOT.GetCountry.GetRuler.GetName]！"
 me_qin_empire_6_desc:0 "当一位军事顾问来报#E韩室#!最后的领地已落入我军之手时，[ROOT.GetCountry.GetRuler.GetName]心绪凝重，凝望窗外，即兴吟出一段悲叹。\n\n\"看到如此强盛的世家，沦落至此……让我们以他们为鉴，时时提醒自己他们犯下的、导致今日结局的种种错误。\""
 me_qin_empire_6_title:0 "$qin_03_empire_task_6$"
 me_qin_empire_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_6$#!' $mission_completed_tooltip_2$"
 me_qin_empire_7.a:0 "相信我，届时必为快事"
 me_qin_empire_7_desc:0 "#E楚#!自以为是一艘航行在平静海面上的船，但正因为他们悄无声息地在河上航行，贪婪的目光和双手被港口和集市的金银所分散，他们忘了海洋可以是一位残酷无情的女主人，暴风雨常常不期而至——待时机到来，我们应当提醒他们这些教训，[ROOT.GetCountry.GetRuler.GetName]。"
 me_qin_empire_7_title:0 "$qin_03_empire_task_7$"
 me_qin_empire_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_7$#!' $mission_completed_tooltip_2$"
 me_qin_empire_8.a:0 "战争之中，无所不用其极…"
 me_qin_empire_8_desc:0 "短短数年前，无人能想象强大的#E楚#!竟会孤注一掷，输光所有，然而我们之中谁又能预见未来呢？但愿历史对#E楚室#!的记忆，会比我们的军队对待她的士兵更仁慈一些。"
 me_qin_empire_8_title:0 "$qin_03_empire_task_8$"
 me_qin_empire_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_8$#!' $mission_completed_tooltip_2$"
 me_qin_empire_9.a:0 "如此多性命陨落，实为遗憾"
 me_qin_empire_9_desc:0 "尽管听闻#E秦#!又摧毁了一个贵族世家，调转军队攻打别处——这次的目标是#E韩室#!——几乎已成了司空见惯的事，但这并不会令任何一个被征服民族的死亡减少丝毫悲剧色彩。于是只有些许的安慰：有些人正在皈依我们的文化。"
 me_qin_empire_9_title:0 "$qin_03_empire_task_9$"
 me_qin_empire_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_03_empire_task_9$#!' $mission_completed_tooltip_2$"
 me_qin_li_si.1600.a:0 "木石显然为上选"
 me_qin_li_si.1600.b:0 "大理石与银将尽显华美"
 me_qin_li_si.1600.c:0 "乌木与象牙，民众之乐，当以为材"
 me_qin_li_si.1600.d:0 "对[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]而言，一座纯金图书馆是唯一的选择。"
 me_qin_li_si.1600.desc:0 "工地上的[library_builder.GetName]提出了几种可用于建造大图书馆的优质材料，并从其私人作坊带来了样品供我们抉择。虽然这无疑令人兴奋，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]不禁出声自问，这项工程将耗尽国库多少资财。"
 me_qin_li_si.1600.t:0 "馆藏之材"
 me_qin_li_si.1602.a:0 "补足所佚之材"
 me_qin_li_si.1602.b:0 "无能为力了"
 me_qin_li_si.1602.desc:0 "我……我不知道这是如何发生的。遵您之命，我们装载了十船最精美的金、银、象牙与木材，以为图书馆的建造增添华丽装饰。然而——货物在运往工地的途中消失了；究竟是遭了海盗，还是遭遇了灾难性事故，无人知晓。最后一次有人看到它们时，船只靠近[coastal_province.GetName]。我真的很抱歉禀报此事。"
 me_qin_li_si.1602.t:0 "典籍遗佚"
 me_qin_li_si.1603.a:0 "增俸以振士气"
 me_qin_li_si.1603.b:0 "鞭策此等愚人！驱之为犬马"
 me_qin_li_si.1603.c:0 "书藏修成之日，自然修成…"
 me_qin_li_si.1603.desc:0 "我们收到了总建筑师关于图书馆建设进展的报告，其中满篇都是怨言——山间寒气逼人，我们错过了家乡的播种季节，此地的食物糟糕透顶……令人恼火！我们已经远超预期地付出了，竟得到如此回报！\n\n尽管如此，有人委婉建议我们不妨在工匠营地散些钱财以提振士气。"
 me_qin_li_si.1603.t:0 "匠人怠惰"
 me_qin_li_si.1604.a:0 "拨款以偿营建之人"
 me_qin_li_si.1604.b:0 "遣兵以固守备"
 me_qin_li_si.1604.c:0 "反正藏书终将修成"
 me_qin_li_si.1604.desc:0 "尽管我们安保严密，日夜有警员监视工地，但我们得知一些用于建造图书馆的原材料被盗了。我们审问了负责管理物资的当地监工，甚至以威胁其家人来试图获取真相，但没有人声称知情——一如所料。在等待更多材料运抵期间，工程进度已经放缓。"
 me_qin_li_si.1604.t:0 "盗窃与破坏"
 me_qin_li_si.1605.a:0 "大藏书阁将屹立千年！"
 me_qin_li_si.1605.desc:0 "准备工作在日出前便已开始，当金色日轮终于将光芒洒在我们沉睡的城市上空时，映入眼帘的是三千名奴隶列队而立，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在他们面前的高台上主持仪式。一声令下，千支号角齐鸣，尖锐的鸣响划破长空。随即吟诵声起，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在侍从和仆人的跟随下走向新建大图书馆的入口。立于门前，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]转身面对人群，万籁俱寂；片刻之后，典礼即将开始。\n\n目睹知识诞生，确是一件奇妙之事。"
 me_qin_li_si.1605.t:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]大藏书阁"
 me_qin_li_si_1.a:0 "李斯，我见你有潜质——但愿我未看错"
 me_qin_li_si_10.a:0 "以尔丑陋师尊之格言自我慰藉去吧"
 me_qin_li_si_1000.a:0 "尚可，但勿以此等琐事扰我"
 me_qin_li_si_1000_desc:0 "我们认为应当禀告您，[ROOT.GetCountry.GetRuler.GetName]，整肃进展顺利，持有异端邪说的公民正被处决，终结了他们的不轨行径。"
 me_qin_li_si_1000_title:0 "焚书坑儒"
 me_qin_li_si_1001.a:0 "立即处死，提头来见！"
 me_qin_li_si_1001.b:0 "今日我心怀慈悲，特加宽赦"
 me_qin_li_si_1001_desc:0 "[ROOT.GetCountry.GetRuler.GetName]的密探呈上了一份令人不安的报告，表明[ROOT.GetCountry.GetCapital.GetName]藏有#E儒家信徒#!，有些人甚至在朝廷中谋得了差事。\n\n若这种近在咫尺的虚伪之事传扬出去，后果不堪设想；[ROOT.GetCountry.GetRuler.GetFirstName]必须迅速决定如何处置那些被指控窝藏不法之徒的人。"
 me_qin_li_si_1001_title:0 "焚书坑儒"
 me_qin_li_si_1002.a:0 "吾等将弥合一切——此乃天命"
 me_qin_li_si_1002_desc:0 "持续进行的#E清算儒家#!运动已在其他城市引发了效仿性攻击，其他少数群体遭到针对和冷血屠戮。#E秦#!社会之经纬正在撕裂，[ROOT.GetCountry.GetRuler.GetName]。"
 me_qin_li_si_1002_title:0 "焚书坑儒"
 me_qin_li_si_1003.a:0 "遣顾问往各族劝和止斗"
 me_qin_li_si_1003_desc:0 "[ROOT.GetCountry.GetRuler.GetName]坚持推行的#E清算儒家#!运动继续产生意想不到的后果，不同贵族家族之间爆发了公开冲突——似乎人人都想利用这混乱的氛围来清算旧账。"
 me_qin_li_si_1003_title:0 "焚书坑儒"
 me_qin_li_si_10_desc:0 "[ROOT.GetCountry.GetRuler.GetName]不容任何方面的异议，即便来自知识阶层，已向#E儒家信徒#!宣战，尤其是那些试图偷运禁书者。\n\n当有人因多人被活埋的传闻而发出抗议时，[ROOT.GetCountry.GetRuler.GetFirstName]立刻令其噤声，声称与斧刑相比，这已是仁慈的死法。"
 me_qin_li_si_10_title:0 "$qin_02_li_si_task_10$"
 me_qin_li_si_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_10$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_11.a:0 "此或可谓…艺术摹写人生耳"
 me_qin_li_si_1100.a:0 "闻凡事已得掌控，我心甚慰"
 me_qin_li_si_1100_desc:0 "有好消息也有坏消息，[ROOT.GetCountry.GetRuler.GetName]。虽然[ROOT.GetCountry.GetCapital.GetName]的集市上有了瘟疫的传闻，但我们迅速行动遏制了问题——相信您会同意这笔钱花得值。"
 me_qin_li_si_1100_title:0 "瘟疫爆发"
 me_qin_li_si_1101.a:0 "[ROOT.GetCountry.GetRuler.GetFirstName]是一位狡黠而冷酷的领袖；这一点毋庸置疑。"
 me_qin_li_si_1101_desc:0 "[ROOT.GetCountry.GetRuler.GetName]前几日在朝会期间悍然攻击了昔日的政治盟友[SCOPE.sCharacter('sealed_official_qin')GetName]，令众人不禁猜测二人之间的友谊是否已经终结。"
 me_qin_li_si_1101_title:0 "尔虞我诈之朝堂"
 me_qin_li_si_1102.a:0 "告彼等蠢材，我必割其舌"
 me_qin_li_si_1102_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们听到传言，[SCOPE.sCharacter('sealed_province_qin')GetName]的牛群尽管草料充足却拒不进食。狐疑的当地人声称这是#E秦#!不配承受天命的征兆，许多人正不假思索地重复着这番诽谤。"
 me_qin_li_si_1102_title:0 "饥牛之困"
 me_qin_li_si_1103.a:0 "我岂能得片刻安宁？"
 me_qin_li_si_1103_desc:0 "我们从边境要塞得到消息，土匪突袭并洗劫了当地一处戍堡，烧毁了储藏其中的所有重要文书。虽非世界末日，但确是一桩令行政管理头疼的事，需要投入大量时间来处理。"
 me_qin_li_si_1103_title:0 "劫掠者横行"
 me_qin_li_si_11_desc:0 "尽管#E秦#!境内曾使用过多种多样的文字，我们已决定推行一种标准字体，有朝一日将被称为\"篆书\"或\"装饰刻文之体\"。以我们先祖#E周#!的书体为基础，我们略作修改以适应自身之需——细想起来，恰如我们对周之治理体系所为。"
 me_qin_li_si_11_title:0 "$qin_02_li_si_task_11$"
 me_qin_li_si_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_11$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_12.a:0 "哈哈哈！尔等永不能破我长城！"
 me_qin_li_si_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]常常沉浸在一个白日梦中，这场景完全存在于[ROOT.GetCountry.GetRuler.GetHerHis]脑海中，却也并非遥不可及。\n\n来自北方的蛮族大军，离开草原上的家园，一心想将毫无防备的[ROOT.GetCountry.GetAdjective]城池的财富装满马鞍袋，却被[ROOT.GetCountry.GetRuler.GetFirstName]下令修建的宏伟防御工事挡在了半途。\n\n无论他们如何努力，攻城器械皆告失败，入侵者只得羞耻地返回家园。世上没有足够高明的将领，也没有足够聪明的工程师，能设计出摧毁[ROOT.GetCountry.GetRuler.GetFirstName]堡垒的机器[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_qin_li_si_12_title:0 "$qin_02_li_si_task_12$"
 me_qin_li_si_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_12$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_13.a:0 "啊，很好…方才说到何处？"
 me_qin_li_si_13_desc:0 "今晨有一则小消息，[ROOT.GetCountry.GetRuler.GetName]：您要求的领土宣称已准备妥当，地方州郡对国家的依附愈发紧密，感激#E秦#!边境带给他们的安全。"
 me_qin_li_si_13_title:0 "$qin_02_li_si_task_13$"
 me_qin_li_si_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_13$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_14.a:0 "沉浸于文明生活之醉人温软中吧…"
 me_qin_li_si_14_desc:0 "我们欣喜地宣布，#Y汉嘉#!和#Y越嶲#!的部落民正在逐渐接受他们的新处境——我们曾以为这一天永远不会到来。尽管花费了大量秦国的金银才将文明教化之影响力带至其地，我们必须承认这是值得的。我们所建的寺庙和剧场是各区域中最令人瞩目的建筑，这是秦人将长久留驻的实物提醒。"
 me_qin_li_si_14_title:0 "$qin_02_li_si_task_14$"
 me_qin_li_si_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_14$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_15.a:0 "吾等乃有史以来最伟大之文明"
 me_qin_li_si_15_desc:0 "毫无疑问，只要[ROOT.GetCountry.GetRuler.GetName]一声令下，[ROOT.GetCountry.GetName]的大军将直抵地之尽头，跨越途中每一片沙漠和每一道山脉，仍有足够余力摧毁一支兵力两倍于己的以逸待劳之敌。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]掌控着有史以来最致命的战斗力量；无人能够阻挡大秦雄师。"
 me_qin_li_si_15_title:0 "$qin_02_li_si_task_15$"
 me_qin_li_si_16.a:0 "[library_province_1.GetName]显然为上选"
 me_qin_li_si_16.b:0 "[library_province_2.GetName]乃建书藏之佳处"
 me_qin_li_si_16.c:0 "[library_province_3.GetName]尚佳"
 me_qin_li_si_16.d:0 "[library_province_4.GetName]亦可"
 me_qin_li_si_16.e:0 "吾等不必建书藏！"
 me_qin_li_si_16.f:0 "何其荒谬之议；立斩此人！！！"
 me_qin_li_si_16_desc:0 "几日前，[library_builder.GetName]抵达了[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，请求觐见[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。看来我们将获得一位建筑大师的效劳，他不仅通晓周边伟大城邦与帝国的建筑风格，更熟稔我们自己的崇高传统——一位真正的建筑学者。有人建议我们拨款建造一座新图书馆，以祖先的方式，来宣示我们作为统治者的配得之资格。\n\n这自然耗资巨大，但[library_builder.GetName]的言辞确有道理……"
 me_qin_li_si_16_title:0 "$qin_02_li_si_task_16$"
 me_qin_li_si_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_16$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_17.a:0 "正有一差事适合你…"
 me_qin_li_si_17_desc:0 "我们听闻有一位武艺超群的著名勇士，许多人声称他是有史以来最伟大的将军——其名为[SCOPE.sCharacter('bai_qi_character')GetName]，已被召至[ROOT.GetCountry.GetCapital.GetName]面见[ROOT.GetCountry.GetRuler.GetName]。\n\n到了约定会见之日，无暇寒暄客套。\"据说你是个屠夫，白起，一个残忍的嗜杀之人。这样的人一生所求为何？黄金？奴隶？说出你的价码，我便如你所愿。\"\n\n白起摇了摇头，望着[ROOT.GetCountry.GetRuler.GetFirstName]说道：\"我唯一感兴趣的是荣耀，啊，王上，以及在战场上斩杀更多的敌人。我会留在#E秦#!，因为无需解读征兆便可知，我这样的人在此地将大有用武之地。\""
 me_qin_li_si_17_title:0 "$qin_02_li_si_task_17$"
 me_qin_li_si_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_17$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_18.a:0 "敌若明智，见白起即当开门迎降"
 me_qin_li_si_18_desc:0 "#E白起#!犹如一条疯狗，口吐白沫，攻击任何挡道的人与物。白起屠戮的报告几乎令人难以置信，许多人宁可选择无视那骇人的死亡数字，视之为战争之代价。\n\n据说[ROOT.GetCountry.GetRuler.GetName]在阅读这些奏报时甚是愉悦，每当新的暴行传来便面露微笑——我们的王确然深恨敌人，将粉碎他们中的最后一个。"
 me_qin_li_si_18_title:0 "$qin_02_li_si_task_18$"
 me_qin_li_si_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_18$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_19.a:0 "商鞅若见李斯所为，必当自豪"
 me_qin_li_si_1900.a:0 "此消息令人不安，实为不幸…"
 me_qin_li_si_1900_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]竭力根除[ROOT.GetCountry.GetName]内部的腐败之毒，[ROOT.GetCountry.GetRuler.GetSheHe]却获悉一位官员[SCOPE.sCharacter('corrupt_official_qin')GetName]仍在公然收受贿赂，像卑贱的商贾一样将权柄拍卖给出价最高者。"
 me_qin_li_si_1900_title:0 "贪腐横行"
 me_qin_li_si_1901.a:0 "闻此怒不可遏！必有人头落地！"
 me_qin_li_si_1901_desc:0 "今晨，[ROOT.GetCountry.GetRuler.GetName]被管家告知，我们一些税款失踪了。这并非区区小数，而是一百枚金币——无论以谁的标准衡量都是一笔小财富。关于这桩窃案自然是无人知晓任何隐情，尽管王宫中人人都遭到了严厉盘问，却无人记得看见或听到可疑之事。\n\n眼下我们唯一能做的，便是在国库外增派卫兵，寄望这种事不再发生……我们非常抱歉，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_qin_li_si_1901_title:0 "国库之蠹"
 me_qin_li_si_1902.a:0 "不顾民意，继续施工"
 me_qin_li_si_1902_desc:0 "[SCOPE.sP('legalist_province_qin').GetName]是我们某一行省中的一个聚落，素以叛国行为的温床而闻名，因此我们的官员一直在该地区辛勤工作，竭力铲除社会中一切不受欢迎的分子。\n\n于是听到整个行省对[ROOT.GetCountry.GetName]国家的忠诚在下降，也就不足为奇了。[ROOT.GetCountry.GetRuler.GetName]已获悉这一事态，我们的统治者已作出了相应回应。"
 me_qin_li_si_1902_title:0 "酷吏横行"
 me_qin_li_si_19_desc:0 "[ROOT.GetCountry.GetRuler.GetName]并非一个过分多愁善感的人，因此听闻[ROOT.GetCountry.GetRuler.GetSheHe]近来公然感叹#E商鞅#!无法亲眼看到这位学者所倡导的法家改革在[ROOT.GetCountry.GetName]生根发芽，倒是有些令人意外。\n\n尽管仍有大量工作待完成，但无人能否认，秦国比十年前，甚至比此刻的任何时候，都要强大和稳固得多。"
 me_qin_li_si_19_title:0 "$qin_02_li_si_task_19$"
 me_qin_li_si_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_19$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_1_desc:0 "[SCOPE.sCharacter('li_si_character')GetName]向[ROOT.GetCountry.GetRuler.GetName]深深鞠躬后挺身而起，目光从[ROOT.GetCountry.GetAdjective]王的脸上移开。\n\n\"您将重任托付于我，[ROOT.GetCountry.GetRuler.GetFirstName]王，但我向您保证——完成所托付的工作将是我毕生的荣耀。以商鞅的原则与教条指引我醒着的每一刻，不达目的，我绝不歇息。\""
 me_qin_li_si_1_title:0 "$qin_02_li_si_task_1$"
 me_qin_li_si_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_1$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_2.a:0 "但愿李斯能持此锐势而不自焚…"
 me_qin_li_si_2_desc:0 "[ROOT.GetCountry.GetRuler.GetName]凭[ROOT.GetCountry.GetRuler.GetHerHis]之睿智，任命了聪明的#E李斯#!担任政府官职。受此殊荣后，李斯立即前往档案库，开始阅读所有他能找到的文献；看来我们这位新大臣对待此职非常认真。\n\n次日清晨，在布满灰尘的卷轴间度过不眠之夜后，第一批领土宣称便呈到了惊愕的秦王面前。"
 me_qin_li_si_2_title:0 "$qin_02_li_si_task_2$"
 me_qin_li_si_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_2$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_3.a:0 "假以时日，逐一追讨！"
 me_qin_li_si_3_desc:0 "我们收到报告，#E李斯#!在新的政府官职上如鱼得水；看来李斯在治理的汹涌波涛中游刃有余，如鱼入海。\n\n他不仅在这新环境中茁壮成长，而且成果斐然……[ROOT.GetCountry.GetRuler.GetName]很快将有大量新的领土宣称可以去追索。"
 me_qin_li_si_3_title:0 "$qin_02_li_si_task_3$"
 me_qin_li_si_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_3$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_4.a:0 "于我而言，选择显而易见…"
 me_qin_li_si_4.b:0 "嗯，此决断殊为不易…"
 me_qin_li_si_4_desc:0 "虽然#Y冉駹#!和#Y筰#!的土地确属我们所有，但对于居住在这些遥远国度的民心，我们却不能作同样的断言——说白了，他们恨我们，但谁又能怪他们呢？毕竟在他们向我们举起武器时，我们并没有展示任何仁慈，而如今我们必须应付一群愤怒的民众。\n\n我们须决定将安抚工作的重心放在何处；遗憾的是，眼下我们已无法做更多了。"
 me_qin_li_si_4_title:0 "$qin_02_li_si_task_4$"
 me_qin_li_si_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_4$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_5.a:0 "李斯，承谢了——商鞅当以你为傲"
 me_qin_li_si_5_desc:0 "尽管我们对#E李斯#!倾注给#E秦#!的领土宣称已近乎习以为常，但今日我们睿智的大臣告知了一桩不同却同样令人欣喜之事：#E封建#!制度的最后残余已从我们的政府中被清除，我们的国家骨骼已因集权努力而愈发坚固强壮。"
 me_qin_li_si_5_title:0 "$qin_02_li_si_task_5$"
 me_qin_li_si_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_5$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_6.a:0 "吾等时时苦思何以善民生"
 me_qin_li_si_600.a:0 "我实不知此事何以至此"
 me_qin_li_si_600_desc:0 "发生了一桩令民众愤慨的小丑闻；原来[ROOT.GetCountry.GetRuler.GetName]一直在使用做过手脚的砝码欺骗商人。#E秦#!的一切资源皆为[ROOT.GetCountry.GetRuler.GetHerHim]所用，却还要偷窃比其穷得多的人——[ROOT.GetCountry.GetRuler.GetFirstName]的所作所为真是令人作呕。"
 me_qin_li_si_600_title:0 "度量失准"
 me_qin_li_si_601.a:0 "我只消一言便可取[SCOPE.sCharacter('upset_official_qin')GetFirstName]之头"
 me_qin_li_si_601_desc:0 "[SCOPE.sCharacter('upset_official_qin')GetName]一直公开抱怨[ROOT.GetCountry.GetRuler.GetName]反复无常的决策，致使二人之间滋生了极大的敌意。\n\n如今，在每一次公开场合，[ROOT.GetCountry.GetRuler.GetFirstName]都刻意[ROOT.GetCountry.GetRuler.GetHerHis]公开羞辱[SCOPE.sCharacter('upset_official_qin')GetFirstName]。"
 me_qin_li_si_601_title:0 "朝堂角力"
 me_qin_li_si_602.a:0 "百姓总是急于将一切归咎于我"
 me_qin_li_si_602_desc:0 "天公许久不肯降雨，随着田地干涸、庄稼在藤上枯萎，人人都在指责[ROOT.GetCountry.GetRuler.GetName]失职。"
 me_qin_li_si_602_title:0 "大旱之灾"
 me_qin_li_si_603.a:0 "意外难免，幸而我等还赔得起"
 me_qin_li_si_603_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在山中穿行时不慎遗失了钱袋，损失了一大笔钱，如今必须从#Y秦#!国库中补还。"
 me_qin_li_si_603_title:0 "挥金如土之人"
 me_qin_li_si_6_desc:0 "尽管#E李斯#!的大多数改革针对的是政府上层，但他最新的举措将波及国中每一个人，从最卑微的农夫到[ROOT.GetCountry.GetRuler.GetName][ROOT.GetCountry.GetRuler.GetHerHim]本人。\n\n获全权授权以革新[ROOT.GetCountry.GetAdjective]市场上使用的度量衡体系后，我们现已可以报告，我们的人民已全心接受了新制度。据说人人都赞赏李斯新制度的简单实用，它取代了#E周#!遗留下来的那套杂乱无章的旧体系，农民们都说秦国照顾每一个人，而不只是富人和权贵。"
 me_qin_li_si_6_title:0 "$qin_02_li_si_task_6$"
 me_qin_li_si_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_6$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_7.a:0 "吾等以异端思想之烟为香，敬献诸神"
 me_qin_li_si_700.a:0 "今日之世，谁人可信"
 me_qin_li_si_700_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]从未做出任何招致[SCOPE.sCharacter('upset_minority_char_qin')GetName]个人敌意的事，但当[ROOT.GetCountry.GetRuler.GetFirstName]听闻[SCOPE.sCharacter('upset_minority_char_qin')GetFirstName]在散布叛逆谎言时，这仍是令人痛心的消息。"
 me_qin_li_si_700_title:0 "见风使舵之友"
 me_qin_li_si_701.a:0 "我何时能不再闻噩耗？"
 me_qin_li_si_701_desc:0 "尽管[ROOT.GetCountry.GetRuler.GetName]本希望改善与新近征服者之间的关系，但派出的使节事先并未研究当地风俗，非但没有改善#E秦#!的利益，反而使其大为恶化。\n\n若在未来数月内听闻叛乱，我们也不应感到意外……"
 me_qin_li_si_701_title:0 "笨拙使节"
 me_qin_li_si_702.a:0 "此等使节，何需敌人？"
 me_qin_li_si_702_desc:0 "又来一桩外交上的\"政变\"要向您禀报，[ROOT.GetCountry.GetRuler.GetName]，没错，我说的是反话——我实际要禀报的恰恰相反。我们派去的那些蠢货惹出了需要时间才能愈合的乱子，在我们新近征服的省份中造成了极大的文化冒犯。"
 me_qin_li_si_702_title:0 "文化冒犯"
 me_qin_li_si_703.a:0 "尚可，但勿以此等琐事扰我"
 me_qin_li_si_703_desc:0 "我们认为应当禀告您，[ROOT.GetCountry.GetRuler.GetName]，整肃进展顺利，持有异端邪说的公民正被处决，终结了他们的不轨行径。"
 me_qin_li_si_703_title:0 "焚书坑儒"
 me_qin_li_si_7_desc:0 "在[ROOT.GetCountry.GetRuler.GetName]的鼓动下，自发暴民在[ROOT.GetCountry.GetName]各城市中爆发，游荡街头搜寻[ROOT.GetCountry.GetAdjective]当局所禁的私藏之物。\n\n这一幕令人想起[ROOT.GetCountry.GetCapital.GetName]的场景——这场反智狂潮的震中——成百上千的卷轴和文献正被收集起来投入巨大的篝火中。\n\n除非正式列入#E商鞅#!和#E李斯#!所编目录，任何非法著作都必须销毁。"
 me_qin_li_si_7_title:0 "$qin_02_li_si_task_7$"
 me_qin_li_si_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_7$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_8.a:0 "若我之才学不能使之折服，黄金必能"
 me_qin_li_si_8.b:0 "若我之才学不能使之折服，黄金必能"
 me_qin_li_si_800.a:0 "尚可，但勿以此等琐事扰我"
 me_qin_li_si_800_desc:0 "我们认为应当禀告您，[ROOT.GetCountry.GetRuler.GetName]，整肃进展顺利，持有异端邪说的公民正被处决，终结了他们的不轨行径。"
 me_qin_li_si_800_title:0 "焚书坑儒"
 me_qin_li_si_801.a:0 "尚可，但再强调一遍，勿以此等琐事扰我"
 me_qin_li_si_801_desc:0 "您关于外国学者的所有指示均已付诸实施，[ROOT.GetCountry.GetRuler.GetName]。我们毫不怀疑将在海外找到一些愿意的听众，但不知这些事务需要多长时间。\n\n#E秦#!的黄金很快将使我们的学府充满四海之内最杰出的头脑。"
 me_qin_li_si_801_title:0 "笼络学士"
 me_qin_li_si_802.a:0 "尚可，但勿以此等琐事扰我"
 me_qin_li_si_802_desc:0 "您会欣喜地得知，[SCOPE.sCharacter('seduced_zhou_scholar')GetName]，一位声誉卓著、备受尊敬的#E周#!学者，于今日午后抵达了[ROOT.GetCountry.GetCapital.GetName]。看来[ROOT.GetCountry.GetRuler.GetName]宣告#E秦#!有财富等待有才之士的消息，又吸引了一位卓越的头脑。"
 me_qin_li_si_802_title:0 "周室之智"
 me_qin_li_si_8_desc:0 "吾邦智识之盛，举世共睹，然亦可赐一学者览尽千载之典籍；[ROOT.GetCountry.GetCapital.GetName]之藏书阁与府库，乃天下哲人贤士所艳羡者也。深信贤能之臣须从敌手夺来，[ROOT.GetCountry.GetRuler.GetName]遂决意令#E 秦#!招揽异国显贵与学士。\n\n试观[SCOPE.sCharacter('seduced_chu_scholar')GetName]之事，其竟甘背#E 楚#!——吾邦密使几乎不费吹灰之力，便得[SCOPE.sCharacter('seduced_chu_scholar')GetFirstName]之倾心。"
 me_qin_li_si_8_title:0 "$qin_02_li_si_task_8$"
 me_qin_li_si_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_8$#!' $mission_completed_tooltip_2$"
 me_qin_li_si_9.a:0 "我之学士不必苦修；令其在锦榻上思辨"
 me_qin_li_si_9_desc:0 "闻远方极西诸国，哲人偶得参预朝政，然此乃例外而非常规。\n\n此类事当见于蛮夷之邦，不足为奇；非若#E 秦#!之英明，厚赐学士俸禄、广给资财，以助其治学。\n\n[SCOPE.sCharacter('royal_tutor_qin_9')GetName]正是此策之完美典范；居于[ROOT.GetCountry.GetCapital.GetName]，使此位雄心勃勃的太傅得以施展才华以自增益，同时为秦之嗣子提供无与伦比之教。"
 me_qin_li_si_9_title:0 "$qin_02_li_si_task_9$"
 me_qin_li_si_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_02_li_si_task_9$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_1.a:0 "法家将为吾等立国之基"
 me_qin_shan_yang_10.a:0 "日出日落，顾我众人…"
 me_qin_shan_yang_1000.a:0 "此等自由民将于此得庇护"
 me_qin_shan_yang_1000_desc:0 "[migration_prov.GetName]之庶民已决意弃其故园，归于我土。彼等深信战事无可避免，唯求安定与保全，此等福祉，唯有[ROOT.GetCountry.GetName]常胜之师所能赐予其民。"
 me_qin_shan_yang_1000_title:0 "[neighbor.GetName]之自由民"
 me_qin_shan_yang_10_desc:0 "#E 戎#!已败！昔者，吾邦与北地蛮族争雄，战事最晦暗之时，彼等似将占得上风。\n\n然无所惧也；其君已逐出权位之殿堂，且预兆昭示，戎人将永不复见阳光照于其面。"
 me_qin_shan_yang_10_title:0 "$qin_01_shan_yang_task_10$"
 me_qin_shan_yang_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_10$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_11.a:0 "商鞅，多愿你亲见此刻…谢了"
 me_qin_shan_yang_11_desc:0 "#E 商鞅#!之变法初倡之时，震荡朝野，鲜有识者能悟此策之简妙，呈于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]面前。然[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]独具远见，能在众人迷惘之际洞悉至智之途，其遂命[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]以少年锐气推行变法。\n\n今值凯旋之际，世人尽忘那位引领吾邦步入天命之道的谦逊大夫……唯[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]铭记不忘[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]。"
 me_qin_shan_yang_11_title:0 "$qin_01_shan_yang_task_11$"
 me_qin_shan_yang_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_11$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_1_desc:0 "封建之制虽曾于远古为邦国之凭恃，然此陈旧之治道显然已过其时。\n\n若欲建万世不移之王国，则不可效周室所立之先例，而当自辟蹊径——吾等当纳商鞅之策于心，着手瓦解旧日封建之制。"
 me_qin_shan_yang_1_title:0 "$qin_01_shan_yang_task_1$"
 me_qin_shan_yang_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_1$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_2.a:0 "永别了，远古诸敌…代我问候冥界诸神"
 me_qin_shan_yang_2_desc:0 "北方之戎蛮，牧其畜群于草原之上，恰在其都[GetProvince('(int32)8279').GetName]之外。自古以来，我辈与义渠屡有交锋，今年亦不例外。\n\n然有一事确凿无疑；待我大军征讨毕事之后，此地不复有两石相叠——不将其彻底灭尽，我辈绝不罢休。"
 me_qin_shan_yang_2_title:0 "$qin_01_shan_yang_task_2$"
 me_qin_shan_yang_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_2$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_3.a:0 "新附之民将发现[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]乃仁慈之主。"
 me_qin_shan_yang_3_desc:0 "[GetProvince('(int32)8279').GetName]之弓既已折毁，我辈不复畏彼马背之族——其箭矢再不能遮天蔽日般射向我军阵列，其迅捷之乘骑亦不能再驰入无助农夫之田野行劫掠之事。\n\n虽我二族融合之际不免有紧张之时，然我辈将尽一切所能，以纾缓此成长之痛。"
 me_qin_shan_yang_3_title:0 "$qin_01_shan_yang_task_3$"
 me_qin_shan_yang_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_3$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_4.a:0 "蛮夷，尔若小觑我民兵，必自取其祸"
 me_qin_shan_yang_4000.a:0 "彼等受保护尚存怨言？"
 me_qin_shan_yang_4000_desc:0 "迭接呈报，言我辈所立之#E 女军#!未获普遍爱戴。在若干不服王化之省份，妇人竟遭本地居民袭击，彼等声称由武装女子守卫乃辱及其身与其祖先。将有短暂骚乱，然非我辈所不能忍。"
 me_qin_shan_yang_4000_title:0 "女军之怨"
 me_qin_shan_yang_4001.a:0 "既是如此说法，我现在也怕了"
 me_qin_shan_yang_4001_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，臣有噩耗奏报。久寂之山忽有火山喷发，此事本身已值一书，更兼一切发生于近日日蚀之际——不待多言，我民已惶惧至极矣，[ROOT.GetCountry.GetRuler.GetFirstName]。"
 me_qin_shan_yang_4001_title:0 "天灾！"
 me_qin_shan_yang_4002.a:0 "众人只得接受！"
 me_qin_shan_yang_4002_desc:0 "贵族间有占卜者，自称知晓火山喷发与日蚀之故——可笑者，其言此皆因我辈在城中任用#E [ROOT.GetCountry.GetAdjective]女军#!所致。\n\n此说虽显然荒谬，然若不承认其为上层阶级间流行之论调，则亦为虚言……彼等惯于将诸事归咎于[ROOT.GetCountry.GetRuler.GetName]。"
 me_qin_shan_yang_4002_title:0 "贵族反叛"
 me_qin_shan_yang_4_desc:0 "外人偶闻[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]诸城由妇女民兵守卫，常嗤笑而发狎亵之语——然此皆在其亲见我女军之纪律严明、庄严凌厉之前。\n\n当男子于前线奋战之时，彼等不必为家中担忧分毫，因其全然信赖其妻其母护卫子女之能。此等安心实为无价，我辈感念举国上下皆愿为战事各尽本分。"
 me_qin_shan_yang_4_title:0 "$qin_01_shan_yang_task_4$"
 me_qin_shan_yang_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_4$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_5.a:0 "既有更佳之选，拒之者为愚"
 me_qin_shan_yang_5000.a:0 "我久未如此震怒"
 me_qin_shan_yang_5000_desc:0 "臣憾然奏报，有恶讯至；我辈安抚国中#E 蜀川#!民众之举措适得其反；彼等怒意更甚于前……我辈当初或当置之不理。"
 me_qin_shan_yang_5000_title:0 "蜀地龃龉"
 me_qin_shan_yang_5000_tooltip:0 "$mission_completed_tooltip_1$ '#Y $me_qin_shan_yang.5000$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_5001.a:0 "我之将士足可平定任何叛乱"
 me_qin_shan_yang_5001_desc:0 "虽既往曾受严酷教训，然我辈仍毅然前行，不使行省骚乱之琐事分散真正之目标；即彻底而完全地同化我境内之异族。"
 me_qin_shan_yang_5001_title:0 "蜀地之困"
 me_qin_shan_yang_5001_tooltip:0 "$mission_completed_tooltip_1$ '#Y $me_qin_shan_yang.5000$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_5002.a:0 "我可怜的百姓…你们没有白白牺牲"
 me_qin_shan_yang_5002_desc:0 "若不言及南地之杀戮，则为我辈之失职……有呈报称秦之公民正遭愤怒土人屠戮。我辈当竭力持续安定此区域。"
 me_qin_shan_yang_5002_title:0 "共处之艰"
 me_qin_shan_yang_5002_tooltip:0 "$mission_completed_tooltip_1$ '#Y $me_qin_shan_yang.5000$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_5_desc:0 "我邦南境之地，族群纷杂，信仰与方言交融并存；此乃世事之本然。犹如香料过盛则损佳肴之芬芳，信仰与文俗之繁杂亦可削弱邦国之凝聚力。\n\n我辈当向蜀川之民伸手，劝其接纳正宗[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]之传统——和合共生，乃我辈所欲致之目标。"
 me_qin_shan_yang_5_title:0 "$qin_01_shan_yang_task_5$"
 me_qin_shan_yang_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_5$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_6.a:0 "吾等决不重蹈周室之覆辙"
 me_qin_shan_yang_6_desc:0 "贵族之流虽可为强力盟友，然扶植彼等亦自有[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]弊，贤明之君当自察其权势。我辈之史册岂非已昭示先祖之失？《周书》之中，例证层出：三监之叛、国人暴动……此皆不满之王族所发。\n\n有此前车之鉴，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已立誓其绝不蹈此覆辙。"
 me_qin_shan_yang_6_title:0 "$qin_01_shan_yang_task_6$"
 me_qin_shan_yang_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_6$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_7.a:0 "艰难决断乃我职责所在；只求尔等信我"
 me_qin_shan_yang_7_desc:0 "虽有幕僚戏言蜀川人冥顽不化、难以教化，然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]所推之举措已向一切怀疑者证明，凡[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]人民所欲，无不可成。\n\n值我文明扎根于新土之际，众人无不赞颂[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]之远见，慨然作出如此明智之举。"
 me_qin_shan_yang_7_title:0 "$qin_01_shan_yang_task_7$"
 me_qin_shan_yang_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $qin_01_shan_yang_task_7$#!' $mission_completed_tooltip_2$"
 me_qin_shan_yang_8.a:0 "在[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]所缔造之将来中，毫无朽败容身之余地。"
 me_qin_shan_yang_8_desc:0 "周室统治之一大流弊，乃无节制之贪腐蔓延全国，致令懦弱之辈为[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]本应庇护之民带来深重苦难。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]有志纾解庶民之负累，毅然向其官府宣无声之战，废除贵族世袭之特权，代谄媚之徒以仁德之士。今后不复有牧守欺凌其民，唯有正直之官以荣誉恪守所托之权威。"

 qin_02_li_si_CRITERIA_DESCRIPTION:0 "待#E 秦#!施行#E 商鞅#!变法之其余诸项，彻底完成经济与官僚之转型，此使命方告功成。"
 qin_02_li_si_DESCRIPTION:0 "#E 秦朝#!之势日盛，赖其所行之明达法家变法，天下九州莫不感受其变。\n\n在此战火重燃之世，新一代士人已然接掌权位，然众人较之#E 李斯#!皆黯然失色。此少年才俊乃#E 商鞅#!之门生，立誓要将先师大业之未竟诸般变法一一付诸实行。"
 qin_02_li_si_task_1:0 "征辟李斯"
 qin_02_li_si_task_10:0 "坑儒"
 qin_02_li_si_task_10_DESC:0 "#E 李斯#!已颁禁书之令，除#E 秦#!史记之外，凡持有任何他种典籍者，皆处以极刑。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 qin_02_li_si_task_11:0 "小篆"
 qin_02_li_si_task_11_DESC:0 "有议者奏请统一文字；#E 李斯#!正忙于规正小篆之用法，同时禁绝其他现行之书体。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 qin_02_li_si_task_12:0 "秦长城"
 qin_02_li_si_task_12_DESC:0 "#Y 咸阳#!、#Y 彭阳#!与#Y 鸿门#!皆为要害之城，其因非止一端；此诸都会不仅为举足轻重之经济中心，亦为防务工事体系中至要之节点。\n\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 qin_02_li_si_task_13:0 "削弱晋邦"
 qin_02_li_si_task_13_DESC:0 "时机既至，当以我之势取代晋国之权，然暂不即刻对周王用兵。\n\n\n\n\n\n\n\n\n\n\n@tibet_mil4!"
 qin_02_li_si_task_13_changan_area:0 "我辈必须掌控#Y 长安#!地区所有省份，然周王所据之省不在其列。"

 qin_01_shan_yang:0 "商君遗业"
 qin_01_shan_yang_BUTTON_TOOLTIP:0 "我们必须拥抱商君方有一线生机！"
 qin_01_shan_yang_CRITERIA_DESCRIPTION:0 "待#E 秦#!尽行政治家商鞅所倡之诸般变法，此使命方告功成。"
 qin_01_shan_yang_DESCRIPTION:0 "仅一代之前，有法家兼政客名曰商鞅，虽出身使我列为#E 魏#!之人，然天命却引领其以举足轻重之谋臣身份效力于#E 秦#!。\n\n商鞅痛感#E 周#!室之腐败羸弱，深信前行之路在于摒弃古道，遍革政事之诸面。未几，军旅、经济与官僚之体，尽被商鞅笔下之墨痕剖析厘定。今其人虽已不在，然其所遗之著述昭示宏图，我辈必将使之化为现实。"
 qin_01_shan_yang_task_1:0 "废除封建"
 qin_01_shan_yang_task_10:0 "戎族之终"
 qin_01_shan_yang_task_10_DESC:0 "戎人，我之宿敌，其踪迹于吾民之间不复再有——令其记忆永归湮灭，化为时光流沙中一点飞尘。\n\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 qin_01_shan_yang_task_11:0 "商君遗业"
 qin_01_shan_yang_task_11_DESC:0 "商鞅虽无缘亲见其宏图之终成，然我辈全胜之际，大可安然而信商君当为变法所成之功而欣悦。举国上下，自卑微之耕夫至骄矜之官吏，其生途皆因之而善改。\n\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 qin_01_shan_yang_task_1_DESC:0 "封建之制，数百年来乃周室治理之基石。然此分权之治体，与商鞅法家变法之主集权大相违逆。我辈当依商君之指引，继续弃封建羁縻而维新。\n\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 qin_01_shan_yang_task_1_tt:0 "邻近周邦的自由民可能移居至[THIS.GetCountry.GetName|Y]之地。"
 qin_01_shan_yang_task_2:0 "索要义渠"
 qin_01_shan_yang_task_2_DESC:0 "我辈与盘踞义渠所据之地的戎人征战久远，因此夺取$anding_area$与$tianshui_area$地区实为易事。为先祖复仇，此乃天经地义！\n\n\n\n\n\n\n\n\n\n\n@china_mil3!"
 qin_01_shan_yang_task_2_tt:0 "获得对$anding_area$和$tianshui_area$地区的宣称。"
 qin_01_shan_yang_task_3:0 "阉割义渠"
 qin_01_shan_yang_task_3_DESC:0 "我辈不可重蹈覆辙，今义渠已在掌握之中，当压制其俗，诱其民归化于我。田间老农皆知，去势之牡马远不如先前危险。\n\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 qin_01_shan_yang_task_4:0 "女子民兵"
 qin_01_shan_yang_task_4_DESC:0 "城中妇孺足可守卫城墙，而男丁则驰骋于疆场。传令各村——命其编组民兵，以护后方之安。\n\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 qin_01_shan_yang_task_5:0 "同化巴蜀"
 qin_01_shan_yang_task_5_DESC:0 "蜀川盆地坐镇我故土周边之形胜之地，此域之重不可胜言，我等亟欲其开发，然欲令大计扎根，必先得民心之归附。\n\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 qin_01_shan_yang_task_5_reward_tt:0 "#Y 广汉#!、#Y 巴#!、#Y 蜀#!与#Y 犍为#!诸区之所有省份，均将获得#Y 蜀川同化#!。"
 qin_01_shan_yang_task_5_tt:0 "我们的官员将试图笼络巴蜀之民心。"
 qin_01_shan_yang_task_6:0 "遏制贵族"
 qin_01_shan_yang_task_6_DESC:0 "贵族势力日长，此乃恒在之患，若稍有不慎，或恐发觉至大之敌竟是口称挚友之人……必须有所作为。\n\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 qin_01_shan_yang_task_7:0 "开化巴蜀"
 qin_01_shan_yang_task_7_DESC:0 "今者地方之民已悦纳我辈之在境，对我改善当地基业之建言亦欣然接受。假以时日，此地之文明当与我本土无异。\n\n\n\n\n\n\n\n\n\n\n@china_mil13!"

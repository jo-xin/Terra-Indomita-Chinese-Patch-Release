 me_pentapotamia_1.a:0 "让我们进行自我反思。"
 me_pentapotamia_10.a:0 "我们前往波斯。"
 me_pentapotamia_10_desc:0 "#E 阿里亚纳#!地区因与#E 马其顿#!的遥远距离，仅是#E 亚历山大#!征服的最后阶段之一。对我们而言，却是众多征服的起点。逆行#E 亚历山大#!的脚步时，我们最好铭记他的征服与我们的征服。"
 me_pentapotamia_10_title:0 "$pentapotamia_missions_task_10$"
 me_pentapotamia_10_tooltip:0 "任务‘#Y $pentapotamia_missions_task_10$#!’现已#G 完成#!"
 me_pentapotamia_11.a:0 "况且，我们绝不会输给孔雀帝国！"
 me_pentapotamia_11_desc:0 "#E 帕提亚#!是#E 亚历山大#!帝国中引人注目的部分。如同之前的#E 阿契美尼德#!，#E 帕提亚#!保持自治附庸地位，最终归于#E 塞琉古帝国#!。当然，我们是比他们更优秀的#E 继业者#!，因我们完全控制该地区，不像#E 塞琉古#!后裔的失败。\n\n现在是全新的进展。既然我们从相反方向而来，#E 米底#!和#E 亚美尼亚#!地区向我们敞开征服之门。当然，这偏离了我们的#E 俄刻阿诺斯#!使命，但#E 亚历山大#!走过之处，我们也将行军！"
 me_pentapotamia_11_title:0 "$pentapotamia_missions_task_11$"
 me_pentapotamia_11_tooltip:0 "任务‘#Y $pentapotamia_missions_task_11$#!’现已#G 完成#!"
 me_pentapotamia_12.a:0 "让我们开始通往#E 俄刻阿诺斯#!的马拉松。"
 me_pentapotamia_12_desc:0 "#E 亚历山大#!帝国的边境之地包括#E 巴克特里亚#!和#E 波斯#!、#E 革德罗西亚#!和#E 阿剌科西亚#!，当然还有#E 印度#!等宏伟省份。这些是#E 阿契美尼德#!之前的故土，永远与#E 印度#!相连。现在，我们不再是被征服者，而是从#E 兴都库什#!屏障突破，进入长久威胁我们的土地。"
 me_pentapotamia_12_title:0 "$pentapotamia_missions_task_12$"
 me_pentapotamia_12_tooltip:0 "任务‘#Y $pentapotamia_missions_task_12$#!’现已#G 完成#!"
 me_pentapotamia_13.a:0 "我几乎能闻到海的气息……不是波斯湾的。"
 me_pentapotamia_13_desc:0 "关于#E 波斯#!还能说些什么尚未被提及？世界首个伟大帝国#E 阿契美尼德#!，席卷#E 希腊人#!与#E 印度人#!。然后来了#E 亚历山大#!，通过俘获#E 波斯人#!和焚烧首都宣称伟大。现在，我们在通往世界另一端#E 俄刻阿诺斯#!的路上抵达，但我们无暇驻足享受#E 希腊-波斯#!文化。我们继续前往#E 亚历山大#!帝国的真正中心；#E 美索不达米亚#!。"
 me_pentapotamia_13_title:0 "$pentapotamia_missions_task_13$"
 me_pentapotamia_13_tooltip:0 "任务‘#Y $pentapotamia_missions_task_13$#!’现已#G 完成#!"
 me_pentapotamia_14.a:0 "教我一些米底魔法！"
 me_pentapotamia_14_desc:0 "#E 米底#!之地是伟大#E 波斯#!帝国的真正初版。#E 阿契美尼德#!的前身，#E 米底人#!在#E 亚历山大#!治下影响深远，如#E 米底#!名字‘米特拉达梯’所示。他们形成与典型#E 波斯人#!的表亲文化，如今最显著特征是他们的祭司。如今，#E 米底#!再次成为表亲民族伟大帝国下的省份，尽管这次稍显疏远。尽管如此，我们应超越#E 米底人#!前进。"
 me_pentapotamia_14_title:0 "$pentapotamia_missions_task_14$"
 me_pentapotamia_14_tooltip:0 "任务‘#Y $pentapotamia_missions_task_14$#!’现已#G 完成#!"
 me_pentapotamia_15.a:0 "征服的下一步就在眼前。"
 me_pentapotamia_15_desc:0 "我们征服了#E 波斯#!，现在放眼黎凡特之地。我们抵达#E 俄刻阿诺斯#!前的最后一步。这些土地是#E 亚历山大#!帝国的中心，且在此之前是帝国的土地。阿卡德、苏美尔、巴比伦、亚述、米坦尼、埃及，皆曾在此一或多地区宣称主权。谁能想到亚历山大之后的下一个帝国竟来自#E 般阐那陀#!的五条河流！\n\n我们还需注意，证明征服不再仅需城市，而是整个#E 美索不达米亚#!和#E 亚述#!。这些帝国的中心对宣称自己是#E 亚历山大#!继承者至关重要。"
 me_pentapotamia_15_title:0 "$pentapotamia_missions_task_15$"
 me_pentapotamia_15_tooltip:0 "任务‘#Y $pentapotamia_missions_task_15$#!’现已#G 完成#!"
 me_pentapotamia_16.a:0 "般阐那陀与美索不达米亚？我猜这使我们成为全河之地。"
 me_pentapotamia_16_desc:0 "这里的悠久历史早于我们任一母民族进入#E 印度#!！#E 巴比伦#!的传说在#E 亚历山大#!统治期间更加广传。这位世界征服者视其为世上最美之城及其帝国的中心。但对我们而言，这是通往#E 俄刻阿诺斯#!的一步，因#E 底格里斯河与幼发拉底河#!之外便是传奇的#E 俄刻阿诺斯#!。让我们加快步伐！"
 me_pentapotamia_16_title:0 "$pentapotamia_missions_task_16$"
 me_pentapotamia_16_tooltip:0 "任务‘#Y $pentapotamia_missions_task_16$#!’现已#G 完成#!"
 me_pentapotamia_17.a:0 "这里的俄刻阿诺斯将是我的俄刻阿诺斯。"
 me_pentapotamia_17_desc:0 "庆祝活动在我们的首都持续，从#E 五河之地#!的中心到我们为之奋斗的#E 俄刻阿诺斯#!上的最新行政省份。但为何这位新伟大帝国的统治者仍心神不宁？\n\n他的野心尚未满足。亚历山大征服了#E 埃及#!、#E 安纳托利亚#!等！只有整个世界能满足他。因此，尽管#E 逆转俄刻阿诺斯#!已达成，仍有许多工作要做。"
 me_pentapotamia_17_title:0 "$pentapotamia_missions_task_17$"
 me_pentapotamia_17_tooltip:0 "任务‘#Y $pentapotamia_missions_task_17$#!’现已#G 完成#!"
 me_pentapotamia_18.a:0 "这就是我们世界的另一端。"
 me_pentapotamia_18_desc:0 "我们……做到了！俄刻阿诺斯已达成。这值得盛大的庆祝。无论我们崩溃还是继续强大，我们的征服将永垂不朽。历史已成，现在让我们为这位引领我们从世界一端到另一端、完成#E 逆转俄刻阿诺斯#!使命的领袖荣耀盛宴。"
 me_pentapotamia_18_title:0 "$pentapotamia_missions_task_18$"
 me_pentapotamia_18_tooltip:0 "任务‘#Y $pentapotamia_missions_task_18$#!’现已#G 完成#!"
 me_pentapotamia_19.a:0 "无人、无山、无马能阻我们的征服！"
 me_pentapotamia_19_desc:0 "#E 亚美尼亚#!的山区崎岖，令人想起故乡的#E 喜马拉雅山#!。征服它绝非易事，但如#E 亚历山大#!所为，我们亦然。这些人民拥有独特文化，即便在#E 波斯#!和#E 马其顿#!征服后。对此我们可予以尊重，甚至在军队中雇佣一些精锐山地骑士。"
 me_pentapotamia_19_title:0 "$pentapotamia_missions_task_19$"
 me_pentapotamia_19_tooltip:0 "任务‘#Y $pentapotamia_missions_task_19$#!’现已#G 完成#!"
 me_pentapotamia_1_desc:0 "在#E 耶槃那#!与#E 印度#!相遇之处，一个新理念诞生：#E 般阐那陀#!。这一理念不稳定。作为#E 雅利安人#!遵循#E 希腊人#!的方式？许多人质疑这种联合能否不经征服实现。但我们仍将尝试。这不是普通的印度-希腊王国，而是一个采纳#E 希腊#!方式的原生#E 印度#!王国。我们必须努力将这一理念变为现实。"
 me_pentapotamia_1_title:0 "$pentapotamia_missions_task_1$"
 me_pentapotamia_1_tooltip:0 "任务‘#Y $pentapotamia_missions_task_1$#!’现已#G 完成#!"
 me_pentapotamia_2.a:0 "让我们驱象穿越兴都库什。"
 me_pentapotamia_20.a:0 "让我们为此新地区资助一支舰队。"
 me_pentapotamia_20_desc:0 "黎凡特之地为我们呈现#E 俄刻阿诺斯#!的美丽景色。此地人民是声名卓著的商人，称为#E 腓尼基人#!。在#E 亚历山大#!时，城邦已开始衰落，但对我们而言它们至关重要。我们必须利用他们的造船专长，探索我们发现的#E 俄刻阿诺斯#!。"
 me_pentapotamia_20_title:0 "$pentapotamia_missions_task_20$"
 me_pentapotamia_20_tooltip:0 "任务‘#Y $pentapotamia_missions_task_20$#!’现已#G 完成#!"
 me_pentapotamia_21.a:0 "原始亚瓦纳迎接新亚瓦纳。"
 me_pentapotamia_21_desc:0 "他们称之为最远的亚历山大城。作为#E 亚历山大#!征服的极限，对我们而言，相对较近，至少相比之下，因此我们能更容易以我们的人民和文化资助其发展。让我们美化这座所谓的亚历山大最远之城。"
 me_pentapotamia_21_title:0 "$pentapotamia_missions_task_21$"
 me_pentapotamia_21_tooltip:0 "任务‘#Y $pentapotamia_missions_task_21$#!’现已#G 完成#!"
 me_pentapotamia_2_desc:0 "我们新生活方式的第一步是铭记根源。我们来自#E 信度#!河彼岸。赞助我们人民的艺术是确保民众我们不会背弃古老方式的好方法，仅是在文化遗产上增添。此外，我们不应忘记我们可怕的战象，据说在希腊世界中极为罕见。"
 me_pentapotamia_2_title:0 "$pentapotamia_missions_task_2$"
 me_pentapotamia_2_tooltip:0 "任务‘#Y $pentapotamia_missions_task_2$#!’现已#G 完成#!"
 me_pentapotamia_3.a:0 "所有人将认同我们的伟大。"
 me_pentapotamia_300.a:0 "我们是印度民族。"
 me_pentapotamia_300.b:0 "你可以称我们为希腊-印度人。"
 me_pentapotamia_300_desc:0 "在希腊化的希望中，我们必须自问……我们走多远？我们是印度希腊人还是希腊印度人？血统无关紧要，这是文化本身的问题。我们必须记住，文化可被采纳、改变和随时间演变。因此，以这种方式定义自己，在许多方面仅是象征性的……但仍是我们必须做出的决定。"
 me_pentapotamia_3_desc:0 "决定我们的文化是什么，极具澄清作用，有助于我们追求成为国家的目标。这延续到我们的行政，很快，所有人都将融入我们所决定的方向。"
 me_pentapotamia_3_title:0 "$pentapotamia_missions_task_3$"
 me_pentapotamia_3_tooltip:0 "任务‘#Y $pentapotamia_missions_task_3$#!’现已#G 完成#!"
 me_pentapotamia_4.a:0 "我们将保留当前信仰。"
 me_pentapotamia_4.b:0 "佛教；对我们而言完美信仰。"
 me_pentapotamia_4.c:0 "耆那教；甚至可能比佛教更适合。"
 me_pentapotamia_4.d:0 "阿耆维伽；马卡利是位先知。"
 me_pentapotamia_4.e:0 "吠陀；吠陀仍是最纯正的。"
 me_pentapotamia_4.f:0 "希腊；奥林匹斯诸神已降临。"
 me_pentapotamia_4_desc:0 "若有一个国家能宣称是“耶槃那罗阇”，那就是我们。虽然过去各种#E 印度-希腊#!国家自认为如此，但显然我们完美体现了这一概念。\n\n还有一块拼图我们尚未解决：宗教问题。#E 希腊人#!常发现与我们的#E 佛教#!有相似之处，但我们可拥抱#E 希腊#!或#E 印度#!领域的任何宗教。"
 me_pentapotamia_4_title:0 "$pentapotamia_missions_task_4$"
 me_pentapotamia_4_tooltip:0 "任务‘#Y $pentapotamia_missions_task_4$#!’现已#G 完成#!"
 me_pentapotamia_5.a:0 "永不忘罗阇波罗斯！"
 me_pentapotamia_5.b:0 "以我们的名义铭刻他的遗产。"
 me_pentapotamia_5_desc:0 "#E 波拉维德#!血脉在我们身上延续，无论我们是直接还是间接与之相关。事实是我们与#E 亚历山大#!的最强纽带通过#E 拉贾·波罗斯#!。他成为王中之王，类似总督。事实上，我们可宣称自己是合法的#E 继业者#!，是#E 亚历山大帝国#!的继承王国。的确是大胆之举，命运在召唤我们。"
 me_pentapotamia_5_title:0 "$pentapotamia_missions_task_5$"
 me_pentapotamia_5_tooltip:0 "任务‘#Y $pentapotamia_missions_task_5$#!’现已#G 完成#!"
 me_pentapotamia_6.a:0 "街区上的最新继承者。"
 me_pentapotamia_69.a:0 "如亚历山大，我们将在巴比伦用餐！"
 me_pentapotamia_69.b:0 "让我们沿幼发拉底河而下！"
 me_pentapotamia_69.c:0 "我们应沿底格里斯河而下！"
 me_pentapotamia_69.d:0 "为何迁都，我们留下！"
 me_pentapotamia_69_desc:0 "他们称之为最远的亚历山大城。作为#E 亚历山大#!征服的极限，对我们而言，相对较近，至少相比之下，因此我们能更容易以我们的人民和文化资助其发展。让我们美化这座所谓的亚历山大最远之城。"
 me_pentapotamia_69_title:0 "$pentapotamia_missions_task_21$"
 me_pentapotamia_6_desc:0 "#E 亚历山大#!对#E 印度#!的征服无疑促成我们的诞生。虽然我们没有#E 亚历山大#!的直接“血脉”，但我们确实由他的梦想所生。在宣称自己是#E 继业者#!国家时，明确这一事实至关重要。"
 me_pentapotamia_6_title:0 "$pentapotamia_missions_task_6$"
 me_pentapotamia_6_tooltip:0 "任务‘#Y $pentapotamia_missions_task_6$#!’现已#G 完成#!"
 me_pentapotamia_7.a:0 "我们有了证明，现在征服世界。"
 me_pentapotamia_7_desc:0 "作为一种概念证明，我们征服了整个#E 信度#!，或#E 印度#!，河谷。从#E 般阐那陀#!的中心到#E 信德#!的下游地区。现在，所有人将视我们为真正的继承国家！至少，我们国内所有人如此。其他继承国家现在定将视我们为敌。"
 me_pentapotamia_7_title:0 "$pentapotamia_missions_task_7$"
 me_pentapotamia_7_tooltip:0 "任务‘#Y $pentapotamia_missions_task_7$#!’现已#G 完成#!"
 me_pentapotamia_8.a:0 "到地球的尽头。"
 me_pentapotamia_8_desc:0 "#E 俄刻阿诺斯#!……这是#E 亚历山大#!从遥远的#E 马其顿#!故乡出发时想见之物。然而，我们身处他帝国终结之处。因此，我们想见#E 希腊人#!的#E 俄刻阿诺斯#!，世界另一端的海洋。于是我们踏上旅程；我们称之为#E 逆转俄刻阿诺斯#!的使命。\n\n我们必须谨慎，为达成此类征服，我们需追随#E 亚历山大#!的脚步。且需迅速，#E #R 在30年内，我们将面临严重后果#!#!……除非我们成功。"
 me_pentapotamia_8_title:0 "$pentapotamia_missions_task_8$"
 me_pentapotamia_8_tooltip:0 "任务‘#Y $pentapotamia_missions_task_8$#!’现已#G 完成#!"
 me_pentapotamia_9.a:0 "这里的每座城市都是亚历山大城！"
 me_pentapotamia_90.a:0 "两世界碰撞，新世界诞生。"
 me_pentapotamia_90_desc:0 "我们从#E 般阐那陀#!的中心成长，体验到我们边界内外称为#E 耶槃那#!的文化。我们未摧毁这些入侵者，他们成为我们接纳的文化。我们从中汲取许多影响，现在我们致力于创造独特的#E 五河之地#!文化。前方的使命将艰难，但我们仍愿启程。"
 me_pentapotamia_90_title:0 "般阐那陀崛起"
 me_pentapotamia_97.a:0 "这……还能挽救！"
 me_pentapotamia_97_desc:0 "世界似乎在我们周围终结。我们的文化？我们的遗产？我们的野心？如季初风暴前的劣质假面般崩塌。我们的#E 继业者#!宣称彻底丧失信誉，我们作为帝国复兴者的声誉完全毁坏。\n\n我们#E #R 未能#!#!在30年内达成#E 俄刻阿诺斯#!。"
 me_pentapotamia_97_title:0 "假面崩塌"
 me_pentapotamia_98.a:0 "新时代已开始。"
 me_pentapotamia_98_desc:0 "世界见证了亚历山大的征服，现在看到新现实。#E 印度-希腊#!领域的崛起。我们是下一个所有人将效仿的‘伟大’帝国。正如我们所言，我们称为#E 印度-希腊化#!或#E 亚瓦纳化#!的过程已在我们的土地上开始。\n\n我们#E #G 成功#!#!在30年内达成#E 俄刻阿诺斯#!。"
 me_pentapotamia_98_title:0 "第二次伟大征服"
 me_pentapotamia_9_desc:0 "在#E 亚历山大#!的旅途中，#E 奥克苏斯河谷#!确实是一片珍贵之地。居住着一系列文明，#E 亚历山大#!惊讶地发现已有#E 希腊人#!居住于此。走了如此远的路，却遇到说同种语言的人，定是奇迹。\n\n我们现已来到这些土地，以#E 继业者#!之名重新征服。从这里#E 希腊化#!传入#E 信度#!，现在我们回报他们，在通往#E 俄刻阿诺斯#!的支线旅途中引入#E 印度-希腊化#!。"
 me_pentapotamia_9_title:0 "$pentapotamia_missions_task_9$"

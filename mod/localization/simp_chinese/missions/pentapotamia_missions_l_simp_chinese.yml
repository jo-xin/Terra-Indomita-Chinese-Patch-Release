 pentapotamia_event_chain_start:0 "五河之地身份"
 pentapotamia_event_chain_start_desc:0 "随着#E 耶槃那#!，即#E 印度-希腊人#!的到来，统一的机会出现了。我们可能比最初意识到的有更多共同点。若选择这条思路，必将永远改变我们的轨迹。\n\n#R 你将失去独特任务树的访问权限。#!\n#G 你将获得新任务树的访问权限。#!"
 pentapotamia_event_tt:0 "#R 你将失去独特任务树的访问权限。#!\n#G 你将获得新任务树的访问权限。#!"
 pentapotamia_hellenic_integrated_tt:0 "任何#E 整合文化#!属于#Y 希腊#!文化组。"
 pentapotamia_missions:0 "逆转俄刻阿诺斯"
 pentapotamia_missions_BUTTON_TOOLTIP:0 "愿#E 亚历山大#!与#E 波罗斯#!祝福我们的遗产。"
 pentapotamia_missions_CRITERIA_DESCRIPTION:0 "当我们完成#E 逆转俄刻阿诺斯#!时，此使命将完成。"
 pentapotamia_missions_DESCRIPTION:0 "我们是一群矛盾的存在。#E 波罗斯#!之子遇上#E 亚历山大#!之子。#E 印度河#!之子遇上#E 爱琴海#!之子。我们不仅需要明确我们在世界中的身份，还要如何传承我们继承的双重遗产。一声低语回响，诉说一个新概念……#E 逆转俄刻阿诺斯#!。"
 pentapotamia_missions_task_1:0 "两河合一"
 pentapotamia_missions_task_10:0 "阿里亚纳的亚历山大城"
 pentapotamia_missions_task_10_DESC:0 "阿里亚纳的亚历山大城，抵达印度前的地区，因此是我们启动任务必须首先占领的地区。"
 pentapotamia_missions_task_11:0 "帕提卡的亚历山大城"
 pentapotamia_missions_task_11_DESC:0 "帕提卡的亚历山大城，里海地区。虽看似我们已找到#Y 俄刻阿诺斯#!，但这只是假象，我们还有更多路要走。"
 pentapotamia_missions_task_12:0 "破碎的远地"
 pentapotamia_missions_task_12_DESC:0 "除了#E 印度#!，亚历山大故乡最远的省份有#E 波斯#!、#E 阿里亚纳#!、#E 帕提亚#!、#E 巴克特里亚#!和#E 米底#!。它们现已破碎，但曾属亚历山大，将再次成为他最远继承王国的部分。"
 pentapotamia_missions_task_13:0 "穿越波斯之路"
 pentapotamia_missions_task_13_DESC:0 "穿越#E 波斯#!的行军是#E 亚历山大#!征服的标志性特征。我们必须穿越#E 革德罗西亚#!，然后#E 波斯#!必将沦陷！"
 pentapotamia_missions_task_14:0 "进军米底"
 pentapotamia_missions_task_14_DESC:0 "前往#E 米底#!之地的绕行路，是#E 亚历山大#!帝国的重要部分，拥有悠久的历史、文化和声誉。"
 pentapotamia_missions_task_15:0 "冲突的新月"
 pentapotamia_missions_task_15_DESC:0 "新月沃土地区拥有帝国四个最富饶的地区。黎凡特的#E 迦南#!和#E 叙利亚#!，以及东方的#E 亚述#!和#E 美索不达米亚#!。征服#E 巴比伦#!本身可能是#E 亚历山大#!征服的至高荣耀，此次将由我们之手再次夺取。"
 pentapotamia_missions_task_16:0 "两河之间"
 pentapotamia_missions_task_16_DESC:0 "#E 巴比伦#!、#E 乌鲁克#!、#E 苏萨#!、#E 阿舒尔#!等位于#E 波斯#!东方。这里是#E 亚历山大#!为其帝国新身份雄心的所在地，我们将以他的名义重新征服这些地区。"
 pentapotamia_missions_task_17:0 "仍未满足"
 pentapotamia_missions_task_17_DESC:0 "#Y 逆转俄刻阿诺斯#!已达成！……然而[ROOT.GetCountry.GetRuler.GetPraenomen|E]尚未满足。#E 亚历山大#!征服了#E 埃及#!、#E 安纳托利亚#!，当然还有#E 希腊#!和#E 马其顿#!。我们需要这些领土，才能真正感受#E 亚历山大#!的成就。"
 pentapotamia_missions_task_18:0 "俄刻阿诺斯达成"
 pentapotamia_missions_task_18_DESC:0 "我们的终极目标已达成。海的气息，遥远却熟悉。#E 亚历山大#!会为他最伟大的继承者的征服感到骄傲。#Y 逆转俄刻阿诺斯#!已完成。\n\n#G 我们不再面临崩溃#!。"
 pentapotamia_missions_task_19:0 "亚美尼亚群山"
 pentapotamia_missions_task_19_DESC:0 "#E 亚美尼亚#!的山区崎岖，令人想起故乡的#E 喜马拉雅山#!。征服它绝非易事，但如#E 亚历山大#!所为，我们亦然。"
 pentapotamia_missions_task_1_DESC:0 "我们的故事是两个民族的融合。我们既是入侵者，又非入侵者；既是本地人，又非本地人。我们是两种民族的折衷，若要正确统治，必须巩固这一理念。"
 pentapotamia_missions_task_2:0 "印度影响"
 pentapotamia_missions_task_20:0 "黎凡特之地"
 pentapotamia_missions_task_20_DESC:0 "叙利亚人、非利士人和腓尼基人的土地，还有更多。帝国的重要部分，连接我们与更广阔的俄刻阿诺斯世界。"
 pentapotamia_missions_task_21:0 "绝域亚历山大里亚"
 pentapotamia_missions_task_21_DESC:0 "亚历山大埃沙特，亚历山大征服的极限。对我们而言，它相对较近，因此我们能更容易以我们的人民和文化资助其发展。让我们美化这座所谓的亚历山大最远之城。"
 pentapotamia_missions_task_2_DESC:0 "若要说服臣民我们与他们血脉相连，我们必须拥抱我们的印度literal1印度方式。若无此举，他们定会将我们视为#E 信度河#!之地的又一入侵者。"
 pentapotamia_missions_task_3:0 "希腊化希望"
 pentapotamia_missions_task_3_DESC:0 "若要传承我们#E 希腊#!血脉的遗产，我们必须拥抱希腊方式。若无此举，对世界#E 希腊化#!势力的行动必将引发强烈反对。"
 pentapotamia_missions_task_4:0 "真正的耶槃那罗阇"
 pentapotamia_missions_task_4_DESC:0 "#E 希腊-印度#!王国，或称#E 耶槃那罗阇#!，曾是由#E 希腊-巴克特里亚人#!领导的实体，后来成为#E 印度-希腊人#!。我们的情况不同。我们既非入侵者，亦非本地人。我们是两者的混合，使我们成为真正的#E 耶槃那罗阇#!。"
 pentapotamia_missions_task_5:0 "波罗斯的血脉"
 pentapotamia_missions_task_5_DESC:0 "我们在#E 印度#!一侧直接源于他。他对抗最强大帝国的防御，赋予我们坚韧的意志。"
 pentapotamia_missions_task_6:0 "亚历山大之血"
 pentapotamia_missions_task_6_DESC:0 "虽非直接源于这位伟大征服者，但我们显然由他的征服而生。从他那里诞生了#E 希腊人#!在印度的理念。"
 pentapotamia_missions_task_7:0 "征服的证明"
 pentapotamia_missions_task_7_DESC:0 "为真正展现我们延续#E 波罗斯#!与#E 亚历山大#!的遗产，我们必须证明我们能征服整个#E 印度河谷#!。"
 pentapotamia_missions_task_8:0 "逆转俄刻阿诺斯"
 pentapotamia_missions_task_8_DESC:0 "#E 亚历山大#!曾有一个梦想，被#E 波罗斯#!所阻。这个梦想是#Y 俄刻阿诺斯#!。梦想是到达世界的另一端，到达海洋。\n\n现在我们身处世界的另一侧。我们的统治者[ROOT.GetCountry.GetRuler.GetPraenomen|E]形成了新的梦想，那是#Y 逆转俄刻阿诺斯#!；到达世界另一端的梦想。\n\n#R 逆转俄刻阿诺斯需在30年内达成，否则将面临后果。#!"
 pentapotamia_missions_task_9:0 "巴克特里亚的亚历山大城"
 pentapotamia_missions_task_9_DESC:0 "巴克特里亚的亚历山大城，充满#E 巴克特里亚人#!的广大地区，是#E 印度-希腊#!入侵的起点。他们将轻易被我们帝国同化为一省，如同亚历山大曾做到的一样。"

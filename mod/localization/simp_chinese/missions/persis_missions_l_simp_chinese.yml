l_simp_chinese:
 me_persis.160.a:0 "我们将给他们土地......暂时。"
 me_persis.160.b:0 "不可能！"
 me_persis.160.desc:0 "[GetCountry('PES').GetName]要求我们割让[GetProvince('(int32)4780').GetName]省给他们。我们的一些顾问说，这将是安抚我们的臣民的明智之举，因为有人说他们可能随时会起来反对我们的统治。"
 me_persis.160.desc2:0 "[GetCountry('PES').GetName]要求我们割让[GetProvince('(int32)4780').GetArea.GetName]的整个地区。许多人说，这将清楚地向世界展示我们的弱点。但也有人说这只会加强我们与[GetCountry('PES').GetName]的联系。"
 me_persis.160.t:0 "[GetCountry('PES').GetName]的要求"
 me_persis.161.a:0 "很光荣！"
 me_persis.161.b:0 "非常不幸。"
 me_persis.161.desc:0 "[GetCountry('SEL').GetName]明智地决定向我们的要求让步，将[GetProvince('(int32)4780').GetArea.GetName]的全部土地割让给我们。这使[GetCountry('PES').GetName]处于前所未有的有利地位，恢复波斯的梦想又近了一步......"
 me_persis.161.desc2:0 "[GetCountry('SEL').GetName]明智地决定接受我们的提议，将[GetProvince('(int32)4780').GetName]的领土割让给我们。这使[GetCountry('PES').GetName]处于前所未有的有利地位，恢复波斯的梦想又近了一步......"
 me_persis.161.desc3:0 "[GetCountry('SEL').GetName]愚蠢地决定拒绝我们割让[GetProvince('(int32)4780').GetArea.GetName]地区的提议。现在对此没有什么可做的，但他们会后悔这个决定......最终。"
 me_persis.161.desc4:0 "[GetCountry('SEL').GetName]已经愚蠢地决定拒绝我们的提议，将[GetProvince('(int32)4780').GetName]的领土让给我们。现在对此没有什么可做的，但他们会后悔这个决定......最终。"
 me_persis.161.t:0 "来自[GetCountry('SEL').GetName]的回应"
 me_persis_1.a:0 "我们未来的荣耀将使过去的耻辱黯然失色"
 me_persis_10.a:0 "我们是世界上最好的工匠，这一点没错"
 me_persis_10_desc:0 "今天早上有更多的好消息要与大家分享；我们的奴隶和田地都很有成效，我们在国外市场上获得了出口质量优异的商品的声誉。人们愿意为[SCOPE.GetRootScope.GetCountry.GetName]生产的精美物品支付高价，而我们也非常乐意接受他们的钱币。"
 me_persis_10_title:0 "$persis_mission_1_freedom_task_10$"
 me_persis_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_10$#!' $mission_completed_tooltip_2$"
 me_persis_11.a:0 "我们并不太担心我们的将军们......"
 me_persis_11_desc:0 "我们已经建立了名为长生军的精锐军事部队的消息开始传播；甚至现在，他们正在 [GetProvince('(int32)4799').GetName] 的城墙外演练，练习和熟悉曾多次带领他们取得胜利的古老战斗阵型。\n\n当战斗不可避免地降临到长生军身上时，我们期望我们的重步兵能粉碎对方的部队，对敌人毫不留情；这将是我们留给后人的遗产。"
 me_persis_11_title:0 "$persis_mission_1_freedom_task_11$"
 me_persis_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_11$#!' $mission_completed_tooltip_2$"
 me_persis_13.a:0 "让我们看看他们是否买账......"
 me_persis_13_desc:0 "尽管我们的邻国对我们公开采取措施确保边界安全感到不满，但我们向周围的人保证，我们只是在寻求保护我们的祖国——我们不寻求与任何人发生冲突，而是希望扩大我们的合作机会。"
 me_persis_13_title:0 "$persis_mission_1_freedom_task_13$"
 me_persis_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_13$#!' $mission_completed_tooltip_2$"
 me_persis_14.a:0 "我们绝不能忽视我们的海军，即使是在建设军队的同时"
 me_persis_14_desc:0 "我们必须感谢 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 指示将[GetProvince('(int32)4791').GetName] 和 [GetProvince('(int32)4956').GetName] 的港口建设成今天的样子。由于 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 表现出的智慧和远见，我们的整个海军能力已经发展到了前所未有的状态--我们将能够以前所未有的速度建造战舰。"
 me_persis_14_title:0 "$persis_mission_1_freedom_task_14$"
 me_persis_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_14$#!' $mission_completed_tooltip_2$"
 me_persis_15.a:0 "我们的舰队将粉碎任何反对他们的人"
 me_persis_15_desc:0 "任何与波斯湾海岸线相邻的其他国家现在都必须与我们的海军力量抗衡，因为我们已经向航行距离内的所有人表明，我们认为这些水域是我们自己的。没有我们的批准，我们不允许在我们的后院发生任何事情，这条规则显然延伸到了海洋和陆地。"
 me_persis_15_title:0 "$persis_mission_1_freedom_task_15$"
 me_persis_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_15$#!' $mission_completed_tooltip_2$"
 me_persis_16.a:0 "要求[GetProvince('(int32)4780').GetArea.GetName]"
 me_persis_16.b:0 "要求[GetProvince('(int32)4780').GetName]"
 me_persis_16_desc:0 "现在，我们已经有能力表明我们的愿望，已经决定我们将向 [GetCountry('SEL').GetName] 发出最后通牒。简单地说，我们必须控制我们历史上的家园，并愿意通过战争来实现这些宣称。\n\n有些顾问要求我们要求整个马尔迪尼省，但其他人认为这种做法太贪婪，并表示我们应该只要求马尔加斯塔纳市，或我们所知的阿拉干——选择将由[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定。"
 me_persis_16_title:0 "$persis_mission_1_freedom_task_16$"
 me_persis_16_tooltip:0 "要求#Y [GetCountry('SEL').GetName]#!割让#Y [GetProvince('(int32)4780').GetArea.GetName]#!给#Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 me_persis_16_tooltip_B:0 "只问#Y [GetCountry('SEL').GetName]#!对#Y [GetProvince('(int32)4780').GetName]#!"
 me_persis_17.a:0 "这是一个多么出色的想法！"
 me_persis_17_desc:0 "现在我们在皇家道路上的工作已经完成，整个[SCOPE.GetRootScope.GetCountry.GetName]都会受益；不仅我们的军队和外交官的旅行时间会大大缩短，而且整个国家的贸易联系也只会继续改善。"
 me_persis_17_title:0 "$persis_mission_1_freedom_task_17$"
 me_persis_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_17$#!' $mission_completed_tooltip_2$"
 me_persis_18_title:0 "$persis_mission_1_freedom_task_18$"
 me_persis_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_18$#!' $mission_completed_tooltip_2$"
 me_persis_19.a:0 "我们的人民有充分的理由欢欣鼓舞"
 me_persis_19_desc:0 "通过[SCOPE.GetRootScope.GetCountry.GetName]召集了一段庆祝活动，在我们中心地带新设的首都举行了盛大的游行。感谢我们的建筑师，他们巧妙地加固了我们现有的防御工事，我们城镇的公民感到比以往任何时候都更安全，相信高耸的城墙将保护他们免受军队的入侵。"
 me_persis_19_title:0 "$persis_mission_1_freedom_task_19$"
 me_persis_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_19$#!' $mission_completed_tooltip_2$"
 me_persis_1_desc:0 "当我们回忆起波斯波利斯城的美丽，回忆起它绿树成荫的街道和让人心旷神怡的芬芳花园时，当我们想到它的现状时，我们的眼睛里充满了苦涩和愤怒的泪水。那些马其顿的野蛮人以为他们可以用火和死亡抹去我们的遗产，但他们的暴行只巩固了我们重建波斯波利斯的愿望。\n\n现在是恢复我们古代荣耀的时候了，全世界都会知道，波斯将不再沉睡。"
 me_persis_1_title:0 "$persis_mission_1_freedom_task_1$"
 me_persis_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_1$#!' $mission_completed_tooltip_2$"
 me_persis_2.a:0 "感谢你们，老朋友们"
 me_persis_20.a:0 "愿我们成为世界之光......"
 me_persis_20_desc:0 "最后，我们从马其顿人的奴役中解脱出来，将束缚的枷锁打成碎片。我们现在是几代人以来第一次用自己的双脚站立起来，脖子上没有锁链，手腕上没有镣铐。\n\n让我们在众神的帮助下迎接这个重要的时刻，愿阿胡拉马兹达继续愿意将他的祝福赐予我们的人民。\n\n波斯王国已经回来了。"
 me_persis_20_title:0 "$persis_mission_1_freedom_task_20$"
 me_persis_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_20$#!' $mission_completed_tooltip_2$"
 me_persis_21.a:0 "的确，我们真的很感谢我们所收到的礼物"
 me_persis_21_desc:0 "因为[GetProvince('(int32)4799').GetName]已经成为我国大多数主要贵族家庭的家园，我们发现整个国家都在从这个幸福的环境中受益。他们在我们首都的存在只会促进我们的稳定和长期发展......我们应该心存感激。"
 me_persis_21_title:0 "$persis_mission_1_freedom_task_21$"
 me_persis_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_21$#!' $mission_completed_tooltip_2$"
 me_persis_22.a:0 "愿诸神发现我们值得继续祝福！"
 me_persis_22_desc:0 "由于 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 为恢复穆护在社会中的地位所付出的个人努力，我们的领袖正在受到普通人的庆祝。\n\n全国各地都在进行临时的宗教庆祝活动，我们整个王国的圣火都得到了照顾，并向胡拉马兹达祈祷感恩。"
 me_persis_22_title:0 "$persis_mission_1_freedom_task_22$"
 me_persis_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_22$#!' $mission_completed_tooltip_2$"
 me_persis_23.a:0 "我们的文化，就像被风吹动的熊熊烈火，不受控制地蔓延......"
 me_persis_23_desc:0 "虽然我们的文化在很长一段时间内遭受了巨大的痛苦，有些人甚至认为我们最好的日子已经过去，波斯文明的光芒将永远熄灭，但我们已经向整个世界证明，人们永远不应该与[SCOPE.GetRootScope.GetCountry.GetName]打赌，因为我们有能力实现其他国家只能梦想的宏伟壮举。\n\n派骑手到地球的各个角落，宣布我们的时代已经开始--所有人都将在重生的波斯权威面前跪拜！"
 me_persis_23_title:0 "$persis_mission_1_freedom_task_23$"
 me_persis_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_23$#!' $mission_completed_tooltip_2$"
 me_persis_2_desc:0 "在过去的日子里，波斯人和乌克西人被称为兄弟，相互支持彼此，即使这些记忆是遥远的，但他们并没有被遗忘。\n\n根据这些曾经的回忆，我们已经向我们的朋友乌克西人派出了一个特使，要求他们记住他们过去的誓言。您会很高兴的， [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们将听到他们的忠实的回复——他们没有忘记誓言。"
 me_persis_2_title:0 "$persis_mission_1_freedom_task_2$"
 me_persis_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_2$#!' $mission_completed_tooltip_2$"
 me_persis_4.a:0 "素拉万是一把指向[GetCountry('SEL').GetName]心脏的匕首"
 me_persis_4_desc:0 "多么美好的一天！我们的工程师终于在[GetProvince('(int32)4782').GetName]完成了施工，拆掉了棚户区的建筑，取而代之的是砖石构造的永久性建筑。这一举措不仅能确保该区域的经济繁荣，而且我们的军队也将从中受益——我们现在在马尔迪尼省拥有一个为我们提供战略优势的位置。"
 me_persis_4_title:0 "$persis_mission_1_freedom_task_4$"
 me_persis_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_4$#!' $mission_completed_tooltip_2$"
 me_persis_5.a:0 "当我看到需要做的事情时，我就去做"
 me_persis_5_desc:0 "我们通过使我们的城市 [GetProvince('(int32)4951').GetName] 规模篇的爆炸性增长，按照我们事先决定的方向塑造它，目前看来做得很好。由于我们在这个城市所做的努力，越来越多的人前往那里，希望在这个古老的地方扬名立万——多么出色的工作，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。"
 me_persis_5_title:0 "$persis_mission_1_freedom_task_5$"
 me_persis_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_5$#!' $mission_completed_tooltip_2$"
 me_persis_6.a:0 "重大的消息......总有一天我们将亲自访问卡泽伦"
 me_persis_6_desc:0 "我们的建筑师向我们报告，[GetProvince('(int32)4781').GetName]的工作已经完成，由于我们扩大了城市中的住宅区，卡泽伦是个好地方的消息正在传播。值得庆幸的是，我们确信每个人都有空间，这要感谢[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在与我们的工程师绘制设计图时表现出来的细心。我们不知道这种好日子会持续多久！"
 me_persis_6_title:0 "$persis_mission_1_freedom_task_6$"
 me_persis_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_6$#!' $mission_completed_tooltip_2$"
 me_persis_7.a:0 "贵族们在把握机会后将赚的盆满钵满"
 me_persis_7_desc:0 "您会很高兴地听到，由于我们为重建我们腹地所付出的努力，我们的经济正在蓬勃发展，我们所获得的贸易收入看起来绝对是荒谬的——这确实超出了我们最贪婪的期望。由于感觉到有机会增长自己的财富，我们国家的许多主要商业巨头都在前往该地区首府，建立自己的商铺。"
 me_persis_7_title:0 "$persis_mission_1_freedom_task_7$"
 me_persis_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_7$#!' $mission_completed_tooltip_2$"
 me_persis_8.a:0 "天天都有好消息"
 me_persis_8_desc:0 "我们很高兴地报告，一条连接[GetProvince('(int32)4799').GetName]和[GetProvince('(int32)4956').GetName]的道路已经建成。正如我们的经济顾问所预测的那样，道路连接这两个城市的结果是财富源源不断地涌入我们的国库。摆渡到Portsopana的丰富贸易货物现在比以前更快到达帕尔萨——我们所投资的一切正在得到回报！"
 me_persis_8_title:0 "$persis_mission_1_freedom_task_8$"
 me_persis_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_8$#!' $mission_completed_tooltip_2$"
 me_persis_9.a:0 "这个地区还有更多的事要做"
 me_persis_9_desc:0 "令人高兴的是，我们已经收到消息，[GetProvince('(int32)4956').GetName] 的新建筑被喜出望外的民众所接受，他们已经在利用扩大的商业区。\n\nPortospana的鱼市因每天提供的各种新鲜渔获而变得远近闻名，许多人在太阳升起之前就前往市场，以便为自己购买最好的鲜鱼。"
 me_persis_9_title:0 "$persis_mission_1_freedom_task_9$"
 me_persis_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $persis_mission_1_freedom_task_9$#!' $mission_completed_tooltip_2$"
 persis_mission_1_freedom:0 "波斯人的追求"
 persis_mission_1_freedom_BUTTON_TOOLTIP:0 "当他们沉湎于傲慢中，那些试图奴役我们的人将被彻底摧毁。"
 persis_mission_1_freedom_CRITERIA_DESCRIPTION:0 "当我们把外来的干涉者从我们的家园驱逐出去，并重新建立起波斯的权柄时，该使命完成。"
 persis_mission_1_freedom_DESCRIPTION:0 "波斯的历史丰富多彩；这个故事似乎在每一次的复述中都在增长。正是这个地区诞生了阿契美尼德王朝，他们在遭受马其顿野蛮人失败的耻辱之前，给世界带来了文明之光。那些认为波斯最好的日子已经过去的人没有注意到预兆；诸神为我们准备了很多。"
 persis_mission_1_freedom_task_1:0 "重建波斯波利斯"
 persis_mission_1_freedom_task_10:0 "建立天堂"
 persis_mission_1_freedom_task_10_DESC:0 "通过提高我们种植粮食和制造贸易商品的能力，我们将刺激全国的经济，从而使所有人受益——让我们在整个国家引导投资，把天堂带到大地。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 persis_mission_1_freedom_task_10_tt:0 "拥有五个农场或奴隶庄园"
 persis_mission_1_freedom_task_11:0 "重建长生军"
 persis_mission_1_freedom_task_11_DESC:0 "曾经，被称为长生军的精锐军事部队让阿契美尼德的敌人感到恐惧和害怕，但他们已经销声匿迹多年。现在我们有能力这样做，我们必须把这支宏伟的军团重新引入我们自己的军队。\n\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 persis_mission_1_freedom_task_12:0 "威胁殖民地"
 persis_mission_1_freedom_task_13:0 "加固关隘"
 persis_mission_1_freedom_task_13_DESC:0 "不放过任何机会，我们将加固我们所有重要的文明中心的防御设施，因为我们已经努力奋斗到现在，不可能不战而屈人之兵。\n\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 persis_mission_1_freedom_task_14:0 "建设港口"
 persis_mission_1_freedom_task_14_DESC:0 "波斯湾的水域是我们人民的命脉，我们不能忽视我们的出海口。应该下达命令，建设我们的港口，使我们的船工能够获得建造海军的经验。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 persis_mission_1_freedom_task_15:0 "控制海湾"
 persis_mission_1_freedom_task_15_DESC:0 "谁能在波斯湾水域挑战我们的力量？难道我们没有控制一支庞大而强大的，能在遥远的陆地上执行我们的意志的舰队？\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 persis_mission_1_freedom_task_15_tt:0 "在波斯湾沿岸有省份的国家没有一个拥有比#Y [ROOT.GetCountry.GetName]#!更多的船只"
 persis_mission_1_freedom_task_16:0 "要求马尔迪尼"
 persis_mission_1_freedom_task_16_DESC:0 "我们必须告诉[GetCountry('SEL').GetName]，我们会为了马尔迪尼省而战斗到死，他们必须立即投降，否则就要面对我们的军队。\n\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 persis_mission_1_freedom_task_16_tt:0 "要求#Y [GetCountry('SEL').GetName]#!割让#Y [GetProvince('(int32)4780').GetArea.GetName]#!给#Y [SCOPE.GetRootScope.GetCountry.GetName]#!"
 persis_mission_1_freedom_task_17:0 "延长皇家大道"
 persis_mission_1_freedom_task_17_DESC:0 "皇家大道是该地区的最高成就之一，从我们任何人的记忆中都可以看出，它连接着贸易和文明中心。现在，我们是这样一个重要的基础设施的管理者，我们应该采取措施，在我们能做到的地方尽可能延长道路。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 persis_mission_1_freedom_task_17_tt:0 "[ROOT.GetCountry.GetName.GetCapital.GetArea.GetRegion.GetName]至少有#Y 20#!个领土被道路连接。"
 persis_mission_1_freedom_task_18:0 "扩编军队"
 persis_mission_1_freedom_task_19:0 "加固首都"
 persis_mission_1_freedom_task_19_DESC:0 "通过在全国范围内努力加强我们现有的防御工事，我们将准备好应对任何事情——我们的军队将坚定地站在战场上，他们的背后便是波斯铁壁。\n\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 persis_mission_1_freedom_task_1_DESC:0 "野蛮人在酩酊大醉中摧毁了波斯波利斯，将其烧成灰烬；他们可能摧毁了这座城市，但我们的梦想是无法熄灭的。今天，我们把我们的愿景变成了现实。\n\n\n\n\n\n\n\n\n\n@persia_mil5!"
 persis_mission_1_freedom_task_2:0 "向乌克西人伸出援手"
 persis_mission_1_freedom_task_20:0 "摆脱伊奥尼亚的枷锁"
 persis_mission_1_freedom_task_20_DESC:0 "我们终于战胜了诡计多端的马其顿人和他们强制的奴役——我们打倒了以前的主子，解放了自己！世界上的国王们为波斯重登世界舞台而颤抖！\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 persis_mission_1_freedom_task_21:0 "神佑的指挥官"
 persis_mission_1_freedom_task_21_DESC:0 "贵族的财富和天赋能力为他们提供了贫困阶层所没有的机会。这种优雅的氛围让我们的贵族可以追求专门的爱好，比如书写历史，我们领导阶层的成长是一个明显的标志，神明保佑他们成为我们的指挥官。\n\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 persis_mission_1_freedom_task_22:0 "资助穆护"
 persis_mission_1_freedom_task_22_DESC:0 "如果我们采取措施资助穆护，不仅人民会高兴，而且我们的统治者个人也会受益——这更有理由这样做。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 persis_mission_1_freedom_task_23:0 "重建波斯文化"
 persis_mission_1_freedom_task_23_DESC:0 "现在我们有能力这样做，我们应该在外国人颠覆现状之前恢复我们的波斯文化在社会中所享有的卓越地位。\n\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 persis_mission_1_freedom_task_2_DESC:0 "我们的人民和乌克西人之间有许多联系；我们有许多共同的宗教和文化习俗，以至于许多外国人无法区分我们之间的区别。我们应该重塑这些古老的纽带。\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 persis_mission_1_freedom_task_4:0 "素拉万城市化"
 persis_mission_1_freedom_task_4_DESC:0 "就目前的情况来看，我们马尔迪尼省的首府的规模配不上它的地位，它只不过是一个单纯的定居点。我们对这一地区有着周密的计划，所以我们应该在可能的情况下，尽一切努力使素拉万城市化。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 persis_mission_1_freedom_task_5:0 "美化巴特拉卡塔什"
 persis_mission_1_freedom_task_5_DESC:0 "当人们离开帕尔萨，沿着大道向北走时，不到几周就能看到气势恢宏，曾经被称为巴特拉卡塔什的山城帕特拉加达。当我们依靠这座古城的防御工事来保护我们的首都时，我们可以采取措施使其成为一个文化中心。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 persis_mission_1_freedom_task_6:0 "扩展卡泽伦"
 persis_mission_1_freedom_task_6_DESC:0 "我们城市的实力直接关系到我们的独立前景；我们不能忽视任何东西，否则就是公开招致灾难。考虑到它对我们努力的重要性，卡泽伦应该扩展规模！\n\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 persis_mission_1_freedom_task_7:0 "恢复腹地经济"
 persis_mission_1_freedom_task_7_DESC:0 "黄金是润滑战争引擎的油脂，我们必须确保我们的腹地能够承受我们即将施加在它身上的巨大的经济压力。现在是需要支持我们财政资源的时候了。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 persis_mission_1_freedom_task_8:0 "连接基什"
 persis_mission_1_freedom_task_8_DESC:0 "基什港是我们通往波斯湾的窗口；每天都有船只从Bushahr向南驶向我们在海岸的前哨。有人建议我们把皇家道路延伸到这个城市，这样我们就不会完全依赖我们的海军了。\n\n\n\n\n\n\n\n\n\n\n@persia_mil3!"
 persis_mission_1_freedom_task_9:0 "基什的城市化"
 persis_mission_1_freedom_task_9_DESC:0 "[GetProvince('(int32)4956').GetName]的有利位置要求我们尽一切努力使该地区城市化，将该定居点变成一个有适当人口的城市。我们在这里取得的成就会被传为佳话，许多人都想亲眼看看这个新的城镇。\n\n\n\n\n\n\n\n\n\n\n@event_pic3!"

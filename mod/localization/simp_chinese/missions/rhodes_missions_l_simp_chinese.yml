 me_rhodes.30.b:0 "拥抱我们的罗得岛遗产"
 me_rhodes.31.a:0 "佩拉伊亚将是我们的!"
 me_rhodes.31.tt:0 "开始对#Y [GetProvince('(int32)1876').GetArea.GetName]#!伪造宣称"
 me_rhodes.32.a:0 "伊奥尼亚将是我们的!"
 me_rhodes.32.tt:0 "开始对#Y [GetProvince('(int32)290').GetArea.GetName]#!伪造宣称"
 me_rhodes.34.a:0 "[legion_of_rhodes.GetName]将取得胜利!"
 me_rhodes.37.a:0 "拉科尼亚"
 me_rhodes.37.b:0 "亚该亚"
 me_rhodes.37.c:0 "阿卡迪亚"
 me_rhodes.38.a:0 "民主是唯一的途径"
 me_rhodes.38.b:0 "我们可以探索其他替代方案..."
 me_rhodes.39.a:0 "#Y [GetCountry('RHO').GetRuler.GetName]#! 将使罗得岛走向辉煌!"
 me_rhodes.4.a:0 "寻找一些买家"
 me_rhodes.4.b:0 "将它们整合到军队中"
 me_rhodes.4.c:0 "研究他们的建造方法"
 me_rhodes.4.d:0 "将其分解为建筑材料"
 me_rhodes.5.a:0 "一个人的垃圾就是另一个人的财富"
 me_rhodes.5.b:0 "我们的军队比以前更强大了"
 me_rhodes.5.c:0 "我们对这些武器有了更多的了解--这真是一个明智的决定。"
 me_rhodes.5.d:0 "德米特里欧斯试图用这些木材和石头摧毁我们的城市，但我们将用它来美化罗得岛"
 me_rhodes.6.a:0 "[GetCountry('RHO').GetRuler.GetName]将支付这笔费用"
 me_rhodes.6.b:0 "挖掘国库"
 me_rhodes.6.c:0 "敲诈党的领导人"
 me_rhodes.7.a:0 "辉煌的!"
 me_rhodes.8.a:0 "倡导他们的独立"
 me_rhodes.8.b:0 "发出成为藩属国的提议"
 me_rhodes.8.c:0 "我们不需要他们!"
 me_rhodes.9.a:0 "鼓动他们独立"
 me_rhodes.9.b:0 "发出成为藩属国的提议"
 me_rhodes.9.c:0 "我们不需要他们!"
 me_rhodes_10_desc_1:0 "我们去科斯的使者带着好消息回来了；他们同意了我们的建议，并宣布独立于托勒密的控制。缓慢但肯定的是，我们将从我们的水域中消除所有其他的竞争对手。"
 me_rhodes_10_desc_2:0 "科斯的答复天真得令人发笑；他们以成为托勒密的走狗为荣，满足于他们的奴役。事实上，他们一旦知道我们在那里的目的，就命令我们的大使馆立即离开该岛。荒唐的行为!"
 me_rhodes_10_title:0 "科斯的独立"
 me_rhodes_11_desc_1:0 "派往科斯的使团已经回到宫廷。当你看见他们满面笑容时，也不由得露出微笑。一切都是好消息；他们毫不迟疑地接受了我们的提议。他们将成为我们的藩属，诸神眷顾着我们！"
 me_rhodes_11_desc_2:0 "从今早顾问们畏缩的神情便能看出，他们带来的消息绝不会令人愉快。照例寒暄几分钟后，你不耐烦地挥手，要求他们直奔主题。“科斯人……拒绝了我们的提议。”"
 me_rhodes_11_title:0 "科斯。科斯的问题"
 me_rhodes_12_desc_1:0 "我们派往克尼多斯的使团传回了好消息：他们已经决定追寻自己的命运，并同意将安提柯驻军逐出城市。这是我们取得的一项惊人外交成就。"
 me_rhodes_12_desc_2:0 "克尼多斯的回复带着几分令人不悦的倨傲——不过对这些狂妄之徒，本就不该抱有任何期待。他们非但不谋求独立，反倒甘愿继续充当安提柯的鹰犬。"
 me_rhodes_12_title:0 "克尼多斯的独立"
 me_rhodes_13_desc_1:0 "长街短巷处处可闻阿夫洛斯管的欢奏、鼎沸笑语与狄俄尼索斯式的纵情狂欢。[ROOT.GetCountry.GetRuler.GetName]对此毫不诧异——子民们确有万千理由欢欣鼓舞：邻邦克尼多斯已应允臣服，今夜双岛同庆。我们正共同迈入繁荣新纪元。"
 me_rhodes_13_desc_2:0 "来自克尼多斯的回应是令人陶醉的甜言蜜语，香喷喷的废话，掩盖了话语的空洞性。虽然他们似乎掌握了宫廷错综复杂的艺术，但不幸的是，他们不知道一个好主意，当他们看到它。他们不会成为我们的藩属。"
 me_rhodes_13_title:0 "克尼多斯：一个新的附庸"
 me_rhodes_14_desc:0 "来自罗德岛的使团带着一项无礼要求来到你的宫廷，但你仍同意听他们陈述。这些人高估了自身地位，要求我们放弃在科斯岛的利益，声称那里属于他们自己的势力范围。我们该如何回答？"
 me_rhodes_14_title:0 "来自罗德岛的提议"
 me_rhodes_15_desc:0 "来自罗得岛的使团已经抵达我们的港口，他们的船上满载着精美的货物和华丽的礼物，让人眼花缭乱，钱袋也变得轻盈。如果我们同意加入他们的霸权，成为他们的藩属，他们就会向我们承诺所有这些财富和更多的东西。你怎么看？"
 me_rhodes_15_title:0 "来自罗得岛的提议"
 me_rhodes_16_desc:0 "来自罗德岛的使团带着一项无礼要求来到你的宫廷，但你仍同意听他们陈述。这些人高估了自身地位，要求我们放弃在克尼多斯岛的利益，声称那里属于他们自己的势力范围。我们该如何回应？"
 me_rhodes_16_title:0 "来自罗得岛的提议"
 me_rhodes_17_desc:0 "来自罗得岛的使团已经抵达我们的港口，他们的船满载着精美的货物和华丽的礼物，让人眼花缭乱，钱袋也变得轻盈。他们说，如果我们同意加入他们的霸权，成为他们的藩属，所有这些财富和更多的东西都可以是我们的。我们该对他们说什么呢？"
 me_rhodes_17_title:0 "来自罗得岛的提议"
 me_rhodes_18_desc:0 "我们应该考虑提升林多斯省的地位，因为它对罗德斯城本身越来越重要了。这证明了我们强大的城市日益强大；我们必须利用腹地，确保尽可能多地开发我们的岛屿。"
 me_rhodes_18_title:0 "林多斯的问题"
 me_rhodes_19_desc:0 "虽然林多斯地区因其生产的各种葡萄酒而闻名，但如果我们愿意的话，我们还可以在这个肥沃的地区生产其他类型的商品。我们是否应该考虑改变那里生产的东西？"
 me_rhodes_19_title:0 "林多斯的贸易商品"
 me_rhodes_1_desc:0 "我们与[GetCharacter('(int32)42').GetName]的商业联系，正是安提柯王国围攻我们故土的原因。罗德岛围城期间，[GetCharacter('(int32)42').GetName]甚至派出一支五百人的小部队，经由港口进入罗德岛支援我军。我们与埃及关系极为密切，但这些联系仍只是非正式的。有人提议，我们应准备一份请求送往[GetCharacter('(int32)42').GetName]，要求双方正式结盟。"
 me_rhodes_1_title:0 "埃及的纽带"
 me_rhodes_20_desc:0 "虽然我们目前与克里特岛保持着热烈的关系，但最近宫廷里有人建议我们扩大对他们的影响。我们可以走寻常路，四处散播一些银子，或者我们可以尝试外交手段，节省一些硬币。但也许这毕竟是个坏主意......我们应该怎么做？"
 me_rhodes_20_title:0 "克里特人的关系。向[crete_ally_country.GetName]发出提议"
 me_rhodes_21_desc:0 "黎明时分，一支庞大舰队出现在普莱索斯海岸外，其骄傲纹章在清晨阳光中熠熠生辉，正是罗德。数小时后，他们的使团站到你面前，提出一个礼貌却坚定的请求：他们询问我们是否愿意正式成为其附属，以扩展双方关系。他们等待你的答复，随后便会立刻启航返乡。"
 me_rhodes_21_title:0 "来自罗得岛的提议"
 me_rhodes_22_desc_1:0 "你的直觉和政治手腕再次取得回报：你的使团已经从克里特返回，他们同意成为我们的附属国。我们的力量正在逐步增长，我们势不可挡。"
 me_rhodes_22_desc_2:0 "我们派往克里特的使团已经返回。克里特人不仅送来了问候，还附赠了几大罐当地美酒和岛上最美味的橄榄。可惜，这就是我们能得到的全部了——他们礼貌地回绝了我们的请求。"
 me_rhodes_22_title:0 "克里特人的关系。来自[crete_ally_country.GetName]的答复"
 me_rhodes_23_desc:0 "我们的商人带回的金银与年俱增，各条财源正汇聚成滔滔洪流，托举着整个国家奔腾向前。理当将这些财富再投资于缔造富庶的舰队——扩充船队规模，坐观财源滚滚而来。"
 me_rhodes_23_title:0 "一支商船"
 me_rhodes_24_desc:0 "罗德岛在我们的统治下繁荣昌盛，这得益于[ROOT.GetCountry.GetRuler.GetName]卓越的掌舵能力——[ROOT.GetCountry.GetRuler.GetSheHe]引领着国家这艘航船穿越惊涛骇浪。但现在绝不是躺在功劳簿上休息的时候，相反，我们更应乘势而上！让我们通过加强海军舰队来确保对海洋的绝对掌控。"
 me_rhodes_24_title:0 "一支军事海军"
 me_rhodes_26_desc:0 "我们终于成功完成了海军重组，并争取到一位名叫#Y 阿格辛布罗图斯#!的天生统帅为我们效力。将士们不仅认可我们的选择，也因他的到来而更加振奋，士气愈发高昂。愿我们的敌人颤抖吧。"
 me_rhodes_26_title:0 "一个重组的海军"
 me_rhodes_27_desc:0 "一场大灾难！我们收到了一个可怕的消息，有一场叛乱，一个我们目前难以承受的叛乱!我们的海军中有相当一部分人拒绝我们的命令，并拿起武器反对我们......这些该死的叛徒!"
 me_rhodes_27_title:0 "一场海军政变！"
 me_rhodes_28_desc:0 "#Y 阿格辛布罗图斯#!向我们提出了一项大胆而坦率得诱人的建议。毫无疑问，他希望在海军史册中赢得不朽名声，因此请求获准向我们在海上的最亲近竞争者[naval_hegemony_victim.GetName]开战。若我们批准这一行动，我们将真正成为无可争议的浪潮之主。要让他继续推进吗？"
 me_rhodes_28_title:0 "海军霸权"
 me_rhodes_29_desc:0 "我们刚刚完成吕基亚地区的建设运动，当地一些古老贵族便带着提议前来。他们是骄傲的民族，传统与我们一样古老，并谦卑请求通过成为藩属国来保留自己的身份。我们应当将他们作为藩属释放，还是继续让他们成为我们所认为的罗德的一部分？"
 me_rhodes_29_title:0 "一个藩属还是一个新国家？"
 me_rhodes_2_desc:0 "罗德岛最近击退了由[GetCharacter('(int32)38').GetName]率领的安提柯大军入侵。我们与罗德岛密切的商业联系，正是这场入侵最初的起因。几乎可以肯定，如果我们不设法保护罗德岛，他们终将被并入安提柯王国。一名罗德岛外交官带着结盟提议来到我们面前；我们该如何回应？"
 me_rhodes_2_title:0 "罗德岛。一个结盟提议"
 me_rhodes_30_desc:0 "从卑微的开始，我们已经扩大并成长为一个在我们的舰队所能到达的每个港口城市都被认可和承认的力量。我们是无可争议的爱琴海的主人，在我们的水域没有任何事情是我们不允许发生的。法庭上有人提议我们通过组建联盟来接受我们的新身份，但其他人说没有这个必要。你怎么说？"
 me_rhodes_30_title:0 "爱琴海联盟"
 me_rhodes_31_desc:0 "卡里安人不仅是我们的近邻，也是古老的敌人--他们征服并统治了我们近20年。现在我们有能力纠正过去的错误，我们应该开始为我们的荣誉复仇--通过夺取他们的土地。"
 me_rhodes_31_title:0 "罗地亚的佩拉亚"
 me_rhodes_32_desc:0 "士麦那。希俄斯。萨摩斯。以弗所。普里尼。五个富裕城市的名单，作为富饶的伊奥尼亚地区的经济引擎。如果我们能够将我们的控制权扩展到这个地区，我们的威望和权力将是不可否认的。"
 me_rhodes_32_title:0 "伊奥尼亚人"
 me_rhodes_34_desc:0 "我们的海军力量是毋庸置疑的，但没有多少人知道我们在陆地上也是一支强大的战斗力。如果我们建立起我们的军团，我们敌人的军队将在我们面前崩溃。"
 me_rhodes_34_title:0 "罗德斯军团"
 me_rhodes_37_desc:0 "由于你对诸城的谨慎治理，伯罗奔尼撒的税收格外丰厚。你的宫廷中满是旅人，他们赞美这里的城镇变得何等美丽。然而，我们仍有继续作为的空间；可以选择一个省份高于其他地区加以扶持，使这些土地比现在更加繁荣。哪一片地区应当接受我们的恩惠？"
 me_rhodes_37_title:0 "伯罗奔尼撒的繁荣"
 me_rhodes_38_desc:0 "在[GetCountry('RHO').GetRuler.GetName]的统治下，一个新的时代确实改变了罗得西亚社会。虽然我们无疑是这些变化时代的受益者，但也有一些声音说我们已经超越了我们的起点。我们是否应该允许这种改革政府制度的言论继续下去？"
 me_rhodes_38_title:0 "一个新的政府"
 me_rhodes_38_tt_1:0 "罗德岛将继续是一个共和国。"
 me_rhodes_38_tt_2:0 "#Y [GetCountry('RHO').GetRuler.GetName]#! 将试图夺取权力!"
 me_rhodes_39_desc:0 "既然我们已经制服了我们周围的人，把曾经的国王降到了脚板上，那么，这些天我们最大的敌人就是我们自己，这一点应该不足为奇。精英们的嫉妒导致了密室里的杂音和窃窃私语的运动，现在看来，背叛的时刻已经到来；内战正在向我们袭来!"
 me_rhodes_39_title:0 "罗德斯的独裁统治"
 me_rhodes_3_desc_1:0 "埃及愚蠢地拒绝了我们的结盟提议，留下我们独自保卫罗德岛。没有他们的帮助，罗德也将繁荣。"
 me_rhodes_3_desc_2:0 "埃及已经接受我们的结盟提议！如今，在托勒密的力量保障下，罗德已成为爱琴海最负盛名的势力之一！"
 me_rhodes_3_title:0 "埃及的回应"
 me_rhodes_4_desc:0 "那个傻瓜德米特里欧斯为了征服我们的城市，不惜耗费巨资，建造了这个城市里任何人都没见过的最复杂的围墙，而他却把它们抛弃了!即使是现在，他的攻城塔仍然靠在城墙上，成为他无能的纪念碑。我们该如何处理这些可怕的设备呢？"
 me_rhodes_4_title:0 "德米特里欧斯的围墙"
 me_rhodes_5_desc:0 "终于，德米特里遗留的那些丑陋攻城器械的祸患被彻底清除了。我们不仅将这些被随意弃置的器械从城中移走——此举本身已让市民欢欣鼓舞——更因其最终处置方式而开始收获意外之喜。"
 me_rhodes_5_title:0 "德米特里欧斯的攻城器械"
 me_rhodes_6_desc:0 "尽管难以启齿，但罗德岛城近年的境况确实每况愈下。德米特里留下的破坏犹在——部分城墙仍有损毁，南门附近那座摇摇欲坠的塔楼更是让我们的首席建筑师们夜不能寐。此事确需尽快处理，只是所费不赀啊。"
 me_rhodes_6_title:0 "罗得岛的恢复。确保资金"
 me_rhodes_7_desc:0 "你委托的重建工程到了视察之日，修缮现场因期待你的到来而一片忙碌。你目光扫过石工，点了点头，转身向建筑师微笑。众所周知，你很难被打动，尤其当工程涉及大笔金钱时更是如此；但不得不承认，已完成的工作十分出色。"
 me_rhodes_7_title:0 "罗德岛重建"
 me_rhodes_8_desc:0 "科斯岛离我们如此之近，如果风向有利于我们，我们几乎可以在一天之内航行到那里，但他们却称遥远的托勒密人为主人。如果他们成为我们自己王国的一部分，难道对他们没有好处吗？无论如何，我们都不应该容忍任何外国势力控制我们附近的岛屿。"
 me_rhodes_8_title:0 "科斯的人民"
 me_rhodes_9_desc:0 "港区税收本可更加丰厚，而港中船只稀少的原因也很清楚：邻近的克尼多斯岛已成为过往商人的诱人选择，安提柯王朝以承诺和钱币将他们引向自己的港口。但够了；由我们亲自控制这些岛屿，或至少驱逐安提柯势力，都会对我们有利。我们该如何行动？"
 me_rhodes_9_title:0 "克尼多斯的人民"

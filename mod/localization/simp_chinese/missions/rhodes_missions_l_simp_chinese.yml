 perma_assimilation_mod:0 "爱琴海的同化"
 perma_navy_morale_boost:0 "海军士气高涨"
 preparing_a_fleet:0 "准备入侵"
 proud_rhodian_heritage:0 "骄傲的罗迪亚传统"
 quality_military_equipment:0 "优质军事装备"
 rebels_of_rhodes:0 "罗得岛叛军"
 rebels_of_rhodes_adjective:0 "罗得岛的反叛者"
 resource_exploitation:0 "资源开采"
 restored_rhodes:0 "复原后的罗得岛"
 rhodes_01_aegean:0 "玫瑰之岛"
 rhodes_01_aegean_BUTTON_TOOLTIP:0 "爱琴海将是我们的!"
 rhodes_01_aegean_CRITERIA_DESCRIPTION:0 "当罗得斯统治了爱琴海的大部分地区时，这个任务就算完成。"
 rhodes_01_aegean_DESCRIPTION:0 "随着罗得斯的国力不断增长，现在是时候把我们的影响力扩展到海岸以外的地方了。"
 rhodes_01_aegean_task_1:0 "德米特里厄斯的围城"
 rhodes_01_aegean_task_10:0 "克里特岛的主人"
 rhodes_01_aegean_task_10_DESC:0 "事实证明，征服整个克里特岛是一次值得的冒险。随着克里特岛被罗得斯控制，我们已经了成为一个受人尊敬的爱琴海强国，其名声广为人知。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 rhodes_01_aegean_task_11:0 "克里特岛的大都市"
 rhodes_01_aegean_task_11_A_tooltip:0 "在#Y [GetProvince('(int32)344').GetArea.GetName]#! 省的任何领土都具有#Y 大都市#! 的地位"
 rhodes_01_aegean_task_11_B_tooltip:0 "多达#Y 9#! 个领地将转换为#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#! 文化。"
 rhodes_01_aegean_task_11_DESC:0 "克里特岛上有许多相互隔绝开的城市。将全克里特岛的人民整合进一个伟大的大都市将有利于罗得斯的利益。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 rhodes_01_aegean_task_12:0 "发展克里特岛"
 rhodes_01_aegean_task_12_A_tooltip:0 "#Y [GetProvince('(int32)344').GetArea.GetName]#!岛上至少#Y 5#!块领土满足以下条件：\n*拥有#Y 城市#!或#Y 大都会#!地位\n*拥有至少#Y 20#!人口\n*拥有至少#Y 5#!座建筑\n*没有正在进行的建设"
 rhodes_01_aegean_task_12_DESC:0 "现在克里特岛已经被罗得斯牢牢控制，我们必须发展该岛以扩大罗得斯的影响力。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 rhodes_01_aegean_task_13:0 "巩固我们的家园"
 rhodes_01_aegean_task_13_DESC:0 "将斯波拉得群岛全部置于我们的控制之下，将确保罗得斯的安全，使其免受任何直接威胁。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 rhodes_01_aegean_task_14:0 "掌控爱琴海群岛"
 rhodes_01_aegean_task_14_A_tooltip:0 "在#Y [GetProvince('(int32)263').GetArea.GetName]#! 至少拥有#Y 5#!领土！"
 rhodes_01_aegean_task_14_DESC:0 "爱琴海中许多分散的岛屿在许多世纪以来都一直是希腊世界的贸易中心。将这些岛屿置于我们的控制之下将大大有助于我们控制爱琴海的贸易。\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 rhodes_01_aegean_task_15:0 "爱琴海霸主"
 rhodes_01_aegean_task_15_DESC:0 "不久前，罗得斯的人民还处于毁灭的边缘。现在，罗得斯已经控制了爱琴海上的众多发达岛屿，已经崛起为世界上最强大的希腊势力之一。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 rhodes_01_aegean_task_16:0 "林多斯的事务"
 rhodes_01_aegean_task_16_A_tooltip:0 "选择#Y [GetProvince('(int32)1830').GetName]#!领土的命运"
 rhodes_01_aegean_task_16_DESC:0 "长期以来，林多斯一直是罗德岛非常繁荣的一块土地，仅次于罗得斯城本身。然而，德米特里厄斯的围攻使这片土地处于糟糕的状态，恢复它以前的荣耀将是明智的。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 rhodes_01_aegean_task_16_tooltip:0 "#Y [GetProvince('(int32)1830').GetName]#! 的领土符合以下条件：\n*拥有#Y 城市#! 地位\n*拥有至少#Y 5#! 建筑\n*没有正在进行的建设\n*拥有至少#Y 15#! 人口\n*至少#Y 5#! 人口是公民@citizen!\n*奴隶比例@slaves!小于33%。"
 rhodes_01_aegean_task_17:0 "组建商船护卫队"
 rhodes_01_aegean_task_17_A_tooltip:0 "拥有一支至少有#Y 30#! 艘轻型舰艇的舰队，该舰队的海军将领至少有#Y 8#! #E 智略#!@civic_icon!。"
 rhodes_01_aegean_task_17_B_tooltip:0 "支持#Y 商人#!@civic_icon!将解锁独特的决定。"
 rhodes_01_aegean_task_17_DESC:0 "国家里的许多商人都在呼吁海军对重要的罗得斯贸易航线进行更多的保护。保护罗德岛的商业利益将为我们本就强劲的经济增添新的动力。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 rhodes_01_aegean_task_18:0 "组建海军舰队"
 rhodes_01_aegean_task_18_A_tooltip:0 "拥有一支至少有#Y 15#! 艘轻型战舰和#Y 15#! 艘中型战舰的舰队，其海军将领至少有#Y 8#! #E 军略#!@military_icon!。"
 rhodes_01_aegean_task_18_B_tooltip:0 "支持#R 军事#!@military_icon!将解锁独特的决定。"
 rhodes_01_aegean_task_18_DESC:0 "全国各地的军人都在呼吁建立一支更强大的舰队。许多人说，一支强大的舰队将阻止任何可能的入侵者，并帮助罗得斯扩张...\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 rhodes_01_aegean_task_19:0 "整合克里特岛"
 rhodes_01_aegean_task_19_A_tooltip:0 "整合了#Y [GetProvince('(int32)372').GetCulture.GetName]#!文化。"
 rhodes_01_aegean_task_19_DESC:0 "整合克里特岛人民将有助于加强罗得斯对该岛的统治，并大大扩张我们的军队。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 rhodes_01_aegean_task_1_DESC:0 "德米特里厄斯围攻罗得斯期间的许多珍贵的攻城器械被遗弃在了岛上。把它们拆掉卖钱或纳为己用，将会证明是有效的。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 rhodes_01_aegean_task_1_tooltip:0 "选择如何处理[GetProvince('(int32)266').GetName]上的由[GetCharacter('(int32)38').GetName]所留下的围墙。"
 rhodes_01_aegean_task_2:0 "重建罗德岛"
 rhodes_01_aegean_task_20:0 "同化克里特人"
 rhodes_01_aegean_task_20_DESC:0 "虽然这个过程会很漫长，但克里特岛的人民必须被牢牢地置于罗得斯的统治之下。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 rhodes_01_aegean_task_2_DESC:0 "对罗得岛的围困使该岛处于一种非常糟糕的状态，必须花很多时间来恢复罗得岛的旧日荣光。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 rhodes_01_aegean_task_2_tooltip:0 "开始修复#Y [GetProvince('(int32)266').GetName]#!岛。"
 rhodes_01_aegean_task_3:0 "修复罗得斯"
 rhodes_01_aegean_task_3_DESC:0 "如果罗得斯的人民要再次繁荣起来，就必须重新建立起罗得斯城。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 rhodes_01_aegean_task_3_tooltip:0 "#Y [GetProvince('(int32)266').GetName]#!的领土没有空闲的建筑位置\n（当前[SCOPE.GetRootScope.GetCountry.Custom('rhodes_missions_task_3_buildings_loc')]）[SCOPE.GetRootScope.GetCountry.Custom('rhodes_missions_task_3_construction_loc')]"
 rhodes_01_aegean_task_4:0 "一个城市的重生"
 rhodes_01_aegean_task_4_DESC:0 "一旦我们伟大的首都发展成为爱琴海最繁荣的城市之一，罗得斯的名声将广为人知。\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!"
 rhodes_01_aegean_task_4_tooltip:0 "#Y [THIS.GetProvince.GetName]#! 满足以下条件：\n*至少有10个建筑\n*没有正在进行的建设\n*至少有#Y 15#! 公民@citizen!\n*至少有#Y 15#! 自由民@freemen!\n*至少有#Y 5#! 贵族@nobles!。"
 rhodes_01_aegean_task_6:0 "克里特雄心"
 rhodes_01_aegean_task_6_B_tooltip:0 "获得对#Y [GetProvince('(int32)344').GetArea.GetName]#!省的宣称"
 rhodes_01_aegean_task_6_DESC:0 "在克里特岛建立起一个立足点将使罗得斯人迅速扩张该岛的富饶土地。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 rhodes_01_aegean_task_6_tooltip:0 "拥有#Y [GetProvince('(int32)344').GetArea.GetName]#!省的任何领土"
 rhodes_01_aegean_task_7:0 "斯波拉得岛的粮食储备"
 rhodes_01_aegean_task_7_A_tooltip:0 "#Y [GetProvince('(int32)8015').GetName]#! 的领土上有一个农业定居建筑和至少#Y 5#! 奴隶@slaves!。"
 rhodes_01_aegean_task_7_B_tooltip:0 "在#Y [GetProvince('(int32)280').GetName]#! 的领土上有一个农业定居建筑和至少#Y 5#! 个奴隶@slaves!。"
 rhodes_01_aegean_task_7_DESC:0 "斯波拉得岛经常遭受长期的粮食短缺，专注于这一地区的粮食生产将被证明是富有成效的。\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 rhodes_01_aegean_task_8:0 "准备一支入侵部队"
 rhodes_01_aegean_task_8_A_tooltip:0 "拥有一支至少#Y 10#! 艘轻型船只的舰队"
 rhodes_01_aegean_task_8_B_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 与任何有#Y [GetProvince('(int32)358').GetCulture.GetName]#! 文化的国家结盟"
 rhodes_01_aegean_task_8_C_tooltip:0 "如果我们的#Y 克里特人#! 的省份少于#Y [SCOPE.GetRootScope.GetCountry.GetName]#! ，那么就向他们发出请求，成为我们的#Y 藩属#!。"
 rhodes_01_aegean_task_8_DESC:0 "在经历了罗得斯围城战后，我们的人民比以前更强大了。然而，在围攻期间，我们的大部分海军都被安提柯摧毁了。我们必须准备好入侵舰队，以便扩大罗得斯在爱琴海的影响力。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 rhodes_01_aegean_task_9:0 "控制斯坡拉德斯"
 rhodes_01_aegean_task_9_A_tooltip:0 "煽动#Y [GetCountry('KOS').GetName]#! 和#Y [GetCountry('KNI').GetName]#! 的#E 独立#!，如果他们是别国的一部分。如果他们是独立的，向他们各自发出请求，成为我们的#Y 藩属国#!"
 rhodes_01_aegean_task_9_B_tooltip:0 "获得对#Y Sporades#!省的宣称。"
 rhodes_01_aegean_task_9_DESC:0 "斯波拉得的许多岛屿都靠近罗得岛，但由于马其顿的影响，它们比看起来更远。凭借我们新获得的声望，许多人认为通过将斯坡拉德斯置于罗得岛的控制之下来巩固我们的家园是可行的。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 rhodes_02_asia:0 "爱琴海联盟"
 rhodes_02_asia_BUTTON_TOOLTIP:0 "亚洲将是我们的!"
 rhodes_02_asia_CRITERIA_DESCRIPTION:0 "当我们在亚洲的海岸线上确立了罗地亚的统治时，这个任务才算完成。"
 rhodes_02_asia_DESCRIPTION:0 "小亚细亚郁郁葱葱的海岸线一直是一个富裕的地区，得天独厚的港口城市和天然港湾使其成为一个繁荣的贸易中心。现在我们的影响力越来越大，我们在这些土地上确保自己的地位是非常合适的。"
 rhodes_02_asia_no_free_slots_tooltip:0 "#Y [THIS.GetProvince.GetName]#! 没有免费的建筑槽位"
 rhodes_02_asia_task_1:0 "罗地亚的佩拉亚"
 rhodes_02_asia_task_10:0 "珀加蒙的伟大土地"
 rhodes_02_asia_task_10_DESC:0 "我们控制的小亚细亚的伟大奇迹一个接一个地增加，而珀加蒙卫城是另一个可以得到的奖赏。我们应该在那里建立一个前哨站，让适当的爱琴海文化扎根。\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 rhodes_02_asia_task_11:0 "罗德岛的大都市"
 rhodes_02_asia_task_11_DESC:0 "美丽的罗得岛，目前是爱琴海令人羡慕的城市，已经发展并超过了我们的创始人所规定的原始边界。现在是时候扩展成一个大都市了；罗得岛将很快成为世界羡慕的地方！。\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!"
 rhodes_02_asia_task_12:0 "大理石矿场"
 rhodes_02_asia_task_12_DESC:0 "我们利润丰厚的大理石贸易，已经很可观了，如果我们投资建设矿山，可以扩大。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 rhodes_02_asia_task_12_marble_loc_1:0 "(#R [SCOPE.ScriptValue('rhodes_02_asia_task_12_marble_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_12_marble_total')|0]#!)"
 rhodes_02_asia_task_12_marble_loc_2:0 "(#Y [SCOPE.ScriptValue('rhodes_02_asia_task_12_marble_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_12_marble_total')|0]#!)"
 rhodes_02_asia_task_12_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y [SCOPE.ScriptValue('rhodes_02_asia_task_12_marble_total')|0]#!地区至少生产@marble!#Y 大理石[GetProvince('(int32)278').GetArea.GetRegion.GetName]#!。[SCOPE.GetRootScope.GetCountry.Custom('rhodes_02_asia_task_12_marble_loc')]。"
 rhodes_02_asia_task_13:0 "爱琴海的城市"
 rhodes_02_asia_task_13_DESC:0 "没有人可以否认，爱琴海的岛屿正在蓬勃发展；我们的港口充满了兜售商品的商人和寻求新生活的旅行者。虽然我们应该庆祝我们的世界性吸引力，但让我们确保我们自己的文化在该地区的主导地位。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 rhodes_02_asia_task_13_tooltip:0 "至少有#Y 10#! 个高亮显示的爱琴海领土满足以下条件：\n*有#Y 城市#! 地位\n*有至少#Y 40#! 个人口\n*主导省份文化是#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!\n*没有空闲建筑槽\n*没有正在进行的建设"
 rhodes_02_asia_task_14:0 "众多港口的国度"
 rhodes_02_asia_task_14_DESC:0 "我们作为贸易大国的声誉是由我们的港口承载的，这些港口已经成为来自无数国家的贸易船只的第二个家。通过扩大我们控制的港口数量，我们将巩固我们作为爱琴海首要经济大国的声誉。   \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 rhodes_02_asia_task_14_ports_loc_1:0 "(#R [SCOPE.ScriptValue('rhodes_02_asia_task_14_ports_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_14_ports_total')|0]#!)"
 rhodes_02_asia_task_14_ports_loc_2:0 "(#Y [SCOPE.ScriptValue('rhodes_02_asia_task_14_ports_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_14_ports_total')|0]#!)"
 rhodes_02_asia_task_14_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在拥有的领土上至少有#Y [SCOPE.ScriptValue('rhodes_02_asia_task_14_ports_total')|0]港口#! 的建筑[SCOPE.GetRootScope.GetCountry.Custom('rhodes_02_asia_task_14_ports_loc')]。"
 rhodes_02_asia_task_15:0 "重组海军"
 rhodes_02_asia_task_15_DESC:0 "现在是向更广阔的世界释放我们的海军的时候了。让我们找到一个有资格被称为罗迪安舰队司令的指挥官，愿他能带领我们的战舰走向胜利。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 rhodes_02_asia_task_15_tooltip:0 "一位名叫#Y 阿革西谟布洛图斯#!的伟大海军将领将从军伍中崛起，指挥我们最大的海军。\n\n#Y 阿革西谟布洛图斯#!必须赢得至少#Y 10#!场海战才能完成下一个任务。如果他失去了海军将领职位或已经死亡，任务将会#R 失败#!。"
 rhodes_02_asia_task_16:0 "胜利的舰队"
 rhodes_02_asia_task_16_DESC:0 "虽然我们对我们的#Y 阿革西谟布洛图斯#!很有信心，但在我们把更大的权力交给他之前，他必须在公海上证明自己。让我们看看他如何款待我们的敌人。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 rhodes_02_asia_task_16_tooltip:0 "海军将领#Y 阿革西谟布洛图斯#!已经赢得了至少#Y 10#!场战斗\n（当前：#Y [SCOPE.ScriptValue('rhodes_armada_battles_won_svalue')|0]#!）\n\n如果#Y 阿革西谟布洛图斯#!不再是海军将领或已经死亡，这个任务将#R 失败#! ，并可能产生不利后果……"
 rhodes_02_asia_task_17:0 "海军霸权"
 rhodes_02_asia_task_17_A_tooltip:0 "#R 宣战#! 以#Y 海军优势#!战争目标瞄准东地中海海军实力最强且未与 #Y [SCOPE.GetRootScope.GetCountry.GetName]#!."
 rhodes_02_asia_task_17_DESC:0 "尽管我们深知自己是海洋无可争议的统治者，但并非所有国家都承认这一事实。让我们通过摧毁所有企图挑战我们霸权的觊觎者来彻底确立统治地位————#Y 阿革西谟布洛图斯#!必将带领我们走向胜利！\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 rhodes_02_asia_task_17_tooltip:0 "海军将领#Y 阿革西谟布洛图斯#!依然存活，并指挥着一支海军"
 rhodes_02_asia_task_18:0 "罗德斯军团"
 rhodes_02_asia_task_18_DESC:0 "虽然我们的敌人主要是通过我们舰队的力量来了解我们，但我们在陆地上也是强大的战士。随着我们军团的壮大，我们战士的自豪感也随之而来--很快，世界将畏惧罗迪安的武器！。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 rhodes_02_asia_task_18_tooltip:0 "在首都地区拥有一个至少有#Y 10#! 个单位的军团"
 rhodes_02_asia_task_19:0 "一个胜利的军团"
 rhodes_02_asia_task_19_DESC:0 "我们身经百战的军团继续获得令人印象深刻的声誉，成为可怕的对手，使我们周围的劣等军队感到恐惧。这是许多士兵的热切愿望，他们永远不必在战斗中面对罗德斯的勇士。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 rhodes_02_asia_task_19_tooltip:0 "罗德岛的首都军团在接受前次任务后至少赢得了#Y 15#! 次战斗（当前：#Y [SCOPE.ScriptValue('rhodes_legion_battles_won_svalue')|0]#!）。"
 rhodes_02_asia_task_1_DESC:0 "我们曾饱受卡里亚人的奴役；在他们征服我们之后，我们经历了近二十年的苦难和奴役。然而，时代变了，当我们考虑扩张到罗德岛以外的地方时，昔日压迫者的土地成了我们首要考虑的. \n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 rhodes_02_asia_task_1_tooltip:0 "获得对#Y [GetProvince('(int32)1876').GetArea.GetName]#!省的宣称。"
 rhodes_02_asia_task_2:0 "进入伊奥尼亚"
 rhodes_02_asia_task_20:0 "爱琴海军事霸权"
 rhodes_02_asia_task_20_A_tooltip:0 "首都军团将获得#E 罗德斯冠军#! 的殊荣"
 rhodes_02_asia_task_20_DESC:0 "我们的军团已然成为世界顶尖的战斗力量之一。罗德岛冠军军团在各大强国的常备军中脱颖而出，他们拥有几乎无可匹敌的荣耀，能够与任何胆敢违抗其意志的人正面交锋. \n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 rhodes_02_asia_task_20_tooltip:0 "在首都地区拥有一个至少有#Y 15#! 个单位和#Y 3#! 个称号的军团"
 rhodes_02_asia_task_21:0 "卡里亚的爱琴海人"
 rhodes_02_asia_task_21_DESC:0 "奇怪的是，卡里亚人正在适应我们统治下的生活，对我们来说没有什么问题。采用某些爱琴海的习俗，如准备我们的传统菜肴，甚至使用我们的俚语，甚至在城市的年轻人中开始流行。我们很幸运，有这么多人愿意接受我们的生活方式!  \n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 rhodes_02_asia_task_21_pops_loc_1:0 "(#R [SCOPE.ScriptValue('rhodes_02_asia_task_21_pops_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_21_pops_total')|0]#!)"
 rhodes_02_asia_task_21_pops_loc_2:0 "(#Y [SCOPE.ScriptValue('rhodes_02_asia_task_21_pops_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_21_pops_total')|0]#!)"
 rhodes_02_asia_task_21_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!在#Y [GetProvince('(int32)1876').GetArea.GetName]#!和#Y [GetProvince('(int32)1948').GetArea.GetName]#!省份内拥有的#Y [SCOPE.ScriptValue('rhodes_02_asia_task_21_pops_absolute_total')|0]#!人口，至少#Y 80%#!信仰#Y [SCOPE.GetRootScope.GetCountry.GetReligion.GetName]#!且属于#Y [SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]#!或者某一已整合文化。[SCOPE.GetRootScope.GetCountry.Custom('rhodes_02_asia_task_21_pops_loc')]"
 rhodes_02_asia_task_22:0 "巩固亚洲"
 rhodes_02_asia_task_22_DESC:0 "我们的岛屿主宰了我们周围的土地，这不应该感到惊讶；有些人甚至认为这是一种必然。我们应该加强对亚洲的控制，确保我们对这一重要地区有一个牢固的控制。\n\n\n\n\n\n\n\n\n\n@greek_mil15!"
 rhodes_02_asia_task_23:0 "阿提卡的进步"
 rhodes_02_asia_task_23_DESC:0 "阿提卡在我们的统治下正在蓬勃发展，这证明了我们统治该地区的神圣权利。我们在半岛的主要政治力量中屹立不倒，而且所有人都承认我们的影响力只会继续增长。  \n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 rhodes_02_asia_task_23_tooltip:0 "在#Y $boeotia_area$#!、#Y $central_greece_area$#! 和#Y $euboea_area$#!省拥有至少15个领地。"
 rhodes_02_asia_task_24:0 "伯罗奔尼撒的力量"
 rhodes_02_asia_task_24_DESC:0 "您在伯罗奔尼撒的征服带来了意外横财；除了领土和奴隶之外，您凯旋的军队还收集了大量钱币。罗德国库正在增长！\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 rhodes_02_asia_task_24_tooltip:0 "在#Y $achaea_area$#!、#Y $arcadia_area$#! 和#Y $south_peleponnesos_area$#!省拥有至少15个领地。"
 rhodes_02_asia_task_25:0 "罗地亚-马其顿"
 rhodes_02_asia_task_25_DESC:0 "我们进入了一个新的时代，将我们的统治权扩展到了马其顿本土；多么合适啊，我们是给那些给周围人带来许多麻烦的土地带来稳定的人。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 rhodes_02_asia_task_25_tooltip:0 "在#Y 马其顿#!地区拥有至少15块领土"
 rhodes_02_asia_task_26:0 "穿越赫勒斯庞特海峡"
 rhodes_02_asia_task_26_DESC:0 "为了真正确保进入黑海，我们必须控制Hellespont的两边，以免我们的舰队受到敌人的骚扰，否则他们可能会肆无忌惮地行动。值得庆幸的是，色雷斯丰富的土地本身就是奖品......我们在这里的征服会很成功。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 rhodes_02_asia_task_26_tooltip:0 "在#Y 色雷斯#!地区拥有至少15个领地"
 rhodes_02_asia_task_27:0 "一个新的希腊力量"
 rhodes_02_asia_task_27_DESC:0 "曾经看起来不可能的事情现在成了新的现实；希腊世界中心的不同地区已经联合起来，而且不是靠继承国的军队，而是靠罗德斯。谁能站在他们面前？\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!"
 rhodes_02_asia_task_28:0 "民主之家"
 rhodes_02_asia_task_28_DESC:0 "我们的文化已经远远超出了我们的海岸，即使是哲学家之城阿提奈，也无法逃脱爱琴海文化不可阻挡的吸引力。采用我们的方式是他们的最高荣耀，这是整个希腊必须效仿的榜样!\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 rhodes_02_asia_task_29:0 "伯罗奔尼撒的繁荣"
 rhodes_02_asia_task_29_B_tooltip:0 "在#Y [SCOPE.ScriptValue('rhodes_02_asia_task_29_buildings_total')|0]#! 、#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 和#Y $achaea_area$#!三省的#Y $arcadia_area$拥有的领土上，至少有#! #Y 建筑$south_peleponnesos_area$建成。｝#! [SCOPE.GetRootScope.GetCountry.Custom('rhodes_02_asia_task_29_buildings_loc')] [SCOPE.GetRootScope.GetCountry.Custom('rhodes_02_asia_task_29_construction_loc')]"
 rhodes_02_asia_task_29_C_tooltip:0 "在#Y $achaea_area$#!、#Y $arcadia_area$#! 和#Y $south_peleponnesos_area$#! 省至少有3个地区具有#Y 大都市#! 等级。"
 rhodes_02_asia_task_29_DESC:0 "在我们的领导下，伯罗奔尼撒半岛的城市经历了前所未有的发展，其文化繁荣程度前所未有。如果我们继续改善这些已经遍布全境的人口中心，我们将能够为拉科尼亚带来一个繁荣的时代，造福我们所有人. \n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 rhodes_02_asia_task_29_buildings_loc_1:0 "(#R [SCOPE.ScriptValue('rhodes_02_asia_task_29_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_29_buildings_total')|0]#!)"
 rhodes_02_asia_task_29_buildings_loc_2:0 "(#Y [SCOPE.ScriptValue('rhodes_02_asia_task_29_buildings_current')|0]#!/#Y [SCOPE.ScriptValue('rhodes_02_asia_task_29_buildings_total')|0]#!)"
 rhodes_02_asia_task_29_construction_loc_1:0 "\n @trigger_no! #Y [SCOPE.GetRootScope.GetCountry.GetName]#! 在#Y $achaea_area$#!、#Y $arcadia_area$#! 或#Y $south_peleponnesos_area$#!的省份有正在进行的建设。"
 rhodes_02_asia_task_29_tooltip:0 "在伯罗奔尼撒半岛的三个省份中选择一个，以获得以下修饰语。"
 rhodes_02_asia_task_2_DESC:0 "富饶的伊奥尼亚区域是一个诱人的前景；我们应该向该地区扩张，发展我们的利益。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 rhodes_02_asia_task_2_tooltip:0 "获得对#Y [GetProvince('(int32)290').GetArea.GetName]#!省的宣称。"
 rhodes_02_asia_task_3:0 "巩固伊奥尼亚"
 rhodes_02_asia_task_3_DESC:0 "现在我们已经在伊奥尼亚建立了一个立足点，是时候巩固我们的地位，巩固我们已经取得的成果。整个省份都将是我们的。\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 rhodes_02_asia_task_4:0 "主宰卡利亚"
 rhodes_02_asia_task_4_DESC:0 "卡里安人曾经洗劫过我们的城市，统治过我们，虽然已经过去很多年了，但记忆仍然是痛苦的。现在是为他们翻案，为我们的祖先报仇的时候了--我们要夺取他们的土地，把我们的人民送到那里去！。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 rhodes_02_asia_task_5:0 "利西亚的城市"
 rhodes_02_asia_task_5_B_tooltip:0 "获得释放#Y [GetProvince('(int32)1992').GetArea.GetName]#! 省作为#Y 藩属#!\n的选择权，或者获得以下修正。"
 rhodes_02_asia_task_5_DESC:0 "利西亚的港口城市已经提供了一个有吸引力的建设基础；他们的港口很好，气候很吸引人。如果我们投资建设更多的城市，整个地区都会受益。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 rhodes_02_asia_task_5_tooltip:0 "#Y [GetProvince('(int32)1998').GetArea.GetName]#!中至少#Y 5#!块领土满足以下条件：\n*拥有城市地位\n*拥有至少#Y 15#!人口\n*拥有至少#Y 6#!座建筑\n*没有正在进行的建设"
 rhodes_02_asia_task_6:0 "哈里卡纳索斯城"
 rhodes_02_asia_task_6_DESC:0 "哈利卡纳索斯陵墓以其宏伟壮丽而闻名，这座城市曾是卡里亚人的乐土。如果我们继续发展这片区域，我们的文化很快就会传播开来。我们应该考虑在阿利卡纳索斯建立一个罗德岛区. \n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 rhodes_02_asia_task_7:0 "特洛伊之事"
 rhodes_02_asia_task_7_DESC:0 "当我们继续向小亚细亚海岸扩张时，获得伊留姆的古老土地最近有了一种可能性。让我们成为特洛伊的主人。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 rhodes_02_asia_task_8:0 "确保Aeolis的安全"
 rhodes_02_asia_task_8_DESC:0 "现在是我们投资我们在Aeolis的土地的时候了，因为确保我们遥远的省份的繁荣符合我们的长期利益。\n\n\n\n\n\n\n\n\n\n@greek_mil12!"
 rhodes_02_asia_task_9:0 "爱琴海联盟"
 rhodes_02_asia_task_9_DESC:0 "我们已经成长为一种政治力量，超越了任何人都能预见到的程度。组建一个爱琴海联盟可以加强我们在国外和国内的地位。\n\n\n\n\n\n\n\n\n\n\n\n@greek_por1!>"
 rhodes_02_asia_task_9_tooltip:0 "组成#Y 爱琴海联盟#!。"

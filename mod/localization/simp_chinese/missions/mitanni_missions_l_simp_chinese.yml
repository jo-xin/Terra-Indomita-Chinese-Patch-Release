 mitanni_missions:0 "从青铜废墟中"
 mitanni_missions_BUTTON_TOOLTIP:0 "是时候迎接新青铜时代的马里亚努了。"
 mitanni_missions_CRITERIA_DESCRIPTION:0 "当新米坦尼帝国完全重建并现代化以应对希腊化时代时，此任务将完成。"
 mitanni_missions_DESCRIPTION:0 "重建新米坦尼王国需要巨大努力。仅仅迁徙到这些土地并重新宣称祖先的米坦尼领土远远不够。我们必须铭记传统，并适应时代。"
 mitanni_missions_task_1:0 "老将新招"
 mitanni_missions_task_10:0 "瓦苏卡尼的战士"
 mitanni_missions_task_10_DESC:0 "新米坦尼军事改革带来了战场上的新辉煌。让我们放眼地平线，征服它。\n\n\n\n\n\n\n\n\n\n@india_mil23!"
 mitanni_missions_task_11:0 "旧时盟友"
 mitanni_missions_task_11_DESC:0 "很久以前，米坦尼与埃及人曾结下神圣的兄弟情谊和联盟。现在是时候接近新时代的埃及人，重铸这古老的联盟。\n\n\n\n\n\n\n\n\n\n@egypt_mil2!"
 mitanni_missions_task_12:0 "血脉相连"
 mitanni_missions_task_12_DESC:0 "新时代的埃及人似乎大不相同，愿意联姻皇室。曾经，这种提议对他们来说不可思议，但现在，我们可以提议与他们的精英联姻，以加强我们的联盟。\n\n\n\n\n\n\n\n\n\n@egypt_mil15!"
 mitanni_missions_task_13:0 "寻找绍什塔塔尔"
 mitanni_missions_task_13_DESC:0 "传奇国王绍什塔塔尔是米坦尼最伟大的国王。为了更紧密地联系旧米坦尼行政体系，我们应寻找这位伟大国王的后裔。\n\n\n\n\n\n\n\n\n\n@india_mil22!"
 mitanni_missions_task_14:0 "锡贸易"
 mitanni_missions_task_14_DESC:0 "在古代，锡贸易是制造青铜的核心。尽管青铜不再是锻造武器的首选材料，我们仍可通过确保锡和其他贵金属的贸易获益。\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 mitanni_missions_task_15:0 "新时代外交"
 mitanni_missions_task_15_DESC:0 "我们的外交能力已被注意到，我们因此可在世界中占据一席之地。外交、内政和贸易都帮助我们确保这次米坦尼将永存。\n\n\n\n\n\n\n\n\n\n@india_mil20!"
 mitanni_missions_task_16:0 "新米坦尼帝国"
 mitanni_missions_task_16_DESC:0 "外交、军事和行政。我们进入了米坦尼人民的新黄金时代。或许新青铜时代更贴切。我们将以新米坦尼帝国的身份统治千年！\n\n\n\n\n\n\n\n\n\n@india_mil2!"
 mitanni_missions_task_17:0 "地中海利益"
 mitanni_missions_task_17_DESC:0 "随着瓦苏卡尼的重建，我们也需建立一个港口，以在地中海扩展我们的影响力。古老的乌加里特城将非常合适。\n\n\n\n\n\n\n\n\n\n@event_pic3!"
 mitanni_missions_task_1_DESC:0 "我们需要立即稳定并现代化古老的米坦尼国家！\n\n\n\n\n\n\n\n\n\n@india_mil14!"
 mitanni_missions_task_2:0 "瓦苏卡尼觉醒"
 mitanni_missions_task_2_DESC:0 "古老的瓦苏卡尼城需要重建，并繁荣为现代城市。\n\n\n\n\n\n\n\n\n\n@event_pic2!"
 mitanni_missions_task_3:0 "新行政体系"
 mitanni_missions_task_3_DESC:0 "我们必须评估如何管理我们的领土，以在这个新时代取得成功。\n\n\n\n\n\n\n\n\n\n@india_mil4!"
 mitanni_missions_task_4:0 "宿敌"
 mitanni_missions_task_4_DESC:0 "亚述人曾接管原始米坦尼国家，残酷屠杀整个文明。作为新米坦尼的复兴者，我们应以他们惩罚我们祖先的同样残酷方式惩罚亚述人。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 mitanni_missions_task_5:0 "瓦苏卡尼之水"
 mitanni_missions_task_5_DESC:0 "亚述人曾试图抹去古老米坦尼王国的所有痕迹，如今我们展现仁慈将意义非凡。或许亚述人甚至会乐于接受他们曾经憎恨者的统治。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 mitanni_missions_task_6:0 "真正的王国"
 mitanni_missions_task_6_DESC:0 "虽然我们已建立新米坦尼国家，但我们是否真正是米坦尼‘王国’仍存疑问。随着新米坦尼君主制的诞生，这疑问将不复存在。\n\n\n\n\n\n\n\n\n\n@egypt_mil7!"
 mitanni_missions_task_7:0 "米坦尼军事"
 mitanni_missions_task_7_DESC:0 "米坦尼军队曾无人能敌。我们必须进行大规模军事改革，以在这个新时代确保同样的地位。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 mitanni_missions_task_8:0 "新马里亚努"
 mitanni_missions_task_8_DESC:0 "我们应不惜代价改革军队。\n\n\n\n\n\n\n\n\n\n@india_mil10!"
 mitanni_missions_task_9:0 "海军新生"
 mitanni_missions_task_9_DESC:0 "海军对我们在这个时代的成功至关重要。\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"

l_simp_chinese:
 NEOMITANNIEMPIRE:0 "新米坦尼帝国"
 admin_reforms_mitanni:0 "行政改革"
 assyria_forgiven:0 "仁慈的米坦尼"
 blood_of_shaushtatar:0 "绍什塔塔尔之血"
 blood_of_shaushtatar_desc:0 "绍什塔塔尔是古米坦尼诸王中最伟大的一位。他使米坦尼成为一个强大的王国。凭借与埃及人的联盟，以及其父解决的内部困境，他成功入侵亚述并扩大米坦尼影响力，成为真正的青铜时代强权。"
 brazen_ash:0 "青铜灰烬"
 me_mitanni_1.a:0 "新米坦尼将高高升起。"
 me_mitanni_10.a:0 "我们先拿什么来测试呢？"
 me_mitanni_10_desc:0 "我们的军事改革造就了真正的新青铜时代马里亚努。我们将展示融合古老方式与新时代适应的力量。改革完成后，我们认为适合宣称古老米坦尼的领土范围。"
 me_mitanni_10_title:0 "$mitanni_missions_task_10$"
 me_mitanni_10_tooltip:0 "任务‘#Y $mitanni_missions_task_10$#!’现已#G 完成#!"
 me_mitanni_11.a:0 "我的兄弟，法老。"
 me_mitanni_11_desc:0 "旧米坦尼王国与埃及法老结盟。在这个新时代，尽管埃及大不相同，我们应重铸这古老联盟。"
 me_mitanni_11_title:0 "$mitanni_missions_task_11$"
 me_mitanni_11_tooltip:0 "任务‘#Y $mitanni_missions_task_11$#!’现已#G 完成#!"
 me_mitanni_12.a:0 "我将与一位埃及公主结婚！"
 me_mitanni_12_desc:0 "新时代的埃及人似乎大不相同，愿意联姻皇室。曾经，这种提议对他们来说不可思议，但现在，我们可以提议与他们的精英联姻，以加强我们的联盟。"
 me_mitanni_12_title:0 "$mitanni_missions_task_12$"
 me_mitanni_12_tooltip:0 "任务‘#Y $mitanni_missions_task_12$#!’现已#G 完成#!"
 me_mitanni_13.a:0 "这将加强我们的宣称。"
 me_mitanni_132.a:0 "也许这种搜寻真的毫无意义。"
 me_mitanni_132_desc:0 "搜寻过程艰难。有人说这是徒劳的。旧米坦尼已被古亚述人彻底摧毁。这已开始对民众和国库造成负担。"
 me_mitanni_132_title:0 "继续搜寻！"
 me_mitanni_133.a:0 "善意的谎言不会伤害任何人。"
 me_mitanni_133.b:0 "我们不要对公众撒谎。"
 me_mitanni_133_desc:0 "我们未能找到任何后裔……然而，有些可疑的文件声称你的王室已与伟大的绍什塔塔尔国王有关。在正常情况下，这是一个离谱的说法。然而，你可以宣称这是真的。"
 me_mitanni_133_title:0 "$mitanni_missions_task_13$"
 me_mitanni_13_desc:0 "传奇国王绍什塔塔尔是米坦尼最伟大的国王。为了更紧密地联系旧米坦尼行政体系，我们应寻找这位伟大国王的后裔。"
 me_mitanni_13_title:0 "开始搜寻！"
 me_mitanni_13_tooltip:0 "任务‘#Y $mitanni_missions_task_13$#!’现已#G 完成#!"
 me_mitanni_14.a:0 "财富在向我们招手！"
 me_mitanni_14_desc:0 "在古代，锡贸易是制造青铜的核心。尽管青铜不再是锻造武器的首选材料，我们仍可通过确保锡和其他贵金属的贸易获益。"
 me_mitanni_14_title:0 "$mitanni_missions_task_14$"
 me_mitanni_14_tooltip:0 "任务‘#Y $mitanni_missions_task_14$#!’现已#G 完成#!"
 me_mitanni_15.a:0 "我们的统治将千年永存！"
 me_mitanni_15_desc:0 "我们的外交能力已被注意到，我们因此可在世界中占据一席之地。外交、内政和贸易都帮助我们确保这次米坦尼将永存。"
 me_mitanni_15_title:0 "$mitanni_missions_task_15$"
 me_mitanni_15_tooltip:0 "任务‘#Y $mitanni_missions_task_15$#!’现已#G 完成#!"
 me_mitanni_16.a:0 "而我作为它的皇帝！"
 me_mitanni_16_desc:0 "外交、军事和行政。我们进入了米坦尼人民的新黄金时代。或许新青铜时代更贴切。我们将以新米坦尼帝国的身份统治千年！"
 me_mitanni_16_title:0 "$mitanni_missions_task_16$"
 me_mitanni_16_tooltip:0 "任务‘#Y $mitanni_missions_task_16$#!’现已#G 完成#!"
 me_mitanni_17.a:0 "在海上，我们的影响力正在扩大。"
 me_mitanni_17_desc:0 "随着瓦苏卡尼的重建，我们也需建立一个港口，以在地中海扩展我们的影响力。古老的乌加里特城将非常合适。"
 me_mitanni_17_title:0 "$mitanni_missions_task_17$"
 me_mitanni_17_tooltip:0 "任务‘#Y $mitanni_missions_task_17$#!’现已#G 完成#!"
 me_mitanni_18.a:0 "从青铜灰烬中我们归来……"
 me_mitanni_18.b:0 "为自己开辟了一条新的道路……"
 me_mitanni_18_desc:0 "我们为世界带来了新的米坦尼帝国！曾经被烧成青铜灰烬，青铜之翼如今在幼发拉底河与底格里斯河的肥沃土地上展开，延伸至地中海的伟大贸易路线。时间曾一度剥夺我们在历史中的地位。我们不会再次浪费这机会。\n\n随着从王国晋升为帝国的正式宣告，以及我们的复兴完成，或许我们应将国家颜色定为青铜，以铭记我们的过去。"
 me_mitanni_18_title:0 "于青铜废墟中重生"
 me_mitanni_18_tooltip:0 "$tree_completed_tooltip_1$“#Y 从青铜废墟中#!”$tree_completed_tooltip_2$"
 me_mitanni_1_desc:0 "我们已宣称米坦尼文化为己有，然而，要重铸我们伟大的历史，我们需要现代化和稳定。人民已表达对我们重拾米坦尼遗产的支持。"
 me_mitanni_1_title:0 "$mitanni_missions_task_1$"
 me_mitanni_1_tooltip:0 "任务‘#Y $mitanni_missions_task_1$#!’现已#G 完成#!"
 me_mitanni_2.a:0 "瓦苏卡尼觉醒。"
 me_mitanni_2_desc:0 "瓦苏卡尼曾是米坦尼最伟大的城市。我们应重建这座城市并使其成为新首都。没有伟大的首都，我们如何自称米坦尼。"
 me_mitanni_2_title:0 "$mitanni_missions_task_2$"
 me_mitanni_2_tooltip:0 "任务‘#Y $mitanni_missions_task_2$#!’现已#G 完成#!"
 me_mitanni_3.a:0 "旧的将变为新的。"
 me_mitanni_3_desc:0 "旧米坦尼行政体系由印欧贵族阶层统治着讲胡里安语的农民。在这个新时代，胡里安人已不复存在。不管过去如何，我们需改革行政体系以跟上时代。"
 me_mitanni_3_title:0 "$mitanni_missions_task_3$"
 me_mitanni_3_tooltip:0 "任务‘#Y $mitanni_missions_task_3$#!’现已#G 完成#!"
 me_mitanni_4.a:0 "复仇是甜美的。"
 me_mitanni_4_desc:0 "啊，亚述人。现在是时候让他们为对古老米坦尼的罪行付出代价。他们屠杀了我们的人民和文化千年之久。我们现在可以对亚述人实施终极报复。复仇降临亚述猪猡。"
 me_mitanni_4_title:0 "$mitanni_missions_task_4$"
 me_mitanni_4_tooltip:0 "任务‘#Y $mitanni_missions_task_4$#!’现已#G 完成#!"
 me_mitanni_5.a:0 "他们现在最好规矩点。"
 me_mitanni_5_desc:0 "亚述人曾屠杀我们的人民和文化，将其从地球上抹去千年，直到我们重拾遗产。现在，我们选择不对亚述人实施甜美的复仇，而是展现仁慈。他们将永远记住这终极仁慈。"
 me_mitanni_5_title:0 "$mitanni_missions_task_5$"
 me_mitanni_5_tooltip:0 "任务‘#Y $mitanni_missions_task_5$#!’现已#G 完成#!"
 me_mitanni_6.a:0 "当然，我将成为国王。"
 me_mitanni_6_desc:0 "虽然我们已建立新米坦尼国家，但我们是否真正是米坦尼‘王国’仍存疑问。随着新米坦尼君主制的诞生，这疑问将不复存在。"
 me_mitanni_6_title:0 "$mitanni_missions_task_6$"
 me_mitanni_6_tooltip:0 "任务‘#Y $mitanni_missions_task_6$#!’现已#G 完成#!"
 me_mitanni_7.a:0 "称之为新青铜时代马里亚努。"
 me_mitanni_7_desc:0 "旧米坦尼军队以马里亚努战车部队闻名于世。在这个新时代的军事中，我们需形成全新的军事身份。然而，改革军队需要时间和资源，#R 改革期间我们将难以作战#!。"
 me_mitanni_7_title:0 "$mitanni_missions_task_7$"
 me_mitanni_7_tooltip:0 "任务‘#Y $mitanni_missions_task_7$#!’现已#G 完成#!"
 me_mitanni_8.a:0 "我们的军队将战无不胜！"
 me_mitanni_8.b:0 "这太昂贵了。"
 me_mitanni_8_desc:0 "我们必须改革军队。这是一项昂贵的任务，但我们可以投资新技术并迅速应用于军队。这必将激发军事威力。"
 me_mitanni_8_title:0 "$mitanni_missions_task_8$"
 me_mitanni_8_tooltip:0 "任务‘#Y $mitanni_missions_task_8$#!’现已#G 完成#!"
 me_mitanni_9.a:0 "大海将知道我们的威力！"
 me_mitanni_9.b:0 "这太昂贵了。"
 me_mitanni_9_desc:0 "海军在这个新时代是重要组成部分。我们可以以相对低廉的价格启动海军并从中发展。然而，海军往往昂贵。即使是折扣价，也不会便宜。"
 me_mitanni_9_title:0 "$mitanni_missions_task_9$"
 me_mitanni_9_tooltip:0 "任务‘#Y $mitanni_missions_task_9$#!’现已#G 完成#!"

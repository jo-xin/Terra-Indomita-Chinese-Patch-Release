l_simp_chinese:
 BELGAE_FORMABLE_FLAG:0 "凯旋的比利其的光荣旗帜"
 belgae_bee_farm:0 "特赖厄克图斯的蜜蜂农场"
 belgae_civ_boost_mod:0 "繁荣的首都"
 belgae_ganuentian_pirates:0 "加努恩提斯海盗"
 belgae_harenatium:0 "莱茵河上的哈伦特姆"
 belgae_pride_city:0 "比利其人的骄傲"
 belgae_pride_country:0 "成长的时期"
 bravest_belgae_ruler_duel_tt:0 "我们的统治者必须对敌国领袖使用人物互动#Y 设为对手#!并#Y 挑战决斗#!。"
 bravest_of_the_belgae:0 "最勇敢的比利其人"
 bravest_tribe_in_all_of_gaul_belgae:0 "整个高卢地区最勇敢的部落"
 britannic_trade:0 "不列颠贸易"
 britannic_trade_2:0 "不列颠贸易"
 britannic_trade_3:0 "人口繁荣"
 desc_belgae_bee_farm:0 "我们在特赖厄克图斯建立了蜂巢，这样我们就可以轻松获得我们的人民渴望的蜂蜜。"
 desc_belgae_civ_boost_mod:0 "虽然有人声称我们只是野蛮人，但我们繁荣的文化证明了这一点。"
 desc_belgae_ganuentian_pirates:0 "在日耳曼海水域航行的凶猛海盗在不出海的时候经常会在加努埃塔港出现。"
 desc_belgae_harenatium:0 "我们昔日首都的所在地继续蓬勃发展，无疑是由于其吉祥的位置。"
 desc_belgae_pride_city:0 "因为我们在这里的投资，这个城市已经成为我们的骄傲和快乐。"
 desc_belgae_pride_country:0 "一场完美的机会风暴为我们新首都的快速增长创造了条件。"
 desc_bravest_of_the_belgae:0 "凭骁勇之名，我等当为比利其诸部至勇之族！"
 desc_bravest_tribe_in_all_of_gaul_belgae:0 "比利其人是整个高卢地区最勇敢和最凶猛的部落，这句话是有道理的。"
 desc_britannic_trade:0 "我们已经与不列颠尼亚的部落建立了贸易联系。"
 desc_britannic_trade_2:0 "我们已与不列颠尼亚的部落建立了贸易联系"
 desc_britannic_trade_3:0 "我们的同胞蜂拥至此，渴望在此开创新生活。"
 eburonian_missions_01:0 "最勇敢的高卢人！"
 eburonian_missions_01_BUTTON_TOOLTIP:0 "在所有高卢人中，最强大的是比利时人，因为他们远离我们的省份。"
 eburonian_missions_01_CRITERIA_DESCRIPTION:0 "当埃布罗尼亚征服了她的贝尔格莱德对手并在北方建立了一个强大的王国时，这项任务就会完成。"
 eburonian_missions_01_DESCRIPTION:0 "在高卢北部，远离地中海温软文明之地，盘踞着凶悍的比利其人。他们四面皆敌：东有日耳曼蛮族屡渡莱努斯河（Rhenus）来犯，西与高卢诸部争雄——这些邻居绝非盟友，而是不死不休的宿敌。\n\n当统一的战火席卷南方，君王将相们正为重整破碎的帝国而厮杀之际，比利其人同样在为建国大业血战。究竟谁能自称\"高卢至勇之族\"，唯有时间方能裁决。"
 eburonian_missions_task_1:0 "南方战略"
 eburonian_missions_task_10:0 "最勇敢的比利其人"
 eburonian_missions_task_10_DESC:0 "确实，我们的人民热爱战争和在战斗中获得的荣誉——没有什么比听到关于她的战士的勇敢事迹的故事更让埃布隆人高兴的了\n\n。这也延伸到她的领导人的私人生活中；一个部落首领必须不害怕打击敌人，无论他们在哪里，甚至在个人战斗中。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 eburonian_missions_task_11:0 "特赖厄克图斯的蜜蜂农场"
 eburonian_missions_task_11_DESC:0 "当听闻以勇猛著称的埃布隆人——这些战场无敌的恐怖战士——竟对蜂蜜情有独钟时，许多人都不禁愕然。他们不仅用其腌制甜肉，更酿造大量蜂蜜酒。正因如此，他们在#E 特赖厄克图斯#!大建蜂巢的消息也就不足为奇了。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 eburonian_missions_task_12:0 "加努恩提斯海盗"
 eburonian_missions_task_12_DESC:0 "#E 加努恩塔#! 在我们埃布隆人到达之前，早就是海盗的家园，但我们没有驱逐这些背信弃义的强盗，而是决定拥抱我们的房客——毕竟我们没有理由不一起工作。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 eburonian_missions_task_13:0 "莱茵河上的哈伦特姆"
 eburonian_missions_task_13_DESC:0 "尽管我们放弃了旧都，转而在沿海兴建规划新城，但这并不意味着[GetProvince('(int32)3712').GetName]就此没落——事实恰恰相反。政府驻地的迁移似乎为这座城市带来了更多发展机遇。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 eburonian_missions_task_14:0 "蛮族智慧"
 eburonian_missions_task_14_DESC:0 "意识到[ROOT.GetCountry.GetName]的未来必须建立在一个比仅仅征服我们的敌人更强大的基础上，已经决定将[GetProvince('(int32)3675').GetName]变成一个能与任何首都相媲美的城市。我们必须建立基础设施，使我们的人民能够增长智慧和力量——我们必须使科托里阿库姆成为一个值得居住的地方。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 eburonian_missions_task_16:0 "比利其的未来"
 eburonian_missions_task_16_DESC:0 "如今我们已取得全面胜利，是时候将目光转向内政了。我们必须建立一个能够经受时间考验的王国。立即向各地传达命令，召集各部族代表前往[ROOT.GetCountry.GetCapital.GetName]参加议事会，共同商讨比利其人的未来发展方向。\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 eburonian_missions_task_17:0 "莱茵河不能阻止我们"
 eburonian_missions_task_17_DESC:0 "我们北方那些背信弃义的#E 弗里西亚人#!认为他们在莱茵河的另一边是安全的，但我们会报答他们的背叛，即使我们要追到地球的尽头。\n\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 eburonian_missions_task_1_DESC:0 "既然我们已经下定决心，我们就不能再浪费一秒钟——让我们在南边的邻居得知我们的计划之前，准备攻击他们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 eburonian_missions_task_2:0 "墨纳庇亚宣称"
 eburonian_missions_task_2_DESC:0 "北部沿海地区是墨纳庇亚人的家园，但这个错误很快就会被纠正；让我们的战士做好准备，去告知那些邻居：要么臣服，要么灭亡。\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 eburonian_missions_task_3:0 "触动神经"
 eburonian_missions_task_3_DESC:0 "随着[ROOT.GetCountry.GetRuler.GetName]发动的战役消息传遍#E 比利时#!，敌人们瑟瑟发抖，担心自己将成为厄部罗尼亚大军的下一个目标，而我们的盟友则从远方赶来首都，自愿效劳以期分得一份荣耀。\n\n#Y 一位军事能力@military_icon!出众的人物将加入我们的事业。#!\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 eburonian_missions_task_4:0 "奴役比利其人"
 eburonian_missions_task_4_DESC:0 "我们对邻近部落的持续运动是成功的，确保我们的定居点和工场充满了奴隶，为#E 厄部罗尼亚#!的荣耀工作。\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 eburonian_missions_task_5:0 "日耳曼之海"
 eburonian_missions_task_5_DESC:0 "[GetProvince('(int32)3026').GetName]港口将成为可怕的#E 埃布隆人#!不断增长的财产的良好补充——现在，他们应该知道当我们的外交官到达他们的宫廷时，我们会期待什么。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 eburonian_missions_task_6:0 "值得骄傲的事情"
 eburonian_missions_task_6_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]要求我们暂时停止对外战争，以便我们能够庆祝我们所获得的成果。虽然有些人对放弃我们的部落家园的裁决不满意，但我们已经决定离开Rhenus，前往Mare Germanicum的海岸--一个由铁和意志铸成的新国家的新首都。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 eburonian_missions_task_7:0 "对贝尔吉卡的要求"
 eburonian_missions_task_7_DESC:0 "虽然我们的人民经过这么多年无休止的征战已经疲惫不堪，但我们不能忘记我们神圣的誓言，要勇往直前--在我们将整个贝尔吉卡据为己有之前，我们的军队不能休息!向塞克纳河进军！\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 eburonian_missions_task_8:0 "不列颠商人"
 eburonian_missions_task_8_DESC:0 "#E [GetProvince('(int32)2022').GetArea.GetRegion.GetName]#! 岛是奇怪而野蛮的部落的家园，虽然他们的方式与我们非常不同，但我们渴望得到他们精美的贸易商品，并希望与岛民建立经济联系……但如果我们想穿越水域，我们需要一支合适的船队。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 eburonian_missions_task_9:0 "埃布隆人之城"
 eburonian_missions_task_9_DESC:0 "旅人啊，你可曾听闻北方虔诚的埃布隆人建造的美丽都城#E 科耳托里亚孔#!？纵使寻遍整个#E 高卢#!也难觅如此城池——虽众人皆道埃布隆人只善征战，然此城之繁盛足证其非仅止于此。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 me_belgae_1.a:0 "贝尔吉亚将被剑尖所刻!"
 me_belgae_10.a:0 "让周围的人讨厌我们，但愿神灵继续保佑我们"
 me_belgae_10_desc:0 "作为一个迷信的群体，[ROOT.GetCountry.GetAdjective]人不惜一切代价向战神献祭。意识到今生没有什么是确定的，[ROOT.GetCountry.GetRuler.GetName]已经把资助我们部落的宗教活动作为一个重点，希望能动摇神灵继续保佑我们的举措。#E Cortoriacum#!所做的事情就是这个政策的一个著名例子；在城市建设之前，在整个乡村的神庙里进行了一系列的祭祀活动。在土地得到仪式性的净化后，我们的建筑师和工程师们开始兴致勃勃地工作。"
 me_belgae_10_title:0 "埃布隆人之城"
 me_belgae_10_tooltip:0 "$mission_completed_tooltip_1$“#Y 埃布隆人之城#!”$mission_completed_tooltip_2$"
 me_belgae_11.a:0 "我不想和著名的[ROOT.GetCountry.GetRuler.GetFirstName]战斗；你呢？"
 me_belgae_11_desc:0 "近年来，[ROOT.GetCountry.GetRuler.GetName]的声誉突飞猛进；[ROOT.GetCountry.GetRuler.GetFirstName]不仅把#E Eburonia#! 带到了以前做梦都想不到的高度，我们英勇的部落首领也取得了个人的胜利，在决斗中战胜了[ROOT.GetCountry.GetRuler.GetHerHis]的对手。现在，每个人都在[ROOT.GetCountry.GetRuler.GetFirstName]周围踮着脚走，害怕一个误解的评论会导致互殴。"
 me_belgae_11_title:0 "最勇敢的比利其人"
 me_belgae_11_tooltip:0 "$mission_completed_tooltip_1$“#Y 最勇敢的比利其人#!”$mission_completed_tooltip_2$"
 me_belgae_12.a:0 "蜂蜜很好，但我的口味是蜂蜜酒--再给我拿个喇叭来！\"！"
 me_belgae_12_desc:0 "来到[GetProvince('(int32)3709').GetName]地区的游客常常被那片林地的果园和田地所吸引，因为那里的野花长得很茂盛；许多村民的头发都是用芳香的花朵编织成的褶子和辫子。但这里不仅仅有[GetProvince('(int32)3709').GetArea.GetRegion.GetName]的自然美景；这个地区有很多蜜蜂，它们制造出一种特殊的蜂蜜，这种蜂蜜是由到处生长的云杉的花粉调味的。"
 me_belgae_12_title:0 "特赖厄克图斯的蜜蜂农场"
 me_belgae_12_tooltip:0 "$mission_completed_tooltip_1$“#Y 特赖厄克图斯的蜜蜂农场#!”$mission_completed_tooltip_2$"
 me_belgae_13.a:0 "不要害怕，这些海盗现在为厄部罗尼亚工作。"
 me_belgae_13_desc:0 "在过去的几年里，[GetProvince('(int32)3843').GetName]的海盗们不分敌我，对任何愚蠢到不设防的城市进行袭击。虽然他们一直是我们的眼中钉，但[ROOT.GetCountry.GetRuler.GetName]已经宣布，我们将把这些强盗当作珍贵的客人。"
 me_belgae_13_title:0 "加努恩提斯海盗"
 me_belgae_13_tooltip:0 "$mission_completed_tooltip_1$“#Y 加努恩提斯海盗#!”$mission_completed_tooltip_2$"
 me_belgae_14.a:0 "当我下达行动命令时，我知道我在做什么!"
 me_belgae_14_desc:0 "所有声称[GetProvince('(int32)3712').GetName]一旦迁都到[GetProvince('(int32)3675').GetName]就会枯萎的声音都被迫自食其言，这让[ROOT.GetCountry.GetRuler.GetName]很开心。\生活在以前的首都；市场上仍然充满了在#E Rhenus#!捕到的新鲜鱼，现在每天都有船只从海岸向内陆行驶，从#E Cortoriacum#!甚至是遥远的[GetProvince('(int32)2022').GetArea.GetRegion.GetName]带来贸易货物--附近的[GetProvince('(int32)3714').GetName]港口从黎明到黄昏都很繁忙。\虽然[ROOT.GetCountry.GetRuler.GetFirstName]在胜利时通常是宽宏大量的，但今天[ROOT.GetCountry.GetRuler.GetSheHe]却在幸灾乐祸--幸好没有人感到恼火。"
 me_belgae_14_title:0 "莱茵河上的哈伦特姆"
 me_belgae_14_tooltip:0 "$mission_completed_tooltip_1$“#Y 莱茵河上的哈伦特姆#!”$mission_completed_tooltip_2$"
 me_belgae_15.a:0 "我们的人民必须增长他们的财产，而智慧是其中最大的财产。"
 me_belgae_15_desc:0 "[ROOT.GetCountry.GetCapital.GetName]的建设几乎已经完成；这一消息像一道闪电一样传遍了#E 贝尔吉卡#! 。曾经，我们的人民在河边覆盖着茅草的小屋里过着悲惨的生活，任凭风吹雨打，但现在，石头和木材的建筑为我们自豪的公民提供了庇护。众所周知，[ROOT.GetCountry.GetRuler.GetFirstName]具有超越视觉的天赋，在瞥见了厄部罗尼亚的未来后，他亲自下达了命令--所有人都赞成建造一个知识的圣殿。"
 me_belgae_15_title:0 "蛮族智慧"
 me_belgae_15_tooltip:0 "$mission_completed_tooltip_1$“#Y 蛮族智慧#!”$mission_completed_tooltip_2$"
 me_belgae_16.a:0 "如果我的剑臂不能击倒弗里西亚，愿我的剑臂枯萎!为武器而战!"
 me_belgae_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]突然在[ROOT.GetCountry.GetCapital.GetName]再次召开部落议事会，令众人措手不及——上次召开这样的会议还是在内战爆发之前。如今弑君之仇已报，此时召集会议究竟所为何事？\n\n以沉稳著称的[ROOT.GetCountry.GetRuler.GetFirstName]此刻正强压着满腔怒火，[ROOT.GetCountry.GetRuler.GetSheHe]声音哽咽地向在场众人说道：\"我们虽已为逝者复仇，但这远远不够。无辜者的鲜血仍在呼唤正义！#E 弗里斯兰人#!这些公然协助弑君者、将我们拖入战火的死敌，至今仍在肆意越过#E 莱努斯河#!侵扰我们的领土。长久以来，我因专注于安抚[ROOT.GetCountry.GetAdjective]子民而对他们一再忍让。但如今根基已稳，是时候清算这笔血债了——我们要让他们血债血偿，以十倍之数偿还他们对比利其族人犯下的每一桩暴行。\"\n\n[ROOT.GetCountry.GetRuler.GetFirstName]猛然拔剑出鞘，将利刃横于面前，立下庄严誓言。"
 me_belgae_16_title:0 "比利其的未来"
 me_belgae_16_tooltip:0 "$mission_completed_tooltip_1$“#Y 比利其的未来#!”$mission_completed_tooltip_2$"
 me_belgae_17.a:0 "时机已到；我们必须现在就做出这些行动"
 me_belgae_17_desc:0 "站在[ROOT.GetCountry.GetName]自豪的新旗帜下，[ROOT.GetCountry.GetRuler.GetName]已经宣布，[ROOT.GetCountry.GetRuler.GetSheHe]计划从头开始改革我们的[ROOT.GetCountry.GetAdjective]社会。\尽管有些人要求[ROOT.GetCountry.GetRuler.GetFirstName]将这些雄心勃勃的设计推迟到我们从战争中完全恢复之后，[ROOT.GetCountry.GetRuler.GetSheHe]一直坚持不懈--我们必须现在就行动，[ROOT.GetCountry.GetRuler.GetSheHe]认为，因为没有人知道明天会发生什么，而且目前的势头与我们有关。"
 me_belgae_17_title:0 "一个有改革意识的统治者"
 me_belgae_18.a:0 "我们不要急于求成，来和我讲讲道理吧!"
 me_belgae_18_desc:0 "甚至在[ROOT.GetCountry.GetRuler.GetName]有机会论证[ROOT.GetCountry.GetRuler.GetHerHis]的情况之前，少数部落首领已经站出来反对这些倡议，甚至不知道它们是什么，在它们到达议会之前就已经表明了他们的观点。[SCOPE.sCharacter('random_belgae_dude').GetName]的声音特别大，对[ROOT.GetCountry.GetRuler.GetName]越来越多的反对意见已经凝聚在这位有魅力的发言人周围。\正在发生的事情太多，而预兆告诉我们，我们需要放慢速度。难道[ROOT.GetCountry.GetRuler.GetFirstName]已经给我们的人民带来了足够的苦难，[ROOT.GetCountry.GetRuler.GetHerHis]前所未有的侵略战争还不够？此外，我们不相信[ROOT.GetCountry.GetRuler.GetFirstName]有领导我们人民的智慧，所以整个事情从一开始就注定了。'Although [ROOT.GetCountry.GetRuler.GetFirstName]被这种不服从的行为所激怒，[ROOT.GetCountry.GetRuler.GetSheHe]咬着[ROOT.GetCountry.GetRuler.GetHerHis]牙，欢迎酋长们坐到桌前。"
 me_belgae_18_title:0 "不同的声音"
 me_belgae_19.a:0 "谢谢你的支持，我的朋友......和我喝一杯吧"
 me_belgae_19_desc:0 "[ROOT.GetCountry.GetCapital.GetName]的议事会最终不欢而散，许多代表带着对[ROOT.GetCountry.GetRuler.GetName]的冲天怒火愤然离去。起初，[ROOT.GetCountry.GetRuler.GetFirstName]还耐心倾听不同意见，竭力保证各方畅所欲言。但当发现其他部落都不支持[ROOT.GetCountry.GetRuler.GetHerHim]时，会场很快演变成互相攻讦的闹剧。\n\n最激烈的指控，是有人怒斥[ROOT.GetCountry.GetRuler.GetFirstName]为满足[ROOT.GetCountry.GetRuler.GetHerHis]野心不惜屠杀同胞——这句诛心之言终于越过了底线。震怒之下，[ROOT.GetCountry.GetRuler.GetFirstName]当即下令驱逐所有与会者。\n\n几小时后，当[ROOT.GetCountry.GetRuler.GetFirstName]仍在寝宫中怒火中烧时，门外突然传来敲门声——来者正是[SCOPE.sCharacter('hail_emperor_fox').GetName]。\"陛下，\"[SCOPE.sCharacter('hail_emperor_fox').GetFirstName]沉声道，\"即便举世皆叛，仍有我等誓死追随。\""
 me_belgae_19_title:0 "狡猾的朋友，彻头彻尾"
 me_belgae_1_desc:0 "在#E [GetProvince('(int32)3712').GetArea.GetRegion.GetName]#!地区，这是一个严寒的夜晚，对一年中的这个时候来说是不太合时宜的，但[ROOT.GetCountry.GetRuler.GetName]似乎没有注意到寒意，因为[ROOT.GetCountry.GetRuler.GetSheHe]在[ROOT.GetCountry.GetRuler.GetHerHis]住宿的地板上踱步。[ROOT.GetCountry.GetRuler.GetFirstName]激动的原因很容易理解；一个宏伟的计划已经在[ROOT.GetCountry.GetName]的战争委员会中酝酿，一个将看到流血和破坏带到遥远的北方的计划，但即使是现在，仍然有一些犹豫--如果一切按照[ROOT.GetCountry.GetRuler.GetFirstName]的设计进行，那么许多人将失去生命。"
 me_belgae_1_title:0 "最勇敢的高卢人！"
 me_belgae_1_tooltip:0 "$mission_completed_tooltip_1$“#Y 最勇敢的高卢人！#!”$mission_completed_tooltip_2$"
 me_belgae_2.a:0 "我们将在十天内得到答复……"
 me_belgae_20.a:0 "你一定是在和我开玩笑......在我为贝尔吉亚做了这么多事之后？"
 me_belgae_20_desc:0 "有人管不住自己的舌头，[ROOT.GetCountry.GetRuler.GetName]的密探发现了一个血腥阴谋。[ROOT.GetCountry.GetCapital.GetName]那场灾难性的会议后，某些不忠的部落酋长竟暗中联络弗里西亚刺客，企图谋杀[ROOT.GetCountry.GetRuler.GetFirstName]及[ROOT.GetCountry.GetRuler.GetHerHis]全族！\n\n所幸我们及时揭露了这个卑劣阴谋，但愿为时未晚。"
 me_belgae_20_title:0 "阴谋败露 "
 me_belgae_21.a:0 "谁...请...谁...帮帮我..."
 me_belgae_21_desc:0 "傍晚时分，几乎是三更天，[ROOT.GetCountry.GetRuler.GetName]正在[ROOT.GetCountry.GetRuler.GetHerHis]的房间里努力工作，这时一个信使来了，脸颊通红，跑得气喘吁吁。\"我的酋长，你必须马上来--我们已经抓住了负责暗杀你的人。\"站起来，[ROOT.GetCountry.GetRuler.GetFirstName]面无表情地点点头，向走廊走去。当[ROOT.GetCountry.GetRuler.GetSheHe]转过一个角落时，[ROOT.GetCountry.GetRuler.GetHerHim]身后突然传来一阵骚动--疯狂地转过身来，[ROOT.GetCountry.GetRuler.GetFirstName]看到了弗里斯兰战斧的闪光，在它与[ROOT.GetCountry.GetRuler.GetHerHis]的脸连接的几秒钟前。有一个可怕的、湿漉漉的骨头碎裂声，[ROOT.GetCountry.GetRuler.GetFirstName]张开[ROOT.GetCountry.GetRuler.GetHerHis]嘴想尖叫，但只有鲜血涌出。当[ROOT.GetCountry.GetRuler.GetFirstName]倒在地上时，一群部落酋长走上前，举起匕首和斧头继续他们野蛮的工作。"
 me_belgae_21_title:0 "英雄之死"
 me_belgae_22.a:0 "我为将在这场无意义的战争中死去的[ROOT.GetCountry.GetName]的勇敢的儿子们哭泣。"
 me_belgae_22_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetName]危难之际继任大统，虽然新君登基本该举国欢庆，持续的内战却让所有庆典化为泡影。\n\n终有一日我们会纪念这个时刻，但现在，镇压叛族的黑暗任务迫在眉睫。"
 me_belgae_22_title:0 "比利时人对比利时人"
 me_belgae_23.a:0 "弗里西亚人不死绝，我誓不罢休！"
 me_belgae_23_desc:0 "当北方#E 弗里西亚人#!的领土宣称刚确立，[ROOT.GetCountry.GetRuler.GetName]就立即集结[ROOT.GetCountry.GetRuler.GetHerHis]征召兵——当天早晨[ROOT.GetCountry.GetCapital.GetName]郊外已响起集结号角。\n\n尽管[ROOT.GetCountry.GetName]国内有声音主张克制，认为跨越#E 莱茵河#!全面开战徒耗国力，但[ROOT.GetCountry.GetRuler.GetFirstName]已立下血誓——这位[ROOT.GetCountry.GetRulerTitle]誓要复仇到底。"
 me_belgae_23_title:0 "莱茵河不能阻止我们"
 me_belgae_2_desc:0 "在环顾四周并考虑了我们的选择之后，[ROOT.GetCountry.GetRuler.GetName]明智地决定对我们南部较弱的邻国施加压力。我们的特使已经离开了[ROOT.GetCountry.GetCapital.GetName]，但他们没有携带任何礼物；他们没有被毛皮重压，也没有带来金银手镯--不会有外交上的花哨，只有我们最后通牒的传递。"
 me_belgae_2_title:0 "南方战略"
 me_belgae_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y 南方战略#!' $mission_completed_tooltip_2$"
 me_belgae_3.a:0 "让我们为和平的决议祈祷，但要保持你们的剑锋。"
 me_belgae_3_desc:0 "北方#E 墨纳庇亚人#!与我族确有几分相似；临海而居使水上生活成为他们的日常。虽然我们感激#E 莱茵河#!让我们得以通往日耳曼海，但军方更希望不必依赖河道运输就能自由通行。\n\n墨纳庇亚人的答复随时将至——但愿他们能做出明智抉择。"
 me_belgae_3_title:0 "墨纳庇亚宣称"
 me_belgae_3_tooltip:0 "$mission_completed_tooltip_1$“#Y 墨纳庇亚宣称#!”$mission_completed_tooltip_2$"
 me_belgae_4.a:0 "很好，那么，[SCOPE.sCharacter('rups_belgae').GetFirstName]--我可能对你有帮助。"
 me_belgae_4_desc:0 "这天清晨，[ROOT.GetCountry.GetRuler.GetName]正在为即将出使#E 涅耳维亚#!的外交使团送行，人群聚集在[ROOT.GetCountry.GetCapital.GetName]城门口，目送使者们启程。许多民众默默祈祷此行能说服内尔维安人归顺，避免让[ROOT.GetCountry.GetName]再度陷入地区战争。\n\n就在[ROOT.GetCountry.GetRuler.GetFirstName]发表精彩演说时，人群中突然爆发一阵骚动。只见一个年轻男子奋力挤到最前排，来到部落首领面前单膝跪地，将佩剑举向[ROOT.GetCountry.GetRuler.GetFirstName]。\n\n\"我是[SCOPE.sCharacter('rups_belgae').GetName]，\"他高声说道，\"诸神在梦中向我昭示了预言——请允许我将佩剑献给未来的比利其人之王。恳请[ROOT.GetCountry.GetRuler.GetName]收下我的效忠！\""
 me_belgae_4_title:0 "触动神经"
 me_belgae_4_tooltip:0 "$mission_completed_tooltip_1$“#Y 触动神经#!”$mission_completed_tooltip_2$"
 me_belgae_5.a:0 "我们将把任何反对我们设计的人变成王室成员"
 me_belgae_5_desc:0 "[ROOT.GetCountry.GetRuler.GetName]今天早上心情很好，毫无疑问，他感受到了我们军事行动的势头--我们的邻国一个接一个地倒在[ROOT.GetCountry.GetRuler.GetHerHis]的剑下，正如预期的那样。虽然有些人可能对奴役他们的表亲有顾虑，但[ROOT.GetCountry.GetAdjective]没有这样的道德弱点--任何抵抗我们意图的人都会遇到类似的命运。"
 me_belgae_5_title:0 "奴役比利其人"
 me_belgae_5_tooltip:0 "$mission_completed_tooltip_1$“#Y 奴役比利其人#!”$mission_completed_tooltip_2$"
 me_belgae_6.a:0 "通过陆地和海洋，我们的部队将摧毁任何抵抗"
 me_belgae_6_desc:0 "我们已向#E 莫里尼安人#!发出最后通牒，内容与其他比利其部落收到的完全一致。希望他们能从我们最近的战事中吸取教训，做出明智抉择——尽管在这动荡的世道中，谁也无法保证结果如何。"
 me_belgae_6_title:0 "日耳曼之海（Mare Germanicum"
 me_belgae_6_tooltip:0 "$mission_completed_tooltip_1$“#Y 日耳曼之海#!”$mission_completed_tooltip_2$"
 me_belgae_7.a:0 "我们在此圣化这片浸染过比利其人鲜血的土地。"
 me_belgae_7_desc:0 "一支庄严的队伍正跟随[ROOT.GetCountry.GetRuler.GetName]，因为[ROOT.GetCountry.GetRuler.GetSheHe]正在标出我们在[GetProvince('(int32)3675').GetName]的新定居点的边界。这是[ROOT.GetCountry.GetName]历史上的一个重要时刻，因为迁都的决定不是[ROOT.GetCountry.GetRuler.GetFirstName]轻易做出的。有些人会想[GetProvince('(int32)3712').GetName]，但在这个神圣的日子里，他们却把这些情绪藏在心里--因为很明显，Eburonia的未来与#E Cortoriacum#!有关。"
 me_belgae_7_title:0 "值得骄傲的事情"
 me_belgae_7_tooltip:0 "$mission_completed_tooltip_1$“#Y 值得骄傲的事情#!”$mission_completed_tooltip_2$"
 me_belgae_8.a:0 "贝尔吉卡必须是我们的--没有其他选择！"
 me_belgae_8_desc:0 "一个熟悉的场景正在[ROOT.GetCountry.GetCapital.GetName]发生，这已经成为Eburones首都经常发生的事情；[ROOT.GetCountry.GetRuler.GetName]正在向[ROOT.GetCountry.GetRuler.GetHerHis]的外交官讲话，他们准备把我们的最后通牒带到我们敌人的城市。只有时间能证明他们是否会和平地屈服，但我们的军队已经准备好应对他们的任何行动。"
 me_belgae_8_title:0 "对贝尔吉卡的要求"
 me_belgae_8_tooltip:0 "$mission_completed_tooltip_1$“#Y 对贝尔吉卡的要求#!”$mission_completed_tooltip_2$"
 me_belgae_9.a:0 "对Eburonia和她的人民来说，只有最好的东西才是足够的!"
 me_belgae_9_desc:0 "由于我们与[GetProvince('(int32)2022').GetArea.GetRegion.GetName]的贸易关系，在[ROOT.GetCountry.GetCapital.GetName]的商店里可以找到几个月前还找不到的各种异国商品；琥珀制成的饰品、锡锭和精美的毛皮都可以在市场的摊位上出售。值得庆幸的是，所有的东西通常都令[ROOT.GetCountry.GetRuler.GetFirstName]满意--这让小贩们松了一口气，他们不想激怒这位传奇的部落酋长。"
 me_belgae_9_title:0 "不列颠商人"
 me_belgae_9_tooltip:0 "$mission_completed_tooltip_1$“#Y 不列颠商人#!”$mission_completed_tooltip_2$"
 me_belgae_ultimatum.2.tt:0 "我们已经向拒绝我们要求的#Y $belgae_group$#!部落宣战。"
 me_belgae_ultimatum_1.a:0 "这并不重要......我们最终将取得胜利。"
 me_belgae_ultimatum_1.b:0 "我们欢迎那些拥抱我们的人，摧毁那些拒绝我们的人。"
 me_belgae_ultimatum_1_desc:0 "我们的敌人意识到他们永远无法指望在战场上击败我们，因此将他们的自由交给了我们，只要求我们善待他们，不要滥用我们的权力。"
 me_belgae_ultimatum_1_title:0 "比利其人臣服"
 me_belgae_ultimatum_2.a:0 "告诉我们的部落成员，为可能到来的一切做好准备!"
 me_belgae_ultimatum_2_desc:0 "我们派往比利其邻邦的外交使节未能竟全功——但这正合[ROOT.GetCountry.GetRuler.GetName]之意，[ROOT.GetCountry.GetRuler.GetHerHis]眼中燃烧的征服欲望反而更盛。世间从无易事，但任何胆敢阻挡我们的势力，都必将被碾为齑粉！"
 me_belgae_ultimatum_2_title:0 "浴血比利其"
 me_belgae_ultimatum_send.tt:0 "我们将向每一个高亮的国家发出 \"最后通牒\"，要么接受我们的最高统治，要么面临战争。"
 random_belgae_port_bonus:0 "#Y 我们在#!#T 比利时地区#!#Y 的港口将获得永久贸易修正#!。"
 random_belgae_port_bonus2:0 "#Y 我们在#!#T 比利时地区#!#Y 的港口将获得永久贸易修正#!。"
 you_need_to_form_belgia:0 "我们需要做出决定，#Y 统一贝尔吉亚#!。"

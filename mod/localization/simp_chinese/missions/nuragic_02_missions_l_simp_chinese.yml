l_simp_chinese:
 ISLAND_EMPIRE_ADJECTIVE:0 "第勒尼安"
 ISLAND_EMPIRE_NAME:0 "第勒尼尼亚"
 ISLAND_KINGDOM_ADJECTIVE:0 "联盟"
 ISLAND_KINGDOM_NAME:0 "海上联盟"
 TYRSENIA_FLAG:0 "第尔塞尼亚的辉煌旗帜"
 access_black_sea:0 "努拉吉克普罗庞提斯"
 alouka_invasion_port_mod:0 "军事港"
 ancestors_avenged:0 "先祖复仇"
 blood_of_forcos:0 "福耳科斯的血脉"
 blood_of_forcos_desc:0 "福耳科斯曾是撒丁岛与科西嘉的统治者；他在第勒尼安海的一场海战中覆灭，随后又被阿特拉斯王连同其大部分军队射杀，他的同伴于是想象他化身为海神。长久以来被认为已经失落的血脉，如今从时间的阴影中归来。"
 bold_raider:0 "大胆的突击者"
 bronze_measure_tt:0 "我们的首都需要#Y 提升基础设施#!省份投资。"
 bustling_port:0 "热闹的港口"
 carthage_raiders:0 "迦太基人的突袭"
 corsian_wood:0 "科西嘉的木材"
 desc_access_black_sea:0 "控制黑海入口的战略要地给我们带来了巨大的利益。"
 desc_alouka_invasion_port_mod:0 "该行省有一个设防的军港，专门用于建造用于对外入侵的船只。"
 desc_ancestors_avenged:0 "我们的人民终于成功地为我们的先辈复仇——肮脏的布匿压迫者不复存在。"
 desc_bold_raider:0 "我们喜欢在没有任何警告的情况下袭击我们的敌人，我们对突然袭击的嗜好让全世界都感到恐惧。"
 desc_bustling_port:0 "由于我们明智的投资，我们的主要港口城市正在经历繁荣时期，并将在未来几年内继续这样做。"
 desc_carthage_raiders:0 "因为我们是可恨的迦太基人的永远的敌人，我们允许我们的海军突袭和掠夺他们的海岸而不受惩罚。"
 desc_corsian_wood:0 "科西嘉岛广阔的未开发森林是我们造船材料的主要来源。"
 desc_eastern_scourge:0 "我们的船只随心所欲地袭击埃及、叙利亚和安纳托利亚的港口和海岸线，当地势力无法阻止。"
 desc_empress_seas:0 "我们的首都，由于我们基础设施的快速扩张，赢得了'海洋女皇'的绰号；这是我们影响力不断增长的证明。"
 desc_experienced_seahands:0 "因为我们为我们的水手制定了一套严格的训练制度，他们比一般的甲板工人有更多的经验。"
 desc_forever_doomed:0 "该地区的当地人认为这片土地是被诅咒的，曾经是一个伟大魔鬼的居所，其名字已从历史中抹去。"
 desc_great_nuraghe:0 "坐落在首都的景观中，多叶形努拉格傲然矗立——一个由二十座塔楼错综复杂连接而成的古老奇迹。其中心塔楼高达三十米，证明了努拉吉克文明的工程实力和文化意义。石雕低语着神秘过去的故事，邀请游客沉浸在他们的亲族历史之谜中。"
 desc_greek_tutors:0 "我们已经决定，博学的希腊人将是我们年轻人最好的导师，在我们的家庭中有许多受过教育的奴隶。"
 desc_iberian_king:0 "伊比利亚祖先的大部分土地已落入我们的坚实手中，伊比利亚人自己也广泛接受我们作为他们唯一的统治者。"
 desc_indian_trade:0 "我们的水手在航行到世界的最边缘后又返回，在印度的土地上建立了宝贵的贸易关系。"
 desc_into_ashes:0 "这个曾经的定居点已被化为灰烬，一块一块石头地细致拆除。整个地区是一片不毛之地、难以辨认的废墟和无名的未埋葬尸骨的令人不快的景象。"
 desc_intrepid_explorers:0 "众所周知，我们的水手无所畏惧，勇往直前，勇往直前地航行。"
 desc_iron_weapons_sardana:0 "我们利用伊尔瓦矿山中发现的铁来为我们的征召兵装备强大的武器。"
 desc_liburnian_sailors:0 "几个世纪以来掌握了亚得里亚海，利部耳尼亚人的航海经验将服务于我们的目标。"
 desc_mines_of_ilva:0 "复杂的矿井网络覆盖了整个岛屿——那里开采的铁在附近的浦普路纳港加工，准备出口。"
 desc_numidian_auxilia:0 "技艺高超的努米底亚骑兵现在是我们军队的组成部分。"
 desc_nuragic_colony:0 "由我们忠诚的子民定居，这个地方因我们的文化和传统而繁荣。"
 desc_nuragic_emporie_glass_workshops:0 "在努拉吉克商人投资的推动下，当地的玻璃吹制大师在恩波里翁建造了令人印象深刻的大型工坊。"
 desc_nuragic_gymnaesia_consolidation_mod:0 "在这座迷人城市的中心，坐落着努拉吉克官僚行政总部，致力于确保高效的行政管理，并坚定不移地致力于在该地区培育和谐繁荣的社区。"
 desc_nuragic_laconian_farm:0 "努拉吉克入侵者在该地区建立了农业基础设施，希望从希腊的土地上尽可能多地获取谷物。"
 desc_nuragic_mining_pupluna:0 "由于从附近的伊尔瓦岛进口了大量铁到浦普路纳，努拉吉克商人投资了这里的铸造厂以加工矿石。"
 desc_nuragic_wineries:0 "这些行省中的伊特鲁里亚酿酒师在努拉吉克商人的帮助下建造了专门的工坊，专注于生产高档葡萄酒。"
 desc_pacified_sicily:0 "虽然这是一个艰难的努力，但我们能够清除西西里岛上的土匪和叛军，在最近的记忆中第一次为这个动荡的岛屿带来和平。"
 desc_roman_raiders:0 "因为我们在水上与强大的罗马人作战，所以我们随意袭击他们的海岸和港口--我们对他们没有任何恐惧。"
 desc_sardana_sea:0 "如同我们的先辈在力量巅峰时一样，我们现在控制了'大绿海'的西半部，因此再次被称为萨达那之海——撒丁海，我们的海。"
 desc_slave_markets:0 "我们毫无顾忌地出售我们在多次突袭中捕获的俘虏，在我们的许多奴隶市场上，生意非常兴隆。"
 desc_tower_islands:0 "我们的人民终于成功重新统一了我们以前的领土；压迫者的锁链已被打破，我们祖先的活力已被释放！"
 desc_we_will_succeed:0 "我们的战士受到宗教热情的感染，准备在他们先辈很久以前失败的地方取得成功。"
 dragon_blood_sceptre:0 "龙血权杖"
 dragon_blood_sceptre_desc:0 "一根由象牙精制而成的法杖，柄部有一颗鹅蛋大小的血红色宝石，作为礼物从遥远的索科特拉王国送来。"
 eastern_scourge:0 "东方的祸害"
 empress_seas:0 "海洋的皇后"
 empress_seas_tt:0 "我们首都城市需要#Y Province Fortifications#!。"
 expanded_port_tt:0 "我们的首都需要#Y 宗教捐赠#!省份投资。"
 experienced_seahands:0 "经验丰富的甲板工人"
 forever_doomed:0 "永受咒诅"
 great_nuraghe:0 "大努拉克"
 greek_tutors:0 "希腊导师"
 iberian_king:0 "伊比利亚之王"
 indian_trade:0 "印度贸易"
 into_ashes:0 "化为灰烬"
 intrepid_explorers:0 "无畏的探险家"
 iron_weapons_sardana:0 "伊尔瓦的铁矿"
 liburnian_sailors:0 "利部耳尼亚水手"
 me_nuragic_02_inv_1.a:0 "终于，我们有了一个合适的首都，一个配得上我们人民的首都"
 me_nuragic_02_inv_10.a:0 "军团将永远不会踏上我们的岛屿......摧毁他们的舰队"
 me_nuragic_02_inv_10_desc:0 "罗马人，我们在西地中海的权力对手，公开对我们作为海上强国的地位感到不满，尤其对我们的突击队感到烦恼；罗马元老院提交的官方投诉数量已经令人厌烦。起初，这些信笺礼貌地要求我们控制我们的人，如果我们听从他们的吩咐，就给我们一个'罗马之友'的官方身份，当这种愚蠢的恳求被视为愚蠢而被忽视时，这些信笺变得越来越有攻击性。\n\n最后，当一位新当选的执政官在我们的外交沉默中发出入侵的威胁时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]意识到战争是不可避免的，与其等待罗马之鹰降落在我们的海岸，不如决定在这只鸟还没有机会飞的时候就把它的翅膀剪掉。"
 me_nuragic_02_inv_10_title:0 "$nuragic_mission_02_inv_task_10$"
 me_nuragic_02_inv_10_tooltip:0 "#R 我们将立即宣告一场海军优势战争！#! $mission_completed_tooltip_1$“#Y $nuragic_mission_02_inv_task_10$#!”$mission_completed_tooltip_2$"
 me_nuragic_02_inv_11.a:0 "我们将在短时间内征服该省"
 me_nuragic_02_inv_11_desc:0 "在[GetProvince('(int32)94').GetName]成功建立了滩头堡，这无疑是这次努力中最困难的部分，我们完成对西卡尼亚省其他地区的要求只是时间问题。当我们的人在西西里的山丘和田野上就位时，我们把脸转向传说中的城市[GetProvince('(int32)84').GetName]的城墙......不久之后，我们的军队就会驻扎在城墙之外。"
 me_nuragic_02_inv_11_title:0 "$nuragic_mission_02_inv_task_11$"
 me_nuragic_02_inv_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_11$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_12.a:0 "我们的敌人在看着我们，希望看到我们失败。我们将拒绝他们的乐趣"
 me_nuragic_02_inv_12_desc:0 "虽然我们此时已经拿下了许多城市，但在准备对[GetProvince('(int32)84').GetName]的战役时，我们的人感到一丝惶恐不安。封锁一个迦太基港口或在一个小岛上登陆是一回事，但洗劫像[GetProvince('(int32)84').GetName]这样的著名城市呢？如果我们能够取得这样一场令人印象深刻的胜利，我们的声誉将得到牢固的确立。我们在这里能够取得的成就将在全世界引起震动；愿战争之神在这一天向我们微笑！"
 me_nuragic_02_inv_12_title:0 "$nuragic_mission_02_inv_task_12$"
 me_nuragic_02_inv_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_12$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_13.a:0 "祈祷我们不要夺取迦太基本身！"
 me_nuragic_02_inv_13_desc:0 "据说在晴朗的日子里，从[GetProvince('(int32)3254').GetName]岛上的最高处可以看到[GetProvince('(int32)1470').GetName]的城市--这就是这个小小的港口离北非海岸的距离。当我们一次又一次地与迦太基人发生冲突，残酷地将他们的财产剥离给自己时，我们又要对[GetProvince('(int32)3256').GetName]的公民发动一场战争。如果我们能够把他们从他们海岸边的小岛上驱逐出去，我们的突击队将能够不受阻碍地骚扰他们的航运，这对我们的底线将是非常有利可图的。"
 me_nuragic_02_inv_13_title:0 "$nuragic_mission_02_inv_task_13$"
 me_nuragic_02_inv_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_13$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_14.a:0 "这一切都非常有趣......"
 me_nuragic_02_inv_14_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们有好消息要分享!我们的船只在勘察了西地中海之后回来了，他们在那里一直被迦太基的战舰跟踪。看来，布匿的恶棍们渴望击沉我们的舰队，但却没能抓住我们，这是个福音，我们很感激。我们的侦察员报告说，他们最远航行到海格力斯之柱，然后折返，不想再驶入大洋的深海。我们的军事顾问建议我们将海神柱据为己有；如果我们能够确保穿越，我们将能够严重限制迦太基进入伊比利亚半岛的能力。"
 me_nuragic_02_inv_14_title:0 "$nuragic_mission_02_inv_task_14$"
 me_nuragic_02_inv_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_13$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_15.a:0 "结交新朋友是一个值得庆祝的理由！"
 me_nuragic_02_inv_15_desc:0 "巨大的消息，o [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]!我们的探险家们从另一次冒险中回来了，他们的故事不得不让人相信!从[GetProvince('(int32)3061').GetName]的城市出发，我们的舰队紧贴伊比利亚的海岸线，沿着海岸线一直走到高卢土地的最边缘，在一个被称为Osisimia的地区。在[GetProvince('(int32)2151').GetName]的港口停下补给，我们的海军将领被告知北方有[GetProvince('(int32)2000').GetArea.GetRegion.GetName]的岛屿，并希望亲自看看它，因此比以前航行得更远。\n几个月后，在绕过整个岛屿后（对我们国家来说是一个令人印象深刻的成就），我们的人最终到达了Mare Hibernicum中的[GetProvince('(int32)2108').GetName]小岛，在那里他们被迫停下来寻找淡水。就在那里，他们遇到了一个当地部落的人，一个叫诺夫的农民，他把他们带到了定居点，并把我们介绍给了这个小部落的统治者。在我们的人乘风破浪之前，双方交换了愉快的心情和礼物，渴望分享他们的发现。"
 me_nuragic_02_inv_15_title:0 "$nuragic_mission_02_inv_task_15$"
 me_nuragic_02_inv_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_16$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_16.a:0 "告诉我们的新朋友，我们深深感谢他们的善意"
 me_nuragic_02_inv_16_desc:0 "今天早上，[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的港口发生了巨大的混乱，因为一支被殴打的船队在黎明时分返回。骚乱是如此激烈，以至于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]认为我们一定是受到了攻击，赶到滨水区进行防守。在一个奇怪的转折中，我们的喇叭似乎没有吹响嘹亮的号角，警告我们的驻军有危险，而是在庆祝一支远征军的到来，这是一支我们多年前派出的远征军，长期以来被认为是在海上失踪了。他们的故事很难让人相信，如果不是他们带回来的礼物，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]会把他们的故事当成谎言。\n\n最后，我们的东部探险队比我们派往西部的探险队要小，这是一种幸运，因为我们的探险家过得很辛苦。我们的外交姿态被沿途遇到的许多城市拒绝，他们拒绝让我们的船只停靠在他们的港口，有一次，来自[GetProvince('(int32)516').GetArea.GetRegion.GetName]的海军毫无顾忌地袭击了我们的人，将他们无情地驱散。我们的水手发现回家的路被堵住了，被迫向东航行得更远，以某种方式设法逃脱埃及人的追捕。\n\n随着时间的推移，我们的船队沿着Arabicus河航行，越来越担心他们将永远无法活着回到[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]。当所有的希望都破灭时，一个绝对的奇迹发生了；在[GetProvince('(int32)7530').GetArea.GetRegion.GetName]的土地附近，我们的人遇到了来自[GetProvince('(int32)7530').GetArea.GetName]岛的贸易舰队，他们看到我们可怜的状况后，邀请他们回到自己家里去。听到他们的冒险经历后，[GetProvince('(int32)7530').GetName]的居民惊叹不已，表示他们希望看到我们的水手安全回家。他们承诺建立友谊，为我们的船只提供补给，并将他们的一件宝物送给我们，嘱咐我们回家并分享他们的故事。\n\n这么多年过去了，他们就是这么做的。"
 me_nuragic_02_inv_16_title:0 "$nuragic_mission_02_inv_task_16$"
 me_nuragic_02_inv_16_tooltip:0 "#Y 龙血权杖#!已加入我们的宝物库。$mission_completed_tooltip_1$“#Y $nuragic_mission_02_inv_task_16$#!”$mission_completed_tooltip_2$"
 me_nuragic_02_inv_17.a:0 "增长我们的贸易联系是一件美味的事情"
 me_nuragic_02_inv_17_desc:0 "随着我们与[GetProvince('(int32)7530').GetName]的快速朋友的联系不断加强，他们邀请我们的一些商人陪同他们进行他们自己的一次贸易任务。这片遥远的土地，我们的学者建议我们被希腊人称为'塔布罗班'，但我们的人却不知道，如果不是我们来自索科特拉的向导，我们永远无法找到这个地点。起初，当被告知费用时，我们对这样的承诺犹豫不决，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]不同意，并推动了这项倡议。\n\n在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，当第一批贸易船从[GetProvince('(int32)6971').GetArea.GetRegion.GetName]出发，船舱被异国货物塞得满满的，这是一个令人兴奋的日子。虽然我们的人民对带入市场的毛皮、琥珀和宝石特别满意，但最大的需求是来自那些遥远海岸的香料；我们的国家似乎对豆蔻、胡椒、丁香、肉豆蔻和香草等芬芳的美食产生了贪婪的胃口。"
 me_nuragic_02_inv_17_title:0 "$nuragic_mission_02_inv_task_17$"
 me_nuragic_02_inv_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_17$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_18.a:0 "我敌人的朋友就是我的敌人......准备开战"
 me_nuragic_02_inv_18_desc:0 "克里特岛正北的岛屿，也就是当地人所说的基克拉迪群岛，已经为我们在[GetProvince('(int32)84').GetArea.GetName]和[GetProvince('(int32)351').GetArea.GetName]的许多战争难民打开大门。尽管我们礼貌地要求立即交出任何犯罪分子，并明确表示除非绝对被迫，否则我们不希望与他们进行军事接触，但傲慢的岛民对我们的使节完全不尊重，近乎侮辱。除非有所行动，否则我们的后院将会有一个抵抗的温床，这是不可接受的。"
 me_nuragic_02_inv_18_title:0 "$nuragic_mission_02_inv_task_18$"
 me_nuragic_02_inv_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_18$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_19.a:0 "我们不会容忍叛军在乡下游荡"
 me_nuragic_02_inv_19.b:0 "光荣的城市[GetProvince('(int32)84').GetArea.GetName]将成为我们的新首都..."
 me_nuragic_02_inv_19_desc:0 "虽然我们彻底征服了西西里岛，但这并不意味着居民们和平地服从了新的现状。相反，一些西西里希腊人认为我们在他们岛上的存在只是暂时的，他们在山上建立了阵地，从他们的秘密营地袭击我们的定居点，并普遍造成了滋扰。由于知道这是一个无法维持的状态，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]在整个西卡尼亚山脉派出了武装小队，在那里对煽动者进行了缓慢但坚决的战争。尽管在时间和人力方面的代价都很严重，但我们最终还是把西卡诺特的走狗带到了跟前。\n\n有人质疑，为什么[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]要投入这么多时间来准备这个岛屿……[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]真正追求的是什么目标？"
 me_nuragic_02_inv_19_title:0 "$nuragic_mission_02_inv_task_19$"
 me_nuragic_02_inv_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_19$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_1_desc:0 "经过许多个月的建设，期间我们似乎会无数次地超出预算，今天我们收到消息，工程终于在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]完成了。有一个沿海城市作为首都有很多好处，我们的船只可以直接在我们的港口卸货，我们的士兵也能在第一时间起航前往外国海岸。\n\n虽然我们付出了巨大的代价，但似乎[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的设想是有先见之明的，因为我们毫不怀疑[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]注定要获得永恒的荣耀。"
 me_nuragic_02_inv_1_title:0 "$nuragic_mission_02_inv_task_1$"
 me_nuragic_02_inv_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_1$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_2.a:0 "我们的情况还不错，但还有工作要做"
 me_nuragic_02_inv_20.a:0 "当我们带来和平时，和平将来到[GetProvince('(int32)368').GetArea.GetName]"
 me_nuragic_02_inv_20_desc:0 "[GetProvince('(int32)368').GetArea.GetName]是一个充满争吵的城邦的岛屿，每个城邦都在与他们的邻居进行痛苦的死亡斗争。每年夏天，在竞选季节，克里特军队都不可避免地走上战场，互相攻击，然后退到城墙后面舔舐他们的伤口。因此，小霸王们付出了巨大的代价，获得了微小的收益，只是在第二年不可避免的反击中，他们的命运被逆转了。\n\n克里特人被他们的内部争吵所困扰，他们从来没有注意到我们在做什么......"
 me_nuragic_02_inv_20_title:0 "$nuragic_mission_02_inv_task_20$"
 me_nuragic_02_inv_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_20$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_21.a:0 "将无法逃避即将到来的厄运"
 me_nuragic_02_inv_21_desc:0 "法老的记录声称，一个被称为迦弗托人或佩勒塞特的民族曾从[GetProvince('(int32)368').GetArea.GetName]扬帆出海，袭击埃及海岸，带来死亡和毁灭，然后满载战利品和奴隶返回他们的船只。埃及人非常害怕这些所谓的'海族'，他们在整个家园周围雕刻石碑，警告这些可怕的袭击者的回归。\n\n也许，一旦我们为自己夺取了克里特岛，我们将通过使他们最可怕的噩梦成为现实来给这些埃及人一个终生难忘的惊吓！"
 me_nuragic_02_inv_21_title:0 "$nuragic_mission_02_inv_task_21$"
 me_nuragic_02_inv_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_21$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_22.a:0 "[GetProvince('(int32)266').GetName]的独立已经完成......"
 me_nuragic_02_inv_22_desc:0 "在最近的记忆中，[GetProvince('(int32)266').GetName]的居民被围困了，他们美丽的岛屿被安提柯的军队包围，然后他们被迫撤退，没有夺取城市。似乎罗得斯人醉心于他们的傲慢和成功的眩晕，借此机会发展他们的利益，认为他们致命的危险的日子已经过去了。\n\n想象一下他们脸上的表情，然后，当我们的攻城引擎占据了曾经由安提戈诺斯-莫诺菲洛斯的儿子德米特里欧斯建造的可怕机器所占据的位置。不过，我们和安提戈诺人有一个区别；我们将在波利奥塞特斯失败的地方取得胜利！"
 me_nuragic_02_inv_22_title:0 "$nuragic_mission_02_inv_task_22$"
 me_nuragic_02_inv_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_22$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_23.a:0 "从巴利阿里群岛到塞浦路斯，所有的岛屿都属于我们"
 me_nuragic_02_inv_23.b:0 "我们将不给敌人任何警告--进攻！"
 me_nuragic_02_inv_23_b_tooltip:0 "#R 我们将立即开战！#! 任务“#Y $nuragic_mission_02_inv_task_23$#!”现已#G 完成#!!"
 me_nuragic_02_inv_23_desc:0 "我们的古老资料中提到了一个被称为Denyen的神秘海族，他们在[GetProvince('(int32)1883').GetArea.GetName]的海岸建立了基地，然后出海征服了[GetProvince('(int32)330').GetArea.GetName]的岛屿。正是在这里，他们从他们在东地中海的有利位置，让黎凡特的定居者生活得很痛苦，摧毁了新兴的文明，为他们的名字带来了持久的声誉。\n\n是的，所有这些听起来都很可爱——是时候重温那些辉煌的日子了。"
 me_nuragic_02_inv_23_title:0 "$nuragic_mission_02_inv_task_23$"
 me_nuragic_02_inv_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_23$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_24.a:0 "我们的下一代领导人将由世界上最好的导师来教导"
 me_nuragic_02_inv_24_desc:0 "我们的对外战争使我们与地中海的伟大文明发生了接触，如果不是公开冲突的话，虽然我们制服了任何我们决心要克服的敌人，但我们并没有故意盲目到不承认我们的对手所擅长的领域。\n\n当涉及到哲学、修辞学和艺术问题时，很少有人能与希腊人相比；他们的智慧为全世界所熟知，而我们必须为自己掌握这些知识。我们知道我们可以选择谁来教育我们的孩子，所以我们决定选择博学的希腊人。我们希望，假以时日，我们将以自己的事迹甚至超越这些知识巨匠。"
 me_nuragic_02_inv_24_title:0 "$nuragic_mission_02_inv_task_24$"
 me_nuragic_02_inv_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_24$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_25.a:0 "是时候创造历史了"
 me_nuragic_02_inv_25_desc:0 "我们民族的长老们讲述了一个故事，一个连最年轻的人都耳熟能详的神奇故事--海族的传说。几百年前，在我们还不知道文字艺术的时候，一个强大的航海国家联盟，包括我们遥远的祖先，带着对东方强大王国发动战争的严峻目的联合起来。许多文明都被海族的军队蹂躏得奄奄一息，他们对弱者毫不留情，留下了首都和要塞的灰烬。\n\n正如他们出现的速度一样，海族从历史上消失了，在文明的土地上留下了彻底的混乱，他们不知道这些野蛮人从哪里来，从哪里回去。随着时间的推移，痛苦的记忆渐渐变成了寓言，海族人成了一个妖怪，一个让孩子们安静下来的可怕故事。\n\n但有些故事是永远不会被遗忘的--事实上，这样做是非常危险的。"
 me_nuragic_02_inv_25_title:0 "海洋民族的回归"
 me_nuragic_02_inv_25_tooltip:0 "愿我们的敌人在看到我们的船在地平线上时感到颤抖！"
 me_nuragic_02_inv_26.a:0 "我感谢这些小小的祝福……"
 me_nuragic_02_inv_26_desc:0 "我们在[ROOT.GetCountry.GetCapital.GetName]收到消息，我们殖民#E 科西嘉#!边境的努力已经完成，许多[ROOT.GetCountry.GetAdjective]同胞离开他们的祖屋，看看在一个陌生的行省生活会有什么不同。\n\n幸运的是，我们预计我们的人民和当地人之间不会有任何冲突。"
 me_nuragic_02_inv_26_title:0 "$nuragic_mission_02_inv_task_26$"
 me_nuragic_02_inv_26_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_26$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_27.a:0 "密切关注[GetProvince('(int32)3511').GetName]，因为[ROOT.GetCountry.GetName]正在策划着什么……"
 me_nuragic_02_inv_27_desc:0 "今天早上，一些好消息传到[ROOT.GetCountry.GetCapital.GetName]，由在[GetProvince('(int32)3511').GetName]工作的兴高采烈的工程师们发送。他们高兴地报告说，[ROOT.GetCountry.GetRuler.GetName]下令建造的#E 军港#!终于完工了，该港口已成为#E 科西嘉岛#!上活动的热点。\n\n然而，消息在这些地方传播得很快，有许多间谍穿行于[ROOT.GetCountry.GetAdjective]城市和定居点。他们送回家的密信总是说同样的事情……"
 me_nuragic_02_inv_27_title:0 "$nuragic_mission_02_inv_task_27$"
 me_nuragic_02_inv_27_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_27$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_28.a:0 "当建造舰队的时候，这些科西嘉木材将派上用场"
 me_nuragic_02_inv_28_desc:0 "终于，我们征服了那些抵抗我们在#E 科西嘉岛#!存在的人。\n\n我们为自己夺取了许多丰富的战利品；我们现在可以无限制地进入岛上的原始森林，这是[ROOT.GetCountry.GetRuler.GetName]特别感激的恩惠。[ROOT.GetCountry.GetAdjective]的斧头和参天大树倒下的声音将在林地中回响，珍贵的木材货物被运往[ROOT.GetCountry.GetName]的港口。"
 me_nuragic_02_inv_28_title:0 "$nuragic_mission_02_inv_task_28$"
 me_nuragic_02_inv_28_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_28$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_29.a:0 "一个好的领导者不是独自站立的，而是依靠许多人的帮助"
 me_nuragic_02_inv_29_desc:0 "我们胜利的军队征服了[GetProvince('(int32)1464').GetName]，为[ROOT.GetCountry.GetAdjective]战士带来了永恒的荣耀，并大大提高了[ROOT.GetCountry.GetRuler.GetName]的声望，许多人说正是他独自领导我们走到这一刻。"
 me_nuragic_02_inv_29_title:0 "$nuragic_mission_02_inv_task_29$"
 me_nuragic_02_inv_29_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_29$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_2_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]已经在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的港口下了一整个上午，伴随着一小队副官、高级顾问和我们的高级将领们。我们的精英们正在进行的业务具有敏感的性质；我们的海军部队正在被从上到下检查，以确保我们处于完全的军事准备状态。[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]异常安静，[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]心思全在手头的工作上。\n\n当太阳开始沉入地平线以下，使[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]港口的水域闪烁着粉红色和橙色的色彩时，工作被迫停止，使疲惫不堪的军官们松了一口气。当疲惫的队伍赶回城市时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]终于提出了一个评估。"
 me_nuragic_02_inv_2_title:0 "$nuragic_mission_02_inv_task_2$"
 me_nuragic_02_inv_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_2$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_3.a:0 "我们将不给我们的敌人任何机会！"
 me_nuragic_02_inv_30.a:0 "这是流泪的日子，但并不都是悲伤的……"
 me_nuragic_02_inv_30_desc:0 "今天早上出现了一幅奇特的景象，[ROOT.GetCountry.GetRuler.GetName]即使事关[ROOT.GetCountry.GetRuler.GetHerHis]性命也不会错过。\n\n源源不断的移民，他们的世俗财产装载在驮畜上或装在麻袋里，从#E 撒丁岛#!的心脏地带出发，前往岛上的众多港口之一。他们的最终目的地是最近更名的[GetProvince('(int32)1469').GetName]；这是努拉吉克在这些地区复兴的标志。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]已尽[ROOT.GetCountry.GetRuler.GetHerHis]所能确保殖民者在新家过上舒适的生活，但看到这么多人离开家人仍然是苦乐参半的。"
 me_nuragic_02_inv_30_title:0 "$nuragic_mission_02_inv_task_30$"
 me_nuragic_02_inv_30_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_30$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_31.a:0 "我期望每月初收到详细报告"
 me_nuragic_02_inv_31_desc:0 "建造一座遥远的城市并非易事——例如[GetProvince('(int32)1466').GetName]的建设有几个小问题——但现在一切都已尘埃落定，#E 巴利阿里群岛#!的行政管理工作将变得简单得多。\n\n为了敲定这笔交易，一位由[ROOT.GetCountry.GetRuler.GetName]亲自挑选的#E 努拉吉克行政官#!已被安置在吉乌姆的当地宫殿中，以监督当地事务。这位地方官将确保岛上的日常运作顺利进行，充当我们的[ROOT.GetCountry.GetRulerTitle]的眼睛和手。"
 me_nuragic_02_inv_31_title:0 "$nuragic_mission_02_inv_task_31$"
 me_nuragic_02_inv_31_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_31$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_32.a:0 "你们最好放下武器……想想孩子们"
 me_nuragic_02_inv_32_desc:0 "向#E 伊比利亚#!东海岸的野蛮国王和军阀们传话，他们的自由日子已经屈指可数，冥界之神正在打开坟墓，以接收他们儿子的尸体和阴影。\n\n[ROOT.GetCountry.GetRuler.GetName]已为[ROOT.GetCountry.GetName]宣称了这些土地！"
 me_nuragic_02_inv_32_title:0 "$nuragic_mission_02_inv_task_32$"
 me_nuragic_02_inv_32_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_32$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_33.a:0 "我们将跟随您到冥界再回来，我们的[ROOT.GetCountry.GetRulerTitle]！"
 me_nuragic_02_inv_33_desc:0 "当#E 切塞塔尼亚#!地区被[ROOT.GetCountry.GetAdjective]征召兵的靴子碾碎后，[ROOT.GetCountry.GetRuler.GetName]亲自视察了部队，以感谢他们的杰出服务。声音充满激情，[ROOT.GetCountry.GetRuler.GetSheHe]开始对士兵们讲话。\n\n'你们在这里所取得的成就为我们的民族和社会带来了荣耀——我对你们的所作所为感激不尽。但我必须再问你们一个问题……你们还愿意跟随我吗？如果萨尔多愿意，你们愿意与我一起骑到世界的尽头吗？'\n\n万人的呐喊声震撼了大地……"
 me_nuragic_02_inv_33_title:0 "$nuragic_mission_02_inv_task_33$"
 me_nuragic_02_inv_33_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_33$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_34.a:0 "我们希望让我们的存在在这些土地上被感受到……"
 me_nuragic_02_inv_34_desc:0 "我们的侦察兵完成了对伊比利亚海岸的彻底勘察，并建议在[GetProvince('(int32)1009').GetName]的领土上建立一个新的努拉吉克殖民地——[ROOT.GetCountry.GetRuler.GetName]已同意这一想法。"
 me_nuragic_02_inv_34_title:0 "$nuragic_mission_02_inv_task_34$"
 me_nuragic_02_inv_34_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_34$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_35.a:0 "我的人民对恩波里翁的玻璃疯狂——我不怪他们"
 me_nuragic_02_inv_35_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，您会高兴地得知，我们终于设法制服了伊比利亚希腊人的反叛倾向。众所周知，这些希腊人多么珍视他们的自由，但他们已接受不可避免的事实——他们无法从[ROOT.GetCountry.GetName]独立。\n\n然而，一切并非都是厄运和阴霾；有许多成功的故事，比如[GetProvince('(int32)1000').GetName]，它接受了努拉吉克商人和贵族的入驻。当地精英与这些外国利益合作，建造了令人印象深刻的玻璃吹制工坊。\n\n虽然恩波里翁城以前以其玻璃而闻名，但现在它已成为西地中海生产这种奢侈品的主要中心。"
 me_nuragic_02_inv_35_title:0 "$nuragic_mission_02_inv_task_35$"
 me_nuragic_02_inv_35_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_35$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_36.a:0 "每个人都从货物的便捷流通中受益……"
 me_nuragic_02_inv_36_desc:0 "一旦对工人的直接威胁得到充分缓解，[ROOT.GetCountry.GetRuler.GetName]便立即征召当地伊比利亚人与[ROOT.GetCountry.GetAdjective]工程师一起工作，以在半岛东海岸修建一条公路。\n\n现在他们的劳动已完成，[ROOT.GetCountry.GetRuler.GetFirstName]被亲自邀请去见证他们的作品——确实是一项非凡的成就。"
 me_nuragic_02_inv_36_title:0 "$nuragic_mission_02_inv_task_36$"
 me_nuragic_02_inv_36_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_36$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_37.a:0 "用不了多久我们就会把它全部夺走！"
 me_nuragic_02_inv_37_desc:0 "经过深思熟虑，我们决定准备对意大利#E 伊特鲁里亚#!土地的宣称。伊特鲁里亚是一片富饶的葡萄园和别墅之地，我们应该好好利用这只肥羊为我们自己服务。\n\n这条行动路线不会容易，但[ROOT.GetCountry.GetRuler.GetName]坚持认为没有其他办法。"
 me_nuragic_02_inv_37_title:0 "$nuragic_mission_02_inv_task_37$"
 me_nuragic_02_inv_37_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_37$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_38.a:0 "我在其他地方找不到这样的葡萄；真是物有所值"
 me_nuragic_02_inv_38_desc:0 "现在我们在[GetProvince('(int32)22').GetName]和[GetProvince('(int32)114').GetName]城市建造的市场已经完工，[ROOT.GetCountry.GetRuler.GetName]对当地人提出了一个要求；这些市场应专注于本地葡萄酒@wine!的进出口。\n\n远至[GetProvince('(int32)516').GetName]甚至[GetProvince('(int32)918').GetName]的美食家都知道点名索要伊特鲁里亚葡萄酒，他们非常愿意支付我们要求的任何价格。"
 me_nuragic_02_inv_38_title:0 "$nuragic_mission_02_inv_task_38$"
 me_nuragic_02_inv_38_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_38$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_39.a:0 "总有一天，浦普路纳将被称为'金属之港'"
 me_nuragic_02_inv_39_desc:0 "虽然我们岛上的金属显然更多，事实上，我们预见自己的矿山永远不会耗尽铅，但我们仍相当惊讶地发现，[GetProvince('(int32)126').GetName]地下竟有数量可观的矿石。\n\n[ROOT.GetCountry.GetRuler.GetName]从不忽视机会，已经下令扩建普普卢纳的基础设施，以容纳当地矿工。"
 me_nuragic_02_inv_39_title:0 "$nuragic_mission_02_inv_task_39$"
 me_nuragic_02_inv_39_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_39$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_3_desc:0 "经过几周偷偷摸摸的准备，我们的外交官已经拼凑出关于[GetProvince('(int32)94').GetName]的充分要求；我们已经拿出文件，说明这个地区是永久租借给我们的曾祖的。有了这个合理化的证据，我们不是在发动一场外国征服的战争，而是在收回属于我们的东西。"
 me_nuragic_02_inv_3_title:0 "$nuragic_mission_02_inv_task_3$"
 me_nuragic_02_inv_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_3$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_4.a:0 "祝我们勇敢的水手们顺利......我们的梦想与你们一起航行"
 me_nuragic_02_inv_40.a:0 "装备如此，谁能指望对抗我们的军队？"
 me_nuragic_02_inv_40_desc:0 "伊特鲁里亚的自然资源继续带来红利，这次集中在[GetProvince('(int32)127').GetName]岛上。成船的奴隶每天从大陆抵达，消失在矿井深处，再也没有回来。\n\n该地区发现的铁矿石质量上乘，注定要服务于[ROOT.GetCountry.GetAdjective]征召兵——我们的铁匠已经忙于锻造新武器来装备我们的战士。"
 me_nuragic_02_inv_40_title:0 "$nuragic_mission_02_inv_task_40$"
 me_nuragic_02_inv_40_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_40$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_41.a:0 "我不介意第二次教训这些狼崽！"
 me_nuragic_02_inv_41_desc:0 "我们对#E 拉丁姆#!的宣称终于完成了，罗马人渴望在陆地上与我们的士兵作战——他们愚蠢地认为，虽然他们已经在公海上被我们击败，但在陆军作战方面他们会给我们一个教训。"
 me_nuragic_02_inv_41_title:0 "$nuragic_mission_02_inv_task_41$"
 me_nuragic_02_inv_41_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_41$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_42.a:0 "不给拉丁人喘息之机，把他们赶入大海！"
 me_nuragic_02_inv_42_desc:0 "令他们永远羞愧的是，我们将骄傲的罗马人驱逐出了他们的首都，现在，[ROOT.GetCountry.GetAdjective]的征召兵在[GetProvince('(int32)1').GetName]的城墙上巡逻。围城的故事总是让[ROOT.GetCountry.GetRuler.GetName]心中充满自豪，因为我们英勇的部队奋勇作战，杀过城门，逐户巷战。\n\n意识到势头在我们这边，[ROOT.GetCountry.GetRuler.GetName]已要求我们继续向南推进我们的宣称。"
 me_nuragic_02_inv_42_title:0 "$nuragic_mission_02_inv_task_42$"
 me_nuragic_02_inv_42_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_42$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_43.a:0 "显然，这不能继续下去——我们必须粉碎他们"
 me_nuragic_02_inv_43_desc:0 "[ROOT.GetCountry.GetRuler.GetName] 一直认为#E 勒蓬蒂人#!不过是个麻烦，决定将[ROOT.GetCountry.GetRuler.GetHerHis]的注意力集中在意大利南部，但最近的事态发展改变了这一看法。  \n\n勒蓬蒂人因目前席卷意大利半岛的混乱而变得胆大妄为，认为现在是发动袭击的好时机。他们专挑我们的巡逻队孤立无援或迷失方向时下手，像懦夫一样从暗处发起攻击，并在我们的部队能够抓住他们之前迅速撤退。"
 me_nuragic_02_inv_43_title:0 "$nuragic_mission_02_inv_task_43$"
 me_nuragic_02_inv_43_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_43$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_44.a:0 "你们已无希望……"
 me_nuragic_02_inv_44_desc:0 "随着意大利的抵抗在[ROOT.GetCountry.GetAdjective]征召兵的进军面前崩溃，散布在#E 大希腊#!各地的城市正疯狂地权衡他们的选择。\n\n'我们应该向#E 希腊#!求助吗？还是应该熔化我们的神像换取硬币，希望能雇佣尽可能多的雇佣兵？我们能否以某种方式与[ROOT.GetCountry.GetName]达成协议？如果我们把我们拥有的一切都给他们，他们会放过我们吗？我们能做什么？'\n\n当这些南方城市的受惊市民躲在他们的城堡中时，第一支努拉吉克军队可以看到正越过地平线……"
 me_nuragic_02_inv_44_title:0 "$nuragic_mission_02_inv_task_44$"
 me_nuragic_02_inv_44_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_44$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_45.a:0 "我们不能容忍海洋上的无法无天"
 me_nuragic_02_inv_45_desc:0 "我们的舰队已经无数次遭遇游荡的伊利里亚海盗，终于决定我们需要终结他们的海盗行径。\n\n虽然伊利里亚部落会为守住他们的海岸而血战到底，但我们在这个问题上没有太多选择；必须是战争。"
 me_nuragic_02_inv_45_title:0 "$nuragic_mission_02_inv_task_45$"
 me_nuragic_02_inv_45_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_45$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_46.a:0 "随着时间的推移，伊利里亚人将接受他们的命运"
 me_nuragic_02_inv_46_desc:0 "虽然许多新近被征服的伊利里亚部落似乎在森林里生闷气，等待机会把我们赶出他们的家园，但他们的梦想是徒劳的——我们没有任何计划离开为争夺而流下努拉吉克鲜血的圣地。\n\n最近，我们尽我们所能地在#E 希斯特里亚#!建立殖民地，因为我们意识到这个小半岛非常适合我们的目的。方便取水，当地有大量的木材和石头可用于建筑，森林和溪流中野生动植物丰富。"
 me_nuragic_02_inv_46_title:0 "$nuragic_mission_02_inv_task_46$"
 me_nuragic_02_inv_46_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_46$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_47.a:0 "平定这个地区是一项艰巨的任务，所以我们为什么要离开？"
 me_nuragic_02_inv_47_desc:0 "我们终于摧毁了伊利里亚军队，虽然如果说他们的精神被击垮了那是谎言；如果说有什么的话，那就是他们在等待时机，等待[ROOT.GetCountry.GetAdjective]驻军离开他们家园的那一天。但这永远不会发生；至少在[ROOT.GetCountry.GetRuler.GetName]的注视下不会。"
 me_nuragic_02_inv_47_title:0 "$nuragic_mission_02_inv_task_47$"
 me_nuragic_02_inv_47_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_47$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_48.a:0 "任何在水上遇到我们的敌对势力都将遭殃！"
 me_nuragic_02_inv_48_desc:0 "您会很高兴地听到，我们的[ROOT.GetCountry.GetAdjective]工程师正从利部耳尼亚造船匠那里学到很多东西，他们公开分享他们的专业知识。他们的总建造师是粗鲁但耐心的老师，虽然我们的人和他们的人之间分享了许多严厉的教训和嘲讽，但在晚间营地中，当上好的[ROOT.GetCountry.GetAdjective]葡萄酒在众人之间分享时，所有的冒犯都被遗忘了。\n\n用不了多久，我们的舰队就会装备上伊利里亚人发明的新技术。"
 me_nuragic_02_inv_48_title:0 "$nuragic_mission_02_inv_task_48$"
 me_nuragic_02_inv_48_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_48$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_49.a:0 "准备好，努拉吉克征召兵们，因为不会太久了！"
 me_nuragic_02_inv_49_desc:0 "我们的军事顾问告诉我们，我们对#E 伊庇鲁斯#!的宣称已完成。唯一阻止我们部队的是[ROOT.GetCountry.GetRuler.GetName]的命令，[ROOT.GetCountry.GetRuler.GetSheHe]正渴望将我们的部队释放到希腊大陆。"
 me_nuragic_02_inv_49_title:0 "$nuragic_mission_02_inv_task_49$"
 me_nuragic_02_inv_49_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_49$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_4_desc:0 "在过去的几年里，我们陷入了一场生死攸关的斗争，以在西地中海建立自己的地位；从各方面来看，我们应该永远无法实现这一任务，但我们却在这里。现在，我们的土地上出现了难得的和平时期，我们决定派遣我们的舰队执行外交任务，而不是军事任务，要求他们向地平线起航，走得比以前任何一支舰队都要远。\n\n我们召集了一千名水手，给他们的船装上了物资，包括食品和送给他们可能遇到的任何民族的礼物，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]亲自到[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的港口去看船出发，在他们离开时为他们祈祷成功。我们的大部分人将驶向西方，尽管我们决定也派几艘船去东方。"
 me_nuragic_02_inv_4_title:0 "$nuragic_mission_02_inv_task_4$"
 me_nuragic_02_inv_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_4$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_5.a:0 "我们希望这种训练足够了"
 me_nuragic_02_inv_50.a:0 "准备我们的宣称是第一步……现在，向迦太达什特进发！"
 me_nuragic_02_inv_50_desc:0 "[ROOT.GetCountry.GetRuler.GetName]有一个愿景，[ROOT.GetCountry.GetRuler.GetSheHe]像疯狗一样追求着这个愿景——没有什么能阻止[ROOT.GetCountry.GetRuler.GetHerHim]看到这个梦想成为现实。\n\n[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]幻想着有一天我们的掠夺部队在[GetProvince('(int32)3256').GetName]城中逐户行动，装满袋子里的掠夺物，将成千上万人置于剑下。我们的人多么渴望用迦太基人的血来解渴！"
 me_nuragic_02_inv_50_title:0 "$nuragic_mission_02_inv_task_50$"
 me_nuragic_02_inv_50_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_50$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_51.a:0 "这仅仅是开始，你们都将看到……"
 me_nuragic_02_inv_51_desc:0 "在这一天，[ROOT.GetCountry.GetRuler.GetName]召集了来自[ROOT.GetCountry.GetCapital.GetName]的上层阶级和贵族家族，将他们带到[GetProvince('(int32)3256').GetName]参加一个特别的仪式。他们不久将返回家园，但现在，他们被要求在昔日对手的首都出席。\n\n当[ROOT.GetCountry.GetRuler.GetFirstName]的私人船只抵达#E 大科松港#!后，[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]径直前往城市中心的宫殿。当晚晚些时候，将向萨尔多献上感恩祈祷，感谢他赐予我们这场对抗古老敌人的无价胜利。"
 me_nuragic_02_inv_51_title:0 "$nuragic_mission_02_inv_task_51$"
 me_nuragic_02_inv_51_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_51$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_52.a:0 "我们将把这些马匹据为己有，你们会看到的！"
 me_nuragic_02_inv_52_desc:0 "我们无敌的部队在又一个战区取得了不可能的成功，这次击倒了凶猛的#E 努米底亚人#!。他们像魔鬼一样战斗，如我们所料，但他们激情的怒火无法拯救他们免受我们精锐军队的打击。\n\n虽然我们的骑兵不如这些著名的骑手，但他们的马匹不足以拯救他们。"
 me_nuragic_02_inv_52_title:0 "$nuragic_mission_02_inv_task_52$"
 me_nuragic_02_inv_52_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_52$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_53.a:0 "我想要一个罗盘草大庄园供自己使用……"
 me_nuragic_02_inv_53_desc:0 "#E 非洲#!的沿海领土一个接一个地落入我们的怀抱，除了像树上腐烂的水果一样坠落，别无他法。[ROOT.GetCountry.GetRuler.GetName]最新的兴趣似乎是#E 昔兰尼#!的土地，据传[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]已开始准备宣称。"
 me_nuragic_02_inv_53_title:0 "$nuragic_mission_02_inv_task_53$"
 me_nuragic_02_inv_53_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_53$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_54.a:0 "克里特人还记得他们辉煌的过去吗？令人怀疑……"
 me_nuragic_02_inv_54_desc:0 "您会高兴地听到，我们安置在[GetProvince('(int32)361').GetName]的#E 努拉吉克行政官#!写道，他认为在#E 克里特岛#!的住所非常可接受，并多次感谢[ROOT.GetCountry.GetRuler.GetName]亲自干预以确保行政官的舒适。\n\n我们希望在适当的时候，这个岛屿能接受我们的存在，因为我们共享着古老的历史。"
 me_nuragic_02_inv_54_title:0 "$nuragic_mission_02_inv_task_54$"
 me_nuragic_02_inv_54_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_54$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_55.a:0 "我们第二次不会再失败了！"
 me_nuragic_02_inv_55_desc:0 "大约一千年前，我们相信战船从#E 撒丁岛#!的港口起航前往#E 黎凡特#!，在那里臭名昭著的#E '海族'#!寻求征服和奴役。\n\n不幸的是，对我们的先辈来说，他们似乎在这项事业中失败了，被迫耻辱地退回他们的船只……但[ROOT.GetCountry.GetRuler.GetName]在这里是为了赎罪。\n\n我们人民的故事讲述了一位强大的国王#E 福耳库斯#!，他被[ROOT.GetCountry.GetAdjective]人民铭记为一位伟大的战士，在很久以前的一场海战中被击败。\n\n现在，当[ROOT.GetCountry.GetRuler.GetName]准备发动我们国家迄今为止尝试的最大规模入侵之一时，一个谣言已开始独立传播，并随着广泛传播而俘获了我们公民的心……\n\n[ROOT.GetCountry.GetRuler.GetFirstName]的心中流淌着#E 福耳库斯#!的血脉。"
 me_nuragic_02_inv_55_title:0 "$nuragic_mission_02_inv_task_55$"
 me_nuragic_02_inv_55_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_55$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_56.a:0 "我很高兴看到我们找到了一些值得拿的东西！"
 me_nuragic_02_inv_56_desc:0 "来自#E 黎凡特#!的报告不断涌入，据说我们的将军已带领我们的部队对集结起来反对我们的不堪重负的军队取得了无数胜利。\n\n当我们的人控制沿海古城时，我们的工程师和建筑师正在研究他们精英的卷轴和记录，希望能从他们最聪明的人那里获得技术进步。"
 me_nuragic_02_inv_56_title:0 "$nuragic_mission_02_inv_task_56$"
 me_nuragic_02_inv_56_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_56$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_57.a:0 "很好，谢谢……现在，我刚才在做什么？"
 me_nuragic_02_inv_57_desc:0 "我们不会让您久等，[ROOT.GetCountry.GetRuler.GetName]，但您会想知道我们最新的殖民地已经建成，这次是在[GetProvince('(int32)660').GetName]城。\n\n[GetProvince('(int32)660').GetName]已扩建以为殖民者腾出空间，[ROOT.GetCountry.GetAdjective]硬币正在市场上自由流通——总而言之，工作做得好。"
 me_nuragic_02_inv_57_title:0 "$nuragic_mission_02_inv_task_57$"
 me_nuragic_02_inv_57_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_57$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_58.a:0 "我们的神赐予了我们你们最珍贵的财产——他们抛弃了你们"
 me_nuragic_02_inv_58_desc:0 "如果衡量一个宗教真实性的标志是他们的神是否在信徒需要时抛弃了他们，那么从各方面来看，#E 黎凡特#!的众神已在萨尔多的愤怒面前逃离，萨尔多不承认除他自己之外的任何神权。\n\n在这片被神遗弃的土地上的神庙里装满了金银，我们解放了这些财富并将其放入我们的金库。"
 me_nuragic_02_inv_58_title:0 "$nuragic_mission_02_inv_task_58$"
 me_nuragic_02_inv_58_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_58$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_59.a:0 "这次我们不会失败！"
 me_nuragic_02_inv_59_desc:0 "很久以前，#E 埃及人#!比任何人都更能击退海族的入侵，从那以后他们一直沾沾自喜。\n\n'让他们用久已失落的荣耀故事来安慰自己吧。'[ROOT.GetCountry.GetRuler.GetName]曾对身边人说。'很快，记忆将是他们仅有的慰藉。'"
 me_nuragic_02_inv_59_title:0 "$nuragic_mission_02_inv_task_59$"
 me_nuragic_02_inv_59_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_59$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_5_desc:0 "在发布了扩大我们舰队规模的命令后，[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的船厂充满了工程师、劳工和他们的助手，从最早的晨光到深夜都在工作。当我们的船工忙着建造将载着我们的军队走向胜利的船只时，我们未来的水手们在等待他们的船只完工时也没有闲着；相反，我们的人一直在海滩上训练。当他们不练习战斗演习的时候，我们的人就在岸边搭起长椅，练习划船，学习如何团结协作。\n\n当船只建造完成后，我们的水手们将准备得更加充分。"
 me_nuragic_02_inv_5_title:0 "$nuragic_mission_02_inv_task_5$"
 me_nuragic_02_inv_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_5$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_6.a:0 "拥有标准化的砝码将有利于我们的经济--你会看到"
 me_nuragic_02_inv_60.a:0 "这是自然的秩序……现在向你们的法老鞠躬！"
 me_nuragic_02_inv_60_desc:0 "[ROOT.GetCountry.GetRuler.GetName]将我们的部队聚集在[GetProvince('(int32)516').GetName]城外，见证近期记忆中未曾见过的盛况——一位新#E 法老#!的加冕。\n\n在粉碎了当地对[ROOT.GetCountry.GetRuler.GetHerHis]统治的任何抵抗之后，[ROOT.GetCountry.GetRuler.GetFirstName]通过夺取法老的王冠和头衔，实现了对古埃及人的终极复仇。当新法老在[ROOT.GetCountry.GetRuler.GetHerHis]部队面前游行时，[ROOT.GetCountry.GetName]的士兵们呐喊着直到声音嘶哑，用长矛敲击盾牌，用战斗的喧嚣填满沙漠。"
 me_nuragic_02_inv_60_title:0 "$nuragic_mission_02_inv_task_60$"
 me_nuragic_02_inv_60_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_60$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_61.a:0 "向[ROOT.GetCountry.GetRuler.GetName]致敬！向[ROOT.GetCountry.GetName]致敬！"
 me_nuragic_02_inv_61_desc:0 "终于，[ROOT.GetCountry.GetRuler.GetName]实现了[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]很久以前设定的目标——建立一个新的王朝，这个王朝将统治由[ROOT.GetCountry.GetAdjective]人民创建的新帝国。\n\n在我们辽阔的国土上，从[ROOT.GetCountry.GetCapital.GetName]大理石铺就的街道到我们旗帜下野蛮人的简陋茅屋和篝火，我们的人民都在庆祝这一刻，擦去脸上幸福的泪水。即兴的宗教庆典在各地举行，努拉吉克万神殿的众神向他们所爱之人微笑。"
 me_nuragic_02_inv_61_title:0 "$nuragic_mission_02_inv_task_61$"
 me_nuragic_02_inv_61_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_61$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_62.a:0 "记住我的话，这些事必将实现"
 me_nuragic_02_inv_62_desc:0 "[ROOT.GetCountry.GetRuler.GetName]已明确表示，无论如何，整个#E 希腊#!都将属于[ROOT.GetCountry.GetAdjective]人民，地球上没有任何力量能够阻止这一切发生。"
 me_nuragic_02_inv_62_title:0 "$nuragic_mission_02_inv_task_62$"
 me_nuragic_02_inv_62_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_62$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_63.a:0 "让斯巴达人带着他们的“黑劳士”去田里干活吧"
 me_nuragic_02_inv_63_desc:0 "在击垮了骄傲的#E 拉栖代梦人#!的意志后，[ROOT.GetCountry.GetRuler.GetName]对被征服者毫不仁慈，而是强迫残忍的斯巴达人在[GetProvince('(int32)430').GetName]行省建造的巨大农场中劳作。\n\n他们不再能随心所欲地生活，他们的日子将用来擦拭额头上的汗水，耕耘希腊坚硬的土地。"
 me_nuragic_02_inv_63_title:0 "$nuragic_mission_02_inv_task_63$"
 me_nuragic_02_inv_63_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_63$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_64.a:0 "我不会让任何'继业者'四处游荡，等待在背后捅我一刀……"
 me_nuragic_02_inv_64_desc:0 "随着我们的部队继续粉碎穿越希腊的道路，新的宣称正准备针对#E 马其顿人#!以及#E 色雷斯人#!的领地——似乎[ROOT.GetCountry.GetRuler.GetName]不会休息，直到所有可能抵抗[ROOT.GetCountry.GetName]军队的力量都被从战场上清除。"
 me_nuragic_02_inv_64_title:0 "$nuragic_mission_02_inv_task_64$"
 me_nuragic_02_inv_64_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_64$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_65.a:0 "当我下令时，发射一轮箭雨！"
 me_nuragic_02_inv_65_desc:0 "吹响战争号角，准备好[ROOT.GetCountry.GetAdjective]旗帜，因为我们不可战胜的军队将被派往#E 亚洲#!的遥远海岸。对当地人毫不留情，[ROOT.GetCountry.GetName]的战士们！除非取得全面胜利，否则这里没有胜利！不留幸存者，为萨尔多的荣耀夺取一切！"
 me_nuragic_02_inv_65_title:0 "$nuragic_mission_02_inv_task_65$"
 me_nuragic_02_inv_65_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_65$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_66.a:0 "确实，我们的士兵是全世界最勇猛的"
 me_nuragic_02_inv_66_desc:0 "我们从将军那里收到消息，他们在#E 赫勒斯滂#!的战役已基本结束，只剩下少数散兵游勇需要清理。\n\n我们的人攀上敌人城墙，逐户作战，才使这些胜利成为可能。我们的全面胜利从未有过疑问，满载殖民者的船只已驶向[GetProvince('(int32)1453').GetName]。"
 me_nuragic_02_inv_66_title:0 "$nuragic_mission_02_inv_task_66$"
 me_nuragic_02_inv_66_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_66$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_67.a:0 "也许有一天，我会亲自访问这些殖民地"
 me_nuragic_02_inv_67_desc:0 "虽然我们海外胜利的消息不断涌入[ROOT.GetCountry.GetCapital.GetName]，但[ROOT.GetCountry.GetRuler.GetName]庆祝[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]从我们的将军和行政官那里收到的每一封通信。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]一直在关注我们在#E 哈尔基季基#!的殖民进展，并一直对进度感到满意。当地人起初对我们的殖民者持怀疑态度，但一旦他们意识到我们的人民计划永久定居，他们便勉强接受了这一局面。"
 me_nuragic_02_inv_67_title:0 "$nuragic_mission_02_inv_task_67$"
 me_nuragic_02_inv_67_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_67$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_68.a:0 "我会留意这两个人，他们似乎很有野心……"
 me_nuragic_02_inv_68_desc:0 "我们的[ROOT.GetCountry.GetAdjective]水手的故事总是让[ROOT.GetCountry.GetRuler.GetName]惊叹不已，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]喜欢听我们海军陆战队的冒险故事。幸运的是，对我们的[ROOT.GetCountry.GetRulerTitle]来说，从来不缺少激动人心的消息，我们英勇事迹的故事总是让[ROOT.GetCountry.GetRuler.GetFirstName]面带微笑。\n\n最近，我们一位船长——名叫[SCOPE.sCharacter('ampsicora_nuragic_chad').GetName]的人的事迹引起了[ROOT.GetCountry.GetRuler.GetFirstName]的注意。[SCOPE.sCharacter('ampsicora_nuragic_chad').GetFirstName]是#E 撒丁岛#!最富有的地主之一，他与儿子[SCOPE.sCharacter('hiostus_nuragic_chad').GetName]一起，利用他们的财富为[ROOT.GetCountry.GetName]的荣耀而战。\n\n[SCOPE.sCharacter('ampsicora_nuragic_chad').GetFirstName]和[SCOPE.sCharacter('hiostus_nuragic_chad').GetFirstName]都是首批在[GetProvince('(int32)1453').GetName]立足的商人之一，并且有充分理由——他们利用可观的财务资源在该市组建了一支#E 拜占庭军团#!，由来自欧洲和亚洲的精锐雇佣兵组成。\n\n[SCOPE.sCharacter('ampsicora_nuragic_chad').GetFamilyDisplayAdjective]家族希望他们能被允许领导北方的入侵——他们已宣誓为我们人民的荣耀夺取[GetProvince('(int32)4539').GetName]。"
 me_nuragic_02_inv_68_title:0 "$nuragic_mission_02_inv_task_68$"
 me_nuragic_02_inv_68_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_68$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_69.a:0 "这将是一个长期'伙伴关系'的开始……"
 me_nuragic_02_inv_69_desc:0 "在为[ROOT.GetCountry.GetName]夺取了伊比利亚半岛的大部分土地之后，[ROOT.GetCountry.GetRuler.GetName]接受了来自最近被征服部落的#E 伊比利亚之王#!称号，他们眼中带着赤裸裸的钦佩望向[ROOT.GetCountry.GetRuler.GetFirstName]。我们的伊比利亚部落民无意摆脱我们的枷锁，而是希望从我们这里学到一切——毫无疑问，他们将成为出色的臣民。"
 me_nuragic_02_inv_69_title:0 "$nuragic_mission_02_inv_task_69$"
 me_nuragic_02_inv_69_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_69$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_6_desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的个人怪癖之一是[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]喜欢偷偷溜出宫殿，乔装打扮在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的市场中游荡。这种奇怪行为的原因是[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]喜欢与平民混在一起，听他们的闲聊，试图了解街上的气氛。\n\n当太阳开始升起在清澈的天空中时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]在一家面包店停下来，拿出几枚铜币买了一条新鲜出炉的面包。在后面，靠近烤炉的地方，一队奴隶正在快速工作，切面团并在小青铜面包盘中成型。在过去的几个月里，首都的所有测量工具都已升级。[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]希望引入通用标准将有利于我们的商人，到目前为止，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]似乎是对的。"
 me_nuragic_02_inv_6_title:0 "$nuragic_mission_02_inv_task_6$"
 me_nuragic_02_inv_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_6$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_7.a:0 "我们向每一个为国家牺牲的人致敬"
 me_nuragic_02_inv_70.a:0 "你们给了我巨大的荣誉……谢谢你们"
 me_nuragic_02_inv_70_desc:0 "现在#E 努米底亚#!地区已牢牢掌握在手中，我们立即为其马匹为我们军队所用。下次我们的征召兵参战时，努米底亚辅兵将加入他们。\n\n因为[ROOT.GetCountry.GetRuler.GetName]亲自促成了这一切，[ROOT.GetCountry.GetName]的公民正以如此杰出的统治者馈赠国家而向[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]家族致敬。"
 me_nuragic_02_inv_70_title:0 "$nuragic_mission_02_inv_task_70$"
 me_nuragic_02_inv_70_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_70$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_71.a:0 "我……我简直不敢相信。我的眼睛欺骗了我吗？"
 me_nuragic_02_inv_71_desc:0 "[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetCapital.GetName]举行的一场喧闹庆祝活动后返回[ROOT.GetCountry.GetRuler.GetHerHis]私人寝宫，微醉但心情欣喜若狂。在整个城市，即使在这个深夜，歌声的回响仍在大街小巷中回荡，所有人都在纪念[ROOT.GetCountry.GetName]的建立——确实，这一天将被我们的人民永远铭记。\n\n跌跌撞撞地穿过走廊，吹着欢快的努拉吉克曲调，[ROOT.GetCountry.GetRuler.GetFirstName]几乎没有注意到黑暗走廊中等待的干瘪老人身影。在[ROOT.GetCountry.GetRuler.GetFirstName]能发出声音之前，那人从阴影中走出，拿着一捆破布。即使在醉酒状态下，[ROOT.GetCountry.GetRuler.GetFirstName]也能通过此人的举止和衣着判断出[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]站在一位#E 部落长老#!面前，虔诚的[ROOT.GetCountry.GetRulerTitle]恭敬地低下了头。\n\n'众神与你同在，福耳库斯之子。'老人嘶哑地咳嗽着，走上前来，将包裹塞入[ROOT.GetCountry.GetRuler.GetFirstName]手中。'收下这个，要知道萨尔多将指引你的手和心。'\n\n片刻之后，长老消失在夜色中，留下惊讶的[ROOT.GetCountry.GetRulerTitle]握着一把传奇之剑和一个古老的王冠。"
 me_nuragic_02_inv_71_title:0 "$nuragic_mission_02_inv_task_71$"
 me_nuragic_02_inv_71_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_71$#!' $mission_completed_tooltip_2$\n#E 我们的国王将佩戴#! #Y 福耳库斯之冠#!。\n"
 me_nuragic_02_inv_72.a:0 "众神赐予我们的恩惠超出我们的想象"
 me_nuragic_02_inv_72_desc:0 "任何离开母港的船只都知道海洋属于[ROOT.GetCountry.GetName]——所有其他对手都看到他们的三层桨战船沉入海底，甚至海盗也知道不能攻击任何悬挂[ROOT.GetCountry.GetAdjective]旗帜的船只。\n\n一个新的和平与繁荣的时代已降临海上，贸易蓬勃发展，人们可以自由旅行而不必担心生命安全。"
 me_nuragic_02_inv_72_title:0 "$nuragic_mission_02_inv_task_72$"
 me_nuragic_02_inv_72_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_72$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_73.a:0 "愿众神对我所献上的这份礼物感到满意"
 me_nuragic_02_inv_73_desc:0 "当我们的建筑师和工程师决定在[ROOT.GetCountry.GetCapital.GetName]建造一座宏伟的新建筑时，所有人都知道它是什么——[ROOT.GetCountry.GetRuler.GetName]除了#E 大努拉格#!之外不会满足于任何东西，一座在#E 撒丁岛#!上高耸于所有其他建筑之上的建筑。\n\n一旦施工完成，据说从远至[GetProvince('(int32)127').GetName]都能看到这座努拉格。许多旅行者现在正在访问该岛，希望亲自目睹这一奇观。"
 me_nuragic_02_inv_73_title:0 "$nuragic_mission_02_inv_task_73$"
 me_nuragic_02_inv_73_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_73$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_74.a:0 "众神已抛弃了你们——只有死亡等待着你们"
 me_nuragic_02_inv_74_desc:0 "在太阳尚未升起，尚未照亮[GetProvince('(int32)2325').GetName]的城墙时，我们的战舰已悄无声息地驶入港口。对马赛利亚人的突袭毫无预兆，当警报响彻整个城市时，他们惊恐的士兵们仓促地采取防御姿态，祈求救援，但他们心中清楚，灭顶之灾即将降临。"
 me_nuragic_02_inv_74_title:0 "$nuragic_mission_02_inv_task_74$"
 me_nuragic_02_inv_74_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_74$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_75.a:0 "通往高卢的大门敞开着……"
 me_nuragic_02_inv_75_desc:0 "现在[GetProvince('(int32)2325').GetName]的城堡上飘扬着[ROOT.GetCountry.GetName]的旗帜，还有什么能阻止[ROOT.GetCountry.GetAdjective]军队入侵#E 高卢#!的其余部分呢？\n\n[ROOT.GetCountry.GetRuler.GetName]对此局势讽刺地评论道：'高卢部落以为希腊人是入侵者，但他们从未意识到希腊人是一扇锁住的门，挡住了其他人。但现在呢？'"
 me_nuragic_02_inv_75_title:0 "$nuragic_mission_02_inv_task_75$"
 me_nuragic_02_inv_75_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_75$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_76.a:0 "我们将在他们的废墟上建造一座殖民地。"
 me_nuragic_02_inv_76.b:0 "没有人会记得那片被诅咒的土地。"
 me_nuragic_02_inv_76_desc:0 "[ROOT.GetCountry.GetRuler.GetName]受神启示的愿景已成为现实，受辱之城[GetProvince('(int32)3256').GetName]的命运掌握在[ROOT.GetCountry.GetRulerTitle]的手中，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]将最终决定这座骄傲的迦太基城市的结局。\n\n任何乞求或恳求都未能软化[ROOT.GetCountry.GetRuler.GetFirstName]的心，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe]只需想想迦太基对[ROOT.GetCountry.GetRuler.GetHerHis][ROOT.GetCountry.GetAdjective]同胞犯下的累累罪行——这总是让[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]热血沸腾。\n\n但现在……[GetProvince('(int32)3256').GetName]该如何处理？"
 me_nuragic_02_inv_76_title:0 "$nuragic_mission_02_inv_task_76$"
 me_nuragic_02_inv_76_tooltip.a:0 "迦太达什特不复存在；我们将在敌人的废墟和骸骨之上建造一座强大的殖民地。"
 me_nuragic_02_inv_76_tooltip.b:0 "没有什么比被遗忘更糟糕的命运，再也没有人会低声念出迦太达什特的名字。"
 me_nuragic_02_inv_7_desc:0 "尽管我们已经在海上失去了无数的灵魂，他们的身体是给死亡之神的水一样的礼物，但我们已经学到了一个残酷的教训；无论有多少黄金和多少生命被倒入海洋的大口中，它都不会满足，它永远不会被满足。建造一支新的舰队，装备好装备，把我们的孩子们送入水中，却发现敌人的舰队在摧毁他们之前让他们措手不及，这是一件令人沮丧的事情。尽管如此，尽管我们会遇到挫折，但我们每一次都会迎难而上，在完成我们选择的工作的同时，记住所做出的牺牲。"
 me_nuragic_02_inv_7_title:0 "$nuragic_mission_02_inv_task_7$"
 me_nuragic_02_inv_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_7$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_8.a:0 "访问过[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的人是幸运的"
 me_nuragic_02_inv_8_desc:0 "关于[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]这座辉煌的城市的故事正吸引着全世界的人的耳朵，有些人甚至给我们公平的首都冠以'海洋皇后'的称号。虽然确实有许多其他的沿海城市，有些城市有令人印象深刻的历史，突出了我们自己最近的缺陷，但在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]有一种不可避免的光环；任何访问我们精心规划的首都的人都很快意识到其潜力。\n\n虽然这个尊称可能有点夸张，但我们承认它是对未来事物的一种承诺。"
 me_nuragic_02_inv_8_title:0 "$nuragic_mission_02_inv_task_8$"
 me_nuragic_02_inv_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_8$#!' $mission_completed_tooltip_2$"
 me_nuragic_02_inv_9.a:0 "我们是人类的猎手，没有人可以从我们这里得到安全"
 me_nuragic_02_inv_9_desc:0 "尽管许多人认为征服弱者是一件不光彩的事情，但我们的人民已经成为世界上最优秀的奴隶主，将奴役行为提炼成一门高级艺术。我们的船把我们的突击队带到海岸，我们的人在那里下船，然后沿着水路逆流而上，进入河中的驳船。当警报响起的时候，对于那些不设防的村庄里的可怜人来说，往往为时已晚，他们很快就发现自己被铁链捆绑在三桅帆船的船舱里。在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的奴隶市场上，生意从来没有这么好过，而且预计只会越来越好。"
 me_nuragic_02_inv_9_title:0 "$nuragic_mission_02_inv_task_9$"
 me_nuragic_02_inv_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nuragic_mission_02_inv_task_9$#!' $mission_completed_tooltip_2$"
 mines_of_ilva:0 "伊尔瓦的矿山"
 numidian_auxilia:0 "努米底亚辅兵"
 nuragic_colony:0 "努拉吉克殖民地"
 nuragic_emporie_glass_workshops:0 "恩波里翁玻璃工坊"
 nuragic_gymnaesia_consolidation_mod:0 "努拉吉行政机构"
 nuragic_laconian_farm:0 "拉栖代梦的农场"
 nuragic_mining_pupluna:0 "浦普路纳金属工艺"
 nuragic_mission_02_inv:0 "海族的回归"
 nuragic_mission_02_inv_BUTTON_TOOLTIP:0 "地球上的帝国在看到我们在地平线上的帆时都会颤抖..."
 nuragic_mission_02_inv_CRITERIA_DESCRIPTION:0 "当我们像我们神话中的祖先海族一样，在地中海建立起一个泰拉西族，为自己夺取主要岛屿时，这个任务就会完成。"
 nuragic_mission_02_inv_DESCRIPTION:0 "在伟大的国王的图书馆和宝库中，人们可以找到写在石碑和泥板上的奇怪的铭文--在征服中获得的小玩意和奇珍异宝，很快就被遗忘。在这个时代，找到一个圣人或抄写员来解析这些难懂的文字将是一项艰巨的任务，因为记得古代语言的人很少，能够理解其古老的音节的人更少。因此，随着岁月的流逝，人类记忆自己过去的能力被削弱，许多奇妙的事情被遗忘。\n\n是啊，还有很多警示。"
 nuragic_mission_02_inv_task_1:0 "扩大港口区"
 nuragic_mission_02_inv_task_10:0 "击沉罗马舰队"
 nuragic_mission_02_inv_task_10_DESC:0 "虽然到此为止我们已经和迦太基人打了很多次架，但仍有另一个讨厌鬼--罗马，挡住了我们扩张的梦想。他们的确是凶猛的战士，在陆地上无人能敌，但我们必须在海上粉碎他们的力量，才能安全地前往遥远的海岸。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 nuragic_mission_02_inv_task_11:0 "西卡尼亚的山丘"
 nuragic_mission_02_inv_task_11_DESC:0 "现在我们在叙拉古岛有了滩头阵地，对一些内陆省份提出要求将是一件小事……我们需要的只是时间，我们有足够的时间。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 nuragic_mission_02_inv_task_12:0 "[GetProvince('(int32)84').GetName] 是关键"
 nuragic_mission_02_inv_task_12_DESC:0 "我们与我们的军事顾问完全一致；如果我们能够控制[GetProvince('(int32)84').GetName]，那么该省的其他地方肯定会很快屈服于我们的推进。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 nuragic_mission_02_inv_task_13:0 "最后的废墟"
 nuragic_mission_02_inv_task_13_DESC:0 "虽然有人会说为这样一个小岛开战是愚蠢的，但我们不能允许其他人控制[GetProvince('(int32)1470').GetName]；它的战略位置实在太宝贵了。此外，从这个有利位置，我们将可以肆无忌惮地突袭迦太基。\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 nuragic_mission_02_inv_task_14:0 "海格力斯之柱"
 nuragic_mission_02_inv_task_14_DESC:0 "我们的侦察员从西方回来，带来了关于奇怪民族的精彩故事，更重要的是，对他们居住的土地进行了宝贵的侦察。根据这些报告，我们有理由相信，我们未来的安全取决于我们控制海洋之门的能力，即海格立斯之柱。\n\n\n\n\n\n\n\n\n\n@greek_mil8!"
 nuragic_mission_02_inv_task_15:0 "就像[GetProvince('(int32)2108').GetName]那样远"
 nuragic_mission_02_inv_task_15_DESC:0 "我们的水手在长距离航行时越来越大胆，探索世界最边缘的雾气笼罩的领域，并在那些遥远的地方快速结交朋友。从我们海格力斯之柱附近的城市出发，我们的船队探寻广阔的未知海洋......\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 nuragic_mission_02_inv_task_16:0 "The Socotran Connection （索科特兰人的联系）"
 nuragic_mission_02_inv_task_16_DESC:0 "一个难以置信的故事!几年前，我们派出了水手，他们的任务是探索遥远的土地，并将他们的发现报告回来。虽然我们认为这是一件已经解决的事情，但今天早上回港的船只却不这么认为......\n\n\n\n\n\n\n\n\n\n@egypt_mil18!"
 nuragic_mission_02_inv_task_17:0 "位于世界边缘的岛屿"
 nuragic_mission_02_inv_task_17_DESC:0 "我们在[GetProvince('(int32)7530').GetName]的朋友告诉我们，在印度海岸附近有一个遥远的岛国，欢迎外国商人的到来。虽然我们不熟悉这个异国情调的地方，但我们博学的希腊顾问告诉我们，这片土地被称为 Taprobane，并建议我们派遣一个大使馆，以建立友好关系。\n\n\n\n\n\n\n\n\n\n@india_mil7!"
 nuragic_mission_02_inv_task_18:0 "收集基克拉迪群岛"
 nuragic_mission_02_inv_task_18_DESC:0 "看来，来自[GetProvince('(int32)84').GetArea.GetName]和[GetProvince('(int32)351').GetArea.GetName]的一大批战士、敌军士兵和难民已经逃到[GetProvince('(int32)263').GetArea.GetName]，希望在试图从我们这里夺回他们的家乡之前，在这些小岛上重新聚集力量。我们应该在更多的人涌向他们的旗帜之前结束这些妄想。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 nuragic_mission_02_inv_task_19:0 "降服谢克雷什"
 nuragic_mission_02_inv_task_19_DESC:0 "西西里岛是一个多山的大岛，岛上的居民对不断增加的觊觎她丰富宝藏的外国占领者的名单感到不满。虽然这需要大量的人力和多年的努力来清除内陆的许多强盗藏身处和叛军据点，但我们相信我们可以把它完全置于我们的控制之下。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 nuragic_mission_02_inv_task_1_DESC:0 "如果我们想成为著名的海军强国，我们城市的基础设施，尤其是我们的主要港口，需要彻底改造......与我们的邻国相比，我们的状况无疑是可笑的。通过投资我们的首都，我们将为我们的人民创造机会，在这里开始新的生活。\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 nuragic_mission_02_inv_task_2:0 "评估我们的适航性"
 nuragic_mission_02_inv_task_20:0 "穿越伊奥尼亚海"
 nuragic_mission_02_inv_task_20_DESC:0 "在采取了巨大的措施以确保我们在西方的财产后，我们饥渴地将目光投向东方的富饶土地，克里特岛是一个很好的跳板，我们可以从那里袭击整个东地中海。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 nuragic_mission_02_inv_task_21:0 "迦弗托，佩勒塞特之地"
 nuragic_mission_02_inv_task_21_DESC:0 "到现在为止，我们已经建立了一个行动的节奏；在找到一个有利的地点，让我们的船登陆，让我们的军队上岸之后，我们在消灭任何残存的抵抗力量之前，迅速解决本地部队。克里特岛的弓箭手，尽管他们名声在外，但应该不会给我们的人带来什么麻烦。\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 nuragic_mission_02_inv_task_22:0 "玫瑰之岛"
 nuragic_mission_02_inv_task_22_DESC:0 "罗德岛的名声在船只航行的任何地方都很响亮；事实上，关于它的财富、高贵的市民和身经百战的水手的故事是这个美丽岛屿的公民的骄傲，他们令人信服地认为他们的城市是世界上最文明和最优雅的。\n\n是的，是的，这一切都很好，但他们能阻止我们把一切都占为己有吗?\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 nuragic_mission_02_inv_task_23:0 "丹扬人之岛"
 nuragic_mission_02_inv_task_23_DESC:0 "终于，我们的舰队已经驶过了整个地中海，到达了一个当地人称为[GetProvince('(int32)330').GetArea.GetName]的岛屿。我们多么渴望拥有这个岛屿！我们将有一个相当大的中转站。我们将拥有相当大的集结地，用于袭击[GetProvince('(int32)1883').GetArea.GetName]和[GetProvince('(int32)516').GetArea.GetName]的地区。我们的船队在黎明时分为这个宏伟的奖赏而起航!\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 nuragic_mission_02_inv_task_24:0 "那些博学的希腊人"
 nuragic_mission_02_inv_task_24_DESC:0 "我们的人民可以从希腊人那里学到很多东西，他们擅长修辞和演讲的艺术，被称为智慧的爱好者。我们应该鼓励他们的聪明人在我们的公民中定居，以便我们能够学习他们的博学之道。这无疑是一项昂贵的事业，但人们可以为知识付出代价吗？\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 nuragic_mission_02_inv_task_25:0 "世界的肚脐"
 nuragic_mission_02_inv_task_25_DESC:0 "没有人可以否认，我们在希腊世界引起了相当大的骚动。因为希腊的权力经纪人表示有兴趣更好地了解我们的人民，所以我们被邀请访问德尔斐的神谕，即皮提亚，作为一种善意的姿态。据说这位女先知有预言的天赋，可以揭示未来......这当然值得考虑。\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 nuragic_mission_02_inv_task_26:0 "科西嘉边境"
 nuragic_mission_02_inv_task_26_DESC:0 "科西嘉岛需要被完全殖民，用优秀的[ROOT.GetCountry.GetAdjective]公民填满该岛将对该地区的文明化产生奇效。\n\n\n\n\n\n\n\n\n\n@italic_mil2!"
 nuragic_mission_02_inv_task_27:0 "阿卢卡港口"
 nuragic_mission_02_inv_task_27_DESC:0 "[GetProvince('(int32)3511').GetName]的领土拥有一个天然港口，虽然这对它以前的居民来说已经足够，但我们对这个地区有一个宏伟的愿景——不仅仅是完全改造和振兴该地区。\n\n\n\n\n\n\n\n\n\n@italic_mil1!"
 nuragic_mission_02_inv_task_28:0 "科西嘉人的家园"
 nuragic_mission_02_inv_task_28_DESC:0 "赞美萨尔多！我们已完全殖民了#Y 科西嘉岛#!，为[ROOT.GetCountry.GetName]的更大荣耀而夺取了它！\n\n\n\n\n\n\n\n\n\n@italic_mil8!"
 nuragic_mission_02_inv_task_29:0 "[GetProvince('(int32)1464').GetName]的港口"
 nuragic_mission_02_inv_task_29_DESC:0 "我们必须在具有战略意义的[GetProvince('(int32)1464').GetName]岛上建设港口设施。如果我们希望将我们的力量投射到伊比利亚及更远的地方，那么我们必须能够在西地中海适当地装备我们的船只。\n\n\n\n\n\n\n\n\n\n@italic_mil4!"
 nuragic_mission_02_inv_task_2_DESC:0 "我们必须对我们目前的军事准备进行评估，以便看到我们以前的战争给我们留下的状态。有很多事情要做；考虑到我们对海军的依赖程度，我们需要确保它处于最佳状态。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 nuragic_mission_02_inv_task_3:0 "[GetProvince('(int32)94').GetName]"
 nuragic_mission_02_inv_task_30:0 "巴拉里安人的回归"
 nuragic_mission_02_inv_task_30_DESC:0 "古时候，我们的祖先用另一个名字称呼'马戈'岛；#Y 努拉·巴拉拉#!。让我们通过恢复这座迷人岛屿的名称来为我们的先辈带来荣耀和荣誉，向世界宣告这将是[ROOT.GetCountry.GetAdjective]人民的避风港。\n\n\n\n\n\n\n\n\n\n@italic_mil9!"
 nuragic_mission_02_inv_task_31:0 "统一具姆奈西亚"
 nuragic_mission_02_inv_task_31_DESC:0 "如果我们能够将#E 吉姆奈西亚#!的分散岛屿聚集在我们的[ROOT.GetCountry.GetAdjective]旗帜下，那将是[ROOT.GetCountry.GetRuler.GetName]的外交胜利——毫无疑问，我们[ROOT.GetCountry.GetRulerTitle]的声望将飙升。\n\n\n\n\n\n\n\n\n\n@italic_mil19!"
 nuragic_mission_02_inv_task_32:0 "聚焦伊比利亚"
 nuragic_mission_02_inv_task_32_DESC:0 "#E 伊比利亚#!东海岸有许多港口，将是我们不断壮大的海上帝国的重要补充。也许不仅仅是袭击这些城市以获取奴隶，现在是时候派遣一支入侵部队了？\n\n\n\n\n\n\n\n\n\n@italic_mil17!"
 nuragic_mission_02_inv_task_33:0 "征服切塞塔尼亚"
 nuragic_mission_02_inv_task_33_DESC:0 "我们的军事顾问建议我们首先夺取#Y 切塞塔尼亚#!行省，因为我们的间谍早已渗透该地区，并为即将到来的行动奠定了基础。\n\n\n\n\n\n\n\n\n\n@italic_mil29!"
 nuragic_mission_02_inv_task_34:0 "定居凯塞"
 nuragic_mission_02_inv_task_34_DESC:0 "美丽的[GetProvince('(int32)1009').GetName]将是我们建造#Y 努拉吉克殖民地#!的完美地点；它靠海，这对我们的同胞很重要，并且有附近河流的淡水供应。聚集我们的劳动者，为他们做好准备，以应对手头的重要任务。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 nuragic_mission_02_inv_task_35:0 "降服伊比利亚希腊人"
 nuragic_mission_02_inv_task_35_DESC:0 "西地中海的一些分散领土已成为许多希腊殖民者的家园，每个殖民地都有不同程度的成功，但我们已决定他们这种小小的殖民实验该结束了。\n\n如果我们花时间在我们将要征服的地方进行适当的投资，我们就可以实现这些孤立城市的真正潜力——[GetProvince('(int32)1000').GetName]的玻璃吹制工将是此类倡议的完美候选者。\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 nuragic_mission_02_inv_task_36:0 "加强对伊比利亚的控制"
 nuragic_mission_02_inv_task_36_DESC:0 "虽然海上交通是我们众多领土之间最快的旅行方式，但有人建议我们修建一条公路，将我们在伊比利亚沿岸的许多港口城市连接起来——我们很乐意承担这项任务。这对该地区蓬勃发展的贸易网络将产生奇效。\n\n\n\n\n\n\n\n\n\n@italic_mil27!"
 nuragic_mission_02_inv_task_37:0 "聚焦伊特鲁里亚"
 nuragic_mission_02_inv_task_37_DESC:0 "#E 伊特鲁里亚人#!的富饶土地在向我们呼唤，但我们必须注意，有许多人都渴望拥有这片地区连绵的农田和缓坡山丘——如果我们在他们的海岸登陆，将会有大量鲜血流淌。\n\n\n\n\n\n\n\n\n\n@italic_mil30!"
 nuragic_mission_02_inv_task_38:0 "定居伊特鲁里亚"
 nuragic_mission_02_inv_task_38_DESC:0 "虽然当地的伊特鲁里亚人在文化上与我们的[ROOT.GetCountry.GetAdjective]人民非常相似，但我们有理由相信，如果我们在大陆上建立殖民地，他们最终会接受我们更优越的方式。\n\n\n\n\n\n\n\n\n\n@italic_mil3!"
 nuragic_mission_02_inv_task_39:0 "金属贸易港"
 nuragic_mission_02_inv_task_39_DESC:0 "我们的工程师对[GetProvince('(int32)126').GetName]行省中发现的大量贱金属感到震惊，这让我们想起了我们家乡岛屿上丰富的矿产财富。我们应该尽我们所能开发这个地区并提取其矿石。\n\n根据这个时代的罗马资料，这座城市是在'来自岛屿的人们'的帮助下建立的。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 nuragic_mission_02_inv_task_3_DESC:0 "既然我们已经决定夺取地中海的所有主要岛屿，西西里岛是我们的第一个主要目标，实用主义要求我们在[GetProvince('(int32)94').GetName]登陆我们的部队。我们必须在没有警告的情况下突然进攻--出其不意的因素将是我们唯一的盟友。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 nuragic_mission_02_inv_task_4:0 "侦察海岸线"
 nuragic_mission_02_inv_task_40:0 "伊尔瓦的铁矿"
 nuragic_mission_02_inv_task_40_DESC:0 "[GetProvince('(int32)127').GetName]的矿山中的铁，位于我们的家园和意大利大陆之间，将对我们的经济和军事实力产生巨大的作用——我们必须从这个岛屿上拿走一切能拿的东西。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 nuragic_mission_02_inv_task_41:0 "进入拉丁姆"
 nuragic_mission_02_inv_task_41_DESC:0 "我们不应畏惧任何人的名声；罗马人被称为凶猛的战士，但我们同样觊觎他们的故土，现在他们的舰队已被摧毁，我们可以随心所欲地在他们的海岸登陆。\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 nuragic_mission_02_inv_task_42:0 "降伏这些征服者"
 nuragic_mission_02_inv_task_42_DESC:0 "强者何其衰落！我们的[ROOT.GetCountry.GetAdjective]军队穿行于[GetProvince('(int32)1').GetName]的心脏地带，饱览前罗马首都的景色与声音。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 nuragic_mission_02_inv_task_43:0 "镇压勒蓬蒂"
 nuragic_mission_02_inv_task_43_DESC:0 "我们绝不能让勒蓬蒂人以为他们躲在山后就能安然无恙。难道他们真的认为可以袭击我们的新领土，而不会引来我们的愤怒吗？我们将击溃他们，给那些胆敢挡在我们面前的人一个教训。\n\n\n\n\n\n\n\n\n\n@italic_mil22!"
 nuragic_mission_02_inv_task_44:0 "挺进大希腊"
 nuragic_mission_02_inv_task_44_DESC:0 "生活在意大利南部的希腊人注定要遭受与他们在伊比利亚的殖民者相同的命运——彻底毁灭和征服。愿战神伴随我们进入战场！\n\n\n\n\n\n\n\n\n\n@italic_mil25!"
 nuragic_mission_02_inv_task_45:0 "进入伊利里亚"
 nuragic_mission_02_inv_task_45_DESC:0 "我们已确定，狂野的伊利里亚海岸是许多海盗的家园，他们将自己的掠夺舰队隐藏在崎岖的海岸线上。我们不能允许一个敌对的海上力量壮大，所以我们必须进入伊利里亚。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 nuragic_mission_02_inv_task_46:0 "希斯特里亚之门"
 nuragic_mission_02_inv_task_46_DESC:0 "我们的建筑师注意到，#E 希斯特里亚#!地区急需基础设施——如果我们在[GetProvince('(int32)4018').GetName]建造一些城市和一座堡垒，我们的公民将有足够的安全感前往这个遥远的地峡。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 nuragic_mission_02_inv_task_47:0 "确保对达尔马提亚的控制"
 nuragic_mission_02_inv_task_47_DESC:0 "通过将伊利里亚人沿海的优良领土据为己有，我们几乎可以确保我们能够轻松进入达尔马提亚。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 nuragic_mission_02_inv_task_48:0 "利部耳尼亚水手"
 nuragic_mission_02_inv_task_48_DESC:0 "我们的工程师勉强承认#E 利部耳尼亚#!的造船匠对以他们的名字命名的船只——利部耳尼亚船进行了改进。虽然我们的人民很骄傲，但我们看到创新时是认得出来的，我们不能让敌人拥有比我们更快的船只。\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 nuragic_mission_02_inv_task_49:0 "抵达伊庇鲁斯"
 nuragic_mission_02_inv_task_49_DESC:0 "逐步地，我们的统治扩展到地球的表面，我们的目光瞄准了#E 伊庇鲁特人#!——我们必须为即将到来的战争准备好对他们的宣称。\n\n\n\n\n\n\n\n\n\n@greek_mil14!"
 nuragic_mission_02_inv_task_4_DESC:0 "现在我们的直接威胁已经解决了，我们终于有时间喘口气，考虑除了生死问题之外的其他事情。也许我们可以向我们不熟悉的水域派出一支探索性的考察队？虽然为舰队配备人员会有一定的费用，但对于我们的地图绘制者来说，了解我们周围的土地状况也是一件好事。\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 nuragic_mission_02_inv_task_5:0 "在海滩上划船"
 nuragic_mission_02_inv_task_50:0 "前往迦太达什特"
 nuragic_mission_02_inv_task_50_DESC:0 "在公海上证明了我们已经超越了#E 迦太基#!的海军之后，是时候给予他们最终的羞辱，夺取他们在#E 非洲#!的核心领土了。\n\n\n\n\n\n\n\n\n\n@egypt_mil24!"
 nuragic_mission_02_inv_task_51:0 "战胜我们昔日的敌人"
 nuragic_mission_02_inv_task_51_DESC:0 "有人说'复仇是一道冷着吃最好的菜'，在四百年的间歇性战斗之后，我们夺取了迦太基人的首都[GetProvince('(int32)3256').GetName]，震惊了世界。今天，在我们的首都[ROOT.GetCountry.GetCapital.GetName]和撒丁岛的许多努拉盖中，将举行狂野的庆祝活动！\n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 nuragic_mission_02_inv_task_52:0 "控制努米底亚的通行权"
 nuragic_mission_02_inv_task_52_DESC:0 "通过夺取#E 努米底亚#!宝贵的沿海领土，我们将阻止任何救援部队登陆，使我们的部队能够在大陆上完成他们的工作，而不必担心受到攻击。\n\n\n\n\n\n\n\n\n\n@greek_mil9!"
 nuragic_mission_02_inv_task_53:0 "聚焦昔兰尼"
 nuragic_mission_02_inv_task_53_DESC:0 "神奇植物#Y 罗盘草#! @silphium! 大量生长的土地可以为我们所取；我们所要做的就是准备我们的宣称，并为即将到来的激战准备好我们的部队。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 nuragic_mission_02_inv_task_54:0 "拓展格尔蒂"
 nuragic_mission_02_inv_task_54_DESC:0 "在尽我们所能制服克里特人之后，我们决定扩建[GetProvince('(int32)361').GetName]城，并将其变成一个真正的[ROOT.GetCountry.GetAdjective]殖民地。\n\n\n\n\n\n\n\n\n\n@italic_mil24!"
 nuragic_mission_02_inv_task_55:0 "我们，回来了"
 nuragic_mission_02_inv_task_55_DESC:0 "很久很久以前，#E 黎凡特#!的军队曾成功击退了#T 海族#!——我们杰出的先辈——的入侵，取得了一些成功。然而，预兆已经显现，众神不会再保护他们第二次了！\n\n我们回来完成曾经开始的工作——我们已经证明我们是#Y 福耳库斯#!的真正继承人，我们人民最强大的统治者。\n\n\n\n\n\n\n\n\n\n@egypt_mil11!"
 nuragic_mission_02_inv_task_56:0 "彻底毁灭"
 nuragic_mission_02_inv_task_56_DESC:0 "我们的记忆很长，我们不习惯宽恕我们的死敌——问问#E 迦太基#!的残余势力，反抗我们的军队对他们来说是什么下场。想象一下，当我们的战舰驶向迦太基人的古老家园时，我们脸上的喜悦。仅仅摧毁他们的殖民地是不够的，我们将彻底毁灭他们！\n\n\n\n\n\n\n\n\n\n@italic_mil11!"
 nuragic_mission_02_inv_task_57:0 "非利士的前哨"
 nuragic_mission_02_inv_task_57_DESC:0 "既然我们的人民可以安全地生活在这里，我们应该在非利士建立一座[ROOT.GetCountry.GetAdjective]殖民地。\n\n\n\n\n\n\n\n\n\n@italic_mil23!"
 nuragic_mission_02_inv_task_58:0 "这是我们的圣地了"
 nuragic_mission_02_inv_task_58_DESC:0 "有许多民族声称受神祝福，但在他们需要的时候，这些神在哪里？我们已经摧毁了试图阻挡我们的集结军队，但残酷的现实是，他们失去了一切，现在这是我们的圣地——我们想要神庙中的所有珍宝。\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 nuragic_mission_02_inv_task_59:0 "我们先祖失败的地方"
 nuragic_mission_02_inv_task_59_DESC:0 "古老的#E 埃及人#!喜欢吹嘘他们如何击退了#T 海族#!，在他们的国家各地雕刻石碑宣扬他们的胜利。是时候为过去的错误复仇了！这次我们将彻底毁灭他们！\n\n\n\n\n\n\n\n\n\n@egypt_mil12!"
 nuragic_mission_02_inv_task_5_DESC:0 "我们的船工正忙于建造我们的船队，但这并不意味着我们不能训练我们的水手--我们将把人安置在海滩上，让他们练习划船。\n\n\n\n\n\n\n\n\n\n@egypt_mil10!"
 nuragic_mission_02_inv_task_6:0 "青铜器的测量"
 nuragic_mission_02_inv_task_60:0 "你的沙漠不复存在"
 nuragic_mission_02_inv_task_60_DESC:0 "对#E 埃及人#!和入侵的#E 马其顿人#!来说，这是黑暗的一天，他们看到自己的辛勤劳动化为灰烬，口中充满苦涩。但我们的目标不仅是摧毁敌人，还有更大的奖赏——建立一个新的王朝。\n\n\n\n\n\n\n\n\n\n@egypt_mil14!"
 nuragic_mission_02_inv_task_61:0 "萨达纳王朝"
 nuragic_mission_02_inv_task_61_DESC:0 "谁能与[ROOT.GetCountry.GetRuler.GetName]相比，他将我们的人民从毁灭的边缘带到了最高的王座？愿新建立的#T 萨达纳王朝#!统治世界，直到时间的尽头！\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 nuragic_mission_02_inv_task_62:0 "希腊将属于我们"
 nuragic_mission_02_inv_task_62_DESC:0 "我们不会让不团结的希腊人将我们拒于希腊之外，而是利用他们的分裂将其全部占为己有。\n\n\n\n\n\n\n\n\n\n@greek_mil5!"
 nuragic_mission_02_inv_task_63:0 "在拉科尼亚立足"
 nuragic_mission_02_inv_task_63_DESC:0 "我们已决定在斯巴达人的领土上建立一座殖民地，希望他们传说中尚武精神能影响我们的人。\n\n\n\n\n\n\n\n\n\n@persia_mil2!"
 nuragic_mission_02_inv_task_64:0 "前往马其顿和色雷斯"
 nuragic_mission_02_inv_task_64_DESC:0 "让我们乘胜追击，向北推进，进入#E 马其顿#!和#E 色雷斯#!的土地。我们不能让敌人喘息，必须持续施压！\n\n\n\n\n\n\n\n\n\n@persia_mil1!"
 nuragic_mission_02_inv_task_65:0 "亚细亚之滨"
 nuragic_mission_02_inv_task_65_DESC:0 "有许多强大的帝国争夺过#E 亚细亚#!海岸的控制权，我们是最新尝试的……我们与他们的区别在于，我们不会失败！\n\n\n\n\n\n\n\n\n\n@persia_mil8!"
 nuragic_mission_02_inv_task_66:0 "黑海之门"
 nuragic_mission_02_inv_task_66_DESC:0 "控制#E 黑海#!入口的地区深受我们人民的垂青，他们总是喜欢方便地通往海洋。如果我们把这个地区夺过来，用我们的殖民者填满它，几代人之后，这里的所有人都将说[ROOT.GetCountry.GetAdjective]方言。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 nuragic_mission_02_inv_task_67:0 "佩拉斯吉亚的哈尔基季基"
 nuragic_mission_02_inv_task_67_DESC:0 "世界总是可以更多地拥有[ROOT.GetCountry.GetAdjective]定居者，而美丽的#E 哈尔基季基#!半岛很快将成为最新的努拉吉克殖民地。\n\n\n\n\n\n\n\n\n\n@italic_mil15!"
 nuragic_mission_02_inv_task_68:0 "进入陶里卡"
 nuragic_mission_02_inv_task_68_DESC:0 "一位撒丁贵族和他的儿子，都是[ROOT.GetCountry.GetName]的忠诚公民，正在[GetProvince('(int32)1453').GetName]筹集资金组建一支军团，其唯一目的就是入侵#Y 陶里卡#!地区的城市。\n\n#T 两位高技能角色将加入我们的宫廷。#!\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 nuragic_mission_02_inv_task_69:0 "伊比利亚人之王"
 nuragic_mission_02_inv_task_69_DESC:0 "#E 伊比利亚半岛#!长期以来一直是许多强权觊觎的对象，可恨的迦太基人是最近试图征服这些野蛮部落领土的。\n\n然而，我们在许多人失败的地方成功了，凭借征服的权利，[ROOT.GetCountry.GetRuler.GetName]可以宣布我们是新的#Y 伊比利亚之王#!。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 nuragic_mission_02_inv_task_6_DESC:0 "为了处理我们预期的业务量，我们必须大大扩展我们的商业区。而且，我们知道外国商人是多么爱打官司，因此，建立一些合法的建筑也是明智的。\n\n虽然我们预计在施工期间会有一段时间的混乱，但我们无疑会从经验中学习新的东西。\n\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 nuragic_mission_02_inv_task_7:0 "海洋永不满足"
 nuragic_mission_02_inv_task_70:0 "巩固努米底亚"
 nuragic_mission_02_inv_task_70_DESC:0 "虽然我们是海洋的主人，但我们对成为更好的骑手的可能性非常感兴趣。通过巩固努米底亚地区，我们也可能从这些著名的骑手那里获得宝贵的知识。\n\n\n\n\n\n\n\n\n\n@india_mil18!"
 nuragic_mission_02_inv_task_71:0 "剑与王冠"
 nuragic_mission_02_inv_task_71_DESC:0 "通过统一我们人民曾经破碎的故土——一项被认为只有真正的[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]才能完成的任务——一位部落长老从偏远地区带着神圣的文物出现，要交给[ROOT.GetCountry.GetRuler.GetName]；传说中的#Y 王冠#!和#Y 剑#!，属于撒丁人民的第一位统治者#Y 福耳库斯#!。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 nuragic_mission_02_inv_task_72:0 "萨达那之海"
 nuragic_mission_02_inv_task_72_DESC:0 "既然我们已经摧毁了海上对手挑战我们海军霸主地位的能力，是时候宣告新时代的来临了，一个我们成为#T 萨达那之海#!无可争议的主人的时代。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 nuragic_mission_02_inv_task_73:0 "纪念我们的伟大"
 nuragic_mission_02_inv_task_73_DESC:0 "在征服了许多集结起来反对我们的敌人之后，[ROOT.GetCountry.GetRuler.GetName]决定将[ROOT.GetCountry.GetRuler.GetHerHis]的注意力转向内部，认为现在是建造一座巨大纪念碑的时候了，以纪念我们国家永恒的成就。\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 nuragic_mission_02_inv_task_74:0 "进攻马赛利亚"
 nuragic_mission_02_inv_task_74_DESC:0 "从我们在[GetProvince('(int32)3511').GetName]的新城市，我们将准备一支强大的力量，向北航行，心中只有一个目标——进攻[GetProvince('(int32)2325').GetName]！他们绝不会看到我们的到来！\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 nuragic_mission_02_inv_task_75:0 "大门敞开"
 nuragic_mission_02_inv_task_75_DESC:0 "现在[GetProvince('(int32)2325').GetName]牢牢掌握在我们手中，还有什么能阻止我们进一步扩展到#E 高卢#!？绝对没有——大门已经敞开，再也没有人守卫入口了……\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 nuragic_mission_02_inv_task_76:0 "一盘菜,凉了才好吃（君子报仇十年不晚）"
 nuragic_mission_02_inv_task_76_DESC:0 "[GetProvince('(int32)3256').GetName]该如何处置？难道要放任他们对先辈犯下的罪行逍遥法外？还是要给予他们从未有过的宽恕？诸多抉择尚待定夺……\n\n#Y 将触发事件，由[ROOT.GetCountry.GetRuler.GetName]决定迦太达什特的最终命运#!。\n\n\n\n\n\n\n\n\n\n@italic_mil21!"
 nuragic_mission_02_inv_task_7_DESC:0 "维持一支强大的海军舰队的费用在不断增加，每一个新的日子似乎都会带来另一笔需要处理的债务。尽管我们的口袋是敞开的，但海洋永远不会满足于它所得到的，而且总是渴望得到更多；我们需要更多的水手，为我们的港口提供更多的工人......哦，对了，我们还需要确保我们有足够的布用于航行。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 nuragic_mission_02_inv_task_8:0 "海之女皇"
 nuragic_mission_02_inv_task_8_DESC:0 "虽然有许多航海国家在整个水域航行，但没有一个国家能在技术和胆量方面与我们相比。当人们把我们的国家，特别是我们的首都港口称为 海洋皇后 时，并没有夸大其词，因为我们以一种无与伦比的优雅和风格耸立在我们的同行之上。\n\n\n\n\n\n\n\n\n\n@egypt_mil23!"
 nuragic_mission_02_inv_task_9:0 "奴隶市场"
 nuragic_mission_02_inv_task_9_DESC:0 "我们的声誉是否是公平赢得的，不是由我们的人民决定的；然而，真实的情况是，所有的人都认为我们是袭击者和奴隶贩子。我们的奴隶船在水面上快速移动，沿着内陆的溪流，直到我们到达村庄，然后接下来会发生什么是我们和神之间的事。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"

 barbaricum_aremorica_event_15:0 "我们将能决定如何统治#G 贝提卡#!。"
 barbaricum_aremorica_event_16:0 "我们将能成为一个 #Y 财阀共和国#!."
 barbaricum_aremorica_event_18:0 "我们将派遣冒险者前往地中海文明中心——金字塔之地。"
 barbaricum_aremorica_event_21:0 "我们的统治者将能咨询#T 加利塞尼的神谕#!。"

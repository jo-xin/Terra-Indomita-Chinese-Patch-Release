 barbaricum_aremorica_mission:0 "在大西洋之前"
 barbaricum_aremorica_mission_BUTTON_TOOLTIP:0 "海洋在我们身后，我们把注意力转向内陆，转向敌人..."
 barbaricum_aremorica_mission_CRITERIA_DESCRIPTION:0 "这项任务将被视为完成当我们在海岸线上建立并完善了我们强大的王国时。"
 barbaricum_aremorica_mission_DESCRIPTION:0 "无论是由于环境还是神的眷顾，我们的人民都有幸拥有与海洋相连的领土，广袤无尽的水域孕育着陆地。让我们的部落像波浪一样，无情而不息，将我们的统治扩展到大西洋对面的任何土地。"
 barbaricum_aremorica_mission_task_1:0 "阿雷摩里卡贸易"
 barbaricum_aremorica_mission_task_10:0 "穿越狭海"
 barbaricum_aremorica_mission_task_10_DESC:0 "分隔#G 不列颠尼亚#!与大陆的海峡极为狭窄，晴日里站在海岸甚至能望见岛屿。集结舰队，准备释放我们的怒火！不列颠尼亚必将属于我们！\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_aremorica_mission_task_11:0 "弗里西海岸"
 barbaricum_aremorica_mission_task_11_DESC:0 "我们的征服战争遭遇了陌生蛮族，他们不敬神明，残暴如野兽。我们渴望占据这些野蛮人栖息的湿地，战争在所难免——但胜利终将属于我们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 barbaricum_aremorica_mission_task_12:0 "大阿雷摩里卡"
 barbaricum_aremorica_mission_task_12_DESC:0 "无可否认，我们的势头很好；所有的敌人都措手不及，无法拖住我们。跟随他们撤退的军队，向南推进，到山里去!不要让任何人逃脱!\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_aremorica_mission_task_13:0 "坎塔布里亚的海岸"
 barbaricum_aremorica_mission_task_13_DESC:0 "#G 伊比利亚#!的崇山峻岭为半岛部落提供了天然屏障，但再险峻的高地也阻挡不了我们。#G 坎塔布里亚海岸#!终将归我们所有！\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_aremorica_mission_task_14:0 "卢西塔尼亚的海岸"
 barbaricum_aremorica_mission_task_14_DESC:0 "在#G 坎塔布里亚#!站稳脚跟后，我军已开始袭扰#G 卢西塔尼亚人#!——我们明确视这片土地为天然疆域，必将采取必要手段征服它。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_aremorica_mission_task_15:0 "直到卡尔培的海格力斯之柱"
 barbaricum_aremorica_mission_task_15_DESC:0 "酋长大人，听说过遥远的南方国度#G 贝提卡#!吗？那里因优越位置和发达商路而富甲天下。虽然困难重重，但只要敢打敢拼，我们就能将其据为己有。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 barbaricum_aremorica_mission_task_16:0 "大西洋的统治地位"
 barbaricum_aremorica_mission_task_16_DESC:0 "谁敢否认我们是无可争议的#T 大西洋之主#!？目睹我们的疆域，谁不敬畏我们的成就？还有哪个蠢货胆敢挑战我们的霸权？\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 barbaricum_aremorica_mission_task_17:0 "一个新的琥珀渠道"
 barbaricum_aremorica_mission_task_17_DESC:0 "琥珀@amber!是一种你们的人民不可或缺的贸易商品；没有哪位自重的战士或酋长会不佩戴琥珀首饰就出现在众人面前——无论是手腕还是颈间。考虑到我们始终存在的需求，应当考虑增加进口量。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 barbaricum_aremorica_mission_task_18:0 "地中海奢侈品"
 barbaricum_aremorica_mission_task_18_DESC:0 "我们国库中的钱币继续增长，用繁荣的洪水淹没我们的国库。随着我们王国的发展，我们对美好事物的品味也在不断提高；我们是多么幸运啊，可以用我们希望的任何东西来放纵自己。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil16!"
 barbaricum_aremorica_mission_task_19:0 "使迦太基黯然失色"
 barbaricum_aremorica_mission_task_19_DESC:0 "我们几乎每日都会收到与#G 迦太基#!的海上冲突报告，他们非但不给予我们应有的尊重，还企图欺凌我们的商人。尽管他们是海上强权，但我们有意志和野心在其主场击败他们。\n\n\n\n\n\n\n\n\n\n\n@greek_mil19!"
 barbaricum_aremorica_mission_task_19_naval_parity_tooltip:0 "至少与#G 迦太基#!保持海军均势。"
 barbaricum_aremorica_mission_task_1_DESC:0 "我们伸入#Y 大西洋#!的#G 奥西斯弥亚#!行省是与远近邻邦建立经济联系的理想枢纽。加强贸易路线必将赢得我们应得的尊重。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 barbaricum_aremorica_mission_task_2:0 "建造海上堡垒 "
 barbaricum_aremorica_mission_task_20:0 "由图塔蒂斯"
 barbaricum_aremorica_mission_task_20_DESC:0 "展现你的虔诚，呼唤图塔蒂斯并请求他的祝福，使神圣三位一体的恩赐得以显现。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_aremorica_mission_task_21:0 "加利塞尼的神谕"
 barbaricum_aremorica_mission_task_21_DESC:0 "据说只要我们做好准备，建造圣地并由虔诚者引领我们进行祭祀，我们就有资格咨询#T 加利塞尼神谕#!。诸神将向我们揭示什么？\n\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 barbaricum_aremorica_mission_task_22:0 "罗马人疯了"
 barbaricum_aremorica_mission_task_22_DESC:0 "虽然关于好战的#R 罗马人#!已经说了很多，但根据我们与他们打交道的亲身经历，我们要补充：他们疯了。若能一劳永逸地教训他们，世界将会变得更安全...\n\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 barbaricum_aremorica_mission_task_23:0 "扩大贸易网络"
 barbaricum_aremorica_mission_task_23_DESC:0 "虽然我们当然控制着北部岛屿的贸易业务，但我们可以采取措施扩大我们现有的网络。建设港口是确保货物进出我们领土的关键步骤。\n\n\n\n\n\n\n\n\n\n\n@event_pic8!"
 barbaricum_aremorica_mission_task_2_DESC:0 "谨慎要求我们建立一个防御工事网络，不仅要保护我们免受内陆威胁，还要防止敌方舰队袭击我们的领土而不受伤害。 \n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_aremorica_mission_task_2_tt:0 "在[GetProvince('(int32)2159').GetArea.GetName|G]、[GetProvince('(int32)2146').GetArea.GetName|G]和[GetProvince('(int32)2216').GetArea.GetName|G]地区各至少拥有一座沿海要塞。"
 barbaricum_aremorica_mission_task_3:0 "建立一个船队"
 barbaricum_aremorica_mission_task_3_DESC:0 "任何有自尊心的海上力量都需要海军将他们的意志投射到国外，并防止海盗横行。给我们的造船厂发消息并命令组建一支舰队。\n\n\n\n\n\n\n\n\n\n\n@greek_mil11!"
 barbaricum_aremorica_mission_task_4:0 "引导海洋的力量"
 barbaricum_aremorica_mission_task_4_DESC:0 "我们将像大海一样，横扫我们的敌人，淹没他们——谁能抵抗我们突然释放的洪水？ 即使是现在，我们的力量也在膨胀，就像不祥的乌云聚集已露端倪。。。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_aremorica_mission_task_4_tt:0 "拥有一个沿海省份，其人口至少15，主流文化为#G 阿雷摩里卡#!且主流宗教为#T 德鲁伊教#!。"
 barbaricum_aremorica_mission_task_5:0 "阿雷摩里卡半岛的统一"
 barbaricum_aremorica_mission_task_5_DESC:0 "我们肩负着统一#G 阿雷摩里卡半岛#!的使命，全面胜利的时刻即将来临。稳固后方后，便可剑指往日不敢进犯的远方。\n\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_aremorica_mission_task_6:0 "杜姆诺尼亚的贡品"
 barbaricum_aremorica_mission_task_6_DESC:0 "虽然与北方邻居#G 杜姆诺尼亚人#!历来交好，但部落长老们宣称必须征服这个弱于我们的民族。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_aremorica_mission_task_7:0 "西北贸易网"
 barbaricum_aremorica_mission_task_7_DESC:0 "#Y 不列颠海#!对岸有我们渴求的珍品，这些货物在大陆绝无仅有。应当向北扩展贸易网络，甚至可在希伯尼亚岛建立据点。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_aremorica_mission_task_8:0 "致欧卡德人"
 barbaricum_aremorica_mission_task_8_DESC:0 "我军已征服#G 不列颠尼亚#!全境，粉碎一切抵抗，完成了史无前例的统一。在这胜利时刻，我们需要决定未来走向...\n\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_aremorica_mission_task_9:0 "要求东海岸"
 barbaricum_aremorica_mission_task_9_DESC:0 "半岛既已稳固，便可北进嗜血的#G 比利其人#!领地。准备迎接恶战吧，这些敌人凶猛异常，绝不会轻易放弃土地。\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_aremorica_mission_task_9_tt:0 "在[GetProvince('(int32)2471').GetArea.GetName|G]、[GetProvince('(int32)3028').GetArea.GetName|G]和[GetProvince('(int32)3844').GetArea.GetName|G]地区各拥有一座港口。"
 barbaricum_bastarnia_claims_1_tt:0 "我们获得了对[GetProvince('(int32)4801').GetArea.GetName|G]、[GetProvince('(int32)4521').GetArea.GetName|G]、[GetProvince('(int32)4814').GetArea.GetName|G]、[GetProvince('(int32)4526').GetArea.GetName|G]和[GetProvince('(int32)4520').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_bastarnia_claims_2_tt:0 "我们获得了对[GetProvince('(int32)4530').GetArea.GetName|G]、[GetProvince('(int32)4533').GetArea.GetName|G]和[GetProvince('(int32)4536').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_bastarnia_claims_4_tt:0 "我们获得了对[GetProvince('(int32)4247').GetArea.GetName|G]、[GetProvince('(int32)4259').GetArea.GetName|G]、[GetProvince('(int32)4814').GetArea.GetName|G]、[GetProvince('(int32)4520').GetArea.GetName|G]、[GetProvince('(int32)4232').GetArea.GetName|G]和[GetProvince('(int32)4223').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_bastarnia_mission:0 "东方财富传说"
 barbaricum_bastarnia_mission_CRITERIA_DESCRIPTION:0 "一旦我们迁移到东部并征服了黑海以西的富饶土地，这个任务树就会完成。"
 barbaricum_bastarnia_mission_DESCRIPTION:0 "多年来，我们的人民一直生活在维斯图利亚的森林里，过着简单的生活。然而最近，气候变得越来越恶劣，我们的许多作物和人都在冬季死亡。如果我们想在接下来的日子里生存下去，我们就必须在更远的南部海域重新定居。我们听说东部有丰富而肥沃的土地。这些土地上的人们生活在充满大理石和黄金的大城市里。但我们比他们强大得多，要掠夺他们的富饶城市，并将其据为己有是很容易的。  "
 barbaricum_bastarnia_mission_REWARD_DESCRIPTION:0 "获得对黑海以西的一些领土的宣称，并索取他们的财富。"
 barbaricum_bastarnia_mission_task_1:0 "迁徙准备"
 barbaricum_bastarnia_mission_task_10:0 "我们的老家"
 barbaricum_bastarnia_mission_task_10_DESC:0 "我们离开的地区仍有人居住，因此可以把战利品卖给他们以获取丰厚利润；毕竟我们袭掠过东方邻人后，他们不太愿意再和我们贸易。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_bastarnia_mission_task_1_DESC:0 "东迁之路漫长艰辛。我们必须确保有足够粮食支撑到新家园。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_bastarnia_mission_task_2:0 "循迹而行"
 barbaricum_bastarnia_mission_task_2_DESC:0 "侦察兵报告海边有片人烟稀少的土地，气候远比维斯图利亚故土宜人。暂时定居此地可作为未来劫掠的前哨站。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_bastarnia_mission_task_3:0 "多瑙河三角洲"
 barbaricum_bastarnia_mission_task_3_DESC:0 "#Y 多瑙河#!是北方强族与南方富弱之民的分界线。控制三角洲地区将便利我们劫掠那些浮夸#G 希腊人#!的富庶土地。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_bastarnia_mission_task_4:0 "南方盟友"
 barbaricum_bastarnia_mission_task_4_DESC:0 "南方是#G 马其顿#!诸王的领地。相传其中一位曾几乎征服全世界，如今他的帝国却分崩离析。我们可以趁乱结交有价值的盟友。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_bastarnia_mission_task_5:0 "焚毁奥尔比亚"
 barbaricum_bastarnia_mission_task_5_DESC:0 "东方有座名为#T 奥尔比亚#!的巨城。俘虏和当地人讲述着关于它的传说，据说这是#Y 黑海#!沿岸最富庶的城市，藏着堪比[GetDeityDefinition('omen_gautr').GetName|T]的珍宝！\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_bastarnia_mission_task_6:0 "亚速海"
 barbaricum_bastarnia_mission_task_6_DESC:0 "在#T 奥尔比亚#!以东的#Y 黑海#!北岸，是#G 博斯普鲁斯王国#!的城邦。他们的土地物产丰饶，甚至有余粮出口。这些城墙之后，还藏着多少待我们攫取的财宝？\n\n\n\n\n\n\n\n\n\n@persia_mil18!"
 barbaricum_bastarnia_mission_task_7:0 "捍卫我们的新家园"
 barbaricum_bastarnia_mission_task_7_DESC:0 "我们的新位置开启了许多通往荣耀与财富的道路，但新家园绝称不上安全。敌对本地人与其他渴求权力的部落潜伏在每个角落。我们必须先强化防御能力，然后再寻求进攻。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_bastarnia_mission_task_8:0 "巴斯塔奈联邦"
 barbaricum_bastarnia_mission_task_8_DESC:0 "近来的迁徙、征服和袭掠，使大量不同民族与文化涌入我们的领地。共同目标和共同成功把我们凝聚在一起，但为了未来，确立一个共同认同象征会大有裨益。唯有如此，我们才会真正势不可挡。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_bastarnia_mission_task_9:0 "定居摩厄西亚"
 barbaricum_bastarnia_mission_task_9_DESC:0 "#Y 多瑙河#!以南居住着#G 色雷斯人#!。这些半开化民族既非希腊人也非纯粹蛮族，征服他们易如反掌且获利丰厚。\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 barbaricum_bituriges_mission:0 "世界之王"
 barbaricum_bituriges_mission_task_1:0 "宴会准备"
 barbaricum_bituriges_mission_task_10:0 "征服西海岸"
 barbaricum_bituriges_mission_task_11:0 "南方的比图里吉人"
 barbaricum_bituriges_mission_task_12:0 "去莱茵河"
 barbaricum_bituriges_mission_task_13:0 "去南部海岸"
 barbaricum_bituriges_mission_task_14:0 "询问德鲁伊祭司"
 barbaricum_bituriges_mission_task_15:0 "狂野的北方凯尔特人"
 barbaricum_bituriges_mission_task_16:0 "重走Belovesus之路"
 barbaricum_bituriges_mission_task_17:0 "征服北意大利"
 barbaricum_bituriges_mission_task_18:0 "重走Segovesus之路"
 barbaricum_bituriges_mission_task_19:0 "垦殖海西森林"
 barbaricum_bituriges_mission_task_2:0 "马赛利亚的宝物"
 barbaricum_bituriges_mission_task_20:0 "陶器的大量生产"
 barbaricum_bituriges_mission_task_21:0 "世界的国王"
 barbaricum_bituriges_mission_task_3:0 "一场盛大宴会"
 barbaricum_bituriges_mission_task_4:0 "保护马赛利亚"
 barbaricum_bituriges_mission_task_5:0 "中部凯尔特联盟"
 barbaricum_bituriges_mission_task_6:0 "赞助马叙利亚艺术"
 barbaricum_bituriges_mission_task_7:0 "马赛利亚的学者"
 barbaricum_bituriges_mission_task_8:0 "所有的凯尔特人必须臣服"
 barbaricum_bituriges_mission_task_9:0 "征服阿雷摩里卡"
 barbaricum_bohemia_mission:0 "波西人的家园"
 barbaricum_bohemia_mission_CRITERIA_DESCRIPTION:0 "当#E 波西人#!巩固对祖地周边领土的控制时，该任务将视为完成。"
 barbaricum_bohemia_mission_DESCRIPTION:0 "盘踞在[ROOT.GetCountry.GetName]嶙峋山脉与林间幽谷的野蛮部族，以其凶悍闻名文明世界。这些游荡的蛮族周期性迁徙，觊觎着富庶城邦的珍宝。但部落中亦有智者主张在远征前先建设故土。"
 barbaricum_bohemia_mission_task_1:0 "玻伊联邦"
 barbaricum_bohemia_mission_task_10:0 "日耳曼威胁"
 barbaricum_bohemia_mission_task_10_DESC:0 "北方凶悍的#R 日耳曼#!部族虽在武勇上不及#G 波西人#!，却仍是不容忽视的威胁。为长远计，必须巩固边境防备这些嗜血蛮族，以免遭其突袭。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_bohemia_mission_task_11:0 "卢吉亚联盟"
 barbaricum_bohemia_mission_task_11_DESC:0 "我们应向#G 汪达尔人#!提议建立由[ROOT.GetCountry.GetRuler.GetName|Y]主导的互利同盟。希望他们明白与#G 波西人#!合作最符合其利益——除非我们改变对他们的看法...\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_bohemia_mission_task_12:0 "琥珀海岸"
 barbaricum_bohemia_mission_task_12_DESC:0 "琥珀是南方诸城极受追捧的贸易品，用于制作珠宝和其他耀眼小饰物。如果我们不再充当法罗德尼亚和鲁吉亚的中间商，而是直接控制这些资源，就能赚上一大笔。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_bohemia_mission_task_13:0 "潘诺尼亚的统治"
 barbaricum_bohemia_mission_task_13_DESC:0 "#G  潘诺尼亚#!诸部终弃兵刃，意识到反抗#G 波西人#!的徒劳。巩固战果后，我们已将目光投向好战的#R 达契亚人#!土地。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_bohemia_mission_task_13_claims_tt:0 "我们获得在[GetProvince('(int32)4285').GetArea.GetName|G],[GetProvince('(int32)4291').GetArea.GetName], [GetProvince('(int32)4299').GetArea.GetName|G]和[GetProvince('(int32)4275').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_bohemia_mission_task_14:0 "达契亚威胁"
 barbaricum_bohemia_mission_task_14_DESC:0 "现状已难维持——心怀嫉妒的#R 达契亚人#!屡在边境挑衅，对我们的领土完整警告置若罔闻。是时候考虑直接征服这些麻烦制造者了。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_bohemia_mission_task_15:0 "玻伊海弥亚联邦"
 barbaricum_bohemia_mission_task_15_DESC:0 "启程时我们未曾料想能取得如此成就。再无人敢称我们是在荒山苟活的蛮族。我们建立了#T 玻伊海弥亚联邦#!，这坚实根基必将托起辉煌未来。\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 barbaricum_bohemia_mission_task_16:0 "诺里库姆的铁矿"
 barbaricum_bohemia_mission_task_16_DESC:0 "夺取#G 诺雷亚#!的山口有双重意义：既能畅通无阻地穿越#G 卡耳尼亚的阿尔卑斯#!山脉，让我们每年春季都能南下劫掠，又能获取岩丘中的铁矿@iron!资源。\n\n\n\n\n\n\n\n\n\n@india_mil6!"
 barbaricum_bohemia_mission_task_17:0 "拉基亚孔的盐"
 barbaricum_bohemia_mission_task_17_DESC:0 "盐@salt!作为调味品和防腐剂是珍贵商品，而#G 波西人#!已对其产生依赖。我们应当进驻#G 拉基亚孔#!——该地区不宜饮用的浅湖足以生产我们所需的粗盐。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_bohemia_mission_task_18:0 "[ROOT.GetCountry.GetName]的崛起"
 barbaricum_bohemia_mission_task_18_DESC:0 "族人呼吁改革政体，认为现有制度已不合时宜。不出所料，[ROOT.GetCountry.GetRuler.GetName|Y]对此深表赞同。\n\n#Y 我们将面临选择：建立#! #T 君主制#! #Y 或成立#! #T 共和制#!。\n\n\n\n\n\n\n\n\n\n@celt_mil4!"
 barbaricum_bohemia_mission_task_1_DESC:0 "部落酋长间的内斗严重削弱了我们的实力。起伏的山丘、密林与峻岭不仅助长部族割据，更阻碍中央集权。\n\n唯有强化[ROOT.GetCountry.GetRuler.GetName|Y]的绝对权威，方能开创未来。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_bohemia_mission_task_2:0 "新货币标准化"
 barbaricum_bohemia_mission_task_2_DESC:0 "与其他#G 凯尔特#!部落不同，我们自豪地铸造着自己的金币。应当推行货币标准化——效仿伟大君王将酋长肖像铸于钱币，必能提升国内外声望。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_bohemia_mission_task_3:0 "柏弥亚卫城"
 barbaricum_bohemia_mission_task_3_DESC:0 "圣林环绕的[GetProvince('(int32)3937').GetName|G]毗邻首都，是兴建新城的理想之地。我们应在财力允许时着手建设，更可在圣地建造#T 大神殿#!取悦诸神。\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 barbaricum_bohemia_mission_task_4:0 "殖民玻伊海弥亚盆地"
 barbaricum_bohemia_mission_task_4_DESC:0 "资源丰饶的#G 玻伊海弥亚盆地#!亟待全面开发。近期连战连捷后，我们终有能力号召族人迁居这片名义上归属我们的土地。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_bohemia_mission_task_4_tt:0 "我们将能够整合玻伊海弥亚盆地的人民。"
 barbaricum_bohemia_mission_task_5:0 "陶里斯基亚联盟"
 barbaricum_bohemia_mission_task_5_DESC:0 "虽与#G 陶里斯基亚人#!素来交好，但应通过贸易深化关系。经济纽带或能孕育真挚友谊。\n\n\n\n\n\n\n\n\n\n@greek_mil13!"
 barbaricum_bohemia_mission_task_5_claims_tt:0 "我们获得了对[GetProvince('(int32)3919').GetArea.GetName|G], [GetProvince('(int32)4144').GetArea.GetName],[GetProvince('(int32)4852').GetArea.GetName|G]和[GetProvince('(int32)4876').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_bohemia_mission_task_6:0 "陶里斯基亚贸易"
 barbaricum_bohemia_mission_task_6_DESC:0 "尽管#G 波西人#!无所畏惧，我们仍愿与志同道合者结盟。与#G 陶里斯基亚人#!的贸易繁荣或将促成共同对抗南方部落的军事同盟。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_bohemia_mission_task_7:0 "进入潘诺尼亚"
 barbaricum_bohemia_mission_task_7_DESC:0 "整个#G 潘诺尼亚#!都臣服在我们的武力之下。若能沿#G 塞莱曼蒂亚#!与#G 夸狄亚#!的河谷密林推进，运气好的话甚至能将疆域扩展至#G 科提尼亚#!之地。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_bohemia_mission_task_7_claims_tt:0 "我们获得了对[GetProvince('(int32)4149').GetArea.GetName|G], [GetProvince('(int32)4158').GetArea.GetName], [GetProvince('(int32)4849').GetArea.GetName|G],[GetProvince('(int32)4856').GetArea.GetName|G]和[GetProvince('(int32)4831').GetArea.GetName]地区的所有领土的宣称。"
 barbaricum_bohemia_mission_task_8:0 "殖民苏台德山脉以外的土地"
 barbaricum_bohemia_mission_task_8_DESC:0 "据长老记忆，我们从未在#G 苏台德山脉#!以北定居，以往满足于劫掠。但时移世易，#G 波西人#!从不停滞。现在该派遣族人穿越山谷开拓这片处女地了。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_bohemia_mission_task_8_claims_tt:0 "我们获得了对[GetProvince('(int32)3995').GetArea.GetName|G],[GetProvince('(int32)3988').GetArea.GetName],[GetProvince('(int32)4010').GetArea.GetName|G], [GetProvince('(int32)4773').GetArea.GetName|G]和[GetProvince('(int32)4777').GetArea.GetName]地区的所有领土的宣称。"
 barbaricum_bohemia_mission_task_9:0 "开发我们的特兰苏台德的土地"
 barbaricum_bohemia_mission_task_9_DESC:0 "我们应在#G 苏台德山脉#!以北启动建设计划。见证文明茁壮成长堪称奇观——我们绝非靠劫掠为生的野蛮人，而是胸怀远见的建设者。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 barbaricum_bohemia_mission_task_9_tt:0 "[GetProvince('(int32)4012').GetArea.GetName|G]地区至少三个省份需无空闲建筑槽位。"
 barbaricum_form_francia_claims_1_tt:0 "我们获得了对[GetProvince('(int32)3778').GetArea.GetName|G]、[GetProvince('(int32)3976').GetArea.GetName|G]和[GetProvince('(int32)3699').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_form_francia_claims_2_tt:0 "我们获得了对[GetProvince('(int32)3728').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_form_francia_mission:0 "为了光荣和荣誉!"
 barbaricum_form_francia_mission_BUTTON_TOOLTIP:0 "西北日耳曼的人民呼唤一位强有力的领袖来统一各部族。我们的天命显而易见——我们注定要带领我们的人民走向更伟大的荣耀。"
 barbaricum_form_francia_mission_CRITERIA_DESCRIPTION:0 "统一伊斯特沃内斯诸部于你的旗帜下，并建立法兰克王国。"
 barbaricum_form_francia_mission_DESCRIPTION:0 "西北日耳曼的人民呼唤一位强有力的领袖来统一各部族。我们的天命显而易见——我们注定要带领我们的人民走向更伟大的荣耀。"
 barbaricum_form_francia_mission_REWARD_DESCRIPTION:0 "在你的领导下建立法兰克，你对西日耳曼人的统治地位不容置疑。"
 barbaricum_form_francia_mission_task_1:0 "一位领袖从无名中崛起"
 barbaricum_form_francia_mission_task_10:0 "铁棒标准"
 barbaricum_form_francia_mission_task_10_DESC:0 "目前，我们的人民也在使用外来的铁条标准。我们应当将本土标准编成定制：它比外来标准更高，形似长剑，如此便能便利贸易，并为商人与工匠提供明确规范。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_form_francia_mission_task_1_DESC:0 "许多不同的#G 日耳曼#!部落生活在#Y 莱茵河#!和#Y 威悉河#!之间，但没有一个部落占据主导地位。只有拥有足够力量的人才能希望统一这些不同的部族。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_form_francia_mission_task_2:0 "伊斯提约诸子"
 barbaricum_form_francia_mission_task_2_DESC:0 "作为 [GetDeityDefinition('omen_istaevo').GetName|G] 之子中最强大的一位，我们注定要将所有兄弟统一于我们的旗帜之下。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_form_francia_mission_task_3:0 "一个有价值的首都"
 barbaricum_form_francia_mission_task_3_DESC:0 "我们的首都经历了严重的增长之痛。如果得到正确的支持，它可能会成为一个繁荣的城市。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 barbaricum_form_francia_mission_task_4:0 "血与铁"
 barbaricum_form_francia_mission_task_4_DESC:0 "唯有通过血与铁，我们才能铸成统一。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_form_francia_mission_task_5:0 "中央集权的国家"
 barbaricum_form_francia_mission_task_5_DESC:0 "我们伟大的国家已经到了向更文明的定居国家过渡的时期了。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_form_francia_mission_task_6:0 "法兰克王国"
 barbaricum_form_francia_mission_task_6_DESC:0 "是时候让我们的人民在一位统治者的旗帜下获得新的共同身份了。我们是#G 法兰克人#!，勇敢的民族。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_form_francia_mission_task_7:0 "日耳曼-凯尔特人贸易"
 barbaricum_form_francia_mission_task_7_DESC:0 "作为凯尔特人与日耳曼苏维汇人之间的调停者，我们也能从双方贸易中获得丰厚利益。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_form_francia_mission_task_8:0 "锻炉之力"
 barbaricum_form_francia_mission_task_8_DESC:0 "我们的探矿者欣喜地报告称，他们在[GetProvince('(int32)3790').GetName]发现了铁。要让矿场运转起来需要花费不少钱，但矿藏似乎足以支撑一座矿场。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_form_francia_mission_task_8_tooltip:0 "在 #G $sicambria_area$#! 省内，任何拥有 #T 矿场#! 的领土将获得以下效果：\n"
 barbaricum_form_francia_mission_task_9:0 "一个贸易要塞"
 barbaricum_form_francia_mission_task_9_DESC:0 "我们必须在[GetProvince('(int32)3831').GetName]修建一座山堡，以保护两条贸易路线交汇之处。我们的建筑师已经划定了一片一点四公顷的区域。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_francia_austria_claims_1_tt:0 "我们获得了对[GetProvince('(int32)3718').GetArea.GetName|G]地区所有领土的宣称"
 barbaricum_francia_austria_claims_2_tt:0 "我们获得了对[GetProvince('(int32)3026').GetArea.GetName|G]、[GetProvince('(int32)2493').GetArea.GetName|G]和[GetProvince('(int32)2468').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_francia_austria_claims_3_tt:0 "我们获得了对[GetProvince('(int32)3041').GetArea.GetName]、[GetProvince('(int32)3054').GetArea.GetName|G]、[GetProvince('(int32)3055').GetArea.GetName|G]、[GetProvince('(int32)3802').GetArea.GetName|G]和[GetProvince('(int32)3806').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_francia_austria_mission:0 "萨利和里普阿利"
 barbaricum_francia_austria_mission_CRITERIA_DESCRIPTION:0 "征服并发展日耳曼诸河沿岸土地以及比利其人的土地。"
 barbaricum_francia_austria_mission_DESCRIPTION:0 "虽然我们的所有人民都自称法兰克人，但两大派系已经出现。居于北方伊萨拉河，即今日艾瑟尔河周边的萨利安人，以及居于雷努斯河，即今日莱茵河周边的里普里安人，正为扩张方向争执不休。我们应当追随萨利安人进入比利时，还是追随里普里安人进入莱茵兰？"
 barbaricum_francia_austria_mission_REWARD_DESCRIPTION:0 "获得对日耳曼尼亚和比利时地区的宣称，并为自己的国家谋取利益。"
 barbaricum_francia_austria_mission_task_1:0 "萨兰"
 barbaricum_francia_austria_mission_task_10:0 "日耳曼化改造"
 barbaricum_francia_austria_mission_task_10_DESC:0 "在我们新征服的土地上居住着许多不同的人；我们应该向他们展示我们诸神的光辉！\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_francia_austria_mission_task_11:0 "滨海法兰克人胜利了"
 barbaricum_francia_austria_mission_task_11_DESC:0 "是时候让我们的分支 #COLOR:{0.207,0.301,1} 滨海法兰克#! 支配全局，决定我们是向西扩张，还是占据河岸了。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_francia_austria_mission_task_12:0 "利普里安法兰克人的胜利"
 barbaricum_francia_austria_mission_task_12_DESC:0 "是时候让我们的分支 #COLOR:{0.361,0.807,0.525} 滨河法兰克#! 支配全局，决定我们是向西扩张，还是占据河岸了。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_francia_austria_mission_task_1_DESC:0 "萨利安法兰克人居住在我们领土北部，环绕伊萨拉河，即今日艾瑟尔河，这片土地与人民也因此得名。该地区覆盖着茂密森林，阻碍了进一步发展。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 barbaricum_francia_austria_mission_task_1_tt:0 "拥有一座位于[GetProvince('(int32)3851').GetArea.GetName|G]的城市"
 barbaricum_francia_austria_mission_task_2:0 "定居托克桑德里亚"
 barbaricum_francia_austria_mission_task_2_DESC:0 "在我们南方，越过雷努斯河，有一片肥沃土地。因其方位，我们在自己的语言中称之为托克桑德里亚。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_francia_austria_mission_task_3:0 "发展托克桑德里亚"
 barbaricum_francia_austria_mission_task_3_DESC:0 "我们应当发展新近获得的土地，并使其人口皈依我们的信仰。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_francia_austria_mission_task_4:0 "向西推进"
 barbaricum_francia_austria_mission_task_4_DESC:0 "富饶而繁荣的 #G 高卢#! 核心地区正在我们西方等待着我们。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_francia_austria_mission_task_5:0 "特纳库姆和卡马拉库姆"
 barbaricum_francia_austria_mission_task_5_DESC:0 "名为图尔纳库姆和卡马拉库姆的定居点，将会成为行政、贸易与文化的绝佳中心。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_francia_austria_mission_task_6:0 "巩固我们的西部边境"
 barbaricum_francia_austria_mission_task_6_DESC:0 "虽然塞夸纳河，也就是现代的塞纳河，是一道天然防线，但我们仍应修建防御工事，以防敌人从西方大举来攻。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_francia_austria_mission_task_6_tt:0 "在 [GetProvince('(int32)3038').GetArea.GetName] 和 [GetProvince('(int32)3035').GetArea.GetName|G] 区域需各有至少拥有 #T 3 座要塞#! 省份。"
 barbaricum_francia_austria_mission_task_7:0 "里普亚里亚"
 barbaricum_francia_austria_mission_task_7_DESC:0 "里普里安法兰克人生活在我们领土南部，位于莱努斯河，也就是现代莱茵河的河岸旁，其名也由此而来。他们渴望尽可能拥有更多莱茵河及其汇流之地。\n\n\n\n\n\n\n\n\n\n@greek_mil2!"
 barbaricum_francia_austria_mission_task_8:0 "摩努斯河谷"
 barbaricum_francia_austria_mission_task_8_DESC:0 "蜿蜒的摩努斯河，也就是现代的美因河，自西向莱努斯河流去，是莱努斯河最长的支流。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_francia_austria_mission_task_9:0 "沿着莱努斯河"
 barbaricum_francia_austria_mission_task_9_DESC:0 "雷努斯河是中西欧第二长河。我们应当尽可能为人民确保其沿岸土地。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_gallia_cisalpina_claims_1_tt:0 "我们获得[GetProvince('(int32)3549').GetArea.GetName|G]、[GetProvince('(int32)3588').GetArea.GetName|G]、[GetProvince('(int32)3593').GetArea.GetName|G]、[GetProvince('(int32)3599').GetArea.GetName|G]、[GetProvince('(int32)148').GetArea.GetName|G]和[GetProvince('(int32)117').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_2_tt:0 "我们获得[GetProvince('(int32)137').GetArea.GetName|G]、[GetProvince('(int32)124').GetArea.GetName|G]、[GetProvince('(int32)21').GetArea.GetName|G]和[GetProvince('(int32)131').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_5_tt:0 "我们获得[GetProvince('(int32)1').GetArea.GetName|G]、[GetProvince('(int32)6').GetArea.GetName|G]、[GetProvince('(int32)48').GetArea.GetName|G]和[GetProvince('(int32)36').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_6_tt:0 "我们获得[GetProvince('(int32)3515').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_7_tt:0 "我们获得[GetProvince('(int32)3504').GetArea.GetName|G]和[GetProvince('(int32)3488').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_8_tt:0 "我们获得[GetProvince('(int32)10').GetArea.GetName|G]、[GetProvince('(int32)68').GetArea.GetName|G]和[GetProvince('(int32)77').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_claims_9_tt:0 "我们获得[GetProvince('(int32)80').GetArea.GetName|G]、[GetProvince('(int32)83').GetArea.GetName|G]和[GetProvince('(int32)94').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_gallia_cisalpina_mission:0 "凯尔特意大利"
 barbaricum_gallia_cisalpina_mission_BUTTON_TOOLTIP:0 "意大利的山谷在我们面前不设防，只要我们有意愿，就可以征服它......"
 barbaricum_gallia_cisalpina_mission_CRITERIA_DESCRIPTION:0 "当我们将我们的控制权扩展到整个[GetProvince('(int32)4').GetArea.GetRegion.GetName]，从北方的山脉到南方的城市，这个任务才算完成。"
 barbaricum_gallia_cisalpina_mission_DESCRIPTION:0 "多年来，我们的人民一直在流浪，穿越山脉和森林，寻找属于我们的家园。经过几十年的艰辛，我们在[GetProvince('(int32)4').GetArea.GetRegion.GetName]定居，赶走了那些在我们之前来的人，使这片土地成为我们的庇护所。然而，当我们从我们的山间住所注视着下面的山谷时，我们承认这只是我们计划的开始......"
 barbaricum_gallia_cisalpina_mission_task_1:0 "帕达尼亚征服"
 barbaricum_gallia_cisalpina_mission_task_10:0 "墨迪俄拉农"
 barbaricum_gallia_cisalpina_mission_task_10_DESC:0 "#G 墨迪俄拉农#!要塞雄踞制高点俯瞰四野，当得起所有赞誉。我们对此地怀有宏图，更重要的是有实现它的意志。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_gallia_cisalpina_mission_task_11:0 "发展帕达尼亚"
 barbaricum_gallia_cisalpina_mission_task_11_DESC:0 "继续投资#G 帕达尼亚#!至关重要；既然已掌控#G 墨迪俄拉农#!，就当以其为基地，规划周边地区的市政与经济发展。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 barbaricum_gallia_cisalpina_mission_task_12:0 "意大利的财富"
 barbaricum_gallia_cisalpina_mission_task_12_DESC:0 "最新经济报告表明一个显而易见的事实：得益于在#G 意大利#!新获得的领土，我们正在大发横财。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_gallia_cisalpina_mission_task_13:0 "意大利文化"
 barbaricum_gallia_cisalpina_mission_task_13_DESC:0 "我们已经决定进行一项宏伟的建设计划，其明确目的是支持和加强我们城市的文化。我们有这样的经济手段，使之成为改善我们社会的当务之急。\n\n\n\n\n\n\n\n\n\n\n@greek_mil3!"
 barbaricum_gallia_cisalpina_mission_task_13_tt:0 "拥有至少#T 6#!座人口不少于#T 30#!的#G 意大利#!城市，且省份主流文化为#G 勒蓬蒂#!，并建有#T 广场、学院、大剧场#!或#T 图书馆#!。"
 barbaricum_gallia_cisalpina_mission_task_14:0 "共和党人的渴望"
 barbaricum_gallia_cisalpina_mission_task_14_DESC:0 "有一些声音，特别是在我们社会中最富有的人中，吵着要改变政府。他们指出，我们已经超越了我们卑微的根源，他们认为我们可以承认我们来自哪里，同时委托我们中最好的人带领我们走向未来的辉煌。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 barbaricum_gallia_cisalpina_mission_task_15:0 "确保我们的统治"
 barbaricum_gallia_cisalpina_mission_task_15_DESC:0 "在过去的几年里，我们已经大大扩展了我们的边界，也许超过了我们可以谨慎管理的范围，因为我们渴望看到我们的敌人被消灭。现在，我们处于一个强大的地位，让我们巩固我们已经获得的东西--我们将在未来感激不尽。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 barbaricum_gallia_cisalpina_mission_task_16:0 "条条大路通墨迪俄拉农"
 barbaricum_gallia_cisalpina_mission_task_16_DESC:0 "#G 墨迪俄拉农#!日益增长的重要性超过了我们对它的崇高期望；没有人能够预料到它将成为一个多么宏伟的城市。\n\n\n\n\n\n\n\n\n\n\n@event_pic1!"
 barbaricum_gallia_cisalpina_mission_task_17:0 "盖萨蒂"
 barbaricum_gallia_cisalpina_mission_task_17_DESC:0 "实现地区宏图需要老练的帮手，眼下我们虽缺乏此类人才，但确知有人精通战事且愿传授经验——只要价码合适；他们就是#G 盖萨蒂佣兵#!。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_gallia_cisalpina_mission_task_18:0 "横跨阿尔卑斯山的盟友"
 barbaricum_gallia_cisalpina_mission_task_18_DESC:0 "一个明智的统治者拥有远近的朋友，知道在困难的时候将财富结合起来是谨慎的，因为谁知道新的一天会带来什么样的苦难？考虑到这一贤明的建议，我们决定要寻找一个盟友。\n\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_gallia_cisalpina_mission_task_18_tt:0 "与[GetProvince('(int32)2314').GetArea.GetRegion.GetName|G]地区的国家结盟。"
 barbaricum_gallia_cisalpina_mission_task_19:0 "加固关隘"
 barbaricum_gallia_cisalpina_mission_task_19_DESC:0 "国家安全系于掌控#G 阿尔卑斯山#!通道的能力，绝不容许任何人肆意进出我们的领土。我们将采取措施彻底杜绝此类越界行为。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 barbaricum_gallia_cisalpina_mission_task_1_DESC:0 "北方#G 帕达尼亚#!土地肥沃资源丰富，正是我们渴求的宝地。让我们沿着#Y 波河#!深入腹地，征服现今的居住者。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_gallia_cisalpina_mission_task_2:0 "南进扩张"
 barbaricum_gallia_cisalpina_mission_task_20:0 "邀请定居者"
 barbaricum_gallia_cisalpina_mission_task_20_DESC:0 "经过一段时间的思考，我们决定邀请定居者来和我们的人民一起生活。虽然有些人质疑让这些定居者生活在我们的城市里是否明智，但重要的是，我们有足够的人力来源来应对未来的战争。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_gallia_cisalpina_mission_task_20_reward_tt:0 "我们将向#G 意大利#!城市招募移民。"
 barbaricum_gallia_cisalpina_mission_task_20_tt:0 "拥有至少一个城市或大都市。"
 barbaricum_gallia_cisalpina_mission_task_21:0 "勒蓬蒂手稿"
 barbaricum_gallia_cisalpina_mission_task_21_DESC:0 "多年来，我们一直依赖石刻，认为以我们祖先的方式书写，就足以引导我们的人民走向繁荣的未来。然而，我们新的行政责任要求我们进口纸莎草纸--我们很难跟上正确管理我们国家所需的东西。\n\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 barbaricum_gallia_cisalpina_mission_task_22:0 "墨西拿海峡"
 barbaricum_gallia_cisalpina_mission_task_22_DESC:0 "多年以来，我们已经意识到墨西拿海峡的战略重要性，知道这座美丽城市的主人掌控着海上交通的流向。鉴于我们在意大利取得的成就，这是合乎逻辑的下一步。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 barbaricum_gallia_cisalpina_mission_task_2_DESC:0 "南方的部落很弱，如果我们决定夺取他们的土地，他们无法抵御我们。即使现在，他们躺在床上睡不着觉，想知道我们是否很快就会来消灭他们--也许现在是我们让他们最糟糕的噩梦成为现实的时候了。\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_gallia_cisalpina_mission_task_3:0 "Genoan Coast（热那亚海岸）。"
 barbaricum_gallia_cisalpina_mission_task_3_DESC:0 "#G 热那亚海岸#!是商旅往来的要道，海盗在此劫掠前往#G 伊比利亚#!淘金的商船队。是时候终结这些匪患了...或者至少要求分得我们应得的那份利益。\n\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 barbaricum_gallia_cisalpina_mission_task_4:0 "威尼斯人的土地"
 barbaricum_gallia_cisalpina_mission_task_4_DESC:0 "#G 卡耳尼亚的阿尔卑斯山#!以南的#G 威尼斯人#!领地已是囊中之物；此战虽烈，我们必将夺取其田野森林，将其驱赶至深山。\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_gallia_cisalpina_mission_task_5:0 "终结伊特鲁里亚"
 barbaricum_gallia_cisalpina_mission_task_5_DESC:0 "我们有理由忌惮神秘的#G 伊特鲁里亚人#!，他们城邦林立且军力强盛。只有蠢材才会否认他们的实力，但他们同样有理由畏惧我们...\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_gallia_cisalpina_mission_task_6:0 "造船计划"
 barbaricum_gallia_cisalpina_mission_task_6_DESC:0 "#Y 第勒尼安海#!的波涛带来了我们过去无力把握的机遇，如今时移世易。若要被邻邦平等相待，我族必须建造战船。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil22!"
 barbaricum_gallia_cisalpina_mission_task_7:0 "科西嘉岛"
 barbaricum_gallia_cisalpina_mission_task_7_DESC:0 "我们尤其钟爱#G 科西嘉岛#!，毕竟它是我们最早的海外领地之一。既受此托付，自当善加经营。\n\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 barbaricum_gallia_cisalpina_mission_task_8:0 "罗马之劫"
 barbaricum_gallia_cisalpina_mission_task_8_DESC:0 "据其他#G 凯尔特#!掠夺者所言，#R 罗马人#!不过是坐拥金山银山的懦夫，其富丽城邦几乎不设防。永恒荣耀正在召唤——我们定要夺其家园。\n\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 barbaricum_gallia_cisalpina_mission_task_9:0 "南意大利"
 barbaricum_gallia_cisalpina_mission_task_9_DESC:0 "南#G 意大利#!的城邦历史悠久，其根源可追溯至记忆之外的年代；他们与这片土地的联系根深蒂固。只要他们事事遵从我们的权威，我们自会尊重其古老传统。\n\n\n\n\n\n\n\n\n\n\n@event_pic9!"
 barbaricum_gothonia_mission:0 "民族之源"
 barbaricum_gothonia_mission_CRITERIA_DESCRIPTION:0 "控制波罗的海，或迁徙至其他土地。"
 barbaricum_gothonia_mission_DESCRIPTION:0 "传说哥特人很久以前来自一座名为斯堪的亚的岛屿，仿佛从诸族蜂巢或万邦之母腹中涌现。那些见证此事的人，想必以为自己听见了泉源的嗡鸣。\n\n很久以前便有预言称，这泉声将再次响起，而我们的人民将踏上寻找应许之地的征途。"
 barbaricum_gothonia_mission_REWARD_DESCRIPTION:0 "获得对波罗的海土地或我们南部和东部的土地的宣称。"
 barbaricum_gothonia_mission_task_1:0 "波罗的海港口"
 barbaricum_gothonia_mission_task_10:0 "石圈"
 barbaricum_gothonia_mission_task_10_DESC:0 "我们与北方日耳曼人的接触，引来了小规模人群迁徙，他们也带来了一些自己的葬俗。然而他们很快便采纳了本地人民的精神与物质文化。如今，这种双方文化的融合也正在我们自己的人民中传播，以至于在葬丘附近见到用于仪式和集会的石圈，已不再罕见。\n\n\n\n\n\n\n\n\n\n@india_mil2!"
 barbaricum_gothonia_mission_task_11:0 "东迁计划"
 barbaricum_gothonia_mission_task_11_DESC:0 "我们东方有一片人口稀少的土地，那里可让我们的幼子开创自己的命运。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_gothonia_mission_task_11_tooltip:0 "我们获得了对[GetProvince('(int32)3758').GetArea.GetName|G]、[GetProvince('(int32)3921').GetArea.GetName|G]、[GetProvince('(int32)4521').GetArea.GetName|G]、[GetProvince('(int32)6097').GetArea.GetName|G]和[GetProvince('(int32)4526').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_gothonia_mission_task_12:0 "进军阿尔卑斯"
 barbaricum_gothonia_mission_task_12_DESC:0 "我们的人民之间存在争议：一些人希望我们把努力指向阿尔卑斯，靠近意大利的财富；另一些人则希望我们转向黑海，靠近希腊殖民地的财富。我们将通过选择阿尔卑斯来解决这场争议。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_gothonia_mission_task_13:0 "奔赴黑海"
 barbaricum_gothonia_mission_task_13_DESC:0 "我们的人民之间存在争议：一些人希望我们把努力指向阿尔卑斯，靠近意大利的财富；另一些人则希望我们转向黑海，靠近希腊殖民地的财富。我们将通过选择黑海来解决这场争议。\n\n\n\n\n\n\n\n\n\n@persia_mil17!"
 barbaricum_gothonia_mission_task_14:0 "哥特斯坎迪亚"
 barbaricum_gothonia_mission_task_14_DESC:0 "关于哥提斯坎迪亚的故事、神话和传说，即我们无数世代以前所谓的起源之地，代代相传，至今仍鲜活地留存在人民记忆中。若由我们亲自控制新发现的斯堪的亚，这些传说便会再次成真。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_gothonia_mission_task_15:0 "琥珀之路"
 barbaricum_gothonia_mission_task_15_DESC:0 "地中海诸邦渴求我们的琥珀，也就是我们称为格勒苏姆之物。这条贸易路线视角不同，或始于或终于我们的土地，对我们极为有利，也让我们能够换取地中海的奢侈品。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_gothonia_mission_task_15_tooltip:0 "我们获得了对[GetProvince('(int32)4752').GetArea.GetName|G]、[GetProvince('(int32)7298').GetArea.GetName|G]、[GetProvince('(int32)7808').GetArea.GetName|G]、[GetProvince('(int32)3896').GetArea.GetName|G]和[GetProvince('(int32)3970').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_gothonia_mission_task_15_tt:0 "需与[GetProvince('(int32)6288').GetArea.GetRegion.GetName|G]地区的#G 汪达尔#!国家进行进出口贸易。"
 barbaricum_gothonia_mission_task_1_DESC:0 "若要通往#Y 波罗的海#!，就必须在沿岸建立属于我们自己的港口。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 barbaricum_gothonia_mission_task_2:0 "辛布里亚关系"
 barbaricum_gothonia_mission_task_2_DESC:0 "辛布里亚半岛是进一步远征的理想中转站。究竟以羽笔还是利剑取得这处行动基地，全由我们自己决定。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_gothonia_mission_task_2_tt:0 "[GetProvince('(int32)3870').GetArea.GetRegion.GetName|G]地区的任何#G 辛布里亚#!国家对我们至少有#T 15#!#T 好感度#!。"
 barbaricum_gothonia_mission_task_3:0 "众神之地"
 barbaricum_gothonia_mission_task_3_DESC:0 "斯堪的亚，这片据说属于诸神的土地，就在我们北方。凭借新建的海军和辛布里亚行动基地，我们可以发动远征，探明神话背后的真相。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_gothonia_mission_task_3_tt:0 "[GetProvince('(int32)3870').GetArea.GetRegion.GetName|G]地区的任何#G 斯堪的亚#!国家对我们至少有#T 15#!#T 好感度#!。"
 barbaricum_gothonia_mission_task_4:0 "格勒苏姆"
 barbaricum_gothonia_mission_task_4_DESC:0 "被#G 日耳曼人#!称为#T “格勒苏姆”#!的琥珀@amber!，如同樱桃树分泌树胶、松树渗出树脂般，源自某种松属树木的髓质分泌物。初为液态大量涌出，渐次凝固硬化。——#Y 老普林尼#!，#T 《自然史》#!\n\n\n\n\n\n\n\n\n\n@greek_mil16!"
 barbaricum_gothonia_mission_task_4_tt:0 "拥有一个生产琥珀的省份。"
 barbaricum_gothonia_mission_task_5:0 "黑麦种植"
 barbaricum_gothonia_mission_task_5_DESC:0 "黑麦这种谷物在数百年前传入我们的土地。由于广泛种植并食用黑麦，鲁吉人，即“黑麦农夫”，也由此得名。\n\n\n\n\n\n\n\n\n\n\n@event_pic7!"
 barbaricum_gothonia_mission_task_5_tt:0 "[GetProvince('(int32)4766').GetArea.GetName]地区内任一省份为出产谷物的定居点，且建有农场。"
 barbaricum_gothonia_mission_task_6:0 "波罗的海岸"
 barbaricum_gothonia_mission_task_6_DESC:0 "控制波罗的海南岸是建立波罗的海帝国的第一步。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_gothonia_mission_task_6_tooltip:0 "我们获得了对[GetProvince('(int32)3862').GetArea.GetName|G]、[GetProvince('(int32)3867').GetArea.GetName|G]、[GetProvince('(int32)3881').GetArea.GetName|G]、[GetProvince('(int32)6000').GetArea.GetName|G]、[GetProvince('(int32)6008').GetArea.GetName|G]、[GetProvince('(int32)6016').GetArea.GetName|G]和[GetProvince('(int32)6037').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_gothonia_mission_task_6_tt:0 "[GetProvince('(int32)3898').GetArea.GetName|G]和[GetProvince('(int32)3891').GetArea.GetName|G]地区及[GetProvince('(int32)4756').GetArea.GetRegion.GetName|G]地区的所有沿海省份必须由我们掌控。"
 barbaricum_gothonia_mission_task_7:0 "苏维汇发髻"
 barbaricum_gothonia_mission_task_7_DESC:0 "在我们西方，苏维汇人以军事实力闻名。如果我们与他们保持友好关系，他们也许会允许我们的战士研习其文化，甚至接受训练。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_gothonia_mission_task_7_tt:0 "[GetProvince('(int32)3969').GetArea.GetRegion.GetName|G]地区的任何#G 易北日耳曼#!国家对我们至少有#T 15#!#T 好感度#!。"
 barbaricum_gothonia_mission_task_8:0 "铁的征用"
 barbaricum_gothonia_mission_task_8_DESC:0 "铁的稀缺给我们造成了问题。一个可能的解决办法是，所有铁和铁制品都不再归个人所有，这样它们便不能再被放入坟墓，也不能被用于叛乱。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_gothonia_mission_task_9:0 "一件珍贵的神器"
 barbaricum_gothonia_mission_task_9_DESC:0 "一位商人向我们呈上一件外国制造的小型青铜釜，其设计受到苏维汇文化启发。它的把手座描绘着一名蓄须的苏维汇战士，凭借其苏维汇发结很容易辨认。我们应当购得这件珍贵器物并公开展示。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"

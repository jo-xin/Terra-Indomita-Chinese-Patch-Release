 barbaricum_saxonia_anglia_mission:0 "不列颠尼亚的权杖岛"
 barbaricum_saxonia_anglia_mission_BUTTON_TOOLTIP:0 "这个国王的宝座，这个权杖岛，\n这个威严的大地，这个泰尔的所在地，\n这个另一个瓦尔霍尔，半天堂，\n这个大自然为自己建造的堡垒\n对抗感染和战争之手，\n这个快乐的人类品种。这个小世界，\n这块镶嵌在银海中的宝石，\n为它提供了墙的作用，\n或作为防御房屋的护城河，\n抵御不那么幸福的土地的嫉妒，\n这块受祝福的土地，这个地球，这个王国，这个不列颠尼亚。"
 barbaricum_saxonia_anglia_mission_CRITERIA_DESCRIPTION:0 "统治普里塔尼亚岛。"
 barbaricum_saxonia_anglia_mission_DESCRIPTION:0 "这个国王的宝座，这个权杖岛，\n这个威严的大地，这个泰尔的所在地，\n这个另一个瓦尔霍尔，半天堂，\n这个大自然为自己建造的堡垒\n对抗感染和战争之手，\n这个快乐的人类品种。这个小世界，\n这块镶嵌在银海中的宝石，\n为它提供了墙的作用，\n或作为防御房屋的护城河，\n抵御不那么幸福的土地的嫉妒，\n这块受祝福的土地，这个地球，这个王国，这个不列颠尼亚。"
 barbaricum_saxonia_anglia_mission_REWARD_DESCRIPTION:0 "在强大的国王带领下，入侵并征服不列颠尼亚岛。"
 barbaricum_saxonia_anglia_mission_task_1:0 "不列颠尼亚的立足点"
 barbaricum_saxonia_anglia_mission_task_10:0 "西部港口"
 barbaricum_saxonia_anglia_mission_task_10_DESC:0 "我们应该在 #G 不列颠尼亚#! 的西海岸建立一个港口；[GetProvince('(int32)2047').GetName|G] 似乎是一个理想地点。这不仅控制了一个战略位置，而且该地区鱼类资源丰富 @fish!。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 barbaricum_saxonia_anglia_mission_task_11:0 "贝勒里昂的矿场"
 barbaricum_saxonia_anglia_mission_task_11_DESC:0 "贝勒里昂矿场的名声甚至远达地中海世界。我们不能不亲自开发这些矿场。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_saxonia_anglia_mission_task_12:0 "强化麦西亚"
 barbaricum_saxonia_anglia_mission_task_12_DESC:0 "#G 麦西亚#!，我们的边境，急需防御工事来抵御西部的 #G 凯尔特#! 邻居。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_saxonia_anglia_mission_task_13:0 "隆迪尼翁"
 barbaricum_saxonia_anglia_mission_task_13_DESC:0 "#Y 泰晤士#! 河岸是 在#G 不列颠尼亚#! 建立一个中心的理想之地。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 barbaricum_saxonia_anglia_mission_task_13b:0 "肯特"
 barbaricum_saxonia_anglia_mission_task_13b_DESC:0 "#G 坎提姆#!，或用我们的语言来说，#G '肯特'#!，一直由 #G 坎提亚基亚人#! 居住。在那里，[GetProvince('(int32)2021').GetName|G]，我们的祭司感受到神灵的存在，因此我们有责任美化这个地方。\n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 barbaricum_saxonia_anglia_mission_task_14:0 "希伯尼亚海"
 barbaricum_saxonia_anglia_mission_task_14_DESC:0 "#Y 希伯尼亚海#! 分隔了 #G 希伯尼亚#! 和 #G 不列颠尼亚#! 这两个岛屿。控制这片海域对于阻止任何希伯尼亚威胁或征服这片蛮荒岛屿至关重要。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 barbaricum_saxonia_anglia_mission_task_15:0 "撒克逊王国"
 barbaricum_saxonia_anglia_mission_task_15_DESC:0 "我们人民引以为荣的传统世代相传，然而我们不断扩大的领域和人口使我们对世界和我们周围的人民有了更多的了解。\n\n为了确保安全和持续的繁荣，是时候重组我们的部落，建立 #G 撒克逊王国#! 了。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_saxonia_anglia_mission_task_16:0 "盎格鲁-撒克逊王国"
 barbaricum_saxonia_anglia_mission_task_16_DESC:0 "我国人民引以为荣的传统世代相传，然而我们不断扩大的领域和人口使我们对世界和我们周围的人民有了更多的了解。\n\n为了确保安全和持续的繁荣，是时候重组我们的部落成为一个建立在盎格鲁精英力量之上的王国了。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 barbaricum_saxonia_anglia_mission_task_17:0 "朱特-撒克逊王国"
 barbaricum_saxonia_anglia_mission_task_17_DESC:0 "我国人民引以为荣的传统世代相传，然而我们不断扩大的领域和人口使我们对世界和我们周围的人民有了更多的了解。\n\n为了确保安全和持续的繁荣，是时候重组我们的部落成为一个建立在尤多西精英力量之上的王国了。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_saxonia_anglia_mission_task_1_DESC:0 "我们首先要在#G 不列颠尼亚#!建立一个立足点然后才能占领更多的土地。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_saxonia_anglia_mission_task_1_tooltip:0 "拥有[GetProvince('(int32)2009').GetArea.GetRegion.GetName|G]地区的所有领土。"
 barbaricum_saxonia_anglia_mission_task_2:0 "南部海岸"
 barbaricum_saxonia_anglia_mission_task_2_DESC:0 "[GetProvince('(int32)2021').GetArea.GetName]会是一个容易下手的首个目标。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_saxonia_anglia_mission_task_3:0 "东部海岸"
 barbaricum_saxonia_anglia_mission_task_3_DESC:0 "[GetProvince('(int32)2029').GetArea.GetName]会是一个容易下手的首个目标。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_saxonia_anglia_mission_task_4:0 "北部海岸"
 barbaricum_saxonia_anglia_mission_task_4_DESC:0 "穿越 #Y 亨伯河#!，新的未征服土地正等待着我们，我们的士兵渴望战斗！\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_saxonia_anglia_mission_task_5:0 "威塞克斯"
 barbaricum_saxonia_anglia_mission_task_5_DESC:0 "#G 不列颠尼亚#! 的西部地区尚未被我们占领，但不久之后，它将成为我们人民的新家园。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_saxonia_anglia_mission_task_6:0 "苏塞克斯和埃塞克斯"
 barbaricum_saxonia_anglia_mission_task_6_DESC:0 "我们应当在南方和东南方为人民建立新的家园。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_saxonia_anglia_mission_task_7:0 "不列颠尼亚的心脏"
 barbaricum_saxonia_anglia_mission_task_7_DESC:0 "既然我们已控制了海岸，现在是时候向 #G 不列颠尼亚#! 的内陆推进了。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_saxonia_anglia_mission_task_8:0 "东盎格鲁"
 barbaricum_saxonia_anglia_mission_task_8_DESC:0 "这片平坦、低洼且多沼泽的土地被强大的 #G 盎格鲁#! 派系所占据；我们无法否认他们对此地的主张，尽管我们希望旧有的部落忠诚能逐渐消失。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_saxonia_anglia_mission_task_9:0 "诺森比亚"
 barbaricum_saxonia_anglia_mission_task_9_DESC:0 "我们在亨伯河以北的土地亟需改善。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_saxonia_form_bog_offering_tt:0 "至少有#T 一个角色#!被#R 囚禁#!。"
 barbaricum_saxonia_form_claims_1_tt:0 "我们获得了对[GetProvince('(int32)3834').GetArea.GetName|G]、[GetProvince('(int32)3862').GetArea.GetName|G]和[GetProvince('(int32)3839').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_saxonia_form_claims_2_tt:0 "我们获得了对[GetProvince('(int32)3867').GetArea.GetName|G]和[GetProvince('(int32)3848').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_saxonia_form_mission:0 "辽阔的北海"
 barbaricum_saxonia_form_mission_BUTTON_TOOLTIP:0 "撒克逊人民呼唤一位强大的领袖来统一诸氏族。我们的天命人人可见——我们将成为带领人民迈向更大荣耀的人。"
 barbaricum_saxonia_form_mission_CRITERIA_DESCRIPTION:0 "建造一支北海舰队，统一北海日耳曼人，并建立撒克逊尼亚。"
 barbaricum_saxonia_form_mission_DESCRIPTION:0 "撒克逊人民呼唤一位强大的领袖来统一诸氏族。我们的天命人人可见——我们将成为带领人民迈向更大荣耀的人。"
 barbaricum_saxonia_form_mission_REWARD_DESCRIPTION:0 "通过建立撒克逊，带领北海日耳曼人走向更大的辉煌。"
 barbaricum_saxonia_form_mission_task_1:0 "起航"
 barbaricum_saxonia_form_mission_task_10:0 "巩固我们的首都"
 barbaricum_saxonia_form_mission_task_10_DESC:0 "作为我们权力的中心，[ROOT.GetCountry.GetCapital.GetName|T] 缺乏应有的防御工事是不可容忍的。我们需要建造新的城墙、护城河和土丘，以保护那些依赖我们庇护的人们。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_saxonia_form_mission_task_1_DESC:0 "北海正在等待我们。\n\n\n\n\n\n\n\n\n\n@egypt_mil6!"
 barbaricum_saxonia_form_mission_task_2:0 "北海海岸"
 barbaricum_saxonia_form_mission_task_2_DESC:0 "英格维奥尼人居住的北海海岸主要由沙滩、河口和瓦登海组成。要在我们的领导下征服并统一这些地方，当然绝非易事。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_saxonia_form_mission_task_3:0 "扩建海军"
 barbaricum_saxonia_form_mission_task_3_DESC:0 "我们应该利用已扩建的港口和造船厂建造更多的船只，这将使我们能够更有效地向海外征讨。\n\n\n\n\n\n\n\n\n\n@greek_mil4!"
 barbaricum_saxonia_form_mission_task_4:0 "突袭不列颠尼亚"
 barbaricum_saxonia_form_mission_task_4_DESC:0 "作为一个孤立的岛屿，#G 不列颠尼亚#! 将是我们的掠夺者们轻而易举的猎物，因为那里的人民已有几代人未曾见过海上入侵了。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_saxonia_form_mission_task_5:0 "军事勇武"
 barbaricum_saxonia_form_mission_task_5_DESC:0 "唯有在战斗中以勇武与荣耀证明自己的部族，才能鼓舞众人。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_saxonia_form_mission_task_6:0 "撒克逊人"
 barbaricum_saxonia_form_mission_task_6_DESC:0 "我们在突袭中使用的短刀，在我们的语言中被称为 'sax' 或 'seax'，这为我们赢得了 #G 撒克逊人#! 这一外号。让我们向所有在我们团结力量前颤抖的弱者发出明确的讯息！\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_saxonia_form_mission_task_7:0 "北海贸易"
 barbaricum_saxonia_form_mission_task_7_DESC:0 "#T 海上贸易#! 是 #G 北海日耳曼人#! 几代以来的生计。在 [ROOT.GetCountry.GetCapital.GetName|T] 的适当推动下，我们可以提高我们的利润。\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_saxonia_form_mission_task_8:0 "沼泽献祭"
 barbaricum_saxonia_form_mission_task_8_DESC:0 "我们的地牢里到处都是用于在沼泽祭礼上牺牲以安抚众神的囚犯。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_saxonia_form_mission_task_9:0 "献祭给英维"
 barbaricum_saxonia_form_mission_task_9_DESC:0 "我们的主神英维在赐福我们之前需要一场献祭。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_suebi_boiohaemia_claims_1_tt:0 "我们获得了对[GetProvince('(int32)3815').GetArea.GetName|G]、[GetProvince('(int32)3936').GetArea.GetName|G]和[GetProvince('(int32)3943').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_suebi_boiohaemia_claims_2_tt:0 "我们获得了对[GetProvince('(int32)3921').GetArea.GetName|G]、[GetProvince('(int32)3936').GetArea.GetName|G]和[GetProvince('(int32)3918').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_suebi_boiohaemia_claims_7_tt:0 "我们获得了对[GetProvince('(int32)3758').GetArea.GetName|G]、[GetProvince('(int32)4172').GetArea.GetName|G]、[GetProvince('(int32)4173').GetArea.GetName|G]和[GetProvince('(int32)4852').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_suebi_boiohaemia_mission:0 "玻伊海弥亚的衰落"
 barbaricum_suebi_boiohaemia_mission_BUTTON_TOOLTIP:0 "玻伊海弥亚富饶肥沃的土地，比北方寒冷荒原更适合定居与耕作。此外，玻伊海弥亚也更易防守；多瑙河守护南方，北方山地则阻挡入侵者。"
 barbaricum_suebi_boiohaemia_mission_CRITERIA_DESCRIPTION:0 "征服你南方富庶肥沃的土地，并将其变成你的新家园。"
 barbaricum_suebi_boiohaemia_mission_DESCRIPTION:0 "玻伊海弥亚富饶肥沃的土地，比北方寒冷荒原更适合定居与耕作。此外，玻伊海弥亚也更易防守；多瑙河守护南方，北方山地则阻挡入侵者。"
 barbaricum_suebi_boiohaemia_mission_REWARD_DESCRIPTION:0 "获得对玻伊海弥亚的宣称并开发其土地。"
 barbaricum_suebi_boiohaemia_mission_task_1:0 "玻伊海弥亚盆地"
 barbaricum_suebi_boiohaemia_mission_task_10:0 "一个新的日耳曼家园"
 barbaricum_suebi_boiohaemia_mission_task_10_DESC:0 "家园的强弱取决于其中最弱者。正如我们已经证明的那样，我们才是最强者！若要更加强大，所有人都必须像我们一样！\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_suebi_boiohaemia_mission_task_11:0 "摩奴斯贸易"
 barbaricum_suebi_boiohaemia_mission_task_11_DESC:0 "越过#Y 美因河#!(莱茵河右岸支流)，有许多可以和我们做贸易的人们，如果我们能与之建立联系，那这毫无疑问是大有好处的...\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_suebi_boiohaemia_mission_task_1_DESC:0 "我们的侦察员报告说，南方有肥沃的土地。现在是时候派出一支探险队以确保进入这些土地了。\n\n\n\n\n\n\n\n\n\n@celt_mil6!>"
 barbaricum_suebi_boiohaemia_mission_task_2:0 "入侵玻伊海弥亚"
 barbaricum_suebi_boiohaemia_mission_task_2_DESC:0 "这些土地肥沃而富庶。其居民软弱无力，田野已经成熟，正待我们夺取。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_suebi_boiohaemia_mission_task_3:0 "跨越马鲁斯河"
 barbaricum_suebi_boiohaemia_mission_task_3_DESC:0 "马鲁斯河对岸是最适合种植作物和畜牧的土地。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_suebi_boiohaemia_mission_task_4:0 "马罗波杜斯的宫殿"
 barbaricum_suebi_boiohaemia_mission_task_4_DESC:0 "在玻伊海弥亚，你的宫殿将高耸于你的土地之上。你的权力之座会让许多人心生恐惧与敬畏。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_suebi_boiohaemia_mission_task_5:0 "叛徒的避风港"
 barbaricum_suebi_boiohaemia_mission_task_5_DESC:0 "我们的一些叛徒逃往古索尼亚。小心，他们未来可能会制造麻烦。\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_suebi_boiohaemia_mission_task_6:0 "保卫盆地"
 barbaricum_suebi_boiohaemia_mission_task_6_DESC:0 "通往你新家园的唯一道路都要经过隘口。如果将其加固，任何心怀恶意者都无法通过。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 barbaricum_suebi_boiohaemia_mission_task_7:0 "马尔科曼战争"
 barbaricum_suebi_boiohaemia_mission_task_7_DESC:0 "既然我们已经有了防御工事，就需要人手来保卫玻伊海弥亚。教会所有适龄男子持矛之道！\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_suebi_boiohaemia_mission_task_7_trigger_tt:0 "拥有一支至少#T 40 个大队#!的军队。"
 barbaricum_suebi_boiohaemia_mission_task_8:0 "科提尼亚人奴隶"
 barbaricum_suebi_boiohaemia_mission_task_8_DESC:0 "科提尼人是很好的劳工。近来我们需要更多矿工，他们必定正合所需。\n\n\n\n\n\n\n\n\n\n@celt_mil15!"
 barbaricum_suebi_boiohaemia_mission_task_9:0 "传播图伊斯托之言"
 barbaricum_suebi_boiohaemia_mission_task_9_DESC:0 "家园的好坏取决于统治它的精神。唯一真正的精神就是我们的精神！\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_suebi_gallia_mission:0 "阿里俄维斯图斯的运动"
 barbaricum_suebi_gallia_mission_CRITERIA_DESCRIPTION:0 "为苏维汇人宣称并定居莱努斯河以东的土地。"
 barbaricum_suebi_gallia_mission_DESCRIPTION:0 "在苏维汇社会中，所有#E 苏维汇人#!生而平等，而军事才能的地位与日俱增，使他们成为日耳曼文化的典范。\n\n对周边部落的不间断袭击不仅令受害者闻风丧胆，更能让优秀领袖通过这些征战立下赫赫战功。一位深得民心的领袖打破平等传统，恐怕只是时间问题。\n\n无论如何，我们的部落酋长们早已谋划多时，准备对#E 莱茵河#!对岸的土地发动突袭。如今#E 高卢#!正陷入动荡，正是出击的最佳时机。"
 barbaricum_suebi_gallia_mission_REWARD_DESCRIPTION:0 "获得对莱茵河东部土地的宣称，并有可能形成一个新的王室血统。"
 barbaricum_suebi_gallia_mission_task_1:0 "驱逐乌西佩特人和坦克特里人"
 barbaricum_suebi_gallia_mission_task_10:0 "驯服罗马狼"
 barbaricum_suebi_gallia_mission_task_10_DESC:0 "罗马已经声称自己对高卢事务有兴趣。未来许多年里，保卫并巩固我们成就、抵御这一外国威胁，将取决于我们自己。\n\n\n\n\n\n\n\n\n\n@celt_mil10!"
 barbaricum_suebi_gallia_mission_task_11:0 "整合盟友"
 barbaricum_suebi_gallia_mission_task_11_DESC:0 "是时候决定如何对待我们的盟友及其习俗了。他们已经证明了自己的价值，也丰富了我们的社会。因此，我们应当将他们完全整合进来。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_suebi_gallia_mission_task_12:0 "同化盟友"
 barbaricum_suebi_gallia_mission_task_12_DESC:0 "是时候决定如何对待我们的盟友及其习俗了。虽然他们已经证明了自己的价值，也丰富了我们的社会，但显然苏维汇文化更为优越。因此，我们应当将他们完全同化。\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_suebi_gallia_mission_task_13:0 "日耳曼之王"
 barbaricum_suebi_gallia_mission_task_13_DESC:0 "征战之初，无人敢想象能取得如此成就。[ROOT.GetCountry.GetRuler.GetName|Y]被民众奉若神明，其血脉被视为圣裔，享有王者特权。正式加冕为王不过是个形式——毕竟#G 苏维汇#!世界已许久未见君王。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_suebi_gallia_mission_task_14:0 "诺里卡姆婚姻"
 barbaricum_suebi_gallia_mission_task_14_DESC:0 "#G 诺里库姆#!位于我国南方，与诺里库姆公主联姻可一举两得——既可稳固南翼，又能为[ROOT.GetCountry.GetRuler.GetName|Y]觅得佳偶。\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_suebi_gallia_mission_task_14_tt:0 "#Y 我们的统治者将拥有一次婚姻选择。#!"
 barbaricum_suebi_gallia_mission_task_15:0 "皇家继承人"
 barbaricum_suebi_gallia_mission_task_15_DESC:0 "对于王朝而言，[ROOT.GetCountry.GetRuler.GetName]需要一位能够延续王室血脉的继承人。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_suebi_gallia_mission_task_16:0 "赫尔维蒂沙漠"
 barbaricum_suebi_gallia_mission_task_16_DESC:0 "按照苏维汇习俗，我们绝不会容忍赫尔维蒂人居住在我们近旁。即便无数世纪之后，这片土地也将被称为赫尔维蒂荒漠！\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_suebi_gallia_mission_task_16_tt:0 "我们将制造#R 赫尔维蒂荒漠#!。"
 barbaricum_suebi_gallia_mission_task_1_DESC:0 "过去，乌西佩特人和滕克特里人曾拒绝让我们的劫掠队穿过他们的土地，前往其高卢邻邦。对曼努斯之子而言，这种行为实在蛮横无礼！\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_suebi_gallia_mission_task_2:0 "北方盟友"
 barbaricum_suebi_gallia_mission_task_2_DESC:0 "北方的#G 欧多塞斯人#!与#G 卡鲁德斯人#!以劫掠高效著称。他们必将成为未来战事中的强力盟友。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_suebi_gallia_mission_task_3:0 "进入条里奥凯米亚"
 barbaricum_suebi_gallia_mission_task_3_DESC:0 "条里奥凯米亚是通往高卢南方的门户，也是我军通往那里的唯一道路。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_suebi_gallia_mission_task_4:0 "阿里俄维斯图斯"
 barbaricum_suebi_gallia_mission_task_4_DESC:0 "我们队伍中近来出现了一名被高卢人称作阿里奥维斯图斯的人。这是高卢人授予伟大军事领袖的荣誉称号。他是一位真正的苏维汇战士，曾经历并赢得许多战斗，有时甚至与高卢人并肩作战。他的武勇与人脉或许会显得极为宝贵。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_suebi_gallia_mission_task_4_tt:0 "#Y 我们将可以选择一个新的标尺#!。"
 barbaricum_suebi_gallia_mission_task_5:0 "七大盟国"
 barbaricum_suebi_gallia_mission_task_5_DESC:0 "看来在我们南方也能找到志同道合的盟友，他们对劫掠并定居富饶的#G 高卢#!土地颇感兴趣。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_suebi_gallia_mission_task_6:0 "摧毁乌庇夷"
 barbaricum_suebi_gallia_mission_task_6_DESC:0 "#G 乌庇夷人#!居住在#Y 莱茵河#!东岸。必须消灭他们，因其与对岸的#G 高卢人#!交好。\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_suebi_gallia_mission_task_6_tt:0 "我们将劫掠#G 乌比亚#!的奥皮杜姆。"
 barbaricum_suebi_gallia_mission_task_7:0 "高卢盟友"
 barbaricum_suebi_gallia_mission_task_7_DESC:0 "高卢的阿维尔尼人与塞夸尼人希望征召我们援助他们对埃杜维人的战争。我们并不完全清楚这场冲突的原因，不过战争通常也是为了霸权而打。\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 barbaricum_suebi_gallia_mission_task_8:0 "打败Aedui"
 barbaricum_suebi_gallia_mission_task_8_DESC:0 "我们可以借对抗#G 埃杜依人#!之战，在#G 高卢#!建立自己的据点。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_suebi_gallia_mission_task_8_tt:0 "我们将劫掠#G 埃杜依人#!的奥皮杜姆。"
 barbaricum_suebi_gallia_mission_task_9:0 "越过莱茵河"
 barbaricum_suebi_gallia_mission_task_9_DESC:0 "是时候渡过#Y 莱茵河#!，为我们的子民夺取这片沃土了。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_suebi_gallia_task_5_tooltip:0 "我们获得了对[GetProvince('(int32)3733').GetArea.GetName|G]和[GetProvince('(int32)3775').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_suebi_gallia_task_7_tooltip:0 "我们获得了对[GetProvince('(int32)3015').GetArea.GetName|G]、[GetProvince('(int32)3054').GetArea.GetName|G]、[GetProvince('(int32)3011').GetArea.GetName|G]、[GetProvince('(int32)2440').GetArea.GetName|G]和[GetProvince('(int32)2300').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_treveria_claims_10_tt:0 "我们将获得对#Y 塞夸尼亚和提古里尼亚#!地区的宣称。"
 barbaricum_treveria_claims_12_tt:0 "我们将获得对#Y 雷弥亚、摩里尼亚、贝洛瓦基亚和帕里西亚#!地区的宣称。"
 barbaricum_treveria_claims_9_tt:0 "我们将获得周边多个地区的宣称权：#G 墨纳庇亚、涅耳维亚、加努恩塔、墨迪俄马特里基亚、特里玻基亚、 劳里卡#!及#G 万吉俄尼亚#!。"
 barbaricum_treveria_mission:0 "莱茵王国"
 barbaricum_treveria_mission_BUTTON_TOOLTIP:0 "特雷维里亚人拓展他们卑微疆域的时刻已然来临……"
 barbaricum_treveria_mission_CRITERIA_DESCRIPTION:0 "当#E 特雷维里亚#!建立起强大辉煌的#E 莱茵王国#!时，该使命完成。"
 barbaricum_treveria_mission_DESCRIPTION:0 "我们#E 特雷维里亚人#!是强大而令人畏惧的民族，是#E 高卢#!最强大的部族之一，我们舒适地生活在#E 莱茵河#!畔，被争夺资源的敌对部族环绕——这是我们父辈熟知的生活方式，许多人乐于循着他们的足迹生活。\n\n然而，有人预言更伟大的荣耀在等待我们；他们看到了敌人的弱点，也深知我们民族的潜力……"
 barbaricum_treveria_mission_task_1:0 "荣耀祖先"
 barbaricum_treveria_mission_task_10:0 "征服埃布隆人"
 barbaricum_treveria_mission_task_10_DESC:0 "#G 埃布隆人#!公然宣称敌视我们的扩张，将不择手段阻挠。可惜这对他们意味着灭顶之灾。不将其彻底征服，我们誓不罢休。\n\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_treveria_mission_task_11:0 "比利时的特雷维里亚人"
 barbaricum_treveria_mission_task_11_DESC:0 "与#G 比利其人#!屡次交锋后，我们已熟知其战法；该终结他们的妄想，将整个#G 比利时#!纳入版图了。\n\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_treveria_mission_task_12:0 "莱茵河"
 barbaricum_treveria_mission_task_12_DESC:0 "我们决定将疆域拓展至雄伟的#Y 莱茵河#!，此天险乃绝佳屏障。虽任务艰巨，但我军征召兵已准备就绪！\n\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_treveria_mission_task_13:0 "加固莱茵河"
 barbaricum_treveria_mission_task_13_DESC:0 "#Y 莱茵河#!仅有少数渡口易涉，军事顾问建议在此设防；[ROOT.GetCountry.GetRuler.GetName|Y]乐见其成。\n\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 barbaricum_treveria_mission_task_14:0 "文化熔炉"
 barbaricum_treveria_mission_task_14_DESC:0 "虽然我们的一些被征服者担心我们会让他们成为永久的奴隶下层阶级，但我们并不想羞辱我们的兄弟；我们更愿意将我们所有的臣民融入我们的幸福家庭。\n\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_treveria_mission_task_14_belgianculture:0 "我们需要整合以下#Y 比利其#!文化之一：#G 阿杜阿塔基亚#!、#G 厄部罗尼亚#!、#G 涅耳维亚#!、#G 摩里尼#!、#G 维利俄卡西亚#!或#G 贝洛瓦基亚#!。"
 barbaricum_treveria_mission_task_14_germanicculture:0 "我们需要整合以下#Y 日耳曼#!文化之一：#G 辛布里亚#!、#G 威悉-莱茵日耳曼#!、#G 北海日耳曼#!、#G 易北日耳曼#!、#G 哥特#!、#G 汪达尔#!或#G 巴斯塔奈#!。"
 barbaricum_treveria_mission_task_15:0 "铁矿"
 barbaricum_treveria_mission_task_15_DESC:0 "我军日益强盛全赖铁器@iron!，此乃军事支柱。强敌环伺之际，我们需尽可能开采此矿。备好驮畜与矿工，掘尽山岳宝藏！\n\n\n\n\n\n\n\n\n\n\n@celt_mil13!"
 barbaricum_treveria_mission_task_16:0 "贸易关系"
 barbaricum_treveria_mission_task_16_DESC:0 "[GetProvince('(int32)3687').GetArea.GetName|G]的繁荣无疑源于这个要冲地区的贸易增长。若有意愿，我们可进一步增加这些收入。\n\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_treveria_mission_task_17:0 "侏罗山脉"
 barbaricum_treveria_mission_task_17_DESC:0 "南方的#G 汝拉山脉#!是我们通往[GetProvince('(int32)3537').GetArea.GetName|T]的门户，如此要地岂能放任自流。我们当全力征服此地，以免被他人捷足先登。\n\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_treveria_mission_task_18:0 "西部扩张"
 barbaricum_treveria_mission_task_18_DESC:0 "西部的森林里充满了敌对的部落，他们憎恨我们民族的发展，如果我们给他们机会，他们无疑会在虚弱的时候攻击我们。我们不能允许这种情况发生。\n\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_treveria_mission_task_19:0 "保卫我们的海岸"
 barbaricum_treveria_mission_task_19_DESC:0 "我们很幸运地征服了远离家乡的地区，而且，在记忆中，我们第一次拥有了漫长的海岸线，这对我们的人民来说是件新鲜事。虽然这是一个巨大的祝福，但我们必须采取措施，确保我们的海岸线是安全的。\n\n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 barbaricum_treveria_mission_task_1_DESC:0 "若不承认先人的恩德，我们如何谋划未来？应当隆重祭祀先祖，让他们继续庇佑我们。\n\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_treveria_mission_task_1_tt:0 "当统治者去世时，#G 特里维里#!可通过事件链为逝者举行#T 战车葬仪#!。"
 barbaricum_treveria_mission_task_2:0 "战车葬仪"
 barbaricum_treveria_mission_task_2_DESC:0 "自远古时代起，我们便将首领安葬在精心建造的墓穴中，确保战士们在来世所需一应俱全。延续这项传统将为人民带来稳定，并为[ROOT.GetCountry.GetRuler.GetName|Y]赋予正统性。\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_treveria_mission_task_2_variable:0 "我们需要通过#T 战车葬仪#!为逝世的#Y 部落酋长#!举行#G 特里维里#!葬礼仪式，但目前没有配享此荣誉者离世。\n\n（#Y 当前统治者去世时将触发事件，您可为其举行正式葬礼#!）"
 barbaricum_treveria_mission_task_3:0 "贿赂长老会"
 barbaricum_treveria_mission_task_3_DESC:0 "行政事务进展缓慢，无疑是#T 氏族酋长#!们争吵不休所致。若能散些钱财，必能买到称心的结果……\n\n\n\n\n\n\n\n\n\n\n@event_pic12!"
 barbaricum_treveria_mission_task_3_tt:0 "所有#T 氏族首领#!的忠诚度需达到#T 70#!以上。"
 barbaricum_treveria_mission_task_4:0 "君主的野心"
 barbaricum_treveria_mission_task_4_DESC:0 "既然我们已巩固了政治基础，现在正是发起大胆推进的时机——是时候摒弃旧有的治理方式，拥抱君主制了。\n\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 barbaricum_treveria_mission_task_5:0 "特雷维里亚的胜利"
 barbaricum_treveria_mission_task_5_DESC:0 "胜利的时刻来临了！我们在所有的努力中都取得了成功，并建立了一个令我们周围的人羡慕的王国，一个强大的、富有的和受保护的王国。只有时间才能告诉我们未来的荣耀，但现在，我们庆祝我们的胜利。\n\n\n\n\n\n\n\n\n\n\n@greek_mil6!"
 barbaricum_treveria_mission_task_6:0 "山地要塞计划"
 barbaricum_treveria_mission_task_6_DESC:0 "在高地上建造堡垒一直是我们军队的特权；在我们的山丘堡垒的指挥位置上，我们对自己的力量充满信心。\n\n\n\n\n\n\n\n\n\n\n@celt_mil8!"
 barbaricum_treveria_mission_task_7:0 "特雷维里亚凯尔特山堡"
 barbaricum_treveria_mission_task_7_DESC:0 "我们不能只关注军事而忽视城市建设，因为这对我们未来的成功是不利的。我们必须尽我们所能增加我们的民用基础设施。\n\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 barbaricum_treveria_mission_task_8:0 "特雷维里亚"
 barbaricum_treveria_mission_task_8_DESC:0 "#G 特雷维里亚#!平原毗邻河流占尽地利，实乃建都佳处。我们该离开森林故土，迁往可拓展之地。\n\n\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_treveria_mission_task_9:0 "比利时的朝贡国"
 barbaricum_treveria_mission_task_9_DESC:0 "我们北方的部落一直是我们恼怒的源头，但也许我们可以把这个绊脚石变成一个优势，让他们成为我们的附属国。\n\n\n\n\n\n\n\n\n\n\n@celt_mil5!"
 barbaricum_vandal_task_11_B_tooltip:0 "我们获得了对[GetProvince('(int32)4774').GetArea.GetName|G]、[GetProvince('(int32)4010').GetArea.GetName|G]、[GetProvince('(int32)4771').GetArea.GetName|G]、[GetProvince('(int32)4863').GetArea.GetName|G]、[GetProvince('(int32)6272').GetArea.GetName|G]和[GetProvince('(int32)3908').GetArea.GetName|G]地区所有领土的宣称。"
 barbaricum_vandal_task_13_tooltip:0 "所有新殖民的东部省份将获得#G 经济提振#!效果。"
 barbaricum_vandal_task_14_tooltip:0 "我们获得了对[GetProvince('(int32)4840').GetArea.GetName|G]、[GetProvince('(int32)4842').GetArea.GetName|G]、[GetProvince('(int32)4172').GetArea.GetName|G]、[GetProvince('(int32)4173').GetArea.GetName|G]、[GetProvince('(int32)3918').GetArea.GetName|G]和[GetProvince('(int32)4910').GetArea.GetName|G]地区的所有领土的宣称。"
 barbaricum_vandal_task_3_tooltip:0 "需向#G 波依人#!、#G 诺里克#!或#G 温德利西亚#!文化的国家出口琥珀。"
 barbaricum_vandalia_lugia_mission:0 "东部日耳曼联盟"
 barbaricum_vandalia_lugia_mission_CRITERIA_DESCRIPTION:0 "通过建立汪达利亚或卢吉亚来统一东日耳曼人。"
 barbaricum_vandalia_lugia_mission_DESCRIPTION:0 "我们属于#E 汪达尔人#!，这个与我们共享仪式、信仰和语言的庞大族群。在这黑暗时代，必须由一位强大领袖将我们团结起来，这关乎我们的存续。\n\n我们汪达尔人有着自远古流传的强悍传统。但如今南方涌来了手持精良武器的陌生族群。\n\n必须决定社会未来的道路：是坚守传统文化，还是效仿那些外来者？"
 barbaricum_vandalia_lugia_mission_REWARD_DESCRIPTION:0 "通过联合所有的汪达尔人，无论是汪达利亚还是卢吉亚，都会变得更加强大。"
 barbaricum_vandalia_lugia_mission_task_1:0 "阿尔希兹的圣林"
 barbaricum_vandalia_lugia_mission_task_10:0 "邀请更多苏维汇移民"
 barbaricum_vandalia_lugia_mission_task_10_DESC:0 "如今我们自己的人民已经尊崇苏维汇文化，不再抱持迷信，我们便可以主动欢迎这些移民。\n\n\n\n\n\n\n\n\n\n@celt_mil7!"
 barbaricum_vandalia_lugia_mission_task_11:0 "以矛与剑之名"
 barbaricum_vandalia_lugia_mission_task_11_DESC:0 "必须使其他所有#G 汪达尔人#!臣服！告诉战士们：最勇猛者将获无上荣光！\n\n\n\n\n\n\n\n\n\n@celt_mil1!"
 barbaricum_vandalia_lugia_mission_task_12:0 "汪达尔的统一"
 barbaricum_vandalia_lugia_mission_task_12_DESC:0 "如今我们既是#G 汪达尔#!诸部之首，又掌控着散居汪达尔人的故土，我族之名与汪达尔之名已合而为一。\n\n\n\n\n\n\n\n\n\n@celt_mil9!"
 barbaricum_vandalia_lugia_mission_task_13:0 "东拓殖民"
 barbaricum_vandalia_lugia_mission_task_13_DESC:0 "我们东方有几乎无人宣称的土地，可以由我们自己的人民定居。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 barbaricum_vandalia_lugia_mission_task_14:0 "潘诺尼亚平原"
 barbaricum_vandalia_lugia_mission_task_14_DESC:0 "肥沃的#G 潘诺尼亚#!平原近在咫尺，伸手可取。无人能阻我们夺取这片土地！\n\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 barbaricum_vandalia_lugia_mission_task_15:0 "凯尔特工坊"
 barbaricum_vandalia_lugia_mission_task_15_DESC:0 "凯尔特人在制陶以及铁矿开采和冶炼方面都有所进步。经过与他们部分专家的商议和支持，我们已经在自己的土地上找到了适合应用这些技术的地点。\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 barbaricum_vandalia_lugia_mission_task_1_DESC:0 "我们的祭司在[GetProvince('(int32)4005').GetName|G]山巅目睹[GetDeityDefinition('omen_alcis').GetName|T]#E #T 双子神#!#!显圣。凡到访者皆言能感受双神气息。正式册封此林为圣地，既可安抚祭司，亦能取悦阿尔希兹。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_vandalia_lugia_mission_task_2:0 "面瓮"
 barbaricum_vandalia_lugia_mission_task_2_DESC:0 "这位祭司仿佛专为完成神圣使命而生，在#G 圣林#!确立后不久便离世。其虔诚当为后世楷模，我们将倾尽全力为其制作史上最精美的人面瓮——此葬俗已在我国延续数百年。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 barbaricum_vandalia_lugia_mission_task_3:0 "琥珀之路"
 barbaricum_vandalia_lugia_mission_task_3_DESC:0 "地中海诸邦渴求我们北方邻族的琥珀，也就是我们称为格勒苏姆之物。因此，穿过我们土地的这条贸易路线对我们同样极为有利。\n\n\n\n\n\n\n\n\n@event_pic13!"
 barbaricum_vandalia_lugia_mission_task_4:0 "自产琥珀"
 barbaricum_vandalia_lugia_mission_task_4_DESC:0 "自己拥有琥珀会提高我们的利润率；既然可以征服发现大量琥珀的土地，我们为什么还要费心进口这种东西？\n\n\n\n\n\n\n\n\n\n@celt_mil2!"
 barbaricum_vandalia_lugia_mission_task_5:0 "接触凯尔特人"
 barbaricum_vandalia_lugia_mission_task_5_DESC:0 "在我们的南方，来自西方的部落已经出现；他们被称为凯尔特人。他们似乎拥有更高明的知识，因此我们或许可以通过安抚他们来接触这些知识。\n\n\n\n\n\n\n\n\n\n@celt_mil3!"
 barbaricum_vandalia_lugia_mission_task_6:0 "凯尔特人的仪式"
 barbaricum_vandalia_lugia_mission_task_6_DESC:0 "凯尔特人的仪式与我们完全不同。他们声称，只有在河流或其他水域附近献上铁剑、金器等贵重物品，诸神才会赐予祝福。考虑到他们的成功，这或许值得一试。\n\n\n\n\n\n\n\n\n\n@celt_mil12!"
 barbaricum_vandalia_lugia_mission_task_7:0 "卢古斯战士会"
 barbaricum_vandalia_lugia_mission_task_7_DESC:0 "苏维汇人的勇武与凯尔特战士社团的精神结合，将孕育出我们自己的战士社团。有一点可以肯定：凯尔特人的诸神更为强大，因为他们赐予凯尔特人在数十年间征服大片土地的力量。因此，我们也应当将自己的战士社团置于凯尔特锻冶之神卢古斯的庇护之下。\n\n\n\n\n\n\n\n\n\n@celt_mil16!"
 barbaricum_vandalia_lugia_mission_task_7_tt:0 "所有独立的#G 汪达尔#!政权将收到成为附庸并改信#T 德鲁伊教#!的提议。"
 barbaricum_vandalia_lugia_mission_task_8:0 "卢吉亚联盟"
 barbaricum_vandalia_lugia_mission_task_8_DESC:0 "欲使我族兴盛，必须在#G 凯尔特#!锻冶之神[GetDeityDefinition('omen_lugus').GetName|T]护佑下建立同盟，如此方能持其锻造的武器征战四方。\n\n\n\n\n\n\n\n\n\n@celt_mil11!"
 barbaricum_vandalia_lugia_mission_task_9:0 "我们的苏比亚少数民族"
 barbaricum_vandalia_lugia_mission_task_9_DESC:0 "从公元前四世纪初开始，我们人口稀疏的土地便迎来了苏维汇移民。他们居住在偏僻村落，也带来了自己的习俗。更重要的是，他们被视为军事实力的榜样。如果我们将更多这种文化融入自身，也许也能激励自己的人民走向英勇。\n\n\n\n\n\n\n\n\n@celt_mil14!"
 barbaricum_vandalia_lugia_mission_task_9_reward_tt:0 "我们的苏比亚少数民族在未来30年将更加幸福。"
 bohemia_lugian_league_reward_tt:0 "每个自由的汪达尔部落都将收到在我们的保护下加入卢吉亚联盟的提案。"
 cheap_move_slaves_cost:0 "殖民化的努力"
 coast_treveria_19_tt:0 "须在以下任一省份：#G 维利俄卡西亚#!、#G 摩里尼亚#!或#G 加努恩塔#!，于同地建造#Y 港口#!与#Y 要塞#!。需先建立城市或研发#Y 乡村规划#!技术。"
 convert_10_tt_a:0 "在[GetProvince('(int32)3818').GetArea.GetName|G]地区最多可以转换#T 10个人口#!。"
 convert_10_tt_b:0 "在[GetProvince('(int32)3938').GetArea.GetName|G]地区最多可以转换#T 10个人口#!。"
 convert_10_tt_c:0 "在[GetProvince('(int32)3942').GetArea.GetName|G]地区最多可以转换#T 10个人口#!。"
 crown_shaped_neckrings:0 "皇冠形颈圈"
 desc_aremorica_permanent_ending_mod:0 "从卑微的起点开始，我们已扩张至统治整个#Y 大西洋#!沿岸。"
 desc_cheap_move_slaves_cost:0 "我们正在经历一个增长的热潮，必须利用好我们的势头。"
 desc_crown_shaped_neckrings:0 "我们的皇冠形颈圈是区别于邻近部落的一件珠宝。"
 desc_iron_weapons_light_infantry:0 "我们的军事能力因我们使用的精良铁器而得到加强。"
 desc_treveran_deify_mod:0 "由于我们统治者的虔诚，我们的人民得到了诸神的青睐。"
 desc_treverian_melting_pots_culture:0 "我们将我们的文化习俗与特雷维里亚人结合在一起，成为一个大家庭。"
 favor_ripuarians:0 "让统治者家族的一名成员治理[GetProvince('(int32)3728').GetArea.GetName]地区，以偏袒滨河法兰克人。"
 favor_salians:0 "让统治者家族的一名成员治理[GetProvince('(int32)3026').GetArea.GetName]地区，以偏袒萨利安法兰克人。"
 gothonia_suebian_knot_vase:0 "苏维汇发髻青铜釜"
 gothonia_suebian_knot_vase_desc:0 "这是一个外国制造的小铜锅，其灵感来自于宿迁文化。它的柄座描绘了一个长着胡子的苏比亚战士，通过他的苏比亚结很容易被识别。"
 insubria_civilization_tt:0 "每个#G 勒蓬蒂#!文化为主的省份获得#T 10#!文明度。"
 invade_britain_saxonia:0 "与一个#G 不列颠尼亚#!国家交战。"
 invade_gaul_francia:0 "与一个 #G 高卢#! 国家处于战争状态。"
 iron_bar_standard:0 "铁栏标准"
 iron_weapons_light_infantry:0 "钢铁武器"
 lepontic_colony_tt:0 "我们将能够在被征服的领土上找到一块殖民地。"
 lepontic_conquest.freepopstt:0 "#Y [SCOPE.sP('lepontic_colonia_scope').GetName]#!获得#T 4#!个#G 勒蓬蒂#!自由民。"
 lepontic_conquest.poptt:0 "#Y [SCOPE.sP('lepontic_colonia_scope').GetName]#!最多#Y [SCOPE.ScriptValue('lepontic_colonia_scope_20_percent_svalue')|0]#!人口将转变为#G 勒蓬蒂#!文化。"
 suebi_gallia_AVN:0 "#G 阿维尔尼#!是我们的盟友，附属国或不存在。"
 suebi_gallia_CHD:0 "#G 卡鲁迪亚#!是我们的盟友或附属国，或者不存在。"
 suebi_gallia_EUD:0 "#G 欧多西亚#!是我们的盟友或附属国，或者不存在。"

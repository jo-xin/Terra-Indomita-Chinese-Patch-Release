l_simp_chinese:
 me_bactria_01_bactria.1.a:0 "我们很快就准备好了部队，准备攻占该地区。"
 me_bactria_01_bactria.1.desc:0 "我们已向塞琉古领导人发出了一封侮辱性的信件，批评他们无能和软弱。"
 me_bactria_01_bactria.1.t:0 "$bactrian_mission_01_bactria_task_1$——筹备战争"
 me_bactria_01_bactria.10.a:0 "我们将从中大大受益。"
 me_bactria_01_bactria.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_9$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.10.desc:0 "[GetProvince('(int32)6682').GetName]已成为粟特地区首要的商贸中心，丝绸之路上源源不断的财富在此汇聚。"
 me_bactria_01_bactria.10.t:0 "$bactrian_mission_01_bactria_task_9$"
 me_bactria_01_bactria.11.a:0 "这将阻碍来自未来敌人的入侵。"
 me_bactria_01_bactria.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_10$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.11.desc:0 "粟特山岩上的古老要塞已重获新生，将成为粟特地区的重要军事基地。  "
 me_bactria_01_bactria.11.t:0 "$bactrian_mission_01_bactria_task_10$"
 me_bactria_01_bactria.12.a:0 "好极了。"
 me_bactria_01_bactria.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_11$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.12.desc:0 "粟特因与赛里斯及斯基泰的贸易而财源广进，已成为我国王国的商业心脏。"
 me_bactria_01_bactria.12.t:0 "$bactrian_mission_01_bactria_task_11$"
 me_bactria_01_bactria.13.a:0 "祝愿这座城市再次繁荣昌盛。"
 me_bactria_01_bactria.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_12$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.13.desc:0 "[GetProvince('(int32)6703').GetName]已经恢复了昔日的荣光。居鲁士之城再次变得伟大。"
 me_bactria_01_bactria.13.t:0 "$bactrian_mission_01_bactria_task_12$"
 me_bactria_01_bactria.14.a:0 "我们应该向北扩张。"
 me_bactria_01_bactria.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_13$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.14.desc:0 "[GetProvince('(int32)6704').GetName]现在是进一步扩展到斯基泰的重要行动基地。北面是神秘的石塔和中亚的部落。"
 me_bactria_01_bactria.14.t:0 "$bactrian_mission_01_bactria_task_13$"
 me_bactria_01_bactria.15.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_01_bactria.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_14$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.15.desc:0 "我们在费尔干纳山谷建立了一个新的希腊化定居点。这将有望使马萨基特人屈服。"
 me_bactria_01_bactria.15.t:0 "$bactrian_mission_01_bactria_task_14$"
 me_bactria_01_bactria.16.a:0 "非常好。"
 me_bactria_01_bactria.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_15$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.16.desc:0 "费尔干纳盆地如今已成为粟特地区的主要粮仓，将支撑整个区域的粮食供给。"
 me_bactria_01_bactria.16.t:0 "$bactrian_mission_01_bactria_task_15$"
 me_bactria_01_bactria.17.a:0 "马尔吉亚纳的首都繁荣起来了。"
 me_bactria_01_bactria.17.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_16$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.17.desc:0 "[GetProvince('(int32)6668').GetName]已被重新强化和扩大，现在是整个地区最大的城市。"
 me_bactria_01_bactria.17.t:0 "$bactrian_mission_01_bactria_task_16$"
 me_bactria_01_bactria.18.a:0 "马尔吉亚纳已被牢固确立为我们王国的第三大省。"
 me_bactria_01_bactria.18.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_17$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.18.desc:0 "马尔吉亚纳省现在有了新的治理，它将寻求充分利用其经济潜力。"
 me_bactria_01_bactria.18.t:0 "$bactrian_mission_01_bactria_task_17$"
 me_bactria_01_bactria.19.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_01_bactria.19.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_18$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.19.desc:0 "[GetProvince('(int32)6665').GetName]现在是马尔吉亚纳省的二级定居点。"
 me_bactria_01_bactria.19.t:0 "$bactrian_mission_01_bactria_task_18$"
 me_bactria_01_bactria.2.a:0 "我们应该独立。"
 me_bactria_01_bactria.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_1$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.2.desc:0 "我们的信严重损害了我们与塞琉古帝国的关系。我们的军队士气大振，而战争似乎很有可能。"
 me_bactria_01_bactria.2.t:0 "$bactrian_mission_01_bactria_task_1$ - 打破塞琉古人的枷锁"
 me_bactria_01_bactria.20.a:0 "我们很快就准备好了我们的军队，准备攻占该地区。"
 me_bactria_01_bactria.20.desc:0 "花剌子模是肥沃和富裕的。这显然是我们王国扩张的下一步。"
 me_bactria_01_bactria.20.t:0 "$bactrian_mission_01_bactria_task_19$--策划一场战争"
 me_bactria_01_bactria.21.a:0 "花剌子模将是我们的。"
 me_bactria_01_bactria.21.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_19$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.21.desc:0 "我们已经对花剌子模的土地形成了宣称。我们必须征服并向这一地区传播希腊化的文明。"
 me_bactria_01_bactria.21.t:0 "$bactrian_mission_01_bactria_task_19$ - 占领花剌子模"
 me_bactria_01_bactria.22.a:0 "这个地区的未来是光明的。"
 me_bactria_01_bactria.22.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_20$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.22.desc:0 "我们已经在花剌子模区域建造了新的城市，并开始了该地区的文明和希腊化进程。"
 me_bactria_01_bactria.22.t:0 "$bactrian_mission_01_bactria_task_20$"
 me_bactria_01_bactria.23.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_01_bactria.23.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_21$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.23.desc:0 "[GetProvince('(int32)6803').GetName]已经从一个部落定居点转变为一个盛大的希腊化城市。"
 me_bactria_01_bactria.23.t:0 "$bactrian_mission_01_bactria_task_21$"
 me_bactria_01_bactria.24.a:0 "非常好。"
 me_bactria_01_bactria.24.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_22$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.24.desc:0 "我们通过建造新的农场和灌溉渠扩大了花剌子模的农业潜力。它将为我们王国的其他地区提供粮食。"
 me_bactria_01_bactria.24.t:0 "$bactrian_mission_01_bactria_task_22$"
 me_bactria_01_bactria.25.a:0 "也许现在是新领导的时候了？"
 me_bactria_01_bactria.25.desc:0 "自从欧克拉蒂德从塞琉古帝国来到这里，他就成为了巴克特里亚王室中的一个强大人物。他具备了一个伟大领袖的所有素质。"
 me_bactria_01_bactria.25.t:0 "$bactrian_mission_01_bactria_task_23$ - 欧克拉蒂德的崛起"
 me_bactria_01_bactria.26.a:0 "现在是新领导的时候了。"
 me_bactria_01_bactria.26.b:0 "我们对我们目前的领导人感到满意。"
 me_bactria_01_bactria.26.desc:0 "我们的现任统治者已经病倒了，许多人认为他的死亡已经临近。我们宫廷里的一些人认为，这可能是更换巴克特里亚领导层的时候了。"
 me_bactria_01_bactria.26.t:0 "$bactrian_mission_01_bactria_task_23$--巴克特里亚的新领袖？"
 me_bactria_01_bactria.27.a:0 "是的，让我们迁都到[GetProvince('(int32)6694').GetName]。"
 me_bactria_01_bactria.27.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_24$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.27.b:0 "我们应该保持我们的首都在原地。"
 me_bactria_01_bactria.27.b.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_24$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.27.desc:0 "有人建议将奥克苏斯河上的一个地方作为巴克特里亚的新首都。也许是时候从一个更有希腊风格的城市统治我们的国家了？"
 me_bactria_01_bactria.27.t:0 "$bactrian_mission_01_bactria_task_24$"
 me_bactria_01_bactria.28.a:0 "很好。"
 me_bactria_01_bactria.28.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_25$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.28.desc:0 "我们的军队已经被改革和扩大，并有望能够对抗我们更强大的邻国。"
 me_bactria_01_bactria.28.t:0 "$bactrian_mission_01_bactria_task_25$"
 me_bactria_01_bactria.29.a:0 "他们中的每一个人都将得到很好的照顾和赞赏。"
 me_bactria_01_bactria.29.desc:0 "我们已经派出使者，向[GetProvince('(int32)416').GetArea.GetRegion.GetName]、[GetProvince('(int32)379').GetArea.GetRegion.GetName]和[GetProvince('(int32)290').GetArea.GetRegion.GetName]的希腊定居者发出呼吁。他们在地中海各地建立殖民地的历史悠久，我们希望这个最新的提议能吸引他们中的很多人到我们[GetProvince('(int32)6694').GetArea.GetRegion.GetName]的城市定居。"
 me_bactria_01_bactria.29.t:0 "$bactrian_mission_01_bactria_task_26$--提议"
 me_bactria_01_bactria.3.a:0 "我们的首都繁荣起来了。"
 me_bactria_01_bactria.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_2$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.3.desc:0 "巴克特拉已经扩建了新的寺庙、宫殿和道路。它开始类似于一个真正的希腊城市。"
 me_bactria_01_bactria.3.t:0 "$bactrian_mission_01_bactria_task_2$"
 me_bactria_01_bactria.30.a:0 "定居者是无价之宝。"
 me_bactria_01_bactria.30.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_26$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.30.desc:0 "我们已经看到大量的新定居者涌入我们的几个城市，准备在我们的统治下服务，提供税收和征收。随着忠诚的希腊定居者穿插在当地人之间，我们肯定会在任何潜在的动乱和叛乱发生之前进行补救。"
 me_bactria_01_bactria.30.t:0 "$bactrian_mission_01_bactria_task_26$"
 me_bactria_01_bactria.32.a:0 "让我们试着从他们留下的东西中赚点钱，至少？"
 me_bactria_01_bactria.32.desc:0 "我们的许多人被在[GetProvince('(int32)6694').GetArea.GetRegion.GetName]（最近在那里建立的许多城市之一）过新生活的承诺所迷惑。他们抛弃了许多财物和家园，在东部定居后得到了新的家园和工作。"
 me_bactria_01_bactria.32.t:0 "安置在[GetProvince('(int32)6694').GetArea.GetRegion.GetName]中"
 me_bactria_01_bactria.33.a:0 "我们应该向塔里木盆地扩张。"
 me_bactria_01_bactria.33.desc:0 "塞里卡地区对希腊化的世界来说仍然是个谜。也许这次远征会给我们的王国带来无尽的财富？"
 me_bactria_01_bactria.33.t:0 "$bactrian_mission_01_bactria_task_27$--对塞里卡的远征"
 me_bactria_01_bactria.34.a:0 "有什么神秘的东西在等着我们？"
 me_bactria_01_bactria.34.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_27$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.34.desc:0 "是时候越过埃莫迪山脉，扩展到塞里卡的土地上了。"
 me_bactria_01_bactria.34.t:0 "$bactrian_mission_01_bactria_task_27$ - 征服塔里木盆地"
 me_bactria_01_bactria.35.a:0 "巴克特里亚繁荣昌盛。"
 me_bactria_01_bactria.35.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_final$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.35.desc:0 "巴克特里亚蓬勃发展，拥有新发现的财富和肥沃的土地。现在，我们已经建立了我们的中心地带，也许是时候把目光投向我们的边界之外了？"
 me_bactria_01_bactria.35.t:0 "$bactrian_mission_01_bactria_task_final$ - 征服塔里木盆地"
 me_bactria_01_bactria.4.a:0 "非常好。"
 me_bactria_01_bactria.4.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_3$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.4.desc:0 "新的城市已经在整个巴克特里亚中心地带建立起来了。新的定居点已经开始吸引来自农村的定居者，增加我们的经济潜力。"
 me_bactria_01_bactria.4.t:0 "$bactrian_mission_01_bactria_task_3$"
 me_bactria_01_bactria.5.a:0 "每次都是一块石头。"
 me_bactria_01_bactria.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_4$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.5.desc:0 "我们已经尝试培养独特的希腊-巴克特里亚文化，吸收了波斯和希腊化民族的最佳元素。"
 me_bactria_01_bactria.5.t:0 "$bactrian_mission_01_bactria_task_4$"
 me_bactria_01_bactria.6.a:0 "非常好。"
 me_bactria_01_bactria.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_5$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.6.desc:0 "[GetProvince('(int32)6688').GetName]已被改造成一个主要的希腊化中心，可与亚细亚的任何地方相媲美。"
 me_bactria_01_bactria.6.t:0 "$bactrian_mission_01_bactria_task_5$"
 me_bactria_01_bactria.7.a:0 "愿这些堡垒保护我们。"
 me_bactria_01_bactria.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_6$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.7.desc:0 "我们在东部边境建造了许多堡垒，希望这些堡垒能保护我们的新王国不受孔雀帝国和塞琉古帝国更庞大的军队的攻击。"
 me_bactria_01_bactria.7.t:0 "$bactrian_mission_01_bactria_task_6$"
 me_bactria_01_bactria.8.a:0 "愿这座新城市繁荣昌盛。"
 me_bactria_01_bactria.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_7$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.8.desc:0 "我们已经重新建立了[GetProvince('(int32)6686').GetName]作为希腊化的城市。它现在也有了一个新的名字。"
 me_bactria_01_bactria.8.t:0 "$bactrian_mission_01_bactria_task_7$"
 me_bactria_01_bactria.9.a:0 "非常好。"
 me_bactria_01_bactria.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_01_bactria_task_8$#!' $mission_completed_tooltip_2$"
 me_bactria_01_bactria.9.desc:0 "奥克苏斯河谷的农业潜力已经大大扩展，现在将为我们帝国人口最多的地区提供粮食。"
 me_bactria_01_bactria.9.t:0 "$bactrian_mission_01_bactria_task_8$"
 me_bactria_02_parthia.1.a:0 "我们很快就能准备好我们的部队，以攻占该地区。"
 me_bactria_02_parthia.1.desc:0 "帕提亚软弱无力，时机已经成熟。这个总督领将成为我们王国的一个优秀补充。"
 me_bactria_02_parthia.1.t:0 "$bactrian_mission_02_parthia_task_1$--着眼于北方"
 me_bactria_02_parthia.10.a:0 "非常好。"
 me_bactria_02_parthia.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_8$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.10.desc:0 "我们已经建立了[GetProvince('(int32)3435').GetName]，使之成为许耳卡尼亚海的首要城市。"
 me_bactria_02_parthia.10.t:0 "$bactrian_mission_02_parthia_task_8$"
 me_bactria_02_parthia.11.a:0 "我们将从中受益匪浅。"
 me_bactria_02_parthia.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_9$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.11.desc:0 "[GetProvince('(int32)3435').GetArea.GetName]的贸易路线现在将其与位于巨大的许耳卡尼亚内海沿岸的各个城市和部落连接起来。虽然我们目前缺乏与海洋的联系，但这一地区的贸易应该仍然是我们王国的一个福音。"
 me_bactria_02_parthia.11.t:0 "$bactrian_mission_02_parthia_task_9$"
 me_bactria_02_parthia.12.a:0 "愿[GetProvince('(int32)3439').GetName]繁荣昌盛。"
 me_bactria_02_parthia.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_10$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.12.desc:0 "[GetProvince('(int32)3439').GetName]现在是帕提亚的王都，并将成为我们不断增长的王国中最伟大的希腊人定居点之一。"
 me_bactria_02_parthia.12.t:0 "$bactrian_mission_02_parthia_task_10$"
 me_bactria_02_parthia.13.a:0 "优秀。"
 me_bactria_02_parthia.13.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_11$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.13.desc:0 "[GetProvince('(int32)3439').GetArea.GetName]随着新的投资而繁荣起来。作为帕提亚的皇家心脏地带，这个地区保持财富和繁荣的外衣是很重要的。"
 me_bactria_02_parthia.13.t:0 "$bactrian_mission_02_parthia_task_11$"
 me_bactria_02_parthia.14.a:0 "帕提亚的发展和繁荣。"
 me_bactria_02_parthia.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_12$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.14.desc:0 "新的城市已经从帕提亚曾经空旷的农业沙漠中崛起，以来自许耳卡尼亚的农场的食物和水为食。来自邻近的希腊和波斯王国的新定居者已经开始抵达。"
 me_bactria_02_parthia.14.t:0 "$bactrian_mission_02_parthia_task_12$"
 me_bactria_02_parthia.15.a:0 "一砖一瓦，我们的帝国在成长。"
 me_bactria_02_parthia.15.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_final$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.15.desc:0 "随着帕提亚现在被我们完全控制，我们已经从一个贫穷的山区落后地区变成了一个真正的经济强国。来自整个希腊世界的定居者已经开始涌入我们新建成的定居点。"
 me_bactria_02_parthia.15.t:0 "$bactrian_mission_02_parthia_task_final$"
 me_bactria_02_parthia.2.a:0 "帕提亚将是我们的。"
 me_bactria_02_parthia.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_1$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.2.desc:0 "我们对帕提亚有宣称。准备好部队，战争一触即发。"
 me_bactria_02_parthia.2.t:0 "$bactrian_mission_02_parthia_task_1$ - 准备军队"
 me_bactria_02_parthia.3.a:0 "帕提亚的其他地区正在等待。"
 me_bactria_02_parthia.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_2$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.3.desc:0 "古老的[GetProvince('(int32)3444').GetArea.GetName]和[GetProvince('(int32)3450').GetArea.GetName]省份现在在我们的控制之下。这里的城市古老而破败，需要大量投资才能与我们巴克特里亚定居点的辉煌相媲美。"
 me_bactria_02_parthia.3.t:0 "$bactrian_mission_02_parthia_task_2$"
 me_bactria_02_parthia.4.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_02_parthia.4.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_3$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.4.desc:0 "[GetProvince('(int32)3454').GetName]再次热闹起来，建筑和工业的声音充满了空气。在我们的赞助下，古老的帕提亚首都将再次成为一个活动中心。"
 me_bactria_02_parthia.4.t:0 "$bactrian_mission_02_parthia_task_3$"
 me_bactria_02_parthia.5.a:0 "一石激起千层浪。"
 me_bactria_02_parthia.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_4$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.5.desc:0 "为了提升古老的帕提亚心脏地带，我们已经花费了相当多的黄金和影响力。效益已经结出了果实。"
 me_bactria_02_parthia.5.t:0 "$bactrian_mission_02_parthia_task_4$"
 me_bactria_02_parthia.6.a:0 "我们很快就可以准备好我们的部队，拿下该地区。"
 me_bactria_02_parthia.6.desc:0 "虽然他们的实力在增长，但我们的军队对帕提亚北部地区的部落民族仍有优势。我们应该现在就出击，在我们还能做到的时候拿下这个地区。"
 me_bactria_02_parthia.6.t:0 "$bactrian_mission_02_parthia_task_5$--大益人"
 me_bactria_02_parthia.7.a:0 "准备好我们的部队，准备开战。"
 me_bactria_02_parthia.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_5$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.7.desc:0 "大益人已经被打了个措手不及。现在是进攻的时候了。"
 me_bactria_02_parthia.7.t:0 "$bactrian_mission_02_parthia_task_5$ - 准备好我们的部队"
 me_bactria_02_parthia.8.a:0 "很好。"
 me_bactria_02_parthia.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_6$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.8.desc:0 "[GetProvince('(int32)6657').GetName]已经重建，将作为我们宫廷的皇家墓地和宫殿群。"
 me_bactria_02_parthia.8.t:0 "$bactrian_mission_02_parthia_task_6$"
 me_bactria_02_parthia.9.a:0 "这将成为我们王国的一个重要的新地区。"
 me_bactria_02_parthia.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_02_parthia_task_7$#!' $mission_completed_tooltip_2$"
 me_bactria_02_parthia.9.desc:0 "[GetProvince('(int32)3435').GetArea.GetName]和[GetProvince('(int32)3439').GetArea.GetName]现在是我们的了，同时还有它们的财富和商业潜力。"
 me_bactria_02_parthia.9.t:0 "$bactrian_mission_02_parthia_task_7$"
 me_bactria_03_aria.1.a:0 "我们很快就可以准备好我们的部队，去占领这个地区。"
 me_bactria_03_aria.1.desc:0 "阿里亚是我们王国扩张的下一个合理选择。它的财富和自然屏障将使它成为我们不断增长的帝国的绝佳补充。"
 me_bactria_03_aria.1.t:0 "$bactrian_mission_03_aria_task_1$--进入阿里亚"
 me_bactria_03_aria.10.a:0 "很好。"
 me_bactria_03_aria.10.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_9$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.10.desc:0 "[GetProvince('(int32)6541').GetName]注定会成为我们帝国的伟大城市之一。"
 me_bactria_03_aria.10.t:0 "$bactrian_mission_03_aria_task_9$"
 me_bactria_03_aria.11.a:0 "我们必须有一个宽容的社会。"
 me_bactria_03_aria.11.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_10$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.11.desc:0 "作为一个多元文化和多宗教帝国的统治者，我们有责任不惜一切代价防止宗教间冲突。建立新的礼拜场所将使我们所有的公民能够实践他们选择的宗教，同时也能了解彼此的许多情况。这将有望在未来导致东方宗教和希腊宗教的融合。"
 me_bactria_03_aria.11.t:0 "$bactrian_mission_03_aria_task_10$"
 me_bactria_03_aria.12.a:0 "阿剌科西亚的发展和繁荣。"
 me_bactria_03_aria.12.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_11$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.12.desc:0 "在阿剌科西亚建造的新矿场使我们能够开发这个区域的天然矿物财富。这将有利于我们的军队，使我们能够生产更多的军事装备。"
 me_bactria_03_aria.12.t:0 "$bactrian_mission_03_aria_task_11$"
 me_bactria_03_aria.13.a:0 "他们中的每一个人都将得到很好的照顾和赞赏。"
 me_bactria_03_aria.13.desc:0 "我们已经派出使者，向[GetProvince('(int32)416').GetArea.GetRegion.GetName]、[GetProvince('(int32)379').GetArea.GetRegion.GetName]、[GetProvince('(int32)290').GetArea.GetRegion.GetName]和[GetProvince('(int32)911').GetArea.GetRegion.GetName]的希腊定居者发出呼吁。他们在地中海各地建立殖民地的历史悠久，我们希望这个最新的提议能吸引他们中的很多人到我们[GetProvince('(int32)6558').GetArea.GetRegion.GetName]的城市定居。"
 me_bactria_03_aria.13.t:0 "$bactrian_mission_01_bactria_task_12$--提议"
 me_bactria_03_aria.14.a:0 "定居者是无价之宝。"
 me_bactria_03_aria.14.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_12$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.14.desc:0 "我们已经看到大量的新定居者涌入我们的几个城市，准备在我们的统治下服务，提供税收和征收。随着忠诚的希腊定居者穿插在当地人之间，我们肯定会在任何潜在的动乱和叛乱发生之前进行补救。"
 me_bactria_03_aria.14.t:0 "$bactrian_mission_03_aria_task_12$"
 me_bactria_03_aria.15.a:0 "我们很快就可以准备好我们的部队，去占领这个地区。"
 me_bactria_03_aria.15.desc:0 "随着阿里亚纳现在处于我们的完全控制之下，我们将目光投向东方，以便进一步扩张。在阿剌科西亚的山脉之外，是印度河流域丰富而肥沃的土地，亚历山大的帝国在这里结束。我们必须鼓起力量与孔雀正面对抗，将这些土地据为己有。"
 me_bactria_03_aria.15.t:0 "$bactrian_mission_03_aria_task_final$ - 目光转向东方"
 me_bactria_03_aria.16.a:0 "印度是扩张的下一个合理步骤。"
 me_bactria_03_aria.16.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_final$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.16.desc:0 "印度河流域的土地应该是我们的。"
 me_bactria_03_aria.16.t:0 "$bactrian_mission_03_aria_task_final$"
 me_bactria_03_aria.17.a:0 "定居者很快就会到达"
 me_bactria_03_aria.17.desc:0 "随机国家将派遣定居者"
 me_bactria_03_aria.17.t:0 "寻找定居者"
 me_bactria_03_aria.18.a:0 "让我们试着从他们留下的东西中赚点钱，至少？"
 me_bactria_03_aria.18.desc:0 "我们的许多人被在[GetProvince('(int32)6558').GetArea.GetRegion.GetName]（最近在那里建立的许多城市之一）过新生活的承诺所迷惑。他们抛弃了许多财物和家园，在东部定居后得到了新的家园和工作。"
 me_bactria_03_aria.18.t:0 "安置在[GetProvince('(int32)6558').GetArea.GetRegion.GetName]中"
 me_bactria_03_aria.2.a:0 "阿里亚将是我们的。"
 me_bactria_03_aria.2.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_1$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.2.desc:0 "我们对阿里亚有宣称。准备好部队，战争一触即发。"
 me_bactria_03_aria.2.t:0 "$bactrian_mission_03_aria_task_1$ - 准备部队"
 me_bactria_03_aria.3.a:0 "阿里亚的其他地区正在等待。"
 me_bactria_03_aria.3.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_2$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.3.desc:0 "[GetProvince('(int32)6558').GetArea.GetName]和[GetProvince('(int32)6552').GetArea.GetName]现在由我们控制。开发这一地区的农业，并吸引新的定居者到其希腊化城市，将巩固我们的控制。"
 me_bactria_03_aria.3.t:0 "$bactrian_mission_03_aria_task_2$"
 me_bactria_03_aria.4.a:0 "这是一个伟大的新皇家首都的开始。"
 me_bactria_03_aria.4.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_3$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.4.desc:0 "[GetProvince('(int32)6558').GetName]已经被重建并大幅扩展，现在是我们新的阿里亚纳省的官方首都。它有望在未来几年成为一个主要的大都市。"
 me_bactria_03_aria.4.t:0 "$bactrian_mission_03_aria_task_3$"
 me_bactria_03_aria.5.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_03_aria.5.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_4$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.5.desc:0 "[GetProvince('(int32)6518').GetName]已被提升为'城市'级别，有了新的道路、城墙和公共建筑。希望我们在这一领域的投资将在未来几年得到回报。"
 me_bactria_03_aria.5.t:0 "$bactrian_mission_03_aria_task_4$"
 me_bactria_03_aria.6.a:0 "这是一个伟大的新城市的开始。"
 me_bactria_03_aria.6.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_5$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.6.desc:0 "[GetProvince('(int32)6555').GetName]现在是我们在阿里亚纳最新的定居点。也许这将开启一个趋势，即建立我们自己的城市，而不是简单地建设那些由亚历山大建立的城市。"
 me_bactria_03_aria.6.t:0 "$bactrian_mission_03_aria_task_5$"
 me_bactria_03_aria.7.a:0 "这将成为我们王国的一个重要的新地区。"
 me_bactria_03_aria.7.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_6$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.7.desc:0 "新的灌溉和耕作技术使我们能够开发阿里亚的农业潜力，养活其不断增长的人口。"
 me_bactria_03_aria.7.t:0 "$bactrian_mission_03_aria_task_6$"
 me_bactria_03_aria.8.a:0 "好极了。"
 me_bactria_03_aria.8.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_7$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.8.desc:0 "阿剌科西亚现在是我们的了，我们已经在与印度的边界上建立了牢固的控制。"
 me_bactria_03_aria.8.t:0 "$bactrian_mission_03_aria_task_7$"
 me_bactria_03_aria.9.a:0 "我们将从中大大受益。"
 me_bactria_03_aria.9.a.tt:0 "$mission_completed_tooltip_1$ '#Y $bactrian_mission_03_aria_task_8$#!' $mission_completed_tooltip_2$"
 me_bactria_03_aria.9.desc:0 "我们已经改善了[GetProvince('(int32)6611').GetName]的灌溉条件，这将使这个重要的希腊定居点能够种植更多的粮食，并吸引更多的定居者。水和食物短缺的日子已经过去了。"
 me_bactria_03_aria.9.t:0 "$bactrian_mission_03_aria_task_8$"
 me_bactria_aria_move_pop_tt_1:0 "#Y [THIS.GetProvince.GetName]#! 已收到#Y [THIS.GetProvince.MakeScope.GetVariable('aria_pop_move_variable').GetValue|0]#! pop。"

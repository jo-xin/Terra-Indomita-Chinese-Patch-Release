 me_bactria_move_pop_tt_1:0 "#Y [THIS.GetProvince.GetName]#! 已收到#Y [THIS.GetProvince.MakeScope.GetVariable('bactria_pop_move_variable').GetValue|0]#! pop。"
 me_bactria_move_pop_tt_2:0 "#Y [THIS.GetProvince.GetName]#! 已收到#Y [THIS.GetProvince.MakeScope.GetVariable('bactria_pop_move_variable').GetValue|0]#! 票。"
 me_bactria_move_pop_tt_3:0 "#Y [THIS.GetProvince.MakeScope.GetVariable('bactria_pop_move_variable').GetValue|0]#! 人口已经离开#Y [THIS.GetProvince.GetName]#!"
 me_bactria_move_pop_tt_4:0 "#Y [THIS.GetProvince.MakeScope.GetVariable('bactria_pop_move_variable').GetValue|0]#! 啪啪啪已经离开了#Y [THIS.GetProvince.GetName]#!。"

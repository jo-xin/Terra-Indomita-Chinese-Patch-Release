l_simp_chinese:
 03_tibet_mission:0 "山堡"
 03_tibet_mission_BUTTON_TOOLTIP:0 "没有人能够攀登我们防御工事的城墙..."
 03_tibet_mission_CRITERIA_DESCRIPTION:0 "这个任务将在 #E 藏#! 建立起了基础设施和防御，形成了一个密不透风的山地堡垒时完成·。"
 03_tibet_mission_DESCRIPTION:0 "现在，我们已经在 #E 藏#! 的光荣旗帜下统一了我们的地区，我们将引导我们的人民完成一个共同的目标——建立一个强大的国家，一个能够保护其人民，同时改善他们生活的人。"
 03_tibet_mission_task_1:0 "西方通道"
 03_tibet_mission_task_10:0 "石头征税"
 03_tibet_mission_task_10_DESC:0 "我们的军队是在战斗中铸造的，能够将我们的力量投射到[ROOT.GetCountry.GetCapital.GetName]的城门之外，投射到数月之遥的王国和土地上——所有人都应该惧怕[ROOT.GetCountry.GetName]和我们的岩石巨兵！\n\n\n\n\n\n\n\n\n\n@persia_mil9!"
 03_tibet_mission_task_11:0 "贵族的出现"
 03_tibet_mission_task_11_DESC:0 "尽管我们的人民出身卑微，但一个由我们的军事精英、富人和王室成员组成的上层阶级正在缓慢而坚定地形成。 \n\n\n\n\n\n\n\n\n\n@india_mil20!"
 03_tibet_mission_task_12:0 "佛教徒学者"
 03_tibet_mission_task_12_DESC:0 "尽管我们传统上信奉苯教，[ROOT.GetCountry.GetRuler.GetName]还是想邀请佛教学者到[ROOT.GetCountry.GetCapital.GetName]来，让我们亲自聆听他们的布道。\n\n#Y 这将启动一个事件链#!\n\n\n\n\n\n\n\n\n\n@india_mil19!"
 03_tibet_mission_task_13:0 "山堡"
 03_tibet_mission_task_13_DESC:0 "如果敌军有幸找到进入我们家园的通道，每当他们看到我们到处修建的雄伟防御工事时，他们的就会心知肚明--难怪我们的国家被称为“山堡”。\n\n\n\n\n\n\n\n\n\n@persia_mil7!"
 03_tibet_mission_task_14:0 "天马公路"
 03_tibet_mission_task_14_DESC:0 "目前，将马匹从#E 费尔干纳河谷#!运到我们的家园非常困难--让我们看看如何改变这种状况。\n\n\n\n\n\n\n\n\n\n@persia_mil14!"
 03_tibet_mission_task_1_DESC:0 "穿越西部山区是一项极其艰巨的任务，艰难的地形无疑使该地区成为荒地。然而，我们必须在山区修建一条道路，连接 [GetProvince('(int32)5594').GetName] 和 [GetProvince('(int32)5561').GetName]。\n\n\n\n\n\n\n\n\n\n@greek_mil1!"
 03_tibet_mission_task_2:0 "连接中部地区"
 03_tibet_mission_task_2_DESC:0 "我们的中部领土太大，无法立即修建一条道路——我们必须分阶段修建这些重要道路。\n\n\n\n\n\n\n\n\n\n@celt_mil6!"
 03_tibet_mission_task_3:0 "东方通道"
 03_tibet_mission_task_3_DESC:0 "#E 藏#! 东部的重要地区值得拥有一条连接最重要地方的道路——我们应该花费时间、金钱和人力，因为结果绝对值得。\n\n\n\n\n\n\n\n\n\n@greek_mil7!"
 03_tibet_mission_task_4:0 "山地军事演习"
 03_tibet_mission_task_4_DESC:0 "既然我们已经在内陆地区修建了道路，我们必须告诉我们的士兵，他们必须在山区训练——我们不能让我们边境的岩石峭壁在战争时期成为障碍。\n\n\n\n\n\n\n\n\n\n@greek_mil17!"
 03_tibet_mission_task_5:0 "大西藏道路"
 03_tibet_mission_task_5_DESC:0 "一旦我们完成了#E 江塘#!的最后一点建设!和#E 珠穆朗玛#!现在，我们可以正式宣布我们的基础设施杰作——#Y 大西藏道路#!的建成!——世界屋脊的高速道路!\n\n\n\n\n\n\n\n\n\n@greek_mil10!"
 03_tibet_mission_task_6:0 "在荒原上训练"
 03_tibet_mission_task_6_DESC:0 "掌握山区地形并不意味着我们应该忽视在中部丘陵地带的战斗——我们可以从王国的每个角落都收集到一些技巧。\n\n\n\n\n\n\n\n\n\n@persia_mil6!"
 03_tibet_mission_task_7:0 "被迫在山地行军"
 03_tibet_mission_task_7_DESC:0 "虽然我们知道我们的士兵会怨声载道，但我们已经决定让他们每年夏天穿过山脉。我们需要确保我们的士兵始终处于战斗状态，而这是最好的方法之一。我们的军队将效仿我们的#T 军团#!，他们比其他所有人都强得多。\n\n\n\n\n\n\n\n\n\n@persia_mil11!"
 03_tibet_mission_task_8:0 "喜马拉雅城市"
 03_tibet_mission_task_8_DESC:0 "现在我们的高速公路已经完工，是时候把我们的注意力转向城市建设了。还有许多工作要做，但我们不能让任务的艰巨吓住我们。\n\n\n\n\n\n\n\n\n\n@india_mil17!"
 03_tibet_mission_task_8_tt:0 "我们需要在#Y 喜马拉雅#!地区至少拥有#Y 5#!座#T 城市#!。"
 03_tibet_mission_task_9:0 "藏地城镇"
 03_tibet_mission_task_9_DESC:0 "极重要的#E 藏#!东部地区值得在最具吸引力的地方建造[ROOT.GetCountry.GetAdjective]城市——让我们开始自己必须做的工作。 \n\n\n\n\n\n\n\n\n\n\n@event_pic11!"
 03_tibet_mission_task_9_tt:0 "我们需要在#Y 西藏#!地区至少拥有#Y 5#!座#T 城市#!。"
 desc_himalayan_cities_task_8_modifier:0 "我们整个喜马拉雅地区的城市业已成为重要的文化和行政中心。"
 desc_mountain_fortress_tibet_end_mod:0 "由于我们的国家防御严密，我们的邻居畏惧地称我们为“山堡”——因为我们无法被征服。"
 desc_stone_levies_tibet_mod:0 "我们的军队就像孕育他们的大山一样坚强。"
 desc_tibet_cities_task_9_modifier:0 "我们西藏地区的城市在经济和军事上都为我们整个国家带来了利益。"
 desc_tibet_hills_maneuvers_mod:0 "我们的部队已经掌握了在山脚下作战的技巧。"
 desc_tibet_mountain_maneuvers_mod:0 "我们的部队经常在山区训练，以确保他们能够迅速通过困难的地形。"
 desc_tibet_quick_boys_mod:0 "我们的军队能以超乎寻常的速度穿过山脉，在崎岖的乡村中袭击敌人，并压制住他们。"
 himalayan_cities_task_8_modifier:0 "喜马拉雅城市"
 me_tibet_1.a:0 "如今取得了伟大的成就"
 me_tibet_10.a:0 "您所听到的有关于我们的一切都是真实的......"
 me_tibet_10_desc:0 "对于我们的众多敌人来说，我们不断强大，而他们却步履蹒跚、不断倒下，这似乎很不公平，但我们不应该因为夺取了本应属于我们的东西而受到责备，哪怕那是整个世界。\n\n现在，我们是一个#E 大国#!，那些将我们带向成功巅峰的传奇战斗部队可以在山区和丘陵中不断训练和演习。 我们的士兵赢得了“#Y 石头军团的绰号#!”，因为他们就是大山的孩子，坚硬如石，不屈不挠。"
 me_tibet_10_title:0 "$03_tibet_mission_task_10$"
 me_tibet_10_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_10$#!”$mission_completed_tooltip_2$"
 me_tibet_11.a:0 "不知道我们的祖先看到这一切会作何感想……"
 me_tibet_11_desc:0 "许多世纪以来，在[ROOT.GetCountry.GetName]的高山和峡谷中生活并非易事；在这里，在这片无情的土地上，生活艰苦，没有任何东西可以浪费，死亡常常突然降临，毫无征兆。\n\n然而，我们国家的情况开始发生变化，人们可以亲眼看到一个新的[ROOT.GetCountry.GetAdjective]贵族阶层的出现。在[ROOT.GetCountry.GetCapital.GetName]这样的城市，尤其是在贵族阶层，这里聚集了我们最富有的公民，许多人终日饮酒赛马--这与在山区附近的定居点勉强生存的卑微农民形成了鲜明对比。\n\n多么奇怪啊，我们的社会开始分化成不同的社会阶层！"
 me_tibet_11_title:0 "$03_tibet_mission_task_11$"
 me_tibet_11_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_11$#!”$mission_completed_tooltip_2$"
 me_tibet_12.a:0 "我已经迫不及待地想接待这些学者了！那将是多么美好的时刻啊！"
 me_tibet_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]从到访[ROOT.GetCountry.GetCapital.GetName]的佛教旅行者那里听到了许多故事，他们希望听到更多关于我们南方土地上发生的事情，因此派遣了一个代表团来寻找这些佛教圣贤。\n\n[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]愉快地请求这些学者们能和平、愉快地接受我们送来的黄金礼物，我们希望他们能认为我们有资格到我们的山中家园来拜访我们。"
 me_tibet_12_title:0 "$03_tibet_mission_task_12$"
 me_tibet_12_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_12$#!”$mission_completed_tooltip_2$"
 me_tibet_13.a:0 "世界上没有任何军队可以从我们手中夺走我们的山脉"
 me_tibet_13_desc:0 "据说，许多入侵的军队一旦看到[ROOT.GetCountry.GetAdjective]边界沿线的防御工事，往往会立即丧失斗志，羞愧地掉头就走。\n\n他们互相询问，军队怎么可能攻下一座仿佛建在山顶上的城堡？ 这里的空气冷得让人透不过气来，而且缺乏柴火--谁愿意在这个国家扎营，我们很可能会冻死在这里？\n\n如果我们的敌人必须这样来合理解释他们不愿死在我们要塞山脚下的原因，那么我们就允许他们这样做。"
 me_tibet_13_title:0 "$03_tibet_mission_task_13$"
 me_tibet_13_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_13$#!”$mission_completed_tooltip_2$"
 me_tibet_14.a:0 "我曾来寻求和平，但我现在会给所有人带来战争和死亡！"
 me_tibet_14_claims_tooltip:0 "我们将获得#Y 北印度#!的宣称。"
 me_tibet_14_desc:0 "令我们震惊的是，我们收到了一份令人震惊的报告，内容涉及我们派往#E 印度#!的希望鼓励佛教学者访问我们的首都的外交官。 \n \n我们可怜的使者遭到了土匪的袭击，他们不失时机地抢走了我们士兵身上的一切，包括他们的生命。  虽然我们没有任何证据，但有人怀疑这一恶行是我们的敌人雇用的强盗所为…… \n \n当[ROOT.GetCountry.GetRuler.GetName]听到了这个故事，所有[ROOT.GetCountry.GetName]很快就会体验到[ROOT.GetCountry.GetRulerTitle]的愤怒 - 对于这种严重侮辱的唯一答案只能是一件事：  战争外交官，。 "
 me_tibet_14_title:0 "佛教徒学者：宣战理由"
 me_tibet_14_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_12$#!”$mission_completed_tooltip_2$"
 me_tibet_15.a:0 "费尔干纳盆地的天马无以伦比……"
 me_tibet_15_desc:0 "我们终于完成了#E 大西藏道路#!的又一段道路！，这次是开辟一条蜿蜒的小路，穿过山脉向北绵延而去。\n\n现在我们已经将遥远的城市 [GetProvince('(int32)6737').GetName] 连接到我们的祖国，我们希望我们的市场上充满金钱可以买到的最好的动物。"
 me_tibet_15_title:0 "$03_tibet_mission_task_14$"
 me_tibet_15_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_14$#!”$mission_completed_tooltip_2$"
 me_tibet_1_desc:0 "虽然我们在西部深山中的工程师工作艰苦，但他们已经完成了我们要求的工程，如今[GetProvince('(int32)5594').GetName]和[GetProvince('(int32)5561').GetName]之间已经修成一段漫长道路。由于我们的商人能够抵达最偏远的定居点，该地区的贸易已经开始繁荣。"
 me_tibet_1_title:0 "$03_tibet_mission_task_1$"
 me_tibet_1_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_1$#!”$mission_completed_tooltip_2$"
 me_tibet_2.a:0 "这条路对于 [GetProvince('(int32)5615').GetName] 和西藏来说都是一件好事情"
 me_tibet_2_desc:0 "我们很高兴地向您报告，北部的高速公路已经完工，[GetProvince('(int32)5615').GetName]城已经成为沿途的一个重要站点。\n\n当疲惫的旅行者看到城墙耸立在地平线上，城内有新鲜的食物和[ROOT.GetCountry.GetAdjective]好客的承诺在等待着他们时，他们的喜悦之情难以言表。"
 me_tibet_2_title:0 "$03_tibet_mission_task_2$"
 me_tibet_2_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_2$#!”$mission_completed_tooltip_2$"
 me_tibet_3.a:0 "我们的西藏征召兵确实是奇迹的创造者"
 me_tibet_3_desc:0 "很难估计我们的工程师为了修建通往[GetProvince('(int32)5618').GetName]的道路而不得不凿穿的石头的数量，但我们被告知，我们的工人已经掌握了一项不可能完成的任务，即使让一大堆岩石消失。"
 me_tibet_3_title:0 "$03_tibet_mission_task_3$"
 me_tibet_3_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_3$#!”$mission_completed_tooltip_2$"
 me_tibet_4.a:0 "我为你们在这里所做的一切感到骄傲——感谢各位"
 me_tibet_4_desc:0 "在过去的三个月里，[ROOT.GetCountry.GetRuler.GetName]一直亲自监督我们在山区的征兵训练，沿着有序修建的道路派遣大量部队，以便他们可以在位于 [ROOT.GetCountry.GetName] 的最远的地方进行训练。\n\n尽管这是一项艰苦的工作，但我们的士兵以他们一生中最好的状态进行，即使在最困难的地形上，也准备好对我们的敌人造成毁灭性的打击。"
 me_tibet_4_title:0 "$03_tibet_mission_task_4$"
 me_tibet_4_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_4$#!”$mission_completed_tooltip_2$"
 me_tibet_5.a:0 "有朝一日，我打算亲自走遍大江南北"
 me_tibet_5.b:0 "我们应该把钱花在连接一些城市的高速公路上"
 me_tibet_5_desc:0 "终于，#E 西藏大路#!竣工了 [ROOT.GetCountry.GetRuler.GetName]的设计非常简单：一条深入深山、远离边境的北方公路，可以让我们的商人和士兵快速地进行内部交流。\n\n现在，这个梦想已经实现，整个 [ROOT.GetCountry.GetName] 都在赞美我们狡猾的领袖和 [ROOT.GetCountry.GetRuler.GetHerHis] 独到的眼光--除了 [ROOT.GetCountry.GetRuler.GetFirstName] 还有谁能做到这样的事情呢？"
 me_tibet_5_title:0 "$03_tibet_mission_task_5$"
 me_tibet_5_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_5$#!”$mission_completed_tooltip_2$"
 me_tibet_6.a:0 "凡是违背我意志的人，我们都会消灭！"
 me_tibet_6_desc:0 "从不吝惜重复之前的成功，[ROOT.GetCountry.GetRuler.GetName]已经抽出一段时间再次训练我们的征兵，回到荒地上，让我们的士兵承受前所未有的压力。\n\n我们的[ROOT.GetCountry.GetRulerTitle]不仅带着[ROOT.GetCountry.GetAdjective]历史上有史以来最致命的战斗力回到了[ROOT.GetCountry.GetCapital.GetName]，而且还有人说我们的队伍中出现了一颗冉冉升起的新星--一名深受兄弟们信任的士兵，可能会成为一名可怕的指挥官。"
 me_tibet_6_title:0 "$03_tibet_mission_task_6$"
 me_tibet_6_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_6$#!”$mission_completed_tooltip_2$"
 me_tibet_6_tt:0 "在首都地区拥有一个军团，该军团至少有#Y 12#!个单位和#Y 3#! 区别。"
 me_tibet_7.a:0 "我们的士兵像山羊一样灵活"
 me_tibet_7_desc:0 "再一次，[ROOT.GetCountry.GetName]要求他的士兵们完成一项艰巨的任务：在山区强行军。\n\n在过去的三个月里，我们的士兵出色地完成了这项任务，营地里没有任何抱怨；看来我们的战士们看到了这种训练的好处，并为接下来的任何事情做好了准备。"
 me_tibet_7_title:0 "$03_tibet_mission_task_7$"
 me_tibet_7_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_7$#!”$mission_completed_tooltip_2$"
 me_tibet_7_tt:0 "我们必须有一个#T 军团#!至少有 #Y 6#!#G 轻步兵#!分队和#Y 3#!#T 军团区别#!。"
 me_tibet_8.a:0 "呃，我不介意……不过我会记住那些不相信我的人"
 me_tibet_8_desc:0 "随着时间的推移，我们在整个#E 喜马拉雅#!地区投资建设城市。尽管 [ROOT.GetCountry.GetCapital.GetName] 中的一些人抱怨在山区建造城市的成本太高，但他们的意见被驳回，工程得以顺利进行。\n\n许多年后，现在这个愿景已被证明是成功的，每个人都假装他们一直都同意 [ROOT.GetCountry.GetRuler.GetName] 的计划。"
 me_tibet_8_title:0 "$03_tibet_mission_task_8$"
 me_tibet_8_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_8$#!”$mission_completed_tooltip_2$"
 me_tibet_9.a:0 "照顾[ROOT.GetCountry.GetRuler.GetHerHis]人民是统治者的责任——我很乐意这样做"
 me_tibet_9_desc:0 "今天早上我们在 [ROOT.GetCountry.GetCapital.GetName] 收到消息，我们在#E 西藏#!地区开展的建设城市的运动已经结束，我们的人民永远感激我们对他们的家园的投资，许多人个人相信[ROOT.GetCountry.GetRuler.GetName]是使这一切的唯一的推动者。"
 me_tibet_9_title:0 "$03_tibet_mission_task_9$"
 me_tibet_9_tooltip:0 "$mission_completed_tooltip_1$“#Y $03_tibet_mission_task_9$#!”$mission_completed_tooltip_2$"
 mountain_fortress_tibet_end_mod:0 "山堡"
 stone_levies_tibet_mod:0 "石头征税"
 tibet_cities_task_9_modifier:0 "藏地城市"
 tibet_hills_maneuvers_mod:0 "丘陵军事演习"
 tibet_mission_tree_task_13_tt:0 "我国至少有#Y 10#!个领地拥有#T 要塞#!。"
 tibet_missions_task_4_tooltip:0 "我们需要一个至少有#Y 7#!个子单位的#T 军团#!"
 tibet_mountain_maneuvers_mod:0 "山地军事演习"
 tibet_quick_boys_mod:0 "山区巡逻者"

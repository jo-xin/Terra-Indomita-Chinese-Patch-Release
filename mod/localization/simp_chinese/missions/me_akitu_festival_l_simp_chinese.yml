l_simp_chinese:
 akitu_chain_event.1.a:0 "告诉人民，神明显然祝福了我的统治！"
 akitu_chain_event.1.b:0 "这场节日是我献给人民与神明的礼物"
 akitu_chain_event.1.desc:0 "尽管担心节日会失控，但它进行得异常顺利！这场节日将被人们传颂多年！据说马尔杜克与众神对今年的子民极为满意，人们声称其效果立竿见影！"
 akitu_chain_event.1.t:0 "精彩的阿基图节"
 akitu_chain_event.2.a:0 "以伊什塔尔之名……立即斥责那些农民！"
 akitu_chain_event.2.b:0 "哦，不！总之，"
 akitu_chain_event.2.c:0 "提醒他们，马尔杜克期望正确的仪式"
 akitu_chain_event.2.desc:0 "多么恐怖！阿基图节通常以极大的谨慎和严格的仪式进行，但由于这次节日的激烈性质，一群人决定不烧傀儡，而是烧一名祭司！我们仍有时间阻止，但人民可能不会乐意节日被中断。"
 akitu_chain_event.2.t:0 "致命的庆典"
 akitu_chain_event.3.a:0 "也许明年他们会冷静些……"
 akitu_chain_event.3.desc:0 "阿基图节狂野而危险，但无人受伤。人民兴奋地期待来年的下一场阿基图节，尽管看起来一些基础设施受损，必须立即修复。"
 akitu_chain_event.3.t:0 "混乱的节日"
 akitu_chain_event.5.a:0 "愚民，他们自找的……"
 akitu_chain_event.5.b:0 "向神明献祭以求宽恕"
 akitu_chain_event.5.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，阿基图节后，接连发生了前所未有的作物歉收和洪水。人们开始认为原因是节日期间烧死了祭司。他们声称马尔杜克与众神诅咒了国家，并责怪你未阻止这场献祭！"
 akitu_chain_event.5.t:0 "马尔杜克之怒"
 akitu_chain_event.6.a:0 "看吧，根本不可能出问题"
 akitu_chain_event.6.desc:0 "看来担忧是多余的，节日进行得很顺利，终究无需担心"
 akitu_chain_event.6.t:0 "节日顺利进行"
 akitu_event.1.a:0 "让我们确保节日顺利进行"
 akitu_event.1.b:0 "我从不关心这些庆典"
 akitu_event.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我国人民为年度阿基图节耗尽了资金。或许我们可以通过提供金钱和人力赢得民心？"
 akitu_event.1.t:0 "阿基图节资助"
 akitu_event.2.a:0 "能出什么问题呢？"
 akitu_event.2.b:0 "我不会让我们的子民在神明面前表现得像野蛮人"
 akitu_event.2.c:0 "我们应支持他们，让这次阿基图节成为最盛大的！"
 akitu_event.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，年度阿基图节总是带来狂热的庆祝。然而，今年我担心他们准备的庆典可能会有危险。或许我们可以确保事态不失控。"
 akitu_event.2.t:0 "喧闹的节日"
 akitu_event.3.a:0 "……他们还指望比平常更多的东西？"
 akitu_event.3.b:0 "我们将举办一场盛大的节日，让他们百年后仍在传颂！"
 akitu_event.3.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，人民好奇你统治的第一年是否会为阿基图节带来特别的活动。"
 akitu_event.3.t:0 "新统治下的阿基图节"
 akitu_event.4.a:0 "让我们暂时推迟这些节日……"
 akitu_event.4.b:0 "演出必须继续！"
 akitu_event.4.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我国正处于不稳定与动荡之中，在这样的困境时期，可以接受将阿基图节推迟，直到情况更适合举办节日。"
 akitu_event.4.t:0 "推迟阿基图节"
 akitu_introduction.a:0 "多么辉煌的神明庆典！"
 akitu_introduction.b:0 "你是说我要被掌掴？"
 akitu_introduction.desc:0 "阿基图节是历史上最早的新年庆典，持续12天，从春季巴比伦历法第一月尼桑努开始。\n\n前三天举行祈祷和仪式，祈求保护与繁荣。第四、五天是讲故事、唱歌、跳舞和宴会的日子。第五天还因祭司掌掴国王直至其落泪以示对神明的谦卑而著名。第六天有烧傀儡和模拟战斗，展示无神圣秩序下人民的潜在混乱。最后几天聚焦于神圣领域，第七天马尔杜克消失与提亚玛特作战，第八天从其他神明那里获得力量。第十天庆祝马尔杜克的胜利，并通过婚姻仪式确保土地的肥沃。第十一、十二天决定人民是否值得另一个季节循环，以及神明返回神庙。"
 akitu_introduction.t:0 "阿基图节"
 rel_flavor_chaldean.1.a:0 "处死这个异端。"
 rel_flavor_chaldean.1.b:0 "埃布拉，你说……？有趣。"
 rel_flavor_chaldean.1.c:0 "伊普图尔-利姆，告诉我这些神明，你将免于一死。"
 rel_flavor_chaldean.1.desc:0 "在你最近征服叙利亚土地后，对新地区的调查发现了一个引人注目的男子，居住在一个小村庄。他的名字是伊普图尔-利姆，他拒绝纳税，因此将被处死……然而，此人的房屋发现看似古老的文本，决定将他呈献给你。经询问，他声称曾有一个伟大的城市埃布拉，其神明极为强大。或许我们可以赢得这些神明的青睐？"
 rel_flavor_chaldean.1.t:0 "古老神明的记录者"
 rel_flavor_chaldean.2.a:0 "我的好奇心已满足。"
 rel_flavor_chaldean.2.b:0 "死王之神……有趣"
 rel_flavor_chaldean.2.c:0 "库拉将被纳入我们的神系，引领我们找到其他神明。"
 rel_flavor_chaldean.2.desc:0 "在伊普图尔-利姆的帮助下，一段铭文被破译出来，其中提到一位名叫库拉的神祇。祂是赋予埃卜拉城力量的伟大神明。我们还在一座古墓上发现另一段铭文，其中提到一群所谓的死王诸神。或许我们能够辨认这些神祇，并亲自崇拜祂们。"
 rel_flavor_chaldean.2.t:0 "埃布拉之神"
 rel_flavor_chaldean.3.a:0 "我们将建立自己的传奇。"
 rel_flavor_chaldean.3.b:0 "我们将重建这座传奇城市。"
 rel_flavor_chaldean.3.desc:0 "我们确定了一个可能是埃布拉所在地的潜在遗址。虽然这座城市早已消失，我们可以在潜在地点重建这座伟大的城市，占为己有。不过需注意，该遗址可能并非准确。"
 rel_flavor_chaldean.3.t:0 "埃布拉遗址"
 rel_flavor_chaldean.4.a:0 "将埃布拉神系铭刻于石碑！"
 rel_flavor_chaldean.4.desc:0 "在伊普图尔-利姆的努力下，我们翻译了许多铭文，并通过进一步的调查，确定了这些神明的身份。哈达巴尔与贝拉图，阿古与古拉图，雷舍夫与阿达玛，达里巴与伊沙拉。此外，还发现了埃布拉本身的两位神明库拉与巴拉玛。其中一些神明被埃及人、迦南人和美索不达米亚人崇拜，有些无人崇拜，鲜为人知。但仅对我们，我们现已知晓完整的埃布拉神系。"
 rel_flavor_chaldean.4.t:0 "死王之神"
 rel_flavor_chaldean.5.a:0 "我们将寻找这些失落的神明。"
 rel_flavor_chaldean.5.b:0 "复兴古老城市还不够吗？"
 rel_flavor_chaldean.5.desc:0 "随着埃布拉的重生，我们是否应进一步探究这座城市的古老神明？"
 rel_flavor_chaldean.5.t:0 "埃布拉重生"

l_simp_chinese:
 desc_destroyed_qin_as_wei:0 "秦已被魏之军旅击溃驯服，其雄势已被粉碎殆尽。"
 desc_legacy_of_maling:0 "魏之军旅于马陵之战中惨遭败绩，致令我邦威名与权势急剧坠落。"
 desc_longyang_fish_mod:0 "魏君向爱人誓忠，至死不渝。"
 desc_unified_weiis:0 "魏之强权威令卫小君臣服。"
 desc_wei_capital_daliang:0 "大梁，历经营造与修缮之期后，堪称中夏全境至为秀丽之城之一。"
 desc_wei_defensive_mod:0 "魏之诸都城城墙已然延长，城周更添瞭望塔楼。"
 desc_wei_final_mod:0 "魏已摧破一切胆敢阻挡其道者，执政之王朝几近已据有天命。"
 desc_wei_northern_allies:0 "魏之诸领主已与北方诸国缔结盟约，以巩固自身之地位。"
 desc_wei_northern_conquest:0 "魏之领主已颁令，于新近征服之北方诸省招募战士。"
 desc_wei_unified_jin:0 "魏君完成不可能之举；恢复分离已久的晋国。"
 desc_wei_yellow_river_eco:0 "因魏之历代君主沿黄河所建之诸多港口，此区域之经济已蔚为大观。"
 destroyed_qin_as_wei:0 "灭秦"
 legacy_of_maling:0 "马陵之耻"
 longyang_fish_mod:0 "龙阳之宠"
 me_wei_1.a:0 "凡敢离间吾等者，我必诛之"
 me_wei_10.a:0 "谁为汝之敌？吾等如何助汝败之？"
 me_wei_10_desc:0 "今英明之[ROOT.GetCountry.GetRuler.GetName]已为[ROOT.GetCountry.GetName]在北地结得强援，我[ROOT.GetCountry.GetRulerTitle]已在新友中默默探询。似[ROOT.GetCountry.GetRuler.GetFirstName]志在拓土，若有益于魏国之威，[ROOT.GetCountry.GetRuler.GetHerHis]将欣然遣征召兵北渡#E 黄河#!。"
 me_wei_10_title:0 "$wei_missions_task_10$"
 me_wei_11.a:0 "吾等将把秦人逐回其荒芜故地"
 me_wei_11_desc:0 "我东境既安，[GetCountry('QII').GetName]复起之患已平，[ROOT.GetCountry.GetRuler.GetName]终得安下心神，将[ROOT.GetCountry.GetName]之资源倾注于西面之强敌——[GetCountry('QIN').GetName]。\n\n今后之岁月，将充溢着血与悲，匹夫不免于难，然意志不屈之[ROOT.GetCountry.GetRuler.GetFirstName]不可动摇——秦必彻底覆灭。"
 me_wei_11_title:0 "$wei_missions_task_11$"
 me_wei_12.a:0 "我已摧强敌、碎劲旅！"
 me_wei_12_desc:0 "赖[ROOT.GetCountry.GetRuler.GetName]之力，[GetCountry('QIN').GetName]所谓'不败'之师已被逐出[ROOT.GetCountry.GetRuler.GetHerHis]最重要之领土，其都城[GetProvince('(int32)8313').GetName]亦在其中，彼等已狼狈逃回其所来之多尘山丘之中。\n\n虽古语有云，伤狮犹可噬人，然[ROOT.GetCountry.GetRuler.GetName]对其胜利信心十足，宣告#E 秦#!已败。"
 me_wei_12_title:0 "$wei_missions_task_12$"
 me_wei_13.a:0 "我知何为魏之至善——勿再多言"
 me_wei_13_desc:0 "今[ROOT.GetCountry.GetName]之师已深入昔日[GetCountry('ZHA').GetName]之地，[ROOT.GetCountry.GetRulerTitle]已令以征兵补我人力之匮乏。\n\n连年征伐已耗竭我国之力，北境虽因此不受欢迎之令而骚乱四起，然[ROOT.GetCountry.GetRuler.GetName]置[ROOT.GetCountry.GetRuler.GetHerHis]群臣之谏言于不顾。"
 me_wei_13_title:0 "$wei_missions_task_13$"
 me_wei_14.a:0 "战争来去，建筑乃永恒之遗产"
 me_wei_14_desc:0 "外部诸敌既已受挫，[ROOT.GetCountry.GetRuler.GetName]乃将[ROOT.GetCountry.GetRuler.GetHerHis]之目光转向国内。我[ROOT.GetCountry.GetRulerTitle]有意美化[ROOT.GetCountry.GetName]之最佳明证，可见于[GetProvince('(int32)8344').GetName]与[GetProvince('(int32)8446').GetName]，此二城屡受王室厚赐之惠。\n\n赖国家之大举投入，大梁已获'美城'之誉，吸引四方匠师竞相来观此都城之宏伟设计。"
 me_wei_14_title:0 "$wei_missions_task_14$"
 me_wei_15.a:0 "先祖之灵为我之成就而欣慰"
 me_wei_15_desc:0 "当#E 晋#!之地被瓜分，如屠夫持刀切割疆界般被斩为碎片之时，中原之人几无人能想象，竟有人可以将久裂之土再归一统。\n\n然[ROOT.GetCountry.GetRuler.GetName]与[ROOT.GetCountry.GetName]往昔历任之君皆不相同；[ROOT.GetCountry.GetRuler.GetSheHe]不唯已洗雪往昔战败之耻，且此位英勇之[ROOT.GetCountry.GetRulerTitle]更已复晋之旧疆。[ROOT.GetCountry.GetRuler.GetFirstName]之不朽功业，将作为应运而兴之天命者匡正往昔之误的传奇伟绩，载入史册。"
 me_wei_15_title:0 "$wei_missions_task_15$"
 me_wei_16.a:0 "且看谁会现身…吾等正需些振奋"
 me_wei_1600.a:0 "佳音！我热切期待宾客到来"
 me_wei_1600_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，恕臣冒昧叨扰，然臣欲启奏，约一月后将有一批哲人与学士抵达都城。陛下召贤才集于[ROOT.GetCountry.GetCapital.GetName]之令，似未落空。"
 me_wei_1600_title:0 "$wei_missions_task_16$"
 me_wei_1601.a:0 "谢此论谈——引人入胜"
 me_wei_1601_desc:0 "数周已逝，[ROOT.GetCountry.GetRuler.GetName]花费大量时日接待一位来自[GetCountry('QII').GetName]的学士。他们在王室藏书阁中共读卷轴数个时辰，谈论所及，涵盖科学考据与史事探究的广度与深度。[ROOT.GetCountry.GetCapital.GetName]城中已传开我[ROOT.GetCountry.GetRulerTitle]所提问题之深刻精微；有人说，若生于另一种人生，[ROOT.GetCountry.GetRuler.GetFirstName]或许也能凭[ROOT.GetCountry.GetRuler.GetHerHis]自身才具成为一代名儒。"
 me_wei_1601_title:0 "$wei_missions_task_16$"
 me_wei_1602.a:0 "何不早说？"
 me_wei_1602_desc:0 "一日清晨，[ROOT.GetCountry.GetRuler.GetName]意外发现一名发明家立于[ROOT.GetCountry.GetCapital.GetName]城门下，求见[ROOT.GetCountry.GetRulerTitle]。原来此旅人，原为[GetCountry('ZOU').GetName]之民，闻召贤才入都之令而趁此良机。\n\n当守军问此异人可为[GetCountry('WEI').GetName]之民带来何益，彼声言自己为巧匠，可向我国人授一创新之技。"
 me_wei_1602_title:0 "$wei_missions_task_16$"
 me_wei_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]之父[GetCharacter('(int32)538').GetName]，据说是一位豪奢之人——嗜酒、喜乐、好哲理。虽[ROOT.GetCountry.GetRuler.GetFirstName]不认为[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之朝仍为奢靡之地，然[ROOT.GetCountry.GetRuler.GetSheHe]亦承认，往昔艺术家与诗人寓居都城之时，[ROOT.GetCountry.GetCapital.GetName]确实更有趣致。\n\n今[ROOT.GetCountry.GetName]既有余资，[ROOT.GetCountry.GetRulerTitle]遂谕令[ROOT.GetCountry.GetRuler.GetSheHe]需有学士与哲人之佐。"
 me_wei_16_title:0 "$wei_missions_task_16$"
 me_wei_17.a:0 "我名永世不忘…"
 me_wei_17_desc:0 "新皇帝已登基坐于新近宣立之#E 中华帝国#!的宝座上，蛮夷与小国源源不断之贡赋涌入[ROOT.GetCountry.GetCapital.GetName]，即王室权力之所在。\n\n当[ROOT.GetCountry.GetRuler.GetName]初担[GetCountry('WEI').GetName]王国之大任时，国人但求一位明智能引领他们渡过艰难时世之君……然无人料及[ROOT.GetCountry.GetRuler.GetFirstName]竟会成为一统#E 中原#!之人！不仅晋为[ROOT.GetCountry.GetRuler.GetFirstName]之手再造，如今，统御文明世界之最伟大帝国，由[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之手锻造而成。"
 me_wei_17_title:0 "$wei_missions_task_17$"
 me_wei_18.a:0 "研史可启迪心智"
 me_wei_18_desc:0 "[ROOT.GetCountry.GetRuler.GetName]心怀[ROOT.GetCountry.GetRuler.GetHerHis]自身之遗泽，近日敕令于[ROOT.GetCountry.GetCapital.GetName]中纂修一部宏阔史乘。数月之后，我[ROOT.GetCountry.GetRulerTitle]之投入已见成效。\n\n此书命名为#E 竹书纪年#!，涵盖漫长之历史——自#E 黄帝#!之世直至当今。[ROOT.GetCountry.GetName]之民冀望此史能启迪国民，成为培育其道德正道之器。"
 me_wei_18_title:0 "$wei_missions_task_18$"
 me_wei_19.a:0 "此事令我欣慰——谢了"
 me_wei_19_desc:0 "赖[ROOT.GetCountry.GetRuler.GetName]沿#E 黄河#!所建之港埠，该区掌理财政之官吏已向我[ROOT.GetCountry.GetRulerTitle]呈上辉煌之报。\n\n诸项指标皆显积极；岁入赋税俱增，新商路不断开辟，商贾在该区永久定居。何等高妙之决策，[ROOT.GetCountry.GetRuler.GetFirstName]！"
 me_wei_19_title:0 "$wei_missions_task_19$"
 me_wei_1_desc:0 "'我觉已钓到一尾！'\n\n俄顷之后，经与绷紧之钓线一番激烈角力，一尾巨鲇扑通落入船底，[ROOT.GetCountry.GetRuler.GetName]发出凯旋之呐喊。[ROOT.GetCountry.GetRuler.GetFirstName]与其爱人，朝臣#E 君龙阳#!，已悄悄溜出，在河上觅得远离[ROOT.GetCountry.GetCapital.GetName]之宝贵时光。\n\n令[ROOT.GetCountry.GetRuler.GetFirstName]大感意外者，龙阳望见此尾巨鲇在船底翻腾跳跃，非但未与其[ROOT.GetCountry.GetRulerTitle]共庆，反倒大哭起来。\n\n'臣恐有朝一日，陛下将钓得更大更好之鱼，而臣将被弃。或许陛下将遇一位貌美女子，某国君王之妻，便将君龙阳忘怀。'[ROOT.GetCountry.GetRuler.GetFirstName]伸手轻抚龙阳之颊，将其爱人拉近，低语许下诺言。"
 me_wei_1_title:0 "$wei_missions_task_1$"
 me_wei_2.a:0 "彼等豪言可能以行动相匹？"
 me_wei_20.a:0 "我将尽力纠正吾之前路"
 me_wei_20_desc:0 "多年来，[ROOT.GetCountry.GetName]之民一直在默默受苦，此皆[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之过，盖彼等既非土地之善牧，亦为可怖之军帅。\n\n#E 马陵之战#!之灾难性后果，犹如尸臭附于死骸，仍萦绕着王室。举世皆惧，遍及[ROOT.GetCountry.GetCapital.GetName]，若[ROOT.GetCountry.GetRuler.GetName]不能改弦更张，则我辈之日屈指可数——正如昔日之#E 晋#!。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]是否有此能耐，尚待考验——其之父[GetCharacter('(int32)538').GetName]，几乎可断定为无此才具。"
 me_wei_20_title:0 "耻辱之遗"
 me_wei_2_desc:0 "主上，我辈已收到来自[GetCountry('CHU').GetRuler.GetName]之辱辞，彼已得知我辈对其领土之宣称。'尔卒之尸将饲田野之鸦，其血将润来年之禾——准备尔自身去见冥府众神吧！'\n\n看来[GetCountry('CHU').GetRuler.GetFirstName]对我辈之侵入其境并非泰然处之，不过此腐败之王除了哀号抱怨，又能有何作为？"
 me_wei_2_title:0 "$wei_missions_task_2$"
 me_wei_3.a:0 "我热切期待郑地传来佳音"
 me_wei_300.a:0 "接受其提议。"
 me_wei_300.b:0 "拒绝其提议。"
 me_wei_300_desc:0 "主上，[GetCountry('WEI').GetName]王国遣来使节，请求准其兵马借道穿越我境。\n\n如陛下所知，魏之领地分散而不统一，其君主[GetCountry('WEI').GetRuler.GetName]，据说野心勃勃。"
 me_wei_300_title:0 "魏国来请"
 me_wei_301.a:0 "此事闻之甚为恼人…"
 me_wei_301_desc:0 "[GetCountry('HAN').GetName]之王[GetCountry('HAN').GetRuler.GetName]对[ROOT.GetCountry.GetRuler.GetName]之请求予以嘲弄，遣一封无礼之回书至[ROOT.GetCountry.GetCapital.GetName]，令[ROOT.GetCountry.GetRuler.GetFirstName]怒火中烧。\n\n'我辈为何要给你，一个争权之敌，更多通往你领地之通道？与你远隔之省份道别吧，盖彼等将不永久为你所有。'"
 me_wei_301_title:0 "拒绝之言"
 me_wei_302.a:0 "韩人之智，出乎吾意料"
 me_wei_302_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，[GetCountry('HAN').GetName]王国不仅已同意我军借道通行，更主动请求成为[ROOT.GetCountry.GetName]之#E 附庸#!——此结局无人能料。\n\n[GetCountry('HAN').GetRuler.GetName]所遣之信，辞藻华丽，投[ROOT.GetCountry.GetRuler.GetFirstName]之虚荣，以连篇溢美之词包裹[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_wei_302_title:0 "韩人之智"
 me_wei_3_desc:0 "#E 三家分晋#!造就了[ROOT.GetCountry.GetName]之创立，然我之领地从未合为一体，而是分裂为诸多小块公邑——此难题今由[ROOT.GetCountry.GetRuler.GetName]所解。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]希望[GetCountry('HAN').GetRuler.GetName]之民能接纳我[ROOT.GetCountry.GetRulerTitle]所提之策——韩可否开边境，准我兵通行？"
 me_wei_3_title:0 "$wei_missions_task_3$"
 me_wei_4.a:0 "魏民之成就何其壮哉！"
 me_wei_4_desc:0 "虽此为至艰之任务——无疑乃[ROOT.GetCountry.GetRuler.GetName]所成最难之事——我[ROOT.GetCountry.GetRulerTitle]已于列国间有所建树，足使邻邦淡忘#E 马陵之战#!及其对我国运之影响。\n\n赖[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之声望与威势日增，[ROOT.GetCountry.GetCapital]之民唯颂我[ROOT.GetCountry.GetRulerTitle]——[ROOT.GetCountry.GetRuler.GetHerHis]先祖之缺陷已尽被遗忘。"
 me_wei_4_title:0 "$wei_missions_task_4$"
 me_wei_5.a:0 "迈向更宏大之业！"
 me_wei_5_desc:0 "前线传来佳音——[GetProvince('(int32)8435').GetName]已确实归我掌握，终结了该城妄想独立于[ROOT.GetCountry.GetName]之外之耻辱篇章。\n\n今我戍卒巡弋此城街巷，迎来濮阳之民从未经历之和平与繁荣时代，[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏之威望与声名日增。"
 me_wei_5_title:0 "$wei_missions_task_5$"
 me_wei_6.a:0 "我犹未开战！"
 me_wei_6_desc:0 "[ROOT.GetCountry.GetRuler.GetName]所赢得之前所未有之连胜仍在继续，[GetCountry('SNG').GetName]之统治者终被推翻，被迫臣服于[ROOT.GetCountry.GetName]。其丰饶之农田与广阔平原，今皆归[ROOT.GetCountry.GetRuler.GetFirstName]所有，[ROOT.GetCountry.GetRuler.GetHerHis]在境内行至高无上之威权。\n\n魏之疆域徐而稳固地扩张巩固——此乃吉兆，预示佳运将至。"
 me_wei_6_title:0 "$wei_missions_task_6$"
 me_wei_7.a:0 "西土于我重于性命！"
 me_wei_7_desc:0 "近数月来，[ROOT.GetCountry.GetRuler.GetName]已在静静地为我王国备战西方之冲突。此非易事，使我之兵卒与庶民为此艰巨之前路做准备，然[ROOT.GetCountry.GetRuler.GetFirstName]誓称，除非[ROOT.GetCountry.GetName]能收复我西部故土，否则[ROOT.GetCountry.GetRuler.GetSheHe]将不饮不食、不寝不寐。"
 me_wei_7_title:0 "$wei_missions_task_7$"
 me_wei_8.a:0 "总而言之，此事于我大有裨益，故我甚慰"
 me_wei_8_desc:0 "无私之[ROOT.GetCountry.GetRuler.GetName]已被说服，将[GetCountry('HAN').GetName]王国纳入[ROOT.GetCountry.GetName]之光辉疆域之内。虽韩之下民不能与魏国公民相比，然我[ROOT.GetCountry.GetRulerTitle]期望，日久天长，彼等将效仿我辈可敬之作风。"
 me_wei_8_title:0 "$wei_missions_task_8$"
 me_wei_9.a:0 "攻魏者必愚——尔莫非愚人？"
 me_wei_9_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]下令扩建[GetProvince('(int32)8344').GetName]与[GetProvince('(int32)8446').GetName]之防御工事，#E 魏#!全国为之一振。\n\n经多月的昂贵修缮与升级，我工匠与匠师之辛劳终于告竣，精疲力竭之工人怀揣银袋、腹饱米饭归乡，心满意足于己已逾我[ROOT.GetCountry.GetRulerTitle]之所望。我重新设计之城垣之佳音迅传四方，[ROOT.GetCountry.GetRuler.GetFirstName]望我敌亦在聆听。"
 me_wei_9_title:0 "$wei_missions_task_9$"
 unified_weiis:0 "卫之臣服"
 wei_bamboo_annals:0 "竹书纪年"
 wei_bamboo_annals_desc:0 "《竹书纪年》乃一部令人叹服之史籍，涵盖中夏漫长之年代，由魏之诸主敕令编纂。"
 wei_capital_daliang:0 "锦绣之城"
 wei_defensive_mod:0 "魏之坚城"
 wei_final_mod:0 "魏朝"
 wei_missions:0 "新魏向前"
 wei_missions_BUTTON_TOOLTIP:0 "前路险峻，然我等别无他途……"
 wei_missions_CRITERIA_DESCRIPTION:0 "此使命将于[ROOT.GetCountry.GetName]恢复昔日之疆土与威望、纠正往昔之罪愆时完成。"
 wei_missions_DESCRIPTION:0 "我王国自#E 三家分晋#!而生，自彼关键之时起，便步步受制于人。虽我初生之国幸得#E 文侯#!与#E 武侯#!两位雄主开创基业，然近年以来，每逢[ROOT.GetCountry.GetRuler.GetName]掷骨决断，魏国总是功亏一篑。\n\n自近四十年前那场灾难性之#E 马陵之战#!以来，我之扩张便处处受阻；而昔日被我嗤为荒土之国之[GetCountry('QIN').GetName]，已然崛起称雄。若欲于来日幸存，必当另辟新路。"
 wei_missions_task_1:0 "龙阳与鱼"
 wei_missions_task_10:0 "北方盟友"
 wei_missions_task_10_DESC:0 "虽[ROOT.GetCountry.GetCapital.GetName]城中有人声称北方乃蛮夷与马背酋长之领地，然[ROOT.GetCountry.GetRuler.GetName]深信[ROOT.GetCountry.GetName]或可于此地域结纳可贵之盟邦。\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 wei_missions_task_10_any_ally_in_you_region:0 "我们有一位来自幽州地区的盟友。"
 wei_missions_task_10_claims_tt:0 "吾等将获得对#Y 邯郸#!、#Y 太原#!、#Y 上党#!及#Y 河内#!诸地之宣称。"
 wei_missions_task_11:0 "推开齐国"
 wei_missions_task_11_DESC:0 "[GetCountry('QII').GetName]近来已成烦扰之患，彼等既图扩张地域掌控，便可满心期待遭遇魏国之师阻其去路——我辈必将此辈愚人推倒在地，迫其向[ROOT.GetCountry.GetRuler.GetName]之声威屈膝！\n\n\n\n\n\n\n\n\n\n@east_steppemil5!"
 wei_missions_task_11_claims_tt:0 "我们将获得#Y 秦#!所有省份的宣称。"
 wei_missions_task_12:0 "摧毁秦国"
 wei_missions_task_12_DESC:0 "终焉，[ROOT.GetCountry.GetRuler.GetName]觉我师已备，足以与[GetCountry('QIN').GetName]之军一决雌雄。[GetCountry('QIN').GetRuler.GetName]之骄兵悍将，欲吞并四邻，然彼等已无意间引发自身之覆灭！\n\n\n\n\n\n\n\n\n\n@east_steppemil10!"
 wei_missions_task_13:0 "向北推进"
 wei_missions_task_13_DESC:0 "敌之懦师望风披靡，弃甲抛戈，仓皇逃遁于疆场。奋进，魏之将士！时已至，当更向北上推进！\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 wei_missions_task_13_every_bing_and_ji_province_gets:0 "并州和冀州地区的每个省份都将获得："
 wei_missions_task_14:0 "大梁与安邑"
 wei_missions_task_14_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]决意以宏大营建之策美化[GetProvince('(int32)8344').GetName]与[GetProvince('(int32)8446').GetName]二城，此策誓将为吾民带来安乐，并增益我两都之魅力。[GetProvince('(int32)8446').GetName]将为此番经营之重点，然非谓[GetProvince('(int32)8344').GetName]便无所得报。\n\n\n\n\n\n\n\n\n\n@china_mil13!"
 wei_missions_task_15:0 "三晋"
 wei_missions_task_15_DESC:0 "消息传遍中夏全境，其疾逾于闪电，闻者之震惊亦不下于雷击：#T 晋#!已由[ROOT.GetCountry.GetName]光复！昔日之宿债，已由[ROOT.GetCountry.GetRuler.GetName]以铁腕清偿。\n\n\n\n\n\n\n\n\n\n@tibet_mil2!"
 wei_missions_task_16:0 "惠王之奢"
 wei_missions_task_16_DESC:0 "锁于箱箧之中、由力士护守之金银，其用何在？我辈当启府库，将资财用于此生之要务——音律、诗词与艺术！\n\n\n\n\n\n\n\n\n\n@tibet_mil9!"
 wei_missions_task_16_scholars_philosophers_might_join:0 "学者和哲学家可能加入我们的朝廷。"
 wei_missions_task_17:0 "魏朝"
 wei_missions_task_17_DESC:0 "我全胜之刻终在眼前——凡能挑战我权威者已尽毁灭，崭新之#E 华夏帝国#!无与争锋！[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]氏宗室万岁！\n\n\n\n\n\n\n\n\n\n@china_mil15!"
 wei_missions_task_18:0 "竹书纪年"
 wei_missions_task_18_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]已敕纂中夏之鸿篇通史，自辉煌之#T 黄帝#!临朝，迄我当朝[ROOT.GetCountry.GetRulerTitle]之御宇。\n\n\n\n\n\n\n\n\n\n@tibet_mil1!"
 wei_missions_task_19:0 "黄河港口"
 wei_missions_task_19_DESC:0 "不仅须征服敌手之土，且一旦受命管辖落入我手之城邑聚落，便当兴建地方基业。盖徒有广土而无所作为以改善民生，其用何在？我辈当沿黄河上下广筑港埠，因其河畔蕴藏无尽之财富。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 wei_missions_task_19_three_yellow_river_ports:0 "我们在#T 黄河#!上游至少拥有三座港口。"
 wei_missions_task_1_DESC:0 "当[ROOT.GetCountry.GetRuler.GetName]与其伴侣#E 龙阳君#!出渔之际，其爱人于捕获一尾巨鱼后，不禁泫然泪下。\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 wei_missions_task_2:0 "遏制楚国"
 wei_missions_task_2_DESC:0 "多年以前，[GetCountry('CHU').GetName]之师称霸疆场——诚乃不可轻犯之敌。然多年之治理失当，已使此南境邦国衰弱不堪，而贪腐已成我邻邦之生存之道。今[ROOT.GetCountry.GetName]正成长为不可小觑之势力，遏制楚国之机已至。\n\n\n\n\n\n\n\n\n\n@china_mil5!"
 wei_missions_task_2_claims_tt:0 "吾等将获得对#Y 大梁#!、#Y 济阴#!、#Y 山阳#!、#Y 淮阳#!、#Y 沛#!及#Y 彭#!诸地之宣称。"
 wei_missions_task_3:0 "通达北境"
 wei_missions_task_3_DESC:0 "[GetCountry('HAN').GetName]之民与我辈同受#E 三家分晋#!之害——眼看昔日之势力与威望如晨雾般消散，诚乃难咽之苦药。[ROOT.GetCountry.GetCapital.GetName]城中已有议者，谓若能通达韩国，或可劝其与我携手共进。\n\n\n\n\n\n\n\n\n\n@china_mil12!"
 wei_missions_task_3_claims_tt:0 "我们将获得对#Y 弘农#!、#Y 栎阳#!、#Y 西河#!和#Y 商#!地区的宣称。"
 wei_missions_task_3_offer_han_feudatory:0 "我们将提议韩国成为我们的藩属。"
 wei_missions_task_4:0 "马陵之复"
 wei_missions_task_4_DESC:0 "虽#Y 马陵之战#!之余波，重挫我战士之士气，然[ROOT.GetCountry.GetRuler.GetName]业已成功克服此段黑暗历史之后患。\n\n\n\n\n\n\n\n\n\n@china_mil7!"
 wei_missions_task_5:0 "处理卫"
 wei_missions_task_5_DESC:0 "[GetProvince('(int32)8435').GetName]未尝受[ROOT.GetCountry.GetRuler.GetName]统御之事，实属一大谜团，促使我不屈之[ROOT.GetCountry.GetRulerTitle]制定对付[GetCountry('WII').GetName]之正式作战方略。\n\n\n\n\n\n\n\n\n\n@china_mil6!"
 wei_missions_task_6:0 "夺取宋国"
 wei_missions_task_6_DESC:0 "邻邦[GetCountry('SNG').GetName]正显露蓄势之迹，若不加以遏制，或将成为此地域中一强大之敌。时机已至，[ROOT.GetCountry.GetRuler.GetName]主张，当拔宋于根，将其自土中除尽。\n\n\n\n\n\n\n\n\n\n@china_mil10!"
 wei_missions_task_6_claims_tt:0 "我们将获得对#Y 东#!、#Y 卫#!和#Y 泰山#!地区的宣称。"
 wei_missions_task_7:0 "收复西魏"
 wei_missions_task_7_DESC:0 "虽为我西境宣称而战势必血光滔天，然无物可阻[ROOT.GetCountry.GetRuler.GetName]拼复被夺自我先祖之疆土。准备魏之征召兵，投入战阵！\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 wei_missions_task_7_claims_tt:0 "吾等将获得对#Y 咸阳#!、#Y 栎阳#!、#Y 长安#!、#Y 天水#!及#Y 武都#!诸地之宣称。"
 wei_missions_task_8:0 "「援」韩"
 wei_missions_task_8_DESC:0 "[GetCountry('HAN').GetName]之民既日与我族众亲近，[ROOT.GetCountry.GetRuler.GetName]遂坚执当尽[ROOT.GetCountry.GetRuler.GetSheHe]之所能，以「襄助」我两国合为一体。\n\n\n\n\n\n\n\n\n\n@china_mil9!"
 wei_missions_task_9:0 "巩固都城"
 wei_missions_task_9_DESC:0 "我之两座传统都城，即[GetProvince('(int32)8344').GetName]与[GetProvince('(int32)8446').GetName]，任一皆为敌手垂涎之厚赏——此情状[ROOT.GetCountry.GetRuler.GetName]已誓绝不容发生。时已至，当加固我城垣！\n\n\n\n\n\n\n\n\n\n@china_mil14!"
 wei_northern_allies:0 "北方盟友"
 wei_northern_conquest:0 "北境征募"
 wei_unified_jin:0 "晋之恢复者"
 wei_yellow_river_eco:0 "黄河沿岸贸易繁荣"

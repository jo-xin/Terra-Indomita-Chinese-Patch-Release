l_simp_chinese:
 AU_LAC_ADJECTIVE:0 "瓯雒"
 AU_LAC_FORMABLE:0 "瓯雒"
 au_lac_formation:0 "瓯雒建国"
 bloodline_thuc_phan:0 "蜀泮之血"
 bloodline_thuc_phan_desc:0 "蜀泮乃一位精力充沛之年轻统治者，胸怀改革之志，志在为其子民带来安定。他为国中带来诸多变易，为新兴之越文明奠定了根基。"
 co_lao_citadel:0 "古螺城"
 desc_au_lac_formation:0 "瓯雒王国之声誉引来众多部族之民，彼等热切拥抱其优越之文化风尚。"
 desc_co_lao_citadel:0 "古螺城呈广阔矩形而建，城壕森严，壁垒巍峨，足令来犯之师望而却步。"
 desc_thuc_phan_military_mod:0 "我邦亲族与南方雒越部落之间存在之战事状态，增大了对人力之需求。"
 desc_thuc_phan_rice:0 "林琛稻田于我国之重要性不可言过。"
 kim_quy_turtle:0 "金龟爪"
 kim_quy_turtle_desc:0 "一只金爪，由龟神金龟赐予该国，作为其眷顾之象征。"
 me_thuc_phan_1.a:0 "#E 临尘#!之田将以稻米填满无数腹囊"
 me_thuc_phan_10.a:0 "此威胁已可视为平息…"
 me_thuc_phan_10_desc:0 "隔断我境与#E 中国#!诸王国强大势力之间的北方丛林与荒原，乃遍布凶悍#E 越#!部落之地。此等越人恶名昭彰，素好征战，易于为其贪婪所动而起兵侵邻——此乃亘古以来人所共知之常态，然此局面今不复存。\n\n[ROOT.GetCountry.GetRuler.GetName]已将此等蛮族置于我轭下，拓我腹地至前所未有之境。赖我[ROOT.GetCountry.GetRulerTitle]之武功，我等将不复忧惧越人散兵乘夜袭扰我聚落。"
 me_thuc_phan_10_title:0 "北方之患"
 me_thuc_phan_11.a:0 "凡敢犯我者，我必毫不犹豫尽灭之"
 me_thuc_phan_11_desc:0 "既已为我据有南岸之地，英明之[ROOT.GetCountry.GetRuler.GetName]所颁首批敕令之一，即命于所夺港口中建造水师。此无法无天之地曾为海盗之玩物，尤以据[GetProvince('(int32)9208').GetName]之贼寇为甚；然今有强大之[ROOT.GetCountry.GetAdjective]舰队巡弋海岸，我等冀可遏制彼等海盗之毁灭性劫掠，纵不能全然禁绝。"
 me_thuc_phan_11_title:0 "南方海岸"
 me_thuc_phan_12.a:0 "愿民之间再无隔阂之分！"
 me_thuc_phan_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]于那个命中注定之清晨所颁之敕令，注定将永远改变[ROOT.GetCountry.GetName]之轨迹。我辈不复被视为同一屋檐下之两个族群，[ROOT.GetCountry.GetRuler.GetFirstName]宣谕，[ROOT.GetCountry.GetName]王国将成为一个统一民族之家园。\n\n万民齐颂[ROOT.GetCountry.GetName]之兴起，由我[ROOT.GetCountry.GetRulerTitle]以铁腕与意志锻造而成！"
 me_thuc_phan_12_title:0 "两大族群"
 me_thuc_phan_1_desc:0 "当[ROOT.GetCountry.GetRuler.GetName]得知[GetProvince('(int32)9178').GetName]省全境之稻田已修筑告竣，一丝宽慰之色掠过[ROOT.GetCountry.GetRuler.GetHerHis]面庞。\n\n饥馑素为万民之敌，彼等常陷于大军肆虐间，尚须维持战时农事。然赖[ROOT.GetCountry.GetRuler.GetFirstName]之力，此等忧惧暂且得消。"
 me_thuc_phan_1_title:0 "稻田"
 me_thuc_phan_2.a:0 "我所为之一切，皆为民生之善"
 me_thuc_phan_2_desc:0 "常言道，物以类聚，善事相随，故[ROOT.GetCountry.GetName]府库充盈之余，亦为[ROOT.GetCountry.GetRuler.GetName]带来些许政治资本，而雄心勃勃之[ROOT.GetCountry.GetRulerTitle]乐得善用此资。"
 me_thuc_phan_2_title:0 "充实府库"
 me_thuc_phan_3.a:0 "蛮人永不能破此城墙！"
 me_thuc_phan_3_desc:0 "赖[ROOT.GetCountry.GetRuler.GetName]麾下之众竭诚于南方修筑堡垒，我辈已臻前所未有之战备状态——[ROOT.GetCountry.GetRuler.GetFirstName]深以为慰，盖[ROOT.GetCountry.GetRuler.GetSheHe]觉己正将[ROOT.GetCountry.GetRuler.GetHerHis]之遗泽铭刻于国中各处。"
 me_thuc_phan_3_title:0 "抵御匈奴"
 me_thuc_phan_4.a:0 "愿诸神予你以胜于对我之引导，[SCOPE.sCharacter('thuc_phan_char').GetFirstName]。"
 me_thuc_phan_4_desc:0 "虽众人皆以为[SCOPE.sCharacter('thuc_phan_char').GetName]之父#E 蜀制#!既殁，将使其孤弱而无力——然众皆错判此少年。彼以与年岁不相称之机敏，已游刃有余于[ROOT.GetCountry.GetCapital.GetName]之朝堂。\n\n然其最大之成就，亦为对[ROOT.GetCountry.GetRuler.GetName]之致命一击——乃私下赢得曾效忠于其父之诸领主誓约；一俟跨过那道决定命运之桥，部族之实权便于那一刻转入[SCOPE.sCharacter('thuc_phan_char').GetFirstName]之手。\n\n当此无畏少年宣告彼今将为[ROOT.GetCountry.GetRulerTitle]时，再无一人立于[ROOT.GetCountry.GetRuler.GetFirstName]之侧，[ROOT.GetCountry.GetRuler.GetFirstName]旋即悟得大势已去。"
 me_thuc_phan_4_title:0 "蜀泮崛起"
 me_thuc_phan_5.a:0 "挡我者皆将同此下场！"
 me_thuc_phan_5_desc:0 "在一场无情之展示中，[ROOT.GetCountry.GetRuler.GetName]已粉碎北方诸部族，降伏彼等野犬。悍勇之北人战如恶魔，欲逐[ROOT.GetCountry.GetAdjective]征召兵于其散落之聚落外，然纵尽其力，彼等终被击溃至一人不剩，今已向[ROOT.GetCountry.GetCapital.GetName]纳贡称臣。\n\n乘此大捷之势，[ROOT.GetCountry.GetRuler.GetFirstName]悍然誓言，凡敢觊觎我领土者，定当尽除之。"
 me_thuc_phan_5_title:0 "统一北方诸部"
 me_thuc_phan_6.a:0 "不抵#E 红河#!决不罢休…"
 me_thuc_phan_6_desc:0 "[ROOT.GetCountry.GetName]与[GetCountry('LCV').GetName]之军已兵戎相见，双方皆向[ROOT.GetCountry.Custom('get_war_god')]立誓，待战事终了，必于庙堂行祭。\n\n两国皆抱殊死之志，誓见对方覆亡……胜者唯有一方，[ROOT.GetCountry.GetRuler.GetName]立誓胜者必为[ROOT.GetCountry.GetRuler.GetHerHim]。"
 me_thuc_phan_6_title:0 "南下"
 me_thuc_phan_7.a:0 "[ROOT.GetCountry.GetName]诸部之日何其幸运！"
 me_thuc_phan_7_desc:0 "[GetCountry('LCV').GetName]之力已永久溃散，[ROOT.GetCountry.GetName]得胜之师今已全占昔日懦弱之雒越酋长所据诸省，彼等或囚或戮，或贬入耻辱之流放。\n\n所获最重之奖，乃港口城市[GetProvince('(int32)9188').GetName]，而[ROOT.GetCountry.GetRuler.GetName]亲率大军驰入此昔日文郎之都。"
 me_thuc_phan_7_title:0 "征服河内"
 me_thuc_phan_8.a:0 "我誓不负今日尔等所托之信任"
 me_thuc_phan_8_desc:0 "近数年来，我邦跨出巨大步伐——我辈不唯于沙场上建起配享王号之王国，[ROOT.GetCountry.GetRuler.GetName]致力于改善庶民生活之努力，亦使[ROOT.GetCountry.GetName]成为不可轻忽之力量。\n\n在[ROOT.GetCountry.GetRuler.GetFirstName]之运筹下，我集权日固，[ROOT.GetCountry.GetRuler.GetFirstName]几乎是独力将我辈带至此刻，众人咸谓我辈当建君主之制——[ROOT.GetCountry.GetRuler.GetFirstName]当之无愧。"
 me_thuc_phan_8_title:0 "崭新王国"
 me_thuc_phan_9.a:0 "古螺城将屹立至世界尽头！"
 me_thuc_phan_900.a:0 "我已迫不及待欲观成果！"
 me_thuc_phan_900_desc:0 "近来，[ROOT.GetCountry.GetRuler.GetName]常驻[GetProvince('(int32)9188').GetName]，已将[ROOT.GetCountry.GetRuler.GetHerHis]属下大部迁至昔日雒越权贵所居之宫室。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]心中一直盘算着，在城中央建一座巍峨城堡，既可护卫我[ROOT.GetCountry.GetAdjective]之利益，又可向四方宣示我权威。待所需资财筹足，特聘之匠师被召至羸娄，营建遂全力展开。"
 me_thuc_phan_900_title:0 "营建堡垒"
 me_thuc_phan_901.a:0 "难以置信…神明亲来观我所成"
 me_thuc_phan_901_desc:0 "今日[GetProvince('(int32)9188').GetName]发生神迹之事；当工匠们继续开挖拟建城堡之地基时，#E 红河#!之水忽然翻腾激荡。俄顷之间，一只金色巨龟，甲壳映日生辉，游至岸边，而后缓缓爬上松软之河岸，聚观之民喃喃低语。其口衔一金色巨爪，将之掷于地后，便转身向河而去。\n\n待[ROOT.GetCountry.GetRuler.GetFirstName]亲往查探，神龟已杳无踪迹，然当地之民坚称此龟乃#E 金龟#!之化身，以其无价之赠，祝福此城堡之营建。"
 me_thuc_phan_901_title:0 "金龟之赐"
 me_thuc_phan_902.a:0 "若能兑现承诺，此事便定"
 me_thuc_phan_902_desc:0 "随着龟神#E 金龟#!赐我国民金爪之事传遍[ROOT.GetCountry.GetName]各地，一位名为[SCOPE.sCharacter('cao_lo_char').GetName]的将军来到了[GetProvince('(int32)9188').GetName]，欲查明此事之真伪。\n\n当[SCOPE.sCharacter('cao_lo_char').GetFirstName]确信此事非虚之后，便求见[ROOT.GetCountry.GetRuler.GetFirstName]，遣人呈上如下之言。\n\n'恭贺凯旋之[ROOT.GetCountry.GetRulerTitle]，不朽之[ROOT.GetCountry.GetName]之主——阁下常胜不败之威名，加之以公允正义之风，已驰传海内。请允臣献微末之力；若陛下恩准臣研视那只赐予国民之金爪，臣信可解析其构造之秘，为[ROOT.GetCountry.GetAdjective]之师锻造一件神兵利器。'"
 me_thuc_phan_902_title:0 "古螺降临"
 me_thuc_phan_9_desc:0 "[ROOT.GetCountry.GetRuler.GetName]所敕建之宏伟城堡终于落成，虽有些当地人以戏谑口吻评说此堡垒之形似蜗牛壳，[ROOT.GetCountry.GetRulerTitle]闻之不过一笑置之[ROOT.GetCountry.GetRuler.GetSheHe]。"
 me_thuc_phan_9_title:0 "古螺城"
 thuc_phan_military_mod:0 "蜀泮之征途"
 thuc_phan_missions:0 "蜀泮崛起"
 thuc_phan_missions_BUTTON_TOOLTIP:0 "我们须亲手开创我们想要的未来……"
 thuc_phan_missions_CRITERIA_DESCRIPTION:0 "此使命将于蜀泮引领[ROOT.GetCountry.GetName]之光荣子民走向天命——征服邻近之敌、建立经得起岁月考验之新王国之时完成。"
 thuc_phan_missions_DESCRIPTION:0 "于桂人统御之地，一失怙之王位继承人已届成年。虽朝中多有反对此年轻#E 蜀泮#!夺取其天赋之权者，然区区宫廷之阻，远不足止其夺取理应归己之物。"
 thuc_phan_missions_task_1:0 "稻田"
 thuc_phan_missions_task_10:0 "北方之威胁"
 thuc_phan_missions_task_10_DESC:0 "[ROOT.GetCountry.GetCapital.GetName]城中，有怯懦之徒声称我辈受北方蛮族部落之威胁，然雄强之[ROOT.GetCountry.GetName]必将摧毁任何胆敢挑战我权威者！\n\n\n\n\n\n\n\n\n\n@china_mil1!"
 thuc_phan_missions_task_11:0 "南溟之滨"
 thuc_phan_missions_task_11_DESC:0 "不仅须为[ROOT.GetCountry.GetName]夺取沿#E 南海#!之南部海岸，且须开发此区，抚育其民。此地必有一港，将成为巡海舰队之居所，护其免遭海盗之患。\n\n\n\n\n\n\n\n\n\n@india_mil1!"
 thuc_phan_missions_task_12:0 "二民"
 thuc_phan_missions_task_12_DESC:0 "虽昔日我等曾兵戎相见，互流血汗、蹂躏彼此之地，然我辈不可长居分裂之局，而必当拥抱兄弟之情——盖二族归一，实乃我之天命。\n\n\n\n\n\n\n\n\n\n@china_mil11!"
 thuc_phan_missions_task_1_DESC:0 "我民需稻米，而[ROOT.GetCountry.GetRuler.GetName]已示下，[ROOT.GetCountry.GetRuler.GetSheHe]将不遗余力，为[ROOT.GetCountry.GetName]之百姓确保粮食之安。\n\n\n\n\n\n\n\n\n\n@celt_mil14!"
 thuc_phan_missions_task_2:0 "充盈国库"
 thuc_phan_missions_task_2_DESC:0 "邦国可遭诸多灾厄，故我[ROOT.GetCountry.GetRulerTitle]宜于府库中积蓄资财，以备不测之祸。\n\n\n\n\n\n\n\n\n\n@egypt_mil19!"
 thuc_phan_missions_task_3:0 "御雄王"
 thuc_phan_missions_task_3_DESC:0 "我辈得天幸，有天然险阻拱卫南境，然尚有可为之事，以确保西境蛮夷#E 鸿#!族远离我之城邑与农田。\n\n\n\n\n\n\n\n\n\n@east_steppemil7!"
 thuc_phan_missions_task_4:0 "蜀泮崛起"
 thuc_phan_missions_task_4_DESC:0 "#E 蜀泮#!之声望已无可否认，万民喧嚷求其成为[ROOT.GetCountry.GetName]之[ROOT.GetCountry.GetRulerTitle]——此令[ROOT.GetCountry.GetRuler.GetName]大为懊恼。\n\n\n\n\n\n\n\n\n\n@tibet_mil6!"
 thuc_phan_missions_task_4_claims:0 "我们将获得对#Y 郁林#!、#Y 兴古#!和#Y 交阯#!地区的宣称。"
 thuc_phan_missions_task_4_thuc_phan_becomes_ruler:0 "蜀泮成为我国统治者。"
 thuc_phan_missions_task_5:0 "统一北境诸部"
 thuc_phan_missions_task_5_DESC:0 "自有记忆以来，骁悍之北方诸部首次被征服，统归一面旗帜之下——此举令轻视[ROOT.GetCountry.GetName]日益壮大之势之文明柔弱诸邦大为震骇。\n\n\n\n\n\n\n\n\n\n@east_steppemil6!"
 thuc_phan_missions_task_6:0 "南向进军"
 thuc_phan_missions_task_6_DESC:0 "居于城邑之[GetCountry('LCV').GetName]及其可怜之诸酋长，向来以为彼等雒越文明超胜于我辈桂人之道。时机已至，且观其能否抵挡我之意图——盖我志在挥师南下，携战利之货凯旋而归。\n\n\n\n\n\n\n\n\n\n@east_steppemil9!"
 thuc_phan_missions_task_6_at_war_with_hung:0 "与文郎的雄王交战。"
 thuc_phan_missions_task_6_claims:0 "我们将获得对#Y 红河#!和#Y 九真#!地区的宣称。"
 thuc_phan_missions_task_7:0 "征服河内"
 thuc_phan_missions_task_7_DESC:0 "我凯旋之师已征服广阔领土，使我成为雄强之国——诸神与引领我们至此历史关头之[ROOT.GetCountry.GetRuler.GetName]同在！\n\n\n\n\n\n\n\n\n\n@china_mil4!"
 thuc_phan_missions_task_8:0 "新王国"
 thuc_phan_missions_task_8_DESC:0 "近来我辈壮大之速如此惊人，已有议者建言，当革新政制以配我所成之伟业。我非部落，非酋长所统，而乃需一君王之王国。\n\n\n\n\n\n\n\n\n\n@china_mil8!"
 thuc_phan_missions_task_8_claims:0 "吾等将获得对#Y 合浦#!、#Y 苍梧#!、#Y 南海#!、#Y 珠崖#!及#Y 日南#!诸地之宣称。"
 thuc_phan_missions_task_9:0 "古螺城"
 thuc_phan_missions_task_9_DESC:0 "我国疆界既已至可敬之境，[ROOT.GetCountry.GetRuler.GetName]遂可转而关注内政，而修筑坚不可摧之城塞之念，实难动摇。\n\n\n\n\n\n\n\n\n\n@tibet_mil12![ROOT.GetCountry.GetRuler.GetHerHis]。"
 thuc_phan_rice:0 "水稻种植"

 kosala_expansion_desc:0 "我们知道#T 恒河流域#!的人民。曾经是我们久远过去的死敌，然后成为历史讽刺与复仇形式下的我们的#Y 仆从国#!，现在则是我们忠诚的#Y 封邑#!。"

 me_nabhapakti.130.a:0 "我们将修复他们的寺庙。"
 me_nabhapakti.130.b:0 "对他们来说真可惜。"
 me_nabhapakti.130_desc:0 "尊敬的[ROOT.GetCountry.GetRulerTitle]，我们收到了不幸的消息——一座我们最重要的寺庙，几代信徒都敬仰的地方，现已严重损坏。据说天花板的大块石块已经掉落，当地建筑师认为建筑面临随时倒塌的危险。"
 me_nabhapakti.130_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti.131.a:0 "我们将允许这些地方信仰共存。"
 me_nabhapakti.131.b:0 "不！佛陀的教义是绝对的！"
 me_nabhapakti.131.c:0 "派遣一位骠族隐士，用他们更容易理解的理念来说服苯教徒。"
 me_nabhapakti.131_desc:0 "尽管做了任何努力，但居住在西藏地区的山民拒绝放弃他们的苯教信仰，声称祖先的信仰才是真正的道路。他们通常对外来者很宽容，将闻名遐迩的热情好客延伸到所有访问这片不毛之地的人，但在宗教转换方面他们显得非常顽固。"
 me_nabhapakti.131_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti.132.a:0 "让我们向他们展示佛陀的力量！"
 me_nabhapakti.132.b:0 "浪费我们在山区的兵力？哈哈，不。"
 me_nabhapakti.132_desc:0 "我们收到盟友的紧急请求，这让他们更加尴尬——似乎他们手上有一场农村叛乱正在失控。目前的报告不一——有些人说是一支不满的奴隶军队，而另一些人则认为问题是由于对上层阶级不满的农民引起的。\n\n他们恳求我们尽一切可能帮助他们，因为存在合理的担忧，认为他们的首都可能会在暴动面前沦陷。"
 me_nabhapakti.132_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti.133.a:0 "那些山里的无赖……"
 me_nabhapakti.133_desc:0 "尊敬的[ROOT.GetCountry.GetRulerTitle]，今天我有一个令人失望的消息——虽然我们的传教僧侣尽力了，花费数小时向人们布道并回答当地智者和苦行者的教义问题，但我们无法说服西藏的苯教徒相信佛教是存在的谜题的正确答案。"
 me_nabhapakti.133_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti.134.a:0 "啊，苯教徒是我们山中的兄弟。"
 me_nabhapakti.134_desc:0 "我们的使者成功地将佛陀的教诲传授给了西藏人民，增强了人民对[ROOT.GetCountry.GetRuler.GetName]行动的支持。这一显著的成功甚至可能在未来帮助我们在孟加拉进行远征——或许我们应该考虑这个地区的长期计划。"
 me_nabhapakti.134_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti.140.a:0 "我们将向他们展示为什么佛教是最好的。"
 me_nabhapakti.140.b:0 "我们将寄希望于我们的隐士能说服他们。"
 me_nabhapakti.140_desc:0 "如果我们的土地[ROOT.GetCountry.GetName]可以比作一个小花园，那么这里有三种植物在互相争夺水和阳光，它们的根和叶子相互缠绕。没有人能预知未来，所以只有时间会告诉我们哪一个能在[ROOT.GetCountry.GetAdjective]人民心中占据主导地位——苯教的教义、纳特神灵的强大威力，还是佛陀打破轮回的教诲？"
 me_nabhapakti.140_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti.141.a:0 "没有距离能阻挡佛陀。"
 me_nabhapakti.141.b:0 "无需再为此远征花费更多。"
 me_nabhapakti.141.c:0 "使用孟加拉港口以方便旅行。"
 me_nabhapakti.141_desc:0 "虽然我们希望看到我们美丽的[ROOT.GetCountry.GetAdjective]船只在伊洛瓦底江两岸航行，但这与我们最近的港口相距甚远——这是我们尚未解决的问题。"
 me_nabhapakti.141_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti.142.a:0 "我们将支持皈依佛教的部落！"
 me_nabhapakti.142.b:0 "我们将远离缅甸内部的政治。"
 me_nabhapakti.142_desc:0 "随着我们继续与伊洛瓦底江流域的当地人接触，一些居住在那里部落要求加深与我们的联系——他们想要我们的帮助，他们想要我们的奢侈品，他们想要我们的衣物——他们渴望从我们这里获取任何东西。我们应该尝试接触他们吗？"
 me_nabhapakti.142_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti.143.a:0 "那些伊洛瓦底江的白痴。"
 me_nabhapakti.143_desc:0 "很遗憾地告诉你，我们无法说服缅甸的骠族和普族人民相信佛教是正确的答案。他们表示尊重，但态度坚决——他们对放弃部落信仰毫无兴趣。"
 me_nabhapakti.143_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti.144.a:0 "我们已启迪东方！"
 me_nabhapakti.144_desc:0 "从我们的僧侣那里传来的好消息！我们的使者成功地将佛陀的教诲传授给了缅甸人民，他们完全接受了悉达多的教导！现在已经可以看到他们社会中的宗教转变，这是仅仅一代人之前难以想象的。由于我们在该地区的进展，这一显著的成功甚至可能在未来帮助我们在西藏进行远征。"
 me_nabhapakti.144_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti.14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_nabhapakti.150.a:0 "我们将向他们展示我们的慷慨。"
 me_nabhapakti.150.b:0 "孟加拉的洪水不是尼泊尔的洪水。"
 me_nabhapakti.150_desc:0 "我们听到了令人心碎的报道，描述了毁灭性的洪水完全摧毁了#E孟加拉#!的乡村地区，故事令人难以置信——整个村庄一夜之间消失，山体滑坡改变了乡村的面貌，破坏了道路，使一切都变得面目全非。绝望的幸存者发出了求救信号，毫无疑问，除非我们采取行动，否则会有更多人丧生。"
 me_nabhapakti.150_title:0 "$nabhapakti_missions_task_15$"
 me_nabhapakti.151.a:0 "吠陀教和佛教可以共存。"
 me_nabhapakti.151.b:0 "吠陀教是愚蠢的！"
 me_nabhapakti.151.c:0 "派遣一位西藏隐士，向他们展示如何融合他们的信仰。"
 me_nabhapakti.151_desc:0 "在整个[ROOT.GetCountry.GetAdjective]社会中，关于吠陀教与佛教之间的差异展开了激烈的辩论，比较和对比它们的优点，这种坦率导致最虔诚的人们感情激化。"
 me_nabhapakti.151_title:0 "$nabhapakti_missions_task_15$"
 me_nabhapakti.152_desc:0 "似乎我们在一项贸易交易中被当成了傻瓜，我们的一位新合作伙伴提出的报价在[ROOT.GetCountry.GetName]全国范围内引起了不满。\n\n虽然很明显我们被剥削了，但有人悄悄建议我们还是接受这笔交易，作为一种善意的姿态，因为这个人有一天可能会成为更好的朋友。"
 me_nabhapakti.152_title:0 "$nabhapakti_missions_task_15$"
 me_nabhapakti.153_desc:0 "我们无法说服#T孟加拉#!的#E孟加拉人#!相信#Y佛教#!是正确的答案。他们对我们的僧侣要说的话毫无兴趣，尽管提供了传统的款待，但在第二天日出时要求我们的宗教使者离开。"
 me_nabhapakti.153_title:0 "$nabhapakti_missions_task_15$"
 me_nabhapakti.154_desc:0 "值得庆祝的巨大好消息！我们的使者成功地将佛陀的教诲传授给了#T孟加拉#!的人民！据说这些新皈依者与我们自己的信徒一样虔诚，以一种证明其内在价值的热情拥抱他们的信仰。人们还认为，这一显著的成功甚至可能在未来帮助我们在缅甸进行远征。"
 me_nabhapakti.154_title:0 "$nabhapakti_missions_task_15$"
 me_nabhapakti.15_desc:0 "我们的#Y佛教使者#!已被派往#T孟加拉#!。只有时间会告诉我们他们是否成功。我们应该准备好迎接他们成功或失败的消息。"
 me_nabhapakti_1.a:0 "人民支持我们！"
 me_nabhapakti_10.a:0 "我们是全世界佛教徒的榜样！"
 me_nabhapakti_101.a:0 "我们将像山脉一样高耸挺立。"
 me_nabhapakti_101_desc:0 "在山区，尼泊尔人民居住于此。超越孔雀王朝的界限，我们占据这片由无数花朵组成的土地。我们将请求尼泊尔人民给予援助，使纳巴帕克提能在喜马拉雅山脚下如花般绽放。"
 me_nabhapakti_101_title:0 "$nabhapakti_missions_task_1$"
 me_nabhapakti_10_desc:0 "我们已尽力说服潜在的人们接受佛教教义。我们的努力没有被忽视，从 #T 恒河到印度河#! 的所有 #E 佛教徒#! 对我们的承诺印象深刻，并加倍了自己的努力！"
 me_nabhapakti_10_title:0 "$nabhapakti_missions_task_10$"
 me_nabhapakti_10_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_10$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_11.a:0 "玛拉人应该生活在共和国中！"
 me_nabhapakti_11_desc:0 "在过去的时代，#E 玛拉人#! 是 #Y 伐阇利卡联盟#! 的一部分。当然，这个光荣的共和国联盟排除了 #Y 释迦共和国#!，以及我们的同僚共和国 #Y 科利耶、摩利亚和卡拉马#!，但这并不是自愿的。我们不幸处于 #Y 科萨拉王国#! 的统治之下。因此，我们认为 #E 玛拉人#! 是我们的兄弟！我们通过以共和国的名义声称他们的土地来纪念旧联盟。"
 me_nabhapakti_11_title:0 "$nabhapakti_missions_task_11$"
 me_nabhapakti_11_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_11$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_12.a:0 "我们在这里有主场优势！"
 me_nabhapakti_12.b:0 "说实话，不值得努力。"
 me_nabhapakti_12.c:0 "佛教徒在这里生活了几个世纪！"
 me_nabhapakti_120.a:0 "让我们尽可能利用他们的资源！"
 me_nabhapakti_120.b:0 "他们的支持已经足够了。"
 me_nabhapakti_120_desc:0 "我们已成功说服来自恒河河谷地区的国家加入我们的正义毒丸联盟！"
 me_nabhapakti_120_title:0 "$nabhapakti_missions_task_12$"
 me_nabhapakti_121.a:0 "该死！"
 me_nabhapakti_121_desc:0 "不幸的是，未能成功说服恒河河谷地区的人们加入毒丸联盟。"
 me_nabhapakti_121_title:0 "$nabhapakti_missions_task_12$"
 me_nabhapakti_12_desc:0 "恒河河谷无疑是整个印度最伟大的地方。不仅是我们的社会所在地，还有无数的思想、财富和各种类型的人群。我们处于一个极佳的位置来建立大规模的佛教影响力，并可能为毒丸联盟增添一个有价值的盟友。"
 me_nabhapakti_12_title:0 "$nabhapakti_missions_task_12$"
 me_nabhapakti_12_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_12$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_13.a:0 "登上世界的屋脊！"
 me_nabhapakti_13_desc:0 "我们的佛教使者已被派往西藏。只有时间会告诉我们他们是否成功。我们应该准备好迎接他们成功或失败的消息。"
 me_nabhapakti_13_title:0 "$nabhapakti_missions_task_13$"
 me_nabhapakti_13_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_13$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_14.a:0 "前往世界的尽头！"
 me_nabhapakti_14_desc:0 "我们的佛教使者已被派往缅甸。只有时间会告诉我们他们是否成功。我们应该准备好迎接他们成功或失败的消息。"
 me_nabhapakti_14_title:0 "$nabhapakti_missions_task_14$"
 me_nabhapakti_14_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_14$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_15.a:0 "前往孟加拉湾！"
 me_nabhapakti_152.a:0 "与孟加拉的贸易从未伤害过我们。"
 me_nabhapakti_152.b:0 "我们拒绝如此荒谬的交易。"
 me_nabhapakti_153.a:0 "那些愚蠢的渔民……"
 me_nabhapakti_154.a:0 "渔民现在已成为觉悟的渔民。"
 me_nabhapakti_15_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_15$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_16.a:0 "佛教徒们，集合！"
 me_nabhapakti_16_desc:0 "虽然我们现在只是#E孔雀王朝#!的一个属国，但他们很快会发现他们吞下了一颗#E毒丸#!。让我们将#E孔雀王朝#!的臣民转而反对他们，并加入我们的#Y毒丸联盟#!。我们可以将这个联盟作为我们自身力量的延伸，一起清除#E孔雀王朝的枷锁#!，解放#T印度#!的土地！！"
 me_nabhapakti_16_title:0 "$nabhapakti_missions_task_16$"
 me_nabhapakti_16_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_16$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_17.a:0 "羯陵伽人是一个高贵的民族！"
 me_nabhapakti_17_desc:0 "古老的#Y 羯陵伽王国#!是少数几个#E 佛教#!国家之一，直到被不可控的力量不光彩地终结。让我们恢复他们的王国，作为对他们早期采纳#E 佛陀#!的奖励。当然，这次他们将在#G 我们的直接保护#!之下。"
 me_nabhapakti_17_title:0 "$nabhapakti_missions_task_17$"
 me_nabhapakti_17_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_17$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_18.a:0 "我从来不在乎形式上的东西。"
 me_nabhapakti_18_desc:0 "虽然不正统，但很少有人会质疑我们对我们领域及其臣民领域的霸权。我们实际上已是一个帝国，因此让我们采用更适合的#E帝国崇拜#!政府体制，进一步加强对我们的附庸国的控制。"
 me_nabhapakti_18_title:0 "$nabhapakti_missions_task_18$"
 me_nabhapakti_18_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_18$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_19.a:0 "让我们看看我们能做些什么。"
 me_nabhapakti_19_desc:0 "我们发现自己舒适地栖息在#E 旃陀罗笈多的孔雀帝国#!#E 之腹#!内。这是一个微妙的情况，但它比其他选择要好得多。既然我们处于腹中，就有机会将这种情况转化为机遇。让我们开始实施步骤来实现这一点。"
 me_nabhapakti_19_title:0 "$nabhapakti_missions_task_19$"
 me_nabhapakti_19_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_19$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_1_desc:0 "慷慨的尼泊尔人民支持发展成为一个值得他们付出的国家。他们向我们捐赠了黄金，并愿意为我们变得伟大而做出必要的牺牲。"
 me_nabhapakti_1_title:0 "$nabhapakti_missions_task_1$"
 me_nabhapakti_1_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_1$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_2.a:0 "投身于这条龙。"
 me_nabhapakti_20.a:0 "让我们祈祷不要惊醒巨人。"
 me_nabhapakti_202.a:0 "迦末多将成为我们的！"
 me_nabhapakti_2022.a:0 "我知道这是个好投资。"
 me_nabhapakti_2022_desc:0 "#E 孔雀王朝#!决定根据我们的宣称无偿将#Y 迦末多#!的其余部分赠予我们！看来高价购买伊萨尔终究是值得的。"
 me_nabhapakti_2022_title:0 "迦末多的剩余部分"
 me_nabhapakti_202_desc:0 "随着#E 孔雀王朝#!承认我们对#Y 迦末多#!的宣称，他们不会干预对该地区的军事行动。是时候准备并发动战争了！"
 me_nabhapakti_202_title:0 "迦末多战争"
 me_nabhapakti_20_desc:0 "#Y 迦末多#!长期以来一直是#E 迦末多人和尼泊尔人#!之间的争议地区。显然，它应该是我们的！我们需要让#E 孔雀王朝#!承认我们的宣称！呃……至少友好地提出要求。"
 me_nabhapakti_20_title:0 "$nabhapakti_missions_task_20$"
 me_nabhapakti_20_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_20$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_21.a:0 "孔雀王朝并非一无是处。"
 me_nabhapakti_21_desc:0 "#T孔雀王朝#!对我们对其事业的忠诚感到非常满意。他们决定奖励我们，帮助我们将国家发展成一个强大的附庸国。看起来，进贡确实有好处！"
 me_nabhapakti_21_title:0 "$nabhapakti_missions_task_21$"
 me_nabhapakti_21_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_21$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_22.a:0 "他们是志同道合的知识分子。"
 me_nabhapakti_22.b:0 "他们是自命不凡的傻瓜。"
 me_nabhapakti_22.c:0 "他们心中已找到了佛陀。"
 me_nabhapakti_220.a:0 "我们将尽可能利用他们的力量！"
 me_nabhapakti_220.b:0 "他们的支持已经足够了。"
 me_nabhapakti_220_desc:0 "#T印度河谷#!的人们已被#G说服#!加入#Y毒丸联盟#!！"
 me_nabhapakti_220_title:0 "$nabhapakti_missions_task_22$"
 me_nabhapakti_221.a:0 "我就知道他们是自命不凡的……"
 me_nabhapakti_221_desc:0 "#T印度河谷#!的人们仍然#R未被说服#!加入#Y毒丸联盟#!。"
 me_nabhapakti_221_title:0 "$nabhapakti_missions_task_22$"
 me_nabhapakti_22_desc:0 "#T印度河谷#!拥有难以想象的财富、知识和资源。如果我们能说服他们加入我们的#Y毒丸联盟#!，那将是一个巨大的助力！"
 me_nabhapakti_22_title:0 "$nabhapakti_missions_task_22$"
 me_nabhapakti_22_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_22$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_23.a:0 "听起来对我很有用。"
 me_nabhapakti_23.b:0 "他们是野蛮人，野蛮人！"
 me_nabhapakti_23.c:0 "丛林已被佛陀驯服！"
 me_nabhapakti_230.a:0 "我们将利用他们所有的知识！"
 me_nabhapakti_230.b:0 "只要他们在战斗中能够自保就行。"
 me_nabhapakti_230_desc:0 "多么幸运！我们将得到来自#T印度中部#!的#G支持#!！"
 me_nabhapakti_230_title:0 "$nabhapakti_missions_task_23$"
 me_nabhapakti_231.a:0 "几乎不是人类！"
 me_nabhapakti_231_desc:0 "不幸的是，他们完全不相信，并且#R 不会#!支持#Y 毒丸联盟#!。"
 me_nabhapakti_231_title:0 "$nabhapakti_missions_task_23$"
 me_nabhapakti_23_desc:0 "位于印度中部丛林，介于伟大的#T 德干高原#!与#T 印度河和恒河#!之间的土地，这片未被驯服的土地坐落于此。我们可以利用这些人加入我们的#Y 毒丸联盟#!，以及他们在消耗战中的专长。"
 me_nabhapakti_23_title:0 "$nabhapakti_missions_task_23$"
 me_nabhapakti_23_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_23$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_24.a:0 "敌人的敌人……"
 me_nabhapakti_24.b:0 "只是另一个敌人。"
 me_nabhapakti_24.c:0 "亚历山大的幽灵援助我们。"
 me_nabhapakti_240.a:0 "从亚历山大的幽灵那里学习所有能学的东西！"
 me_nabhapakti_240.b:0 "当时间到来时，他们最好全力出击。"
 me_nabhapakti_240_desc:0 "我们已经确保获得#E 希腊#!对我们的#Y 毒丸联盟#!倡议的支持！"
 me_nabhapakti_240_title:0 "$nabhapakti_missions_task_24$"
 me_nabhapakti_241.a:0 "自负的傻瓜。"
 me_nabhapakti_241_desc:0 "#E 希腊人#!#R 拒绝#!参与我们的#Y 毒丸联盟#!。"
 me_nabhapakti_241_title:0 "$nabhapakti_missions_task_24$"
 me_nabhapakti_24_desc:0 "越过#T 兴都库什山脉#!的土地上，是#E 亚历山大大帝#!帝国的遗迹。他们的军事实力和战争经验将极大地增强我们#Y 毒丸联盟#!的军事能力。"
 me_nabhapakti_24_title:0 "$nabhapakti_missions_task_24$"
 me_nabhapakti_24_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_24$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_25.a:0 "是时候斩杀一条龙了。"
 me_nabhapakti_25_desc:0 "尽管#E 佛教#!宣扬和平，但现在是我们举起圣洁的#G 悉达多之剑#!并#R 打击#!#T 孔雀帝国#!以及任何加入我们#Y 毒丸联盟#!的国家的时候了。"
 me_nabhapakti_25_title:0 "$nabhapakti_missions_task_25$"
 me_nabhapakti_25_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_25$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_269.a:0 "让我们看看这条龙有什么要说的。"
 me_nabhapakti_269_desc:0 "我们已经向强大的孔雀王朝派遣了外交试探。我们现在等待他们的回应。"
 me_nabhapakti_269_title:0 "$nabhapakti_missions_task_2$"
 me_nabhapakti_2_desc:0 "纳巴帕克提被夹在巨石（世界上最大的石头）和硬地（孔雀王朝）之间。与其对抗压迫性的孔雀王朝力量或退回到喜马拉雅山上，我们可以作为附庸进入孔雀王朝的纷争中。"
 me_nabhapakti_2_title:0 "$nabhapakti_missions_task_2$"
 me_nabhapakti_2_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_2$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_3.a:0 "我们是释迦族。"
 me_nabhapakti_3_desc:0 "释迦共和国将成为尼泊尔身份的重要组成部分。作为一个贵族共和国，释迦族将成为佛陀本人悉达多·乔达摩的第一个家园。它一直是一个重要的实体，直到被科萨拉王国吞并。"
 me_nabhapakti_3_title:0 "$nabhapakti_missions_task_3$"
 me_nabhapakti_3_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_3$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_4.a:0 "你说的是国王？"
 me_nabhapakti_4_desc:0 "关于我们在东部的土地，基拉塔王国将跨越大部分尼泊尔边界，并被视为尼泊尔国家的最早实例之一。这个古老的王国半传说化，尼泊尔之王的概念可以复兴。有了一个人民的国王，一个统治的王国必将随之而来。"
 me_nabhapakti_4_title:0 "$nabhapakti_missions_task_4$"
 me_nabhapakti_4_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_4$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_5.a:0 "我们将尊重释迦族，迁移首都。"
 me_nabhapakti_5.b:0 "我们将继续我们的传统，留在这里。"
 me_nabhapakti_5_desc:0 "虽然我们的首都塞兰普拉是一个很好的首都，但如果我们追求伟大的过去和历史，或许将首都迁移到迦毗罗卫城的玛拉地区会更好。"
 me_nabhapakti_5_title:0 "$nabhapakti_missions_task_5$"
 me_nabhapakti_5_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_5$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_6.a:0 "佛陀的诞生地在这里！"
 me_nabhapakti_6_desc:0 "众所周知，伟大的 #E 佛陀#! 的诞生地实际上是旧时的 #Y 释迦#! 国。我们承载着这一遗产，因此，我们有责任将 #E 佛陀#! 的教义传播到我们的国界之外。让我们告诉世界，是我们将教导他们 #E 佛陀#! 的教义。"
 me_nabhapakti_6_title:0 "$nabhapakti_missions_task_6$"
 me_nabhapakti_6_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_6$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_7.a:0 "#W 天空#! 是佛教的极限！"
 me_nabhapakti_7_desc:0 "西藏位于世界的屋脊。雄伟的#T 喜马拉雅山#!高耸于宇宙万物之上！这样一个位置将给我们带来怎样的好处？地球上的人们将在#E 佛陀#!的注视下从天空中被看护！我们应该在#T 西藏#!建立一个#Y 佛教封邑#!。"
 me_nabhapakti_7_title:0 "$nabhapakti_missions_task_7$"
 me_nabhapakti_7_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_7$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_8.a:0 "跨过所有的 #G 土地#! 为佛教！"
 me_nabhapakti_8_desc:0 "我们无法理解的未知东方缺乏#E 佛陀#!的教义。在#T 缅甸#!建立一个#Y 佛教封邑#!可能会打开通往我们尚未涉足的神秘土地的大门。"
 me_nabhapakti_8_title:0 "$nabhapakti_missions_task_8$"
 me_nabhapakti_8_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_8$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_9.a:0 "甚至 #Y 海洋#! 也将支持佛教！"
 me_nabhapakti_9_desc:0 "#T 孟加拉#!湾是最有利可图的海湾，它们将受到#E 佛陀#!的祝福。在我们的控制下，我们将能够在不可逾越的水平上扩展我们的影响力。在#T 恒河#!入海口建立一个#Y 佛教封邑#!将巩固我们对#E 释达多#!的遗产。"
 me_nabhapakti_9_title:0 "$nabhapakti_missions_task_9$"
 me_nabhapakti_9_tooltip:0 "$mission_completed_tooltip_1$ '#Y $nabhapakti_missions_task_9$#!' $mission_completed_tooltip_2$"
 me_nabhapakti_final.a:0 "哦，尼泊尔的孩子们，我已经回应了你们。"
 me_nabhapakti_final_desc:0 "我们已从默默无闻中#E 崛起#!！从#E 卑微#!的开端出发，被推到#T 喜马拉雅#!山脚。我们#R 困于#!群山与#T 孔雀帝国#!之间，却已将我们的#E 遗产#!#G 铭刻#!进历史年鉴！如今我们自己也是一个#Y 帝国#!，愿我们的遗产#E 永世长存#!。"
 me_nabhapakti_final_title:0 "不再沉睡于群山之中"
 me_nabhapakti_final_tooltip:0 "$tree_completed_tooltip_1$“#Y 群山中的安歇#!”$tree_completed_tooltip_2$"

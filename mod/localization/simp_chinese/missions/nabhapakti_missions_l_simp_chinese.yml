 me_nabhapakti_r6_title:0 "瓦伊沙利的回归"
 me_nabhapakti_r7.a:0 "将他们转化为封邑！"
 me_nabhapakti_r7.b:0 "这片土地是我们的土地！"
 me_nabhapakti_r7.c:0 "呃……三年后再提醒我？"
 me_nabhapakti_r7_desc:0 "#E 拘萨罗王国#!对我们的国家威望来说一直是个挑战。然而，#E 拘萨罗#!内的#Y 马尔拉#!人口肯定属于我们。此外，整个#T 摩柁提娑#!区域在我们的直接统治下可以使我们的领土受益。保持他们的独立性有可能会削弱我们自己。另一种选择是不直接吞并他们，而是将他们转变为一个正式的#Y 封邑#!，允许他们存在，并强制推行我们的#E 佛教#!理念。"

 create_aparanta_fief_desc:0 "一位 #E 希腊#! 僧侣告诉我们，#T 阿婆兰多#!的人民愿意皈依#E 佛教#!。他亲自努力教导他们#E 释迦牟尼#!的教义，何不以他的名字命名这片土地来纪念他。他的名字是#E 达摩拉克希塔#!，我们的#Y 封邑#!将称为#E 达摩拉克希塔那#!。"
 create_avanti_fief:0 "在阿槃提创建封邑"
 create_avanti_fief_desc:0 "#E 佛教#!文本#E 《增支部》#!中讲述的#T 十六印度列国#!之一就是#E 阿槃提#!。让我们将#E 阿槃提#!恢复为一个#Y 封邑#!来统治和保护。毕竟，他们的传说只会让我们的传奇更加辉煌。"
 create_dravidia_fief:0 "在德拉维达和卡纳塔创建封邑"
 create_dravidia_fief_desc:0 "在次大陆南部，穿过#T 德干高原#!及更远的地方，#E 达罗毗荼人#!居住于此。其中有一个传说中的王国，我们翻译为#E 泰米尔卡玛#!。因此，我们将教导他们#E 佛教#!并给予他们“#E 泰米尔卡玛#!”，作为我们之下的一块#Y 封邑#!，当然。"

 mountain_metropolis:0 "山中的大都市"
 nabhapakti_missions:0 "沉睡在群山中"
 nabhapakti_missions_BUTTON_TOOLTIP:0 "#E 尼泊尔#! 的孩子们在呼唤我们！"
 nabhapakti_missions_CRITERIA_DESCRIPTION:0 "当#E 那婆般提#!强大如山时，此任务即完成。"
 nabhapakti_missions_DESCRIPTION:0 "#E 那婆般提#!位于喜马拉雅山脉脚下，同时也是孔雀帝国这座大山的脚下。你能否带领最后独立的尼泊尔人走向黄金时代？"
 nabhapakti_missions_task_1:0 "由数百朵花组成"
 nabhapakti_missions_task_10:0 "佛教的灯塔"
 nabhapakti_missions_task_10_DESC:0 "我们已经尽力说服潜在的人们接受佛教教义。我们的努力并未被忽视，从 #T 恒河到印度河#! 的 #E 佛教徒#! 对我们的承诺印象深刻，并加倍了他们的努力！"
 nabhapakti_missions_task_11:0 "跋罗的问题"
 nabhapakti_missions_task_11_DESC:0 "#E 跋罗#!和#E 跋罗人#!在共和国时期是我们的兄弟。他们的土地应该属于我们而不是 #T 孔雀王朝#!。"
 nabhapakti_missions_task_12:0 "伟大的恒河"
 nabhapakti_missions_task_12_DESC:0 "#T 恒河河谷#! 可能是整个 #T 印度#! 最伟大的地方。这里不仅是我们自己的社会所在地，还有无数的思想、财富和各种各样的人。我们处于一个非常有利的位置，可以建立巨大的 #E 佛教#! 影响力，并可能为 #Y 毒丸联盟#! 添加一个宝贵的盟友。\n\n如果该地区已经有 #E 佛教#! 国家，那么您说服他们的机会将 #G 大大提高#!。"
 nabhapakti_missions_task_13:0 "苯教中的佛陀"
 nabhapakti_missions_task_13_DESC:0 "向#T 西藏#!派出#E 一年#!的#Y 佛教使者#!。\n\n派遣佛教苦行僧和僧侣代表团前往西藏地区，希望他们接受佛陀的教义。我们山中的邻居目前信仰苯教，但也许可以说服他们相信佛陀在他们的信仰体系中有其地位。扩大我们在邻近地区的影响力有助于推动我们的影响力超越边界。\n\n#G 通过学习影响我们的邻居，我们在该地区的成功#E 可能正面影响#!我们对#E 孟加拉#!的任务。#!"
 nabhapakti_missions_task_14:0 "缅甸的佛陀"
 nabhapakti_missions_task_14_DESC:0 "向#T 缅甸#!派出#E 一年#!的#Y 佛教使者#!。\n\n派遣佛教苦行僧和僧侣代表团前往缅甸地区，希望他们接受佛陀的教义。缅甸由藏族和蒲甘人混居而成，深受吠陀、沙门宗教以及本土宗教的影响。\n\n#G 由于该地区有苯教后裔，我们在该地区的成功#E 可能正面影响#!我们对#E 西藏#!苯教的任务。#!"
 nabhapakti_missions_task_15:0 "孟加拉的佛陀"
 nabhapakti_missions_task_15_DESC:0 "向#T 孟加拉#!派出#E 一年#!的#Y 佛教使者#!。\n\n派遣佛教苦行僧和僧侣代表团前往孟加拉地区，希望他们接受佛陀的教义。孟加拉特别适合进一步推进我们传播佛教的利益。其沿海位置及贸易影响力可以延伸到印度以外的海岸。\n\n#G 通过这种贸易影响力，我们在该地区的成功#E 可能正面影响#!我们对#E 缅甸#!的任务。#!"
 nabhapakti_missions_task_16:0 "毒丸策略"
 nabhapakti_missions_task_16_DESC:0 "虽然我们现在只是 #E 孔雀王朝#! 的附庸，但他们很快会发现他们已经吞下了一颗 #E 毒丸#!。让我们将 #E 孔雀王朝#! 的臣民 #R 反抗他们#! 并加入我们的 #Y 毒丸联盟#!。"
 nabhapakti_missions_task_17:0 "恢复羯陵伽"
 nabhapakti_missions_task_17_DESC:0 "我们在 #Y 羯陵伽#! 的兄弟曾经是一个强大的独立 #E 佛教#! 王国，但不知为何被摧毁了！让我们恢复我们兄弟的地位，当然，在我们的霸权之下！"
 nabhapakti_missions_task_18:0 "非正式帝国"
 nabhapakti_missions_task_18_DESC:0 "尽管不正统，但很少有人会质疑我们在自己领地及臣属领地上的霸权。我们名义上不是帝国，但实际上已经是，因此让我们采用更适合的 #E 帝国崇拜#! 政府形式，并进一步加强对附庸的控制。"
 nabhapakti_missions_task_19:0 "野兽腹中"
 nabhapakti_missions_task_19_DESC:0 "我们发现自己处于 #T 旃陀罗笈多·孔雀#! 帝国的 #E 野兽腹中#!。我们将努力在新的附庸国地位上取得成功。"
 nabhapakti_missions_task_1_DESC:0 "那婆般提坐落在喜马拉雅山脉和孔雀帝国的大山之间。要取得成功，需要人民的资源和团结。"
 nabhapakti_missions_task_2:0 "深入龙口"
 nabhapakti_missions_task_20:0 "宣称迦末多"
 nabhapakti_missions_task_20_DESC:0 "迦末多一直由我们尼泊尔人和声称迦末多为家园的东部野蛮民族争夺。然而，迦末多显然属于尼泊尔人！"
 nabhapakti_missions_task_21:0 "贡品的好处"
 nabhapakti_missions_task_21_DESC:0 "虽然我们无意继续作为#T 孔雀帝国#!的附庸，但作为忠诚的附庸确实有许多好处。"
 nabhapakti_missions_task_22:0 "影响印度河"
 nabhapakti_missions_task_22_DESC:0 "印度河流域拥有难以想象的财富、知识和资源。如果能说服他们加入我们的#Y 毒丸联盟#!，那将是一大助力！\n\n如果该区域已经有#E 佛教#!国家，那么您说服他们的机会将#G 大大提高#!。"
 nabhapakti_missions_task_23:0 "丛林的召唤"
 nabhapakti_missions_task_23_DESC:0 "印度中部的丛林位于德干高原和印度河与恒河之间的未开发土地上。我们可以利用这些人加入我们的#Y 毒丸联盟#!，并利用他们在消耗战中的专长。\n\n如果该地区已经有#E 佛教#!国家，那么您说服他们的机会将#G 大大提高#!。"
 nabhapakti_missions_task_24:0 "佛陀传给希腊人"
 nabhapakti_missions_task_24_DESC:0 "在兴都库什山脉之外是#T 亚历山大大帝#!帝国的残余。他们的军事实力和战争经验将极大地帮助我们#Y 毒丸联盟#!的军事能力。\n\n如果该地区已经有#E 佛教#!国家，那么您说服他们的机会将#G 大大提高#!。"
 nabhapakti_missions_task_25:0 "悉达多之剑"
 nabhapakti_missions_task_25_DESC:0 "尽管#E 佛教#!宣扬和平，但现在是我们举起圣洁的#G 悉达多之剑#!并#R 打击#!#T 孔雀帝国#!以及任何加入我们#Y 毒丸联盟#!的国家的时候了。"
 nabhapakti_missions_task_2_DESC:0 "为了长期的成功，有必要通过成为强大的孔雀帝国的附庸来保护我们的国家。"
 nabhapakti_missions_task_3:0 "释迦族的遗产"
 nabhapakti_missions_task_3_DESC:0 "科利亚共和国、莫里亚共和国、马勒卡共和国以及释迦族共和国早已不复存在，但我们可以通过重新建立自己并尊崇释迦族共和国的遗产来实现复兴。"
 nabhapakti_missions_task_4:0 "尼泊尔之王"
 nabhapakti_missions_task_4_DESC:0 "尼泊尔人民已被驱逐至山区，而我们是尼泊尔最后一个部落。为了应对该地区的强大力量，我们应该集中力量建立一个王国，并为尼泊尔人建立一个王国。"
 nabhapakti_missions_task_5:0 "首都的选择"
 nabhapakti_missions_task_5_DESC:0 "塞兰普拉城是一个不错的首都，但在释迦族遗产和声望所在的马拉地区建立新首都可能是明智的选择。"
 nabhapakti_missions_task_6:0 "佛陀的诞生地"
 nabhapakti_missions_task_6_DESC:0 "众所周知，伟大的佛陀实际上是在旧的释迦国诞生的。我们承载着这一遗产，因此，有责任将佛陀的教义传播到我们的国界之外。让我们告诉世界，正是我们将教导他们佛陀的教义。"
 nabhapakti_missions_task_7:0 "山中的封邑"
 nabhapakti_missions_task_7_DESC:0 "我们应该在世界的屋脊上建立一个#Y 佛教封邑#!！我们最近的邻居将是#E 更直接地#!扩展我们影响力的最佳目标。"
 nabhapakti_missions_task_8:0 "东方的封邑"
 nabhapakti_missions_task_8_DESC:0 "在已知世界的最东端建立一个#Y 佛教封邑#!，将#E 佛教#!思想传播得比我们想象的更远。"
 nabhapakti_missions_task_9:0 "海湾的封邑"
 nabhapakti_missions_task_9_DESC:0 "#T 孟加拉湾#!是世界上最繁荣的贸易枢纽之一。在#T 孟加拉#!建立一个#Y 佛教封邑#!可以极大地增强#E 悉达多#!在整个#T 印度洋#!的影响力。"
 nabhapakti_missions_task_k1:0 "真正的皇家首都"
 nabhapakti_missions_task_k1_DESC:0 "我们的首都是山中的一颗明珠，像天空中的星星一样闪耀；让我们打磨它的光辉，直到它能与太阳媲美。"
 nabhapakti_missions_task_k2:0 "加固山口"
 nabhapakti_missions_task_k2_DESC:0 "我们用来对敌人领土发动袭击的同一条山口也可能被用来对付我们自己的人民；这是我们面临的危险现实。我们必须保护我们的边界免受外国入侵——不能让不可想象的事情发生。"
 nabhapakti_missions_task_k3:0 "喂养我们的首都"
 nabhapakti_missions_task_k3_DESC:0 "我们的人民需要食物，所以我们必须提供食物——无论是从国外进口谷物还是在我们的农场种植，我们都面临着迫切的需求。"
 nabhapakti_missions_task_k4:0 "山中的大都市"
 nabhapakti_missions_task_k4_DESC:0 "喜马拉雅山脉中的明珠变得越来越珍贵，许多人以公开的羡慕目光注视着[ROOT.GetCountry.GetName]最伟大的城市。现在不要停下脚步——我们必须攀登到更高的高度！"
 nabhapakti_missions_task_k5:0 "新基拉塔王国"
 nabhapakti_missions_task_k5_DESC:0 "印度神话中的基拉塔王国是由 #E 喜马拉雅#! 的基拉塔人建立的国家，我们听到了他们遗产的召唤——我们将重新建立这个神话般的王国，并从山顶统治我们的人民！"
 nabhapakti_missions_task_r1:0 "尼泊尔的城市"
 nabhapakti_missions_task_r1_DESC:0 "为了建立一个有效的共和国，我们应该赋予人民权力并进行城市化。尽管大规模的建设需要大量的资金和工人，但这将是值得的努力。"
 nabhapakti_missions_task_r2:0 "保卫我们的城市"
 nabhapakti_missions_task_r2_DESC:0 "我们处于一个危险的位置，周围都是强大的敌人，他们可能随时决定入侵我们的家园；不要对我们邻居抱有任何幻想。为了防止最坏的情况发生，每个城市都需要适当的防御措施来保护自己。"
 nabhapakti_missions_task_r3:0 "喂养我们的城市"
 nabhapakti_missions_task_r3_DESC:0 "吃饱肚子是通往真正幸福和满足的第一步，而一个未准备好的社会距离全面崩溃仅一步之遥。我们将喂养我们的城市，它们将繁荣昌盛！"
 nabhapakti_missions_task_r4:0 "第二次伐阇利卡联盟"
 nabhapakti_missions_task_r4_DESC:0 "虽然最初的伐阇利卡联盟排除了我们和许多马拉族兄弟，这是由于压迫性的科萨拉王国。我们作为王国与伟大城邦和共和国之间的缓冲国。现在，我们可以在自己的领导下重新建立联盟，并在其中占据应有的位置。"
 nabhapakti_missions_task_r5:0 "拘萨罗王国"
 nabhapakti_missions_task_r5_DESC:0 "伐阇利卡联盟曾是科萨拉王国的附庸。但现在，神灵站在我们这边，我们将使他们成为我们的附庸——这是天意所定。"

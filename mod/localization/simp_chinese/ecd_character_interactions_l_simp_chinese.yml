 training_price:0 "训练"
 tribal_duel.1.a:0 "我将亲自上阵，赌上我所有的荣誉！"
 tribal_duel.1.b:0 "让 [champion.GetName] 代替我."
 tribal_duel.1.desc:0 "[target.GetName]#E 's#! 继续存在是对你的侮辱. 会在比武场挑战你的仇敌吗?亲自手握宝剑,披甲上阵, 或者呼叫 [champion.GetName] 替你出战?\n\n如果你选择了 [champion.GetFirstName]代表你出战, 你从目击者的角度参观整场决斗。"
 tribal_duel.1.t:0 "比武审判"
 tribal_duel.2.a:0 "[fighter_of_duel.GetFirstName] 将继续战斗。"
 tribal_duel.2.b:0 "[fighter_of_duel.GetFirstName] 将投降。"
 tribal_duel.2.c:0 "[fighter_of_duel.GetFirstName] 被杀了！"
 tribal_duel.2.d:0 "[target.GetFirstName] 被杀了！"
 tribal_duel.2.t:0 "光荣的战斗"
 tribal_duel.3.a:0 "用斧头把 [target.GetFirstName] 劈死！"
 tribal_duel.3.b:0 "用长矛刺穿 [target.GetFirstName] #E #! 的心！"
 tribal_duel.3.b_2:0 "用剑把 [target.GetFirstName] 砍烂！"
 tribal_duel.3.c:0 "我们骑上马战斗！"
 tribal_duel.3.d:0 "我仅用赤手空拳就能杀死 [target.GetFirstName]！"
 tribal_duel.3.desc:0 "双方必须就决斗用的武器达成一致。[target.GetName] 将以哪种方式遭受厄运？"
 tribal_duel.3.e:0 "像个懦夫一样退出决斗。"
 tribal_duel.3.t:0 "武器的选择"
 tribal_duel.4.a:0 "[target.GetFirstName] 姑且还活着....至少现在。"
 tribal_duel.4.desc:0 "一个没有人能预料到的结果发生了；不知怎的，决斗的结果是平局。尽管如此，没有人能说你的荣誉被玷污了，因为你在众神和人们见证之下勇敢地战斗过。你不情愿地承认你对 [target.GetName] 油然而生一种敬意；毕竟跟你决斗还能活着提起这件事的人不多了。"
 tribal_duel.4.t:0 "战斗的结束"
 tribal_duel_2_A_tooltip:0 "[target.GetName][SCOPE.GetRootScope.GetCountry.Custom('get_duel_combat_injury')]"
 tribal_duel_2_B_tooltip:0 "[fighter_of_duel.GetName][SCOPE.GetRootScope.GetCountry.Custom('get_duel_combat_injury')]"
 tribal_duel_2_desc_1:0 "显然，这会是个美丽的日子。微风轻柔，太阳在天空中明亮照耀，不偏不倚地见证下方聚集的人群。你站在对手面前，手持斧头，等待出击的机会。从敌人钢铁般的眼神中可以看出，你将迎来一场苦战，但这正是你所预料的。突然，一声呼喊响起，一切清醒思绪都退去，被求生的原始冲动吞没。你向前踏步，奋力挥击，战吼从唇间爆发。"
 tribal_duel_2_desc_10:0 "你和[target.GetName]一直激烈缠斗，双臂交错，彼此都试图击中对方。你避开一次软弱的头撞，拳头正中敌人下颌，片刻后便让[target.GetHerHim]把一颗带血的牙吐到地上。你的对手像受伤公牛般咆哮，举起双拳向前逼来。你看见[target.GetHerHis]一只眼睛开始肿得闭合，这让你受到鼓舞……你正在赢下这场战斗。对手挥拳攻来，你受先前成功激励，正面迎击，却在下一刻立刻开始怀疑自己，因为你的视野炸成满天星光；诸神在上，这一下真疼！"
 tribal_duel_2_desc_11:0 "[target.GetName] 结实的一拳击中你的腹部，你顿时喘不上气来；你倒在地上，嘶哑地喘息着，肺部拼命地想要吸入空气。你勉强抓住了 [target.GetName] 的手，没让它们扼住你的喉咙，两人扭打在一起，各自奋力压倒对方。你费了九牛二虎之力才把对手从身上甩开。你愤怒地吼叫着，猛扑过去扭转了局面，两人一起摔倒在地。你要掐死这个蠢货，把他的肝拿去喂原野上的鸟！"
 tribal_duel_2_desc_12:0 "战斗越来越激烈，你们两人都开始犯错。你的脸正在肿胀，左眼已经看不清。但你打出的伤害不比承受的少，而且挣扎的不止你一个；细细血流正从[target.GetName]脸上淌下，那张脸已成淤青与伤口拼成的一片。对手察觉机会，试图用一阵猛攻压倒你，却没有任何一击命中；你快速侧步，瞄准[target.GetHerHis]侧身命中一击，使[target.GetHerHim]闷哼出声。"
 tribal_duel_2_desc_13:0 "剑刃相交，空中回荡着金属的碰撞声，[target.GetName] 向你压来，试图把你逼跪在地。你猛力一推，将他向后击退，重新站稳脚跟，迈步向前扩大优势。敌人的开局猛攻十分凶狠，差一点在战斗真正开始前就结束了这场对决，但现在他似乎正在重新盘算 [target.GetHerHis] 策略。[target.GetName] 平静地呼吸着，小心翼翼地与你保持着臂长之外的距离。当你们的剑再次相碰时，你们的目光紧紧锁在一起。"
 tribal_duel_2_desc_14:0 "当 [target.GetName] 的剑尖刺穿你的盔甲时，你发出一声轻呼；敌人的剑刃上沾满了你的鲜血。察觉到你的瞬间恐慌，他向前倾身，希望能补上致命一击，但你成功格挡了回去，在他 [target.GetHerHis] 脸颊上留下一道深深的伤口作为回敬。这场对决中无人毫发无伤，但胜负难料，谁也说不准谁占上风。你咬紧牙关，不顾身侧阵阵作痛的伤口，再次发起攻击。"
 tribal_duel_2_desc_15:0 "经过一次优雅地旋转，你把 [target.GetName] 的剑从脑袋边拨开，并砍伤了他的手臂，打的他只能大声咒骂。你继续挥剑，一系列的打击使他失去平衡，倒在地上。现在正是你一直在等待的时刻。你放弃谨慎，向你的敌人扑去。他一瘸一拐地举起 [target.GetHerHis] 剑，表明他绝不屈服，你们俩的剑刃继续相碰。"
 tribal_duel_2_desc_16:0 "围观的人群在欢呼，但为谁欢呼呢？擦去额头上的汗水，你试着集中注意力。你看不出谁占了上风。你打了几拳，但也被打了几拳。他们难道看到了你没有看到的东西？发生甚么事了？！"
 tribal_duel_2_desc_17:0 "在你们两个决斗的拳击场上，外面安静得可怕。这里大多是嗡嗡的苍蝇声，偶尔夹杂着尖叫声，或是鲜血溅到地上的声音。太阳对凡人的事情不感兴趣，从高处无情地注视着。"
 tribal_duel_2_desc_18:0 "战斗仍在继续，但局面对你并不好。你每一次尝试，每一种由叔父或父亲的朋友教给你的策略，都被轻易招架；有好几次，你几乎失去对局势的控制。[target.GetName]仿佛钻进了你的脑中，预判着你的一举一动。"
 tribal_duel_2_desc_19:0 "你的实力让这件事看起来很轻松。除非有什么可怕的灾难突然降临到你身上，否则你是不可能输掉这场比赛的。尽管 [target.GetName] 在各方面都是出类拔萃的，但你们都知道结局很快就会到来。"
 tribal_duel_2_desc_2:0 "你向后一跃，勉强躲过一记猛烈的挥砍——那一刀来得太近，你几乎能尝到刀刃呼啸而过的味道。汗湿的头发黏成一绺绺贴在额头上，你一边克服这分心一边格挡了又一击。你身上多了几处擦伤，头也嗡嗡作响，但受苦的不只你一个；[target.GetName] 呼吸沉重，[target.GetHerHis] 脸上溅满了带血的泡沫——你就快，拼命地快要结束这场战斗了。你的对手转过身来面对你，牙关紧咬，尖叫着向你冲来。你稳住身形，双手紧握斧头，冲上前迎战。"
 tribal_duel_2_desc_20:0 "你们俩都开始有点累了，但骄傲和荣誉感阻止了你们任何一方表现出来……你是这么想的。你注意到 [target.GetName] 来回不停摇摆，看起来几乎像喝醉了一样。你自己的呼吸在你的耳朵里听起来格外刺耳，感觉砰砰作响。你哭了出来，但是你的舌头在嘴里感觉很沉，很难发出声音。突然，[target.GetName] 向前扑去，打断了你的思考。"
 tribal_duel_2_desc_21:0 "你已经知道，这场战斗日后会被写成歌谣，歌颂今日在此进行的搏杀；你和[target.GetName]展现出的英雄壮举值得被世世代代传唱。真正可惜的是，只有一人能活着离开此地，因为若你与[target.GetName]并肩作战，所有人都会在你们面前颤抖。然而，离开的只能有一人。"
 tribal_duel_2_desc_22:0 "继续进攻！不要让[target.GetName]有片刻喘息，出手！你几乎已经赢下这场，但必须大胆！看着[target.GetName]在你面前颤抖，嘲笑[target.GetHerHis]即将到来的厄运吧。你们都知道接下来会发生什么！"
 tribal_duel_2_desc_3:0 "你的斧头劈开盔甲与血肉，咬入骨头，发出令人深感满足的碎裂声；从[target.GetName]口中逃出的凄厉惨叫可以判断，这一下痛得厉害。但没有时间停顿，敌人不知怎的将你踢开，把你撞倒在地，又双手把[target.GetHerHis]斧头举过头顶，以剩余全部力量向你压下。看来[target.GetName]打算现在就结束这一切……决断时刻已经到来。"
 tribal_duel_2_desc_4:0 "你和 [target.GetName] 小心翼翼地互相绕圈，紧握着各自的长矛，等待对方做出动作——或者犯错。几分钟过去了，他没有任何实际行动；这个懦夫是要进攻还是什么？你又不是来陪他跳舞的。你朝着 [target.GetHerHis] 将矛捅了过去，测试他的提防能力，这也使你下定决心。你假装向左移动，在最后一刻突然转移重心，捅向 [target.GetName] 的右侧；他的伤口看了令人恶心。"
 tribal_duel_2_desc_5:0 "你们的长矛互相锁住，[target.GetName]正尽力试图解除你的武装。[target.GetSheHe]跪倒在地向上猛刺，你被迫猛然旋身避开刺向喉咙的矛尖。你失去平衡，踉跄后退，试图挡住这猛烈攻势，但敌人继续压上，毫不留情。可怕的恐惧开始吞没你；如果你真的输了怎么办？你大喊出声，既是在冲[target.GetName]喊，也是在冲自己喊，然后发起反击。你绝不会跌倒！"
 tribal_duel_2_desc_6:0 "你向 [target.GetName] 以弓步姿态向前进攻，迫使他向后退。不过，你们俩都筋疲力尽，而且都没能抓住优势；你的对手很容易招架住你的反击，而且他还有足够的力气来大声咒骂你。这场战斗一直势均力敌，直到此刻，你认为当下的局面必须立即改变。你挡住了敌人武器的任意一击，并准备趁机攻击，但棋差一着——你看到一杆长矛指向了你的脸，这使你突然陷入了一瞬间不知所措的恐慌。这会是你的最终结局吗？"
 tribal_duel_2_desc_7:0 "你向[target.GetName]冲去，坐骑的蹄声在地面敲出稳定鼓点。[target.GetFirstName]阴沉地迎上你的攻击，片刻后，金属碰撞与马匹嘶鸣交织成可怖声响。你身体前倾，果断出击，小心避开朝你乱挥而来的攻击。\n\n不知怎的，[target.GetFirstName]竟突破了你的防御，你的马受到擦击，鲜血喷洒在尘土飞扬的地面上。你咬紧牙关，稳住阵脚并发起反击。"
 tribal_duel_2_desc_8:0 "你不知怎的在上一次冲锋中躲过了一击，但 [target.GetName] 在哪儿？！你疯狂地策马转圈，试图辨明方位，但对手简直是在骑马绕着你兜圈子。显然 [target.GetFirstName] 在嘲笑你；他在大喊大叫，但你听不清他在说什么。你在坐骑上俯身向前，向他猛冲过去，激发出你内心全部的怒火。"
 tribal_duel_2_desc_9:0 "战斗已进入最后的绝望时刻；战士与战马都疲惫到濒临崩溃，使所有卷入其中的人都处于险境。你的手臂酸痛，因失血而头晕，心跳在耳中轰响。你必须耗尽仅剩的全部力量才能抬起手臂，而[target.GetName]和你一样痛苦，这也算不上什么安慰。当你们再次相遇时，你知道这将是最后一次……必定会有人失手。"
 tribal_duel_2_desc_axe_killer:0 "[target.GetName]发动最后一次绝望攻击，每一次狂乱挥击都只击中空气。这就是[target.GetHerHis]的全部能耐？[target.GetSheHe]竟还以为自己能在战斗中与你抗衡……短暂一瞬，你心中升起怜悯，但很快冰冷的蔑视压过一切，你完成了必须完成的事。随着一记强力重击，你把斧头深深埋进[target.GetName]的头骨，将其劈成两半。"
 tribal_duel_2_desc_generic_killer:0 "就这样，一切都结束了；[target.GetName] 死在你脚下。"
 tribal_duel_2_desc_hands_killer:0 "你猛地把头偏向一侧，让[target.GetName]的拳头从脸旁呼啸掠过，然后狠狠回击。接着一拳打向腹部，击得[target.GetHerHim]喘不过气，使[target.GetName]踉跄后退。但这是怎么回事！看来[target.GetSheHe]已经虚弱到站不起来。你跪到[target.GetName]面前，双手抓住[target.GetHerHis]肿胀的脸，告诉[target.GetHerHim]，[target.GetSheHe]战斗得很光荣，不必害怕接下来发生的事。随后一拧一响，你把无生命的身体丢到地上。当你徒手杀死对手的消息传开后，人们会深深畏惧你。"
 tribal_duel_2_desc_horse_killer:0 "此刻你和 [target.GetName] 虽然在马上，却已扭打在一起，双臂相交；所有武器都在混战中失落了，在原始的狂怒中丢失了，只剩下压倒一切的杀死对方的欲望。此刻这已不仅是人与野兽之间的搏斗……这是一场意志的较量。[target.GetName] 把手从你的喉咙上移开，试图去摸一把隐藏的匕首，你看到了机会；你从坐骑上跃起，将对手扑倒在地。你不太记得接下来发生了什么，但很快你被部族的人们高高举起抛向空中，而 [target.GetName] 已经毫无生气的身体静静地躺在地上。"
 tribal_duel_2_desc_loser:0 "当部落长者们在神圣的日子聚在一起缅怀我们的祖先，那些勇敢战斗和献出生命的使我们的人民有今天生活的勇敢的男男女女们，英雄之列上应加上另一个受人尊敬的名字，你的名字。尽管你竭尽全力，这还不足以战胜你的敌人，但在光荣的战斗中牺牲并不可耻。"
 tribal_duel_2_desc_spear_killer:0 "空气中充满可怕的木裂声，[target.GetName]的武器被击碎，无法承受你倾泻其上的猛烈攻势。你的对手意识到末日将近，开始哭喊，嘶哑哀号充满空气，令你臂上汗毛竖起。你向前倒压，把长矛深深刺入[target.GetName]的喉咙，让[target.GetHerHis]性命与可怜的呜咽一同终结。"
 tribal_duel_2_desc_sword_killer:0 "自年少时起，你便以剑杀人；第一次是在你刚满十四岁时，对手是一名狂妄的罗马雇佣兵，手持一柄短小的双刃剑，并声称那剑来自希斯帕尼亚。你曾率众投入战斗，也曾洗劫敌人的营地；在你的人民之中，凡活着的人无人能在武艺上与你匹敌。因此你迅速解决[target.GetName]并不令人意外，这个乳臭未干的家伙本就不该举剑对抗你。"
 tribal_duel_3_hands_tooltip:0 "尽管 [fighter_of_duel.GetFirstName] 胜利的几率会更低，但徒手杀死对手所带来的声望将远远超过风险。"
 tribal_duel_3_horse_tooltip:0 "[target.GetFirstName] 提议我们在马背上作战……我们同意吗？"
 unlock_offer_protection_interaction:0 "解锁一个对 #Y 提供保护#!  的角色互动，到边界州的数量少于 #Y 20#!块领土 , 对我们的好感在 #Y 50#!以上，且两国统治者互为朋友。这可能会导致该国成为 #Y 藩属#! 这种关系可能会在对方统治者去世时结束。"

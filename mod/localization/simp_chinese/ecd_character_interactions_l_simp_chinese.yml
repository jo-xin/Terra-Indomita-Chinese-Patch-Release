 suggest_training_charisma_tt:0 "[target.GetName] 将开始训练以提升 [target.GetHerHis] 魅力@oratory_icon!"
 suggest_training_finesse_tt:0 "[target.GetName] 将开始训练以提升 [target.GetHerHis] 智略@civic_icon!"
 suggest_training_martial_tt:0 "[target.GetName] 将开始训练以提升 [target.GetHerHis] 军略@military_icon!"
 suggest_training_past:0 "[target.GetName] 开始训练！"

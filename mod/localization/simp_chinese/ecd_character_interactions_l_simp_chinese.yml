l_simp_chinese:
 allow_forced_divorce_of_all:0 "解锁强迫统治家族之外的人物离婚的能力。"
 ambitions_inv_1.a:0 "我们再喝一杯！"
 ambitions_inv_1.b:0 "我才是这里最伟大的战士；向你们的领袖致敬！"
 ambitions_inv_1.c:0 "我要和你决斗！！"
 ambitions_inv_10.a:0 "没收所有赃物！"
 ambitions_inv_10.b:0 "无论是谁，都将为这些罪行付出生命的代价！"
 ambitions_inv_10.c:0 "允许黑市继续存在，但要求我们应得到属于我们的份额。"
 ambitions_inv_10_desc:0 "每年，我们的财政中有很大一部分都花在维护宗教设施上；一个好的统治者会很重视这种特权。我们的祭司从不缺吃缺穿，在特定时节，我们大量购买特产，比如从阿拉伯买来的熏香，这样虔诚的香气就会充满我们的圣殿，升入天堂，确保我们继续得到神的恩惠。近年来，你实际上已经购买了商人带来的所有熏香，熟悉了他们所提供的各种类型、产地以及质量的区分。\n\n你比大多数人都清楚，熏香的价格很高，但你从不犹豫，你知道这种虔诚让民众十分高兴。然而，近来令人不安的报道使你在亵渎的愤怒中颤抖；我们的一个顾问，一个拥有大量财产的宗教狂热分子，显然一直在黑市上卖香……但是他们是没有办法得到它的，除非他们从寺庙里偷东西。\n\n你派一个乔装打扮后的士兵去偷偷地买一些，用你自己的眼睛确认，这就是你刚刚购买的熏香。简直是令人发指的侮辱！"
 ambitions_inv_10_title:0 "宗教物品黑市"
 ambitions_inv_1_desc:0 "一天，你收到来自 [scheme_target.GetName] 的邀请去参加几天后在 [your_province_scope.GetArea.GetRegion.GetName] 举行的晚宴。城里所有显赫家族的成员都会到场，虽然你真的不想去，但你知道无视邀请可能会被视为粗鲁。被迫无休止地在这种场合露面是多么令人厌烦啊！另一方面，[scheme_target.GetFirstName] 的热情好客很有名，而且他有着美食家的名声……你知道至少吃的会很好。发出一声沉重的叹息后，你不情愿地写下你的回复，让 [scheme_target.GetFirstName] 知道你会参加宴会。\n\n现在已经是深夜了，你必须承认度过了一段美好的时光——比你想象的要好。房间里充满了笑声和愉快的谈话，晚餐很精致；你已经吞下了大量的鱼、烤肉、水果和面包。浓郁的奶酪沐浴在蜂蜜酒中，撒上烤种子，从你不断摇摆的头可以看出，这酒相当醇厚……至少感觉是这样。你喝了几杯了？没关系，再来一杯…\n\n晚餐上的闲聊现在转向了英雄壮举，有人开始赞扬我们的军队在上次战役中表现得多么好，并为此举杯缅怀我们优秀的战士。当讨论转向战争时，[scheme_target.GetFirstName] 的一个朋友在房间里醉醺醺地赞美 [scheme_target.GetHerHis] 是最伟大的将军，这让全场立即沉默下来；所有的眼睛都在看你的反应，你可以感觉到你的脸在发黑。毫无疑问，[scheme_target.GetFirstName] 以其 [scheme_target.GetHerHis] 高超的武艺而闻名——但每个人都知道你比他更勇武。你可以表现平易近人，或者也可以澄清事实。你站起身，摇摇晃晃地转向 [scheme_target.GetFirstName]，然后做出回复。"
 ambitions_inv_1_title:0 "危险的晚宴闲聊"
 ambitions_inv_1_tt:0 "[target.GetName] 和 [scheme_target.GetName] 会决斗至死，最后一个站着的人才会赢。"
 ambitions_inv_2.a:0 "我们一起祭祀吧，让我们的士兵得到祝福。"
 ambitions_inv_2.b:0 "这是未经授权的，把它拆了。"
 ambitions_inv_2_desc:0 "在我们上次的战役之后，[scheme_target.GetName] 在收集战利品方面显得非常成功；他们不仅歼灭了前来迎击他们的军队，而且还设法从死者那里收集了数量惊人的胸甲、长矛、剑和盾牌。这天，你惊讶地看到一百多辆满载战利品的马车笨重地驶过我们首都的街道；聚集的人群跟着游行队伍进入市中心。在接下来的几天中，[scheme_target.GetFirstName]#E 's#! 的人开始工作，从黎明到黄昏，街道上充满了劳动的喊叫声。\n\n当他们完工时，一堆巨塔已经竖立起来，这是一座由破损的金属和皮革构成的不祥之塔；它确实是这座城市最高的建筑，从几英里外就能看到。[scheme_target.GetFirstName] 邀请你和他们一起站在这个可怕的圣坛前，进行祭祀；他们声称，这种在战利品前焚烧谷物的神秘仪式是他们军事实力的秘密。人们当然会喜欢这种场面，但你并不会欣赏 [scheme_target.GetFirstName] 这种单方面的主动行动。这座纪念碑是为了给国家带来荣耀，还是为了给个人带来荣誉？你该怎么说呢?"
 ambitions_inv_2_title:0 "战利品"
 ambitions_inv_3.a:0 "你激励着我们所有人；带着我的祝福继续你的善行。"
 ambitions_inv_3.b:0 "把钱吸进我的口袋。"
 ambitions_inv_3_desc:0 "我国人民的虔诚是众所周知的，对于那些有经济能力的人来说，亲自资助每年的宗教节日被视为一种荣誉。直到最近，你还认为这是贵族的特权，但几天前，你收到的报告让你犹豫了。一位古怪的地方法官正在出资修复一座古老的圣殿；曾经的砖和泥土现在变成了大理石，但一切都不像它看起来的那样……显然，这笔钱花得不太合适。\n\n你的好奇心被激起了，你决定这天亲自去看看这个奇迹，你对你的发现感到敬畏。虽然建筑本身很小，但因为它的美观，使得这是一项惊人的成就，可以与 [your_province_scope.GetArea.GetName] 中的伟大建筑相媲美。当你看到一位老人从圣殿里走出来时，你已被建筑的富丽堂皇惊呆，几乎说不出话来。他穿着仪式长袍，两侧是祭司。‘我的主人，您能到这里来，真是我们大家的荣幸。’这位官员环顾四周，咯咯地笑着，眼睛闪闪发光。‘我知道这都是些微不足道的东西，但是您同意诸神所要求这些，甚至更多吗？’"
 ambitions_inv_3_title:0 "怪异的热心人"
 ambitions_inv_4.a:0 "找点乐子也无妨。"
 ambitions_inv_4.b:0 "这太荒谬了……只有白痴才会相信。"
 ambitions_inv_4_desc:0 "你听说过的一个名叫 [mystic_man.GetName] 的旅行占星家的有趣故事似乎已经吸引了我们宫廷的精英；这究竟是由于上层社会的无聊，还是这位预言家的超自然力量，还有待观察。显然，他自称是巴比伦神秘故事的提供者，只要付一定的价钱，他就能告诉你你的未来。你认识的很多人都对这些有趣的故事很感兴趣，当有一天有消息传来，说纳布将在一个酒会上提供占星术时，你的好奇心占了上风，你同意去看看这到底是怎么回事。\n\n你在大家聚集的院子里等了一个多小时，突然传来一阵响亮的鼓声和铙钹声。纳布从窗帘后面出现，他是一个引人注目的人物，留着浓密的黑胡子，弗里吉亚帽下一双充满野性地眼睛向外窥视。他的手指从彩色长袍的宽大袖子上摆动着，开始吟唱:‘迦勒底人的古老智慧已为我所知；众神的秘密通过天空中星星的运行揭示。但要知道上天的旨意，我个人付出了巨大的代价，对我的身体造成了伤害。’他不时发出沙哑的咳嗽声，使你在他继续说话时翻着白眼。‘但我愿意分享我的礼物，每个星座只需要区区一百枚金币。如果你想知道将来的事，来吧，到我这里来。’一百枚金币！搁这骗钱呢。你哼了一声，想转身和坐在你身边的客人嘲笑他，但一回头，发现他跪在纳布面前，手里拿着钱包。纳布用一种奇怪的语言尖声吟唱着，双手放在他的头上，把他推倒在地，在场的人报以礼貌的掌声。“祈求者健康长寿；命定如此！”纳布用牙齿吸着空气，然后转向你，示意你走上前。"
 ambitions_inv_4_title:0 "来自东方的占星师"
 ambitions_inv_5.a:0 "在他们旁边支起帐篷，分发酒和肉。"
 ambitions_inv_5.b:0 "我一点儿也不相信这些人。取缔掉这个摊子。"
 ambitions_inv_5_desc:0 " [your_province_scope.GetArea.GetRegion.GetName] 今天天气很好。不合时节的宜人微风让你从工作中分心。感觉有点饿了，因此你前往市场，享受一次户外野餐。你聚集起随从，前往主广场，迎接你的是令人惊讶的景象。在一个帐篷前，人们排着长队，帐篷上挂着一个很大的彩绘海报；‘免费的面包’。街上满是嬉笑的孩子，他们互相追逐，咀嚼着小面包。您询问了几个人，才知道在过去的一周里，[scheme_target.GetName] 每天都在分发新鲜出炉的面包。随从给你带回来一个面包，当你看到 [scheme_target.GetFirstName] 的名字时，你皱起眉头，咬紧牙关；虽然这无疑是一种慷慨的姿态，但让你会感到一丝嫉妒的刺痛。如果你们的人民要享受免费面包，那我们才应该去分发！你想怎么做？"
 ambitions_inv_5_title:0 "分发免费面包"
 ambitions_inv_6.a:0 "实施制裁，要求他们偿还我……看我兴趣。"
 ambitions_inv_6.b:0 "以贪污罪囚禁 [scheme_target.GetName]。"
 ambitions_inv_6.c:0 "处决 [scheme_target.GetName]！"
 ambitions_inv_6_desc:0 "你收到了来自财务官的一份令人不安的，充满了确凿的证据的报告。[scheme_target.GetName] 一直在滥用你赋予他们的职权。你当时派 [scheme_target.GetFirstName] 去我们的一个军营监督训练，但分配的资金却没有用来给士兵们提供食物和装备，反而 [scheme_target.GetFirstName] 将超过三分之一的预算中饱私囊。你之前确实注意到了 [scheme_target.GetFirstName] 最近在宫廷中穿着的那些招风的服装。但你从未想过这些钱从哪里来的。多么厚颜无耻，竟敢在你眼前炫耀偷来的财富！你必须对此采取行动，以免其他人认为他们可以不受惩罚地揩油。"
 ambitions_inv_6_title:0 "宫廷中的腐败"
 ambitions_inv_7.a:0 "向 [scheme_target.GetFirstName] 发送消息，把那个谋杀犯抓回来，否则的话....."
 ambitions_inv_7.b:0 "不可容忍……立刻逮捕 [scheme_target.GetFirstName]。"
 ambitions_inv_7_desc:0 "作为责任的一部分，偶尔 [scheme_target.GetName] 会主持当地法院的案件，这些案件太微不足道了，根本不用打扰你；关于土地和财产的小纠纷，或关于遗产和嫁妆的争吵；都是我们争吵不休的生活中的琐碎不满。你本不愿听这些事情，但最近却恼怒地发现 [scheme_target.GetFirstName] 显然在一直公开收受贿赂，影响司法公正，把法庭变成拍卖会，贬低了我们的法院。就在最近，一个明显犯有谋杀罪的人——实际上是在刺死一名妇女的过程中被抓——把一袋银币交给了 [scheme_target.GetFirstName]，并立即被释放。当地民众已经开始抱怨司法不公，在事态发展到失控之前，应该采取一些措施。"
 ambitions_inv_7_title:0 "沾满铜臭的判决"
 ambitions_inv_8.a:0 "命令 [scheme_target.GetFirstName] 还回他们骗的每一分钱。"
 ambitions_inv_8.c:0 "逮捕 [scheme_target.GetFirstName]，然后把他们扔进地牢！"
 ambitions_inv_8.d:0 "我们在这件事上无能为力……"
 ambitions_inv_8_desc:0 "有一个复杂的司法问题在民众中引起了极大的恐慌，迫使你们在事态失控之前进行干预。这件事的恶名在全国都众所周知；虽然是一件复杂的法律事务，涉及到冗长的法规，但几乎每个人都知道其中的私密细节，这凸显了此案涉及到的巨大公众利益。\n\n上次战争中，在胜利似乎要从我们的指缝中溜走的绝望时刻，您下令由国家承担由私人承包商向前线运送粮食的费用，这违反了正常的军事惯例。你的军事补给线受到了敌人持续骚扰的威胁，尽管受到了一些顾问的质疑，但你还是推动了这项计划。正如预期的那样，你的聪明才智最终得到了回报，我们成功了，并最终取得了胜利；你以为事情已经结束了，开始收取战争赔款，并支付承包商的费用。正是在这个过程中，你发现了 [scheme_target.GetName]，该计划的主要参与者之一，伪造了 [scheme_target.GetHerHis] 所提交的报告。他们不仅把腐烂的食物送到前线——这对那些挨饿的士兵来说是一种冒犯，而且在事后提交了严重夸大的数字，诈骗了三倍的费用。\n\n冲突的痛苦在我们的民众的记忆中挥之不去，当这个案件的残酷细节开始披露时，公众非常愤怒。这一骗局被视为对我们军队和民众记忆的一种可怕的侮辱。舆论压倒性地反对 [scheme_target.GetFirstName]。但是你必须小心对待他们，以免你在贵族中树敌。毕竟，正是这些广泛的政治关系让 [scheme_target.GetFirstName] 的计划落地。把合同放在第一位。"
 ambitions_inv_8_title:0 "财政诈骗案"
 ambitions_inv_9.a:0 "[scheme_target.GetFirstName]，你得好好解释一下……"
 ambitions_inv_9.b:0 "罢了，把损失一笔勾销，忘掉它吧。"
 ambitions_inv_9_desc:0 "是时候派出税务员了，按照惯例，[scheme_target.GetName] 被委托监督 [scheme_target.GetHerHis] 家附近的省份的税收。这种安排在过去的几年里非常有效，使得你并不认为这次事情会有不同。尽管如此，当首都的会计室统计完最后的数字时，发现似乎收入大幅下降，这是没有道理的，尤其是考虑到你个人对该地区的投资。你知道尽管各地的形势都很艰难，但是40%的损失是前所未有的，没有理由会那么低。\n\n你知道，拿走几个硬币是征税的一部分；实际上，这就是收税员的火耗收入。但是 [scheme_target.GetName] 未免做得有点太过了。你要叫他们来站在你面前，告诉你所发生的事吗？"
 ambitions_inv_9_title:0 "火耗"
 challenge_duel:0 "来一场决斗"
 challenge_duel_act:0 "挑战你的仇敌，为荣誉和荣耀而战"
 challenge_duel_act_past:0 "[SCOPE.sChar('target').GetName] 已经同意决斗"
 challenge_duel_past:0 "只能有一个"
 challenge_duel_tt:0 "为了统治地位或者试图解除衰老的继任者对部落的领导权去 挑战一个#R 仇敌l#!。你的首领的军事技能将是影响成功....或者失败的基础。"
 character_interactions_1_tooltip:0 "#Y [target.GetFamily.GetName]#! 家族的所有成员将获得以下选择:"
 character_interactions_4.a:0 "很好！"
 character_interactions_4.b:0 "多么不幸...."
 character_interactions_4_desc_1:0 "[target.GetName] 已接受退休。我们再也不用应付他的那些可笑的行径了。"
 character_interactions_4_desc_2:0 "[target.GetName] 拒绝退休。我们仍然要面对他的存在……至少现在。"
 character_interactions_4_title:0 "退休"
 character_interactions_inv_1.a:0 "就这样吧。"
 character_interactions_inv_10.a:0 "很高兴知道这事。"
 character_interactions_inv_10_desc:0 "[bachelor_in_need_of_wife.GetName]尚未结婚。也许应该为他安排一场婚姻，以造福皇室和国家。"
 character_interactions_inv_10_title:0 "需要妻子"
 character_interactions_inv_1_desc:0 "如您所吩咐的那样，[target.GetName] 和 [target_spouse.GetName] 的婚姻已被强制分离。"
 character_interactions_inv_1_title:0 "强迫离婚"
 character_interactions_inv_2.a:0 "再见，[target.GetName]"
 character_interactions_inv_2_desc:0 "[target.GetName] 的条件对于 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 这样的人来说是不够的。因此，之前存在的任何婚姻上的安排现在都不存在了。"
 character_interactions_inv_2_title:0 "王室离婚"
 character_interactions_inv_3.a:0 "[target.GetName] 将淡出公众视野。"
 character_interactions_inv_3.b:0 "转念一想，这不是一个好主意。"
 character_interactions_inv_3_A_tooltip:0 "如果 [target.GetName] #G Accepts#! 他们将获得以下选择:\n"
 character_interactions_inv_3_B_tooltip:0 "\n如果 [target.GetName] #R Rejects#! 他们将获得以下选择:\n"
 character_interactions_inv_3_desc:0 "[target.GetName] 长时间以来一直是 [SCOPE.GetRootScope.GetCountry.GetName] 的眼中钉。迫使 [target.GetName] 退休对 [SCOPE.GetRootScope.GetCountry.GetName] 的所有人都有好处。"
 character_interactions_inv_3_title:0 "强迫退休"
 character_interactions_inv_5.a:0 "[target.GetName] 将加入 [ruler_family.GetName] 家族。"
 character_interactions_inv_5.b:0 "那没有必要。"
 character_interactions_inv_5_desc:0 "[target.GetName] 已经到达了我们的宫廷，但现在的问题是——他会成为 [ruler_family.GetName] 家族的一份子吗？"
 character_interactions_inv_5_title:0 "一位新公民"
 character_interactions_inv_6.a:0 "妙啊。"
 character_interactions_inv_6.b:0 "这帮不长眼的，下地狱去吧！"
 character_interactions_inv_6_desc_1:0 "[target.GetName] 接受了我们的建议，让 [target_employer.GetName] 成为 [target.GetHerHis] 的藩属直至其统治结束。当 [target.GetName] 死亡时， [target.GetEmployer.GetName] 的人们将决定他们未来的命运。"
 character_interactions_inv_6_desc_2:0 "[target.GetName] 拒绝了我们的提议……多么愚蠢。"
 character_interactions_inv_6_title:0 "提供支持"
 character_interactions_inv_7.a:0 "多么光荣！"
 character_interactions_inv_7.b:0 "那些傻瓜！！"
 character_interactions_inv_7_desc_1:0 "[supported_country.GetName] 已经决定，即使在 [dead_supported_ruler.GetName] 死后，他们也将继续作为我们的藩属。"
 character_interactions_inv_7_desc_2:0 "在 [dead_supported_ruler.GetName] 死后，[supported_country.GetName] 已经决定不再需要我们来统治他们……多么愚蠢。"
 character_interactions_inv_7_title:0 "[supported_country.GetName] 的未来"

 scheme.11.a:0 "令人震惊！"
 scheme.11.desc:0 "[ROOT.GetCharacter.GetEmployer.GetCapital.GetName] 的皇家图书馆多年来已被证明是一个丰富的知识宝库——今年似乎也不例外。在研究 [ROOT.GetCharacter.GetHerHis] 的血统时，[ROOT.GetCharacter.GetEmployer.GetRulerTitle] [ROOT.GetCharacter.GetPraenomen] 发现了一个藏在壁龛里的小石碑，似乎早已被人遗忘了。\n\n在石碑中那些难以释读的文字的记载中，详细描述了 [ROOT.GetCharacter.GetFamilyDisplayName] 家族的谱系，它似乎通过 [SCOPE.sChar('ancestor').GetName] 能追溯到传说中的血统。\n\n这些知识不能被埋没。"
 scheme.11.t:0 "古老的血统"
 scheme_ambition_invest_in_ports:0 "只要投入足够的资金，这个雄心壮志就会成功。"
 scheme_assimilate_pops_in_holding:0 "同化当地人"
 scheme_assimilate_pops_in_holding_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetName] 试图使 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 人口改信，转换为 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 文化。"
 scheme_convert_pops_in_holding:0 "使当地人改信"
 scheme_convert_pops_in_holding_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetName] 试图使 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 人口改信，转换为 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 宗教。"
 scheme_exploit_populous:0 "利用民众"
 scheme_exploit_populous_desc:0 "水能载舟，亦能覆舟。就像在太阳下生活和劳作的许多民族一样。一些统治者对待百姓就像对待自己的孩子一样，毫不为自己着想，为确保和平与繁荣而竭尽所能。然而，另一些人则认为人民只是另一种资源，一种可以为他们自己的自私目的而利用的资源。"
 scheme_exploit_populous_tooltip:0 "[SCOPE.GetRootScope.GetCharacter.GetName] 为了个人利益而剥削 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 所拥有的人口。"
 scheme_exploit_slaves:0 "利用奴隶"
 scheme_exploit_slaves_desc:0 "我们的奴隶是我们的私人财产，因此，没有人应该告诉我们可以或不能用我们的私人财产做什么。有些人可能会不合理地称之为‘剥削’，但必须承认的是我们需要让我们的投资物有所值。"
 scheme_increase_statesmenship:0 "关注政治才能"
 scheme_increase_statesmenship_desc:0 "政治才能有时比黄金还珍贵，一个有技巧的政治家可以利用它打开一直锁着的大门。提高一个人的政治才能是统治阶级的特权。这将确保他们继续在政治事务中占据主导地位。"
 scheme_invest_in_port:0 "港口投资"
 scheme_invest_in_port_desc:0 "[SCOPE.GetRootScope.GetCharacter.GetName] 正在投资在 [SCOPE.GetRootScope.GetCharacter.GetHerHis] 海岸建造一个港口。"
 scheme_promote_nobility:0 "增加贵族"
 scheme_promote_nobility_desc:0 "我们的繁荣把我们本身带到了新的高度，在我们周到的领导下，社会以前无法想象的方式蓬勃发展。通过接纳并加强上层阶级，我们整个社会都将受益。"
 scheme_ruler_corruption:0 "反腐败"
 scheme_ruler_corruption_desc:0 "太长时间以来，在分散精力管理我们的国家时，我们的耐心被滥用了。当我们忙于对付外国敌人的背信弃义时，不受遏制的腐败已经在我们的土地上蔓延；攘外必先安内。让我们尽我们所能结束这种对权威的侮辱。"
 scheme_ruler_popularity:0 "增加人气"
 scheme_ruler_popularity_desc:0 "这是真的，[your_scope.GetName]被我们国家的大多数民众所喜爱，我们当然有一些方法可以鼓励他们继续赞赏。让我们看看我们能不能做几件事来增加我们的人气；毕竟，我们有国家的大量资源可供支配，为什么不利用它们呢？"
 scheme_training_skill:0 "训练"
 scheme_training_skill_desc:0 "[ROOT.GetCharacter.GetName] 正在训练以提升自身！"

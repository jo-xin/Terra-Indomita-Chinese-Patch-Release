 EMPIRE_ABILITY_ELEVEN_TT:0 "#T $empire_ability_eleven_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_ELEVEN_TT_DESC$"
 EMPIRE_ABILITY_ELEVEN_TT_DESC:0 "#TF 借鉴好战的意大利人的尚武精神，我们的色雷斯军队比以往更加致命。#!"
 EMPIRE_ABILITY_FIVE_TT:0 "#T $empire_ability_five_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_FIVE_TT_DESC$"
 EMPIRE_ABILITY_FIVE_TT_DESC:0 "#TF 我们的国家由同一个民族的子民组成，朝着共同的目标奋进。#!"
 EMPIRE_ABILITY_FOUR_TT:0 "#T $empire_ability_four_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_FOUR_TT_DESC$"
 EMPIRE_ABILITY_FOUR_TT_DESC:0 "#TF 我们的海军是无可争议的海上霸主，任何来犯舰队皆可轻松击溃。#!"
 EMPIRE_ABILITY_NINE_TT:0 "#T $empire_ability_nine_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_NINE_TT_DESC$"
 EMPIRE_ABILITY_NINE_TT_DESC:0 "#TF 无人能挑战我们对印度次大陆的统治——#Y 婆罗多#!的力量无可匹敌！#!"
 EMPIRE_ABILITY_ONE_TT:0 "#T $empire_ability_one_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_ONE_TT_DESC$"
 EMPIRE_ABILITY_ONE_TT_DESC:0 "#TF 近来的胜利印证了上天的眷顾——除此之外别无解释。#!"
 EMPIRE_ABILITY_SEVEN_TT:0 "#T $empire_ability_seven_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_SEVEN_TT_DESC$"
 EMPIRE_ABILITY_SEVEN_TT_DESC:0 "#TF 我们缔造了一个强大的 #Y 非洲帝国#!，其荣耀与权势足以媲美亚细亚和印度的古代王国。#!"
 EMPIRE_ABILITY_SIX_TT:0 "#T $empire_ability_six_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_SIX_TT_DESC$"
 EMPIRE_ABILITY_SIX_TT_DESC:0 "#TF 我们的学者是技术奇才，揭示的数学秘密将对我们的工程师大有裨益。#!"
 EMPIRE_ABILITY_TEN_TT:0 "#T $empire_ability_ten_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_TEN_TT_DESC$"
 EMPIRE_ABILITY_TEN_TT_DESC:0 "#TF 亚历山大虽已离开尘世，他的功业记忆却永存于世，而他的权柄衣钵已归于我们。#!"
 EMPIRE_ABILITY_THREE_TT:0 "#T $empire_ability_three_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_THREE_TT_DESC$"
 EMPIRE_ABILITY_THREE_TT_DESC:0 "#TF 我们必须竭尽全力扩张疆土！#!"
 EMPIRE_ABILITY_TWO_TT:0 "#T $empire_ability_two_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_TWO_TT_DESC$"
 EMPIRE_ABILITY_TWO_TT_DESC:0 "#TF 我们随心所欲，无视成规，也不在乎那些受我们威胁之人的看法。#!"

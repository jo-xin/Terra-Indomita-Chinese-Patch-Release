 current_age_desc_custom_loc_1:0 "这是一个万象更新的时代，一处火焰熄灭，另一处取而代之。\n亚历山大早已离世，但他所引发的划时代事件才刚刚开始沉淀。\n阿契美尼德时代已被宙斯之子们彻底粉碎！"

 HELLENIC_OBJECTIVE_4_TITLE:0 "#bold 条条大路通罗马#!"
 HELLENIC_OBJECTIVE_5_DESC:0 "拥有至少 #E 10#! 座 [GetBuilding('academy_building').GetName|E] 建筑。"
 HELLENIC_OBJECTIVE_5_TITLE:0 "#bold 受过教育的一群#!"
 HELLENIC_OBJECTIVE_6_DESC:0 "作为 [GetCulture('macedonian').GetCultureGroup.GetName|E] 文化国家，且首都不在 [GetProvince('(int32)436').GetArea.GetRegion.GetName] 或 [GetProvince('(int32)373').GetArea.GetRegion.GetName]。将首都至少 #E 75%#! 的宗教转化为 [GetDeityDefinition('omen_serapis').GetReligion.GetName|E]。"
 HELLENIC_OBJECTIVE_6_TITLE:0 "#bold 希腊之道的传播#!"
 HELLENIC_OBJECTIVE_7_DESC:0 "拥有一支拥有至少 #E 15#! 个 [Concept('units', 'Units')|E] 的 [Concept('legion', 'Legion')|E]。"
 HELLENIC_OBJECTIVE_7_TITLE:0 "#bold 传奇军团#!"
 MIGRATION_ABILITY_EIGHT_TT:0 "#T $migration_ability_eight_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$MIGRATION_ABILITY_EIGHT_TT_DESC$"
 MIGRATION_ABILITY_EIGHT_TT_DESC:0 "#TF 我们的战斗能力在我们征服的草原地带中已磨砺得锋利无比——胆敢入侵我们家园的敌人必将遭遇厄运！#!"
 MIGRATION_ABILITY_ELEVEN_TT:0 "#T $migration_ability_eleven_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$MIGRATION_ABILITY_ELEVEN_TT_DESC$"
 MIGRATION_ABILITY_ELEVEN_TT_DESC:0 "#TF 塞迦人不再被束缚于群山与遥远的山谷之中——我们必须策马出征，夺回属于我们的东西！#!"

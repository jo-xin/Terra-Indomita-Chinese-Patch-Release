 EMPIRE_ABILITY_EIGHT_TT:0 "#T $empire_ability_eight_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$EMPIRE_ABILITY_EIGHT_TT_DESC$"

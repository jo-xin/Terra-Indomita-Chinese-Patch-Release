 MIGRATION_ABILITY_THREE_TT:0 "#T $migration_ability_three_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$MIGRATION_ABILITY_THREE_TT_DESC$"

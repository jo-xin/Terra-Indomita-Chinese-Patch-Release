 MIGRATION_ABILITY_FOUR_TT_DESC:0 "#TF 我们拥有宣称任何觊觎之领土的合法权力，至于理由，我们的讼师会很乐意为你解释。#!"
 MIGRATION_ABILITY_NINE_TT:0 "#T $migration_ability_nine_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$MIGRATION_ABILITY_NINE_TT_DESC$"
 MIGRATION_ABILITY_NINE_TT_DESC:0 "#TF 横跨草原与城邦之间，我们已兼收并蓄——斯基泰人主宰着他们渴望的一切！#!"
 MIGRATION_ABILITY_ONE_TT:0 "#T $migration_ability_one_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$MIGRATION_ABILITY_ONE_TT_DESC$"
 MIGRATION_ABILITY_ONE_TT_DESC:0 "#TF 在动荡不安的时代，一位强大将领的忠诚比钻石与黄金更珍贵。#!"

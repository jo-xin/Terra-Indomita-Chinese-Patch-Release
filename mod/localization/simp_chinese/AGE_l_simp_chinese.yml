 HELLENIC_ABILITY_TWO_TT_DESC:0 "#TF 在对外征服事务上，我们作为侵略者无可指责——我们所做的一切都是正当的。#!"
 HELLENIC_OBJECTIVE_1_DESC:0 "拥有一个具备 [GetProvinceRank('city_metropolis').GetName|E] 地位的领土。"
 HELLENIC_OBJECTIVE_1_TITLE:0 "#bold 伟大城市#!"

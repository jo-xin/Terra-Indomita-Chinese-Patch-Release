 HELLENIC_ABILITY_EIGHT_TT:0 "#T $hellenic_ability_eight_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_EIGHT_TT_DESC$"
 HELLENIC_ABILITY_EIGHT_TT_DESC:0 "#TF 马其顿至高无上，胜利的征召兵与军团得到了令人印象深刻的外交官与大使之网络的支持。#!"
 HELLENIC_ABILITY_ELEVEN_TT:0 "#T $hellenic_ability_eleven_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_ELEVEN_TT_DESC$"
 HELLENIC_ABILITY_ELEVEN_TT_DESC:0 "#TF \n我们显然必定是 #Y 阿吉德王室#! 的后裔，因为我们的事迹与成就早已超越了亚历山大本人的记忆。#!"
 HELLENIC_ABILITY_FIVE_TT:0 "#T $hellenic_ability_five_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_FIVE_TT_DESC$"
 HELLENIC_ABILITY_FIVE_TT_DESC:0 "#TF 我们的先知与预言家蒙受了神圣沟通的恩赐，开启人心，使其皈依正确的崇拜之道。#!"
 HELLENIC_ABILITY_FOUR_TT:0 "#T $hellenic_ability_four_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_FOUR_TT_DESC$"
 HELLENIC_ABILITY_FOUR_TT_DESC:0 "#TF 不论在陆地还是海上，我们的征召兵常常得到雇佣军的兵力补充。#!"
 HELLENIC_ABILITY_NINE_TT:0 "#T $hellenic_ability_nine_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_NINE_TT_DESC$"
 HELLENIC_ABILITY_NINE_TT_DESC:0 "#TF 统治像 #Y 孔雀#! 这样的庞大国家需要训练有素而高效的官僚体系。#!"
 HELLENIC_ABILITY_ONE_TT:0 "#T $hellenic_ability_one_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_ONE_TT_DESC$"
 HELLENIC_ABILITY_ONE_TT_DESC:0 "#TF 仁君的重要职责之一，便是在四方广建城市。#!"
 HELLENIC_ABILITY_SEVEN_TT:0 "#T $hellenic_ability_seven_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_SEVEN_TT_DESC$"
 HELLENIC_ABILITY_SEVEN_TT_DESC:0 "#TF 许多被征服的民族曾希望我们在他们土地上的存在只是暂时的，但他们开始接受：我们不会离开。#!"
 HELLENIC_ABILITY_SIX_TT:0 "#T $hellenic_ability_six_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_SIX_TT_DESC$"
 HELLENIC_ABILITY_SIX_TT_DESC:0 "#TF \n我们无畏的殖民者踏入未知的土地，追逐着新生活的梦想。#!"
 HELLENIC_ABILITY_TEN_TT:0 "#T $hellenic_ability_ten_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_TEN_TT_DESC$"
 HELLENIC_ABILITY_TEN_TT_DESC:0 "#TF 让一个新时代宣告到来吧，在这时代中，迦太基在公海上的至高无上之权威将得到公认。#!"
 HELLENIC_ABILITY_THREE_TT:0 "#T $hellenic_ability_three_mod$#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( Player.MakeScope ).End )]\n$HELLENIC_ABILITY_THREE_TT_DESC$"
 HELLENIC_ABILITY_THREE_TT_DESC:0 "#TF 在我们的 #T 军团#! 中服役是上层阶级能获得的最高军事荣誉之一，许多人渴望拥有这一殊荣。#!"

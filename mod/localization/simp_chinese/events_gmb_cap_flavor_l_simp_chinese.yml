l_simp_chinese:
 flavor_cap.1.a:0 "欧迈尼斯是我们合法的统治者！"
 flavor_cap.1.b:0 "阿里阿拉特的宣称是符合事实的!"
 flavor_cap.1.c:0 "根据征服权，我们为安提柯服务！"
 flavor_cap.1.d:0 "多么麻烦的时刻……"
 flavor_cap.1.desc:0 "虽然多年来卡帕多西亚一直在波斯人的控制之下，但在亚历山大大帝的征服下，该地区一直牢牢掌握在希腊人手中。在其总督，卡迪亚的欧迈尼斯的统治下，该行省在继业者战争期间为争夺控制权与更大荣耀而战。\n\n欧迈尼斯虽非马其顿人，却精妙地指挥着众多马其顿士兵，包括著名的银盾军。凭借勤勉、决心与睿智的指挥，他赢得了士兵们的敬重。然而欧迈尼斯新获得的权力戛然而止。\n\n在伽比埃奈战役中，欧迈尼斯虽赢得了战斗，却失去了对军队的控制。其部下银盾军的家眷被“独眼”安提柯扣为人质，因此他们背叛了他。使他落入安提柯之手，活活饿死。他的遗体被送回给他的家人，而忠于安提柯的马其顿人阿明塔斯将被任命为卡帕多西亚的新主人。\n\n有人或许以为局势已趋平稳，实则大错特错。阿明塔斯王朝的统治远未稳固：一方面，前波斯国王之子阿里阿拉特二世谋划收复故土，欲将希腊人逐出该地区；另一方面，卡迪亚的欧迈尼斯之子们密谋复仇，誓要为父雪耻。长子欧迈尼斯企图重掌卡帕多西亚，通过战场击溃安提柯王朝以恢复家族荣光。卡帕多西亚正悬于悬崖边缘——她将踏上何种征途？"
 flavor_cap.1.t:0 "卡帕多西亚陷入混乱！"
 flavor_cap.2.a:0 "和平是唯一的途径，我们在其他方面太忙了！\"！"
 flavor_cap.2.b:0 "我们将一举击溃叛乱!"
 flavor_cap.2.desc:0 "随着臭名昭著的将军兼总督卡迪亚的欧迈尼斯被打败，我们已经能够征服卡帕多西亚总督领了。不幸的是，我们忠诚的马其顿总督领似乎已经被篡夺了!  马扎卡发生了政变，我们的对手欧迈尼斯的儿子已经控制了局面，并宣布自己为巴西琉斯！此刻，我们被四面八方的敌人所包围。也许对我们来说，放弃我们在该区域的影响力，首先解决其他的继业者才是最明智的。在解决了他们之后，我们就可以进入失地，夺回属于我们的东西！或者，我们也可以将全部精力投入到对敌作战中！  另外，我们也可以把注意力完全转移到他们身上，现在就对他们进行打击!  我们要不要结束这种反叛行为，在欧迈尼德王朝的棺材里钉上一颗钉子？  该怎么做；是战争还是和平？"
 flavor_cap.2.t:0 "卡帕多西亚的政变!"
 flavor_cap.4.a:0 "卡帕多西亚终于安全了!"
 flavor_cap.4.desc:0 "好消息，巴西琉斯！从卡帕多西亚传来的报告称，我们的军队已经赢得了对这个反叛总督领的控制权斗争。我们现在终于可以专注于其他事务了。"
 flavor_cap.4.t:0 "我们的统治在卡帕多西亚得到加强"
 flavor_cap.5.a:0 "答案是明确的!我们稍后将重点讨论它们..."
 flavor_cap.5.b:0 "我们将一举击溃叛乱!"
 flavor_cap.5.desc:0 "有消息称，老国王阿里阿拉特的继承人阿里亚特斯二世，在附近的亚美尼亚王国的支持下，已经控制了卡帕多西亚的总督。这是不可能的!  我们可以向亚美尼亚人施压，让他们放弃对这位新国王的支持，从而为重新行使我们的控制权铺平道路，或者我们可以通过暂时放弃卡帕多西亚来解决争端......至少在我们击败剩余的继业者之前。一旦他们被打败，我们将返回并夺回属于我们的东西！\"！"
 flavor_cap.5.t:0 "卡帕多西亚的政变!"

l_simp_chinese:
 cult_choice_illyric:0 "选择一个教派"
 cult_choice_illyric_desc:0 "每个伊利里克的统治者都可以选择一个邪教来追随。现任统治者去世后，下一任统治者可以选择一个新的教派来跟随。"
 gallus_tt:0 "如果他还没有#Y 阉鸡#!特质，让你的牧师自我阉割。"
 illyric_flavor_1.a:0 "太阳的崇拜"
 illyric_flavor_1.b:0 "蛇的崇拜"
 illyric_flavor_1.c:0 "色雷斯骑士的崇拜"
 illyric_flavor_1.d:0 "狼崇拜"
 illyric_flavor_1.e:0 "掠夺者崇拜"
 illyric_flavor_1_desc:0 "每个伊利里克的统治者都可以选择一个邪教来追随。现任统治者去世后，下一任统治者可以选择一个新的教派来跟随。"
 illyric_flavor_1_title:0 "选择一个教派"
 illyric_flavor_2.a:0 "诸神保佑我们"
 illyric_flavor_2.b:0 "诸神保佑我的统治"
 illyric_flavor_2_desc:0 "这一天是如此美丽，一定是受到了神圣的太阳神的祝福。人们当然也相信如此!"
 illyric_flavor_2_title:0 "阳光普照的日子"
 illyric_flavor_3.a:0 "诸神的脾气..."
 illyric_flavor_3.b:0 "我们将表现出谦卑的态度来讨好他们"
 illyric_flavor_30.a:0 "我们将暂时提高税收"
 illyric_flavor_30.b:0 "我们将把这些用于政治目的"
 illyric_flavor_30_desc:0 "一位村民发现了一条宏伟而巨大的纯白色毒蛇。当然，这是诸神本身的化身！我们可能会利用这一点作为现任政府的筹码！我们也许可以利用这一点作为本届政府的筹码。"
 illyric_flavor_30_title:0 "发现白色毒蛇"
 illyric_flavor_31.a:0 "我们必须给大蛇送去祭品"
 illyric_flavor_31.b:0 "这将限制我们的政治灵活性"
 illyric_flavor_31_desc:0 "今天有几条大蛇袭击。人们想知道这是否由于他们对你的不认可！？"
 illyric_flavor_31_title:0 "蛇形攻击"
 illyric_flavor_3_desc:0 "已经有很多天没有太阳了。人们说，神灵已经抛弃了我们!"
 illyric_flavor_3_title:0 "沉浸在黑暗中的日子"
 illyric_flavor_60.a:0 "色雷斯骑士说话了。"
 illyric_flavor_60.b:0 "补偿大蛇崇拜者。"
 illyric_flavor_60_desc:0 "一个大蛇崇拜者很生气，因为一匹马踩到了一条大蛇，把它踩死了。我们应该怎么做才能纠正这种情况？"
 illyric_flavor_60_title:0 "蛇形崇拜者愤怒了"
 illyric_flavor_61.a:0 "为适当的问题保留我们的人。"
 illyric_flavor_61.b:0 "派遣骑兵来解决太阳的问题。"
 illyric_flavor_61_desc:0 "据报道，有人亵渎了一个太阳崇拜者的神殿。有关的太阳崇拜者要求我们找到罪魁祸首并杀死他们。我们应该怎么做？"
 illyric_flavor_61_title:0 "太阳崇拜者的困境"

 unlocks_chinese_traditions_tt:0 "解锁#Y 华夏#!传统组"
 unlocks_diyi_traditions_tt:0 "解锁氐人传统"
 wei_bloodline:0 "魏之血脉"
 wei_bloodline_desc:0 "魏人由粗犷的拓跋部民后裔所建。他们自北方南下，在数代之前摧毁了南方那些软弱而分裂的王国，是名副其实的战车之主。魏人对敌毫不留情，也对自身能力抱有极高信心。"
 wii_bloodline:0 "卫国血脉"
 wii_bloodline_desc:0 "在一段混乱而痛苦的岁月之后，周公旦决定在旧叛臣武庚所治之地建立卫国，并将平叛有功的康叔改封为卫国君主。卫人驾驭战车的本领，正是那段动荡岁月留下的遗产。"
 yamato_bloodline:0 "大和之血"
 yamato_bloodline_desc:0 "虽然学者之间对倭人的起源存在争议，有人引用权威文献《三国志》将血统与邪马台联系起来，但无人质疑这个王朝的古老性，以及他们统治的合法性。"
 yan_bloodline:0 "燕之血脉"
 yan_bloodline_desc:0 "燕人素以善于清算旧事著称，仿效先祖终结商朝的伟业。他们光荣的祖先武王，其名本有“武”之意，是一位战无不胜、名声卓著的战术家与将领；这些特质至今仍可在其后裔身上看见。"
 yue_bloodline:0 "越之血脉"
 yue_bloodline_desc:0 "越王为此血脉之始祖，相传是大禹后裔、夏帝少康庶子。有人仍记得这段不甚光彩的出身，但这些议论多半只敢私下流传；越人是无可匹敌的弓术大师，绝不会容忍旁人诋毁其祖先。"
 zhao_bloodline:0 "赵之血脉"
 zhao_bloodline_desc:0 "赵氏与秦人同祖，并以此为荣。然而赵人并非那种借他人荣光自夸之辈，也没有这个必要。赵人意志坚决、善于作战，完全有能力凭自身力量赢得胜利。"
 zhaoxian_bloodline:0 "朝鲜血脉"
 zhaoxian_bloodline_desc:0 "朝鲜血脉可追溯至久远的祖先箕子。史载其姓胥余，出身殷商。商周鼎革、天下动荡之际，太师箕子最终建立了自己的国度。朝鲜人以杰出外交闻名，其声誉往往先于使节而至。"
 zhongshan_bloodline:0 "中山国血脉"
 zhongshan_bloodline_desc:0 "中山血脉奠基者最早可考的记录，是中山文公。虽然中山文公的功绩未载于史书，但其故土周围发现的铭文可以见证他的事迹。中山骑兵被广泛认为是该地区最优秀的骑手，能够迅速击溃任何派来对抗他们的军队。"
 zhou_bloodline:0 "周国血脉"
 zhou_bloodline_desc:0 "周人来自一片饱经战争与毁灭的地区，而这些艰难岁月塑造出坚韧且决意坚定的人民。历史上，周人的敌人一直很难与他们作战，因为周人极擅战车作战，并愿意为赢得战斗承担巨大风险。"
 zou_bloodline:0 "邹国血脉"
 zou_bloodline_desc:0 "邹人是火神祝融的后裔，面对他们的战士与炽烈脾性时，这一点很容易显现。然而邹之火并非不加思索吞噬一切的野火；相反，邹人是自我克制的大师，这也造就了他们无可匹敌的军事纪律。"

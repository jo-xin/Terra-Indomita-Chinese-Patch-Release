l_simp_chinese:
 chinese_path_building_the_wall:0 "筑城修墙"
 chinese_path_building_the_wall_desc:0 "除了把筑城技术用于城市之外，在战国诸国、中原政权与北方诸民彼此纷争的时代，长城也正是借由这些方法修筑起来的。"
 chinese_path_favorable_geographical_conditions:0 "地利人和"
 chinese_path_favorable_geographical_conditions_desc:0 "即便中原看似是一片无边草海，也并不意味着这里没有战略回旋的余地。"
 chinese_path_follow_the_example_of_rong:0 "效法戎人"
 chinese_path_follow_the_example_of_rong_desc:0 "战国七雄的军队即使是骑兵也披挂重甲，而诸胡之军则轻装上阵，人马合一，机动强劲，进退迅速。除了北方与东方的胡人之外，西方的戎人也有另一套战法。若能学习他们的经验并用于我军，必定能让军队更加强大。"
 chinese_path_follow_the_example_of_yi:0 "师夷之长"
 chinese_path_follow_the_example_of_yi_desc:0 "居于南方深处的蛮夷在自己的故土几乎不可战胜。研究这些南蛮的经验，可以进一步提升军队战斗力。"
 chinese_path_good_management:0 "人口增长"
 chinese_path_good_management_desc:0 "战国时期的人口增长不仅带来了经济发展，也增加了可用兵员。"
 chinese_path_good_use_of_terrain:0 "善用地形"
 chinese_path_good_use_of_terrain_desc:0 "熟悉地形可以带来出其不意的胜利；许多军队因为直到为时已晚才发现山间隐蔽之处，最终遭到伏击并被摧毁。"
 chinese_path_iron_use:0 "铁器应用"
 chinese_path_iron_use_desc:0 "战国时期，铁制工具开始得到更广泛使用，因此军队的作战能力也随之增强。"
 chinese_path_junxian_system:0 "郡县制度"
 chinese_path_junxian_system_desc:0 "郡县制在战国时期逐渐确立。简单来说，旧的军事组织正在瓦解并分裂，而新的军事组织，也就是郡县军事组织，则不断成长发展。"
 chinese_path_recruiting_talented_people:0 "招贤纳士"
 chinese_path_recruiting_talented_people_desc:0 "若国王能听见首席顾问说“请勿担忧，主君；我们只会征召最优秀、最有才干的人”，那便是幸运。依赖世袭职位已经毁掉了许多王国。"
 chinese_path_retreat_to_advance:0 "以退为进"
 chinese_path_retreat_to_advance_desc:0 "撤退并不意味着失败；有时它也是战略的一部分。"
 chinese_path_take_the_supplies_from_the_enemy:0 "因粮于敌"
 chinese_path_take_the_supplies_from_the_enemy_desc:0 "既然粮食可以取自敌人，便可以以战养战；在补给线被拉得过长时，这尤其有利。为了解决粮食消耗与运输困难的问题，孙子也主张从敌方取得补给。"
 chinese_path_temporary_response:0 "临机应变"
 chinese_path_temporary_response_desc:0 "能够对周遭局势作出正确判断，并迅速组织人手，可以有效提高集结军队的效率；这正是我们目标所必需的能力。"
 chinese_path_training_priority:0 "教诫为先"
 chinese_path_training_priority_desc:0 "吴起在兵书中曾言，明智的将领会先以基本军纪训练士卒。"
 chinese_path_way_of_command:0 "用兵之道"
 chinese_path_way_of_command_desc:0 "战国时期出现的各种军事学说，使军队在战术上取得长足进步，尤其体现在士兵的有效部署上。"
 chinese_path_yizhan_system:0 "驿站制度"
 chinese_path_yizhan_system_desc:0 "驿站是传递军事情报的官员途中进食、休息和更换马匹之处。驿站之间的道路缩短了行程时间，使信息能够迅速流动。"
 chinese_philosophy:0 "华夏传统"
 chinese_philosophy_2:0 "氐人传统"
 chu_bloodline:0 "楚之血脉"
 chu_bloodline_desc:0 "正如史家司马迁所载，楚人出自传说中的黄帝之后。此家族的显赫声望与天生武略也印证了这一血统。楚人富有魅力、威仪卓著、意志坚定，尤善统御重步兵。"
 ea_tribal_path_all_hands_on_deck:0 "全民皆兵"
 ea_tribal_path_all_hands_on_deck_desc:0 "武艺传统使我们人人皆兵，让我们拥有比其他国家多得多的步兵。"
 ea_tribal_path_attacking_the_city:0 "攻城方略"
 ea_tribal_path_attacking_the_city_desc:0 "敌人修筑了宏伟城市，并不意味着我们束手无策。恰恰相反，我们有许多办法可以攻破城池！"
 ea_tribal_path_avoid_the_shortcomings:0 "扬长避短"
 ea_tribal_path_avoid_the_shortcomings_desc:0 "如果敌军以步兵为主，与其正面硬拼，不如改用灵活的骑兵作战。"
 ea_tribal_path_civilization:0 "文明经验"
 ea_tribal_path_civilization_desc:0 "学习其他文明的经验，尤其是那些我们终有一日可能与之冲突的文明，可以使我们变得更强。"
 ea_tribal_path_foot_archer_training:0 "草原弓手训练"
 ea_tribal_path_foot_archer_training_desc:0 "并非所有地形都适合骑兵，有时你需要依靠弓手赢得战斗。"
 ea_tribal_path_geographical_advantages:0 "地利优势"
 ea_tribal_path_geographical_advantages_desc:0 "在我们的领土上，我们自然掌握主动，而不堪重负的敌人将处处碰壁。"
 ea_tribal_path_let_others_work_for_us:0 "驱人效力"
 ea_tribal_path_let_others_work_for_us_desc:0 "作战并不一定要亲自进攻；事实上，让别人替你动手也完全可行。"
 ea_tribal_path_looting_in_all_directions:0 "劫掠四方"
 ea_tribal_path_looting_in_all_directions_desc:0 "除了利用本地劳力之外，我们还可以从其他地方夺取更多人口为己所用。"
 ea_tribal_path_pleasant_location:0 "宜居之地"
 ea_tribal_path_pleasant_location_desc:0 "部落生活更适合那些千百年来熟悉这片土地的人，远比拥挤城市更适合他们。"
 ea_tribal_path_riding_and_shooting:0 "骑射为本"
 ea_tribal_path_riding_and_shooting_desc:0 "与步兵相比，骑兵机动性极高，而骑射则把弓箭的远程优势与我方骑手的速度和机动性结合在一起。"
 ea_tribal_path_vast_territories:0 "广袤领土"
 ea_tribal_path_vast_territories_desc:0 "我国疆域辽阔，仅仅是规模本身便足以压倒敌人，使其在陌生土地上难以找到道路。"
 ea_tribal_path_warriors_creed:0 "不移之志"
 ea_tribal_path_warriors_creed_desc:0 "通过训练士兵，确保他们在未经考验便投入战斗前具备基本能力，可以显著增强他们的作战能力。"
 han_bloodline:0 "韩君的血脉"
 han_bloodline_desc:0 "韩之先与周同姓，姓姬氏。其後苗裔事晋，得封於韩原，曰韩武子。武子後三世有韩厥，从封姓为韩氏。"
 lu_bloodline:0 "鲁国血脉"
 lu_bloodline_desc:0 "鲁国国君为姬姓鲁氏，其祖先是鲁公，鲁公是周武王之弟周公旦之子。拥有鲁国血脉的将领以能鼓舞麾下战士而闻名，从而提升士气。"
 nii_bloodline:0 "倪国血脉"
 nii_bloodline_desc:0 "倪氏显祖之中有曹姓颜友。相传他是神话火神祝融之后，因此倪氏与邹氏亦可算远亲。"
 qii_bloodline:0 "齐国血脉"
 qii_bloodline_desc:0 "齐氏血脉源自陈厉公之子陈完。陈完本出春秋陈国，陈亡后逃往齐地，并改姓为田，以避族人所遭之祸。这段苦涩往事既未被遗忘，也未被宽恕。齐氏善于理财，也怀抱着足以由丰厚财力支撑的野心。"
 qin_bloodline:0 "秦之血脉"
 qin_bloodline_desc:0 "秦之血脉可追溯至神话中的颛顼。既然此脉出自五帝之一，凡有幸生于此王朝者，自然也承受着非凡天赋。以法家改革为根基的强盛之道，为秦人带来了远胜同侪的精密与效率。"
 song_bloodline:0 "宋国血脉"
 song_bloodline_desc:0 "宋人出自商王族兄长微子启之后。西周初年，周公旦辅佐周成王平定天下之乱，也为日后的成功磨砺了才能。依循“兴灭继绝”的军政原则，微子启最终在商旧都商丘建立宋国。因其尚武旧业，宋人尤善统率轻步兵，几乎无人能轻易阻挡。"
 teng_bloodline:0 "滕国血脉"
 teng_bloodline_desc:0 "滕国王室中的血脉源自周王族，因此对任何王室而言都是吉祥的增益。虽然滕人统治的领土狭小，但他们胸怀宽广，足以弥补任何想象中的不足。"
 too_many_austroneseans:0 "南岛语族人不应为国家而战"
 too_many_chinese:0 "华夏人不应为国家而战"
 too_many_eastern_steppes:0 "东部草原诸族不应为国家而战"
 too_many_japanese:0 "弥生人不应为国家而战"
 too_many_tibetans:0 "吐蕃人不应为国家而战"

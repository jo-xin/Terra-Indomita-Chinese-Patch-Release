 VINDELICIA_NAME:0 "温德利西亚"
 alania_formable_prov_darn:0 "我们或我们的附属国拥有#Y 达恩#!的阿兰部分（#Bold 省份#!）。"
 alania_formable_prov_durse:0 "我们或我们的附属国拥有#Y 杜尔塞#!的阿兰部分（#Bold 省份#!）。"
 alania_formable_prov_zhalaqana:0 "我们或我们的附属国拥有#Y 扎拉卡纳#!的阿兰部分（#Bold 省份#!）。"
 argead_restoration_tt:0 "我们将恢复旧日的阿吉德王朝。"
 become_gallus:0 "自我阉割"
 become_gallus_desc:0 "由于我们统治者的狂热性，他们可能会阉割自己，就像库柏勒的圣祭司一样，以显示对库柏勒的配偶阿提斯的崇敬。"
 become_regency:0 "任命一位摄政王"
 become_regency_desc:0 "[COUNTRY.GetName]很快就要开战了。我们的[COUNTRY.GetRulerTitle][COUNTRY.GetRuler.GetName]必须指导前线，因此将任命一位摄政王来管理他的位置。摄政王将管理首都地区并指挥该地区的军队，而[COUNTRY.GetRuler.GetName]则指挥军团的精锐士兵或出海指挥海军。你可以根据激活的理念数量获得政治影响力!"
 chaukia_terp:0 "安西瓦里亚的台地"
 chaukia_terp_desc:0 "根据弗里西亚人的例子，在[GetProvince('(int32)3836').GetName]建造台地的条件非常理想。这将为我们的人民提供更多的土地，因为这是一个人造的居住土丘，可以在风暴潮、高潮和海洋或河流洪水期间提供安全的土地。"
 convert_to_agama:0 "拥抱阿迦摩信仰"
 convert_to_agama_desc:0 "达罗毗荼人的印度教信仰是古老的，可以追溯到文明的黎明。让我们在我们的臣民和宫廷中推广阿伽马。"
 convert_to_ajivika:0 "拥抱正命派"
 convert_to_ajivika_desc:0 "伟大的末伽梨·瞿舍罗向他的正命派宣扬他的教义。他宣扬命运是绝对的，一切都已注定。让我们服从我们的命运，拥抱正命。"
 convert_to_anahitic_religion:0 "接受亚美尼亚信仰"
 convert_to_anahitic_religion_desc:0 "阿娜希特崇拜者遍布我们国家。它已证明是一种受欢迎的宗教，其对我们本地神灵的适应性非常强。或许是时候正式接受这种亚美尼亚宗教，并称其为我们的信仰。"
 convert_to_anatolian_religion:0 "接受安纳托利亚信仰"
 convert_to_anatolian_religion_desc:0 "对母神的信仰一直是我们信仰中所有其他神灵的重要信仰，但最近其他信仰显然有所减少。库柏勒，母神，已成为我们宗教传统和实践中最重要的人物。"
 convert_to_berber_religion:0 "拥抱阿马齐格传统"
 convert_to_berber_religion_desc:0 "尽管阿马兹格人的信仰曾经受到他们邻居的启发和影响，但他们现在反过来影响了我们。我们的人民已经开始接受沙漠部落的信仰，像看待任何当地的神灵一样看待南娜-塔拉和沙赫德。"
 convert_to_burmese_religion:0 "拥抱纳特崇拜"
 convert_to_burmese_religion_desc:0 "世界东南部人民的宗教已经传播到我们这里。他们说，每个生物都有纳特，纳特在每个生物中。也许我们应该正式接受纳特崇拜。"
 convert_to_eastern_animism:0 "接纳斯万乔信仰"
 convert_to_eastern_animism_desc:0 "斯万乔与门雅女神在我们的土地上广受崇奉，凯姆与科姆的神像也遍布民居。如今，国家也应当接纳吐火罗与塔里木盆地的诸神，将其奉为自身信仰的一部分。"
 convert_to_hinduism:0 "拥抱吠陀信仰"
 convert_to_hinduism_desc:0 "让《吠陀》和古印度的古老教义成为我们国家的官方政策，让我们在我们的臣民和宫廷中推广《吠陀》。"
 convert_to_illyrian_pantheon:0 "拥抱伊利里亚多神教"
 convert_to_illyrian_pantheon_desc:0 "伊利里亚人的信仰来自古老的古巴尔干地区的信仰。伊利里亚多神教曾经与扎尔莫克西亚和赛贝里尼同属一个信仰，但在其分散的教派中却显得与众不同。北方的太阳崇拜，南方的蛇神崇拜，以及来自东方的新的色雷斯骑士崇拜。也许我们应该采用伊利里亚多神教的信仰，并将其中的一个教派作为我们自己的信仰。"
 convert_to_italic_pantheon:0 "接受意大利信仰"
 convert_to_italic_pantheon_desc:0 "意大利的信仰与古老的拉丁信仰相同，并已传播到各地。让我们接受意大利的信仰，并追求这些宗教之一作为我们的信仰。"
 convert_to_mithra_religion:0 "接受密特拉信仰"
 convert_to_mithra_religion_desc:0 "我们注意到太阳神密特拉及其密特拉信仰的盛行。来自米底的贤士祭司无疑是一个有说服力的实体。我们的国家可能会受益于接受密特拉和密特拉教的实践。"
 convert_to_nilotic_pantheon:0 "接受尼亚利克信仰"
 convert_to_nilotic_pantheon_desc:0 "尼罗河上游人民崇拜的天空之灵（Kowth Nhial）和许多科洛维克的崇拜已在我们的土地上广泛传播。或许是时候接受上尼罗河的神灵作为我们人民的神灵了。"
 convert_to_nuragic_pantheon:0 "接受努拉吉信仰"
 convert_to_nuragic_pantheon_desc:0 "撒丁岛和科西嘉岛的努拉吉人的本土宗教是一种延续千年的传统。伟大的努拉吉之父吸引我们崇拜他。让我们接受这种宗教的崇拜和信仰。"
 convert_to_pre_indo_european_religion:0 "接受玛丽特信仰"
 convert_to_pre_indo_european_religion_desc:0 "我们越来越多的人正在寻求马利特的神父的忠告,在山上的女神 ,向Aatxe献祭以换取庇护，对我们来说是要正式接受他们的信仰了。"
 convert_to_puntic_religion:0 "接受瓦卡"
 convert_to_puntic_religion_desc:0 "多年来，在我们港口的商人一直在谈论被称为瓦卡（Waaq）的至高无上的神，没有其他神可以和他相提并论，他永无休止的爱和神圣权威的故事引起了我们人民的共鸣，他们寻求成为他的孩子。也许我们都可以寻求瓦卡的舒适怀抱？"
 convert_to_vaksh_religion:0 "接受瓦赫什信仰"
 convert_to_vaksh_religion_desc:0 "瓦赫什河的宗教信仰在我们管理的土地上已广泛传播。人们在日出时崇拜太阳神密尔·奥伊尔，并以人民之神拉姆塞特命名他们的孩子。让主维什引领我们走向启蒙，崇拜瓦赫什及其神圣的神灵。"
 create_spartan_empire:0 "斯巴达帝国"
 create_spartan_empire_desc:0 "[COUNTRY.GetRuler.GetName]，在征服的荣耀中熠熠生辉，让所有其他的小王国黯然失色；需要给[COUNTRY.GetAdjective]帝国的统治者一个新的称号。"
 cyr_libyan_influences:0 "希腊-利比亚城市"
 cyr_silted_harbour:0 "淤塞港口"
 cyr_treasure_serpent_of_slonta:0 "大利比亚蛇"
 cyr_treasure_serpent_of_slonta_desc:0 "一幅由古代利比亚人创造的巨蛇石雕，用来崇拜他们的蛇神。"
 deify_spartan_emperor:0 "神化斯巴达皇帝"
 deify_spartan_emperor_desc:0 "很少有人否认[COUNTRY.GetRuler.GetName]是有福的。因此，这种神圣的遗产只能是一个神圣的存在的财产。"
 desc_cyr_libyan_influences:0 "这座城市有着悠久的历史，希腊定居者和利比亚本地人并肩生活。"
 desc_cyr_silted_harbour:0 "作为这个城市港口的天然泻湖被淤塞，使得船只难以在这里停靠。"
 egypt_mission_3_empire_task_1a:0 "重建城市"
 embellish_suebi_grave_fields:0 "修葺苏维汇人的坟茔"
 embellish_suebi_grave_fields_desc:0 "许多死去的战士被安葬在 #Y 拉基部赖翁#! 的墓地中，他们的家人被埋葬在他们旁边，他们的灵魂在复杂的火葬仪式中被释放到来世。他们都以自己的方式为我们服务得很好。他们的最后安息之地已经被遗弃了几十年，现在处于可悲的状态。\n如果我们美化和修复他们的墓地，他们释放的灵魂可能会从来世俯视我们。死者值得被纪念他们所完成的事迹。"
 form_abasgia:0 "建立阿布哈兹"
 form_abasgia_desc:0 "通过击败和征服周围的各种部落，形成一个强大的国家，我们向世界证明我们不仅仅是野蛮人，而是新王国——阿布哈兹的缔造者！"
 form_alania:0 "成立阿兰尼亚"
 form_alania_desc:0 "分裂和无领导，阿兰尼人一再被更强大的部落推向西部，被迫定居在最糟糕的放牧地。通过将我们的亲属整合在一个部落之下，我们将处于支配萨尔马提亚人的首要位置，并确保我们作为草原上的马主的合法地位。"
 form_arabia:0 "成立阿拉伯"
 form_arabia_desc:0 "世代以来，阿拉伯一直是贸易的枢纽，为世界主要文明提供乳香和没药，但我们的伟大潜力却被该地区许多支离破碎的部落和王国所浪费，他们彼此之间发动战争，而不是合作。通过统一半岛，我们可以从沙地上打造出一个可以与埃及和波斯相媲美的文明。"
 form_germania:0 "成立日耳曼尼亚"
 form_germania_desc:0 "日耳曼的各个部落各自强大，但如果没有一个强有力的领袖来领导他们，我们仍然只是一个独立的部落，忙于陷入内讧，而无法参与等待我们的更大的荣耀。通过征服和废除我们弱小而短视的对手，我们将能够宣布一个能够发动泰坦战争的日耳曼帝国，在未来的一千年里，这将成为传说，而大陆的统治权将是我们的!"
 form_indger:0 "建立印度-日耳曼王国"
 form_indger_desc:0 "我们的迁徙已经远远超出了我们日耳曼人的故乡，在兴都库什山脉的东边找到了一片富饶的土地。有了这个地方作为我们新国家的基础，我们的人民就能繁荣起来。"
 form_liguria:0 "建立利古里亚"
 form_liguria_desc:0 "几千年来，利古里亚人一直坚守在山南高卢，分散地生活在各个小部落之间，在田间辛苦劳作。然而，一个新的南方力量正在崛起，如果不加以限制，可能威胁到我们的生存，为了对抗这种威胁，我们必须联合起来，组建一个泛利古里亚联邦，以此对抗能够征服我们的那些人。"
 form_massagetia:0 "成立马萨革泰"
 form_massagetia_desc:0 "我们曾经是该地区的主导力量，以突袭和恐吓邻国而闻名，甚至不惜杀死居鲁士本人。然而，我们的力量被大流士打碎了，他迫使我们屈服于他的权威。现在，随着波斯人的离去，他们的土地陷入混乱，我们可以与其他马萨革泰部落联合起来，夺回我们在草原上的合法地位。"
 form_neo_mitanni:0 "复兴米坦尼王国"
 form_neo_mitanni_desc:0 "很久以前，伟大的米坦尼人被亚述人摧毁，他们的人民被屠杀，他们的城市化为灰烬。现在我们控制了他们的旧土地，我们可以宣布自己是他们骄傲的遗产的继承人，并迎来米坦尼文明的复兴。"
 form_piaoyue:0 "成立骠越"
 form_piaoyue_desc:0 "苯教、吠陀教和纳提信仰相遇的土地长久以来一直是促进跨区域内各种截然不同的人之间的商品和思想交流的十字路口。然而，多样性中有力量，骠越人的土地展示了这一点。"
 form_punt:0 "建立蓬特"
 form_punt_desc:0 "从阿杜利亚到阿波科帕，几代人以来，蓬特一直处于商业贸易的十字路口，来自非洲的象牙，阿拉伯的乳香，甚至还有来自遥远印度的香料，都在她的港口流转。如果将该地区的各个城市和领域团结在我们的旗帜下，我们将能够垄断贸易，获得超乎我们想象的巨大财富。"
 form_scandia:0 "建立斯堪地亚"
 form_slavia:0 "组建斯拉维亚"
 form_slavia_desc:0 "我们斯拉夫人数千年来一直生活在已知世界的边界，在辽阔森林中勉强维生。然而尽管我们彼此相似，却仍分散割裂，仿佛不同民族一般生活，并为琐碎轻蔑和无意义仇怨相互争斗。如果我们崛起并征服其余同族，就能宣告一个从波罗的海延伸到草原的泛斯拉夫联邦，足以压服那些愚蠢到胆敢挑战我们的人。"
 form_suania:0 "苏阿尼亚"
 form_suania_desc:0 "从高加索的高处，我们将插上我们的旗帜，苏阿尼亚的旗帜，在最高的山峰上——让我们向地球宣告一个征服者的国家已经胜利！"
 form_tibetan_empire:0 "建立吐蕃"
 form_tibetan_empire_desc:0 "吐蕃一直与世隔绝，孤立在庇护我们的众多山峰之上，然而，我们严酷而险恶的土地不会永远保护我们，迟早，我们的一切将被一支强大而可怕的力量征服，为了生存，我们必须结束与世隔绝的生活，并且积极征服我们的邻居 。高原被牢牢地抓紧在我们的手心内，我们可以宣称一个光荣的能够从世界之巅投射力量和影响力的吐蕃帝国！"
 form_vindelicia:0 "建立温得利基亚"
 form_vindelicia_desc:0 "阿尔卑斯山的岩石山脚下，各个分裂的温德利西亚部落居住着，我们的分裂和分裂使得邻近的日耳曼和凯尔特部落可以肆无忌惮地突袭和掠夺我们；如果我们能够在一个领袖下联合和巩固其他温德利西亚部落，我们可以协调我们的力量并击退那些敢于征服我们的人。"
 formable_not_alania_exists:0 "#Y 阿兰尼亚#! 必须不存在。"
 formable_not_arabia_exists:0 "#Y 阿拉伯#! 必须不存在。"
 formable_not_germania_exists:0 "#Y 日耳曼尼亚#! 必须不存在。"

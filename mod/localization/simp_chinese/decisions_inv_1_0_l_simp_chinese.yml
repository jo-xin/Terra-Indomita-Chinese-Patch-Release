 formable_not_massagetia_exists:0 "#Y 马萨革泰#! 必须不存在。"
 formable_not_neo_mitanni_exists:0 "#Y 新米坦尼王国#! 一定不存在。"
 formable_not_punt_exists:0 "#Y 蓬特#! 不存在."
 formable_not_slavia_exists:0 "#Y 斯拉维亚#! 不存在."
 indger_not_exists:0 "#Y 印度-日耳曼王国#!必须不存在。"
 inherit_scandia_provinces_tooltip:0 "征服所有 $herulia_area$、$east_gothia_area$、$west_gothia_area$ 和 $ultima_thule_area$ 地区的领土。"
 make_gallus:0 "命令祭司成为阉祭官"
 make_gallus_desc:0 "阉祭官是库柏勒崇拜的祭司或圣人。像女神的配偶阿提斯一样，他们会在狂热中自我阉割，并专门穿着女性服装。让我们继续这种做法，让我们的最高祭司自我阉割。\n\n你可以每25年这样做一次。"
 massagetia_formable_prov_chach:0 "我们或我们的附属国拥有#Y 石国#!的马萨革泰部分（#Bold 省份#!）。"
 massagetia_formable_prov_chomaria:0 "我们或我们的附属国拥有#Y 科马里亚#!的马萨革泰部分（#Bold 省份#!）。"
 massagetia_formable_prov_darn:0 "我们或我们的附属国拥有#Y 达恩#!的马萨革泰部分（#Bold 省份#!）。"
 natic_flavor.1.a:0 "我们将接受纳特信仰"
 natic_flavor.1.b:0 "不，我想我不愿意"
 natic_flavor.1.desc:0 "骠族的迁徙已经彻底确立在这些曾被骠文化占据的土地上。随着我们人民的定居，大多数人都接受了纳特信仰，而不是我们藏族祖先的信仰。事实上，纳特宗教比我们旧有的信仰更好地反映了我们的信仰。让我们正式进行变革。"
 natic_flavor.1.t:0 "骠人对纳特信仰的采纳"
 parsa_restored:0 "光复的帕萨"
 proclaim_punic_republic:0 "拥护布匿共和主义"
 proclaim_punic_republic_desc:0 "腓尼基的继承人在治理时既注重共和制的传统，又注重精明的商业行为，这确实是对[COUNTRY.GetName]最好的政府形式。"
 pyu_natic_convert.tt:0 "首都中最多有#G 20#!个人口转信#E 纳特宗教#!。"
 restore_argead_dynasty:0 "恢复阿吉德王朝"
 restore_argead_dynasty_desc:0 "[COUNTRY.GetRuler.GetName]，马其顿的统治者，诸王之座的主人，决定恢复阿吉德王朝，因着他拥有阿吉德的血脉。"
 restore_parsa:0 "光复帕尔萨"
 restore_parsa_desc:0 "恢复帕尔萨昔日的辉煌将是明智的。"
 revert_regency:0 "废除摄政王"
 revert_regency_desc:0 "现在是[COUNTRY.GetCoRulerTitle][COUNTRY.GetCoRuler.GetName]恢复对政府事务全面控制的最好时机。你可以根据激活的理念数量获得政治影响力！"
 switch_characters_to_mitanni_culture:0 "我们以前的主要文化的主要家族中的所有人物都将转换为#Y 新米坦尼#! 文化。"
 switch_to_mitanni_culture:0 "我们将采用#Y 新米坦尼人#! 作为我们的主要文化，我们国家所有以前的主要文化的人口都将转化为它。"
 tibetan_empire_not_exists:0 "#Y 吐蕃#! 必须不存在."
 tibetan_empire_prov_chomolangma:0 "我们或我们的附属国拥有#Y 珠穆朗玛#!的吐蕃部分（#Bold 省份#!）。"

l_simp_chinese:
 me_thrace_2_paper_kingdom.1.a:0 "这些野蛮人相比不可能的任务有什么机会？"
 me_thrace_2_paper_kingdom.1.desc:0 "亚历山大去世后，他的帝国被瓜分，吕西马科斯获得了色雷斯总督领。这个礼物其实是个毒果，因为虽然这个地区在纸面上富庶且强大，但马其顿人对它的控制从未超过脆弱的程度。\n\n曾被腓力二世征服的色雷斯部族，名义上是色雷斯统治者的臣民，却一再表现出不忠和背叛。更往北，隔着宽阔的伊斯特罗斯河，是盖泰人的土地，他们经常越过河流浅滩，袭扰波恩图斯厄克西努斯西岸的希腊殖民地——这些城市正是该总督辖区的财富宝库。与此同时，色雷斯作为希腊和亚洲世界的桥梁，通过控制赫勒斯滂海峡，迟早会有人企图侵略对方，并派军队穿过色雷斯发起进攻。\n\n数十年来，吕西马科斯凭借狡诈、外交手腕和卓越的军事才能，成功躲避了继业者战争的纷争，同时击退了来自北方蛮族的每一次威胁——在诸多困难中维持了总督领的完整。如今，不可能已被实现，剩下的工作则相对容易。如果[ROOT.GetCountry.GetRuler.GetName]想要匹敌其他继业者的力量，并赢得[ROOT.GetCountry.GetRuler.GetHerHis]自封的[ROOT.GetCountry.GetRulerTitle]称号，这个“纸面王国”必须被真正地转变成一个强大且稳定的现实王国。正如智者所言：“色雷斯人若团结，将是世界上最不可战胜、最强大的民族。”"
 me_thrace_2_paper_kingdom.1.t:0 "纸上王国"
 me_thrace_2_paper_kingdom.10.a:0 "我们的人民关系越来越紧密。"
 me_thrace_2_paper_kingdom.10.a_tt:0 "未来[GetCountry('ODR').GetAdjective|Y]叛乱的可能性减少。"
 me_thrace_2_paper_kingdom.10.desc:0 "[GetCountry('ODR').GetAdjective]对我们提议的回应非常积极！虽然他一直不愿做出任何有约束力的承诺，但显然[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetPraenomen]已经被我们改善两国关系的真诚愿望所说服。"
 me_thrace_2_paper_kingdom.10.t:0 "[GetCountry('TRE').GetAdjective]谈判成功"
 me_thrace_2_paper_kingdom.11.a:0 "这是最好的选择。"
 me_thrace_2_paper_kingdom.11.desc:0 "鉴于最近授予[GetCountry('ODR').GetName]的独立，我们正在进行的谈判不再有任何意义，因此我们召回了使者。"
 me_thrace_2_paper_kingdom.11.t:0 "[GetCountry('ODR').GetAdjective]谈判结束"
 me_thrace_2_paper_kingdom.12.a:0 "我们将在长矛尖上提出我们的条款！"
 me_thrace_2_paper_kingdom.12.desc:0 "由于关系已经恶化到战争的地步，继续与[GetCountry('ODR').GetName]的愚蠢谈判已没有任何意义。"
 me_thrace_2_paper_kingdom.13.a:0 "这是个好消息！"
 me_thrace_2_paper_kingdom.13.desc:0 "我们的宗主[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]再次展开了外交攻势，[GetCountry('TRE').GetAdjective]的使节抵达，提出在自治和承认我们影响力的问题上做出重大让步，这些一直是我们敌对的原因。"
 me_thrace_2_paper_kingdom.13.t:0 "[GetCountry('TRE').GetName]做出让步"
 me_thrace_2_paper_kingdom.14.a:0 "也许我们不再需要这么做了。"
 me_thrace_2_paper_kingdom.14.desc:0 "[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]发起的外交魅力攻势无疑已取得成果。[GetCountry('ODR').GetName]的舆论现在已明确转向支持[GetCountry('TRE').GetRuler.GetPraenomen]，[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetPraenomen]将难以像以前那样轻易动员人民对抗我们的宗主。"
 me_thrace_2_paper_kingdom.14.t:0 "赢得忠诚"
 me_thrace_2_paper_kingdom.15.a:0 "我们必须准备迎接他们！"
 me_thrace_2_paper_kingdom.15.desc:0 "使者通知我们，[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]正在集结[GetCountry('TRE').GetRuler.GetHerHis]的部队，准备进军[GetCountry('ODR').GetName]！我们显然再次激怒了马蜂窝……"
 me_thrace_2_paper_kingdom.15.t:0 "[GetCountry('TRE').GetName]准备惩罚性战争"
 me_thrace_2_paper_kingdom.15_tt:0 "@[GetCountry('TRE').GetFlag]！[GetCountry('TRE').GetName|Y]将在90天内#R宣战#!"
 me_thrace_2_paper_kingdom.16.a:0 "一切都完了！"
 me_thrace_2_paper_kingdom.16.desc:0 "我们的灾难！\n\n在[GetProvince('(int32)478').GetName]沦陷敌手后不久，该死的[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]放任[GetCountry('TRE').GetRuler.GetHerHis]士兵袭击这座无助的城市及其居民。我们寺庙、宫殿和纪念碑在无尽的怒火中被洗劫一空，城市被烧毁到地基，其遗迹被推倒，我们的人民被屠杀，幸存者四散逃亡。\n\n我们的骄傲，[GetProvince('(int32)478').GetName]，我们力量和主权的象征，不复存在。"
 me_thrace_2_paper_kingdom.16.t:0 "摧毁[GetProvince('(int32)478').GetName]"
 me_thrace_2_paper_kingdom.17.a:0 "侮辱！"
 me_thrace_2_paper_kingdom.17.desc:0 "[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetName]完全拒绝了我们改善两国关系的尝试。我们的使者被冷酷地解雇，并被送回，甚至没有先接受我们的礼物！"
 me_thrace_2_paper_kingdom.17.t:0 "[GetCountry('ODR').GetAdjective]谈判失败"
 me_thrace_2_paper_kingdom.18.a:0 "让所有人见证叛徒的命运。"
 me_thrace_2_paper_kingdom.18.desc:0 "我们对奥德里西亚人的复仇已经实施。[GetProvince('(int32)478').GetName]的任何建筑都未能幸免，其人民被屠杀，幸存者四散逃亡。\n\n这座他们在傲慢中建造的、试图媲美马其顿辉煌的城市已不复存在。"
 me_thrace_2_paper_kingdom.19.a:0 "我们别无选择。"
 me_thrace_2_paper_kingdom.19.b:0 "我们不会轻易放弃自由！"
 me_thrace_2_paper_kingdom.19.desc:0 "来自[GetCountry('TRE').GetName]的使者抵达，要求[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetRuler.GetName]向[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetName]效忠。如果我们拒绝，可能会爆发战争。"
 me_thrace_2_paper_kingdom.19.t:0 "[GetCountry('TRE').GetName]要求服从"
 me_thrace_2_paper_kingdom.2.a:0 "现在我们的敌人可以感受到我们全力以赴的关注……"
 me_thrace_2_paper_kingdom.2.a_tt:0 "任务'#Y $thracian_02_paper_kingdom$#!现已#G 完成#!!"
 me_thrace_2_paper_kingdom.2.desc:0 "[ROOT.GetCountry.GetRuler.GetName]以自身之名，终于将色雷斯总督领名义上的领土统一于麾下，完成了当初赐予我家族这毒礼之人所设下的不可能任务。虽历经漫长岁月，但那些曾幸灾乐祸者，此刻定已笑不出来了。让我们的敌人战栗吧——那些曾企图以分裂瓦解我们的部族，如今正以团结坚不可摧之势，化作所向披靡的铁骑奔赴他们的方向。"
 me_thrace_2_paper_kingdom.2.t:0 "不再是纸上谈兵"
 me_thrace_2_paper_kingdom.20.a:0 "这是一个良好合作关系的开始。"
 me_thrace_2_paper_kingdom.20.desc:0 "我们的使节已经带回消息：[tre_northern_tribe.GetRuler.GetName]已按我们的要求，正式宣誓效忠。"
 me_thrace_2_paper_kingdom.20.t:0 "[tre_northern_tribe.GetName]提出臣服"
 me_thrace_2_paper_kingdom.21.a:0 "[tre_northern_tribe.GetRuler.GetPraenomen]会为此后悔的……"
 me_thrace_2_paper_kingdom.21.desc:0 "我们的使节告知我们，[tre_northern_tribe.GetRuler.GetName]拒绝宣誓效忠！"
 me_thrace_2_paper_kingdom.21.t:0 "[tre_northern_tribe.GetName]拒绝臣服"
 me_thrace_2_paper_kingdom.22.a:0 "我们的敌人将在我们全力以赴时颤抖！"
 me_thrace_2_paper_kingdom.22.desc:0 "今天，[ROOT.GetCountry.GetRulerTitle][ROOT.GetCountry.GetPraenomen]达成了连腓力二世和亚历山大大帝都未能完成的壮举——整个色雷斯的理论边界牢牢掌握在[ROOT.GetCountry.GetRuler.GetHerHis]控制之下。随着色雷斯部落的平定，强大的伊斯特罗斯河可以作为北方敌人的天然屏障，让我们终于可以将注意力转移到其他地方。"
 me_thrace_2_paper_kingdom.22.t:0 "从纸上到现实"
 me_thrace_2_paper_kingdom.23.a:0 "让我们的敌人现在试图通过。"
 me_thrace_2_paper_kingdom.23.desc:0 "[GetProvince('(int32)350').GetName]的防御工事扩建工程已圆满完成，巍峨的城墙和新塔楼俯视着从色雷斯海峡进入色雷斯本土的沿海道路。这座城市应该能更好地抵御任何试图跨越赫勒斯滂的入侵者，同时也使他们的通过更加困难。"
 me_thrace_2_paper_kingdom.23.t:0 "赫勒斯滂之钥"
 me_thrace_2_paper_kingdom.24.a:0 "当然我们的‘礼物’也不无帮助……"
 me_thrace_2_paper_kingdom.24.desc:0 "终于！我们的宽容、接受和提供一定程度自治的政策取得了成果，我们在奥德里西亚人眼中的形象从未如此高大。即使[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetPraenomen]希望主张[GetCountry('ODR').GetRuler.GetHerHis]的独立，[GetCountry('ODR').GetRuler.GetHerHis]的意愿也将与[GetCountry('ODR').GetRuler.GetHerHim]背道而驰。"
 me_thrace_2_paper_kingdom.24.t:0 "赢得[GetCountry('ODR').GetAdjective]的忠诚"
 me_thrace_2_paper_kingdom.25.a:0 "我们很荣幸能将他们列入我们的行列。"
 me_thrace_2_paper_kingdom.25.desc:0 "色雷斯的力量在于其人民，为此，我们已安排色雷斯血统的人能更充分地为国家的活力做出贡献。曾经被轻视和嘲笑的人们现在昂首挺胸，自豪地站立着。那些仍然反对这种改变的人最终会在看到这些坚定而坚强的人能做出的贡献后改变。"
 me_thrace_2_paper_kingdom.25.t:0 "色雷斯之地"
 me_thrace_2_paper_kingdom.26.a:0 "我们期待看到[GetCountry('TRE').GetRuler.GetHerHis]的解决方案。"
 me_thrace_2_paper_kingdom.26.desc:0 "[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]终于听到了我们的哀叹，打算找到解决不断袭击问题的方法。"
 me_thrace_2_paper_kingdom.26.t:0 "盖塔人的威胁"
 me_thrace_2_paper_kingdom.27.a:0 "及时赶上。"
 me_thrace_2_paper_kingdom.27.desc:0 "沿着革提亚袭击最频繁的渡口，我们已设立了军事营地，士兵们已经在该地区巡逻。幸运的话，这将大大减少这些大胆的袭击频率。"
 me_thrace_2_paper_kingdom.27.t:0 "设立防御工事"
 me_thrace_2_paper_kingdom.28.a:0 "我们终于摆脱了这些无休止的袭击。"
 me_thrace_2_paper_kingdom.28.desc:0 "从东边的黑海海岸到西边最远的萨尔登西亚，我们已牢牢控制了所有已知的伊斯特罗斯渡口。除非是全规模的入侵部队，否则没有任何袭击能够越过这条河进入南方的土地。"
 me_thrace_2_paper_kingdom.28.t:0 "伊斯特罗斯之盾"
 me_thrace_2_paper_kingdom.29.a:0 "我们在这里创造了历史。"
 me_thrace_2_paper_kingdom.29.desc:0 "在我们的赞助下，[GetProvince('(int32)4513').GetName]已经从一个伊斯特罗斯南北文化交流的聚会点，转变为真正的人民之间的桥梁，从希腊南部到斯基泰北部。\n\n在这片受黑海庇护的土地上，思想得以交流，贸易繁荣。随着时间的推移，这座城市可能成为真正的大都市；一个跨文化的家园，将作为文化多样性的象征在历史中回响。"
 me_thrace_2_paper_kingdom.29.t:0 "人民之间的桥梁"
 me_thrace_2_paper_kingdom.3.a:0 "[ROOT.GetCountry.GetAdjective]的独立在望！"
 me_thrace_2_paper_kingdom.3.b:0 "激怒我们的宗主是不明智的。"
 me_thrace_2_paper_kingdom.3.desc:0 "我们的间谍报告说，我们该死的宗主[GetCountry('TRE').GetName]正在考虑一场不明智的战争，目前分心于他们的继业者之间的争斗。也许我们可以利用这一局势为自己的利益……"
 me_thrace_2_paper_kingdom.3.t:0 "抓住机会"
 me_thrace_2_paper_kingdom.30.a:0 "我们必须求和。"
 me_thrace_2_paper_kingdom.30.b:0 "这次我们要么获得自由，要么战死！"
 me_thrace_2_paper_kingdom.30.desc:0 "我们与[GetCountry('TRE').GetName]的战争越来越严峻，形势对我们越来越不利。如果我们现在寻求和平，在局势变得更糟之前，我们可能会得到[GetCountry('TRE').GetAdjective]的接受，恢复到战前状态，从而避免更大的领土和财富损失。"
 me_thrace_2_paper_kingdom.30.t:0 "阿瑞斯的不满"
 me_thrace_2_paper_kingdom.31.a:0 "我们必须暂时接受这个提议。"
 me_thrace_2_paper_kingdom.31.b:0 "这次他们无法逃脱！"
 me_thrace_2_paper_kingdom.31.desc:0 "[GetCountry('ODR').GetRuler.GetPraenomen]认识到了自己的困境，派遣使者寻求和平。他们提出恢复战前状态，以换取立即停火。"
 me_thrace_2_paper_kingdom.31.t:0 "[GetCountry('ODR').GetName]提出和平"
 me_thrace_2_paper_kingdom.32.a:0 "那我们就要拼命反抗了。"
 me_thrace_2_paper_kingdom.32.desc:0 "[GetCountry('TRE').GetRuler.GetPraenomen]完全拒绝了我们的和平提议！他们打算彻底摧毁我们！"
 me_thrace_2_paper_kingdom.32.t:0 "[GetCountry('TRE').GetName]拒绝和平"
 me_thrace_2_paper_kingdom.33.a:0 "他们知道再尝试的后果。"
 me_thrace_2_paper_kingdom.33.desc:0 "我们对[GetCountry('GTE').GetName]造成了重大打击！尽管我们尚未完全控制他们的土地，他们仍有途径进入我们的领土，但这次挫折应该会让他们在未来袭击之前三思而后行。"
 me_thrace_2_paper_kingdom.33.t:0 "[GetCountry('GTE').GetName]被击败"
 me_thrace_2_paper_kingdom.33_tt:0 "未来#Y 革提亚袭击#!的频率将大幅减少。"
 me_thrace_2_paper_kingdom.34.a:0 "吕西马科斯之城的荣耀将无可限量！"
 me_thrace_2_paper_kingdom.34.desc:0 "我们对[GetProvince('(int32)350').GetName]的投资取得了丰硕的回报。随着更大码头的建成，更多贸易路线得以容纳，而新的水渠滋养着不断增长的人口，贫民窟被清除，为新住宅让路。"
 me_thrace_2_paper_kingdom.34.t:0 "[GetProvince('(int32)350').GetName]的荣耀"
 me_thrace_2_paper_kingdom.36.a:0 "他们将学习我们的方式。"
 me_thrace_2_paper_kingdom.36.at:0 "$me_thrace_start_tt$融合#Y$odrysi$#!文化。"
 me_thrace_2_paper_kingdom.36.desc:0 "我们统治的土地既不是希腊也不是马其顿，如果我们要控制色雷斯的桀骜野蛮人，必须通过在我们的王国中给予他们公民权来安抚他们。"
 me_thrace_2_paper_kingdom.36.t:0 "$thracian_02_paper_kingdom_8$"
 me_thrace_2_paper_kingdom.37.a:0 "他们将蜂拥而至吕西玛刻亚。"
 me_thrace_2_paper_kingdom.37.at:0 "$me_thrace_start_tt$继续发展[GetProvince('(int32)350').GetName]。"
 me_thrace_2_paper_kingdom.37.desc:0 "[GetCharacter('(int32)41').GetPraenomen]仿效亚历山大创立了自己的伟大城市，作为他的宫廷中心和对抗安提柯家族威胁的堡垒，但如果这个地方要赶上其他继业者的首都，仍有许多工作要做。"
 me_thrace_2_paper_kingdom.37.t:0 "$thracian_02_paper_kingdom_9$"
 me_thrace_2_paper_kingdom.38.a:0 "未经我们允许，谁也不能通过。"
 me_thrace_2_paper_kingdom.38.at:0 "$me_thrace_start_tt$加固赫勒斯滂。"
 me_thrace_2_paper_kingdom.38.desc:0 "吕西玛刻亚的选址部分是为了控制色雷斯海峡，从而控制赫勒斯滂，阻止任何试图从亚洲轻松进入欧洲的势力。通过继续加固这一重要通道，我们将确保我们城市的安全，遏制敌人的野心。"
 me_thrace_2_paper_kingdom.38.t:0 "$thracian_02_paper_kingdom_10$"
 me_thrace_2_paper_kingdom.39.a:0 "北方将安全无虞。"
 me_thrace_2_paper_kingdom.39.at:0 "$me_thrace_start_tt$加固[GetProvince('(int32)4520').GetName]。"
 me_thrace_2_paper_kingdom.39.desc:0 "在强大的伊斯特罗斯河对岸，战斗激烈的盖塔人隐藏着，他们袭击南方的邻居和黑海城市，掠夺奴隶和财物。然而，如果我们能控制横跨水道的几个渡口，他们的天然防御也是我们的天然防御。"
 me_thrace_2_paper_kingdom.39.t:0 "$thracian_02_paper_kingdom_13$"
 me_thrace_2_paper_kingdom.4.a:0 "诅咒他们！"
 me_thrace_2_paper_kingdom.4.desc:0 "狡诈多端的奥德里西亚人以极大的谋略选择了他们最新起义的时机。在我们军队正忙于与 [ODR_thracian_enemy.GetName] 的战争时，[GetCountry('ODR').GetRuler.GetName] [GetCountry('ODR').GetRuler.GetHerHis]看准了夺取 [GetCountry('ODR').GetAdjective] 独立的机会，[GetCountry('ODR').GetRuler.GetHerHis] 的军队正准备背后捅我们一刀。"
 me_thrace_2_paper_kingdom.4.t:0 "[GetCountry('ODR').GetAdjective]的叛乱"
 me_thrace_2_paper_kingdom.40.a:0 "河流将成为一道墙。"
 me_thrace_2_paper_kingdom.40.at:0 "$me_thrace_start_tt$加固伊斯特罗斯河的渡口。"
 me_thrace_2_paper_kingdom.40.desc:0 "我们必须继续遏制阴险的盖塔人，确保我们完全控制伟大伊斯特罗斯河的关键渡口，保证任何袭击或作战部队都无法突破我们的防线进入色雷斯内陆。"
 me_thrace_2_paper_kingdom.40.t:0 "$thracian_02_paper_kingdom_14$"
 me_thrace_2_paper_kingdom.41.a:0 "城市将繁荣发展。"
 me_thrace_2_paper_kingdom.41.at:0 "$me_thrace_start_tt$促进[GetProvince('(int32)4513').GetName]的贸易中心。"
 me_thrace_2_paper_kingdom.41.desc:0 "尽管受到野蛮人的袭击，北方的黑海城市仍然是重要的贸易中心，连接着欧洲和黑海对岸的希腊人以及他们接壤的部落。我们将鼓励这些网络带来的商品和人员流动。"
 me_thrace_2_paper_kingdom.41.t:0 "$thracian_02_paper_kingdom_15$"
 me_thrace_2_paper_kingdom.42.a:0 "色雷斯将有和平。"
 me_thrace_2_paper_kingdom.42.at:0 "$me_thrace_start_tt$与我们的#Y 奥德律西亚#!人群对话。"
 me_thrace_2_paper_kingdom.42.desc:0 "是时候让奥德里西亚人明白，如果他们要享受我们仁慈统治的好处，不管它对我们的自尊或他们的自尊造成什么伤害，他们必须放下自马其顿征服色雷斯人以来一直存在的怨恨。"
 me_thrace_2_paper_kingdom.42.t:0 "$thracian_02_paper_kingdom_3$"
 me_thrace_2_paper_kingdom.43.a:0 "让我们考验他们的智慧。"
 me_thrace_2_paper_kingdom.43.at:0 "$me_thrace_start_tt$要求#Y$dacia_group$#!臣服。"
 me_thrace_2_paper_kingdom.43.desc:0 "在俄德律西亚人人和强大的哈伊莫斯山脉之外，摩厄西亚平原广阔无垠，由比其南方邻居更不文明的达契亚部落占据。他们必须接受我们在该区域的统治，并向[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王国进贡。"
 me_thrace_2_paper_kingdom.43.t:0 "$thracian_02_paper_kingdom_6$"
 me_thrace_2_paper_kingdom.44.a:0 "现在谈判为时已晚。"
 me_thrace_2_paper_kingdom.44.at:0 "$me_thrace_start_tt$准备与@[GetCountry('ODR').GetFlag]! [GetCountry('ODR').GetName]开战。"
 me_thrace_2_paper_kingdom.44.desc:0 "俄德律西亚人证明了他们对我们统治的蔑视，拒绝了我们保持友好关系的尝试，同时悄悄策划下一次合适的叛乱。他们已经有机会保持他们的小王国——现在必须结束。"
 me_thrace_2_paper_kingdom.44.t:0 "$thracian_02_paper_kingdom_4$"
 me_thrace_2_paper_kingdom.45.a:0 "光荣的壮举在我们的军队中等待着他们。"
 me_thrace_2_paper_kingdom.45.at:0 "$me_thrace_start_tt$招募#Y$odrysi$#!。"
 me_thrace_2_paper_kingdom.45.desc:0 "色雷斯人以其勇敢而闻名；崇拜战马和他们本土的阿瑞斯是他们最重要的神灵。是时候利用他们的战斗倾向，将他们纳入方阵了。"
 me_thrace_2_paper_kingdom.45.t:0 "$thracian_02_paper_kingdom_11$"
 me_thrace_2_paper_kingdom.46.a:0 "盖塔人将被阻止。"
 me_thrace_2_paper_kingdom.46.desc:0 "如果黑海城市要保持忠诚，我们必须提供领导；保护他们免受北方盖塔人的侵害将确保他们尊重我们的保护价值以及我们履行义务的努力。"
 me_thrace_2_paper_kingdom.46.t:0 "$thracian_02_paper_kingdom_12$"
 me_thrace_2_paper_kingdom.46.tt:0 "$mission_task_completed_tt_1$$thracian_02_paper_kingdom_12$$mission_task_completed_tt_2$"
 me_thrace_2_paper_kingdom.47.a:0 "必须如此。"
 me_thrace_2_paper_kingdom.47.desc:0 "虽然这对任何骄傲的马其顿人来说都是一种折磨，但治理色雷斯要求我们放下自尊，像对待希腊人一样尊重色雷斯人。通过这种方式，我们可以保证与奥德里西亚人的和平，并将我们的士兵留给更紧迫的威胁。"
 me_thrace_2_paper_kingdom.47.t:0 "$thracian_02_paper_kingdom_2$"
 me_thrace_2_paper_kingdom.47.tt:0 "$mission_task_completed_tt_1$$thracian_02_paper_kingdom_2$$mission_task_completed_tt_2$"
 me_thrace_2_paper_kingdom.48.a:0 "以阿瑞斯之名！"
 me_thrace_2_paper_kingdom.48.desc:0 "盖塔人的袭击将不再被容忍；我们将率领我们的军队深入北方领土，用马其顿军队的压倒性力量摧毁他们的士气——他们必须明白，南方只有痛苦和死亡在等待。"
 me_thrace_2_paper_kingdom.48.t:0 "$thracian_02_paper_kingdom_16$"
 me_thrace_2_paper_kingdom.48.tt:0 "$mission_task_completed_tt_1$$thracian_02_paper_kingdom_16$$mission_task_completed_tt_2$"
 me_thrace_2_paper_kingdom.49.a:0 "前进，永远前进！"
 me_thrace_2_paper_kingdom.49.desc:0 "很少有希腊人，更不用说马其顿人，敢于进入伊斯特罗斯雄伟河流之外的达契亚深处，但如果亚历山大向我们展示了什么，那就是通过大胆和勇气可以征服并驯服这些难以捉摸的蛮族。"
 me_thrace_2_paper_kingdom.49.t:0 "$thracian_02_paper_kingdom_17$"
 me_thrace_2_paper_kingdom.49.tt:0 "$mission_task_completed_tt_1$$thracian_02_paper_kingdom_17$$mission_task_completed_tt_2$"
 me_thrace_2_paper_kingdom.5.a:0 "这将不会没有回应！"
 me_thrace_2_paper_kingdom.5.desc:0 "使者通知我们，城市[getic_raid_province_target.GetName]遭到了卑鄙的[GetCountry('GTE').GetAdjective]突袭。\n\n虽然许多居民能够找到安全的地方，但顽固的袭击者没有放弃，直到他们烧毁了许多建筑并掠夺了他们所能拿到的东西，然后带着我们的财富返回伊斯特罗斯。修复这些损失将花费巨大。"
 me_thrace_2_paper_kingdom.5.desc_1:0 "由于袭击的突然，袭击者在逃离的居民到达相对安全的城市之前就袭击了他们，许多人被俘虏并带回伊斯特罗斯，成为盖塔人的奴隶。"
 me_thrace_2_paper_kingdom.5.desc_2:0 "虽然许多居民能够找到安全的地方，但袭击者发现了一个无人保护的粮仓，并掠夺了里面的财富。我们的粮食库存被带回伊斯特罗斯，养活了革提亚的土地。"
 me_thrace_2_paper_kingdom.5.desc_3:0 "尽管大多数居民都平安无事，这帮常年作恶的劫掠者却拒绝善罢甘休，他们烧毁了许多建筑，抢夺了所有能够拿走的财宝，然后带着我们的财富穿过伊斯特洛河回到老家。要修复这些损伤需要花费不少。"
 me_thrace_2_paper_kingdom.5.t:0 "[GetCountry('GTE').GetAdjective]的突袭"
 me_thrace_2_paper_kingdom.50.a:0 "它在等待被征服。"
 me_thrace_2_paper_kingdom.50.desc:0 "如果我们要追求统一北方的愿景，我们向北的闪电战必须继续；一个从吕西玛刻亚延伸到黑海对岸遥远殖民地并包含其中各种人民的[ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]王国——勇敢的斯基泰人是我们的下一个挑战。"
 me_thrace_2_paper_kingdom.50.t:0 "$thracian_02_paper_kingdom_18$"
 me_thrace_2_paper_kingdom.50.tt:0 "$mission_task_completed_tt_1$$thracian_02_paper_kingdom_18$$mission_task_completed_tt_2$"
 me_thrace_2_paper_kingdom.51.desc:0 "我们被诅咒的宗主[ROOT.GetCountry.GetOverlord.GetRuler.GetPraenomen]没有给我们任何利用的好机会，但我们不能再等了。我们必须起义，争取我们的独立！"
 me_thrace_2_paper_kingdom.51.t:0 "主权问题"
 me_thrace_2_paper_kingdom.52.desc:0 "一向狡诈的奥德里西亚人终于再次展示了他们的背叛行为。他们愚蠢地再次宣布自己摆脱了[ROOT.GetCountry.GetAdjective]的影响，并拿起武器试图确保这一点！"
 me_thrace_2_paper_kingdom.53.a:0 "我们必须接受他们的决定。"
 me_thrace_2_paper_kingdom.53.a_tt:0 "我们与@[GetCountry('TRE').GetFlag]![GetCountry('TRE').GetName|Y]的战争已经结束。"
 me_thrace_2_paper_kingdom.53.desc:0 "我们的盟友[GetCountry('ODR').GetName]，为了他们我们参战，在与[GetCountry('TRE').GetName]的当前战争中受到了沉重打击。为了避免灾难，[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetPraenomen]现在请求与[GetCountry('ODR').GetRuler.GetHerHis][GetCountry('TRE').GetAdjective]宗主和平，接受恢复战前状态。\n\n因此，战争结束了。"
 me_thrace_2_paper_kingdom.53.t:0 "[GetCountry('ODR').GetName]请求和平"
 me_thrace_2_paper_kingdom.54.a_tt:0 "我们与@[GetCountry('ODR').GetFlag]![GetCountry('ODR').GetName|Y]的战争已经结束。"
 me_thrace_2_paper_kingdom.54.desc:0 "我们的敌人[GetCountry('ODR').GetName]，为了我们的盟友[GetCountry('TRE').GetName]我们参战，在当前战争中受到了沉重打击。为了避免灾难，[GetCountry('ODR').GetRulerTitle][GetCountry('ODR').GetRuler.GetPraenomen]现在请求与[GetCountry('ODR').GetRuler.GetHerHis][GetCountry('TRE').GetAdjective]宗主和平，接受恢复战前状态。\n\n因此，战争结束了。"
 me_thrace_2_paper_kingdom.6.a:0 "我们的宗主[ROOT.GetCountry.GetOverlord.GetName]会袖手旁观吗？！"
 me_thrace_2_paper_kingdom.6.desc:0 "唉！我们成为卑鄙的[GetCountry('GTE').GetAdjective]突袭的目标！"
 me_thrace_2_paper_kingdom.7.a:0 "我们是多么幸运，他们如此虚弱！"
 me_thrace_2_paper_kingdom.7.desc:0 "我们的袭击者从伊斯特罗斯带回了大量财富！"
 me_thrace_2_paper_kingdom.7.t:0 "成功的突袭归来"
 me_thrace_2_paper_kingdom.8.a:0 "谈判将在没有干扰的情况下进行。"
 me_thrace_2_paper_kingdom.8.a_tt:0 "成功的谈判将减少未来[GetCountry('ODR').GetAdjective|Y]叛乱的可能性。"
 me_thrace_2_paper_kingdom.8.b:0 "提供实质性让步。"
 me_thrace_2_paper_kingdom.8.b_tt:0 "谈判成功的可能性更高。"
 me_thrace_2_paper_kingdom.8.c:0 "提供更大的礼物。"
 me_thrace_2_paper_kingdom.8.d:0 "提供一切！"
 me_thrace_2_paper_kingdom.8.d_tt:0 "谈判成功的可能性大大增加。"
 me_thrace_2_paper_kingdom.8.desc:0 "四面楚歌的情况下，我们不能容忍一个不忠的臣民在背后捅刀。我们应当提供诱人的激励，争取[GetCountry('ODR').GetAdjective]的忠诚。"
 me_thrace_2_paper_kingdom.8.t:0 "[GetCountry('ODR').GetAdjective]谈判"
 me_thrace_2_paper_kingdom.9.a:0 "他们引起了我们的注意。"
 me_thrace_2_paper_kingdom.9.b:0 "[ROOT.GetCountry.GetAdjective]的自由不会轻易被出卖！"
 me_thrace_2_paper_kingdom.9.desc:0 "[ROOT.GetCountry.GetOverlord.GetAdjective]的使者来提供礼物和让步，毫无疑问是为了确保我们未来的善意。尽管他们认为我们的忠诚可以如此轻易地被买到是侮辱性的，但他们的提议仍然值得考虑。"
 me_thrace_2_paper_kingdom.9.t:0 "[GetCountry('TRE').GetAdjective]谈判"
 me_thrace_3_new_philhellene_policy.1.a:0 "前进，赢得每个希腊人的心灵和思想！"
 me_thrace_3_new_philhellene_policy.1.desc:0 "几个世纪以来，希腊人，这些微小城邦的统治者们，在规模上几乎不值得[ROOT.GetCountry.GetRulerTitle]注意。他们在菲利普二世和亚历山大大帝的统一尝试中，报以不忠和背叛。几十年来，希腊人一直是马其顿人的眼中钉，甚至底比斯的命运也未能使他们从自我毁灭的行为中退缩。\n\n是时候承认我们对待希腊人的惯常方式不再奏效，可能从未奏效。相反，我们将迎合他们的自我，尊重他们的“民主”，用礼物和特权来淹没他们，从而在不需要动用一兵一卒的情况下，将他们联合在我们的领导下。"
 me_thrace_3_new_philhellene_policy.1.t:0 "$thrace_03_philhellene$"
 me_thrace_3_new_philhellene_policy.101.a:0 "就这样吧。"
 me_thrace_3_new_philhellene_policy.101.at:0 "$me_tre_task_start_tt_1$没收地方货币。"
 me_thrace_3_new_philhellene_policy.101.desc:0 "铸造货币的权利远远超出了本都城邦的地位。此外，这些地方货币是自豪和主权的象征，只会削弱我们对该地区的控制努力。作为主权的象征，这些铸币厂将不得不关闭。"
 me_thrace_3_new_philhellene_policy.101.t:0 "$thrace_03_philhellene_10$"
 me_thrace_3_new_philhellene_policy.102.a:0 "我们将好好利用它。"
 me_thrace_3_new_philhellene_policy.102.desc:0 "尽管预期会有抵抗，但本都殖民地的地方铸币厂已被拆除，其设备被没收用于皇家用途。"
 me_thrace_3_new_philhellene_policy.102.t:0 "$thrace_03_philhellene_10$"
 me_thrace_3_new_philhellene_policy.102.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_10$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.104.t:0 "$thrace_03_philhellene_10$：地方铸币厂关闭"
 me_thrace_3_new_philhellene_policy.104.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_15$#!已被#R绕过#!"
 me_thrace_3_new_philhellene_policy.11.a:0 "让他们知道我们的关注。"
 me_thrace_3_new_philhellene_policy.11.at:0 "$me_tre_task_start_tt_1$鼓励本都殖民。"
 me_thrace_3_new_philhellene_policy.11.desc:0 "西本都希腊城市，曾经只是殖民地，自那遥远的日子以来，已经成长和繁荣。它们的政治影响力广泛，事实上，这五个城邦在卡拉提斯的领导下松散地联合成了一个“本都五城邦联盟”。之前的叛乱虽然未成功，但显示了这个联盟的力量，以及他们为捍卫自身利益而采取行动的意愿。\n\n即便如此，我们必须与他们打交道，因为他们的经济财富是我们税收的重要来源，也是资助我们军队的关键。我们必须向他们展示，我们没有忘记他们的重要性，也没有忘记他们过去的过错。一个大胆的基础设施改善项目将做到这一切，而这些改善的好处最终也将通过税收回馈给我们。"
 me_thrace_3_new_philhellene_policy.11.t:0 "$thrace_03_philhellene_1$：拟议投资"
 me_thrace_3_new_philhellene_policy.111.a:0 "让我们派遣使者。"
 me_thrace_3_new_philhellene_policy.111.desc:0 "[GetCountry('BOE').GetName]的人民骄傲而顽固，一直对马其顿人抱有敌意。亚历山大一登基，[GetProvince('(int32)426').GetName]就以喧嚣的方式起义，亚历山大将城市夷为平地。然而，现在我们有机会向他们伸出橄榄枝，忘记过去的冲突，也许，在这个困难时期和动荡的希腊地区结交一个新朋友。"
 me_thrace_3_new_philhellene_policy.111.t:0 "$thrace_03_philhellene_11$：橄榄枝"
 me_thrace_3_new_philhellene_policy.111.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_11$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.112.a:0 "是的，我们会称他们为朋友！"
 me_thrace_3_new_philhellene_policy.112.b:0 "我们认可他们的善意，但不认可他们的友谊。"
 me_thrace_3_new_philhellene_policy.112.c:0 "绝不！"
 me_thrace_3_new_philhellene_policy.112.desc:0 "我们与马其顿人，特别是亚历山大继承者的关系一直是复杂的。我们的忠诚难以获得，更难以维持，因为我们是一个骄傲和顽固的民族。因此，色雷斯大使出现在我们的大会前，提出友谊的建议，这让我们有些惊讶。\n\n虽然承认我们之前的分歧，但他们愿意迈出和解过程的第一步，向我们伸出援手（伴随着一点贿赂）。这足以让我们称他们为朋友吗？"
 me_thrace_3_new_philhellene_policy.112.t:0 "$thrace_03_philhellene_11$：橄榄枝"
 me_thrace_3_new_philhellene_policy.113.a:0 "叛徒！"
 me_thrace_3_new_philhellene_policy.113.b:0 "确实是愚蠢的妄想者……"
 me_thrace_3_new_philhellene_policy.113.c:0 "太好了！"
 me_thrace_3_new_philhellene_policy.113.desc:0 "我们得知我们的属国[GetCountry('BOE').GetName]已被[GetCountry('TRE').GetAdjective]的使者接触。\n\n"
 me_thrace_3_new_philhellene_policy.113.desc_1:0 "那些背信弃义、不可信任的波奥提亚人接受了[GetCountry('TRE').GetAdjective]的贿赂并宣布独立！更为恶劣的是，他们还接受了他们的友谊并宣布两国结盟。虽然他们的背叛并非完全出乎意料，但他们将付出沉重的代价！"
 me_thrace_3_new_philhellene_policy.113.desc_2:0 "那些背信弃义、不可信任的波奥提亚人接受了[GetCountry('TRE').GetAdjective]的贿赂并宣布独立！然而，出于某种奇怪的原因，他们拒绝了[GetCountry('TRE').GetAdjective]的友谊，并误以为他们可以独立生存。虽然他们的背叛并非完全出乎意料，但他们将付出沉重的代价！"
 me_thrace_3_new_philhellene_policy.113.desc_3:0 "幸运的是，我们对他们的信任是值得的；他们拒绝了提议，并对我们保持忠诚。"
 me_thrace_3_new_philhellene_policy.113.t:0 "$thrace_03_philhellene_11$：反叛者！"
 me_thrace_3_new_philhellene_policy.113.tt:0 "@[GetCountry('BOE').GetFlag]！[GetCountry('BOE').GetName]不再是我们的属国。"
 me_thrace_3_new_philhellene_policy.114.a:0 "太好了！"
 me_thrace_3_new_philhellene_policy.114.b:0 "我们会密切关注他们的情况。"
 me_thrace_3_new_philhellene_policy.114.c:0 "该死！"
 me_thrace_3_new_philhellene_policy.114.desc:0 "我们的使者从[GetCountry('BOE').GetName]返回，带来了答复。\n\n"
 me_thrace_3_new_philhellene_policy.114.desc_1:0 "他们热情地接受了我们的提议！不仅宣布他们从宗主国独立出来，还与我们结盟。这是真正的外交成功，这将使我们在希腊的地位更加安全，并使我们在该地区的未来进展更加容易。"
 me_thrace_3_new_philhellene_policy.114.desc_2:0 "他们接受了我们的提议，但有所保留。他们宣布脱离宗主国独立，但拒绝承诺建立长期友谊。虽然这个结果对我们的外交仍然是一个成功，但[GetCountry('BOE').GetName]在政治舞台上的孤立位置将使她受到该地区任何大国的摆布。我们最好确保是我们。"
 me_thrace_3_new_philhellene_policy.114.desc_3:0 "遗憾的是，他们带来了坏消息。波奥提亚人嘲笑了我们的提议，把我们的使者打发回去，只留下满含轻蔑的信息。如果我们想要他们的城市，就只能用武力夺取！"
 me_thrace_3_new_philhellene_policy.114.t:0 "$thrace_03_philhellene_11$：波奥提亚的回复"
 me_thrace_3_new_philhellene_policy.114.tt:0 "@[GetCountry('BOE').GetFlag]！[GetCountry('BOE').GetName]不再是@[boeotia_overlord_scope.GetFlag]！[boeotia_overlord_scope.GetName]的属国。"
 me_thrace_3_new_philhellene_policy.12.a:0 "人口意味着税收..."
 me_thrace_3_new_philhellene_policy.12.desc:0 "西本都城市的更新和改善项目取得了非凡的成功。旧的破旧房屋被清理，新建筑被建造，水渠和基础设施也得到了建设，所有这些都帮助它们吸收不断增加的人口。我们对这些工作的投资没有被忽视，并且作为一个有用的提醒，[ROOT.GetCountry.GetName]记得他们。"
 me_thrace_3_new_philhellene_policy.12.t:0 "$thrace_03_philhellene_1$：投资回报"
 me_thrace_3_new_philhellene_policy.12.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_5$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.121.a:0 "让我们听听他们怎么说。"
 me_thrace_3_new_philhellene_policy.121.desc:0 "希腊人是出了名的难以驾驭。他们不喜欢放弃著名的‘自治和自由’，除非在最绝望的情况下，他们会联合起来组成联盟。希腊联盟在掌控他们的人手中是一种强大的工具——正如波斯战争后的雅典霸权和腓力通过科林斯联盟对希腊事务的控制所示。\n\n如果我们能将目前在希腊的分散盟友和小的独立派系组织成一个联盟，我们对该地区的影响将是不可争议的。"
 me_thrace_3_new_philhellene_policy.121.t:0 "$thrace_03_philhellene_12$：友好提议"
 me_thrace_3_new_philhellene_policy.122.a:0 "我们接受。"
 me_thrace_3_new_philhellene_policy.122.at:0 "@[THIS.GetCountry.GetFlag]！[THIS.GetCountry.GetName]将领导这个新国家。"
 me_thrace_3_new_philhellene_policy.122.b:0 "我们绝不接受！"
 me_thrace_3_new_philhellene_policy.122.desc:0 "来自[GetCountry('TRE').GetName]的大使带来了一个提议。独立的希腊城邦在单独站立时是脆弱的，而希腊长期以来一直是继业者的战场。色雷斯统治者[GetCountry('TRE').GetRuler.GetName]建议我们在他的保护下加入一个自由城市联盟，因为团结就是力量。\n\n这个提议是离谱的，但我们可能没有选择。继业者的永无止境的斗争引起的持续冲突和不确定状态极大地削弱了希腊，一个在某个竞争者保护下的强大联盟可能是我们唯一的生存机会。"
 me_thrace_3_new_philhellene_policy.122.t:0 "$thrace_03_philhellene_12$：有暗示性的提议"
 me_thrace_3_new_philhellene_policy.122.tt:0 "希腊大陆[GetProvince('(int32)418').GetArea.GetRegion.GetName]的每个自由希腊国家都收到了加入结合希腊属地的提议@[me_thrace_scope.GetFlag]！[me_thrace_scope.GetName]。"
 me_thrace_3_new_philhellene_policy.123.a:0 "很好……"
 me_thrace_3_new_philhellene_policy.123.at:0 "[THIS.GetCountry.MakeScope.GetVariable('league_counter_var').GetValue|0Y]个希腊国家接受并被结合为我们的新附庸@[league_head_scope.GetFlag]！[league_head_scope.GetName]。"
 me_thrace_3_new_philhellene_policy.123.desc:0 "不久前，我们向整个希腊派遣了使者。他们的任务是说服尽可能多的地方权力加入我们领导的联盟，以确保他们在这些动荡时期的安全。今天，我们所有的使者终于回来了。\n\n"
 me_thrace_3_new_philhellene_policy.123.desc_1:0 "相当多的国家接受了！\n\n[GetCountry('TRE').GetRuler.GetPraenomen]对希腊人对[GetCountry('TRE').GetRuler.GetHerHim]的信任感到谦卑和荣幸。我们的统治者宣布希腊联盟重生，任务是在[GetCountry('TRE').GetName]的仁慈和保护下捍卫希腊的“自治和自由(autonomia kai eleutheria）”。"
 me_thrace_3_new_philhellene_policy.123.desc_2:0 "不幸的是，他们带来了坏消息；没有一个国家接受我们的提议。显然，他们被我们竞争对手的欺骗性承诺所左右！\n\n现在无法与他们讲理。"
 me_thrace_3_new_philhellene_policy.123.t:0 "$thrace_03_philhellene_12$：回复"
 me_thrace_3_new_philhellene_policy.123.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_12$$mission_task_completed_tt_2$。"
 me_thrace_3_new_philhellene_policy.123.tt1:0 "没有希腊国家接受我们的提议。"
 me_thrace_3_new_philhellene_policy.13.a:0 "一个受欢迎的惊喜，但我们应该怎么做……？"
 me_thrace_3_new_philhellene_policy.13.desc:0 "在他们的智慧中，[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]认为应该投资我们的城市！"
 me_thrace_3_new_philhellene_policy.13.t:0 "$thrace_03_philhellene_1$：[ROOT.GetCountry.GetAdjective]投资"
 me_thrace_3_new_philhellene_policy.131.a:0 "他们会看到[GetCountry('TRE').GetName]是他们生活的一部分。"
 me_thrace_3_new_philhellene_policy.131.at:0 "$me_tre_task_start_tt_1$保障城市特权。"
 me_thrace_3_new_philhellene_policy.131.desc:0 "我们将预留大量金库资金，用于在城邦中的大型项目，以造福其居民。这将确保他们在日常生活中看到[GetCountry('TRE').GetName]的手，塑造他们的城市和命运，并在他们的经济繁荣中发挥关键作用。"
 me_thrace_3_new_philhellene_policy.131.t:0 "$thrace_03_philhellene_13$：投资"
 me_thrace_3_new_philhellene_policy.132.a:0 "所有受到[GetCountry('TRE').GetName]影响的人都繁荣起来。"
 me_thrace_3_new_philhellene_policy.132.at1:0 "每个其他本都城邦附属国也将对@[me_thrace_scope.GetFlag]![me_thrace_scope.GetName]#G +25#!好感度，并在其首都省份获得“#Y $state_improvement_religious$#!”。"
 me_thrace_3_new_philhellene_policy.132.desc:0 "我们的投资取得了丰厚的回报，不仅让城邦的人民看到[GetCountry('TRE').GetName]从不远离，并且深切关心他们的福祉，而且城市的经济也显著——更重要的是对他们的居民来说，是可见的——得到改善。"
 me_thrace_3_new_philhellene_policy.132.t:0 "$thrace_03_philhellene_13$：回报"
 me_thrace_3_new_philhellene_policy.132.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_13$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.133.a:0 "他们的慷慨已被注意到。"
 me_thrace_3_new_philhellene_policy.133.desc:0 "来自[GetCountry('TRE').GetAdjective]国库的黄金最近流入[ROOT.GetCountry.GetName]，用于新基础设施、水道和住房的建设，还支持关键商业项目。我们的人民看到[GetCountry('TRE').GetName]在改善他们生活和创造繁荣方面的努力。\n\n也许[GetCountry('TRE').GetName]的保护确实带来了好处……"
 me_thrace_3_new_philhellene_policy.133.t:0 "[GetCountry('TRE').GetAdjective]投资"
 me_thrace_3_new_philhellene_policy.134.t:0 "$thrace_03_philhellene_13$：回报不确定"
 me_thrace_3_new_philhellene_policy.134.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_13$#!已被#R绕过#!"
 me_thrace_3_new_philhellene_policy.14.a:0 "灾难性的！"
 me_thrace_3_new_philhellene_policy.14.desc:0 "我们保持西本都繁荣城市在我们控制和保护下的努力失败了。随着他们在[ROOT.GetCountry.GetName]内的影响力减弱，地方政府挣扎，铸币厂关闭，以及我们在该地区的投资经济回报不确定，继续我们的计划不再有利。"
 me_thrace_3_new_philhellene_policy.14.t:0 "$thrace_03_philhellene_1$：影响力减弱"
 me_thrace_3_new_philhellene_policy.14.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_1$#!'已被#R跳过#!"
 me_thrace_3_new_philhellene_policy.141.a:0 "城邦将屈服于我们的意志。"
 me_thrace_3_new_philhellene_policy.141.at:0 "$me_tre_task_start_tt_1$整合本都城邦附属国的行政管理。"
 me_thrace_3_new_philhellene_policy.141.desc:0 "城邦持续自治的时间即将结束。我们的官员准备接管所有决策机构，而地方议会会议将只在我们的指导下进行。\n\n由于预期会有抵抗，我们的士兵被授予自由权力解散任何未经授权的集会，直到人们习惯新的现状。"
 me_thrace_3_new_philhellene_policy.141.t:0 "$thrace_03_philhellene_14$"
 me_thrace_3_new_philhellene_policy.142.a:0 "随着时间的推移，他们的独立观念也会消退。"
 me_thrace_3_new_philhellene_policy.142.desc:0 "城邦的官僚机构已经整合到我们自己的系统中，尽管预期会有抵抗。为了减轻冲击，传统的民主议会会议将继续进行，让市民有机会发表意见，但这些机构的决策从此被视为“咨询性质”。随着时间的推移，他们将学会我们久经考验的治理方法的优越性。"
 me_thrace_3_new_philhellene_policy.142.t:0 "$thrace_03_philhellene_14$"
 me_thrace_3_new_philhellene_policy.142.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_14$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.144.t:0 "$thrace_03_philhellene_13$：失去控制"
 me_thrace_3_new_philhellene_policy.144.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_14$#!已被#R绕过#!"
 me_thrace_3_new_philhellene_policy.151.a:0 "这是值得追求的可能性。"
 me_thrace_3_new_philhellene_policy.151.at:0 "$me_tre_task_start_tt_1$正式化本都城邦附属国的自治。"
 me_thrace_3_new_philhellene_policy.151.desc:0 "我们最近在城邦政府以及他们人民中获得的好感，使我们在谈判桌上的地位得到了加强。如果我们提供适当的激励，可能有可能获得足够多的城市精英的支持，从而几乎消除他们进一步叛乱的可能性。"
 me_thrace_3_new_philhellene_policy.151.t:0 "$thrace_03_philhellene_15$：安排"
 me_thrace_3_new_philhellene_policy.152.a:0 "以这个代价换取和平是划算的。"
 me_thrace_3_new_philhellene_policy.152.at:0 "我们的本都城邦附属国将不再考虑叛乱。"
 me_thrace_3_new_philhellene_policy.152.desc:0 "正如我们所希望的，我们之前的好意，加上自治承诺，并在城市名义权利方面显示出一些宽容，已经足以削弱城邦领导层中的叛乱派系，使进一步叛乱的可能性变得非常小。现在已经签署了一项协议，正式化了他们的许多权利，完全安抚了他们公民中的温和派。\n\n然而，随着时间的推移，他们可能会对这些自治保证的坚持不如现在那么强烈。"
 me_thrace_3_new_philhellene_policy.152.t:0 "$thrace_03_philhellene_15$：协议"
 me_thrace_3_new_philhellene_policy.152.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_15$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.154.t:0 "$thrace_03_philhellene_15$：地方政府斗争"
 me_thrace_3_new_philhellene_policy.154.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_15$#!已被#R绕过#!"
 me_thrace_3_new_philhellene_policy.2.a:0 "真正的天才知道何时使用大棒，何时使用胡萝卜。"
 me_thrace_3_new_philhellene_policy.2.desc:0 "我们对待希腊人的改变取得了超出我们最狂野想象的成果。我们的名字传遍了每个希腊人口中，[GetCharacter('(int32)41').GetPraenomen]的成就被所有人颂扬！确实，没有任何疑问，我们已经感受到了神灵的存在。\n\n让我们的敌人目睹我们的慷慨和外交成果，并绝望吧！"
 me_thrace_3_new_philhellene_policy.2.t:0 "$thrace_03_philhellene$：巨大成功"
 me_thrace_3_new_philhellene_policy.2.tt:0 "任务“#Y $thrace_03_philhellene$#!”$mission_task_completed_tt_2$完成。"
 me_thrace_3_new_philhellene_policy.201.a:0 "一个大胆的计划——正是我们需要的。"
 me_thrace_3_new_philhellene_policy.201.at:0 "我们的支持将大大增加本都城市公开反抗的几率。"
 me_thrace_3_new_philhellene_policy.201.b:0 "我们没有资源可以腾出。"
 me_thrace_3_new_philhellene_policy.201.bt:0 "本都城市可能仍会选择叛乱，但几率要小得多。"
 me_thrace_3_new_philhellene_policy.201.desc:0 "[GetCountry('TRE').GetName]对黑海西岸希腊殖民地地区的控制并不完全。过去几十年里，本都城邦已经多次表现出他们的不忠和对民主生活的渴望，摆脱[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetName]的控制。\n\n值得派遣我们的使者前往这些自豪的城邦，向他们说明我们可以在他们追求自由的过程中提供的帮助。如果我们稍微煽动一下，提供物质和军事援助以及独立承诺，我们可能会在该地区找到盟友，并给[GetCountry('TRE').GetAdjective][GetCountry('TRE').GetRulerTitle]一些其他军事注意力的焦点。"
 me_thrace_3_new_philhellene_policy.201.t:0 "本都海岸的城邦"
 me_thrace_3_new_philhellene_policy.202.a:0 "现在是掌握命运的时候了！"
 me_thrace_3_new_philhellene_policy.202.at:0 "我们很快将发动独立战争，任何其他决心获得自由的西本都城邦也将一起参与。"
 me_thrace_3_new_philhellene_policy.202.b:0 "这种行动只会导致必然的毁灭。"
 me_thrace_3_new_philhellene_policy.202.desc_1:0 "鉴于他们当前与[GetCountry('TRE').GetName]的战争，[black_sea_revolt_supporter.GetName]派来的使节已抵达，寻求与[ROOT.GetCountry.GetRuler.GetName]及[ROOT.GetCountry.GetAdjective]精英会面。\n\n他们热情洋溢地陈述了暴君[GetCountry('TRE').GetRulerTitle] [GetCountry('TRE').GetRuler.GetName] 该地区完整性，乃至我们自身价值观所构成的威胁。[black_sea_revolt_supporter.GetAdjective]的使节声称，已获得[black_sea_revolt_supporter.GetRulerTitle] [black_sea_revolt_supporter.GetRuler.GetName]的授权，若我们加入他们对抗[GetCountry('TRE').GetName]的战争，将提供丰厚的战争资助及军事支持。"
 me_thrace_3_new_philhellene_policy.202.desc_2:0 "我们的宗主国[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]与敌人的持续战争为我们提供了另一个争取自由的机会。在他们的军队分心的情况下，我们在该地区有了出其不意和军事优势。\n\n使者已经被派遣到我们的同胞城邦，只要幸运，我们就可以协调行动，赢得我们的自由。"
 me_thrace_3_new_philhellene_policy.202.t:0 "叛乱的火焰"
 me_thrace_3_new_philhellene_policy.203.a:0 "太好了！"
 me_thrace_3_new_philhellene_policy.203.b:0 "懦夫！"
 me_thrace_3_new_philhellene_policy.203.desc_1:0 "[black_sea_revolt_leader.GetName]已经拿起武器反抗[GetCountry('TRE').GetName]和暴虐的[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]！尽管他们在对抗宗主国的抵抗中孤立无援，这一新发展应该为[GetCountry('TRE').GetAdjective]军队提供一个欢迎的分散注意力的机会。"
 me_thrace_3_new_philhellene_policy.203.desc_2:0 "[black_sea_revolt_leader.GetName]已经拿起武器反抗[GetCountry('TRE').GetName]和暴虐的[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]！受他们的榜样启发，其他城市也纷纷效仿，叛乱的火焰迅速蔓延到整个地区。这应该成为[GetCountry('TRE').GetAdjective]军队的主要分心点。"
 me_thrace_3_new_philhellene_policy.203.desc_3:0 "没有一个本都城邦抓住机会起来反抗他们的宗主国！看来他们宁愿坐视自由的希望化为泡影，也不愿与我们并肩作战。"
 me_thrace_3_new_philhellene_policy.203.desc_4:0 "事后看来，我们的干预是多余的："
 me_thrace_3_new_philhellene_policy.203.desc_5:0 "我们的礼物和支持付出了丰厚的回报："
 me_thrace_3_new_philhellene_policy.203.desc_6:0 "唉！我们的礼物和支持都徒劳无功。"
 me_thrace_3_new_philhellene_policy.203.t_1:0 "本都起义！"
 me_thrace_3_new_philhellene_policy.203.t_2:0 "本都忠诚盛行"
 me_thrace_3_new_philhellene_policy.204.a:0 "叛逆的蚊子！"
 me_thrace_3_new_philhellene_policy.204.b:0 "他们的忠诚值得称赞。"
 me_thrace_3_new_philhellene_policy.204.desc_1:0 "[black_sea_revolt_leader.GetName]已经起兵反抗我们的统治，显然是想利用我们目前战争的分心！幸运的是，这次叛乱并没有超出他们的土地，如果幸运的话，应该能很快被压制。\n\n"
 me_thrace_3_new_philhellene_policy.204.desc_2:0 "[black_sea_revolt_leader.GetName]已经起兵反抗我们的统治，他们的榜样很快就被该地区的其他人效仿！他们显然是想在我们当前战争分心的时候抓住机会。\n\n"
 me_thrace_3_new_philhellene_policy.204.desc_3:0 "我们目前的战争使我们在处理西本都城市可能的不忠问题上处于脆弱状态。敌人很容易煽动叛乱，彻底改变该区域的战略局势。\n\n然而，无论是敌人根本没有尝试，还是城邦的忠诚战胜了一切，看来我们暂时不用担心他们的不忠。"
 me_thrace_3_new_philhellene_policy.204.desc_4:0 "我们没有理由怀疑外部干预是他们不忠的原因。"
 me_thrace_3_new_philhellene_policy.204.desc_5:0 "看来是[black_sea_revolt_supporter.GetName]的干预导致了这次叛乱。"
 me_thrace_3_new_philhellene_policy.21.a:0 "没有人会质疑[ROOT.GetCountry.GetRuler.GetPraenomen]的慷慨。"
 me_thrace_3_new_philhellene_policy.21.at:0 "[SCOPE.ScriptValue('tre_mis_3_2_gold_svalue')|Y0]非$macedonian$#Y$hellenic$#!国家在希腊本土将收到[SCOPE.ScriptValue('tre_mis_3_2_gold_svalue')|G2] @gold!并获得#G +50#!对@[me_thrace_scope.GetFlag]![me_thrace_scope.GetName]的好感。"
 me_thrace_3_new_philhellene_policy.21.desc:0 "以慷慨之精神并作为尊重的象征，并伴随必要的隆重仪式，所有希腊城邦将享受[ROOT.GetCountry.GetRulerTitle]丰厚财富的一部分礼物，用于公共利益。让所有希腊人分享[ROOT.GetCountry.GetName]的好运！"
 me_thrace_3_new_philhellene_policy.21.t:0 "$thrace_03_philhellene_2$：富人的责任"
 me_thrace_3_new_philhellene_policy.21.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_2$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.22.a:0 "礼物不拒之门外？"
 me_thrace_3_new_philhellene_policy.22.desc:0 "[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]赐予我们一份丰厚的礼物，声称希望让所有希腊人分享[GetCountry('TRE').GetName]的财富。虽然无疑是为了影响我们的人民和领导者对[GetCountry('TRE').GetAdjective]利益的看法，但送到我们金库的银子无疑也是一个有力的论据……"
 me_thrace_3_new_philhellene_policy.22.t:0 "$thrace_03_philhellene_2$：[GetCountry('TRE').GetPraenomen]的礼物"
 me_thrace_3_new_philhellene_policy.31.a:0 "众神自己也会歌颂[me_thrace_scope.GetRuler.GetHerHis]功绩！"
 me_thrace_3_new_philhellene_policy.31.desc:0 "一位统治者的影响力几乎达到平民难以理解的规模，其每一个行动都会影响每一位臣民的生活。因此，[me_thrace_scope.GetRuler.GetPraenomen]，乃至整个[me_thrace_scope.GetRuler.GetFamilyDisplayName]家族，都值得一种超越单纯服从与叩拜的崇敬。已有一些人理解这一点，并四处赞颂[me_thrace_scope.GetRuler.GetHerHis]功业。在[me_thrace_scope.GetAdjective]国家与祭司团的支持下，这群热忱信徒的核心已经被转化为一个成熟国家崇拜的中心。"
 me_thrace_3_new_philhellene_policy.31.t:0 "$thrace_03_philhellene_3$：[me_thrace_scope.GetRuler.GetPraenomen]崇拜"
 me_thrace_3_new_philhellene_policy.31.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_3$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.41.a:0 "否认这一点就是异端。"
 me_thrace_3_new_philhellene_policy.41.desc:0 "建立了一座在几年内就变成繁荣大都会的城市，与亚历山大大帝并肩推翻了一个古老的帝国，并以非人类的速度带领他的军队从一个地方到另一个地方，击败了叛乱的希腊人、俄德律西亚人和安提柯人：这些都不是凡人的行为。这些行为，以及更多的行为，显示出一个能够与强大的奥林匹亚神相媲美的视野、能力和坚韧的个性。谁能不同意这些是传奇的事迹？\n\n从现在起，[deified_char.GetPraenomen]将获得在[ROOT.GetCountry.GetName]众神中的应有地位。"
 me_thrace_3_new_philhellene_policy.41.t:0 "$thrace_03_philhellene_4$：[deified_char.GetPraenomen]之神"
 me_thrace_3_new_philhellene_policy.41.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_4$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.51.a:0 "他们将看到我们是真正的朋友[GetCountry('ATH').GetName]。"
 me_thrace_3_new_philhellene_policy.51.desc:0 "伟大的[GetCountry('ATH').GetName]城市在希腊城邦中有着领导地位。获得他们的支持对我们希望让其他希腊人接受我们非常重要，因为许多人可能会跟随雅典人的榜样。\n\n为此，我们已经向雅典人提供了数十年的恩惠，并在最后加倍努力，我们现在可能会赢得雅典人的友谊，甚至忠诚。"
 me_thrace_3_new_philhellene_policy.51.t:0 "$thrace_03_philhellene_5$：建议"
 me_thrace_3_new_philhellene_policy.51.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_5$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.52.a:0 "与[GetCountry('TRE').GetName]结盟是一个很好的机会！"
 me_thrace_3_new_philhellene_policy.52.b:0 "我们不能承诺任何事情，但他们的礼物是受欢迎的。"
 me_thrace_3_new_philhellene_policy.52.c:0 "我们认为不行。"
 me_thrace_3_new_philhellene_policy.52.desc:0 "来自[GetCountry('TRE').GetName]的使者已经到达，带着礼物，滔滔不绝地谈论[GetCountry('ATH').GetName]已经从[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]那里获得的许多恩惠。他们认为[GetCountry('TRE').GetName]一次又一次地展示了它的友谊和对[GetCountry('ATH').GetName]的支持，并愿意进一步巩固这种“富有成效和有益的”关系。"
 me_thrace_3_new_philhellene_policy.52.desc_1:0 "他们甚至非常愿意提供军事支援，帮助我们摆脱来自 [athens_overlord_scope.GetName] 的统治，争取自由。"
 me_thrace_3_new_philhellene_policy.52.t:0 "$thrace_03_philhellene_5$：友谊的提议"
 me_thrace_3_new_philhellene_policy.53.a:0 "该死的[GetCountry('TRE').GetAdjective]干涉！"
 me_thrace_3_new_philhellene_policy.53.b:0 "他们以为这很容易吗？"
 me_thrace_3_new_philhellene_policy.53.c:0 "他们的忠诚值得称赞。"
 me_thrace_3_new_philhellene_policy.53.desc:0 "我们得知[GetCountry('TRE').GetAdjective]的使者访问了[GetCountry('ATH').GetName]，讨论希腊的政治局势以及[GetCountry('ATH').GetAdjective]-[GetCountry('TRE').GetAdjective]的关系。\n\n"
 me_thrace_3_new_philhellene_policy.53.desc_1:0 "这些讨论的结果是，[GetCountry('ATH').GetName]认为他们对我们的义务已经结束，并且确实与[GetCountry('TRE').GetName]结盟，直接与我们的利益相对！"
 me_thrace_3_new_philhellene_policy.53.desc_2:0 "这些讨论的结果是，[GetCountry('ATH').GetName]立即结束了与我们的关系，显然是因为他们被色雷斯人平等对待所鼓舞！"
 me_thrace_3_new_philhellene_policy.53.desc_3:0 "讨论似乎失败了，[GetCountry('ATH').GetAdjective]外交官向我们保证他们的忠诚不会轻易被破坏。"
 me_thrace_3_new_philhellene_policy.53.t:0 "[GetCountry('TRE').GetAdjective]向[GetCountry('ATH').GetName]示好"
 me_thrace_3_new_philhellene_policy.53.tt:0 "@[GetCountry('ATH').GetFlag]![GetCountry('ATH').GetName]不再是我们的属国。"
 me_thrace_3_new_philhellene_policy.54.a:0 "我们的人民将迎来光明的未来！"
 me_thrace_3_new_philhellene_policy.54.b:0 "这不是我们希望的结果，但这是一个开始。"
 me_thrace_3_new_philhellene_policy.54.c:0 "令人愤慨！他们怎么敢？！"
 me_thrace_3_new_philhellene_policy.54.desc:0 "我们的使者从[GetCountry('ATH').GetName]返回，带来了[GetCountry('ATH').GetAdjective]对我们提议的回应。\n\n"
 me_thrace_3_new_philhellene_policy.54.desc_1:0 "他们高兴地通知我们，[GetCountry('ATH').GetName]的聪明公民看到了我们友谊的价值，热烈欢迎我们的礼物和联盟提议。我们现在联合起来，追求在希腊整体上建立和平与稳定。"
 me_thrace_3_new_philhellene_policy.54.desc_2:0 "雅典人已经欣然接受了我们的礼物，但遗憾地通知我们，他们目前看不到我们两国之间更紧密关系的价值。然而，虽然现在没有，但未来可能会有。"
 me_thrace_3_new_philhellene_policy.54.desc_3:0 "雅典人全心全意地拒绝了我们的提议，甚至拒绝接受我们的礼物，称其为‘公然贿赂’，这对于像[GetCountry('ATH').GetName]这样文明的民族来说是不可接受的。"
 me_thrace_3_new_philhellene_policy.54.t:0 "$thrace_03_philhellene_5$：回应"
 me_thrace_3_new_philhellene_policy.54.tt:0 "@[GetCountry('ATH').GetFlag]！[GetCountry('ATH').GetName]不再是@[athens_overlord_scope.GetFlag]！[athens_overlord_scope.GetName]的属国。"
 me_thrace_3_new_philhellene_policy.61.a:0 "他们的荣耀会使我们的事业合法化。"
 me_thrace_3_new_philhellene_policy.61.desc:0 "虽然斯巴达的辉煌年代已经过去了几十年，他们在希腊的影响力有所减弱，但他们仍然是伯罗奔尼撒的关键，并且被许多希腊城邦视为榜样。我们的使者已经在路上，恳求我们的案子并赢得这些坚韧战士的支持。"
 me_thrace_3_new_philhellene_policy.61.t:0 "$thrace_03_philhellene_6$：提出建议"
 me_thrace_3_new_philhellene_policy.61.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_6$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.62.a:0 "与他们并肩作战将是一种荣耀！"
 me_thrace_3_new_philhellene_policy.62.b:0 "我们接受他们的礼物，但不做任何承诺。"
 me_thrace_3_new_philhellene_policy.62.c:0 "[GetCountry('SPA').GetName]不需要[GetCountry('TRE').GetAdjective]的友谊。"
 me_thrace_3_new_philhellene_policy.62.desc:0 "来自[GetCountry('TRE').GetName]的使者到达，试图赢得我们的好感。他们带来了许多礼物，讲述了一个希腊美好未来的故事，其中[GetCountry('SPA').GetName]扮演着核心角色。"
 me_thrace_3_new_philhellene_policy.62.desc_1:0 "他们甚至愿意与我们并肩作战，争取摆脱 [athens_overlord_scope.GetName] 的统治，赢得自由！"
 me_thrace_3_new_philhellene_policy.62.t:0 "$thrace_03_philhellene_6$：[GetCountry('TRE').GetAdjective]的友谊"
 me_thrace_3_new_philhellene_policy.63.desc:0 "我们得知[GetCountry('TRE').GetAdjective]的使者访问了[GetCountry('SPA').GetName]，试图赢得他们的忠诚和支持。\n\n"
 me_thrace_3_new_philhellene_policy.63.desc_1:0 "看来他们成功了，斯巴达人拒绝了他们对我们的义务，而是与[GetCountry('TRE').GetName]结盟，对我们不利！"
 me_thrace_3_new_philhellene_policy.63.desc_2:0 "看来他们至少部分成功了，因为这鼓励了斯巴达人立即背弃对我们的义务并宣布独立！"
 me_thrace_3_new_philhellene_policy.63.desc_3:0 "他们显然没有成功，因为斯巴达使者向我们保证他们的忠诚不容易被收买。"
 me_thrace_3_new_philhellene_policy.63.t:0 "[GetCountry('TRE').GetAdjective]向[GetCountry('SPA').GetName]示好"
 me_thrace_3_new_philhellene_policy.63.tt:0 "@[GetCountry('SPA').GetFlag]！[GetCountry('SPA').GetName]不再是我们的属国。"
 me_thrace_3_new_philhellene_policy.64.a:0 "我们将无敌！"
 me_thrace_3_new_philhellene_policy.64.b:0 "我们会向他们展示我们值得他们的友谊。"
 me_thrace_3_new_philhellene_policy.64.c:0 "他们……确实有道理……"
 me_thrace_3_new_philhellene_policy.64.desc:0 "我们的使者从[GetCountry('SPA').GetName]返回，带来了[GetCountry('SPA').GetAdjective]对我们提议的回应。\n\n"
 me_thrace_3_new_philhellene_policy.64.desc_1:0 "他们高兴地通知我们，[GetCountry('SPA').GetName]的强大战士愿意作为我们在希腊的盟友并肩作战。"
 me_thrace_3_new_philhellene_policy.64.desc_2:0 "斯巴达人非常优雅地接受了我们对他们战争宝库的贡献，但他们认为目前建立更正式的联盟不符合他们的利益。"
 me_thrace_3_new_philhellene_policy.64.desc_3:0 "斯巴达人用简洁的回复“如果我们的忠诚可以用价格买到，那它就不值得”拒绝了我们的合作提议。即使是我们的礼物也被使者带回。"
 me_thrace_3_new_philhellene_policy.64.t:0 "$thrace_03_philhellene_6$：回应"
 me_thrace_3_new_philhellene_policy.64.tt:0 "@[GetCountry('SPA').GetFlag]！[GetCountry('SPA').GetName]不再是@[sparta_overlord_scope.GetFlag]！[sparta_overlord_scope.GetName]的属国。"
 me_thrace_3_new_philhellene_policy.71.a:0 "这是一点小小的代价。"
 me_thrace_3_new_philhellene_policy.71.at:0 "$me_tre_task_start_tt_1$放宽铸币限制。"
 me_thrace_3_new_philhellene_policy.71.desc:0 "铸造自己的货币的权利是一种巨大的荣誉，通常只保留给独立的强大国家。然而，西本都城邦长期以来一直行使这一权利。\n\n尽管他们名义上服从于[GetCountry('TRE').GetAdjective]的王位，但如果我们允许他们继续铸造自己的硬币，这将大大赢得这些城邦的好感。"
 me_thrace_3_new_philhellene_policy.71.t:0 "$thrace_03_philhellene_7$"
 me_thrace_3_new_philhellene_policy.72.a:0 "这是一个极好的发展！"
 me_thrace_3_new_philhellene_policy.72.at:0 "我们的本都城邦附属国将#G -50.0%#!减少被煽动叛乱的可能性。"
 me_thrace_3_new_philhellene_policy.72.at1:0 "每个其他本都城邦附属国也将对@[me_thrace_scope.GetFlag]![me_thrace_scope.GetName]#G +25#!好感度，并在其首都省份获得“#Y $state_improvement_oratory$#!”。"
 me_thrace_3_new_philhellene_policy.72.desc:0 "我们放弃王室铸币特权的决定被这些城邦视为极大的尊重。不仅如此，我们还赢得了大量的好感，他们对自己硬币的控制也增强了他们的经济，最终可能出乎意料地对我们有利。"
 me_thrace_3_new_philhellene_policy.72.t:0 "$thrace_03_philhellene_7$"
 me_thrace_3_new_philhellene_policy.72.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_7$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.73.a:0 "这是极大的尊重！"
 me_thrace_3_new_philhellene_policy.73.desc:0 "[GetCountry('TRE').GetRulerTitle][GetCountry('TRE').GetRuler.GetPraenomen]认为有必要放宽对王室铸币特权的要求。我们被授予特别许可，继续这项工作，并从中获得经济利益，而不是坚持要求我们停止铸造自己的硬币。"
 me_thrace_3_new_philhellene_policy.73.t:0 "[GetCountry('TRE').GetName]容许地方铸币"
 me_thrace_3_new_philhellene_policy.74.t:0 "$thrace_03_philhellene_7$：地方铸币关闭"
 me_thrace_3_new_philhellene_policy.74.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_7$#!已被#R绕过#!"
 me_thrace_3_new_philhellene_policy.81.a:0 "我们做得很好。"
 me_thrace_3_new_philhellene_policy.81.desc:0 "我们在希腊的努力正在取得成效。我们的地位日益增强，希腊人开始视我们为他们的保护者和利益的捍卫者。\n\n尽管我们在希腊对其他继承者的胜利尚未确定，但我们在确保我们的存在、挑战我们的对手和结盟方面取得了重大进展。我们应该花一点时间来庆祝我们迄今为止的成功，并正式确立我们的地位。"
 me_thrace_3_new_philhellene_policy.81.t:0 "$thrace_03_philhellene_8$：新的保护者"
 me_thrace_3_new_philhellene_policy.81.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_8$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.91.a:0 "派遣部队。"
 me_thrace_3_new_philhellene_policy.91.at:0 "$me_tre_task_start_tt_1$驻扎本都城市。"
 me_thrace_3_new_philhellene_policy.91.desc:0 "通过在希腊城邦内驻扎我们士兵的强大部队，应该不断提醒城邦当局他们应效忠谁。\n\n我们的军队驻扎在每个城市，我们的指挥官负责处理任何有组织的抵抗迹象，作为第一道防线。"
 me_thrace_3_new_philhellene_policy.91.t:0 "$thrace_03_philhellene_9$"
 me_thrace_3_new_philhellene_policy.92.a:0 "对我们关注的可见提醒。"
 me_thrace_3_new_philhellene_policy.92.desc:0 "驻军已经建立，我们的部队在城邦的街道上巡逻。人们可以放心，我们保护他们免受外部和内部的威胁。\n\n任何企图叛乱的行动都应被驻扎在城市中的有墙壁和防御工事的军营所阻止，在这些军营中我们的士兵安全地安置着，可以抵御任何突然的叛乱企图。"
 me_thrace_3_new_philhellene_policy.92.t:0 "$thrace_03_philhellene_9$"
 me_thrace_3_new_philhellene_policy.92.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_9$$mission_task_completed_tt_2$"
 me_thrace_3_new_philhellene_policy.94.t:0 "$thrace_03_philhellene_9$：驻军撤回"
 me_thrace_3_new_philhellene_policy.94.tt:0 "$mission_task_completed_tt_1$$thrace_03_philhellene_9$#!已被#R绕过#!"
 me_thrace_start_tt:0 "[me_thrace_scope.GetRulerTitle][me_thrace_scope.GetRuler.GetPraenomen]将开始"
 me_thracian_01_hellespont.1.a:0 "没有人能抗拒我们的力量！"
 me_thracian_01_hellespont.1.a.tt:0 "我们所有的[hellenic_culture_scope.GetName|Y]文化邻居将对我们失去信心。"
 me_thracian_01_hellespont.1.b.tt:0 "这将损害我们希腊邻国对我们的看法。"
 me_thracian_01_hellespont.1.desc:0 "我们的赫勒斯滂邻近城市为他们决定与[GetCountry('PRY').GetName]结盟付出了沉重代价。\n\n即使召来了强大的盟友，他们也无法与我们的军队抗衡，我们的军队摧毁了他们的军队并破坏了他们的城市。该地区的其他希腊人可能会受到威吓而拒绝帮助我们，但真正重要的是我们向邻国发出了明确的信号，并在亚洲建立了我们的首个基地。"
 me_thracian_01_hellespont.1.end.tt:0 "使命任务“#Y $thracian_01_hellespont_task_1$#!”现已#G 完成#!!"
 me_thracian_01_hellespont.1.t:0 "粉碎亚洲希腊抵抗：不留情"
 me_thracian_01_hellespont.10.a:0 "古老的英雄引领我们走向伟大！"
 me_thracian_01_hellespont.10.a.tt:0 "每个[hellenic_scope.GetName|Y]文化的国家都将欣赏我们为纪念特洛伊战争所做的努力。"
 me_thracian_01_hellespont.10.b.tt:0 "每个希腊文化的国家都将欣赏我们为纪念特洛伊战争所做的努力。"
 me_thracian_01_hellespont.10.c.tt:0 "[achilles_scope.GetName|Y]的崇拜现已在我们的万神殿中可用！"
 me_thracian_01_hellespont.10.d.tt:0 "阿喀琉斯的崇拜将成为我们万神殿中的一部分。"
 me_thracian_01_hellespont.10.desc:0 "在安提柯人的多年管理不善之后，希腊世界最著名的遗址之一终于回到了一个尊重的领导者的控制之下。\n\n亚历山大，一个真正的人间英雄，现在是神中的神，他一踏上亚洲，就来到[GetProvince('(int32)257').GetName]祭奠阿喀琉斯的墓地。我们的巴西琉斯[GetCountry('TRE').GetRuler.GetName]决定效仿他的光辉榜样：抵达时亲自向遗址献上了盛大的庆典和祭品。让人们知道[GetCountry('TRE').GetRuler.GetName]尊重古老的英雄，首先是阿喀琉斯，并努力效仿他们的光荣事迹！"
 me_thracian_01_hellespont.10.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_6$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.10.t:0 "特洛伊的事：伟大的遗产"
 me_thracian_01_hellespont.11.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_7$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.11.t:0 "本都的赫拉克利亚：阿马斯特里斯"
 me_thracian_01_hellespont.12.a:0 "让我们派遣使者。"
 me_thracian_01_hellespont.12.desc:0 "[GetCountry('HCP').GetName]的专制国位于比提尼亚未来扩张的道路上，将成为我们与南方[GetCountry('PRY').GetName]冲突中的有用据点。\n\n这个王国由已故波斯大流士三世的亲属统治，在其边界外的权力斗争中无能为力，可能对获得保护者感兴趣。此外，这些土地曾经在亚历山大帝国的影响下，将它们重新带回马其顿的引导下是一个值得的事业。"
 me_thracian_01_hellespont.12.t:0 "本都的赫拉克利亚：提议"
 me_thracian_01_hellespont.13.a:0 "可悲的是，他们是对的。我们必须接受。"
 me_thracian_01_hellespont.13.b:0 "我们不会接受这种荒谬的提议！"
 me_thracian_01_hellespont.13.desc:0 "[GetCountry('TRE').GetName]的使者带着胜利征服者的傲慢站在[GetCountry('HCP').GetRuler.GetName]面前。他们带着他们的巴西琉斯[GetCountry('TRE').GetRuler.GetPraenomen]的友谊、黄金和带有隐晦威胁的提议。\n\n他们指出我们是处在相互争斗的巨人之间的一个小国，无力防御。通过放弃我们的自由和独立，成为他们的臣民，我们将获得一个强大的盟友和保护者——一个如果被拒绝，可能同样容易成为致命敌人的保护者。"
 me_thracian_01_hellespont.13.t:0 "来自色雷斯的提议"
 me_thracian_01_hellespont.14.a:0 "他们的选择是明智的。"
 me_thracian_01_hellespont.14.desc:0 "[GetCountry('HCP').GetRuler.GetName]明智地选择了对[GetCountry('HCP').GetName]人民最安全的道路。我们的使者满意地返回家乡。\n\n[GetCountry('HCP').GetName]现在是我们的附庸国，将为我们在安纳托利亚前线的军事努力做出贡献。尽管是一个非常小的国家，[GetCountry('HCP').GetName]在安纳托利亚的影响力很大。我们阻止它们落入竞争对手手中的做法是明智的。\n\n我们外交上的又一次成功！"
 me_thracian_01_hellespont.14.t:0 "本都的赫拉克利亚：提议接受"
 me_thracian_01_hellespont.15.a:0 "他们会后悔反抗我们的选择！"
 me_thracian_01_hellespont.15.desc:0 "[GetCountry('HCP').GetRuler.GetName]没有明智地选择，而是选择了对[GetCountry('HCP').GetName]人民最危险的道路。\n\n我们的使者失望地返回家乡；[GetCountry('HCP').GetName]拒绝了我们让其成为我们附庸国的提议。\n\n尽管外交失败了，但我们的军队必将成功。尽管是一个非常小的国家，[GetCountry('HCP').GetName]在安纳托利亚确实是一个有影响力的玩家，我们不能允许它们落入竞争对手的影响下！"
 me_thracian_01_hellespont.15.t:0 "本都的赫拉克利亚：提议拒绝"
 me_thracian_01_hellespont.16.a:0 "让我们送出我们的提议。"
 me_thracian_01_hellespont.16.desc:0 "尽管我们尽了最大的努力，但我们无法与像[GetCountry('PRY').GetName]和[GetCountry('EGY').GetName]这样的巨人的造船产量竞争。然而，战争已经扩展到海上，我们必须跟上竞争对手的步伐，如果我们想要生存和繁荣。\n\n我们的邻居[GetCountry('BYZ').GetName]以其造船经验和舰队规模而闻名；如果我们能控制他们的港口和舰队，我们可以改变任何继业者之间战争的局势。我们应该向他们伸出友谊和保护的手，只要他们向我们提供他们强大的舰队。"
 me_thracian_01_hellespont.16.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_8$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.16.t:0 "拜占庭舰队：控制海洋"
 me_thracian_01_hellespont.17.a:0 "可悲的是，他们是对的。我们必须接受。"
 me_thracian_01_hellespont.17.a.tt:0 "我们还将放弃我们的舰队给他们。"
 me_thracian_01_hellespont.17.b:0 "我们不会接受这种荒谬的提议！"
 me_thracian_01_hellespont.17.b.tt:0 "[GetCountry('TRE').GetName|Y]不会感到愉快，可能会做出暴力反应。"
 me_thracian_01_hellespont.17.desc:0 "[GetCountry('TRE').GetName]的使者带着胜利征服者的傲慢站在[GetCountry('BYZ').GetRuler.GetName]面前。他们带着他们的巴西琉斯[GetCountry('TRE').GetRuler.GetPraenomen]的友谊、黄金和带有隐晦威胁的提议。\n\n他们指出我们是处在相互争斗的巨人之间的一个小国。通过放弃我们的自由、独立和舰队，成为他们的臣民，我们将获得一个强大的盟友和保护者——一个如果被拒绝，可能同样容易成为致命敌人的保护者。"
 me_thracian_01_hellespont.17.t:0 "来自色雷斯的提议"
 me_thracian_01_hellespont.18.a:0 "他们的选择是明智的。"
 me_thracian_01_hellespont.18.a.tt:0 "[GetCountry('BYZ').GetName|Y]将其舰队交给我们。"
 me_thracian_01_hellespont.18.desc:0 "[GetCountry('BYZ').GetRuler.GetName]明智地选择了对[GetCountry('BYZ').GetName]人民最安全的道路。\n\n我们的使者满意地返回家乡。[GetCountry('BYZ').GetName]现在是我们的附庸国，将用她的舰队为我们的军事努力做出贡献。\n\n我们外交上的又一次成功！"
 me_thracian_01_hellespont.18.t:0 "拜占庭舰队：提议接受"
 me_thracian_01_hellespont.19.a:0 "战争！"
 me_thracian_01_hellespont.19.desc:0 "[GetCountry('BYZ').GetRuler.GetName]愚蠢地选择了对[GetCountry('BYZ').GetName]人民最危险的道路。\n\n我们的使者失望地返回家乡；[GetCountry('BYZ').GetName]拒绝了我们让其成为我们附庸国的提议。\n\n尽管外交失败了，但我们的军队必将成功。我们不能允许[GetCountry('BYZ').GetAdjective]舰队及其广泛的船厂落入竞争对手手中。如果我们无法和平地控制它们，我们宁愿摧毁它们。"
 me_thracian_01_hellespont.19.t:0 "拜占庭舰队：提议拒绝"
 me_thracian_01_hellespont.2.a:0 "外交是一种比剑更强大的武器。"
 me_thracian_01_hellespont.2.a.tt:0 "根据他们对我们的看法，这些国家可能会从[GetCountry('PRY').GetName]叛逃并加入我们： [cdd_scope.GetName] [ast_scope.GetName] [kio_scope.GetName] [kzk_scope.GetName]。"
 me_thracian_01_hellespont.2.b.tt:0 "根据他们对我们的看法，任何存在的国家，包括[GetCountry('CDD').GetName|Y]、[GetCountry('AST').GetName|Y]、[GetCountry('KIO').GetName|Y]和[GetCountry('KZK').GetName|Y]，都有可能从[GetCountry('PRY').GetName]叛逃并加入我们。"
 me_thracian_01_hellespont.2.b.tt.2:0 "我们将向每个国家发送#Y 125#!金币的贿赂。"
 me_thracian_01_hellespont.2.desc:0 "[GetCharacter('(int32)37').GetName]在通过承诺影响希腊人方面的技巧长期以来无人能敌，但我们的巴西琉斯[ROOT.GetCountry.GetRuler.GetName]同样具有说服力。\n\n我们的使者应尝试获得赫勒斯滂周围一些[GetCountry('PRY').GetName]盟友的支持。通过外交、贿赂和恐吓的混合手段，他们可能愿意听取我们的提议，如果满意，就会背弃他们目前的霸主并加入我们！"
 me_thracian_01_hellespont.2.end.tt:0 "任务'#Y $thracian_01_hellespont_task_2$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.2.t:0 "争取亚洲希腊忠诚：诱人的提议"
 me_thracian_01_hellespont.21.tt:0 "与伊庇鲁斯人的交易：友谊"
 me_thracian_01_hellespont.24.a:0 "现在是他们履行承诺的时候了。"
 me_thracian_01_hellespont.24.a.tt:0 "我们要求[GetCountry('EPI').GetName|Y]加入我们的战争。"
 me_thracian_01_hellespont.24.desc:0 "不久前，我们与伊庇鲁斯人达成了一项协议：由于我们都不信任[GetCountry('MAC').GetName]并渴望她的王位，我们决定联合发动一场针对[GetCountry('MAC').GetName]的联合战争，在两个战线上攻击她。\n\n战争已经开始，我们指望[GetCountry('EPI').GetRuler.GetName|Y]履行他的承诺并尽自己的一份力量。[GetCountry('MAC').GetName]肯定会在我们军队的联合力量面前倒下，我们唯一的担忧是如何分享战利品！"
 me_thracian_01_hellespont.24.t:0 "马其顿问题：承诺"
 me_thracian_01_hellespont.25.a:0 "前进！"
 me_thracian_01_hellespont.25.desc:0 "[GetCountry('MAC').GetName]自[GetCharacter('(int32)32').GetPraenomen]去世以来已经变得分裂、混乱和虚弱。亚历山大的王位已被玷污，但我们有机会恢复其合法的伟大。\n\n我们与[GetCountry('MAC').GetName]的战争必须继续，直到我们的巴西琉斯[GetCountry('TRE').GetRuler.GetName|Y]平定整个地区并自豪地坐在亚历山大曾坐过的地方！"
 me_thracian_01_hellespont.25.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_9$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.25.t:0 "马其顿问题：新巴西琉斯"
 me_thracian_01_hellespont.26.a:0 "承诺就是承诺，宣誓在宙斯之名！"
 me_thracian_01_hellespont.26.b:0 "承诺是用来打破的……"
 me_thracian_01_hellespont.26.desc:0 "不久前，我们与[GetCountry('TRE').GetName]达成了一项协议：由于我们都不信任[GetCountry('MAC').GetName]并渴望她的王位，我们决定联合发动一场针对[GetCountry('MAC').GetName]的联合战争，在两个战线上攻击她。\n\n战争已经开始，[GetCountry('TRE').GetRuler.GetName]指望我们履行承诺并尽我们的一份力量。[GetCountry('MAC').GetName]肯定会在我们军队的联合力量面前倒下，现在背信弃义将不可修复地损害我们与[GetCountry('TRE').GetName]的关系；然而，我们也可能希望等待这场战争，看我们的竞争对手互相消耗，然后才介入……"
 me_thracian_01_hellespont.26.t:0 "来自色雷斯的请求"
 me_thracian_01_hellespont.27.a:0 "非常好。"
 me_thracian_01_hellespont.27.desc:0 "伊庇鲁斯人履行了他们的承诺，加入了战争。我们可以从两侧对[GetCountry('MAC').GetName]施加压力，进行夹击，使他们无处可逃。\n\n很快我们的军队将凯旋而归，征服[GetCountry('MAC').GetName]！虽然胜利几乎是必然的，但我们也应该考虑我们联合行动的可能后果：我们将如何与盟友分享[GetCountry('MAC').GetName]王国的残余？\n\n我们是否准备好背叛他们或被背叛？"
 me_thracian_01_hellespont.27.t:0 "马其顿问题：援助到来"
 me_thracian_01_hellespont.28.a:0 "愿宙斯诅咒他们！"
 me_thracian_01_hellespont.28.desc:0 "我们被背叛了！那些无耻的[GetCountry('EPI').GetName]狗改变了主意，不会加入我们对[GetCountry('MAC').GetName]的战争！\n\n看来[GetCountry('EPI').GetRuler.GetPraenomen]的承诺如今不值一提；我们再也不会信任他们了。此外，我们甚至不需要他们的帮助。[GetCountry('MAC').GetName]仍将属于我们。"
 me_thracian_01_hellespont.28.t:0 "马其顿问题：被背叛"
 me_thracian_01_hellespont.29.a:0 "[GetCountry('TRE').GetName]繁荣昌盛！"
 me_thracian_01_hellespont.29.desc:0 "我们在亚洲的进军是不可阻挡的：我们已经巩固了从赫勒斯滂到托罗斯山脉的地位，而我们的竞争对手日渐虚弱。\n\n虽然赫勒斯滂仍然是我们的最终防线，但我们在[GetProvince('(int32)257').GetArea.GetRegion.GetName]和[GetProvince('(int32)1941').GetArea.GetRegion.GetName]的扩张几乎使我们的王国面积翻倍，特别是将日益炽热的亚洲边界远离了我们的首都。如果我们能保持对这些高度竞争地区的控制，我们击败竞争对手的可能性将成倍增加。"
 me_thracian_01_hellespont.29.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_10$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.29.t:0 "巩固亚洲收益：安纳托利亚之主"
 me_thracian_01_hellespont.3.a:0 "是的，我们接受提议。"
 me_thracian_01_hellespont.3.a.tt:0 "我们的国家成为[GetCountry('TRE').GetName|Y]的附庸。"
 me_thracian_01_hellespont.3.b:0 "不，我们不是叛徒！"
 me_thracian_01_hellespont.3.b.tt:0 "可能会有后果。\n\n[GetCountry('TRE').GetName|Y]对我们的国家获得宣称。"
 me_thracian_01_hellespont.3.desc:0 "[GetCountry('TRE').GetName]的使者最近抵达我们的城市。\n\n他们带来了一笔可观的黄金作为礼物，还有一个有趣的提议。[GetCountry('TRE').GetRuler.GetName]是一位慷慨而仁慈的人，他愿意在我们接受背叛我们的霸主[GetCountry('PRY').GetRuler.GetName]并倒戈的情况下，给予我们巨大的保护和好处。\n\n这样的提议本应是令人震惊的，但[GetCountry('PRY').GetRuler.GetName]总是在远方打仗，而[GetCountry('TRE').GetRuler.GetName]离我们的边界如此近，危险重重……"
 me_thracian_01_hellespont.3.t:0 "来自赫勒斯滂的提议"
 me_thracian_01_hellespont.30.a:0 "我们会让他们成为真正的希腊人！"
 me_thracian_01_hellespont.30.a.tt:0 "[GetCountry('TRE').GetRuler.GetName]鼓励[anatolian_scope.GetName|Y]人希腊化。"
 me_thracian_01_hellespont.30.desc:0 "亚洲内陆一直居住着[anatolian_scope.GetName]人。\n\n虽然他们不会说希腊语，也不穿像我们一样的衣服，但邻近希腊城市及其文化对他们的影响很大。他们钦佩我们——这是理所当然的——通过一些额外的努力和投资，他们可以被说服适应我们的方式。这将使我们更容易控制该地区，他们将更热情地参与我们的事业。"
 me_thracian_01_hellespont.30.t:0 "希腊化亚洲收益：推广希腊文化"
 me_thracian_01_hellespont.31.a:0 "同时，我们为一个良好的开始干杯！"
 me_thracian_01_hellespont.31.a.tt:0 "所有[hellenic_scope.GetName|Y]国家将欣赏我们传播共同文化的努力。"
 me_thracian_01_hellespont.31.a.tt.2:0 "[GetProvince('(int32)257').GetArea.GetRegion.GetName|Y]和[GetProvince('(int32)1941').GetArea.GetRegion.GetName|Y]中的5个非[hellenic_scope.GetName|Y]人口将转变为[macedonian_scope.GetName|Y]。"
 me_thracian_01_hellespont.31.a.tt.3:0 "所有[anatolian_scope.GetName|Y]文化都将获得“$tre_anatolian_integration$”。"
 me_thracian_01_hellespont.31.a.tt.4:0 "所有安纳托利亚文化将获得'$tre_anatolian_integration$'。"
 me_thracian_01_hellespont.31.a.tt.5:0 "[GetProvince('(int32)257').GetArea.GetRegion.GetName|Y]和[GetProvince('(int32)1941').GetArea.GetRegion.GetName|Y]的5个#Y非希腊#!人口将成为#Y马其顿人#!。"
 me_thracian_01_hellespont.31.a.tt.6:0 "所有#Y 希腊#!国家将欣赏我们传播共同文化的努力。"
 me_thracian_01_hellespont.31.desc:0 "我们新政策实施的第一年后，我们开始看到初步成果。\n\n[GetProvince('(int32)257').GetArea.GetRegion.GetName]和[GetProvince('(int32)1941').GetArea.GetRegion.GetName]的[anatolian_scope.GetName]人正日益变得[hellenic_scope.GetName]，学习我们的语言，接受我们的习俗，并在我们的官僚机构中占据一席之地。虽然这一过程可以得到鼓励和支持，但不能强制，它需要几代人的时间才能完成。"
 me_thracian_01_hellespont.31.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_11$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.31.t:0 "希腊化亚洲收益：初步成果"
 me_thracian_01_hellespont.32.a:0 "这将是一个伟大的成就。"
 me_thracian_01_hellespont.32.a.tt:0 "[GetCountry('TRE').GetName]在[GetProvince('(int32)1951').GetArea.GetName|Y]、[GetProvince('(int32)1799').GetArea.GetName|Y]、[GetProvince('(int32)1836').GetArea.GetName|Y]、[GetProvince('(int32)172').GetArea.GetName|Y]和[GetProvince('(int32)1854').GetArea.GetName|Y]获得宣称。"
 me_thracian_01_hellespont.32.desc:0 "我们已在[GetProvince('(int32)1951').GetArea.GetRegion.GetName]获得了第一块领土，但这只是我们计划的第一步。\n\n利用邻国虚弱的抵抗，我们应当推进到卡帕多西亚，扩展我们的统治到整个托罗斯山脉——这是一条自然的安全边界，防止来自南方和东部的入侵者。"
 me_thracian_01_hellespont.32.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_12$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.32.t:0 "确保卡帕多西亚：第一步"
 me_thracian_01_hellespont.33.a.tt:0 "#Y 佩加蒙#! 将获得我们在 [GetProvince('(int32)278').GetArea.GetName]、[GetProvince('(int32)257').GetArea.GetName] 和 [GetProvince('(int32)254').GetArea.GetName] 的所有领土。\n#Y 佩加蒙#! 将成为 #Y [THIS.GetCountry.GetName]#! 的一个 #Y 总督辖区#!。\n#Y [SCOPE.sChar('dhe_thrace_philaeterus_scope').GetName]#! 将成为 #Y 佩加蒙#! 的统治者。"
 me_thracian_01_hellespont.33.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_13$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.33.t:0 "亚洲自治：新王国"
 me_thracian_01_hellespont.33.tt:0 "我们将在[GetProvince('(int32)278').GetArea.GetRegion.GetName]西北部建立一个附庸国，其首都位于[GetProvince('(int32)278').GetName|Y]。"
 me_thracian_01_hellespont.34.a:0 "让我们充分利用我们的舰队！"
 me_thracian_01_hellespont.34.desc:0 "自王国建立以来，我们的海上利益一直在[GetProvince('(int32)2770').GetArea.GetName]。尽管我们的地理位置跨越两个海域，但我们最近的扩张主要针对亚洲内陆地区。\n\n然而，我们现在确实控制了沿爱琴海海岸的几个港口，我们不应让它们的潜力被浪费。其他继业者事实上对该地区非常感兴趣，准备利用我们的分心。如果我们不控制海洋，他们将能够直接运送到我们首都的大门口！"
 me_thracian_01_hellespont.34.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_14$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.34.t:0 "争夺爱琴海：战舰"
 me_thracian_01_hellespont.35.a:0 "带来[demetrius_character_scope.GetPraenomen]并向他倒熔化的金子！"
 me_thracian_01_hellespont.35.desc:0 "[GetCharacter('(int32)37').GetPraenomen]和[GetCharacter('(int32)41').GetPraenomen]自他们在亚历山大共同服务以来就从未喜欢过对方，而我们创始人与[GetCharacter('(int32)37').GetPraenomen]的儿子[GetCharacter('(int32)38').GetPraenomen]的关系更差。虽然自称为国王——像亚历山大一样，[GetCharacter('(int32)38').GetPraenomen]会称呼[GetCharacter('(int32)41').GetPraenomen]为财政官，一个吝啬的财政官。\n\n现在[demetrius_character_scope.GetName]是我们的囚犯，这个侮辱将用鲜血来偿还。"
 me_thracian_01_hellespont.35.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_15$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.35.t:0 "诗意的正义"
 me_thracian_01_hellespont.36.a:0 "我们做得很好。"
 me_thracian_01_hellespont.36.desc:0 "由于我们创始人[GetCharacter('(int32)41').GetName]所指定的最初总督领的位置，我们的国家一直将[GetProvince('(int32)2770').GetArea.GetName]视为我们独有的利益区。\n\n[GetProvince('(int32)350').GetArea.GetRegion.GetName]并不富裕；城市很少，但它们都是古老的希腊殖民地，在一个由好战的野蛮人居住的遥远土地上，通过商业技能生存了几个世纪。特别是从[GetProvince('(int32)2770').GetArea.GetName]交易的谷物长期以来支持了像[GetProvince('(int32)416').GetName]这样的大城市的成长。通过将我们的竞争对手排除在该地区之外，我们确保了自己在粮食供应方面的战略优势。"
 me_thracian_01_hellespont.36.end.tt:0 "任务'#Y $thracian_01_hellespont$#!现已#G 完成#!!"
 me_thracian_01_hellespont.36.t:0 "庞提克霸权"
 me_thracian_01_hellespont.37.a:0 "没关系。"
 me_thracian_01_hellespont.37.desc:0 "显然，我们错了。我们在[GetCountry('EPI').GetAdjective]宫廷的联系人让我们相信[GetCountry('EPI').GetRuler.GetName]即将向我们提出一个有趣的提议，共同攻击[GetCountry('MAC').GetName]。\n\n然而，来自伊庇鲁斯的沉默令人震惊，我们必须假设他们改变了主意，决定单独打他们的战争。\n\n我们将在战场上与他们相见。"
 me_thracian_01_hellespont.37.t:0 "与伊庇鲁斯人的交易：没有结果"
 me_thracian_01_hellespont.39.a:0 "这是一个勇敢而值得的努力。"
 me_thracian_01_hellespont.39.a.tt:0 "我们开始执行任务！"
 me_thracian_01_hellespont.39.desc:0 "[GetCountry('TRE').GetName]处于极其脆弱的境地：北方有野蛮人的威胁，西方和南方有其他继业者的威胁，被不安分的臣民和机会主义的地方势力包围。我们年轻的王国每天都面临生存的威胁。\n\n然而，我们精明的巴西琉斯[GetCountry('TRE').GetRuler.GetPraenomen]有一个计划，先发制人，摧毁我们的敌人，防止他们摧毁我们。"
 me_thracian_01_hellespont.39.t:0 "跨越赫勒斯滂"
 me_thracian_01_hellespont.4.a:0 "他们怎么敢？！"
 me_thracian_01_hellespont.4.desc.1:0 "[GetCountry('CDD').GetName]的骄傲人民无法被说服。\n\n他们没有被我们的承诺所打动，也没有被我们的黄金所收买，甚至没有被我们强大的军队的近在咫尺所吓倒。我们尝试了所有的策略，但徒劳无功：他们依然骄傲地站在[GetCountry('PRY').GetRuler.GetName]一边。\n\n他们将会后悔的。"
 me_thracian_01_hellespont.4.desc.2:0 "[GetCountry('AST').GetName]的骄傲人民无法被说服。\n\n他们没有被我们的承诺所打动，也没有被我们的黄金所收买，甚至没有被我们强大的军队的近在咫尺所吓倒。我们尝试了所有的策略，但徒劳无功：他们依然骄傲地站在[GetCountry('PRY').GetRuler.GetName]一边。\n\n他们将会后悔的。"
 me_thracian_01_hellespont.4.desc.3:0 "[kio_tag_scope.GetName]的骄傲人民无法被说服。\n\n他们没有被我们的承诺所打动，也没有被我们的黄金所收买，甚至没有被我们强大的军队的近在咫尺所吓倒。我们尝试了所有的策略，但徒劳无功：他们依然骄傲地站在[GetCountry('PRY').GetRuler.GetName]一边。\n\n他们将会后悔的。"
 me_thracian_01_hellespont.4.desc.4:0 "[GetCountry('KZK').GetName]的骄傲人民无法被说服。\n\n他们没有被我们的承诺所打动，也没有被我们的黄金所收买，甚至没有被我们强大的军队的近在咫尺所吓倒。我们尝试了所有的策略，但徒劳无功：他们依然骄傲地站在[GetCountry('PRY').GetRuler.GetName]一边。\n\n他们将会后悔的。"
 me_thracian_01_hellespont.4.t:0 "负面回应"
 me_thracian_01_hellespont.40.a:0 "成功！"
 me_thracian_01_hellespont.40.a.tt:0 "我们成功完成了任务！"
 me_thracian_01_hellespont.40.desc:0 "确保我们在黑海和赫勒斯滂对岸的地位只是第一步。\n\n我们王国的心脏地带是安全的，我们的边界变得辽阔而坚固，但我们不能自满。我们的继业者对手已经学会了害怕和尊重我们，[ROOT.GetCountry.GetRuler.GetName]终于成为在重新统一亚历山大帝国的斗争中一个真正的竞争者，成为他的真正继承者。迈向更大的荣耀！"
 me_thracian_01_hellespont.40.t:0 "赫勒斯滂以外"
 me_thracian_01_hellespont.5.a:0 "这是他们明智的选择。"
 me_thracian_01_hellespont.5.desc.1:0 "[GetCountry('CDD').GetName]接受了我们的提议！\n\n无论他们是被我们的承诺所打动，被我们的黄金所收买，还是被我们强大的军队的近在咫尺所吓倒，他们决定背叛他们的霸主，被诅咒的[GetCountry('PRY').GetName]，并选择成为我们的臣民！我们必须预期[GetCountry('PRY').GetRuler.GetName]的迅速报复，但在此期间，我们应庆祝我们熟练的外交成就！"
 me_thracian_01_hellespont.5.desc.2:0 "[GetCountry('AST').GetName]接受了我们的提议！\n\n无论他们是被我们的承诺所打动，被我们的黄金所收买，还是被我们强大的军队的近在咫尺所吓倒，他们决定背叛他们的霸主，被诅咒的[GetCountry('PRY').GetName]，并选择成为我们的臣民！我们必须预期[GetCountry('PRY').GetRuler.GetName]的迅速报复，但在此期间，我们应庆祝我们熟练的外交成就！"
 me_thracian_01_hellespont.5.desc.3:0 "[kio_tag_scope.GetName]接受了我们的提议！\n\n无论他们是被我们的承诺所打动，被我们的黄金所收买，还是被我们强大的军队的近在咫尺所吓倒，他们决定背叛他们的霸主，被诅咒的[GetCountry('PRY').GetName]，并选择成为我们的臣民！我们必须预期[GetCountry('PRY').GetRuler.GetName]的迅速报复，但在此期间，我们应庆祝我们熟练的外交成就！"
 me_thracian_01_hellespont.5.desc.4:0 "[GetCountry('KZK').GetName]接受了我们的提议！\n\n无论他们是被我们的承诺所打动，被我们的黄金所收买，还是被我们强大的军队的近在咫尺所吓倒，他们决定背叛他们的霸主，被诅咒的[GetCountry('PRY').GetName]，并选择成为我们的臣民！我们必须预期[GetCountry('PRY').GetRuler.GetName]的迅速报复，但在此期间，我们应庆祝我们熟练的外交成就！"
 me_thracian_01_hellespont.5.t:0 "肯定回应"
 me_thracian_01_hellespont.6.a:0 "我们已经尽力了。"
 me_thracian_01_hellespont.6.desc:0 "我们已经收到了我们所联系的所有国家的答复。无论结果是否符合我们的预期，我们的使者都尽了最大努力，外交艺术已经发挥了作用。[GetCountry('PRY').GetName]在其盟友和臣民中的地位并不像他们想传达的那样强大；如果我们能在战场上取得一些重要的胜利，[GetCountry('PRY').GetRuler.GetPraenomen]的力量就会崩溃。\n\n现在是时候用我们的军队继续进攻了！"
 me_thracian_01_hellespont.6.t:0 "争取亚洲希腊忠诚：结果"
 me_thracian_01_hellespont.7.a:0 "武装起来！"
 me_thracian_01_hellespont.7.desc:0 "[GetCountry('PRY').GetName]与我们之间的边界摩擦已经达到了临界点。[GetCountry('PRY').GetRuler.GetName]显然不会停止任何证明他对亚历山大帝国宣称的合法性，我们都是他道路上的障碍。如果我们允许安提柯军队将战争带到赫勒斯滂，我们将被孤立且脆弱；然而，如果我们将战争带给他们，我们可以与其他继业者联合，从各个方面对[GetCountry('PRY').GetRuler.GetPraenomen]施压！"
 me_thracian_01_hellespont.7.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_3$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.7.t:0 "赫勒斯滂弗里吉亚：战争之时"
 me_thracian_01_hellespont.8.a:0 "每个人都必须尽自己的一份力量。"
 me_thracian_01_hellespont.8.desc:0 "继业者之间的众多战争以及对北方蛮族的战争正在耗尽我们的财力。新的税收从来不受欢迎，但它们是任何紧急情况的快速且方便的解决方案。\n\n虽然我们的代表从沿[GetProvince('(int32)2770').GetArea.GetName]的附属国那里带回了满箱的黄金，但我们意识到我们在激发他们的怨恨，并且过于依赖他们已经动摇的忠诚。然而，剥削是附庸-宗主关系的本质——如果他们不能接受，就得面对后果。我们随时准备镇压任何叛乱，而现在我们的金库更加充盈，比以往更有准备。"
 me_thracian_01_hellespont.8.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_4$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.8.t:0 "资助战争基金：不满"
 me_thracian_01_hellespont.9.a:0 "我们别无选择，但我们不会忘记。"
 me_thracian_01_hellespont.9.desc:0 "我们的宗主[GetCountry('TRE').GetName]总是在许多战争中忙碌，每一步都在浪费金钱。我们尽了自己的一份力量，缴纳税款，派遣人力，甚至自己拿起武器来帮助他们，但似乎永远不够。\n\n现在，他们竟然有胆量来找我们，期望我们缴纳一项特别税来资助他们的战争基金。不幸的是，我们目前缺乏反抗的力量，所以我们只能低下头接受要求。暂时如此。"
 me_thracian_01_hellespont.9.end.tt:0 "任务任务'#Y $thracian_01_hellespont_task_5$#!'现已#G 完成#!!"
 me_thracian_01_hellespont.9.t:0 "战争基金的税收"
 me_tre_task_start_tt_1:0 "[me_thrace_scope.GetRulerTitle|Y][me_thrace_scope.GetRuler.GetPraenomen|Y]将开始"

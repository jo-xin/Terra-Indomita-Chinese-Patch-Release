l_simp_chinese:
 carthaginian_africa_expansion_secured_homeland:0 "安全的祖国"
 carthaginian_africa_expansion_secured_homeland_tt:0 "在#Y 迦太基#!、#Y 图加尼亚#! 和#Y 塔布拉卡尼亚#! 地区的所有拥有的领土都会获得#Y 安全的家园#! 修正，为期20年，产生以下效果。"
 carthaginian_africa_expansion_securing_coastline_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#!或一个附属国拥有整条非洲海岸，从#Y 萨菲姆#!到#Y [SCOPE.GetRootScope.GetCountry.GetName]#!（#Y [SCOPE.ScriptValue('carthaginian_mission_africa_securing_coastline_current_svalue')|0]#!/#Y [SCOPE.ScriptValue('carthaginian_mission_africa_securing_coastline_max_svalue')|0]#!）。"
 carthaginian_africa_invasion_altar_philaeni:0 "菲拉尼的祭坛"
 carthaginian_africa_invasion_altar_philaeni_DESC:0 "为了防止东部希腊人入侵我们的土地，有人建议进行一场竞赛，以解决两个赛尔提斯的划分问题：一对选手将从我们的领土出发，一对选手将从昔兰尼加出发。他们相遇的地方将是我们各自势力范围的分界点。"
 carthaginian_africa_invasion_altar_philaeni_tt_2:0 "#Y 昔兰尼加#!和迦太基都将沿着叙耳提斯的海岸派出一对跑步选手。无论他们在哪里相遇，都将划定我们各自的势力范围。\n\n这将导致我们的城市之间达成#Y 40年的停战协议#!。"
 carthaginian_africa_invasion_charax:0 "大叙耳提斯的走私者"
 carthaginian_africa_invasion_charax_DESC:0 "罗盘草是一种有价值的草药，价值连城。不幸的是，它只生长在昔兰尼加的山区，昔兰尼加人嫉妒地保护着他们对罗盘草的垄断。尽管还不够嫉妒：在大瑟提斯的沙滩上，存在着我们和昔兰尼加商人之间活跃的草药交易。\n\n事实证明，哈拉克斯是罗盘草走私者最喜欢的会面地点。如果我们投资扩大那里的业务，我们也许能够打破昔兰尼加对罗盘草的垄断。"
 carthaginian_africa_invasion_choma:0 "码头"
 carthaginian_africa_invasion_choma_DESC:0 "一条穿过泻湖的小通道将我们的商人与海洋和更广阔的世界联系起来。这条通道狭窄而危险，迫使船只在多个沙洲上航行，大大阻碍了港口的贸易。沿着海滨直接在海上建造一个码头，将大大增加能够在我们港口进行贸易的船只数量。"
 carthaginian_africa_invasion_citadel_of_vaga:0 "瓦加城堡"
 carthaginian_africa_invasion_citadel_of_vaga_DESC:0 "瓦加古城的位置很好，可以控制进入肥沃的巴格拉达斯山谷的行动。增加我们在那里的存在，可以防止努米底亚人袭击我们的土地，同时也为我们进一步向内陆扩展控制提供了一个坚实的基础。"
 carthaginian_africa_invasion_elephant_pens:0 "象栏"
 carthaginian_africa_invasion_elephant_pens_DESC:0 "迦太基的新城墙是巨大的，能够容纳20000名步兵和4000名骑兵。但它们巨大的腰围，底部有10米，也能为大象提供充足的空间，以容纳驯服和训练战争的大象。"
 carthaginian_africa_invasion_megara:0 "麦加拉郊区"
 carthaginian_africa_invasion_megara_DESC:0 "扩建城墙不仅要穿过地峡，还要包围城北半岛上的平原，这将大大扩展城市的规模。如此一来，土地将不必填满狭窄的城市住宅来容纳我们所有的人，而是可以容纳宽敞的别墅和农业用地。\n\n因此，Megara不仅会导致城市人口的增加，而且还会在被围困的情况下保证粮食供应。"
 carthaginian_africa_invasion_megara_tt1:0 "在#Y 迦太基#! 创建了两个单位的#Y 战象#!。"
 carthaginian_africa_invasion_mines_of_sika:0 "穆斯提的矿场"
 carthaginian_africa_invasion_mines_of_sika_tt1:0 "在穆斯提有一条银矿脉。虽然不是最丰富的矿脉，但它可以铸造相当份额的硬币。"
 carthaginian_africa_invasion_mines_of_trisipensis:0 "特里西潘斯的矿区"
 carthaginian_africa_invasion_mines_of_trisipensis_DESC:0 "西西里岛上的战争使我们的白银供应消耗越来越大。幸运的是，在Trisipensis存在一个丰富的银矿脉。虽然它不是新的劳里昂，但它将为我们提供大量的银子来铸造新的硬币和资助我们的努力。"
 carthaginian_africa_invasion_walls_of_carthage:0 "迦太基的城墙"
 carthaginian_africa_invasion_walls_of_carthage_DESC:0 "迦太基通过一个狭窄的地峡与大陆相连，只能从一个方向接近。在地峡上加固和扩建城墙将大大改善城市的防御能力。"
 carthaginian_aftermath_of_the_invasion_mission:0 "入侵的后果"
 carthaginian_aftermath_of_the_invasion_mission_BUTTON_TOOLTIP:0 "阿加索克利斯对非洲的入侵仍然困扰着我们的人民。"
 carthaginian_aftermath_of_the_invasion_mission_CRITERIA_DESCRIPTION:0 "在我们能够考虑再次向海洋扩张之前，我们必须加强对我们家园的把握。否则我们注定要重复我们的错误。\n\n这项任务不能在以后的日子里重新开始。"
 carthaginian_aftermath_of_the_invasion_mission_DESCRIPTION:0 "阿伽托克勒斯被打败了：他的军队在希梅拉河被摧毁，他的城市叙拉古被我们的军队围困，他的盟友抛弃了他。我们是西西里岛的主人。然后他做了一件不可思议的事：他带着他剩下的一切，渡过大海，把我们在非洲的土地夷为平地，同时得到了来自昔兰尼加的希腊人和生活在我们中间的努米底亚人的支持。这场灾难使我们不得不从西西里岛撤退以对付他，并失去了统治西西里岛希腊人的机会。\n"
 carthaginian_aftermath_of_the_invasion_mission_REWARD_DESCRIPTION:0 "我们已经准备好了。"
 carthaginian_aftermath_of_the_invasion_mission_abort_tt:0 "这是一个一次性的任务：现在放弃将导致以后无法重新启动。"
 carthaginian_mission_bomilcars_revolution_DESCRIPTION:0 "博米尔卡背信弃义，试图在战斗中把圣军献给阿加索克勒斯，希望能消灭他在哈迪里姆的对手，为自己赢得暴政权力。虽然他的邪恶计划可能失败了，但许多人被他的想法和计划引入了歧途。\n\n许多博米尔卡的弟子被赦免，但在我们国家各地仍有冲突和分歧萦绕。"
 cr_carthage_mission_the_matter_of_aelymas_BUTTON_TOOLTIP:0 "我们需要在进一步扩大我们的城市之前，维护我们对各部落的统治地位。"
 cr_carthage_mission_the_matter_of_aelymas_abort_tt:0 "这是一个一次性的任务：现在中止将使我们无法说服哈迪里姆人在未来再次追求Aelymas。"

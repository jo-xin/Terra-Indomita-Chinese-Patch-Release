l_simp_chinese:
 te_plagues.1.a:0 "召来医师和祭司！这种疾病的毒性是我们前所未见的。"
 te_plagues.1.desc:0 "公元165年至180年的安东瘟疫，以一位罗马皇帝的名字命名，也被称为盖伦瘟疫（以描述该瘟疫的医生盖伦的名字命名），是影响罗马帝国的第一个已知的大流行病，可能是由在近东作战归来的士兵感染和传播的。学者们普遍认为这场瘟疫是天花，尽管也有人认为是麻疹。总死亡人数估计为500-1000万，大约占帝国人口的10%。这种疾病在城市和罗马军队中尤其致命。安东瘟疫发生在所谓的“罗马和平”的最后几年，这是罗马帝国在影响力、领土控制和人口方面的高潮。历史学家们对瘟疫出现后，在日益动荡的年代里对帝国的影响有不同看法。"
 te_plagues.1.t:0 "安东尼瘟疫"
 te_plagues.11.a:0 "我们没有治愈这种致命疾病的方法。我们的牺牲无济于事，只能无助地看着它肆虐我们的城市。"
 te_plagues.11.desc:0 "盖伦在论文 Methodus Medendi（“治疗方法”）中简要地记录了对这一流行病的观察和描述，他还在其大量的著作中分散地提到了这一问题。他将这场瘟疫描述为 “great”，持续时间很长，并提到了发烧、腹泻和咽喉炎，以及在患病第九天出现的皮肤糜烂，有时是干性的，有时是脓性的。盖伦提供的信息并没有明确指出这种疾病的性质，但学者们普遍倾向于将其诊断为天花。瘟疫对罗马在印度洋的海上贸易造成了“无法弥补的”损害，这一点已被从埃及到印度的考古记录所证明，同时也大大减少了罗马在东南亚的商业活动。"
 te_plagues.11.t:0 "罗马瘟疫的蔓延"
 te_plagues.2.a:0 "瘟疫是冥界黑暗诸神因我们的过犯而降下的惩罚。"
 te_plagues.2.desc:0 "塞浦路斯瘟疫是大约从公元249年到262年困扰罗马帝国的一场大流行病。瘟疫被认为造成了粮食生产和罗马军队的广泛人力短缺，在三世纪的危机中严重削弱了帝国的力量。它的现代名称是为了纪念迦太基的主教圣西普里安，他是一位早期的基督教作家，见证并描述了这场瘟疫。由于来源稀少，鼠疫的病原体是高度推测的，但嫌疑人包括天花、大流行性流感和类似埃博拉病毒的病毒性出血热（filoviruses）。瘟疫至少在到达罗马之前一年到达亚历山大城，这表明它起源于东非。瘟疫带来的迫在眉睫的死亡威胁和许多基督教神职人员面对瘟疫时坚定不移的信念都为该宗教赢得了许多皈依者。"
 te_plagues.2.t:0 "塞浦路斯"
 te_plagues.21.a:0 "古老神殿也无法庇护我们免受这股无情死亡的污浊气息侵袭。"
 te_plagues.21.desc:0 "“之后爆发了一场可怕的瘟疫，可恨的疾病的过度破坏相继侵入了颤抖的民众的每一户人家，日复一日地突然袭击，带走了无数的人，每个人都在自己的家里。所有的人都在颤抖，逃亡，躲避传染病，不敬地暴露他们自己的朋友，仿佛排除了肯定会死于瘟疫的人，也就排除了死亡本身。同时，在整个城市里，躺着的不再是尸体，而是许多人的尸体，通过对轮到自己的命运的思考，要求路人对自己的怜悯。除了他残酷的收益，没有人看重任何东西。没有人因为回忆起类似的事件而颤抖。没有人对别人做他自己希望经历的事情”。"
 te_plagues.21.t:0 "东部瘟疫的蔓延"

l_simp_chinese:
 treasure_it_aesthetic_canon_of_polykleitos:0 "波利克莱托斯的美学典籍"
 treasure_it_aesthetic_canon_of_polykleitos_desc:0 "波利克莱托斯以其艺术完美的数学基础的美学理论，创造了一种新的雕塑方法。"
 treasure_it_arabian_snake_cult_shrine:0 "阿拉伯蛇崇拜神殿"
 treasure_it_arabian_snake_cult_shrine_desc:0 "蛇神庙来自卡拉斯附近的蛇崇拜中心，是整个地区人口的朝圣地。"
 treasure_it_baetyl_goddess_aluzza:0 "阿尔-乌扎女神的宝座"
 treasure_it_baetyl_goddess_aluzza_desc:0 "献给阿尔-乌扎的神圣的巴列塔，她是强大、保护和爱的女神。阿拉伯宗教中的三位主要女神之一。"
 treasure_it_baetyl_of_ma:0 "马的巴勒特"
 treasure_it_baetyl_of_ma_desc:0 "献给安纳托利亚战神马的圣石，希腊人称其为埃尼奥。上面矗立着胜利女神耐克的形象。"
 treasure_it_basamum_ibex_statue:0 "巴萨姆山羊雕像"
 treasure_it_basamum_ibex_statue_desc:0 "巴萨姆是阿拉伯南部的一个神，与治疗和健康有关，以治疗生病的山羊和山羊而闻名。"
 treasure_it_beast_of_achelous:0 "阿切卢斯的野兽"
 treasure_it_beast_of_achelous_desc:0 "神圣的雕塑，有三个可怕的形状，即公牛、蛇和人头。被当作淡水之神来崇拜。"
 treasure_it_boii_chieftains_torc:0 "波西首领的托架"
 treasure_it_boii_chieftains_torc_desc:0 "托克代表着权力和财富的来源，是权威和高社会地位的标志。"
 treasure_it_bust_of_demeter:0 "德墨忒尔的半身像"
 treasure_it_bust_of_demeter_desc:0 "收获和农业女神德墨忒尔的圣殿占据了博斯普鲁斯城市Nymphaion的一座小山。"
 treasure_it_cantiaci_ornate_shield:0 "坎蒂亚奇装饰性盾牌"
 treasure_it_cantiaci_ornate_shield_desc:0 "部落首领们手持华丽的青铜盾牌，用于展示财富和权力，或在仪式上摆出姿态。"
 treasure_it_colossal_hera_of_argos:0 "阿尔戈斯的赫拉巨像"
 treasure_it_colossal_hera_of_argos_desc:0 "希腊雕塑家波利克莱托斯为赫拉的神庙--阿耳戈斯的赫拉翁创作的黄金和象牙雕像。"
 treasure_it_corieltauvi_shield:0 "科里尔塔维盾牌"
 treasure_it_corieltauvi_shield_desc:0 "科里尔塔维酋长的青铜礼仪盾牌，是威望和财富的象征，上面镶嵌着珊瑚、漩涡图案和动物头像。"
 treasure_it_cult_bear_sculpture:0 "崇拜熊雕塑"
 treasure_it_cult_bear_sculpture_desc:0 "熊的花岗岩雕塑，是力量和智慧的象征，在斯莱扎山的神圣石圈中被崇拜了几个世纪。"
 treasure_it_diane_the_huntress_statue:0 "女猎手黛安的雕像"
 treasure_it_diane_the_huntress_statue_desc:0 "荒野和狩猎女神戴安娜神庙，俯瞰着沿海城市海默罗斯科佩恩。"
 treasure_it_divine_spoons_of_durotriges:0 "杜罗特里格斯的神匙"
 treasure_it_divine_spoons_of_durotriges_desc:0 "德鲁伊人在宗教仪式上使用的华丽的铜勺子。他们会在勺子的表面解释液体占卜的形状。"
 treasure_it_divine_vessel_of_isis:0 "伊希斯的神器"
 treasure_it_divine_vessel_of_isis_desc:0 "献给伊希斯的豪华仪式船，用贵金属和宝石装饰。伊希斯女神被崇拜为库施国王的王母。"
 treasure_it_euryleonis_bronze_statue:0 "欧鲁利奥尼斯青铜雕像"
 treasure_it_euryleonis_bronze_statue_desc:0 "献给斯巴达运动员Euryleonis的青铜雕像，她是奥林匹克历史上第二个女冠冕者。"
 treasure_it_gallic_bronze_carnyx:0 "高卢的青铜卡尼克斯"
 treasure_it_gallic_bronze_carnyx_desc:0 "用作心理战武器的乐器，装饰成野猪头的模样。"
 treasure_it_goddess_artemis_stone:0 "阿耳忒弥斯女神石"
 treasure_it_goddess_artemis_stone_desc:0 "阿耳忒弥斯女神形状的神圣铁陨石，据说曾经从天上掉下来，在以弗所的阿耳忒弥斯神庙中被供奉。"
 treasure_it_goddess_reitia_shrine:0 "雷蒂亚女神神殿"
 treasure_it_goddess_reitia_shrine_desc:0 "Reitia是维涅托神殿的一位女神。她是写作、仁慈和女性的神灵。"
 treasure_it_golden_cape_of_deceangli:0 "德桑里的金角"
 treasure_it_golden_cape_of_deceangli_desc:0 "斗篷用于仪式，将佩戴者提升为具有精神或世俗力量的人。"
 treasure_it_golden_chethiya_of_saman:0 "萨曼的金色切蒂亚"
 treasure_it_golden_chethiya_of_saman_desc:0 "主佛给了斯里兰卡人民一绺他的头发。萨曼国王建造了金色的舍利塔来存放这块圣物。"
 treasure_it_gudimallam_lingam_of_shiva:0 "瞿提末岚的湿婆林伽"
 treasure_it_gudimallam_lingam_of_shiva_desc:0 "湿婆神，一切邪恶的毁灭者，被雕刻成手握利斧，站在矮小恶魔身上的形象。"
 treasure_it_gurzil_magical_bull:0 "古尔兹魔牛"
 treasure_it_gurzil_magical_bull_desc:0 "古尔兹，柏柏尔人的战神，是阿蒙神和一头牛的儿子。他以一头神奇的公牛的形式被带入战场。"
 treasure_it_helmet_of_zalmoxis:0 "扎尔莫克西斯的头盔"
 treasure_it_helmet_of_zalmoxis_desc:0 "扎尔莫克西斯是达契亚人的活神仙预言家。头盔上装饰着两只大眼睛，意在抵御邪恶和魔咒。"
 treasure_it_herma_statue_of_siphnos:0 "西普诺斯的赫玛雕像"
 treasure_it_herma_statue_of_siphnos_desc:0 "这座雕像保护居民免受邪恶之害，顶部有赫尔墨斯的头像，男性生殖器装饰在底座上。"
 treasure_it_herodorus_olympic_wreath:0 "希罗德斯的奥林匹克花环"
 treasure_it_herodorus_olympic_wreath_desc:0 "Megara的Herodorus是著名的奥运会小号比赛的胜利者，因其身材高大、性格暴躁、小号响亮而闻名。"
 treasure_it_holy_cart_of_nerthus:0 "Nerthuz的圣车"
 treasure_it_holy_cart_of_nerthus_desc:0 "献给生育女神Nerthuz的圣车由神圣的公牛拉着，受到日耳曼部落的赞颂。"
 treasure_it_iguvine_tablets:0 "伊瓜因片"
 treasure_it_iguvine_tablets_desc:0 "来自翁布里亚城市伊古维恩的一系列青铜板，上面写着朱庇特祭司的宗教行为和仪式。"
 treasure_it_king_cotys_silver:0 "科提斯国王的银器"
 treasure_it_king_cotys_silver_desc:0 "俄德律西亚国王科提斯一世委托制作的装饰丰富的银器，装饰有动物头像和神话场景。"
 treasure_it_lady_of_the_nets:0 "渔网女士"
 treasure_it_lady_of_the_nets_desc:0 "克里特岛的山岳和狩猎女神布里托马蒂斯的一个异能者。她在被米诺斯追捕时，逃进了渔夫的网中，逃到了安全地带。"
 treasure_it_lusitanian_silver_breastplate:0 "卢斯坦银质胸甲"
 treasure_it_lusitanian_silver_breastplate_desc:0 "这块银质胸牌由部落首领佩戴，上面装饰着丰富的祭品场景，包括鸟类、野猪和被砍下的头颅。这是一种威望和财富的声明。"
 treasure_it_lycian_marble_sarcophagus:0 "利西亚大理石石棺"
 treasure_it_lycian_marble_sarcophagus_desc:0 "由帕里安大理石制成，类似于利西亚古墓的形状。饰以浮雕，显示狮子狩猎、战斗的半人马和狮身人面像。"
 treasure_it_marble_statue_of_asclepius:0 "大理石的阿斯克勒庇俄斯雕像"
 treasure_it_marble_statue_of_asclepius_desc:0 "阿斯克勒庇俄斯是一位英雄和药神。疗养庙内有一座阿斯克勒庇俄斯的大型雕像，手持蛇形缠绕的法杖。"
 treasure_it_mask_of_agamemnon:0 "阿加门农的面具"
 treasure_it_mask_of_agamemnon_desc:0 "迈锡尼国王阿伽门农是荷马史诗《特洛伊战争》中亚该亚人的领袖。"
 treasure_it_medeina_forest_mother:0 "梅德纳森林之母"
 treasure_it_medeina_forest_mother_desc:0 "崇拜艾斯提安森林之母梅德纳的人的神圣雕像，她是森林、树木和动物的统治者。她的圣物是一只野兔。"
 treasure_it_moccos_boar_god_statue:0 "莫科斯野猪神雕像"
 treasure_it_moccos_boar_god_statue_desc:0 "石灰岩雕刻的野猪神，是猎人和战士的保护者。野猪代表肥沃、无畏、勇气和战士的力量。"
 treasure_it_olympic_wreath_of_dioxippus:0 "迪奥西普斯的奥运花环"
 treasure_it_olympic_wreath_of_dioxippus_desc:0 "迪奥西普斯因其奥运摔跤比赛的胜利而闻名。他在战胜了亚历山大大帝的一名士兵后自杀。"
 treasure_it_omphalos_of_delphi:0 "德尔斐的巴勒图斯"
 treasure_it_omphalos_of_delphi_desc:0 "天神宙斯从天上扔下翁法洛斯石，它落在德尔斐，使其成为世界的中心。"
 treasure_it_otherworld_portal:0 "异世界门户"
 treasure_it_otherworld_portal_desc:0 "来自罗克佩尔图斯圣地的凯尔特人异世界门户。部落祖先的头骨被放置在刻在门户柱子上的洞里。"
 treasure_it_perun_thunder_god_idol:0 "佩伦雷神神像"
 treasure_it_perun_thunder_god_idol_desc:0 "异教雷神佩伦的大型拟人化木质神像。他是闪电、风暴、雨水、橡树和秩序的监督者。"
 treasure_it_phoenician_votive_statuettes:0 "腓尼基人的火神像"
 treasure_it_phoenician_votive_statuettes_desc:0 "在比布鲁斯的方尖碑神庙，成千上万的铜、银或铜合金制成的小雕像被献给腓尼基的神灵。"
 treasure_it_rishabhanatha_statue:0 "里沙巴纳塔雕像"
 treasure_it_rishabhanatha_statue_desc:0 "里沙瓦那塔是耆那教的第一位精神导师，被认为是制定和组织人类和谐地生活在一个社会中。"
 treasure_it_sacred_stone_of_aphrodite:0 "阿佛洛狄忒的圣石"
 treasure_it_sacred_stone_of_aphrodite_desc:0 "女神的圣石，在阿佛洛狄忒神话中的出生地帕福斯的阿佛洛狄忒神庙中被崇拜。"
 treasure_it_sacred_stone_of_emesa:0 "埃梅萨的圣石"
 treasure_it_sacred_stone_of_emesa_desc:0 "埃梅萨的圣石是太阳神埃拉加巴鲁斯的石头，人们对它的崇拜就像从天堂派来的一样。"
 treasure_it_santones_ceremonial_helmet:0 "桑托内斯仪式头盔"
 treasure_it_santones_ceremonial_helmet_desc:0 "这是凯尔特人的艺术杰作，青铜头盔上覆盖着纯金叶和嵌入的珊瑚装饰。"
 treasure_it_scordisci_silver_cauldron:0 "斯科耳迪斯基银壶"
 treasure_it_scordisci_silver_cauldron_desc:0 "用来煮肉或为强大的盛宴酿造饮料，酋长重新分配食物和饮料的能力被视为权力的象征。"
 treasure_it_scythian_princes_plunder:0 "斯基泰王子的掠夺物"
 treasure_it_scythian_princes_plunder_desc:0 "以动物为主题的宝物，是在一次远征凯尔特人土地时从一位斯基泰王子手中夺取的。"
 treasure_it_scythian_ritualistic_treasure:0 "斯基泰人祭祀用的宝物"
 treasure_it_scythian_ritualistic_treasure_desc:0 "精心制作的黄金宝物，由斯基泰王室用于以毒品为燃料的仪式。它们被装饰成高度精细和戏剧化的场景。"
 treasure_it_second_temple_menorah:0 "第二圣殿的灯塔"
 treasure_it_second_temple_menorah_desc:0 "烛台是用纯金制成的七灯希伯来语灯台，在耶路撒冷的第二圣殿使用。"
 treasure_it_shrine_of_anahita:0 "阿娜希塔的神殿"
 treasure_it_shrine_of_anahita_desc:0 "琐罗亚斯德教的神圣神殿，供奉着阿娜希塔女神，与生育、治疗和智慧有关。"
 treasure_it_skinfaxi_ritual_sun_chariot:0 "斯金法西祭祀太阳战车"
 treasure_it_skinfaxi_ritual_sun_chariot_desc:0 "仪式游行中使用的青铜和黄金工艺品，庆祝北欧人相信有一匹神马拉着太阳穿过天空。"
 treasure_it_sphinx_of_taharqo:0 "塔哈尔库的狮身人面像"
 treasure_it_sphinx_of_taharqo_desc:0 "塔哈尔科国王同时统治着埃及和努比亚的土地。帝国在他的统治下蓬勃发展，宗教、艺术和建筑都得到了恢复。"
 treasure_it_statue_of_protis:0 "普罗提斯的雕像"
 treasure_it_statue_of_protis_desc:0 "根据当地的传说，法卡的普罗提斯在寻求建立一个新的贸易前哨以积累财富后，最终建立了马赛利亚定居点。"
 treasure_it_statue_of_sardus_pater:0 "萨杜斯-佩特的雕像"
 treasure_it_statue_of_sardus_pater_desc:0 "撒丁岛从伊赫努萨改名为撒丁岛，以纪念神话中的英雄萨德斯-佩特或 撒丁岛的父亲。"
 treasure_it_statue_of_siren_parthenope:0 "海妖帕蒂诺普的雕像"
 treasure_it_statue_of_siren_parthenope_desc:0 "Parthenope是希腊神话中的女妖，她跳入海中淹死了。她的尸体被冲到了尼阿波利斯附近，据说希腊水手在那里埋葬了她，并以她的名字命名他们的城市为帕蒂诺普。"
 treasure_it_statue_of_thales:0 "泰勒斯雕像"
 treasure_it_statue_of_thales_desc:0 "希腊数学家、天文学家和哲学家米利都的泰勒斯雕像。"
 treasure_it_stele_of_agritore:0 "阿格里托雷石碑"
 treasure_it_stele_of_agritore_desc:0 "高大的站立石碑，被用作宗教圣地和祭祀场所。"
 treasure_it_talab_shrine_oracle:0 "塔拉布神殿的神谕"
 treasure_it_talab_shrine_oracle_desc:0 "塔拉布是阿拉伯南部的月神，也是牧场的保护者。人们向他的神谕寻求建议。"
 treasure_it_tamil_mother_goddess_statue:0 "泰米尔母神雕像"
 treasure_it_tamil_mother_goddess_statue_desc:0 "玛丽安曼是南印度的母神，被泰米尔人崇拜为带来雨水和繁荣的使者。"
 treasure_it_thagimasidas_monument:0 "塔吉马西达斯纪念碑"
 treasure_it_thagimasidas_monument_desc:0 "塔吉马西达斯是七神之一，是海神，也是斯基泰王室王朝的祖先。"
 treasure_it_throne_of_astarte:0 "阿施塔特的宝座"
 treasure_it_throne_of_astarte_desc:0 "阿施塔特是腓尼基人的天后，她的造型是一个由带翅膀的狮子支撑的宝座。被当作生育女神来崇拜。"
 treasure_it_tomb_of_job:0 "约伯之墓"
 treasure_it_tomb_of_job_desc:0 "先知约伯是一位善良而富裕的家主，但他被可怕的灾难所困扰，那灾难夺走了他所珍视的一切。"
 treasure_it_turduli_warrior_stela:0 "图尔杜利战士石碑"
 treasure_it_turduli_warrior_stela_desc:0 "纪念碑上刻有一个战士的形象，周围有塔特西亚的文字。"
 treasure_it_veliocassian_tribal_helmet:0 "维利奥卡西亚部落的头盔"
 treasure_it_veliocassian_tribal_helmet_desc:0 "部落首领为显示其高级地位而戴的礼仪性头盔。铁帽上覆盖着纯金的带子，上面装饰着鲜艳的红珊瑚饰物。"
 treasure_it_veneti_horse:0 "威尼提马"
 treasure_it_veneti_horse_desc:0 "威尼托人以优秀的养马人而闻名，他们生产的马是希腊世界中最强壮、最快的马。"
 treasure_it_vishapaqar_fish_stone:0 "维萨帕卡鱼石"
 treasure_it_vishapaqar_fish_stone_desc:0 "雕刻成鱼形的大型椭圆形石碑，用于祭祀亚美尼亚塞万湖的水和水生动物。"
 treasure_it_votive_stone_of_hludana:0 "赫鲁达娜的献祭石"
 treasure_it_votive_stone_of_hludana_desc:0 "献给商业、水和捕鱼女神赫鲁达娜（Hludana）的火炬石，受到日耳曼部落的崇拜。"
 treasure_it_war_goddess_ifri_statue:0 "战争女神伊夫里雕像"
 treasure_it_war_goddess_ifri_statue_desc:0 "柏柏尔战争女神伊夫里是她崇拜者的保护者。她倾听她的人民的心声，并在他们需要的时候帮助他们。"

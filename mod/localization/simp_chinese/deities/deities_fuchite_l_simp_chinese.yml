 omen_cikap:0 "志卡普·卡穆伊"
 omen_cikap_desc:0 "志卡普·卡穆伊是猫头鹰、土地和人类行为之神威。他被视为财富之神威据说眼中可流出金银之泪。"
 omen_cironnuo:0 "奇龙努普·卡穆伊"
 omen_cironnuo_desc:0 "狐之神威奇龙努普·卡穆伊是一个淘气的神威会带来不便。最声名狼藉的是他喜欢在海中掀翻船只。"
 omen_fuchi:0 "火神威"
 omen_fuchi_desc:0 "绳文人最重要的神祇，她是灶之神威。她对绳文人至关重要，因为他们的生活高度仪式化，火是他们家中的中心，而火神威从不离开灶台，因此她始终与人们同在。火神威据说是与她的姐妹、风暴之神威神奈神威一同降临人间，她是第一位神威神田心神威的女儿。"
 omen_inari_kamuy:0 "奇龙努普·稻荷·卡穆伊"
 omen_inari_kamuy_desc:0 "狐之神威奇龙努普·卡穆伊与狐之神稻荷大神的合体神。这种混合强调了对狐狸的崇拜狐狸既是恶作剧的象征也代表聪明、生育和神谕。"
 omen_kamuy_mintara:0 "神威·明塔拉"
 omen_kamuy_mintara_desc:0 "北海道同名大山的神威。神威·明塔拉这座山的名字意为\"众神的游乐场\"，这一特性通过此神祇的嬉戏天性得以表达。尽管天性活泼，她却是对所有想伤害北海道的人的严酷提醒——群山自会击退他们。"
 omen_kandakoro:0 "神田心神威"
 omen_kandakoro_desc:0 "万物的原始创始者神田心神威是第一位神威其后是他的女儿火神威。他是天空之神威是其监督者。"
 omen_kanna:0 "神奈神威"
 omen_kanna_desc:0 "神奈神威是强大的火神威的姐妹据说与她一同从天而降。神奈神威是雷、电和风暴之神威。"
 omen_kimun:0 "奇蒙·卡穆伊"
 omen_kimun_desc:0 "绳文人与熊的关系非常亲密，奇蒙·卡穆伊是熊之神威。除熊外，奇蒙·卡穆伊也是山之神威。"
 omen_kina_sut:0 "奇纳·苏特·卡穆伊"
 omen_kina_sut_desc:0 "蛇之神威奇纳·苏特·卡穆伊通常被视为一位乐于助人和仁慈的神威。他通过阻止蛇咬崇敬他的人来保护他们。"
 omen_kunnecup:0 "昆内库普·卡穆伊"
 omen_kunnecup_desc:0 "昆内库普·卡穆伊是月亮之神威也是太阳之神威托卡库普的丈夫。他们被科坦卡尔神威赋予照亮世界的使命。"
 omen_mosir_kara:0 "莫西尔·卡拉·卡穆伊"
 omen_mosir_kara_desc:0 "莫西尔·卡拉·卡穆伊是奉神田心神威之命创造大地的神。神田心神威命令莫西尔神威为人类准备大地。"
 omen_tokapcup:0 "托卡普丘普·卡穆伊"
 omen_tokapcup_desc:0 "托卡普丘普·卡穆伊是太阳之卡穆伊，也是月之卡穆伊昆内丘普（Kunnecup）的妻子。他们受科坦卡尔卡穆伊（Kotan-kar-Kumay）之命照亮世界。"
 omen_waka:0 "瓦卡乌什·卡穆伊"
 omen_waka_desc:0 "瓦卡乌什·卡穆伊是淡水之卡穆伊。她与卡穆伊·富奇（Kamuy-Fuchi）之间关系复杂，据说她曾引诱卡穆伊·富奇的丈夫，之后被卡穆伊·富奇击败并被迫归还其夫。"
 omen_yushkep:0 "尤什凯普·卡穆伊"
 omen_yushkep_desc:0 "尤什凯普·卡穆伊是蜘蛛之卡穆伊。她被称为长指女，并因其帮助妇女分娩而受到特别尊崇。"

 omen_iprer:0 "伊普雷"
 omen_iprer_desc:0 "伊普雷在吐火罗语中意为“天空”。他代表许多印欧信仰中常见的天空父神。吐火罗万神殿笼罩在神秘与缺乏记载之中；不过，由于吐火罗人的印欧属性及其印欧-赫梯语背景，仍可推测他们曾信奉某些神祇。"
 omen_kaum:0 "卡姆"
 omen_kaum_desc:0 "卡姆是吐火罗人中记载较为可靠的女神之一。她的起源并不清楚，或许是一位非印欧来源的女神。无论如何，卡姆之名与吐火罗语借词“Kom”，即太阳，同名。她与更本土的太阳女神斯万乔并存。"
 omen_kem:0 "凯姆"
 omen_kem_desc:0 "凯姆是少数记载较为可靠的吐火罗女神之一。她是吐火罗人的印欧母神，其名来自吐火罗语中表示“大地”的词。"
 omen_menya:0 "门雅"
 omen_menya_desc:0 "门雅是吐火罗人的月亮女神。作为少数有较明确记载的神祇之一，门雅之名来自吐火罗语“Men”，意为月亮或与月亮相关。她的重要性或许不亚于斯万乔。"
 omen_swanco:0 "斯万乔"
 omen_swanco_desc:0 "斯万乔是记载最为可靠的吐火罗女神，因此可能是其至高女神。她是一位太阳女神，名字来自吐火罗语中表示“太阳”的词“swanco”。"
 omen_swese:0 "斯韦塞"
 omen_swese_desc:0 "斯韦塞是一位天气女神，其形象可能源自赫梯女神；她的名字来自吐火罗语中表示“雨”的词“swese”。吐火罗万神殿笼罩在神秘与缺乏记载之中；不过，由于吐火罗人的印欧属性及其印欧-赫梯语背景，仍可推测他们曾信奉某些神祇。"
 omen_terhu:0 "维特尔胡"
 omen_terhu_desc:0 "维特尔胡是一个重构神名，来自吐火罗语中意为“战斗”的“witare”，并结合印欧-赫梯神名“Terhu”。吐火罗万神殿笼罩在神秘与缺乏记载之中；不过，由于吐火罗人的印欧属性及其印欧-赫梯语背景，仍可推测他们曾信奉某些神祇，维特尔胡便可能是其中之一。"
 omen_yakwe:0 "亚克维"
 omen_yakwe_desc:0 "亚克韦在吐火罗语中意为“马”，而维意为“二”。这是对印欧信仰中常见双马神的重构。吐火罗万神殿笼罩在神秘与缺乏记载之中；不过，由于吐火罗人的印欧属性及其印欧-赫梯语背景，仍可推测他们曾信奉某些神祇。"

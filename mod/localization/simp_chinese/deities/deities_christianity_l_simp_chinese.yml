 omen_archangel_gabriel:0 "大天使加百列"
 omen_archangel_gabriel_desc:0 "加百列（希伯来语 גַּבְרִיאֵל “我的力量是上帝”）是大天使之一，被认为是异象的解释者和上帝的使者。然而到了第六个月，天使加百列被上帝派到加利利的一个城市名叫拿撒勒，到一个处女那里，她与大卫家一个名叫若瑟的人订婚，这个处女的名字叫玛利亚。他进来对她说，你这蒙恩的人，你好。主与你同在。但她听了这话，吃了一惊，不知这是什么问候。天使对她说，“玛利亚，不要怕！因为你已经得了神的喜悦。看哪，你要怀孕生子，你要给他起名叫耶稣。他要作大，称为至高者的儿子，主神要把他父亲大卫的位子赐给他。他要治理雅各家，直到永远，他的国度永不止息”。"
 omen_archangel_michael:0 "大天使米迦勒"
 omen_archangel_michael_desc:0 "米迦勒（希伯来语 מיכאל “谁像上帝？”）是一位天使长，作为撒旦的征服者出现，他将撒旦扔到地上。“天上发生了一场战斗；米迦勒和他的天使起来与龙作战。龙和它的天使战斗，但他们没有站起来，他们失去了在天上的地位。他被推翻了，那条大龙，即被称为魔鬼或撒旦的老蛇，他欺骗了整个世界；龙被扔到了地上，他的天使也被扔了下来”。"
 omen_archangel_raphael:0 "大天使拉斐尔"
 omen_archangel_raphael_desc:0 "拉斐尔（希伯来语 רפאל “上帝治愈”）是犹太教和基督教经文中的大天使之一。拉斐尔是聆听托比亚斯（托比特之子）祈祷的天使，在他从尼尼微到拉格的旅途中陪伴着他，将埃克巴塔纳的萨拉送给他作为妻子，并治愈了托比亚斯的父亲托比特。拉斐尔被认为是病人和药剂师的守护神，也是海员和移民以及朝圣者的守护神。他在传统上被认为是屋顶工人和矿工的守护神。\n拉斐尔不仅是治疗伤口的天使（萨拉的痴迷，托比特的失明），而且还能使 “治愈关系”。"
 omen_archangel_uriel:0 "大天使乌里尔"
 omen_archangel_uriel_desc:0 "乌里尔（希伯来语 אוּרִיאֵל “上帝之光”或“我的光是上帝”）是希伯来传统中一个天使的名字。在罗马天主教会中，乌里尔作为大天使的崇敬在对天使崇拜和邪教的禁止中被掩盖了，从教会的角度看，这是有问题的。因此，在343-380年的老底嘉会议上，对天使的虚假崇拜和天使崇拜的产生被禁止了，这种崇拜在使徒时代就已经开始广泛流行了。古代犹太经文第四章《以斯拉》中提到了乌里尔，“那奉派来的天使回答我说，他叫乌里尔。”科普特教会的悼词中包含的声明'我们崇敬乌里尔，作为天使中的第四位'确保了他的传统地位。"
 omen_st_andrew:0 "圣安德鲁"
 omen_st_andrew_desc:0 "圣安德鲁是拿撒勒人耶稣的门徒西门彼得的哥哥。安得烈起初是施洗者圣约翰的门徒，后来施洗者派他去跟随耶稣。安德鲁鼓励他的兄弟西门加入他们，告诉他他们已经找到了弥赛亚。这就是安得烈被誉为第一个被召者的原因；（Πρωτόκλητος）。安得烈在伊庇鲁斯、卡帕多西亚、斯基泰、色雷斯、马其顿和亚凯亚传教。他从安纳托利亚东部到格鲁吉亚西部传教。在一次对基督徒的迫害中，安德鲁成为殉道者，被钉在一个X形的十字架上，这就是著名的圣安德鲁十字架。"
 omen_st_cornelius_centurion:0 "圣科尔乃略"
 omen_st_cornelius_centurion_desc:0 "百夫长科尔乃略是凯撒利亚马里提马的一位罗马百夫长。他被认为是最早接受基督教洗礼的非犹太人之一。根据圣经故事，他遇到了一位天使，天使让他把使徒西门彼得带过来，听他传话。使徒西门彼得也在异象中确信，救赎的信息也适用于外邦人。在此之前，他一直认为它只适用于犹太人。于是，彼得允许自己被仆人领进科尔乃略的家。科尔乃略在彼得面前跪下，但后者不允许他敬拜他。在彼得讲道的时候，圣灵落在了每一个听众身上。这种情况也发生在非犹太人身上，这对彼得和他的犹太同伴们来说是一个巨大的惊喜。然后，彼得命令科尔乃略和他的朋友及亲属接受洗礼。根据圣经的记录，科尔乃略是第一个罗马的外邦人基督徒。"
 omen_st_james_zebedee:0 "圣雅各，伟大者"
 omen_st_james_zebedee_desc:0 "伟大者雅各（意为“长老”）是耶稣基督的十二个使徒之一，是世界上最著名的基督教圣徒之一。雅各与他的兄弟约翰一起，与安得烈和西门彼得一起，是第一批被称为门徒的人之一。当耶稣对以利亚和摩西说话时，雅各与彼得和约翰一起在变容山，在客西马尼园，他目睹了耶稣在受难前的痛苦。雅各和约翰从耶稣那里得到了“Boanerges”的亚拉姆语绰号，意思是雷霆之子，因为他们性情急躁。复活后，雅各与其他使徒一起在耶路撒冷。在希律阿格里帕一世统治整个犹太地区期间（公元41—44年），他被用剑处决。"
 omen_st_john:0 "神学家的圣约翰"
 omen_st_john_desc:0 "约翰，西庇太的儿子是耶稣基督的门徒，在基督教传统中被认为是《约翰福音》中耶稣的“最喜爱的门徒”。传统上认为他是第四本福音书的作者。由于他的福音书有崇高的神学思想，他在传统上被称为神学家约翰。约翰被流放到拔摩岛，在那里他得到了关于教会命运的神秘幻象，他把它写成了《启示录》或《启示录》。"
 omen_st_joseph:0 "圣若瑟"
 omen_st_joseph_desc:0 "若瑟是新郎，后来是耶稣的母亲马利亚的丈夫。他被称为耶稣的“养父”。由于人口普查，若瑟和他的妻子不得不去他出生的城市伯利恒。耶稣出生后，他们回到了耶路撒冷，在那里的圣殿里正在举行对主的介绍。在耶稣出生后的一个不确定的时间点上，他们一家人不得不按照若瑟在梦中得到的天使的命令从伯利恒逃到埃及，因为希律王因为害怕这个预言中的新生的犹太人国王会取代他，而杀死了伯利恒的所有婴儿。后来，根据若瑟在梦中得到的神的指示，一家人搬回了巴勒斯坦，根据若瑟的决定，他们没有在伯利恒所在的犹太地区定居，而是在加利利的拿撒勒村定居，耶稣在那里长大。在耶稣出现在公众面前的几年前，若瑟在和平中死去。"
 omen_st_luke_evangelist:0 "圣路加"
 omen_st_luke_evangelist_desc:0 "传道人路加是《新约》中《路加福音》和《使徒行传》的作者。路加偶尔被视为耶稣基督派来的七十名门徒之一。他是圣保罗的合作者，并被称为与使徒保罗的一些旅程在一起的医生。路加大约在公元63年以84岁的年龄作为底比斯的主教去世，但他是否也遭受了殉道的痛苦还不确定。"
 omen_st_mark:0 "圣玛尔克"
 omen_st_mark_desc:0 "约翰·玛尔克（拉丁文，Marcus；希腊文，Μᾶρκος，阿拉姆语，ܡܪܩܘܣMarqōs）是耶稣基督派来的70名门徒之一。他是《马可福音》的作者，他的标志是有翅膀的狮子。使徒彼得遇到了玛尔克，并把他作为旅行伙伴和翻译。传道人马可写下了彼得的布道，从而构成了这本福音书。玛尔克出生在古利奈，一座位于北非潘塔波利斯（现在的利比亚）的城市，可能是巴拿巴的表弟。他在亚历山大城传扬福音，在那里建立了教会，并成为其第一任主教。他于公元68年被该城的异教徒所杀。"
 omen_st_mary:0 "圣童贞玛利亚，万福母亲"
 omen_st_mary_desc:0 "拿撒勒的玛利亚是耶稣的母亲。玛利亚被誉为受祝福的圣女和上帝之母，她与丈夫约瑟夫和其他亲戚住在加利利的拿撒勒村。派遣给她的天使加百列向她许诺将生下一个儿子，即以色列人所期待的弥赛亚和上帝之子。天使的讲话（“你这蒙恩的，主与你同在”）将玛利亚置于救赎故事的中心。她问天使应该怎样做，因为她从来没有亲密地”认识“一个人。在回答时，天使告诉她，她将通过圣灵受孕。在她的尘世生活结束时，玛利亚的身体和灵魂被带到天堂的荣耀中。"
 omen_st_matthew_levi:0 "圣玛窦·列维"
 omen_st_matthew_levi_desc:0 "玛窦是拿撒勒人耶稣的门徒，被列为十二个使徒之一。使徒玛窦被认定为《新约》四部福音书中第一部的作者，这就是为什么他也被尊称为福音书作者。为了声援使徒和前税吏玛窦，其他福音书作者会使用部落名字列维而不是玛窦。"
 omen_st_nathanael_bartholomew:0 "圣纳撒内尔·巴塞洛缪"
 omen_st_nathanael_bartholomew_desc:0 "巴塞洛缪是耶稣的门徒，也是前三本福音书的使徒名单中提到的十二个使徒之一。他在约翰福音中被称为拿但业。他的全名可能是纳撒内尔·巴·托尔梅。可以假设纳塔纳埃尔·巴·托尔梅是一名抄写员或抄写员学生。"
 omen_st_paul:0 "塔尔索的圣保罗"
 omen_st_paul_desc:0 "塔尔索的保罗是一位成功的早期基督教传教士和最早的基督教神学家之一。作为一个受过希腊教育的犹太人和具有罗马公民身份的守法的法利赛人，保罗——他的希伯来语名字是扫罗——最初受难耶稣基督的追随者，除了他信主时的出现，他从未见过这些人。然而，自从他信主以来，他把自己看作是上帝召唤的、为人民传播福音的使徒。因此，他宣扬复活的耶稣基督，特别是对非犹太人。为了做到这一点，他前往地中海东部，在那里建立了几个基督教社区。他通过书信与他们保持联系。"
 omen_st_peter:0 "圣彼得"
 omen_st_peter_desc:0 "西门彼得是被拿撒勒人耶稣——弥赛亚或基督——召来跟随他的第一批犹太人之一。西门是门徒或使徒的发言人，第一个忏悔者，但也在审判中否认了耶稣。他是复活的主的目击者，是耶路撒冷早期教会的领导人之一。彼得是罗马的第一任主教，基督让彼得和罗马的继任主教优先成为所有基督徒的领袖、教师和法官。因此，教皇也被称为”彼得的继承人“。根据基督教经文，耶稣用一个特别的承诺回答了西门的认主，“你是彼得[Greek, petros]并在此石[petra]上，我要把我的教会[ekklesia]建立在这磐石上，地狱[hades]的力量[pylai, literally gates]就不能压倒了”。"
 omen_st_philip:0 "圣菲力普"
 omen_st_philip_desc:0 "菲力普是耶稣的十二门徒之一。他与安德鲁一起在黑海的希拉波利斯（小亚细亚）地区工作。他在乌克兰的斯基泰死于殉道者之手。"
 omen_st_thomas:0 "圣托马斯"
 omen_st_thomas_desc:0 "使徒托马斯是十二个使徒之一，他们作为朋友和学生陪伴耶稣三年。多马在印度和周边地区建立了教会，远至中国，传播复活者的福音。多马怀疑拿撒勒人耶稣的复活，直到他根据使徒们的见证，亲自看到并触摸到复活的基督。因此，他被戏称为 \"怀疑者\"。多马在马拉巴尔海岸建立了最早的七个基督教社区，并在对面科罗曼德海岸的梅拉普尔（Mailapur）殉教而死。"

 deity_tutgar:0 "$omen_tutgar$"
 omen_buk:0 "布克"
 omen_buk_desc:0 "布克，或称阿布克，是天空和河流的女神。她是第二级的女神，也被称作科洛维克，并且有一种鸟形，可以化身为乌鸦在空中飞翔。她也可以在地上以更为熟悉的形态显现。布克还是强大的科维克·登格的母亲。"
 omen_colwic_abany:0 "科洛维克·阿巴尼"
 omen_colwic_abany_desc:0 "科洛维克·阿巴尼是尼罗特人的天空级，或者说第二级的女神。她可能是古埃及女神哈托尔的原始灵感来源，这显示了她在普通民众心中的重要性。"
 omen_deng:0 "登格"
 omen_deng_desc:0 "登是第二层级天空神中最强大者，也称科尔维克。登与马卡尔迪特、加朗和布克处于同一时代。"
 omen_garang:0 "加朗"
 omen_garang_desc:0 "加朗是强大的登格之子，同时也是一位太阳神。他是布克的孙子，继续传承着神祇的强大血脉。"
 omen_kowth_nhial:0 "科思特·尼哈勒"
 omen_kowth_nhial_desc:0 "至高神科夫·尼哈尔位于尼罗特人神祇体系的顶端，也被称为尼亚利克·阿切克。科夫·尼哈尔在神威上常常与亚伯拉罕诸教的神相比，并被认为是尼罗特人信仰中最顶级，或是最高级别的神祇之一。"
 omen_macardit:0 "马卡尔迪特"
 omen_macardit_desc:0 "马卡尔迪特是一位闪电之神，无论信徒还是反对者都会因他而心生恐惧。如果有人被闪电击中身亡，这被认为是马卡尔迪特意志的表现，任何人都不应为此哀悼。"
 omen_nyikang:0 "尼康格"
 omen_nyikang_desc:0 "尼康格是尼罗特人的文化英雄。他有许多与尼康格相近的名字。他也被认为是尼罗特人的祖先。"
 omen_tutgar:0 "图特加"
 omen_tutgar_desc:0 "图特加是科思特·尼哈勒化身成公牛形态时的名字。在这种形态下，他代表着力量、强壮、父性以及伟大。"

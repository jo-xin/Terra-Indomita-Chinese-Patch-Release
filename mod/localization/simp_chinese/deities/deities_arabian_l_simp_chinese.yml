 omen_almaqah:0 "阿尔马卡"
 omen_almaqah_desc:0 "阿尔马卡是南阿拉伯萨巴王国和东非阿克苏姆王国的太阳神。萨巴王国的统治王朝自认为是他的直接后裔。阿尔马卡在图像中由一组环绕弯曲武器（如镰刀）的闪电构成。公牛是他的圣动物。巴兰神庙和玛赫兰比尔基斯神庙是献给他的。"
 omen_amm:0 "阿姆"
 omen_amm_desc:0 "阿姆是月亮和天气之神，在卡塔巴被崇拜。阿姆也是阿拉伯语中“叔叔”的意思。王国的居民自称为巴努阿姆，或“阿姆的子民”。与阿尔马卡和其他南阿拉伯神明一样，他的象征至少部分是闪电。他的妻子是女神阿舍拉特，与乌加里特女神阿塞拉特相同。他得到了法律神谕之神安拜的支持。"
 omen_anbay:0 "安拜"
 omen_anbay_desc:0 "安拜是卡塔班王国崇拜的正义之神。人们常将他与另一位法律之神豪基姆一同呼唤。"
 omen_atarsamain:0 "阿塔尔萨曼"
 omen_atarsamain_desc:0 "阿塔尔萨曼，天上的晨星。祂是一位星辰神，没有性别。祂经常与阿拉特或阿塔尔联系在一起。"
 omen_athtar:0 "阿塔尔"
 omen_athtar_desc:0 "阿塔尔是一个古代闪族的神明，其角色、名字甚至性别因文化而异。名字以‘阿塔尔（阿拉姆语）、阿塔尔（南阿拉伯语）、阿斯塔尔（阿克苏姆语）、阿斯塔尔（摩押语）和伊什塔尔（美索不达米亚）出现。在两种性别中，阿塔尔与金星、晨星和晚星有关。该神明也与腓尼基女神阿斯塔尔特有关。在南阿拉伯，他被崇拜为战神，经常被称为“战斗中勇敢者”。他的一个象征是矛头，羚羊是他的圣动物。他掌控金星，晨星，被认为能为人类提供水。因此，阿塔尔也是雷暴和雨水之神，流动水、灌溉和通过水的生育之神。\n\n#!神化效果：$military_apotheosis_capital_freemen_effect_tt_description$"
 omen_beher:0 "贝赫尔"
 omen_beher_desc:0 "贝赫尔是阿克苏姆的海神。他与阿什塔尔，也就是南阿拉伯的阿塔尔，以及阿什塔尔之子战神马赫尔共同组成三位一体；阿什塔尔是至高神。"
 omen_dhushara:0 "杜沙拉"
 omen_dhushara_desc:0 "杜沙拉是纳巴泰人在佩特拉和马甸萨利赫（他是那里的守护神）崇拜的神明。他与酒神狄俄尼索斯共同领导纳巴泰神系。杜沙拉若按正确的仪式祈祷，可以执行正义。"
 omen_dushara_ara:0 "杜沙拉-阿拉"
 omen_dushara_ara_desc:0 "杜沙拉-阿拉，山之主，他是纳巴泰人的大神。后来他与宙斯、赫利俄斯和狄俄尼索斯等相联系。"
 omen_hubal:0 "胡巴尔"
 omen_hubal_desc:0 "胡巴尔是月神与天空之神，在西阿拉伯的麦加天房中被崇拜，他最初是纳巴泰人的雨神和战神。据信，天房中这位神明的神像是一个能帮助人类进行占卜的神谕，方式是在雕像前投掷箭矢，并就未来应采取的行动提问。掉落箭矢所指的方向即为问题的答案。"
 omen_maher:0 "马赫尔"
 omen_maher_desc:0 "马赫尔是阿克苏姆人和希迈尔人的战神。他是主要神阿斯塔尔（南阿拉伯的阿塔尔）的儿子，也是海神贝赫尔的对应神。"
 omen_rekem:0 "雷肯"
 omen_rekem_desc:0 "雷克姆，佩特拉——该地区最伟大城市之一——的守护神。愿雷克姆祝福这座城市以及所有信仰他的人们，百年复百年。"
 omen_ruda:0 "鲁达"
 omen_ruda_desc:0 "鲁达是北阿拉伯最重要的神明之一。首次提到是在公元前7世纪早期的埃萨尔哈顿编年史中，他是与月亮有关的保护神。他的名字意为“心地善良”。"
 omen_sayin:0 "赛因"
 omen_sayin_desc:0 "赛因是古美索不达米亚宗教中的月亮神，崇拜于苏美尔、阿卡德、亚述和巴比伦。他现在在哈德拉毛也被崇拜为月亮和财富之神，被称为赛因。"
 omen_shams:0 "沙姆斯"
 omen_shams_desc:0 "沙姆斯是南阿拉伯的太阳女神，也是希迈尔王国的守护女神。她在北阿拉伯的对应神是太阳女神努哈。古阿拉伯宗教注重地方神，每个部落和王国都有自己的保护神。然而，也有一些神是所有阿拉伯人共有的，比如代表太阳、月亮和金星的三位一体，尽管它们的名字、性别和崇拜因地区而异。因此，沙姆斯在北方被称为努哈。在美索不达米亚，沙姆斯被认同为男性太阳神沙马什，正如阿拉伯男性神阿塔尔与美索不达米亚女神伊什塔尔有关联一样。沙姆斯常被描述为阿塔尔的妻子。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_wadd:0 "瓦德"
 omen_wadd_desc:0 "瓦德是南阿拉伯马因人的民族神祇，与蛇相关联。居住在希腊提洛岛的马因人为他建造了一座祭坛，上面刻有马因文和希腊文的铭文。在利雅统治下的得丹，马因殖民者也在大神殿中崇拜他。瓦德同样是古代阿乌萨王国的民族神祇。希腊化时期，阿乌萨国王被神化为“瓦德之子”。他的形象穿着希腊式而非阿拉伯式服饰，并像神一样接受供奉。"

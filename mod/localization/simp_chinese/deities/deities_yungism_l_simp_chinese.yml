 omen_bok_hoch:0 "博克·霍赫"
 omen_bok_hoch_desc:0 "博克·霍赫是鸟类之神，但也统管其他动物。他显现为一只巨大的鸟，发出骇人的叫声，展开宽阔的翅膀。他将鸟类和动物带到田野，使人们能够利用肥沃的土地并猎取受祝福的动物。"
 omen_ca_ong:0 "鲸翁"
 omen_ca_ong_desc:0 "鲸翁是鲸鱼之神。他是亚洲东海岸众多鲸神之一。在翁教中，Ca Ong字面意思是\"象鱼\"。后来，他与一则佛教神话联系起来，该神话解释了鲸翁如何从致命风暴中救起一位渔民。"
 omen_ching:0 "翁琴"
 omen_ching_desc:0 "翁琴是铜锣之神。铜锣是由七面不同大小的青铜符号组成的重要乐器可发出不同音高。翁琴为人们提供重要的创造性表达和享受的方法。"
 omen_mam:0 "翁·曼"
 omen_mam_desc:0 "翁·曼是铁之女神。元素在翁教中是一个重要方面因此翁·曼作为有用元素铁的神祇具有重大意义。她的铁之意志将对作恶者施以正义。"
 omen_mat_khei:0 "翁·马凯"
 omen_mat_khei_desc:0 "翁·马凯以一位温柔和善的月亮女神而闻名。与太阳神翁·马纳形成对比的是翁·马凯要温和得多常被描述为一位甜美的女神。"
 omen_mat_nar:0 "翁·马纳"
 omen_mat_nar_desc:0 "翁·马纳是炽烈而炎热的太阳神。他以一位严酷无情的男神而著称但也是对生命和种植作物至关重要的神。"
 omen_neak_ta:0 "涅达"
 omen_neak_ta_desc:0 "涅达是保护之神，也是岩石之灵。岩石的神圣之灵可以保护人民并照看他们，前提是他们受到适当的尊重。"
 omen_owl_hater:0 "婆罗萨蒂托伊"
 omen_owl_hater_desc:0 "婆罗萨蒂托伊是猫头鹰之神。一个流传至今的传说说，如果猫头鹰鸣叫，必须将其杀死，因为这意味着有人很快会死去。这使得婆罗萨蒂托伊成为一位令人恐惧的命运和死亡之神。"
 omen_pilak:0 "婆罗·皮拉克"
 omen_pilak_desc:0 "婆罗·皮拉克是银之神。翁教是一种特别崇敬自然物质和元素的信仰。因此银的神性在人民的信仰中占有重要地位。"
 omen_teh:0 "勇德"
 omen_teh_desc:0 "土地之神勇德掌管着大地与土壤的重要元素。他赐福于人民，使土地肥沃，让男人们能在田间播下好庄稼。"
 omen_tuk:0 "勇德（Yung Tuk）"
 omen_tuk_desc:0 "勇德（Yung Tuk），亦称永达（Yong Dak），是一位温柔的水之女神。她喜爱与人类共度时光，常赴节庆唱歌跳舞。她被描绘成一位美得惊人的女神，歌声同样迷人。据说她的美丽与歌喉令无数男子无法抗拒。"
 omen_unh:0 "勇恩（Yung Unh）"
 omen_unh_desc:0 "勇恩（Yung Unh）是火之神。他赐予人类火的力量，因此对人民过上幸福生活不可或缺。有了火，人们才能烧荒收集草木灰——这一切全赖伟大的勇恩。"

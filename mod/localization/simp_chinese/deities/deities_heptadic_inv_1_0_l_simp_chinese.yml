 omen_agathyrus:0 "阿加提尔斯"
 omen_agathyrus_desc:0 "阿加提尔斯是阿加提里斯部落的神，希罗多德声称这是斯基泰人起源故事中的三位神祇之一。阿加提里斯部落曾统治本都草原，被认为是三个斯基泰民族中最古老的。"
 omen_amazons:0 "亚马逊"
 omen_amazons_desc:0 "传说中的女战士们，据说源自斯基泰人的草原。亚马逊女王常常指挥她的女战士们进行远征，远至色雷斯、小亚细亚，甚至到达阿拉伯和埃及。\"Amazon\"这个词可能最初来源于一个印度-伊朗语系的词根，类似于\"Hameh-Zan\"，字面上的意思是一群女性。\n\n古希腊人有一个关于亚马逊人的民间词源学解释。按照这种解释，“Amazon”一词可以被简单地翻译为“无乳房”，这指的是一个传说，即亚马逊女战士会割掉一只乳房，以便在使用弓箭时减少障碍。这种错误的词源学解释可能促进了这一传说的发展，然而，在很多描绘中，亚马逊女战士都被表现为拥有两只乳房，只是往往有一只被遮盖住。也许非神话版本的亚马逊人仅用一只乳房哺乳。\n\n亚马逊女战士的性质可能会给女性统治者带来更大的奖励和益处。在古代，亚马逊人通常被描述为强大的女战士社会，她们独立自主，以女性为主导。在某些传说中，亚马逊人只与男性接触以繁殖后代，而子女的抚养和教育则完全由女性承担。这种社会结构强调了女性的力量和领导能力，对于那些希望利用这种象征力量的女性统治者来说，亚马逊人的形象提供了灵感和支持。\n\n#!神化效果：$amazons_apotheosis_effect_tt_description$"
 omen_anguipedia:0 "安古伊佩迪亚"
 omen_anguipedia_desc:0 "安古伊佩迪亚是一个未命名但很重要的蛇腿女神的替代名称。她有时被称为安古伊佩德女神，因为她的描绘中腿部是蛇状的。据说她与伟大的神塔尔吉塔奥斯生下了第一个斯基泰国王。她也被认为是阿皮的女儿，同时也是河流以及可能与生育或母性有关的女神。尽管她在赫普塔迪克神话中扮演着重要角色，但她总体上被视为一个较次要的神祇。"
 omen_ariantes:0 "阿里安特斯"
 omen_ariantes_desc:0 "阿里安特斯是传说中的斯基泰国王。传说中，他想要了解自己的全部人口数量，于是让每一个斯基泰人都给他带来一个箭镞。通过这种方式，他创造了一个巨大的青铜容器，并通过计算箭镞的数量了解到了自己统治下的人口数量。"
 omen_arpoxais:0 "阿尔波克赛斯"
 omen_arpoxais_desc:0 "他是塔吉塔斯的次子，是触碰上天的金色礼物的三人之一，但其使之燃烧，在三方王室的等级制度中，他被降级为下级国王。斯基泰人认为他是卡蒂亚里部落和特拉斯皮亚部落的始祖。在希腊版本的神话中，他被称为格洛纳斯，是居住在皇家斯基泰人东北部、玻律斯忒涅斯河以东森林腹地的格洛尼部落（又称赫洛尼部落）的祖先。"
 omen_aspasyros:0 "阿斯帕西罗斯"
 omen_aspasyros_desc:0 "阿斯帕西罗斯这个名字结合了波斯词根“Aspas”和希腊词根“Suros”，意味着“强大的马”。斯基泰人相信有这样的神祇存在，阿斯帕西罗斯是一位伟大的太阳战马，可能与达西亚人、色雷斯人和伊利里亚人的色雷斯骑士崇拜有关，或者甚至是启发这些传统的更为古老的原型。阿斯帕西罗斯被认为是对抗邪恶的伟大战士。"
 omen_baurastana:0 "鲍拉斯坦纳"
 omen_baurastana_desc:0 "鲍拉斯坦纳最为人所知的是他的女儿，她后来扮演了一个关键的角色，与帕帕乌斯共同孕育了塔吉塔奥斯。鲍拉斯坦纳是一位与博里塞内斯河相关的神祇，很可能在河流的功能方面扮演了重要角色，但我们对这位神祇的了解并不多。"
 omen_colaxais:0 "科拉克赛斯"
 omen_colaxais_desc:0 "他是塔吉塔奥斯最小的儿子，也是三人中唯一能够触摸天上的金色礼物而不使其迸发火焰的人，他被公认为三方王室等级制度中的最高国王。斯基泰人称他为帕拉塔部落的始祖。在希腊版本的神话中，他被称作斯基忒斯，是统治本都草原的皇家斯基泰人的祖先。尽管阿伽堤耳人、革隆人和皇家斯基泰人这三个族群都被统称为斯科洛托伊人（希腊斯基泰人），但他们都以皇家斯基泰人命名并由其统治。"
 omen_gelonus:0 "格洛努斯"
 omen_gelonus_desc:0 "格洛努斯是格洛尼部落的神。格洛尼部落据说曾经是希腊人，现在变成了斯基泰人，他们的首都是以他们的神格洛努斯命名的城市。格洛努斯是三位兄弟神祇中的第二位，这意味着格洛尼部落是三个斯基泰民族中的第二个。"
 omen_haoma:0 "哈欧玛"
 omen_haoma_desc:0 "哈欧玛在泛印伊信仰中出现，可能与吠陀神祇苏摩同源。在琐罗亚斯德教中，哈欧玛指的是在琐罗亚斯德启示中扮演重要角色的一种特定植物。哈欧玛在10世纪费尔多西的《沙赫纳梅》中变得更加像是一个神祇形象。在此之前，他很可能是草原上泛印伊信仰中的一个普遍神祇。"
 omen_idanthyrsus:0 "伊丹提尔斯"
 omen_idanthyrsus_desc:0 "伊丹提尔苏斯是公元前6世纪的斯基泰国王。他与阿契美尼德人的战斗非常传奇，因为他成功地保卫了自己的领土免受阿契美尼德的侵吞。他曾力劝阿契美尼德人不要入侵他的国家，因为他们没有理由这样做，也不会从中获得任何好处。"
 omen_leipoxais:0 "利波克赛斯"
 omen_leipoxais_desc:0 "他是塔吉塔斯的长子，是触碰上天的金色礼物的三人之一，但其使之燃烧，在三方王权等级中被降为低级王位。在斯基泰人的传说中，他是奥查泰部落的始祖。在希腊版本的神话中，他被称为阿加西尔苏斯，是居住在斯基泰王族西边、横跨马里斯河平原的阿加西尔西部落的祖先。"
 omen_missa_baka:0 "米萨-巴卡"
 omen_missa_baka_desc:0 "米萨·巴卡是一个在多种信仰中受到崇拜的印伊神祇，与真理、丰收相关，并在强化水源的仪式中扮演角色。\n\n米萨·巴卡是赫普塔迪克信仰中密特拉的一种特定版本。虽然与密特拉相似，但在赫普塔迪克信仰中，米萨·巴卡的重要性不如密特拉。他更类似于琐罗亚斯德教的巴加·密特拉。"
 omen_mithra_nergal:0 "密特拉-内尔伽尔"
 omen_mithra_nergal_desc:0 "有趣的是，密特拉经常与内尔伽尔融合，内尔伽尔是美索不达米亚的死亡之神。这可能仅仅是因为他在新巴比伦时期的地位显著，随后内尔伽尔的影响被阿契美尼德时期的印欧语系信仰所取代。他们很可能在阿契美尼德时期之前就已经融合了，与前琐罗亚斯德教的印欧语系宗教有关。"
 omen_mithra_shamash:0 "密特拉-沙玛什"
 omen_mithra_shamash_desc:0 "密特拉-沙马什是两个伟大太阳神的融合神祇，分别来自各自的信仰体系。密特拉和沙马什都代表着太阳，同时也代表着正义，在各自的神祇体系中地位显赫。密特拉-沙马什继续保持着这种显赫的地位，特别是在米底和美索不达米亚影响力交汇的地方。"
 omen_patampasa:0 "帕塔姆帕萨"
 omen_patampasa_desc:0 "每个部落每年都会焚烧一大堆木头，上面放一把带血的剑，以示部落的忠诚和对宇宙秩序的承诺。他是冲突和最终胜利之神，类似于伊朗的乌鲁斯拉格纳。希腊人称他为 \"斯基泰阿瑞斯\"。"
 omen_rostam:0 "鲁斯塔姆"
 omen_rostam_desc:0 "罗斯塔姆是一位波斯英雄，他在10世纪由波斯诗人费尔多西在史诗《列王纪》中被不朽化。在此之前，罗斯塔姆是印欧语系信仰中的一个神话英雄。"
 omen_scythes:0 "斯基塞斯"
 omen_scythes_desc:0 "斯基塞斯被希罗多德称为斯基泰人的神。斯基塞斯很可能就是塔尔吉塔奥斯本人，或者是他的别称或地区变体。无论如何，斯基塞斯的神话略有不同。斯基塞斯是三位兄弟神祇中最年轻的一位，这意味着斯基泰人是三个斯基泰民族中最年轻的。"
 omen_skopasis:0 "斯科帕西斯"
 omen_skopasis_desc:0 "斯科帕西斯是斯基泰苏罗马特部落的国王，斯科帕西斯领导下的萨尔马提亚人帮助斯基泰国王伊丹提尔斯和塔克西克斯共同抵御了阿契美尼德波斯的入侵。斯科帕西斯在击败大流士一世的伊奥尼亚军队方面发挥了关键作用。"
 omen_taxakis:0 "塔克西克斯"
 omen_taxakis_desc:0 "塔克西克斯是塞种部落的统治者，在抵御大流士一世和阿契美尼德军队入侵斯基泰的过程中发挥了重要作用。在希腊神话中，包括塔克西克斯在内的三位斯基泰国王因这项壮举而被永载史册。"
 omen_tur:0 "图尔"
 omen_tur_desc:0 "图尔是传说中费雷敦王的次子。其名意为“勇敢”，源于他与兄弟萨尔姆、伊拉杰共同迎战袭击他们的恶龙。费雷敦死后，图尔获赐中国与突厥斯坦之地，这也成为图兰神话的根基；图兰后来成为伊朗人的强大宿敌。"

 omen_anti:0 "安提"
 omen_anti_desc:0 "安蒂，希腊人称其为安泰俄斯，是摔跤和力量之神。他通常被视为自然世界的力量与活力的象征，以及大地本身的力量。他的希腊名字不仅用来指代山脉、摔跤手，甚至啤酒，并且他在多部希腊神话中以安泰俄斯的身份出现。"
 omen_anzar:0 "安扎尔"
 omen_anzar_desc:0 "安扎尔是一位雨神，也被称为阿扎尔或阿祖拉。安扎尔与生育、农业及通过雨水使大自然得以更新相关联。他通常被描绘为一位蓄有胡须的男子，手持一根拐杖和一桶水。"
 omen_ayyur:0 "阿尤尔"
 omen_ayyur_desc:0 "阿尤尔是月神。与太阳女神塔富克特一起，阿尤尔带领人类从世界的黑暗之中走向地表。他会与邪恶女神塞图特发生冲突，后者企图摧毁人类的光明。她会将阿尤尔囚禁在她的镜子里。然而，塞特图特很可能也是阿尤尔的母亲。"
 omen_bacax:0 "巴卡克斯"
 omen_bacax_desc:0 "在古代柏柏尔人的宗教中，巴卡克斯是洞穴和葡萄收获之神。人们相信巴卡克斯居住在洞穴之中，这些洞穴被认为是神圣的空间，并且他与大地的肥沃和葡萄丰收的丰饶有关。巴卡克斯经常被描绘成一位长着胡须和角的男子，手持葡萄藤或一杯葡萄酒，并被诸如黑豹或蛇等动物环绕。他常常与希腊化的神祇巴克斯混为一谈，因此关于巴卡克斯的知识很可能也是通过那些视他为巴克斯化身的人们的视角来了解的。"
 omen_ifri:0 "依芙里"
 omen_ifri_desc:0 "女神伊夫里，也称为阿夫里、伊夫鲁和德·阿非利加，是柏柏尔人的财富、战争、保护和生育女神。罗马人将这位女神视为阿非利加行省的主要女神，因此得名“阿非利加”。"
 omen_mastinam:0 "马斯蒂纳姆"
 omen_mastinam_desc:0 "马斯蒂纳姆是一位与古代北非柏柏尔人相关的神祇。这位神祇在利比亚受到崇拜，并被认为与罗马神祇朱庇特有所关联。马斯蒂纳姆通常被描绘为手持雷电，这是他掌控风暴和闪电力量的象征。"
 omen_moneiba:0 "莫内巴"
 omen_moneiba_desc:0 "莫内伊巴是一位女性保护女神，主要在加那利群岛受到崇拜，她的崇拜可能直接源自非洲的柏柏尔人。\n\n莫内伊巴通常被描绘为怀抱孩子或是哺乳婴儿的形象。她还与海洋有关联，一些传说认为她是美人鱼，会出现在海员面前警告他们即将来临的风暴或其他海上危险。"
 omen_settut:0 "塞特图特"
 omen_settut_desc:0 "塞特图特是一位复杂的母神。起初，她是世界上第一个人类。她最初是一位生命创造者和热爱者，并创造了太阳（塔福克特）和月亮（阿尤尔）。然而，随着她的衰老，她开始从他人的痛苦中找到快乐。她变成了冥界的神祇，渴望有一天冥界能吞噬世界和人类。她也曾试图通过囚禁阿尤尔和塔福克特来夺取世界的光明。"
 omen_tafukt:0 "塔富克特"
 omen_tafukt_desc:0 "塔福克特是太阳女神。她与阿尤尔一起引导人类从世界的黑暗中来到地表之上。她会与邪恶女神塞特图特发生冲突，后者试图摧毁人类的光明。塞特图特会吞噬塔福克特并将太阳缩小成一个小球。尽管如此，塞特图特可能也是塔福克特的母亲。"

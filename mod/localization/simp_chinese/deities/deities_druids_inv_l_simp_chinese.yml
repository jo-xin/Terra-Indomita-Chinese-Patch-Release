 omen_alaunius:0 "阿劳尼乌斯"
 omen_alaunius_desc:0 "阿劳尼部落的守护神以其纯净和治愈的水而闻名。他也被称为预言之神，那些寻求未来指引的人会来找阿劳努斯。"
 omen_arvernus:0 "阿维尔努斯"
 omen_arvernus_desc:0 "在高卢中部，阿维尔尼部落崇拜他们的神阿维尔努斯，他是他们人民的榜样。罗马人将他视为墨丘利的平行神，因此与商业和工艺技能相关。"
 omen_cocidius:0 "科西迪乌斯"
 omen_cocidius_desc:0 "不列颠尼亚北部的人民在许多方面都敬重科西迪乌斯。他是树木和林地之神，也是剑与盾之神。不列颠人用木雕刻这位吉祥的神祇，并涂上红色以获得他的青睐。"
 omen_condatis:0 "康达蒂斯"
 omen_condatis_desc:0 "不列颠的凯尔特人崇拜康达蒂斯，河流和治愈之神。他的追随者聚集在河流汇合处，献上礼物和祭品以表达对他的敬意。"
 omen_damona:0 "达莫娜"
 omen_damona_desc:0 "达莫娜在凯尔特人中被称为‘神圣之牛’，是丰饶和繁殖的象征。她常被视为波尔沃或莫里塔斯古斯的配偶，她的追随者在高卢的多个温泉祈祷她。"
 omen_leucetius:0 "勒乌凯修斯"
 omen_leucetius_desc:0 "高卢的特雷韦里部落对黑暗天空中的雷电景象敬畏不已，因为勒乌凯修斯在他们面前表演。作为闪电之神，勒乌凯修斯是力量和速度的象征，并受到战士们的崇拜。"
 omen_mogons:0 "莫贡斯"
 omen_mogons_desc:0 "东高卢的万吉奥内部落将他们的主要神祇莫贡斯称为“伟大者”。他们在战前呼唤他的帮助，因为他的象征是一把沾满鲜血的剑。"
 omen_rudianos:0 "鲁迪亚诺斯"
 omen_rudianos_desc:0 "在高卢东南部，人们崇拜鲁迪亚诺斯，他们的战神。他是一位骑马的红色威胁，参与高卢人最喜爱的仪式性猎头活动。他的追随者在进入战斗时将自己涂成红色，准备收集敌人的头颅。"
 omen_segomo:0 "塞戈莫"
 omen_segomo_desc:0 "在战前，海杜安战士会向战神和胜利之神塞戈莫祈祷。他被称为‘强大者’，战士们向他献上大量战利品，以示崇敬和感恩。"
 omen_sionna:0 "西奥娜"
 omen_sionna_desc:0 "狐神希昂娜拥有化身万物的神秘能力。这位兼具美貌与智慧的女神激励着族人狩猎，尤其受到比利其人的虔诚崇拜。沿海居民则信奉她那位神秘的配偶——相传来自费利西亚库姆的狐神。"
 omen_sirona:0 "西罗娜"
 omen_sirona_desc:0 "西罗娜在凯尔特人中广为人知并受到崇拜，特别是在北高卢的特雷韦里部落。她是主要的治愈女神，与泉水和清澈的水有关。她通常被描绘成怀抱一碗鸡蛋，手臂上缠绕着一条绿色的蛇。"
 omen_smertrios:0 "斯梅尔特里奥斯"
 omen_smertrios_desc:0 "斯梅尔特里奥斯被高卢和诺里库姆的凯尔特人尊奉为战争之神。铁匠们为他的力量祈祷，他常被描绘成一个强壮的胡须男人，正在与一条可怕的巨龙作战。"
 omen_snowlet:0 "斯诺莱特"
 omen_snowlet_desc:0 "斯诺莱特是狐狸之神，也是西奥娜的配偶。斯诺莱特以严厉纪律统率天界军队而闻名。他的领导至高无上，他的命令绝对不可违逆，异议者会受到惩罚。即便大海也无法阻止他，因为他会令军队穿过最深的水域。\n\n不过也有人觉得，他对妻子狐狸形态的着迷颇为古怪，尤其当他自己也处于狐狸形态时。他的神圣军队发明了“福瑞”一词来形容这种情况。"
 omen_visucius:0 "维苏修斯"
 omen_visucius_desc:0 "在横跨莱茵河的东高卢，部落们崇拜维苏修斯。他是知识之神，因此受到老幼追随者的崇敬，他们向他献祭以求成功和技巧。他的象征是最聪明的鸟——乌鸦，黑如烟灰，总是准备展示一个把戏。"

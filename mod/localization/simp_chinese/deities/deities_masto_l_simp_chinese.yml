 omen_barha:0 "巴拉·马斯托·德瓦塔"
 omen_barha_desc:0 "马斯托信仰的特征之一是巴拉·马斯托·德瓦塔，即十二马斯托神。这些神都是主神马斯托的兄弟。他们各自像马斯托本人一样，作为氏族和亲属神祇或家宅神祇受到崇拜。他们的名称因崇拜地区而异，但大致如下：\n\n1. 阿迪·马斯托\n2. 卡帕德·马斯托\n3. 巴比罗·马斯托\n4. 鲁马尔·马斯托\n5. 卡拉·马斯托\n6. 达达雷·马斯托\n7. 塔尔帕·马斯托\n8. 巴尼·马斯托\n9. 卡巴·马斯托\n10. 曼达利·马斯托\n11. 达代·马斯托\n12. 达尔赫·马斯托。"
 omen_dubo:0 "杜波"
 omen_dubo_desc:0 "杜波是圣草之神。践踏杜波的圣草是亵渎行为若有意为之将无法平息杜波的愤怒。詹克里将引导他掌控圣草的力量以增强灵性。"
 omen_durga_masto:0 "九难近母女神"
 omen_durga_masto_desc:0 "马斯托的九位难近母姐妹，或称九难近母女神，是马斯托信仰中的重要力量。难近母姐妹在神魔之间的主要神话战争中扮演着重要角色。马斯托在与魔鬼作战，但魔鬼将难近母女神通为目标，认为她们是战斗的根源。马斯托击败魔鬼，找到了他的姐妹。这些女神最终成为与吠陀印度教连接的纽带，甚至可能\"难近母\"这个名字本身来自吠陀信仰而非原始马斯托信仰。似乎可以确定的是，马斯托有这九位姐妹，她们的名字虽因地区而异，但大致如下：\n\n1. 玛莉卡\n2. 特里普拉孙达里\n3. 凯斯玛莉妮\n4. 蓬格莉妮\n5. 迦那迦孙达里\n6. 贾拉帕\n7. 廷亚尔妮\n8. 希玛莉妮\n9. 宾迪亚巴悉妮。"
 omen_gothadevata:0 "戈塔德瓦塔"
 omen_gothadevata_desc:0 "戈塔德瓦塔是储藏和库房之灵。詹克里可以召唤戈塔德瓦塔来储存食物而不使其变质，或保管珍贵财产和钱财。戈塔德瓦塔还能掌控土壤，使肥沃的土地产出充足的粮食以供储存。"
 omen_jaladevata:0 "贾拉德瓦塔"
 omen_jaladevata_desc:0 "贾拉德瓦塔是马斯托万神殿中重要的水神。这位神灵提供从喜马拉雅山流向下方河谷的重要水源，滋养着印度富饶土地上的所有生命。詹克里萨满常引导贾拉德瓦塔的淡水，促进维持达尔迪克人生计的年度河流。"
 omen_malika:0 "玛莉卡"
 omen_malika_desc:0 "作为九难近母女神的其中一位，玛莉卡尤为重要。她住在喜马拉雅山，与她同名的玛莉卡山位于此地。她的神庙被称为\"俱毗罗财富之助\"。她也与女神帕尔瓦蒂相关联，作为其化身，与难近母一道。"
 omen_masto:0 "马斯托"
 omen_masto_desc:0 "万神殿的主神，马斯托是高于所有其他神祇的神。正是他受到达尔迪克人民的崇敬。马斯托是一位非常神秘的神，关于他的可靠资料很少。他似乎与印度-伊朗神祇阿胡拉·马兹达有某种联系。马斯托据说有12位兄弟和9位姐妹。兄弟被称为马斯托神，姐妹是难近母女神。很难将马斯托与传统的吠陀信仰分开，因为存在着高度的融合，然而，马斯托直到公元7世纪才被视为吠陀信仰的一部分，在此之前明显独立。"
 omen_pipala:0 "皮帕拉"
 omen_pipala_desc:0 "无花果树之神和精灵皮帕拉，以营养美味的无花果祝福植物。这些果实帮助维持北印度山区崎岖地带的生命。詹克里引导皮帕拉，确保他对树木的祝福。"
 omen_surya:0 "苏利耶"
 omen_surya_desc:0 "太阳无情地炙烤大地，从清晨直至夜晚，正是苏利耶放射着他的光芒。苏利耶是太阳之灵或日神。它在达尔德人的自然崇拜信仰中起着至关重要的作用。詹克里（Jhankri）萨满必会利用其灵性连接，祈求太阳在必要之时普照大地。"
 omen_tulsi:0 "图尔西"
 omen_tulsi_desc:0 "罗勒之神与灵图尔西为达尔德之地提供了这种烹饪上极为重要的香草。詹克里萨满祈求图尔西的祝福，以便马斯托（Masto）的子民得以滋养、健康。"
 omen_vanadevata:0 "森林之神（Vanadevata）"
 omen_vanadevata_desc:0 "詹克里萨满召来森林之神（Vanadevata）之力。这位森林之神或树木之神，常以牧神之态显现在凡间。他可助人林中行猎，并加强我们周遭自然与人类之间的灵性联系。"
 omen_vara:0 "瓦拉"
 omen_vara_desc:0 "榕树之神与灵瓦拉，将其伸展的枝叶遍布于世。榕树以其独特的外观闻名，横向伸展，如同覆于林地之上的穹顶。这些树木可极为古老，常被当作瓦拉本身来崇拜。"

 omen_baeuqloxdoh:0 "布洛陀"
 omen_baeuqloxdoh_desc:0 "布洛陀，汉人称布洛陀，是麽教中的至高创世神和天神。他也被认为是该宗教的创始人。其配偶为姆六甲。在祭祀中，他通常在春节庆典中被献祭。他还是大地的统治者，而甲和额分别统治天空和海洋。"
 omen_bandiq:0 "班迪"
 omen_bandiq_desc:0 "班迪，村庄之灵，她保护村庄并使之富饶。汉人称她为社神。班迪是从社神直接重构的壮语名称。班迪可能与其他村灵如村庄守护者迪韦格共同工作。"
 omen_byadiq:0 "比亚迪"
 omen_byadiq_desc:0 "山神比亚迪对壮族人相当重要。壮族人擅长山地穿行，崇拜山脉给予的保护及其巍峨巅峰的力量——除甲以外，万物皆在其下。"
 omen_cvaiz_vuengz:0 "畜王"
 omen_cvaiz_vuengz_desc:0 "所谓牛之王此灵代表对牛群和驯化的掌控。Cvaiz是从指牛的词Cwz以及后来指水牛的词Vaiz重构而来。"
 omen_diweg:0 "迪韦格"
 omen_diweg_desc:0 "迪韦格，村庄之灵。他保护村庄并使之富饶。汉人称他为土地公。迪韦格是从土地公重构的壮语名称，源自原始台语的\"Di\"以及作为神祇常见尊称后缀的\"Weg\"。"
 omen_gyaj:0 "甲"
 omen_gyaj_desc:0 "甲，来自天上的雷神，以其巨大的轰鸣声震撼大地。在麽教中，只有三位神是其他众神之主，伟大的母神除外。在这三位神之中，甲的权力领域是天空，除他之外无人能掌握天穹。"
 omen_haeuxdiq:0 "稻神"
 omen_haeuxdiq_desc:0 "稻神源自壮语词Haeux或Haeuxbieg意为稻米。这位稻米女神代表作物生长和生命也代表经济作物。稻米女神的概念并非麽教独有这为稻米在该地区的重要性提供了重要线索。"
 omen_meh_nangz:0 "姆娘"
 omen_meh_nangz_desc:0 "姆娘是一位常被汉人与姆六甲混淆的女神。两位女神都代表女性气质和生育力但姆娘很可能是甘庄山地区一位更具体的女神。她也是一位母神在汉语中为姆娘。"
 omen_mehloeggyap:0 "姆六甲"
 omen_mehloeggyap_desc:0 "姆六甲是麽教中的创造与生育女神。根据壮族传统，宇宙的原始形态是旋转的气。随着它旋转得越来越快，宇宙凝聚成一个\"蛋\"，爆炸成三个部分。顶部是天，底部是水，中间是大地。后来，从大地中长出一朵肉花，在盛开的花中诞生了一位女神。她美丽而智慧，长发飘逸，赤身裸体。这位女神被称为母鸟，即姆六甲。这也可以解释为智慧之母，因为鸟对壮族人来说代表智慧。"
 omen_moloxgyap:0 "莫洛吉普"
 omen_moloxgyap_desc:0 "莫洛吉普，智慧之花，是强大的布洛陀的妻子。她是唯一被以与天空、大地和海洋三位大神平等的地位庆祝的神祇。她作为布洛陀配偶的身份无疑加强了她与人民的联系，她能为人民提供远超想象的知识。"
 omen_ngweg:0 "额"
 omen_ngweg_desc:0 "额，龙神，对任何胆敢挑战他那些足以移动我们所居星球的滔天巨浪的船只毫不留情。额是三位主宰大地领域的神之一。他的领域是水；除了强大的龙额之外，无人能宣称掌握无尽的海洋。"
 omen_yah_vuengz:0 "雅翁（Yah Vuengz）"
 omen_yah_vuengz_desc:0 "雅翁（Yah Vuengz），死亡之先兆，亡者轮回女神，她是一切灵魂耗尽凡世生命之后的主宰。在她的神话中，雅翁——当时还不是亡者女王——在第七个月的第十七轮月相变化时病倒。第十八日，她的状况急剧恶化，到第十九日，她已死。第二十日，她将被埋葬和哀悼，然而到了第二十一日，她竟再次站了起来。这便是死亡女王雅翁的亡者轮回。"

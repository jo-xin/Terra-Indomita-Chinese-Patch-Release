 omen_abhinandananatha:0 "阿宾南达那他"
 omen_abhinandananatha_desc:0 "阿宾南达那他是造桥者，神圣教义的导师，这些教义可以引领人们摆脱无尽轮回的摧残。他曾坐在普利亚努树下冥思，之后获得了至高智慧，他是一位悉达，即解脱的灵魂。"
 omen_ahimsa:0 "非暴力"
 omen_ahimsa_desc:0 "非暴力是耆那教的一项重要誓言，我们将举行一场盛大的仪式纪念暴力在我国的终结。现在时候让我们的人民摆脱战争之苦，寻找和平了。"
 omen_ajitanatha:0 "阿吉塔那他"
 omen_ajitanatha_desc:0 "阿吉塔那他是二十四位尊者中的第二位，他在物质和精神领域都是强大的征服者；他的象征包括长矛、棍棒和大象——最庄严的动物，与皇家权威相关联——这些都是对他巨大力量的提醒。"
 omen_aparigraha:0 "不执着"
 omen_aparigraha_desc:0 "不执着是耆那教的一项重要誓言，我们应将该誓言的重要性传达给民众。这样，随着我们的人民愈加舍弃物质财富，我们就能够为我国的福祉征收到更多的税收。"
 omen_arghya:0 "阏伽仪式"
 omen_arghya_desc:0 "在阏伽仪式中，我们的信众为了摆脱重生循环的枷锁，呈上敬献。我们的人民将生活安定，因为他们知道他们将更接近涅槃，并远离轮回。"
 omen_bhadrabahu:0 "婆达罗巴忽的智慧"
 omen_bhadrabahu_desc:0 "婆达罗巴忽是通过渡津者间接接受耆那教教导的最后一位，他广博的学识改变了当时的耆那教。\n婆达罗巴忽从北方将数千追随者带到了闭利瞿砢，并在那里建立了大型学堂与寺庙。"
 omen_chakreshvari:0 "查克雷什瓦丽"
 omen_chakreshvari_desc:0 "查克雷什瓦丽，有时也被称为阿普拉提查克拉，是一位维迪亚德维，即教导她的信徒神圣戒律的女神。她有四只手臂，骑在神圣的迦楼罗之上，轻而易举地翱翔于一切创造之上，向所有愿意倾听的人传达希望的信息。"
 omen_chandraprabha:0 "旃陀罗巴罗波"
 omen_chandraprabha_desc:0 "当旃德拉普拉巴的母亲怀有未来的第八位提尔坦卡拉时，她被一种奇怪的愿望所困扰，尽管这种愿望不可能实现，但却无法消除；她渴望饮下月亮，数月后，当孩子出生时，他那明亮的外貌证实了他的非凡命运。"
 omen_diwali:0 "屠妖节"
 omen_diwali_desc:0 "这是一场盛大的光明庆节，它将鼓舞我们赶往战场的部队和士兵。虽然被加入战争和暴力并不高尚，但这是保护我们生活方式的必要的恶。"
 omen_mahavir_jayanti:0 "筏驮摩那的解脱"
 omen_mahavir_jayanti_desc:0 "筏驮摩那的智慧教导证明了看见真实的复杂性是很困难的，为了理解其中奥秘，就必须避免暴力与世俗享乐。\n筏驮摩那是第二十四位渡津者，与佛陀身处同一时代，后者也为耆那教所认可。据说他在末利尼城附近得到了解脱与救赎。"
 omen_naigamesha:0 "那伊伽梅沙"
 omen_naigamesha_desc:0 "拥有山羊头的儿童保护神那伊伽梅沙，能够赐予那些呼唤他名字的人以生育能力。据信他与战神卡提凯亚有关，这表明了这位神祇在保护他承诺庇护之人时所具有的强烈力量。那伊伽梅沙另一个受人喜爱的特点是他通常能够驱逐邪恶，这使得寻求他帮助的人们更加亲近他。"
 omen_neminatha:0 "尼弥那陀的解脱"
 omen_neminatha_desc:0 "这位奎师那的堂兄弟向我们证明了，即便是神明想要脱离死亡的轮回，也必须遵从耆那教的教导。\n尼弥那陀是第二十二位渡津者，据说他在耆辣捺山顶得到了解脱与救赎。"
 omen_padmaprabha:0 "帕德马普拉巴"
 omen_padmaprabha_desc:0 "帕德马普拉巴的名字唤起了他象征物的形象——那炽热的红色莲花。他曾出生于奢华之中，作为国王统治着一方，在接触到真理后从世间的虚幻快乐中得到解脱——这种解脱是所有人都能够达到的救赎。"
 omen_parshvanatha:0 "巴湿伐那陀的解脱"
 omen_parshvanatha_desc:0 "巴湿伐那陀教导我们克己是获得生活美好的必需，并应避免持财、偷窃和撒谎。\n巴湿伐那陀据说在折汉达的波罗那他山得到了解脱与救赎。"
 omen_paryushana:0 "斋节"
 omen_paryushana_desc:0 "我们将举行一场盛大的斋节，鼓舞我们的人民许下精进的誓言，这样我们全社会就能获得更高深的洞见与智慧。随着我们向新目标迈进，我们的国家和国民必能取得突破。"
 omen_pushpadanta:0 "普什帕丹塔"
 omen_pushpadanta_desc:0 "普什帕丹塔的到来是由十六个吉祥之梦预言的，因为他母亲在他婴儿时期特有的渴望而被亲切地称为“花牙”。他避开了财富和世界地位给他带来的精神危险，拒绝了肉体的欲望，拥抱了能使人从我们所束缚的轮回中解脱出来的神圣教义。"
 omen_rishabhanatha:0 "勒沙婆那陀的教导"
 omen_rishabhanatha_desc:0 "这位伟大的渡津者的指引继续帮助着我们的人民脱离无尽的轮回，鼓舞着人们遵从他明智的教导与圣律。\n勒沙婆那陀是第一位渡津者者，据说他在舍咄若耶山顶进行了第一讲道。"
 omen_rishabhanatha_moksha:0 "勒沙婆那陀的解脱"
 omen_rishabhanatha_moksha_desc:0 "勒沙婆那陀抛弃一切的榜样令人震惊，而这是旨在获得智慧与解脱，他的行为鼓舞了我们人民，让他们活在良善与和平中。\n勒沙婆那陀是第一位渡津者，据说他在冈仁波齐峰得到了解脱与救赎。"
 omen_roth_teej:0 "素饼节"
 omen_roth_teej_desc:0 "一场盛大的素饼节仪式将被举行，用以向我们的心中传达不执着的重要性。黄金将在不同的团体间流转，因为他们舍弃了物质观念的贪欲，更关注我们人民的福祉。"
 omen_sambhavanatha:0 "桑布哈瓦那他"
 omen_sambhavanatha_desc:0 "虽然我们现在处于阿瓦萨尔皮尼，也就是下降时代，在这个时代里人们的心灵充满了软弱和倾向于邪恶，但提尔坦卡拉，也就是教导神祇——如桑布哈瓦那他主——与我们同在，以帮助指引我们走向轮回的道路。"
 omen_satya:0 "诚实语"
 omen_satya_desc:0 "诚实语是耆那教的一项重要誓言，我们将保持诚实与真诚，因为我们招募我国的青年支援我们的战争。随着他们涌向我们的旗帜，我们将比以往拥有更多的潜在人力。"
 omen_shitalanatha:0 "西塔拉那他"
 omen_shitalanatha_desc:0 "辛，又称南纳，是月神。辛被认为是美索不达米亚万神殿中最强大的神祇之一，被认为掌控月亮的周期。有时，他被视为与沙玛什和恩利尔同等的地位。他的崇拜在古代美索不达米亚的天文学和占星术发展中发挥了重要作用。辛通常被描绘为一位长须老者，头戴新月形头饰。他常与智慧、丰饶和海潮相关联。其中最著名的神话之一是月神与日（星辰）女神的故事，讲述了辛试图追求伊什塔尔以及两位神祇最终和解的传说。"
 omen_sumatinatha:0 "苏玛提那他"
 omen_sumatinatha_desc:0 "苏玛提那他是二十四位提尔坦卡拉中的第五位，根据史诗《Trishashti Shalaka Purusha Charita》的描述，“他的脚趾甲是在众神冠冕的磨石上磨砺而成”。他拥有无与伦比的智慧，并且像那被他视为神圣的红鹅一样，忠诚、保护性强且坚持不懈。"
 omen_suparshvanatha:0 "苏帕什瓦那他"
 omen_suparshvanatha_desc:0 "虽然第七位提尔坦卡拉出生时，他的母亲患有麻风病，但在他出生前，她被治愈了这种致命的疾病。因此，他以“美丽侧面”的称号闻名，带着吉祥的预兆来到了这个世界——这是对他未来伟大成就的预示。"

 omen_ammon:0 "亚扪"
 omen_ammon_desc:0 "阿蒙是利比亚阿蒙尼翁绿洲的神祇。埃及人将他认同为他们最高的神祇阿蒙。\n\n阿蒙尼翁的阿蒙神谕是世界上最负盛名的神谕之一：正是这里的阿蒙祭司宣布亚历山大大帝是阿蒙之子，是合法的埃及法老。\n\n阿蒙的崇拜已经远远超出了利比亚沙漠，现在他的信徒遍布从希腊到黎凡特的广大区域。"
 omen_antaeus:0 "安泰俄斯"
 omen_antaeus_desc:0 "安泰俄斯，也被称为安提，是利比亚原住民崇拜的一位巨人神祇。\n\n根据希腊神话，只要安泰俄斯与大地保持接触，他就无敌于天下。最终，他被希腊英雄赫拉克勒斯举起离开地面并在空中将其击毙。\n\n安泰俄斯通常被视为利比亚人民的化身。他与赫拉克勒斯的战斗则象征着利比亚原住民与希腊殖民者的斗争。"
 omen_cyre:0 "库勒涅"
 omen_cyre_desc:0 "昔兰尼是传说中的屠狮女猎手，受到昔兰尼加本土利比亚人的敬奉。\n\n第一批希腊移民抵达昔兰尼加时，他们选择昔兰尼作为新城的保护者，并将她与另一位守护神阿波罗一同崇拜。"
 omen_lamia:0 "拉弥亚"
 omen_lamia_desc:0 "利比亚的蛇女神，被希腊人称为拉米亚。\n\n作为利比亚本土宗教中最重要的神祇之一，拉米亚掌管着沙漠中众多有毒的蛇和蝎子，保护她的追随者免受它们致命的咬伤。"
 omen_tritonis:0 "特里托尼斯"
 omen_tritonis_desc:0 "特里托尼斯是希腊人用来称呼统治特里托尼斯湖的神祇的名字，这是一个大型咸水湖，希腊人认为这里是女神雅典娜的诞生之地。\n\n特里托尼斯似乎是利比亚一位重要女神的母亲，这位女神可能是埃及女神尼特的起源，并且希腊人将她与雅典娜等同起来。"

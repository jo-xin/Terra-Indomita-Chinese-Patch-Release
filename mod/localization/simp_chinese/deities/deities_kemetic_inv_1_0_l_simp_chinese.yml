 omen_amesemi:0 "阿梅塞米"
 omen_amesemi_desc:0 "阿梅塞米是一位古代努比亚女神，她与分娩、生育以及保护相关联。阿梅塞米的崇拜与米恩神庙紧密相连，米恩是一位在阿赫米姆受到崇拜的重要生育之神。人们认为阿梅塞米被视为伊西斯女神的一种形式，伊西斯同样与分娩和生育有关联。人们相信这位女神拥有保护女性在分娩过程中的能力，并能确保婴儿健康成长。她也被认为是努比亚神阿佩德马克的配偶。"
 omen_anuket:0 "阿努凯特"
 omen_anuket_desc:0 "安努凯特是古埃及宗教中的一位女神，在尼罗河流域受到崇拜。她是尼罗河瀑布的女神，尤其与阿斯旺附近的急流相关联，并且与尼罗河每年的泛滥有关。安努凯特还被视为分娩的保护神以及给予生命之水的提供者。"
 omen_apedmak:0 "阿佩德马克"
 omen_apedmak_desc:0 "阿佩德马克是一位主要在古代努比亚受到崇拜的神祇。阿佩德马克主要被理解为战神。由此延伸，他也是征服与军事力量的神。在新王国时期，埃及神祇阿蒙被努比亚人接纳为主宰帝国的主要神祇。而在麦罗埃时期首次记载阿佩德马克之后，看起来阿蒙的重要性要么与阿佩德马克相当，要么被本土的阿佩德马克所超越。阿蒙与水及生育力（与尼罗河泛滥有关）的联系同样归属于阿佩德马克。他身穿皮革盔甲或胸甲，并手持弓箭，这些武器在整个努比亚历史上都与努比亚人紧密相关。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_apis:0 "阿庇斯"
 omen_apis_desc:0 "阿匹斯是古埃及宗教中极为重要的神祇，尤其与孟菲斯这座城市相关联。阿匹斯是一位公牛神，被视为是普塔赫神的化身。这头活生生的公牛通过特定的标记来辨认，其中包括额头上白色的三角形，这是哈托尔女神的象征。阿匹斯被认为是极其重要的生育和力量之神，并与王权及生命的更新密切相关。公牛被认为是传递神性力量的媒介，因此受到了极大的尊崇和敬重。当一头阿匹斯公牛去世后，它会被制成木乃伊并举行一场盛大的葬礼，仪式上会配备如同法老般的丧葬仪仗。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_arensuphis:0 "阿伦斯努菲斯"
 omen_arensuphis_desc:0 "阿伦斯努菲斯是古努比亚库施王国崇拜的神祇。他被描绘为人身公羊头，或直接以公羊形象出现。关于阿伦斯努菲斯的起源记载有限，但其很可能与生育力相关，并被奉为农业与丰收的守护神。他亦与来世信仰关联，有时出现在葬礼场景中。在麦罗埃，阿伦斯努菲斯尤为重要，其在该地与阿蒙、姆特、伊西斯等努比亚及埃及诸神同受崇拜。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_atum:0 "阿图姆"
 omen_atum_desc:0 "阿图姆有时被称为阿特姆或特姆，是埃及神话中极为重要的神祇，扮演着创造万物的始祖和终结者的角色。\n\n阿图姆是一位自我创造的神祇，是从创世之前的黑暗和无尽的混沌水域中第一个出现的存在。他是从混沌中包含的能量和物质中产生的，由于感到孤独，他创造了最初的神祇——他的孩子们。据说，他通过打喷嚏或在一些版本中是通过精液产生了舒，空气之神，和泰芙努特，湿润之女神。\n\n这对兄妹出于对原始水域的好奇，去探索周围的黑暗水域，随后消失不见。无法忍受失去他们的痛苦，阿图姆派遣了烈焰使者——拉的眼睛，去寻找他的孩子们。当他们返回时，阿图姆流出的喜悦之泪变成了第一批人类。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_bastet:0 "芭丝特"
 omen_bastet_desc:0 "巴斯特（Bastet），有时也简称为巴斯特（Bast），是古埃及的保护女神，猫、香水/油膏、生育、怀孕、儿童、音乐、艺术和战争之神。她的崇拜可以追溯到第二王朝（公元前2890年）。\n\n作为太阳神拉和伊西斯的女儿，巴斯特最初在下埃及的布巴斯提斯受到崇拜，并且最初是以狮子的形象出现，这一角色她与其他女神如塞赫美特共享。\n\n最终，巴斯特和塞赫美特被描绘为姐妹或是同一女神的不同方面，其中塞赫美特代表着强大的战士和保护者的形象，而巴斯特则越来越多地以猫的形象出现，象征着更为温和的一面。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"
 omen_geb:0 "盖布"
 omen_geb_desc:0 "盖布是古埃及神话中的大地之神，也是赫利奥波利斯大九柱神的一员。他有时也被认为是蛇的父亲。在古埃及人的信仰中，盖布的笑声能够引发地震，并且是他让农作物得以生长。\n\n盖布是天空女神努特的配偶，以及空气神舒和水分女神泰芙努特的儿子。他是奥西里斯、伊西斯、塞特、奈芙提斯以及霍鲁斯的父亲。由于他在神话中的角色与希腊神话中的克洛诺斯相似，因此两者经常被等同起来。"
 omen_hapi:0 "哈碧"
 omen_hapi_desc:0 "哈皮是古埃及宗教中尼罗河每年泛滥的神祇。这种泛滥会沉积富含营养的淤泥（肥沃的土壤）在河流两岸，使得埃及人能够种植作物。哈皮在埃及人中受到极大的崇拜。哈皮的一些称号包括“沼泽中的鱼和鸟之主”和“带来植被的河流之主”。\n\n哈皮通常被描绘成一个具有男性和女性特征的形象，拥有大肚子和下垂的乳房，穿着缠腰布，并佩戴着仪式性的假胡须。这些特征象征着哈皮的丰饶能力，因为哈皮不仅带来了肥沃的土壤，也带来了生命的繁荣和富足。在古埃及艺术中，哈皮的形象经常出现，用来庆祝尼罗河泛滥带来的丰收和生命之源。"
 omen_heka:0 "赫卡"
 omen_heka_desc:0 "赫卡是古埃及的魔法之神，常被描绘为一个戴着大型王冠、额头上有一条眼镜蛇的人。赫卡被认为是埃及众神中最古老和最强大的神祇之一，与世界的创造及掌控自然力量的能力相关联。赫卡通常被描绘为手持安赫（象征生命的符号）或代表其权力的权杖的人形。"
 omen_heqet:0 "海奎特"
 omen_heqet_desc:0 "赫凯特是古埃及宗教中的生育、分娩和再生女神。她通常被描绘成青蛙的形象，这与尼罗河及其赋予生命的特性有关。赫凯特被认为在妇女分娩时给予帮助，并且与重生和再生的过程有关联。在一些神话中，据说她参与了世界的创造，被视为一种强大的创造力量。赫凯特经常被描绘为青蛙头的形象，有时手持莲花或莎草纸，有时候会与神祇克努姆一同出现，克努姆被认为是用陶工的轮子塑造人类形象的神。\n\n#!神化效果：$culture_apotheosis_civic_tech_effect_tt_description$"
 omen_heryshaf:0 "赫利舍夫"
 omen_heryshef_desc:0 "赫里沙夫，伟大的亨内内苏特之神。这位河岸的统治者是一位创造和生育之神，直接来自于原始水域努恩。他是埃及神系中最古老的神祇之一，然而到了这个时候，他的城市和他的别名“湖上的那位”开始被希腊神系中的赫拉克勒斯所取代。亨内内苏特变成了赫拉克利奥波利斯，而赫里沙夫变成了赫拉克勒斯。曾经亨内内苏特和赫里沙夫站在第二十州的埃及王朝之巅的日子已经远去。他被描绘为一只公羊或是一个有着公羊头的人形。\n\n你找到了整个游戏中最冷门的神祇。感谢你对这个游戏中的神祇的关注~Izn"
 omen_khonsu:0 "孔苏"
 omen_khonsu_desc:0 "孔苏是古埃及的月神。他的名字意为“旅行者”，这可能与月亮在夜空中看似穿越的运动有关。孔苏与托特一同标记时间的流逝。孔苏在所有生物新生命的创造中起着重要作用。在底比斯，他与母亲穆特和父亲阿蒙组成了家庭三联神（底比斯三联神）。\n\n在艺术作品中，孔苏通常被描绘成一个戴着儿童标志的侧边发辫的木乃伊形象，同时佩戴着带有曲杖和连枷的门纳特项链。他与其它神圣的孩子如霍鲁斯和舒有着密切的联系。有时孔苏也会被描绘成拥有鹰或猎鹰的头部，类似于与他相关的保护者和治愈者霍鲁斯的形象，并装饰有太阳圆盘和弯月。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_maat:0 "玛阿特"
 omen_maat_desc:0 "玛特是指古埃及的概念，包括真理、平衡、秩序、和谐、法律、道德和正义。玛特也是代表这些概念的女神，并且掌管星辰、季节，以及规范凡人与神祇的行为，确保宇宙从混沌中诞生后的秩序得以维持。她的对立面是伊斯法特，意味着不公、混乱、暴力或作恶。\n\n在参与了创世并持续防止宇宙回归混沌之后，玛特在古埃及宗教中的主要角色与死后世界中的“心脏称量”仪式有关。她的一根羽毛是衡量死者灵魂是否能够成功进入来世乐园的标准，因为在古埃及人的信仰中，灵魂被认为是居住在心脏之中。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_mandulis:0 "曼杜利斯"
 omen_mandulis_desc:0 "曼杜利斯（Mandulis，也拼写为 Mandoulis 或 Mandolaus）是一位与太阳、光明以及王权力量相关的努比亚太阳神。他经常被描绘成戴着顶部带有太阳圆盘的王冠或头饰的人类形象。有时人们会将曼杜利斯与埃及的霍鲁斯神进行比较。曼杜利斯与麦罗埃的王室关系密切，据信努比亚的国王们视自己为他在人间的代表。此外，曼杜利斯还与生育有关，并被认为拥有确保农作物生长和国家繁荣的能力。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_meretseger:0 "梅雷塞格尔"
 omen_meretseger_desc:0 "梅雷塞格尔是在古埃及被崇拜的一位女神，主要受到底比斯地区人们的敬仰。她的名字意为“喜爱寂静者”或“喜爱和平者”。梅雷塞格尔主要与底比斯墓地中的神圣山脉有关，这座山被称为“西方之峰”和“西方之山”。梅雷塞格尔通常被描绘成一条眼镜蛇，或者是一位有着眼镜蛇头部的女性形象，她经常戴着带有哈托尔的太阳圆盘和牛角的头饰。她被认为是底比斯墓地中皇家陵墓的保护者，同时也与正义、惩罚及来世相关联。\n\n#!神化效果：$economy_apotheosis_capital_noble_effect_tt_description$"
 omen_min:0 "敏"
 omen_min_desc:0 "米恩是古埃及的一位生育之神，常常被描绘为一位拥有勃起生殖器的男人，并戴着羽毛制成的王冠。他与收获和作物生长有关，同时也与男性的性能力相关。米恩还是一位沙漠之神，被认为有能力保护旅人免受伤害。他经常被描绘为手持一把连枷，这是他掌控土地和作物的象征。米恩在整个古埃及都被崇拜，但他的主要崇拜中心位于上埃及的阿赫米姆城，那里他被称为“阿赫米姆的米恩”。每年为他举行的节日被称为“生殖器节”，庆典活动热闹非凡，充满了欢乐气氛。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_mut:0 "姆特"
 omen_mut_desc:0 "穆特，也称为马特或穆特，在古埃及被崇拜为一位母亲女神。她的名字在古埃及语中的字面意思就是“母亲”。穆特有许多不同的面貌和属性，在古埃及文化数千年的发展过程中发生了很大的变化。\n\n穆特被视为原始的神祇，与孕育世界万物的原始水域努相关联。有时说穆特通过孤雌生殖创造了世界，但更多时候她被认为有一位丈夫，即太阳创造之神阿蒙-拉。尽管信徒们认为穆特是世间万物的母亲，但她特别与月亮之子孔苏神作为母亲的身份有关。在埃及首都底比斯的卡尔纳克神庙中，阿蒙-拉、穆特和孔苏这一家三口一起被崇拜为底比斯三联神。\n\n在艺术作品中，穆特通常被描绘成戴着埃及国王双冠的女人形象，这象征着她对整个国土的统治权。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_nefertem:0 "奈弗特姆"
 omen_nefertem_desc:0 "意为\"不闭合者\"或\"美丽的闭合者\"，奈弗特姆是一位较鲜为人知的睡莲之神，有时也与狮子相关。莲花在埃及神话中是一个重要象征，代表尼罗河的起源。奈弗特姆代表从那朵睡莲中射出的第一缕阳光。\n\n奈弗特姆常常被他远为著名的父母——卜塔和塞赫迈特的光芒所掩盖。尽管如此，普通民众仍以雕像崇拜他。他甚至在图坦卡蒙国王的墓中有所提及——图坦卡蒙王的头从睡莲中探出进入阳光，清晰地代表了奈弗特姆。"
 omen_neith:0 "涅伊特"
 omen_neith_desc:0 "尼特是一位早期的古埃及女神，在某些神话中被视为最初的创造者，她创造了宇宙及其所有事物，并掌管着宇宙的运作。尼特女神拥有多种属性，她是宇宙、命运、智慧、水、河流、母亲、分娩、狩猎、纺织和战争的女神。\n\n在一些古埃及创世神话中，尼特被认定为太阳神拉和混沌之蛇阿佩普的母亲。当她作为水神出现时，则被认为是鳄鱼神索贝克的母亲。这种与水的关联，尤其是与尼罗河的关系，使她在与其他神祇配对时有时被视为与河神赫努姆的妻子，有时则与尼罗河源头相关联。\n\n在她的崇拜中心，尼特还与尼罗河鲈鱼有关，并且是三位一体女神的一部分。这表明尼特在古埃及宗教中扮演了极其多面的角色，并且在不同的地区和时期有着不同的崇拜方式。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_nephthys:0 "奈芙蒂斯"
 omen_nephthys_desc:0 "在古埃及神话中，奈芙提斯是赫利奥波利斯大九柱神的一员。她是天空之神努特和大地之神盖布的女儿，赛特的妻子，以及阿努比斯的母亲。奈芙提斯通常与她的姐姐伊西斯一起出现在丧葬仪式中，因为她们担任着保护木乃伊和奥西里斯神的角色，同时也是赛特的妹妹兼妻子。\n\n奈芙提斯与哀悼、夜晚/黑暗、服务（特别是庙宇）、分娩、死者、保护、魔法、健康、防腐和啤酒等方面有关。"
 omen_nut:0 "努特"
 omen_nut_desc:0 "努特是古埃及宗教中的天空、星辰、宇宙、母亲、天文学和宇宙的女神。她常被描绘成一个布满星星的裸体女性，弓身覆盖着大地，或者是一头母牛的形象。她的标志是一个水壶符号。\n\n努特是舒和特夫努特的女儿，而她的兄弟兼丈夫是盖布。她有四个孩子——奥西里斯、塞特、伊西斯和奈芙提斯，在希腊-埃及版本的努特与盖布的神话中还加上了霍鲁斯。她是埃及万神殿中最古老的神祇之一，其起源可以在赫利奥波利斯的创世故事中找到。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_qetesh:0 "奎特什"
 omen_qetesh_desc:0 "奎特什是一位受到古迦南人影响的女神，这些古迦南人在青铜时代迁移到埃及。尽管她受到了迦南文化的影响，但她主要被视为一位源自迦南观念的埃及女神，并被认为是巴力的配偶女神。她在黎凡特和叙利亚以及尼罗河三角洲地区广受崇拜。她通常与爱情、生育、美丽、性和享乐相关联。有时她也与战争和狩猎有所关联。奎特什被描绘成一个年轻美丽的女子，穿着长而飘逸的裙子，并戴着有两个羽毛的头饰。在一些描绘中，她被展示为骑在狮子背上或站在蛇上的形象。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_resheph:0 "雷舍夫"
 omen_resheph_desc:0 "人们从全国各地聚集到雷舍夫的降福下。有了这些新兵源涌向我们的旗帜，我们必能赢得更多战争，因为征伐敌人时将永不缺乏兵力。\n\n虽然雷舍夫最早来自迦南地区，他已彻底为我们自己的信仰所接受。曾经与瘟疫和疾病有关的神，现已成为战车与战马的守护神。"
 omen_satis:0 "萨提斯"
 omen_satis_desc:0 "萨提斯是古埃及宗教中的女神，她代表尼罗河、生育和战争。作为尼罗河泛滥的人格化，萨提斯带来了水源和土地的肥沃。作为战争女神，她常常被描绘为手持弓箭，并佩戴下埃及的红色王冠。萨提斯还与哈托尔女神有关联，在某些故事中哈托尔被描绘为她的女儿。她们两人被认为共同负责尼罗河的年度泛滥以及土地的肥沃。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"
 omen_sebiumeker:0 "萨博马卡尔"
 omen_sebiumeker_desc:0 "塞比乌梅克尔是努比亚的一位神祇，他的名字意为“使卡感到快乐的人”。在古埃及和努比亚文化中，“卡”是指个人的生命力量或精神本质。在一些描绘中，塞比乌梅克尔被表现为坐着的狒狒并手持权杖；而在其他描绘中，他则被表现为站立的人形，头戴羽饰王冠并且手持牧杖和鞭子，这些都是王权和农业丰饶的象征。"
 omen_seshat:0 "塞夏特"
 omen_seshat_desc:0 "塞夏特是古埃及的智慧、知识与书写的女神。她经常被描绘身穿豹皮长袍，并头戴一颗星与弓箭组成的头饰，象征着她作为书写与记录女神的角色。人们相信塞夏特负责记录法老及其他重要人物的成就，并且与寺庙和其他宏伟建筑的建造密切相关。她也被认为是数学、天文学与建筑学的女神，并与时间的测量以及历法的编制有关。塞夏特有时被描绘为与同样与书写和知识相关的神祇托特的配偶。她也与法老紧密关联，被认为是他或她的个人书记与记录者。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_set:0 "赛特"
 omen_set_desc:0 "赛特是古埃及宗教中的沙漠、风暴、混乱、暴力以及外来者的神祇。他是奈芙提斯的丈夫和兄弟，同时也是大地之神盖布和天空之女神努特的儿子。赛特也有积极的一面，在神话中他陪伴太阳神拉乘坐太阳船，击退混沌之蛇阿佩普。作为一位调和了冲突的角色，赛特是红色土地（即沙漠）的主宰，与霍鲁斯作为黑色土地（肥沃的尼罗河河谷）的主宰形成平衡。\n\n在最重要的埃及神话之一——奥西里斯神话中，赛特被描绘为篡位者，他杀害并肢解了自己的兄弟奥西里斯。奥西里斯的妻子伊西斯，在奈芙提斯的帮助下重新拼凑起奥西里斯的尸体，并成功地使她的丈夫复活了一段时间。\n\n这段复活的时间足够长，让伊西斯怀上了奥西里斯的儿子和继承人霍鲁斯。为了替父报仇，霍鲁斯向赛特挑战，许多古埃及的神话故事都讲述了他们之间的争斗。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"
 omen_shu:0 "舒"
 omen_shu_desc:0 "舒是古埃及神话中的原始神祇之一，他是泰芙努特的配偶和兄弟，同时也是赫利奥波利斯宇宙论中九柱神的一员。舒是和平、狮子、空气与风之神。\n\n在赫利奥波利斯的神学体系中，阿图姆创造了九柱神中的第一对神祇——舒和泰芙努特。他们接着生下了天空之神努特和大地之神盖布，并成为奥西里斯、伊西斯、赛特和奈芙提斯的祖父母。舒的曾孙则是荷鲁斯和阿努比斯。"
 omen_sobek:0 "索贝克"
 omen_sobek_desc:0 "索贝克是一位古埃及神祇，与尼罗河鳄鱼、生育能力、法老的力量以及军事威力相关联。他经常被描绘成一个拥有鳄鱼头的人形或者完全是一只鳄鱼的形象。作为一种强大而可怕的动物，鳄鱼被视为索贝克力量和凶猛的象征，同时也代表了尼罗河的肥沃和生命给予的品质。\n\n根据神话传说，在最初的时候，尼罗河只是一条流经沙漠的小溪。有一天，索贝克出现在沿河居住的人们面前，并提出要帮助他们。他利用自己的巨大力量在河床中挖掘了一条深深的水道，使得尼罗河可以自由流动，并为人们的庄稼提供水源。为了感谢他的帮助，埃及人民开始崇拜索贝克为一位能够控制尼罗河水的强大力量之神。随着时间的推移，索贝克成为了广受欢迎的一位神祇，许多寺庙都建造起来以供奉他。人们相信索贝克能够保护他们免受尼罗河的危险，并给他们带来好运和繁荣。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_tefnut:0 "泰芙努特"
 omen_tefnut_desc:0 "泰芙努特是古埃及宗教中的水分、湿润空气、露水和雨水之神。她是空气之神舒的姐妹和配偶，也是大地之神盖布和天空之神努特的母亲，同时也是阿图姆的女儿。\n\n泰芙努特是一位具有狮子特征的神祇，在作为赫利奥波利斯大九柱神的一部分时，她通常被描绘成拥有一颗狮子头的人类形象。另一种常见的描绘方式是将她画成一只雌狮，不过泰芙努特也可以被描绘成完全的人类形象。在她完全或半人形的形象中，她被描绘成戴着假发，并且头顶上要么有一条眼镜蛇，要么是一个眼镜蛇和太阳圆盘的组合，有时她也被描绘成一头狮子头的蛇。\n\n#!神化效果：$military_apotheosis_capital_freemen_effect_tt_description$"
 omen_thoth:0 "托特"
 omen_thoth_desc:0 "托特是古埃及的智慧、书写、象形文字、科学、魔法、艺术、审判和亡灵之神。在艺术作品中，他通常被描绘成一个人身而头为鹮鸟或狒狒的形象，这两种动物都被视为他的圣物。他的女性对应神祇是塞莎特，而他的妻子是玛阿特。\n\n根据古埃及神话，托特被认为是创造365天历法的人。按照传说，最初一年只有360天长，而在这段时间内努特是不育的，无法生育子女。托特与月亮赌博，赢得了月亮光亮的1/72（即5天），使得一年增加了5天。在这额外的5天里，努特和盖布生下了奥西里斯、赛特、伊西斯和奈芙提斯。\n\n在核心的奥西里斯神话中，托特给予了伊西斯言语之力，让她能够恢复丈夫的生命，从而使他们能够孕育出荷鲁斯。在荷鲁斯与赛特之间的战斗之后，托特提供了指导和智慧。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_wadjet:0 "瓦吉特"
 omen_wadjet_desc:0 "女神瓦杰特在古埃及被崇拜为北方的化身，同时也是下埃及的守护神和保护者。在与上埃及统一之后，她成为了整个埃及的共同保护神和守护者。瓦杰特通常被描绘成一条直立的毒蛇，尤其被视为保护法老，随时准备攻击并杀死其敌人，同时她也是分娩妇女的保护者，据传说她曾哺育过幼年的荷鲁斯神。\n\n瓦杰特经常被描绘成一条有着女性头部的毒蛇、带翼的毒蛇、狮首人身的女性，或是戴着下埃及红色王冠的女性形象。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"
 omen_wepwawet:0 "乌普奥特"
 omen_wepwawet_desc:0 "韦普瓦维特是古埃及的一位豺狼神，与战争、狩猎及死者相关联。他通常被描绘成豺狼或是有着豺狼头颅的人形，头顶上装饰有羽毛王冠或是太阳圆盘。韦普瓦维特被视为法老及其军队的向导和保护者，常被描绘为引领他们战斗或是充当侦察的角色。他还与通往来世的道路开启相关，有时被称为“道路的开启者”。韦普瓦维特在上埃及的城市阿斯尤特尤为重要，在那里他被奉为守护神。他的崇拜遍及整个埃及，并且常常与其他神祇如安努比斯和荷鲁斯融合在一起。\n\n#!神化效果：$fertility_apotheosis_capital_slaves_effect_tt_description$"

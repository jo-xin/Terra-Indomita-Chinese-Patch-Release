 omen_buul:0 "布乌尔·纳特"
 omen_buul_desc:0 "布乌尔·纳特沉醉之纳特。布乌尔·纳特进入饮酒之人。愿布乌尔·纳特善待我们赐予美好时光。"
 omen_chuu:0 "楚乌·灵"
 omen_chuu_desc:0 "楚乌纳特是树木之灵。树木供我们建造居所与工具，也充盈着我们的森林和丛林。愿楚乌纳特赐予我们力量。"
 omen_desert_hills_nat:0 "班纳品图尔·灵"
 omen_desert_hills_nat_desc:0 "我们的首都周围环绕着沙漠丘陵之纳特，愿班纳品图尔·纳特保佑我们的城市。"
 omen_desert_nat:0 "品图尔·灵"
 omen_desert_nat_desc:0 "我们的首都周围环绕着沙漠之纳特，愿品图尔·纳特保佑我们的城市。"
 omen_doon:0 "多翁·纳特"
 omen_doon_desc:0 "国家本身的纳特愿多翁·纳特引领我们进入伟大的黄金时代。愿多翁·纳特祝福我们的家园、家人和人民。"
 omen_farmland_nat:0 "普考·灵"
 omen_farmland_nat_desc:0 "我们的首都周围环绕着农田之纳特，愿普考·纳特保佑我们的城市。"
 omen_flood_plain_nat:0 "迪因·灵"
 omen_flood_plain_nat_desc:0 "我们的首都周围环绕着泛滥平原之纳特，愿迪因·纳特保佑我们的城市。"
 omen_forest_nat:0 "奇科奥·灵"
 omen_forest_nat_desc:0 "我们的首都周围环绕着森林之纳特，愿奇科奥·纳特保佑我们的城市。"
 omen_gerger:0 "格尔-格尔·灵"
 omen_gerger_desc:0 "格尔-格尔·灵，雷霆的灵。一道光芒伴随着强大的格尔-格尔之声。愿格尔-格尔·灵咆哮，令我们的敌人颤抖。"
 omen_hills_nat:0 "班纳·灵"
 omen_hills_nat_desc:0 "我们的首都周围环绕着丘陵之纳特，愿班纳·纳特保佑我们的城市。"
 omen_irrawaddy:0 "伊洛瓦底·灵"
 omen_irrawaddy_desc:0 "伊洛瓦底·灵，伟大的伊洛瓦底河的灵。伊洛瓦底河非常强大，它是该地区最大的河流，为山谷带来了灵性和生命。"
 omen_jungle_nat:0 "塔姆·灵"
 omen_jungle_nat_desc:0 "我们的首都周围环绕着丛林之纳特，愿塔姆·纳特保佑我们的城市。"
 omen_kingdom_nat:0 "尼凯姆·灵"
 omen_kingdom_nat_desc:0 "尼凯姆·纳特是王国与帝国之纳特，守护边境并渴求战争，如今已向人民显现。"
 omen_kndook:0 "肯多奥克·纳特"
 omen_kndook_desc:0 "肯多奥克·纳特是我们已故祖先和家人的纳特。通过肯多奥克·纳特愿我们仍能蒙受先辈智慧的祝福。"
 omen_kroon:0 "克罗恩·灵"
 omen_kroon_desc:0 "克罗恩·灵，河流的灵。河流维持生命，赋予所有生物灵的本质。愿克罗恩·灵给予我们的动物、庄稼和自身生命必需的成分——水。"
 omen_kujii:0 "库吉伊·灵"
 omen_kujii_desc:0 "库吉伊·灵，乌帕斯树的灵。乌帕斯树非常危险。没有人能爬到树顶而不倒毙。愿库吉伊·灵保护我们免受敌人的侵害。"
 omen_kuntuu:0 "孔图乌·灵"
 omen_kuntuu_desc:0 "孔图乌·灵，月亮的灵。夜空中伟大的光芒，不断变化却又始终如一，让我们能够追踪时间。愿孔图乌·灵指引我们。"
 omen_mahagiri:0 "明马哈基里"
 omen_mahagiri_desc:0 "最高位的灵明马哈基里的灵。在他的一生中，他所到之处皆被称为穆昂·廷德伊。据说他非常强壮，能够折断大象的象牙。虽然他的故事在几百年后有了更多的细节，但最初的明马哈基里的灵形态可能更为简单，只是一个力大无比的人物。他后来成为了37位灵的共同领袖之一，但在这一时期，他仅仅是37位灵崇拜的一部分。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。"
 omen_marsh_nat:0 "克索克·灵"
 omen_marsh_nat_desc:0 "我们的首都周围环绕着沼泽之纳特，愿克索克·纳特保佑我们的城市。"
 omen_maungtintdei:0 "穆昂·廷德伊"
 omen_maungtintdei_desc:0 "穆昂·廷德伊是明马哈基里的原始形态。他被认为非常强壮，以至于当地的国王觉得他是一个威胁。国王娶了他的妹妹施韦梅思娜，并邀请穆昂·廷德伊来到宫廷。在那里，他遭到背叛并在水中溺亡。他的妹妹也因心碎于哥哥的背叛和死亡而随之而去。穆昂·廷德伊重生为明马哈基里灵。这个故事的细节很可能是后来随着37位灵的崇拜逐渐转变为神殿的过程中形成的。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。"
 omen_minshinmyaukphyu:0 "谬克敏·施韦普约"
 omen_minshinmyaukphyu_desc:0 "谬克敏·施韦普约是施韦纳拜和穆昂·廷德伊的两个儿子之一。像他的父亲一样，谬克敏·施韦普约和他的弟弟都非常强壮。这引起了地方统治者的恐惧，于是他设下计谋让两兄弟互相争斗。这场战斗导致先是谬克敏·施韦普约死亡，随后哥哥也死去。这个故事的细节很可能是后来随着37位灵的崇拜逐渐转变为神祇体系的过程中形成的。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是'灵'(Nats)。"
 omen_mountain_nat:0 "特雷·灵"
 omen_mountain_nat_desc:0 "我们的首都周围环绕着山脉之纳特，愿特雷·纳特保佑我们的城市。"
 omen_oasis_nat:0 "赫孔·灵"
 omen_oasis_nat_desc:0 "我们的首都周围环绕着绿洲之纳特，愿赫孔·纳特保佑我们的城市。"
 omen_plains_nat:0 "昆科克·灵"
 omen_plains_nat_desc:0 "我们的首都周围环绕着平原之纳特，愿昆科克·纳特保佑我们的城市。"
 omen_puur:0 "普乌尔·灵"
 omen_puur_desc:0 "普乌尔·灵，鸽子的灵。优雅而美丽的鸽子在我们头顶上空翩翩飞翔。愿我们得到普乌尔·灵的祝福，使我们在生活中也能优雅地飞翔。"
 omen_shwemhtwehla:0 "施韦涅特韦赫拉·托内潘拉"
 omen_shwemhtwehla_desc:0 "施韦涅特韦赫拉·托内潘拉是穆昂·廷德伊的妹妹。在她的哥哥和姐姐去世后，她和家人逃到了若开王国的国王那里。在那里，施韦涅特韦赫拉被皇室收养，并嫁给了另一位国王。她最终因高烧而去世，此后被尊崇为灵。这个故事的细节很可能是后来随着37位灵的崇拜逐渐转变为神殿的过程中形成的。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。"
 omen_shwemyethna:0 "施韦梅思娜"
 omen_shwemyethna_desc:0 "金色公主施韦梅思娜的灵，她同时也是明马哈基里的妹妹，在后来形成的37位灵的神殿中与她的哥哥共同担任领袖。然而，在这一时期，她很可能仅仅是被尊崇的一位皇家女性的灵。目前，她与她的哥哥一同属于37位灵的崇拜。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_shwenabay:0 "施韦纳拜"
 omen_shwenabay_desc:0 "水龙的女儿施韦纳拜是施韦梅思娜的妹妹王后，也是穆昂·廷德伊的配偶。她因误以为明马哈基里已死而心脏病发作身亡。这个故事的细节很可能是后来随着37位灵的崇拜逐渐转变为神殿的过程中形成的。施韦纳拜最初很可能是一位河流或水域的灵，也许还混合了一位祖先灵的元素。在这个时间点上，她仅仅是一位灵，并不是女神。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。"
 omen_sloon:0 "斯洛昂·灵"
 omen_sloon_desc:0 "斯洛昂·纳特，是属于那些如山岳般挺立之人的纳特。愿我们抵达苍穹与群峰，并蒙受斯洛昂·纳特恩泽。"
 omen_steppe_nat:0 "草原之纳特（K'seh Nat）"
 omen_steppe_nat_desc:0 "我们的都城为草原之纳特所环绕，愿克塞·纳特（K'seh Nat）护佑我们的城池。"
 omen_thar:0 "塔尔·灵"
 omen_thar_desc:0 "塔尔·纳特是黄金之纳特。黄金使我们的社会富足，也让我们能够创造美物与珠宝。愿我们获得丰厚的塔尔·纳特恩赐。"
 omen_thirty_seven:0 "皮伊切瓦兹·腾帕·灵"
 omen_thirty_seven_desc:0 "皮伊切瓦兹·腾帕·灵大致意思是「三十七位灵的崇拜」。三十七位灵的崇拜是一种前神殿式的宗教崇拜，由骠族迁徙带来，但也被南部的孟族所信奉。这种崇拜最终会发展成为一个正式的神殿，被称为「37位灵的神殿」，但这直到公元8世纪才会发生。目前，三十七位灵的崇拜处于多神论和泛灵信仰之间的中间状态。"
 omen_tii:0 "蒂伊·灵"
 omen_tii_desc:0 "蒂伊·灵，我们脚下土壤的灵。土壤赋予我们的植物生命和灵的本质。愿蒂伊·灵让我们的庄稼茁壮成长并富有生机。"
 omen_triaa:0 "所有权之纳特（Tria'a Nat）"
 omen_triaa_desc:0 "所有权之纳特，特里亚·纳特（Tria'a Nat）愿我族人民守法公正。愿我们能承蒙特里亚·纳特的中央统御之恩。"
 omen_tuangmagyishinnyo:0 "唐马吉·施韦约"
 omen_tuangmagyishinnyo_desc:0 "唐马吉·施韦约是施韦纳拜和穆昂·廷德伊的两个儿子之一。像他的父亲一样，唐马吉·施韦约和他的弟弟都非常强壮。这引起了地方统治者的恐惧，于是他设下计谋让两兄弟互相争斗。这场战斗导致先是弟弟死亡，随后唐马吉·施韦约也死去。这个故事的细节很可能是后来随着37位灵的崇拜逐渐转变为神殿的过程中形成的。需要注意的是，这些人物当时还不是神祇，而是被认为更像是灵，也就是“灵”(Nats)。"

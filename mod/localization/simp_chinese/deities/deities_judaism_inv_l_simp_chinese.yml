 omen_aaron:0 "亚伦"
 omen_aaron_desc:0 "正如亚伦担任首位大祭司，并成为其兄弟——先知摩西的发言人一样，我们也将支持祭司向信徒宣教。"
 omen_abdel:0 "阿巴岱"
 omen_abdel_desc:0 "正如大祭司阿巴岱说服了居鲁士允许我们从亚述流放中返回，并重新夺回我们的土地一样，我们将把那些分散在外的族人聚集回来。"
 omen_abishua:0 "阿比舒"
 omen_abishua_desc:0 "正如大祭司“阿比舒”，亚伦的曾孙据说在进入圣地时记录下了摩西的经书，我们也应当投资于宗教学习和经文研究。"
 omen_adam:0 "亚当"
 omen_adam_desc:0 "正如亚当，作为第一个人类，被授予了对所有自然界的统治权，并孕育了全人类，我们将记住并庆祝这种管理权以及在社会各个层面所体现的统治权。"
 omen_caleb_joshua:0 "迦勒"
 omen_caleb_joshua_desc:0 "正如迦勒与约书亚一度看到了机会而他们的同伴只能看到仇恨，我们的人民需要在他人无力之处找寻解决之道。因为只要我们有上主在我们这边，并遵从他的圣言，我们必能获胜。"
 omen_elijah:0 "以利亚"
 omen_elijah_desc:0 "以利亚挑战巴力的先知，在偶像崇拜者之上证明了我们的信仰，他使死去的寡妇之子复活，乘坐燃烧的马车升天，我们也应挑战偶像崇拜者的神祇。"
 omen_enoch:0 "汉诺克"
 omen_enoch_desc:0 "汉诺克被希腊人记载为以诺，他正直地生活，并与神同行，最终被身体带入天堂见到了神的面。我们将打击腐败，并研读他的启示录。"
 omen_eve:0 "夏娃"
 omen_eve_desc:0 "正如夏娃孕育了全人类，遵照主的命令繁衍后代，我们的人民也将在生活的各个方面繁荣昌盛。"
 omen_isaiah:0 "耶沙亚"
 omen_isaiah_desc:0 "耶沙亚（希腊语中称为以赛亚）赋予我们成为主的祭司和我们神之仆人的国度的任务，这样我们就可以享受各国的财富，并沉浸在它们的丰富之中。通过彰显我们的公义，我们将看到贸易为我们国家带来更大的财富。"
 omen_jacob:0 "雅各布"
 omen_jacob_desc:0 "雅各，在与主的天使角力后又被称为以色列，他孕育了以色列人民和十二支派的领袖。我们也将鼓励人口的增长。"
 omen_jeremiah:0 "耶利米"
 omen_jeremiah_desc:0 "耶利米（或称为耶尔米雅胡），那位哭泣的先知，在迫害面前教导正义和主的话语，并对抗假先知，我们也应当坚守我们的信仰。"
 omen_job:0 "约伯"
 omen_job_desc:0 "正如义约布（或称为约伯）在遭受极大苦难时坚持一切正义之道，且所有与他这位富人交易的人都得到了祝福，我们应当确保正义得以伸张。"
 omen_joshua:0 "约书亚"
 omen_joshua_desc:0 "若苏厄，更广为人知的名字为约书亚（Joshua），他领导了对应许之地的入侵，并摧毁了迦南人的城市。像他一样，我们不应害怕跨越任何边界去夺取本应属于我们的土地。"
 omen_manasseh:0 "玛拿西"
 omen_manasseh_desc:0 "玛拿西大祭司与玛拿西支派的族长同名，这个支派坚守着摩西所传下的真律法。玛拿西大祭司在神圣的基利心山上建造了圣所，同样地，我们也将在新的地方建造会堂和纪念碑。"
 omen_miriam:0 "米利暗"
 omen_miriam_desc:0 "米利暗，也被称为玛利亚 ，是亚伦和先知摩西的姐姐。正如米利暗的功德为我们人民在沙漠中带来了一口井以维持生计，并在我们从法老军队手中得救、穿过芦苇海之后带领人民赞美主，我们也将引领我们的人民进行盛大的庆祝活动。"
 omen_nehemiah:0 "尼希米"
 omen_nehemiah_desc:0 "正如尼希米亚从波斯宫廷返回耶路撒冷重建城墙一样，我们也应当翻新公共空间，并加强我们的防御。"
 omen_noah:0 "诺赫"
 omen_noah_desc:0 "诺赫，希腊人称他为诺亚，作为罪恶地球上唯一正直的人，他建造了方舟，使他的儿子们能够在洪水过后重新繁衍人类。同样地，我们也应当转向海洋。"
 omen_ruth:0 "路得"
 omen_ruth_desc:0 "正如露特（希腊人称为露丝）这位摩押女子成为第一位归信者，在丈夫去世后跟随她的婆婆拿俄米回到以色列，与她同住、同宿、接纳拿俄米的民族为自己的民族，并且尊拿俄米的神为自己的神，最终也在拿俄米去世的地方死去并被埋葬在那里一样，我们也要将身边的外族人吸纳进我们的民族之中。"
 omen_samson:0 "沙玛什"
 omen_samson_desc:0 "参孙不遗余力地与非利士人作战，作为一个从出生就被立为拿细耳的勇士，他戒绝饮酒、不剃须、不剪发，我们的军队也应如他一般无倦无息，我们的人民将会忍受任何被要求做出的牺牲。"
 omen_uzzi:0 "乌西"
 omen_uzzi_desc:0 "正当任的大祭司乌兹将约柜藏在圣山基利心的一个洞穴中，以防巫师埃利亵渎它，约柜奇迹般地消失了。我们为持续遵守摩西所传下的真正律法而感到自豪。"
 omen_yahweh:0 "雅威"
 omen_yahweh_desc:0 "耶和华是希伯来人的风暴之神。在以色列宗教中对耶和华的崇拜与其他巴勒斯坦地区的宗教不同，以色列人选择只崇拜耶和华，并否认所有其他神祇都是虚假的。耶和华最初是希伯来-迦南地区强大的风暴之神哈达德的一个地方变体。"

 omen_baltic_bear:0 "拉基斯"
 omen_baltic_bear_desc:0 "拉基斯，因其缓慢而沉重的步伐而得名，通常独自行动，只依靠自己的力量寻求庇护。虽然不容易生气，但一旦被激怒却会成为致命的敌人。熊对他来说是神圣的。"
 omen_baltic_bee:0 "比塔"
 omen_baltic_bee_desc:0 "有许多人热爱比塔，这位蜜蜂之神守护着蜂巢并保护着他那些不知疲倦的工蜂。当太阳升起时，比塔不懈努力地填充蜂房，使之充满最甜美的蜂蜜，然而他的触碰，就像蜜蜂蜇刺一般，也能带来死亡。"
 omen_baltic_bird:0 "普特诺斯"
 omen_baltic_bird_desc:0 "翅膀的拍打声和悦耳的鸟鸣宣告了高贵的普特诺斯的到来，他常常化身为一只翱翔的老鹰。展开双翅，随着飘荡的气流滑翔，他深受统治阶级的喜爱，他们希望能够模仿他的天生权威。"
 omen_baltic_horse:0 "齐尔戈斯"
 omen_baltic_horse_desc:0 "齐尔戈斯，马神，他的雷霆蹄声踏碎邪恶之人，粉碎他们的骨骼并将他们碾磨成尘土——他奋力挣脱缰绳，睁大双眼，嘶鸣着，急切地想要摧毁他的敌人。"
 omen_baltic_oak:0 "佩尔库诺斯"
 omen_baltic_oak_desc:0 "佩尔库诺斯，这位神祇就像他所尊崇的橡树一样，游走于原始森林和阴暗的林地之间；在他宽广的枝叶遮蔽下，人们可以找到稳定与成长，进入一种有利于冥想的宁静状态。"
 omen_baltic_sun:0 "索拉"
 omen_baltic_sun_desc:0 "索拉，其力量犹如太阳般永不真正离开那些爱戴他的人；他在地平线上方徘徊数月之久，尽可能长时间地驱散黑暗，仅短暂休息后便再次投入到对抗黑夜的永恒斗争中。"
 omen_deivas:0 "代瓦斯"
 omen_deivas_desc:0 "代瓦斯是众神中至高的其中一位神祇，这位天空神将他的任务传给了后来者。他是所有人的共祖，我们向他祈祷以求得指引和帮助，因为他是众神中最至强的存在。"
 omen_divine_twins:0 "圣双子"
 omen_divine_twins_desc:0 "当清晨开启白天及至白昼转入黑夜，圣双子拉着绍莉亚跨过天际。他们是我们的宇宙中重要部分，护佑着我们的家园和人民。"
 omen_governing_goddesses:0 "宰制女神"
 omen_governing_goddesses_desc:0 "据说七位宰制女神打造了命运。她们转动生命的丝线，织起战争与和平，以及我们人民的命运。我们祈望她们让我们知晓未来，以及未来是否会变好。"
 omen_medeine:0 "梅黛内"
 omen_medeine_desc:0 "梅黛内是与狩猎、森林和野生生命有关的一切事物的女保护神，她因此而闻名。即便只是为了觅食的需求，我们的战士离开家时常呼求她的援助，只要他们身处她的领域，她便会在战场上支援他们。"
 omen_mother_goddess:0 "大地女神"
 omen_mother_goddess_desc:0 "大地女神是我们众神中最核心的神祇，她是我们所生活的大地，也是我们诸部落的先祖。我们的人民寻求她的指引、保护和供养，祈望丰饶的收成与救援。"
 omen_pbs_bear:0 "梅德韦迪奥斯"
 omen_pbs_bear_desc:0 "梅德韦迪奥斯，也被称为甜食者，通常独自在森林中漫步寻找蜂蜜。他只依靠自己的力量来寻求庇护。虽然不容易生气，但一旦被激怒却会成为致命的敌人。熊对他来说是神圣的。"
 omen_pbs_bee:0 "比凯拉"
 omen_pbs_bee_desc:0 "有许多人热爱比凯拉，这位蜜蜂之神守护着蜂巢并保护着他那些不知疲倦的工蜂。当太阳升起时，比凯拉不懈努力地填充蜂房，使之充满最甜美的蜂蜜，然而他的触碰，就像蜜蜂蜇刺一般，也能带来死亡。"
 omen_pbs_bird:0 "普托科斯"
 omen_pbs_bird_desc:0 "翅膀的拍打声和悦耳的鸟鸣宣告了高贵的普托科斯的到来，他常常化身为一只翱翔的老鹰。展开双翅，随着飘荡的气流滑翔，他深受统治阶级的喜爱，他们希望能够模仿他的天生权威。"
 omen_pbs_deer:0 "西尔纳"
 omen_pbs_deer_desc:0 "黎明前，在湖边，雾气仍缭绕在水面之上，草地因露珠而湿润，西尔纳这头鹿正在深深饮水。森林中传来声响，毫无预兆地，西尔纳消失了。"
 omen_pbs_dragon:0 "阿斯凯里基"
 omen_pbs_dragon_desc:0 "当一个人遭遇了阿斯凯里基这条巨龙时，死亡的时刻便已临近，因为面对巨龙的愤怒没有任何希望可以抵抗；士兵和奴隶主拥抱阿斯凯里基赐予的强大礼物，因为他们知道巨龙乐于见到破坏和苦难。"
 omen_pbs_fish:0 "祖斯"
 omen_pbs_fish_desc:0 "冰冷的海洋是鱼神祖斯的游乐场，他冷漠而不眨眼地注视着人类的事物，随后返回深邃的海底。水手们希望在从海外归来时能看到他，因为看到他的人会得到好运和财富的承诺。"
 omen_pbs_hare:0 "扎金科斯"
 omen_pbs_hare_desc:0 "几乎没有人能期望与扎金科斯这只野兔的速度相匹敌，他疾驰而过，在人们注意到他的存在之前就已经消失在高高的草丛之中；他的眼睛始终睁开，注视着一切，鼻翼微微颤动，随即消失无踪。"
 omen_pbs_horse:0 "卡米奥斯"
 omen_pbs_horse_desc:0 "卡米奥斯，马神，他的雷霆蹄声踏碎邪恶之人，粉碎他们的骨骼并将他们碾磨成尘土——他奋力挣脱缰绳，睁大双眼，嘶鸣着，急切地想要摧毁他的敌人。"
 omen_pbs_lime:0 "莱帕"
 omen_pbs_lime_desc:0 "莱帕的信徒们会发现自己处于一种不受约束的喜悦状态之中；狂喜的欢乐抓住了信徒们的心，庆祝活动一直持续到深夜——很少有人能够抵挡住这种狂喜的召唤。"
 omen_pbs_moon:0 "梅内斯克奥斯"
 omen_pbs_moon_desc:0 "夜空被梅内斯克奥斯这轮月亮的辉煌光芒照亮，他的闪烁斗篷上点缀着星星。他以苍白而又充满同情的脸庞面向地球，聆听疲惫者的祈祷。"
 omen_pbs_oak:0 "佩鲁诺斯"
 omen_pbs_oak_desc:0 "佩鲁诺斯，这位闪电之神如同他所尊崇的橡树一般，游走于原始森林和阴暗的林地之间；在它宽广的枝叶遮蔽下，人们可以找到稳定与成长，进入一种有利于冥想的宁静状态。"
 omen_pbs_ox:0 "沃尔奥斯"
 omen_pbs_ox_desc:0 "沃尔奥斯这头公牛在奋力拉动轭具时发出低沉的哞哞声，他沉重地承受着负担，喘息着坚持下去——工作艰难且漫长，但沃尔奥斯忠诚可靠，不会停歇直到完成任务为止。"
 omen_pbs_sheep:0 "欧维诺斯"
 omen_pbs_sheep_desc:0 "我们的人民真心爱戴欧维诺斯，这位绵羊之神，因为他慷慨的馈赠；母羊提供的营养丰富的乳汁、厚重的羊毛以保暖我们的身体，以及美味的羊肉以填饱我们的肚子。"
 omen_pbs_snake:0 "安吉奥斯"
 omen_pbs_snake_desc:0 "虽然有些人可能会觉得将蛇神与生育和安全联系起来有些奇怪，但对于安吉奥斯的信徒而言，这再正常不过；他们深知他们的蛇形神祇能够带来这一切，甚至更多。"
 omen_pbs_sun:0 "苏尔尼科斯"
 omen_pbs_sun_desc:0 "苏尔尼科斯，其力量犹如太阳般永不真正离开那些爱戴他的人；他在地平线上方徘徊数月之久，尽可能长时间地驱散黑暗，仅短暂休息后便再次投入到对抗黑夜的永恒斗争中。"
 omen_pbs_wolf:0 "威尔科斯"
 omen_pbs_wolf_desc:0 "在最寒冷的夜晚，当梅内斯克奥斯的月亮升起并将它的斗篷覆盖大地之时，正是这时，威尔科斯这只狼面向天空，用它那穿透黑暗的嚎叫声填满夜空——这是一种能够激起人们对即将到来的狩猎渴望的声音。"
 omen_perkunas:0 "佩尔库纳斯"
 omen_perkunas_desc:0 "勇气、天空、火，他们都属于佩尔库纳斯的国度。他鼓舞着我们的英雄和士兵，许多故事称颂他的事迹。众神中的其他神祇都视他若法官及判官，信赖他的一切决定。"
 omen_saulia:0 "绍莉亚"
 omen_saulia_desc:0 "绍莉亚跨过天际时照亮了世界。她曾嫁给月神，他们长久分居以创造我们所知的白昼。她每一天由圣双子协力，穿越天际，拜访她的女儿。"
 omen_televelis:0 "特莱韦利斯"
 omen_televelis_desc:0 "特莱韦利斯是铁匠与工匠的保护神，他创造了最精美的器具以及最具有空前毁灭性的武器。传说他曾创造了太阳，把它扔进天空，照亮了世界。"

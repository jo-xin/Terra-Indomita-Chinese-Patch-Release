 deity_kandaon:0 "$omen_kandaon$"
 deity_kotyto:0 "$omen_kotyto$"
 deity_thrax:0 "$omen_thrax$"
 deity_tis:0 "$omen_zis$"
 deity_zichos:0 "$omen_zichos$"
 omen_kandaon:0 "坎达翁"
 omen_kandaon_desc:0 "坎达翁是一位受到克雷斯顿尼亚色雷斯人崇拜的女神，根据希腊人的记载，她也可能被其他色雷斯部落所崇拜。希腊人将她描述为一位“奇怪”的女神。有些人将她与战神阿瑞斯联系起来，并认为她的名字意味着“燃烧着的”。这种解释也可能将她与火神赫淮斯托斯联系在一起。"
 omen_kotyto:0 "科提提亚"
 omen_kotyto_desc:0 "科提提亚（也称为科提提娅和科提托）是一位性爱女神，与高潮仪式相关联。有可能她的崇拜起源于对珀耳塞福涅被劫持事件的庆祝活动，最初由埃多尼色雷斯人庆祝，之后传播到了希腊人那里。对于希腊人来说，她的崇拜变得非常普遍，以至于“科提提亚的伴侣”这句话成为了“荡妇”的同义词。"
 omen_thrax:0 "色雷克斯"
 omen_thrax_desc:0 "色雷斯的斯拉克斯是希腊神话中色雷斯人的神祇，他是战神阿瑞斯的儿子之一。有些资料指出，斯拉克斯是阿瑞斯本人作为色雷斯人守护神的一个称号或是原始名称。正因为如此，在色雷斯的比斯托尼亚有一座供奉着阿瑞斯镀金盾牌的神庙。"
 omen_tis:0 "提斯"
 omen_tis_desc:0 "提斯（也称为齐斯）是本迪斯之子，可能是达契亚人版本的天空之神，这类神祇在许多印欧民族的神祇体系中都有出现。提斯被等同于许多外来神祇（如狄俄尼索斯、赫尔墨斯、阿波罗、阿瑞斯，这可能表明提斯是一位古老的民族神祇，因此很容易与任何新的神祇相联系。实际上，提斯很可能是在色雷斯人和达契亚人中普遍崇拜的神祇。他还被称为多面神（通常是三面），并且是一位骑马的神祇。"
 omen_zichos:0 "齐科萨"
 omen_zichos_desc:0 "齐科萨是一个重构的色雷斯词语，用来代表色雷斯人的蛇腿女神。色雷斯人崇拜这位蛇腿女神，但没有留下她真实名字的遗迹。她很可能是从斯基泰人那里继承过来的一位女神，斯基泰人也有一个未命名的蛇腿女神。齐科萨通常被描绘为一个高大的女性，头部和头发上有蛇一般的触须。"

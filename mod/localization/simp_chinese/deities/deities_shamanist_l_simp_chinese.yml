 omen_abka_hehe:0 "阿布卡赫赫"
 omen_abka_hehe_desc:0 "阿布卡赫赫是天空之母。有时也被称为阿布卡恩杜里，意为天神，她对通古斯各族至关重要。实际上，据说所有的男神和女神都源于她。她常常与女萨满联系在一起。据说她随时准备战斗，有时被称为战斗女神，并在世界分崩离析时帮助应对灾难。"
 omen_banamu:0 "巴那姆赫赫"
 omen_banamu_desc:0 "巴那姆赫赫是大地之母。她被赋予治理大地的职责，以肥沃的土壤和优质的牧场祝福大地。巴那姆赫赫负责协助阿布卡赫赫和乌尔登赫赫创造所有其他精灵、神祇和人类。"
 omen_buga:0 "布嘎"
 omen_buga_desc:0 "布嘎是元素创造之神，一位恩杜里（神），可能最初源自腾格里信仰的影响。此神被视为神圣之神，他的名字正是此意——神圣。他是一位特殊的恩杜里，男女萨满都无法与他沟通。"
 omen_buninka:0 "布宁卡"
 omen_buninka_desc:0 "布宁卡是布嘎的大敌，一位与布嘎对立的毁灭之神。据说布宁卡摧毁布嘎的法器后，布嘎将布宁卡的头变成了铁。由于疼痛难忍，布宁卡请求宽恕。他被要求发誓不伤害人类，于是他应允了，但仍伤害已死之人的灵魂。"
 omen_eskeri:0 "埃斯凯里"
 omen_eskeri_desc:0 "埃斯凯里是另一位创世神，能够创造原始之水并用其帮助建造大地。他还能创造原始之泥，为水的造物赋予形状。"
 omen_hinkon:0 "欣孔"
 omen_hinkon_desc:0 "最伟大的猎人欣孔是狩猎之神也是动物生命之神。他是终极的生存者没有任何人乃至恩杜里能够匹敌他的本领。"
 omen_mayin:0 "玛音"
 omen_mayin_desc:0 "玛音，生命的赐予者，是灵魂之神。他为每一个新生儿赋予灵魂。如果他选择不给婴儿灵魂，婴儿将出生时毫无灵魂。玛音也可能与天堂有联系，但尚不清楚是否最初如此。"
 omen_ulden:0 "乌尔登·赫赫"
 omen_ulden_desc:0 "乌尔登·赫赫是光明之母。她以日月赐福于世界，照亮大地，使人类能看见自身并感知自我与他人。乌尔登·赫赫与巴纳穆·赫赫（Banamu Hehe）一道，协助阿布卡·赫赫（Abka Hehe）创造其他所有精灵与生灵。"
 omen_xelgun:0 "赫格伦"
 omen_xelgun_desc:0 "赫格伦是伟大的天界麋鹿。据说萨满的祖先曾追逐这头巨麋横跨整个天穹。"

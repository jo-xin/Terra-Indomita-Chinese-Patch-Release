 omen_air:0 "水之幽灵"
 omen_air_desc:0 "水之幽灵意为水之灵，或水中徘徊之灵。此灵可以帮助灌溉庄稼，也可使当地水域变得凶险。必须召唤杜昆祭司以安抚此灵，从中获益。"
 omen_belian:0 "虎之幽灵"
 omen_belian_desc:0 "虎之幽灵是老虎之灵。驾驭猛虎，利用这凶残的猎手为你所用。借助杜昆之力，他们或许能驯服这野蛮的虎之幽灵，让它转而攻击我们的敌人。"
 omen_beruk:0 "猿之幽灵"
 omen_beruk_desc:0 "猿之幽灵将向所有人展示所谓疯如猿猴的真正含义。此灵的狂野本性必须由技艺娴熟的杜昆引导否则猿之幽灵将在我们的土地上肆意狂奔。"
 omen_jenglot:0 "精灵"
 omen_jenglot_desc:0 "玩偶般的吸血鬼生物精灵深藏在丛林之中。精灵几乎总是女性市场上常有伪造品出售用来吓唬孩子不要独自走入丛林太深。"
 omen_mula:0 "穆拉·贾提"
 omen_mula_desc:0 "穆拉·贾提是苏门答腊的宇宙之神。在地方信仰中，穆拉·贾提既是善也是恶，既是女性也是男性。穆拉·贾提连接着现实的三个世界。上层世界，即神圣的世界。中间世界，即人的世界。下层世界，即龙的世界。"
 omen_musang:0 "麝猫之灵"
 omen_musang_desc:0 "顽皮的麝猫之灵这种麝猫幽灵被用于涉及附身的游戏中。尽管此灵是一只猫但最好由杜昆确保其淘气好奇的天性不会造成伤害而是带来欢乐。"
 omen_padoha:0 "那迦·帕多哈"
 omen_padoha_desc:0 "那迦·帕多哈是下层世界——即龙世界的终极存在。那迦·帕多哈就是那条龙。下层世界是一个完全被海洋环绕的区域，在人类之前就存在，也早于大地（中间世界）。那迦·帕多哈与宇宙至高神穆拉·贾提对立。他们都在世界创造中扮演着关键角色。"
 omen_ponai:0 "波那加"
 omen_ponai_desc:0 "占婆女神波那加是占人最有影响力的女神。她是农业的守护神，同时也担任风暴和洪水之神以及降雨者。\n\n在越南传统中有一则关于波那加的神话。故事讲述了一位被年迈父母收养的少女。她长大后消失在暴风雨的海中，逃到北方与一位王子结婚并生下两个儿子。有一天，她离开丈夫，带着孩子回到故乡。她为已故的父母建了一座庙，然后作为仙女升入天堂。"
 omen_pusaka:0 "遗产之灵"
 omen_pusaka_desc:0 "墓地之魔鬼，遗产之灵确实是一个令人不安的幽灵。也许是最传统的幽灵般的灵，召唤一位杜昆，让我们在夜晚安睡，远离此灵在黑暗阴沉的墓园之夜带来的恐惧。"
 omen_raya:0 "拉亚之灵"
 omen_raya_desc:0 "众人听令！需尽快请来一位巫医（Dukun），因大魔哈图·拉亚（Hantu Raya）现身作祟，威吓我等。大哈图·拉亚乃林间万恶之灵中最强者，可变幻为其主人之形貌。通灵此哈图或招致#R严重后果#!，但若驾驭得当，亦可收奇效。"
 omen_sang_hyang:0 "桑海扬·克尔萨"
 omen_sang_hyang_desc:0 "桑海扬·克尔萨是巽他族裔之神。其名意为「全能者」，亦称努·厄萨坎（Nu Ngersakeun），意为「有意志者」。他尚有许多别的称号，如通加尔（Tunggal，唯一者）、巴塔拉·贾加特（Batara Jagat，宇宙之主）以及巴塔拉·塞达·尼斯卡拉（Batara Seda Niskala，无形者）。"
 omen_sunan:0 "苏南·安布"
 omen_sunan_desc:0 "苏南·安布，亦称巴塔里·苏南·安布，是母神，在苏门答腊以南的巽他族裔中最受人爱戴。其名的直接翻译大致为母后、母神或尊贵的母亲。"

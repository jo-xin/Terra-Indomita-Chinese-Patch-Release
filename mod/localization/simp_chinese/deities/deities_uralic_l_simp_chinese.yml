 omen_akka:0 "阿卡"
 omen_akka_desc:0 "阿卡是生育女神。她代表月经、爱情、性、怀孕和分娩。她是女性神圣形象的终极代表。"
 omen_esi:0 "埃西"
 omen_esi_desc:0 "埃西是旅行之魂，它曾经是瓦伊尼——即活人之魂。埃西被称为'影之魂'。它最显著地存在于死后，然而埃西也可以在无意识状态下存在，比如梦境之中。"
 omen_ilma:0 "伊尔玛"
 omen_ilma_desc:0 "伊尔玛是空中和天空的至高无上的神。他有很多名字，从Inmar，到Ilmarinen，到Num-Ilem等等。伊尔马里克就是以这位伟大的神命名的。在芬兰-乌戈尔语中，许多神中都有Ilma的词根，这强烈地暗示了Ilma是芬兰-乌戈尔语的至高神。"
 omen_jada:0 "贾达"
 omen_jada_desc:0 "贾达是魔法与萨满之神，也可能是一位女神。贾达能够召唤并诅咒人们，是不可轻忽的危险神祇。"
 omen_jumla:0 "朱姆拉"
 omen_jumla_desc:0 "久姆拉是人民的神，通常被简单地称为'神'。他可能是神的一个通称，然而也有可能他在成为一个通称之前确实是一位独立的神。"
 omen_koudorso:0 "库多索"
 omen_koudorso_desc:0 "库多索，雷电之神。他是一位强大的神明，能够用强大的闪电击溃敌人。库多索后来与图伊斯特的图恩拉兹（即托尔）被视为同一神祇，但最初他与托尔是独立存在的。"
 omen_kuje:0 "库杰"
 omen_kuje_desc:0 "伊尔马里克人非常相信天空、月亮和星星，而库乌代表着月亮，是月亮女神。据说她拥有月亮的金子，能够用月亮的线纺出金色的衣服."
 omen_mareta:0 "玛娜"
 omen_mareta_desc:0 "玛娜是死亡女神，她控制着死者的通道和住所，也就是马纳拉。在一些文化中，她被视为死亡和疾病之神，以疾病和死亡打击人们。"
 omen_metsa:0 "梅斯塔"
 omen_metsa_desc:0 "梅斯塔是森林之神。有时被称为森林之母，她控制着北方的雪林。她还控制着森林里的野生动物，比如熊、蛇和狼。"
 omen_pajewa:0 "帕耶瓦"
 omen_pajewa_desc:0 "太阳、月亮和天空受到伊玛利人的尊敬，太阳女神是帕耶瓦。据说她拥有太阳的银子，能够用太阳布织成银色的衣服。"
 omen_vesa:0 "维西"
 omen_vesa_desc:0 "维西是水之灵。有时被称为水之母，她控制着北方冰冷的海水。她被描绘成长发、大咪咪和鱼的下半身；就像美人鱼一样。"
 omen_wajni:0 "瓦伊尼"
 omen_wajni_desc:0 "瓦伊尼是每个人的灵魂。这有时被称为“呼吸-灵魂”。瓦伊尼被指定为一个身体，只有在死亡的那一刻才离开它。"

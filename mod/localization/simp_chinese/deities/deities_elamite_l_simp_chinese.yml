 omen_apku:0 "阿普库"
 omen_apku_desc:0 "阿普库见证于卡尔齐-阿普库这个名字中；除此之外，人们对这位神、其性质乃至其性别都一无所知。"
 omen_ban:0 "班"
 omen_ban_desc:0 "班，也叫阿尔班，是一位神灵，我们仅通过卡西特人名中的记录才得知其存在。他们可能是独立的神灵，但许多人认为他们只是同一名字的两种不同拼写。"
 omen_bugash:0 "布加什"
 omen_bugash_desc:0 "布加什可能是一位卡西特神祇，其存在由带神名的卡西特人名作证。除此之外，人们对布加什一无所知。"
 omen_buriash:0 "布里亚什"
 omen_buriash_desc:0 "布里亚什是卡西特的天气神，常与阿达德相提并论。他在多个卡西特人名中被提及，可能是哈贝的一个称号，哈贝是卡西特万神殿的主神，布里亚什可能意为'土地之主'。"
 omen_duniash:0 "杜尼亚什"
 omen_duniash_desc:0 "如果没有一个卡西特词汇，杜尼亚什将完全未知和无从证实。卡杜尼亚什是卡西特语中对巴比伦的称呼。目前没有共识杜尼亚什是哪种类型的神灵，如果他确实是一个神灵的话。"
 omen_dur:0 "杜尔"
 omen_dur_desc:0 "除了与尼格尔有关外，我们对这个神灵知之甚少。事实上，他甚至没有在任何卡西特人名中得到证实。"
 omen_duzagash:0 "杜扎加什"
 omen_duzagash_desc:0 "杜扎加什从一块卡西特附庸国王哈穆拉皮的石鸭重物铭文中得知。杜扎加什可能起源于卡西特。"
 omen_gindar:0 "金达尔"
 omen_gindar_desc:0 "神灵金达尔从一个词汇列表中得知，与美索不达米亚的尼努尔塔相提并论。在词汇列表中也有提及，可能还有更多，如果“金塔尔”是金达尔的变体拼写的话。金达尔也可能是治疗女神哈拉的配偶。"
 omen_hala:0 "哈拉"
 omen_hala_desc:0 "女神哈拉与美索不达米亚的古拉相提并论。据推测她是一位治疗女神，在几个名字中出现。"
 omen_harbe:0 "哈贝"
 omen_harbe_desc:0 "强大的哈贝是众神之王，很可能是卡西特万神殿的首领。他是卡西特神名列表中提到最多的神灵之一，他的名字本身可能意为'主'。因此他有时被与恩利尔相比较。\n\n他的神圣象征是鸟回头的图案，这个象征被称为'库杜鲁'。"
 omen_hishmitik:0 "希什米蒂克"
 omen_hishmitik_desc:0 "希什米蒂克是来自东埃兰安善的神灵。希什米蒂克被认为在乔加赞比尔与神灵鲁胡拉特尔共享一个神庙。这被视为希什米蒂克是鲁胡拉特尔配偶的证据，但这并没有得到普遍认可。除了这一点，关于希什米蒂克的其他记载很少，但如果她确实是鲁胡拉特尔的配偶，她可能扮演了与鲁胡拉特尔类似或支持的角色。"
 omen_hudak:0 "胡达克"
 omen_hudak_desc:0 "胡达克，也叫胡达，在几次记录中被提及，包括一封描述他为阿达德的词汇信件，意味着他可能是卡西特版的阿达德。"
 omen_humban:0 "洪班"
 omen_humban_desc:0 "埃兰神灵中最强大的神灵，基丁的赐予者，众天之主，诸神之首，从底格里斯和幼发拉底河到苏萨，从安善到扎格罗斯山脉，再到波斯的大城市，洪班就是如此。在早期，洪班是东埃兰最伟大的神灵，而因舒希纳克在西部占据主导地位。然而，到阿契美尼德时期，洪班的受欢迎程度大大提高。事实上，有时有人认为洪班更多是波斯人的神灵，而不是埃兰人的神灵，这说明了他受尊敬的程度。在波斯波利斯堡垒档案中，洪班被提及的次数惊人地达到了26次，比其他任何神灵都多。同一文件中，阿胡拉马兹达仅被提及10次。在美索不达米亚，他是卡西特时期提及最多的第三位神灵。在新亚述时期，洪班经常被与恩利尔相比较，其重要性和伟大程度可见一斑。毫无疑问，在新埃兰时期之后，没有任何神灵能比伟大的洪班更能代表埃兰人。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_hutran:0 "胡特兰"
 omen_hutran_desc:0 "胡特兰是掌管神性与王权的神祇，类似于洪班和因舒希纳克。事实上，胡特兰在伊拉姆神话中组成了一个神圣三位一体。这个三位一体常被拿来与印欧伊朗神系中的荷尔马兹—密特拉—阿那希塔三神相比较。胡特兰是众神之母基里里莎唯一已知的儿子，如果他与纳皮里莎确实为神圣伴侣，那么他也可能是纳皮里莎的儿子。"
 omen_inshushinak:0 "因舒希纳克"
 omen_inshushinak_desc:0 "因舒希纳克是埃兰城市苏萨的神灵。在埃兰神话中，他有时被称为所有神灵中最伟大的。他被视为强大的冥界之神，有时与强大的美索不达米亚女神埃列什基伽尔的随从一起出现。\n\n在阿契美尼德时期的波斯，因舒希纳克在苏萨之外的影响力大大减弱。虽然他曾经是最伟大的神灵，但在新埃兰时期后，像洪班这样的其他神灵变得更加重要。尽管如此，对于他对埃兰人是否变得不那么重要，或者印度-伊朗人是否只是忽视并不赞成他的崇拜，仍存在分歧。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_ishmekarab:0 "伊什梅卡拉巴"
 omen_ishmekarab_desc:0 "伟大因舒希纳克的侍从和誓言的保护者，阿卡德-美索不达米亚起源的神灵伊什梅卡拉巴在新巴比伦时期与埃兰联系在一起。伊什梅卡拉巴至少在新埃兰时期以及可能更久远的时期受到崇拜。在一处记载中，他被称为苏萨的神灵，然而这很可能是误译或因舒希纳克之误写，或仅是表明伊什梅卡拉巴为因舒希纳克的侍从。"
 omen_ishnikarab:0 "伊什尼卡拉巴"
 omen_ishnikarab_desc:0 "伊什尼卡拉巴起初是阿卡德的神灵伊什尼卡拉布，但对埃兰人也有重要意义。伊什尼卡拉巴是正义和誓言之神。在埃兰神话中，尽管存在争议，许多人认为伊什尼卡拉巴是苏萨神灵因舒希纳克的配偶。后来，她与她的丈夫和名为拉加马尔的神一起，可能为琐罗亚斯德教中审判灵魂的三神信仰提供了基础。"
 omen_jabru:0 "贾布鲁"
 omen_jabru_desc:0 "神灵贾布鲁是一个有趣的案例。他在美索不达米亚的资料中明确表示为埃兰的神灵，然而，他在埃兰的资料中却没有出现。对此有几种理论。一种理论认为，贾布鲁是洪班的父亲，通过将贾布鲁与阿努进行比较，阿努被认为是神王的父亲。另一种理论认为，贾布鲁可能是特普提的禁忌名字，然而这一理论存在很大争议，认为我们认为是不同的埃兰神灵的几个名字实际上只是不同的埃兰神灵的禁忌名字。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_kamulla:0 "卡穆拉"
 omen_kamulla_desc:0 "卡穆拉要么是一位山神，要么是卡穆拉山的神化。他出现在一些名字中，他的名字山可能在拉达努河以南的某个地方。"
 omen_kiririsha:0 "基里里沙"
 omen_kiririsha_desc:0 "众神之母基里里沙是埃兰万神殿中最重要的神灵之一。她自己与特普提和纳皮里沙一起，是让世界繁荣的神灵，特别是水和地球。纳皮里沙被证明是水神，而基里里沙可能是地球女神。纳皮里沙和基里里沙实际上是一对神圣夫妇，他们的结合产生了另一个叫做胡特兰的神灵。她也是利安的守护女神，甚至有一个称号“利安的死亡女士”，意思是“利安的死亡女士”。她最早的记载可以追溯到公元前19世纪，在阿契美尼德统治后仍然是受崇拜的神灵。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_kirmashir:0 "基尔马希尔"
 omen_kirmashir_desc:0 "基尔马希尔是来自苏萨北部阿斯旺的五位神灵之一。与基尔马希尔一起的是洪班、皮尼吉尔、胡特兰和纳胡恩特。除了他们来自阿斯旺外，我们对基尔马希尔知之甚少。许多阿斯旺的神灵在阿契美尼德时期及以后仍然相关，但基尔马希尔似乎影响力较小。尽管如此，基尔马希尔是苏卡尔玛王朝晚期（公元前1900-1500年）的国王库克-基尔马希尔的名字来源。"
 omen_lagamal:0 "拉加马尔"
 omen_lagamal_desc:0 "拉加马尔起初是阿卡德的神灵，但在被引入苏萨后成为埃兰万神殿的重要组成部分。拉加马尔是冥界的神灵，负责审判死者的灵魂。他与因舒希纳克和伊什尼卡拉巴一起，被列入一个三神信仰体系，可能影响了琐罗亚斯德教的三神信仰，三神信仰是对灵魂进行审判的三位神灵。"
 omen_manzat:0 "曼扎特"
 omen_manzat_desc:0 "彩虹女神曼扎特主要在伊朗伊拉姆低地以及苏美尔和阿卡德地区受到崇拜，但她究竟起源于美索不达米亚还是伊拉姆尚不明确。曼扎特在苏萨附近的胡布申地区尤其受到敬仰。她与城市的繁荣密切相关，有时被伊拉姆语称为“大夫人”。公元前一千年以后，她的记载变得极为罕见，表明她在那个时代之后可能变得不那么重要。"
 omen_maruttash:0 "马鲁塔什"
 omen_maruttash_desc:0 "马鲁塔什一直是许多词汇理论的主题，将他与吠陀神玛鲁特或卢维安神伦提亚联系起来，但现代学术界不认为这些理论可信。马鲁塔什被广泛记录，他们可能是卡西特版的尼努尔塔，可以从马鲁塔什的名字频繁出现在尼努尔塔名字附近得知。"
 omen_mashti:0 "马什提"
 omen_mashti_desc:0 "马什提是埃兰的母神。关于她的其他信息不多。她可能来自印度-伊朗的与埃兰宗教的同化，引入了阿娜希塔的形式。另一种可能性是，埃兰神灵马什提与达罗毗荼神灵马斯塔玛有关，但这纯属推测。也可能马什提是巴比伦太阳神宁利布的变体。"
 omen_mirizir:0 "米里齐尔"
 omen_mirizir_desc:0 "米里齐尔是卡西特女神，可能与马有关，这从她的名字出现在马名中得知。或者，她的名字也可能是对动物的更普遍的指称，使她成为一种猎人或自然女神。她并没有被发现被美索不达米亚人崇拜，尽管她可能曾以贝尔图的称号出现。"
 omen_nahiti:0 "纳胡提"
 omen_nahiti_desc:0 "纳胡提，在古埃兰语中称为纳希提，是埃兰宗教中的太阳之主。他被认为是誓言和正义的守护者。他的雕像被立起，以便城市或国家的领导者保持诚实和公正。在美索不达米亚，他经常与月神辛一起被提及。他还被称为'埃兰神圣七人'之一，尤其与另一位七人成员纳伦迪女神一并提及。有趣的是，尽管纳胡提从未与沙马什或乌图同化，但在书写中，纳胡提的名字与乌图相同。"
 omen_napir:0 "纳皮尔"
 omen_napir_desc:0 "纳皮尔，也称纳普，是埃兰万神殿中的月神。他似乎并不是特别流行的神祇；然而从其名字以线形埃兰文字书写来看，这意味着他至少到公元前六世纪乃至波斯统治时期仍受到崇拜。"
 omen_napirisha:0 "纳皮里沙"
 omen_napirisha_desc:0 "纳皮里沙是自公元前3千年远古时代起安善王国的伟大神灵。纳皮里沙经常以象征世界原始水域的原始之蛇的形象出现。因此，美索不达米亚人常将他与他们的淡水之神恩基相比较。纳皮里沙和他的配偶基里里沙在苏萨与他们的主神因舒希纳克一起受到崇拜。"
 omen_narundi:0 "纳伦迪"
 omen_narundi_desc:0 "纳伦迪是苏萨的女神，是已知最古老的埃兰神灵，最早出现在公元前2260年的记录中。她在公元前1800年之后的记载停止，可能是由于埃兰人分散的宗教中的神灵同化。她给美索不达米亚人留下了深刻印象，他们将她与伊什塔尔相比较。对美索不达米亚人来说，她被称为“埃兰的神圣七人”之一，这是一个由七位战神组成的团体。尚不清楚埃兰人是否对她的神话有相同的看法，但很可能两种版本的女神之间有一些一致的元素。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_pinigir:0 "皮尼吉尔"
 omen_pinigir_desc:0 "皮尼吉尔是一位埃兰起源的强大神灵，也在胡里安宗教中广泛传播。她与伊什塔尔类似的主题有关。她是爱情和性之神，但像伊什塔尔一样，她也与战争和星辰有关，特别是在胡里安版本中。皮尼吉尔在埃兰一直受到崇拜，直到公元前500年新亚述人焚毁她在苏萨的神庙。她在中东各地的万神殿中占有重要地位，因此很可能在此之后仍然是一个重要的神灵。"
 omen_ruhurater:0 "鲁胡拉特尔"
 omen_ruhurater_desc:0 "鲁胡拉特尔是安善的创造神之一，是少数能赐予基丁的人之一。尽管与安善有联系，可能在那里达到最高的地位，与他的配偶希什米蒂克一起，但这位神灵最初是与古老的胡胡尔城联系在一起的。鲁胡拉特尔经常被视为因舒希纳克的类似神灵，将他比作安善的因舒希纳克。"
 omen_sah:0 "萨赫"
 omen_sah_desc:0 "卡西特万神殿中记录最详细的更大太阳神萨赫实际上是卡西特尼普尔人名列表中提到最多的神灵。这表明他是一位非常普遍的神灵，很可能与沙马什相比较。"
 omen_shala:0 "沙拉"
 omen_shala_desc:0 "沙拉，阿达德的妻子，与她的丈夫的崇拜同时被引入埃兰。需要注意的是，她和她的丈夫很可能是美索不达米亚版本，而不是更为熟悉的迦南版本。她是天气女神，如同她的丈夫一样，并与埃兰神灵希赫希有关。沙拉可能在安善和苏萨附近的埃兰低地受到崇拜。"
 omen_shihhash:0 "希赫希"
 omen_shihhash_desc:0 "希赫希是迦南神阿达德的埃兰版本。虽然不清楚这些神灵是三位不同的神，还是同一位神灵，埃兰人有三个对希赫希的称号，分别是希赫希、申努库舒和昆兹巴米。作为阿达德的一个版本，希赫希在埃兰宗教中可能更类似于美索不达米亚的版本，因为甚至名字可能都来源于美索不达米亚。"
 omen_shikme:0 "希克梅"
 omen_shikme_desc:0 "希克梅，也可能是来自胡里安万神殿的西米吉，在名字布拉-希克梅中有记录。由于这是唯一的记录，假设希克梅与西米吉是同一个神灵。西米吉是一位了解甚少的太阳神。他可能与沙马什混为一谈。"
 omen_shipak:0 "希帕克"
 omen_shipak_desc:0 "一个好奇的卡西特月神，这个神灵被提到类似于美索不达米亚的辛，然而似乎也被提到与马尔杜克相提并论。"
 omen_shugab:0 "舒加布"
 omen_shugab_desc:0 "舒加布在许多卡西特人名中有记载，然而，可能他是女神舒卡穆纳的一个称号或方言名称。舒加布可能起源于阿卡德。"
 omen_shuhur:0 "舒胡尔"
 omen_shuhur_desc:0 "舒胡尔唯一的记载见于卡西特人名舒胡尔-尼。除此之外，人们对这位神一无所知。"
 omen_shumaliya:0 "舒玛莉亚"
 omen_shumaliya_desc:0 "舒玛莉亚，山神，是记录最详细的卡西特神灵舒卡穆纳的妻子。一起，他们在一个甜美的、最美好的短语“ilanu murtamu”下组成了一个神圣夫妇，意思是“相爱的神灵”。有时，他们甚至被描绘成一对栖息在一起的鸟。真是太甜了！"
 omen_shuqammuna:0 "舒卡穆纳"
 omen_shuqammuna_desc:0 "舒卡穆纳是记录最详细的卡西特神灵。他可能最早出现在阿卡德资料中，但他更多与卡西特人联系在一起。他的配偶是舒玛莉亚，他们被称为「ilanu murtamu」，这是一个非常甜美的短语，意思是「相爱的神灵」。"
 omen_shuriash:0 "舒里亚什"
 omen_shuriash_desc:0 "舒里亚什是一个较小的太阳神。有时有人说他只是更大的太阳神沙赫的一个称号。另一种理论认为舒里亚什来自卡西特语中的“舒里”和“亚什”，然而，虽然“亚什”意思是土地，但我们不知道“舒里”是什么意思。"
 omen_silir_qatru:0 "西利尔卡特鲁"
 omen_silir_qatru_desc:0 "西利尔卡特鲁，也被称为西利尔卡特鲁，是埃兰本身的保护神。我们对这个神灵知之甚少，只知道他在埃兰被调用来保护，可能是防止入侵者、掠夺者，或者甚至是更小的国内问题，如犯罪或抢劫。"
 omen_simut:0 "西姆特"
 omen_simut_desc:0 "西姆特，也称为希姆特，在埃兰神话中被称为“众神的使者”。希姆特与“基丁”概念有关，类似于埃兰宗教中的许多著名神灵。西姆特经常被比较或与美索不达米亚的神灵尼格尔同化，然而最近的研究质疑西姆特在埃兰人中是冥界神灵的观点。他可能扮演了一些其他的角色，被认为与尼格尔相似。"
 omen_tepti:0 "特普提"
 omen_tepti_desc:0 "关于神秘的特普提神，我们知之甚少。他们出现在新埃兰时期的文献中，以及一些埃兰国王的名字中。一篇铭文描述特普提、纳皮里沙和基里里沙是一直保护水域和地球的神灵。虽然基里里沙通常被认为是保护地球的神灵，而纳皮里沙则被证明是水神，但特普提在三位一体中的角色尚不明确。"
 omen_tiliash:0 "提利亚什"
 omen_tiliash_desc:0 "提利亚什是一位在卡西特人名中有记载的神灵和元素。不确定提利亚什是单独的神灵还是自己的神灵，然而，考虑到与元素的联系，我们可以推测他的影响领域包括这个卡西特元素。"
 omen_tirutur:0 "蒂鲁图尔"
 omen_tirutur_desc:0 "蒂鲁图尔是一个神秘的神灵，文献中对他所知不多。他在新埃兰的资料中被提及。蒂鲁图尔与因舒希纳克、特普提和洪班一起，被认为与伟大的神圣和王权力量有关，以及一个叫做“基丁”的概念，最好的描述是对人民或国王的神圣保护。在阿契美尼德统治时期，波斯人将蒂鲁图尔与洪班混为一谈。"
 omen_turgu:0 "图尔古"
 omen_turgu_desc:0 "图尔古是一个神灵，我们只知道他的名字被用于卡西特人的人名。这些名字是卡达什曼-图尔古和米-图尔古。"
 omen_upurkupak:0 "乌普尔库帕克"
 omen_upurkupak_desc:0 "乌普尔库帕克，也称为乌佩尔库帕克或乌普尔库帕克，是一位光明女神。她只在一个祈祷中被提及，在该祈祷中，她被埃兰国王胡特尔图什-因舒希纳克称为“光明的女主人”，他生活在公元前11世纪。"

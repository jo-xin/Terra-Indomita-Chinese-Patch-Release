 omen_abulru:0 "阿布鲁鲁"
 omen_abulru_desc:0 "阿布鲁鲁指的是著名神话《巴棱公主与蛇王》中的蛇王阿布鲁鲁，中文版本中称阿达里奥。故事源自台湾鲁凯族。一位名叫巴棱的鲁凯公主爱上了一位英俊男子阿布鲁鲁。他们计划结婚，但阿布鲁鲁的身份被揭露——他其实是守护村庄的蛇王。巴棱的父母不愿女儿嫁给蛇王，要求他先找到七颗珠子。尽管花了三年时间，阿布鲁鲁最终找到了珠子并与巴棱成婚。两人此后再未被看见，但据说一直守护和照看着人们。"
 omen_ali_zu:0 "阿立祖"
 omen_ali_zu_desc:0 "阿立祖是一个指代特定生育神祇的术语，也是生育神祇的泛称，尤其为西拉雅人所用。这些神祇如此显赫，以至于在许多地区比西拉雅人本身存活得更久，因为汉人采纳了阿立祖神的概念。"
 omen_balenge:0 "巴棱"
 omen_balenge_desc:0 "巴棱指的是著名神话《巴棱公主与蛇王》中的巴棱公主。故事源自台湾鲁凯族。一位名叫巴棱的鲁凯公主爱上了一位英俊男子阿布鲁鲁（中文版称阿达里奥）。他们计划结婚，但阿布鲁鲁的身份被揭露——他其实是守护村庄的蛇王。巴棱的父母不愿女儿嫁给蛇王，要求他先找到七颗珠子。尽管花了三年时间，阿布鲁鲁最终找到了珠子并与巴棱成婚。两人此后再未被看见，但据说一直守护和照看着人们。"
 omen_dijizhu:0 "地基主"
 omen_dijizhu_desc:0 "地基主在中国信仰中很流行，但很可能起源于台湾原住民。在原住民信仰中，地基主与建筑物内的埋葬习俗有关——这在当时是常见做法。地基主也会帮助人们搬家，确保新居是一个安全的住所。"
 omen_kakrayan:0 "卡克拉扬"
 omen_kakrayan_desc:0 "卡克拉扬是至高神与万物的创造者。这个神祇的名字本身很可能来自吠陀印度教，但神很可能最初以原生形态存在。卡克拉扬有称为卡瓦斯的信使，这一概念与萨满相似，但比凡人萨满更具神性和超自然性。"
 omen_kawas:0 "卡瓦斯"
 omen_kawas_desc:0 "卡瓦斯是一种不朽的信使其目的类似于萨满但不同于萨满他们不是作为与至高神联系的凡人而是本身就是神圣的存在。卡瓦斯回应卡克拉扬确保宇宙按照他的意志运行。"
 omen_lamungan:0 "拉蒙甘"
 omen_lamungan_desc:0 "拉蒙甘，也称迈阿桑，是传说中位于西方的故土。这片故土容纳了已完成人生使命、准备回归死者之地的哈尼图灵魂。"
 omen_makuang:0 "马匡·伊桑"
 omen_makuang_desc:0 "马匡·伊桑是伊桑（灵魂）中与坏的和自私的思想行为相关的部分。每个人体内都有这个灵魂和另一个灵魂——马西亚尔·伊桑。"
 omen_mamantaiga:0 "马曼塔因加"
 omen_mamantaiga_desc:0 "马曼塔因加是大耳巨灵，躯干庞大。马曼塔因加可能大到足以被称为坎西利斯。马曼塔因加最喜欢吃的东西骇人听闻——儿童。"
 omen_masial:0 "马西亚尔·伊桑"
 omen_masial_desc:0 "马西亚尔·伊桑是伊桑（灵魂）中与好的和利他的思想行为相关的部分。每个人体内都有这个灵魂和另一个灵魂——马匡·伊桑。"
 omen_palinatu:0 "帕利纳努图·哈尼图"
 omen_palinatu_desc:0 "帕利纳努图·哈尼图是与捣乱的哈尼图协商以治愈疾病的概念。这包括任何\"无居所\"的哈尼图，即其唯一目的是给人带来伤害和疾病。"
 omen_qanasilis:0 "坎西利斯"
 omen_qanasilis_desc:0 "坎西利斯是巨型精灵，而且是\"无居所\"的精灵。这意味着它们很可能是能对人造成伤害的恶灵。"

 omen_baloraz:0 "巴尔德拉兹"
 omen_baloraz_desc:0 "在日耳曼神话中，巴尔德拉兹是北欧神祇巴尔德尔的一个早期形象。巴尔德尔是奥丁和弗丽嘉的儿子，他是光明、喜悦、纯洁以及夏日阳光之神。在后期的北欧神话中，巴尔德尔的死亡不仅对阿萨神族来说是一场巨大的悲剧，也被视为末日之战——诸神黄昏的预兆。\n\n有时会将巴尔德尔与希腊罗马神话中的阿波罗相比较，因为两者拥有相似的特征。\n\n尽管在这个历史时期内并未找到关于他在早期日耳曼信仰中存在的确凿证据，就像其他北欧神祇一样，但一些学者认为，鉴于巴尔德尔在后来的北欧神话中扮演的重要角色，他在那个时期很可能已经存在了。\n\n#!神化效果：$military_apotheosis_military_experience_effect_tt_description$"
 omen_brodenaz:0 "布罗德纳兹"
 omen_brodenaz_desc:0 "我们已将印度教中的大神梵天与强大的沃登纳兹相认同。在我们的联合信仰中，伟大的布罗德纳兹是最高的存在。作为智慧与魔法之神，他创造了这个世界，同时也是兄弟情谊的守护神。一种流行的崇拜团体被称为“布罗德纳兹之兄弟会”，已在我们的国家兴起。"
 omen_frawjo:0 "弗劳乔"
 omen_frawjo_desc:0 "弗劳乔，在北欧神话中后来被称为弗蕾雅，是一位与爱情、美丽、生育、性、战争、黄金和巫术相关的日耳曼女神。关于她的大部分现存信息来自于后来的北欧神话。弗蕾雅统治着她的天堂领域福克旺格，在那里她接收半数在战斗中死去的勇士，另一半则前往奥丁神的殿堂瓦尔哈拉。\n\n关于她的早期可能的历史提及，来源于罗马人与日耳曼民族的互动，通过所谓的“罗马式解释”过程，拉丁文文献将她与罗马神话中的女神伊西斯相比较。值得注意的是，这一历史提及也可能是指另一位女神弗里乔，在北欧神话中后来被称为弗丽嘉。\n\n学者们对于女神弗蕾雅和弗丽嘉是否最终源自同一女神的问题存在争议。虽然这种可能性存在，并且她们确实有很多共同的特点，但这只是其中一种理论。还有其他的理论认为她们确实源自两位不同的女神。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_freyrudra:0 "弗雷鲁德拉"
 omen_freyrudra_desc:0 "在我们的信仰中，弗雷和鲁德拉结合成为弗雷鲁德拉。弗雷代表着好天气和丰收，而鲁德拉则代表着风和风暴。他们共同构成了一个至高无上的天气之神，并且除此之外，还是问题的终极解决者和国王神性的象征。弗雷鲁德拉也被称为“十一主”，这是因为他的名字根源就含有这样的意思。据说在这十一种崇拜中有七种散布在我们的土地上。"
 omen_frijjo:0 "弗里乔"
 omen_frijjo_desc:0 "弗里乔，在北欧神话中后来被称为弗丽嘉，是一位与预见和智慧相关的日耳曼女神，她是奥丁的妻子。\n\n关于她的早期可能的历史提及，来源于罗马人与日耳曼民族的互动，通过所谓的“罗马式解释”过程，拉丁文文献将她与罗马神话中的女神伊西斯相比较。值得注意的是，这一历史提及也可能是指另一位女神弗劳乔，在北欧神话中后来被称为弗蕾雅。\n\n学者们对于弗蕾雅和女神弗丽嘉是否最终源自同一女神的问题存在争议。虽然这种可能性存在，并且她们确实有很多共同的特点，但这只是其中一种理论。还有其他的理论认为她们确实源自两位不同的女神。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_frijjoshmi:0 "弗丽乔希米"
 omen_frijjoshmi_desc:0 "美丽的女神弗丽嘉和幸运的女神拉克希米合为一体，成为了弗丽乔希米。爱与幸运的组合十分强大，尽管在我们的混合信仰中，有些人觉得奇怪的是，弗丽乔希米既是布罗德纳兹的妻子，也是维什图纳兹的妻子。"
 omen_gautr:0 "高塔兹"
 omen_gautr_desc:0 "高塔兹，意为“倾倒”，是沃登纳兹的众多名字之一，沃登纳兹在北欧神话中被称为奥丁，也是罗马文献中首次提到的名字。他经常被描绘与两只乌鸦相伴，这两只乌鸦会告诉他地球上发生的所有事件（在古诺尔斯语中被称为胡金和穆金），并且他只有一只眼睛，因为他牺牲了一只眼睛以换取更多的智慧。"
 omen_haimadallaz:0 "哈伊马达拉萨"
 omen_haimadallaz_desc:0 "\"哈伊马达拉萨\" 是古日耳曼多神教中一位古老神祇的名字，他与北欧神话中的神祇海姆达尔相对应。虽然我们不知道古日耳曼人如何称呼这位神祇，但有证据表明，在北欧众神与日耳曼众神体系分化之前，海姆达尔就已经是一位备受尊敬的神祇。\n\n根据对北欧神话的推断，Haimadallaz 与守护和保护神之居所相关联。他的名字似乎也根植于这一概念之中，“Haimaz”意味着“家”，而“Dallaz”意味着“树”，因此他被视作神之居所及世界之树的守护者。\n\n虽然并非所有学者都同意这一点，但有人提出哈伊马达拉萨也可能是一位性与生育之神。这种观点基于他与公羊这一象征男性生殖器的关联，以及与世界之树——生命之树的关联。此外，“Dallr”这个词有时还与生育女神弗丽嘉联系在一起。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_halja:0 "哈尔贾"
 omen_halja_desc:0 "哈尔贾，在北欧神话中后来被称为海尔，是一位日耳曼死亡女神和冥界的统治者，冥界与她的名字相同。虽然现存的唯一历史信息来源于她后来的北欧化身海尔，但有可能存在早期证据可以追溯到几个世纪之前的罗马时代。\n\n有人提出，几个模仿的日耳曼迁徙时期的奖章和饰牌（大约公元初几个世纪）可能描绘了她。特别是饰牌IK 14和IK 124描绘了一个骑手沿着斜坡下行，遇到了一位手持权杖或拐杖的女性。向下倾斜的斜坡可能表示骑手正朝着死者的领域前进，而手持权杖的女性可能是那个领域的女性统治者，这与哈尔贾相对应。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_irmin:0 "厄尔曼纳兹"
 omen_irmin_desc:0 "支撑世界的伟大支柱是厄尔曼苏利兹，它与神祇厄尔曼纳兹相关。厄尔曼纳兹是曼努兹的儿子之一，也是伊尔米诺恩斯的始祖。查理曼大帝后来摧毁了一棵名为伊尔明苏尔的树，激怒了维杜金德领导下的撒克逊人。"
 omen_istaevo:0 "伊斯提约"
 omen_istaevo_desc:0 "关于曼努兹的第三个儿子伊斯提约所知不多。伊斯特瓦埃翁斯后来联合起来成为法兰克人，他们声称自己和罗马人都是伊斯提约的后代，以此来将罗马融入法兰克的历史之中。"
 omen_luk:0 "卢科"
 omen_luk_desc:0 "卢科可能是北欧神祇洛基的一个早期原型。尽管洛基这个名字的词源已经经过了广泛的辩论，人们相信它的起源可能在于日耳曼语根 \"Luk\"，意为 \"锁\"。这位神祇的起源及其在神话中的角色一直受到学者们的激烈讨论，一些学者将其描述为一个捣蛋鬼神祇，而另一些则推测他可能是一个与炉火相关的神祇，类似于希腊女神赫斯提亚的角色。\n\n尽管在这个历史时期内并未找到关于他在早期日耳曼信仰中存在的确凿证据，就像其他北欧神祇一样，但一些学者认为，鉴于洛基在后来的北欧神话中扮演的重要角色，他在那个时期很可能已经存在了。\n\n#!神化效果：$economy_apotheosis_capital_citizens_effect_tt_description$"
 omen_mannus:0 "曼努兹"
 omen_mannus_desc:0 "被塔西佗称为曼努斯的曼努兹是我们祖先特维斯托的儿子，并且他自己生下了三个儿子，这三个儿子后来分散并定居世界各地。因此，他也是所有日耳曼民族的祖先，尽管有些部落坚持认为他有更多的儿子，即他们自己的祖先。作为第一个拥有人类生育能力的存在，因此他被视为这一能力的象征和守护神。"
 omen_thunraz:0 "多纳尔"
 omen_thunraz_desc:0 "多纳尔，在几个世纪后被北欧维京人称为索尔，是一位持有锤子的神祇，与闪电、雷鸣、风暴、神圣的树林和树木、力量、人类的保护以及圣化和生育相关联。作为一位极其重要的日耳曼神祇，多纳尔/索尔在日耳曼民族的历史记载中占据显著地位。\n\n历史上，最早的日耳曼民族记录是由罗马人留下的，在这些文献中，多纳尔/索尔通过一种称为“罗马式解释”的过程被频繁提及——这是一种基于罗马人认为相似的特点将非罗马神祇认定为罗马神祇的做法。在这种情况下，多纳尔/索尔常被与希腊-罗马神祇赫拉克勒斯相提并论，因为二者在力量和英雄特质上有相似之处。\n\n从罗马占领日耳曼尼亚地区开始，到日耳曼民族在迁徙时期的扩张，再到索尔在维京时代极高的声望，多纳尔/索尔始终是一位备受瞩目的神祇。他贯穿整个日耳曼民族历史的重要性表明了这位强大神祇跨越数百年及不同文化背景下持续不断的影响力。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_tiwaz:0 "提瓦兹"
 omen_tiwaz_desc:0 "提瓦兹（Tiwaz）是后来北欧神祇提尔（Tyr）的早期形态，是一位极具重要性的日耳曼战神。在北欧神话中——日耳曼各民族现存的大部分神祇传说均源自于此——他将自己的手献祭给怪物芬里尔（Fenrir）：当众神束缚这头巨狼时，芬里尔咬断了他的手臂；此外，预言还指出，在诸神黄昏（Ragnarök）期间，他将被另一头同样凶猛的怪物加姆（Garmr）吞噬。\n\n尽管提瓦兹的词源可追溯至原始印欧语时期，使其与宙斯和朱庇特存在关联，但在古诺斯语时期之前，关于这位神的直接记载却寥寥无几。与许多其他非罗马神祇一样，提瓦兹在拉丁文文献中是通过“罗马化解释”（interpretatio romana）这一过程被提及的，即拉丁文文献通过罗马神话中被认为与其对应的形象来指代该神，因此他被视为战神玛尔斯。\n\n#!神化效果：$war_apotheosis_martial_tech_effect_tt_description$"
 omen_wishnuaz:0 "维什图纳兹"
 omen_wishnuaz_desc:0 "本土印度人的神祇维施努是民众之神，与强大的托恩拉兹非常相似。因此，我们的联合信仰诞生了维什图纳兹。维什图纳兹以多种形式出现，在我们的民族形态中，他掌控着雷霆之力。他是我们与神圣领域之间的纽带。不知何故，他有时被称为摇摆不定的神祇。"
 omen_wodenaz:0 "沃登纳兹"
 omen_wodenaz_desc:0 "沃登纳兹是北欧神祇奥丁的一种早期形式，在日耳曼神话中是一位备受尊崇的神祇。北欧神话是关于他的大部分现存信息的来源，将他与智慧、治疗、死亡、皇权、绞刑架、知识、战争、战斗、胜利、巫术、诗歌、狂热和符文字母等联系起来，并把他描绘为女神弗丽嘉的丈夫。\n\n最早的日耳曼民族记录是由罗马人留下的，在这些文献中，沃登纳兹通过一种称为“罗马式解释”的过程被频繁提及——这是一种基于罗马人认为相似的特点将非罗马神祇认定为罗马神祇的做法。沃登纳兹常被与罗马神祇墨丘利相提并论。\n\n最早明确的例子出现在罗马历史学家塔西佗在1世纪晚期的作品《日耳曼尼亚志》中，他在描述苏维比人（一个日耳曼民族联盟）的宗教时写道：“在诸神中，墨丘利是他们主要崇拜的对象。他们认为在固定的日子向他献祭，包括人祭和其他祭品，是一项宗教义务。”\n\n#!神化效果：$culture_apotheosis_characters_effect_tt_description$"
 omen_wulthuz:0 "乌尔图兹"
 omen_wulthuz_desc:0 "乌尔图兹，在北欧神话中被称为乌尔，是一位重要的日耳曼神祇。他与冬天、狩猎和射箭相关联。据说他是一位出色的滑雪者，并经常被描绘身穿滑雪装备并手持弓箭。一些资料还将他与宣誓和正义联系起来，因为他的名字“乌尔图兹”意味着荣耀和正义。\n\n关于这位神祇的很多知识已经遗失，因为在现存资料编纂的时候，人们对“乌尔图兹”的记忆已经淡漠（这可能表明他比其他北欧神祇更为古老，因此可能源自更早版本的神话）。\n\n#!神化效果：$culture_apotheosis_characters_effect_tt_description$"
 omen_yngvi:0 "英戈瓦兹"
 omen_yngvi_desc:0 "我们的主神，在日耳曼语中称为弗劳亚兹，在古诺尔斯语中成为弗雷尔，英戈瓦兹是曼努兹的儿子之一，也是因格瓦埃翁斯的始祖。挪威的国王们后来追溯他们的血统至他们称之为英吉的繁荣之神。"

 omen_ajita:0 "阿耆多·翅舍钦婆罗"
 omen_ajita_desc:0 "阿耆多·翅舍钦婆罗被认为是#E 顺世论#!的#G 创始人#!，或至少是组织该信仰的最重要人物。无论如何，#E 顺世论#!大量引用他的著作。阿耆多是#Y 印度唯物主义#!的首位已知倡导者。他与其他#E 沙门#!信仰领袖如#E #T 悉达多·乔达摩#!、#Y 大雄#!和#G 末伽梨·拘舍罗#!#!是同时代人。\n\n在#E 佛教#!文献中，阿耆多身披纯毛毯，既不耐热也不耐寒，据说还散发着恶臭。此外，阿耆多之名意为\"不可征服\"，暗示他是一位激烈而热情的辩论家。他还被认为是#Y 断灭论#!的捍卫者，即死后#R 湮灭#!的学说。"
 omen_brihaspati:0 "祭主仙人"
 omen_brihaspati_desc:0 "伟大的导师与火之圣者！呵，祭主仙人来为一切提供咨议——从天神到追随者，乃至行星本身！\n\n祭主仙人很可能原本是一个真实人物，从他的教导中诞生了#E 顺世论#!。即使在主要信仰吠陀的人中，他仍然是一位受欢迎的人物。他成为了某种火神，常与阿耆尼等同。他在《祭主仙人经》中被大量引用。尽管该文本#R 拒绝#!吠陀，却仍被其他#E 沙门#!信仰以及#E 吠陀教#!所引用。祭主仙人宣扬#Y 反有神论#!和#Y 唯物主义#!，这是#E 顺世论#!的两项基本原则，他也常被认为是该思想的#G 创始人#!，尽管这仍有争议。"
 omen_charvaka:0 "遮罗迦"
 omen_charvaka_desc:0 "半神话人物遮罗迦可能负责#G 创立#!该信仰。当然，#E 顺世论#!传说中的其他几位人物也声称这一头衔，但遮罗迦本人是#E 顺世论#!名称的来源。如果他确实存在，很可能是在公元前8世纪之前，早于最早的#Y 唯物主义#!观点形成之时。"
 omen_payasi:0 "帕耶西"
 omen_payasi_desc:0 "帕耶西，也称佩西，是一位传说中的国王。据说他进行了多项实验，得出结论：灵魂并不存在——这是#E 顺世论#!信仰中#Y 唯物主义#!的标准教义。在#E 耆那教和佛教#!神话中，他在一场辩论中被驳倒并#R 皈依#!，然而，这些是敌对意识形态的观点，可能是为其他意识形态声称合法性的虚构。\n\n佛教传说表明帕耶西进行了多項残酷而不寻常的实验以确定灵魂不存在。这些故事中，有一个讲述了他如何将一个小偷在青铜罐中活活煮死，并质问灵魂怎么可能从这样的死亡中逃脱。"
 omen_pratyaksa:0 "现量"
 omen_pratyaksa_desc:0 "#Y 现量#!是感知的概念。对顺世论者而言，这是通往知识的唯一有效途径，其他获取知识的方式总是#R 有条件或无效的#!。相比之下，大多数其他印度思想学派都有两到六种不同的知识获取方式。感知有两种类型，#E 外在和内在#!。外在感知被描述为五种感官与世界对象相互作用产生的感知，而内在感知被该学派描述为内在感官——心的感知。"
 omen_yajnavalkya:0 "耶若婆佉"
 omen_yajnavalkya_desc:0 "耶若婆佉，或称耶吉耶婆佉，是一位吠陀-顺世论的圣人。他曾向同时代的女哲学家梅特雷伊（Maitreyi）发出著名宣言：死后没有意识，现实不过是纯粹的智慧。梅特雷伊则回应道：“……（原文残缺）”。"

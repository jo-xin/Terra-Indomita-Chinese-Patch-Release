 omen_mihr_oir:0 "密尔奥尔"
 omen_mihr_oir_desc:0 "神祇密赫尔·奥尔，自西方降临，如今以晨光赐福我们。\n\n'密赫尔·奥尔'中的'奥尔'意为'西方'。尽管与密特拉教及琐罗亚斯德教的神明密特拉/密赫尔有相似的外来渊源，但密赫尔·奥尔在巴克特里亚和粟特地区扮演着独特的光明与太阳神角色。"
 omen_nana_anahita:0 "娜娜-阿纳希塔"
 omen_nana_anahita_desc:0 "女神娜娜-阿纳希塔，这位来自异域的美丽神祇，赐予我们丰饶与平安分娩。  \n\n娜娜-阿纳希塔女神源自苏美尔神话中的娜娜，并深受波斯琐罗亚斯德教女神阿纳希塔的影响。在巴克特里亚和粟特地区，尽管身为外来神祇，她依然是民众——尤其是女性——尊崇的强大守护者。  "
 omen_ramset:0 "拉姆塞特"
 omen_ramset_desc:0 "拉姆塞特是西方之灵，拉姆之灵，愿拉曼神教化我们的人民。\n\n拉姆塞特（或称为拉曼）是一位常被描绘的神祇，也是许多巴克特里亚人名字的灵感来源。"
 omen_tishtar:0 "蒂什塔尔"
 omen_tishtar_desc:0 "神祇提什塔尔，是那位击溃邪恶、保护家园的伟大奇妙之神。\n\n提什塔尔神是瓦赫什神的一个称号或是其面貌之一。在提什塔尔的形式下，瓦赫什保护着他的信徒和人民。"
 omen_vakhsh:0 "瓦克什"
 omen_vakhsh_desc:0 "神主瓦赫什，恩赐的赐予者与心愿的成全者，伟大而神圣。  \n\n瓦赫什是瓦赫什河的至高神明，希腊人称之为奥克苏斯。他主宰着奥克苏斯河，成为巴克特里亚人、粟特人及周边民族所敬仰的地方神祇。瓦赫什能为我们的河流带来商贸繁荣与财富。"
 omen_vish:0 "维斯"
 omen_vish_desc:0 "维什是那位轻柔吹拂的风之神，为我们的人民带来荣耀与欢愉。\n\n维什（拼写为Vish 或 Wish）是风之神，与吠陀神话中的风神瓦尤有关。"
 omen_yamsh:0 "亚马什"
 omen_yamsh_desc:0 "神祇亚姆什，是那位要求我们为人民而战的神，他召唤我们勇敢地加入他的圣战军队。\n\n亚姆什，又称为亚姆或贾姆，是战争之神，人们通常向他祈祷，希望能够侍奉他并加入他的神圣军队。"
 omen_zhun:0 "朱尼"
 omen_zhun_desc:0 "神祇朱恩，是诞生于这个世界的首个精神存在，伟大的朱恩赋予我们生命。\n\n朱恩是一位拥有极大权能和文化的神祇，可能与伊朗人的神祇祖尔万有关联或者在其之前就已存在。"

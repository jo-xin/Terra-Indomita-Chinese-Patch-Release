 omen_achaviser:0 "阿卡维瑟"
 omen_achaviser_desc:0 "阿卡维瑟是一位神秘的神祇，他与女神图兰有关联，是她随从的一部分，但他并不是一位精灵。精灵是与拉萨相关的男性精灵，而拉萨则是女性生育仙女。由于阿卡维瑟被认为是一位正统的神祇，他可能扮演了比目前所知更重要的角色。"
 omen_aesernia:0 "艾瑟妮娅"
 omen_aesernia_desc:0 "艾瑟妮娅是一位在意大利中部和南部受到崇拜的意大利民族女神。她主要与农业、生育力和丰收相关联。艾瑟妮娅最初可能是萨姆奈特人的女神，或者也可能来自萨姆奈特人以南的部落；无论如何，在崇拜她的人们看来，她是一位重要的女神。城市艾瑟妮娅便是以她的名字命名的，很可能她是这座城市的守护女神。"
 omen_aita:0 "埃塔"
 omen_aita_desc:0 "艾塔是冥界与狼之神。他深受希腊神哈得斯影响，但可能早在希腊影响到来前便已存在，后来才逐渐适应并变得更像哈得斯。最初，他很可能与另一位狼神卡卢关系密切。"
 omen_alpan:0 "阿尔潘"
 omen_alpan_desc:0 "阿尔潘是伊特鲁里亚的一位女神，她的名字与伊特鲁里亚语中表示“愿意”的词汇相同。如同许多并非源自希腊的伊特鲁里亚神祇一样，阿尔潘也是一位冥界女神。她通常被描绘成全身裸露的形象，以此来象征她作为性活动女神的身份。"
 omen_altinos:0 "阿尔蒂诺斯"
 omen_altinos_desc:0 "阿尔蒂诺斯是一位主要在维涅托地区的阿尔蒂努姆城所崇拜的神祇。他是一位治愈之神，很可能是阿尔蒂努姆的守护神。因此，他对于维涅托人来说可能是一位重要的神祇，但并没有太多证据表明他的崇拜超出了这个范围。"
 omen_aminch:0 "亚敏科"
 omen_aminch_desc:0 "亚敏科或亚敏特是一位与爱欲和性欲望相关的儿童神祇。他被拿来与罗马神祇阿摩尔相比，后者后来成为众所周知的丘比特。亚敏科也是戈尼之一，这些强大的男性圣灵隶属于女神图兰。"
 omen_anaceta:0 "阿纳切塔"
 omen_anaceta_desc:0 "阿纳切塔是一位生育、谷物和母性关系的女神。她受到了萨贝利安人的崇拜，并与罗马女神刻瑞斯相等同。阿纳切塔可能是一个由刻瑞斯和安吉蒂娅组成的复合神祇。另一种理论提出，阿纳切塔仅仅是安吉蒂娅的一个面貌。然而，阿纳切塔也可能既不是上述任何一种情况，而是作为一个独立于刻瑞斯或安吉蒂娅之外的萨贝利安本地女神。"
 omen_angitia:0 "安基提亚"
 omen_angitia_desc:0 "安基提亚是马尔西人以及意大利许多奥斯坎-翁布里纳民族的女神。安基提亚是一位非常重要的女神，与蛇和驯蛇者相关联。她还与音乐、魔法和治疗有关。有可能她起源于希腊神话，但她崇拜在意大利的广泛传播或许能证明情况并非如此。她可能是马尔西人的国家女神，并据说居住在富奇内湖附近，在那里她治愈蛇咬伤的人。"
 omen_ani:0 "阿尼"
 omen_ani_desc:0 "阿尼是一位多面神祇。正因为如此，他常被与罗马神祇雅努斯相比。他还被与美索不达米亚的神祇安努相比较，因为安努也有类似的多面特质。阿尼是众多在伊特鲁里亚人与意大利中部其他意大利民族之间交流的神祇之一。"
 omen_anterstatai:0 "安特斯特塔伊"
 omen_anterstatai_desc:0 "女神安特斯特塔伊的信息来源于阿格农石板（Agnone Tablet），这块石板是在现代的阿格农发现的，阿格农位于古代城市博瓦尼乌姆附近。安特斯特塔伊被列入了一些重要的意大利神祇之中，例如马里斯和阿普卢。\n\n根据她的名字推测，安特斯特塔伊可能是一位边境保护女神。另一种理论认为，她的名字意味着“中间”或“其间”，因此她可能代表了一种“中间”的概念。“Anter”或“Inter”在拉丁语中意味着中间。无论她的具体性质如何，她很可能受到了萨贝利安人和其他中央及南部意大利文化的崇敬。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_apa:0 "阿帕"
 omen_apa_desc:0 "阿帕是一位母亲之神，她的名字在伊特鲁里亚语中的直接含义就是“母亲”。她与父亲之神阿提直接相关联，而阿提的名字则可以翻译为“父亲”。这对神祇可能是他们神系中最古老的神祇之一，这导致了他们的名字与简单的、日常使用的词汇产生了关联。"
 omen_apulu:0 "阿普鲁"
 omen_apulu_desc:0 "阿普卢显然是希腊罗马神阿波罗的伊特鲁里亚版本。阿普卢与太阳和健康相关，尤其与瘟疫中的健康相关。他也可能像阿波罗一样是音乐与诗歌之神。"
 omen_aril:0 "阿里尔"
 omen_aril_desc:0 "阿里尔是一位伊特鲁里亚神祇，他与希腊泰坦阿特卢斯相认同。关于阿里尔与阿特卢斯有何不同之处的信息不多，但很有可能阿里尔在伊特鲁里亚神话中扮演了与阿特卢斯相似的角色，尽管是以一位神祇而非泰坦的身份。"
 omen_artimit:0 "阿提密特"
 omen_artimit_desc:0 "阿提密特是一位伊特鲁里亚女神，她与阿图枚有着密切的关系，并且可能是阿图枚的一个版本或地方变体。无论如何，很明显阿提密特和阿图枚一样，受到了希腊女神阿耳忒弥斯的强烈影响或启发，并代表了类似的概念。"
 omen_artume:0 "阿耳图墨"
 omen_artume_desc:0 "阿尔图美是伊特鲁里亚的集会女神、动物之主，也是狩猎神祇。她很可能受到女神阿耳忒弥斯启发，或至少与其混同。"
 omen_athrpa:0 "阿斯尔帕"
 omen_athrpa_desc:0 "阿特帕是一位伊特鲁里亚女神，与希腊女神阿特罗波斯相对应。她是命运和宿命的女神。她也是希腊神话中命运三女神之一，即灰色姐妹之一，并且与她的两位同样掌管命运的姐妹有着密切的联系。"
 omen_ati:0 "阿提"
 omen_ati_desc:0 "阿提是伊特鲁里亚神话中的父亲之神，他的名字在伊特鲁里亚语中直接翻译为“父亲”。他与母亲之女神阿帕直接相关联，而阿帕的名字则翻译为“母亲”。这对神祇可能是他们神系中最古老的神祇之一，这导致他们的名字与简单的日常词汇产生了关联。"
 omen_atunis:0 "阿图尼斯"
 omen_atunis_desc:0 "阿图尼斯是一位极其重要的生育之神。他的希腊对应神祇，同时也是可能的灵感来源，是阿多尼斯。阿图尼斯与图兰有着紧密的联系，可能是她的配偶或恋人。虽然在希腊版本中他是凡人，但在伊特鲁里亚文化中，阿图尼斯被神化了，因此他在伊特鲁里亚神话中可能扮演了一个更重要的角色。"
 omen_calu:0 "卡鲁"
 omen_calu_desc:0 "卡卢是一位冥界的狼神。他可能是最初的冥界统治者，在与艾图等同之前，艾图是伊特鲁里亚版本的哈迪斯。或者，卡卢可能是一位较为次要的冥界神祇，后来与哈迪斯合并，从而获得了与艾图同等的重要性。"
 omen_castur:0 "卡斯图尔"
 omen_castur_desc:0 "卡斯图尔是一位与希腊版本的卡斯托尔相关的神祇。他与其双胞胎兄弟普尔图可相关联。这对双胞胎神祇与海上的风有关。两兄弟还以优秀的骑手著称，并出现在了希腊特洛伊故事中。"
 omen_catha:0 "卡塔"
 omen_catha_desc:0 "卡塔或卡塔斯是一位伊特鲁里亚的母性女神。她可能既是月神也是太阳女神，同时也是一位冥界的女神。她还与太阳相关联。卡塔还以其女儿而闻名，这位女儿仅被称为“卡塔·塞克”，意为“卡塔的女儿”。"
 omen_cathas_sech:0 "卡塔斯·塞克"
 omen_cathas_sech_desc:0 "卡塔斯·塞克意味着“塞克的女儿”。她可能类似于罗马万神殿中的太阳神索尔·因维克图斯，事实上，卡塔斯·塞克可能直接指的是伊特鲁里亚版本的这一神祇。这意味着卡塔斯·塞克很可能与太阳和光明有关联。"
 omen_cels:0 "刻尔斯"
 omen_cels_desc:0 "凯尔斯，也称凯尔，是巨人之母。她可能像希腊人的盖亚那样代表大地。她被描绘为保护凯尔斯克兰免受战神拉兰伤害。凯尔斯克兰是一名巨人，其名意为凯尔之子。"
 omen_charum:0 "卡鲁"
 omen_charum_desc:0 "卡鲁，或卡伦，是一位基于希腊神话中的卡戎的神祇。他经常与万特，一位冥界的恶魔或女神相联系。尽管名字与卡戎相似，卡鲁已经从他的希腊版本中发展出了非常独特的形象。他拥有尖耳朵、一把锤子、蓝色皮肤、类似蛇的头发以及巨大的翅膀。"
 omen_cilen:0 "西伦"
 omen_cilen_desc:0 "西伦或称塞伦斯是伊特鲁里亚的夜之女神。关于这位神秘的女神我们所知甚少，她仅有的记载是一座头部脱落的雕像。由于她的主题非常宽泛，她可能是一位较古老的神祇，在人气衰落之后，可能也在雷提安神系中受到崇拜。"
 omen_culalp:0 "库拉普"
 omen_culalp_desc:0 "库拉普是一位神秘的神祇，与神祇库桑斯有关联，可能被认为是库桑斯的一个方面。一些学者认为库拉普可能也与奥潘有关联，可能是库桑斯和库拉普的结合体，但也有可能库拉普独立于两者之外。"
 omen_culsans:0 "库尔山斯"
 omen_culsans_desc:0 "库尔桑斯是一位双面神，可能与罗马神祇雅努斯相似。他代表着二元性和过渡。一些学者提出，库尔桑斯这个名字可能源自伊特鲁里亚语中意为“门”的词语。"
 omen_cupra:0 "库普拉"
 omen_cupra_desc:0 "库普拉是一位生育女神，尤其受到翁布里亚人和皮切尼人的崇拜，但很可能在许多意大利民族的信仰中也占有位置。她可能是女神尤妮的一种形态。另一种可能是，她的名字来源于希腊女神阿佛洛狄忒的一个别名“库普丽亚”。还有一种理论认为，她的名字与罗马神祇丘比特的名字有着相同的词源。"
 omen_damia:0 "达米娅"
 omen_damia_desc:0 "达米亚是众多被提议作为更为人熟知的女神博纳·德亚（即“好女神”）的名字之一。她是一位生育和贞洁女神，主要受到女性的崇拜。她的仪式允许女性饮用烈酒以及进行血祭，这些在其他情况下是禁止她们做的。在罗马，她的崇拜仪式由维斯塔贞女主持。确定她真实名字之所以困难的一个原因是男性被禁止完全了解这个名字。尽管如此，仍有三分之一的献祭来自男性。"
 omen_diana_nemorensis:0 "狄安娜"
 omen_diana_nemorensis_desc:0 "意大利的狄安娜与赫伦诺-罗马的女神狄安娜有所不同。罗马人也称她为狄安娜·尼莫伦西斯，她是狩猎、妇女和动物的女神。她经常被视为月亮女神，并与希腊女神阿耳忒弥斯相等同。\n\n罗马人之所以称她为狄安娜·尼莫伦西斯，是因为她的圣殿位于尼米湖附近的森林中。尼米湖是她最重要的崇拜地点。"
 omen_egeria:0 "埃杰丽娅"
 omen_egeria_desc:0 "埃杰丽娅是古罗马神话中自然界的宁芙女神。她会为朝圣者提供指引和帮助。妇女们常常祈求埃杰丽娅以期能够怀上孩子或确保新生儿的安全。她有时被描绘为一位美丽的年轻女子，手捧装满水果、花朵或其他象征丰饶与繁荣的篮子。\n\n根据传说，埃杰丽娅是努马·庞皮利乌斯的情人，努马是罗马的一位传奇国王，以其虔诚和智慧而闻名。据说埃杰丽娅曾向努马提供国家事务和宗教实践方面的建议，并教会了他维斯塔贞女的神圣仪式。\n\n#!神化效果：$fertility_apotheosis_capital_slaves_effect_tt_description$"
 omen_enie:0 "埃妮"
 omen_enie_desc:0 "埃妮是伊特鲁里亚版的女神恩优。作为战神，埃妮很可能与她的希腊对应神祇相似。她也是希腊神话中的灰衣姐妹之一。这意味着她是一位与命运紧密相关的女神，并与她的两位姐妹一起，共同掌管命运。"
 omen_ethausva:0 "埃塔乌斯瓦"
 omen_ethausva_desc:0 "埃塔乌斯瓦是一位与分娩相关的次要神祇。她主要在一幅描绘中与其他两位分娩女神塔尔娜和塔尔一同出现。她还在一幅描绘阿普卢诞生的画面中被描绘为接生婆。尽管她似乎并不广为人知，但她很可能拥有自己的崇拜者群体。"
 omen_evan:0 "伊万"
 omen_evan_desc:0 "厄万是图兰随从中的一位女神。虽然有时她被认定为拉萨，但她更可能是一位女神本身，并被视为图兰的亲密伴侣。她的名字从词源学上与伊特鲁里亚语中表示“时间”的词汇相关，这可能暗示她是时间女神。"
 omen_feronia:0 "费罗尼亚"
 omen_feronia_desc:0 "费罗尼亚是一位古老而受人尊敬的女神，她掌管野生动物、生育能力和健康。她还以解放奴隶、赋予公民权利以及作为社会底层人民的守护神而闻名。因此，费罗尼亚尤其受到自由民和贫民的崇拜。由于她的崇拜可能早于希腊文化对意大利的影响，她在当地的传统和信仰中占据了一个独特的位置。"
 omen_fides:0 "菲德斯"
 omen_fides_desc:0 "菲德斯是古罗马的一位女神，代表着信任和诚实。她实际上是古罗马神系中最主要的神祇之一，并将忠诚和可靠的价值观融入了罗马文化之中。她的节日被称为菲德西亚，并且在法律合同中经常被祈求。\n\n菲德斯与罗马国家密切相关，她的神庙位于罗马的罗马广场附近。她的祭司被称为“费德尔斯”，负责维护公众的信任，并确保誓言和条约得到遵守。\n\n菲德斯通常被描绘为一位手持丰饶角的年轻女子，或者是一位右手放在心口、左手伸展、手掌朝上的少女。有时她也会被描绘为手持天平的形象，象征着信任与不信任之间的平衡。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_fladukia:0 "弗拉杜基娅"
 omen_fladukia_desc:0 "在对抗维涅托部落和翁布里亚部落的一场战斗中，一名维涅托人战士发射了一支箭。箭头上刻有一段文字，请求马里西人的女神弗拉杜基娅赐福这次射击。这里提到的“马里西”可能是指该地区的翁布里亚人而非真正的马里西人，但这一铭文暗示了女神弗拉杜基娅受到翁布里亚人的崇拜，并且很可能也被维涅托人所接纳为他们的女神之一。根据铭文的性质，弗拉杜基娅很可能是一位战神，并且可能也是一位幸运女神。\n\n#!神化效果：$war_apotheosis_martial_tech_effect_tt_description$"
 omen_fufluns:0 "弗福伦斯"
 omen_fufluns_desc:0 "福夫伦斯是一位极其重要的神。福夫伦斯常被等同于狄俄尼索斯或罗马的利柏尔，是健康、欢乐，当然也是葡萄酒之神。他与葡萄酒的关联可能直接受到希腊影响。有时据说他也是众多冥界神之一。福夫伦斯还可能与其母塞姆拉有亲密或浪漫关系。除塞姆拉外，福夫伦斯也与卡塔有关联。"
 omen_hercle:0 "赫克勒"
 omen_hercle_desc:0 "赫尔克勒显然是希腊神赫拉克勒斯的伊特鲁里亚版本。尽管灵感来源清楚，伊特鲁里亚神祇往往会形成有别于希腊解释的自身表现。他被描绘为手持棍棒的强壮形象。据说赫尔克勒是提尼亚与乌尼之子。与其希腊对应神相比，赫尔克勒更被视为近似神谕的神。"
 omen_hinthia:0 "因提亚"
 omen_hinthia_desc:0 "因提亚是图兰随从中的一位女神。虽然关于她的情况我们知之甚少，但她很可能是一位冥界的女神，特别是与鬼魂有关。实际上，她的名字似乎表明她可能特别代表鬼魂，而不是一般的“死者”概念。"
 omen_laran:0 "拉兰"
 omen_laran_desc:0 "拉兰，或称拉伦，是居于冥界的战神。他常被等同于阿瑞斯和玛尔斯，是边界守护者与和平维护者。他是九位能够召唤闪电的意大利神之一，这些神被称为诺文西勒斯。他常被描绘为一名青年，除头盔、盾牌和长矛外几乎不着衣物。"
 omen_lasa_achunanu:0 "拉萨·阿库纳努"
 omen_lasa_achunanu_desc:0 "拉萨是一个用来指称一类神祇的术语。她们是女神图兰宫廷中的重要组成部分，并常常代表着女神的不同面貌。拉萨·阿楚纳努就是这些神祇之一。关于这位神秘的拉萨，我们并没有更多的信息。"
 omen_lasa_racuneta:0 "拉萨·拉库涅塔"
 omen_lasa_racuneta_desc:0 "拉萨是用来指称一类神祇的术语。她们是女神图兰宫廷中的重要组成部分，常常被视为图兰的不同面貌。拉萨·拉库内塔就是这些神祇之一。关于这位神秘的拉萨，目前没有更多的信息。"
 omen_lasa_sitmica:0 "拉萨·西特米卡"
 omen_lasa_sitmica_desc:0 "拉萨是用来指称一类神祇的术语。她们是女神图兰宫廷中的重要组成部分，并常常代表着女神的不同面貌。拉萨·西特米卡就是这些神祇之一。关于这位神秘的拉萨，我们并没有更多的信息。"
 omen_lasa_vecu:0 "拉萨·维库"
 omen_lasa_vecu_desc:0 "拉萨是一个术语，用来指称一类神祇。它们是女神图兰宫廷的重要组成部分，常常被视为图兰的不同面貌。拉萨·维库就是这些神祇之一。她是唯一一位我们了解更多细节的拉萨，这得益于她与一位名为韦戈亚的预言家的关联。据说她对神圣的伊特鲁里亚书籍和著作有很大的影响。"
 omen_latun:0 "拉吞"
 omen_latun_desc:0 "拉吞是一位伊特鲁里亚女神，她受到了希腊女神拉托娜（又称为勒托）的启发或影响。虽然我们不太清楚拉吞与拉托娜有何不同，但很可能拉吞就像拉托娜是阿波罗的母亲一样，是阿普卢的母亲。"
 omen_leinth:0 "莱因特"
 omen_leinth_desc:0 "莱因特是一位与女神图兰有关联的神祇，作为她随从的一部分。与其他次要神祇不同的是，关于莱因特的身份有更多的理论。由于他的名字根源于与死亡或濒死相关的词源，很可能莱因特与死亡有所关联。同时，也很有可能莱因特实际上是一位女神；但由于伊特鲁里亚和意大利神祇性别上的模糊性，我们无法确定其确切性别。"
 omen_letha:0 "勒塔"
 omen_letha_desc:0 "勒塔，也称为勒檀、勒滕斯、勒滕丝或勒沓，是一位来自冥界的女神。她被称为冥界女神，这意味着她是冥界众多神祇之一。"
 omen_mae:0 "迈"
 omen_mae_desc:0 "迈是一位掌管生育的女神，与希腊女神迈亚有着紧密的联系。尽管如此，她很可能在希腊化影响之前就已存在，并在之后与迈亚等同起来。梅可能是一位重要的女神，并且可能是罗马人五月这个月份名称的灵感来源。梅也可能像迈亚对于罗马人一样，是一位大地女神。"
 omen_malavisch:0 "马拉维施"
 omen_malavisch_desc:0 "马拉维施是图兰随从中的一位女神。她是爱与美的女神，同时也是一位新娘之神。马拉维施很可能主要在婚礼期间受到崇拜，并且被描绘为与其他图兰的神祇一起帮助准备即将结婚的女子。她的名字来源于伊特鲁里亚语中表示柔和与女性特质的词汇。"
 omen_mania:0 "玛尼阿"
 omen_mania_desc:0 "曼尼亚，或称马尼亚，是一位死亡女神，同时也是灵魂和混乱的女神。据说她是冥界的统治者之一。她还被认为是拉萨的母亲，拉萨是代表生育力的女性仙女。"
 omen_manth:0 "曼斯"
 omen_manth_desc:0 "曼斯是曼尼亚的配偶，曼尼亚是冥界的统治者之一。曼斯有时也被等同于苏里斯神，或是拉丁语版本的索拉纳斯。作为冥界的神祇夫妇，曼斯和曼尼亚共同负责管理死者的灵魂。"
 omen_maphitis:0 "玛俾提斯"
 omen_maphitis_desc:0 "玛俾提斯(Maphitis)或玛菲提斯(Mafitis)是一位意大利的女神，掌管有毒气体。她很可能最初是一位萨贝利安人的女神，尽管总体上是一位较次要的女神，但她的崇拜依然得到了传播。由于火山喷发时会释放危险气体，因此她与火山有所关联，并且即使是在庞贝城也有对她的崇拜。"
 omen_marica:0 "玛莉卡"
 omen_marica_desc:0 "玛莉卡是一位与生育相关的女神，并且与罗马女神维纳斯有关联。对罗马人而言，玛莉卡后来成为了拉丁努斯之母的象征，而拉丁努斯是特洛伊战争中的一位英雄。不过，很有可能她的起源要早于该地区受到希腊化影响的时代。母亲女神的概念在意大利民族中是非常普遍的。"
 omen_maris:0 "马里斯"
 omen_maris_desc:0 "马里斯，也被萨贝利安人称为马默斯，是一位战神，很可能与罗马的战神玛尔斯是同一神祇，不过这一观点并非得到普遍认同。马里斯通常被描绘成婴儿或孩童的形象。据伊特鲁里亚人的说法，他是赫拉克勒斯的儿子。他很可能是众多神祇之一，在伊特鲁里亚统治并影响意大利中部地区时期被交流传播。"
 omen_mateer_matuta_desc:0 "黎明之光或晨曦女神。玛特尔·玛图塔是一位古罗马女神，其名意为母亲清晨。此外，玛特尔·玛图塔最终获得了水手们的极大崇敬，也成为了水手的女神，尽管这有所局限。玛特尔·玛图塔是意大利万神殿中普世的女神，受到各地的崇敬。"
 omen_mater_matuta:0 "玛图塔母神"
 omen_meanpe:0 "梅安佩"
 omen_meanpe_desc:0 "梅安佩，也称为梅安，是女神图兰随从中的一位女神。她经常与希腊万神殿中的胜利女神尼刻相关联。她可能在战争时期或是在取得战争胜利后特别受到人们的崇拜。"
 omen_menrva:0 "密涅瓦"
 omen_menrva_desc:0 "门尔瓦是智慧与战争之神，被视为类似希腊雅典娜的女神。她可能原本源自伊特鲁里亚，后来被许多受伊特鲁里亚影响的意大利民族接纳。她被认为是乌尼与提尼亚之女，这二者是伊特鲁里亚万神殿中最显赫的神祇之一。她也为希腊罗马女神弥涅耳瓦作出了许多贡献。"
 omen_mlacuch:0 "姆拉库奇"
 omen_mlacuch_desc:0 "姆拉库奇被描绘为女性和女性特质的女神。她最著名的神话包括她被绑架的情节，随后由神祇赫克勒将她救出。她的名字可能源自伊特鲁里亚语中表示“愉悦”或“讨人喜欢”，以及“高贵”或“美丽”的词语。"
 omen_munthuch:0 "穆恩楚克"
 omen_munthuch_desc:0 "穆恩楚克是伊特鲁里亚神话中的爱神。她是众多侍奉女神图兰的神祇之一。穆恩楚克似乎与爱情和健康的主题有关。她的名字来源于伊特鲁里亚语中的“出生”一词“Munthu”，因此很可能她是与分娩相关的多位神祇之一。她可能也是青少年和婴儿的守护神。"
 omen_nethus:0 "涅腾斯"
 omen_nethus_desc:0 "内通斯是井水、淡水和海洋的神祇。很有可能，内通斯这个名字与凯尔特神祇奈克坦有关。实际上，内通斯这个名字可能源于印欧语系的词汇，意为“侄子”。这一点清楚地表明内通斯并非起源于伊特鲁里亚，因此很可能是伊特鲁里亚人和中央意大利地区其他民族所采纳的众多神祇之一。目前认为，内通斯可能源自翁布里亚。内通斯后来成为了罗马人的海神涅普顿，并与希腊神祇波塞冬相融合。"
 omen_nortia:0 "诺耳提亚"
 omen_nortia_desc:0 "诺尔提亚是命运、时间与幸运女神，是一位遍布意大利诸地的强大神祇。著名的是，罗马人记载了她的钉子仪式：每逢新年，人们会在沃尔西尼她的神庙墙上钉入一枚钉子。"
 omen_orcus:0 "欧尔库斯"
 omen_orcus_desc:0 "奥库斯是可能在伊特鲁里亚人和他们周边的意大利民族之间交流的诸多神祇之一，他在冥界中占有重要地位。尽管奥库斯有时被视为整个冥界的代表，但他似乎并不是冥界的最高神。后来，奥库斯与希腊神话中的哈迪斯、罗马神话中的普卢托、狄斯帕特、索拉努斯以及苏里斯等神祇混同在一起。如果他不是冥界的主宰，那么他至少是一位死亡之神。"
 omen_pacha:0 "帕查"
 omen_pacha_desc:0 "帕查是一位常被与巴克斯神，即希腊的狄俄尼索斯神相等同的神祇。他也与卡塔斯和富富伦斯有关联。考虑到他与其他多位神祇的关联，很可能他最初是一个独立的神祇，在后来才与其他神祇产生了联系。"
 omen_pemphetru:0 "佩姆菲特鲁"
 omen_pemphetru_desc:0 "佩姆菲特鲁是伊特鲁里亚女神，与希腊神话中的命运三女神之一佩姆弗雷多相对应。这意味着她是一位命运女神，并且与她的两位同样掌管命运的姐妹有着密切的联系。"
 omen_perthan:0 "佩坦"
 omen_perthan_desc:0 "佩坦或珀尔坦是一位与冥界最高神祇之一卡尔紧密相关的女神。有可能佩坦实际上是卡尔的得力助手，或者是卡尔的配偶。"
 omen_phersipnei:0 "裴尔西普内"
 omen_phersipnei_desc:0 "裴尔西普内是一位深受希腊女神珀耳塞福涅影响的女神。如同珀耳塞福涅一样，裴尔西普内是冥界之神艾塔的配偶。他们共同统治着冥界。"
 omen_pulchisf:0 "普尔奇斯夫"
 omen_pulchisf_desc:0 "普尔奇斯夫是戈尼的一部分，隶属于女神图兰的随从，祂通常与别的戈尼、拉萨以及各种其他神祇相伴。戈尼有时也被视为冥界的精神，或是被认为是拉萨的对立面或反面。"
 omen_pultuce:0 "普尔图克"
 omen_pultuce_desc:0 "普尔图克是一位与希腊版本中的波吕克斯相关的神祇。他与他的双胞胎兄弟卡斯图尔相关联。这对双胞胎神祇与海上的风有关。两兄弟也以优秀的骑手著称，并且出现在了希腊特洛伊故事中。"
 omen_qurinus:0 "奎里努斯"
 omen_qurinus_desc:0 "奎里努斯是一位古老的、前希腊化的罗马战神。最初他可能是萨贝利安神祇，但后来在罗马变得更为流行。罗马人认为奎里努斯是罗慕路斯的神化形式，罗慕路斯是罗马著名的奠基者。因此，奎里努斯被视为罗马人民的保护神，并且在每年的2月17日庆祝他的节日——奎里努斯节，以纪念这位神祇。"
 omen_rath:0 "拉斯"
 omen_rath_desc:0 "拉思是一位常被与阿波罗相提并论的年轻神祇。他可能拥有与阿波罗相似的属性。值得注意的是，他在塔尔昆纳有一座圣殿。虽然拉思在多处铭文中被提及，但我们对他的了解并不多，只知道他与阿波罗有所比较。"
 omen_reitia:0 "雷提亚"
 omen_reitia_desc:0 "女神瑞蒂娅是北亚得里亚海地区最著名的女神。她主要受到维涅托人的崇拜，但也被周边部落所敬奉。瑞蒂娅备受尊崇，可能是维涅托人最重要的神祇之一。她代表着对维涅托人来说多种多样的主题，如书写、生育、战争和母性。她经常被描绘手持盾牌和长矛。她的崇拜一直延续到了罗马时期，这证明了她在该地区的重要性。"
 omen_reschual:0 "勒斯库亚尔"
 omen_reschual_desc:0 "雷斯丘亚尔是女神图兰随从中的一位女神。关于她的情况我们了解不多，但她并非拉萨，这意味着她在图兰的随从中可能是一位较为显著的神祇。"
 omen_sacni_nithi_eis:0 "萨奇尼·尼西·埃伊斯"
 omen_sacni_nithi_eis_desc:0 "“萨奇尼·尼西·埃伊斯”翻译为“隐藏的女性之主”。这些隐藏的神祇，或称为“迪伊·英沃卢蒂”，是一群并未被直接崇拜但被认为是统治所有其他神祇的最高神祇。因此，“萨奇尼·尼西·埃伊斯”作为“迪伊·英沃卢蒂”的代表，是一位生育女神。"
 omen_sacni_triumpi_ais:0 "萨奇尼·特里温皮·艾斯"
 omen_sacni_triumpi_ais_desc:0 "“萨奇尼·特里温皮·艾斯”翻译为“隐藏的胜利之神”。这些隐藏的神祇，或称为“迪伊·英沃卢蒂”，是一群并未被直接崇拜但被认为是统治所有其他神祇的最高神祇。因此，“萨奇尼·特里温皮·艾斯”作为“迪伊·英沃卢蒂”的代表，是一位战争之神。"
 omen_sacni_zamthi_ais:0 "萨奇尼·扎姆西·艾斯"
 omen_sacni_zamthi_ais_desc:0 "“萨奇尼·扎姆西·艾斯”翻译为“隐藏的黄金之神”。这些隐藏的神祇，或称为“迪伊·英沃卢蒂”，是一群并未被直接崇拜但被认为是统治所有其他神祇的最高神祇。因此，“萨奇尼·扎姆西·艾斯”作为“迪伊·英沃卢蒂”的代表，是一位财富之神。"
 omen_sacni_zichi_eis:0 "萨奇尼·齐基·埃伊斯"
 omen_sacni_zichi_eis_desc:0 "“萨奇尼·齐基·埃伊斯”可以翻译为“隐秘的智慧女神”。隐藏的神祇，或称为“迪伊·英沃卢蒂”，是一群并不直接被崇拜但被认为是最高的神祇，他们统治着所有其他的神祇。因此，“萨奇尼·齐基·埃伊斯”作为文化女神，是“迪伊·英沃卢蒂”的代表之一。"
 omen_sancus:0 "桑库斯"
 omen_sancus_desc:0 "桑库斯是一位掌管信任的神祇，通常与菲德斯相联系。他还掌管誓言、婚姻、法律和契约。桑库斯是一位非常古老的神祇，在罗马受到崇敬，很可能源自希腊化之前的意大利影响。有可能桑库斯源自翁布里亚人的影响。"
 omen_satre:0 "萨特雷"
 omen_satre_desc:0 "萨特雷或萨特雷斯是一位可能与赫伦诺-罗马的土星神有相似起源的神祇。萨特雷是一位令人畏惧且危险的神祇，能够驾驭闪电。萨特雷很可能是伊特鲁里亚人与周边意大利中部民族，包括罗马人在内，相互交流的众多神祇之一。"
 omen_selvanus:0 "塞尔瓦努斯"
 omen_selvanus_desc:0 "塞尔瓦努斯，也称为塞尔万斯，是一位边界之神，可能还掌管政治边界的完整。考虑到他在伊特鲁里亚和罗马资料中的描绘，塞尔瓦努斯可能是公元前6世纪伊特鲁里亚人和意大利中部其他民族共享的众多神祇之一。在罗马的描绘中，塞尔瓦努斯通常被描绘为一位留着胡须的男子，这与伊特鲁里亚人将塞尔万斯描绘为一位赤裸的年轻少年形成了鲜明对比。"
 omen_sethlans:0 "塞斯兰斯"
 omen_sethlans_deity:0 "塞特兰斯是一位火、锻造和金属工艺之神。塞特兰斯是一位古老的神祇，常被与像帕塔、武尔坎和赫菲斯托斯这样的神祇相比较，尽管很明显他要么是意大利本土的神祇，要么是伊特鲁里亚的神祇。"
 omen_snenath:0 "斯内纳特"
 omen_snenath_desc:0 "斯内纳特是图兰随从中的一位女神。虽然关于她的情况我们知之甚少，但她名字的词源被认为意味着“女仆”或“侍女”，因此很可能她的角色作为女神主要是为了服务于图兰。她的名字也可以被理解为“伴侣”，这暗示了她可能与爱情和友谊的概念有所关联。"
 omen_soranus:0 "索兰纳斯"
 omen_soranus_desc:0 "索拉努斯是一位具有多重身份的神祇，在古罗马宗教中他既是大地与治愈之神，也是冥界之神。他可能源自一般的意大利地区，有可能来自萨宾人或法利斯坎人，并且被纳入了古老的罗马神系之中。随着时间的发展，索拉努斯的崇拜逐渐被阿波罗所取代，因此阿波罗有时也被称作阿波罗·索拉努斯。"
 omen_summanus:0 "松玛努斯"
 omen_summanus_desc:0 "松玛努斯是夜间的雷神。正因为如此，有时他会被认为是宙斯的孪生兄弟或是对立的孪生兄弟。这种比较很可能是后来做出的，而松玛努斯的性质总体上并不为人所知。不过，考虑到与希腊神祇宙斯的比较，可以推测松玛努斯在当时也是受到尊崇的。"
 omen_suris:0 "苏里斯"
 omen_suris_desc:0 "苏里斯或称苏里是冥界中的一位治疗之神。他很可能就是索拉纳斯的一个版本，或者至少与索拉纳斯有所融合，因此后来也被与阿波罗神相混淆。索拉纳斯和苏里斯很可能是同一个神祇，并且这种混淆可能起源于伊特鲁里亚人在意大利中部占据主导地位的时期，在那个时期许多神祇被互相交流，包括法利斯坎人的神祇索拉纳斯或是伊特鲁里亚人的神祇苏里斯。"
 omen_svutaf:0 "斯武塔夫"
 omen_svutaf_desc:0 "斯武塔夫是女神图兰随从之一。他仅以圣灵的身份为人所知，代表了图兰麾下的男性圣灵。圣灵有时也被视为冥界的圣灵，或者被认为是与拉萨（女性圣灵）相对或相反的存在。"
 omen_tages:0 "塔戈斯"
 omen_tages_desc:0 "塔吉斯是对伊特鲁里亚人民定居传说的神化，同时也被视为伊特鲁里亚人的预言者。有时人们认为他是提尼亚的孙子。传说中，塔吉斯降临到人间，被一位伊特鲁里亚农民发现。塔吉斯赋予这位农民占卜的知识。"
 omen_tece:0 "特克"
 omen_tece_desc:0 "特克或特库姆是一位贵族和统治阶级的神祇。关于这位神祇的信息并不多，但他在皮亚琴察肝脏图中被提及，这表明他可能拥有崇拜者。\"皮亚琴察肝脏图\"是一种古代占卜工具，上面刻有各种神祇的名字，用于指导占卜仪式。"
 omen_thalna:0 "塔尔娜"
 omen_thalna_desc:0 "塔尔娜是一位与分娩紧密相关的女神。人们可能认为她在许多与分娩相关的宗教仪式中都存在。在神话中，她参与了多位重要神祇的诞生。此外，她可能与另一位神祇塔尔共同组成了一组，后者同样出现在多位重要神祇的诞生现场，但这些场合中并没有塔尔娜的身影。"
 omen_thanr:0 "坦尔"
 omen_thanr_desc:0 "坦尔是一位主要掌管分娩的女神。她很可能被认为参与了许多与分娩相关的宗教仪式。在神话中，她在几位重要神祇的诞生时都在场。她也可能与另一位神祇塔尔娜一同出现，后者同样在多位重要神祇的诞生时在场，但这些场合中可能没有坦尔的身影。"
 omen_thesan:0 "忒珊"
 omen_thesan_desc:0 "忒珊是黎明女神。她与罗马女神奥罗拉和希腊女神厄俄斯相认同。她代表着占卜、分娩和生命。忒珊通常被描绘为一位长有翅膀的裸体女神。"
 omen_tinia:0 "提尼亚"
 omen_tinia_desc:0 "提尼亚是伊特鲁里亚人的主神之一，亦称廷、廷赫、廷斯或提娜，地位极为重要。他是天空之神，常被拿来与朱庇特和宙斯相比。有些学者认为他位居维尔塔或维尔图姆纳之后；由于与宙斯和朱庇特的比较，他在伊特鲁里亚或许获得了更高重要性。提尼亚也是能够挥使闪电的九神之一。其配偶是女神乌尼，他还是赫尔克勒与门尔瓦的父亲，这很可能受到希腊影响。"
 omen_tiv:0 "提乌"
 omen_tiv_desc:0 "蒂夫，也称为蒂弗或蒂乌尔，是一位夜晚和月亮女神。她经常被拿来与希腊女神塞勒涅和罗马女神卢娜相比。蒂夫的名字可能意味着“月份”或“明亮”，可能指的是每月追踪月亮的变化周期。"
 omen_tlusc:0 "特卢斯克"
 omen_tlusc_desc:0 "特卢斯克是一位可能与桑库斯关系密切的神祇。据说桑库斯的领域紧邻特卢斯克所统治的区域，因此这两个神祇之间可能存在一些相似之处。"
 omen_trumsiate:0 "特鲁密西亚"
 omen_trumsiate_desc:0 "维涅托地区的神祇特鲁密西亚特常与治愈之水相联系，并且他是一个特别阳刚的神祇，因为没有记载显示存在对他的女性崇拜（尽管应该注意的是，这可能是由于关于这位神的信息匮乏所致）。在罗马征服之后，特鲁密西亚被等同于阿波罗，但在当地他仍然是一个独立的神祇。这么说来，他很可能与阿波罗有着相似的文化重要性，才会被拿来与阿波罗相比。"
 omen_turan:0 "图兰"
 omen_turan_desc:0 "女神图兰显然是一位重要女神。作为维尔赫城的守护神，这位有翼女神掌管爱、生命力与生育。她常被比作阿佛洛狄忒，这说明她在万神殿中地位显赫。图兰还拥有由拉萨、守护灵和其他小神组成的庞大随从。伊特鲁里亚还有一个以图兰命名的月份，拉丁语称为特拉内乌斯，相当于七月。她的象征包括鸽子和鹅等白鸟，但最具辨识度的是天鹅。"
 omen_turms:0 "图耳谟斯"
 omen_turms_desc:0 "图尔姆斯是人民、贸易和信使之神。他常被比作墨丘利和赫尔墨斯，也通常以与他们相似的特征呈现，包括有翼凉鞋。伊特鲁里亚石棺上的图像还显示，图尔姆斯也帮助引导灵魂进入冥界。"
 omen_turnu:0 "图努"
 omen_turnu_desc:0 "图努是一位爱神，也是女神图兰的儿子。他被拿来与希腊神祇厄洛斯以及可能的罗马神祇丘比特相比。他也属于图兰的随从众神之一，可能在其母亲的事迹中扮演了一定的角色。"
 omen_uni:0 "乌尼"
 omen_uni_astarte:0 "尤妮-阿斯塔特"
 omen_uni_astarte_desc:0 "复合女神尤妮-阿斯塔特在受布匿影响的地区广泛受到崇拜。这位女神结合了尤妮和阿斯塔特的特点，如生育、分娩、爱情、战争以及金星。这两位女神各自经常被相互比较，因此她们被合并为单一的融合神祇并一同受到崇拜也就不足为奇了。"
 omen_uni_desc:0 "乌尼是婚姻、生育与女性女神，是伊特鲁里亚最显赫的神祇之一。她被认为是朱诺或希腊赫拉的伊特鲁里亚版本。有时她被视为“卡庇托林三联神”中的三位至高神之一，该三联神由她本人、其丈夫提尼亚以及其女门尔瓦组成。乌尼也是佩尔斯纳的守护神。"
 omen_usil:0 "乌西尔"
 omen_usil_desc:0 "乌西尔是太阳神，可能为男神也可能为女神。起初他可能是一位女神，但后来与罗马的索尔和希腊的赫利俄斯融合，并可能由于意大利神祇性别的模糊性而转变为男神。尽管发生了这种融合，他在性格和关系上仍保持独特，尤其与黎明女神忒珊关系密切。他也与卡塔女神有关联，后者同样具有类似乌西尔的太阳属性。乌西尔最著名的形象是从海中升起，头戴光环，双手各有火球浮现。"
 omen_vanth:0 "万特"
 omen_vanth_desc:0 "万特是冥界的一位有翼恶魔女神。她常常与冥界之神卡伦相关联，并引导灵魂前往冥界。尽管她被描述为一位有翼恶魔女神，但这可能是外界或希腊观察者的观点。因此，有可能她最初被视为一位冥界女神。"
 omen_vea:0 "维亚"
 omen_vea_desc:0 "维亚，或称为维伊，是城市维伊的守护神。维伊是伊特鲁里亚城市中最富有的一个，其守护神维亚在此期间获得了极大的声望。由于维伊城市的财富，维亚可能是一位与良好贸易和商业活动有关的神祇，同时也是民众的一般守护神。"
 omen_vediovis:0 "维迪奥维斯"
 omen_vediovis_desc:0 "韦迪奥维斯是一位很可能起源于伊特鲁里亚的治愈之神。他常常被比作希腊的医神阿斯克勒庇俄斯。罗马人还将这位神祇视为与朱庇特相对立的神祇。伊特鲁里亚人称他为维欧维。尽管韦迪奥维斯起源于伊特鲁里亚，但从崇拜的程度来看，罗马人似乎是所有崇拜这位神祇的意大利民族中最虔诚的。罗马人甚至在罗马卡匹托利诺山的两个峰之间建造了一座献给韦迪奥维斯的神庙。"
 omen_veiove:0 "维欧维"
 omen_veiove_desc:0 "维欧维是一位很可能起源于伊特鲁里亚的治愈之神。他经常被与希腊的医神阿斯克勒庇俄斯相比较。罗马人还将这位神祇解释为反朱庇特的神祇。罗马人称他为韦迪奥维斯，并且常常将他与阿波罗相比较。尽管维欧维起源于伊特鲁里亚，但从崇拜的程度来看，似乎罗马人比任何其他崇拜这位神祇的意大利民族都要更加尊崇他。"
 omen_vesuna:0 "韦苏娜"
 omen_vesuna_desc:0 "韦苏娜是一位主要受到萨宾人及其周边民族崇拜的女神。她在伊古文石板中被提及两次，似乎是一位保护女神，也可能与生育有关。她还传播到了伊特鲁里亚的传说中，以及翁布里亚和罗马的神话中，这一切都发生在公元前6世纪伊特鲁里亚人占据主导地位的时候。在这个时期，许多神祇在伊特鲁里亚人、拉丁人、法利斯坎人、萨宾人、翁布里亚人以及其他意大利民族之间进行了交流。"
 omen_voltumna:0 "沃尔图姆娜"
 omen_voltumna_desc:0 "沃尔图姆娜，也称为维尔塔，在某个时期成为了伊特鲁里亚人的最高神祇，可能是在提尼亚、乌尼和门尔瓦组成的卡皮托利山三神之前，或者更有可能是取代了他们。这一点得到了罗马人将她称为沃尔图姆娜的支持，她是伊特鲁里亚首都韦尔兹纳的守护神。沃尔图姆娜还是一位冥界女神，也就是说她是掌管冥界的神祇；因为那些不受希腊影响的独立的伊特鲁里亚神祇往往都是冥界之神。"
 omen_zerene:0 "仄瑞涅"
 omen_zerene_desc:0 "泽瑞涅是一位女神，主要以乌尼之妹的身份为人所知。除此关联外，人们对她了解不多，但一般认为她是类似乌尼的神祇，只是没有那么显赫。"
 omen_zipna:0 "兹普纳"
 omen_zipna_desc:0 "兹普纳是一位神秘的神祇，他是女神图兰随从中的一员。兹普纳可能也与新娘有关联，因为有一幅描绘显示他与其他图兰的神祇一起准备新娘的工作。"

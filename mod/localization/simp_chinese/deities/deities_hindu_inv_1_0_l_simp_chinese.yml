 omen_agni:0 "阿耆尼"
 omen_agni_desc:0 "正是他为万物带来光明和生命。因为他是阿耆尼，那股点燃太阳和星辰之火的炽热力量。他的温暖为所有寻求庇护的人带来舒适和保护。阿耆尼连接着神圣之地与凡人之地。他的光辉照亮了每个新日子的黎明，他的力量和纯净指引世界走向正道。"
 omen_ankalamma:0 "安卡尔玛玛"
 omen_ankalamma_desc:0 "在七位母亲的名字中，你会发现安卡尔玛玛这个名字，她是一位女神，像任何母亲爱护自己的孩子一样热切地守护和保护着她的信徒，她拥有一种由母爱所赋予的无所不包的力量，这使得她不可战胜。"
 omen_asvins:0 "阿斯温斯"
 omen_asvins_desc:0 "阿斯温斯，太阳之神的双生子，被永恒的青春所庇护，引导我们走向健康与繁荣。他们持续地赐福于那些呼唤他们的信徒，作为未被时间侵蚀的骑手。他们在分离与统一的悖论中包含了现实的本质，引领忠实的信徒走向充满鲜红幸福的田野。"
 omen_bangaramma:0 "班加拉玛"
 omen_bangaramma_desc:0 "女神班加拉玛，也就是金女神本人。她赠予年轻人甜食，并为老年人提供财富。这位金女神是七姐妹女神中最温和的一位。"
 omen_bhadrakali:0 "跋陀罗迦梨"
 omen_bhadrakali_desc:0 "多臂多眼的保护女神巴德拉卡利掌控并洞察一切，神圣的火焰从她的面容中喷涌而出，吞噬所有敢于挑战她的愚昧者。作为武器的大师，这无疑得益于她那看似无穷尽的手臂和手掌，巴德拉卡利是渴望模仿她战斗能力的战士们的灵感源泉。"
 omen_brhaspati:0 "毗诃波提"
 omen_brhaspati_desc:0 "在原始的黑暗中，一束伟大的光芒闪耀。当混沌的阴影被其天界的光辉穿透时，布里哈斯帕提，圣言之主，坐在三层宝座上的神祇，在其神圣的光芒中诞生，并仅凭他的呼吸就驱散了一切。布里哈斯帕提既是战士也是智者，与火紧密相连，火是对他那无所不包的力量的物理提醒。"
 omen_chandra:0 "旃陀罗"
 omen_chandra_desc:0 "当太阳神苏利耶退回到夜间居所时，璀璨的月神旃陀罗升上了他的王国，他的三轮莲花战车由雪白的骏马拉动。植物和树木也抬起它们的面庞来迎接旃陀罗，因为他是它们的主人，他那耀眼的美丽是对感受到他温柔触摸者的祝福。"
 omen_devasena:0 "提婆犀那"
 omen_devasena_desc:0 "神祇卡提凯亚是如此伟大和强大，以至于就连他的神圣配偶，女神德瓦塞娜，也被虔诚信徒们作为次要神祇来崇拜，以求得她的祝福。"
 omen_dili_polasi:0 "迪利波拉萨"
 omen_dili_polasi_desc:0 "迪利波拉萨是家庭女神。她会在日常的小事上帮助我们。她是七姐妹女神之一，专门关注日常生活中凡人的需求。"
 omen_durga:0 "杜尔加"
 omen_durga_desc:0 "杜尔加，这位不可战胜、不可逾越的女神，她是保护、力量、母性以及毁灭的女神。她将与这个世界上的邪恶作斗争，并运用她的神圣愤怒来惩罚罪恶之人。"
 omen_iravan:0 "宴丰"
 omen_iravan_desc:0 "神祇伊拉瓦纳，英雄阿周那的忠诚之子，被克里希纳赐予了三份礼物，受到许多希望效仿他神圣榜样的人们的崇敬。他的榜样穿越岁月，作为天界虔诚的典范熠熠生辉；通过仪式性地向女神迦梨献祭自己，无数生命得以拯救，这份恩赐至今仍在永恒中回响。"
 omen_isakki:0 "伊萨基"
 omen_isakki_desc:0 "有一些强大的、遥远的神祇居住在远离人间的天界殿堂中，他们关心的是接近无限且凡人难以理解的事物；伊萨基是一位家庭女神，她舍弃了神圣的殿堂，选择守护村庄中的简陋炉灶。因为她如此贴近人们的家园，用她关切的目光注视着家庭中的事务，所以她受到了普通民众的崇敬和深爱。"
 omen_kartikeya:0 "迦𫄨吉夜"
 omen_kartikeya_desc:0 "在古老国度中，迦𫄨吉夜是最古老的神祇之一，这位战神统御着所向披靡的军团，以神圣智慧引领他们攀登至前所未有的高度。传说如晨露般缀满其身：六首魔杀者，百八名号之主——无人能与之抗衡。\n\n牟娄犍乃#E 泰米尔#!民族主神，亦被尊称为#E 迦𫄨吉夜#!。经由宗教融合，二者终成一体。"
 omen_karuppu_sami:0 "卡拉普·萨米"
 omen_karuppu_sami_desc:0 "有时，一位当地的英雄会超越其卑微的出身，挺身而出，解救他们的人民于苦难之中，在他们去世后被尊奉为神祇的化身；民间传说中的卡拉普·萨米就是这样的英雄人物，深受南部泰米尔人的爱戴。"
 omen_korravai:0 "科拉瓦伊"
 omen_korravai_desc:0 "那些希望在战场上取得胜利的人应当好好地崇拜科拉瓦伊，这位女神一手掌握着胜利，另一手束缚着战争；没有她的明确祝福，任何人都无法声称拥有这两者。古老而难以捉摸的她使荒芜之地恢复生机，却无情地注视着战场上聚集的士兵尸体。"
 omen_mariamman:0 "玛丽亚马曼"
 omen_mariamman_desc:0 "在炎热的夏季，当土地因酷热而干裂，几乎抽走了人们生存的意志时，雨神玛丽亚马曼的祝福被许多人所渴望。唯有她的触摸和亲吻才足以治愈各种可怕的疾病。持续遵守她的仪式确保厚重的乌云继续为我们农田和果园带来雨水。"
 omen_mathamma:0 "玛塔玛"
 omen_mathamma_desc:0 "玛塔玛是一位社区女神。尽管所有种姓的人都对她怀有敬畏之心，但她最受穷人中的穷人所尊崇，因此，她的庙宇和供品相比其他女神来说要小得多。"
 omen_meenakshi:0 "密纳克西"
 omen_meenakshi_desc:0 "作为苏达雷斯瓦拉的神圣配偶，指导并保护着她的爱人，米纳克希同样被尊奉为美丽的鱼眼女神，这个昵称反映了她最初作为渔夫们的守护女神，他们寻求她那永不间断的注视的祝福。"
 omen_murugan:0 "牟娄犍"
 omen_murugan_desc:0 "牟娄犍是古老土地上最为古老的神祇之一，他是一位战争之神，指挥着胜利的军团，以其神圣的智慧带领他们达到未曾预见的高度。故事和传说如同清晨的露珠般紧紧依附于他；他是一位六头的恶魔杀手，拥有百零八名号的持有者——无人能在他的面前站立。\n\n牟娄犍是#E 泰米尔#!人的主要神祇，并且也被其他人称为#E 迦𫄨吉夜#!。随着时间的推移，通过宗教融合的过程，两者最终成为了同一个神祇。"
 omen_nasatyanna:0 "纳萨提亚纳"
 omen_nasatyanna_desc:0 "纳萨提亚纳，双生救世神。愿纳萨提亚与达斯拉赐予我们护身武器，护佑归途平安。愿他们在危难时刻拯救我们免于灭亡。#Y 此神仅存于米坦尼#!。"
 omen_pattini:0 "钵底尼"
 omen_pattini_desc:0 "守护斯里兰卡岛的女神帕蒂尼保护着她的追随者，并赐给他们子女，保护她的信徒免受疾病的侵害，同时向他们倾注治愈的河流。她的仪式每年都会被信徒们遵守，无疑是为了确保这位强大而庄严的女神的恩赐。"
 omen_pavadairayan:0 "帕瓦代拉扬"
 omen_pavadairayan_desc:0 "烈女神安卡尔玛玛（Ankalamma）之子，民间英雄帕瓦代拉扬倚靠在他母亲的右膝旁，剑臂时刻准备着；当涉及到保护她的神圣尊严时，没有人能够抵挡得住他倾注的孝心。"
 omen_periyachi:0 "佩里亚奇"
 omen_periyachi_desc:0 "佩里亚奇，母亲，慈悲的女神，她的细心之手引领着艰难的分娩之路，并驱散围绕新生儿四周的饥饿恶魔；她对孩子们温柔而关爱，而对于任何企图伤害他们的人，则是最凶猛和最仇恨的敌人。"
 omen_poleramma:0 "波勒拉玛"
 omen_poleramma_desc:0 "波勒拉玛是湿婆的配偶。她是瘟疫和天花的女神，让我们尊崇她，以免遭受她所能带来的诸多疾病之苦。"
 omen_raja_porus:0 "波罗斯王"
 omen_raja_porus_desc:0 "传奇的国王波罗斯赐福于我们。这位国王勇敢地对抗了伟大的征服者伊克桑德，即使在失败后，他也坚定地屹立不倒。伊克桑德，西方的所有征服者，曾击败过无数的国王和怪物，他对波罗斯国王表示了尊重，并视他为一位值得尊敬的国王。因此，传奇的国王波罗斯作为与伟大的伊克桑德平等的国王，统治着自己的领地。奸诈的欧德穆斯用卑鄙的手段谋杀了这位伟大的国王，玷污了他的荣誉。然而，波罗斯国王的遗产依然与我们同在，并且我们继续崇拜着他。"
 omen_renuka:0 "丽奴迦"
 omen_renuka_desc:0 "蕾努卡是宇宙之母。她的神圣母性孕育了许多强大的儿子，其中包括伟大的神祇罗摩。愿这位宇宙之母保佑我们所有人。"
 omen_rudra:0 "楼陀罗"
 omen_rudra_desc:0 "鲁德拉是轻拂过麦田的微风，但他也是呼啸的狂风，是飓风的尖啸和呼啸。作为一个强大的风暴之神，鲁德拉也是一位狩猎之神，驱使人类和动物寻求躲避他所掌控的风暴。"
 omen_ruta:0 "鲁塔"
 omen_ruta_desc:0 "鲁塔是吠陀神祇鲁德拉在#Y 米坦尼#!地区的变体。因此，鲁塔是狩猎与风之神。愿新米坦尼人民蒙受鲁塔神圣之兽的庇佑，丰收满载，猎获丰硕。"
 omen_shani:0 "裟尼"
 omen_shani_desc:0 "一只乌鸦飞越宇宙的广阔空间，沙尼骑在其背上，知晓人心并根据他们的纯洁之心施予神圣的正义。受到人们的爱戴，沙尼的力量和统治触及一切又仿佛触及不到任何事物；悲伤、衰老的摧残、心智的敏锐度、目标感——沙尼神控制着这一切。"
 omen_svar:0 "斯瓦拉"
 omen_svar_desc:0 "斯瓦拉，太阳之神。每日清晨依其旨意使太阳升起，每夜落日西沉，维系宇宙平衡。斯瓦拉影响了波斯语中太阳的称谓，并在印欧语系中作为“神”的古词延续至今。#Y 此神仅存于米坦尼#!。"
 omen_varuna:0 "伐楼那"
 omen_varuna_desc:0 "当只有天空存在时，就有了瓦茹拿，而在天空延伸触及无尽海洋的地方，你也同样能找到他——神圣的权威，因为他能像呼吸一样轻松地塑造水和风。西方受到他广阔的保护，世界承载着他正直坚定的道德准则。"
 omen_vayu:0 "伐由"
 omen_vayu_desc:0 "风神伐由。他与因陀罗关系密切，有时被称为“世界的生命气息”。相传每当毗湿奴转世，伐由也会随之转世，以陪伴并协助他。\n\n伐由是#Y 米坦尼#!的主要神祇之一，彰显了该文明的吠陀与印度文化渊源。"
 omen_yama:0 "阎摩"
 omen_yama_desc:0 "在南方的土地上，无情的死亡主宰着一切，严酷的主神阎摩，死神之神，坐镇于此。因为他是第一个品尝到死亡苦涩灰烬的人，也是第一个穿越生与死之间的帷幕的人，所以地狱的力量被赋予了他。在大地深处，死神阎摩，祖先之主，耐心地等待着，等待那些无法逃脱他必然掌握的灵魂。"

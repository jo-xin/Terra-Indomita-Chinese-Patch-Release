 omen_amurru:0 "阿穆鲁"
 omen_amurru_desc:0 "阿穆鲁被古代迦南人以及其他邻近文化如阿莫里人和阿卡德人崇拜。通常被描绘为荒野、风暴和战争之神。在一些描绘中，他被描绘成一个戴着有角头盔、持弓箭的胡须男人。阿穆鲁与山和风暴有关，有时被描绘成公牛。他也与战争和狩猎有关，有时被作为动物的保护神来召唤。"
 omen_asherah:0 "阿舍拉赫"
 omen_asherah_desc:0 "阿舍拉赫是西北闪族的主要女神。她被认为是神埃尔的配偶，通常被描绘成母神、繁殖女神和大地与植被的女神。她经常与神庙和神殿中的圣树或柱子（通常称为“阿舍拉赫”）有关。阿舍拉赫在迦南神系中被认为是神埃尔的配偶，在希伯来圣经中则被认为是耶和华的妻子。她在古代近东的各种形式中被崇拜，其崇拜证据可以追溯到公元前18世纪。阿舍拉赫是母神和繁殖女神，通常被描绘成裸体或部分裸体的女性，夸张的乳房和生殖器象征着她促进生育和丰产的角色。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_bethel:0 "伯特利"
 omen_bethel_desc:0 "伯特利是与古城伯特利有关的迦南神祇。'伯特利'这个名字意为'神之殿'，该城被认为是迦南人的圣地。被称为伯特利的神祇通常被描绘成公牛或小牛，与生育、农业和繁荣有关。\n\n伯特利被古代近东的各种文化崇拜，包括迦南人、以色列人和腓尼基人。在《圣经》中，伯特利被提到作为许多重要宗教和历史事件的发生地，包括雅各梦见通天梯和耶罗波安王的加冕。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_chemosh:0 "基抹"
 omen_chemosh_desc:0 "迦南神基抹，也拼作凯摩士。基抹是摩押人和亚扪人的主要神祇，也被迦南人崇拜。他的名字意为'征服者'或'拥有者'，与太阳和战争有关。基抹通常被描绘成公牛或公羊，与战争、力量和生育有关。摩押城市底本被认为是基抹崇拜的主要中心，许多与这位神有关的铭文和文物都在那里被发现。基抹通常被描绘成公牛或公羊，有时被描绘成人面。他通常通过动物献祭被崇拜，也与儿童献祭有关。基抹被认为是一个强大而复仇的神祇，既能给崇拜者带来祝福也能带来诅咒。\n\n#!神化效果：$military_apotheosis_military_experience_effect_tt_description$"
 omen_ishara:0 "伊莎拉"
 omen_ishara_desc:0 "伊莎拉是古代近东地区崇拜的女神。她主要与爱、繁殖和战争有关，被认为是女神赋予生命和夺走生命的象征。她的名字来源不明，但有人认为可能意味着“山之女主人”。伊莎拉经常被描绘成戴着有角头饰、拿着弓箭的女人。有时她被描绘成骑着狮子或蛇。除了与爱、繁殖和战争的联系外，她还被认为是誓言的保护者和不同土地边界的守护者。\n\n#!神化效果：$fertility_apotheosis_capital_slaves_effect_tt_description$"
 omen_mer:0 "梅尔"
 omen_mer_desc:0 "梅尔是迦南和腓尼基万神殿中的爱情、繁殖和生育之神。他也被称为雷舍夫-梅尔或雷舍夫-巴力-梅尔，表明可能与雷舍夫或巴力神的融合。关于梅尔崇拜的具体信息有限，但他很可能在各种迦南和腓尼基社区中被崇拜。"
 omen_milkom:0 "米尔科姆"
 omen_milkom_desc:0 "米尔科姆或摩洛克是迦南人和中东其他古代民族崇拜的神祇。他与儿童献祭有关，通常被描绘成一头公牛或有公牛头的人。据圣经记载，他的崇拜包括将孩子活活烧死。然而，学者们对这一实践的程度和性质存在一些争议。他有时也被认为是梅尔卡特的一个版本，但通常认为他们是不同的神祇。"
 omen_mot:0 "莫特"
 omen_mot_desc:0 "莫特是迦南神话中的死亡和不育之神。莫特通常与暴风雨之神巴力哈达有关，有时甚至被视为他的兄弟。在巴力循环中，莫特被描绘成巴力的强大敌人，试图击败他并结束他的统治。"
 omen_qaus:0 "卡乌斯"
 omen_qaus_desc:0 "卡乌斯，也被称为科斯或卡乌斯米尔克，是古代近东特别是以东和米甸地区崇拜的神祇。'卡乌斯'这个名字在阿拉姆语中意为'弓'，通常与神的弓箭和狩猎联系在一起。卡乌斯经常被描绘成战神，有时被称为'战争之主'。他也与月亮有关，有时被描绘成额头上戴着新月。\n\n在以东宗教中，卡乌斯被认为是主要神祇，通常被称为'卡乌斯大帝'或'伟大的卡乌斯'。他通过动物献祭被崇拜，在如波斯拉和廷那等古代以东城市中发现了献给他的神庙。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_rasap_melqart:0 "拉萨普-梅尔卡特"
 omen_rasap_melqart_desc:0 "拉萨普‑梅尔卡特（Rasap-Melqart）或称拉塞夫‑梅尔卡特（Rasef-Melkart），是一位融合神祇，我们对其知之甚少。该神由拉萨普与梅尔卡特两部分构成：梅尔卡特是推罗城广受崇拜的神祇，而拉萨普则是西顿城的守护神。伊维萨岛的一处考古遗址出土了珍贵的腓尼基双面石碑，铭文记载：“此圣所由's'dr（雅阿斯·艾之子，布尔格德之孙，埃什蒙希尔斯之曾孙）奉献给brd（雷塞夫-梅尔卡特）”，所指神祇极可能是该岛的守护神——拉萨普‑梅尔卡特。尽管拉萨普‑梅尔卡特神相对鲜为人知，却在伊维萨的文化宗教生活中扮演着重要角色。其神庙既是本地居民也是外来者的重要聚会场所，对他的崇拜强化了该岛作为古代世界海上贸易与商业中心的身份认同。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_shahar:0 "沙哈尔"
 omen_shahar_desc:0 "沙哈尔是古迦南神话中的黎明之神。通常被描绘成一个金发和有翅膀的年轻人，手持弓箭。根据迦南人的信仰，沙哈尔是象征黄昏的沙利姆的兄弟。在一些传统中，沙哈尔被认为是女神阿斯塔蒂（也称为伊什塔尔或伊南娜）的父亲，她是古代近东许多文化中的重要神祇。沙哈尔在包括迦南、叙利亚和美索不达米亚在内的古代近东各地区都被崇拜。"
 omen_shalem:0 "沙利姆"
 omen_shalem_desc:0 "沙利姆，也被称为沙勒姆或沙尔曼，是古代迦南人崇拜的神祇。'沙利姆'这个名字意为'完整'或'全备'，这位神与和平、繁荣和福祉有关。沙利姆通常被描绘成手持树枝或一串葡萄，象征着生育和丰饶。他也与启明星有关，有时被认为是夜神。"
 omen_taautus:0 "塔乌特"
 omen_taautus_desc:0 "由腓尼基作家 Sanchuniathon 记录为塔乌特，塔乌特是发明字母并首先开始写作记录的神，因此他是历史本身的创造者。多亏了他，我们才知道如何管理我们的资源并发展我们的社会。作为神米索尔的儿子，有人说他来自比布鲁斯，尽管他以埃及的土地为家。\n\n这个神经常与埃及的托特联系在一起，希腊人则称他为他们的赫尔墨斯。\n\n#!神化效果：$economy_income_effect_tt_description$"

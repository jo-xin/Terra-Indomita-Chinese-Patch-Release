 omen_confucius:0 "孔子"
 omen_confucius_desc:0 "#Y 儒家#! \n孔子是所有儒家哲学家中最著名者，当然也是\"儒学\"一词的来源，他是中国文明历史上最伟大的人物之一。他的儒家学派将在未来数个世纪中持续保持影响。尽管如此，孔子本人从未自视为早期信仰的创始者，而仅是一位传承者。然而，显然他对儒家学派的影响无人能及，他的弟子们将追随他的脚步，使儒学在中国社会中牢固确立。\n\n孔子的核心教义围绕道德修养、伦理治理和追求\"君子\"展开。他重视孝道、尊重传统以及礼仪的重要性，这些成为儒家思想的基本原则。通过其忠诚的弟子，孔子的影响远远超越了他的一生，使儒学成为中国社会中占主导地位的哲学和伦理传统。"
 omen_dengxi:0 "邓析"
 omen_dengxi_desc:0 "#Y 名家#! \n邓析以其辩论才能和在郑国担任法律从业者的角色而闻名，对治理和法律哲学领域留下了深远的影响。他的主要教义强调遵循原则和现实，细致审查法律，建立权威治理。\n\n尽管才华横溢、贡献卓著，邓析的个人准则与郑国高官的政策相冲突，最终导致他被处决。邓析的著名思想之一围绕\"循名责实，审法立威\"的概念展开。邓析主要被铭记为一位法律改革者，挑战了传统儒家思想，提供了对古代中国治理和法律哲学演变有所贡献的另类视角。"
 omen_guanzhong:0 "管仲"
 omen_guanzhong_desc:0 "#Y 法家#! \n管仲以其在战国时期对治理和治国方略的深刻见解而著称，是一位声誉卓著的哲学家和政治思想家。他的主要教义不仅涵盖治理原则，还强调强大中央权威、公平分配资源以及仁政以确保人民福祉的重要性。\n\n管仲精心编纂了他对治理、外交和行政实践的反思，著成其巨著《管子》。他的智慧和务实的政治方法，在军事冲突的熔炉中锻造而成，为法家哲学奠定了基础。"
 omen_huangdi:0 "黄帝"
 omen_huangdi_desc:0 "#Y 中国神祇#! \n黄帝，在西方更广为人知的是Yellow Emperor，是一位代表宇宙中心的神。他以\"四面\"之神而闻名，这体现了他对四方统一掌控的愿景。当时的中国道家通常认为黄帝是道家原则的创始者，甚至早于老子。他是道家的一位不朽存在，早在道家成为思想流派之前就已存在。黄帝在中国道家将他视为道家神之前，就已作为神道教的神存在。"
 omen_huizi:0 "惠施"
 omen_huizi_desc:0 "#Y 名家#! \n惠施以其在语言和真理相对性方面的哲学立场而闻名。他的主要教义围绕\"视角主义\"的概念。惠施提出，所有陈述从自身视角来看都是有效的，挑战了绝对真理的概念。这种以视角为中心的哲学鼓励对语言及其如何塑造我们对现实理解的深入审视。他对语言相对性的强调引发了学者间的深刻讨论，并为后来的哲学探索奠定了基础。\n\n惠施一生中最令人难忘的片段之一是他与著名道家哲学家#E 庄子#!就现实与感知本质展开的激烈辩论。庄子以鱼的例子质疑惠施视角的有效性，他论证说如果鱼的视角局限于其水域环境，它就不会知道水之外是什么。惠施对此辩论的回应，常被称为\"蝴蝶梦\"，凸显了他的哲学立场：视角塑造我们对现实的理解，因此所有视角都有其有效性。惠施的思想对中国思想的发展产生了重大影响。"
 omen_laozi:0 "老子"
 omen_laozi_desc:0 "#Y 道家#! \n老子，通常被认为是道教和道家的创始人，仍然是一位半神话人物。他的主要教义凝聚在道教奠基文本《道德经》中，他在其中阐述了道的深远概念——道、气以及道的其他基本原则。\n\n大多数记载称老子是战国时期哲学家的同时代人，如孔子。有趣的是，老子之名意为\"老师尊\"，是一个尊称，而他的真名仍是争论的话题，可能包括耳或聃。无论他究竟是谁，老子的遗产通过《道德经》中永恒的智慧而长存，帮助信徒理解道教真谛与和谐生活之道，直至今日。"
 omen_lieyukou:0 "列御寇"
 omen_lieyukou_desc:0 "#Y 道家#! \n列御寇以道家杰作《列子》的作者而闻名，对道家哲学领域做出了重大贡献。他来自郑国，其生平笼罩在神秘之中，历史记载稀少，部分原因是道家自己策划的焚书。\n\n一些学者提出了一种有趣的可能性，即列御寇可能是传奇人物庄子创造的一个典范——为体现道家原则而设计的人物。尽管关于其存在有诸多不确定性，《列子》仍然是宝贵的道家文本，深入探讨了道、自然无为以及人类视角的相对性等深邃概念。它继续启发着求道者，为道家哲学丰富多彩的画卷做出贡献。"
 omen_likui:0 "李悝"
 omen_likui_desc:0 "#Y 法家#! \n李悝被称为古代中国的谋略大师，是一位具有非凡才华的博学家，先后担任过工程师、哲学家和精明的总督。作为工程师，他的创新堪比奇迹，通过精心设计的灌溉系统将干旱的土地变成翠绿的绿洲。他的建筑才能造就了令人叹为观止的建筑，仿佛直达天庭。\n\n然而，正是作为哲学家，李悝的影响力真正回荡在岁月之中。他的教义是深邃的智慧源泉，深入探究人类存在的本质。他阐述了美德的原则，敦促个人不仅修养心智，也要修养心灵。他的伦理哲学强调和谐的重要性——不仅是社会中的和谐，也包括自身内在的和谐——倡导内外世界的统一。\n\n李悝的政治洞察力得益于他的哲学见解，他相信只有通过各部分的和谐共存才能实现一个公正稳定的社会。他的建议为统治者和皇帝所寻求，他植根于仁爱和正义原则的战略常常带来其领域的稳定和繁荣。"
 omen_mencius:0 "孟子"
 omen_mencius_desc:0 "#Y 儒家#! \n孟子，也称孟轲，是继孔子本人之后最有影响力的儒家之一。他的教义核心是对人性本善的深刻信仰，这一概念使他在儒家传统中独树一帜。孟子热情地倡导国家内普通公民的福祉，强调他们作为繁荣社会心脏的重要性。\n\n孟子最具突破性的思想之一是断言：如果统治者忽视人民的需要和福祉，臣民就有正当理由起义反对他们的统治者。这一立场与传统儒家思想有重大偏离，后者通常倾向于支持统治阶级。孟子并没有削弱统治者和国王的重要性，而是以独特的方式认识到农民和自由民在国家稳定和繁荣中的关键作用。"
 omen_minggui:0 "明鬼"
 omen_minggui_desc:0 "#Y 中国神祇#! \n明鬼是墨子所描述的鬼魂概念。墨子宣扬说，有明鬼惩罚暴力者，奖赏有德者。这种非暴力的理念常被误解，因为墨家并非和平主义者，而是武装防御专家。事实上，墨家之所以能够延续，很大程度上正是由于他们在防御战争方面的专长。"
 omen_mozi:0 "墨子"
 omen_mozi_desc:0 "#Y 墨家#! \n墨家创始人墨子，也称墨翟，是中国哲学的伟大人物之一。墨子著名地宣扬兼爱，这是一种功利主义形式。墨家以其技术和军事才能而闻名，尽管反对进攻性战争。著名地，墨子说服楚国不要攻击宋国——尽管楚国兵力占优。他通过说服楚国相信充满墨家的宋国拥有无与伦比的拆解楚军先进攻城武器的能力来做到这一点。无论他们进行多少次模拟战斗，墨子都总是战胜将军公输。最终，楚国没有对宋发动战争，认为所得甚少而损失巨大。"
 omen_shangdi:0 "上帝"
 omen_shangdi_desc:0 "#Y中国神祇#!\n墨家中的天志观念源于墨子关于治理社会需要信仰一位至高神——上帝——的信念。上帝具有拟人化的外形，然而，上帝对墨家的重要性并非在于直接信仰或尊崇上帝本身，而是要为天志或天意（即上天之意志或意图）这一概念树立先例。"
 omen_shangyang:0 "商鞅"
 omen_shangyang_desc:0 "#Y法家#!\n商鞅，亦称卫鞅，是中国历史上的一位杰出人物，主要因其对秦国的深远影响和贡献而被铭记。商鞅出身于魏国宫廷，为庶子，后选择离开魏国，将其才学献予秦国。他在秦国攻魏之战中发挥了关键作用，因此获得了极大的荣誉，包括十五座城池的赏赐以表彰其战功。\n\n商鞅不朽的遗产在于他与法家学派的关联，他被视为法家最著名的倡导者之一，与韩非等人齐名——韩非正是受商鞅著作启发。商鞅的影响远超理论，他推行了诸多改革，在秦国的崛起中发挥了至关重要的作用。这些改革涵盖土地分配和军事组织等领域，均为秦最终成功做出了重大贡献。"
 omen_shenbuhai:0 "申不害"
 omen_shenbuhai_desc:0 "#Y法家#!\n申不害，中国古代哲学与治国之道的杰出人物，以其对政治思想领域的重大贡献而闻名。他的主要学说围绕通过完善的官僚体系实现高效治理这一理念。申不害认为，统治者应通过组织良好的政府体系行使权力，强调行政能力和秩序的重要性。\n\n在其开创性著作《申子》中，他探讨了治国之道的原则与政治权威的作用。申不害的哲学为法家学派奠定了基础，后者后来对中国治理产生了深远影响。他对明确的法律、公正的执法以及权威集中化的强调，极大地促进了中国官僚体系的发展。"
 omen_sun_wukong:0 "孙悟空"
 omen_sun_wukong_desc:0 "#Y中国神祇#!\n孙悟空，日文中亦称 Son Goku，是中国文化中最著名的人物之一。他作为神通广大的美猴王在整个东亚受到崇拜，是一位与敏捷、力量和机智相关的神祇。传说他能轻松承担两座天山的重量，同时以流星般的速度移动。一个筋斗云便能翻越三万余里，其记忆力更是无人能及，能记住世上每一只曾降生的猴子的名字。\n\n孙悟空的威名远播，源自他那段不可思议的西行之旅。在这场史诗般的征程中，他与忠诚的伙伴——包括顽皮的猪八戒和僧人三藏——一同踏上了寻求真经的旅途。这段旅程被记录在文学经典#E《西游记》#!中，见证了孙悟空不屈的精神以及他从叛逆之神到虔诚护卫的转变。\n\n孙悟空的身世引发了诸多学说，最早的若干可追溯至公元8世纪中国的楚国。那个时代充满着涉及猿猴和长臂猿的传说与神话，这些故事与当地道教信仰融合，塑造了这位标志性美猴王的早期版本。同样可以想象，孙悟空的传说可能早于此时期，或许源自福州地区——位于台湾以西——其他神猴的传说。在历史上，孙悟空被描绘为既是道教也是佛教的人物，体现了该地区的精神传统。"
 omen_sunbin:0 "孙膑"
 omen_sunbin_desc:0 "#Y兵家#!\n孙膑，以其卓越的军事才能和战略智慧而闻名，据传是传奇人物孙子的后代。在被诬告叛国后，魏王下令切除其膝盖骨，令孙膑终身留下疤痕和残疾。\n\n然而，孙膑不屈的精神最终使他成功逃离了魏国的魔掌。到达齐国后，他的命运发生了转变，尽管困难重重，他仍崛起为著名的军事战略家和统帅。他的战略才华在桂陵之战和马陵之战等关键战役中得以展现。然而，真正奠定其不朽遗产的，是他对战争艺术的持久贡献。孙膑撰写了深奥的军事论著#E《孙膑兵法》#!，这清晰地影射了其先祖的同名开创性著作。"
 omen_suntzu:0 "孙子"
 omen_suntzu_desc:0 "#Y兵家#!\n孙子，因其在经典著作#E《孙子兵法》#!中对战略和战争艺术的深刻洞见而闻名于世，他是效力于吴王的一位将军、战略家和智者，一生致力于军事哲学与战略。\n\n孙子的学说强调谋划之术、奇谋妙计以及洞悉战场和人生之境。他坚信知己知彼方能百战不殆，并主张尽可能避免冲突。孙子的哲学强调灵活应变，强调迅速而灵活的反应，且「兵者，诡道也」。他的智慧不仅应用于军事战略，亦延及领导力的方方面面，确保其学说在后世千年的宫闱中被持续研习。"
 omen_tang:0 "汤"
 omen_tang_desc:0 "#Y中国神祇#!\n汤王是商朝的第一任君主。据说他推翻了夏朝的最后一位王——邪恶的桀王。他也以谥号「成汤」而闻名。墨家对这位王的宣称源于墨者视汤王为古代圣王之一，应在践行兼爱时努力效仿。"
 omen_universal_love:0 "兼爱"
 omen_universal_love_desc:0 "#Y墨家#!\n兼爱学说是墨家所有学说中最著名的一条。直译便是「不偏不倚的关怀」或「博爱」。这是一种功利主义的思维方式，倡言一个人应当如同爱自己那样去爱他人，不论亲疏关系。这最后一点常是墨家与对手儒家争论的焦点，因为儒家认为儿子爱父亲应超过爱陌生人。需注意，墨家的「爱」是有条件的，而儒家的「爱」则是无条件的。"
 omen_xunzi:0 "荀子"
 omen_xunzi_desc:0 "#Y儒家#!\n荀子的学说根本上是围绕着人性与伦理修养。他的哲学挑战了人性本善的观念，反而主张个体是由教育和道德纪律塑造的。其信念的核心在于：人必须主动培养美德，并强调礼仪和传统作为培养道德行为的手段的重要性。\n\n荀子在儒家受到其他哲学学派挑战的时期，发挥了振兴儒家的关键作用。他对儒家思想的系统化方法帮助其巩固了作为中国社会主流意识形态的地位。他的著作，特别是以他名字命名的#E《荀子》#!，为理解和实践儒家价值观提供了全面的框架，强调由严格道德原则治理的秩序良好的社会的重要性。"
 omen_xuxing:0 "许行"
 omen_xuxing_desc:0 "#Y农家#!\n许行，作为农家的杰出人物，倡导以农学作为实现社会平等和繁荣的手段。\n\n他的核心教义是，社会上的每一个成员，包括贵族，都应积极参与粮食和其他农产品的生产，并参与备膳。这一平等主义愿景旨在建立一个所有个体共享平等地位与责任的社会。然而，在一个通过军事或政治成就实现社会流动司空见惯的世界里，许行的理想面临着巨大挑战。他学派的教义主张回归更简朴的生活方式，类似神农时代，并呼吁固定市场价格以防止剥削。"
 omen_yanhui:0 "颜回"
 omen_yanhui_desc:0 "#Y儒家#!\n孔子最喜爱的弟子颜回，是儒家传统中最受尊敬的人物之一。他的教诲及对儒家思想原则的坚定奉献，给这一传统留下了不可磨灭的印记。最终，在汉代，颜回与孔子一同受到尊崇。\n\n颜回的一生不幸短暂，仅29岁便辞世。据信他可能是最早有记载的早衰症病例之一，该病特征为快速衰老。据说孔子在失去最心爱的弟子时表现出了「过度」的哀恸。他甚至宣称，没有任何其他学生能替代颜回去世后留下的空缺，并确认颜回是他所有弟子中最专注、最睿智的一位。"
 omen_yueyi:0 "乐毅"
 omen_yueyi_desc:0 "#Y名家#!\n乐毅将军是一位传奇的战术家、将领和外交家，活跃于动荡的战国时期。他生于燕国优渥之家，但赵武灵王夷平乐毅家乡后，他的人生剧变，被迫沦落天涯。\n\n命运很快眷顾了他，乐毅非凡的才能引起了燕昭王的注意，燕昭王识其价值，在其帐下予以任用。凭借精湛的外交，乐毅策划了与魏、楚、韩、赵、秦等国的联盟，联合各方势力压制崛起的齐国。他在战场上的领导力至关重要，策划了齐国的覆灭，导致其暴君逃亡，几乎将整个齐境收入囊中。\n\n乐毅被其恩主燕昭王亲自授予昌国之地，但随着燕昭王骤然离世，局势急转直下，燕国陷入混乱，乐毅失其庇护。齐国趁乱反攻，收复了部分失地，乐毅因害怕新燕王惠王将燕国引向灭顶之灾，逃往赵国。不久这果然成真，齐军击溃了过度自信的燕军。燕惠王最终成功赢回了乐毅，并授予他广泛权力。凭借乐毅的战场才华，燕国得以巩固其所有，避免了一败涂地。"
 omen_yugreat:0 "禹"
 omen_yugreat_desc:0 "#Y中国神祇#!\n古代圣王大禹，亦称大禹，是一位传奇的中国古代君主。他被认为是存在争议的夏朝神话式奠基人。他生活的年代比墨子和墨家早一千年，然而，墨家的一些支派认为大禹是墨家学说的典范，墨者应努力效仿大禹。事实上，许多墨者相信追随大禹的兼爱精神是他们的职责。\n\n据说墨子背弃了先前的周朝，转而拥抱夏朝和大禹的治理方式，因为墨子宣称兼爱学说正是古代圣王和六王所实践的。"
 omen_zengzi:0 "曾子"
 omen_zengzi_desc:0 "#Y儒家#!\n曾子以仁、义、礼的教诲而闻名，他是孔子的一位哲学家和忠实弟子。他对儒家原则的深刻承诺使他强调在个人和社会中培养这些美德的重要性。\n\n曾子坚信通过践行仁爱，人们可以培养和谐的人际关系；通过坚持正义，可以创建一个公正而道德的社会。此外，他强调了「礼」在日常生活中的重要意义，倡导行为端正、尊重社会规范。曾子在《论语》中记载的教诲，对儒家发展为中国重要思想流派做出了重大贡献。"
 omen_zhangyi:0 "张仪"
 omen_zhangyi_desc:0 "#Y纵横家#!\n张仪，他那个时代的杰出智者，既是军事战略家，也是极负盛名的哲学家。他拥有敏锐的才智，能够娴熟地应对战争与哲学二者的复杂精妙。在军事战略领域，张仪的智慧与战术才能堪称传奇。他能设计出精巧的作战计划，以惊人的精确度预测对手的动向。\n\n然而，在战场之外，张仪深入探索人生的哲学深度。他沉思的天性使他思考深刻的问题，他对人类状况的洞察尤为深邃。张仪的教诲超越了战争艺术，涉及伦理、治理和智慧追求等广泛主题。他的智慧是战略世界与哲学领域中的一座启蒙灯塔，将理解之光普照所有寻求他忠告之人。他的著作融合了罕见的战略才华与哲学深度，继续激励着后世一代又一代的军事领袖、哲学家、政治家以及寻求智慧的人。"
 omen_zhuangzi:0 "庄子"
 omen_zhuangzi_desc:0 "#Y道家#!\n庄子的学说关乎与道（Tao）和谐共生的艺术。其哲学的核心思想是个体应追求达到自然自发的状态，超越僵化的社会规范与欲望。\n\n庄子常运用寓言故事和轶事来阐明其哲学概念，强调人类视角的相对性以及是非之别虚幻不实的本质。他对道家的贡献至关重要。庄子的著作，特别是#E《庄子》#!，被视为道家思想的基础文本。它们探讨了自由、真理的相对性以及拥抱变化作为道家修行核心要素的重要性。庄子对人类视角相对性和是非虚幻性的强调，深刻影响了道家哲学的发展及其在冥想、武术和整体生活等领域的实际应用。"
 omen_zichan:0 "子产"
 omen_zichan_desc:0 "#Y法家#!\n哲学家兼政治家子产以其关于治理与社会秩序的学说最为著名。其哲学的核心是仁爱、节俭和道德领导的原则，他认为这些是成功治理国家的根本基石。\n\n子产长期担任郑国执政，他热切地相信统治者的首要职责是优先考虑人民的福祉。这一核心信条强调了制定旨在减轻贫困、刺激经济增长和确保资源分配公平的政策之必要。子产对治理最引人注目的贡献之一，是推行了全面的土地改革。这些改革旨在纠正土地所有权的不平等，减轻普通百姓的负担。"
 omen_zisi:0 "子思"
 omen_zisi_desc:0 "#Y儒家#!\n子思，孔子的孙子，在将孔子及儒家的深奥学说传递给极具影响力的哲学家孟子的过程中，发挥了关键作用。他的哲学贡献深入冥想领域，并对人类在浩瀚宇宙中知识有限这一点怀有谦卑的认知。与其祖父强调区分真知与臆测不同，子思阐明了内省和通过内心反思追求智慧的价值。\n\n子思的学说强调内向沉思作为培养道德美德和精神成长之手段的重要性。他倡导加深对自我的理解，认识到真正的智慧源于对人类在宇宙大计中知识有限性的认知。这一视角为儒家传统提供了一个独特的维度，以深刻的谦卑感和对存在之奥秘的敬畏丰富了它。作为孔子和孟子之间的桥梁，子思的遗产作为儒家思想演变的见证永存，融合了过去的智慧与持续塑造中国乃至世界伦理哲学的革新洞见。"
 omen_zouyan:0 "邹衍"
 omen_zouyan_desc:0 "#Y阴阳家#!\n邹衍以对自然世界和宇宙的深刻洞察而闻名，是一位哲学家兼灵性作家。他的主要学说围绕#E五行#!这一中国宇宙论的基本原理展开。根据邹衍的理论，世界由五种元素——木、火、土、金、水——构成，它们以动态循环相互作用，影响着自然和人事的进程。\n\n邹衍的贡献超越了哲学，延伸至天文学和占卜等领域。他的著作，包括#E《谈天》#!，对天象及其对人间事件的影响做出了精妙的解释。邹衍对宇宙的整体观极大地影响了中国思想，在哲学、科学与灵性之间架起了桥梁。"

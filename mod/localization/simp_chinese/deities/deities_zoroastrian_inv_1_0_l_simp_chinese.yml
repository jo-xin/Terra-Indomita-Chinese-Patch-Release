 omen_ahura_mazda:0 "阿胡拉·马兹达"
 omen_ahura_mazda_desc:0 "奥罗玛斯德，智慧之主，创造万物的未造之灵，他以其意志约束宇宙，并在整个宇宙中散发纯粹的善。强大的神祇阿胡拉·马兹达有许多称号，他是祆教的最高神祇。所有神圣和有益的事物都来自于阿胡拉·马兹达，他是黑暗与苦难世界中不变的希望之光。"
 omen_aphrodite_anaitis:0 "阿佛洛狄忒-阿奈提斯"
 omen_aphrodite_anaitis_desc:0 "在希腊化时代，祆教发展出了许多融合现象，其中阿佛洛狄忒-阿奈提斯就是一个显著的例子。阿佛洛狄忒-阿奈提斯是由印度-伊朗女神阿娜希塔与希腊女神阿佛洛狄忒融合而成的，实际上她的崇拜早于亚历山大大帝的希腊化入侵，并在此之后得到了进一步的加强。"
 omen_armaiti:0 "爱尔麦蒂"
 omen_armaiti_desc:0 "阿胡拉·马兹达挚爱的女儿阿玛伊提代表并放大了许多她父亲个性的特点，包括对精神世界的掌握。阿玛伊提的信徒以其慈爱温和而著称，因为他们知道服务他人取悦了神圣的父亲，并确保了他们自己的永恒奖赏。"
 omen_darius:0 "大流士大帝"
 omen_darius_desc:0 "大流士王是祆教的重要支持者。与他的前任们不同，后者在信仰上更加模糊，倾向于在祆教与更古老的波斯宗教如密特拉教之间保持平衡，大流士王认为他的统治是直接由阿胡拉·马兹达授予的。凭借着这份神圣的权利，他传奇般的统治使他被永远铭记为“伟大的大流士”，除了居鲁士之外，超越了所有的波斯王。"
 omen_haurvatat:0 "胡尔瓦塔特"
 omen_haurvatat_desc:0 "创造中的每样事物都有其对立面；这是由光荣的阿胡拉·马兹达在其无限的能力中所裁定和规定的。瓦希斯塔是火之承载者，而女性的阿美沙·斯潘塔霍尔瓦塔特则控制着水流的涨落，利用水的治愈力量来祝福和保护她的信徒免受这个注定毁灭的世界中的身体疾病。"
 omen_husravah:0 "卡维 胡斯拉万"
 omen_husravah_desc:0 "凯亚尼王朝的传奇国王卡维·胡斯拉瓦，他也出现在波斯史诗《沙赫纳梅》中。他的名字字面上的意思是“享有良好声誉的诗人/先知”。他不仅出现在阿维斯塔中，也在帕拉维文本中有所记载。甚至似乎在吠陀文献中也有提及他。"
 omen_kshatra_vairya:0 "赫沙特拉·瓦伊里亚"
 omen_kshatra_vairya_desc:0 "在阿胡拉·马兹达无限智慧的指引下，他确保并分配了地球上的领地给他的创造物，赋予了克夏特拉·瓦伊里亚对金属的统治权，这是他神圣力量的一种表现。克夏特拉·瓦伊里亚是力量和正直之道的化身，他克服那些试图施行邪恶之举的愚昧之人。"
 omen_mithra_baga:0 "巴加 密特拉"
 omen_mithra_baga_desc:0 "巴加·密特拉是一位在多种信仰中都很受欢迎的印度-伊朗神祇，他与真理、丰收相关，并在强化水的仪式中扮演角色。\n\n虽然查拉图斯特拉从未提及这位神祇，但他在琐罗亚斯德教信仰中扮演着重要角色，因此他的版本“密特拉·巴加”特别指琐罗亚斯德教中的版本。这个版本与密特拉教中的密特拉并没有太大差异，不过他在琐罗亚斯德教中的地位不如阿胡拉·马兹达那样中心化，因此巴加·密特拉在琐罗亚斯德教中处于次要位置。\n\n#!神化效果：$mithra_baga_apotheosis_effect_tt_description$"
 omen_spenta_mainyu:0 "斯宾塔·曼纽"
 omen_spenta_mainyu_desc:0 "意识到憎恨之灵安格拉·曼纽只寻求摧毁一切美好和神圣的事物，阿胡拉·马兹达赋予了斯潘塔·曼纽，这位最神圣的精神，权威来对抗邪恶的黑暗意志，并为琐罗亚斯德教信徒带来光明和善良。"
 omen_vahista:0 "瓦西塔"
 omen_vahista_desc:0 "注视这神圣之火，凡人啊，思考其舞动的火焰中不断变化的现实本质。要知道，正是瓦希斯塔被阿胡拉·马兹达委以重任，维护正义之道。当时间终结之时，审判之日到来，灵魂将被衡量和评判，瓦希斯塔将会站在他的创造者身旁，对人类的行为和动机做出裁决。"
 omen_vishtaspa:0 "维什塔斯帕"
 omen_vishtaspa_desc:0 "维什塔斯帕是较早追随查拉图斯特拉的人物，被认为是“他的盟友”。维什塔斯帕被尊为查拉图斯特拉的庇护者，并被认为是第一个琐罗亚斯德教社区的建立者。在希腊-罗马传统中，维什塔斯帕被称为“希斯塔斯佩斯”，并被认为是一位古老的大师。他也出自传奇的凯亚尼王朝的贵族血脉。"
 omen_vohu:0 "沃胡"
 omen_vohu_desc:0 "在阿胡拉·马兹达包罗万象的智慧之下，他创造了六位不朽的存在，被称为“阿美沙·斯潘塔”，以执行他的神圣意志，而沃胡是这些侍从中的首席。因为沃胡体现了阿胡拉·马兹达的神圣之爱，他引领逝者的灵魂前往等待着信徒们的极乐之地。"

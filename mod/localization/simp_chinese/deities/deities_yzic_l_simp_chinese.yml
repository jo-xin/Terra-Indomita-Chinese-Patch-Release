l_simp_chinese:
 deity_bal:0 "$omen_bal$"
 deity_chqov:0 "$omen_chqov$"
 deity_eri:0 "$omen_eri$"
 deity_geirq:0 "$omen_geirq$"
 deity_keq:0 "$omen_keq$"
 deity_milk:0 "$omen_milk$"
 omen_bal:0 "巴尔·伊兹"
 omen_bal_desc:0 "山之主，巴尔·伊兹之灵是一位最尊贵的主人，赐予我们知识，并在伟大的熊节结束时扮演关键角色。据说，曾经海水泛滥如此之巨，以致山变成了河，河变成了山。"
 omen_chqov:0 "奇科夫·伊兹"
 omen_chqov_desc:0 "奇科夫·伊兹，最受尊崇的伊兹。熊之灵对尼夫赫人至关重要。熊节是一项重要的宗教节日，向熊主奇科夫·伊兹献祭，以便他们能回归山神之处。"
 omen_eri:0 "埃里·伊兹"
 omen_eri_desc:0 "埃里·伊兹，河流之主，愿他们祝福我们的庄稼。河流是土地的生命之源，滋养着土地上的一切——从我们遇到的强大动物到最娇嫩的叶片。"
 omen_geirq:0 "盖尔奇·伊兹"
 omen_geirq_desc:0 "强大的盖尔奇·伊兹是海洋之主。据说海水曾泛滥如此之巨，以致河变成了山，山变成了河。盖尔奇·伊兹，请祝福我们的航行，赐予平安之海。"
 omen_keq:0 "凯克·伊兹"
 omen_keq_desc:0 "凯克·伊兹，狐之灵，是强大的灵。据说某些拥有超自然力量的人可以引导凯克·伊兹的力量，将自己变成狐狸。"
 omen_milk:0 "米尔克·伊兹"
 omen_milk_desc:0 "我们称之为米尔克或金尔的可怕伊兹。它们在我们前往姆雷沃的路上纠缠我们。我们应该安抚米尔克，让它们不要干涉我们的路途。我们必须妥善照料死者，只有这样米尔克才会帮助我们而非伤害我们。"

 men_description:0 "我们祈求这位月神赐予人民安全与庇护。在他的注视下，异议者将被平息。"
 omen_agdistis:0 "阿格狄斯提斯"
 omen_agdistis_desc:0 "这位野性的双性神祇阿格狄斯提斯将让我们的士兵和战士疯狂地投入战斗。有了这位神祇在我们这边，我们的人民将战无不胜。"
 omen_attis:0 "阿提斯"
 omen_attis_desc:0 "被阉者阿提斯将会把他的血洒遍我们的庄稼并保佑它的长势远超以往。由于我们从他的恩赐获得了丰饶的收成，我们比将见证我们的人民再次变得强大。"
 omen_bagaios:0 "巴该俄斯"
 omen_bagaios_desc:0 "巴该俄斯是弗里吉亚的风暴与天气之神，通常被相信是美好时光和事物的赐予者。这位神名也与丰饶相联系，通常在有需要、有困难时被呼求，以保护我们人民。\n\n希腊人中，祂通常与他们的主神宙斯联系在一起。"
 omen_berecyntia:0 "贝雷金提亚"
 omen_berecyntia_desc:0 "库柏勒的‘贝雷金提亚’头衔指的是女神与贝雷金特斯山的联系，这座山位于弗里吉亚，即库柏勒被崇拜的古代安纳托利亚中部地区（现今土耳其）。这座山被视为神圣，是女神重要节庆和仪式的举行地。"
 omen_broteas:0 "布罗特亚斯"
 omen_broteas_desc:0 "布罗特亚斯是弗里吉亚神话中的人物，有时与女神库柏勒相关。他据说是特洛伊城的国王和河神斯卡曼德尔的儿子。根据一些传说，布罗特亚斯是库柏勒的祭司或奉献者，帮助传播她的崇拜。"
 omen_cybele:0 "库柏勒"
 omen_cybele_desc:0 "$cybele_description$"
 omen_dactyl:0 "达克堤利"
 omen_dactyl_desc:0 "我们向十位达克堤利呈上祭献，祈望他们能降福我们的工匠以知识和智慧。随着我们向前进步，我们希望这智慧能够帮助我们的社会匹敌边境的敌人，保护我们的友邦和盟友。"
 omen_dindymene:0 "丁底墨涅"
 omen_dindymene_desc:0 "伟大母亲的这一面将帮助我们聚集国家的财富、加强我们的力量。有了这些新获得的财宝在手，我们必能高效扩张。"
 omen_idaea:0 "伊达亚"
 omen_idaea_desc:0 "‘伊达亚’是弗里吉亚女神库柏勒的最重要头衔之一。它源自弗里吉亚的神圣山——伊达山，这座山被认为是库柏勒的出生地。‘伊达亚’头衔指的是库柏勒与这座山的联系以及她被视为所有神和女神之母的理念。"
 omen_kakasbos:0 "卡卡斯波斯"
 omen_kakasbos_desc:0 "我们向吕基亚的卡卡斯玻斯献上我们的敬拜，希望他降福我们的商人周游世界时旅途平安。有了他们追寻财富，我们的商贩必能将更多的财宝带回给我们团体。"
 omen_men:0 "门恩"
 omen_men_desc:0 "$men_description$"
 omen_nana:0 "娜娜"
 omen_nana_desc:0 "娜娜是河神桑加里奥斯和仙女梅托珀的女儿。据说她因一颗杏仁而受孕，生下了名为阿提斯的儿子，后者后来成为库柏勒的情人。一些资料显示娜娜和库柏勒可能被视为同一女神的不同面貌。"
 omen_nicaea:0 "尼西亚"
 omen_nicaea_desc:0 "尼西亚源自阿提斯的神话，据说他是娜娜所生，娜娜是一位处女，被一颗从阿格狄斯提斯阉割遗骸上长出的树上掉下来的杏仁所孕育。娜娜在阿格多斯山生下阿提斯，这个婴儿被遗弃在山上。婴儿阿提斯被一只公山羊发现并养育，后来成长为库柏勒的祭司。尼西亚被描述为阿提斯的妻子。一些学者认为尼西亚可能是与比提尼亚地区相关的地方女神或次要神祇，后来该地区的城市以她的名字命名。\n\n#!神化效果：$military_apotheosis_capital_freemen_effect_tt_description$"
 omen_pessinuntica:0 "佩西努提卡"
 omen_pessinuntica_desc:0 "佩西努提卡是弗里吉亚母神库柏勒的头衔，指的是她与佩西努斯城的联系，佩西努斯是弗里吉亚库柏勒崇拜的重要中心。佩西努斯这个名字源自安纳托利亚语‘pissa’，意思是‘岩石’或‘悬崖’，据信该城市的圣石——被崇拜为女神形象的陨石——最初是在附近的山中发现的。\n\n佩西努提卡头衔突显了库柏勒与这座城市和它的圣石的联系，这块圣石被认为体现了她的神圣存在。它还强调了她作为这座城市及其人民保护神的角色。佩西努斯的库柏勒崇拜在古代非常有影响力，她的崇拜传播到罗马帝国的其他地方。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_sandon:0 "桑顿"
 omen_sandon_desc:0 "桑顿是安纳托利亚的天气之神，常常与战争联系在一起，在战时被呼求。作为奇里乞亚最重要的神明之一，祂有许多祭坛和神庙，尤其是在塔耳苏斯附近。\n\n这位神明与武器、鲜花和狮子联系在一起。希腊人将这位神祇与自己的英雄之神赫拉克勒斯相联系。"
 omen_sangarios:0 "桑加里奥斯"
 omen_sangarios_desc:0 "桑加里奥斯是河神和库柏勒女神的儿子。以他名字命名的河流被认为是神圣的，它流经佩西努斯城，这座城市是库柏勒崇拜的重要中心。\n\n桑加里奥斯也与丰饶和农业相关，因为以他名字命名的河流对于灌溉养活该地区人民的庄稼至关重要。他经常在祈祷和献祭中被呼求，以确保丰收和土地的持续肥沃。"
 omen_sebdios:0 "塞卜迪奥斯"
 omen_sebdios_desc:0 "塞卜迪奥斯，或萨巴兹，是弗里吉亚和色雷斯的骑士和天空之父神。在弗里吉亚神话中，塞卜迪奥斯被认同为弥达斯，弗里吉亚的传说国王，据说他是女神库柏勒的奉献者。\n\n萨巴兹通常被描绘成骑在马或牛上的胡须、角状人物，有时他会持有一根手杖或蛇。他也与白羊座星座相关，这个星座有时被称为‘萨巴兹的公羊’。"
 omen_sipylene:0 "西皮勒涅"
 omen_sipylene_desc:0 "‘西皮勒涅’是库柏勒的一个别称。它源自西部安纳托利亚的西皮勒山，这座山被认为是库柏勒的起源地。这座山被视为神圣，与女神相关的几个神话和传说都与之有关。库柏勒的‘西皮勒涅’别称强调了她与这座神圣山的联系及其在女神神话和崇拜中的重要性。"

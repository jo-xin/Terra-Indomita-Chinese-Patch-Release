 omen_amel_ali:0 "阿梅尔·阿里"
 omen_amel_ali_desc:0 "阿梅尔·阿里曾是我们人民的女王，她以极大的声誉闻名，对待那些有幸称她为母亲的人充满温情，像对待自己的孩子一样关怀她的人民。虽然她因仁慈的统治而被人们深情地铭记，阿梅尔·阿里同样被誉为她那个时代最快的女子，让任何敢于与她赛跑的人都感到谦卑；这无疑是她神圣地位的证明。"
 omen_arraweelo:0 "阿拉韦洛"
 omen_arraweelo_desc:0 "阿拉韦洛是昔日备受赞誉的女王，她在我们的文字记录之前的时代统治，尽管她的事迹至今仍被那些记忆犹新的人传唱。她拒绝屈服于丈夫残酷的命令，后者试图将女性的角色限制在传统的仆从地位。阿拉韦洛扭转了局面，教导女性们反其道而行之，从而将她们从男权专制的压迫中解放出来。她认为较柔和的一性才是两者中更为睿智的，因而天生就是领导者，她的神圣典范至今仍激励着我们的人民。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_ayaanle:0 "阿雅纳勒"
 omen_ayaanle_desc:0 "有些人可能会将他们称为天使，代表至高无上的全能瓦克与人类进行交流，但阿雅纳勒并不能被简单的词汇或描述所束缚。好运伴随着阿雅纳勒的脚步而来，他们将瓦克的神圣礼物从天界带下来，与下方的人们分享。"
 omen_biriir_ina_barqo:0 "比里尔·伊纳·巴尔戈"
 omen_biriir_ina_barqo_desc:0 "他佩戴无人可举之戒，或称善良公正的巨人比里尔·伊纳·巴罗，安详地居住在他神圣的家——鸟之洞穴。曾经是半个世界的统治者，比里尔击败了邪恶的巨人哈巴德·伊纳·卡马斯，后者奴役了另一半的世界，永远粉碎了他的暴政。那些遭受不公正对待的人只需呼唤比里尔·伊纳·巴罗，他不能忍受见到邪恶，将会帮助他们战胜自己生活中的巨人。"
 omen_buuti:0 "布提"
 omen_buuti_desc:0 "恶魔德赫迪尔的女儿布蒂选择背离母亲的道路，转而帮助保护人民。因背叛而受到诅咒，布蒂的形态变成了食人的野兽，现在她与其他黑暗生物一起潜伏在森林中。"
 omen_habbad_ina_kamas:0 "哈巴德·伊纳·卡马斯"
 omen_habbad_ina_kamas_desc:0 "在诸神行走于大地的时代，凶残暴虐的巨人哈巴德·伊纳·卡马斯被赋予了统治人类半数领域的权力，他像僭主和独裁者一样统治着自己的奴隶。当人们再也无法忍受他的邪恶行径，灵魂都在呼喊着寻求怜悯之时，哈巴德·伊纳·卡马斯最终被他的同辈，巨人比里尔·伊纳·巴罗推翻，终结了他的黑暗统治。"
 omen_huur:0 "胡尔"
 omen_huur_desc:0 "恶人在被称为胡尔的阿雅纳勒面前逃窜，这位迅速的鸟神快速飞来执行瓦克的神圣正义。胡尔被视为神怒的先驱和死亡的使者，令恶人极度恐惧；恶人们一见他残忍的爪子就会枯萎，听到他愤怒的尖叫声就会颤抖。"
 omen_nidar:0 "尼达尔"
 omen_nidar_desc:0 "当受压迫者呼求复仇之时，正是尼达，这位正义之神回应了他们的呼唤，因为他将纠正那些对正义之人犯下的错误。\n\n尼达是一位阿雅纳勒，一位遵从全知的瓦克意志的天界存在，并代表瓦克与人类进行交流。"
 omen_qori_ismaris:0 "戈里·伊斯马里斯"
 omen_qori_ismaris_desc:0 "随着夜幕降临大地，变形者科里·伊斯玛里斯脱去他的人形，变得如同鬣狗一般，在阴影中潜行，在人类的土地上徘徊。通过摩擦他随身携带的护身符——一根蕴含神秘力量的魔法棍棒，科里·伊斯玛里斯再次能够变回人的形态。"
 omen_waaq:0 "瓦格"
 omen_waaq_desc:0 "在诸神之中，谁能与瓦格相比？这位创造者和保护者以其赐予生命的雨水祝福着他的子民。是否有任何事情不是由他的仁慈所决定和引导的？\n\n瓦格是与其崇拜同名宗教中的最高神祇，他能够指挥风暴并将神之水洒向他的信徒。正是瓦格指挥着阿雅纳勒，这些天界的调解者直接照看着他的信徒。"
 omen_wagar:0 "瓦加尔"
 omen_wagar_desc:0 "在几乎每一个遵循天空之神瓦克旨意的家庭中，都能找到瓦加尔的木雕像，它在生育仪式中的角色众所周知。正如树木连接天地，充当二者之间的桥梁，瓦加尔也同样连接着信徒与瓦克的旨意，瓦克赐福他的信徒以丰饶和力量。"
 omen_wiilwaal:0 "威瓦尔"
 omen_wiilwaal_desc:0 "一位成就非凡、名声显赫的古代国王，威尔瓦尔因其英勇行为超越了凡人的身躯，最终接近了某种类似神祇的存在。\n\n威尔瓦尔被信奉瓦格信仰的人们所崇拜，他们铭记着他伟大而英勇的事迹，并祈祷他的战斗精神和神圣智慧继续指引着他的人民。"

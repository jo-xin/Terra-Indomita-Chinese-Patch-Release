 omen_aristeo:0 "阿里斯特奥"
 omen_aristeo_desc:0 "我们可以请求您的帮助，您这位建立了卡拉里城的人，愿我们的橄榄树和葡萄藤茁壮成长，愿我们的土地丰产我们需要的果实。\n\n阿里斯塔尼斯是一位英雄，被尊崇为萨丁尼亚人的神祇。他是卡拉里的重要城市的创始人，卡拉里位于南部。阿里斯塔尼斯的崇拜与田野的肥沃、蜂蜜、橄榄和葡萄的丰收紧密相关。"
 omen_assemini:0 "阿塞米尼"
 omen_assemini_desc:0 "这是一位与吕底亚的阿尔忒密德斯女神相关的神祇，她是一位生育、自然和森林的女神；是野生动物和狩猎的守护神。与鹿的象征紧密相关，这种鹿的形象广泛存在于努拉吉时期的图腾中，尤其是在船首处放置的鹿头雕像的形式。"
 omen_babai:0 "希德·阿迪尔"
 omen_babai_desc:0 "光明之主将赐福我们的人民，他是猎手，是强大的，阿东·希德·阿迪尔·巴布）。这是萨丁尼亚人的父亲的一种显现形式，在萨多帕托里斯神庙受到崇拜，这座神庙建立在一个古老圣地的废墟之上。许多人前来朝圣寻求他的帮助，但也有很多人害怕他的诅咒。\n\n这是萨丁尼亚人的父亲的一种显现形式，在由迦太基人在一个古老的萨丁尼亚圣地之上建造的萨多帕托里斯神庙受到崇拜。他被称为阿东·希德·阿迪尔·巴布，这是一系列称号，翻译过来意为“主、猎手、强大的、父亲”。特别是，这位神祇面貌的追随者会通过其他迦南神祇间接地向这位实体祷告，这些迦南神祇被视为中介，如梅尔卡特和沙德拉帕。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"
 omen_bakis:0 "巴基斯"
 omen_bakis_desc:0 "一位广为人知的神祇，源自伊特鲁里亚的福卢伦斯，相当于罗马的巴克斯。他是酒神，与土地和田野的肥沃相关联；是幸福、健康和生长的守护神。"
 omen_daedalos:0 "萨马"
 omen_daedalos_desc:0 "太阳圆盘，我们父亲的一种显现形式，愿它赋予我们战胜黑暗和邪恶的力量。他是人间正义与公正的化身。\n\n这是萨丁尼亚人的父亲的一个别名，很可能是指太阳或太阳圆盘，这是与神祇紧密相关的显著符号，特别是与太阳公牛的形象。这位神祇的这一面相与人间的正义和公正密切相关，与他作为死者审判者的地位相联系。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_horon:0 "霍隆"
 omen_horon_desc:0 "霍隆，也拼写为哈隆或哈万，是一位来自吉萨的古埃及神祇。学者们普遍认为霍隆与哈马奇斯相关，哈马奇斯也被称为荷鲁斯，从词源学上看二者有关联。事实上，霍隆的起源在于迦南。在埃及，他被称为哈万，但在迦南的传统拼法中是霍隆。他还可能是吉萨巨狮像的原型。在迦南传统中，他被视为厄运之神，而在埃及传统中，则被视为牧羊人和沙漠的神祇，尤其是沙漠保护神。"
 omen_iolaus:0 "乌西尔"
 omen_iolaus_desc:0 "太阳乃吾父之象征，将以不可名状者之光赐福我民。日轮与光明之牛将以其威能击溃我们的敌人。\n\n在撒丁人之父的诸多称号中，乌西尔指代太阳，这一象征与古老的光明之牛形象紧密相连。后者是这位神祇不可分割的一部分；早在前努拉吉时代，人们便已在精灵之家中雕刻其形象，而努拉吉时代的努拉吉塔与圣井之内亦可见其踪迹。"
 omen_maimone:0 "迈蒙"
 omen_maimone_desc:0 "愿我们的父亲回应我们的呼唤，用适量的雨水和水分祝福我们的田地。他的雷霆和云朵将击败那些不遵守他诫命的人。\n\n这是萨丁尼亚人的父亲的一个重要别名，特别与天气和雨水相关。经常在个人祈祷中被提及，同时也与名字“马穆西”及其缩略形式“马穆托内斯”相关，这是萨丁尼亚仪式中戴面具的人物的名字。\n\n#!神化效果：$naval_apotheosis_effect_tt_description$\n$storm_of_the_century_effect_tt_description$"
 omen_manorvae:0 "曼奥尔盖"
 omen_manorvae_desc:0 "这是一位源自伊特鲁里亚的门尔瓦的神祇，她是一位类似于希腊女神雅典娜的战略和战争女神。她同时也是艺术、贸易和教育的守护神，并拥有影响天气的能力。"
 omen_merre:0 "梅瑞"
 omen_merre_desc:0 "在我们的人民遭受疾病或灾难的时候，我们可以请求我们的父亲驱除病痛，治愈我们的身体，他是光明之神。\n\n萨丁尼亚人的父亲之一的别名，与神祇的治愈能力有关，通常在疾病时被人们祈求帮助。\"梅瑞\"这个词意味着“主”，常被外族人与希腊的阿斯克勒庇俄斯和罗马的埃斯库拉庇乌斯相联系。"
 omen_mother_goddess_nuragic:0 "曼图玛"
 omen_mother_goddess_nuragic_desc:0 "努拉吉文化和科西嘉文化的母神与地中海地区的母神相关。如同西德·阿迪尔一样，她的崇拜现在仅限于岛屿内陆地区，等待着重新夺回她的土地。\n\n这是一位与伊特鲁里亚的曼图尔纳女神相关的女性神祇，曼图尔纳是婚姻、生育和配偶的守护神。"
 omen_murgurio:0 "穆古里奥"
 omen_murgurio_desc:0 "作为人与神之间的信使、商人保护者和引领灵魂前往彼岸的引路人，穆古里奥引导逝者的灵魂进入来世。很可能与伊特鲁里亚的图尔姆斯崇拜相关。"
 omen_norax:0 "诺拉克斯"
 omen_norax_desc:0 "诺拉克斯是一位古老的英雄，曾是塔尔希什在其辉煌时期的国王，并且是努拉的创始人。愿他的遗志和力量在这段时期指引我们的人民。\n\n诺拉克斯是在萨丁尼亚人中被提升为神祇的英雄，曾是塔尔希什的国王和努拉的创始人。尽管外族古代文献中存在冲突，与诺拉克斯相关的塔尔希什可能并不是指伊比利亚争议中的塔尔特索，而是指塔尔希什城，或塔里斯（即现在的塔罗斯），这是一个重要的城邦，在公元前500年左右与迦太基的战争之后失去了其显赫的地位。"
 omen_orgia:0 "俄耳吉亚"
 omen_orgia_desc:0 "圣井中的神圣之水将为我们的人民带来繁荣和智慧。愿我们的父亲保护我们的航海者和海员，愿这神圣之水辨别出谁是正义的，谁不是。\n\n在萨丁尼亚人的父亲众多面貌和功能之中，一个显著的角色是与神圣水源的崇拜相关（Orga/Orgia = 源头，水），这些崇拜在结构复杂的圣井和大殿寺庙中进行，或是与地下的神祇形象相关的圣洞。"
 omen_sardus_can:0 "萨尔多"
 omen_sardus_can_desc:0 "光明之伊尔，父亲，光明之公牛，雅和雅胡。他为我们岛屿和人民命名。我们请求您的智慧，愿您赐予我们抵御敌人的力量。努拉吉，我们的塔楼，以您的名字建造，将让我们永远铭记您的遗产。\n\n这是一位古老的神祇，萨丁尼亚及其人民均以其命名。萨丁尼亚人的国家神祇是先前本土的史前努拉吉文化崇拜的直接延续。这是一位没有具体名称的神祇，只通过各种别名来称呼，最突出的是“父亲”，还有光明之伊尔、雅和雅胡。一千年来，萨丁尼亚人建造了数千座石塔，名为努拉克（今天称为努拉吉），以纪念他的名字。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_shadrapa:0 "沙德拉帕"
 omen_shadrapa_desc:0 "沙德拉帕，也称为沙德拉法，是一位鲜为人知的布匿治疗和医药之神。他有时被描绘为手持蝎子或蛇的年轻人。沙德拉帕可能起源于希腊-布匿的文化融合，甚至可能是罗马-布匿的文化融合的结果。他甚至可能是布匿人对希腊神祇的一种解读。不幸的是，关于这位神祇的记载很少，因此很难确切了解沙德拉帕的本质。"
 omen_urgus:0 "乌尔古斯"
 omen_urgus_desc:0 "我们的父亲，他是冥界的审判者，会让古老的恶魔吞噬那些背叛我们人民的灵魂，那些生前不公正的人，那些违背神圣誓言的人。\n\n在与萨丁尼亚人的父亲相关的仪式中，乌尔古斯的形象常常出现在仪式中，表现为一只狂野的野兽，全身覆盖着毛发，它被神的仆人们锁链束缚、鞭打，然后被杀死，以此来保证一年中田地的肥沃。因此，乌尔古斯是一个地下的生物，或者说是一个恶魔，许多努拉吉都以其命名，他也是确保神圣誓言坚固性的存在，因为那些在生前违背誓言的人的灵魂将在死后被乌尔古斯吞噬。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"

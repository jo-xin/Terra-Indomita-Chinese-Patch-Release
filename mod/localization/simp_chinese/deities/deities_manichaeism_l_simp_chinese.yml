 omen_manichaean_buddha:0 "释迦牟尼佛"
 omen_manichaean_buddha_desc:0 "摩尼认为高僧佛陀、琐罗亚斯德和耶稣的教义是不完整的，他的启示是针对整个世界的，称他的教义为“光明的宗教”。佛教对摩尼的宗教思想的形成有重要影响。灵魂的转世成为摩尼教的信仰，摩尼教社区的四方结构，分为男女僧侣（“选民”）和支持他们的非专业信徒（“听众”），似乎是基于佛教的僧伽结构。"
 omen_manichaean_jesus:0 "摩尼耶稣"
 omen_manichaean_jesus_desc:0 "摩尼教的耶稣拥有三个独立的身份。(1) 光明的耶稣，(2) 弥赛亚的耶稣和(3) 受难的耶稣。(1) 作为发光的耶稣，他的主要角色是最高的揭示者和指导者，正是他把亚当从沉睡中唤醒，向他揭示了他的灵魂的神圣起源，以及它被身体和物质混合的痛苦囚禁。(2) 弥赛亚耶稣是一个历史性的存在，他是犹太人的先知，是摩尼的先驱。然而，摩尼教派认为他完全是神性的，他从未经历过人类的出生，因为围绕着他的受孕和出生的概念的物理现实使摩尼教派充满了恐怖。(3) 另一方面，在整个可见的宇宙中，被囚禁的光粒子所遭受的痛苦是真实和内在的。这是由神秘的十字架所象征的，在十字架上，我们灵魂的激情的伤痕被展示出来。在这个神秘的光之十字架上，悬挂着受苦的耶稣（Jesus patibilis），他是人类的生命和救赎。这个神秘的十字架存在于每一棵树、草药、水果、蔬菜，甚至石头和土壤中。"
 omen_manichaean_zoroaster:0 "琐罗亚斯德"
 omen_manichaean_zoroaster_desc:0 "摩尼教声称提出了被其前辈亚当、琐罗亚斯德、佛陀和耶稣的追随者破坏和曲解的完整版本的教义。当它们东移并被翻译成伊朗语言时，摩尼教神灵（或天使）的名字往往被转化为琐罗亚斯德教 yazatas 的名字。因此，Abbā dəRabbūṯā（“伟大之父”，摩尼教的最高光明神），在中古波斯语文本中，要么被翻译成 pīd ī wuzurgīh ，要么被替换成神灵 Zurwān 的名字。同样，摩尼教的原始人物 Nāšā Qaḏmāyā'The Original Man ' 被译为 Ohrmazd Bay ，取自琐罗亚斯德教的神 Ohrmazd。"
 omen_prophet_mani:0 "先知摩尼"
 omen_prophet_mani_desc:0 "摩尼是摩尼教的先知和创始人，摩尼教是一种深受诺斯替主义影响的宗教，在他生前和死后，摩尼教以非凡的速度在东西方传播。摩尼于公元216年出生在巴比伦的塞琉西亚-克提丰或附近。他有帕提亚人的血统，他的父母属于相信轮回的犹太诺斯底基督教教派 Elcesaites。摩尼曾前往印度学习印度教和佛教，回到波斯后被一位祆教徒君主收留，这位国王喜欢他的教义。摩尼的主要作品中有七部是用叙利亚语写的，第八部是用中波斯语写的。摩尼被他的追随者尊为最后的先知和耶稣、佛陀和琐罗亚斯德的转世，尽管他宣称自己是“基督的使徒”，现存的摩尼教诗歌经常以最高的敬意赞美耶稣和他的母亲玛利亚。他最终与他的祆教皇家赞助人失之交臂，后者开始迫害摩尼教。他在公元274年至277年间的某个时候被囚禁、拷打并在贡德萨普尔被处决。据资料显示，摩尼在最后的日子里安慰他的来访弟子，教导他们，他的死亡除了让他的灵魂回到光明世界之外，没有其他后果。"

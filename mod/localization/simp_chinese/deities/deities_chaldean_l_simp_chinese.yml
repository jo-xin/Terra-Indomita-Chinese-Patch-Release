 omen_adad:0 "阿达德"
 omen_adad_desc:0 "阿达德是一位风暴之神，是统治天空并掌控元素的强大神祇。他的声音如雷鸣，脚步如闪电，愤怒如暴风雨。作为典型的美索不达米亚神祇，他有双重性格，代表了底格里斯和幼发拉底河，既象征生命与农业，又有多变和暴力的特质。因此，尽管阿达德是强大的风暴与天空战神，经常与托尔和宙斯等同，他也被认为是丰饶之神，帮助作物生长。\n\n阿达德常被描绘为手持权杖或斧头，象征他的力量和权威。他也常被描绘为有翅膀或站在牛背上，进一步强调他与力量和王权的联系。\n\n#!神化效果：$naval_apotheosis_effect_tt_description$"
 omen_adamma:0 "阿达玛"
 omen_adamma_desc:0 "在埃卜拉文献中，阿达玛是雷什普的配偶。她与其丈夫同属一组八位埃卜拉神祇，这组神祇与古代诸王相关。阿达玛是埃卜拉毁灭后仍被继续崇拜的神祇之一。胡里安人崇拜她，并将其信仰传播到各地。"
 omen_agu:0 "阿古"
 omen_agu_desc:0 "阿古被提到是与死去的国王有关的八位神祇中的一部分。他的配偶是女神古拉杜。关于他我们知之甚少，但他很可能与其他死去的国王神灵一起在达里卜被崇拜。"
 omen_anu:0 "安努"
 omen_anu_desc:0 "安努原本是美索不达米亚文明初期的首要神灵。尽管安努的相对力量在其他主要神灵面前有所下降，他仍然是美索不达米亚万神殿中最重要的神灵之一，常被描绘为天空之神和前任诸神之王。根据美索不达米亚神话，安努是众神之父和宇宙的创造者。安努与力量、权威和王权有关，被认为掌控凡人的命运。安努常被描绘为戴着有角头饰，手持权杖，象征他的力量和权威。他有时也会与天球或“命运之表”一起描绘，代表他对天堂和凡人命运的控制。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_ashima:0 "阿希玛"
 omen_ashima_desc:0 "阿希玛是主要由黎凡特的亚兰语和叙利亚语人口崇拜的女神。她有时被视为命运或天命的女神，常被描绘为手持弓箭。阿希玛常在个人祈祷和咒语中被祈求。人们祈求她保护自己和亲人，赶走厄运和不幸。在一些传统中，阿希玛也与治愈有关，人们祈求她帮助治愈疾病和伤害。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_ashshur:0 "阿舒尔"
 omen_ashshur_desc:0 "阿舒尔，又称阿什舒尔，是亚述万神殿的主神。他是一位与占卜相关的天空之神，被认为拥有带来好运和厄运的力量。阿什舒尔也被视为战神，他的象征是一个带翼圆盘，代表他翱翔天际、保护子民免受伤害的力量。位于底格里斯河畔的阿舒尔城是该神的崇拜中心，被认为是古代近东最神圣的城市之一。亚述人相信阿什舒尔是他们力量和成功的源泉，他们在帝国各地为他修建了许多神庙和雕像。\n\n亚述诸王通过他们与阿什舒尔的关系宣称神圣合法性，他们的军事行动常常以他的名义进行。亚述军队在他的旗帜下行军，旗帜上描绘着一个带翼日轮，带有四角星和指向四方的箭矢。阿什舒尔常被描绘为一位蓄须男子，戴着角状头饰，手持弓箭，象征着他作为战神的作用。"
 omen_ashtaroot:0 "阿什塔露"
 omen_ashtaroot_desc:0 "阿什塔露，也被称为阿斯特罗斯或塔罗，是一位丰饶和性的神灵。她可能最初是迦南版的伊什塔尔（阿斯塔特），然而，阿什塔露后来成为一位独特的神灵，一些教派崇拜她为主要的丰饶女神。\n\n在历史的后期，基督教采纳了阿什塔露的男性版本，称之为阿斯特罗斯，并视其为邪恶三位一体的成员之一。尽管阿斯特罗斯在基督教中的邪恶解释很明显，但作为迦勒底女神崇拜的阿什塔露显然更类似于她的对应物阿斯塔特和伊什塔尔，主题包括性、爱情和战争。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_awal:0 "阿瓦尔"
 omen_awal_desc:0 "阿瓦尔是提洛斯岛上崇拜的神灵。他被称为鲨鱼和海洋之神，常被描绘为有鲨鱼头的人。作为水手和渔民的守护神，他被认为保护他们免受危险，确保丰收。阿瓦尔也与治愈有关，他的神庙被认为是病人和受伤者的避难所。崇拜者会向他献上鱼、珍珠和其他珍宝，以期获得他的恩宠。阿瓦尔是提洛斯地区最重要的神灵之一，他的影响力延伸到阿拉伯半岛的其他地区。事实上，阿瓦尔的名字意为“第一”或“至高”，清楚地显示了他对提洛斯人的重要性。"
 omen_barama:0 "巴拉玛"
 omen_barama_desc:0 "巴拉玛是神灵库拉的妻子，因此是埃卜拉神圣夫妇的一部分。她与库拉一起受到广泛崇拜，直到埃卜拉的灭亡。她的名字意为多彩，可能指的是她自己，或她的衣服。"
 omen_bau:0 "鲍"
 omen_bau_desc:0 "鲍是丰饶、治愈和狗的女神。她常被描绘为身边有一只狗，象征她与这些忠实动物的亲密关系。鲍常被描绘为一个女人，头部是狗的形象，或直接作为一只狗。她与人类和动物的治愈有关，相信她有使生育和丰饶的能力。作为狗的女神，她有时被祈求保护狗和其他驯养动物。\n\n除了作为治愈和丰饶的女神，鲍也与冥界和死者有关。她被认为有通往死者领域的权力，有时在葬礼仪式中被祈求。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_belatu:0 "贝拉图"
 omen_belatu_desc:0 "贝拉图是哈达巴尔神的妻子。像埃卜拉万神殿中的其他妻子一样，我们对她知之甚少。她的名字意为“女士”。她是与死去的国王有关的八位神灵之一，与她的丈夫一起。"
 omen_dariba:0 "达里巴"
 omen_dariba_desc:0 "达里巴是一个鲜有提及的神灵，其真实名字已经失传。我们所知道的是，他与达里卜村有关，这里是一个死去的国王崇拜中心。他是与死去的国王有关的八位神灵之一，也是其中两个没有被提到为神灵夫妇之一的神灵之一。他可能是伊莎拉的配偶，使所有与死去的国王有关的八位神灵成为神灵夫妇，但证据太少，无法确定。"
 omen_dumuzid:0 "杜穆兹"
 omen_dumuzid_desc:0 "杜穆兹，也被称为塔木兹，是一位掌管丰饶与植物的牧羊神。他在古代美索不达米亚广泛被崇拜，包括苏美尔、阿卡德和巴比伦文化中。杜穆齐被认为是伊什塔尔的配偶，他的神话故事多围绕两者动荡的关系展开。除了与丰饶和农业相关外，杜穆齐还与冥界和来世有关，他每年的死亡与复活象征着自然界生命与死亡的循环。他常被描绘为年轻的牧羊人，他的形象与象征经常融入美索不达米亚的宗教仪式与典礼中。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_ea:0 "伊亚"
 omen_ea_desc:0 "伊亚是学者、智者、工匠和发明者的保护神。他的知识和智力常救国于灾难。难道他不是那位终结次神罢工的那一位？难道他不同样是从大洪水中拯救人类，下令乌特纳庇什提牟建造巨型木方舟的那一位？\n\n有了伊亚的恩赐，学者、经师和饱学者将获得智慧与知识、慧眼与洞见。随着他们的发明创造，他们将使我国再次成为世界的心脏，让我们的诸城再次强大成为规则之座，散播和平与繁荣。"
 omen_enlil:0 "恩利勒"
 omen_enlil_desc:0 "恩利勒创造了天下万物。他是众神之父，人类与国度的创造者。他言出法随，兴灭帝国，他决定着每个人的命运。如果恩利勒以恩惠俯身看顾我们，他必将赐予我们我国周围的所有土地。他将准许大能君王的归来，并给予他们权柄，统御无疆。愿我们在往昔带走凡人的强大军队亦或灾祸，将我们的国度扩张至地极，直至他的呼吸之风所及之处：环绕世界的阿普苏苦水的岸边。"
 omen_ereshkigal:0 "厄瑞什基伽尔"
 omen_ereshkigal_desc:0 "厄瑞什基伽尔是美索不达米亚万神殿中最强大的神之一。她是冥界的女王，也是死者之地的伟大女主人。尽管巴比伦和亚述的统治者更倾向于男性神灵，她的权威依然持续。\n\n厄瑞什基伽尔强大本性的一个好例子是伊什塔尔下冥界的神话。伊什塔尔决定访问她的姐姐厄瑞什基伽尔的冥界，参加厄瑞什基伽尔丈夫的葬礼。厄瑞什基伽尔因她丈夫之死部分归咎于伊什塔尔，决定惩罚她。厄瑞什基伽尔让伊什塔尔经过七道门，每道门都要求她脱下一件衣服，直到完全赤裸。厄瑞什基伽尔然后审判并羞辱伊什塔尔，命令她的仆人杀死伊什塔尔，把她的尸体挂在钩子上警告其他神灵。尽管伊什塔尔被复活并获救，这依然展示了厄瑞什基伽尔在她领域中的权力。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_gordys:0 "戈尔迪斯"
 omen_gordys_desc:0 "戈尔迪斯是特里普托莱莫斯的儿子之一，据说是众多随著名阿尔戈船航行的阿尔戈英雄之一，他们围绕庞图斯尤克西诺斯探险并定居在未开化的土地上。像其他许多阿尔戈英雄一样，戈尔迪斯没有返回希腊，而是探索了东方的内陆地区。他在戈尔迪斯山脉定居，并以其地理位置命名，建立了戈尔迪斯人的文明。"
 omen_gula:0 "古拉"
 omen_gula_desc:0 "古拉，也被称为宁卡拉克，是美索不达米亚万神殿中重要的女神，主要与治愈和医学有关。她被认为有治愈疾病的能力，特别是与怀孕和分娩有关的疾病。她常被描绘为一位美丽的女人，手持一只狗，象征着她的治愈力量。她有时也被描绘为带有狮子或龙，代表她的力量和权威。她与狗和其他动物的联系使她被视为动物的保护者。"
 omen_guladu:0 "古拉杜"
 omen_guladu_desc:0 "古拉杜被提到是与死去的国王有关的八位神灵中的一部分。她的配偶是同样神秘的神灵阿古。古拉杜和阿古都只被简短提及，我们对他们知之甚少。"
 omen_hadabal:0 "哈达巴尔"
 omen_hadabal_desc:0 "哈达巴尔在古代埃卜拉居民中仅次于库拉。尽管如此，我们对他的性格了解甚少。目前，有一种理论认为他可能是一位月神和农业神。他也是与死去的国王有关的八位神灵之一，毫无疑问是其中最突出的。"
 omen_inzak:0 "因扎克"
 omen_inzak_desc:0 "因扎克，也被称为恩扎格、恩扎克或安扎克，是一位主要由迪尔蒙文明崇拜的枣椰树神。他是迪尔蒙万神殿中的两位主要神灵之一，另一位是他的配偶梅斯基拉克。迪尔蒙人称因扎克为阿加鲁姆之主。尽管因扎克主要与迪尔蒙人有关，他在美索不达米亚甚至可能在亚述也受到崇拜。他在埃兰的苏萨城也受到崇拜。"
 omen_ishtar:0 "伊什塔尔"
 omen_ishtar_desc:0 "伊什塔尔是尚武女神，她的七件魔力衣饰让男人们疯狂。她可以迫使他们跌入绝望深渊，也可以勉励他们提升自己直至至高荣耀。一如她对待她的情人塔姆兹，她将他遗弃在冥界，亦如她对待吉尔伽美什，他打倒了她的残暴公牛，给乌鲁克带回和平。\n\n伊什塔尔有两面，她是肉体之爱的保护神，这一面驱使男人与女人不断繁衍；她同时也是女战神，促使男人们涌入军队走上战场。有了她的恩赐，我们的军队必将充满年轻力壮的男子，获得扩张国土的能力。"
 omen_istaran:0 "伊什塔兰"
 omen_istaran_desc:0 "伊什塔兰是古代苏美尔城邦德尔的神圣守护神，以其智慧的判断力而著称。甚至国王们据说在判决时也以伊什塔兰为榜样。他的妻子女神Šarrat-Dēri被尊为德尔女王，而他的仆从是蛇神Nirah。\n\n在纪念碑（界石）上，伊什塔兰通常以蛇的形象出现，这可能是Nirah或伊什塔兰本人。他也被认为是一位濒死之神，在与埃库尔神庙有关的某些仪式中甚至与杜穆兹相提并论。\n\n尽管他的国家崇拜在中巴比伦时期逐渐衰退，伊什塔兰在后来的时期仍然在德尔受到崇敬。事实上，拉加什国王古迪亚甚至在宁吉尔苏的吉尔苏神庙中为伊什塔兰安装了一个神殿。即使在今天，他仍然是古代美索不达米亚神话和宗教中的重要人物。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_kura:0 "库拉"
 omen_kura_desc:0 "库拉是古代城邦埃卜拉最突出的神灵，也是埃卜拉的守护神。他被认为是国王之神，与君主制密切相关。在所有神灵中，库拉是最有证据支持的。埃卜拉灭亡后，他的崇拜完全消失。"
 omen_marduk:0 "马尔杜克"
 omen_marduk_desc:0 "马尔杜克是贝尔，意即“君主”，他也是世间一切的规划者。他维持我国的法纪；他是打败了妄图制造灾祸的海神提亚玛特的那一位；当埃拉来到巴比伦散播矛盾与动乱，他是那位赶回并恢复秩序繁荣的那一位。\n\n有了马尔杜克的恩赐，我国将重获新生；由于诸神都跟从他并遵守他的圣言，和平、法纪和福祉得到了保障，并且所有人都将匍匐在诸神之王和万王之王的面前。"
 omen_meskilak:0 "梅斯基拉克"
 omen_meskilak_desc:0 "梅斯基拉克是因扎克的配偶，是迪尔蒙的两位主要神灵之一。她的名字在美索不达米亚被称为宁西基拉，意为“纯洁之女”。在美索不达米亚神话中，作为迪尔蒙女神的梅斯基拉克向恩基神寻求帮助，因为她的土地只是沙漠。恩基同意并赐予迪尔蒙淡水。\n\n宁西基拉这个名字可能看起来很熟悉，因为它也被用来指代另一个完全不同的神灵。这个宁西基拉神是女神利辛的配偶，最终也被视为女神，部分原因是与梅斯基拉克意外同名。\n\n#!神化效果：$fertility_apotheosis_capital_slaves_effect_tt_description$"
 omen_nabu:0 "纳布"
 omen_nabu_desc:0 "纳布是智者中的智者，他将亲手书写的知识赐予每个人，上至国王下至底层文人都能学到古代统治者的功绩以及管理国家的好办法，包括治理棕榈林、田地、庙宇和运河。多亏了他的恩赐，诸神与国王的经师们变得兢兢业业；他们书写泥板与卷轴的速度提高了，档案被保存妥善了，这将让我国兴旺。感谢这位神祇的恩赐及他的知识与洞见，我们的繁荣将得保障，诸神与国王的宝库将得到充盈。"
 omen_nanaya:0 "南娜雅"
 omen_nanaya_desc:0 "南娜雅，也被称为南妮亚或南奈亚，是美索不达米亚万神殿中的一位丰饶和战争女神。她在乌鲁克市特别受到崇敬，被认为是守护女神伊南娜（伊什塔尔）的女儿。南娜雅与爱情和生育有关，被认为在分娩时保护妇女。此外，她也与战争有关，被认为在战斗中帮助士兵。\n\n南娜雅通常被描绘为一个戴着有角头饰、手持弓箭的美丽年轻女子，象征她与战争的联系。她有时也被描绘为站在狮子上，象征她的力量和权威。南娜雅在古代美索不达米亚很受欢迎，她的崇拜延续到希腊化时期。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_nanshe:0 "南谢"
 omen_nanshe_desc:0 "南谢是古代美索不达米亚宗教中的女神，特别与拉加什市有关。她被崇拜为水、丰饶、预言和社会正义的女神，常被描绘为手持测量杆和水桶，象征她在调节水资源方面的角色。作为社会正义的女神，她被认为为统治者和法官提供指导，她的神庙是法律和经济活动的中心。她也与占卜和梦境有关，她的节日包括净化仪式和祭品，以确保丰收。尽管她的崇拜在巴比伦时期之后有所下降，她在美索不达米亚南部地区仍然是重要的神灵。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_nergal:0 "内尔伽尔"
 omen_nergal_desc:0 "内尔伽尔是战争、瘟疫和冥界之神。他以其巨大的力量、战斗中的凶猛和可怕而闻名。内尔伽尔常被描绘为有狮子头和身体，象征他的力量和凶猛。他也与火有关，常被描绘为带着火焰或手持燃烧的武器。内尔伽尔被认为是冥界女神厄瑞什基伽尔的丈夫，常被描绘为强大的战士，陪同她在旅途中。尽管他与死亡和冥界有关，内尔伽尔也被认为是农业和丰饶之神，有时被祈求在这些领域赐福。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_ninazu:0 "尼纳祖"
 omen_ninazu_desc:0 "尼纳祖，也被称为宁吉兹吉达，是古代美索不达米亚神话中的神灵。他是冥界强大神灵厄瑞什基伽尔的儿子。作为治愈、冥界和死亡之神，他引导灵魂到达最终的安息之地，通常与狗或狮子一起描绘，因为这两种动物被认为有药用价值。尼纳祖也被视为正义之神，国王们常祈求他带来公平与秩序。他的名字意为“深渊之主”，强调了他与冥界的联系。此外，他是一位强大神灵和战神。\n\n#!神化效果：$military_apotheosis_capital_freemen_effect_tt_description$"
 omen_ninlil:0 "宁莉尔"
 omen_ninlil_desc:0 "宁莉尔，也被称为苏德，是苏美尔万神殿中的主要女神。她是苏美尔万神殿首席神祇恩利勒的妻子，月神南纳（辛）的母亲。她的名字意为“空气之女”，与风和丰收有关。\n\n宁莉尔也被视为丰饶女神，受到想要怀孕或确保成功分娩的女性的崇拜。此外，她被认为有治愈疾病、保护免受恶灵侵害和带来好运的能力。\n\n宁莉尔在苏美尔社会中备受尊敬，她的神庙是该地区最重要的神庙之一。尼普尔市被认为是她的主要圣地，她的崇拜在美索不达米亚广泛传播。苏美尔国王常声称自己是宁莉尔选中的，并会向她献祭和祈祷，以期获得她的恩宠。\n\n#!神化效果：$culture_apotheosis_rel_tech_effect_tt_description$"
 omen_nintur:0 "宁图尔"
 omen_nintur_desc:0 "宁图尔，也被称为宁胡尔萨格，是苏美尔和阿卡德神话中的一位重要女神。她是母神和丰饶女神，与大地和生命的培育有关。她的名字意为“山之女主人”，反映了她与自然世界的联系。她常被描绘为一位母亲形象，哺育和照顾她的孩子。宁图尔也与大地女神基有关，她是大地的化身。作为农业女神，宁图尔受到农民的崇敬，她的崇拜中心通常位于农村地区。她也与治愈有关，常被女性在分娩时祈求。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_ninurta:0 "尼努尔塔"
 omen_ninurta_desc:0 "战斗中的尼努尔塔强壮、大能、高昂。他是用沙鲁尔杖击败众魔的那一位，一如他对付安祖与他的石军那样。尼努尔塔可以与他单挑，并在战斗中解决他。如果尼努尔塔以恩惠看顾我们的军队，我们必将凯旋。如果这位伟大的神祇恩赐我们，我们的军队必能击退那些曾欺压我们的人，并且我们将向所有在我们周围想在我国制造混乱的人们问好。如此，他在巴比伦的尼普尔与亚述的卡勒胡的圣所将被重建，恢复它们昔日的荣耀，并且当我们取得胜利时，人民将再次安定地生活。"
 omen_nisaba:0 "尼萨巴"
 omen_nisaba_desc:0 "尼萨巴是美索不达米亚的书写、学习和丰收女神。她常被描绘为手持书写工具和泥板，象征她与书写和教育的联系。尼萨巴也与农业和丰收紧密相连。她被认为是赋予丰富作物和肥沃土地的神灵，因此受到农民和耕作者的崇敬。在一些神话中，她甚至被认为是植被之母和谷物女神。作为学习女神，尼萨巴也与智慧和知识有关。她常被描绘为一位教师，指导抄写员和学者学习书写艺术和宇宙的奥秘。\n\n尼萨巴通常被描绘为头戴谷物头饰，手持书写工具和泥板的女性。她有时会伴有她的丈夫哈亚的象征，通常以公牛的形式出现。在一些描绘中，她还手持测量杆和谷物袋，强调她作为丰饶和丰富之神的角色。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_nusku:0 "努斯库"
 omen_nusku_desc:0 "努斯库是一位亚述的火神。努斯库也以可能被犹太人称为尼斯罗克的神而闻名。由此我们知道，努斯库也是一位鹰神，曾在亚述宗教中占据重要地位。尽管犹太人将尼斯罗克视为地狱中的恶魔，很明显，在迦勒底宗教中，努斯库被提到时与健康有关。事实上，努斯库也是农业和生长之神，很可能是因为这一点，他在基督教宗教中得到了“地狱总厨”的称号。\n\n在更传统的迦勒底神话中，努斯库是驱除恶魔的保护神，众所周知，他是恩利勒的仆从或神圣宰相。一些来源甚至声称他是恩利勒的儿子。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_shamash:0 "沙玛什"
 omen_shamash_desc:0 "沙玛什，又称乌图，是美索不达米亚的太阳神、正义之神、占卜之神和真理的守护神。他是美索不达米亚万神殿中最重要的神祇之一，自公元前3000年以来在整个古代美索不达米亚受到崇拜。沙玛什也与占卜相关，被认为有能力向寻求真理者揭示真相。因此，他常在法律程序中受到祈求以确保公正判决。此外，由于太阳被认为具有治愈特性，他有时也被尊为医药的守护神。\n\n沙玛什常被描绘为一位蓄须男子，手持锯齿刀和松果，立于阶梯式的宝座或山顶之上。他与太阳相关，被认为每天穿越天空，为世界带来光明和温暖。他也被视为正义之神，惩罚恶人，奖赏善者。因此，他常被描绘手持天平，象征对人生前行为的衡量。"
 omen_sin:0 "辛"
 omen_sin_desc:0 "辛，光明的月神，他常被人类敬拜因为他从在乌尔、哈兰亦或阿拉伯的泰马的神庙看顾着他们。他照看着谷物的生长、牲畜与女人们的生育，如果没有他，他们又会如何呢？\n\n有了辛以恩惠看顾我国，收成会丰饶，牛群必翻倍，人口将增长，直至泛滥，一如壮阔的河川泛滥平原直指高山。"
 omen_zababa:0 "扎巴巴"
 omen_zababa_desc:0 "扎巴巴是战争之神，也是基什城的守护神。他也被称为扎玛玛，被认为是恩利勒的儿子。在苏美尔神话中，扎巴巴与神灵尼努尔塔有关，被认为曾在对抗恶魔和其他邪恶力量的战斗中与他并肩作战。\n\n扎巴巴通常被描绘为一位戴着有角头盔、手持权杖或长矛的凶猛战士。扎巴巴在美索不达米亚广受崇敬，相信他在战争和冲突时期为信徒提供保护和援助。在美索不达米亚历史的后期，扎巴巴常被与其他战争之神等同，如阿卡德的阿达德和巴比伦的马尔杜克。他在美索不达米亚宗教和神话中持续了数千年，他的崇拜一直延续到希腊化时期。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"

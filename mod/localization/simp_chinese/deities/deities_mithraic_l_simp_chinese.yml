 omen_angra_mainyu:0 "安哥拉·曼纽"
 omen_angra_mainyu_desc:0 "破坏之力和斯潘塔·迈纽的孪生兄弟，安格拉·迈纽是阿胡拉·玛兹达之子，同时也是琐罗亚斯德教及其分支中二元对立信念中的邪恶面。他的别名“Druj”意为“谎言”，代表着他的贪婪、愤怒和嫉妒；他用这些特质对抗代表光明和创造的斯潘塔·迈纽。\n\n尽管具有邪恶的色彩，但在密特拉教信仰中，他仍有一个小规模的崇拜群体。对崇拜者来说，这可能是一个“混沌崇拜”，他们可能在传统上被视为恶魔的神祇身上找到了某种正面的价值。"
 omen_azhi_dahaka:0 "阿兹·达哈卡"
 omen_azhi_dahaka_desc:0 "阿兹·达哈卡，这条强大的恶龙威胁到了英雄特拉埃托纳的生命。最终，阿兹·达哈卡被这位英雄杀死，但他的力量和令人畏惧的形象激发了许多以他的名字流传下来的传说。"
 omen_cyrus:0 "居鲁士大帝"
 omen_cyrus_desc:0 "公元前600年，一个波斯男孩出生在一个由新巴比伦人、晚期埃及人、吕底亚人和米底人主导的世界。到他于公元前530年去世时，仅仅70年间，这个世界已经永远改变了。这个人就是居鲁士大帝，他在亚历山大大帝成名之前200年就已经征服了已知世界。\n\n除了他传奇的军事征服外，居鲁士还是一个伟大的政治家。他的政策和对宗教的开放态度使得他的帝国在他去世后还能延续数百年，这一点与某个希腊人的帝国不同。通过这种方式，他不仅成为了自己信仰——琐罗亚斯德教（祆教）的传道者，同时也成为了密特拉教信仰中的神话英雄。"
 omen_darab:0 "达拉卜"
 omen_darab_desc:0 "大流士二世，也被称作达拉布，是阿尔达希尔一世的儿子，他继续了父亲对密特拉教信仰的复兴工作，延长了该信仰在波斯琐罗亚斯德教（祆教）的压力下存在的时期。"
 omen_deraz:0 "德拉兹·达斯特"
 omen_deraz_desc:0 "阿尔达希尔一世，也称为阿尔塔薛西斯一世，是一位阿契美尼德王朝的波斯国王，被誉为密特拉教信仰的复兴者。在大流士统治下，琐罗亚斯德教（祆教）逐渐取代了密特拉教，尤其是在许多米底人的信仰中。阿尔达希尔允许密特拉教信仰的第二次兴起，并被米底的祭司团授予了“德拉兹·达斯特”的称号。"
 omen_khshathrita:0 "克沙特里塔"
 omen_khshathrita_desc:0 "克沙特里塔，更广为人知的是他的希腊名字迪奥塞斯，是米底王朝的创始人，这个王朝后来统治了大部分波斯、米底以及周边肥沃新月地带的部分地区。他对于这一地区的未来产生了深远的影响，包括推动了他的古老伊朗信仰的传播，这种信仰后来被称为密特拉教。"
 omen_mithra:0 "密特拉"
 omen_mithra_desc:0 "密特拉是被某些赫伦主义社会成员接受的密特拉教神祇，他与真理、丰收相关，并在强化水源的仪式中扮演角色。\n\n密特拉的崇拜远远超出了他的波斯故乡，被信仰之外的人们所采纳。虽然密特拉从未被祆教先知查拉图斯特拉提及，但这一神祇在祆教信仰中扮演了重要角色。"
 omen_shoithrapati:0 "舒伊特拉帕蒂"
 omen_shoithrapati_desc:0 "舒伊特拉帕蒂是一位受到米底地区半游牧部落青睐的营地女神。虽然只是猜测，但有可能由于她在城市中不太普及，这位女神在乡村地区的信仰持续时间比某些地区中的密特拉教信仰更长，这可能是由于这些地区的孤立性所致。"
 omen_thraetona:0 "特拉埃托纳"
 omen_thraetona_desc:0 "击败恶龙阿兹·达哈卡的传奇英雄是特拉埃托纳。特拉埃托纳在费雷敦的故事中被提及，这个故事讲述了国王费雷敦代表着胜利、正义和慷慨。"
 omen_vata:0 "瓦尤-瓦塔"
 omen_vata_desc:0 "双面神祇瓦尤-瓦塔尤其在佐尔万派祆教中受到欢迎。瓦尤是风的象征，而瓦塔代表大气。在琐罗亚斯德教中，瓦尤-瓦塔既是阿维斯塔（神圣的）又是达瓦（邪恶的），既是天使又是魔鬼。而在佐尔万派祆教中，瓦尤-瓦塔则代表了佐尔万，因此与时间和空间相关联。"
 omen_yima:0 "亚马"
 omen_yima_desc:0 "古代伊朗人将耶玛视为他们的第一位和创始国王。当世界还没有秩序的时候，耶玛这位牧羊人是唯一的善良灵魂。阿胡拉·玛兹达召唤耶玛，询问他是否愿意成为宗教的传播者，然而耶玛拒绝了，他更愿意在地球上建立人类的生活。"
 omen_zurvan:0 "祖尔万"
 omen_zurvan_desc:0 "佐尔万最终成为如此重要的神祇，以至于佐尔万派的祆教成为了祆教信仰中最常见的形式之一。他是无限时间和空间之神。佐尔万是一位超越性的神祇，最早出现在公元前3世纪。"

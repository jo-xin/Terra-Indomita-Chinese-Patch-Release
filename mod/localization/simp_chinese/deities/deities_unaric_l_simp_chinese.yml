 omen_amamichuu:0 "阿摩美久"
 omen_amamichuu_desc:0 "阿摩美久是独人创世神话中的主神，据说是由天上的天帝派来的。天帝在天上的御城看到世界没有岛屿，便派阿摩美久去创造。志仁礼久帮助她，为岛屿带来材料。阿摩美久认为应当用人类填充岛屿，但缺乏材料。志仁礼久再次帮助她，以风使她受孕，无需性交。她生下了第一代独人。"
 omen_bunagaya:0 "布那伽亚"
 omen_bunagaya_desc:0 "布那伽亚如今更常被称为木灵。它们本质上是精灵，甚至可以说是小妖精，据说住在榕树顶上，只在孩童或心灵纯洁者面前可见。它们经常对成年人进行无伤大雅的恶作剧。它们的死敌是章鱼，这是它们唯一害怕的东西。讽刺的是，由于它们喜爱捕鱼吃鱼，它们比普通人更常遇到章鱼。不祥的是，布那伽亚常与火一同出现，但这并非一定如此，也不意味着它们纯粹是邪恶的精灵。如果它们愿意，也可以帮助人。总的来说，它们的特征是孩童般的顽皮行为。"
 omen_fuuru:0 "厕神"
 omen_fuuru_desc:0 "厕神，又称厕之康神，是浴室之神。具体来说，他负责保持浴室清洁安全。愿他对厕所的永恒统治永不终结，因为知道在浴室围墙之内是安全的，人终可获得安宁。若不是厕神，邪灵将侵占他的领地，诅咒使用其领域的人。"
 omen_hinukan:0 "火神"
 omen_hinukan_desc:0 "灶神火神，与后绳文之地的火神威是同时代的神。火神仍然是一位重要的神，但他对宇那里信仰的核心程度远不及火神威对阿伊努信仰的核心程度。\n\n他通常以厨房中的三块小石头来代表。家庭火神被认为是神圣的，尤其对神人女祭司而言。尽管如此，他并不认为自己的家是灶台，而是喜欢在春节庆典时回到天上的家。"
 omen_ikiryo:0 "生灵"
 omen_ikiryo_desc:0 "独人坚定相信负灵，大致意思是鬼魂。鬼魂可以是多种事物，特别是马布伊乌都士，大致意为迷失的灵魂。生灵通常被理解为\"活着的鬼魂\"，造成惊吓和恐怖，通常需要#E 由他#!来驱除。"
 omen_mabui:0 "魂"
 omen_mabui_desc:0 "魂是一个类似灵魂与玛那混合物的概念。这种\"玛那\"是不朽的，但必须尊重并小心对待。魂可以离开身体，对宿主来说往往是灾难性的。在抑郁、恐惧、震惊或任何极端痛苦时，魂可能会丢失。如果魂丢失，必须进行魂込み仪式，而为了防止魂丢失，则必须进行御茶汤·民汤。魂也是可以传递的。例如，一件纪念品或传家宝中就蕴含着祖先一部分的魂。"
 omen_nuuru:0 "祝女"
 omen_nuuru_desc:0 "祝女，也拼作Noro，是宇那里克信仰中全社区范围的祭司阶级。祝女能够传达最强大的神祇，为人们提供保护。她们被认为是神人中最古老和最重要的。\n\n祝女是宇那里克信仰中最重要和最突出的特征之一。事实上，对祝女阶级的关注似乎暗示着一种母系宗教社会。很难说这是否确实如此，但无论如何，女性在宗教阶级上层的重要性非常显著，不同于该地区其他宗教传统。"
 omen_shimuchi:0 "书人（Shimuchi）"
 omen_shimuchi_desc:0 "书人（Shimuchi）是较低级别的占卜师阶层。其名称大致可译为「书之人」，表明他们属于受过教育的阶层。与尤塔（Yuta）一样，书人会保有一个苏蒙（suumun），即装有占卜指南的特殊匣子。他们通常花时间研读图表、解读征兆。"
 omen_shinerichuu:0 "西内里丘"
 omen_shinerichuu_desc:0 "西内里丘是杜丘（Duuchuu）创世神话中不可或缺的男性成分。虽阿玛米丘（Amamichuu）是主角，但西内里丘为阿玛米丘提供其所需的一切。他还帮助她诞下了第一个杜丘，然而，文中明确提到他并非如常人最初设想的那般通过交合来完成。相反，他是以神风使之受孕。这一创世神话与更倾向于父权的社会迥然不同，并为杜丘人生活在母系社会——至少在精神和宗教层面上——这一观点提供了依据。"
 omen_ting:0 "天子神（Ting nu Kang）"
 omen_ting_desc:0 "天子神（Ting nu Kang）是天神，或称天上之神。他们居住在天上御城（Gusuku），远离凡人与尘世。许多信众认为天子神是整个宇那尔（Unaric）信仰中最重要的一些神祇。"
 omen_ukuri:0 "乌库里"
 omen_ukuri_desc:0 "乌库里是一类具有神圣感应的人，类似于卡明丘（Kaminchu）。他们在地方层面运作。与同样在更个人层面运作的尤塔（Yuta）不同，乌库里只用于家族事务。此外，乌库里不像尤塔或努鲁（Nuuru）那样由神亲自拣选，因此是较低等级的宗教职分。"
 omen_usagiyaa:0 "乌萨吉亚"
 omen_usagiyaa_desc:0 "乌萨吉亚是一类具有神圣取向的人，然而与其他类似宗教阶层不同，乌萨吉亚没有真正的神圣联系。他们在宗教社会中仍扮演着非常重要的角色——即处理名为「神凭」（Kami-Daari）的神秘疾病。神凭是尤塔女子收到召唤的征兆。然而，短期内这意味着从食欲不振这样较小的不适，到吐血这样严重的病症。她必须会见乌萨吉亚或更高级别的灵性人士，以确认她是否真的在经历神凭。一旦确认，该女子将开始她成为尤塔的攀升之路。但如果她从未与乌萨吉亚或相当层级的人会面，她本人及其家人将不断遭受诅咒，直至她发疯为止。"
 omen_yuta:0 "尤塔"
 omen_yuta_desc:0 "神权之人，即卡明丘（Kaminchu）中的第二显要阶层是尤塔（Yuta）。尤塔是一个几乎全为女性的萨满和灵媒阶层，能看见、听见，有时甚至能与死者及某些精灵交谈。与努鲁（Nuuru）一样，尤塔是由神亲自拣选的。\n\n尤塔作为努鲁之下的阶层运作，但常常能够暗中削弱努鲁。尤塔或以家族为基础运作，或为付酬的客户效力。从某种角度看，她们在女祭司阶层中充当了商贾或贵族的子阶层，尽管这仅仅是推测。"

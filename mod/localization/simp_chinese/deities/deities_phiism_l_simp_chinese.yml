 omen_ban_phi:0 "村灵"
 omen_ban_phi_desc:0 "村灵是村庄的神灵。这些村庄精灵很可能类似于多神教中常见的家宅神。"
 omen_dam:0 "昭披丹"
 omen_dam_desc:0 "昭披丹是披丹类型的神。披丹神是祖先神其崇拜方式与其他祖先崇拜相似。昭披丹仅指一位特定的祖先神。"
 omen_jasing_pha:0 "贾兴帕"
 omen_jasing_pha_desc:0 "贾兴帕，也称贾兴帕，是教育与先祖之神。他很可能特别代表了经验和智慧的概念。北印度的吠陀人民将他与他们更熟悉的神祇辩才天女相比较——辩才天女是创造力和音乐的女神，这可能意味着贾兴帕在这些主题中也扮演了角色。"
 omen_kham_seng:0 "坎盛"
 omen_kham_seng_desc:0 "坎盛是财富女神。她的福祉为信仰她的人带来巨大的繁荣。坎盛也以其另一面艾阿南为人所知。这两位女神是同一存在，只是同一位女神的两种形态。她们常被与吠陀女神拉克什米相比较。"
 omen_khao_kham:0 "考坎"
 omen_khao_kham_desc:0 "考坎，也称昭帕坤，是雨神。他的淡水滋润人们种植的庄稼，为它们提供生命和营养。然而，雨水也能带来死亡和毁灭，无论是持续的洪水还是迅猛致命的暴风雨。"
 omen_lengdon:0 "楞东"
 omen_lengdon_desc:0 "楞东是一位强大的战神。吠陀人民常将楞东与他们的神因陀罗相比较他也是一位宇宙本身的神祇或者说宇宙的至高存在。"
 omen_mae_phosop:0 "梅波索"
 omen_mae_phosop_desc:0 "梅波索是稻米女神。她是一位奇特的女神，据说有一条宠物金鱼，她骑着它——或者更准确地说，她有一条金鱼\"坐骑\"。在某些传统中，她被视为母神，\"梅\"这个词意味着女性的力量。但在其他解释中，梅意味着最伟大的。梅波索意为稻米之母。"
 omen_mut_kum:0 "穆特-库姆"
 omen_mut_kum_desc:0 "穆特-库姆，月亮女神，是许多民间宗教中的常见主题。月亮神祇——以及延伸出的太阳——的概念是全世界最突出的观念之一。月亮可以代表许多概念，常常被视为智慧的象征。"
 omen_nang:0 "艾阿南"
 omen_nang_desc:0 "艾阿南是财富女神。她的福祉为信仰她的人带来巨大的繁荣。艾阿南也以其另一面坎盛为人所知。这两位女神是同一存在只是同一位女神的两种形态。她们常被与吠陀女神拉克什米相比较。"
 omen_phai:0 "昭派"
 omen_phai_desc:0 "昭派有时仅称派是火之灵。在许多民间宗教中火的拟神化代表毁灭与维生的双重性这是一个非常常见的主题。北印度的吠陀人民会将昭派与阿耆尼相比较。"
 omen_tai_kum:0 "太阳公（Tai-Kum）"
 omen_tai_kum_desc:0 "太阳公（Tai-Kum），太阳之神，是许多民间宗教的共同主题。日月神明的概念是全世界最突出的思想之一。太阳可代表诸多概念，常被视为生长与生命的象征，亦与魔法、生计与统御相关。"
 omen_tai_lang:0 "太郎（Tai Lang）是泰教（Phiism）中的死亡之主。与许多冥界或死亡神祇不同，太郎专为死亡过程之神，而非死者之神。这意味着他最与死亡本身的字面过程关联，而非来世。"

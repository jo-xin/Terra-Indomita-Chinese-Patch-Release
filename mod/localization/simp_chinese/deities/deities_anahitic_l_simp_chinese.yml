 omen_amanor:0 "阿马诺尔"
 omen_amanor_desc:0 "阿马诺尔，可能与瓦纳图尔是同一位神灵，意为“最神圣的”，阿马诺尔是初熟果实的携礼者，被视为新年之神。"
 omen_anadatus:0 "阿纳达图斯"
 omen_anadatus_desc:0 "阿纳达图斯是祆教不朽概念（阿梅雷塔特）的神化版本。在阿纳希特教中，他是代表神性和神格的神灵。"
 omen_anahit_desc:0 "阿娜希特是爱情、生育与诞生女神，也是亚美尼亚人最重要的神祇之一。与阿娜希特同源或相关的神祇包括伊南娜、阿斯特利克和阿努尼特。阿娜希特常被等同于阿耳忒弥斯，有时也被等同于阿佛洛狄忒。她的神庙遍布亚美尼亚土地，或许曾是亚美尼亚人最尊崇的神明。她是阿尔马兹德之妻，也是米赫尔与纳内的姐妹。\n\n我们希望慈爱的阿娜希特降福我国，庇护我们的幼者；她的信徒将安心生活，因为他们知道自己的孩子能够平安降生于世。"
 omen_apollo_mithras:0 "阿波罗·密特拉斯"
 omen_apollo_mithras_desc:0 "阿波罗·密特拉斯，孔马革涅的神灵，融合了亚美尼亚、希腊和波斯的影响。作为经济之神，阿波罗·密特拉斯结合了阿波罗的艺术与密特拉斯的光明。"
 omen_astlik:0 "阿斯特里克"
 omen_astlik_desc:0 "阿斯特里克逐渐与希腊女神阿芙罗狄蒂紧密联系在一起。她最初可能源自与伊南娜同根，并且是主要的爱神。随着时间的推移，她的影响逐渐减弱，但仍然是一位重要的女神，直至基督教到来。"
 omen_barshamin:0 "巴尔沙明"
 omen_barshamin_desc:0 "阿纳希特教的天空、风暴和天气之神，受到周围宗教的多重影响。希腊文化在该地区的影响，以及闪米特人的信仰和他们的神巴尔·沙明，共同造就了这位强大的雷神和战神——巴尔沙明。"
 omen_hayk:0 "哈亚克"
 omen_hayk_desc:0 "哈亚克，亚美尼亚人民的传奇半神创始人。据说他曾带领亚美尼亚人在反抗邪恶的巴比伦国王贝尔的起义中。凭借惊人的箭术，他在战场上射杀贝尔，赢得了亚美尼亚从巴比伦人手中的自治权。"
 omen_herakles_artagnes:0 "赫拉克勒斯·阿塔革涅"
 omen_herakles_artagnes_desc:0 "强大的赫拉克勒斯-阿塔革涅在科马吉尼群山中由阿娜希塔、祆教与希腊影响锻成。他是战争之神。"
 omen_kommagene:0 "科马吉尼"
 omen_kommagene_desc:0 "孔马革涅，财富、运气和孔马革涅之民的女神。这位守护神在孔马革涅的诸神中尤受崇拜。她是丰饶之神。"
 omen_omanos:0 "奥曼诺斯"
 omen_omanos_desc:0 "作为善念和善意的神灵，奥曼诺斯是阿纳希特教版的祆教概念沃胡·马纳赫的神化形象。沃胡·马纳赫是与牛特别相关的阿胡拉·马兹达的一面。因此，奥曼诺斯被视为牛神。"
 omen_tork_angegh:0 "托克·安格赫"
 omen_tork_angegh_desc:0 "托克·安格赫，最初是一位合成神，在亚美尼亚的阿纳希特教中受到崇拜。作为亚美尼亚传说中的创始人海克的祖先之一，托克·安格赫是一位拥有非凡力量、勇气和力量的神灵。虽然他相貌丑陋，但却是一位伟大的战士。"
 omen_vanatur:0 "瓦纳图尔"
 omen_vanatur_desc:0 "瓦纳图尔可能是女神阿斯特里克的别名，或可能是神阿诺尔的别名。瓦纳图尔是凡的主人，意为“提供庇护”。他是好客之神。"
 omen_zeus_oromasdes:0 "宙斯·奥罗马兹德"
 omen_zeus_oromasdes_desc:0 "孔马革涅的神灵，宙斯-奥罗马兹德融合了亚美尼亚、希腊和波斯的影响。作为文化之神，宙斯-奥罗马兹德是孔马革涅万神殿的最高神。"

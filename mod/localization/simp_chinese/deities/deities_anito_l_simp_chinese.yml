 omen_algaca:0 "阿拉加卡"
 omen_algaca_desc:0 "阿拉加卡是他加禄人的猎人之神尤其庇护猎人使他们的狩猎顺利安全免受伤害。"
 omen_anito_puno:0 "主神"
 omen_anito_puno_desc:0 "主神是一个翻译和构建的术语，大致意为诸神之首。这代表三位伊戈罗特主神：安拉班、巴戈和西里南。安拉班护佑人民的普遍福祉，尤其是猎人。巴戈是森林及其中栖居动物的精灵。西里南是河流的精灵，通过水源提供生命。"
 omen_anitu:0 "阿尼图"
 omen_anitu_desc:0 "阿尼图是菲律宾诸岛上一个多面的神祇。在某些文化中，他是死亡之神，在另一些文化中则是亡魂的泛称。在许多文化中，它仅仅是亡魂的称呼。"
 omen_aponibolinayen:0 "阿波尼博利纳延"
 omen_aponibolinayen_desc:0 "阿波尼博利纳延是伊戈罗特那位嫁给了伟大太阳神因尼特-因尼特的女子的名字。她本是凡人女子却被因尼特-因尼特亲自选中为配偶。"
 omen_arao:0 "阿拉乌"
 omen_arao_desc:0 "神祇阿拉乌，在比萨亚人中被称为阿德拉乌，是太阳神。太阳神对他加禄人尤为重要，代表着美丽，而比萨亚人则说太阳神是善之神。"
 omen_bakunawa:0 "巴库纳瓦"
 omen_bakunawa_desc:0 "他加禄人称之为拉霍，比萨亚人及其他菲律宾族群称之为巴库纳瓦，这条巨蛇神可与埃及的阿波菲斯或日耳曼的耶梦加得相提并论，因为它是一条能吞噬整个天体的世界巨蛇。巴库纳瓦尤其热衷于吞噬月亮神/女神布兰。"
 omen_balangao:0 "巴朗奥"
 omen_balangao_desc:0 "神祇巴朗奥是彩虹之神。在包括伊戈罗特、他加禄和比萨亚在内的多个菲律宾文化中均有出现，她有众多名称和主题。巴朗奥有时被视为爱之女神，有时被视为战争女神。\n\n一些伊戈罗特人则有一位名为#E 本贡#!的彩虹之神，可能是巴朗奥被男性化的变体。"
 omen_bibit:0 "比比"
 omen_bibit_desc:0 "比比是他加禄人的疾病之神。虽然他是所有病痛和疾病的根源，但他并非恶神。他加禄人向他献祭，以求疾病痊愈、健康保持。"
 omen_buan:0 "布兰"
 omen_buan_desc:0 "神祇布兰是月亮之神。这位神祇在诸岛广为人知。这位男神或女神负责将时间设为黑夜，是和平之神，有时也以调皮捣蛋闻名。他们有时也被称为布安。月亮和太阳神祇是整个群岛中最显赫的神祇之一。"
 omen_bugwasin:0 "布嘎瓦辛"
 omen_bugwasin_desc:0 "塔格班瓦人讲述布嘎瓦辛她是曼金杜萨的妻子。她自身确实是一位女神或至少是不朽之灵考虑到与赋予婴儿灵魂的关联她很可能协助曼金杜萨履行其职责。"
 omen_chacha:0 "查查"
 omen_chacha_desc:0 "伊戈罗特战士由一位神引领：查查，战士之神。召唤他将赋予我们的战士和士兵力量，征服一切阻碍我们利益之人。"
 omen_dibuwatanin:0 "迪布瓦塔宁"
 omen_dibuwatanin_desc:0 "迪布瓦塔宁是塔格班瓦人的信使神。迪布瓦塔宁专门担任至高神曼金杜萨向凡人的信使。"
 omen_fuku:0 "福库"
 omen_fuku_desc:0 "塔格班瓦人的天花之神福库，到这个时间点可能是一位较新的神祇。天花的起源不明，但我们知道天花自公元前10000年就在古埃及存在，并在某个时候通过印度作为中介传入中国，至少到公元3世纪。鉴于该地区与中国和西方之间的贸易历史，天花很可能也传到了塔格班瓦人那里。"
 omen_init:0 "因尼特-因尼特"
 omen_init_desc:0 "伊戈罗特人讲述了他们太阳神因尼特-因尼特的许多故事。据说他白天离开家，向世界洒下伟大光芒，以金色阳光充盈世界。他娶了一位名叫阿波尼博利纳延的伊戈罗特女子为妻。"
 omen_kaptan:0 "卡普坦"
 omen_kaptan_desc:0 "比萨亚人的至高天神，他与对手马加瓦扬作战。卡普坦拥有风和闪电的力量。他也可能娶了风与海之女神马古亚恩为妻。"
 omen_kidul:0 "奇杜尔与奇拉特"
 omen_kidul_desc:0 "奇杜尔是伊戈罗特人的雷神奇拉特是闪电之神。这两位强大的神祇挥舞着天空的长矛与咆哮为天下万物所共睹。"
 omen_kinunsana:0 "奇农萨纳"
 omen_kinunsana_desc:0 "奇农萨纳是山民之神。从他加禄人那里所知但更多适用于伊戈罗特人这位神很可能在早期阿尼托宗教中广泛存在。"
 omen_laon:0 "拉翁"
 omen_laon_desc:0 "比萨亚人的一位男神和女神，拉翁被用作两位独立神祇的称呼。既是宇宙的创造者马卡阿科；又是火、火山和收获的女神。拉翁可能是后来分裂为两位不同神祇的组合神。无论如何，很明显拉翁对比萨亚人至关重要。"
 omen_macatalubhay:0 "马卡塔卢布海"
 omen_macatalubhay_desc:0 "他加禄人的香蕉之神马卡塔卢布海是这奇妙果实的至高阿尼托这种果实为种植它的人们提供营养、生命和生计。"
 omen_magrakad:0 "马格拉卡德"
 omen_magrakad_desc:0 "马格拉卡德是一位塔格班瓦神祇恰好在正午时可在太阳的对面找到。他是一位性情善良的神既提供来自太阳的温暖和生命又治愈病人的疾病。"
 omen_maguyaen:0 "马古亚恩"
 omen_maguyaen_desc:0 "马古亚恩是比萨亚人的海与风女神。她嫁给了至高的天神卡普坦，形成了一个对风有特别强大影响的联盟，当然也影响着天空和海洋。"
 omen_mangindusa:0 "曼金杜萨"
 omen_mangindusa_desc:0 "曼金杜萨，也称纳加巴卡班，是塔格班瓦人的至高权力之神。他负责赋予人类真正的灵魂，称为\"基亚拉鲁瓦\"。灵魂从婴儿的鼻子进入，从女阴中浮现。"
 omen_pagwaagan:0 "帕格瓦甘"
 omen_pagwaagan_desc:0 "帕格瓦甘是他加禄人的风之阿尼托。无论风是播撒田间的种子，还是鼓动船上的帆，只要得到恰当的崇拜，他都是一位极有用途的神祇。"
 omen_pilipit:0 "螺旋"
 omen_pilipit_desc:0 "一位他加禄神祇，螺旋，也称皮利皮特，是掌管誓言的神。他在外交和个人协议中常被召唤。他被描绘成可怕的形象，有时被外国人称为怪物般的野兽。"
 omen_polo:0 "波罗"
 omen_polo_desc:0 "塔格班瓦人召唤他们的神波罗。波罗是海神以仁慈之神而闻名。他有时也被召唤来帮助治愈疾病。"
 omen_puwok:0 "普沃克"
 omen_puwok_desc:0 "普沃克是伊戈罗特人掌控可怕台风的神祇。任何船只都无法抵御他召唤强大风暴的力量。最好对他多加崇拜……否则后果自负。"
 omen_sappia:0 "萨皮亚"
 omen_sappia_desc:0 "萨皮亚是比萨亚族的女神，来自南方名为薄荷岛（Bohol）的岛屿。作为慈悲女神，据说她将乳汁洒在野草上，创造了稻米。当她乳汁耗尽时，鲜血从她的胸膛喷涌而出，创造了红米。"
 omen_sidapa:0 "西达帕"
 omen_sidapa_desc:0 "西达帕是比萨亚族的死亡女神。她被认为是卡马里坦（Kamaritaan，即中界）的共治者。她与疾病之神马卡普坦（Makaptan）共同统治此地。"
 omen_tala:0 "塔拉"
 omen_tala_desc:0 "塔拉，星辰女神，在菲律宾群岛众多神系中受到尊崇。一些伊戈罗特人将此星辰女神称为盖盖约玛（Gaygayoma），另一些则称为米拉拉比（Mi'lalabi）。他加禄人称她为塔拉，而比萨亚人则可能在其女神利苏加（Lisuga）中映射这位星辰女神。"

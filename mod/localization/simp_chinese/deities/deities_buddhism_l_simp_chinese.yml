 omen_adhitthana_parami:0 "决意波罗蜜"
 omen_adhitthana_parami_desc:0 "虽然在仇敌面前焦虑很平常，我们应在战时鼓舞我们青年的意志。对于社群来说，聚集并合力奋进很重要，无论是战争亦或社群工程。\n\n决意波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们的行为应果断坚定。"
 omen_avalokitesvara:0 "观自在"
 omen_avalokitesvara_desc:0 "观自在菩萨（阿缚卢枳多伊湿伐罗），行深般若波罗蜜多时，照见五蕴皆空，度一切苦厄。"
 omen_bamyan:0 "佛本行"
 omen_bamyan_desc:0 "佛陀不吝教化，游方于乡野，传扬圣智。\n与佛陀出生地相去甚远的精舍中的佛塔见证了传扬他教法的传统。"
 omen_bodh:0 "佛性"
 omen_bodh_desc:0 "佛陀智慧的教法将指引我们人民度有德行而快乐的生活，不受其他信仰的干扰和错误教条影响。\n乔达摩佛陀放弃奢靡与苦行，发展出中道后，在佛成道日于伽耶的菩提树下开悟。"
 omen_dana_parami:0 "檀那波罗蜜"
 omen_dana_parami_desc:0 "我们的全社会每一份子应为所有人做出贡献，这点很重要。聚拢的我们可以创造出比我们自身更伟大的事物，只要每个人都愿意献出他们的部分财富。通过放弃物质财富，慈善是发现内在价值的重要途径。\n\n檀那波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们施舍并奉献自己的灵魂与肉体。"
 omen_khanti_parami:0 "羼提波罗蜜"
 omen_khanti_parami_desc:0 "我们的人民需要忍受困苦，并对那些远方来的人们保持克制和耐心，只有这样我们才能学到他们的知识并接受他们的差异，而不是以冒犯或判断欢迎他们。通过理解了这些人，我们可以发现他们的价值，并为我们所有人带来福祉。\n\n羼提波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们耐心、宽容并接纳他人。"
 omen_kusinagara:0 "佛灭"
 omen_kusinagara_desc:0 "唯有遵循乔达摩佛陀的智慧而圣洁的生命之道，人才能达成般涅槃，从永恒轮回的惩罚中解放出来。\n佛陀在拘夷那竭入灭时达成这一状态，这里也成了所有得见他教法中真理的人的朝圣之地。"
 omen_mahesvara:0 "摩醯首罗"
 omen_mahesvara_desc:0 "摩醯首罗，大自在天，三目八臂，此天王于大千世界中得自在故也。自在天喜，众生安乐。自在天嗔，众生苦恼。一切众生若罪若福。乃是自在天之所为作。"
 omen_manjushri:0 "文殊"
 omen_manjushri_desc:0 "文殊菩萨（文殊师利），意为妙德。以其明见佛性，具足法身、般若、解脱三德，不可思议，故称妙德。"
 omen_marici:0 "摩利支"
 omen_marici_desc:0 "有天名摩利支，有大神通自在之法。常行日前，日不见彼，彼能见日。无人能见，无人能知，无人能害，无人欺诳，无人能缚，无人能债其财物，无人能罚，不畏怨家，能得其便。"
 omen_metta_parami:0 "慈波罗蜜"
 omen_metta_parami_desc:0 "以关爱和善良闻名是我国的一项目标。这是我们人民和文化突破我们目前的限制成长扩张的一种方式。\n\n慈波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们善良并友好待人。"
 omen_mitreya:0 "弥勒"
 omen_mitreya_desc:0 "弥勒，此云慈氏也。过去值弥勒佛发愿名弥勒也。出一切智光仙人经，弥勒昔作一切智光仙人。值慈氏佛说慈心三昧经，故曰慈也。"
 omen_panna_parami:0 "般若波罗蜜"
 omen_panna_parami_desc:0 "我们的教授和学者，以及我们的全体人民，将在生命中发现智慧和洞见。有了这只是，我们将更好地纳谏决策，造福我们的人民。\n\n般若波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们善思并洞察事物的本质而非表象。"
 omen_sakra:0 "帝释"
 omen_sakra_desc:0 "伟大的帝释天，三十三天之主，安住须弥山，宝冠被璎珞，持跋折罗印。护持佛法僧伽，若闻世间众生恶多，则愁诸天众减损，阿修罗众增益。若闻行善积德，则皆大欢喜诸天众增益，阿修罗众减损。"
 omen_samantabhadra:0 "普贤"
 omen_samantabhadra_desc:0 "普贤菩萨（三曼多跋陀罗），以其居伏道之顶，体性周遍，故称普；断道之后，邻于极圣，故称贤。"
 omen_samantabhadri:0 "普贤佛母"
 omen_samantabhadri_desc:0 "普贤佛母，佛陀之母，普贤王如来永恒之伴侣，普贤王如来佛母乃如来藏之空性，我心之本性空性即普贤佛母；"
 omen_sigiriya:0 "佛苦行"
 omen_sigiriya_desc:0 "虽然佛陀避免极端的苦行，认为会削弱人以至于无法看清世界，但和平与宁静对于默想他的教法是必要的。\n多年来，僧人们在巨大的狮子岩的洞穴中居住，以求涅槃。"
 omen_sila_parami:0 "尸罗波罗蜜"
 omen_sila_parami_desc:0 "我们将以对待万物的美德与善行鼓舞我们的人民在正确的道路上前进。通过践行美德，我们的人民将能够团结一致，合作奋进。\n\n尸罗波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们修德、和谐、克己。"
 omen_trapusa_and_bahalika:0 "提谓波利"
 omen_trapusa_and_bahalika_desc:0 "商贾提谓和波利是佛陀的首二位在家众门徒，将他的教法传播到兴都库什山以西，他们在巴克特拉建立了首座佛塔。\n他们代表着佛陀教法对于整个世界的普世智慧，并通过他们的传扬证明了佛法的方便。"
 omen_upekkha_parami:0 "舍波罗蜜"
 omen_upekkha_parami_desc:0 "随着战争的混乱环绕着我们，我们更应保持平静安详，找到我们人民的正确途径。即使在战争的困顿与疲乏之间，最重要的是，不论战争是否持续，全社会应作为一个整体同意你将选择的道路。\n\n舍波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们保持安详并净化他们的心灵状态。"
 omen_vajrapani:0 "金刚手"
 omen_vajrapani_desc:0 "金刚手菩萨，又因为其身、口、意速疾、隐秘难知，因此又名密迹金刚天。修金刚手菩萨法，有无量不可思议之功德。具足大威权，制服诸魔外道，消灭一切地水火风空所生之灾难；一切所求，无不如愿成就；命终之时，直生西方净土。"
 omen_viriya_parami:0 "毗梨耶波罗蜜"
 omen_viriya_parami_desc:0 "我国的人民将在战斗中发现他们的勇气、力量和勤奋。虽然战争本身不值得提倡，有时一个人也必须为共同的善而战，而且以荣誉和纪律战斗更为重要。\n\n毗梨耶波罗蜜是我们佛教徒的圆满修行之一，它注重教导人们在工作中负责、悉心、努力。"

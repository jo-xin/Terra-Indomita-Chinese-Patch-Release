 omen_aecorna:0 "艾科娜"
 omen_aecorna_desc:0 "艾科娜是一位仅被潘诺尼亚人及其周边民族所崇拜的女神。她是一位水神，与湖泊或河流相关联。她很可能是一位保护神，特别是对于划船人和航海者的保护神。"
 omen_andinus:0 "安狄努斯"
 omen_andinus_desc:0 "安迪努斯是达尔达尼亚神祇，常受当地色雷斯人与伊利里亚人敬奉。他的名字或许意为异乡人，很可能正是指这一情况。来自扎尔莫克西斯信仰的许多神祇，最终也被发现受到伊利里亚土地上的人们崇拜。安迪努斯这个名字在该地区伊利里亚人中也是常见人名。"
 omen_anzotica:0 "安佐蒂卡"
 omen_anzotica_desc:0 "$omen_aphrodite_desc$\n\n#Y 安佐蒂卡#!她是伊利里亚的爱、美丽与生育女神，常被描绘为一位迷人的女性，身边常伴随着鸽子、天鹅或鹅；就像她对应希腊的女神阿佛洛狄忒或罗马的维纳斯。特别是利布尔尼亚人以极大的热情崇拜她。\n\n#!神化效果："
 omen_armatus:0 "阿玛图斯"
 omen_armatus_desc:0 "$omen_mars_desc$\n\n#Y 阿玛塔斯#!：伊利里亚人有许多战神，但仅有少数神的名字保存下来，比如达尔马提亚人的阿玛塔斯。由于受到色雷斯人的影响，这些战神常被描绘成骑马疾驰的形象，身披短斗篷，斗篷在身后飘扬，并手持长矛。到了罗马帝国时期，色雷斯人的梅乌达乌斯成为了主要崇拜的对象。\n\n#!神化效果："
 omen_athana:0 "阿塔娜"
 omen_athana_desc:0 "$omen_demeter_desc$\n\n尽管阿塔娜与雅典娜有相似之处，但她实际上是源自伊利里亚本土信仰的一个神祇，与类似的印欧语系根源的神祇有关。"
 omen_bindus:0 "宾杜斯"
 omen_bindus_desc:0 "$omen_neptune_desc$\n\n#Y 宾杜斯#!：宾杜斯是保护航海者的神祇，也是所有水域的守护神。商人会祈祷得到他的庇佑以确保航行安全，特别是伊阿波德人特别强调对他的崇拜。\n\n#!神化效果：\n"
 omen_boria:0 "玻丽亚"
 omen_boria_desc:0 "在希斯特里亚山区的内陆地带，当地居民将他们的城市建在山顶上，因此山神波利亚在其万神殿中占有特殊位置，作为他们家园的保护者也就不足为奇了。这位女神可能通过卡塔比克风（下降风）表达她的不满，因为在现代的克罗地亚语（Bura）和斯洛文尼亚语（Burja）中，这种风仍以其名字命名。"
 omen_damater:0 "达玛特"
 omen_damater_desc:0 "$omen_demeter_desc$\n\n尽管达玛特与得墨忒耳有许多相似之处，但实际上达玛特源自伊利里亚本土信仰中的一个类似的印欧根源神祇。"
 omen_damatira:0 "达玛蒂拉"
 omen_damatira_desc:0 "$omen_demeter_desc$\n\n尽管达玛蒂拉与得墨忒耳有相似之处，但她实际上是源自伊利里亚本土信仰的一个神祇，与类似的印欧语系根源的神祇有关。"
 omen_deipatros:0 "迪帕图罗斯"
 omen_deipatros_desc:0 "$omen_zeus_desc$"
 omen_dracondracaena:0 "德拉孔与德拉凯娜"
 omen_dracondracaena_desc:0 "德拉孔和德拉凯娜是一对神圣的鲸豚夫妇。鲸龙在伊利里亚神话中是一种拥有蛇形身躯、鳄鱼般的下颌以及头部一对角的海龙。它们经常出现在船只、珠宝和盔甲上，以保护和增强这些物品或佩戴者的安全和力量。"
 omen_dualos:0 "杜阿洛斯"
 omen_dualos_desc:0 "杜阿洛斯可能是伊利里亚人对希腊酒神狄俄尼索斯的对应神祇。从词源上看，'杜阿洛斯'似乎可以解读为'醉酒'或'狂人'。杜阿洛斯主要是一位派奥尼亚神祇。"
 omen_eia:0 "艾亚"
 omen_eia_desc:0 "埃亚是一位伊斯特里亚女神，后来与博纳·迪亚融合。她在达尔马提亚海岸至少直到那时仍然受到崇拜，因此她在沿海的伊利里亚人中应该也是广为人知的。"
 omen_enji:0 "恩吉"
 omen_enji_desc:0 "恩吉是一位雷电与火的神祇，尤其在北伊利里亚人中具有强大的影响力。罗马人视他为与朱庇特相似的神祇，这一点反映在恩吉最终成为了现代阿尔巴尼亚语中表示“星期四”的词根。恩吉也被称为恩，而这个名字后来与一种恶魔力量联系在一起。"
 omen_evileye:0 "邪眼"
 omen_evileye_desc:0 "古代的伊利里亚人相信“邪眼”的存在。如果你遭受了诅咒或是单纯的厄运，就必须向神灵献祭以求得他们的庇护，这样神灵才会消除“邪眼”的影响。"
 omen_histria:0 "希斯特里亚"
 omen_histria_desc:0 "希斯特里亚半岛的至高女神统治着希斯特里亚的土地及其所有的居民，她将向所有以她的名义献祭的人赐予保护与启示。"
 omen_ica:0 "伊卡"
 omen_ica_desc:0 "人们相信宁芙伊卡居住在弗拉诺尼亚附近的温泉中，即现今的普洛明地区，她为所有来访者赐予疗愈和安宁。这个地方甚至以她的名字命名。"
 omen_illyrius:0 "伊吕里俄斯"
 omen_illyrius_desc:0 "伊利里乌斯是卡德摩斯和哈莫妮娅的儿子，他最终统治了伊利里亚，并成为伊利里亚人的同名祖先。据说，伊利里亚的名字就来源于他，伊利里亚人也是他的后代。他还据说有六个儿子和三个女儿，每个孩子都与不同的伊利里亚部落有关联。儿子的名字分别是恩切勒乌斯、奥塔里乌斯、达达努斯、迈杜斯、陶卢斯和佩尔海布斯；女儿的名字则是帕尔托、达奥索和达萨罗。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_iria:0 "伊里亚"
 omen_iria_desc:0 "伊丽娅是伊斯特拉半岛众多女神之一。尽管我们对她所知甚少，但与其他伊斯特拉的神祇一样，她在伊斯特拉周边的民众中广为流传。"
 omen_juppiter_menzanas:0 "朱庇特·门扎纳斯"
 omen_juppiter_menzanas_desc:0 "朱庇特·门扎纳斯是一位带有特定称号的神祇，大致可以翻译为'天父，马匹之神'。有时他也被称为齐斯·门扎纳斯。门扎纳斯是梅萨皮亚人特有的马神，未见于其他文化中，但他经常作为称号与其他神祇搭配使用，以展示这些神祇的力量或威严。"
 omen_lahona:0 "阿普罗迪塔·拉霍纳"
 omen_lahona_desc:0 "$omen_aphrodite_desc$"
 omen_latra:0 "拉特拉"
 omen_latra_desc:0 "在利本里亚人中有很多本地女性女神的宗教崇拜，如尤托西卡、森托纳以及拉特拉。拉特拉被描绘戴着一顶尖顶的伊利里亚帽子，并且在供奉中会出现三个祭坛，以此寻求她的恩宠和好运。"
 omen_medaurus:0 "梅达乌斯"
 omen_medaurus_desc:0 "骑士之神梅达乌斯在古波罗的海世界非常普遍。在罗马时代，梅达乌斯在伊利里亚人的信仰中逐渐变得重要，以至于现在人们更多地将梅达乌斯与伊利里亚联系在一起，而不是与色尔摩克西斯（色雷斯人的最高神）。"
 omen_melosocus:0 "梅洛索库斯"
 omen_melosocus_desc:0 "梅洛索库斯是希斯特里亚半岛传承下来的唯一男性神祇，这似乎反映了希斯特里亚社会中女性的重要地位。因此，他很可能是在希斯特里亚人中作为男性守护神的角色存在。"
 omen_nebres:0 "内布雷斯"
 omen_nebres_desc:0 "内布雷斯是一位主要在利本里亚和伊斯特拉受到崇拜的神祇。关于她的信息并不多，现存的文献记载和碑铭也非常少，不过她很可能与其他利本里亚和伊斯特拉地区的神祇处于相似的地位。"
 omen_redon:0 "勒东"
 omen_redon_desc:0 "雷顿是一位与货币、旅行和航海广泛相关的神祇。他经常被描绘在钱币上，头戴佩塔索斯帽（一种旅行帽）。在亚得里亚海沿岸的多个城市，包括梅萨皮亚，都发现了刻有雷顿形象的钱币。"
 omen_sentona:0 "森托纳"
 omen_sentona_desc:0 "旅行者的守护神，女神森托纳是利本里亚人的主要女神。她在利本里亚人中广受崇拜，并且很可能在其他文化中也有信奉。森托纳女神的存在甚至延续到了罗马征服之后。"
 omen_tadenus:0 "塔德努斯"
 omen_tadenus_desc:0 "$omen_helios_desc$\n\n#Y 塔德努斯#!:伊利里亚人广泛崇拜的光明与太阳之神通常涉及一个位于长杆顶端的小圆盘，这代表着神祇的存在。在某些伊利里亚人的称呼中，这位神祇被称为塔德努斯，他经常被描绘成带有太阳船或马车的样子（或者仅由利布尔尼亚人及其邻近民族以风格化的形式表现），就像希腊神话中法厄同驾驶的太阳战车一样。此外，塔德努斯还常常与水鸟和马匹相关联。"
 omen_taotor:0 "陶托尔"
 omen_taotor_desc:0 "塔奥托尔是一位神秘的女神，我们对她知之甚少。从词源学的角度来看，她的名字暗示她可能是某种意义上的人民女神，“Teuta(na)”在伊利里亚语中意指人民的女主人，甚至是女王（最著名的例子就是女王泰奥塔的名字）。在凯尔特语、意大利语族语言和哥特语中与之相关的词源也都似乎表达了同样的意思：与部落团结或一般民众有关的词语。因此，至少可以得出结论，塔奥托尔是一位人民女神。"
 omen_thana:0 "塔纳"
 omen_thana_desc:0 "$omen_diana_desc$\n\n#Y 塔娜#!：猎人们常常向塔娜献祭以求狩猎成功，但她同时也与维达苏斯一同被尊奉为自然女神；在伊利里亚北部的一些圣地位于温泉附近，以此来祈求二者共同的治愈之力。"
 omen_trita:0 "特里塔"
 omen_trita_desc:0 "特里塔是一位健康女神。虽然她与伊斯特里亚人有关联，但她的名字起源却是来自伊利里亚南部亚得里亚海沿岸。有可能特里塔最初受到了德鲁伊人的影响，在后来才完全成为一位伊利里亚女神。"
 omen_venas:0 "维纳斯"
 omen_venas_desc:0 "$omen_aphrodite_desc$\n\n维西是水之灵。有时被称为水之母，她控制着北方冰冷的海水。她被描绘成长发、丰盈的乳房和鱼的下半身；就像美人鱼一样。"
 omen_vidasus:0 "维达苏斯"
 omen_vidasus_desc:0 "维达苏斯经常在收获前被祈求，并与塔纳一同受到崇拜；在北部伊利里亚的一些圣地靠近温泉，以祈求他们共同的治愈之力。在南部伊利里亚，维达苏斯的罗马对应神祇是利伯或西尔瓦努斯，尽管他在达尔马提亚和潘诺尼亚行省被描绘为半羊人的形象更接近于罗马的潘，而不是西尔瓦努斯。"
 omen_zis:0 "齐斯"
 omen_zis_desc:0 "$omen_zeus_desc$\n\n尽管齐斯与宙斯有许多相似之处，但实际上齐斯源自伊利里亚本土信仰中的一个类似的印欧根源神祇。"

 omen_baiyue_ancestor_worship:0 "先祖崇拜"
 omen_baiyue_ancestor_worship_desc:0 "#Y 百越神祇#!\n百越的先祖崇拜。"
 omen_baiyue_elder_worship:0 "长者崇拜"
 omen_baiyue_elder_worship_desc:0 "#Y 百越神祇#!\n百越的长者崇拜。"
 omen_baiyue_fertility_cult:0 "生殖崇拜"
 omen_baiyue_fertility_cult_desc:0 "#Y 百越神祇#!\n百越的生殖崇拜。"
 omen_baiyue_forest_worship:0 "森林崇拜"
 omen_baiyue_forest_worship_desc:0 "#Y 百越神祇#!\n百越的森林崇拜。"
 omen_baiyue_land_worship:0 "土地崇拜"
 omen_baiyue_land_worship_desc:0 "#Y 百越神祇#!\n百越的土地崇拜。"
 omen_baiyue_river_worship:0 "河流崇拜"
 omen_baiyue_river_worship_desc:0 "#Y 百越神祇#!\n百越的河流崇拜。"
 omen_baiyue_warrior_worship:0 "战士崇拜"
 omen_baiyue_warrior_worship_desc:0 "#Y 百越神祇#!\n百越的战士崇拜。"
 omen_baiyue_weapon_worship:0 "武器崇拜"
 omen_baiyue_weapon_worship_desc:0 "#Y 百越神祇#!\n百越的武器崇拜。"
 omen_chinese_baidi:0 "白帝少昊"
 omen_chinese_baidi_desc:0 "#Y 华夏神祇#!\n白帝为传说中的五帝之一，司掌天下西方，是古代帝王与宗庙祭祀的重要对象。在先天五帝的观念中，白帝即少昊；五行属金，四时应秋，五色尚白。"
 omen_chinese_bingzhu:0 "兵主"
 omen_chinese_bingzhu_desc:0 "#Y 华夏神祇#!\n 兵主为齐国祭祀八神之一。"
 omen_chinese_daizong:0 "岱宗"
 omen_chinese_daizong_desc:0 "#Y 华夏神祇#!\n岱宗即泰山，位列东岳。神话传说中，盘古死后，其首化为泰山，故泰山为群岳之宗。"
 omen_chinese_dasiming:0 "大司命"
 omen_chinese_dasiming_desc:0 "#Y 华夏神祇#!\n大司命主掌人间生死。"
 omen_chinese_dizhu:0 "地主"
 omen_chinese_dizhu_desc:0 "#Y 华夏神祇#!\n 地主为齐国祭祀八神之一。"
 omen_chinese_fengshi:0 "风师"
 omen_chinese_fengshi_desc:0 "#Y 华夏神祇#!\n风师又称飞廉，是华夏神话中的风神，掌八风消息，通五运之气候。"
 omen_chinese_graangsreen:0 "衡山"
 omen_chinese_graangsreen_desc:0 "#Y 华夏神祇#!\n黄帝立衡山为南岳，使其成为山岳崇拜的重要对象之一。"
 omen_chinese_gyyngsreen:0 "恒山"
 omen_chinese_gyyngsreen_desc:0 "#Y 华夏神祇#!\n恒山为五岳中的北岳。"
 omen_chinese_he:0 "河水"
 omen_chinese_he_desc:0 "#Y 华夏神祇#!\n河伯为河水之神，居于河水，即今黄河之中。传说他乘白龟而行，以五采纹鱼为前导，巡游四方，亦可上溯昆仑，与诸神相会。"
 omen_chinese_heidi:0 "黑帝颛顼"
 omen_chinese_heidi_desc:0 "#Y 华夏神祇#!\n颛顼为五帝之一，居于北方玄宫。北方色黑，五行属水，故称其以水德为帝，又称玄帝。"
 omen_chinese_houtu:0 "后土"
 omen_chinese_houtu_desc:0 "#Y 华夏神祇#!\n后土是华夏地祇的代表，统摄大地诸神与万方土地，近似西方神话中的大地母神盖亚。"
 omen_chinese_huai:0 "淮神"
 omen_chinese_huai_desc:0 "#Y 华夏神祇#!\n淮神为淮水之神，位列四渎之一。"
 omen_chinese_huangdi:0 "黄帝轩辕"
 omen_chinese_huangdi_desc:0 "#Y 华夏神祇#!\n黄帝为五帝之首，居中而治天下。传说其父少典为有熊国君，黄帝因居轩辕之丘而号轩辕，长于姬水而为姬姓，建国有熊，又称有熊氏。"
 omen_chinese_huashan:0 "华山"
 omen_chinese_huashan_desc:0 "#Y 华夏神祇#!\n华山又称太华山，位列五岳，为西岳。"
 omen_chinese_ji:0 "济神"
 omen_chinese_ji_desc:0 "#Y 华夏神祇#!\n济神为济水之神，位列四渎之一。"
 omen_chinese_jiang:0 "江神"
 omen_chinese_jiang_desc:0 "#Y 华夏神祇#!\n江神为江水之神，位列四渎之一。"
 omen_chinese_jishen:0 "稷神"
 omen_chinese_jishen_desc:0 "#Y 华夏神祇#!\n稷神是农耕与五谷之神的尊称。"
 omen_chinese_qingdi:0 "青帝太昊"
 omen_chinese_qingdi_desc:0 "#Y 华夏神祇#!\n青帝为传说中的五帝之一，司掌天下东方，是帝王与宗庙祭祀的重要对象，又称苍帝、木帝。在先天五帝的观念中，青帝即太昊；五行属木，四时应春，五色尚青。"
 omen_chinese_rizhu:0 "日主"
 omen_chinese_rizhu_desc:0 "#Y 华夏神祇#!\n 日主为齐国祭祀八神之一。"
 omen_chinese_shangdi:0 "昊天上帝"
 omen_chinese_shangdi_desc:0 "#Y 华夏神祇#!\n上帝、天帝或昊天上帝，俗称上天、天神、天主、天公，是天子、帝王与君主所敬奉的至上神。其信仰源于华夏对苍天、昊天以及北辰帝星的崇拜：天体广大，故称昊天；远望苍然，故称苍天；人间至尊莫过于帝，托名于天，故称上帝。"
 omen_chinese_shaosiming:0 "少司命"
 omen_chinese_shaosiming_desc:0 "#Y 华夏神祇#!\n少司命主掌人间子嗣。"
 omen_chinese_sheshen:0 "社神"
 omen_chinese_sheshen_desc:0 "#Y 华夏神祇#!\n社神为掌管土地的神祇。"
 omen_chinese_sishizhu:0 "四时主"
 omen_chinese_sishizhu_desc:0 "#Y 华夏神祇#!\n 四时主为齐国祭祀八神之一。"
 omen_chinese_songshan:0 "嵩山"
 omen_chinese_songshan_desc:0 "#Y 华夏神祇#!\n嵩山位列五岳，为中岳。"
 omen_chinese_tianzhu:0 "天主"
 omen_chinese_tianzhu_desc:0 "#Y 华夏神祇#!\n 天主为齐国祭祀八神之一。"
 omen_chinese_xiangfuren:0 "湘夫人"
 omen_chinese_xiangfuren_desc:0 "#Y 华夏神祇#!\n湘夫人为湘水之神。"
 omen_chinese_xiangjun:0 "湘君"
 omen_chinese_xiangjun_desc:0 "#Y 华夏神祇#!\n湘君为湘水之神。"
 omen_chinese_xihe:0 "羲和"
 omen_chinese_xihe_desc:0 "#Y 华夏神祇#!\n羲和是神话中的太阳之母。传说她为帝俊之妻，与帝俊生下十个太阳，即金乌；诸日居于东方大海的扶桑树上，轮流升天值日。"
 omen_chinese_yandi:0 "炎帝神农"
 omen_chinese_yandi_desc:0 "#Y 华夏神祇#!\n炎帝因善火耕而号神农氏，又因以火德为王而称炎帝，是传说中上古时代的天下共主。"
 omen_chinese_yangzhu:0 "阳主"
 omen_chinese_yangzhu_desc:0 "#Y 华夏神祇#!\n 阳主为齐国祭祀八神之一。"
 omen_chinese_yinzhu:0 "阴主"
 omen_chinese_yinzhu_desc:0 "#Y 华夏神祇#!\n 阴主为齐国祭祀八神之一。"
 omen_chinese_yuezhu:0 "月主"
 omen_chinese_yuezhu_desc:0 "#Y 华夏神祇#!\n 月主为齐国祭祀八神之一。"
 omen_chinese_yushi:0 "雨师"
 omen_chinese_yushi_desc:0 "#Y 华夏神祇#!\n雨师源自华夏神话，主掌降雨。"
 omen_dalnim:0 "达尔尼姆"
 omen_dalnim_desc:0 "#Y 韩国神祇#!\n太阳神哈莫斯的姐妹，达尔尼姆是月亮女神。她有许多关于她如何获得神性的起源神话。其中一个神话称她美得让诸天也为之倾倒，从而赐予她神性。另一个神话则说她攀登至极高之处，最终到达了月亮。还有一个神话则称她和她的兄弟曾被俘虏，于是她向天祈祷，从天而降一条绳索，他们攀爬而上，最终分别成为月亮与太阳的神祇。"
 omen_haemosu:0 "哈莫斯"
 omen_haemosu_desc:0 "#Y 韩国神祇#!\n月亮神达尔尼姆的兄弟，哈莫斯是太阳神。据说他曾驾驶由五条龙牵引的战车降临人间倾听人类之声，之后又返回天界，象征太阳的升起与落下。"
 omen_hu_aqana:0 "堊驉奴"
 omen_hu_aqana_desc:0 "#Y 胡人神祇#!\n阿卡娜是凯拉之女。凯拉在氐人的神话中是大地丰产与生命之神，而阿卡娜曾敦促凯拉从时间之河开始创造。"
 omen_hu_erlik:0 "殷弋"
 omen_hu_erlik_desc:0 "#Y 胡人神祇#!\n埃尔利克居于地狱，在氐人神祇中象征死亡、冥界、疾病和厄运。作为恶灵的创造者，人们常向他献祭，以避开他降下的灾祸。"
 omen_hu_mergen:0 "门祺"
 omen_hu_mergen_desc:0 "#Y 胡人神祇#!\n梅尔根是智慧与思想之神，居于第十七重天，以一名戴盔、持弓、骑白马的战士形象闻名。"
 omen_hu_qayra:0 "猗鲁"
 omen_hu_qayra_desc:0 "#Y 胡人神祇#!\n凯拉居于第十七重天。据说上古时他曾游荡于时间之河，在大地诞生后成为气、水、土三界之主，也是许多事物与人类的创造者。此外，他还教会人们酿酒。"
 omen_hu_qizagan:0 "呼徂於"
 omen_hu_qizagan_desc:0 "#Y 胡人神祇#!\n奇扎甘居于九重天，被描绘为一手持弓、一手持号角，骑乘一匹巨大的红马，是氐人信仰中强大的战神。"
 omen_hu_tengri:0 "诸天"
 omen_hu_tengri_desc:0 "#Y 北狄神祇#!\n腾格里是狄人信仰中的主神与至高天神，常与中原信仰中的天帝相互比附。随着时间推移，其形象逐渐分化，衍生出掌管时间的斡腾格里与掌管大地的驸腾格里等神格。"
 omen_hu_ulgen:0 "宛褀"
 omen_hu_ulgen_desc:0 "#Y 胡人神祇#!\n乌尔根是天界万物中最神圣者，居于十六重天，地位仅次于犁神，有时甚至与犁神相等。他保护万物免受不确定与死亡之神殷弋之手侵害。萨满在乌尔根仪式中常以白马献祭。"
 omen_hu_umay:0 "区靡"
 omen_hu_umay_desc:0 "#Y 胡人神祇#!\n乌迈是生育女神、妇女与儿童的保护者，也是天空之妻，其形象亦与太阳相关。北方流散诸民向她祈求多子之福。"
 omen_inari:0 "稻荷神"
 omen_inari_desc:0 "#Y 神道神祇#!\n稻荷神是狐狸之神，也称“稻荷大神”。她既是生育之神，也与信息传递有关，因传说狐狸能从稻荷神那里传递信息给人类。"
 omen_kamimusubi:0 "神皇产灵神"
 omen_kamimusubi_desc:0 "#Y 神道神祇#!\n神皇产灵神是天地初开后第三位显现的神祇，存在于七代神祇之前。他是神圣的创造者。"
 omen_minakanushi:0 "天御中主神"
 omen_minakanushi_desc:0 "#Y 神道神祇#!\n天御中主神是天地初开后最早显现的神祇之一，是五位先于七代神祇的神明之一，也是前三神的中央主宰。"
 omen_mireuk:0 "弥勒"
 omen_mireuk_desc:0 "#Y 韩国神祇#!\n宇宙的主创神，他将人类世界与其他宇宙分离。他创造了五对金虫与银虫，这些虫子的后代便是所有人类。他在一个没有罪恶、痛苦与死亡的时代统治人类，直到另一位创世神石迦挑战他并作弊获胜，弥勒因此消失，世界从此充满罪恶与苦难。"
 omen_mizuhanome:0 "水波女神"
 omen_mizuhanome_desc:0 "#Y 神道神祇#!\n水波女神是水之神，她是伊奘冉之女，由伊奘冉的尿液中诞生，有时也被称为“水龙女神”。"
 omen_seokga:0 "石迦"
 omen_seokga_desc:0 "#Y 韩国神祇#!\n狡黠的捣蛋神石迦，以不断戏弄凡人著称。尽管他是万物的创世神之一，石迦却渴望独自统治世界。他向另一位创世神弥勒发起挑战，比谁能够创造更多的花朵。胜者留下，败者离开。石迦偷偷偷取弥勒所造的花，导致弥勒消失。这一不公行为引发了世界上第一宗罪，也带来了第一次死亡，从此世间进入生死轮回，充满欢乐与痛苦。"
 omen_takamimusubi:0 "高皇产灵神"
 omen_takamimusubi_desc:0 "#Y 神道神祇#!\n高皇产灵神是天地初开后第二位显现的神祇，存在于七代神祇之前。他是至高创造者，也是农业之神。"
 omen_wa_god_ama:0 "伊邪那美"
 omen_wa_god_ama_desc:0 "#Y 科多神祇#!\n伊邪那美是天地开辟后最早七代神明之一。她与兄弟兼丈夫伊邪那岐共同创造了许多神明。然而其中一位神明迦具土是火神，伊邪那美在生下他时被烈火灼烧而死。悲痛欲绝的伊邪那岐前往黄泉试图带她回来。然而抵达后，他因伊邪那美死后身体发青腐烂而拒绝了她。随后他以巨石封住伊邪那美，将生者之国与死者之国隔绝开来。"
 omen_wa_god_ame:0 "天照"
 omen_wa_god_ame_desc:0 "#Y 科多神祇#!\n天照是艺术与太阳女神。由于阳光能促使农事生长，她也被视为丰产女神。她与兄弟素戔嗚关系动荡；素戔嗚是风暴之神，曾毁坏她的稻田。这使她愤怒不已，一度拒绝将光明赐予世界。"
 omen_wa_god_hi:0 "迦具土"
 omen_wa_god_hi_desc:0 "#Y 科多神祇#!\n迦具土意为闪耀之力，诞生于伊邪那美。然而作为火神，迦具土出生时烧死了伊邪那美。悲痛的伊邪那岐斩下迦具土首级，由此又诞生了数位神明。后来他逐渐与铁匠产生关联。迦具土有时也被称为火。"
 omen_wa_god_inazuma:0 "伊邪那岐"
 omen_wa_god_inazuma_desc:0 "#Y 科多神祇#!\n伊邪那岐是天地开辟后最早七代神明之一。他与妹妹兼妻子伊邪那美共同创造了许多神明。然而其中一位神明迦具土是火神，伊邪那美在生下他时被烈火灼烧而死。悲痛欲绝的伊邪那岐前往黄泉试图带她回来。然而抵达后，他因伊邪那美死后身体发青腐烂而拒绝了她。随后他以巨石封住伊邪那美，将生者之国与死者之国隔绝开来。"
 omen_wa_god_kaminari:0 "雷神"
 omen_wa_god_kaminari_desc:0 "#Y 科多神祇#!\n雷神有时被称为雷鸣，是闪电、雷霆与风暴之神。他是伊邪那美所生的两位神明之一，在伊邪那岐封闭黄泉前逃离了那里。他常与兄弟风神一同被描绘，后者是风之神。"
 omen_wa_god_kawa:0 "川"
 omen_wa_god_kawa_desc:0 "#Y 科多神祇#!\n河神之王川的名字几乎与河川神明同义，以至于后来成为所有河神的泛称。他有时也被称为河伯。"
 omen_wa_god_kaze:0 "风神"
 omen_wa_god_kaze_desc:0 "#Y 科多神祇#!\n风神是最古老的神明之一，也是伊邪那美所生的两位神明之一，在伊邪那岐封闭黄泉前逃离了那里。他是风之神，有时被称为风或龙伯。人们常将他与兄弟雷神一同描绘，后者是闪电、雷霆与风暴之神。"
 omen_wa_god_sorei:0 "祖灵"
 omen_wa_god_sorei_desc:0 "#Y 科多神祇#!\n祖灵是早期科多教中祖先崇拜的概念。祖灵不仅可以成为灵魂与守护者，甚至能够被提升为神明。更具体地说，祖灵指的是在历法中特定日期被纪念的祖先之灵，例如节日或追悼日。"
 omen_wa_god_tsuchi:0 "国之常立"
 omen_wa_god_tsuchi_desc:0 "#Y 科多神祇#!\n国之常立是第一代神明中的两位之一。他降临于原初大地，有时被视为宇宙的原初神。"
 omen_wa_god_tsuki:0 "月读"
 omen_wa_god_tsuki_desc:0 "#Y 科多神祇#!\n月读是月之神，也是太阳女神天照的孪生兄弟。他因杀死一位食物之神而与天照决裂；自那以后，天照不愿再见他，由此产生了昼夜之分。"
 omen_wa_god_umi:0 "大国主"
 omen_wa_god_umi_desc:0 "#Y 科多神祇#!\n大国主是建国、商业与农耕之神。他是神明素戔嗚的后裔。大国主后来逐渐与西倭联系在一起。"
 omen_wa_god_yama:0 "大山津见"
 omen_wa_god_yama_desc:0 "#Y 科多神祇#!\n大山津见是山神，山神也被称为山之神。大山津见是天照的兄长，也是伊邪那美与伊邪那岐之子。他后来与野槌生下八位神明后裔，并另有两位没有母亲形象的神明子嗣。"
 omen_yi_god_of_grass:0 "七星"
 omen_yi_god_of_grass_desc:0 "#Y 东夷神祇#!\n七星神是北斗七星之灵。它后来与佛教发生联系，但最初属于巫俗信仰的一部分，并被认为会护佑儿童。"
 omen_yi_god_of_medicine:0 "桓因"
 omen_yi_god_of_medicine_desc:0 "#Y 东夷神祇#!\n桓因，又称天神或上帝，是天空之神，统治天上国度，象征智慧与权威。其崇拜在古朝鲜时期已具重要地位，后世影响更盛；他亦被视为檀君神王的祖父。"
 omen_yi_god_of_mountain:0 "山神灵"
 omen_yi_god_of_mountain_desc:0 "#Y 东夷神祇#!\n山神是山岳之灵，常被描绘为白须、青袍、伴虎而行的男性神祇。他们以驾驭自然的力量守护地方百姓。"
 omen_yi_god_of_river:0 "灵登"
 omen_yi_god_of_river_desc:0 "#Y 东夷神祇#!\n灵登婆是风之女神，又称灵登，尤其掌管济州岛一带的海风。传说她来自耽罗以东，每年都会来到岛上，为土地带来生机、种子与维系民生之物。"
 omen_yi_god_of_sea:0 "户口别星"
 omen_yi_god_of_sea_desc:0 "#Y 东夷神祇#!\n户口别星是巫俗中的疫病女神，最初或许泛指疾病之神，后世则常被重新解释为水痘女神。这种转化也体现了巫俗信仰延续而灵活的特质。"
 omen_yi_god_of_thunder:0 "灶王神"
 omen_yi_god_of_thunder_desc:0 "#Y 东夷神祇#!\n灶王神是巫俗中的火神，也可与中国文献所称的灶神相联系。她不仅掌管火焰，也守护炉灶与相关禁忌。信徒不可在家中咒骂、不可坐卧炉灶、不可把脚搁在炉边，厨房须保持洁净，并应在厨中祭祀神灵；违犯者将招致她严厉而报复性的惩罚。"
 omen_yi_god_of_wind:0 "神将"
 omen_yi_god_of_wind_desc:0 "#Y 东夷神祇#!\n神将是武将之灵，寄寓于历代名将的英魂之中。这些灵祇可来自古今诸多卓越将领，被人们奉为护佑战争与勇武的存在。"
 omen_yi_god_of_wine:0 "巴里公主"
 omen_yi_god_of_wine_desc:0 "#Y 东夷神祇#!\n巴里公主是巫师的守护女神、亡魂的引导者，也是北斗女神，在朝鲜巫俗中极受尊崇。她的传说流传久远，版本众多；其核心故事讲述一位国王与王后连生六女，第七胎仍为女儿，失望的国王下令将她抛弃。她由此得名“巴里”，并在漫长旅途中最终获得神格。"

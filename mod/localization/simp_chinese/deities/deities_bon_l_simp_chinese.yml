 omen_ati_muwer:0 "阿迪穆畏"
 omen_ati_muwer_desc:0 "阿迪·穆维尔本身便是一位战神，也是与格阔相关的神祇圈子中的重要成员，在某些传统中，她被视作他的配偶。她常被描绘为身着金甲或镀金铠甲，手持弓箭，骑马横跨天空。"
 omen_drablai_gyalmo:0 "扎拉嘉母"
 omen_drablai_gyalmo_desc:0 "扎拉嘉母是$bon_religion$最重要的神灵之一，格阔的配偶，本身就是诸天之女神。女神有许多形象，可以是平静洁白的生命之神，或恐怖的死亡黑魔女，并常常与天体和自然现象相联系。"
 omen_gekho:0 "格阔"
 omen_gekho_desc:0 "格阔在众多$tibetan$神灵中位列第一，是诸天与星辰之神。当地人呼求的神灵中，大部分都要在他面前俯首，他也因为会为信徒消灭作祟的邪灵而知名。通常要以牦牛、绵羊或黄金的奉献崇敬他，要献上祭品作为对他帮助的感谢。"
 omen_kuchi_mangke:0 "古吉芒科"
 omen_kuchi_mangke_desc:0 "古吉芒科是与格阔有关的丰饶之神，登南嘉母的配偶。他通常被描绘为一名小小的神灵，据说他的身体和纺锤一样小，并肩负着保护儿童不受邪灵伤害的任务。"
 omen_lha_mo:0 "拉-莫"
 omen_lha_mo_desc:0 "拉-莫是苯教中与大地、水、运气、财富和生育有关的女神。她通常被描绘为一位美丽的女人，面带和平的表情，手持镜子、莲花或孩子。拉-莫被认为是保护神，相信她能给那些崇拜她的人带来生育、繁荣和好运。她有时被认为是顿巴辛绕的妻子。她的崇拜通常包括献上牛奶、黄油和谷物。"
 omen_phuwer:0 "佩威"
 omen_phuwer_desc:0 "佩威是预言与占星之神，也是与格阔有关的神灵。这位神明通常被描绘为一位身着白衣的重要人物，身旁有三位女伴。$bon_religion$信徒崇敬这位神明时会用到羊羔的毛，彩带以及一只蝙蝠、一只鹤和一只杜鹃干瘪的心脏。"
 omen_sangpo_bumtri:0 "桑波奔赤"
 omen_sangpo_bumtri_desc:0 "桑波奔赤是与治愈和药物有关的苯教神灵。据说他有四个儿子，每个儿子都代表他力量的不同方面。桑波奔赤通常被描绘为手持碗或杯子，象征他所拥有的治愈力量。他也与太阳有关，他的名字翻译为“良好品质之王”。"
 omen_satrig_ersang:0 "萨智艾桑"
 omen_satrig_ersang_desc:0 "萨智艾桑被认为是苯教中最高的神灵之一，在苯教传统中受到极大的尊崇和崇拜。希绕强玛是萨智艾桑的另一种形式，可以被认为是萨智艾桑的化身显现，她承担着修行本尊、治愈之神（如益西旺母）和她最恐怖的形象——苯教主要保护神斯巴嘉母的角色。"
 omen_shenlha_okar:0 "辛拉悟噶"
 omen_shenlha_okar_desc:0 "辛拉悟噶通常被描绘为骑着一头白狮子，手持弓箭，代表他保护信徒免受负面影响的能力。他也与太阳有关，他的崇拜常与农业和收成相关。"
 omen_sherab_chamma:0 "希绕强玛"
 omen_sherab_chamma_desc:0 "希绕强玛是苯教中一位著名的女神，常被称为“智慧之母”。她与治愈和长寿的实践有关，据说她教导苯教徒如何进行某些仪式和实践。她也被认为是保护者和精神修行者的灵感来源。希绕强玛被描绘为一位光辉灿烂的女神，通常面带和平的表情，手持镜子、书或一串念珠。"
 omen_sidpa_gyalmo:0 "斯巴嘉母"
 omen_sidpa_gyalmo_desc:0 "斯巴嘉母是藏地苯教传统的主要护法；她是大慈母的忿怒化现。"
 omen_the_elements:0 "四元素"
 omen_the_elements_desc:0 "四元素在$bon_religion$中发挥重要作用，甚至被人格化为小神。风地水火之中，气通常是最重要的，被描绘为骑着白鹿穿越大地。"
 omen_tingnam_gyalmo:0 "登南嘉母"
 omen_tingnam_gyalmo_desc:0 "登南嘉母是身穿蓝衣的海洋之神，古吉芒科的配偶。她是河流与海洋的保护神，在$bon_religion$中扮演重要角色，广受崇敬。"
 omen_tonpa_shenrab:0 "顿巴辛绕"
 omen_tonpa_shenrab_desc:0 "顿巴辛绕被认为是苯教的创始人。根据苯教传统，他于18,000多年前出生在塔吉齐·奥尔莫·隆林之地。他被认为是将苯教教义传授给人类并帮助建立宗教的人。顿巴辛绕常被描绘为一位和平而富有同情心的教师，他通过苯教教义向信徒展示解脱之路。他也与治愈有关，据信他教导信徒如何使用药用植物来治愈疾病。"
 omen_traphu:0 "扎佩"
 omen_traphu_desc:0 "扎佩是一名$bon_religion$中的小神，通常与他来自的那片更北方的区域有关：那神秘的突厥之地。据说他生于一座水晶城堡，周围环绕着飞鸟、月光与日光。"
 omen_yeshe_walmo:0 "益西旺母"
 omen_yeshe_walmo_desc:0 "益西旺母被认为是斯巴嘉母的智慧面。她通常被描绘为穿着白袍、手持水晶念珠的美丽女人。相信她有能力赐予信徒精神上的觉悟和启蒙。"

 omen_allani:0 "阿兰尼"
 omen_allani_desc:0 "阿拉尼是胡里特神话中的冥界女神，通常与美索不达米亚女神埃列什基伽勒相关联。事实上，在亚述统治前米坦尼领土期间，阿拉尼最终正式等同于埃列什基伽勒。在胡里特神话中，阿拉尼是死亡之王，也是“暗黑大地”（即死者之地）的女主人。正因为如此，她常被视为命运之神。她被描绘为穿着蓝色服饰，这很可能意味着蓝色在胡里特文化中是与死亡相关的颜色。"
 omen_ashtabil:0 "阿什塔比尔"
 omen_ashtabil_desc:0 "阿什塔比尔，也称为阿什塔比，是一位源自闪族神祇体系但最终被纳入胡里特神祇体系的神祇。作为战神，他在库玛尔比循环中的《乌利库米之歌》中出现。他试图击败怪物，但即便拥有其他神祇的战车和七十个盟友的帮助，他最终还是失败了。最终击败乌利库米的是提秀布。"
 omen_ebrimusha:0 "埃布里穆沙"
 omen_ebrimusha_desc:0 "埃布里穆沙被称为“正义之王”，他是与赫巴特神系有关的一位正义之神。他在古亚述文献中被提及，这些文献记载了对源自胡里特传统的赫梯仪式中对埃布里穆沙的敬拜。"
 omen_hayya:0 "海雅"
 omen_hayya_desc:0 "海亚是胡里特语中对美索不达米亚神祇埃亚的拼写。他很可能是在阿卡德帝国时期进入胡里特神祇体系的，并在米坦尼王国时期尤为重要。他保留了与美索不达米亚对应神祇相似的角色，是一位智慧和知识之主。"
 omen_hebat:0 "赫巴特"
 omen_hebat_desc:0 "赫巴特，阿勒颇的女神，以及众神之王提秀布的配偶。因此，她被誉为天后，并自埃勃拉时期起就受到崇拜（尽管她并不是埃勃拉人中的主要女神）。正如她的介绍所暗示的那样，她成为了阿勒颇的守护神。在神话中，她生了三个孩子，其中最著名的是山神沙鲁马。"
 omen_hutena_hutelluri:0 "胡特娜与胡特鲁里"
 omen_hutena_hutelluri_desc:0 "命运女神和两位神圣助产士胡特纳与胡特卢里，她们的名字都来源于胡里特语动词“hut”，意思是“偏爱”。这两位女神都在库玛尔比的歌曲《Hedammu》和《Ullikummi》中出现。这对女神负责早夭的情况，通常是由于神的愤怒所致，尽管她们通常仍被视为仁慈的。"
 omen_irshappa:0 "伊尔沙帕"
 omen_irshappa_desc:0 "伊尔沙帕是胡里特版本的流行神祇雷斯斐。雷斯斐原本是一位叙利亚神祇，在埃及、地中海地区、黎凡特以及胡里特传统中都有显著的崇拜。尽管并不被所有人接受，雷斯斐这个名字可能与胡里特语有一些词源学上的关联，这意味着他可能最初至少受到了胡里特传统的某种程度的影响，而不仅仅是一位纯粹的叙利亚神祇。\n\n在胡里特信仰中，他被归入以主要神祇提秀布为中心的大圈子中。他被认为是贸易之神，这一方面似乎最初是在胡里特对他信仰的基础上形成的。"
 omen_kubaba:0 "库巴巴"
 omen_kubaba_desc:0 "库巴巴是叙利亚地区的胡里特神祇体系中的女神。不应将她与基什女王库巴巴混淆，因为胡里特女神库巴巴是一个独立的人物。她的名字的词源至今未知，但已经确定她的名字既不是闪族语系也不是苏美尔语系的。曾有人尝试将她与前述的基什女王库巴巴、弗里吉亚女神西贝尔以及亚述神祇古巴巴联系起来，但这些尝试都没有产生有意义的结果，与她联系最紧密的可能性是亚述的古巴巴可能是库巴巴的男性化版本。\n\n在胡里特神话中，关于她的记载非常稀少。有人提出她是“城邦”女神。在一个壁画中，她被描绘为手持一面镜子和一颗石榴。由于她在吕维亚语中与鸟的符号有关联，因此推测她与鸟类有关，然而并没有任何描绘她与任何类型鸟类相关的记录，这只会让这位神秘的胡里特女神的谜团更加深奥。\n\n#!神化效果：$culture_apotheosis_civic_tech_effect_tt_description$"
 omen_kumarbi:0 "库玛毕"
 omen_kumarbi_desc:0 "最初的众神之神，库玛尔比已经被降格为众神之父以及旧秩序众神的统治者。在他的故事中，他通常被描绘成一位老去并被废黜的众神之王。他被认为是许多显赫神祇的父母，包括新任的众神之王提秀布。"
 omen_kushuh:0 "库舒"
 omen_kushuh_desc:0 "月亮神库舒，也被称为乌姆布，是提秀布的重要盟友之一，并且在提秀布与库马尔比的斗争中给予了帮助。库舒与月亮的美好方面相关联，并且如同他的美索不达米亚对应神祇辛一样，与怀孕有关联。与太阳神希梅吉一样，库舒也被视为神谕的守护神。"
 omen_nabarbi:0 "纳巴比"
 omen_nabarbi_desc:0 "纳巴比是神祇体系中最重要的神祇之一，她是牧场女神。她在哈布尔河谷地区及其周边受到主要的崇拜，并且可能与叙利亚城市纳加尔中的女神贝莱特·纳加尔有所关联。"
 omen_ninkal:0 "宁卡尔"
 omen_ninkal_desc:0 "宁卡尔，也称为尼卡尔，是一位在整个古代中东地区广受崇拜的女神。在许多故事中，她是月亮神的配偶；在胡里特神话中，这位月亮神是乌姆布（即库舒）。她很可能源自美索不达米亚女神宁伽尔，就像宁卡尔一样，宁伽尔也是月亮神的配偶，并且两者的名字惊人地相似。"
 omen_nubadig:0 "努帕提克"
 omen_nubadig_desc:0 "努帕提克（也称为卢巴达格）是一位非常普及的胡里特神祇，有时甚至被称为泛胡里特神。这意味着他的崇拜非常广泛，可以与特舒布、绍什卡和库姆巴里的崇拜相媲美。尽管这位神祇的崇拜非常普遍，但在胡里特的描述中关于他的性格特征却知之甚少。赫梯的描绘常常显示向这位神献上弓箭和箭囊。"
 omen_pirinki:0 "皮里尼基"
 omen_pirinki_desc:0 "皮里尼基（也称为皮里尼基尔或皮里尼吉尔）最初是一位埃兰女神，但后来在胡里特信仰中也变得相当重要。在埃兰语中，这位女神是一位与金星相关的天体女神，被称为“天界的女主人”。很可能胡里特版本的这位女神更接近于美索不达米亚对皮里尼基的理解，即把她与伊斯塔尔联系起来，这使得皮里尼基也扮演着性爱与战争女神的角色。"
 omen_sharruma:0 "沙鲁玛"
 omen_sharruma_desc:0 "山神沙鲁马是提秀布和赫巴特的儿子，他自身是一位强大的神祇。他经常被描绘成一头强壮的公牛，尽管最初他是被描绘站在豹子背上。这位神祇手持其标志性的金色长矛。沙鲁马是一位多面的神祇，不过他最古老的角色似乎与山脉有关。"
 omen_shaushka:0 "沙乌斯卡"
 omen_shaushka_desc:0 "爱与战争的女神肖什卡会让人联想到伊什塔尔，并且和伊什塔尔一样，肖什卡是一位非常显赫的女神。事实上，在某些时期，肖什卡可能比库玛尔比或提秀布更加重要。她仍然保持着赫人的最高女神的地位。\n\n肖什卡这个名字的意思是“伟大的”或“壮丽的”。\n\n和提秀布一样，肖什卡也是库玛尔比的女儿。她和提秀布共享同样的神话起源故事，即从库玛尔比与阿努之间的战斗中诞生。"
 omen_sherri_hurri:0 "舍里与胡里"
 omen_sherri_hurri_desc:0 "舍里和胡里分别是昼夜的两位神祇。他们以神圣公牛的形式拉动提秀布的战车。作为昼夜神祇的身份将他们与太阳神希梅吉和月亮神库舒联系在一起。"
 omen_shimegi:0 "希梅吉"
 omen_shimegi_desc:0 "太阳神希梅吉是提秀布最为重要的盟友之一。在胡里特神话《乌利库米之歌》中，他是第一个注意到威胁到提秀布的怪物，并向提秀布通报了这一威胁的人。\n\n希梅吉被认为是一位神谕的守护神，他驾驶着四匹马拉的战车穿越天空，为人间带来白昼的光明和太阳的光辉。"
 omen_shuwaliyatti:0 "舒瓦拉"
 omen_shuwaliyatti_desc:0 "舒瓦拉是古代美索不达米亚胡里特城市马尔达曼的守护神。她经常与女神纳巴比相关联，有时也被认为与赫巴特的圈子有关，这个圈子包括了许多胡里特和叙利亚的神祇。\n\n舒瓦拉经常与赫里奥-赫梯神祇舒瓦利亚特或舒瓦利亚蒂混淆，但据信他们是不同的神祇。舒瓦利亚蒂也被认为是纳巴比的配偶。虽然这在很大程度上只是一个巧合，但与纳巴比的共同关联告诉我们，这两位女神都起源于安纳托利亚的哈布尔河流域。"
 omen_sumuqan:0 "舒穆坎"
 omen_sumuqan_desc:0 "舒穆坎(Shumuqan)，也拼写为Shumugan、Shamagan或Shakkan，是一位与动物相关的牧羊神，特别是与驴、羊，在埃勃拉还与骡子相关。他还照料动物生活的环境，甚至照顾到供它们食用的植物。有时，他被称为“万物的牧羊人”，甚至是“羊毛之神”和“食草动物之神”。他经常与草原相关联，这也使他与冥界有所联系。"
 omen_tadmish:0 "塔德米什"
 omen_tadmish_desc:0 "塔德米什（也称为达德米什）是一位在乌加里特受到崇拜的女神。虽然她的起源在叙利亚，但她后来在胡里特神话中变得流行。她被认为是一位治愈女神。在乌加里特，她在众神会议中的位置排在雷斯斐之后；而在胡里特传统中，她属于城市的神祇体系，并且与提秀布、库舒、海亚（埃亚）和绍什卡一同被列出。有趣的是，尽管她受到了积极的崇拜，但在任何乌加里特的神话或故事中都没有提到她。"
 omen_tasmisu:0 "提斯米修"
 omen_tasmisu_desc:0 "提斯米修是伟大的提秀布的兄弟，是一位力量惊人的战神。提斯米修的名字被提议来源于胡里特语词汇“tashmi”，意思是“强壮”。他是四位战士神祇之一，另外三位是胡里特神祇阿什塔比尔、赫什伊，以及美索不达米亚神祇涅格尔。\n\n提斯米修与提秀布的关系似乎是弟弟与哥哥的关系。提斯米修常称呼提秀布为“我的主人”，并被认为是提秀布的“纯洁兄弟”。与提秀布和他的姐姐肖什卡一样，提斯米修来自阿努和库玛尔比的结合。\n\n有趣的是，在赫里奥-赫梯神话中，提斯米修经常与舒瓦利亚蒂相关联，显示出赫里奥-赫梯版本与赫里奥-叙利亚版本之间的一些细微但有趣的区别。当然，也有可能舒瓦利亚蒂源自赫梯语，并后来被纳入胡里特信仰之中，导致提斯米修与舒瓦利亚蒂角色上的奇怪重叠。两位神祇在其信仰的本质上也有活跃的区别，例如提斯米修从未与植被一起被崇拜，这一点与他的赫梯语对应神祇不同。\n\n#!神化效果：$economy_apotheosis_capital_citizens_effect_tt_description$"
 omen_teshub:0 "特舒布"
 omen_teshub_desc:0 "神圣的提秀布，没有他就将一切皆失。当库玛尔比咬掉了阿努的生殖器，并被阿努诅咒要承受生育之苦时，提秀布从库玛尔比的头中诞生。\n\n提秀布是众神之王。他的强大风暴既能削减人类的数量也能保护人类。他不仅统治着众神，也直接统治着人类。"

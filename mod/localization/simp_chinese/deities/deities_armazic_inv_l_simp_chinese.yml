 omen_aguna:0 "阿古纳"
 omen_aguna_desc:0 "阿古纳是格鲁吉亚的葡萄栽培和酿酒之神。阿古纳在拉查和列赫胡米地区被称为“安古拉”，在萨梅格雷洛地区被称为“朱杰利亚”。在新年和秋季节日时会举行纪念阿古纳的仪式。在除夕夜，人们会把葡萄串做成角状并烤入面包之中。在格鲁吉亚的古里亚地区，这里是科尔基斯王国的一部分，这种面团被称为“阿古纳面包”。人们会在高高的葡萄藤旁和酒窖中祈祷，请求阿古纳确保葡萄的丰收。阿古纳的一些仪式元素与弗里吉亚-希腊-罗马的神祇狄俄尼索斯（巴克斯）的崇拜有相似之处。\n\n在克拉杰蒂的收获季节，人们会在葡萄园中举行宴会，年轻的裸体男子身饰阿基多，跳起费尔赫利舞，这是一种至今仍在实践的本土舞蹈。阿古纳的崇拜残余在格鲁吉亚的部分地区一直延续到19世纪。\n\n#!神化效果：$economy_apotheosis_capital_noble_effect_tt_description$"
 omen_ainina_and_danina:0 "艾妮娜"
 omen_ainina_and_danina_desc:0 "艾尼娜，也被称为达尼娜，是后来被引入阿尔马兹神系的女神。她经常与生育、治愈和智慧相关，并拥有一个崇拜者群体。她有时被等同于阿娜希特或伊南娜。"
 omen_amirani:0 "阿米拉尼"
 omen_amirani_desc:0 "阿米拉尼是高加索地区的文化英雄。通过口口相传，现在格鲁吉亚的阿米拉尼史诗最早可追溯到公元前3000年。他经常被与普罗米修斯相提并论，希腊的普罗米修斯可能曾与这位阿米拉尼是同一个神。\n\n阿米拉尼是高加索狩猎女神达利的儿子，但他过早地从达利的子宫里被取出，由猎人苏尔卡尔玛和他的妻子达雷扬抚养，同时抚养的还有达雷扬的两个亲生儿子巴德里和乌苏普。他经历了许多冒险，但最终因教人类如何使用一种特殊的金属而惹恼了一位神灵。\n\n对他的惩罚有三个步骤。首先，他被绑在地底深处的一根柱子上。然后被铁链埋在山里。最后，每年一次，当人类徒劳地试图拯救他时，通往他的通道就会被打开。"
 omen_apsati:0 "阿普萨特"
 omen_apsati_desc:0 "阿普萨提（Apsati）或阿普萨特（Apsat）是猎人和野味之神，也是斯旺人的保护神和野牛的牧羊人。没有他的保佑，猎人的箭就不会射中目标。他怜悯所有恳求他、为他点燃蜡烛或祈祷并承认他的力量和至高无上地位的人的战利品。阿普萨提亲自挑选猎人必须杀死的猎物。他住在斯瓦内特的山中，在最高峰附近一个用鹿角装饰的洞穴里。应该指出的是，狩猎崇拜对于伊朗世界来说是陌生的。它是从邻近的阿兰-奥斯（Alan-Oss.阿布哈兹人中与阿普萨提相似的类型是阿日韦夫沙，切尔克斯人中则是梅济提。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_arhan:0 "阿尔汉"
 omen_arhan_desc:0 "高加索阿尔巴尼亚的传奇创始人和阿尔巴尼亚人名字的起源，领主阿尔汉在欧亚大陆大洪水神话时期与不朽者同行。作为游牧民和山地人的混合体，阿尔汉在高加索山脉寻找安置家庭和发展族人的地方。对于他的孩子们和他们的后代，他也被称为“阿格万”，而外人则称他为山地人。"
 omen_badagon:0 "巴达贡"
 omen_badagon_desc:0 "Ekvtime Mtatsmindeli（955-1028 年）在《小 Sjuli 传说》中写到了 Armaz、Gatsi、Gaim、Bochi 和 Badageon。关于这个 \"巴达贡\"，他写道：\"不管是谁榨葡萄，他们都会说狄俄尼索斯的名字并取笑他。这是魔鬼的事情，是基督徒的耻辱\"。因此可以断定，\"压榨 \"葡萄并与狄俄尼索斯等同的人就是巴达贡，他是原格鲁吉亚保护葡萄和葡萄酒的神灵。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_barbale:0 "巴巴莱"
 omen_barbale_desc:0 "芭芭勒是一位太阳女神，与疗愈、牲畜与农作物的繁殖，以及驱除疾病息息相关。在整个高加索地区，她也被视为女性的主要守护神。她在北方地区受到最广泛的崇拜。然而，正如太阳既能温暖也能灼烧，她有时亦可能成为伤害的源头……"
 omen_bardos:0 "巴尔多斯"
 omen_bardos_desc:0 "传奇人物 Targamos（也称为 Togarmah）的八个儿子之一，Bardos 和他的后代在 Berduji 河以西直到 Araxes 和 Kuras 汇合处的阿尔巴尼亚人和乌迪安人的土地上定居并文明化。他的领地富饶而水源充足，因此他在 Partaw 建立了城市基础，其名称源自他的名字。"
 omen_beri:0 "贝里-贝拉"
 omen_beri_desc:0 "贝里-贝拉是高加索神话中的人形生育之神。古老的贝里-贝拉崇拜将他描绘为一位老人。他是收获的保护者，促进牲畜繁殖，并在其信徒间保证人口的繁衍。\n\n在中世纪，贝里-贝拉经常与巫婆联系在一起，被描绘手持扫帚，不过不清楚这种与扫帚的关联是否早于欧洲出现类似巫婆的形象，或者是否这种巫婆形象影响了对贝里-贝拉的联想。\n\n在东格鲁吉亚的山区，贝里-贝拉在庆祝日历节日时是非常受欢迎的人物。在新年前夕的仪式中，男性首领化身成为贝里-贝拉进入房屋，坐在一根棍子上，并带来祝福和美好的祝愿。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_boseli:0 "博塞利"
 omen_boseli_desc:0 "博塞利是一种牛形生物，游荡于群山与山谷牧场之间，是多产与繁衍的象征。博塞利的身影激发了苏阿尼亚部落男子的勇气，使他们大胆地与女子交合；而夜间若有博塞利造访，翌日清晨往往就会诞生几头小牛犊。这便是牛形存在——博塞利所赐予的恩惠。"
 omen_durdzuks:0 "杜尔祖克"
 omen_durdzuks_desc:0 "传奇人物 Togarmah 的孙子 Kavkasos 的儿子，Durdzuks 是北高加索周围现代车臣和印古什地区最具战争性的几个部落的父亲。他的后代和追随者被称为 Nakhs 或 Vainakhs。他的血统使这些人与邻居之间异常好斗。"
 omen_heros:0 "赫罗斯"
 omen_heros_desc:0 "传奇人物 Targamos/Togarmah 的儿子，赫罗斯将他的追随者和孩子们安置在阿尔扎尼河系的支流之间的一个可防御的海岸线上。为 Hereti 奠定基础，以他的名字命名，赫罗斯统治着一个混合了阿尔巴尼亚人、伊比利亚人和偶尔来自草原的北方人的土地。"
 omen_iakhsari:0 "雅赫萨里"
 omen_iakhsari_desc:0 "Ghmerti 的儿子，Iakhsari 与其他神圣英雄一起战斗，对抗 Devis 和 Qajis（类恶魔生物）。尽管是战士，他也是病人和受伤士兵的治疗者，甚至驱逐精神病患者中的邪灵。在其他神圣英雄中，他竞争谁能杀死最多的 Devis，并与 Kopala 共同获胜。东部山脉是他的狩猎场。"
 omen_lekos:0 "勒科斯"
 omen_lekos_desc:0 "托加马赫的第五个儿子，勒科斯是勒科部落和许多列吉安/列兹吉人的父亲。他的领地是北高加索和达拉班德周围的里海海岸。他的土地富有陆地和海上贸易，许多伊朗人和高加索人在这些地方混居。因此，他的后代很难向陌生人介绍他们的身份。"
 omen_meis:0 "迈斯"
 omen_meis_desc:0 "梅伊斯是月神'门'的一种形态，发现于安纳托利亚的吕底亚地区，可能在高加索神话中扮演类似角色。这个名字很可能也与小众月神曼哈或玛哈相同。不幸的是，我们对梅伊斯了解不多，因此大多数假设是基于安纳托利亚的门神，而他自身又受到琐罗亚斯德教和密特拉教神玛哈的影响。这可能就是为什么门神与主宰月历有关——因为在阿维斯陀语中，月亮与月份是同一个词。他也被描绘为从肩膀后面长出新月形的角。"
 omen_mitsa:0 "德达-米察"
 omen_mitsa_desc:0 "Deda-Mitsa 的字面意思是 \"大地之母\"，是三位大地之神中最强大的一位。在孩子出生的仪式中保留了对大地母亲的神灵崇拜。基地的天使和地方的母亲管理和保护着人类的生命，但像孩子的出生、新生命的出现这样重要的问题也被纳入了最高神灵的职能中。在格鲁吉亚异教有关孩子出生的仪式中，祭品和祈祷都是献给大地之母的。三位一体中的另外两位是地方（家园）之母和炉灶保护神。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_movakanos:0 "莫瓦卡诺斯"
 omen_movakanos_desc:0 "传奇人物塔尔加莫斯（也称为托加玛）的第四子，莫瓦卡诺斯和他的后代统治着库拉河以北、小阿尔扎尼河以东的阿尔巴尼亚人土地，最远达里海/马赞德兰。他的领地背靠北高加索山脉作为屏障。在这片区域，他为莫瓦克内特城奠定了基础，该城的名字便源自他自身。"
 omen_ochopintre:0 "奥赫皮"
 omen_ochopintre_desc:0 "奥赫皮是森林的精神或神祇。他是植物和野生动物的保护者。他与希腊神潘有一些相似之处。奥赫皮被描绘成生有山羊的腿和角。他有时被称为“奥奇”，这揭示了他与神话中的山羊“博赫”的联系。"
 omen_phasia:0 "法西亚"
 omen_phasia_desc:0 "法西亚是法息斯城的守护女神。这个城市是希腊神话中阿尔戈英雄传说的一部分，似乎被认为是科尔基斯的贸易城市。法息斯很可能是一个希腊人-蛮族混合定居点。古代法息斯的大致位置发现了一座法西亚女神的雕像，从而引发了关于法息斯有一个守护女神的理论，因此命名这位女神为法西亚，以代表这位法息斯女神。"
 omen_qamari:0 "卡马尔"
 omen_qamari_desc:0 "号角、天气和云彩之神的女儿是美丽的卡玛丽女神（又称卡玛尔或卡玛尔）。我们从阿米兰的故事中了解到这位天女。阿米兰被卡玛莉的美貌迷住了，再也无法抗拒她的诱惑。他将她从海滨国家绑架了回来。然而，卡马里却在阿米兰那里找到了爱情。随后，阿米兰受到惩罚，被锁在高加索山脉。从那时起，卡马里就一直等待着阿米兰的归来。一些学者认为，阿米兰从卡杰特绑架卡马里与普罗米修斯绑架天火有某种联系。\n\n阿米兰被绑后，卡马里躲进了月亮里。一首献给卡马里的诗写道\n\n你为何躲在月亮附近？\n如果我能在你途中穿上它\n我的床单\n至少我不会让你看到一滴眼泪\n苍白的欲望\n我会像这样看着你\n我会用我的眼睛撕裂天空！\n\n#!神化效果：$fertility_apotheosis_capital_slaves_effect_tt_description$"
 omen_samdzimari:0 "萨姆兹玛丽"
 omen_samdzimari_desc:0 "萨姆兹玛丽是高加索地区的母系女性神灵，后来与神的女儿们联系在一起，在父权制更加突出的时代被引入。尽管如此，萨姆兹玛丽似乎仍具有保护人民的母亲般的重要地位。她的绰号是“凯里”，一个开朗、大胆、曲线优美的美丽女性。"
 omen_shavkhani:0 "沙夫哈尼"
 omen_shavkhani_desc:0 "高加索的赫菲斯托斯，Shavkhani 也是一位残疾的锻造英雄。据说，有一晚，一群提毗来到他的家里，当他睡觉时，把一块重铁翻到他的下半身，导致他残废。因此，他在工作坊里辛勤工作，日夜构建神圣的奇迹。他最为人称道的是建造了一座横跨天际的铁桥。"
 omen_teudore:0 "特乌多雷"
 omen_teudore_desc:0 "特乌多雷又名特多雷，是农民的保护者和帮手，帮助他们丰收以养家糊口。他备受尊敬，被称为 “伟大勤农”或“伟大之主”。特多雷最初只与生育有关，后来成为马的守护神。\n\n除了上述称谓外，特乌多雷有其他称谓，如“特多雷”或“黑脸”，将他与黑土地的肥沃联系在一起。人们还通过一个名为“特多拉巴”的节日来纪念特多雷。在这一天，居住在村庄里的家庭会烤制带有农具和动物（主要是马）图像的祭祀面包，并组织大规模的公共播种仪式。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_zadeni:0 "扎代尼"
 omen_zadeni_desc:0 "扎德尼是战争和果实的守护神，我们的人在出征前经常会召唤他。他通常手持鲜花或斧头，身边有一只长着翅膀的狮子。他在希腊人中被称为赫拉克勒斯。\n\n扎登是原格鲁吉亚神话中不可或缺的神。根据手稿的传统，公元前2世纪上半叶，法尔纳乔姆国王引入了对扎登的崇拜。一份书面历史资料将扎登的名字与姆茨赫塔附近扎登城堡的名字联系在一起。“国王阿曼—法尔纳乔增加了所有城堡和城市的建设，他建造了扎登城堡，并创造了一个名为扎登的神像，并统治着扎登。”\n\n异教伊比利亚和科尔基斯存在对密斯拉的信仰，这可能与密斯拉有关。有学者指出，扎登就是密特拉；“扎登无疑是阿维斯陀语的亚扎塔或波斯语的亚兹丹，意思是善灵，尤其是密特拉，然后是好的神灵”。在马特恩，对扎登—密特拉的崇拜仅次于对阿尔马齐的崇拜。\n\n#!神化效果：$military_apotheosis_defensive_effect_tt_description$"

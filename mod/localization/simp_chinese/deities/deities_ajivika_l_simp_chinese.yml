 omen_ajjuna:0 "阿阇那·瞿昙弗"
 omen_ajjuna_desc:0 "作为末伽梨·拘舍利宣称的第六世，阿阇那·瞿昙弗很可能是真实存在的。在末伽梨之前，阿阇那很可能是正命论的主要领袖，因此声称转世自他，将为末伽梨·拘舍利最终成为所有正命论领袖中最伟大的一位提供极大的合法性。据说阿阇那曾在毗舍离外的憍陈如支提，与优陀耶的灵魂共同生活了十七年。"
 omen_bharaddai:0 "婆罗陀戴"
 omen_bharaddai_desc:0 "末伽梨提及的第五个模糊人物。被认为是正命论的第五位大师，末伽梨·拘舍利声称自己转世自他以及其他六位大师。婆罗陀戴与优陀耶的灵魂在阿罗毗耶外的钵多迦罗伽耶支提共同生活了18年。"
 omen_enejjaga:0 "伊祇迦"
 omen_enejjaga_desc:0 "末伽梨·拘舍利声称自己是多位重要正命论领袖的转世，神秘的伊祇迦是其中的第一位。他曾在曼迪亚库奇外的罗耶支提，与优陀耶的灵魂共度了22年。"
 omen_kisa_sankicca:0 "佉沙·商佉蹉"
 omen_kisa_sankicca_desc:0 "佉沙·商佉磋以正命论重要人物之一而闻名，他是正命论的第二位领袖。然而，除了推测其备受尊崇、被视为该信仰三位伟大领袖之一外，人们对他一无所知。他可能与末伽梨和难陀同时代，其名字位列第二或许意味着他是正命论三显者中的第二位。考虑到是富兰那·迦叶将他列为正命论伟大领袖之一，佉沙很可能受到富兰那·迦叶的尊崇，而富兰那·迦叶正是继末伽梨之后的正命论领袖。"
 omen_makkhali_gosala:0 "末伽梨·拘舍利"
 omen_makkhali_gosala_desc:0 "正命论创始人，末伽梨·拘舍利出生于一个低种姓家庭的牛棚中。在筏驮摩那开始苦行三年后，他成为筏驮摩那的苦行弟子。然而，由于两者之间的哲学争端，末伽梨·拘舍利从筏驮摩那的耆那教派中分裂出来，创立了新的正命论分支。尽管正命论早已存在，末伽梨·拘舍利还是成功地统一了该教派，使其成为佛教和耆那教的强大对手。这引起了耆那教派的严苛审视，更多则是佛教的严苛审视，佛教徒认为末伽梨为“愚人”，正命论为“邪命外道”之一。\n\n末伽梨·拘舍利声称自己是优陀耶·军稚亚尼耶灵魂转世的一部分，该灵魂在娑伐絺的诃罗诃罗身体中存在了16年。他可能这样说是为了与自己过去作为筏驮摩那弟子，对耆那教的信仰区分开来。"
 omen_mallarama:0 "末罗罗摩"
 omen_mallarama_desc:0 "神秘的末罗罗摩据说是正命论七位大师中的第二位，也是末伽梨·拘舍利宣称的第二世，他在飞行寺外的曼地耶支提与优陀耶的灵魂共度了21年。"
 omen_mandiya:0 "曼地耶"
 omen_mandiya_desc:0 "曼地耶是末伽梨声称自己转世而来的第三个半神话人物。据推测，他是正命论七大师中的第三位，末伽梨·拘舍利为了将自己与耆那教起源区分开来而与之关联。此人曾在旃巴城外的安伽曼迪拉支提中，与优陀耶的灵魂共居二十年。"
 omen_nanda_vaccha:0 "难陀·伐蹉"
 omen_nanda_vaccha_desc:0 "在重要领袖名单中，难陀·伐蹉排在佉沙·商佉蹉和末伽梨·拘舍利之后，位列首位，他可能是末伽梨·拘舍利时代三位正命论领袖中的第一位。他经常与佉沙和末伽梨一同被提及，且在名单中名列首位，因此他实际上可能比这两位更早出现。无论如何，很明显他在正命论中备受推崇。考虑到正是富兰那将他列为正命论伟大的领袖之一，难陀很可能也受到富兰那·迦叶——这位在正命论中继末伽梨之后担任领袖的人物——的尊崇。"
 omen_niyati:0 "泥耶帝"
 omen_niyati_desc:0 "泥耶帝指的是命运的概念。这是将正命论与其他沙门信仰区分开的教义。泥耶帝是不可改变的、不可移动的，人类无法改变它。泥耶帝控制着每一个行动和所有现象，不留任何人类意志的空间。它是宇宙精神的预定意志。任何过去、正在发生或将要发生的行为都会发生。人类无法犯罪，因为这是预定的。佛教徒会问，如果是这样，什么能阻止人偷窃？正命论回答，如果它要发生，它会发生，惩罚和反应也会发生。耆那教徒可能会问，如果一切都会发生，无法改变，为什么还要实践苦行？正命论再次回答，苦行是那些注定要享受它的人所享受的，其中包括正命论者。\n\n#!神化效果：$culture_apotheosis_rel_tech_effect_tt_description$"
 omen_pakudha:0 "波拘陀·迦旃延"
 omen_pakudha_desc:0 "波拘陀·迦旃延可能是继富兰那·迦叶之后的正命论领袖。与他的两位前辈不同，波拘陀为正命论哲学带来了一些不同的见解。他最著名的贡献是创立了七种永恒不变元素的学说：地、水、火、风、生命、喜悦与悲伤。他也可能是印度哲学家中最早提出原子论的人。尽管原子论后来成为正命论的一部分，但当时他的声望并不如富兰那和末伽梨那般崇高，甚至有说法称他自称未能达到完全的觉悟。然而，他的原子论思想将存续下去，超越正命论作为一个信仰体系的消亡。"
 omen_paramanu:0 "微尘"
 omen_paramanu_desc:0 "微尘是一个指原子概念的术语，原子论作为正命论的基本信仰之一被吸收。它很好地符合泥耶帝的信仰，并且可能是第一个概念化原子论的印度宗教。因此，正命论比耆那教或佛教更倾向于无神论，因为原子论很好地倾向于唯物主义无神论，现代无神论的理解源于此。无论如何，微尘是构成一切的最小物质，并且是不可分割的，因为它是存在的最小单位。\n\n#!神化效果：$economy_income_effect_tt_description$"
 omen_purana:0 "富兰那·迦叶"
 omen_purana_desc:0 "富兰那·迦叶是末伽梨·拘舍利之后的正命论派领袖。他被视为佛教的重大威胁，很可能为佛教徒对正命论派积累了大量仇恨。富兰那·迦叶还宣称正命论派三位最伟大的领袖是难陀·伐磋、佉沙·商佉磋和末伽梨·拘舍利。这应当是因为这三人都对正命论派极具影响力并对其进行了革新，尤其是末伽梨·拘舍利。\n\n富兰那·迦叶是位于库库坦伽罗的正命论派僧团的首席比丘。他在追随者中获得了“智慧无双主富兰那”的称号。另一个称号则是“长者富兰那”。富兰那·迦叶对泰米尔地区的正命论派尤为重要，他们视他为仅次于末伽梨·拘舍利的最伟大正命论导师。\n\n关于富兰那起源的故事比末伽梨的传说色彩更浓。据说富兰那生为奴隶，受到善待。尽管如此，他还是逃离了主人。在逃亡途中，他的衣服被强盗偷走，而他在进入村庄时既无意愿也无意识去遮掩身体。村民们认为他赤身露体、以纯净形态出现（称为“法衣之纯”），必定是位圣人。最终，他接受了这种裸体状态，拒绝别人提供的衣物，并因此聚集了五百名正命论追随者。"
 omen_roha:0 "卢诃"
 omen_roha_desc:0 "根据末伽梨·拘舍利的记载，罗哈是正命论七位半神话领袖名单中的第四位。末伽梨·拘舍利宣称，罗哈是其转世之一，在此世中，优陀耶灵魂经历了十九年的修行，这部修行历程是在跋罗那徙外的钵多迦罗伽耶支提完成的。"
 omen_udai:0 "优陀耶·军稚亚尼耶"
 omen_udai_desc:0 "神秘的优陀耶·军稚亚尼耶或许是正命论的半神话创始人，又或许他生活在正命论尚未形成完整概念的时代，但正命论派系正是从他衍生而来。着时间推移，优陀耶的全名被铭记，并形成了一种观念：他体内的灵魂成为了第一个轮回转世之魂——据说，优陀耶的灵魂每次寄居在其他躯壳中，都会诞生一位新的正命论导师；按照顺序，优陀耶的灵魂依次在伊祇迦体内停留22年，在末罗罗摩体内停留21年，在曼地耶体内停留20年，在卢诃体内停留19年，在婆罗陀戴体内停留18年，在阿阇那·瞿昙弗体内停留17年，在拘舍利·末伽梨弗（末伽梨·拘舍利）体内停留16年。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"

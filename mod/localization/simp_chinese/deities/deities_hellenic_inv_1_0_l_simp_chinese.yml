 omen_aeetes:0 "埃厄忒斯"
 omen_aeetes_desc:0 "埃厄忒斯是太阳神赫利俄斯和海洋女神珀耳塞伊斯的儿子，是希腊神话中的科尔基斯国王。他在伊阿宋和阿尔戈英雄们的惊人故事中占有重要地位，埃厄忒斯承诺，如果伊阿宋能够完成某些任务，就会给予他传说中的金羊毛。埃厄忒斯可能也是历史上真实存在的人物，或者是一个真实历史国王的代表。许多科尔基斯的统治者声称自己是这个半神话人物的后裔。"
 omen_aphrodite_areia:0 "阿佛洛狄忒·阿雷亚"
 omen_aphrodite_areia_desc:0 "$aphrodite_description$\n\n#Y 阿雷亚#!：这个绰号意为“好战的阿佛洛狄忒，在斯巴达和塔拉斯被广泛崇拜，其通常被描绘为一切全副武装的战士类似战争阿瑞斯。据信，这种对阿佛洛狄忒好战性格的描述起于她在塞浦路斯和塞西拉岛最早的一批信徒和教派。在东方化时期，这些地方受到了强烈的东方影响。\n\n这种描述从阿佛洛狄忒的原型，中东地区的古老女神中追溯，如苏美尔的伊南娜。，美索不达米亚的伊什塔尔，和腓尼基的阿施塔特。\n\n在塞浦路斯，阿佛洛狄忒也被称为：“阿佛洛狄忒·奥切奥斯”（意为拿着长矛的阿佛洛狄忒），有人认为这种崇拜是从塞浦路斯带到斯巴达的。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_apollo_hegemon:0 "赫格蒙·阿波罗"
 omen_apollo_hegemon_desc:0 "赫格蒙·阿波罗是光明之神阿波罗的复仇、征服形态，他是无情的主宰，统治着世界的国王和皇帝。赫格蒙·阿波罗深受我们城市居民的喜爱，他们在和平与战争时期都以阿波罗为灵感，因为同一只拨弄七弦琴的手也挥舞着利剑。"
 omen_apsyrtus:0 "阿普绪尔托斯"
 omen_apsyrtus_desc:0 "阿普绪尔托斯是科尔基斯王子，赫利俄斯的后裔，在伊阿宋和阿尔戈英雄们的故事中起着关键作用。他和他的姐姐美狄亚与伊阿宋一起带着传说中的金羊毛逃离科尔基斯。然而，为了阻止他们的父亲追上他们，美狄亚杀死了阿普绪尔托斯，并把他的尸体分尸扔在后面，以迫使她的父亲收集他儿子的所有碎片，从而拖延时间。"
 omen_artemis_tauropolos:0 "阿耳忒弥斯·陶罗波洛斯"
 omen_artemis_tauropolos_desc:0 "$artemis_description$\n\n#Y Tauropolos#!：处女伊菲革涅亚在被女神阿耳忒弥斯拯救之前险些被她的父亲献祭的故事，对我们的人民有着深远的意义。因为伊菲革涅亚是在塔乌里人的土地上被带走的，当她最终被送回来时，也带来了她的保护神阿耳忒弥斯的雕像，直到今日依旧被我们所崇拜。铭记阿耳忒弥斯-陶罗波洛斯的仁慈是我们神圣的使命。\n\n#!神化效果："
 omen_athena_tritogeneia:0 "特里托革尼亚的雅典娜"
 omen_athena_tritogeneia_desc:0 "：在利比亚的圣地，那里有赋予生命的特里托尼斯湖水，雅典娜·特里托格尼亚——那位由“三者”所生的女神，就诞生于这圣水之畔。凡人啊，赞美她，若你被她认可，便可获得她的祝福。"
 omen_bellona:0 "柏洛娜"
 omen_bellona_desc:0 "柏洛娜是罗马的战争、毁灭与破坏女神。是罗马的战神马尔斯的配偶。\n\n在罗马传说中，柏洛娜负责策划城市的毁灭，常常陪同马尔斯参加战斗，在对柏洛娜的军事化教派中，她常常被和英勇的化身比尔图斯联系在一起。"
 omen_cataonian_apollo:0 "卡塔俄尼亚的阿波罗"
 omen_cataonian_apollo_desc:0 "卡塔俄尼亚的阿波罗神庙位于达斯塔尔库姆，是卡帕多西亚所有其他神庙的范本。"
 omen_dionysos_indikos:0 "印度的狄奥尼索斯"
 omen_dionysos_indikos_desc:0 "：狄俄尼索斯·印迪科斯是阿迦密神湿婆在希腊的表现形式。我们已将其引入希腊佛教神系。我们将向湿婆献上祈祷，希望他能引导我们的士兵作战并增强他们的士气。有了士兵们坚强的纪律和决心，我们必将在未来数年中取得诸多胜利。"
 omen_discordia:0 "狄斯科蒂亚"
 omen_discordia_desc:0 "狄斯科蒂亚是罗马的纷争与不和女神，与厄里斯对应。像厄里斯一样，她因被奥林匹斯诸神冷落而引发特洛伊战争，她因此献上了不和的金苹果。\n\n这导致朱庇特选择特洛伊王子帕里斯作为选择最美丽女神的裁判，他最终选择了维纳斯，因为她承诺将海伦，斯巴达的美丽女王，给予帕里斯，这一行为引发了特洛伊战争。"
 omen_drakon_kholchikos:0 "科尔基斯龙"
 omen_drakon_kholchikos_desc:0 "$kholchikos_description$\n\n#Y 科尔基科斯#!：那条守护着最初悬挂着金羊毛的橡树的巨龙，在阿尔戈英雄伊阿宋带着国王埃厄忒斯的女儿美狄亚逃离时夺取了金羊毛。作为一条巨大的警觉巨蛇，这条龙是希腊人所说属于战神马雷斯的神圣守护者。从它的牙齿中，播撒入土的战士们诞生，他们个个骁勇善战，准备浴血奋战到底。它是一只可怕而又令人敬畏的生物，肩负着众神赋予的唯一使命。"
 omen_enyo:0 "厄倪俄"
 omen_enyo_desc:0 "作为战争女神，她常常被与希腊神祇阿瑞斯联系在一起，要么是阿瑞斯的情人，要么是他的妹妹，她负责策划城市的毁灭，常常陪同阿瑞斯参加战斗。\n\n在特洛伊沦陷期间，厄倪俄与厄里斯（“冲突与不和的女神”），福波斯（“恫吓之神”），得摩斯（“恐惧之神”）在战争中制造恐怖与流血，后两者为阿瑞斯之子。根据神话，厄倪俄参与了七神攻忒拜的战争，也参与了狄奥尼索斯与印度人的战争。\n\n据说，厄倪俄尤其酷爱争斗，甚至在宙斯与怪物堤丰的战斗中，她都拒绝站在任何一方。\n\n#!神化效果：$military_apotheosis_manpower_effect_tt_description$"
 omen_eris:0 "厄里斯"
 omen_eris_desc:0 "厄里斯是希腊的纷争与不和女神。厄里斯最著名的故事是她引发了特洛伊战争，导致了帕里斯的审判。\n\n希腊神祇赫拉、雅典娜和阿佛洛狄忒与奥林匹斯的其他神祇被邀请参加珀琉斯和忒提斯的强迫婚礼，他们将成为阿喀琉斯的父母，但由于厄里斯的捣乱倾向，她被冷落了。\n\n因此（根据普罗克洛斯的《基普里亚》中提到的一个计划，厄里斯按照宙斯和忒弥斯的计划行事）她在婚礼上投掷了不和的金苹果，上面刻有“给最美丽的人”的字样——这激起了女神们争夺这个称号。\n\n不幸的特洛伊王子帕里斯被任命为选择最美丽的裁判。之后，女神们试图贿赂帕里斯选择她们。\n\n赫拉提供政治权力；雅典娜承诺无限智慧；阿佛洛狄忒引诱他，以世界上最美丽的女人：斯巴达的海伦作为奖励。\n\n虽然希腊文化更注重勇敢和力量，但帕里斯选择将苹果授予阿佛洛狄忒，从而注定了他的城市在随后的战争中被摧毁。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_ge:0 "盖亚"
 omen_ge_desc:0 "盖亚是阿尔马兹对希腊女神盖亚的描绘。在卡俄斯之后出现的四个原始永生者之一，她是大地本身的化身。她创造了乌拉诺斯，天空，然后带来了更多的孩子。乌瑞亚，山脉；蓬托斯，海洋；和独眼巨人；所有这些都没有伴侣的帮助。乌拉诺斯成为她的第一个伴侣。从这个结合中，盖亚怀上了三个儿子。然而，乌拉诺斯因为害怕自己的地位，拒绝让这些孩子出生。因此，当乌拉诺斯阻止她分娩时，盖亚遭受了巨大的痛苦。最终，克洛诺斯帮助她报复乌拉诺斯，割掉了他的生殖器。从这片土地上，诞生了许多生物：厄里倪厄斯，巨人，灰树仙女（墨利艾），以及从大部分血肉中诞生的女神阿佛洛狄忒。最终，盖亚体内的孩子们出生了，成为泰坦布里阿瑞奥斯、科托斯和盖斯。\n\n#!神化效果：$economy_apotheosis_province_improvement_effect_tt_description$"
 omen_hecate_iphemide:0 "赫卡忒·艾菲迈德"
 omen_hecate_iphemide_desc:0 "$hecate_description$\n\n#Y 伊斐迈德#!：赫卡忒，这个名字在晚上对淘气的孩子们轻声耳语；神秘的女神，魔法与神秘的女神，光明与黑暗的女神，她在十字路口等待，在门外站立。在我们的土地上，我们称她为赫卡忒·伊斐迈德，记住那些不那么虔诚的信徒早已忘记的事迹。"
 omen_heraklean_targitaos:0 "赫拉克勒斯·塔尔吉塔俄斯"
 omen_heraklean_targitaos_desc:0 "$targitaos_description$\n\n#Y 赫拉克勒斯式#!：作为对神祇塔耳吉塔俄斯的希腊式诠释，他体现了多种文化的融合。我们王室血脉中希腊与斯基泰两位祖先的合力，将在战争中赋予我们无与伦比的力量。"
 omen_hestia:0 "赫斯提亚"
 omen_hestia_desc:0 "赫斯提亚是炉灶、家庭和国家秩序的处女女神，是泰坦克洛诺斯和瑞亚的长女。\n\n在希腊文化中，赫斯提亚通常在每次家庭祭祀中获得第一份祭品。\n\n在公共领域，普吕坦尼翁的炉灶是她的官方圣地，当一个新的殖民地建立时，会从母城的赫斯提亚公共炉灶带火焰到新定居点。"
 omen_hydaspes:0 "海达斯波斯"
 omen_hydaspes_desc:0 "海达斯波斯是海达斯波斯河（也称为杰赫勒姆河）的强大神祇。当亚历山大率军进攻印度时，波鲁斯王与他作战，神祇们也参与其中。在一部史诗中，海达斯波斯被描绘为与狄奥尼索斯作战，象征着波鲁斯与亚历山大的战斗。尽管这部史诗在公元五世纪出现，但海达斯波斯神祇的起源可能始于公元前一世纪。他是与同名河流相对应的神祇，也被称为般阐那陀神。"
 omen_hylaian_drakaina:0 "海拉克勒斯·德拉凯娜"
 omen_hylaian_drakaina_desc:0 "$drakaina_description$\n\n#Y 德拉凯娜#!：像希腊神话中的其他德拉凯娜一样，海拉克勒斯·德拉凯娜是半蛇半人的象征，代表着肥沃的大地。为了用希腊人的视角解释斯基泰的传统起源神话，希腊人用她来传达大地生下赫拉克勒斯的三个伟大儿子的想法，他们将去斯基泰的土地上繁衍生息。"
 omen_iason:0 "伊阿宋"
 omen_iason_desc:0 "伊阿宋是古希腊英雄，是阿尔戈英雄们的领袖。伊阿宋组建了一支由许多希腊英雄组成的船队，包括赫拉克勒斯、狄俄斯库里兄弟、阿尔戈斯、俄耳甫斯等许多著名人物。他们的目标是寻找传说中的金羊毛，因此展开了冒险之旅。首先他们来到利姆诺斯岛，在那里除了赫拉克勒斯外的所有人都与当地妇女有染，产生了一个新的种族——米尼亚人。接下来他们前往西兹库斯，在那里遭遇了地生巨人的突袭。然后，伊阿宋和阿尔戈英雄们继续航行，前往菲纽斯的宫廷，在那里他们被鹰身女妖袭击。最后，为了到达科尔基斯，他们穿过了危险的辛普列加德斯，这是一对会撞击任何通过它们的物体的巨石。最终，他们到达了科尔基斯，在那里他们必须面对埃厄忒斯和他的艰难试炼，以获得金羊毛。"
 omen_kronos:0 "克洛诺斯"
 omen_kronos_desc:0 "克洛诺斯是泰坦的领导者和最年轻的一代，天神乌拉诺斯（天空之父）和盖亚（大地之母）的神圣后代。他推翻了他的父亲，并在神话中的黄金时代统治，直到他被自己的儿子宙斯推翻并囚禁在塔尔塔罗斯。\n\n然而，根据柏拉图的说法，神祇福耳库斯、克洛诺斯和瑞亚是大洋神和忒提斯的长子。他通常被描绘为持有一把镰刀或短剑，这是他用来阉割和推翻他父亲乌拉诺斯的工具。\n\n由于名字的相似性，克洛诺斯在古代常常与时间之神克罗诺斯混淆或有意地被认为是同一神祇。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_leukothea:0 "琉科忒亚"
 omen_leukothea_desc:0 "勒乌科忒亚，或勒乌科托厄，是一位有许多不同起源神话的女神。在一个版本中，她是阿塔玛斯的王后，后来被称为伊诺。赫拉为了惩罚伊诺照顾新生的狄奥尼索斯，让她发疯。伊诺带着她的儿子墨里刻特斯跳入大海。出于怜悯，众神将他们变成了海神。伊诺变成了勒乌科忒亚，她的儿子变成了帕莱蒙。\n\n在罗得岛的一个神话版本中，涉及哈利亚，一位仙女（或次要女神）。她是泰坦塔拉萨和蓬托斯的女儿。哈利亚成为波塞冬的妻子，两人生下了六个儿子和女神罗得斯。然而，这些儿子拒绝让阿佛洛狄忒在他们的岛上登陆，因此她诅咒这些儿子，他们会性侵自己的母亲哈利亚。绝望之中，哈利亚投海自尽，变成了勒乌科忒亚。\n\n#!神化效果：$fertility_apotheosis_capital_effect_tt_description$"
 omen_luna:0 "卢娜"
 omen_luna_desc:0 "卢娜是月亮女神，太阳神索尔的妹妹。每天他在天空中行驶，每晚她紧随其后。\n\n据说她对她的情人恩底弥翁感情深厚，因此请求她的父亲朱庇特赋予他不朽、永恒的青春和永远的睡眠，以便她每晚都能探望他。\n\n卢娜并不总是一个独立的女神，有时只是一个专门化的女神称号，因为戴安娜和朱诺都被认为是月亮女神。"
 omen_orpheus:0 "俄耳甫斯"
 omen_orpheus_desc:0 "俄耳甫斯是传说中的希腊英雄，拥有超越凡人的音乐才华。他是卡利俄佩与色雷斯国王俄阿格洛斯之子，据说其竖琴由阿波罗亲自赐予。俄耳甫斯后来加入阿尔戈英雄，以自己的音乐与塞壬之歌相抗。归来后他娶了欧律狄刻，然而她死于蛇咬。俄耳甫斯悲痛欲绝，以音乐才能感动了哈得斯；哈得斯允许欧律狄刻回到生者世界，条件是她与俄耳甫斯离开冥界时都不得回头。俄耳甫斯几乎已经走到出口，却终究回头；然而欧律狄刻尚未走出冥界，随即又消失回了地下世界。"
 omen_phrixus:0 "普里克索斯"
 omen_phrixus_desc:0 "普里克索斯是玻奥提亚国王阿塔玛斯的儿子。他的母亲是云之女神涅斐勒。普里克索斯和他的双胞胎妹妹赫勒为了拯救玻奥提亚的作物，被要求作为祭品。继母伊诺（后来的女神勒乌科忒亚）憎恨他们，因此偷偷地烤了波奥蒂亚所有的谷物种子。农民们询问神谕出了什么事以及该怎么办，然而，被贿赂的使者谎称神谕要求献祭普里克索斯和赫勒。在他们即将被献祭之前，他们被一只游泳的金羊毛公羊救了。不幸的是，在公羊的旅行途中，赫勒掉了下来，被抛入了之后被称为赫勒斯滂的水域。与此同时，普里克索斯前往科尔基斯，受到了国王埃厄忒斯的热情接待，甚至与埃厄忒斯的女儿卡尔基奥佩结婚。他们的结合生下了阿尔戈斯、弗龙提斯、梅拉斯和西托索罗斯。"
 omen_prometheus:0 "普罗米修斯"
 omen_prometheus_desc:0 "普罗米修斯，希腊的火之泰坦。普罗米修斯因向人类赠送火的秘密而著名，他被视为人类的伟大神祇，不仅赋予他们火，还赋予了技术进步和文明的精髓。然而，因为他违抗了众神，普罗米修斯被永远惩罚。他被绑在科尔基斯边缘的一座山上的巨石上，每天都有一只鹰来啄食他的肝脏。每晚他的肝脏会重新生长，第二天再被鹰啄食。"
 omen_proserpina:0 "普洛塞庇娜"
 omen_proserpina_desc:0 "普洛塞庇娜是古罗马女神，她的崇拜、神话和神秘与早期罗马酒神自由女神的结合。在希腊，她被称为珀耳塞福涅，她的母亲是谷物和农业女神得墨忒耳。\n\n就像珀耳塞福涅被认为是得墨忒耳的女儿，普洛塞庇娜是得墨忒耳的罗马等同者刻瑞斯的女儿。\n\n像珀耳塞福涅一样，普洛塞庇娜与冥界及其统治者有关，作为冥界女王；与她的母亲刻瑞斯一起，与春天作物的生长和生命、死亡及重生的循环相关。\n\n#!神化效果：$fertility_apotheosis_food_effect_tt_description$"
 omen_saturn:0 "萨图恩"
 omen_saturn_desc:0 "萨图恩是繁衍、解体、富足、财富、农业、周期性更新和解放之神。萨图恩的神话统治被描绘为一个富足和平的黄金时代。在罗马征服希腊之后，他与希腊泰坦克洛诺斯混为一谈。\n\n萨图恩的配偶是他的妹妹奥普斯，他们生下了朱庇特、海王星、冥王星、朱诺、刻瑞斯和维斯塔。\n萨图恩特别在每年十二月的萨图恩节期间受到庆祝，这可能是最著名的罗马节日，期间有盛宴、角色互换、言论自由、送礼和狂欢。\n\n#!神化效果：$culture_apotheosis_capital_effect_tt_description$"
 omen_vesta:0 "维斯塔"
 omen_vesta_desc:0 "维斯塔是炉灶、家庭和国家秩序的处女女神，是泰坦萨图恩和奥普斯的长女。她很少被描绘成人形，通常以她在罗马广场的庙宇中的火焰来代表。\n\n只有她的女祭司，维斯塔贞女，才能进入她的庙宇，照顾庙宇中的圣火。作为罗马人民的守护神，她的节日维斯塔节（6月7-15日）被视为最重要的罗马节日之一。\n\n在维斯塔节期间，主妇们赤脚穿过城市，到女神的圣地，奉上食物供品。\n\n#!神化效果：$culture_apotheosis_assimilate_effect_tt_description$"
 omen_zeus_dacieus:0 "宙斯-德基乌斯"
 omen_zeus_dacieus_desc:0 "宙斯·德基乌斯在卡帕多西亚受到许多人崇拜，他的祭司是王国中第四重要的祭司。"

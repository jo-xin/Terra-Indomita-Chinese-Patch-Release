 thaton_start:0 "#T 直通#!\n难度：#Y 中等#!\n\n直通在本地孟语中被称为 #E Sadhuim#!，该词又源于Sudhammapura，一个印度-雅利安语词，意为 #E 「诸神之会」#!。萨杜因城邦至少建于公元前4世纪，并因与斯里兰卡的贸易而致富。这个王国，俗称 #E 直通王国#!，后来统一了大部分南孟地区并进入传说，最终被 #E 勃固王国#! 征服。从其建立到最终毁灭的悠久历史中，它留下了持久的文化遗产，永远铭刻在其最终信仰的传说中。"

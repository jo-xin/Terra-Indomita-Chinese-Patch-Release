 ingala_mod:0 "因加拉河谷"
 ingala_mod_desc:0 "至少从青铜时代早期起，因加拉河谷就在这片森林草原地带供养了大量人口。随着萨尔加特文化向原戈罗霍沃地区扩张，萨尔加特人继承了东乌拉尔的首府，利用丰饶的资源和湿地在整个斯基泰-西伯利亚地区繁衍生息并投射影响力。"
 jingug_start:0 "#T 辰国#!\n难度：#Y 简单#!\n\n$jingug_heritage_desc$"
 joseon_start:0 "#T 朝鲜#!\n难度：#Y 中等#!\n\n近两千年前，朝鲜王国由半神话的领袖檀君建立，她的人民从那时起便一直在为保住自己的所有而奋斗。近年来，与西方的燕国之间的冲突导致朝鲜将大片土地割让给了这个邻国，而来自北方和东方的部落入侵威胁仍然存在。"

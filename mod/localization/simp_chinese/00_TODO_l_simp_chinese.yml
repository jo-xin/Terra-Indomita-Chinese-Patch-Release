 startup_event.1.desc:0 "#E Terra Indomita#! 基于「Imperator: Invictus」开发，并完全整合了Invictus中的所有内容。Terra Indomita还使用了中国「天下之终」mod的地图及诸多其他资源，并加入了来自「Better UI」和「Full Mechanical Overhaul」的许多优秀功能。TI旨在成为一个 #R 独立模组#!，汇集了Imperator模组社区创作的所有精彩内容。\n\n#E Terra Indomita 开发者#!：Dementive、Shocky27、Zorgoball、Izn、Palando、Retcon Crisis、Licarious、Pureon、Nerdman3000、Pirosmani99、Stephan、OmegaCorps 和 MattTheLegoman\n\n感谢Invictus团队以及所有帮助过我们的人，排名不分先后。\n#E 开发者：#!\nSnowlet、Jphiloponus、Mike Bittersteel、Dementive、Erik Erik、Hannibal_theCannibal、OmegaCorps、Palando、Parcipal、Paulus、Sealionforever、Thymos、Torugu、Tudhaliya、Aerozona、Diskianterezh、gmb360、Idonea、IhateTrains、Olivenkranz、Shocky27、Stallone、Typhion\n#E 艺术家：#!\nAquizar、CrazyZombie、Fildez、Nerdman3000、RetconCrisis、MattTheLegoman、Kefír Úr\n#E 译者：#!\nApollon、Frank、Juanen、Julianus、Lemon、Pilar、Spikos、Vityviktor\n#E 贡献者：#!\nAgamidae、Arkerios、Ben4Peters、DaFoogle、Diego I de Persia、Dustin、Hexon、Kalen、MattTheLegoman、Nebular、Pardo、Presidentstorm、Prometheus、AtomicFission、Sobisonator、IsaacCat\n#E 测试者：#!\nAugustus_Caesar、bla、Brasidas、DDJR、FBI Agent、Jake_P、Jandoski、Lil_squindie、llamafanatic、Memer Nener、Pydras、Sav、Somebody、Trewajg、Tuko Tuko\n#E 学者：#!\nChehrazad、Derek、Felix Amiculus、Herodotus、INKRSN、Manny、QuietRustler、Sethos、Trarco\n#E 特别鸣谢：#!\nAgamidae——感谢他在无数场合帮助整个模组社区，并为所有人编写了大量代码。\nAquizar——感谢他允许我们使用他高质量的专业艺术作品。\nTerrapass——感谢他分享了如何让字体显示在树木之上的方法。\n\n"

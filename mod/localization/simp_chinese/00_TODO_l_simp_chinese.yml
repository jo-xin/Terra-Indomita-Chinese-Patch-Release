 white_tiger_mod_desc:0 "印度中部壮观的白色孟加拉虎，尤其发现于安巴洛达附近地区，是一种稀有而美丽的物种。这种动物无论是活体还是死体，都能以惊人的黄金价格卖给印度所有的国王和贵族。这些稀有的白虎是橙色孟加拉虎的变种，白色源自隐性基因。"

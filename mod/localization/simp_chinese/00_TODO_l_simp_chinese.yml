 punic_resurgence_12.a:0 "严加盯防那些滋事之徒"
 punic_resurgence_12.b:0 "我们对此事毫不在意"
 punic_resurgence_12_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，盟友之间偶有龃龉本是常事，但近来我们听闻联盟成员间的争执已渐趋尖锐。眼下有两位颇具魅力的领袖正借机招揽支持者，双方阵营彼此攻讦，慷慨陈词的公开演说更是屡见不鲜。\n\n想必您也明白，这等纷扰对[ROOT.GetCountry.GetAdjective]的政务实为妨害。"
 punic_resurgence_12_title:0 "盟友内讧"
 punic_resurgence_13.a:0 "哼，区区附庸，弃之何妨？然此番背盟，终究令人不悦。"
 punic_resurgence_13_desc:0 "我们已在[ROOT.GetCountry.GetCapital.GetName]接待信使，并获悉一则令人不快的消息——无论对方提出多么荒谬的借口，我们的布匿联盟终究失去了一位成员。"
 punic_resurgence_13_title:0 "我国退出联盟"
 punic_resurgence_16.a:0 "全军听令！必使来犯之敌，葬身海中！"
 punic_resurgence_16_desc:0 "[ROOT.GetCountry.GetRuler.GetName]，军情紧急——\n\n斥候为速报军情，所察未尽详实，然敌军确已登陆我境，兵力规模未明。（此刻将士士气本已低迷，此讯...暂不宜宣。）"
 punic_resurgence_16_title:0 "敌军已登陆！"
 qi_start:0 "#T 齐#!\n难度：#Y 中等#!\n\n在战国时代之初，三大强国凌驾于众国之上：秦、楚和齐。在过去数百年间，齐国在政治上方便时与各邻国结盟，又与前盟友交战，成功扩大了领土，尤其是围绕其都城临淄的领地。"
 qin_start:0 "#T 秦#!\n难度：#Y 简单#!\n\n当整个中国被战国时代的战火吞噬时，秦国正缓慢而坚定地开始主宰其邻国。凭借创新的法家改革而增强国力，并受到不屈不挠的尚武精神的鼓舞，秦站在了历史的悬崖之巅。"
 rice_terrace_mod:0 "梯田"
 rice_terrace_mod_desc:0 "数千年来，现代伊富高人的祖先一直在菲律宾科迪勒拉山脉的高山和谷地中耕作。虽然著名梯田的古远年代仍有争议（一些研究者声称可追溯到两千多年前），但毫无疑问，自南岛人群约四千年前到达以来，这里的人们一直种植稻米、芋头和其他作物。通过精湛的农业工程技能，在如此高海拔和边缘环境中生产作物的能力，确保了该地区的粮食稳定和丰饶。"

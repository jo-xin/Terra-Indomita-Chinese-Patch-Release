 dry_hills:0 "干旱丘陵"
 dry_hills_desc:0 "一片干燥荒凉的旷野，只有小型蜥蜴和奇异夜猎者的嚎声在此栖息。"
 dry_plains:0 "干旱平原"
 dry_plains_desc:0 "干热的风吹过尘土飞扬的丘陵；这里严酷无情，水源稀少。"
 ebony_mod:0 "乌木之林"
 ebony_mod_desc:0 "自埃及早期法老时代起，乌木便一直是来自苏丹和埃塞俄比亚广袤森林的珍贵贸易品。这种珍贵的深黑色硬木被用作珠宝、家具制作及其他装饰品。古埃及人还使用这种硬黑木来铭刻象形文字，其中一些可追溯至五千多年前。"
 enfeoffment_zhourites:0 "周礼分封制"
 enfeoffment_zhourites_desc:0 "我们商代先辈创立的治理制度，直到今天仍是统治人民的可行方式。通过建立庞大而分权的官僚国家，将土地与权威分授给强大的附庸，以换取臣服誓言，真正的和平便可获得保障。"
 enfeoffment_zhourites_ruler:0 "皇帝"
 enfeoffment_zhourites_ruler_female:0 "皇帝"
 engineer_cohort_taiga_combat_bonus:0 "工程兵大队针叶林战斗加成"
 esan_start:0 "#T 惠山#!\n难度：#Y 中等#!\n\n$esan_heritage_desc$"
 flavor_gaul.46.a:0 "敬奉前人是我们的责任"
 flavor_gaul.46.desc:0 "尽管代价高昂——确切地说是一百枚金币——[ROOT.GetCountry.GetRuler.GetName]仍坚持在敬奉祖先时必须遵行正当礼仪，无论花费多少。虽然这是我们最古老的宗教传统之一，但在艰难岁月里，我们未能尽到应尽之责；如今[ROOT.GetCountry.GetRuler.GetFirstName]终结了这种偏差。\n\n从今往后，再也不会偷工减料——我们将为先祖举行完整的献祭礼仪，以此彰显[ROOT.GetCountry.GetName]人民重燃的虔敬。"
 flavor_gaul.46.t:0 "祭拜先祖"
 flavor_gaul.47.a:0 "是的，一切都要按照传统准备。"
 flavor_gaul.47.b:0 "我们只是现在负担不起这个，在那里将不会有马车"
 flavor_gaul.47.desc:0 "随着对我们前任首领的哀悼的开始，[ROOT.GetCountry.GetRuler.GetName]已经被智者们和长老们悄悄接近,  他们坚持要求我们尊重我们的传统，给逝者一个[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]马车葬。这是一份巨大的荣耀，只给我们社会中最精英的人士保留，但是我们是否进行下一步完全取决于[ROOT.GetCountry.GetRuler.GetFirstName]。\n\n虽然当我们整个国家陷入悲伤的时候讨论财政问题是不愉快的，但牵涉马车葬的相关的费用高得吓人，而且[ROOT.GetCountry.GetRuler.GetFirstName]必须拍板同意与否。"
 flavor_gaul.47.t:0 "埋葬前的准备"
 flavor_gaul.48.a:0 "当我们铭记对死者的义务时，愿他们给我们祝福"
 flavor_gaul.48.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]外的几个小时车程处，有一支阴沉的队伍正在为我们最古老的传统之一做最后的准备; 文化精英的马车葬.\n\n各种各样的陪葬品都被放在地上——华丽的银质餐盘、金色的火炬和仪式性的毛皮斗篷、号角酒杯和镶有宝石的宴会托盘——作为必备的动物和奴隶在附近被献祭。一切都是按照严格的标准进行的，这些预兆表明，众神对我们对细节的关注非常满意.\n\n当最后一块泥土覆盖在马车之上时，大家肃然起敬地沉默了下来，每个人都一个接一个地转向[ROOT.GetCountry.GetRuler.GetName]，后者说了几句话"
 flavor_gaul.48.t:0 "马车葬"
 flavor_gaul.49.a:0 "如果敌人不吃敬酒，那就赏他们罚酒...."
 flavor_gaul.49.desc:0 "[ROOT.GetCountry.GetRuler.GetName] 以不容忍任何事务打扰到 [ROOT.GetCountry.GetRuler.GetHerHis] 完成而出名; 例如 [ROOT.GetCountry.GetRuler.GetFirstName] 所遇到的每一项军情,被迅速无情地处理，其效率可能被误认为冷酷无情 .\n\n对于那些注意到 [ROOT.GetCountry.GetRuler.GetFirstName] 是用政治贿赂的手段来转动国家机器的人运转来说毫不意外. 交出的每一袋白银，每一把金项链，都以一种不言而喻的威胁来达成交易。"
 flavor_gaul.49.t:0 "贿赂长老会"
 flavor_gaul.50.a:0 "我不应让你失望，但我会为特雷维里亚做一切事情。"
 flavor_gaul.50.desc:0 "虽然今天不是每个人都很满意——有些人竟然可笑地认为自己是更好的王位候选人——但一个重要的时刻正在我们面前；在我们长老和智者的注视下，[ROOT.GetCountry.GetRuler.GetName] 正在 [ROOT.GetCountry.GetCapital.GetName] 为今天晚些时候的加冕典礼进行净化仪式。几小时后太阳落山，仪式完成，我们将会有一个新的政府形式。\n\n虽然我们的人民以前从未被一个真正的君主统治过，但人们承认，现在终于有了。愿上天继续赐予 [ROOT.GetCountry.GetRuler.GetFirstName] 学问和才智，让我们的国家大步前进。"
 flavor_gaul.50.t:0 "君主的野心"
 flavor_gaul.51.a:0 "特雷维里亚万岁！"
 flavor_gaul.51.desc:0 "说到做到，我们的人民有很多值得骄傲的地方。我们不仅摧毁了包围我们的劣等部落，吸收了他们的力量和资源，而且我们已经开始创造一种真正值得尊重的文明。我们还推举了一众国王来统治我们，我们的工程师们驯服了野生的林地，建造了城市和宏伟的建筑，他们的聪明才智让人眼花缭乱。\n\n虽然人们自己已经做了很多事情来获得这些荣誉，但许多人承认，如果没有 [ROOT.GetCountry.GetRuler.GetName] ，我们就不会像现在这样进步，甚至连 [ROOT.GetCountry.GetRuler.GetFirstName] 的批评者也承认，我们有 [ROOT.GetCountry.GetRuler.GetHerHis] 的领导真是万幸。"
 flavor_gaul.51.t:0 "特雷维里亚的胜利"
 flavor_gaul.52.a:0 "让我们迁徙首都吧，我们没有理由呆在一块烂地上。"
 flavor_gaul.52.b:0 "我们不抛弃我们祖先的家乡"
 flavor_gaul.52.desc:0 "虽然[ROOT.GetCountry.GetCapital.GetName]确实很好地服务过我们的人民，但近来要求将首都迁往[GetProvince('(int32)3690').GetName]的呼声日益高涨。特雷韦里亚不仅有河流通道，这对经济繁荣至关重要，而且还位于平原之上，能为我们的人民留下未来扩张的空间。卡拉努斯卡附近的森林正在成为发展的阻碍，因为一切成本都更高。\n\n[ROOT.GetCountry.GetRuler.GetName]必须作出决定。"
 flavor_gaul.52.t:0 "特雷维里亚"
 flavor_gaul.53.a:0 "我将率领我们的军队战胜一切敌人！"
 flavor_gaul.53.desc:0 "文明国家在谈及高卢诸部时最畏惧#E 比利其#!，但终有一日，他们会明白最勇敢最凶悍的战士来自[ROOT.GetCountry.GetAdjective]征召兵。比利其人与我们相比又算什么？我们已经击碎他们优越的神话，并将他们赶回自己的村落与聚居地。"
 flavor_gaul.53.t:0 "特雷维里亚的比利时"

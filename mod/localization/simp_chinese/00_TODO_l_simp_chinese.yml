 chinese_duhufu:0 "都护府"
 chinese_duhufu_desc:0 "为妥善治理边远腹地，帝国设立名为“都护府”的特殊行政区，用以巩固远离都城之地的皇权。都护府长官拥有明确的军事与经济权威，并以统一号令执行上级命令。"
 chinese_empire:0 "中华帝国"
 chinese_empire_desc:0 "商、周两代的统治已向天下展示帝王权威的神圣性。帝制政体仍是政治生活的最高成就，只要天命的守护者勤勉尽责，便几乎能够确保治下的和平与繁荣。"
 chinese_flavor.3.desc:0 "V1.5 - 诞生之日\n新的任务树：\n- 粟特大型任务树，包含机制\n- 阿特罗帕特尼大型任务树\n- 象雄大型任务树\n- 波西斯大型任务树\n- 特雷维里大型任务树\n- 努拉吉人在统一地中海岛屿后（以吉姆内西亚人或撒丁人身份）的大型任务树\n- 撒马利亚大型任务树（犹太树重制版 + 自定义特色）\n- 2棵罗马征服雷蒂亚和潘诺尼亚的任务树\n- 克里特人区域统一任务树\n- 科基拉区域统一任务树\n- 吉姆内西亚人（巴利阿里群岛）区域统一任务树\n- 撒丁人区域统一任务树\n\n地图变更：\n- 将地图扩展至缅甸，包含完整图形\n- 添加濮文化组\n- 为濮文化组添加自定义城市模型\n- 更新缩小后的地图（湖泊看起来更好，马尔代夫现在显示为实际岛屿）\n- 更新了毛里塔尼亚国家设置，包含历史联盟\n- 在地图各处添加了以色列侨民人口\n- 在印度添加了历史少数族裔人口\n- 添加了历史蛮族文化\n- 在波罗的海添加了维尔提亚\n- 潘菲利亚现在属于希腊文化组（从安纳托利亚文化组移出）\n- 重新平衡了伊比利亚/意大利/北非的人口数量和少数族裔\n- 更改了地图上的一些贸易商品\n\n新增内容：\n- 重做了大国的叛乱系统，允许以一个标签发动全方位区域叛乱，有多种强度级别（您始终能够重新征服您的土地而无需承受巨大的侵略扩张惩罚，不再是多次小叛乱，如果条件满足，每个区域现在有一个大标签）\n- 添加了十几个通用事件\n- 添加了8个布匿事件\n- 添加了十几个耆那教事件\n- 潘诺尼亚、黎凡特、日耳曼、希腊、布匿、色雷斯和阿拉伯文化组的新（家族）命名\n- 添加了吐蕃/米底可成立国家\n- 添加了数十项特定文化（组）专属发明\n- 添加了……\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"
 chinese_tiger_mod:0 "华南虎"
 chinese_tiger_mod_desc:0 "华南虎是世界上最具标志性的野兽之一，令遇到它的人既敬畏又恐惧。虎在中国宗教和文化信仰中占有重要地位，而华南虎的虎皮与虎骨自古以来便是珍贵贸易品。宠物虎在中国和南方部落的宫廷中也备受尊崇，以幼崽形态被活体交易至亚洲各地的王室与贵族手中。"
 chinese_unification_wargoal:0 "中国统一"
 chinese_unification_wargoal_war_goal:0 "统一中国"
 chu_start:0 "#T 楚#!\n难度：#Y 困难#!\n\n楚国虽曾是一个强大而稳定的国家，令周边各国艳羡，但最近几十年间，腐败已不受遏制地在政府中蔓延。人民所受的苦难因低效而虚伪的领导层而加剧，这些领导层已使国家窒息，而糟糕的外交决策使楚国陷入孤立与猜忌之中。"

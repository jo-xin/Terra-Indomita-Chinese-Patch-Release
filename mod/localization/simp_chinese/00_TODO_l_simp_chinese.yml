 xishi_mod:0 "西施美人之庙"
 xishi_mod_desc:0 "传说中的西施，中国第一美人，生于诸暨，生活在公元前5世纪初。据说西施的美貌如此惊人，当她倚靠阳台俯瞰池中游鱼时，鱼儿竟被她的美貌迷得忘记游动，沉入水底。她被越国大夫范蠡发现，并被献给敌国吴国。吴王夫差为她神魂颠倒，为她和其他美人建造了一座巨大的庙宇。夫差不知道的是，大夫范蠡正与美人西施合谋进行历史上最早记载的美人计谍报行动之一——西施成功诱惑了国王，说服他处死了自己的谋士和最伟大的将军，并荒废国事，导致吴国不久后覆灭。数千年来，西施的惊人美貌一直激发着歌谣和故事的创作。"
 yamato_start:0 "#T 大和#!\n难度：#Y 中等#!\n\n遥远的东方坐落着倭岛，岛上被居住在其海岸的各部落瓜分割据。在倭岛生活可能很艰难；大和地区，一小片被起伏丘陵环绕的农田飞地，居住着一个坚韧勤劳的民族，他们为一切做好了准备。"

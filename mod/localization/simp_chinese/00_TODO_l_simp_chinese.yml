 me_macedon_1_legacy.132.desc:0 "后来被称为\"米拉萨条约\"的文件草稿没有浪费笔墨在正式的引言或华丽的辞藻上，没有向神灵祈求健康祝福——这表明此时双方关系已经恶化到了何种程度。\n\n条约中唯一的信息是简单的边界划分。"
 me_macedon_1_legacy.132.t:0 "米拉萨条约"
 me_roman_missions_inv.10.a:0 "伊利里亚战争……已然揭幕。"
 me_roman_missions_inv.10.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，今天早上我们收到了严峻的消息--背信弃义的#E 伊利里亚人#!向我们发动了进攻！他们的野蛮部落正在向我们进攻。他们野蛮的队伍已经开始行军，发誓要洗劫他们遇到的任何罗马城市--在他们有机会掠夺乡村之前，我们有必要在战场上迎击他们。\n\n我们希望这场冲突迅速结束，因为如果我们不小心，整个地区都有可能被引爆。"
 me_roman_missions_inv.10.t:0 "伊利里亚战争"
 me_roman_missions_inv.10.tt:0 "#E 伊利里亚人#! 已正式宣战！"
 me_roman_missions_inv.11.a:0 "此地必将成为罗马版图的绝佳补充！"
 me_roman_missions_inv.11.desc:0 "尽管当初有人反对[ROOT.GetCountry.GetRuler.GetName]派兵深入[GetProvince('(int32)4053').GetArea.GetRegion.GetName]地区的决定，但在此凯旋时刻，所有质疑者皆已鸦雀无声——毕竟，始终展现雄才大略的[ROOT.GetCountry.GetRuler.GetFirstName]，岂容凡人妄加揣度？\n\n此刻，当凯旋门在[GetProvince('(int32)1').GetName]巍然矗立，那些曾非议的舌辩之徒正噤声旁观，任酸涩的嫉妒扼住咽喉。这座永恒丰碑将铭刻[ROOT.GetCountry.GetRuler.GetFirstName]的圣明决断。[ROOT.GetCountry.GetName]荣光永耀！"
 me_roman_missions_inv.11.t:0 "征服蛮荒之地"
 me_roman_missions_inv.12.a:0 "告诉我们的使者们，让他们花所需的时间，并且要慷慨大方。"
 me_roman_missions_inv.12.b:0 "这是公务，不是度假——要保持专业。"
 me_roman_missions_inv.12.desc:0 "因为罗马人民重视友谊与和平胜过其他一切，我们决定派遣使者去见#E 伊利里亚人#!，寄希望于他们能够认识到自己迄今为止的错误行为。如果神灵保佑，他们愿意改正自己的行为，或许我们就可以避免敌对行动，但这完全取决于他们现在的决定。\n\n我们并不随意给予每个国家成为我们的#Y 仆从国#!的机会——他们应当慎重考虑后再作回应。"
 me_roman_missions_inv.12.t:0 "伊利里亚使团"
 me_roman_missions_inv.13.a:0 "拿出最好的酒来！如果有法勒尼安酒的话就拿出来！"
 me_roman_missions_inv.13.desc:0 "我们的外交官带来了好消息！伊利里亚人已经看到了成为我们仆从国的智慧，并同意和平地臣服。一切都如我们所愿，[ROOT.GetCountry.GetRuler.GetName]！我们应该今晚庆祝一番。"
 me_roman_missions_inv.13.t:0 "伊利里亚使团"
 me_roman_missions_inv.14.a:0 "嗯，他们毕竟是野蛮人……我们还能期待什么呢？"
 me_roman_missions_inv.14.desc:0 "听到伊利里亚人拒绝了我们的提议，这并不令人惊讶，因为大家都知道他们有多么愚昧。他们给自己的孩子和母亲带来了多么大的灾难啊！我们祈祷两国之间不要发生战争，因为那将是一场不公平的对决——我们会毫不犹豫地将他们彻底消灭。"
 me_roman_missions_inv.14.t:0 "伊利里亚使团"

 subject_focus:0 "附属国管理"
 subject_focus_1.a:0 "商业才是正道！"
 subject_focus_1.b:0 "也许这不是个好主意。"
 subject_focus_1_desc:0 "我国附属国的土地正适合经济发展。那里已有肥沃土地和勤劳人民，只要命令他们将可观才能集中用于改善地方经济，整个国家都会因此繁荣。"
 subject_focus_1_t:0 "商业重心"
 subject_focus_2.a:0 "我们需要更强大的军队！"
 subject_focus_2.b:0 "也许这不是个好主意。"
 subject_focus_2_desc:0 "众所周知，我国附属国的男子好斗易怒，无论挑衅真实与否，稍有风吹草动便愿意诉诸武力。既然如此，我们为何不利用这股怒火的源泉？附属国中的这些热血之徒会成为我国军队的强力补充……我们应训练这些年轻人，将其用于自己的需要，以免他们最终把攻击性转向国家。"
 subject_focus_2_t:0 "军事重心"
 subject_focus_3.a:0 "发展将带来繁荣！"
 subject_focus_3.b:0 "也许这不是个好主意。"
 subject_focus_3_desc:0 "我国附属国中温顺的居民最大的愿望，就是看到自己的领地在[SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip]霸权下繁荣起来；这也是我们共同的愿望。我们将给予他们祝福，允许他们专注内部发展，因为我们也会从满足而繁盛的民众中获益。"
 subject_focus_3_t:0 "发展重心"
 subject_focus_4.a:0 "索取赔偿是我们的特权"
 subject_focus_4.b:0 "也许这不是个好主意。"
 subject_focus_4_desc:0 "在与[SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip]的财政顾问进行广泛讨论后，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]决定，所有附属国都应提高每月向我们缴纳的贡赋。考虑到维持[SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip]领土所投入的惊人开支，让受益于我国仁慈的人民共同分担这些负担，自然也是理所当然。"
 subject_focus_4_t:0 "提高贡赋"
 subject_focus_5.a:0 "希望他们会喜欢我们"
 subject_focus_5.b:0 "也许这不是个好主意。"
 subject_focus_5_desc:0 "我们已经认定，[SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip]当前的局势并不令人满意；我国附属国的人民正缓慢受到[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]习俗影响。然而，这一进程并没有达到[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]所期望的速度。当然，我们可以……“建议”……加快这个过程，但这很可能带来无法完全控制的后果。我们该怎么办？"
 subject_focus_5_t:0 "加快整合"
 subject_focus_6.a:0 "好主意！"
 subject_focus_6.b:0 "真遗憾"
 subject_focus_6.c:0 "也许这不是个好主意。"
 subject_focus_6_desc:0 "为了确保正确的[SCOPE.GetRootScope.GetCountry.GetReligion.GetName]信仰与[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]习俗在我国全境得到接纳，我们可以命令附属国专注吸收我们的信念。无论如何，我们文化之间的差异只是名义上的；这应当是一个相对无痛的过程，并会惠及我们所有人……剩下的只是等待你下令。"
 subject_focus_6_t:0 "文化重心"
 subject_focus_6_tt:0 "我们没有以[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName|Y]为主流文化的附属国！"
 subject_focus_6_ttt:0 "我国所有附属国将获得以下修正："
 subject_focus_6_tttt:0 "所有与我国拥有相同文化或宗教的附属国将获得以下修正："
 subject_focus_8.a:0 "这样就能奏效"
 subject_focus_8.b:0 "要说的话，他们其实该付更多……"
 subject_focus_8_desc:0 "[SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip]的许多附属民建议我们放宽施加在他们身上的沉重税负。虽然[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]并不喜欢收入减少的想法，但[SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis]也明白这枚硬币有两面；这一姿态虽代价高昂，却最终会提高附属国的忠诚。此外，让他们的精英欠我们一个人情，也未必是什么坏事……"
 subject_focus_8_t:0 "提高的自治度"
 subject_focus_individual.1.a:0 "用礼物笼络他们"
 subject_focus_individual.1.b:0 "一小笔钱就够了"
 subject_focus_individual.1.c:0 "这太昂贵了"
 subject_focus_individual.1.desc:0 "我们注意到，[recipient.GetName]的人民很难适应新的政治现实；无论如何，他们迟早会学会，但眼下我们手中已有一场逐渐升级的忠诚危机。\n\n不出所料，有人建议我们分发一些财富，以提醒当地精英他们的忠诚应归于何处……驾驭国家之舟，向来代价不菲。你希望我们怎么做？"
 subject_focus_individual.1.t:0 "赐予礼物"
 subject_focus_individual.2.a:0 "商业重心"
 subject_focus_individual.2.b:0 "军事重心"
 subject_focus_individual.2.c:0 "发展重心"
 subject_focus_individual.2.d:0 "文化重心"
 subject_focus_individual.2.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]肩负的诸多职责之一，便是管理疆域内各省份和领土的内部事务。说来也简单；你下达命令，负责领土日常运作的官僚体系便会开始专注于你交给他们的具体任务。作为国家元首，我们有责任引导人民的精力；我们将按自己的意愿塑造土地的命运。[recipient.GetName]的人民应专注改善什么？"
 subject_focus_individual.2.e:0 "保持现状即可"
 subject_focus_individual.2.t:0 "更改[recipient.GetName]的重心"
 subject_focus_individual.3.a:0 "就这么办"
 subject_focus_individual.3.b:0 "也许这不是个好主意"
 subject_focus_individual.3.desc:0 "得益于[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]为该地区带来的和平与繁荣，[recipient.GetName]的贸易收入正在蓬勃增长。[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]武力的威势使商人阶层得以繁荣，因此我们有权从这些利润中分得一份。我们已经向[recipient.GetName]投入鲜血与财富；从他们的国库上层稍取一部分，是我们的权利。告知他们的领袖我们的期待。"
 subject_focus_individual.3.t:0 "转移贸易"
 subject_focus_individual.4.a:0 "我们将一同凯旋！"
 subject_focus_individual.4.b:0 "仔细想想，我们不需要他们"
 subject_focus_individual.4.desc:0 "即便在最好的时候，[recipient.GetName]的忠诚也值得怀疑，而当前的军事纠葛要求我们采取一些人眼中或许过激的措施。虽然他们起初不愿让士兵与我军并肩作战，但当另一种选择摆在面前时（就在枪尖上），[recipient.GetName]明智地决定派出人手。我们将一同诛杀敌人，至于他们的无礼，日后再说。"
 subject_focus_individual.4.t:0 "[recipient.GetNameWithNoTooltip]加入战争"
 subject_focus_individual.5.a:0 "太好了"
 subject_focus_individual.5.b:0 "暂且放过他们……"
 subject_focus_individual.5.desc:0 "为了恰当地了解生活在我国旗帜下的多样民众，我们决定将[recipient.GetName]的一些居民带到首都；我们真诚希望，假以时日，这些人会接纳[SCOPE.GetRootScope.GetCountry.GetPrimaryCulture.GetName]习俗。当然，或许会有些怨言，但无论发生什么，我们都已有准备。"
 subject_focus_individual.5.t:0 "[recipient.GetName]的人民"
 subject_focus_individual.6.a:0 "我们需要这些人"
 subject_focus_individual.6.b:0 "我们不需要这些蠢货"
 subject_focus_individual.6.desc:0 "这些话没法说得甜美动听；我们正面临人力危机，如果不加以处理，可能会失去一切。看来我们的军事顾问并未妥善规划我们将面对的后勤问题，如今可用战斗人员储备已低得惊人。\n\n尽管这违背惯例，我们仍可强迫[recipient.GetName]的男子加入我军——这将极不受欢迎，但我们在此事上别无多少选择。"
 subject_focus_individual.6.t:0 "强制征召"
 subject_focus_individual.9.tt:0 "[new_ruler_for_subject.GetName]将前往[recipient.GetName]，并尝试确立[new_ruler_for_subject.GetHerHim]作为统治者的地位；随后[new_ruler_for_subject.GetSheHe]会向我们回报结果。"
 subject_focus_individual_10_A_tt:0 "[recipient.GetName]将成为君主制国家。[recipient.GetName]的人民将选择具体的君主制类型。"
 subject_focus_individual_10_B_tt:0 "[recipient.GetName]将成为共和国。[recipient.GetName]的人民将选择具体的共和国类型。"
 subject_focus_individual_3_tt:0 "[recipient.GetName]将把宗教改为[SCOPE.GetRootScope.GetCountry.GetReligion.GetName]"

 SUBJECT_BESTOW_GIFTS_TT:0 "#T 赐予礼物#!\n这会提供多种选项，让我们向选定附属国馈赠礼物以提高其忠诚度。\n这会花费 #R 25#! 政治影响力，且每 #Y 2#! 年只能执行一次。"
 SUBJECT_DEMAND_TRIBUTE_TT:0 "#T 要求提高贡赋#!\n使附属国向我们缴纳的贡赋提高 #Y 20%#!，持续 #Y 5#! 年，但也会使所有附属国忠诚度降低 #R 15#!，对我国好感度降低 #R 20#!。\n这会花费 #R 75#! 政治影响力。\n\n（不能与提高自治同时进行）"
 SUBJECT_FORCE_CULTURE_TT:0 "#T 强制参战#!\n这会强制一个叛逆的非朝贡附属国加入我国所有战争。\n这会花费 #R 50#! 政治影响力；我们必须处于战争中，且每 #Y 2#! 年只能执行一次。"
 SUBJECT_FORCE_RELIGION_TT:0 "#T 转移贸易#!\n这会强制一个附属国在 #Y 5#! 年内将更大比例的贸易贡献给我国。 \n这会花费 #R 50#! 政治影响力，且每 #Y 5#! 年只能执行一次。"
 TAKE_SUBJECTS_MANPOWER_TT:0 "#T 征召士兵#!\n这会根据附属国规模从其处获得人力。\n这会花费 #R 50#! 政治影响力，且每 #Y 2#! 年只能执行一次。"

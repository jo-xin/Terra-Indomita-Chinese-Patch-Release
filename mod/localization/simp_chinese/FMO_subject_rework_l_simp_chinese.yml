l_simp_chinese:
 BRING_VASSAL_INTO_WAR_TT:0 "#T 召附属国参战#!\n对任意附属国使用，强制其加入我们当前参与的所有战争。\n这会花费 #R 50#! 政治影响力；我们必须处于战争中，且每 #Y 2#! 年只能执行一次。"
 CHANGE_ALL_SUBJECT_FOCUSES_TT:0 "#T 更改所有附属国重心#!\n将所有附属国的重心改为你选择的一种。"
 CHANGE_INDIVIDUAL_SUBJECTS_FOCUS_TT:0 "#T 更改单个附属国重心#!\n花费 #R 25#! 政治影响力，为单个附属国选择一种重心。"
 CHANGE_SUBJECT_FOCUS_COMMERCE_TT:0 "#T 将所有附属国重心改为商业#!\n这会使我国附属国的全局商业收入提高 #Y 10%#!，并在其首都增加 #Y 2#! 条贸易路线。\n\n花费取决于我们拥有多少附属国；附属国重心每 #Y 5#! 年只能更改一次。"
 CHANGE_SUBJECT_FOCUS_CULTURE_TT:0 "#T 将所有附属国重心改为文化#!\n这会使所有与我们主流文化相同的附属国同化和改宗速度提高 #Y 10%#!。\n\n花费取决于我们拥有多少附属国；附属国重心每 #Y 5#! 年只能更改一次。"
 CHANGE_SUBJECT_FOCUS_DEV_TT:0 "#T 将所有附属国重心改为发展#!\n这会使我国附属国人口增长提高 #Y 5%#!，并使建造花费和时间降低 #Y -10%#!。\n\n花费取决于我们拥有多少附属国；附属国重心每 #Y 5#! 年只能更改一次。"
 CHANGE_SUBJECT_FOCUS_MIL_TT:0 "#T 将所有附属国重心改为军事#!\n这会使我国附属国陆军士气提高 #Y 5%#!，人力提高 #Y 10%#!。\n\n花费取决于我们拥有多少附属国；附属国重心每 #Y 5#! 年只能更改一次。"
 CHANGE_TRIBAL_VASSAL_TO_CIVILIZED_TT:0 "#T 开化部落#!\n这会开始一个漫长过程，开化我国的一个#Y 部落附庸#!，可能改变其政体和附属国类型。\n这会花费 #R 100#! 政治影响力，且每 #Y 2#! 年只能执行一次。"
 CHANGE_VASSAL_TYPE_TT:0 "#T 更改附属国类型#!\n这会启动一项谋划，尝试将主流文化属于我国文化组的附属国改为#Y 藩属#!。\n这会花费 #R 100#! 政治影响力，且每 #Y 2#! 年只能执行一次。"
 CHARACTER_VIEW_SORT_BY_STATESMANSHIP_TOOLTIP:0 "按政治能力排序"
 CONTRIBUTE_TO_CAPITAL_TT:0 "#T 迁入首都#!\n这会强制一个附属国从其人口最多的领土向我国首都迁移至多 #Y 5#! 个人口。\n这会花费 #R 35#! 政治影响力，且每 #Y 2#! 年只能执行一次。"
 COUNTRY_CONCEPT_TOOLTIP:0 "[Country.GetNameWithNoTooltip][Country.GetGovernment.GetName]位于[Country.GetCapital.GetArea.GetRegion.GetName]区域，由[Country.GetRankName][Country.GetRuler.GetName]统治。\n\n他们对我国的好感为[Country.GetOpinionOf( Player.GetCountry )|+=]"
 DIPLOMATIC:0 "外交"
 FORCE_DYNASTY_ON_TO_THRONE_TT:0 "#T 扩张王朝#!\n这会启动一项谋划，将我国统治王朝的一名成员推上附属国王位。\n这会花费 #R 100#! 政治影响力，且每 #Y 2#! 年只能执行一次。"

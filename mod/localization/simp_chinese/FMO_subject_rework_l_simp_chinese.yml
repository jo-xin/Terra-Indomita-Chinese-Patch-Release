 INCREASE_SUBJECT_AUTONOMY_TT:0 "#T 提高自治#!\n使附属国向我们缴纳的贡赋降低 #Y 20%#!，持续 #Y 5#! 年，同时使所有附属国忠诚度和对我国好感度提高 #Y 10#!。\n这会花费 #R 50#! 政治影响力。\n\n（不能与提高贡赋同时进行）"

l_simp_chinese:
 ainu_religion:0 "富吉特信仰"
 austronesian_religion:0 "杜昆信仰"
 baiyue_religions:0 "百越信仰"
 charvaka:0 "顺世论"
 chinese_religions:0 "华夏信仰"
 christianity:0 "基督教"
 confucian:0 "儒教"
 convert_to_austronesian_religion_desc:0 "我国各地的巫师杜昆长期声称能听见来自尘世之外的低语，而近来这些低语已化作震耳欲聋的喧嚣。自称汉图的幽灵之灵宣称能在彼方世界中提供指引与庇护。许多人呼吁我们放弃祖先的灵性实践，转而崇拜这些神秘灵体。"
 convert_to_charvaka:0 "采纳顺世论原则"
 convert_to_charvaka_desc:0 "对诸神本身的质疑已在我国都城扎根。来世是否值得期待，抑或这一切都只是凡人的愚妄？顺世论民众已有自己的答案；我们是否也该舍弃诸神，转而遵循顺世论的原则？"
 convert_to_confucian:0 "采纳儒家教义"
 convert_to_confucian_desc:0 "儒家的教诲根植于社会和谐、孝道与贤德统治的原则，如今已进入我国民众的心中。我们是否应正式采纳儒家伦理，并接受它所提供的道德准绳，作为国家的指导哲学？"
 convert_to_elamite_pantheon:0 "接纳胡姆班神系"
 convert_to_elamite_pantheon_desc:0 "曾令苏美尔与阿卡德诸民畏惧的诸神，以安善的胡姆班和苏萨的因舒希纳克为首，如今已进入我国民众的心中。现在我们要问：是否应将埃兰人的宗教接纳为我国国教？"
 convert_to_funan_religion:0 "接纳雍灵信仰"
 convert_to_funan_religion_desc:0 "扶南之灵诱引着我们的人民。都城中已有许多人开始敬奉这些“雍”。这些雍代表着我们周遭的自然世界，显然深受民众欢迎。国家是否应接纳这些雍灵信仰，仍有待决定。"
 convert_to_masto_pantheon:0 "接纳马斯托信仰"
 convert_to_masto_pantheon_desc:0 "马斯托神及其强大的兄弟姐妹给我国留下了深刻印象。一些人甚至开始寻求占格里巫师的灵性联系。我们也可以将达尔德人的宗教接纳为我国信仰。"
 convert_to_mohism:0 "采纳墨家教义"
 convert_to_mohism_desc:0 "人应当像关爱自己一样关爱他人。这是墨子的教诲。墨家强调兼爱之德，并反对不必要的冲突，如今已在我国扎根。随着民众日益接受这些原则，一个问题随之出现：我们是否应正式采纳墨家教义，作为国家的指导哲学？"
 convert_to_nivkh_religion:0 "接纳伊兹信仰"
 convert_to_nivkh_religion_desc:0 "这些被称为伊兹的“主人”如今正对我们说话。它们召唤着我们的人民，而人民也开始将它们接纳入心。有些人甚至声称自己能够与狐狸合一，并化为狐形。我们应将伊兹信仰接纳为我国信仰。"
 convert_to_okinawa_religion:0 "接纳乌纳里克信仰"
 convert_to_okinawa_religion_desc:0 "被称作琉球的群岛上，妇女们讲述着奇异灵体与神圣讯息。神人女子说她们能够保护善良、仁慈而公正的男人。女性保护男性的想法在许多人听来颇为陌生，却也自有吸引力。我们是否应接纳御姐妹神的道路，改宗乌纳里克信仰？"
 convert_to_satsana_phi:0 "采纳萨沙纳披"
 convert_to_satsana_phi_desc:0 "萨沙纳披被称为精灵之宗教。披信仰已开始在我国传播，使人民接触到傣人的超自然精灵与神祇。或许我们应将披信仰采纳为自己的宗教，并接纳萨沙纳披之道。"
 convert_to_tai_religion:0 "接纳麽教"
 convert_to_tai_religion_desc:0 "壮人的宗教麽教在我国已颇受欢迎。若我们选择接纳天神佈洛陀及东部傣文化中显赫的神系，佈洛陀便可庇佑我们的国家。"
 convert_to_taoism:0 "追随道"
 convert_to_taoism_desc:0 "在我国幽静的角落里，道教教义已找到立足之地，为存在之奥秘提供深邃洞见。当宇宙之道的低语渗入社会各阶层时，我们面临一个关键问题：是否应全心接纳道教智慧，将其作为国家的引路明灯，引导我们走上一条理解与安宁的独特道路？"
 convert_to_tunguistic_religion:0 "采纳通古斯萨满教"
 convert_to_tunguistic_religion_desc:0 "阿布卡恩都里的灵召唤着我们的人民，将他们引入通古斯萨满教的神秘魅力之中。随着国民日益回应这神圣召唤并接纳这些古老信仰，女性也开始成为萨满，一个问题自然出现：我们是否应正式采纳萨满教作为国家的指导性灵性传统，与包围我们存在的神秘力量建立更深联系？"
 convert_to_uralic_pantheon:0 "采纳伊尔马里克信仰"
 convert_to_uralic_pantheon_desc:0 "至高天空之神伊尔马已被我们许多人采纳。他们述说第一缕曙光的鲜艳光芒和最后一抹阳光的震耳欲聾的黑暗。从芬兰人到乌戈尔人，再到我们，光芒闪耀。现在是时候拉开国家的帷幕，采纳伊尔马里克宗教了。"
 desc_ainu_religion:0 "绳文人的富吉特信仰认为万物皆具卡穆伊，从海中之鱼到猎鱼之人皆然。凡灵中有卡穆伊者，在死后都应受到尊重，否则便会面对卡穆伊自身的惩罚。"
 desc_austronesian_religion:0 "杜昆信仰源自苏门答腊、马来西亚与印度尼西亚的杜昆。他们与萨满的概念十分相近，能够沟通灵体。这些灵体被称为“汉图”，与哈尼图和阿尼托同源；不过在杜昆信仰中，汉图更近似鬼魂，而非神祇。"
 desc_baiyue_religions:0 "百越的宗教教义揭示出，我们周遭世界中的一切，从自群山流入沼泽的浩荡溪流，到构成河岸的岩石与砾石，皆有灵魂且值得崇拜，如此宇宙方能维持和谐状态。"
 desc_charvaka:0 "顺世论，或称查尔瓦卡，也称路伽耶陀，是一种与阿耆维迦、佛教和耆那教类似的沙门信仰。在成为正式思想学派之前，顺世论通常指否认来世存在的观念。这是顺世论的核心，因此它也是最容易被辨认为“无神论”的信仰，可与现代的虚无主义相比。顺世论在7世纪迎来复兴，使其延续至12世纪才逐渐消散。"
 desc_chinese_religions:0 "中国幅员辽阔，诸多哲思与传统交织成丰富的精神图景。孔夫子等先贤的教诲受到尊奉，地方宗族的古老礼仪也延续不绝。祖先享有祭祀，守护家宅与炉火的灵祇则接受供奉，以安抚其难测的神意。"
 desc_christianity:0 "基督教是一套由犹太教师拿撒勒人耶稣创立的宗教信仰体系，后来由他所拣选的追随者传播到世界各地。基督教会兴起于犹地亚，最初是犹太教内部的一个教派。使徒们作为耶稣门徒中的领袖，踏上旅途分享“福音”，宣告耶稣就是预言中的弥赛亚、独一真神之子；他藉复活战胜死亡，并将在荣耀中再临，审判生者与死者。基督教信徒在天国中新而永恒的生命应许中找到希望，并得以免受永恒沉沦。"
 desc_confucian:0 "儒教，又称儒家或士人之学，深受孔子教诲影响。它强调道德端正、孝道与贤德品格的培养，并将这些视为和谐生活与文化繁荣的根本原则。"
 desc_elamite_pantheon:0 "胡姆班神系是古老的埃兰神系，早在伊朗诸族占据当地之前，便已存在于加喜特人、巴比伦人以及埃兰人自身的时代。此时期该宗教最重要的神祇是胡姆班，他在波斯尤具影响力。古老的胡姆班信仰凭借从波斯到迪尔蒙的影响继续存在。"
 desc_funan_religion:0 "雍灵信仰相信“雍”的存在，它们是灵体或神圣存在。这些雍也被称为婆罗。雍灵信仰充满了前神系时代的灵体，以及萨满与泛灵观念。与相关的那提克信仰相似，雍灵信仰从环境、祖先和日常物件中汲取灵感，并将其视为更高存在的来源。"
 desc_hu_religions:0 "大草原上的生活可能十分艰辛，其人民的宗教关注日常生活的实际事务，避开形而上的奥秘，转而敬重可见可察的现实；太阳、月亮、苍天和可敬的祖先都值得崇奉。"
 desc_manichaeism:0 "摩尼教传授了一种精心设计的二元宇宙论，描述了善良的、精神的光明世界与邪恶的、物质的黑暗世界之间的斗争。通过一个发生在人类历史上的持续过程，光逐渐从物质世界中消失，并返回到光的世界，它从哪里来。其信仰以美索不达米亚当地的宗教运动和诺斯替主义为基础。"
 desc_masto_pantheon:0 "马斯托信仰是达尔德人的宗教。他们崇敬马斯托神、他的十二位马斯托兄弟和九位杜拉加姐妹。马斯托信仰也融合了萨满与自然崇拜，尤其体现在能沟通灵体与神祇的占格里巫师身上。它很可能早于印度的吠陀信仰；不过也可能出现更晚。总体而言，它混合了印度-伊朗与印度-雅利安源流，形成了独一无二的信仰。"
 desc_mohism:0 "墨家，又称墨教或墨子之学，是源自墨子教诲的哲学传统。它强调兼爱与对所有人的无差别关怀，主张以社会和谐与伦理行为作为公正社会的基础，同时推崇功利与务实伦理的理想。"
 desc_nivkh_religion:0 "伊兹，或称伊兹根，是尼夫赫人的灵体与神祇。伊兹一词字面意为“主人”，尼夫赫人认为海洋、山脉、河流和熊都有各自的“主人”。尼夫赫人相信动物具有超自然本质，甚至认为某些人能够变成狐狸。在伊兹信仰中，尼夫赫人与环境及其中动物之间的关系密不可分。"
 desc_okinawa_religion:0 "乌纳里克源自 Unarigari 一词，意为“神圣姐妹”或“女祭司神”。这是因为神人传统的缘故；祝女是首席女祭司神人，而 Yata 则是女性萨满与灵媒。该宗教与富吉特信仰有遥远关联，同时也吸收了弥生古道和福尔摩沙哈尼图信仰的影响。"
 desc_pinoy_religion:0 "阿尼托是菲律宾群岛的灵体。这些岛屿上混合多样的信仰，形成了一种不同于台湾、婆罗洲、苏门答腊、马来西亚和越南等南岛亲族的独特信仰。群岛内每一种文化都相信自己的一套阿尼托。"
 desc_satsana_phi_religion:0 "披信仰，又称萨沙纳披和班披，是一种泛灵信仰体系，后来发展为复杂的神祇网络。它后续受到印度教影响；在这个时代，披信仰尚未经历完全的印度化。披信仰的神系充满了“披”，亦即精灵；任何祖先在十四代之后都可成为披。"
 desc_tai_religion:0 "傣人的宗教麽教认为，宇宙由天界雷神雅、至高龙王恩威格，以及人类创造者佈洛陀共同创造。佈洛陀在其配偶姆洛霞普的帮助下，创造了五位山之子女，全人类皆由此而来。"
 desc_taiwan_religion:0 "福尔摩沙的哈尼图信仰是一个极其多样的神系，包含众多不同信念。哈尼图信仰中有许多不同名称与灵体，共同构成了太平洋各地南岛民族发源地的信仰。"
 desc_taoism:0 "道教，又称道家或道之学，是一条深植于古代中国思想的深邃哲学道路。它以道的概念为核心，即永恒而流转不息的道路，主张顺应宇宙自然节律以达成和谐生活。道教鼓励朴素、自发与内在平衡的培养，并将其视为有意义人生的关键。"
 desc_tunguistic_religion:0 "萨满教如今虽是较宽泛的概念，但“萨满”一词源自通古斯语；因此，没有哪一种萨满教比通古斯人更有资格宣称这一名称。恩都里诸灵的萨满最崇敬阿布卡恩都里，即创造万有的天母。"
 desc_uralic_pantheon:0 "伊尔玛信仰代表了芬乌文化群体的宗教体系。它包含大量文化与信仰体系，皆围绕着主神伊尔玛展开，伊尔玛几乎在所有芬乌文化中都受到崇拜。除此之外，伊尔玛信仰还强调昼夜天空之光——月亮与太阳的重要性。"
 desc_wa_religions:0 "佤人所崇拜的诸灵直接反映了他们所处的暴烈世界；一个万物有灵的神鬼体系支配着他们，其中争斗不休的恶灵与神祇只有以合格祭品之血才能解渴。佤人铭记古老道路，并忠实维护它们。"
 desc_yi_religions:0 "彝人的宗教实践与周边诸民相似，但也有鲜明标志使其教义区别于邻人。对龙的崇敬极为重要，因为唯有龙拥有保障收成、保护村庄免受疾病与不幸侵扰的权威。"
 elamite_pantheon:0 "胡姆班神系"

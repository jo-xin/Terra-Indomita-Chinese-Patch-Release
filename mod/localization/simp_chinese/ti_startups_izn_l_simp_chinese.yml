 japan_startup.a:0 "大和是不可避免的。"
 japan_startup.b:0 "绳文人将会归来。"
 japan_startup.c:0 "变革之风正在吹来。"
 japan_startup.d:0 "好像我们在乎大陆似的。"
 japan_startup_desc:0 "[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]岛曾是众多[GetCulture('dewa').GetCultureGroup.GetName|Y]部落的家园。然而，自#E 绳文时代#!后期以来，来自[GetProvince('(int32)9285').GetArea.GetRegion.GetName|E]的[GetCulture('wa').GetCultureGroup.GetName|Y]移民在人口、生产和建设上开始超越[GetCulture('dewa').GetCultureGroup.GetName|Y]。\n\n如今，[GetCulture('wa').GetCultureGroup.GetName|Y]发展的下一阶段——#E 弥生时代#!已经来临。纷争不断的[GetCulture('wa').GetCultureGroup.GetName|Y]部落将开始集中为正式的王国。其中一个部落将成长为所有[GetCulture('wa').GetCultureGroup.GetName|Y]人的代名词。它的王朝将持续数千年，经历无数战争，并将定义何谓#E 日本人#!。然而此刻，[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]的部落和血脉尚未迈出通往这辉煌遗产的第一步。\n\n留在[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]的[GetCulture('dewa').GetCultureGroup.GetName|Y]部落，被称为#E 后绳文#!，盘踞在该岛北部，而[GetCulture('duuchuu').GetName|Y]则在#E 熊袭#!以南的岛屿上。他们不会轻易放弃对其祖传家园的剩余自治权。相反，他们可能寻求收复失地，开创一个全新的#E 后绳文时代#!。与此同时，[GetProvince('(int32)9328').GetName|E]周边的[GetCulture('wa').GetName|Y]部落，以及更远处的[GetCulture('kumaso').GetName|Y]和[GetCulture('aduma').GetName|Y]部落，仍然对[GetProvince('(int32)9328').GetArea.GetRegion.GetName|E]的霸权构成威胁。他们会乐于...他们会乐于扭转命运，将自己的传奇写入史册。\\n\\n#E #R 日出之国#!#!的命运尚未决定。谁将征服#E 弥生时代#!？"
 japan_startup_title:0 "弥生时代"
 japan_startup_tt:0 "愿神祇对我们展露微笑……"
 japan_startup_tt_2:0 "愿神威对我们展露微笑……"
 japane_startup_tt_3:0 "愿我们的努鲁对我们展露微笑……"
 mon_kingdoms.a:0 "勃固必胜！"
 mon_kingdoms.b:0 "萨杜因至上！"
 mon_kingdoms.c:0 "乌通依旧至尊！"
 mon_kingdoms.d:0 "第四势力将会崛起。"
 mon_kingdoms_desc:0 "[GetCulture('mon').GetName|Y]人是一个庞大的族群，居住于东南亚沿海地区。深受高度文明富裕邻邦的贸易影响，[GetProvince('(int32)9797').GetArea.GetRegion.GetName|E]和[GetProvince('(int32)9815').GetArea.GetRegion.GetName|E]的一些[GetCulture('mon').GetName|Y]人发展成了强大的贸易王国。\n\n在西方，[GetCountry('PEG')GetName|E]王国以其首都[GetProvince('(int32)9800').GetName|E]命名，在#E 伊洛瓦底江#!河口蓬勃发展。他们最终将成为该地区文明的最高巅峰。东边坐落着[GetProvince('(int32)9797').GetName|E]城及其[GetCountry('THT')GetName|E]王国，它将继续统一南部[GetCulture('mon').GetName|Y]人，并作为第一个成功的[GetCulture('mon').GetName|Y]王国名垂千古。最后，[GetCountry('SHE')GetName|E]王国，其首都[GetProvince('(int32)9815').GetName|E]终将被视为#E 佛教#!的黄金摇篮，其人民有朝一日将孕育出占主导地位的#E 陀罗钵地#!文化，在山川交汇之处繁荣昌盛。\n\n这三个王国日后都将皈依#E 大乘佛教#!，并为[GetCulture('mon').GetName|Y]人以及未来居住于此的人民留下持久的文化遗产。三个[GetCulture('mon').GetName|Y]王国的传说始于这个古老的时代。推动[GetCulture('mon').GetName|Y]文化遗产的命运进入史册吧！"
 mon_kingdoms_title:0 "孟人王国"
 mon_kingdoms_tt:0 "孟人的遗产在我们手中……"

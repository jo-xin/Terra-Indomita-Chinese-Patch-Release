l_simp_chinese:
 achaemenid:0 "阿契美尼德的血脉"
 achaemenid_desc:0 "阿契美尼斯是阿契美尼德王朝的神话创始人，其后代包括居鲁士二世大帝和大流士一世等国王。该王朝统一并统治了历史上最大的波斯帝国。\n\n#G 该特质可通过母系或父系传承。#!"
 agathocles:0 "阿伽托克勒斯的血脉"
 agathocles_desc:0 "阿伽托克勒斯是叙拉古的希腊僭主和西西里的国王。他是一位天生的雇佣军领袖，尽管为了达到目的不惧残酷，但他后来展现出了温和且受欢迎的一面。\n\n#G 该特质可通过母系或父系传承。#!"
 agiad:0 "阿吉斯的血脉"
 agiad_desc:0 "斯巴达国王阿吉斯一世是阿吉亚德王朝的奠基者，也是伟大的列奥尼达的祖先。阿吉亚德家族可以把自己的血脉一直追溯到强大的赫拉克勒斯本人。\n\n#G 该特质可以通过母系或父系传承。#!"
 anagami:0 "阿那含"
 anagami_desc:0 "继续依正思维精进勤修。得贪、嗔、身见、戒取、疑五下分结尽断，不复再起，不还此世。则得阿那含果。"
 arhat:0 "阿罗汉"
 arhat_desc:0 "断除色界、无色界诸念；断无明结、骄慢结；具足四谛智慧，断一切烦恼。则得阿罗汉果。"
 arsaces:0 "阿尔沙克的血脉"
 arsaces_desc:0 "阿尔沙克一世是帕提亚的第一位国王，同时也是帕提亚阿尔萨息王朝的创立者。他花费统治时期巩固其在地区的统治，并成功阻止了塞琉古帝国重新征服帕提亚的努力。到他去世时，阿尔沙克已经奠定了一个强大国家的基础，这个国家最终将演变成一个帝国。\n\n#G 该特质可通过母系或父系传承。#!"
 ashokalegendary:0 "阿育王"
 ashokalegendary_desc:0 "阿育王被认为是印度最伟大的皇帝之一，他将旃陀罗笈多的帝国扩展至西起塞琉古王朝、东至印度支那的广阔疆域。他因阿育王石柱和敕令而名垂青史。"
 atropates:0 "阿特罗帕忒斯的血脉"
 atropates_desc:0 "阿特罗帕忒斯是一名服务于大流士三世，然后又效力于亚历山大大帝的波斯贵族。拒绝向继业者们表示效忠后，他最终建立了一个以其名字命名的独立王国和王朝。\n\n#G 该特质可通过母系或父系传承。#!"
 barca:0 "巴卡的血脉"
 barca_desc:0 "巴卡家族是迦太基统治寡头中的一员。许多家族成员是军事指挥官，也是罗马共和国的劲敌。\n\n#G 该特质可通过母系或父系传承。#!"
 blood_of_aratus:0 "阿拉图斯的血脉"
 blood_of_aratus_desc:0 "阿拉图斯是一位无与伦比的杰出将军和政治家，他主宰了亚该亚同盟，带领人民度过了一个充满动荡和阴谋的危险时代。\n\n#G 此特质将由 [CHARACTER.GetPraenomen]的后代继承。#!"
 blood_of_arhan:0 "阿尔汉的血脉"
 blood_of_arhan_desc:0 "阿尔汉王子是一个半神话的战士后裔，他曾周游世界，建立了许多王朝和王国。"
 blood_of_bharata:0 "婆罗多的血脉"
 blood_of_bharata_desc:0 "在《摩诃婆罗多》中，沙恭达拉的儿子婆罗多在六岁时就已出现，当他和他的母亲出现在杜什亚塔的宫廷时，后者否认与他们的关系，并称女性常擅长撒谎，因此假装忘记他们以避免在大臣和公众面前尴尬。沙恭达拉愤怒地离开。突然，一个神圣的声音在法庭上响起，命令杜什亚塔承认沙恭达拉和婆罗多。婆罗多继承了他的父亲成为国王，并以其无与伦比的力量征服了世界。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 blood_of_pharnavazid:0 "法尔纳瓦兹的血脉"
 blood_of_pharnavazid_desc:0 "法尔纳瓦兹推翻了他的前任阿佐，并夺取了伊比利亚王国，从而改变了历史进程。在接下来的六十五年里，法尔纳瓦兹通过一系列改革彻底改变了社会，使国家在他统治结束时比以前更加强大，全面革新了官僚机构并在整个王国范围内建造了一系列令人印象深刻的防御工事。法尔纳瓦兹家族在格鲁吉亚历史上占有特殊的地位，被认为是《格鲁吉亚编年史》中的第一代国王。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 blood_of_porus:0 "波罗斯的血脉"
 blood_of_porus_desc:0 "尽管波罗斯国王在海达斯佩斯战役（公元前326年）中未能成功抵抗亚历山大大帝，但他仍被认为是一位技艺超群的战士。战役后，被波罗斯的表现所打动的亚历山大不仅恢复了他的总督地位，还授予他东南方向直到希发西斯河的土地统治权。"
 blood_of_vijaya:0 "毗阇耶的血脉"
 blood_of_vijaya_desc:0 "许多年前，毗阇耶王子被驱逐出奥里萨，带着数百名追随者航行至楞伽岛，在那里建立了檀巴潘尼王国。"
 blood_of_zipoetes:0 "齐波厄忒斯的血脉"
 blood_of_zipoetes_desc:0 "你的血管中流淌着比提尼亚强大国王齐波厄忒斯的血统，他能够与继业者们抗衡，尽管周围环绕着极其强大的敌人，却从未被征服。除了作为一名著名的战士和将军外，齐波厄忒斯还因资助其领地内的众多建筑工程而闻名；既是一位出色的建造者，也是一位毁灭者。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 brennus:0 "布壬努斯的血脉"
 brennus_desc:0 "布壬努斯是塞农人的酋长。他在阿利亚战役中击败了罗马人。公元前387年，他率领山南的高卢人攻击了罗马，占领了城市大部，将其持续占据了数月。\n\n#G 该特质可通过母系或父系传承。#!"
 chandraguptalegendary:0 "旃陀罗笈多·孔雀"
 chandraguptalegendary_desc:0 "旃陀罗笈多·孔雀在印度次大陆建立了有史以来最庞大的帝国之一。他推行了一系列重大的经济和政治改革，建立了强大的中央行政体系。帝国修建了灌溉设施、神庙、矿场和道路等基础设施，带来了强大的经济。"
 chera:0 "掣罗的血脉"
 chera_desc:0 "公元前几个世纪，由于香料，特别是黑胡椒的交易，希腊人和罗马人（他们在早期印度文献中称为耶槃那人）对掣罗地区有所了解。与中东、印度和希腊-罗马商人的香料交换使掣罗家族富裕了几代。"
 chola:0 "朱罗的血脉"
 chola_desc:0 "传说中的国王卡里坎是小德干和安得拉家族所称的乔拉或科达的共同祖先。在乔拉王朝时期，税收管理、村庄自治和灌溉高度组织化。乔拉王朝战胜了邻国，并成功抵御了孔雀帝国。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 claudii:0 "克劳狄的血脉"
 claudii_desc:0 "克劳狄家族的第一位成员是萨宾人，名叫阿提乌斯·克劳苏斯。他在罗马共和国成立第六年，即罗马与萨宾人冲突期间，带着他的随从抵达罗马。克劳苏斯寻求和平解决方案，但当他的努力失败后，他叛逃到罗马，带来了不少于五百名能够持械的男子。\n\n#G 该特质可通过母系或父系传承。#!"
 comradely:0 "团结一致"
 comradely_desc:0 "一个值得信赖的、坚定的人，一个可能会像照顾自己的背部一样照顾你的人。"
 cornelii:0 "科耳涅利的血脉"
 cornelii_desc:0 "科尼利家族是罗马最伟大的贵族世家之一，其历史可追溯至罗马共和国早期，为后者贡献了许多著名的政治家。科尼利家族被列为“大族”之一，这些家族数百年来主宰了罗马共和政体的官职。\n\n#G 该特质可通过母系或父系传承。#!"
 demosthenid:0 "德摩斯梯尼的血脉"
 demosthenid_desc:0 "这个家族与著名的雅典演说家有亲缘关系，这位演说家曾为捍卫雅典的伟大理想对抗菲利普大帝的暴政，并站在反对斯巴达人的伟大将军一边。\n\n#G 该特质可通过母系或父系传承。#!"
 dido:0 "狄多的血脉"
 dido_desc:0 "狄多，又称艾丽莎女王，是一位神话中的腓尼基公主，迦太基的创始人。逃离推罗后，她来到巴巴里海岸，并与当地柏柏尔国王谈判，获得了建立迦太基城的土地。这座城市在其统治下繁荣起来，成为古代地中海地区一个强大且有影响力的贸易中心。然而，在被她的爱人埃涅阿斯抛弃后，她在葬礼柴堆上自刎，同时也杀死了未出生的孩子。在临终之际，狄多诅咒埃涅阿斯及其子孙将永远与她创建的城市为敌。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 diodotus:0 "狄奥多特的血脉"
 diodotus_desc:0 "“狄奥多特，拥有千城的巴克特里亚总督，反叛并自立为王；其他东方人民也纷纷效仿，脱离了马其顿人的统治。”\n——马库斯·尤尼乌斯·贾斯廷努斯·弗隆提努斯\n\n#G 该特质可通过母系或父系传承。#!"
 dishonored_pharaoh:0 "亵渎的法老"
 dishonored_pharaoh_desc:0 "法老不尊重埃及人民的传统，被认为不适合统治。"
 eighth_born:0 "第八子"
 eighth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 eleventh_born:0 "第十一子"
 eleventh_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 fabii:0 "法比的血脉"
 fabii_desc:0 "在罗马建立之初，罗慕路斯和雷穆斯兄弟的追随者分别被称为昆克提利家族和法比家族。据说兄弟俩曾在帕拉提诺山脚下的卢帕卡尔洞穴中献祭，这成为了卢帕尔卡利亚节的起源。这个故事无疑与两个卢帕尔奇学院以这些古老家族命名的传统有关。\n\n#G 该特质可通过母系或父系传承。#!"
 fifteenth_born:0 "第十五子"
 fifteenth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 fifth_born:0 "第五子"
 fifth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 first_born:0 "长嗣"
 first_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 fourteenth_born:0 "第十四子"
 fourteenth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 fourth_born:0 "第四子"
 fourth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 gallus:0 "阉祭官"
 gallus_desc:0 "该角色以伟大女神库柏勒的配偶阿提斯之名阉割了自己。这一切值得吗？"
 gladiator:0 "角斗士"
 gladiator_desc:0 "[CHARACTER.GetPraenomen]愿意与任何摆在[CHARACTER.GetHerHim]面前的人或事物战斗。"
 great_builder:0 "伟大的建筑师"
 great_builder_desc:0 "该角色拥有建造宏伟纪念碑的经验。"
 hannonid:0 "汉诺尼德"
 hannonid_desc:0 "虽然马戈尼德家族数百年来一直主导着迦太基的政治，但他们并非毫无争议地控制着这座伟大的城市；他们的对手，新兴的汉诺尼德家族，公开挑战他们对迦太基的统治。虽然他们在元老院的支持十分强大，但汉诺尼德家族被指责为潜在的僭主，这无疑是因为他们为了达到政治目的愿意曲解规则。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 horseman_cultist:0 "色雷斯骑兵崇拜者"
 horseman_cultist_desc:0 "色雷斯骑士崇拜比其他两种崇拜都要新，主要是在罗马时代引入的。色雷斯骑士来自东方的达契亚人和色雷斯人的土地，通常是葬礼仪式的一部分。"
 illyrius:0 "伊利里俄斯的血脉"
 illyrius_desc:0 "伊利里俄斯是卡德摩斯与哈耳摩尼亚最年幼的儿子，后来统治伊利里亚，并成为全体伊利里亚人的同名祖先。他的子女则把自己的名字赋予了最大的伊利里亚部落。\n\n#G 该特质可以通过母系或父系传承。#!"
 kalinga:0 "羯陵伽的血脉"
 kalinga_desc:0 "羯陵伽在古代经文中被称为勇敢的羯陵伽。公元前3世纪，希腊大使麦加斯特尼斯在他的印度之旅中提到，羯陵伽军队拥有约十万兵力，包括六万士兵、一千七百匹马和数千头大象。羯陵伽同样拥有强大的海军力量。羯陵伽的强大军力引起了摩揭陀帝国的嫉妒。据史学家记载，摩揭陀皇帝阿育王于公元前261年入侵羯陵伽。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 magonid:0 "马戈尼德"
 magonid_desc:0 "作为迦太基最为古老显赫的贵族家族之一，马戈尼德家族曾带领骄傲的迦太基城达到军事上的巅峰，征服了周边岛屿，并使迦太基走上了统治东地中海的道路。“马戈尼德”之名已成为政治权力和掌握复杂宫廷阴谋艺术的代名词。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 mahout:0 "驭象师"
 mahout_desc:0 "驭象师是骑象高手，他们在控制这些巨大动物方面无与伦比，能够从座骑上引导出几乎任何行为。"
 maurya:0 "旃陀罗笈多的血脉"
 maurya_desc:0 "旃陀罗笈多·孔雀在印度次大陆建立了有史以来最大的帝国之一。他通过一系列重大的经济和政治改革，建立了一个强大的中央行政体系。帝国建设了灌溉、寺庙、矿山和道路等基础设施，从而促进了强劲的经济发展。\n\n#G 该特质可通过母系或父系传承。#!"
 meditating:0 "冥想"
 meditating_desc:0 "该角色正在冥想，希望通过掌控内心的混沌来解开宇宙的奥秘。"
 mithridates:0 "米特里达梯的血脉"
 mithridates_desc:0 "米特里达梯家族是一个古老的波斯贵族家庭，有许多政治联系。他们声称自己是波斯伟大皇帝大流士和居鲁士的后裔。\n\n#G 该特质可通过母系或父系传承。#!"
 ninth_born:0 "第九子"
 ninth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 orontid:0 "俄容蒂德的血脉"
 orontid_desc:0 "俄容蒂德王朝是亚美尼亚国王俄容特斯一世及其后的索菲尼和米底总督俄容特斯一世的后裔。俄容蒂德家族成员统治亚美尼亚，先是作为米底和阿契美尼德帝国的附庸国王或总督，随后在阿契美尼德帝国崩溃后建立了独立王国，最终成为索菲尼的国王。\n\n#G 该特质可通过母系或父系传承。#!"
 pandya:0 "般帝耶的血脉"
 pandya_desc:0 "般帝耶国王被称为贾塔瓦曼或马拉瓦曼。从耆那教徒转变为湿婆信徒（崇拜《阿伽密》中的神灵湿婆），他们在最早的泰米尔诗歌中受到颂扬。般帝耶王朝促进了其首都马杜赖的桑加姆时期泰米尔文学的发展。此外，般帝耶还以其遍布世界，从罗马到中国的贸易网络而闻名。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 paradox:0 "阴暗的性格"
 paradox_desc:0 "可能是某个奇怪的邪教组织的成员……"
 personal_deity_buddha:0 "佛陀护佑"
 personal_deity_buddha_desc:0 "佛陀是佛教信仰的创立者。佛陀的思想仍在我们对吠陀的信仰中占据重要地位。"
 personal_deity_ganga:0 "恒伽护佑"
 personal_deity_ganga_desc:0 "恒伽是神圣恒河的女神，她带来净化和救赎。"
 personal_deity_kartikeya:0 "迦絺吉夜护佑"
 personal_deity_kartikeya_desc:0 "迦絺吉夜，又称室建陀、拘摩罗、牟娄犍、摩诃犀那、山穆卡和苏婆罗摩若，是印度教的战神。"
 personal_deity_krishna:0 "奎师那护佑"
 personal_deity_krishna_desc:0 "毗湿奴的黑肤第八化身将以爱和同情祝福我们人民，引领他们走上圣洁的道路。"
 personal_deity_murugan:0 "牟娄犍护佑"
 personal_deity_murugan_desc:0 "牟娄犍，坐在蓝色孔雀上的红色神祇，他永远年轻，光彩照人，作为泰米尔人的宠儿，他将带领我们的人民走向胜利！"
 personal_deity_shakti:0 "沙克谛护佑"
 personal_deity_shakti_desc:0 "沙克谛是力量和动能的女神。"
 personal_deity_shiva:0 "湿婆护佑"
 personal_deity_shiva_desc:0 "湿婆是毁灭再生之神，也是舞蹈之神。"
 personal_deity_surya:0 "苏利耶护佑"
 personal_deity_surya_desc:0 "苏利耶是太阳、勇气和意志之神。"
 personal_deity_vishnu:0 "毗湿奴护佑"
 personal_deity_vishnu_desc:0 "毗湿奴是无处不在的维护世界之神。"
 pharaoh:0 "法老"
 pharaoh_desc:0 "作为每个神庙的大祭司，法老的职能是在地上代表诸神。为了尊敬神灵，法老负责建造神庙和举行神圣的仪式。法老与太阳神拉直接相关，法老拥有的权力基本上是没有限制的。"
 pirate_cultist:0 "海盗崇拜"
 pirate_cultist_desc:0 "随着伊利里亚人开始征服海洋，一个新的海盗崇拜形成了。海盗崇拜体现了不仅仅是亚得里亚海，而是整个地中海的海盗精神。对我来说，这是海盗的生活！"
 pyrrhuslegendary:0 "伊庇鲁斯的皮洛士"
 pyrrhuslegendary_desc:0 "皮洛士是亚历山大大帝的表弟、伊庇鲁斯国王，属埃阿喀得斯王族。皮洛士是早期罗马最强大的对手之一。他被认为是他那个时代最伟大的军事统帅之一，仅次于亚历山大大帝。"
 sakadagami:0 "斯陀含"
 sakadagami_desc:0 "依正思惟所得正见断恶修善，持戒、布施，贪、嗔、痴三毒薄。则得斯陀含果。"
 samyaksambodhi:0 "三藐三菩提"
 samyaksambodhi_desc:0 "三世诸佛，依般若波罗蜜多故，得阿耨多罗三藐三菩提。"
 second_born:0 "次子"
 second_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 serpent_cultist:0 "蛇形崇拜者"
 serpent_cultist_desc:0 "蛇崇拜在伊利里亚南部地区很普遍，也最受欢迎。蛇被认为是肥沃和强大的象征。蛇崇拜还以制作装饰品、雕刻品和建造描绘蛇的图腾而闻名。"
 seventh_born:0 "第七子"
 seventh_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 sixth_born:0 "第六子"
 sixth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 sophytid:0 "索费忒斯的血脉"
 sophytid_desc:0 "“接下来，亚历山大对索费忒斯统治下的城市展开了一场战役。这些城市治理得非常好。这个国家的所有职能都致力于获得良好的声誉，而美丽在这里比任何东西都更被重视。他们的国王索费忒斯不仅英俊而且身高出众，超过四腕尺。他离开自己的首都城市，将自己和他的王国交给了亚历山大，但由于征服者的仁慈，他又得到了王国。索费忒斯以极大的热情慷慨地款待了整个军队数日。”\n——狄奥多罗斯·西库卢斯\n\n#G 该特质可通过母系或父系传承。#!"
 sotapanna:0 "须陀洹"
 sotapanna_desc:0 "通过证得须陀洹果——通往觉悟的第一阶段，[CHARACTER.GetPraenomen]已成为“入流者”，迈出了通向更高境界的最初步伐。"
 spartocid:0 "斯巴尔托科斯的血脉"
 spartocid_desc:0 "斯巴尔托科斯一世是与俄德律西亚王国统治者有关的雇佣军队长。受雇于博斯普鲁斯海峡的潘提卡皮翁僭主阿尔凯安纳克提斯国王，斯巴尔托科斯凭借卓越的军事才能和战略眼光逐渐扩大了自己的影响力，并赢得了部下的忠诚。最终，他对阿尔凯安纳克提斯家族发动政变，夺取了潘提卡皮翁，并建立了斯巴尔托科斯王朝。在其三个世纪的统治期间，斯巴尔托科斯王朝从围绕科尔奇半岛的少数松散连接的城市扩展成为一个能够抵御斯基泰人扩张的真正的希腊王国。\n\n#G 此特质将由[CHARACTER.GetPraenomen]的后代继承。#!"
 sun_cultist:0 "太阳崇拜者"
 sun_cultist_desc:0 "太阳崇拜认为太阳本身就是一种神灵。太阳受到崇敬，被认为是在动物，特别是水禽体内。太阳教的部分传统是在山顶上燃烧篝火。太阳崇拜在北方的伊利里亚人中最为普遍。"
 superbus:0 "塔克文的血脉"
 superbus_desc:0 "塔克文家族是古代罗马诸王的后裔；或许不久之后，他们就会崛起，夺回本就属于他们的一切。\n\n#G 此特质可通过母系或父系传承。#!"
 tenth_born:0 "第十子"
 tenth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 third_born:0 "第三子"
 third_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 thirteenth_born:0 "第十三子"
 thirteenth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 twelfth_born:0 "第十二子"
 twelfth_born_desc:0 "[CHARACTER.GetName]乃是王室的合法成员！"
 vercingetorix:0 "凯尔提卢斯的血脉"
 vercingetorix_desc:0 "凯尔提洛斯家族是阿维尔尼的名门；预言称他们之中终有一人将带领整个高卢走向伟大！\n\n#G 此特质可通过母系或父系传承。#!"
 wolf_cultist:0 "狼崇拜者"
 wolf_cultist_desc:0 "狼崇拜是梅萨皮安当地信仰与意大利部落崇拜狼的传统融合。狼被认为是神圣而强大的，著名的是罗马人崇拜母狼作为罗马创建者罗穆路斯和瑞穆斯的养母。"
 zadok:0 "撒督的血脉"
 zadok_desc:0 "撒督在大卫王和所罗门王统治期间担任大祭司。他在大卫王的儿子押沙龙叛乱时帮助了大卫王，并在所罗门王登基过程中发挥了重要作用，还主持了所罗门王的加冕典礼。在所罗门王建造耶路撒冷第一圣殿之后，撒督成为在那里服务的第一位大祭司。\n\n#G 该特质可通过母系或父系传承。#!"

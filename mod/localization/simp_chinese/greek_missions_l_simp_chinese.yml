 befriend_governor_of_alalia_tt:0 "#Y 我们的统治者必须是#! #T 阿拉利亚总督#!的#T 朋友#!。"
 desc_masiliot_cheaper_slaves_cost:0 "我们正在集中力量殖民科西嘉，因为岛的西半部人口稀少。"
 final_masiliot_modifier_hurray_mod:0 "大市场"
 final_masiliot_modifier_hurray_mod_desc:0 "一个宏伟的市场，可能是西地中海最大的市场，已在我们的首都建成。"
 form_phokaean_league_claims_tooltip:0 "获得对所有福西亚殖民地的宣称。"

 greek_1_10:0 "格提斯海岸"
 greek_1_10_DESC:0 "$greek_1_7_DESC$"
 greek_1_11:0 "黑海巡逻"
 greek_1_11_DESC:0 "如果我们要充分利用黑海的商业，我们必须确保它对商人和旅行者来说是相对安全的。"
 greek_1_11_allow_tt:0 "一个由#Y [gm_family_head_1.GetFamilyDisplayAdjective]#!家族的海军上将领导的拥有至少#Y 30#!艘利布尔尼船的海军。"
 greek_1_11_reward_tt:0 "任命的海军上将将获得#G 15#!忠诚@loyalty_icon!和一个海军奖励的选择。"
 greek_1_12:0 "麦加拉的梦想"
 greek_1_12_DESC:0 "$greek_1_13_DESC$"
 greek_1_12_reward_tt:0 "$greek_1_13_reward_tt$"
 greek_1_13:0 "米利西亚的梦想"
 greek_1_13_DESC:0 "黑海的几乎整个希腊存在都源于我们几百年的商人和殖民者。我们应该收回仅仅存在于我们的努力之下的东西。"
 greek_1_13_reward_tt:0 "公民将在每个收复的领土上定居。"
 greek_1_14:0 "野蛮人的交易"
 greek_1_14_DESC:0 "和平扩展贸易机会是古老的希腊传统，确实并不总是需要依靠长矛和盾牌来进入市场。"
 greek_1_14_allow_tt_1:0 "#Y [gm_1_greek_scope.GetRulerTitle] [gm_1_greek_scope.GetRuler.GetPraenomen]#!拥有至少#Y 6#!魅力@oratory_icon!"
 greek_1_14_allow_tt_2:0 "在控制范围内的任何黑海港口都由非#Y $hellenic$#!国家拥有，我们与之和平且对我们的看法超过#R -50#!。"
 greek_1_14_reward_tt:0 "可以从非$hellenic$国家购买一个黑海港口。"
 greek_1_15:0 "根除海盗"
 greek_1_15_DESC:0 "保护我们的贸易路线和公民利益的唯一方法是结束那些掠夺他们努力成果的海盗流浪汉。"
 greek_1_15_allow_tt:0 "在黑海附近没有由非属国控制的#Y 海盗据点#!。 (目前：#R [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_unowned_target')|0]#!)\n$greek_1_haven_tt$"
 greek_1_16:0 "牧羊海盗"
 greek_1_16_DESC:0 "消除海盗不一定是血腥的任务，毕竟他们只是为了财富，可能愿意在适当的激励下离开。"
 greek_1_16_allow_tt:0 "在黑海拥有至少3个#Y 海盗据点#!。 ([SCOPE.Custom('gre_mission_1_haven_3_custom_loc')]/#Y [SCOPE.ScriptValue('gre_mis_1_haven_target_3')|0]#!)\n$greek_1_haven_tt$"
 greek_1_16_reward_tt:0 "黑海地区的海盗据点将获得补偿，迁往世界其他区域。"
 greek_1_17:0 "掌控海盗"
 greek_1_17_DESC:0 "我们的商人看待海盗的方式是错误的；如果能加以利用，他们将是我们门口的一笔丰富的经验丰富的水手资源。"
 greek_1_17_allow_tt:0 "在黑海拥有所有且至少3个#Y 海盗据点#!，这些据点不由属国控制。 ([SCOPE.Custom('gre_mission_1_haven_all_custom_loc')]/#Y [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_all_target')|0]#!)\n$greek_1_haven_tt$"
 greek_1_18:0 "[SCOPE.Custom('skythoi_security_title')]安全"
 greek_1_18_DESC:0 "我们的经济依赖于在黑海海岸周围维护贸易站，但野蛮人的内陆不需要直接统治。确保一个盟友来防御对手部落将对我们有利。"
 greek_1_18_allow_tt_1:0 "一个结盟的部落国家在#Y $scythia$#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $taurica_region$#!、#Y $scythia_region$#!或#Y $sarmatia_asiatica_region$#!地区。"
 greek_1_18_allow_tt_2:0 "一个结盟的部落国家在#Y $anatolian$#!或#Y $caucasian$#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $bithynia_region$#!、#Y $galatia_region$#!、#Y $cappadocia_region$#!、#Y $colchis_region$#!、#Y $armenia_region$#!或#Y $albania_region$#!地区。"
 greek_1_19:0 "马伊奥蒂安的野心"
 greek_1_19_DESC:0 "黑海的最偏远部分位于辛梅里亚‑博斯普鲁斯和迈俄提斯沼泽以外——在那里等待着塔纳伊斯的贸易站，具有异国情调的斯基泰人魅力。"
 greek_1_19_allow_tt:0 "[gm_1_greek_scope.GetName]拥有#Y [GetProvince('(int32)4557').GetName]#!，其：\n * 拥有#Y 城市#!地位\n * 主要文化属于#Y $hellenic$#!群体\n * 拥有#Y $temple_building$#!\n * 没有正在进行的建设\n * 拥有至少#Y 10#!人口\n * 奴隶@slaves!人口比例少于#Y 33%#!\n * 部落民@tribesmen!人口比例少于#Y 33%#!"
 greek_1_2:0 "阿尔戈船的避风港"
 greek_1_2_DESC:0 "赫拉克勒斯和伊阿宋的神话显示了这些土地从黑暗的过去走了多远，我们可以通过创造一个与任何西方枢纽媲美的文化堡垒，将它们带得更远。"
 greek_1_2_allow_tt:0 "拥有一个黑海港口，其：\n * 拥有#Y 城市#!地位\n * 主要文化属于#Y $hellenic$#!群体\n * 具有至少#Y 40#!文明值\n * 具有#Y 市场#!\n * 没有正在进行的建设\n * 拥有至少#Y 20#!人口\n * 奴隶@slaves!人口比例少于#Y 33%#!\n * 部落民@tribesmen!人口比例少于#Y 33%#!"
 greek_1_2_reward_tt1:0 "[me_gre_1_argo_scope.GetName]的城市将获得定居者和一个永久奖励的选择。"
 greek_1_2_reward_tt2:0 "人口最多的相关城市将获得定居者和一个永久奖励的选择。"
 greek_1_3:0 "确保牛的通道"
 greek_1_3_DESC:0 "宙斯的情人伊俄在此化作牛形渡海至亚洲，由此孕育了赫拉克勒斯一脉，故此地得名博斯普鲁斯海峡。这条海峡掌控着该地区大部分贸易往来，若能掌控此地，必将带来巨大利益。"
 greek_1_3_allow_tt:0 "上述领土中至少有一个：\n * 拥有#Y 城市#!地位\n * 拥有至少#Y 2个#!要塞"
 greek_1_3_reward_tt:0 "最大的相关领土将获得奖励和定居者。"
 greek_1_4:0 "我们的海"
 greek_1_4_DESC:0 "虽然我们可能无法直接进入富裕的西方港口，但通过确保我们在黑海的东方贸易控制中获得全面利益，我们仍然可以收获很多。"
 greek_1_4_allow_tt:0 "拥有至少#Y 10#!个具有#Y $hellenic$#!文化的黑海港口。([SCOPE.Custom('gre_mission_1_4_custom_loc')]/#Y 10#!)"
 greek_1_5:0 "接近殖民地"
 greek_1_5_DESC:0 "我们的希腊同胞分裂，争夺他们的小贸易联系和地方出口。我们必须说服他们有更大的梦想，并帮助所有北方希腊人的事业。"
 greek_1_5_allow_tt:0 "黑海沿岸存在任何拥有少于#Y 5#!领土的自由希腊国家。"
 greek_1_5_reward_tt:0 "可能获得一个希腊藩属。"
 greek_1_6:0 "希腊人的收复"
 greek_1_6_DESC:0 "希腊殖民者在黑海的命运起伏不定，被迁徙的野蛮部落四面围困。我们应该恢复其中一个旧的避风港。"
 greek_1_6_allow_tt:0 "征服一个被非希腊人占据的黑海历史上属于希腊的港口。\n\n#Y 地图上标出了可能的目标。#!"
 greek_1_6_reward_tt:0 "领土可能被解放为藩属。"
 greek_1_7:0 "比提尼亚海岸"
 greek_1_7_DESC:0 "如果我们要确保对竞争对手的霸权，我们必须寻找新的市场并扩大我们的影响力到海的另一部分。"
 greek_1_7_reward_tt:0 "这些领土的国家将获得奖励。"
 greek_1_8:0 "破解克尔索内索斯"
 greek_1_8_DESC:0 "$greek_1_7_DESC$"
 greek_1_9:0 "埃厄忒斯的花园"
 greek_1_9_DESC:0 "$greek_1_7_DESC$"
 greek_1_black_sea:0 "好客之海"
 greek_1_black_sea_BUTTON_TOOLTIP:0 "北方的希腊人需要领导。"
 greek_1_black_sea_CRITERIA_DESCRIPTION:0 "建立一个黑海霸权。"
 greek_1_black_sea_DESCRIPTION:0 "过去一百年的事件证明，如果黑海的散居殖民地要在继业者、外国效仿者和野蛮人的崛起中生存，他们必须自愿或被迫联合起来。"
 greek_1_black_sea_REWARD_DESCRIPTION:0 "控制和复兴黑海的希腊殖民地。"
 greek_1_haven_tt:0 "\n#Y 海盗据点#!可以在外交、贸易路线、贸易商品、野蛮力量和地区地图模式中看到。"
 greek_1_loyalty_reward_tt:0 "每个#Y [gm_family_head_1.GetFamilyDisplayAdjective]#!家族成员将获得#G 10#!忠诚@loyalty_icon!。"
 greek_2_1:0 "希腊人的霸主"
 greek_2_10:0 "提洛同盟的抱负"
 greek_2_10_DESC:0 "雅典人支配希腊的模式避免了公开的冲突和暴力，专注于通过贸易赢得盟友的支持，并团结起来抵御外部威胁。"
 greek_2_10_allow_tt:0 "[gm_2_greek_scope.GetName]拥有至少#Y 6#!个$hellenic$#Y 朝贡国#!为非寡头的#Y 共和制#!，且这些朝贡国拥有至少一座港口。"
 greek_2_11:0 "拉栖代梦的构思"
 greek_2_11_DESC:0 "斯巴达加强对希腊控制的模式避开了外交和商业，专注于以武力夺取城市，并建立由驻军支持的友好政府。"
 greek_2_11_allow_tt:0 "[gm_2_greek_scope.GetName]拥有至少#Y 6#!个$hellenic$#Y 藩属#!为#Y 寡头共和制#!或#Y 君主制#!。"
 greek_2_12:0 "[gm_2_greek_scope.GetAdjective]帝国"
 greek_2_12_DESC:0 "只有当所有希腊人都在一个共同的政府下团结起来时，她才能真正保卫自己免受东西方崛起的威胁。"
 greek_2_12_allow_tt:0 "#Y $greece_region$#!地区和#Y $thessaly_area$#!省份的整个区域（不包括#Y $epirus_area$#!和#Y $crete_area$#!区域）由[gm_2_greek_scope.GetName]或它的附属国控制。"
 greek_2_12_reward_tt:0 "[gm_2_greek_scope.GetName]将获得希腊附近的希腊地区的#Y 宣称#!。"
 greek_2_12_reward_tt_1:0 "希腊的所有$hellenic$朝贡国将成为藩属。\n[gm_2_greek_scope.GetName]将决定如何统治希腊。"
 greek_2_12_reward_tt_2:0 "希腊的所有$hellenic$藩属将被#Y 兼并#!。\n[gm_2_greek_scope.GetName]将决定如何统治希腊。"
 greek_2_13:0 "希腊的解放者"
 greek_2_13_DESC:0 "只有当希腊的边界得到保护并收回失去的财产时，我们的心灵才能得到安宁。希腊人不再生活在马其顿的阴影中，就像帖撒利亚人长期忍受的那样。"
 greek_2_13_allow_tt_1:0 "希腊的#Y $greece_region$#!地区或#Y $thessaly_area$#!省份（不包括#Y $epirus_area$#!和#Y $crete_area$#!区域）中没有任何领土被继业者王国、外国入侵者或其附属国控制。"
 greek_2_13_allow_tt_2:0 "[gm_2_greek_scope.GetName]或其属国已从上述国家重新征服了一个领土。"
 greek_2_13_reward_tt:0 "$me_greek_2_20_op_tt$"
 greek_2_14:0 "打击马其顿"
 greek_2_14_DESC:0 "希腊人多次遭受马其顿野蛮人的入侵，现在是时候让他们尝尝我们的长矛了。"
 greek_2_14_allow_tt:0 "[gm_2_greek_scope.GetName]拥有或占领了#Y [GetProvince('(int32)428').GetName].#!"
 greek_2_14_reward_tt:0 "希腊地区的希腊宗教国家对[gm_2_greek_scope.GetName]的好感度增加#G 50#!\n所有继业者对[gm_2_greek_scope.GetName]的好感度降低#R 50#!。"
 greek_2_15:0 "泛希腊征兵"
 greek_2_15_DESC:0 "我们将明确表示，无论士兵的原籍城市如何，[gm_2_greek_scope.GetName]的军队将欢迎任何准备对抗希腊敌人并保护其边界的希腊志愿者。"
 greek_2_15_allow_tt:0 "[gm_2_greek_scope.GetName]拥有至少#Y 1#!个具有#Y 寡头共和制#!或#Y 君主制#!政体的$hellenic$#Y 藩属#!。"
 greek_2_15_reward_tt:0 "所有具有非寡头共和制政府的$hellenic$朝贡国将失去收入和对[gm_2_greek_scope.GetName]的忠诚。"
 greek_2_16:0 "标准化措施"
 greek_2_16_DESC:0 "雅典在德利亚同盟中的领导地位极大地受益于鼓励一个标准的度量衡系统，以促进贸易并增加他们对周边地区的影响。"
 greek_2_16_allow_tt:0 "[gm_2_greek_scope.GetName]拥有至少#Y 1#!个具有非寡头#Y 共和制#!政府的$hellenic$#Y 朝贡国#!，且该国家至少拥有一个港口。"
 greek_2_16_mod_tt:0 "所有$hellenic$藩属将获得奖励。"
 greek_2_16_reward_tt:0 "所有具有君主制或寡头共和制政体的$hellenic$藩属将失去人力和对[gm_2_greek_scope.GetName]的忠诚。"
 greek_2_18:0 "海上霸权"
 greek_2_18_DESC:0 "希腊的力量一直在于她便捷的海上通道，通过它连接世界的市场和海岸。像雅典一样，我们将利用海军力量的优势，确保希腊人的保护。"
 greek_2_1_DESC:0 "真正的希腊领导希腊世界的时刻已经到来，将希腊不同的声音统一成一个新的强大的统一国家——在我们的领导下。"
 greek_2_2:0 "泛希腊解放"
 greek_2_2_DESC:0 "希腊人长期以来一直受到外国统治者强加的驻军的折磨。是时候收复我们的自由，并收复整个希腊的自由了。"
 greek_2_3:0 "解放城市"
 greek_2_3_DESC:0 "希腊的自由希腊人已经成为马其顿君主制和亚历山大虚荣野心的继承者的受害者。我们必须保护我们的兄弟免受这些外国影响。"
 greek_2_3_allow_tt:0 "从一个继业者、外国入侵者或其属国手中重新夺回一个希腊领土。"
 greek_2_3_reward_tt:0 "可以将领土作为#Y 藩属#!附属国释放。\n希腊的$hellenic$国家将对[gm_2_greek_scope.GetName]产生好感。"
 greek_2_4:0 "恢复寡头政治"
 greek_2_4_DESC:0 "希腊的民主派削弱并误导了希腊人民太久了；是时候将合理的政府扩展到希腊世界了。"
 greek_2_4_reward_tt:0 "[gm_2_greek_scope.GetName]将获得希腊所有非寡头共和制的$hellenic$国家的领土宣称。"
 greek_2_5:0 "恢复民主"
 greek_2_5_DESC:0 "希腊的寡头、君主和僭主们已经破坏了我们人民的自由太久了；是时候将我们的兄弟带入自由和自治了。"
 greek_2_5_reward_tt:0 "[gm_2_greek_scope.GetName]将获得希腊所有寡头共和制和君主制$hellenic$国家的领土宣称。"
 greek_2_6:0 "接近亲人"
 greek_2_6_DESC:0 "有其他与我们共享传统和政府的希腊国家，我们应该试图说服他们，服从我们的领导是确保我们继续自由的唯一途径。"
 greek_2_6_allow_tt_1:0 "至少存在一个独立的$hellenic$君主制或寡头制国家，且$me_greek_2_regions_tt$（当前：#Y [SCOPE.ScriptValue('gm_2_kindred_counter_svalue')|0]#!）"
 greek_2_6_allow_tt_2:0 "至少存在一个独立的$hellenic$非寡头制共和国，且$me_greek_2_regions_tt$（当前：#Y [SCOPE.ScriptValue('gm_2_kindred_counter_svalue')|0]#!）"
 greek_2_6_reward_tt:0 "[gm_2_greek_scope.GetName]可能会说服其他类似政府的$hellenic$国家成为他们的属国。\n只有在完成此任务时存在的那些国家会被接触。"
 greek_2_7:0 "泛希腊首都"
 greek_2_7_DESC:0 "希腊在几个世纪以来有许多著名和人口众多的城市，但如果我们要为所有希腊人建立一个新国家，我们的首都必须胜任此任务。"
 greek_2_7_allow_tt:0 "[gm_2_greek_scope.GetName]的首都位于#Y $greece_region$#!并且具有#Y 大都会#!地位。"
 greek_2_7_reward_tt:0 "所有希腊国家将对[gm_2_greek_scope.GetName]产生#G 20#!好感。"
 greek_2_8:0 "激励希腊人"
 greek_2_8_DESC:0 "为了团结希腊人民，我们需要通过一个英雄人物的领导来激励他们，一个他们可以聚集在一起对抗继业者、反动派和入侵者的统一象征。"
 greek_2_8_allow_tt_1:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#!是一名领导至少#Y 15#!个大队或船只的将军或海军上将。"
 greek_2_8_allow_tt_2:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#!是一名任命的#Y 独裁者#!。"
 greek_2_8_allow_tt_3:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#!拥有至少#Y 70#!人气@popularity_icon!"
 greek_2_8_allow_tt_4:0 "#Y [gm_2_greek_scope.GetRulerTitle] [gm_2_greek_scope.GetRuler.GetPraenomen]#!在过去的#Y 720#!天内赢得了一场战斗。"
 greek_2_8_reward_tt:0 "指挥的单位将获得士气提升。"
 greek_2_9:0 "伟大的城市"
 greek_2_9_DESC:0 "虽然所有的希腊人都为希腊的伟大作出了贡献，但有几个城市在她的成功中起着核心作用。如果我们要代表希腊的遗产，这些中心必须在我们的统治下联合起来。"
 greek_2_9_allow_tt:0 "#Y [GetProvince('(int32)416').GetName]#!、#Y [GetProvince('(int32)427').GetName]#!、#Y [GetProvince('(int32)426').GetName]#!、#Y [GetProvince('(int32)418').GetName]#!和#Y [GetProvince('(int32)424').GetName]#!由[gm_2_greek_scope.GetName]拥有，或是它的$hellenic$"
 greek_2_9_allow_tt_1:0 "$greek_2_9_allow_tt$非寡头共和制属国。"
 greek_2_9_allow_tt_2:0 "$greek_2_9_allow_tt$寡头共和制或君主制属国。"
 greek_2_greece:0 "泛希腊政府"
 greek_2_greece_BUTTON_TOOLTIP:0 "希腊人到处都在呼唤自由和领导。"
 greek_2_greece_CRITERIA_DESCRIPTION:0 "在希腊建立霸权。"
 greek_2_greece_DESCRIPTION:0 "自波斯入侵以来，越来越明显的是，当分裂使我们成为外国入侵者掠夺的对象时，希腊文明的优势被浪费了。如果希腊要在这些奇异的时代繁荣起来，她的人民必须在强有力的领袖下团结起来。"
 greek_2_greece_REWARD_DESCRIPTION:0 "成立希腊联盟。"
 greek_3_1:0 "赢得自由"
 greek_3_10:0 "与母国竞争"
 greek_3_10_DESC:0 "大希腊曾经拥有希腊世界最精致的城市，在西巴里斯毁灭和意大利战争之前。我们将再次实现这一目标。"
 greek_3_10_allow_tt:0 "[gm_3_greek_scope.GetName]的首都位于#Y $magna_graecia_region$#!大陆区域，并且具有#Y 大都会#!地位。"
 greek_3_11:0 "解放的意大利人"
 greek_3_11_DESC:0 "大希腊的希腊城市长期以来不得不忍受意大利的统治。希腊霸权的旧日子必须回归。"
 greek_3_11_allow_tt:0 "在#Y $magna_graecia_region$#!大陆区域内，没有任何$hellenic$国家是非$hellenic$国家的属国。"
 greek_3_12:0 "希腊意大利"
 greek_3_12_DESC:0 "我们的祖先与意大利的原住民作战并取得了胜利。如果我们要确保大希腊保持希腊文化，我们必须将所有她的土地置于希腊影响之下。"
 greek_3_12_allow_tt_1:0 "在#Y $magna_graecia_region$#!大陆区域内，没有非$hellenic$国家，或者如果有，它们都是$hellenic$国家的属国。"
 greek_3_12_allow_tt_2:0 "如果在#Y $magna_graecia_region$#!大陆区域内存在任何非$hellenic$国家，[gm_3_greek_scope.GetName]是其中至少一个国家的宗主国。（当前：#Y [SCOPE.ScriptValue('me_gre_3_12_svalue')|0]#!）"
 greek_3_13:0 "大都会关系"
 greek_3_13_DESC:0 "像所有意大利城市一样，我们的原始定居者来自希腊。展示我们历史联系可能会赢得母城的感激之情。"
 greek_3_13_allow_tt_1:0 "#Y [SCOPE.Custom('get_gre_3_metropolis_1')]#!存在并拥有[SCOPE.Custom('get_gre_3_metropolis_2')]，或其所有者是#Y [SCOPE.Custom('get_gre_3_metropolis_3')]#!。"
 greek_3_13_allow_tt_2:0 "其所有者是#Y [SCOPE.Custom('get_gre_3_metropolis_3')]#!。"
 greek_3_13_allow_tt_3:0 "其所有者是#Y [SCOPE.Custom('get_gre_3_metropolis_3')]#!，或#Y [SCOPE.Custom('get_gre_3_metropolis_1')]#!存在。"
 greek_3_13_allow_tt_4:0 "#Y [SCOPE.Custom('get_gre_3_metropolis_1')]#!拥有马塞利亚的领土，或其他马塞利亚国家。"
 greek_3_13_reward_tt:0 "可能与我们的殖民大都会结盟或收到礼物。"
 greek_3_15:0 "终结僭主"
 greek_3_15_DESC:0 "血腥和暴政的循环将永远不会结束；西西里希腊人必须在意大利人的领导下。"
 greek_3_15_allow_tt:0 "#Y 叙拉古#!不存在。"
 greek_3_17:0 "大希腊"
 greek_3_17_DESC:0 "只有当大多数意大利城市在共同领导下团结起来时，希腊西部殖民地的遗产才会得到保障，其未来才会得到保障。"
 greek_3_17_allow_tt:0 "#Y 大希腊#!不存在。"
 greek_3_18:0 "[SCOPE.Custom('get_greek_3_18_title')]"
 greek_3_18_DESC:0 "我们领土边界上有巨大的机遇，我们必须采取一切措施来确保我们的生存。"
 greek_3_18_allow_tt_1:0 "[gm_3_greek_scope.GetName]拥有#Y $illyria_region$#!区域内至少#Y 3#!个沿海领土。 ([SCOPE.Custom('gre_mission_3_18_custom_loc_1')]/#Y 3#!)"
 greek_3_19:0 "不同的传统"
 greek_3_19_DESC:0 "意大利城市曾经被认为是领先的希腊中心之一，结合了多样化殖民地的影响，成为了富裕的商业城市，哲学生活繁荣。"
 greek_3_19_reward_tt:0 "选择一个永久的国家专长。"
 greek_3_1_DESC:0 "如果我们要摆脱外国统治的枷锁并恢复我们城市的骄傲，我们必须号召人民追求自由的事业并激励他们采取行动。"
 greek_3_1_claim_tt:0 "[gm_3_greek_scope.GetName]将获得邻近由[gm_3_greek_scope.GetOverlord.GetName]控制的领土的宣称。"
 greek_3_1_reward_tt:0 "[gm_3_greek_scope.GetName]可以确保他们的自由，或获得重新夺回自由的手段。"
 greek_3_2:0 "激励民众"
 greek_3_2_DESC:0 "如果我们要克服被贬为小城市的困境，我们必须采取主动，获得邻国的资源。号召城市的人口是实现我们野心的第一步。"
 greek_3_2_allow_tt:0 "[gm_3_greek_scope.GetName]不是属国。"
 greek_3_3:0 "$greek_3_10$"
 greek_3_3_DESC:0 "$greek_3_10_DESC$"
 greek_3_3_allow_tt:0 "[gm_3_greek_scope.GetName]的首都位于#Y $central_italy_region$#!或大陆#Y $magna_graecia_region$#!区域，并且具有#Y 大都会#!地位。"
 greek_3_4:0 "意大利希腊同盟"
 greek_3_4_DESC:0 "过去，意大利希腊城市联合组成一个联盟，彼此防御意大利入侵者和无礼的邻国。我们应该恢复这个联盟，作为获得意大利领导地位的手段。"
 greek_3_4_allow_tt_1:0 "[gm_3_greek_scope.GetName]及其意大利属国拥有至少#Y 5#!个意大利希腊领土。 ([SCOPE.Custom('gre_mission_3_4_custom_loc')]/#Y 5#!)"
 greek_3_4_allow_tt_2:0 "在#Y $magna_graecia_region$#!或#Y $central_italy_region$#!区域中，至少有一个意大利希腊国家比[gm_3_greek_scope.GetName]的领土少。"
 greek_3_4_reward_tt:0 "意大利希腊属国将被兼并。\n如果存在，意大利希腊国家可能自愿加入我们的联盟。"
 greek_3_5:0 "希腊的复仇"
 greek_3_5_DESC:0 "布鲁提亚和卢卡尼亚意大利部落的崛起使意大利城市受到野蛮入侵、掠夺和征服。我们必须为这些侮辱报仇。"
 greek_3_5_allow_tt_1:0 "#Y [GetCountry('BRT').GetName]#!是[gm_3_greek_scope.GetName]的属国或不存在，并且[gm_3_greek_scope.GetName]拥有其部分旧领土（#Y [GetProvince('(int32)51').GetName]#!、#Y [GetProvince('(int32)77').GetName]#!、#Y [GetProvince('(int32)79').GetName]#!、#Y [GetProvince('(int32)74').GetName]#!或#Y [GetProvince('(int32)76').GetName]#!）。"
 greek_3_5_allow_tt_2:0 "#Y [GetCountry('LCA').GetName]#!是[gm_3_greek_scope.GetName]的属国或不存在，并且[gm_3_greek_scope.GetName]拥有其部分旧领土（#Y [GetProvince('(int32)53').GetName]#!、#Y [GetProvince('(int32)71').GetName]#!、#Y [GetProvince('(int32)70').GetName]#!、#Y [GetProvince('(int32)59').GetName]#!或#Y [GetProvince('(int32)60').GetName]#!）。"
 greek_3_5_allow_tt_3:0 "#Y [GetCountry('SAM').GetName]#!是[gm_3_greek_scope.GetName]的附属国，或其已不存在且[gm_3_greek_scope.GetName]拥有其部分旧有领土（#Y [GetProvince('(int32)33').GetName]#!、#Y [GetProvince('(int32)44').GetName]#!、#Y [GetProvince('(int32)45').GetName]#!、#Y [GetProvince('(int32)42').GetName]#!、[GetProvince('(int32)46').GetName]#!、#Y [GetProvince('(int32)43').GetName]#!、#Y [GetProvince('(int32)10').GetName]#!、#Y [GetProvince('(int32)1716').GetName]#!、[GetProvince('(int32)1718').GetName]#!、#Y [GetProvince('(int32)41').GetName]#!或#Y [GetProvince('(int32)32').GetName]#!）。"
 greek_3_6:0 "[gm_3_greek_scope.GetAdjective]的稳定"
 greek_3_6_DESC:0 "我们的城市有着悠久的历史，多年来被卷入了许多战争。这些争端已被平息，直到现在。"
 greek_3_7:0 "请求援助"
 greek_3_7_DESC:0 "如果我们要在希腊对手和意大利邻国的袭击中生存，我们不能因为自豪而不向有能力提供帮助的人求助。"
 greek_3_7_allow_tt_1:0 "[gm_3_greek_scope.GetName]正在与非$hellenic$国家交战，并且其土地力量少于#Y 50%#!。"
 greek_3_7_allow_tt_2:0 "在#Y $magna_graecia_region$#!、#Y $central_italy_region$#!或#Y $greece_region$#!区域内，任何#Y $hellenic$#!国家的人口多于[gm_3_greek_scope.GetName]、对其看法超过#R -25#!并且没有与[gm_3_greek_scope.GetName]交战。"
 greek_3_8:0 "雇佣兵依赖"
 greek_3_8_DESC:0 "不断的战争和人口外流使我们依赖意大利雇佣兵来满足我们的大部分防御需求。他们将在未来的日子里证明自己是有用的。"
 greek_3_9:0 "意大利复兴"
 greek_3_9_DESC:0 "在过去的一个世纪里，我们的城市经历了衰退，被希腊和外国邻国的崛起所袭击。如果我们要成为该地区的主导力量，我们必须首先恢复我们的首都。"
 greek_3_9_allow_tt:0 "[gm_3_greek_scope.GetCapital.GetName]:\n * 拥有#Y 城市#!地位\n * 主要文化属于#Y $hellenic$#!群体\n * 主要宗教是#Y $roman_pantheon$#!\n * 拥有至少#Y 20#!人口\n * 没有空闲的建筑插槽\n * 拥有至少#Y 40#!文明值\n * 奴隶@slaves!人口比例少于#Y 33%#!\n * 部落民@tribesmen!人口比例少于#Y 33%#!"
 greek_3_italiote:0 "大希腊"
 greek_3_italiote_BUTTON_TOOLTIP:0 "大希腊的希腊人必须团结起来。"
 greek_3_italiote_CRITERIA_DESCRIPTION:0 "建立意大利希腊人的领导地位。"
 greek_3_italiote_DESCRIPTION:0 "大希腊的意大利希腊城市一直在争夺区域统治，并在此过程中让自己成为意大利部落的猎物。在未来的日子里，如果大希腊要生存下去，我们的城市必须承担起意大利领导的重担。"
 greek_4_1:0 "一个[ROOT.GetCountry.GetAdjective]的海岸"
 greek_4_10:0 "$greek_4_7$"
 greek_4_10_DESC:0 "$greek_4_7_DESC$"
 greek_4_11:0 "地中海巡逻"
 greek_4_11_DESC:0 "我们的收入取决于我们维持贸易流向我们的港口，经常被海盗打断并成为嫉妒竞争对手的目标。必须建立一支力量来保护我们的财源。"
 greek_4_11_allow_tt:0 "一个由#Y [gm_family_head_4.GetFamilyDisplayAdjective]#!家族的海军上将领导的拥有至少#Y 30#!艘利布尔尼船的海军。"
 greek_4_11_allow_tt_fallback:0 "一个由海军上将领导的拥有至少#Y 30#!艘利布尔尼船的海军。"
 greek_4_12:0 "收复[GetProvince('(int32)3515').GetName]"
 greek_4_12_DESC:0 "福西亚的殖民地[GetProvince('(int32)3515').GetName]被#E 伊特鲁里亚#!和#E 迦太基#!联合舰队攻击，虽然进行了顽强的抵抗。\n\n由于我们迄今为止在该地区追求和平目标，我们的敌人错误地认为我们已经忘记了对我们的犯罪——是时候收复失地并报复我们的卑鄙对手了。"
 greek_4_13:0 "福西亚的复仇"
 greek_4_13_DESC:0 "腓尼基人必须为他们对我们祖先的卑鄙对待付出代价；是时候将西部的岛屿重新置于希腊的控制之下了。\n\n由于我们给他们带来的损失，腓尼基人贿赂当地雇佣兵向我们收取高额费用，但这只是表明他们的无能——我们不会因为复仇而被吓倒！"
 greek_4_13_allow_tt:0 "[gm_4_greek_scope.GetName]或她的#Y 马塞利亚#!属国完全拥有#Y $balearides_area$#!、#Y $sardinia_meridionalis$#!和#Y $sardinia_septentrionalis$#!区域。"
 greek_4_13_reward_tt_1:0 "#Y $balearides_area$#!、#Y $sardinia_meridionalis$#!和#Y $sardinia_septentrionalis$#!将获得奖励。"
 greek_4_13_reward_tt_2:0 "#Y $balearides_area$#!、#Y $sardinia_meridionalis$#!和#Y $sardinia_septentrionalis$#!将获得同化速度的提升。"
 greek_4_14:0 "野蛮人的交易"
 greek_4_14_DESC:0 "当地部落一直愿意允许希腊人在海岸定居，只要他们不干涉他们的事务，且愿意获得我们从其他地方进口的丰富商品。"
 greek_4_14_allow_tt_1:0 "#Y [gm_4_greek_scope.GetRulerTitle] [gm_4_greek_scope.GetRuler.GetPraenomen]#!拥有至少#Y 6#!魅力@oratory_icon!"
 greek_4_14_allow_tt_2:0 "在控制范围内的南高卢或东伊比利亚的任何港口由非#Y $hellenic$#!部落国家拥有，我们与之和平且对我们的看法超过#R -50#!。"
 greek_4_14_reward_tt:0 "可以从非$hellenic$部落国家购买南高卢或东伊比利亚的一个港口。"
 greek_4_15:0 "侵略性市场"
 greek_4_15_DESC:0 "腓尼基人对西部贸易路线的控制不再能被容忍，我们必须将他们从他们的贸易站中驱逐出去，并建立我们自己的贸易帝国。"
 greek_4_15_allow_tt:0 "在黑海没有#Y 海盗据点#!。 (目前：#R [SCOPE.ScriptValue('gre_mis_1_haven_ongoing_all_target')|0]#!)\n$greek_4_haven_tt$"
 greek_4_16:0 "福西亚同盟"
 greek_4_16_DESC:0 "福西亚的流亡人口的分散残余在分裂的情况下仍然是弱小的。他们必须在单一领导下团结起来，即我们的领导下。"
 greek_4_16_allow_tt:0 "如果上述任何一个由附属国控制，那他们必须是#Y $hellenic$#!文化。"
 greek_4_16_reward_tt:0 "黑海地区的海盗据点将获得补偿，迁往世界其他区域。"
 greek_4_17:0 "福凯亚的复兴"
 greek_4_17_DESC:0 "我们的人民被迫逃离波斯人，放弃了我们的城市。凭借我们的新力量，我们可以收复家园，治愈过去的创伤。"
 greek_4_18:0 "背向陆地"
 greek_4_18_DESC:0 "我们是一个航海民族，主要关注港口的获取和商业利益的扩展。我们应该通过与当地原住民部落结盟来确保我们的陆上安全。"
 greek_4_18_allow_tt_1:0 "一个结盟的部落国家在#Y 高卢#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $transalpine_gaul_region$#!地区。"
 greek_4_18_allow_tt_2:0 "一个结盟的部落国家在#Y 伊比利亚#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $tarraconensis_region$#!地区。"
 greek_4_18_allow_tt_3:0 "一个结盟的部落国家在#Y 伊比利亚#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $contestania_region$#!地区。"
 greek_4_18_allow_tt_4:0 "一个结盟的部落国家在#Y 伊比利亚#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y $baetica_region$#!地区。"
 greek_4_18_allow_tt_5:0 "一个结盟的部落国家在#Y $italic$#!文化组中，拥有至少#Y 8#!个领土，对我们的好感度至少为#Y 100#!，首都位于#Y 意大利#!或#Y 大希腊#!地区。"
 greek_4_19:0 "奥利西波的野心"
 greek_4_19_DESC:0 "传奇的贸易站奥利西波是通往北方远程贸易路线的门户。通过占领它，我们将获得其过去的声望和宝贵的位置。"
 greek_4_19_allow_tt:0 "[gm_4_greek_scope.GetName]拥有#Y [GetProvince('(int32)1319').GetName]#!，其：\n * 拥有#Y 城市#!地位\n * 主要文化属于#Y $hellenic$#!群体\n * 拥有#Y $temple_building$#!\n * 没有正在进行的建设\n * 拥有至少#Y 10#!人口\n * 奴隶@slaves!人口比例少于#Y 33%#!\n * 部落民@tribesmen!人口比例少于#Y 33%#!"
 greek_4_1_DESC:0 "$greek_4_7_DESC$"
 greek_4_2:0 "福西亚中心"
 greek_4_2_DESC:0 "西部的希腊城市仍然是小飞地，一边是海洋，另一边是野蛮部落之海。如果我们要生存，我们必须建立一个能够自给自足的强大城市。"
 greek_4_2_allow_tt:0 "拥有南高卢或东伊比利亚的一个港口，其：\n * 拥有#Y 城市#!地位\n * 主要文化属于#Y $hellenic$#!群体\n * 主要宗教是#Y $roman_pantheon$#!\n * 拥有至少#Y 40#!文明值\n * 具有#Y 市场#!\n * 没有正在进行的建设\n * 拥有至少#Y 20#!人口\n * 奴隶@slaves!人口比例少于#Y 33%#!\n * 部落民@tribesmen!人口比例少于#Y 33%#!"
 greek_4_2_reward_tt1:0 "[me_gre_4_2_temp.GetName]将获得定居者和一个永久奖励的选择。"
 greek_4_2_reward_tt2:0 "人口最多的相关领土将获得定居者和一个永久奖励的选择。"
 greek_4_3:0 "赫拉克勒斯的柱子"
 greek_4_32:0 "确保#E 高卢海湾#!"
 greek_4_32_DESC:0 "我们已经征服了沿海高卢人，迫使他们接受我们的统治——我们认为这种情况最为合适。尤其是对[ROOT.GetCountry.GetRuler.GetName]的赞美，他正逐渐被公认为一位可怕的战略家。"
 greek_4_33:0 "马赛利亚市场的高卢"
 greek_4_33_DESC:0 "征服一个地区是一回事，但要成为一个善良而睿智的土地管理者则完全是另一回事。让我们开始着手引导这些高卢人走向文明……并走向我们的市场。"
 greek_4_34:0 "填补裂缝"
 greek_4_34_DESC:0 "尽管我们的重点是海岸，但我们必须注意内陆高卢人带来的危险。谨慎起见，我们应该转向加强[GetProvince('(int32)2311').GetName]的防御。"
 greek_4_35:0 "在[GetProvince('(int32)3515').GetName]的生意"
 greek_4_35_DESC:0 "现在我们已经组建了一支足以在[ROOT.GetCountry.GetAdjective]旗帜下扬帆出海的舰队，我们应当访问附近的岛屿，尝试建立贸易联系。\n\n#E 科西嘉岛#!上繁忙的港口 [GetProvince('(int32)3515').GetName] 是我们的前殖民地，从这里出发航行大约只需一个月——我们应该在当地执政官中进行一些探询，不过要先打点一下关系。"
 greek_4_36:0 "科西嘉的森林"
 greek_4_36_DESC:0 "由于我们在[GetProvince('(int32)3515').GetArea.GetName]岛上有业务利益，我们决定在州级别采伐他们的原始森林——对[ROOT.GetCountry.GetName]来说是一个福音！"
 greek_4_37:0 "具姆奈西亚的客人"
 greek_4_37_DESC:0 "[ROOT.GetCountry.GetName]中的恐怖#E 马戈海盗#!的声誉不需要进一步介绍，因为我们的商船与这些掠夺者及其在#E 撒丁海#!的暴力倾向关系密切。\n\n[ROOT.GetCountry.GetRuler.GetName]厌倦了听到他们在我们的水域中袭击的消息，建议直接征服该岛。也许我们可以与当地人达成协议——他们是否愿意在合适的价格下放弃他们的前生活方式？"
 greek_4_38:0 "岛屿的统一"
 greek_4_38_DESC:0 "[ROOT.GetCountry.GetRuler.GetName]在驱逐我们敌人离开#E 撒丁海#!的岛屿并将它们归于[ROOT.GetCountry.GetName]的统治下取得了不可思议的成就。现在是时候庆祝我们的[ROOT.GetCountry.GetRulerTitle]了，他已经将目光投向了一个更大的目标——#E 叙拉古#!。"
 greek_4_39:0 "像野蛮人一样战斗"
 greek_4_39_DESC:0 "野蛮人涌入我们的城市引发了[ROOT.GetCountry.GetRuler.GetName]的一个有趣计划——为什么不让我们的[ROOT.GetCountry.GetAdjective]征兵与这些部落战士一起训练呢？也许有些战术对我们的将军们有用？除非我们一起训练士兵，否则我们不会知道。"
 greek_4_3_DESC:0 "守卫内海入口的伟大柱子已经在腓尼基人手中太久了，阻碍了我们商人进入北方贸易并干扰了探索。"
 greek_4_3_allow_tt:0 "上述领土中至少有一个：\n * 拥有#Y 城市#!地位\n * 拥有至少#Y 2#!个要塞\n * 拥有至少#Y 2#!个市场"
 greek_4_3_reward_tt:0 "最大的相关领土将获得奖励和定居者。"
 greek_4_4:0 "贸易区"
 greek_4_40:0 "解放大希腊"
 greek_4_40_DESC:0 "我们最近征服的公民居住在#E 叙拉古#!，他们请求我们解放#E 大希腊#!。对于希腊殖民地在#E 意大利#!的威胁太多，而[ROOT.GetCountry.GetName]的复兴使我们成为受压迫的希腊人的冠军。"
 greek_4_41:0 "伊比利亚东海岸"
 greek_4_41_DESC:0 "如果我们能够征服住在#E 伊比利亚#!东海岸的部落，这将对区域安全大有裨益。如果我们能保证旅行商人的安全通行，那么由于贸易量的增加，我们将需要适当扩展我们的海军设施。"
 greek_4_42:0 "在[GetProvince('(int32)1468').GetName]的玻璃吹制工"
 greek_4_42_DESC:0 "虽然在[GetProvince('(int32)1000').GetName]工作的工匠在玻璃吹制行业中已经很成熟，但他们总是在寻找扩展工艺的机会。虽然[GetProvince('(int32)1468').GetName]现在可能是一个偏僻的地方，但该岛有一天可能会生产出精美的玻璃。"
 greek_4_43:0 "马赛利亚玻璃"
 greek_4_43_DESC:0 "那些有钱购买奢侈品的人知道要指名购买#Y 马赛利亚玻璃#!，因为我们的[ROOT.GetCountry.GetAdjective]作坊以其无与伦比的杰作而闻名。"
 greek_4_44:0 "伊比利亚南部的海滩"
 greek_4_44_DESC:0 "伊比利亚南部#E 的城市#!是我们拥有的一些最美丽的土地——温暖的微风和温柔的海水吸引着我们的[ROOT.GetCountry.GetAdjective]人民。"
 greek_4_45:0 "占领塔拉科嫩西斯"
 greek_4_45_DESC:0 "我们胜利的征兵占领了#E 塔拉科嫩西斯#!的大片土地，为我们的国库和军队提供了丰富的领土。"
 greek_4_46:0 "在塔拉科嫩西斯的训练"
 greek_4_46_DESC:0 "现在我们控制了伊比利亚东北部的平原，决定增加该省的军事准备。\n\n不仅是伊比利亚凯尔特人，我们还要担心，北部和西部的麻烦高卢人也值得我们关注。"
 greek_4_47:0 "控制直布罗陀海峡"
 greek_4_47_DESC:0 "控制#E 赫拉克勒斯之柱#!有许多经济和军事利益，但[ROOT.GetCountry.GetRuler.GetName]肯定喜欢这种大胆宣言带来的声望。"
 greek_4_48:0 "我们的省份"
 greek_4_48_DESC:0 "虽然我们确实拥有许多富饶的土地，[GetProvince('(int32)2320').GetArea.GetRegion.GetName]迅速成为住在[ROOT.GetCountry.GetCapital.GetName]的精英中最受欢迎的省份之一。我们中最富有的人正在争夺南高卢的财产，希望建立大庄园并扩大他们已经令人印象深刻的财产。"
 greek_4_49:0 "大市场的[ROOT.GetCountry.GetCapital.GetName]"
 greek_4_49_DESC:0 "我们在地中海和伊比利亚的广泛商业持股为[ROOT.GetCountry.GetName]的国库带来了比我们知道如何处理的更多的金银。\n\n[ROOT.GetCountry.GetRuler.GetName]意识到建立遗产的机会，命令在[ROOT.GetCountry.GetCapital.GetName]建立一个宏伟的市场——一个[ROOT.GetCountry.GetAdjective]人民财富的神殿。"
 greek_4_4_DESC:0 "我们必须继续扩展，将更多的城市置于我们的影响之下，如果我们要与庞大的腓尼基贸易帝国及其竞争对手竞争。"
 greek_4_4_allow_tt:0 "拥有至少#Y 8#!个具有#Y $hellenic$#!文化的港口。 ([SCOPE.Custom('gre_mission_4_4_custom_loc')]/#Y 8#!)"
 greek_4_4_allow_tt_2:0 "首都州（#Y [gm_4_greek_scope.GetCapital.GetState.GetShortName]#!）至少拥有#Y 10#!条活跃的进口路线。 ([SCOPE.Custom('gre_mission_4_4_2_custom_loc')]/#Y 10#!)"
 greek_4_5:0 "接近福西亚殖民地"
 greek_4_5_DESC:0 "通过我们的新影响力，我们可能能够说服我们的一些同胞殖民地加入我们，或者至少接受我们的保护以换取贡品。"
 greek_4_5_allow_tt:0 "存在任何拥有少于#Y 5#!个领土的自由#Y 马塞利亚#!沿海国家。"
 greek_4_5_reward_tt:0 "可能获得一个#Y 马塞利亚#!藩属。"
 greek_4_6:0 "$greek_1_6$"
 greek_4_6_DESC:0 "西方的许多希腊殖民地已经落入腓尼基人或当地部落手中。我们应该将失去的土地归还给它们的合法拥有者。"
 greek_4_6_allow_tt:0 "征服一个被非希腊人占据的西地中海历史上属于希腊的港口。\n\n#Y 地图上标出了可能的目标。#!"
 greek_4_6_reward_tt:0 "领土可能被解放为藩属。"
 greek_4_7:0 "[SCOPE.GetRootScope.GetCountry.GetAdjective]海岸"
 greek_4_7_DESC:0 "我们对周围地区的控制正在滑坡，许多福西亚贸易站已经倒闭或变得无效。我们必须以新的热情确立我们的权威。 \n\n\n\n\n\n\n\n\n\n@greek_mil18!"
 greek_4_7_reward_tt:0 "这些领土的国家将获得奖励。"
 greek_4_8:0 "$greek_4_7$"
 greek_4_8_DESC:0 "$greek_4_7_DESC$ \n\n\n\n\n\n\n\n\n\n@egypt_mil13!"
 greek_4_9:0 "$greek_4_7$"
 greek_4_9_DESC:0 "$greek_4_7_DESC$"
 greek_4_loyalty_reward_tt:0 "每个#Y [gm_family_head_4.GetFamilyDisplayAdjective]#!家族成员将获得#G 10#!忠诚@loyalty_icon!。"
 greek_4_west:0 "远离家乡"
 greek_4_west_BUTTON_TOOLTIP:0 "福西亚殖民地的生存需要强有力的领导。"
 greek_4_west_CRITERIA_DESCRIPTION:0 "在西地中海捍卫希腊利益，同时慢慢建立一个光辉的贸易帝国，赋予我们建立#E 福西亚同盟#!的手段和权威。"
 greek_4_west_DESCRIPTION:0 "#E 马塞利亚#!、#E 恩波里翁#!、#E 埃莱亚#!和#E 赫梅罗斯科佩隆#!是数百年前由逃离亚洲的流亡者建立的，他们的家园和梦想被#E 波斯人#!占领，后者洗劫了他们的母城#E 福凯亚#!在伊奥尼亚。\n\n以喜欢跨海旅行而闻名，他们乘坐舰队航行了数月，最终在#E 高卢#!和#E 伊比利亚#!的遥远地区建立了新生活。\n\n在这里，他们免受波斯军队的蹂躏，但他们很快将遇到另一个不断壮大的势力，这个势力在其统治西地中海贸易的任务中不容许有任何竞争对手；#E 迦太基#!。时局艰难，最西部的希腊人的生存悬于一线。"
 greek_4_west_REWARD_DESCRIPTION:0 "建立对马塞利亚希腊人的领导地位。"
 have_barracks_tarraconensis_tt:0 "我们需要在#Y 塔拉科嫩西斯#!区域建造#G 5个兵营#!。"
 integrate_them_salluvians_please_tt:0 "#Y 我们需要整合#! #T 萨卢维亚文化#!。"
 masiliot_cheaper_slaves_cost:0 "科西嘉殖民者"
 masiliot_claims_on_baetica_tt:0 "#Y 我们将获得对#! #T 贝提卡#!所有省份的宣称。"
 masiliot_claims_on_gallaecia_tt:0 "#Y 我们将获得对#! #T 加利西亚#!所有省份的宣称。"
 masiliot_claims_on_lusitania_tt:0 "#Y 我们将获得对#T 卢西塔尼亚#!所有省份的宣称。#!"
 masiliot_claims_on_transalpine_gaul_tt:0 "#Y 我们将获得对#T 阿基坦尼亚#!所有省份的宣称。#!"
 masiliot_claims_up_in_gaul_time_tt:0 "#Y 我们将获得对#T 山外高卢#!所有省份的宣称。#!"
 masiliot_control_of_gibraltar_mod:0 "马赛利亚控制直布罗陀"
 masiliot_control_of_gibraltar_mod_desc:0 "虽然一些国家可能愚蠢地声称地中海是他们自己的海域，但我们控制着谁可以进入这片水域。"
 masiliot_glass_tt:0 "我们需要生产至少#Y 10#!个@glass!玻璃。 (#R [SCOPE.ScriptValue('masiliot_trade_goods_svalue')|0]#!/#Y 10#!)"
 masiliot_unlocks_gallic_trads_tt:0 "#Y 我们将获得#! #G 凯尔特军事传统#!的访问权限。"
 me_gre_1_culture_warning_tt:0 "使命“#Y 好客之海#!”将#R 不再可用#!。"
 me_gre_2_abort_block_tt:0 "#Y 希腊联盟#!将在20年内无法成立。"
 me_gre_2_league_reward:0 "[gm_2_greek_scope.GetName]将成立#Y 希腊联盟#!。"
 me_gre_4_13_pmod:0 "萨达那行政官"
 me_gre_4_13_pmod_desc:0 "我们正在与当地的萨达那行政官合作，恢复撒丁岛南部的城市。"
 me_gre_4_32_pmod:0 "马赛利亚海岸"
 me_gre_4_32_pmod_desc:0 "现在我们已经占领了海岸，是时候投资于当地的城市了。"
 me_gre_4_33_pmod:0 "马赛利亚市场"
 me_gre_4_33_pmod_desc:0 "我们已经大量投资于高卢南部的城市，使该地区成为所谓的“银海岸”。"
 me_gre_4_34_pmod:0 "马赛利亚山地要塞"
 me_gre_4_34_pmod_desc:0 "我们在靠近山脉的地方建造了坚固的堡垒，确保没有人未经我们允许穿过这些艰难的土地。"
 me_gre_4_35_pmod:0 "阿拉利亚贸易站"
 me_gre_4_35_pmod_desc:0 "由于我们国家之间的个人友谊，科西嘉城市阿拉利亚的居民在马赛利亚港口享有特别的贸易特权。"
 me_gre_4_37_pmod:0 "海军学院"
 me_gre_4_37_pmod_desc:0 "我们说服了马戈的海盗在这里训练我们的水手，分享他们在撒丁海的专业知识和知识。"
 me_gre_4_39_pmod:0 "野蛮人的训练"
 me_gre_4_39_pmod_desc:0 "由于我们在征兵中接受了野蛮战士的存在，我们的部队与这些凶猛的野蛮人一起训练，学习他们的武术技巧。"
 me_gre_4_41_pmod:0 "伊比利亚城市"
 me_gre_4_41_pmod_desc:0 "由于我们征服了伊比利亚东部的海岸，带来了一个和平与繁荣的时期，当地的城市正在蓬勃发展。"
 me_gre_4_42_pmod:0 "马赛利亚玻璃工坊"
 me_gre_4_42_pmod_desc:0 "来自恩波里翁的工艺大师在这里建立了生产出色作品的玻璃工坊。"
 me_gre_4_43_pmod:0 "著名的玻璃出口商"
 me_gre_4_43_pmod_desc:0 "我们的人民因制造最精美的玻璃而闻名。"
 me_gre_4_44_pmod:0 "南方城市"
 me_gre_4_44_pmod_desc:0 "我们的沿海城市拥有温和的气候和轻松的生活方式。"
 me_greek_2_regions_tt:0 "在#Y $greece_region$#!区域或#Y $thessaly_area$#!省份（不包括#Y $crete_area$#!和#Y $epirus_area$#!区域）中，是比[gm_2_greek_scope.GetName]小且与[gm_2_greek_scope.GetName]和平的国家。"
 pleased_nobility_moving_to_southern_gaul_mod:0 "满意的贵族"
 pleased_nobility_moving_to_southern_gaul_mod_desc:0 "我们的上层阶级一直在跨阿尔卑斯高卢建造财产和产业。"
 send_dem_alalians_a_gift_cuh:0 "#Y 我们必须向#! #T 城市#! #Y 阿拉利亚#!送礼。"
 skythoi_security_title_1:0 "斯基泰人"
 skythoi_security_title_2:0 "安纳托利亚人"
 skythoi_security_title_3:0 "科尔基斯人"
 tarraconensis_masiliot_manpower_mod:0 "塔拉科嫩西斯的征兵活动"
 tarraconensis_masiliot_manpower_mod_desc:0 "我们在塔拉科嫩西斯省发布了消息，寻找士兵为我们的军队服务。"
 tarraconensis_training_final_mod:0 "塔拉科嫩西斯的训练"
 tarraconensis_training_final_mod_desc:0 "我们的重装步兵和骑兵正在塔拉科嫩西斯建造的军事营地中与常规士兵一起训练。"
 we_will_get_tarraconensis_claims_tt:0 "#Y 我们将获得对#! #T 塔拉科嫩西斯#!所有省份的宣称。"

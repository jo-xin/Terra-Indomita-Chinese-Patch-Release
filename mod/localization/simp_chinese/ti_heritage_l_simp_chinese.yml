l_simp_chinese:
 ailao_heritage:0 "茶马古道传承"
 ailao_heritage_desc:0 "哀牢诸部落以扼守横跨今云南地区的山地商路而闻名，这些隘口将中原列强与通往骠国城邦乃至印度人领地的偏远险恶丛林地带隔开。此地的哀牢山区蕴藏着丰富的矿物、稀有金属与原材料，供养着各部族。往来商队的贸易税与过境贸易对哀牢氏族而言不过是锦上添花，偶尔为其带来珍奇异宝。"
 anaro_heritage:0 "玉石贸易传承"
 anaro_heritage_desc:0 "阿纳罗岛及其居民长期以来得益于台湾港口与菲律宾港口之间的贸易往来。绿色软玉器物散见于两大岛区的海岸及之间的沉船遗迹中，古典时期与希腊化时代这一地区的玉石贸易很可能是规模最大的单一地质材料海上贸易网络。由软玉制成的常见奢侈品之一是一种绿色耳坠，可能由不同部落与邦联中有威望的长老和首领佩戴。作为两个玉石产地与市场之间最大的中转站，阿纳罗是商旅不可绕过的集散地与交易中心，沐浴在翠绿璀璨的财富中。"
 anchegu_heritage:0 "铁骊部落传承"
 anchegu_heritage_desc:0 "安车骨人在其靺鞨族群邻居中被称为铁骊，栖居于松花江沿岸。与邻族相似，他们对那些可耕作的土地精心耕种，而在其余常年冰封不宜居住之地则仅求生存。他们说一种早期的通古斯语，与远至北方和东方直到鄂霍次克海的村落部落共享着文化。"
 androphagia_heritage:0 "食人者传承"
 androphagia_heritage_desc:0 "安德罗法吉人这个令人困惑的族群，其语言让所有非母语者茫然不解。据说他们是斯基泰及其周边部落中唯一将仪式性食人作为常态习俗的部族。这些野蛮的男女以毛茸茸的生物为配菜，分食自己的同胞。他们与斯基泰王族及其他斯基泰部落关系疏离——在大流士入侵时拒绝援助斯基泰人便是明证——始终保持着冷漠不可信的特质，堪称噩梦的化身。"
 anya_heritage:0 "西瓜传承"
 anya_heritage_desc:0 "安雅以其西瓜与庞大的农业闻名于世，为广袤的市场供应新鲜物产——古时或曾存在与西瓜相关的节日，或以此作为敬神的祭品，或视其为赐予民众力量与神恩的容器。安雅人留下了许多丰富的墓葬，这些墓冢作为醒目的地标至今仍矗立在大地之上。"
 argippaeia_heritage:0 "圣树居者传承"
 argippaeia_heritage_desc:0 "阿吉派伊人居住于乌拉尔山脉外的肥沃低地中，是一个天生秃顶的民族，鼻子扁平，下巴颀长——其体貌形态对任何爱琴海地区居民而言都如异类一般。他们食用 Ponticum 树的果实，过着静谧而肃穆的生活。这种树所结的果实被其部落称为「aschy」。他们将果汁与奶混合饮用，并以果渣制作饼食，因为肥美的猎物在此难以觅得。他们被视作神圣的民族，部落中的每一成员都拥有一棵覆以厚毡的树作为居所。"
 arimaspia_heritage:0 "贤盗传承"
 arimaspia_heritage_desc:0 "阿里马斯皮人是看守黄金的狮鹫之对手，一个神秘的独眼部落。仅由少数旅行者如传说中的阿里斯提亚斯记载于世，他们在当地以觊觎邻族所珍视的黄金的贤盗而闻名。他们知晓如何在北风之神的荒野洞窟中穿行，人们远道而来向他们求取预言和玄秘之见。除其神秘特质外，他们在冶金术上颇有智慧——其聚落所产的可锻铸铁与钢素负盛名。"
 arimphaeia_heritage:0 "浆果腹者传承"
 arimphaeia_heritage_desc:0 "阿里姆费伊人蒙诸神福佑，栖居于北方寒冷的森林之中，以甜美的浆果为生。与远北传说中的极北族人类似，他们对除最富经验的旅行者与商人之外的所有人而言都是一个谜。他们性情温和，发式也简朴，男女皆短发。他们不受野蛮邻族的侵扰，安然践行其礼仪祭祀。"
 aru_heritage:0 "卡洛人传承"
 aru_heritage_desc:0 "构成阿鲁部落王国的卡洛人最初局限于内陆高海拔地区，后来下行至海岸并建立了该地区最早的港口。在通往闻名遐迩且利润丰厚的马六甲海峡的航道上，阿鲁的海岸线易守难攻，对所有从印度和孟加拉地区运载丰厚商品而来的商船而言，既能提供庇护，亦可构成威胁。"
 ba_heritage:0 "巨蛇传承"
 ba_heritage_desc:0 "巴人是一个松散的氏族与酋邦联盟，矢志抵抗秦楚的征服。他们流动性强，仰赖大地的馈赠，从不耕作。随着战国时代的开启，巴人被迫辗转迁都，沿着他们世代聚居的河谷不断西移南迁。据城居者的文字记载，巴人将其邦国的创立追溯至廪君——他聚拢了五大氏族，并通过一场竞赛决定了联盟的首领。据说枳城埋葬着他们最古老且最受尊崇的首领。此外，这些人崇拜白虎的概念，而其族群名称则指向一条巨蛇的象形文字。"
 baekje_heritage:0 "佰济传承"
 baekje_heritage_desc:0 "百济诸部很早便定居于故土，逐渐远离海岸，却始终有意维系祖先赖以兴盛的航海传统。虽然他们的军事基础仍有不足，但百济人日益活跃的经济活动足以弥补这一短处。"
 baima_heritage:0 "山神传承"
 baima_heritage_desc:0 "冉族与駹族部落东北方向居住着白马人，他们隶属于更大的氐族群。氐是威胁中国汉朝领土的五大蛮族之一。他们在河谷中耕作，居住在以木为框、以泥为墙的房屋里。白马人没有成文的典籍，也不建庙宇，而是崇拜图腾祭物，而最尊崇的则是山神。"
 baishan_heritage:0 "白山传承"
 baishan_heritage_desc:0 "因其临近长白山而被称作白山民，白山之人居高临下俯瞰着南方中原化的邻国，在寒冷的高处获得庇护。长白山以名为天池的火山口湖和肥沃的火山土壤为当地居民创造了一种环境奇观，同时也赋予了一种神秘的品质——更广大韩地族群的人民视其为祖源之地。这些人属于更大的肃慎族群，是北方的针叶林居民，早已习惯了北方的粗砺之地。"
 ballo_heritage:0 "东方甜瓜传承"
 ballo_heritage_desc:0 "巴洛人以家乡所产的诸多蔬果与谷物为生，其中最为著名的当属东方甜瓜，在湿润的大陆性气候中大量生长，是社会各阶层都可享用的甘美佳品。自公元前两千纪以来便占据该地的他们，在文化上受到朝鲜半岛东南部的辰韩人的影响。"
 ban_chiang_heritage:0 "小坩埚传承"
 ban_chiang_heritage_desc:0 "早在新时代时期便已有人栖居的班清先民，在希腊化时期偏好在浅黄底色上绘以红色纹饰的陶器，并在坩埚中自行制造金属工具。他们拥有的青铜脚环与青铜矛头一样多，贸易与战争皆有所备。然而，与许多以工厂般规模冶炼金属的都市化中心不同，班清周边的各个小村落在没有一个强大中央邦国的情况下，各自锻造本地的铜合金等物，缺乏城市所能提供的集中专精技术——这委实是一项了不起的成就。"
 ban_lum_khao_heritage:0 "严酷平等传承"
 ban_lum_khao_heritage_desc:0 "班伦考自公元前二千纪下半叶起便已有人居住，坐落于呵叻高原之上，它展现了严酷的丛林环境如何影响古代东南亚的先民。男女双方各有艰辛，饮食不同，身形与牙齿龋伤各异，在某些地中海城居者眼中或许会被视为如同另一个物种的奇异存在。然而，尽管在男女生活方面有其独特面相，班伦考的社会实质上相当平等——所有成员必须团结协作才能使每个村落得以成功。男女墓葬中均出土了精美的珠饰与骨器，可见男人和女人比大多数社会更平等地分担了生活的苦与乐。"
 barus_heritage:0 "泉水传承"
 barus_heritage_desc:0 "巴鲁斯港深受旅行者和商贾的喜爱，因为它坐落在泉源附近，进港的干渴者随时可以获得充足的淡水。商人在此港能买到的所有商品中，最为独特而令人难忘的当属樟脑。樟脑易于从附近森林中采收，外表类似于现代塑料。而那些频繁肆虐外海浪涛的暴风骤雨，则让水手们不得不待在港口的安全庇护下。"
 bi_heritage:0 "思笔传承"
 bi_heritage_desc:0 "笔国的民众聚居在以兰陵为都的区域内。此地虽外观朴素，却暗藏着科学与哲学思想的孕育与勃兴之所。周边有许多幽静的山丘与谷地，极适宜设立书院、修道院、学府以及各类研学与思辨之所——或许某位命定之人将造访此地，将这里的学习潜力发扬光大。"
 bie_heritage:0 "悬龟棺传承"
 bie_heritage_desc:0 "鳖的氏族属于更庞大的僰文化，僰人以在岩壁上留下成排的悬棺而闻名。在中国文献中有时被称作濮人，僰人可能属于著名的百濮族群。鳖人自身曾由传奇人物鳖灵——龟族之首——统治，他率领鳖人向西迁徙到了他们如今的家园。"
 bisaya_heritage:0 "易感岛民传承"
 bisaya_heritage_desc:0 "比萨亚部落分布在菲律宾群岛南部诸岛更为广阔的区域内，有时也被称为米沙鄢人。他们高度依赖海洋生计与商业活动来维系其文化、沟通与生活方式。虽然他们持有十分明确的泛灵-多神信仰，但他们是一个极易受到影响的民族，与之贸易的众多文化都可能将自身文化与信仰的某一部分传递给这些岛民。"
 boduo_heritage:0 "伯咄部传承"
 boduo_heritage_desc:0 "伯咄部落位于粟末靺鞨以北，他们在拉林河畔找到了安身之所，那里有清澈甘甜的河水，也能寻得中午的餐食。沿河而居的他们精通农耕与园艺，种植小麦、粟米和珍贵的大豆。劳作之时，他们身披狼皮外套，驱赶任何破坏庄稼的野兽。"
 boruscia_heritage:0 "凡人遗产"
 boruscia_heritage_desc:0 "以伏尔加河与卡马河为家园，博鲁斯奇部落的马里人是最为「凡人」的民族。他们将家园——那令人敬畏的自然世界——视为永恒不变之善的源泉。对环境的信仰将各部落凝聚在一起，人民也将自身与信仰视为等同——二者本就密不可分。或许这是他们远古时代起源于冰封的西伯利亚腹地所致，在那里仅靠生命本身便是死亡，绿色的自然几乎不存在。"
 bugu_heritage:0 "母鹿的遗产"
 bugu_heritage_desc:0 "崇拜母鹿的仆骨部落居住在巴尔喀什湖畔，而更早之前则居于西伯利亚深处的叶尼塞河畔。历经岁月，他们与伊朗人、乌拉尔人和突厥人混血交融，汇集了一套广泛的信仰与文化体系来治理社会。他们频繁与邻邦交战并劫掠其聚落，以半游牧的方式蹂躏村庄与山寨，从而维持其战团。马匹是他们的首选武器。"
 bulsa_heritage:0 "布尔萨遗产"
 bulsa_heritage_desc:0 "得益于牛浦湿地的滋养，布尔萨的人民颇受喜爱。他们不仅向南方的古亚港口进行贸易，还经常迎来南方城市的外交官与使节，他们视布尔萨为政治强大且值得维持良好关系的重要之地。"
 cangwu_heritage:0 "苍梧遗产"
 cangwu_heritage_desc:0 "位于庞大的楚帝国之南，苍梧部落王国及其人民被其北方邻国视为顽强的边境缓冲地带，是楚国侧腹的一根刺，终有一日将被拔除。该地区许多更强大的势力早已垂涎将苍梧变为其南向军队的郡县，因为珍贵的南方海岸及其富裕城市就坐落在丛林之后，而苍梧地区本身是一处易守难攻、易于防御外敌入侵的要地。在茂密的灌木丛与广袤荒野之中，苍梧人民修建了仰望苍穹的神庙，从那里他们观察星辰中发现的征兆，并通过那些神圣光芒的闪烁预言未来的事件。"
 careotia_heritage:0 "芬尼秘法者的遗产"
 careotia_heritage_desc:0 "卡雷奥蒂部落因控制了沃尔霍夫河两岸与伊尔门湖而受益匪浅。这两个名称都源自芬尼语根，意为魔法师、魔法和空灵之性，赋予了这片土地被芬尼秘法者掌握的神秘气息，他们在圣林与水边举行神圣仪式。除了传奇故事之外，这条河与湖的组合使卡雷奥蒂掌控了一条从芬诺-斯堪的纳市场到波罗的海腹地领土的富饶贸易通道。他们有能力控制货物流动，并对该地区的毛皮和金属贸易征税。"
 cedu_heritage:0 "徙都遗产"
 cedu_heritage_desc:0 "与隋部落和徙部落接壤，徙都人作为一支戎族部落，兼具华夏与斯基泰文化的影响，曾在青藏高原的风之走廊上培育和骑乘草原骏马。这个藏缅部落处于半游牧状态，他们最稳定的居所是其石棺墓葬。如同其他小部落一样，他们小心避开北方强大可畏的月氏人。"
 chaibadan_heritage:0 "柴巴丹的遗产"
 chaibadan_heritage_desc:0 "位于帕萨克河谷，柴巴丹得益于肥沃的冲积平原，吸收了来自远方山脉富含矿物质的河水。它还将自己的货物沿河向下游输送，运输青铜手镯、铁器、磨光石锛以及宝石/黄金制成的珠子。该聚落也能获得如玉石等更稀有材料，为其上层阶级制作珠宝，这在其墓葬中可见一斑。如同现代泰国其他地方一样，在该遗址发现了印度的肯迪壶，表明其中一些贸易可能抵达了恒河三角洲乃至更远，并随旅行者、商人和传教士返回。"
 chansen_heritage:0 "占森的遗产"
 chansen_heritage_desc:0 "占森起源于铁器时代晚期，与早期的乌通和其他早期扶南聚落几乎是同时代的。那里发现了石器和铁制工具（如斧头）的混合遗存，表明此地有长期的定居和现场技术进步。该地区遍布低地，一条巨大的圆形护城河环绕聚落以提供防护。早期的肯迪壶——印度红抛光陶壶——也在该遗址被发现，这表明商人/旅行者或印度教/佛教传教团已深入此地。"
 chinese_heritage:0 "华夏传承"
 chinese_heritage_desc:0 "与周边诸民相比，华夏诸邦的税收并不总是最为充盈，但他们拥有日渐繁盛的人口与出众的外交官僚。其使节往来应对从容，常能轻易改善邻邦观感，令许多不那么显赫的宫廷艳羡不已。"
 chu_heritage:0 "楚国传承"
 chu_heritage_desc:0 "黄河流域孕育了许多卓越的文化，而楚人在其中尤为突出。楚人仍保有某种与神灵相通的原初纽带，善于巫祝之术；他们的音乐也以深沉玄思著称，显露出这个民族特有的思想好奇心。"
 damna_heritage:0 "神秘之箱的遗产"
 damna_heritage_desc:0 "有时被称为蛮族之岛，耽罗（Damna，今济州岛）是一个温带但雄伟的人民家园，拥有玄武岩悬崖和火山起源。据说耽罗/耽罗由三位神圣的创始者——高、梁、夫——所定居，他们大约在公元前24世纪的某个时候从地洞中各自出现——如今的居民仍然保护并尊崇这些传说中的洞穴，或许在等待新的神祇出现。另一些故事讲述了一个奇怪的箱子，某天被冲上海岸，里面有三名女子、牛、马和播种用的种子。耽罗的人民既与西边的中国人贸易，也与北方大陆上的朝鲜民族进行交易。"
 daqiuyuan_heritage:0 "邹族的遗产"
 daqiuyuan_heritage_desc:0 "大丘园遗址所建的山脊型地貌是邹族及其他古代南岛语系山地部落的典型家园。邹族以口头传述的方式讲述他们的氏族如何作为独特而独立的部落穿越群山，随后聚集并形成了他们用以自称的群体认同。俯视着下方平原上的居民和遥远港口的居民，邹族远离商业航海活动，然而他们是少数知晓如何沿着岛屿脊线迅速运输货物、从一端到另一端、绕过环绕整个岛屿航程的民族之一。"
 daze_heritage:0 "大泽遗产"
 daze_heritage_desc:0 "在楚辞《大招》中被提及的鲜卑人，是东胡族群的一个分支，以在现代内外蒙古东部草原上的骑手而闻名。他们因骑射技艺而令人畏惧。大泽的居民生活在现代呼伦湖（整个地区五大淡水湖之一）周围的草原上，能够依靠丰富的鱼类、虾类以及可采集的珍珠来供养自己。周围的湿地和附近的阿穆尔河提供了一个在寒冷干燥草原中尤显葱郁的环境。"
 dian_heritage:0 "滇国遗产"
 dian_heritage_desc:0 "滇国由非汉族的滇人在春秋时期建立，以滇池高原为中心，是一个金属加工民族，从南方马来半岛市场进口锡，并制作铁器和青铜器。滇人精英的墓葬以其华丽的特征展示了他们的工艺水平。王国军队在战时还使用大型铜鼓进行战场通讯。"
 dong_zhou_heritage:0 "东周遗产"
 dong_zhou_heritage_desc:0 "巩城在战国时期是东周国的都城，此前王城的政客们在公元前4世纪失去了政治影响力。在与同样弱小的西周残余领地长期争战后，它与其对手一样，断断续续地被西方更为强大的秦国所征服。"
 donghu_heritage:0 "五胡的遗产"
 donghu_heritage_desc:0 "东胡最早记载于公元前7世纪，起源于现代内蒙古的河北地区，但随着时间的推移向南迁徙，分裂成若干亚群。其部落的工匠以制作弓、车及其他工具和器皿的能力而闻名，无需像楚、魏或秦等定居之地的工匠那样经过多年的专业化训练才能达到同等的工艺水平。东胡，有时仅被称为胡，随着部族迁徙和分裂而分成五大群体，被称为五胡或五蛮。赵武灵王命令他的军队采用胡服和骑兵战法，看到了他们季节性骚扰的危险，也看重他们战法的优势。"
 dongno_heritage:0 "东卢遗产"
 dongno_heritage_desc:0 "东卢/渎卢的人民自新石器时代起就居住在他们的岛屿家园上，当东卢王国形成时，它在行政上被分成两半。尽管他们主要是岛民，但该王国的人民与朝鲜南部地区伟大的弁韩民族有着联系，这些民族通过河流、三角洲以及东卢岛屿的港口运送贸易货物。因此，贸易是他们的立身之本，也使他们具有政治重要性，因为他们对哪些船只可以安全地在其水域上运输货物拥有发言权。"
 dongwei_heritage:0 "东濊遗产"
 dongwei_heritage_desc:0 "东濊的人民，有时也被称为东濊或东濊，与邻近的高句丽部落保持着紧密的文化联系，与那些民族和沃沮部落共享民族习俗和语言。被中国人称为诸多'东夷'中的一支，记载中他们举行一种名为'舞天'的节日，在每年的第10个月之前崇拜上天和其中的神灵——这可能与同时期在高句丽领地举行的'东盟'节日有关。两个节日都具有婚姻意义和展示性质，虎神是这一时期被赞颂的标志性神祇。为了资助这样的庆典，东濊人种植普通谷物以及桑麻。"
 ebetsu_heritage:0 "幽默动物的遗产"
 ebetsu_heritage_desc:0 "以因水色浑浊而以'幽默'闻名的河流命名，江别及其周边的阿伊努族群与其在萨哈林岛的尼夫赫支系北方邻居保持着最密切的联系。他们是后绳文（或续绳文）时代的先驱，在这一时期，石器技术和绳纹陶器仍然是生活的主要组成部分，同时他们又打破了传统的移动性和定居农耕生活模式。他们与自然世界如此亲近，以至于他们的史诗传统——尤卡——反映了以动物如猫头鹰、狐狸等视角叙述的第一人称故事——他们叙唱的声音模仿着自然生物的鸣叫。"
 esan_heritage:0 "浅堡贸易的遗产"
 esan_heritage_desc:0 "以渡岛半岛上的“hak-casi”（“浅堡”）为中心，惠山的阿伊努人与南方的日本人贸易密切，同时也最受其威胁。他们的尤卡史诗叙事提到南方的倭人（Wajin），无论是定居于南北海道顶端者，还是北本州诸部，都说明两族关系最初颇为友好，后来倭人试图控制贸易手段，并借此支配阿伊努人。显然，惠山的阿伊努人已经学会在经济往来中保持防御姿态。在渡岛半岛的“casi”（堡寨）中，要塞之外的多个“kotan”（聚落）会在“carange”（辩论）中被讨论；那些自愿通过贸易把权力交给倭人的人，可能会被逐出自己的聚落，并被割断跟腱作为惩罚。"
 fanzaiyuan_heritage:0 "反叛海民的遗产"
 fanzaiyuan_heritage_desc:0 "番仔园周边地区是古老的道卡斯部落的家园，出人意料的肥沃且适合定居人口，横跨台湾岛西北部和西南部的平原地区。虽然道卡斯部落通常是和平的居民，通过捕鱼、商业海上贸易和崇拜海神将生命奉献给海洋，但他们也有暴力的一面。道卡斯人以反叛倾向和推翻任何他们认为是压迫性统治的意愿而闻名。"
 fengbitou_heritage:0 "天山之民的遗产"
 fengbitou_heritage_desc:0 "凤鼻头遗址居住着古老的排湾人，他们常常紧靠悬崖和山脉而居，其特点是独特的红色绳纹陶器纹饰。排湾人以源自关于大武山的传说而得名和起源，他们将山顶视为天界的起始，因此试图尽可能近距离地生活和旅行于神圣领域之旁。"
 fulou_heritage:0 "水中明珠的遗产"
 fulou_heritage_desc:0 "其都城番禺坐落于珠江东岸，扶娄人民注定了拥有丰富的贸易和商业遗产。番禺的港口控制着所有进出珠江及其海湾的贸易和航运，是过滤所有可以分散到内陆或前往岛屿市场的货物的首要位置。番禺的人民属于更大的南越族群，但他们所繁荣的城市起源可追溯至公元前1100年。从军事角度来看，这个地方也是守卫南部海岸线和策划征服的最佳制高点和集结地。"
 funie_heritage:0 "第二太阳的遗产"
 funie_heritage_desc:0 "生活在兴凯湖/兴凯淡水湖周围，有人说富涅的人民曾目睹一个奇怪、巨大、明亮的物体，像一颗巨大的珍珠，偶尔在夜深人静时悬浮于湖面上，如同一个新的太阳照耀在那片区域——这奇观偶尔又会像星星一样射向空中，其光芒被漆黑的夜空吞没。这一奇观盖过了湖水中可发现的鱼类和其他生物的美丽与丰富。许多人将居住在这里的人称为挹娄，他们生活在森林覆盖的山脉和山顶之间。他们对外人而言很有价值，因为他们的土地出产赤玉和优质貂皮，他们也因为箭矢上涂有毒药而令人畏惧。"
 fuyu_heritage:0 "白衣东明的遗产"
 fuyu_heritage_desc:0 "扶余之人属于阿尔泰语系中的通古斯分支，在《史记·货殖列传》中有记载。扶余人将他们的传奇传承追溯至古代苏利国的东明，此前他们是北方的蛮族，后来变成了东方的蛮族。他们耕田种地，也大量饲养和骑乘马匹。他们的国王和部落首领统治着一个以动物著称的族群议事会——牛部、猪部、马部等等。男女日常都穿白衣，当丈夫去世后，他未娶的弟弟会娶其寡嫂为妻。在战争中，他们相信牛的蹄子可以预卜未来。"
 gangga_negara_heritage:0 "远方恒河的遗产"
 gangga_negara_heritage_desc:0 "Gangga Negara，意为'恒河上的城市'，其名源自与许多其他人一同定居于马来半岛的西北印度甘菩遮商人与商人。相比之下，木威（Beruas）的聚落则以当地木威树及其果实命名。有些故事讲述该王国是由老吉打的拉惹干吉·萨尔朱纳建立的，老吉打是邻近的更古老的王国。像其他旅行国王一样，此人据说是亚历山大大帝的后裔。然而，印度定居者确实将印度教引入了马来土著中，在他们的艺术和祭祀遗址中创造出充满活力的文化与宗教混合物。"
 geungi_heritage:0 "根基遗产"
 geungi_heritage_desc:0 "根基最早在公元前第2千纪下半叶有人居住，最初是一些繁荣渔村的聚集地，这里的水域为人们提供了躲避当地酷热夏季的庇护。宗教节日和仪式围绕着这些海滩以及人们与海洋的广泛联系而发展起来。"
 gijeo_heritage:0 "基苧遗产"
 gijeo_heritage_desc:0 "基苧人以洛东江为生，属于辰韩血统，但地方传统和节庆对他们的独特文化和生计至关重要。他们保有戴面具的传统以及仪式性的肉类/菜肴，但随着辰国联盟的统治者强加更多统一规范并将基苧变为傀儡，他们的社会变得更加混杂。"
 goguryeo_heritage:0 "高句骊传承"
 goguryeo_heritage_desc:0 "高句丽人很久以前便决定摒弃文明世界的浮华，宁愿信赖令人望而生畏的防御工事和弓手的弓弦，而不是依靠哲学论著中娇贵的沉思来引导人民。据传他们是世界有史以来最优秀的弓手，从不给敌人测试城墙坚固程度的机会。"
 gojamidong_heritage:0 "古生物学家遗产"
 gojamidong_heritage_desc:0 "除了拥有强大的造船业外，古加米洞人是一群充满好奇心、学习迅速且对研究自身过去感兴趣的人。该地区以遍布恐龙骨骼和其他史前化石/遗骸而闻名。这些元素共同创造了一个善于探究的社会，能够通过与外国的广泛贸易来繁荣并研究新思想。"
 gori_heritage:0 "古里遗产"
 gori_heritage_desc:0 "古里人以他们经久不衰、建造精美的寺庙而闻名，他们在信仰和仪式崇拜中找到了慰藉。他们的寺庙与当地建筑风格相得益彰，征服者和对手也会珍视这些建筑，不会像对待普通城市和建筑那样将它们夷为平地。"
 gryphia_heritage:0 "格里芬守护黄金遗产"
 gryphia_heritage_desc:0 "这些人——如果他们还能被称为人的话——远在普通知识和舒适区的界限之外，甚至超出了历史的范畴。他们最近的邻居阿里马斯皮人本身就因独眼特性而令人难以置信。传说这些遥远的地方居住着守护黄金宝藏的格里芬（他人觊觎的黄金）。实际上，格里芬象征着敬畏或恐惧，表明了一种超越凡人的力量。也许这些寒冷而无情之地的部落民族拥有一种凌驾于周边邻居之上的力量，创造了一段关于其威力的敬畏与恐惧的记忆？"
 gui_heritage:0 "桂遗产"
 gui_heritage_desc:0 "桂人是傣语支的一支，定居在这片沿河岸的更温暖、更富饶的地区，这里竞争较少。确实，沿河的丛林会带来各种麻烦，但这是一个沿贸易网络动脉通往茂密内陆的宁静之地。每天都能看到载着原木的船只顺流而下，附近山丘中的洞穴则能容纳各类劫掠者和海盗，他们可以从贸易通道中获利。"
 gulbal_heritage:0 "古尔巴尔遗产"
 gulbal_heritage_desc:0 "古尔巴尔也被外人称为Golbeo I Soguk，是通往辰国王国东西道路上的一小块区域。古尔巴尔的居民是一个反叛的民族，频繁反抗当时的区域霸主，但叛乱的结果并不总是积极的。最终，他们学会了与半区域性强权合作，并从其他辰韩城邦等盟友的贸易中繁荣起来。"
 guya_heritage:0 "狗邪传承"
 guya_heritage_desc:0 "在狗邪历史上的某个时刻，他们作出了一个影响深远的命运抉择；通过有意降低人民税负，狗邪创造出让贸易在首都繁荣发展的条件，而这座首都由士气异常高昂的军队守卫和保护。"
 han_heritage:0 "韩国传承"
 han_heritage_desc:0 "韩国之民传统上出自群山环抱、军队难以穿越的地区，而当地居民也善于利用这种天险，并将其融入军事学说。轻捷的弓手在岩隘与峻谷中操练，往往在敌人发现他们之前便倾泻箭雨，又能迅速隐入荒山恶地之中。"
 hanben_heritage:0 "平地航海者遗产"
 hanben_heritage_desc:0 "古老的噶玛兰人将这片区域称为家园，他们既生活在山丘和高山之中，也利用沿海的低地平原。他们的传说称，他们从东方航行到台湾岛，瞥见了其美丽的海岸，一登陆便宣称了对这片土地的所有权。该族群共有36个主要部落，随着岁月流逝还有更多部落消失或未被记录。由于他们定居的平坦而天堂般的海滩，他们被称为平地之民。"
 haoshi_heritage:0 "越喜靺鞨遗产"
 haoshi_heritage_desc:0 "豪石人，也被称为越喜人（不要与蹂躏四方的月氏混淆），定居在乌苏里江沿岸及其预料之中的毁灭性洪水区域。他们与富涅人共享兴凯湖，同样目睹了天空中的巨大珍珠——但这似乎没有给他们更加怀疑的心灵留下太深的印象。"
 hezongshi_heritage:0 "黄河祖族遗产"
 hezongshi_heritage_desc:0 "合宗氏自古以来便是一个以黄河为生的古老民族，同时也长期是更强大国家的附庸。他们的臣服历史悠久，附庸的起源可以追溯到传说中的古代君主和领主。合宗氏这个国家可能与人面鱼身的河伯有关——河伯在某些情况下也被称为巢伯——据《竹书纪年》记载，河伯的超自然军队曾协助山甲进行征战。"
 huagangshan_heritage:0 "真汉子遗产"
 huagangshan_heritage_desc:0 "居住在山地、丘陵和丛林中的泰雅部落生活在花冈山及其周边地区。传说中，他们的祖先来自一块神秘的石头。这块被称为Pinspkan的石头裂开后产生了三个生命——一个回到了石头及其领域，而一对男女则留在了这个世界，并因彼此的爱而结合。男孩太害羞而不愿与女子亲近，于是她将脸庞涂黑，骗他相信自己是陌生人，而他对陌生人因不熟悉和紧张而毫无顾忌地亲近。就这样，这对男女创造了所有的泰雅人，诞生于石头之中，每个部落的长老在脸上纹上深色纹身时都会向这位聪慧的女子致敬。"
 huifa_heritage:0 "山林萨满遗产"
 huifa_heritage_desc:0 "辉发是一个深浸于萨满文化、与自然和超自然秩序相调谐的部落。有人说他们崇拜一位在山林中注视他们的「木主」，神圣的歌声能召唤异兽，熏香能让鸟儿起舞，仪式鼓声能让神灵现身于天空。这片如今被称为吉林的地区一直富含矿物和贵金属，包括金、银、石膏和铁。"
 ifugao_heritage:0 "梯田遗产"
 ifugao_heritage_desc:0 "伊富高人本身被称为土地之民或山丘之民，因为他们坚持在山坡和肥沃的稻田上耕作并维持生计。他们保留了一种基于山地英雄和祖先谷物种植的史诗口述传统。宴会是部落民中的常见习俗，他们相信声望和荣耀与祖先灵魂的存在相关联。"
 issedones_heritage:0 "伊塞冬人遗产"
 issedones_heritage_desc:0 "伊塞冬人与已知的本都和里海草原的斯基泰部落相似但又有所区别，仅通过传闻和耳语被观察到——来自诗人阿里斯提亚斯的故事，或是沿着所谓「丝绸之路」的雏形旅行的叙利亚商人的轶事。与邻居不同的是，他们留着长发。他们实行一妻多夫制，并且仅将贵族阶级中已故老人的遗体食葬，以此作为一种崇拜形式。"
 jingug_heritage:0 "辰国遗产"
 jingug_heritage_desc:0 "辰国，又称辰国联盟，控制着朝鲜南部土地上的大量城邦和小型群体，最早可追溯至公元前4世纪。尽管其治理结构相当复杂，管理着众多附庸和附属领土，但它仍然能够在外部保持强大的影响力，派遣许多使节和信使前往遥远的宫廷，以在更广阔的朝鲜政治舞台上竞争。为了供养日益增长和集中化的人口，他们频繁从中国进口金属部件和矿石。他们还与日本列岛的人民保持着若干文化联系，制作与日本弥生人类似的工具和武器，在某些地区可能还会说一种日本语系的语言，之后该地区才巩固了朝鲜语系的连续性。"
 jiuxianlan_heritage:0 "鲁凯族的传承"
 jiuxianlan_heritage_desc:0 "鲁凯族（在某些圈子里被称为查里森人或查里森族）是分布在九仙兰周边的古老原住民族群，与阿美族的部分部落比邻而居。鲁凯族最闻名的是他们作为高地居民的身份，他们在台湾岛东半部和中央山脊的崎岖地形中繁衍生息。他们与南方的排湾族邻居有许多共同特征，但以其礼仪服饰著称，这些服饰既包括精美的头饰和头巾，也包含珍贵的珠宝。许多珍贵宝石及其收藏品来自对外贸易，其中一项重要的定期进口是从南方海上的菲律宾玉文化传入的商品。"
 jomon_heritage:0 "绳文传承"
 jomon_heritage_desc:0 "以他们闻名遐迩的绳纹陶器命名，绳文人在弥生部落北迁之前，居住在北海道、本州以及千岛群岛和琉球群岛的大部分地区。他们用兽骨、鹿角、贝壳和石头制作了大量的珠宝饰品，其生活习惯可与前哥伦布时期的北美相媲美。作为一个金属加工民族，绳文人是日本神话和起源研究的诸多源头，这是一个多元化的群体，其足迹遍布每一片富饶的土地。虽然他们并非成熟的农业民族，但他们以驯化多种桃树而闻名，并从事了若干其他形式的树木栽培。"
 joseon_heritage:0 "神王檀君的传承"
 joseon_heritage_desc:0 "传说中，古朝鲜由神王檀君——天神桓雄与熊女熊女的儿子——早在公元前2333年便已建立。到了公元12世纪，故事还讲述了商朝的一位名叫箕子的贤者，在流浪一段时间后来到此地，成为了伟大的建国者箕子朝鲜。这些伟大建业者的血统据说可追溯到白头山——即白首山——天帝将桓雄带到世界的地方。随着时间的推移，这个聚落不断壮大，因其南北东西各方向的贸易积累财富而日益富饶。燕人在探索其周边地区后所著的《燕之兴起》一文中也提及了这一点，而后续的文献进一步阐明，朝鲜如何成长为一个强大的王国，能够在公元前4世纪对燕国发动战争，从一个城邦发展成为吞并邻国、使其成为附庸国和领土不可分割的一部分的强权。"
 juding_heritage:0 "小战场的传承"
 juding_heritage_desc:0 "在层峦叠嶂与高耸山丘之间的茂密森林和丛林中，句町人时常卷入邻国的战火与纷争之中。例如，他们的领土常常成为漏卧和夜郎军队的战场。在向其宗主国进贡时，他们会派遣满载小米的货车，以及成群的牛羊。"
 juyan_heritage:0 "居延传承"
 juyan_heritage_desc:0 "居延人位于河谷肥沃土地之外的边疆，他们既享受文化和经济的十字路口，又在不经意间占据了中国地区西北部最具关键性的军事入侵与防御通道之一。在沙漠开始之处的这片稀有湿地，居延泽形成了所谓“黑河”的终点——据说因此河在那里汇集了历代帝国终结时的黑血而得名。有些人会说，这个地方最适合建造一座巨大的堡垒，甚至是一堵墙…………"
 kandis_heritage:0 "最古老苏门答腊人的传承"
 kandis_heritage_desc:0 "坎迪斯王国（也简称为坎迪斯）是古代苏门答腊最古老的政治实体，控制着该岛东部和西部海岸的大片区域。这个米南加保人最大的王国还与东边的爪哇人、北/西北的马来城邦和港口，以及远在西方的印度市场进行了大量贸易。"
 karbonia_heritage:0 "石船传承"
 karbonia_heritage_desc:0 "古代爱沙尼亚人首先在波罗的海中找到了他们的力量和与外部世界的联系，最初在他们北方的岛屿领地上建造了宏伟的堡垒和围墙聚落。这使他们得以购买和交易斯堪的纳维亚的青铜器，同时出口他们自己从湖泊和沼泽矿中冶炼的铁。他们的箱式石棺墓如同踏脚石一般点缀着大地，一些沿海墓地的形状甚至类似于早期海船的轮廓。他们的雄心伴随着冰冷的海浪。"
 kedah_heritage:0 "远古海洋之主的传承"
 kedah_heritage_desc:0 "吉打王国和双溪峇都聚落建立于公元前8世纪初，比罗马本身还要古老，从一开始就为海上贸易的巨大成功做好了准备。铁矿石随手可得，而他们在马来半岛的位置——既靠近马六甲海峡，又与锡兰（斯里兰卡）处于同一纬度——使得船只离开他们的港口后，能够最轻松地直接航行抵达并进入锡兰和南印度市场，这是其他港口所无法比拟的。然而，他们并不仅仅是一个供他人经过的贸易站，他们建造了自己的南岛/马来船队，将本地的货物向西运送。据记载，他们拥有轻型船只用于本地运输和交通，较大的船只用于大宗货物转移，还有远洋巨舰，将其水手直接带到印度、苏门答腊和孟加拉等港口和市场。他们对海洋拥有强大的掌控力和航行能力。"
 kelantan_heritage:0 "马来西亚幽灵的传承"
 kelantan_heritage_desc:0 "吉兰丹的历史和起源笼罩在神话之中——据说这片土地曾被巨人（多格丹拜）踏足，一条巨大的龙迦在洪水的推动下登上了海岸。一只老虎（汉图伯利安）漫游于丛林，追踪猎物，而原住民（多波莫）躲藏在缝隙中，那些瘦小的黑人青年，有些人认为是亡者的幽灵。其他传说称这座城市是由一位名叫古农阿燕的萨凯族女王建立的。吉兰丹拥有以农业为主的经济/社会，马来半岛上最大的山脉将其与其他地区隔离开来，这片土地充满了神秘和秘密。"
 khao_sam_kaeo_heritage:0 "思想之港的传承"
 khao_sam_kaeo_heritage_desc:0 "考山缴遗址是海上丝绸之路的重要门户，至少在公元前4世纪便已形成。中国、菲律宾、台湾以及其他类型的货物穿越他们的水域和领土，以进入西方的印度市场。然而，许多工匠和商人也留在了这座港口城市，将其变成了一个繁忙的知识与生产中心，远不止一个中转站。市场上交换的丝绸与新民族和新思想一样频繁出现，带来了技术与进步的巨大融合。当地的物质文化在其许多独特的艺术风格和产品（如石锛和珠宝）中显示出了这种多元民族的融合。"
 khuan_lukpad_heritage:0 "马来加工中心的传承"
 khuan_lukpad_heritage_desc:0 "这个遗址充当了一个贸易站，进口印度原材料并为东方市场生产成品——这一点从他们众多的环模（很可能是用于金饰）和封印模具中可以得知。从印度，他们还收到了远至波斯中东市场的货物。婆罗米文铭文和一些泰米尔文物表明，印度工匠也可能在港口开店，以便在绕行马来半岛的途中更接近中国和其他东方商人。"
 kitami_heritage:0 "扇贝养殖发源地的传承"
 kitami_heritage_desc:0 "这个部落的人集中在北见山脉与鄂霍次克海之间的富饶地带。因此，他们很容易接触到海浪，渔业繁荣，尤其是扇贝的捕捞。阿伊努人对动物精灵的信仰以及他们与周围物质世界的密切关系，促成了阿伊努各部落之间长期和平的时代。北见人在这一时期繁荣昌盛，后来才遭到来自南方弥生日本人的征服。他们与本州岛南部其他绳文人和弥生人的贸易，伴随着暴力、不平等的交换和未知事物的风险。这种不安的感觉通过他们的史诗故事《拯救庞奥塔孙图库尔和他儿子的狼神》得以表达——在这部史诗中，与南方倭人（日本人）的联姻和贸易导致了流血与盗窃，而一位狼神（自然世界的形象）必须拯救阿伊努英雄。"
 kok_charoen_heritage:0 "新石器时代的传承"
 kok_charoen_heritage_desc:0 "可可查伦遗址的占领可追溯到公元前2千纪，拥有东南亚最大的新石器时代遗址之一，早期便是一个人口和文化的增长与传播中心。低矮的山脉保护了它免受其他更早获得青铜的聚落的入侵，因此它能够在相对和平的环境中繁荣发展，使其在较长时期内维持其生活方式，而无需外部动力推动技术或社会的进步。"
 korgantas_heritage:0 "斩首者的传承"
 korgantas_heritage_desc:0 "他们的墓葬以家畜的头颅作为装饰。科甘塔斯人缺乏他们前辈那样巨大的墓道，他们的消逝留下了许多疑问和寥寥无几的答案。他们的箭头是骨制的，令敌人闻风丧胆，为中亚迎接即将到来的无尽恐怖突厥迁徙浪潮做好了准备。"
 kota_gelanggi_heritage:0 "马六甲宝藏的传承"
 kota_gelanggi_heritage_desc:0 "哥打格兰吉和现代新加坡地区可能是地中海文化所知为萨巴纳/萨巴拉或诺米农贸易港的地方，是海上丝绸之路的关键节点，控制着马六甲海峡。哥打格兰吉聚落本身便极尽富有——丰富周边自然资源加上贸易利润——一座全由黑石建成的堡垒或宫殿，其名字源自类似“珠宝宝库”的含义。因此，这是一个富裕繁荣的地点，赢得邻国的敬畏与嫉妒也就不足为奇了。"
 kualadungun_heritage:0 "瓜拉龙运的传承"
 kualadungun_heritage_desc:0 "瓜拉龙运定居在海岸附近和沿海地区，受益于沿湄南河南下的贸易，并与连接中国和印度市场的更大的海上丝绸之路相连。当地的铁矿床允许生产重金属物品和工具/武器，服务于这个聚落和他们的邻近贸易。除了冶金之外，人们还转向农业和渔业。"
 kunming_heritage:0 "昆明蛮夷的传承"
 kunming_heritage_desc:0 "昆明人与富饶的滇国接壤，作为所谓的“南蛮”之一，充当了南方丝绸之路（从中国穿越骠族诸邦，进入孟加拉和印度地区）的初始门户。即便在被中国帝国中心入侵或傀儡化的时候，昆明的部落和王国始终是一个桀骜不驯的边缘地带，一个唯有商人才了解其错综复杂的蛮荒实体。"
 lac_viet_heritage:0 "红河传承"
 lac_viet_heritage_desc:0 "早在公元前700年，雒越人就居住在红河三角洲，他们会敲响青铜鼓，沿河床回荡，直到深夜。传说中，他们曾居住在一个名为文郎的王国，在那里骆王子、领主甚至国王以早期封建式制度统治人民。虽然他们并非最先进的民族，但人们或许会认为他们更加公平，因为雒越妇女地位崇高，深受尊重。"
 lamap_heritage:0 "拉玛普传承"
 lamap_heritage_desc:0 "拉玛普人聚集在可能是整个越南地区最古老的村庄——从琅。它的人民属于沙莹文化，该文化至少可追溯到公元前1000年。沙莹人从事铁器工艺，而他们北方的邻居专注于青铜锻造。他们的铁器随后扬帆进入太平洋，驶向沿着大陆海岸向南的市场、台湾的西部港口以及遥远的菲律宾贸易枢纽。通过这种方式，拉玛普人与说南岛语的岛民联系紧密，都城从琅成为一个国际化的中心。"
 lamuri_heritage:0 "印度化米南加保的传承"
 lamuri_heritage_desc:0 "拉穆里王国的港口是所有苏门答腊王国中最接近印度次大陆的，因此它是苏门答腊乃至整个印尼群岛中最印度化的地区。它也是佛教传教士的重要中转港。其港口充当了印度和孟加拉商品流向太平洋岛屿的过滤器，因此它拥有印度土地上最伟大、最精美的财富，以及稀有的香料和商品。"
 langkashuka_heritage:0 "“亚历山大”梅龙的传承"
 langkashuka_heritage_desc:0 "兰卡苏卡王国和北大年聚落是黄金半岛（马来半岛）上历史较悠久的成功海港之一，仅比古吉打年轻一些。据说它由一位名叫梅龙·马哈旺萨的国王建立，此人据说游历并学习了许多伟大帝国的东西方知识，甚至在他的海上旅途中与一只名为迦楼罗的巨凤搏斗。有些故事声称他是亚历山大大帝的后裔或亲属，但他的故事和身影大多渗透着传奇和迷信色彩。然而，这位创立者的真实面目可能揭示了一个现实：许多印度旅行者、商人和佛教传教士抵达了北大年港口，成为王国不可或缺的组成部分，改变了其民众的身份和信仰。"
 langyawuyue_heritage:0 "阳光的传承"
 langyawuyue_heritage_desc:0 "在春秋历史时期曾被莒国和越国统治，琅琊越的人民及其首都琅琊一直在政治浪潮中随波逐流，随着更强大的玩家进入中原舞台，他们的土地和领导权不断变化。然而，尽管那里的人民面临持续的不确定性，他们的日子却因那温暖而恒久的阳光而依然明媚——那阳光以拥抱所有居住在那片土地上的人而著称。"
 linhu_heritage:0 "林胡传承"
 linhu_heritage_desc:0 "作为与显赫的匈奴诸部相似的众多部落之一，林胡部落只是在与定居的中原王国定期接触后才变得不那么游牧，其人民已经更加习惯于城市居民的生活方式和贸易商品。虽然他们属于被认为「好战的蛮族」之列，但在对外交往的过程中，他们已经被慢慢驯化，有朝一日真正建立起自己的城郭社会也并非意料之外。"
 liukiu_heritage:0 "贝蛮传承"
 liukiu_heritage_desc:0 "琉球诸岛的人民居住在今天的琉球群岛上，他们生活在与航行距离内的其他民族几乎完全隔绝的状态。琉球村落的居民和领主主要源自绳文时代的航海者和商人，他们在外界不断演变的过程中始终保持着文化上的孤立。他们被外界视为神秘的存在，据称没有等级制度，生活在一个男人拔光全身毛发、女人在手上纹昆虫图案的社会中。岛上遍布许多臭橙树，形似橘子，枝叶繁茂。他们主要以捕鱼为生，仅在便利之处种植一些水稻。贝壳是他们的民族象征，用来建造房屋、制作武器以及用于丧葬。他们的贝甲战士是一道令人生畏而奇异的景象。"
 loeu_heritage:0 "建庙者传承"
 loeu_heritage_desc:0 "这是一个极其虔诚的国家，无论新旧，众多神祇的庙宇建在山上、谷中，甚至最狭小的角落。与其他东南亚定居点一样，印度商人和传教士也来到这里，创造了湿婆教崇拜实践的开端。"
 loufan_heritage:0 "楼烦传承"
 loufan_heritage_desc:0 "作为与显赫的匈奴诸部相似的众多部落之一，林胡部落只是在与定居的中原王国定期接触后才变得不那么游牧，其人民已经更加习惯于城市居民的生活方式和贸易商品。虽然他们属于被认为「好战的蛮族」之列，但在对外交往的过程中，他们已经被慢慢驯化，有朝一日真正建立起自己的城郭社会也并非意料之外。"
 lu_heritage:0 "鲁国传承"
 lu_heritage_desc:0 "鲁国四周强邻环伺，觊觎其土地，因此鲁人发展出一种能有力回应外侮的社会并不令人意外。即便威胁常在，鲁人仍以开朗闻名，使其文明颇具吸引力。他们凡事多倚赖自身，也因此不信任遥远的权威，甚至包括自己的统治者。"
 luowo_heritage:0 "小规模宿敌传承"
 luowo_heritage_desc:0 "作为夜郎王国的宿敌，罗卧的统治者经常举兵征讨。这是一场徒劳无功且往往势均力敌的战争，士兵们厌倦了数代人的恩怨。据说，当再一次受命袭击敌方城镇时，罗卧将领雕刻了敌军将领及其幕僚的木像，用箭射向木制偶像而非真人。最终，罗卧和夜郎的鹰派人物转而采用间谍活动和暗杀手段来实现目标。然而，两者就这样继续存在、维持原样，无休无止。只有更强大的政治势力才有机会终结他们的纷争。"
 minyue_heritage:0 "闽越传承"
 minyue_heritage_desc:0 "闽越国建立于公元前298年，由流亡的越国王朝建立，他们与姐妹王国瓯越一样，是为了躲避越国与楚国之间的战争而逃亡的。闽越国长期以来一直恐惧来自中原和富庶河谷的大帝国的侵略性扩张和霸道本性。该国人民与台湾岛民共享一些共同传统，新婚夫妇安家筑巢时，常常选择在妻子父母家附近建造家园，以便照顾年迈的长辈。"
 mirimidong_heritage:0 "弥离谜洞传承"
 mirimidong_heritage_desc:0 "弥离谜洞是辰韩人地区十二城邦之一，他们依赖通往南部海岸的贸易为生。这个定居点本身有过许多名字，但作为一个概念，它被人们铭记为一个富饶之地，无论是麦田、水田，还是因其神话般的奇妙而闻名的星河田。"
 musu_heritage:0 "牟素传承"
 musu_heritage_desc:0 "牟素有时也被称为弥离谜国，其人口由马韩朝鲜人组成。这个地方周围的农田是周边地区最大的，这使其在供养庞大军队方面具有优势——因此，它对辰国联盟来说是一个极为宝贵的附庸，充当了向北进军到与朝鲜接壤边境的军队的基地和中转站。"
 nagsabaran_heritage:0 "猪民传承"
 nagsabaran_heritage_desc:0 "那萨巴兰人几千年前便在该地区定居，并以他们身边大量饲养的牛而著称。群岛北部吕宋岛上的许多部落在偏好食用猪肉或进行猪祭祀崇拜方面各不相同，但猪无论如何显然是他们日常生活的重要组成部分。他们对猪的照料可以追溯到新石器时代，最古老的墓葬骨骼可追溯至那个时期，因此猪必定在许多部落早期就具有了重要的象征意义。"
 nanhe_heritage:0 "南河传承"
 nanhe_heritage_desc:0 "南河的室韦人属于鲜卑血统。《楚辞》和其他中国文献将他们描述为诸蛮夷群体之一。他们华丽的艺术包含了草原相关的自然意象，如蹲伏的动物或几何形状的动物。马匹可以出现在金叶头饰或其他用于仪式佩戴的雄伟作品中。虽然他们讲一种蒙古语或前蒙古语的语言，但突厥影响的存在暗示了该地区的未来。"
 nascia_heritage:0 "马扎尔人传承"
 nascia_heritage_desc:0 "马扎尔纳西人部落最初来自西西伯利亚的更深处，具有多元文化特征，因为他们与伊朗、突厥和斯拉夫民族以及他们自己的芬兰-乌戈尔语系亲属部落都有接触。他们将死者头朝北方埋葬，并且与其他乌戈尔民族一样，在墓葬中使用几何纹样的陶器。他们参与了沿着草原和森林草原地带持续不断的大规模西迁浪潮。"
 ni_heritage:0 "郰传承"
 ni_heritage_desc:0 "自周武王时代以来，常被认为微不足道的小城邦郰国的民众，一直处于其北方鲁国的支配、压力、有时甚至是领主权之下。屈从带来的不利之处是在地区政治事务中扮演了次要角色，但也有好处，那就是有影响力的权势人物、甚至学者和伟大思想家涌入，他们离开拥挤的曲阜城，寻求一个更安静、更不呆板的学术舞台。"
 nivkhgu_heritage:0 "养熊人传承"
 nivkhgu_heritage_desc:0 "尼夫赫人是猎人、渔民和养狗人，他们在外满洲和萨哈林岛北部的寒冷针叶林环境中繁衍生息。大型村落在他们中间十分罕见，他们以氏族为基础的群体生活是以家庭为单位的，通过错综复杂的联姻维系在一起。由于他们在针叶林中的低密度分布，他们族中新娘的聘礼很高，只有最富有的男子才能有一个甚至更多的妻子。他们举行熊祭，向神灵表达虔诚，把捕获的幼熊像孩子一样养育多年后再献祭。"
 non_nok_that_heritage:0 "能诺他传承"
 non_nok_that_heritage_desc:0 "能诺他，意为\"鹧鸪丘\"，自青铜时代起便有人居住，是一个丰饶的农业社会，他们在水源充足、灌溉良好的农田里种植稻田、香蕉、棉花、桑树、黄麻等作物。这里的人有时实行人祭，将头骨作为祭品留在墓葬和神龛中献给神灵。一个富裕且宗教狂热的人群，与他们打交道的任何人都需要极大的谨慎和保留。"
 nuomuhong_heritage:0 "诺木洪传承"
 nuomuhong_heritage_desc:0 "诺木洪文化的人群自青铜时代起就占据了青藏高原上的柴达木盆地，他们习惯于从事耐寒的农牧业并运作流动经济。他们以烤焦的大麦、小麦、黍和粟为生。他们饲养牛、羊、牦牛、马和鹿，由狗来放牧这些混合的畜群。这是一种艰苦的生活，但他们的土地却充当了连接富庶的塔克拉玛干沙漠的重要南方贸易通道。"
 ossia_heritage:0 "奥西人传承"
 ossia_heritage_desc:0 "奥西部落居住在道加瓦河沿岸，这条河将芬尼民族与南方的巴尔斯拉夫人分隔开来。他们既受惠于也受困于他们便利出入波罗的海的地理位置。虽然他们中的政治权贵通过控制斯堪的纳维亚/日耳曼货物向内陆流动以及相反方向的贸易而获得了巨大的财富，但斯堪的纳维亚海盗和劫掠者频繁光顾这条河流，常常骚扰他们的沿岸。"
 ouyue_heritage:0 "正义传承"
 ouyue_heritage_desc:0 "瓯越王国的人民及其统治者，向来是一个骄傲而有道德的族群，为无辜者的困境所触动，并对过去纯属恶意和过度的行为感到羞耻。正因如此，他们是一个更加和谐稳定的民族，始终由一只公正的手以他们的最大利益而非腐败政策或贿赂的利益来统治。只有当王国落入更强大帝国的领主统治之下时，这种思想的自由才有所缺失……"
 pagyritia_heritage:0 "莫尔多瓦人传承"
 pagyritia_heritage_desc:0 "莫尔多瓦人身材高大，大多有深色头发和蓝色眼睛，他们热衷于刺绣和鲜艳的发饰——他们也喜爱青铜首饰。他们从强大的拉河（即现在的伏尔加河）中获取生计。他们夹在可怕的安德罗法吉人和脆弱的马里人之间，是伏尔加地区芬兰语系大家族中最重要的分支之一。"
 pahang_heritage:0 "望加锡树传承"
 pahang_heritage_desc:0 "彭亨王国以彭亨河命名并划定边界，而这条河的名字据说来自一棵传说中的望加锡树，其树根横跨河流两岸。彭亨境内的定居点可追溯到中石器时代。青铜器，尤其是战鼓形式，到公元前400年左右变得突出，金器加工成为生产和贸易的支柱，帮助马来半岛获得了\"黄金半岛\"的称号。然而，尽管该地区是马来文化和文明的摇篮，它却经常发现自己从属于扶南地区的王国，并受那些遥远宫廷的影响。"
 panai_heritage:0 "马六甲商埠传承"
 panai_heritage_desc:0 "作为通往马六甲海峡的必经之路，港口城市帕奈总是熙熙攘攘，来往于东西方的旅行者和商人络绎不绝。佛教僧侣是特别热衷的访客。菲律宾的米沙鄢部落认为周围岛屿上的邻居实际上就来自这个地方——事实真相无从考证，但这揭示出帕奈在太平洋岛屿和印度洋之间保持着密切的文化和经济联系。"
 panpan_heritage:0 "赤土传承"
 panpan_heritage_desc:0 "虽然并非该地区的主要枢纽，盘盘王国成功地发展起一个活跃的贸易经济，与其北方的中国和其他东亚市场进行互动。奇怪的是，他们与西方印度市场的接触实际上导致了大量且不断增长的印度教人口，这为原本属于南岛语系居民的文化增添了色彩，影响了当地的商品和习俗。中国史料可能称他们为\"赤土国\"，也许是因为当地的土壤/黏土/陶器或其他偏好红色的商品。"
 pegu_heritage:0 "海骠人传承"
 pegu_heritage_desc:0 "在室利差呾罗的下游，有一个被称为\"宾雷骠\"的地方的传说，该地毗邻大海。该处规模宏大，海边的定居点含有婆罗米文记录。目前仍不确定这个地点是上游的因加普还是更南方的某个地方，也许更接近勃固——一个孟族文化的重镇。该地区的文物最早可追溯到旧石器时代。"
 petchabun_heritage:0 "钻石山传承"
 petchabun_heritage_desc:0 "碧差汶坐落于一片肥沃且矿产丰富的地区，曾是多個政体的权力中心。它与钻石的象征相关联，代表着在碧差汶山脉中发现的财富（包括金、银和其他金属）。该地区也是罕见的淡水水母的栖息地，这使得这片富饶的土地对那些想要获取其利益的人来说也充满危险。"
 phnom_heritage:0 "边夫人传承"
 phnom_heritage_desc:0 "大致位于现代柬埔寨首都的同一地点，毗耶陀补罗的中心名称揭示了印度移民和商人对该地区发展的影响，他们带来了印度教和佛教。根据传说，这个定居点是由一位名叫边的当地女子创建的，有时被称为\"岛边\"（边夫人），这似乎表明一位公主或某种形式的温和王族登上了地方王位，正如整个东南亚西部许多其他当地建城神话中发生的一样。城市四周被河流支流环绕，周围的土地是一片肥沃可靠的泛滥平原，养育了众多居民。"
 phu_lon_heritage:0 "塔陀罗陀传承"
 phu_lon_heritage_desc:0 "普隆是后来一个重要堕罗钵底城市的前身，据老挝史诗《普拉·拉普拉·拉姆》记载，它是由古代王子塔陀罗陀在离开传说中的老挝王国因塔帕塔玛哈那空后建立的，因为他被剥夺了王位。虽然他最初的城市在湄公河西岸，但一条七头那伽从水中现身，说服他在东岸建造一座姐妹城，该城可能与普隆遗址相连。"
 pinglin_heritage:0 "坪林传承"
 pinglin_heritage_desc:0 "古老的撒奇莱雅族将台湾岛东部这片区域称为家园，不过他们似乎早在聚落时代就已经出现在海岸线的不同地点。他们以海上贸易和海洋生物为生，并与澎湖群岛上的族群保持着密切的关系，因为他们使用相同的石锛来开垦土地、尝试农耕。除了丰饶而神秘的海洋之外，撒奇莱雅人崇拜自己的祖先，部落中的女性同时领导信仰仪式和政治事务。"
 pingu_heritage:0 "沙洲传承"
 pingu_heritage_desc:0 "澎湖群岛的定居历史似乎可以追溯至丹尼索瓦人存在的时期，早在智人抵达台湾海峡之前和期间。随后，大约在公元前3000年，第一批南岛语系的使用者登上了该岛。群岛由沙洲和柱状玄武岩壁交错组成，为船只提供了优良的避风港，也是贸易和补给的重要检查站。"
 pong_manao_heritage:0 "邦马瑙的传承"
 pong_manao_heritage_desc:0 "邦马瑙遗址的墓葬被发现可以追溯至公元前一千纪早期，属于邦清文化的晚期。遗址建在当地一片丘陵地带，既防范了山洪暴涨等自然灾害，也抵御了人为的劫掠。墓葬中出土了磨光红陶、青铜脚镯、红玛瑙项链以及玻璃和玛瑙珠子。当地的铁矿资源使人们能够制造铁制工具和武器，帮助防御这片坚固的要塞免受入侵。"
 pormania_heritage:0 "乌拉尔的传承"
 pormania_heritage_desc:0 "波尔曼人讲彼尔姆语，是乌拉尔山脉的子孙，依靠其险峻的山脊作为抵御外敌入侵的安全屏障。然而，除了以其森林茂密的家园闻名之外，波尔曼人还以富有的商人著称，“彼尔姆”一词可能指代商人或市场。他们的山区富含自然资源，可以通过草原这条高速公路般的通道出口到远方的买家手中。"
 qi_heritage:0 "齐国传承"
 qi_heritage_desc:0 "在不熟悉齐人习俗者眼中，齐人充满矛盾：看似散漫无序，却居住在规制严整的城市；物产丰饶，却受冷漠贵族所累，那些贵族对治理并无多少兴趣。\n然而，在这些表面缺陷之下，齐人一旦面对外敌便能迅速行动，放弃混乱的假象，转而作出统一回应。"
 qielan_heritage:0 "牂柯的传承"
 qielan_heritage_desc:0 "且兰人常常是夜郎王国的属国或附庸，他们生活在名为牂柯的地区，“牂柯”一名既指一种船（意为坚固且由木材制成），也指用来拴船的桩。且兰人既与夜郎等邻族紧密相连，本身也是一艘独立的船，用本土坚韧木材打造的木质框架上坚固地航行。牂柯江将且兰的商人们带往其他土地，在那里可以用货物交换所需的补给或渴望的奢侈品，如丝绸，因此“牂柯”也代表着且兰王国的社会经济命脉。"
 qin_heritage:0 "秦国传承"
 qin_heritage_desc:0 "秦人长于组织，又热衷改革，因而在军事与法制事务上迅速攀至高处。他们的军队纪律严明、忠诚可靠，是多次成功战役锤炼出的劲旅；只是海上经验仍显不足，这一罕见弱点也正为诸多敌手所觊觎。"
 qiongdu_heritage:0 "邛都传承"
 qiongdu_heritage_desc:0 "邛都部落仅被视为蛮夷，一群未开化且无法教化的民族，在定居的中华帝国记录中只是一个脚注，是官方边界之外边缘地带的小麻烦。邛都位于滇国以北——在有些人眼中滇人本身也是蛮夷——他们以外貌引人注目，常被观察到将头发梳成槌状。与北方和西方的游牧邻族不同，邛都部落主要为定居民族，依靠可耕之地的产出为生。"
 ranmang_heritage:0 "石屋传承"
 ranmang_heritage_desc:0 "冉駹部落的民众以定居在定居社会边缘之外的崇山峻岭中而闻名。他们以建造高达40米的邛笼石屋而著称，这些巨大的塔楼建筑犹如瞭望塔。石屋建造在俯瞰山峰间狭窄山谷的战略要地，使部落成员能够最佳地控制山谷中的交通，并及早发现来犯的军队。"
 ravenna_heritage:0 "沼泽之都的传承"
 ravenna_heritage_desc:0 "伊特鲁里亚人、萨宾人、色萨利人、维涅托人或佩拉斯吉人——每一位古代学者似乎对拉夫纳（今称拉文纳）的建立都有自己偏爱的理论。只有考古学带来了确定性，它发现翁布里亚人的存在在被罗马人于约公元前534年入主之前，已不受干扰地持续了约三个世纪。拉夫纳居民的长久独立归功于拉文纳的独特地理位置，直到中世纪结束，这座城市只能通过水路到达；这一特点使得当地人口能够与伊特鲁里亚人和高卢人保持繁荣的政治和经济关系，同时保持独立于他们。"
 sab_champa_heritage:0 "诗琳通香榄花的传承"
 sab_champa_heritage_desc:0 "作为本地特有的诗琳通香榄花——一种独特的木兰——的唯一已知产地，萨占巴拥有悠久的历史，可追溯至公元前一千纪早期，并且是欢迎和接纳大量佛教旅行者和学者的定居点之一。当地的花卉在河流平原环境中繁茂生长，使该地区成为僧侣等和平访客的宁静天堂。"
 sabiria_heritage:0 "萨比尔传承"
 sabiria_heritage_desc:0 "萨比尔部落是一个多元文化的民族，集体受到了其他芬兰-乌戈尔民族的影响，如萨尔加特型的阿里马斯皮人和彼尔姆人。受益于中亚贸易体系，他们的墓葬中充满了金、银、珠宝和装饰工艺品。他们在欧亚贸易网络中的联系如此广泛，甚至还拥有埃及和斯里兰卡设计的器物。在遥远的北方，这些商品的生产作坊可能根本不知道他们这一族的存在——他们在可信的地平线之外，完全处于神话的领域。"
 salia_heritage:0 "莫斯科维特的传承"
 salia_heritage_desc:0 "早期的梅里亚人称此地为家，这里是森林草原与更深北方森林之间的边界。萨利部落沿莫斯科河而居，依靠肥沃的土地为生，从森林中获取毛皮和肉食的动物。他们不如某些更为好战的邻族强大，有时被迫向宗主国纳贡。"
 saro_heritage:0 "斯卢传承"
 saro_heritage_desc:0 "斯卢是一个博学的民族，亲眼见证了智慧的运用能为社会带来何种改变。因此，斯卢文明格外重视学术传统并显得卓尔不群，不过也有人认为这种思想宽容的氛围削弱了对国家的忠诚。"
 selangor_heritage:0 "青铜巴生的传承"
 selangor_heritage_desc:0 "雪兰莪最重要的城市巴生自青铜时代早期就已有人居住，雪兰莪地区长期以来一直是马来西亚地缘政治的参与者。巴生城本身以锡矿丰富的山谷和制造优质青铜的能力为雪兰莪提供了动力。他们的金属工匠能够制造出精美的器物，如巴生型铜铃、被称为“猿骨”的铁制工具，以及用于战争或祭祀庆典的铜鼓。通过四通八达的水路与海洋相连，雪兰莪可以将这些金属奢侈品和必需品运送到各地的贸易伙伴手中。"
 shajing_heritage:0 "沙井传承"
 shajing_heritage_desc:0 "沙井人过着更为传统和悠久的生活方式，居住在中国文明的地理边缘，他们在聚居的土坯小屋中度过一生，依靠村庄周围储存坑中精心保管的肉类和蔬菜储备为生。他们并非与世隔绝，但对南方人忙碌的生活并不十分友好。走在村庄中，人们可能会看到孩子们在玩当地商人的铜车和附带的一系列石制动物。"
 shanma_heritage:0 "骟马传承"
 shanma_heritage_desc:0 "骟马人生活在河西走廊（或称甘肃走廊）沿线——这是一片夹在高耸山脉与寒冷荒漠气候之间的宜居地带。骟马人控制着从中国腹地通往塔里木盆地和西伯利亚地区贸易路线上的关键节点，稻米和丝绸同样通过商队在此经过。"
 shenli_heritage:0 "黄金佛教摇篮的传承"
 shenli_heritage_desc:0 "作为堕罗钵底文化的发源地，乌通城和深厉地区自然资源丰富，乌通以“金城”或“黄金摇篮”而闻名。然而，这是一座陷于对立之中的城市——传说讲述了弑兄王子帕雅攀的建城故事，而历史则记载了和平佛教对该国的影响，帕巴吞寺可追溯至约公元前325年。乌通城以一巨大的椭圆形护城河保护其宗教古迹和圣洁人士。"
 shihsanhang_heritage:0 "萨那赛怪物的传承"
 shihsanhang_heritage_desc:0 "古老的凯达格兰部落的家园，十三行遗址和台湾北部平原地区并非这些部落民众的首选家园。据说他们之前居住在另一个名为萨那赛的岛屿上，因恐惧而离开。在萨那赛岛上，出现了一只怪物，它恐吓着村民的村庄，即使使用陷阱和诡计伤到它，也无法为岛屿带来救赎与和平。有一天，怪物来到村庄，在饥饿的愤怒中吃掉了一个孩子，于是村民们宣布离开的决心，远离萨那赛海岸航行，最终抵达台湾北部平原的双溪河附近，在那里定居并分化为数个群体。"
 siljig_heritage:0 "湿润油菜花的传承"
 siljig_heritage_desc:0 "坐落于朝鲜半岛多岩石的东海岸，悉直人民长期以来与海洋有着紧密的联系——他们的进口品通过海洋而来，出口品通过海洋而去，沿海航行也比沿着山间小径旅行更为容易。他们开始庆祝和崇拜海洋，每年春天涉入水中，将装满美丽油菜花和樱花的小船推入波涛之中。这一小而祥和的仪式，以及其孤立的社会，只能被南方城邦（如斯卢）的进军军队所打断，这些城邦将整个辰韩朝鲜视为他们控制的领域。"
 skirithfinia_heritage:0 "萨米传承"
 skirithfinia_heritage_desc:0 "芬兰人在约公元前500年发展出铁器生产，希腊化时期的芬兰人向欧洲腹地以及波罗的海对岸出口毛皮、奴隶、木器和猛禽，同时也开始传播他们的文化和语言。芬兰南部的居民可能也是萨米人的古老分支，他们以半游牧方式放牧驯鹿而闻名。"
 snay_heritage:0 "铁臂传承"
 snay_heritage_desc:0 "普农斯奈是一处铁器时代的聚落，在公元前一千纪后半叶繁荣兴盛。其境内居住着一个极为好战的民族，每个人下葬时都会携带一两件武器，以保护他们在来世的旅途——剑、匕首和投射装置。每件战争工具均为铁制，饰以青铜点缀。肩饰，形似肩甲，与这些暴力工具相辅相成，构成了这个战士社会的风貌。"
 soknobulsa_heritage:0 "军事化边境的传承"
 soknobulsa_heritage_desc:0 "束诺布尔萨（又称松诺布尔萨）坐落于汉江沿岸，这条河流是其与朝鲜大国之间唯一的天然屏障。作为辰国联盟的附属国，它充当着一个可防御的缓冲国。因此，它时刻为战争做好准备，并受到其宗主国的保护，一旦朝鲜半岛南北冲突，这里将成为首要战场。"
 somun_heritage:0 "落日之树的传承"
 somun_heritage_desc:0 "苏门人的土地因美好回忆而闻名，那是欢乐时光的记忆，染上了红与黄的绚烂色彩。这片土地上生长着许多树木，赋予它一种神秘甚至魔幻的气质。春天来临时，黄花灿烂绽放，红果经过仪式染成更深的红色，与花朵交相辉映，整日营造出一幅生机勃勃的落日画卷。这片幸福宁静的唯一威胁来自苏门邻国的侵略姿态，例如萨罗城邦中那些贪求权势的贵族。"
 song_heritage:0 "宋国传承"
 song_heritage_desc:0 "宋人的历史充满了与邻国的冲突，然而这个民族的力量并未因敌人的欲望而熄灭。宋人拥有成熟的商业传统，其城市被誉为文明的巅峰；不过这些益处也伴随代价，因为他们的人民更忠于国家，而非某位特定领袖。"
 spica_heritage:0 "北伊特鲁里亚人的传承"
 spica_heritage_desc:0 "受帕达尼亚三角洲的庇护，斯皮卡，北意大利最后一个独立的伊特鲁里亚中心，正在抵御凯尔特人的入侵。尽管据哈利卡纳苏斯的狄奥尼修斯记载，斯皮卡由佩拉斯吉人建立，但它很快被佩拉斯吉人遗弃，转而成为一个伊特鲁里亚商埠，在罗马建城约210年后开始繁荣。它曾作为希腊与伊特鲁里亚世界之间枢纽的时代早已远去，因为在凯尔特人入侵中意大利之后，它已与伊特鲁里亚隔绝。"
 sui_heritage:0 "苏伊传承"
 sui_heritage_desc:0 "作为筰都部落的邻居，苏伊人极为游牧，他们编束发辫，随迁徙动物的周期和季节变化而调整居所位置。作为南方丝绸之路支线的成员，苏伊各部族控制着货物南至缅甸、西至西藏高原、北至玉石贸易起点的塔克拉玛干沙漠的流通。他们也控制着南北货物往来，往返于缅甸与北方沙漠商道之间。凭借如此高度的流动性和控制力，苏伊人实施征税并对货物进行选择性筛选。"
 sumo_heritage:0 "粟末靺鞨的传承"
 sumo_heritage_desc:0 "粟末部落属于更广泛的靺鞨民族的一支，以粟末靺鞨之名而闻名。他们因松花江而得名，这条江过去和现在都是中国的主要河流之一。粟末人（亦称粟末部）以穿着猪皮和/或狗皮制成的外套而著称，在与邻族和外来者中显得格外奇异。他们主要以定居为主，也从事养猪业，大量食用猪肉。"
 sushen_heritage:0 "黑龙传承"
 sushen_heritage_desc:0 "肃慎人定都于一个意为「黑水」的地方，与被称为「黑江」的阿穆尔河（黑龙江）有着深厚的渊源。他们可能使用某种通古斯语言，在《山海经》中被提及为东北部的一支部落，居住于冻土或靠近针叶林地区的上游草原。传说称他们同样地居住在洞穴与树上，使用最原始的木制和燧石工具狩猎。他们以成捆的箭矢向南方中原王朝纳贡。"
 susuya_heritage:0 "萨哈林传承"
 susuya_heritage_desc:0 "居住在黑江之岛上的铃谷人是西伯利亚和外满洲尼夫赫狩猎采集者的分支。与大陆上的同族不同，铃谷人与日本北部的绳文人大规模贸易，这从他们公元前5至4世纪的绳文晚期绳纹和梳齿纹陶器可见一斑。他们捕猎海生生物为食，并饲养许多狗，在艰难时期也会食用它们。"
 tabuk_heritage:0 "博塔克纹身的传承"
 tabuk_heritage_desc:0 "卡林加部落在很久以前便定居在塔布克地区。依靠该地区丰富的稻田和轮耕农业维持生计，卡林加人也受益于该地区悬崖和山坡中丰富的矿物和贵金属矿藏。他们的部落成员实践巴托克纹身艺术，在身体的大片区域刺上动物图案。他们信仰坚定，深信他们神圣的造物主曾与他们同住，并与祖先之灵一道激励着他们的日常生活。"
 tagbanwa_heritage:0 "塔格巴努瓦传承"
 tagbanwa_heritage_desc:0 "作为菲律宾最古老的民族之一，塔格巴努瓦人以他们的外表引起旅行者的注目。据说他们棕色皮肤、身材瘦削、头发直顺。他们与现代文莱周边地区的港口、部落群体和贸易伙伴保持着持续的海上和政治联系，参与了玉石贸易之外的贸易网络。他们用树皮——特别是树皮的内层——制作礼仪和传统服装，内层树皮用木槌敲打并塑形。"
 tahu_heritage:0 "台湾传承"
 tahu_heritage_desc:0 "作为古代西拉雅人及其先民的家园，大湖坐落在台湾岛西半部广阔的肥沃平原上。现代术语「台湾」即来源于他们的南岛语言。因此，他们是一个较为定居的民族，专注于农耕并充分利用大地的恩赐，同时守卫海岸和商业港口。在他们的社会中，劳动在男女之间分工，女性负责农耕和宗教活动，而男性则负责狩猎、战争和治理。"
 tenasserim_heritage:0 "海上吉普赛人的传承"
 tenasserim_heritage_desc:0 "环绕丹那沙林地区海岸的群岛是众多生命栖息的家园，从鲸鱼和伊洛瓦底海豚到鲸鲨和儒艮。海湾及横穿水域的红树林中如此多样的野生动物使人民得以重依赖渔业生活。然而，这些岛屿也成为中国及其他商人和水手的藏身之地以及通往开阔水域的替代路径，这些开阔水域常受季风和其他危险侵袭。因此，海岸为沿海定居点带来了财富，这些定居点也有自己的货物可供交易。古土瓦蕴藏着丰富的钨、锡及其他有用金属，可交易给更为集中的城邦文明。"
 teng_heritage:0 "滕国传承"
 teng_heritage_desc:0 "据说滕国由姬姓家族，即周朝的远亲，早在公元前1046年建立，但到了春秋时期，它已失去了对更大国家的权力和影响力，并作为附庸在越国和鲁国之间易手。这个城邦以其产生的伟大人物而闻名，包括创立墨家学派的著名哲学家墨翟（墨子），以及被称为鲁班的建筑师，后者在中国各地的木匠和建筑师中被尊为近乎神祇的人物。"
 thaton_heritage:0 "上座部诸神之殿的传承"
 thaton_heritage_desc:0 "虽然传说称直通是佛陀时代的产物，建于这位圣人住世之时，但更确凿的理解是直通王国至少从公元前4世纪就已存在。由于与印度和斯里兰卡的大规模贸易，许多佛教徒汇聚于此，为上座部佛教奠定了基础。这在很大程度上可以归功于目犍连子帝须，这位负责许多海外传教使命的僧侣。因此，在传说中，直通得名于Suvarnabhumi，意为「诸神之会」。因此，这个圣地成为此后佛教持续传播的基地。"
 tondo_heritage:0 "达图的传承"
 tondo_heritage_desc:0 "位于群岛吕宋岛帕西格河三角洲上的敦度港控制着该地区海上活动的战略部分。该港口及其附属定居点的规模和控制力几乎确保了太平洋岛屿与中国城邦和帝国之间贸易的垄断。敦度宗主权下的城市和村庄由地方达图统治，他们向敦度本身的最高首领汇报。除贸易货物外，敦度港也引入了许多外来者，从其他南岛定居者和商人到来自远方的印度和/或佛教僧侣及旅行者。"
 tusima_heritage:0 "日本门户的传承"
 tusima_heritage_desc:0 "对马（现代称为Tsushima）的居民生活在一片荒野之地——一个松散聚合成孤立岛屿形态的群岛。这片海滩与高地的延伸地带，既是朝鲜半岛与日本主要岛屿之间贸易、文化、信仰、政治与战争的通道，也是屏障。在和平时刻，对马人民在山丘上生长的吉野樱花间嬉戏，或追踪对马山猫，希望将其驯为宠物。传说这座岛屿是神道创世神伊邪那岐和伊邪那美最初创造的八座岛屿之一，自新石器时代或更早便有绳文日本人和朝鲜定居者居住。在公元前一千纪，它被记载为统治该地区的三十个联合国家之一——邪马台国的一部分，与日本本土的弥生人以及朝鲜的辰韩人进行贸易。"
 uyu_heritage:0 "雪蟹的传承"
 uyu_heritage_desc:0 "以其丰富的雪蟹（在较凉爽的亚热带气候中茁壮成长）而闻名，Uyu（亦写作U-yu）是辰韩部落北方分支之一的故乡。部落民众甚至可能崇拜这些大型无脊椎动物，将其与神明联系起来——也许是专门献给海神，或是某种更为奇特的存在。"
 wei4_heritage:0 "卫传承"
 wei4_heritage_desc:0 "三家分晋使卫人获得了自己的土地以供治理，这有赖于名将文所取得的军事胜利。随着时间推移，卫人与同族魏人渐生差异，他们更重视智识追求，而非武功成就。此举促进了社会进步，却也使军队在战场上的表现未能尽如人意。"
 wei_heritage:0 "魏国传承"
 wei_heritage_desc:0 "三家分晋使魏人获得了自己的土地以供治理，这有赖于名将文所取得的军事胜利。魏人以迅捷著称：其军队行军快于他邦，城市也如雨后菌菇般拔地而起；只是他们急于建设永久设施，基础营建往往不如他国周密。"
 woju_heritage:0 "沃沮传承"
 woju_heritage_desc:0 "由沃沮朝鲜人居住，沃沮如同天平上的一枚砝码，衡量着中国人势力与高句丽等大部族势力之间的平衡。然而，尽管它总是被更加中央集权的王国和部落拉拢和影响，却仍保留了自身的本土习俗和治理方式，民众坚守着海岸边较小的村庄和聚落，每个村庄都有世袭的首领，耕作着肥沃土地上盛产的五谷。他们的长矛守卫着沙滩，抵御外来入侵者，而少许马匹和牛则耕种田地，孩子们准备着精心安排的完美婚约。"
 xi_heritage:0 "巂传承"
 xi_heritage_desc:0 "如同他们的邻居——叟人和昆明部落一样，巂人的氏族将头发编成辫子。他们没有固定的居所，与畜群一起漫游牧场，在太平无事时表现得温和友善，但面对挑战时迅速战斗。同样，巂人的社会结构松散，统治者徒有其名，对人民几乎没有权力。"
 xi_zhou_heritage:0 "西周传承"
 xi_zhou_heritage_desc:0 "根据流传的故事，王城及其人民始建于公元前1021年，在古老的周国统治时期繁荣兴盛，在公元前771年至501年间作为东周王朝的首都。其位于中原大河沿岸的强大、通达且总体优越的地理位置，使其成为该地区传统的权力与尊崇之所在。"
 xiangkhoang_heritage:0 "巨瓮的传承"
 xiangkhoang_heritage_desc:0 "自公元前两千纪以来，这些人民便居住在川圹高原，穿越着所谓的“石瓮平原”。由于他们的土地开阔，没有许多山脉或其他天然障碍，大量贸易通过其边境流入中国南方地区。这片地貌因分布其间的巨大石瓮群而得名，这些石瓮可能是用来存放待运输或提取的货物的容器，或是在贸易开始前安全保管货物的地方。有些传说称，一个巨人种族曾行走于高原之上，由一位名叫坤壮的大王统治——这些石瓮便是他的造物，用来盛装米酒，以庆祝他的终极盛宴。"
 xiou_heritage:0 "西欧传承"
 xiou_heritage_desc:0 "西欧人民，亦称西瓯之民，长期以来被困于华南丛林的羁绊之中，靠近但从未触及南方海岸的富庶。由于不利的地理位置以及人力和财富的匮乏，他们常常受到更强中央集权群体的欺凌和摆布，例如历代南越王国。因此，他们的历史更多是被征服的历史，而非征服他人的历史。"
 xitu_heritage:0 "西屠传承"
 xitu_heritage_desc:0 "西屠人民是林邑本地人、来自西方诸岛的贸易商，以及在越南沿海社会迅速崛起的占族内陆人的混合体。占族融合了马来人、内陆人和南岛/波利尼西亚血统，为西屠的港口带来了更强的商业意识，因此每个沿海村庄的贸易和经济都蓬勃发展。锆石、黄金、玛瑙、红玉髓以及大量其他珍贵矿物和宝石从西方岛屿流入，可进一步销往内陆或北方的各大越人部落和王国。"
 yamato_heritage:0 "邪马台传承"
 yamato_heritage_desc:0 "大和之民天生善于统领，人口众多而富于生息，并因虔诚践行宗教传统而受到尊重。与邻邦相比，他们相对孤立的处境损害了外交声誉；外人传言他们并不信任陌生者。"
 yan_heritage:0 "燕国传承"
 yan_heritage_desc:0 "燕国位于北方草原诸国与南方定居文明之间，恰如一脚踏入两界。他们明白坚固堡垒网络的价值，这一手段得自文明邻邦；同时，燕人也重视强大的骑兵，这无疑源于他们与蛮族骑寇频繁交锋的经验。"
 yangyu_heritage:0 "苗裔传承"
 yangyu_heritage_desc:0 "阳禺作为古代苗族人和他们曾居住的三苗王国在被楚国支配后散落的残余而存在。据说所有苗族人都源自传说中的九黎部落，但他们在战斗中败给了大禹，因而被南进的越人民族驱散。其余的人则被中原地区的中国人征服。阳禺，实际上是楚国的傀儡，是苗族独立与伟大的最后一丝余晖。"
 yangyue_heritage:0 "南越传承"
 yangyue_heritage_desc:0 "作为众多依傍海岸的南方越人民族之一，扬越最早在战国时期被记载，是在古老的越国灭亡很久之后从中分裂出来的。在遥远的南方，扬越和百越人民依靠南海提供的商业机会繁荣发展。然而，由于财富日益增长，他们不断受到中原帝国的觊觎，这些帝国将更大群体的扬越和南越人民视为理想的附庸，既能巩固南方边境，又能确保一条横贯大陆东海岸至南端的持续海上贸易路线。"
 yayoi_heritage:0 "弥生传承"
 yayoi_heritage_desc:0 "弥生人的血统可追溯至新石器时代，与绳文人相比，他们最以在稻田中进行集约化水稻农业而闻名。他们不那么孤立主义，因此从中国引进了冶金和青铜制造技术，以及等级社会阶级的观念。他们愿意接受中国的影响，源于他们中许多人是从朝鲜半岛向东迁移到日本土地的朝鲜农民，并带来了他们的商业、社会、宗教和政治联系。在日本，他们将社会分层，创造了复杂精美的青铜器物，如仪式用钟、镜子和战争武器。他们更高大、更强壮，并看不起北方的绳文人。"
 yelang_heritage:0 "夜郎自大的传承"
 yelang_heritage_desc:0 "最早记载于公元前3世纪，夜郎政体由与半游牧和流动邻族之间的灵活边界所塑造。当地人民自称Zina，他们因此以该名而为人所知，而他们以东、以北的所有人民以及更广阔的地区也以类似的名字而闻名。虽然夜郎人仍为部落民众，但他们主要是一个由定居农业群体组成的联盟，仅因艰难的地理环境而彼此分隔。然而，尽管彼此分离并过着定居生活，当面对压倒性的困难时，夜郎人民仍团结成强大的军队，在数个世纪里击退了许多入侵。"
 yeodam_heritage:0 "飞灵传承"
 yeodam_heritage_desc:0 "处于亚热带湿润气候下，丽谭人民属于更具地方特色的弁韩部落，他们有本地的传统，如在墓葬陶器中埋入羽毛，使逝者到达来世后能够飞升天界。他们还实行全身纹身或动物图腾形象。"
 yeomhae_heritage:0 "廉海传承"
 yeomhae_heritage_desc:0 "自旧石器时代以来便有人类在此居住，墓葬中发现了石器。凭借深水良港般的海岸和丰富的矿产密度，廉海周边的土地一直有利于其作为城市的崛起。他们是宏伟的海上丝绸之路的积极参与者，能够进口波斯银器、玻璃和孔雀尾，以取悦贵族并令民众目眩神迷。"
 yilumo_heritage:0 "伊卢没的传承"
 yilumo_heritage_desc:0 "作为中国人在前往印度市场途中会经过或停留的城邦之一，伊卢没是孟加拉湾沿岸早期孟族定居点之一。虽然北印度领土向中国商人承诺珍珠和不透明玻璃，但伊卢没等沿海地点提供了一些较硬的贸易品，如原木和其他有助于促进贸易路线的天然必需品。"
 yiqu_heritage:0 "秦之宿敌的传承"
 yiqu_heritage_desc:0 "大约在公元前8世纪末定居，义渠国由远早于其定居存在的人民组成——义渠人作为一个“他者”长期存在于汉人中国的边界上，位于泾河以北。随着中央谷地的其他戎文化群体在数百年间被扩张主义的秦国攻击、同化或纳为附庸，义渠是剩余的一个堡垒，如鲠在喉般横亘在秦的咽喉。因此，义渠和秦的军队互相攻击对方的城池，土地来回割让，义渠国甚至在秦昭王年幼时就成了他的宿敌，延续着这场毁灭性的对抗。"
 yue_heritage:0 "越国传承"
 yue_heritage_desc:0 "越人因诸多技艺而受人尊重，其中金属加工传统尤为卓绝，同侪难及。他们亦以出色的航海者闻名，凭借数百年行舟水道的经验，在周边海域占据主导地位。"
 yueshang_heritage:0 "龙仙传承"
 yueshang_heritage_desc:0 "月商的东山人民，是居住在红河三角洲的雒越族群的兄弟姐妹，至少自公元前1000年以来便生活在此。作为熟练的水稻种植者和畜牧人，月商人民衣食无忧，拥有丰富的原材料可沿海岸道路进行贸易。他们也是青铜铸造者，以其墓葬中发现的铜鼓而闻名——他们使用从遥远北方的中国人那里借来的失蜡铸造工艺制作这些铜鼓。据说他们的统治者，半传奇的雄王的后裔，可以将其血统追溯至古老的、神一般的貉龙君和他的仙侣妪姬——因此月商人民是半龙半仙。"
 yulou_heritage:0 "黑水靺鞨的传承"
 yulou_heritage_desc:0 "挹娄是黑水靺鞨部落之一，生活在绥芬河沿岸。其部落群体的名称源自“黑水”之意。沿河流、寒冷的海岸和内陆森林迁徙，挹娄人能够获取来自日本北部的进口品，并能控制流向日本海的硬木和金属货物。"
 zhao_heritage:0 "赵国传承"
 zhao_heritage_desc:0 "赵国诞生于三家分晋之后。面对这一巨变带来的社会动荡，赵人不得不迅速适应新的现实，而他们在这一点上表现出色。虽然他们不善于经营新征服地区，但其军队以行军迅速而令人畏惧；这种本领正是在长期防范敌袭的过程中磨砺而成。"
 zhongshan_heritage:0 "中山传承"
 zhongshan_heritage_desc:0 "最早于公元前509年被提及，但远在此之前便由白狄人建立，中山国是中原地区战国中最令人意想不到、也最为顽强的国家。被其强大的邻国视为敌意，中山保留了源自部落起源的尚武文化，利用其训练有素、备战充分的人口来顽强地维护国家边界。当被魏国军队入侵时，中山贵族绑架了入侵将领的儿子，并将其烹为羹汤送给孩子的父亲。后来，他们在经历了一场残酷的战役后从魏国占领者手中重获独立。"
 zhou_heritage:0 "周传承"
 zhou_heritage_desc:0 "身为周人便意味着分享一种几乎无可比拟的荣耀：正是周人摧毁了商的权势，建立起延续至今的显赫王朝。虽然周的军事霸权已非昔日可比，不得不依赖野心勃勃的诸侯维系局面，但若断言周的荣光已永远消逝，仍为时过早。"
 zou_heritage:0 "邹传承"
 zou_heritage_desc:0 "自周武王时期以来，这个常被认为无关紧要的小城邦邹国的人民一直处于北方鲁国的支配、压力，有时甚至是宗主权之下。臣服带来了地区政治事务中地位较低的劣势，但也带来了强大而有影响力的人物涌入的优势，甚至包括学者和伟大思想家，他们会离开拥挤的曲阜城，寻求一个更安静、更不沉闷的学术舞台。"
 zuo_heritage:0 "筰传承"
 zuo_heritage_desc:0 "频繁出没于筰都遗址的筰人部落，是游牧和定居民族的混合体，他们孤立地依附于山脉所提供的保护之中。其中最强大的氏族被确定为冉和駹，以擅长山地作战和在战斗中的兵力优势而著称。"

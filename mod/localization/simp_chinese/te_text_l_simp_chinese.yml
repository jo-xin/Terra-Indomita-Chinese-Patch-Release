 convert_to_manichaean:0 "采纳摩尼教"
 convert_to_manichaean_desc:0 "研究诺斯替主义文本，被世界上伟大宗教的最后转世先知摩尼的生活和著作所感动，净化了腐败，并将境界奉献给这一新的启蒙。"

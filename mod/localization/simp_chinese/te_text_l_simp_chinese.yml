 ai_city_self_rule_desc:0 "信任和忠诚是相辅相成的。通过认可这个文化中一个更大社区的权利，给他们自己的选举机构、税收权利，甚至他们自己的军队，我们可以赢得那些留在城市边界之外的人的忠诚，只要我们足够稳定来提供这些。"

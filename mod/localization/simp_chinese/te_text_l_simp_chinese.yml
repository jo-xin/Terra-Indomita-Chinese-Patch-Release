 desc_christian_church_embelishment:0 "我们的大教堂最初是一个相当简陋的结构，通过基督教信徒的慷慨捐赠和圣彼得的代祷，我们的大教堂已经得到了美化。随着每一代人的成长，大教堂得到了加强，随着时间的推移，它的外观可能会正确地反映出主教作为使徒的继承人的席位。"
 desc_cursed_by_elohim:0 "我们唾弃犹太难民，拒绝为他们提供庇护，不幸降临到这片土地上。"

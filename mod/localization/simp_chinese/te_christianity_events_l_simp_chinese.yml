l_simp_chinese:
 church_of_edessa:0 "现在在[edessa_church_province.GetName]建立了一个基督教会。"
 embrace_gospel:0 "该统治者皈依了基督教，并得到了政治权力的祝福"
 minor_xian_char_create:0 "这一事件的发生是因为你们有大量的基督徒人口。"
 never_abandon_idols:0 "这位统治者将不会再看到这种景象。"
 te_christianity.10.a:0 "古老的众神如同沉默的雕像一样在一个被遗忘时代的黄昏消逝。"
 te_christianity.10.desc:0 "位于美索不达米亚西北部的埃德萨（现在的 Şanlıurfa）从使徒时代起就是讲叙利亚语的基督教的主要中心。从公元前132年起，它是一个独立王国的首都，被誉为希腊-叙利亚文化的重要中心。埃德萨还因其犹太社区而闻名，王室中也有改信者。埃德萨在战略上位于新月沃土的主要贸易路线上，从安提阿出发很容易到达，在那里开始了对外邦人的传教。当早期基督徒因受迫害而分散到国外时，一些人在埃德萨找到了避难所。因此，埃德萨教会的起源可以追溯到使徒时代（这可能是其迅速发展的原因），基督教甚至一度成为国教。东方教会很早就在上美索不达米亚的帕提亚帝国和罗马帝国之间的缓冲区成立了，被称为东方亚述教会。"
 te_christianity.10.t:0 "埃德萨教会"
 te_christianity.25.a:0 "这意味着什么呢？"
 te_christianity.25.desc:0 "一颗奇怪的亮星出现在夜空中，仿佛预示着一个巨大的事件。你不知道发生了什么，但世界感觉变了，不知为何。境界中明智的守望者告诉你这是一个强大的神灵的伟大预兆。这颗神秘的星星让民众感到恐惧。"
 te_christianity.25.t:0 "神秘的星星"
 te_christianity.41.a:0 "这里欢迎所有的神灵。这个人有什么不同？"
 te_christianity.41.desc:0 "据信，使徒托马斯受到攻击威胁时离开了印度西北部，乘船前往马拉巴尔海岸，途中可能访问了阿拉伯东南部和索科特拉岛，并在一位犹太商人的陪同下在繁荣的穆齐里斯港登陆（约公元50年）。托马斯为几个家庭进行了洗礼，即帕卡洛马托姆、桑卡拉普里、卡利、卡利扬卡等。据说他从那里开始在整个马拉巴尔海岸传讲福音。他建立的各个教会主要位于佩里亚尔河及其支流和喀拉拉邦沿岸，那里有犹太人的殖民地。"
 te_christianity.41.t:0 "圣托马斯旅行去印度"
 te_christianity.7.a:0 "我们必须在我们的人民放弃其公民义务之前取缔这种奇怪的迷信。"
 te_christianity.7.desc_1:0 "有消息传来，一种新的宗教从犹太地传播上来，并以其外来的教义感染了永恒之城[rome_church_province.GetName]。他们说，一个被作为罪犯钉在十字架上的人后来从死里复活，现在作为唯一的真神在位。神奇的传言比比皆是，这些邪教分子在晚上聚集在一起，吃这个神人的肉，喝他的血。最糟糕的是，这些狂热者拒绝向我们的罗马神和女神提供崇拜！"
 te_christianity.7.desc_2:0 "消息传到你耳中：一种新宗教已从犹地亚之地向上传播，并以其外来教义感染了[rome_church_province.GetName]城。他们说，一个作为罪犯被钉死在十字架上的人后来从死者中复活，如今作为唯一真正的神统治。各种离奇传闻四处流传，说这些邪教徒夜间聚集，吃这位神人的肉，饮他的血。最糟的是，这些狂热者拒绝向我们自己的任何男神女神献上崇拜！"
 te_christianity.7.t:0 "罗马教会"
 te_christianity.71.a:0 "是的，我接受这是神圣的旨意，并拥护凯乐符号的胜利。"
 te_christianity.71.b:0 "不！我拒绝这种令人不安的愿景，永远不会抛弃我自己的神灵！"
 te_christianity.71.c:0 "我不知道。让我想想这个醒着的梦。"
 te_christianity.71.desc:0 "当太阳的光辉在你的眼睛上移动时，你在冷汗中醒来。你深情地回忆起太阳神用花环为你加冕的景象，作为权力和力量的承诺。许多战斗的记忆在你的脑海中闪现，同时你考虑到你的统治的未来，以及什么方向对你的王国的繁荣是最好的。在天空中，有些东西出现在那里，奇怪而新奇，不像是云或任何自然的东西。难道又是太阳？\n\n突然间，太阳似乎变暗了，你把握住了另一个愿景。一股清凉的气息在风中呼啸而过，一道刺眼的光芒在天际闪过，不是来自太阳，而是仿佛超越了太阳，超越了它，某种巨大的力量超越了历史上所有的神和力量；现在--一个标志。一个巨大的十字形横梁上有一个符号……字母，不是拉丁文，而是希腊文……你敬畏地注视着。\n\n凉爽的空气让位于来自地平线周围发光但看不见的源头的强烈热量，它使你沐浴在光和温暖中，几乎燃烧起来。一种巨大的力量和信心的感觉充满了你。灿烂的字母形成鲜明的对比，成为焦点，仿佛使整个天空都成为你的眼睛所看到的画布。芝罗。\n\n在对它的含义感到惊奇之后，一个清晰的信息向你传达，就像一个雷鸣般的声音，但却是无声的、内在的，但在你的脑海中是无法辨认的。'在这个标志中，你将被征服。而意义是通过突然的理解来揭示的。这是\n基督\n的标志，ΧΡΙΣΤΟΣ，拿撒勒人耶稣的宗教称号，那个神秘的犹太人，在几个世纪前被钉死在十字架上，基督徒们把他誉为上帝的受膏之子——超越所有神的上帝。\n\n你现在也是一名基督徒吗？"
 te_christianity.71.t:0 "在此签名"
 te_christianity.8.a:0 "我们必须注意遏制这种危险的邪教，以免它压倒我们。"
 te_christianity.8.desc:0 "自从“基督徒”第一次出现在这些土地上，宣称有一个新的死而复生的神，但这次是以一个犹太人的形式出现的，即弥赛亚或基督耶稣，他实际上不到一个世纪前生活在巴勒斯坦，并在耶路撒冷的旧城被钉死。他的追随者声称，他在死后三天就复活了，他们说每个人都会在末日时从死里复活；任何崇拜他的人都会变得像神一样，但那些拒绝听从的人将永远坠入阴间。这些基督徒现在已经发展壮大，他们的社区——基督教会，现在已经在[antioch_church_province.GetName]建立起来了。"
 te_christianity.8.t:0 "安条克教会"
 te_christianity.9.a:0 "我们能做什么来阻止这种炫耀胜利的宗教的传播？"
 te_christianity.9.desc:0 "埃及的[alexandria_church_province.GetName]教会是由亚历山大牧首领导的基督教会。它是基督教最初的使徒教区之一，与罗马、安提阿和耶路撒冷并列。传统上认为，亚历山大教会是由福音书中的圣玛尔克在公元49年左右建立的，并声称对非洲大陆的所有基督徒有管辖权。"
 te_christianity.9.t:0 "亚历山大教会"
 te_christianity.99.a:0 "也许我们会审问这个狂热分子。"
 te_christianity.99.desc_1:0 "你注意到，一名上流社会的成员，虽然默默无闻，但作为一个被称为“基督教”的新宗教的追随者，已经声名鹊起。他们被看到参加了这些基督徒的聚会，这些基督徒公开宣称救赎只可能来自犹太上帝，他们相信上帝在犹太之地上化身为人。应该如何对待他们呢？"
 te_christianity.99.desc_2:0 "你注意到，一个上层阶级的成员，虽然默默无闻，但作为“基督教”新教派的追随者，已经声名鹊起。他们被看到参加了这些基督徒的聚会，这些基督徒公开宣称只有通过崇拜耶稣，即被钉在十字架上的拿撒勒人，才能获得救赎，他们仍然相信耶稣已经从死里复活，并作为犹太人的真正国王在位。应该如何对待他们呢？"
 te_christianity.99.t:0 "新受洗者"
 uncertain_evangel:0 "这种景象将会回来。"

l_simp_chinese:
 desc_when_horse_fuck_horse_no_fight:0 "我们最强壮和最大的战马在繁殖栏里享受着自己的乐趣，以增加它们的数量--你会在这样一个愉快的时间里战斗吗？"
 desc_when_horse_fuck_horse_no_fight_big_horse:0 "我们最强壮、最大的战马正在繁育栏中享受时光，以增加它们的数量——在这样美好的时光里，你还会去战斗吗？"
 embalming_administrator:0 "埋葬有才能的君主"
 embalming_administrator.tt:0 "你的上一任统治者最近去世，并且至少有#Y 10#! #G 智略#!@civic_icon!。"
 embalming_administrator_desc:0 "你的上一任统治者最近去世了。他们对你们国家的管理即使在草原上也是众所周知的。他们以激励大家更加努力工作而闻名。也许你应该为你的统治者进行防腐处理，从而继续激励工人们。"
 embalming_leader:0 "埋葬魅力非凡的君主"
 embalming_leader.tt:0 "你的上一任统治者最近去世，并且至少有#Y 10#! #Y 魅力#!@oratory_icon!。"
 embalming_leader_desc:0 "你的最后一位统治者最近去世了。他们的魅力甚至在遥远的印度也是有名的。如果你对尸体进行防腐处理，即使你的统治者死亡，你也会从中获利。"
 embalming_priest:0 "埋葬热枕的君主"
 embalming_priest.tt:0 "你的上一任统治者最近去世，至少有#Y 10#! #T 热枕#!@religious_icon!。"
 embalming_priest_desc:0 "你的上一任统治者最近去世了。他们的热忱在整个王国都能感受到。你应该将尸体进行防腐处理，这样你的统治者即使在死后也能继续传教。"
 embalming_warrior:0 "埋葬勇士君主"
 embalming_warrior.tt:0 "您的上一任统治者最近去世，并且至少有#Y 10#! #R 军略#!@military_icon!。"
 embalming_warrior_desc:0 "你的上一任统治者最近去世了。他们的武功在整个王国都很有名。你应该对尸体进行防腐处理，这样他们的名声就会永远流传下去……"
 gallic_smithy:0 "派人去找史密斯大师"
 gallic_smithy.tt:0 "你每五年才可以向铁匠大师发出一次请求。"
 gallic_smithy_desc:0 "你可以向一位铁匠大师发出请求。他将为你锻造一件物品，并给出适当的价格。有时，他将与其他工匠一起工作。"
 horse_breeding:0 "马的繁殖"
 horse_breeding_desc:0 "自从我们移民后，我们不得不离开我们雄伟的战马的祖先繁殖地。我们可以建造一个新的围栏，以再次增加它们的数量。"
 steppe_horse_breeding:0 "草原马的饲养"
 steppe_horse_breeding_desc:0 "自从我们迁徙后，我们不得不离开我们雄伟的战马的祖先繁殖地。我们可以建造一个新的围栏，以再次增加它们的数量。"
 when_horse_fuck_horse_no_fight_big_horse:0 "饲养马匹"
 when_horse_fuck_horse_no_fight_fast_horse:0 "培育草原马"

 HISTORIC_CHARACTER_UI_INFO_TOOLTIP:0 "#T 历史人物#!\n\n#color:{0.6,0.6,0.6} [CharacterWindow.GetCharacter.Custom('historic_character')]#!"
 historic_character_1:0 "“独眼”安提柯一世是一位马其顿希腊将军，也是亚历山大大帝的继业者之一。作为亚历山大军队中的杰出统帅，他在日后掌控了亚历山大帝国的大部分疆域，于公元前306年自封为“巴西琉斯”（Basileus，意为国王），自此执政至死。他是安提柯王朝的奠基者，该王朝日后统治了马其顿，直至公元前168年被罗马共和国征服。\n安提柯很可能早在马其顿国王腓力二世的统治期就为其效力。他参与了亚历山大对阿契美尼德波斯的远征，并被任命为弗里吉亚总督。公元前323年亚历山大逝世后，根据巴比伦分封协议，他获得潘菲利亚和吕基亚。但后来与亚历山大帝国摄政王佩尔狄卡斯结怨，被迫离开弗里吉亚，逃往希腊与安提帕特结盟，后又联合托勒密对抗佩尔狄卡斯。公元前320年，佩尔狄卡斯遭部下谋杀，安提帕特继任摄政王。在亚历山大继业者们的一系列战争中，安提柯曾短暂成为最强大的继业者，统治了希腊、小亚细亚、叙利亚、腓尼基及美索不达米亚北部，以至卡山德、塞琉古、托勒密和吕西马科斯结成联盟与他对抗，最终使他败亡于公元前301年的伊普苏斯战役中。其王国被吕西马科斯和塞琉古瓜分，但其子德米特里幸存下来，并在公元前294年夺取了马其顿的统治权。\n安提柯约于公元前382年出生于马其顿，父亲是名为腓力的贵族，母亲姓名不详。尽管对其家族社会背景存在不同说法，安提柯也很可能出身贵族。关于安提柯早年的经历所知甚少。他必然是马其顿军队的要员，因史料记载初现时他已统领亚历山大大军的重要部分（安提柯指挥亚历山大的七千希腊盟军步兵）。普鲁塔克记载，有位安提柯在围攻伯林苏斯（公元前340年）时被投石机弩箭击中而失明。鉴于安提柯与腓力同龄且出身贵族，他几乎肯定参与过腓力征战时期的事务，甚至可能效力于腓力的兄弟（亚历山大二世与佩尔狄卡斯三世）麾下。他在腓力宫廷中的重要性，可从他与安提帕特和欧迈尼斯——腓力两位主要副将——建立的友谊中得以印证。"
 historic_character_2:0 "卡山德是安提帕特之子，希腊马其顿王国的国王，于公元前305年至公元前297年统治着马其顿，并自公元前317年起实际统治着希腊南部，直至去世。\n\n作为亚历山大大帝的同辈，在其于公元前323年去世后，卡山德成为了争夺其帝国的继业者之一，后来通过谋杀亚历山之子兼继承人亚历山大四世夺取了权力。在公元前317年至公元前297年统治马其顿期间，卡桑德尔致力于加强北部边境防御和经济发展，同时建立或重建了若干城市；然而，他对政敌的残酷手段使得对其统治的评价毁誉参半。"
 historic_character_3:0 "“救主”托勒密一世是马其顿希腊将领、史学家，亚历山大大帝的继业者之一。他于公元前305年开创了以埃及为中心的托勒密王国，建立了绵延至公元前30年的托勒密王朝。自公元前305年（或304年）起，他成为托勒密埃及的巴西琉斯与法老，直至去世之时。在他统治下的埃及成为希腊化文明的繁荣堡垒，亚历山大港也发展为希腊文化的重镇。\n\n托勒密一世身世存在争议：其母为马其顿的阿耳西诺伊，父亲则可能是其夫拉古斯，也可能是马其顿的腓力二世——尽管后者多为托勒密王朝为神化统治而虚构的传说。作为亚历山大最信任的部将，公元前323年大帝驾崩后，托勒密拦截了运往马其顿安葬的灵柩，将其暂厝孟菲斯，后迁葬亚历山大新城陵墓。他随后加入反对腓力三世的摄政王佩尔狄卡斯的联盟，在公元前320年成功抵御入侵埃及的佩尔狄卡斯，致其部下哗变弑主，从而巩固了统治。历经继业者战争侯，托勒密获得叙利亚南部犹地亚地区的宣称权（尽管与塞琉古一世存在拉锯），并控制塞浦路斯与昔兰尼加，后者被交由其继子马加斯治理。著名的亚历山大图书馆亦由他下令建造。\n\n托勒密一世可能在亚历山大活着时娶了其情妇泰伊丝，日后遵照亚历山大旨意迎娶了波斯贵妇阿尔塔卡玛。后来他又娶了马其顿摄政王安提帕特之女欧律狄刻；他们的儿子托勒密·克劳诺斯和墨勒阿革洛斯先后成为马其顿国王。托勒密最后一次婚姻对象是欧律狄刻的表亲兼侍女——贝雷尼刻一世。托勒密一世于公元前282年逝世，其与贝雷尼刻所生之子托勒密二世继位。"
 historic_character_4:0 "塞琉古一世“胜利者”是马其顿希腊人，亚历山大大帝的将军、亲信与继业者之一，他最终建立了以自己名字命名的塞琉古帝国，并由塞琉古王朝统治。在亚历山大逝世后接踵而至的权力斗争中，塞琉古从一名次要角色逐步崛起，最终成为小亚细亚、叙利亚、美索不达米亚及伊朗高原的最高统治者，并正式加冕为巴西琉斯（帝王）。塞琉古帝国成为希腊化世界的主要强权之一，直至公元前二世纪末至前一世纪初先后败于罗马共和国与帕提亚帝国。\n\n在亚历山大麾下效力期间，塞琉古担任银盾兵——马其顿步兵精锐——的统帅。公元前323年6月亚历山大去世后，塞琉古起初支持帝国摄政佩尔狄卡斯，并在巴比伦分封中获任王家近身卫队统帅及千人长。然而在公元前322年继业者战争爆发后，佩尔狄卡斯在埃及对托勒密的军事行动屡遭失败，导致其部队于佩卢西翁发生兵变。佩尔狄卡斯随后在一场由塞琉古、培松和安提柯参与的阴谋中遭到背叛并被暗杀，时间大约在公元前321或320年。在公元前321年的特里帕拉迪苏斯分封中，塞琉古被新任摄政安提帕特任命为巴比伦总督。然而继业者之间的战争几乎立刻再度爆发，实力最强的继业者之一安提柯迫使塞琉古逃离巴比伦。直到公元前312年，塞琉古在托勒密的支持下才得以重返巴比伦。自此，塞琉古开始毫不留情地扩张自己的领土，最终征服了波斯与米底之地。塞琉古不仅统治了巴比伦尼亚，更掌控了亚历山大帝国的整个东方半壁江山。\n\n塞琉古进一步声称对犍陀罗和印度东部的原总督区拥有继承权。然而这些企图遭到孔雀帝国君主旃陀罗笈多·孔雀的挑战，最终引发了塞琉古‑孔雀战争（公元前305–303年）。这场冲突最终通过和约得以解决，孔雀帝国吞并了这些东方行省。此外，据斯特拉波与阿庇安记载，旃陀罗笈多还通过迎娶塞琉古的女儿，使双方缔结了婚姻同盟。"

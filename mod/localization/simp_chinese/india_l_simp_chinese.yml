 ajivika_brahmin_rights_law:0 "确立吠陀祭祀"
 ajivika_brahmin_rights_law_desc:0 "当我们在宗教实践中恢复或采用古代雅利安人的仪式时，婆罗门会感到振奋。然而，提供血祭有悖于阿含沙的原则，会使信徒们感到不安。"
 ajivika_caste_law:0 "正命派种姓法"
 ajivika_emancipation_law:0 "通婚合法化"
 ajivika_emancipation_law_desc:0 "允许不同种姓的通婚与共餐。许多婆罗门警告说，这将使我们的社会走向崩溃。"
 ajivika_flavor.1.a:0 "阿吉维卡人将为他们的违法行为付出代价!"
 ajivika_flavor.1.b:0 "这些都是毫无根据的指控，我们不会做任何事情。"
 ajivika_flavor.1.desc:0 "没有人知道是怎么发生的，也没有人知道是谁，但在Pundravardhana，一个佛教家庭的房子被烧毁了，结果是他们的家人中有人死亡。人们要求报应。暴民规则已经认定敌对的阿吉维卡教派有罪，如何处理他们的惩罚就看你的决定了。"
 ajivika_flavor.1.t:0 "佛教僧侣被谋杀!"
 ajivika_flavor.2.desc:0 "作为对谋杀和焚烧佛教僧侣的报应，整个阿吉维卡教派都要付出代价。18,000名阿吉维卡人被屠杀了。他们下次在对我们伟大的佛教信仰进行愚蠢的攻击之前会三思而行。佛教公民为这次清除异端而欢欣鼓舞。"
 ajivika_flavor.2.t:0 "庞德拉瓦达那的清洗"
 ajivika_flavor_2.a:0 "摆脱困境的好办法。"
 ajivika_social_harmony_law:0 "给予吠舍人的权利"
 ajivika_social_harmony_law_desc:0 "劳动人民是大地的盐。"
 ashes_of_buddha_treasure:0 "佛骨舍利"
 ashes_of_buddha_treasure_desc:0 "佛陀去世后，他的身体被火化，他的骨灰被分给他的追随者。虽然不可能找到所有的骨灰，但大量的骨灰已经被收集起来。"
 bac_insult_sent:0 "侮辱性的巴克特里亚来信"
 bhadrabahu.1.a:0 "人们用自己的眼睛看到了真相"
 bhadrabahu.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们听说到一位著名的耆那教僧侣，一位名叫婆达罗巴忽的人，从孔雀王朝越过边境，来到了我们的土地上。我们邻国的政治不稳定似乎使我们自己的国家成为难民的一个有吸引力的选择，但我们并没有想到像僧统婆陀罗这样的人也回来——我们的人民已经感受到了他的存在，他们每天都聚集在一起听布道，参加冥想。"
 bhadrabahu.1.t:0 "奇迹般的事件"
 bhadrabahu.2.a:0 "嗯，我想这对他们很好。我想知道这一切意味着什么"
 bhadrabahu.2.desc:0 "抱歉这么晚打扰了您，尊敬的[ROOT.GetCountry.GetRuler.GetName]，但在忘记之前，我们想顺便提一件小事。有消息称，在遥远的北方，一个伟大的耆那教理事会召开了会议，所有的宗教名人都聚集在一起。其中包括一直与我国人民在一起的僧人僧统婆陀罗，看来他正准备离开我国。"
 bhadrabahu.2.t:0 "建立耆那教理事会"
 bhadrabahu.3.a:0 "希望一切顺利-我们期待着听到消息"
 bhadrabahu.3.desc:0 "因为我们一直在关注耆那教僧侣僧统婆陀罗的旅途，我们认为值得一提的是，在我国短暂停留后，他已返回北部的孔雀王朝，加入正在召开的耆那教理事会。已经有报道称，各教派之间的关系紧张，这是会议最初被召集的原因。所有人都希望最终的结果是积极的，但很难调和一些截然相反的观点。"
 bhadrabahu.3.desc2:0 "我们收到了来自北方的消息，由通常对这类事情不感兴趣的商人传递——耆那教理事会终于成立了，并由一位你已经听说过的僧统婆陀罗领导。已经有报道称，各教派之间的关系紧张，这是会议最初被召集的原因。所有人都希望最终的结果是积极的，但很难调和一些截然相反的观点。"
 bhadrabahu.3.t:0 "来自耆那教理事会的讯息"
 bhadrabahu.4.a:0 "我们支持天衣派甚于他者。"
 bhadrabahu.4.b:0 "我们支持白衣派，因为我们认为他们的教导是正确的。"
 bhadrabahu.4.desc:0 "尽管长达数年的饥荒对当地造成了破坏，会议在这种严峻的背景下召开，但对维护和平感兴趣的人来说，耆那教理事会最终还是以一个不愉快的结局结束了。尽管我们编纂了神圣文本并将其记录下来，以便能够让这辈人和后来者中记住他们的教义取得了进展，但事情的发展已经崩溃。\n\n似乎婆达罗巴忽曾经的学生，施菟罗跋得罗，对他的老师发表了反对意见，将所有人分成了两个阵营；施菟罗跋得罗和他的追随者认为裸体是神圣的，是更好的生存方式，他们放弃了穿衣服——他们称自己为白衣派，只允许男性加入他们的行列。婆达罗巴忽强烈反对，宣称这是一种异端，而那些站在这位可敬的老师一边的人则自称天衣派。\n\n公众对[ROOT.GetCountry.GetRuler.GetName]施加压力，要求其公开选择一方——我们将在短时间内直击这一难题。"
 bhadrabahu.4.t:0 "耆那教分裂"
 bhadrabahu.4.tt:0 "旃陀罗笈多深信教义的真实性，与僧侣婆达罗巴忽一起潜逃到南方。"
 bhadrabahu.4.ttt:0 "婆达罗巴忽对这个结果感到厌恶，将永远离开。"
 bhadrabahu.5.a:0 "能活目睹这样的事情……我们真的很幸运"
 bhadrabahu.5.desc:0 "婆达罗巴忽，耆那教僧侣和天衣派的领袖，在这一点上他的功绩近乎传奇，他终于从凡人的领域进入了永恒的幸福状态。他的追随者们宣称他是五世舒拉塔瓦林，一个完全了解我们教义的人。并将婆达罗巴忽的教义广为传播。我们相信，这位僧侣一生的影响在他死后会远远大于生前。"
 bhadrabahu.5.t:0 "婆达罗巴忽之死"
 blood_of_menander:0 "米南德的血脉"
 blood_of_menander_desc:0 "“救主”米南德一世出自欧西德摩斯家族，是印度-希腊王国的国王。他统治着印度北部的广袤土地，以皈依佛教与多次深入印度次大陆的征伐而闻名。据希腊地理学家斯特拉波记载，米南德“征服的部落比亚历山大大帝还要多”。\n\n#G 该特质可通过母系或父系传承。#!"
 buddhist_basic_rights_law:0 "给予吠舍权利"
 buddhist_basic_rights_law_desc:0 "劳动之人如大地之盐。"
 buddhist_caste_law:0 "佛教种姓法"
 buddhist_emancipation_law:0 "通婚合法化"
 buddhist_emancipation_law_desc:0 "允许不同种姓的通婚与共餐。许多婆罗门警告说，这将使我们的社会走向崩溃。"
 buddhist_flavor_1.a:0 "祝福"
 buddhist_flavor_1_desc:0 "若能建立苦空无常无我之正知见，皈依三宝，受持圣戒，永断身见、戒取、疑三结，则预于流，得须陀洹果，不堕恶道。"
 buddhist_flavor_1_title:0 "须陀洹果"
 buddhist_flavor_2.a:0 "祝福"
 buddhist_flavor_2_desc:0 "须陀洹能常思维身非我、受为苦、心无常、法无我。依正思惟所得正见断恶修善，持戒、布施，贪、嗔、痴三毒薄。则得斯陀含果。"
 buddhist_flavor_2_title:0 "斯陀含果"
 buddhist_flavor_3.a:0 "祝福"
 buddhist_flavor_3_desc:0 "斯陀含继续依正思维精进勤修。得贪、嗔、身见、戒取、疑五下分结尽断，不复再起，不还此世。则得阿那含果。"
 buddhist_flavor_3_title:0 "阿那含果"
 buddhist_flavor_4.a:0 "我被告知我有一天也能成为神！"
 buddhist_flavor_4_desc:0 "阿那含继续依正思惟精进勤修。断除色界、无色界诸念；断无明结、骄慢结；具足四谛智慧，断一切烦恼。则得阿罗汉果。"
 buddhist_flavor_4_title:0 "阿罗汉果"
 buddhist_flavor_5.a:0 "启蒙已经到来"
 buddhist_flavor_5_desc:0 "公平地说，你已经被你在通往启蒙之路上所经历的心理和精神过程完全改变了。在这个世界上，无数的灵魂盲目地生活着，过着每天的生活，却没有意识到他们真正的潜力，成为欲望的奴隶，你已经超越了自由的领域，你的痛苦结束了;你是觉醒者。"
 buddhist_flavor_5_title:0 "菩提萨埵"
 buddhist_social_progress_law:0 "给予首陀罗权利"
 buddhist_social_progress_law_desc:0 "让我们睁开眼睛看看是什么把我们大家——甚至我们中最可怜的人团结在一起。"
 buddhist_treasures_of_india:0 "印度的佛教宝藏"
 buddhist_treasures_of_india_desc:0 "收集我们这个时代的许多伟大的佛教作品，将他们所有的伟大教义编入一个单一的文本。"
 celebration_of_rishabhanatha:0 "勒沙婆那陀的庆祝"
 choice_of_personal_deity_hindu:0 "选择个人神祇"
 choice_of_personal_deity_hindu_desc:0 "每个印度统治者都可以选择自己的神灵。这种选择将持续到统治者的一生，或直到有事件改变它。"
 default_ajivika_caste_law:0 "维护刹帝利的特权"
 default_ajivika_caste_law_desc:0 "刹帝利值得特别尊重，因为他们是保护王国的人。"
 default_buddhist_caste_law:0 "维护刹帝利的特权"
 default_buddhist_caste_law_desc:0 "刹帝利值得特别尊重，因为他们是保护王国的人。"
 default_hindu_caste_law:0 "传统种姓制度"
 default_hindu_caste_law_desc:0 "传统的种姓系统已经存在了数百年之久。"
 default_jainist_caste_law:0 "维护刹帝利人的特权"
 default_jainist_caste_law_desc:0 "刹帝利值得特别尊重，因为他们是保护王国的人。"
 dharana_modifier:0 "掌握执持"
 dharana_tooltip:0 "在制定这项法律之前，你必须掌握执持。"
 dhyana_modifier:0 "掌握入定"
 dhyana_tooltip:0 "你必须先掌握入定，才能制定这项法律。"
 fasting_for_paryushana:0 "在波渝沙那节斋戒"
 first_jain_council_mod:0 "这个行省有一个耆那教理事会，所有的神学家和著名的苦行僧聚集在一起讨论宗教政策问题。"
 first_jain_council_mod_desc:0 "这个省正在召开耆那教理事会，所有的神学家和著名的苦行僧都聚集在一起讨论宗教政策问题。"
 form_indo_gk:0 "印度-希腊王国"
 form_indo_gk_desc:0 "东方的朋友、帝国和财富的诱惑使我们中的许多人认识到，在亚历山大帝国的废墟上奋斗可能不是一个值得追求的目标。更大的荣耀在印度河以外的地方，那里才是我们的归宿。我们必须向印度这块神秘的土地扩张。"
 form_indo_gk_tooltip:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 将接受$indo_greek_heritage$"
 formable_not_indus_exists:0 "印度王国一定不存在。"
 hindu_caste_law:0 "吠陀教种姓法"
 hindu_flavor_1.a:0 "奎师那"
 hindu_flavor_1.b:0 "恒伽"
 hindu_flavor_1.c:0 "沙克谛"
 hindu_flavor_1.d:0 "湿婆"
 hindu_flavor_1.e:0 "苏利耶"
 hindu_flavor_1.f:0 "毗湿奴"
 hindu_flavor_1.g:0 "佛陀"
 hindu_flavor_1.h:0 "牟娄犍"
 hindu_flavor_1.i:0 "迦絺吉夜"
 hindu_flavor_1_desc:0 "每个印度教治者都可以选择自己的神灵。这种选择在统治者的一生中都会持续下去，或者直到某个事件改变它。额外的神灵可以从事件和使命任务中获得。"

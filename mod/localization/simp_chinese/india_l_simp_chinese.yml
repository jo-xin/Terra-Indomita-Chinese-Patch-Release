 hindu_treasures_of_india_desc:0 "收集我们这个时代的许多伟大的吠陀教作品，把他们所有的伟大教义编成一个单一的文本。"
 hindu_vaishya_law:0 "给予吠舍权利"
 hindu_vaishya_law_desc:0 "劳动之人如大地之盐。"
 indo_greek.1.a:0 "印度次大陆的其余地区已可顺势吞并。"
 indo_greek.1.desc:0 "我们已经征服了犍陀罗的肥沃平原，并控制了印度河上游的河谷。尽管这一地区大部分地区仍未平定，但在未来几年内可能会成为我们帝国的权力中心。在这次征服中，一个新的国家出现了；一个印度-希腊王国，它构成了希腊世界最东边的边疆。"
 indo_greek.1.t:0 "统一印度-希腊王国"
 jain_flavor.1.a:0 "尽我们所能阻止这一切发生在我们身上。"
 jain_flavor.1.b:0 "我们的口袋空空，似乎很快粮仓里的粮食就会耗尽。"
 jain_flavor.1.desc:0 "我们从外国听闻饥荒的噩耗，我们向慈悲之神祈祷，希望这种毁灭性的苦难不要降临我们的国土。似乎众神已经放弃了摩揭陀，这相当异常；尽管拥有物质财富和权力，孔雀王朝的王者却沦落到手脚并用、肚子突出、四肢消瘦的地步。"
 jain_flavor.1.t:0 "摩揭陀的饥荒"
 jain_flavor.10.a:0 "朝圣者的增多将提升我们商人的销售额"
 jain_flavor.10.b:0 "..."
 jain_flavor.10.desc:0 "所有的城市和农村都在准备度过一个宗教节日。满月节回忆了第一位提尔坦卡拉勒沙婆那陀的所作所为，他通过感激地伸出手喝甘蔗汁来打破他的神圣斋戒。那些有能力去朝圣的人会去重现勒沙婆那陀的行迹，去他曾经去过的地方巡礼，而那些没有办法这样做的人会通过斋戒来纪念提尔坦卡拉。斋戒期结束后，会有大家期待的庆祝活动。"
 jain_flavor.10.t:0 "满月节"
 jain_flavor.2.a:0 "我们很高兴听到这场灾难的结束"
 jain_flavor.2.b:0 "..."
 jain_flavor.2.desc:0 "最后，经过了一段漫长的、以至于我们一想到死者就感到心痛的时光，似乎困扰摩揭陀的饥荒终于结束了。今年的收成比过去几年都好，粮食进口也开始改善，市场上的粮食和油料价格也再次变得可以承受。民众不再因饥饿和绝望而陷入疯狂的状态，以至于不得不煮树皮和喝草汤——天神再次祝祐摩揭陀。"
 jain_flavor.2.t:0 "饥荒的结束"
 jain_flavor.8.a:0 "是时候斋戒了！"
 jain_flavor.8.b:0 "即将举办盛大的节日！"
 jain_flavor.8.c:0 "时机未到。"
 jain_flavor.8.desc:0 "波渝沙那节即将来临，在这一年里，兄弟之间累积的罪恶被遗忘，在Kshamavani和Samvatsari神圣的日子里，悔悟的宽恕精神抓住了人们的心。社区将团结在一起，铭记我们神圣的教诲，为来年重新振作精神。"
 jain_flavor.8.t:0 "波渝沙那节"
 jain_flavor.9.a:0 "愿大雄的精神与我们同在"
 jain_flavor.9.b:0 "..."
 jain_flavor.9.desc:0 "我们教历中最神圣的节日之一，大雄胜日就在这里，因为今天我们必须记住这个时代最后一位提尔坦卡拉的诞生。现在，人们为仪式游行准备了一座大雄的雕像，它将被拉上一辆马车，穿过城市的中心。慈善和感恩的精神弥漫在节日中，人们通过互相敞开心扉和口袋来表达他们的感激之情。"
 jain_flavor.9.t:0 "大雄胜日"
 jainist_brahmin_rights_law:0 "建立吠陀祭祀制度"
 jainist_brahmin_rights_law_desc:0 "当我们在宗教活动中恢复或采用古代雅利安人的仪式时，婆罗门会感到振奋。然而，提供血祭有悖于阿訇的原则，会使信徒们感到不安。"

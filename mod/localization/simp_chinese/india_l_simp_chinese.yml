 jainist_emancipation_law_desc:0 "允许不同种姓的通婚与共餐。许多婆罗门警告说，这将使我们的社会走向崩溃。"
 jainist_social_harmony_law:0 "给予吠舍权利"
 jainist_social_harmony_law_desc:0 "劳动之人如大地之盐。"
 magadha_famine_mod:0 "摩揭陀的饥荒"
 mahavirs_guidance_mod:0 "大雄的指引"
 master_dharana:0 "执持大师"
 master_dharana_desc:0 "练习执持时，感知者完全集中在一个单一的对象上，称为因缘（钵罗底也）。他努力阻挡干扰性的想法，保持对因缘的专注。执持是深度集中冥想的第一步，通过它，因缘被牢牢地保留在头脑中，但感知者仍然意识到自己、被感知的对象和冥想的行为之间的分离。在吠陀教中，执持是帕坦伽利《瑜伽经》中八支行法中的第六步。"
 master_dhyana:0 "禅定大师"
 master_dhyana_desc:0 "当感知者掌握了入定，他就能把意识完全集中在沉思的对象（因缘）上。在这一点上，他掌握了自己作为感知者、被感知对象（因缘）和感知行为所形成的三分法。通过学习尽量减少他作为感知者的角色，他达到了入定——一种意识状态，在这个过程中，他与被感知的对象融合在一起，达到无我之境。禅定与执持不同，前者不会积极地参与到关注的对象中。在入定中，感知者不知道入定的行为，只意识到他的心和因缘的存在。禅定在耆那教、佛教和印度教传统中的含义略有不同。它可能始于古印度的斯拉曼文化（公元前6世纪），并在三教中平行发展，相互影响。在印度教中，禅定是钵颠阇利《瑜伽经》中八支行法中的第七步。"
 master_samadhi:0 "三昧大师"
 master_samadhi_desc:0 "当感知者能在较长的时间内持续专注于因缘，至于彻底地无我之境时，则从入定达到三昧（三摩地），感知者与因缘融为一体。在《瑜伽经》中，圣人钵颠阇利把这比作把一颗透明的宝石放在一个彩色的表面上，宝石似乎变成了同样的颜色。当至于三昧时，感知者的意识与思想的对象，即因缘融合在一起。因缘就像彩色的表面，而感知者的意识就像透明的宝石。三昧是自我的消解，是佛教八正道的最后一个要素。在印度教中，它是《瑜伽经》的第八支，继第六支（执持）和第七肢（入定）之后。"

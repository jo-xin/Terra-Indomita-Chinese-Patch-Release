 treasure_dhammacakkappavattana_sutta:0 "三转法轮经"
 treasure_dhammacakkappavattana_sutta_desc:0 "相传，佛陀于十二月初八日成道，十五日为懦陈如等五比丘宣说四谛，因从不同角度讲述三遍，称三转十二行相，遂成此经。后世视其为佛陀之开教宣言与佛教教义之基石。"

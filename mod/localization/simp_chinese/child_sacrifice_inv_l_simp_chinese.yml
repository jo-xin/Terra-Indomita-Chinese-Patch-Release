l_simp_chinese:
 child_sacrifice:0 "牺牲儿童"
 child_sacrifice_dec.tt:0 "你需要在过去的#Y 10#! 年中没有成功地献祭过一个孩子。"
 child_sacrifice_desc:0 "以众神的名义献上一个高贵的孩子，如果众神同意，他们将赐予你的土地以祝福。然而，如果祭品的价值不够高，他们会惩罚你的人民。\n\n神圣的恩惠可能是面对你目前的危机所需要的，然而，谴责可能会结束你的统治。"
 child_sacrifice_inv.1.a:0 "[SCOPE.sCharacter('sacrifice_1')GetName]将被献祭!"
 child_sacrifice_inv.1.b:0 "[SCOPE.sCharacter('sacrifice_2')GetName]将被献祭"
 child_sacrifice_inv.1.c:0 "[SCOPE.sCharacter('sacrifice_3')GetName]将被献祭"
 child_sacrifice_inv.1.d:0 "三个人总比一个人好。"
 child_sacrifice_inv.1.d.tt:0 "你的统治者不是精神错乱就是特别虔诚。"
 child_sacrifice_inv.1.desc:0 "最近，#Y [SCOPE.GetRootScope.GetCountry.GetName]#! 遭到了不幸的打击。法庭上出现了一些流言蜚语，说你没有能力执政。然而，并非所有事情都是#Y [ROOT.GetCountry.GetRuler.GetPraenomen]#!的错。最近的战争破坏了王国的稳定。人民不高兴，军队因最近的失败而灰心丧气。\n#Y [SCOPE.sCharacter('murder_priest')GetName]#! 提出了一个历史悠久的仪式来恢复民众的信心。通过向诸神献祭一个孩子，我们肯定会得到他们的青睐。他们一定会保佑我们，只要我们选择一个有价值的祭品......"
 child_sacrifice_inv.1.e:0 "我们会找到另一种方法。"
 child_sacrifice_inv.1.e.tt:0 "你们的统治者要么不相信宗教的说法，要么没有心思去杀孩子。"
 child_sacrifice_inv.1.t:0 "为神灵献身"
 child_sacrifice_inv.2.a:0 "赞美诸神。"
 child_sacrifice_inv.2.desc:0 "诸神对我们微笑。他们认为我们的牺牲是值得的。他们发出了一个预兆。我们的公牛比以前更健康了。祭司们向我们保证，我们已经得到了祝福。\n我们的军队又有了精神，战斗力比以前更强。奴隶们欢欣鼓舞，贵族们松了一口气，因为未来是安全的。民众的支持增加了，你的治理现在也被接受了。"
 child_sacrifice_inv.2.t:0 "一个吉祥的预兆"
 child_sacrifice_inv.3.a:0 "我们感谢诸神。"
 child_sacrifice_inv.3.desc:0 "祭司告诉我们，众神对我们的祭品很满意。他们在昨晚宰杀的公牛的肠子里发现了一个图案。这清楚地表明，众神认可我们的祭品，为此他们给予我们一个小小的恩惠。巴勒会让我们的土地多下点雨。\n农民们现在对未来更有信心，又开始耕种田地了。市民和贵族们已经开始再次接受你的统治。"
 child_sacrifice_inv.3.t:0 "充满希望的征兆"
 child_sacrifice_inv.4.a:0 "这是个错误。"
 child_sacrifice_inv.4.desc:0 "已经很久没有下雨了。也许这是诸神的征兆？牧师们这样解释。你在有名望的人中的地位进一步下降，更多的农村臣民开始质疑你的统治能力......\n祭品一定不符合雨水之主巴力的口味。我们现在要为提供劣质的贡品付出代价。"
 child_sacrifice_inv.4.t:0 "不祥的征兆"
 child_sacrifice_inv.5.a:0 "我们注定要失败"
 child_sacrifice_inv.5.desc:0 "风暴已经蹂躏了我们的舰队，封锁了我们的港口，已经有好几个星期了。诸神肯定在惩罚我们，因为我们向他们提供了最低级的祭品，而这个孩子并不适合。此外，我们的祭司没有很好地完成仪式，因为他们太匆忙了。这肯定激怒了众神，因为我们不能进行贸易或捕鱼。更糟糕的是，我们的部分雪松林已经被烧毁。"
 child_sacrifice_inv.5.t:0 "灾难性的预兆"
 child_sacrifice_inv.6.a:0 "至少孩子们是安全的"
 child_sacrifice_inv.6.desc:0 "我们的臣民已经预料到了会动摇神灵的牺牲，然而#Y [ROOT.GetCountry.GetRuler.GetPraenomen]#! 刚刚下令，没有孩子会被牺牲。他们将来会成为我们国家需要的聪明人，无论是作为母亲还是战士。\n这个决定会遭到反对，这并不意外。现在，全国各地再次爆发了抗议活动。我们应该做好最坏的打算..."
 child_sacrifice_inv.6.t:0 "灰心丧气的民众"
 desc_not_sacrificed:0 "这个角色没有被牺牲，为此他或她会感激不尽......至少在一段时间内。"
 desc_restless_population:0 "人民对未来没有安全感，他们的统治者也没有向神明提出要求......"
 desc_sacrifice_bad:0 "诸神很失望。牺牲是不值得的。下一次，他们可能不会再对我们这么宽容了。毕竟，我们仍然在地球上行走。"
 desc_sacrifice_good:0 "我们的国家得到了诸神的祝福，在我们为他们牺牲了一个高贵的孩子之后，他们现在得到了安抚。"
 desc_sacrifice_meh:0 "诸神很失望。祭品并不符合他们的口味。为此，他们惩罚了我们。"
 desc_sacrifice_ok:0 "我们的国家已经得到了诸神的一个小恩惠，他们现在被安抚了。在未来，可能需要更多的祭品来让他们高兴。"
 not_sacrificed:0 "未被献祭"
 restless_population:0 "躁动的人口"
 sacrifice_bad:0 "神圣的失望"
 sacrifice_good:0 "神圣的批准"
 sacrifice_meh:0 "神的失望"
 sacrifice_ok:0 "神圣的批准"

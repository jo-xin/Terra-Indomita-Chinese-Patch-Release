l_simp_chinese:
 administrator_mummy:0 "高效君主的木乃伊"
 administrator_mummy_desc:0 "这位高效君主的木乃伊激励奴隶像君主曾经管理国家一样高效工作。"
 gallic_item_1:0 "战神雕像"
 gallic_item_1_desc:0 "这位手持剑的完美战士形象激励了许多人加入战士行列。这是由大师级工匠应地方领主的请求制作的。"
 gallic_item_2:0 "财富之神雕像"
 gallic_item_2_desc:0 "这件作品由一位大师级工匠精心制作，展示了一位神祇正在数金币的场景。它激励了许多年轻创业者开设自己的工坊。"
 gallic_item_3:0 "繁殖女神雕像"
 gallic_item_3_desc:0 "这座雕像描绘了一位女神，她身着最自然的服装——她自己的皮肤。由大师级工匠制作，使许多年轻人和老年人脸红。"
 gallic_item_4:0 "文化女神雕像"
 gallic_item_4_desc:0 "这座雕像由大师级工匠制作，他们将整个艺术形式献给了创造这件美丽的艺术品。这是对创作者知识和精致的证明。"
 gallic_item_5:0 "神圣之剑"
 gallic_item_5_desc:0 "这把剑由一位受神启发的工匠制作。这把刀片将切断任何敢于侵犯圣地的人。"
 gallic_item_6:0 "神圣铠甲"
 gallic_item_6_desc:0 "这件铠甲由一位受神启发的工匠制作。这件锁子甲将保护任何人抵御侵略者保卫圣地。"
 leader_mummy:0 "魅力君主的木乃伊"
 leader_mummy_desc:0 "这位魅力君主的木乃伊说服当地居民，他们的领主文化是非常……优越的。"
 priest_mummy:0 "虔诚君主的木乃伊"
 priest_mummy_desc:0 "这位虔诚的君主的木乃伊让当地人相信，他们新君主的信仰是唯一正信。"
 treasure_buddhist_anthology:0 "佛教选集"
 treasure_buddhist_anthology_desc:0 "世界上所有伟大的佛教作品都被汇编成一部史诗般的佛教选集。"
 treasure_hindu_anthology:0 "吠陀选集"
 treasure_hindu_anthology_desc:0 "世界上所有伟大的吠陀作品都被汇编成一部史诗般的吠陀主义选集。"
 treasure_india_adhidhamma_pitaka:0 "《阿毗达磨藏》"
 treasure_india_adhidhamma_pitaka_desc:0 "作为三藏之一的阿毗达磨藏，专注于理解指导身心的自然原则。"
 treasure_india_aitareya:0 "《他氏奥义书》"
 treasure_india_aitareya_desc:0 "作为最古老的吠陀文本之一，《他氏奥义书》是关于诞生、再生和灵魂的思想精粹。"
 treasure_india_brihadaranyaka:0 "《布里哈达任伽》"
 treasure_india_brihadaranyaka_desc:0 "作为优帕尼沙德中的主要文本，《布里哈达任伽》被译为‘大荒野’，是核心经典之一。"
 treasure_india_chandogya:0 "《歌者奥义书》"
 treasure_india_chandogya_desc:0 "《歌者奥义书》是作为《娑摩吠陀》著作的极为重要的部分，汇编自早期关注广泛主题的文本。"
 treasure_india_dhammapada:0 "《法句经》"
 treasure_india_dhammapada_desc:0 "法句经是一部圣洁的佛教文本，以诗歌形式撰写，深受人们喜爱。"
 treasure_india_isha:0 "《伊沙》"
 treasure_india_isha_desc:0 "虽然《伊沙》是优帕尼沙德中最短的文本，但其页面中包含的智慧超出其简短的体积。"
 treasure_india_katha:0 "《羯陀奥义书》"
 treasure_india_katha_desc:0 "《卡陀》是一位小男孩和死神之间的对话；在讨论世界的本质时，其直白的散文中透露了很多东西。"
 treasure_india_kaushitakia:0 "《海螺氏奥义书》"
 treasure_india_kaushitakia_desc:0 "虽然它是较大的《梨俱吠陀》的一部分，但《海螺氏奥义书》作为重要子章，本身也值得研究。"
 treasure_india_kena:0 "《迦那》"
 treasure_india_kena_desc:0 "《迦那》是一部重要的形而上学哲学著作，阅读其文字可以帮助人们在启蒙道路上前进。"
 treasure_india_maitri:0 "《迈特里》"
 treasure_india_maitri_desc:0 "《迈特里》是一部致力于理解快乐的本质及其获取方式的文本，研读其页面可以洞察如何指导生活。"
 treasure_india_mandukya:0 "《曼陀乌》"
 treasure_india_mandukya_desc:0 "《曼陀乌》虽只有十二节，但其文字中可以思考和窥见所有事物的秘密，使其成为我们哲学发展的基石文本。"
 treasure_india_milinda_panha:0 "《弥兰王问经》"
 treasure_india_milinda_panha_desc:0 "《弥兰陀问题》是介于贤者那先那和犍陀罗王弥兰陀之间的对话；一本充满智慧的珍贵文本。"
 treasure_india_mundaka:0 "蒙达卡"
 treasure_india_mundaka_desc:0 "蒙达卡或‘剃刀’中锐利的著作有助于人们去除一生中获得的错误假设。"
 treasure_india_prashna:0 "《伯闍那》"
 treasure_india_prashna_desc:0 "《伯闍那》的著作提出了问题，并在一段激动人心的哲学旅程后，声称提供了答案。"
 treasure_india_satipatthanavibhango:0 "《念处分别》"
 treasure_india_satipatthanavibhango_desc:0 "《念处分别》是一系列教导正念追求的教义著作。"
 treasure_india_shvetashvatara:0 "《舍婆多罗》"
 treasure_india_shvetashvatara_desc:0 "《舍婆多罗》是一部高尚的作品，包含许多关于宇宙灵魂本质的重要真理。"
 treasure_india_sutta_pitaka:0 "《经藏》"
 treasure_india_sutta_pitaka_desc:0 "这套著作是作为三藏之一的经藏，包含佛陀教导的超过10,000条格言。"
 treasure_india_taittiriya:0 "《鹧鸪氏奥义书》"
 treasure_india_taittiriya_desc:0 "《鹧鸪氏奥义书》的著作教导我们的人民正确认识和理解梵天。"
 treasure_india_vinaya_pitaka:0 "《律藏》"
 treasure_india_vinaya_pitaka_desc:0 "作为三藏之一的律藏，即“戒律篮”，包含了最早的佛教僧侣和尼姑的历史。"
 warrior_mummy:0 "战士君主的木乃伊"
 warrior_mummy_desc:0 "这位战士君主的木乃伊激励着当地部队为家园和祖国而战斗。"

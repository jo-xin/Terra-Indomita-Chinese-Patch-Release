l_simp_chinese:
 dacian_helmet:0 "色雷斯人的战冠"
 dacian_helmet_desc:0 "色雷斯人的战冠是一种适合于统治者的礼服。它可以吓唬你的敌人，并建立起一种优越的氛围。没有人能够直视[CHARACTER.GetPraenomen]的眼睛而不退缩。"
 dacian_mantle:0 "色雷斯人的斗篷"
 dacian_mantle_desc:0 "色雷斯人的斗篷让人叹为观止，许多人对一个所谓的野蛮人拥有如此精美的服装感到惊讶。它还能在寒冷的冬天给[CHARACTER.GetPraenomen]带来温暖。"
 dacian_shield:0 "达契亚盾牌"
 dacian_shield_desc:0 "这面盾牌可以在战斗中保护[CHARACTER.GetPraenomen]。由于是由一个大工匠制作的，如果[CHARACTER.GetEmployer.GetRulerTitle]在战斗中倒下，它将有幸成为[CHARACTER.GetSheHe]的棺材。"
 dacian_weapon:0 "法尔克斯"
 dacian_weapon_desc:0 "Falx是色雷斯人的一种武器，众所周知，他们用这种武器作战。Falx的长度和它的钩子使它成为有能力的战士所挥舞的危险武器。"
 desc_thracian_item_4:0 "在每场战斗中，都有一些战车，由强大的人领导。它们是威望的巨大标志，许多人看到它们就会受到鼓舞。"
 thracian_item_4:0 "著名的战车"
 thracian_smithy:0 "召唤铁匠大师"
 thracian_smithy_desc:0 "你可以召唤一位铁匠大师，他将以合适的价格为你制作一件装备。它可能用于战争，也可能在田地里有用......"
 thracian_smithy_inv.1.a:0 "令人惊叹"
 thracian_smithy_inv.1.desc:0 "经过几周和几个月的汗水和流血，铁匠师傅和他的助手们终于向你们展示了他们的作品。\n一些聚集在一起的贵族似乎猜到了它的用途，但其他人却无法从它被覆盖的轮廓中看出任何有用的东西。当它终于揭开面纱时，许多人都惊呼起来，因为它是一道风景，它的外观是一件艺术品。它的功能并不明显，工匠大师开始解释......"
 thracian_smithy_inv.1.t:0 "铁匠的杰作"
 thracian_smithy_inv.2.a:0 "令人失望"
 thracian_smithy_inv.2.desc:0 "可悲的是，我们多次聘请的铁匠大师，根本不知道该为我们的统治者制作什么。因此，他很遗憾地把我们托付给他的钱还给了我们。然而，他确信，在未来的某个时候，他将能够为我们锻造出一件物品。"
 thracian_smithy_inv.2.t:0 "对铁匠的要求"
 thracian_treasure_1:0 "战车"
 thracian_treasure_2:0 "镰刀"
 thracian_treasure_2_desc:0 "这把镰刀是该地区所有铁匠的原型。这些复制品使农业人口能够更快地工作，从而覆盖更多的土地。"
 thracian_treasure_3:0 "犁"
 thracian_treasure_3_desc:0 "这把犁是由一位铁匠大师制作的。它可以让农民加快播种时间，从而可以种植更多的农作物。"
 thracian_treasure_desc:0 "虽然战车有些过时，在战争中没有什么作用，但它仍然具有一定的威望，并鼓励当地的年轻人多加训练，以便有一天他们可以骑在上面。"

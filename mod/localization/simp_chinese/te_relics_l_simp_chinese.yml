l_simp_chinese:
 treasure_andrew_cross:0 "圣安德鲁的十字架"
 treasure_andrew_cross_desc:0 "圣安德鲁·普罗托克列托斯被处决的X形或十字形十字架。他是根据亚该亚帕特拉总督的命令被钉死的，为了延长他的痛苦，他被绑在十字架上，而不是钉在上面。"
 treasure_arzhang_book:0 "画册"
 treasure_arzhang_book_desc:0 "《Arzhang》，又称为《画册》，是摩尼教的圣书之一。作为一本圣书，它的独特之处在于它包含了许多旨在描绘摩尼教宇宙观的图画，这些图画被认为是该书的组成部分。摩尼认为艺术的创造和体验比物质世界中的任何其他行为都更加神圣。"
 treasure_blessed_mary_hair:0 "万福童贞之锁"
 treasure_blessed_mary_hair_desc:0 "虽然拿撒勒人耶稣的母亲圣玛利亚的坟墓或其他身体遗物都已不复存在，但这绺头发却被信徒们尊为圣物。"
 treasure_cornelius_centurion_relics:0 "圣科尔乃略的盔甲"
 treasure_cornelius_centurion_relics_desc:0 "属于圣科尔乃略百夫长的罗马盔甲，奇迹般地保存完好。科尼利厄斯是 Cohors II Italica Civium Romanorum 的一位百夫长。他是一个虔诚和敬畏上帝的人，在战场上很勇敢，但后来放弃了当兵，作为主教为教会服务。"
 treasure_james_zebedee_relics:0 "圣雅各的遗物"
 treasure_james_zebedee_relics_desc:0 "西庇太之子圣雅各的头骨，也被称为大雅各。他是加利利渔民之一，与他的弟弟约翰以及安德鲁和彼得兄弟一起，被拿撒勒人耶稣召来作为门徒跟随他，后来被称为使徒们。圣雅各布到加利西亚去传福音。回到耶路撒冷后，他被钉死了。"
 treasure_john_patmos_manuscript:0 "启示录手稿"
 treasure_john_patmos_manuscript_desc:0 "也叫《Apocalypse》，来自古希腊文的第一个词 apokalypsis，意思是“揭开”或“启示”。启示者约翰在被流放到帕特莫斯岛时，描述了一系列预言性的异象，包括七头龙、蛇和野兽等人物，这些异象在耶稣再来时达到顶点。"
 treasure_luke_evangelist_relics:0 "圣路加的遗物"
 treasure_luke_evangelist_relics_desc:0 "你发现了受人尊敬的福音书作者圣路加的头骨和手，他是耶稣的70名门徒之一，也是《路加福音》的作者。根据虔诚的传说，路加在圣徒彼得和保罗殉道后传扬福音，引起了异教徒和犹太人的注意。他被皇帝逮捕，他的手被砍掉了。在一个奇迹中，他似乎又能重新接上并分开他的手，然后他被斩首。"
 treasure_mark_relics:0 "圣玛尔克的遗物"
 treasure_mark_relics_desc:0 "圣马可的头骨和骨头，他是福音书作者和亚历山大教会的创始人，该教会声称对非洲的所有基督徒有管辖权。马可与使徒的领袖西门彼得一起旅行，并根据彼得的叙述写了一本福音书。圣马可成为亚历山大城的第一位主教，亚历山大城的牧首们声称他们的继承权来自于他。"
 treasure_matthew_levi_relics:0 "圣玛窦·列维的遗物"
 treasure_matthew_levi_relics_desc:0 "圣玛窦的遗物多年来一直在埃塞俄比亚的城市纳达弗，他在那里遭受了殉难。圣人是在埃塞俄比亚国王的命令下被杀害的，当时他正在祭坛前做弥撒。国王贪恋自己的侄女，被玛窦斥责，因为这个女孩是个修女，因此是基督的新娘。"
 treasure_nathanael_bartholomew_relics:0 "圣纳塔纳埃尔·巴托尔麦的遗物"
 treasure_nathanael_bartholomew_relics_desc:0 "圣巴塞洛缪是最杰出的被剥皮的基督教殉道者。根据传说，他被活剥了皮并被斩首。他的一大块皮和许多骨头被作为圣徒的遗物保存起来。"
 treasure_paul_epistle:0 "圣保罗使徒书信"
 treasure_paul_epistle_desc:0 "保罗的真实书信大致可追溯到公元1世纪中期前后。在以保罗名字命名的13封信中，有7封——罗马书、哥林多前书、哥林多后书、加拉太书、腓立比书、帖撒罗尼迦前书和腓利门书——几乎被普遍认为是完全由保罗本人所写的。"
 treasure_peter_relics:0 "圣彼得的遗物"
 treasure_peter_relics_desc:0 "西门彼得的人骨，他是使徒们的领袖，拿撒勒人耶稣的追随者，他们称他为 chrīstós 或基督。彼得和使徒们建立了“ekklesia”或教会，即崇拜耶稣为一神化身的“基督徒”的聚会。圣彼得前往罗马，在帝国的首都建立了一个教会。在那里，他被钉死在十字架上，因为他觉得不配和他的主一样死在十字架上。接替彼得成为罗马教会领袖的主教们被称为“教皇”，是对父亲的爱称。"
 treasure_philip_relics:0 "圣菲力普的遗物"
 treasure_philip_relics_desc:0 "传说在耶稣复活后，菲力普与他的妹妹玛利亚姆和巴多罗缪被派往希腊、弗里吉亚和叙利亚传教。他在城市希罗波利斯殉道。"
 treasure_st_joseph_cloak:0 "圣若瑟的圣斗篷"
 treasure_st_joseph_cloak_desc:0 "这件斗篷据说属于拿撒勒人耶稣的养父圣若瑟。传统认为，圣若瑟的斗篷是在4世纪末由圣杰罗姆从耶路撒冷带到罗马的。"
 treasure_thomas_relics:0 "圣托马斯遗骸"
 treasure_thomas_relics_desc:0 "在马拉雅拉姆民谣 Thomas Ramban Pattu (托马斯之歌)中，使徒到达印度，然后继续旅行到中国，并返回印度，在那里去世。根据一位印度国王的命令，他被长矛刺穿。"

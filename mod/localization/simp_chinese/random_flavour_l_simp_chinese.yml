l_simp_chinese:
 agathrysi_song_laws_inv:0 "歌颂律法"
 agathrysi_song_laws_inv_desc:0 "据说阿伽堤耳人会吟唱他们的律法，因此他们记住和遵守它们会像孩子一样跟着简单的歌曲唱歌跳舞即使是在年老的时候也会记住。"
 akinakes_inv:0 "阿基诺克斯"
 akinakes_inv_desc:0 "阿基纳克斯是一种轻型武器，在多草的草原和伊朗高原上被广泛使用，被证明是一种有用的狩猎武器，也是一种可靠的副武器，可以浸入毒药。"
 alarm_clock_inv:0 "警报锁"
 alarm_clock_inv_desc:0 "据推测，柏拉图在公元前427年创造了第一个闹钟，使用滴水系统和排水管来设置计时器，并在时间到时发出噪音。也许他的学生在他的讲课中睡着了。"
 allow_improved_naval_siege:0 "港口突袭/突击会造成较少的船只损失。"
 antikythera_mechanism_inv:0 "安梯基齐拉机械装置"
 antikythera_mechanism_inv_desc:0 "第一台模拟计算机曾经被精心制作，这台设备可能来自罗德岛，能够追踪奥林匹克周期和天文图样。"
 archimedes_death_ray_effect:0 "有了这项发明，任何敌舰都无法从海上攻破堡垒。"
 archimedes_death_ray_inv:0 "阿基米德的死亡射线"
 archimedes_death_ray_inv_desc:0 "真正起作用的死亡射线……阿基米德创新武器的巅峰之作，它的镜面透镜让袭击叙拉古的船只着火。"
 archimedes_steam_cannon_inv:0 "阿基米德投石机"
 archimedes_steam_cannon_inv_desc:0 "中世纪和前现代的蒸汽炮和火药炮的古代版本，阿基米德制作的机械在叙拉古提供了强大的塔楼和城墙防御。"
 battering_ram_inv:0 "攻城槌"
 battering_ram_inv_desc:0 "虽然许多国家都采用了攻城槌，但维特鲁威指出，布匿战争时期的迦太基人的攻城槌对敌人的防御工事有独特的效果，并为他们的部队提供了一个保护性屋顶。"
 boetia_flamethrower_inv:0 "玻奥提亚火焰喷射器"
 boetia_flamethrower_inv_desc:0 "玻奥提亚的火焰喷射器被制造出来，并在Delium使用，以击败雅典联军并攻击其防御工事。"
 capture_port_no_valid_port_archimedes:0 "这个堡垒不能被攻破，因为它受到阿基米德死亡射线的保护，任何攻击都意味着我们的船只会被烧毁。"
 capture_port_no_valid_port_syracuse:0 "由于墙上挂着一排铁爪，叙拉古无法被攻破——来犯的船只会被打翻。"
 chalcidian_helmet_inv:0 "卡尔基德头盔"
 chalcidian_helmet_inv_desc:0 "理论上说，哈尔基德头盔是在哈尔基斯城首先制造的，这种头盔改进了封闭式的科林斯头盔，打开了脸颊的遮挡以获得更大的视野。"
 cicones_blood_inv:0 "西科内斯之血"
 cicones_blood_inv_desc:0 "在阿基里斯和赫克托的时代，西科尼人是一个受人尊敬的色雷斯部落。他们的血液仍然流淌在生活在仍被称为西科恩人家园的土地上的色雷斯人身上。"
 cistern_inv:0 "蓄水池"
 cistern_inv_desc:0 "使用在新石器时代就已应用的石膏作为内衬，黎凡特的人民依靠地下水容器在常年干旱的气候中安全地保护他们的水源供应。"
 club_inv:0 "俱乐部"
 club_inv_desc:0 "棍子是最简单的武器，当它经常被用来折断长矛的花哨的铁尖，使其失去作用时，它证明了简单就是好。"
 compass_inv:0 "指南针"
 compass_inv_desc:0 "最早由汉人制造，通过漫长的贸易路线传入中东和地中海，早期的指南针使用了磁化的矿石磁石，有时呈钢包形状。"
 corinth_helmet_inv:0 "科林斯头盔"
 corinth_helmet_inv_desc:0 "科林斯头盔是自特洛伊战争到伯罗奔尼撒战争一直被广泛使用的著名头盔，科林斯头盔用圆形的脸颊遮挡和鼻梁盖为使用者提供了广泛的保护。"
 crossbow_inv:0 "十字弓"
 crossbow_inv_desc:0 "十字弓提供了一种更容易发射危险弹丸的方法。400年代发明于中国，其使用范围通过贸易路线向西扩展，如通过塔里木盆地的路线。"
 dalmatia_weapons_cult_inv:0 "武器信仰"
 dalmatia_weapons_cult_inv_desc:0 "父权制的达尔马提亚人崇拜武器，就像其他民族崇拜神一样，他们将一排排武器埋在坟墓里，看起来像库尔干人的石头。"
 danubian_horsemen_inv:0 "多瑙河骑兵"
 danubian_horsemen_inv_desc:0 "多瑙河骑兵，有时也被称为达契亚骑兵，是一个文化主题。许多人认为描绘的是阿尔特弥斯和在其两侧骑马的狄俄斯库里兄弟。然而，这个文化主题可能代表的其实是与土地和河流的联系。"
 dardanian_death_currency_inv:0 "死亡货币"
 dardanian_death_currency_inv_desc:0 "达达尼人把铁器和贵重金属埋进坟墓里，希望作为他们支付来世的报酬。"
 dhe_city_fall.1.desc_2:0 "在大绿地，迦太基人和[ROOT.GetCountry.GetAdjective]之间爆发了一场复仇之战。我们受到了世代的压迫，现在寻求重获自由和荣誉。随着迦太基围城战的开始，我们的将军带领[ROOT.GetCountry.GetAdjective]军队以坚定的决心作战。战斗激烈，双方为自己的事业拼命战斗。\n\n迦太基的城墙坚固，但我们的角战士毫不留情。[ROOT.GetCountry.GetAdjective]的战略智慧和我们战士不可战胜的精神慢慢削弱了城市的防御。在战斗的混乱中，一个大胆的计划浮现出来。夜幕降临时，一队勇敢的说腓尼基语的侦察兵潜入了城市，破坏了迦太基的补给线和士气——我们用他们的语言对付了他们。\n\n随着日子变成周，我们的坚持不懈开始见效，迦太基的抵抗开始在我们脚下崩溃。在战斗的顶峰，我们的领导激励了士兵们，用我们人民神圣的战斗口号唤起了旧时的记忆，并铸造了一种决定围城结果的不可破裂的纽带。决定性的一天到来了，[ROOT.GetCountry.GetAdjective]攻破了迦太基的城墙，以我们祖先和唯一神的名义释放了一波胜利的狂潮。\n\n现在由我们明智的[ROOT.GetCountry.GetRulerTitle]决定我们旧敌的命运——我们是愚蠢地放任他们不受惩罚，让我们的心充满不公的感觉，还是重新夺回我们祖先的荣誉？我们的人民、我们的海军和我们的军队对[ROOT.GetCountry.GetRuler.GetName]的任何决定都充满信心，但我们不能让他们失望。"
 dhe_city_fall.1.e:0 "没有怜悯，没有俘虏。"
 distinction_champions_of_rhodes:0 "罗德岛冠军"
 distinction_champions_of_rhodes_desc:0 "这个军团因其对抗罗德岛敌人的多次成功战役而被人民誉为罗德岛冠军。"
 distinction_champions_of_thebes:0 "忒拜的冠军"
 distinction_champions_of_thebes_desc:0 "这个军团因其对抗忒拜敌人的多次成功战役而被人民誉为忒拜冠军。"
 distinction_poliorcetes:0 "围城者"
 distinction_poliorcetes_desc:0 "这支军团获赐围城者的名号，因为他们打赢了一次漫长而重大的围城战，攻下了一座雄城。这份遗产仍在全军团中活跃，使其依然是一支专业的围城部队。"
 distinction_sarissa:0 "萨里沙"
 distinction_sarissa_desc:0 "这个军团以精通长矛著称，形成了[ROOT.GetCountry.GetName]军事的骨干力量。"
 door_locks_inv:0 "门锁"
 door_locks_inv_desc:0 "最早的销式制栓锁是在埃及制造的，使用木制框架、金属螺栓和大型木制钥匙来保护建筑物和贵重物品。有人可能会说这些钥匙看起来像一把现代牙刷。"
 egyptian_mints_inv:0 "薄荷"
 egyptian_mints_inv_desc:0 "薄荷，解决口腔卫生问题的最佳方法。埃及人用乳香、肉桂、没药和蜂蜜制作它们，以对抗他们的含有沙石面包造成的蛀牙。"
 fire_events.2:0 "城市着火"
 fire_events.2.a:0 "我们必须帮助我们的公民！"
 fire_events.2.b:0 "任其燃烧！"
 fire_events.2.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]#!，#Y [SCOPE.sProvince('en_fuego').GetName]#!的一家面包店发生了火灾。如果我们不及时行动，我们可能需要重建城市的一部分。\n一些大臣向我们保证，重建城市比派遣消防队更便宜。他们说，几个奴隶不值得我们花费时间。其他人则坚持帮助#Y [SCOPE.sProvince('en_fuego').GetName]#!的居民，认为这是展示我们仁慈的绝佳机会。如果我们拯救他们，我们的臣民将永远感激我们。"
 fire_events.2.t:0 "城市着火"
 fire_events.3:0 "火势蔓延"
 fire_events.3.a:0 "拯救城市！"
 fire_events.3.b:0 "谁在乎。"
 fire_events.3.desc:0 "#Y [SCOPE.sProvince('en_fuego').GetName]#!的火势恶化，已经蔓延到邻近建筑物。市长恳求我们派遣援助，以防更多的破坏导致城市在可预见的未来内瘫痪。已经有一些居民被烧死，包括一位工匠大师。如果我们立即分配足够的消防员和资源，我们仍然可以防止进一步的破坏！"
 fire_events.3.t:0 "火势蔓延"
 fire_events.4:0 "火劫"
 fire_events.4.a:0 "愿众神怜悯他们的灵魂。"
 fire_events.4.desc:0 "#Y [SCOPE.sProvince('en_fuego').GetName]#!的城市即将化为灰烬。即使是石头也被熔化，这是一场可怕的景象。火焰燃烧，仿佛众神亲自命令它们焚毁这座城市。祭司们说，#Y [SCOPE.sProvince('en_fuego').GetName]#!的居民激怒了众神，现在正在被净化。我的[ROOT.GetCountry.GetRulerTitle]，现在我们只能为他们祈祷。"
 fire_events.4.t:0 "火劫"
 fire_events.5:0 "火势结束"
 fire_events.5.a:0 "祭司们又在胡言乱语了。"
 fire_events.5.b:0 "众神一定惩罚了#Y [SCOPE.sProvince('en_fuego').GetName]#!。"
 fire_events.5.desc:0 "#Y [SCOPE.sProvince('en_fuego').GetName]#!的火势已经平息，剩余的部分正在检查中。曾经自豪的城市现在只剩下一些瓦砾、灰烬和矿渣。\n我们现在该怎么办？我们可以重建城市，这将在长期内使我们受益，但需要投资。然而，祭司们说，这座城市受到了众神的惩罚，因此重建城市将是亵渎神明。"
 fire_events.5.t:0 "火势结束"
 galaia_inv:0 "加利亚船"
 galaia_inv_desc:0 "加利亚船是第一批用于运输的船之一，它将提升后勤运输在波涛汹涌的水域更好地运送士兵。"
 gallic_smithy_inv.1.a:0 "令人惊叹。"
 gallic_smithy_inv.1.desc:0 "经过几周和几个月的汗水和流血，铁匠师傅和他的助手们终于向你们展示了他们的作品。\n一些聚集在一起的贵族似乎猜到了它的用途，但其他人却无法从它被覆盖的轮廓中看出任何有用的东西。当它终于揭开面纱时，许多人都惊呼起来，因为它是一道风景，它的外观是一件艺术品。它的功能并不明显，工匠大师开始解释......"
 gallic_smithy_inv.1.t:0 "铁匠的杰作"
 gallic_smithy_inv.2.a:0 "通知工匠！"
 gallic_smithy_inv.2.desc:0 "我们的[ROOT.GetCountry.GetRulerTitle]已经宣布命令，[ROOT.GetCountry.GetRuler.GetSheHe]要求从铁匠大师处获得一件新的物件。这件物件应该既实用又美观，以[ROOT.GetCountry.GetRuler.GetHerHis]的智慧，[ROOT.GetCountry.GetRuler.GetSheHe]承认[ROOT.GetCountry.GetRuler.GetHerHim]自己并非工匠，因此他无法限定物件到底是什么。但[ROOT.GetCountry.GetRuler.GetSheHe]警告说，它应当是一件完美之作，而不是一堆劣质材料。"
 gallic_smithy_inv.2.t:0 "信件"
 gentian_royal_coinage_inv:0 "根特王家硬币"
 gentian_royal_coinage_inv_desc:0 "根特通过Labeatae集中控制了领地的铸币权利，使财富的收集和分配更加高效，并基于王朝形象铸造。"
 helepolis_inv:0 "赫勒波利斯"
 helepolis_inv_desc:0 "德米特里厄斯的超级攻城塔没能征服罗得岛，但它为高级攻城机提供了模型，甚至被用来建造罗得岛的巨像。"
 hindu_sati_inv:0 "萨蒂"
 hindu_sati_inv_desc:0 "印度的萨蒂（Sati）是一种寡妇殉夫的殉葬制度，在地中海以北的几个印欧文化中也很盛行，希腊罗马的资料中也引用了这种方式的葬礼，如色雷斯的Suttee。"
 holy_site_delos:0 "圣岛"
 holy_site_delos_desc:0 "这个岛屿已经是一个受人尊敬的圣地已有几百甚至几千年。它是阿波罗和阿耳忒弥斯的出生地，是希腊世界最神圣的地方之一。"
 illyrian_helmet_inv:0 "伊利里亚头盔"
 illyrian_helmet_inv_desc:0 "伊利里亚头盔是古典时代向希腊化时代过渡时最广泛使用的头盔样式之一，它的设计更简单，对使用者的负担更小。"
 inv_distinction.1.a:0 "我们的敌人将在[ROOT.GetCountry.GetAdjective]长矛墙前崩溃！"
 inv_distinction.1.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到报告说有一场伟大的[ROOT.GetCountry.GetAdjective]胜利！我们的长矛军团，经过训练有素和战斗老练，最近与敌人交战，并通过纯粹的纪律克服了压倒性的困难。虽然许多国家都用长矛作战，但我们的军团展示的目标一致性使他们与众不同，因此，他们获得了萨里沙荣誉称号。"
 inv_distinction.1.t:0 "萨里沙"
 is_pregnant_loc:0 "怀孕的"
 legion_history_poliorcetes:0 "因为我们的军团因迅速攻占城市的声誉而令人畏惧，他们被授予了攻城者荣誉称号。"
 legion_history_rhodes:0 "由[PROVINCE.GetName]人民组建的最伟大的军队因其多年在罗德岛服务中的英勇战斗而被誉为[GetLegionDistinction('distinction_champions_of_rhodes').GetName]。"
 legion_history_sarissa:0 "由于他们在[PROVINCE.GetName]省份的萨里沙阵型中的杰出表现，他们被授予了[GetLegionDistinction('distinction_sarissa').GetName]的荣誉。"
 legion_history_thebes:0 "由[PROVINCE.GetName]人民组建的最伟大的军队因其多年在忒拜服务中的英勇战斗而被誉为[GetLegionDistinction('distinction_champions_of_thebes').GetName]。"
 lembus_inv:0 "楞波斯战船"
 lembus_inv_desc:0 "楞波斯战船是利布尼人部落的食物和财富的重要提供者，从沿海水域带来了无数的鱼类。"
 mastic_gum_inv:0 "乳香胶"
 mastic_gum_inv_desc:0 "希波克拉底曾将产自希俄斯的马斯蒂查里树的树胶用于治疗消化不良、感冒，以及那令人苦恼的口臭。这种由树木树脂制成的物质，或许正是世界上最早的口香糖，也一度成为广受欢迎的糖果。"
 nimrud_lens_inv:0 "尼姆鲁德镜片"
 nimrud_lens_inv_desc:0 "早在尼姆鲁德和《伊什塔尔史诗》以及伊兹杜巴（Izdubar）中，亚述人就已经掌握了镜片的发明，并当使用异国风格的雕花玻璃制作时将其用于功能性或装饰性用途。"
 nuragic_dhe_city_fall.1:0 "\n\n努拉吉人期望正义，表现出仁慈会被视为软弱。"
 pannonian_mining_inv:0 "潘诺尼亚采矿"
 pannonian_mining_inv_desc:0 "潘诺尼亚人生活在富含矿石和贵重金属的土地上。即使在罗马控制了该地区之后，他们复杂的矿井也产生了巨大的财富。"
 pelte_shield_inv:0 "佩尔特盾牌"
 pelte_shield_inv_desc:0 "盾牌是佩尔塔斯人的名字，它是一个月牙形的楔子，可以肩扛或背负，是快速移动的小兵的有效保护。"
 perfume_inv:0 "香水"
 perfume_inv_desc:0 "自埃及、中东和印度河流域文明的青铜时代以来被使用，香水一直是一种卫生用品，也是一种通过气味和芳香来表达社会地位和权力的工具。"
 phrygian_helmet_inv:0 "弗里吉亚头盔"
 phrygian_helmet_inv_desc:0 "弗里吉亚头盔的特点是模仿弗里吉亚人的软帽，因其受人尊敬的形象和全覆盖的保护而被爱琴海各地采用。"
 polyspaston_inv:0 "起重机"
 polyspaston_inv_desc:0 "起重机，或“多滑轮”，是希腊版本的古代起重机，使用扭力和一系列滑轮将大型建筑材料提升到高空用于建筑目的。起重机甚至被用来建造著名的帕特农神庙。"
 rhomphaia_inv:0 "朗普海亚"
 rhomphaia_inv_desc:0 "与Falx类似，Rhomphaia是一种有用的弯刀工具，连接在矛杆的末端，甚至可以挑战罗马的盔甲。贝索伊人用它来对付意大利人，效果很好。"
 ritual_sacrifice_decision.tt:0 "至少需要有一名角色被监禁。此外，你需要在过去十年内没有进行过任何献祭。"
 ritual_sacrifice_inv.1.a:0 "愿众神保佑我们"
 ritual_sacrifice_inv.1.desc:0 "最近，[ROOT.GetCountry.GetRuler.GetName]决定将一名囚犯献祭给众神，以便他们能改善部落的命运。反对者应该被沉默，动摇者应该重新确认对部落的忠诚。然而，选择错误的祭品可能会对我们产生影响……"
 ritual_sacrifice_inv.1.t:0 "献祭"
 ritual_sacrifice_inv.2.a:0 "只有最好的献给我们的人民！"
 ritual_sacrifice_inv.2.desc:0 "祭品献祭取得了成功。每个人都在庆祝，承认一个增长和和平的时代已经到来。被杀的血液是众神认为值得的代价。没有人对祭品的选择提出异议，因为他们知道这是对所有人最好的选择。"
 ritual_sacrifice_inv.2.t:0 "以祭品之名的宴会"
 ritual_sacrifice_inv.3.a:0 "该死！"
 ritual_sacrifice_inv.3.desc:0 "我们献祭的囚犯正在被哀悼，因为部落不喜欢我们选择了一个不合格的候选人献祭给众神。一些反对者和祭品的朋友开始煽动不满，声称他们被不公正和非法地谋杀。我们应该注意他们，因为越来越多的人跟随他们要求新统治者的呼声。"
 ritual_sacrifice_inv.3.t:0 "祭品的哀悼"
 ritual_sacrifice_invictus:0 "牺牲仪式"
 ritual_sacrifice_invictus_desc:0 "将一名囚犯献祭给众神。这可能会提高你的部落凝聚力，但也可能进一步分裂。"
 royal_gift_exchance_inv:0 "王室礼物交换"
 royal_gift_exchance_inv_desc:0 "为了控制一个分散的俄德律西亚王国，王室成员需要依靠忠诚的骑兵和当地贵族。"
 sacred_band_inv:0 "迦太基圣军"
 sacred_band_inv_desc:0 "迦太基圣军是迦太基在其雇佣军之外的一支精英常备部队。迦太基的公民和贵族们加入这支优秀的战斗队伍并以此获得政治名声。"
 sambuca_siege_inv:0 "桑布坎攻城车"
 sambuca_siege_inv_desc:0 "桑布坎攻城车是塔林敦的赫拉克里德为试图占领坚固港口的船只所普及的附加装置，允许士兵在一定的保护下冲进城墙。"
 scythian_helmet_inv:0 "斯基泰头盔"
 scythian_helmet_inv_desc:0 "斯基泰头盔是对于骑兵部队来说是最有效的防具，它依靠广阔的战场视野来跟踪战斗中的阵型变化和冲锋方向。"
 sibyna_inv:0 "狩猎长矛"
 sibyna_inv_desc:0 "狩猎长矛，类似于野猪矛，在近距离队列中可作为一种有效的战斗武器。"
 syrian_elephants_inv:0 "叙利亚大象"
 syrian_elephants_inv_desc:0 "在亚洲最大的大象物种中，叙利亚象在黎凡特和整个波斯地区提供了丰富的象牙贸易和象牙工艺品市场。然而，这些野兽也能够做好战斗准备，并将被派往地中海各地的战象部队。也许有些穿越了阿尔卑斯山…"
 tablet_maps_inv:0 "泥板地图"
 tablet_maps_inv_desc:0 "早在公元前三千年，巴比伦人就在泥板上描绘地理位置和地区。"
 taulantia_mead_honey_inv:0 "蜜酒和宝贝"
 taulantia_mead_honey_inv_desc:0 "Taulantii人有很多为人所熟知的东西；但希腊人和罗马人谈论最多的是他们的美食，甚是美味。"
 thracian_heroes_inv:0 "色雷斯英雄"
 thracian_heroes_inv_desc:0 "色雷斯英雄，或者说色雷斯骑手，可能是对古代利瑟斯国王的描绘，是色雷斯人常用的艺术和丧葬主题，其中包括希腊、凯尔特和斯基泰元素。"
 thracian_mercs_inv:0 "色雷斯雇佣兵"
 thracian_mercs_inv_desc:0 "自从雇佣兵存在以来，以残暴和高昂花费著称的色雷斯雇佣兵一直是许多爱琴海国家的首选。"
 tribulus_inv:0 "蒺藜"
 tribulus_inv_desc:0 "蒺藜被用在数以百计的战场上，作为对付前进路线的区域防御工具和对大象和马匹的威慑。"
 tripartite_cellae_building_inv:0 "三重内堂建筑"
 tripartite_cellae_building_inv_desc:0 "侍奉诸神在所有事情中都是最重要的。这就是为什么伊特鲁里亚人在他们的神庙中建造了三个内殿，并保护作为祭祀图腾和还愿祭品的内室。就连罗马人也在祭祀朱庇特时效仿他们。"
 wooden_construction_iapyges_inv:0 "木质建筑"
 wooden_construction_iapyges_inv_desc:0 "雅皮吉人几乎所有的建筑都依赖于巨量过剩的木材。其结果是相当漂亮和廉价的建筑。"

l_simp_chinese:
 corruption_car_laws:0 "大会的公开支持"
 corruption_car_laws_impact:0 "颁布反腐败法"
 humility_jewish_status_law:0 "皇家的谦卑"
 humility_jewish_status_law_desc:0 "我们可能是国王，但立足于现实，可以避免我们与古代传说中的傲慢相提并论。我们的人民尊重我们的谦逊和仁慈。"
 republic_citizen_car_laws:0 "公民法"
 republic_citizen_car_laws_impact:0 "颁布公民法"
 republic_corruption_car_1:0 "104人议会"
 republic_corruption_car_1_desc:0 "创立于迦太基历史的早期，104人议会是最高的宪法权威。这些资深政治家终身当选，具有相当大的政治影响力，有权在大会中发挥制衡作用。"
 republic_corruption_car_2:0 "公民大会"
 republic_corruption_car_2_desc:0 "通过一个由全体公民组成的高贵实体颁布法令，无疑将使所有人相信我们的政府是一个公正无阿的机构。"
 republic_corruption_car_3:0 "米兹拉希大会"
 republic_corruption_car_3_desc:0 "亚里士多德描述为类似于希腊的毕达哥拉斯兄弟会，这些政治团体广泛影响了迦太基人的生活，从虔诚的宗教信仰到职业行会。通过扩大这些群体的法律权利，在未来我们可以期待他们的更多合作。"
 republic_corruption_car_4:0 "贵族议会管理"
 republic_corruption_car_4_desc:0 "被称之为“智者”，这个顾问机构在君主政体的时候拥有巨大的权力。也许，带一批经过选拔的有真才实干的人回来，将有助于发挥更果断的领导作用."
 republic_election_car_reforms:0 "选举改革"
 republic_election_car_reforms_impact:0 "选举制度改革"
 republic_integration_car_laws:0 "整合法"
 republic_integration_car_laws_impact:0 "颁布整合法"
 republic_military_recruitment_car_1:0 "官僚式指挥 "
 republic_military_recruitment_car_1_desc:0 "历史上，迦太基的佣兵指挥官们都被实地考察雇佣兵业绩的官僚所陪同着，通常情况下不仅仅对将军和海军将官的表现有着极强的支配能力，而且还涉及整体军事战略。"
 republic_military_recruitment_car_2:0 "杉西普斯改革"
 republic_military_recruitment_car_2_desc:0 "这部法律表述了斯巴达军官杉西普斯于第一次布匿战争期间所进行的改革。他用希腊式战争方式和重步兵方阵的模式训练迦太基人，使这些策略适应迦太基军队。"
 republic_military_recruitment_car_3:0 "马戈尼德征兵法"
 republic_military_recruitment_car_3_desc:0 "这项法律表述了公元前5世纪前后国王马戈一世所做的改革。它一直被迦太基使用到西西里战争。 "
 republic_military_recruitment_car_4:0 "巴卡改革"
 republic_military_recruitment_car_4_desc:0 "这部法律表述了巴卡家族的改革，特别是提到了汉尼拔在第二次布匿战争期间取得的成就。强调个人忠诚、纪律和克服恶劣地形的能力，迦太基军队能够大胆地在以前难以想象的地形中进军。"
 republic_military_recruitment_car_laws:0 "军事改革"
 republic_military_recruitment_car_laws_impact:0 "颁布军事改革"
 republican_citizen_car_1:0 "设置人头税"
 republican_citizen_car_1_desc:0 "授权政务官，使其能对贵族和公民处以罚款来限制贵族权力是一项古老却有效的措施。"
 republican_citizen_car_2:0 "设置行会税"
 republican_citizen_car_2_desc:0 "随着行会政治权力的增长，随之而来的是额外的税款和管理，以确保他们不会挑战国家的权威。"
 republican_citizen_car_3:0 "授予商人特权"
 republican_citizen_car_3_desc:0 "向特定的商人和行会提供经济和政治上的特权，将使整个市场和我们社会的各个阶层有更好的影响力。"
 republican_citizen_car_4:0 "柏柏尔佃农"
 republican_citizen_car_4_desc:0 "随着在我们的土地上劳动的奴隶数量的增加，我们的自由民和非洲当地人获得一条养活自己的道路就变得越来越重要。为了解决农村阶层分化问题，必须制定法律，划分佃农。"
 republican_election_car_1:0 "传统模式"
 republican_election_car_1_desc:0 "为保证公正与平等而设计的这套选举系统模式被高度重视。"
 republican_election_car_2:0 "延长任期"
 republican_election_car_2_desc:0 "单独一届任期有时对我们的伟大领袖来说远远不够他们成就伟业。显然我们应当考虑延长他们的任期，如此我们或能从我们的好领袖的智慧中获益。"
 republican_election_car_3:0 "缩短任期"
 republican_election_car_3_desc:0 "权力显然滋生了人性的恶之花。为了打压这蔓延的腐败现象，我们应缩短任期，保证没有人会过长地执掌权力。"
 republican_election_car_4:0 "战时领导权"
 republican_election_car_4_desc:0 "为了防止内部腐化和境外势力干涉，我们无限期地需要我们高尚领导人的智慧。这是我们的公民和商人能够兴旺发达的唯一方法！"
 republican_integration_car_1:0 "职业译员"
 republican_integration_car_1_desc:0 "通过引用职业译员行会，我们的商人在谈判中取得了显著优势，并使我们的非布匿臣民或许在政府中能够发挥更多作用。"
 republican_integration_car_2:0 "阿非利加定居者"
 republican_integration_car_2_desc:0 "扩展我们的殖民活动，将更多顺从且欢乐的纳税公民安置在广袤的北非海岸。"
 republican_integration_car_3:0 "财权"
 republican_integration_car_3_desc:0 "拉拢我们国家最富有的家庭显然是一条谋取政治利益的途径。扩大富人的政治权利将使他们投资于我们国家的发展。"
 republican_integration_car_4:0 "部落协约"
 republican_integration_car_4_desc:0 "管理我们国家和臣民中各个部落的首领对于创造财富和军事动员至关重要。"
 republican_land_reform_car_1:0 "汉诺的扩张"
 republican_land_reform_car_1_desc:0 "继公元前4世纪‘伟大的’汉诺之后，迦太基人向利比亚、西班牙和毛里塔尼亚的扩张为以后的布匿政策奠定了基础。"
 republican_land_reform_car_2:0 "狄多式的定居点"
 republican_land_reform_car_2_desc:0 "参考迦太基建立的传说，狄多女王和她的牺牲代表了布匿身份的坚定奉献。狄多的政策强调迦太基人在其殖民地内外的统治地位，而不是屈服于当地人或与当地人混同在一起。"
 republican_land_reform_car_3:0 "伊比利亚的财富"
 republican_land_reform_car_3_desc:0 "伊比利亚的银矿和铜矿，以及对大西洋锡贸易的广泛控制，对我们来说不仅仅是简单的致富手段。控制和支配伊比利亚的财富对于迦太基的繁荣是必要的，土地改革政策应该反映这一简单的事实。"
 republican_land_reform_car_4:0 "流放地"
 republican_land_reform_car_4_desc:0 "由于迦太基的战争机器、奴隶市场和司法系统都创造了大量的奴隶，因此建立国有、国营的流放地是恰当的方式，而非简单地让最富有的家族继续单独控制这些财富。"
 republican_land_reforms_car:0 "土地改革"
 republican_land_reforms_car_impact:0 "颁布土地改革"
 republican_mediterranean_car_1:0 "公民海军"
 republican_mediterranean_car_1_desc:0 "保障一个不断繁荣的国家的重负需要特别注意于给大众百姓的食物供给. 对有进取心的公民实行免税将使我们的商人更有竞争力，确保我们进入外国市场。"
 republican_mediterranean_car_2:0 "战略性的垄断"
 republican_mediterranean_car_2_desc:0 "通过提供大量财政激励，配合国家的军事实力，我们的商人将能够在国外市场建立垄断地位，使我们能够操纵商品价格以最大化我国利益。"
 republican_mediterranean_car_3:0 "商船船长"
 republican_mediterranean_car_3_desc:0 "向能够保证送货的商人和私掠船提供税收和法律豁免，无疑会导致一些不光彩的商业行为能够及时交易。"
 republican_mediterranean_car_4:0 "保护海上贸易"
 republican_mediterranean_car_4_desc:0 "海盗是我们海岸附近一直存在的威胁；普通民众为此躁动，呼求安定。通过计划筹备一系列强制协调措施用以终结海盗，我们或能减轻一些相关压力。"
 republican_mediterranean_car_laws:0 "海洋事物法"
 republican_mediterranean_car_laws_impact:0 "颁布海事法"
 republican_religious_car_1:0 "十人内阁"
 republican_religious_car_1_desc:0 "自元老中选出，这十人承担起国家宗教事务的责任，对政策以及财政具有重大影响。"
 republican_religious_car_2:0 "大祭司的指引"
 republican_religious_car_2_desc:0 "祭司首领'Rb Khnm'是从参议院选举出来的。他们的职责包括填补空缺的祭司职位，监督重要的宗教仪式，以及制定教育政策。"
 republican_religious_car_3:0 "传播塔尼特崇拜"
 republican_religious_car_3_desc:0 "塔尼特被崇拜为所有迦南女神中最高的，拥有直接向巴力·哈蒙传递信息和祈祷的力量。在我们的城市中强制推行对她的崇拜将会增强城市的宗教凝聚力。"
 republican_religious_car_4:0 "投资行会"
 republican_religious_car_4_desc:0 "为各个神祇设立的圣所拥有专门的协会，用于筹集资金和举办仪式宴会。这些协会随着时间的发展，逐渐积累了丰厚的财富和强大的影响力。"
 republican_religious_car_laws:0 "宗教法"
 republican_religious_car_laws_impact:0 "颁布宗教法"

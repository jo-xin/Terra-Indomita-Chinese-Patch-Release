 patch_notes:0 "最新信息"
 patch_notes_text:0 "V1.7.1 - 三月十五日：旧存档中的角色会损坏，如需继续旧存档，请使用 Steam 创意工坊或 Nexusmods 上的 1.7.0.3 版本\n- 为富甘杜卢新增任务树\n- 新增可成立国家温德利基亚\n- 不同步信息不再显示电脑用户名\n- 民主派与传统派现在会给予你稍高的元老院支持\n- 为凯尔特城市中心新增圆形部落房屋\n- 为凯尔特一级建筑新增更多圆形部落房屋\n- 橄榄现在是食物贸易品，并与蜂蜜交换位置\n- 从非绿洲城市移除食物贸易品\n- 帕提亚现在会随机决定采用何种宗教\n- 罗马姓名现在应能更准确地保留祖先数量\n- 为萨贝利、 Siculi、卢卡尼亚/布鲁提亚文化新增姓名表\n- 新增若干旗帜，主要位于伊比利亚\n- 修复其他房屋的 UV 映射\n- 修复埃及模型纹理\n- 修复罗马无法解锁希腊军事传统的问题\n- 修复费赞尼无法获得其发明的问题\n- 对模组中过强的修正进行了无数削弱\n- 全模组范围内进行了 1000+ 项脚本修复，全部感谢 Dementive 的 Imperator-Tiger\n由于修复数量极其庞大，实际上无法全部列入更新日志"

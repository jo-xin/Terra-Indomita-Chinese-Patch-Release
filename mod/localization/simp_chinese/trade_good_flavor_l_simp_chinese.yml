l_simp_chinese:
 alexandreia_eschate_silk_mod:0 "绝域亚历山大里亚的丝绸"
 amber_province_decision_1:0 "科尔基的琥珀"
 amber_province_decision_1_desc:0 "在科尔基开采的琥珀经常被运到远离当地的商船上；商人们不仅高兴地买下我们卖给他们的所有东西，还向我们索要更多。扩大开采并不是什么糟糕的想法；我们将以看不见的方式受益。"
 amber_province_decision_2:0 "沃耳加尼翁的琥珀"
 amber_province_decision_2_desc:0 "在沃耳加尼翁的森林里发现了琥珀，使得这个地区成为那些渴望它高额价值的人争夺的地方。虽然我们目前已经开采了大量的这种宝石，但我们可以加大力度，获取更多——我们的努力肯定会得到回报。"
 amber_province_decision_3:0 "鲁吉亚的琥珀"
 amber_province_decision_3_desc:0 "从鲁吉亚附近森林采集的琥珀被用来制作各种各样的珠宝，给这个地区带来了巨大的财富。虽然鲁吉亚人对他们目前的产量已经很满意，但通过投资该地区，每个人都能从琥珀市场的增长中获益。"
 antigoneia_glass_mod:0 "安提戈尼亚的玻璃"
 assegonia_metals_mod:0 "阿瑟戈尼亚的贵金属"
 athani_elephants_mod:0 "阿他尼的大象"
 augila_dates_mod:0 "奥吉拉的椰枣"
 belgola_metals_mod:0 "闭利瞿罗的贵金属"
 brahmanaka_dates_mod:0 "梵摩拏迦的椰枣"
 brigantia_metals_mod:0 "布里甘蒂亚的贵金属"
 caritra_sugar_mod:0 "折梨多罗的糖"
 carnium_cinnabar_mod:0 "卡耳尼翁的朱砂"
 cedar_province_decision_1:0 "俄尔柏的雪松木"
 cedar_province_decision_1_desc:0 "聪明的俄尔柏居民充分利用当地的资源，在靠近雪松林的地方建造了他们的城市。因为他们熟悉木工，他们在这个地区生产的雪松木材是无与伦比的——应该扩大生产！"
 cedar_province_decision_2:0 "摩娑迦的雪松木"
 cedar_province_decision_2_desc:0 "摩娑迦山中广阔的雪松林奇迹般的美丽，在这片土地上采集的木材以其壮美而闻名。在这里生产的无论家具还是船只，都会在远离这里的建筑中摆放或水域中航行，让我们继续收获森林的恩惠。"
 cedar_province_decision_3:0 "帕福斯的雪松木"
 cedar_province_decision_3_desc:0 "帕福斯附近生长的雪松是当地船只如此光滑坚固的主要原因；港口附近有这么多森林真乃得天独厚。我们应该继续尽可能多地砍伐树木，因为我们知道，我们可以出售任何我们自己不决定使用的东西。"
 chandraketugarh_sugar_mod:0 "阐陀罗鸡都揭诃的糖"
 cinnabar_province_decision_1:0 "弥罗布里加的朱砂"
 cinnabar_province_decision_1_desc:0 "在弥罗布里加平原上发现的朱砂与在山上发现的不相上下，这使得我们的民众更容易开采这种珍贵的矿石。为什么不扩大目前的生产规模呢？我们都知道这种矿物需求量很大，因此这会使我们从中受益。"
 cinnabar_province_decision_2:0 "卡耳尼翁的朱砂"
 cinnabar_province_decision_2_desc:0 "卡耳尼翁的群山高大而雄伟，有一个几乎无法隐藏的秘密；它们内部蕴藏着巨量的朱砂矿，使这个地区能够支持矿山开采。如果我们继续在这里投资生产，我们将会看到很多回报。"
 cinnabar_province_decision_3:0 "辛吉杜努姆的朱砂"
 cinnabar_province_decision_3_desc:0 "辛吉杜努姆的土地以一件事而闻名，只有一件事——在这个地区出产的朱砂，以令人满意的速度生产着。然而，我们可以做一些事情来提高产量。我们知道，出售我们积累的任何盈余都不会有亏损。"
 cowrieshells_province_decision_1:0 "哈瓦杜的贝币"
 cowrieshells_province_decision_1_desc:0 "千百年来，贝币一直是环印度洋地区的传统货币。在诸多贝类工艺传统中，马尔代夫群岛原住民生产的精美贝壳工艺品和货币以其悠久的历史和巨大的产量而著称。"
 darabgird_marble_mod:0 "达剌卜吉尔德的大理石"
 dates_province_decision_1:0 "奥吉拉的椰枣"
 dates_province_decision_1_desc:0 "来自奥吉拉的椰枣饱满且极具嚼劲，质量相当不错。如果在某些方面肯花时间投入，我们有办法生产出更多的椰枣。这值得花时间和精力来发展这个行业。"
 dates_province_decision_2:0 "革耳拉椰枣"
 dates_province_decision_2_desc:0 "甜美可口的椰枣遍布杰尔哈，这种水果的丰产为当地居民带来了巨大财富。如果我们投资扩大当地已有的自然产出，我们将从其兴旺的贸易中获益。"
 dates_province_decision_3:0 "梵摩拏迦的椰枣"
 dates_province_decision_3_desc:0 "人们普遍认为梵摩拏迦的椰枣比其他地方的椰枣品种更好，因为质量非常不错，我们有机会扩大该地区目前的产量。"
 dioscoridus_spices_mod:0 "迪俄斯科里杜斯的香料"
 elephants_province_decision_1:0 "末谛珠梨耶的大象"
 elephants_province_decision_1_desc:0 "来自末谛珠梨耶的大象凶猛好斗，它们的繁殖地靠近港口，这对驯象贸易来说无疑是一个福音。综合考虑各方面因素，我们有充分的理由努力提高产量。"
 elephants_province_decision_2:0 "阿他尼的大象"
 elephants_province_decision_2_desc:0 "阿他尼的丛林里到处都是大象，许多驯象人冒险进入茂密的丛林中，希望能找到更多的大象并将它们从繁殖地带出来。在国家的些许赞助下，我们可以扩大参与这一活动的人群。"
 elephants_province_decision_3:0 "提夫莱特的大象"
 elephants_province_decision_3_desc:0 "提夫莱特附近的山区是大象的家园，那儿的大象脾气温和，性情温顺，非常受欢迎。我们可以采取措施增加这一地区的驯象产量，最终我们会受益匪浅。"
 eukratideia_lapis_mod:0 "欧克拉提底阿的青金石"
 gemstones_province_decision_1:0 "提夫莱特的宝石"
 gemstones_province_decision_1_desc:0 "提夫莱特独有的宝石以其惊人的质量和清晰度而闻名，但凡某地的商店或市场上出售这种精美商品，人们都会趋之若鹜，不惜倾尽家资购买。我们应该考虑扩大这些高质量宝石的生产。"
 gemstones_province_decision_2:0 "羯耶尼的宝石"
 gemstones_province_decision_2_desc:0 "羯耶尼的丛林里隐藏着一个巨大的秘密；在这座城市附近发现了大量的钻石，当地的公民开采钻石，并将它们卖给国外的商人。只需一点点投资，我们就能看到巨大的回报。"
 gemstones_province_decision_3:0 "堤洛斯的宝石"
 gemstones_province_decision_3_desc:0 "虽然堤洛斯岛上的矿场与其他矿场相比相对较小，但它们所收获的成果比人们想象的还要多。扩大这些传奇般的宝石生产规模对于当地的统治者来说不过是一件微不足道的事情。"
 gerrha_dates_mod:0 "革耳拉椰枣"
 glass_province_decision_1:0 "图基的玻璃"
 glass_province_decision_1_desc:0 "在图基制造的玻璃被贸易船只带出这个岛屿，并为我们的人民带来了很多财富。我们应该尽一切努力扩大这种贸易产品的生产。"
 glass_province_decision_2:0 "安提戈尼亚的玻璃"
 glass_province_decision_2_desc:0 "安提戈尼亚以许多东西而闻名，而在这座城市生产的精美玻璃在其中名列前茅。我们应该千方百计扩大生产，这百利而无一害。"
 glass_province_decision_3:0 "卡泽伦的玻璃"
 glass_province_decision_3_desc:0 "在卡泽伦的丘陵上，工匠们生产玻璃，当地人已经从事这样的工作已经几个世纪，并将他们积累的知识传递给每一代玻璃工人。我们应该利用这些宝贵的知识，提高玻璃的产量。"
 jade_province_decision_1:0 "皮山的玉石"
 jade_province_decision_1_desc:0 "虽然皮山目前的玉石产量还可以接受，但我们知道，只要我们多投入一点，我们所付出的每一分钱都会翻一倍甚至三倍。在这里扩大生产的成本是值得的。"
 jade_province_decision_2:0 "于阗的玉石"
 jade_province_decision_2_desc:0 "于阗绿洲因许多东西而闻名；温暖的河流围绕的这座美丽的城市，当地的美食，还有其出产的美丽而丰富的玉石。通过扩大这里的生产，于阗玉的传奇只会继续增长。"
 jade_province_decision_3:0 "龟兹的玉石"
 jade_province_decision_3_desc:0 "你所能看到的一些最好的玉石来自遥远的地方，在世界的边缘，在龟兹——我们应该继续投资我们目前在这里生产的玉石，收获这片土地给我们带来的好处。"
 kalyani_gemstones_mod:0 "羯耶尼的宝石"
 karmanta_sugar_mod:0 "羯曼多的糖"
 kaukasou_lapis_mod:0 "高加索的青金石"
 kazerun_glass_mod:0 "卡泽伦的玻璃"
 korkei_amber_mod:0 "科尔基的琥珀"
 kuche_jade_mod:0 "龟兹的玉石"
 lapis_province_decision_1:0 "欧克拉提底阿的青金石"
 lapis_province_decision_1_desc:0 "探险者们来到巴克特里亚的原因有很多，在欧克拉提迪阿发现的青金石矿就是其中之一。这种宝石的高昂价格确保了该地区的经济富足，我们应该尽可能多地开采它。"
 lapis_province_decision_2:0 "高加索的青金石"
 lapis_province_decision_2_desc:0 "在高加索发现的青金石举世闻名，它美丽的色泽令人眼花缭乱。如果我们投资该地区的开采，我们不仅能卖出更多的宝石，还能从贸易中获取更多的经济利益，这是绝对值得的。"
 leontopolis_papyrus_mod:0 "勒翁托波利斯的莎草纸"
 madra_silk_mod:0 "摩陀罗的丝绸"
 maltecoria_elephants_mod:0 "末谛珠梨耶的大象"
 marble_province_decision_1:0 "达剌卜吉尔德的大理石"
 marble_province_decision_1_desc:0 "达剌卜吉尔德的采石场生产的大理石是该地区最好的，尽管这些石头已经开采了几个世纪，但它们的产量仍然和以前一样多。只需一点点投资，我们就能看到更大的回报。"
 massaka_cedar_mod:0 "摩娑迦的雪松木"
 metals_province_decision_1:0 "布里甘蒂亚的贵金属"
 metals_province_decision_1_desc:0 "在布里甘提亚附近探明的贵金属储量非常丰富；我们非常幸运能拥有这样的财富。我们应该尽一切努力从矿山中开采出尽可能多的资源，这对我们的民众来说百利而无一害。"
 metals_province_decision_2:0 "阿瑟戈尼亚的贵金属"
 metals_province_decision_2_desc:0 "阿瑟戈尼亚平原位于群山的丘陵地带，那里发现的贵金属给该地区带来了数不清的财富。我们有必要增加矿山的产量；尽一切努力这样做吧。"
 metals_province_decision_3:0 "闭利瞿罗的贵金属"
 metals_province_decision_3_desc:0 "我们已经很幸运，闭利瞿罗生产的贵金属长久以来数量稳定，并无枯竭的征兆，但只要稍加管理，我们就可以采取措施增加这些上天赐予的礼物的产量。"
 metals_province_decision_4:0 "特克瓦尔柴利的贵金属"
 metals_province_decision_4_desc:0 "虽然特克瓦尔柴利的矿场很多，到处都是采矿的奴隶，但我们依然很容易地采取措施提高产量。通过投资，回报将超过成本。"
 mihintale_spices_mod:0 "摩醯因多勒的香料"
 mirobriga_cinnabar_mod:0 "弥罗布里加的朱砂"
 moundou_myrrh_mod:0 "蒙杜斯的没药"
 myrrh_province_decision_1:0 "阿拉伯的没药"
 myrrh_province_decision_1_desc:0 "阿拉伯的没药享誉世界，似乎永远供不应求。我们有能力增加这种商品的产量，但我们需要更多的工人来满足需求。"
 myrrh_province_decision_2:0 "加纳的没药"
 myrrh_province_decision_2_desc:0 "加纳生产的一种没药是那些品味高雅的人的最爱，因此在市场上价格不菲。目前那儿的产量很小，但我们有能力扩大在那里的生产，从而赚一大笔钱。"
 myrrh_province_decision_3:0 "萨拉卡的没药"
 myrrh_province_decision_3_desc:0 "你有幸见过在萨拉卡出产的没药吗？大概率没有，因为这种没药很稀有。不过，可以看到这个问题业已解决，我可以向你保证，这是值得的。"
 myrrh_province_decision_4:0 "蒙杜斯的没药"
 myrrh_province_decision_4_desc:0 "蒙杜斯的人民肯定是很幸福的；他们不仅生活在这座坐落于亚丁湾海岸上的美丽城市，而且从那儿的港口驶入我们市场的没药也无与伦比。提高产量会带来很多好处。"
 olbe_cedar_mod:0 "俄尔柏的雪松木"
 opium_province_decision_1:0 "阿芙洛狄托波利斯鸦片"
 opium_province_decision_1_desc:0 "鸦片在埃及已有悠久的种植历史，自有对其特性的了解以来，它就麻醉着无数失眠者和病人的心智与神经。在远古时代，阿芙洛狄托波利斯是鸦片生产的重要之地，这一殊荣延续至今。"
 opium_province_decision_2:0 "法尔加鸦片"
 opium_province_decision_2_desc:0 "鸦片的麻醉特性最早由古代苏美尔人描述，他们称之为「欢乐植物」，并发现了其广泛的药用价值。在法尔加，这些古老的方法并未被遗忘，对这种神秘植物的专业知识仍留存于当地。"
 opium_province_decision_3:0 "卡帕塞亚鸦片"
 opium_province_decision_3_desc:0 "鸦片在塞浦路斯已有悠久的使用历史，并融入了许多深受人民喜爱的宗教仪式之中。一旦施用了卡帕塞亚的鸦片，睡眠便近在咫尺。"
 aphroditopolis_opium_mod:0 "阿芙洛狄托波利斯鸦片"
 pharga_opium_mod:0 "法尔加鸦片"
 karpaseia_opium_mod:0 "卡帕塞亚鸦片"
 paphos_cedar_mod:0 "帕福斯的雪松木"
 papyrus_province_decision_1:0 "佩尔-塞勒克的莎草纸"
 papyrus_province_decision_1_desc:0 "佩尔-塞勒克的莎草纸是该地区最好的，附近抄写员们高度渴望这种纸张，以至于几乎不可能在市场上找到。通过在那里扩大生产，我们会得到许多心怀感激的作者的感谢。"
 papyrus_province_decision_2:0 "珀加蒙的莎草纸"
 papyrus_province_decision_2_desc:0 "虽然有人说珀加蒙生产的莎草纸质量不如远在南方的莎草纸，但有很多人更喜欢我们这儿生产的，并愿意支付相同的价格。考虑到这种必需品的稀缺性，我们应该考虑扩大我们的业务，生产更多。"
 papyrus_province_decision_3:0 "勒翁托波利斯的莎草纸"
 papyrus_province_decision_3_desc:0 "勒翁托波利斯制造的莎草纸被尼罗河三角洲的城市所使用，这意味着世界各地的国王和贵族都了解它精致的品质。我们应该扩大目前的生产规模，因为根本无法满足现有的需求。"
 pearls_province_decision_1:0 "提洛斯珍珠"
 pearls_province_decision_1_desc:0 "波斯湾中的提洛斯岛以其采珠传统和出口已知世界最上等的白珍珠而闻名。提洛斯的珍珠在古代便已供应给苏美尔、亚述和巴比伦的国王们。"
 pearls_province_decision_2:0 "阿尔帕德珍珠"
 pearls_province_decision_2_desc:0 "腓尼基商人牢牢掌控着东地中海的珍珠贸易，希腊人获取的大部分珍珠都来自从阿尔帕德等城市驶来的商船。腓尼基珍珠是该地区所有精英和王室都珍视的宝石，其价值超过黄金本身。"
 tylos_pearls_mod:0 "提洛斯珍珠"
 arpad_pearls_mod:0 "阿尔帕德珍珠"
 per_selk_papyrus_mod:0 "佩尔-塞勒克的莎草纸"
 pergamon_papyrus_mod:0 "珀加蒙的莎草纸"
 pishan_jade_mod:0 "皮山的玉石"
 porcelain_province_decision_1:0 "长安瓷器"
 porcelain_province_decision_1_desc:0 "秦汉作坊中由大师级工匠制作的瓷器以其超凡的品质闻名，许多贵族都希望自己能够富裕到可以购买一件长安瓷器。"
 porcelain_province_decision_2:0 "洛阳瓷器"
 porcelain_province_decision_2_desc:0 "洛阳附近制造的周式瓷器深受品味高雅者渴求，这些作品的美丽既含蓄又迷人——专为最雅致的受众而制。"
 porcelain_province_decision_3:0 "临淄瓷器"
 porcelain_province_decision_3_desc:0 "齐国陶瓷在市场上总是索价甚高，那些在临淄风格下工作的大师艺匠铺中偶得的珍品，轻松便能卖到数百枚银币。"
 porcelain_province_decision_4:0 "郢都瓷器"
 porcelain_province_decision_4_desc:0 "楚国陶瓷如同楚人自身一样：充满活力、生机勃勃、引人入胜。虽然楚国作坊生产的多数器物品质上乘，但在郢都工作的工匠尤以技艺卓越著称。"
 changan_porcelain_mod:0 "长安瓷器"
 luoyang_porcelain_mod:0 "洛阳瓷器"
 linzi_porcelain_mod:0 "临淄瓷器"
 ying_porcelain_mod:0 "郢都瓷器"
 qana_myrrh_mod:0 "加纳的没药"
 rasht_silk_mod:0 "拉什特的丝绸"
 rugia_amber_mod:0 "鲁吉亚的琥珀"
 saraka_myrrh_mod:0 "萨拉卡的没药"
 serapeion_silphium_mod:0 "瑟拉佩翁的罗盘草"
 silk_province_decision_1:0 "摩陀罗的丝绸"
 silk_province_decision_1_desc:0 "摩陀罗生产的丝绸服装因其美丽和优雅而广受欢迎，那里的丝绸市场每天有惊人数量的钱币交易额。投资该行业是值得的，因为收益显而易见。"
 silk_province_decision_2:0 "拉什特的丝绸"
 silk_province_decision_2_desc:0 "拉什特是里海海岸边的一座城市，以丝绸生产而闻名——很难说丝绸手工业是否是这座城市繁荣的原因。增加目前在那里生产的投资，我们只会有所收获。"
 silk_province_decision_3:0 "绝域亚历山大里亚的丝绸"
 silk_province_decision_3_desc:0 "绝域亚历山大里亚目前生产的丝绸质量很好，以轻盈著称，只要对该地区进行一点投资，我们就能看到这个蓬勃发展的行业真正开始扩张。"
 silphium_province_decision_1:0 "瑟拉佩翁的罗盘草"
 silphium_province_decision_1_desc:0 "瑟拉佩翁很幸运能够生产松香草，尽管我们已经幸运地拥有这种可爱植物的稳定供应，我们依然可以做一些事情来帮助这个行业发展壮大。"
 singidunum_cinnabar_mod:0 "辛吉杜努姆的朱砂"
 spices_province_decision_1:0 "摩醯因多勒的香料"
 spices_province_decision_1_desc:0 "对于那些喜欢麻辣风味，令人上头的菜肴的人来说，摩醯因多勒的香料是烹饪的首选。我们的商人售卖的所有当地香料都会被抢购一空，我们应该赚更多的钱，并从中获益。"
 spices_province_decision_2:0 "迪俄斯科里杜斯的香料"
 spices_province_decision_2_desc:0 "据说，除非在迪俄斯科里杜斯生产的香料被购入食品储藏室中，否则一个王国的厨房都是不完整的。对这些香料的需求超过了我们目前的供应能力，但我们可以采取措施，确保那些让人垂涎欲滴的菜肴调味得当。"
 state_owned_resources_mod:0 "国有资源"
 sugar_province_decision_1:0 "折梨多罗的糖"
 sugar_province_decision_1_desc:0 "在折梨多罗附近的平原上，溪流与土地汇合形成一个个小三角洲，那里生长着一种多汁甜美的甘蔗。这个地区以生产糖而闻名，在我们的帮助下，我们可以生产更多的糖。"
 sugar_province_decision_2:0 "阐陀罗鸡都揭诃的糖"
 sugar_province_decision_2_desc:0 "虽然阐陀罗鸡都揭诃定期肆虐的洪水是一个巨大的问题，但退潮后当地沉积的丰富淤泥成为了他们在那里种植糖类作物的理由。考虑到此地已经大面积种植甘蔗，在我们的投资下，想要多少糖我们就能生产多少。"
 sugar_province_decision_3:0 "羯曼多的糖"
 sugar_province_decision_3_desc:0 "羯曼多的糖以其色泽清亮而闻名，如那些稀有的山珍海味一样，是最好的美食家所渴望的食材。甘蔗在这个地区自由生长，通过扩大我们的收获能力，我们将继续满足世界各地对蔗糖的需求。"
 tantonum_gemstones_mod:0 "坦托农的宝石"
 tea_province_decision_1:0 "毗茶"
 tea_province_decision_1_desc:0 "茶叶的种植始于数千年前的四川盆地，由蜀人和巴人开创，他们至少从周朝起就将茶叶贸易给中原王室。秦国征服蜀巴并在四川盆地推行殖民之后，秦国统治者将茶树的种植推广至整个中国，因为这种饮品因其药用价值、口感和温和的提神效果而备受推崇。"
 tea_province_decision_2:0 "邛都茶"
 tea_province_decision_2_desc:0 "虽然四川盆地是最著名的茶叶种植区，但沿青藏高原边缘更南的地区自古以来也种植茶叶。邛都部落的人民便是这些早期南方种植者之一。"
 sichuan_tea_mod:0 "四川茶"
 yunnan_tea_mod:0 "邛都茶"
 thebai_arabikai_myrrh_mod:0 "阿拉伯的没药"
 thriving_local_trade_smod:0 "蓬勃发展的本地贸易"
 tiflet_elephants_mod:0 "提夫莱特的大象"
 tortoiseshell_province_decision_1:0 "阿波科帕龟甲"
 tortoiseshell_province_decision_1_desc:0 "厄立特里亚海非洲沿岸出产许多珍贵的货物，也许其中没有比龟甲更受欢迎的了。在阿波科帕港口附近，以贸易为生的部落民生产着全世界最精美的龟甲。远至印度和罗马的港口都寻求与非洲沿海居民贸易，愿意为当地人捕捞的华丽龟甲支付几乎任何价格。"
 africa_tortoiseshell_mod:0 "阿波科帕龟甲"
 huvadhoo_cowrieshell_mod:0 "哈瓦杜贝币"
 tqvarcheli_metals_mod:0 "特克瓦尔柴利的贵金属"
 trade_good_events.1.a:0 "人们涌向加纳，想了解我们的贸易秘诀。"
 trade_good_events.1.b:0 "告诉所有人这一切归功于谁——当然是我。"
 trade_good_events.1.c:0 "一定要收回我们的欠款。"
 trade_good_events.1.desc:0 "在我们的领导下，加纳的没药贸易额大幅增长，超出了我们对该省本已很高的产量预期。而且有个令人振奋、意想不到的消息，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]；由于现金充裕，物资充足，加纳的头部贸易商在邻近省份开设了作坊。那儿的没药产业似乎还在高速扩张。"
 trade_good_events.1.t:0 "加纳的没药"
 trade_good_events.10.a:0 "我们可以把已经获得的利润再投资。"
 trade_good_events.10.b:0 "我想我们的欠款少了一点吧？"
 trade_good_events.10.desc:0 "瑟拉佩翁的罗盘草只有看到了才会相信，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]；那儿的草秆就像从地里长出来的黄金一样。天刚蒙蒙亮时，我们的农场里就已经满是农民了，他们收割罗盘草，直到黄昏才结束劳作。尽管我们目前还在大赚特赚，但我们的一些顾问认为，我们还可以做更多的事情来推动那儿的行业发展。"
 trade_good_events.10.t:0 "瑟拉佩翁的罗盘草"
 trade_good_events.2.a:0 "人们来这里是为了没药，但留下来是为了我们的其他商品。"
 trade_good_events.2.b:0 "我们不应该分一杯羹吗？"
 trade_good_events.2.desc:0 "蒙杜斯，我们的没药名城，最近正处于繁荣时期。我们的市场有着各种各样令人喜爱的商品，其中最主要的自然是我们的芳香树脂，国库充满了外国的金银钱币，上面雕刻着许多从未听说过的国王的头像。看起来，似乎全世界都在谈论蒙杜斯。"
 trade_good_events.2.t:0 "蒙杜斯的没药"
 trade_good_events.3.a:0 "让他们从当地的泥泞里回来吧，我们要感谢他们。"
 trade_good_events.3.b:0 "他们应该留下来帮助搬运蔗糖产品。"
 trade_good_events.3.c:0 "也许羯曼多可以成为它们的新家？"
 trade_good_events.3.desc:0 "现在正是羯曼多收割甘蔗的时节；多亏了你的倡议，农民们说我们的收成比以往任何时候都多。事实上，我们不得不派遣额外的劳动力来帮忙，一旦繁重的劳动完成，我们将不得不决定如何处理这些派遣来的劳力。他们当然可以回家，但也许他们会留在羯曼多？"
 trade_good_events.3.t:0 "羯曼多的糖"
 trade_good_events.4.a:0 "愿我们的命运交织在一起。"
 trade_good_events.4.desc:0 "随着在弥罗布里加可以买到优质朱砂的消息传开，越来越多的商人来到我们这儿。起初，他们只会待几天，住宿时则搭起帐篷，并很快就拆掉，但现在，看看市场上一片热火朝天的工作场景。许多木石被运来用于建筑，因为一些主要贸易商的代表需要在弥罗布里加设立联络处；这些商人似乎打算永远留在这里。"
 trade_good_events.4.t:0 "弥罗布里加的朱砂"
 trade_good_events.5.a:0 "他们要什么就给他们什么。"
 trade_good_events.5.b:0 "向外宣传说我们希望探险者来这里。"
 trade_good_events.5.c:0 "你为什么要拿这个来烦我？把税交过来就完事了。"
 trade_good_events.5.desc:0 "卡耳尼翁持续开采的朱砂使得该地区居民的财富日益增长，但最近我们收到消息称，他们需要更多的劳动力。山里的生活已经很艰苦了，那些在矿井里工作的人过得更是苦不堪言。尽管如此，这仍然是一个有利可图的行业，吸引了那些愿意用自己的劳动换取财富的人。我们该怎么办？"
 trade_good_events.5.t:0 "卡耳尼翁的朱砂"
 trade_good_events.6.a:0 "允许移民定居，但不能太多。"
 trade_good_events.6.b:0 "传出去，辛吉杜努姆的财富在等着他们。"
 trade_good_events.6.c:0 "你说采矿成功？那我的那份钱呢？"
 trade_good_events.6.desc:0 "无论以何种标准衡量，开采朱砂都是成功的选择；我们的劳工们继续不受干扰地开采矿物，珠宝商和工匠则制造出精美的物品，让任何看到它们的人都羡慕不已。在这些故事的鼓舞下，一些当地部族的人希望允许他们放弃原有的生计，从事朱砂开采。我们该怎么对他们说？"
 trade_good_events.6.t:0 "辛吉杜努姆的朱砂"
 trade_good_events.7.a:0 "我们应该庆祝一下，你说呢？"
 trade_good_events.7.desc:0 "今天早上传来了好消息，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]；在欧克拉提底阿的矿山，工人们发现了一大片深蓝青金石的矿脉，上面有着硬币大小的金斑。这一发现确保了该地区几十年的经济活力——我们将变得无比富有！"
 trade_good_events.7.t:0 "欧克拉提底阿的青金石"
 trade_good_events.8.a:0 "国家将接手这里。"
 trade_good_events.8.b:0 "传播高加索矿山开始承包的消息。"
 trade_good_events.8.c:0 "抽一小笔，把剩下的利润再投资矿山。"
 trade_good_events.8.desc:0 "高加索附近的青金石产业正在蓬勃发展，毫无疑问，这要归功于您的领导，但现在我们正处于抉择当中。由于国家对矿业的发展负有责任，因此，有些人认为我们应该在管理矿山方面发挥更积极的作用。尽管这并不是什么糟糕的问题，但是我们必须就该地区的未来做出决定。"
 trade_good_events.8.t:0 "高加索的青金石"
 trade_good_events.9.a:0 "叫我们的监工回家吧，让皮山人替我们干活。"
 trade_good_events.9.b:0 "加税！"
 trade_good_events.9.c:0 "我们希望更多的人住在这里……"
 trade_good_events.9.desc:0 "你刚从皮山的玉石矿回来，脑子里想着未来的各种可能性。你在这个地区的一切投入都带来了前所未有的发展，当地工匠制作的玉雕简直是杰作。我们是应该继续改善当地的基础设施，还是让事情顺其自然地发展？"
 trade_good_events.9.t:0 "皮山的玉石"
 tuci_glass_mod:0 "图基的玻璃"
 tylos_gemstones_mod:0 "堤洛斯的宝石"
 vorganium_amber_mod:0 "沃耳加尼翁的琥珀"
 wootzsteel_province_decision_1:0 "阿努拉德普勒之钢"
 wootzsteel_province_decision_1_desc:0 "阿努拉德普勒铁匠大师锻造的钢铁深受上层阶级青睐，他们将生命和安全托付给金钱能买到的最精良武器。"
 wootzsteel_province_decision_2:0 "马杜赖之钢"
 wootzsteel_province_decision_2_desc:0 "在马杜赖工作的工匠大师创造出了一种在地区内迅速引起关注的钢合金，许多战士和王公亲自前往当地铁匠的村庄作坊下订单。"
 wootzsteel_province_decision_3:0 "乌赖尤尔之钢"
 wootzsteel_province_decision_3_desc:0 "许多来到乌赖尤尔的往来商人都是为了采购当地的钢锭，因为那里的铁匠天赋异禀。"
 wootzsteel_province_decision_4:0 "卡里格之钢"
 wootzsteel_province_decision_4_desc:0 "在卡里格，有一种铁矿石可以加工成强度是其他钢铁两倍的钢。"
 wootzsteel_province_decision_5:0 "宛奇之钢"
 wootzsteel_province_decision_5_desc:0 "对于那些听说过'宛奇'这个名字的人来说，它已经成为那个地区勤劳人民锻造厂和铸造厂中高品质钢铁的代名词。"
 anuradhapura_wootzsteel_mod:0 "阿努拉德普勒之钢"

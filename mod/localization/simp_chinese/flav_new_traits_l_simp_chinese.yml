 carouser_desc:0 "[CHARACTER.GetPraenomen]是一个内心狂热的人，[CHARACTER.GetPraenomen]喜欢和好朋友在一起，也喜欢和酒在一起。不断邀请同事和外交官参加奢华的聚会，[CHARACTER.GetPraenomen]在不知不觉中通过他们对酒和宴会的热爱建立了联系。"

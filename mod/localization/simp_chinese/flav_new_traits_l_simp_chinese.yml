 impatient_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 毛躁#!特质。"
 impatient_desc:0 "[CHARACTER.GetPraenomen]在生理上无法容忍哪怕是一秒钟的拖延；虽然他们严格的不耐烦有助于加快建设，但这种不耐烦在劳动阶层中没有赢得任何好感。"
 inferiority_complex:0 "自卑"
 inferiority_complex_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 自卑感#!特质。"
 inferiority_complex_desc:0 "[CHARACTER.GetPraenomen]总是试图超越[CHARACTER.GetHerHis]的同行，即使没有人认为这是一场竞争。[CHARACTER.GetPraenomen]因此把每个人都看成是对手，并把钱浪费在建造最大和最奢侈的建筑上，尽管它们没有给任何人留下印象。"

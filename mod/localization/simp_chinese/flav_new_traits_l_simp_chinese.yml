 intimidating_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 令人畏惧#!特质。"
 intimidating_desc:0 "[CHARACTER.GetPraenomen]有一个非常吓人的外表。即使[CHARACTER.GetSheHe]试图表现得友好，[CHARACTER.GetSheHe]也忍不住看起来很吓人。然而，这样做的一个奇怪的结果是，直接主体更不可能越轨或冒犯[CHARACTER.GetHerHim]。"
 midas_touched:0 "点石成金者"
 midas_touched_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 点石成金者#!特质。"
 midas_touched_desc:0 "[CHARACTER.GetPraenomen]受到众神祝福，拥有几乎从无中生利的能力。[CHARACTER.GetSheHe]极擅管理黄金与钱币相关的一切；与可怜的弥达斯王那种伪装成祝福的诅咒不同，这份祝福几乎没有什么缺点。"
 mil_indecisive:0 "优柔寡断"
 mil_indecisive_bad_tooltip:0 "此选项为#Y 独占#!，因为你的统治者拥有#Y 优柔寡断#!特质。"
 mil_indecisive_desc:0 "[CHARACTER.GetPraenomen]极度优柔寡断，常常不知何时进攻何时撤退。这使得[CHARACTER.GetHerHim]在[CHARACTER.GetHerHis]士兵和普通民众中都很不受欢迎。"
 narcissistic:0 "自恋"
 narcissistic_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 自恋#!特质。"
 narcissistic_desc:0 "[CHARACTER.GetPraenomen]，很像那喀索斯，可以连续几天盯着[CHARACTER.GetHerHis]自己在池塘里的倒影。不幸的是，似乎没有人知道为什么[CHARACTER.GetSheHe]这么爱[CHARACTER.GetHerHim]自己。"
 obsessive_perfectionist:0 "吹毛求疵"
 obsessive_perfectionist_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 吹毛求疵#!的特质。"
 obsessive_perfectionist_desc:0 "[CHARACTER.GetPraenomen]痴迷于确保一切按他们的标准完美无缺。因此在建筑项目中经常浪费大量的金钱和时间来确保绝对的完美。真的，再看看吧，也许还能再改进呢……"
 on_a_pilgrimage_status:0 "朝圣中"
 on_a_pilgrimage_status_desc:0 "[CHARACTER.GetPraenomen]正前往圣地朝圣，因此无法指挥军队。"
 overbearing:0 "专横"
 overbearing_bad_tooltip:0 "此选项#Y 可用#! ，因为你的统治者有#Y 专横#!特质。"
 overbearing_desc:0 "[CHARACTER.GetPraenomen]有一个习惯，就是对[CHARACTER.GetHerHis]的臣民以及外国外交官非常跋扈和傲慢，总是用[CHARACTER.GetHerHis]的头向上倾斜来俯视他们。"
 pacifist:0 "和平主义者"
 pacifist_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 和平主义者#!特质。"
 pacifist_desc:0 "[CHARACTER.GetPraenomen]是一个内心真诚的和平主义者。他们不太可能宣战，更可能接受和平，他们的和平主义为他们赢得了外国的青睐，以及那些会被典型地招募到血腥的、有时没有方向的战争中的自由人。"
 paranoid:0 "偏执"
 paranoid_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者拥有#Y 多疑#!特质。"
 paranoid_desc:0 "[CHARACTER.GetPraenomen]很难信任他人，对[CHARACTER.GetHerHis]的敌人和[CHARACTER.GetHerHis]的朋友一视同仁——从拒人千里的角度而言。因此，如果[CHARACTER.GetPraenomen]背叛了你，别太在意——[CHARACTER.GetSheHe]只是在你背叛[CHARACTER.GetHerHim]之前先下手为强罢了。"
 patient:0 "耐心"
 patient_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 耐心#!特质。"
 patient_desc:0 "[CHARACTER.GetPraenomen]有令人难以置信的耐心，无论是与外国打交道，等待臣民的进贡，还是有耐心在围攻中榨干一个堡垒。"
 pessimistic:0 "悲观"
 pessimistic_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 悲观#!特质。"
 pessimistic_desc:0 "[CHARACTER.GetPraenomen]难以看到生活中的美好。更多时候，[CHARACTER.GetSheHe]看到的是玻璃杯是半空的。"
 pilgrim_status:0 "朝圣者"
 pilgrim_status_desc:0 "[CHARACTER.GetPraenomen]已完成前往圣地的朝圣，这使得其心灵更加接近信仰。"

 forger_desc:0 "[CHARACTER.GetPraenomen]是造假的专家，无论是编造文件以索取外国土地，伪造遗嘱以增加合法性和作为继承人的吸引力，还是编造信件和报告以抹黑[CHARACTER.GetHerHis]对手的声誉。"

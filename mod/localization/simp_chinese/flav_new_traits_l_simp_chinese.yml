 resourceful_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 足智多谋#!特质。"
 resourceful_desc:0 "[CHARACTER.GetPraenomen]就像他们一样足智多谋。如果你只给[CHARACTER.GetPraenomen]几块木板，[CHARACTER.GetSheHe]可能会设法用它做一些有用的东西。"
 seducer:0 "诱惑者"
 seducer_bad_tooltip:0 "此选项为#Y专属#!，因为你的统治者拥有#Y 诱惑者#!特质。"
 seducer_desc:0 "[CHARACTER.GetPraenomen]是一个巧舌如簧之人，浑身散发着魅力。[CHARACTER.GetHerHis]性格的这一面也帮助[CHARACTER.GetPraenomen]在更通奸的事情上得到[CHARACTER.SheHe]想要的。"
 shy:0 "害羞"

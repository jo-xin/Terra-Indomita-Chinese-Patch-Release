 governor_severe_overseer:0 "严苛监工"
 governor_severe_overseer_desc:0 "[CHARACTER.GetPraenomen] 在利用人力进行大规模工程和生产时的冷酷无情，使得其治区的当地奴隶人口产出得以增加。"
 governor_severe_overseer_tooltip:0 "此选项可用，因为你的统治者拥有 #Y 严苛监工#! 特质。"
 governor_tribal_mediator:0 "部落调解人"
 governor_tribal_mediator_desc:0 "[CHARACTER.GetPraenomen] 是调解部落间以及部落民与统治阶级之间争端的专家。"
 governor_tribal_mediator_tooltip:0 "此选项可用，因为你的统治者拥有 #Y 部落调解人#! 特质。"
 herculean:0 "赫拉克勒斯之力"

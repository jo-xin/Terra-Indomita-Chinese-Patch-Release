 easygoing_desc:0 "[CHARACTER.GetPraenomen]是个相当轻松的家伙，过着[CHARACTER.GetHerHis]无忧无虑的日子。虽然这使得[CHARACTER.GetHerHim]很容易和别人交朋友，而且对[CHARACTER.GetHerHis]臣民的要求也不那么严格，但[CHARACTER.GetHerHis]对部队的监督不严，会导致一些纪律性不强的军队。"

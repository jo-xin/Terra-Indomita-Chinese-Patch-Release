 uncouth_desc:0 "[CHARACTER.GetPraenomen]简直就是野蛮的代名词。然而，[CHARACTER.GetHerHis]的粗野也有几分益处，因为[CHARACTER.GetPraenomen]通常与雇佣兵相处融洽，能够把酒言欢自日落至日出。"

 dull_desc:0 "[CHARACTER.GetPraenomen]的脑子里没有多少东西，这使得[CHARACTER.GetHerHim]在客人面前讲话时显得相当乏味；而[CHARACTER.GetHerHim]在卧榻之上同样无趣，令[CHARACTER.GetHerHis]的配偶大为失望。"
 easygoing:0 "随和"

 pillager_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 掠夺者#!特质。"
 pillager_desc:0 "[CHARACTER.GetPraenomen]是一个强盗，他对以牺牲他人的利益来扩大自己的财富毫无顾忌。无论在战争还是和平时期，他都尽可能地攫取更多的战利品，[CHARACTER.GetPraenomen]与那些同样掠夺沿海富裕城市的海盗交往也没有问题。"
 provocateur:0 "挑衅者"
 provocateur_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 煽动者#!特质。"
 provocateur_desc:0 "[CHARACTER.GetPraenomen]是沸腾[CHARACTER.GetHerHis]对手的血液的大师，激起他们的愤怒，然后用来对付他们，使[CHARACTER.GetHerHis]对手难堪，提升[CHARACTER.GetPraenomen]自己的地位。"
 pyromaniac:0 "火焰狂人"
 pyromaniac_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 火焰狂人#!特质。"
 pyromaniac_desc:0 "[CHARACTER.GetPraenomen]喜欢看到燃烧的物体（和生命体）。这种扭曲的享受的来源到底是什么？谁知道呢。重要的是，这使得执行更有效（和无情）的围攻和焦土战术——我们最好不要再问任何问题了。"
 reclusive:0 "蛰居"
 reclusive_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 蛰居#!特质。"

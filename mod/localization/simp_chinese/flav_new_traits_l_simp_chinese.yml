 governor_lax_administrator:0 "宽松行政官"
 governor_lax_administrator_desc:0 "[CHARACTER.GetPraenomen] 在向 [CHARACTER.GetSheHe] 所治理的人民征收赋税和贡赋时并不十分严格。虽然这导致税收收入减少，但 [CHARACTER.GetHerHis] 宽松的态度安抚了 [CHARACTER.GetPraenomen] 治下的大多数纳税人。"

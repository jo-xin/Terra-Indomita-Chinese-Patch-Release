 extravagant_desc:0 "[CHARACTER.GetPraenomen]极其奢侈，将大量财富挥霍在浮华的物质享受上。然而，正因如此，[CHARACTER.GetHerHis]乐意向使节和外国君主慷慨地赠送礼物，这赢得了他们的喜爱。"

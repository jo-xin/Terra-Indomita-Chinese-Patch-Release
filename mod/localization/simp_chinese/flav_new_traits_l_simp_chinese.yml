 shy_desc:0 "[CHARACTER.GetPraenomen]相当害羞，所有见过[CHARACTER.GetHerHim]的人都注意到这一点。在别人面前总是很胆怯，不管是那些[CHARACTER.GetSheHe]认识不到一分钟或多年的人，这个人也不敢怀有任何背叛野心的想法。"
 trustworthy:0 "值得信赖"
 trustworthy_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 值得信赖#!特质。"
 trustworthy_desc:0 "如果你对谁站在你这边有疑问，你总是可以相信[CHARACTER.GetPraenomen]会支持你，无论[CHARACTER.GetSheHe]是朋友、盟友还是主体。"
 two_faced:0 "表里不一"
 two_faced_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者有#Y 两面派#!特质。"
 two_faced_desc:0 "没有人能够弄清楚[CHARACTER.GetPraenomen]的想法——他今天可能是位慷慨仁厚的挚友，明天却可能变成一个冷酷刻薄的敌人。唯一能确定的是，这人并不可信，展现在其脸上的一切很可能都只是伪装。"

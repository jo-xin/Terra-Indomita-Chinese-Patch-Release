 charming_desc:0 "[CHARACTER.GetPraenomen]散发着难以言喻的的魅力与可亲——即使[CHARACTER.GetPraenomen]是个不学无术的傻瓜，只要[CHARACTER.GetSheHe]站在众人面前，就仍能吸引整个国度的追随者和崇拜者。"

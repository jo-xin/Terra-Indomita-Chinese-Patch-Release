 herculean_desc:0 "[CHARACTER.GetPraenomen]拥有非凡的力量与勇武，堪称传说般的战士。"
 homosexual:0 "同性恋"
 homosexual_bad_tooltip:0 "由于你的统治者拥有#Y 同性恋#!特质，此选项为#Y 专属#!。"
 homosexual_desc:0 "[CHARACTER.GetPraenomen]因与同性发生性关系而闻名。这意味着[CHARACTER.GetPraenomen]可以尝试#Y 勾引#!同性，若对方也是#Y 同性恋#!或#Y 双性恋#!，成功率会大幅提高。"
 immature:0 "幼稚"
 immature_bad_tooltip:0 "此选项#Y 可用#!，因为你的统治者拥有#Y 幼稚#!特质。"
 immature_desc:0 "[CHARACTER.GetPraenomen]具有儿童的成熟度，这使得处理国家内部和外部事务更加困难。然而，与此同时，一个不成熟的领导人更有可能被周围的人低估。"

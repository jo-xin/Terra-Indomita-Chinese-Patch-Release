 eccentric_desc:0 "[CHARACTER.GetPraenomen]做事的方式非常……古怪……从[CHARACTER.GetHerHis]言谈到[CHARACTER.GetSheHe]处理[CHARACTER.GetHerHis]日常生活的方式皆是如此。虽然有些人待在[CHARACTER.GetHerHim]身边会感到不自在，但不可否认，[CHARACTER.GetPraenomen]正在做的事确实有效。"
 extravagant:0 "奢靡"

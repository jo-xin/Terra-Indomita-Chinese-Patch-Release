l_simp_chinese:
 afro_arabian_philosophy:0 "努比亚传统"
 afro_arabian_philosophy_2:0 "阿拉伯传统"
 afro_arabian_philosophy_2_desc:0 "."
 afro_arabian_philosophy_desc:0 "."
 anatolian_philosophy:0 "安纳托利亚军事传统"
 anatolian_philosophy_2:0 "亚美尼亚-本都军事传统"
 anatolian_philosophy_2_desc:0 "描述"
 anatolian_philosophy_desc:0 "描述"
 arabian_path_1:0 "阿拉伯福地"
 arabian_path_10:0 "最完美的野兽"
 arabian_path_10_desc:0 "骆驼的众多阿拉伯名字之一“贾马尔”源自“完整”的概念，表明阿拉伯人对这种非凡动物的高度尊重。"
 arabian_path_11:0 "航行七海"
 arabian_path_11_desc:0 "阿拉伯水手必须面对许多危险，例如海盗、天气、疾病以及偶尔出现的洛克鸟，这种鸟如此巨大，它可以用爪子抓住大象。"
 arabian_path_12:0 "阿拉伯马育种"
 arabian_path_12_desc:0 "阿拉伯马是世界上最著名的马种之一。它也是最古老的马种之一，考古证据表明类似现代阿拉伯马的马匹可以追溯到4500年前。它们受到贝都因人的珍视，可能最早在肥沃新月带北缘被驯化。阿拉伯马被培育成具有速度、耐力、坚固性和智慧的战马。母马比种马更受欢迎，因为它们更安静，不会暴露它们的位置。"
 arabian_path_13:0 "伟大的战舰"
 arabian_path_13_desc:0 "通过建造更坚固的战舰，我们将保持对海洋的控制，迫使我们的敌人通过沙漠来找我们。"
 arabian_path_14:0 "耗尽敌人"
 arabian_path_14_desc:0 "最终，他们会在这片残酷的土地上死去，屈服于太阳、秃鹰和长矛的最终刺击。"
 arabian_path_15:0 "闪电打击"
 arabian_path_15_desc:0 "我们轻盈迅速地在景观上驰骋。"
 arabian_path_1_desc:0 "通常被误解为“快乐”，名字“幸福”强调了南阿拉伯的肥沃。这个名字是由希腊人和罗马人给出的，因为这个地区的气候宜人，农产品、香料和香料丰富。"
 arabian_path_2:0 "萨伊夫·安尼思"
 arabian_path_2_desc:0 "萨伊夫·安尼思是一种早期的阿拉伯铁剑。阿拉伯人认为剑是最重要的武器。"
 arabian_path_3:0 "贝都因骑手"
 arabian_path_3_desc:0 "没有人能像贝都因人那样说服或强加他的意志给骆驼，贝都因人和它一起在星空下吃饭和睡觉。"
 arabian_path_4:0 "突袭"
 arabian_path_4_desc:0 "突袭通常在黎明前进行。袭击者可能会制造分散注意力的行为，例如点燃火焰，然后突袭以抢劫和俘虏囚犯，只在黎明前将他们带走。"
 arabian_path_5:0 "穆罕纳德"
 arabian_path_5_desc:0 "穆罕纳德是一种在印度制造的剑，经常由南方发明的乌兹钢制成，受到阿拉伯人的高度重视。"
 arabian_path_6:0 "穆鲁瓦"
 arabian_path_6_desc:0 "穆鲁瓦通常被翻译为“男子气概”或“阳刚之气”，在贝都因文化中是至关重要的价值观，至今仍然如此。"
 arabian_path_7:0 "沙漠城堡"
 arabian_path_7_desc:0 "由萨巴国王伊利-沙尔哈·亚赫迪布在公元前8世纪建造的古姆丹宫是世界上最古老的城堡，塔楼高达二十层。公元前1世纪，当罗马人围攻马里布时，他们不得不在一周内撤退，因为疾病、供应线过长和残酷的沙漠环境。"
 arabian_path_8:0 "市场的财富"
 arabian_path_8_desc:0 "东方的市场和集市提供了金钱可以买到的任何东西……只要价格合适。"
 arabian_path_9:0 "千螫之死"
 arabian_path_9_desc:0 "如果太阳不杀死你，热量不杀死你，饥饿不杀死你，口渴不杀死你，鬣狗不杀死你，蝎子不杀死你……那么我们一定会杀死你。"
 armenian_path_1:0 "马术文化"
 armenian_path_10:0 "赫梯传统"
 armenian_path_10_desc:0 "赫梯是过去时代的可怕战士。现在，只有一些记忆和他们的战斗艺术。"
 armenian_path_11:0 "太阳战士"
 armenian_path_11_desc:0 "太阳是赫梯人的主要神灵，献给她的战士更难被打败。"
 armenian_path_12:0 "阿扎塔夫雷亚"
 armenian_path_12_desc:0 "亚美尼亚最负盛名的骑兵，通常由亚美尼亚贵族的幼子组成。"
 armenian_path_13:0 "山地骑手"
 armenian_path_13_desc:0 "你必须骑马穿越山丘和远方，才能看到整个安纳托利亚。也许这种经历会在战争中帮助你。"
 armenian_path_14:0 "骑射手"
 armenian_path_14_desc:0 "在专家手中，弓是致命的，但如果同样的弓箭手骑在马上，那么即使是死亡本身也显得苍白无力。"
 armenian_path_15:0 "米特里达梯的遗产"
 armenian_path_15_desc:0 "本都的米特里达梯在那个时代实现了很少有人能做到的事情。他在继业者之外建立了一个王国，并成功地保持了他的王国完整。"
 armenian_path_1_desc:0 "在亚洲，马必须是战争中最重要的动物。有些人甚至将整个文化都奉献给它。"
 armenian_path_2:0 "亚美尼亚马育种"
 armenian_path_2_desc:0 "亚美尼亚的阿伊鲁兹是古代战争中最重要的马种之一。"
 armenian_path_3:0 "本都侦察兵"
 armenian_path_3_desc:0 "在本都，你不会向前侦察；本都侦察兵会找到你。"
 armenian_path_4:0 "皇家卫队"
 armenian_path_4_desc:0 "任何自称为国王的人都必须用他的卫队给来访者留下深刻印象。哦，有时他们也可以救他。"
 armenian_path_5:0 "城市发展"
 armenian_path_5_desc:0 "安纳托利亚的沿海地区为繁荣的城市提供了理想的条件。"
 armenian_path_6:0 "骑术学校"
 armenian_path_6_desc:0 "许多人在空闲时间喜欢骑马。这在战争和和平时期都是一种有用的技能。"
 armenian_path_7:0 "山地生活"
 armenian_path_7_desc:0 "一些部落像他们的祖先一样住在山丘和山区。虽然他们不富有，但他们了解自己的地形。"
 armenian_path_8:0 "扩展的亲属网络"
 armenian_path_8_desc:0 "血浓于水；帮助你的亲属就是帮助你自己。"
 armenian_path_9:0 "希腊-本都重装步兵"
 armenian_path_9_desc:0 "与他们的母城不同，希腊城邦适应了安纳托利亚。然而，他们带来了他们的战斗风格，许多人现在都在使用。"
 bactrian_path_1:0 "叼羊"
 bactrian_path_10:0 "山地游骑兵"
 bactrian_path_10_desc:0 "这些游骑兵在我们现在称之为兴都库什的山脉中生活和死亡。他们知道许多小路可以出其不意地袭击敌人。"
 bactrian_path_11:0 "萨加利斯"
 bactrian_path_11_desc:0 "萨加利斯是一种由欧亚草原的塞克和斯基泰人使用的战斧或战锤。"
 bactrian_path_12:0 "塔里木绿洲城市"
 bactrian_path_12_desc:0 "在塔里木的干旱地区，有绿洲。在这些绿洲中，许多人在严酷的环境中建立了城市。"
 bactrian_path_13:0 "粟特山岩"
 bactrian_path_13_desc:0 "消息传来，大量当地人躲避在粟特岩上，其中包括拒绝向亚历山大投降的巴克特里亚人欧克夏特斯的妻子和女儿，他选择了这个避难所，以为它是坚不可摧的。因此，亚历山大向岩石进发。他发现它在各方面都对攻击者造成了很大的阻力。当地人为长期围困准备了物资，而顶部的深雪使攀登对马其顿人来说更加困难，同时几乎确保了防御者有无限的水源。然而，亚历山大决心进行攻击。他决心的原因是当地人的挑衅嘲笑，这使他非常愤怒。他召唤他们讨论条件，并提出允许他们回家，条件是交出堡垒，但他们对提议的回应是一阵大笑。然后他们告诉亚历山大，带着有翅膀的士兵来为他占领岩石，因为没有其他类型的人会让他们感到丝毫的不安。结果，亚历山大宣布，他将给予第一个登上顶峰的人十二塔兰特，第二个十一塔兰特，第三个十塔兰特，依此类推，直到第十二个，他将获得三百达里克金币。大约三百名在之前围攻中有攀岩经验的人现在集合起来，在夜幕的掩护下向岩壁最陡峭的部分出发，他们知道那里最不可能受到防守；然后，将钉子钉入裸露的地面或似乎最能承受压力的雪块中，他们每人找到一条路爬上去。在攀登过程中，大约有三十人丧生，但其余人在黎明时分到达了顶部，岩石的顶部属于他们。亚历山大派遣传令兵向敌军的前哨传达消息，他们现在可以投降了，因为已经找到了有翅膀的人，并且已经占领了顶峰。当地人看到马其顿军队的一小部分，尽管人数很少，但他们的出现是如此出人意料，以至于他们被吓坏了，想象着更多的部队已经占领了这个地方，结果他们投降了。"
 bactrian_path_14:0 "老兵社区"
 bactrian_path_14_desc:0 "我们的老兵教导年轻的新兵，他们的经验与年轻的气质相结合。"
 bactrian_path_15:0 "丝绸之路"
 bactrian_path_15_desc:0 "丝绸之路开始由亚历山大的继业者建立。在接下来的几个世纪里，它逐渐形成了更为人熟知的形态。"
 bactrian_path_1_desc:0 "“叼羊”是一种运动，参赛者骑马尝试用山羊或小牛的尸体进球。"
 bactrian_path_2:0 "射箭训练"
 bactrian_path_2_desc:0 "弓箭手需要训练。巴克特里亚人已经开发了一些有趣的练习来射下任何麻烦。"
 bactrian_path_3:0 "塞克人步兵"
 bactrian_path_3_desc:0 "有时候，即使是爱马文化也不得不接受马并不是解决一切问题的办法。"
 bactrian_path_4:0 "巴克特里亚骆驼育种"
 bactrian_path_4_desc:0 "干燥地区和骆驼是密不可分的。巴克特里亚人在育种最坚韧的个体方面表现出色。"
 bactrian_path_5:0 "斯基泰葬礼仪式"
 bactrian_path_5_desc:0 "大麻是斯基泰死者崇拜的重要组成部分。国王或王后死后安葬后，斯基泰人会进入小帐篷吸入大麻种子和花朵的烟雾，以净化自己。还有证据表明，男人和女人在更随意的情况下也会吸食大麻。"
 bactrian_path_6:0 "毒箭头"
 bactrian_path_6_desc:0 "这对任何入侵者来说都是一个令人讨厌的惊喜！亚历山大可以讲一个关于它们的故事……"
 bactrian_path_7:0 "托米丽斯的遗产"
 bactrian_path_7_desc:0 "托米丽斯是里海东部土地上的一位女战士。她是伊朗人，成功抵御了居鲁士大帝的入侵。"
 bactrian_path_8:0 "空中死亡"
 bactrian_path_8_desc:0 "那是一朵云吗？那是一群鸟吗？不，是箭！"
 bactrian_path_9:0 "专家觅食者"
 bactrian_path_9_desc:0 "在极端环境中，独特的技能得以发展。在这里，人们从未忘记如何仅从野生自然中养活自己。"
 camels_hills_combat_bonus:0 "骆驼山丘战斗加成"
 camels_mountain_combat_bonus:0 "骆驼山地战斗加成"
 celt_iberian_path_8:0 "森林伏击"
 celt_iberian_path_8_desc:0 "通过学习在森林中战斗，我们可以将敌人引入巧妙设置的陷阱。"
 celt_iberian_path_a_1:0 "高原"
 celt_iberian_path_a_1_desc:0 "我们生活在伊比利亚广阔的高原上，学会了在塑造我们土地的平原和丘陵中战斗。"
 celt_iberian_path_b_1:0 "战吼"
 celt_iberian_path_b_1_desc:0 "战吼是一种混合了战斗喊叫和咒语的声音，我们的士兵在战斗前喊出来以吓唬敌人。"
 celt_iberian_path_b_2:0 "游击战"
 celt_iberian_path_b_2_desc:0 "游击战是一种卢西塔尼亚人对抗强敌时常用的打了就跑的战术。"
 celt_iberian_path_b_3:0 "奉献誓言"
 celt_iberian_path_b_3_desc:0 "奉献誓言是领袖与其将军或仆从之间的契约，后者宣誓对前者绝对服从，直至死亡。"
 celt_iberian_path_c_1:0 "所有健壮的人"
 celt_iberian_path_c_1_desc:0 "在需要的时候，社区的所有成员都必须拿起武器，用像野猪保护幼崽一样的力量和勇气保卫他们的家园和财产。"
 celt_iberian_path_c_2:0 "掠夺和抢劫"
 celt_iberian_path_c_2_desc:0 "我们的土地不像其他地方那样富饶，所以如果有必要，我们准备掠夺食物和财富。"
 celt_iberian_path_c_3:0 "对邻居的袭击"
 celt_iberian_path_c_3A:0 "坎塔布里亚战术"
 celt_iberian_path_c_3A_desc:0 "坎塔布里亚战术是北伊比利亚人民使用的一种战术，骑兵围绕敌人，然后攻击他们。"
 celt_iberian_path_c_3B:0 "天生的骑手"
 celt_iberian_path_c_3B_desc:0 "伊比利亚人和他们的马很少分离。上层阶级有权利和义务成为骄傲的骑手。"
 celt_iberian_path_c_3_desc:0 "北部和中部部落的袭击活动很普遍，他们向南部和沿海定居点寻找奴隶和财富。"
 celt_iberian_path_c_4:0 "人祭"
 celt_iberian_path_c_4_desc:0 "我们的精神领袖说我们必须为我们的战神献祭敌军士兵，所以我们会这样做。"
 celt_iberian_path_d_1:0 "优良的马匹"
 celt_iberian_path_d_1_desc:0 "我们的马匹因其质量和力量而闻名。有人说是伊比利亚人发现了如何驯服马匹。"
 celt_iberian_path_d_2:0 "锡矿贸易路线"
 celt_iberian_path_d_2_desc:0 "北部有锡矿，这是一种外国商人渴望的稀有矿石。这个有利可图的贸易必须为我们的利益而增长。"
 celt_iberian_path_e_1:0 "不断的战斗"
 celt_iberian_path_e_1_desc:0 "受地方性战争的塑造，伊比利亚文化推崇独立和为自治而战。"
 celt_iberian_path_e_2:0 "努曼提亚防御"
 celt_iberian_path_e_2_desc:0 "奉献誓言和自治理念的结合，形成了绝不向敌人投降并战斗到最后的价值观。"
 celtic_britannic_path_1:0 "镰刀战车"
 celtic_britannic_path_1_desc:0 "在战车轮子上安装镰刀，为任何愚蠢攻击他们的人增添了致命的威慑力。"
 celtic_britannic_path_2:0 "成年礼"
 celtic_britannic_path_2_desc:0 "从小孩子们就被教导要准备保卫自己的家园。如果每个男人都有责任武装自己，那么军队可以从最基层中征召而起。"
 celtic_britannic_path_3:0 "自给自足"
 celtic_britannic_path_3_desc:0 "我们的人比大多数人更了解土地的方式；哪些浆果和植物可以食用，哪些天然药物可以用来治疗伤口。"
 celtic_britannic_path_4:0 "口耳相传"
 celtic_britannic_path_4_desc:0 "无论是荣耀的机会、掠夺的机会，还是仅仅为了享受屠杀的快感，临战的消息即使是长者也会被吸引到我们的队伍中。"
 celtic_britannic_path_5:0 "战车精通"
 celtic_britannic_path_5_desc:0 "大规模战车袭击所引发的恐惧足以打破即使是最具战斗经验的阵型。"
 celtic_britannic_path_6:0 "选择性育种"
 celtic_britannic_path_6_desc:0 "从青铜时代及更早以前就受到推崇，如今在不列颠各地的白垩山丘雕刻中显现出来，强壮的家养马是经过数千年选择性育种的结果，能够带着单骑进入战斗。"
 celtic_britannic_path_7:0 "拿起武器"
 celtic_britannic_path_7_desc:0 "每个人在我们的军队中都有一席之地；尤其是猎人，他们在战场和森林中同样追踪猎物。"
 celtic_britannic_path_end_bonus:0 "训练有素的骑兵"
 celtic_britannic_path_end_bonus_desc:0 "家养马虽然在紧急情况下足以自卫，但在战场上容易惊慌。因此，通过扩大我们为战争而繁育和训练的马匹数量，我们的勇士将在其真正的目标中脱颖而出：屠杀。"
 celtic_gallic_path_1:0 "远程打击"
 celtic_gallic_path_1_desc:0 "猎人和散兵从小就开始训练，在野生动物和不幸成为目标的人身上磨练他们的技能。"
 celtic_gallic_path_2:0 "联盟"
 celtic_gallic_path_2_desc:0 "许多部落与邻近的部落保持密切关系，在战斗时保证了一定程度的合作。战团可能由许多不同地方的部落成员组成，所有人都为荣耀而战。"
 celtic_gallic_path_3:0 "平原与我们同在"
 celtic_gallic_path_3_desc:0 "从海岸到阿尔卑斯山，高卢的起伏平原是使用骑兵的理想地形。"
 celtic_gallic_path_4:0 "保卫家园"
 celtic_gallic_path_4_desc:0 "从铁匠到商人，当我们的山堡和农村定居点受到威胁时，所有人都会拿起武器团结一致。"
 celtic_gallic_path_5:0 "移动的民族"
 celtic_gallic_path_5_desc:0 "我们的祖先自由迁徙，不关心边界或领土主张。这些游牧传统依然存在，因为我们的人民时刻准备着寻找比自己的牧场更好的地方。"
 celtic_gallic_path_6:0 "强壮的手臂"
 celtic_gallic_path_6_desc:0 "虽然我们的大多数战士都放弃了铁甲的保护，但我们强壮的掷标枪手则身披盔甲，能够投掷穿透板甲、肉体和骨头的铁头标枪。"
 celtic_gallic_path_7:0 "攻城略地！"
 celtic_gallic_path_7_desc:0 "我们的人民已经习惯住在有围墙的领地中，这些领地虽然防御严密，但如果知道弱点，仍然有可能被攻破。"
 celtic_gallic_path_end_bonus:0 "新月吹响号角！"
 celtic_gallic_path_end_bonus_desc:0 "卡尔尼克斯号角，以其刺耳且独特的音色，激励我们的军队，同时让对手感到恐惧。"
 celtic_germanic_path_1:0 "打了就撤"
 celtic_germanic_path_1_desc:0 "我们战士的相对健壮，再加上我们民族对繁重装备的蔑视，使我们能够轻松超越传统军队。通过骚扰对手的侧翼，他们可能会在我们之前失去战斗的热情。"
 celtic_germanic_path_2:0 "天然资源"
 celtic_germanic_path_2_desc:0 "大量的可耕地和广阔的林地为我们提供了无与伦比的资源，足以制造战争武器。"
 celtic_germanic_path_3:0 "伏击"
 celtic_germanic_path_3_desc:0 "'昆提利乌斯·瓦雷，还我军团！' - 条顿堡森林战役对日耳曼部落来说是一场决定性的胜利，几乎摧毁了三个完整的罗马军团。尽管有多种因素促成了这一结果，但日耳曼人对密林地形的熟悉是一个主要因素。"
 celtic_germanic_path_4:0 "狩猎的荣耀"
 celtic_germanic_path_4_desc:0 "部落战争是一件残酷的事情。掠夺奴隶、妇女和贵重物品是我们不应放弃的传统。"
 celtic_germanic_path_5:0 "盾墙"
 celtic_germanic_path_5_desc:0 "日耳曼军队经常利用一支重盾战士组成的核心来令对手惊讶，这既能对攻击者形成威慑，也能在战场上形成一个特别团结和机动的单位。"
 celtic_germanic_path_6:0 "年轻人必须服役"
 celtic_germanic_path_6_desc:0 "学习战争的艺术是每个年轻人的必修课。如果一个孩子能够挥舞剑并保养他们的装备，那么他们就已经准备好上战场了。"
 celtic_germanic_path_7:0 "石雨"
 celtic_germanic_path_7_desc:0 "那些无法或不愿持斧的人，学习投石或弓箭的艺术。看似简单的工具，但即使是强大的巨人也可以被一块石头击倒。"
 celtic_germanic_path_end_bonus:0 "适应性"
 celtic_germanic_path_end_bonus_desc:0 "我们的勇士可能是世界上最凶猛的，但真正的谦逊在于从失败中学习。通过在战场上采用那些自认为更'文明'的敌人的战术，我们可能会超越任何遇到的战斗力量。"
 celtic_latin_enable:0 "布壬努斯的遗产"
 celtic_north_african_enable:0 "南方的牧场"
 celtic_philosophy:0 "中欧部落传统"
 celtic_philosophy_2:0 "凯尔特传统"
 celtic_philosophy_start_bonus:0 "战车文化"
 celtic_philosophy_start_bonus_desc:0 "战车在战争中的使用可以追溯到数千年前，并与贵族和阶级有着密切的联系；战车葬礼象征着通过战斗赢得的荣誉。战车本身常作为移动平台，通常有两到三人，从中投掷标枪或其他投掷武器以打破敌人的阵型。"
 celtic_philosophydesc:0 "野蛮传统涵盖了伊比利亚、高卢、不列颠和日耳曼等地人民的战斗风格。他们主要依靠装备长矛或剑的大型轻装步兵方阵，辅以灵活的战车编队或轻骑兵，尤其在森林中广泛使用伏击战术。\n\n可以解锁 '#Y 征召民兵#!' 能力\n可以解锁 '#Y 打了就跑#!' 战术\n\n#G 传统重点#!\n强大的 #Y 轻步兵#!\n优秀的 #Y 弓箭手#!、 #Y 战车#!"
 germanic_path_1:0 "日耳曼弓术"
 germanic_path_10:0 "战略要塞位置"
 germanic_path_10_desc:0 "虽然通常不定居，日耳曼部落经常在关键的自然位置建造堡垒，以阻止任何可能的攻击。"
 germanic_path_11:0 "神话人物"
 germanic_path_11_desc:0 "从过去的时代，我们英雄人物的神话仍然激励着部落。"
 germanic_path_12:0 "任人唯贤的领导"
 germanic_path_12_desc:0 "通常，领导者不是由出生决定的，而是由行为和美德决定的。"
 germanic_path_13:0 "森林侦察兵"
 germanic_path_13_desc:0 "日耳曼部落经常使用骑兵进行侦察。这增加了机动性，减少了伏击的风险。"
 germanic_path_14:0 "无情的突袭"
 germanic_path_14_desc:0 "日耳曼部落因他们的突袭而臭名昭著。许多敌人都遭受过他们的袭击，但从好的方面看，我们现在有了更多的奴隶！"
 germanic_path_1_desc:0 "许多日耳曼人使用弓箭来获取食物和保护自己。许多人低估了这种训练有素的战士能用它造成的伤害。"
 germanic_path_2:0 "快速突袭"
 germanic_path_2_desc:0 "日耳曼部落非常机动，经常骚扰侵入他们家园的敌人。"
 germanic_path_3:0 "森林狩猎"
 germanic_path_3_desc:0 "在和平时期在森林中击中一只野兔是战争训练的绝佳方式。"
 germanic_path_4:0 "北方森林"
 germanic_path_4_desc:0 "森林如此广阔，可以砍伐无数的树木而不留下痕迹。幸运的是，我们可以用这些砍伐的树木制作弓箭。"
 germanic_path_5:0 "迁徙如常"
 germanic_path_5_desc:0 "日耳曼部落经常迁徙。在最长期的时间里，没有一个地区是由同一民族持续占据的。"
 germanic_path_6:0 "阿尔卑斯牧民"
 germanic_path_6_desc:0 "最南端的日耳曼部落居住在阿尔卑斯山，他们在那里放牧。他们在山坡上狩猎食物，建立定居点，依靠弓箭技能驱赶入侵者。"
 germanic_path_7:0 "日耳曼尼亚森林"
 germanic_path_7_desc:0 "在日耳曼尼亚深处，生活着无数好战的部落，他们称这些森林为家。许多入侵者都认识到，知道路径是至关重要的。"
 germanic_path_8:0 "稳定瞄准"
 germanic_path_8_desc:0 "久经沙场的日耳曼弓箭手学会了在复杂地形中最佳瞄准的位置。这次，落石的干扰不会让他失误！"
 germanic_path_9:0 "传奇领袖"
 germanic_path_9_desc:0 "过去的传奇领袖激励着部落，他们的方法被后代使用。"
 germanic_philosophy:0 "日耳曼军事传统"
 germanic_philosophy_2:0 "波罗的海军事传统"
 germanic_philosophy_2_desc:0 "描述"
 germanic_philosophy_desc:0 "描述"
 germanic_sea_path_1:0 "罗马灵感"
 germanic_sea_path_10:0 "突袭队"
 germanic_sea_path_10_desc:0 "突袭越来越深入南方。许多人带回了从未见过的物品，冒着生命危险追求荣耀的吸引力只会越来越大……"
 germanic_sea_path_11:0 "侧翼机动"
 germanic_sea_path_11_desc:0 "日耳曼骑兵经常侧翼敌人以给予致命一击。"
 germanic_sea_path_12:0 "游击战队"
 germanic_sea_path_12_desc:0 "在外突袭时，战队通常学习如何在多样化的地形上作战。"
 germanic_sea_path_13:0 "保护车队"
 germanic_sea_path_13_desc:0 "行军时，不要忘记保护你的车队。"
 germanic_sea_path_14:0 "战士阶层"
 germanic_sea_path_14_desc:0 "在某个时候，建立了一个专门的战士阶层。现在他们战斗，而其他人提供支持。"
 germanic_sea_path_1_desc:0 "受到罗马船只的启发，并加入了自己的创新，日耳曼船只具有毁灭性。"
 germanic_sea_path_2:0 "快速海外突袭"
 germanic_sea_path_2_desc:0 "要进行海外突袭，你需要一艘船。要能够进行更多的突袭，你需要更快。"
 germanic_sea_path_3:0 "重叠板"
 germanic_sea_path_3_desc:0 "一种地中海影响的建造技术，使船只更加耐用，减少损坏和沉没的风险。"
 germanic_sea_path_4:0 "日耳曼探险家"
 germanic_sea_path_4_desc:0 "在历史的早期，丹麦人、撒克逊人、朱特人和其他部落就已经出海寻找新土地。"
 germanic_sea_path_5:0 "日耳曼效率"
 germanic_sea_path_5_desc:0 "要进行突袭，你需要人员和船只。给我更多的船只！"
 germanic_sea_path_6:0 "如树般坚韧"
 germanic_sea_path_6_desc:0 "在最艰难的时期保持坚定不移，使人们成为最优秀的战士。"
 germanic_sea_path_7:0 "格尔"
 germanic_sea_path_7_desc:0 "格尔或弗雷玛是一种日耳曼短矛或近战矛。这种武器可能给该地区命名。"
 germanic_sea_path_8:0 "森林作战"
 germanic_sea_path_8_desc:0 "日耳曼战士在森林中训练，并达到了许多人认为不可能的合作水平。"
 germanic_sea_path_9:0 "以弗雷尔之名"
 germanic_sea_path_9_desc:0 "许多部落战争只能通过高出生率来维持和补偿。在和平时期，战士们需要找到享受生活的方法……当然，都是以弗雷尔的名义。"
 greek_antigonid_path_1:0 "伟大征战的老兵"
 greek_antigonid_path_1_desc:0 "希腊人的光辉军事历史在亚历山大大帝征服希腊化世界时达到了顶峰。从他的生平中无法学到的东西，肯定可以从他去世后的影响中学到。"
 greek_antigonid_path_2:0 "骄傲的造船师"
 greek_antigonid_path_2_desc:0 "控制爱琴海和周边海域需要在军事和民用造船方面的高度重视。经验丰富的造船师的可用性大大降低了造价。"
 greek_antigonid_path_2_octere:0 "为战争而锻造"
 greek_antigonid_path_2_octere_desc:0 "亚历山大去世后，继业者之间爆发了海军军备竞赛，引发了对腓尼基木材和造船工匠的争夺，以及建造越来越大的船只以争取优势。"
 greek_antigonid_path_3:0 "贵族骑兵"
 greek_antigonid_path_3_desc:0 "那些出身富裕、幸运或贵族的人从小就学习骑术，骑马不仅是一项运动，也是战争中的一项技能。"
 greek_antigonid_path_4:0 "胜利者的战利品"
 greek_antigonid_path_4_desc:0 "希腊化早期的城市经常因为最微不足道的侮辱而争斗。由于这种频繁的战斗，城邦之间的战争发展出了一种风格，这种风格导致了最低的伤亡人数，但最多的俘虏。胜利者会将他们作为奴隶，或者以高额费用将他们赎回给对手。"
 greek_antigonid_path_5:0 "标枪兵"
 greek_antigonid_path_5_desc:0 "标枪兵表面上是作为散兵使用的，色雷斯标枪兵装备了小盾和一系列标枪。后来，标枪兵被许多交战国雇佣为雇佣军。"
 greek_antigonid_path_6:0 "专业部队"
 greek_antigonid_path_6_desc:0 "射箭和投石在希腊化时期较少使用，尽管为投石兵制作的专用铅弹对敌军来说是一个强大的威慑。我们许多民兵熟悉远程武器并偶尔使用它们，但长矛是我们军队的主力——我们不会改变这一点。"
 greek_antigonid_path_7:0 "山地战精通"
 greek_antigonid_path_7_desc:0 "希腊中部的高耸山脉教会了我们在恶劣地形中作战的变化无常。"
 greek_antigonid_path_end_bonus:0 "联合兵种"
 greek_antigonid_path_end_bonus_desc:0 "如此多样的战斗风格结合在一起，使得希腊化军队独一无二。当每个士兵都知道自己的位置时，严格的纪律将赢得胜利。"
 greek_levantine_enable:0 "萨拉米斯的遗产"
 greek_naval_heritage:0 "希腊海军传统"
 greek_naval_heritage_desc:0 "几个世纪以来，希腊水手掌握了地中海的变化无常，既是商人、士兵，也是殖民者。"
 greek_persian_enable:0 "高加米拉的遗产"
 greek_philosophy:0 "希腊城邦传统"
 greek_philosophy_2:0 "希腊王国传统"
 greek_philosophy_start_bonus:0 "现代化方阵"
 greek_philosophy_start_bonus_desc:0 "虽然在亚历山大大帝对抗大流士三世的军队中部分发挥了作用，但方阵最初是由于希腊城邦间战争的需要而演变成的一种高度防御性的装甲编队。"
 greek_philosophydesc:0 "希腊传统以重装长矛兵防御的方阵为核心，这种战术自古以来就被使用，并被马其顿人用长矛（或长枪）进一步发展。希腊战术以方阵钳制敌方步兵为中心，而骑兵和轻步兵则在其侧翼进行机动。\n\n可以解锁 '#Y 八列桨帆船#!' 和 '#Y 巨型多层桨帆船#!'\n可以解锁 '#Y 骑兵散兵#!' 战术\n可以解锁 '#Y 军事殖民地#!' 能力\n可以解锁 '#Y 奴隶袭击#!' 能力\n\n#G 传统重点#!\n强大的 #Y 重步兵#!\n优秀的 #Y 骑兵#!、 #Y 三列桨帆船#!"
 greek_seleucid_path_1:0 "皇家卫队骑兵"
 greek_seleucid_path_1_desc:0 "皇家卫队骑兵形成了一支尊重和钦佩国王的骑兵，他们愿意为君主献身。"
 greek_seleucid_path_2:0 "雇佣兵"
 greek_seleucid_path_2_desc:0 "尽管或许正是由于继业者的内讧，他们拥有超乎想象的财富。因此，在这些希腊专制君主周围，雇佣军团经常存在。"
 greek_seleucid_path_3:0 "腓尼基水手"
 greek_seleucid_path_3_desc:0 "腓尼基人在亚历山大大帝征服之前几个世纪就建立了海上帝国。鼓励他们的水手为我们效力肯定会在海战中给我们带来优势。"
 greek_seleucid_path_4:0 "伙伴骑兵"
 greek_seleucid_path_4_desc:0 "伙伴骑兵原本是一支马其顿贵族部队，以冲锋战术著称。这些骑兵虽然被移植到各个国家，但依然保留了其作为可怕冲击部队的声誉。"
 greek_seleucid_path_5:0 "铁甲骑兵"
 greek_seleucid_path_5_desc:0 "骑在巨大的战马上，身披近乎无法穿透的盔甲，铁甲骑兵是一种昂贵的骑兵形式，擅长用强大的长矛穿透同样沉重的盔甲。"
 greek_seleucid_path_6:0 "长盾步兵"
 greek_seleucid_path_6_desc:0 "这些轻装步兵以一种独特的盾牌（长盾）为特征，是希腊部队中最具机动性的步兵之一。"
 greek_seleucid_path_7:0 "骑兵将军"
 greek_seleucid_path_7_desc:0 "骑兵将军通常是一个富有魅力和技巧的将军，指挥着一大批不同类型的骑兵，通常对编队细节进行了非常细致的规定。"
 greek_seleucid_path_end_bonus:0 "深厚财力"
 greek_seleucid_path_end_bonus_desc:0 "高效且迅速的支付总是能吸引雇佣兵，甚至可能愿意以比邻国更低的价格工作。"
 greek_states_path_1:0 "长矛"
 greek_states_path_1_desc:0 "方阵步兵，装备了圆盾和长矛，构成了后期希腊方阵的核心。长矛的超长射程使得接近这个编队成为一项特别致命的任务。"
 greek_states_path_2:0 "塔伦汀骑兵"
 greek_states_path_2_desc:0 "塔林汀骑兵是一支精英雇佣军，来自塔林敦，使用非常不正统的散兵战术，被整个希腊化世界所采纳。"
 greek_states_path_3:0 "攻城技术"
 greek_states_path_3_desc:0 "没有人能像希腊人那样声称自己是攻城技术的高手。在罗德岛围城战和多年后的底比斯围城战中，巨大的攻城塔（赫利波里斯）被用来试图绕过这些城市的坚固城墙。据说罗德岛巨像本身就是用德米特里乌斯遗弃的攻城器材建造的。"
 greek_states_path_4:0 "军事殖民地"
 greek_states_path_4_desc:0 "为了确保忠诚的军队时刻待命并获得应得的奖励，将土地授予希腊士兵（克莱鲁霍伊）作为他们服兵役的报酬，是一种悠久的传统。"
 greek_states_path_5:0 "我的比你的大"
 greek_states_path_5_desc:0 "数百年来，希腊化王国试图用更大更强的船只来超越彼此。从巨大的四列桨帆船，到传闻需要至少4000名船员的巨型双船体怪兽（四十桨船），希腊造船技艺在整个希腊化世界中无与伦比。"
 greek_states_path_6:0 "城邦防御工事"
 greek_states_path_6_desc:0 "希腊城市间的世纪内战自然导致了无数围墙、塔楼和防御工事的建立，这些结构旨在阻止入侵的军队。开发这些综合结构所需的石工技艺是大师工匠的见证。"
 greek_states_path_7:0 "数世纪的战争"
 greek_states_path_7_desc:0 "希腊王国和城邦之间的持续争斗和战斗教会了我们的子孙随时准备好为保卫家园而献身。"
 greek_states_path_end_bonus:0 "银盾"
 greek_states_path_end_bonus_desc:0 "一个传承自亚历山大大帝远征的退伍军人单位，银盾兵继续他们作为一支危险的、精锐的武装战士团队的传统。"
 haemic_philosophy:0 "伊利里亚传统"
 haemic_philosophy_2:0 "达契亚-色雷斯传统"
 haemic_philosophy_2_desc:0 "色雷斯王海默斯自负而傲慢，将自己和妻子罗多彼与宙斯和赫拉相比。作为惩罚，众神将他和他的妻子变成了山脉。伊利里亚人和达契亚人主要依靠大规模的轻装步兵编队，主要装备剑，并在有条件时由轻骑兵支援。他们广泛利用山区地形进行防御，而伊利里亚人在亚得里亚海从事海盗活动。\n\n可以解锁'#Y 突袭城市#!'传统焦点#!\n强大的#Y 轻步兵#!\n优秀的#Y 弓箭手#!、#Y 轻骑兵#!"
 haemic_philosophy_desc:0 "色雷斯王海默斯自负而傲慢，将自己和妻子罗多彼与宙斯和赫拉相比。作为惩罚，众神将他和他的妻子变成了山脉。伊利里亚人和达契亚人主要依靠大规模的轻装步兵编队，主要装备剑，并在有条件时由轻骑兵支援。他们广泛利用山区地形进行防御，而伊利里亚人在亚得里亚海从事海盗活动。\n\n可以解锁'#Y 突袭城市#!'传统焦点#!\n强大的#Y 轻步兵#!\n优秀的#Y 弓箭手#!、#Y 轻骑兵#!"
 heavy_cavalry_farmland_combat_bonus:0 "重骑兵农田战斗加成"
 heavy_cavalry_hills_combat_bonus:0 "重骑兵山丘战斗加成"
 heavy_cavalry_mountain_combat_bonus:0 "重骑兵山地战斗加成"
 heavy_cavalry_steppes_combat_bonus:0 "重骑兵草原战斗加成"
 heavy_infantry_farmland_combat_bonus:0 "重步兵农田战斗加成"
 horse_archers_hills_combat_bonus:0 "骑射手山丘战斗加成"
 horse_archers_mountain_combat_bonus:0 "骑射手山地战斗加成"
 horse_archers_steppes_combat_bonus:0 "骑射手草原战斗加成"
 iberian_central_2_path_1:0 "所有神灵都受欢迎"
 iberian_central_2_path_1_desc:0 "我们有一个开放的万神殿，任何神灵都有位置并可以被崇拜。"
 iberian_central_2_path_2:0 "黎凡特建筑"
 iberian_central_2_path_2_desc:0 "我们从黎凡特殖民地学到了一些东西，比如他们的建筑技术。"
 iberian_central_2_path_3:0 "沿海港口"
 iberian_central_2_path_3_desc:0 "我们太依赖黎凡特、迦太基和希腊的沿海殖民地进行贸易。如果我们想要提高利润，我们需要在沿海建立自己的港口。"
 iberian_central_path_1:0 "富饶的农田"
 iberian_central_path_1_desc:0 "我们拥有肥沃而广阔的土地，可以为我们的人民提供充足的供应。"
 iberian_central_path_2:0 "贵族将军"
 iberian_central_path_2A:0 "轻甲"
 iberian_central_path_2A_desc:0 "伊比利亚战士的盔甲是用轻便灵活的材料制成的，允许更大的移动能力。"
 iberian_central_path_2B:0 "联盟"
 iberian_central_path_2B_desc:0 "伊比利亚人重视他们的自治权。如果出现强敌，他们倾向于为了驱逐共同的威胁而组建联盟和联邦。"
 iberian_central_path_2_desc:0 "根据传统，只有贵族出身的男人才能领导军队。"
 iberian_central_path_3:0 "伊比利亚雇佣兵"
 iberian_central_path_3_desc:0 "我们的人民几个世纪以来一直被外国势力雇佣为雇佣兵。这种经验创造了强大而有纪律的士兵原型。"
 iberian_central_path_4:0 "塔莱奥提投石兵"
 iberian_central_path_4_desc:0 "塔莱奥提人以其标志性的投石兵而闻名。在远程战斗中勇敢而致命，他们可以在移动中击倒士兵甚至骑兵。"
 iberian_left_2_path_1:0 "精细的金属加工"
 iberian_left_2_path_1_desc:0 "获得优质的初级资源和专家铁匠，可以更好地保护我们的士兵在战斗中。"
 iberian_left_2_path_2:0 "知识输入"
 iberian_left_2_path_2_desc:0 "与远方商人的接触创造了一个动态的贸易流，让我们享受和适应他们的知识。"
 iberian_left_path_1:0 "法拉里卡投枪"
 iberian_left_path_1_desc:0 "Phalarica是一种重型标枪，具有长而细的铁头，有时会绑上可燃材料以制造燃烧装置。它们被广泛用于步兵和攻城车的弹药。"
 iberian_north_african_enable:0 "快速修补"
 iberian_north_african_enable_desc:0 "伊比利亚充满了制造和维护大型商船和军舰所需的原材料。"
 iberian_philosophy:0 "伊比利亚传统"
 iberian_philosophy_2:0 "凯尔特-伊比利亚传统"
 iberian_right_2_path_1:0 "伊比利亚黄铁矿带"
 iberian_right_2_path_1_desc:0 "在Luxia河周围，我们拥有世界上最大的矿石储量之一，包括金、银、铜、锡、铅和铁。"
 iberian_right_path_1:0 "西班牙弯刀"
 iberian_right_path_1_desc:0 "也被称为falcata，这种弯刀在伊比利亚人中广泛使用。由于其质量出众，像迦太基和罗马这样的强权希望将其纳入他们的武器库。"
 illyrian_path_1:0 "利部耳尼亚船"
 illyrian_path_1_desc:0 "最终成为罗马海军基础的船只最初由同名的伊利里亚部落发明。配备只有一排桨、一根桅杆和一张帆，它无法直接与希腊人建造的较大船只匹敌，但伊利里亚人的速度和机动性使他们在亚得里亚海占据主导地位。"
 illyrian_path_2:0 "船只绑定"
 illyrian_path_2_desc:0 "一种常见的伊利里亚海军战术是将他们的桨帆船四艘一组绑在一起，并激怒敌舰撞击他们。这使他们有机会以巨大的力量登上敌舰。"
 illyrian_path_3:0 "龙首船"
 illyrian_path_3_desc:0 "龙首船是在船首安装了龙头的船只。通过建造更大和更强的船只，我们将更好地保护我们的海岸免受那些想要伤害我们的人的侵害。"
 illyrian_path_4:0 "伊利里亚雇佣兵"
 illyrian_path_4_desc:0 "伊利里亚的战士在雇佣兵中需求很高。由于该地区有大量的卖剑者，我们应该能够以公平的价格雇佣他们。"
 illyrian_path_5:0 "年轻人必须服役"
 illyrian_path_5_desc:0 "学习战争艺术是每个年轻人教育的重要组成部分。如果一个孩子能挥舞剑并维护他们的装备，那么他们就准备好参战了。"
 illyrian_path_6:0 "投资我们的未来"
 illyrian_path_6_desc:0 "抢劫和掠夺可能会带来财富，但它们很快就会被花光。我们必须将我们的新财富投入到我们的社区中，以加强它们并确保它们的增长。"
 illyrian_path_7:0 "山地家园"
 illyrian_path_7_desc:0 "我们与更强大的国家接壤已有几个世纪，但山脉始终保护我们免受入侵，并使我们的人民得以繁荣。"
 illyrian_path_8:0 "达达尼亚重装步兵"
 illyrian_path_8_desc:0 "在斯巴达雇佣兵的训练下，达达尼亚人创建了曾经恐吓摩洛西亚人和马其顿人的重装步兵军团。"
 illyrian_path_9:0 "准备出击"
 illyrian_path_9_desc:0 "到公元前2世纪，方阵战术逐渐失宠，伊利里亚人转而采用小规模机动性更强的披甲部队。他们更注重灵活性和出其不意的战术，从而成功击败了希腊对手严密的密集阵型。"
 illyrian_piracy_path_1:0 "伊利里亚海盗"
 illyrian_piracy_path_1_desc:0 "随着意大利被对立的国家分裂，希腊大部分集中在东方的冲突中，亚得里亚海对于从伊利里亚海岸众多入口出发的海盗来说是容易的猎物。"
 illyrian_piracy_path_2:0 "闪电突袭"
 illyrian_piracy_path_2_desc:0 "在面对军事上更强大的敌人时，速度对于保存我们的部队并利用地形至关重要。"
 illyrian_piracy_path_5:0 "勇敢的水手"
 illyrian_piracy_path_5_desc:0 "对任何挑战亚得里亚海自由统治的严厉报复将使其他人三思而后行。"
 illyrian_piracy_path_6:0 "本地造船"
 illyrian_piracy_path_6_desc:0 "伊利里亚海岸提供了大量的入口和港口用于造船，使当地部落能够自行建造适度的船只。"

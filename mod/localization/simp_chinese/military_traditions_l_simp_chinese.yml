 latin_celtic_enable:0 "高卢人之死"
 latin_greek_enable:0 "战神广场"
 latin_philosophy:0 "罗马传统"
 latin_philosophy_2:0 "意大利部落传统"
 latin_philosophy_start_bonus:0 "有围墙的城市"
 latin_philosophy_start_bonus_desc:0 "数代以来，意大利半岛的景观上遍布重重围墙的城市。在罗马，被高卢人布壬努斯劫掠后建造的塞尔维安城墙高耸入云，为居民提供了即将来临的纷争中的一丝安宁。"
 latin_philosophydesc:0 "意大利传统代表了在伊特鲁里亚人、罗马人和其他拉丁国家中发现的重装甲和纪律严明的步兵的重点。他们倾向于用剑代替长矛，并依靠迅速接近地面并用严格的编队驱散装备较差的步兵，如三线阵，配有轻骑兵和散兵支援。\n\n可以解锁“#Y 三线阵#!”战术\n可以解锁“#Y 建造边境堡垒#!”能力\n可以解锁“#Y 建造军事道路#!”能力\n\n#G 传统重点#!\n强大的#Y 重步兵#!\n优秀的#Y 轻骑兵#!、#Y 轻步兵#!"
 latin_roman_path_1:0 "元老战士"
 latin_roman_path_1_desc:0 "都是经验丰富的战士，富裕的元老战士配有重甲，并在紧密联系的操纵中战斗，成为出色的线性部队。"
 latin_roman_path_2:0 "三线阵"
 latin_roman_path_2_desc:0 "三重战线是一种主要利用元老战士、最后防线和持矛步兵的操纵阵型，轻步兵在自由形式的支援下。这种高度灵活的阵型依赖于每个士兵的绝对纪律，他们必须在混乱的战斗中知道自己的位置。在极端情况下，据说三重战线长达一英里。"
 latin_roman_path_3:0 "最后防线"
 latin_roman_path_3_desc:0 "据说当最后防线带头冲锋时，罗马的对手就知道结局临近了。通常用于击溃已经筋疲力尽的敌人，最后防线配备了被称为hasta的巨大长矛，能够穿透轻甲。"
 latin_roman_path_4:0 "罗马道路"
 latin_roman_path_4_desc:0 "经常被认为是赢得整个战争的原因之一，利用军队在和平时期和冲突期间建造道路的做法对世界产生了深远影响。"
 latin_roman_path_5:0 "职业士兵"
 latin_roman_path_5_desc:0 "从征募的战斗部队向职业常备军队的演变，在质量和期望方面带来了丰厚的回报。拿薪水的士兵更不容易在命令前退缩或逃离战斗。"
 latin_roman_path_6:0 "轻步兵"
 latin_roman_path_6_desc:0 "主要由年轻的、未经证明的士兵组成，轻步兵是轻部队，超出标准军队组织，充当机动散兵。据说轻步兵通过他们在战斗中的冒险行为来寻求荣耀和认可。"
 latin_roman_path_7:0 "服役荣誉"
 latin_roman_path_7_desc:0 "随着罗马地位的提高，军事服务成为年轻罗马男子的荣誉之事。事实上，即使在卡尼会战这样耻辱的失败之后，据说多达8万名罗马士兵被杀，元老院的努力仍然能够筹集足够的士兵来取代阵亡者的位置。"
 latin_roman_path_end_bonus:0 "雄鹰行军"
 latin_roman_path_end_bonus_desc:0 "无论胜利还是失败，只要雄鹰高悬，罗马的精神就会注入她所有的儿子们。"
 latin_support_path_1:0 "国家海军"
 latin_support_path_1_desc:0 "在第一次布匿战争期间，罗马元老院命令建造一支与敌人迦太基帝国相匹敌的海军。主要基于迦太基设计并受希腊影响，罗马共和国时期的海军热情持续不断。"
 latin_support_path_2:0 "工匠"
 latin_support_path_2_desc:0 "早期罗马军队的军工负责设计军事结构以及组织其建设的后勤任务。"
 latin_support_path_3:0 "攀登城墙"
 latin_support_path_3_desc:0 "在共和国早期，攻城车很少被使用，攻城通常依靠秘密攀登城墙以及消耗战。在公元前396年围攻维爱期间，据说罗马工程师在伊特鲁里亚城墙下挖掘了一条大隧道，从而打破了围城。"
 latin_support_path_4:0 "营地"
 latin_support_path_4_desc:0 "军团，后来是军团，擅长建造临时的，许多情况下是永久性的堡垒，这些堡垒作为补给站、集结点，或作为控制未被平息地区的军事基地。"
 latin_support_path_5:0 "国家物流"
 latin_support_path_5_desc:0 "随着罗马军队的扩展，士兵自行提供武器的做法变得不可持续。因此，通过建立供应链，从自然资源到铁匠，再到士兵的手中，罗马轻松推动了她的战争机器。"
 latin_support_path_6:0 "方盾"
 latin_support_path_6_desc:0 "采用标志性的盾牌，方盾，以及发展操纵系统，给罗马在其本地敌人中带来了决定性的优势。随后，方盾几乎成为罗马的国家象征；罗马盾墙的存在常常足以在战斗开始前赢得胜利。"
 latin_support_path_7:0 "同盟"
 latin_support_path_7_desc:0 "罗马中期共和国时期的主要骑兵来源从骑士转向雇佣兵和盟国。这使得各种风格和能力得以融入日益壮大的罗马军队。"
 latin_support_path_end_bonus:0 "罗马，升起"
 latin_support_path_end_bonus_desc:0 "在一次伟大的胜利之后，罗马的习俗是向负责的指挥官表示敬意。奢华的庆祝活动通常包括体育赛事、盛宴和游行，占据城市数天时间——在朋友和敌人心中都强化了罗马的力量。"
 latin_tribal_path_1:0 "手工青铜工艺"
 latin_tribal_path_1_desc:0 "即使在铁器工艺出现之后，各种各样的青铜盾牌、矛和头盔从新兴的意大利文明的锻造厂中倾泻而出。即使是部落文化也拥有混合青铜和铁装备的潜力，使其成为一种可怕的景象。"
 latin_tribal_path_2:0 "马队"
 latin_tribal_path_2_desc:0 "在罗马，骑士组成了一个完整的贵族阶层；富裕的贵族，其财富显示了他们的声望。因此，骑士的优越财富和训练使他们有能力在共和国军队的专属骑兵部队中服役。在意大利世界的其他地方，战马被视为精英的领域，马匹本身在其主人的死亡事件中通常被安葬在一起。"
 latin_tribal_path_3:0 "虔诚"
 latin_tribal_path_3_desc:0 "依靠自己士兵的虔诚，以及对手的虔诚，伊特鲁里亚军队被认为使用他们的祭司在敌人面前诅咒他们，使他们溃逃。无论如何，古代意大利人民不留下任何机会；在每场战斗之前都向神灵表达了适当的敬意。"
 latin_tribal_path_4:0 "财富的获取"
 latin_tribal_path_4_desc:0 "意大利部落文化和新兴的罗马共和国都从事劫掠、掠夺和海盗活动。从传说中的抢劫萨宾妇女，到围攻维伊，劫掠事件贯穿了意大利的历史。"
 latin_tribal_path_5:0 "奥鲁斯"
 latin_tribal_path_5_desc:0 "在伊特鲁里亚艺术中描绘了许多乐器，但没有一种比奥鲁斯更神秘。最初是希腊发明的，标志性的双簧管和管子可能会在各种场合中听到，甚至可能在战前提升士兵的士气。"
 latin_tribal_path_6:0 "我们的海洋"
 latin_tribal_path_6_desc:0 "海岸在意大利的经济生活中扮演了重要角色。船只和对地方的有效控制对于每个新兴国家的繁荣至关重要。熟练的造船师、廉价劳动力和丰富的建筑材料可以在所有地中海港口找到。"
 latin_tribal_path_7:0 "激动人心的演讲"
 latin_tribal_path_7_desc:0 "希腊模式的民主的流行在一个渴望权利的土地上推动了民粹情绪的增强。一位熟练的演说家可以说服整个城市支持他的事业，这在某些时候是有用的。"
 latin_tribal_path_end_bonus:0 "山地居民"
 latin_tribal_path_end_bonus_desc:0 "从亚平宁山脉到阿尔卑斯山，山地和山脉一直是意大利生活的常态。可以说我们的军队比大多数人更适应在恶劣条件下战斗。"
 levantine_arabian_path_1:0 "沙漠之沙"
 levantine_arabian_path_1_desc:0 "我们的人民比任何人都更了解沙漠的方式。如何无迹可寻，如何留下让敌人侦察员绕圈的踪迹，以及如何在不杀一人的情况下赢得消耗战。"
 levantine_arabian_path_2:0 "商人海岸"
 levantine_arabian_path_2_desc:0 "阿拉伯和北非海岸的船只是其生命线。建造它们的劳动力不缺，只要我们能获得资源。"
 levantine_arabian_path_3:0 "驮兽"
 levantine_arabian_path_3_desc:0 "骆驼非常适应其所在的恶劣环境。尽管在和平时期用于家庭用途，但大量的骆驼散兵冲锋是一种令人震惊的景象。"
 levantine_arabian_path_4:0 "沙漠之舟"
 levantine_arabian_path_4_desc:0 "我们对沙漠的了解，以及它不断变化的地理特点，与我们长久的快速骑战传统完美结合。"
 levantine_arabian_path_5:0 "坚固设计"
 levantine_arabian_path_5_desc:0 "许多地区缺乏造船材料，这导致我们的工匠确保每一块木板都被充分利用。我们的船只建造只有一个目的：耐用。"
 levantine_arabian_path_6:0 "建筑者的遗产"
 levantine_arabian_path_6_desc:0 "从所罗门圣殿到提洛斯的宏伟建筑，我们的祖先教会了我们如何精心建造，如何自豪地建造。"
 levantine_arabian_path_7:0 "绿洲贸易"
 levantine_arabian_path_7_desc:0 "知道动物的水源地、它们的牧场及其来去规律，使我们可以减少放牧所需的时间，而不像西边那些自称‘文明’的人那样。"
 levantine_arabian_path_end_bonus:0 "训练有素的骆驼骑兵"
 levantine_arabian_path_end_bonus_desc:0 "北方的巨兽在苏醒；西边的古代法老被篡夺——我们可能需要一支训练有素的战士部队..."
 levantine_egyptian_path_1:0 "王国之矛"
 levantine_egyptian_path_1_desc:0 "埃及祖先使用青铜矛战斗，穿着最基本的防护装备。随着铁工艺的出现，武器和盔甲得到了十倍的改进，我们的士兵得到了进一步的增强。"
 levantine_egyptian_path_2:0 "军备竞赛"
 levantine_egyptian_path_2_desc:0 "纪律严明的桨手队伍比我们敌人雇用的杂乱无章的奴隶船员表现更好。"
 levantine_egyptian_path_3:0 "搬石工"
 levantine_egyptian_path_3_desc:0 "我们的祖先委托建造的纪念性工程依然作为我们石工遗产的见证。虽然许多这些技术已经失传，但我们的石匠仍然拥有一种几乎超自然的对他们所塑造的冷石之美的感觉。"
 levantine_egyptian_path_4:0 "殖民整合"
 levantine_egyptian_path_4_desc:0 "跟随腓尼基商人的脚步，建立由忠诚的士兵组成的殖民地，为我们提供了一个可用的人力基地。"
 levantine_egyptian_path_5:0 "埃及之血"
 levantine_egyptian_path_5_desc:0 "尼罗河在过去是许多海战的舞台。现在，海战已经蔓延到地中海，我们长久以来不寻常的海战策略使我们在比传统军队更有优势。"
 levantine_egyptian_path_6:0 "厚皮"
 levantine_egyptian_path_6_desc:0 "我们的骑兵骑着强壮而坚韧的骆驼进入战斗。这些骆驼在战斗中表现出惊人的弹性，利用它们的机动性作为主要防御。"
 levantine_egyptian_path_7:0 "文明的摇篮"
 levantine_egyptian_path_7_desc:0 "尼罗河三角洲密集分布的许多繁忙的都市充满了愿意为我们服务的人。"
 levantine_egyptian_path_end_bonus:0 "一排排"
 levantine_egyptian_path_end_bonus_desc:0 "埃及的巨大部队，如同古代法老集结的军队，令那些敢于反对我们的人心生畏惧！"
 levantine_greco_path_1:0 "战争过剩"
 levantine_greco_path_1_desc:0 "在亚历山大帝国崩溃后，地中海充斥着大量失业的战士。其中许多人是受过训练的方阵战士，并且往往愿意以大幅减少的工资工作。"
 levantine_greco_path_2:0 "重装步兵"
 levantine_greco_path_2_desc:0 "能以方阵风格作战的重装步兵，往往装备优于他们的同伴投掷步兵，但仍作为重步兵和轻散兵之间的桥梁使用。"
 levantine_greco_path_3:0 "精选土著士兵"
 levantine_greco_path_3_desc:0 "本土埃及士兵在托勒密军队中几乎没有角色，直到因为人力问题而成立了“精选土著士兵”之后才有所改变。尽管这在希腊士兵中不受欢迎，但土著士兵在托勒密军队中占有重要地位，并以其凶猛而著称。"
 levantine_greco_path_4:0 "希腊战争"
 levantine_greco_path_4_desc:0 "与其他继业者国家一样，方阵构成了托勒密军队的核心。由各种类型的单位组成，其核心原则与多年前的马其顿改革相同。"
 levantine_greco_path_5:0 "良好的声誉"
 levantine_greco_path_5_desc:0 "埃及王国的巨大财富吸引了大量雇佣军。对这些部队的常规支付标准允许我们在谈判中占据优势。"
 levantine_greco_path_6:0 "冲撞速度"
 levantine_greco_path_6_desc:0 "托勒密海军一直处于发展过程中，尤其是由于获得合适的建筑材料困难。然而，托勒密的小型船只在战斗中能够自保，往往能够击败比自己大得多的船只。"
 levantine_greco_path_7:0 "无尽的财富"
 levantine_greco_path_7_desc:0 "托勒密王朝的巨大财富和对经验丰富的指挥官的迫切需求，导致了向任何愿意为他们工作的外国将军提供高昂的酬金。忠诚可能很贵，但它可以被买到。"
 levantine_greco_path_end_bonus:0 "向最好的学习"
 levantine_greco_path_end_bonus_desc:0 "在看到罗马军队的表现后，塞琉古和托勒密王朝试图在自己的军队中模仿罗马军事哲学的某些方面。尽管成功有限，但对机动性和灵活性的更大关注在许多交战中必定取得了成效。"
 levantine_greek_enable:0 "推罗的传承"
 levantine_north_africa_enable:0 "利比亚雄狮"
 levantine_philosophy:0 "黎凡特王国传统"
 levantine_philosophy_2:0 "黎凡特海洋传统"
 levantine_philosophy_start_bonus:0 "探路者"
 levantine_philosophy_start_bonus_desc:0 "了解环境可以作为武器或工具使用。只要知道在哪里找，生活在沙漠中是完全可能的。"
 levantine_philosophydesc:0 "黎凡特和阿拉伯传统集中在腓尼基城市的强大海军存在和在黎凡特、埃及和阿拉伯干旱沙漠中使用方阵战术、轻步兵和骆驼骑兵。腓尼基人在地中海是最突出的商人，赋予他们无与伦比的航海和造船经验。\n\n可以解锁“#Y 八桅船#!”和“#Y 巨型战舰#!”\n可以解锁“#Y 军事殖民地#!”能力\n可以解锁“#Y 方阵#!”战术\n\n#G 传统重点#!\n强大的#Y三桅船#!\n优秀的#Y骆驼骑兵#!、#Y轻步兵#!"
 liburnian_coastal_terrain_combat_bonus:0 "利布尔尼亚沿海地形战斗加成"
 light_cavalry_farmland_combat_bonus:0 "轻骑兵农田战斗加成"
 light_cavalry_forest_combat_bonus:0 "轻骑兵森林战斗加成"
 light_cavalry_hills_combat_bonus:0 "轻骑兵山丘战斗加成"
 light_cavalry_steppes_combat_bonus:0 "轻骑兵草原战斗加成"
 lydian_path_1:0 "帕里斯的遗产"
 lydian_path_10:0 "卡帕多西亚斧兵"
 lydian_path_10_desc:0 "卡帕多西亚有凶猛的斧兵。在战场上令人恐惧，他们是许多军队的主力。"
 lydian_path_11:0 "吕底亚弓箭手"
 lydian_path_11_desc:0 "吕底亚的山丘产生了许多野生动物，许多人对此羡慕不已。无论是和平时期还是战争时期，弓箭都不可小觑。"
 lydian_path_12:0 "黑海的主人"
 lydian_path_12_desc:0 "黑海是一个伟大的贸易中心，供应许多谷物和其他商品。如果你控制了它，你就会变得富有。"
 lydian_path_13:0 "地中海之主"
 lydian_path_13_desc:0 "地中海是已知世界的大部分。统治它就相当于统治世界。"
 lydian_path_14:0 "精英武术训练"
 lydian_path_14_desc:0 "富人可以为社会最底层的人提供最好的教育。幸运的是，你很富有。"
 lydian_path_1_desc:0 "美丽而聪明的帕里斯是特洛伊国王普里阿摩斯和王后赫库芭的儿子，他与斯巴达王后海伦私奔，这是阿佛洛狄忒答应给他的。这引发了特洛伊战争，在战争中，他用一支箭射中了冠军阿喀琉斯的脚跟，杀死了他，然后被菲洛克忒忒斯杀死。"
 lydian_path_2:0 "弗里吉亚帽"
 lydian_path_2_desc:0 "弗里吉亚帽象征着自由，起源于安纳托利亚。"
 lydian_path_3:0 "奇里乞亚海盗"
 lydian_path_3_desc:0 "奇里乞亚海盗在地中海东部臭名昭著，曾引发一些冲突。其中包括罗马对奇里乞亚的入侵。"
 lydian_path_4:0 "轻装步伐"
 lydian_path_4_desc:0 "轻装单位可以更快移动，准备他们的设备并侦察地形。这使他们成为出色的骚扰者。"
 lydian_path_5:0 "机动艺术"
 lydian_path_5_desc:0 "机动是任何军队手册中的基本内容。安纳托利亚人很久以前就理解并掌握了这门艺术。"
 lydian_path_6:0 "蜂拥战术"
 lydian_path_6_desc:0 "有时你只有人而没有设备，但数量本身就是一种质量。"
 lydian_path_7:0 "军事管理"
 lydian_path_7_desc:0 "要高效运作，必须有高效的组织。军队总是高效的。"
 lydian_path_8:0 "团队精神"
 lydian_path_8_desc:0 "共同的目标总是重要的。它减少了异议。"
 lydian_path_9:0 "克罗伊苏斯的财富"
 lydian_path_9_desc:0 "克罗伊苏斯是个富有的人，直到他决定攻击居鲁士。从他的生活中吸取教训，只效仿他的成功之处。"
 mauryan_coastal_path_1:0 "天然港口"
 mauryan_coastal_path_1_desc:0 "印度的海岸是商业和八卦的温床。众多的天然港口导致了永久贸易站的建立，这些贸易站处理本地和外国商人的交易。大量需要维护的船只形成了健康的竞争，降低了所有海上业务的价格。"
 mauryan_coastal_path_2:0 "编队系统"
 mauryan_coastal_path_2_desc:0 "在《摩诃婆罗多》中提到的编队系统非常重视弓箭手的保护。这种安全措施将会让这些部队安心专注于他们的职责。"
 mauryan_coastal_path_3:0 "海上霸主"
 mauryan_coastal_path_3_desc:0 "虽然印度北部是伟大、陆地帝国的所在地，南部地区逐渐演变成重要的海上强国。"
 mauryan_coastal_path_4:0 "掠夺！"
 mauryan_coastal_path_4_desc:0 "在古代世界中，掠夺和抢劫的行为在许多文化中都很普遍，印度也不例外。尤其是德拉威地区的王国，绑架和赎金是他们的主要手段。"
 mauryan_coastal_path_5:0 "灵活的分区"
 mauryan_coastal_path_5_desc:0 "孔雀王朝的军队组织特别考虑了灵活性。‘帕蒂’，最小的部队单位，不同于世界上任何其他军队。由战车、大象、骑兵和步兵组成，允许在进行阵型操作时具有高战术灵活性。"
 mauryan_coastal_path_6:0 "世界渴望之城"
 mauryan_coastal_path_6_desc:0 "华氏城，通常被认为是古代世界最大的城市，是印度建筑成就的巅峰。其他地方，印度石匠的能力展示在宏伟的山地防御工事上，这些防御工事被建造来抵御入侵者。"
 mauryan_coastal_path_7:0 "国家工匠"
 mauryan_coastal_path_7_desc:0 "军事装备的供应在某些情况下由高效的孔雀王朝官僚体系从头到尾控制。这种典型的高知情度管理方式减少了系统中的低效现象，使得补给更便宜。"
 mauryan_coastal_path_end_bonus:0 "‘外交’舰队"
 mauryan_coastal_path_end_bonus_desc:0 "由阿育王建立，孔雀王朝的国家海军的存在往往足以在外交上为他争取到优势。"
 mauryan_mauryas_path_1:0 "多功能步兵"
 mauryan_mauryas_path_1_desc:0 "孔雀王朝的步兵通常配备各种各样的武器。能够一瞬间充当轻步兵，下一刻成为弓箭手，让未参与战斗的士兵在瞬间提供远程支援。"
 mauryan_mauryas_path_2:0 "艾拉瓦塔的后裔"
 mauryan_mauryas_path_2_desc:0 "印度各邦长期以来一直使用大象进行战争。未驯化的大象往往过着和平的放牧生活；然而，当被训练为战争时，这些厚皮巨兽就像一个活生生的攻城锤，打破敌军步兵阵型，如同人类拍打苍蝇。"
 mauryan_mauryas_path_3:0 "帝国的战主"
 mauryan_mauryas_path_3_desc:0 "印度北部的密集人口区域允许招募庞大的军队。知道每个步兵都是不可战胜的战争机器的一部分，这激励了我们的军队进行英雄壮举。"
 mauryan_mauryas_path_4:0 "天然探路者"
 mauryan_mauryas_path_4_desc:0 "印度的茂密丛林和密林是大象骑兵的完美地形。能够轻松分开树叶，这在其他困难地形中的优势不可低估。"
 mauryan_mauryas_path_5:0 "专注的弓箭手"
 mauryan_mauryas_path_5_desc:0 "孔雀王朝军队的核心部队是弓箭手，配有各种风格的弓。事实上，许多印度军事编队为协调良好的密集弓箭部队预留了位置。"
 mauryan_mauryas_path_6:0 "我们祖先的家园"
 mauryan_mauryas_path_6_desc:0 "狂野的丛林和森林可能激发了孔雀王朝步兵的灵活性，他们根据情况切换武器，能够在低能见度的情况下和在开阔平原上同样有效地作战。"
 mauryan_mauryas_path_7:0 "部落融合"
 mauryan_mauryas_path_7_desc:0 "通过立法有效地消除部落文化，孔雀王朝成功地将部落文化系统地融入高度高效的官僚体系中。对森林、动物和皇家领地的保护，实际上迫使部落人民放弃游牧生活方式。"
 mauryan_mauryas_path_end_bonus:0 "战争官僚"
 mauryan_mauryas_path_end_bonus_desc:0 "习惯于处理庞大军队的需求，战斗和围城通常经过详细规划。前进部队经常被派遣以准备栖息地，并非常注意保护为主力部队提供补给的普遍行李队。"
 mauryan_noble_path_1:0 "适合国王"
 mauryan_noble_path_1_desc:0 "属于贵族的印度战车往往装饰华丽且防御坚固。这种做法既是身份的象征，也是一个实用的解决方案。"
 mauryan_noble_path_2:0 "杀戮训练"
 mauryan_noble_path_2_desc:0 "除了为骑手提供有利的平台，战象还被训练成毫不犹豫地杀戮。大象的冲锋常常足以使整个阵型陷入恐慌。"
 mauryan_noble_path_3:0 "重装弓箭手"
 mauryan_noble_path_3_desc:0 "许多文化将弓箭与轻散兵联系在一起。在孔雀军队中情况并非如此；保护弓箭手免受敌人投射物攻击，与编队系统保护他们免受地面攻击相得益彰。"
 mauryan_noble_path_4:0 "莲花绽放阵"
 mauryan_noble_path_4_desc:0 "莲花绽放阵是一种标志性阵型，据说像盛开的莲花。在《摩诃婆罗多》中提到了莲花绽放阵的神话起源，但这种阵型本身只有非常有限的用途。"
 mauryan_noble_path_5:0 "进口马匹"
 mauryan_noble_path_5_desc:0 "训练有素的战马贸易对我们在骑战中的成功至关重要。这些强壮的生物能够拉动更大的重量，并且在战斗中不容易惊慌。"
 mauryan_noble_path_6:0 "象群充裕"
 mauryan_noble_path_6_desc:0 "北方的绿色可耕地充满了财富，尤其是对我们的军队非常重要的大象；而供应过剩，价格就会下降。"
 mauryan_noble_path_7:0 "异域士兵"
 mauryan_noble_path_7_desc:0 "那些愿意远道而来的少数士兵将会在我们的军队中找到一席之地……当然是在谈判之后。"
 mauryan_noble_path_end_bonus:0 "与巨人同行"
 mauryan_noble_path_end_bonus_desc:0 "战象的效果不仅仅局限于我们的敌人。与这些雄伟的生物并肩作战，会增强所有士兵的信心。"
 mauryan_persia_enable:0 "一望无际的平原"
 mauryan_philosophy:0 "印度王国传统"
 mauryan_philosophy_2:0 "南亚部落传统"
 mauryan_philosophy_start_bonus:0 "战车"
 mauryan_philosophy_start_bonus_desc:0 "战车在印度历史早期是生活的重要组成部分。虽然不适合崎岖地形，战车是贵族的领域；甚至连皇帝阿育王也采用战车轮作为他的帝国象征。"
 mauryan_philosophydesc:0 "印度传统强调孔雀王朝及其邻国的优势，使用大型印度战象编队冲破敌军，由快速移动的弓箭手和战车支援，能够在分散的军队周围机动。他们还使用复杂的阵型，如传说中的莲花绽放阵（Padma Vyuha）。\n\n可以解锁“#Y 奴隶突袭#!”能力\n可以解锁“#Y 莲花绽放阵#!”战术\n可以解锁“#Y 八桅船#!”船只\n\n#G 传统重点#!\n强大的#Y弓箭手#!、#Y战象#!\n优秀的#Y战车#!"
 north_african_army_path_1:0 "熟练的征兵者"
 north_african_army_path_1_desc:0 "由于无法为国家需求提供足够的合格士兵，迦太基转而雇佣各种外国雇佣兵。依靠其谈判技巧，迦太基成为士兵寻求有偿雇佣的首选之地。"
 north_african_army_path_2:0 "专业海军陆战队"
 north_african_army_path_2_desc:0 "迦太基海军舰只不仅配备了水手，还配备了一队训练有素的海军陆战队员。在古代，登船作战很常见，武装人员的存在一定让水手和桨手放心。"
 north_african_army_path_3:0 "神圣军团"
 north_african_army_path_3_desc:0 "与主要由雇佣兵组成的其他部队不同，神圣军团是一群迦太基公民，可能是贵族出身，装备有重甲和长矛。这支精英部队采用类似希腊方阵的作战风格，但由于数量较少，在迦太基历史上多次被摧毁和重组。"
 north_african_army_path_4:0 "不安的关系"
 north_african_army_path_4_desc:0 "愿意为我们的军队提供部队的国家，这种做法可能会带来一些影响。我们的国家甚至可能被那些不愿提供必要部队的人所挟持——这种情况绝不允许。"
 north_african_army_path_5:0 "非洲象"
 north_african_army_path_5_desc:0 "巨大的野兽，厚实的皮肤和多变的性格，象在迦太基军队中被用作冲击骑兵。汉尼拔跨越阿尔卑斯山的事实证明，当不参与战斗时，它们是优秀的驮运动物。"
 north_african_army_path_6:0 "努米底亚骑兵"
 north_african_army_path_6_desc:0 "非洲内陆提供了熟练的骑手，是我们的敌人无法匹敌的。结合我们优越的装备，我们可以将这些游牧战士转变为可怕的重骑兵。"
 north_african_army_path_7:0 "毁灭性冲锋"
 north_african_army_path_7_desc:0 "大象在战场上的心理效果是巨大的。战线会崩溃，士兵被踩踏，整个军队在看到大象部队的尘土飞扬时会投降。"
 north_african_army_path_end_bonus:0 "艰难的讨价还价"
 north_african_army_path_end_bonus_desc:0 "许多国家被迦太基视为保护国，通常提供部队以换取名义上的保护。尽管他们得到报酬，但这种服务的预期使得成本相比普通的雇佣兵合同要低得多。"
 north_african_latin_enable:0 "狄多的复仇"
 north_african_levantine_enable:0 "大腓尼基海"
 north_african_naval_path_1:0 "腓尼基传承"
 north_african_naval_path_1_desc:0 "提尔的古代商人定居了地中海的大片土地。他们传奇的航海技能在我们人民的记忆中依然存在。"
 north_african_naval_path_2:0 "伊比利亚征召"
 north_african_naval_path_2_desc:0 "迦太基为了应对其庞大而分散的帝国所带来的兵力短缺问题，雇佣了大量外国士兵。凶猛的伊比利亚人是他们军队中的重要补充。"
 north_african_naval_path_3:0 "海军霸主"
 north_african_naval_path_3_desc:0 "迦太基舰队在西西里和北非周围的海域中常年存在。这种安全感和自信感使我们的船员们从容不迫，认识到我们在这一领域的优势。"
 north_african_naval_path_4:0 "海上生活"
 north_african_naval_path_4_desc:0 "虽然有些国家为对付特定敌人而建造特定舰队，我们的海军却一直在使用。因此，我们的船只始终携带现场维护的补给，使其更容易从战斗或一般损耗中恢复。"
 north_african_naval_path_5:0 "高贵的军阀"
 north_african_naval_path_5_desc:0 "我们的人民的贵族传统体现在任命精英领导我们的士兵上。这些对我们的国家有着巨大投入的人，很难被金钱或土地的诱惑所动摇。"
 north_african_naval_path_6:0 "宏伟建筑"
 north_african_naval_path_6_desc:0 "我们的灯塔、市政建筑和防御工事对于所有进入我们土地的人来说都很熟悉。然而，我们城市的高大城墙对那些意图征服的人来说是一个值得深思的问题。"
 north_african_naval_path_7:0 "让我们的人民工作"
 north_african_naval_path_7_desc:0 "迦太基军队对外国士兵的依赖，并未在海军中体现。穷人或心灰意冷的人总能在海上找到廉价劳动力，操作迦太基国家的众多军舰之一。"
 north_african_naval_path_end_bonus:0 "机动性至上"
 north_african_naval_path_end_bonus_desc:0 "迦太基人并不认同希腊人对巨舰的偏好。作为海战专家，他们更偏爱适应性更强的小型船只，并因此多次战胜敌人。公元前397年的卡塔纳战役中，叙拉古军遭遇惨败；他们在数量与作战表现上都逊于迦太基舰队。"
 north_african_philosophy:0 "布匿传统"
 north_african_philosophy_2:0 "努米底亚传统"
 north_african_philosophy_start_bonus:0 "航海民族"
 north_african_philosophy_start_bonus_desc:0 "北非的文明长期以来与沿海地区紧密相连。严酷的撒哈拉沙漠不适合大规模定居，因此，我们的人民长期以来将多变的海洋作为运输工具。"
 north_african_philosophydesc:0 "北非传统集中于腓尼基商人国家迦太基及其周边国家的优势。迦太基人拥有强大的海军传统，建立在数百年的地中海贸易之上，并使用重步兵和非洲战象支援轻步兵和骑兵，以打破敌军阵型。\n\n可以解锁“#Y 骑兵散兵#!”战术\n\n#G 传统重点#!\n强大的#Y 三列桨船#!\n优秀的#Y 轻步兵#!、#Y 战象#!"
 north_african_tribal_path_1:0 "生于马背"
 north_african_tribal_path_1_desc:0 "西部的柏柏尔人和努米底亚人从小就学习骑术。对于一个总是在移动的民族，这种技能是无价的。"
 north_african_tribal_path_2:0 "人与马"
 north_african_tribal_path_2_desc:0 "几代人与马和骆驼之间的相互依赖，使我们能够充分利用我们的骑兵，而不至于过度使用它们。"
 north_african_tribal_path_3:0 "稳健如野马"
 north_african_tribal_path_3_desc:0 "我们不需要盗窃或拥有权，而是与周围的土地和谐共处。在哪里有绿洲和水源，我们就在哪里找到将承载我们军队的野生动物。"
 north_african_tribal_path_4:0 "狂野冲锋"
 north_african_tribal_path_4_desc:0 "对一些人来说，这可能看起来像一场无序的混战，但我们的战士在这种战斗舞蹈中充满激情，了解敌友的动作，并与战争的节奏融为一体。"
 north_african_tribal_path_5:0 "本地知识"
 north_african_tribal_path_5_desc:0 "没有人比我们的人更了解沙漠的方式。别人看到的是一片荒凉的平原，而我们看到的是潜力。"
 north_african_tribal_path_6:0 "号召武装"
 north_african_tribal_path_6_desc:0 "每当我们受到威胁时，我们人民的命运就会被质疑——所有人都必须站起来保卫我们的文化。我们生死与共。"
 north_african_tribal_path_7:0 "尖锐的战吼"
 north_african_tribal_path_7_desc:0 "每一个士兵嘴唇上都有一个战吼。这是我们人民的方式，也是我们向敌人表明我们团结一致、准备杀戮的方式。"
 north_african_tribal_path_end_bonus:0 "各得其所"
 north_african_tribal_path_end_bonus_desc:0 "我们不对我们的部落人民施加任何限制。他们随意来去，常常带着战利品回来。"
 nubian_path_1:0 "塔赛提"
 nubian_path_10:0 "人人皆战士"
 nubian_path_10_desc:0 "我们将从小开始训练每个自由男孩的战斗技能，这样总会有人来保卫国家。"
 nubian_path_11:0 "伟大的东洋海"
 nubian_path_11_desc:0 "眼前的广阔水域将我们与远方的社区连接起来。我们的生活将永远改变。"
 nubian_path_12:0 "坚守阵地"
 nubian_path_12_desc:0 "库施女王坎达克送你这些箭。如果你想要和平，它们是她友好和温暖的象征。如果你想要战争，你会需要它们。"
 nubian_path_13:0 "深海怪物"
 nubian_path_13_desc:0 "通过建造最大和最坚固的船只，我们可以在波涛中巡逻；与我们可能遇到的任何泰坦或怪物媲美。"
 nubian_path_14:0 "库施长弓"
 nubian_path_14_desc:0 "从城墙上，弓箭手们持续不断地射出准确的箭矢，发射出如此密集的箭雨，以至于波斯人有一种乌云降临的感觉，尤其是当库施人以敌人的眼睛为目标时。他们的射击如此精准，那些被他们的箭矢击中的人会在群中狂奔，眼中插满箭矢，像双簧管一样。"
 nubian_path_1_desc:0 "努比亚人是如此出色的弓箭手，以至于埃及人称他们的家乡为塔赛提，意为“弓之国”。努比亚弓箭手在阿契美尼德军队中服役。公元8世纪，努比亚弓箭手击退了穆斯林入侵者，后者写道他们的准确度非常高。"
 nubian_path_2:0 "拇指环"
 nubian_path_2_desc:0 "努比亚弓箭手使用拇指而不是食指来拉紧他们的弓弦。根据佩戴者的身份，拇指环可以由花岗岩或银制成，较厚的一端位于拇指根部，防止弓弦摩擦皮肤，从而可以拉得更远。拇指环也被用作箭的支撑物。努比亚弓箭手还戴着护腕，以保护他们的手免受伤害。他们的箭袋挂在前面，而不是背后。"
 nubian_path_3:0 "努比亚骑兵"
 nubian_path_3_desc:0 "马匹是努比亚军事的重要组成部分。亚述军队通过努比亚马匹和骑手加强了他们的骑兵，从提格拉特-皮列色三世到亚述巴尼拔，努比亚马匹专家为亚述国王服务。"
 nubian_path_4:0 "专家大象训练"
 nubian_path_4_desc:0 "位于现代苏丹的穆萨瓦拉特·埃斯-苏夫拉的大型迷宫状大围栏复杂建筑包含许多象的图像，暗示它可能被用作大象护理设施或训练营。该综合体占地约45000平方米，建于公元前3世纪。"
 nubian_path_5:0 "填满地平线"
 nubian_path_5_desc:0 "我们将在风景中点缀新的社区，直到你无论走到哪里都能听到我们的语言，看见像我们这样生活的人们。"
 nubian_path_6:0 "库施复合弓"
 nubian_path_6_desc:0 "库施精英战士经常骑马作战，并使用复合弓向敌人射箭。"
 nubian_path_7:0 "努比亚象牙剑"
 nubian_path_7_desc:0 "象牙剑是一种设计用于安装在象牙尖端的武器。公元前20年，麦罗埃使用战象阻止罗马人入侵。"
 nubian_path_8:0 "海岸警卫队"
 nubian_path_8_desc:0 "我们需要一支专业舰队来保护我们的海岸免受盗贼、恶棍和入侵者的侵害。"
 nubian_path_9:0 "诺巴迪亚剑"
 nubian_path_9_desc:0 "诺巴迪亚短剑的单刃刀片不适合刺击，像长矛那样，但非常适合猛烈的劈砍攻击。"
 persian_achaemenid_path_1:0 "居鲁士的遗产"
 persian_achaemenid_path_1_desc:0 "阿契美尼德帝国的巨大军队使西方的希腊文明感到极度恐惧。他的帝国控制的广阔领土，以及人民的服务意愿，保证了高效的士兵补给。"
 persian_achaemenid_path_2:0 "不朽者"
 persian_achaemenid_path_2_desc:0 "一支传奇的士兵部队，被称为不朽者，据说由于其恒定的10000人的规模而得名。不朽者使用多种多样的武器和重型盔甲，成为军队的核心重步兵，其余部队围绕其形成。"
 persian_achaemenid_path_3:0 "海军改革"
 persian_achaemenid_path_3_desc:0 "阿契美尼德王朝监督了波斯海军的实施，利用附近的腓尼基水手来操作它。这样的海军传统遗产至今仍然影响着我们的人们。"
 persian_achaemenid_path_4:0 "反应性征兵"
 persian_achaemenid_path_4_desc:0 "古波斯国王的庞大军队在众多来源中都有提及。征召当地适龄男子参战的行为，一定极大地促进了战斗部队的规模。"
 persian_achaemenid_path_5:0 "王室血统"
 persian_achaemenid_path_5_desc:0 "阿契美尼德家族的血统从居鲁士一直延续到被亚历山大大帝征服为止。尽管最近遭受了征服，波斯帝国的辉煌时代仍然在记忆中强烈存在。"
 persian_achaemenid_path_6:0 "遮天蔽日"
 persian_achaemenid_path_6_desc:0 "阿契美尼德士兵因其箭术而受到希罗多德的赞扬，他们使用广泛的复合弓。在著名的温泉关战役中，本土波斯军队使用的大量弓箭手据说能够遮天蔽日。"
 persian_achaemenid_path_7:0 "卡达克斯"
 persian_achaemenid_path_7_desc:0 "后来，波斯人依靠重装雇佣步兵，称为卡达克斯。在亚历山大入侵期间，他们从波斯领土招募，但作为廉价雇佣兵使用。"
 persian_achaemenid_path_end_bonus:0 "大规模进攻"
 persian_achaemenid_path_end_bonus_desc:0 "我们大量的军队可以压倒任何微不足道的抵抗。虽然人员损失可能很高，但胜利因此而更加甜美。"
 persian_bactrian_path_1:0 "巴克特里亚骑兵"
 persian_bactrian_path_1_desc:0 "阿契美尼德和马其顿人都在他们的军队中使用了巴克特里亚骑兵，因为他们的技能和可用性。像西方的塞西亚人一样，他们的文化深受马背游牧生活方式的影响。"
 persian_bactrian_path_2:0 "希腊化巴克特里亚"
 persian_bactrian_path_2_desc:0 "希腊对巴克特里亚的影响异常迅速地生根。建筑和防御工事以这些风格迅速兴起，通常被认为优于他们那些不太希腊化的邻国。"
 persian_bactrian_path_3:0 "完美风暴"
 persian_bactrian_path_3_desc:0 "公元前3世纪中叶发展兴起的希腊‑巴克特里亚王国，是风俗、民族，乃至至关重要的战术的文化熔炉。多样化战斗方式的融合造就了一支强大的军势。"
 persian_bactrian_path_4:0 "克勒鲁克"
 persian_bactrian_path_4_desc:0 "亚历山大征服期间，马其顿人在巴克特里亚创建了许多定居点，其中许多繁荣昌盛。这些被称为克勒鲁克的人，提供了几代人的忠诚人力资源。"
 persian_bactrian_path_5:0 "战斗巨人"
 persian_bactrian_path_5_desc:0 "靠近印度，导致大象被整个军队采用。骑手坐在轿子上，使他们能够俯视下面的战斗。"
 persian_bactrian_path_6:0 "骑射手"
 persian_bactrian_path_6_desc:0 "围绕巴克特里亚的游牧部落经常被地区军队雇佣，在骑射和马术上表现出色。"
 persian_bactrian_path_7:0 "心脏地带"
 persian_bactrian_path_7_desc:0 "巴克特里亚的心脏地带是一个郁郁葱葱的肥沃平原，四面环山，草原和沙漠。这里所需的适应能力使我们的军队比大多数军队更好地做好了准备。"
 persian_bactrian_path_end_bonus:0 "心灰意冷的大众"
 persian_bactrian_path_end_bonus_desc:0 "亚历山大的宏伟战役留下了成千上万愿意为生计服务的雇佣兵。后来，许多周边部落开始被同化，导致大量廉价雇佣兵合同的可用性。"
 persian_levantine_enable:0 "帝国舰队"
 persian_mauryan_enable:0 "印度斯坦的丛林"
 persian_philosophy:0 "波斯传统"
 persian_philosophy_2:0 "草原游牧传统"
 persian_philosophy_start_bonus:0 "塞西亚马背弓箭手"
 persian_philosophy_start_bonus_desc:0 "强壮的塞西亚马匹被草原上的游牧部落使用了几代人。作为散兵部队无可比拟，他们造成的混乱对那些有幸能够培养或雇佣他们的人来说，是一个重大优势。"
 persian_philosophydesc:0 "伊朗传统涵盖了斯基泰草原和前阿契美尼德帝国治下民族的战术。草原上和周围的生活将这些民族塑造成了精悍的骑兵，他们手持弓，可以在对手够不到的地方攻击和包围他们，而他们的步兵则专注于削弱疲惫的阵型。\n\n可以解锁‘#Y 八列桨座战船#!'船只\n可以解锁'#Y 骑兵冲锋#!'策略\n可以解锁‘#Y 提高税率#!’能力\n可以解锁‘#Y 军事殖民地#!’能力\n\n#G 传统焦点#!\n强悍的#Y 马弓手#!\n不错的#Y 重步兵#!， #Y 重骑兵#!"
 persian_scythian_path_1:0 "帕提亚战术"
 persian_scythian_path_1_desc:0 "马背弓箭手的标志性战术是帕提亚战术。需要完全掌握他们的坐骑，骑手会在撤退时，扭转身体在马鞍上向目标射击。"
 persian_scythian_path_2:0 "游牧生活"
 persian_scythian_path_2_desc:0 "草原上的人们经常在移动。他们的持续准备状态在战争中非常有利。"
 persian_scythian_path_3:0 "打了就跑"
 persian_scythian_path_3_desc:0 "与步兵战术的形成性战术相反，骑兵战术往往涉及更多的个人自主性。马背弓箭手尤其如此，他们会形成一个旋转的箭雨和马匹的云，削弱敌人的士气，并在随后的战斗中占据优势。"
 persian_scythian_path_4:0 "骑兵散兵"
 persian_scythian_path_4_desc:0 "骑兵是出色的拦截者，可以切断撤退路线，干扰补给线。通过命令我们的骑手骚扰但不进行决定性的交战，我们剥夺了敌人在数量上的优势。"
 persian_scythian_path_5:0 "重骑兵"
 persian_scythian_path_5_desc:0 "许多拥有马匹掌控历史的文化开发了使用重骑兵或重装骑兵的方法，以对抗小型武器。无论是骑手还是马匹都披上重型鳞甲或链甲，只有完全崩溃才能打破一支重骑兵部队的冲锋。"
 persian_scythian_path_6:0 "草原掌控"
 persian_scythian_path_6_desc:0 "游牧生活赋予我们的人们对在这片严酷的土地上行动和生存的出色知识。"
 persian_scythian_path_7:0 "步兵"
 persian_scythian_path_7_desc:0 "尽管大多数草原战争是骑兵进行的，塞西亚步兵在中期古代的许多战斗中都有记载。塔提斯战役中，塞西亚步兵对早期的博斯普鲁斯王国进行了战争。"
 persian_scythian_path_end_bonus:0 "天生骑手"
 persian_scythian_path_end_bonus_desc:0 "萨尔马提亚和塞西亚部落从小就学习骑术，培养了对马鞍的亲和力，这是任何西方文化都无法比拟的。这些知识在组织我们的军队时可以派上很大的用场。"
 price_tribal_duel_cost_modifier:0 "部落决斗成本修正"
 scythian_path_1:0 "缝制皮革铠甲"
 scythian_path_10:0 "倒钩箭头"
 scythian_path_10_desc:0 "这些箭头特别凶狠，难以从人体中拔出。它们深入且牢固，以至于如果拔出，一大块肉会跟着一起出来。通常必须将其切割出来。"
 scythian_path_11:0 "戈里托斯箭袋"
 scythian_path_11_desc:0 "这种箭袋便于骑马时轻松取箭。"
 scythian_path_12:0 "斯基泰侦察兵"
 scythian_path_12_desc:0 "萨尔马提亚人和斯基泰部落从小就学习马术，培养了与西方文化不同的马术亲和力。这些知识在组织我们的军队时可以得到很好的实际应用。"
 scythian_path_13:0 "皇家库尔干"
 scythian_path_13_desc:0 "最有价值的国王为自己建立了巨大的墓地。"
 scythian_path_14:0 "正规女战士"
 scythian_path_14_desc:0 "在斯基泰文化中，妇女享有许多与男人相同的权利，但她们也有许多类似的职责，包括战斗。当战争来临时，妇女们与男子并肩作战。"
 scythian_path_1_desc:0 "根据希腊工匠制作的斯基泰金饰，斯基泰骑士在公元前4世纪之前就穿着缝制的皮革夹克和裤子。"
 scythian_path_2:0 "通过战斗结婚"
 scythian_path_2_desc:0 "斯基泰妇女通常只考虑与在战斗中杀死过其他人的求婚者结婚。"
 scythian_path_3:0 "草原枪骑兵"
 scythian_path_3_desc:0 "草原枪骑兵是一支拥有高穿透力的可怕部队。"
 scythian_path_4:0 "斯基泰围城技术"
 scythian_path_4_desc:0 "马背上的领主们想出了围攻城市的新方法——毕竟，马不能爬墙。"
 scythian_path_5:0 "球形阵型"
 scythian_path_5_desc:0 "这种阵型增强了训练有素的战士的杀伤效率。"
 scythian_path_6:0 "骆驼袭击者"
 scythian_path_6_desc:0 "使用骆驼，这些部队找到了不补给就能行进更远距离的方法。"
 scythian_path_7:0 "战利品"
 scythian_path_7_desc:0 "斯基泰人以收集战利品而闻名，尤其是人类头皮，他们有时会将其编织到斗篷或衣服中。"
 scythian_path_8:0 "马跪下"
 scythian_path_8_desc:0 "教马跪下所需的训练和纪律是巨大的，但在单位编队中影响深远。"
 scythian_path_9:0 "鳞甲"
 scythian_path_9_desc:0 "鳞甲比链甲更能保护身体；然而，作为权衡，它的灵活性较差。"
 seduce_governor_cost_modifier:0 "引诱总督成本修正"
 steppe_philosophy:0 "斯基泰军事传统"
 steppe_philosophy_2:0 "巴克特里亚军事传统"
 steppe_philosophy_2_desc:0 "."
 steppe_philosophy_desc:0 "."
 thracian_path_1:0 "弯刀和短剑"
 thracian_path_10:0 "平原与我们同战"
 thracian_path_10_desc:0 "达契亚的起伏平原为使用骑兵和快速移动的步兵提供了理想的地形。"
 thracian_path_11:0 "训练有素的骑兵"
 thracian_path_11_desc:0 "家马在紧急情况下足以进行防御，但在战场上容易惊慌。因此，通过扩大我们的战马存量，我们的勇敢战士将在他们的真正使命中表现出色。"
 thracian_path_12:0 "达拉博斯特"
 thracian_path_12_desc:0 "贵族在高度军事化的达契亚社会中发挥了非常重要的作用。只有达契亚贵族有权遮住头，并戴着毡制的弗里吉亚帽。在战斗中，他们可能会戴上青铜弗里吉亚头盔，穿上铁甲，拿着椭圆形的木盾。"
 thracian_path_13:0 "进攻是最好的防御"
 thracian_path_13_desc:0 "我们的许多战士甚至不带盾牌，而是专注于全力攻击敌人。"
 thracian_path_1_desc:0 "弯刀和短剑是弯曲刀刃的武器。刀刃的边缘在弯曲的内侧，允许战士绕过对手的盾牌攻击手臂和腿。这些武器如此有效，以至于在后来的达契亚战争中，罗马士兵的标准盔甲发生了变化。"
 thracian_path_2:0 "色雷斯骑术"
 thracian_path_2_desc:0 "色雷斯人的骑兵特别有名，马其顿的腓力二世从他们那里借鉴了楔形阵型。尤其是北方的盖塔人据说与可怕的斯基泰人无异。"
 thracian_path_3:0 "部落王国"
 thracian_path_3_desc:0 "希腊以北地区出现了许多部落王国。当在强大的国王统治下团结起来时，他们是一股不可忽视的力量，但这种中央集权的努力常常面临各种地方权力持有者的反对，他们嫉妒地保卫着他们的古老特权。"
 thracian_path_4:0 "坚固防御"
 thracian_path_4_desc:0 "能够在靠近我们家园的山区使用我们所有的部队对我们的生存至关重要。"
 thracian_path_5:0 "大熔炉"
 thracian_path_5_desc:0 "多年来，达契亚人和色雷斯人接触了许多外国人，包括希腊殖民者、加利亚入侵者和日耳曼移民。当地部落迅速将这些外国人带来的专业知识用于自己的需求。"
 thracian_path_6:0 "殖民地"
 thracian_path_6_desc:0 "随着我们的人口增长，让我们向南方的希腊人学习，在各地建立殖民地，用土地奖励退伍军人，他们将热切地保卫这些土地。"
 thracian_path_7:0 "轻装步兵"
 thracian_path_7_desc:0 "马其顿以北的部落常常避开盔甲，这种盔甲仅限于贵族和国王。特别是色雷斯人更喜欢作为轻装步兵作战，携带标枪、剑和一种叫做pelte的柳条盾。他们的巨大机动性使他们能够超越更重的希腊步兵，同时在近战中表现出色，不像专职的骚扰部队。"
 thracian_path_8:0 "拿起武器"
 thracian_path_8_desc:0 "每个人在我们的军队中都有一席之地；尤其是猎人，他们在战场和森林中追踪猎物。"
 thracian_path_9:0 "达瓦要塞"
 thracian_path_9_desc:0 "这些建在山上的石头要塞，利用同心圆的防御环，如果外部防御被突破，允许防御者撤退到内部并继续战斗。"

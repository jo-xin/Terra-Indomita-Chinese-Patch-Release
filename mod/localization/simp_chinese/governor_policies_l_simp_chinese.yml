l_simp_chinese:
 GOVPOL_ALREADY:0 "$WHO$ 已在 $WHERE$ 推行 $NAME$。"
 GOVPOL_CAPITAL_PROVINCE:0 "#T 总督政策#!\n点击为 $NAME|Y$ 选择新政策。这将花费 $COST$"
 GOVPOL_DO_IT:0 "#T 总督政策#!\n点击为 $WHERE|Y$ 选择新政策。这将花费 $COST$。"
 GOVPOL_FOR_CAPITAL:0 "省份首府获得以下效果：\n$DATA$"
 GOVPOL_FOR_GOVERNOR:0 "总督获得：\n$DATA$"
 GOVPOL_FOR_NON_CAPITAL:0 "非省份首府的每个领土获得以下效果：\n$DATA$"
 GOVPOL_FOR_PROVINCES:0 "省份内每个领土获得以下效果：\n$DATA$"
 GOVPOL_GOV_NOT_LOYAL:0 "$NAME$ 的忠诚度不足以更改政策。忠诚度需高于 $VAL|Y%2$，当前为 $CURR|Y2%$。"
 GOVPOL_JUST_DO_IT:0 "在 $WHERE$ 将政策改为 $POLICY|Y$ 将花费 $COST$"
 GOVPOL_NOT_OWNED_BY_YOU:0 "你需要拥有该省份才能更改其政策。"
 GOVPOL_NO_GOV_PRESENT:0 "你需要先为 $NAME$ 指派总督，才能更改其政策。"
 GOVPOL_TOOLTIP:0 "[GetChangeGovernorPoliciesTooltip(ProvinceWindow.GetState)]\n\n[ProvinceWindow.GetState.GetGovernorPoliciesTooltip]"
 GOV_POLICY_MONTHLY_CHANCE:0 "每月有概率发生以下事项："
 GOV_POLICY_TT:0 "#T $NAME$#!\n$DETAILS$\n\n#TF $DESC$#!"
 OVERVIEW_GOVPOL_TOOLTIP:0 "[GetChangeGovernorPoliciesTooltip(StateItem.GetState)]\n"
 acquisition_of_wealth:0 "财富获取"
 acquisition_of_wealth_desc:0 "此政策将增加整个省份的税收与商业收入，但代价是充实了主管总督的私囊。有些奸邪之徒只对中饱私囊感兴趣。"
 bleed_them_dry:0 "榨干他们"
 bleed_them_dry_desc:0 "此政策将极大增加一省的收入，但代价是产生不满情绪并降低粮食产出。毕竟，人民的忍耐和生存都是有极限的。"
 borderlands:0 "边境地区"
 borderlands_desc:0 "此政策将增加省份人口的人力贡献并加强其防御能力。确保稳定的兵源和坚固的防御工事是胜利的关键。"
 centralize_pops:0 "集中人口"
 centralize_pops_desc:0 "此政策将鼓励人口向省份首府迁移，并加速本地人口流动，从而集聚人口。繁华的大都市是省份繁荣的明确标志。"
 civilization_effort:0 "文明开化"
 civilization_effort_desc:0 "此政策将加快省份文明开化的速度，并逐渐平定邻近的蛮族据点。只有基础设施建设、文化传播和学问才能带来启蒙。"
 cultural_assimilation:0 "文化同化"
 cultural_assimilation_desc:0 "此政策将加快省内领土人口被同化为国家主流文化的速度。被转化的人口将更幸福，从而更具生产力且更忠诚。"
 decentralize_pops:0 "分散人口"
 decentralize_pops_desc:0 "此政策将鼓励人口从省份首府迁出，并加速本地人口流动，从而分散人口。有时，人口过剩并非粮食一途可解。"
 encourage_trade:0 "鼓励贸易"
 encourage_trade_desc:0 "此政策将通过鼓励外国商人来此经商来增加省份的商业收入和粮食产出。只要能抓住机遇，就总能有利可图。"
 gov_pol.1.t:0 "1个人口皈依[ROOT.GetState.GetGovernorOrRuler.GetEmployer.GetReligion.GetName]信仰。\n\n[ROOT.GetState.GetGovernorOrRuler.GetName]共负责转化#Y [SCOPE.ScriptValue('religionator_svalue')|0]#!个人口，被视为[ROOT.GetState.GetGovernorOrRuler.Custom('get_religionator_descriptor')]。"
 gov_pol.2.t:0 "1个人口皈依[ROOT.GetState.GetGovernorOrRuler.GetEmployer.GetPrimaryCulture.GetName]文化。\n\n[ROOT.GetState.GetGovernorOrRuler.GetName]共负责转化#Y [SCOPE.ScriptValue('culturenator_svalue')|0]#!个人口，被视为[ROOT.GetState.GetGovernorOrRuler.Custom('get_culturenator_descriptor')]。"
 gov_pol.3.t:0 "相邻蛮族据点的文明等级提高2。"
 gov_pol.4.t:0 "降级或移除相邻领土中的蛮族据点。"
 gov_pol.5.t:0 "每个适用领土中的1个人口将被提升或降级，目标是在公民、自由民和奴隶之间达到平均分配。这不会转化部落民。"
 gov_pol.6.t:0 "1个#Y部落民人口#!晋升为#Y自由民人口#!或#Y奴隶人口#!。\n\n[ROOT.GetState.GetGovernorOrRuler.GetName]共负责开化#Y [SCOPE.ScriptValue('enlightenator_svalue')|0]#!个人口，被视为[ROOT.GetState.GetGovernorOrRuler.Custom('get_enlightenator_descriptor')]。"
 gov_pol.7.t:0 "1个人口从随机省份领土迁移到国家首都。"
 gov_pol.8.t:0 "1个人口从高人口领土迁移到低人口领土，目标是达到均匀分布。这永远不会超过领土的#Y人口容量#!。"
 harsh_treatment:0 "严厉镇压"
 harsh_treatment_desc:0 "此政策将提高省份忠诚度，代价是降低产出并促使人口向外迁移。虽然代价不菲，但有时对付异议的最佳方式就是展示武力。"
 local_autonomy:0 "地方自治"
 local_autonomy_desc:0 "此政策将提升省份人口幸福度，但代价是大幅降低他们在各方面的产出。通过减轻人民的负担，我们一定能提升他们的满意度。"
 pop_from_maptext_tt_citizen:0 "1名@citizen!被重新分配至此。"
 pop_from_maptext_tt_freemen:0 "1名@freemen!被重新分配至此。"
 pop_from_maptext_tt_slaves:0 "1名@slaves!被重新分配至此。"
 pop_from_maptext_tt_tribesmen:0 "1名@tribesmen!被重新分配至此。"
 religious_conversion:0 "宗教转变"
 religious_conversion_desc:0 "此政策将加快省份领土内人口皈依我国宗教的速度。传播我们的信仰使人口更容易同化入国家的主导文化。"
 scorched_earth:0 "焦土政策"
 scorched_earth_desc:0 "此政策将使本省变成无人应入的荒芜废土，敌人经过此处必将三思。不过居住于此的民众可能对这片土地上真正可怕的环境不会太高兴……"
 social_mobility:0 "社会流动"
 social_mobility_desc:0 "此政策将加快省份人口晋升到更高阶层的速度，依次从奴隶到贵族。鼓励合理的行业分布将确保经济全面发展。"

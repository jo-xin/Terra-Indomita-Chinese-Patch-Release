 inv_after_battle.11.d:0 "[SCOPE.sCharacter('inv_after_battle_1_target').GetName] 已经获得了从不把受伤士兵留在战场上的声誉，他经常把 [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHim]自身置于极大的个人危险之中，只为了确保没有人被遗忘。\n\n感谢 [SCOPE.sCharacter('inv_after_battle_1_target').GetFirstName] 置个人安危度外的无私奉献，这激励了我们的许多士兵追随 [SCOPE.sCharacter('inv_after_battle_1_target').GetHerHis] 的脚步。"

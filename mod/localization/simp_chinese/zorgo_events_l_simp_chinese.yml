 zorgo_event.1.a:0 "从国库中拿一件礼物赠予 [SCOPE.sCharacter('random_dude_2').GetFirstName]，并对他说我深表歉意。"
 zorgo_event.1.b:0 "告诉那个傻瓜，如果他还不想另一个眼睛也瞎掉，就把嘴给我闭上！"
 zorgo_event.1.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，有一件微妙的事情需要您亲自处理。我们听说 [SCOPE.sCharacter('random_dude').GetName] 在有关房产的问题上威胁要杀死 [SCOPE.sCharacter('random_dude_2').GetName]  [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 中的同一片地皮，因此两者都没有退缩。在过去的几周里，口水战持续升级，就在昨晚，[SCOPE.sCharacter('random_dude_2').GetFirstName] 在 [SCOPE.sCharacter('random_dude_2').GetHerHis] 出门后遭到殴打，最终失去了一只眼睛。\n\n虽然我们通常不会用这样的事情来麻烦您，但您与 [SCOPE.sCharacter('random_dude').GetFirstName] 的血缘关系使问题复杂化——[SCOPE.sCharacter('random_dude_2').GetFirstName] 一直在对所有人扬言说让您的拥簇到 [SCOPE.sCharacter('random_dude_2').GetHerHim] 门口教教他怎么做人，人们都在等待您的反应。"
 zorgo_event.1.t:0 "算账"
 zorgo_event.10.a:0 "我们对陌生人的好客是出了名的；你可以和我们住在一起。"
 zorgo_event.10.b:0 "叫他马上离开我们的城市！留在这儿？多么荒谬的想法。"
 zorgo_event.10.desc:0 "几天前，一个名叫 [SCOPE.sCharacter('euthymios').GetName] 的外国人，在 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 外城被抓获。并押到 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 面前让这个陌生人解释自己的行为。之前，[SCOPE.sCharacter('euthymios').GetFirstName] 是一个来自 [GetProvince('(int32)416').GetName] 的商人。但他家乡发生的政治动荡导致他被驱逐。经过多年的流浪，优特弥俄斯终于来到了我们的土地，穷困潦倒，疲惫不堪。\n\n当他站到 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 面前时，优特弥俄斯拿出一个小小的钱包，跪倒在地。‘仁慈的王啊，请接受我这一生所剩下的一切财物，只求允许我留在这里。我已经没有余力再走下去了'。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 倾向于表现出仁慈，但毫无疑问，当地人会抱怨，他们可不想和流亡商人生活在一起。"
 zorgo_event.10.t:0 "流浪商人"
 zorgo_event.100.a:0 "将这一祝福告知我们的将军们，看看他们想怎么做"
 zorgo_event.100.desc:0 "我们的侦察员报告说，[friendly_neighbor.GetName]的政府正面临着严重的财政困难，为了不顾一切地节省每一个硬币，他们已经开始拆除他们的一些边境防御工事。虽然他们较大的堡垒仍有驻军，但辅兵都被送回了他们的村庄......这给我们带来了机会，如果我们足够无情地追求它们的话。"
 zorgo_event.100.t:0 "拆毁防御工事"
 zorgo_event.101.a:0 "是的，这听起来很好 - 让我们立即离开"
 zorgo_event.101.b:0 "不，我现在太忙了，没时间做这个。"
 zorgo_event.101.desc:0 "[ROOT.GetCountry.GetRuler.GetName]正在[ROOT.GetCountry.GetCapital.GetName]努力工作，慢慢淹没在昨天需要处理的重要信件的海洋中，这时，[ROOT.GetCountry.GetRuler.GetHerHis]的门被坚定地敲响了--是[SCOPE.sCharacter('random_dude_hunter').GetName]和[SCOPE.sCharacter('random_dude_hunter_2').GetName]，他们穿着全套的狩猎装备。在他们身后的院子里，一群邋遢的狗正在叫喊，互相搏斗，还有大约二十个人在转悠，有些人骑着马，但大多数人是步行。献给#E [ROOT.GetCountry.Custom('get_harvest_goddess')]#! 的节日快到了，按照惯例，我们贵族要去打猎以纪念这一神圣的事件。你怎么说？\"盯着[ROOT.GetCountry.GetRuler.GetHerHim]前面的那堆工作，[ROOT.GetCountry.GetRuler.GetFirstName]站了起来。"
 zorgo_event.101.t:0 "去打猎"
 zorgo_event.102.a:0 "我从来不知道你们两个是如此有趣..."
 zorgo_event.102.b:0 "我很惊讶你能如此畅所欲言--我会记住这一点。"
 zorgo_event.102.c:0 "让我们为[ROOT.GetCountry.Custom('get_harvest_goddess')]恢复祠堂"
 zorgo_event.102.d:0 "当然，这发生在我身上......也许下一次吧"
 zorgo_event.102.desc_1:0 "现在，[ROOT.GetCountry.GetRuler.GetName]已经同意加入狩猎，它已经决定，一行人将骑马前往[SCOPE.sCharacter('random_dude_hunter').GetName]在[SCOPE.sP('randomized_country_province').GetName]附近的狩猎小屋。[ROOT.GetCountry.GetRuler.GetFirstName]与[SCOPE.sCharacter('random_dude_hunter').GetName]和[SCOPE.sCharacter('random_dude_hunter_2').GetName]并肩而行，谈话内容涉及生活经历--童年、婚姻、打过的仗和输过的仗、神的本质、[ROOT.GetCountry.GetCapital.GetName]的房地产价格--任何可以在礼貌社会讨论的事情都被提及。尽管认识[SCOPE.sCharacter('random_dude_hunter').GetFirstName]和[SCOPE.sCharacter('random_dude_hunter_2').GetFirstName]多年，[ROOT.GetCountry.GetRuler.GetFirstName]不记得上一次[ROOT.GetCountry.GetRuler.GetSheHe]有如此可爱的谈话是什么时候。"
 zorgo_event.102.desc_2:0 "现在[ROOT.GetCountry.GetRuler.GetName]已经同意参加狩猎，大家决定骑马去[SCOPE.sCharacter('random_dude_hunter').GetName]在[SCOPE.sP('randomized_country_province').GetName]附近的一个狩猎小屋。\n\n天空下着细雨，让人感到很烦恼，不一会儿，每个人都湿透了。除了[SCOPE.sCharacter('random_dude_hunter_2').GetName]，每个人都忍受着这种不便，[SCOPE.sCharacter('random_dude_hunter_2').GetName]一直在咒骂，向[ROOT.GetCountry.GetRuler.GetFirstName]投以不满的目光。大声地吐了一口唾沫，[SCOPE.sCharacter('random_dude_hunter_2').GetFirstName]抬起[SCOPE.sCharacter('random_dude_hunter_2').GetHerHis]的双臂，对着天空再次发誓。转过身来面对[ROOT.GetCountry.GetRuler.GetFirstName]，[SCOPE.sCharacter('random_dude_hunter_2').GetFirstName]伸出一根手指，嘲笑道。\n\n“我们离开[ROOT.GetCountry.GetCapital.GetName]的时候天空一片晴朗，但现在天上却在向我们倾盆而下——你做了什么惹怒了[ROOT.GetCountry.Custom('get_harvest_goddess')]？也许你应该呆在家里……”\n\n每个人都为这种无礼的行为感到震惊。"
 zorgo_event.102.desc_3:0 "既然[ROOT.GetCountry.GetRuler.GetName]已经同意加入狩猎，那么就决定一行人将骑马前往[SCOPE.sCharacter('random_dude_hunter').GetName]在[SCOPE.sP('randomized_country_province').GetName]附近的狩猎小屋。在旅程的第二天，一行人正在森林旁边的一条小溪边锻造，这时，树林里的一点碎石吸引了[ROOT.GetCountry.GetRuler.GetFirstName]的注意。走近一看，似乎是[ROOT.GetCountry.GetRuler.GetTitleName]发现了一个神龛，这个神龛被藤蔓覆盖，明显处于废墟状态。到处都是散落的大理石和砖块，有些碎片被火烧焦了。'我不敢猜测这里发生了什么邪恶的事情。当大家围着[ROOT.GetCountry.GetRuler.GetHerHim]时，[ROOT.GetCountry.GetRuler.GetFirstName]面无表情地嘀咕道。但我知道，我们仍然在[ROOT.GetCountry.GetName]的边界内，而且我最后一次检查时，我的话具有法律的效力。立即下马，朋友们，因为在我们继续前进之前，还有一些工作要做。"
 zorgo_event.102.desc_4:0 "队伍离[ROOT.GetCountry.GetCapital.GetName]还不到一天的路程，一队骑手就超过了猎人，他们的坐骑喘着粗气，浑身冒着汗。带头的信使看起来松了一口气，因为他找到了[ROOT.GetCountry.GetRuler.GetTitleName]。Hail [ROOT.GetCountry.GetRuler.GetName]!首都有些事情需要你亲自去处理--你必须马上回来。每个人都显得很失望，但没有机会让[ROOT.GetCountry.GetRuler.GetFirstName]去。带着怀念的眼神转向[ROOT.GetCountry.GetRuler.GetHerHis]人，[ROOT.GetCountry.GetRuler.GetFirstName]挥手告别，开始了回家的旅程。"
 zorgo_event.102.e:0 "也许你是对的!这的确是个糟糕的天气"
 zorgo_event.102.t:0 "打猎：乡村的一天"
 zorgo_event.103.a:0 "只要给我......Hic......几个小时，我就会准备好。"
 zorgo_event.103.b:0 "我们走了!"
 zorgo_event.103.c:0 "我开始感到不舒服了......唉"
 zorgo_event.103.d:0 "我们必须立即回家--我们为[ROOT.GetCountry.GetCapital.GetName]而骑行!"
 zorgo_event.103.desc_1:0 "经过一周的旅行，大家都来到了[SCOPE.sCharacter('random_dude_hunter').GetName]的狩猎小屋，空气中弥漫着兴奋的气息--大家都承认，最近[ROOT.GetCountry.GetCapital.GetName]的生活压力很大，这次旅行是大家放松和享受的黄金机会。猎人们扎好营，安顿好晚上的生活，同意在日出前吃早饭，这样狩猎就能与晨光重合。当然，这是在[ROOT.GetCountry.GetRuler.GetName]掏出一壶烈性[ROOT.GetCountry.GetAdjective]酒围着篝火决定的。这瓶酒被传递，直到它被喝光，然后又产生了另一瓶，然后又产生了另一瓶，每一瓶的命运都与第一瓶相似。喧闹的笑声充满了营地，整个晚上都在交换着故事。\当[ROOT.GetCountry.GetRuler.GetFirstName]醉醺醺地爬上床时，太阳才勉强探出地平线，在[ROOT.GetCountry.GetRuler.GetHerHis]的耳朵里塞了些草屑，以隔绝清晨的鸟鸣。"
 zorgo_event.103.desc_2:0 "经过一周的旅行，大家都来到了[SCOPE.sCharacter('random_dude_hunter').GetName]的狩猎小屋，空气中弥漫着兴奋的气息--大家都承认，最近[ROOT.GetCountry.GetCapital.GetName]的生活压力很大，这次旅行是大家放松和享受的黄金机会。猎人们扎营并在晚上安顿下来，同意在日出前吃早饭，这样狩猎就能与晨光相吻合。没过多久，篝火就被扑灭了，面包碎片和冷肉很快就被吃光了，猎人们开始向森林出发。"
 zorgo_event.103.desc_3:0 "经过一周的旅行，每个人都到达了[SCOPE.sCharacter('random_dude_hunter').GetName]的狩猎小屋，空气中弥漫着兴奋的气息--每个人都承认最近[ROOT.GetCountry.GetCapital.GetName]的生活压力很大，这次旅行是每个人放松和享受美好时光的黄金机会。猎人们扎好营，安顿好晚上的生活，同意在日出前吃早饭，这样狩猎就能与晨光重合。不幸的是，首都外开始的雨似乎也跟着聚会一起下了，[ROOT.GetCountry.GetRuler.GetName]因为持续的小雨而无法好好睡觉。经过一个不平静的夜晚，走到[ROOT.GetCountry.GetRuler.GetHerHis]帐篷外，[ROOT.GetCountry.GetRuler.GetFirstName]粗略地咳嗽起来，[ROOT.GetCountry.GetRuler.GetHerHis]整个身体在颤抖。"
 zorgo_event.103.desc_4:0 "经过一周的旅行，大家已经到达[SCOPE.sCharacter('random_dude_hunter').GetName]的狩猎小屋，空气中弥漫着兴奋的气息--大家都承认，最近[ROOT.GetCountry.GetCapital.GetName]的生活压力很大，这次旅行是大家放松和享受的黄金机会。猎人们扎好营，安顿好晚上的生活，同意在日出前吃早饭，这样猎人们就可以和晨光相吻合。\黎明发现[ROOT.GetCountry.GetRuler.GetName]正在给[ROOT.GetCountry.GetRuler.GetHerHis]弓上弦，这时树林里传来一阵响亮的沙沙声--迅速抽出一支箭，转过身来，[ROOT.GetCountry.GetRuler.GetFirstName]惊讶地看到一群穿着[ROOT.GetCountry.GetAdjective]衣服的士兵离开了森林。[ROOT.GetCountry.GetRuler.GetFirstName]感谢诸神，我们找到了你们--我们已经跟踪你们一行一周了。你们必须马上回到[ROOT.GetCountry.GetCapital.GetName]，因为发生了一场可怕的事故--你们的主要继承人，[SCOPE.sCharacter('zorgo_event_103_heir').GetName]，受了重伤。"
 zorgo_event.103.t:0 "打猎：营地的早晨"
 zorgo_event.104.a:0 "你没有杀死两只熊，[SCOPE.sCharacter('random_dude_hunter').GetFirstName]!你满嘴跑火车"
 zorgo_event.104.b:0 "这真是浪费了很多时间"
 zorgo_event.104.c:0 "我每天都将以[ROOT.GetCountry.GetAdjective]人的福祉为重。"
 zorgo_event.104.d:0 "那不是运气--你看到的是技巧，我的朋友们"
 zorgo_event.104.desc_1:0 "最后，[ROOT.GetCountry.GetRuler.GetName]唯一能带回家的是更多的故事可以分享--似乎[ROOT.GetCountry.Custom('get_harvest_goddess')]认为今天不适合祝福[ROOT.GetCountry.GetRuler.GetHerHim]狩猎成功。尽管如此，这并不完全是浪费时间，其他猎人的情况也没有好转，每个人都在营地里开着玩笑说他们运气不好。很快，熊熊燃烧的火苗在空气中弥漫着噼里啪啦的声音，猎人们轮流描述他们在田野边缘看到的雄鹿，灵活地跳开，或在灌木丛中蹒跚的熊。随着夸张和大胆的故事增多，笑声和狂欢一直持续到晚上。"
 zorgo_event.104.desc_10:0 "[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]的生活中从未见过这样的事情--在那里，在湖的边缘，一只白色的雄鹿正在喝水，它背对着猎人。\伸手到[ROOT.GetCountry.GetRuler.GetHerHis]箭筒里，[ROOT.GetCountry.GetRuler.GetFirstName]轻轻地插上了箭，在[ROOT.GetCountry.GetRuler.GetHerHis]的嘴唇上向[ROOT.GetCountry.Custom('get_harvest_goddess')]祈祷，导弹被松开了。几秒钟后，雄伟的野兽倒在了地上--[ROOT.GetCountry.GetRuler.GetName]的箭射中了。走到动物身边，[ROOT.GetCountry.GetRuler.GetFirstName]又做了一个感恩的祷告。"
 zorgo_event.104.desc_11:0 "[ROOT.GetCountry.GetRuler.GetName]正在全速奔跑，[ROOT.GetCountry.GetRuler.GetHerHis]的呼吸猛然间逸出--在[ROOT.GetCountry.GetRuler.GetHerHim]的身后，一群饥饿的狼正在紧追不舍，似乎它们就要抓住它们的猎物了。[ROOT.GetCountry.GetRuler.GetFirstName]发现[ROOT.GetCountry.GetRuler.GetHerHim]自己正在向峡谷中翻滚，向悬崖的边缘跌落。头顶上传来下巴的断裂声和愤怒的嚎叫声，狼群跳了下来。[ROOT.GetCountry.GetRuler.GetFirstName]冲向悬崖，已经知道要做什么。几秒钟后，[ROOT.GetCountry.GetRuler.GetFirstName]像一只无重力的鸟儿一样在空中翱翔，在看似永恒的时间后溅入下面的河流。在高处，狼群发出沮丧的嚎叫，[ROOT.GetCountry.GetRuler.GetFirstName]飘离了危险，喘息着，惊恐着，但还活着。"
 zorgo_event.104.desc_12:0 "在一次成功的郊游之后，大家都回到了营地，谈论的话题不可避免地转向了谁是最幸运和最好的猎人。根据大家的计算，[ROOT.GetCountry.GetRuler.GetName]名列前茅，捕获了三只雄鹿--看来[ROOT.GetCountry.Custom('get_harvest_goddess')]希望[ROOT.GetCountry.GetRuler.GetTitleName]今天能获得最大的荣耀。"
 zorgo_event.104.desc_13:0 "营地里的每个人都情绪低落，独自在帐篷里吃饭--经过一天的悲惨事件，谁能责怪他们呢？不幸的是，[ROOT.GetCountry.GetRuler.GetName]似乎想惩罚[ROOT.GetCountry.Custom('get_harvest_goddess')]，因为对发生的事情没有合理的解释。一群狼袭击了[ROOT.GetCountry.GetRuler.GetFirstName]，野蛮地攻击了[ROOT.GetCountry.GetRuler.GetHerHis]的脸，几乎把[ROOT.GetCountry.GetRuler.GetHerHim]拖垮了。[ROOT.GetCountry.GetRuler.GetFirstName]在袭击中幸存下来，但不是没有失去[ROOT.GetCountry.GetRuler.GetHerHis]的眼睛。"
 zorgo_event.104.desc_14:0 "[ROOT.GetCountry.GetRuler.GetName]正悄悄地跟在一头雄鹿后面，拔出箭，注意力完全集中在[ROOT.GetCountry.GetRuler.GetHerHim]前面的动物身上。在[ROOT.GetCountry.GetRuler.GetFirstName]身后几英尺处，[SCOPE.sCharacter('random_dude_hunter').GetName]也在跟着，森林里唯一的声音是一条小溪繁忙的淙淙声。雄鹿没有意识到它所处的致命危险，正平静地拍打着溪水，而[ROOT.GetCountry.GetRuler.GetFirstName]蹲在那里，离向[ROOT.GetCountry.GetRuler.GetHerHis]的猎物开枪还有一会儿。"
 zorgo_event.104.desc_2:0 "[ROOT.GetCountry.GetRuler.GetName]花了大半天的时间，在后山茂密而纠结的灌木丛中爬行，在森林深处花了无数个小时，却一无所获。可笑的是，[ROOT.GetCountry.GetRuler.GetSheHe]甚至设法以某种方式与其他人走散，并很快迷失了方向--在[ROOT.GetCountry.GetRuler.GetFirstName]设法与其他猎人重新联系上之前，黄昏已经变成了夜晚，他们正在拼命地寻找[ROOT.GetCountry.GetRuler.GetTitleName]。"
 zorgo_event.104.desc_3:0 "每个在场的人都可以证明，那天[ROOT.GetCountry.Custom('get_harvest_goddess')]真的和[ROOT.GetCountry.GetRuler.GetName]在一起，因为在[SCOPE.sP('randomized_country_province').GetName]的黑暗森林中追踪和寻找动物时，没有人像他那样幸运。[ROOT.GetCountry.GetRuler.GetFirstName]能够打倒一只大鹿，如果不是[ROOT.GetCountry.GetRuler.GetHerHis]幸运的瞄准，那么那天晚上没有人会有新鲜的东西吃。几个小时后，肚子里装满了烤鹿和浓烈的[ROOT.GetCountry.GetAdjective]酒，猎人们开始赞美他们的领袖，为[ROOT.GetCountry.GetRuler.GetFirstName]对[ROOT.GetCountry.GetName]的长期统治举杯。"
 zorgo_event.104.desc_4:0 "当[ROOT.GetCountry.GetRuler.GetName]的箭深深射入鹿的背部时，鹿发出了一声痛苦的吼叫，这只巨大的动物踉跄着倒在地上。冲过去，[ROOT.GetCountry.GetRuler.GetFirstName]给了它致命的一击，并开始为其他人大喊，为[ROOT.GetCountry.GetRuler.GetSheHe]刚刚杀死的生物的大小而大笑。当其他人看到[ROOT.GetCountry.GetRuler.GetFirstName]的成就时，他们会暗自羡慕，每个人都希望自己能得到[ROOT.GetCountry.Custom('get_harvest_goddess')]的祝福，得到这样一个值得夸耀的奖品。"
 zorgo_event.104.desc_5:0 "[ROOT.GetCountry.GetRuler.GetName]在湖边等了几个小时，眼睛扫视着地平线，寻找任何生命的迹象，但一整天都没有一只动物来到附近。当太阳穿过天空时，[ROOT.GetCountry.GetRuler.GetFirstName]越来越烦躁，诅咒[ROOT.GetCountry.GetRuler.GetHerHis]愚蠢的运气。狩猎以失败告终，[ROOT.GetCountry.GetRuler.GetSheHe]失望地回到营地。"
 zorgo_event.104.desc_6:0 "[ROOT.GetCountry.GetRuler.GetName]在一些灌木丛中爬行时，[ROOT.GetCountry.GetRuler.GetSheHe]突然听到一声巨大的吼叫--一只熊！[ROOT.GetCountry.GetRuler.GetFirstName]的腿被抓住了！在动物抓住[ROOT.GetCountry.GetRuler.GetFirstName]的腿之前，没有时间拔出武器，片刻之间，[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetTitleName]就在为[ROOT.GetCountry.GetRuler.GetHerHis]的生命而拼命。[ROOT.GetCountry.GetRuler.GetFirstName]幸存下来的唯一原因是其他猎人听到[ROOT.GetCountry.GetRuler.GetHerHis]的尖叫并赶了过来，但每个人都可以看到[ROOT.GetCountry.GetRuler.GetSheHe]受了重伤。"
 zorgo_event.104.desc_7:0 "当天晚上，当[ROOT.GetCountry.GetRuler.GetName]在营地醒来时，[ROOT.GetCountry.GetRuler.GetHerHis]的头被包扎着，[ROOT.GetCountry.GetRuler.GetSheHe]对那天的事情没有记忆。是[SCOPE.sCharacter('random_dude_hunter').GetName]不得不告诉[ROOT.GetCountry.GetRuler.GetFirstName]发生了什么。[ROOT.GetCountry.GetRuler.GetTitleName]你从马背上摔了下来，你的头真的撞得很厉害--感谢[ROOT.GetCountry.Custom('get_harvest_goddess')]你能醒来，因为我们以为你可能不会。"
 zorgo_event.104.desc_8:0 "自从[ROOT.GetCountry.GetRuler.GetName]最后一次见到其他人以来，已经过去了几个小时--[ROOT.GetCountry.GetRuler.GetSheHe]在森林深处，树冠完全挡住了阳光。当[ROOT.GetCountry.GetRuler.GetSheHe]在阴暗的黑暗中发现一间小木屋时，远处传来孤狼的哭声，一股寒意从[ROOT.GetCountry.GetRuler.GetFirstName]的脊背传来。抬起一只干瘪的手，她咯咯地笑着，没有牙齿。'我在等你，[ROOT.GetCountry.GetRuler.GetName]。给我一百个硬币，我将以[ROOT.GetCountry.Custom('get_harvest_goddess')]的名义祝福你。"
 zorgo_event.104.desc_9:0 "到目前为止，[ROOT.GetCountry.GetRuler.GetName]还没能抓到任何东西，他花了更多的时间来找回没有击中目标的箭，而不是其他。这一天看起来很失败，但尽管结果令人失望，当[ROOT.GetCountry.GetRuler.GetFirstName]返回营地时，[ROOT.GetCountry.GetRuler.GetSheHe]的心情还算不错。[ROOT.GetCountry.GetRuler.GetFirstName]在穿过一个阴暗的峡谷时，[ROOT.GetCountry.GetRuler.GetSheHe]有了一个惊人的发现--在一片阳光下，闪烁着黄金的光芒!这里有一个破碎的安瓿瓶，里面有一笔小小的财富。"
 zorgo_event.104.e:0 "所以有时会这样..."
 zorgo_event.104.f:0 "水......咳......谁给我拿水来？"
 zorgo_event.104.g:0 "好家伙，真够险的！"
 zorgo_event.104.h:0 "给我你的祝福，然后我就上路了"
 zorgo_event.104.i:0 "多么令人难以置信的发现!"
 zorgo_event.104.j:0 "你赐给你的仆人多么荣耀的奖赏--我感谢你"
 zorgo_event.104.k:0 "唷......好险啊"
 zorgo_event.104.l:0 "也许下一次，其他人都会做得更好"
 zorgo_event.104.m:0 "这是一场悲剧，是一场灾难!"
 zorgo_event.104.n:0 "怎么会这样呢……"
 zorgo_event.104.t:0 "狩猎：在森林深处"
 zorgo_event.105.a:0 "终于又回家了--谢谢你邀请我，伙计们"
 zorgo_event.105.b:0 "我为有这样忠诚和热爱的同胞而感到无比幸运"
 zorgo_event.105.c:0 "如果你有任何其他问题，[SCOPE.sCharacter('random_dude_hunter_2').GetFirstName]，请随时提出。"
 zorgo_event.105.d:0 "哦，不......这不可能!"
 zorgo_event.105.desc_1:0 "每个人都带着体面的心情骑马回家[ROOT.GetCountry.GetCapital.GetName]，在路上享受着片刻的沉默，没过多久，远处就能看到首都的大门了。"
 zorgo_event.105.desc_2:0 "回到[ROOT.GetCountry.GetCapital.GetName]家的旅程并不顺利，甚至有些愉快--一路上天气很好，当[SCOPE.sP('randomized_country_province').GetName]经过他们的村庄时，[ROOT.GetCountry.GetRuler.GetName]的当地人都出来挥手欢呼。当晚，[ROOT.GetCountry.GetRuler.GetFirstName]感觉很愉快，很高兴扮演[ROOT.GetCountry.GetRuler.GetTitleName]的角色，当[ROOT.GetCountry.GetRuler.GetSheHe]骑马经过时，他花时间向[ROOT.GetCountry.GetName]的市民问好。这是结束狩猎之旅的完美方式，也是[ROOT.GetCountry.GetRuler.GetFirstName]开始恢复[ROOT.GetCountry.GetRuler.GetHerHis]官方职责的一种温和方式。"
 zorgo_event.105.desc_3:0 "当一行人向[ROOT.GetCountry.GetCapital.GetName]的家走去时，[SCOPE.sCharacter('random_dude_hunter_2').GetName]和[ROOT.GetCountry.GetRuler.GetName]之间的谈话转向了治理问题，因为[SCOPE.sCharacter('random_dude_hunter_2').GetFirstName]对所有与管理[ROOT.GetCountry.GetAdjective]州有关的事情感兴趣，这不是什么秘密。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]更乐意放纵详细谈话的要求，那些观看两人讨论的人可以看到他们之间的友谊纽带越来越强。"
 zorgo_event.105.desc_4:0 "在返回[ROOT.GetCountry.GetCapital.GetName]的路上一切都很顺利，直到夜幕降临，由于离首都如此之近，每个人都放松了警惕，没有人真正注意到。没有任何警告，一队强盗向猎人扑来，虽然战士们战胜了强盗，赶走了他们，但却付出了巨大的代价--那里，躺在街上的是[SCOPE.sCharacter('random_dude_hunter').GetName]的尸体，浑身是血。"
 zorgo_event.105.t:0 "出猎：回家"
 zorgo_event.106.a:0 "我应该感谢[ROOT.GetCountry.Custom('get_harvest_goddess')]把我安全地带回家。"
 zorgo_event.106.desc:0 "[ROOT.GetCountry.GetRuler.GetName]已经回到了[ROOT.GetCountry.GetCapital.GetName]，几天之内，所有的礼貌社会都听说了旅途中发生的一切--当然，这也在意料之中。尽管如此，尽管猎人们的舌头在摇晃，[ROOT.GetCountry.GetRuler.GetFirstName]并没有太难过，当[ROOT.GetCountry.GetRuler.GetHerHis]的奴隶开始加热水时，他的心情很宽松。一个多小时后，[ROOT.GetCountry.GetRuler.GetFirstName]正在[ROOT.GetCountry.GetRuler.GetHerHis]的私人房间里享受热水澡和一杯酒，思考着上个月的事件。"
 zorgo_event.106.t:0 "狩猎行动：结论"
 zorgo_event.107.a:0 "这是令人沮丧的..."
 zorgo_event.107.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们很遗憾地通知你，我们从[ROOT.GetCountry.GetName]派出的一些信使在从[ROOT.GetCountry.GetCapital.GetName]出来的路上被强盗袭击了。感谢你，我们的外交官在袭击中幸存下来，但他们现在对旅行感到恐惧，这是可以理解的。"
 zorgo_event.107.t:0 "外交官被袭击"
 zorgo_event.108.a:0 "我活着就是为了服务人民"
 zorgo_event.108.desc:0 "每个人都承认，[ROOT.GetCountry.GetRuler.GetName]是一个无可争议的谈判大师，能够屈服于外交官的耳朵，以达到我们[ROOT.GetCountry.GetRuler.GetHerHis]的目的。诚然，我们的[ROOT.GetCountry.GetName]以前从未有如此娴熟的政治家作为领导人。"
 zorgo_event.108.t:0 "外交大师"
 zorgo_event.109.a:0 "他们说，迟到总比不到好......"
 zorgo_event.109.desc:0 "我们很高兴地告诉你，我们收到了一些被拖欠的税款。虽然我们对花了这么长时间才收到属于我们的东西感到遗憾，但至少我们的公民意识到了他们对[ROOT.GetCountry.GetAdjective]州的欠款。"
 zorgo_event.109.t:0 "偿还旧债"
 zorgo_event.11.a:0 "够了够了——禁止穿丝绸衣服一年。"
 zorgo_event.11.b:0 "呸！我有更重要的事情要担心……别烦我。"
 zorgo_event.11.desc:0 "尽管 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 以享受生活中更好的东西而闻名，但最近，[SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] 还是对社会中越来越多的争奇斗富的迹象感到不安。我们有太多的贵族把钱财花在进口丝绸服装上，因为其薄如蝉翼，口语上被称为“风的织物”，街上到处都是花时间谈论奢侈品的花花公子，这当然不是 [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] 的美德。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 一直在考虑限制这些无聊的事情，但他也很清楚可能会遭到某些贵族的反对。"
 zorgo_event.11.t:0 "风的织物"
 zorgo_event.110.a:0 "我每年都期待着这个活动"
 zorgo_event.110.desc:0 "每五年在[ROOT.GetCountry.GetCapital.GetName]举行一次的献给[ROOT.GetCountry.Custom('get_harvest_goddess')]的节日已经接近尾声，那些前往首都参加庆祝活动的人一直在不停地赞美[ROOT.GetCountry.GetRuler.GetName]的慷慨。今年的收成非常壮观，我们田地的丰收与每个人分享。我们的人民带着他们的心和肚子回家，赞美神灵和[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRulerTitle]。"
 zorgo_event.110.t:0 "[ROOT.GetCountry.GetCapital.GetName]的谈话"
 zorgo_event.111.a:0 "我们必须祈祷，并看看有何事会发生"
 zorgo_event.111.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了一份令人不安的报告——我们附近[ROOT.GetCountry.GetCapital.GetName]的圣井中的水正在枯竭。\n\n这对于[ROOT.GetCountry.GetAdjective]的人民是一个可怕的预兆，这件事很快就四散传播开来......我很抱歉，看来我们不知为何惹怒了神明。"
 zorgo_event.111.t:0 "圣井缺水"
 zorgo_event.112.a:0 "这是一个我所做的事情是正确的迹象"
 zorgo_event.112.desc:0 "我的[ROOT.GetCountry.GetRulerTitle]，您不会相信在[ROOT.GetCountry.GetCapital.GetName]附近发生了什么！看来我们人民珍爱的圣井正在满溢——水无法被控制，不断地涌出。\n\n人民欣喜若狂！在[ROOT.GetCountry.GetName]从未发生过这样的事情——这可能意味着什么呢？"
 zorgo_event.112.t:0 "圣井满溢"
 zorgo_event.113.a:0 "当然我们会处理这个问题！"
 zorgo_event.113.b:0 "恐怕我们没有预算来处理这个问题"
 zorgo_event.113.desc:0 "在[ROOT.GetCountry.GetCapital.GetName]附近的当地人报告说，离首都最近的努拉格显示出明显的损坏迹象，较大的裂缝威胁到永久性损坏结构。\n\n人们请求[ROOT.GetCountry.GetRuler.GetName]尽一切可能解决这个问题——如果我们对此事置之不理，这被视为对[ROOT.GetCountry.Custom('get_harvest_goddess')]的不敬。"
 zorgo_event.113.t:0 "受损的努拉格需要修复"
 zorgo_event.114.a:0 "这是我的职责，我期待着——我们黎明出发"
 zorgo_event.114.b:0 "不幸的是，我现在太忙了，没时间处理这件事"
 zorgo_event.114.desc:0 "有人提议[ROOT.GetCountry.GetRuler.GetName]访问战士之神和农田保护者#E Sid Addir#!的神庙。Sid Addir必须接受[ROOT.GetCountry.GetAdjective]人民的供奉，以确保我们在未来的岁月里得到祝福。\n\n如此重要的责任属于[ROOT.GetCountry.GetRuler.GetFirstName]，所有人的目光都集中在[ROOT.GetCountry.GetRuler.GetHerHim]身上。"
 zorgo_event.114.t:0 "访问Sid Addir神庙"
 zorgo_event.115.a:0 "我们将留下一个奉献供品并祈求祝福"
 zorgo_event.115.b:0 "此刻，我们无法负担在这里留下礼物"
 zorgo_event.115.desc:0 "经过短短一周的旅行，[ROOT.GetCountry.GetRuler.GetName]终于到达了[ROOT.GetCountry.GetName]最古老和神圣的地方之一——Sid Addir的神庙。\n\n在仪式上净化了[ROOT.GetCountry.GetRuler.GetHerHim]自己之后，[ROOT.GetCountry.GetRulerTitle]进入了Sid Addir的神殿，并在里面默默沉思了几个小时。\n\n当太阳开始在远处的树线上隐没时，[ROOT.GetCountry.GetRuler.GetFirstName]走出神庙，发现外面有几位祭司，他们的存在显然是有意安排的，并立刻明白了。"
 zorgo_event.115.t:0 "Sid Addir神庙"
 zorgo_event.116.a:0 "快，把这一切都记下来。"
 zorgo_event.116.desc:0 "在劫掠[GetProvince('(int32)84').GetName]时，我们的一些士兵偶然遇到一个老人，他在沙地上画了一些符号，并恳切地喊道‘不要打扰我的圈子’。有些人说他是天才数学家阿基米德，但也有些人表示怀疑。不过，这件事似乎足够有趣，让我们的士兵在一天结束时记住了它。"
 zorgo_event.116.t:0 "打扰了他的圈子"
 zorgo_event.117.a:0 "带我们的妇女回家！"
 zorgo_event.117.b:0 "她们已经成为罗马人，不再是萨宾人。"
 zorgo_event.117.desc:0 "几代人以前，罗马人背信弃义地抢走了我们的妇女。今天，这座城市已被我们的士兵攻陷，许多人已经开始掠夺这个地方。其中一些人走近我们，要求我们带我们的后裔回到[ROOT.GetCountry.GetCapital.GetName]。然而，另一些人认为时间已经过去太久，他们的后裔现在已经是罗马人了。"
 zorgo_event.117.t:0 "罗马的掠夺"
 zorgo_event.118.a:0 "请Izn加入我的宫廷，因为我们都应该向他的智慧学习"
 zorgo_event.118.b:0 "也许这位智者在离开前能教我一些东西？"
 zorgo_event.118.c:0 "如果他试图离开边境，就逮捕他"
 zorgo_event.118.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了当地治安官的报告，您应该听听；上周，我们的边防卫兵遇到了一位著名的苦行僧，他正离开[ROOT.GetCountry.GetCapital.GetName]去朝圣，前往[GetCountry('MRY').GetAdjective]的圣地，身后跟随着数百人。\n\n这位名叫[SCOPE.sCharacter('izn_divine_scholar').GetName]的圣人，以其虔诚闻名于[ROOT.GetCountry.GetName]，据说他离开[ROOT.GetCountry.GetCapital.GetName]是为了研究[ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName]的多种宗教，期望找到普遍的真理，但有一个小问题；[SCOPE.sCharacter('izn_divine_scholar').GetFirstName]深受我们首都市民的爱戴，他们不希望看到这位智者离开我们的国家，因此感到一阵悲伤。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]，也许您对此事有何看法？"
 zorgo_event.118.t:0 "神圣的学者"
 zorgo_event.12.a:0 "旅行是昂贵的，但能开阔心灵——我们应该去！"
 zorgo_event.12.b:0 "我太忙了，没有时间去参观，但听到这个消息我很兴奋。"
 zorgo_event.12.desc:0 "我们听说在 [GetProvince('(int32)3256').GetName] 的巨港将举行盛大的揭幕仪式。由于港区最近已经完成了一些翻新，建筑师急于展示他们最新建造的成果。只有最有声望的家庭被邀请参加展览，这自然包括 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] 全社会的精英都会出席，而且很快就会成为今年最受关注的事件。\n\n虽然被邀请是一种巨大的荣誉，但旅行会产生相关的费用；这取决于你，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]。人民当然希望他们的领导者出席，但我们的国库能负担的起吗？"
 zorgo_event.12.t:0 "巨港展会"
 zorgo_event.13.a:0 "没有女神我们算什么？虽然很肉疼，但还是准备钱财吧。"
 zorgo_event.13.b:0 "我不在乎我答应了什么，我们负担不起。"
 zorgo_event.13.desc:0 "每五年，所有祭祀善良的塔尼特女神的国家都有义务送一份礼物到她在 [GetProvince('(int32)3256').GetName] 的神庙。这是一个历史悠久的传统，我们的人民也非常乐意接受这一传统。\n\n随着仪式的临近，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 已被 [SCOPE.sCharacter('jerk').GetName] 提醒，我们上次没有派送贡品，由于一些财政困难，只得延期。这很不幸，但如果我们想继续得到女神的青睐，我们就必须把礼物所需的钱财翻倍。"
 zorgo_event.13.t:0 "献给塔尼特的礼物"
 zorgo_event.14.a:0 "我选择 [SCOPE.sCharacter('random_bro_2').GetName]。"
 zorgo_event.14.b:0 "显然 [SCOPE.sCharacter('random_bro').GetName] 更值得。"
 zorgo_event.14.c:0 "如果他们不停止争吵，就用流放来威胁他们。"
 zorgo_event.14.desc:0 "虽然我们尽量不打扰您，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，但有一件棘手事务需要您亲自处理。两名商人[SCOPE.sCharacter('random_bro').GetName]和[SCOPE.sCharacter('random_bro_2').GetName]，因[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]附近滨水地产发生了一场公开而难看的争吵，看来他们都想要同一批仓库来存放双耳陶罐。两人都是野心勃勃的商人，在公共场合互为竞争者；若不采取行动，这场口水战恐怕会升级为暴力。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]必须亲自裁断，而没有任何简单的解决办法，总有人注定会不满。"
 zorgo_event.14.t:0 "被迫介入贸易争端"
 zorgo_event.15.a:0 "众神守护我们，所以我们也要照料他们的庙宇。"
 zorgo_event.15.b:0 "我们已经给推罗人送了足够的什一税——不。"
 zorgo_event.15.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们在 [GetProvince('(int32)743').GetName] 收到了一个可怕的预兆。一场可怕的地震摧毁了美刻尔神庙，推罗的祭司们派使者去了所有的 [SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName] 城邦请求救济，以帮助修复受损的圣地。建筑的底座上有很大的裂缝，人们担心，除非立即开始施工，否则整个神庙可能会坍塌。\n\n虽然要钱从来不是什么受欢迎的消息，但众所周知美刻尔很照顾他的信徒——我们的公民知道将帮忙捐款也会很高兴。"
 zorgo_event.15.t:0 "修复美刻尔神庙"
 zorgo_event.16.a:0 "我们现在没有多余的钱。"
 zorgo_event.16.b:0 "那‘是’什么？！我以前从来没有见过这样的东西……我们需要它。"
 zorgo_event.16.desc:0 "我们当然听说过 [SCOPE.sCharacter('traveler').GetName] 的故事。[SCOPE.sCharacter('traveler').GetFirstName] 是一个勇敢的旅行者，他崇拜航海家汉诺，任何一个滨海的城市都听说这位大胆的旅行者已经开始着手航行，只有汉诺的笔记指引着他，[SCOPE.sCharacter('traveler').GetFirstName] 每年都要驶向海洋，在返回家园之前，他们会沿着非洲海岸走得越来越远，经常带回有着异国情调的商品出售和一些稀奇的故事。\n\n想象一下，当传说中的探险家经过 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，请求与 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 会面时，那会是多么震撼！看起来，就像汉诺一样，[SCOPE.sCharacter('traveler').GetFirstName] 遇到了可怕的大猩猩人的奇怪部落，如果我们负担得起，他们愿意和我们交换一件宝物。我们的人民一定很想亲眼看看这样的场面……"
 zorgo_event.16.t:0 "探险家归来"
 zorgo_event.17.a:0 "真有胆量……如果[SCOPE.sCharacter('pupil').GetFirstName]不改好，就威胁[SCOPE.sCharacter('pupil').GetHerHim]！"
 zorgo_event.17.b:0 "我哪管的了这个——请不要再来烦我了。"
 zorgo_event.17.desc:0 "[SCOPE.sCharacter('teacher').GetName] 已被委托辅导 [SCOPE.sCharacter('pupil').GetName]，[SCOPE.GetRootScope.GetCountry.GetRuler.GetCulture.GetName]；这是一项非常简单的任务，至少我们是这么认为的。而且指导一名贵族成员的报酬非常丰厚。不幸的是，[SCOPE.sCharacter('teacher').GetFirstName] 一直在抱怨 [SCOPE.sCharacter('pupil').GetFirstName] 在每天上课时完全不专心，经常在课堂上睡着。当 [SCOPE.sCharacter('teacher').GetFirstName] 温和地提醒 [SCOPE.sCharacter('pupil').GetFirstName] 要全神贯注时，这个被宠坏的孩子居然向老师扔了一杯酒，老师现在威胁要辞职！"
 zorgo_event.17.t:0 "走神的学生"
 zorgo_event.18.a:0 "我们不会卷入这件事——告诉海盗离开我们的海域！"
 zorgo_event.18.b:0 "买几个奴隶。"
 zorgo_event.18.c:0 "他们愿意卖多少，我们就买多少。"
 zorgo_event.18.desc:0 "我们得到消息说，一些海盗正在经过这一地区，他们船只的船舱里装满了被绑架的奴隶。这还不是全部；看来，这些袭击者正在被他们劫掠的人追击，而且，由于害怕被抓住，他们现在正试图摆脱他们的不义之财。\n\n据海盗首领，一个名叫 [SCOPE.sCharacter('pirate').GetName] 的无赖说，他们的敌人落后他们不到一天，所以时间至关重要。由于他们急于脱身，所以愿意向我们提供折扣价。如果我们和他们做生意的话。"
 zorgo_event.18.t:0 "港口的奴隶船"
 zorgo_event.19.a:0 "要是每个人都像我们一样认真对待自己的职责就好了……"
 zorgo_event.19.desc:0 "一天早上，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 正在寻找 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，他的继承人，却被告知他已经出海，与我们的海军一起训练航行演习。\n\n[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 听到这个消息很高兴，并希望其他人能注意到这种自我牺牲精神并效仿。"
 zorgo_event.19.t:0 "航行靠舵手"
 zorgo_event.2.a:0 "把雕像熔化，然后制造硬币——我可不怕什么古老的灵魂。"
 zorgo_event.2.b:0 "告诉 [SCOPE.sCharacter('priest').GetFirstName]，把它重新埋在同一个地方，并对其祭祀。"
 zorgo_event.2.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，一个农夫正在 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 附近的田里干活时发现了一个奇怪的物品；一个被遗忘已久的异教神的银质神像，上面覆盖着无法破译的奇怪符文。[SCOPE.sCharacter('priest').GetName] 是这方面的专家，他说一个恶毒的灵魂被困在这座小雕像里，我们无意中释放了一个诅咒。虽然 [SCOPE.sCharacter('priest').GetFirstName] 表示，这对我们的民众来说是一个可怕的预兆，但并不是所有人都相信这是坏运气。"
 zorgo_event.2.t:0 "奇妙的发现"
 zorgo_event.20.a:0 "我毫不犹豫地支持这样一项有价值的事业。"
 zorgo_event.20.desc:0 "一个著名的演说家，名叫 [SCOPE.sCharacter('orator').GetName]，已经到达 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，并悄悄地说 [SCOPE.sCharacter('orator').GetSheHe] 会很高兴有幸在 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 见证下进行公开演讲，特别是如果我们能给一个小小的捐赠就更好了。\n\n在意识到一个可遇不可求的机遇正好落在 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] 面前时，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 不再犹豫，准备工作立即开始。"
 zorgo_event.20.t:0 "著名的演说家"
 zorgo_event.21.a:0 "命令埋葬雕像并献上祭品"
 zorgo_event.21.b:0 "生一个大火，把神像融化，换取钱币"
 zorgo_event.21.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们听到了一个在[ROOT.GetCountry.GetCapital.GetName]流传的奇怪而令人不安的故事。似乎我们的一个公民在市中心竖起了一个巨大的#E 赫拉克勒斯#! 的铜像，几乎就在同时，一道闪电击中了基座，使金属制品坠落到地面。\n\n当然，所有人都将此视为[GetDeityDefinition('omen_jupiter').GetName|E]的不悦之兆，这位神祇正因我们罗马人的狂妄自大而降下惩罚。"
 zorgo_event.21.t:0 "来自木星的信号"
 zorgo_event.22.a:0 "我想我们在这个问题上没有真正的选择。"
 zorgo_event.22.b:0 "告诉人们要更努力地工作；我们不能放过这些硬币"
 zorgo_event.22.desc:0 "我们的建筑师报告说，[GetProvince('(int32)15').GetName]的港口开始出现淤塞的迹象，除非我们采取痛苦但必要的措施，开始疏浚水域，否则我们可能有一个长期的问题。即使是现在，码头上的劳工也不得不加倍努力工作，以使船只进出，很多时候，我们的水手最终不得不帮忙，他们开始抱怨。"
 zorgo_event.22.t:0 "奥斯蒂亚的港口"
 zorgo_event.23.a:0 "我将光荣地坐在审判席上，知道我不能赢"
 zorgo_event.23.b:0 "呃，看看谁会给我们最多的钱，然后站在他们一边。"
 zorgo_event.23.desc:0 "掩其无备，[SCOPE.sCharacter('random_dude_from_rome').GetName]和[SCOPE.sCharacter('random_dude_2_from_rome').GetName]都找上了[ROOT.GetCountry.GetRuler.GetName]，破坏了[ROOT.GetCountry.GetCapital.GetName]愉快下午的气氛。\n\n看来，[SCOPE.sCharacter('random_dude_from_rome').GetPraenomen]和[SCOPE.sCharacter('random_dude_2_from_rome').GetPraenomen]的家庭之间要举行婚礼，但关于嫁妆的争论已经造成了不可逆转的裂痕，除非我们进行调解，否则这个裂痕有可能蔓延到政治领域。现在，[SCOPE.sCharacter('random_dude_from_rome').GetFirstName]要求[ROOT.GetCountry.GetRuler.GetFirstName]同意听取这龌龊的细节，希望能通过一项谴责[SCOPE.sCharacter('random_dude_2_from_rome').GetFirstName]的决议。\n\n对我们来说，不幸的是，这个案子太引人注目了，无论我们如何裁决，#E 罗马#!的人民都会有强烈的意见。"
 zorgo_event.23.t:0 "贵族之间的争论"
 zorgo_event.24.a:0 "聘请最好的希腊家教和威胁[SCOPE.sCharacter('heir').GetFirstName]。"
 zorgo_event.24.b:0 "让孩子玩吧......有什么坏处呢？"
 zorgo_event.24.desc:0 "我们一直听到有人抱怨说，[SCOPE.sCharacter('heir').GetName]一直无视他的日常课程，避免学习希腊语法，而是骑着他最喜欢的马Ungula Fulgens到处跑。[SCOPE.sCharacter('heir').GetFirstName]即使在他年幼的时候，也以他的骑术能力而闻名--说实话，这个孩子比两倍于他年龄的男人还要好--[ROOT.GetCountry.GetRuler.GetName]很难责怪这个男孩想要一点刺激，但平民们开始抱怨，说应该为我们家族的成员设定一个更高标准。"
 zorgo_event.24.t:0 "一个懒惰的学生"
 zorgo_event.25.a:0 "多么令人高兴啊"
 zorgo_event.25.desc:0 "我们的人民与其他民族不同--无论命运或财富给他们带来什么，无论是战争和苦难时期，还是多年来的肥胖和过度，他们从未放弃神灵，不间断地进行赞美和感恩。我们应该为拥有这样虔诚的罗马公民而感到幸运，因为诸神对乡间发生的即兴庆祝活动感到高兴。"
 zorgo_event.25.t:0 "即兴的庆祝活动"
 zorgo_event.26.a:0 "我希望我们不必这样做，但我的手被绑住了"
 zorgo_event.26.b:0 "我绝不允许奴隶与自由人并肩作战"
 zorgo_event.26.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，如你所知，我们最近的战役让我们缺乏人手--我们不能让敌人发现这一事实，以免我们招致毁灭。在这一绝望的时刻，有人建议我们让一些奴隶服兵役。虽然这肯定违背了罗马的先例，但我们可能没有选择。人民会抱怨，我们的稳定会受到影响，但我们还有其他选择吗？"
 zorgo_event.26.t:0 "史无前例的措施"
 zorgo_event.27.a:0 "给予#Y Optimates#! 他们想要的东西。"
 zorgo_event.27.b:0 "我不会被有钱人阶层所欺负！\"！"
 zorgo_event.27.desc:0 "贵族们一直在推动修改我们的军事法律，认为我们在允许下层阶级参战方面过于放任。除了恢复服兵役的财富要求外，有人认为只有公民和贵族才应该被允许带领我们的部队作战。众所周知，下层阶级没有被授权通过观察神圣的鸡来获取吉祥物，而在不知道神的意志的情况下作战的想法大大刺激了我们社会中更保守的因素。"
 zorgo_event.27.t:0 "参议院中的紧张局势"
 zorgo_event.28.a:0 "作为惩罚，五年内不允许在晚餐时燃起篝火!"
 zorgo_event.28.b:0 "重新引入斩首行动，不放过任何肇事者"
 zorgo_event.28.desc:0 "我们很遗憾地通知你，o [ROOT.GetCountry.GetRuler.GetName]，我们的军队越来越喜欢掠夺他们所行进的外国领土，甚至不顾让当地人安静的命令。我们的将军们承认这是一个问题，但到目前为止，没有人愿意适当地惩罚这些士兵，以免叛变的精神占据了这些人。"
 zorgo_event.28.t:0 "纪律的瓦解"
 zorgo_event.29.a:0 "我可以接受以我自己为代价的笑话......这没什么大不了的"
 zorgo_event.29.b:0 "杀鸟，杀[SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName]!"
 zorgo_event.29.desc:0 "一天早上，一个名叫[SCOPE.sCharacter('random_talking_bird_merchant').GetName]的商人来到#E Palatine Hill#! ，提出了一个有趣的提议；只要花10个金币，他就愿意出售一只名叫'Mica Aurea'的会说话的乌鸦，一只被训练成唱赞歌的[ROOT.GetCountry.GetRuler.GetName]。被这个想法逗乐了，[ROOT.GetCountry.GetRuler.GetFirstName]同意在元老院里听一场演示。然而，过了一会儿，这只鸟开始大声叫起来，'[SCOPE.sCharacter('coruler_head_of_family').GetName]是罗马历史上最伟大的#E 康苏尔#! '--多尴尬啊！'！看来，[SCOPE.sCharacter('random_talking_bird_merchant').GetFirstName]教会了这只鸟说多个名字，现在这只小兽在大家面前羞辱了[ROOT.GetCountry.GetRuler.GetFirstName]!一波又一波的笑声在教廷里荡漾开来。"
 zorgo_event.29.t:0 "会说话的鸟"
 zorgo_event.3.a:0 "嗯……谢谢，我想想.....来，拿些金子来补偿你吧。"
 zorgo_event.3.b:0 "卫兵，用金枪鱼把这个白痴揍一顿，并把这俩货都扔到街上！"
 zorgo_event.3.c:0 "[SCOPE.sCharacter('dumbass').GetFirstName]，大半夜吵人睡觉，你特么是不是有病？"
 zorgo_event.3.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 正在 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] 床上熟睡。突然间，传来了巨大的尖叫声和家具破碎的声音。把 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 从 [SCOPE.GetRootScope.GetCountry.GetRuler.GetHerHis] 睡梦中拽出。几分钟后，寒光一闪，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 的卫兵把 [SCOPE.sCharacter('dumbass').GetName] 摁在地上。\n\n接下来发生的是一个如此荒谬且奇怪的故事，甚至有那么一会儿， [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 恍惚间觉得 [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] 还在做梦。但事实并非如此；看来 [SCOPE.sCharacter('dumbass').GetFirstName] 显然是个傻瓜，他在鱼市上买了一条巨大的金枪鱼，并把它带到 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 作为礼物。他是如何设法在半夜溜过卫兵的把守仍然是个谜。\n\n当被追问更多细节时，[SCOPE.sCharacter('dumbass').GetFirstName] 不断地哭诉着同样的故事——‘这是我所见过的最大的鱼，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，我必须把它送给您。我没有任何恶意，真的。’公平地说，在 [SCOPE.sCharacter('dumbass').GetHerHis] 的脚旁边真的有一条你所见过的最大的金枪鱼。"
 zorgo_event.3.t:0 "来自大海的馈赠"
 zorgo_event.30.a:0 "那是一个很接近的例子..."
 zorgo_event.30.desc:0 "我们在[ROOT.GetCountry.GetCapital.GetName]发现了一个武装家庭奴隶的阴谋，希望能推翻[ROOT.GetCountry.GetRuler.GetName]的政权。尽管这样一个愚蠢的梦想注定要失败，但这个阴谋处于后期阶段的事实非常令人担忧。在罗马#E Subura#! 地区郊区的一个安全屋里发现了大量的刀剑，看来攻击将在明天进行--我们勉强逃过一劫。#E Via Appia#! 现在充满了被钉死在十字架上的蠕动的尸体，对任何心中持有背叛想法的人都是致命的提醒。"
 zorgo_event.30.t:0 "阻止奴隶起义"
 zorgo_event.31.a:0 "诅咒！封锁港口，直到病痛消失"
 zorgo_event.31.desc:0 "有传言说沿海地区爆发了夸特热，毫无疑问是由外国商人带到了我们的海岸。感谢我们的[GetOffice('office_apothecary').GetCulturalName(ROOT.GetCharacter.GetCountry)]，[SCOPE.sCharacter('apothecary').GetName]，主动抓住了[SCOPE.sCharacter('apothecary').GetHerHis]，并下令不允许任何人离开这个地区，但平民对[ROOT.GetCountry.GetRuler.GetName]没有保护他们感到不满。"
 zorgo_event.31.t:0 "夸父热"
 zorgo_event.32.a:0 "我不知道你在做什么，但别忘了我......"
 zorgo_event.32.desc:0 "[ROOT.GetCountry.GetCapital.GetName]的每个人都知道[SCOPE.sCharacter('random_house_head').GetName]试图利用他们的家族关系来购买政治权力；似乎每个人，从最低级的保镖到大家族的首领，都从[SCOPE.sCharacter('random_house_head').GetFirstName]的钱包里收到过贿赂。想象一下，当[ROOT.GetCountry.GetRuler.GetName]把[SCOPE.sCharacter('random_house_head').GetHerHim]召到首都要求分钱时，[SCOPE.sCharacter('random_house_head').GetFirstName]的反感"
 zorgo_event.32.t:0 "玩弄政治的代价"
 zorgo_event.33.a:0 "这是一个巨大的礼物--我们是相当幸运的！"
 zorgo_event.33.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们收到了一份来自外国国王的奇特礼物，这个国王希望保持匿名。每个人都知道[ROOT.GetCountry.GetName]的人民是多么重视知识，因为我们已经获得了作为地球一角最聪明的人的声誉，所以收到两个在修辞和数学艺术方面训练有素的外国奴隶的礼物是一个惊喜。[ROOT.GetCountry.GetRuler.GetFirstName]收到了一个简单的信息；'我们希望这些博学的导师能够帮助[ROOT.GetCountry.GetAdjective]的人民在他们高贵的追求中获得智慧。Signed, A Friend'."
 zorgo_event.33.t:0 "知识的礼物"
 zorgo_event.34.a:0 "不必大惊小怪，我自己会付盘子的钱。"
 zorgo_event.34.b:0 "打破[SCOPE.sCharacter('random_dinner_host').GetFirstName]的所有其他菜品的贪婪。"
 zorgo_event.34.c:0 "如此严重的错误需要死亡!请允许我的荣幸"
 zorgo_event.34.desc:0 "[ROOT.GetCountry.GetRuler.GetName]今天的心情已经很糟糕了，因为不得不参加一个[ROOT.GetCountry.GetRuler.GetSheHe]无法脱身的宴会而感到恼怒，事件发生时，他正在大口喝酒来打发时间。\n\n在第三道菜的中途，一个笨拙的仆人，一个叫[SCOPE.sCharacter('random_baker').GetName]的人，失足绊倒，掉落了一个昂贵的水晶壶，碎成了无数块。主人，[SCOPE.sCharacter('random_dinner_host').GetName]，站了起来，脸色血红，怒气冲冲，要求当着大家的面打[SCOPE.sCharacter('random_baker').GetFirstName]。\n\n所有的目光都期待地转向[ROOT.GetCountry.GetRuler.GetFirstName]，[ROOT.GetCountry.GetRuler.GetHerHis]不由自主地站了起来。"
 zorgo_event.34.t:0 "盛宴上的尴尬"
 zorgo_event.35.a:0 "没有切实的证据，我拒绝参与其中"
 zorgo_event.35.b:0 "用流放来威胁[SCOPE.sCharacter('heir').GetFirstName]，并花钱请人监视他。"
 zorgo_event.35.desc:0 "虽然我们尽力不拿小问题来麻烦你，但每个人都同意你必须对[SCOPE.sCharacter('heir').GetName]做些什么。最近，[SCOPE.sCharacter('heir').GetFirstName]一直在与不怀好意的人交往，比如来自我们敌人的土地上的外国出生的商人，他们用烈酒和愚蠢的梦想灌输他的头脑。甚至有人说，有人在闲聊，说要把[SCOPE.sCharacter('heir').GetFirstName]推上[ROOT.GetCountry.GetName]的宝座，考虑到[SCOPE.sCharacter('heir').GetSheHe]是#E retender#!，这件事有可能会爆发出来。我们应该怎么做，如果有的话？"
 zorgo_event.35.t:0 "一个人的陪伴"
 zorgo_event.36.a:0 "也许你会留在这里，[SCOPE.sCharacter('typhion').GetFirstName]，并把你的剑臂借给我们？"
 zorgo_event.36.b:0 "支付他们所要求的费用，并在早上将他们送走。"
 zorgo_event.36.c:0 "现在就把这个外国人赶走，什么都不给他"
 zorgo_event.36.desc:0 "今天清晨，一队衣着怪异的战士在一个名叫[SCOPE.sCharacter('typhion').GetName]的人带领下走到[ROOT.GetCountry.GetCapital.GetName]的大门口，要求允许他们在我们的市场购买物资。当被问及他们的资金是否充足时，他们羞涩地回答说他们一贫如洗，但如果价格合适的话，他们愿意拿出一笔财富。感觉到这个家伙身上有一种伟大的光环，[ROOT.GetCountry.GetRuler.GetName]要求[SCOPE.sCharacter('typhion').GetFirstName]进行私人会面，希望听到这些流浪者的故事。\n\n尽管这些沉默寡言的战士不愿意被我们的[ROOT.GetCountry.GetRuler.GetTitleName]接纳，但在分享了几杯酒和提供了面包和肉之后，一个奇怪的故事出现了。\n\n作为一个小孩子，[SCOPE.sCharacter('typhion').GetFirstName]被来自#E 厄部罗尼亚#!的突袭者抓住并被卖为奴隶，最后在[GetProvince('(int32)84').GetName]被赋予希腊名字 \"Typhon\"。被训练成保镖后，泰丰与他的主人一起航行到远东，在那里停留了十年之久。他甚至声称去过世界边缘的岛屿，一个被称为#E Wa#!的地方。\n\n正是在东方，Typhon得到了一把被称为#Y 风之剑#!的刀，虽然他说话时脸色发紧，但他还是把它卖了——“我不能看到我的人饿死……他们的生命对我来说比这件神器更有价值。”"
 zorgo_event.36.t:0 "渴望世界的冒险家"
 zorgo_event.37.a:0 "给当地人发工资，让他们工作以恢复公路"
 zorgo_event.37.desc:0 "今天我们有一个坏消息，[ROOT.GetCountry.GetRuler.GetName]；我们一定是激怒了风暴之神，因为在过去的一周里，呼啸的风和雨是无情的，只给[ROOT.GetCountry.GetName]的人们带来了痛苦和坏情绪。对我们来说，不幸的是，天气是如此糟糕，通往[ROOT.GetCountry.GetCapital.GetName]的道路都被冲毁了，现在进入我们首都的交通已经慢到了停滞。现在贸易几乎不存在，城市里的新鲜食物也开始耗尽......至少每个人都有水，对吗？"
 zorgo_event.37.t:0 "被冲毁的道路"
 zorgo_event.38.a:0 "我有比警察道德更重要的事情要做"
 zorgo_event.38.b:0 "公开信的内容，迫使他们离婚"
 zorgo_event.38.c:0 "勒索恋人......但谁给我寄来了这个？"
 zorgo_event.38.desc:0 "最近，一封被截获的信被匿名传给了[ROOT.GetCountry.GetRuler.GetName]，他毫不犹豫地阅读了信的内容。[ROOT.GetCountry.GetRuler.GetFirstName]本以为是叛国阴谋的细节，却惊愕地发现了一封热情洋溢的情书--一封由[SCOPE.sCharacter('random_adulterer').GetName]写给[SCOPE.sCharacter('random_adulteress').GetName]的情书。通常情况下，这封信会被忽略，但不幸的是，[SCOPE.sCharacter('random_adulterer').GetFirstName]和[SCOPE.sCharacter('random_adulteress').GetFirstName]已经和其他人结婚了。如果这件事被传出去，整个[ROOT.GetCountry.GetAdjective]社会都会有反响。"
 zorgo_event.38.t:0 "请求自由裁量权"
 zorgo_event.39.a:0 "把他们带回来的东西都给他们"
 zorgo_event.39.b:0 "为[ROOT.GetCountry.GetName]而战已经是一种特权了"
 zorgo_event.39.desc:0 "最近，一个关于我们士兵的故事像野火一样传播开来，它具有近乎神话般的地位，只会加强[ROOT.GetCountry.GetAdjective]在战斗中的优势。在我们最近的一次交战中，[ROOT.GetCountry.GetCapital.GetName]的军队被敌人包围了，尽管我们的部队人数是7比1，但我们的战士实际上打败了敌人，分散了他们的敌人，夺取了他们的行李车。\带着掠夺和战利品回到营地时，我们的一个人大胆地要求将战斗中的战利品作为捐赠品发放出去--这是一种继续战斗的激励。"
 zorgo_event.39.t:0 "著名的征税人"
 zorgo_event.4.a:0 "你可以坐在我后面，但是保持安静，不要着急。"
 zorgo_event.4.b:0 "总有一天你会有足够的时间自行学到的。"
 zorgo_event.4.desc:0 "最近，[SCOPE.sCharacter('heir').GetName] 几乎每天都会向 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName] 提出请求，这一直纠缠着 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]，一直忽略也不是个事儿。[SCOPE.sCharacter('heir').GetFirstName] 的请求很简单，只是有点尴尬；[SCOPE.sCharacter('heir').GetSheHe]  想要一个观察 [SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 在下一次元老院会议表现的机会。由于对政治事务有些缺乏经验，可以这么说，[SCOPE.sCharacter('heir').GetFirstName] 想要看‘政治大师’面对事务时如何处理，并借此学习如何与顾问打交道。"
 zorgo_event.4.t:0 "观摩大师"
 zorgo_event.40.a:0 "混蛋们！我们将追捕那些责任人..."
 zorgo_event.40.desc:0 "说实话，[ROOT.GetCountry.GetRuler.GetName]，我们甚至不清楚最近在[ROOT.GetCountry.GetCapital.GetName]的街道上发生了什么；有传言说，两个店主之间的争吵失去了控制，在所有人都能阻止它之前，一场大规模的争吵爆发了。当然，有几个人在战斗中不幸死亡，但更糟糕的是由失败一方引发的火灾。虽然我们能够比较迅速地扑灭火焰，但[ROOT.GetCountry.GetCapital.GetName]的一个居民区还是被烧成了灰烬。"
 zorgo_event.40.t:0 "首都的骚乱"
 zorgo_event.41.a:0 "呃......我不关心[SCOPE.sCharacter('random_dinner_host').GetPraenomen]或他受伤的感情。"
 zorgo_event.41.desc:0 "上周在[SCOPE.sCharacter('random_dinner_host').GetName]家举行的晚宴的影响仍在继续。在[ROOT.GetCountry.GetRuler.GetName]醉醺醺地下令打碎属于这个家庭的每一个餐具后，[SCOPE.sCharacter('random_dinner_host').GetFirstName]似乎一直在怀恨在心，现在正公开地与我们的敌人交好。"
 zorgo_event.41.t:0 "胆汁淤积"
 zorgo_event.42.a:0 "警卫！救命啊，我被攻击了！"
 zorgo_event.42.b:0 "太晚了......Typhon正在逃跑......。"
 zorgo_event.42.c:0 "我将割断绳子，看着这个小偷落入他们的厄运。"
 zorgo_event.42.desc:0 "[ROOT.GetCountry.GetRuler.GetName]正沉浸在梦中时，巨大的金属撞击声和一声低沉的咒骂声夺去了[ROOT.GetCountry.GetRuler.GetHerHis]眼中的睡意。[ROOT.GetCountry.GetRuler.GetFirstName]摸索着伸手去拿靠近床边的一把匕首，跌跌撞撞地站起来。在房间靠窗的角落里，一个朦胧的身影正准备爬下城墙。\n\n“你是谁？”[ROOT.GetCountry.GetRuler.GetFirstName]拼命地叫着。\n\n\"你不会以为我会让你留着我的剑吧？\"[SCOPE.sCharacter('typhion').GetName]讥讽道，“你根本不知道我为了得到这个经历了什么”\n\n残忍地笑着，[SCOPE.sCharacter('typhion').GetFirstName]抓起一个青铜花瓶扔向[ROOT.GetCountry.GetRuler.GetFirstName]，打在昏睡的[ROOT.GetCountry.GetRuler.GetTitleName]的脸上。“不要试图找到我......我们只有在冥界才会再见面。“ 就这样，Typhon从窗户里消失了。"
 zorgo_event.42.t:0 "黑夜中的盗贼"
 zorgo_event.43.a:0 "[ROOT.GetCountry.GetAdjective]信众的虔诚得到了回报！[ROOT.GetCountry.GetAdjective]信众的虔诚得到了回报！"
 zorgo_event.43.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，我们听到来自各省的报告，值得你注意。似乎有人看到一个当地的神，某个小神，在我们的王国里行走，触摸枯萎的葡萄树和休耕的田地，让它们恢复春天的红润。我们的人民已经与这个神圣的生物互动了几次，为这个神留下了枣糕和酒，反过来，这个神也祝福他们的收成，使他们富有成效。"
 zorgo_event.43.t:0 "仁慈的精神"
 zorgo_event.44.a:0 "听到这个肮脏的故事，我感到很恶心"
 zorgo_event.44.desc:0 "最近，[ROOT.GetCountry.GetCapital.GetName]的一些公民正在为自己建造房屋，但他们没有自己采石，而是决定拆除附近几座古墓，重新利用其中的帕罗斯大理石。此事本身并不值得一提，因为我们的人向来会使用旧建筑材料；真正值得一提的是他们在其中一座墓中发现的东西。\n\n虽然铭文已经褪色，但他们发现了一个金瓶，里面装着一位著名建筑师的骨灰——也许正是设计这片墓园的人——旁边还用多种语言写着警告。\n\n“不要惊扰我的遗骨，以免降临于我族的命运也毁灭你们。”\n\n[ROOT.GetCountry.GetRuler.GetName]听说此事后，[ROOT.GetCountry.GetRuler.GetSheHe]十分不安，要求将金瓶重新安葬，但它早已消失，没有人愿意承认它去了哪里。"
 zorgo_event.44.t:0 "请勿打扰我的骨头"
 zorgo_event.45.a:0 "我们不可能为这个付钱。"
 zorgo_event.45.b:0 "现在可能要花一点钱，但它将是值得的。"
 zorgo_event.45.desc:0 "最近，[ROOT.GetCountry.GetCapital.GetName]的一群相关公民带着请愿书找到了[ROOT.GetCountry.GetRuler.GetName]。在最近的一场大火几乎烧毁了首都之后，人们决定自己动手，开始组建夜间巡逻队，到目前为止，巡逻队在减少犯罪以及保护我们的家园免受火灾的致命威胁方面取得了成功。\对我们来说，不幸的是，他们要求国家正式补贴他们的努力；他们希望我们现在就装备志愿者，这并不便宜，并承诺在此基础上继续资助他们的倡议。没有人比你更了解我们的财政状况，[ROOT.GetCountry.GetRuler.GetFirstName]；选择权在你。"
 zorgo_event.45.t:0 "组织守夜人"
 zorgo_event.46.a:0 "派出我们最精锐的几支队伍来结束他们的恐怖活动"
 zorgo_event.46.b:0 "恐怕我们目前无法抽出人手。"
 zorgo_event.46.desc:0 "我们听说一些逃跑的奴隶正在组成团伙，联合他们的力量来报复曾经奴役他们的社会。这些强盗造成了相当大的混乱，在他们的身后留下了死亡和破坏的痕迹，据说他们甚至在我们的一个定居点建立了营地--他们对[ROOT.GetCountry.GetAdjective]法律表现出多么彻底的不尊重！[ROOT.GetCountry.GetRuler.GetName]的压力正在增加，要求他们做些什么。我们不会允许这些强盗在[ROOT.GetCountry.GetName]活动而不受惩罚，对吗？"
 zorgo_event.46.t:0 "匪徒营地"
 zorgo_event.47.a:0 "我将亲自带领我们的战士投入战斗"
 zorgo_event.47.b:0 "这种琐碎的任务应该委派给你；告诉我我们的胜利情况"
 zorgo_event.47.desc:0 "我们的侦察员已经追踪到强盗营地的位置，正在为攻击做最后的准备。强盗们比人们想象的要聪明，他们一直在袭击奴隶庄园，释放俘虏，扩大他们的数量。虽然我们期待着一场简单的小规模战斗，但所有的迹象都表明这是一场绝望的、激烈的战斗......奴隶们不会轻易交出他们的自由。"
 zorgo_event.47.t:0 "匪徒营地：战斗"
 zorgo_event.48.a:0 "诸神只给了我们我们能够承受的东西"
 zorgo_event.48.desc:0 "虽然战斗很危险，但[ROOT.GetCountry.GetName]的部队还是打退了奴隶乌合之众，彻底摧毁了任何站在原地作战的人。随着战局的扭转，大量的人投降了，并立即被戴上了镣铐--[ROOT.GetCountry.GetCapital.GetName]的奴隶市场将在两星期内满员。[ROOT.GetCountry.GetRuler.GetName]虽然英勇战斗，但[ROOT.GetCountry.GetRuler.GetSheHe]脸上挨了一矛，不幸地失去了一只眼睛。[ROOT.GetCountry.GetRuler.GetFirstName]为这一转折感到悲哀，发现强盗的宝藏只是稍微缓解了痛苦。"
 zorgo_event.48.t:0 "强盗营：凯旋而归"
 zorgo_event.49.a:0 "我的军队会击溃这些狗，这一点还有疑问吗？"
 zorgo_event.49.desc:0 "剿匪战役的消息![SCOPE.sCharacter('general_getting_recognition').GetName]被委托指挥我们的部队，并带领我们的人取得了胜利，粉碎了任何敢于站在战场上反对我们[ROOT.GetCountry.GetAdjective]征兵的人。[SCOPE.sCharacter('general_getting_recognition').GetFirstName]向[ROOT.GetCountry.GetRuler.GetName]递交了一份个人报告，详细介绍了这场战斗的精彩事件。[SCOPE.sCharacter('general_getting_recognition').GetFirstName]轰动一时的胜利的消息传开后，人们欣喜地听说[ROOT.GetCountry.GetName]拥有军事天才。"
 zorgo_event.49.t:0 "强盗营：凯旋而归"
 zorgo_event.5.a:0 "很高兴听到我们不缺食物——民众应该更高兴！"
 zorgo_event.5.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，今年的收成很好，我们甚至没有储藏小麦的地方了，因为在 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName] 附近建立的粮仓已经被挤满，根本没有空余地方储存现有的粮食了——我们只能在市场上出售多余的粮食。"
 zorgo_event.5.t:0 "满溢的粮仓"
 zorgo_event.50.a:0 "我爱你们中的每一个人!"
 zorgo_event.50.desc:0 "一天下午，[ROOT.GetCountry.GetRuler.GetName]在[ROOT.GetCountry.GetRuler.GetHerHis]的私人房间里休息，听着外面热闹的市场声音。很快，一天的最后一顿饭就要吃完了，街上到处都是购买食品的好[ROOT.GetCountry.GetAdjective]民。一个冲动的想法充满了[ROOT.GetCountry.GetRuler.GetFirstName]的头脑，片刻之后，[ROOT.GetCountry.GetRuler.GetSheHe]坐上了一辆战车的后面，向小巷走去，那里的小贩们正忙着叫卖。[ROOT.GetCountry.GetRuler.GetFirstName]深深地挖出一个钱袋，开始把一把把的金银扔到街上。一群人聚集在一起，向他们的[ROOT.GetCountry.GetRuler.GetTitleName]伸出双手，他们沾满污垢的脸上闪耀着纯粹的敬佩之情。"
 zorgo_event.50.t:0 "向人民洒下黄金"
 zorgo_event.51.a:0 "这听起来是一个可爱的想法......使它成为"
 zorgo_event.51.b:0 "是的，那是不可能的。我想要欠下国家的每一枚硬币!"
 zorgo_event.51.desc:0 "现在几乎是收缴上层阶级所欠税款的时候了，这在[ROOT.GetCountry.GetName]的历史上是一个不受欢迎的时期--这让[ROOT.GetCountry.GetRuler.GetName]很懊恼，他期待着获得一次性付款，但讨厌激怒有关系的人。当[ROOT.GetCountry.GetRuler.GetFirstName]正在查看税单时，一位顾问走上前来，清了清嗓子。你会因为宽恕所有这些累积的债务而大受欢迎，而且在我们的土地上有做这种事情的先例。"
 zorgo_event.51.t:0 "税收假期"
 zorgo_event.52.a:0 "我们根本负担不起，尽管这是个好主意。"
 zorgo_event.52.b:0 "奇妙的想法，[SCOPE.sCharacter('general_advisor').GetFirstName] - 它将被完成。"
 zorgo_event.52.desc:0 "[SCOPE.sCharacter('general_advisor').GetName]，以[SCOPE.sCharacter('general_advisor').GetHerHis]精湛的刀剑技艺闻名于整个 [ROOT.GetCountry.GetName]，曾请求 [ROOT.GetCountry.GetRuler.GetName] 考虑设立一个由国家资助的项目，专门训练贵族子弟的战争技艺。\n\n“据说在敌国的土地上，五岁的孩子便开始学习持武作战——我们的[ROOT.GetCountry.GetAdjective]子弟难道没有理由同样习得这项技能吗？”"
 zorgo_event.52.t:0 "为我们的青少年提供的军事训练营"
 zorgo_event.53.a:0 "很好，你可以跟着我们回家"
 zorgo_event.53.desc:0 "[ROOT.GetCountry.GetRuler.GetName]在一次成功狩猎后，正带着[ROOT.GetCountry.GetRuler.GetHerHis]小队随从返回[ROOT.GetCountry.GetCapital.GetName]，却在通往首都的十字路口遇到一个奇怪的人物。[SCOPE.sCharacter('dementive_sadhu').GetName]身穿简朴僧袍，闭目而坐，手中拿着一支小陶管。\n\n“Bom Shiva！”那人喊道，吐出一团浓烟。“终于，[ROOT.GetCountry.GetRuler.GetFirstName]，我们的道路交汇了。”老人站起身，深深鞠躬。“我跋涉多日才来到此地——我的神，湿婆大人，命令我向你效力。”\n\n[ROOT.GetCountry.GetRuler.GetFirstName]挥开潮湿的烟雾，挑起眉毛。“你的神派你来这里究竟有何目的？”\n\n[SCOPE.sCharacter('dementive_sadhu').GetFirstName]发出尖声大笑，眼中闪过一丝光亮。\n\n“这还有待观察，我的主君。”"
 zorgo_event.53.t:0 "处于十字路口的智者"
 zorgo_event.54.a:0 "...现在你知道为什么我被送到这里来了吧"
 zorgo_event.54.desc:0 "一天晚上，[ROOT.GetCountry.GetRuler.GetName]家的院子里出现了巨大的骚动--听起来像是在进行一场激烈的战斗!空气中充斥着垂死挣扎的惨叫声，其中还夹杂着金属的碰撞声。拿起一把剑和一件胸甲，[ROOT.GetCountry.GetRuler.GetFirstName]冲到街上去看发生了什么。让[ROOT.GetCountry.GetRuler.GetHerHis]吃惊的是，当[ROOT.GetCountry.GetRuler.GetSheHe]到达时，战斗已经结束。在那里，站在12个被杀的人的尸体上，自己完全没有受到影响的是[SCOPE.sCharacter('dementive_sadhu').GetName]，他向离他最近的尸体吐口水。[SCOPE.sCharacter('dementive_sadhu').GetFirstName]转向[ROOT.GetCountry.GetRuler.GetFirstName]，鞠躬并走过目瞪口呆的[ROOT.GetCountry.GetRuler.GetTitleName]，后者站在那里嘴角上扬。赞美湿婆，我是清醒的......"
 zorgo_event.54.t:0 "挫败的刺客"
 zorgo_event.55.a:0 "我们很感激我们有如此友好的声誉"
 zorgo_event.55.desc:0 "我们的国家[ROOT.GetCountry.GetName]是一个值得访问的好地方，[ROOT.GetCountry.GetCapital.GetName]是我们最令人印象深刻的地方，这句话正在广泛传播。我们[ROOT.GetCountry.GetAdjective]的好客是众所周知的，即使是那些在我们领域内没有业务的人也经常不顾一切地去拜访我们的首都。"
 zorgo_event.55.t:0 "值得一游的土地"
 zorgo_event.56.a:0 "我们目前无法承受这种情况"
 zorgo_event.56.b:0 "给予因陀罗他想要的东西--把他安排在我们的图书馆里"
 zorgo_event.56.desc:0 "[ROOT.GetCountry.GetRuler.GetName]，这可能会让你感到震惊，但我们在[ROOT.GetCountry.GetCapital.GetName]有一位访客，他穿越了地球的宽度，来到了你的法庭。虽然这个外国人，一个叫[SCOPE.sCharacter('shocky_cartographer').GetName]的人，不熟悉我们的语言，但他通过翻译与我们交流，告诉我们关于他自己和他的冒险。\他來自一個被稱為#E 馬爾代夫#! 的島嶼鏈，據說是在#E 印度#!的海岸邊，在過去的20年中，他一直在[ROOT.GetCountry.GetName]和他的家之間的每一個海洋中航行。因此，他擁有一些最詳細的地圖，這是所有製圖師都創造的，而他提供我們機會，讓我們的文員製作副本。如果我们同意他的费用，他将搬到[ROOT.GetCountry.GetCapital.GetName]，并立即开始与我们的人一起工作，尽管工作的完成需要一些时间。"
 zorgo_event.56.t:0 "一位著名的制图师"
 zorgo_event.57.a:0 "我们再也负担不起了......"
 zorgo_event.57.b:0 "值得庆幸的是，该州有很深的口袋"
 zorgo_event.57.c:0 "什么？我们就拿着因陀罗的地图，把他踢出[ROOT.GetCountry.GetName]。"
 zorgo_event.57.desc:0 "[SCOPE.sCharacter('shocky_cartographer').GetName]在[ROOT.GetCountry.GetCapital.GetName]工作期间，他被证明是一个快速学习的人，他轻松地学习了[ROOT.GetCountry.GetAdjective]语言的基础知识，这让[ROOT.GetCountry.GetRuler.GetName]印象深刻。他现在能够独立交流，这一壮举让所有关注他的人都印象深刻。不幸的是，他直接向我们要更多的钱--他说他需要更多的物资，但向我们保证，到目前为止完成的工作是一流的。"
 zorgo_event.57.t:0 "资金申请"
 zorgo_event.58.a:0 "我的人将为我报仇......"
 zorgo_event.58.desc:0 "'你在干什么？当你们的士兵强行进入他的房间时，[SCOPE.sCharacter('shocky_cartographer').GetName]问道。现在是半夜，但制图师仍然在努力工作--他的桌子上有一支小蜡烛在明亮地燃烧。[ROOT.GetCountry.GetRuler.GetName]上前一步，[ROOT.GetCountry.GetRuler.GetHerHis]的脸上露出坚定的表情。你被逮捕了，[SCOPE.sCharacter('shocky_cartographer').GetFirstName]。'逮捕？逮捕什么？这真是可笑！\"在[ROOT.GetCountry.GetRuler.GetFirstName]能做出反应之前，[SCOPE.sCharacter('shocky_cartographer').GetFirstName]将手伸进他的外衣，掏出一把匕首，向前猛冲，疯狂地砍去。刀刃深深地插入[ROOT.GetCountry.GetRuler.GetFirstName]的喉咙，立即杀死了[ROOT.GetCountry.GetRuler.GetHerHim]。"
 zorgo_event.58.t:0 "一个令人震惊的发展"
 zorgo_event.59.a:0 "英德拉......我被惊呆了。这些都是宏伟的!"
 zorgo_event.59.desc:0 "虽然自从我们第一次委托[SCOPE.sCharacter('shocky_cartographer').GetName]为我们制作地图以来，感觉已经过了很久，但这位博学的制图师告诉我们，他终于完成了，而且他亲自要求[ROOT.GetCountry.GetRuler.GetName]来看看[ROOT.GetCountry.GetRuler.GetHerHim]自己。[SCOPE.sCharacter('shocky_cartographer').GetFirstName]说得很隆重，向桌子上那堆卷轴上的河流和山脉的名字做了个手势。我很抱歉花了这么长的时间，但质量不能急于求成，尊敬的[ROOT.GetCountry.GetRuler.GetTitleName]。"
 zorgo_event.59.t:0 "因陀罗的地图"
 zorgo_event.6.a:0 "这听起来让人很恼火……永别了，[SCOPE.sCharacter('taxman').GetFirstName]。"
 zorgo_event.6.desc:0 "[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]，我们很遗憾地通知您，我们的一个税务官，一个名叫[SCOPE.sCharacter('taxman').GetName]的人，被发现在[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的街道上被刺死。\n\n每个人都声称[SCOPE.sCharacter('taxman').GetFirstName]是出了名的“手指头不干净”，从税金里偷走了比他工资还多的钱，虽然这可能是真的，但这个人是否应该就这样暴尸街头？现在，当地人拒绝告诉我们谁该为这起罪行负责，尽管我们的士兵一直威胁他们，如果他们一直不说话……这可不是什么好兆头。"
 zorgo_event.6.t:0 "税务官被谋杀"
 zorgo_event.60.a:0 "我期待着与[SCOPE.sCharacter('omega_corp_trainer').GetName]见面。"
 zorgo_event.60.desc:0 "有传言说，一个驻扎在[ROOT.GetCountry.GetCapital.GetName]的雇佣兵队长[SCOPE.sCharacter('omega_corp_trainer').GetName]在战场上取得了空前的成功，这是因为他亲自制定了不同寻常的军事战术。在每个战役季节结束时，[SCOPE.sCharacter('omega_corp_trainer').GetFirstName]的手下都会带着黄金和奴隶回家，而且看起来一点也不差--他们是如何做到这一点的？[ROOT.GetCountry.GetRuler.GetName]希望能亲自见到这样一位杰出的军事家，于是向这位雇佣兵发出邀请，让他在一周后与[ROOT.GetCountry.GetRuler.GetHerHim]共进晚餐。"
 zorgo_event.60.t:0 "一个战士和一个学者"
 zorgo_event.61.a:0 "我们现在无法承担这一费用"
 zorgo_event.61.b:0 "多么令人高兴的情况啊!当然，我们会买你的人"
 zorgo_event.61.desc:0 "所以你想知道我的秘密，是吗？[SCOPE.sCharacter('omega_corp_trainer').GetName]和[ROOT.GetCountry.GetRuler.GetName]之间的晚餐一直是一个轻松的事情，虽然在第一道菜中避免了今晚见面的原因，但当奴隶们给我们带来更多的酒和水果时，谈话转向了商业。我将做得更好，告诉你他们中最大的秘密。实际上，我正打算从雇佣兵服务中退休；是时候在家里放养我的羊群和抚养孩子了。如果你愿意付出代价，我将把我的精锐部队卖给你。你肯定听说过欧米茄军团吧？\"\"是的，我听说过。[ROOT.GetCountry.GetRuler.GetFirstName]靠在[ROOT.GetCountry.GetRuler.GetHerHis]沙发上，咬了一口大苹果。每个人都听说过他们；因为阿尔法是第一个......'那么欧米茄是最后一个。你想知道我荣耀的所谓秘密吗？我的人从不退缩，而是始终坚持自己的立场。你怎么说，[ROOT.GetCountry.GetRuler.GetFirstName]？我随着黎明驶向#E 奥多维西亚#! 。你知道我的价格--这是你拥有整个土地上最可怕的雇佣兵公司之一的机会。"
 zorgo_event.61.t:0 "最后一道防线"
 zorgo_event.62.a:0 "我......我不知道为什么这一切会发生在我们身上"
 zorgo_event.62.desc:0 "最近，我们的农民一直在抱怨，他们的奶牛一直在生产酸奶，有大蒜的味道，而且几乎立刻就凝固了--它是如此的刺鼻和肮脏，甚至他们的小牛都不愿意喝它，许多动物正在死亡。这种可怕的现象已经在全国范围内蔓延，虽然[ROOT.GetCountry.GetRuler.GetName]否认，但有人喃喃自语，说一定是某个神被[ROOT.GetCountry.GetAdjective]领导人的某些不明智的行为严重冒犯了。"
 zorgo_event.62.t:0 "一个好奇的发现：酸牛奶"
 zorgo_event.63.a:0 "我太忙了，不能去看无聊的戏剧"
 zorgo_event.63.b:0 "是的，我亲爱的，我们将在前排。"
 zorgo_event.63.desc:0 "一位著名的剧作家今晚将在[ROOT.GetCountry.GetCapital.GetName]首演一部新剧，镇上的人都很兴奋--尤其是在[ROOT.GetCountry.GetRuler.GetPraenomen]的家里，[ROOT.GetCountry.GetRuler.GetSpouse.GetName]已经知道[ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe]非常想参加。真的，这是[ROOT.GetCountry.GetRuler.GetSpouse.GetSheHe]几个月来唯一谈论的事情。"
 zorgo_event.63.t:0 "剧院之夜"
 zorgo_event.64.a:0 "我期待着我们在剧院的下一个夜晚。"
 zorgo_event.64.desc:0 "尽管不想去，但一旦[ROOT.GetCountry.GetRuler.GetName]安顿下来，[ROOT.GetCountry.GetRuler.GetSheHe]真的很喜欢这出戏--位于[ROOT.GetCountry.GetCapital.GetName]市中心的#E 大剧院#! 是一个令人印象深刻的设施，其音响效果是无与伦比的，在这样一个美丽的场所看到高质量的表演是一个神奇的经历，将难以忘记。"
 zorgo_event.64.t:0 "剧院之夜：该剧"
 zorgo_event.65.a:0 "一切都会好起来的，但你必须放松!"
 zorgo_event.65.desc:0 "有一些毫无根据的传言说，一支庞大的野蛮人部落正席卷整个乡村，掠夺、抢劫，并将好的[ROOT.GetCountry.GetAdjective]家园烧成灰烬。虽然[ROOT.GetCountry.GetRuler.GetName]已经向[ROOT.GetCountry.GetCapital.GetName]的人民保证这些故事是无稽之谈，没有什么好害怕的，但城市里的人们却很恐慌。"
 zorgo_event.65.t:0 "野蛮人的传闻"
 zorgo_event.66.a:0 "这些困难时期将会过去，你会看到"
 zorgo_event.66.desc:0 "我们的渔民报告说，他们已经无法像过去几年那样找到很多鱼，许多人开始担心他们将无法养活自己的家人，更不用说还有足够的鱼在市场上出售。[ROOT.GetCountry.GetCapital.GetName]鲜鱼的价格已经变得很离谱，男人为一条大鲭鱼支付一周的工资--你听说过这种事情吗？"
 zorgo_event.66.t:0 "令人失望的收获"
 zorgo_event.67.a:0 "这真是令人费解......我甚至什么都没做"
 zorgo_event.67.desc:0 "[SCOPE.sCharacter('random_dude_advisor').GetName]指责[ROOT.GetCountry.GetRuler.GetName]一些想象中的轻视，现在正在回绝[ROOT.GetCountry.GetRuler.GetFirstName]建立和平的努力。\n\n似乎我们有另一个敌人需要担心。"
 zorgo_event.67.t:0 "伤害的感觉"
 zorgo_event.68.a:0 "你可以离开，但要照顾好自己"
 zorgo_event.68.b:0 "我们需要你在这里，在家里，[SCOPE.sCharacter('heir').GetFirstName]。"
 zorgo_event.68.desc:0 "一天早上，[ROOT.GetCountry.GetRuler.GetName]遇到了[SCOPE.sCharacter('heir').GetName]，他的穿着打扮就像[SCOPE.sCharacter('heir').GetSheHe]正准备离开去做一次长途旅行。[ROOT.GetCountry.GetRuler.GetFirstName]，一个让我和一些值得信赖的同伴一起旅行的机会出现了，我打算去追求它。请您开恩，允许我离开[ROOT.GetCountry.GetName]--在我不得不留在[ROOT.GetCountry.GetCapital.GetName]这里承担我的职责之前，我想亲自看看这个世界。"
 zorgo_event.68.t:0 "渴望冒险"
 zorgo_event.69.a:0 "我将在一两天内带着新的活力和生机回来。"
 zorgo_event.69.desc:0 "尽管统治者的职责几乎耗尽了每天的每一个小时，但仍有一些时刻，尽管它们可能是罕见的，[ROOT.GetCountry.GetRuler.GetName]能够偷闲一天，把[ROOT.GetCountry.GetRuler.GetHerHis]的职责留给明天，退到[ROOT.GetCountry.GetCapital.GetName]郊区的一个小家里，享受一些和平和安静。"
 zorgo_event.69.t:0 "属于我自己的时刻"
 zorgo_event.7.a:0 "我们将尽一切力量惩处那些野人！"
 zorgo_event.7.desc:0 "今早有一件可怕的消息要报告给您，[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]。一群蛮族掠夺了 [temple_province.GetName] 地区，他们趁我们的守卫不备在半夜渡河。这些强盗们不仅抢走了一些金银，更糟糕的是，他们还杀死了一些当地人。我们的民众今天为他们罹难的同胞和失去的财产而哀悼。"
 zorgo_event.7.t:0 "蛮族突袭"
 zorgo_event.70.a:0 "我也很遗憾......发生这样的事情真是太可怕了"
 zorgo_event.70.desc:0 "众所周知，[ROOT.GetCountry.GetAdjective]马是世上最好的马，所以我们偶尔必须对付袭击者和强盗，他们以我们的种马场为目标，希望尽可能多地偷取珍贵的动物为己所用。\n\n很遗憾，我们必须告诉您，[horses_stolen_from_here_scope.GetName]最近就遭受了这样的袭击；一些人丧生，一些珍贵的动物被抢走......我很抱歉，[ROOT.GetCountry.GetRuler.GetName]。"
 zorgo_event.70.t:0 "偷马贼"
 zorgo_event.71.a:0 "我们总是可以在[ROOT.GetCountry.GetName]中使用有经验的战士。"
 zorgo_event.71.desc:0 "今天早上在[ROOT.GetCountry.GetCapital.GetName]附近发生了最奇怪的事情。两支士兵队伍，穿着破烂的盔甲，许多人赤脚行进，护理着被感染的伤口，来到我们首都的门口，乞求庇护。他们说在我们北方发生了一场伟大的战斗，多支军队发生冲突，虽然这些勇敢的战士幸存下来，但他们的国家没有--被敌人彻底摧毁。现在，他们无处可去，正在拼命地寻找一个新的家园。"
 zorgo_event.71.t:0 "来自国外的勇士们"
 zorgo_event.72.a:0 "住在边境附近的人需要坚强起来"
 zorgo_event.72.b:0 "我将带领我们的人与他们作战"
 zorgo_event.72.desc:0 "我们不断听到关于生活在我们[ROOT.GetCountry.GetAdjective]边界之外的野蛮人的报告，他们让我们的人民生活得很痛苦。他们不仅在山区的某个地方建立了一个大营地，而且他们甚至等到我们的军队外出作战时才发动攻击--似乎他们宁愿谋杀无辜的妇女和儿童，而不是像真正的战士那样光荣地战斗。"
 zorgo_event.72.t:0 "野蛮人营地"
 zorgo_event.73.a:0 "前进，你们这些[ROOT.GetCountry.GetName]的人!"
 zorgo_event.73.b:0 "我们将在这里的山脚下扎营，明天进攻"
 zorgo_event.73.c:0 "在[ROOT.GetCountry.GetCapital.GetName]的业务叫我们回家"
 zorgo_event.73.desc:0 "我们已经行军了一个星期，只在这里和那里休息了几个小时，这让我们的人开始感到疲惫--[ROOT.GetCountry.GetRuler.GetName]已经设定了一个不间断的步伐，毫无疑问，这是因为[ROOT.GetCountry.GetRuler.GetSheHe]对离开[ROOT.GetCountry.GetCapital.GetName]陪伴这些战士感到遗憾。首都的事务总是需要微妙的处理，[ROOT.GetCountry.GetRuler.GetFirstName]每天都会收到来自家乡的报告--很明显，[ROOT.GetCountry.GetRuler.GetSheHe]想尽快返回，但我们的战士很疲惫，这一点显而易见。黄昏正悄悄笼罩着传闻中蛮族营地所在地区的峭壁山麓，小雪开始飘落。[ROOT.GetCountry.GetRuler.GetFirstName]的马喘着粗气，在寒冷的山间空气中发出扑扑的蒸汽。"
 zorgo_event.73.t:0 "野蛮人营地：山脚下"
 zorgo_event.74.a:0 "抓住我们的优势！攻击，攻击！前进！"
 zorgo_event.74.desc:0 "尽管我们的人已经筋疲力尽，但在晚上行军被证明是一个明智的行动方案--似乎野蛮人已经发现了我们的部队，并计划在山路上伏击我们。然而，由于[ROOT.GetCountry.GetRuler.GetName]的勤奋，我们已经扭转了局面，让我们的敌人毫无准备，处于分散和无组织状态。看到我们的敌人，我们的人重新振作起来，他们正在向野蛮人的营地冲锋!"
 zorgo_event.74.t:0 "野蛮人营地：伏击"
 zorgo_event.75.a:0 "对于[ROOT.GetCountry.GetName]!Aaaarrrggghhh!"
 zorgo_event.75.desc:0 "男人们的尖叫声把[ROOT.GetCountry.GetRuler.GetName]从[ROOT.GetCountry.GetRuler.GetHerHis]的沉睡中惊醒，本能立即占据了上风--几秒钟之内，[ROOT.GetCountry.GetRuler.GetSheHe]就穿上了盔甲，站在外面，疯狂地扫描着地平线！他们已经包围了我们的营地，并从四面八方逼近--空气中已经弥漫着导弹的味道，当箭矢刺穿[ROOT.GetCountry.GetRuler.GetFirstName]的帐篷的皮革时，发出了尖锐的滋滋声。庆幸的是，我们的守望者看到他们从山坡上下来，能够发出警报，但也只是勉强而已。沉重的马蹄声宣告了敌军的冲锋--战斗一触即发!"
 zorgo_event.75.t:0 "野蛮人营地：夜战"
 zorgo_event.76.a:0 "当然，我将与你决斗!"
 zorgo_event.76.b:0 "我们今天不应该交锋，野蛮人渣"
 zorgo_event.76.c:0 "弓箭手，集中火力攻击迪莫斯！"
 zorgo_event.76.desc:0 "蛮族营地的战斗一直很血腥，双方都进入了熟悉的暴力节奏，很难确定谁在绝望的战斗中占了上风。在中央，[ROOT.GetCountry.GetRuler.GetName]一直在领导前线，在蛮族队伍中砍出一条血淋淋的道路。突然，一个卡尼克斯发出凄厉的声音，一个骑马的身影从野蛮人的人群中走出来--那是他们的领袖，可怕的[SCOPE.sCharacter('barbarian_camp_leader').GetName]。[SCOPE.sCharacter('barbarian_camp_leader').GetFirstName]用长矛指着[ROOT.GetCountry.GetRuler.GetFirstName]，用外语大喊，虽然这些话听不懂，但他们的意思却不明白。"
 zorgo_event.76.t:0 "野蛮人营地：挑战"
 zorgo_event.77.a:0 "Deimos是一个比我最初想象的更难对付的敌人，但我不会放弃。"
 zorgo_event.77.b:0 "你不顾个人安全，疯狂地攻击"
 zorgo_event.77.c:0 "向冥界诸神致以问候，Deimos"
 zorgo_event.77.desc:0 "[SCOPE.sCharacter('barbarian_camp_leader').GetName]向前冲去，用他的剑敲打着他的盾牌，语无伦次地尖叫着。这个野蛮人以与他的体型不相称的速度扑向[ROOT.GetCountry.GetRuler.GetName]，他残忍的刀尖划出了第一道血痕。[ROOT.GetCountry.GetRuler.GetFirstName]退后一步，咒骂道，[ROOT.GetCountry.GetRuler.GetHerHis]心急如焚--没有时间思考了！[ROOT.GetCountry.GetRuler.GetHerHis]在他看来，这是最重要的！"
 zorgo_event.77.t:0 "野蛮人营地：决斗"
 zorgo_event.78.a:0 "摧毁野蛮人营地!"
 zorgo_event.78.desc:0 "所有的目光都集中在[SCOPE.sCharacter('barbarian_camp_leader').GetName]和[ROOT.GetCountry.GetRuler.GetName]身上，他们正处于激烈的战斗中--金属与金属撞击的声音充斥着空气，夹杂着两个战斗人员的呼噜声和呐喊声。[ROOT.GetCountry.GetRuler.GetFirstName]看到了一个机会，他向前冲去，用尽[ROOT.GetCountry.GetRuler.GetHerHis]的力量挥动[ROOT.GetCountry.GetRuler.GetHerHis]的剑。[SCOPE.sCharacter('barbarian_camp_leader').GetFirstName]的头颅立即被切断，飞到空中，伴随着一股壮丽的血流。在这可怕的景象下，野蛮人的阵型崩溃了，我们的[ROOT.GetCountry.GetAdjective]士兵开始不分青红皂白地屠杀附近的人。"
 zorgo_event.78.t:0 "野蛮人营地：结论"
 zorgo_event.79.a:0 "我们将对任何攻击我们人民的人采取同样的做法。"
 zorgo_event.79.desc:0 "如同预期的那样，我们的士兵能够摧毁对抗他们的野蛮人部队——这些野蛮人在战斗中遇到[ROOT.GetCountry.GetName]的人，他们在想什么？\n\n[SCOPE.sCharacter('barbarian_camp_leader').GetName]被发现在战场上蠕动，他的背上有一个深深的长矛伤口，但[ROOT.GetCountry.GetRuler.GetName]没有对这个懦弱的野蛮人领袖表示宽恕，在[ROOT.GetCountry.GetAdjective]军队的众目睽睽之下处决了他。\n\n蛮族的营地在被烧毁之前就被洗劫一空，我们的人开始向[ROOT.GetCountry.GetCapital.GetName]行进，他们的背包里装满了被打败的袭击者的不义之财。"
 zorgo_event.79.t:0 "野蛮人营地：结论"
 zorgo_event.8.a:0 "至少主题很有趣……"
 zorgo_event.8.desc:0 "几天前，两位以齐声合唱而著名的游吟诗人，[SCOPE.sCharacter('bard').GetName] 和 [SCOPE.sCharacter('bard_2').GetName]，到达 [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]，并请求拜见 [SCOPE.GetRootScope.GetCountry.GetRuler.GetName]——如果 [SCOPE.GetRootScope.GetCountry.GetRuler.GetSheHe] 有时间的话。访问的消息由于 [SCOPE.sCharacter('bard').GetFirstName] 和 [SCOPE.sCharacter('bard_2').GetFirstName] 声名鹊然，甚至在他们到达我们首都之前就已经知道了。他们的最新杰作是史诗#E ‘[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的伟大事迹’#!，这几个星期来一直是这儿的热门话题。\n\n两位诗人谦恭地请求表演的机会，今晚晚些时候，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName] 将有幸亲自听到这首名诗被现场朗诵。"
 zorgo_event.8.t:0 "一首献给[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的歌"
 zorgo_event.80.a:0 "我们一定会好好利用这一点。"
 zorgo_event.80.desc:0 "当最后一个野蛮人的碉堡被付之一炬时，[ROOT.GetCountry.GetRuler.GetName]和[ROOT.GetCountry.GetRuler.GetHerHis]顾问们双手抱头站在一旁，被他们的发现吓了一跳。在20个大箱子里发现了大量的金银财宝--这是一笔值得一个国王拥有的财富。他们不仅使[ROOT.GetCountry.GetAdjective]人民摆脱了流浪的威胁，而且还使[ROOT.GetCountry.GetAdjective]国库一下子膨胀起来。"
 zorgo_event.80.t:0 "野蛮人训练营：财富不可估量"
 zorgo_event.81.a:0 "诅咒!"
 zorgo_event.81.desc:0 "我们遗憾地报告，今年的收成将异常糟糕——近来白粉病在[bad_grain_province_scope.GetName]地区肆虐成灾，我们不得不销毁大部分已收割的作物。"
 zorgo_event.81.t:0 "枯萎的作物"
 zorgo_event.82.a:0 "我们不会拿国库做赌注"
 zorgo_event.82.b:0 "没有风险就没有回报，对吗？让我们看看会发生什么"
 zorgo_event.82.c:0 "拨出一笔巨款--我们要发财了"
 zorgo_event.82.desc:0 "一群商人大胆地找到[ROOT.GetCountry.GetRuler.GetName]，要求[ROOT.GetCountry.GetRuler.GetHerHim]拨出国家资金，以便以折扣价格购买没药供应。他们想组建一支私人船队，自己开往港口，如果我们帮助他们，一切顺利，那么我们的钱就能翻倍。你怎么说？"
 zorgo_event.82.t:0 "投资机会"
 zorgo_event.83.a:0 "我早该知道!这事总是发生在我身上"
 zorgo_event.83.desc:0 "好吧，自从带着打折没药的贸易船--这个呈现在我们面前的所谓'惊人的投资机会'--应该回来后，已经过去一年多了，所以可以说，它永远不会回来了。"
 zorgo_event.83.t:0 "投资机会:破灭"
 zorgo_event.84.a:0 "诸神赞美!"
 zorgo_event.84.desc:0 "虽然每个人都在抱怨近乎持续的降雨，但我们的农民却对长达一周的暴雨倾盆而下表示感谢[ROOT.GetCountry.GetCapital.GetName]。我们一直在经历反常的温暖天气，这反过来又导致农作物枯萎，田地干枯--然而，雨水改变了一切。"
 zorgo_event.84.t:0 "近来的大雨[ROOT.GetCountry.GetCapital.GetName]。"
 zorgo_event.85.a:0 "向我展示一两个用剑的技巧"
 zorgo_event.85.b:0 "我更喜欢从远处攻击--弓箭很适合我"
 zorgo_event.85.desc:0 "[ROOT.GetCountry.GetRuler.GetName]获得了与[SCOPE.sCharacter('warrior_trainer').GetName]一起训练的机会，他是一位令人印象深刻的战士，擅长武术战斗的各个方面，并且被称为是一位熟练的老师。\n\n[ROOT.GetCountry.GetRuler.GetFirstName]必须选择这次训练的重点是什么。"
 zorgo_event.85.t:0 "剑还是弓？"
 zorgo_event.86.a:0 "多么令人高兴啊"
 zorgo_event.86.desc:0 "令人难以置信的消息!我们的投资实际上已经得到了回报，为[ROOT.GetCountry.GetName]带来了健康的利润--做得好，[ROOT.GetCountry.GetRuler.GetName]。几天前，满载没药的船只抵达我们的港口，我们已经卖掉了大部分的货物......我们已经赚回了最初的钱，并有了健康的利润来显示我们的麻烦。"
 zorgo_event.86.t:0 "投资机会：蓬勃发展"
 zorgo_event.87.a:0 "多么令人难以置信的消息!"
 zorgo_event.87.desc:0 "令人难以置信的消息!我们的投资实际上已经得到了回报，为[ROOT.GetCountry.GetName]带来了健康的利润--做得好，[ROOT.GetCountry.GetRuler.GetName]。几天前，满载没药的船只抵达我们的港口，我们已经卖掉了大部分的货物......我们正在大赚特赚。"
 zorgo_event.87.t:0 "投资机会：蓬勃发展"
 zorgo_event.88.a:0 "教我如何了解人的思想"
 zorgo_event.88.b:0 "我需要了解诸神的方式......"
 zorgo_event.88.desc:0 "当[ROOT.GetCountry.GetName]为一个年度宗教节日做准备时，[SCOPE.sCharacter('priest').GetName]私下与[ROOT.GetCountry.GetRuler.GetName]接触，提出要与我们的[ROOT.GetCountry.GetRuler.GetTitleName]见面，一起私下祈祷神的继续保佑。[SCOPE.sCharacter('priest').GetFirstName]是一个博学的人物，他以[SCOPE.sCharacter('priest').GetHerHis]对各种哲学的深入了解而闻名，经过一番考虑，[ROOT.GetCountry.GetRuler.GetFirstName]鼓起勇气要求个人帮忙。"
 zorgo_event.88.t:0 "当我有你的耳朵时..."
 zorgo_event.89.a:0 "来吧，大家都来吧!只要记住谁邀请了你"
 zorgo_event.89.desc:0 "为了提高[ROOT.GetCountry.GetRuler.GetHerHis]在群众中的知名度，[ROOT.GetCountry.GetRuler.GetName]宣布一个月后将在[ROOT.GetCountry.GetCapital.GetName]举行一场特殊的战车比赛。将向所有参加比赛的人分发免费面包，并以每杯一个硬币的低价提供加水葡萄酒--这一场面有望成为年度盛事。"
 zorgo_event.89.t:0 "赛场上的一天"
 zorgo_event.9.a:0 "把 [SCOPE.sCharacter('cousin').GetFirstName] 扔进最深的坑埋了吧…现在。"
 zorgo_event.9.desc:0 "最后一刻，我们的探员发现了一项刺杀[SCOPE.GetRootScope.GetCountry.GetRuler.GetName]的阴谋。随着越来越多细节被揭露，丑闻持续扩大，震惊了[SCOPE.GetRootScope.GetCountry.GetCapital.GetName]的居民。\n\n腐败牵连甚深；看来主谋们成功说服了[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]的一名亲属[SCOPE.sCharacter('cousin').GetName]加入他们。事实上，[SCOPE.sCharacter('cousin').GetFirstName]是整个行动的关键，因为他们希望[SCOPE.sCharacter('cousin').GetSheHe]能把[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]带到某个僻静地点，杀手就藏在那里。事实上，[SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]原定明天下午前去拜访……\n\n阴谋败露后，[SCOPE.sCharacter('cousin').GetFirstName]试图在半夜逃跑，希望找到一艘船把[SCOPE.sCharacter('cousin').GetHerHim]带到任何地方，但最终在港口被捕。我们该怎么办？"
 zorgo_event.9.t:0 "阴暗的谋划"
 zorgo_event.90.a:0 "我们没有能力支付任何奢侈的东西"
 zorgo_event.90.b:0 "人民想要的任何东西，他们都会有"
 zorgo_event.90.desc:0 "这是[ROOT.GetCountry.GetCapital.GetName]的大型战车比赛的前一天晚上，整个首都的面包店都挤满了奴隶，他们正在为明天制作面包。[ROOT.GetCountry.GetRuler.GetName]正在亲自监督准备工作，这时一个满脸通红的面包师走了过来，他的外衣上沾满了面粉，扭着他的手。\n\n'我们预计明天会有很多人，比我们原先预计的要多，而且我们的面包有可能会用完。我很抱歉问你，但我们需要更多的供应。"
 zorgo_event.90.t:0 "赛马场上的一天： 前夜"
 zorgo_event.91.a:0 "这一切是多么令人激动啊!"
 zorgo_event.91.desc:0 "当太阳从[ROOT.GetCountry.GetCapital.GetName]上空升起时，城市的街道上已经挤满了成百上千的人，他们都争先恐后地想在市中心的体育场上找到最好的座位。虽然在[ROOT.GetCountry.GetAdjective]首都没有为赛马而建造的永久性建筑，但广场已经清除了商人的摊位，并建造了木质长椅来容纳人群。\n\n当全国最好的骑手穿着他们最好的礼服骄傲地走进广场时，一声声欢呼在人群中荡漾开来。"
 zorgo_event.91.t:0 "赛马场上的一天： 骑手们的到来"
 zorgo_event.92.a:0 "我不赌博，对不起..."
 zorgo_event.92.b:0 "我将配合你的赌注；为什么不呢？"
 zorgo_event.92.desc:0 "一切就绪，离比赛开始还有一段时间，当[ROOT.GetCountry.GetRuler.GetName]感到[ROOT.GetCountry.GetRuler.GetHerHis]的肩膀被轻轻拍了一下。我拿出一百个硬币和你的对赌......我有一种感觉，我喜欢的骑手，阿多尼斯，将会赢。"
 zorgo_event.92.t:0 "赛马场上的一天： 一个友好的赌注"
 zorgo_event.93.a:0 "我不敢相信我赢了!这真是太不可思议了!"
 zorgo_event.93.desc:0 "第一场比赛，即单独骑手之间的比赛，已经结束，虽然直到最后几秒钟都是钉子户，但[ROOT.GetCountry.GetRuler.GetName]喜欢的骑手赢了！[ROOT.GetCountry.GetRuler.GetHerHim]自嘲道，[ROOT.GetCountry.GetRuler.GetFirstName]向空中举起拳头，高兴地大叫。"
 zorgo_event.93.t:0 "赛马场上的一天： 一个友好的赌注"
 zorgo_event.94.a:0 "来得容易，去得也容易......我们总有一天会赚到更多的钱。"
 zorgo_event.94.desc:0 "不言而喻，[ROOT.GetCountry.GetRuler.GetName]选择了字面上最差的骑手，[ROOT.GetCountry.GetRuler.GetFirstName]愤怒地咬着[ROOT.GetCountry.GetRuler.GetHerHis]牙齿，因为冠军阿多尼斯赢得了比赛，驰骋在所有其他骑手面前，夺得胜利的桂冠。"
 zorgo_event.94.t:0 "赛马场上的一天： 一个友好的赌注"
 zorgo_event.95.a:0 "我等不及要再回到赛场了！"
 zorgo_event.95.desc:0 "[ROOT.GetCountry.GetCapital.GetName]的战车赛无疑将载入[ROOT.GetCountry.GetAdjective]的历史，成为首都举办过的最激烈、最精彩的赛事之一；据各方说法，这次活动堪称圆满成功。最令人难忘的是最后一场比赛，冠军阿多尼斯失控，战车以惊险的姿态翻覆，随后被一辆四马战车践踏致死。所有宾客对国家提供的美食和饮品赞不绝口，当地商贩和旅馆老板也因生意兴隆而欣喜若狂。随着夕阳西沉，活动落下帷幕，疲惫却兴奋的[ROOT.GetCountry.GetRuler.GetFirstName]依然沉浸在当天的激动之中，已经迫不及待地盼望着下次重返赛场的时刻，[ROOT.GetCountry.GetRuler.GetSheHe]满怀期待！"
 zorgo_event.95.t:0 "赛马场上的一天： 结语"
 zorgo_event.96.a:0 "我们不惧怕任何人，尤其是[aggressive_neighbor.GetAdjective]狗"
 zorgo_event.96.desc:0 "我们的间谍报告说，[aggressive_neighbor.GetName]一直在集结一支庞大的入侵部队，并一直在探测我们的边界--我们应该准备好我们的人，因为看起来我们可能很快就会有一场战争。这些紧张局势已经使[ROOT.GetCountry.GetCapital.GetName]的价格飙升，不幸的是，因为每个人都在想他们是否应该为围攻做准备。"
 zorgo_event.96.t:0 "边境的紧张局势加剧"
 zorgo_event.97.a:0 "你以为我们不会发现吗？你把我们当做傻瓜吗？"
 zorgo_event.97.desc:0 "我们已经掌握了确凿的证据，证明[aggressive_neighbor.GetName]一直在资助盗匪，在我们的贸易路线上游荡，袭击所有前往[ROOT.GetCountry.GetName]的人。看来他们企图破坏我们的贸易，打击税收收入，并吓阻商人前来[ROOT.GetCountry.GetCapital.GetName]交易。\n\n当我们将这些证据展示给他们的外交官时，他们激烈地予以否认，但我们并不相信这些[aggressive_neighbor.GetAdjective]骗子。"
 zorgo_event.97.t:0 "资助公路匪徒"
 zorgo_event.98.a:0 "他们这样做很好，但不做任何承诺"
 zorgo_event.98.desc:0 "为了赢得[ROOT.GetCountry.GetAdjective]人民的友谊，[friendly_neighbor.GetName]的统治者[friendly_neighbor.GetRuler.GetName]给我们送来了一份礼物和一张手写的纸条，赞扬我们的和谐关系，并要求在涉及到我们的边界地位时保持现状。"
 zorgo_event.98.t:0 "外国礼物"
 zorgo_event.99.a:0 "他们真好......是的，我们会去的。"
 zorgo_event.99.desc:0 "我们收到了来自[friendly_neighbor.GetName]的信息，询问我们是否能在他们的首都[friendly_neighbor.GetCapital.GetName]举行的宗教节日上，让一些官方的[ROOT.GetCountry.GetAdjective]代表为他们提供帮助。[friendly_neighbor.GetAdjective]人正在庆祝他们的丰收，因为他们今年得到了极大的祝福，想把他们的神的赏赐给他们周围的人。"
 zorgo_event.99.t:0 "一个共同敬拜的机会"
 zorgo_gorilla_hide:0 "猩猩皮"
 zorgo_gorilla_hide_desc:0 "一位来自古老土地的旅行者带来了一件奇物；一只可怕野兽的皮，几乎像人类一样的外观。"

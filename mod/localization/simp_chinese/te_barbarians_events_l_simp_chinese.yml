l_simp_chinese:
 te_barbarians.1.a:0 "派我们的上尉去对付他们，并让我们的祭司去献祭。"
 te_barbarians.1.desc:0 "成群结队的日耳曼蛮族已经出现并穿越我们边境的山河。我们不知道他们为什么开始迁徙到我们的领土上，但他们横穿乡村地带造成了严重的破坏，使我们的人民感到恐惧。我们必须阻止他们，或者以某种方式与他们讨价还价！"
 te_barbarians.1.t:0 "多瑙河畔的蛮族"
 te_barbarians.10.a:0 "看来他们是在逃离我们地图之外的荒野中的某种未知的恐怖。"
 te_barbarians.10.desc:0 "成群结队的日耳曼蛮族继续穿过我们边境的山河。我们不知道他们为什么开始迁徙到我们的领土上，但他们横穿乡村地带造成了严重的破坏，使我们的人民感到恐惧。我们必须阻止他们，或者以某种方式与他们讨价还价！"
 te_barbarians.10.t:0 "莱茵河畔的蛮族"
 te_barbarians.11.a:0 "如果他们不能被打败或被收买，那么也许我们可以组成一个联盟？"
 te_barbarians.11.desc:0 "来自日耳曼的强大部落已经组织起来，穿过莱茵河向我们的领土进军。这些人在军事战略的技艺方面有着更好的装备和训练，他们一定是从他们更文明的邻居那里学到的。他们是一个重大的威胁，似乎决心要征服他们所占领的土地。"
 te_barbarians.11.t:0 "法兰克部落的壮大"
 te_barbarians.12.a:0 "我们无法阻止这种大规模移民，但我们必须保护我们自己的人民。"
 te_barbarians.12.desc:0 "来自日耳曼和其他地区的蛮族的浪潮在数量上有所增加，新的部落正在形成，并从以前的部落中分支出来。北部的寒冷天气和东部更远的土地上的一些其他游牧民族的运动，正在推动整片大陆的人民大规模迁移，威胁着我们国度的稳定。"
 te_barbarians.12.t:0 "日耳曼部落迁徙"
 te_barbarians.2.a:0 "这些野人举止怎么样？他们从何而来？为什么他们会在这？"
 te_barbarians.2.desc:0 "匈人是一个游牧民族，在公元4至6世纪期间生活在中亚、高加索地区和东欧。根据欧洲的传说，他们首次被记录居住在伏尔加河以东，在当时属于斯基泰的一个地区。到了公元370年，匈奴人已经抵达伏尔加河。"
 te_barbarians.2.t:0 "匈人出现在伏尔加河畔"
 te_barbarians.3.a:0 "这些来自荒野的野蛮骑手比瘟疫更可怕。"
 te_barbarians.3.desc:0 "公元395年，匈人开始了他们的第一次大规模进攻。这一年的夏天，匈人越过了高加索山脉，而在395年的冬天，另一支匈人入侵部队越过了冰封的多瑙河，掠夺了色雷斯，并威胁着达尔马提亚。对小亚细亚和波斯的攻击规模要大得多，这表明大部分匈人此时仍留在黑海草原上，而不是进入欧洲。匈人对亚美尼亚的袭击在这次突袭后仍在继续，亚美尼亚的资料显示，一个被称为赛兰朵（Xailandur）的匈人部落是作恶者。"
 te_barbarians.3.t:0 "匈人在黑海草原"
 te_barbarians.4.a:0 "我们必须将自己的军事和外交力量转而保护我们的人民以免受这一新祸害。"
 te_barbarians.4.desc:0 "来自东方的蛮族浪潮一直在继续，而且没有停止的迹象。他们嗜血成性，组织严密，接受过军事战争技艺的训练，并掌握了马背上的射箭技术。这些都不是普通的蛮族。我们的军队对追赶他们不断的突袭和掠夺越来越疲惫，他们的一些部队已经深入到文明的土地上，而无助的民众只能眼睁睁地等待或在恐惧中逃跑。"
 te_barbarians.4.t:0 "匈人的力量不断增强"
 te_barbarians.5.a:0 "这些凶恶的战士从东部边疆蜂拥而至，威胁着我们所有人！"
 te_barbarians.5.desc:0 "从公元434年起，阿提拉和布利达兄弟共同统治了匈人。阿提拉和布莱达和他们的叔叔鲁吉拉一样野心勃勃。435年，他们迫使东罗马帝国签署了《马尔古斯条约》，给予匈人贸易权和罗马人的年度贡品。447年，阿提拉入侵了巴尔干和色雷斯。战争于449年结束，在协议中，罗马人同意每年向阿提拉进贡2100磅黄金。451年，阿提拉的军队进入高卢。进入高卢后，匈人首先攻击了梅斯，然后他们的军队继续西进，经过巴黎和特鲁瓦，围攻奥尔良。"
 te_barbarians.5.t:0 "匈人入侵"
 te_barbarians.6.a:0 "我们势不可挡，这些陌生的新入侵者只是一个麻烦事。"
 te_barbarians.6.desc:0 "波斯和印度的统治者逐渐失去了对巴克特里亚的控制，被来自中亚的入侵者所控制，首先是公元335年左右的寄多罗人，然后是公元370年左右的阿尔浑匈人，他们在一个世纪后又入侵了印度，最后是公元450年左右的嚈哒人。"
 te_barbarians.6.t:0 "寄多罗和阿尔浑匈人"
 te_barbarians.60.a:0 "我们的统治地位必须得到权力和力量的保护。"
 te_barbarians.60.desc:0 "骑马的游牧战士部落已经开始从山口外的北部草原入侵我们的领土。人群的迁徙正威胁着我们对该地区的控制。这些入侵者的数量和愤怒绝望的情绪让人感到害怕。"
 te_barbarians.60.t:0 "在山那边的蛮族"
 te_barbarians.7.a:0 "在其他人可能无法阻止这些毁灭大军的地方，我们将取得胜利！"
 te_barbarians.7.desc:0 "在公元460年至470年间，阿尔浑人占领了犍陀罗和旁遮普，这些地方也一直在寄多罗人的控制之下，而笈多帝国仍然在更远的东部。阿尔浑匈人可能只是填补了寄多罗人衰落所造成的权力真空，在他们于公元455年在印度击败塞建陀的笈多帝国，以及随后在公元467年击败卑路斯一世的萨珊帝国后，嚈哒和阿尔浑在梅哈马的帮助下，彻底结束了寄多罗在河中的统治。\n阿尔浑人显然对塔克西拉的佛教寺院和佛塔进行了大规模的破坏，塔克西拉是一座高水平的学术中心，它从未从破坏中恢复过来。几乎所有在塔克西拉地区发现的阿尔浑钱币都是在被烧毁的寺院废墟中发现的，显然一些入侵者在破坏浪潮中与当地的守卫者一起死亡。人们认为，迦腻色伽大佛塔是古代最著名和最高的建筑之一，在公元460年代入侵该地区时被他们摧毁。曼基亚拉佛塔在他们的入侵中也遭到了破坏。"
 te_barbarians.7.t:0 "阿尔浑匈人入侵印度"
 te_barbarians.70.a:0 "这些野人又回来骚扰我们了。没关系，我们强大的军队会粉碎他们！"
 te_barbarians.70.desc:0 "随着他们的崛起，嚈哒人取代了寄多罗人，然后又取代扩张到了犍陀罗和北印度的阿尔浑匈人。公元442年，他们的部落正在与波斯人作战。456-457年，在北魏文帝统治时期，一支嚈哒使团来到中国。到458年，他们已经强大到可以干预波斯。466年左右，他们可能在波斯的帮助下从寄多罗人手中夺取了外兴安岭的土地，但很快又从波斯手中夺取了巴尔赫和库页岛东部的地区。在五世纪下半叶，他们控制了土库曼斯坦的沙漠，一直到里海，可能还有梅尔夫。"
 te_barbarians.70.t:0 "嚈哒人"
